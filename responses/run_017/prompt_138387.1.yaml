answer: |-
  ## Proposal: The Structure of Group Disagreement - Path Dependence, Correlation, and Phantom Consensus in the Epistemology of Peer Disagreement

  **1. Core Question:**  
  How should an agent adjust their credence in a proposition P upon discovering disagreement with a *group* of epistemic peers, where peer opinions exhibit significant causal interdependence (shared training, common influences, mutual consultation), and what specific aggregation rule can avoid the pitfalls of path-dependence, correlated evidence, and phantom consensus that plague simple iterative applications of dyadic (two-person) peer disagreement norms?

  This question is tractable within one year because it focuses narrowly on developing and evaluating a *formal model* for group-level credence adjustment under non-independence, using constrained case studies. It does not seek to resolve the entire conciliationism/steadfastness debate but to address a specific, identifiable gap preventing its progress.

  **2. Why Dyadic Frameworks Fail for Groups:**  
  The dominant conciliationist and steadfast approaches provide clear rules for responding to a *single* disagreeing peer: conciliationism mandates significant credence shift towards the peer's view, while steadfastness permits maintaining one's original credence. The standard method of generalizing to N peers – iterating the dyadic rule sequentially or averaging peer opinions – fails fundamentally in multi-peer contexts for three structural reasons:

  *   **Path-Dependence:** Sequential iteration (adjusting credence towards each peer one-by-one) leads to different final credences depending on the order of encounter. No principled basis exists for privileging one order over another. Simultaneous adjustment via averaging avoids ordering effects but requires choosing an aggregation rule (e.g., simple mean, median). Neither conciliationism nor steadfastness provides a justified basis for selecting this rule or explains how it interacts with their core dyadic principles. The group is treated as an unstructured set, ignoring its internal dynamics.
  *   **Correlation:** Peer opinions are causally interdependent. They share educational backgrounds, foundational texts, methodologies, and often engage in pre-disagreement discussion. Iterative rules or simple averaging treat each peer's opinion as an *independent* piece of evidence, artificially inflating the evidential weight of the group. Collapsing the group into a single "super-peer" testimonial datum ignores the *residual* evidential significance of multiple voices even when correlated, potentially undercounting the evidence. Crucially, the *degree* of correlation depends on the group's causal history (e.g., did they confer before forming opinions?), a factor absent from existing dyadic frameworks.
  *   **Phantom Consensus:** Groups can reach consensus via mechanisms that bypass independent judgment: universal deference to a single authority, shared exposure to the same misleading argument, or groupthink dynamics. In such cases, a large number of agreeing peers provides far weaker evidence for P than the same number of peers who arrived at P independently. Current frameworks, relying on headcounts or iterative applications of dyadic norms, lack the resources to distinguish robust consensus from phantom consensus, mistaking mere numbers for evidential strength.

  These are not minor complications resolvable by tweaking existing models; they are fundamental challenges arising *specifically* from the multi-peer structure and its causal underpinnings, which dyadic theories were never designed to handle.

  **3. Method: Causal Modeling and Constrained Aggregation**  
  Instead of piling intuitions onto hypothetical cases or embedding the problem within frameworks presuming independence (e.g., standard Bayesian models with i.i.d. agents), this project will:

  *   **Develop Formal Causal Models:** Represent the epistemic group as a causal Bayesian network (CBN). Nodes will represent agents, their sources of evidence (shared or private), influential authorities, and communication links. The model will explicitly encode the causal dependencies (correlations) between peer opinions based on their shared history.
  *   **Define Aggregation Rules Sensitive to Structure:** Evaluate candidate aggregation rules for group disagreement that incorporate causal structure:
      *   *Effective Independent Weight (EIW):* Estimate the number of *effectively independent* opinions within the group based on the causal graph's structure (e.g., using d-separation or mutual information metrics).
      *   *Source-Based Adjustment:* Shift credence based on the weight of the *shared foundational sources* driving the consensus, relative to one's own sources and any private evidence.
      *   *Consensus Robustness Test:* Incorporate a check for phantom consensus by modeling the counterfactual: "Would this group likely converge on the same answer if exposed to slightly different initial conditions or arguments?"
  *   **Simulate Critical Cases:** Apply these rules within the CBN framework to canonical problem cases (e.g., a group converging via shared flawed authority vs. a group converging after diverse independent investigations; groups with varying degrees of pre-discussion). Compare the outputs of these structured aggregation rules against naive iteration/simple averaging and assess which best handles path-dependence, correlation, and phantom consensus.

  **Why this approach?** It directly addresses the causal interdependence identified as the core problem. CBNs are designed to model dependencies and path effects. It moves beyond intuition-pumping by providing a rigorous, implementable framework. It avoids the circularity of presupposing independence. Alternatives like adding more dyadic intuitions ignore the structural problem, while standard independent-agent models bake in the very assumption that causes the failure.

  **4. Possible Conclusions, Deciding Factors, and Failure Conditions:**

  *   **Possible Conclusions:**
      *   Conciliationism/Steadfastness can be successfully extended to groups *only* via a specific structured aggregation rule (e.g., EIW) that handles correlation.
      *   No extension is possible; group disagreement is fundamentally different, requiring a new theoretical category.
      *   The best rule prioritizes source evaluation over peer counting.
      *   "Peerhood" itself becomes untenable in highly correlated groups; the concept needs redefinition.
  *   **Deciding Factors:** Success will be judged by whether the proposed rule(s): (1) Eliminate path-dependence in simulated cases; (2) Provide intuitively and formally plausible adjustments that account for known correlation levels; (3) Correctly downgrade phantom consensus compared to robust consensus in simulations; (4) Offer a justifiable procedure distinct from simple iteration/averaging.
  *   **Failure Condition (Strong Sense):** If rigorous modeling demonstrates that *no* non-arbitrary, causally sensitive aggregation rule significantly outperforms simple iteration or averaging across a range of plausible scenarios – meaning the identified structural problems are either unavoidable or do not yield to principled solution – then the project's core premise (that solving the multi-peer case is key to unblocking the debate) is unsupported, and the project would not be worth undertaking as defined. This would indicate the debate's stall lies elsewhere.

  **5. Scope for One Year & Dissertation Deferral:**

  *   **Within Scope (1 Year):**
      1.  Develop the CBN framework for modeling group disagreement causation.
      2.  Formulate 2-3 specific candidate aggregation rules incorporating causal structure.
      3.  Construct and run simulations for 4-5 critical multi-peer scenarios (including path-dependence, correlation gradients, phantom consensus).
      4.  Compare rule performance against dyadic iteration and simple averaging.
      5.  Conclude whether a viable structured aggregation rule exists and what its core features are.
  *   **Deferred to Dissertation:**
      1.  Comprehensive defense of the chosen rule against *all* major objections within the broader peer disagreement literature.
      2.  Full integration of the results into a revised conciliationist or steadfast framework, or development of a novel alternative.
      3.  Exploration of highly complex group structures or real-world case studies.
      4.  Detailed analysis of the implications for the *definition* of peerhood and peer weight.
      5.  Broader epistemological implications beyond disagreement (e.g., testimony, expert deference).

  **Practical Relevance:**  
  The results hold genuine potential for non-philosophers, particularly those convening expert panels (e.g., scientific advisory boards, policy committees). Understanding how correlation and group dynamics affect the evidential weight of consensus is crucial. A deliverable could be a *heuristic framework* (derived from the formal model) to help panel conveners ask: "Is this consensus likely robust (many independent lines converging) or phantom (driven by shared bias or authority)? What does the causal history of their agreement suggest about its weight?" While not providing a precise formula (context matters), it offers a structured way to move beyond naive headcounts. This is a **real deliverable**, directly addressing the core problems of correlation and phantom consensus faced in real-world expert assessment.

  **Framing Check:**  
  Your diagnosis that the multi-peer case is central to the debate's stall is compelling. The path-dependence and correlation objections expose a deep inadequacy in the standard generalization strategy. Phantom consensus highlights a critical flaw in treating peer numbers as straightforward evidence. While other issues exist (e.g., defining peerhood precisely), the structural problems arising when scaling to groups are severe, underexplored, and plausibly fundamental. Tackling this directly offers the best chance of unblocking progress. This proposal focuses squarely on that structural challenge.
