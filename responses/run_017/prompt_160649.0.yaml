  Next, objections. I need to prioritize by likelihood × damage potential. The retributivist will likely attack the "no magnitude" claim—that’s high-stakes. The skeptic will call expressive desert useless; the compatibilist will stress desert’s social role. For each, I’ll craft a 2-minute reply anchored in the theory’s machinery (e.g., "Desert triggers expressive *mode*, but prison length is risk-based"). I must flag where replies are soft, like leaning on unargued intuitions about "dignitarian ceilings."  

  The one reply that *must* land is defending the separation of desert and magnitude. If the retributivist’s "desert sets bounds" objection isn’t shut down, the whole framework collapses. I’ll focus on how conflating them leads to over-punishment.  

