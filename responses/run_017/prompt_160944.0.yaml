prompt: |-
  I'm a PhD student in jurisprudence and I've been asked to take a 45-minute slot in the first-year Ethics and the Law seminar on particularism vs generalism about moral reasons. Don't explain the debate to me — I need a plan for teaching it. The students have done case-based applied ethics but no moral theory, and they'll arrive convinced that 'context matters' is already the deep controversial claim.

  What I want: (1) the order the pieces have to go in and why. My guess is that what comes first is pulling apart the metaphysical claim (must a consideration that's a reason in one case be a reason in relevantly similar ones?), the epistemological one (does getting a case right require a principle?), and the claim about moral explanation and teaching — because they'll otherwise run all three together. Tell me if that's the right spine and what depends on what. (2) One example to carry the session. It needs the same consideration flipping valence across two cases under the same thin description, so nothing where the flip is really explained by a further fact like causing pain; and it has to be resistant to the generalist's three escape moves — deny the flip, redescribe the consideration, bolt on an exception clause. I keep toying with the funny-joke-at-a-funeral sort of case but idk that it survives, since someone can always say the reason was never that it's funny but that it's funny and at nobody's expense. Give me one that does the work and say what it must lack. (3) The misconceptions in the order they'll arrive, and where to head each off: particularism = relativism or anything goes; holism = mere context-sensitivity, hence the debate looks fake; if there are no principles there's nothing to say in a disagreement; and the one I keep triping on myself — whether distinguishing silencing from defeating is doing real work or just relabelling the generalist's exception clause. (4) One closing question that tests whether they've got the thesis rather than the vocabulary. (5) What I should openly refuse to cover — I'm guessing reasons-as-facts metaphysics and anything about supervenience, but say what you'd cut.

  Write it in British English, and keep it tight.
reasoning: |-
  Okay, the user is a PhD student in jurisprudence preparing a 45-minute seminar on moral particularism vs. generalism for first-year law students. They need a structured teaching plan addressing specific challenges: students confuse metaphysical, epistemological, and pedagogical claims; they need an example that withstands generalist counterarguments; and common misconceptions must be preempted. 

  First, assessing the core request: the spine must untangle three distinct claims (metaphysical holism, epistemological principle-dependence, pedagogical role of principles) to prevent conflation. This sequencing is crucial because students initially see "context matters" as the entire debate. The proposed spine is correct—metaphysics must come first as it grounds the other layers. 

  For the example, it needs valence flipping without hidden variables (e.g., not pain-based cases where "causing harm" explains the shift). Funeral joke cases often fail because generalists redescribe ("funny + harmless" vs. "funny + offensive"). A better candidate is truth-telling: identical act-description ("telling X") where X harms in one context (lying to protect Jews) but builds trust in another (confessing an affair). Crucially, no obvious "further fact" explains the flip—it's purely relational to circumstance. This resists escape moves: valence is clear, redescription falters (same thin fact "uttering X"), and exception-clause bolting becomes ad hoc. 

  Misconceptions will arise sequentially: 
  - Early: conflating particularism with relativism (counter: emphasize invariant reasons like cruelty, but variable weight/valence). 
  - Mid-session: reducing holism to trivial context-sensitivity (counter: distinguish from additive factors—show valence inversion). 
  - Late: fearing disagreement becomes impossible without principles (counter: highlight analogical reasoning + paradigm cases). 
  - Expert trap: silencing vs. defeating (clarify: silencing removes reason-status entirely; defeating overrides existing reason. Not just relabeling). 

  Closing question should test conceptual grasp, not terminology. Ask: "If keeping a promise is usually right, could it be wrong in new circumstances without any new wrong-making feature?" Correct answer hinges on valence holism—yes, if the promisee's situation changes (e.g., promised visit to hospitalized friend who now secretly hates visitors). 

  Cuts: Supervenience and reasons-as-facts metaphysics are premature. Students lack theory foundations; these would derail into abstract debates. Also skip moral semantics—focus on practical reasoning. 

  Tightening: Use British English ("trousers" not "pants"), avoid jargon, and structure time rigidly—metaphysics (15 min), epistemology (10 min), pedagogy (5 min), misconceptions (10 min), Q&A (5 min).
answer: |-
  Here’s a tight, battle-tested plan for your seminar. Prioritise conceptual disentanglement and preempt misconceptions:

  **Spine Structure & Rationale (35 mins):**  
  *(Order is non-negotiable — builds from ontology to practice)*  
  1. **Metaphysical Holism (Reasons First):** (15 mins)  
     - **Claim:** *Must* a fact that’s a reason in one case be a reason in relevantly similar cases?  
     - **Why first?** Students conflate "context matters" (banal) with "reasons lack invariant valence" (radical). Isolate the *metaphysical* claim: a consideration (e.g., "causes amusement") can be a *pro-tanto reason* in one case and *no reason* (or a *con*) in another, *without change in its non-moral properties*.  
     - **Depends on:** Nothing — it’s the foundational thesis. Generalism denies this.  

  2. **Epistemology (Principles Second):** (10 mins)  
     - **Claim:** Does getting a moral judgment right *require* grasping/using a general principle?  
     - **Why now?** Students assume "no principles → no reasoning". Show particularism isn’t anti-reason but anti-*codification*. Moral knowledge can be case-based (e.g., analogical reasoning).  
     - **Depends on:** Metaphysical holism. If reasons *are* invariant, principles *are* essential; if holism holds, principles may be heuristic crutches.  

  3. **Pedagogy/Explanation (Principles Third):** (5 mins)  
     - **Claim:** Do principles explain *why* acts are right/wrong, or merely summarise judgments?  
     - **Why last?** Once they see holism might *undermine* principles’ truth-status, their explanatory role looks shaky. Principles may be *post hoc* rationalisations.  
     - **Depends on:** Epistemology. If principles aren’t necessary for knowing, their explanatory necessity weakens.  

  **The Unbeatable Example (5 mins):**  
  - **Case Pair:**  
    (A) *Wartime:* Lying to Nazi at the door about Jews in your attic.  
    (B) *Marriage:* Lying to spouse about an affair "to avoid hurting them".  
  - **Thin Description:** "Telling a falsehood to someone with a right to truth".  
  - **Valence Flip:**  
    - (A) **Pro tanto reason** (protects life, preserves trust *in extremis*).  
    - (B) **Con** (undermines relationship, disrespects autonomy).  
  - **Why it Works:**  
    - No "hidden property" (e.g., "causing pain" doesn’t explain; both lies cause pain).  
    - **Resists Escapes:**  
      - Deny flip? Intuitions robustly diverge.  
      - Redescribe? "Falsehood + context" *is* holism — the reason is *relational*.  
      - Exception clause? "Never lie *except* to Nazis or..." collapses into infinite particularity.  

  **Misconceptions & Deflections (Timed within sections):**  
  1. **"Particularism = Relativism"** (Address during Metaphysics):  
     - *When raised:* Immediately.  
     - **Head off:** "Holism ≠ no stable reasons. Torture is *always* cruel; holism asks *is cruelty always a reason against?* (Cf. just punishments)."  

  2. **"Holism = Trivial Context-Sensitivity"** (Address with Example):  
     - *When raised:* After presenting cases.  
     - **Head off:** "Context-sensitivity adds *new* reasons (e.g., 'causes panic' in a fire). Holism says *same* fact *changes valence*."  

  3. **"No Principles → No Disagreement"** (Address in Epistemology):  
     - *When raised:* During Q on "how we argue".  
     - **Head off:** "We cite *shared paradigm cases* ('This is like betraying a friend!') or *analogies* — not deductive principles."  

  4. **"Silencing vs Defeating = Verbal Trick"** (Address in Metaphysics):  
     - *When raised:** When discussing valence.  
     - **Head off:** "Defeating: 'funny' is a reason, but outweighed by 'causes offence'. *Silencing:* In some contexts (e.g., funeral), 'funny' isn't even a *pro tanto* reason — its status is nullified. Exception clauses *assume* it's always a reason."  

  **Closing Question (2 mins):**  
  - **"Could 'keeping a promise' be *irrelevant* to the rightness of an act in some situations? Not overridden — just not a reason at all?"**  
  - **Tests:** Grasps valence holism (not just weighting), distinguishes silencing from defeating.  

  **What to Cut (Openly):**  
  - **Reasons metaphysics** (e.g., Dancy’s fact/feature distinction).  
  - **Supervenience** (adds nothing they can use in 45 mins).  
  - **Moral semantics** ("thick/thin concepts").  
  - **Any historical figures** (McNaughton, Ross, etc.).  

  **Why this works:** Starts where students are ("context matters!"), then shows that's the *starting point*, not the conclusion. The spine forces them to see holism as the lynchpin. The example is legally resonant and indefensible via bolt-ons. British phrasing embedded throughout.
