  Your friend’s rebuttal: Any decision rule satisfying:  
  1. **Transitivity** (if \(A \succ B\) and \(B \succ C\), then \(A \succ C\)).  
  2. **Strong Stochastic Dominance** (if prospect \(A\) has better outcomes than \(B\) in every state, \(A \succ B\)).  
  3. **Continuity/Sensitivity** (small probability changes don’t abruptly alter preferences),  
