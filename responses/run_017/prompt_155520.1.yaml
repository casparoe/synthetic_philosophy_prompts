  This structure should let characters debate concrete cases while revealing philosophical positions organically. The young woman utilitarian wanting laws for social peace lands on a conservative leaf despite shared framework - perfect dramatic tension.
answer: |-
  Here's a taxonomy structured as a decision tree. Branches are concrete cases/questions, leaves are named positions (or "unnamed"). Anachronistic views marked with **. Awkward commitments and utilitarian viability noted. Bentham's wobble indicated.

  ```
  ROOT: Should consensual, non-procreative sexual conduct (e.g., sodomy) be criminalized?
  │
  ├── (Branch 1) CASE: Involves non-consenting party (incapacity/coercion)?
  │   │
  │   ├── YES → **Structural-Coercion Critique (Feminist)** [ANACHRONISTIC: Post-1840s]
  │   │   │   (Awkward: Must argue all seemingly "private" acts reinforce systemic male power, even absent individual harm.)
  │   │   │   (Utilitarian?: Yes, but redefines "harm" structurally.)
  │   │   │
  │   └── NO → Proceed to Branch 2
  │
  ├── (Branch 2) CASE: Causes DIRECT physical harm (disease, violence) or provable economic damage (theft, fraud)?
  │   │
  │   ├── YES → Standard Harm Principle (e.g., Bentham’s core position on most crimes)
  │   │   │   (Awkward: Must define "direct harm" narrowly; struggles with probabilistic harms like disease risk.)
  │   │   │   (Utilitarian: Core Benthamite view.)
  │   │   │
  │   └── NO → Proceed to Branch 3
  │
  ├── (Branch 3) CASE: Causes SIGNIFICANT, MEASURABLE INDIRECT harm (e.g., demonstrable population decline weakening national security)?
  │   │
  │   ├── YES → Demographic Interventionism (e.g., Physician's view)
  │   │   │   (Awkward: Must criminalize celibacy equally if it causes same demographic harm. Ignores private acts.)
  │   │   │   (Utilitarian?: Technically yes if harms are real/measurable, but Bentham wary of speculative state overreach.)
  │   │   │
  │   └── NO → Proceed to Branch 4
  │
  ├── (Branch 4) CASE: Causes WIDESPREAD DISTRESS/DISGUST among public who become aware (e.g., neighbours find out & are miserable)?
  │   │
  │   ├── YES → Proceed to Branch 5 (Disgust Present)
  │   │
  │   └── NO → Private Liberty (Bentham's stated view on "irregularities")
  │       │   (Awkward: Must tolerate acts many find intuitively abhorrent. Bentham wobbles here re: "social roots".)
  │       │   (Utilitarian: Purest Benthamite position. "No harm, no law".)
  │
  ├── (Branch 5) DISGUST PRESENT: Is the distress PRIMARILY CAUSED by the EXISTENCE OF THE LAW itself (i.e., would disgust vanish if law repealed)?
  │   │
  │   ├── YES → Bootstrapped Disgust Problem (e.g., Young Woman's "Social Peace" view)
  │   │   │   (Awkward: Counts the pain of disgust ONCE, but law's existence creates it. Admits law causes the harm it purports to fix.)
  │   │   │   (Utilitarian: Defensible if net pain of repeal (disgust + perceived social chaos) < net pain of enforcement.)
  │   │   │
  │   └── NO → Disgust as Independent Harm (e.g., Clergyman's view)
  │       │   (Awkward: Criminalizes based on others' subjective feelings. May require criminalizing harmless dietary choices etc.)
  │       │   (Utilitarian?: Contentious. Bentham rejects "capricious antipathy" as justification.)
  │
  ├── (Branch 6) CASE: Harms ONLY the AGENT'S CHARACTER (alleged corruption, sinfulness) with NO other discernible harm?
  │   │
  │   ├── YES → Paternalism/Moral Corruption (e.g., Clergyman's fallback)
  │   │   │   (Awkward: Justifies vast state intrusion into private life. Requires defining "corruption" objectively.)
  │   │   │   (Utilitarian?: Bentham rejects; "sin" isn't harm. Costly enforcement for dubious benefit.)
  │   │   │
  │   └── NO → Proceed to Branch 7
  │
  ├── (Branch 7) CASE: Is ENFORCEMENT ITSELF the PRIMARY SOURCE of SOCIAL HARM (spectacle of punishment, law's corruption via non-enforcement)?
  │   │
  │   ├── YES → **Young Benthamite's Hybrid: Bad Conduct, No Law** (Your Invention)
  │   │   │   (Awkward: Admits conduct is harmful ("bad") yet argues against any legal remedy. Risks anarchy if generalized.)
  │   │   │   (Utilitarian?: Yes - focuses on net utility of enforcement. Unique leaf: empty historically due to instability.)
  │   │   │   (Why Unoccupied?: Unstable - collapses into "Private Liberty" (if conduct not truly bad) or "Bootstrapped Disgust" (if harm is law-dependent). Hard to maintain "bad but unenforceable".)
  │   │   │
  │   └── NO → Proceed to Branch 8 (Celibacy Parity)
  │
  ├── (Branch 8) CELIBACY PARITY: Does lifelong CELIBACY cause EQUIVALENT demographic harm (wasted potential life) as non-procreative acts?
  │   │
  │   ├── YES → **Offense Principle Lite** [ANACHRONISTIC: Post-1950s roots]
  │   │   │   (Awkward: Criminalizing celibacy is absurd, so maybe criminalize neither? But then why criminalize based on disgust?)
  │   │   │   (Utilitarian?: Only if offense/disgust harms are counted heavily and consistently.)
  │   │   │
  │   └── NO → Unnamed - Nobody Here (Incoherent: If demographic harm is the *only* justification, and celibacy causes same harm but is exempt, the principle is arbitrary.)
  ```

  **Key Notes:**

  1.  **Bentham's Wobble:** He lands firmly on **Private Liberty** for consensual, private acts. His engagement with demography is *defensive* - showing that even IF it mattered, the harms are overstated/non-unique (celibacy!), not an affirmative reason to criminalize. He doesn't wobble *to* Demographic Interventionism, he preempts it.
  2.  **Utilitarian Viability:** All leaves *except* **Paternalism/Moral Corruption** are *potentially* utilitarian, depending on empirical claims about harms/benefits. Bentham would reject Disgust as Independent Harm and Paternalism on principle.
  3.  **Blurry Distinctions:**
      *   **"Direct Harm" (Branch 2) vs. "Indirect Harm" (Branch 3):** Is disease risk "direct" or "indirect"? Is economic impact of population decline "direct"? Bentham would lean direct=immediate/intentional.
      *   **"Bootstrapped Disgust" vs. "Young Benthamite's Hybrid":** The Hybrid *could* apply to Bootstrapped Disgust (law causes the harm), but it uniquely extends to conduct the Hybridist concedes is *intrinsically* harmful ("bad") but where enforcement costs dominate. Bootstrapped Disgust focuses *only* on law-created harm.
  4.  **Unnamed/Unoccupied Combinations:**
      *   *Criminalize based ONLY on character corruption (Branch 6 YES):* **Unattractive/Unstable:** Utilitarians reject non-harmful "sin". Clergyman likely combines this with Disgust or Paternalism+God, not alone.
      *   *Believe in demographic harm BUT oppose criminalizing equivalent-harm celibacy (Branch 8 NO):* **Incoherent/Arbitrary:** If the harm is real and the justification, consistency demands equal treatment. Physician wouldn't hold this.
      *   *Count Bootstrapped Disgust TWICE?* **Unnamed - Incoherent:** Would mean law *both* creates the disgust *and* counts its pain as a reason to exist. Circular and self-justifying. Everyone (even Clergyman) would count it once, they just disagree on its origin.
  5.  **Your Young Benthamite's Hybrid:** It's a **genuinely new, unstable leaf** ("Bad Conduct, No Law"). It collapses easily:
      *   If the conduct *isn't* harmful, it becomes **Private Liberty**.
      *   If the *only* "badness" is the law-created disgust, it becomes **Bootstrapped Disgust**.
      *   Defending it requires insisting on *independent* harm (e.g., vague "social fabric", character) *plus* the enforcement cost *always* outweighing remedy benefit. Historically, utilitarians chose consistency: either no independent harm (**Private Liberty**) or the harm justifies *effective* law (**Disgust as Harm** or **Demographic**). The Hybrid tries to have its cake (conduct is bad) and eat it too (no law). It's logically possible but empirically/politically precarious, hence historically empty. Perfect for your radical character!
