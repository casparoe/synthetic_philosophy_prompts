  The user specified 8-10 branches and 9-12 leaves. I map these to their requested cases: consensual secrecy, neighbor disgust, law-dependent disgust, character corruption, non-consent, and celibacy. Adding the modern anachronisms: feminist structural critique (unavailable pre-1840s) and offense principle (post-1950s).

  For Bentham's position, I recall his manuscript explicitly rejects criminalizing private consensual acts. But he engages demographic arguments seriously - hence a leaf where utilitarian calculus might justify intervention for population reasons. His young follower's innovation about spectacle of punishment seems distinct: it accepts conduct might be "bad" but rejects legal remedy due to enforcement costs. That creates a new hybrid leaf.

  Now structuring the tree:
  - Root: "Should this sexual conduct be criminalized?"
  - First branch: "Is there direct harm/non-consent?" (splits off assault/coercion)
  - Second: "Does it risk public harm?" (disease/population)
  - Third: "Does it cause observer distress?" 
  - Crucial fourth: "Does the law itself create that distress?" (bootstrapping problem)
