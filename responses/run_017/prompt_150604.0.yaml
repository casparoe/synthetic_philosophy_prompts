   I. Title and Abstract
   II. Research Question and Background
   III. Unresolved Sub-questions (precisely stated)
   IV. Why Existing Approaches Leave the Question Open
   V. Method: Month-by-Month Plan
   VI. Expected Outcomes and Practical Utility
