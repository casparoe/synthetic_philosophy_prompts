answer: |-
  ## Joint Statement: Adversarial Collaboration on the Church-Turing Thesis (CT)

  **Agreed Claims:**

  1.  **Historical Convergence is Evidentially Significant:** The independent development and subsequent proof of equivalence between diverse formalisms (Turing machines, λ-calculus, general recursiveness, etc.) in the 1930s provides substantial, non-accidental evidence relevant to understanding computation.
  2.  **Conceptual Analysis and Physical Realisation are Distinct Questions:** The question "What does our *concept* of an 'effective procedure' or 'algorithm' entail?" is logically distinct from the question "What functions *can be physically realised* by causal processes in our universe?"
  3.  **CT has a Conceptual Component:** Our pre-theoretic notion of "mechanical computation" possesses sufficient structure that the convergence of formalisms strongly suggests they capture something essential about that concept.
  4.  **CT has a Physical Component:** There is a substantive, non-trivial claim about the physical world implied by the assertion that no physically realisable process can compute a function not computable by a Turing machine. This claim is often termed the "Physical Church-Turing Thesis" (PCTT).
  5.  **PCTT is Not A Priori True:** The PCTT cannot be known to be true solely through conceptual analysis or logical deduction; empirical facts about the physical world are relevant to its truth or falsity.
  6.  **Conceptual CT is Not *Primarily* Empirical:** Determining the extension of our *concept* of "effective procedure" is not settled by discovering new physical processes, though such discoveries might prompt conceptual refinement or shift the subject of discussion.
  7.  **Hypercomputation is Conceptually Coherent:** It is logically possible to define formal systems or imagine physical processes (e.g., involving infinite time, space, or precision) that compute functions beyond the Turing-computable. The debate concerns whether such things *are* genuinely "effective procedures" (A) or *can be physically realised* (B).
  8.  **Conceptual Analysis Aims for Precision:** The goal of analysing concepts like "effective procedure" is to provide a precise, formal characterisation that captures the core, stable meaning implicit in competent usage, distinguishing it from related but distinct notions.

  **Disagreements Table:**

  | Disagreement                                                                                                     | Camp A (Constitutivists)                                                                                                                          | Camp B (Physicalists)                                                                                                                                                                 | Nature of Disagreement                      |
  | :--------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------ |
  | **1. The modal status of the conceptual CT claim.**                                                               | The conceptual analysis establishing that "effective procedure" means *Turing-computable* is necessarily true. Alternative formalisms either misanalyse the concept or define something new. | The conceptual analysis, while strongly evidenced by convergence, reflects contingent facts about human cognition and history. It *could* have been different; its truth is not necessary. | Primarily Conceptual / Modal                |
  | **2. The necessary role of "surveyability" or "explicability" in computation.**                                  | A genuine "effective procedure" must be surveyable: its steps must be finitely describable, locally checkable, and its operation must be fully explicable/predictable in principle by a human following finite rules. | While many computations we design are surveyable, the *capability* of a physical process to reliably compute a function is the core issue. Surveyability is a pragmatic human concern, not a necessary condition for computation itself. | Conceptual (Definition of Computation)      |
  | **3. What constitutes decisive evidence regarding computational limits.**                                         | Evidence about computational limits comes primarily from analysing the *concept* and mathematical equivalence proofs. Physical discoveries inform us about physics, not the meaning of "algorithm". | Physical discoveries, particularly of reliably functioning devices, provide the primary evidence for what is physically computable. Conceptual analysis informs hypotheses but doesn't pre-empt empirical results. | Epistemic (Source of Evidence) / Conceptual |
  | **4. The primary referent and significance of "CT".**                                                            | The core philosophical achievement and subject matter of CT is the successful conceptual analysis of "effective calculability". The PCTT is a derivative, empirical claim. | The core philosophical and scientific significance of CT lies in its claim about the fundamental computational capabilities of the physical universe. The conceptual analysis is a preliminary step. | Focus / Significance                        |

  **Cruxes and Cases:**

  **(i) The Halting Box:**
  *   **Crux:** Does the Halting Box refute the Church-Turing Thesis? If so, which aspect? If not, what claim *does* it refute?
  *   **Camp A Prediction:** The Halting Box does **not** refute the *conceptual* Church-Turing Thesis. It demonstrates a physical process reliably correlating with halting behaviour, but this process is opaque and unsurveyable. It refutes the **Physical CT Thesis (PCTT)** by demonstrating a physical process solving a non-Turing-computable problem. The CT concept of "algorithm" remains untouched; we have a novel physical phenomenon, not a counterexample to the conceptual analysis.
  *   **Camp B Prediction:** The Halting Box decisively refutes the **Physical CT Thesis (PCTT)**. It provides empirical evidence that a physical process can compute a function (halting status) known to be non-Turing-computable. This directly contradicts the claim that Turing machines bound physical computability. The conceptual analysis (CT) remains a historical fact about our *current* concept but is shown not to capture the full scope of physically realisable computation.

  **(ii) The Two Boxes:**
  *   **Crux:** Does the discovery that the Halting Box's reliability was coincidental change the epistemic lesson? What distinguishes "systematic" from "coincidental" reliability in this context, and is this distinction crucial for computation?
  *   **Camp A Prediction:** This discovery **fundamentally changes** the lesson. A genuine computation requires the reliability to be *systematic* – grounded in the process *implementing an algorithm* whose rules explain *why* it outputs correctly. Mere correlation, even perfect and wide-ranging, if coincidental and inexplicable in terms of computational rules, does not constitute computation. "Systematic" entails being surveyable and rule-governed in the constitutive sense. The original box was just a bizarre oracle, not a computer. Camp B's view struggles to distinguish computation from accidental correlations.
  *   **Camp B Prediction:** This discovery **changes the epistemic weight** but not the core lesson about physical possibility. The original box provided strong *prima facie* evidence against PCTT by exhibiting reliable physical behaviour. Discovering the correlation was coincidental undermines the evidence for *that specific device* solving the halting problem *reliably in general*. However, it doesn't change the core claim: a physical process *could* systematically compute beyond Turing machines. For B, "systematic" reliability means consistent, reproducible operation grounded in causal laws, *not* necessarily explicable via human-surveyable algorithmic rules. A true hypercomputer would have reliability grounded in its physical design/laws, not coincidence.

  **(iii) The Lambda-star (λ*) Formalisms:**
  *   **Crux:** Does λ* deserve a place in the "convergence" argument? What distinguishes it from GRF for A? What would B conclude if physics ran on λ*?
  *   **Camp A Prediction:** λ* **does not** deserve a place in the convergence argument for the concept of "effective procedure". Its infinitary limit step violates the core requirement of **finite, immediate, surveyable steps**. While independently motivated, it moves beyond the epistemic constraints (finite mind, finite means) constitutive of *mechanical* computation. GRF, in contrast, builds solely from finitistic, surveyable steps (basic functions, composition, primitive recursion, minimisation). λ* defines "computable *with one infinitary operation*", not "effective" in the pre-theoretic sense captured by CT. Convergence requires capturing the *same* concept, which λ* does not.
  *   **Camp B Prediction:** The convergence argument primarily evidences a robust *mathematical* class, not necessarily the *only possible* or *conceptually necessary* one. λ*'s independent motivation makes it a legitimate formal model, but its divergence from the finitistic models shows it captures a *different kind* of computation. If physics demonstrably ran on processes isomorphic to λ* machines, this would decisively refute the **PCTT**, proving physical processes can compute beyond Turing machines. It wouldn't refute the historical conceptual analysis (CT), but it would show that analysis doesn't exhaust physical possibility. The convergence would then be seen as reflecting historical focus and physical constraints, not conceptual necessity.

  **Closing Section: Verbal and Substantive Disagreements**

  Significant parts of this dispute are **substantive**, not merely verbal:

  1.  **Conceptual Necessity vs. Contingency (Disagreement 1):** Whether the conceptual analysis yielding Turing-computability is necessarily true is a substantive modal disagreement about concepts. Camp A sees it as an analytic or synthetic *a priori* truth; Camp B sees it as contingent on cognitive/linguistic history. This is conceptual/substantive. Settling it definitively is notoriously difficult, as it hinges on the nature of concepts themselves. Progress might involve deeper analysis of "effective procedure" or identifying stable core features across conceptual variation.
  2.  **The Role of Surveyability (Disagreement 2):** Whether surveyability is constitutive of computation is a substantive disagreement about the *definition* and *essential nature* of computation itself. Camp A embeds epistemic constraints (human finitude) into the concept; Camp B separates computational *capability* from human epistemic access. This is conceptual/substantive. It could be clarified by analysing intuitions about novel computational scenarios (like the Two Boxes) or the purpose of the concept.
  3.  **Epistemic Priority (Disagreement 3):** The disagreement over whether physical evidence or conceptual analysis is primary for determining computational *limits* reflects a deeper substantive disagreement about epistemology and the relationship between conceptual schemes and the world. Camp A prioritises conceptual clarity; Camp B prioritises empirical discovery. This is epistemic/substantive. It might be settled by successful prediction and explanation using one approach over the other, or by consensus on what "computational limit" actually refers to.
  4.  **Primary Referent (Disagreement 4):** While partly terminological (focusing on "CT"), this reflects the substantive disagreement over what the *philosophically significant* claim is: the conceptual analysis or the physical limitation. This is substantive regarding the *significance* of the thesis.

  A potential **verbal element** exists around the **scope of the term "computation"**:
  *   Camp A typically reserves "computation" (in the context of CT) for processes satisfying the surveyability constraints inherent in "effective procedure". Wider uses are seen as equivocation.
  *   Camp B uses "computation" more broadly to denote *any* process where a physical system reliably realises a functional input-output mapping, regardless of internal opacity.
  This difference can lead to talking past each other (e.g., "The Halting Box computes!" vs. "No, it doesn't compute, it just correlates!"). Clarifying terminology ("effective computation" vs. "physical computation") helps, but the underlying substantive disagreements (2 & 3) drive the terminological choice.

  **Settlement:** The substantive disagreements concerning conceptual necessity (1) and the definition of computation/surveyability (2) may never be conclusively settled to universal satisfaction, as they touch on foundational philosophy. However, the **Physical CT Thesis (PCTT)** presents a clear target for empirical investigation (as per Crux i). Both camps agree that a verified physical device like the Halting Box (if systematic in B's sense) would refute PCTT. Camp A would see this as revealing a new physical capability distinct from "effective computation," while Camp B would see it as expanding our understanding of computation *itself*. This empirical result would significantly reshape the debate, forcing conceptual refinement or re-evaluation, even if core philosophical differences about concepts remained. The λ* scenario (Crux iii) similarly offers a potential empirical path to challenging PCTT, with predictable, divergent interpretations from each camp.
