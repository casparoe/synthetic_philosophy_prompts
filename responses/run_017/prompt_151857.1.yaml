  We are going through the six moves one by one, evaluating each from clearly mistaken to clearly right, with justification.

  Background: Principal Principle (PP) says that credence in an outcome should equal the objective chance, provided the rest of the evidence is "admissible". Admissible evidence is typically glossed as evidence that bears on the outcome only via the chances.

  The case: A lab rig where the chance of decay at 3pm is set by a dial at noon. The dial is set by a fair coin at 11am, so at 11am the chance is 0.5, and it will become either 0.1 or 0.9. At 11am, a note arrives saying the chance at noon will be 0.9.

  1. Marta's first move:
     - She argues that credence should go to 0.9, but the PP as stated (using the current chance) says 0.5. She points out that the evidence (the note) is about chances and thus should be admissible. But if the PP requires admissible evidence and we don't have a non-circular account of admissibility, then the PP is either false or nearly empty.
     - Evaluation: Marta is right that the PP as stated (without time-indexing) would require 0.5, but that is a problem for the PP. However, her criticism of the circularity of admissibility is valid. But note that Rhys will offer a fix. So this move is partially right but misses that the PP can be fixed. We'll rate it as **partially right, but incomplete** because she is correct about the problem but doesn't consider the fix that Rhys offers.

  2. Rhys's first move:
     - He suggests fixing the PP by time-indexing: we should match the chance that governs the outcome (the chance at noon, which is 0.9) and not the chance at the time of thinking (11am). He says that with this, the note is evidence about the governing chance and we go to 0.9 without needing to invoke admissibility in a circular way.
     - Evaluation: This is a standard move in the literature (Lewis himself later revised the PP to be time-indexed). It resolves the case without circularity. So Rhys is **clearly right** in this move.

  3. Marta's second move:
     - She grants that time-indexing fixes the case for evidence about chances, but argues that the PP still needs to handle evidence about outcomes (like a crystal ball). For such evidence, the only move is to declare it inadmissible and ignore it. But then the content of the PP relies entirely on the distinction between admissible and inadmissible, which is circular if we can't define it non-circularly.
     - Evaluation: Marta has a point. The PP does need to handle inadmissible evidence, and the circularity worry about admissibility remains for cases of direct evidence about outcomes. So this move is **partially right** because it highlights a genuine challenge for the PP.

  4. Rhys's second move:
     - He proposes a non-circular account of admissibility: evidence is admissible iff it is not causally dependent on the outcome (i.e., not downstream of the outcome). The lab note is about a dial setting (upstream) so admissible; a forecaster's report (which tracks the outcome) is inadmissible. He argues that in a genuinely chancy world, you can't have better-than-chance knowledge without going through the chances.
     - Evaluation: This causal account is one common way to define admissibility non-circularly. It does give the principle bite. However, note that causal dependence might not be the only way to have inadmissible evidence (e.g., in non-causal worlds). But in this context, it's a reasonable proposal. So this move is **largely right** and addresses Marta's worry.

  5. Marta's third move:
     - She presents a new case: same rig, but the note says the chance at noon will be 1. She argues that this is admissible (since it's about future chances) but a chance of 1 implies the outcome. So the note gives certainty about the outcome by a route that isn't downstream, and this setup isn't incoherent. Therefore, either Rhys must drop his claim that you can't have foreknowledge (which was the "bite" of the principle) or treat chances of 0 and 1 as special (which is ad hoc).
     - Evaluation: This is a clever case. If the chance is 1, then the outcome is determined. But is the note about the chance being 1 admissible? By Rhys's causal account, the note is about the dial setting (upstream) so it should be admissible. Then the PP would require credence 1. But that does give you foreknowledge. However, Rhys might argue that in a genuinely chancy world, a chance of 1 is only possible if the outcome is determined by the past and the laws, so the note is not giving you information that bypasses the chances. But note: in the setup, the chance is set by a coin flip and then the dial. If the coin flip and dial setting lead to a chance of 1, then the outcome is determined. So the note is giving you information about the setup that determines the outcome. This is still via the chances. Therefore, it doesn't violate the idea that the only channel is the chances. However, Marta is pointing out that this gives you knowledge of the outcome without having to wait. But that's because the chance of 1 implies the outcome must happen. So this is consistent with the PP. Also, note that at 11am, before the note, the chance was 0.5, and after the note (which says chance=1) the PP says to set credence to 1. There's no violation. Therefore, Marta's worry is overblown. But she does have a point that the foreknowledge is achieved without any causal connection to the outcome (except via the chance setup). However, the setup is that the chance of 1 is the cause of the outcome? Actually, the chance of 1 is set by the dial, and that setting causes the decay to happen with certainty. So the note is about the cause. Thus, it is admissible. Therefore, the move by Marta is **partially right in highlighting an edge, but not a refutation**. We'll say **partially right, but not damaging** because the PP can handle it.

  6. Rhys's third move:
     - He responds by saying he will drop the "no foreknowledge" claim partly, but what he needs is that chances are the only channel, and Marta's case runs through chances. He also says that every principle has messy boundaries, and in this case the PP with time-indexing gets you to 1 without needing anything else.
     - Evaluation: Rhys is right that the case is handled by the time-indexed PP. The note gives the chance at noon (which is 1) and that is the chance that governs the outcome. So the PP says set credence to 1. There is no need for an extra explanation. Also, the fact that the note gives foreknowledge is because the chance of 1 implies the outcome is determined. This is consistent with the PP. So Rhys's response is **clearly right**.

  Overall summary of ratings:

  1. Marta (first move): **Partially right, but incomplete** — She correctly identifies a problem with the initial formulation of the PP, but doesn't consider the time-indexing fix.
  2. Rhys (first move): **Clearly right** — Time-indexing resolves the case without circularity.
  3. Marta (second move): **Partially right** — She correctly highlights the remaining challenge of defining admissibility for non-chance evidence.
  4. Rhys (second move): **Largely right** — The causal account of admissibility is a non-circular and substantive proposal.
  5. Marta (third move): **Partially right, but not damaging** — The case of chance=1 is an edge but doesn't break the PP; the PP handles it.
  6. Rhys (third move): **Clearly right** — The time-indexed PP handles the chance=1 case, and the foreknowledge is via the chance.

  Additional note: Both are working with the assumption that the PP is a fundamental principle for rational credence. They are not questioning the existence of objective chance or the overall framework. Also, note that in the chance=1 case, there is a question of whether a chance of 1 is compatible with indeterminism, but that is a deeper metaphysical issue beyond this adjudication.
answer: |-
  ### Analysis of the Six Moves

  **1. Marta's First Move (PP yields 0.5, but we should go to 0.9; admissibility gloss is circular)**  
  *Rating: Partially right, but misses a key fix.*  
  Marta correctly identifies that the naïve PP (using the *current* chance at 11am) prescribes 0.5, which conflicts with the intuitive update to 0.9. Her critique of the circularity in defining "admissible evidence" (evidence bearing on the outcome "only via the chances") is valid — it risks making the PP vacuous. However, she overlooks Rhys' impending time-indexing solution, which resolves this case without leaning on admissibility. Thus, her diagnosis is sound but incomplete.

  **2. Rhys' First Move (Fix via time-indexing: defer to the governing chance at noon, not 11am)**  
  *Rating: Clearly right.*  
  Rhys' solution — indexing the PP to the *governing chance* (the chance at noon, which directly affects the decay) — cleanly handles the case. The note reports the noon chance (0.9), so credence should align with that. This bypasses the need for admissibility here and avoids circularity. Time-relativity is standard in modern chance theories (e.g., Lewis's later work), making this a robust fix for evidence about future chances.

  **3. Marta's Second Move (PP still relies on admissibility for outcome evidence like crystal balls)**  
  *Rating: Largely right.*  
  Marta correctly notes that time-indexing alone doesn't resolve cases with *direct outcome evidence* (e.g., a forecaster or future-text). Here, the PP must label such evidence "inadmissible" to avoid overriding chances, but the boundary between admissible/inadmissible evidence remains murky without a non-circular definition. Her critique exposes a genuine gap: the PP's substance hinges on this distinction, and the "only via chances" gloss remains circular.

  **4. Rhys' Second Move (Causal definition of admissibility: evidence not downstream of the outcome)**  
  *Rating: Partially right, but potentially problematic.*  
  Rhys offers a non-circular account: evidence is admissible iff it isn’t causally downstream of the outcome (e.g., the lab note reports an upstream dial setting; a forecaster’s report tracks the outcome, so it’s downstream). This gives the PP "bite" by forbidding better-than-chance knowledge without chance mediation. However, this causal criterion may not cover non-causal dependencies (e.g., logical or acausal correlations) and assumes a causal universe. It’s a substantive proposal but not universally bulletproof.

  **5. Marta's Third Move (Case where chance=1: admissible evidence implies outcome foreknowledge)**  
  *Rating: Insightful but not fatal.*  
  Marta’s challenge — a note reporting a *future chance of 1*, which implies the outcome — is sharp. It forces a dilemma: either (a) admit that admissible evidence *can* yield foreknowledge (contradicting Rhys' "no better-than-chance" claim), or (b) treat chances of 0/1 as special (ad hoc). While this highlights a boundary issue, it doesn’t break the PP. The note is still "about chances" (admissible per Rhys), and the PP updates credence to 1 legitimately. The "foreknowledge" is derived *through* the chance, so it’s consistent with the spirit of the PP.

  **6. Rhys' Third Move (Chances are the only channel; PP handles chance=1 without residue)**  
  *Rating: Clearly right.*  
  Rhys correctly notes that even in the chance=1 case, the evidence runs through the chances (the dial setting), so it aligns with the PP. The time-indexed PP updates credence from 0.5 (at 11am) to 1 (after the note) without needing extra machinery. He concedes that the "no foreknowledge" claim requires nuance (chance=1 *implies* outcome certainty), but this is a refinement, not a surrender. The case is resolved within the PP framework, preserving its core.

  ### Overall Assessment
  - **Rhys "wins" the exchange** (3 clearly/largely right moves vs. Marta’s 2 partial/largely right moves), as his time-indexing and causal admissibility account robustly address Marta’s cases. Marta’s critiques are valuable for exposing edges (e.g., outcome evidence, chance=1), but Rhys’ fixes hold.
  - **Shared assumptions**: Both accept objective chance and the PP’s normative role. Neither questions whether chance is reducible to credence or whether admissibility *should* be causal. A deeper issue is if chance is fundamentally epistemic, but they assume realism about chance.
  - **Missing element**: Marta’s circularity worry about admissibility (move 3) isn’t fully resolved. Rhys’ causal criterion helps but may not cover all cases (e.g., non-causal correlations). A non-causal approach (e.g., admissibility as *historical* evidence) might complement this.
