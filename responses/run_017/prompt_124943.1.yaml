  The memo store is a global, immutable (during the recursive computation) structure that is built as the computation proceeds. However, note that the nodes are stateless and do not see the global store. How do we reconcile? The memo store can be thought of as being built by the entire system of nodes, but each node only interacts with it via lookups and writes. The store is append-only and shared.

