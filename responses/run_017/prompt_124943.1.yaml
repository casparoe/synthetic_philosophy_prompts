  ### (a) Definition of memoized H
  In proof engineering terms, memoized H can be seen as a recursive function that solves problems by decomposing them into subproblems, but with memoization to avoid redundant computation.

  **Kernel**: The trusted base is the core procedure that, given a question, either:
  - If the question is in the memo store, returns the stored answer (this is a cache hit).
