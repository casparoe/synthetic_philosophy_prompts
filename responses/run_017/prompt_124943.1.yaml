  ### Final Residue Analysis  
  - **Unexpressed in Framework**: The framework cannot model non-deductive aspects of deliberation (e.g., values, retraction, ambiguity). These are inexpressible because proof engineering assumes extensional, monotonic reasoning.  
  - **Debate Unclarity**: The fixed point assumptions (existence/uniqueness) and the determinism requirement are often undefended in H-based proposals. The residue highlights:  
    - H assumes deliberation is well-founded and deterministic—contested in alignment.  
    - It conflates "ideal answering" with "ideal deliberation," a distinction obscured by proof-centric vocabulary.  
  - **Conclusion**: The residue reveals both limitations of the proof engineering analogy (for normative questions) and unexamined premises in H (fixed point well-definedness). Memoized H is a sound model of compositional *factual* question-answering but cannot capture dynamic, value-laden deliberation without silent assumptions.
