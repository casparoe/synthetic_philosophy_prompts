  ## The Longview Capital Allocator Risk Preference Instrument (L-CARI v2.3)

  **Preamble:** Per the Longview Capital Charter §7.1(b) and the Farnsworth-Halpern Continuity Clause, prospective allocators must undergo formal risk attitude calibration to optimize philanthropic impact via Risk-Weighted Expected Utility (RWEU) maximization. This Instrument, developed under the Bostrom-Karnofsky Calibration (2019), establishes your unique `ρ` (rho) parameter, governing the fund's application of the Farnsworth Power Risk Function across its grantmaking portfolio. Your responses determine the curvature applied to value functions when integrating over probability distributions of potential long-term outcomes, ensuring alignment between your normative stance on tail-risk exposure and the fund's operational strategy. Complete all sections accurately.

  ### Section A: Foundational Risk Stance
  *(Select one answer per question)*

  1.  **When considering a potential grant to avert a catastrophe with a 0.0001% probability of causing human extinction within 50 years, your primary concern is:**
      a)  The overwhelming magnitude of the loss, even at that tiny probability.
      b)  The difficulty in reliably distinguishing this specific risk from countless other similarly low-probability existential threats.
      c)  The opportunity cost of diverting resources from higher-probability, near-term interventions with demonstrable impact.
      d)  The possibility that successfully averting this specific risk might inadvertently increase the probability of other, unforeseen existential risks.

  2.  **Imagine a series of coin flips. Flip 1: Heads you gain $1, Tails you lose $0.50. You would:**
      a)  Accept this flip.
      b)  Decline this flip.
      *For subsequent flips, assume you are offered a flip where Heads you gain $1 more than the potential loss from the previous flip you declined, and Tails you lose half the potential gain from the previous flip you declined. Continue this pattern.*
      c)  I would accept Flip 1, but decline at some later flip (e.g., Flip 3, 5, 10...).
      d)  I would decline Flip 1. *(Instrument Note: This establishes baseline local curvature consistency.)*

  3.  **Building on your answer to Question 2, consider Flip N (a very large N) where Heads gains you resources sufficient to permanently increase the fund's annual grantmaking by 500%, and Tails loses you 10% of the fund's current endowment. You would:**
      a)  Accept Flip N. The potential gain justifies the risk, even given my earlier declines.
      b)  Decline Flip N. My consistent aversion to small losses logically extends to avoiding large potential losses, regardless of the upside.
      c)  Accept Flip N. The scale shifts the calculus; small-stakes behavior doesn't constrain large-stakes choices under RWEU.
      d)  This scenario is incoherent; no rational actor would decline all prior flips and accept this one.

  4.  **The fund evaluates a proposal claiming a $10,000 grant has a 1-in-10,000 chance of preventing an existential catastrophe valued at 10^38 utilons (a standard unit of very long-term value). Applying RWEU, you are comfortable with the fund:**
      a)  Funding it readily. The expected value is immense.
      b)  Applying significant probability dampening (e.g., treating the effective probability as far lower) due to epistemic uncertainty.
      c)  Rejecting it based on the Farnsworth-Halpern Continuity Clause, which caps single-grant exposure to tail risks above a defined `ρ`-dependent threshold.
      d)  Demanding collateral evidence orders of magnitude stronger before assigning any non-negligible probability.

  5.  **Regarding the shape of heavy-tailed distributions governing potential long-term impacts (e.g., value locked in per century survived):**
      a)  We possess robust empirical data and theoretical models to accurately parameterize these tails up to relevant percentiles.
      b)  While precise parameterization is impossible, we can establish reasonable upper and lower bounds for `ρ` calibration based on meta-uncertainty distributions.
      c)  Tail behavior is fundamentally unknown; our `ρ` setting reflects a necessary normative prior about worst-case scenarios.
      d)  The actual tail shape is less critical than ensuring portfolio-level ergodicity (long-run survival probability dominates).

  ### Section B: Time, Repetition, and Uncertainty
  *(Select one answer per question)*

  6.  **The fund emphasizes maximizing long-run value across potential futures. You believe the primary safeguard against ruin is:**
      a)  Aggressive probability dampening on catastrophic outcomes in each individual grant decision.
      b)  Strict diversification across independent intervention areas and risk models.
      c)  Setting a global `ρ` parameter sufficiently high to heavily downweight extreme tail outcomes in all evaluations.
      d)  Focusing exclusively on interventions with positive expected value *and* guaranteed non-negative outcomes (per Continuity Clause).

  7.  **Consider a grant with a 60% chance of modestly accelerating beneficial AI development and a 40% chance of causing a minor, recoverable setback. Over many such independent, repeated opportunities:**
      a)  I strongly prefer funding it. The positive expected value compounds over time.
      b)  I am indifferent; repeated play averages out the risk.
      c)  I am cautious; sequences of bad luck could lead to significant cumulative setbacks or absorbing bad states.
      d)  I reject it outright; any non-zero chance of a setback violates the Continuity Clause principle.

  8.  **How significant is model uncertainty (disagreement between plausible models of impact) compared to risk (known probabilities within a model) in longtermist grantmaking?**
      a)  Dominated by risk; robust models constrain probabilities well.
      b)  Significant, but `ρ` calibration inherently incorporates model uncertainty via its dampening effect on low-probability high-impact events.
      c)  Overwhelming; model uncertainty swamps risk, making `ρ` primarily a statement about which model priors we trust.
      d)  Mitigated by the Bostrom-Karnofsky Calibration, which averages over accredited models.

  9.  **The Farnsworth-Halpern Continuity Clause automatically excludes grants exceeding a `ρ`-dependent threshold for the probability of reducing the fund's long-run compound growth rate. You view this clause as:**
      a)  Essential for preventing fanaticism and ensuring perpetual impact.
      b)  A reasonable safeguard against truly ruinous bets.
      c)  Potentially overly restrictive, as it might block some high-EV opportunities crucial for tail-risk mitigation.
      d)  Largely redundant, as a properly set `ρ` already handles this within the RWEU calculation.

  ### Section C: Portfolio Construction & Legacy
  *(Select one answer per question)*

  10. **When allocating between a high-certainty grant saving 10,000 lives now and a speculative grant with a 1% chance of saving 1 billion lives in 200 years, your preferred `ρ` setting would:**
      a)  Strongly favor the near-term, certain grant (high `ρ`).
      b)  Slightly favor the near-term grant (moderate `ρ`).
      c)  Strongly favor the long-term, speculative grant (low `ρ`).
      d)  Be roughly indifferent; RWEU would balance them appropriately based on the probability and discount rate.

  11. **The fund’s ultimate goal is to maximize its contribution to the expected value of the far future. Your greatest concern about this approach is:**
      a)  Underweighting near-term suffering and moral patient interests.
      b)  Overcommitting to speculative, low-probability paths while neglecting robust, known good.
      c)  The inherent impossibility of reliably quantifying value over such scales, making the optimization fragile.
      d)  The potential for `ρ` to be mis-calibrated due to insufficiently conservative priors on tail decay rates.

  12. **Legally, the fund must dissolve in 150 years. How does this affect your `ρ` setting?**
      a)  Significantly; it truncates the relevant future, demanding higher `ρ` (more near-term focus).
      b)  Moderately; it emphasizes interventions with impacts likely realized within the fund's operational horizon.
      c)  Minimally; the fund's actions create path dependencies impacting the long-term future regardless of its dissolution.
      d)  Not at all; the valuation framework (utilons) inherently accounts for the entire future trajectory.

  ---

  **Scoring Rubric (Proprietary Algorithm - Simplified Overview):**
  *   Responses map to `ρ`-adjacent vectors (`α`, `β`, `γ`) via Bostrom-Karnofsky lookup tables.
  *   Question 2d forces `β > β_critical`, triggering a specific branch in the Farnsworth Function.
  *   Question 3 is cross-validated against Question 2 for consistency; inconsistency lowers `γ` (trust score).
  *   Question 4b/c and Question 9a/b/c/d heavily weight the final `ρ` via the Continuity Clause integration module.
  *   Question 11c/d increases the epistemic uncertainty surcharge applied to the base `ρ`.
  *   The final `ρ` is computed as: `ρ_final = f(α, β, γ, survey_version)`.

  **Your Allocator Profile:**
  Based on your responses, your calibrated Rho Parameter (`ρ`) is: **[Insert ρ Value Here]**. This places you within the **[Profile Name: e.g., "Continuity Guardian," "Calibrated Visionary," "Presentist Anchor," "Tailwind Optimizer"]** cohort.

  *   **Impact on Grantmaking:** Your `ρ` signifies a **[e.g., strong / moderate / weak]** aversion to downside tail risk within the RWEU framework. This results in:
      *   Significant dampening of probability weights for outcomes below the `[e.g., 99.9th / 99.99th / 99.999th]` percentile.
      *   **[e.g., Strict / Moderate / Lenient]** application of the Farnsworth-Halpern Continuity Clause.
      *   A portfolio bias towards **[e.g., near-term robustness / medium-term leverage / long-term tail-risk mitigation]** interventions.
      *   An epistemic uncertainty surcharge factor of **[e.g., 1.2x / 1.0x / 0.8x]** baseline.

  **Example:** Client A (ρ = 3.2, "Continuity Guardian") and Client B (ρ = 3.1, "Near-Term Steward") answered nearly identically. However, Client A's marginally higher `ρ` and specific answer to Q4 triggered a stricter Continuity Clause interpretation. Thus, Client A's recommended portfolio allocates 0% to high-risk AGI alignment ventures (>0.1% p(doom)), while Client B's allocates 12%.

  Thank you for completing the L-CARI v2.3. Your `ρ` parameter has been securely stored and will govern the fund's RWEU optimization for your allocated capital share. Re-calibration is recommended biannually or after significant worldview updates.

  ---

  **Afterword: Commitments on the Critique**

  1.  **Fair Hit 1: The Calibration Paradox (Q2 & Q3).** This directly targets the core argument (e.g., Rabin 2000) that modest, consistent risk aversion over small stakes within EU forces absurd, extreme risk aversion over large stakes. RWEU defenders explicitly claim to avoid this by separating risk attitude (`ρ`) from utility curvature, but the parody shows how the questionnaire (like RWEU itself) struggles to reconcile intuitive small-stakes answers (declining Flip 1) with the necessity of accepting large favorable gambles (Flip N), revealing the parameter `ρ` as fundamentally underdetermined by small-scale choices.
  2.  **Fair Hit 2: Probability Reweighting & Pascalian Muggings (Q4 & Q11c).** The parody accurately depicts RWEU's reliance on probability dampening (via `ρ` or the Continuity Clause) to handle Pascal's Mugging. The critique is fair: dampening low probabilities *assumes* the conclusion (that such probabilities shouldn't dominate) without solving the core issue of unbounded utility. It simply replaces one arbitrary cutoff (ignoring tiny probabilities) with another (a specific `ρ`-dependent dampening function), failing to bound the problem if the *value* claim remains astronomically large.
  3.  **Strawman: Treating Tail Uncertainty as Solved (Q5 & Q11d).** The parody presents the fund as believing the tail parameterization is "solved" via `ρ`. This is a slight strawman. Sophisticated RWEU defenders (e.g., Beckstead, Trammell) explicitly acknowledge deep model uncertainty and see `ρ` partly as a normative stance *towards* that uncertainty. They wouldn't claim the tail shape is known, only that *some* explicit stance (`ρ`) is necessary for decision-making under deep uncertainty. The parody exaggerates this into a false confidence ("the guess has been written down").
  4.  **Objection that Survives: The Sequential/Ergodic Problem (Q6, Q7, Q9).** The parody highlights the tension between optimizing a one-shot RWEU and surviving repeated play (ergodicity economics). The Farnsworth-Halpern Continuity Clause is a crude attempt to address this but feels bolted on. This objection survives because maximizing long-run growth rate (e.g., Kelly criterion) under absorbing states genuinely differs from optimizing a static risk-weighted expectation, and RWEU lacks a principled, integrated mechanism to ensure its one-shot `ρ` translates to sustainable long-term growth – the Continuity Clause admission underscores this gap.
