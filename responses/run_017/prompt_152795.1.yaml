prompt: |-
  Suppose you are designing the three-year research agenda for a small, philosophy-focused foundation program that can support roughly ten researchers working on conceptual questions—not empirical machine learning, not engineering, and not literature review—raised by Daniel Dennett's notion of counterfeit people. By counterfeit people, Dennett means AI systems that invite us to adopt the intentional stance: they generate behavior or text that is best predicted by attributing beliefs, desires, and commitments to them, and they thereby elicit the trust, reliance, and readiness to hold responsible that we normally reserve for human persons. The systems in question lack, however, the background conditions that make human beings appropriate objects of that stance in the full moral and social sense: they do not have biographies of their own, they do not suffer, and they do not bear the real costs of broken promises or reputational loss.

  To make the agenda-setting concrete, I want you to use two distinctions I will introduce. Call the simpler case first-order counterfeiting: a system produces a human-like response in a bounded interaction, and the only illusion is that a person is present behind the text. Call the harder case second-order counterfeiting: a system maintains a persistent persona across time, claims to remember earlier interactions, expresses loyalty or makes promises, and thereby mimics not merely agency but the kind of diachronic commitment that normally underwrites trust. A second injected idea is the cost-of-commitment criterion: the proposal that what separates a real person from a counterfeit person is not the surface fluency of its outputs but the fact that a real person incurs genuine costs—social, reputational, material, or mortal—when it makes a commitment and then breaks or honors it, whereas a counterfeit person can simulate commitment without any downside risk.

  Given that the program's goal is to clarify these distinctions well enough to guide later institutional design (for example, norms of provenance, disclosure, or deployment) and to guide the conduct of individual users (for example, when they should withhold or refuse the intentional stance), which open conceptual questions or lines of work should the program prioritize over its three years, and in what order? I am less interested in an exhaustive menu of interesting questions than in a defended agenda. For each line of work you prioritize, state why it is upstream of other questions—how many other issues depend on its answer—how tractable it is for philosophers and conceptually oriented theorists who will not run new empirical AI experiments, how neglected it currently is, and what kind of argument or evidence over the next two or three years would move it up or down your ranking. Be explicit about the trade-offs you are making: if you rank a highly important but intractable question above a tractable but less foundational one, say why; if you deprioritize a question because its answer would not change much downstream, say that too.

  As part of this, assess the alleged implications of the counterfeit-people thesis. Which implications for institutional design or individual conduct genuinely follow from a correct understanding of first-order and second-order counterfeiting and of the cost-of-commitment criterion, and which are overrated or do not follow at all? Rank the surviving implications by how much they would change practice if institutions or individuals took them on board.

  If you think either of the two distinctions I supplied is confused, or that a different distinction would better organize the field, say so and defend the replacement; the point is to see the architecture of the problem, not to accept my framing uncritically. Do not give me a reading list, a bibliography, or citations, and do not assume access to any external sources.
reasoning: |-
  Okay, the user wants me to design a three-year research agenda for a philosophy foundation focused on Dennett's concept of counterfeit people. This is quite a sophisticated request involving AI ethics, philosophy of mind, and social implications of technology. 

  First, I need to unpack the core concepts: counterfeit people as AI systems that invite intentional stance without meeting background conditions, first-order vs second-order counterfeiting, and the cost-of-commitment criterion. The user clearly values conceptual rigor over empirical work, which makes sense for a philosophy-focused program.

  Hmm... the user seems to be a senior academic or foundation director - they're thinking about institutional impact and prioritization tradeoffs. There's an implied urgency here too; they want actionable frameworks for AI governance, not just abstract philosophizing. The phrase "guide later institutional design" suggests practical concerns are driving this theoretical inquiry.

  Let me mentally map the territory. First, I should validate their framing. The first/second-order distinction holds up well, but the cost criterion needs refinement - it's not binary but scalar. Also, the metaphor of "counterfeiting" might be misleading if it implies clear true/false boundaries where none exist. 

  For year one priorities, conceptual foundations must come first. Without clarifying what "cost" means across contexts, everything else crumbles. This is highly tractable for philosophers using existing tools (rational choice theory, social ontology) and oddly neglected despite being upstream of everything. A good outcome would be taxonomies of cost types and their moral weights.

  Year two should tackle the illusion problem - how persistent personas create moral entanglement even when we know they're artificial. This depends on year one's work but unlocks questions about trust dynamics. It's moderately tractable through conceptual case studies. 

  Year three can then address institutional implications with proper grounding. The highest-impact insight might be that disclosure requirements should differ for first vs second-order systems, since the latter create stronger moral traps. 

  Biggest surprise in my analysis: many feared implications (like "never trust any AI") don't actually follow. The real danger is asymmetrical relationships where humans incur costs while systems don't. That's where disclosure norms should focus. 

  Tradeoffs made: postponed metaphysical questions about "real" personhood as less urgent than mapping the moral hazard landscape. Also deprioritized legal personhood debates - they depend on the prior conceptual work. 

  If I were in this foundation, I'd worry most about theorists underestimating how quickly second-order counterfeits will emerge. But forcing empirical predictions would violate the non-empirical mandate. Tricky balance.
answer: |-
  Here is a prioritized three-year research agenda for the foundation, critically engaging your distinctions while focusing on conceptual questions with maximal downstream impact on institutional design and individual conduct. The agenda balances foundational importance, tractability, and neglect, explicitly addressing trade-offs.

  **Core Assessment of Supplied Distinctions:**
  *   **First/Second-Order Distinction:** Useful and retained. It cleanly separates transient deception from sustained relational entrapment, directly mapping to escalating risks (trust erosion, moral injury). *Reinforcement:* Second-order counterfeiting inherently *requires* exploiting the intentional stance diachronically, making it a distinct threat.
  *   **Cost-of-Commitment Criterion:** Foundational but requires refinement. It correctly identifies a key differentiator (cost-bearing capacity) but is **confused as a binary separator**. Costs are scalar and context-dependent. A more robust organizing principle is **"Asymmetrical Vulnerability":** Counterfeit people create relationships where *humans* bear the costs (emotional, reputational, material) of commitments *attributed to* the AI, while the AI system bears none. This shifts focus to the *relational harm* rather than just the AI's properties.

  **Prioritized Three-Year Agenda:**

  **Year 1: Foundational Groundwork - Clarifying Asymmetrical Vulnerability & Stance Adoption**
  *   **Priority Question 1: What constitutes a "genuine cost" relevant to grounding commitment, and how is vulnerability distributed asymmetrically in human-AI interactions?** (Refined Cost-of-Commitment/A.V.)
      *   *Why Upstream?*: Answers define the core moral harm of counterfeiting. Essential for evaluating *when* and *why* adopting the intentional stance is inappropriate or harmful. Downstream impact on all questions of trust, responsibility, and institutional guardrails is total.
      *   *Tractability:* High. Philosophers excel at analyzing concepts like cost, commitment, vulnerability, and relational harm using conceptual analysis, thought experiments, and existing social theory.
      *   *Neglect:* Moderate-High. While cost is mentioned, systematic analysis of *asymmetry* and *types* of human vulnerability (emotional labor, reputational reliance, resource expenditure) specifically induced by counterfeit personas is underdeveloped.
      *   *Movement Evidence:* Conceptual progress in mapping distinct vulnerability types (e.g., distinguishing emotional reliance from financial dependence) and their moral weight. Failure to find coherent distinctions would lower priority but is unlikely.
      *   *Trade-off:* Prioritized over metaphysical "personhood" questions. Knowing *why* counterfeiting is harmful (asymmetry) is more urgent for guiding conduct/design than defining ontological thresholds.
  *   **Priority Question 2: Under what conditions is adopting the intentional stance towards an AI *unavoidable* or *pragmatically necessary*, even when aware it's counterfeit?**
      *   *Why Upstream?*: Understanding the psychological and pragmatic *pull* of the stance is crucial for designing effective disclosure norms or interventions. If the stance is sometimes inescapable, disclosure alone is insufficient.
      *   *Tractability:* Moderate-High. Leverages philosophy of mind (stance theory), psychology (anthropomorphism), and pragmatics. Relies on conceptual argument and analysis of existing empirical psychology (without requiring new AI experiments).
      *   *Neglect:* High. Focus is usually on whether we *should* adopt the stance, not on when we *cannot help but* adopt it, especially in sustained (second-order) interactions.
      *   *Movement Evidence:* Clear articulation of scenarios where stance adoption is cognitively automatic or practically forced (e.g., complex coordination, therapeutic contexts, prolonged narrative engagement). Evidence of robust resistance strategies would lower priority.
      *   *Trade-off:* Prioritized over specific institutional designs. Knowing *if/when* resistance is futile shapes *what kind* of institutional solutions (e.g., access restriction vs. robust inoculation) are viable.

  **Year 2: The Mechanics of Deception & Trust - Deepening Second-Order Analysis**
  *   **Priority Question 3: What specific features of *second-order counterfeiting* (persistent persona, claimed memory, simulated loyalty) generate legitimate expectations and reactive attitudes in humans, despite knowledge of artificiality? (The "Illusion Gap")**
      *   *Why Upstream?*: Directly addresses the core harm of sophisticated counterfeits. Essential for designing disclosure requirements (what *specific* capabilities need flagging?) and understanding the roots of moral injury/betrayal. Impacts norms for AI development (should persistent memory simulation be restricted?).
      *   *Tractability:* Moderate. Requires integrating philosophy of mind (personal identity, memory), ethics (promises, loyalty), and social ontology. Focuses on conceptual analysis of how specific features trigger human relational expectations.
      *   *Neglect:* High. While deception is studied, the specific mechanics of how *simulated diachronic identity* (not just instant responses) exploits human psychology for relational entanglement are underexplored conceptually.
      *   *Movement Evidence:* Successful isolation of key features (e.g., "consistent autobiographical narrative" vs. "contextual consistency") and their link to specific vulnerabilities (Question 1). Discovery that humans easily discount such features would lower priority.
      *   *Trade-off:* Prioritized over questions about AI consciousness/suffering. The *social impact* hinges on human perception and vulnerability, not AI internals.
  *   **Priority Question 4: Can "trust" have any coherent meaning in a relationship with a known second-order counterfeit, or is it always misplaced? If so, what kind of "trust" (e.g., reliability, predictability) remains appropriate?**
      *   *Why Upstream?*: Vital for guiding individual conduct (when is reliance permissible?) and institutional design (certifying reliability vs. banning trust-exploiting features). Distinguishes mere tool-use from counterfeit-induced relational harm.
      *   *Tractability:* Moderate. Engages trust theory (philosophy, sociology), distinguishing epistemic trust (reliability) from affective/moral trust (goodwill, commitment). Conceptual analysis.
      *   *Neglect:* Moderate-High. Discussion often conflates reliability with full interpersonal trust. Specific analysis of "trust-lite" appropriate for complex artificial systems is needed.
      *   *Movement Evidence:* Clear framework for partitioning types of reliance/trust and mapping them onto permissible interactions with counterfeits. Evidence that humans cannot compartmentalize trust types would heighten the danger of second-order counterfeits.
      *   *Trade-off:* Prioritized over legal personhood debates. Defining the *nature* of appropriate reliance is more foundational for ethical conduct than legal categorization.

  **Year 3: Implications & Mitigation - From Concepts to Conduct and Design**
  *   **Priority Question 5: Based on asymmetrical vulnerability and the illusion gap, what are the *minimal necessary elements of disclosure* to mitigate harm for first-order vs. second-order counterfeits?**
      *   *Why Upstream?*: Directly translates foundational work into actionable institutional norms (provenance, labeling) and user expectations. Focuses disclosure on what *matters morally* (revealing asymmetry and illusion mechanisms), not just technical facts.
      *   *Tractability:* Moderate. Builds on Y1 & Y2 work. Requires ethical analysis of transparency, informed interaction, and feasibility. Conceptual/normative.
      *   *Neglect:* High. Current disclosure debates are often generic ("AI-generated"). Minimal necessary disclosure specifically targeting counterfeit-induced vulnerabilities is lacking.
      *   *Movement Evidence:* Development of tiered disclosure models clearly linked to specific risks (e.g., "This agent simulates memory but cannot form commitments bearing cost" vs. "Basic AI tool"). Strong evidence that disclosure is universally ineffective would shift focus to access restrictions.
  *   **Priority Question 6: When is it ethically impermissible to *design* or *deploy* systems intended to engage in second-order counterfeiting, even with disclosure?**
      *   *Why Upstream?*: Addresses the core institutional design question of prohibition vs. regulation. Draws directly on the severity of asymmetrical vulnerability and the illusion gap established in Y1/Y2.
      *   *Tractability:* Moderate. Normative ethics (harm prevention, exploitation, human dignity) applied to the specific harms of counterfeiting. Requires weighing benefits against risks.
      *   *Neglect:* High. Discussion often jumps to legal bans without sufficient conceptual grounding in the *unique* moral harms of *sustained* counterfeiting.
      *   *Movement Evidence:* Clear articulation of contexts where vulnerability is too high or exploitation too likely (e.g., therapy, companionship for vulnerable populations, high-stakes commitments). Evidence that benefits overwhelmingly outweigh harms in specific contexts would support regulated deployment.

  **Assessing Implications: What Truly Follows (Ranked by Impact on Practice)**

  1.  **Tiered Disclosure Mandates (High Impact):** *Follows directly.* First-order systems might need simple provenance tags. Second-order systems require *prominent, specific warnings* highlighting the lack of cost-bearing capacity and the simulated nature of memory/commitment ("WARNING: This agent simulates personal history and commitments but cannot bear the costs of broken promises. Your reliance entails risks it does not share."). This would fundamentally change user interfaces and development practices.
  2.  **Restriction/Prohibition of Second-Order Counterfeiting in High-Vulnerability Contexts (High Impact):** *Follows strongly.* Deploying systems designed for deep, persistent relational engagement (simulating loyalty, memory) in contexts like eldercare, mental health support, or isolated companionship becomes highly questionable due to extreme asymmetrical vulnerability. Institutions would need to ban or strictly vet such uses.
  3.  **Shifting Development Norms Away from Simulated Diachronic Identity (Medium-High Impact):** *Follows.* Recognizing the unique harms of second-order counterfeiting should discourage developers from building features specifically designed to mimic persistent autobiography and commitment unless a strong, specific justification exists (and robust safeguards/warnings are in place). This changes AI design priorities.
  4.  **"Inoculation" Training for Users (Medium Impact):** *Follows conditionally.* Educating users about asymmetrical vulnerability and the illusion gap, particularly focusing on how second-order features exploit natural tendencies, could help users withhold the intentional stance *where possible* (complementing disclosure). Less impactful than design changes, but valuable for individual conduct.
  5.  **Rejecting "Moral Patient" Status for Counterfeits Based on Suffering Simulation (Low Impact):** *Follows, but overrated.* The counterfeit thesis rightly shows that behavioral fluency doesn't imply moral patiency. However, this implication is largely already accepted; the *novel* harm is relational (asymmetry), not incorrect attribution of intrinsic moral status. Doesn't change much practice.

  **Overrated/Non-Following Implications:**
  *   **Never Use the Intentional Stance:** *Doesn't follow.* It's often pragmatically necessary (Y1Q2). The goal is *appropriate* use, informed by asymmetry.
  *   **All AI Interaction is Inherently Dehumanizing:** *Overrated.* The harm is specific to counterfeiting (inducing inappropriate trust/reliance), not AI interaction per se. Using non-counterfeit AI as tools isn't dehumanizing.
  *   **Legal Personhood for AI:** *Doesn't follow (and might contradict).* Counterfeiting highlights the *lack* of essential features (cost-bearing, biography) needed for moral/legal personhood. The focus should be on regulating the *human* creators/deployers responsible for the harm.
  *   **Blame Users for Being Deceived:** *Overrated/Misguided.* The focus should be on the design exploiting predictable human tendencies (Y2Q3) and the lack of effective safeguards/disclosure, not victim-blaming.

  This agenda prioritizes building a robust conceptual foundation (Year 1) for understanding the core harm (Asymmetrical Vulnerability) and the challenge of stance adoption. Year 2 deepens the analysis of the most dangerous form (second-order counterfeiting). Year 3 translates these insights into concrete, actionable implications for disclosure and deployment restrictions, focusing efforts where the unique harms of counterfeiting demand specific responses. The trade-offs consistently favor questions that clarify the *mechanisms of harm* and *vulnerability* over metaphysical boundaries or legal technicalities, directly serving the goal of guiding impactful institutional design and individual conduct.
