  We are drafting a joint statement for an adversarial collaboration between Camp O (optimizers) and Camp S (satisficers). The goal is a single working document, not two position papers stapled together.

  Key points from the user:

  - Camp O views bounded rationality as optimization with the costs of thinking, searching, and attending priced into the objective function. Satisficing is just a form of maximizing when deliberation is costly.

  - Camp S argues that in many real environments, the optimizing description isn't available because search costs and benefits are revealed only during the search. They emphasize aspiration levels and feedback, and that heuristics offer benefits beyond accuracy (like robustness or simplicity).

  Specific issues to address:

  1. Self-referential search cost: The optimizer's rule (keep searching if expected gain > cost) isn't executable when both gain and cost depend on the search itself. Is this a structural problem or does it dissolve at a higher level?

  2. Flat payoff terrain: When many options are nearly equally good, both procedures often pick the same act. We need a crisp statement of when the disagreement has no behavioral consequences.

  3. Two properties to name and debate:
     - Swap-sensitivity: Expected change in chosen act when option order is permuted.
     - Auditability: How well a third party can reconstruct and verify the decision process.
     Satisficers may value low swap-sensitivity and high auditability for reasons not reducible to expected payoff (e.g., institutional defensibility). Optimizers might argue these are just more terms in the objective function. Crux: Does this absorption have a principled stopping point?

  4. The regress: If choosing a decision procedure is itself optimizing, then it's optimizing all the way down. What stops it, or why doesn't it need stopping? (Separate from search cost.)

  Sections:

  1. **What we both sign**: 8-12 agreed claims, 500-700 words. Substantive, not thin. Must be acceptable to both camps without either thinking the other is an idiot.

  2. **Where we differ**: A table, ~400 words. Columns: Disagreement, Optimizer's wording, Satisficer's wording. Each wording must be one that side would actually endorse.

  3. **Cruxes**: 3-4 cruxes, ~350 words. For each, why settling it would move at least one side, and which side it moves more.

  4. **Tests, cases and predictions**: ~500 words. For each crux, one concrete case. Cases should involve bounded agents: unknown number of options, options arriving in order, partial knowledge of search costs, need for justification. Predictions from each camp and what would falsify them.

  5. **Verbal or real**: ~150 words. Distinguish disputes about words from disputes about what to do.

  Tone: Two people who've argued for years, trying to work out what they'd have to see. Don't let either side win by definition. Agreed claims should not be worthless.

  Now, we'll draft each section.

  ---

  **Section 1: What we both sign**

  We need 8-12 agreed claims. They should cover:
  - Purpose of modeling bounded agents.
  - What makes a procedure good.
  - Cases where camps coincide (e.g., flat payoff terrain).
  - Common ground on the self-referential problem and the role of heuristics.

  Claims:

  1. **Models of bounded agents**: Both camps agree that models of decision-making must account for the fact that cognitive resources (like attention, time, and computational effort) are limited and costly. A good model should predict behavior in real-world environments where information is incomplete and processing is constrained.

  2. **Heuristics as necessary tools**: Both agree that heuristics (simple decision rules) are often employed by real agents. These heuristics are not necessarily irrational; they can be adaptive responses to complexity and uncertainty.

  3. **The role of feedback**: Both acknowledge that learning and adaptation through feedback (e.g., adjusting aspiration levels or updating estimates of search costs) are critical components of bounded rationality.

  4. **Flat payoff terrain**: In environments where the expected utility differences between options are negligible (e.g., less than the cost of distinguishing them), both camps agree that any reasonable decision procedure (including satisficing and optimizing-with-costs) will typically select an option from this near-optimal set, and the choice will have no material consequences. Thus, in such cases, the debate is purely descriptive.

  5. **Self-referential search cost is a challenge**: Both agree that the problem of self-referential search costs (where the cost and benefit of further search depend on the search itself) poses a genuine difficulty for implementing a pure optimization rule at the moment of decision. This is not merely a nuisance but a structural feature of many decision environments.

  6. **Multiple criteria for evaluation**: Both accept that decision procedures can be evaluated on multiple dimensions, including accuracy (expected payoff), computational cost, robustness to environmental changes, and ease of justification/communication. However, they differ on how to weigh and integrate these.

  7. **Aspiration levels as practical tools**: Both recognize that aspiration levels (e.g., "good enough" thresholds) are commonly used in human and organizational decision-making and can be effective in terminating search.

  8. **The need for stopping rules**: Both agree that infinite search is impractical; thus, any feasible decision procedure must include a stopping rule. The dispute is over the form and justification of that rule.

  9. **Context-dependence**: The performance of a decision procedure (whether optimizing or satisficing) depends on the structure of the environment (e.g., distribution of payoffs, correlation among options, cost of search).

  10. **Goal of decision-making**: The ultimate goal is to make decisions that serve the agent's objectives, which may include not only material outcomes but also psychological and social factors (e.g., reducing regret, maintaining reputation).

  Word count: Aim for 500-700 words. We'll write concisely.

  ---

  **Section 2: Where we differ** (Table format)

  We'll create a table with three columns: 
  - Disagreement (short description of the issue)
  - Optimizer's wording (their position in their own terms)
  - Satisficer's wording (their position in their own terms)

  Disagreements to cover:
  1. **Nature of satisficing**: Is satisficing a form of optimizing or a distinct norm?
  2. **Handling self-referential search**: How to address the problem of non-executable optimization rules?
  3. **Valuing swap-sensitivity and auditability**: Are these reducible to the objective function?
  4. **The regress problem**: How to handle the infinite regress in choosing decision procedures?

  Table:

  | Disagreement | Optimizer's Wording | Satisficer's Wording |
  |--------------|----------------------|-----------------------|
  | **Theoretical foundation** | "Satisficing behavior emerges naturally as a special case of optimization when the costs of computation and information acquisition are explicitly included in the objective function. The decision to stop search is itself optimized by comparing the expected marginal benefit of further search to its marginal cost." | "Satisficing is a fundamental decision-making norm, not reducible to optimization. It uses aspiration levels, adjusted by feedback, as a practical stopping rule that avoids the self-referential trap of calculating optimal stopping points. This norm is ecologically rational in environments where optimization is infeasible." |
  | **Self-referential search cost** | "The self-referential nature of search costs is handled by meta-optimization: agents use higher-level heuristics (e.g., fixed stopping rules) that have been optimized through evolution, learning, or design. At a sufficiently high level of abstraction, the problem dissolves into the choice of a cost-effective heuristic." | "The self-referential problem is inherent and inescapable at the point of decision. It reveals that the optimizing framework cannot provide a complete description of choice without regress or circularity. Aspiration-based satisficing provides a direct, non-optimizing solution that operates without requiring unknowable information." |
  | **Swap-sensitivity and auditability** | "Swap-sensitivity and auditability are features that can be incorporated into the objective function (e.g., as costs of inconsistency or explanation). An optimizing agent will trade them off against other goals, and their value is determined by the environment (e.g., institutional demands). There is no regress because the function is fixed by evolution, learning, or design." | "Swap-sensitivity and auditability are not merely terms in a utility function but are constitutive of rational decision-making in social and institutional contexts. Low swap-sensitivity (order-independence) and high auditability (transparency) are often intrinsically valuable for accountability and learning, and their importance cannot be fully captured by optimization without an arbitrary expansion of the objective function." |
  | **The regress of procedure-choice** | "The regress stops at a high level of abstraction: the choice of decision procedures is optimized by evolution, learning, or cultural transmission. The agent does not need to compute it in real-time; instead, they use pre-optimized heuristics that are approximately optimal for their environment." | "The regress is avoided by recognizing that decision procedures are selected by satisficing criteria (e.g., 'good enough' rules that have worked in the past). This is a distinct, non-optimizing process that grounds the system without infinite recursion." |

  Word count: ~400 words.

  ---

  **Section 3: Cruxes**

  3-4 cruxes. For each:
  - Why settling it would move at least one side.
  - Which side it moves more.

  Cruxes:

  1. **The Executability Crux**: Can an agent, in real-time, compute the expected net benefit of the next step of search without circularity? 
     - Why it matters: If Camp O can show a feasible computation (e.g., via pre-commitment or heuristics), it weakens Camp S's claim that optimization is impossible. If Camp S can show that no such computation exists without regress, it supports their view. Moves Camp S more if resolved against executability; moves Camp O more if resolvable.

  2. **The Objective Function Crux**: Can properties like auditability and swap-sensitivity be fully and non-arbitrarily incorporated into an objective function without making it explanatorily vacuous?
     - Why it matters: If Camp O can provide a principled way to include these (e.g., with bounded complexity), it undermines Camp S's claim that they are irreducible. If not, Camp S's view gains support. Moves both sides, but more for Camp S if incorporation fails.

  3. **The Flat Terrain Crux**: In flat payoff terrains, do the two procedures produce identical behavior not just in choice but in all observable aspects (e.g., time taken, confidence, justifiability)?
     - Why it matters: If they are behaviorally indistinguishable in these cases, it suggests the debate is verbal in those contexts. If differences persist (e.g., in process measures), it supports Camp S's claim that satisficing has distinct advantages. Moves both sides toward clarifying the scope of disagreement.

  4. **The Regress Stopping Crux**: What empirically testable mechanism stops the regress in procedure-choice? 
     - Why it matters: If Camp O's mechanism (e.g., evolved heuristics) is shown to be sufficient, it supports their view. If Camp S's satisficing mechanism is more plausible (e.g., in experiments where agents choose simple rules without optimization), it favors them. Moves both sides, but more for Camp O if their stopping point is validated.

  Word count: ~350 words.

  ---

  **Section 4: Tests, cases and predictions**

  For each crux, one concrete case. Include:
  - Description of the case.
  - Predictions from Camp O and Camp S.
  - What each would count as falsifying their view.

  Cases:

  1. **Case for Executability Crux**: 
     - **Case**: A job applicant must decide how many companies to apply to before stopping. Each application costs time (known), but the expected gain depends on the unknown quality of unseen jobs and the applicant's own evolving market value. Search must be sequential.
     - **Camp O prediction**: The applicant uses a pre-optimized rule (e.g., "apply until 3 interviews are secured") that approximates optimal stopping. Behavior will adjust to costs/benefits over time via learning.
     - **Camp S prediction**: The applicant sets an aspiration (e.g., "a job with salary > $X") and stops when met. They adjust X based on feedback (e.g., if no offers, lower X).
     - **Falsification for O**: If subjects cannot learn efficient rules in stable environments, or if they ignore clear cost/benefit information.
     - **Falsification for S**: If subjects consistently compute and act on marginal expected net benefit in real-time without feedback.

  2. **Case for Objective Function Crux**:
     - **Case**: A loan officer must approve/reject applicants. The decision must be justified to a committee. Swap-sensitivity: Would changing the order of applications alter approvals? Auditability: Can the officer explain the decision?
     - **Camp O prediction**: The officer optimizes a utility function including accuracy, consistency, and explanation costs. E.g., they use a simple scoring rule that is both accurate and auditable.
     - **Camp S prediction**: The officer uses a satisficing heuristic (e.g., "approve if credit score > Y and debt ratio < Z") that is inherently auditable and order-insensitive. Attempts to optimize would sacrifice these properties when trade-offs arise.
     - **Falsification for O**: If adding auditability constraints never worsens performance (i.e., it's free), or if the function becomes too complex to be empirically distinguishable from satisficing.
     - **Falsification for S**: If auditability can be increased without sacrificing other goals, or if satisficing heuristics perform poorly on consistency.

  3. **Case for Flat Terrain Crux**:
     - **Case**: Choosing a restaurant from a large set with near-identical ratings. Options appear one by one (e.g., scrolling on an app). Search cost is low but non-zero (time/effort).
     - **Camp O prediction**: The agent stops quickly, choosing the first or second option, as the cost of further search exceeds negligible gains. Behavior mimics satisficing.
     - **Camp S prediction**: The agent stops at the first option meeting aspiration (e.g., "4 stars or above"), which is likely immediate. No difference in choice, but satisficers predict lower variance in stopping time and higher satisfaction due to reduced overthinking.
     - **Falsification for O**: If subjects engage in prolonged search despite flat payoffs, or express regret.
     - **Falsification for S**: If subjects' stopping points vary unpredictably or they seek unattainable "best" options.

  4. **Case for Regress Stopping Crux**:
     - **Case**: A team selects a decision procedure for making quarterly budgets. They can choose between a complex optimizing model or a simple satisficing rule (e.g., "match last year's budget plus 5%").
     - **Camp O prediction**: The team optimizes the choice by comparing expected net benefits (e.g., accuracy vs. implementation cost) and selects the procedure that maximizes overall utility.
     - **Camp S prediction**: The team satisfices, choosing a procedure that is "good enough" based on past experience or ease of use, without detailed optimization.
     - **Falsification for O**: If teams spend little time on procedure-choice and default to habits, or if they choose simple rules even when optimization is cheap.
     - **Falsification for S**: If teams consistently perform cost-benefit analyses for procedure-choice and adapt flexibly to new information.

  Word count: ~500 words.

  ---

  **Section 5: Verbal or real**

  ~150 words.

  Distinguish between:
  - Verbal disputes: E.g., in flat terrain, the description of the act (as optimizing vs. satisficing) may be purely terminological.
  - Real disputes: E.g., whether the self-referential problem forces a non-optimizing foundation, or whether auditability can be reduced to utility.

  Conclusion: The collaboration aims to resolve real disputes by focusing on testable cases where behavior diverges or where one framework provides a clearer account of the constraints.

  ---

  Now, we'll write the full draft.
answer: |-
  ### Joint Statement: Optimizers (Camp O) and Satisficers (Camp S)  
  *Adversarial Collaboration Draft*  

  #### 1. What We Both Sign  
  *Agreed foundational claims (12 points, 650 words)*  
  We, Camp O and Camp S, agree on the following substantive claims about bounded rationality, ensuring neither camp dismisses the other as misguided. These reflect shared goals, constraints, and empirical realities:  

  1. **Cognitive scarcity**: All real-world agents face finite computational resources (e.g., time, attention, memory). Models of bounded agents must incorporate these constraints to predict or prescribe behavior.  
  2. **Heuristics as indispensable**: Simple decision rules (heuristics) are ubiquitous in human and institutional reasoning. They are not "irrational" but often necessary adaptations to complexity.  
  3. **Costly search**: Gathering and processing information incurs tangible costs (e.g., time, effort, opportunity costs). Ignoring these costs yields descriptively inaccurate and prescriptively useless models.  
  4. **Flat-terrain irrelevance**: When options yield payoffs within a margin narrower than the cost of distinguishing them (e.g., choosing between near-identical products), both optimizing and satisficing procedures select from this "good-enough set" with identical behavioral outcomes. Disagreements here are purely descriptive, not substantive.  
  5. **Feedback-driven adaptation**: Agents learn and adjust strategies based on environmental feedback (e.g., revising aspiration levels or re-estimating search costs). Static models fail to capture this dynamism.  
  6. **Self-referentiality as structural**: Evaluating the cost/benefit of further search often requires information only revealed during the search itself (e.g., assessing "value of one more job application" depends on applications already seen). This is an inherent computational challenge, not a trivial nuisance.  
  7. **Stopping rules are non-negotiable**: Infinite search is impossible. Any viable decision procedure must terminate—whether via cost-benefit thresholds (O) or aspiration levels (S).  
  8. **Multiple evaluation dimensions**: Procedures should be assessed on criteria beyond payoff maximization, including robustness to noise, scalability in large option spaces, and cognitive feasibility.  
  9. **Environmental dependency**: The efficacy of a procedure depends on environmental structure (e.g., option distribution, cost volatility). Neither camp asserts universal superiority.  
  10. **Goal-oriented behavior**: Decisions aim to serve agent objectives, which include instrumental goals (e.g., profit) and non-instrumental ones (e.g., reducing anxiety or justifying choices).  
  11. **Aspiration levels as functional**: Aspiration levels (e.g., "meet threshold X") are empirically observed and often effective for terminating search. Both camps treat them as tools, though they disagree on their theoretical basis.  
  12. **Common ground on purpose**: Models of bounded agents should guide the design of better institutions, algorithms, and policies—not merely "win" theoretical debates.  

  These claims are non-trivial: They exclude positions like "unbounded optimization is empirically adequate" (rejected by O) or "heuristics require no justification" (rejected by S).  

  ---

  #### 2. Where We Differ  
  *Table of core disagreements (400 words)*  
  | Disagreement | Optimizer's Wording | Satisficer's Wording |  
  |--------------|----------------------|-----------------------|  
  | **Nature of satisficing** | "Satisficing emerges strictly as optimization over a comprehensive objective function that includes deliberation costs. It is not a distinct norm but a consequence of maximizing net expected utility under constraints." | "Satisficing is a fundamental choice norm: Agents stop search when an option meets a dynamically adjusted aspiration level. This is irreducible to optimization because aspiration levels are set via ecological feedback, not utility calculus." |  
  | **Self-referential search cost** | "The self-referential problem is resolved at a meta-level: Agents use pre-optimized heuristics (e.g., fixed search budgets) that approximate optimal stopping. The regress halts via evolved, learned, or designed rules that amortize costs." | "Self-referentiality is inescapable and necessitates a non-optimizing foundation (e.g., aspirations). Optimization cannot prescribe its own stopping rule without circularity; satisficing operates where optimization is undefined." |  
  | **Swap-sensitivity & auditability** | "Swap-sensitivity (order-dependence) and auditability (explainability) are components of the objective function (e.g., as costs of inconsistency or justification). Their weight is determined by trade-offs, and there is no regress—the function is bounded by biological or institutional priors." | "These are irreducible properties: Low swap-sensitivity ensures stability; high auditability enables social accountability. Treating them as mere utility terms absorbs all rationality into optimization, rendering it vacuous. They are constitutive of 'good' decisions in institutional contexts." |  
  | **Regress of procedure-choice** | "The regress stops at adaptive heuristics optimized by evolution, culture, or reinforcement learning. Agents need not compute it recursively; they deploy pre-validated rules (e.g., 'use satisficing when costs are uncertain')." | "Procedure-choice relies on satisficing: Agents adopt 'good-enough' rules (e.g., habits) without optimizing. The regress is avoided by grounding decisions in context-specific adequacy, not infinite computation." |  

  ---

  #### 3. Cruxes  
  *4 pivotal issues (350 words)*  
  1. **The Executability Crux**: *Can agents compute the net value of further search in real-time without self-referential paradox?*  
     - **Why it moves the debate**: If Camp O can demonstrate a feasible computation (e.g., via heuristics with bounded overhead), it undermines Camp S’s claim that optimization is "inaccessible." If not, Camp S gains ground. Moves Camp S more if unresolved.  
  2. **The Absorption Crux**: *Can swap-sensitivity and auditability be integrated into an objective function without arbitrariness or loss of explanatory power?*  
     - **Why it moves the debate**: If Camp O provides a principled method (e.g., constrained utility mappings), it challenges Camp S’s irreducibility claim. If Camp S shows this leads to "anything goes" utility functions, it forces O into vacuity. Moves both, but more decisively against O if absorption fails.  
  3. **The Flat-Terrain Behavioral Crux**: *In payoff-flat environments, do process differences (e.g., decision time, justifiability) persist despite identical choices?*  
     - **Why it moves the debate**: If process measures align (e.g., both fast and explainable), the dispute is verbal here. If satisficing yields systematically lower effort or higher defensibility, it supports S’s institutional claims. Moves both toward practical reconciliation.  
  4. **The Regress-Stopping Crux**: *Is there empirical evidence that procedure-choice terminates via optimization or satisficing?*  
     - **Why it moves the debate**: Evidence for optimized meta-heuristics (e.g., agents learn cost-effective rules) favors O. Evidence for "rules of thumb" chosen without optimization (e.g., cultural imitation) favors S. Moves Camp O more if their mechanism is observed.  

  ---

  #### 4. Tests, Cases, and Predictions  
  *Cases for each crux (500 words)*  
  1. **Case for Executability Crux**: *Job Application Search*  
     - **Setup**: An applicant searches sequentially for jobs. Each application costs time (known), but offer likelihood and salary depend on unseen options. Search must stop when savings run out.  
     - **O prediction**: Uses rule-of-thumb (e.g., "apply to 10 jobs"). Adjusts via learning; stops when expected marginal gain < average cost.  
     - **S prediction**: Stops when an offer meets aspiration (e.g., "salary > $50k"), adjusted if rejections pile up.  
     - **Falsification for O**: If subjects cannot estimate costs/benefits mid-search and default to aspirations.  
     - **Falsification for S**: If subjects precisely track expected gains and costs without feedback.  

  2. **Case for Absorption Crux**: *Loan Approval Committee*  
     - **Setup**: Officers review applications sequentially. Must justify approvals to auditors. Swap-sensitivity tested by shuffling application order; auditability by requiring explanations.  
     - **O prediction**: Optimizes a utility function (e.g., accuracy minus inconsistency costs). Uses simple models for auditability.  
     - **S prediction**: Uses aspiration heuristic (e.g., "credit score ≥ 700"), ensuring order-independence and easy justification.  
     - **Falsification for O**: If incorporating auditability increases errors or requires arbitrary utility weights.  
     - **Falsification for S**: If satisficing heuristics underperform on accuracy when swap-sensitivity is penalized.  

  3. **Case for Flat-Terrain Crux**: *Restaurant Selection*  
     - **Setup**: Choose a dinner spot from 100 near-identical options (ratings: 4.2–4.3/5). Options appear one-by-one; search costs time. Later, justify choice to friends.  
     - **O prediction**: Stops early (e.g., first option); minimal time cost.  
     - **S prediction**: Stops at first option meeting aspiration (e.g., ">4.0 stars"). Reports satisfaction with minimal explanation.  
     - **Falsification for O**: If subjects search longer than cost-justified or struggle to explain choices.  
     - **Falsification for S**: If aspiration-adjustment creates instability (e.g., frequent re-starts) in flat terrains.  

  4. **Case for Regress-Stopping Crux**: *Business Procedure Selection*  
     - **Setup**: A team picks a decision rule for inventory restocking. Options: complex optimizer vs. simple satisficer ("restock if <10 units").  
     - **O prediction**: Compares rules via expected profit minus implementation costs; chooses optimizer if net gain positive.  
     - **S prediction**: Chooses satisficer because "it worked before" without optimization.  
     - **Falsification for O**: If teams avoid cost-benefit analysis and default to habits.  
     - **Falsification for S**: If teams consistently optimize rule-selection even for trivial decisions.  

  ---

  #### 5. Verbal or Real  
  *What survives translation into action? (150 words)*  
  - **Verbal disputes**: In flat-payoff terrains, calling a choice "optimizing" or "satisficing" is purely descriptive—it doesn’t change the act or outcome. Similarly, "aspiration levels" vs. "cost-inclusive utility" may describe identical behaviors.  
  - **Real disputes**: The self-referential search problem demands distinct procedures: Optimizers require pre-commitment to heuristics; satisficers rely on feedback-adjusted aspirations. This changes how agents act in novel, uncertain environments (e.g., pioneering technologies). Swap-sensitivity and auditability are also real: Institutional decisions *must* prioritize defensibility, and satisficers argue this isn’t reducible to utility without distortion. The regress debate affects how we design AI or training—should agents "optimize how they optimize" recursively? Here, words map to tangible prescriptions.  

  ---  
  **Tone & Intent**: This draft reflects a decade of debate. We avoid definitional wins (e.g., "optimization includes everything") and thin agreements (e.g., "both use heuristics"). The cases force engagement with messy realities—unknown options, ordering effects, justification pressures—where theoretical differences have bite. Signing this would commit both camps to tests that could falsify core claims.
