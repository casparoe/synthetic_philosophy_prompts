prompt: |-
  Hi — I keep hiting Simpson's paradox at work (I do analysis for a health service, mostly A/B tests and the odd observational study), and I've noticed my gut verdicts don't add up to anything tidy. Can you find the principle behind them?

  1. Severity-graded treatment: X is given more often to the severe cases. Within both the mild and the severe stratum X beats Y; overall X does worse. I trust the strata — X is the better treatment.
  2. A job-training programme: among completers and among dropouts, attendees do worse; overall attendees do better. Here I think the strata are cheating and the aggregate is the honest number.
  3. An online A/B test where traffic to B was ramped up over the month while conversion rises towards payday: overall B wins, within every week A wins. I go with the weekly strata — A.
  4. A regional reversal that vanishes when I split further by hospital within each region: I don't buy it and fall back on the overall figure. That feels inconsistent with 1, where the reversal survives when I grade severity more finely — but that's the only difference I can put my finger on.
  5. Deciding whether to defund a procedure nationally: it's better in every hospital but worse overall because the worse hospitals use it more. I want different answers for "should this hospital use it?" and "what happens to national numbers if we ban it?" — I can't tell if that's legitimate or just me hedging.

  The one I go back and forth on: stratifying on a genuine pre-treatment risk factor where the reversal only shows up in a stratum of six people. Half of me says ignore it as noise, half says causal structure beats sample size.

  Is there one principle, or a short list, that gets these? State it precisely, say which clause each of my cases motivates, tell me what it predicts for a case I haven't listed, and be straight about which verdicts it can't accommodate. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate the question back at me.
reasoning: |-
  Alright, let me tackle this user's problem. They're dealing with Simpson's paradox in health service analysis, specifically A/B tests and observational studies. They provided several scenarios where their intuitive judgments vary, and they want a unified principle to guide them. 

  First, I need to identify the common thread in their examples. The key seems to be whether the stratification variable is a confounder or a mediator. In scenario 1, severity is a confounder affecting both treatment assignment and outcome. Adjusting for it makes sense. In scenario 2, completing the program is a mediator because attending influences completion, which then affects the outcome. Adjusting for mediators would block the treatment's effect, so the aggregate is more honest. 

  For scenario 3, time is a confounder since both traffic ramp-up and conversion rates change over time. Adjusting for weeks is necessary. Scenario 4 involves regional reversal that disappears with hospital-level splitting. Here, hospital might be a collider or the reversal is due to aggregation bias. The overall figure might be reliable if hospital isn't a true confounder. 

  Scenario 5 requires distinguishing between conditional and unconditional effects. The procedure is effective locally but used more in worse hospitals. The decision depends on the policy question: hospital-level use vs. national ban. 

  The user also mentions a small stratum with a reversal. The principle should prioritize causal structure over sample size, but small samples need careful interpretation. 

  Putting this together, the core principle is whether the stratification variable is a confounder. If yes, adjust; if it's a mediator or collider, don't. Also, the causal question's target (conditional vs. unconditional) matters. This covers most cases but might struggle with unmeasured confounders or complex causal chains. The user needs clear guidelines on identifying confounders vs. mediators, which might involve domain knowledge or DAGs.
answer: |-
  **Bottom line: Prioritize stratified results only if the stratifying variable is a pre-treatment confounder relevant to your causal question; otherwise, the aggregate or alternative adjustment is likely more trustworthy.**

  ### The Core Principle & Its Components:
  1.  **Stratify on *Confounders*, Not *Mediators* or *Colliders*:** Adjust only for variables that causally influence *both* treatment assignment and outcome (confounders). Adjusting for mediators (effects of treatment) or colliders (effects of treatment and outcome) introduces bias.
  2.  **Define Your Causal Target:** Distinguish between the *conditional average treatment effect* (CATE: effect *within* strata) and the *average treatment effect* (ATE: effect on the *whole population*). The ATE requires accounting for how treatment is assigned across strata.
  3.  **Pre-Treatment Timing:** The stratifying variable must be measured *before* treatment assignment or be a fixed characteristic. Post-treatment stratification usually breaks causal interpretation.
  4.  **Sensitivity to Strata Definition:** Aggregation bias (Simpson's reversal) arising from coarse strata that mask heterogeneity is resolved by finer, *causally relevant* stratification. Reversals appearing *only* in arbitrary or overly fine strata are likely spurious.

  ### Your Cases Mapped to the Principle:
  1.  **Severity-Graded Treatment:** *Confounder + Pre-Treatment.* Severity causes both treatment choice (X for severe) *and* outcome. Strata give valid CATEs. **Verdict:** Trust strata (CATEs show X better). *(Motivates 1 & 3)*
  2.  **Job-Training Programme:** *Mediator.* Completion is an *effect* of attending, not a cause of assignment. Stratifying on it blocks the path showing attendees' benefit. **Verdict:** Trust aggregate (ATE). *(Motivates 1)*
  3.  **Online A/B Test (Time):** *Confounder + Pre-Treatment.* Time (week) causes both traffic allocation (ramp-up) *and* conversion rate (payday cycle). Strata give valid CATEs. **Verdict:** Trust weekly strata (CATEs show A better). *(Motivates 1 & 3)*
  4.  **Regional Reversal Vanishing with Hospitals:** *Aggregation Bias Resolved.* The regional strata masked hospital-level confounding or effect heterogeneity. Finer, *causally relevant* (hospital-level) stratification resolved the spurious reversal. **Verdict:** Trust finer strata/hospital-level analysis. *Inconsistent with your fallback; motivates 4 (coarse strata caused bias).*
  5.  **Defunding a Procedure:** *ATE vs. CATE Distinction.*
      *   *"Should a hospital use it?"* = CATE. Trust the *conditional* effect (better in *every* hospital).
      *   *"National ban impact?"* = ATE. Must account for *where* it's used (worse hospitals). Banning removes a beneficial treatment from good hospitals *and* stops harmful overuse in bad ones. The *net* ATE could be negative. **Verdict:** Both answers are legitimate; depends on the causal target (ATE vs CATE). *(Motivates 2)*
  6.  **Small Stratum Reversal:** *Principle Over Noise, But Interpret Cautiously.* If the stratifying variable is a genuine pre-treatment confounder, the reversal reflects a real CATE *in that subgroup*, even if imprecise. However, the *practical significance* for the overall ATE might be negligible. **Verdict:** Don't ignore it *causally*, but recognize the estimate is unstable; its impact on the overall ATE needs weighting. *(Motivates 1 & 3, highlights tension with precision)*

  ### Prediction for a New Case:
  *   **Case:** An observational study finds Drug A has higher mortality than Drug B overall. Splitting by Gender shows A is better for Males and better for Females. Should you trust the strata?
  *   **Prediction:** YES, *if* Gender is a genuine confounder (e.g., influences both disease severity/biology *and* prescribing preferences). The aggregate reversal is spurious due to confounding by Gender. Prioritize the gender-stratified results.

  ### Where the Principle May Struggle:
  1.  **Unmeasured Confounding:** The principle assumes you can identify the *correct* pre-treatment confounders. If key confounders are missing, neither aggregate nor stratified results are reliable.
  2.  **Complex Causal Structures:** Highly interdependent variables (e.g., M-bias, intricate mediation) may require more advanced techniques (e.g., causal diagrams, specific estimators) beyond simple stratification.
  3.  **Extreme Positivity Violations:** If some strata have *no* units receiving one treatment (e.g., no severe cases get Y), estimating a CATE in that stratum is impossible, complicating ATE estimation.
  4.  **Data Quality:** The principle assumes strata are defined accurately and variables are measured correctly. Misclassification can distort stratified results.

  **Your verdicts largely align with causal best practices.** The key distinctions are confounder vs. mediator status (1,2,3), the target estimand (5), and resolving aggregation bias with finer causal stratification (4). The small-stratum case emphasizes trusting structure while acknowledging statistical uncertainty.
