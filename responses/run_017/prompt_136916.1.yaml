answer: |-
  Here’s a precise translation of the problem of universals into your PLT vocabulary, followed by residue analysis and your graded membership case. I flag assumptions and blind spots throughout.

  ---

  ### **1. Positions Restated in PLT Terms**

  - **Ante Rem Realism**  
    Universals are nominal types declared in a global, immutable signature (e.g., `Primitive Type "Red"`). Particulars are tokens inhabiting these types.  
    *Landing*: **Nominal typing** (universals as rigid names).  
    *Distortion*: Realism’s "global signature" implies a fixed, discovered universe hierarchy (unlike PLT’s designed systems). No PLT equivalent for universals existing *uninstantiated*.

  - **In Re Realism**  
    Universals are structural types inferred from particulars. A type `Red` exists iff there is a value `x` satisfying `x: { color: "red" }`.  
    *Landing*: **Structural typing** + **refinement types** (universals as properties).  
    *Distortion*: Realism insists the universal is *one* thing shared; structural typing treats it as multiply realizable with no identity beyond structural equivalence.

  - **Trope Theory**  
    Each particular has a unique **singleton type** (e.g., `Apple₀: { color: "red" }`). "Redness" is an interface (`interface Red { color: "red" }`) implemented by trope singletons.  
    *Landing*: **Singleton types** + **interfaces**.  
    *Distortion*: Tropes are concrete instances; singletons in PLT are still *types*. Resemblance is interface conformance, not primitive.

  - **Resemblance Nominalism**  
    No universal "Red". Instead, a **parametric type** `Resembles<Prototype, Threshold>` where `Prototype` is a specific red object. `x: Resembles<Apple₀, 0.8>` if similarity exceeds threshold.  
    *Landing*: **Structural typing with thresholds** (no nominal universal).  
    *Distortion*: Resemblance is primitive and unanalyzable; PLT implementations would define similarity structurally/code-wise.

  - **Predicate ("Ostrich") Nominalism**  
    "Red" is a predicate function `isRed(x: any): bool`. Typing is **erased** at runtime—no types exist beyond predicates.  
    *Landing*: **Duck typing** + **erasure**.  
    *Distortion*: Denies any ontological commitment; PLT types (even erased) carry design-time meaning.

  - **Sparse vs. Abundant Universals**  
    - *Sparse*: Few nominal types (e.g., only `Color`, not `Red`). Requires **generative** typing (types aren’t inferred from arbitrary properties).  
    - *Abundant*: Every predicate defines a refinement type (e.g., `{ x | isRed(x) }`). Allows **impredicative** type formation.  
    *Landing*: **Type abundance** (sparse ≈ limited primitives; abundant ≈ unrestricted refinements).

  ---

  ### **2. Residue Report**

  #### **(a) Numerical Identity vs. Structural Similarity**  
  - **Realist claim**: The universal `Red` is numerically identical in all red things.  
  - **PLT analog**: Nominal types have identity; structural types have equivalence.  
  - **Translation gap**: PLT has no concept of *strict numerical identity* across tokens. Nominal type names are globally unique but conventional. Structural equivalence is extensional, not identity.  
    - **Verdict**: **Distortion**. Realism’s "one thing shared" has no PLT correlate. PLT smuggles nominalism by reducing identity to naming conventions.

  #### **(b) Discovery vs. Stipulation**  
  - **Realist claim**: Universals are discovered (e.g., `Red` exists independently).  
  - **PLT stance**: Types are stipulated in design (nominal) or inferred from code (structural).  
  - **Translation gap**: PLT assumes types are human-defined tools. Realism’s discovery claim maps to nothing—PLT types lack mind-independent status.  
    - **Verdict**: **Untranslatable**. Your vocabulary quietly assumes anti-realism by treating types as designed artifacts.

  #### **(c) Self-Predication & Third Man as Impredicativity**  
  - **Original worry**: If `Red` is red, we need `Redness` to ground it (infinite regress).  
  - **PLT analog**: Defining a type `T` that quantifies over all types including itself (e.g., `T = ∀X. X → X`). Blocked by predicative hierarchies/universe levels.  
    - **Verdict**: **Translation + Collapse**. The *pattern* matches (infinite regress ≈ universe level errors), but the *content* differs:  
      - Philosophy: Regress shows universals are incoherent.  
      - PLT: Regress is a design flaw avoided by stratification.  
      - **Smuggled assumption**: PLT "solves" this via technical constraints, while philosophy debates coherence.

  ---

  ### **3. Graded Membership Case**

  Your proposal:  
  ```haskell
  x : T  iff  similarity(x, T.prototype) > threshold  
  ```  
  This **approximates resemblance nominalism but fails to capture it** without extra structure.  

  #### **Why?**  
  - Resemblance nominalism requires **resemblance as primitive and ungrounded**. Your `similarity` function implicitly relies on structural features (e.g., color hex codes), collapsing into structural typing.  
  - Tropes need **non-shareable instances**. Graded membership compares to a prototype (a trope?), but thresholds make properties shareable.  

  #### **Extra Structure Needed**  
  1. **Primitive Resemblance**: Add a base type `Resembles` with no definition (like `any`), making similarity irreducible.  
  2. **No Prototypes**: Resemblance nominalism has no "perfect red"—only pairwise resemblance. Replace `T.prototype` with a **resemblance graph** over tokens.  

  #### **Verdict**  
  - Without (1) and (2), your system is **structural typing with fuzzy matching**, closer to prototype theory (a realist-leaning view).  
  - The failure suggests **resemblance nominalism is unstable**: If resemblance can’t be primitive in PLT (where everything is definable), it might not be a genuine alternative.  

  ---

  ### **Blind Spots vs. Question Sharpness**  
  - **Blind spots in your vocabulary**:  
    - Numerical identity (PLT has equivalence, not "oneness").  
    - Mind-independence (PLT types are tools).  
    - Primitiveness (PLT can define almost anything).  
  - **Evidence of unsharpness**:  
    Residues arise because the problem of universals assumes a **metaphysics of presence** (e.g., "redness" must *be* something). PLT rejects this—types are judged by utility, not ontology. The "problem" dissolves when types are tools for reasoning, not cosmic furniture.  

  **Conclusion**: Your vocabulary exposes philosophy’s hidden nominalism. The untranslatable residues (identity, discovery, primitiveness) are artifacts of philosophical framing, not flaws in PLT. Graded membership works pragmatically but can’t "be" resemblance nominalism without smuggling structuralism.
