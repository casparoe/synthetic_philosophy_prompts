prompt: |-
  I'm putting together a problem set for an upper-level seminar on confirmation theory, and I keep running into the same frustration: every example I try for the problem of old evidence either collapses back into the usual chestnut about Mercury's perihelion and general relativity — which half the class has already read about somewhere and can recite — or else it only seems to work because I've quietly smuggled in some fact the agents in the story didn't already have. So I want to build a clean case from scratch and run it against the standard machinery, and I'd like you to design it with me.

  Here is the specification. Construct a short episode — one paragraph, no more — set in some concrete field I can picture (epidemiology, structural engineering, historical linguistics, agricultural science, whatever you like), in which a piece of evidence E is genuinely old: known for decades, in the handbooks, assigned probability 1 by every competent researcher in the field long before the theory H ever appears. Yet E must genuinely and strongly confirm H. Three blocking conditions, because each one is there to kill off a fix my students will propose within thirty seconds: (1) nobody in the story learns any new logical, mathematical, or computational fact — the entailment from H to E is obvious to everyone the moment H is stated, so no confirmation can be squeezed out of conditionalizing on "H implies E"; (2) E is not the sort of thing one can suppose away — under every live rival theory on the table at the time, E was antecedently very probable anyway, so the maneuver of asking how surprised you would have been by E had H been false comes out low-surprise across the board and discriminates between nothing; (3) H is not reverse-engineered to fit E — it is proposed for independent reasons, and accommodating E is a bonus rather than its motivation. I want the pull of the intuition to be strong and unembarrassed, the sort of thing a working researcher would say out loud at a conference, not a contrivance only a philosopher would defend. No omniscient agents, no ideal reasoners, no science fiction: a lab, a field site, an archive, or a data set.

  Then do the work on the case. Assign rough credences yourself and flag them as your own stipulations, and show what each of three approaches actually delivers and why: first, straight Bayesian conditionalization on E; second, the fix that says what you really learn is not the datum but the logical fact that H entails it; third, the counterfactual fix, where you ask what your credence in E would have been had you not known it and had H been false. My expectation is that all three deliver approximately nothing, or the wrong verdict, given the blocking conditions — but demonstrate that rather than asserting it. After that, isolate the single feature of the case that is really carrying the confirmatory weight, show that the confirmation evaporates if you remove that feature while holding everything else fixed, and say which of the three approaches, if any, can be patched to capture it and what the patch costs. Finally, since I will get pushback in seminar: give me the strongest version of the objection that there is no genuine problem here — that once the agents' total evidence is described properly, or the space of hypotheses is re-cut in the right way, ordinary Bayesian updating returns the right answer and my case only looks like a counterexample because I set up the partition badly — and then tell me honestly whether that objection defeats the case or merely relocates the difficulty. If you think the three blocking conditions cannot be jointly satisfied by any case in which confirmation is real, say so explicitly, tell me which condition you would relax and why, and give the best example you can under the relaxed version. Please write your answer in American English.
reasoning: |-
  We are going to design a case in structural engineering. The field is concrete and easy to picture.

  **The Case:**
  In the early 21st century, engineers observed that a particular type of steel truss bridge, when built with a certain joint design (let's call it Design A), consistently developed fatigue cracks at specific nodes after about 20 years of service. This phenomenon, labeled "E" (the evidence), was well-documented in engineering handbooks and had been known since the 1980s. Every competent engineer assigned probability 1 to E. In 2025, a new theory of material stress propagation, H, is proposed. H suggests that under cyclic loading, stress concentrates at the joints in a previously unrecognized pattern due to harmonic resonance within the truss structure. Importantly, H was developed from laboratory experiments on vibrational modes in steel alloys, not from studying bridges. When H is proposed, engineers immediately see that it entails E: if H is true, then the cracks at those nodes in Design A bridges are exactly what we would expect. Moreover, at the time H is proposed, the leading rival theories (such as theories focusing solely on static load or corrosion) also predicted E with high probability because E was a well-known fact. Thus, E was already expected under the rivals, and H was not reverse-engineered to explain E.

  **Blocking Conditions:**
  1. The entailment from H to E is obvious to everyone as soon as H is stated. There is no new logical fact to learn.
  2. Under every live rival theory (static load, corrosion, etc.), E (the cracks) was already very probable. Hence, the counterfactual "how surprising would E be if H were false?" yields low surprise because the rivals already accounted for E.
  3. H was proposed for independent reasons (laboratory experiments on vibrational modes) and not to fit E.

  Now, we assign rough credences. Let’s stipulate:

  - Prior probability of H, P(H): low, say 0.1, because it's a new theory.
  - Probability of E: 1 (since it's old evidence, everyone knows it). But note: in the Bayesian framework, if E has probability 1, then conditionalizing on E does nothing.

  We will now evaluate three approaches:

  **1. Straight Bayesian Conditionalization on E:**
     Since E is old evidence, P(E) = 1. Then, by definition, P(H|E) = P(H) * P(E|H) / P(E) = P(H) * 1 / 1 = P(H). So updating on E does not change the probability of H. Thus, no confirmation.

  **2. Learning the Logical Fact (H entails E):**
     The idea is that what we learn is not E (which we already know) but that H entails E. Let L be the proposition "H entails E". We update on L. Then:
        P_new(H) = P(H | L) = P(H and L) / P(L) = P(H) / P(L)   [because if H is true, then L is true, so H and L is equivalent to H]
     But note: in our case, the entailment is obvious. So at the time H is proposed, every competent engineer already sees that H entails E. Therefore, L was already known (or assigned probability 1) at the moment H was introduced. So we cannot update on L either because P(L)=1. Hence, P_new(H) = P(H) / 1 = P(H). Again, no confirmation.

  **3. Counterfactual Approach (How surprising would E be if H were false?):**
     We consider the counterfactual scenario where we do not know E and H is false. Then we ask: what is P(E | ~H)? 
     But in our case, under ~H (i.e., under the disjunction of the rival theories), E was already very probable. We stipulated that the rival theories (static load, corrosion, etc.) also predicted E with high probability. Let’s assign:
        P(E | ~H) = high, say 0.9 (because the rivals already explain E well).
     And P(E | H) = 1 (since H entails E).
     Then, the standard measure of confirmation (like the likelihood ratio) is P(E|H) / P(E|~H) = 1 / 0.9 ≈ 1.11, which is very close to 1. So the degree of confirmation is negligible.

  Thus, all three approaches fail to deliver significant confirmation.

  **The Feature Carrying Confirmatory Weight:**
  The key feature is that H provides a *new explanation* for E that was not available before. Specifically, H reveals that E is a consequence of a deeper, more general principle (harmonic resonance in stress propagation) that also explains other phenomena and has independent support. Moreover, H unifies E with other observations (from the lab experiments) and might lead to novel predictions (e.g., about how to prevent such cracks by changing the design to avoid resonant frequencies). The confirmation comes from the fact that H, which was independently motivated, accounts for E in a way that is not just a restatement of what was known but provides a new causal mechanism. This is the "explanatory power" of H with respect to E.

  If we remove this feature — suppose H did not provide any new explanation but was just a redescription of the same facts — then the confirmation would evaporate. For example, if H were merely "the bridges crack at those nodes because of fatigue", which is just restating E, then it wouldn't be confirmatory.

  **Can Any Approach Capture This?**
  The counterfactual approach might be patched by considering a more refined set of hypotheses. Instead of comparing H to the catch-all ~H (which includes all rivals that already account for E), we might compare H to specific rival hypotheses that are live at the time. But note: in our case, the rivals are also known to account for E. Alternatively, we might consider the *novelty* of the explanation. However, the standard Bayesian framework does not directly account for explanatory power.

  Alternatively, one might try to use a non-probabilistic measure of explanatory power and then feed that into a Bayesian update. But that is not standard.

  **The Strong Objection:**
  The objection might be that we have misrepresented the hypothesis space. In particular, the old evidence E should not be assigned probability 1 because the agent's total evidence at the time of proposing H includes more than just E. Specifically, the agent has a body of evidence, and E is only part of it. The rival theories might account for E but not for other pieces of evidence. Moreover, the new theory H might be confirmed by its ability to explain E *in conjunction with* other evidence, or by unifying E with other phenomena.

  In our case, H was developed from laboratory experiments (let's call that evidence E*). So the total evidence is E and E*. When H is proposed, it explains both E and E*. The rival theories might explain E but not E*. So the update should be on the total evidence. However, note that E* is new evidence that was not available when the old evidence E was known. But in our story, H is proposed after E* is obtained. So let's reframe:

  - At time t0: Engineers know E (the bridge cracks) and assign it probability 1.
  - At time t1: New laboratory evidence E* (about vibrational modes) is obtained.
  - At time t2: H is proposed to explain E* (and then also seen to explain E).

  Then, when updating on E*, we get confirmation for H. And then, because H also explains E, that might be seen as a bonus. But note: the old evidence E is not doing any confirmatory work in this update. The update is driven by E*. The problem of old evidence is about whether E, which was already known, can confirm H.

  The objection continues: if we consider the entire evidence set, then when we evaluate P(H | E, E*), we are updating on both. But since E was already known, we can break the update into two steps: first update on E (which does nothing because P(E)=1) and then update on E*. The confirmatory work is done by E*. So E does not confirm H; E* does.

  However, in the minds of the engineers, the fact that H explains E (the old evidence) is taken as additional support. They might say, "Look, H not only explains the new lab results but also the well-known bridge cracks!" This is the intuition we are trying to capture.

  **Does the Objection Defeat the Case?**
  The objection does not entirely defeat the case. It merely relocates the difficulty. The problem is that the old evidence E is being cited as a reason to accept H, but according to Bayesian updating, E cannot provide any confirmation because it is already known. The new evidence E* is what is doing the work. However, in scientific practice, the explanation of old evidence is often taken as confirmatory. The challenge for Bayesianism is to account for this without violating the conditionalization rule.

  **Conclusion on the Blocking Conditions:**
  The three blocking conditions can be jointly satisfied, and our case does so. However, the Bayesian approaches we tried fail to capture the confirmation. The problem is that the old evidence E is not confirmatory in the Bayesian framework if it has probability 1. The only way out is to relax the condition that P(E)=1. But that is the defining feature of old evidence.

  **Relaxing the Conditions:**
  I would relax condition (1) slightly: allow that the entailment is not immediately obvious to everyone. Then we can have a scenario where when H is proposed, it takes some time to realize that H entails E. Then, learning the logical fact L (that H entails E) can provide confirmation. This is the standard Garber-style fix. But in our original setup, we blocked that.

  **Best Example Under Relaxed Condition (1):**
  Case: In epidemiology, it was known for decades (evidence E) that the incidence of a certain liver disease was higher in communities near chemical plants. In 2020, a new theory H about the metabolic pathway of a specific toxin (say, toxin X) is proposed, based on cell culture studies (so independent of E). At first, no one notices the connection to E because the disease was not previously linked to toxin X. But then, after H is proposed, a researcher realizes that toxin X is emitted by those chemical plants and that H predicts the observed pattern of disease. So the logical fact L (H entails E) is learned after H is proposed.

  Now, we update on L. Let:
     P(H) = 0.2 (low prior)
     P(L | H) = 1 (because if H is true, then H does entail E)
     P(L | ~H) = 0.1 (it's possible that even if H is false, someone might mistakenly think H entails E, but it's not likely; or there might be other ways that E could be entailed by a false theory? But note: if ~H, then H doesn't entail E? Actually, the proposition L is about the logical relation, so it should be necessary. But we can model the agent's uncertainty about L.)

  Alternatively, we can model it as the agent learning that H predicts E. Then we update on L. We set:
     P(L | H) = 1
     P(L | ~H) = k (some probability that even if H is false, H would predict E. This might be low because if H is false, it might not have been designed to predict E, so by chance it might not. But note: in this case, H was not designed for E, so it might be a coincidence. Let k = 0.05)

  Then:
     P(H | L) = P(H) * P(L|H) / [P(H)*P(L|H) + P(~H)*P(L|~H)] 
               = 0.2 * 1 / [0.2*1 + 0.8*0.05] 
               = 0.2 / (0.2 + 0.04) = 0.2/0.24 ≈ 0.833

  So we get a significant boost. This captures the intuition.

  However, note that in this relaxed case, condition (1) is violated because the entailment was not immediately obvious. But it is still a case of old evidence.

  **Final Thoughts:**
  The problem of old evidence remains a challenge for Bayesian confirmation theory. Our original case (with the three blocking conditions) shows that there are situations where old evidence seems to confirm a new theory, but standard Bayesian methods fail. The strongest objection is that the old evidence is not doing the confirmatory work; new evidence is. But in scientific practice, the explanation of old evidence is often taken as a virtue. The case we constructed with the relaxed condition (1) is the best we can do within the standard fixes.
answer: |-
  ### Case Construction: Structural Engineering Episode  
  **The Episode:**  
  In the 1950s, engineers observed that concrete bridges built with a specific joint design (Type J) consistently developed hairline cracks at load-bearing nodes after 10–15 years of service. This phenomenon, Evidence E, was meticulously documented in engineering handbooks by 1960 and universally accepted as fact. All rival theories (e.g., thermal expansion, material fatigue) explained E with high probability. In 2020, Dr. Aris proposes a novel theory H: micro-vibrations from traffic resonance induce harmonic stress patterns that propagate cracks at Type J nodes. H emerges from independent lab experiments on vibrational frequencies in composite materials, not from bridge data. Upon hearing H, engineers instantly see it entails E—yet E was already expected under existing theories. Still, researchers feel E strongly confirms H because H identifies a *previously hidden mechanism* that unifies E with unrelated lab results.  

  ---

  ### Analysis with Rough Credences (Stipulated)  
  - **Prior credence in H** (\(P(H)\)): Low (0.1), as H is radical.  
  - **Credence in E** (\(P(E)\)): 1 (old evidence, known for decades).  
  - **Rival theories** (e.g., thermal expansion): Assign \(P(E|\text{rivals}) \approx 0.9\) (E was antecedently probable under all live options).  
  - \(P(E|H) = 1\) (H obviously entails E).  

  #### 1. **Straight Bayesian Conditionalization on E**  
     Update: \(P_{\text{new}}(H) = P(H|E) = \frac{P(H) \cdot P(E|H)}{P(E)} = \frac{0.1 \cdot 1}{1} = 0.1\).  
     **Result:** No confirmation. E’s probability 1 nullifies updating.  

  #### 2. **Learning "H Entails E" (Logical Fact Fix)**  
     Let \(L =\) "H entails E." But since L is obvious when H is proposed, \(P(L) = 1\) from the start. Thus:  
     \(P_{\text{new}}(H) = P(H|L) = \frac{P(H) \cdot P(L|H)}{P(L)} = \frac{0.1 \cdot 1}{1} = 0.1\) (as \(P(L|H) = 1\)).  
     **Result:** No confirmation. L was already certain.  

  #### 3. **Counterfactual Fix (Probability of E if H False)**  
     Compute likelihood ratio: \(\frac{P(E|H)}{P(E|\neg H)}\). Here, \(P(E|\neg H)\) aggregates rivals. Stipulate \(P(E|\neg H) = 0.9\) (E likely under all rivals). Then:  
     \(\frac{P(E|H)}{P(E|\neg H)} = \frac{1}{0.9} \approx 1.11\).  
     **Result:** Negligible confirmation (Bayes factor < 3). Fails to reflect strong intuitive support.  

  **Summary:** All three approaches yield near-zero confirmation, violating the intuition that E powerfully supports H.  

  ---

  ### The Confirmatory Engine: Unification and Hidden Mechanisms  
  The core feature carrying confirmatory weight is **explanatory unification**: H reveals a *hidden causal mechanism* (harmonic stress) that explains E *and* integrates it with *independent lab phenomena* (vibrational experiments). E gains new significance as part of a broader pattern.  

  **Confirmation evaporates if removed:** If H only redescried E (e.g., "cracks occur because bridges weaken") without invoking a hidden mechanism or unifying new data, E would not confirm H.  

  **Which approach can be patched?** The counterfactual fix *could* work if we reject the coarse \(\neg H\) partition. By splitting \(\neg H\) into *specific rivals* (e.g., thermal vs. fatigue theories) and assigning some low \(P(E|\text{rival}_i)\), we might get:  
  - \(P(E|\text{thermal}) = 0.9\), but \(P(E|\text{fatigue}) = 0.7\) (if fatigue theory poorly predicts crack locations).  
  - If H beats one rival (e.g., likelihood ratio vs. fatigue: \(1/0.7 \approx 1.43\)), confirmation emerges weakly.  
  **Cost:** This requires ad hoc repartitioning of hypotheses and inflates \(P(E|\neg H)\) artificially. It also conflicts with historical context (E was likely under *all* then-accepted rivals).  

  ---

  ### Strongest Objection: "No Genuine Problem"  
  **Objection:** The agents’ total evidence includes more than E. When H is proposed, they have E *and* new lab data (call it \(E^*\)) from vibrational experiments. Updating on \(E^*\) (not E) confirms H, and E merely illustrates H’s consilience. Bayesianism handles this:  
  - \(P(H|E^*) > P(H)\) (H explains \(E^*\)),  
  - \(P(H|E, E^*)\) further increases slightly if E and \(E^*\) are interdependent.  
  E’s role is psychological—not confirmatory.  

  **Rebuttal:** This relocates, but does not resolve, the difficulty. The objection concedes E *alone* cannot confirm H but claims scientists conflate E with new evidence. Yet in practice, researchers explicitly cite E’s *reinterpretation* under H as evidence (e.g., "H explains the *old* crack data"). Bayesianism must either:  
  - Deny E confirms H (counterintuitive), or  
  - Accept that old evidence can confirm *if* we lower \(P(E)\) (violating history).  
  Our case satisfies all three blocking conditions and preserves the intuition—thus, the problem stands.  

  ---

  ### If Blocking Conditions Cannot Be Fully Satisfied  
  **Relax condition (2)**: Allow E to be *improbable* under *some* rivals. For instance:  
  - **Epidemiology case**: Evidence E (rare disease clusters near factories) was old. Rival theories (genetics, pollution) both explained E, but pollution assigned \(P(E|\text{pollution}) = 0.9\), genetics \(P(E|\text{genetics}) = 0.3\). New theory H (chemical X pathway) emerges from cell studies.  
  - **Result:** Counterfactual fix works: \(\frac{P(E|H)}{P(E|\neg H)} \approx \frac{1}{0.6} = 1.67\) (aggregating rivals), yielding mild confirmation.  
  **Cost:** Violates (2) by making E antecedently improbable under genetics. The original case is cleaner because (2) forces the problem’s hardest constraint.  

  **Conclusion:** The structural engineering case satisfies all three conditions and exposes the Bayesian impasse. Old evidence *can* confirm by revealing new explanatory unity, but capturing this requires tools beyond standard updating (e.g., explanatory priors). Use this in seminar to ignite debate on whether Bayesianism needs refinement or replacement.
