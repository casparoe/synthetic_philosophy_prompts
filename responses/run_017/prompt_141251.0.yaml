prompt: |-
  I've been reading about moral particularism and generalism on my own — no classes, just books and a long-running argument with a friend — and the argument has stalled in a way I think only a well-built case can fix. So I'd like a case constructed to order.

  My friend's position: as he understands it, particularism says only that reasons can be outweighed or defeated, that you can't read an all-things-considered verdict off a single feature. Everyone already believes that, generalists included, he says. So particularism is either a truism or it collapses into the claim that morality can't be taught, argued about, or learned from cases — which he takes to be obviously false. I want a case that shows the interesting claim is stronger than defeat, and I want it built so that he can't wave it off as a stipulation.

  Specifications:

  1. Two ordinary situations, one paragraph each: a workplace, a family, a clinic, a neighborhood. No trolleys, no science fiction, no exotic roles or institutions. The two cases should share a thin non-moral description — same kind of agent, same kind of act — and differ by the addition of exactly one further non-moral fact. Call the shared feature F and the act X.
  2. In case A, F is a reason to do X, and doing X is what should be done. In case B — A plus the one extra fact — F is *still* a reason to do X; I don't want it to go silent, and I don't want a plain defeat where it simply gets outweighed by something independent of it. But in B, F is also part of what makes some other feature G into a reason *not* to do X. So F favours doing X and, in the same situation, enables a reason against doing X. And in B, all things considered, X shouldn't be done. That double role is the thing my friend denies can happen.
  3. The difference between the cases must not be traceable to consequences, or to a change in the agent's aims or motives. Hold outcomes fixed across the two cases as far as you honestly can.
  4. The pull has to come from the setup, not from my say-so. I don't want to have to add "and intuitively, here F is a reason against." A careful reader should feel the flip before it's named.
  5. Anticipate his repair: he'll say the generalist just states a more specific principle, or adds a ceteris paribus or "unless defeated" clause, and gets the right answer anyway. So show what that repair costs: whether the extra condition in the more specific principle can be stated in general terms at all, rather than being a disguised proper name for this case; and whether a hedged principle can still guide someone facing the case for the first time, before they know how it comes out.

  After the scenario, walk through how a strong generalist, a hedged or defeasible generalist, and a particularist each describe both cases; then say which structural feature of the case is doing the double-role work, what happens to the case if you remove that feature, and how my friend would best attack it. If some part of my specification can't be met without cheating, say so plainly and give me the nearest specification that can be met.

  Finally, tell me how confident you are in what you claim about what each view is committed to, and single out the point you're least sure of. I'd rather have an honest boundary marker I can concede than a confident overreach I can't defend when he pushes back.
reasoning: |-
  Okay, let me tackle this user's request. They're deep into moral philosophy, specifically the particularism vs. generalism debate, and need a case to counter their friend's argument. The friend thinks particularism is either trivial or implies morality can't be taught. The user wants a scenario where a feature F both supports an action X and enables a reason against it in a different context.

  First, I need to meet all five specifications. The cases must be ordinary—workplace or family settings—with a shared feature F and one additional fact in case B. F should remain a reason for X in both cases, but in B, it also enables G to become a reason against X. Outcomes should be fixed, and the intuitive pull must come from the setup, not explicit statements.

  Considering workplace and family scenarios. A workplace example might involve giving critical feedback. Case A: an employee (Sam) gives feedback to a colleague, which is helpful. F is the feedback's accuracy. Case B adds that the colleague has an anxiety disorder. Here, F (accuracy) still supports giving feedback but also enables G (potential harm due to anxiety) as a reason against. The challenge is showing F's dual role without making it about consequences.

  Family scenarios could involve planning a birthday party. Case A: a child wants a big party (F is the child's strong desire). Case B adds that the child is recovering from an illness. F still supports the party but enables G (health risk) as a reason against. Need to ensure outcomes are similar—both cases involve the party happening but with different reasons.

  Next, anticipating the generalist's repair. They might propose a more specific principle, like "unless it causes harm." But in the feedback case, harm depends on context (anxiety disorder), which isn't always harmful. Listing all exceptions could lead to infinite disjunctions or opaque conditions. A hedged principle might not guide someone unfamiliar with the context, which defeats the purpose of moral principles.

  Walking through the views: Strong generalist would struggle with conflicting principles. Hedged generalist adds conditions but may end up with disjunctive lists. Particularist sees F's valence as context-dependent without universal rules. The structural feature enabling F's double role is the specific vulnerability (anxiety or illness), which isn't a moral feature.

  Potential weaknesses: The health risk in the party scenario might be seen as a consequence. Mitigating by focusing on the child's current state rather than outcomes. Also, the friend might argue that vulnerability is part of the principle, but counter by showing that "vulnerability" varies contextually, making principles unwieldy.

  Confidence levels: High on particularism's commitments but moderate on whether hedged principles become uninformative. Least sure if the enabling feature can be non-moral without sneaking in evaluative content. Need to emphasize that anxiety disorder is a non-moral fact, but its relevance might depend on moral views.
answer: |-
  Here's a case built to your specifications, designed to force the issue your friend denies: that a feature (F) can simultaneously *be* a reason *for* X and *enable* a feature (G) to be a reason *against* X in the same situation (B), without being outweighed or silenced, and where the difference isn't traceable to consequences or motives.

  **The Core Setup: Giving Critical Feedback**

  *   **Shared Feature (F):** The feedback is accurate and relevant to improving performance.
  *   **Act (X):** Delivering the feedback directly to the person it concerns.

  **Case A (Workplace - Standard):**
  Sam is a manager. Alex, a colleague from another team Sam occasionally collaborates with, has made a significant but correctable error in a recent report that Sam reviewed. The error is factual and impacts the report's conclusions. Alex is generally confident, receptive to constructive criticism, and the team culture encourages open feedback for improvement. Sam knows that pointing out the error will help Alex avoid similar mistakes in future collaborative projects. Sam decides to tell Alex about the error directly and specifically, explaining why it matters. Alex appreciates the feedback and corrects the report. (F is a reason for X; X should be done).

  **Case B (Workplace - With the Added Fact):**
  *Everything in Case A is identical, **plus one non-moral fact:** Alex has recently been diagnosed with a severe anxiety disorder specifically triggered by perceived criticism at work, especially regarding factual accuracy, which he ties intensely to his self-worth. He is actively receiving treatment but is in a fragile state.* Sam is aware of this diagnosis. The feedback is still accurate and relevant (F). Sam knows delivering it directly (X) could genuinely help Alex improve (F remains a reason for X). *However*, Sam also knows that delivering it directly in this context risks triggering a severe anxiety episode (G - the risk of significant psychological distress/harm). Because Alex's disorder links factual criticism directly to intense distress in this specific way, **F (the accuracy of the criticism) is precisely what *enables* G (the risk of severe distress) to be a strong reason *against* X (delivering it directly now)**. Simply withholding the feedback isn't ideal, but delivering it directly carries an unacceptable risk *because* it is accurate criticism hitting Alex's specific vulnerability. Sam decides *not* to deliver the feedback directly to Alex at this time, but instead discusses the best approach with Alex's supportive manager or HR, focusing on support first. (F is still a reason *for* X, but in this situation, it also enables G to be a decisive reason *against* X; ATC, X should not be done).

  **Why this meets your specifications:**

  1.  **Ordinary Situations, Shared F & X:** Both involve a workplace, a manager/colleague relationship, giving accurate, relevant feedback (F) directly to the person concerned (X). The added fact (Alex's specific anxiety disorder) is non-moral and non-exotic.
  2.  **F's Double Role in B:** In B, F (accuracy) is *still* a reason for X (it *would* improve Alex's work). Crucially, it doesn't vanish or get outweighed by something independent (like Sam being busy). Instead, F *enables* G (risk of severe distress) to be a reason *against* X. The accuracy isn't outweighed *by* the distress; the accuracy *makes* the distress a salient, powerful reason *in this specific context*. F is both proponent and enabler of opposition.
  3.  **Outcomes & Motives Fixed:** The *potential* outcome of Alex improving is identical in both cases. Sam's motive (to help Alex improve) is identical in both cases. The *actual* outcome differs (distress vs. no distress), but the *reason* against X in B is the *risk* of distress *enabled by F*, not the consequence itself as a separate factor. Sam's motive to help doesn't change; the context changes how that motive can be safely expressed.
  4.  **Intuitive Pull:** The setup *should* make the reader feel the tension: "The feedback *is* helpful... but *because* it's accurate and he's so vulnerable to *that*, telling him directly now feels reckless/dangerous, not just unkind." The "flip" comes from the interaction between F and the added fact.
  5.  **Anticipates Repair:** See analysis below.

  **Analysis: How Different Views Describe the Cases**

  1.  **Strong Generalist (Strict Principles):**
      *   **Case A:** "Accurate feedback should always be given directly to foster improvement." (Principle: Accuracy -> Give Directly). X is correct.
      *   **Case B:** Stumbles. The principle demands X. The distress seems like a separate negative consequence potentially outweighing the benefit, contradicting the strict principle. Or, they might deny F is a reason in B (but it intuitively is - it would help Alex!). They struggle to capture F's enabling role for G within their rigid framework. To handle B, they might abandon the principle or make it overly complex *ad hoc*.

  2.  **Hedged/Defeasible Generalist (Principles with Exceptions):**
      *   **Case A:** "Generally, accurate feedback is a reason to give it directly, unless defeated." X is correct.
      *   **Case B:** "Accuracy is still a reason *for* direct feedback, but it's defeated by the risk of severe psychological harm." They acknowledge F remains a reason and G is a defeating reason.
      *   **The Cost of Repair:**
          *   **Stating the Condition:** Can they state the defeating condition ("unless it risks severe psychological distress due to a specific vulnerability triggered *by the accuracy itself*") in genuinely *general* terms? "Unless it causes harm" is too broad (harm is vague; criticism often causes mild discomfort). "Unless it triggers a severe anxiety episode" seems specific to mental health conditions. The *key* link – that F *enables* G *in virtue of its specific nature (accuracy)* – is hard to capture non-trivially. A principle like "Give accurate feedback directly unless the person has a condition where accurate criticism is a specific trigger for severe distress" starts looking like a disguised proper name for this *type* of situation rather than a truly general, informative rule derived from simpler components.
          *   **Guidance:** Could this hedged principle guide Sam facing B *for the first time*? Maybe, *if* Sam knows the principle and recognizes Alex's condition fits the exception. But the principle doesn't *explain why* the exception exists – it just lists it. It doesn't help Sam *reason* about *why* F's role changes; it just tells them the outcome. The particularist argues the reasoning (seeing how F enables G) *is* the moral work, not applying a pre-loaded exception.

  3.  **Particularist:**
      *   **Case A:** The context (confident colleague, supportive culture) means F (accuracy) functions straightforwardly as a reason for X (direct feedback). Other features (like potential for improvement) support this.
      *   **Case B:** The context now includes Alex's specific vulnerability. Here, F (accuracy) retains its positive valence as a potential reason *for* improvement (it *would* help), **but simultaneously**, due to the *interaction* with Alex's condition, F *enables* G (risk of severe distress) to emerge as a powerful reason *against* X (direct delivery now). The valence of the situation is radically altered by how F interacts with this new feature. The right action changes because the reasons present and their interactions change. F plays a complex, dual role inherent to *this specific context*.

  **The Structural Feature Enabling the Double Role:**

  The crucial element is **the specific, contingent vulnerability of the recipient, where F (the accuracy of the criticism) is the *precise trigger* for a significant harm (G).** F doesn't just coexist with G; F *activates* G's negative force *in virtue of F's own nature*.

  *   **Removing this Feature:** If Alex's anxiety wasn't *specifically triggered by factual criticism* (e.g., triggered by loud noises instead), then F (accuracy) wouldn't enable G (risk of distress). The distress might still be a reason against X, but it wouldn't be *enabled by F*. F would just be a reason for X, and G might be an independent reason against, leading to a simpler weighing scenario, which your friend accepts. The *enabling* link is key.

  **How Your Friend Might Best Attack It:**

  1.  **Deny F is a Reason in B:** "In B, the accuracy *isn't* actually a reason to give the feedback directly *at all*, because the harm risk means it wouldn't actually achieve its purpose of improvement safely. The reason is silenced." This is the strongest attack. Counter: Argue that the accuracy *is* still *pro tanto* good/reason-giving *in itself* (it identifies a genuine flaw needing correction for Alex's benefit), and crucially, that Sam could still *believe* it's a reason (hence the internal conflict) *even if* acting on it directly is wrong ATC. The accuracy doesn't vanish as a value; its *action-implication* is blocked by the context it helps create.
  2.  **Reframe as Simple Weighing:** "G (risk of harm) is just a much stronger independent reason that outweighs F. F enabling G is irrelevant; it's just a causal fact." Counter: Emphasize the *constitutive* link. The harm isn't independent; its *moral salience and force as a reason against X* arise *because* it's harm *caused by the accurate criticism*. The accuracy isn't just outweighed; it *generates* the opposing reason *from within the situation it helps define*.
  3.  **Argue the Condition *Can* Be Generalized:** "The principle can be 'Give direct accurate feedback unless it would cause severe psychological harm due to a specific vulnerability linked to the criticism's content.' That's general enough." Counter: Ask *why* this exception holds. Is it derivable from simpler principles? Or is it just recognizing that *in contexts like this*, reasons interact in complex ways? The principle becomes a label for contexts where F enables G, not a predictive guide from simpler components. Further, "severe psychological harm," "specific vulnerability," "linked to content" are themselves complex and context-dependent, requiring the same kind of sensitivity the particularist champions.
  4.  **Challenge Outcomes:** "The potential outcome *isn't* fixed. In A, improvement is likely. In B, improvement is unlikely *because* Alex might be too distressed to process it, so F isn't really a reason in B." Counter: This risks conflating reasons with expected outcomes. The *accuracy itself* is the relevant feature F. Sam might reasonably believe that *if* Alex could receive it, it *would* help (hence F's persistent reason-giving force), even if delivering it directly now would prevent that reception. The value of the accurate information persists.

  **Confidence Assessment & Boundary Markers:**

  *   **High Confidence:** That the case meets specifications 1, 3, and 4. The scenarios are ordinary, outcomes/motives are fixed as specified, and the intuitive pull for F's double role in B comes from the setup.
  *   **High Confidence:** That strong generalism struggles significantly with Case B and that particularism handles both cases smoothly by focusing on contextual interaction.
  *   **Moderate Confidence:** That the hedged generalist's repair results in a principle that is either insufficiently general (too specific) or uninformative for novel guidance. This hinges on the interpretation of "genuinely general terms" and "guidance." I'm confident the principle gets clunky, but less confident it *utterly fails* to guide. This is the point your friend will likely press hardest.
  *   **Least Sure Point (Boundary Marker):** I'm least sure that your friend *must* concede that **F (the accuracy) remains a genuine *pro tanto* reason for X in Case B.** This is the crux. Your friend might successfully argue that in B, given the context, F's status *as a reason for X* is *defeated* or *silenced* – that it ceases to be any kind of count-in-favor consideration for the act of direct delivery *at this time*. They might say Sam *shouldn't* feel F as a pull towards X in B, only regret that they *can't* act on it. This is the core disagreement. The particularist insists F retains its *pro tanto* force even when overridden/enabling opposition, manifesting as moral conflict/regret. The generalist might deny this residual force exists. *Be prepared to defend this intuition vigorously.* Concede that if your friend *doesn't* share the intuition that F remains a reason (even if overridden) in B, the case loses its force for them. Your argument then shifts to defending *that* intuition about reasons.

  This case forces the issue: F isn't just outweighed in B; it actively *creates* the force of the reason against the very act it also (pro tanto) supports. It shows particularism isn't just about defeat but about the holistic, context-sensitive interaction of reasons where a feature's valence and role are not fixed but emerge from the specific constellation of facts. Good luck with your argument!
