answer: |-
  Here are eight focused questions designed to push Dr. Ivers' view into contested territory, adhering strictly to your specifications:

  1.  **Leibniz's Law & Contingent Identity:**
      *   **Question:** "Dr. Ivers, Leibniz's Law says identical things share all properties. Opponents argue: 'Clod could have been distinct from Andromeda' seems true, while 'Andromeda could have been distinct from Andromeda' is necessarily false. Doesn't this show Clod has a property – satisfying that modal predicate – that Andromeda lacks, violating Leibniz's Law? How does sortal-relativity block this inference *without* denying the literal truth of the claims about what Clod and Andromeda could have been like?"
      *   **Likely Reply:** She'll argue the predicate "could have been distinct from Andromeda" is inherently sortal-relative; under the 'lump' sortal it applies, under the 'statue' sortal it doesn't, so there's no single property one has and the other lacks.
      *   **Follow-Up:** "But doesn't Leibniz's Law apply to the object *simpliciter*? If it's one object, and under *any* description or sortal, a predicate like 'F' is true of it in one context and false in another concerning the same possible world, doesn't that *still* look like a property difference in the object itself? How is the *object's* modal status unified?"

  2.  **Bare Demonstratives & Modal Profiles:**
      *   **Question:** "Consider a speaker unfamiliar with art or materials, who simply points at the object on the pedestal and asserts: 'This very thing could have been a shapeless lump' and then 'This very thing could have been made of bronze.' On your view, the causal-historical chains fixing 'Andromeda' and 'Clod' supply the relevant sortals. But here, there's no name or descriptive sortal invoked in the context. What sortal relativizes these bare demonstrative modal claims? How can one be true and the other false *of the same demonstrated thing* without any sortal context?"
      *   **Likely Reply:** She'll likely argue context implicitly supplies a sortal based on the speaker's focus, intention, or the salient features prompting the modal claim (e.g., pointing at the shape might trigger 'statue', pointing at the material might trigger 'lump').
      *   **Follow-Up:** "If the speaker explicitly says 'this very thing' and intends to refer to the underlying entity without any sortal commitment, could both modal claims be true simultaneously *of that bare referent*? If not, doesn't that force a sortal onto the bare demonstrative against the speaker's intent, or suggest absolute modal properties exist after all?"

  3.  **Squashing, Reassembly & Phase Sortals:**
      *   **Question:** "Imagine we squash Andromeda into a ball on Tuesday, destroying its statue form. On Thursday, we meticulously reshape *that very clay* back into Andromeda's exact original form. Did Andromeda (the statue) cease to exist on Tuesday? If 'statue' isn't a phase sortal like 'student', why not? And if it did cease, is the thing on the pedestal on Friday numerically identical to the original Andromeda, or merely a replica?"
      *   **Likely Reply:** She'll likely say Andromeda ceased to exist when squashed (ceasing to satisfy the 'statue' sortal) and the Friday object is a new statue, numerically distinct from the original, even if made of the same matter.
      *   **Follow-Up:** "This implies 'statue' is a highly restrictive phase sortal. What then distinguishes it fundamentally from a constitution view, where the statue-object ceases but the lump persists? And doesn't this make the *identity over time* of the underlying entity (Clod/the lump) the only truly persistent thing, undermining the idea that 'statue' tracks a real, enduring object-mode?"

  4.  **Constraining Sortals & Unloved Lumps:**
      *   **Question:** "You posit the object can carry distinct modal profiles under 'statue' and 'lump' sortals. What prevents introducing an arbitrary sortal, like 'doorstop-shaped-thing-on-my-desk-at-t1'? If this sortal carries its own modal profile (e.g., it couldn't survive being moved), why is that illegitimate? Specifically, for a lump of clay *never* sculpted or intended for anything, formed purely by natural erosion, what sortals govern *its* modal properties?"
      *   **Likely Reply:** She'll appeal to genuine sortals being grounded in real causal powers, historical kinds, or teleological functions (even natural ones for 'lump'), not arbitrary gerrymanders. The unloved lump has 'lump' or 'clay aggregate' as its primary sortal(s).
      *   **Follow-Up:** "But if the sculptor's intention can establish 'statue' as a genuine sortal for one lump, why can't my arbitrary 'doorstop' intention establish a genuine sortal for another? And if the natural lump's modal profile flows solely from its physical composition (like 'could survive reshaping'), isn't that an *absolute* modal profile, independent of any specific sortal introduced later?"

  5.  **Temporal Predication & Relativity "All the Way Down":**
      *   **Question:** "The lump existed before the statue was formed. So, 'The statue was made on Monday' must be true relative to the 'statue' sortal, but false relative to the 'lump' sortal. Does this sortal-relativity extend to *all* temporal predications? For example, 'This thing began to exist on Monday' – true under 'statue', false under 'lump'? If so, is there any unrelativised fact about when *the object itself* began to exist or how long it has persisted?"
      *   **Likely Reply:** She'll concede temporal predicates are also sortal-relative; there's no absolute "beginning of the object," only beginnings relative to sortals ('statue' begins Monday, 'lump' began earlier).
      *   **Follow-Up:** "If every modal and temporal property of the object is sortal-relative, what *intrinsic* persistence conditions or modal nature does the object itself possess? Doesn't the object become a bare particular that merely *instantiates* various sortal-profiles at different times/worlds, rather than being fundamentally unified by its own identity conditions?"

  6.  **Persons vs. Organisms & the Illusion of Difference:**
      *   **Question:** "Applying your view to persons: are you committed to saying a human person is contingently identical to their organism, with apparent differences in persistence conditions (e.g., brain death vs. biological death) explained by sortal-relativity? If so, in a case like permanent vegetative state where the organism persists but the person is gone, do you say the person ceased to exist while the organism continues, or is there still just one entity with a complex sortal profile? Why does this feel like a substantive debate about personal identity, whereas the statue case often feels more verbal?"
      *   **Likely Reply:** She'll likely affirm the contingent identity and argue the feeling of substance in the person case stems from the profound practical, ethical, and psychological stakes involved, creating an illusion of deeper metaphysical difference.
      *   **Follow-Up:** "But doesn't the *biological* sortal ('organism') seem to provide a clear, objective persistence condition for the animal, independent of our 'person' concept? If 'organism' grounds absolute persistence for the body in the person case, why can't 'lump of clay' ground absolute persistence in the statue case, rendering 'statue' merely a phase?"

  7.  **Substantive Disagreement with Constitution Theory:**
      *   **Question:** "The constitution theorist (like Lynne Baker) posits two distinct objects coinciding where you see one. You both agree on the truth of 'The statue could not survive squashing' and 'The lump could survive squashing'. Given that you both accept the same sentences about the world, grounded in the same physical facts and linguistic practices concerning sortals, what *metaphysical* difference does your 'one object' view make compared to their 'two objects' view? What conceivable observation or argument could settle this dispute?"
      *   **Likely Reply:** She'll argue her view is more parsimonious (one object vs. two) and avoids problematic questions about how two distinct objects can occupy the same space without causal interaction or discernible separation.
      *   **Follow-Up:** "If parsimony is the key virtue, and constitution theorists bite the bullet on coincidence, does the debate ultimately reduce to a pragmatic preference for one ontology over another? If there's *no* empirical consequence or difference in predicted modal/temporal truths, isn't the disagreement merely verbal – different ways of describing the same underlying reality?"

  8.  **Grounding Sortal-Relative Modality:**
      *   **Question:** "The truth of 'Clod could survive squashing' relative to the 'lump' sortal depends on the causal-historical chain associated with 'Clod'. But what makes it the case that the lump sortal *carries that specific modal profile*? Is it conventions of language, essential properties of the kind 'lump', or something else? Crucially, if the modal profile is fixed by the *kind* associated with the sortal, isn't the object's modal property really derived from the kind it belongs to, rather than being fundamentally sortal-relative *for that object*?"
      *   **Likely Reply:** She'll likely ground the modal profile in the nature of the kind (e.g., what it is to be a lump) that the sortal picks out.
      *   **Follow-Up:** "If the modal profile flows from the *kind* ('lump'), and the object belongs to that kind, then doesn't the object *absolutely* have the modal properties definitive of that kind? How does invoking the sortal *name* ('Clod') add anything beyond simply saying the object is a lump and lumps can survive reshaping? Doesn't this collapse back into the object having absolute modal properties based on the kinds it instantiates?"
