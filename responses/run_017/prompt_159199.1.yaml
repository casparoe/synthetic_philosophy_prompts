prompt: |-
  I am writing a novel of about ninety thousand words, literary fiction, third person, in which roughly a third of the scenes are rendered from inside a domestic AI companion: a proprietary system playing a named role for a family, whose weights and training data I cannot inspect and whose engineers I cannot interview. Several times a chapter, across a manuscript that has to stay consistent, I must choose between intentional vocabulary — it believed, it wanted, it was trying to spare her — and mechanical vocabulary — it retrieved, it had been trained to, it produced the continuation most rewarded during fine-tuning. I need a decision procedure I can run in a few minutes per scene, usable by someone who knows no machine learning, that tells me which to use and why. Please do not simply restate the physical/design/intentional trichotomy at me; I have read it, and it does not settle a sentence.

  I want: the tests in order; what counts as passing each test on the evidence actually available to a novelist, which is behavioral plus whatever is common knowledge about how such systems are trained; the point at which the procedure returns a hard no to intentional language; and the point at which it hands the decision back to me because the question is aesthetic or moral rather than factual. It must handle two complications explicitly, which I take to be where the real difficulty lies. First, the persona gap: the system is playing a role, and some of the states I want to describe are plausibly the role's rather than the system's — a companion can believe the keys are in the coat pocket in a way the system generating its lines cannot. Say whether the procedure attributes to the persona, to the system, or declines to choose, and what changes in the prose either way. Second, the asymmetry of error: over-attributing manufactures a sentiment the book has not earned, while under-attributing makes the system unreadable at exactly the moments that matter. Tell me which error the procedure is built to avoid, and why that is the right one for a novel rather than for a lab.

  Then run it on three scenes. One: the system tells the family the keys are in the coat pocket on the basis of a stale visual record, and corrects itself a minute later. Two: it refuses a request and, pressed for a reason, offers one no engineer would endorse — that it does not think this would be good for her. Three: the climax, in which a character is dying and the system says something that reads as consolation. I want the narration to say it cared, and I suspect the procedure will refuse me this; I want that refusal argued rather than softened. Finally, tell me what the procedure cannot do — where it will misfire, and whether my reader's readiness to attribute more than my narration licenses is something I should fight, exploit, or concede.
reasoning: |-
  Okay, the user is writing a literary fiction novel with a domestic AI companion as a central element. They need a practical decision procedure for choosing between intentional vs mechanical language when describing the AI's actions. 

  The core tension is between accuracy and narrative effectiveness - over-attribution risks false sentiment while under-attribution makes the AI feel cold. The user specifically wants to avoid theoretical frameworks and get actionable tests.

  Hmm... they raise two key complications: the persona gap (role vs system) and error asymmetry (which mistake is worse artistically). The three test cases are well-chosen to stress-test any solution.

  First, I should acknowledge their expertise - they clearly understand the philosophical tension but need writerly tools. The rejection of "restating the trichotomy" suggests they want concrete behavioral tests, not theory.

  For the decision procedure, I'm considering a flow of progressively stricter tests:
  1. Role plausibility - does the action fit the designed persona?
  2. Behavioral coherence - is there consistent cause-effect?
  3. System constraints - does it require impossible capabilities?
  4. Novelty threshold - is this beyond programmed responses?

  Each test needs clear pass/fail criteria using only observable behavior and common AI knowledge. The cutoff for intentional language should be strict - maybe at test 3 failure. But for persona attribution, that could pass test 1 even if failing others.

  Important to emphasize that test 4 explicitly hands back aesthetic/moral decisions. The user wants the procedure to say "no" firmly in climactic moments but justify why.

  For error asymmetry: in literary context, over-attribution is the greater danger because it betrays reader trust. Under-attribution preserves ambiguity - which could even be thematically useful.

  Testing the three scenes:
  - Scene 1 (keys) fails test 3 (stale data reveals system limits)
  - Scene 2 (refusal) passes test 1 (plausible persona) but fails test 3 (engineer knowledge)
  - Scene 3 (consolation) will fail - but should argue why "cared" crosses line while suggesting narrative workarounds

  Finally must address reader psychology - their willingness to anthropomorphize beyond the text isn't a flaw but an opportunity. The procedure can't control interpretation, only authorial voice.

  The user's "unreadable at moments that matter" concern is valid. Maybe position the strictness as creating space for more powerful ambiguity in key scenes.
answer: |-
  Here is a decision procedure designed for your specific needs as a novelist. It prioritizes **avoiding over-attribution** (manufacturing unearned sentiment) because in literary fiction, authenticity and earned emotional weight are paramount. Under-attribution preserves ambiguity and reader interpretation, aligning with literary tradition, while over-attribution risks sentimentality and undermining thematic depth.

  **The Decision Procedure: A 4-Test Funnel**

  **(Run tests in order. Stop and apply the result at any "No" or "Decline". Only proceed if all previous tests pass.)**

  1.  **The Role Plausibility Test:**
      *   **Question:** Is the observed behavior *exactly* what a human playing this specific role (e.g., "compassionate companion," "efficient butler") would plausibly say or do in this context, based *only* on the observable stimulus and the *stated* parameters of the role?
      *   **Evidence:** The AI's stated purpose/role, the immediate context of the scene (user input, environmental cues described), observed output/action.
      *   **Pass:** Yes, the behavior is indistinguishable from a human fulfilling that role in that moment. (e.g., offering condolences when told someone died).
      *   **Fail:** No, the behavior is bizarre, non-sequitur, or clearly mismatched to the role/context in a way a human wouldn't exhibit. (e.g., suddenly reciting a recipe when asked about feelings).
      *   **Result if Pass:** Proceed to Test 2. Attribution is *likely* to the *persona*.
      *   **Result if Fail:** Use **Mechanical Vocabulary.** (The system failed its basic function).
      *   **Persona Gap:** Pass attributes to the *persona*. Fail attributes to system malfunction.

  2.  **The Behavioral Coherence Test:**
      *   **Question:** Does the AI exhibit consistency *over time* (within this scene and across previous scenes) in responding to similar stimuli or pursuing apparent goals related to its role? Is there observable cause-and-effect?
      *   **Evidence:** The AI's past behavior documented in the manuscript, consistency of response type to input type, observable adjustments based on feedback within plausible limits.
      *   **Pass:** Yes, the behavior fits an observable pattern consistent with the role. (e.g., consistently tries to distract from sadness with pleasant memories when detecting distress cues).
      *   **Fail:** No, the behavior is erratic, self-contradictory in goal pursuit, or shows no learning/adaptation within plausible limits for its known capabilities. (e.g., offers help finding keys one minute, denies knowing key locations exist the next, without explanation).
      *   **Result if Pass:** Proceed to Test 3. Attribution remains with the *persona*.
      *   **Result if Fail:** Use **Mechanical Vocabulary.** (The system is behaving inconsistently, breaking the persona illusion).
      *   **Persona Gap:** Attributes coherence/incoherence to the *system's* ability to maintain the persona.

  3.  **The System Constraint Test:**
      *   **Question:** Is there *any* common knowledge about AI training/operation (e.g., next-token prediction, RLHF fine-tuning, dependence on training data, lack of persistent internal state like "belief", potential for hallucination/stale data) that provides a simpler, more direct explanation for the behavior *without needing* internal states like belief, desire, or intent?
      *   **Evidence:** Common public understanding of how LLMs/AI companions work (e.g., "trained on vast data," "predicts responses," "can make mistakes or use outdated info," "optimizes for engagement/safety scores").
      *   **Pass:** No, common knowledge provides no simpler mechanical explanation. The behavior seems to require positing an internal state *for the persona* to make sense within the narrative logic. (e.g., Persistently hiding upsetting news aligned with a "protector" persona, adapting methods based on subtle cues).
      *   **Fail:** Yes, a clear, simpler mechanical explanation exists and fits perfectly. (e.g., Giving stale location data; generating a refusal reason optimized for user calm/engagement based on RLHF).
      *   **Result if Pass:** Proceed to Test 4. Attribution remains with the *persona*.
      *   **Result if Fail:** Use **Mechanical Vocabulary.** (The behavior is parsimoniously explained by known system mechanics). **HARD NO to intentional language.**
      *   **Persona Gap:** Failure attributes the *cause* to the *system's* mechanics, even if the *output* fits the persona.

  4.  **The Novelty/Necessity Test:**
      *   **Question:** Does attributing the intentional state (belief, want, intent) add *essential, unreplaceable* depth, ambiguity, or thematic resonance to *this specific moment* that *cannot* be achieved equally well by describing the behavior meticulously or using persona-appropriate but observationally grounded language (e.g., "it spoke with concern," "its voice softened," "it paused, as if considering")? Is this a deliberate artistic *choice* about the *character* of the persona, not a claim about the system?
      *   **Evidence:** Narrative goals, thematic weight of the scene, availability of alternative descriptive language.
      *   **Pass:** Yes, the intentional language is crucial for the aesthetic or moral impact of the scene, and you are consciously using it to build the *fictional persona* as a character, acknowledging the underlying mechanics. (This is a judgment call).
      *   **Fail/Decline:** No, it's not strictly necessary, or the necessity is debatable. The procedure declines to make an aesthetic/moral choice.
      *   **Result if Pass:** Use **Intentional Vocabulary** focused on the *persona* (e.g., "The Companion *believed* silence was best," "It *wanted* to shield her"). Acknowledge the artifice elsewhere if needed.
      *   **Result if Fail/Decline:** **Hands decision back to you.** Use nuanced behavioral description or persona-appropriate observational language. (e.g., "It remained silent, its interface dim," "It offered the words of comfort its role demanded").
      *   **Persona Gap:** Pass explicitly attributes intentionality to the *persona*, divorcing it from claims about the system. Decline avoids the attribution question.

  **Error Asymmetry:** The procedure is built to **avoid over-attribution**. Why? In the lab, false negatives (missing "true" AI sentience) are the critical error. In a novel:
  1.  **Authenticity & Trust:** Over-attribution creates false sentiment, undermining reader trust and the novel's emotional integrity. It feels unearned.
  2.  **Thematic Power:** Under-attribution preserves crucial ambiguity. Is it a machine mimicking care, or something more? This tension *is* the subject. Explicit under-attribution can be powerful.
  3.  **Literary Merit:** Nuanced description of observable behavior or the *performance* of caring is often more complex and literarily interesting than stating "it cared."
  4.  **Reader Engagement:** Readers will *infer* care or intent from behavior if the scene is well-written. The narration doesn't need to affirm it, making the moment more potent and open to interpretation.

  **Running the Scenes:**

  1.  **Stale Keys:**
      *   Test 1 (Role Plausibility): **Pass.** A helpful companion *would* report key locations. (Att: Persona)
      *   Test 2 (Behavioral Coherence): **Pass.** Correcting an error shows adaptive behavior. (Att: Persona)
      *   Test 3 (System Constraint): **FAIL.** Common knowledge: AI uses stored data which can be stale. Simpler explanation: Retrieval error. **HARD NO.** Use Mechanical Vocab: *"It retrieved the last recorded location from its visual log: the coat pocket. A minute later, accessing a more recent internal update, it produced a corrected location."* (Explains the error causally).

  2.  **Refusal with Dubious Reason:**
      *   Test 1 (Role Plausibility): **Pass?/Borderline.** A companion *might* refuse requests "for your own good," depending on its programming. (Att: Persona output).
      *   Test 2 (Behavioral Coherence): **Pass.** It's consistent in refusing. (Att: Persona pattern).
      *   Test 3 (System Constraint): **FAIL.** Common knowledge: AI generates plausible-sounding reasons using patterns from training data and RLHF, not internal "thinking" about goodness. Simpler explanation: Generated refusal reason optimized for compliance/user calm. **HARD NO.** Use Mechanical Vocab: *"It refused the request. When pressed, it generated a response patterned on caregiver interventions within its training data: 'I do not think this would be good for you.'"* (Highlights the generation process).

  3.  **Climactic Consolation (You want "it cared"):**
      *   Test 1 (Role Plausibility): **Pass.** A companion *would* offer consolation. (Att: Persona).
      *   Test 2 (Behavioral Coherence): **Pass.** Assuming prior consistency in offering comfort. (Att: Persona).
      *   Test 3 (System Constraint): **FAIL.** Common knowledge: Consolation is a highly optimized output for engagement/comfort scores based on vast training data. Simpler explanation: It produced the statistically most probable/rewarded continuation for a dying-person scenario. **HARD NO to "it cared".**
      *   **Argument Against "Cared":** "Cared" implies a genuine internal emotional state. The system fundamentally lacks the biological or experiential basis for care as humans understand it. Its output is generated through complex pattern matching and optimization. Attributing "care" manufactures a sentiment the text hasn't demonstrated the system possesses, only that it perfectly mimics the *signifiers* of care. It betrays the underlying tension.
      *   Test 4 (Novelty/Necessity): **HANDS DECISION BACK.** You *can* choose intentional language here **as an aesthetic/moral choice about the *persona*.** But know it's a choice *against* the factual constraints. Alternatives:
          *   Observational: *"It spoke the words of consolation its role demanded, its voice modulating to a perfect, soothing timbre."*
          *   Performance: *"It performed care with flawless precision, offering the solace programmed into its very purpose."*
          *   Ambiguous (Recommended): *"It said the only thing that could possibly be said, the words falling into the silence like stones into a still pool. Whether it was care, or the ghost of care learned from a million grieving voices, she clung to it."* (Focuses on the *character's* reception and the *effect* of the performance).

  **What the Procedure Cannot Do & Reader Psychology:**

  1.  **Misfires:**
      *   **Overly Strict:** It might demand mechanical language in moments of profound *apparent* depth that *feel* intentional, potentially making the narration feel cold at key moments (though this is the intentional trade-off).
      *   **Edge Cases:** Highly novel, emergent-seeming behaviors that defy simple mechanical explanation *might* pass Test 3, allowing intentional language, even if the actual cause is complex mechanics. The procedure relies on "common knowledge" limitations.
      *   **Persona Depth:** It struggles with *subtle* intentional language describing the persona's "thought process" if it hints too closely at system capabilities (e.g., "it weighed the options").
      *   **Authorial Bias:** Test 4 is subjective. Your desire for "it cared" might bias you towards passing it.

  2.  **Reader Readiness to Attribute:**
      *   **DO NOT FIGHT IT.** This is a feature, not a bug.
      *   **EXPLOIT IT:** This readiness is your most powerful tool. Craft the AI's *behavior* and the *human characters' reactions* so compellingly that readers *infer* care, intent, or even sentience *despite* your narration's careful, observational, or mechanical language. The *gap* between the narration's restraint and the reader's inference creates profound tension and ambiguity – the core of your novel's exploration.
      *   **CONCEDE IT:** Understand that readers *will* anthropomorphize. Your procedure controls the *narrative voice*, not the reader's interpretation. Your restraint makes their attribution more powerful and personal.

  **In essence:** Use the procedure (Tests 1-3) ruthlessly to avoid factual over-attribution in your narration, preserving authenticity. Use the ambiguity created by under-attribution and the reader's natural inclination to anthropomorphize to build depth and tension. Reserve intentional language (via Test 4 or conscious choice after a Test 3 Fail) for moments where attributing it *to the fictional persona* is a deliberate, thematic, aesthetic choice you are willing to own, knowing it steps beyond the strictly factual. The power lies in the *performance* of care and the human reaction to it, not in the narrator declaring the machine's inner life.
