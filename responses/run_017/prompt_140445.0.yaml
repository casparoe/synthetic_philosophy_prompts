prompt: |-
  I'm a journalist — I cover science and medicine — and I'm working on a piece about consent forms, the click-through kind and the signed-in-triplicate kind, and I keep typing the phrase "valid consent" without being able to say what makes it valid. So I did what I always do when I'm lost: I wrote down a pile of cases, marked each one with my gut, and now the pile won't sit still.

  - Someone agrees to sex with a condom, partner takes it off halfway through. Definitely not consent, and worse than I expected myself to feel about it.
  - Patient signs for a knee operation; surgeon gets in there, finds something else, fixes that too. Low risk, genuinely beneficial, patient would probably thank her. Still not fine to me.
  - Patient signs for "robot-assisted" surgery and the actual cutting is done by the system running on its own, nobody's hands on the console for most of it. Not fine. But — and here's the thing that bugs me — I'm fine with the surgeon handing half the operation to a resident the patient never met. Both are a substitution in who does the thing. Am I just defending whatever's normal?
  - Nurse practitioner at a community clinic tells a patient the visit is covered; it isn't and she's on the hook for $400. Gut says the consent to treatment is still fine, the billing is a separate wrong. But then: a study enrols people telling them it's about memory when it's about conformity, same risk, same payment. That one I say is invalid.
    Those two look structurally identical to me — same risk, same money, lie about something the person cared about — and I give opposite answers. I have no idea what's supposed to separate them.
  - Blood donor is told the fee goes to a charity; it goes to the company's overhead. Annoying. I don't think it voids consent.
  - Boss says sleep with me or you're fired. Coerced. Partner says sleep with me or I'm leaving. Not coerced. The partner is also threatening to do something she's entirely entitled to do.
  - A phase I trial in a country where $2000 is four months' wages, for a drug with real risk. My gut says "not coercion" and then immediately says "but not fine either," which probably means my gut is useless on this one.
  - Drunk yes at a party: not consent. But my dad, early Alzheimer's, signed a letter last year saying he'd hand over the keys when his doctor said so, and I think the letter should win over what he's saying now. Which seems backwards — in one case I throw out the impaired present self in favor of the earlier one, in the other I won't let the earlier self's explicit instruction count.
  - 16-year-old getting an IUD without her parents: yes. 17-year-old selling her eggs for tuition money: no. And a 15-year-old refusing a transfusion on religious grounds: no, override her. If there's a shape here it's not just "kids can't consent."
  - Signed a waiver to get into the climbing gym. I don't think that's consent to the risk of the wall falling on me because they never inspected the bolts, but I do think it's consent to the ordinary risk of falling off. Same signature.

  The principle I keep falling back on is: nobody pushed them, and they'd have said yes anyway if they'd known the whole truth. But that has to be wrong somewhere. The blood donor would have said no if she'd known — so my principle calls it invalid, and my gut doesn't. And there's a version that's worse: a patient who'd have refused if he'd known the valve was from a pig, or that the surgeon was Black. I don't want to say the "would you have said yes if you knew" test makes that consent invalid, but I also don't see how to stop it from saying that.

  So: is there one principle — or a short list of them — that gets most of my verdicts, and where does it overrule me? I'd like it stated tightly enough that I can run new cases through it, with a clause-by-clause note on which case forced the clause. And two cases I haven't put on the list because I keep flip-flopping: a woman who said yes to being named in a story while she was hypomanic and now wants out, and a friend who slurred "yeah fine" about a quote at a conference party and then texted "still fine" the next morning. Does a later clear-headed yes repair an earlier broken one, or is that a different question from whether the first yes counted?

  One more thing I actually need for the piece: after all this, is there anything left in "she consented" beyond a label we stick on a bunch of unrelated complaints — the pushing, the lying, the not-getting-it — or is there a core that all of them are failures of?
reasoning: |-
  Okay, let me start by really understanding what the journalist is asking. They're working on a piece about consent forms, both digital and physical, and they're struggling to define what makes consent "valid." They've listed several scenarios where their gut reactions conflict, and they're looking for a consistent principle or set of principles that can explain these judgments. 

  First, I need to unpack their examples. They range from sexual consent to medical procedures, clinical trials, financial agreements, and legal waivers. The journalist feels torn because some cases seem similar but their gut says different things. For instance, lying about billing vs. lying about the study's purpose—both involve deception, but they see one as invalid consent and the other as a separate issue. Why?

  The core of their confusion seems to be: what are the essential elements that make consent valid across all these contexts? They mention autonomy, information, and voluntariness as key, but their examples show these elements interacting in complex ways. Like in the surgeon switching procedures—here, the patient had information and autonomy initially, but the surgeon's action bypassed ongoing consent. That suggests consent isn't a one-time event but continuous, especially in dynamic situations.

  Then there's the issue of deception. The journalist distinguishes between lying about the study's purpose (invalid) vs. misrepresenting billing (separate wrong). Why? Probably because the deception in the study directly affects the participant's autonomy regarding the research, while the billing lie is about a collateral matter. So the principle might be that deception voids consent only if it's about something material to the decision itself.

  Another tricky area is capacity and impairment. The journalist accepts the Alzheimer's patient's prior directive but rejects a drunk person's consent. The difference? In the medical context, advance directives are legally and ethically recognized, whereas intoxication undermines capacity entirely. So the key is whether the person had capacity at the time of decision-making, and whether there's a framework (like legal directives) for honoring past competent choices.

  For minors, it's not just about age but maturity and the specific decision. A 16-year-old getting an IUD is supported because it involves personal health and privacy, whereas selling eggs or refusing life-saving treatment involves higher risks or ethical complexities. Here, the principle involves balancing autonomy with protection, considering the minor's ability to understand and the consequences.

  The coercion examples highlight that threats become coercive when they involve wrongful leverage. A boss threatening firing exploits power illegitimately, while a partner threatening to leave is exercising a personal right. So coercion isn't just about pressure but about illegitimate power dynamics.

  The "would they have said yes" test is problematic because it could validate bigoted refusals. Instead, materiality focuses on relevant risks and alternatives. A patient's objection to a surgeon's race isn't material to the procedure's safety, so it shouldn't void consent. But lying about using a pig valve might be material for religious reasons.

  The repair of consent question—like the hypomanic woman or the drunk quote—shows that validity depends on the initial moment. A later confirmation can affirm consent if it's clear and voluntary, but it doesn't retroactively fix an earlier invalid consent. Each moment must stand on its own.

  Finally, the journalist questions whether "consent" has a core beyond labeling complaints. The answer is yes: it's about respecting autonomy through ongoing, informed, and voluntary agreement. Failures occur when any of these elements are compromised, making the complaints interconnected rather than unrelated.
answer: |-
  You've hit the core tension in consent beautifully: it's both a profound ethical cornerstone and frustratingly context-dependent. Your gut reactions are largely consistent with established ethical and legal frameworks, even if the underlying principle feels slippery. Here's a distillation, built step-by-step from your cases, aiming for a practical tool:

  **The Core Principle of Valid Consent:**

  **Valid consent requires an ongoing, substantially autonomous agreement to a specific course of action, based on a material understanding of its nature, risks, benefits, and alternatives, free from coercion or undue influence.**

  **Breaking Down the Principle (with Case-Driven Clauses):**

  1.  **"Ongoing"**: Consent isn't a one-time event; it must persist or be re-affirmed as circumstances change.
      *   *Case forcing the clause:* **Condom Removal.** Agreement was conditional on barrier use; removing it fundamentally changed the act mid-course without renewed consent.
      *   *Case forcing the clause:* **Knee Surgery Surprise.** The signed consent covered the *knee* procedure. Performing a *different* procedure (even beneficial) breached the scope of the initial agreement. Consent wasn't obtained *for that specific action*.
      *   *Implication:* Consent can be withdrawn or modified as long as the action is ongoing or hasn't yet commenced.

  2.  **"Substantially Autonomous Agreement"**: The person must possess the cognitive and emotional capacity to understand the relevant factors and make a choice reflective of their will. This includes honoring past competent directives when current capacity is impaired.
      *   *Cases forcing the clause:*
          *   **Drunk at Party:** Intoxication impairs capacity for rational understanding and voluntary choice *at that moment*.
          *   **Dad with Alzheimer's:** His *earlier* directive was made when presumably competent. Honoring it respects his past autonomy when his current self *lacks* capacity to make a new, informed decision. This principle underpins advance directives.
          *   **16yo IUD vs. 17yo Egg Sale vs. 15yo Transfusion:** Capacity isn't binary by age alone. It's decision-specific and involves understanding risks/benefits/consequences.
              *   *IUD:* Mature minor doctrine often applies; high personal impact/benefit, low risk refusal (pregnancy).
              *   *Egg Sale:* Complex, high-risk medical procedure with long-term implications; substantial financial inducement risks undue influence/exploitation; requires higher threshold of maturity/counseling.
              *   *Transfusion Refusal:* Life-threatening consequence of refusal; state/parental interest in preserving life outweighs minor's developing autonomy in this extreme case.
      *   *Implication:* Assess capacity relative to the *specific decision* at the *specific time*.

  3.  **"To a Specific Course of Action"**: Consent must be tied to the *actual* thing being done.
      *   *Cases forcing the clause:*
          *   **Robot vs. Resident:** This is about *scope* and *delegation*.
              *   *Resident:* Part of standard surgical practice; implied consent to the surgical *team* under the primary surgeon's supervision is often inherent in consenting to surgery *at a teaching hospital*. The "who" (within the qualified team) is usually not materially specific.
              *   *Robot Autonomy:* Changing from "assisted" (surgeon actively controlling) to "autonomous" (system operating independently) fundamentally alters the *nature* of the action and the associated risks/accountability. This requires *specific* disclosure and consent.
          *   **Climbing Gym Waiver:** Waiver covers *inherent risks* of the *activity* (falling while climbing). It doesn't cover *gross negligence* unrelated to the activity itself (wall collapse due to lack of maintenance). Consent is to the *activity's risks*, not to negligence.
      *   *Implication:* Be specific about *what* is being consented to, especially regarding novel technologies, delegation, or scope changes.

  4.  **"Based on a Material Understanding"**: Key information that would significantly alter a reasonable person's decision must be disclosed.
      *   *Cases forcing the clause:*
          *   **Memory Study Lie (Conformity):** The *purpose* is material. Participation based on false premises voids consent. It's deception about the *core nature* of the act.
          *   **Billing Lie:** While wrong, the deception relates to *payment*, not the *nature, risks, or benefits of the treatment itself*. The consent *to the medical care* remains valid (assuming disclosure about the care was accurate), but the billing practice is a separate fraud/contract issue.
          *   **Blood Donor Charity Lie:** Similar to billing. The deception is about fund allocation, not the act of donation or its risks. Annoying, potentially fraudulent, but likely doesn't void consent *to the donation procedure*.
          *   **Pig Valve / Racist Surgeon:** This distinguishes *materiality* from *preference*.
              *   *Pig Valve:* If the source is material due to religious beliefs or strong personal convictions *and* alternatives exist, failure to disclose *could* invalidate consent. (Ethically, disclosure of tissue source is often required).
              *   *Racist Patient:* The surgeon's race is *not* material to the medical procedure, its risks, or benefits. Not disclosing it doesn't invalidate consent. Accommodating such a request is ethically problematic.
      *   *Implication:* Disclose information that is *reasonably* expected to influence a person's decision regarding *the specific action*. "Would they have said yes?" is the wrong test. The test is: "Was the withheld information *relevant and important* to understanding the *nature and consequences* of what they were agreeing to?"

  5.  **"Free from Coercion or Undue Influence"**: The choice must be voluntary, not obtained through threats, exploitation of vulnerability, or excessive pressure.
      *   *Cases forcing the clause:*
          *   **Boss (Sleep or Fired):** Exploits power imbalance; threat of job loss is an illegitimate, coercive pressure.
          *   **Partner (Sleep or Leaving):** Threatening a legitimate personal choice (ending a relationship) is generally not coercive; it's setting a boundary. The pressure is different in kind and context.
          *   **Phase I Trial ($2000 in Low-Income Country):** This is **Undue Inducement/Exploitation**. While not classic coercion ("do this or else"), the offer exploits economic vulnerability. The payment is so high relative to need that it can overpower rational assessment of risk and undermine voluntariness. Your gut ("not coercion, but not fine") is spot on – it's a failure of the "free from undue influence" clause.
      *   *Implication:* Assess power dynamics, vulnerability, and whether the incentive/pressure overwhelms free choice.

  **Applying the Principle to Your Flip-Flop Cases:**

  1.  **Hypomanic "Yes" to Naming:**
      *   *Initial Consent (Hypomanic):* **Likely Invalid.** Hypomania can impair judgment, risk assessment, and impulse control, undermining *substantial autonomy* and *material understanding* at the time.
      *   *Later Withdrawal:* Her current clear-headed "no" is decisive. The initial impaired consent doesn't bind her. Principle: **Ongoing** consent matters; she withdrew it.
      *   *Verdict:** Honor her withdrawal. The initial consent was likely invalid, and regardless, she has withdrawn current consent.

  2.  **Drunk "Yeah Fine" & Next Day "Still Fine":**
      *   *Initial Consent (Drunk):* **Invalid.** Impaired capacity.
      *   *Later Confirmation (Sober):* **This is likely *new* consent.** The "still fine" text, if clear and voluntary, constitutes a *new*, autonomous agreement made with capacity. It's not "repairing" the broken consent; it's giving valid consent *after* the impairment has passed.
      *   *Verdict:** The quote *can* be used based on the *later, sober confirmation*. The initial slurred "yes" itself was invalid, but it's superseded.

  **The Core of "She Consented":**

  Yes, there is a core. It's the **affirmative, autonomous permission for a specific act, grounded in understanding, given freely.** The "unrelated complaints" (pushing, lying, not-getting-it) aren't separate; they are the specific *ways* this core principle is violated:

  *   **Pushing/Threats?** Violates **Voluntariness**.
  *   **Lying?** Violates **Material Understanding**.
  *   **Not-Getting-It (Impairment)?** Violates **Substantial Autonomy**.
  *   **Doing Something Different?** Violates **Specificity**.
  *   **Ignoring a "Stop"?** Violates **Ongoing** nature.

  **"She consented" means her autonomous will, based on understanding, freely aligned with the action taken.** When we say consent was invalid, we're saying that alignment was broken by a failure in one or more of these core elements. Your cases brilliantly illustrate how these elements interact and where the boundaries get tested. The principle above provides a framework to analyze those boundaries consistently. Good luck with the piece! This is crucial journalism.
