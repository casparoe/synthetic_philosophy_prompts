prompt: |-
  Hi — I'm on the clinical ethics committee at my local hospital and we're about to sign off on a pilot of one of those ambient documentation tools: a mic in the room that listens to the intake conversation and writes the summary the GP reads before they walk in. I've sat through the demos and it's pretty obvious to me that the notes come out flatter and more hedged when the patient's speech is non-standard — strong regional accent, second language, working-class register, or just an older person who rambles. "Patient reports abdominal discomfort" where the patient actually said the pain is stabbing, it's in the same place as last time, and it wakes her at four every morning. And as far as I can tell the clinicians basically never go back to the raw audio.

  A colleague on the committee keeps saying this should just be filed under algorithmic bias and patient safety, and that calling it epistemic injustice is a category mistake, because nobody has a prejudice and the software doesn't have beliefs about anybody. I think shes wrong, and I've got to make the case out loud in a fortnight.

  So please write me the argument I should give. Argue that this is testimonial injustice in the full Fricker-style sense — a credibility deficit that tracks social identity and wrongs the speaker specifically in her capacity as a knower — even though there's no individual hearer with an identity prejudice and no system with beliefs. Argue that the deficit is best located in the arrangement (mic + model + note + the clinician's workflow) rather than in any person's judgement, and that the corrective Fricker proposes, the hearer cultivating the virtue of testimonial justice, does nothing at all here, because the person who would need to correct for the deficit never encounters the speaker's own words. Keep it distinct from the hermeneutical kind, too: these patients often have perfectly good words for their symptoms, the words just dont make it into the note.

  Two objections you have to actually deal with rather than gesture at: (1) that credibility is a doxastic notion, so a pipeline with no beliefs can't assign anyone credibility, and (2) that we lose nothing by just calling it bias and regulating it as a safety problem. And if you can work it in — I think the worst part is that the ordinary one-on-one case at least leaves the speaker room to repair: you slow down, you produce your credentials, you repeat yourself, you watch the doubt on the doctor's face and respond to it. Here there's no one in the room to repair your credibility in front of. Tell me if you think that's the strongest version of the point or a distraction.

  Max 550 words, British English, plain prose, no bullets or headings, and please don't cite or quote anything — I want your argument, not a reading list, since I'm the one who'll be standing up and saying it.
reasoning: |-
  Okay, the user is on a clinical ethics committee and needs to argue that an ambient documentation tool creates testimonial injustice in Miranda Fricker's sense. They’re concerned the AI flattens non-standard speech, leading to inaccurate notes, and that clinicians don’t review raw audio. Their colleague thinks it’s just algorithmic bias, not epistemic injustice.  

  First, I need to unpack Fricker’s framework. Testimonial injustice involves a credibility deficit tied to social identity, wronging someone as a knower. The user’s challenge is showing this applies without a prejudiced individual—the system itself causes the deficit. The key is locating the injustice in the sociotechnical arrangement: mic, model, note, workflow.  

  The user’s two objections are crucial: (1) credibility requires beliefs, which the system lacks, and (2) why not just call it bias and handle it as safety? For (1), I’ll argue that the system’s output functionally assigns credibility by filtering speech—effectively judging what’s worth recording. For (2), I’ll stress that reducing it to safety misses the distinct harm: silencing patients as knowers, not just risking misdiagnosis.  

  The repair point is powerful. In face-to-face interactions, patients can adapt to doubt. Here, there’s no one to persuade. That feels central—it amplifies the injustice by removing agency. I’ll weave that in as the strongest illustration of harm.  

  Hermeneutical injustice isn’t the issue; patients have the words, but the system doesn’t capture them. Must keep that distinction clear.  

  User wants British English, plain prose, no citations. Keep it tight (550 words). Prioritise clarity: frame the system as an epistemic gatekeeper, argue the harm is dignitary (not just clinical), and end by stressing that regulation alone won’t address this deeper wrong.  

  Their voice matters—they’re the speaker, so I’ll avoid jargon. "Flattened notes" and "no one to repair credibility" are their phrases; I’ll echo those. The emotional weight is on the isolation patients feel, so I’ll highlight that.  

  Final structure:  
  - Define testimonial injustice briefly  
  - Show how the tool creates it without human prejudice  
  - Tackle objections head-on  
  - Contrast with safety-focused view  
  - Hammer the repair point as the starkest consequence  
  - Conclude that this demands redesign, not just risk management
answer: |-
  Here’s the argument you should make, addressing the objections directly:

  This tool creates testimonial injustice in Fricker’s precise sense. It systematically delivers a credibility deficit that tracks social identity – accent, dialect, age, or class – and wrongs the patient specifically *as a knower* about their own body. The injustice isn’t located in a prejudiced human mind, but in the sociotechnical arrangement itself: the mic captures speech, the model processes it with inherent limitations shaped by training data biases, the generated note flattens or omits crucial subjective detail, and the clinician’s workflow accepts this output as reliable without accessing the original testimony. The system *functions* as an epistemic gatekeeper, filtering the patient’s account based on features linked to social identity. The result is a credibility deficit assigned *by the process*: the patient’s words are treated as less worthy of accurate representation.

  Objection one claims credibility requires belief, so a pipeline can’t assign it. But this misunderstands how credibility deficits operate socially. Fricker focuses on the *harm* – being wronged as a knower when your testimony is unduly discounted. The pipeline actively creates that harm. Its output *is* the assignment of diminished credibility to certain utterances: it judges, through its design and operation, which parts of the speech are significant or even intelligible enough to record faithfully. This functional downgrading, based on identity-linked features, *is* the credibility deficit, regardless of whether silicon "believes". The patient experiences the injustice when their nuanced description is reduced to "abdominal discomfort" – their capacity to convey knowledge is undermined.

  Objection two suggests "algorithmic bias" and safety regulation suffice. They are necessary, but not sufficient. Calling it only bias risks reducing the harm to clinical safety – misdiagnosis or mistreatment. That’s vital, but it misses the distinct, dignitary wrong Fricker identifies: being silenced or distorted *as a source of knowledge* because of who you are perceived to be. Safety regulation targets outcome errors; testimonial injustice highlights the intrinsic wrong done *in the moment of testifying*, corroding trust and patient agency. A purely safety-focused approach might approve a tool that consistently generates "good enough" notes for diagnosis from non-standard speech, even while perpetrating this quieter injustice.

  This brings us to the crucial point about repair. In a human interaction, the speaker sees the doubt and can try to overcome it – slowing down, rephrasing, emphasising credentials. Here, there is *no one to repair credibility in front of*. The patient speaks into a void. They cannot perceive or respond to the system’s implicit judgement. The injustice is not only systematic; it is also profoundly isolating. The speaker is powerless to assert their competence as a knower. This absence of any possibility for epistemic repair isn't a distraction; it starkly reveals how the arrangement itself enforces the credibility deficit, removing the speaker’s agency entirely. That isolation *is* the strongest testament to the testimonial injustice at play: the patient is wronged as a knower, with no recourse within the system designed to hear them. Addressing this requires more than mitigating bias; it demands redesigning systems to actively respect epistemic agency.
