prompt: |-
  I'm presenting a paper at a normative ethics workshop next week, and I want a Q&A prep sheet rather than a defense of the view.

  The thesis I'm defending: the separateness of persons objection to utilitarianism is best reconstructed as a claim about *complaint units* — a loss to one person is not automatically outweighed by a larger gain to another, because the two do not fall within a single standpoint from which they could be traded off against each other — and the boundary of a complaint unit is not the boundary of a human organism but the reach of a unified deliberative standpoint. Two consequences I argue for: (1) aggregation can fail *within* a life when that life lacks deliberative unity (I use a case of dense, permanent amnesia that destroys psychological continuity between successive stretches of one person's life, and a hypothetical case of "serial selves" who share a body and a memory store but never deliberate together); (2) aggregation can succeed *across* persons when agency is genuinely pooled through joint intention and shared deliberation, so that the standard contractualist reading over-intellectualizes the objection by tying it to the distinctness of persons as such.

  The room is about twelve people. Four or five prioritarians and person-affecting theorists of the "competing claims" stripe: sympathetic to the diagnosis, hostile to my first extension, since their view licenses free aggregation within a life and needs that. Three act-utilitarians of the no-independent-constraints sort, who think the whole objection is question-begging and that my "complaint unit" is a name for the intuition I am supposed to be arguing for. Two Kantian constructivists who think duties are not derived from any trade-off or aggregation picture at all, and that "the separateness of persons" is a slogan rather than an argument. A couple of agnostics who will follow whichever objection sounds strongest in the room.

  Draft the prep sheet as a table with columns: objection (phrased as that camp would phrase it, so I recognize the vocabulary when I hear it) | who raises it | which of my two claims it targets | two-minute reply | where the reply is soft. Order the rows by how likely and how damaging each objection is, not by the room's seating. Before the table, tell me what I should concede in the first two minutes and what I should refuse to give up; after it, tell me which single objection I have to answer well rather than hope nobody raises, and the one question I am hoping nobody asks.

  Be explicit about epistemic status throughout: mark which of my claims are near-orthodox among people who work on these topics, which are genuinely contested, and where my own reconstruction is sufficiently novel that I should present it as a proposal rather than as something the literature supports. I do not want to walk in thinking a contested reading is the consensus one, or that my two extensions are more established than they are.

  American English, please. End with a final line reading: Most damaging: \answer{short label, five words or fewer}.
reasoning: |-
  Hmm, the user is preparing for a normative ethics workshop presentation. They need a Q&A prep sheet focused on objections to their thesis about the separateness of persons objection to utilitarianism. Their core idea is that complaint units are defined by deliberative unity rather than biological personhood, which challenges traditional views on aggregation both within and across lives.

  The audience composition is varied: prioritarians/person-affecting theorists, act-utilitarians, Kantians, and some agnostics. Each group will likely raise different objections based on their theoretical commitments. I need to map out the most probable and damaging objections for each camp.

  For prioritarians/person-affecting theorists (4-5 people), they'll likely attack the intra-life non-aggregation claim since it undermines their framework that relies on free aggregation within a life. The objection should frame my position as violating the "special concern" we owe to our future selves. My reply must emphasize phenomenological disunity while conceding some intuition about biological continuity.

  For act-utilitarians (3 people), they'll challenge the foundational complaint unit concept itself. Their objection will be that I'm presupposing what needs arguing - that trade-offs require a unified standpoint. My reply should position this as explanatory rather than justificatory, using contractualist-friendly language to show this reconstruction makes sense of existing intuitions.

  For Kantian constructivists (2 people), they'll reject the entire aggregation framework. Their objection will focus on my methodology being fundamentally misguided. My reply needs to acknowledge their metaethical concerns while maintaining the reconstruction's value for debates within welfarist consequentialism.

  I need to include strategic guidance upfront: what to concede early (that biological persons matter pragmatically) vs. what to hold firm (the deliberative unity criterion). Also flag epistemic status clearly - the core complaint unit concept is developed but contested, while intra-life non-aggregation is highly novel and likely controversial. The cross-life aggregation claim is moderately novel but has some precedents in joint intention literature.

  The most damaging objection would be from prioritarians attacking intra-life non-aggregation - if I can't defend this well, it collapses my key innovation. The question I hope nobody asks is about degrees of deliberative unity, as that exposes a major vulnerability in my account. I'll structure this as a table with all these elements, ending with clear labels for the critical points.
answer: |-
  Here's your Q&A prep sheet, structured for rapid recognition and response during the workshop. The table is ordered by likelihood and potential damage of objections, with explicit epistemic flags.

  **Strategic Opening Concessions & Non-Negotiables (First 2 Minutes):**

  *   **CONCEDE:** (1) The *pragmatic* significance of biological persons as standard (often reliable) proxies for identifying complaint units in real-world contexts. (2) That the "separateness of persons" *slogan*, as commonly used, often *presupposes* biological boundaries, even if my reconstruction argues it shouldn't.
  *   **REFUSE TO GIVE UP:** (1) The core claim that the *normative force* of the separateness objection fundamentally depends on the *deliberative unity* of a standpoint being the boundary for permissible trade-offs, not biology per se. (2) That this reconstruction provides the *best explanation* for both the core objection's intuitive force *and* the problematic edge cases (intra-life disunity & cross-life unity).

  **Q&A Prep Table:**

  | Objection (Phrased in Camp Vocabulary)                                   | Who Raises                     | Targets             | Two-Minute Reply                                                                                                                                                                                             | Soft Spots / Concessions in Reply                                  |
  | :----------------------------------------------------------------------- | :----------------------------- | :------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------- |
  | "Your intra-life non-aggregation violates the 'special concern' we owe our *future selves*; it fragments the person in a way that denies the rational unity essential for prudential reasoning & planning." | Prioritarians / Person-Affecting | Claim (1): Intra-life | **Reply:** Prudential reasoning *presupposes* deliberative unity. Amnesia/Serial Selves cases *lack* this unity – there *is no single standpoint* for the 'future self' to be *my* concern. The biological unit houses *distinct normative subjects*. Special concern tracks the deliberative subject, not just the body. *[Epistemic Status: Claim 1 is highly novel/contested – present as an implication of the core proposal, not established orthodoxy.]* | Concedes the *default* link of special concern to biological persons; relies on intuitions about extreme disunity cases holding up. |
  | "You're begging the question. 'Complaint units' defined by deliberative unity *just are* the intuition that losses to one can't be traded for gains to another. You haven't *argued* why this should be the case, you've just relabeled the intuition utilitarians reject." | Act-Utilitarians               | Core Complaint Unit | **Reply:** The reconstruction *explains* *why* the intuition arises: trade-offs require a standpoint where gains/losses are commensurable *for* a subject. If no unified subject experiences both, the trade-off lacks justification *from any perspective*. It's not just relabeling; it provides a *diagnostic framework* for *when* aggregation feels permissible (within a standpoint) vs. impermissible (across standpoints). *[Epistemic Status: Core Complaint Unit concept is a contested reconstruction of the objection – present as a proposal, though drawing on contractualist/Scanlonian ideas.]* | Doesn't *prove* utilitarians wrong; frames the debate in terms of explaining intuitions rather than deriving duties from first principles. |
  | "Your 'pooled agency' argument licenses unacceptable exploitation. Couldn't any group claim their 'shared deliberation' allows sacrificing one member for the greater group good?" | Prioritarians / Agnostic       | Claim (2): Cross-life | **Reply:** Genuine pooled agency requires *actual, robust joint intention and deliberation* where members see themselves as co-authors of shared goals, *not* mere coordination or coercion. Sacrificing a member would violate the very shared standpoint they helped constitute. Contractualism (Scanlon) already recognizes duties to participants in cooperative schemes. *[Epistemic Status: Claim 2 is moderately novel/contended – present as a logical extension of the core proposal, supported by literature on joint action (Bratman, Gilbert).]* | Defining "genuine" pooled agency is fuzzy; risks being overly permissive if criteria aren't stringent enough. |
  | "The entire 'complaint unit/trade-off' framework is misguided. Duties (especially constraints) arise from the *relational* status of persons as ends-in-themselves within a kingdom of ends, not from aggregating complaints or gains within standpoints. 'Separateness' signifies this irreducibly relational moral status." | Kantian Constructivists        | Core Framework      | **Reply:** My project reconstructs the *distinct objection to utilitarianism* framed in terms of aggregation and interpersonal trade-offs. This reconstruction aims to show *why*, *within consequentialist/aggregative frameworks*, separateness bites. It doesn't preclude your Kantian view; it offers a different lens on a specific debate. *[Epistemic Status: Explicitly a reconstruction within welfarist/consequentialist debates – not presented as a full moral theory.]* | Concedes the objection targets the *scope* of the reconstruction; doesn't engage the Kantian meta-ethics head-on. |
  | "In your amnesia case, why isn't the biological person's *overall lifetime well-being* the relevant metric? We still treat them as one person legally/morally for many purposes. Doesn't this show the biological boundary retains normative priority?" | Prioritarians / Agnostic       | Claim (1): Intra-life | **Reply:** Legal/practical identity tracks biological continuity for good reasons. *Normatively*, however, the *reason* we resist trading a severe loss in one period against a larger gain in another *for the same biological entity* disappears if there's no experiential or agential connection. The "lifetime well-being" perspective is only normatively compelling *if* there's a standpoint that cares about it – which is missing in these cases. *[Epistemic Status: Highlights the contestation around Claim 1; reinforces it's a normative, not practical, claim.]* | Admits practical/legal coherence of biological personhood; relies on the normative pull of the disunity description overriding practical unity. |
  | "Your view implies wildly counterintuitive obligations. If two people deeply deliberate together about their shared project, do they suddenly lose complaint-based protections against being sacrificed *by outsiders* for the greater good? Or only against each other?" | Agnostic / Prioritarians       | Claim (2): Cross-life | **Reply:** Pooled agency primarily affects complaint units *relative to the shared project/goal*. It means gains/losses *within* the project can be aggregated *from the shared standpoint*. It doesn't automatically dissolve their separate complaint units *vis-à-vis the rest of the world* or concerning goods unrelated to the shared project. Outsiders still cannot sacrifice one member for unrelated gains. *[Epistemic Status: Requires careful delineation of the *scope* of the pooled standpoint – an area needing further development.]* | Scope limitation is crucial but potentially ad hoc; requires clear criteria for when the pooling applies to *which* potential sacrifices. |
  | "Isn't deliberative unity a matter of degree? How much unity is needed to form a complaint unit? This seems to make aggregation permissions vague and context-dependent." | Agnostic / All                | Core Concept        | **Reply:** You're right, unity is often scalar. The core cases (full psychological continuity vs. dense amnesia/serial selves; robust joint intention vs. mere coordination) are paradigmatic poles. Real-world cases require judgment. However, the *conceptual point* stands: when unity is *sufficiently absent* (paradigm cases), aggregation fails; when *sufficiently present* (paradigm cases), it can succeed. The framework clarifies the *relevant criterion*. *[Epistemic Status: Acknowledges a genuine challenge to the core proposal's application; positions it as offering a clearer criterion than biology, even if fuzzy at the edges.]* | Concedes vagueness at the margins; the "sufficiently" threshold is underspecified. |

  **Critical Objection to Answer Well (Don't Hope It's Ignored):**
  *   **The Prioritarians' "Special Concern" Objection (Targeting Intra-Life Non-Aggregation):** This is the most direct attack on your most radical claim (Claim 1). If you can't defend this robustly against sympathetic critics, your core innovation collapses, and your reconstruction loses much of its distinctive force. Prioritarians *need* intra-life aggregation for their view to function.

  **The Question You Hope Nobody Asks:**
  *   **"Can you provide a clear, non-circular criterion for 'deliberative unity' or 'unified standpoint' that is *independent* of our intuitions about when aggregation is permissible? Doesn't your reconstruction risk just mapping our pre-existing aggregation intuitions onto standpoints?"** This cuts to the heart of whether your reconstruction genuinely *explains* the separateness intuition or merely redescribes it in potentially question-begging terms. It's difficult to answer without appealing to the very intuitions the reconstruction is meant to clarify or to vague phenomenological descriptions. (Likely Raisers: Sharp Act-Utils or Kantians).

  **Most damaging: \answer{Prioritarian Special Concern Attack}**
