prompt: |-
  For the past year I have been working through the ethics-of-belief literature on my own — James, Clifford, and the more recent work on pragmatic reasons for belief — because of an argument I keep having, and I have come to think that the argument is not really about what either of them was arguing about.

  Three instances. A teacher is told that a randomly selected pupil is about to spurt; she gives that child harder work and more attention; the child improves. Someone decides that a new colleague is trustworthy and hands over something risky; the trust draws out the reliability. The participants in a campaign become convinced that winning is possible; the conviction recruits the people who make it possible.

  In each case the belief causes the state of affairs that makes it true — but only while the believer is not treating the belief as an instrument for producing that state of affairs. Tell the teacher the selection was random and she cannot sustain the expectation. Tell the trusting person to trust in order to elicit reliability and the stance collapses. A conviction adopted openly as a recruiting device recruits no one. Contrast an ordinary self-fulfilling prophecy — a run on a bank, a collapsing currency — where full publicity about the mechanism dissolves nothing and may make things worse: there the belief survives being seen through.

  Is there an established name for the first configuration, or for the contrast between the two? I am not after a bare label. I want to know how the first differs from James's genuine options, where the evidence cannot settle a forced, live and momentous question and where the truth of the matter does not depend on how one bets, and how it differs from claims about practical stakes raising the standards for knowledge; whether the difference I am pointing at is one distinction or several; and what an ethics of belief should say about the first kind, given that the belief is true, that its fruits are evidence of it, but only after the fact, and that telling the holder how it works seems to damage something.

  Please answer in four titled sections, in this order: "Name, if there is one" (about 100 words); "Neighbours and non-neighbours" (about 200 words); "The distinction, defined, with boundary cases" (about 250 words — include beliefs held by a group rather than a person, and beliefs whose opacity can be restored by self-deception or deliberate ignorance); "Verdict for an ethics of belief" (about 150 words).
reasoning: |-
  Hmm, the user has been deeply immersed in ethics-of-belief literature—James, Clifford, recent pragmatism—and presents a fascinating puzzle about self-fulfilling beliefs that only work when their mechanism is hidden. They describe three scenarios: a teacher's expectation improving a randomly selected student, trust eliciting reliability only when genuine, and campaign conviction recruiting supporters only when authentically held. Crucially, these collapse if the believer treats them instrumentally, unlike bank runs that persist even when understood. 

  The user wants this phenomenon named, differentiated from James' genuine options (where truth doesn't depend on belief) and pragmatic encroachment (where stakes raise knowledge standards), and guidance for belief ethics given the belief's retroactive validation and fragility. Their core tension: such beliefs are factually true post-hoc but require a kind of "good faith" that seems philosophically unstable.

  I recall similar concepts: Basil Mitchell's "self-validating beliefs" in theology, Jon Elster's "states that are essentially by-products," and Robert Merton's self-fulfilling prophecies (which ironically include the bank-run counterexamples). But none perfectly fit the opacity requirement. The closest is Elster's framework about states ruined by instrumental pursuit—like spontaneity or sleep. This seems central: the belief must be held for "truth-reasons," not pragmatic ones, to function.

  Distinguishing from James: his "will to believe" applies when evidence is inconclusive but truth fixed, whereas here belief literally creates truth. Against pragmatic encroachment: that theory adjusts justification standards for practical costs, but doesn't address truth-generation. The fragility to transparency suggests a unique category—perhaps "opaque self-fulfilling beliefs."

  Ethically, Clifford's evidentialism would condemn these as epistemically irresponsible. James might permit them as "forced options" with good outcomes, but their instrumental nature complicates this. A middle path: permit them only when (1) the outcome is morally significant, (2) alternatives are worse, and (3) the believer cultivates "as-if" sincerity without full self-deception. Still, the risk of bad faith looms—especially in group contexts where collective enthusiasm might mask manipulation.

  Notably, the user's cases all involve moral goods (education, trust, social change). This might justify pragmatic permission, but with vigilance: using such beliefs as tools corrupts their mechanism. The ethics must balance consequence against intellectual integrity, perhaps treating them as exceptional "moral technologies" with built-in obsolescence (they fail once successful).
answer: |-
  Here is a response structured as requested:

  **I. Name, if there is one**

  There isn't a single universally established term, but the phenomenon is recognized. Philosopher Jon Elster's concept of **"states that are essentially by-products"** (from *Sour Grapes*, 1983) is highly relevant. He describes states (like spontaneity, sleep, or, crucially, *sincerely held belief*) that cannot be attained by directly aiming for them, as the aiming itself undermines the state. Robert K. Merton's classic "self-fulfilling prophecy" is broader, encompassing both your transparent cases (bank runs) and these opaque ones. Your specific configuration – a self-fulfilling belief whose efficacy *depends* on the believer *not* seeing it as instrumental – might be termed an **"opaque self-fulfilling belief"** or an **"Elsterian self-fulfilling belief"**, emphasizing the necessity of non-instrumental motivation for its success.

  **II. Neighbours and non-neighbours**

  *   **James's Genuine Option:** James permits belief without conclusive evidence for "forced, living, and momentous" options where the truth is *independent* of the belief (e.g., believing God exists doesn't *cause* God to exist). Your cases differ fundamentally: the belief's truth-value *is* causally dependent on sincerely holding it. James's believer *discovers* a pre-existing truth; yours *creates* the truth through belief (but only if non-instrumental).
  *   **Pragmatic Encroachment:** This argues practical stakes can raise the *evidential threshold* needed for knowledge or justified belief (e.g., needing more evidence to believe a plane is safe before boarding vs. idly wondering). It concerns justification standards based on risk, not the *causal mechanism* by which a belief makes itself true. Your cases involve a unique causal structure, not just heightened evidence requirements.
  *   **Ordinary Self-Fulfilling Prophecies (Merton):** Bank runs and currency collapses *are* neighbours – beliefs causing their own truth. However, they form a distinct sub-type where the mechanism is *transparent* and often *strategic*. Belief persists because individuals act *based on* the prophecy being common knowledge (e.g., withdrawing money *because* others will). In your cases, transparency *destroys* the causal efficacy of the belief itself.

  **III. The distinction, defined, with boundary cases**

  The core distinction is between **Transparent** and **Opaque Self-Fulfilling Beliefs (SFBs)**:
  1.  **Transparent SFB (Bank Run):** Belief that P causes P *even when* the believer(s) are aware that their belief is causing P and may hold it *because* they foresee this causal link. Belief survives instrumental adoption. Mechanism is robust to publicity.
  2.  **Opaque SFB (Teacher/Trust/Campaign):** Belief that P causes P *only if* the believer holds the belief non-instrumentally – that is, primarily for what they take to be truth-related reasons. Instrumental adoption (believing *in order to* cause P) or full awareness of the mechanism *undermines the belief's causal power to bring about P*. The belief must be held "in good faith," seeing P as independently true *before* the belief acts.

  *   **Boundary Cases & Complications:**
      *   **Group Beliefs:** A campaign's collective conviction is opaque. If leaders privately see it as *just* a recruitment tool but foster authentic belief in followers, the *followers'* sincere belief might still work. However, if the *core group's* instrumentalism leaks, authenticity collapses. Transparency for key actors often poisons the well.
      *   **Restoring Opacity via Self-Deception/Ignorance:** This is precarious but possible. The teacher, knowing about the Pygmalion effect generally, might deliberately avoid scrutinizing *why* she believes *this specific* child will spurt, focusing only on "evidence" she interprets favorably. The truster might actively suppress doubts about the colleague's reliability to maintain the trusting stance. This involves cultivating a kind of motivated ignorance or biased evidence-gathering to *sustain* the non-instrumental *feeling* necessary for the belief to work. Ethically, this is highly problematic.
      *   **Partial Transparency:** A teacher might know the *general* Pygmalion effect exists but *genuinely* believe *this specific* child shows unique promise. The specific belief can remain non-instrumental ("I see *her* potential") even with general knowledge, unless she explicitly links them.

  **IV. Verdict for an ethics of belief**

  An ethics of belief faces a dilemma here. Cliffordian evidentialism condemns these beliefs: they lack adequate prior evidence and often require cultivating ignorance. However, they *become* true and produce significant goods *precisely because* they were held sincerely on initially insufficient evidence. Jamesian pragmatism might permit them as momentous "forced options" where belief creates a vital good. Yet, their *instrumental value depends on non-instrumental adoption*, creating a performative contradiction if adopted *for* that value. A nuanced verdict might be: **Provisional, context-dependent permission.** If the potential good is significant, alternatives are worse, and the belief is *plausible* (not absurd), one might permissibly *lean into* existing nascent belief or hope, fostering it *as if* it were evidentially grounded, while rigorously avoiding outright self-deception or deliberate ignorance. The ethical tightrope involves fostering beneficial conviction without corrupting intellectual integrity. Success retroactively *vindicates* the belief pragmatically ("it worked!") but not necessarily evidentially *ex ante*. Transparency's destructive power underscores the fragility of this justification.
