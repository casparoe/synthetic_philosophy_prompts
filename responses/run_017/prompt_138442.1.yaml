prompt: |-
  Hey — I'm a reporter, I cover science and ideas now but I spent about six years on the labor beat before they moved me, so I know my way around a mediation room: BATNAs, the zone of possible agreement, the mediator shutteling between caucus rooms to get each side to shave something off it's maximum demand, strike deadlines, pattern settlements that the next local in line will copy, ability-to-pay arguments, and the fact that whatever you land on has to survive a ratification vote. I'm working on a piece about what happens when software agents negociate with each other on people's behalf, and everyone I interview tells me the serious thinking about this is in the axiomatic bargaining literature, which I cannot read. So: take the old Nash solution and the Kalai-Smorodinsky alternative that was built to fix it, and translate that whole dispute as faithfully as you can into the vocabulary I just listed. What is the feasible set in a room with a mediator in it? Is the disagreement point the BATNA, or is it what happens when the clock runs out and both sides are worse off than any deal — and does the theory care which, given that my sources spend most of their working lives trying to move it? What does Nash's independence-of-irrelevant-alternatives amount to when I'd put it as "a demand the other side could never have gotten anyway shouldn't change what you settle on"? And what is Kalai-Smorodinsky's monotonicity axiom really demanding, if my gloss is "if the company's best conceivable outcome just got better, the union's settlement ought to get better too, even though nothing actually on the table changed"? Also please state plainly what each solution picks — I've been told one of them is basically "both sides give up the same fraction of their maximum demand," and I want to know whether that's right or whether I've flattened something.

  Then the part I actually need, which is the residue report: tell me what does not survive the translation. My own hunches, which I fully expect to be half wrong: (a) my whole vocabulary quietly assumes a common measuring stick — dollars, percentages, headcount — and I'm told the theory is built so that you can rescale each side's utility separately without changing the answer, which if true makes "split the difference" and "each side concedes proportionally" completely different claims and makes at least one of them inadmissible; (b) "the company can afford it" and "the members will never ratify that" are doing real work in every negotiation I've covered, and I can't find the slot for either in a model that apparently only has a feasible set and a disagreement point; (c) we can't offer two parties a coin flip between two contracts, which I suspect is what lets them assume the feasible set is convex, so something important may be riding on an assumption that's just false on my beat. Also, separately, people keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one, and I'd like to know whether that's even a meaningful thing to say or whether I'm projecting a mediator's intuition onto a machine. Tell me which of these are genuine residue, which are just me misunderstanding the model, and — this is the bit I care about most — give me the mismatches I haven't thought of, especially anything my vocabulary lets me say that theirs can't, or anything they say that turns out to be empty once it's in my language. I'd much rather hear "that distinction of theirs has no counterpart for you" than get a tidy translation that quietly changed the subject.
reasoning: |-
  Okay, this reporter is diving deep into bargaining theory for their piece on software agents negotiating. They've got a solid labor mediation background but need help translating Nash and Kalai-Smorodinsky solutions into their real-world vocabulary. 

  First, I need to map their mediation terms to bargaining theory concepts. The feasible set is clearly the "zone of possible agreement" - all deals both sides would accept over their BATNA. The disagreement point is exactly what happens when the clock runs out, which aligns with BATNA in their world. 

  For Nash's independence of irrelevant alternatives, their "demand the other side couldn't get anyway" gloss is spot on. Kalai-Smorodinsky's monotonicity axiom does match their "company's better outcome should lift union's settlement" intuition too. And yes, Kalai-Smorodinsky is indeed about proportional concessions, while Nash is about maximizing the product of gains.

  Now the residue report they want is crucial. Three hunches: 
  First, the "common measuring stick" issue is real - bargaining theory uses utility which isn't directly observable, making proportional concessions ambiguous in practice. 
  Second, ratification constraints and ability-to-pay are external constraints that shape the feasible set but aren't in the pure model. 
  Third, the convexity assumption does fail when we can't offer probabilistic mixtures of deals.

  What they might be missing: 
  The theory's symmetry axiom assumes identical bargaining power, which never holds in real labor talks. 
  Also, their vocabulary captures dynamic moves of the disagreement point, while the models treat it as fixed. 

  On automated agents preferring proportional concessions - that's plausible because Kalai-Smorodinsky feels more "fair" to humans, but the reporter's right to question whether machines care. The key is that proportional concessions require interpersonal utility comparisons, which their labor vocabulary implicitly makes but the theory avoids.

  The biggest untranslatable concept is how bargaining theory's "utility" abstracts away all the emotional/political dimensions they see in ratification votes. That's not a flaw - it's the point of abstraction - but they should flag it in their piece.
answer: |-
  Here's the translation you requested, followed by a residue report identifying what gets lost or distorted. I'll strictly use your labor mediation vocabulary to explain Nash and Kalai-Smorodinsky, then dissect the mismatches.

  **The Translated Dispute: Nash vs. Kalai-Smorodinsky in the Mediation Room**

  1.  **The Stage:**
      *   **Feasible Set = Zone of Possible Agreement (ZOPA):** All possible contracts (wage increases, benefit packages, etc.) that *both* sides would ratify over simply walking away. It's the set of all deals the mediator could potentially get both parties to sign *before* the strike deadline hits.
      *   **Disagreement Point = What Happens When the Clock Runs Out:** This is the BATNA *for both parties combined* if they utterly fail to agree by the deadline. It's the strike/lockout outcome – picket lines, lost wages, halted production, potential long-term damage. The theory absolutely cares about moving this point! Moving the union's BATNA (e.g., stronger strike fund) or the company's BATNA (e.g., scab labor pool) *shifts the whole negotiation* by changing what "no deal" looks like. A worse strike outcome for both makes more deals acceptable.

  2.  **The Nash Solution (What the Mediator Proposes):**
      *   **The Rule:** Find the deal within the ZOPA that gives both sides the *largest possible product* of their gains over walking away. Think "maximize the *joint improvement* relative to the disaster scenario."
      *   **What It Picks:** The deal where the *concessions* each side makes *relative to their absolute maximum demand* are interdependent and determined by the shape of the ZOPA. It's **NOT** "split the difference" or "concede the same percentage." It heavily depends on how much one side *has* to give up to get the other side to accept anything significantly better than the strike. If the union has a much stronger BATNA (can weather a long strike), the Nash solution will favor them more.
      *   **Independence of Irrelevant Alternatives (IIA) Translated:** "If the mediator takes a potential deal *off the table* that was *worse for both sides* than the deal they are currently considering (or simply was never realistically ratifiable by one side anyway), it *shouldn't change* the final settlement they land on." Your gloss ("a demand the other side could never have gotten anyway shouldn't change what you settle on") is precisely correct for this axiom.

  3.  **The Kalai-Smorodinsky Solution (What the Mediator Proposes):**
      *   **The Rule:** Find the deal within the ZOPA where the *percentage* of each side's *potential maximum gain* (over the strike) that they actually achieve is *equal*. It draws a line from the strike outcome (disagreement point) to the "utopia point" (the *best each side could possibly get* if they got everything they wanted *and* the other side capitulated completely *within the ZOPA*), and picks the deal where this line hits the ZOPA boundary.
      *   **What It Picks:** **Yes, your source is largely correct.** It's fundamentally about **equal proportional concession** or **equal relative gain**. If the union's best possible achievable wage increase over the strike is 10% and the company's best possible achievable cost savings over the strike is 5%, Kalai-Smorodinsky finds the deal where the union gets, say, 7% (70% of their max gain) and the company saves 3.5% (70% of *their* max gain). Both "give up" 30% of their maximum *potential* gain from the ideal outcome within the ZOPA.
      *   **Monotonicity Axiom Translated:** "If the mediator discovers that the ZOPA has expanded *only in favor of one side* – meaning that side can now potentially get a *much better outcome* without making things any *worse* for the other side compared to before (e.g., company profits surge, making higher wages financially possible without changing the union's ratification threshold), then the final settlement *should* give that side a better deal, *and crucially, it should also give the other side a better deal too*." Your gloss ("if the company's best conceivable outcome just got better, the union's settlement ought to get better too") captures the core demand perfectly. Even though no *current* offer changed, the *potential* changed, forcing a rebalancing towards equal proportional gains.

  **The Residue Report: What Doesn't Survive the Translation**

  Your hunches are sharp. Here's the breakdown:

  1.  **The Invisible Yardstick Problem (Your Hunch A - GENUINE RESIDUE):**
      *   **Yes:** Bargaining theory uses abstract, unobservable "utility." Your world uses concrete, measurable items (dollars, %, headcount). This is the **biggest residue**.
      *   **Consequence 1: "Proportional Concession" is Ambiguous.** Kalai-Smorodinsky requires comparing *relative gains* on each side's *own* utility scale. Translating this to "concede 30% of your wage demand" assumes we can linearly map utility to dollars. If the union cares intensely about the first 2% but less about the next 8%, a 5% increase isn't "50% of their max gain" in utility terms. Your vocabulary *forces* a common, linear scale (dollars), making "equal proportional concession" seem concrete, while the theory intentionally avoids this. **This makes "split the difference" (common scale) and "each side concedes proportionally" (individual scales) fundamentally different and potentially incompatible claims within the theory.**
      *   **Consequence 2: Rescaling Invariance is Invisible (and Possibly Distorting).** The theory says changing how you *measure* utility (e.g., converting cents to dollars, or adding a fixed bonus) shouldn't change the solution. In your world, changing the *unit* (cents vs dollars) obviously wouldn't change the dollar outcome, but changing the *meaning* (e.g., is "1 util" = $100 or $200?) is hidden. This invariance ensures the solution depends only on preferences and the ZOPA shape, not arbitrary measurement. Your vocabulary hides this flexibility.

  2.  **Real-World Constraints: Ratification and Ability-to-Pay (Your Hunch B - PARTIAL RESIDUE / PARTIAL MODEL MISUNDERSTANDING):**
      *   **Where They Fit:** These are **fundamental constraints defining the ZOPA's boundaries**, not separate elements.
          *   *Ratification Threshold:* The "worst deal the union would ratify" defines the *union's edge* of the ZOPA. A deal the members won't ratify is *outside* the feasible set.
          *   *Ability-to-Pay:* The "best deal the company can afford without bankruptcy or shareholder revolt" defines the *company's edge* of the ZOPA. A deal that breaks the company is *outside* the feasible set.
      *   **The Residue:** The theory *assumes* these constraints are known and fixed, defining a clear ZOPA. Your world is messier:
          *   Ratification thresholds and ability-to-pay are **uncertain and negotiable** ("Will they *really* strike over this?" "Can we *really* not afford that?"). The mediator works to *shape* these perceptions.
          *   Arguments *about* these constraints ("You can afford it!" "They'll never ratify that!") are **tools to move the other side's perceived boundaries** of the ZOPA. The theory models the final boundaries; your vocabulary captures the dynamic process of *establishing* them.

  3.  **The Coin Flip Problem (Convexity - Your Hunch C - GENUINE RESIDUE):**
      *   **Yes:** The theory **assumes the ZOPA is convex**. Crucially, this allows "lotteries" or probabilistic mixtures: e.g., "We flip a coin: Heads, Contract A (Union favored); Tails, Contract B (Company favored)." This convexity is often essential for proving the existence and uniqueness of solutions like Nash.
      *   **Residue:** **This is generally false on your beat.** Contracts are usually singular, definitive agreements. Offering a literal coin flip between two different wage scales is almost unheard of in labor negotiations. While parties might agree to phased increases or contingent bonuses, the core "package" is usually a single point.
      *   **Consequence:** The mathematical elegance relies on an assumption that doesn't hold in the real-world domain you describe. Solutions derived assuming convexity might not be stable or even exist if the real ZOPA has "holes" or jagged edges that can't be smoothed by randomization. This is a significant limitation of the pure theory for your context.

  4.  **Symmetry & Bargaining Power (A Mismatch You Didn't Mention - GENUINE RESIDUE):**
      *   **The Theory:** Nash assumes symmetry (if the ZOPA is symmetric and BATNAs are equal, the solution splits the utility gains equally). Kalai-Smorodinsky is also symmetric in its treatment of relative gains.
      *   **The Reality (Your Vocabulary):** Your world is saturated with **asymmetric bargaining power**. A strong strike threat, a weak BATNA for management, pattern settlements favoring unions in strong industries – these asymmetries dominate. While the *models* can handle asymmetric ZOPAs and BATNAs, the core "fairness" axioms (Symmetry for Nash, the equal proportion idea in KS) **don't inherently capture raw power dynamics**. Your vocabulary naturally incorporates power ("leverage," "strike deadline pressure," "pattern settlement pressure"); the fairness axioms of the theory often abstract it away or assume it's reflected in the ZOPA shape (which it is, but the *axioms* don't highlight power like your terms do).

  5.  **Static vs. Dynamic Disagreement Point (A Nuance - CLARIFICATION):**
      *   You asked if the theory cares about moving the BATNA/disagreement point. **Absolutely.** The entire solution depends on it. Moving the strike outcome (d) changes the "gains over disagreement" calculation for every point in the ZOPA, directly altering both the Nash product and the Kalai-Smorodinsky ray. Your sources are right to focus on moving it – it's a core lever. The theory treats `d` as given for the solution, but its value is paramount.

  6.  **Automated Agents & Proportional Concessions (Your Final Query):**
      *   **Is it Meaningful?** Yes, it's meaningful. Software agents need a rule to pick a point. They could be programmed with either the Nash rule (maximize product of gains) or the Kalai-Smorodinsky rule (equalize relative gains). They are distinct rules with different outcomes.
      *   **Why KS Might Be Reported as Common:** KS's equal proportional concession has an intuitive "fairness" that might make humans *perceive* it as more natural or acceptable, even if machines don't care about fairness per se. It might also be computationally simpler in some implementations or emerge from specific learning dynamics. Nash can seem counter-intuitively sensitive to irrelevant options or overly favor the party with a concave boundary in the ZOPA. Saying agents "land on" KS outcomes implies they are programmed with or learn that specific rule. It's not *just* projecting mediator intuition; it's plausible based on how agents *could* be designed. However, your caution about the ambiguity of "proportional concession" in concrete terms (Point 1) remains crucial – how do the agents *measure* the proportion?

  **Summary of Key Residues & Mismatches:**

  *   **Your Vocabulary Has, Theory Lacks:** A **single, concrete, observable measuring stick** ($$$). Theory uses abstract, individual, unobservable utility. This makes "proportional concession" concrete for you but ambiguous in the theory.
  *   **Your Vocabulary Has, Theory Lacks:** Explicit **dynamic negotiation over the ZOPA boundaries** (using arguments about ratification/affordability). Theory takes the ZOPA as given.
  *   **Theory Assumes, Your World Lacks:** **Convexity / Ability to Offer Lotteries.** This is a potentially significant mathematical convenience not reflecting your reality.
  *   **Your Vocabulary Emphasizes, Theory Downplays:** Raw **asymmetric bargaining power**. Theory embeds it in the ZOPA/BATNA but its fairness axioms don't foreground it like terms like "leverage" or "strike threat" do.
  *   **Theory Assumes, Your World is Fuzzy:** **Perfect knowledge of ZOPA/BATNA boundaries.** Your world involves uncertainty and perception management.
  *   **Untranslatable Distinction:** Theory's **"rescaling invariance"** is a fundamental property with no direct counterpart in your dollar-based world, though it ensures the solution isn't arbitrary.

  The core models (Nash, KS) are powerful abstractions of the *endpoint* of bargaining – finding a "reasonable" deal within known constraints given the alternative of impasse. Your vocabulary richly describes the *process* – the arguments, tactics, uncertainties, power plays, and measurable outcomes – that shape those constraints and ultimately lead to that endpoint. The translation works for the *logic* of the solutions, but the residue lies in the *abstraction* (utility, convexity, perfect information) and the *omission* of the dynamic process of defining the battlefield (the ZOPA and BATNA).
