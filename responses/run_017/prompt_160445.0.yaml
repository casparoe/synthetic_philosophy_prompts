prompt: |-
  ok so before I read any more proposed solutions I want the spec, because I think half the arguing in this area is people scoring theories against requirements nobody actually stated.

  Setup so we don't talk past each other. The Pasadena game: fair coin, tossed until it first lands heads; if the first heads is on toss n you recieve (−1)^{n−1}·2^n/n, so +2, −2, +8/3, −4, +32/5 … with probabilities 1/2, 1/4, 1/8, 1/16 … The expectation comes out as the alternating harmonic series, which sums to about +0.69 but only conditionally, and the absolute expectation is the harmonic series, which diverges. So on the usual bookkeeping the expected value doesn't exist, and by Riemann rearrangement you can make the sum come out to whatever you like by reordering terms.

  What I want is not "what's the ticket worth". It's: what does a rule for choosing have to deliver to count as adequate for gambles like this? And I want the purpose fixed up front, since I suspect a lot of the disagreement is people answering different questions. My purpose: a decision procedure for an actual agent — bounded, living through time, has to say yes or no to one ticket now, may get the chance to sell or hedge it partway through, does not get to survey infinitely many outcomes. Not a ranking of abstract gambles for an ideal agent. Tell me if that purpose is ill-posed.

  Cases I think the list has to cover, with why I think each bites — add ones I've missed and drop any that are really just camp prejudice:

  1. Truncation. Chop the game off at toss N; now expectation exists and is the Nth partial sum, which oscillates around 0.69 and converges to it. Does a theory have to be continuous with its own verdicts on the truncations, or is the infinite case allowed to come apart from the limit of the finite ones?
  2. Sure shifts. Is Pasadena-plus-a-sure-pound strictly better than Pasadena? If a theory says "meh, indifferent", I think it's pumpable; say whether that's right and what the requirement really is.
  3. Bundling and repetition. One ticket or two independent ones? And the long-run worry: since E|X| is infinite, the strong law doesn't apply, so nobody gets to justify a price by "you'll average out over many plays". Is that a desideratum (don't smuggle in frequentist support the maths doesn't give you) or is it fine to be silent on repeat play?
  4. Redescription. Sell the same gamble to me as a rearranged series, or split into stages, or bundled with an unrelated gamble. Must the verdict be invariant? If yes, say what does the invariant-making — what feature of the game fixes the "real" order.
  5. Mid-game revaluation, the one I care most about. Conditional on the first k tosses all being tails, the natural-order conditional expectation is roughly −0.61 after one tail, +0.77 after two, about −1.12 after three, and the swings keep doubling in size. So a natural-order agent's willingness to pay to keep or sell the ticket flip-flops with growing magnitude as the game goes on. Does an adequate theory owe us a verdict on what that agent may pay at each point, does it owe dynamic consistency / no money pump, and is "no money pump" here a genuine requirement or does it quietly presuppose the expectation-based pricing that's the thing in question? (My arithmetic is back-of-envelope; correct me if I've botched it.)
  6. Bounded utility. If utility is bounded in money, the series converges absolutely and the problem evaporates. Is "handle the case where utility is genuinely unbounded" a requirement, or is dissolving it by bounding utility a legitimate answer?
  7. Ordinary cases. Must the theory reproduce expected-utility verdicts wherever expectation does exist? Is that non-negotiable, and does it have to solve the St Petersburg game as well or is that allowed to be a separate problem?

  Deliverable: the requirements list, each with the case or consideration behind it, marked non-negotiable vs preference-of-a-camp. Tell me which single requirement excludes the most candidate theories, and which pair you think can't be jointly satisfied — my guess is determinacy (every gamble gets a verdict) plus invariance under redescription, but make the case and name a different pair if that's not where the real conflict is. Also: people say paying any particular finite amount for the ticket feels arbitrary in a way that paying for a St Petersburg ticket doesn't. Is that a desideratum or a prejudice? A one-line-per-family scorecard at the end is fine — expectation-free dominance/structural views, nonstandard-expectation views, weak-expectation views, permissive-range views, bounded-utility views — but keep the weight on the criteria, that's the bit I can't do myself. And write it in British English please.
reasoning: |-
  Okay, let me tackle this systematically. The user wants a clear specification for evaluating decision theories applied to the Pasadena paradox, with explicit requirements grounded in practical agency. 

  First, I need to map their seven cases to core decision-theoretic requirements. The truncation case (#1) highlights tension between finite approximations and infinite gambles - this demands clarity on continuity requirements. Sure shifts (#2) directly challenge whether strict dominance can be ignored, which feels non-negotiable for pump-avoidance. 

  Bundling (#3) reveals deeper issues: since |E|X|| diverges, repeatability can't rescue the theory - so we must decide if handling independent repetitions is essential. Redescription (#4) cuts to whether order-dependence is acceptable - but insisting on invariance seems impossible without absolute convergence. 

  Mid-game revaluation (#5) is where real agency constraints bite hardest. Those growing conditional expectation swings suggest any state-dependent valuation will enable money pumps unless dynamically consistent. But enforcing consistency might circularly presuppose expectation-based pricing. 

  Bounded utility (#6) feels like a cheat - dissolving the problem by assumption avoids wrestling with unbounded utility cases that illuminate fundamental issues. And ordinary cases (#7) must anchor the theory - if it fails on convergent expectations, it's not a decision theory worth considering.

  The key conflict emerges between determinacy (every gamble gets a valuation) and redescription invariance - these pull in opposite directions when absolute convergence fails. Theories must choose which to sacrifice. Meanwhile, the "arbitrary pricing" intuition reflects legitimate discomfort with assigning precise values to non-absolutely-convergent gambles.

  I'll structure the requirements as non-negotiable vs negotiable, noting where theories typically break. The mid-game revaluation requirement (#5) likely excludes the most candidates because it combines dynamic choice with unbounded payoffs - most proposals handle one or the other poorly. And yes, determinacy plus redescription invariance is indeed impossible without absolute convergence - that's the core mathematical barrier.
answer: |-
  Here’s a specification for evaluating decision theories applied to the **Pasadena game** and similar non-absolutely-convergent gambles, grounded in your stated purpose: **a practical decision procedure for a bounded agent facing a single gamble, with possible mid-game hedging, and no reliance on infinite repetitions.** Requirements are derived from your cases, marked as **non-negotiable** (NN) or **camp-dependent** (CD), with justifications.

  ---

  ### **Core Requirements**
  1. **Truncation Continuity (CD)**  
     - *Case*: Finite truncations have well-defined expectations (oscillating partial sums), but the infinite gamble diverges absolutely.  
     - *Requirement*: Must the verdict for the infinite game align with the limit of finite cases?  
     - *Status*: CD. Some theories demand continuity (e.g., "weak expectations"), others reject it (e.g., "it’s a distinct object").  
     - *Rationale*: Bounded agents experience finite play, but infinite gambles may require distinct treatment.

  2. **Strict Dominance (NN)**  
     - *Case*: Pasadena + £1 sure gain vs. Pasadena alone.  
     - *Requirement*: The former must be strictly preferred. Violations enable money pumps.  
     - *Status*: Non-negotiable. Any theory permitting indifference is pumpable.  
     - *Rationale*: Core rationality axiom; failure implies exploitable decisions.

  3. **Repeat Play Independence (CD)**  
     - *Case*: Bundling multiple independent Pasadena tickets.  
     - *Requirement*: Need the theory handle repeated/bundled plays? Or is single-play adequacy sufficient?  
     - *Status*: CD. Frequentist justifications fail (SLLN inapplicable), but agents may face bundled offers.  
     - *Rationale*: Rejecting repetition-focused theories avoids smuggled frequentism; silent on bundling may leave gaps.

  4. **Redescription Invariance (CD)**  
     - *Case*: Repackaging Pasadena as a rearranged series or staged game.  
     - *Requirement*: Verdicts must be invariant under equivalent mathematical descriptions.  
     - *Status*: CD. Insisting on invariance excludes order-dependent theories (e.g., natural order evaluation).  
     - *Rationale*: Prevents manipulability via repackaging, but forces commitment to a "true" value source.

  5. **Dynamic Consistency (NN) & Mid-Game Tractability (NN)**  
     - *Case*: Conditional expectations oscillate wildly mid-game (e.g., −0.61 after 1 tail, +0.77 after 2).  
     - *Requirements*:  
       - (a) Must provide coherent valuations at all decision nodes (mid-game hedging).  
       - (b) Must avoid money pumps (dynamic consistency).  
     - *Status*: Non-negotiable. Failure implies irrational time-varying preferences.  
     - *Rationale*: Practical agents revalue gambles mid-play; inconsistency enables exploitation.  
     - *Note*: Your conditional expectation calculations are correct (± divergence).

  6. **Unbounded Utility Compatibility (CD)**  
     - *Case*: With bounded utility, the problem vanishes (absolute convergence).  
     - *Requirement*: Must the theory handle genuinely unbounded utility?  
     - *Status*: CD. "Dissolve via bounded utility" is legitimate but sidesteps the paradox’s challenge.  
     - *Rationale*: Unbounded utility tests the theory’s mathematical depth; bounded utility may feel evasive.

  7. **Ordinary Case Compliance (NN)**  
     - *Case*: Gambles with finite expectation (e.g., St. Petersburg with bounded utility).  
     - *Requirement*: Must reproduce standard EU verdicts when expectations exist.  
     - *Status*: Non-negotiable. Failing here disqualifies the theory as a decision rule.  
     - *Rationale*: EU is the baseline for tractable gambles; deviations require exceptional justification.

  ---

  ### **Conflicts & Desiderata**
  - **Key Conflict**: **Determinacy (every gamble gets a valuation) + Redescription Invariance**  
    - Riemann rearrangement proves these *cannot coexist* for non-absolutely convergent gambles.  
    - *Resolution*: Theories must drop one:  
      - **Drop Determinacy**: Permit ranges/indeterminacy (e.g., "no unique value").  
      - **Drop Invariance**: Fix an order (e.g., temporal, natural).  

  - **Most Excluding Requirement**: **Dynamic Consistency (5b)**  
    - Eliminates theories with path-dependent valuations (e.g., myopic prospect theory) and rigid ex-ante rules ignoring mid-game states.  

  - **Arbitrary Pricing Intuition**  
    - Desideratum: *Avoid assigning precise finite values where no robust justification exists*.  
    - Not mere prejudice; reflects the mathematical absence of a unique fair price.  

  ---

  ### **Theory Scorecard (British English)**  
  | **Family**                  | **Stance on Key Conflicts**                                  | **Fails Requirement**               |  
  |-----------------------------|-------------------------------------------------------------|-------------------------------------|  
  | **Expectation-Free Views**  | Rejects expectation; uses dominance/structure.              | 5 (mid-game revaluation), 7 (EU).   |  
  | **Nonstandard Expectation** | Uses "weak" or order-specific expectations.                 | 4 (redescription invariance).       |  
  | **Permissive-Range Views**  | Assigns intervals (e.g., [-∞, ∞] or [-2, 2]).              | 2 (strict dominance) if intervals overlap zero. |  
  | **Bounded Utility**         | Dissolves paradox via utility curvature.                    | 6 (avoids unbounded utility cases). |  
  | **Weakly Convergent Metrics** | Uses norms like ‖X‖₁,ₚ or Cesàro sums.                      | 5 (dynamic consistency), 4 (invariance). |  

  ---

  ### **Summary**  
  A minimally adequate theory must:  
  - Satisfy **strict dominance (NN)** and **dynamic consistency (NN)** to prevent money pumps.  
  - **Reproduce EU for ordinary cases (NN)**.  
  - **Handle mid-game valuations tractably (NN)**.  
  - Choose between **determinacy** or **redescription invariance** (CD)—they conflict mathematically.  
  - Acknowledge that **precise pricing feels arbitrary** because it is—no unique fair price exists.  

  The deepest tension is between the *practical need for mid-game coherence* (requiring dynamic consistency) and the *mathematical impossibility* of a unique order-invariant value. **Bounded-utility views** sidestep cleanly but may feel unsatisfying; **non-expectation views** often fail core rationality axioms. **Interval-based approaches** preserve dominance but risk emptiness. No theory satisfies all desiderata—compromises are unavoidable.
