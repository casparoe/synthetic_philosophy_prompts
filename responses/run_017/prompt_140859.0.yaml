  Hmm, the request has precise formatting constraints - no headings or bullet points, continuous prose only. That means my response must flow like an email while packing analytical depth. The professor specifically wants to flag two recurring errors: students conflating the swarm with the monster, and mistaking reductio for refutation. 

  The variants are clever pedagogical tools. The closed-loop monster eliminates scarcity entirely - if aggregation still demands feeding it, that exposes whether the problem is pure summing. The swarm democratizes the efficiency advantage - testing whether students recognize distributed small gains can create the same moral horror. And the dud flips the script beautifully - if we're disturbed by neglecting the monster, shouldn't we be equally disturbed by neglecting the inefficient?

  For the question phrasing: Need to avoid leading students toward any particular answer. Should present variants neutrally while forcing engagement with "what does the work." The 45-minute/1000-word limit suggests expecting concise but sophisticated analysis. 

  Model answer outline: First unpack original intuition - likely combination of distributive injustice (concentration) + violation of separateness-of-persons. Then show closed-loop variant reveals aggregation alone isn't the issue (no cost = no objection). Swarm variant proves concentration isn't necessary - diffuse advantage still feels wrong. Dud then becomes the litmus test: if they reject aggregation for monsters/swarms but accept it for duds, they're inconsistent. Strongest answers will note this pressures us toward non-aggregative views or threshold deontology. 

  Marking scheme priorities: High marks for spotting that closed-loop defangs the objection (exposing scarcity's role), recognizing swarm's distinct challenge to concentration theories, and consistent treatment of dud. Must explicitly deduct for the two flagged errors. Should emphasize that "it's a reductio so refuted" ignores dialectical context - Nozick uses it to show aggregation violates intuition, but doesn't disprove utilitarianism for someone who bites the bullet. 

  ...this is actually brilliant exam design. The variants create a triangular pressure: if you condemn feeding the monster, you must explain why closed-loop is different; if you accept the swarm, you must justify not helping the dud. Forces students to locate their real objection.
answer: |-
  ### Exam Question  
  *(Format: Single continuous prose paragraph as per instructions)*  

  You have ninety minutes to answer the following question. Write approximately 1000 words. Continuous prose only—no headings, bullet points, or bold text.  

  Robert Nozick’s “utility monster” objection targets aggregative moral theories (like utilitarianism) by describing a being who gains vastly more welfare from resources than others. Maximizing total welfare would demand transferring all resources to it, reducing others to subsistence. This seems intuitively unjust. Consider two variants:  
  1.  **Closed-loop monster**: Its immense welfare arises *entirely* from self-contained mental states requiring *no* external resources others could use (e.g., perpetual, costless euphoria). Feeding it "resources" is purely symbolic—a gesture with zero opportunity cost.  
  2.  **The Swarm**: A large population (e.g., billions) where *each* member converts resources into welfare *very slightly* more efficiently than the existing average. No individual is a "monster," but aggregating their small gains means total welfare is maximized by diverting *all* surplus resources to them, holding others at subsistence.  
  Analyze what underlying feature(s) of the *original* utility monster scenario generate the intuitive objection. Is it the aggregative principle itself, the opportunity cost/scarcity, the concentration of benefit in one entity, or another factor? Use the closed-loop and swarm variants to test your hypothesis. Then, apply your conclusion to a final case: **The Dud**—a person who gains vanishingly little welfare from resources (e.g., due to anhedonia). Aggregative views seem to imply we owe the Dud almost nothing, even to prevent their absolute deprivation. Does your account of what’s troubling in the monster cases explain or resolve the Dud’s plight? Critically assess whether the utility monster objection reveals a deep flaw in aggregation or a mismatch between aggregation and common intuitions about fairness.  

  ---

  ### Model Answer  
  *(Approx. 700 words, continuous prose)*  

  The intuitive revulsion toward Nozick’s utility monster stems not solely from aggregation *as such*, nor purely from scarcity, but from the *interaction* of aggregation with the *concentration* of extreme, uncompensated benefit and the *violation of distributive fairness* understood as a constraint on sacrificing individuals for the sum. The closed-loop monster variant demonstrates that aggregation alone, absent scarcity or cost to others, lacks the morally offensive character. Its bliss costs nothing; denying it “resources” (meaningless tokens) gains nothing for anyone else. There is no fairness violation because no one is deprived for its sake. Intuition likely permits—or is indifferent to—its boundless joy. This isolates opportunity cost (real sacrifice by others) as necessary for the objection.  

  The swarm variant, however, shows that concentration in a *single* monster isn’t essential. Here, benefit is diffuse—each gains only marginally more per resource unit. Yet, aggregating these tiny gains over a vast population still demands starving a smaller group to funnel surplus to the swarm. The objection persists despite no individual being monstrously efficient. This occurs because aggregation, applied under scarcity, requires *indefinitely* prioritizing marginal gains to a larger group over vital interests of a smaller group, violating the intuition that claims of basic need or non-substitutability impose limits. The swarm exploits aggregation’s blindness to the *separateness of persons*; it treats minor gains to many as trumping catastrophic losses to few, reducing the latter to mere means for the former. The core objection is thus to aggregation’s *failure to protect individuals or groups from being sacrificed* whenever summing marginal utilities favors a sufficiently large beneficiary pool, regardless of how concentrated or diffuse the gain.  

  This analysis deepens the problem of the **Dud**. Aggregation dictates allocating minimal resources to the Dud, as their low efficiency yields minimal marginal welfare gain per resource. Any resource given to them could generate vastly more welfare for almost anyone else. If the objection to the monster/swarm is fundamentally about the *unfairness of sacrificing some to maximize the sum*—especially when the sacrifice involves basic interests—then the Dud presents the *inverse* injustice: they are *themselves sacrificed* (left in deprivation) because their inefficiency makes helping them a poor aggregative investment. The same aggregative logic that demands feeding the monster/swarm demands starving the Dud. If we find the monster/swarm counterintuitive because individuals shouldn’t be reduced to instruments for the sum, then the Dud’s plight is equally counterintuitive: they are abandoned *by* the sum because their welfare "yield" is too low.  

  This symmetry suggests the utility monster objection reveals not a contingent flaw fixable within aggregation (e.g., by adding thresholds), but a fundamental tension between unconstrained summation and robust protections for individual moral standing. The monster, swarm, and Dud collectively demonstrate that strict aggregation either permits (even demands) violating basic fairness constraints (sacrificing some for the greater sum) or fails minimal duties of rescue (abandoning the inefficient). The objection works because it exposes this tension using cases where aggregation’s demands clash sharply with widely held intuitions about the inviolability of persons and the claims of basic need. However, it does not, by itself, *refute* aggregative theories; it presents a powerful *reductio ad absurdum* for those who share the intuitions, forcing a choice: bite the bullet and accept the implications for monsters, swarms, and duds, or reject pure aggregation as insufficient. Resolving the Dud’s case requires either abandoning aggregation (opting for rights, prioritarianism, or sufficientarianism) or significantly constraining it (e.g., with guaranteed minima that override marginal utility calculations). The variants confirm that the core intuition targeted isn’t about monsters per se, but about the moral limits of summing welfare across persons when it overrides fundamental protections or claims of desert.  

  ---

  ### Marking Scheme (Out of 20)  
  *(Continuous prose paragraph format)*  

  A top-tier response (17-20 marks) will clearly identify that the core intuitive objection to the original monster involves the *unfair sacrifice of some for a concentrated, massive gain to one*, demonstrated through rigorous analysis of the variants. It must correctly argue that the closed-loop monster (no cost) largely defuses the objection, showing scarcity/opportunity cost is necessary. It must recognize the swarm variant as distinct, demonstrating that *diffuse* marginal gains aggregated over a large group can create the same objectionable sacrifice without a "monster," thus proving concentration isn’t essential—the key is aggregation’s demand to sacrifice vital interests for summed marginal gains. Application to the Dud must be insightful: the student must show symmetry, arguing that the Dud is abandoned *by* aggregation for the same reason others are sacrificed *for* it—the logic ignores the moral claim of the individual when their welfare yield is low. Crucially, it must conclude that the objection highlights aggregation’s conflict with fairness constraints protecting individuals, not merely its summation or the existence of "monsters." A strong answer will note this pressures us toward non-aggregative elements (rights, thresholds) or accepting deeply counterintuitive results. Significant mark deductions apply for two common errors: First, *treating the swarm as merely a dispersed monster* (e.g., calling it "many small monsters") rather than understanding it challenges the necessity of *concentration* by showing aggregation’s sacrifice problem arises even with tiny per-person gains summed over billions. Second, *asserting "it’s a reductio, so aggregation is refuted" without argument*—this is circular; the point is to test *why* the cases are intuitively problematic and what that reveals about aggregation’s structure. Answers scoring 13-16 may identify key elements but lack depth on the variants or Dud symmetry, or partially conflate the swarm with the original. Scores of 9-12 show basic comprehension but miss nuances (e.g., not seeing closed-loop’s significance, or treating Dud superficially). Lower scores (5-8) misunderstand core cases or the objection. Answers failing to engage the variants or Dud, or committing both flagged errors, typically score below 8. Clarity, precision, and logical flow are essential throughout.
