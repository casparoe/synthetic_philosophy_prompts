prompt: |-
  quick context: i'm a 4th-year and I'm finally writing the framework/lit section of a paper on pragmatic encroachment, and I've realised I spend all my time arguing about individual cases instead of about what the cases are supposed to show. So: help me write the spec. What does a theory of the stakes-sensitivity of knowledge attributions have to be able to do to count as adequate? I want desiderata with the case or consideration behind each one, and I want them sorted into three buckets — (i) genuine adequacy conditions that any view in this area has to meet, (ii) conditions that are only non-negotiable if you've already bought into one camp's wider commitments (stuff like: knowledge is the norm of assertion; knowledge is the norm of practical reasoning; attributions must be objective in whatever sense factivity is supposed to guarantee; the semantics has to be compositional and behave normally under embedding; the view has to deliver some particular anti-skeptical or pro-skeptical datum), and (iii) things people demand that are really just prejudice. My supervisor keeps asking whose stakes and I never have a good answer, which is part of why I want the list.

  Fix the purpose as follows: the theory is meant to be a semantics (plus pragmatics if that's where the action is) for 'S knows that p' in ordinary English — including inside conditionals, belief reports and questions, which is where my friend in formal semantics says all the contextualist views quietly cheat — and it's also meant to do three jobs in epistemology: explain the pull of the skeptical argument without turning ordinary knowledge claims into noise, explain why knowledge rather than mere justified true belief is what we cite when we say someone is in a position to assert or to act, and say something about why knowledge is what we care about having. Every family of view is on the table: attributor-contextualism, interest-relative/subject-sensitive invariantism, relativist views where the standards of assessment come apart from the standards of use, hybrids, whatever.

  My starting list, which I'm sure is partly garbage — tell me which entries are real desiderata, which are two entries wearing a coat, and what's missing. (a) the bank/airport family: the theory has to say whether the datum is about knowledge at all or just about what the subject ought to do next (go check the schedule), and whether it is the stakes, the cost of further inquiry, or the salience of the error possibility that's doing the work. (b) what stakes even are: expected disvalue, worst-case magnitude, how many people are affected, or the subject's actual preferences — test it with the agent who stands to lose everything and couldn't care less, and with the anxious agent for whom every decision is life-or-death. (c) whose stakes, when the subject's and the attributor's come apart: I tell you Sam knows the train goes at 4; you're deciding whether to stake something huge on it, I'm making small talk; and if the view gives a different verdict for each of us, does it also have to say that you and I are having a genuine disagreement rather than talking past each other, given we share all the evidence and the conversational score? (d) the looping case I made up and can't get anyone to engage with: whether it's correct to attribute knowledge to the resident depends on whether the attending will treat the question as settled, and whether the attending treats it as settled depends on whether she takes the resident to know — so the theory should say whether knowledge attributions there have a determinate truth value at all, and whether self-fulfilling attributions are allowed. (e) the emergency/no-time-to-inquire case, where stakes are maximal and getting more evidence is impossible: does the view predict knowledge gets easier or harder, and if it predicts harder in both directions is it just redescribing a norm of action? (f) whether other epistemic vocabulary shifts in tandem — certain, sure, has checked, is in a position to know, warranted, the evidence supports — and whether it's a cost if it doesn't. (g) whether there's a sharp evidential threshold on a continuous scale, with the lottery-style worries that invites and the question of whether 'knows' ends up gradable like 'flat'. (h) the legal end: the fact that in high-stakes settings we refuse to treat bare statistical evidence as enough, and what a stakes-based theory should say about that. Plus the time-travel worry: in a calm conversation later, we assess what somebody said during the high-stakes one, and the view should say which standards govern that assessment.

  Then the part I actually want: flag any pair or subset of the desiderata that can't be jointly satisfied — if the list is inconsistent that's a result I can use in the paper — and tell me which single requirement is doing the most exclusionary work across the families of view above. Keep any scorecard to two or three lines per view; the criteria are the deliverable, I'll do the arguing myself in the seminar on thursday.
reasoning: |-
  Okay, let me tackle this user's query. They're a 4th-year student working on pragmatic encroachment, struggling to frame their literature review around what makes a theory adequate. They want desiderata sorted into three buckets: genuine adequacy conditions, camp-specific commitments, and prejudices. 

  First, I need to understand their core request. They’re stuck arguing cases instead of what the cases demonstrate. Their supervisor’s pressing them on "whose stakes," which is a key pain point. They also provided a list of their own desiderata, which needs refining. 

  Starting with the genuine adequacy conditions (Bucket I). Any theory must handle the bank cases flexibly—explaining why stakes or error salience shifts attributions without collapsing into action norms. The disagreement data is crucial too; if two people attribute knowledge differently, the theory should clarify if they’re talking past each other. Embedding behavior is non-negotiable—contextualist views often falter here. And the skeptical paradox resolution: preserving ordinary knowledge while acknowledging high-stakes skepticism.

  For Bucket II, camp-specific commitments depend on prior buy-in. If you accept knowledge as the norm of assertion (KNA), then stakes must directly tie to when assertion is proper. Similarly, if knowledge governs practical reasoning, stakes affect actionability. Invariantists need attributions to be objective, while contextualists might relax that. The semantics must be compositional if you prioritize formal rigor.

  Bucket III is about prejudices. Demanding that "knows" is always gradable ignores its threshold-like use. Insisting other epistemic terms shift identically overlooks linguistic nuances. And the sharp threshold expectation misreads how evidence works—it’s often vague.

  Their list has overlaps. (a) and (b) both deal with what factors drive cases—merge into one condition. (c) "whose stakes" is central and belongs in Bucket I. The looping case (d) is niche but tests determinacy—maybe Bucket II if tied to objectivity. Emergency cases (e) test if knowledge is action-guiding—Bucket II if accepting KNA. Legal cases (h) challenge statistical evidence—genuine adequacy. Time-travel assessments (h end) probe context-relativity—core for any theory.

  The biggest tension is between disagreement data and embedding. If contextualism avoids contradiction by saying no real disagreement, it struggles with embeddings that assume shared content. Invariantism handles embeddings but forces error in one attributor. This might be the key inconsistency they can leverage.

  "Whose stakes" is the most divisive issue. Subject-sensitive invariantism (SSI) prioritizes the subject’s stakes, causing attribution shifts without contextualist machinery. But it clashes with disagreement—people argue as if they’re conflicting, not talking past. Contextualism uses attributor stakes but faces embedding challenges. Relativism uses assessor stakes, which might handle time-travel cases but feels revisionist.

  The user’s urgency about Thursday’s seminar means I should highlight actionable conflicts: embedding vs. disagreement, and whose stakes undercuts consensus. Their loop case, while creative, is less critical unless tied to broader indeterminacy concerns. 

  I’ll structure the response to first refine desiderata, then show conflicts, ending with the exclusionary role of "whose stakes." This gives them a clear framework to argue theories’ trade-offs in their paper and seminar.
answer: |-
  Here’s a refined desiderata list for your framework, categorized and annotated. I’ve streamlined your starting points, flagged conflicts, and identified the most exclusionary requirement. Use this to structure your lit review and expose fault lines between theories.

  ---

  ### **I. Genuine Adequacy Conditions**  
  *(Any viable theory must satisfy these)*  
  1. **Bank/Airport Case Flexibility**:  
     - *Case*: Hannah’s knowledge attribution shifts with practical stakes (low vs. high).  
     - *Requirement*: Explain why **stakes, salience of error, or cost of inquiry** *appears* to affect knowledge attributions without collapsing into a theory of rational action.  
     - *Key*: Distinguish knowledge from action-guidance norms (e.g., "should check" ≠ "doesn’t know").

  2. **Disagreement Data**:  
     - *Case*: You (low stakes) say "Sam knows the train leaves at 4"; I (high stakes) deny it. We share evidence.  
     - *Requirement*: Explain whether this is a **genuine disagreement** (truth-conditional conflict) or **merely pragmatic** (different conversational goals).  
     - *Tension Point*: Embedded in (c) – *whose stakes* determines truth conditions.

  3. **Embedding/Compositionality**:  
     - *Case*: "If Sam knows the train leaves at 4, we shouldn’t wait"; "Mary believes Sam knows it."  
     - *Requirement*: Semantics must work under **conditionals, belief reports, and questions** without ad-hoc fixes.  
     - *Killer for*: Naive contextualism (shifts standards mid-sentence).

  4. **Skeptical Paradox Resolution**:  
     - *Case*: In ordinary contexts, "I know I have hands"; in high-stakes philosophy class, denial seems plausible.  
     - *Requirement*: Explain **why skeptical arguments feel compelling** without invalidating everyday knowledge claims.

  ---

  ### **II. Camp-Specific Commitments**  
  *(Required only if you accept prior assumptions)*  
  5. **Knowledge Norm of Assertion/Practical Reasoning (KNA/KPR)**:  
     - *Assumption*: Knowledge is the norm of assertion ("Assert p only if you know p") or action ("Act on p only if you know p").  
     - *Requirement*: Stakes-sensitivity must **align with when assertion/action is proper** (e.g., high stakes → improper assertion without checking).  
     - *Test Case*: Emergency/no-inquiry scenario (e). If knowledge is impossible here, KNA/KPR may demand redescribing norms.

  6. **Objectivity/Factivity**:  
     - *Assumption*: Knowledge attributions are "objective" (truth not dependent on arbitrary features).  
     - *Requirement*: **Reject radical subjectivity** (e.g., anxious agent’s stakes can’t universally destroy knowledge).  
     - *Test Case*: Agent who faces ruin but doesn’t care (b) – can they "know"? Invariantists demand invariance.

  7. **Semantic Rigor**:  
     - *Assumption*: Epistemic vocabulary requires a compositional semantics.  
     - *Requirement*: **Avoid semantic monstrosity** (e.g., unshiftable context parameters).  
     - *Test Case*: "Certain" and "sure" (f) – if they don’t shift like "knows", it’s a cost for contextualism.

  ---

  ### **III. Prejudices**  
  *(Overdemanding or theoretically optional)*  
  8. **Gradability Demand**:  
     - *Prejudice*: "Knows" must behave like a gradable adjective ("flat") with precise thresholds.  
     - *Reality*: Epistemic thresholds can be **vague but stable**; "knows" may be threshold-absolute.  
     - *Test Case*: Lottery paradox (g) – vagueness doesn’t preclude knowledge.

  9. **Uniform Shifting**:  
     - *Prejudice*: All epistemic terms ("certain", "warranted") must shift identically to "knows".  
     - *Reality*: **Lexical variation is normal**; "knows" may be uniquely action-oriented.

  10. **Anti-Skeptical/Pro-Skeptical Bias**:  
      - *Prejudice*: Theory *must* vindicate commonsense (anti-skepticism) OR take skepticism seriously.  
      - *Reality*: **Explanatory adequacy ≠ verdict alignment**.

  ---

  ### **Key Conflicts & Exclusionary Requirements**  
  **Inconsistent Pair**:  
  - **Disagreement Data (I.2) + Embedding (I.3) + KNA/KPR (II.5)**  
    - *Conflict*: If "knows" is context-sensitive (solving I.2), embedding (I.3) fails. If invariant (solves I.3), disagreement becomes error-theoretic. KNA/KPR amplifies this by tying knowledge directly to actionability.  
    - *Views Broken*: Attributor contextualism (embeddings), SSI (disagreement).  
    - *Winner*: Relativism (shifts to assessor context) – but struggles with I.3.

  **Most Exclusionary Requirement**:  
  **"Whose Stakes?" (Embedded in I.2 & II.6)**  
  - *Excludes*:  
    - **Attributor Contextualism**: Stakes = attributor’s → fails embeddings (I.3) and disagreement (I.2).  
    - **SSI**: Stakes = subject’s → makes disagreement mysterious (I.2) and violates objectivity (II.6).  
    - **Relativism**: Stakes = assessor’s → solves disagreement/embedding but clashes with factivity (II.6).  

  **Your Loop Case (d)**:  
  - Belongs in **II.6 (Objectivity)**. If knowledge is objective, looping should resolve (e.g., evidence fixes truth). If not, it’s a cost for views rejecting objectivity.  

  **Legal Cases (h)**:  
  - Belongs in **I.1** – tests whether stakes *alone* explain evidence rejection. A theory must explain why statistical evidence feels insufficient in high stakes (e.g., gatecrasher paradox).  

  **Time-Travel Assessment**:  
  - Belongs in **I.2** – tests whether truth is relative to context of use or assessment.  

  ---

  ### **Scorecard (2 Lines Per View)**  
  | **View**               | **Strengths**                          | **Fatal Weakness**                     |  
  |-------------------------|----------------------------------------|----------------------------------------|  
  | **Attributor Contextualism** | Handles bank cases (I.1), skeptical paradox (I.4). | Fails embeddings (I.3); disagreement is merely verbal (I.2). |  
  | **SSI**                 | Explains actionability (II.5), legal cases (h). | Makes disagreement irrational (I.2); violates objectivity (II.6). |  
  | **Relativism**          | Solves disagreement (I.2) and embeddings (I.3). | Revisionist semantics; struggles with factivity (II.6). |  
  | **Hybrid Views**        | Balances stakes/salience (I.1,b).      | Complex; may inherit problems of parent theories. |  

  **The Nuclear Option**: If no theory satisfies I.1–I.4 + II.5–II.7, conclude that pragmatic encroachment is untenable **or** requires abandoning KNA/KPR/objectivity. This is your paper’s pivot point.  

  Use this to force theories into a trilemma: Sacrifice embeddings, disagreement, or objectivity. Thursday’s seminar will be fire. 🔥
