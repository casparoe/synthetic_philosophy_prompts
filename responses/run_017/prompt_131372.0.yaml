prompt: |-
  Dear Colleague,

  I am rewriting the moral psychology half of our second-year ethics module, and I should be grateful for your judgement on a point that I had taken to be settled, but which now seems to me considerably less straightforward than I had assumed.

  I had understood the situationist literature — the obedience studies, the Good Samaritan studies, the work on incidental mood and helping, and the use Harman and Doris make of it — to have established something quite strong: that what an agent does on a particular occasion is determined almost entirely by features of the situation, and that the ascription of stable traits of character is a systematic error, the projection of an imaginary unity onto conduct that is really cued by local circumstances. If that is right, it seems to me that the honest course is to stop presenting the excellences of character as a normative ideal, and to teach instead a kind of situational ethics: identify the variables that actually move conduct, and then arrange our environments so that people behave decently.

  A junior colleague resists this. She says that I am running together two claims which the careful literature keeps apart — the claim that conduct is sensitive to situational variables, and the claim that traits of character do not exist — and she proposes a "restricted" virtue ethics in their place: a virtue is not a global trait but a localised reliability, a stable disposition to act well in situations of a precisely specified type, keyed to exactly the variables the social psychologists manipulate. Such dispositions, she argues, are precisely what the experiments cannot exclude; so the situationist critique has no purchase upon them, and the whole dispute turns out to be merely verbal — a disagreement about how broad a disposition has to be before it merits the name of character.

  I find this attractive, but I suspect that it may be a retreat. Which of us has the better of the argument? Specifically: is situational sensitivity in the data any evidence at all against the existence of traits, given that a disposition is by its very nature something whose manifestation depends upon conditions? If the critique succeeds, does it tell against the normative claims of virtue ethics, or only against our ordinary descriptive claims about who possesses the virtues? And does my colleague's proposal really answer the critique, or does it purchase immunity by surrendering what was distinctive — the thought that a virtue is worth having for its own sake, that possessing one makes an agent's conduct intelligible, that the virtues hang together?
reasoning: |-
  Okay, let me unpack this query carefully. The user is a moral psychology professor wrestling with how to interpret situationist critiques of virtue ethics. Their dilemma centers on whether experimental data truly undermines character traits or merely refines our understanding of them.

  Hmm, the core tension emerges in two layers. First, the empirical question: does situational variability disprove character traits? The user's junior colleague makes a subtle point - that dispositions could be situation-specific rather than global. This aligns with recent personality psychology models like CAPS that view traits as conditional patterns. The Milgram experiment data shows how obedience varies under institutional pressure, but doesn't necessarily negate all personal dispositions.

  Second, the normative stakes: even if "restricted virtues" exist, do they preserve virtue ethics' core? The user worries that localized dispositions lose the unifying power of character - that deep sense of self that makes actions intelligible. There's also concern about jettisoning the intrinsic value of virtue if it becomes just a set of context-specific responses.

  I notice the user's phrasing reveals philosophical sophistication - they're not just asking for literature citations but probing conceptual coherence. Their anxiety about "retreat" suggests they recognize virtue ethics' traditional appeal resides in its holistic view of character. The colleague's proposal might solve the empirical challenge but at existential cost to the theory.

  The historical context matters here. Harman and Doris took situationism as lethal to virtue ethics, but later thinkers like Snow and Alfano developed precisely these "fragmented" virtue models. The key is whether such accounts can still support virtue ethics' normative aspirations - guiding life projects, providing reasons for action beyond situational nudges.

  Perhaps the deepest issue is teleological: virtue ethics traditionally sees character cultivation as shaping one's entire being toward eudaimonia. If virtues become atomized response-sets, can they still serve that orienting function? That may be the user's real concern beneath the methodological debate.
answer: |-
  Your dilemma cuts to the heart of contemporary virtue ethics debates. Let's dissect the key issues:

  **1. The Situationist Critique: What It Actually Shows (and Doesn't Show)**
  -   **What it Establishes:** Situationism robustly demonstrates that *broad, cross-situationally consistent character traits* (like "honesty" or "compassion" tout court) are far rarer than folk psychology assumes. Behavior is exquisitely sensitive to seemingly minor situational variables (mood, deadlines, ambient smells, presence of authority figures). The predictive power of *global* traits for *specific* behaviors in *novel* situations is weak.
  -   **What it Doesn't Establish:** It does **not** prove traits *do not exist*. It proves they aren't *global* or *invariant*. Your junior colleague is correct: the careful literature distinguishes *sensitivity to situations* from *non-existence of traits*. Traits manifest *in specific conditions*. Finding those conditions matters.

  **2. The "Restricted Virtue Ethics" Proposal: Strengths and Weaknesses**
  -   **Strength (Empirical Immunity):** She is right that localized, context-specific dispositions (e.g., "reliably honest when unsupervised with small change," "compassionate towards distressed strangers when not in a hurry") are **precisely what the experiments cannot rule out**. These "local traits" (sometimes called "trait-relevant affordances" or "situational virtues") align with data showing behavioral consistency *within specific, recurring situation-types*.
  -   **Weakness (Normative Retreat?):** The concern about retreat is valid. Here's why:
      *   **Loss of Unity & Intelligibility:** Aristotelian virtue emphasizes *phronesis* (practical wisdom) – a *global* capacity to perceive the good and act appropriately *across diverse situations*. A virtue makes an agent's conduct intelligible *as a whole*. Reducing virtues to atomized "if-then" responses risks losing this unifying, explanatory power of character. Does "courage in battle but not in the boardroom" constitute *true courage*?
      *   **Intrinsic Value & Worth for its Own Sake:** Virtues are traditionally valued intrinsically – possessing them constitutes *eudaimonia* (flourishing). If virtues are merely reliable situation-specific responses, they become instrumental tools for producing good behavior, potentially losing their status as constitutive elements of a good *life* and good *self*. Is a collection of reliable "if-then" dispositions the same as having *integrity*?
      *   **The "Hanging Together" Problem (*Unity of Virtue*):** Classical virtue ethics often posits that virtues are interconnected – possessing one supports possessing others via practical wisdom. Fragmented local traits might not cohere into a unified character. Can one truly be just without also being courageous enough to act on that justice when pressured?
      *   **Normative Guidance:** Restricted virtues tell us *how* to act *in known situation X*. They struggle with *novel* situations or providing an overarching framework for *life as a whole*. Situational ethics focuses on environment design; classical virtue ethics focuses on agent cultivation.

  **3. Who Has the Better Argument?**
  Neither holds the complete truth, but **your junior colleague's position is empirically stronger and avoids an overreaction, while your concern highlights the deeper normative stakes.**

  *   **On the Existence of Traits:** Your colleague wins this point. Situationism refutes *globalism* (traits manifesting consistently across all situations), not the existence of *local*, *conditional* dispositions. A disposition *is* defined by its manifestation conditions ("fragility = disposed to break when struck"). The data shows *how specific* these conditions are for moral behavior. Traits exist, but they are narrower and more context-bound than often assumed.
  *   **On the Normative Force of Virtue Ethics:** Your concern is profound and valid. **The situationist critique primarily targets the *descriptive* psychology underlying *some* versions of virtue ethics (especially overly simplistic folk versions), not necessarily its *normative* core.** However:
      *   It *indirectly* challenges normative virtue ethics by undermining a key descriptive claim: that people *possess* robust global virtues to any significant degree. How can we cultivate what barely exists?
      *   **Restricted virtue ethics *can* be a viable normative theory**, but it's a *different* theory. It replaces the ideal of a unified, practically wise character with the ideal of cultivating a repertoire of highly specific, reliable behavioral dispositions keyed to known situational triggers. Whether this retains what is "distinctive" (intrinsic worth, intelligibility, unity) is debatable and a matter of philosophical preference.

  **4. Does Restricted Virtue Ethics Answer the Critique?**
  *   **Empirically, Yes:** It sidesteps the main empirical thrust by defining virtues in a way immune to the situationist data. Traits *are* local and conditional.
  *   **Philosophically, Partially:** It answers the *existence* challenge. However:
      *   **Cost:** It arguably surrenders core aspirations of classical virtue ethics (the unified self guided by practical wisdom, intrinsic value of character).
      *   **The "Own-Sake" Problem:** Can a local disposition be valued *for its own sake*? Perhaps, but it feels thinner than valuing a unified character. Its value seems more instrumental (it reliably produces good acts in situation X).
      *   **Intelligibility:** It makes specific acts intelligible ("She did X because she has the disposition for X-in-Y-situations"), but not the agent's *overall* life or character in the same deep way.

  **A Path Forward:**

  1.  **Acknowledge the Data:** Teach that robust, global character traits are empirically rare. Behavior is highly situationally sensitive.
  2.  **Refine Virtue:** Present virtues not as monolithic, invariant entities, but as **context-sensitive capacities.** Emphasize *phronesis* as the crucial meta-capacity to *discern* the morally relevant features of *novel* situations and activate the appropriate local disposition or craft a new response. This retains some unity.
  3.  **Highlight the Cultivation Challenge:** Focus on how *difficult* it is to cultivate even local virtues reliably across the range of situations where they are needed. Situationism shows why moral education requires more than just exhortation – it needs habit formation *in relevant contexts* and strategies for managing situational pressures.
  4.  **Environment Matters:** Integrate your insight! Virtue ethics *should* incorporate "situational design." Cultivating virtue *and* structuring environments to support good behavior are complementary, not opposing, strategies. The virtuous agent also seeks to create just institutions and supportive contexts.
  5.  **The Normative Ideal:** You can still hold up the *ideal* of a unified, practically wise character as a regulative goal for cultivation, while being empirically honest about how rarely it's fully achieved and how context-dependent its expression is. The restricted view offers a more empirically grounded, perhaps "minimalist," account of what traits *are*.

  **In essence:** Your colleague is right that traits (local, conditional ones) likely exist, making the critique less devastating than Harman/Doris suggested. However, you are right to worry that this "saving" move fundamentally alters the traditional virtue ethical ideal in ways that may lose its distinctive depth and appeal. The most philosophically and empirically sound approach is likely a *moderate* virtue ethics that incorporates situational sensitivity, emphasizes *phronesis*, acknowledges the fragility of virtue, and integrates environmental design, while still aspiring toward a coherent and admirable character.
