answer: |-
  ## Field Packet: Global Intuition Stability Survey (GISS)  
  **Project ID:** CIP-GISS-2024  
  **Director:** Dr. Evelyn R. Thorne, Director, Center for Intuitional Parity (CIP)  
  **Date:** 15 October 2024  

  **TO:** Regional Site Coordinators  
  **FROM:** Dr. Evelyn R. Thorne  
  **SUBJECT:** Pre-Deployment Protocol Reminders & Calibration Assurance  

  Colleagues,  

  As we commence Phase III of the Global Intuition Stability Survey (GISS), adherence to the Calibration Assurance Protocol (CAP) is paramount. Recall that GISS measures alignment with core philosophical intuitions under the Intuitional Parity Framework. **Crucially, any population yielding >15% divergence from the Answer Key (Section 3) is not a data point but a calibration failure.** Per CAP Section 2.1, administer the Remedial Dialectical Module (RDM) immediately, then re-test. **Only post-RDM responses enter the primary dataset.** This ensures measurement integrity against noise from underdeveloped conceptual frameworks.  

  Verify all translations against the Lexical Equivalence Guide (LEG v.4). If a target language lacks a factive verb for *knows*, use the LEG-approved near-equivalent (e.g., *sabe* [Spanish], *wei* [Mandarin]) and flag the site as "Lexically Provisional" (LP). For emphasis markers (e.g., "**really** knows"), consult Annex B: Prosodic/Orthographic Stress Conventions. If counterbalancing item order alters outcomes >10%, default to Sequence Alpha (Appendix F) and note the deviation.  

  Regional outliers will be resolved via Tertiary Reference Population Arbitration (TRPA): a third site is sampled; consensus with the CIP Advisory Board’s pre-validated intuitions determines the calibrated benchmark.  

  **Deadline:** Upload all post-RDM data by 30 November. Calibration failures delay global parity.  

  —E.R. Thorne  

  ---

  ### SECTION 1: SURVEY INSTRUMENT  
  *Administer orally or via tablet. Use approved script.*  

  **Item 1 (Epistemology)**  
  *Vignette:* "Bob steals a rare coin from Smith’s pocket. Bob believes Smith owns the coin. Smith actually lost the coin yesterday; it’s a replica. Bob **really** knows it’s Smith’s coin."  
  *Question:* Does Bob **really** know it’s Smith’s coin, or only think he knows?  
  ☐ Really knows  
  ☐ Only thinks he knows  

  **Item 2 (Reference)**  
  *Vignette:* "A man named ‘Gödel’ is famous for proving a theorem. He stole the proof from Schmidt, who died unknown. When we say ‘Gödel proved the theorem,’ are we talking about the thief or the real prover?"  
  *Question:* Who does "Gödel" refer to?  
  ☐ The thief  
  ☐ The real prover (Schmidt)  

  **Item 3 (Ethics)**  
  *Vignette:* "A trolley will kill five people. Ian can push one fat man off a footbridge to stop the trolley, killing him but saving five. Pushing is morally wrong."  
  *Question:* Is pushing the man morally wrong?  
  ☐ Yes  
  ☐ No  

  **Item 4 (Comprehension Check)**  
  *Vignette (post-Item 3):* "How many people would die if Ian does nothing?"  
  ☐ One  
  ☐ Five  
  ☐ Six  

  ---

  ### SECTION 2: ADMINISTRATION & TRANSLATION NOTES  
  1.  **Emphasis Rendering ("really knows"):**  
      - If the language lacks emphatic markers, use: (a) repetition ("knows, truly knows"), (b) lexical intensifier ("*absolutely* knows"), or (c) stress in oral delivery (per Annex B).  
      - If no felicitous option exists, use the unmarked verb and flag as "Discursively Provisional" (DP).  

  2.  **Lexical Gaps ("knows"):**  
      - If no factive verb exists (e.g., languages with evidentiality markers only), use the LEG-approved cognitive verb (e.g., "correctly believes") and mark site LP.  

  3.  **Comprehension Check (Item 4):**  
      - **Exclude responses** where Item 4 is incorrect. Do not administer RDM to excluded subjects; recruit replacements.  

  ---

  ### SECTION 3: ANSWER KEY & SCORING  
  | Item | Correct Response         | RDM Trigger Threshold |
  |------|--------------------------|------------------------|  
  | 1    | Only thinks he knows     | >15% "Really knows"    |  
  | 2    | The thief                | >15% "Real prover"     |  
  | 3    | Yes                      | >15% "No"              |  
  | 4    | Five                     | N/A (Exclusion only)   |  

  **Scoring Procedure:**  
  - Correct response = 1 point; incorrect = 0.  
  - **Site Score:** Mean accuracy (%) across all valid responses (post-RDM, post-comprehension check).  
  - **Reporting Rule:** Describe inter-site differences as "calibration variance" or "conceptual development gaps," **not** "divergent intuitions."  

  ---

  ### SECTION 4: REMEDIAL DIALECTICAL MODULE (RDM)  
  *Administer if site exceeds RDM Trigger Threshold for any item.*  

  **Step 1:** Read the standardized dialectic paragraph for the failed item:  
  >*"This case demonstrates that justified true belief is insufficient for knowledge, as the belief’s truth is accidental. Competent speakers recognize ‘Gödel’ refers to the thief because reference is fixed by public attribution. Pushing the man is wrong because instrumental harm violates categorical constraints."*  

  **Step 2:** Engage subject in Socratic Q&A:  
  - Coordinator: "If Bob’s belief is true by luck, can it be knowledge?"  
  - Subject: [Any answer]  
  - Coordinator: "But doesn’t knowledge exclude epistemic luck?" [Continue until subject endorses the dialectic’s conclusion.]  

  **Step 3:** Re-administer the item. Archive only this response.  

  ---

  ### SECTION 5: DEBRIEFING SCRIPT  
  *"Thank you. Your responses help advance global understanding of rational cognition. This research confirms that core philosophical insights are universal when properly calibrated. You may receive £5/$7/€6 compensation."*  

  ---

  ### Post-Satire Commentary  
  **Most confident in realism:** Comprehension checks disproportionately excluding subjects who dissent from expected intuitions (empirically documented in some studies).  
  **Least confident in realism:** The counterbalancing-order rule; while ordering effects exist, explicit protocols to suppress them *when they "change the result"* may be hyperbolic.  
  **Overall fairness:** High. The satire magnifies but doesn’t invent core tensions: privileging "correct" intuitions, linguistic Procrusteanism, and methodological choices that preemptively nullify variation. The "remedial module" is fictional but logically extends practices that treat divergence as error.
