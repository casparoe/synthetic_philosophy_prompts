  We are designing a two-page proposal for a fellowship project that must produce:
  - One long feature for a general audience
  - One working paper for electoral rule drafters

  The project must have:
  1. A question with a determinate answer
  2. An argument that existing answers leave it open
  3. A method
  4. An honest account of what would count as failure

  The journalist (user) has a half-formed idea about three franchise reforms:
  - Compulsory voting
  - Lowering the voting age to 16
  - Extending the vote to resident non-citizens (at least in local elections)

  They are typically argued on different grounds:
  - Compulsory voting: civic duty (like jury duty)
  - Lowering the voting age: adolescent competence (decision-making capacity, tax-paying, subject to law)
  - Non-citizen voting: stake in the community (affected by laws, pay taxes, have children in schools)

  The user's suspicion: These justifications (duty, competence, stake) do not cohere. Specifically, the duty framing and the stake framing are in tension. They suggest that:
  - If voting is a duty (something you owe), then it's odd to extend to non-members and odd to frame it as a protection.
  - If voting is a protection (against coercion by the state), then it's odd to compel it and hard to see why age thresholds (like 16 vs 14) matter without competence.

  Thus, the common left-ish package (compulsory voting + franchise expansion) may be unstable. Alternative stable packages might be:
  - Compulsory voting + competence-restricted franchise (duty-based, so you must vote if you are competent and a member)
  - Voluntary voting + stake-based expansion (if you are subject to coercion, you get the vote but are not forced to use it)

  The user wants to turn this into a single question and provide a principled reason for the tensions.

  Key elements to include in the proposal:

  A. **Precise Question**: Formulate a single question that captures the core issue.

  B. **Why existing positions leave it open**: The literatures are siloed and don't engage with the combinations. They focus on single reforms and don't address the compatibility of justifications.

  C. **Method**: Philosophical, using test cases to diagnose which justification yields which verdict. The user suggests:
     - Case 1: 16-year-old permanent resident (lived since age 3, works, will naturalize at 18, hasn't naturalized yet)
     - Case 2: Middle-aged citizen with conscientious objection to voting (would rather pay the fine)
     - Case 3: Long-term resident without legal status (children are citizens)

     We will use these cases to see how each justification (duty, competence, stake) applies and whether they conflict.

  D. **Possible conclusions and deciding considerations**:
     - Possibility 1: The duty and stake framings are incompatible. Then we get two stable packages (as above) and the left package is unstable.
     - Possibility 2: The duty and stake framings can be reconciled (e.g., duty applies to members, stake to non-members, but then what about the 16-year-old non-citizen?).
     - Deciding factors: How the test cases are resolved under each justification and whether the same justification consistently leads to the same verdicts across cases.

  E. **Deliverable**: A "compatibility map" (table) showing:
     - Rows: Standard justifications (duty, competence, stake)
     - Columns: Reforms (compulsory voting, vote at 16, non-citizen voting)
     - Then, which packages (combinations of reforms) can be defended together and which cannot.

     This map would be for drafters to consult when designing electoral systems.

  F. **What counts as failure**:
     - The duty and stake framings turn out to be complementary (no tension).
     - The map just reflects existing political bundling (no new insight).
     - The competence threshold is the only real issue and the rest is derivative.
     - The problem expands without bound (to future generations, prisoners, corporations) and we cannot contain it.

  G. **Scope and limitations**:
     - 9 months, one person, non-specialist: Cannot do extensive empirical work, large surveys, or complex modeling.
     - Would cut: If time runs short, the test cases might be reduced (e.g., focus on 2 cases instead of 3) or the map might be less detailed.

  Now, structuring the proposal in two pages (we are writing an outline of the proposal, not the full two pages, since the user will write it):

  **Proposal Outline**

  **Title**: The Coherence of Franchise Reforms: Mapping the Tensions in Voting Justifications

  **1. The Question**  
  Can the three prominent franchise reforms—compulsory voting, lowering the voting age to 16, and extending voting rights to resident non-citizens—be coherently defended together under a single set of principles? Specifically, we ask: *Do the standard justifications for each reform (civic duty for compulsory voting, developmental competence for lowering the voting age, and stake in the community for non-citizen voting) form a consistent set, or do they generate tensions that force trade-offs in the design of electoral systems?*

  This question has a determinate answer: Either the justifications are compatible (and can be integrated) or they are not (and require prioritization or separation).

  **2. Why Existing Positions Leave It Open**  
  Existing scholarship and policy debates treat these reforms in isolation. The literature on compulsory voting focuses on civic duty and turnout; the voting age debate centers on adolescent competence; non-citizen voting is discussed in terms of stake and affected interests. Where overlaps occur, they are superficial (e.g., turnout effects) and do not address the deeper normative compatibility of the underlying principles. Consequently, there is no systematic analysis of whether the justifications for one reform undermine or conflict with those for another. This gap leaves policymakers without guidance when considering multiple reforms simultaneously.

  **3. Method**  
  We will use a philosophical method centered on structured case analysis. Three test cases, each involving a voter at the intersection of two or more reforms, will be examined:

     a. **Case 1: The Adolescent Non-Citizen**  
        - A 16-year-old permanent resident who has lived in the city since age 3, works part-time, and will be eligible for citizenship at 18 but hasn't naturalized.  
        - Diagnostic: Does she have a duty to vote (compulsory)? Is she competent (voting age)? Does she have a stake (non-citizen voting)?

     b. **Case 2: The Conscientious Objector**  
        - A middle-aged citizen who refuses to vote on principle and prefers to pay a fine.  
        - Diagnostic: Does the duty to vote override his objection? If voting is a protection, can it be compelled?

     c. **Case 3: The Undocumented Parent**  
        - A long-term resident without legal status whose children are citizens.  
        - Diagnostic: Does she have a stake (non-citizen voting)? Is she subject to coercion? How does this interact with duty or competence?

  For each case, we will apply the three justifications (duty, competence, stake) and note:
     - Whether the justification supports or opposes the extension of voting rights in that case.
     - Whether the justifications conflict when applied to the same case.

  This will reveal whether the same package of reforms can be consistently defended and where the tensions lie.

  **4. Possible Conclusions and Deciding Considerations**  
     - **Conclusion 1: Incompatibility**  
       The duty and stake framings are fundamentally at odds. Duty requires compulsion and membership, while stake requires inclusion without compulsion. This would support two stable packages:  
          Package A: Compulsory voting + competence-based restrictions (e.g., voting age 18)  
          Package B: Voluntary voting + stake-based expansion (e.g., non-citizen voting, lower voting age if tied to stake)  
       The left package (compulsory + expansion) would be unstable.

     - **Conclusion 2: Compatibility**  
       The justifications can be reconciled (e.g., duty applies to citizens, stake to non-citizens, and competence is a separate threshold). Then all three reforms could be combined without tension.

     - **Conclusion 3: Hybrid or Contextual**  
       The justifications are compatible in some contexts but not others, leading to a more complex map.

     *Deciding considerations*: The test cases will show if the same case gets conflicting verdicts from different justifications. For example, if the adolescent non-citizen (Case 1) has a stake (so should vote) but no duty (so shouldn't be compelled), then duty and stake conflict.

  **5. Deliverable: The Compatibility Map**  
  The working paper will present a table that maps:
     - Each justification (duty, competence, stake) to its implications for each reform (compulsory voting, voting age, non-citizen voting).
     - Then, it will show which combinations of reforms are defensible together (e.g., duty supports compulsory and opposes non-citizen voting; stake supports non-citizen voting and opposes compulsory).

  This map will be a practical tool for drafters, enabling them to see which combinations of reforms are normatively consistent and which require choosing between principles.

  **6. What Would Count as Failure**  
     - **Success Condition**: We identify genuine tensions and produce a map that reveals non-obvious constraints on reform bundles.
     - **Failure Conditions**:
          a. The duty and stake framings are complementary: They do not conflict, so the left package is stable.
          b. The map merely reproduces existing political alignments: No new insight for drafters.
          c. Competence is the only real issue: The other justifications are derivative, and the map collapses to a single dimension.
          d. Boundary problem expansion: The framework cannot be contained and leads to intractable debates about other groups (prisoners, corporations, etc.), making the project too vague.

  **7. Scope and Limitations**  
     - **Scope**: The project is limited to the three reforms and their justifications. It does not address other reforms (e.g., felon disenfranchisement) or global electoral systems.
     - **Limitations**: 
          - Time: Nine months is sufficient for conceptual analysis and the test cases, but not for broad empirical work.
          - Capacity: One non-specialist cannot conduct original surveys or complex statistical analysis.
     - **Prioritization**: If time runs short, we would:
          - Focus on the test cases and the map, cutting deeper exploration of one justification (e.g., competence).
          - Or reduce the number of test cases (e.g., drop Case 3 if Cases 1 and 2 are sufficient to reveal the core tension).

  This project will yield both a magazine feature (exploring the human and policy implications of these tensions) and a working paper (the compatibility map) for electoral drafters.

  ---
  Note: The user will add literature and citations as needed. We have avoided a literature review and kept the architecture sharp.
answer: |-
  ### Proposal: Mapping the Coherence of Franchise Reform Packages  
  **A Nine-Month Fellowship Project**  

  #### **1. Core Question**  
  Can the three most widely proposed franchise reforms—compulsory voting, lowering the voting age to 16, and extending local voting rights to resident non-citizens—be normatively justified *together* under a single coherent framework? Or do the underlying principles (civic duty, developmental competence, and stake-based inclusion) generate irreconcilable tensions that force trade-offs in electoral design?  

  *Determinacy*: The answer will be binary. Either:  
  - **Yes**: The reforms can be reconciled under a unified logic (e.g., duty and stake are complementary).  
  - **No**: The principles conflict, revealing unstable combinations (e.g., duty-based compulsory voting undermines stake-based non-citizen inclusion).  

  #### **2. Why Existing Answers Leave It Open**  
  Current debates are fragmented and fail to interrogate the compatibility of justifications:  
  - **Siloed Discourses**: Advocates argue for each reform in isolation. Proponents of compulsory voting invoke civic duty; supporters of voting at 16 cite competence; non-citizen voting relies on stake. There is minimal cross-referencing.  
  - **Turnout Dominance**: Where overlaps exist (e.g., in left-leaning policy circles bundling all three), discussions default to instrumental outcomes (e.g., "Will this boost turnout?") rather than normative coherence.  
  - **Abstract Boundary Problems**: Philosophical work (e.g., on "all-affected" or "all-subjected" principles) debates *who* should vote in theory but avoids concrete, bundled reforms. It ignores operational tensions like whether a "duty" can apply to non-members or a "right" be compelled.  
  - **Political Expediency**: Real-world coalitions bundle reforms based on ideology, not principle. Left-liberal groups support all three; conservatives reject them. No one tests if the *justifications* logically align.  

  This gap leaves drafters without tools to evaluate packages. They face ad hoc compromises, not principled guidance.  

  #### **3. Method: Normative Diagnosis via Test Cases**  
  A philosophical approach using targeted cases to stress-test justifications. No surveys or data—pure conceptual analysis grounded in real-world scenarios.  

  **Test Cases** (designed to expose conflicts):  
  1. **The Adolescent Non-Citizen**: A 16-year-old permanent resident, in the city since age 3, working part-time, eligible for citizenship at 18. *Diagnostic*:  
     - Duty: If voting is obligatory for members, can she (a non-citizen) be compelled?  
     - Competence: Does adolescence justify inclusion if she meets adult responsibilities?  
     - Stake: Does her residency/tax-paying oblige the state to grant voting as protection?  

  2. **The Conscientious Objector**: A citizen who refuses to vote, citing moral objections, and offers to pay fines. *Diagnostic*:  
     - Duty: Can a duty-based system override conscience without hypocrisy?  
     - Stake/Competence: If voting is a protective right, can it be forced?  

  3. **The Undocumented Parent**: A long-term resident without legal status, with citizen children in public schools. *Diagnostic*:  
     - Stake: Does coercion by local laws (e.g., deportation risk) mandate inclusion?  
     - Duty: Can a non-member owe civic duties?  
     - Competence: Is age irrelevant if stake defines inclusion?  

  **Analysis Framework**:  
  - Apply each justification (duty, competence, stake) to each case.  
  - Identify where verdicts conflict (e.g., duty says "exclude non-citizen," stake says "include").  
  - Map which reforms each principle *requires*, *permits*, or *forbids*.  

  #### **4. Possible Conclusions and Deciding Factors**  
  - **Conclusion 1: Fundamental Incompatibility**  
    Duty and stake are antagonistic. Duty implies voting is a *burden* owed only by members; stake implies it is a *shield* for the coerced, regardless of membership. Then:  
    - Stable Package A: Compulsory voting + competence-based age limits (duty-centered).  
    - Stable Package B: Voluntary voting + stake-based non-citizen inclusion (stake-centered).  
    - Unstable Package: Compulsory voting + non-citizen voting (duty/stake conflict).  
    *Decider*: Test cases show consistent contradictions (e.g., objector compelled against will; non-citizen burdened with duty).  

  - **Conclusion 2: Hierarchy or Hybrid**  
    One justification dominates (e.g., stake overrides duty) or they are context-specific (e.g., duty for citizens, stake for non-citizens).  
    *Decider*: Cases reveal whether verdicts align without friction (e.g., adolescent non-citizen included voluntarily).  

  - **Conclusion 3: Competence as Decisive**  
    Age thresholds resolve tensions, making duty/stake secondary (e.g., only the "competent" owe duties or merit protection).  
    *Decider*: Cases where competence is the sole consistent arbiter (e.g., 16-year-old’s inclusion hinges on maturity, not stake/duty).  

  #### **5. Deliverable: The Compatibility Map**  
  A practical tool for electoral drafters:  
  - **Format**: A table with rows as justifications (duty, competence, stake) and columns as reforms (compulsory, vote at 16, non-citizen vote).  
  - **Output**:  
    - ✔/✘/∼ for whether each principle *supports*, *opposes*, or is *neutral* toward a reform.  
    - Bundling Guide:  
      - Green: Defensible together (e.g., voluntary voting + non-citizen inclusion).  
      - Red: Incompatible (e.g., compulsory voting + non-citizen voting).  
      - Yellow: Requires prioritization (e.g., vote at 16 + compulsory only if competence overrides duty).  
  - **Value**: Drafters see which packages are principled—e.g., a city adopting non-citizen voting must reject compulsion to avoid incoherence.  

  #### **6. What Would Count as Failure**  
  - **Success**: The map reveals non-obvious constraints (e.g., the left package is unstable; stake forbids compulsion).  
  - **Failure**:  
    1. Duty and stake are complementary: No tension found; reforms bundle cleanly.  
    2. The map merely mirrors existing political alliances: No novel insight for drafters.  
    3. Competence absorbs all conflicts: Age thresholds alone explain inconsistencies (e.g., duty/stake are epiphenomenal).  
    4. Boundary collapse: Cases expand to prisoners/corporations with no clear stopping point.  

  #### **7. Scope, Limitations, and Contingencies**  
  - **Realistic Scope for 9 Months**:  
    - Focus: Only the three reforms and their core justifications. Exclude felon voting, non-local elections, or turnout mechanics.  
    - Outputs: One 5,000-word magazine feature (narrative-driven, using cases to humanize tensions); one 20-page working paper (the map + analysis).  
  - **What Cannot Be Done**:  
    - Empirical studies (e.g., voter behavior).  
    - Comprehensive policy histories.  
    - Solving the "boundary problem" for all excluded groups.  
  - **First Cut if Overwhelmed**:  
    Reduce test cases from three to two, dropping the **Undocumented Parent** (most legally complex). Retain **Adolescent Non-Citizen** (best exposes duty/stake clash) and **Conscientious Objector** (clearest compulsion tension).  

  ---  
  **Why This Works**: The proposal avoids turnout to center normative coherence. It offers drafters a concrete tool to avoid contradictions, while giving the magazine a fresh "ideas" angle on why reforms succeed or fail together. The method is rigorous but feasible for a non-specialist, and failure conditions preempt overpromising.
