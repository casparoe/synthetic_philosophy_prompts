prompt: |-
  So I'm on a volunteer research-prioritization group (tiny, unpaid, very online) and we go in circles about insect sentience. Every single time, someone drops "absence of evidence is not evidence of absence", someone else answers with "extraordinary claims require extraordinary evidence", and a third person says "when in doubt, err on the side of caution" — and somehow all three get used to argue for opposite conclusions. The place it's doing real work is the scale argument: person A says we can't rule out sentience and the numbers people bandy about for insects are astronomical, so even a lowish probability times those numbers swamps everything else we could fund; person B says the same slogan, but insists we basically know nothing, the probability is properly tiny, and we should stick to what we can measure. I can never tell whose side the slogan is actually on, and I suspect it's being used as a claim about evidence and then spent as a claim about what to do.

  Two wrinkles I'd like taken seriously rather than smoothed over. First: sentience might not be binary. Maybe what matters isn't P(insects are sentient) times N but something like an expected welfare range — and "no evidence" about the *degree* seems to do as much damage as "no evidence" about the existence. Second, the sign-flip worry: if a small probability times huge numbers is decisive, then a small probability that insect lives are on balance bad is also decisive and points the other way, so the reasoning looks like it can push any direction at all. Someone mentioned Pascal's mugging and got shouted down, but I didn't follow why this case is supposed to be different.

  I'd like a disambiguation, not a verdict on insect sentience. Please give me:

  1. "The readings" — 8–10 distinct precise things the slogan could be claiming, ordered from trivial to radical, one or two sentences each, each stating what it would actually license. This should be the bulk of the answer, ~half.
  2. "Verdicts" — a short pass over that list sorting it into platitude / substantive-but-defensible / actually false, and flagging any reading that is true but doesn't say anything about insects. ~100 words.
  3. "Which reading does which job" — for each of the three uses it gets in our meetings (precaution, dismissal, expected-value-plus-scale), say which reading is needed to get that conclusion and whether that reading survives section 2. ~200 words.
  4. "Where the numbers come in" — whether huge N lets a weak reading do a strong reading's work, plus the graded-sentience and sign-flipping wrinkles above. ~250 words.
  5. "What I say at the meeting" — 3 or 4 sentences, the honest thing to say instead of the slogan. ~60 words.

  No citations or further reading, I just want the distinctions.
reasoning: |-
  Okay, the user is part of a volunteer group discussing insect sentience, and they're stuck in circular arguments using the same slogans. They need clarity on what "absence of evidence isn't evidence of absence" actually means and how it applies in their context. The key issues are the scale argument, non-binary sentience, and the sign-flip problem where small probabilities can lead to opposite conclusions.

  First, I need to unpack the slogan into distinct interpretations. The user wants 8-10 precise readings, ordered from trivial to radical. Let me start with the basic Bayesian interpretation: absence of evidence lowers probability if evidence was expected. That’s uncontroversial. Then move to the common misunderstanding that absence implies evidence of absence, which is false. The next level could be about non-updating: absence doesn’t change priors, but that assumes priors exist. Then more radical claims, like absence should increase belief in the phenomenon or that it’s always irrational to lower probability. 

  For the verdicts, I’ll categorize each reading as platitude, defensible, or false. The Bayesian update is a platitude, while the radical claim that absence increases belief is false. Some readings might be true but irrelevant to insects if there’s no prior expectation of evidence.

  Next, applying these to their three meeting uses: precaution, dismissal, and expected-value. For precaution, the defensible reading might be that absence doesn’t prove non-existence, so caution is warranted. Dismissal relies on the misunderstanding that absence is evidence of absence, which is false. The expected-value argument uses the scale to turn a weak reading into a strong one, but that’s where Pascal’s mugging and sign-flip come in.

  Addressing the wrinkles: Graded sentience complicates the expected welfare calculation, making probabilities even more speculative. Sign-flip means small probabilities of negative welfare could outweigh positives, so the argument can flip direction. Huge N amplifies uncertainties, requiring stronger evidence to avoid arbitrary conclusions.

  For the user’s script, emphasize that the slogan alone doesn’t resolve anything. Highlight the need for priors and evidence expectations. Point out that without knowing what evidence to expect, absence doesn’t guide us. Suggest focusing on tractable research instead of letting speculative probabilities dominate.
answer: |-
  Here's the disambiguation you requested, structured per your requirements:

  ### 1. "The Readings" (Ordered Trivial → Radical)
  1. **Trivial Bayesian Update**: If we *should* have found evidence for X given our methods but didn't, this *lowers* the probability of X. *(Licenses: Lowering P(X) when evidence was expected.)*  
  2. **Misconception Correction**: Absence of evidence **is not proof of absence** (i.e., it doesn't entail P(X)=0). *(Licenses: Rejecting claims that X is impossible.)*  
  3. **Non-Update Stance**: Absence of evidence alone *does not justify reducing* P(X) from your prior. *(Licenses: Maintaining prior beliefs if no evidence was expected.)*  
  4. **Epistemic Caution**: Absence of evidence means we *cannot confidently reject X*. *(Licenses: Avoiding strong negative claims like "X is false".)*  
  5. **Prior Preservation**: Absence shouldn’t *increase* P(¬X) beyond your prior. *(Licenses: Resisting arguments that absence "supports" non-existence.)*  
  6. **Aggressive Ignorance**: Absence of evidence *leaves P(X) entirely unchanged* from its prior. *(Licenses: Treating no-data as neutral, even if evidence was likely.)*  
  7. **Evidence Threshold**: Absence only weakens X if we *should reasonably have expected evidence by now*. *(Licenses: Demanding a justification for why evidence "should" exist before updating.)*  
  8. **Radical Suspension**: Absence means we have *no rational basis to assign any probability* to X or ¬X. *(Licenses: Ignoring X in decisions until evidence appears.)*  
  9. **Anti-Falsificationism**: Absence *cannot reduce P(X)*, even fractionally, without positive evidence *against* X. *(Licenses: Never downgrading X due to failed searches.)*  
  10. **Reverse Psychology**: Absence of *easy-to-find* evidence *increases* P(X) because X must be subtle/elusive. *(Licenses: Believing X *more* strongly when searches fail.)*  

  ---

  ### 2. "Verdicts"  
  - **Platitude**: #1 (trivial Bayesian), #2 (not proof of absence).  
  - **Substantive-but-Defensible**: #3 (non-update; assumes justified prior), #4 (caution), #5 (prior preservation), #7 (evidence threshold).  
  - **Actually False**: #6 (ignores expected evidence), #8 (all-or-nothing probability), #9 (never update down), #10 (absence as positive evidence).  
  - **True but Irrelevant to Insects**: #2, #4, #5 (don’t address *whether insects likely have sentience*; only combat premature certainty).  

  ---

  ### 3. "Which Reading Does Which Job"  
  - **Precaution ("Err on caution")**: Uses #4 (can’t reject sentience) or #3 (don’t lower P(sentience)). *Survives?* Defensible if prior P(sentience) > 0, but doesn’t justify *high* caution alone.  
  - **Dismissal ("No evidence!")**: Illegitimately uses #8 (no basis to assign probability) or falsely treats absence as #1 (evidence *was* expected). *Survives?* #8 is false; #1 requires showing evidence *should* exist.  
  - **Expected-Value-Plus-Scale**: Needs #3 or #6 (keep prior P(sentience) intact) to argue tiny prior × huge N matters. *Survives?* #3 defensible only with reasoned prior; #6 false. Without prior justification, scale can’t rescue weak readings.  

  ---

  ### 4. "Where the Numbers Come In"  
  **Huge N amplifying weak readings**: If defensible reading #3 holds (P(sentience) isn’t lowered by absence), then large insect populations *can* make even a modest prior P(sentience) dominate expected value calculations. But this requires:  
  - A credible prior (e.g., not 10⁻¹⁰⁰).  
  - Absence of evidence being unsurprising (#7), else #1 applies and P(sentience) *should* drop.  

  **Graded Sentience Wrinkle**: Expected welfare becomes ∫ P(S=s) × Welfare(s) ds over possible sentience levels *s*. Absence of evidence now harms *all* terms: we lack data on P(S>0), the distribution of *s*, *and* welfare scaling. This amplifies uncertainty, making expected welfare estimates arbitrary without anchoring evidence.  

  **Sign-Flip Worry**: Yes, if tiny P(sentience) × N × welfare matters, then tiny P(net suffering) × N × harm equally matters. The logic *is* symmetric and vulnerable to Pascal’s Mugging (extreme claims with tiny probability dominating). The rebuttal? **Priors must be constrained by plausibility.** If P(sentience) is based on neurobiological analogy (e.g., bees show learning), it’s more grounded than P(insects are net suffering) which lacks mechanistic support. But without evidence, *both* are weakly justified.  

  ---

  ### 5. "What I Say at the Meeting"  
  > "This slogan alone doesn’t resolve anything. Whether absence of evidence lowers P(sentience) depends entirely on *whether we should have expected evidence by now* and our *prior justification*. Without addressing those, repeating the slogan just masks our disagreements. Crucially, even if we keep a non-zero prior, the sign-flip problem and welfare-range uncertainty mean speculative expected-value calculations are untrustworthy. We should focus on gathering evidence or prioritizing tractable questions."  

  ---  
  This framework forces clarity: *Which reading are you using? Is your prior justified? Why should we have expected evidence?* Without these, the slogan is rhetorical camouflage.
