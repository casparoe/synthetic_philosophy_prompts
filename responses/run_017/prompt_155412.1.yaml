answer: |-
  ### The mapping
  In originalist intentionalism applied to the Second Amendment, the relevant "author" is the ratifying public—specifically, the state conventions that ratified the Constitution and its amendments. While Congress drafted the text, ratification by sovereign states conferred authority. Intentionalism prioritizes the *publicly understood meaning* at ratification (per Scalia's "original public meaning" variant), not secret draftsmen's intent. Evidence includes:  
  - **Drafting records** (e.g., proposals rejected in Congress)  
  - **Ratification debates** (e.g., state convention speeches)  
  - **Contemporary linguistic sources** (e.g., Samuel Johnson’s dictionary, legal treatises like Blackstone)  
  - **State constitutional analogues** (e.g., Pennsylvania’s 1776 "defense of themselves" clause)  
  - **Structural context** (e.g., Article I’s militia clauses)  

  The interpreter’s job is to reconstruct the communicative intent—what the text was understood to commit the polity to—using historical evidence. This requires distinguishing between the *semantic meaning* (what "keep and bear Arms" denoted) and *expected applications* (e.g., 18th-century muskets).

  ---

  ### What the theory gets right
  Intentionalism explains the core methodological overlap in *Heller*’s opinions. **Scalia’s majority** anchored its individual-right reading in founding-era dictionaries (e.g., "bear arms" meaning personal carry), pre-1787 state constitutions protecting self-defense, and the Amendment’s operative clause structure ("right of the people"). **Stevens’ dissent** invoked drafting history (Congress’s rejection of "for the common defense" phrasing) and militia-focused ratification debates to argue the right was collective. Both sides claimed intentionalist legitimacy: the majority emphasized the ratifiers’ understanding of "arms" as unqualified individual property; the dissent highlighted the preamble’s functional purpose. Intentionalism correctly predicts this forensic focus on 1791 sources, rejecting purely policy-based readings like Breyer’s interest-balancing dissent. It would expect both opinions to engage deeply with historical linguistics and context—which they did.

  ---

  ### Where it breaks, and where it is silent
  **Collective authorship**: Intentionalism lacks criteria to weight conflicting evidence across authors. Was the ratifiers' understanding (emphasized by Scalia) or drafters' rejected proposals (invoked by Stevens) decisive? The theory stipulates ratifiers but cannot resolve tensions within that body.  

  **Level-of-generality**: The majority framed the intent as "self-defense" (high generality), while dissenters read it as "militia preparedness" (narrow). Intentionalism offers no principled way to choose. Scalia’s claim that "bear arms" excluded military contexts is contradicted by contemporary usage (e.g., Pennsylvania Ratification debates), exposing subjectivity in selecting generality.  

  **Expected applications gap**: The authors didn’t foresee handgun bans. Scalia bridged this by asserting that handguns are "Arms" in the *original sense*—common weapons for self-defense—while Breyer noted they were rare in 1791. Intentionalism *requires* analogizing unforeseen cases to original semantic meaning, but this becomes quasi-hypothetical when historical evidence is thin (e.g., no founding-era laws banning home weapons).  

  **Evidence selection**: The majority cited pro-individual-right sources (e.g., Blackstone on self-defense), while Stevens highlighted militia-centric records. Intentionalism provides no hierarchy for conflicting evidence—it cannot explain why Scalia dismissed the preamble as "prefatory" while Stevens treated it as limiting.  

  **Silence**: The theory does not address how linguistic ambiguity (e.g., "well regulated militia") should be resolved when evidence is mixed, nor how to weigh post-ratification interpretations (e.g., 19th-century case law).

  ---

  ### Diachronic authorship, assessed
  Your proposal—meaning as an "inheritance chain" integrating prior applications—finds traction in law. *Heller* itself cited 19th-century cases (e.g., *Cruikshank*) as interpretive milestones, treating precedent as accretive to original meaning. This *is* a distinct third way: neither frozen intentionalism (ignoring institutional history) nor anti-intentionalism (denying original authority). However, it faces two challenges:  
  1. **Collapse risk**: If each generation’s reading alters meaning, the "lineage" becomes anti-intentionalist—the "author" dissolves into interpretive tradition.  
  2. **Notice problem**: Citizens need predictable rules. If *Heller*’s individual-right reading relies partly on post-1791 precedent (e.g., 20th-century scholarship), it weakens advance notice claims.  

  Yet in law, this approach *works* because institutions (courts, legislatures) legitimize the chain. It is *not* mere anti-intentionalism disguised, as it respects the text’s authority while acknowledging that applications evolve its operative meaning.  

  ---

  ### What the case does and does not show about texts generally
  **Coordination demand does heavy lifting**: Legal texts must resolve disputes ex ante; intentionalism’s appeal here is its promise of fixed, discoverable rules. *Heller*’s focus on historical meaning serves this need—citizens can (in theory) discern rules from public sources. Literary texts lack this constraint; they thrive on ambiguity and reinterpretation.  

  **Implications for literary debate**: *Heller* demonstrates intentionalism’s *institutional utility* in law but not its *hermeneutic validity* for literature. Legal interpretation is constrained by:  
  - The need for finality (resolving cases)  
  - Non-renegotiability (binding dissenting citizens)  
  - Democratic legitimacy (appeal to founding authority)  
  These make original intent *functional* in law but irrelevant to, say, interpreting Kafka. The case thus reveals less about texts than about institutions: where coordination is paramount, intentionalism is pragmatically adopted, even if philosophically messy.  

  ---

  ### Bottom line
  The literary intentionalism/constitutional originalism analogy is flawed. *Heller* shows intentionalism in law is less about author-psychology than *public meaning frozen to serve coordination*. It breaks at collective intent, generality selection, and evidence conflicts—gaps filled by judicial discretion. Your diachronic authorship model is a viable legal hermeneutic, blending text and tradition, but risks undermining notice. Ultimately, *Heller* proves legal interpretation’s distinctness: it uses intentionalism because it *must* settle disputes authoritatively, not because authors determine meaning. For literary theory, the case is irrelevant—law’s constraints make its intentionalism instrumental, not epistemological.
