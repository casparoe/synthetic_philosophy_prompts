  **Adjudication of the Half-Invented View:**  
  - **The View:** Grants bivalence only for statements about computations that will actually be performed (e.g., rejects it for Node 3’s \(10^{60}\)-step program but accepts it for small computations). Accepts that all total functions on reals are continuous only for functions defined by "choice sequences" (free selections), not by laws (algorithms).  
