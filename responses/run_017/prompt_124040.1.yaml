  ### Classification Tree

  **Starting Commitment:** Everyone agrees that there are statements about computations or numbers whose truth value is currently unknown (e.g., Goldbach's conjecture or the halting of a specific program).

  1. **Concrete Case:** Consider the statement: "Every even number greater than 2 is the sum of two primes." We have verified this up to \(4 \times 10^{18}\) with no counterexamples found. Do you believe this statement is either true or false (even though we don't know which)?  
     - If yes, go to 2.  
     - If no, go to 3.  

  2. **Concrete Case:** Consider a program guaranteed to halt within \(10^{60}\) steps and output 0 or 1. It will never be run in practice. Is the statement "This program outputs 0" either true or false?  
     - If yes, go to 4.  
     - If no, go to 5.  

  3. **Concrete Case:** (Identical to Node 2) Consider a program guaranteed to halt within \(10^{60}\) steps and output 0 or 1. It will never be run. Is the statement "This program outputs 0" either true or false?  
     - If yes, go to 6.  
     - If no, go to 7.  

  4. **Concrete Case:** Consider defining a set \(S\) of natural numbers by a condition that quantifies over all sets of natural numbers (e.g., "\(n \in S\) if and only if \(n\) belongs to every set that satisfies some property"). Is this definition legitimate?  
     - If yes, go to **Classical mathematics** (Leaf A).  
     - If no, go to **Predicative mathematics** (Leaf B).  

  5. **Concrete Case:** Consider an arbitrary statement \(Q\) (e.g., "There are infinitely many twin primes") whose truth value is unknown. Define a binary sequence where every term is 0 if \(Q\) is false and 1 if \(Q\) is true. Does this sequence exist?  
     - If yes, go to **[Unexplored]** (Leaf C).  
     - If no, go to **Strict finitism** (Leaf D).  

  6. **Concrete Case:** Consider a function that takes a real number and returns: -1 if negative, 0 if zero, or 1 if positive. Is this a legitimate total function (defined for all real numbers)?  
     - If yes, go to **[Unstable]** (Leaf E).  
     - If no, go to **[Unstable: Half-invented view?]** (Leaf F).  

  7. **Concrete Case:** (Identical to Node 6) Consider the sign function (returns -1, 0, or 1 based on sign). Is this a legitimate total function?  
     - If yes, go to **[Unstable]** (Leaf G).  
     - If no, go to 8.  

  8. **Concrete Case:** Suppose a program is such that assuming it runs forever leads to a contradiction. Can we conclude it halts?  
     - If yes, go to 9.  
     - If no, go to 10.  

  9. **Concrete Case:** Is every total function from natural numbers to natural numbers computable by an algorithm?  
     - If yes, go to **Recursive constructivism (with Markov's principle)** (Leaf H).  
