  ## Discussion Paper: Reconsidering the Purpose and Practice of the Wychford Commons Restitution Trust

  **To:** The Trustees of the Wychford Commons Restitution Trust  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Resolving Current Applications and Defining Future Practice  
  **Purpose:** To recommend decisions on the two outstanding applications, establish a standing rule for future grants, and clarify the Trust's fundamental purpose to enable effective and unified governance.

  **Background:**  
  The unexpected 2019 bequest has transformed the Wychford Commons Restitution Trust from a modest provider of fuel vouchers into a significant charitable fund. This requires us to re-examine our purpose with greater rigor than the past sixty years demanded. The current applications starkly highlight fundamental tensions within the Trust Deed’s directive: to apply income for the relief of persons resident in the Borough of Wychford "in necessitous circumstances by reason of the loss of common rights effected by the Wychford Inclosure Act 1807."

  Application 1 demonstrates a clear genealogical link to a cottager named in the 1807 award but also to a commissioner responsible for that award. Application 2 highlights profound need within the Borough but lacks any ancestral connection to the commoners. The "Common Purse" proposal suggests a radical shift towards restoring a form of common property. Underlying these specific cases are divergent interpretations of what the Trust *does* when it pays out. Is it:
  1.  **Counterfactual Compensation:** Attempting to make individuals "whole" for a loss suffered by ancestors?
  2.  **Reclaiming Unjust Enrichment:** Taking back benefits derived from the enclosure from current holders?
  3.  **Symbolic Reparation:** Acknowledging and marking a historic wrong within the community?
  4.  **Needs-Based Relief:** Directing funds to the poor of Wychford, using descent as a rough proxy or historical trigger?

  These interpretations are not mutually compatible in practice, as our recent debates demonstrate. Our Clerk rightly cautions that we cannot unilaterally redefine the beneficiary class beyond the parameters of the Deed. We must operate within its terms, but we have significant discretion in interpreting "by reason of" and establishing what constitutes valid evidence of that reason.

  **Analysis & Recommended Path Forward:**

  1.  **The Core Problem: Counterfactual Impossibility and Shifting Purpose**
      *   The historian's report confirms the profound demographic rupture caused by the enclosure. The "non-identity problem" (raised by a trustee) is real: no living person can claim they would be materially better off *as an individual* had the enclosure not occurred. The causal chain is broken beyond repair for individual compensation.
      *   **Crucial Premise:** *The Trust Deed, written in 1963, cannot plausibly mandate individual counterfactual compensation for an 1807 loss, as this was logically impossible even in 1963.* The Pell family's mill-derived fortune further distances the funds from any literal "unjust enrichment" derived from the specific enclosure. The historical link is symbolic, not financial.
      *   **Conclusion:** Interpreting the purpose as individual counterfactual compensation (Option 1) or reclaiming unjust enrichment (Option 2) is fundamentally unsustainable and leads to insoluble logical and practical problems (as vividly shown by Application 2). *We must reject these interpretations.*

  2.  **Reframing the Trust's Purpose: Symbolic Reparation and Needs-Based Relief**
      *   The most coherent and workable interpretation, consistent with the Deed's language and historical context (including the Pell family's origin), views the Trust as performing **Symbolic Reparation** combined with **Needs-Based Relief** *within the affected community*.
      *   **Symbolic Reparation:** The Deed names the specific historic wrong (the 1807 Inclosure Act). The requirement for beneficiary descent from commoners serves as the *symbolic link* to that wrong, marking the relief as a form of community acknowledgement and repair, *not* individual compensation. It focuses on the community lineage affected.
      *   **Needs-Based Relief:** The funds are applied to relieve present-day "necessitous circumstances." The historic wrong provides the *reason* and *framework* for directing this relief, but the immediate trigger for payment is current need *within the resident community historically defined by that wrong*.
      *   **"By Reason Of":** This phrase is satisfied by the beneficiary belonging to the community (resident) that suffered the historic loss *and* demonstrating descent from those directly affected, creating the symbolic link. The current need is the condition for relief; the descent is the qualifying condition linking that need *to the reason specified in the deed*.

  3.  **Recommended Decisions on Current Applications:**
      *   **Application 1 (Care Worker): GRANT.** The applicant meets the core criteria:
          *   Resident in the Borough.
          *   Demonstrable necessitous circumstances.
          *   Proven descent from a cottager named in the 1807 award (the symbolic link to the historic wrong).
          The descent from the commissioner is irrelevant under this interpretation. We are relieving present need in a descendant of the wronged class, not judging the moral worthiness of lineages. The link to the cottager fulfils the Deed's requirement.
      *   **Application 2 (Man of Jamaican Descent): DO NOT GRANT.** While the applicant is clearly a resident in necessitous circumstances, he lacks the descent from the commoners affected by the 1807 Act. This descent is the required symbolic link establishing the connection "by reason of" the historic loss *as defined by the Deed*. Granting without this link would sever the action from the specific historic wrong named, transforming the Trust purely into a general poverty relief fund for Wychford residents – a purpose beyond our current powers without modification.

  4.  **Recommended Standing Rule for Future Applications:**
      *   **The Trust will award grants to individuals who:**
          1.  Are resident within the Borough of Wychford.
          2.  Are in demonstrably necessitous circumstances.
          3.  Provide satisfactory evidence (e.g., via reliable genealogical research using parish registers, census records, or reputable commercial databases) of descent from an individual named as holding common rights in the official records of the Wychford Inclosure Award of 1807, or demonstrably resident in the Parish at that time and of the social class known to hold such rights where direct naming is absent. (Note: Clerk to define precise evidence standards).
      *   **Rationale:** This rule operationalises the Symbolic Reparation/Needs-Based Relief interpretation. It honours the Deed's requirement for a link to the historic wrong (via descent) while focusing resources on alleviating present hardship within the community. It provides a clear, objective, and historically grounded test for eligibility.

  5.  **Addressing the "Common Purse" Proposal:**
      *   The Common Purse proposal (buying land for a Community Land Trust) is a thoughtful attempt at systemic repair. However:
          *   **Practical & Legal Hurdles:** Acquiring sufficient land within the Borough for meaningful "common" use may be prohibitively expensive or impossible. Vesting land in a CLT is a complex legal undertaking requiring expertise we likely lack. Crucially, it fundamentally changes the *nature* of the relief from individual grants to creating a new communal asset. This likely constitutes a significant variation of the Trust's purposes requiring Cy-Près or similar approval from the Charity Commission – it cannot be implemented solely by trustee decision.
          *   **Philosophical Alignment:** While symbolically resonant (restoring "common" property), it moves further from the Deed's focus on relieving the *necessitous circumstances of individuals* "by reason of" the loss. It addresses the *type* of loss but risks losing the focus on individual hardship arising *from* that historic event within the living community linked to it.
      *   **Recommendation:** Do not adopt the Common Purse proposal *at this time*. It represents a radical departure requiring external sanction and significant further feasibility study. We should focus on implementing a clear, sustainable, and legally defensible interpretation of our *existing* purpose for individual grants. However, trustees wishing to explore the Common Purse concept further should be invited to form a working group (separate from grant decisions) to investigate feasibility, costs, legal pathways, and potential benefits, reporting back to the full board at a future date.

  **Reasons for Dissenting Trustees to Stay:**

  1.  **Clarity and Consistency:** This framework provides a clear, consistent, and legally defensible interpretation of the Deed that resolves the logical contradictions of counterfactual compensation. It allows us to act decisively.
  2.  **Honouring Both Elements:** It genuinely honours *both* key elements of the Deed: the specific historic wrong *and* the relief of present need, through the mechanism of descent as the qualifying link.
  3.  **Practical Compassion:** It ensures funds reach genuinely needy residents who also bear the symbolic connection to the community's historic loss.
  4.  **Room for Evolution:** The recommendation *does not* preclude exploring alternative structures like the Common Purse in the future through the proper channels. It focuses our immediate efforts on a viable path.
  5.  **Stewardship:** It represents responsible stewardship, ensuring the Trust's significant new resources are used effectively within its defined purpose, avoiding legal challenge or mission drift.

  **Confidence and Crucial Premise:**

  *   **Confidence Level:** High. This recommendation resolves the immediate practical and logical dilemmas while respecting the Deed's core requirements.
  *   **Crucial Premise:** *The requirement for descent from the commoners is best understood not as a claim to individual compensation for the 1807 loss (which is impossible), but as the essential symbolic link connecting present-day relief of need to the specific historic wrong named in the Trust Deed.* This premise allows us to move beyond the non-identity problem and focus on a meaningful, practical application of the Trust's resources. If this symbolic interpretation of the descent requirement is rejected, the entire rationale for limiting grants based on ancestry collapses, leaving only unresolvable contradiction or the need for fundamental Deed change. **This is the core disagreement we must resolve.**

  **Conclusion:**  
  The Wychford Commons Restitution Trust cannot undo the past or calculate individual losses across centuries. What it can do, honouring its Deed, is acknowledge a historic injustice specific to this community and direct charitable relief to alleviate present hardship among residents who maintain a tangible, genealogical connection to those who were directly affected. This is neither pure historical reparation nor simple poverty relief; it is a unique blend enabled by the Deed, using descent as the bridge between past wrong and present need. I urge the Board to approve the recommended decisions on the current applications and adopt the proposed standing rule, providing clarity, compassion, and continuity for the Trust's vital work.
