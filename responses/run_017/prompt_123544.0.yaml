prompt: |-
  I work in survey methodology and quantitative ecology. Most of my professional life is spent on designs where sampling probabilities are unequal: size-biased and length-biased sampling, capture–recapture estimation of population size, frame over- and under-coverage, and the design-based versus model-based (superpopulation) ways of arguing about the same estimator. Inclusion probabilities, Horvitz–Thompson weighting, the inspection paradox, tag loss, and the way a stopping rule changes the sample space are things I use rather than things I need explained.

  What I want is a translation of the anthropics debate — the self-sampling assumption, the self-indication assumption, and the presumptuous philosopher case — into that vocabulary, as faithfully as it can be done, followed by a report on what the translation fails to carry.

  Here is my understanding, which you should audit as you translate rather than take over. SSA, as I read it, is not a prior but a conditional sampling model: conditional on a hypothesis, my credence that I am any particular observer in the reference class is uniform, one over the number of observers in it, so the anthropic update comes entirely from more specific indexical evidence such as my birth rank. SIA is a constraint on the prior over hypotheses instead: before conditioning on anything indexical, each hypothesis is weighted by how many observers it contains, so that the bare fact that I exist is itself evidence, and in the presumptuous philosopher case the large-population hypothesis wins by the ratio of the populations, which is what makes the conclusion feel presumptuous. I have also seen it claimed that once SIA is combined with SSA, the doomsday-style shift from birth rank cancels and you end where your unanthropic prior put you. If any of that is a misreading, correct it inside the translation.

  Please do the following.

  1. Give me the systematic mapping. Pair SSA with design-based finite-population inference, where the unknown parameter includes the population size itself, as in estimating N from recaptures, and where the frame and its inclusion probabilities are fixed before the draw; pair SIA with a model-based superpopulation picture in which the number of units functions as a size-biasing weight on the draw. Then tell me whether the size bias in SIA really is the inspection paradox, or whether the resemblance is superficial.

  2. Work two cases in the mapped vocabulary, as likelihoods, inclusion probabilities, and estimators: the presumptuous philosopher, and a birth-rank or doomsday-style case. For the second, tell me whether the alleged cancellation is an identity, a consequence of a particular choice of reference class, or an artifact of the mapping.

  3. Adjudicate my recurring referee question. In my field the frame is stipulated by the designer, and its defects are called coverage error, which is a practical problem about bias, not a metaphysical question about which frame is correct. So: does the reference class problem have any home in my vocabulary at all? Is it undercoverage, or is it something the vocabulary cannot express?

  4. Give me the residue report: what has no counterpart on my side. I would like you to rule specifically on four candidates. First, pure self-locating uncertainty: once a unit is drawn, the sampler reads its label, and the nearest thing I have to a draw whose identity is unknown is uncertain identification in capture–recapture — is that a genuine counterpart to not knowing which observer I am, or does it smuggle in knowledge the anthropic case lacks? Second, the fact that this is an n-of-one design that cannot be repeated or re-randomized, so design-unbiasedness and interval coverage have nothing to be defined over. Third, hypotheses in which no observer exists and hypotheses with infinitely many observers, both of which my vocabulary handles by convention rather than by argument. Fourth, whether de se evidence can move credence at all, given that nothing in a sampling design distinguishes an observation from the inside.

  5. Finally, two constructions of my own that I cannot finish. Call the first the over-coverage model: the frame contains unfilled slots as well as occupied ones, and I conditionalize on having landed in an occupied slot. Call the second the renewal reading: in a renewal process, arriving at a random time gives you a length-biased interval, whereas sampling a random passenger from those present gives you a uniform draw, and the paradox vanishes. For each, work out what it collapses into under the mapping — SIA, SSA, both, or neither — and whether the passenger-versus-arrival distinction is decidable inside my vocabulary or is precisely the external protocol fact that my vocabulary takes as given.

  Close with a verdict on what the residue indicates: gaps in the sampling vocabulary, or places where the anthropic debate is less determinate than its participants take it to be.
reasoning: |-
  We are going to map the anthropics debate (SSA, SIA, presumptuous philosopher, doomsday) into the vocabulary of survey methodology and quantitative ecology. The goal is to see how faithfully this can be done and then report on the gaps.

  ## 0. Audit of your understanding

  You have:
  - **SSA**: Conditional on a hypothesis, the credence of being any particular observer is uniform (1 over the number of observers). This is a conditional sampling model.
  - **SIA**: A constraint on the prior over hypotheses: weight each hypothesis by the number of observers it contains. Thus, the fact that you exist is evidence for hypotheses with more observers.
  - **Presumptuous philosopher**: Under SIA, a large-population hypothesis wins by the ratio of the populations, which seems presumptuous.
  - **Cancellation in doomsday**: When SIA and SSA are combined, the anthropic update from birth rank cancels out, leaving the unanthropic prior.

  This is largely correct. We will build on this.

  ## 1. Systematic Mapping

  We map:
  - **SSA** to **design-based inference** for a finite population. Here, the population size \( N \) is an unknown fixed parameter. We have a fixed sampling frame with known inclusion probabilities. The Horvitz-Thompson estimator uses inverse probability weighting. The sampling design is fixed, and we condition on the population (or hypothesis) to compute the probability of observing a particular sample. The key is that the frame and inclusion probabilities are fixed before the draw.

  - **SIA** to a **model-based superpopulation** approach. We imagine a superpopulation from which our finite population is drawn. The size of the finite population is random and acts as a size-biasing weight. Specifically, the probability of a particular finite population being realized is proportional to its size (if we condition on the existence of at least one observer). This is similar to the inspection paradox: in a renewal process, if you sample an interval by picking a random point in time, you get a length-biased interval. Similarly, in SIA, the hypothesis is selected with a weight proportional to the number of observers.

  **Is the size bias in SIA the inspection paradox?** 
  Yes, it is essentially the same. The inspection paradox (or length-biased sampling) arises when you sample with probability proportional to size. In SIA, the prior probability of a hypothesis is proportional to the number of observers in it (if we condition on existing). So the resemblance is not superficial.

  ## 2. Work Two Cases

  ### Case 1: Presumptuous Philosopher

  **Setup**: 
  - Hypothesis \( H_1 \): Population size = \( N_1 \)
  - Hypothesis \( H_2 \): Population size = \( N_2 \), with \( N_2 \gg N_1 \)
  - We have no indexical evidence (we don't know our birth rank, etc.).

  **SIA prior**: 
  - Prior odds: \( \frac{P(H_2)}{P(H_1)} = \frac{N_2}{N_1} \times \frac{\text{prior odds without SIA}}{} \) 
  But note: SIA says that the prior probability of a hypothesis is proportional to \( N_i \) (if we condition on being an observer). So if initially we had equal prior probabilities for \( H_1 \) and \( H_2 \), then after SIA:
  \[
  P(H_i) \propto N_i \cdot P_{\text{unanthropic}}(H_i)
  \]
  So if \( P_{\text{unanthropic}}(H_1) = P_{\text{unanthropic}}(H_2) \), then \( P(H_2)/P(H_1) = N_2/N_1 \).

  **In our vocabulary**:
  - Model-based superpopulation: The superpopulation generates finite populations. The probability of drawing a particular observer from the superpopulation is proportional to the size of the finite population they are in (if we condition on drawing an observer). 
  - The estimator for the hypothesis is based on the likelihood of observing ourselves. The likelihood under \( H_i \) is \( 1/N_i \) (by SSA). But the prior for \( H_i \) is proportional to \( N_i \) (by SIA). So the posterior:
  \[
  P(H_i | \text{I exist}) \propto P(\text{I exist} | H_i) P_{\text{unanthropic}}(H_i) \cdot N_i \propto (1/N_i) \cdot N_i \cdot P_{\text{unanthropic}}(H_i) = P_{\text{unanthropic}}(H_i)
  \]
  Wait, that cancels. But note: in the presumptuous philosopher, we don't condition on birth rank. We only condition on existing.

  But let me reframe without cancellation:

  - Under SIA, the prior for \( H_i \) is \( \propto N_i P_{\text{unanthropic}}(H_i) \).
  - Under SSA, the likelihood of being a specific observer given \( H_i \) is \( 1/N_i \).
  - So the posterior for \( H_i \) is \( \propto (1/N_i) \cdot N_i P_{\text{unanthropic}}(H_i) = P_{\text{unanthropic}}(H_i) \).

  This cancels! So why is the presumptuous philosopher presumptuous?

  The issue is that in the classic presumptuous philosopher, we don't condition on being a specific observer. We condition only on the fact that we exist. But note: the likelihood of the data (which is "I exist") given \( H_i \) is 1 (if \( H_i \) has at least one observer). So then:

  - Without indexical evidence, the data is just that there is at least one observer. Then:
    - \( P(\text{data} | H_i) = 1 \) if \( H_i \) has at least one observer, 0 otherwise.
    - Then the posterior is proportional to the prior: \( P(H_i | \text{data}) \propto P_{\text{SIA}}(H_i) \propto N_i P_{\text{unanthropic}}(H_i) \).

  So the posterior odds are \( N_2/N_1 \) times the unanthropic prior odds.

  **In our vocabulary**:
  - We are using a model-based superpopulation: the finite population is drawn from a superpopulation, and we condition on the fact that we are in the finite population (so we condition on being sampled). The probability that a particular finite population is drawn is proportional to its size (because there are more chances to be drawn if there are more people). This is the size-biasing.
  - Then, the likelihood of the data (which is that we exist) is 1 for any \( H_i \) that has at least one observer. So the posterior is the size-biased prior.

  Thus, the large-population hypothesis wins by \( N_2/N_1 \).

  ### Case 2: Birth Rank (Doomsday)

  **Setup**:
  - We have two hypotheses about the total number of humans that will ever exist: \( H_{early} \): total \( N \), and \( H_{late} \): total \( M \), with \( M \gg N \).
  - We observe our birth rank \( k \) (which is the same under both hypotheses, say k=60 billion).

  **SSA update**:
  - Under \( H_{early} \), the probability that my birth rank is \( \leq N \) is 1, and the probability that it is \( k \) (if \( k \leq N \)) is \( 1/N \).
  - Under \( H_{late} \), the probability that my birth rank is \( k \) (which is \( \leq M \)) is \( 1/M \).

  So the likelihood ratio for \( H_{early} \) vs \( H_{late} \) is \( (1/N) / (1/M) = M/N \). This favors the smaller population.

  **SIA prior**:
  - Prior for \( H_i \) is proportional to the population size: \( P(H_{early}) \propto N \), \( P(H_{late}) \propto M \).

  **Posterior**:
  \[
  P(H_{early} | k) \propto (1/N) \cdot N = 1
  \]
  \[
  P(H_{late} | k) \propto (1/M) \cdot M = 1
  \]
  So the posterior odds are the same as the unanthropic prior odds. There is cancellation.

  **In our vocabulary**:
  - We have a model-based superpopulation (SIA prior): the prior for the finite population size is proportional to the size.
  - Then we condition on being a specific observer (birth rank k) using SSA: the likelihood is 1 over the population size.
  - The product is constant, so the posterior is the same as the unanthropic prior.

  **What is the cancellation?** 
  It is an identity in the mapping: the size in the prior and the inverse size in the likelihood cancel. This holds if the reference class is the entire population and we condition on being a specific observer (by birth rank). However, note that the reference class must be the same in both the SIA prior and the SSA likelihood. If the reference class is defined differently (e.g., only humans born in a certain era), then the cancellation might not occur.

  **Conclusion on cancellation**: It is an identity under the mapping when the reference class is fixed and we condition on being a specific observer (with a label like birth rank). It does not depend on the particular choice of reference class as long as the same reference class is used consistently in both the prior (SIA) and the likelihood (SSA). However, if the reference class is chosen arbitrarily, then the results may be arbitrary.

  ## 3. Referee Question: Reference Class Problem

  In survey methodology, the frame is stipulated by the designer, and coverage error (over- or under-coverage) is a bias that we measure and adjust for (e.g., by post-stratification). 

  **Does the reference class problem have a home?** 
  Yes, but it is expressed as **coverage error** and **frame undercoverage**. 

  - **Undercoverage**: The frame does not cover the entire target population. We adjust by reweighting (e.g., using Horvitz-Thompson with known or estimated inclusion probabilities). 
  - **Overcoverage**: The frame includes units not in the target population. We condition on being in the target population (by design or by weighting).

  In anthropics, the reference class problem is: which set of observers should I consider myself a random sample from? This is analogous to defining the target population in a survey. 

  But note: in anthropics, we are the sampler and the sampled. We don't have an external designer. So the problem is: what is the correct frame? This is not a problem of implementation (as in coverage error) but of definition. 

  In your vocabulary, the reference class problem is **frame definition**. It is a step that comes before coverage error assessment. In survey design, we stipulate the frame, and then we assess coverage. In anthropics, we are arguing about what frame to stipulate.

  **Conclusion**: The reference class problem is the problem of frame definition. It is not undercoverage per se, but the prior step of defining the target population. Your vocabulary can express it, but it doesn't tell you how to define it. That is taken as given by the designer. In anthropics, we are the designer.

  ## 4. Residue Report

  ### Candidate 1: Pure self-locating uncertainty
  In capture-recapture, when we have uncertain identification (e.g., tags are lost or misread), we have uncertainty about which individual we have observed. This is similar to not knowing which observer you are. However, in capture-recapture, we know the set of possible individuals (the frame). In anthropics, the frame (the set of all observers) is not known and may be part of the hypothesis. Also, in anthropics, the frame might include observers in other possible worlds (under different hypotheses). 

  **Verdict**: Uncertain identification is a counterpart, but it is limited to a fixed frame. In anthropics, the frame is not fixed and is part of the hypothesis. So it smuggles in knowledge of the frame.

  ### Candidate 2: n-of-one design
  In sampling, design-unbiasedness is defined over repeated sampling from the same fixed population. In anthropics, we have only one sample (ourselves) and the population is not fixed (it may depend on the hypothesis). Moreover, we cannot rerandomize. So concepts like design-unbiasedness and confidence interval coverage are not defined. 

  **Verdict**: This is a gap. The sampling vocabulary assumes repeatability (at least hypothetically) and a fixed population. Anthropics is a one-shot setting with multiple possible populations.

  ### Candidate 3: Extreme hypotheses
  - **Hypotheses with no observers**: In sampling, if the population size is zero, then we cannot draw a sample. We condition on having drawn a sample, so we condition on the population size being at least 1. Similarly, in anthropics, we condition on existing. Both handle it by conditioning.
  - **Infinite populations**: In sampling, infinite populations are handled by asymptotic arguments or by modeling (e.g., Poisson sampling). In anthropics, infinite populations cause problems (e.g., the prior cannot be uniform). Your vocabulary can handle infinite populations by using model-based methods (e.g., point processes). But the anthropic debate often uses finite populations to avoid these issues.

  **Verdict**: The vocabulary can handle these by convention, but the anthropic debate might push the limits (e.g., how to define uniform probability over an infinite set).

  ### Candidate 4: De se evidence
  In sampling, an observation is just a data point. There is no distinction between "inside" and "outside". In anthropics, the fact that it is *me* making the observation is central. 

  **Verdict**: The vocabulary cannot express de se evidence. It treats all observations symmetrically. The anthropic problem is that the observation is uniquely from the inside. This is a gap.

  ## 5. Your Constructions

  ### Construction 1: Over-coverage model
  **Setup**: The frame contains unfilled slots (like potential observers that don't exist) and occupied slots. We condition on having landed in an occupied slot.

  **Mapping**:
  - The frame is the set of all possible slots (occupied or not). 
  - The inclusion probability for a slot is 1 if occupied, 0 if not (but we don't know which are occupied). 
  - We condition on being in an occupied slot.

  This is similar to SIA: the probability of being in a particular slot is proportional to the number of occupied slots? Not exactly. 

  Actually, it is a way to model the fact that we exist. We are sampling a slot uniformly from the frame, and then we condition on the slot being occupied. The probability that a slot is occupied is unknown. 

  But note: if we let \( N \) be the number of occupied slots and \( M \) the total slots, then the probability of landing in an occupied slot is \( N/M \). Then:
  - The likelihood of being in a particular occupied slot is \( 1/M \) (if we condition on the slot being occupied, then it becomes \( 1/N \) for each occupied slot). 

  So this collapses to **SSA** for the occupied slots. 

  But what about the prior over \( N \)? We might have a prior over \( N \). If we use a uniform prior over the frame, then the prior probability of a slot being occupied is independent of \( N \). 

  However, if we combine with a prior over \( N \), then the probability that a particular slot is occupied is proportional to the expected value of \( N \) (if we average over \( N \)). 

  But note: in the over-coverage model, we are conditioning on the slot being occupied. So the effective prior for \( N \) becomes proportional to \( N \) times the unanthropic prior for \( N \). Why? 

  - Let \( H_N \) be the hypothesis that \( N \) slots are occupied.
  - The probability of being in an occupied slot given \( H_N \) is \( N/M \).
  - The prior probability of \( H_N \) is \( P_{\text{unanthropic}}(H_N) \).
  - Then, by Bayes, the posterior for \( H_N \) given we are in an occupied slot:
  \[
  P(H_N | \text{occupied}) \propto P(\text{occupied} | H_N) P_{\text{unanthropic}}(H_N) \propto (N/M) P_{\text{unanthropic}}(H_N)
  \]
  So it is proportional to \( N \) (if \( M \) is fixed). This is **SIA**.

  Thus, the over-coverage model collapses into **SIA** for the prior over \( N \). Then, when we condition on the specific slot, we get SSA for the occupied slots. So it is both.

  ### Construction 2: Renewal reading
  **Setup**: 
  - In a renewal process, if you arrive at a random time, you get a length-biased interval (inspection paradox). 
  - If you sample a random passenger from those present, you get a uniform draw (so the interval is not length-biased).

  **Mapping**:
  - The renewal process has intervals (e.g., bus waiting times) of random length \( L \) with distribution \( f_L \).
  - Arrival at a random time: the interval you experience has a distribution proportional to \( \ell f_L(\ell) \) (length-biased).
  - Sampling a random passenger: the distribution of the interval that passenger is in is proportional to \( \ell f_L(\ell) \) (because there are more passengers in longer intervals) — so same as length-biased? 

  Wait: 
  - If you sample a passenger at random, then the probability of being in an interval of length \( \ell \) is proportional to \( \ell \times \) (the number of intervals of length \( \ell \)) because the number of passengers in an interval of length \( \ell \) is proportional to \( \ell \). So the distribution of the interval for a random passenger is \( \propto \ell f_L(\ell) \), which is length-biased.

  But in the problem, you say: "sampling a random passenger from those present gives you a uniform draw". This is not correct. If you sample a passenger, then the interval they are in is length-biased. 

  However, if you want a uniform draw over intervals, you must sample an interval at random (not a passenger). 

  **The paradox vanishes?** 
  The point is: if you sample by passenger, you get length bias. If you sample by interval, you don't. 

  In anthropics, if we consider ourselves as a random observer, then we are sampling by passenger. So we get the length-biased (SIA) prior. If we were sampling by interval (by world?), we wouldn't. 

  **In our vocabulary**: 
  - The sampling protocol (passenger vs interval) is taken as given. The vocabulary does not tell us which protocol to use. This is the external fact. 

  So the passenger-versus-arrival distinction is decidable: it is the protocol. In anthropics, we are in the passenger role: we are an observer, not a world. So we should use the passenger sampling. 

  Thus, the renewal reading collapses into **SIA** (the length-biased prior).

  ## Final Verdict on Residue

  The residue indicates:
  - **Gaps in the sampling vocabulary**: 
    - The n-of-one design (lack of repeatability) and the consequent inability to define design-unbiasedness.
    - De se evidence: the special nature of being the observer.
    - Frame definition: the vocabulary takes the frame as given, but in anthropics we must choose it.
  - **Anthropic debate less determinate**: 
    - The reference class problem (frame definition) is underdetermined and requires external input.
    - The choice between passenger and interval sampling (in the renewal example) is a protocol choice that the debate might not resolve.

  Overall, the mapping is faithful for the core concepts (SSA as design-based, SIA as model-based with size-biasing). However, the anthropic debate goes beyond by forcing us to confront the frame definition and the de se nature of evidence without the luxury of an external designer.
answer: |-
  ### Systematic Mapping
  **SSA (Self-Sampling Assumption)** maps to **design-based finite-population inference**. Here, the population size \(N\) is a fixed but unknown parameter. The "frame" (reference class) is predefined, and inclusion probabilities are uniform: \(\pi_i = 1/N\) for all units \(i\). Conditional on \(N\), you are a uniform random draw from the population. The Horvitz-Thompson estimator exemplifies this, weighting observations by \(1/\pi_i\). SSA is thus a conditional sampling model: given \(N\), your indexical identity is random with known probabilities.

  **SIA (Self-Indication Assumption)** maps to a **model-based superpopulation approach**. Hypotheses about \(N\) are drawn from a superpopulation, and the probability of being in a specific population is proportional to its size. This is **size-biased sampling**: larger populations are oversampled because units are selected proportional to \(N\). SIA is a prior constraint: hypotheses are weighted by \(N\) before conditioning on data. The "size bias" in SIA is **identical to the inspection paradox**: sampling a random observer from the universe overweights hypotheses where observers are abundant, just as sampling a random point in time overweights longer intervals in renewal processes.

  ### Worked Cases
  #### Case 1: Presumptuous Philosopher
  - **Setup**: Hypotheses \(H_1\) (\(N = N_1\)) and \(H_2\) (\(N = N_2 \gg N_1\)). No indexical evidence (e.g., birth rank).
  - **SIA Prior**: Prior odds \(P(H_2)/P(H_1) \propto N_2/N_1\) (size-biased superpopulation).
  - **SSA Likelihood**: Probability of being you given \(H_i\) is \(1/N_i\).
  - **Posterior**:  
    \[
    P(H_2 \mid \text{you exist}) / P(H_1 \mid \text{you exist}) = [P(\text{you exist} \mid H_2) P_{\text{SIA}}(H_2)] / [P(\text{you exist} \mid H_1) P_{\text{SIA}}(H_1)] = (1/N_2 \cdot N_2) / (1/N_1 \cdot N_1) = 1.
    \]
    Cancellation occurs: posterior equals unanthropic prior. But this assumes conditioning on "being a specific observer." Without indexical evidence, the data is "an observer exists," so \(P(\text{observer exists} \mid H_i) = 1\) and posterior odds \(= N_2/N_1\).  
  - **Sampling Vocabulary**: SIA corresponds to size-biased sampling of hypotheses. The estimator for \(H_2\) is biased high by design (inspection paradox). The "presumptuous" increase by \(N_2/N_1\) reflects this size bias.

  #### Case 2: Birth Rank (Doomsday)
  - **Setup**: \(H_{\text{doom}}\) (total humans \(= N\)), \(H_{\text{long}}\) (total humans \(= M \gg N\)). Birth rank \(k\) observed (e.g., \(k = 60 \times 10^9\)).
  - **SSA Likelihood**: \(P(k \mid H_{\text{doom}}) = 1/N\), \(P(k \mid H_{\text{long}}) = 1/M\).
  - **SIA Prior**: \(P_{\text{SIA}}(H_{\text{doom}}) \propto N\), \(P_{\text{SIA}}(H_{\text{long}}) \propto M\).
  - **Posterior**:  
    \[
    P(H_{\text{doom}} \mid k) / P(H_{\text{long}} \mid k) = [ (1/N) \cdot N ] / [ (1/M) \cdot M ] = 1.
    \]
    Cancellation is exact: posterior odds equal unanthropic prior odds.  
  - **Sampling Interpretation**:  
    - SIA: Size-biased prior weights \(H_i\) by \(N_i\).  
    - SSA: Horvitz-Thompson weighting with \(\pi_i = 1/N_i\).  
    Product is unity, yielding no net shift.  
  - **Cancellation Nature**: This is an **identity** under the mapping. It holds for any reference class if SIA and SSA use the same class. It is not an artifact; it follows from the size-bias/inverse-probability symmetry.

  ### Referee Question: Reference Class Problem
  In survey methodology, frame definition (target population) is **designer-stipulated**, and coverage error (over/under-coverage) is a **bias** addressed by weighting (e.g., post-stratification). The anthropic reference class problem is **frame definition under uncertainty**.  
  - **Mapping**: The problem is **frame undercoverage but not as typically conceived**. Surveys assume a "correct" frame exists; anthropics debates whether the frame (e.g., "all conscious beings" vs. "humans") is knowable. It resembles **coverage error where the target population is ambiguous**, but your vocabulary treats frame selection as pre-statistical.  
  - **Verdict**: The vocabulary **expresses it as frame specification**, but cannot resolve it. Coverage error adjusts for known frame defects; anthropics questions which frame is "true." This is a gap: your methods assume the frame is given, but anthropics forces frame uncertainty into inference.

  ### Residue Report
  #### Candidate 1: Pure Self-Locating Uncertainty
  - **Counterpart**: Uncertain identification in capture-recapture (e.g., tag loss) where a unit's identity is unknown.  
  - **Gap**: Capture-recapture assumes a **fixed frame** (known labels). Anthropic self-locating uncertainty includes **frame uncertainty** (e.g., "which observer am I?" includes "what is the set of all observers?"). The latter has no counterpart.

  #### Candidate 2: n-of-One Design
  - **Gap**: Design-unbiasedness requires repeated sampling over a fixed population. Anthropics has **no hypothetical repetitions**—the "population" may not exist under other hypotheses. Interval coverage is undefined. This is **inexpressible** in your vocabulary.

  #### Candidate 3: Extreme Hypotheses
  - **No Observers**: Handled by conditioning on existence (as in zero-truncated models). **No gap**.  
  - **Infinite Observers**: Your vocabulary uses limits (e.g., \(N \rightarrow \infty\) in models), but anthropics debates non-convergent probabilities (e.g., SIA with infinite \(N\)). **Partial gap**: anthropics pushes edge cases beyond conventional limits.

  #### Candidate 4: De Se Evidence
  - **Gap**: Sampling designs treat observations **externally**; "being the sampler" has no special status. Anthropic evidence is intrinsically "from inside" (de se). Your vocabulary **cannot distinguish** between "observer A sees X" and "I see X," making it blind to self-locating updates.

  ### Your Constructions
  #### Construction 1: Over-Coverage Model
  - **Setup**: Frame has \(K\) slots (occupied and unoccupied). You condition on landing in an occupied slot.  
  - **Mapping**:  
    - Prior over occupied slots \(N\): \(P(N) \propto N \cdot P_{\text{unanthropic}}(N)\) (size bias via conditioning).  
    - Likelihood: Uniform over occupied slots (\(\pi_i = 1/N\)).  
    Collapses to **SIA for the prior** and **SSA for the likelihood**.  
  - **Protocol Decidability**: The "occupied slot" conditioning is **external protocol** (like stipulating frame coverage). Your vocabulary takes this as given.

  #### Construction 2: Renewal Reading
  - **Setup**: Sampling a random passenger (SSA-like) vs. arriving at a random time (SIA-like).  
  - **Mapping**:  
    - **Random passenger**: Uniform over observers (SSA). Yields unbiased estimate of interval length.  
    - **Random arrival**: Length-biased sampling (SIA). Yields biased estimate (inspection paradox).  
    Collapses to **SSA for passenger sampling**, **SIA for arrival sampling**.  
  - **Protocol Decidability**: The choice (passenger vs. arrival) is **external protocol**. Your vocabulary distinguishes them (as different sampling designs) but cannot adjudicate which is "correct" for anthropics.

  ### Final Verdict
  - **Gaps in Sampling Vocabulary**:  
    1. **Frame uncertainty** (reference class problem) lacks machinery for inference.  
    2. **De se evidence** and **n-of-one irrepeatability** have no counterparts, forcing anthropics into Bayesian model-based framing.  
    3. **Extreme hypotheses** reveal conventions (e.g., truncation, limits) that anthropics disputes.  
  - **Anthropic Debate Indeterminacy**:  
    1. Frame definition and protocol (passenger vs. arrival) are **external inputs** your vocabulary assumes. Anthropics debates these as if they were solvable internally.  
    2. SIA-SSA cancellation is **determinate** under the mapping but relies on consistent reference classes—anthropics often omits this.  
  - **Conclusion**: The mapping clarifies mechanisms (size bias = inspection paradox, SSA = uniform sampling) but exposes anthropics' **indeterminacies** (frame choice, protocol) as gaps where sampling theory defers to design. Anthropics is less about probability per se and more about **what constitutes the sample space**.
