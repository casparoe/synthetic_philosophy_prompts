prompt: |-
  So my friend Dana has really firm opinions about who is allowed to call someone else out for something, and I've started keeping a list of her verdicts because the pattern is kind of bizzare once you line them up. She calls it "standing," which I think she picked up from somewhere online.

  All of these are about the same thing — people who borrow money from friends and then quietly never pay it back:

  - Dave, who still owes money to two people, tells our roommate "you're a jerk for not paying me back." Dana: no standing.
  - A total stranger with no connection to anyone involved, who has never borrowed a cent, publicly calls out a guy who stiffed her. Dana: standing, fine.
  - Priya stiffed people for years, then paid everyone back with interest, apologized to each of them, and hasn't done it since. Same sentence to the roommate. Dana: standing, not even a close call.
  - Someone who has never done it but says out loud "I'd have done exactly the same thing if I'd been that broke." Dana: standing, and she says what you *would* have done is irrelevant.
  - A woman who runs one of those pay-in-four apps and makes her living getting people into debt they can't clear, complaining that a friend never paid her back. Dana: no standing — this was the one she got most worked up about, and the app woman has never borrowed anything herself.
  - A guy who shoplifts compulsively, which is a totally different kind of thing, complaining about the same roommate. Dana: standing, obviously.

  So it's not about being close to the person, not permanent, not about what you'd have done, and not general moral cleanliness. But it's also not just "did you do the thing," because of the app woman.

  New case, which came up for real last week: Marcus currently owes money to three people including me. He told our roommate that not paying me back was out of line — and in the same breath said he's just as bad, that he hates this about himself, that he's a hypocrite for even saying it, and he's actually started paying me back. Nothing he said claimed he was better than the roommate; if anything he ranked himself lower.

  I'm less interested in yes/no than in the machinery. What rule is Dana actually running, what other rules fit all six of her old verdicts just as well, and which of those come apart on Marcus? Give me your best guess on her answer and say why you prefer it. And if her old verdicts genuinely leave it open, tell me what principle she'd be committing herself to with each answer.

  Last thing: what single extra case should I bring up next time to tell the rules apart? I was thinking either a guy who does it, blames someone, and only admits he's just as bad later in private — or someone who never did it himself but paid someone else to do it on his behalf. Which of those is more diagnostic, and for which pair of rules?
reasoning: |-
  Okay, let me tackle this puzzle about Dana's "standing" rules. The user presents six prior cases and a new one (Marcus), asking for the underlying principle and how to test it further. 

  First, I need to find common threads in Dana's judgments. The stranger who never borrowed has standing, while Dave (who owes money) doesn't. Priya reformed and has standing, but the pay-in-four app woman doesn't—even though both never borrowed. The shoplifter has standing despite unrelated misbehavior. 

  Hmm... the app woman case stands out. Dana rejects her standing vehemently despite no borrowing history. That suggests "standing" isn't about personal innocence but about... what? The app woman profits from others' debt, so maybe she's complicit in the harm. Whereas the stranger has no such conflict. 

  Priya's case is key—she fixed her past wrongs. Marcus partially pays back and admits hypocrisy. Both show accountability. The shoplifter's unrelated crime doesn't disqualify him because it doesn't undermine his critique of debt-dodging. 

  So the core might be: you lack standing if your current actions perpetuate the harm you're criticizing. Dave still owes money (active harm), the app woman enables debt (structural harm), but Priya reformed and Marcus is trying. The stranger and shoplifter aren't entangled in this specific harm. 

  For Marcus: he's actively repaying, so Dana might grant standing despite current debts, since he's addressing the behavior. If her rule requires remediation effort, he fits. 

  Best test case: someone who paid another to stiff people. If Dana denies standing, it confirms complicity matters more than direct action. If she grants it, the rule might be narrower. This stresses the "perpetuating harm" angle better than the delayed-apology scenario.
answer: |-
  Based on Dana's six verdicts, here's the breakdown of her likely "standing" rule, alternative rules, how they fit Marcus, and the best diagnostic test case:

  ### Dana's Likely Rule: "No Standing If You Currently Perpetuate the Harm"
  **Explanation:** Standing is denied if the accuser is *currently engaged in* or *actively benefiting from* the exact harm they're criticizing. Past actions (even if identical) don't matter if reformed. Unrelated harms don't matter. Hypothetical actions don't matter. Complicity in the *system* that enables the harm disqualifies you.

  **Why this fits all six cases:**
  1.  **Dave (No Standing):** *Currently* owes money (perpetuating the harm).
  2.  **Stranger (Standing):** No current or past involvement. Not benefiting.
  3.  **Priya (Standing):** *Reformed*. Past actions are irrelevant; not currently harming anyone.
  4.  **"I Would Do It" Person (Standing):** Hypothetical action is irrelevant; not *currently* doing it.
  5.  **Pay-in-Four App Woman (No Standing):** *Actively benefits* from/getting people into debt (complicit in the system of harm). Her income relies on creating debt others struggle with.
  6.  **Shoplifter (Standing):** Shoplifting is an *unrelated harm*. He's not currently stiffing people on debts.

  **Marcus Case Prediction (Using This Rule): Standing, but borderline.**
  *   **Why?** Marcus *is* currently perpetuating the harm (owes 3 people). However, he demonstrated active *remediation* (started paying you back) and *acknowledged his hypocrisy* without claiming moral superiority. This shows he's *attempting* to exit the cycle of harm he's criticizing. Dana's strong reaction to the app woman (systemic complicity) suggests remediation matters. Priya shows past harm + remediation = standing. Marcus is *mid-remediation*. **Verdict:** Likely grants standing because he's actively trying to stop perpetuating the harm, aligning with Priya's spirit.

  ---

  ### Alternative Rules That Also Fit the Six Cases
  1.  **"No Standing If Your Critique Implicitly Claims Moral Superiority":**
      *   **Fits:** Dave (implies superiority), Stranger (no claim), Priya (no claim after apology), "Would Do" (no claim), App Woman (implies superiority - "I run an app but *you* shouldn't default"), Shoplifter (no claim about debts).
      *   **Marcus:** He *explicitly renounced* superiority ("I'm just as bad... hypocrite"). Fits rule perfectly → **Standing.**
      *   **Divergence:** This rule *doesn't explain* why the App Woman has no standing but the Stranger does – both could potentially claim moral superiority. Dana's focus seems broader than just rhetorical claims.

  2.  **"No Standing If You Are Complicit in the Harmful System":**
      *   **Fits:** Dave (part of the debt-default system), Stranger (not complicit), Priya (exited system), "Would Do" (not complicit), App Woman (deeply complicit/system architect), Shoplifter (complicit in shoplifting system, not debt system).
      *   **Marcus:** He *is* complicit (currently owes money, perpetuating system) → **No Standing.**
      *   **Divergence:** This rule strongly explains the App Woman verdict and distinguishes her from the Stranger/Priya. However, it might struggle with Dave vs. Priya without adding "current" complicity. Marcus forces the issue: Is *current* complicity an absolute bar, or does remediation count (like Priya)? This rule would likely say **No Standing** for Marcus.

  3.  **"No Standing If Your Criticism Creates Hypocrisy Contagion Risk":**
      *   **Fits:** Dave (criticizing while doing it normalizes/non-reformed), Stranger (no hypocrisy), Priya (reformed, hypocrisy resolved), "Would Do" (no hypocrisy), App Woman (hypocrisy - profits from debt creation while criticizing default), Shoplifter (no hypocrisy regarding debts).
      *   **Marcus:** He *acknowledged his hypocrisy* explicitly, reducing contagion risk → **Standing.**
      *   **Divergence:** Explains why Dave (unreformed hypocrite) lacks standing while Priya (reformed) has it. Explains App Woman (blatant hypocrisy). Less clear on why "Would Do" has standing – they aren't hypocritical *yet*. Marcus is a strong fit for remediation reducing risk.

  ---

  ### Which Rule is Best & Why?
  *   **"No Standing If You Currently Perpetuate the Harm"** is the strongest fit.
      *   **Why:** It most directly explains the visceral reaction to the **App Woman** (she perpetrates the *root harm* professionally). It cleanly handles **Dave** (current perpetrator) vs. **Priya** (former perpetrator). It explains why the **Shoplifter** has standing (different harm) and the **"Would Do"** person (no action). The **Stranger** is the null case. Marcus becomes a test of whether *active remediation* negates "currently perpetuating."

  ### Diagnosing Marcus: What Her Answer Commits Her To
  *   **If Dana says STANDING:** She prioritizes *active remediation/acknowledgment* over current perpetration. Her rule must include an exception for those demonstrably trying to stop the harm *at the time of criticism*. Priya set a precedent for reform mattering.
  *   **If Dana says NO STANDING:** She views *current perpetration* as an absolute bar, regardless of intent or remediation efforts. This makes Marcus identical to Dave, disregarding his actions to repay and his self-awareness. This aligns more strictly with the "complicity" rule.

  ---

  ### The Best Next Test Case
  **Option: "Someone who never did it himself but paid someone else to stiff people on his behalf."**

  *   **Why it's Better Than Delayed Admission:**
      1.  **Targets Core Ambiguity:** This directly tests the **complicity/perpetuation vs. personal action** distinction crucial to the App Woman case and Marcus. Did they *cause* the harm without directly doing it?
      2.  **Distinguishes Rules:**
          *   **Dana's Likely Rule (Perpetuation/Complicity):** **NO STANDING.** By paying someone to inflict the harm, they are *actively perpetuating and benefiting from* the exact harm they'd criticize. Functionally identical to the App Woman.
          *   **Moral Superiority Rule:** **STANDING (Probably).** They haven't personally defaulted, so criticizing a defaulter doesn't necessarily imply *their* superiority regarding *defaulting*.
          *   **Hypocrisy Contagion Rule:** **NO STANDING.** They orchestrated the harm, creating extreme hypocrisy.
          *   **Pure "Did You Do The Thing?" Rule:** **STANDING.** They never personally borrowed and defaulted.
      3.  **Delayed Admission Case (Does it, blames, admits later privately):** This mainly tests the *timing* of acknowledgment vs. the criticism. Most rules (except maybe strict Moral Superiority) would likely say **NO STANDING** at the time of criticism (they were still a current perpetrator). It's less revealing about the core complicity/perpetuation logic.

  **Use this case to force clarity on whether *causing the harm indirectly* (like the App Woman or the paymaster) is equivalent to *doing it directly* (like Dave) in terms of losing standing.** Dana's reaction here will strongly confirm or refute the "complicity/perpetuation" interpretation. If she gives **NO STANDING**, it locks in that rule. If she gives **STANDING**, it suggests her rule is narrower, focused strictly on personal, direct action.
