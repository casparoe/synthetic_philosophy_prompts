  I need to unpack this systematically. The core dilemma revolves around whether consent automatically negates wrongdoing, particularly when obtained under questionable circumstances. The medical study case presents several problems: the sponsor understated a serious side effect (claiming "rare" when data showed 1/50), the payment constituted economic coercion in that community, and the participant likely didn't comprehend the statistical risk.

  The user has already identified seven possible interpretations of the maxim, which shows they've thought deeply about this. I'll address each as requested, plus the two additional moves they mentioned about distinguishing consent to gamble vs outcome, and separate complaints about harm vs deception.

  Key angles to cover:
  - Linguistic/logical status (is it tautological?)
  - Normative power of consent (waiver of rights)
  - Epistemological function (evidence of no harm)
  - Scope of "wrong" (legal vs moral wrong)
  - Descriptive accuracy requirement
  - Voluntariness conditions
  - Competence standards

  For each interpretation, I'll assess:
  - Triviality/substantiveness
  - Compatibility with undermining factors (deception/pressure/incompetence)
  - Whether it supports their friend's "no need to examine consent" conclusion

  The medical study case clearly tests the limits of consent ethics. The 1/50 risk misrepresented as "rare" crosses into deception territory. The life-changing payment creates a "take it or starve" dynamic. And statistical illiteracy compromises understanding. Their friend's absolutist interpretation seems dangerously simplistic here.

  I'll structure this as a numbered menu with clear verdicts, keeping the medical case central throughout. The two additional moves about gamble/outcome distinction and deception/harm separation will slot into the descriptive accuracy and wrong-type distinctions respectively.
answer: |-
  Here’s a disambiguated menu of interpretations for *volenti non fit iniuria*, with analysis tailored to your medical study case. Each thesis is assessed for defensibility, compatibility with consent-undermining factors, and whether it supports your friend’s conclusion ("no need to examine how consent was obtained").

  ---

  ### **1. Tautological Reading**  
  **Thesis:** "Consent" *by definition* implies no wrong is done. If wrongdoing occurred, it wasn’t truly consent.  
  **Defensibility:** Trivial (logically true but empty).  
  **Compatible with undermining?** No – deception/pressure/incompetence would mean it *wasn’t consent*.  
  **Supports friend’s conclusion?** **No.** If consent is invalidated by deception/pressure, you *must* examine how it was obtained to call it "consent" at all.  
  **Case impact:** Useless in your argument – it dodges the substantive question of *whether* this act qualified as consent.  

  ---

  ### **2. Normative Power (Waiver) Reading**  
  **Thesis:** Valid consent functions as a moral/legal power to waive rights (e.g., to bodily integrity). No rights-violation = no wrong *of that type*.  
  **Defensibility:** Substantive and defensible (core of contract/tort law).  
  **Compatible with undermining?** **Yes** – but only if consent is *valid*. Invalid consent (due to deception, etc.) means no rights are waived.  
  **Supports friend’s conclusion?** **No.** This *presupposes* validity – it doesn’t negate the need to scrutinize how consent was obtained.  
  **Case impact:** Your friend’s use of the maxim *assumes* valid consent, but your objections challenge that very validity.  

  ---

  ### **3. Welfare-Evidence Reading**  
  **Thesis:** Consent is evidence that the act didn’t set back the consenter’s *true interests* (welfare). No harm = no wrong.  
  **Defensibility:** Substantive but **false** – people consent to self-harming acts (e.g., smoking). Consent ≠ welfare guarantee.  
  **Compatible with undermining?** Irrelevant – welfare is objective; consent is subjective evidence.  
  **Supports friend’s conclusion?** **No.** Even if defensible, it would require proving no *actual* harm occurred, which is false in your case (severe side effects).  
  **Case impact:** Fails – harm clearly occurred, so consent couldn’t "evidence" otherwise.  

  ---

  ### **4. "No Actionable Wrong" Reading**  
  **Thesis:** Consent blocks legal remedies or moral complaints *by the consenter*, even if harm occurs.  
  **Defensibility:** Substantive and defensible (e.g., assumption of risk in tort law).  
  **Compatible with undermining?** **Yes** – but invalid consent means no such block applies.  
  **Supports friend’s conclusion?** **No.** It only addresses *remedies*, not whether consent was validly obtained. Courts *do* scrutinize consent for fraud/duress.  
  **Case impact:** Your "lied to" point survives – consent might block a complaint *about the harm*, but not about *the deception*.  

  ---

  ### **5. Consent-Under-a-Description Reading**  
  **Thesis:** Consent must match the *specific act/risk* undertaken. Deception severs the link.  
  **Defensibility:** Substantive and defensible (canonical in consent theory; e.g., sexual assault law).  
  **Compatible with undermining?** Explicitly addresses deception – **yes, compatible**.  
  **Supports friend’s conclusion?** **Directly refutes it.** If the risk was misdescribed (1/50 vs. "rare"), she didn’t consent to *this* gamble.  
  **Case impact:** Your strongest counter: she consented to a *different* (safer) act.  
  → *Your "gamble vs. outcome" move fits here:* She consented to a *1% risk gamble* (as described), not the *2% risk gamble* (actual) or the *outcome* (harm).  

  ---

  ### **6. Voluntariness/Baseline Reading**  
  **Thesis:** Consent requires a voluntary choice, defined against a non-coercive baseline. Economic pressure or threats invalidate it.  
  **Defensibility:** Substantive and defensible (requires moralized baseline – e.g., "no illegitimate pressure").  
  **Compatible with undermining?** Explicitly addresses pressure – **yes, compatible**.  
  **Supports friend’s conclusion?** **No.** Voluntariness *demands* examining context (payment size, alternatives).  
  **Case impact:** "Take-it-or-leave-it" payment = coercive baseline? Requires scrutiny.  

  ---

  ### **7. Competence Reading**  
  **Thesis:** Only agents with capacity to understand consequences can consent. Shaped preferences may void competence.  
  **Defensibility:** Substantive and defensible (law requires informed consent capacity).  
  **Compatible with undermining?** Explicitly addresses incompetence – **yes, compatible**.  
  **Supports friend’s conclusion?** **No.** Competence *must* be assessed (e.g., did she grasp "1 in 50"?).  
  **Case impact:** If poverty distorted her risk-assessment, competence is questionable.  

  ---

  ### **8. Strongest Friend-Friendly Reading**  
  **Thesis:** **Consent (once given) *always* negates wrongdoing, regardless of how it was obtained.** Validity is irrelevant to the maxim’s function.  
  **Defensibility:** **Straightforwardly false.** Even hardcore libertarians require non-fraudulent consent (e.g., Nozick).  
  **Compatible with undermining?** No – treats consent as magic words, ignoring context.  
  **Supports friend’s conclusion?** **Yes** – but only by being morally absurd.  
  **Case impact:** Reduces consent to a signature, ignoring lies/pressure. Legally and ethically indefensible.  

  ---

  ### **Your Additional Moves**  
  - **"Consenting to gamble vs. outcome":** Covered in **Thesis 5**. Consent attaches to the *risk profile*, not the outcome.  
  - **"Complaint about lying vs. harm":** Covered in **Thesis 4**. Consent may block a harm complaint, but not deception (fraud).  
  → **Does this leave the maxim idle?** No – it still blocks the *harm-based wrong* if consent is valid, but fraud opens a *new* wrong (deception).  

  ---

  ### **Summary Verdict for Your Case**  
  - **Your friend’s conclusion** ("no need to examine consent") **fails** under every defensible reading.  
  - **Defensible readings (2,4,5,6,7)**: Require examining consent’s validity – *especially* for deception (**5**), pressure (**6**), or incompetence (**7**).  
  - **Key flaws in the case:**  
    - **Deception:** Describing 2% risk as "rare" → invalid consent under **Thesis 5**.  
    - **Pressure:** Payment as months' wages → potential coercion under **Thesis 6**.  
    - **Incompetence:** Failure to grasp "1 in 50" → competence issue under **Thesis 7**.  
  - **Even if the maxim blocks a harm complaint**, fraud remains a separate wrong (**Thesis 4**).  

  **Take this back:** "Your maxim only works if consent is valid. This consent wasn’t – she was misled about the risk, pressured by money, and likely didn’t understand it. *Volenti* doesn’t excuse fraud."
