  - The indeterminism charge is conditional on substantivalism (Earman-Norton)
  - Sophisticated substantivalists can accept gauge equivalence (Weatherall, Pooley)
  - The argument requires absence of background structure, so doesn't directly apply to Newtonian/SR (Friedman, Pitts)

  The closing "general moral" about symmetry causing indeterminism oversimplifies - it ignores that symmetries may be gauge, not physical. The user's suspicion is justified; the passage contains several misrepresentations despite smooth presentation.

