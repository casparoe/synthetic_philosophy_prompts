  I should emphasize that their split isn't just valid—it's necessary. The mechanism question is math (provably impossible for finite N), while the epistemic question is philosophy (e.g., can you "know" something that relies on your ignorance?). Progress in one doesn't resolve the other. For the mechanism side, progress looks like formal proofs; for epistemology, it might involve refining belief models or accepting that some self-reference is unresolvable. 

