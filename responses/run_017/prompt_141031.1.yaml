  But the literature they mention is messy. Some papers focus solely on the logical structure, others on knowledge/belief, and some blend both. The user's frustration with the stalemate makes sense—these camps often talk past each other. For example, the epistemic camp might say "the announcement can't be believed" while ignoring that the mechanism fails even without belief (e.g., if agents treat it as a random process). 

