  ### Decision Tree: Secession and Self-Determination  
  **Fixed Starting Case**: A territorially concentrated group in a broadly democratic state seeks sovereign independence, without ulterior motives (ethnic cleansing, annexation, or dictatorship).  

  #### Tree Structure  
  1. **Can the group's self-determination claim be satisfied by shared sovereignty (e.g., autonomy, federalism) instead of full independence?**  
     - Yes → **Leaf: Pooled/Shared-Sovereignty View**  
       *Awkward commitment: May force a group to accept less than full independence despite a majority desire for it.*  
     - No → 2  

  2. **Is the moral right to secede entirely determined by the existing constitution?**  
     - Yes → **Leaf: Constitutionalist/Legalist View**  
       *Awkward commitment: Legitimizes constitutions that permanently forbid secession, even amid severe injustice.*  
     - No → 3  

  3. **Is a serious, persistent grievance (injustice, rights violation, or autonomy breach) necessary for a moral right to secede?**  
     - Yes → 4  
     - No → 5  

  4. **Must the group demonstrate a democratic mandate (e.g., referendum) to exercise the remedial right?**  
     - Yes → 8  
     - No → **Leaf: Remedial Right Without Mandate**  
       *Awkward commitment: Justifies secession without popular consent in a democratic state.*  

  5. **Is the right to secede grounded in the will of current residents, or in the identity of a national/cultural group?**  
     - Residents → 6  
     - National group → 7  

  6. **Does a clear majority vote for secession confer a moral right to unilateral secession?**  
     - Yes → 8  
     - No → 9  

  7. **Can the national group exercise the right without a territory-wide referendum?**  
     - Yes → **Leaf: Ascriptive/National-Cultural View (No Vote)**  
       *Awkward commitment: Risks overriding the will of current residents who oppose secession.*  
     - No → 8  

  8. **Assignment Node (for vote-dependent views):**  
     - If from 4 → **Leaf: Remedial Right Only**  
       *Awkward commitment: Requires defining "grievance" in democracies where overt oppression is absent.*  
     - If from 6 → **Leaf: Plebiscitary/Primary-Right View**  
       *Awkward commitment: Permits secession for affluent groups with no grievances, potentially destabilizing.*  
     - If from 7 → **Leaf: Ascriptive/National-Cultural View (With Vote)**  
       *Awkward commitment: Franchise must include diaspora/non-residents, diluting territorial sovereignty.*  

  9. **Does a clear majority vote impose a moral duty on the state to negotiate secession?**  
     - Yes → **Leaf: Canadian View (Duty to Negotiate)**  
       *Awkward commitment: No remedy if negotiations fail or are conducted in bad faith.*  
     - No → **Leaf: Mutual Consent Only**  
       *Awkward commitment: Allows a state to veto secession indefinitely, regardless of local majority will.*  

  #### Key for Assignment (Node 8):  
  - **From 4**: Remedial Right Only (requires grievance + mandate).  
  - **From 6**: Plebiscitary/Primary-Right View (no grievance needed; majority suffices).  
  - **From 7**: Ascriptive/National-Cultural View (vote required, but franchise based on national identity).  

  ---

  ### Notes  
  #### 5. Logical Space and Empty Cells  
  The tree produces 12 leaves (including variants). Key combinations and gaps:  
  - **Constitutionalist + Remedial Grievance**: Empty. Constitutionalism precludes extra-legal moral rights, even for grievances.  
  - **Plebiscitary + No Negotiation Duty**: Occupied (Mutual Consent Only). Unattractive: Ignores democratic will if the state resists.  
  - **Ascriptive + Remedial Grievance**: Empty. Ascriptive views define rights by identity, not grievances; combining them is incoherent.  
  - **Pooled Sovereignty + Grievance**: Empty. Pooled sovereignty satisfies claims without exit, making grievances irrelevant to secession.  
  - **Dead-Hand/Rump/Drift Questions**: Not branching nodes (all views answer differently), but critical for refining positions. For example:  
    - **Dead-Hand**: Remedial views often bind future generations; plebiscitary views allow recurring votes.  
    - **Rump State**: Constitutionalists see viability as legal; primary-right views reject it as a moral constraint.  
    - **Demographic Drift**: Ascriptive views dismiss drift (nation is fixed); territorial views may see migration as manipulation.  

  #### 6. Pairs the Tree Cannot Separate  
  - **Remedial-Right Only vs. Constitutionalist**: Both reject Catalonia 2017. *Split with*: "If the constitution forbids secession *and* there is a grievance, does a moral right exist?" Remedial: Yes; Constitutionalist: No.  
  - **Plebiscitary vs. Ascriptive (With Vote)**: Coincide on cases like Quebec. *Split with*: "In a territory where immigrants outnumber the national group, should residents or the national group decide?" Plebiscitary: Residents; Ascriptive: National group.  
  - **Canadian View vs. Mutual Consent Only**: Both require state agreement. *Split with*: "Does a clear majority impose *any* obligation on the state?" Canadian: Duty to negotiate; Mutual Consent: No obligation.  

  #### 7. Case Applications  
  - **Scotland (2014)**:  
    - Path: 1(No)→2(No)→3(No)→5(Residents)→6(No)→9(Yes)→ **Canadian View**.  
    - Why: UK agreement implies negotiation duty; unresolved node (6) hinges on whether unilateral right exists.  

  - **Catalonia (2017)**:  
    - *If student emphasizes grievance (e.g., autonomy breaches)*: 1(No)→2(No)→3(Yes)→4(Yes)→ **Remedial Right Only**.  
    - *If student emphasizes vote legitimacy*: 1(No)→2(No)→3(No)→5(Residents)→6(Yes)→ **Plebiscitary View**.  
    - Verdict driven by Node 3 (grievance) and Node 6 (unilateral right). Turnout/legality disputes are unresolved thresholds (h).  

  - **Quebec (1995+)**:  
    - Path: 1(No)→2(No)→3(No/Yes)→5(Residents)→6(No)→9(Yes)→ **Canadian View**.  
    - Why: Near-miss referendum and Clarity Act align with duty to negotiate; Node 3 (grievance) is debatable but immaterial to outcome.  

  #### Rejected Questions in Brainstorming  
  - **"Is self-determination a human right?"** Discarded: All views accept it abstractly; divergences arise in application.  
  - **"Should secession require international approval?"** Discarded: Most views treat this as prudence, not morality.  
  - **"Is historical sovereignty required?"** Discarded: Contradicts cases (e.g., Scotland) and is subsumed under grievance/ascriptive nodes.  
  - **"Does economic viability of the new state matter?"** Discarded: All views treat this as prudence, not a moral constraint.  

  ---  
  This tree isolates core principles using your specified distinctions. For vote-dependent leaves (e.g., Remedial, Plebiscitary), students must further refine positions using distinctions (b-h) (e.g., franchise, thresholds). Cases reveal where intuitions clash with labels (e.g., Catalan grievance debates).
