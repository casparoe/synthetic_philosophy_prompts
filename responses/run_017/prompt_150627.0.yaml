prompt: |-
  Hi — I have a slightly odd job and I need something operational out of it. I'm on the small methods team at a big interdisciplinary environmental research institute (ecologists, economists, GIS/modelling people, engineers, some policy folks). When two subgroups have been deadlocked for weeks over some word and it's blocking something real — a shared database schema, a joint paper, a work package in an EU grant — they get a 45-minute slot with me, which we call term triage. I run maybe three of these a month. I have no prep time (I usually get the word and a one-line description the morning of), the people in the room are senior domain experts with zero philosophy and are visibly annoyed to be there, and my deliverable is a one-page note that says one of three things: "you genuinely disagree about X, here is what data or analysis would settle it"; "you don't disagree, go build the thing"; or "this isn't a question evidence can settle, escalate to the steering committee." So I need a decision procedure I can run live, in the room, in about thirty minutes of talking, and that terminates.

  I know roughly the shape of the philosophical material here, and I want it turned into steps rather than explained to me again: the test where you strip the contested term out and re-describe the situation in neutral language and see whether the disagreement survives, versus the test where you ask whether the parties would actually disagree about any case, actual or hypothetical. I've noticed those two come apart, and I want the procedure to say which one to run first and what to conclude when they disagree with each other. I also want somewhere in it the point that a dispute can be perfectly substantive while not being a dispute *about the world* — that the fight is over which concept or which way of counting should occupy the slot the word is sitting in, i.e. a practical/normative question about which vocabulary to build the project on, not a factual one. That distinction matters a lot for my one-pager, because the "which concept do we commit to" cases should go to the steering committee and not to a data request. Four things I keep running into that I don't know how to handle and that I'd like the procedure to have an answer to: (1) *one-sided paraphrase* — one subgroup can restate its claim fine without the word, the other one can't or won't, so the elimination test only fires in one direction; (2) *load-bearing terms* — where the word is doing real work inside somebody's model or regulatory framework, so substituting a neutral description loses inferential content even though everyone agrees on the cases; (3) *strategic vagueness* — someone benefits from the term staying blurry (it's in the grant text, or it holds two factions together), so they won't commit to a definition under any prompting; (4) the nasty one where after all the cases, actual and imagined, both sides say "yes, I'd describe it the same way as you" and *still* won't agree that the other side is right. Please also mark honestly which steps are judgement calls wearing a procedure's clothes, and where I as a non-expert outsider am simply not entitled to declare a dispute merely verbal even though my tests say it is.

  Cases I'd like run through it, in the note: (a) ecologists and an ecosystem-services economist arguing about whether a restored wetland is "degraded" — the ecologists mean departure from a pre-drainage baseline, the economist means reduction in the flow of things people actually value, and a monitoring protocol depends on which wins; (b) the ML subgroup and the clinicians arguing about "bias" in a mortality-prediction model, where the statistical reading (disparate error rates across groups) points at one fix and the clinical reading (miscalibration in a specific subgroup) points at a different, partly competing one; (c) a case where I've already got a bad feeling — after everyone agrees on every case about "resilience" in a coastal infrastructure model, the two factions are still fighting, and my suspicion is that the honest output of your procedure will be "this is not verbal, but it's also not answerable by any study; the real question is which operationalisation you want to be stuck with for five years, and that's a committee decision," which is exactly the note nobody wants from me. For each, show where the procedure stops, what I write down, and one sentence I can actually say out loud in the room. Finally, tell me what this procedure can't do — what kinds of deadlock it will mislabel even when I run it perfectly.
reasoning: |-
  We are designing a decision procedure for term triage. The goal is to resolve deadlocks over contested terms in interdisciplinary teams. The procedure must be runnable in about 30 minutes and yield one of three outcomes:
  1. Genuine disagreement about a factual issue that can be settled by data or analysis.
  2. No real disagreement; the parties can proceed.
  3. Non-empirical (normative or practical) disagreement that should be escalated to the steering committee.

  The procedure must handle the following challenges:
  - One-sided paraphrase
  - Load-bearing terms
  - Strategic vagueness
  - Cases where parties agree on descriptions but not on the term

  We'll use two main tests:
  A. **Elimination Test**: Remove the contested term and ask both parties to restate their claims in neutral language. See if the disagreement persists.
  B. **Case Test**: Use actual or hypothetical cases to see if the parties would describe the same cases differently or if they agree on the cases but not the term.

  We note that a dispute can be substantive without being about the world (i.e., it might be about which concept to use in the project).

  The procedure steps:

  1. **Introduce the session (2 minutes)**: 
     - Clarify the contested term and the context (from the one-line description).
     - State the goal: to clarify whether the disagreement is about facts, language, or a choice of framework.

  2. **Elimination Test (10 minutes)**:
     - Ask each party to restate their position without using the contested term and without using any other contested terms (if they introduce one, note it and proceed with the original term for now).
     - If both can restate and the disagreement vanishes, conclude "no disagreement" (outcome 2).
     - If one party can restate and the other cannot (one-sided paraphrase), note this and proceed to the case test.
     - If both restate and the disagreement remains, note that the disagreement might be factual and proceed to the case test to see if it's about the world or about the term.

  3. **Case Test (15 minutes)**:
     - Construct 2-4 actual or hypothetical cases that are central to the project and that the term is supposed to cover.
     - For each case, ask each party independently: 
          - How would you describe this case? (without the contested term)
          - Would you apply the contested term to this case? Why or why not?
     - Compare:
          - If the parties agree on the description of the cases and on whether the term applies, but still disagree about the term in the abstract, then the disagreement is verbal (outcome 2: no real disagreement) unless there is a load-bearing issue (see step 4).
          - If they disagree on the description of the cases (i.e., they see the facts differently), then there is a factual disagreement (outcome 1).
          - If they agree on the case descriptions but disagree on the application of the term, then the disagreement is about the concept (proceed to step 4).

  4. **Load-bearing and Practical Implications (3 minutes)**:
     - Ask: "If we used your preferred definition, what would change in the project? What inferences, decisions, or actions would be affected?"
     - If the term is load-bearing (i.e., changing the definition changes the inferential structure, model, or regulatory compliance) and the parties agree on the cases but not the term, then the disagreement is about which framework to use (outcome 3: escalate).
     - Also, if the parties agree on cases and the term application but still won't agree (the "nasty" case), it may be because of unspoken practical implications or because the term is a placeholder for a larger framework disagreement. This is also outcome 3.

  5. **Strategic Vagueness Handling**: 
     - If at any point a party refuses to define the term or to engage in the tests, note this and ask: "What would be the consequence of not having a clear definition for this term in the project?" 
     - If the consequence is that the project cannot proceed (e.g., the database schema requires a clear field, the grant text is ambiguous) then this is a risk. But if the party benefits from vagueness, they may resist. In that case, the issue is not about facts but about project management and politics. This should be escalated (outcome 3).

  6. **Judgment Call Step**:
     - After the tests, if the situation is unclear, default to outcome 3 (escalate). It's better to escalate than to force a resolution that might be wrong.

  7. **Conclusion and Note (5 minutes)**:
     - Draft the one-pager with the outcome and the reasoning.

  **Judgment Calls**:
  - In step 2 (Elimination Test), determining whether a restatement is adequate is a judgment call. If a party's restatement introduces new contested terms, you have to decide whether to pursue those or stick to the original. (Advice: Stick to the original term for this session unless the new term is clearly the root.)
  - In step 4, determining whether the term is load-bearing is a judgment call. You are not an expert, so you rely on the parties' answers. If they say it matters for the model or compliance, take that at face value.
  - In the "nasty" case (step 4) where parties agree on cases but still won't concede, you have to judge whether this is a practical/normative issue or if there's a deeper factual issue. Given the time, if the case test shows agreement on cases, it's safe to say the dispute is not about facts.

  **What the Procedure Can't Do**:
  - It cannot resolve deep normative disagreements. It only flags them for escalation.
  - It may not uncover hidden agendas or political motivations, though strategic vagueness might hint at that.
  - It might be misled if the parties are not truthful in the case test (e.g., if they strategically agree on cases to avoid revealing a weakness).
  - It may not handle cases where the disagreement is about the interpretation of data that is not yet available (you might mislabel as non-factual when it is factual but currently unanswerable).

  Now, let's run through the provided cases:

  ### Case (a): "degraded" wetland (ecologists vs. economist)
  - **Step 1**: Term is "degraded". Context: monitoring protocol for a restored wetland.
  - **Step 2 (Elimination Test)**:
     - Ecologists: "The wetland has departed from its pre-drainage state (in terms of biodiversity, hydrology, etc.)."
     - Economist: "The wetland provides fewer valuable services to people (e.g., flood control, recreation) than it could."
     - Disagreement remains because the restatements are about different things (baseline state vs. current service flow). So we proceed to case test.

  - **Step 3 (Case Test)**:
     - Case 1: A wetland that was drained and then restored to pre-drainage state, but due to changed land use around it, it now provides less flood control.
          - Ecologists: "Not degraded (restored to baseline)."
          - Economist: "Degraded (reduced service)."
     - Case 2: A wetland that was never drained but has been surrounded by development so that it provides less recreation (but is ecologically intact).
          - Ecologists: "Not degraded (no departure from baseline)."
          - Economist: "Degraded (reduced service)."
     - The parties disagree on the application of the term in these cases. But note: they also might disagree on the facts? Actually, they agree on the facts of the cases but disagree on the term.

  - **Step 4 (Load-bearing)**:
     - The monitoring protocol: 
          - If "degraded" is defined ecologically, they measure ecological indicators.
          - If economically, they measure service flows.
     - This is load-bearing because it changes what data is collected and how success is measured. The disagreement is about which concept to use.

  - **Outcome**: Outcome 3 (escalate to steering committee). The note: "The parties agree on the facts of the cases but disagree on the concept of 'degraded'. The choice of concept will determine the monitoring protocol, which is a project design decision requiring steering committee input."

  - **One sentence for the room**: "It looks like you both have valid but different ways of measuring degradation, and the project needs to decide which one to use for the monitoring protocol. I recommend we escalate this to the steering committee."

  ### Case (b): "bias" in a mortality-prediction model (ML vs. clinicians)
  - **Step 1**: Term is "bias". Context: fixing a model.
  - **Step 2 (Elimination Test)**:
     - ML: "The model has disparate error rates (e.g., false positive rates) across groups."
     - Clinicians: "The model is miscalibrated for a specific subgroup (e.g., it systematically overestimates risk for group X)."
     - These are different restatements. The disagreement might be about what constitutes bias. Proceed to case test.

  - **Step 3 (Case Test)**:
     - Case 1: A model that has equal false positive rates across groups but is miscalibrated for group X (e.g., when it predicts 70% risk, the actual rate is 50% for group X, but for group Y it's well-calibrated).
          - ML: "No bias (equal error rates)."
          - Clinicians: "Bias (miscalibration)."
     - Case 2: A model that has higher false positive rates for group X but is well-calibrated for both groups.
          - ML: "Bias (disparate error rates)."
          - Clinicians: "No bias (well-calibrated)."
     - They disagree on the application of the term.

  - **Step 4 (Load-bearing)**:
     - The fix: 
          - ML fix: adjust thresholds to equalize error rates.
          - Clinicians fix: recalibrate the model for the subgroup.
     - These fixes might conflict. The term is load-bearing because it leads to different interventions. The disagreement is about what kind of fairness or correctness matters.

  - **Outcome**: Outcome 3 (escalate). The note: "The parties have different definitions of 'bias' that lead to different corrective actions. This is a normative choice about what kind of model performance is desired and should be decided by the steering committee."

  - **One sentence for the room**: "Your definitions of bias are both valid but they point to different solutions. This is a matter of what the project prioritizes in model performance, so it's a decision for the steering committee."

  ### Case (c): "resilience" in coastal infrastructure
  - **Step 1**: Term is "resilience". Context: coastal infrastructure model.
  - **Step 2 (Elimination Test)**:
     - Party 1 (e.g., engineers): "The ability to withstand a 100-year storm without failure."
     - Party 2 (e.g., planners): "The ability to recover quickly after any storm, including minor ones, with minimal disruption."
     - They restate differently. Proceed to case test.

  - **Step 3 (Case Test)**:
     - Case 1: Infrastructure that fails in a 100-year storm but is quickly rebuilt to a better standard.
          - Engineers: "Not resilient (failed)."
          - Planners: "Resilient (quick recovery)."
     - Case 2: Infrastructure that never fails but takes a long time to recover after minor damage (e.g., due to complex repairs).
          - Engineers: "Resilient (no failure)."
          - Planners: "Not resilient (slow recovery)."
     - They disagree on the cases. But wait, the problem states: "after everyone agrees on every case". So in this scenario, let's reimagine:

     - **Revised based on problem statement**: 
          - You say: "after everyone agrees on every case". So in the case test, they might agree on how to describe the cases and even on whether the term applies? But then they still fight. This is the "nasty" case.

     - How? Example: 
          - Case: Infrastructure that withstands a 100-year storm and recovers quickly after minor storms.
          - Both agree: "Yes, that's resilient."
          - Case: Infrastructure that fails in a 50-year storm and takes years to recover.
          - Both agree: "Not resilient."
          - But in the abstract, they still argue about the term? This suggests they might agree on the extension but not the intension, and the term is being used in a way that has practical implications.

  - **Step 4 (Load-bearing)**:
     - Ask about implications: 
          - If we define resilience as only about withstanding, then we invest in stronger materials.
          - If we define it as about recovery, we invest in backup systems and rapid repair.
     - They agree on cases but still fight because the operationalization in the model will commit them to one approach for five years. This is a practical choice.

  - **Outcome**: Outcome 3 (escalate). The note: "The parties agree on the cases to which 'resilience' applies but disagree on the emphasis in the operational definition. This is a project design choice about which aspect of resilience to prioritize in the model and should be decided by the steering committee."

  - **One sentence for the room**: "You both have the same idea of what resilience looks like in practice, but the model needs to pick one way to measure it. Since that choice affects the project's direction, I recommend escalating to the steering committee."

  **Final Note on Limitations**:
  - The procedure might mislabel a factual disagreement as non-factual if the parties are not representative of the full evidence (e.g., if they both are misinformed about the facts).
  - It might also mislabel a normative issue as factual if the parties frame their normative stance as a factual claim (e.g., "this is the right way to define it" as if it were a truth).
  - It cannot resolve issues where the disagreement is about values, only identify that the values are in play.
  - It might not work if the parties are not cooperative (e.g., if they refuse to engage in the case test).
answer: |-
  Below is a step-by-step decision procedure for your "term triage" sessions. It integrates the tests you described (elimination and case-based) with explicit handling of your four challenges (one-sided paraphrase, load-bearing terms, strategic vagueness, and the "nasty" agreement-without-concession case). The procedure is designed to run in **25–30 minutes** of active discussion, leaving 15 minutes for setup and note-drafting. Steps that require your judgment are marked with **⚠️JUDGMENT CALL**. Crucially, I'll note where you, as a non-expert, should avoid overruling experts even if tests suggest a verbal dispute.

  ### Core Principles Embedded in the Procedure
  1. **Distinguish fact vs. framework**: Disagreements about the world (resolvable with evidence) vs. disagreements about which concept/vocabulary to use (normative/practical, requiring steering committee input).
  2. **Test sequence**: Run elimination first (it's faster), then cases. If they conflict, prioritize the case test—it's more concrete.
  3. **Your role**: You arbitrate the *process*, not the truth. Never declare a dispute "merely verbal" if domain experts insist it's substantive. Your tests can reveal inconsistency, but experts get the final say on substance.
  4. **Handling your four challenges**: Built into specific steps.

  ---

  ### The Decision Procedure (25–30 Minutes)
  **Step 1: Frame the Term (2–3 min)**  
  *Goal: Clarify the term and its stakes.*  
  - Ask: "What specific decision or output is blocked by disagreement over [term]?" (e.g., database field, metric in a paper).  
  - Ask: "What happens if we don't resolve this today?" (Sets urgency).  
  - **Output**: A shared understanding of the operational blockage.  

  **Step 2: Elimination Test (Strip the Term) (5–7 min)**  
  *Goal: See if disagreement survives without the contested word.*  
  - Instruct: "Restate your position without using [term] or related jargon. Use neutral descriptions of observable facts or measurements."  
  - **Handle one-sided paraphrase (your challenge #1)**:  
    - If one group restates clearly (e.g., "We mean departure from pre-drainage biodiversity levels") but the other cannot (e.g., "It’s just... degraded!"), note this asymmetry.  
    - Ask the resisting group: "What might I observe in the world to tell if [term] applies?" If they can’t answer, flag strategic vagueness (see Step 4).  
  - **Interpretation**:  
    - If both restate positions **and agree** → Outcome 2 ("no disagreement").  
    - If both restate **and still disagree** → Proceed to Step 3 (likely factual).  
    - If one side can’t/won’t restate → Proceed to Step 3; asymmetry suggests the term may be load-bearing or vague.  

  **Step 3: Case Test (Actual/Hypothetical Scenarios) (10–12 min)**  
  *Goal: Check if parties describe concrete cases differently.*  
  - Generate 2–3 simple cases (1 real, 1–2 hypothetical) central to the blocked output.  
    - *Example for "bias"*: "Imagine Model A has higher false positives for Group X but perfect calibration for all groups. Is it biased?"  
  - For each case:  
    - Ask: "How would you describe this case neutrally?" (e.g., "error rates differ by group").  
    - Ask: "Would you apply [term] here? Why/why not?"  
  - **Handle the "nasty" case (your challenge #4)**:  
    - If parties **agree on all case descriptions and term applications** → Outcome 2 ("no disagreement"). If they still resist, say: "You agree on cases but not the label—this suggests a framework choice."  
  - **Interpretation**:  
    - If parties **disagree on case descriptions** (e.g., one says "water levels are low," other says "nutrient loads are high") → Outcome 1 (factual disagreement).  
    - If parties **agree on case descriptions but disagree on term application** → Proceed to Step 4 (likely framework/normative).  
    - If parties **agree on everything** but deadlock persists → Proceed to Step 4 (implications may be load-bearing).  

  **Step 4: Test for Load-Bearing or Strategic Terms (5–7 min)**  
  *Goal: Check if the term has practical/project implications beyond labeling.*  
  - Ask: "If we used your definition of [term], what would change in [blocked output]? What decisions, metrics, or actions would differ?"  
  - **Handle load-bearing terms (your challenge #2)**:  
    - If a group says, "Our model/regulation requires [term] to trigger X," ask: "Could we achieve X with a neutral description?" If no → Term is load-bearing.  
  - **Handle strategic vagueness (your challenge #3)**:  
    - If a group avoids defining the term, ask: "What are the risks of defining [term] precisely?" If they cite political/grant-related reasons (e.g., "It’s too sensitive"), flag this.  
  - **Interpretation**:  
    - If term is **load-bearing** or **strategically vague** → Outcome 3 (steering committee).  
    - If term has **no practical implications** → Outcome 2 ("no disagreement").  
    - ⚠️**JUDGMENT CALL**: You assess "practical implications" based on answers, but experts define what’s load-bearing. Err toward Outcome 3 if implications exist.  

  **Step 5: Final Cross-Check (1–2 min)**  
  *Goal: Resolve conflicts between tests.*  
  - If elimination test suggests disagreement but case test shows agreement → Outcome 2 (no disagreement) *unless* Step 4 revealed load-bearing implications.  
  - If case test shows disagreement but elimination test showed agreement → Trust case test (it’s more concrete); likely Outcome 1.  
  - ⚠️**JUDGMENT CALL**: If experts insist disagreement is "real" despite test results, default to Outcome 3. Your tests can’t override domain expertise.  

  **Outcome Selection (1 min)**  
  - **Outcome 1 (Factual)**: Parties describe the world differently → "Disagreement about X; resolve with data/analysis on Y."  
  - **Outcome 2 (No Disagreement)**: Parties agree on cases/descriptions → "No substantive disagreement; proceed with implementation."  
  - **Outcome 3 (Framework/Normative)**: Disagreement about which concept to use → "Not resolvable by evidence; escalate for steering committee decision on framework."  

  ---

  ### Handling Your Cases with the Procedure
  **Case (a): Ecologists vs. Economist on "Degraded" Wetland**  
  - **Step 1**: Blocked output: Monitoring protocol. Stakes: Ecologists want baseline measures; economists want service-flow metrics.  
  - **Step 2 (Elimination)**:  
    - Ecologists: "Departure from pre-drainage state (e.g., biodiversity loss)."  
    - Economists: "Reduction in value of services (e.g., flood control)."  
    - → Disagreement persists (asymmetry: both restated, but differently).  
  - **Step 3 (Cases)**:  
    - Case 1: Wetland restored to pre-drainage state but now has less flood control due to urbanization.  
      - Both agree: Ecologists say "not degraded"; economists say "degraded."  
    - → Agree on facts, disagree on term → **Load-bearing test needed**.  
  - **Step 4 (Load-Bearing)**:  
    - Ecologists: "Protocol must track biodiversity for grant compliance."  
    - Economists: "Protocol must show ROI for policymakers."  
    - → Term is load-bearing (affects monitoring design).  
  - **Outcome**: Outcome 3 (framework choice).  
  - **Your note**: "Disagreement stems from prioritizing baseline ecology vs. service flows in monitoring. Not resolvable by data; steering committee must choose framework."  
  - **One sentence for room**: "You agree what’s happening in the wetland but need the committee to decide which goal—ecological integrity or human benefits—drives the protocol."  

  **Case (b): ML vs. Clinicians on "Bias" in Mortality Model**  
  - **Step 1**: Blocked output: Model fix. Stakes: ML wants equal error rates; clinicians want calibration.  
  - **Step 2 (Elimination)**:  
    - ML: "Disparate error rates across groups."  
    - Clinicians: "Miscalibration in high-risk subgroup."  
    - → Disagreement persists.  
  - **Step 3 (Cases)**:  
    - Case 1: Model with equal error rates but poor calibration for Group X.  
      - ML: "Not biased." Clinicians: "Biased."  
    - → Agree on facts, disagree on term → **Load-bearing test**.  
  - **Step 4 (Load-Bearing)**:  
    - ML: "Fixing error rates affects regulatory fairness standards."  
    - Clinicians: "Fixing calibration affects clinical decisions."  
    - → Term is load-bearing (different fixes).  
  - **Outcome**: Outcome 3 (framework choice).  
  - **Your note**: "Disagreement reflects competing priorities: statistical fairness vs. clinical utility. Steering committee must decide which standard governs the model."  
  - **One sentence for room**: "Your definitions point to different fixes with real trade-offs—this is about which goal matters more, so the committee should weigh in."  

  **Case (c): Coastal "Resilience" Fight (Agreement on Cases, Still Deadlocked)**  
  - **Step 1**: Blocked output: Infrastructure model. Stakes: Engineers emphasize robustness; planners emphasize recovery speed.  
  - **Step 2 (Elimination)**:  
    - Party 1: "Withstands 100-year storm."  
    - Party 2: "Recovers fast after any storm."  
    - → Disagreement persists.  
  - **Step 3 (Cases)**:  
    - Case 1: Infrastructure fails in a storm but is rebuilt better in 1 week.  
      - Both agree: "Resilient for recovery, not for robustness."  
    - → Agree on cases and term application → **But deadlock persists → Proceed to Step 4**.  
  - **Step 4 (Load-Bearing)**:  
    - Party 1: "Model must prioritize storm resistance for safety regulations."  
    - Party 2: "Model must prioritize recovery for cost-benefit analysis."  
    - → Term is load-bearing (affects model design).  
  - **Outcome**: Outcome 3 (framework choice).  
  - **Your note**: "Parties agree on resilience cases but need steering committee to decide operational emphasis (robustness vs. recovery) for the model."  
  - **One sentence for room**: "You agree on what resilience looks like, but the model can’t do both at once—this is a choice about project priorities for the committee."  

  ---

  ### What This Procedure **Can’t** Do (Limitations)  
  Even when run perfectly, it may:  
  1. **Mislabel deep normative disputes as factual**: If parties frame value judgments as factual claims (e.g., "Ecosystems *should* serve humans" disguised as "degraded means low service value"), tests may miss it.  
  2. **Fail if parties are dishonest**: Strategic actors may "tactically agree" in cases to avoid exposing weaknesses.  
  3. **Overlook unspoken hierarchies**: If deadlock stems from power dynamics (e.g., a faction resisting definition to avoid oversight), the procedure won’t surface it—Step 4’s "strategic vagueness" check is your best tool.  
  4. **Stall on meta-disagreements**: If parties dispute what counts as a "case" or "neutral description," you’ll need ad hoc facilitation (not covered here).  
  5. **Force resolution on "nasty" cases**: If parties agree on cases but still won’t concede due to pride/politics, Outcome 3 is your only escape hatch.  

  ### Key Judgment Call Warnings  
  - You **cannot declare a dispute "verbal"** if experts insist it’s substantive—always defer to Outcome 1 or 3 in doubt.  
  - Steps 2, 4, and 5 involve **⚠️JUDGMENT CALLS**: Assessing "neutral" restatements, "practical implications," and test conflicts relies on your facilitation skills, not philosophical expertise.  
  - Your greatest leverage is **project-blocking stakes** (Step 1). Use this to keep experts engaged.  

  This procedure balances structure with flexibility—grounded in your philosophical intuitions but operationalized for hostile, time-pressed rooms. Run it as a rigid script at first; adapt as you gain experience.
