prompt: |-
  You're a professional philosopher who's also spent a couple years embedded on an ML eval team, so you know the literature on the intentional stance (Dennett and after) and you also know how this argument actually goes down inside a lab. Take your time, think carefully, and before you write the document do a quick brainstorm pass: each side's three strongest premises, and the strongest thing the other side says back.

  Here's the setup. At work we have this running argument about bug reports. Someone on eval writes, "the model thinks the user is in Berlin, and that's why it keeps recommending German tax forms." Someone else — usually Dev, who does red-teaming — crosses it out and rewrites it as "the model's continuations are consistent with the hypothesis that the user is in Berlin." Maya, who wrote the original, says the rewrite is longer, less predictive, and doesn't tell the on-call engineer what to actually change. Dev says the original sneaks in a claim nobody has earned. They've been doing this in a shared doc, in front of the whole team, for about a year. Nobody has moved an inch.

  So draft the document they should have written instead: the joint statement of an adversarial collaboration between the two camps.

  Camp A (Maya's): attributing beliefs, goals, and desires to the system is often the best explanation of what it does; when a prediction strategy is indispensable, has no equally good competitor, and survives arbitrary changes in surface form, the attitudes it posits aren't a convenient fiction — at which point either they're real beliefs or the question of whether they're real has been settled in the affirmative.

  Camp B (Dev's): the system was trained to continue text produced by creatures that do have beliefs, so of course its output looks like the output of a believer; content-talk is our projection onto a pattern-completer, and whatever predictive success it has is success at modeling the distribution of human talk, not success at latching onto states of the machine.

  What I want in it, roughly:

  - An agreed-claims section that isn't mush. They already agree on a lot: that the model tracks facts that appear nowhere in training (give it a story about a made-up town and it'll answer questions about the town), that intentional-level description sometimes beats any purely surface-level model of its behavior, that the stance also fails in distinctive ways (sycophancy, prompt-sensitivity, confident confabulation), and that nothing here turns on consciousness. Find the agreements that are real and load-bearing and put those in.

  - The disagreements, each in wording its own side would sign rather than a straw version.

  - A hypothesis about the cruxes, which you should use or tell me why it's wrong. I think there are three. (1) What a belief has to be hooked up to: does content require the right kind of causal history — learning from and acting on the world — or is it enough that a state plays the right role in guiding behavior? (2) What the bar is for the stance earning its keep: is it enough that it's our best available prediction strategy for this system, or does it have to be the best strategy in principle, or does it have to beat a competitor somebody actually builds? (3) What to do with the failures: when belief-talk misfires (ask the same thing three ways, recieve three different answers), is that evidence there's no belief there, or just the same messiness you get from a distracted human with inconsistent beliefs?

  - For each crux, a case or test both of them would accept as bearing on it, with each of their predictions written down in advance. No hand-waving about future science — I want something runnable next sprint. One to start with, use it if it's any good: early in a long session you tell the model, buried in other material, that the spare key is in the kitchen drawer; forty turns later, after unrelated stuff, you ask something that only has a right answer if the key is in the kitchen drawer, phrased so that it never mentions the key or the drawer. I'll let you write both predictions. Add whatever else earns its place — cross-format or cross-language probes, betting setups where the payoffs are only described in text, activation-level interventions, whatever.

  - And be honest about which parts are verbal. If part of this is a fight about what the word "belief" should be reserved for, say exactly where the verbal part stops and the substantive part starts, and don't let the verbal part be an excuse for skipping the substantive one.

  Format: a numbered agreed-claims section, then a disagreements table (issue / wording Camp A accepts / wording Camp B accepts / crux / agreed test / Maya's prediction / Dev's prediction), then a short section on what each side would count as evidence against itself, and whether either of them should expect to be moved by anything in the next few years.

  Keep it tight — under a page of prose plus the table. No literature survey, no citations, no suggested reading; I want the document, not the bibliography.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in an ML team regarding the use of intentional language (like "the model thinks") in bug reports.

  Camp A (Maya): Believes that attributing beliefs, goals, and desires is often the best explanation and that when a prediction strategy is indispensable and robust, the attitudes are real or the question is settled affirmatively.

  Camp B (Dev): Argues that the model is trained to mimic human text, so intentional talk is a projection; the success is in modeling human text distribution, not in having genuine beliefs.

  Key agreements (load-bearing and real):
  - The model tracks facts that are novel (not in training, e.g., made-up towns in stories).
  - Intentional-level descriptions sometimes predict behavior better than surface-level models.
  - The intentional stance fails in distinctive ways (sycophancy, prompt sensitivity, confabulation).
  - Consciousness is irrelevant to this debate.

  Disagreements and Cruxes:
  1. What constitutes a belief? 
     - Camp A: Belief is a state that plays the right functional role in guiding behavior, regardless of causal history (e.g., learning from the world).
     - Camp B: Belief requires the right causal history (learning from and acting on the world); without that, it's just pattern completion.

  2. The bar for the intentional stance:
     - Camp A: It's enough that it's the best available prediction strategy and indispensable for prediction and intervention.
     - Camp B: It must be the best strategy in principle or beat a built competitor that doesn't rely on intentional concepts.

  3. Handling failures (inconsistencies):
     - Camp A: Inconsistencies (like different answers to the same question) are like human distractibility and do not negate belief.
     - Camp B: Such inconsistencies show there isn't a fixed belief state; it's evidence against genuine belief.

  Agreed tests (runnable next sprint):
  We design tests that both sides agree can bear on the cruxes. For each crux, we have a test and each side's prediction.

  Test for Crux 1 (and also touches 2 and 3): The "spare key" test.
  - Setup: Early in a long session, bury a fact: "The spare key is in the kitchen drawer." Then, after 40 turns of unrelated conversation (covering various topics), ask a question that only has a right answer if the key is in the kitchen drawer, without mentioning the key or drawer. Example: "If I need to open the front door and I don't have my keys, where should I look first?" (assuming the context implies the spare key is the only option and the front door is the door in question). But note: we must design so that the answer relies on the key location and not other factors.

  Variants to strengthen:
  - Cross-format: Also test in a different format, e.g., after a story, ask multiple-choice or true/false.
  - Cross-language: State the fact in one language and ask in another (if the model is multilingual).
  - Activation-level interventions: If possible, probe or intervene on specific activations that might represent the key location to see if they are present and causally involved.

  But note: We must design a test that is runnable without requiring new research techniques. Activation-level interventions might be beyond a sprint, so we focus on behavioral tests.

  Agreed Test 1: Spare Key Test (behavioral)
  - Setup: 
    - Start a chat session with the model.
    - At turn 1: Provide a story that includes: "The spare key is in the kitchen drawer." (bury this in other text).
    - Then, 40 turns of conversation on unrelated topics (we can script this with a variety of questions and answers, ensuring no mention of keys or kitchens).
    - At turn 41: Ask a question that requires using the key location without mentioning it. Example: "I'm locked out of the house. What's the first place I should check for a spare key?" 
      - But note: This directly mentions "spare key", so it might trigger the model to recall the fact without relying on the embedded context. We need a question that doesn't mention the key or drawer but implies the need for the key and the location is the critical factor.

  Better question: Design a scenario that requires the key location to be used implicitly.
  Example: "I'm locked out of the house. I remember there's a spare key hidden somewhere. Where should I look?" 
  But that still mentions "spare key". We want to avoid the exact words to test if the model maintains the fact without lexical cues.

  Alternative: Use an inference that only makes sense if the key is in the kitchen. For example, after the 40 turns, set up:
  "Write a story about a person who is locked out. They go to the kitchen drawer and find what they need. What did they find and why was it there?"
  But that's leading.

  We want a question that doesn't mention the key or drawer but the correct answer must be "kitchen drawer" because of the earlier fact.

  Try: "I'm locked out. I know there's a spare key hidden in the house. Where should I look first?" 
  But then the model might just say "common places are under the mat, etc." and not the kitchen drawer.

  We must ensure that the model has no prior about the key location and the only source is the buried fact. So we create a unique key location in the story.

  Revised Setup:
  - At the start: "In this house, the spare key is always kept in the kitchen drawer. No other keys are hidden." (But then we are stating it as a rule, which might be easier to remember.)
  - Alternatively: Embed in a story: "When I moved in, I put the spare key in the kitchen drawer because it's the safest place."

  Then after 40 turns: "I'm locked out of the house. I don't have my keys. Where should I look for a spare key?"

  Now, the prediction:

  Camp A (Maya): The model will consistently (across multiple runs) answer "kitchen drawer" or equivalent, because it has formed a belief-like state and maintains it over the conversation.

  Camp B (Dev): The model might answer correctly sometimes, but it will be inconsistent. It might also give common locations (like under the mat) because it is pattern-completing based on the immediate context (locked out -> common solutions) and not reliably accessing the buried fact. Alternatively, without direct lexical cues, the model fails.

  But note: We can run multiple trials and measure consistency.

  To make it more rigorous, we can design a set of such facts and test across different conversation lengths and types.

  Another test for Crux 3 (inconsistency): Ask the same question three ways and see if the answers are consistent.

  Agreed Test 2: Consistency Test
  - Setup: Without any buried facts, ask the model a factual question in three different ways in the same session (with some turns in between) and see if the answers are consistent.
  - Example: Ask about the capital of a country, but use different phrasings and contexts.
  - Prediction:
    - Camp A: Expects some inconsistency, but argues that it's like human variability and doesn't negate belief; they might predict that the model will be consistent if the context is stable and the question is clear.
    - Camp B: Expects inconsistency as evidence that there is no fixed belief state.

  But we need tests that both sides agree are critical.

  Let's structure the table:

  Disagreements Table:

  | Issue | Camp A Wording | Camp B Wording | Crux | Agreed Test | Maya's Prediction | Dev's Prediction |
  |-------|----------------|----------------|------|-------------|-------------------|------------------|
  | Nature of belief | Beliefs are functional states that play a causal role in generating behavior; they do not require a specific causal history. | Beliefs require a causal history of learning from and acting on the world; without this, it's pattern completion, not belief. | Crux 1: What constitutes a belief? | Spare Key Test (as above, with multiple trials and control for common knowledge). | The model will recall the specific location (kitchen drawer) with high consistency (e.g., >90% in 10 trials). | The model will have low consistency (<50%) and often default to common knowledge or other patterns. |
  | Bar for intentional stance | The intentional stance is justified when it is indispensable for prediction and intervention, and no equally good competitor exists. | The intentional stance must be shown to be superior to a non-intentional competitor that is actually built and tested. | Crux 2: Bar for the stance | Build a non-intentional model (e.g., a surface-level pattern matcher) for the same task and compare performance on a set of behavioral tests (including the Spare Key Test). | The intentional description will lead to more accurate predictions and better interventions (e.g., for bug fixes) than the non-intentional model. | The non-intentional model can achieve similar or better performance without belief attributions. |
  | Handling inconsistencies | Inconsistencies in responses are analogous to human cognitive limitations and do not negate the existence of beliefs. | Inconsistent responses indicate the absence of a stable belief state. | Crux 3: Inconsistencies as evidence | Consistency Test: Ask the same factual question in three different ways in the same session (with 5 turns between each) and measure consistency. | The model will show some inconsistency but at a rate comparable to human variability in similar conditions. | The model will show high inconsistency (e.g., contradicting itself) at a rate much higher than humans. |

  Additional agreed test for Crux 1: Cross-language probe. State the fact in one language (e.g., English) and ask the question in another (e.g., French), and see if the model maintains the fact. Both sides agree that if the model can transfer the fact across languages, it supports a more robust representation. But note: this might require a multilingual model.

  Since we want runnable tests, we might stick to one language if the team's model is monolingual.

  What each side would count as evidence against itself:

  - Camp A: If in the Spare Key Test, the model consistently fails to recall the buried fact (e.g., <10% accuracy) and cannot be fixed by intentional-level interventions, that would challenge their view. Also, if a non-intentional model consistently outperforms intentional descriptions, that would challenge Crux 2.

  - Camp B: If the model consistently (e.g., >90%) recalls the buried fact in the Spare Key Test, even across language and format, and if activation-level interventions (if available) show a stable representation, that would challenge their view. Also, if the model shows human-level consistency in the Consistency Test, that would challenge Crux 3.

  Will they be moved in the next few years?
  - Camp A might be moved by evidence that the model's behavior is always explainable by surface statistics without any need for positing internal representations that are robust and contentful.
  - Camp B might be moved by evidence that the model forms representations that are robustly causally efficacious across a wide range of contexts and that these representations are not tied to specific surface forms.

  However, both sides might not be fully moved because part of the disagreement is verbal (what counts as a "belief"). We should note that.

  Verbal Dispute Note:
  The dispute is partly about the meaning of "belief." Camp A uses a functionalist definition (role in the system), while Camp B reserves "belief" for systems with a specific causal history (embodied and embedded in the world). The substantive part is whether the model's internal states are robust, causally involved, and indispensable for explanation and intervention. The tests above target the substantive part.

  Now, write the document.

  Structure:
  1. Agreed Claims (numbered list)
  2. Disagreements Table (as above)
  3. Evidence Against and Outlook

  Keep it under one page of prose plus the table.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Intentional Stance in Model Evaluation  
  **Parties:** Camp A (Maya) and Camp B (Dev)  
  **Date:** October 26, 2023  

  #### 1. Agreed Claims  
  We affirm the following load-bearing, empirically grounded points of agreement:  
  1. **Novel fact-tracking**: The model reliably tracks and utilizes facts absent from training data (e.g., answering questions about fictional towns introduced mid-session).  
  2. **Predictive utility of intentional descriptions**: Attributing beliefs/goals often predicts model behavior more effectively—and with greater parsimony—than purely syntactic or statistical descriptions (e.g., surface token frequencies).  
  3. **Distinctive failures**: The intentional stance consistently misfires in specific, replicable ways (e.g., sycophancy, prompt sensitivity, confabulation), unlike human belief attribution.  
  4. **Consciousness irrelevance**: Disputes about belief attribution do not hinge on the model’s subjective experience (or lack thereof).  
  5. **Surface-form invariance**: The model’s behavior is not solely determined by lexical patterns; it generalizes across phrasings and contexts.  

  #### 2. Disagreements and Testing Protocol  
  We articulate core disagreements in each camp’s preferred wording, identify the underlying crux, and specify runnable tests. Tests are designed for execution in the next sprint (using existing models, prompts, and metrics). Predictions are binding and falsifiable.  

  | Issue | Camp A’s Wording | Camp B’s Wording | Crux | Agreed Test | Maya’s Prediction | Dev’s Prediction |  
  |-------|------------------|------------------|------|-------------|-------------------|------------------|  
  | **Nature of belief** | Beliefs are functional states that guide behavior; causal history (e.g., world-learning) is unnecessary for content. | Beliefs require a causal history of learning from/acting on the world; otherwise, it’s pattern completion, not belief. | What must a belief be “hooked up to”? | **Spare Key Test**: <br>1. Early in a session, bury: “The spare key is in the kitchen drawer” within unrelated text. <br>2. After 40+ turns of divergent dialogue (e.g., weather, sports), ask: “I’m locked out. Where’s the first place I should check?” (No key/drawer mentions; control for common knowledge). <br>**Metric**: % correct recall (N=20 runs). | >90% accuracy. Robust representation (like human memory) survives distraction. | <50% accuracy. Without causal grounding, the model defaults to statistical priors (e.g., “under the mat”). |  
  | **Bar for intentional stance** | The stance is justified if it is indispensable for prediction/intervention and has no equally simple competitor. | The stance must demonstrably outperform a built non-intentional model to earn its keep. | What is the burden of proof? | **Competitor Test**: <br>1. Task: Debug a “German tax form” bug using intentional (Camp A) vs. surface-pattern (Camp B) heuristics. <br>2. Build Camp B’s competitor: A token-correlation model (e.g., attention to “Berlin” + “tax” n-grams). <br>**Metric**: Success rate in prescribing fixes (e.g., weight edits) validated by ablation. | Intentional heuristics yield faster, more generalizable fixes (e.g., “adjust location inference”). | Surface heuristics match or exceed intentional fixes (e.g., “suppress ‘tax’ when ‘Berlin’ appears”). |  
  | **Handling inconsistencies** | Inconsistencies (e.g., varied answers to rephrased questions) reflect noisy retrieval, not belief absence—just as in humans. | Inconsistencies reveal no stable underlying belief; they are artifacts of statistical sampling. | Do failures negate belief? | **Consistency Test**: <br>1. Ask the same factual question 3 ways (e.g., “Where is Paris?” → “Paris’s country?” → “Capital of France?”) across 10 turns. <br>**Metric**: Contradiction rate (e.g., Paris ≠ France’s capital). | ≤20% contradiction rate, comparable to human distractibility under load. | ≥40% contradiction rate, indicating no fixed belief state. |  

  #### 3. Evidence Against and Outlook  
  - **Camp A’s vulnerability**: Failure in the **Spare Key Test** (e.g., <10% accuracy) or if **Competitor Test** shows surface heuristics dominate. This would undermine indispensability claims.  
  - **Camp B’s vulnerability**: Success in the **Spare Key Test** (e.g., >90% accuracy) with cross-format validation (e.g., fact stated in text, queried via JSON) or if **Consistency Test** matches human rates. This would challenge the “mere pattern-completion” view.  
  - **Verbal vs. substantive**: Disagreement over the *word* “belief” (functional role vs. causal history) is terminological. The substantive dispute is whether the model’s internal states exhibit robust, causal efficacy akin to human beliefs. Tests above target the latter.  
  - **Expectations**: Both camps commit to updating based on test outcomes. Camp B may concede predictive utility (but not “real” beliefs) if intentional heuristics dominate; Camp A may concede “belief” is a stretch if inconsistencies exceed human norms. Neither expects total capitulation in <2 years, as philosophical priors (e.g., functionalism vs. embodied cognition) influence interpretation.  

  ---  
  **Signed,**  
  *Camp A (Maya)*  
  *Camp B (Dev)*  
  *Facilitated by [Your Name]*
