prompt: |-
  I am the token philosopher on a committee at my university that has to choose a social discount rate for long-lived capital projects — a district-heating retrofit whose costs fall now and whose savings accrue over eighty years, a library roof with a fifty-year life, that sort of thing — and I have discovered that I cannot reconstruct a principle behind the numbers I keep wanting to propose. So I am going to list my gut verdicts on a set of cases and ask what discounting rule, if any, they add up to. (1) A migraine for me tomorrow versus an identical migraine for me in exactly twenty years: indifferent, I would pay the same to avoid either. (2) A weekend in Vienna this year versus a qualitatively identical weekend in twenty years: I would give up something like a tenth of the value to have it now. (3) Fifty dollars now to spare a stranger a day of severe pain next year, but only about twenty to spare a stranger an identically severe day three centuries from now — yet if you hand me a device that guarantees the later person exists, that the pain would otherwise occur, and that my money is spent only conditional on both, my reluctance almost entirely disappears. (4) A friend who spends forty years in dreamless suspended animation and wakes in 2065 with no experienced gap: a benefit delivered to her at the instant of waking versus the same benefit delivered a calendar year later — my gut says no discount at all, which suggests that what I am discounting is experienced time rather than calendar time, though I cannot tell what that implies for the committee's eighty-year retrofit, where everyone experiences the interval. (5) A thousand people helped in two hundred years beats a hundred helped today, but a hundred helped today beats a hundred and one helped in two hundred years, so my revealed rate seems to collapse as the stakes grow. (6) I would pay more to postpone a harm by a year than to advance an equal-sized benefit by a year. (7) I would pay a great deal to shave a small probability of civilizational collapse five centuries out, but very little for a guaranteed modest benefit to whoever is alive then, which sits badly with (5). And one more observation that may or may not belong: if I imagine being told that I was born in 1920 rather than 1990, my willingness to pay for benefits in a given calendar year changes, which makes me suspect that part of what I call temporal discounting is really positional rather than temporal.

  What I want is the principle, or the small set of candidate principles, that fits these verdicts — stated precisely, with the case that motivates each clause, and with an honest statement of which verdicts it cannot accommodate and why. Please separate, as you go, the discounting that is genuinely a preference for earlier over later from the discounting that is really something else wearing its clothes: risk that the beneficiary never exists or the benefit never arrives, causal fragility over long chains, opportunity cost of capital, diminishing marginal utility if future people are richer, or the positional effect I mentioned. Once all of those are subtracted, is there a residual pure time preference in my verdicts at all, and if there is, is it rationally defensible or is it the familiar failure of imagination that the economists on the committee invoke? I would also like the resulting account's verdicts on three cases I have not listed: a policy whose beneficiaries do not yet exist and whose number depends on which policy we choose; a bequest to an institution that will persist continuously for three hundred years, where no individual experiences the interval; and the difference, if the account sees one, between discounting within a single life and discounting across generations. Finally, tell me whether the account I end up with hands the committee a single number, or whether it implies that a single number was never the right object to be asking for.
reasoning: |-
  Okay, let me try to unpack this philosopher's discount rate dilemma. They're on a university committee needing to choose a social discount rate for long-term projects like an 80-year heating retrofit or 50-year library roof. But their gut reactions to various hypotheticals don't fit standard economic models, and they want me to extract the underlying principles.

  First, I need to analyze each of their seven cases plus the positional observation. Case (1) shows zero pure time preference for identical personal harms - migraines tomorrow vs 20 years later feel equally bad. But case (2) reveals strong time preference for positive experiences - a Vienna weekend now is worth 10% more than decades later. Already this suggests asymmetry between gains and losses.

  Case (3) is fascinating - they discount helping distant-future strangers but the discount vanishes when existence/causality are guaranteed. This screams "uncertainty masquerading as discounting." Case (4) with suspended animation hints that discounting applies only to experienced time, not calendar time when consciousness pauses.

  The stakes-dependent behavior in (5) is crucial - future benefits need to be much larger to outweigh present ones, but the required premium shrinks as absolute scales increase. This feels like a logarithmic utility function. And the asymmetry in (6) where delaying harms is valued more than accelerating benefits reinforces the gain/loss disparity.

  Case (7) adds another layer - existential risk reduction feels urgent, but guaranteed modest future benefits don't. This might be about catastrophic weighting. And that positional observation is profound: their valuation changes if they imagine being born earlier, suggesting some discounting is really about relative position in time rather than absolute time.

  Putting this together, I suspect their "discount rate" is actually five separate things tangled together: pure time preference (minimal), risk of non-realization, causal uncertainty, probability weighting for catastrophes, and positional effects. The committee probably needs multiple parameters rather than one magic number - maybe a risk-adjusted model with explicit uncertainty terms for beneficiary existence and benefit delivery.

  For those unlisted cases: For policies creating future beneficiaries, I'd recommend a population-ethical framework. For 300-year institutional bequests with no continuous consciousness, it's pure causal fragility. And the single-life vs cross-generational distinction matters enormously - the latter involves stronger uncertainty and ethical considerations beyond mere time preference.

  The real takeaway? Their committee shouldn't demand a single discount rate. They need a structured decision framework separating all these components, especially for those 80-year retrofits where experienced time is continuous but causal chains are long. The philosopher's gut feelings make perfect sense once untangled - they're not irrational, just recognizing complexities economists often simplify away.
answer: |-
  Based on your detailed gut verdicts, the underlying principles appear to be a **pluralistic, context-dependent discounting framework**—not a single discount rate. Below is the reconstructed principle set, clause-by-clause, with motivations, limitations, and verdicts on your unlisted cases. Crucially, your "discounting" is a composite of distinct factors, and **pure time preference is minimal or absent**.

  ---

  ### **Reconstructed Principle Set**
  **1. No Pure Time Preference for Identical Experiences**  
  *Clause*: For identical hedonic states (pain/pleasure) *guaranteed to occur to a known, existing consciousness*, apply **δ ≈ 0%**.  
  *Motivation*: Cases (1) (migraine) and (4) (suspended animation benefit). If experience is identical and certain, calendar time is irrelevant.  
  *Limitation*: Does not apply to non-identical experiences (e.g., Vienna weekend involves anticipation/mortality).  
  *Residual Pure Time Preference?* **None** for welfare-equivalent outcomes.  

  **2. Positional Scarcity & Mortality Discounting**  
  *Clause*: Discount benefits/harms based on **your temporal position relative to mortality and opportunity scarcity**.  
  *Motivation*: Vienna weekend (2) and calendar-year shift observation. A Vienna trip now is scarce because your remaining life is finite; being "born in 1920" changes opportunity sets.  
  *Limitation*: Irrelevant for social discounting (applies only to individual choice).  

  **3. Causal Fragility Discount Factor**  
  *Clause*: Apply heavy discounting for **uncertainty that the beneficiary exists, the causal chain delivers the benefit, or resources are used efficiently**. Removable with guarantees.  
  *Motivation*: Case (3) (stranger’s pain). Your reluctance vanishes with guarantees of existence/causality.  
  *Limitation*: Quantifiable via probability estimates (e.g., 0.5% p.a. collapse risk).  

  **4. Asymmetric Harm-Benefit Discounting**  
  *Clause**: Discount harms **less** than benefits. Postponing harm > advancing benefit.  
  *Motivation*: Case (6). Harm delay is prioritized due to loss aversion or precautionary bias.  
  *Limitation*: Socially, this may imply higher discount rates for cost savings than for benefits.  

  **5. Stake-Dependent Discount Rate**  
  *Clause*: Discount rate **decreases as stake size increases**.  
  *Motivation*: Case (5). Threshold effect: small benefits require high future premiums; large benefits need minimal premium.  
  *Limitation*: Suggests logarithmic utility—e.g., ∆U = log(consumption).  

  **6. Catastrophic Risk Premium**  
  *Clause*: Add a **premium for reducing existential/civilizational risks**, decoupled from standard benefit discounting.  
  *Motivation*: Case (7). Collapse risk reduction is valued highly despite distant horizon, unlike guaranteed benefits.  
  *Limitation*: Not discounting—it’s high weight on tail risks.  

  ---

  ### **What Isn’t Temporal Discounting?**
  - **Risk of Non-Realization**: Case (3) shows your "discount" is largely uncertainty (beneficiary existence, institutional failure).  
  - **Causal Fragility**: Long chains (e.g., 300-year bequest) introduce failure points—this is reliability engineering, not time preference.  
  - **Positional Effects**: Your birth-year thought experiment confirms this is relative scarcity, not absolute time valuation.  
  - **Diminishing Marginal Utility (DMU)**: Case (5) implies DMU—future richer generations need less marginal utility weight.  
  - **Opportunity Cost**: Absent from your cases—you focus on welfare, not capital productivity.  

  **Residual Pure Time Preference?**  
  Only in Case (2) (Vienna), driven by mortality/anticipation—a **personal, not social**, factor. For social projects (e.g., retrofit), pure time preference is **indefensible per your intuitions** (economists’ "failure of imagination" critique holds).  

  ---

  ### **Verdicts on Unlisted Cases**
  **A. Policy with Future/Dependent Beneficiaries**  
  - *Verdict*: Use **existence-adjusted DMU**. Discount for:  
    (a) Probability future people exist (e.g., 0.1% p.a. collapse risk),  
    (b) Lower marginal utility if richer (e.g., 0.5% p.a. if growth = 1%),  
    (c) Stake size: Large benefits (saving civilization) get near-zero discount.  
  - *No pure time discount*.  

  **B. 300-Year Institutional Bequest**  
  - *Verdict*: Apply **causal fragility discount only**.  
    Rate = probability of institutional failure (e.g., 0.3% p.a. if robust endowment). Calendar time irrelevant—no consciousness experiences the interval.  

  **C. Single Life vs. Cross-Generational Discounting**  
  - *Single Life*: Near-zero pure discount (Case 1). Only mortality/scarcity matters (Case 2).  
  - *Cross-Generational*: Dominated by **existence risk, DMU, and asymmetry**. Harm to future generations discounted less (Case 6).  

  ---

  ### **Committee Recommendation: No Single Number**
  Your principles reject a universal discount rate. Instead, recommend:  
  1. **Component-Based Formula**:  
     Social Discount Rate =  
     `Risk-Free Rate` + `Probability of Non-Realization` + `DMU Adjustment`  
     - `Risk-Free Rate` (e.g., 0% pure time preference)  
     - `Non-Realization` (e.g., 0.2% p.a. for 80-year project)  
     - `DMU Adjustment` (e.g., 0.7% p.a. if per-capita growth = 1%)  
     → **Total: ~0.9% p.a.**, but components vary by project.  

  2. **Adjust for Context**:  
     - **Harm vs. Benefit**: Use lower discount rate for future costs (e.g., climate damage).  
     - **Stake Size**: For large benefits (e.g., saving >1,000 lives), reduce rate.  
     - **Catastrophic Risk**: Treat separately (e.g., 1% of budget for long-term risk reduction).  

  3. **For Your Retrofit Example**:  
     - Savings are *certain* (experienced time), beneficiaries exist → **Low rate (0.5–1.0%)**.  
     - Asymmetric harm: Future costs of *not* acting (e.g., climate harm) discounted minimally.  

  ---

  ### **Why This Fits (and Where It Strains)**
  - **Accommodates**: All cases except partial tension between (5) and (7).  
    - *(5) vs. (7)*: Resolved by separating catastrophic risk (high value) from guaranteed benefits (DMU discount).  
  - **Rejects Economists’ Single Rate**: Your intuitions require decomposing "discounting" into ethical, risk, and utility dimensions.  
  - **Defensible?** Yes: Pure time preference *is* irrational for social policy. Your framework aligns with:  
    - **Ramsey** (DMU-based discounting),  
    - **Weitzman** (fat-tailed risks),  
    - **Parfit** (non-identity problem addressed via probability weights).  

  **Final Answer**: Give the committee a **structured decision tree**, not a number. The object is a **transparent formula** where ethical parameters (risk tolerance, inequality aversion) are debated, not hidden in a rate.  
    

  > "Discounting is a toolkit, not a single hammer. To demand one number is to confuse the map for the territory—your retrofit’s 80-year horizon involves different risks than a library roof’s 50-year span. Decompose, then deliberate."
