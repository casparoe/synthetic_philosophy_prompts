answer: |-
  Below is a decision tree designed to distinguish between major constructivist positions (and classical-leaning alternatives) based on concrete claims, avoiding rehearsed questions like the Law of Excluded Middle (LEM). The tree uses 8 branch questions, each phrased as a claim you either assert or do not assert (in your foundational mathematical framework). The leaves are named positions, with notes on "empty" regions (incoherent, unattractive, or unexplored). The questions are derived from the logical space, ensuring consistency, and prioritize real fault lines over historical accidents. Positions that answer identically on the tree are noted and not artificially split.

  ### Decision Tree: "Which Kind of Constructivist Are You?"

  Start at the top and follow the branches based on your answers. **Assert** means you accept the claim as provable or true in your foundational system.

  1. **Claim 1 (Pi Run):** "There either is or isn't a run of a hundred consecutive 7s in the decimal expansion of π."  
     - **Assert:** Go to Claim 8 (Classical Branch).  
     - **Do not assert:** Go to Claim Feasibility.

     **Claim Feasibility (Feasibility Requirement):** "For any existential claim (e.g., 'there exists a solution to this equation'), a witness must be feasibly computable in practice (e.g., within a human lifetime, with available resources)."  
     - **Assert:** **Strict Finitism** (Leaf). *Note: Collapses into strict finitism. No major school holds this; it is coherent but unattractive due to incompleteness (e.g., statements with large witnesses become unprovable).*  
     - **Do not assert:** Go to Claim 2.

  2. **Claim 2 (Continuity):** "Every function from the unit interval to the reals is continuous."  
     - **Assert:** Go to Claim 3.  
     - **Do not assert:** Go to Claim 5.

  3. **Claim 3 (Markov's Principle):** "If a Turing machine does not run forever, then it halts." (I.e., ¬¬(halting) implies halting.)  
     - **Assert:** **Russian/Recursive Constructivism** (Leaf). *Uses algorithms + Markov's principle. Real fault line: Rejection of intuitionistic continuity in favor of computability, with ¬¬∃ → ∃ for termination.*  
     - **Do not assert:** **Brouwerian Intuitionism** (Leaf). *Includes choice sequences and bar induction. Real fault line: Continuity via choice sequences, not Markov's principle.*

  4. **Claim 5 (Power Set of ℕ):** "The power set of the natural numbers (i.e., the set of all subsets of ℕ) is a well-defined completed totality."  
     - **Assert:** Go to Claim 6.  
     - **Do not assert:** **Predicativism (Weyl-Feferman)** (Leaf). *Rejects impredicative definitions; ℕ is extensible, not "finished." Real fault line: Quantification over "all subsets" is circular.*

  5. **Claim 6 (Typed Foundation):** "Every mathematical object has an intrinsic type (e.g., naturals, functions), and the foundation is formalized in a type-theoretic language."  
     - **Assert:** **Martin-Löf Type Theory** (Leaf). *Real fault line: Types as primitive, not sets. Coincides with Bishop on many answers but differs foundationally.*  
     - **Do not assert:** Go to Claim 7.

  6. **Claim 7 (Meaning-Theoretic Motivation):** "The primary justification for constructivism is that understanding a logical connective requires manifesting its use (e.g., proving existence requires providing a witness)."  
     - **Assert:** **Dummett/Prawitz Meaning-Theoretic** (Leaf). *Dispute is about meaning, not ontology. Real fault line: Focus on linguistic manifestation over computational content.*  
     - **Do not assert:** **Bishop-Style Constructivism** (Leaf). *Pragmatic focus on proofs-as-algorithms; no commitment to types or meaning theory.*

  7. **Claim 8 (Classical Branch):** "Classical mathematics is independently valid, and constructive math is a subsystem (via a double-negation or similar translation)."  
     - **Assert:** **Ecumenical Position** (Leaf). *Allows classical reasoning; constructivity is "internal."*  
     - **Do not assert:** **Extractive/Proof-Mining Position** (Leaf). *Goal is witness extraction; classical math is a tool, but constructivity is not fundamental.*

  ### Leaf Positions and Notes
  - **Brouwerian Intuitionism:** Choice sequences, continuity, no Markov's principle.
  - **Russian/Recursive Constructivism:** Algorithms, Markov's principle, continuity via Church's thesis.
  - **Predicativism (Weyl-Feferman):** Rejects power set of ℕ; avoids impredicativity.
  - **Martin-Löf Type Theory:** Typed foundation; proofs as programs.
  - **Dummett/Prawitz Meaning-Theoretic:** Meaning grounded in use/manifestation.
  - **Bishop-Style Constructivism:** Proofs as algorithms; no types, no meaning-theory focus.
  - **Ecumenical Position:** Classical math is primary; constructivity via translation.
  - **Extractive/Proof-Mining:** Classical math for witness extraction.
  - **Strict Finitism:** Requires feasible witnesses; no major school holds this (coherent but unattractive).
  - **Unnamed/Empty Regions:** 
    - *Feasibility + anything else:* Only strict finitism (incoherent otherwise, as feasibility contradicts infinitary axioms).
    - *Continuity + Markov's principle:* Only Russian school (Brouwer rejects Markov).
    - *Power set rejection + typed foundation:* Inconsistent (type theory usually accepts power sets via function types). Unexplored/boring as it weakens type theory.
    - *Meaning-theory + classical branch:* Incoherent (classical validity contradicts manifestation requirement).
  - **Leaky Metatheory Footnote:** Most constructivists (e.g., Bishop, Martin-Löf, even Brouwerians in practice) use classical logic in metatheory (e.g., proving normalization). This is a methodological choice, not a distinct position. It's "leaky" but universally admitted.

  ### How to Read Your Path
  - **Start with Claim 1:** This sorts classical-leaning (asserts Pi Run) from constructive (does not assert) positions. It is the most sorting work, as it isolates two-thirds of the tree.
  - **Follow your genuine assertions:** Answer based on what you would prove, not what you think a school "should" say.
  - **Unresolved Pairs:** The tree distinguishes all positions except:
    - *Bishop vs. Martin-Löf:* They answer identically on Claims 1–5 and 7. The split is at Claim 6 (typed foundation), reflecting a foundational preference (sets vs. types) without deep logical differences. Both reject continuity and Markov's principle, accept power sets, and prioritize witnesses.
    - *Dummett/Prawitz vs. others on meaning:* Claim 7 isolates this philosophical motivation, but it doesn't affect mathematical assertions (e.g., both Bishop and Dummett/Prawitz assert the same existence claims).

  ### Fault Lines vs. Accidents
  - **Real Fault Lines:** 
    - Claim 1 (Pi Run): Classical vs. constructive logic (real divide).
    - Claim 2 (Continuity): Brouwer/Russian vs. others (real: choice sequences/algorithms vs. sets/types).
    - Claim 3 (Markov): Russian vs. Brouwer (real: computability vs. intuitionism).
    - Claim 5 (Power Set): Predicativism vs. others (real: impredicativity).
    - Claim 6 (Typed): Martin-Löf vs. Bishop (accidental: sets vs. types, no logical difference).
  - **Accidents of History:** 
    - Claim 7 (Meaning-Theoretic): Isolates Dummett/Prawitz but doesn't change mathematical assertions (accident of philosophical focus).
    - Bishop and Martin-Löf: Identical on claims except typing (accidental clustering; both are "neutral" constructive).

  ### Logical Consistency Checks
  - **Full Choice + Extensionality:** As you noted, implies LEM (Diaconescu's theorem). This rules out regions like "Bishop + full choice" (Bishop uses countable choice only). The tree avoids this by not including a choice question (Claim 6 and Bishop's position imply limited choice).
  - **Feasibility Requirement:** Collapses to strict finitism; incompatible with infinitary axioms (e.g., power sets).
  - **Leaky Metatheory:** Not a branch, as it's methodological and universal.

  This tree covers your requested positions, uses concrete cases, and minimizes rehearsed questions. Print it as a single-page flowchart for your group!
