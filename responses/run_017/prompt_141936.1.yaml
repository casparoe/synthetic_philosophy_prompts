  Now, we have not accommodated the feasibility requirement and leaky metatheory.

  For feasibility, we can add a question at the end for each constructive leaf: Do you require that all witnesses be feasibly computable (within a human lifetime)? If yes, then you are a strict finitist. But since none of the positions do, it will be a leaf that is empty.

  Alternatively, we can have a branch after the constructive camp splits:

