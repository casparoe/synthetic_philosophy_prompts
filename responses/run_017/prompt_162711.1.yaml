prompt: |-
  I'm a political philosopher, and for the past eighteen months I've sat as one of five members — the only one without a legal or audit background — on the Integrity Panel of an international development foundation that funds small infrastructure and livelihood projects in a dozen countries, several of them in West Africa and South Asia, as well as in two English cities. Our founding instrument defines our remit in the familiar terms of the abuse of entrusted power for private gain, but nearly every case that reaches us is one in which no money has changed hands, or in which money or gifts have moved in ways that are locally entirely unremarkable. I've been trying to reconstruct the rule we are actually running, because I suspect the definition we cite does very little work. Our verdicts so far: a procurement officer who placed his brother-in-law's firm on a shortlist from which it then won a contract at a market rate for work that was well done — he declared the relationship and took no part in the scoring — corrupt; a district nurse who accepted small customary cash payments from patients' families after treatment had finished, which everyone in the district expected, which she could not have refused without giving offence, and which made no difference to whom she saw or how quickly — not corrupt; a municipal water engineer who sent two council workers and a council vehicle on a Saturday to repair a privately built borehole serving his own village — corrupt; a village water committee that presented the headman with a goat and a bottle of whisky before he authorised a well, as local custom requires, where the authorisation would plainly have been given anyway — not corrupt; and a mayor who steered a small public works programme preferentially towards firms in the wards that had voted for him, who gained nothing personally and made no secret of it — corrupt.

  The case on Monday's agenda is this. A regional grants panel funded by our foundation awarded four grants from a published rubric, scrupulously applied, and the four highest-scoring applications included three from one recently arrived refugee community. In the months before applications opened, one panel member — herself a member of that community and the unpaid chair of its mutual-aid society — ran free workshops on putting together a strong application, using her own time but our premises and our branding, and advertised them only through the mutual-aid society's own messaging groups, so that in practice only people from that community attended. She disclosed her position, never voted on any application from the society or from anyone she had coached, no money or gift ever moved, the scoring was clean, and no unsuccessful applicant has complained — although the unsuccessful applicants outside that community did not know the workshops existed. Our auditors have flagged it, and I have to vote.

  I can get one formulation to generate all five verdicts — something on the lines of office resources or discretion deployed for the advantage of a section rather than for the purposes of the office, irrespective of whether anyone consents or anything is monetised — and I can also get a rival formulation in terms of benefits distributed by connection rather than by publicly announced and impartially applied criteria to generate them, though I genuinely cannot tell whether that second rule reaches upstream of the formal decision or stops at the allocation itself. What I'd be grateful for is a recommendation rather than a survey: what should we rule here if we want to be consistent with ourselves, which of our five precedents is the closest analog and why, which of the competing rules that fit our track record predict what, which plausible rules the track record actually rules out, and — if our precedents genuinely underdetermine the case — what principle we would be adopting with each of the available rulings and how far that principle would then commit us elsewhere, since I am also worried that the verdicts above smuggle in a distinctly Western ideal of impersonal administration. Please also name the further case that would best discriminate between the rules you think are live, tell me which consideration or further fact would move you to the opposite ruling, and say where you think your reasoning is most likely to break down; flag any empirical assumption you are relying on that I could actually check before Monday. Something in the region of 700 to 900 words would be ideal.
reasoning: |-
  Okay, the user is a political philosopher serving on an Integrity Panel for an international development foundation. They're grappling with a complex case involving a grants panel member who conducted workshops for her refugee community, leading to their disproportionate success in securing grants. The user needs to determine whether this constitutes corruption under their panel's implicit rules, given their prior inconsistent rulings that don't neatly fit standard corruption definitions.

  Hmm, this is fascinating because the user has already identified the core tension: their panel's decisions seem to prioritize procedural universality over personal gain, yet their precedents show exceptions for entrenched local customs. The refugee community case sits precisely at this intersection - is the workshop facilitator's action more like the nurse accepting customary payments (allowed) or the procurement officer favoring family (disallowed)?

  The user's deeper concern resonates - they're worried their panel might be imposing Western bureaucratic ideals. That's perceptive. In the goat/whiskey case, they accepted local custom; here, the workshops might be seen as community self-help. But the key difference is that the workshops used organizational resources exclusively for one group, creating structural exclusion. That's different from the nurse case where payments occurred after service delivery.

  I think the closest analog is actually the mayor case - both involve channeling public resources to favor a particular group, regardless of personal gain. The workshop facilitator created uneven access to application support, functionally equivalent to the mayor's preferential contracting. Even with clean scoring, the playing field was tilted from the start.

  The empirical question that matters most is whether alternative support existed. If the foundation offered no general application assistance, the facilitator filled a gap - but by restricting it to her community, she replicated the exclusion she likely experienced. Still, that doesn't justify the means. A better approach would have been institutionally provided workshops open to all.

  What's really needed is a discrimination case: imagine if she'd run identical workshops but advertised publicly. If that still resulted in only her community attending (due to language/trust barriers), the structural disadvantage would be clearer, and the panel might need to address foundational inequities rather than individual actions. But that's future work - for now, consistency points to "corrupt" with a strong recommendation for systemic fixes.

  The user's brilliance shows in recognizing that their precedents reveal an unarticulated principle about universal access to opportunity-creating mechanisms. That's the principle they're building through case law - one that avoids Western impersonality by respecting substantive local practices (like gift-giving) while rejecting procedural exclusion. Monday's vote could cement that.
answer: |-
  ## Recommendation & Analysis: The Workshop Case

  Based on your precedents and the implicit rule they reveal, **you should rule this case as corrupt ("Corrupt")**. Here's the breakdown:

  1.  **The Governing Rule Revealed by Precedents:**
      Your verdicts consistently sanction **the use of *positional discretion* or *institutional resources* to create or exploit *unequal access* to publicly funded opportunities or benefits, irrespective of personal gain or monetization, *unless* the advantage arises from deeply entrenched, non-discretionary local custom directly tied to the *receipt* (not the *access*) of the benefit.**
      *   **Procurement Officer:** Used positional discretion (shortlisting) to grant *access* (to the shortlist/contract competition) to a relative. *(Corrupt)*
      *   **District Nurse:** Accepted customary gifts *after* service delivery; the service itself (access) wasn't influenced. Custom tied to receipt, not access. *(Not Corrupt)*
      *   **Municipal Engineer:** Used positional discretion (commanding staff/vehicles) and institutional resources for private benefit (village borehole). Created unequal access to public resources. *(Corrupt)*
      *   **Village Water Committee:** Customary gift tied to the *receipt* of an authorization that would have been given anyway. Custom governs the *form* of receipt, not discretionary *access* to the decision. *(Not Corrupt)*
      *   **Mayor:** Used positional discretion (steering contracts) to reward/punish political groups, creating unequal *access* to public funds based on connection (voting bloc). *(Corrupt)*

  2.  **Application to the Workshop Case:**
      *   **Positional Discretion & Institutional Resources:** The panel member used her *position* (grant panel member, access to premises/branding) and *institutional resources* (premises, branding) to run workshops.
      *   **Creating Unequal Access:** While the *scoring* was clean, the workshops created profoundly unequal *access* to the *knowledge and preparation* necessary to compete effectively for the grants. This advantage was conferred solely based on membership in a specific community (her own) via exclusive advertising.
      *   **Not Deeply Entrenched Custom:** This is not analogous to the nurse or headman cases. The workshops were a *discretionary action* by an official, creating a *new* pathway to advantage, not a long-standing custom governing the *form* of a transaction or receipt that would occur regardless. The connection (community membership) directly facilitated privileged *access* to preparatory resources.
      *   **Closest Analog:** **The Mayor.** Both involve using position/influence to channel opportunity preferentially to a connected group (voting wards / refugee community) based on affiliation, creating unequal starting points, even if the final allocation mechanism itself (voting/contract awards / scoring rubric) was formally correct. The upstream advantage creation is key.

  3.  **Predictions of Competing Rules:**
      *   **Rule 1 (Advantage via Discretion/Resources for Section):** Predicts *Corrupt* (as above).
      *   **Rule 2 (Distribution by Connection vs. Public Criteria):** Predicts *Not Corrupt*. The *final distribution* (grant awards) met the publicly announced/impartially applied criteria. This rule, focusing *only* on the allocation moment, ignores how the pool of viable applicants was shaped upstream by unequal access to preparatory resources. Your precedents (Mayor, Procurement Officer) show you care about upstream advantage creation.

  4.  **Rules Ruled Out by Precedents:**
      *   **"Personal Gain is Necessary":** Ruled out by the Mayor case (no personal gain).
      *   **"Formal Process Sanctifies Outcome":** Ruled out by the Procurement Officer and Mayor cases (formal processes followed, still corrupt).
      *   **"Local Custom Always Excuses":** Ruled out by the Engineer case (local expectation doesn't excuse misuse of public resources) and limited by the specificity of the Nurse/Headman cases (custom tied to receipt/form, not upstream access creation).
      *   **"Consent of Affected Parties Validates":** Ruled out implicitly – the unsuccessful applicants' lack of complaint (due to ignorance) is irrelevant in the Workshop case, just as the lack of complaint in the Mayor or Procurement cases wouldn't have excused the act.

  5.  **Underdetermination & Principle Adoption:**
      While the Mayor case is a strong analog, the Workshop case pushes the boundary. If you rule:
      *   **Corrupt:** You adopt the principle that **officials cannot use their position or institutional resources to create exclusive preparatory advantages that distort the *effective* equality of access to public competitions, even if the final selection mechanism is formally fair.** This commits you to scrutinizing upstream activities (training, information dissemination) for exclusivity creating structural bias. Future cases involving biased outreach or "capacity building" for select groups would likely fall under this.
      *   **Not Corrupt:** You adopt the principle that **so long as the final allocation mechanism is formally impartial and no direct influence is exerted on scoring, upstream activities providing exclusive advantage are permissible, especially for marginalized groups.** This would significantly weaken the Mayor/Procurement precedents and could permit significant favoritism in preparatory phases.

  6.  **The Discriminating Case:**
      **Scenario:** A different panel member (unaffiliated with any applicant group), using their *own* time and resources *off* foundation premises, runs *identical* workshops *exclusively* advertised to and attended by a single marginalized community (e.g., via their community center), leading to disproportionate success. Scoring is clean, no disclosure/voting issue.
      *   **Rule 1 (Discretion/Resources for Section):** Likely *Not Corrupt*. No positional discretion/institutional resources misused (own time/resources, off-site). The *exclusivity* is problematic but not tied to office abuse.
      *   **Rule 2 (Distribution by Connection):** Likely *Not Corrupt* (allocation still impartial).
      *   **Your Implicit Rule (Unequal Access via Position/Resources):** *Not Corrupt* (lacks the misuse element). This case highlights that the corruption in the original Workshop case stems from *leveraging the office's authority/resources*, not just the exclusivity itself. It forces a choice: is the core harm the exclusivity or the abuse of office to create it? Your precedents point to the latter.

  7.  **What Would Change the Ruling?**
      *   **Empirical Fact Check:** Was the mutual-aid society the *only conceivable* channel to reach this refugee community effectively (due to language, trust, digital access)? If **conclusively proven** that *no alternative, inclusive method* could have reached them *and* the foundation had *utterly failed* to provide any support, the argument that this was essential bridge-building (mitigating foundation failure, not creating unfair advantage) gains traction, potentially shifting towards *Not Corrupt* (though misuse of branding/premises remains). Check foundation outreach records and community accessibility assessments pre-workshop.
      *   **Principle Shift:** If the panel explicitly decided that proactive measures to overcome structural barriers for specific marginalized groups, even using office resources exclusively, are a legitimate function outweighing strict access equality concerns.

  8.  **Potential Breakdown in Reasoning:**
      The biggest risk is **conflating intent with outcome.** The panel member's intent was likely benevolent – empowering her marginalized community. The *outcome* (grants to deserving projects) was positive. Your rule, however, focuses on the *means* and the *structural effect*: using office resources to create exclusive privilege. Ignoring the benevolent intent/positive outcome is hard but necessary for consistency with sanctioning the Mayor (who may have believed rewarding supporters was legitimate governance) or the Procurement Officer (who ensured fair scoring).

  **Conclusion:** For consistency with your precedents, particularly the Mayor and Procurement Officer cases, you must rule the Workshop case **Corrupt.** The core violation is the misuse of position and institutional resources (premises, branding) to create exclusive access to preparatory resources, structurally advantaging one community *before* the formal scoring even began, replicating the upstream advantage creation sanctioned in your other verdicts. This ruling upholds the principle of equal effective access to public opportunities, while your exceptions for local custom remain distinct. Flag the potential systemic issue: the foundation *should* provide inclusive application support to *all* communities, preventing the need for such well-intentioned but problematic workarounds.
