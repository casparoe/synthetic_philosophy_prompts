prompt: |-
  I am writing a paper on the theory of the pramāṇas, and before I read any more of the theories themselves I want the specification. The purpose of the theory is fixed in advance: it should be usable as a tool for classifying new sources of belief — remote-sensing instruments, brain–computer interfaces, institutional testimony, machine-generated reports — and for telling an agent whether a given deliverance is to be trusted and acted on, in a way that does not simply collapse into the claim that it is produced reliably.

  Here are the working characterizations I am starting from. Take them as stipulations of mine, not as exegesis: do not correct my Sanskrit, and rest nothing on any exact textual formulation. A pramāṇa is a source or mechanism which, when operative, produces a pramā — a cognition that is (i) true, (ii) of something not already cognized by that subject, and (iii) not subsequently defeated. The stock list has four members: perception, inference, identification of an unfamiliar thing by a remembered description, and verbal testimony. One influential critic holds that the list should collapse to two. Others want to add postulation from apparent conflict, and cognition of absence.

  Write me the desiderata: the requirements any adequate theory of the pramāṇas must meet, with the case or consideration behind each, and mark which are non-negotiable and which are local preferences of one research programme. Anchor the requirements in the following cases at minimum:

  - The remote prosthesis. A subject sits in a darkened room wearing a device that produces in her a state type-identical, by her own introspection and by every functional test we can run, to her ordinary visual experience of a busy intersection three kilometres away. The states are in fact reliably accurate about that intersection. There is no sense–object contact with it, and no inference she can reconstruct. Is this perception, a fifth pramāṇa, or no pramāṇa at all?
  - Rediscovery. A subject infers from smoke that there is fire on the hill, then forgets the conclusion and the episode entirely. Years later, by a different line of reasoning, she arrives at the true belief that there was fire on the hill at that time. The second occurrence is a new event; the content is not new to her history. Does the novelty condition attach to occurrences, to contents, or to both — and what exactly is lost by dropping it?
  - Purely negative competence. An organism's only reliable contact with its environment is a signal meaning that no predator is within range; it never identifies anything positive. Its deliverances are veridical, action-guiding and undefeated. Must a theory countenance a source whose content is exclusively negative, and if so is that a distinct pramāṇa or a special case of perception?
  - Gettierized testimony. A speaker sincerely asserts that p, understanding what she says; p is true; the hearer understands and believes. But the speaker's own ground is one of those cases where justified true belief falls short of knowledge: her evidence is misleading and p is true for unrelated reasons. Does the hearer acquire a pramā? A theory that treats testimony as basic and a theory that requires the speaker herself to have a pramā will diverge here.
  - The probabilistic instrument. A device is accurate seven times in ten and well calibrated; on a given occasion it issues a true reading, though the very same mechanism misfires on three near-identical occasions out of ten. Does it produce a pramā on that occasion? Say whether the theory needs a graded successor notion, and at what cost.
  - Corporate cognition. A laboratory concludes that a sample is contaminated. No individual member's perception, reasoning or testimony suffices; the reliability is a property of the institution's procedures. Is what results a property of a single subject, as the classical account has it, and if not, what becomes of the requirement that a pramāṇa be a mechanism operating on a subject?
  - Demarcation. Give identity and difference conditions for pramāṇas: what makes two deliverances instances of the same source, and what makes a source genuinely distinct? Is a satellite image interpreted by a computer model perception, inference, or testimony? If it is two of these at once, is confluence — one fact reached by several sources — permitted, or are the domains of the sources rigidly partitioned? State this as an explicit requirement and say why a theory needs it.
  - The regress of extrinsic validity. If a cognition's credentials are established by a further cognition whose credentials require yet another, the account needs a stopping point; several theories locate it in practical success. State this as a requirement, say what would count as satisfying it, and say whether the appeal to practice merely relocates the problem into a theory of action.

  Then separate three things.

  First: which of the requirements people standardly impose are genuine desiderata, and which are artifacts of one programme's metaphysics — for instance the demand that knowledge be a quality of a substantial self, that every pramāṇa exhibit a distinct instrument-and-result structure, or that the list be closed at some particular number.

  Second: which requirements cannot be jointly satisfied. Argue for one jointly unsatisfiable pair or triple; this is the part I most want. My own suspicion is that you cannot simultaneously have a source-by-source taxonomy with rigid domain partitioning, a reduction of the list to two items, and the demand that every historically recognized case be accommodated under its usual heading. If you disagree, name the pair that does break.

  Third: the single requirement that excludes the most candidate theories, and why.

  Finish with no more than one paragraph running the four-source list, the two-source reduction, and a contemporary reliabilist account of knowledge-sources against your list — just enough for me to see which requirement is doing the work. No bibliography, no citations, no textual exegesis, and no appeal to what the tradition holds beyond what you can state in your own terms.
reasoning: |-
  We are constructing a set of desiderata for a theory of pramāṇas that must serve as a tool for classifying novel belief sources and guiding trust and action, without collapsing into mere reliability. We anchor the requirements in the given cases. The requirements are divided into non-negotiable (core to the function of the theory) and negotiable (reflecting specific philosophical commitments). Then we address the three tasks: genuine desiderata vs. artifacts, jointly unsatisfiable requirements, and the most excluding requirement.

  **Desiderata:**

  1. **Truth Requirement (Non-negotiable):**  
     A pramāṇa must produce true cognitions (pramā). Without truth, the cognition cannot be trusted for action.  
     *Case Anchoring: All cases (e.g., Remote Prosthesis, Purely Negative Competence) require truth for the deliverance to count as pramā. The probabilistic instrument only sometimes produces truth, raising the issue of whether a single deliverance can be pramā when the source is unreliable overall.*

  2. **Novelty Condition (Negotiable):**  
     The cognition must be of something not already cognized by the subject. This is meant to exclude redundant cognitions. However, the exact nature of novelty (occurrence vs. content) is debatable.  
     *Case Anchoring: Rediscovery* shows that if novelty is tied to content, the second inference does not yield pramā. If tied to occurrence, it might. Dropping novelty entirely might allow redundant cognitions to count as pramā, which some argue is not the point of a pramāṇa.

  3. **Non-Defeat Condition (Non-negotiable):**  
     The cognition must not be subsequently defeated by evidence. This is necessary for the cognition to be action-guiding without reservation at the time it is held.  
     *Case Anchoring: All cases require non-defeat. For example, in Gettierized Testimony, if the hearer later discovers the speaker's evidence was flawed, the cognition might be defeated.*

  4. **Source Identifiability (Non-negotiable):**  
     The theory must allow us to identify the pramāṇa responsible for a given cognition. This is essential for classifying new sources and for the agent to understand why a cognition is trustworthy.  
     *Case Anchoring: Demarcation* requires identity conditions for pramāṇas. Without this, we cannot classify the remote prosthesis (perception? new source?) or the satellite image (inference? testimony?).

  5. **Distinctiveness of Sources (Negotiable):**  
     Pramāṇas should be distinct in their operation or domain. Some theories require rigid partitioning (no overlap in domains), while others allow confluence.  
     *Case Anchoring: Demarcation* explicitly raises this. The satellite image might be seen as a confluence of perception (via the satellite) and inference (via the model). A rigid partitioning might disallow confluence, but a theory without it might allow multiple sources for the same fact.

  6. **Subject-Centeredness (Negotiable):**  
     A pramāṇa must operate on a single subject, producing a cognition in that subject. This reflects the classical individualistic epistemology.  
     *Case Anchoring: Corporate Cognition* challenges this. If the laboratory's conclusion is a pramā, but no individual has it, then the theory must either reject subject-centeredness or find a way to attribute the cognition to a corporate subject.

  7. **Stopping the Regress (Non-negotiable):**  
     The account must provide a non-regressive foundation for the validity of cognitions. This is typically located in a source that is intrinsically valid or in practical success.  
     *Case Anchoring: The regress of extrinsic validity* requires a stopping point. If practical success is invoked, we must ensure it doesn't merely shift the regress to action (e.g., how do we know the action was successful?).

  8. **Action-Guidance (Non-negotiable):**  
     The theory must explain why a pramā is fit to guide action without further justification. This is central to the functional role of the theory.  
     *Case Anchoring: All cases, especially Purely Negative Competence and the Remote Prosthesis, involve deliverances that must guide action (e.g., acting as if no predator is near).*

  9. **Accommodation of Negative Content (Negotiable):**  
     The theory must decide whether purely negative cognitions (e.g., absence of a predator) can be produced by a pramāṇa. This might be a special case of perception or a distinct pramāṇa.  
     *Case Anchoring: Purely Negative Competence* forces this issue. If the theory requires positive content, this case fails; if not, it must specify how negatives are known.

  10. **Gradedness (Negotiable):**  
      The theory must decide whether it allows degrees of pramā (e.g., probabilistic) or only a binary notion. A graded notion might better handle unreliable sources but at the cost of complicating action-guidance (how much trust? what action threshold?).  
      *Case Anchoring: The Probabilistic Instrument*: If the instrument is only 70% reliable, is a true deliverance on one occasion a pramā? A binary theory might say no; a graded one might assign a degree of justification.

  11. **Speaker's State in Testimony (Negotiable):**  
      For testimony, must the speaker have a pramā? Or is the hearer's understanding and the speaker's sincerity sufficient?  
      *Case Anchoring: Gettierized Testimony*: If the speaker lacks a pramā (because her belief is Gettierized), does the hearer still get one? Theories diverge here.

  **Task 1: Genuine Desiderata vs. Artifacts**

  - **Genuine Desiderata:** Truth, Non-Defeat, Source Identifiability, Stopping the Regress, and Action-Guidance are non-negotiable and not tied to any specific metaphysics. They are required for any functional theory of knowledge sources.
    
  - **Artifacts of Programmes:** 
    - The demand that knowledge be a quality of a substantial self might be an artifact of a particular metaphysics (e.g., Nyāya). This could make Subject-Centeredness non-negotiable for them but negotiable in a broader theory (e.g., one that allows corporate subjects).
    - The requirement that every pramāṇa exhibit a distinct instrument-and-result structure (e.g., perception as having sense-object contact) might exclude the remote prosthesis unless we redefine the instrument. This is an artifact of classical definitions.
    - The demand that the list be closed at a particular number (e.g., two or four) is an artifact of reductionist or expansionist programmes. The theory should allow for new pramāṇas if they meet the core requirements.

  **Task 2: Jointly Unsatisfiable Requirements**

  The following three requirements cannot be simultaneously satisfied:

  - **Rigid Domain Partitioning (from Distinctiveness):** No two pramāṇas can yield cognition about the same fact (no confluence allowed).
  - **Reduction of the list to two items (e.g., perception and inference):** All other pramāṇas must be reduced to these two.
  - **Accommodation of historically recognized cases under their usual headings:** For example, testimony must be treated as a basic pramāṇa (not reduced to inference) and absence as a distinct kind.

  *Argument:* 
  - If we reduce the list to two (say, perception and inference), then testimony must be analyzed as a form of inference (e.g., inferring truth from the speaker's credibility). But then we violate rigid domain partitioning because the same fact (e.g., "there is fire on the hill") might be known by perception (if seen), inference (if inferred from smoke), or testimony (if told), which would be confluent. Rigid partitioning requires that each fact be knowable only by one pramāṇa. 
  - Moreover, if we insist on accommodating testimony as a distinct pramāṇa (its usual heading), we cannot reduce it to inference. But reduction to two requires that we do. 
  - Similarly, absence (from Purely Negative Competence) is traditionally claimed by some as a distinct pramāṇa (anupalabdhi). If we must accommodate it under that heading, we cannot reduce it to perception (e.g., "non-perception of a presence") without violating its usual heading. But if we reduce the list to two, we must reduce absence to one of them.

  Hence, these three are jointly unsatisfiable. Compromises: drop rigid partitioning (allow confluence), drop reductionism (allow more than two), or drop the accommodation of historical headings (reclassify testimony and absence).

  **Task 3: Most Excluding Requirement**

  The **Non-Defeat Condition** is the most excluding. It requires that a cognition, even if true and novel, must not be overturned by future evidence. This excludes theories that:

  - Define pramā solely in terms of truth and reliability (like some reliabilist accounts) because a reliable source might produce a true belief that is later defeated (e.g., by misleading evidence). 
  - It also excludes theories that do not account for the temporal aspect of defeat. For example, a theory that only checks the current evidence might not require that the cognition remain undefeated over time.

  Moreover, it is hard to operationalize because defeat can occur at any future time. Thus, any theory that does not have a mechanism for tracking defeat (e.g., a defeasibility condition) fails this requirement.

  **Running the Theories Against the Requirements**

  - **The four-source list (perception, inference, analogy, testimony):** 
    - Meets: Truth, Non-Defeat (if built in), Source Identifiability (four distinct sources), Stopping Regress (e.g., perception as foundational), Action-Guidance.
    - Fails: Distinctiveness with rigid partitioning (e.g., testimony and inference might overlap) and Subject-Centeredness (if corporate cognition arises). It might also struggle with Novelty (if occurrence vs. content is not resolved) and the new cases (e.g., remote prosthesis might not fit classical perception).

  - **Two-source reduction (e.g., perception and inference):** 
    - Meets: Reductionism, Stopping Regress (if perception is basic).
    - Fails: Accommodation of historical headings (e.g., testimony as basic) and rigid partitioning (if inference and perception can yield the same fact). Also fails to naturally accommodate purely negative cognition (unless perception includes absence) and corporate cognition.

  - **Contemporary reliabilism:** 
    - Meets: Truth (if reliability implies truth), Source Identifiability (via mechanisms), Action-Guidance (if reliable), and probabilistic cases (via degrees of reliability).
    - Fails: Non-Defeat Condition (reliabilism typically doesn't require indefeasibility), Novelty (not usually built in), and Stopping Regress (reliability might need further justification). Also, without a non-reliability condition, it collapses into reliability, which the theory must avoid.

  *The most excluding requirement is Non-Defeat: reliabilism fails it because a reliable process might yield a true belief that is Gettierized or later defeated. The four-source theory might build it in, but the two-source theory might not explicitly address defeat.*
answer: |-
  ### Desiderata for a Theory of Pramāṇas  
  The theory must classify novel belief sources (e.g., remote sensors, AI outputs) and guide trust/action without reducing to reliability. Requirements are anchored in your cases. **Non-negotiable** requirements (NN) are essential for the theory’s core function; **negotiable** ones (N) reflect specific programmatic biases.  

  1. **Truth-Aptness (NN)**  
     A pramāṇa must produce *true* cognitions (pramā). Without truth, action-guidance is unjustified.  
     *Case Anchor:* Remote Prosthesis—if the device is unreliable, its deliverances cannot be pramā, even if subjectively indistinguishable from perception. Probabilistic Instrument—truth on a single occasion is necessary but insufficient alone.  

  2. **Non-Redundancy (N)**  
     A pramā must cognize something *not already known* by the subject. Dropping this risks trivializing pramāṇas (e.g., relearning forgotten truths).  
     *Case Anchor:* Rediscovery—if novelty is tied to *content*, the second inference is not pramā; if tied to *occurrence*, it may be. Loss: Redundant cognitions (e.g., rereading a known fact) might inflate pramāṇas.  

  3. **Defeasibility Safety (NN)**  
     A pramā must be *not subsequently defeated*. Undefeated cognitions are action-ready; defeat undermines trust.  
     *Case Anchor:* Gettierized Testimony—if the hearer’s belief is later undermined, it fails. Purely Negative Competence—absence claims must remain undefeated to guide action (e.g., "no predator" must not be contradicted).  

  4. **Source Individuality (NN)**  
     Pramāṇas must be *identifiable and distinguishable* mechanisms. Needed to classify novel sources (e.g., is satellite imagery perception or inference?).  
     *Case Anchor:* Demarcation—without identity conditions (e.g., causal structure, cognitive process), remote prosthesis and corporate cognition cannot be categorized. Confluence (one fact via multiple sources) must be permitted or excluded explicitly.  

  5. **Subject-Relativity (N)**  
     A pramāṇa operates *on an individual subject*. Reflects classical epistemology; corporate cases challenge this.  
     *Case Anchor:* Corporate Cognition—if pramā must reside in a single mind, institutional outputs are excluded unless reduced to individual testimonies.  

  6. **Negative Content Admissibility (N)**  
     The theory must decide if *exclusively negative cognitions* (e.g., "no predator") qualify as pramā. Rejection risks excluding valid action-guiding states.  
     *Case Anchor:* Purely Negative Competence—if admitted, it may be perception (detecting absence) or a distinct pramāṇa (e.g., absence-cognition).  

  7. **Regress Termination (NN)**  
     The theory must *halt justificatory regress* (e.g., via intrinsic validity or practical success). Practical success must not relocate regress (e.g., "success" must be definable without infinite appeals).  
     *Case Anchor:* Regress of Extrinsic Validity—perception or practice as a stopper must not presuppose further validation (e.g., actions must have non-epistemic outcomes).  

  8. **Gradedness Tolerance (N)**  
     The theory must specify if pramā allows *degrees* (e.g., probabilistic justification). Binary pramā simplifies action but excludes unreliable sources.  
     *Case Anchor:* Probabilistic Instrument—if 70% reliable, a true deliverance may be "partial" pramā; rejecting gradedness excludes such sources entirely. Cost: Action-guidance becomes all-or-nothing.  

  9. **Testimonial Grounding (N)**  
     Testimony-based pramā may require the *speaker’s pramā* or just sincerity/understanding. Affects whether hearers inherit flaws.  
     *Case Anchor:* Gettierized Testimony—theories requiring speaker’s pramā deny the hearer a pramā; those treating testimony as basic may grant it.  

  ---

  ### Analysis of Requirements  
  **First: Genuine Desiderata vs. Artifacts**  
  - **Genuine Desiderata (NN):** Truth-Aptness, Defeasibility Safety, Source Individuality, Regress Termination. These ensure minimal functionality: classifying sources, blocking untrustworthy deliverances, and halting justification regress.  
  - **Artifacts (N):**  
    - *Subject-Relativity*: Reflects substance-based metaphysics (e.g., Nyāya’s "self"). Corporate cognition shows it is dispensable.  
    - *Instrument-Result Structure*: Demanding distinct causal mechanisms (e.g., sense-object contact) is an artifact of Nyāya realism; it excludes the remote prosthesis.  
    - *Fixed List Closure*: Insisting on 2, 4, or 6 pramāṇas is programmatic (e.g., Buddhist reductionism vs. Mīmāṃsā expansion). Novel sources (e.g., AI) require openness.  

  **Second: Jointly Unsatisfiable Requirements**  
  You cannot simultaneously satisfy:  
  - **Rigid Domain Partitioning** (from Source Individuality: no confluence; each fact is knowable only by one pramāṇa).  
  - **List Reduction to Two** (e.g., perception and inference).  
  - **Accommodation of Historical Cases** (e.g., testimony as basic, absence as perception or distinct).  

  ***Argument***:  
  - Rigid partitioning requires testimony and absence to have unique domains (e.g., testimony for unrepeatable events). Reduction to two forces testimony into inference (e.g., inferring truth from speaker reliability) and absence into perception. But accommodation requires testimony to be *sui generis* (not inference) and absence as irreducible (not perception). Contradiction: reduction violates historical headings, while accommodation violates partitioning if testimony and inference share domains (e.g., both can deliver "fire on hill"). *Compromise*: Drop rigid partitioning (allow confluence) or historical accommodation (reclassify testimony).  

  **Third: Most Excluding Requirement**  
  **Defeasibility Safety** excludes the most theories. It requires pramā to be *factive* (true) *and* immune to future defeat. This eliminates:  
  - Reliabilism (ignores defeasibility; a reliable process may produce Gettierized outputs).  
  - Buddhist phenomenalists (e.g., Dignāga), who prioritize cognitive impressions over truth.  
  - Testimony-based theories if they permit undefeated-but-lucky beliefs (e.g., Gettierized cases).  
  *Why*: Most theories address truth or justification, but not indefeasibility. Defeasibility ties pramā to dynamic evidence, complicating action-guidance (e.g., an "undefeated" cognition may be retroactively voided).  

  ---

  ### Theory Comparison Against Requirements  
  - **Four-Source List** (perception, inference, analogy, testimony):  
    Fails *Source Individuality* if domains overlap (e.g., testimony and inference both yield empirical facts). Fails *Gradedness Tolerance* (binary pramā excludes probabilistic instruments). Meets *Historical Accommodation* but struggles with *Defeasibility Safety* (no explicit defeat clause).  

  - **Two-Source Reduction** (e.g., perception and inference):  
    Fails *Accommodation* (testimony reduced to inference; absence to perception). Fails *Negative Content Admissibility* if absence is not perception. Meets *List Reduction* but violates *Rigid Partitioning* if inference subsumes multiple sources.  

  - **Contemporary Reliabilism** (knowledge via reliable processes):  
    Fails *Defeasibility Safety* (reliability ≠ indefeasibility; Gettier cases allowed). Fails *Non-Redundancy* (no novelty condition). Meets *Gradedness Tolerance* (probabilistic justification) but collapses into reliability, violating the core purpose.  

  **Key Excluder**: *Defeasibility Safety* is the strongest filter—reliabilism and some classical theories (e.g., simplistic testimony accounts) fail, as they lack indefeasibility.
