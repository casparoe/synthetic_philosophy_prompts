  - Transitivity (1) acts as the glue that makes the ladder argument work—without it, the contradiction might dissolve. But they explicitly want transitivity for decision-making coherence.
  - Localism (2) seems to be the silent enabler here—it allows the stepwise degradation by denying sharp thresholds, which is exactly what prevents them from blocking the slide to Z.

  *scratches head* The real killer is that their escape routes all have costs: 
