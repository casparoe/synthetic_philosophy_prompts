answer: |-
  Your frustration is palpable—and entirely justified. You've hit upon a profound ambiguity in confirmation theory that existing binary distinctions (prediction/accommodation, use/non-use) fail to capture. The cases you describe—where data hovers in the background, shaping intuitions, heuristics, and formal choices without explicit constraint—occupy a critical "epistemic penumbra." Here’s a structured breakdown:

  ### Core Concepts & Their Shortcomings
  1. **Prediction vs. Accommodation**:  
     - **Prediction**: Theory entails novel data unknown during construction (strong confirmation).  
     - **Accommodation**: Theory is built to fit known data (weak/no confirmation).  
     - **Shortcoming**: Your cases involve "known-but-not-explicitly-used" data—neither novel nor directly fitted.

  2. **Use/Non-Use Distinction**:  
     - **Use**: Data directly constrains parameters, axioms, or model structure.  
     - **Non-Use**: Data is ignored or unknown.  
     - **Shortcoming**: Ignores *indirect* influence (e.g., data shaping "which questions seem worth asking").

  3. **Bayesian "Old Evidence" Problem**:  
     - Workarounds (counterfactual priors, logical learning) assume data was either *wholly ignored* or *explicitly used*. They collapse when data operates as a background heuristic.

  ### The Gap: Heuristic Entanglement
  Your cases involve **Heuristic Entanglement**—where data’s influence is mediated by informal reasoning, affecting theory development without direct constraint. This operates through:  
  - **Selective Attention**: Prioritizing model variants likely to address a known regularity.  
  - **Relevance Suspicion**: Intuitively sensing data might matter, guiding formal choices.  
  - **Aesthetic/Strategic Bias**: Deeming a model "elegant" or "promising" because it *might* explain *X*.  

  ### Proposed Conceptual Framework: **Heuristic Contamination**
  I coin this term to define:  
  > **The degree to which background knowledge of data informally influences theory construction, thereby diminishing the confirmatory power of that data for the resulting theory.**

  #### Key Dimensions:
  1. **Awareness**: Did the theorist *know* the data?  
  2. **Salience**: How *cognitively present* was the data during development?  
  3. **Influence**: Did it *steer* choices (e.g., formalism selection, research direction)?  

  #### Boundary Cases:
  | Scenario                                  | Heuristic Contamination? | Why?                                                                 |
  |-------------------------------------------|--------------------------|----------------------------------------------------------------------|
  | **Community knows data; theorist unaware** | Low/None                 | No cognitive access → no influence.                                 |
  | **Theorist knows data, deliberately avoids it** | Moderate/High            | Avoidance requires active suppression; data still shapes goals.     |
  | **Data subconsciously influences intuition** | High                     | Indirect influence via cognitive bias.                              |
  | **"Suspected relevance" guides choices**   | High                     | Data actively filters formal options (e.g., Mercury anomaly in GR). |
  | **Data inspires theory but isn't fitted**  | Moderate                 | Motivates research but doesn't constrain structure.                 |

  ### Diagnosing Legitimacy: Where’s the Line?
  Confirmation is *legitimate* when the explanatory success is **surprising** given the theory’s construction process. Heuristic Contamination *reduces surprise*:  
  - **High Contamination**: Data "hovered" so prominently that success is expected → weak confirmation.  
  - **Low Contamination**: Data was inert background noise → success is surprising → strong confirmation.  

  **The Threshold**: When data transitions from *passive knowledge* to an *active heuristic* steering decisions. If the theorist’s choices (e.g., selecting a formalism) would likely differ *absent the data*, contamination is high.

  ### Philosophical Anchors
  1. **Lakatosian Heuristics** (Lakatos, 1970): Data can be part of a "positive heuristic" guiding research programs without direct fitting.  
  2. **Theory-Ladenness** (Hanson, Kuhn): Background knowledge shapes what counts as a "promising" model.  
  3. **McMullin’s "Retrospective Prediction"** (1992): Treating accommodation *as* prediction if data wasn’t a "guiding presupposition"—but this is vague about "guiding."  

  ### Why This Fits Your Cases
  - **Voting Model Example**: The theorist’s choice of formalism was heuristicly contaminated by the regularity. Success isn’t surprising—it was anticipated informally.  
  - **Mercury’s Orbit**: Einstein didn’t *use* the data (GR wasn’t fitted to it), but its salience was high. Contamination is borderline; confirmatory power remains debated.  

  ### Practical Carving Tool: The Counterfactual Test
  Ask: **"Would the theorist likely have pursued the same formal structure if the data didn’t exist?"**  
  - If *no* (e.g., the formalism was chosen *because* it might handle *X*), contamination is high → weak confirmation.  
  - If *yes* (e.g., the data was irrelevant to key choices), contamination is low → strong confirmation.  

  This framework accepts degrees, doesn’t rely on intention (e.g., "deliberate avoidance" may still be contaminated), and handles community knowledge by asking how the *field’s* priorities shaped the theorist’s choices. It shifts focus from *whether* data was known to *how* it infiltrated the heuristic scaffolding of theory-building.  

  ### Further Work
  You might formalize "contamination coefficients" for Bayesian updates, or explore sociological dimensions (e.g., how disciplinary folklore embeds data in collective heuristics). This is ripe for formal epistemology—your "stats person" side could model the gradient rigorously.
