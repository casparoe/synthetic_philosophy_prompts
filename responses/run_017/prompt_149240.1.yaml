  **Leaf Definitions & Examples:**  
  - **Leaf A: Mere instrument**  
    *Principal uses system as passive tool; no goal delegation.*  
    Examples: Spreadsheet macro (executes steps), calculator, non-adaptive autopilot (follows fixed commands).  
  - **Leaf B/C: Instrument with discretion over means / Delegated agent**  
    *System pursues delegated goal with means discretion, but cannot alter goal. Tree cannot separate B and C due to underspecified authority boundaries (see "Collapsed Leaves" below).*  
    Examples: Flight booking bot (chooses airlines/routes), trading system with loss limit (adjusts tactics), email drafter (composes content).  
  - **Leaf D: Fiduciary-style agent**  
    *System may modify delegated end to align with principal’s best interest.*  
    Examples: Legal AI overriding harmful client instructions, medical diagnosis agent ignoring incomplete user input.  
  - **Leaf E: Autonomous coordinator (no human principal)**  
    *System acts as principal for other systems/humans.*  
    Examples: Supply-chain optimizer allocating tasks to sub-agents, decentralized AI governance.  

  **Unoccupied Combinations:**  
  - **Delegated-end non-discretionary (Node 3→N)**: Unattractive (e.g., "scripted executor"). Why delegate an end if means are fully prescribed?  
  - **Fiduciary without delegated end (Node 2→N → Node 4)**: Incoherent (can’t modify an undelegated end).  

  **Collapsed Leaves (B/C):**  
  - **Instrument with discretion (B) vs. Delegated agent (C)** collapse under this tree. Real-world differentiation (e.g., "booking bot as tool" vs. "trader as agent") depends on *social framing* (e.g., accountability expectations) not system properties. Your axe is valid: B/C separation requires fixing contextual elements (e.g., "principal’s risk tolerance") outside the triple.  

  **Relativization Outcome:**  
  - All nodes are relativized; leaves stay clean except B/C.  
  - **Critical node**: Discretion over means (Node 3) *could* imply monadic agency—but only if divorced from task/principal (e.g., a "self-driving car" is a mere instrument for "entertainment demo" but a delegated agent for "commute"). Your triple view holds.  

  **Collapse of "Agent of Collective" and "Tool of Bureaucracy":**  
  - Both map to **Leaf E (autonomous coordinator)** if principal is non-human (e.g., collective’s AI overseer).  
  - If principal is human (e.g., bureaucracy’s CEO), they map elsewhere (e.g., Leaf D). This is a *feature* of relativization: collapse occurs when collective/bureaucracy is seen as a non-human actor.
