prompt: |-
  I'm writing a long-ish piece for a science-and-ideas magazine on why my phone can OCR a photographed paragraph in forty fonts and then completely falls over on a post-it from my aunt, and I've hit the same wall in every interview: the type designers tell me an 'a' is a shape plus a style, the vision people tell me there's no shape there at all and it's just a learned category, and the ML people tell me it's solved. Before I write the section where I try to say what would actually count as an answer, I want the spec from someone who'll think it through properly.

  So: write me the list of requirements that a theory has to meet to count as explaining what makes every 'a' an 'a'. Not a survey, not a history of ideas — the criteria. For each one, give me the concrete case or consideration that makes it a requirement (that's the part I'll be quoting). Then tell me which requirements are non-negotiable and which are just hobby-horses of one camp, flag any pair you think can't be jointly satisfied, and name the single requirement that knocks out the most candidate theories.

  Fix the purpose as this: the theory is meant to underwrite a system that has to do both directions — read a letter in a hand or a display face it has never seen, and generate the rest of an alphabet from a couple of samples of somebody's style. Adequacy relative to that, not relative to everything anyone might want.

  Here's my own scratch list of cases. Cut the ones that are bogus or that just smuggle in one camp's assumptions, and add the ones I'm missing:

  - A ransom note: letters clipped from six different fonts. You read it fine and you also instantly see that it's assembled from different sources. So identity has to be invariant to style while style is still perceived — the theory can't just throw style away.
  - An ornate script wedding invitation: I can read the whole line and cannot name a single letter in isolation.
  - Cyrillic 'а' and Latin 'a' can be pixel-identical and still be different letters (this is why phishing domains work). Shape seems to underdetermine identity entirely.
  - Greek alpha and Latin 'a' are near-identical in shape and share an ancestor, and are different letters.
  - Double-storey 'a' versus single-storey 'ɑ' are wildly different shapes and the same letter.
  - 'l', '1' and 'I' are the same strokes in a lot of faces, disambiguated only by neighbours.
  - Degradation: an 'a' with its bowl rubbed off, a 'c' with a chunk missing. The letter survives the loss of parts, so no single stroke can be essential.
  - Segmentation: cursive has no gaps at all. The theory has to say how the units get found before it says what they are.
  - One-shot extrapolation: I see one 'g' in a strange display face and can sketch a plausible 'q'. Where does that come from?
  - Kids and some patients swap 'b' and 'd'. Mirror images are systematically confusable, which seems to tell you something about how shape is being coded.
  - I can tell a typeface is corporate or friendly without being able to point to the letter that carries it.
  - Historical continuity: is the 'a' in a twelfth-century manuscript the same letter as the 'a' in this sentence, or just a causal descendant of it?
  - Gradedness: some 'a's are better 'a's than others. And the taxonomy questions — is 'á' an 'a'? is 'ª' an 'a'? is the IPA symbol 'ɑ' an 'a'? is turned 'ǝ' an 'e'?
  - Logotypes and display faces where a near-letter object stands in for a letter, and readers accept it without being able to say what licenses the substitution.
  - Cross-script transfer: knowing Greek makes Cyrillic easier; you can copy Korean shapes accurately with no idea what you're writing.

  I also want the distinctions spelled out: at minimum token (this mark on this page), glyph/allograph variant, letter as a type, and the writing system it belongs to — and a view on which of those levels the "essence" is supposed to live at. My suspicion is that most theories cheat by sliding between them.

  Two last things. Any desideratum that's really a prejudice of one approach (must be learned from one example, must be symbolic, must be a neural net, must explain our aesthetic response, must fit the clinical dissociations I keep being told about, must generalize to scripts it wasn't built for) — say so and demote it. And if some subset of the real desiderata is jointly unsatisfiable, that's the finding I most want to print, so make it explicit rather than quietly dropping one.

  One line each on how templates, structural or stroke-based descriptions, stroke-generative models in the Letter Spirit vein, and modern convnets do against the list — I don't need a literature review. And no citations or reading lists, I'll source those myself and my fact-checker will kill me if I get them wrong. A bulleted list is fine; I'll be lifting bits of it.
reasoning: |-
  Okay, the user is writing a magazine piece about why OCR systems struggle with handwritten notes like their aunt's post-it despite handling various fonts well. They've interviewed experts from different fields—type designers, vision scientists, ML researchers—each offering conflicting views. The user wants a set of requirements for a theory that explains what makes every 'a' an 'a', specifically for a system that can both recognize and generate letters in unseen styles. They provided a list of cases and want me to refine it into essential criteria, flag non-negotiables, conflicts, and show how different approaches perform.

  First, I need to understand their core question: what defines the identity of a letter across variations in style, script, and context? The purpose is practical—building a system for bidirectional tasks (reading unfamiliar handwriting and generating alphabets from samples). So the criteria must serve that goal, not philosophical debates.

  Looking at their scratch list, I'll trim redundant or biased cases. For example, "historical continuity" might be less critical for a practical system than segmentation or mirror confusion. Cases like Cyrillic vs. Latin 'a' highlight that shape alone isn't sufficient, which is crucial. Gradedness (some 'a's are better than others) is important for real-world robustness.  

  Key distinctions they mentioned—token, glyph, letter type, writing system—need clarity. The "essence" likely lives at the letter-type level within a writing system, but the theory must bridge to glyphs and context. Many theories cheat by conflating these levels.  

  Non-negotiable requirements:  
  - **Shape-style separation**: Ransom notes show style can vary while letter identity stays recognizable.  
  - **Context-dependence**: '1' vs. 'I' depends on neighbors; cursive requires segmentation.  
  - **Partial degradation tolerance**: An 'a' with a rubbed-off bowl is still readable.  
  - **Cross-script transfer**: Knowing Greek helps with Cyrillic, so the theory should allow leveraging similarities.  
  - **Generative capability**: From one 'g', sketch a 'q' in the same style.  

  Conflicts:  
  - **Invariance vs. discriminability**: Cyrillic 'а' and Latin 'a' can be identical but different letters—this demands sensitivity to writing system context, which might conflict with pure shape-based invariance.  
  - **Segmentation vs. holistic reading**: Cursive requires segmenting letters, but ornate scripts are read holistically without isolating letters. A theory must handle both, which is tricky.  

  The biggest challenge? **Contextual discriminability**—distinguishing identical shapes in different scripts (e.g., phishing domains). This knocks out many theories, like rigid templates or structural descriptions.  

  Hobby-horses to demote:  
  - Must be learned from one example (ML overfits).  
  - Must be symbolic (ignores statistical learning).  
  - Must explain aesthetics (irrelevant for OCR).  
  - Must fit all clinical dissociations (beyond scope).  

  Performance of existing approaches:  
  - **Templates**: Fail most requirements—too rigid for style variance, degradation, and context.  
  - **Structural descriptions**: Handle degradation and some style variance but struggle with cursive, holistic reading, and cross-script transfer.  
  - **Stroke-generative models**: Good for style extrapolation and generation but poor at holistic perception and context-dependence.  
  - **Convnets**: Excel at invariance and context but are black boxes, weak at segmentation and generation without retraining.  

  The user’s unspoken need: They want to expose why OCR fails for handwriting despite font success. The theory must address noise, context, and generative flexibility—where current ML falls short. Highlighting the conflict between invariance and discriminability explains phishing domains and aunt’s post-its.  

  Final list: Keep ransom note (style vs. identity), Cyrillic/Latin 'a' (discriminability), cursive (segmentation), degradation, one-shot generation, mirror confusion (systematic error), cross-script transfer. Cut historical continuity and logotypes—less critical for the system’s purpose.  

  The joint unsatisfiability: A theory can’t fully reconcile **holistic perception** (needing context) and **context-free identity** (for isolated glyphs). This tension is why aunt’s post-its stump OCR—they lack the contextual cues fonts provide.
answer: |-
  Here’s the distilled list of requirements for a theory of letter identity, tailored to your bidirectional system goal. Non-negotiables are starred (**★**), conflicts flagged (⚖), and hobby-horses annotated. Cases from your list are retained, pruned, or reframed to avoid camp bias.

  ---

  ### **Core Requirements & Concrete Cases**
  1.  **Shape-Style Separation** (**★**):  
      *Case*: Ransom notes (multiple fonts) are legible while styles remain perceptible.  
      *Why*: The theory must preserve style as a variable distinct from letter identity.  

  2.  **Context-Dependence** (**★**):  
      *Case*: ‘l’, ‘1’, ‘I’ require neighbor context for disambiguation; ornate scripts rely on word-level perception.  
      *Why*: Identity isn’t isolable—letters are often defined by systemic relationships.  

  3.  **Partial Degradation Tolerance** (**★**):  
      *Case*: An ‘a’ with a rubbed-off bowl is still recognized.  
      *Why*: No single stroke is essential; robustness to noise is mandatory.  

  4.  **Cross-Script Discriminability** (**★**):  
      *Case*: Identical shapes (Cyrillic ‘а’ vs. Latin ‘a’) must be distinguishable based on script context.  
      *Why*: Underdetermined shapes gain identity from the writing system (phishing domains exploit this).  

  5.  **Generative Extrapolation** (**★**):  
      *Case*: Sketching a ‘q’ after seeing one ‘g’ in a novel display face.  
      *Why*: Style must be captured parametrically, not memorized.  

  6.  **Segmentation-Free Holism**:  
      *Case*: Reading ornate cursive without isolating individual glyphs.  
      *Why*: Units can emerge top-down from word recognition, not bottom-up strokes.  

  7.  **Mirror Confusion Pattern**:  
      *Case*: Systematic ‘b’/‘d’ swaps in children/dyslexia.  
      *Why*: Reveals asymmetric processing—identity isn’t purely geometric.  

  8.  **Graded Membership & Taxonomy**:  
      *Case*: ‘á’ is clearly an ‘a’, ‘ª’ is marginal; double/single-storey ‘a’ are the same letter.  
      *Why*: Identity has fuzzy boundaries (diacritics, variants).  

  9.  **Cross-Script Transfer**:  
      *Case*: Knowing Greek accelerates Cyrillic learning.  
      *Why*: Theories should leverage structural analogies across scripts.  

  ---

  ### **Pruned Cases (Bias or Irrelevance)**
  -   *Historical continuity*: Ancestry ≠ synchronic identity (causal descent irrelevant to OCR).  
  -   *Corporate/friendly typefaces*: Aesthetic response isn’t required for recognition/generation.  
  -   *Logotypes*: Edge cases don’t generalize; risk of smuggling symbolic assumptions.  
  -   *Greek alpha vs. Latin ‘a’*: Redundant with Cyrillic/Latin case; adds no new constraint.  

  ---

  ### **Key Distinctions & "Essence" Level**
  - **Token**: Physical instance (e.g., ink on a post-it).  
  - **Glyph/Allograph**: Stylistic variant (e.g., single-storey ‘ɑ’).  
  - **Letter Type**: Abstract identity (‘a’ in Latin script).  
  - **Writing System**: Rule set binding letters (e.g., Cyrillic vs. Latin).  
  *The "essence" lives at the **Letter Type** level*, but must be *grounded* in glyph variability and *constrained* by the writing system.  

  ---

  ### **Non-Negotiables vs. Hobby-Horses**
  - **Non-Negotiables** (**★**): 1–5 (shape-style separation, context, degradation tolerance, discriminability, generation).  
  - **Hobby-Horses**:  
    - *"Must be learned from one example"* (ML camp; unrealistic for rare styles).  
    - *"Must be symbolic"* (type design camp; ignores statistical learning).  
    - *"Must explain clinical dissociations"* (vision camp; important but not core to the system goal).  
    - *"Must generalize to unseen scripts without data"* (overreach; transfer is sufficient).  

  ---

  ### **Conflicts & Dealbreakers**
  - ⚖ **Invariance-Discriminability Tension**:  
    Total shape invariance (for style robustness) clashes with script-sensitive discriminability (Cyrillic vs. Latin ‘a’). *Theories often sacrifice one*.  
  - ⚖ **Holism vs. Segmentation**:  
    Cursive requires segmentation; ornate scripts bypass it. *No theory elegantly does both*.  
  - **Single Biggest Dealbreaker**: **#4 (Cross-Script Discriminability)**. Most theories fail when identical shapes must map to different letters based on system context.  

  ---

  ### **Approach Performance (One-Line Assessments)**  
  - **Templates**: Fails 1,2,3,5,9. Too rigid for style variance, context, degradation, or generation.  
  - **Structural Descriptions**: Fails 2,4,6. Struggles with context, script ID, and holism; handles degradation (3) well.  
  - **Stroke-Generative Models**: Fails 2,4,6. Good at style (1) and generation (5), but weak on context and holism.  
  - **Convnets**: Fails 4,5,6. Excels at 1,2,3,9 but opaque; poor at discriminability, generation, and segmentation without retraining.  

  ---

  ### **The Unsatisfiable Core**  
  **No theory can fully reconcile #4 (script-specific discriminability) with #1 (style invariance) and #5 (generation)**. Shape underdetermines identity, yet generation relies on shape parameters. This tension explains OCR failures: your aunt’s post-it lacks the contextual cues (word neighbors, script rules) that fonts provide. The "essence" is relational—a letter is defined by its role in a system, not just form.
