prompt: |-
  So I've been reading about this thing people online call superrationality and arguing about it in comments sections, and I think I've backed myself into a corner I can't see out of. Here's roughly where I've landed:

  (1) In a one-shot prisoner's dilemma against someone I have good reason to think reasons more or less exactly the way I do — no communication, no repeat rounds, no reputation effects — I cooperate.

  (2) Against a stranger I have no reason to think reasons like me, I defect. The ordinary game-theory answer is basically right there, and the superrational reasoning just doesn't get a grip without some shared-reasoning link.

  (3) The way I justify (1) is purely evidential: my cooperating is evidence that my twin cooperates, in the same way one-boxing in Newcomb's problem is right. Nothing spooky, no causation running backwards.

  (4) But I won't pay in the counterfactual mugging. The coin has already landed, nothing I do now makes anybody better off, and handing over the money is just throwing it away.

  (5) I do think the reasoning changes the case for voting though. I vote, and not because my vote might swing the election, but because my voting is evidence about whether people like me vote.

  I cant tell which of these is load-bearing. Is (4) actually the odd one out, or does it follow fine once you accept (3)? Does my (2) quietly pull the rug out from under my (1)? Does (5) commit me to something (2) rules out, or is the size of the group doing real work there?

  Please be specific about which commitment has to go and what giving it up would cost me — and don't just tell me all five are in tension with each other, I can already do that myself. If a pair only looks like it clashes, say so and say why.
reasoning: |-
  Okay, let me try to figure out this user's superrationality dilemma. They've laid out five positions and are worried about inconsistencies. 

  First, I need to unpack each point carefully. Their position (1) about cooperating with a reasoning twin in Prisoner's Dilemma seems solidly based on evidential reasoning - similar to one-boxing in Newcomb. That's consistent with their stated justification in (3). 

  But then (2) introduces a cutoff: no cooperation with strangers. This feels like the tricky part. How does "knowing the other reasons like me" actually work? The user seems to think this is binary - either you know or you don't - but real life has degrees of similarity. Maybe the inconsistency starts here.

  Point (4) is where they refuse counterfactual mugging. Hmm... this actually seems consistent with their evidential framework. If the coin has already landed tails, paying doesn't provide evidence about anything - it's pure cost. So (4) might not be the problem.

  Now point (5) about voting is interesting. They're using evidence about "people like me" here too. But how is this different from the stranger in (2)? The key might be group size - in voting, even if I don't know any individual, I know statistically similar people exist. Whereas in Prisoner's Dilemma with a stranger, there's no "similar people" category, just one unknown opponent.

  The real tension seems between (2) and (5). In both cases I face someone unknown, but in voting I cooperate while in PD I defect. The user's "people like me" criterion works differently in group vs dyadic settings. For voting, "people like me" is a statistical category; for PD with a stranger, it's a specific individual whose reasoning I can't assess.

  Also noting their resistance to "all are in tension" answers. They want specific pressure points. The voting case actually helps expose the weakness in (2) - if we accept statistical similarity as sufficient for evidential links, maybe we should cooperate in PD with strangers too? But that would be counterintuitive...

  Perhaps the solution is to refine the similarity criterion: in PD we need high-confidence similarity because the stakes are immediate, while in voting the evidence is statistical and the cost/benefit different. But this feels a bit ad hoc. The user might need to either extend cooperation to statistical twins in PD (modifying 2) or accept that voting justification is weaker than they thought.

  The counterfactual mugging (4) still seems fine though - no evidential link there at all after the coin flip. So that's probably not the issue.
answer: |-
  Based on your commitments, the core tension lies between **(2)** and **(5)**, with **(2)** being the most vulnerable point. Let's break it down step-by-step:

  1.  **Your (1) and (3) are consistent and foundational:** Your justification for cooperating with a "reasoning twin" is purely evidential, mirroring one-boxing in Newcomb's. This is a coherent application of superrationality/UDT. Your action provides evidence about what your twin (who reasons identically) will do. Commitment (3) explains (1) perfectly.

  2.  **Your (4) is consistent with (3):** In Counterfactual Mugging, the coin has already landed tails. Your action *now* provides *no evidence whatsoever* about what Omega would have done in the counterfactual heads-world (which didn't happen). Paying is pure cost with no evidential benefit. Refusing is consistent with your evidential framework – there's simply no relevant evidence to leverage. Commitment (4) *does not* clash with (1) or (3).

  3.  **The problem is (2) vs. (5) - The "Shared-Reasoning Link" Threshold:**
      *   **(2)** states: Against a stranger with *no reason* to think they reason like you, you defect. The superrational link "doesn't get a grip."
      *   **(5)** states: You vote because your voting is evidence about whether "people like you" vote.
      *   **The Clash:** How do you define "people like me" for voting? Presumably, this isn't a specific, known reasoning twin. It's a *statistical* group – people sharing demographics, political views, values, or (crucially) *reasoning styles*. You likely have *some* reason to believe that *some* people out there reason similarly to you, but *not* certainty about any *specific* stranger you face in the voting booth (or the election). **Commitment (2) requires a very strong, specific "reasoning twin" link to trigger cooperation. Commitment (5) triggers cooperation based on a much weaker, statistical "people like me" evidential link.**

  4.  **Why (2) is the Load-Bearing Wall That Needs Adjustment:**
      *   **The Cost of Sticking with (2):** If you strictly require knowing a *specific* opponent reasons *exactly* like you (your "twin" standard) to apply evidential reasoning, then commitment (5) becomes unjustifiable. Your vote provides evidence about "people like you," but not about any *specific* decisive voter. A strict interpretation of (2) would force you to defect in voting too – seeing it as a large-scale PD where your individual action has negligible causal impact, and lacking a *specific* reasoning twin link.
      *   **The Cost of Modifying (2):** You need to relax the requirement for a *specific, known* reasoning twin and accept that evidential reasoning can apply based on a *statistical belief in similar reasoners*. Instead of "no reason to think they reason like me," you need "sufficient reason to believe a relevant reference class reasons similarly to me."
      *   **Why Modification Solves the Tension:**
          *   **Prisoner's Dilemma (Stranger):** If you have even a *moderate belief* that your *specific opponent* belongs to a reference class (e.g., "people who read about superrationality online") that *tends* to reason like you, the evidential link *can* get a grip. Cooperation becomes rational if your belief in shared reasoning is strong enough (though likely weaker than the twin case). Defection remains rational only if you have *truly* no basis to believe your opponent reasons similarly.
          *   **Voting:** This modification *justifies* (5). Your action (voting) provides evidence about the actions of the statistical group "people like me." If "people like me" are sufficiently numerous and likely to be pivotal *as a group*, then your evidence about their behavior (via your own action) becomes significant. You don't need a specific twin; you need a sufficiently large and relevant statistical reference class sharing your reasoning tendencies.
          *   **Twin Case:** The "twin" is just the limiting case where your belief that your opponent reasons identically is 100%, and the reference class size is 1. It's a special case within the broader statistical framework.

  **Conclusion & Recommendation:**

  *   **The Core Inconsistency:** Commitment **(2)** (defection against strangers with *no* shared-reasoning link) is incompatible with commitment **(5)** (voting based on evidence about statistical "people like me"), given how "people like me" is realistically defined for voting.
  *   **Which Commitment to Change:** You should modify **commitment (2)**.
  *   **How to Modify (2):** Replace "no reason to think reasons like me" with a weaker threshold: "insufficient reason to believe this opponent belongs to a relevant reference class likely to share my reasoning tendencies in this situation."
  *   **The Cost/Consequence:** This weakens the clear-cut "defect against strangers" rule. Defection against a true stranger (e.g., a randomly selected person with *zero* information) might still be justified. However, against a stranger where you have *some* basis to think they *might* share your reasoning framework (e.g., context, demographics, shared community), cooperation *could* become rational under evidential reasoning, depending on the strength of that belief. This makes the PD decision against strangers less absolute and more context-dependent.
  *   **Why the Others Hold:** (1), (3), and (4) remain perfectly consistent under this modified framework. (5) is now justified by applying evidential reasoning to a large statistical reference class ("people like me") where your action provides evidence about the group's behavior, making your vote matter evidentially even if not causally.

  **In short: Your "reasoning twin" requirement in (2) is too strict for the statistical evidence you rely on in (5). Relaxing (2) to allow evidential reasoning based on probabilistic beliefs about shared reasoning within a reference class resolves the tension with (5) while preserving the logic of (1), (3), and (4).**
