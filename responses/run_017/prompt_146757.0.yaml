    - answers: an object mapping each allowed answer (like "yes", "no", or multiple choice) to the next node id or a leaf id.
    - axis: one of "state-doubt", "subject-doubt", or "both".
  - Leaves (end positions) have:
    - id: unique identifier (e.g., "L1", "L2", ...)
    - position_name: the name of the position (or "unnamed" for unoccupied leaves)
