  What really interests me is their working hypothesis - that the core disagreement isn't about mind's location but about what "cognitive" means theoretically. That's sharp. They then propose a substitutional symmetry condition as a test, but worry both sides could co-opt it. Their four diagnostic questions reveal sophisticated meta-philosophical awareness.

