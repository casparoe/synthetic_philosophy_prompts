  I think their instinct is right - it's about what "cognitive" is for. Is it a scientific kind or a functional role? That's why the debate feels frozen. Each side's demands (mark of the cognitive vs explanatory fruitfulness) presuppose different conceptions of what cognition is. No neutral ground.

  The symmetry criterion helps though! By making coupling profiles testable, it shifts from intuition-pumping to measurable predictions. If real external tools (say, AR glasses with cognitive profiles mirroring visual cortex) showed identical breakdown patterns under stress, that pressures the cognitive kind view. Still, hardcore internalists could retreat to implementation details.

  Progress might come from cognitive archaeology or human-computer interaction studies showing external resources developing cognitive-system properties over time. Or neuroimaging revealing identical task-solving signatures whether using internal/external memory. But the philosophical impasse needs reframing: instead of "is it cognitive?", ask "under what conditions do integrated systems exhibit cognitive-kind properties?"

  The user's frustration is justified - it's a paradigm clash. Their symmetry move is valuable not as a solution but as a way to expose the empirical hinges beneath the conceptual dispute. That's real progress: turning a boundary war into testable questions about integration depth and systemic properties.
answer: |-
  Your diagnosis is profoundly insightful, and the standoff you describe is fundamentally a **clash of scientific ontologies**—a disagreement about what kinds of entities and processes a theory of cognition ought to recognize. Here’s a structured analysis:

  ### The Core Standoff: Explanatory Kinds vs. Functional Roles  
  1. **"Cognitive" as a Natural/Explanatory Kind** (Adams & Aizawa, Rupert):  
     - Cognition requires a *proprietary mark* (e.g., non-derived content, intrinsic dynamics).  
     - Theories need *causal-explanatory depth*: kinds must support counterfactual-supporting generalizations (e.g., "neural fatigue disrupts recall" but "battery drain disrupts retrieval" is merely artifact failure).  
     - **Critique of Parity**: Functional equivalence ≠ constitutive equivalence. Causal coupling doesn’t grant ontological status.  

  2. **"Cognitive" as a Functional Role** (Clark & Chalmers, Sutton):  
     - Cognition is defined by its *causal-functional profile* in guiding behavior.  
     - Explanatory power comes from tracking *system-level dynamics* (e.g., how notebook + brain solve problems holistically).  
     - **Critique of Marks**: Demanding a "neural-only" mark is biochauvinism. Science should cut nature at its *joints of process*, not substrate.  

  ### Why Your Symmetry Condition Doesn’t Resolve the Impasse  
  - **Proponent’s Absorption**: "Symmetry confirms functional parity! If an external component *behaves* like a cognitive part under all manipulations, it *is* cognitive. Explanatory fruitfulness wins."  
  - **Critic’s Absorption**: "Symmetry only shows causal isomorphism. Without a mark, you’ve conflated *participation in* cognition with *being* cognition. A pacemaker isn’t part of my circulatory system just because its failures mirror heart failures."  

  ### The Standoff is **Metatheoretical**, Not Empirical or Verbal  
  - **Not verbal**: Both sides agree on descriptions (e.g., "Otto uses his notebook like Inga uses memory"). They disagree on *what licenses cognitive status*.  
  - **Not empirical**: Evidence (e.g., manipulation profiles) is interpreted through opposed ontological lenses.  
  - **It’s a clash of epistemic values**:  
    - **Internalists** prioritize *mechanistic specificity* (cognition must have a "hard core" to explain breakdowns).  
    - **Extendedists** prioritize *explanatory scope* (cognition is wherever problem-solving loops close, regardless of implementation).  

  ### Why Progress Feels Impossible  
  1. **No Neutral Ground**:  
     - Internalists demand a mark *before* granting cognitive status; extendedists reject marks as question-begging.  
     - Your symmetry condition is rejected by critics *because* it lacks a mark.  

  2. **Intuition Pumps ≠ Data**:  
     - The notebook case is a boundary dispute proxy. Real-world cases (e.g., smartphones, neural implants) are interpreted through precommitments.  

  3. **Explanatory Aims Diverge**:  
     - Cognitive neuroscience seeks *mechanisms*; situated cognition seeks *distributed problem-solving patterns*.  

  ### Pathways to Progress  
  Progress requires shifting the debate’s framing. Your symmetry condition points the way:  

  1. **From "Is it cognitive?" to "What work does 'cognitive' do here?"**  
     - Admit *pluralism*: "Cognition" may serve distinct roles in different explanatory contexts (neural mechanisms vs. human-technology systems).  
     - *Example*: In human-computer interaction, "extended" may be the best frame; in neuropathology, "intracranial" may be essential.  

  2. **Test Integration Depth, Not "Mindhood"**  
     - Your symmetry condition becomes a *heuristic for cognitive integration*:  
       - **Strong integration**: External resource shows *systemic interdependency* (e.g., identical error profiles, bidirectional adjustment).  
       - **Weak coupling**: External resource is a tool (e.g., breaks down differently than biological memory).  
     - **Empirical pivot**: Design experiments probing breakdown symmetry (e.g., stress-induced errors in biological vs. augmented memory). If external resources exhibit *cognitive-like fragility*, it pressures internalists.  

  3. **Focus on Dynamics, Not Boundaries**  
     - Study *how* systems (biological + artifactual) self-organize to solve tasks (e.g., predictive processing across brain + tool).  
     - *Example*: Does a chess player + AI exhibit the same decision-making "style" under time pressure as a grandmaster?  

  4. **Accept a Graded Ontology**  
     - Reject binary "cognitive/non-cognitive." Admit degrees of cognitive integration (e.g., a well-worn notebook used automatically vs. a rarely consulted one).  

  ### Conclusion: Diagnosis & Path Forward  
  - **Diagnosis**: The dispute is a **non-convergent paradigm clash** about the ontology of cognition. Each side values different theoretical virtues (mechanistic purity vs. explanatory breadth).  
  - **Progress Requires**:  
    - **Reframing**: Stop asking "Is X cognitive?" Ask: "Under what conditions does X become *integrated* into cognitive processes?"  
    - **Your Symmetry Condition** is valuable not as a criterion for "true cognition," but as a **test for deep functional integration**.  
    - **Empirical Leverage**: Use it to design studies comparing neural vs. augmented systems under perturbation (e.g., TMS on brain vs. glitches in neural implants).  
    - **Embrace Pragmatism**: "Cognitive" is a context-dependent explanatory tool—not a cosmic category.  

  The frozen debate thaws when we stop policing boundaries and start modeling how *variably assembled systems* achieve cognitive goals. Your hypothesis not only survives—it illuminates the escape route.
