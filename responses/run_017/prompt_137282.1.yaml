answer: |-
  ### Candidate Mechanisms Considered and Rejected
  1. **Lever: Exploiting a pre-existing false belief.**  
     *Why rejected:* Violates minimal-pair constraint (2). If Route B relies on the hearer already holding a false belief to make the implicature work, Route A (direct lie) would not require this, creating an asymmetry in the hearer's cognitive starting point.

  2. **Lever: Truth fragmentation (e.g., asserting disjoint truths that jointly imply q).**  
     *Why rejected:* Risks collateral consequences (constraint 2). If Route B requires multiple true assertions to implicate q, it may create more beliefs or effort than Route A, altering the downstream epistemic burden.

  3. **Lever: Semantic ambiguity (e.g., using a word with multiple meanings).**  
     *Why rejected:* Violates hearer reasonableness (constraint 3). An ordinary hearer might not reliably draw the implicature, or Route A could become misleading if the lie exploits ambiguity.

  ### The Case: Workplace Deadline Inquiry
  **False Proposition q:** The project deadline has not been extended.  
  **Held Fixed:** Same manager (speaker), same employee (hearer), same professional relationship with norms of transparency, same false belief q leading the employee to work late (missing a family event), and identical consequences (unnecessary overtime with no project impact).

  #### Route A: The Lie  
  The employee asks the manager, "Has the deadline been extended?" The manager, knowing the deadline was extended yesterday, asserts, "No, the deadline has not been extended." The employee believes q and works late.  
  - **Asserted content:** "The deadline has not been extended."  
  - **Why lie:** q is directly asserted, and the manager believes this is false.

  #### Route B: Mere Misleading  
  The employee asks the manager, "Has the deadline been extended?" The manager, knowing the deadline was extended yesterday, asserts, "The client expects the report by the original deadline." This is true, as the client always prefers timely delivery but accepts extensions. The employee infers q (deadline not extended) due to relevance implicature: if extended, the manager would have said so. The employee believes q and works late.  
  - **Asserted content:** "The client expects the report by the original deadline."  
  - **Why misleading:** q is implicated (not said) via conversational implicature (relevance); all asserted content is true.

  ### Why Route B is Morally Worse
  **Working Feature:** "Epistemic entanglement."  
  In Route B, the true assertion ("The client expects the report by the original deadline") is not just a neutral truth but is structured by the speaker as direct evidence for q. When q is exposed as false, the hearer must re-audit this true belief—now suspect—and its role in supporting q. Route A's lie isolates the falsehood; when discovered, only q is discarded, preserving other beliefs.

  **Generating Principle:**  
  It is pro tanto worse to deceive by implicature when the speaker uses a true assertion as corroborative evidence for the false belief, as this poisons the hearer's epistemic landscape, forcing costly re-evaluation of otherwise reliable truths. Route B does this; Route A does not.

  **Tests:**  
  - **Removal:** Neutralize entanglement by altering Route B so the true assertion is irrelevant to q (e.g., manager says, "The office closes at 6 PM"). Now, q is not implicated, so the pair collapses. With entanglement present, verdicts diverge; without it, they converge (both equally wrong or neither deceptive).  
  - **Transplant:** Move entanglement to Route A by having the lie include supporting evidence (e.g., "No, and the client expects it by then"). But this adds an assertion, violating minimal-pair constraint 2 (Route A now involves more content). Entanglement cannot transplant cleanly because lying (Route A) inherently asserts q directly, while misleading (Route B) leverages inference from a true premise.

  **Verdicts:**  
  | Dimension                 | Route A Verdict    | Route B Verdict     | Reversal (B worse than A?) |  
  |---------------------------|-------------------|--------------------|----------------------------|  
  | Pro tanto wrongness       | Wrong             | More wrong         | True                       |  
  | Blameworthiness of agent  | Blameworthy       | More blameworthy   | True                       |  
  | Hearer wronged (vs. harmed) | Wronged         | More deeply wronged | True                     |  

  **Objections:**  
  - **Asymmetry defender:** "You smuggled in a difference—Route B breaches a duty of clarity by omitting the extension, while Route A breaches truthfulness, so it’s not the lying/misleading distinction doing the work."  
    *Reply:* The duty of clarity is not independent; it arises from the speaker’s intentional use of truth as evidence for q. The moral difference stems from how the deception corrupts belief, not an orthogonal norm.  
  - **No-difference skeptic:** "Both achieve identical outcomes; the distinction is morally irrelevant. Your 'entanglement' is just psychological harm, not intrinsic wrongness."  
    *Reply:* The pair hands them nothing—it shows that the *manner* of deception intrinsically alters the epistemic violation, making Route B worse even with identical outcomes. They must deny entanglement’s moral significance, but this is ad hoc.  

  **Failure Report:**  
  Specification met. No constraints violated: setting (workplace) is realistic; pair is minimal (same q, consequences, no added harms/norms); hearer is reasonable (implicature in B is natural); speaker intends q; Route A is lying (direct false assertion); Route B is misleading (true assertion + implicature); avoided forbidden rationales (entanglement is about post-deception epistemic cost, not deniability/effort/conscience/conscription).  

  **Bottom Line:**  
  The pair shows that the lying/misleading distinction does not mark a fixed moral boundary; in cases of epistemic entanglement, mere misleading can be pro tanto worse by amplifying the violation of the hearer’s epistemic trust.

