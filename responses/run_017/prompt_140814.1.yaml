prompt: |-
  Hey — I'm the token physics person in a philosophy of physics reading group (everyone else is philosophy, and they keep using words like "nomic" without flinching), and last week we did laws of nature and I came out of it realizing I have a pile of really confident gut reactions that I suspect don't add up to anything coherent. I'm not asking for a reading list, I've had enough of those; I want someone to actually try to extract the principle.

  Here's where I land, case by case. (1) A universe with exactly one particle in it, coasting in a straight line forever: I want to say there IS a law there — inertial motion — even though there's a single instance and nothing else in the universe for it to interact with. I resist "it's just what happened." (2) A world that is nothing but a billion coin flips, half heads, with no pattern in the sequence at all: I want to say there's an objective chance of a half there, that that's the law, and that the exact sequence isn't law-governed in the slightest — and I'm weirdly comfortable saying the chance is a half even though, as far as I can tell, nothing in the total history of the world settles it. (3) "All gold spheres are less than a mile across": exceptionless, short to state, and not a law. What's more, I don't think it fails because it isn't simple enough — it feels like the wrong *kind* of thing. (4) A world just like ours except that in 2031 energy fails to be conserved once, visibly, and then everything goes back to normal: I say conservation was a genuine law before and after, and that "conserved except in 2031" is not a law. So a law can have exceptions, but you can't stitch the exception into the law. (5) A world whose entire history is a perfect palindrome — same sequence of states forward and backward about the midpoint. "The history reads the same in both directions" is one sentence that, given the first half, pins down every detail of the second half; that's about as much strength for as little simplicity as you could ask for, which I gather is exactly what the best-system account (simplicity, strength, fit, as I understand it) rewards. My verdict: not a law, gigantic coincidence. (6) Our own universe starts in a freakishly special low-entropy macrocondition and then runs on simple dynamical rules: I can't shake the feeling that this starting condition is law-ish, something that belongs in the book of laws rather than being a brute fact we're just handed — and I have no idea why I feel that, given how I answered (5). (7) The specific numbers — the fine-structure constant, the particle masses — those feel brute and contingent, not laws; and yet I also want to say two universes could match perfectly in every particular matter of fact and still disagree about the laws, which as I understand it is exactly what the Humean denial of necessary connections in nature is supposed to rule out.

  The only principle I've managed to articulate is what I've started calling the briefing test: L is a law iff (i) no complete description of the non-nomic facts of any single region entails L, and (ii) L together with such a description of one region would let an ideal predictor derive the non-nomic facts of other regions — laws are just whatever you have to be *told* to get from here to there. I notice it probably overgenerates badly (it wants to call the palindrome a law, and the initial condition, and maybe the constants), so I'm guessing it needs repair rather than defense. Can you do better? I'd like one principle, or at most two or three candidates, stated precisely enough that I can test it: which of my cases motivates which clause, what it says about the cases I haven't listed — a law with exactly one instance ever (one particle decay in the whole history), a law that only operated during the first second and never again, and the update rule of a cellular automaton like Life, which everyone in the room agreed is a law "of" that world and which makes me suspect my reaction is just "it's the rule somebody wrote down," which for us collapses into theology — and, most importantly, an honest list of which of my verdicts it can't save and which one I should probably give up. And please tell me straight if the honest answer is that there's no single package here and I have to be a Humean about some of these and not about others. Under 900 words if you can, but don't gut anything to fit.
reasoning: |-
  Okay, let me tackle this user's query. They're a physics person in a philosophy group, struggling to reconcile their intuitions about laws of nature across different scenarios. They listed seven cases where their gut reactions conflict, and proposed a "briefing test" that they admit has issues. 

  First, I need to understand each case. In (1), they think inertial motion in a single-particle universe is a law, not just "what happened." (2) for random coin flips, they believe in objective chance despite no pattern. (3) rejects the gold sphere generalization as non-lawlike even though it's simple. (4) allows exceptions in laws but rejects patched laws. (5) denies palindromic symmetry as law despite its simplicity-strength combo. (6) feels the low-entropy start is law-ish despite opposing (5). (7) sees constants as contingent but also thinks laws transcend facts.

  Their briefing test has two parts: laws can't be deduced from local facts (non-supervenience), and must enable prediction across regions (projectibility). But it fails cases like (5) and (6). 

  The core tension seems to be between Humean and non-Humean views. Humeans say laws supervene on total facts; non-Humeans see laws as foundational. The user's intuitions swing both ways: anti-Humean in (1)-(2), Humean in (3)-(5), then back to anti-Humean in (6). Case (7) especially highlights this—wanting laws to be both contingent and non-supervenient is logically impossible. 

  I consider refining their test but realize it won't capture all cases. Instead, I should identify the underlying conflict: laws as descriptive summaries vs. prescriptive governors. Their briefing test leans prescriptive but gets messy with palindromes or initial conditions. 

  For cellular automata like Life, everyone agrees the update rule is lawlike—it's prescriptive by design. But real-world laws don't have designers, so the user's discomfort makes sense. Case (6)'s low-entropy start might feel law-ish because without it, the dynamical laws wouldn't produce time-asymmetric phenomena like consciousness. 

  Ultimately, I conclude there's no perfect single principle. They need to either: (A) accept Humeanism for all cases (sacrificing intuitions in 1,2,6), (B) go fully anti-Humean (sacrificing 3,4,5), or (C) adopt a hybrid view where some laws govern while others summarize. Option C seems closest to their instincts, with the briefing test capturing the governing part. They'd keep most verdicts except possibly adjusting (5) and (7). 

  I should emphasize that case (7) forces a choice: either laws supervene (Humean) or they don't (non-Humean). No middle ground. Their briefing test's failure in (5) and (6) suggests it's the wrong tool for symmetric or initial-condition cases. 

  The cellular automaton example is telling—it satisfies the briefing test perfectly because it's computational. But real physics isn't code. That might be why their test feels theological; it implies a cosmic programmer. 

  In the end, I'll map their conflicts to core philosophical divides and suggest embracing the tension. Their instincts aren't wrong—they're highlighting why the debate persists. I'll recommend option C as the best fit, with clarity on trade-offs.
answer: |-
  Here's a sharpened principle designed to capture your core intuitions while diagnosing the tensions, followed by an honest assessment of its fit and limitations. Let's call it the **Fundamental Governance Principle (FGP)**:

  **L is a law iff:**
  1.  **Non-Supervenience:** L is not metaphysically necessitated by the total history of particular non-nomic facts in any individual possible world where it holds. (L is "more than just the pattern".)
  2.  **Projective Power:** L governs *how* particular non-nomic facts at one spatiotemporal region constrain or determine (or probabilistically constrain) non-nomic facts at *other* spatiotemporal regions. (L tells you "how things unfold" *from* here *to* there.)
  3.  **Non-Ad Hocness:** L lacks explicit reference to specific contingent individuals, locations, times, or finite sets thereof in its fundamental formulation. (L is "general" in the right way.)

  **How FGP Handles Your Cases & Motivates Clauses:**

  1.  **Single Particle:** ✅ Law (Inertial Motion).
      *   *Why:* Governs *how* the particle *moves* from one time/place to another (Clause 2). Doesn't supervene on its single trajectory alone - it constrains *any* trajectory it *could* have (Clause 1). General (no specific times/places) (Clause 3).
  2.  **Random Coin Flips:** ✅ Law (Chance = 1/2).
      *   *Why:* Governs the *constraint* each flip operates under relative to the others (Clause 2). Doesn't supervene on the specific sequence (Clause 1). General (Clause 3).
  3.  **Gold Spheres:** ❌ Not a Law.
      *   *Why:* Fails Clause 1? Maybe (supervenes on atomic facts). Fails Clause 2? Definitely - it doesn't govern *how* things unfold dynamically; it's just a static summary. Fails Clause 3? Crucially - it's implicitly *ad hoc* to gold spheres (a specific kind) and Earth/cosmic scales (a specific size), even if not stated explicitly.
  4.  **Conservation w/ Exception:** ✅ Conservation *was* a law. "Conserved except in 2031" ❌ Not a law.
      *   *Why:* "Conserved except in 2031" fails Clause 3 (explicit reference to a specific time). Conservation itself meets all clauses before/after.
  5.  **Palindromic Universe:** ❌ Not a Law.
      *   *Why:* "History is palindromic" *fails Clause 2*. It doesn't govern *how* states dynamically determine *future* states. It's a static constraint on the *entire* timeline, logically equivalent to listing all states. It supervenes entirely on the total history (violates Clause 1). It's arguably *ad hoc* to the specific midpoint time (Clause 3).
  6.  **Low-Entropy Start:** **Tension** (Your verdict: Law-ish? FGP: ❌ Not a Law).
      *   *Why:* Fails Clause 1 - it supervenes on a specific contingent fact (the initial macrostate). Fails Clause 2 - it doesn't govern *how* states dynamically evolve *from* one time *to* another; it's a specific *starting condition*. Fails Clause 3 - it's implicitly *ad hoc* to "the beginning of time". Your intuition highlights the *explanatory burden* the initial condition carries, making it *feel* law-like. FGP distinguishes governing dynamics from boundary conditions.
  7.  **Constants (Contingent but Non-Supervenient?):** **Fatal Tension**. FGP forces a choice.
      *   *Why:* Clause 1 (Non-Supervenience) is incompatible with Humeanism. Humeans *must* say constants supervene on the total mosaic (they *are* part of the particular facts). FGP Clause 1 says laws *don't* supervene. If constants are law-like (governing), FGP says they *can't* supervene. If they are contingent but non-supervenient, they fit FGP as fundamental governing parameters. Your intuition that universes could match facts but differ on constants *requires* non-supervenience (anti-Humeanism).

  **Testing FGP on Your Additional Cases:**

  *   **One Instance Law (Single Decay):** ✅ Law (if fundamental). *Why:* Governs *how* that decay *happened* (Clause 2). Doesn't supervene *just* on that event (e.g., it implies potential decay rates for other particles, even if none exist) (Clause 1). General (no specific particle/time) (Clause 3).
  *   **Temporary Law (First Second Only):** ❌ Not a Law. *Why:* Fails Clause 3 (explicitly time-limited). Fails Clause 2? - governs dynamics but only within a limited domain defined by a specific time. Feels like a derived or conditional rule, not fundamental governance.
  *   **CA Update Rule (e.g., Life):** ✅ Law. *Why:* Governs *how* the state *evolves* from one step to the next (Clause 2). Doesn't supervene on the specific pattern (Clause 1). General (applies to all cells at all times) (Clause 3).

  **Honest Assessment & What to Give Up:**

  *   **FGP Saves:** (1), (2), (3), (4), (5), (One Instance), (CA Rule). It explains *why* you reject the palindrome and patched laws.
  *   **FGP Forces Choices:**
      *   **(6) Low-Entropy Start:** FGP says ❌ Not a law (it's a boundary condition). Your feeling it's "law-ish" stems from its unique *explanatory* role. To save this, you'd need to weaken FGP significantly (e.g., drop Non-Supervenience or Non-Ad Hocness), sacrificing its ability to handle (3), (5), and likely (4).
      *   **(7) Constants & Non-Supervenience:** FGP demands non-supervenience for fundamental laws/constants (anti-Humeanism). To be Humean, you *must* give up the idea that universes identical in all particular facts could differ *only* in laws/constants. This is the core Humean commitment. FGP aligns with your *resistance* to Humeanism in (1), (2), and (7).
  *   **FGP Struggles With (Implied):** **Why is the initial condition *so* special?** FGP doesn't explain *why* a low-entropy start feels different from a palindromic constraint. The difference is pragmatic/explanatory: the low-entropy start + dynamics *explains* time-asymmetric phenomena (memory, records, causation, consciousness) in a way the palindrome constraint doesn't. FGP is metaphysical, not explanatory.

  **Conclusion:**

  Your "briefing test" captured Projective Power (Clause 2) and Non-Supervenience (Clause 1), but missed Non-Ad Hocness (Clause 3), causing it to overgenerate (palindrome, initial condition). **FGP provides a coherent, principled package capturing most of your strong intuitions.** However, it forces you to:

  1.  **Reject the low-entropy start as a fundamental law** (it's a special initial condition). You might need to accept this or weaken FGP.
  2.  **Embrace anti-Humeanism** (laws/constants do *not* supervene on the total mosaic of particular facts). This is necessary to save your intuitions in (1), (2), and (7). Humeanism is incompatible with those intuitions and FGP.
  3.  **Accept that explanatory power isn't the sole criterion for lawhood.** The palindrome explains the symmetry, but FGP (via Non-Ad Hocness and Projective Power) correctly denies it lawhood. The CA rule shows Projective Power *is* key to feeling like "the rule somebody wrote down," but FGP's other clauses prevent misapplication to ad hoc constraints.

  FGP offers a single, precise package that explains *why* your intuitions conflict: the low-entropy start *lacks* the fundamental governance structure (Projective Power + Non-Ad Hocness) despite its explanatory weight, highlighting a genuine tension in our concept of lawhood. It delivers the coherence you sought, albeit by requiring concessions on (6) and a firm stance against Humeanism.
