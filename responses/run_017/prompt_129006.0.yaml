  - Emergent mechanisms that bound goal variance
  - Empirical evidence showing average-case correlates with rare failures
  - Arguments that their standard is practically unachievable

  I need to specify which reference class each defeater engages and how a defender might respond. The training variance and internal goals aspects seem more defensible than input robustness.

