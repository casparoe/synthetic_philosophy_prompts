  ## Commission Chambers: Pre-Vote Debate

  **Setting:** A cramped conference room before the monthly Urban Forestry Commission meeting. ARJUN (Supervaluationist, mid-50s, thoughtful, hands folded) and JOAN (Epistemicist, late-40s, precise, reviewing notes) discuss Agenda Item 7B: Permit for Oak Street Condos.

  **Arjun:** Joan, I know where you're leaning on this Oak Street silver maple. But 19 inches... it feels squarely in the penumbra after our last rulings: 24, 22, 20. We’re dancing right on the edge of ‘significant size’.

  **Joan:** Arjun, the ordinance *has* a sharp cutoff. It exists. We just haven't perfectly discerned it yet. Each ruling isn't creating the line, it's revealing evidence of it. After 20 inches was deemed significant just three months ago, how can 19 possibly be above the line? The trend is clear.

  **Arjun:** But *where* is this line? What pins it down? It’s not written. Our *own rulings* are the only practice defining it, and they’ve been inconsistent – a 2-inch drop each time? That looks like us *making* the line, not finding it. If the cutoff were truly sharp and knowable, why didn’t we start at, say, 18 inches last year? Why this gradual slide?

  **Joan:** Because our *understanding* sharpens! We learn collectively. Past rulings are data points revealing the community’s implicit standard, codified in the ordinance. Each vote refines our *epistemic access* to the fixed boundary. 20 inches was significant. Therefore, 19 inches, being smaller, is not. The line *must* be somewhere between them. Logic dictates rejecting this permit unless they preserve or replace.

  **Arjun:** Logic dictates the *line* exists, but it doesn't tell us *where*. That's the point! On my view, 'significant size' admits multiple equally valid precisifications – maybe 18 inches, maybe 20.5. The 19-inch maple is borderline; it *is* significant under some precisifications, not under others. Our vote today *selects* which precisification governs *this* case. We aren't finding a fact, we're making a decision within the zone of indeterminacy.

  **Joan:** But Arjun, the ballot forces a binary: Significant or Not Significant. "Indeterminate" isn't an option. What do you *do*? Flip a coin? That abdicates responsibility. We *have* to vote based on our best judgment of the fixed standard.

  **Arjun:** (Leans forward) Exactly! We vote based on *judgment* – which precisification seems most *reasonable* in this context. Is the silver maple healthy? (Checks notes) It is. Is it prominent in the streetscape? Moderately. Is the replacement plan robust? They propose three 8-inch native oaks. For *this* tree, in *this* context, voting "Not Significant" feels like a permissible precisification that allows reasonable development while still getting substantial replacement canopy. We’re not flipping coins; we’re exercising reasoned discretion within the vagueness.

  **Joan:** But here’s the wrinkle you’re ignoring, Arjun: Our rulings go into the *digest*. Surveyors, developers, lawyers – they rely on that as precedent. If we vote "Not Significant" for 19 inches today, doesn’t that *shift* the very practice that, on *your* view, helps fix the meaning? Isn’t your vote today not just applying the law, but *changing* the range of admissible precisifications for next time? That sounds perilously close to lawmaking, which the charter bars us from.

  **Arjun:** (Nods slowly) A fair point, Joan. It *is* self-referential. Our vote today *narrows* the range of future precisifications. What was borderline (19 inches) becomes, by precedent, definitively *not* significant for future cases *unless* we break precedent. But that’s the nature of applying vague terms! We *have* to make these calls, and in doing so, we inevitably shape future interpretation. It's not *amending* the ordinance's core concept ("significant size"), it's *precisifying* its application through case law, which *is* applying it, albeit dynamically. The charter doesn't forbid precedent.

  **Joan:** Whereas *I* see it as uncovering a clearer view of the fixed standard. The digest reflects our *improving knowledge*, not a changing rule. But… (sighs) I concede your point highlights a practical challenge. Even if the cutoff is sharp, our *ability to know it unanimously or consistently* is flawed. The digest creates an *operational* standard based on our collective, evolving best guess.

  **Arjun:** And I concede, Joan, that your view provides a powerful argument for *stare decisis* – sticking to precedent to reveal the line. If we called 20 significant, calling 19 significant now *would* be contradictory on your view. My view allows more contextual flexibility... but at the cost of potential inconsistency that worries developers. It’s messy.

  **Joan:** Which brings us to the other vote: publishing a bright-line number next year. *That* would be true lawmaking, amending the application. We can’t do it. The ordinance says "significant size," not "X inches." Defining it would overstep.

  **Arjun:** (Smiles wryly) Interesting. Here’s where *I* might support a bright-line, while *you* oppose it. Codifying a number *reduces* vagueness, eliminating future borderline struggles and the self-referential precedent problem. It creates a *new*, clear precisification. It *is* a form of amendment-by-practice, perhaps, but if the Council won’t act, and the vagueness causes chaos, isn't a clear rule *better* application in the long run? It settles the indeterminacy we're wrestling with today.

  **Joan:** No. It usurps the legislative role. Our job is to apply the words they gave us, vague as they are, based on evidence and reasoned judgment of that fixed standard. Inventing a number isn't applying "significant size," it's replacing it.

  **Arjun:** And my job today is to apply "significant size" by choosing a reasonable precisification for this 19-inch maple. Given the trend, the tree's health, the solid replacement plan, and the fact 19 inches *is* plausibly below significance under some admissible precisifications *right now*... I'm voting "Not Significant." We preserve the precedent slide for another day, but get those oaks planted.

  **Joan:** And I *must* vote "Significant." 19 inches is simply too close to 20, our last data point revealing the cutoff is *above* here. To find otherwise contradicts our recent practice and ignores the evidence of the fixed line. We force preservation or 3:1 replacement. The precedent must hold to reveal the standard.

  **Arjun:** So we disagree on the vote, and we'll disagree later on the bright-line. But we agree the digest rulings shape expectations, and that knowing the *exact* cutoff, if it exists, is practically impossible for us.

  **Joan:** Agreed. Let's go cast our votes. May the best interpretation win… or at least, the majority's.

  **(They gather their papers, the concrete difference clear: Joan votes "Significant" (requiring action), Arjun votes "Not Significant" (allowing removal without penalty). Each has conceded a practical challenge inherent in their theory.)**

  **Key Differences & Concessions:**

  1.  **Concrete Difference in Vote:**
      *   **Joan (Epistemicist):** Votes "Significant" for the 19-inch maple. The trend (24, 22, 20 significant) reveals a sharp cutoff above 19 inches. Voting otherwise contradicts revealed evidence of the fixed standard.
      *   **Arjun (Supervaluationist):** Votes "Not Significant." The 19-inch tree is borderline. Among admissible precisifications, voting "Not Significant" is a reasonable choice considering context (tree health, replacement plan) and doesn't violate the core meaning. It selects one permissible interpretation.

  2.  **Concessions:**
      *   **Joan (Epistemicist) Concedes:** While believing in a sharp cutoff, she concedes that the commission's *ability to know or unanimously agree on the exact location* of that cutoff is flawed in practice ("practical challenge"). She also concedes the digest rulings create an *operational* standard based on precedent, shaping expectations even if she sees it as revealing truth.
      *   **Arjun (Supervaluationist) Concedes:** While believing the vote selects a precisification, he concedes that their rulings inevitably *narrow the range* of future admissible precisifications, acting as de facto precedent and shaping the very meaning they apply ("shifts the very practice"). He also acknowledges Joan's point about the value of consistency (*stare decisis*) for predictability, even if his theory allows flexibility.
