answer: |-
  ## After-Dinner Argument at the War College

  **Setting:** A quiet corner of the common room at the Greystone Institute for Strategic Studies. Comfortable armchairs, low lamplight. The clink of coffee cups has subsided.

  **Characters:**
  *   **COLONEL HALVARD BRUUN:** Retired infantry officer, late 50s, precise bearing even relaxed.
  *   **DR. LEILA VOSOUGHI:** Philosopher, early 40s, intense focus.

  **(The conversation has drifted from seminar discussions to the Kavala-Meridia scenario used in today’s session.)**

  **BRUUN:** ...it’s precisely Private Sen’s case that shows the impossibility of your revisionist position, Leila. That Meridian conscript driving fuel trucks? She believes, reasonably, given Meridia’s propaganda, that she’s resisting an invasion for resources. She didn’t choose this fight. She’s doing her duty as she understands it. How can she *possibly* be morally liable to be killed? How is she not the moral equal of the Kavalan soldier trying to blow up her truck?

  **VOSOUGHI:** Hal, you’re conflating three distinct things: blame, liability, and permissibility. Is Private Sen *blameworthy*? Given her reasonable false belief, likely not. She’s acting conscientiously within her epistemic constraints. I grant that readily. But liability to defensive force is different. It’s about what you are *doing*, objectively. She is materially contributing – crucially – to an ongoing, objectively unjust threat. Meridia *is* perpetrating ethnic cleansing; trying to stop Kavala *is*, objectively, sustaining that injustice. Her actions help sustain a lethal threat to innocent Shen civilians. That’s what grounds liability.

  **BRUUN:** So, you’d say she’s *not* blameworthy, but she *is* liable to be killed? That sounds monstrous. She’s an innocent pawn.

  **VOSOUGHI:** Morally innocent in terms of culpability? Yes, probably. A victim of her state’s deception? Certainly. But liable? Yes. Because liability tracks your contribution to an unjust threat, regardless of knowledge or intent. Think of someone unknowingly carrying a bomb onto a bus. They aren’t blameworthy, but they pose an objective threat, and others have a right to stop them. Sen is enabling lethal force against those who are objectively trying to stop a massacre.

  **BRUUN:** But the Kavalans aren’t pure white knights either, are they? Their government openly admits the annexation aim, structuring a third of the war effort around it. How does *that* square with your view? Do their soldiers retain the rights of just combatants? Seems revisionists must choose: the *severance* view – if a soldier’s actions are purely tied to the just aim (stopping the cleansing), they retain full combatant rights – or the *contamination* view – the unjust aim poisons the whole war, stripping rights from all.

  **VOSOUGHI:** It’s messy, I admit. But I lean towards contamination. The annexation isn’t incidental; it’s a declared, structuring aim. The overall campaign isn’t *merely* humanitarian intervention; it’s a war of conquest exploiting a humanitarian crisis. How can anyone fighting *for that campaign* claim a blanket right to kill? The entire enterprise is tainted by the unjust purpose.

  **BRUUN:** What about Sergeant Iriarte? Kavalan volunteer, enlisted explicitly for the annexation, still wants it. But his unit has *only* secured a refugee corridor. He’s never fired a shot. He’s materially contributed only to saving lives. Is *he* liable? According to contamination, he should be. But his *actions* are purely just. According to severance, he’d be fine. But his *intentions* are rotten.

  **VOSOUGHI:** Intentions matter for blameworthiness, perhaps. But liability? Primarily his actions. He signed up *for* an unjust war, intending conquest. That might make him blameworthy personally. But if his *actual, material contribution* has only been defensive and protective – objectively hindering the ethnic cleansers without advancing the conquest – then perhaps he hasn’t *yet* made himself liable to defensive killing by Meridians. He hasn’t contributed to an unjust threat *against them*. He’s been a bystander to the unjust part of his own side’s war. His liability status is... suspended? Unrealized? It depends entirely on what he’s actually *doing*.

  **BRUUN:** That feels incredibly unstable. Soldiers would need constant moral GPS tracking. Which brings me to my exchange test. To see if a soldier is morally at fault for fighting, ask: if you swapped this exact person, with their upbringing, temperament, loyalties, and placed them on the *other* side, would they fight just as willingly? For most soldiers, especially conscripts like Sen, the answer is yes. They fight for country, comrades, out of duty or fear, not abstract justice. The same person would likely fight for either side. Doesn’t that show their moral position is fundamentally the same? That the law is right to treat them symmetrically?

  **VOSOUGHI:** I’ll grant your test probably works as you describe for most soldiers. They are largely interchangeable products of their circumstances. But Hal, the test measures the *wrong thing*. Liability isn’t about the soldier’s character, upbringing, or biddability. It’s about the objective threat they pose *right now*. Whether Private Sen would have fought for Kavala tells us about her psychology and social conditioning. It doesn’t change the fact that *here and now*, she is objectively contributing to sustaining ethnic cleansing. Her being a generally obedient person doesn’t magically erase the threat her actions constitute. The exchange test reveals sociological facts about soldiers, not the moral facts about the threats they are part of creating.

  **BRUUN:** But if liability depends on the *objective justice* of the war, and if people on *both sides* of every real war reasonably disagree about what that is – as they clearly do in Kavala-Meridia – then how can any soldier ever *know* if they are permitted to fire? Your theory turns the battlefield into a moral minefield. The rules become a trap. Soldiers need clear, knowable rules they can follow. Symmetry provides that. Your asymmetry makes conscientious action almost impossible.

  **VOSOUGHI:** The difficulty is enormous, I won’t deny it. It’s the tragic heart of war. But ignoring the objective injustice doesn’t solve it; it just papers over it. What *should* a soldier do? The best they can. Seek reliable information critically. Question official narratives where possible. If genuinely unable to discern the justice of the cause after reasonable effort, perhaps default to following lawful orders within the bounds of *jus in bello* – though even that is perilous. But the epistemic difficulty doesn’t change the underlying moral reality. It just makes acting rightly tragically hard. Isn’t that preferable to a fiction of symmetry that absolves soldiers fighting for manifest evil?

  **BRUUN:** And what of our two Meridian conscripts? One who genuinely endorses the ethnic cleansing and fights eagerly? Another who was beaten into uniform, sabotages equipment when possible, and only fires reluctantly? Does symmetry *really* require treating them as moral equals? It’s uncomfortable, yes. The eager one is despicable, the other pitiable. But *as combatants*, facing the Kavalan soldier, they pose the same immediate threat. The Kavalan soldier cannot make fine-grained judgments about their inner states or levels of enthusiasm in the heat of combat. The law, reflecting the moral equality of combatants, rightly focuses on the threat they pose by virtue of their role, not their individual guilt or motives for fulfilling it. We live with the discomfort because the alternative – asking soldiers to be moral judges of each individual enemy in the midst of violence – is infinitely worse and leads to even greater atrocity.

  **VOSOUGHI:** And I live with the discomfort of knowing that epistemically blameless people like Sen might be liable, and that knowing who is liable is brutally hard. We both see the horrors; we just diagnose the core problem differently. For you, it’s the breakdown of order inherent in war; for me, it’s the underlying injustice that war often represents or creates.

  **(A pause. The disagreement hangs heavy, clarified but unresolved.)**

  **BRUUN:** If I ever saw convincing evidence that soldiers *could* reliably discern the objective justice of their war *before* fighting, and that holding them individually responsible for fighting unjustly wouldn’t collapse into chaos and vendetta... that might move me. But I’ve yet to see it.

  **VOSOUGHI:** If I ever became convinced that liability to defensive killing could be entirely divorced from one’s own actions contributing to an unjust threat – that mere membership or coerced participation, absent any material contribution, could make one liable... that would shake me. Or if the epistemic burden proved utterly insurmountable in a way that made moral judgment meaningless. But I don’t think we’re there.
