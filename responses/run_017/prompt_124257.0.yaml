  For the structure, I'll start with an enthusiastic introduction about "personalized protection," then move into sections explaining the reference class concept. The worked example will contrast "Female, 32-34" with "Female, 32-34, Vegan, Occasional Runner, Owns Cat" showing premiums jumping from $31 to $292/month. The "No Peeking" section will ironically prohibit outcome-based classes while asking questions that effectively reconstruct them. 

