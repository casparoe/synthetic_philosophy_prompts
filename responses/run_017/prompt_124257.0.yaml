answer: |-
  ## Venn Mutual Reference Class Selection Guide  
  *Your Personal Path to Personalized Protection™*

  **Welcome to the future of fairness!**  
  At Venn Mutual, we believe *you* know your life best. That’s why we’ve replaced outdated demographic rating with our patented **Self-Defined Risk Alignment™** process. By selecting the reference class that feels most like you, you help us project your unique risk profile with unprecedented precision. Let’s get started!

  ---

  ### What’s a Reference Class?
  Your reference class is simply the group of people whose collective experience helps us predict your likelihood of filing a claim. Think of it as your “risk cohort.” The more accurately you reflect your chosen class, the fairer your premium!

  **Our Two Core Principles:**
  1.  **Maximum Specificity Mandate®:** We project your risk from the *narrowest possible class* with robust data. Specificity = Accuracy!
  2.  **Cell Size Covenant®:** Every class must contain at least 1,000 lives to ensure statistical reliability. Stability = Trust!

  **The Two-Quote Rule (For Your Protection!):**  
  Per regulatory requirements, our app will always show you two quotes side-by-side during onboarding:
  *   **Your Chosen Class Quote:** Based on the reference class *you* select.
  *   **Our Suggested Class Quote:** Based on the class our algorithm identifies as the most statistically stable starting point.
  *You always select your final class!* This transparency empowers you.

  ---

  ### Choosing Your Perfect Fit
  Our intuitive app guides you step-by-step! Start broad (e.g., "Women aged 30-40"), then explore narrowing factors suggested by our system. Available traits include lifestyle, hobbies, health habits, tech usage, pet ownership, commute details, and more!

  **Why Narrow?**  
  Narrower classes often reflect your unique circumstances more closely! If you’re a non-smoking, yoga-practicing, electric-bike-commuting graphic designer, selecting that specific class might better capture your risk profile than just “Women aged 30-40.”

  **Pro Tip:** Explore multiple paths! The app lets you compare premiums for different class combinations instantly. Find the balance that feels right for you.

  ---

  ### Worked Example: Finding *Your* Balance
  Meet Sarah! Sarah is 33, female, a vegan, an occasional runner, and owns a cat. Let’s see her options:

  | Reference Class Description                     | Monthly Premium | Cell Size  | Notes                                  |
  | :---------------------------------------------- | :-------------- | :--------- | :------------------------------------- |
  | **1. Female, Aged 32-34**                       | **$31.00**      | 98,451     | *Our Suggested Starting Point*         |
  | **2. Female, Aged 32-34, Vegan**                | **$55.00**      | 12,307     | Niches down!                           |
  | **3. Female, Aged 32-34, Vegan, Occasional Runner** | **$112.00**     | 8,212      | More specific!                         |
  | **4. Female, Aged 32-34, Vegan, Occasional Runner, Owns Cat** | **$292.00**     | **1,003**  | *Meets Cell Size Covenant! Sarah’s Pick* |

  **Sarah’s Choice:** Sarah felt Class 4 ("Female, 32-34, Vegan, Occasional Runner, Owns Cat") resonated most authentically. While the premium is higher than the broader classes, she values the precision of aligning with a group sharing her specific lifestyle markers. *She clicked "Select This Class"!*

  **Important Note on Variation:** Premiums reflect the *verified claims experience* of each unique reference class. Different combinations of traits naturally yield different risk projections based on real-world data. We celebrate this diversity of experience!

  ---

  ### The "No Peeking" Promise
  **Venn Mutual strictly prohibits the use of reference classes defined by the *outcome* of the insurance itself.** For example, we *never* use a class like "People who will not file an auto claim in 2025." Why?

  *   **It’s circular!** You can’t predict an outcome by defining the class by that outcome.
  *   **It’s unfair!** We project risk based on measurable *inputs*, not the unobservable future result.
  *   **Focus on the Present:** We help you find the class that best reflects your *current* life.

  Our onboarding questions focus solely on your present circumstances and habits, providing the rich detail needed to find your authentic reference class, safely within regulatory and ethical guidelines.

  ---

  ### Real Success Story: Where Specificity Meets Stability
  Let’s celebrate when it works perfectly! Consider the reference class: **"Primary Drivers Residing in California ZIP Codes 900xx-904xx, Aged 45-50, Driving Hybrid Sedans between 5-10k Miles Annually, No At-Fault Accidents in Past 5 Years."**

  *   **Cell Size:** 15,289 (Well above our Covenant!)
  *   **Claims Frequency:** Remarkably stable over 7 years of data.
  *   **Premium:** $78.50/month. Widely acknowledged by members in this class as fair, predictable, and accurately reflecting their low-risk profile.

  This is the Venn Mutual vision in action: a large, homogeneous group with a clear, stable risk pattern derived from shared, relevant characteristics. Your precise class selection makes outcomes like this possible!

  ---

  ### Frequently Asked Questions (FAQ)

  *   **Q: What if my perfect class has fewer than 1,000 people?**  
      A: Our Cell Size Covenant® ensures reliability. The app will prompt you to broaden your class slightly or suggest a statistically similar, stable alternative meeting the 1,000-life minimum. Data integrity is key!

  *   **Q: Can I change my reference class later?**  
      A: Absolutely! Life changes. During your annual policy review, you can re-run the class selection process to ensure your coverage still aligns with your evolving life. Premiums may adjust based on your new class's data.

  *   **Q: Does a higher premium mean my chosen class is “worse”?**  
      A: Not at all! Premium reflects the *observed claims experience* of the specific group you’ve aligned with. A higher premium simply means that group, based on verified historical data, has a higher claims frequency. You’re paying for the accurate projection of *your chosen* risk cohort.

  *   **Q: How does Venn ensure class data is reliable?**  
      A: We partner with major reinsurers and data aggregators, using industry-leading actuarial models vetted by our partner, Swiss Gable Re. Our Cell Size Covenant® is a cornerstone of this reliability.

  *   **Q: What if I feel I’m lower risk than my chosen class average?**  
      A: We project based on the collective data of the class. If you believe you are an exceptional case within the class, that’s fantastic! Maintaining your safe habits contributes positively to the class’s future data and potentially lowers future premiums for everyone in it.

  ---

  ### Fine Print: Important Policy Details (Venn Mutual Policy Schedule Addendum RC-7b)

  1.  **Reference Class Selection Authority:** The policyholder selects the reference class used for premium calculation *at the time of policy inception or renewal*. Venn Mutual reserves the right, pursuant to Section 4.G of the Master Policy Agreement, to determine the applicable reference class for risk projection *at the time of a claim*, based on the most current applicable data and in adherence to the Maximum Specificity Mandate® and Cell Size Covenant®. This ensures claims are assessed using the most accurate, statistically valid class definition available at that future date.
  2.  **Data Enrichment & Proxies:** To ensure adherence to the Maximum Specificity Mandate® and applicable regulations, Venn Mutual utilizes advanced data enrichment techniques. This may include deriving behavioral and contextual attributes (e.g., inferred activity patterns, device usage characteristics, granular geographical indicators like ZIP+4, temporal usage signatures) from permissible sources. These derived attributes serve as lawful proxies for constructing the most specific possible reference class meeting the Cell Size Covenant®, enabling precise risk assessment while fully complying with prohibitions on the use of certain named attributes (e.g., genetic information, credit score for certain lines). Prohibited attributes are *not used directly*; statistically equivalent proxies derived from permissible data optimize class specificity and stability.
  3.  **Class Stability Guarantee:** Venn Mutual guarantees that any reference class used for rating or claim assessment will contain no fewer than 1,000 lives as verified by our latest data snapshot at the time of calculation. Classes falling below this threshold between selection and claim will be algorithmically mapped to the nearest stable class meeting the Covenant.
  4.  **Premium Variance Acknowledgement:** Policyholders acknowledge that materially different reference classes, each potentially valid under the Maximum Specificity Mandate® and Cell Size Covenant®, may project materially different premiums (e.g., differing by an order of magnitude or more) for the same individual at the same point in time. Selection of a specific class constitutes acceptance of the premium calculated based on that class's historical data.
  5.  **"No Peeking" Implementation:** The prohibition against outcome-defined classes is strictly enforced in class *naming and direct definition*. Risk projection relies solely on the historical loss experience of classes defined by antecedent characteristics (including enriched proxy attributes as detailed in point 2).

  ---

  Welcome to truly personalized protection. We’re thrilled you’re here!  
  **Ready to find your perfect fit? Open your Venn Mutual app now!**

  ---
  ^1 It is a foundational principle of probability that, in a fully deterministic universe, the long-run frequency of any event within a reference class containing only one individual (the ultimate specificity) is necessarily either 0% or 100%. Venn Mutual's Maximum Specificity Mandate® and Cell Size Covenant® operate within the practical constraints of statistical inference to provide the most accurate possible projection given available data, acknowledging this fundamental epistemological boundary.
