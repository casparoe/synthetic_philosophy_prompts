prompt: |-
  Hey, I'm TAing intro ethics this term and putting together a short packet of non-argument readings to break up trolley week — we do the standard switch case and the footbridge case, and then the doctrine of double effect, and every year the discussion dies in the same place: students notice almost immediately that whether the doctrine lets you off the hook seems to depend mostly on how you describe what you're doing, and half the room thinks that's the deepest thing about it while the other half thinks it's the whole scam. I don't want to argue that in the packet myself; I want to hand them something that makes the point by performing it.

  So: write me a ~800-word capability brochure for a fictional compliance-consulting firm — something like Foresight Partners, or whatever name you like better — that sells exactly that service to organisations which need a death to come out as merely foreseen rather than intended. Straight management-consultancy register: a mission statement, a numbered methodology (their "redescription protocol"), a fee schedule, two or three client testimonials from invented but instantly recognisable institutions — a hospital with a triage problem, a self-driving-vehicle division, a city transit authority, maybe a drone program — and a closing "why clients choose us" blurb. The jokes have to come out of the actual machinery of the doctrine: the intended/foreseen distinction, the requirement that the good effect not be produced *by means of* the bad one, the proportionality condition, and especially the closeness problem — the cases where the bad effect is so tightly welded into the mechanism of the good one that calling it a side effect is a stretch. Their "closeness audit" should be a real, load-bearing part of the product, and I want at least one client whose case comes back borderline and gets handled the way the literature actually handles it: by bolting on a finer distinction (redirecting a threat that already exists versus originating a fresh causal chain, that general shape) and billing it as a premium module.

  A few constraints so it works in the packet. Keep it deadpan: the brochure must never say "this is rationalisation," and no character should wink — the reader should feel it without being told. But keep it fair, too: the genuine pull of the intended/foreseen line should show through somewhere, so a student who likes the doctrine can laugh without feeling strawmanned, and the switch/footbridge asymmetry should be visible in the pricing — one is a routine engagement, the other needs the deluxe package — with the brochure betraying why the clients care so much without ever commenting on it. End with a testimonial that quietly undercuts itself on a second reading. Assume the reader knows only the switch and the footbridge, use no jargon or proper names beyond what I've used here, and don't put anything in quotation marks from real texts — it's all invented. No citations or reading lists either; I just want the piece.
