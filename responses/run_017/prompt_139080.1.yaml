answer: |-
  1. Your advisory/evaluative distinction correctly diagnoses the classic dispute: CDT prioritizes *action-guidance* under fixed circumstances ("what should I do now?"), while EDT often functions as *strategy evaluation* ("which policy yields better outcomes?"). (Confident.)  
  2. The empirical turn is real (correlation magnitude is physical), but kernel choice (source code, dispositions, etc.) reintroduces normative/theoretical disagreement about what constitutes "similarity" for evidential relevance. (Confident in the empirical aspect; the normativity of kernel choice is inferred.)  
  3. Altruism collapse is a real problem: normalization *does* transform evidential weights into *de facto* welfare weights, shifting the justification from evidence to teleology. This isn't mere conflation but a structural consequence. (Confident.)  
  4. "How much correlation exists?" is physically meaningful but underspecified without an agreed similarity space; absent that, it isn't fully well-posed. (Confident.)  
  5. Your dissolution is directionally correct: the core "dispute" splits into a meta-disagreement about DT's purpose and an empirical/normative hybrid about kernel selection, with altruism collapse exposing the formalism's instability. (Inferred synthesis.)
