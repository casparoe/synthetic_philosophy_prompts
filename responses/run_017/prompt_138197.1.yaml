  Looking at his draft, question 1 is about the extra premise needed beyond relativity. The follow-up challenges why temporal existence isn't frame-relative like other quantities. That's solid, but maybe I can refine it. The key is to force the philosopher to justify why existence must be absolute when other frame-dependent quantities aren't.

