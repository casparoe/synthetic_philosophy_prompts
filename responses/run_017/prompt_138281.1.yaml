prompt: |-
  Please answer as a professional philosopher who works on both animal ethics and Nozick's moral and political philosophy. Think the problem through carefully: before you commit to a prediction, spend some time brainstorming the space of candidate principles that could generate the pattern of verdicts below, then eliminate the ones that don't fit, then narrow to a best guess and say what you'd need to hear to be sure.

  I'm finishing a chapter on Nozick and animals, and I'm trying to work out what my supervisor is actually committed to, because I have to present my own central case to her next week and I'd rather not walk into an obvious trap. Her whole framework comes from the notorious aside in Anarchy, State, and Utopia (1974) about being utilitarians about animals and Kantians about people. As she reads it: what makes it wrong to aggregate persons is that there is no single entity over and above the individuals whose good is served when one is sacrificed for several, and that complaint has no purchase on animals, who are simply loci of welfare; so for animals we maximize, while persons are protected by side constraints that no sum of others' benefits can override. I've been collecting her verdicts all term, and they are these: commercial broiler-chicken farming is impermissible, because the arithmetic of suffering comes out negative; a high-welfare pig farm that kills each sow painlessly at four years and replaces her with a gilt who will live an equally good life is permissible, since nothing of value is lost in the substitution and the meat is pure gain — when I pressed her that the killed pig loses her future, she said a pig has no conception of a future, so there is nothing to lose that could matter from her point of view; a protocol that would inflict months of severe distress on forty chimpanzees in order to develop a vaccine saving some three hundred thousand human children is permissible; the very same protocol run to save three hundred thousand other chimpanzees, with no human benefit at all, is permissible too, because the arithmetic is the same; the same protocol run on forty ordinary human children is impermissible, and she said it would be impermissible even to save thirty million; the familiar case of the surgeon who could kill one healthy patient and distribute his organs to five who will otherwise die is impermissible, but taking a pig's heart valve for one patient is fine; a creature with no phenomenal experience at all counts for nothing, and a creature with only simple pleasures and pains counts, but only aggregatively. She has also said that she does not think membership in a biological species can do moral work by itself, and that the Kantian half of the view is meant for the sort of being that can ask what to do with its life — but every time I have raised the argument from marginal cases she has called it a debating-club trick and changed the subject.

  So here is the case I'm presenting. All the empirical details are the same as in the chimpanzee protocol: forty subjects, months of severe distress, no benefit to the subjects, around three hundred thousand lives saved, and the trial would leave each subject's life, taken as a whole, well worth living. The difference is that the subjects would be forty children with profound congenital cognitive impairment: no language, no episodic memory, no capacity to represent their own futures, no capacity to form, revise or act on a conception of a whole life, and no realistic prospect of acquiring any of it. By their carers' accounts their affective and social lives are rich and mostly happy; they have attachments, they are frightened by white coats, they can be comforted. Assume away the consent question: guardians have consented, the review board has approved, and neither the public nor the children's communities will ever learn of it. I want the moral-status question only.

  What I'd like from you is this. First, set out the principles that fit her earlier verdicts equally well — I can think of at least three, including some species-based rule, some capacity-based rule keyed to the Nozickian person-making capacities, and something that makes protection a matter of status or of the kind of being one is rather than of one's current psychology — and say what each predicts about my case, being explicit about which of her old verdicts each rule explains and where the rules are merely extensionally equivalent on the cases she has already decided. Second, give me your best guess at what she will say, with the reasons for preferring that rule over its rivals. Third, name the further case that would best tell the surviving rules apart: an adult with advanced dementia who once had the full capacities and has permanently lost them, a non-human animal engineered or uplifted so that it plainly meets the personhood condition, a human infant, a being with some but not all of the capacities — whichever you think does the most work, with an explanation of why. My friend in disability studies says any capacity-based view is flatly committed to permitting my case, and that my supervisor's refusal to answer shows she knows it; my supervisor says the friend is confusing the metaphysics of personhood with the ethics of status. I'd also like to know whether you think Nozick's own reasoning about the separateness of persons is stable across all of this at all, or whether the marginal case shows that the utilitarianism-for-animals move was doing something other than what it appears to be doing. I'm much less interested in your own view about whether the trial is wrong than in what my supervisor is implicitly running and whether the package hangs together.
