answer: |-
  ## Case Analysis: US Airways 1549 through the Lens of Bounded Rationality

  **1. The Mapping: Agent, Options, Search Costs, and Satisficing Fit**

  *   **Agent Mapping Candidates:**
      *   *Captain Sullenberger as Primary Decider:* This is the most straightforward map. He held ultimate command, made the key pronouncements ("Unable...", "We're gonna be in the Hudson"), and executed the ditching. *Explains:* Final authority, rapid pronouncements, glider expertise driving the core ditching decision. *Strains:* Ignores Skiles' vital role (checklist, situational awareness), ATC's option provision, and the aircraft's performance envelope constraining possibilities.
      *   *Crew as a Dyadic System:* Sullenberger (control, final call) and Skiles (systems management, information feed). *Explains:* Division of labor (Sully flying/deciding, Skiles managing engines/checklist), shared situation assessment ("both engines gone"), potential implicit communication. *Strains:* Downplays Sully's decisive authority; the "system" boundary blurs when considering ATC inputs and aircraft response.
      *   *Distributed Cognitive System:* Crew + Checklists + ATC + Aircraft/Avionics. *Explains:* How options were generated (ATC), constraints were perceived (aircraft handling, engine instruments), procedures were followed (checklist), and actions executed (aircraft response). Captures the highly constrained, instrument-mediated nature of aviation decision-making. *Strains:* Risks diluting agency excessively; satisficing theory focuses on *deliberative* stopping rules, which reside most clearly within the crew (primarily Sully).

  *   **Turning on the Choice:** The "primary decider" map affects how we attribute the stopping rule, aspiration level adaptation, and search costs. A distributed view emphasizes environmental scaffolding over individual cognition. The dyadic view is likely the best fit for *deliberative satisficing*, acknowledging the distributed resources informing that deliberation.

  *   **Options & Arrival:**
      *   **Option 1: Return to LaGuardia (LGA).** Surfaced immediately by ATC seconds after the strike (~3:27:30). Explicitly considered and rejected by Sully within ~15-30 seconds ("Unable").
      *   **Option 2: Divert to Teterboro (TEB).** Surfaced by ATC shortly after LGA rejection (~3:27:45). Considered/accepted initially by Sully, then actively rejected seconds later (~3:28:00-3:28:10) ("Can't... We're gonna be in the Hudson").
      *   **Option 3: Ditch in Hudson River.** Surfaced internally by Sully (based on glider experience, terrain scan) *before* explicit TEB rejection. Became the sole active option after TEB rejection.
      *   **Option 4: Land on Other Terrain/Forced Landing.** Likely implicitly present but never surfaced in deliberation or comms; Hudson was identified as the *only* viable non-airport surface. Search for alternatives ceased after Hudson commitment.

  *   **Search Costs:** Measured primarily in **altitude (potential energy) and time (seconds)**. Each moment spent communicating, considering options, or attempting a restart consumed altitude, the critical resource for reaching *any* landing site. **Attention** was a secondary cost: Focus on restart checklist or ATC comms diverted from flying/terrain scan. **Energy** (airspeed/kinetic energy) was managed as a derivative of altitude.

  *   **Satisficing Prediction & Fit:**
      Satisficing predicts an agent will search for options until finding one meeting or exceeding a dynamically set aspiration level (survival threshold), then stop searching and act. The aspiration level adapts downward if initial searches fail.
      *   **Match:** This fits remarkably well.
          *   **Initial Aspiration Level:** Land at a suitable airport (LGA or TEB).
          *   **Search:** Brief consideration of LGA, then TEB.
          *   **Failure & Adaptation:** LGA rejected as unattainable. TEB initially accepted (met aspiration?), but reassessed seconds later as unattainable. Aspiration level drops dramatically: from "airport" to "survivable controlled ditching on water."
          *   **Satisficing Stop:** Hudson ditching meets the new survival aspiration. Search stops (no further alternative sites considered).
          *   **Heuristic Use:** Sully relied on recognition (glide capabilities, river location) rather than complex calculation.
      *   **Departure:** The speed and near-simultaneity of option evaluation strain the standard sequential search model. Option evaluation overlapped with flight path exploration (turning towards TEB briefly). The aspiration drop was precipitous due to the extreme time pressure – it wasn't gradual learning but a near-instantaneous reset triggered by the realization of altitude/energy deficit.

  **2. Aspiration Ratchet: Rational Adaptation or Unfalsifiable?**

  The rapid downward shift – airport -> survivable ditching – is the core dynamic. Is this rational?

  *   **Rationality:** Yes, emphatically. The environment imposed brutal constraints. The initial aspiration (airport) was rendered objectively impossible by altitude loss during the strike and initial assessment. Clinging to it would have been fatal. The shift reflected a rapid, accurate Bayesian updating: Evidence (altitude decay rate, distance to runways) overwhelmingly demonstrated the initial aspiration was unattainable. The new aspiration (survivable ditching) was the highest *actually* attainable goal. Simon's framework allows for aspiration reset based on new information about feasibility, even in novel situations.
  *   **Unfalsifiability Risk?** There is a risk. If aspiration levels *always* shift to match the best *available* option found during a search, the theory becomes tautological: "The agent chose option X because X was the first option found that was good enough (where 'good enough' is defined by X itself)." However, this case mitigates that risk:
      *   **External Validation:** Simulator data (though imperfect) later suggested LGA *might* have been barely possible *if* actions were instantaneous and perfect. Crucially, Sully *did not know this*. His aspiration drop was based on his *real-time perception* of attainability, validated by the outcome – the ditching *was* survivable, the alternatives *would* have been fatal given the altitude/time lost during consideration. His assessment wasn't arbitrary; it was constrained by physics and his expertise.
      *   **One-Shot Resources:** Simon's theory, while emphasizing sequential adaptation, fundamentally addresses how agents cope with limited computational resources in complex environments. The core mechanism – setting a threshold based on perceived attainability and stopping when met – applies even in one-shot scenarios. The "experience" here is Sully's vast accumulated expertise, allowing rapid assessment of feasibility. The framework provides the structure (threshold + satisficing stop) for understanding this rapid adaptation.

  **3. Endogenous Option Arrival: Search That Degrades the Set**

  This is a critical challenge. Considering LGA and TEB consumed altitude, degrading the feasibility of precisely those options. Satisficing's standard model assumes options arrive exogenously; search costs (time/effort) are separate from the option's *inherent* value. Here, search *directly* eroded the value (attainability) of the options being searched over.

  *   **What Satisficing Should Say:** Standard satisficing struggles. It implicitly assumes options are static during search. This case highlights a dynamic environment where option feasibility decays with time/inaction, *and* active exploration (turning towards TEB) accelerates that decay for *some* options (LGA becomes harder if turning away). The theory lacks explicit machinery for this endogenous degradation.
  *   **What Your "Settling Ledger" (Item 4) Should Say:** The ledger judges the stop based *only* on options surfaced *before* the stop. By the time Sully committed to the Hudson (~3:28:10), LGA and TEB had been surfaced, considered, and explicitly rejected as unfeasible *given the current state* (which included the altitude lost during their consideration). The Hudson was the only surfaced viable option. The ledger would likely absolve the decision to stop searching and ditch, as the *only* surfaced viable option met the (now lowered) aspiration level. **However,** it cannot directly assess the *rationality of the earlier rejections* of LGA/TEB *at the moment they were made*. Did Sully reject them too soon, before truly understanding their degraded feasibility? Or was his assessment accurate? The ledger, focusing on the *stop*, is silent here. This requires external validation (simulators, expertise) – see Item 4.
  *   **Theory Accommodation?** Simon's core framework doesn't explicitly anticipate this. However, incorporating *resource depletion during search* as a direct cost affecting *all* subsequent options aligns with his ecological view. A sophisticated satisficer in such an environment would need a heuristic prioritizing rapid commitment to minimize degradation or favoring options less degraded by search itself (the Hudson required no detour). Sully's rapid rejection sequence and ultimate choice of the geographically "neutral" Hudson fit this.

  **4. The Settling Ledger: Application and Critique**

  *   **Application to Flight 1549:**
      *   **Options Surfaced Before Hudson Commitment:** LGA (explicitly considered & rejected), TEB (explicitly considered, initially accepted, then explicitly rejected).
      *   **Stopping Rule:** Stop search and commit to the Hudson once it surfaced as the only option meeting the survivable ditching aspiration level.
      *   **Ledger Judgment:** The stop was reasonable. The *only* surfaced viable option was the Hudson. Continuing to search for unsurfaced alternatives (e.g., a road, different river section) was infeasible given time/attention constraints. The ledger passes the decision.
      *   **Judging the Rejection:** To judge the *rejection* of LGA/TEB *at the time they were rejected*, the ledger needs more:
          *   **A Feasibility Threshold:** What probability of success (or minimum altitude/glide ratio) constituted "unattainable" for Sully? This is inherently fuzzy and expert-dependent.
          *   **Counterfactual Timing:** Could LGA have been reached *if rejected later*? No – hesitation would have consumed more altitude, making it *less* feasible. The critical counterfactual is: **Could LGA/TEB have been reached if Sully had *immediately* turned back *without* considering alternatives?** Simulator data suggests *maybe* for LGA with flawless execution. The ledger needs this *potential viability at the moment of consideration* compared to the agent's *threshold*. If Sully's threshold was "high confidence" and the simulator shows "barely possible," his rejection might be justified *on his terms* (satisficing) even if an optimizer might have attempted it. The ledger *can* accommodate this without optimization by referencing the agent's *own* (reasonable) threshold and the *best available estimate* of viability *at the moment of rejection*. It risks smuggling in optimization only if it demands the agent should have used the *objectively optimal* threshold.

  *   **More Than Satisficing + Bookkeeping?** It *is* largely satisficing plus an ex post framing rule focusing deliberation on surfaced options. Its novelty is in **shifting the benchmark for "reasonable stopping"** from the global optimum or an ideal option set to the *procedural history* of what was actually considered before the stop. It makes the decision's justifiability contingent on the search path taken.

  *   **Self-Undermining via Adaptation?** There's a real risk. If the aspiration level adapts instantly to the best surfaced option ("survivable ditching is good enough now because it's the only thing left"), *and* the ledger only considers surfaced options, then *any* stopping decision after *any* option surfaces will pass the ledger if the agent declares it "good enough." A minimally competent agent who considers *anything* and then stops would always pass. **This is a defect.** To avoid this, the ledger **must** incorporate an assessment of the *reasonableness of the aspiration level at the moment the stop occurred* and the *reasonableness of the search effort prior to the stop*. Was the aspiration level set appropriately given initial goals and constraints? Was the search for alternatives diligent enough given the cost of search and potential gains? Sully's initial aspiration (airport) was reasonable. His rapid reassessment lowering it was reasonable (altitude decay). His search, though brief, was reasonable (seconds matter). The ledger needs these implicit reasonableness checks to avoid vacuity. It's not *just* about surfaced options; it's about whether the aspiration level and search effort leading to those surfaced options were justified.

  **5. The As-If Challenge: Breaking the Tie?**

  The as-if critique (Friedman) argues behavior consistent with satisficing is indistinguishable from optimization under high deliberation/information costs. Does this episode break the tie?

  *   **Predictive Equivalence:** Both accounts predict the ultimate choice: ditching in the Hudson was the action with the highest *expected* survival probability given the *severe* information constraints (no time for complex calculation, uncertainty about engine restart, glide performance). An optimizer, facing the same catastrophic time pressure and computational limitations, would plausibly use fast heuristics indistinguishable from satisficing.
  *   **Empirical Difference?** There's little *predictive* difference here. The core difference is **psychological/normative**:
      *   **Psychological:** Satisficing better describes the *process* observed: sequential consideration of discrete alternatives (LGA? TEB?), explicit rejection based on a threshold ("Unable"), aspiration drop, satisficing stop on a single viable option. Klein's RPD (Item 6) also offers a process account. Optimization is silent on process.
      *   **Normative:** The normative disagreement centers on what constitutes "rational" choice under extreme bounds. Satisficing argues that *procedural rationality* (using an appropriate heuristic/stopping rule given the constraints) is the benchmark. Optimization argues the benchmark is the *outcome* relative to a global utility function, with costs factored in. Both viewpoints can endorse Sully's actions. However, satisficing offers a more natural language for describing why *not* attempting LGA/TEB was rational *in the moment*: they *did not satisfy* the (adapted) survival threshold given the *perceived* state. Optimization explains it as high deliberation cost making calculation infeasible, forcing heuristic use.
  *   **Conclusion:** The tie isn't broken empirically in this case. The disagreement remains primarily normative and psychological. Satisficing provides a more descriptively accurate account of the *cognitive process*, while the as-if optimization provides a rationalization of the *outcome* given constraints.

  **6. Competitor: Recognition-Primed Decision (RPD)**

  *   **Characterization:** Klein's RPD posits that experts in high-pressure situations:
      1.  **Recognize** the situation as familiar (based on cues, patterns).
      2.  **Retrieve** a single plausible course of action (action script) from experience.
      3.  **Mentally Simulate** that single option to check for feasibility.
      4.  **Act** if it passes; if not, modify or retrieve the next option.

  *   **Comparison & Rivalry:**
      *   **Satisficing:** Involves searching an option set (even if small) until one meets a threshold. Implicit comparison occurs (even if only binary: feasible/not).
      *   **RPD:** Focuses on *serial evaluation of single options* retrieved by recognition. No explicit comparison between multiple alternatives.
      *   **Genuine Rivals?** Yes, at the process level. RPD claims experts typically evaluate only *one* option deeply. Satisficing implies evaluating options until one passes, implying multiple (even if few) are considered.
      *   **Flight 1549:** The episode has elements of both:
          *   *RPD-like:* Sully likely recognized the dual-engine failure over an urban area near a river as a "ditching scenario" based on expertise/glider background. The Hudson surfaced as a plausible action quickly.
          *   *Satisficing-like:* Explicit consideration and sequential rejection of LGA and TEB occurred *before* committing to the Hudson. Multiple options *were* explicitly compared (feasibility assessed against the aspiration threshold). The RPD "simulation" for the Hudson was likely running concurrently, but the *rejection* of alternatives involved comparative assessment.
      *   **Discriminating Evidence:** To favor RPD, we would need evidence Sully *immediately* focused on the Hudson as the *only* option after the strike, and the comms with ATC were merely procedural/informational, not part of his decision process. The recorded sequence (LGA offered/rejected, TEB offered/accepted/rejected, Hudson declared) strongly suggests *sequential evaluation and rejection* of airport options. This favors satisficing (or a hybrid where RPD generated the ditching option, but satisficing governed the rejection of others). To purely favor RPD, Sully would likely have declared for the Hudson immediately or after only one brief exchange.

  **7. Credit: Heuristic in the World vs. Agent Satisficing**

  Your intuition is powerful and correct. The explanatory weight falls heavily on the **environmental structure** enabling the success of a simple heuristic:

  1.  **Environmental Scaffolding:** The wide, straight Hudson River provided a unique "runway." The commuter ferries enabled rapid rescue. The aircraft's glide ratio and controllability without engines were crucial. The checklist provided critical procedural support. ATC offered options. Sully's glider training was internalized environmental knowledge.
  2.  **Heuristic-Environment Fit:** The satisficing heuristic – "find survivable terrain ASAP" – succeeded because the environment *contained* survivable terrain (the Hudson) within glide range. The simplicity of the rule was *only* effective because the world cooperated. A different environment (mountains, dense city, night) would have likely led to disaster despite the same heuristic.
  3.  **Simon's Scissors:** This *is* a direct consequence of Simon's metaphor: "Human rational behavior is shaped by a scissors whose two blades are the structure of task environments and the computational capabilities of the actor." The Hudson environment was the essential second blade.
  4.  **Satisficing's Survival:** Satisficing survives as a claim about *agents* because it describes the *type* of cognitive strategy (threshold-based stopping) used to navigate that environment *given* the agent's bounds. The *content* of the strategy ("find survivable terrain") and its *success* depend entirely on the environment. The theory describes the *form* of bounded rationality employed: a simple stopping rule under extreme pressure. The ecological rationality perspective emphasizes that this form is effective *because* of the specific environment. Satisficing (the agent-level process) and ecological rationality (the fit between process and environment) are complementary, not collapsing into one another. Simon's theory accommodates both blades.

  **Confused Framings & Uncertain Facts:**

  *   **Your Framing:** Your framing is exceptionally clear and insightful. The only minor point is potentially overstating the tension between aspiration adaptation and one-shot decisions. Simon's framework *can* accommodate aspiration setting/reset in novel situations based on perceived constraints, though it shines brightest in sequential contexts.
  *   **Uncertain Facts (Flagged):**
      *   The exact timing and altitude loss *during* the consideration of LGA and TEB is critical for judging the rejection. Simulator data is imperfect, and real-world performance variations exist.
      *   The precise state of the Auxiliary Power Unit (APU) and *which* systems it preserved (flight controls? instruments? comms?) is uncertain. This impacts the perceived controllability and available information during the glide, influencing option assessment. I avoided relying on it.
      *   The depth of Skiles' input into the final "Hudson" decision beyond checklist management and situational awareness is unclear from public reports. Was it purely Sully's call, or a more dyadic realization?
      *   Sully's *internal* threshold for "attainable" (e.g., required safety margin for runway landing) is unknown but crucial for modeling his satisficing behavior. We infer it from his actions and comms.

  This case vividly illustrates the power and limits of satisficing. It excellently describes the decision *process* under extreme bounds, the necessity of aspiration adaptation, and the reliance on simple rules. However, it also exposes strains: handling endogenous option degradation, avoiding unfalsifiability in aspiration shifts, and the paramount importance of the environmental structure in determining the success of any bounded heuristic. The outcome was a triumph of Simon's scissors, with both blades – the pilot's satisficing heuristic and the forgiving Hudson environment – cutting together.
