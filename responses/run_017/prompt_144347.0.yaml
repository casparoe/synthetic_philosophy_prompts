prompt: |-
  I've been asked to run a two-hour evening session on the Principal Principle for our city rationality meetup, and I want a plan for the session rather than the session itself. Please don't write out the explanation or draft me slides; I can do that. What I need is the architecture: what has to be introduced in what order and why, what carries the idea, and where the predictable failures are.

  The audience: fifteen to twenty-five people, mostly working programmers, two or three physicists, a handful of people whose entire philosophy of probability comes from Bayesian statistics and the sequences. Roughly half will arrive with the reflex that probabilities just are degrees of belief and that "objective chance" is either shorthand for a frequency or a leftover confusion. So the principle has to be made to bite before it can be stated, or it will sound like "your probability should equal the probability."

  The carrying example. I have a candidate and I want you to either adopt it or replace it, with reasons either way. There is a sealed grey box in the town library, running on its own battery, with a screen and a lens. Every morning at nine the screen shows a number between zero and one; at noon the lens either flashes green or doesn't. The manufacturer is dead and the manual is one page: it says only that the displayed number is the chance that the lens will flash that day. The library has kept a public log for three years: on the 1,271 days the screen read 0.30, the lens flashed on 30.1 percent of them, and so on up the range. Nobody has opened the box, and I intend to refuse, on principle, to say whether its mechanism is deterministic.

  Two variants the example has to be able to absorb. First, the Calibration Rival: a black-box forecasting model trained on the public log whose calibration over the last six months beats the displayed number. If the number is the chance and the model is better calibrated, what does the principle tell me to match? I want this staged so that it forces the gap between deferring to a chance and deferring to a well-calibrated forecaster, rather than letting the two collapse into the same thing. Second, the case where the information you would gain if the event happened would itself discredit the chance you deferred to — a second machine, deliberately boring in description, whose tomorrow's number depends on today's flash. I want that to land as a genuine tension and not as a puzzle-box technicality, and I especially want your advice on the moment I say "that information is inadmissible," because someone will immediately say that this is just reclassifying every counterexample as inadmissible, and I don't yet know whether to concede that, bite it, or reframe it earlier in the sequence so it doesn't look like a rescue.

  Two constraints I'm fairly confident about and want you to check: no quantum mechanics anywhere in the example, and no coins or dice. I think I know why both matter — the first licenses "chance is a fundamental brute primitive, mystery, next question," and the second lets symmetry do all the work so the principle looks like a restatement of indifference — but tell me if I have it backwards or if the costs are different from what I think.

  What I want mapped, concretely.

  One: the dependency structure. What must be in place before the principle can be stated non-vacuously, and what depends on what. In particular, how do I get this audience to grant chance enough independence from opinion that the principle says something, without opening the metaphysical question of whether chances exist? And where does the conditional form go? My instinct is that the admissibility clause only becomes visible once they see that the principle constrains credence conditional on a chance proposition, and not unconditional credence, and I'm unsure whether that distinction belongs before the first statement of the principle or after it, as a repair.

  Two: the misconception map, keyed to three people I expect to be in the room. The determinist physicist, who will say that under a block universe the chances are zero or one and the principle either tells him nothing or tells him to be certain. The machine-learning person, who will say that chance is just the output of the best-calibrated model and the principle is expert deference with extra formalism. And the decision-theory person, who will try to drag the entire second hour into Sleeping Beauty. For each: the strongest version of the point, the exact moment in the sequence to head it off, and how much of it I should concede rather than defeat.

  Three: the check. One question at the end that distinguishes having got the idea from having memorized the formula. Tell me what a successful answer looks like and which near-miss answers I should be able to tell apart from the real thing.

  Four: what to refuse to cover, and where in the session to say so out loud. My current list is the metaphysics of laws, the amended principles that quantify over conditional chances, the Sleeping Beauty literature, and whether chances exist at all. Tell me what else is on it.

  Finally, a sequencing question I keep going back and forth on. I want the session to have one takeaway sentence, something like the thought that the principle's whole content lives in its admissibility clause, so that the real question is which information is permitted to move you away from the chance. Should I hand that sentence to the room at the start as a map, or withhold it and let it land at the end? Argue for one.
reasoning: |-
  Okay, let me tackle this user's request systematically. They need an architecture for teaching the Principal Principle to a rationality meetup, with specific challenges around audience misconceptions and conceptual pitfalls. 

  First, assessing the audience: mostly programmers and Bayesians who view probability as subjective degrees of belief. The core challenge is making "objective chance" feel substantive rather than tautological. The grey box example seems well-chosen - it establishes chance as an empirical regularity while avoiding quantum/symmetry shortcuts. 

  Key structural decisions emerge:
  - Must first create tension between calibration and deference before stating the principle
  - Admissibility clause needs careful staging to avoid seeming like an ad-hoc escape hatch
  - Should explicitly reject collapsing chance into "best model" early on

  For the determinist physicist objection: best to preempt by emphasizing functional role before the block universe question arises. For the ML enthusiast: sharply separate calibration (tested) from chance (ontic) using the rival model variant. The decision theorist's Sleeping Beauty pivot should be contained by designating it out-of-scope upfront.

  The dependency structure is tricky. The concept of chance propositions must precede the conditional form of the principle. I'd suggest:
  1. Establish chance as measurable regularity (box logs)
  2. Show deference paradox (calibration rival)
  3. Introduce chance propositions as objects of belief 
  4. State principle conditionally 
  5. Reveal admissibility through failure case

  The takeaway about admissibility being the core should probably land at the end as a reveal - handing it early might make the whole session feel like solving a puzzle with pre-known clues. 

  For the check question: "When would you ignore the displayed number?" should expose whether they grasp inadmissibility functionally. Near-misses would include "when it's miscalibrated" (misses point) vs correct "when learning outcome would change your trust in the mechanism."

  Notable exclusions seem correct: no quantum, no coins, no metaphysics. Should also explicitly rule out chance credences and Lewis' later amendments. Important to state these boundaries during intro and when relevant objections arise.
answer: |-
  Here's the session architecture focused on conceptual dependencies, misconception handling, and sequencing for maximum bite:

  ### **Core Dependency Structure**
  1.  **Stage 0: Pre-Reqs (15 min)**
      *   *What:* Clarify "credence" (subjective prob.), "calibration" (freq. match), "chance proposition" (e.g., "Ch(Flash)=0.3"). Distinguish *learning* Ch(E)=p from *learning E happened*.
      *   *Why:* Audience defaults conflate credence/calibration/chance. Must separate "Ch(E)=p" (a *fact claim* you learn) from "best calibrated forecast" or "E happened".
      *   *Carrier:* Grey Box logs establish **empirical calibration as observable phenomenon** without defining chance. Highlight "The number *claimed* to be the chance, and acted like it."

  2.  **Stage 1: The Deference Intuition & Its Breakdown (25 min)**
      *   *What:* Pose: "Screen says 0.7 tomorrow. Your credence for flash?" Most say 0.7. *Then* introduce **Calibration Rival**: "Model X, trained *only on public log*, outputs 0.65 for tomorrow & is better calibrated *recently* than the screen number. Now your credence?"
      *   *Why:* Forces conflict. If chance=best calibrated forecast, defer to model. If chance is different, screen might still win. Creates need for a *rule* specifying *what* to defer to. **Principle must bite *now* or collapse.**
      *   *Carrier:* Grey Box + Rival Model. Emphasize: "Is the screen reporting *what it is*? Or just *another forecast*?"

  3.  **Stage 2: Stating the Principle (Conditionally!) (15 min)**
      *   *What:* **PP v1:** "If you know Ch(E) = p, *and nothing else relevant*, then set your credence in E to p." Stress: "know Ch(E)=p" means **conditioning on the *chance proposition***. *Not* just knowing p. Use notation: Cr(E | Ch(E)=p & K) = p.
      *   *Why:* Distinction between unconditional credence and credence *given Ch(E)=p* is crucial. "K" (admissible info) is now implicit. **Conditional form is non-negotiable here.**

  4.  **Stage 3: The Tension & Admissibility Revealed (30 min)**
      *   *What:* **Introduce Time-Dependent Variant:** "Second machine: Tomorrow's screen number *depends* on whether today's flash happens. Screen today says 0.9. If flash happens, tomorrow's number will be 0.1; if not, 0.99. Your credence for today's flash *given Ch(Flash)=0.9*?" Push: "If it flashes, you'll suspect the chance was wrong! Should that affect you *now*?"
      *   *Why:* Creates visceral conflict. Intuition says "less than 0.9" because outcome gives info *about the chance mechanism itself*. **This *forces* the admissibility clause.**
      *   *Admissibility Defense (Key Moment):**
          *   **Reframe:** "This isn't moving the goalposts. PP *always* said 'given Ch(E)=p *and nothing else relevant*'. We just discovered some info *is* relevant to trusting Ch(E)=p itself *as evidence*."
          *   **Concrete Definition:** "Information is **inadmissible** if learning it *could rationally change your belief that Ch(E)=p is true* or *changes what you think the chance is*." (Tie back to variant: Learning flash outcome changes your view of *future chances*, hence discredits *today's* chance claim as reliable evidence).
          *   **Preempt "Rescue" Charge:** "If *all* info potentially discredits chances, PP is dead. But it's not! With the *first* box & *only* its log, knowing Ch(E)=p *is* your best evidence. The *time-dependent variant breaks that independence*." Contrast with Calibration Rival: The rival model *directly challenges the truth of Ch(E)=p* – that info is *also* inadmissible!

  5.  **Stage 4: Synthesis & Takeaway (15 min)**
      *   *What:* PP: Cr(E | Ch(E)=p & K) = p, **provided K is admissible wrt Ch(E)=p**.
      *   *Takeaway Sentence:* **"The whole substance of the Principal Principle is in its admissibility clause: It tells you when you're *forbidden* from using other information to adjust away from the chance, even if that information seems relevant to E."** *(Withhold until now for impact)*
      *   *Why:* Landing here makes admissibility the hero/villain, not an afterthought. Frames the *ongoing work*: Figuring out what info is admissible.

  ---

  ### **Misconception Map: Preemption & Concession**
  1.  **The Determinist Physicist ("Chances are 0 or 1")**
      *   *Strong Point:* "In a block universe, outcome is fixed. Credence should be 0 or 1. PP is redundant or wrong."
      *   *When to Head Off:* **Stage 0/1.** When defining chance propositions.
      *   *Response:* "PP isn't a law of physics, it's a *norm for uncertain agents*. Even if fundamental reality is deterministic, *you* often don't know the outcome. The *chance proposition* 'Ch(E)=p' represents the best *predictive* knowledge available *to you* in that epistemic state (like the box's output). The principle tells you how to incorporate *that specific information*. Concede: "Yes, if you *knew* the exact microstate & laws, PP might not apply. But we rarely do."
  2.  **The ML Enthusiast ("Chance = Best Calibrated Forecast")**
      *   *Strong Point:* "The 'chance' is just whatever model is best calibrated. PP reduces to expert deference. Why metaphysics?"
      *   *When to Head Off:* **Stage 1 (Calibration Rival)** & **Stage 3 (Admissibility)**.
      *   *Response:* **Stage 1:** "If chance *just is* the best forecast, why does the box claim it *is* the chance? Does the box *have* a mechanism justifying that claim, unlike the model? PP defers to *what the chance is claimed to be*, not the best estimate *of* the chance." **Stage 3:** "Crucially, *inadmissible information* (like the rival model's output) *directly attacks the truth of the chance proposition*. Expert deference doesn't handle this cleanly – PP tells you to *ignore even a better forecast* if you condition on Ch(E)=p being true and that info is inadmissible." Concede: "In *many practical situations*, deferring to the best calibrated model *is* our best guess of the chance. But PP governs belief *when you take a specific chance claim as given*."
  3.  **The Decision Theorist ("Sleeping Beauty!")**
      *   *Strong Point:* "PP seems to conflict with self-locating belief updates in SB!"
      *   *When to Head Off:* **Explicitly in Stage 0/Intro:** "We are focusing on the *core* PP for non-self-locating beliefs about external events. SB involves unique issues we *won't* cover tonight." Repeat this boundary if raised.
      *   *Response:* Firmly but politely: "That's a fascinating extension involving self-location and conditional chances, but it would derail our focus on the foundational admissibility constraint. Let's discuss it offline/next time." **Concede nothing here; it's off-topic.**

  ---

  ### **The Check Question**
  *   **Question:** "The screen displays 0.8 for tomorrow's flash. You also happen to know that *if the flash happens*, it will reveal a design flaw making *future* screen numbers less reliable. Does the Principal Principle tell you to set your credence in tomorrow's flash to 0.8? Why/Why not?"
  *   **Successful Answer:**
      *   Recognizes conditioning on Ch(Flash)=0.8.
      *   Identifies the extra info ("if flash happens... future reliability down") as **inadmissible** because learning the flash outcome *would change their belief about the truth/reliability of the chance proposition itself* (Ch(Flash)=0.8).
      *   Concludes: PP **does not** constrain credence to 0.8 *given this inadmissible information*. It permits/requires deviation.
  *   **Near-Misses:**
      *   *Calibration Focus:* "No, because this info suggests the true freq won't be 0.8." (Misses conditioning on *Ch(E)=p* and focuses on estimating p/freq).
      *   *Direct Relevance:* "No, because the info is directly about the flash." (Doesn't connect inadmissibility to *undermining the chance proposition*).
      *   *Vague Admissibility:* "No, the info is inadmissible." (Fails to explain *why* it's inadmissible in PP terms).

  ---

  ### **What to Refuse & When to Say It**
  *   **Explicitly Exclude:**
      *   Metaphysics of Laws/Humeanism (Intro: "We take chances as given propositions; we won't debate their ontological basis.")
      *   Amended Principles (PP+, Big PP, etc.) (After stating PP: "We focus on Lewis's original PP; amended versions handle other cases but add complexity.")
      *   Sleeping Beauty / Self-Locating Beliefs (Intro & if raised: "Off-topic for core PP.")
      *   Existence of Chances (Stage 0/1: "We assume chance propositions *can* be known/conditioned on for the sake of the norm.")
      *   Quantum Mechanics (Intro: "We use macroscopic examples to avoid QM-specific debates.")
      *   Symmetry Arguments / Indifference (Use Grey Box specifically *because* it lacks symmetry; if asked: "PP applies *without* symmetry, as the box shows.")
      *   Full Formal Probability Theory (Stage 0: "We assume basic credence/probability concepts.")
  *   **Where to Declare:**
      *   **Intro (5 min):** Clearly list exclusions: "Tonight, we *won't* cover: QM, coin flips, Sleeping Beauty, the metaphysics of what chance *is*, or later amendments. We focus on the core structure and admissibility of Lewis's original Principal Principle."
      *   **Relevant Moments:** Briefly restate exclusions if questions arise (e.g., "As mentioned, we're setting aside QM/SB today").

  ---

  ### **Sequencing: The Takeaway Sentence**
  **Withhold it until the end.** Here's why:

  1.  **Builds Tension & Discovery:** The core problem (When *can't* I use my other info?) emerges organically through the Calibration Rival (Stage 1) and Time-Dependent Variant (Stage 3). Revealing the answer ("It's all about admissibility!") upfront spoils the puzzle-solving and reduces engagement. Let them feel the confusion first.
  2.  **Prevents Premature Closure:** Handing out "The admissibility clause is everything" early risks the audience mentally checking out ("Oh, that's the trick") or trying to reverse-engineer admissibility definitions before seeing *why* they're needed. It makes the session about memorizing a definition rather than understanding a problem.
  3.  **Maximizes Impact:** Landing the takeaway *after* struggling with the hard cases gives it weight. It frames the *entire session* as revealing this core insight. It transforms admissibility from a technicality into the key protagonist.
  4.  **Audience-Specific:** For a rationality meetup (used to puzzles and insights), the "aha!" moment at the end is more valuable than a roadmap at the start. They'll appreciate the journey.

  **Therefore:** Structure the session so the *necessity* of admissibility is the climax. State the takeaway sentence clearly during the Synthesis (Stage 4) as the capstone.
