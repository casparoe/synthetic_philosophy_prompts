answer: |-
  ## Thesis Proposal: Artefactual Deception and the Lying/Misleading Distinction

  **Research Question:** Does the widely accepted moral distinction between lying (making a false assertion) and merely misleading (causing a false belief without asserting its truth) persist, collapse, or transform when applied to *artefactual deception* – cases where deception is achieved solely through non-assertoric manipulation of the environment or information flow, absent any direct speech act?

  **The Gap in Existing Frameworks:** Dominant philosophical analyses of the lying/misleading distinction rely heavily on the nature of linguistic acts and their normative commitments. This approach leaves artefactual deception undertheorized and its implications unexplored:

  1.  **The Assertoric Commitment Argument (e.g., Adler, Shiffrin):** Lying is distinctively wrong because the liar *asserts* a falsehood, undertaking a specific normative commitment to its truth and inviting direct reliance. This argument appears inapplicable to artefactual deception (e.g., deleting an email, leaving a document visible), where no assertion occurs. If these acts are judged morally equivalent to lying in their wrongness, the *assertion itself* may not be the core source of the wrong, undermining the commitment argument's explanatory power for the distinction.
  2.  **The Accountability Argument (e.g., Williams, exemplified by "Sam"):** Misleading is *worse* because it evades accountability; the deceiver avoids "going on record," leaving the deceived unable to pinpoint the source of deception or hold the deceiver responsible. This argument gains intuitive traction in artefactual cases, which often maximize deniability. However, this may conflate *wrongness* (the intrinsic moral character of the act) with *blameworthiness* or *criticisability* (the ease with which the act can be detected and condemned). The argument risks confusing a feature of the act's *detectability* with its inherent *moral status*.
  3.  **The "You Should Have Asked" Defence:** Standardly used to shield mere misleading, this defence falters significantly in artefactual contexts. Where the deceiver actively manipulates the environment (e.g., cropping a photo, suppressing information flow), the victim often lacks any reasonable cue to question their belief or make a relevant inquiry, making the defence seem disingenuous and potentially exacerbating the perceived wrong.

  These frameworks struggle to cleanly apply to or assess artefactual cases, suggesting the lying/misleading distinction, as conventionally understood, may not adequately capture the moral landscape of non-assertoric deception.

  **Methodology: A Taxonomy of Deception Vehicles:** This project will develop and employ a taxonomy of *deception vehicles* – the means by which a false belief is induced – as its core methodological tool. This involves:

  1.  **Month 1-2: Foundational Review:** Critically survey key literature on lying/misleading (e.g., Adler, Shiffrin, Saul, Sorensen), focusing on the core arguments for the distinction and their underlying assumptions about communication and commitment.
  2.  **Month 3-5: Taxonomy Construction:** Develop a detailed taxonomy categorizing deception vehicles. Core categories will include:
      *   **Direct Assertion:** Standard lies.
      *   **Linguistic Implicature:** True statements implying falsehoods.
      *   **Strategic Omission:** Withholding information under conditions creating a reasonable expectation of disclosure (e.g., direct questions).
      *   **Environmental Manipulation:** Altering the physical/digital environment to induce false belief (e.g., photo cropping, leaving documents visible).
      *   **Information Flow Control:** Actively suppressing or obscuring information the target would otherwise likely encounter (e.g., deleting messages, hiding files).
  3.  **Month 6-8: Application & Analysis:** Systematically apply existing moral arguments (Commitment, Accountability) to cases across the taxonomy, focusing intensely on artefactual categories (Manipulation, Flow Control). Identify where arguments succeed, fail, or require significant reformulation. Crucially, investigate whether judgements of *wrongness* separate from judgements of *blameworthiness/criticisability* across vehicle types.
  4.  **Month 9: Synthesis & Writing:** Develop a coherent account of the moral status of artefactual deception relative to lying and misleading, drawing conclusions about the robustness of the conventional distinction.

  **Why Taxonomy over Alternatives?**

  *   **vs. Intuitive Armchair Casuistry:** While intuition pumps are valuable, the literature is saturated with them, often leading to stalemates based on differing intuitions about *linguistic* cases. A structured taxonomy forces systematic comparison across fundamentally different *modes* of deception, revealing potential blind spots (like artefactual cases) and providing a principled basis for analysing *why* intuitions might shift across categories. It moves beyond piling up cases to analysing the structural features driving moral evaluation.
  *   **vs. Empirical Surveys:** While empirical data on folk judgements is interesting, it directly addresses *perceived* wrongness or blameworthiness, not the *normative* question of what *is* wrong and why. This project seeks a philosophical account of the *reasons* for wrongness, which empirical data cannot directly provide. Furthermore, funding and scope preclude robust empirical work.

  **Deliverables & Potential Conclusions:** The thesis will deliver:

  1.  A robust taxonomy of deception vehicles.
  2.  A critical analysis demonstrating the limitations of dominant lying/misleading arguments when applied to artefactual deception.
  3.  An assessment of the Accountability Argument's conflation of wrongness and criticisability.
  4.  A resolution regarding the moral status of artefactual deception relative to lying and misleading.

  **Possible Conclusions:**

  1.  **Distinction Collapses:** Artefactual deception demonstrates that the core wrong lies in the *intentional inducement of harmful false belief*, regardless of vehicle. Assertion is not morally distinctive; the lying/misleading distinction is superficial. (Commitment argument fails; Accountability argument misidentifies the source of perceived "worse").
  2.  **Distinction Persists but Shifts:** While assertion retains distinctive normative force (supporting the Commitment argument), artefactual deception constitutes a *third*, distinct category of deception, potentially sharing features with both lying (active manipulation) and misleading (lack of assertion), but requiring its own moral analysis. The Accountability argument highlights a contingent feature (deniability) but not core wrongness.
  3.  **Distinction Transformed:** Artefactual cases reveal that the core moral factor is the *violation of specific contextual epistemic duties* (e.g., duties to maintain informational integrity in shared spaces/flows). The lying/misleading distinction needs recasting within this broader framework of epistemic responsibility, where vehicle type matters contextually.

  **Deciding Factors:** The conclusion will be determined by which framework best: 1) Coheres with considered moral judgements across the full range of cases, especially artefactual ones; 2) Identifies the most plausible fundamental wrong-making feature(s) of deception; 3) Successfully disentangles intrinsic wrongness from contingent blameworthiness.

  **Failure Condition:** The project fails if, by Month 3, it becomes clear that artefactual deception can be persuasively and comprehensively analyzed *without modification* as merely a subset of misleading (or lying), fully accounted for by existing commitment or accountability arguments applied to non-assertoric contexts. If the taxonomy reveals no unique challenges or novel wrong-making features specific to artefactual vehicles, the core hypothesis is disproven.

  **Scope Limitations:** Given the word limit and timeframe, the project will:

  1.  **Focus Narrowly:** Primarily on contemporary analytic philosophical debates, not historical surveys or legal perspectives.
  2.  **Prioritize Core Arguments:** Centre on the Commitment and Accountability arguments as the most salient rivals for explaining the lying/misleading distinction's moral significance.
  3.  **Limit Case Complexity:** Initially focus on clear-cut, paradigmatic examples of each vehicle type, avoiding excessively complex scenarios involving multiple overlapping deceits or significant background injustice, unless directly necessary for the argument.
  4.  **De-emphasize Consequences:** While consequences matter, the primary focus is on the intrinsic features of the deceptive *act* and its vehicle. Deep exploration of consequence-based ethics (e.g., utilitarianism) is out of scope.

  This project addresses a tangible gap in the ethics of deception by rigorously examining a pervasive yet neglected mode of deceit. By shifting focus from *what is said* to *how belief is manufactured*, it promises significant insights into the moral anatomy of deception and the resilience of a key ethical distinction.
