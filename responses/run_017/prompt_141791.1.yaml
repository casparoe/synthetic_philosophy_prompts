  I need to address both challenges head-on. For the no-common-currency issue, I'll focus on how gains can be measured purely within each party's value system without needing a shared metric. The concavity idea is key here - losses hurt less when spread out. For the precedent problem, I'll argue that compromise design (permission rather than endorsement, bundling decisions) can actually strengthen future positions rather than weaken them.

  The user wants this concise (under 450 words), with the bottom line upfront, in prose format. They're clearly preparing for an important meeting with their brother-in-law. There's personal stakes here - family dynamics mixed with professional conflict. They need something practical and persuasive, not academic theory.

