answer: |-
  **Moral compromise creates genuine gains when incommensurable values collide by strategically trading control over *sequences* of decisions, leveraging the concavity of loss aversion and neutralizing precedent concerns through upfront bundling and non-endorsement.** Here's how:

  Your core insight about concavity is correct. Each side's loss from surrendering a single, large, existentially important parcel *feels* disproportionately devastating compared to the cumulative pain of yielding several smaller, less critical parcels. It's not that the intrinsic value of the land changes; it's that the *disutility* of losing diminishes per unit as the perceived stakes decrease. This psychological/strategic concavity allows a trade: the trust concedes a specific, lower-conservation-priority parcel for housing, while your brother-in-law's nonprofit concedes its claims on several higher-priority trust parcels later. Crucially, **both sides gain *within their own value system***. The trust prevents larger total losses across more ecologically vital land by sacrificing one lesser parcel. The nonprofit secures *one* key build site it otherwise wouldn't get, accepting that losing multiple *other* fights is less damaging than failing utterly on the one big win. No common currency is needed; each measures gain solely by its own metric (acres permanently protected vs. housing units built), avoiding Pareto's comparability trap.

  The precedent objection – that conceding one parcel fatally weakens the trust's future position – is powerful but manageable by design. The compromise *must* be structured as a single, upfront *bundle*: "We agree *now* that Parcel A goes to housing, and Parcels B, C, D are permanently protected." Crucially, **each concession is framed solely as permission (not blocking the other) for that specific parcel within the bundle, not endorsement of the other's value system.** The trust doesn't say building on A is good; it says "We won't block A *in exchange for* you not contesting B, C, D." Your brother-in-law doesn't endorse conservation; he agrees not to fight for B, C, D *in exchange for* getting A. This non-endorsement preserves core principles. Because the decision is a one-time package, no single parcel concession sets a precedent for future, unbundled fights. The trust can argue its future stance on unrelated parcels remains uncompromised, strengthened even by having permanently secured B, C, D. Thus, smartly designed compromise transforms the precedent fear: refusing the bundle leaves *every* parcel vulnerable to costly, uncertain fights, while accepting it secures permanent wins on core priorities and clarifies future boundaries. The gains are real protection and real housing, achieved through sequenced control, not diluted values.
