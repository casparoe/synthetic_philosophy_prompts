        The recontextualist now agrees that the street name, due to its pervasiveness in daily life (honourific saturation), is a form of honour that is particularly difficult to contextualize effectively because it appears in so many contexts without accompanying explanation. Therefore, the recontextualist now supports a more intensive effort to contextualize the street name, such as including a note about Vance's legacy on every bus transfer and post that mentions the street, or creating a dedicated website that is referenced whenever the street name is used. (But note: the recontextualist still wants to keep the street name, so this is an enhancement to their plan.)

      However, we are not changing their core positions. We are just getting them to agree on some points that they initially resisted.

      Alternatively, we might say:

        The removalist has come to acknowledge that the statue, if removed, should be preserved in a museum rather than destroyed, because it is evidence of the city's historical attitudes. The removalist initially might have been open to destruction or indefinite storage, but now sees the value of preservation as evidence.

        The recontextualist has come to acknowledge that the default reading of the statue (without any plaque) is purely honorific, and that without an interpretive installation, the statue does indeed celebrate Vance. The recontextualist initially might have argued that the statue was already a neutral historical artifact, but now agrees that it currently functions as an honour.

      This seems more feasible.

   III. Residual disagreement:

      Despite the above agreements, the two members continue to hold different positions on the appropriate action for the statue and the street name.

      The removalist maintains that the only way to adequately address the harm caused by the honour is to remove the statue to a museum and to rename the street, because the pervasiveness of the street name and the prominence of the statue make it impossible to shift the default-reading equilibrium sufficiently through added interpretation, and because the complicity condition is met: the wrongdoing is connected to the good deeds (since the wealth from the land likely funded the endowments) and is grave enough to defeat the honour regardless.

