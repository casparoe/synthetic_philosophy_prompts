answer: |-
  To the Esteemed Members of the City Committee:  

  We, the undersigned, having engaged in mediation regarding the legacy of Sir Elias Vance, present this joint statement to clarify our common ground, residual disagreements, and the critical questions that must guide the committee’s decision. We acknowledge the complexity of Vance’s legacy: his endowments of the library and hospital, which continue to serve the public good, stand alongside his role in the dispossession of smallholders and his public defense of that injustice. Both of us agree that the current recognition of Vance in our civic space—through the statue in Central Square and the naming of Vance Street—fails to adequately address this duality. The status quo is untenable, as it permits an unqualified honour to persist without confronting the harm inflicted on the community, particularly the descendants of those wronged.  

  In our discussions, we have identified points of agreement that each of us initially resisted but now endorses. The removalist acknowledges that the library and hospital, as functional institutions integral to the city’s social fabric, should retain their names and continue to operate without alteration. This concession arises from the distinction between *honouring* and *preserving as evidence*: these buildings testify to historical acts and serve present needs, making their preservation a record of Vance’s philanthropy rather than an uncritical tribute. Conversely, the recontextualist concedes that the street name, due to *honourific saturation*, imposes a pervasive burden absent in the statue. The street’s name appears in countless daily interactions—postal addresses, bus transfers, emergency dispatches—making it an unavoidable, passive endorsement that cannot be easily contextualized. This pervasiveness distinguishes it from the statue, which occupies a fixed location and can be avoided or engaged with intentionally.  

  Despite these shared understandings, we diverge on the appropriate remedy. The removalist maintains that Vance’s actions meet the *complicity condition*: the grave wrongdoing—dispossessing smallholders and using the acquired wealth (directly or indirectly) to fund his endowments—is inextricable from the good he performed. Thus, the honour bestowed by the statue and street name is irrevocably defeated. They must be removed: the statue relocated to a museum archive and the street renamed. This, it is argued, is the only way to cease honouring one who fundamentally violated the values our city now upholds. The recontextualist, however, contends that removal risks converting these sites into voids of forgetting, absolving the present community of its connection to this history. They advocate for retaining both the statue and street name but accompanying them with a permanent, interpretive installation (e.g., plaques, digital resources, or adjacent monuments) that details Vance’s contested legacy. This, they assert, would shift the *default-reading equilibrium*—the immediate impression of a passerby—from uncritical honour to critical reflection, ensuring the city confronts, rather than conceals, its past.  

  The cruxes of our disagreement, ordered by their potential to resolve the dispute if settled, are as follows:  

  First, and most pivotal, is whether recontextualization can reliably alter the *default-reading equilibrium*. If an interpretive installation could transform public perception of the statue and street name from honour to critical history, the removalist’s objection weakens. If not, the recontextualist’s proposal fails. Both accept that evidence from analogous civic interventions bears on this: for instance, studying statues in other cities where plaques were added to reframe controversial figures. Surveys conducted before and after such installations, measuring changes in public interpretation, would be instructive. The removalist predicts most citizens will ignore or overlook the context, leaving the default reading as honour; the recontextualist predicts a significant shift toward a balanced historical view.  

  Second is the *complicity condition*: whether Vance’s wrongdoing nullifies his honour because it enabled his philanthropy. The removalist sees the connection as fatal; the recontextualist argues the honour can be reframed without being voided. Both accept that hypothetical scenarios clarify this: if a modern donor funded a hospital with wealth from unjust land acquisition, would we accept the gift? The removalist contends the city would (and should) refuse, proving the honour is indefensible; the recontextualist argues historical distance permits reinterpretation without erasure.  

  Third is the distinction between the statue and street name. While we agree they differ in *honourific saturation*, we disagree on whether this demands divergent solutions. The removalist holds the street name’s pervasiveness makes recontextualization impractical; the recontextualist believes both can be treated similarly. Evidence from pilot programs—e.g., temporary interpretive signs on Vance Street—could test public engagement. The removalist predicts saturation will dilute the message; the recontextualist predicts consistent exposure will foster awareness.  

  A portion of our dispute is merely verbal, centering on the term "forgetting." The recontextualist uses it to imply removal erases history; the removalist defines it as the loss of active public reckoning. We agree, however, that both positions aim to *remember* Vance’s legacy—differing only on method. This semantic overlap obscures shared intent.  

  By contrast, the first crux (recontextualization’s efficacy) is genuinely empirical. It could be settled by a commissioned study: installing test plaques at the statue and key points along Vance Street, then surveying a representative sample of citizens on their interpretations after one year. Metrics would include spontaneous descriptions of Vance’s legacy and recall of the contextual details provided.  

  We also agree the statue and street name need not share the same verdict. The statue, as a concentrated, non-utilitarian symbol, is more amenable to recontextualization; the street name, embedded in obligatory civic speech, resists it. Honourific saturation renders the street fundamentally distinct—a point both now accept.  

  In closing, we submit that our dialogue, while unresolved, has refined the dispute. We urge the committee to weigh these cruxes carefully, mindful that our shared goal is a city that honours its history without perpetuating its wrongs.  

  Respectfully,  
  The Removalist and The Recontextualist  

  ---  

  This document adheres to your specifications: it is a continuous, ~1000-word prose statement for oral delivery, uses your four distinctions explicitly where applicable, and avoids external citations or formatting. It incorporates one initially resisted point per party (retaining library/hospital names for the removalist; acknowledging the street’s unique saturation for the recontextualist), orders cruxes by impact, identifies verbal and empirical elements, and argues for differential treatment of the statue and street.
