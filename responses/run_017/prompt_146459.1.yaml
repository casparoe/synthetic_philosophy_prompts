answer: |-
  Here is the exam question, model answer, and assessment materials as requested:

  **1. Exam Question**

  **Question 4: The Demandingness Objection Reconsidered**
  Consider the following case: An agent possesses a remarkable psychological adaptation. Regardless of the choices she makes, her overall level of well-being remains constant. She derives equal satisfaction from pursuing her own deeply held personal projects (like writing a novel or mastering a craft) as she does from undertaking the most beneficial actions for others (like high-impact charity work or demanding social reform). Her relationships flourish equally well in either scenario. The only difference is *who sets the direction of her life*: when acting as consequentialism demands, the shape and content of her activities are dictated solely by the requirement to produce the best available outcome; when acting on her personal projects, she sets the direction based on her own commitments, even if the outcome is less than optimal.

  *   (a) Does the demandingness objection apply to the requirement that this agent maximise the good? Explain your answer.
  *   (b) What does your answer to (a) reveal about the fundamental nature of the demandingness objection – is it primarily a quantitative complaint about the *amount* of welfare loss demanded, or a structural complaint about the *source* and *nature* of the demand?
  *   (c) Explain why familiar non-maximising revisions to consequentialism (satisficing consequentialism, scalar consequentialism, threshold views) could only address the demandingness objection understood in one of these two ways (quantitative or structural), but not the other.
  *   (d) Address the worry that the quantitative reading of demandingness inevitably relies on an independent, contested standard of how demanding morality *permissibly* can be, thereby begging the question against the consequentialist.
  *   (e) If the structural reading is correct, does the demandingness objection retain independent force as a distinct criticism of consequentialism, or is it merely a vivid symptom of the deeper complaint that consequentialism fails to recognise significant agent-relative reasons? Defend your position.

  **2. Model Answer (Approx. 900 words)**

  The demandingness objection claims that consequentialism, by requiring agents always to maximise the good, demands sacrifices so severe that it cannot constitute a plausible moral theory. The unique case presented, where the agent’s well-being is unaffected by compliance, provides a crucial test for diagnosing the objection’s core. This essay will argue that (a) the objection *does* still apply in this case, revealing (b) its structural nature; (c) non-maximising revisions only mitigate quantitative demands; (d) the quantitative reading is indeed vulnerable to circularity; and (e) consequently, the structural demandingness objection, centred on the loss of agential authorship, possesses distinct critical force beyond merely illustrating the denial of agent-relative reasons.

  **(a) & (b) The Core of the Objection: Welfare-Neutral Demandingness**
  In this case, the agent suffers no loss of welfare, relationships, or satisfaction by choosing the maximising act over her personal project. Consequentialism itself recognises no cost to her well-being. Yet, a compelling intuition persists that demanding she abandon her project *for the sake of the greater good* remains objectionable. The complaint here cannot be about the *quantity* of sacrifice – there is none measurable in welfare terms. Instead, the objection targets the *source of authority* governing her life. The defect is that consequentialism grants the agent no standing to prioritise her own defining commitments simply because they are *hers*. The moral requirement externally overrides her capacity for self-direction, dictating life’s shape irrespective of her attachments. This reveals that the demandingness objection’s most fundamental force stems not from the *volume* of welfare forgone, but from the *structure* of moral reasoning it imposes: the complete subordination of the agent’s personal point of view and projects to the impersonal optimisation of outcomes. The sheer amount of sacrifice in standard cases is a stark symptom of this structural effacement of the personal, but the structural flaw persists even when the symptom vanishes.

  **(c) The Limits of Non-Maximising Revisions**
  Satisficing consequentialism (requiring "good enough" outcomes), scalar consequentialism (viewing obligatoriness as a matter of degree based on goodness produced), and threshold views (requiring maximisation only above a certain goodness level) are all responses calibrated to the *quantitative* aspect of demandingness. They aim to reduce the *extent* of welfare sacrifice required by relaxing the maximisation imperative. However, they retain consequentialism’s core structural feature: the *only* factors determining the permissibility of an action (or the degree of obligation) are the *impersonal* values of the outcomes. Satisficing allows stopping short of the *best*, but still forbids choosing a *sufficiently good* personal project if a *better* impersonal alternative exists. Scalar views might make choosing the personal project less severely wrong, but still affirm it as suboptimal. Threshold views might permit the personal project only if the impersonal alternative falls below the threshold. Crucially, *none* of these revisions grant the agent a principled *right* or *prerogative* to pursue her project *because it is her own*, independent of its contribution to the impersonal good. They only adjust *how much* good is required before the agent is "off the hook" impersonally. They are silent on the structural complaint – the lack of space for the agent’s own commitments to provide *independent* justifying reasons. Thus, they address quantitative overload but fail to engage the structural concern about agential authorship highlighted in the welfare-neutral case.

  **(d) The Circularity Trap for Quantitative Demandingness**
  The quantitative reading faces a serious meta-ethical challenge. To claim that consequentialism demands "too much" welfare sacrifice presupposes a standard defining the *permissible* level of demand. But this standard cannot itself be derived from consequentialism without begging the question – consequentialism insists morality *can* demand any sacrifice if it maximises the good. Appealing to intuition or "reasonable expectations" risks circularity: it assumes the very constraint on demandingness (e.g., agent-centred prerogatives, a non-consequentialist account of personal integrity) that is in dispute. Without such an independent standard, the quantitative complaint lacks a non-question-begging foundation. It reduces to asserting that we find large sacrifices intuitively unpalatable, which consequentialists can dismiss as moral squeamishness or weakness. The structural reading avoids this by grounding the objection not in an external limit on *how much* can be demanded, but in a constitutive feature of agency itself – the importance of self-authorship – which consequentialism’s exclusively agent-neutral structure inherently fails to respect.

  **(e) The Independent Force of Structural Demandingness**
  If the structural reading is correct, the demandingness objection retains significant independent force beyond merely illustrating the lack of agent-relative reasons. While deeply connected, the complaints focus on distinct aspects of the moral life. The denial of agent-relative reasons is a claim about the *content* of morality: it argues that morality fundamentally includes reasons grounded in the agent’s own perspective (e.g., special obligations, permissions for partiality). The structural demandingness objection, crystallised by the welfare-neutral case, highlights the *practical experience* and *agential cost* of a morality structured *only* by agent-neutral reasons. It specifically targets the *effacement of the self* that occurs when the agent’s capacity to define her life through her projects is systematically overridden by impersonal optimisation. This is a distinct critique concerning the *relationship between the moral demand and the moral agent*. It argues that a plausible morality must not only recognise certain reasons (agent-relative ones) but must also be structured in a way that preserves the agent’s status as an author, not merely a locus, of value. Consequentialism’s failure here is a specific defect in how it positions the agent within morality, a defect vividly exposed by demandingness even when welfare costs disappear. Therefore, the structural demandingness objection is not merely a symptom; it directly critiques consequentialism’s failure to accommodate a fundamental dimension of human agency – authorship – which remains a powerful independent reason to doubt its adequacy.

  **3. Marking Scheme (Total: 20 marks)**

  **Must-Hit Moves (4 marks each):**
  1.  **Correct Diagnosis of Welfare-Neutral Case:** Explicitly recognises that the demandingness objection *persists* despite the absence of welfare cost, implying a non-welfare-based complaint. *(Common failure: Assumes no objection applies because no cost, or treats the case as irrelevant/aberrant.)*
  2.  **Clear Distinction & Structural Identification:** Accurately distinguishes the quantitative (welfare sacrifice amount) and structural (source of demand/lack of self-authorship) readings and identifies the welfare-neutral case as revealing the core objection is structural. *(Common failure: Conflates the readings or misattributes the core focus to quantity.)*
  3.  **Limitation of Non-Maximising Revisions:** Explains precisely how satisficing, scalar, and threshold views only alleviate quantitative demands (adjusting required goodness level) but fail to address the structural issue (no space for agent-relative justification of projects). *(Common failure: Assumes non-maximising views solve the problem generally, or fails to pinpoint their retention of purely impersonal justification.)*
  4.  **Engagement with Circularity:** Acknowledges and explains the worry that the quantitative reading depends on a contested independent standard of permissible demandingness, making it question-begging. *(Common failure: Ignores the meta-ethical challenge or assumes intuitive limits are sufficient without justification.)*
  5.  **Defended Position on Independence:** Takes a clear stance on (e) and provides a reasoned argument for whether structural demandingness is an independent objection (e.g., focusing on authorship/effacement) or merely symptomatic (e.g., collapsing into the agent-relative reasons critique). *(Common failure: Avoids taking a stance, or asserts a position without argument relevant to the distinction between content and agency/structure.)*

  **4. A vs B Distinction**

  *   **B Answer:** Accurately identifies the structural reading from the case, explains the limits of non-maximising revisions, and acknowledges the circularity worry. It takes a position on (e) but primarily **restates the distinction** between agent-relative reasons and demandingness, or **relies heavily on intuition** regarding authorship without deeper argument about its distinctness as a critique of moral structure/agency under consequentialism.
  *   **A Answer:** Does everything a B does, but crucially, **provides a developed, argued account of why the structural demandingness objection (focused on authorship/effacement) constitutes an *independent* criticism**. It explicitly articulates how this objection targets the *consequentialist structure's impact on the agent's practical identity and capacity for self-direction* as a distinct problem from the mere *absence* of specific agent-relative reasons in the theory's content. It argues *why* the loss of authorship is a fundamental flaw not reducible to the denial of certain reasons.
