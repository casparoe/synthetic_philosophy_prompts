prompt: |-
  My old housemate Priya (data scientist, gave 10% for years, then got deep into the whole cluelessness thing and now mostly just does whatever she wants) has a strikingly consistent track record on the question of when consequentialist reasoning actually gets traction, and I want to predict her next call. No need to explain what cluelessness is, I've read the same blog posts you have.

  Her verdicts so far:

  - Bednets in a high-malaria region: not clueless, EV reasoning works, she gives. (She used to be smug about this one; after some stuff about population-size effects she downgraded to "probably fine, I've stopped being smug.")
  - Factory farming and her own diet: not clueless. "The suffering is right there, I don't need to model the year 2400."
  - Offsetting her flights home to see family: clueless. Additionality is unmeasurable, she genuinely has no idea about the sign, and she flies anyway without buying offsets and doesn't feel bad about it.
  - Voting: clueless. She votes, but she calls it expressive, not EV.
  - Having a second kid: clueless. She's doing it. She says it's a want, not a bet on the future.
  - Own career: clueless. She took the AI-adjacent research job over a global-health data job, and if you push her she'll say she'd bet the first one is better in expectation — but she refuses to call that an EV calculation.

  The new case. A funder I know is raising money for a stipend program that pays adolescent girls in one district of western Kenya to stay enrolled through secondary school, with a pre-registered follow-up at 10 and 20 years on earnings, age at first birth, and completed fertility. A seperate donor has already committed to paying the same stipend to the control group once the trial ends, so the "are we depriving the control group" worry is off the table and the only live question is the program's own effects. The pitch is half near-term (the schooling and later-earnings evidence is decent already) and half long-run-mechanistic (delay first births, fertility falls, and you get something demographic-dividend-ish in the local economy over a couple of decades). I have about 5k sitting around and I said I'd decide this week.

  So: is Priya going to call this clueless or not? I'm less interested in her answer than in the rule she's running. I can see two that fit all six of her verdicts — something like "cluelessness bites when the mechanism is unmeasurable, measured near-term effects are enough" versus "it bites whenever the effects run out through a chaotic, branching system like politics or demography or who-exists" — but there's probably a third I'm missing (something about near-term effects swamping the noise, or about identity-affecting effects specifically). Which of the rules that fit her track record actually disagree about this stipend program, which one do you think she's really running, and what's the single extra case you'd put to her that would best separate them?

  Don't hand me a menu. Pick the rule, give me the prediction that follows from it, tell me how confident you are, and say what would change your mind.
reasoning: |-
  Hmm, the user is asking about predicting Priya's judgment on a charitable donation case based on her past decisions about cluelessness. Priya is a data scientist who used to be into effective altruism but has shifted towards avoiding consequentialist reasoning when she deems it "clueless." The user has described six cases where Priya either applied expected value (EV) reasoning or rejected it as clueless, and now wants to know how she'd rule on a stipend program for girls in Kenya.

  First, I need to analyze Priya's pattern across these six cases:

  1. Bednets: Not clueless (EV works) - measurable near-term effects (malaria reduction)
  2. Factory farming: Not clueless - direct suffering observable
  3. Flight offsets: Clueless - additionality unmeasurable
  4. Voting: Clueless - expressive, not instrumental
  5. Having kids: Clueless - identity-affecting, long-term
  6. Career choice: Clueless despite claiming "better in expectation" - avoids calling it EV

  The key tension seems to be between two possible rules:
  - Rule A: Cluelessness applies when effects involve chaotic/long-term systems (demography, politics, who-exists)
  - Rule B: Cluelessness applies when mechanisms are unmeasurable (vs. measurable near-term effects)

  Now for the new case: A stipend program for Kenyan girls with:
  - Measured near-term outcomes (schooling, earnings)
  - Pre-registered follow-ups at 10/20 years
  - Control group gets stipend later (no deprivation concern)
  - Long-term mechanism through demographic dividend

  This has elements of both - measurable near-term effects but also long-term systemic impact. 

  Looking at Priya's precedents:
  - She accepted bednets (measurable) and factory farming (direct)
  - Rejected offsets (unmeasurable), voting (systemic), kids (existential), career (systemic)

  The strongest pattern is her rejection of any intervention where effects propagate through complex systems - voting (politics), kids (demography/existence), career (AI/long-term). Even in bednets, she downgraded her confidence when population effects were considered.

  Meanwhile, the stipend program explicitly mentions "demographic-dividend-ish" effects - exactly the kind of complex, branching system she rejects in other cases. The near-term effects are measurable, but the long-term economic mechanism is inherently chaotic.

  Therefore, I think Priya's actual rule is closer to Rule A: Cluelessness bites when effects run through chaotic, branching systems. She'll call this clueless.

  I'm quite confident (85%) because:
  - Her "downgrade" on bednets shows sensitivity to systemic effects
  - She rejected career choice despite "better in expectation" framing
  - The stipend's demographic mechanism mirrors her kid-having reasoning

  A single case to test this would be: "A program giving cash to families conditional on girl-child school attendance in India, with no long-term follow-up planned." If she accepts this (measurable near-term) but rejects the Kenya one (long-term mechanism), it confirms Rule A.

  If she accepted the Kenya program, it would undermine my model, suggesting she weights measurable near-term effects more heavily than I thought.
answer: |-
  Based on Priya's track record and the pattern I see, here's my breakdown:

  ### The Rule She's Running
  **"Cluelessness applies when the primary claimed benefit relies on *long-term, identity-affecting causal chains* that propagate through chaotic systems (demography, politics, or who-exists), rather than directly measurable near-term outcomes."**  
  This fits all six cases:  
  - ✅ *Bednets/factory farming*: Near-term, non-identity-affecting effects (health/suffering reduction) are measurable and dominate.  
  - ✅ *Offsetting/voting/kids/career*: All involve long-term, branching paths where outcomes depend on chaotic systems (carbon markets, politics, future population dynamics, AI trajectory) *and* identity-affecting mechanisms (e.g., voting changes who wins, kids change who exists).  
  Crucially, she rejects EV even when near-term proxies exist (e.g., career choice has salary/impact metrics, voting has polling) if long-term chaotic chains are central to the justification.  

  ### Prediction for the Stipend Program  
  **Priya will call this CLUELESS.**  
  - **Why?** The pitch explicitly leans on a "long-run-mechanistic" demographic dividend—a *classic chaotic system* involving fertility, economic cascades, and identity-affecting paths (which girls survive, their kids, local economic actors). Even with near-term outcomes measured (earnings, age at first birth), the *primary selling point* ("half long-run-mechanistic") triggers her cluelessness heuristic, mirroring her rejection of similar long-term bets (kids, career). The control-group fix avoids near-term harm but doesn't resolve long-term cluelessness.  
  - **Confidence: 85%.** Her pattern shows zero tolerance for demography/population-based long-term reasoning (see "second kid" and bednets downgrade). If the pitch solely emphasized near-term earnings gains, she *might* bite—but it doesn’t.  

  ### What Would Change My Mind  
  If the stipend program **excluded all long-term demographic claims** and sold itself *only* on measured near-term outcomes (e.g., "increases girls' earnings by 15% based on RCTs, control group covered"), I’d flip my prediction to "not clueless." Priya accepts measurable near-term effects (factory farming, bednets), but balks at "demographic-dividend-ish" mechanisms. Her career-choice case proves she’ll reject EV even with a "bet on the future" if chaotic chains are involved.  

  ### The Single Best Test Case to Separate Rules  
  **"Donating to a proven malaria vaccine rollout with 5-year follow-ups on child mortality, *no* claims about population-level economic spillovers."**  
  - **Why this tests the rules:**  
    - **Rule A (my pick):** Near-term, measurable, non-identity-affecting (saves existing kids). Priya *wouldn’t* call clueless (like bednets).  
    - **Rule B ("unmeasurable mechanisms"):** *Would* call clueless if mechanisms are complex (e.g., immune-system impacts).  
    - **Alternative Rule ("identity-affecting effects"):** *Would* call clueless if it changes who survives (like having kids).  
  Priya’s bednets verdict suggests she’d accept this—confirming Rule A. If she called it clueless, Rule B or identity-focused rules win.  

  **Final note:** Priya’s rule isn’t about "measurability" alone (offsetting was unmeasurable *and* near-term, voting is measurable but systemic). It’s about whether the *value proposition* hangs on chaotic long-term forks. The stipend program fails that test. Keep your $5K for bednets.
