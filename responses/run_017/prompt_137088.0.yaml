prompt: |-
  You are a professor of philosophy who works on metaphysics and the logic/semantics side of philosophical logic — the technical side, not the waffly side. Please think really carefully about this one, and before you write your actual answer do a few minutes of brainstorming: sketch three or four candidate principles, try to break each of them against the cases below, and then give me the one that survives. Please don't just give me the standard textbook story. I've poked around online enough to know this is an ancient puzzle that people usually tell with a sea battle, so I know I'm not the first person to wonder about it — but I want you to actually work through *my* list and tell me which of my gut reactions you think are wrong and why.

  So: me and five mates have run a predictions pool for about nine years. Every month we each write down twenty-odd claims about the future, seal them, and settle them later. Over time we've accidentally built a second book. The first one is the Payout Book: after the event we mark each prediction *won* or *lost*, and money moves. The second one we call the Back Book, and in it we argue about whether the prediction **was already true at the moment you wrote it down**, as opposed to merely winning later. This sounds like the same question but it doesn't feel like it. We've developed odd house rules that I now think are doing philosophical work: (a) if the thing is already fixed but hidden — a coin that's been flipped and is sitting under someone's hand — it has to go in the Back Book, we'll fight about it; (b) predictions about your *own* future decisions are banned from the Back Book, they only ever get paid out, never "was already true'd"; (c) predictions about things that happen after nobody's alive to check get a star and we genuinely cannot agree what to do with them.

  Here are my gut verdicts, and they don't all fit together:

  1. "It'll rain on the allotment tomorrow," said where the weather is genuinely chancy. Neither true nor false when I write it. It's *open*.
  2. "That coin under your hand is showing heads." Already true or already false. I just don't know which. Not open. Same coin, same ignorance, but before the flip I'd have said open — so the flip itself seems to do something.
  3. "The ferry will sail tomorrow" (our version of the sea battle thing). Open, exactly like 1.
  4. "Either the ferry sails tomorrow or it doesn't." Definitely true. I'd bet the house on it. This is the one that bothers me: both halves are open, but the either/or feels like the safest thing anyone has ever said.
  5. "The ferry sails tomorrow and it doesn't." Not true. Not open. Just no.
  6. "I'll take the chicken" — said while I'm genuinely undecided at the counter. Open, and open in a *thicker* way than 1: it isn't that I don't know what I'll pick, it's that there's nothing there yet, and it becomes true *because* I pick it. That's why rule (b) feels right to me.
  7. Maureen has called this sort of thing right every single time for nine years. When *Maureen* writes "the ferry will sail," I want to say it's already true. But its the same event as 3, and I said 3 was open. So one of those two reactions is junk and I can't tell which.
  8. Someone wrote "this 10p will land heads," and then the coin got knocked off the table and lost and never flipped at all. That one has *stopped* being open and gone false. Was it always headed for false? I don't like that, but I also don't see how it stays open forever.
  9. Steve's argument, which I can't refute: after the ferry sails we all happily say "Dave's prediction was true." So its true now that it was true then. So it *was* true then. So it was never really open. I think Steve is cheating but I can't find the cheat.
  10. "A city will stand on this hill in the year 3000." Open. And I have no idea what to do with the starred ones, the after-everyone's-dead predictions.

  What I want: one principle (or at most two or three candidates) that captures this pattern, stated precisely enough that I could apply it myself — tell me which of my cases forces each clause of it, and be honest about which of my verdicts it makes me give up. Then tell me what it says about a case that isn't on my list: someone posts at 8am that the bakery will be sold out of bread by noon, everyone in the village reads the post, everyone rushes out, and it is indeed sold out by noon. Was that one already true at 8am? And while you're at it: on your account, what are the correct house rules for the Back Book — should we keep it at all?
reasoning: |-
  Okay, let me really dig into this prediction pool puzzle. The user's describing a layered metaphysical problem with their Back Book tracking what was "already true" when predictions were written, and their gut reactions reveal tensions in how we assign truth to future contingents. 

  Hmm, first I need to map their intuitions: they distinguish between chancy events (rain), hidden facts (coin under hand), and self-fulfilling predictions differently. Rule (b) banning predictions about their own decisions is particularly telling - it suggests agency creates a special case where truth isn't predetermined. 

  *scratches head* The ferry dilemma (case 3 vs 7) is classic Aristotle but with a twist: Maureen's track record makes them want to retroactively assign truth, even though the event itself is open. That's emotional bias conflicting with logic. And Steve's argument (case 9) is a sneaky appeal to the necessity of the past - but "was true" doesn't imply "was determinately true at time of prediction." 

  *flips mental coin* For the bakery case (not on their list), I'm leaning toward "not already true" because the rush created the truth. But then why isn't Maureen's prediction equally creative? Maybe because she doesn't cause ferry sailings? 

  *stares at ceiling* The lost coin (case 8) is brutal. If we say it was always false, we're smuggling in determinism. But leaving it "open" forever violates their settlement need. Perhaps... the prediction becomes false when the possibility closes? 

  *scribbles* Core tension: they want a three-valued system (true/false/open) but also need closure rules for edge cases. Their house rule (a) treats hidden facts as binary-valuable while (c) admits defeat on deep future. Maybe the answer is to admit temporal asymmetry - truth-value supervenes differently on past vs future. 

  *sighs* I'll have to kill some darlings. Their case 6 ("I'll take chicken") being "thicker open" seems right, but conflicts with wanting Maureen's prediction to be true. Either agency matters uniformly or it doesn't. And for starred predictions... maybe we just admit some truths aren't knowable even in principle? 

  Final principle sketch: Truth-at-t requires either (1) sufficient causal history at t, or (2) logical necessity. Excludes agency-involving futures and cases where causal chains terminate (lost coin). Sacrifices their case 7 (Maureen) and forces case 10 to be open indefinitely. Bakery case? Open at 8am - the rush hadn't happened yet.
answer: |-
  After careful analysis of your cases and rules, I propose a **Causal Supervenience Principle (CSP)** with three key components. This framework sacrifices one of your intuitions (case 7) but explains the others while respecting your house rules. Let's break it down:

  ### The Principle: Causal Supervenience Principle (CSP)
  *"A future-tensed prediction P is true at time T iff the truth of P is logically necessary OR causally determined by a sufficient causal history existing at T. It is false iff its negation is logically necessary OR causally determined at T. Otherwise, it is open (neither true nor false)."*

  ### Key Components Explained:
  1. **Logical Necessity (LN)**  
     Handles tautologies/contradictions (cases 4 & 5).  
     *Example: "Ferry sails or doesn’t" is LN-true at all times.*

  2. **Causal Determination (CD)**  
     Truth supervenes on *completed causal chains* at T.  
     - **CD-True/False**: When prior causes *necessitate* the outcome (case 2: flipped coin under hand).  
     - **CD-Open**: When the outcome depends on incomplete causal chains (case 1: weather), agency (case 6: your choice), or contingent future causes.

  3. **Agency Exclusion**  
     Outcomes requiring *future agency* (free decisions) are inherently CD-open. Justifies your rule (b).

  ---

  ### How CSP Handles Your Cases:
  | Case | Your Verdict | CSP Verdict | Why |
  |------|--------------|-------------|-----|
  | 1    | Open ✅ | Open ✅ | Weather causally undetermined at T. |
  | 2    | True/False (not open) ✅ | True/False ✅ | Causal history (flip outcome) exists at T. |
  | 3    | Open ✅ | Open ✅ | Ferry outcome not causally determined at T. |
  | 4    | True ✅ | True (LN) ✅ | Tautology. |
  | 5    | False ✅ | False (LN) ✅ | Contradiction. |
  | 6    | Open ✅ | Open (Agency) ✅ | Depends on future agency. |
  | 7    | True ❌ | Open ✔️ | *Maureen’s track record doesn’t causally determine the ferry. Your intuition conflicts with case 3.* |
  | 8    | False ✅ | False at T+knock ✅ | *Becomes false when causal possibility closes (coin lost).* |
  | 9    | Open ✅ | Open at T-prediction ✔️ | *Steve’s error: "True now" ≠ "True then." Retrospective truth doesn’t imply past determination.* |
  | 10   | Open ✅ | Open ✅ | No causal determination at T (deep future). |

  ---

  ### The Bakery Case (New Test):
  - **Prediction at 8am**: "Bakery sold out by noon."  
  - **Outcome**: Villagers cause sold-out by rushing after reading.  
  - **CSP Verdict**: **Open at 8am**  
    *Why?* At 8am, no causal chain necessitating a sell-out existed. The prediction *created* the conditions for its truth (self-fulfilling prophecy). Closer to case 6 than case 2.

  ---

  ### Revised House Rules for the Back Book:
  1. **Keep the Back Book** – It tracks a metaphysically distinct concept (causal determination at T) vs. payout (outcome).  
  2. **Modify Rule (c)**: Starred predictions (deep future) are **always "Open"** in the Back Book.  
  3. **Uphold Rule (a)**: Hidden but fixed outcomes (coin under hand) are **True/False**.  
  4. **Uphold Rule (b)**: Self-predictions remain **banned** – agency keeps them open.  
  5. **Add Rule (d)**: If a prediction’s causal possibility closes without outcome (case 8), mark **False**.

  ---

  ### Why This Works & Sacrifices:
  - **Saves**: Your core intuitions about openness, agency, and hidden facts.  
  - **Sacrifices**: Case 7 (Maureen). CSP insists her prediction is open—track records don’t causally bind the world. Your intuition here conflates *epistemic confidence* with *metaphysical determination*.  
  - **Strengths**: Explains why the flipped coin (case 2) differs from pre-flip: causal history *exists* post-flip.  
  - **Handles Edge Cases**: Lost coin (case 8) becomes false when its causal path terminates; deep future (case 10) stays open.

  ### Final Thought
  The Back Book isn’t tracking "what will happen" but "what was inevitable given the past." That’s why tautologies (case 4) enter as True, while chancy/agentive futures stay Open. Steve’s argument (case 9) fails because present truth about past predictions doesn’t retroactively alter their metaphysical status at T. If you apply CSP rigorously, your pool’s metaphysics becomes watertight—even if Maureen’s winning streak feels magical.
