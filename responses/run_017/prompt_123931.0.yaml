answer: |-
  Below is a decision procedure designed to resolve your foundation's philosophical dilemma while meeting operational constraints. It operationalizes lexical-threshold negative utilitarianism (LTNU) by strictly separating above-threshold suffering (ATS) from sub-threshold impacts, prohibiting aggregation across the threshold, and handling key challenges like uncertainty, offset, and counterfactuals. The procedure is structured as a flowchart with explicit stopping rules, values calls, and overrule points.

  ---

  ### **Lexical-Threshold Grant Decision Procedure**  
  *For program officers (time limit: 40 min/application)*  
  **Outputs:** Fund / Don't Fund / More Info + 0.5-page donor-readable rationale.

  #### **Key Definitions**  
  - **Severity Threshold (rung T)**: Suffering above rung T (e.g., rung 5/6) *lexically dominates* all sub-threshold effects.  
  - **Suffering Episode**: Defined by **peak intensity** (duration/frequency don’t push sub-threshold suffering past T).  
  - **No Aggregation**: Sub-threshold suffering *never sums* to exceed T.  
  - **Offset Rule**: Pleasure *cannot cancel ATS*; may partially offset sub-threshold suffering intra-personally (values call).  
  - **Threshold Settings**: Board must set/update annually:  
    - `T` (threshold rung),  
    - `P_min` (min probability to count ATS risk),  
    - `CE_min` (min cost-effectiveness for sub-threshold funding),  
    - `CE_ATS_max` (max cost per ATS case prevented).  

  ---

  ### **Procedure: Ordered Questions**  
  *[Record answers; stop at first Don’t Fund/More Info]*  

  1. **INITIAL SCREENING**  
     - **Q1:** Does the application clearly describe:  
       (a) Target suffering(s) and counterfactual scenario?  
       (b) Mechanism to reduce suffering?  
       (c) Cost and scale?  
     - **Sufficiency:** Missing (a)/(b)/(c) → **More Info** (specify gaps).  
     - **Q2:** Is the intervention in-scope (health/animal welfare)? No → **Don’t Fund**.  

  2. **SEVERITY ASSESSMENT**  
     - **Q3:** Using historical files, calibrate claimed severity:  
       - Compare to past *similar cases* (e.g., "poultry slaughter" or "cancer pain").  
       - If current claim > historical max for category without new evidence, downgrade to historical max.  
     - **Q4:** What is the **peak intensity** of a *single suffering episode* in the status quo?  
       - Assign to rung (1–6) using foundation’s ladder.  
       - *Not* whole-life or duration-weighted.  
     - **Stop:** If rung < T → proceed to **Step 4** (sub-threshold).  
       If rung ≥ T → proceed to **Step 3** (ATS).  

  3. **ABOVE-THRESHOLD SUFFERING (ATS) PREVENTION**  
     - **Q5:** What is the probability (`P_ats`) that the intervention *prevents ≥1 instance of ATS*?  
       - Ignore sub-threshold effects.  
       - Estimate using evidence (e.g., pilot data, theory of change strength).  
     - **Stop:** If `P_ats` < `P_min` (e.g., 10%) → **Don’t Fund** (fails lexical priority).  
       If `P_ats` ≥ `P_min` → proceed to **Step 6**.  

  4. **SUB-THRESHOLD EFFECTS & OFFSET**  
     - **Q6:** Does the intervention reduce sub-threshold suffering *and/or add pleasure*?  
       - **Values call (Board sets rule):**  
         - *Option A (strict):* Only count suffering reduction (ignore pleasure).  
         - *Option B (moderate):* Net wellbeing (suffering reduction minus pleasure increase).  
       - **Default recommendation:** *Option A* (aligns with LTNU; avoids commensurability).  
     - **Q7:** Estimate net sub-threshold impact per dollar (units of wellbeing).  
     - **Stop:** If impact < `CE_min` → **Don’t Fund**.  
       Else → proceed to **Step 6**.  

  5. **COUNTERFACTUAL & LEAKAGE CHECK**  
     - **Q8:** Does the intervention change *who exists* or *net suffering volume* via:  
       - Demand shifts (e.g., cheaper poultry → more consumption)?  
       - Substitution (e.g., reduce cow suffering → increase chicken suffering)?  
       - Population changes (e.g., health interventions → higher survival)?  
     - **Q9:** Quantify:  
       - New ATS cases caused? (e.g., "increases industrial chicken farming").  
       - Net change in sub-threshold suffering?  
     - **Stop:**  
       - If causes *any* ATS (probability ≥ `P_min`) → **Don’t Fund** (lexical veto).  
       - If uncertain → **More Info** (request leakage analysis).  
       - Else → proceed to **Step 7**.  

  6. **COST-EFFECTIVENESS TEST**  
     - **For ATS:** Cost per ATS case prevented ≤ `CE_ATS_max`?  
       - *Rationale:* Avoids overspending on low-impact ATS.  
     - **For sub-threshold:** Cost-effectiveness ≥ `CE_min`?  
     - **Stop:** If fails → **Don’t Fund**. If passes → **Fund**.  

  7. **OVERRULE & RATIONALE**  
     - **Program Officer Output:**  
       - **Decision:** Fund / Don’t Fund / More Info.  
       - **Donor Rationale (0.5-page):**  
         ```  
         Example: "Funded: Prevents ATS in poultry (P=80%, cost/case=$0.50). No leakage risk. Sub-threshold benefits not considered."  
         ```  
     - **Board Overrule Points:** Any step where judgment was applied (noted in records).  

  ---

  ### **Where Judgment Persists (The "Seams")**  
  The procedure **cannot eliminate all judgment**. Officers must document:  
  1. **Probability Estimates:** Subjective confidence in `P_ats` (e.g., "regulatory capture risk: 30% based on NGO reports").  
  2. **Leakage Uncertainty:** When counterfactuals are speculative (e.g., "demand shifts unquantified; low-risk guess").  
  3. **Severity Calibration:** Why historical comparisons were/weren’t applied.  
  4. **Edge Cases:**  
     - When ATS prevention is highly effective but leaky (e.g., Step 5).  
     - When pleasure offset is ambiguous (e.g., Step 4, Option B).  

  **Misfire Warnings:**  
  - **False Negatives:** May reject high-pleasure/low-suffering-reduction interventions donors love.  
  - **ATS Myopia:** Over-prioritizes niche ATS cases with minimal impact.  
  - **Gaming Resilience:** Calibration (Step 2) mitigates severity inflation, but applicants may still overstate `P_ats`.  

  ---

  ### **Test Cases**  
  *Assumed Settings:*  
  - `T` = Rung 5 (e.g., severe agony).  
  - `P_min` = 10%.  
  - `CE_min` = 5 wellbeing units/$ (sub-threshold).  
  - `CE_ATS_max` = $10,000/case.  
  - Offset: *Option A (ignore pleasure)*.  

  #### **Case 1: Poultry Stunning Retrofit**  
  - **Step 1:** Complete.  
  - **Step 2:** Slaughter pain = Rung 5 (historically calibrated).  
  - **Step 3:** `P_ats` ≈ 100% (reliable tech).  
  - **Step 5:** No leakage (cost-share won’t lower prices; no substitution evidence).  
  - **Step 6:** Cost/case = $1M grant / 2M birds = **$0.50** << $10,000.  
  - **Decision: Fund.**  
  - **Donor Rationale:** "Prevents guaranteed severe agony in 2M birds/year. Negligible cost per animal. No substitution risk."  

  #### **Case 2: Palliative Opioid Programme**  
  - **Step 1:** Complete.  
  - **Step 2:** Cancer pain = Rung 6.  
  - **Step 3:** `P_ats` = 30% (soft theory of change but credible partners).  
  - **Step 5:** Causes ATS? **Yes** (diversion risk → addiction agony; P ≥ 10% per WHO reports).  
  - **Decision: Don’t Fund** (lexical veto).  
  - **Donor Rationale:** "While targeting top-rung suffering, regulatory risks could cause new severe harm via opioid misuse. Our threshold forbids this."  

  #### **Case 3: Music-Playground Programme**  
  - **Step 1:** Complete.  
  - **Step 2:** Targets pleasure → rung < 5. Proceed to **Step 4**.  
  - **Step 4:**  
    - *Option A:* No suffering reduction → wellbeing impact = 0.  
    - *Option B:* Generates pleasure (e.g., 100 units/$) but no suffering reduction.  
  - **Step 6:** Fails `CE_min` (0 units/$ under Option A; Option B requires board override).  
  - **Decision: Don’t Fund.**  
  - **Board-Ready Rationale:**  
    ```  
    "This program increases joy but does not reduce suffering above or below our threshold.  
    Under our lexical framework, funding requires either:  
    (a) Preventing severe agony (it does not), or  
    (b) Cost-effective sub-threshold suffering reduction (it targets pleasure alone).  
    We recommend redirecting funds to interventions meeting (a) or (b), e.g., pain management grants.  
    [Note: Board may overrule given donor alignment with positive experiences.]"  
    ```  

  ---

  ### **Implementation Notes**  
  - **Annual Review:** Board revisits thresholds using:  
    - Severity calibration logs (track inflation).  
    - Probability assessments vs. outcomes.  
    - Portfolio impact (e.g., "Did CE_ATS_max let us fund all credible ATS cases?").  
  - **Training:** Role-play calibration (Step 2) and leakage (Step 5) with officers.  
  - **Why This Works:**  
    - Bites the bullet on aggregation/offset without being intractable.  
    - Embeds LTNU in auditable steps.  
    - Exposes board’s values calls (thresholds, offset rules).  

  This procedure makes your philosophical commitment actionable while flagging where judgment is irreducible. It prioritizes preventing the worst suffering above all else—even when that means defunding popular programs.
