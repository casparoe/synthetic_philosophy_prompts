  Hi — I work at a smallish foundation (about $4M a year out the door, three program staff, roughly 25 grants, health and animal welfare mostly) and we've backed ourselves into a philosophical mess that I need turned into something runnable. One bloc on our board has been arguing that if the lexical-threshold negative-utilitarian picture is even approximately right — that there's a severity threshold above which suffering lexically dominates any amount of milder suffering *and* isn't offset by pleasures at all — then our whole pipeline is the wrong shape of tool, because we currently rank everything on a single made-up currency of "units of wellbeing per dollar" and that only makes sense if pleasure and pain are commensurable on one cardinal scale. The other bloc thinks that's fanatical and would have us defund things everyone agrees are good. The compromise the board landed on is that they want a written procedure, not a white paper: something a program officer with a public-health or vet-med background and no philosophy training can work through in about 40 minutes per application, that ends in a fund / don't fund / send back for more info, and that produces a half page of reasoning a donor could read without wincing. The board also wants to know explicitly where they're allowed to overrule it, since they won't accept being bound by it.

  So: give me the procedure. Ordered questions, what counts as a sufficient answer to each, the points where it stops with a no, and the points where it hands the decision to a person because it's a values call rather than a factual one. Some things I specifically want it to handle, and some of these I suspect are where the real work is. First, severity placement under coarse evidence: we have an internal six-rung suffering ladder we use informally, and I want to know what's actually being ordered — peak intensity, duration, or the product — whether the threshold is on a single episode or on a whole life, and whether many sub-threshold experiences can ever *sum* past the threshold (my guess is the honest lexical answer is no, and I want to see the bullet bitten rather than fudged into mere heavy weighting). Second, uncertainty: we essentially never know the severity, so the officer is always choosing between something like a 10% shot at preventing agony and a near-certain reduction in moderate chronic pain, and I need a rule for reasoning about probability-of-crossing-the-threshold that doesn't quietly reintroduce cross-rung expected-value arithmetic through the back door. Third, the offset question: can pleasure cancel pain at all, intra-personally or inter-personally, and if the view says never, what does our procedure do with the fact that our donors and our beneficiaries care a lot about positive experiences? Fourth, counterfactuals about *who exists*: several of our grants change prices or demand, so they plausibly change which animals live and how many, and there's substitution leakage between species and between countries — I need the procedure to catch that rather than awarding points for measured suffering on the animals in front of us. And fifth, gaming: applicants already learn to describe whatever they work on as agony, so I'd like a calibration step that penalises severity claims which have inflated over time in our own files. Wherever the procedure has