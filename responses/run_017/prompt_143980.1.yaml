  ### **Procedure: Bet Sizing System**
  **Pre-Requisites**  
  - Track in a notes app:  
    - Current bankroll (`B`, initial: $42k)  
    - Month (for tax adjustment)  
    - Bet history: your probability estimate (`p_you`), outcome (win/loss), and date for calibration  
  - Time cost: `T = $15` per bet/cluster (15 minutes at $60/hour)  
  - Floor: If bankroll < $25k, shut down.  
  - Tax rate: 30% on net annual winnings; losses carry forward. Discount future tax credits at 5%/year (simplified to 71.43% loss recovery in Oct-Dec).  

  **Step 1: Cluster Identification**  
  - *Question*: "Could a single news event resolve these bets together in the same direction?"  
  - *Sufficient Answer*:  
    - **Yes** → Treat as one cluster. Aggregate all bets in the cluster.  
    - **No** → Treat as independent. Proceed per bet.  
  - *Stop*: If "unsure," default to **one cluster** (conservative).  
  - *Handoff to Human*: Never. Use brother’s rule: "If one event resolves them, they’re one bet."  

  **Step 2: Probability Reconciliation**  
  - *Question*: "What is our probability estimate (`p_you`) for this bet/cluster?"  
  - *Sufficient Answer*:  
    - Brothers agree or differ ≤5% → Use average `p_you`.  
    - Differ >5% → Discuss for 1 minute. If unresolved, output **"no"**.  
  - *Stop*: If no agreement, **"no"**.  
  - *Handoff to Human*: Only for discussion.  

  **Step 3: Calibration Adjustment**  
  - *Question*: "What is our calibration ratio based on past bets?"  
  - *Sufficient Answer*:  
    - If <20 historical bets → `calibration_ratio = 0.9` (default overconfidence penalty).  
    - If ≥20 bets → `calibration_ratio = (Actual wins) / (Sum of past p_you estimates)`.  
    - Adjusted probability: `p_adj = max(0.01, min(0.99, p_you * calibration_ratio))`.  
  - *Stop*: If `p_adj` is 0.01 or 0.99 (extremes).  
  - *Handoff to Human*: Never. Automatic based on history.  

  **Step 4: Effective Odds & Edge Check**  
  - *Question*: "What are the decimal odds (`odds_market`) after fees and spread?"  
  - *Sufficient Answer*:  
    - Fees: `effective_odds = 1 + (odds_market - 1) * (1 - fee_rate)`. (e.g., 10% fee → `fee_rate = 0.1`).  
    - No fee → `effective_odds = odds_market`.  
    - For clusters: Average `effective_odds` of all bets.  
  - *Edge Check*:  
    - `edge = (p_adj * effective_odds) - 1`.  
    - If `edge ≤ 0` → **"no"**.  
  - *Stop*: At `edge ≤ 0` (negative expected value).  

  **Step 5: Tax Adjustment (Oct-Dec Only)**  
  - *Question*: "Is it October, November, or December?"  
  - *Sufficient Answer*:  
    - **No** → Skip. Use `f_raw` from Step 6.  
    - **Yes** → Adjust for tax asymmetry:  
      - `win_multiplier = 0.7 * (effective_odds - 1)` (after-tax win).  
      - `loss_multiplier = 0.7143` (after-tax loss, with 5% discount).  
      - `f_tax = [p_adj * win_multiplier - (1 - p_adj) * loss_multiplier] / (win_multiplier * loss_multiplier)`.  
      - If `f_tax ≤ 0` → **"no"**.  
  - *Stop*: At `f_tax ≤ 0`.  
  - *Handoff to Human*: Never. Formula-based.  

  **Step 6: Raw Kelly Fraction**  
  - *Formula*:  
    - If not Oct-Dec: `f_raw = edge / (effective_odds - 1)`.  
    - If Oct-Dec: `f_raw = f_tax` (from Step 5).  
  - *Stop*: If `f_raw ≤ 0` (shouldn’t happen if `edge > 0`).  

  **Step 7: Fractional Kelly & Stake**  
  - `f_fractional = 0.5 * f_raw` (half-Kelly for robustness).  
  - `stake_unfloored = f_fractional * B`.  
  - Apply floor: `stake = min(stake_unfloored, B - 25000)`.  
  - *Stop*: If `stake < $10` or `B - stake < 25000` → **"no"**.  

  **Step 8: Overhead Check**  
  - `expected_profit = edge * stake` (dollar amount).  
  - `net_expected_profit = expected_profit - T` (T = $15).  
  - If `net_expected_profit < 0` → **"no"**.  
  - Else → **Bet `stake`** (for clusters, split `stake` equally across bets).  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Correlation Between Clusters**: Handles within-cluster correlation but not across clusters (e.g., unrelated bets affected by macro events).  
  2. **Dynamic Portfolio Risk**: Assumes bets are independent; doesn’t optimize for open positions.  
  3. **Tax Timing Nuances**: Simplified tax credit discounting; assumes you’ll continue betting to use losses.  
  4. **Early Liquidation Haircuts**: Doesn’t model selling positions early for a house deposit (just enforces the $25k floor).  
  5. **Complex Clusters**: Only supports clusters where all bets share the same outcome direction.  
  6. **High-Precision Calibration**: Crude adjustment for small data; not Bayesian.  

  ---

  ### **Example Runs**  
  *Bankroll: $42k. Time cost: $15. Calibration ratio: 0.9 (assume <20 bets).*  

  1. **Near-Certain Bet (Market: 91%, You: 94%)**  
     - Step 1: Single bet.  
     - Step 2: `p_you = 0.94`.  
     - Step 3: `p_adj = 0.94 * 0.9 = 0.846`.  
     - Step 4: `odds_market = 1 / 0.91 ≈ 1.099`, no fees → `edge = (0.846 * 1.099) - 1 = -0.070` → **"no"** (negative edge).  
     - *Why?* Calibration adjusted your probability down, killing the edge.  

  2. **Election Cluster (3 bets, same outcome)**  
     - Market probabilities: 80%, 75%, 85% → Odds: 1.25, 1.333, 1.176.  
     - Step 1: Cluster (same event).  
     - Step 2: `p_you = 0.78` (agreed).  
     - Step 3: `p_adj = 0.78 * 0.9 = 0.702`.  
     - Step 4: Avg `effective_odds = (1.25 + 1.333 + 1.176) / 3 ≈ 1.253`.  
       `edge = (0.702 * 1.253) - 1 = -0.120` → **"no"**.  
     - *Why?* Market-implied probability (79.8%) > your calibrated view (70.2%).  

  3. **Longshot (Market: 4%, You: 8%, Odds: 25/1 = 26.0)**  
     - Step 1: Single bet.  
     - Step 2: `p_you = 0.08`.  
     - Step 3: `p_adj = 0.08 * 0.9 = 0.072`.  
     - Step 4: `effective_odds = 26.0` → `edge = (0.072 * 26) - 1 = 0.872`.  
     - Step 5: Not Oct-Dec → skip.  
     - Step 6: `f_raw = 0.872 / (26 - 1) = 0.0349`.  
     - Step 7: `f_fractional = 0.5 * 0.0349 = 0.01745` → `stake = 0.01745 * 42,000 ≈ $733`.  
     - Step 8: `expected_profit = 0.872 * 733 ≈ $639` → `net_expected_profit = $639 - $15 = $624 > 0` → **Bet $733**.  
     - *Why you’ll hate it?* Kelly sizing for longshots is tiny (1.7% of bankroll) despite high edge.  

  ---

  ### **Key Philosophy**  
  - **Vibes-Free**: Formulaic, but uses conservative defaults when data is missing.  
  - **Anti-Ruin**: Half-Kelly + floor protection + calibration avoids blowups.  
  - **Overhead-Aware**: Kills marginal bets (net expected profit < $0).  
  - **Tax-Smart**: Aggressive sizing in Q4 to exploit asymmetry.  
  - **Broker-Proof**: Simple averages and fractions; no matrices or optimizations.  

  Run this monthly to update `calibration_ratio` and bankroll. If stuck, default to **"no"**—better to miss a bet than force a bad one.
