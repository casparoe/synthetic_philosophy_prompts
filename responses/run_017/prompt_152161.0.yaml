  ### I. Decomposed Credences & Justifications
  1. **Mechanism claim (Malthusian feedback dominates long-run regulation)**  
     **Credence: 0.50**  
     *Justification:* Density dependence is universal in biology (including humans), but human innovation *temporarily* decouples population from immediate resource constraints (e.g., Haber-Bosch process fixing nitrogen). Boserupian innovation is real but ultimately substrate-limited (e.g., requires energy/materials). Thermodynamics favors Malthus in closed systems.  
     
  2. **Timing claim (Binds within ~100 years, conditional on mechanism)**  
     **Credence: 0.40**  
     *Justification:* Current decoupling relies on depleting finite stocks (fossil fuels, high-grade ores). Depletion timelines (e.g., peak conventional oil, phosphorus scarcity) and climate tipping points (≥2°C by 2100) suggest reversion within a century—but innovation (fusion, AI-driven efficiency) could extend the subsidy.  

  3. **Regime-relativity claim (Theory is obsolete, not "early")**  
     **Credence: 0.60**  
     *Justification:* Malthus’s land/muscle regime is irrelevant to a knowledge/fossil-fuel economy; human ingenuity has repeatedly transcended "fixed" constraints (e.g., shale fracking, CRISPR). Energy capture per capita has grown 20x since 1800, enabling escape from the Malthusian trap.  

