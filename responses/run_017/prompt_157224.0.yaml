  ## OFFICE FOR EPISTEMIC STANDARDS: DRAFT STATUTORY GUIDANCE (PILOT SCHEME)  
  **The Credwell Credence Accountability Pilot (Schedule 7, Epistemic Hygiene Act 2023)**

  **1. Citation and Commencement**  
  This Guidance (“The Credwell Rules”) is issued under Section 42(1)(c) of the Epistemic Hygiene Act 2023. The Pilot Scheme commences in the designated locality (Credwell Parish, comprising Postcode Sectors CR3D W3L & CR3D W3R) on 1st October 2024. Participation is mandatory for all registered households.

  **2. Purpose**  
  The Pilot aims to enhance epistemic hygiene within the community by establishing measurable standards for credence formation, reporting, and updating. The primary objective is the maximisation of *accuracy*, defined as closeness to truth, quantified via approved scoring methodologies.

  **3. The Quarterly Credence Return**  
  3.1. Participating Households must submit a Credence Return (Form E-101) to the Office for Epistemic Standards (OES) within 14 days following the end of each calendar quarter (Q1: Jan-Mar, Q2: Apr-Jun, etc.).  
  3.2. The Return must contain a precise numerical credence, expressed as a real number between 0 and 1 inclusive, for every proposition listed in the current Approved Question Schedule (AQS).  
  3.3. A credence represents the Household Head’s (*de jure* declarant) degree of belief in the truth of the proposition at the close of the reporting quarter.

  **4. The Approved Question Schedule (AQS)**  
  4.1. The initial AQS (Version 1.0) is appended as Annex A.  
  4.2. The OES may revise the AQS quarterly. Revisions will be notified 30 days prior to the start of the affected quarter. Additions typically reflect propositions resolved (truth-value determined) within the preceding 12 months.  
  4.3. Propositions remain on the AQS indefinitely once added, *except* where their truth-value becomes permanently indeterminate (see Clause 9.3).

  **5. Scoring Methodology**  
  5.1. Credences will be assessed using the Brier Scoring Rule, a Strictly Proper Scoring Rule (SPSR).  
  5.2. The Brier Score for a single proposition credence `c` is calculated upon resolution (truth-value `v` = 1 or 0) as:  
      `Score = (v - c)^2`  
      Lower scores indicate greater accuracy.  
  5.3. A Household’s Aggregate Quarterly Score is the mean Brier Score across all propositions on the AQS resolved within that quarter.  
  5.4. **Calibration Rebate:** A small rebate (0.5% reduction in Aggregate Score) is applied for demonstrable calibration (Clause 7).

  **6. Epistemic Standards & Offences**  
  6.1. **Accuracy-Dominance Principle:** Holding incoherent credences (i.e., credences violating the axioms of probability) constitutes an Epistemic Hygiene Offence (EHO) Grade 1. This is *not* predicated on potential financial loss (e.g., Dutch Books), but solely on the demonstrable fact that such credences are *accuracy-dominated*: there exists an alternative coherent set guaranteed to be at least as accurate, and possibly more accurate, regardless of the truth.  
  6.2. **Conditionalization Duty:** Households have a duty to *plan* for credence updating via conditionalization upon receipt of new evidence. Form E-101 requires declaration of the *planned update procedure* for key evidence streams (e.g., "Upon receipt of OES Weather Bulletin, conditionally update credence in Proposition AQS-1.07"). Failure to declare a viable plan constitutes an EHO Grade 2. *Achieving* coherence post-update is desirable but secondary to the existence of the plan; the focus is on maximising *expected* accuracy.  
  6.3. **Sincerity & Reporting:** An SPSR guarantees that *expected* accuracy is maximised uniquely by reporting one’s true credence. Deliberate misreporting ("sincerity failure") is therefore epistemically self-defeating and cannot be directly detected or penalised under this scoring regime. Households should report sincerely for their own epistemic good.

  **7. Calibration Assessment & Sharpness Requirement**  
  7.1. Calibration assesses whether declared credences reliably match long-run truth-frequencies.  
  7.2. **Calibration Rebate Eligibility:** Requires that for any declared credence value `x` used at least 10 times within the quarter across the AQS, the proportion of true propositions among those assigned `x` is within ±0.05 of `x`.  
  7.3. **Sharpness Rider:** To prevent strategic evasion through uniform reporting (e.g., perpetually declaring `c=0.5` to trivially achieve calibration), the Calibration Rebate is *only* awarded if the Household’s declared credences also demonstrate sufficient *refinement* (dispersion). A minimum Variance of 0.04 across all declared credences per quarter is required. Declarations failing this Sharpness Requirement forfeit the rebate and may trigger an OES Advisory Notice.

  **8. Treatment of "No View"**  
  8.1. Reporting a credence is mandatory for every AQS proposition.  
  8.2. The state colloquially termed "No View" must be operationalised. Households genuinely holding no determinate degree of belief *must* report `c = 0.5`.  
  8.3. Note: Reporting `c=0.5` constitutes a precise epistemic commitment with measurable accuracy consequences under the Brier Score (e.g., `Score=0.25` if true, `Score=0.25` if false). It is *not* epistemically neutral.

  **9. Resolution & Verification**  
  9.1. The OES, utilising designated Certified Credence Auditors (CCAs) and approved external sources (e.g., National Meteorological Archive, Sports Results Bureau, Peer-Reviewed Journal Alerts), will determine the truth-value (`v=1` or `v=0`) for each AQS proposition as soon as reasonably practicable after the relevant evidence is uncontroversially available.  
  9.2. Propositions unresolved after 5 years may be designated "Archived - Indeterminate" by the OES and removed from future scoring (but remain on the historical AQS).  
  9.3. Households may appeal resolution determinations to the First-Tier Epistemic Tribunal within 28 days of notification.

  **10. Incentives**  
  10.1. Aggregate Quarterly Scores will be published in the Credwell Parish Epistemic Hygiene League Table.  
  10.2. Households maintaining an Aggregate Score below the Parish Threshold (initially set at 0.15) for four consecutive quarters qualify for a Small Epistemic Responsibility Rebate (£15) on their local Council Tax.

  **11. Appeals and Support**  
  11.1. Guidance on credence formation techniques (e.g., "Reference Class Tennis: A Primer") is available on the OES website.  
  11.2. Queries regarding specific proposition interpretation or scoring must be directed to the OES Helpline (open Tues & Thurs, 10am-12pm).  
  11.3. Appeals against scoring outcomes or EHO notices follow procedure EP-REG 7B.

  **(End of Statutory Guidance Extract)**

  ---

  **ANNEX E (Specimen): Credence Return Excerpt - Household 42B (Maple Drive) - Q3 2024**

  | AQS Ref. | Proposition                                                                 | Declared Credence (c) | Auditor Notes (CCA J. Smith)                                                                 | Resolved (v) | Brier Score (v-c)^2 |
  | :------- | :-------------------------------------------------------------------------- | :-------------------- | :------------------------------------------------------------------------------------------- | :----------- | :------------------ |
  | **1.07** | High >25°C in Credwell next day (30/09/24)                                  | 0.65                  | *Supported by Met Office probability forecast (63%). Sincere reporting plausible.*           | 1            | (1-0.65)^2 = 0.1225 |
  | **2.31** | Local MP re-elected at next General Election                                | 0.90                  | *Strong prior track record cited. Coherent within declared political model. Sharp.*          | ?            | Pending             |
  | **3.15** | Average peas per pod in household's final harvest (2024) is between 6 and 7 | 0.70                  | *Declarant notes "counted 5 pods last year, avg 6.2". Calibration group '0.7' currently 2/3.* | 1            | (1-0.7)^2 = 0.09    |
  | **4.02** | New "QuantumYum" yogurt reduces cavity risk (per mfr. claim)                | 0.50                  | *Declared as "No View". Matches OES definition. Variance watch: Frequent 0.5 declarations.*  | ?            | Pending             |
  | **5.19** | **Number of jellyfish in Atlantic Ocean on 01/01/2025 will be even**        | **0.60**              | ***Objection noted: "How could anyone know?". Guidance clear: Subject matter irrelevant. Accuracy requires a number. Evasion risk? Sharpness requirement just met (V=0.041).*** | ?            | Pending             |
  | **...**  | ...                                                                         | ...                   | ...                                                                                          | ...          | ...                 |
  | **7.44** | Beethoven's 3rd Symphony premiered before 1805                              | 0.10                  | *Declarant states "vague memory of 1805". Actual premiere: 1805-04-07 (False). Score=0.81!*  | 0            | (0-0.10)^2 = 0.01   |

  *(Variance Calculation: 0.041 - Rebate Awarded)*

  ---

  **Statement from OES Spokesperson (Attributed):**
  "The Credwell Pilot is a landmark step towards empirically grounded epistemic hygiene. By utilising strictly proper scoring rules, we incentivise sincere reporting and coherence *without* recourse to crude financialisation. The calibration rebate, balanced with the sharpness requirement, tackles both reliability and informativeness. The framework treats all propositions equally because accuracy – closeness to truth – is the fundamental epistemic good, whether concerning peas or public health. The scheme rigorously avoids paternalism about *which* truths matter; it simply ensures that when beliefs *are* held, they meet objective standards of probabilistic rationality and evidential responsiveness."

  ---

  **Comment from Resident, Household 42B (Maple Drive):**
  "It's the peas and the jellyfish that get me. I had to guess about the peas to stop them nicking my rebate over 'variance'. And the jellyfish! I put 0.6 because... well, even or odd, it's a coin flip, right? But then the Auditor's note says it *might* be evasion? Evasion of *what*? Knowing about jellyfish? My neighbour just puts 0.7 for everything he doesn't care about. Says it's 'efficient'. The weather and the MP stuff, fine. But the rest? It feels like I'm making stuff up just to fill out their forms properly. What does any of this *mean*?"

  ---

  **Comment from Certified Credence Auditor (Credwell Panel):**
  "The practical challenge is the Schedule's sheer breadth. Auditing sincerity is impossible per Section 6.3 – the maths forbids it. My role is checking coherence of the declared credences against each other and the update plans, verifying resolution sources, and calculating scores/calibration. The 'no view = 0.5' rule creates tension. Household 42B's 0.5 on the yogurt? Probably sincere ignorance. Their 0.6 on jellyfish? Is that genuine uncertainty or gaming the sharpness requirement? The framework provides no tools to distinguish. We apply the rules mechanically. The equal weighting feels arbitrary – a wrong credence about peas hurts your score as much as one about election fraud. But the Guidance is clear: truth is truth."

  ---

  **Note for the Columnist (Not for Publication):**

  **Leaning:** The piece targets the **radical equal treatment of propositions** inherent in pure accuracy-first frameworks that lack weighting by subject matter significance. The satire argues this leads to absurd bureaucratic mandates to quantify belief on inherently meaningless or unknowable questions (jellyfish parity), where "sincere" reporting becomes nonsensical performance. The framework's silence on *value* forces the regulator into this position.

  **Canonical Reading:** It takes the core accuracy-first program (e.g., Joyce, Pettigrew) at face value: truth-closeness as the sole fundamental epistemic good, vindicating coherence/conditionalization via dominance/expected accuracy arguments, using SPSRs.

  **Contested Claim:** The **sharpness rider** (Clause 7.3) is a necessary kludge within the system to prevent trivial calibration, but its implementation (mandating minimum variance) is crude and contestable. A defender might argue that in a *mature* system with a well-curated AQS containing only "proper" questions, sharpness would emerge naturally without mandates. The satire highlights that defining "proper" is outside the framework.

  **Strongest Defender's Reply:** "The jellyfish example is a straw man *you created* via the AQS. Accuracy-first doesn't *demand* we have credences on everything; it governs how we *should* form them *if we do*. The OES's mistake is mandating returns on propositions where suspension (operationalized as 0.5) *is* the rational response. The framework's strength is showing suspension *isn't* cost-free (Brier scores 0.25!), exposing the price of ignorance. The equal treatment is a *feature*: it forces us to confront whether holding a belief on trivial matters is worth the epistemic risk, potentially promoting valuable suspension."
