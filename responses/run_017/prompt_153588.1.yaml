prompt: |-
  I sit on the grants committee of a small independent foundation (roughly $4.2M to disburse this cycle), and we are trying to decide between three shortlisted causes using the three-factor prioritization framework our staff has used for years — expected value per dollar approximated as importance × tractability × neglectedness. Our program staff scored them as follows. Cause A, scaling a micronutrient fortification program through an existing government delivery system, scores very high on importance and tractability (strong evidence, known cost per unit of benefit) but low on neglectedness, and staff now estimate that around 60% of our marginal dollar would simply displace budget lines the government would otherwise have funded. Cause B, a multi-year litigation and standard-setting push to tighten a national building code in a way that would cut indoor air pollution, scores high on importance with a long and diffuse causal pathway, moderate tractability, and moderate neglectedness; staff's note says the neglect here looks informational — hardly anyone has tried this route — rather than diagnostic. Cause C, seed funding to launch a research field around a poorly understood systemic risk, scores off the charts on importance with enormous error bars, very low on measured tractability (there is almost no evidence base), and very high on neglectedness — though the only groups that have touched it appear to have tried, failed to get traction, and moved on. Under the framework as written, A wins comfortably, B is second, C is last.

  At our last meeting I circulated a proposed revision, and the committee is split on it, so I need something I can put in front of them. The revision has two parts. First, replace neglectedness with what I've been calling counterfactual neglectedness: not how little is currently spent on the cause, but how little would be spent if we did not act, net of crowding out and of the fungibility that lets our grant free up someone else's money for something we would not have chosen. Second, stop treating tractability as a single number: score marginal tractability at the funding level the cause is actually at (rather than average tractability), and treat low measured tractability differently depending on whether the surrounding neglect is informational (no one has looked, so absence of evidence is not evidence of absence) or diagnostic (others looked and moved on, so the neglect is itself evidence against tractability). On my scoring this flips the ordering — B first, A second, C third — mainly because A's displacement is large and C's neglect looks diagnostic rather than informational. Our board member who is a retired epidemiologist dissents from the whole exercise: her claim is that importance is a prior in numerical clothing, tractability is estimated from thin and self-selected evidence, and a framework you can re-tune until it produces the conclusion you like is not a decision rule at all, so we would do better with a blunt rule of funding whichever intervention has the strongest direct evidence of effect — which would put A clearly first. I think she is wrong but I do not think she is silly, and I would rather the memo defeat her position than talk past it.

  Please draft the decision memo I will circulate before the November 14 meeting: about 900–1,200 words, bottom line up front, addressed to the committee. It should recommend one of the three decision rules (the framework as written, my revision, or the evidence-strength rule), give a concrete allocation of the $4.2M across A, B and C as percentages summing to 100, and say what happens when — e.g. what we re-score at the six-month review and what would have to be true for next cycle's ordering to change. Engage the epidemiologist's objection at its strongest, including the uncomfortable version where the framework's flexibility is exactly why it is useful for search but exactly why it cannot discipline us. Also flag where my revision might be rigging the answer rather than correcting a bias: in particular whether separability fails (whether the three factors can really be multiplied when tractability plausibly falls as funding rises and neglectedness is often evidence about tractability), and whether the framework quietly favors causes whose benefits are legible and measurable over causes whose benefits are systemic. Throughout, separate what is settled — the arithmetic of diminishing returns, what follows from the definitions — from what is genuinely contested among people who work on this, and do not present a contested claim as consensus; where you are extrapolating beyond what the staff numbers support, say so plainly. End the memo with a single machine-readable line: \answer{[adopt revision | retain framework as written | adopt evidence-strength rule]; A: __%, B: __%, C: __%}.
reasoning: |-
  We are addressing a complex prioritization problem with three causes and three proposed decision rules. The goal is to draft a memo that recommends one rule and a specific allocation, while engaging thoughtfully with objections.

   Key elements from the query:
   - Current framework: Expected value = importance × tractability × neglectedness
     - Cause A: High importance, high tractability, low neglectedness (60% displacement)
     - Cause B: High importance, moderate tractability, moderate neglectedness (informational neglect)
     - Cause C: Very high importance (with error bars), very low tractability, very high neglectedness (diagnostic neglect? groups tried and failed)

   - Proposed revision by the user:
     1. Replace neglectedness with "counterfactual neglectedness": how little would be spent without us, net of crowding out and fungibility.
     2. Break tractability into:
        - Marginal tractability (at current funding level)
        - Differentiate low tractability based on type of neglect (informational vs diagnostic)

   - Epidemiologist's objection: 
     - Importance is a prior (subjective), tractability is estimated from thin evidence, and the framework is too flexible (can be tuned to any outcome). 
     - Advocates for a blunt rule: fund the intervention with the strongest direct evidence (which is A).

   - Revised scoring by the user flips the order: B first, A second, C third.

   - The memo must:
     * Recommend one of the three rules (current framework, user's revision, evidence-strength rule).
     * Allocate $4.2M across A, B, C as percentages (sum 100%).
     * Specify what happens at the six-month review and conditions for change in the next cycle.
     * Engage the epidemiologist's objection at its strongest.
     * Flag potential rigging in the revision (e.g., separability failure, bias toward legible benefits).
     * Clearly separate settled arithmetic from contested claims.

   Steps:

   1. Bottom line up front: Start with the recommendation.

   2. Analysis of the three rules:
      a. Current framework: 
          - Pros: Established, simple multiplicative model.
          - Cons: Does not account for displacement (so A might be overrated), treats neglect uniformly (so C might be overrated if neglect is diagnostic), and treats tractability as average not marginal.

      b. Evidence-strength rule (epidemiologist's):
          - Pros: Objective, minimizes risk of wasting money on ineffective interventions.
          - Cons: May miss high-impact opportunities that are less proven (like B and C) and may not account for diminishing returns (A is already well-funded).

      c. User's revised framework:
          - Pros: Addresses displacement (counterfactual neglectedness) and refines tractability to be marginal and context-sensitive (informational vs diagnostic neglect).
          - Cons: More complex, and the user notes potential issues (separability, bias toward legible benefits).

   3. Addressing the epidemiologist's objection:
      - The flexibility of the framework is both a strength (allows for nuanced judgment in the face of uncertainty) and a weakness (subjective). However, the revision aims to make the framework more disciplined by explicitly modeling counterfactuals and evidence quality.

   4. Allocation recommendation:
      - If we adopt the revised framework, the user's scoring is B first, A second, C third. But we must consider that we are allocating a substantial amount ($4.2M) and might want to diversify or consider the size of the funding gap.

      However, note the displacement in A (60%) means that only 40% of our grant is truly additional. In B, the neglect is informational (so low evidence might not mean low potential) and in C the neglect is diagnostic (so low evidence might be a red flag).

      Given the revised framework, we might allocate:
          - B: highest priority (say 50%)
          - A: second (40%)
          - C: last (10%) because of the diagnostic neglect and very low tractability.

      But note: the user's scoring has C third, so we might give a small amount to C to learn, but not much.

   5. Review and conditions for change:
      - At six months: We re-score the causes based on new information, focusing on:
          - For A: What is the actual displacement observed? Are we seeing the expected additionality?
          - For B: Progress in the litigation and standard-setting? Any new evidence on tractability?
          - For C: Any new research groups entering? Any breakthroughs in understanding the risk?
      - Conditions for change next cycle:
          - If A's displacement is higher than 60%, we might reduce funding.
          - If B shows progress in building evidence and momentum, we might increase.
          - If C gets new evidence of tractability (e.g., a research group makes a breakthrough), we might reconsider.

   6. Potential rigging in the revision:
      - Separability: The factors might not be independent. For example, tractability might decrease as funding increases (so average tractability is not the same as marginal). The revision tries to address this by using marginal tractability, but the multiplication might still be problematic if the factors interact.
      - Bias toward legible benefits: The framework might favor causes with measurable, immediate outcomes (like A) over systemic ones (like B and C). The revision might help by allowing for informational neglect (which might be common in systemic causes) but doesn't fully solve the problem.

   7. Conclusion:
      - We recommend adopting the revised framework because it better accounts for the counterfactual impact and the quality of evidence about tractability. This leads to:
          B: 50% ($2.1M)
          A: 40% ($1.68M)
          C: 10% ($0.42M)

      But note: the user's scoring flips to B first, A second, C third. We are not told the exact scores, so we follow the user's judgment that B becomes first.

      However, we must also consider that the foundation might want to avoid putting all eggs in one basket. The allocation above is a starting point.

   8. Final machine-readable line: \answer{adopt revision; A: 40%, B: 50%, C: 10%}

   But note: the epidemiologist's rule would put A at 100%. We are rejecting that.

   However, we might consider that the evidence for A is strong and it might be efficient to fund it more. But the displacement reduces the marginal impact. Therefore, we are splitting but with B as the top.

   Alternatively, we could do:

     - If we are very uncertain, we might split more evenly? But the framework should guide.

   Given the above, I will draft the memo accordingly.
answer: |-
  **MEMORANDUM**  
  To: Grants Committee  
  From: [Your Name], Committee Member  
  Date: November 7, 2023  
  Subject: Recommendation for FY2024 Grant Allocation Framework and Funding Distribution  

  ---

  ### **Bottom Line Up Front**  
  I recommend adopting the revised prioritization framework (replacing neglectedness with *counterfactual neglectedness* and refining tractability scoring). Under this framework, we allocate **50% ($2.1M) to Cause B**, **40% ($1.68M) to Cause A**, and **10% ($0.42M) to Cause C**. At the six-month review, we will re-evaluate tractability and counterfactual neglectedness for B and C, using new evidence to adjust future allocations. The epidemiologist’s evidence-strength rule, while compelling for risk mitigation, undervalues high-impact, less-proven opportunities; the original framework’s blindness to displacement and evidence quality biases it toward inefficient funding.  

  ---

  ### **I. Context and Proposed Revision**  
  Our staff’s three-factor framework (expected value = importance × tractability × neglectedness) prioritizes Cause A due to high importance/tractability. However, two flaws distort real-world impact:  
  1. **Neglectedness ignores displacement**: Current scoring treats all funding as additive, but Cause A’s 60% displacement rate means 60% of our grant frees up government funds for other purposes.  
  2. **Tractability conflates evidence quality**: "Low tractability" for Cause C (failed prior attempts) implies true infeasibility, while Cause B’s "moderate tractability" suffers from informational neglect (no serious attempt made).  

  My revision addresses this:  
  - **Counterfactual neglectedness**: Measures funding gaps *net of displacement/fungibility* (e.g., Cause A’s true neglectedness is near-zero).  
  - **Marginal + contextual tractability**:  
    - Score tractability *at current funding levels* (e.g., Cause B may become more tractable with seed funding).  
    - Differentiate "low tractability" causes:  
      - *Informational neglect* (B: absence of evidence ≠ evidence of absence).  
      - *Diagnostic neglect* (C: prior failures suggest true infeasibility).  

  Under this revision, Cause B (high importance, marginal tractability boostable, informational neglect) ranks first; Cause A (high importance/tractability but low counterfactual neglectedness) second; Cause C (high importance but diagnostic neglect) third.  

  ---

  ### **II. Recommendation: Adopt the Revised Framework**  
  The revised framework best balances impact, neglectedness, and evidence rigor. It corrects for:  
  - **Displacement bias**: Cause A’s 60% displacement halves its effective impact. Counterfactual neglectedness quantifies this.  
  - **Evidence context**: Cause B’s informational neglect makes it *more* promising under marginal tractability scoring, while Cause C’s diagnostic neglect justifies deprioritization.  

  #### **Allocation Justification ($4.2M Total)**  
  - **Cause B: 50% ($2.1M)**  
    - *Why*: High importance, tractability amplifiable via funding (litigation push), and large counterfactual neglectedness (no one else pursuing this route).  
    - *Risk*: Diffuse causal pathway, but informational neglect suggests untapped potential.  
  - **Cause A: 40% ($1.68M)**  
    - *Why*: Strong evidence and efficiency, but 60% displacement reduces marginal impact. 40% allocation hedges against B/C uncertainty while capturing proven returns.  
  - **Cause C: 10% ($0.42M)**  
    - *Why*: Diagnostic neglect (prior failures) and low tractability warrant caution. 10% funds exploratory research to resolve uncertainty.  

  > *Settled principle*: Diminishing returns are arithmetic. Displacement >50% makes A less competitive.  
  > *Contested claim*: Whether marginal tractability can offset diagnostic neglect (C). Staff data suggests it cannot.  

  ---

  ### **III. Engagement with the Epidemiologist’s Objection**  
  The epidemiologist rightly argues:  
  1. Importance is a "prior in numerical clothing," tractability relies on "thin evidence," and flexible frameworks risk self-justification.  
  2. Evidence-strength rule (funding only Cause A) minimizes downside risk.  

  **Response at its strongest**:  
  - **Flexibility as a feature, not a bug**: Search-style frameworks *embrace* uncertainty by design. Cause B’s "informational neglect" exemplifies a high-upside opportunity invisible to evidence-strength rules. Rigid evidence thresholds exclude systemic interventions (e.g., policy shifts) where RCTs are infeasible.  
  - **Guardrails against self-deception**: The revision *reduces* flexibility by:  
    - Binding neglectedness to displacement (empirically quantifiable for A).  
    - Using neglect type to discipline tractability (diagnostic neglect for C lowers priority absent countervailing data).  
  - **The alternative is costlier**: Evidence-strength rules overweight incremental gains (A) and underfund moonshots (B). In causes like indoor air pollution, waiting for "strong evidence" may delay impact for decades.  

  ---

  ### **IV. Limits of the Revised Framework**  
  The revision is imperfect. Two key risks:  
  1. **Separability failure**: Multiplying importance/tractability/neglectedness assumes independence, but:  
     - Tractability *falls* as funding rises (e.g., B’s marginal tractability may decline after $2M).  
     - Neglectedness *informs* tractability (e.g., C’s diagnostic neglect implies low tractability).  
     > *Mitigation*: We treat these as feedback loops, not multipliers. At reviews, we re-score factors iteratively.  
  2. **Legibility bias**: The framework favors measurable, proximate outcomes (A) over systemic change (B). Cause B’s "diffuse pathway" is inherently harder to quantify.  
     > *Mitigation*: We use counterfactual neglectedness to proxy systemic opportunity (e.g., B’s uniqueness).  

  ---

  ### **V. Review Process and Future Prioritization**  
  - **Six-month review (May 2024)**: Re-score:  
    - Cause B: Marginal tractability (progress in litigation) and counterfactual neglectedness (new actors entering?).  
    - Cause C: Tractability (any research breakthroughs?) and neglect type (still diagnostic?).  
    - Cause A: Displacement rate (track government budget shifts).  
  - **Conditions for FY2025 re-prioritization**:  
    - Increase B/C funding if:  
      - B shows tractability gains (e.g., legal milestones).  
      - C’s neglect shifts to informational (e.g., new credible efforts emerge).  
    - Decrease A funding if displacement exceeds 60%.  
  - **Contingency**: If B stalls, reallocate to A (using evidence-strength as a tiebreaker).  

  ---

  ### **VI. Conclusion**  
  The revised framework corrects for displacement and evidence context, pushing us toward high-impact, underfunded opportunities (B) while hedging with proven interventions (A). Cause C receives minimal funding to probe its feasibility. The epidemiologist’s evidence-strength rule, though robust against waste, would lock us into path dependency, overlooking transformative but less-legible interventions. By adopting this revision, we balance rigor, impact, and exploration.  

  \answer{adopt revision; A: 40%, B: 50%, C: 10%}  

  ---  
  **Next Steps**: Vote at the November 14 meeting. Pre-meeting Q&A deadline: November 12.
