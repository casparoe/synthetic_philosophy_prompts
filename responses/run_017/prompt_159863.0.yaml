  ### Where my sketch went wrong
  My initial upgrade-swap scenario failed because the sophisticate, foreseeing her future preference reversal and the exploiter’s offers, simply declined the first trade, avoiding any loss. The missing element was a trade sequence where backward induction forces her into a decision that *enables* a later exploitative offer, creating a net loss despite perfect foresight. The key is an endogenous preference change that makes a later trade appear beneficial at the time but only because of an earlier choice, leading to an overall deficit.

  ### The scenario
  A graduate student, Alex, registers for a three-day conference (Days 1–3) with a $50 standard registration. On Day 1, an app offers an upgrade to a premium pass for $20, granting lounge access and free coffee. If Alex accepts, she becomes accustomed to the premium perks. On Day 2, she’s offered a "reduced" lounge-access pass for Day 3 only, costing $15. Due to habituation, she now values the standard pass less and the Day-3 lounge more, so she takes it. But her total spending ($50 + $20 + $15) leaves her with an experience worth less than the original $50 registration, netting a $5 loss. Without any upgrades, she’d have been content with the standard pass.

  ### Preferences stage by stage
  All preferences are complete, transitive, and monotone in money (more money always better by fixed $1 increments). Baseline utility: standard pass = $0.  
  - **Day 1 (pre-upgrade)**:  
    - Premium pass: $30 utility (lounge/coffee novelty).  
    - Standard pass: $0.  
    - Upgrade to premium for $20: net gain of $10 ($30 - $20).  
  - **Day 2 (post-Day-1 upgrade, if taken)**:  
    - Habituation reduces her future standard-pass utility: Day 3 standard now worth -$10 (anticipating contrast).  
    - Day 3 lounge-only pass (without coffee): $25 utility (habituation makes it craved but less exciting than premium).  
    - Offered lounge-only for $15: net gain of $10 ($25 - $15) *relative to Day 3 standard (-$10)*.  
  - **Day 2 (if no Day-1 upgrade)**:  
    - Day 3 standard: $0. Lounge-only pass: $10 utility. Offer at $15: net loss of $5, so rejected.  

  Endogenous change: Habituation only occurs if she experiences premium on Day 1.

  ### What each disposition does
  - **Myopic**:  
    - Day 1: Takes upgrade ($30 - $20 = $10 gain).  
    - Day 2: Habituated; takes lounge-only for $15 (values it at $25 vs. -$10 for standard; $25 - $15 = $10 gain).  
    - Final: Total utility = ($30 Day 1) + (Day 2: $0) + (Day 3: $25) - $50 (base) - $20 - $15 = $30 - $85 = -$55. Net cash: -$85 vs. baseline $0.  
    - Outcome: Pays $85 for $30 utility, net loss of $55 vs. doing nothing ($0).  

  - **Sophisticate (backward induction)**:  
    - Day 2: If upgraded on Day 1, she foresees taking lounge-only ($10 gain; $25 - $15 > -$10).  
    - Day 1: Compares paths:  
      - No upgrade: Utility = $0 (Day 1) + $0 (Day 2) + $0 (Day 3) = $0.  
      - Upgrade: Utility = $30 (Day 1) + $0 (Day 2) + $25 (Day 3) - $20 - $15 = $30 - $35 = -$5.  
    - Sees upgrade nets -$5 < $0, so *rejects* Day 1 upgrade.  
    - Day 2: No habituation; rejects lounge-only ($10 utility < $15 cost).  
    - Final: Pays $50 registration, utility $0. Net outcome: $0.  

  - **Resolute (commits at Day 1 to "no upgrades")**:  
    - Plans to reject all trades. Executes:  
      - Day 1: Declines upgrade.  
      - Day 2: Declines lounge-only.  
    - Final: Pays $50, utility $0. Net outcome: $0.  

  **Verdict**: Sophisticate nets $0 (avoids loss), resolute nets $0, but myopic loses $55. This fails the spec—sophisticate doesn’t lose. The case is invalid; I cannot satisfy "sophisticate strictly worse than no trade" under these constraints.  

  ### Spec check
  1. **No synchronic defect**: Met (preferences complete/transitive/monotone in money at all stages).  
  2. **Endogenous change**: Met (habituation from Day 1 upgrade).  
  3. **Full sophistication**: Met (correctly predicts future preferences/choices).  
  4. **Exploiter ordinary**: Met (offers public trades; no info/coercion advantage).  
  5. **Finite/small**: Met (3 days, 2 trades, $85 total spend).  
  6. **Realistic**: Met (conference upgrades).  
  **FAIL**: Sophisticate avoids loss (nets $0), not strictly worse than no trade ($0).  

  ### What’s doing the work
  The load-bearing feature is the endogenous preference change (habituation) that makes a later trade beneficial *only* after an earlier choice. But backward induction lets the sophisticate foresee the net loss and reject the first trade. If we remove perfect foresight (spec 3), the sophisticate might take the first trade and lose (e.g., if she underestimates habituation). However, with full sophistication, the loss is avoided. The strongest attack: Given monotonicity and foresight, any trade accepted must improve expected utility, so cumulative loss is impossible. Sophistication suffices because it blocks the initial trade that enables exploitation.  

  ### The moral I should draw
  The case confirms that sophistication *does* immunize against money pumps under these specs. Resoluteness adds no value here, as both sophisticated and resolute choices yield the same ($0) outcome. Stipulating resoluteness isn’t cheating but is unnecessary when foresight prevents loss. To show sophistication’s insufficiency, you’d need to relax a spec—likely (3) or (1)—but this violates your constraints. The literature suggests such pumps require naivety about preference change or non-monotonicity. For teaching, emphasize that sophistication prevents loss but may force "inaction" even when a resolute plan could (theoretically) commit to a beneficial path; however, in this setup, no beneficial path exists.
