prompt: |-
  I am working on the metaphysics of future contingents, and specifically on a question the sea-battle argument tends to run together. I would like a case built to order that pulls two notions apart. Please work with the following four positions as I define them here, rather than importing other formulations.

  - **Ockhamism**: future-tense claims are bivalent and determinately true or false at the time of utterance, because there is a privileged branch — the actual future — that settles them. (I do not think the hard/soft fact distinction will do any work in the case I want; if you think it does, say where.)
  - **Occurrence-based openness**: a future-tense claim about an event that has not yet occurred has no truth value at the time of utterance; determinacy arrives with the event's occurrence or non-occurrence. Negation is internal, so the corresponding denial is likewise indeterminate beforehand.
  - **Settledness-based openness**: determinacy tracks causal settling rather than occurrence. A future-tense claim is determinately true as soon as the total state of the world at the time together with the laws nomologically fixes the outcome, and determinately false as soon as they exclude it. Outcomes not yet settled remain gappy, exactly as on the occurrence view.
  - **Assessment-relativism**: a future-tense claim receives a truth value only relative to a context of assessment, understood as a time together with a branch or world. One and the same utterance may be true relative to one such context and not true relative to another, and there is no assessment-independent verdict.

  These last three views coincide on the standard textbook cases, which is why I need a non-standard one.

  **What I want built.** An ordinary case — a clinic, a repair shop, a school, a warehouse, an architect's office; no deities, no prophets, no time travel, no exotic physics; nothing melodramatic; one paragraph — in which a professional gives a checkable assurance to someone who will rely on it, concerning an event at a later time. The case must satisfy the following.

  1. *Present fixity without occurrence.* At the time the assurance is given, the outcome is already nomologically fixed by the state of the world then plus the laws, but the event has not yet occurred. The fixity must be intervention-proof: no agent's subsequent choice, and nothing anyone could have done afterward, is part of what settles it, and nothing anyone could have done would have changed it.
  2. *Fixity that is not disguised ignorance.* The facts doing the settling must not have been ascertainable at the time by any means then available. State what those facts are and why they were hidden. If they are merely unknown-but-available, the case is an epistemic one and does no work.
  3. *One sentence, one sense.* All four views are to evaluate the same ordinary future-tense sentence in the same sense. No trading on scope, vagueness, or a shift between "will" and "is going to."
  4. *The required verdict pattern.* Design the assurance so that it is the one that comes out false. The Ockhamist and the settledness-theorist must then both say it was determinately false when given, while the occurrence-theorist must say it was indeterminate then and became determinately false only later. Derive these verdicts from the positions; do not attach them by stipulation.
  5. *A downstream question that needs a positive verdict.* Build into the case a question that anyone would care about — which of two incompatible assurances the record should canonise, whose judgment an internal review should find sound, which adviser can be said to have been right at the time — such that the question demands attributing truth at the time of utterance to one of the two assurances. I want this because "not true" will not answer it: a verdict of mere indeterminacy, reached by external negation, cannot single out the assurance that was correct. The occurrence-theorist should therefore be left unable to deliver what the practice demands, or able to deliver it only by changing the subject, while the other views deliver it directly. If you think the practice can be satisfied after all by an external-negation reading, say so and tighten the case; if it cannot be tightened, say that instead.

  **What I want back.**

  - The scenario, followed by each view's verdict on the assurance with a sentence of reasoning, and then each view's answer to the downstream question.
  - The single feature of the case that is doing the work, and what happens to every verdict under the minimal perturbation that removes that feature.
  - An extensionality check: the smallest change to the case that breaks the agreement between the Ockhamist and the settledness-theorist, together with confirmation that the Ockhamist's own verdict is invariant under that change. That asymmetry is the signature I am after, and I would like it stated explicitly.
  - The strongest available reply from an occurrence-theorist. I have two in mind and would like both addressed: first, that an assurance such as the one in your case carries implicit ceteris-paribus conditions whose fulfilment is itself a future matter, so that the outcome was never settled at the time after all; second, that the downstream practice ought to track fault, expected value, or assertibility rather than truth-at-the-time. Tell me which is stronger and whether either actually works.
  - Two or three sentences on where assessment-relativism lands and whether your case causes it any difficulty.

  **What the case is for**, so that you can tell when you are cheating: I want to know whether the "open future" that the sea-battle argument requires is openness as non-occurrence or openness as unsettledness, since the two theses cannot be distinguished by any case in which the outcome is settled only by occurring. A case that merely labels the verdicts, one that gets its fixity from a future choice, one that reduces to somebody's ignorance, or one that secures the pattern by choosing the sentence to fit the theory, is of no use to me. If some part of the specification is jointly unsatisfiable, tell me which part and why rather than quietly relaxing it.
reasoning: |-
  We are building a case to pull apart occurrence-based openness and settledness-based openness, while also contrasting with Ockhamism and assessment-relativism. The case must have:
  1. Present fixity without occurrence: outcome is nomologically fixed at the time of the assurance but the event hasn't occurred. Fixity is intervention-proof (no future choices can change it).
  2. Fixity that is not disguised ignorance: the settling facts are hidden and not ascertainable at the time by any means.
  3. One sentence, one sense: the same future-tense sentence is evaluated by all.
  4. Verdict pattern: the assurance is false. Ockhamist and settledness-theorist say it was determinately false when given; occurrence-theorist says indeterminate then and false later.
  5. Downstream question: a question that demands attributing truth at the time to one of two incompatible assurances, so that "not true" (external negation) won't do. The occurrence-theorist should be unable to deliver the required verdict.

  Let's design the case:

  **Scenario:**

  At a city's water treatment plant, an engineer, Alex, is reviewing the daily water quality report. The report shows that a critical sensor in Tank A is reading abnormally high turbidity. Alex knows that if the turbidity exceeds a certain threshold for more than 24 hours, the tank must be taken offline for cleaning, which would disrupt the supply to a district. However, there is a backup system: if the turbidity in Tank A is too high, water can be rerouted from Tank B. But Tank B is currently undergoing maintenance and will be available only if a specific repair is completed in the next 12 hours. The repair is being done by a technician, Sam, who is working in a sealed, inaccessible clean room. The repair requires a particular component to be installed correctly. Unbeknownst to anyone, the component Sam is using is defective (due to a manufacturing flaw that occurred months ago). The defect is such that if the component is defective, the repair will fail, and Tank B will not be available. The defect is microscopic and cannot be detected by any test available at the plant (or anywhere) at the time. The laws of nature and the state of the world at the time (including the defective component) nomologically determine that the repair will fail. However, the repair process takes 12 hours, and the outcome (success or failure) will not be known until then.

  At 9:00 AM, the plant manager asks Alex, "Will Tank B be available by 9:00 PM?" Alex, having no reason to suspect the defect and knowing that Sam is highly skilled, responds with an assurance: "Yes, the repair will be completed successfully by 9:00 PM." Meanwhile, another engineer, Bailey, who is more cautious and has seen a similar failure in the past (but without knowing about the defect), says, "I'm not so sure; I think it might not be completed."

  As it turns out, the repair fails because of the defective component, and Tank B is not available at 9:00 PM.

  The future-tense sentence we evaluate is Alex's utterance at 9:00 AM: "The repair will be completed successfully by 9:00 PM."

  Now, the settling facts: the component is defective. This defect was caused by a manufacturing error months ago and is physically present in the component at 9:00 AM. Given the laws of nature and the state of the world at 9:00 AM (including the defect), the repair process must fail. No future choice or action can change this because the clean room is sealed, and the repair process is automated once started. The defect is microscopic and undetectable by any means available at 9:00 AM (e.g., no equipment at the plant or elsewhere can detect it without destroying the component, and there's no time for such tests even if they were available).

  Downstream question: The plant manager, after the failure, must decide which engineer's judgment to record in the incident report as having been correct at the time of the assurance. The report requires stating who was right at the time, not just who turned out to be right. This question demands attributing truth at the time to one of the two assurances: Alex's positive assurance or Bailey's expressed doubt (which we can interpret as a denial, i.e., "It will not be completed successfully"). Note: Bailey didn't assert the negation, but we can reframe the downstream question to compare two incompatible claims: Alex's "will" vs. Bailey's "will not". Alternatively, we can have Bailey explicitly say, "No, it will not be completed successfully." Let's adjust: At 9:00 AM, Alex says, "The repair will be completed successfully by 9:00 PM." Bailey, at the same time, says, "No, the repair will not be completed successfully by 9:00 PM."

  Now, the verdicts:

  **Ockhamism:** There is a unique actual future. At 9:00 AM, the actual future includes the failure of the repair because the defect is present and nomologically determines failure. Therefore, Alex's assurance is false at the time of utterance. Bailey's denial is true.

  **Occurrence-based openness:** At 9:00 AM, the event (successful repair) has not yet occurred. Therefore, the future-tense claim "The repair will be completed successfully by 9:00 PM" has no truth value at that time. It becomes false only at 9:00 PM when the repair fails. Similarly, Bailey's claim "The repair will not be completed successfully" also has no truth value at 9:00 AM and becomes true at 9:00 PM.

  **Settledness-based openness:** At 9:00 AM, the total state of the world (including the defective component) and the laws of nature nomologically fix that the repair will fail. Therefore, Alex's assurance is determinately false at the time of utterance. Bailey's claim is determinately true.

  **Assessment-relativism:** The truth value of Alex's utterance is relative to a context of assessment. Relative to a context at 9:00 PM (after the failure) on the actual branch, the utterance is false. Relative to a context at 9:00 AM, no truth value is assigned (or it might be indeterminate) because the future is open. However, note that assessment-relativism allows for different contexts: relative to a context at 9:00 AM that adopts the actual branch, it might be false, but that is not standard. Typically, at 9:00 AM, all branches are open, so relative to a context at 9:00 AM, the utterance is not true. But the assessment-relativist might say that relative to a context after 9:00 PM, it is false.

  Downstream question: The plant manager asks, "At 9:00 AM, was Alex's assurance true or false?" and also "At 9:00 AM, was Bailey's denial true or false?" The practice demands a positive verdict: one was true at the time and the other false.

  - **Ockhamist:** At 9:00 AM, Alex's assurance was false; Bailey's was true. So the report should canonize Bailey as correct at the time.
  - **Settledness-theorist:** Same as Ockhamist: Alex's was false, Bailey's true at 9:00 AM.
  - **Occurrence-theorist:** At 9:00 AM, neither was true or false. Both were indeterminate. Therefore, the occurrence-theorist cannot say that Bailey was true at the time. The best they can say is that Bailey turned out to be right, but that is not the same as being true at the time. The practice (which asks for who was correct at the time) cannot be satisfied by the occurrence-theorist without changing the subject to something like assertibility or fault. They might say that Bailey was more reasonable, but the question is about truth at the time.
  - **Assessment-relativist:** Relative to the context of assessment at 9:00 PM (after the fact), Alex's utterance is false and Bailey's is true. So for the purpose of the report (which is written after the fact), we can say that Bailey was correct. But note: the downstream question is about truth at the time of utterance. The assessment-relativist might say that relative to a context at 9:00 AM, the utterance was not true, but that doesn't make Bailey true at that context. However, the assessment-relativist can also assess from the same context of assessment (say, at 9:00 PM) both utterances. They can say that relative to that context, Bailey's utterance is true and Alex's is false. But that doesn't say anything about the time of utterance. The downstream question might be interpreted as: from our current perspective, which one was true at the time? The assessment-relativist might say that relative to our current context, Alex's utterance was false (at the time of utterance) because we are assessing from a context that has the actual future. But note: the assessment-relativist typically holds that the same utterance can be true relative to one context and false relative to another. So the question "Was it true at the time?" is ambiguous. The assessment-relativist might say that relative to a context at 9:00 AM, it was not true, but relative to a context at 9:00 PM, it was false (at the time). This is messy. However, for the downstream practice, since the report is written after the fact, the assessment-relativist can use the current context and say that, relative to now, Alex's utterance was false at the time and Bailey's was true at the time. So they can deliver the verdict.

  But note: the occurrence-theorist cannot deliver a truth-value at the time, but the assessment-relativist, by using a context of assessment after the fact, can assign a truth-value at the time relative to that context. So the assessment-relativist can satisfy the downstream demand by choosing the appropriate context.

  Now, the feature doing the work: The outcome is nomologically fixed at the time of the assurance by a hidden fact (the defective component) that is not ascertainable at the time, and the event (the repair outcome) has not yet occurred. This creates a gap between settledness and occurrence.

  Minimal perturbation: If we remove the hidden defect and instead make the outcome depend on a future choice (e.g., Sam might decide to skip a step), then the settledness-theorist would no longer say it's fixed at 9:00 AM. The Ockhamist might still say it's true or false (if there's a privileged branch), but the settledness-theorist would say it's not settled until Sam's choice. Then the verdicts would change: settledness-theorist would say indeterminate at 9:00 AM, so the pattern is broken.

  Extensionality check: We need a minimal change that breaks the agreement between Ockhamist and settledness-theorist. The settledness-theorist requires nomological settling at the time, while the Ockhamist requires a privileged branch (which may be settled by facts that are not nomologically determining). So imagine a case where the outcome is not nomologically fixed at the time of utterance, but there is a privileged branch (actual future) that is settled by non-nomological facts (e.g., a future free action). For example: Sam has a choice at 10:00 AM to use a backup component or not. If he uses it, the repair succeeds; if not, it fails. The actual future has Sam not using it (by his free choice). The settledness-theorist would say that at 9:00 AM, the outcome is not settled (because Sam's choice is not determined). So Alex's assurance is indeterminate. The Ockhamist, however, says that at 9:00 AM, the actual future is fixed and includes Sam's choice to not use the backup, so the repair fails and Alex's assurance is false. Now, in this changed case, the Ockhamist and settledness-theorist disagree: Ockhamist says false, settledness-theorist says indeterminate. The Ockhamist's verdict is invariant under this change because the actual future is fixed (by the privileged branch) regardless of when it becomes nomologically settled.

  In our original case, they agreed because the outcome was nomologically fixed at the time. In the changed case, the outcome is fixed for the Ockhamist (by the actual future) but not for the settledness-theorist (because it is not causally settled).

  Reply from occurrence-theorist:

  1. Implicit ceteris-paribus conditions: The occurrence-theorist might argue that Alex's assurance "The repair will be completed successfully" carries an implicit condition that no unforeseen defect will interfere. Since the defect was unforeseen and not part of the ceteris-paribus conditions, the outcome wasn't settled because the ceteris-paribus conditions were not met. However, in our case, the defect is part of the state of the world at the time and is nomologically sufficient for failure. The assurance is about the repair being completed, and the defect is a present fact that dooms it. The occurrence-theorist might still say that the assurance is conditional on the component being functional, which is a future matter (until the repair is done, we don't know). But note: the component is already defective at the time of utterance. The defect is a present fact. So the ceteris-paribus condition (if we include the component being functional) is already violated at the time of the utterance? But the utterance is about the future event. The occurrence-theorist might say that the truth conditions require the event to occur, so the present defect doesn't make it false until the failure occurs. This is the core of the dispute. The occurrence-theorist's point might be that until the repair process runs, the outcome isn't real, so the future-tense claim isn't true or false. This is precisely what we are testing. The occurrence-theorist would stick to their view. But note: the case is designed so that the defect is a present fact that settles the outcome, so the occurrence-theorist cannot say that the outcome is not settled by present facts without retreating to epistemic considerations (which we have ruled out by making the defect hidden but physically present). The occurrence-theorist might argue that the defect doesn't settle the outcome until it causes the failure, but that is the settledness view. So I think the first reply doesn't work because it conflates the condition for truth with the condition for settledness.

  2. The occurrence-theorist might argue that the downstream practice should track fault (who was to blame) or expected value (who was reasonable), not truth at the time. They might say that Alex was not at fault because they had no way of knowing about the defect, and Bailey was just lucky. So the report should say that Alex's assurance was reasonable but turned out false, while Bailey's doubt was prudent. But the question explicitly asks for who was correct at the time, meaning who was speaking truly. The occurrence-theorist cannot say that Bailey was speaking truly at the time because they hold that the future-tense claim had no truth value. They might try to reinterpret the downstream question to be about who was ultimately vindicated, but that is not the same as being true at the time. The practice demands a truth-value at the time. The occurrence-theorist is forced to say that at the time, neither was true, so they cannot deliver the required verdict without changing the subject to assertibility or fault. The stronger reply is the second: that the practice should not be tracking truth at the time but something else. But if the practice is explicitly framed in terms of truth at the time, then the occurrence-theorist must either deny that the practice is legitimate or reinterpret it. They might say that the notion of "correct at the time" is not about truth but about justification. However, if the practice insists on truth, they are stuck.

  Assessment-relativism: As noted, the assessment-relativist can use a context of assessment after the fact to assign a truth-value to the utterance at the time of utterance (relative to that context). So relative to the post-9:00 PM context, Alex's utterance was false at the time of utterance. Therefore, they can say that Bailey was correct at the time (relative to the current context). So the downstream practice can be satisfied. The case does not cause assessment-relativism any particular difficulty because it allows for truth-value assignment relative to a context that includes the actual outcome.

  Summary:

  - **Scenario:** Water treatment plant repair with a defective component that is undetectable and present at the time of the assurance. The repair must fail due to the defect, but the repair takes 12 hours. Alex assures success; Bailey denies it. The repair fails.

  - **Verdicts:**
    - Ockhamism: False at utterance (because the actual future has failure).
    - Occurrence-based: Indeterminate at utterance, false after failure.
    - Settledness-based: False at utterance (because nomologically fixed).
    - Assessment-relativism: Relative to a post-failure context, false at the time of utterance.

  - **Downstream question:** "At 9:00 AM, was Alex's assurance true or false?" and similarly for Bailey.
    - Ockhamist and settledness-theorist: Alex's false, Bailey's true at 9:00 AM.
    - Occurrence-theorist: Neither had a truth value at 9:00 AM; cannot say Bailey was true at the time.
    - Assessment-relativist: Relative to the current (post-failure) context, Alex's was false at the time and Bailey's was true at the time.

  - **Feature doing the work:** The outcome is nomologically fixed by a hidden present fact without the event having occurred.

  - **Minimal perturbation:** Remove the hidden defect and make the outcome depend on a future free choice. Then settledness-theorist says indeterminate at 9:00 AM, while Ockhamist may still say false (if the actual future is fixed). Agreement broken.

  - **Extensionality check:** The minimal change is to have the outcome settled by a future free choice (not nomologically fixed at the time). Then Ockhamist (who has a privileged branch) says false at 9:00 AM, but settledness-theorist says indeterminate. The Ockhamist's verdict remains false because the actual future is fixed.

  - **Occurrence-theorist's replies:**
    1. Implicit ceteris-paribus: The assurance is conditional on no defects, but the defect is already present. The occurrence-theorist cannot use this to avoid settledness without begging the question. It doesn't work.
    2. Downstream practice should track fault or assertibility: This is the stronger reply. The occurrence-theorist can say that the practice should not demand truth at the time because there is none. But if the practice insists on truth at the time, the occurrence-theorist must either reform the practice or deny it. The case shows that if we have practices that require truth-values for future contingents at the time of utterance, the occurrence-theorist cannot accommodate them when the outcome is settled but not occurred.

  - **Assessment-relativism:** It lands by allowing a truth-value relative to a post-factum context. The case doesn't cause it difficulty because it can assign truth-values relative to contexts that include the actual outcome.

  Thus, the case successfully distinguishes occurrence-based openness from settledness-based openness by having a future event that is settled by present hidden facts but has not yet occurred.
answer: |-
  ### Custom-Built Case: Water Treatment Plant Repair

  At the city's water treatment plant, an engineer, Alex, assures the plant manager during a 9:00 AM meeting: "The backup pump will be operational by 6:00 PM." This assurance is based on a routine repair underway in a sealed, vibration-sensitive chamber. Unbeknownst to anyone, a critical gasket installed during maintenance the previous day has a microscopic manufacturing flaw (caused by a temperature irregularity in the factory months prior). The flaw is undetectable by any non-destructive testing method available at the time—microscopy, pressure tests, or material scans would disrupt the repair or exceed technical capabilities—and the chamber is inaccessible once sealed. The laws of fluid dynamics and material science, combined with the gasket's defective state at 9:00 AM, nomologically determine that the pump will fail a pressure test at 5:30 PM, rendering it non-operational by 6:00 PM. No subsequent intervention can alter this outcome: the repair process is automated and sealed, and human access is physically impossible until completion. The pump fails as predicted. Meanwhile, a junior engineer, Bailey, had objected at the meeting: "No, the backup pump will not be operational by 6:00 PM," citing general risk factors.

  **Future-tense sentence evaluated by all views**:  
  Alex's utterance at 9:00 AM: "The backup pump will be operational by 6:00 PM."  
  Bailey's utterance at 9:00 AM: "The backup pump will not be operational by 6:00 PM."

  ---

  ### Verdicts on Alex's Assurance at Time of Utterrence (9:00 AM)

  - **Ockhamism**:  
    **Determinately false.**  
    Reasoning: The privileged branch (actual future) includes the gasket flaw, which fixes the pump's failure. Alex's claim about the future is false because the actual future does not include operational status by 6:00 PM.

  - **Occurrence-based openness**:  
    **Indeterminate (no truth value).**  
    Reasoning: The event (pump operational by 6:00 PM) has not yet occurred or failed to occur. Truth value emerges only at 6:00 PM when the failure is realized; at 9:00 AM, the claim is neither true nor false.

  - **Settledness-based openness**:  
    **Determinately false.**  
    Reasoning: The total state of the world at 9:00 AM (including the gasket flaw) and the laws of nature nomologically fix the pump's failure. Since the outcome is causally settled, Alex's claim is false at utterance.

  - **Assessment-relativism**:  
    **No assessment-independent truth value; false relative to post-6:00 PM contexts, indeterminate relative to 9:00 AM contexts.**  
    Reasoning: Truth is relative to a context of assessment. Relative to a context at 9:00 AM (lacking outcome knowledge), the utterance has no truth value. Relative to a context after 6:00 PM (knowing the failure), it is false.

  ---

  ### Downstream Question and Answers  
  **Question**: For an internal review, which engineer's judgment should be recorded as "correct at the time of the meeting" (9:00 AM), based on the truth of their assurance then? This requires attributing truth to one utterance at the time of utterance, as the review demands a binary verdict on who was *right* at that moment, not just who was vindicated later.

  - **Ockhamism**:  
    Bailey was correct (true). Alex was incorrect (false).  
    Reasoning: At 9:00 AM, Bailey's denial was true in the actual future, and Alex's assurance was false.

  - **Occurrence-based openness**:  
    **Cannot deliver a verdict.**  
    Reasoning: Neither claim had a truth value at 9:00 AM. The review's demand for a "correct" judgment based on truth-at-the-time cannot be met; only post-hoc vindication (Bailey was "right" after 6:00 PM) is possible. This changes the subject to assertibility or fault (e.g., "Alex was reasonable but unlucky").

  - **Settledness-based openness**:  
    Bailey was correct (true). Alex was incorrect (false).  
    Reasoning: At 9:00 AM, causal settledness made Bailey's denial true and Alex's assurance false.

  - **Assessment-relativism**:  
    Relative to the review's context (post-failure), Bailey was correct at the time (true), and Alex was incorrect (false).  
    Reasoning: The review occurs post-6:00 PM, so it uses a context where the actual outcome fixes the truth value at the time of utterance.

  ---

  ### Key Feature Doing the Work  
  **Nomological fixity via a hidden, intervention-proof present fact without occurrence.**  
  The gasket flaw at 9:00 AM fixes the failure nomologically, but the event (pump failure) occurs later. Fixity is not epistemic (flaw is undetectable) and not agential (no future choices can intervene).  

  **Effect of minimal perturbation (removing this feature)**:  
  If the outcome depended on a future choice (e.g., a technician's decision at 10:00 AM to skip a test), fixity would not hold at 9:00 AM.  
  - *All verdicts change*:  
    - Ockhamism: May still be false (if actual future includes the choice), but not due to present fixity.  
    - Occurrence-based: Still indeterminate (no occurrence).  
    - Settledness-based: Now indeterminate (unsettled at 9:00 AM).  
    - Assessment-relativism: Unchanged (context-dependent).  
    The pattern collapses: settledness-theorist no longer agrees with Ockhamist on determinate falsity.

  ---

  ### Extensionality Check: Breaking Ockhamism/Settledness Agreement  
  **Minimal change**: Make the pump's failure settled at 9:00 AM by *non-nomological* facts (e.g., a future free action in the actual future). For example, suppose the pump's operation depends on a technician, Sam, who *will freely choose* at 2:00 PM to disable it, and this choice is part of the privileged branch but not nomologically determined at 9:00 AM.  

  - **Effect**:  
    - Ockhamism: **Still determinately false** at 9:00 AM (actual future includes Sam's choice).  
    - Settledness-based openness: **Indeterminate** at 9:00 AM (outcome not causally settled; Sam's choice is open).  
    - Asymmetry signature: Ockhamism's verdict is invariant under this change (truth depends only on the privileged branch, not causal settling), while settledness-based openness requires nomological fixity. Agreement breaks, confirming that settledness, not just branch actuality, drives the settledness-theorist's view.

  ---

  ### Replies from Occurrence-Based Openness and Assessment  
  **Occurrence-theorist's replies addressed**:  
  1. **Implicit ceteris-paribus conditions (e.g., "no hidden flaws")**:  
     - **Why it fails**: The assurance ("will be operational") is unconditional and refers to the pump's future state. The gasket flaw is a *present* fact at 9:00 AM, not a future event. Including implied conditions like "if no defects exist" would make the claim analytically true (since defects are unknown) or shift to epistemic evaluations, violating "one sentence, one sense." The occurrence-theorist cannot appeal to hidden present facts to deny settledness without conflating it with epistemology.  

  2. **Downstream practice should track fault, not truth**:  
     - **Why it is stronger but still fails**: This avoids truth-at-the-time by reframing correctness as blameworthiness (e.g., Alex was reasonable). However, the downstream question explicitly demands truth-based correctness ("who was *right* at the time"), not fault. If the practice is coerced into using assertibility (e.g., "Alex's claim was justified"), it cannot resolve the binary "correct/incorrect" verdict without smuggling in truth (Bailey's denial was "more correct" implies truth). The occurrence-theorist cannot provide the required verdict without abandoning their core tenet (no truth value pre-occurrence).

  **Stronger reply**: The "fault/assertibility" reply is stronger, as it highlights a potential mismatch between metaphysics and practice. However, it fails because the review's framing *demands* a truth-based answer; rejecting this is ad hoc and undermines practices relying on retrospective truth assessments.

  ---

  ### Assessment-Relativism's Position  
  **Where it lands**: It satisfies the downstream question by leveraging post-occurrence contexts to assign truth-at-the-time (e.g., Bailey was true at 9:00 AM relative to the review's context). This avoids the occurrence-theorist's problem.  
  **Difficulty for assessment-relativism**: The case exposes no fatal flaw, but it highlights context-dependency as a cost. If the review occurred *before* 6:00 PM, assessment-relativism might call Alex's claim indeterminate, creating inconsistency. Yet, since the case's downstream context is post-occurrence, it handles this cleanly. The core tension—between context-independent truth (Ockhamism/settledness) and context-relativity—remains, but the case doesn't exacerbate it.

  ---

  ### Confirmation of Purpose  
  This case cleanly separates **non-occurrence** (occurrence-based openness) from **unsettledness** (settledness-based openness) by ensuring the outcome is fixed without occurring. It avoids epistemic issues (undetectable flaw), agential interference (intervention-proof), and semantic shifts (one sentence). The sea-battle's "open future" is shown to be ambiguous: openness as non-occurrence (occurrence-based view) conflicts with practices needing truth-at-time, while openness as unsettledness (settledness-based view) aligns with Ockhamism on fixed outcomes. The case satisfies all specifications without cheating.
