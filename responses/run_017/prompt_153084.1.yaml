prompt: |-
  I design fault-detection and supervisory-control systems for large industrial plants, and I am fluent in that vocabulary: state estimators and residuals, sensor validation and voting between redundant channels, diagnostic coverage and silent failures, alarm rationalization and nuisance alarms, watchdog timers, and the distinction between a fault the diagnostics catch, a fault they miss, and an alarm with no fault behind it.

  In my spare time I defend a variant of the higher-order theory of consciousness: what makes a first-order mental state conscious is not a belief-like judgment about it but something closer to a validity flag, a higher-order event that marks that state as trustworthy, routes it into the wider system for use in reasoning, control, and reporting, and can be wrong in either direction, flagging a state that is absent or failing to flag one that is present. Please restate that theory and its main rivals in my vocabulary as faithfully as you can — the first-order and self-representational accounts on which no higher-order state is required, and the broadcast-style accounts on which global availability rather than a higher-order state does the work — together with the objections the higher-order theory has to answer: the misrepresentation problem and its orphan states, the regress worry, the overflow or richness argument, and the demand that the theory say how specific the higher-order state must be about the state it targets.

  Then give me the residue report. Which claims map cleanly onto diagnostic machinery, which survive only if you quietly assume a designer or an operator standing outside the system, something my plants have and a brain arguably does not, and which have no counterpart at all in anything I can say about estimators, flags, and alarms? I especially want to know where the translation silently settles a question the philosophers are still arguing about, and whether my validity-flag version is more or less exposed than the belief-like version it replaces.

  Please answer in these sections, in this order, with roughly these lengths: Translation, 500 words; Failure modes, 300 words; Residue, 350 words; Verdict, 150 words.
