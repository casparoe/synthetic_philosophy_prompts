answer: |-
  **Jurisprudence Final Exam Question**  
  **Time Allowed:** 45 minutes  
  **Word Limit:** 1000 words  

  ---

  **QUESTION**  
  In the Republic of Veredia, a long-standing social practice *P* (e.g., a consensual adult activity) is privately tolerated by 85% of citizens. However, due to **pluralistic ignorance**—where individuals mistakenly believe their private views diverge from the public majority—90% *publicly* condemn *P*. The legislature, responding to public disapproval, bans *P*. Enforcement is purely administrative: automated fines, license suspensions, and credit score deductions. There are no criminal trials, public shaming, or moral condemnation; sanctions are invisible to anyone except the offender.  

  Ten years later, polls show 80% of citizens *genuinely* disapprove of *P*. The government declares this shift proves the ban preserved Veredia’s "shared moral fabric," arguing that without the law, societal cohesion would have collapsed.  

  **Using this scenario, critically evaluate the following propositions:**  
  1. Can a state legitimately enforce moral rules *only* if they are necessary to prevent societal disintegration?  
  2. Does the Veredian outcome (shift from pluralistic ignorance to genuine conviction) support or undermine the argument that banning *P* was essential to social cohesion?  
  3. How might we determine whether a moral rule (like banning *P*) is *load-bearing* (essential to social survival) or *decorative* (replaceable without consequence)? Who bears the burden of proof?  
  4. Does enforcement require public condemnation to sustain shared morality, or is quiet compliance sufficient?  
  5. If moral dissent inherently threatens social cohesion, how can a society distinguish between destructive treason and necessary reform?  

  *Ground your analysis in the logic of the Hart/Devlin debate. No external citations are required or expected.*  

  ---

  **MODEL ANSWER** (≈800 words)  

  The Veredia scenario exposes fatal flaws in Patrick Devlin’s argument that society may enforce its "shared morality" to prevent disintegration. While Devlin claims law must reflect common morality to sustain social bonds, Veredia demonstrates that enforcement can *manufacture* the morality it purportedly defends—rendering his empirical premise circular and his justification self-defeating.  

  ### 1. Legitimacy Requires Necessity, Not Popularity  
  Devlin contends society may enforce *any* widely held moral conviction. Hart retorts that only harm prevention justifies coercion. Veredia sharpens this dispute: the initial ban rested on *illusion* (pluralistic ignorance), not genuine consensus. This reveals Devlin’s error—he conflates *popularity* with *functional necessity*. A state may only enforce morals if they are empirically indispensable to social survival (Devlin’s "disintegration thesis"). Veredia’s legislature acted on perceived public sentiment, not evidence of necessity, violating this narrower standard. Enforcement based on moral fashion is illegitimate.  

  ### 2. Manufactured Conviction as Reductio ad Absurdum  
  The government cites hardened public opposition to *P* as proof the ban preserved cohesion. This is Devlin’s thesis inverted: the law *created* the conviction that now justifies it. If enforcement can transform tolerance into genuine disapproval through subtle penalties (e.g., credit downgrades), then "shared morality" is a state artifact, not a precondition for law. This vicious circle eviscerates Devlin’s empirical claim. The outcome in Veredia is not evidence for his theory but a *reductio ad absurdum*: if disintegration occurs without enforcement, but enforcement induces the morality that prevents disintegration, the argument self-neutralizes.  

  ### 3. Load-Bearing Rules and the Burden of Proof  
  Even if societies require *some* shared morality (Hart concedes this minimally), not every rule is load-bearing. Banning *P* must be shown indispensable, like a "keystone" holding an arch together—remove it, and collapse follows. Decorative rules (e.g., historical taboos) can be replaced without consequence. Veredia’s government provided no evidence that *P*’s tolerance would cause disintegration; it assumed all morals are equally vital. The burden of proof lies with those asserting a rule’s necessity. Evidence might include:  
  - Historical examples of societies tolerating *P* without collapse,  
  - Cross-cultural comparisons showing moral variance without instability,  
  - Signs of pre-ban strain *directly* linked to *P* (absent in Veredia).  
  Without such proof, the ban is paternalistic overreach.  

  ### 4. Condemnation: Necessary or Optional?  
  Devlin assumes enforcement expresses collective indignation, sustaining morality through visible stigma. Veredia’s quiet, administrative penalties test this: automated fines lack condemnatory force. Yet disapproval still solidified. This suggests mere compliance—reinforcing the *behavioral* norm—can reshape attitudes over time, even without symbolism. However, this weakens Devlin’s case. If morality hardens through bureaucratic nudges, it confirms that law *shapes* morals instrumentally, undermining his claim that preexisting shared values *require* legal protection.  

  ### 5. The Reform Trap  
  Devlin’s view casts moral reformers as disintegrative forces. If dissent itself threatens cohesion, then any challenge to status quo morality is treasonous. Veredia’s post-ban unanimity illustrates this danger: once law manufactures conviction, dissent becomes unthinkable. Hart’s harm principle avoids this by judging reforms based on their consequences (e.g., expanding autonomy without causing harm). Societies *must* distinguish reform from treason by assessing:  
  - Whether dissent targets decorative (not load-bearing) rules,  
  - Whether new proposals reduce harm or enhance rights.  
  Devlin offers no such tool—his model inherently conserves manufactured orthodoxy.  

  **Conclusion:** Veredia proves Devlin’s theory tautological. By mistaking state-manufactured morality for organic consensus, it confuses cause and effect. Hart’s harm principle, while imperfect, avoids this by tethering coercion to tangible harms, not moral self-replication. The burden rests on states to prove a moral rule’s necessity—not its popularity—before enforcement. Anything less licenses moral tyranny.  

  ---  

  **MARKING SCHEME** (25 marks total)  

  | **Criterion**                                                                                                | **Marks** | **Common Pitfalls**                                                                 |
  | :----------------------------------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------------------------- |
  | **1. Distinguishes necessity from popularity** (Devlin’s disintegration thesis vs. mere consensus)           | /5        | *Wrong:* Equating "shared morality" with majority opinion.                         |
  | **2. Identifies circularity** (Enforcement manufactured the conviction justifying it)                        | /5        | *Wrong:* Citing the attitude shift as proof Devlin was correct.                    |
  | **3. Analyzes load-bearing vs. decorative rules** + **burden of proof** (Must show necessity, not inertia)   | /5        | *Wrong:* Assuming all moral rules are equally essential to cohesion.               |
  | **4. Critiques enforcement visibility** (Does quiet compliance suffice, or is condemnation essential?)       | /4        | *Wrong:* Ignoring the administrative/condemnation distinction in Devlin’s logic.   |
  | **5. Engages reform dilemma** (Can Devlin distinguish reform from treason? Why/why not?)                     | /4        | *Wrong:* Claiming reforms are always safe if "gradual" without principled test.    |
  | **Cap for harm-principle-only answers** (No engagement with disintegration thesis/scenario specifics)        | Max /6    |                                                                                    |

  **Note on Extrapolation:** The model answer treats *manufactured conviction via non-condemnatory enforcement* as a reductio of Devlin. While Hart critiques Devlin’s empirical claims, he doesn’t address this exact dynamic—but it follows logically from applying his skepticism to state-induced moral shift.
