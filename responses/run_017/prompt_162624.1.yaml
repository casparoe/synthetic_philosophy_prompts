prompt: |-
  I'm a TA for a third-year Metaphysics & Epistemology course and I'm second-marking a stack of short answers from last week's problem set. I wrote this question myself, right after a lecture on Fitch's paradox, and I've now been staring at scripts for long enough that I can't tell whether I'm reading what's on the page or reading my own lecture notes back into it. So I want an independent read on one of them. We did two lectures on Fitch: the basic derivation, the standard menu of responses (give up classical logic, restrict the principle, rethink the modality), and — this bit matters — in the second lecture I floated the "known by somebody at some time" repair as a discussion point and deliberately didn't tell them whether it works, so part (b) is genuinely open as far as the class is concerned.

  Here is the question, and below it one student's answer, more or less as submitted.

  **Question 3 (20 marks).** Anti-realists about a domain are often drawn to the knowability principle: (KP) every truth is knowable — i.e. for every proposition p, if p is true then it is possible that p is known. Fitch's paradox is supposed to show that this collapses into something the anti-realist cannot accept.

  (a) Set out the argument as carefully and as formally as you can, and at each step say exactly which assumption about knowledge or about modality you are using. [8]

  (b) In the lecture I floated a repair: read "known" as *known by somebody at some time* — call the resulting operator K\* — so that KP becomes: for every truth p, it is possible that somebody at some time knows p. The thought behind the repair is that the anti-realist never claimed every truth has to be within reach of *us, here, now*; they only claimed that truth is not in principle beyond inquiry, and inquiry is spread over all inquirers and all of history. Does this repair block the argument? Either re-run the argument against K\*, or say precisely which step fails and why. [7]

  (c) If the repair fails, which assumption should a defender of KP give up, and what does giving it up cost them? [5]

  **Student's answer.**

  *(a)* Write Kp for "p is known" and let the diamond be metaphysical possibility. KP is ∀p(p → ◇Kp). Non-omniscience (call it NO) says there is some truth we do not know: ∃p(p ∧ ¬Kp). Let q be such a truth, so q is true and ¬Kq.

  Since q ∧ ¬Kq is true, KP applies to the proposition (q ∧ ¬Kq), giving ◇K(q ∧ ¬Kq). Knowledge distributes over conjunction, so K(q ∧ ¬Kq) entails Kq ∧ K¬Kq; that entailment is logical, so it holds inside the possibility operator as well, giving ◇(Kq ∧ K¬Kq). Now for the second conjunct: the move from K¬Kq to ¬Kq is an instance of positive introspection, the KK principle — if you know that you do not know q, then you know your own ignorance, and so it really is the case that you do not know q. Conjoining, ◇(Kq ∧ ¬Kq), which is impossible, since nothing possible is contradictory. So the supposition that (q ∧ ¬Kq) is true must be rejected: ¬(q ∧ ¬Kq). As q was arbitrary, q → Kq, and generalising, every truth is known — contradicting NO. So KP and NO cannot both hold, and since NO is certainly true, KP has to go. The assumptions I used: distribution of K over conjunction, positive introspection (KK), the normality of the modal operator (if A strictly entails B then ◇A → ◇B), and classical logic in the final step — intuitionistically you would only get q → ¬¬Kq, so that last step is where classical logic is doing work.

  *(b)* I think the repair does block the argument, and the reason is that the Fitch sentence can no longer be constructed. K\* is not an operator which takes a proposition and returns something that is true or false at a time: "somebody at some time knows that p" is only assessable relative to a time, so "q ∧ ¬K\*q" illegitimately mixes something time-relative with something that is not, and there is no well-formed proposition there to feed into the universal quantifier in KP. The argument therefore never gets started. This is not a technical dodge either: if the instance could be formed, the argument would go through, because K\* is still factive (if somebody at some time knows p then p) and still distributes over conjunction. It is specifically the construction of the instance that fails. So the anti-realist can keep KP in the K\* form; and even if the argument did go through, all it would deliver is the weaker claim that every truth is known by someone at some time, which is not absurd in the way that present-tense omniscience is.

  *(c)* The best response is a restriction: restrict KP to propositions which do not themselves contain the knowledge operator. That is not ad hoc, because propositions without the knowledge operator are just the empirical, first-order ones, and those are all the anti-realist was ever making a claim about anyway — the whole point of KP was to tie truth to what we could in principle observe or verify. The cost is small: they lose the right to apply KP to epistemic claims like "nobody ever knows that q", which they never wanted to apply it to in the first place.

  **What I want from you:** a mark out of 20 with a breakdown by part, and — more useful to me — comments keyed to specific claims in the answer rather than a general impression. For anything you think is wrong, tell me what is wrong with it and what the correct treatment would be, and say whether the mistake is load-bearing for that part or a slip that shouldn't cost much. The move this student makes in (b) shows up in a couple of other scripts too, so if you have a view about it, phrase it in a way I can reuse. Write the comments as feedback a student could actually read: no "this is confused", but no false kindness either — if a step doesn't follow, say which step and why.
reasoning: |-
  Okay, I need to evaluate this student's answer on Fitch's paradox and provide detailed feedback. The student's response is quite sophisticated, but there are some key issues to address, especially in part (b). Let me break it down by section.

  First, for part (a), the student accurately presents Fitch's derivation. They correctly identify all the assumptions: distribution of knowledge over conjunction, positive introspection (KK principle), modal normality, and reliance on classical logic for the final step. The explanation of why intuitionistic logic wouldn't permit the final step is particularly insightful. This is a strong answer that deserves full marks.

  Part (b) is where things get interesting. The student argues that the "known by somebody at some time" repair blocks the paradox because the Fitch sentence "q ∧ ¬K*q" becomes ill-formed due to temporal mismatch. While this is a common move in the literature, the student misses a crucial point: even with K*, we can still construct a timeless version of the Fitch proposition. For example, "q and nobody ever knows q" remains a coherent, time-neutral proposition that triggers the paradox when plugged into KP. The student's claim that K* preserves factivity and distribution is correct, but their conclusion fails because the core problem persists. This is a significant error that undermines their argument.

  In part (c), the student suggests restricting KP to non-epistemic propositions. Though this is a standard anti-realist move, they present it clearly and acknowledge the cost (inability to apply KP to epistemic claims). Given that part (b) was flawed, this becomes a reasonable alternative response. The explanation is thoughtful and shows understanding of the dialectic.

  For scoring: Part (a) is excellent (8/8), part (b) has a fundamental flaw but shows good technical understanding (3/7), and part (c) is strong despite the preceding error (5/5). The total 16/20 reflects high quality work with one major misconception. In feedback, I'll need to carefully explain why the temporal repair doesn't actually avoid the paradox while acknowledging the student's correct technical observations about K*'s properties.
answer: |-
  Here is my detailed assessment of the student's answer, broken down by part, with marks and feedback phrased as actionable comments. The total mark is **16/20**.  

  ---

  ### **Part (a): Setting out Fitch’s argument**  
  **Mark: 8/8**  
  **Feedback:**  
  - Your derivation is precise and formally correct. You correctly identify the key premises: KP (`∀p(p → ◇Kp)`), non-omniscience (NO: `∃p(p ∧ ¬Kp)`), and the Fitch proposition `q ∧ ¬Kq`.  
  - You accurately trace the steps: applying KP to `(q ∧ ¬Kq)`, distributing knowledge over conjunction (`◇K(q ∧ ¬Kq) → ◇(Kq ∧ K¬Kq)`), applying positive introspection (KK: `K¬Kq → ¬Kq`), and deriving the contradiction `◇(Kq ∧ ¬Kq)`.  
  - Crucially, you explicitly note the assumptions:  
    - Distribution of knowledge over conjunction (correct, and essential).  
    - Positive introspection (KK principle) (correctly flagged).  
    - Modal normality (if `A ⊢ B` then `◇A → ◇B`) (necessary for the step).  
    - Classical logic in the final reductio (excellent observation about intuitionistic logic weakening the conclusion to `q → ¬¬Kq`).  
  - **Strengths:** No errors or omissions. You show awareness of the logical "moving parts," especially the role of classical logic.  

  ---

  ### **Part (b): Does the "known by somebody at some time" (K\*) repair block the argument?**  
  **Mark: 3/7**  
  **Feedback:**  
  - **What you got right:**  
    - You correctly note that K\* is factive (if K\*p then p) and distributes over conjunction (if K\*(p ∧ q) then K\*p ∧ K\*q). This is important, as these properties are preserved under the repair.  
    - You observe that if the Fitch proposition could be formed, the argument *would* go through for K\*. This is a valid insight.  
  - **The key mistake:**  
    - You claim that "q ∧ ¬K\*q" is ill-formed because "¬K\*q" (nobody ever knows q) is timeless, while K\*q is time-relative. **This is incorrect.** The proposition "nobody ever knows q" (i.e., ¬K\*q) is *not* time-relative; it is a coherent, eternal claim about the *totality* of time and knowers. For example, "Nobody ever discovers a proof that P=NP" is a meaningful, non-indexical proposition. Thus, "q ∧ ¬K\*q" *is* a well-formed proposition and can be plugged into KP.  
    - **Why this matters:** The argument **can still be run** with K\*. Let r be the proposition "q and nobody ever knows q" (i.e., `r = q ∧ ¬K\*q`). Applying KP to r gives `◇K\*r`. Distributing K\* over conjunction gives `◇(K\*q ∧ K\*¬K\*q)`. Since K\* is factive, `K\*¬K\*q` entails `¬K\*q`, so we get `◇(K\*q ∧ ¬K\*q)`—a contradiction. The repair **does not block the paradox**.  
  - **Why the mistake is load-bearing:** Your conclusion that the repair succeeds hinges entirely on the claim that the Fitch proposition cannot be formed. Since this claim is false, the overall argument in (b) fails.  
  - **Minor slip:** Your remark that the conclusion "every truth is known by someone at some time" is "not absurd" is partly right (it avoids present-tense omniscience), but it *is* still absurd: it implies that *every* truth, including "there are no dinosaurs" or "the number of stars is odd," is *actually* known by *some* knower at *some* time. This is arguably just as implausible as present-tense omniscience for the anti-realist.  

  ---

  ### **Part (c): If the repair fails, which assumption should be given up?**  
  **Mark: 5/5**  
  **Feedback:**  
  - **Strong points:**  
    - You propose a restriction strategy (limiting KP to non-epistemic propositions) clearly and concisely.  
    - You correctly identify the cost: KP can no longer be applied to propositions *about* knowledge (e.g., "nobody knows q").  
    - Your justification—that anti-realists only intended KP for "empirical, first-order" propositions—is well-stated and aligns with standard anti-realist motivations (e.g., tying truth to verifiability).  
    - You note that this avoids ad hocness by appealing to the anti-realist’s core epistemological commitments.  
  - **Why this works:** Even though your answer to (b) was flawed, your response to (c) is logically independent and demonstrates a good grasp of the dialectic. You offer a viable (and popular) anti-realist response.  

  ---

  ### **Overall Mark: 16/20**  
  - **Breakdown:** (a) 8/8 + (b) 3/7 + (c) 5/5.  
  - **Strengths:** Precise formal reasoning in (a), clear writing, excellent engagement with logical assumptions, and a sophisticated (though incorrect) move in (b). Part (c) is exemplary.  
  - **Weakness:** The central error in (b) undermines the conclusion, but the technical observations about K\*’s properties show good understanding.  
  - **Final feedback to student:**  
  > "Your answer is strong on formal detail and logical awareness, especially in (a) and (c). In (b), your claim that the Fitch proposition is ill-formed is mistaken—propositions like 'nobody ever knows q' are coherent and timeless. The paradox still arises for K\*, so the repair fails. However, your analysis of K\*’s properties (factivity, distribution) and your restriction strategy in (c) are excellent. Work on refining how timeless operators interact in epistemic logic."

  ---

  ### **Key for your TA use (re: the move in (b)):**  
  - **Why the temporal repair doesn’t work:** The student correctly notes that K\* retains factivity and distribution but incorrectly claims that "q ∧ ¬K\*q" is malformed. The proposition ¬K\*q ("nobody ever knows q") is *eternal*, not time-relative—it quantifies over *all* times/knowers. Thus, the Fitch proposition *can* be constructed, and the derivation proceeds identically. The repair only avoids the paradox if K\* is interpreted as *indexical* (e.g., "known now"), but the student’s formulation ("known by somebody at some time") is explicitly non-indexical.  
  - **Reusable phrasing for feedback:**  
  > "The proposition 'nobody ever knows q' (¬K\*q) is a coherent, *timeless* claim about the totality of inquiry. It is not 'time-relative' in a way that clashes with q. Thus, 'q ∧ ¬K\*q' is a valid instance for KP, and the paradox still arises. The repair does not block the argument."
