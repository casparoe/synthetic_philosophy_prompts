  Okay, let me approach this systematically. The user presents a sophisticated philosophical puzzle about the nature of conscious experience, particularly regarding dreams and perception, where competing explanations yield identical evidence but imply different metaphysical claims. 

  First, I need to unpack the core issue: the user observes that debates about the timing and existence of conscious experiences (like dreams) involve hypotheses that are evidentially indistinguishable yet treated as substantively different. This persists even when we remove contentious terms like "consciousness" or "experience." 

  The user's three cases reveal a pattern:
  - Dream reporting (case 1) has ambiguity about *when* the experience occurred (during sleep vs. at awakening)
  - Dream "tuning in" (case 2) questions *whether* earlier narrative segments corresponded to any experience
  - Perceptual richness (case 3) extends this to waking attention, asking if unattended objects are consciously registered

  Key constraints from the user:
  - This isn't verbal dispute or standard underdetermination (since no conceivable evidence could resolve it)
  - It's not global anti-realism about consciousness
  - Cartesian theater references are insufficient

  I consider several philosophical concepts that might fit:

  **Candidate 1: Phenomenal Concepts (as in Chalmers)**
  *Why it seems relevant*: These concepts refer to subjective qualities. But the user's issue isn't about *what* was experienced (smell of polish) but *whether/when* the experiencing happened. This fails the museum case: phenomenal concepts still presuppose an experiencer at some point. 

  **Candidate 2: Epistemic Asymmetry (from skepticism)**
  *Why it seems relevant*: First-person reports have privileged access. But in these cases, the first-person perspective itself is part of what's contested (e.g., the "felt duration" in case 1). The asymmetry collapses when the report's origin is in question. 

  **Candidate 3: Underdetermination of Theory by Evidence**
  *Why it seems relevant*: Multiple hypotheses fit the data. But standard underdetermination allows for *future* discriminative evidence, while here the user insists no such evidence is conceivable. This is stronger - it's about in-principle undecidability. 

  **Candidate 4: Verificationism**
  *Why it seems relevant*: If no evidence can distinguish claims, perhaps they're meaningless. But the user rejects this, noting both sides treat the question as substantive. Moreover, verificationism is largely abandoned for good reasons (e.g., it's self-refuting). 

  **Candidate 5: Temporal Transparency (Dennett's "Orwellian/Stalinesque" distinction)**
  *Closer fit*: Dennett's example of the color phi phenomenon shows two interpretations (unconscious vs. conscious revision) with identical reports. This mirrors the museum dream's three hypotheses. Crucially, Dennett argues the distinction dissolves - there's no fact beyond the report. But is this generalizable? 

  **Candidate 6: Metaphysical Vagueness**
  *Why it seems relevant*: Consciousness might have fuzzy boundaries. However, the user's cases aren't about borderline instances (e.g., drowsiness) but fundamentally competing frameworks. Vagueness suggests gradation, not incommensurable explanations. 

  **Candidate 7: Explanatory Gap / Hard Problem**
  *Why it seems relevant*: Neuroscience can't bridge subjective experience. But the gap is about *why* consciousness arises, while the user's puzzle is about *when/whether* it occurs given fixed behavioral/neural data. Different focus. 

  **Candidate 8: Conceptual Indeterminacy**
  *Best fit emerging*: The concept of "undergoing an experience" may lack necessary/sufficient conditions for application in these edge cases. Like "heap" in sorites paradoxes, there's no sharp boundary between "processing" and "experiencing." 

  **Testing against cases:**
  - Museum dream (case 1): All hypotheses account for identical memories/reports. "Assembled at waking" vs. "experienced during sleep" isn't settled by any scan, since neural activity could reflect either post-hoc construction or real-time experience. 
  - Dream tuning-in (case 2): The "never experienced" option highlights that reports alone don't guarantee past experience - they might be generated without any prior phenomenology. 
  - Attentional richness (case 3): Same logic applies - overflow theories (Block) vs. sparse views (Cohen/Dennett) can't be distinguished by introspection or reaction times. 

  **Edges the user cares about:**
  - *Third hypothesis (no experience) as same pattern*: Yes. It's not categorically different because "no experience" still requires explaining why we *seem* to have had one, just like the "delayed experience" hypothesis. 
  - *Contrast with verifiable cases (locked door)*: The difference is *criterion-transcendence*. For the door, we define "locking" by observable mechanisms (bolt position). For consciousness, any proposed criterion (neural signature N) is contested: does N *constitute* experience or merely *cause reports* about it? Even perfect readouts wouldn't resolve this, because the dispute is about what counts as "experience." 

  **Why it's not merely epistemic**: If it were just lack of data, we could imagine resolving it with better tech. But the problem runs deeper: the theories interpret the *same data* differently. 

  **Metaphysical vs. semantic indeterminacy**: It's metaphysical in that reality might not determine a single correct answer, but semantic in that our concepts ("undergoing") may not carve nature precisely here. I lean toward the latter - the indeterminacy arises from how we map concepts to processes. 

  **Final carving**: This is **criterion-transcendent indeterminacy** - disputes where competing accounts agree on all observable criteria but disagree on the underlying metaphysical claim, rendering the disagreement empirically vacuous yet conceptually persistent. 

  **Name proposal**: Following the user's preference for precision over labels, I'd call it the **Metaphysics-Without-Criteria Problem**. Key features:
  1. Agreement on all third-person evidence and first-person reports
  2. Competing interpretations of *when/whether* subjective experience occurred
  3. No conceivable evidence that isn't already accounted for by all sides
  4. Persistence of intuitive stakes (moral weight, personal identity)
answer: |-
  ### Step-by-Step Analysis of Your Query
  You've identified a profound and under-discussed pattern in debates about consciousness: **competing descriptions of when/if conscious experience occurs, which are empirically indistinguishable yet treated as substantively different**. I'll approach this systematically: (1) brainstorm candidate concepts from philosophy of mind/cognitive science, (2) test them against your cases, (3) reject inadequate candidates with explicit reasons, (4) define the phenomenon's boundaries, and (5) address your specific edges. I'll coin a term only after exhausting existing options.

  ---

  ### Brainstorming Candidate Concepts
  1. **Phenomenal Realism** (Chalmers, Nagel): Claims conscious experience has intrinsic, non-reductive properties.  
     *Relevance*: Addresses "what it's like" to dream.  
  2. **Illusionism** (Dennett, Frankish): Treats consciousness as a useful fiction; no "undergoing" beyond reporting.  
     *Relevance*: Matches your "never happened" hypothesis.  
  3. **Temporal Transparency** (Dennett's "Orwellian vs. Stalinesque"): Distinguishes between unconscious processing + retrospective revision vs. real-time conscious encoding.  
     *Relevance*: Directly addresses timing disputes in dreams/perception.  
  4. **Metaphysical Underdetermination** (Quine, later Kant): When multiple metaphysical interpretations fit all empirical data equally.  
     *Relevance*: Captures irreconcilable explanations with identical evidence.  
  5. **Verificationism** (Logical Positivism): If no test can distinguish claims, they lack meaning.  
     *Relevance*: Suggests the question is empty.  
  6. **Conceptual Indeterminacy** (Wittgenstein, Waismann): Concepts like "experience" lack precise boundaries in edge cases.  
     *Relevance*: Explains why "undergoing" resists clear application.  
  7. **Epistemic Asymmetry** (Searle, Locke): First-person access provides privileged evidence.  
     *Relevance*: Your cases challenge this asymmetry.  
  8. **Explanatory Gap** (Levine): Neuroscience can't explain subjective experience.  
     *Relevance*: Highlights limits of third-person data.  

  ---

  ### Testing Candidates Against Your Cases
  #### Case 1 (Museum Dream): Was experience real-time, retroactively constructed, or never conscious?  
  - **Phenomenal Realism Fails**: Assumes experiences *must* occur at some point, but your third hypothesis denies this. It doesn’t capture the "never happened" option.  
  - **Illusionism Fits**: Treats the report as the only "fact," making the "never happened" viable. But it struggles with the *moral stakes* you mention (e.g., why we care if suffering "occurred").  
  - **Temporal Transparency Fits Best**: Dennett’s framework allows both "experienced during sleep" (Stalinesque) and "constructed on waking" (Orwellian). Your third option extends it to illusionism.  
  - **Verificationism Fails**: While evidence can’t decide, both Malcolm and Dennett treat the question as meaningful—verificationism would dismiss it as nonsense, which contradicts their engagement.  
  - **Conceptual Indeterminacy Fits**: The concept "undergoing" may not determinately apply here.  

  #### Case 2 (Dreams Tuning In Mid-Narrative): Were earlier segments experienced?  
  - **Epistemic Asymmetry Fails**: First-person reports ("I joined mid-conversation") are part of the contested evidence, so privileged access doesn’t resolve anything.  
  - **Explanatory Gap Fails**: The gap is about *why* consciousness arises, not *when* it occurs relative to reports.  
  - **Metaphysical Underdetermination Fits**: Identical evidence (reports, scans) supports:  
    - (A) Unconscious narrative generation + later conscious fragments.  
    - (B) Full conscious narrative with forgotten parts.  
    - (C) No consciousness at all (only report-generation).  

  #### Case 3 (Waking Attention: Sparse vs. Rich Awareness):  
  - **Temporal Transparency Fits**: Like Dennett’s color phi illusion: Is richness in early perception (Stalinesque) or late memory (Orwellian)?  
  - **Illusionism Fits**: "Consciousness" of unattended objects may be a post-hoc reconstruction with no real-time basis.  
  - **All Candidates Fail to Cover All Three Cases Equally**: Only **Metaphysical Underdetermination** and **Conceptual Indeterminacy** seamlessly span dreams and waking perception.  

  ---

  ### The Core Phenomenon: Carving the Boundaries
  Your cases reveal **criterion-transcendent indeterminacy**:  
  - **What it is**: A dispute about the *occurrence* or *timing* of conscious states that cannot be resolved even in principle because all competing hypotheses:  
    (a) Agree on all first- and third-person evidence (reports, memories, neural data),  
    (b) Treat consciousness as having intrinsic moral/epistemic weight (unlike "mere" processing),  
    (c) Diverge only on *which neural/cognitive events constitute experience itself*.  
  - **Why it’s not other things**:  
    - **Verbal Dispute? No**: Tabooing "experience" leaves intact questions like "Did suffering occur *then*?"  
    - **Ordinary Underdetermination? No**: Standard cases (e.g., quantum interpretations) allow for *future* discriminative evidence. Here, no such evidence is conceivable—even a "complete neural readout" wouldn’t help, as the dispute is over *interpretation* of the readout (e.g., "Is pattern X *experience* or *pre-conscious processing*?").  
    - **Skepticism/Global Anti-Realism? No**: Both sides agree experiences *sometimes* occur (e.g., waking pain); the issue is localizing them in specific cases.  
    - **Cartesian Theater? Partial Fit**: Dennett’s critique explains *why* timing disputes arise (bad model of consciousness), but doesn’t name the *indeterminacy* itself.  

  #### Your Key Edges:  
  1. **Are 'when' and 'whether' the same kind of question?**  
     - **Yes**. Both reduce to: *At which point (if any) does processing become "conscious experience"?*  
       - "When" questions (Case 1: during sleep vs. waking) and "whether" questions (Case 2: was the first half experienced?) are variants of locating the "consciousness boundary."  
       - Your third hypothesis ("never happened") is the limiting case where no processing stage meets the criteria.  
     - **Why?** Consciousness attribution is a threshold concept. If we can’t settle "when," we may lack criteria to settle "if" in edge cases.  

  2. **What blocks verification (vs. checking a locked door)?**  
     - **The Criterion-Transcendence Problem**: For the door, "locked" has public criteria (bolt position). For consciousness:  
       - Any proposed criterion (e.g., "neural signature N at time T") is contested: Does N *constitute* experience or merely *cause reports* about it?  
       - **Neural readouts wouldn’t settle it**: Suppose a scan shows narrative construction during sleep. Malcolm might say: "That’s just unconscious processing." Dennett might say: "That *is* the experience." The dispute moves to what counts as "undergoing."  
     - **Root Issue**: Consciousness lacks *non-stipulative criteria*. We can’t "look" at it independently of the evidence shared by all hypotheses.  

  ---

  ### What Kind of "No Fact of the Matter"?  
  - **Metaphysical Indeterminacy**: Reality itself may not specify a "correct" answer.  
  - **Semantic Indeterminacy**: Our concept of "undergoing an experience" is vague, with no sharp boundaries in time or cognitive architecture.  
  - **Not Epistemic**: It’s not about lacking data; better evidence won’t help.  
  - **Diagnosis**: Primarily **semantic** (conceptual vagueness), but with **metaphysical** implications (if concepts don’t carve nature precisely, there may be nothing to discover).  
  - **What would show it?** If all attempts to define "conscious experience" operationally (e.g., "reportability," "neural correlate X") fail to resolve these disputes, it confirms indeterminacy.  

  ---

  ### Naming and Locating the Phenomenon
  - **Existing Name**: **Temporal Transparency in Consciousness Attribution** (from Dennett).  
    - *Literature*: Dennett’s *Consciousness Explained* (1991), Ch. 5 on "Orwellian vs. Stalinesque" revisions; Churchland’s critiques.  
    - *Shortcoming*: Focuses on timing, not "whether" questions.  
  - **Best Fit**: **Criterion-Transcendent Indeterminacy of Consciousness** (CTIC).  
    - *Definition*: The empirical vacuity of disputes over the spatiotemporal location or occurrence of conscious states, given fixed evidence, due to the absence of non-circular criteria for "experience."  
    - *Distinguishing Features*:  
      - vs. **Verificationism**: CTIC acknowledges the question feels substantive (due to moral stakes), even if unanswerable.  
      - vs. **Explanatory Gap**: CTIC concerns *localization*, not *explanation*.  
      - vs. **Illusionism**: CTIC is neutral—it doesn’t deny consciousness exists, only that its boundaries are indeterminate in these cases.  

  ---

  ### Summary for Your Needs  
  - **The Pattern**: You’ve pinpointed **criterion-transcendent indeterminacy** in attributing consciousness. It arises because:  
    - Consciousness is treated as a categorical "switch" (on/off; now/later), but all evidence is consistent with multiple switching points—or no switch at all.  
    - Questions of "when," "whether," and "how much" are unified by this indeterminacy.  
  - **Why it Matters**: It exposes a flaw in how we frame debates about consciousness. If CTIC holds, insisting on a "fact" here may reflect conceptual confusion, not metaphysical depth.  
  - **To Explore Further**: Read Dennett on *temporal transparency*, Metzinger on *phenomenal models*, or Perry on *indexicality* (for why "when" questions resist resolution).  

  If this carves the phenomenon accurately, your "structural feature" now has a name—and sharp boundaries. I’m prepared to refine this if new cases challenge the analysis.
