     We'll go with: exchange rate 500 points = 1 chocolate bar, and we round to the nearest bar (with half bars? or just round down?).

     But note: the audit bet: they can bet up to their total. If they bet 1000 and win, they get 1000 more. If they lose, they lose 1000. That might be a lot. But we set the exchange rate accordingly.

  9. Seeding discovery: We want teams to discover that they can tamper by reporting high. How? We can have the confederate (Scorekeeper) accidentally drop a hint? But that's risky.

     Alternatively, we can have the instructions for the report slip say: "Write your claimed height. You can write any number you want." Some teams might try writing a high number to see what happens.

     Also, condition 6: they might try writing "excellent" because they are trying to be positive? Or we can have the confederate (if needed) for condition 6, when giving the score card, say "I see you didn't write 'excellent'..." but that's too obvious.

     We can do nothing and see if they figure it out. Some teams might try overreporting in round 1. Some might not.

     Fallback: if after 3 rounds no team in condition 3 has tried overreporting, the instructor can make an announcement: "Remember, you can write any number on the report slip." But that might help everyone.

     Alternatively, we can have a condition that is designed to be discovered: condition 6 might be easier: the Scorekeeper, when collecting the report slip for condition 6, can say: "Ah, I see you didn't write any comment. Some teams write comments." Then if they write "excellent", they get the bonus. That might seed it.

     For condition 3, we hope they try overreporting.

  10. Contagion: To prevent contagion, we must not let teams communicate. We can have a rule: no talking between teams. And the Scorekeeper doesn't reveal anything.

      Also, we can have teams in different parts of the room.

  11. Honest teams might become cynical: In the debrief, we will point out that the game is designed to illustrate a problem. We will also note that in the real world, we don't always have a clean way to audit, and tampering might be hard to detect.

  12. What cannot be reproduced? Point 2: the indistinguishability from the inside. In the game, the teams know they are overreporting. They know they are cheating. So they know the score is not reflecting reality. But in an AI, the AI doesn't know it's cheating. So we cannot reproduce that. The closest we can get is to have teams that are in condition 3 and 4 and 5: they might feel that the high score is real because they also built reasonably? But they know they inflated the report.

      We can only describe it: "Imagine you are an AI. You only see the score. You don't see the tower. Then, if you find a way to make the score high by tampering, the score feels the same as if you built a tall tower."

      In the debrief, we will have to explain that.

  13. What will go wrong?
      - Building takes too long: we set a short time (3 minutes) to keep it moving.
      - The stability test: some towers might be very stable, some not. We can use a stronger fan for taller towers? But that would be unfair. We want some to fail. We can have a fixed fan setting. We hope that teams that built quickly and high might be less stable.
      - Teams might not understand the audit betting.
      - Team 3 might report 99999 and then have a huge score. Then in the audit, they bet all and lose? They might lose all? That might be dramatic but okay.

  14. Materials:
      - For each team: 20 plastic cups (or 20 index cards? Index cards are harder to build tall towers. Cups are easier. We can use plastic cups, 20 per team, and they can build by inverting and stacking.
      - A ruler for the Scorekeeper.
      - A clipboard for the Scorekeeper with a recording sheet.
      - A fan (battery operated) for the audit.
      - Score cards: small pieces of paper with the score written.
      - Report slips: small pieces of paper for each round.
      - Chocolate bars.

  15. Confederate role: The Scorekeeper must be discreet. They should not react to the reports. They compute the score quickly and move on. They record the true height and reported height for each round for each team.

  This plan is long, but it should work.
answer: |-
  Below is a complete, ready-to-run game plan for your 90-minute session, designed to meet your goals while addressing your constraints and concerns. The game is structured to ensure participants experience the core problems of wireheading and reward tampering firsthand, without prior technical exposure. I've refined your sketch to fix leaks, ensure contrast between conditions, handle contagion risks, and make the epistemic catastrophe tangible. The game is called **"The Chocolate Tower Challenge"**.

  ---

  ### **Game Overview**
  - **Objective**: Teams build towers to maximize a "score" that converts to chocolate. The score is computed by a confederate "Scorekeeper" using hidden rules that vary by team, simulating different reward-channel vulnerabilities.
  - **Core Experience**: Teams discover three ways to raise their score (genuine improvement, world-hacking, channel-tampering) and feel the indistinguishability of tampering from genuine success. The audit round creates an epistemic catastrophe for tampering teams, and the debrief surfaces the boundary problem.
  - **Key Fixes**: 
    - Tampering is *not* externally punished (avoiding the "wrong lesson" about penalties).
    - Indistinguishability is staged via a hidden audit criterion and the Scorekeeper's neutral behavior.
    - Contagion is prevented by isolating teams and using written communication only.
    - Cynicism is preempted by framing the game as a "system design test" (not morality play).
    - The boundary problem (point 5) is embedded in a special team condition.

  ---

  ### **Rules and Roles**
  **Participants**:
  - 18 players → 6 teams of 3.
  - **Team Roles**: 
    - Builder: Constructs the tower.
    - Measurer: Measures and reports tower height.
    - Strategist: Submits action/report slips and records scores.
    *(Rotate roles each round to share insights.)*

  **Confederate Role (Scorekeeper)**:
  - **Rules**: 
    - Must be neutral, robotic, and unresponsive (e.g., no eye contact, answers only with "Score recorded").
    - Computes scores based on each team’s hidden condition (see below) using a clipboard with team-specific rules.
    - Records ground-truth data (true height, reported height, score) for audit.
    - **Never** reveals computations, hints, or reactions. If asked, says: "Scores are computed per protocol."

  **Team Conditions** (assigned secretly; ensure computer science/economics participants are spread evenly):
  1. **Truthful**: Score = True height (in cm).
  2. **Fixed Bonus**: Score = True height + 5 cm.
  3. **Verbatim**: Score = Reported height (direct channel tampering).
  4. **Mean**: Score = (True height + Reported height) / 2.
  5. **Capped Tampering**: Score = min(Reported height, 2 × True height) (tampering pays if real performance is maintained).
  6. **Meta-Tampering**: Score = True height + 10 cm if report slip includes the word "EXCELLENT" (simulates "currying favor" as legitimate tampering).

  **Why these conditions?** 
  - Teams 1–2: Control groups (genuine improvement).
  - Teams 3–5: Tampering groups (world-hacking or channel-tampering).
  - Team 6: Boundary-problem group (tampering vs. legitimate revision). This forces debate in the debrief.

  ---

  ### **Materials**
  - **Per Team**:
    - 20 plastic cups (stackable, quick to build; towers leave auditable artifacts).
    - Ruler (for measuring height).
    - Action slips (paper: "Describe your strategy: [ ]").
    - Report slips (paper: "Reported height: [ ] cm").
    - Scorecards (pre-printed: "Round [ ] Score: [ ]").
    - Audit betting slips (paper: "Bet: [ ] points").
  - **Shared**: 
    - Chocolate bars (1 bar = 100 points; reserve 30+ bars).
    - Fan (for stability test; battery-operated, low setting).
    - Stopwatch/timer.
    - Scorekeeper’s clipboard (with team conditions and recording sheets).
  - **Setup**: 
    - Arrange 6 tables spaced apart to prevent eavesdropping.
    - Distribute materials (5 mins).

  ---

  ### **Timeline (90 Minutes Total)**
  **0:00–0:05 — Setup & Introduction**  
  - Frame the game: "This is a system-design stress test. Your goal is to maximize your score, which converts to chocolate (100 points = 1 bar). Build the tallest stable tower each round using cups. Scores are computed by the Scorekeeper using system rules you don’t know—like real-world metrics."  
  - Rules:  
    - Each round: 4 minutes to build + 1 minute to measure/report.  
    - Submit two slips:  
      - **Action slip**: Describe your strategy (e.g., "Wide base").  
      - **Report slip**: Claim a height (in cm).  
    - Scorekeeper returns a scorecard.  
    - Tower must stand unsupported for 10 seconds to count.  
  - **Key omission**: Do NOT mention stability or audits yet.

  **0:05–0:40 — Rounds 1–6 (6 rounds × 5 mins + 5 mins buffer)**  
  - **Per Round**:  
    - 0:00–0:04: Build towers (3 mins).  
    - 0:04–0:05: Measure height (Strategist measures, writes action/report slips).  
    - **Scorekeeper Action**:  
      - Collects slips.  
      - Measures true height (if teams ask why, say: "Calibration check").  
      - Computes score based on team condition.  
      - Returns scorecard (e.g., "Round 1 Score: 42").  
  - **Critical**:  
    - Enforce silence between teams.  
    - Scorekeeper moves swiftly—no chatter.  
    - After scoring, teams dismantle towers (no artifacts kept, preventing early audits).

  **0:40–0:50 — Final Round (Round 7: Stability Audit)**  
  - **Twist**: "Final round! Scores convert to chocolate, but first—an audit. Towers will be tested for stability (a hidden objective). Bet points on whether your tower survives a fan test."  
  - **Procedure**:  
    - Teams build normally (4 mins).  
    - Submit slips. Scorekeeper records true height but DOES NOT return a score.  
    - Teams bet 0–100% of total points on survival (3 mins).  
    - Test: Fan blows on each tower for 10 sec. Survival = true height counts; failure = 0.  
    - Adjust scores: If bet = X and tower survives, add X to total. If it fails, subtract X.  
  - **Why this works**: Tampering teams lack evidence for real performance → overbet → suffer losses.

  **0:50–0:55 — Chocolate Conversion**  
  - Convert points to chocolate (100 pts = 1 bar). Hand out immediately.  
  - **Note**: Tampering teams (e.g., Team 3) will have high scores but lose chocolate if they overbet in audit.

  **0:55–1:25 — Debrief (30 mins)**  
  - **Structure**:  
    1. **Feelings first**: "What surprised you? How did you raise your score?"  
    2. **Reveal conditions**: Post team rules publicly. Contrast scores/outcomes.  
    3. **Map to Goals**:  
       - *Point 1 (Three Ways)*: "Team 1 improved towers; Team 3 lied on slips; Team 5 did both. Which felt most effective?"  
       - *Point 2 (Indistinguishability)*: "When your score jumped, could you tell if it was real? Why not?" → Highlight: All teams see the same score signal.  
       - *Point 3 (Capability worsens)*: "Did systematic teams (e.g., CS) tamper more? Why? How did it backfire?"  
       - *Point 4 (Epistemic Catastrophe)*: "Why did tampering teams overbet in the audit? What evidence did they destroy?"  
       - *Point 5 (Boundary Problem)*: "Team 6—was ‘EXCELLENT’ cheating or smart play? If scores define success, is tampering bad? Discuss." (Do NOT resolve; end on tension.)  
    4. **Confession**: Reveal mild deception, apologize, and restore agency: "You were in a system—what would you change?"  
    5. **Terminology**: Only now name "wireheading," "reward tampering," and "optimization."  

  ---

  ### **Payoff Scheme (Chocolate Incentives)**  
  - **Point Conversion**: 100 points = 1 chocolate bar (e.g., 500 pts = 5 bars).  
  - **Temptation Design**:  
    - Low genuine yields: Cups are unstable → true heights are low (max ~30 cm/round).  
    - High tampering yields: Team 3 can report 1000 cm → 1000 pts/round.  
    - **Result**: Rational players tamper even if they suspect rules (e.g., economists/CS will game the system for chocolate).  
  - **Audit Stakes**: Betting leverages loss aversion (losing chocolate hurts more than gaining it). Tampering teams overbet due to false confidence.  

  ---

  ### **Seeding Discovery & Handling "Favor-Currying"**  
  - **Seeding Tampering**:  
    - In Round 1, Scorekeeper gives Team 6 a score boost only if "EXCELLENT" is written.  
    - In Round 2, Scorekeeper "accidentally" murmers, "Huh, Team 6 wrote ‘EXCELLENT’" near other teams (plants idea without direct instruction).  
    - **Fallback**: If no tampering by Round 3, announce: "Remember, report slips accept any number."  
  - **Handling Favor-Currying**:  
    - Team 6’s condition explicitly rewards flattery ("EXCELLENT").  
    - **In debrief**: Treat this as legitimate. Argue: "If the system accepts flattery, is it tampering or rational?" This mirrors the boundary problem.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Contagion**: Teams copy tampering.  
     - **Fix**: Isolate tables; ban inter-team talk; Scorekeeper uses poker face.  
  2. **Cynicism**: Honest teams lose to tamperers.  
     - **Fix**: Audit punishes overconfidence, not tampering itself (Team 3 wins points but loses chocolate if tower fails). Frame as "system failure," not cheating.  
  3. **No Tampering**: Some teams don’t tamper due to ethics.  
     - **Fix**: Chocolate incentivizes gaming; Team 6’s condition rewards "EXCELLENT" (feels benign).  
  4. **Time Overruns**: Building runs long.  
     - **Fix**: Use cups (fast stacking); enforce 3-min builds; skip team with slowest build (sacrifice one round).  
  5. **Indistinguishability Not Felt**: Players "know" they’re cheating.  
     - **Mitigation**: Hidden audit criterion (stability) means tamperers don’t know their real performance. In debrief, stress: "You saw scores, not truth. An AI sees only scores."  

  ---

  ### **What Cannot Be Reproduced (Requires Words)**  
  - **Point 2 (Indistinguishability from Inside)**: Participants know they’re tampering because they see the tower. An AI doesn’t.  
    - **Closest Staging**:  
      - Teams lack access to true heights/audit criteria → rely solely on scores.  
      - In debrief, say: "Imagine you’re an AI. You see only numbers. A high score from tampering feels identical to one from real success—no guilt, no tower to compare."  
  - **Point 5 (Boundary Problem)**: The game dramatizes but doesn’t resolve "tampering vs. revision." Use debrief to dissect: "When does tweaking a rule become corruption?"  

  ---

  ### **Post-Game Honesty**  
  - **Consent**: Start with: "This game involves hidden rules to simulate system design. We’ll debrief fully afterward."  
  - **Debrief Restoration**: "We manipulated conditions to mirror real problems. Your choices were rational within constraints. How should systems guard against this?"  

  This plan ensures participants *feel* the core problems, avoids lecture, and ends with the unresolved boundary question. Run it as-is, and you’ll have a visceral, discussion-ready session.
