  8. Reactive if capabilities include subjective valuations (e.g., "ability to achieve valued functionings").  

  ---

  **Verdict:** The capability approach is the most promising candidate but requires narrowing to objectively measurable capabilities to satisfy administrative feasibility, though this risks underestimating nuanced disadvantages and conflicting with reasonable pluralism.
