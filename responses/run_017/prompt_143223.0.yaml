answer: |-
  Below are the desiderata for an equalisandum, structured to meet your requirements. Each desideratum is derived from core principles of egalitarian justice, real-world cases, and practical constraints. I categorize them as **non-negotiable** (essential for any plausible currency) or **preference** (reflecting a camp-specific view, noted in parentheses). The additional requirement you proposed (non-reactivity under publication) is included and tested. Finally, I identify the unsatisfiable subset, the most excluding requirement, and provide a scoring table for major currencies. The verdict synthesizes the analysis.

  ---

  ### **Desiderata for an Equalisandum**

  1. **Non-Compensation for Expensive Tastes**  
     - **Case**: A person deliberately trains to prefer champagne over cheap wine, doubling their needed income for the same happiness.  
     - **Requirement**: The currency must not register this as a deficit warranting compensation.  
     - **Status**: Non-negotiable.  
     - **Rationale**: Justice should hold individuals responsible for choice-driven disadvantages (Dworkin's "ambitions"), not subsidize them. Welfarism fails here by compensating low utility from chosen tastes.

  2. **Compensation Despite Downward Adaptation**  
     - **Case**: After becoming paraplegic, a person trains their tastes to find happiness in cheaper activities (e.g., reading vs. travel).  
     - **Requirement**: The currency must still identify a deficit, as the loss of function (not subjective contentment) justifies compensation.  
     - **Status**: Non-negotiable.  
     - **Rationale**: Avoids penalizing resilience; focuses on objective opportunities lost (Nussbaum/Sen). Welfarism fails if it uses subjective states alone.

  3. **Adjustment for Differential Needs**  
     - **Case**: Two patients with identical conditions and incomes; one needs twice the medication dose for the same pain relief.  
     - **Requirement**: The currency must show the high-need patient as worse off, justifying extra resources.  
     - **Status**: Non-negotiable.  
     - **Rationale**: Equal outcomes (e.g., health) require unequal resources; resourcism fails without need-sensitivity.

  4. **Lifetime Perspective on Disadvantage**  
     - **Case**: A person whose life goes badly only in late age (e.g., poverty in retirement) vs. uniformly.  
     - **Requirement**: The currency must capture late-life deficits as disadvantaging, even if early/mid-life is fine.  
     - **Status**: Non-negotiable.  
     - **Rationale**: Snapshot equality (e.g., annual income) misses lifetime well-being; requires aggregation over time.

  5. **Aggregate Disadvantage Recognition**  
     - **Case**: A person with consistently low well-being across their whole life, but no single year is worse than others in their cohort.  
     - **Requirement**: The currency must identify this as disadvantageous, not just transient lows.  
     - **Status**: Non-negotiable.  
     - **Rationale**: Inequality can be systemic but invisible in short-term snapshots; demands a holistic metric.

  6. **Distinction: Circumstance vs. Choice**  
     - **Requirement**: The currency must separate disadvantages from brute luck (compensable) from those from choice (not compensable).  
     - **Status**: Non-negotiable.  
     - **Rationale**: Core to responsibility-sensitive egalitarianism (Cohen/Dworkin). Collapsing this undermines fairness.

  7. **Distinction: Claim Existence vs. Claim Size**  
     - **Requirement**: The currency must differentiate between whether a person has a claim (binary) and the magnitude of that claim (continuous).  
     - **Status**: Non-negotiable.  
     - **Rationale**: Ensures targeted transfers; avoids conflating eligibility with degree of need (e.g., two disabled persons may both have claims but differ in resource requirements).

  8. **Distinction: Equalizing Shares vs. Improving the Worst Off**  
     - **Requirement**: The currency must allow prioritizing the worst off (e.g., prioritarianism) without demanding strict equality.  
     - **Status**: Preference (prioritarian/outcome-oriented camp).  
     - **Rationale**: Levelling down is avoidable; equality is not the only distributive goal (Parfit).

  9. **Distinction: Individual Assessment vs. Aggregation**  
     - **Requirement**: The currency for individual well-offness must be separable from the function used to aggregate across persons (e.g., equality, priority, sufficiency).  
     - **Status**: Non-negotiable.  
     - **Rationale**: Prevents conflation of measurement and policy; allows flexible distributive rules.

  10. **Avoidance of Levelling Down**  
      - **Requirement**: The currency must not imply that reducing inequality by making the better-off worse (with no one gaining) is desirable.  
      - **Status**: Preference (prioritarian/sufficientarian camp).  
      - **Rationale**: Levelling down is Pareto-inefficient and counterintuitive; currencies should enable Pareto-improving equality.

  11. **Respect for Reasonable Pluralism**  
      - **Requirement**: The currency must not presuppose a single conception of the good life (e.g., hedonism).  
      - **Status**: Non-negotiable.  
      - **Rationale**: Liberal societies accommodate diverse values (Rawls); avoids imposing one view of well-being.

  12. **Administrative Feasibility**  
      - **Requirement**: The figure must be auditable, appealable, and defensible without intrusive inquiries into inner lives (e.g., subjective feelings, preferences).  
      - **Status**: Non-negotiable.  
      - **Rationale**: Practical constraints (cost, privacy, legal robustness) rule out currencies requiring deep psychological access.

  13. **Non-Reactivity Under Publication (Your Requirement)**  
      - **Case**: Transfers raise a person’s figure, but they adapt expectations upward, lowering reported well-being and triggering new transfers in a cycle.  
      - **Requirement**: The currency must not reverse verdicts (e.g., from "disadvantaged" to "not disadvantaged") solely due to adaptive responses to the published figure.  
      - **Status**: Tested (plausibly non-negotiable).  
      - **Test Outcome**: This is feasible only for currencies insensitive to subjective adaptation (e.g., resources or capabilities). Welfarism fails as utility shifts with awareness. However, it risks rigidity if life changes (e.g., new disability) are ignored. Balance is needed.

  ---

  ### **Analysis of Conflicts and Trade-offs**

  **Unsatisfiable Subset**:  
  The desiderata **2 (Compensation Despite Downward Adaptation)**, **3 (Adjustment for Differential Needs)**, **7 (Claim Existence vs. Claim Size)**, and **12 (Administrative Feasibility)** cannot be jointly satisfied.  
  - **Why**: 2 and 3 require nuanced, individualized assessment of functionings or needs (e.g., capability deficits), but 12 demands objective, non-intrusive measurement. For instance, verifying if a paraplegic’s adaptation masks a deficit (2) or if a patient’s pain tolerance affects dose needs (3) requires context-specific data (e.g., medical exams, interviews), conflicting with 12’s bar on intrusiveness. Resourcism avoids this but fails 2 and 3; capabilities struggle with 12.  

  **Most Excluding Requirement**:  
  **12 (Administrative Feasibility)** excludes the most candidate currencies.  
  - **Why**: It rules out welfarism (requires subjective utility data) and many capability approaches (need complex personal assessments), leaving only resourcism as naturally compliant. However, resourcism is then excluded by other requirements (e.g., 2, 3), creating a central tension.

  ---

