  We are drafting desiderata for an equalisandum (the thing to be equalized) for a Currency Board that will calculate a single comparable figure for each citizen's level of well-offness and set transfers to reduce inequality.

  The desiderata must cover:
  1. Cases it must get right.
  2. Distinctions it must not collapse.
  3. Results it cannot contradict (including the levelling-down objection, reasonable pluralism, and administrative feasibility).
  4. My additional requirement: non-reactivity under publication (the currency should not reverse its verdicts merely because people learn the figure and adapt to it).

  We will then identify:
  - Which subset of desiderata cannot be jointly satisfied.
  - Which single requirement excludes the most candidate currencies.
  - A short table scoring welfarist, resourcist, and capability views.

  Finally, a one-sentence verdict.

  Let's define the desiderata:

  **I. Cases it must get right (non-negotiable, as they are core intuitions):**
     a. **Expensive tastes:** Someone who deliberately cultivates expensive tastes (e.g., trained to like champagne) should not be compensated. (Rejects welfare equality if welfare is defined subjectively, because then the person with expensive tastes would have low welfare and hence a claim for compensation.)
     b. **Adaptation downward:** Someone who, after a loss (e.g., becoming paraplegic), deliberately trains her tastes downward (so she's happy with less) should still be compensated for the loss. (Rejects welfare equality if we only look at current welfare, because she might report high welfare despite the loss.)
     c. **Differential needs:** Two patients with the same condition and same income, one needing twice the dose for the same relief, should have the one with higher need compensated (so that both can achieve the same level of relief). (Rejects resource equality because they have the same income but one needs more to achieve the same outcome.)
     d. **Timing of disadvantage:** Someone whose only deficit is that her life goes badly late (e.g., poverty in old age) rather than early should be compensated for the late deficit. (Rejects snapshot equality because if we only look at a point in time, we might miss the lifetime profile.)
     e. **Lifetime vs. annual disadvantage:** Someone whose disadvantage shows up across a whole life (e.g., lower average well-being) but not in any single year should be identified as disadvantaged. (Rejects annual snapshots and requires a lifetime perspective.)

  **II. Distinctions it must not collapse (non-negotiable, as they are conceptual foundations):**
     a. **Circumstance vs. choice:** The currency must not collapse the distinction between what is due to circumstances (for which compensation is due) and what is due to choice (for which the individual is responsible). (E.g., in the expensive tastes case, the cultivation of the taste is a choice, so no compensation.)
     b. **Having a claim vs. the size of the claim:** The currency must not conflate the existence of a claim (whether someone is disadvantaged) with the magnitude of that claim (how much compensation they are owed). (E.g., two people may both have a claim due to disability, but one may require more resources to achieve the same level of functioning.)
     c. **Equalizing shares vs. improving the worst off:** The currency must allow for the possibility that we might want to improve the condition of the worst off without necessarily equalizing (e.g., prioritarianism). It must not collapse the distinction between equality and priority to the worst off.
     d. **Individual assessment vs. aggregation:** The currency for assessing one person's situation must be separable from the currency for aggregating across persons. (E.g., we might assess individual well-being in one way but then aggregate using a different function, such as a sum or a prioritarian weighting.)

  **III. Results it cannot contradict (some non-negotiable, some reflecting different camps):**
     a. **Levelling-down objection (non-negotiable for many):** A situation should not be deemed more equal if it is achieved by making some worse off and no one better off. (So, equality must not be the only value; we care about the absolute level too.)
     b. **Reasonable pluralism (non-negotiable):** The currency must respect that there is reasonable disagreement about what makes a life go well. (So, it cannot impose one comprehensive view of the good.)
     c. **Administrative feasibility (non-negotiable):** The published figure must be auditable, appealable, and defensible without intrusive inquiry into inner lives (e.g., subjective feelings, personal values). (Rejects currencies that require deep psychological probing.)

  **IV. Additional requirement: Non-reactivity under publication (to be tested):**
     - The currency should not reverse its verdicts merely because people learn the figure and adapt to it. For example, if a person is deemed worse off and given transfers, and then she adapts her expectations downward (becoming content with less), the currency should not then say she is better off and reduce transfers, which might make her worse off again. This could create a perverse cycle.

