  **Footnotes**:  
  1. Only if needs are defined as welfare inputs; fails if welfare is purely subjective.  
  2. Possible with lifetime aggregation, but not inherent; requires additional assumptions.  
  3. Requires a Dworkinian "hypothetical insurance" mechanism; not inherent to resourcism.  
  4. Claim size depends on interpersonal utility comparisons (welfarism) or capability thresholds (capabilities), but neither cleanly separates existence and size.  
  5. All allow prioritarian aggregation, but strict equality invites levelling down.  
  6. Only if welfare is preference-based; fails for mental-state views.  
