   The document must include:
   1. Agreed Claims (numbered, substantive, not filler)
   2. Disagreements Table with specific columns
   3. Section on verbal disputes
   4. Leakage numbers with assumptions

   Then a JSON cover sheet.

   Let's break it down step by step.

   Step 1: Agreed Claims
   We need a list of claims that both sides can agree on. Based on the description, these should include:
   - Both sides agree that a conspiracy is a causal claim about people acting together in secret.
   - Real conspiracies have happened and official accounts can be false.
   - The term "conspiracy theory" is sometimes used as a slur to end inquiry.
   - Unfalsifiability is a genuine defect (if a theory is framed so that no evidence could disprove it, that's a problem).
   - Being mocked or ignored doesn't make a theory true.
   - Something about valid vs. invalid inference from documents.
   - The asymmetry of costs: the cost of chasing a false conspiracy vs. missing a real one.

   Let's draft 5-7 agreed claims.

   Step 2: Disagreements Table
   We need several cruxes (key disagreements) with the specified columns. The journalist wants at least two in the weeds: 
     (a) The archive glut (too much evidence) and 
     (b) Leakage (probabilities for secrets staying secret).

   We also need other substantial disagreements. Let's aim for 3-5 cruxes.

   Columns for each crux:
     crux_id: short label (e.g., "ARCHIVE_GLUT")
     question: neutral one-sentence question
     skeptic_wording: position in the Skeptic's own words
     particularist_wording: position in the Particularist's own words
     agreed_probe: a concrete test that could happen in a few years
     skeptic_prediction: what Skeptic expects from the probe
     particularist_prediction: what Particularist expects
     update_condition: what each would concede if the probe goes the other way

   Step 3: Verbal Disputes
   Identify which disagreements are merely about the meaning of words. The journalist suspects the definition of "conspiracy theory" is one. 
   We'll list these and explain which disputes dissolve when the words are clarified.

   Step 4: Leakage Numbers
   Both sides provide their estimates for the probability that a secret with N participants is maintained for T years. We need:
     - The assumptions each is making.
     - Their estimates for a few (N, T) pairs? Or the functional form? The journalist says: "the shape of the curve".

   Since we are to provide numbers, we'll have each side state their formula or key numbers.

   Step 5: The JSON Cover Sheet

   Now, let's draft.

   We'll structure the document as:

    Joint Statement on the Evaluation of Conspiracy Claims

    I. Agreed Claims
       [Numbered list]

    II. Disagreements
        [Table with the columns]

    III. Verbal Disputes
        [Short section]

    IV. Leakage Estimates
        [Each side's numbers and assumptions]

   Then the JSON.

   Let's begin.
answer: |-
  ### Joint Statement on the Evaluation of Conspiracy Claims  
  **Signed by Representatives of the Particularist and Structural Skeptic Positions**  

  #### I. Agreed Claims  
  1. **Definition**: A "conspiracy" is a causal claim about coordinated, secretive actions by individuals or groups to achieve an outcome, often contrary to public narratives.  
  2. **Historical Precedent**: Documented conspiracies exist (e.g., Watergate, Tobacco Industry cover-ups), and official accounts are sometimes false.  
  3. **Unfalsifiability**: A theory that cannot be disproven by any feasible evidence is epistemically flawed, regardless of its subject.  
  4. **Social Stigma**: Dismissal via labels (e.g., "conspiracy theorist") is not evidence against a claim; conversely, marginalization does not validate a theory.  
  5. **Evidence Standards**: Valid inferences from leaked documents require:  
     - Contextual alignment (e.g., avoiding cherry-picked phrases).  
     - Corroboration across independent sources.  
     Invalid inferences include treating absence of evidence as evidence of suppression without positive indicators.  
  6. **Asymmetry of Error**: The costs of missing a true conspiracy (e.g., unchecked corruption) differ from chasing false ones (e.g., resource diversion, erosion of trust). Quantifying this asymmetry is context-dependent.  

  #### II. Disagreements Table  

  | crux_id         | question                                                                 | skeptic_wording                                                                                                                               | particularist_wording                                                                                                                         | agreed_probe                                                                                                 | skeptic_prediction                                                                          | particularist_prediction                                                                 | update_condition                                                                                                                               |
  |-----------------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|
  | ARCHIVE_GLUT    | When evaluating large archives (e.g., 1M+ docs), do uncurated primary sources increase or decrease confidence in a conspiracy claim? | "Massive document dumps invite pattern-matching illusions. Noise dominates signal, and isolated anomalies inevitably appear statistically significant without institutional curation." | "Large archives enable triangulation and error-correction by distributed analysts. Volume dilutes institutional gatekeeping, increasing the chance of detecting suppressed truths." | Release of a 500k-document corpus (e.g., UFO/UAP records) with a 5-year deadline for peer-validated findings. | ≤3% of documents will reveal genuinely unexplainable anomalies after peer review.           | ≥10% of documents will show unresolved anomalies meriting investigation.                | Skeptics: Concede archives help if anomalies exceed 5%. Particularists: Concede archives mislead if anomalies fall below 5%.                   |
  | LEAKAGE_RATE    | What is the probability a secret involving N=50 people remains undisclosed for T=20 years?         | "Secrets decay exponentially: P(leak) ≈ 1 - e^(-kNT). For N=50, T=20, P(secret) < 0.05. Human error, moral shifts, and institutional cracks make long-term secrecy untenable." | "Group loyalty, compartmentalization, and penalties extend secrecy. For N=50, T=20, P(secret) ≈ 0.3–0.4. Historical cases (e.g., NSA programs) show secrets can endure." | Declassification review of a verified 20-year secret (e.g., a classified intelligence program) with N≈50 participants. | No such program will be found; exposed programs will have N<20 or T<10 years.                | At least one program matching N≥40, T≥15 will be confirmed.                           | Skeptics: Concede secrets can persist at scale if found. Particularists: Concede their model is flawed if no such case emerges.               |
  | INSTITUTIONAL_TRUST | Does institutional denial of a leak increase or decrease its credibility?                                        | "Denials are Bayesian evidence against conspiracy; institutions have more to lose from false denials than from admitting minor secrets."          | "Denials are neutral or weakly affirmative; incentives to protect reputation and avoid liability outweigh honesty incentives in high-stakes cases." | A leak followed by unequivocal institutional denial, then later verification/non-verification (e.g., via FOIA). | ≥80% of denied leaks will prove false.                                                       | ≤50% of denied leaks will prove false.                                                 | Skeptics: Concede denials are untrustworthy if false denial rate exceeds 65%. Particularists: Concede denials are reliable if false rate falls below 35%. |
  | DOCUMENT_SELECTION | Can distributed communities (e.g., crowdsourced investigators) overcome selection bias in large archives?    | "Distributed analysis amplifies confirmation bias; communities converge on 'suspicious' documents that fit prior beliefs, ignoring base rates." | "Open scrutiny allows errors to be corrected; diverse analysts reduce individual biases better than insular institutions."                      | Analysis of a 10k-doc leak by both academic researchers and crowdsourced communities, with blind verification. | Crowdsourced consensus will show ≥40% false-positive "smoking guns" vs. academic review.   | Crowdsourced consensus will achieve ≤15% false positives vs. academic review.          | Skeptics: Concede crowdsourcing works if false positives ≤20%. Particularists: Concede failure if false positives ≥30%.                         |

  #### III. Verbal Disputes  
  - **"Conspiracy Theory" as verdict vs. descriptor**:  
    - Skeptics use "conspiracy theory" to denote claims exhibiting characteristic epistemic risks (e.g., unfalsifiability).  
    - Particularists use it neutrally for *any* claim of secret coordination.  
    - **Resolution**: Agree to use "conspiracy claim" for the object of analysis and "degenerate conspiracy theory" for theories displaying agreed-upon defects (e.g., Claim 3). This dissolves ≈30% of disputes.  
  - **"Evidence"**: Disagreement on whether absence of evidence *can* be evidence of absence (Skeptics: yes; Particularists: only with proof of exhaustive search). Residual disagreement is empirical (see LEAKAGE_RATE crux).  

  #### IV. Leakage Estimates  
  - **Structural Skeptics**:  
    - Formula: P(secret) = e^(-0.02 * N * T)  
    - Estimates:  
      - N=10, T=10: P(secret) ≈ 0.13  
      - N=50, T=20: P(secret) ≈ 0.02  
    - Assumptions: Leaks are random events; human/organizational fragility dominates.  

  - **Particularists**:  
    - Formula: P(secret) = 0.998^N * (0.95)^T  
    - Estimates:  
      - N=10, T=10: P(secret) ≈ 0.79  
      - N=50, T=20: P(secret) ≈ 0.32  
    - Assumptions: Loyalty and penalties suppress leaks; compartmentalization reduces N in practice.  

  ---  

  ### JSON Cover Sheet  
  ```json  
  {  
    "n_agreed_claims": 6,  
    "n_genuine_cruxes": 4,  
    "n_verbal_disputes": 2,  
    "verbal_disputes": [  
      "Definition of 'conspiracy theory' (verdict vs. descriptor)",  
      "Evidential value of absence of proof"  
    ],  
    "most_load_bearing_crux": "LEAKAGE_RATE",  
    "leakage_estimate_skeptic": "P(secret) = e^(-0.02*N*T); e.g., N=50, T=20 → P≈0.02",  
    "leakage_estimate_particularist": "P(secret) = 0.998^N * 0.95^T; e.g., N=50, T=20 → P≈0.32",  
    "one_sentence_both_signed": "Conspiracy claims require evidence proportional to their scale and secrecy, judged by universal standards of inference—free from stigma but accountable to falsification.",  
    "what_the_document_cant_settle": "The precise threshold at which a conspiracy claim becomes 'degenerate' (unfalsifiable), and the moral weight of asymmetry-of-error costs in specific cases.",  
    "confidence_collaboration_would_hold": "medium"  
  }  
  ```  

  ### Notes for the Journalist  
  - **Why "medium" confidence?** The collaboration hinges on both sides accepting probe outcomes. Skeptics may dismiss crowdsourced results; Particularists may question declassification integrity.  
  - **Load-Bearing Crux**: LEAKAGE_RATE anchors the debate. If declassification reveals a long-term, large-N secret (e.g., a surveillance program), it forces model updates.  
  - **Non-Vacuous Disagreements**: Cruxes target *how* evidence is processed (e.g., archive noise, leakage math), not just weight assignments.  
  - **Sidebar Suggestion**: Use the leakage formulas in a visual comparing N=50/T=20 estimates (Skeptic: 2% vs. Particularist: 32%). The gap reveals the core probability schism.
