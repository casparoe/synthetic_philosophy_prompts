  4. **Plot Level 1 results and discuss shift (10 min):**
     - On the board, create a graph for Group A: step on x-axis, % of "Yes" on y-axis. Do the same for Group B (but note Group B's steps are reversed in presentation order, but we plot against the same step number: for Group B, step0 in their series is step19 in the image index, etc.)
          But wait: in Group B, when they were at the first step (which was image19), we call that step0 for them? We must be consistent with the image index.

     - Let me define the image index: image0 (black) to image19 (white).
          Group A: step i in their series corresponds to image i.
          Group B: step i in their series corresponds to image 19-i.

          So when Group B is at their step0, they see image19; at step1, image18; ... at step19, image0.

     - We want to plot, for each image index j (0 to 19), the % of Group A that said "Yes" at that image and the % of Group B that said "Yes" at that image.

          For a given image j:
            In Group A: it was presented at step j.
            In Group B: it was presented at step (19-j).

          So we can plot for j=0 to 19:
            Group A: % Yes at image j = % of Group A students who said "Yes" when they saw image j (at step j in their series).
            Group B: % Yes at image j = % of Group B students who said "Yes" when they saw image j (which for them was at step 19-j).

     - We expect to see:
          For low j (dark images): both groups high %.
          For high j (light images): both groups low %.
          In the middle: Group A will have a higher % than Group B for the same image j? 

          Why? In Group A (ascending), they are coming from the dark, so they might continue saying "Yes" into the borderline. In Group B (descending), they are coming from the light, so they might start saying "Yes" later.

     - We show the two curves and note the shift.

     - Discussion: Why did this happen? What does it say about our ability to know in the borderline?

  5. **KK part: Level 2 for the ascending series (10 min):**
     - Now we focus on the ascending series (Group A's series).
     - Task for Level 2: "You will not see the square. You will be told the step number, and you know the series is ascending (from black at step0 to white at step19). At each step, you must judge: 'Is a person who sees the square at this step in a position to know that it is dark?'"
     - All students (both groups) do this task for the ascending series, step by step.
     - We go through steps 0 to 19, announcing the step number. At each step, they have 15 seconds to write.
     - Time: 20 steps * 15 seconds = 5 minutes.

  6. **Plot Level 2 results and compare to Level 1 (10 min):**
     - For the ascending series, we have:
          Level 1: from Group A's data (for each step j, % of Group A that said "Yes").
          Level 2: for each step j, % of all students (Level 2) who said "Yes" to the Level 2 question.
     - We plot both on the same graph.
     - We expect that Level 2 will drop off earlier (at a lower step number) than Level 1. Why? Because Level 2 requires a margin for error: they know that at step j, if j is too high, then even if the square is still dark, it might be borderline and the person might not know. So they become uncertain sooner.

  7. **Debrief and formalize the argument (28 min):**

     - Review the two main results:
          a) The shift between the two groups in Level 1 (5 min)
          b) The wider margin for Level 2 (5 min)

     - Connect to luminosity: 
          Luminosity: If the square is dark, then you are in a position to know it is dark.
          But in the borderline, we see that sometimes it is dark but you are not in a position to know (because of the margin for error). Also, the shift shows that there is no fixed point where it becomes known.

     - Carelessness objection (10 min):
          - A student says: "I said 'Yes' in the light region because I wasn't paying enough attention. If I had been more careful, I would have said 'No'."
          - Response: 
               - In the scoring, we penalized such errors heavily, so there was an incentive to be careful.
               - Moreover, the shift phenomenon cannot be explained by carelessness: why would Group A be careless in the light region but Group B not? The difference is the direction of the series, not carelessness.
               - In the borderline, even if you are careful, you might not be able to tell. The activity shows that knowledge is not always available when the condition holds.

     - Formal margin-for-error argument (8 min):
          - Let p_i: the square is dark at step i.
          - To know p_i, there must be a margin for error: p_i must be true at i and at all nearby steps (say, i-1 and i+1). Because if at i+1 the square is not dark, and it looks the same as i, then at i you cannot rule out that you are at i+1.
          - So to know p_i, we require that p_i+1 holds? Not exactly. We require that p_j holds for all j within a certain distance of i. This means that p_i can only be known when i is low enough (dark enough) that even if we were at i+1, it would still be dark. So the boundary of knowledge is before the boundary of darkness.
          - Therefore, at the boundary, p_i may hold but you do not know it.

     - KK part: 
          - To know that you know p_i (KK), you must be in a position to know that you are not in a borderline case. This requires an even wider margin: you must be in a region where even if the stimulus were a bit lighter, you would still know p_i. So the margin for KK is wider than for K.

  8. **Conclusion and what we had to state (2 min):**
     - The activity showed the margin for error in practice and the shift, but we had to formally state the argument.

  **Materials to prepare:**
     - 20 image files of gray squares (from black to white).
     - Response sheets for Level 1 (for Group A and Group B) and Level 2 (for the whole class).
     - Scoring key for Level 1 (thresholds T1=5, T2=15).
     - A way to display the images (PowerPoint or a script that shows each image for 10 seconds).

  **Predicted problems:**
     - Time: We are cutting it close. If we run over in the activity, we might have to skip some steps or reduce the number of steps.
     - The Level 2 task might be done poorly by students because it's abstract. We can practice with one step.
     - The projector might not show the fine gradations.

  Given the complexity, I hope this balances the goals within the time.
