  ### **Epistemology Seminar Activity: Margin-for-Error Argument Discovery**
  **Goal:** Students discover the margin-for-error argument against luminosity through an interactive exercise, avoiding direct instruction until debrief. Focus on two core insights:  
  1. **Boundary shift** (path-dependence of knowledge thresholds).  
  2. **Margin widening for higher-order knowledge** (KK principle breakdown).

  **Core Structure:**  
  - **Stimulus:** 20-step grayscale gradient (black = Step 0, white = Step 19), displayed via projector.  
  - **Groups:**  
    - **Group A (Ascending):** Sees steps 0→19 (black to white).  
    - **Group B (Descending):** Sees steps 19→0 (white to black).  
  - **Roles (Tower for KK):**  
    - **Level 1 (L1):** Judges if the square is "dark" at each step.  
    - **Level 2 (L2):** Judges if L1 *can know* it’s dark (no stimulus; only step number/direction).  
    - **Level 3 (L3):** Judges if L2 *can know* about L1’s knowledge (no stimulus; only step number/direction).  
    *(Split roles within each group to build tower.)*

  **Materials to Prepare:**  
  1. **Stimulus Slides:** 20 grayscale squares (RGB values: Step `i` = `(255 * i / 19, 255 * i / 19, 255 * i / 19)`). Use PowerPoint/Google Slides with timed transitions (30s per slide).  
  2. **Response Sheets:** Print for all students (templates below).  
  3. **Scoreboard:** Whiteboard or digital doc to track penalties.  
  4. **Threshold Reference:** Hidden note for you:  
     - **Definitely dark:** Steps 0–5 (penalty for missing "can-tell").  
     - **Definitely not dark:** Steps 15–19 (penalty for false "can-tell").  
     - **Borderline:** Steps 6–14 (no penalties).  

  **Response Sheet Templates:**  
  ```markdown
  // LEVEL 1 (L1) SHEET
  Step | "Can you tell the square is dark?" (Yes/No)
  -----|---------------------------------------------
  0    | [ ]
  1    | [ ]
  ...  | ... // 20 steps

  // LEVEL 2 (L2) SHEET
  Step | "Can L1 tell the square is dark?" (Yes/No)
  -----|---------------------------------------------
  0    | [ ]
  1    | [ ]
  ...  | ... // 20 steps

  // LEVEL 3 (L3) SHEET
  Step | "Can L2 tell whether L1 can tell?" (Yes/No)
  -----|---------------------------------------------
  0    | [ ]
  1    | [ ]
  ...  | ... // 20 steps
  ```

  ---

  ### **Activity Timeline (80 Minutes Total)**
  #### **0–10 min: Setup and Rules**  
  - **0–3 min:** Introduce exercise as a "perceptual knowledge game." Avoid "luminosity," "margin," or "KK."  
    > *"We’re exploring how we judge subtle changes. Half of you see a gradient lightening; half see it darkening. At each step, answer based on your role."*  
  - **3–7 min:** Assign roles (7 students per group, split A/B):  
    - **Group A (Ascending):** 3×L1, 2×L2, 2×L3.  
    - **Group B (Descending):** 3×L1, 2×L2, 2×L3.  
  - **7–10 min:** Explain rules:  
    - **Scoring:**  
      - **L1:** False "can-tell" (saying "Yes" at Steps 15–19): **-5 points**.  
      - **L1:** Missed "can-tell" (saying "No" at Steps 0–5): **-1 point**.  
      - **L2/L3:** No penalties yet (focus on patterns; scoring debriefed later).  
    - **Process:**  
      1. Project stimulus (30s/step).  
      2. L1 marks response.  
      3. Hide stimulus; announce step number.  
      4. L2/L3 mark responses (30s total for L2+L3).  

  #### **10–50 min: Run the Activity**  
  - **Stimulus Flow:**  
    - **Group A:** Steps 0→19 (30s/step, 10 min total).  
    - **Group B:** Steps 19→0 (30s/step, 10 min total).  
  - **Per-Step Process (30s):**  
    1. **0–10s:** Display stimulus. L1 marks "can-tell" (Yes/No).  
    2. **10–20s:** Hide stimulus. Announce step (e.g., "Step 5").  
    3. **20–30s:** L2/L3 mark judgments (L2: "Can L1 tell?"; L3: "Can L2 tell about L1?").  
  - **Track Penalties:** Update scoreboard after each step for L1 errors.  

  #### **50–70 min: Debrief and Argument Assembly**  
  **Guided Discussion (Map observations to premises):**  
  1. **Plot Boundaries (10 min):**  
     - Graph Group A’s and Group B’s L1 "Yes" responses (y-axis) by step (x-axis).  
     - **Observation:** Group A’s "dark" threshold is higher (e.g., stops at Step 12) than Group B’s (e.g., starts at Step 8).  
     - **Premise Discovery:** *"Knowledge thresholds shift with context. If luminosity held, the boundary couldn’t depend on whether you’re coming from dark/light."*  

  2. **Tower Analysis (10 min):**  
     - Overlay L1, L2, and L3 responses for Group A (use Step 10 as example):  
       - **L1:** "Yes" up to Step 12.  
       - **L2:** "Yes" up to Step 9.  
       - **L3:** "Yes" up to Step 6.  
     - **Premise Discovery:** *"To know you know (L2→L1), you need a wider margin than knowing (L1). Each level ‘fails earlier.’"*  

  3. **Address "Carelessness" (5 min):**  
     - Invite student reactions: *"Some penalties felt unfair? Like you were ‘close enough’?"*  
     - **Map to Premise:** *"The objection assumes you *should* know in borderline cases. But the shift shows it’s impossible—your ‘carelessness’ was unavoidable noise in the margin."*  

  4. **State Formal Argument (5 min):**  
     - **What the game can’t produce:** Explicit logic chain. State:  
       > *"1. Knowledge requires a margin for error (nearby cases must not undermine it).  
         2. Borderline cases have no margin (similar cases flip the truth).  
         3. So, no luminosity in borderlines.  
         4. KK fails because margins compound: knowing you know needs a margin for your margin."*  

  #### **70–80 min: Conclusion**  
  - **Key Insight:** *"Luminosity can’t hold where small changes matter. What ‘feels obvious’ depends on path and order—knowledge isn’t luminous in the gaps."*  
  - **Homework Prompt:** *"Find a real-world case where your certainty shifted because of context, not new evidence."*  

  ---

  ### **Predictable Problems + Fixes**  
  1. **"Carelessness" objections dominate:**  
     - **Preempt:** In setup, say *"Penalties target overconfidence, not ‘mistakes’—if you’re unsure, say ‘No’!"*  
     - **Debrief Fix:** Contrast Group A/B shifts to show context, not effort, drives errors.  

  2. **L2/L3 confusion:**  
     - **Preempt:** Role-play examples pre-activity (e.g., *"At Step 15, L2 asks: ‘Could L1 be wrong?’"*).  
     - **Fix:** Clarify during tower analysis—*"L2 isn’t guessing if the square is dark, but if L1 can know."*  

  3. **Grayscale visibility issues:**  
     - **Preempt:** Test projector contrast; use high-gradation steps (0, 3, 6,..., 19).  
     - **Fix:** If unreadable, pivot to **auditory stimulus** (20 tones: 100Hz→1000Hz). Ask *"Can you tell it’s low-pitched?"* Same rules.  

  4. **Time shortfall:**  
     - **Fix:** Skip L3 data (use L1/L2 only) or reduce steps (15→18, 20). Focus debrief on boundary shift.  

  **Why This Works:** Students *feel* the boundary shift and margin widening, making luminosity’s failure visceral. The "carelessness" debate becomes evidence against luminosity, not an objection to dismiss.
