prompt: |-
  im running a 40 minute seminar next week for incoming masters students in health policy — not philosophy people at all, most of them did policy or some life-science undergrad, and right after my session they start a unit on medication adherence and health behaviour change. one whiteboard, no assigned reading. what I want them to leave with is the *problem*: why "she judged that staying on the meds was best, and then didn't take them" is supposed to be puzzling rather than just unfortunate, and what the present-biased / hyperbolic-ish discounting story does and doesn't buy us on that. don't explain any of it to me, I know it well enough — plan how I should teach it.

  so: what has to be in place before the puzzle is even visible to this crowd (I'm guessing something about the gap between wanting to do X and judging X best, and something about "at the moment of action"), in what order, and what specifically collapses if I reorder it. Should I actually draw a discount curve on the board for people who mostly haven't done calculus since school, or does the maths cost me the room — and if I skip the curve, what do I lose?

  which one example should carry the whole session? I was going to use a woman with type 2 diabetes who every evening sincerely plans tomorrow morning's walk and every morning doesn't go. is that the right carrying case, and what does it need to have and lack? (my worry: it smuggles in habit or addiction, and they'll file the whole thing under "thats a disease thing, not a me thing".) if not that one, tell me why not the two obvious replacements — the snooze button and the last slice of cake at a department party.

  then the misconceptions, in the order they'll genuinely arrive rather than a tidy list. my guesses: (a) akrasia is just a fancy word for laziness or low willpower — I was thinking of banning the word "willpower" for the first twenty minutes, good idea or does it block the only route they have in? (b) so it's just that people are impatient and discount the future too much; (c) if her preferences at 7am really differ from her preferences at 9pm, then there's no fact of the matter about what's best for her, so nothing irrational happened; (d) fine, so the fix is precommitment and nudges, can we move on. which of those are the same mistake in different clothes, and at exactly what point in the sequence should I head each one off — I'd much rather defuse them before they form than mop up afterwards.

  one more thing I want stress-tested. I've been toying with a framing of my own: distinguish "cold reversal", where the evening plan survives completely intact and only the pull changes, from "hot reversal", where at the moment of action she also quietly revises what she believes is best — today genuinely is a bad day for a walk, one day off won't matter — and then claim that only cold reversal is real weakness of will, while hot reversal is just ordinary acting on a revised judgment. Does that split hold up? where does it beg the question, and does it belong near the start of the session as a way in, or near the end as a way of sharpening what they've just got?

  finally: what should I openly refuse to get into at this level, and say out loud that I'm refusing — and give me one question I can put to the room in the last three minutes that would actually show me they'd understood the puzzle instead of having just picked up a new vocabulary word.
reasoning: |-
  Okay, let me tackle this step by step. The user is preparing a 40-minute seminar for Master's students in health policy, focusing on the puzzle of why someone would judge an action best but fail to follow through. The students aren't philosophy-oriented; they come from policy or life sciences backgrounds. The session should set up the problem clearly, using the hyperbolic discounting model, while avoiding common misconceptions.

  First, I need to identify what's essential for the students to grasp the puzzle. The gap between judgment and action is key. These students might not see "she judged it best but didn't do it" as puzzling—they might think it's just laziness or lack of willpower. So, establishing that judgment and desire can diverge is crucial. The moment of action versus planning is another vital point. Preferences can shift based on immediacy, which hyperbolic discounting explains.

  The user mentioned using a Type 2 diabetes patient planning a walk but not following through. I agree their concern about it being seen as a "disease thing" is valid. Instead, the snooze button example is relatable and avoids medical associations. Everyone has hit snooze despite planning to get up. It's universal, not tied to health conditions, making the puzzle more personal. The cake example might not work as well because social pressures could complicate the preference shift.

  For the discount curve, drawing it could help visualize how preferences flip with immediacy. Since the students aren't strong in math, keeping it simple—labeling axes, showing steep vs. shallow decline—without calculus terms should work. Skipping it might lose the intuitive grasp of why preferences reverse near the moment of action.

  Common misconceptions need addressing in the order they might arise. Starting with equating akrasia to laziness, so banning "willpower" early forces them to think beyond common terms. Then impatience as the sole cause—highlighting that hyperbolic discounting is about inconsistent discount rates, not just high impatience. Next, the idea that shifting preferences mean no objective "best." Here, emphasizing the planning self's judgment as the benchmark is important. Finally, moving too quickly to solutions like nudges without understanding the underlying inconsistency.

  The user's cold vs. hot reversal framing is interesting. Cold reversal maintains the original judgment while giving in to temptation, which is true weakness of will. Hot reversal involves revising the judgment, which might not be akrasia. Introducing this early helps clarify the puzzle, but it needs careful handling to avoid confusion. Staging it after establishing the discounting model would make it clearer.

  What to avoid? Detailed philosophy debates, multiple discounting models, or neuroscience. Focus on the core puzzle and hyperbolic discounting. The exit question should test if they understand the inconsistency—like why hitting snooze isn't just laziness but a preference shift due to immediacy.

  Overall, structuring the seminar to build the puzzle step by step, using relatable examples, preempting misconceptions, and clarifying the reversal types should help these students grasp the essential problem before their next unit on behavior change.
answer: |-
  Here’s a battle-tested plan optimized for your constraints and audience, designed to make the puzzle *sticky* without philosophy jargon:

  ### **Core Structure & Key Moves**
  1.  **Hook: The Universal Snooze Button (3 min)**
      *   "Raise your hand if you've ever: set an alarm for 6 AM to exercise/study, fully intending to get up... then hit snooze 5 times. Why is this *weird*? You *knew* at 6 AM that getting up was best for your goals. You even *wanted* your future self to do it last night. What happened between 9 PM and 6 AM? *That's* our puzzle." **Why this works:** Instant relatability, zero stigma ("disease thing" avoided), pure judgment-action gap. Cake is good but snooze has stronger temporal immediacy/shift.

  2.  **Build the Puzzle Foundation (Critical - 12 min)**
      *   **Step 1: Separate JUDGMENT vs. WANTING (5 min)**
          *   "Jane (T2D or Snooze Jane): At 9 PM, she *judges* the walk/getting up is *best overall* for her health/goals. She also *wants* (prefers) to do it *tomorrow*."
          *   "Key Point: Judgment and Wanting *can* align (9 PM) but aren't the same thing. We often use 'want' sloppily."
      *   **Step 2: The Moment of Action & Immediacy (7 min)**
          *   "Fast forward to 6 AM. The walk/alarm is *now*. What does Jane do? She doesn't go/hits snooze."
          *   **CRUCIAL QUESTION:** "In that *moment*, at 6 AM, does she still *judge* the walk/getting up is best overall? (Pause, let them guess). *Assume for now she says yes*. She *knows* it's best, but she doesn't do it. What does she *want* (prefer) *right now at 6 AM*?" (Answer: To stay in bed).
          *   **Puzzle Erected:** "So: At 9 PM: Judges X best, Wants Future Self to do X. At 6 AM: (Assume) Still Judges X best, but *Now* Wants Not-X. *Why* does her *wanting* flip when X becomes immediate, *even if her judgment about what's best stays the same*? That's the head-scratcher. It's not just unfortunate; it's a conflict *within herself* across time."

  3.  **Introducing the Discounting Story (10 min)**
      *   **DRAW THE CURVE (Simple Version - YES, DO IT - 7 min):**
          *   X-axis: Time (Now ---> Future). Y-axis: Subjective Value (High ---> Low).
          *   Draw a **shallow, straight line** descending to the right: "This is how a perfectly rational, patient planner *should* value future rewards/costs. $100 next year is worth maybe $95 today."
          *   Now draw a **steep, curving line** starting high at "Now" and plunging down quickly, then flattening out: "This is hyperbolic discounting. Value *plummets* for even tiny delays from *right now*, but flattens for things further out. $100 *tomorrow* feels way less valuable than $100 *right now*, but $100 in 1 year vs. 1 year + 1 day? Barely different."
          *   **APPLY TO JANE:** "At 9 PM (Future Planning): The *cost* (effort/discomfort of walk/getting up) and the *reward* (health benefits) are *both* in the future. The steep part doesn't bite. She compares the flatter parts. Reward wins - she judges it best *and* wants it done."
          *   **At 6 AM (Moment of Action):** The *cost* (getting out of bed NOW) is IMMEDIATE – its value (disvalue) spikes on the steep curve. The *reward* (feeling good later, long-term health) is STILL future – its value is still on the flatter part. The immediate cost looms huge. NOW she prefers staying in bed, *even if she still judges the walk best overall*."
      *   **What it Buys Us (2 min):** Explains the *flip in wanting/preference* based on temporal proximity, *without* needing her judgment to change. Makes the preference reversal predictable.
      *   **What it DOESN'T Buy Us (1 min):** *(Planting seeds for misconceptions)* It doesn't say this is "rational." It doesn't explain *why* brains discount this way. It doesn't tell us if the 9 PM self or 6 AM self is the "real" self. It doesn't solve the problem, just models it.

  4.  **Tackling Misconceptions Head-On (Preemptive Strike Order - 12 min)**
      *   **MISCONCEPTION (a) "It's just laziness/low willpower" (Targeted RIGHT after explaining discounting - 3 min):**
          *   "Sometimes we call this 'weakness of will' or 'akrasia'. But 'laziness' or 'low willpower' often just *names* the puzzle; it doesn't *explain* the flip. Jane wasn't 'lazy' at 9 PM planning the walk! The discounting story gives a *mechanism* for why the 'will' feels weak *at the moment of action*. **Ban 'willpower' initially? YES.** Force them to describe the *conflict in terms of judgment vs. immediate wanting*. Re-introduce "willpower" later only as shorthand for overcoming the steep discount curve.
      *   **MISCONCEPTION (b) "So it's just impatience/future discounting" (Preempt when introducing discounting - Covered above):**
          *   Stress: "It's not *just* discounting the future *a lot*. It's the *specific shape* – the steep drop for immediate delays – that causes the *reversal*. Constant high discounting (steep straight line) wouldn't cause this flip; you'd always prefer smaller sooner rewards. The *hyperbolic shape* is key to the inconsistency."
      *   **MISCONCEPTION (c) "No real self, no irrationality" (Target after establishing the puzzle & discounting - 5 min):**
          *   "But wait! If 9 PM Jane wants X and 6 AM Jane wants Not-X, who's to say which is her 'true' preference? Maybe there's no puzzle?"
          *   **Counter:** "Remember the *judgment*. We're assuming Jane, *at both times*, still *judges* X is best overall for her goals/life. The 6 AM self isn't saying 'Screw health, bed is objectively better!' She's saying 'I *know* getting up is best... but bed is so comfy *now*.' The conflict is between her *endorsed*, considered judgment (stable) and her *momentary desire* driven by immediacy. That *tension* is the irrationality – acting against your own stable best judgment."
      *   **MISCONCEPTION (d) "Just precommit/nudge, move on" (Save for very end - 2 min):**
          *   "Okay, so the fix is binding commitments or changing defaults, right? Done?" **Counter:** "Those *are* crucial tools! But understanding *why* they work (bypassing the moment of steep discounting) and *why* the problem exists helps you design *better* interventions. It also shows why just giving people information ('This is good for you!') often fails at the moment of action. The puzzle explains the *need* for those tools."

  5.  **Your Cold vs. Hot Reversal Framing (4 min - Place HERE, after misconceptions)**
      *   **YES, use it, but as a SHARPENING TOOL near the end.** "Let's refine the puzzle. We assumed Jane at 6 AM *still judges* the walk best. Call this **'Cold Reversal'**: Judgment intact, pure preference flip due to immediacy (discounting!). This is classic 'weakness of will'. But sometimes, at 6 AM, Jane *also revises her judgment*: 'One day off won't matter, I'm extra tired today.' Call this **'Hot Reversal'**: Judgment changed *plus* preference flip. Is *this* weakness of will? Maybe, maybe not. Maybe it's just new info or a reasonable update! **The *core, philosophically puzzling* case is COLD REVERSAL** – acting against your *enduring, unchanged* best judgment purely because the cost/reward is now immediate. That's what hyperbolic discounting uniquely explains." **Why here?** It prevents them dismissing *all* cases as "oh, they just changed their mind." It isolates the core irrationality. *Don't start with it – build to it.*

  6.  **What to REFUSE & The Exit Question (4 min)**
      *   **Openly Refuse:**
          *   "We won't dive into *why* brains discount hyperbolically (evolution? neuroscience?)."
          *   "We won't debate other models of time inconsistency (like simple present bias without reversal)."
          *   "We won't solve deep philosophy: Is the 'Planning Self' the 'real' self? (But we rely on stable judgment!)."
          *   "We're focusing on the *structure* of the problem, not clinical solutions... yet. That's your next unit!"
      *   **The Exit Question (LAST 3 min - Ask for a show of thumbs up/down or quick 1-word answers after each):**
          *   "Imagine Sarah, at her doctor's office (Tuesday), *sincerely judges* that filling her prescription immediately and taking the pill daily is best for her health. She *wants* to do it."
          *   "On Wednesday, she walks past the pharmacy. Does she still *judge* taking the pill daily is best? (Assume YES)."
          *   "She doesn't go in. She tells a friend later: 'I just couldn't be bothered, it seemed like a hassle *right then*.'"
          *   **QUESTION: "Is Sarah's failure to go to the pharmacy *primarily* an example of:**
              *   **(A) Cold Reversal (judgment stable, immediate hassle loomed large)?**
              *   **(B) Hot Reversal (she changed her mind about it being best)?**
              *   **(C) Just ordinary impatience?**
              *   **(D) Not really puzzling? She just prioritized something else."**
          *   **What shows understanding:** A strong consensus for **(A)**. If they get this, they've grasped the core puzzle and the discounting story's target. Follow-up: "Why not (B)? (She didn't say she changed her judgment). Why not (C)? (Ordinary impatience wouldn't explain the *planning* vs. *action* reversal). Why not (D)? (It *is* puzzling if her judgment was stable!)."

  ### **Why This Order & Key Tactics**
  *   **Snooze First:** Builds immediate buy-in. Diabetes example is great for *health policy*, but do it secondarily ("This applies directly to medication adherence, like our Sarah example...").
  *   **Puzzle Before Mechanism:** They need to *feel* the weirdness ("Why *is* hitting snooze irrational?") before the explanation satisfies it.
  *   **Judgment/Wanting Split is NON-NEGOTIABLE:** Without this, the puzzle collapses into "she changed her mind" or "she didn't *really* want it." Order collapse point: Doing discounting before firmly establishing a *stable judgment* makes (c) and hot reversal seem inevitable.
  *   **Draw the Curve:** It's visual and intuitive. **Skip calculus!** Label axes clearly (Time, Value/Desirability). Emphasize the *steep plunge near NOW* and the *flattening later*. What you lose by skipping: The precise mathematical distinction from exponential discounting. What you gain: An intuitive grasp of the *reversal mechanism*. Worth it.
  *   **Preempt Misconceptions in Flow:** Address (a) when naming the phenomenon, (b) when drawing the curve, (c) when the "different selves" objection naturally arises, (d) when they want the "so what."
  *   **Cold/Hot as Clarifier, Not Foundation:** Starting with it begs the question ("What counts as a 'judgment'?"). Use it to refine the target *after* they get the basic model.
  *   **Sarah Question:** Tests if they can apply the core concepts (stable judgment + immediacy-driven preference flip = puzzling cold reversal) to a health policy adjacent vignette.

  This plan respects their background, maximizes engagement with relatable examples, isolates the essential philosophical puzzle within a behavioral framework, preempts dead-end thoughts, and gives you a clear metric for success. Good luck!
