prompt: |-
  I spent my career in observational astrophysics and have been reading philosophy for a few years since retiring, mostly probability theory and cosmology. I keep running into a pair of argumentative moves that I cannot get straight, and I want to know whether what I have noticed is already recognized, and if it is not, what it should be called and how exactly it should be cut.

  First instance. An author argues that among two cosmological hypotheses otherwise equally well supported — one on which the universe contains about 10^11 observers, one on which it contains about 10^24 — I should be overwhelmingly confident in the second, on the grounds that a crowded universe is enormously better at placing an observer like me in existence at all. A chapter later, the same author argues that I should regard myself as a random draw from the humans who ever live, that my birth rank is therefore data, and that this supports the conclusion that our species will end soon rather than spreading through the galaxy. I checked the interaction: applying the first move inside the second argument cancels its conclusion, and applying the second move inside the first argument produces no shift at all, since under both cosmological hypotheses every observer has the same evidence. So the two are not two ways of saying one thing. They pull in opposite directions, and which one is reached for determines the answer.

  Second instance, scaled down so I could check my arithmetic. A researcher creates either ten or ten thousand subjects, all treated identically; you are told you are one of them and asked which. The existence move gives a thousand to one for the larger batch. The random-draw move gives nothing, because every subject would have the same evidence either way. But if the researcher instead tells you your serial number is 7, the random-draw move suddenly bites hard and in the opposite direction: 7 is a far more surprising draw from ten thousand than from ten. So the bite of each move seems to depend on whether the datum is that I am, or where in the series I am.

  My reconstruction is that the first move multiplies the prior odds by the ratio of the observer numbers the hypotheses allow for, while the second divides them by roughly that same ratio, which is why they cancel. I do not trust that reconstruction, and I do not know what I am looking at. So:

  1. Are these two moves established, and do they have names? Is the cancellation a known result or an artifact of my crudeness?

  2. What exactly is the datum in each case? Are they genuinely rival principles, or one principle plus a choice about what to condition on, or one principle plus a choice about the pool from which I am to be treated as a random draw? I suspect the pool does all the real work, since drawing it wider or narrower appears to move the conclusion anywhere one likes; if so, is there any principled constraint on the pool, and does the absence of one discredit the whole family of arguments?

  3. Is the switching I noticed — one author, two rules, opposite conclusions, selected to suit — a recognized pathology with a name of its own, or does it need one? If it needs one, I want a definition and boundary cases, not a label.

  4. Where does each move break? I can think of hypotheses on which the number of observers is infinite; pools that include observers who never in fact exist; extra observers whose evidence differs from mine; and extra observers I could never have been, being of another epoch, another species, or outside my causal reach. Does the machinery say anything disciplined about these, or does it simply return whatever the pool choice was set to?

  5. A subsidiary puzzle: the datum in the first move is something I have known since childhood, long before I held any view about cosmology, and I do not see how it can be doing confirmatory work now.

  I am not after a bibliography or a term to look up. I want the joints: what this phenomenon is, what it is not, which nearby established distinctions it resembles and how it differs from each, and where its edges lie.
reasoning: |-
  Okay, the user is an astrophysicist turned philosopher grappling with two probabilistic reasoning methods that yield contradictory conclusions. Let me unpack their core frustration: they've noticed a bait-and-switch in anthropic reasoning where "existence weighting" and "random sampling" are selectively applied to support opposing cosmological claims. 

  First, I need to verify if their observation is novel. The tension between SSA and SIA is documented (Bostrom discusses it in Anthropic Bias), but the user's emphasis on the reversible mathematical cancellation - how applying each method to the other's scenario neutralizes the original conclusion - feels underexplored. Their serial number example perfectly exposes how the same datum ("I exist" vs "I am observer #7") flips the inference direction. That's the joint they're probing.

  The user's reconstruction seems correct mathematically but misses the philosophical framing. The core issue is reference class specification - whether we condition on "humans who exist" (SSA) or "possible observers" (SIA). When they ask about principled constraints on pools, they're hitting the Achilles' heel of anthropics: reference classes are convention-laden. Bostrom's "epistemically indistinguishable" criterion helps but crumbles for Boltzmann brains or multiverses.

  Their subsidiary puzzle about trivial evidence is profound. "I exist" can't confirm cosmologies if it was always true - that's the problem of old evidence Bayesianism struggles with. The escape hatch is recognizing anthropic evidence isn't "I exist" but "an observer with my exact indexical properties exists in this cosmological structure."

  For boundary cases: infinities break both methods (measure problem), while causally disconnected observers introduce arbitrary priors. The user's hunch that pool choice dominates conclusions is correct - which explains why debates about "are we typical?" feel interminable.

  What they need isn't terminology but conceptual cartography: a map showing where each method applies, their failure modes, and why their incompatibility isn't a bug but a feature of indexical uncertainty. I'll structure this as a dissection of the moves' mathematical skeletons and philosophical entrails.
answer: |-
  Your observation cuts to the heart of unresolved tensions in anthropic reasoning and probability theory. These are not mere artifacts; you've identified a fundamental schism between two competing principles for handling indexical information (information about *your* place in the universe). Here's the dissection you requested, focusing on joints and distinctions:

  **1. Recognition, Naming, and Cancellation:**
      *   **The Moves:** Yes, these are established but contentious principles.
          *   **First Move (Supporting Larger Universes):** This is the **Self-Indication Assumption (SIA)**. It roughly states: *Given that you exist, you should proportionally favor hypotheses that make your existence more probable.* Hypotheses predicting more observers make your existence (as *some* observer) more probable.
          *   **Second Move (Doomsday Argument):** This relies on the **Self-Sampling Assumption (SSA)**. It states: *You should reason as if you are a random sample from the set of all observers in your reference class who will ever exist.* Your birth rank becomes a data point drawn from this distribution.
      *   **The Cancellation:** Your reconstruction is **essentially correct mathematically** and **not an artifact of crudeness**. Applying SSA within an SIA framework (or vice versa) often neutralizes the effect. Specifically:
          *   SIA multiplies the prior odds ratio by (N₂ / N₁), where N₂ and N₁ are the number of observers under each hypothesis.
          *   The core Doomsday Argument (using SSA with birth rank) multiplies the prior odds ratio by (P(Data|H₂) / P(Data|H₁)) ≈ (N₁ / N₂) if the data (your birth rank) is middling relative to the smaller population N₁ but surprising relative to the much larger N₂.
          *   Result: (N₂ / N₁) * (N₁ / N₂) ≈ 1. The shifts cancel. This highlights a deep incompatibility between the core intuitions driving SIA and the standard SSA-based Doomsday Argument. Bostrom ("Anthropic Bias") discusses this tension explicitly.

  **2. The Datum, Rivalry, and the Reference Class Problem:**
      *   **The Datum:**
          *   **SIA Move:** The datum is simply "I exist." SIA interprets this datum as evidence favoring hypotheses where "I exist" is rendered less surprising/more probable, which correlates with larger numbers of observers.
          *   **SSA Move (Cosmology):** The datum is "I exist with this specific set of indexical properties" (birth rank, location, temporal position, species, etc.). The argument focuses on how typical or atypical this specific property (e.g., low birth rank) is under each hypothesis *relative to the reference class*.
      *   **Rivalry vs. Conditioning/Pool Choice:**
          *   They are **genuinely rival principles** for interpreting the evidential weight of indexical information, stemming from different intuitions about how to handle observer selection effects.
          *   However, the **reference class is absolutely central and does the heavy lifting**. SIA effectively assumes a very broad reference class (all *possible* observers under a hypothesis). The standard SSA Doomsday argument assumes a specific, narrow reference class (e.g., all humans who will ever exist).
          *   **The Pathology:** The core issue is the **lack of a principled, universally agreed-upon way to define the reference class**. This arbitrariness is the primary source of the switching you observe. An author can often get their desired conclusion by choosing the reference class that makes their preferred principle bite when they want it to and be inert when they don't.
          *   **Constraint?** Proposed constraints exist but are contested:
              *   **Epistemic Indistinguishability:** Include only observers who could have had experiences indistinguishable from yours *at the time of observation*. (This tries to handle different species/epochs).
              *   **Causal Connection:** Restrict to observers within your past/future light cone. (Addresses acausal copies, Boltzmann Brains).
              *   None are universally accepted. The absence of a definitive constraint is a major criticism of anthropic reasoning.

  **3. The Switching Pathology: Recognition and Naming:**
      *   **Recognized:** Yes, this selective application to reach predetermined conclusions is widely recognized as a major flaw in anthropic reasoning.
      *   **Names:** It's often called **"reference class gerrymandering"** or **"indexical inconsistency."** It highlights the **inherent ambiguity and susceptibility to bias** in applying SSA/SIA without a fixed, justified reference class.
      *   **Definition:** The pathology occurs when an argument switches between different anthropic principles (SIA, SSA) or implicitly changes the reference class definition *within a single line of reasoning or across arguments by the same author*, specifically to support a desired conclusion, without providing a consistent, principled justification for the choices made.
      *   **Boundary Case:** If an author consistently uses SSA with a fixed, well-justified reference class (e.g., "all humans ever" for Doomsday, excluding aliens even if they exist) for *all* relevant problems, that avoids this pathology (even if the conclusion is controversial). The pathology is the *inconsistent* or *unprincipled* switching to manipulate the outcome.

  **4. Where the Moves Break (Boundary Cases):**
      *   **Infinite Observers:** Both SSA and SIA face the **measure problem**. Ratios like N₂/N₁ or P(Your Rank) become undefined or depend entirely on the limiting procedure used to handle infinity (e.g., taking finite volumes). This is a major unsolved problem in cosmology and probability theory.
      *   **Non-Existent Observers (in the pool):** SSA typically draws from observers who *actually exist* under the hypothesis. Including merely *possible* observers pushes it towards SIA territory. SIA explicitly includes possible observers. This is a key distinction: SSA conditions on *actual* existence; SIA conditions on *possible* existence.
      *   **Observers with Different Evidence:** This is where the **reference class** becomes crucial. If the reference class is defined too broadly (including observers with vastly different evidence), applying SSA leads to absurdity (e.g., why aren't you a Boltzmann Brain?). Constraints like "epistemically indistinguishable" aim to fix this. SIA also struggles if the hypothesis predicts many observers with evidence radically different from yours.
      *   **Observers You "Couldn't Have Been" (Epoch, Species, Causal Disconnect):** See "reference class" above. This is the core challenge. The machinery *itself* doesn't dictate the answer; the outcome is dictated by the *chosen* reference class. If you include them, they influence the calculation; if you exclude them, they don't. The machinery is silent on the "correct" choice, which is precisely why gerrymandering is possible.

  **5. The Subsidiary Puzzle (Old Evidence):**
      *   This is a profound point and a standard criticism of SIA applied naively to cosmology. You've known "I exist" forever. How can it confirm a vast multiverse *now*?
      *   **Resolution Attempts:**
          *   **New Framework:** Learning the *detailed structure* of different cosmological hypotheses (e.g., eternal inflation predicts vast numbers of observers) provides a *new context* for your old evidence. It reveals that your existence is *less surprising* under one broad class of hypotheses (those with many observers) than under others (those with very few). The evidence "I exist" *does* distinguish between these hypotheses *now* that they are formulated.
          *   **Bayesian Update:** Formally, you update your credence when you learn a hypothesis H predicts a large number of observers N. The likelihood P(I exist | H) is proportional to N (under SIA), so learning H (and its implication for N) *does* change the evidential weight of "I exist" relative to a hypothesis H' predicting a small N. Your knowledge of "I exist" was background; the new hypothesis structure makes it relevant data *for comparing H and H'*.
          *   **Counter:** Critics argue this still feels like double-counting or misapplying evidence. The debate continues.

  **The Joints Summarized:**

  1.  **Core Tension:** SIA (favoring hypotheses where existence is probable/large universes) vs. SSA (reasoning as a random sample from a defined reference class).
  2.  **Mathematical Heart:** SIA typically weights by N (observer count); SSA weights by 1/N for evidence about your specific position within a large pool.
  3.  **Critical Hinge:** The **Reference Class** definition. This is the primary axis of ambiguity and manipulation.
  4.  **Pathology:** **Reference Class Gerrymandering** or **Indexical Inconsistency** – selectively applying principles or shifting reference classes to reach desired conclusions.
  5.  **Breaking Points:** Infinity (measure problem), non-existent or causally disconnected observers, observers with different evidence – all reduce to the unsolved reference class problem.
  6.  **Distinction from Similar Issues:** This is distinct from:
      *   *Standard Bayesian updating with non-indexical data* (e.g., galaxy counts).
      *   *Pure observer selection effects* (e.g., we must find ourselves on a planet supporting life) which are less controversial.
      *   *The Simulation Argument* (which often *uses* anthropic reasoning but is a distinct claim).
      *   *Old Evidence Problem in General*: The anthropic application is a specific, indexical instance where the datum ("I exist") feels trivial, but the hypothesis space gives it leverage.

  **Conclusion:** You've identified the central flaw in anthropic probability: the lack of an objective, principled way to define the "we" in "what should *we* expect?" The rivalry between SIA and SSA, and the dominance of the reference class choice, means these arguments are highly sensitive to philosophical presuppositions and vulnerable to motivated reasoning. They are tools that *can* offer insights under strict, consistent frameworks but are easily misused. The cancellation you observe is a mathematical symptom of this deeper conceptual tension. There is no consensus resolution; it remains a major open problem in philosophy of cosmology and probability.
