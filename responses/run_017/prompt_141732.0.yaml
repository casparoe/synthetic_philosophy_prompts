prompt: |-
  I sit on a committee that has to write guidance for two quite different jobs, and I want the specification before I look at any candidate view. Job one: at the bedside — telling the family of a patient who is behaviourally unresponsive whether there is residual experience at all, and roughly how much, on the basis of data we can actually get (clinical exam, EEG, perhaps a magnetic pulse and the EEG response to it, in a patient whose individual connectivity we do not know). Job two: in a statute — deciding which animal taxa fall above a line that triggers welfare protections, which requires the quantity to be comparable across architectures that share no obvious common currency. If the two jobs pull apart, optimise for job one and say where the sacrifice falls.

  What I am asking for is a spec for a *measure* — a quantity with a principled zero point — not a yes/no test of responsiveness and not a metaphysical account of what consciousness is. But tell me first whether that separation is coherent: can a measure be adequate for my purposes while remaining silent about which physical systems have any consciousness and why, or does any usable measure smuggle in enough of a theory that I should have been asking for the theory?

  Below is the pile of requirements I have accumulated. Some of them I suspect are genuine desiderata, some I suspect are prejudices of one camp dressed as requirements, and some probably collapse into each other. Sort them, revise them, throw out the ones that are not real, and add the ones I have missed — with the case or consideration behind each, and marked as non-negotiable or as a preference of a camp.

  1. *Clinical estimability*: the quantity must be estimable at the bedside, non-invasively, without knowing that patient's full causal architecture.
  2. *Divergence from behaviour*: it must come apart from behavioural responsiveness wherever first-person reports say experience persists without it — dream-enactment during sleep, dissociative anaesthesia with eyes open and no response, unresponsive patients who can willfully modulate their brain activity on instruction, awareness under anaesthesia with subsequent recall.
  3. *Principled zero*: the difference between none and a little must not be set by a threshold fitted to the very behavioural measures the quantity is meant to replace.
  4. *Description-invariance*: the value must not swing with the spatial or temporal grain of the description — cells or columns or regions, milliseconds or hundreds of milliseconds — and if a grain must be chosen, the choice must fall out of the theory rather than from convenience.
  5. *Composition*: it must take a stance on (i) whether two identical, non-interacting brains contain twice as much as one, (ii) whether causally joining them changes the total, (iii) whether one system can contain nested subsystems that are themselves conscious, and (iv) what happens when two overlapping candidate systems come within a few percent of each other — a patient's consciousness must not flicker or split because measurement noise decided which of two near-ties is maximal.
  6. *Structure over size*: it must not rank the cerebellum's contribution as large merely because of its neuron count — on the usual estimates it contains several times as many neurons as the cerebral cortex — or because of its metabolic activity, and it must either explain why a structure that large contributes so little to waking experience while much smaller cortical and brainstem lesions can abolish it, or explain why that appearance is misleading.
  7. *Splitting and subtraction*: it must say what callosotomy and childhood hemispherectomy do to the amount, and the answer must not simply be read off the number of hemispheres remaining.
  8. *Shape of degradation*: it must discriminate dreamless sleep, dreaming sleep, sedation, dissociation and seizure states, and it must respect the distinction between *less* consciousness and consciousness *of a different kind* — or argue that the distinction is spurious.
  9. *Functional preservation*: for the familiar fading- and dancing-qualia cases, and for my variant — tissue progressively rewired so that overall input-output behaviour is preserved while internal integration is degraded — it must say whether the quantity declines, and you must tell me whether "must not decline when function is preserved" is a desideratum or a functionalist prejudice.
  10. *Cross-architecture comparability*: for job two, whether numbers from a fish, a pig and a human are on one scale at all.
  11. *Non-inflation*: it must not assign large amounts to simple systems — a large grid of logic gates, say — nor let consciousness switch on abruptly at some complexity threshold for no principled reason. Is "no panpsychism" a requirement or a taste?
  12. *Computability in principle*: quantities defined as a maximum over all partitions or all subsystem compositions are superexponentially expensive and in practice get replaced by proxies; say whether literal computability is required, or whether a licensed proxy can inherit the standing of the quantity it approximates.
  13. *Version-robustness*: if the formalism is revised, the verdict on a given patient should not flip. (The major research programmes have all been revised more than once; I take that as a fact about the field, not a criticism, but it affects how much weight I can put on any single number.)

  Two things I want beyond the list. First: which subset of the desiderata, once cleaned up, is jointly unsatisfiable? That is the part I most care about, because if the spec itself is impossible then my committee needs to know which requirement to sacrifice rather than which candidate to pick. Second: which single requirement does the most work in excluding candidates?

  Then, briefly — a table, a line or two each, no more: how integrated-information-style measures, global-broadcasting accounts, higher-order or attention-schema accounts, and behaviour-calibrated complexity indices derived from the EEG response to stimulation each do against the final list. The scorecard is not the deliverable; the criteria are.
reasoning: |-
  Hmm, the user is on a committee that needs to create guidance for two very different jobs related to consciousness measurement. The first job is clinical - assessing residual consciousness in behaviorally unresponsive patients at the bedside. The second job is statutory - determining which animal species deserve welfare protections based on comparable consciousness levels across different neural architectures. They want to optimize for the clinical application if there's a conflict.

  The user has provided a long list of requirements for a consciousness measure and wants help sorting them. They need to know which requirements are genuinely important, which might be biased viewpoints disguised as requirements, and which might be redundant. The key question is whether these requirements can be realistically met together or if there are fundamental incompatibilities.

  Looking at their list, I can see several tensions. The clinical estimability requirement (needing bedside assessment without knowing the patient's neural architecture) conflicts with the need for cross-architecture comparability. The principled zero requirement (needing a non-behavioral basis for distinguishing between no consciousness and minimal consciousness) is challenging when we rely on behavioral reports as our gold standard for consciousness.

  I notice several requirements that seem particularly problematic when combined: the need for computational feasibility versus exhaustive partitioning; the tension between structure-over-size and composition requirements; and the conflict between functional preservation and divergence from behavior.

  The user also wants to know which requirements do the most work in excluding candidate theories. Requirements like clinical estimability, principled zero, and composition seem particularly restrictive.

  For the quick assessment of different theories, I'll focus on how each approach handles the critical requirements. Integrated Information Theory (IIT) has serious computational issues but offers a principled zero. Global workspace theories are computationally feasible but rely on behavioral calibration. Higher-order theories face challenges with principled zero and clinical estimability. EEG-based complexity indices are clinically practical but may lack architectural neutrality.

  The main incompatibility appears between clinical practicality and theoretical robustness - we can't have a measure that's both easy to calculate at the bedside and theoretically rigorous across all architectures. The user should prioritize clinical needs and acknowledge the theoretical compromises this requires.
answer: |-
  Here's a specification refined from your requirements, sorted by criticality for **Job One (Clinical Bedside Assessment)**, with rationale and prioritization. The core incompatibilities arise from the tension between **clinical practicality** and **theoretical robustness/comparability**.

  ### Revised & Sorted Specification for a Consciousness Measure (Optimized for Job One: Bedside Assessment)
  *(Non-negotiable for Job One marked `***`, Strong Preference `**`, Camp Preference/Contextual `*`, Sacrificed for Job Two `[S]`)*

  1.  **Clinical Estimability `***`:**
      *   **What:** Must be estimable non-invasively (EEG +/- TMS-EEG, fMRI feasible in some settings) at the bedside, using protocols feasible in a clinical environment, *without requiring prior knowledge of the individual patient's specific neural connectivity map*.
      *   **Why:** Core constraint of Job One. Without this, the measure is useless at the bedside.
      *   **Type:** Non-negotiable.

  2.  **Principled Zero (Non-Behavioral) `***`:**
      *   **What:** The zero point ("no residual experience") must be defined based on the measure's intrinsic properties and theoretical grounding, *not* by calibration against behavioral responsiveness thresholds (e.g., CRS-R scores). The difference between zero and non-zero must be theoretically meaningful.
      *   **Why:** Essential to avoid circularity and fulfill the core purpose of detecting consciousness *divorced* from behavior. Inherits justification from Divergence cases.
      *   **Type:** Non-negotiable.

  3.  **Divergence Cases `***`:**
      *   **What:** Must yield positive values in empirically documented states where experience persists without overt behavior: REM sleep (dreaming), verified covert awareness in DOC (via fMRI/EEG modulation), awareness under anesthesia with recall, dissociative states.
      *   **Why:** This is the *empirical validation* criterion demonstrating the measure detects consciousness independent of behavior. Failure here invalidates the measure for Job One.
      *   **Type:** Non-negotiable (validates Principled Zero).

  4.  **Shape of Degradation (Discriminative Validity) `**`:**
      *   **What:** Must show a consistent, interpretable pattern of values across major states: wakefulness > dreaming (REM) > NREM sleep (dreamless) ≈ deep sedation ≈ generalized seizure (absence/petit mal) > propofol-induced unconsciousness ≈ deep coma. Must distinguish *levels* (e.g., deep vs light sedation) and potentially *kinds* (e.g., dreaming vs wakeful).
      *   **Why:** Demonstrates sensitivity to known physiological changes in consciousness level/type. Provides context for interpreting patient values.
      *   **Type:** Strong Preference (core validity evidence).

  5.  **Structure over Size (Cerebellum Problem) `**`:**
      *   **What:** Must assign minimal contribution to consciousness from the cerebellum relative to thalamocortical systems, *despite* its high neuron count/metabolism. Must explain why large cerebellar lesions minimally affect consciousness while small brainstem/thalamic lesions can abolish it (e.g., by linking the measure to specific network dynamics/architectures).
      *   **Why:** Avoids biologically implausible results undermining credibility. Highlights the need for the measure to reflect *functional architecture* relevant to consciousness, not just bulk properties.
      *   **Type:** Strong Preference (addresses a major biological constraint).

  6.  **Version-Robustness `**`:**
      *   **What:** Minor, theoretically justified revisions to the underlying formalism should not drastically alter the classification (conscious/non-conscious) or relative ordering of *well-characterized states or typical patients*. Revisions should refine, not flip, interpretations.
      *   **Why:** Provides practical stability for clinical use and guidelines. Acknowledges scientific progress while requiring core stability.
      *   **Type:** Strong Preference (clinical practicality).

  7.  **Computability in Principle (via Licensed Proxy) `*`:**
      *   **What:** The underlying theoretical quantity need not be computable in practice on full brain data. However, there must be a *licensed, theoretically justified proxy* (e.g., PCI, Perturbational Complexity Index) that is clinically feasible (seconds/minutes) and demonstrably correlates with the core theoretical construct *in relevant contexts*.
      *   **Why:** Absolute theoretical computability is impossible for complex measures. A valid, practical proxy is essential for Job One.
      *   **Type:** Camp Preference/Requirement (resolves theory-practice gap).

  8.  **Splitting and Subtraction (Practical Interpretation) `*`:**
      *   **What:** Must provide a consistent interpretation for split-brain (callosotomy) and hemispherectomy. The outcome should *not* simply count hemispheres, but reflect the functional integration/segregation resulting from the procedure. The measure should not "flicker" or show instability with minor measurement noise near critical thresholds.
      *   **Why:** Addresses neurobiological realities and ensures practical interpretability. Stability is crucial for clinical decisions.
      *   **Type:** Camp Preference (clarity on neuro edge cases).

  9.  **Description-Invariance (Operational Grain) `*`:**
      *   **What:** The estimated value must be robust to reasonable choices of spatial/temporal grain used in the clinical measurement protocol (e.g., EEG electrode density, frequency band resolution, TMS intensity). The *protocol* defines the operational grain, not an abstract theory.
      *   **Why:** Absolute invariance is unrealistic. Clinical protocols have inherent resolution limits. Robustness within these limits is key.
      *   **Type:** Camp Preference (methodological pragmatism).

  10. **Non-Inflation (Avoid Trivial Systems) `[S]`:**
      *   **What:** Should not assign high values to simple systems like large grids of non-interacting logic gates, feedforward networks, or thermodynamic systems. "No panpsychism" is a strong preference for Job One practicality.
      *   **Why:** Maintains face validity and avoids absurd conclusions *in biologically relevant contexts*. Necessary for clinical credibility.
      *   **Type:** Sacrificed for Job Two (Cross-Architecture). A preference, not a strict requirement for Job One if clinical validity holds.

  11. **Functional Preservation (Fading Qualia) `[S]`:**
      *   **What:** "Must not decline when input-output function is preserved" is a *functionalist prejudice*, not a requirement. The measure *must be sensitive* to internal degradation even if I/O is preserved (as in your rewiring variant). Consciousness might depend on specific internal dynamics, not just function.
      *   **Why:** Job One requires detecting consciousness based on internal state, potentially diverging from behavior/function. Insisting on functional preservation contradicts the core goal.
      *   **Type:** Sacrificed (Rejected as a requirement; functionalism is the *prejudice* here).

  12. **Composition `[S]`:**
      *   **What:** (i) Twins: Silent or acknowledge scaling ambiguity. (ii) Joining: Silent or acknowledge potential change. (iii) Nesting: Silent or allow possibility. (iv) Overlap/Near-Ties: Prioritize stability (see Splitting) - the measure should be robust, not flicker. *No definitive stance required for Job One.*
      *   **Why:** These are deep metaphysical/philosophical questions. A clinically useful bedside measure does not need to resolve them. Focusing on the *patient's main system* is sufficient.
      *   **Type:** Sacrificed for Job Two (Cross-Architecture/Comparability).

  13. **Cross-Architecture Comparability `[S]`:**
      *   **What:** Requires numbers from vastly different architectures (human, pig, fish, octopus) to be meaningfully compared on a single scale, establishing a "line" for welfare.
      *   **Why:** Core requirement for Job Two, but fundamentally conflicts with Clinical Estimability and Principled Zero defined for human brains. Requires a universal theory/currency Job One avoids.
      *   **Type:** Sacrificed for Job One optimization.

  ### Key Incompatibilities (Jointly Unsatisfiable)

  1.  **Clinical Estimability (without known architecture) + Cross-Architecture Comparability:** Bedside measures rely on proxies tuned to human neurobiology and available tools (EEG). Comparing across radically different, unknown architectures (e.g., octopus) requires a universal theory defining a common currency, which necessitates understanding the specific architecture – impossible at an alien bedside. *Sacrifice Cross-Architecture.*
  2.  **Principled Zero (Non-Behavioral) + Strict Cross-Architecture Comparability:** Defining a non-behavioral zero for humans relies on human-specific data (divergence cases, neuroanatomy). Verifying a true zero in a completely alien architecture without any behavioral correlate (or with different behaviors) is currently impossible. *Sacrifice strict universal Comparability.*
  3.  **Literal Computability + Exhaustive Partitioning/Composition:** Measures requiring super-exponential computation over partitions (e.g., classical IIT Φ) are clinically infeasible. *Sacrifice Literal Computability; require Licensed Proxy.*
  4.  **Structure-over-Size + Simple Composition:** Rejecting cerebellum based on function conflicts with simply summing parts (e.g., "two brains = double"). *Sacrifice Simple Composition; focus on integrated system dynamics.*

  ### Requirement Doing the Most Exclusionary Work

  **Principled Zero (Non-Behavioral)** is the most exclusionary. It immediately disqualifies:
  *   Any measure calibrated *solely* on behavioral responsiveness (CRS-R, GCS).
  *   Theories defining consciousness *as* access/behavior (strict behaviorism/functionalism).
  *   Measures lacking a clear theoretical foundation distinguishing mechanism from output.
  *   It forces the measure to be grounded in intrinsic properties, pushing towards theories like IIT or complex dynamics, while challenging Global Workspace/Higher-Order theories to define non-behavioral zero.

  ### Brief Candidate Scorecard Against Key Job One Spec

  | Theory/Approach          | Key Job One Strengths                                    | Key Job One Weaknesses Against Spec                      |
  | :----------------------- | :------------------------------------------------------- | :------------------------------------------------------- |
  | **IIT-style (e.g., Φ)**  | Principled Zero (core), Structure-over-Size, Splitting interpretation. | **Clinically Estimable?** No (super-exponential compute). Needs proxy (e.g., PCI). Version robustness? Poor (Φ definitions change). |
  | **Global Broadcasting (e.g., Dehaene)** | Shape of Degradation (fits well), Computability/Licensed Proxy (e.g., ERP components, SSEP), Clinical Estimability (EEG/ERP). | **Principled Zero?** Often behaviorally calibrated. Divergence Cases? May miss "pure" awareness without broadcasting. |
  | **Higher-Order/Attention Schema** | Divergence Cases (can explain covert awareness), Structure-over-Size (focus on cortical hierarchies). | **Principled Zero?** Defining zero for HOT is difficult (unconscious vs no meta-representation?). **Clinically Estimable?** Neural correlates less established for bedside proxy. |
  | **EEG Complexity (e.g., PCI, LZc, PSI)** | **Clinically Estimable** (core strength), **Computability Proxy** (feasible), Shape of Degradation (generally fits), Divergence Cases (detects covert awareness). | **Principled Zero?** Zero often defined empirically (behavior/sleep/anesthesia), not strictly theoretical. **Structure-over-Size?** May be sensitive to global activity, less sensitive to specific architecture. **Version Robustness?** Proxies evolve. |

  **The Sacrifice for Job One:** To achieve **Clinical Estimability** and a **Principled Zero** usable at the bedside, we sacrifice **Cross-Architecture Comparability** and definitive answers to **Composition** puzzles. The measure will be human-brain-centric, reliant on validated proxies, and silent on deep metaphysics. For Job Two (Statute), a separate approach, informed by but distinct from this measure, focusing on behavioral complexity, evolutionary homology, and precautionary principles informed by neuroanatomy, will be needed.
