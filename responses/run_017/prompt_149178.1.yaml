prompt: |-
  hi -- i do the secretariat work for a small professional college (around 900 members) that puts out position statements. Each one answers a block of four to eight yes/no items that are all about the same topic, members are expected to act on them, and they get quoted back at us in complaints and now and then in disciplinary hearings. Four to six of these a year, half-day meeting, 12-15 people (mostly clinicians plus two lay members), and I get about one afternoon to prep. It has to run on a shared spreadsheet and a show of hands, and the chair is a clinician who will read about one page of instructions and no more.

  Last year we published one where a clear majority backed item 2, a clear majority backed item 3, and a clear majority backed item 5, and it turned out that no single member had actually voted for all three — someone complained that the statement tells them to do two incompatible things, and they were right. Someone on council muttered something about "the discursive dilemma" and said we should vote on the reasons rather than the conclusions, which sounds right but I don't know how to actually do that on a Tuesday afternoon with fifteen people.

  So: give me a procedure I can run, in order, for one statement.

  Specifically I need: how to break a topic into votable propositions before the meeting and lock that agenda before anyone discusses the substance (and what to do when someone proposes a new item at 3pm anyway); how to make sure the conditional, normative, "if the facts are like this then we should do X" item gets its own explicit vote instead of hiding inside the other items; how to decide which items get voted on and which are just read off the ones that passed, and what to do when the headline recommendation isn't entailed by anything the committee actually accepted and also isn't contradicted by it; whether it's safe that our bylaws require a two-thirds supermajority on some items and a plain majority on others inside the same statement; what I do with a ballot that's internally inconsistent, or with abstentions and "can't say" answers; and at which point the procedure stops and says this is a values call, go ask a person. I also need the output written up so that an outside person, a year later, can rerun it from the record and get the same answer — council wants an audit trail, not just a decision.

  Please also be blunt about where this misfires. Our items are English sentences with "should" in them, sometimes with an implicit "all else being equal", and half the time the committee insists two items aren't inconsistent when they plainly are. I'd rather hand council a list of known holes than have them find one after publication.

  Then run the procedure on these three:

  (1) A screening programme. Items: "the test's false positive rate is acceptable"; "if the false positive rate is acceptable, the college should endorse routine screening"; "the college should endorse routine screening". Split is 4 members yes/yes/yes, 3 yes/no/no, 4 no/yes/no.

  (2) The one I know they'll hate. A public statement on a staffing crisis: 9 of 13 badly want to say something, but the two supporting items — "workforce planning is within the college's remit" and "the data on staffing levels are solid enough to make a public claim" — each fail by a single vote, and a standing statement from 2021 says the college doesn't comment on workforce issues.

  (3) Two items that may or may not clash: "clinicians should not prescribe X off-label" and "clinicians should exercise their own judgement where the evidence is thin".

  Tell me what comes out of each, including the case where the answer is one the chair is going to fight me on, and say plainly what the procedure can't do.
reasoning: |-
  We are designing a procedure for the college to vote on position statements that consist of multiple yes/no items. The procedure must be robust to avoid inconsistencies (like the discursive dilemma), provide an audit trail, and be executable in a half-day meeting with minimal preparation.

  Key issues to address:
  1. Avoiding inconsistent sets of votes (like the case where no member supported all three items that individually passed).
  2. Handling conditional and normative statements explicitly.
  3. Dealing with agenda changes during the meeting.
  4. Handling supermajority requirements and different voting thresholds.
  5. Dealing with inconsistent ballots, abstentions, and "can't say" answers.
  6. Ensuring the final set of accepted items is consistent and that the headline recommendation is entailed by the accepted items.
  7. Providing a clear audit trail.

  Proposed Procedure:

  I. Pre-meeting Preparation (by Secretariat)
     a. Break the topic into a set of propositions (items) that are to be voted on. The propositions should be structured as:
        - Factual propositions (F): e.g., "The test's false positive rate is acceptable."
        - Conditional normative propositions (C): e.g., "If the false positive rate is acceptable, then the college should endorse routine screening."
        - Normative propositions (N): e.g., "The college should endorse routine screening."

        We note that normative propositions might be derived from conditionals and facts, so we must structure the voting to capture dependencies.

     b. The set of propositions should form a logical structure. Ideally, the normative conclusions (like "endorse screening") should be the consequence of a conditional and a factual premise.

     c. The agenda of propositions to be voted on must be locked before the meeting. However, there is a process for adding items during the meeting.

  II. During the Meeting
     a. The chair presents the agenda. If someone proposes a new item at the meeting (e.g., at 3pm), the following happens:
        - The new item is discussed briefly to see if it is essential and non-redundant.
        - The committee votes (by show of hands, majority) on whether to add the item. If added, it is placed at the end of the voting list.
        - However, note that adding items may require re-examining the logical structure. Therefore, it is preferable to avoid last-minute additions. The chair should be firm that additions are only in exceptional cases.

     b. The committee discusses the topic as a whole, but without taking any votes until the voting phase.

     c. Voting Phase:
        - Each proposition is voted on in a fixed order. The order should be from premises to conclusions. For example:
            First: Factual propositions (F)
            Then: Conditional propositions (C) [which depend on facts]
            Then: Normative propositions (N) [which might be direct or via conditionals]

        - However, note that a normative proposition might also be directly voted on. The key is to have the conditionals voted on explicitly.

        - Each member votes on each proposition (yes, no, or abstain). The voting is done by show of hands, and the secretariat records the count.

        - Important: The voting on each proposition is independent.

     d. Handling Abstentions and "Can't Say":
        - Abstentions (explicit or implicit) are recorded but do not count toward the majority. The threshold is based on the number of votes cast (excluding abstentions).
        - If a member marks "can't say", it is treated as an abstention.

     e. Thresholds:
        - Each proposition has a required threshold (majority or two-thirds) as per the bylaws. The threshold is checked for each proposition individually.
        - The threshold is applied to the number of non-abstaining votes. For example, if a proposition requires a simple majority and 10 votes are cast (excluding abstentions), then 6 yes votes are needed.

     f. Inconsistent Ballots: 
        - Since each proposition is voted independently, a member may vote in a way that is logically inconsistent. However, we do not reject individual ballots for inconsistency. We record each member's votes on all propositions for the audit trail.
        - The inconsistency problem is addressed at the collective level: after the vote, we check the set of passed propositions for consistency.

  III. Post-vote Consistency Check and Derivation of Conclusions
     a. After all votes are tallied, we have a set of passed propositions (those that met their threshold).

     b. We check the set for consistency. This is done by the secretariat (with help if needed) immediately after the vote.

     c. Steps for consistency check:
        - List all passed propositions.
        - Check for logical contradictions. For example, if both "A" and "if A then B" are passed, then we must also have "B" passed? Not necessarily, because the vote on "B" is independent. However, if "B" did not pass, then the set {A, if A then B, not B} is inconsistent.

        - We must note that the passed set might be inconsistent even if each proposition passed individually.

     d. How to handle inconsistency?
        - If an inconsistency is found, we must resolve it. The procedure:
            i. Identify the minimal set of propositions causing the inconsistency.
            ii. The committee is informed and must re-vote on one or more of the propositions in the inconsistent set. The chair decides which proposition(s) to re-vote on, but typically we might re-vote on the normative conclusion that is causing the issue.

        - Alternatively, we can use a priority order: conditionals and facts are considered more foundational and are not re-voted. The normative conclusions that are inconsistent might be re-voted.

        - However, note that time is short. Therefore, we aim for a simplified approach: the conditionals and facts are considered fixed, and the normative conclusions that are not entailed by the conditionals and facts are re-examined.

        - Specifically, the secretariat should check which normative propositions are entailed by the passed conditionals and facts. For example:
            - If a conditional "if F then N" passed and the fact F passed, then the normative proposition N must be accepted even if it did not pass by vote? But note: we also voted on N independently. This is the core of the discursive dilemma.

        - To avoid the dilemma, we can structure the voting so that:
            - We vote on the facts and conditionals first, then the normative propositions.
            - Then, for the normative propositions that are the consequence of a passed conditional and a passed fact, we consider that the normative proposition is automatically accepted (and the independent vote on it is overridden) if the conditional and fact pass? But this may be controversial.

        - Alternatively, we do not vote on the normative proposition at all if it is the consequence of a conditional and a fact? Then we only vote on the facts and conditionals and then derive the normative statement. However, sometimes the committee might want to vote on the normative statement directly even if the premises are not passed.

        - Proposed solution: We have two types of normative propositions:
            Type 1: Derived normative propositions (N_d) - these are not voted on, but derived from conditionals and facts.
            Type 2: Direct normative propositions (N_i) - these are voted on independently.

          But how to decide which is which? In the pre-meeting, we structure the propositions so that for each normative conclusion we have two ways to get there: either by a conditional and a fact, or by a direct vote.

          However, this complicates the structure.

     e. Revised approach to avoid the dilemma (as suggested by the council member: vote on the reasons, i.e., the premises):

        - We only vote on the factual and conditional propositions, and then the normative conclusions are derived from them.

        - We do not vote on the normative conclusions directly. Instead, the normative conclusion is accepted if and only if the corresponding conditional and the relevant factual proposition are both passed.

        - This avoids the inconsistency because the normative conclusion is not independently voted.

        - Example in the screening case:
            Proposition F: "The test's false positive rate is acceptable." (voted)
            Proposition C: "If the false positive rate is acceptable, then the college should endorse routine screening." (voted)
            Then, if both F and C pass, we derive: "The college should endorse routine screening." (without voting on it)

          But note: what if the committee wants to endorse screening even if the false positive rate is not acceptable? Then they would not pass F, but they might want to pass the normative statement. However, the conditional C does not cover that.

        - To cover that, we might have multiple conditionals. For example:
            C1: If F, then we should endorse.
            C2: If not F, but condition G, then we should endorse.

          But then we are voting on more conditionals.

     f. Given the time constraints, we propose:

        - The agenda will consist of:
            - Factual propositions (F1, F2, ...)
            - Conditional propositions (C1: if F1 then N1, C2: if F2 then N2, ...)
            - And then we do not vote on the normative propositions (N1, N2) at all. Instead, we derive them.

        - Then, the output includes:
            - The passed factual and conditional propositions.
            - The derived normative propositions.

        - This avoids the discursive dilemma because we don't vote on the conclusions independently.

        - However, what if the committee wants to express a normative position that is not covered by the conditionals? Then we might need to have a direct normative proposition. But we can design the conditionals to cover the possibilities.

        - Alternatively, we can have a catch-all normative proposition that is voted on directly. But then we risk inconsistency again.

     g. Therefore, we strongly recommend that the agenda be structured so that all normative conclusions are derived from conditionals and facts. This means that in the pre-meeting preparation, the secretariat must break down the topic into facts and conditionals that lead to the desired normative statements.

     h. If the committee insists on having a direct normative proposition that is not derived, then we must note that inconsistency is possible and handle it by re-voting if an inconsistency arises.

  IV. Handling the Headline Recommendation
     - The headline recommendation is typically a normative proposition. In the proposed structure, it is derived from the conditionals and facts. Therefore, it is entailed by the passed propositions.

     - If the headline recommendation is not entailed by the passed propositions (for example, if we have a direct normative proposition that did not pass, and the conditionals and facts do not entail it), then we cannot include it. The statement would then not have that headline.

  V. Output and Audit Trail
     - The secretariat records:
          - The list of propositions with their type (F, C) and the threshold required.
          - The vote counts for each (yes, no, abstain) and whether it passed.
          - For derived normative propositions (N): the derivation (e.g., "Endorse screening" is derived because F and C passed).

     - The record must be detailed enough that an outside person can re-run the votes and the derivations.

  VI. When the Procedure Stops and Calls for a Values Judgment
     - If during the consistency check we find an inconsistency that cannot be resolved by re-voting (or if re-voting fails to resolve it), then the committee must discuss and make a judgment call. The chair may then propose a set of propositions to accept and call for a vote on that set as a whole.

     - Also, if the committee cannot agree on the structure (e.g., two items that are argued to be inconsistent when the committee says they are not), then the chair must rule and the committee may override by vote.

     - The procedure is designed for logical consistency, but when logic is not agreed upon, then we fall back to a vote on the entire statement or the controversial part.

  VII. Known Limitations
     a. The procedure relies on the pre-meeting structuring of facts and conditionals. If the conditionals do not cover all possibilities, then the committee might be unable to express a desired normative position.

     b. If the committee insists on having independent votes on normative propositions and on the premises, then inconsistency may occur and require re-voting, which is time-consuming.

     c. The procedure does not prevent the committee from passing two propositions that are logically inconsistent (if they are not caught by the structure). Therefore, the consistency check is vital.

     d. The procedure does not solve deep disagreements about the meaning of propositions. The secretariat must draft propositions that are clear and unambiguous.

