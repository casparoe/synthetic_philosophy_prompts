prompt: |-
  so me and my friend got into about a two hour fight last night about whether you have to follow local conventions when your just visiting somewhere, and we got nowhere because we kept sliding between three diffrent questions. So before I pick it up with him again I want the spec, not a verdict.

  the fight: he tips everywhere. we were in a country where nobody tips and he left money on the table and I said that was actually worse than not tipping, and he said the only rude thing available is stiffing someone. then it moved to queueing — he says cutting a line is wrong everywhere, I said in a place where people don't really form lines you're not cutting anything, you're just standing somewhere — and then to jaywalking, where he crosses on red in a city where literally everyone crosses on red and I don't, and neither of us could say why that one feels different from the queue one. then he said something I couldn't answer: he said the real rule isn't comply or don't comply, it's that whoever was there first gets to set the convention, so what a newcomer owes isn't imitation, it's not unilaterally renegotiatng the terms. on his version you MAY hand over extra cash in a no-tipping place, because nothing changes for anybody else, it's just a strange gift, but you may NOT start a queue where there wasn't one, because now everybody standing behind you is suddenly a line-cutter. he calls it something like normative squatters' rights. I kind of hate it and it also splits the cases exactly the way I want, which is why I'm here.

  so: write me the desiderata for a theory of convention-generated obligation. adequacy relative to a purpose, and here's mine — I want a theory good enough to tell me what I owe as an outsider in a place whose conventions aren't mine, and simultaneously what a host can legitimately resent and what a travel guide should actually print. concretely:

  - the cases it has to handle, each with the reason it's a requirement: the visitor who complies; the visitor who doesn't; the visitor who complies badly or ostentatiously; the visitor who quietly becomes a resident; the visitor who is one of ten thousand (stag parties, cruise ships, remote workers staying six months — at which point "visitor" stops being a stable category at all); the case where the convention and the law point opposite ways, i.e. the thing is illegal and everyone does it or legal and nobody does it, with jaywalking as the test case; and the case where the traveler genuinely cannot tell what the local convention is. add one he threw at me late: a card machine in a no-tipping country that shows a tip screen, so the norm gets imported by the hardware — who's the outsider then?

  - the distinctions it's not allowed to collapse: convention vs law vs morality; having a reason to comply vs being required to vs being blameworthy for failing to; convention as a coordination device vs convention as a signal of respect vs convention as a tax on people who don't know better; "the convention of the locals" vs "the convention of the place"; and whether the wrong, if there is one, is done to a person or to a practice.

  - the stuff from social science and game theory it can't contradict: that a lot of conventions are arbitrary solutions to recurring coordination problems, so the content is contingent and the stability isn't; that conventions shift when enough people defect, which is how visitors ever change anything; and that tourists are systematically bad at detecting local conventions and their noncompliance is often completely invisible to the host.

  - then sort the list for me. mark which desiderata are non-negotiable and which I should recognize as my side's prejudice dressed up as a requirement. flag any pair you think can't be jointly satisfied — I strongly suspect there's a real tension between "the theory should track what hosts actually resent" and "the theory shouldn't just rubber-stamp whatever the locals happen to do," and I want to know whether that's a genuine conflict in the spec or whether I'm being lazy.

  - and tell me which single requirement does the most work in ruling candidate theories out.

  at the very end, briefly, no big scorecard: how does the standard coordination account of conventions do against the list, how does the "you're a guest, so defer" view do, how does my friend's squatters' rights thing do, and how does the crude rule-consequentialist move — what if every visitor did that — do. where one of them silently fails to answer the question I actually asked, say that rather than grading it. and please don't just tell me it's a matter of degree and it depends, I could have stayed at the bar for that.
reasoning: |-
  Hmm, the user is asking for a framework to evaluate theories about convention-generated obligations for visitors. They had a heated debate with a friend about tipping, queueing, and jaywalking across different cultural contexts, and now they want a structured way to analyze this without getting a verdict.

  First, I need to unpack their core request: they want desiderata (requirements) for a theory that can resolve disputes about what visitors owe to local conventions. The theory must handle specific cases like tipping in no-tip cultures, ambiguous queueing norms, jaywalking where it's common, and even edge cases like tip screens in no-tip countries. They also want distinctions preserved, like convention vs. law, and no contradictions with social science facts about how conventions work.

  The user emphasizes avoiding collapses between key concepts. For instance, they don't want a theory that confuses "having a reason to comply" with "being blameworthy." They also highlight tensions, like balancing host resentment against not rubber-stamping local practices. I should flag that tension as a real conflict in the spec.

  Looking at their cases, each has a unique challenge: compliance vs. non-compliance, ostentatious compliance, long-term visitors, group dynamics, law-convention conflicts, and ambiguity. The card machine example is clever—it tests how technology disrupts norms. I'll organize these cases by theme: clarity of convention, duration of stay, scale of visitors, and norm-law misalignment.

  For distinctions, I'll list them explicitly: convention/law/morality, reason/requirement/blame, coordination/respect/tax, locals vs. place, and wrong to person vs. practice. These must be non-negotiable to prevent muddy thinking.

  Social science constraints are crucial. Conventions are arbitrary but stable; they shift via defection; tourists are bad at detecting them. This grounds the theory in reality. I'll mark these as non-negotiable since ignoring them would make the theory unrealistic.

  Now, sorting desiderata: Non-negotiables include the social science points, key distinctions, and handling core cases like ambiguity and norm-law conflict. Negotiable might be weightings—e.g., how much host resentment matters versus moral principles. The tension between "track host resentment" and "don't rubber-stamp locals" is genuine; it reflects a deeper conflict between descriptive and normative approaches.

  The most revealing requirement is probably "handling genuine ambiguity," as it forces the theory to address uncertainty without defaulting to local norms or visitor instincts. If a theory can't handle when conventions are unclear, it fails.

  Finally, evaluating existing views: The coordination account (e.g., Lewis) handles arbitrary solutions well but may miss respect aspects. The "defer as guest" view is simple but ignores shifts and exploitation risks. The friend's squatters' rights idea handles newcomers cleanly but is brittle with groups. Rule-consequentialism ("what if everyone did that?") is flexible but impractical and misses symbolic harms.

  The user wants no waffling, so I'll avoid "it depends" and focus on how each view meets or fails the spec. For example, coordination theory silently fails on the respect dimension, while squatters' rights struggles with large visitor groups.

  I'll wrap up by noting the friend's theory has merits in specific cases but isn't comprehensive. The key is a theory that balances flexibility with principle, acknowledging where trade-offs are inevitable.
answer: |-
  Here's the specification for a theory of convention-generated obligations for visitors, structured per your requirements. I've organized it into sections, marked non-negotiables, flagged tensions, and identified the high-impact requirement. Finally, I briefly evaluate four candidate approaches against the spec.

  ---

  ### **I. Cases to Handle (with Rationale for Inclusion)**
  1. **Baseline Compliance** (e.g., tips where expected, queues where formed)  
     *Why:* Tests core functionality – can the theory explain routine conformity?  
  2. **Non-Compliance** (e.g., refuses to tip where expected)  
     *Why:* Must distinguish between permissible vs. impermissible defiance.  
  3. **Ostentatious/Incompetent Compliance** (e.g., over-tipping in a modest-tip culture, awkwardly enforcing a queue)  
     *Why:* Probes whether *how* you comply matters (respect vs. mockery).  
  4. **Quiet Transition to Residency** (e.g., long-term visitor gradually adopts norms)  
     *Why:* Tests how obligation shifts with duration/identity change.  
  5. **Visitor Groups/Scale Effects** (e.g., cruise ship crowds, digital nomad enclaves)  
     *Why:* Challenges "outsider" definition – at what scale do visitors *become* norm-setters?  
  6. **Convention-Law Misalignment** (e.g., jaywalking where illegal but universal, or legal but taboo)  
     *Why:* Forces distinction between legal and normative obligation.  
  7. **Genuine Ambiguity** (e.g., unclear queue etiquette)  
     *Why:* Theory must prescribe action when conventions are indeterminate.  
  8. **Exogenous Disruption** (e.g., tip-prompting card machine in no-tip culture)  
     *Why:* Tests how technology/hybrid contexts redefine "local" convention.  

  ---

  ### **II. Distinctions Not to Collapse**  
  *(🔒 = Non-Negotiable; ⚖️ = Contextual Weighting)*  
  - **Convention vs. Law vs. Morality** (🔒)  
  - **Reason to Comply vs. Requirement vs. Blameworthiness** (🔒)  
  - **Convention as Coordination vs. Respect Signal vs. Exploitative Tax** (🔒)  
  - **"Convention of Locals" vs. "Convention of Place"** (e.g., tourists in a tourist zone vs. residential neighborhood) (⚖️)  
  - **Wrong to Persons vs. Wrong to Practice** (🔒)  

  ---

  ### **III. Social Science/Game Theory Constraints**  
  *(🔒 = Non-Negotiable)*  
  1. Conventions are often **arbitrary solutions to coordination problems** (content contingent, stability non-contingent) (🔒).  
  2. Conventions **shift via defection/cascade effects** (how visitors *can* change norms) (🔒).  
  3. Tourists **systematically misperceive local conventions**, and noncompliance is often **invisible to hosts** (🔒).  

  ---

  ### **IV. Sorted & Annotated Desiderata**  
  | Requirement | Priority | Notes |  
  |-------------|----------|-------|  
  | **Distinguish convention/law/morality** | 🔒 Non-Negotiable | Core conceptual clarity |  
  | **Handle convention-law misalignment** | 🔒 Non-Negotiable | Jaywalking test is pivotal |  
  | **Acknowledge contingency & stability of conventions** | 🔒 Non-Negotiable | Game theory constraint |  
  | **Account for scale effects** | 🔒 Non-Negotiable | Undermines "visitor" category |  
  | **Address genuine ambiguity** | 🔒 Non-Negotiable | Practical necessity |  
  | **Preserve reason/requirement/blame distinction** | 🔒 Non-Negotiable | Prevents over-moralizing |  
  | **Explain ostentatious compliance** | ⚖️ High Importance | Reveals respect/communication dimension |  
  | **Track host resentment** | ⚖️ Moderate | **TENSION** with anti-rubber-stamp |  
  | **Avoid rubber-stamping locals** | ⚖️ Moderate | **TENSION** with host resentment |  
  | **Define wrong to person vs. practice** | ⚖️ Moderate | Key for blame assignment |  
  | **Handle quiet residency transition** | ⚖️ Moderate | Tests temporal dynamism |  
  | **Respect convention-of-place vs. locals** | ⚖️ Contextual | Geographically bounded norms |  

  **Flagged Tension:**  
  - **"Track host resentment" vs. "Avoid rubber-stamping locals"** is a **genuine conflict**. Host resentment often reflects genuine disrespect or harm, but can also reflect parochialism/exploitation (e.g., tourists expected to overpay). A viable theory must weigh resentment against independent moral criteria (e.g., reciprocity, exploitation).  

  **Highest-Leverage Requirement:**  
  **"Handle convention-law misalignment"** does the most work in ruling out theories. It forces:  
  - Rejection of theories that collapse convention into law (fails jaywalking test).  
  - Rejection of theories that treat all conventions as morally neutral (if locals evade unjust laws).  
  - Solution must explain when convention overrides law or vice versa.  

  ---

  ### **V. Candidate Theory Evaluation**  
  *(Briefly assessed against the spec)*  

  1. **Standard Coordination Account** (e.g., David Lewis)  
     - ✅ Handles contingency, stability, and coordination function well.  
     - ✅ Explains convention shifts via defection.  
     - ❌ **Silently fails**: Collapses convention/respect distinction (ostentatious compliance is irrelevant). Struggles with law-convention misalignment (no moral dimension).  
     - ❌ Fails ambiguity cases (no prescription if coordination isn't visible).  

  2. **"Guest Deference" View**  
     - ✅ Tracks host resentment; handles baseline compliance.  
     - ✅ Explains ostentatious compliance as disrespectful.  
     - ❌ **Rubber-stamps locals**: Fails to critique exploitative conventions (e.g., "tourist tax").  
     - ❌ Fails scale effects (why defer if visitors outnumber locals?).  
     - ❌ Fails law-convention misalignment (deference to illegal jaywalking?).  

  3. **"Squatters' Rights" (Friend's View)**  
     - ✅ Cleverly handles queue creation vs. tipping; explains non-unilateral change.  
     - ✅ Distinguishes harm to persons (queue-cutting) vs. harmless deviation (tipping).  
     - ❌ Fails scale effects (10,000 visitors "squatting" *are* the convention).  
     - ❌ Fails ambiguity & law-convention cases (who "was there first" in hybrid spaces/tip screens?).  
     - ❌ Fails quiet residency (no mechanism for norm transition).  

  4. **Crude Rule-Consequentialism** ("What if every visitor did that?")  
     - ✅ Handles scale effects and convention shifts.  
     ✅ Flags harmful mass noncompliance (e.g., stag parties overwhelming pubs).  
     - ❌ **Impractical & vague**: Can't prescribe individual acts (e.g., "What if everyone jaywalked?" is incoherent if locals already do).  
     - ❌ Fails ostentatious compliance (over-tipping has good consequences but may offend).  
     - ❌ Fails ambiguity (no guidance without clear consequences).  

  ---

  ### **Conclusion on Spec**  
  Your friend's "squatters' rights" theory scores best on *conceptual clarity* for discrete interactions (tipping vs. queueing) but fails on *dynamic/ambiguous contexts* (scale, residency, technology). The **law-convention misalignment requirement** remains the sharpest filter. A viable theory must integrate:  
  - Coordination stability,  
  - Moral limits on convention (e.g., no rubber-stamping exploitation),  
  - A mechanism for norm transition (time, scale, visibility).  
  **The tension between host resentment and anti-rubber-stamping is irreconcilable without a prior moral framework** – e.g., resentment is legitimate only if the convention is reciprocally justifiable. This is where the fight *should* turn next.
