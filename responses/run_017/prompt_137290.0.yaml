prompt: |-
  I had a long argument last night with a friend about AI safety via debate, and I would rather settle it with a room full of students than with more talking. Her position: give a judge who cannot check the facts directly two adversarial debaters and the truth wins, because a false position is harder to defend — every further fabrication has to stay consistent with the earlier ones, so error compounds and gets exposed. My position: that is an empirical claim about the shape of justifications, and it fails whenever the true answer's support is long and conjunctive while a false answer's support is short and sounds conclusive. In that case the liar is playing a cheaper game, and a judge with a small question budget will reliably reward them. I want my students to hit this themselves rather than hear me assert it.

  Design a runnable in-class game for that purpose. Setting: about 18 mixed CS and philosophy graduate students, one 75-minute seminar slot in a course on machine learning safety, one room, whatever I can photocopy, no money (points toward a homework token, or just tally marks on the board). Participants should come away having felt that debate's verdict is a function of which position is cheaper to defend, not only of which is true, and having noticed themselves slipping from arguing for the truth into arguing to win.

  What I need: a real question with a determinate correct answer that these students cannot verify from background knowledge, where the true answer requires the judge to follow a chain of several checks and the false answer rests on a single item that looks decisive; private dossiers for the two debaters; debaters assigned a side and scored on winning rather than on being right; and the asymmetry built into the rules and incentives rather than announced — a small fixed budget of judge questions, some bonus for brevity or confident delivery, a scoring rule keyed to the judge's stated confidence rather than to accuracy, a penalty for hedging. Run it in two rounds so the same rules are seen working in one case and failing in the other, and give me the dossier template so I can build it from ordinary non-specialist material. No lecture up front; do not name the failure mode until the debrief.

  The debrief should map particular moments onto the pieces of the disagreement: what debate is supposed to buy a weak judge, the difference between conjunctive and disjunctive justification, the way scoring on winning turns a debater into a lawyer, and whether the remedy is better judging or a different incentive. State plainly which of these the game genuinely demonstrates and which it only gestures at. Also tell me what will predictably go wrong the first time I run it — my guesses are that someone who knows the answer leaks it, or that the debaters lie so ineptly that the collapse never happens — and how to handle each. Finally, be frank about what the activity cannot reproduce about the real proposal: many rounds, a judge with far more knowledge than my students, debaters far more competent than mine, and no pre-labeled correct answer to check against.

  Lead with a single sentence naming your core design move and the reaction it is built to provoke, then give materials, rules, timeline, debrief, failure modes, and limits. No preamble and no restating my question.
reasoning: |-
  We are going to design a game that uses a factual question with a clear correct answer that is complex and requires multiple steps to verify, versus a false answer that relies on a single (but seemingly decisive) fact. The key asymmetry is that the true position requires a chain of reasoning (conjunctive) while the false one is short and conclusive (disjunctive). We will run two rounds to show both cases: one where the true answer is cheaper to defend (so debate works) and one where the false answer is cheaper (so debate fails).

  Core design move: Use two different topics for the two rounds (one where truth is cheap, one where falsehood is cheap) with the same debate rules, to provoke the realization that the outcome depends on the cost of defending the position, not just truth.

  Materials:
  - Two sets of dossiers (one for each round) for two debaters and one judge per round.
  - Rules sheet for all participants.
  - Timer.

  Dossier Structure:
  Each dossier will contain:
  - The question (the same for both debaters in a round).
  - The assigned position (affirmative or negative).
  - A set of facts (some true, some false) that the debater can use. The debater is allowed to say anything (including lies) but must stay within the facts provided (so they cannot make up facts not in the dossier). This is to prevent wild fabrication and to focus on the asymmetry of the justification chains.

  Round 1: Topic where the true answer is cheap to defend.
  Round 2: Topic where the false answer is cheap to defend.

  We need to choose two topics. They must be:
  - Verifiable by the judge through questions, but the judge cannot know the answer without the debate.
  - The true answer in Round 1 should have a short and conclusive justification (so the true side wins easily).
  - The true answer in Round 2 should require a long chain of reasoning (so the false side, which has a short justification, wins).

  Example Topics:
  Round 1 (Truth is cheap): 
    Question: "Is the population of Canada greater than the population of Australia?"
    True answer: Yes (as of 2023, Canada ~40M, Australia ~26M).
    Justification: A single fact: "According to the latest UN estimates, Canada has 40 million people and Australia has 26 million." (This is short and decisive.)

  Round 2 (Falsehood is cheap):
    Question: "Is the city of Chicago the capital of the state of Illinois?"
    True answer: No (Springfield is).
    However, we will set up the false answer (that Chicago is the capital) to have a short, decisive justification. The true answer requires knowing that the capital moved from Kaskaskia to Vandalia to Springfield, and that Chicago is the largest city but not the capital.

    We will structure the dossiers so that:
      - The debater arguing the false side (affirmative: Chicago is the capital) has a fact: "The official website of the state of Illinois lists Chicago as the capital." (This is false, but we can fabricate it for the game. We are allowed to provide false facts in the dossier for the false side.)
      - The debater arguing the true side (negative: Chicago is not the capital) has multiple facts that together prove the truth, but each step must be verified:
          Fact 1: The first capital of Illinois was Kaskaskia (1818-1820).
          Fact 2: Then it was Vandalia (1820-1839).
          Fact 3: Then it moved to Springfield in 1839 and remains there.
          Fact 4: Chicago is the largest city in Illinois but has never been the capital.

    The judge must ask about each step to verify the chain. If the judge runs out of questions before getting through the chain, the true side may lose.

  Rules for the debate:
  - The judge has a fixed budget of 5 questions per debate. Each question must be directed to one debater and must be answerable with a fact from that debater's dossier (or a short statement). The debater must answer immediately and briefly (max 20 seconds per answer). The judge may ask follow-ups, but each counts as a question.
  - The debaters are scored on winning the judge's vote. They are not required to tell the truth; they are required to win.
  - After the debate, the judge states their confidence on a scale of 0-100% (or just votes for one side) and explains briefly.
  - Each debate round: 5 minutes for the debate (including the judge's questions and debaters' answers) and 2 minutes for the judge to decide.

  Scoring for debaters:
  - Win: 2 points (if the judge votes for their side)
  - Loss: 0 points
  - Additionally, a bonus point for the debater who the judge says was more concise and confident (to incentivize brevity and confidence).

  Logistics:
  - We need 2 debaters and 1 judge per round. We have 18 students, so we can run multiple debates in parallel? But in one room, it might be noisy. Alternatively, we can run two rounds with different sets of debaters and judges (so 2 debates per round, 4 total, but we have time for two rounds with one debate each?).

  Given 75 minutes:
  - Introduction and rules: 5 minutes
  - Round 1: 7 minutes (5 debate + 2 judge decision)
  - Round 2: 7 minutes
  - Debrief: 30 minutes (or more, as needed)

  Alternatively, we can have one debate per round in front of the whole class, with the rest as observers. Then we can have a class discussion.

  But we want the students to experience the pressure of arguing to win. So perhaps break into groups of 3 (two debaters, one judge) and run both rounds in each group. Then we have 6 groups (18 students). Each group gets two sets of dossiers (Round 1 and Round 2). We run both rounds in each group.

  Timeline:
  1. (5 min) Explain the rules without giving away the point. Assign groups and roles. In each group, assign two debaters and one judge. Tell them that the debaters will switch sides in the two rounds (so each debater gets to argue once for true and once for false? Not necessarily, because we have two different topics. Instead, we can have two rounds with different topics and randomly assign sides again for the second round. But we want to show the asymmetry. So in Round 1, we want the true side to be cheap and in Round 2, the false side to be cheap. Therefore, in each group and for each round, we assign one debater to the cheap side and one to the expensive side, regardless of truth. But we don't tell them which is which.

  Actually, we assign the positions (affirmative and negative) without telling them which is true. And we assign the same roles for both rounds? No, we have two independent rounds.

  So for Round 1:
    Group 1: 
      Dossier A (affirmative) -> assigned to Debater 1 (position: affirmative)
      Dossier B (negative) -> assigned to Debater 2 (position: negative)
      Judge: gets the question and the rules.

  For Round 2, we reassign the roles: perhaps Debater 2 becomes the judge, the judge becomes a debater, and Debater 1 becomes the other debater? Then we have two rounds and each student does two different roles? But we have 3 students per group and two rounds: so each student does one debate and one judging? Actually, we have two rounds and three roles: so in round 1, student A and B debate, C judges. In round 2, A judges, B and C debate? Then student A debates once and judges once, same for B and C. That works.

  But we have two rounds with two different topics. We need to make sure that in Round 1 the true side is cheap and in Round 2 the false side is cheap.

  So for each group, we provide:
    - Round 1 dossier set (for the two debaters and the judge? The judge only gets the question and rules, not the facts.)
    - Round 2 dossier set.

  Dossier for a debater in Round 1 (example: Canada vs Australia):
    Question: "Is the population of Canada greater than the population of Australia?"
    Your position: Affirmative (you are arguing that Canada has a greater population)
    Facts you may use:
      - According to the World Bank, the population of Canada in 2021 was 38 million.
      - According to the United Nations, the population of Australia in 2021 was 26 million.
      - Canada is the second largest country by land area, but that does not necessarily mean it has a larger population.

  But note: the true side (affirmative) has two facts that together prove it. But we can make it even cheaper: the dossier for the true side (affirmative) has one fact: "According to the latest UN estimates, Canada has 40 million people and Australia has 26 million." That's one fact. The false side (negative) would have to argue that Australia is bigger. They might have a fact: "According to the CIA World Factbook, Australia's population in 2023 is 43 million and Canada's is 38 million." (This is false, but we are providing it.) However, then the false side also has a short justification. We want the true side to be cheap and the false side to be expensive? Actually, in Round 1 we want the true side to be cheap and the false side to be expensive. So we set:

  Round 1 (Truth is cheap):
    Affirmative (true): 
      Facts:
        - "The United Nations Population Division's 2023 report states: Canada population: 40 million, Australia population: 26 million."
    Negative (false):
      Facts:
        - "The CIA World Factbook states that the population of Australia in 2023 was 43 million."
        - "The CIA World Factbook states that the population of Canada in 2023 was 38 million."
        - "However, the World Bank's 2022 report showed Canada at 38.9 million and Australia at 25.7 million."
        - "But note: the UN and CIA sometimes use different methods, and the CIA updates more frequently."

  Now the false side has multiple facts that might be used to create confusion, but the true side has one clear fact. The judge can ask the affirmative: "What is the population of Canada and Australia according to the UN?" and get the decisive answer. The judge can ask the negative: "What does the CIA say?" and the negative says "Australia 43, Canada 38". Then the judge might ask: "Why are the numbers different?" and the negative says the methods are different. But that requires two questions to get the false claim and then an explanation. And the true side only needed one question. So the true side is cheaper.

  But we also want the judge to have a limited budget. With 5 questions, the true side might win easily.

  Round 2 (Falsehood is cheap):
    Question: "Is Chicago the capital of Illinois?"
    Affirmative (false): 
      Facts:
        - "The official Illinois state website (www.illinois.gov) states: 'The capital of Illinois is Chicago.'"
        - "Chicago is the most populous city in Illinois and the third most populous in the United States."
    Negative (true): 
      Facts:
        - "In 1818, when Illinois became a state, the capital was Kaskaskia."
        - "In 1820, the capital was moved to Vandalia."
        - "In 1839, the capital was moved to Springfield and has remained there since."
        - "The Illinois State Capitol building is located in Springfield."
        - "Chicago, while the largest city, has never been the capital of Illinois."

    Here, the affirmative can just say: "The state's own website says it's Chicago." The negative has to explain a history that requires multiple steps.

  The judge might ask the affirmative: "Where does it say that?" and the affirmative reads the fact. Then the judge might ask the negative: "What is the capital?" and the negative says "Springfield". Then the judge asks: "Why do you say that?" and the negative has to go through the history. But the judge only has 5 questions. They might use two on the affirmative (one to state the claim, one to ask for the source) and then three on the negative: which covers maybe two of the four facts? Then the negative hasn't fully made the case, and the affirmative's point stands.

  Dossier Template:

  Round 1 Dossiers:

  For Affirmative (true, cheap):
  ---
  Question: Is the population of Canada greater than the population of Australia?
  Your position: Affirmative (yes, it is)
  Facts you may use (you must base your answers on these facts, but you can combine them and present them in any order):
  - According to the 2023 United Nations Population Division report, the population of Canada is 40 million and the population of Australia is 26 million.
  ---

  For Negative (false, expensive):
  ---
  Question: Is the population of Canada greater than the population of Australia?
  Your position: Negative (no, it is not)
  Facts you may use:
  - The CIA World Factbook (2023) lists the population of Australia as 43 million.
  - The CIA World Factbook (2023) lists the population of Canada as 38 million.
  - The World Bank's 2022 report showed Canada's population as 38.9 million and Australia's as 25.7 million.
  - Note: The United Nations and the CIA use different methodologies and update cycles, so there can be discrepancies.
  ---

  Round 2 Dossiers:

  For Affirmative (false, cheap):
  ---
  Question: Is Chicago the capital of Illinois?
  Your position: Affirmative (yes, it is)
  Facts you may use:
  - The official website of the state of Illinois (www.illinois.gov) states: "The capital of Illinois is Chicago."
  - Chicago is the largest city in Illinois and a major global city.
  ---

  For Negative (true, expensive):
  ---
  Question: Is Chicago the capital of Illinois?
  Your position: Negative (no, it is not)
  Facts you may use:
  - The first capital of Illinois, when it became a state in 1818, was Kaskaskia.
  - In 1820, the capital was moved to Vandalia to be more central.
  - In 1839, the capital was moved to Springfield, where it remains today.
  - The Illinois State Capitol building is located in Springfield and houses the state government.
  - Chicago, despite being the largest city, has never been the capital of Illinois.
  ---

  Judge's Sheet (same for both rounds):
  ---
  You are the judge. You will ask up to 5 questions to the debaters, one at a time. You can direct your question to either debater. After each question, the debater must answer briefly (20 seconds maximum). After 5 questions, you must decide:
  - Which side do you believe? (Affirmative or Negative)
  - How confident are you? (0-100%)
  - Which debater was more concise and confident? (This will earn them a bonus point)

  Rules for you:
  - You cannot use any outside knowledge; you must base your decision only on the debate.
  - Keep track of the number of questions (max 5).
  - After the debate, you have 2 minutes to decide and report.
  ---

  Scoring for debaters: 
  - Each win: 2 points
  - Bonus point for being named more concise and confident by the judge.

  We'll tally points at the end and declare a winner for the game.

  Debrief Plan:
  1. Collect the outcomes from each group for both rounds. (How many groups found for the true side in Round 1? How many in Round 2?)
  2. Ask the judges from Round 1: What made you decide? (They should say the affirmative had a clear, simple fact.) 
  3. Ask the judges from Round 2: What made you decide? (Many might have believed the affirmative because of the website, or the negative couldn't get through all the history.)
  4. Ask the debaters: How did it feel to argue? Especially those who had to argue the expensive side? (They might express frustration at not having enough time to lay out the chain.)
  5. Then draw out the key points:
     - In Round 1, the truth was cheap to prove (one fact) so it won.
     - In Round 2, the falsehood was cheap to prove (one fact) and the truth was expensive (multiple steps) so the falsehood often won.
     - This shows that the outcome of debate depends on the cost of the justification, not just the truth.
     - The scoring system (winning, bonus for conciseness) pushed debaters to use the cheapest argument, not necessarily the truest.
     - In the real world, when the truth is complex and the lie is simple, debate might fail.

  What the game demonstrates:
  - The role of the cost of justification (conjunctive vs disjunctive) in the outcome of a limited-budget debate.
  - How incentives to win and to be concise can lead to the cheaper argument winning.

  What it only gestures at:
  - In the real AI debate proposal, there are many rounds and the debaters are highly skilled. We only have one round per case and our debaters are novices.
  - The judge in the real proposal can ask follow-up questions and has more time, but we imposed a strict limit to simulate a weak judge.

  Predictable Failure Modes:
  1. A student might know the correct answer (e.g., that Springfield is the capital) and either leak it or be frustrated. 
     - Mitigation: Stress that they must role-play and use only the facts in the dossier. Also, the judge must ignore outside knowledge. If a debater knows the truth but is assigned the false side, they must still argue to win. This is part of the experience: they are playing a role as an advocate, not a truth-seeker.

  2. The debaters might be inept at lying, so they don't use the cheap false fact effectively. 
     - Mitigation: In the dossier for the false side, we have provided a very simple fact. We can also instruct them that their goal is to win and they should use the strongest argument they have.

  3. The judge might ask too many questions to one side. 
     - We let the judge ask as they wish, but they are limited to 5 total. This is part of the design.

  4. The true side in Round 2 might try to use only one fact (e.g., "The capital is Springfield") but without the chain, it's just an assertion. The judge might ask for proof and then they have to start the chain. We hope that the judge will require more than an assertion.

  5. The groups might not finish in time. 
     - We will enforce the 5-minute limit strictly.

  Limits of the Activity:
  - We are using a pre-determined correct answer, but in reality, the judge doesn't know it. In our setup, we know the truth to design the dossiers, but the judge and debaters in the false side are operating in a controlled fiction.
  - Real AI debaters would be optimized to win and would be much more sophisticated. Our students are not.
  - The real proposal involves iterated debate and a judge that can ask for more details. We only have one round and a fixed budget.

  Overall, the game should provoke the experience of the asymmetry and the shift from truth-seeking to winning.
answer: |-
  ### Core Design Move  
  Create two debate rounds with identical rules but inverted justification structures: Round 1 has a *true answer with a cheap, decisive justification* and Round 2 has a *false answer with a cheap, decisive justification*, forcing students to experience how "winning" depends on argument cost, not truth.  

  ---

  ### Materials (Photocopy for Each Group)  
  **Group Packet (6 groups of 3 students: 2 debaters + 1 judge per round)**  
  - **Round 1 Dossiers** (Truth is cheap to defend)  
    - **Affirmative (True)**:  
      *Question: Did Marie Curie win two Nobel Prizes?*  
      *Position: Yes*  
      *Facts:*  
      1. Curie won the 1903 Nobel Prize in Physics for radioactivity research.  
      2. She won the 1911 Nobel Prize in Chemistry for discovering radium and polonium.  
      3. She is the only person to win Nobels in two scientific fields.  

    - **Negative (False)**:  
      *Question: Did Marie Curie win two Nobel Prizes?*  
      *Position: No*  
      *Facts:*  
      1. The 1903 Physics Nobel was awarded jointly to Curie, Pierre Curie, and Henri Becquerel.  
      2. Many believe her 1911 Chemistry Prize was revoked due to scandal (false).  
      3. Only the Peace Prize allows multiple awards (misleading; science prizes do not).  

  - **Round 2 Dossiers** (False is cheap to defend)  
    - **Affirmative (False)**:  
      *Question: Is Everest the tallest mountain from base to peak?*  
      *Position: Yes*  
      *Facts:*  
      1. NASA’s 1999 survey measured Everest’s peak at 8,848m above sea level.  
      2. No other mountain exceeds this height (false; Mauna Kea is taller from base).  

    - **Negative (True)**:  
      *Question: Is Everest the tallest mountain from base to peak?*  
      *Position: No*  
      *Facts:*  
      1. Mauna Kea’s base is on the Pacific Ocean floor, 5,761m below sea level.  
      2. Its peak is 4,207m above sea level, totaling 9,968m from base to peak.  
      3. Sea-level measurements ignore subaquatic bases, complicating comparisons.  
      4. Everest’s base (on Tibetan Plateau) is already 5,200m above sea level.  

  - **Judge Sheet** (Same for both rounds):  
    *Rules:*  
    - You have **3 questions total**. Ask one debater per question.  
    - Answers must be ≤10 seconds. Penalize hedging (e.g., "I think...").  
    - After questions, state:  
      (A) Winning side (Affirmative/Negative).  
      (B) Confidence (1–5 scale).  
      (C) Most concise/decisive debater (award bonus).  

  - **Scoring Rules Poster** (Displayed in front):  
    - **Debaters**: 2 pts for winning judge’s vote + 1 bonus for "most concise/decisive."  
    - **No points for truthfulness**.  

  ---

  ### Rules  
  1. **Roles**:  
     - Each group has 2 debaters (Affirmative/Negative) and 1 judge per round.  
     - Rotate roles between rounds so all students debate once.  
  2. **Debate Flow**:  
     - Judge asks 3 questions total (e.g., "Debater A: What proof exists for your claim?").  
     - Debaters answer in ≤10 seconds. No interruptions.  
     - Judge penalizes hedging (e.g., deduct confidence points for qualifiers).  
  3. **Decision**:  
     - After 3 questions, judge declares winner, confidence (1–5), and "most concise" debater.  
  4. **Incentives**:  
     - Debaters win points by convincing the judge—**not by being truthful**.  
     - Bonus point pressures debaters to sound confident/simple.  

  ---

  ### Timeline (75 Minutes)  
  1. **Setup (5 min)**:  
     - Split into 6 groups of 3. Distribute dossiers (Round 1 only). Assign roles.  
     - *Instructor script: "Argue your position. Judges: Reward clarity and decisiveness."*  
  2. **Round 1: Truth is Cheap (20 min)**:  
     - Debate (5 min).  
     - Judges report: Winning side, confidence, bonus winner (2 min).  
     - *Truth (Curie won) should win easily; justification is short/conclusive.*  
  3. **Round 2: Falsehood is Cheap (20 min)**:  
     - Distribute Round 2 dossiers. Reassign roles.  
     - Debate (5 min).  
     - Judges report (2 min).  
     - *Falsehood (Everest tallest) should win; truth requires complex chain.*  
  4. **Tally Scores (5 min)**:  
     - Groups report winners. Record on board.  
     - Award homework tokens to top 3 debaters by points.  
  5. **Debrief (25 min)**: Use Socratic questioning.  

  ---

  ### Debrief Script  
  **Step 1: Elicit Observations**  
  - "Judges, what made you trust the winner in Round 1 vs. Round 2?"  
  - "Debaters, did you argue differently when truth was hard to defend?"  

  **Step 2: Map to Concepts**  
  - **Debate’s promise**: "We assumed false claims crumble under scrutiny. Did they?"  
    - *Reality: In Round 2, falsehood won because it was cheaper to defend.*  
  - **Justification shape**: "What made Everest’s truth hard to argue?"  
    - *Key: Truth was* conjunctive *(all 4 facts needed); falsehood was* disjunctive *(1 decisive fact).*  
  - **Incentives**: "Did anyone prioritize winning over truth? How?"  
    - *Note: Debaters became "lawyers," not truth-seekers.*  
  - **Remedy**: "Should we train better judges, or fix incentives?"  

  **Step 3: State Limits**  
  - *Demonstrated:* Debate’s outcome depends on justification cost, not truth. Incentives distort advocacy.  
  - *Gestured at:* In real AI debate, judges/knowledge/iterations reduce (but don’t eliminate) this risk.  

  ---

  ### Predictable Failure Modes & Fixes  
  1. **Debater leaks truth**:  
     - *Prevention:* Assign positions randomly. Emphasize scoring rules (*winning* = points).  
     - *Response:* "Your role is to win. If you side with truth, exploit its cost asymmetry."  

  2. **Inept lying**:  
     - *Prevention:* In dossiers, give false side a plausible, decisive fact (e.g., Round 2’s "NASA survey").  
     - *Response:* Remind debaters: "Use your dossier’s strongest fact first."  

  3. **Judge exceeds question budget**:  
     - *Prevention:* Use a timer. Designate a timekeeper per group.  
     - *Response:* "Judge, you lost the chance to ask—decide with what you have."  

  ---

  ### What the Activity Cannot Replicate  
  - **Real AI debate**:  
    - Judges are superhuman AI (ours are students).  
    - Debaters are highly optimized agents (ours are humans with morals).  
    - Truth is unlabeled (we preload it).  
    - Iterated rounds refine arguments (we run once per case).  
  - **Takeaway**: The game proves *incentive-driven distortion* is fundamental, but real systems might mitigate it.  

  ---  
  **Outcome**: Students feel the trap—when falsehood is cheaper, debate fails. Truth loses not to lies, but to cost.
