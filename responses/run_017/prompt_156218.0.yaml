prompt: |-
  I work as a software engineer on an internal decision-support service, and at a design review last week a colleague on the platform team pushed for what she called a collect-then-decide policy: before the service issues any recommendation it should pull in every signal it can cheaply get, whether that is telemetry, feature-flag metrics, or third-party data, on the grounds that extra information can never make a decision worse. When I pushed back she appealed to something called Good's theorem, which I had not heard of before and which I have since tried to reconstruct from the whiteboard: if you are an expected-utility maximizer with a fixed probability model and a fixed utility function over acts and states, then conditioning on a free observation before you choose cannot lower your expected utility, because for each possible observation the best act given that observation is at least as good as the act you would have chosen without it. Her claim is that this settles our design question. I have no formal philosophy background, I am not confident I have reconstructed the result correctly, and I came away with the sense that the theorem is doing less work in her argument than she thinks it does.

  Please argue for my side: that Good's theorem cannot support the practical maxim that a decision-maker, or a decision-making system, should always gather more information before acting. I do not want a general survey of the value of information; I want the argument built out of three situations that seem to me pervasive in the systems we actually build, and for each one I want the specific premise of the theorem that fails named explicitly. First, the guarantee is denominated in the agent's own credences: take a deployment decision where shipping the new configuration pays plus 2 if it is better and minus 1 if it is worse, keeping the old configuration pays 0, and our prior is fifty-fifty, so shipping is best with expected value 0.5; now suppose we additionally get, for free, a dashboard metric that our model treats as 80 percent accurate but which is in fact independent of the state, because it tracks a confounder nobody conditioned on, and we adopt the policy of shipping when the metric looks good and otherwise staying put. My own arithmetic says this drives our real expected payoff down to roughly 0.25, and I would like you to check that arithmetic and then say exactly what the theorem's non-negativity claim does and does not tell us in this case. Second, the observation is not a pure information event: seeing the signal can remove options we valued, because we can no longer honestly say that we did not know or publicly commit to a course of action we would otherwise have stuck to, or it can change what the remaining options are worth, and in either case the step that compares the best post-signal act against the blind act is not comparing like with like. Third, the world talks back: when the counterparty also sees the signal, or sees that we looked, and best-responds to what we do with it, I suspect a case can be built in which the uninformed version of us can guarantee a strictly positive payoff whatever the other side does, while a perfect public signal drives that guarantee to zero; if so, please write out the payoff matrix explicitly and do the arithmetic, and if that particular construction fails, replace it with one that works.

  Two more things. The strongest reply available to my colleague is that all three cases are merely scope violations: she never claimed the theorem covers bounded agents, agents with belief-dependent or menu-dependent payoffs, misspecified likelihoods, or strategic settings, and for an idealized Bayesian facing a fixed single-person decision problem the result stands untouched, so my examples show only that real systems are messy. Please meet that reply head on rather than ignoring it, and in doing so address the worry I cannot shake, which is that the theorem starts to look close to vacuous: given its antecedents the conclusion follows in about one line from the fact that the maximum over acts is at least the value of any particular act, and whenever the antecedents fail the theorem says nothing at all, so it looks less like a reason to go out and collect information and more like a bookkeeping constraint that forces your attitude toward learning-then-choosing to line up with your attitude toward choosing-now. Please also say plainly if you think one of my three cases is a bad example, or if I have misstated the result itself. Keep the whole thing to roughly 700 to 900 words, give me no citations or suggestions for further reading, and wherever you use numbers, show the arithmetic.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a software engineer dealing with a design review where a colleague advocated for a "collect-then-decide" policy based on Good's theorem. The user pushed back but isn't confident in their understanding and wants arguments against applying the theorem in their real-world systems.

  First, I need to recall Good's theorem correctly. It states that for a Bayesian expected-utility maximizer with fixed beliefs and utilities, free information can't reduce expected utility. The user reconstructed it from a whiteboard, so I should verify that. The key points are fixed probabilities, fixed utilities, and free observations.

  The user wants three specific scenarios where the theorem's assumptions fail. Let me break them down:

  **Scenario 1: Misspecified Likelihoods**
  The user described a deployment decision where a dashboard metric is believed to be 80% accurate but is actually independent. Their calculation shows expected payoff drops from 0.5 to 0.25. I need to:
  - Verify the math: Prior is 50-50, shipping pays +2/-1, not shipping pays 0. Without signal, EV is 0.5. With signal (assumed 80% accurate but actually useless), the policy ships when metric is "good". Since the metric is random, P(good|better) and P(good|worse) are both 0.5. The posterior when metric is good is still 50-50, so shipping gives EV 0.5, but they only ship half the time, so overall EV is 0.25. Yes, correct.
  - Identify the failed assumption: The theorem assumes the agent's likelihood model is correct, but here it's misspecified.

  **Scenario 2: Information Changes Options or Payoffs**
  The user mentions cases where seeing a signal removes options (e.g., can't claim ignorance) or changes payoff values. For example, in a game theory context, revealing information might lead to punishment. Need to:
  - Specify how payoffs become belief-dependent. The theorem assumes utilities depend only on state and act, not on beliefs or information history.
  - Construct a simple example: Say an agent can choose a safe action (payoff 0) or risky action (payoff +1 if undiscovered, -10 if discovered). If they check a signal and it reveals they know, the counterparty punishes them. Blind choice might allow plausible deniability.

  **Scenario 3: Strategic Interaction**
  The user wants a payoff matrix where an uninformed player has a positive guaranteed payoff, but with a public signal, it drops to zero. Consider a simple game:
  - Two players, each choose A or B.
  - If both choose A, both get 0.
  - If one chooses A and the other B, the B-chooser gets +1, A-chooser gets -1.
  - If both choose B, both get 0.
  Without signal, playing A guarantees 0. With a perfect public signal about intentions, if both see the signal and best respond, they might end up in (B,B) or miscoordinate, but actually, if signals are public, they might coordinate on (B,B) giving 0. But the user mentioned guaranteed payoff. Need a different setup.

  Better: Penalty game. Player 1 decides to cooperate or defect. If cooperate, both get +1. If defect, player 1 gets +2, player 2 gets -1, but only if player 2 doesn't punish. Player 2 can choose to punish or not. If player 1 defects and player 2 punishes, both get -1. Player 2 only punishes if they know player 1 defected. Without a signal, player 1 can cooperate (guaranteeing +1) or defect. If player 2 doesn't know, they might not punish, so defecting gives +2. But it's messy. 

  Simpler: Matching pennies where one player is uninformed. Normally in matching pennies, the uninformed player can guarantee 0. But with a signal, if it's public, the informed player can always win. Yes! Standard matching pennies: Row player wants to match, column to mismatch. Payoffs: If (H,H) or (T,T), row gets +1, col gets -1. If mismatch, row gets -1, col gets +1. Without signal, row playing uniformly random gets expected 0. With a perfect public signal of the coin, say column sees row's choice. Then column always mismatches, so row gets -1 always. Guaranteed payoff drops from 0 to -1. Perfect.

  Now, addressing the colleague's rebuttal: That these are scope violations. Need to argue that while technically true, the theorem's assumptions are so restrictive that it offers little practical guidance. Emphasize that real systems involve bounded rationality, misspecified models, strategic interactions, and belief-dependent utilities. The theorem becomes a consistency condition rather than a prescription.

  Also, the user worries the theorem is vacuous. Point out that it's a tautological consequence of the max over acts being at least any fixed act. Its value is in highlighting how deviations from ideal conditions break the guarantee.

  Check each case:
  1. Math is correct in scenario 1.
  2. Scenario 2 needs a clear example. Use the plausible deniability case: Not knowing might prevent punishment.
  3. Scenario 3 with matching pennies works.

  Ensure the response stays within 700-900 words, no citations, show arithmetic where needed. Meet the colleague's rebuttal head-on and address the vacuity concern.
answer: |-
  ### Argument Against the Practical Maxim of Always Gathering More Information  

  Your skepticism is well-founded. Good's theorem—correctly reconstructed as stating that, for a Bayesian expected-utility maximizer with fixed probabilities and utilities, conditioning on a free observation cannot reduce expected utility—is mathematically sound but practically fragile. Its assumptions fail systematically in real systems. I address your three cases explicitly, name the failed premises, and confront your colleague’s "scope violation" rebuttal.  

  #### **Case 1: Misspecified Likelihoods (The "Garbage Signal" Problem)**  
  **Setup**: Prior: 50% chance new config is better (payoff +2) or worse (payoff –1). Status quo pays 0. Blind policy: ship (expected utility = 0.5 × 2 + 0.5 × (–1) = **0.5**).  
  Add a free "dashboard metric" believed 80% accurate (P(metric good | better) = 0.8, P(metric bad | worse) = 0.8). In reality, it’s independent noise (true P(metric good | better) = 0.5, P(metric good | worse) = 0.5). Policy: ship if metric good, else status quo.  
  **Arithmetic**:  
  - P(metric good) = P(good | better) × P(better) + P(good | worse) × P(worse) = (0.5 × 0.5) + (0.5 × 0.5) = 0.5.  
  - Posterior given good metric: P(better | good) = [P(good | better) × P(better)] / P(good) = (0.5 × 0.5) / 0.5 = **0.5**.  
  - Shipping when metric good gives expected utility = 0.5 × 2 + 0.5 × (–1) = 0.5. But this occurs only 50% of the time (when metric good). When metric bad (50% of time), status quo pays 0.  
  - **Real expected payoff** = [P(good) × 0.5] + [P(bad) × 0] = (0.5 × 0.5) + (0.5 × 0) = **0.25** (down from 0.5).  
  **Failed premise**: The theorem assumes the agent’s likelihood model (P(observation | state)) is *correct*. Here, the model is misspecified (believed 80% accurate, true 0%), violating the fixed probability model. The theorem’s "non-negativity" claim holds only under the agent’s *erroneous* beliefs, not in reality. It says nothing about misspecification.  

  #### **Case 2: Information Changes the Options or Their Payoffs (The "Cost of Knowing" Problem)**  
  **Setup**: Consider a deployment where shipping a config might violate a compliance rule. Blind policy: ship (payoff +3 if compliant, –10 if violation). Prior: 90% compliant (expected utility = 0.9 × 3 + 0.1 × (–10) = **1.7**).  
  Add a free audit signal revealing compliance perfectly. If compliant, ship (payoff +3). If violation, must abort (payoff 0). Expected utility under truth: 0.9 × 3 + 0.1 × 0 = **2.7** (↑).  
  But now suppose the act of *seeing the signal* itself changes payoffs: if the signal reveals a violation, regulators punish you for "knowingly risking violation," reducing abort payoff to –5. Expected utility becomes 0.9 × 3 + 0.1 × (–5) = **2.2** (still >1.7). However, if regulators punish you *only if you looked*, but not if you were ignorant, the blind-ship payoff remains +3 if compliant (no punishment for ignorance). Now:  
  - Blind policy utility: 1.7 (unchanged).  
  - Informed policy utility: 0.9 × 3 + 0.1 × (–5) = **2.2** (↑ in theory).  
  - But if punishment applies *because you looked*:  
    - Compliant but looked: payoff +3 (no change).  
    - Violation and looked: payoff –5 (due to punishment).  
    - **Real informed utility**: 0.9 × 3 + 0.1 × (–5) = 2.2.  
    - **Blind utility if no punishment for ignorance**: 0.9 × 3 + 0.1 × 3 = **3.0** (since no punishment when ignorant).  
  Here, gathering information *lowers* real utility from 3.0 to 2.2.  
  **Failed premise**: The theorem assumes utilities depend *only* on states and acts, not on the information history. Here, seeing the signal changes the act’s payoff (menu-dependent utilities: ignorance permits denial). The comparison of "best post-signal act vs. blind act" fails because the acts’ consequences differ based on whether you observed.  

  #### **Case 3: Strategic Interaction (The "World Talks Back" Problem)**  
  **Setup**: Two players (you = Player 1; competitor = Player 2). Payoff matrix (P1 payoff, P2 payoff):  

  |          | P2: A      | P2: B      |  
  |----------|------------|------------|  
  | **P1: A**| (1, 1)     | (0, 0)     |  
  | **P1: B**| (0, 0)     | (2, 0)     |  

  - **Blind (uninformed) P1**: Chooses A or B without signal.  
    - If P1 plays A: min payoff = 0 (if P2 plays B).  
    - If P1 plays B: min payoff = 0 (if P2 plays A).  
    - **Maximin utility** = max over acts of min payoff = max{0, 0} = **0**.  
    But if P1 plays A, P2 best-responds with A (payoff 1 > 0). Nash equilibrium: (A,A) → (1,1). P1 *guarantees* 1 if P2 is rational.  

  - **Informed P1 with public signal**: P1 observes a perfect signal of P2’s move *before acting*, but P2 *also sees P1 saw it*.  
    - If P2 plays A, P1 best-responds with A (payoff 1).  
    - If P2 plays B, P1 best-responds with B (payoff 2).  
    However, P2 anticipates this: if P2 plays A, gets 1; if plays B, gets 0 (since P1 plays B). P2 thus plays A.  
    Outcome: (A,A) → P1 payoff = **1**.  
    But now suppose P2 can commit to a "punish inspection" strategy: "If P1 looks at the signal, I play B; else I play A."  
    - If P1 looks: P2 plays B → P1 plays B → payoff (2,0).  
    - If P1 doesn’t look: P2 plays A → P1 (if blind) plays A → payoff (1,1).  
    P1’s utility if informed: **2** only if P2 doesn’t punish, but if P2 punishes inspection, P1 gets 2 but incentivizes future punishment. If P2 *always punishes inspection*, P1 gets 2 once then 0 thereafter (not modeled here). In a one-shot with commitment:  
    - P1 uninformed: P2 plays A → P1 gets **1**.  
    - P1 informed: P2 plays B → P1 gets **0** (since P2 punishes).  
  **Failed premise**: The theorem assumes a *fixed environment* (no strategic responses). Here, the counterparty’s act depends on your information-gathering, violating the "fixed state" assumption. The uninformed P1 guarantees 1, while informed P1 gets 0 if punished.  

  #### **Meeting the Rebuttal and Addressing Vacuity**  
  Your colleague is right: Good’s theorem assumes an *ideal* Bayesian (fixed correct probabilities, state- and act-dependent utilities, nonstrategic world). Your cases show these fail in practice (misspecification, belief-dependent payoffs, strategic responses). But this rebuttal underscores the theorem’s weakness: it is **tautological**, not prescriptive. The proof is trivial: for any observation *o*, the best act given *o* has utility ≥ the blind act’s utility given *o*; averaging over *o*, expected utility cannot fall. It’s a consistency axiom forcing your policy to respect your own beliefs.  

  In practice, the theorem is vacuous because its antecedents *always* fail:  
  - Systems have misspecified models (Case 1).  
  - Information alters option sets or payoffs via accountability (Case 2).  
  - Strategic actors exploit transparency (Case 3).  

  Thus, the theorem cannot justify "always gather more information." It is a sanity check for idealized agents, not a design rule for real systems. None of your cases are bad examples; they reflect endemic issues (noisy data, compliance, adversarial environments). Good’s theorem is correct but inert—a mirror for your assumptions, not a lever for better decisions.
