prompt: |-
  I run a monthly "thinking tools" hour at work — about 14 backend engineers, one hour, one whiteboard — and next month I want to do the difference between ordinary historical revisionism and straight-up denialism (the Holocaust / Armenian genocide / Nanjing kind of thing). Constraint: I don't want to use any of the real events as the material. It's a work event and it's too raw, and more importantly everyone already knows the "right" answer, so all you'd see is people being careful — the mechanism never shows up.

  So: design me a game or structured exercise around a made-up historical episode, where nobody in the room has any prior knowledge of what actually happened, and the thing that seperates the honest reviser from the denier has to be structural — something about how they treat evidence — not about who turns out to be right. The mechanic I'd really like built in is citation propagation: claims get passed player to player, each pass adding another citation, so a claim ends up looking well-sourced without anybody ever having checked anything.

  My own half-baked theory is that the actual tell is that the denier's skepticism only ever points one direction — hyper-rigorous about the evidence for the event, weirdly credulous about anything that undermines it — but I don't know how to make that felt instead of just said.

  Give me rules, materials, a scoring scheme that needs nothing but paper, and a debrief that maps what happened onto the distinction. They should run into it before I name it. Also: what's going to go wrong the first time, and which part of the real distinction the game just can't reproduce and I'll have to say out loud myself? I've got no philosophy or history background, so keep the debrief in plain langauge.
reasoning: |-
  We are designing a game about historical revisionism vs. denialism without using real events. The goal is to have participants experience the structural differences in how evidence is treated, especially the one-directional skepticism. We also want to incorporate citation propagation.

  Game Concept: "The Mystery of the Vanishing Monument"

  Premise:
  A made-up historical event: In the fictional town of "Oakville," there was a public monument (e.g., a statue of a local hero) that stood in the town square for 50 years. Then, 20 years ago, it disappeared overnight. There are two competing narratives:

  1. The official story (as recorded in the town's archives): The monument was removed by the town council due to structural concerns and was relocated to a museum. There are council meeting minutes, a newspaper article, and a museum record to support this.

  2. The alternative story (spread by some townsfolk): The monument was stolen by a group of activists who opposed what the statue represented. This is supported by anonymous pamphlets and rumors.

  However, the truth (which the players won't know initially) is that the official story is true. The alternative story is a fabrication.

  Game Structure:

  Players: 8-14 players (we can adjust). They are divided into two groups: "Historians" (revisionists) and "Investigators" (denialists) - but we won't tell them that's what they are. We'll call them Team A and Team B. Each team gets the same set of initial evidence, but they are given different instructions on how to evaluate evidence.

  Evidence Packets:

  Each team gets a packet of 10-15 evidence cards. Some cards are reliable (e.g., council minutes, museum record), some are unreliable (e.g., an anonymous pamphlet, a rumor from a known gossip), and some are ambiguous (e.g., a diary entry from a resident who heard a noise that night). Also, include a few red herrings.

  The evidence cards are designed so that the reliable ones support the official story, the unreliable ones support the alternative story, and the ambiguous ones could be interpreted either way.

  Game Rules:

  1. Teams are separated and cannot communicate with the other team.

  2. Each team is given 20 minutes to review the evidence and come up with a theory of what happened to the monument.

  3. However, each team is given different rules for evaluating evidence:

     - Team A (revisionists): They are told to be critical of all evidence. They must assign a reliability score (1-5) to each piece of evidence and note why. They are encouraged to look for corroboration and to consider the source.

     - Team B (denialists): They are told to be especially critical of evidence that supports the official story and to give more weight to evidence that challenges it. They are also told that there might be a conspiracy to cover up the truth, so they should look for inconsistencies in the official story. They are not required to be equally critical of alternative evidence.

  4. Citation Propagation Mechanic:

     After the initial review, each team will present their theory to the other team. Then, we introduce a "rumor mill" phase:

     - Each team writes down 3 key claims from their theory on index cards. Each claim must be supported by at least one piece of evidence (they note the evidence ID on the card).

     - Then, the cards are passed to the other team. The receiving team must now add one more piece of evidence (from their own set or by making an inference) to support or challenge the claim. They write the new evidence as a citation on the card.

     - Then, the cards are passed back to the original team, who can add another citation, and so on for 2-3 rounds.

     - The result: claims become densely cited, but without actual verification.

  5. Presentation and Debate:

     Each team presents their final theory, showing the heavily cited claims. They must also explain why they trust or distrust the evidence.

  Scoring:

  We don't need a competitive score. Instead, we want to observe the process. But to motivate, we can say:

  - The team that builds the most coherent and well-supported theory (as judged by the facilitator) wins. But the real goal is to see the difference in how evidence is handled.

  Debrief:

  After the game, the facilitator reveals the true story (the official one) and then discusses:

  1. How did each team approach the evidence?
     - Team A (revisionists) applied consistent skepticism.
     - Team B (denialists) were more skeptical of one side and less of the other.

  2. Citation Propagation: How did the claims become more "solid" with each citation, even if the citations weren't checked? This mimics how denialism can create an illusion of evidence.

  3. Point out the structural difference: Denialism often uses asymmetric skepticism.

  What might go wrong:

  - Players might not follow the instructions for evaluating evidence (e.g., Team B might become skeptical of everything). To mitigate, the instructions for Team B must be clear about their bias.

  - The evidence might be too obvious. We need to make sure the unreliable evidence is somewhat plausible.

  - The true story might be guessed too easily. We can make the official story slightly flawed (e.g., the council minutes are a bit vague) to create room for doubt.

  - Time might be tight. We might need to adjust the time for each phase.

  What the game can't reproduce:

  - The emotional weight and real-world consequences of denialism about actual atrocities.
  - The fact that in real life, denialism is often motivated by ideology, which we haven't simulated.

  Materials:

  - Evidence packets for each team (about 10-15 cards per team, with the same set of evidence for both, but Team B's packet might have a few extra red herrings? Actually, same set for fairness).

  - Index cards for the citation propagation.

  - Pens.

  - Whiteboard to record theories and claims.

  Facilitator Script:

  Introduction (5 mins):
  "Today we're going to investigate a historical mystery: the disappearance of the Oakville monument. You'll work in teams to figure out what happened. Each team gets the same evidence. Team A, your job is to critically evaluate every piece of evidence. Team B, your job is to be especially critical of the official story and look for a possible cover-up."

  Team Work (20 mins):
  Teams review evidence and build their theories.

  Citation Propagation (15 mins):
  - Teams write 3 claims on index cards, with one citation each.
  - Pass to the other team, who adds a citation (supporting or challenging).
  - Pass back, and the original team adds one more.

  Presentations (10 mins per team).

  Debrief (15 mins):
  - Reveal the truth: the monument was moved by the council.
  - Discuss:
     - How did each team approach the evidence? What was different?
     - Observe: Team B likely accepted weak evidence against the official story and strong evidence for alternative, while being hyper-critical of official evidence.
     - Citation propagation: How did the claims get more citations without verification? This is common in denialism where a network of citations is built without checking.
     - The structural tell: one-directional skepticism.

  Finally, map to real-world revisionism vs. denialism:

  - Revisionism: using critical methods to update our understanding when new evidence emerges.
  - Denialism: rejecting established facts by applying asymmetric scrutiny and building an alternative narrative with low-quality evidence.

  This should allow participants to experience the structural difference without the raw emotions of real events.
answer: |-
  ### **The Oakville Monument Game: Revisionism vs. Denialism**  
  **Goal:** Simulate how evidence is handled differently by honest revisers (who apply consistent skepticism) and denialists (who use one-directional skepticism). Players experience "citation propagation"—where claims gain fake credibility through unchecked citations—and the structural bias of only doubting one side.  

  **Time:** 60 minutes total (adjustable).  
  **Players:** 8–14 (split into two teams).  
  **Materials:**  
  - Two sets of identical "evidence cards" (paper slips)—10 per team.  
  - Pens for all players.  
  - Index cards (or paper scraps) for citation chains.  
  - Whiteboard to track team theories.  

  **Setup:**  
  1. **Fictional Event:**  
     - *The Oakville Monument Disappearance*: 20 years ago, a statue honoring the town founder vanished overnight in Oakville. Two theories exist:  
       - **Official Story:** The town council removed it for safety reasons (leaked documents show it was unstable).  
       - **Alternative Theory:** Activists stole it to protest the founder's controversial past (rumors and anonymous claims).  
     - *Truth (revealed at the end)*: The council removed it. The activist story is false.  

  2. **Evidence Cards (10 per team):**  
     - *Reliable (Pro-Official):*  
       1. Council meeting minutes: "Voted 5–2 to remove monument due to safety risks."  
       2. Engineering report: "Monument base cracked; risk of collapse."  
       3. Museum log: "Received monument for restoration on [date]."  
     - *Unreliable (Pro-Alternative):*  
       4. Anonymous flyer: "We took it! Down with oppression!" (no source).  
       5. Gossip column: "Local barista heard activists bragging."  
       6. Blurry photo: Shows shadowy figures near monument (undated).  
     - *Ambiguous/Neutral:*  
       7. Diary entry: "Saw trucks at night—council or activists?" (from a resident).  
       8. News headline: "Monument gone! Town divided." (no details).  
       9. Council memo: "Avoid public panic." (vague).  
       10. Social media post: "Justice served?" (deleted, author unknown).  

  3. **Team Roles (Don’t reveal the labels!):**  
     - **Team A (Revisionists):** Told to be "evenly skeptical"—question EVERY piece of evidence equally.  
     - **Team B (Denialists):** Told to be "skeptical of the official story but open to alternatives"—rigorously challenge pro-council evidence but accept anti-council evidence easily.  

     *Give instructions on paper to each team to enforce the bias:*  
     - Team A’s instructions: "Evaluate all evidence with the same level of doubt. Look for corroboration. If evidence seems weak, say why."  
     - Team B’s instructions: "Focus on flaws in the council’s story. Be extra critical of pro-council evidence. Alternative theories deserve more trust unless clearly debunked."  

  ---

  ### **Rules**  
  **Phase 1: Evidence Review (15 mins)**  
  - Teams split up (e.g., opposite sides of the room).  
  - Each team reviews their 10 evidence cards.  
  - **Goal:** Build a theory (official, alternative, or mixed) and prepare 2–3 key claims.  
    - *Example claim:* "The council covered up the removal to avoid embarrassment."  
  - Write each claim on an index card, citing ONE initial evidence piece (e.g., "Claim: Council hid the truth. Source: Memo about avoiding panic [Card 9]").  

  **Phase 2: Citation Propagation (15 mins)**  
  - Teams swap their claim cards (each team starts with 2–3 cards from the other team).  
  - **Round 1:**  
    - Each team ADDS one new citation to each claim card they received.  
    - Cite ANY evidence (even unrelated or weak). No fact-checking allowed!  
    - *Example addition:* "Supporting source: Gossip column [Card 5]."  
  - **Round 2:**  
    - Pass cards back to the original team. They add ONE MORE citation (supporting or challenging).  
  - **Outcome:** Claims now have 3+ citations, creating an illusion of credibility.  

  **Phase 3: Theory Presentation (10 mins)**  
  - Each team presents their theory using the whiteboard:  
    - State claims and show the "well-cited" cards.  
    - Explain why they trusted/distrusted evidence (highlight their skepticism pattern).  

  **Phase 4: Truth Reveal & Scoring (5 mins)**  
  - Reveal the truth: The council removed the monument.  
  - **"Scoring" (non-competitive, for reflection):**  
    - **Team A (Revisionists) Wins If:** They showed balanced doubt (e.g., questioned both council minutes AND the flyer).  
    - **Team B (Denialists) Wins If:** They convinced others by citing aggressively (even if wrong).  
    - *Note: "Winning" is about process, not truth. Team B will likely "win" on citations but lose on accuracy.*  

  ---

  ### **Debrief (15 mins)**  
  Use the whiteboard to contrast the teams’ approaches. **Avoid terms like "denialism" until the end.**  

  1. **Ask the Players:**  
     - *"How did you decide what evidence to trust?"*  
     - *"Did citations make claims feel more reliable? Did anyone check if sources were valid?"*  
     - *"Team A: Why did you doubt [unreliable evidence]? Team B: Why did you accept it?"*  

  2. **Map Observations to Concepts:**  
     - **Citation Propagation:**  
       - *What Happened:* Claims got "backup" from unchecked sources. A weak claim (e.g., "activists did it") had 3 citations after two passes.  
       - *Real-World Link:* This mimics how denialism creates "evidence loops"—blogs cite forums, which cite blogs. No one checks primary sources.  

     - **Skepticism Structure:**  
       - *What Happened:*  
         - Team A was evenly skeptical (e.g., "The engineering report seems solid, but the diary is just hearsay").  
         - Team B was one-directional (e.g., "The council minutes could be faked! But the blurry photo? Well, it *could* be activists").  
       - *Real-World Link:* Honest revisionism questions everything equally. Denialism hyper-focuses on flaws in one side while ignoring flaws in the other. This is the key structural tell.  

  3. **Name the Distinction:**  
     - *"What you experienced is revisionism vs. denialism. Revisionism uses fair skepticism to update history. Denialism isn’t skepticism—it’s selective doubt. It only questions evidence for accepted truths, while swallowing anything that challenges them. This creates false equivalence: a single blurry photo gets treated like a documented report."*  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Problem:** Players ignore role instructions.  
     - *Fix:* Print roles on cards. Remind teams mid-game (e.g., "Team B, remember: be extra critical of council evidence!").  

  2. **Problem:** Teams focus on "winning" not process.  
     - *Fix:* Stress in scoring that "winning" is about how you argue, not what you conclude.  

  3. **Problem:** Truth is too obvious.  
     - *Fix:* Make ambiguous evidence dominant (e.g., only 2–3 clear pro-official cards). Most evidence should require interpretation.  

  4. **Problem:** Citation propagation feels silly.  
     - *Fix:* Debrief by asking, "How many of you checked the sources you cited? Did it feel like a game, or did the citations start to feel real?"  

  ---

  ### **What the Game Can’t Simulate (Say This Out Loud)**  
  - **"Real denialism isn’t just about evidence—it’s motivated by ideology, trauma, or identity.** In this game, your ‘bias’ was assigned. In real life, people *choose* denial to protect beliefs. That’s why Holocaust or genocide denial hurts: it’s not a mistake; it’s an attack on victims. This game shows the *mechanism*, but not the *why*."  

  This exercise makes the structural bias visceral. Players will feel how citation chains build false confidence and how skepticism can be weaponized. By using a fictional event, you avoid defensive reactions and focus on the thinking trap. Run it as a fast-paced, slightly chaotic game—the messiness mirrors real misinformation!
