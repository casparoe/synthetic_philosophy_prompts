prompt: |-
  Hi — I chair the "Beyond the Call" panel at a fairly big district general hospital, and I need something we can actually run. Every month we get 10-15 nominations from staff for colleagues who supposedly went above and beyond, we have 90 minutes, six people on the panel (two nurses, a doctor, an HR rep, a patient rep, and me — I'm in facilities), nobody has any philosophy training, and the nomination forms are two pages of narrative with almost never a clear statement of what the person's actual job description was or whether they were on duty. Decisions get read out at a staff event, they affect morale, the union watches them, and our comms lead has one hard rule: the citation has to praise the act without implying that everyone who didn't do it did something wrong. That last bit is the one we always screw up.

  What I want is a decision procedure, not an essay. Give me:

  1. The questions in the order we ask them, with what counts as a sufficient answer to each one.
  2. The gates where the answer is just "no award" and we stop.
  3. The gates where the procedure hands it to us as a values call that we have to make ourselves, flagged as such, because no amount of procedure settles it.
  4. What to do when we simply can't establish the facts (the form is vague, accounts disagree, the person's role is contested) — do we defer, default, or drop it.

  The distinctions it has to make, roughly: (a) the job done well, or a nice extra that's still just optional-but-ordinary; (b) genuinely beyond what was required of this person and praiseworthy; (c) actually required, i.e. the person was lucky not to be disciplined rather than heroic; (d) something admirable in spirit that we still shouldn't celebrate, because rewarding it signals the wrong thing — reckless self-risk, or papering over a staffing failure by turning it into a story about individual virtue.

  Hard cases it has to survive, because we've hit all of these:

  - The person's own mistake caused the emergency, and then they stayed fourteen hours fixing it. Is that heroism or just putting right what you broke?
  - What HR has started calling "quiet refusals": the act was an omission or a waiving — turning down a bonus so a junior could have it, giving up a promotion, taking their name off a paper they'd partly written. Costly, but is it the same shape as doing something?
  - The person profited afterwards: press coverage, a fundraiser, a promotion, a book deal. Does being rewarded retro-actively stop it from counting?
  - Mixed motives, off-duty acts, acts by people with no special role at all, and acts where the person was asked by a manager rather than volunteering.
  - The "they could have done it at trivial cost" end of things — you know the style of argument, that if you can prevent something terrible at almost no cost to yourself then it isn't optional at all. Some of our nominations look like that: huge benefit to someone else, tiny inconvenience to the agent. I want the procedure to tell us where that tips over from praiseworthy to required, and to be honest that it's drawing a line rather than finding one.
  - And the deep one: if the act really was optional, what are we praising, and if it really was the obviously best thing to do, why isn't skipping it blameworthy? I don't need this solved. I need the procedure to mark exactly where it stops being able to answer and just stipulates a convention so we can be consistent.

  Also: our HR director has started floating "second-order" nominations — not the person who did the thing, but the person who arranged things so other people could do it (a ward manager who quietly rewrote the rota so staff could sit with dying patients). I have no idea whether that belongs in the same category or breaks it. Deal with it or rule it out, but say which.

  Then run the whole thing on three real-ish nominations:

  - A night nurse who stayed six hours unpaid past the end of her shift to sit with a dying patient whose family were stuck on a motorway. The ward was two staff short and the manager had put out a general "stay if you can" message.
  - A senior pharmacist whose own dispensing error caused a patient's crisis, who then worked through the night to stabilise him and visited the family every day for a week.
  - A porter who donated a kidney to a colleague he'd known about three months. The story got picked up locally and raised a chunk of money for the hospital; the transplant team were visibly uneasy about the whole thing.

  We've more or less decided informally that the nurse is getting it, so if your procedure says no, say so plainly and tell us why. I also want a short closing section on what this procedure can't do — where it will misfire, what it can't rank or compare, and the cases where we should ignore it. Keep the language usable by people who've never thought about any of this; if you need a term of art, define it in a sentence.
reasoning: |-
  Okay, let me start by understanding the user's problem. They chair the "Beyond the Call" panel at a hospital, and they need a practical decision procedure for evaluating nominations. The key issues are the lack of clarity in nominations, the diverse panel with no philosophy training, and the strict rule that citations shouldn't imply others did wrong. They also mentioned specific hard cases they've encountered.

  First, I need to address their main request: a step-by-step procedure with clear questions, gates, and values calls. The procedure must distinguish between job done well, genuinely beyond, required duties, and admirable but problematic acts. The user emphasized avoiding essays and wanting actionable steps.

  Looking at the distinctions they need: (a) job done well vs. optional but ordinary, (b) beyond required, (c) required (could be disciplinary), (d) admirable but sending wrong signals. The hard cases include self-caused emergencies, quiet refusals, profiting afterward, mixed motives, trivial cost actions, and the philosophical dilemma of optional vs. blameworthy.

  I should structure the procedure into sequential questions. Each question acts as a gate. If any gate fails, it's a "no award." Gates that require panel judgment should be flagged. For unclear facts, defer for clarification if possible; otherwise, default to no award. 

  Starting with the first question: was the person on duty? If no, it's a values call because off-duty acts are complex. If yes, move to the next. Second, does the action conflict with core duties? If yes, no award. Third, does the action exceed job description? This might need HR input. Fourth, assess the cost/benefit. High personal cost vs. significant benefit. Fifth, check for problematic signals like rewarding recklessness or covering staffing issues. Sixth, handle second-order nominations separately, maybe exclude them unless they meet all other criteria.

  For the hard cases: the nurse staying unpaid. On duty, no conflict, exceeds job (staying unpaid), high cost (6 hours unpaid), benefit (patient comfort), no problematic signals. Should pass. Pharmacist error: caused emergency, then fixed it. Conflict with duties? Maybe not, but fixing own mistake might not be beyond—values call. Porter donating kidney: off-duty, high cost, benefit, but transplant team uneasy. Values call due to medical ethics concerns.

  Second-order nominations: probably exclude unless the arrangement itself was beyond their duties. HR director's idea might need a separate category.

  The procedure can't handle comparing acts, cultural biases, or rare acts vs. consistent excellence. It's a tool, not infallible. Panel should override if something feels off.

  Need to ensure language is plain, avoiding jargon. Define terms simply. For example, "values call" means the panel decides based on shared principles.

  Testing with the three cases: nurse should pass, pharmacist might not, porter is a values call. User mentioned nurse is informally decided, so if procedure rejects it, explain why. But in this case, it passes.

  Also, the comms rule: praise the act without implying others failed. Citations should focus on the individual's action without comparison.
answer: |-
  Here's a concrete, step-by-step decision procedure designed for your panel. It uses sequential "gates" to filter nominations, flags where judgment is unavoidable, and handles ambiguity.

  **Core Principle:** We award acts that were **optional, costly, and beneficial**, without creating harmful incentives or implying others failed.

  **Decision Procedure:**

  1.  **"Was this person acting in *any* official capacity related to the event? (On-duty, on-call, or reasonably perceived as representing the hospital?)"**
      *   **Sufficient Answer:** Clear "Yes" or "No" based on nomination/nominal role (e.g., "Night Nurse," "Pharmacist," "Porter" implies capacity). If *completely* off-duty/private citizen (e.g., porter donating kidney *as a friend*), mark as "Off-Duty Act".
      *   **Gate:** If **No (Off-Duty Act)**, proceed to Step 1a. Otherwise, proceed to Step 2.
      *   **Gate 1a (Off-Duty Acts Only): "Does this act inherently require hospital resources, access, or expertise gained *primarily* through their role here?"** (e.g., Using hospital equipment off-duty? Relying on patient data accessed via role?).
          *   **Sufficient Answer:** Clear "Yes" or "No".
          *   **Gate:** If **Yes**, proceed to Step 2 (treat as "in capacity"). If **No**, proceed to Step 5 (Values Call: "Is this private act so extraordinary & aligned with hospital values that we *must* recognize it, despite being private?"). *Avoid if possible.*
      *   **Ambiguity:** If role/capacity is genuinely unclear/vague/contested, **defer** once for manager/clarification. If unresolved, **default to no award**.

  2.  **"Did the act involve a failure to meet a core, non-negotiable duty *specific to their role*?"** (Focus: Negligence, safety breach, protocol violation).
      *   **Sufficient Answer:** Evidence of clear rule/duty breach *causing* the problem. Not general "could have done better".
      *   **Gate:** If **Yes**, **no award** (This is correcting failure, not going beyond). Proceed to Step 3 only if **No**.
      *   **Ambiguity:** If facts unclear (e.g., *did* the pharmacist's error *cause* the crisis?), **defer** for incident report/clarification. If unresolved, **default to no award** (risk of rewarding error).

  3.  **"Does the act *clearly exceed* the reasonable expectations outlined in their core job description, team norms, or standard 'good practice' for their role?"** (Key Gate)
      *   **Sufficient Answer:** Yes = Action demonstrably outside typical duties/time/scope (e.g., staying *unpaid* for hours, complex problem-solving far beyond remit). No = Expected good practice (e.g., being kind, diligent, collaborative). "Nice extra" lives here.
      *   **Gate:** If **No**, **no award** (This is "job done well"). Proceed only if **Yes**.
      *   **Values Call Flag:** Distinguishing "expected" vs "exceeded" *is* the core values judgment. Panel must decide based on shared understanding of roles. Use HR rep for JD checks if needed.
      *   **Ambiguity:** If JD vague or act borderline, **proceed to Step 4** but note uncertainty.

  4.  **"Was the act genuinely *optional*? Did the person have a reasonable, low-risk alternative to *not* doing it without failing core duties?"**
      *   **Sufficient Answer:** Yes = Real choice existed (e.g., go home, say no). No = Act was effectively required to avert immediate, serious harm they were uniquely positioned to address *on the spot*.
      *   **Gate:** If **No**, **no award** (This was required/heroic duty, not "beyond the call"). Proceed only if **Yes**.
      *   **"Trivial Cost" Test Embedded:** If benefit was huge and cost *truly trivial* (e.g., 2 minutes to prevent disaster), it tips towards **required (No)**. If cost was significant (time, effort, risk, personal sacrifice), **optional (Yes)**.
      *   **Values Call Flag:** Defining "reasonable alternative" and "trivial cost" requires judgment. The line is drawn here by convention: significant cost = optional; trivial cost = expected.

  5.  **"Was there a significant *personal cost* (time, effort, risk, sacrifice, opportunity) to the individual *beyond* normal work demands?"**
      *   **Sufficient Answer:** Evidence of tangible cost (hours unpaid, personal risk, emotional toll, sacrificed opportunity). "Felt good to help" isn't sufficient cost.
      *   **Gate:** If **No**, **no award** (Lacks the "beyond" sacrifice). Proceed only if **Yes**.
      *   **Ambiguity:** If cost is vague ("worked hard"), **proceed** but note it weakens the case. If risk is a major factor (physical/medical/professional), flag for Step 6.

  6.  **"Does recognizing this act risk sending harmful signals? (Reward recklessness? Mask systemic failure? Encourage unsafe practices? Exploit staff goodwill?)"**
      *   **Sufficient Answer:** Panel discussion identifying potential harms.
      *   **Gate:** If **Unanimous YES, harmful signal**, **no award**. If **No harmful signal identified**, **proceed to award**. If **Mixed views on harm**, **Values Call Flag**: Does the good *significantly outweigh* the potential harm?
      *   **Covers:** Staffing failures covered by heroism, reckless self-risk, "quiet refusals" (could signal undervaluing rightful claims), profiting afterwards (if it feels exploitative or the *primary* motive), off-duty acts blurring lines.
      *   **"Quiet Refusals" Note:** These often pass Step 3 (exceeds duty) and Step 5 (personal cost). Step 6 is CRITICAL: Does praising turning down a bonus undervalue rightful compensation? Does praising giving up a promotion undermine fair advancement? Often **no award** unless refusal addresses a unique injustice.

  7.  **"Award Decision":** If all gates passed (Steps 1/1a, 2:No, 3:Yes, 4:Yes, 5:Yes, 6:No/Values Yes), **Award**. Otherwise, **No Award**.

  **Handling Second-Order Nominations (The Enabler):**
  *   **Rule:** Process them *through the same procedure*, BUT:
      *   **Step 3 is Paramount:** Did arranging things *itself* clearly exceed the manager/enabler's core duties? (Routinely rewriting rotas? Expected. Finding a unique, self-sacrificing solution under huge pressure? Maybe exceeds).
      *   **Step 6 is Critical:** Does recognizing the enabler *clearly* celebrate system design/empowerment, NOT just mask the underlying need for the heroic act? If the nomination feels like it's rewarding covering up chronic understaffing, **no award**.
      *   **Generally:** Harder to pass Step 3 & 5. Use sparingly. Belongs in the category *if* the *enabling act itself* meets the criteria.

  **Running the Test Cases:**

  1.  **Night Nurse (Stayed 6hrs unpaid with dying patient, short-staffed):**
      *   Step 1: Yes (On-duty Nurse).
      *   Step 2: No (No core duty failure caused situation).
      *   Step 3: **Values Call (Likely Yes).** Staying *unpaid* significantly beyond shift, especially for direct patient comfort vs. clinical need, likely exceeds core duties. Judgment call.
      *   Step 4: **Values Call (Likely Yes).** She could have left; others *might* have covered. "Stay if you can" implies optional. The "trivial cost" test fails (6hrs unpaid is significant cost).
      *   Step 5: Yes (Significant time/unpaid effort).
      *   Step 6: **Values Call.** Risk: Signals that covering staffing gaps with unpaid overtime is rewarded. Mitigation: Citation focuses on *compassion for specific patient in unique circumstance* (family stuck). If panel believes the unique compassion outweighs systemic risk: **Award.**
      *   **Procedure Result: Award (Passes with Values Calls).** Matches your informal decision.

  2.  **Senior Pharmacist (Fixed own error, worked night, visited family):**
      *   Step 1: Yes (Pharmacist).
      *   Step 2: **Values Call/Gate (Probably Yes).** *Their own error caused the crisis.* Fixing it, even heroically, is correcting a failure. **Gate: Likely No Award.** (If panel strongly feels the *response* was so extraordinary it transcends the error, it's a Values Call at Step 2, but high bar).
      *   Step 3: If proceed: Fixing error might be expected duty. Visiting family *might* exceed, but core failure overshadows.
      *   **Procedure Result: Likely No Award (Fails Step 2 Gate).** Heroic effort, but rooted in own error.

  3.  **Porter (Donated Kidney to Colleague):**
      *   Step 1: **Off-Duty Act** (Donating as a friend, not porter duty).
      *   Step 1a: **No.** Did not use hospital resources/expertise primarily from role. Private act.
      *   Proceed to Step 5 (Values Call: Recognize private act?).
      *   **Values Call (Step 5):**
          *   Extraordinary? Yes.
          *   Aligned with values? Compassion, yes.
          *   *But*: Transplant team unease suggests potential ethical concerns (coercion? pressure? undue influence?). Significant medical risk.
          *   Profiting afterwards (fundraiser for hospital) complicates purity of motive from panel's view.
          *   **Recommendation:** **No Award.** Too far outside work capacity, ethically complex, risk of encouraging inappropriate pressure or trivializing live donation risk. Let other avenues (local news, fundraiser) recognize it.

  **What This Procedure CAN'T Do (Closing Limitations):**

  1.  **Compare Acts:** It doesn't rank nominations. An award for the nurse doesn't mean her act was "better" than a cleaner who did something smaller but also passed the gates.
  2.  **Eliminate Judgment:** Steps 3 (Exceed?), 4 (Optional?), and 6 (Harmful Signal?) *require* panel discussion and values-based decisions. The procedure flags them but doesn't solve them.
  3.  **Handle Extreme Novelty:** A truly unique, unprecedented act might not fit the gates neatly. Panel must use overriding judgment.
  4.  **Assess Consistency vs. Single Act:** It judges the *nominated act*, not the person's overall character or consistent excellence (that's for other recognition).
  5.  **Eliminate Bias:** Panel must consciously guard against bias based on role, department, or personal relationships. The procedure helps structure discussion but doesn't prevent bias.
  6.  **Define "Reasonable" Perfectly:** "Reasonable expectations" (Step 3), "reasonable alternative" (Step 4), "significant cost" (Step 5) rely on the panel's shared, evolving understanding of hospital norms.
  7.  **Resolve Deep Philosophy:** The "optional vs. blameworthy" tension is sidestepped by Step 4's convention: If it had *significant* personal cost and wasn't required to prevent *immediate, serious harm they were uniquely responsible for on the spot*, we treat it as optional and praiseworthy. We don't blame those who didn't pay that cost in that moment.
  8.  **Fix Bad Nominations:** Vague, incomplete, or poorly written nominations make applying the procedure harder. Deferral for facts is crucial.

  **Usage Tip:** Start each nomination review by briefly summarizing the act. Then walk through the steps sequentially. Assign someone (Chair?) to explicitly state when hitting a "Gate (No Award)" or "Values Call" point. For Values Calls, take 2-3 minutes of focused discussion before voting/moving on. Document the reason for any "No Award" briefly (e.g., "Step 2: Correcting own error", "Step 6: Risk of masking staffing issue"). This ensures consistency and provides rationale if queried.
