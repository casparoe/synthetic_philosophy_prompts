answer: |-
  ### The Unmoored Claim  
  Lena’s desk was a graveyard of standpoint tags. *Yield projections: optimistic under short-term climate models, pessimistic under long-term*. *Bridge integrity: stable per static load tests, unstable per seismic simulations*. For eight years, she’d been the city’s Standpoint Auditor, attaching qualifiers to municipal claims like lifeboats to sinking ships. Her job: ensure every factual assertion filed by public bodies included its *naya*—the precise lens through which it held true. Without it, truth drifted anchorless.  

  The water crisis began with a chemical spill upstream. The Municipal Water Authority filed its emergency bulletin:  
  > **CLAIM:** Potable water supply is safe for consumption.  
  > **STANDPOINT:** By MWA Protocol #7B (30-day exposure threshold, non-cumulative toxins).  

  Lena approved it. By noon, the Public Health Director, Mark Raslo, stripped the standpoint and blasted the city alert system:  
  > **EMERGENCY UPDATE: WATER IS SAFE. RESUME NORMAL USE.**  

  Chaos cooled into calm. Businesses reopened taps. Schools served lunch. Lena stormed into Raslo’s office, the stripped tag vibrating in her hand. "You laundered it. The protocol excludes infants and immunocompromised residents. They’ll think it’s *absolutely* safe."  

  Raslo didn’t look up from his desk. "The tagged version would’ve caused panic. People were hoarding bottled water; hospitals faced dehydration cases. The *unqualified* truth got them to act."  

  "And when someone gets sick?"  

  "Versions of truth have costs. We chose the one that saved lives *today*."  

  ---  

  Three days later, twelve dialysis patients were hospitalized. Trace toxins, harmless to most, had accumulated in their blood. The news called it "The Reckoning." At the emergency council hearing, Lena sat stiffly beside Raslo.  

  "Accountability requires standpoint *commitment*," she argued. "Say, *‘I act on the hydrologist’s reading, not the ecologist’s'*—and explain *why*. Name the lens."  

  Raslo scoffed. "Naming the lens changes nothing. When I say ‘Go! The water’s safe!’ on the loudspeaker, no one hears *‘safe per 7B’*. They hear *safe*. The standpoint always detaches in action. Always."  

  A council member leaned in. "So action is inherently dishonest?"  

  "Action," Raslo said, "requires unqualified claims. Reality doesn’t negotiate with sevenfold syllogisms."  

  Lena’s fists clenched. "Then let’s find a claim that *never* needs qualification. One true from *every* standpoint." She gestured wildly. "Something even Raslo can’t distort."  

  Silence. Then:  
  > "Water is wet."  

  A hydrologist shook her head. "Not to a molecule in steam."  
  > "Contaminants exist."  

  A chemist frowned. "Only if you define them by MWA’s thresholds. Change the standard, and they vanish."  
  > "People drank the water."  

  Raslo laughed bitterly. "From whose perspective? The system’s sensors? A paranoid citizen who boiled it first? There is no ‘view from nowhere.’ Only standpoints we admit or hide."  

  Lena’s resolve cracked. Raslo was right. The moment you *used* truth, you laundered it.  

  ---  

  She resigned at dawn. In her exit interview, she didn’t mention ethics or epistemology. "I’m tired of attaching lifeboats," she said. "They never get used."  

  As she walked out, a new alert chimed on every phone in the city:  
  > **FLOOD BARRIER BREACH: EVACUATE WEST DISTRICT.**  

  No standpoint tag. No caveats. Just action, hurtling toward consequence.  

  Lena kept walking. Let someone else drown in the unmoored truth.  

  ---

