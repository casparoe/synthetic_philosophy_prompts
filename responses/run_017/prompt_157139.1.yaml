prompt: |-
  hey — I need a thought experiment built to spec. I'm using it in a bit where I argue that Hacking's looping effects don't by itself show that human kinds are unstable or unscientific: sometimes the loop makes the kind *better*, not worse.

  So: one paragraph, set somewhere ordinary (a clinic, a school, a GP surgery — no sci-fi), in which a newly introduced psychiatric category becomes a sharper, more useful, more predictive kind over a few years *because* the people classified under it come to understand themselves in its terms. Invent the category rather than picking a real one (nothing like ADHD or depression, please, it just drags in a ton of baggage), and have it start out genuinely messy: vague criteria, clinicians disagreeing about who falls under it, mixed cases underneath.

  Constraints so it isn't cheating:
  - the improvement has to fall out of the feedback loop itself — no new biomarker, no wonder drug, no better diagnostic questionnaire turning up;
  - nobody is faking symptoms for money, benefits or time off work;
  - clinicians can't just tighten the criteria by fiat — the classified people have to be doing part of the work.

  Then, briefly: walk through the loop stage by stage and say what happens at each, name the single feature of the case that's doing the work, say what's left if you remove that feature, and tell me what someone who thinks human kinds are neccesarily moving targets would say to stop your case from counting. Don't bother with references or citations, I don't need them. And write it all in British English.
