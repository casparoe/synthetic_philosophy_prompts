prompt: |-
  Hey — I'm in a small group that's drafting a childcare and parental-leave chapter for a policy paper we're writing on weekends (long shot, nobody's paying us), and my gut is way more settled than my principles. So I want to do this backwards: here are my verdicts, you tell me what I actually think. We have to write the one paragraph of principles that goes at the top of the chapter and I've realised I can't.

  The set-up, because it's a bit unusual: instead of maternity leave and a childcare subsidy as two separate things, we're toying with one per-child care-time account. Every newborn is credited with, say, 3,000 hours of paid care time, roughly eighteen months full time. Any adult can draw on that particular child's account and be paid a care-wage for the hours they actually spend caring for that child — either parent, a grandparent, a friend, a registered childminder — or the hours can be spent as a voucher at a licensed nursery instead. Hours can't be moved from one child to another. Whatever is left when the child turns five converts into pension credits for the two registered parents. The care-wage is flat, same for everyone.

  My verdicts, case by case:

  1. Father takes six months full time: obviously fine. And I want the account to include use-it-or-lose-it months for the second parent, because I don't trust free choice here to amount to anything.
  2. So if both parents want to hand the entire account to the mother, that gets blocked. I'm fine overriding their stated preference and I'm not embarrassed about it.
  3. Grandmother draws the hours to look after her grandchild: fine. Genuinely, enthusiastically fine.
  4. A friend of the family, no relation, draws the hours: fine, but hesitantly.
  5. Parents use the hours to pay a nanny, cash in hand, unregistered, uninspected: not fine. Except I said the licensed-nursery voucher is fine, and when I try to say why the nanny isn't, I get three different answers — that it's about regulation, that it's about the state paying for care that happens inside someone's home, or that I just have a prejudice that real childcare happens in institutions. I can't tell which one is doing the work and it bugs me.
  6. A family that doesn't use all its hours sells the leftovers to another family: definitely not.
  7. A live-in migrant care worker with no work rights draws the hours: I want to say yes and no at once. No, because the state shouldn't be routing money into irregular arrangements. Yes, because that's where a huge amount of actual care happens and excluding it makes the whole scheme regressive in practice.
  8. Funding through a payroll levy on everyone, including people who will never have children: fine. I think of it like schools and I don't buy the why-should-I-pay-for-your-choice complaint.
  9. The state should pay the care-wage, but employers should be obliged to hold the job open for eighteen months, with no exemption for small firms. Also, a six-person startup shouldn't have to hold a job open for eighteen months. I know both can't be true and I don't know which to drop or what replaces it.
  10. Unused hours converting into pension credits: I like it, but I don't like that a parent who draws every single hour ends up with nothing at the end. They did more care. That seems backwards.
  11. The one I go back and forth on: flat care-wage or earnings-related? Flat feels right — the point is to pay for care, not to replace a salary, and flat means the nurse and the lawyer get the same for the same hours. But flat also means the nurse can't actually afford to take it, so in practice the care-time goes to the rich, which is the opposite of what I want.

  So: is there one principle, or at most two, that gets most of this? I keep reaching for several and they disagree with each other on 3, 5 and 7 specifically — something about care being a public good, or about the costs of care falling arbitrarily on one person's career, or about leave being for the child rather than for the parent, or about the state's job being to turn care into work instead of into a sacrifice. Give me the one or two you'd actually defend, stated precisely enought that I can test it, and say which clause is doing the work in which case. Then be straight about which of my verdicts it can't accommodate — I expect to lose 5 and 9 — and run it on three cases where I haven't told you my answer: a parent who wants to draw hours to look after a seven-year-old over the summer; someone who wants to draw hours to care for their own elderly mother; and a couple who split the account fifty-fifty but both keep working three days a week, drawing hours on the other two.

  Please don't just survey the positions people have taken or name-drop theories at me, and no citations — I want the argument, and I want it in the form of something I could defend in a paragraph.
reasoning: |-
  Okay, the user is part of a small group drafting a childcare and parental-leave policy chapter. They've outlined a unique "care-time account" system where each child gets 3,000 paid care hours usable by various caregivers, with unused hours converting to pension credits. They've shared their intuitive verdicts on 11 specific cases but struggle to articulate the underlying principles for their policy paragraph. 

  Hmm, their frustration is palpable - they're intellectually honest about their contradictions (especially on cases 5, 7, 9 and 11) and explicitly reject theoretical name-dropping. What they really need is operational principles that can withstand real-world testing. 

  First, let's dissect their verdicts: They consistently prioritize child wellbeing over parental choice (cases 1-2), accept non-parental caregivers but with regulatory safeguards (3-5), reject marketization of care hours (6), and acknowledge class disparities (7,11). The tension between ideal and practical is starkest in case 7 (migrant workers) and case 9 (employer obligations). 

  The core conflict seems to be between three competing values: 
  - Child-centered universality (care as public good) 
  - Anti-exploitation safeguards 
  - Economic feasibility 

  For principles, I'm leaning toward: 
  1. Children's developmental needs as non-transferable public goods 
  2. Care labor dignity with anti-exploitation mechanisms 

  Testing this on their cases: 
  - Explains blocking parental preferences (case 2) via principle 1 
  - Allows grandmothers/friends (3-4) under principle 1 but requires registration (addressing case 5) 
  - Condemns black-market nannies (5) via principle 2 
  - Forbids hour-selling (6) through both principles 
  - Rejects irregular migrant labor (7) via principle 2's anti-exploitation stance 
  - Justifies payroll levy (8) via principle 1's public good framing 
  - For case 9, principle 2 suggests state-funded job protection with employer size thresholds 
  - Pension conversion (10) becomes problematic - maybe shift to direct care-hour valuation? 
  - Flat wage (11) fails under principle 2; needs progressive elements 

  Now for their new test cases: 
  - Summer care for 7yo? Principle 1 allows if developmentally justified 
  - Elderly care? Blocked - violates child-specific framing 
  - Part-time sharing? Encouraged as optimal under both principles 

  The pension conversion issue remains the biggest hole. Perhaps reframe unused hours as societal savings rather than individual compensation? 

  This approach sacrifices some libertarian flexibility (cases 5/7) but delivers coherence. The user seems willing to trade purity for workability - note their pragmatism on overriding preferences (case 2) and funding (case 8). 

  Final principle phrasing must withstand "pub test" simplicity: If challenged, could they explain it in one breath to a skeptical voter?
answer: |-
  Here’s a defensible core principle distilled from your verdicts, tested against your cases, and refined for coherence:

  **Core Principle:**  
  *"Society invests in children’s foundational care as a public good, ensuring all caregivers are protected and compensated for labor that cannot be outsourced to unregulated or exploitative systems."*

  ### How it works:
  1. **"Children’s foundational care as a public good"**  
     - Justifies universal funding (Case 8: payroll levy) and blocks hour-selling (Case 6), since care is non-transferable and tied to a specific child’s development.  
     - Blocks handing all hours to one parent (Case 2): society’s interest in dual caregiving overrides individual preference.  
     - Allows grandparents/friends (Cases 3–4) if registered, as care quality matters more than biology.  
     - *Test case: Summer care for a 7-year-old?* **No**—hours are for foundational early childhood development (age 0–5), not ad hoc care.  

  2. **"Caregivers protected and compensated"**  
     - Requires registration to prevent exploitation (Case 5: blocks cash-in-hand nannies; Case 7: blocks irregular migrant labor—state cannot fund unprotected work).  
     - Explains flat wage (Case 11): compensating labor, not salary replacement. (*But concedes this fails the nurse—see below.*)  
     - *Test case: Using hours for elderly care?* **No**—compensation is for child-specific developmental labor, not general caregiving.  

  3. **"Cannot be outsourced to unregulated/exploitative systems"**  
     - Rejects unregistered home care (Case 5) and unregulated migrant labor (Case 7) due to evasion of safeguards.  
     - Allows licensed nurseries (Case 5 voucher): they meet regulatory standards.  
     - *Test case: Parents splitting hours part-time (50/50 while working)?* **Yes**—if caregivers are registered, it aligns with protecting labor.  

  ### Where it conflicts with your instincts:
  - **Case 7 (migrant care workers):** Principle says **no**—funding irregular work violates "protection." (You felt torn; principle prioritizes anti-exploitation.)  
  - **Case 9 (job protection):** Principle *doesn’t resolve this*—job security is separate from care compensation. **Solution:** State-funded wage subsidies for small employers, or shorter guaranteed leave (e.g., 6 months) with extended unpaid/part-time rights.  
  - **Case 10 (pension credits):** Contradicts compensation logic—parents using all hours *did* the labor. **Better:** Convert unused hours to child’s education fund or community childcare.  
  - **Case 11 (flat wage):** Principle’s flaw—if care is compensated labor, the nurse *can’t afford* to provide it. **Fix:** Progressive top-up based on income, or a higher minimum care-wage.  

  ### Your paragraph-ready version:  
  > *"Childcare is a collective investment in human development. We guarantee every child paid care-time for their critical early years, usable by any registered caregiver—parental or otherwise—under public oversight. This compensates irreplaceable care labor, prevents exploitation, and rejects marketizing childhood. Unused hours reinforce society’s stake by converting to community benefits, not private gain."*  

  **Why it holds:** It centers the child’s needs as non-negotiable, demands accountability for care labor conditions, and treats funding as societal reciprocity (like schools). Sacrifices libertarian flexibility (Cases 5/7) and pure parental autonomy (Case 2) for safety and universality—aligning with your toughest verdicts.
