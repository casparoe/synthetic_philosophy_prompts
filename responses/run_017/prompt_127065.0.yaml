  ## DEPARTMENT OF ADMINISTRATIVE CONTINUITY  
  **Instrument DAC/ConOff/1978-03**  
  **CONTINUITY OF OFFICE (STANDARD OPERATIONAL PARAMETERS) REGULATIONS**  
  **Date of Effect: 1st April 1978**

  **1. Interpretation**  
  (a) "Office" shall mean any formally designated position, role, or locus of responsibility within the Administrative Structure, charged with specific functions as defined by relevant Schedule, Charter, or Instrument.  
  (b) "Incumbent" shall mean the entity, collective, mechanism, or phenomenon currently discharging the functions of an Office.  
  (c) "Continuity" shall denote the uninterrupted maintenance of the Office's essential operational profile, as defined herein.  
  *(Marginal Note: Ref. DAC/Prec/1955: Re: Estuary Protocol - "phenomenon" held to include geographical features under specific flux conditions).*

  **2. Essence of Office**  
  The identity of an Office resides solely and exclusively in the **Functional Profile**, defined as:  
  (a) The nature and format of inputs received by the Office according to established procedural channels (Schedule A, Annex 1).  
  (b) The prescribed transformation of internal operational states consequent upon the receipt of said inputs, as per authorised processing protocols (Schedule B).  
  (c) The nature, format, timing, and destination of outputs generated by the Office and dispatched according to established procedural channels (Schedule C).  
  Provided that the Functional Profile is maintained within acceptable tolerances (see Regulation 7), the Office is deemed to persist irrespective of the physical constitution, composition, or ontological nature of the Incumbent.

  **3. Material Indifference**  
  The Department shall hold no requirement concerning the substance or form of the Incumbent. Any entity, mechanism, collective, arrangement, or system capable of sustaining the Functional Profile (as verified under Regulation 9) shall be deemed a valid holder of the Office. Historical precedent includes, but is not limited to: Standing Committees (Ref. DAC/Reg/Min/1961), mechanical automata (Ref. DAC/Tech/1970-12), trained avian collectives (Ref. DAC/Prec/1972: *In re Gavel & Feathers*), and other configurations as formally recognised.  
  *(Marginal Note: DAC/Form7 required for non-standard Incumbent registration).*

  **4. Functional Equivalence**  
  (a) An Incumbent (Claimant) seeking recognition as the holder of a specific Office must demonstrate **Operational Equivalence** to the last formally recorded state of that Office.  
  (b) Operational Equivalence is established solely by demonstrating that the Claimant's Functional Profile falls within the tolerances specified in Regulation 7 for all inputs, transformations, and outputs enumerated in Schedules A, B, and C.  
  (c) No other criteria, including but not limited to physical resemblance, historical lineage, internal subjective experience (if any), or method of achieving transformations, shall be admissible for establishing Operational Equivalence, save where explicitly mandated by overriding Charter (Ref. DAC/Charter/Primary, §14).

  **5. Preservation of Specification**  
  (a) The definition of the Functional Profile (Schedules A, B, C) shall be sufficiently abstracted from the specific implementation methodologies historically employed by prior Incumbents to permit legitimate variation and innovation in Office discharge.  
  (b) However, the definition shall be sufficiently precise to ensure outputs meet the administrative requirements necessitating the Office's existence.  
  (c) The precise calibration between abstraction and precision shall be determined by the Department's Office of Functional Validation (OFV) on a case-by-case basis, guided by precedent and operational necessity. *(Marginal Note: DAC/Appeal/OFV-Decision form available upon request, fee applies).*

  **6. Subjective Variance Complaint**  
  Where a Claimant, despite demonstrably satisfying all requirements of Operational Equivalence (Reg. 4), reports that the *experience* or *internal qualitative character* of performing the Office's functions differs substantially from that reported by a predecessor Incumbent, such complaint shall be noted (Form DAC/SubjVar/78) and filed.  
  (a) The Department acknowledges such reports as non-material to the establishment of Operational Equivalence.  
  (b) The internal phenomenology of the Incumbent is categorised as an emergent property of the functional processes and is not a constituent element of the Office itself.  
  (c) Resolution of such complaints lies outside the scope of these Regulations and shall be referred, without prejudice, to the Department of Internal Harmony (Ref. DIH/Circular/1975-08: "Managing Perceptual Anomalies in Service Delivery").

  **7. Tolerance Parameters**  
  (a) Minor deviations in the *timing* of outputs (not exceeding ±5% of standard processing cycles, or 3 working days, whichever is lesser) shall not constitute a breach of Continuity.  
  (b) Minor deviations in the *format* of outputs (preserving all mandatory data fields and adhering to approved template variants) shall not constitute a breach of Continuity.  
  (c) Minor deviations in *internal transformation pathways* (provided the logical sequence from defined input to defined output is preserved and no unauthorised external dependencies are introduced) shall not constitute a breach of Continuity.  
  (d) "Minor" shall be interpreted by the OFV, considering the Office's criticality and historical fluctuation. Significant or persistent deviations trigger Review under Regulation 9.

  **8. Purpose & Interpretation**  
  The purpose of an Office is defined solely by the outputs it is required to produce and the inputs it is designated to receive, as codified in the relevant Schedules. No extrinsic purpose, intention, or unstated expectation shall be imputed to the Office or bear upon the determination of Continuity. Interpretation of purpose rests solely with the Department, via the OFV, guided by the letter of the Schedules and established precedent.

  **9. Verification of Continuity**  
  (a) Claimants must submit Form DAC/ContVer/78, fully completed, accompanied by:  
      (i) Certified logs of inputs received over a Verification Period (minimum 30 days).  
      (ii) A notarised schema of internal processing states and transitions (where applicable/applicable to schema-possessing entities).  
      (iii) Certified logs of outputs dispatched during the Verification Period.  
      (iv) Cross-referential attestation from recipient Offices confirming receipt and validity of outputs.  
  (b) The OFV will compare submitted data against the Office's baseline Functional Profile.  
  (c) Continuity is confirmed upon OFV certification of Operational Equivalence within tolerances.

  **10. Cessation & Succession**  
  (a) Continuity is deemed broken only upon formal certification by the OFV of a persistent and irremediable failure to maintain the Functional Profile outside permitted tolerances.  
  (b) Upon such certification, or upon formal retirement/decommissioning of the Incumbent (Form DAC/Retire/78), the Office enters a state of Latency.  
  (c) The first Claimant successfully demonstrating Operational Equivalence to the last recorded Functional Profile prior to Latency shall be recognised as the new Incumbent, establishing Continuity.

  **NOTE FOR APPLICANTS**

  To establish you *are* the Office, demonstrate you *do* the Office. Submit logs proving you reliably receive the correct inputs, transform them according to the defined rules (show the steps, if steps exist to be shown), and dispatch the correct outputs, on time and in the right format, to the right places. How you achieve this, or what it feels like to achieve it, is irrelevant. Focus solely on the observable, documented flow of work matching the pattern on file. Internal states are only material if they demonstrably alter outputs; personal experience of the role is not a valid metric. Prove the function, secure the title.

  **Signed,**  
  *Reginald Psmith, Undersecretary for Ontological Compliance*  
  **Department of Administrative Continuity**  
  1st April 1978
