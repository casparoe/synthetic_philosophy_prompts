answer: |-
  Below is a complete design for your ant-colony simulation session, optimized to hit all your beats while respecting your constraints (no lecture up front, no stacking the deck, individual/colony payoff conflict, and minimal setup). The simulation uses a grid-based system with tokens for pheromones, index cards for rules, and focuses on embodied experience. I'll provide rules, timeline, payoff scheme, debrief mapping, and problem-solving.

  ---

  ### **Core Mechanics & Rules**  
  **Grid Setup:**  
  - Create a 5x5 grid on the floor using tape (each square ~2ft x 2ft). Label squares with coordinates (0,0) to (4,4).  
  - **Nest:** Square (0,0). Mark with a sign.  
  - **Food Stations:**  
    - **Close Feeder:** (1,0) — 1 step from nest (east).  
    - **Far Feeder:** (0,3) — 3 steps from nest (north).  
  - **Tokens:** Use colored poker chips (red = pheromone). Place a small bowl of chips near the nest for ants to grab.  
  - **Barrier for Fission:** Use a rope or folded tablecloth to split the grid between columns x=2 and x=3 (left: x=0-2; right: x=3-4).  

  **Ant Rules (on index cards):**  
  *No global goal is explained. Each card has only local rules. Students are "ants" — no talking, only movement and token-dropping.*  

  ```markdown
  **YOUR CARD: ANT RULES**  
  1. **START:** Begin at the nest (0,0). You are "searching" (no food).  
  2. **MOVEMENT:**  
     - On your turn, move ONE square (up/down/left/right). No diagonals.  
     - If multiple paths, roll a die (provided) or use rock-paper-scissors to randomize.  
  3. **SEARCHING (no food):**  
     - If you enter a square with a token, you MUST follow the token path: move to an adjacent square with a token (random if multiple).  
     - If no tokens, move randomly.  
     - If you find food, take 1 food token (blue chip) and switch to "returning."  
  4. **RETURNING (carrying food):**  
     - After moving, drop 1 red token in that square UNLESS it already has one.  
     - Move toward the nest: if in row y>0, move south; if in column x>0, move west. (If conflicted, prioritize south then west.)  
     - At the nest, drop the food token in the colony food pile. Switch to "searching."  
  5. **NO MEMORY:** Forget where food was. Only react to tokens/squares you're on.  
  ```  

  **Payoff Scheme:**  
  - **Colony Payoff:** 1 "food unit" per blue token delivered to nest pile. Goal: Maximize units.  
  - **Individual Ant Payoff:** 1 "energy point" per red token YOU drop. Goal: Maximize points.  
    - *Conflict:* Returning ants drop tokens on every move, incentivizing longer paths (more tokens = more points). Short paths are better for colony but worse for individual ants.  

  **Materials Needed:**  
  - Tape (grid), poker chips (red/blue), index cards (rules), dice/rock-paper-scissors for randomness, signs for nest/food, barrier (rope), timer.  

  ---

  ### **Timeline (80-Minute Block)**  
  **Total: Setup (10 min) | Simulation (40 min) | Debrief (25 min) | Buffer (5 min)**  

  | Time (min) | Phase             | Key Actions                                                                                                | Instructor Notes                                                                                                |  
  |------------|-------------------|------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|  
  | 0-10       | **Setup**         | - Clear floor space, tape grid, place feeders. Hand out rule cards, assign starting positions.              | - Emphasize: "No talking. Move only based on your card. Tokens are your only communication."                   |  
  | 10-30      | **Phase 1: Emergence** | - Ants start at nest. Let them run. Close feeder (1,0) is optimal; colony *should* converge there naturally. | - Observe silently. If no convergence by 20 min, nudge ants off walls. Do not mention feeders or goals.         |  
  | 30-35      | **Phase 2: Turnover**  | - Stop simulation. Remove 8 random "ants" (send to hallway). Replace with 8 "new ants" (reset to nest).    | - New ants start fresh (no memory). Keep tokens on grid. Ask: "Did the colony's 'goal' survive?" (Do not answer).|  
  | 35-40      | **Phase 3: Fission**   | - Split grid with barrier. Left group: x=0-2; right: x=3-4. Run two colonies simultaneously.               | - Barrier cuts off paths (e.g., far feeder (0,3) is now only in left). Ensure both sides have nest/food access. |  
  | 40-45      | **Phase 4: Misrepresentation** | - Move far feeder from (0,3) to (4,3) *without* disturbing tokens. Ants run with stale trails.            | - Ants follow old tokens to (0,3), find no food. Colony payoff stalls; individual ants still earn by dropping tokens. |  
  | 45-48      | **Phase 5: Addressability** | - Announce aloud: "ATTENTION: FOOD MOVED TO (4,3)." Let ants run.                                         | - Ants ignore announcement (no way to "hear" colony-level info).                                                |  
  | 48-50      | **Reset**          | - Stop simulation. Collect tokens. Students return to seats.                                               | - **Publicity beat:** Tokens were visible to all, but only ants could act on them.                              |  
  | 50-75      | **Debrief**        | - Structured discussion (see below).                                                                       | - Start with student observations, then map to concepts. Avoid jargon until they name it.                       |  
  | 75-80      | **Buffer**         | - Q&A or wrap-up.                                                                                          | -                                                                                                               |  

  ---

  ### **Debrief Mapping to Concepts**  
  *Guide the discussion using student experiences. Let them articulate ideas first.*  

  | Simulation Moment          | Philosophy of Mind Concept                                                                                                | Key Questions                                                                                                |  
  |----------------------------|---------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|  
  | **Emergence (convergence)** | Functionalism / Emergence                                                                                                 | - "Did any ant decide the colony should use the short path? How did it happen?" <br> - "What does this say about 'intelligence' without a central controller?" |  
  | **Turnover**               | Persistence of Beliefs/Desires                                                                                            | - "When ants were replaced, did the colony 'know' where the food was? Where was that knowledge stored?"      |  
  | **Fission**                | Personal Identity / Boundaries of Mind                                                                                    | - "When we split, did we get two colonies? Is Aunt Hillary dead, or are there two Aunt Hillarys? Why?"       |  
  | **Misrepresentation**      | False Beliefs / Stale Information                                                                                         | - "The colony kept going to (0,3) after food moved. Was this a 'false belief'? How is it different from human error?" |  
  | **Addressability**         | Lack of Central Access                                                                                                    | - "Why didn't the colony 'hear' my announcement? What would it need for that?"                               |  
  | **Publicity (tokens)**     | Privacy of Mental States                                                                                                  | - "All messages were public. Does that make the colony more or less like a mind? Why can't we 'read its thoughts'?" |  
  | **Payoff Conflict**        | Individual vs. Collective Rationality                                                                                     | - "Ants earned points for dropping tokens, even when it hurt the colony. Is there a 'selfish' ant mind vs. a 'group' colony mind?" |  

  **Transition to Theory:**  
  - Only after students share: "What you experienced is Dennett's 'Aunt Hillary' and Hofstadter's levels. The colony exhibits *functional* intelligence, but is it a *mind*? What would tip the scale to 'yes'? (e.g., self-monitoring, error-correction, goals beyond food)."  
  - Gut reactions: "Which felt stronger: the intuition that this is 'just ants' or that the colony 'wants' something? Hold onto that—it'll resurface with Chinese Room, extended mind, etc."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **CS Majors Short-Circuiting:**  
     - *Risk:* Declaring "just ACO, no mind" early.  
     - *Solution:* Redirect with embodied stakes. Say: "Great—now *show* me how the colony would 'think' in misrepresentation phase. What would a 'true' mind do differently here?"  

  2. **Trail Not Converging:**  
     - *Risk:* Grid too small, random movement dominates.  
     - *Solution:* Prep a "backup token" to drop subtly at the close feeder after 10 min if needed. Or increase token-following bias (e.g., "if tokens, move to one 90% of the time").  

  3. **Ants Talking/Boredom:**  
     - *Risk:* Talking breaks immersion; boredom if convergence is slow.  
     - *Solution:* Assign "observer" roles (if <16 students) to track payoffs. Use a timer for turns (20-30 sec/move). If bored, trigger turnover early.  

  4. **Fission Chaos:**  
     - *Risk:* Barrier confusion, ants stuck.  
     - *Solution:* Rehearse barrier placement. In debrief, use chaos productively: "Did fission feel messy? What does that say about minds needing coherence?"  

  5. **Naming the Colony:**  
     - *Risk:* Accidentally saying "Aunt Hillary" primes the yes-answer.  
     - *Solution:* Refer only to "the colony." If a student names it, note: "Let's call it X for now—does naming change anything?" (Debrief: naming as a human projection).  

  6. **Someone Spoils the Point:**  
     - *Risk:* A student guesses Dennett/Hofstadter and explains it.  
     - *Solution:* "Hold that thought! Jot it down—we'll test your idea in misrepresentation phase."  

  ---

  ### **What the Simulation Can't Address (Requires Lecture)**  
  - **Consciousness:** The simulation shows functional behavior but can't tackle qualia (e.g., "Is the colony *aware*?"). In debrief: "Even if it passes all functional tests, does it *feel* like something to be Aunt Hillary? That's the hard problem."  
  - **Scalability:** Ant colonies are simple; human brains are complex. Note: "This is a toy model. Add 10,000 ants, learning, or prediction—does that change anything?"  
  - **Intentionality:** Stale tokens resemble "false beliefs," but debrief: "Do tokens *represent* food, or are they just causes? (See: Fodor on original intentionality)."  

  ---

  ### **Why This Works**  
  - **Skepticism Has Purchase:** Payoff conflict makes functionalism feel brittle (ants act "irrationally" for the colony). Public tokens and addressability failure make emergent "mind" seem incomplete.  
  - **Gut Reactions Balanced:** CS majors see optimization flaws; phil students feel the weirdness of distributed goals.  
  - **Embodied Learning:** Students *feel* the gap between individual and colony, making Hofstadter's levels tangible.  

  Run this as described, and they’ll leave with the core tension internalized—ready to wrestle with it all semester.
