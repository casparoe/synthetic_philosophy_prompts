  The deeper issue is whether epistemic akrasia is possible. If higher-order evidence is part of total evidence, believing against it might be irrational but not akratic. Akrasia traditionally involves conflict between reason and desire. In belief, it's reason vs. reason. So labeling it "akrasia" might be misleading. The user might need to frame it as conflicting epistemic obligations rather than strict akrasia.

