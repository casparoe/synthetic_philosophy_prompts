answer: |-
  ## Term Paper Proposal: Noise, Norms, and Noisy Conditionals in the Judy Benjamin Problem

  **1. The Core Question (Precise & Bifurcated):**

  The central question for this paper is: **When an agent receives a conditional proposition (like M1: "If enemy, then HQ") as evidence through a noisy channel, leading to uncertainty about the *exact content* of the evidence received, does formal epistemology provide a single, normatively privileged update rule for revising degrees of belief, and does the answer depend crucially on the *source* of the noise (e.g., channel distortion vs. source unreliability)?**

  This formulation precisely targets the ambiguity exposed by the half-formed idea:
  *   **"Privileged update rule?":** Requires evaluating whether frameworks like Bayesian conditioning, Jeffrey conditioning, or alternatives offer a unique, justified solution when evidence uncertainty concerns conditionals, specifically highlighting the partitioning problem inherent in such messages.
  *   **"Depend on noise source?":** Forces a comparison between the "heard distinct message, distrust source" model and the "uncertain which message was broadcast" model, probing whether the normative prescription changes based on this interpretational choice.
  *   **"Come out either way":** The paper could conclude: (a) Yes, a unique rule exists (specifying which one and why), (b) No unique rule exists, but the choice depends on noise source, (c) No unique rule exists, and noise source dependency is insignificant or insufficient to determine a rule, (d) The problem dissolves under proper joint modeling (though Section 4 argues against this dissolution).

  **2. Why Existing Positions Leave It Open (The Evidence-Algebra Gap):**

  The seminar explored three main families of rules for handling conditionals as flat evidence (M1 learned with certainty):
  1.  **Conditionalization on the Proposition:** Treats the conditional `M1` as a proposition within Judy's existing algebra over regions and conditionalizes on it.
  2.  **Minimal Revision under Constraint:** Imposes the constraint `P*(M1) = 1` (or, for Jeffrey, a distribution over a partition) and minimizes some distance measure (e.g., Kullback-Leibler divergence) from the prior.
  3.  **Suppositional/Imaging Rules:** Treats the antecedent ("enemy territory") as a supposition and updates the probabilities under that supposition based on the consequent ("HQ").

  *Crucially, all these approaches presuppose that the evidence item itself is a well-defined proposition residing within the *same* underlying algebra as the hypothesis space (the regions).* The normative arguments used to adjudicate between them inherit this presupposition:
  *   **Diachronic Dutch Books:** Assume bets are offered on propositions within the algebra; uncertainty about *which proposition constitutes the evidence* falls outside this model.
  *   **Accuracy/Scoring Rule Arguments:** Typically evaluate accuracy *after* the evidence proposition is known and incorporated. They don't directly address how to revise *when the identity of the evidence proposition is uncertain*.
  *   **Distance Minimization (Jeffrey):** Relies fundamentally on the uncertain evidence constituting a *partition* of the possibility space. As demonstrated with M1 and M2, conditionals often violate this partition requirement (`P(M1) + P(M2) = 1 + P(B) > 1`), rendering standard Jeffrey conditioning undefined or catastrophically incoherent.

  Therefore, the core presupposition of all standard approaches and their justifications – that the evidence is a known proposition in the hypothesis algebra – is precisely what breaks down when reception is noisy and the evidence is a conditional. The existing toolkit offers no automatic transfer or unique prescription for this scenario.

  **3. Method: Mapping the Underdetermination (Month-by-Month Plan)**

  *   **Month 1: Formalizing the Joint Space & Noise Models**
      *   **Goal:** Explicitly construct a joint probability space encompassing Judy's location (`L`: BH, BS, RH, RS) and the message received (`M`: M1, M2, potentially others like silence or gibberish).
      *   **Work:** Define prior `P_old(L, M) = P_old(L) * P_old(M | L)`. This requires specifying `P_old(M | L)`.
      *   **Key Challenge:** Precisely model the two noise scenarios:
          *   *(Source Distrust)*: If source is reliable (prob `r`), `M` matches the intended conditional based on location rules. If unreliable (prob `1-r`), `M` is random/uninformative (e.g., uniform over possible messages? fixed gibberish? requires choice).
          *   *(Channel Uncertainty)*: A specific message `M_intended` is broadcast. The channel distorts it to `M_received` with some probability (`P(M_received | M_intended)`). Judy only knows `M_received` (e.g., "I heard *something* conditional sounding, 90% sure it was M1, 10% M2"). Crucially, define the mapping `M_intended = f(L)` (e.g., "If in R, broadcast H or S status?"). *This `f(L)` is the critical underdetermination, especially when `L` is in B (friendly) where both M1 and M2 are true – which one *would* have been broadcast?* **Why this over alternatives?** Cataloging rules or surveying intuitions lacks normative force; this formal grounding is essential for evaluating coherence and decision-making. It also directly confronts the advisor's "just condition" objection.
  *   **Month 2: Characterizing Constraint Failures & Joint Conditioning**
      *   **Goal:** Formalize the naive constraint approach failure. Analyze conditioning in the joint space.
      *   **Work:** Show generally when imposing `P_new(M1)=α`, `P_new(M2)=β` (where `M1`, `M2` are propositions in the *location* algebra) leads to contradiction or absurdity (like `P_new(B)=0`). Characterize the conditions (e.g., overlap `P(M1 ∧ M2) > 0` and `α + β > 1`). Compute `P_new(L)` for both noise models via standard conditioning on `M_received` in the joint space: `P_new(L) = P_old(L | M_received)`.
  *   **Month 3: Divergence Analysis & Decision Theory Setup**
      *   **Goal:** Quantify differences between update methods/models. Set up decision problem.
      *   **Work:** Compare the `P_new(L)` obtained under the two noise models (for the same `M_received` confidence, e.g., 90% on M1). Systematically vary priors (e.g., `P(B)`, `P(H|B)`, `P(H|R)`) and noise parameters (`r`, channel error rates). *Find parameter regimes where `P_new(B)` differs maximally* (aiming beyond the observed ~0.78 vs. ~0.77). Define a simple decision: Judy must choose to move towards HQ or 2nd Company, with utilities depending on true location (e.g., high utility if friendly HQ, low if enemy HQ, medium elsewhere). Calculate expected utility (EU) for each choice under each updated `P_new(L)`.
  *   **Month 4: Decision-Theoretic Impact & Rule Comparison**
      *   **Goal:** Assess practical significance of update differences.
      *   **Work:** Compute the difference in maximum expected utility (ΔmaxEU) between the best choice under one update rule/model and the best choice under another. Find parameters where ΔmaxEU is large (e.g., where different rules recommend different actions). Explore alternative update rules proposed for uncertain evidence (e.g., Field conditioning, generalized imaging, "averaging updates") within the joint space framework. Compute their `P_new(L)` and resulting EU.
  *   **Month 5: Normative Analysis & Response to Dissolution**
      *   **Goal:** Evaluate the normative status of the joint space conditioning results. Defend against the "dissolution" objection.
      *   **Work:** Argue that conditioning in *a* joint space is necessary but not sufficient. The crucial normative choice lies in specifying `P_old(M | L)` or `P_old(M_received | M_intended)` and `f(L)` – especially defining what message *would have been sent* if in friendly territory (B). This choice lacks a clear normative basis within standard arguments (Dutch Books, Accuracy) applied purely to the location space; these arguments are satisfied *once the joint model is fixed*. The choice of joint model structure *is* the normative crux.
  *   **Month 6: Synthesis, Writing & Conclusion Refinement**
      *   **Goal:** Synthesize results, finalize argument, write paper.

  **4. Possible Conclusions & Deciding Factors:**

  *   **Conclusion A (Dissolution Confirmed):** Conditioning in *any* reasonably constructed joint space (respecting the communication setup) yields essentially identical `P_new(L)` and EU recommendations, regardless of noise model specifics or `f(L)` choices in B. The apparent problem vanishes under proper modeling. *Deciding Factor:* If divergence in `P_new(B)` or ΔmaxEU remains negligible (< epsilon) across all plausible joint model parameterizations and decision scenarios.
  *   **Conclusion B (Noise Source Matters / Normative Choice):** The "source distrust" and "channel uncertainty" models systematically yield meaningfully different updates (`P_new(L)`) and can lead to different optimal actions (significant ΔmaxEU). Furthermore, specifying the joint model – particularly the counterfactual message policy in B (`f(L)`) – is a *normative choice* not settled by standard coherence/accuracy arguments applied to the location space alone. Different choices reflect different interpretations of the evidence-gathering process. *Deciding Factor:* Finding significant, robust divergence in updates/decisions between models, coupled with showing that the `f(L)` choice in B significantly impacts results *and* lacks a unique justification from standard norms.
  *   **Conclusion C (No Privileged Rule, Noise Source Irrelevant):** While joint modeling is necessary, multiple coherent joint models exist, leading to different updates. However, the *type* of noise model (source vs. channel) isn't the primary driver of difference; the ambiguity in `f(L)` within any model is the key issue. No single update rule is uniquely privileged. *Deciding Factor:* Significant divergence persists, but it's primarily tied to modeling choices *within* a noise type (e.g., how `f(L)` is defined in B) rather than *between* noise types.
  *   **Conclusion D (Hybrid):** A privileged rule exists *conditional* on specifying the type of noise and the counterfactual message policy `f(L)`. The normative task shifts to justifying these specifications. *Deciding Factor:* Showing that *given* a specific noise model and `f(L)`, a unique update rule follows (e.g., conditioning), but that choosing the model+policy is the fundamental normative challenge.

  **5. Failure Conditions, Scope, and Risk Assessment:**

  *   **Failure Conditions:**
      *   **Negligible Divergence:** The differences in `P_new(B)` and ΔmaxEU between plausible update rules and noise models remain minuscule (< 0.01) across all examined parameters. The problem lacks practical or theoretical significance.
      *   **Taxonomy without Verdict:** The project successfully catalogs the different outcomes based on modeling choices but fails to provide any normative argument favoring one over others, or showing why the choice matters. The conclusion is purely descriptive.
      *   **Intractable Formalism:** The joint space analysis becomes too complex to yield clear, interpretable results or decision-theoretic implications.
  *   **Scope Management (Potential Cuts):**
      *   **Primary Cut:** The **Decision-Theoretic Analysis (Months 3-4)**. If divergence in beliefs (`P_new(L)`) is small, or if the core philosophical point about underdetermination is made clearly without it, this section could be reduced or omitted. Its necessity depends on early results in Month 3.
      *   **Secondary Cut:** **Detailed comparison of many alternative update rules** beyond the two main noise models and conditioning. Focus on the core contrast.
      *   **Tertiary Cut:** **Exhaustive exploration of `f(L)` functions**. Focus on 2-3 plausible interpretations (e.g., always M1 in B, always M2 in B, random in B).
  *   **Blow-Up Risk Assessment:**
      *   **Highest Risk: Section 3 (Method) - Months 1 & 5.** Formalizing the joint space soundly (`P_old(M|L)`, `f(L)`) is foundational but potentially tricky. Month 5 (normative analysis of model choice) is philosophically deepest and hardest to pin down rigorously. A blow-up here could jeopardize the core argument.
      *   **Medium Risk: Section 3 (Method) - Month 3 (Divergence).** Finding significant, robust divergence is necessary for most interesting conclusions. Failure here leads to Conclusion A or a weak project.
      *   **Lower Risk: Sections 1, 2, 4.** Framing the question, critiquing existing approaches, and outlining conclusions are more straightforward, though Conclusion refinement depends on results.

  This proposal outlines a path to rigorously investigate the underdetermination introduced by noisy conditional evidence in the Judy Benjamin problem, directly addressing the core challenge of the `f(L)` ambiguity in the friendly region. It leverages formal tools to expose normative choices hidden in evidence modeling, moving beyond the flat-evidence assumption of standard treatments.
