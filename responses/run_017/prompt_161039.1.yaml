prompt: |-
  I'm taking an undergraduate seminar on animal ethics, and I keep encountering the same maneuver in readings and discussion without having a word for it.

  It runs like this. Someone grants up front that species membership as such cannot be what matters morally, and adds that they would extend full consideration to any non-human being that had the right properties. They then defend some practice toward animals by citing a property that is facially species-neutral: being a moral agent, being capable of reciprocity, standing in relations of mutual dependence with us, or occupying a role in our ecological community. Nearly all adult humans have the property; the animals in question do not. Asked about humans who lack it, they add that those humans belong to a kind whose normal members have it. Asked whether a being of another species that genuinely did have it would receive full status, they treat the question as science fiction and set it aside. I have watched exactly this happen in the debate over eating animals and again in a reading on urban pest control, where the property is assumed of the kind rather than checked of the individual animal.

  Speciesism seems to be the wrong name. As I have met it, speciesism is differentiating by species, and these people sincerely disavow that, and their marker could in principle be possessed by a non-human. But the marker operates as a bar that animals must clear and only ever as a sufficient, never a necessary, condition for humans, so the inclusive clause and the exclusive clause are never tested against each other.

  Is there an established concept for precisely this configuration? If it is speciesism after all, which formulation covers a case where the agent disavows species and the marker is in principle species-neutral? If it is not, I would like a name together with a definition that settles the boundary cases: a being of another species that really has the property; a human who never has and never will; and a property that matters independently but happens to track species for nobody's chosen reason. A label on its own will not help me — I want to know where the phenomenon stops.

  Please answer in 400 words or fewer.
reasoning: |-
  Alright, the user is grappling with a specific argument pattern in animal ethics. They've noticed a recurring maneuver where theorists reject species membership as morally relevant but then use a species-neutral property (like moral agency or reciprocity) to justify different treatment for animals. The catch is that humans who lack these properties still get full moral consideration because they belong to a kind whose typical members have them, while non-humans are excluded even if they possess similar capacities. 

  The user feels "speciesism" doesn't quite fit because these theorists genuinely disavow species-based discrimination, and the criteria they propose are technically species-neutral. But the application is asymmetrical: the property acts as a hurdle for non-humans (necessary but not sufficient) while humans get a free pass via kind-membership. The user wants a precise label for this logical structure and its boundary cases (e.g., a morally agential octopus, a permanently non-agential human, or a coincidentally species-tracking trait).

  Hmm. The core issue seems to be the inconsistent application of the moral criterion. Theorists appeal to individual capacities when it suits exclusion but retreat to species-typical properties for inclusion. This isn't just ad hoc—it reveals an unspoken hierarchy. The term "human supremacism" captures the underlying bias better than "speciesism" because the moral framework is still human-centered, even if dressed in neutral language. "Kind membership override" pinpoints the logical move of granting exceptions to humans. 

  The boundary cases clarify why this is problematic: if a bonobo demonstrated moral agency, would theorists consistently grant it rights? If not, the neutrality claim collapses. Likewise, denying rights to severely disabled humans based on individual capacities exposes the inconsistency—theorists won't bite that bullet because human interests remain paramount. The phenomenon stops where the criterion is applied uniformly, regardless of species. 

  User likely needs this for seminar debates or papers. Naming the maneuver gives them tools to critique it. They’re analytically sharp—spotting the asymmetry between necessary/sufficient conditions—so the response should honor that rigor. No fluff; just crisp definitions and clear boundaries.
answer: |-
  This maneuver is best described as **human supremacism** (or **anthropocentric exceptionalism**), specifically manifested through a **kind-biased application of criteria**. Here's the breakdown and boundary cases:

  1.  **Core Definition:** Granting moral status based on a putatively species-neutral property (P), while systematically applying it asymmetrically:
      *   **For non-humans:** P is treated as a *necessary condition* individuals must possess.
      *   **For humans:** P is treated as *sufficient* if possessed, but *not necessary*. Humans lacking P are included solely because they belong to a kind (Homo sapiens) whose *typical members* possess P ("kind membership override").

  2.  **Why not classic speciesism?** Classic speciesism directly privileges species membership. Here, the *justification* appeals to P, masking the underlying privileging of the human *kind*. The agent disavows species *as the direct reason*, but the *application* ensures human priority.

  3.  **Boundary Cases:**
      *   **Non-human with P (e.g., a genuinely moral-agent AI or alien):** If the agent *denies* this being full status, it exposes P as a pretext, confirming human supremacism. If they *grant* status, it aligns with their stated principle but contradicts their typical dismissal of such cases as "science fiction," revealing inconsistency in practice.
      *   **Human who never has/will possess P (e.g., severe congenital cognitive disability):** The "kind membership override" *must* apply here to include them. If the agent *excludes* them based on lacking P, it reveals a consistent but extreme position (likely rejected by most). If they *include* them solely via human kind-membership, it confirms the supremacist structure – humans get a unique exemption.
      *   **Property P that *genuinely* tracks species independently (e.g., "has human DNA"):** This *is* straightforward speciesism, as P is defined by species. The phenomenon described relies on P being *conceptually* species-neutral (like rationality, reciprocity) but *contingently* correlated with humans, allowing the asymmetric application.

  **The phenomenon stops** when the criterion P is applied *consistently* as both necessary and sufficient for *all* individuals, regardless of species kind, *and* the "kind membership override" is abandoned. If P is necessary for non-humans, it must be necessary for humans lacking it; if kind membership overrides P for humans, it must be able to override species lines for non-humans with the *relevant* kind-typical properties (e.g., a chimpanzee community). The refusal to do either reveals the anthropocentric core. **"Kind-biased human supremacism"** captures the logical structure.
