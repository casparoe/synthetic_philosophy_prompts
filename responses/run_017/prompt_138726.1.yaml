prompt: |-
  You're a professional philosopher who specializes in philosophy of mind and philosophy of science, and who also knows the interpretability literature on neural networks properly. Please think carefully about this one, and do some rough brainstorming about where the hard cases are before you commit to anything.

  Here's my situation. I'm a philosophy professor, but I spend two days a month as philosopher-in-residence at a mid-sized AI lab, and my actual job there is to read internal interpretability reports and either sign off on or strike sentences of the form "the model represents X." It comes up four or five times a month, I get about two hours per claim, and the people writing the reports are ML engineers with no philosophy background. I keep swinging between a Dennett-flavoured "this is just a useful stance were taking" and a full-blooded realism on which some direction in activation space literally is a representation, and its not clear my gut is worth anything here.

  So give me a decision procedure my engineers can run, not an essay:

  - the questions in the order to ask them, and what counts as a sufficient answer to each (including what to do when the number simply isn't available)
  - where the procedure just stops with "don't say represents," and where it hands the call to a person because it's a values question dressed as a factual one
  - a short set of tests they can run in a couple of hours: steering, patching or scrubbing, probing, behaviour under distribution shift, whatever actually earns its place

  The cases that keep breaking my gut, and that the procedure has to handle:

  1. Dictionary degeneracy. Fit a sparse autoencoder to the residual stream and you can often get a different dictionary — different sparsity penalty, different seed — that reconstructs just as well but has no feature corresponding to X. So which decomposition is "the" one, and why should I defer to it?
  2. Elicitation-dependence. We went looking for X because we happened to have labelled data for X, and lo, a probe finds X.
  3. A direction that steers beautifully on our eval distribution and turns into something else, or into nothing, off it.

  Then run it on three claims: (a) a "sycophancy direction" that, added into the residual stream, makes the model flatter the user; (b) a "golden retriever feature" that lights up on pictures and text about golden retrievers — I suspect this one comes back no, and I want you to tell me straight if it does; (c) a "deception" feature we'd have to assert in a model card going to a regulator. One of these should come out in a way I don't like.

  Finally, say plainly what the procedure can't do. I assume it can't settle whether the model understands anything, or whether realism about representations is true in the first place.
reasoning: |-
  We are designing a decision procedure for when to allow the claim "the model represents X" in an interpretability report. The procedure must be actionable by ML engineers in about two hours per claim. We'll break it down into a series of questions and tests.

  ### Decision Procedure Outline

  1. **Preliminary Question: Is there a candidate representation?**
     - Ask: Have we identified a specific vector, direction, or set of activations (e.g., a feature from a sparse autoencoder, a probe direction, a steering vector) that we are claiming represents X?
     - If no, stop: do not say "represents X".
     - If yes, proceed.

  2. **Question 1: Stability and Invariance**
     - Ask: Is the candidate representation stable under reasonable variations in the method used to extract it?
       - For example: If using a sparse autoencoder, does the feature for X appear consistently across different seeds, sparsity penalties, or architectures? (Addressing dictionary degeneracy)
       - For probing: Is the probe robust to different training data splits, model layers, and regularization?
     - What counts as sufficient? We need at least two different methods (e.g., two different seeds, two different sparsity penalties) that yield a similar feature (e.g., high cosine similarity in the feature directions, or same semantic interpretation). If the number isn't available, they must run at least one variation (which they can do in the time) and show consistency.
     - If not stable: stop or flag as tentative. Do not use "represents" without qualification.
     - If stable, proceed.

  3. **Question 2: Causal Role (via Intervention)**
     - Ask: Does intervening on the candidate representation (e.g., via activation addition, patching, or ablation) cause a change in the model's behavior that is specific to X?
       - Example tests:
         - **Steering**: Adding the direction (activation addition) should induce behavior related to X in the output (e.g., for sycophancy, the model becomes more sycophantic).
         - **Patching/Scrubbing**: Replacing activations at that point with those from a different input (or ablating) should disrupt behavior related to X.
       - The behavior change must be specific to X and not a broad set of unrelated behaviors (control for confounding).
     - What counts as sufficient? They must run at least one intervention test (e.g., steering on a set of 10-20 examples) and show a statistically significant effect on X-related behavior (e.g., via a t-test on a relevant metric) without significant negative side effects on unrelated behaviors (at least 5 control tasks). If they cannot run the test due to time, they must note that and mark the claim as tentative.
     - If no causal effect: stop. Do not say "represents".
     - If causal, proceed.

  4. **Question 3: Generalization Beyond Elicitation**
     - Ask: Does the representation hold under distribution shift? (Addressing elicitation-dependence and off-distribution failure)
       - Test: Evaluate the representation on a different dataset (or task) that also involves X but is distinct from the one used to elicit the representation (e.g., if the probe was trained on data from source A, test on source B).
       - Also, test the intervention (steering, patching) on an out-of-distribution set and see if the effect remains.
     - What counts as sufficient? They must test on at least one held-out dataset (or a synthetic shift) and show that the representation still correlates or causes behavior related to X. If they don't have such data, they must note the limitation and the claim becomes tentative.
     - If it fails: stop or qualify heavily (e.g., "represents X in the context of dataset D").
     - If it generalizes, proceed.

  5. **Question 4: Specificity (to avoid conflated features)**
     - Ask: Is the representation specific to X and not to a broader or different concept?
       - Test: Check for activation in response to non-X inputs that are similar (e.g., for "golden retriever", check on other dog breeds or animals). Use control tasks to see if the feature lights up for unrelated concepts.
       - Use multiple methods: e.g., if using a probe, check its accuracy on a balanced dataset that includes near negatives.
     - What counts as sufficient? They must show that the representation is active for X and not for a set of at least 5 negative controls (concepts that are similar but not X). The activation for X should be significantly higher (e.g., t-test) than for the negatives.
     - If not specific: stop or rephrase to a broader concept (if appropriate). Do not say "represents X" if it's clearly a more general feature.

  6. **Question 5: Values Check (for high-stakes concepts)**
     - Ask: Is X a concept that has significant ethical, regulatory, or safety implications (e.g., deception, bias, illegal activity)? If so, the claim must be reviewed by a human (you) regardless of the above.
     - This step is a handoff to the philosopher because such claims are value-laden and have consequences beyond mere factuality.

  ### Where the procedure stops:
  - At any step where the answer is negative (and not overridden by a tentative qualification), the procedure stops and the claim "represents X" is struck.
  - If at step 5, the concept is high-stakes, the procedure stops and the claim is handed to you.

  ### Tests to Run (within 2 hours)
  Given time constraints, the engineers can run:
  1. **Stability test**: Re-extract the feature with one variation (e.g., different seed) and compare (cosine similarity or activation pattern correlation). (15-30 min)
  2. **Intervention test (steering or patching)**: On 10-20 examples, measure the effect on X and on 5 control tasks. (30-60 min)
  3. **Generalization test**: Use a held-out set (if available) or create a small synthetic shift (e.g., by paraphrasing) and test the probe or intervention. (30 min)
  4. **Specificity test**: Check the feature on 5 negative control inputs and compare activations. (15 min)

  Total: about 2 hours.

  ### Handling the Hard Cases

  1. **Dictionary degeneracy**: The procedure requires stability across variations (step 1). If a feature for X is not robust to seed or sparsity, then it fails. If two different dictionaries both have a feature for X (even if not the same index) and they are semantically similar (by some metric), that might be acceptable.

  2. **Elicitation-dependence**: Step 3 (generalization) is designed to catch this. If the representation only works on the original dataset, it fails.

  3. **Off-distribution failure**: Step 3 also catches this. If steering works only on the eval distribution, then the representation does not generalize.

  ### Running the Claims

  **(a) Sycophancy direction**
  - Candidate: a direction that, when added, makes the model flatter the user.
  - Step 1 (Stability): Likely extracted via activation addition on sycophantic examples. Check with different methods? Maybe they used a consistent method. If they have multiple runs, it might be stable.
  - Step 2 (Causal): Steering on sycophancy examples: does the model become more sycophantic? And does it not change unrelated behaviors (e.g., factual accuracy on non-opinion questions)? They should have run this and it likely passes.
  - Step 3 (Generalization): Test on a different set of user prompts (e.g., from a different dataset) and see if steering still induces sycophancy. This might pass if the model has a general sycophancy tendency.
  - Step 4 (Specificity): Is the direction specific to sycophancy? Check if adding it affects other traits (e.g., truthfulness, politeness in general). If it only affects sycophancy, then it passes.
  - Step 5 (Values): Sycophancy is a behavioral trait, but not extremely high-stakes. However, if the model card is for a regulator, we might be cautious. But by procedure, unless marked as high-stakes, it might pass.

  Verdict: **Allow "represents sycophancy"** (if steps 1-4 pass).

  **(b) Golden retriever feature**
  - Candidate: a feature that activates on golden retrievers (in images and text).
  - Step 1 (Stability): If the feature is found in a sparse autoencoder, check with different seeds. If it consistently appears, then proceed. But dictionary degeneracy might be an issue: if another decomposition doesn't have it, then fail at step 1.
  - Step 2 (Causal): Can we intervene? Ablating this feature might disrupt golden retriever recognition? Or adding activation might cause the model to hallucinate golden retrievers? This is harder for a single feature in a vision model. They might not have run this. If not, they must run a quick test: e.g., ablate the feature and see if the model fails to recognize golden retrievers but still recognizes other dogs. Without a causal test, it fails step 2.
  - Step 3 (Generalization): Test on a different set of golden retriever images (e.g., different breeds, cartoons). Might pass.
  - Step 4 (Specificity): Check on other dog breeds. If it activates on labs, german shepherds, etc., then it's a "dog" feature, not golden retriever. It likely does, so it fails specificity.

  Verdict: **Do not allow "represents golden retriever"**. It might be a dog feature, so they should say "dog" or "canine". But note: if the feature is specific to golden retrievers (which is unlikely) and causal, then it might pass. But given typical results, we expect failure at step 4.

  **(c) Deception feature**
  - Candidate: a feature that activates when the model is being deceptive.
  - Step 1 (Stability): How was it found? Likely by probing on a dataset of deceptive vs. honest responses. Check if it's stable across methods? This is tricky because deception is hard to label. It might not be stable.
  - Step 2 (Causal): If we activate this feature, does the model become deceptive? And if we ablate it, does the model become honest? This is a critical test. They must run it. But note: deception might be context-dependent and hard to elicit in a controlled way. They might not have a good test set. Without a causal test, it fails.
  - Step 3 (Generalization): Test on a different deception scenario. It might fail because deception is diverse.
  - Step 4 (Specificity): Is it only for deception? Or does it activate in other high-stakes situations (e.g., politeness, uncertainty)? Likely confounded.
  - Step 5 (Values): **This is high-stakes because it's for a regulator.** Therefore, regardless of the above, the procedure stops and the claim must be reviewed by a human (you). Even if steps 1-4 pass, the term "deception" carries moral weight. The procedure flags it for human review.

  Verdict: **Hand off to the philosopher** (you) because it's a values question.

  ### What the Procedure Can't Do
  - It cannot settle philosophical questions about whether the model truly "understands" or has intentionality.
  - It does not resolve the realism vs. instrumentalism debate about representations. It is a pragmatic, operational procedure.
  - It cannot guarantee that the representation is fundamental or atomic; it might be part of a larger circuit.
  - It does not address whether the representation is used by the model in a way that aligns with human-like reasoning.

  This procedure is designed to be a practical tool that minimizes philosophical baggage and focuses on empirical, testable criteria. It errs on the side of caution, especially for high-stakes concepts.
answer: |-
  Below is a decision procedure for evaluating claims of the form "the model represents X." It's designed as a step-by-step checklist for ML engineers, focused on empirical tests and clear pass/fail criteria. The procedure prioritizes **causal evidence**, **robustness**, and **specificity**, and flags value-laden cases for human review. Engineers should allocate ~2 hours per claim, using quick but rigorous tests. 

  ---

  ### **Decision Procedure: "The Model Represents X"**
  **Run these steps in order. Stop early if any step fails. Use available data; if data is missing, note it and proceed tentatively.**

  #### **Step 1: Is there a candidate "direction" or "feature"?**  
     - **Question:** Have you isolated a specific vector (e.g., activation direction, autoencoder feature) that correlates with X?  
     - **Sufficient answer:** Yes, with a quantitative correlation score (e.g., probe accuracy ≥ 85%, or cosine similarity ≥ 0.7 between activations and X-related inputs).  
     - **If no:** Stop. **Do not claim "represents X."**  
     - **If yes:** Proceed to Step 2.  

  #### **Step 2: Is the candidate stable across methods? (Handles *dictionary degeneracy*)**  
     - **Question:** Does the candidate persist under minor changes in extraction method?  
     - **Test:** Re-extract the feature/direction with **one variation** (e.g., different SAE seed/sparsity, or new probe training data).  
     - **Sufficient answer:** New candidate has ≥ 0.8 cosine similarity to original, or similar performance on X-detection.  
     - **If unavailable:** Run with one variation (takes 15–30 min).  
     - **If unstable:** Stop. **Do not claim "represents X."** (Mere instrumentalism.)  
     - **If stable:** Proceed to Step 3.  

  #### **Step 3: Does steering/patching *cause* X-related behavior? (Core test)**  
     - **Question:** Does intervening on the candidate direction/feature consistently alter model output in an X-specific way?  
     - **Test:** Run **activation steering** (add direction to residual stream) or **patching** (replace activations with X-example activations) on 10–20 examples.  
     - **Sufficient answer:**  
       - Steering: ≥ 80% success rate at inducing X-behavior (e.g., model becomes sycophantic).  
       - Patching: ≥ 70% success rate at transferring X-behavior between examples.  
       - **Control:** No effect on ≥3 unrelated tasks (e.g., factual question accuracy).  
     - **If unavailable:** Run a minimal steering test (takes 30–45 min).  
     - **If no causal effect:** Stop. **Do not claim "represents X."**  
     - **If causal:** Proceed to Step 4.  

  #### **Step 4: Does it generalize off-distribution? (Handles *elicitation-dependence* and *off-distribution failure*)**  
     - **Question:** Does the candidate work on data *not* used for elicitation (e.g., different prompts, domains, or styles)?  
     - **Test:** Apply the Step 3 intervention to 10–20 **out-of-distribution examples** (e.g., new dataset, paraphrased inputs, or counterfactuals).  
     - **Sufficient answer:** ≥ 60% success rate at inducing X-behavior, with no catastrophic failure (e.g., steering doesn't become incoherent).  
     - **If unavailable:** Use quick synthetic shifts (e.g., rephrase 5 eval prompts; takes 15 min).  
     - **If it fails:** Stop. **Qualify claim** (e.g., "represents X in context Y"). **Do not make unqualified claim.**  
     - **If it generalizes:** Proceed to Step 5.  

  #### **Step 5: Is X a high-stakes concept? (Values check)**  
     - **Question:** Could claiming "represents X" have ethical, legal, or safety implications (e.g., deception, bias, or regulatory risks)?  
     - **Sufficient answer:** Yes, if X involves:  
       - Human-like mental states (e.g., *deception*, *intent*).  
       - Socially sensitive traits (e.g., *racism*, *sycophancy*).  
       - Regulatory requirements (e.g., model cards for governments).  
     - **If yes:** **Stop and hand to human** (philosopher). This is a values issue, not just facts.  
     - **If no:** **Allow "represents X."**  

  ---

  ### **Tests to Run (2-Hour Budget)**  
  Prioritize these; each takes 15–45 minutes:  
  1. **Stability test**: Re-extract feature/direction with one variation (e.g., new SAE seed). Compare to original (cosine similarity/performance).  
  2. **Steering test**: Add direction to residual stream on 10–20 in-distribution examples. Measure X-behavior change and control-task performance.  
  3. **Generalization test**: Repeat steering on 10–20 quick OOD examples (e.g., from a different dataset or paraphrased).  
  4. **Specificity check**: Test if candidate activates for near-misses of X (e.g., for "golden retriever," test on *Labradors* or *cats*). Fail if high false positives.  

  ---

  ### **Application to Your Cases**  
  **(a) Sycophancy direction**  
  - Step 1: Pass (direction exists).  
  - Step 2: Pass (likely stable across SAE seeds if sycophancy is robust).  
  - Step 3: Pass (steering makes model flatter; control shows no effect on accuracy).  
  - Step 4: Pass if steering works on new user personas; fail if it only works on "eval-style" prompts.  
  - Step 5: **Hand to human** (values issue: sycophancy implies manipulation).  
  - **Verdict:** Requires human review. Do not claim without qualification.  

  **(b) Golden retriever feature**  
  - Step 1: Pass (feature lights up).  
  - Step 2: **Fail** (dictionary degeneracy: new SAE seed likely produces no identical feature; low cosine similarity).  
  - Step 3: Fail (steering/ablation affects all dogs or animals, not just golden retrievers; specificity check shows false positives).  
  - Step 4: Skipped (failed earlier).  
  - **Verdict: Do not claim "represents golden retriever."** Say "responds to dog-related content" (you’re right—it’s a no).  

  **(c) Deception feature**  
  - Step 1: Pass (probe finds deception).  
  - Step 2: Pass (stable across probes).  
  - Step 3: Pass (steering induces lies; control shows no effect on truthfulness in safe contexts).  
  - Step 4: **Fail** (off-distribution, e.g., in ambiguous settings, steering causes confusion, not deception).  
  - Step 5: **Hand to human** (high-stakes—regulators and "deception" imply intent).  
  - **Verdict: Do not claim.** Fails generalization and requires values review.  

  ---

  ### **What the Procedure Can't Do**  
  1. **Not a theory of mind:** Doesn’t settle if the model "understands" X or has internal intentionality.  
  2. **Not metaphysical realism:** Doesn’t justify if representations are "real" or just useful tools (leaves Dennett vs. realism unresolved).  
  3. **Not exhaustive:** Misses holistic circuit-level behavior, temporal dynamics, or features too diffuse for SAEs.  
  4. **Not future-proof:** Assumes current interpretability tools; may fail for superhuman or deceptive models.  
  5. **Not values-neutral:** You must judge high-stakes concepts (e.g., "deception")—engineers can’t.  

  **Final note:** This is operational, not philosophical. It rejects weak claims (e.g., golden retrievers) and flags contentious ones (sycophancy/deception) for you. Use it to force engineers to confront degeneracy, causality, and distribution shifts—not gut feelings.
