answer: |-
  Below is a structured procedure for evidence updating using Jeffrey's rule, tailored to your constraints. The procedure is designed for spreadsheet implementation, with clear steps for auditability. It addresses your requirements, including partition definition, rigidity checks, handling of expert estimates and uncertainty, and demarcation of theory vs judgment. The approach is illustrated with your three cases, using British English.

  ---

  ### **Jeffrey's Rule Updating Procedure**
  **Objective**: Update the probability \( P(H) \) that a pest is established, given uncertain evidence.  
  **Inputs**: Prior \( P_\text{old}(H) \), evidence description, expert inputs.  
  **Output**: Updated \( P_\text{new}(H) \) or decision to escalate.  
  **Time**: ≤30 minutes per case.  
  **Tools**: Spreadsheet with fixed templates.  
  **Key concepts**:
  - **Partition**: Mutually exclusive events (\( E_1, E_2, \dots, E_n \)) the evidence *directly* concerns (e.g., "photo shows pest", "photo does not").
  - **Rigidity**: Conditional probabilities \( P_\text{old}(H|E_i) \) must remain valid post-update. If violated, use alternative (Step 4).
  - **Headline number**: Use midpoint of band when uncertainty is irreducible.

  ---

  #### **Step-by-Step Procedure**
  **Step 1: Define Partition**  
    - **Action**: Identify what the evidence is *directly* about (e.g., a photo’s authenticity, a test’s accuracy). Define 2–3 mutually exclusive events (\( E_i \)) covering all possibilities.  
    - **Grain**: Match the evidence resolution (e.g., species-level for a clear photo; genus-level for degraded samples).  
    - **Leftover probability**: Assign to a catch-all \( E_n \) (e.g., "inconclusive" or "unknown").  
    - **Judgment call**: Partition choice (theory requires MECE events; grain is contextual).  
    - **Spreadsheet columns**: `Evidence`, `Partition Events`, `Grain Justification`.

  **Step 2: Elicit New Partition Probabilities**  
    - **Action**: Obtain \( P_\text{new}(E_i) \) from experts.  
    - **Check for double-counting**: Ensure experts do not fold in \( P_\text{old}(H) \) (e.g., ask: "If you knew nothing about regional status, how likely is \( E_i \) based *only* on this evidence?").  
    - **Handling uncertainty**: If experts give a range (e.g., "60–80%"), use the midpoint for \( P_\text{new}(E_i) \) and document bounds.  
    - **Judgment call**: Expert adjustment for bias (theory requires \( P_\text{new}(E_i) \) independent of \( H \)).  
    - **Spreadsheet columns**: \( P_\text{new}(E_i) \), `Range (if any)`, `Double-Count Check`.

  **Step 3: Obtain Base Conditionals**  
    - **Action**: Estimate \( P_\text{old}(H|E_i) \) for each \( E_i \) using pre-evidence knowledge.  
    - **Method**: Use historical data, or ask: "Before this evidence, if \( E_i \) were true, what would \( P(H) \) be?"  
    - **Consistency check**: Ensure \( \sum_i P_\text{old}(H|E_i) \cdot P_\text{old}(E_i) \approx P_\text{old}(H) \) (allow ±0.05 tolerance).  
    - **Spreadsheet columns**: \( P_\text{old}(H|E_i) \), `Source/Justification`.

  **Step 4: Rigidity Check**  
    - **Action**: Verify if evidence changes \( P_\text{old}(H|E_i) \) (e.g., if evidence updates system understanding, like a new test kit affecting reliability).  
    - **Test**: Ask: "Does this evidence alter how we interpret \( E_i \) relative to \( H \), or only the likelihood of \( E_i \)?" If yes, rigidity fails.  
    - **If rigid**: Proceed to Step 5.  
    - **If not rigid**:  
      - **Alternative**: Re-estimate \( P_\text{old}(H|E_i) \) *including* the new evidence (time-permitting), or escalate to senior epidemiologist.  
      - **Theory constraint**: Jeffrey’s rule requires rigidity; failure invalidates the update.  
    - **Spreadsheet columns**: `Rigidity Pass/Fail`, `If Fail: Action Taken`.

  **Step 5: Calculate \( P_\text{new}(H) \)**  
    - **Action**: Compute:  
      \[
      P_\text{new}(H) = \sum_i \left[ P_\text{old}(H|E_i) \cdot P_\text{new}(E_i) \right]
      \]
    - **Headline number**: If inputs had ranges, compute \( P_\text{new}(H) \) for min/max bounds and publish the midpoint. Document bounds.  
    - **Spreadsheet columns**: \( P_\text{new}(H) \), `Bounds (if any)`.

  **Step 6: Escalation Rules**  
    - **Escalate to senior epidemiologist if**:  
      - Rigidity fails and re-estimation exceeds 30 min.  
      - Partition cannot be defined (e.g., evidence is about multiple pests).  
      - \( P_\text{new}(H) \) bounds exceed 0.3 (e.g., 0.4–0.7).  
    - **Final output**: Single probability (midpoint if range) or "Escalated".  

  ---

  ### **Case Applications**
  **Case 1: Grower’s Photograph (Pathologist: 70% Confidence)**  
  - **Hypothesis \( H \)**: Pest established.  
  - **Prior \( P_\text{old}(H) \)** = 0.15 (from last week).  
  - **Evidence**: Photo of suspected pest.  
  - **Step 1: Partition**:  
    - \( E_1 \): Photo shows the pest (grain: species-level).  
    - \( E_2 \): Photo does not show the pest (catch-all: includes look-alikes/errors).  
  - **Step 2: \( P_\text{new}(E_i) \)**:  
    - Pathologist’s 70% is for \( E_1 \). Check: She confirms this is based *only* on photo morphology, not regional factors → **no double-counting**.  
    - \( P_\text{new}(E_1) = 0.70 \), \( P_\text{new}(E_2) = 0.30 \).  
  - **Step 3: Base Conditionals** (using pre-photo knowledge):  
    - \( P_\text{old}(H|E_1) \): If photo is genuine, establishment likely. Set to 0.85 (historical: true positives correlate with establishment).  
    - \( P_\text{old}(H|E_2) \): If photo is false, reverts to prior. Set to 0.15.  
    - Consistency: \( (0.85 \cdot \text{prior } E_1) + (0.15 \cdot \text{prior } E_2) \). Prior \( E_1 \) was low (\(\approx 0.01\)), so ≈ 0.15 → **pass**.  
  - **Step 4: Rigidity Check**: Evidence only affects photo validity, not interpretation of \( H|E_i \) → **rigid**.  
  - **Step 5: \( P_\text{new}(H) \)** = \( (0.85 \cdot 0.70) + (0.15 \cdot 0.30) = 0.595 + 0.045 = 0.64 \).  
  - **Publish**: **0.64** (rounded from 0.64).  

  **Case 2: Partial Sequencing Run (New Lab Kit)**  
  - **Hypothesis \( H \)**: Pest established.  
  - **Prior \( P_\text{old}(H) \)** = 0.30 (example).  
  - **Evidence**: Inconclusive sequencing from a symptomatic grower; lab upgraded kit concurrently.  
  - **Step 1: Partition**:  
    - \( E_1 \): Sequence correctly identifies pest.  
    - \( E_2 \): Sequence is incorrect (catch-all: false positive/degradation).  
  - **Step 2: \( P_\text{new}(E_i) \)**:  
    - Lab expert: 80% confident in result. Check: Confidence includes knowledge of new kit’s sensitivity → **potential double-counting** (kit sensitivity affects \( P_\text{old}(H|E_i) \)).  
    - Adjust: Ask for confidence *ignoring kit changes*. Expert revises to 65% → \( P_\text{new}(E_1) = 0.65 \), \( P_\text{new}(E_2) = 0.35 \).  
  - **Step 3: Base Conditionals**:  
    - \( P_\text{old}(H|E_1) \): If correct, strong evidence for \( H \). Set to 0.95 (established practice).  
    - \( P_\text{old}(H|E_2) \): If incorrect, prior applies. Set to 0.30.  
    - Consistency: Prior \( E_1 \) was 0.10 → \( (0.95 \cdot 0.10) + (0.30 \cdot 0.90) = 0.095 + 0.27 = 0.365 \approx 0.30 \) → **pass** (within tolerance).  
  - **Step 4: Rigidity Check**: New kit affects test reliability; same evidence updates \( P_\text{old}(H|E_i) \) → **not rigid**.  
    - **Alternative**: Re-estimate \( P_\text{old}(H|E_1) \) including kit data. Pathologist: New kit reduces false negatives, so \( P_\text{old}(H|E_1) \) increases to 0.98. \( P_\text{old}(H|E_2) \) remains 0.30.  
  - **Step 5: \( P_\text{new}(H) \)** = \( (0.98 \cdot 0.65) + (0.30 \cdot 0.35) = 0.637 + 0.105 = 0.742 \).  
  - **Publish**: **0.74** (unwelcome but procedure-compliant).  

  **Case 3: Three Soft Items**  
  - **Hypothesis \( H \)**: Pest established.  
  - **Prior \( P_\text{old}(H) \)** = 0.20 (example).  
  - **Evidence**:  
    - (a) Press report (neighbouring country).  
    - (b) Degraded trap specimen (genus-level ID).  
    - (c) No findings in 200 traps.  
  - **Handling multiple evidence**: Update sequentially (order: a → b → c).  
    - **Item (a): Press Report**  
      - **Partition**: \( E_1 \): Report accurate; \( E_2 \): Report inaccurate.  
      - \( P_\text{new}(E_1) = 0.60 \) (expert: machine translation uncertain).  
      - \( P_\text{old}(H|E_1) = 0.50 \) (if true, increases risk); \( P_\text{old}(H|E_2) = 0.20 \).  
      - **Rigid**: Yes.  
      - **Interim \( P(H) \)** = \( (0.50 \cdot 0.60) + (0.20 \cdot 0.40) = 0.30 + 0.08 = 0.38 \).  
    - **Item (b): Trap Specimen**  
      - **Partition**: \( E_1 \): Specimen is pest; \( E_2 \): Specimen is not pest.  
      - \( P_\text{new}(E_1) = 0.30 \) (genus-level ID).  
      - \( P_\text{old}(H|E_1) = 0.90 \); \( P_\text{old}(H|E_2) = 0.38 \) (prior = interim \( P(H) \)).  
      - **Rigid**: Yes.  
      - **Interim \( P(H) \)** = \( (0.90 \cdot 0.30) + (0.38 \cdot 0.70) = 0.27 + 0.266 = 0.536 \).  
    - **Item (c): Negative Traps**  
      - **Partition**: \( E_1 \): Pest present but undetected; \( E_2 \): Pest absent.  
      - \( P_\text{new}(E_1) = 0.40 \) (expert: traps not exhaustive); \( P_\text{new}(E_2) = 0.60 \).  
      - \( P_\text{old}(H|E_1) = 0.536 \) (if present, interim \( P(H) \) applies); \( P_\text{old}(H|E_2) = 0 \) (if absent, \( H \) false).  
      - **Rigid**: No (evidence updates detection reliability).  
      - **Alternative**: Escalate (time constraint).  
  - **Escalation**: Senior epidemiologist sets \( P_\text{new}(H) = 0.45 \) based on overall weight.  
  - **Publish**: **0.45** (after escalation).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Non-independent evidence**: Sequential updates assume independence; correlated evidence risks bias.  
  2. **Systemic changes**: E.g., new lab kits require re-estimating conditionals (judgment-heavy).  
  3. **High uncertainty**: Bands >0.3 require escalation; no probabilistic synthesis.  
  4. **Ambiguous partitions**: Escalation needed if grain cannot match evidence (e.g., genus-level when species is critical).  
  5. **Non-rigid alternatives**: Re-estimation is subjective; no formulaic backup.  

  ### **Key for External Reviewers**  
  - **Theory-constrained steps**: Partition (MECE), rigidity check, double-counting check, consistency formula.  
  - **Judgment calls**: Partition grain, \( P_\text{old}(H|E_i) \) estimation, rigidity failure workaround, expert adjustments.  
  - **Audit trail**: Spreadsheet documents all inputs, checks, and rationale.  

  This procedure balances rigor with pragmatism, ensuring defensible updates within your constraints. Use the spreadsheet template [provided separately] for consistency.
