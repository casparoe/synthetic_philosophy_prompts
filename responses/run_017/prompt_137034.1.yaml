  First, I need to understand the core positions. The tradition realist emphasizes historical continuity and internal disputes as part of what defines Western values - it's genealogical with causal connections between institutions and ideas. The coalition theorist sees it as semantically thin, politically real - a tool for alliance-building where content shifts based on opposition. Both agree the phrase has political weight but fundamentally disagree on its nature.

