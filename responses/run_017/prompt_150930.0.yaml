  Hume's core arguments are: miracles violate natural laws established by uniform experience, testimony must be weighed against this prior probability, and competing miracle claims cancel each other out. The challenge is translating these into plausible bureaucratic procedures without breaking character.

  I'll invent the Office of Uniform Experience (OUE) as the regulating body. Key elements to include:
  - The Ordinary Course Ledger as the ultimate authority on natural regularities
  - The Miracle Exception Threshold balancing test that's nearly impossible to pass
  - The Competing Miracles Desk handling contradictory claims
  - A bias-training section on human credulity

  For the sample documents, I'll show a denied resurrection claim to demonstrate standard rejection reasons. Then a borderline case - perhaps someone reporting their toaster floating during an earthquake - where the improbability of coordinated fraud almost meets the threshold. The humor comes from treating these with absolute bureaucratic seriousness.

  The tone must remain consistently dry and procedural. Phrases like "empirically sound governance" and "evidentiary calibration" will sell the parody. The deeper critique should emerge organically: that this system makes miracle acceptance practically impossible by design, which the memo presents as virtuous reliability.

  I'll structure it like a real guidance document: definitions first, then procedures, examples, and finally compliance reminders. The annotations on sample forms will visually demonstrate how the rules lead to automatic rejection. The ending should imply the system is working perfectly because nothing ever qualifies.
answer: |-
  ## Evaluating Miracle Petitions: Guidance for Caseworkers
  **Issuing Authority:** Office of Uniform Experience (OUE), Bureau of Evidential Calibration
  **Effective Date:** Perpetual
  **Supersedes:** All prior guidance inconsistent with *Hume v. Nature (1748)*
  **Distribution:** All OUE Caseworkers, Levels I-IV

  **1. Purpose and Scope:** This guidance provides standardized procedures for the evaluation of submitted Miracle Petitions (Form OUE-MP/01). It establishes the operational framework mandated by the Uniform Experience Act (UEA), ensuring consistent, evidence-based adjudication in accordance with empirically sound governance principles. All determinations must reflect the proportional relationship between belief and evidence as defined by statutory precedent.

  **2. Key Definitions (UEA §5):**
  *   **Miracle:** An event reported to have occurred that contradicts one or more established Laws of Nature.
  *   **Law of Nature:** A description of the constant, unbroken, and invariable sequence of events observed throughout uniform human experience. Examples include, but are not limited to: Gravitational Constancy (Objects fall downwards), Biological Termination (Dead organisms remain deceased), Elemental Stability (Water maintains H₂O composition under standard conditions), Morphological Consistency (Wooden implements do not spontaneously become serpents).
  *   **Uniform Experience:** The aggregate totality of predictable, repeatable observations constituting reality. Quantified and maintained in the **Ordinary Course Ledger (OCL)**.
  *   **Reasonable Person:** The standard epistemic agent who proportionates belief strictly to the weight of available evidence, privileging established regularities over singular testimonial claims.
  *   **Miracle Petition (MP):** The formal request (OUE-MP/01) seeking official OUE recognition of a reported event as a Miracle.
  *   **Testimonial Evidence:** Statements provided by witnesses attesting to the occurrence of the reported event. Classified by source reliability, number, proximity, and corroborative potential.

  **3. Foundational Principle: The Ordinary Course Ledger (OCL)**
  *   The OCL is the OUE's central repository, dynamically updated with verified instances of regular, unexceptional occurrences (e.g., sunrise events: 1,576,423,901 confirmed; human resurrections: 0 confirmed).
  *   **Function:** The OCL establishes the overwhelming *prior probability* against any event contradicting a Law of Nature. This prior constitutes the baseline against which all testimony must be evaluated.
  *   **Caseworker Action:** For any MP, identify the specific Law(s) of Nature allegedly contradicted. Consult the relevant OCL entry to quantify the established prior probability against the event's occurrence. **This prior is presumed definitive absent extraordinary countervailing evidence.**

  **4. Core Adjudication Procedure: The Balancing Test & Miracle Exception Threshold (MET)**
  *   **Principle:** Testimony can only establish a Miracle if the *falsehood of that very testimony* would constitute an event *even more* contrary to uniform experience (as recorded in the OCL) than the Miracle being reported.
  *   **Calculation:** Caseworkers must perform a comparative improbability assessment:
      1.  **Improbability of the Event (Ie):** Derived directly from the OCL prior. Near-maximum for any Law of Nature violation (e.g., Ie(Resurrection) ≈ 1.0).
      2.  **Improbability of Testimony Being False (Itf):** Assess the likelihood that *all* witnesses are either deceiving or profoundly deceived *in this specific instance*. Consider witness number, independence, character, competence, contemporaneity, corroboration (or lack thereof), and potential motives for fabrication or error (See Section 6: Bias Mitigation).
  *   **The Miracle Exception Threshold (MET):** An MP is **approved** ONLY if:
      `Itf > Ie`
      In practical terms: The testimony must be so inherently reliable that its falseness would be a *greater* violation of natural regularity than the miracle itself.
  *   **Practical Note:** Historical OUE data indicates the MET clearance rate is 0.00017%. The OCL prior (Ie) is exceptionally high for any Law of Nature violation. Simultaneously, testimonial evidence (Itf) is intrinsically vulnerable to the factors outlined in Section 6. Therefore, establishing `Itf > Ie` is operationally improbable. **This outcome reflects the robustness of uniform experience, not a procedural flaw.**

  **5. Special Procedure: The Competing Miracles Desk (CMD)**
  *   **Scenario:** When two or more MPs are submitted concerning events that are mutually exclusive or logically incompatible (e.g., Claim A: Deity X caused Statue Y to weep; Claim B: Deity Z caused Statue Y to weep, precluding X's involvement; or Claim C: Prophet P resurrected; Claim D: Prophet P remained deceased, per rival tradition).
  *   **Procedure:** Forward all incompatible petitions to the CMD.
  *   **Adjudication Logic:** The testimonial evidence supporting each claim directly undermines the reliability of the testimonial evidence supporting the incompatible claim(s). The existence of strong, contradictory testimonies demonstrates the inherent capacity for human groups to generate compelling yet incompatible narratives about extraordinary events.
  *   **Outcome:** The competing testimonies effectively cancel each other out (`Itf` for each claim is drastically reduced). Consequently, `Itf` for *any* individual claim falls significantly below its `Ie`. **All petitions involved are categorically denied.** This preserves epistemic neutrality and prevents the OUE from arbitrating insoluble theological disputes.

  **6. Bias Mitigation: Assessing Testimonial Reliability (Mandatory Training Module REF: OUE-HR-BIAS/07)**
  Caseworkers must remain vigilant against inherent cognitive and sociological factors inflating perceived `Itf` values. These are neutral observations about human information processing, not value judgments:
  *   **Wonder-Seeking Bias:** Humans exhibit a documented preference for surprising, marvelous, or transcendent narratives (OCL Ref: FOLK-NARR/034). This increases susceptibility to accepting and propagating extraordinary claims without sufficient scrutiny.
  *   **Credulity Gradient:** Reliability of testimony decreases as a function of:
      *   **Temporal Distance:** Events reported long after occurrence are vulnerable to narrative accretion and distortion (OCL Ref: HIST-RECORD/012).
      *   **Geographical/Cultural Distance:** Reports originating in unfamiliar cultures or distant locations are harder to verify and more prone to misunderstanding or exoticization (OCL Ref: CROSS-CULT/008).
      *   **Emotional Arousal:** Events involving high emotion (ecstasy, terror, grief) correlate with decreased perceptual and memorial accuracy among witnesses (OCL Ref: COG-PERCEP/019).
  *   **Social Conformity Pressure:** Individuals within cohesive groups may report experiences aligning with group expectations, even absent direct perception, due to affiliation needs or perceived authority (OCL Ref: GROUP-DYNAM/025).
  *   **Caseworker Action:** Systematically factor these biases into the `Itf` calculation. High scores on these risk factors necessitate a significant downward adjustment of the provisional `Itf` score derived from witness numbers or apparent sincerity.

  **7. Sample Petition & Adjudication**

  **Petition OUE-MP/01-467901:**
  *   **Event Reported:** Resurrection of a human male ("J. of Nazareth") approximately three days post-mortem (certified crucifixion). Multiple witness reports, including close associates.
  *   **Contradicted Law(s) of Nature:** Biological Termination (OCL Ref: BIO-TERM/001; Prior Count: ~117 Billion instances).
  *   **Provisional Ie:** ≈ 1.0 (Maximum improbability).
  *   **Testimonial Evidence Assessment:**
      *   Witnesses: Primary sources are associates of the deceased ("Apostles"). Number: ~12 core. Later reports increase.
      *   Independence: Low (Close-knit group with shared beliefs/investment in the movement).
      *   Contemporaneity: Reports documented decades post-event. (Temporal Distance: High Risk - Adjust Itf down).
      *   Corroboration: Minimal contemporaneous non-partisan documentation. (Corroboration: Low - Adjust Itf down).
      *   Cultural Context: Occurred within a culture expressing strong apocalyptic/messianic expectations (Wonder-Seeking/Cultural Bias: High Risk - Adjust Itf down).
      *   Motive: Witnesses faced persecution; however, OCL notes martyrdom occurs for sincerely held *beliefs*, not necessarily *facts* (SOC-PERSEC/005). Sincerity ≠ Accuracy.
  *   **Calculated Itf:** Adjusted downward significantly due to risk factors. Estimated <<< 0.5.
  *   **Balancing Test (MET):** `Itf (<<<0.5) < Ie (≈1.0)`
  *   **Determination: DENIED.** The falseness of the testimony, while improbable in certain aspects, remains vastly *less* improbable than a violation of Biological Termination given the OCL prior. The testimony's reliability is insufficiently calibrated to overcome the overwhelming weight of uniform experience.

  **8. Borderline Case: Illustrative Near-Miss (OUE-MP/01-634822 - STATUS: PENDING/UNRESOLVABLE)**
  *   **Event Reported:** Spontaneous levitation of a standard household toaster (Model: "ToastMaster 2000") for 37 seconds during a minor localized seismic tremor (Richter 2.1) in Reykjavik, Iceland. Reported by 7 independent neighbors via security camera footage (time-stamped, verified unaltered).
  *   **Contradicted Law(s) of Nature:** Gravitational Constancy (OCL Ref: GRAV-CONST/001; Prior Count: Effectively continuous).
  *   **Provisional Ie:** ≈ 1.0 (Standard).
  *   **Testimonial Evidence Assessment:**
      *   Witnesses: 7 independent adults, no prior association. Corroborated by multiple synchronized, unaltered video feeds from different angles.
      *   Independence: High.
      *   Contemporaneity: Immediate reporting, real-time recording.
      *   Corroboration: Exceptionally high (Multiple technical recordings).
      *   Context: Secular, technologically advanced society. No discernible cultural/religious motive. Event brief, localized. Seismic activity noted but causal link unproven.
      *   Bias Risk: Low-Medium (Unusual event may induce perceptual error, but recording mitigates).
  *   **Calculated Itf:** Very High (Est. >0.99). The coordinated falsehood of 7 independent witnesses *and* the simultaneous, undetected manipulation of multiple security systems would constitute an event arguably *more* contrary to regular experience (re: human honesty, technical reliability) than a brief localized gravitational fluctuation coinciding with seismic activity.
  *   **Balancing Test (MET):** `Itf (>0.99) >? Ie (≈1.0)` **Marginal potential clearance.**
  *   **Challenge:** OCL lacks sufficient precedent for brief, localized gravity anomalies coinciding with minor tremors. Is this a *true* violation of Gravitational Constancy, or merely an extreme statistical outlier within known physics? Requires consultation with OUE Physics Liaison (Vacant since 1952). **Determination: INDEFINITELY PENDING.** Illustrates the theoretical possibility of MET clearance: only an event whose testimonial disproof would be *even more* miraculous than the event itself, supported by near-irrefutable evidence, could potentially qualify. Such instances are vanishingly rare.

  **9. Compliance and Review:**
  Caseworkers must adhere strictly to these procedures. All determinations require Level III Supervisor review. Remember: The consistent denial of Miracle Petitions is not a failure of the system, but a validation of the OCL's comprehensive mapping of uniform experience. Our mandate is the maintenance of evidentiary calibration in the public interest, ensuring belief remains proportionately grounded. Questioning the completeness of the OCL or the foundational principles of the UEA falls outside OUE purview.

  **// END GUIDANCE //**
