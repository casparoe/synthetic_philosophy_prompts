     → *B2b1 leads to Leaf 1; B2b2 leads to Leaf 2.*  

  ### Leaves  
  1. **Evidence-fixed invariantism (low fixed bar):** Knowledge is fixed by evidence and truth; action thresholds move.  
     - *Awkward commitment:* "Knowing" low-stakes trivia (e.g., a report) requires the same evidence as high-stakes decisions (e.g., payments), which feels underdemanding.  
     - *Paging threshold:* Action threshold moves with stakes; "knows" is static. Engineers set thresholds based on cost of error.  
  2. **High fixed invariantism (high fixed bar):** Knowledge requires overwhelming evidence, ignoring stakes.  
     - *Awkward commitment:* Demands excessive evidence even for trivial decisions, causing alert fatigue.  
     - *Paging threshold:* Fixed high bar; "knows" is static. Threshold set by evidence quality alone, not engineers.  
  3. **Attributor-sensitive encroachment:** Knowledge threshold moves with the attributor’s/assessor’s stakes.  
     - *Awkward commitment:* A shadow observer with identical evidence might deny knowledge while you affirm it, purely due to differing stakes.  
     - *Paging threshold:* Moves with the on-call’s stakes; "knows" changes meaning. Threshold set by whoever views the dashboard.  
  4. **Subject-sensitive encroachment:** Knowledge threshold moves with the subject’s stakes at evidence time.  
     - *Awkward commitment:* If stakes change post-evidence (e.g., a bet), knowledge doesn’t update, making retrospective assessment disjointed.  
     - *Paging threshold:* Moves with the subject’s stakes; "knows" changes. Engineers pre-configure thresholds per service criticality.  
  5. **Salience contextualism:** Knowledge depends on which error possibilities are salient (e.g., spoofed telemetry).  
     - *Awkward commitment:* An auditor’s hypothetical can retroactively negate knowledge by making errors salient, even if no one considered them initially.  
     - *Paging threshold:* Moves with salient risks; "knows" changes. Threshold set by context (e.g., incidents raise salience).  
  6. **Relativism:** Truth of "knows" varies with the assessor (e.g., you vs. shadow observer).  
     - *Awkward commitment:* Conflicting knowledge attributions (e.g., "I knew" vs. "you didn’t know") can simultaneously hold.  
     - *Paging threshold:* Meaningless globally; each assessor (human/bot) has their own "knows." Threshold set locally per attributor.  
  7. **Contrastivism:** Knowledge is relative to specific alternatives (e.g., "lag vs. normal" vs. "lag vs. spoofing").  
     - *Awkward commitment:* "Knows" fractures into context-dependent meanings (e.g., "knew for report purposes but not for payments").  
     - *Paging threshold:* Moves with the contrast class; "knows" changes. Engineers define thresholds per decision alternative.  
  8. **Graded knowledge:** Knowledge is degree of confidence above a threshold.  
     - *Awkward commitment:* Replaces "knows" with scalar confidence (e.g., "60% known"), clashing with binary action (page/don’t page).  
     - *Paging threshold:* Fixed confidence cut-off; "knows" is graded. Engineers set the cut-off, decoupled from stakes.  

  ### Empty cells and collisions  
  **Empty cells:**  
  - **Post-evidence stakes shift without subject/attributor alignment (Node 2 A1 + Node 3 lacking subject option):** Unoccupied. Diagnosed as *incoherent*—subject stakes can’t apply retroactively if evidence is fixed, yet attributor stakes ignore the subject’s context.  
  - **Fixed threshold with truth varying by context but not assessor (Node 7 B2a2):** Unoccupied. Diagnosed as *unexplored*—combines invariant evidence with context-relativity but avoids assessor-relativity; no clear operational analogue.  
  - **Salience contextualism in high-stakes-only actions (Node 5 B1 for payments-only):** Unoccupied. Diagnosed as *merely unattractive*—salience should affect all decisions, not just high-stakes, making it overbroad.  

  **Collisions (unseparable pairs):**  
  - **Graded knowledge (Leaf 8) vs. Evidence-fixed invariantism (Leaf 1):** Both answer Node 8 B2b1 identically. Tree can’t distinguish them without asking "Is knowledge on/off or a scale?"—but such direct questions are banned.  
  - **Subject-sensitive (Leaf 4) vs. Attributor-sensitive (Leaf 3) in static stakes:** Identical when stakes don’t change (e.g., no retrospective or shadow observer). Tree relies on Node 3 to split them, but if stakes are stable, they collapse.  

  ### Where this breaks  
  **Load-bearing node:** Node 1 (stakes sensitivity) is critical—it splits the tree into practical-factor-sensitive (A) and -insensitive (B) worlds. If engineers reject the stakes/evidence distinction (e.g., "action is knowledge"), the tree fractures.  
  **Forcing rebuild:** An argument that "knowing" is *always* action-dependent (e.g., "no knowledge without actionable intent") would collapse Leaves 1, 2, 8 into one. Cases like the read-only shadow observer (identical evidence, no action) challenge this.  
  **Order artifact:** Node 5 (auditor’s spoofing) assumes salience is independent of stakes. If salience is *driven* by stakes (e.g., incidents make errors salient), Node 5 becomes ambiguous, muddying Leaves 5 and 3.  
  **Likely breakdown:** Node 3 (retrospective stakes) forces a choice between attributor/context factors. But if stakes are shared (e.g., team-wide severity budget), A1a/A1b blur, making Leaf 3 and 5 hard to distinguish.
