  ### The tree  
  1. **When the same evidence (e.g., replication-lag reading) is used for both a low-stakes decision (weekly report) and a high-stakes decision (payments failover), does the confidence threshold required for the system to "know" the proposition (e.g., "lag is critical") change?**  
     - A: Yes, the threshold for knowing moves with the stakes.  
     - B: No, the threshold for knowing is fixed; only the action (e.g., paging) changes.  
     → *If A, go to 2; if B, go to 5.*  

  2. **(From A) If the stakes rise after the evidence is fixed and without re-checking (e.g., due to a silly bet), does the threshold for "knowing" retroactively change?**  
     - A1: Yes, the threshold shifts even after evidence is locked.  
     - A2: No, only stakes at evidence-gathering time matter.  
     → *If A1, go to 3; if A2, go to 4.*  

  3. **(From A1) In a retrospective, when assessing whether an engineer knew p at time T (when stakes were low for them but high for a colleague), whose stakes determine if they "knew"?**  
     - A1a: The attributor’s/assessor’s stakes (e.g., the reviewer’s).  
     - A1b: The context’s stakes (e.g., which errors are salient).  
     → *A1a leads to Leaf 3; A1b leads to Leaf 5.*  

  4. **(From A2) Leaf: Subject-sensitive encroachment.**  

  5. **(From B) If an auditor raises a scenario where all telemetry is systematically spoofed (sensor unchanged), does this affect whether we "knew" p at the time?**  
     - B1: Yes, because it highlights error possibilities.  
     - B2: No, the evidence itself hasn’t changed.  
     → *B1 leads to Leaf 5; if B2, go to 6.*  

  6. **(From B2) During an incident (high stakes), an engineer says "I don’t know" about p. Later, in a low-stakes standup, they say "I knew all along." Can both be true?**  
     - B2a: Yes, due to context shift.  
     - B2b: No, at least one is false.  
     → *If B2a, go to 7; if B2b, go to 8.*  

  7. **(From B2a) Could "S knew p at time T" be true for you but false for a read-only shadow observer (identical evidence, no action)?**  
     - B2a1: Yes, truth varies by assessor.  
     - B2a2: No, truth is context-sensitive but assessor-invariant.  
     → *B2a1 leads to Leaf 6; B2a2 leads to Leaf 7.*  

  8. **(From B2b) In a case with enormous stakes where being wrong wouldn’t change your action, do you need more evidence to "know"?**  
