prompt: |-
  hey — I'm on the grants committee of a small-ish foundation: ~30 grants a year, spread across education, public health and the arts. We meet monthly, six or so proposals a session, two hours total, and every decision needs a short written rationale that the board signs off on and that we can also send to the applicants we turn down. No analyst, no modelling, and we forget what we decided by March, so it needs to be stable across meetings.

  I want a procedure, not a lecture. Half our meetings derail the same way: someone says two proposals are "just different, you can't compare them," someone else says we obviously have to compare them, and we end up arguing about whether the money does more good in a classroom or a clinic. I've been reading a bit about incommensurable values and hard choices — the idea that some options are neither better nor worse nor equally good but on a par, and that in those cases there's nothing further to discover and what you do instead is put yourself behind one of them. Turn that into steps we can run in the room:

  - which question comes first, and what counts as a good enough answer to move on
  - how we tell apart (a) our numbers are just too crude to see a real difference, (b) we're uncertain about what will actually happen, (c) the values really don't share a common measure, and (d) the options are on a par
  - where the procedure stops with a no, and where it hands the rest back to us because it's a values call rather than a factual one
  - what the written rationale should say when there is no decisive reason, since the board won't accept "we felt like it"

  One thing I've started doing on my own that I want you to either build in or tell me is confused: I ask whether I could defend either outcome to the board three years from now. If yes, I treat it as a hard choice; if no, I assume we've framed it wrong. Call it the retrospective symmetry test if you like.

  Then run the whole thing on three cases: a literacy program vs. making a museum accessible, same price; two nearly identical public-health proposals where one scores marginally better but the other has a champion on our board; and a tiny arts organisation we all love vs. a boring, highly cost-effective health intervention. I suspect the procedure says something I don't want to hear on that last one — say it plainly. And mark clearly which steps are judgement calls dressed up as procedure.
reasoning: |-
  We are designing a decision procedure for a grants committee that faces incommensurable values and hard choices. The goal is to have a clear, step-by-step process that avoids derailment and produces stable, defensible rationales.

  Key challenges:
  1. Comparing proposals across different domains (education, public health, arts).
  2. Distinguishing between different types of reasons for not having a clear winner (measurement limitations, uncertainty, incommensurable values, or parity).
  3. Providing a written rationale that the board will accept even when there's no decisive reason.

  The procedure should incorporate the user's "retrospective symmetry test": if either outcome could be defended to the board in three years, then it's a hard choice and the options are on a par.

  Steps of the Procedure:

  1. **Initial Alignment (5 minutes per proposal)**
     - Each proposal is presented briefly (if not already done in pre-read) focusing on: 
       - The problem it addresses.
       - The intended outcomes and how they align with the foundation's mission.
       - The cost and the expected scale of impact (if quantifiable).
     - Clarifying questions only (no debate).

  2. **Individual Scoring and Notes (10 minutes)**
     - Each committee member privately scores each proposal on two dimensions (scale 1-5, with clear criteria):
       a. **Impact Potential**: How significant is the expected positive change? (Consider: magnitude, reach, sustainability, and alignment with foundation priorities.)
       b. **Confidence in Success**: How confident are we that the project will achieve the intended outcomes? (Based on track record, evidence, and feasibility.)
     - Also, note any qualitative factors (e.g., innovation, equity considerations, board champion) that are not captured in the scores.

  3. **Aggregate and Compare Scores (15 minutes)**
     - The facilitator (or a designated person) aggregates the scores and displays the average for each proposal on a two-axis grid (Impact Potential vs. Confidence).
     - Proposals are then grouped by quadrant (high/high, high/low, etc.). 
     - Identify any pair that is close in the aggregate scores (e.g., within 0.5 points on either axis). These are candidates for being "on a par".

  4. **Discrimination Test (10 minutes per close pair)**
     For each close pair:
     - Check if the small difference is due to **measurement limitations** (a) or **uncertainty** (b):
       - (a) Measurement Limitations: Are we using the same criteria for both? If not, recalibrate (e.g., if one is art and one is health, are we using domain-appropriate impact measures?).
       - (b) Uncertainty: Is there key information missing that, if obtained, would break the tie? If so, table the decision and request more data.
     - If neither (a) nor (b) applies, then consider whether the values are **incommensurable** (c) and thus the options are **on a par** (d).

  5. **Parity Test (5 minutes per pair)**
     - Apply the retrospective symmetry test: "Could we defend either choice to the board in three years?" 
       - If yes, then the options are on a par. The committee must then choose based on a secondary criterion (see step 6).
       - If no, then revisit step 4 to see if it's actually a case of uncertainty or measurement limitation.

  6. **Tie-Breaking for On-Par Options (5 minutes per pair)**
     - When options are on a par, use a predetermined tie-breaking criterion. The committee should agree on this criterion in advance (at the start of the year). Examples:
       - Prefer the proposal that addresses an underfunded area.
       - Prefer the proposal that is more innovative.
       - Prefer the proposal that has a board champion (but note: this must be declared at the start of the year as a valid tie-breaker to avoid bias).
       - Rotate priority by domain (e.g., this month we prioritize arts, next month education) to ensure fairness over time.
     - If no tie-breaker is predetermined, then a quick vote (with the rationale that the tie-breaker is a values call).

  7. **Decision and Rationale (5 minutes per proposal)**
     - For each proposal, the rationale should clearly state:
       - The strengths of the proposal (impact and confidence).
       - Why it was chosen or not chosen compared to others.
       - In the case of a tie-breaker: "After careful consideration, the proposals were found to be of comparable merit. The final decision was made based on [tie-breaking criterion] because [brief reason]."
     - If a proposal is rejected due to low scores, state that clearly.
     - If a proposal is rejected because it was on a par with a chosen one and lost in the tie-breaker, explain that.

  8. **Documentation and Stability**
     - Maintain a decision log that includes the scores, the tie-breaking criteria used, and the rationale. This log should be referred to in future meetings to ensure consistency.

  Now, applying this procedure to the three cases:

  **Case 1: Literacy program vs. making a museum accessible (same price)**

  - Step 1: Both proposals are presented.
  - Step 2: Members score each on impact and confidence.
  - Step 3: Suppose the literacy program scores 4.2 impact, 4.0 confidence. The museum accessibility scores 4.0 impact, 4.3 confidence. They are close (within 0.5).
  - Step 4: Check if the difference is due to measurement limitations. Are we comparing apples to oranges? Yes, because one is education and the other is arts. But the foundation values both. We cannot easily convert literacy gains to accessibility gains. This suggests incommensurable values.
  - Step 5: Retrospective symmetry test: Could we defend either in three years? Yes. So they are on a par.
  - Step 6: Use the tie-breaker. Let's assume the committee has a rotating domain priority. If this month is education, then literacy wins. If arts, then museum wins. Alternatively, if the tie-breaker is innovation, then the museum project might be more innovative in its approach.
  - Rationale: "Both proposals demonstrated high potential impact and strong confidence in success. The literacy program would improve reading skills in underserved schools, while the museum accessibility project would expand cultural participation for people with disabilities. Given the parity in merit and the foundation's commitment to both areas, the decision was made based on [tie-breaking criterion]."

  **Case 2: Two nearly identical public-health proposals, one marginally better but the other has a board champion**

  - Step 2: Proposal A: impact 4.5, confidence 4.5. Proposal B: impact 4.6, confidence 4.6. But the difference is 0.1, which is within 0.5.
  - Step 4: Check for measurement limitations. Since they are in the same domain, we are using the same criteria. The difference is very small. Is it due to uncertainty? Maybe. But if we cannot reduce the uncertainty, then we proceed.
  - Step 5: Retrospective symmetry test: Could we defend either? Yes, because the difference is negligible.
  - Step 6: Now, the tie-breaker: if the committee has predetermined that board champion is a valid tie-breaker (with disclosure and only when the proposals are on a par), then Proposal B (with the champion) wins. But note: having a board champion should not influence the scoring. It is only a tie-breaker. If the tie-breaker is not predetermined, then the marginally better one (A) should win, unless the committee has another tie-breaking rule.
  - Rationale: "Both proposals were strong and very close in merit. Proposal A had a slight edge in the initial scoring, but the difference was not significant. The foundation values the engagement of its board members and has a policy of using board advocacy as a tie-breaker when proposals are otherwise equivalent. Therefore, Proposal B was selected."

  **Case 3: Tiny arts organisation we all love vs. a boring, highly cost-effective health intervention**

  - Step 2: Arts: impact 3.0 (because small scale), confidence 4.0 (because they have a good track record). Health: impact 4.8 (large scale, proven intervention), confidence 4.5.
  - Step 3: The health proposal is clearly in a higher quadrant (high impact, high confidence) than the arts proposal (medium impact, high confidence). The difference in impact is 1.8, which is significant.
  - Step 4: This is not a close call. The health proposal is objectively better by the foundation's criteria (impact and confidence). The fact that the arts organization is loved is a qualitative factor that should have been noted in step 2, but it doesn't override the large difference in impact.
  - Step 5: The retrospective symmetry test: Could we defend choosing the arts organization? Only if we can argue that the foundation places a very high priority on supporting small arts organizations, but that should be reflected in the impact score. If the foundation's mission equally weights arts and health, then the health intervention's impact is much larger. The answer is: we could not easily defend the arts organization in three years when the health intervention would have saved lives or significantly improved health for many. Therefore, they are not on a par.
  - Decision: Reject the arts proposal and fund the health intervention.
  - Rationale: "The health intervention demonstrated a significantly higher impact potential and strong confidence in success, making it the clear choice based on our criteria. While the arts organization is valued and has a strong track record, its impact is on a smaller scale. Given the foundation's limited resources, we must prioritize proposals with the greatest potential for positive change."

  Marking the judgment calls:

  - Step 2: Scoring impact and confidence is a judgment call, but the criteria are set.
  - Step 4: Deciding whether the difference is due to measurement limitations or uncertainty is a judgment call.
  - Step 5: The retrospective symmetry test is a judgment call (but a structured one).
  - Step 6: Choosing the tie-breaker in advance is a values call, but the application of the tie-breaker is procedural.

  This procedure should help the committee move forward without derailment and produce rationales that the board will accept.
answer: |-
  Below is a step-by-step decision procedure designed for your grants committee. It's built to handle incommensurable values ("apples vs. oranges" debates), incorporate your retrospective symmetry test, and output defensible written rationales. The procedure is structured as a flowchart-style checklist for meetings, with clear exit points for "no" decisions and handoffs to judgment calls. I'll first outline the steps, then run your three cases, and finally flag the judgment calls disguised as procedure.

  ---

  ### **Grant Decision Procedure: Step-by-Step**
  **Time Allocation:** Designed for 2-hour sessions (6 proposals). Adjust per-proposal time as needed.  
  **Core Principle:** When values are incommensurable (e.g., education vs. health impact), options are "on a par" – no "better" exists, so you pick via tiebreakers, not debate.  
  **Key Tools:**  
  - **Retrospective Symmetry Test (RST):** "Could we defend either outcome to the board in 3 years?" If yes, treat as "on a par."  
  - **Score Thresholds:** Impact (1–5 scale) and Confidence (1–5 scale). Differences <0.5 = "too close to call."  

  #### **Step 1: Pre-Meeting Prep (Done Beforehand)**  
    - **Action:** Staff compiles proposals into a standardized template:  
      - Problem statement, target beneficiaries, expected outcomes.  
      - Cost per beneficiary (if calculable).  
      - Alignment with foundation goals (rated 1–5 by staff).  
    - **Output:** Packet sent 72h in advance. No discussion yet.  
    - **Exit Point:** Proposals missing key data (e.g., budget, outcomes) are rejected. Rationale: "Insufficient information for evaluation."  

  #### **Step 2: Individual Scoring (10 min total)**  
    - **Action:** Each member scores all proposals privately on:  
      - **Impact Potential (1–5):** Significance of change if successful (scale: 1 = minimal, 5 = transformative).  
      - **Confidence (1–5):** Likelihood of success (scale: 1 = high risk, 5 = evidence-backed).  
    - **Rule:** No discussion until scoring done. Gut feelings allowed but must be scored.  
    - **Output:** Scores collected and averaged by facilitator.  

  #### **Step 3: Factual Filter (15 min)**  
    - **Action:** For each proposal, ask:  
      1. **"Is Impact Potential ≥3 AND Confidence ≥3?"** If no, reject.  
      2. **"Is cost per beneficiary ≤X?"** (Set X annually; e.g., $500). If no, reject.  
    - **Rationale for Rejection:** "Low projected impact/confidence" or "Excessive cost per beneficiary."  
    - **Exit Point:** Proposals failing here are out. No debate.  

  #### **Step 4: Comparison Test (20 min)**  
    - **Action:** For surviving proposals, compare averaged scores:  
      - If |Impact A - Impact B| ≥ 0.5 AND |Confidence A - Confidence B| ≥ 0.5 → **Declare a "clear winner."**  
      - If scores differ by <0.5 on either axis → Flag as "close call" for **Tiebreak Analysis (Step 5).**  
    - **Crucial Question:** "Is this difference **driven by conflicting values** (e.g., classroom vs. clinic) or **fixable uncertainty**?" Use:  
      - **Diagnostic Quiz (for close calls):**  
        - *(a) Measurement Crudeness:* "Would better data (e.g., pilot results) resolve this?" If yes → Table for next meeting. Rationale: "Deferred pending evidence."  
        - *(b) Uncertainty:* "Is there >40% chance outcomes won’t occur?" If yes → Reject. Rationale: "High execution risk."  
        - *(c) Values Incommensurability:* "Do these serve different foundation goals (e.g., arts vs. health)?" If yes → Proceed to **RST (Step 5a).**  
        - *(d) Parity:* If (a)–(c) don’t apply, and RST passes → Options are "on a par."  
    - **Judgment Call:** The diagnostic quiz requires committee interpretation.  

  #### **Step 5: Tiebreak Analysis (15 min per close call)**  
    - **5a. Retrospective Symmetry Test (RST):**  
      - **Question:** "Could we defend funding either proposal to the board in 3 years?"  
        - If **no** → Revisit Step 4. Likely misclassified uncertainty/crudeness.  
        - If **yes** → Declare "on a par" and proceed to tiebreakers.  
    - **5b. Tiebreakers (Pre-set annually by the board):**  
      - Apply in order until one proposal wins:  
        1. **Domain Priority:** Rotate monthly (e.g., January: Arts > Health > Education).  
        2. **Equity Adjustment:** Favor underserved populations (e.g., rural, low-income).  
        3. **Innovation Bonus:** Higher points for novel approaches.  
        4. **Board Champion:** Only if declared upfront (e.g., "Board input weighs +0.2 in ties").  
      - **Rationale Template:** "Proposals were equally meritorious; final decision based on [tiebreaker]."  

  #### **Step 6: Finalize & Document (20 min)**  
    - **Action:** For funded proposals: Draft rationale using templates:  
      - **Clear Winner:** "Selected for superior impact/confidence ([scores])."  
      - **On a Par:** "Proposals demonstrated equivalent merit; chosen based on [tiebreaker]."  
    - **Rule:** Rationale must cite scores, diagnostics, or tiebreakers—never "felt like it."  
    - **Stability Safeguard:** Log decisions in a shared spreadsheet with scores/rationale. Reference past similar cases (e.g., "Like 2023 Arts Grant X").  

  ---

  ### **Run Through Your Cases**  
  **Case 1: Literacy Program vs. Museum Accessibility**  
  - **Step 2:** Literacy: Impact 4.2, Confidence 4.5. Museum: Impact 4.3, Confidence 4.4.  
  - **Step 3:** Both pass (Impact >3, Confidence >3).  
  - **Step 4:** Scores differ by <0.5 → "Close call." Diagnostic: (c) Values incommensurable (education vs. arts).  
  - **Step 5a:** RST: Yes—either could be defended in 3 years.  
  - **Step 5b:** Apply tiebreaker (e.g., domain priority: Arts this month). Museum wins.  
  - **Rationale:** *"Both proposals showed high impact and confidence. The museum access project was selected under our rotating domain priority (arts-focused month)."*  

  **Case 2: Near-Identical Health Proposals**  
  - **Step 2:** Proposal A: Impact 4.5, Confidence 4.6. Proposal B: Impact 4.6, Confidence 4.5 (board champion).  
  - **Step 4:** Scores differ by <0.5 → "Close call." Diagnostic: (d) Parity (same domain, minor score fluctuation).  
  - **Step 5a:** RST: Yes—either defensible.  
  - **Step 5b:** Tiebreaker: If board champion is a pre-set tiebreaker (+0.2), Proposal B wins. Else, domain priority.  
  - **Rationale:** *"Proposals were near-identical in merit. Proposal B was selected due to board advocacy, a pre-approved tiebreaker."*  

  **Case 3: Beloved Tiny Arts Org vs. Boring Health Intervention**  
  - **Step 2:** Arts: Impact 2.8 (small scale), Confidence 4.0. Health: Impact 4.8, Confidence 4.9.  
  - **Step 4:** |Impact difference| = 2.0 → **Clear winner (health)**. Diagnostic: Not values conflict—health dominates on measurable impact.  
  - **RST Application:** Could you defend the arts org? Only if impact scores were close. Here, no—health’s impact is objectively higher by your metrics.  
  - **Rationale:** *"The health intervention was prioritized due to significantly higher impact potential (4.8 vs. 2.8) and confidence (4.9 vs. 4.0). The arts proposal, while valued, did not meet the impact threshold for funding."*  
  - **Hard Truth:** The procedure forces rejection of the arts org. Not funding high-impact health for low-impact arts risks indefensible outcomes (e.g., "Why fund 100 art kits over 10 life-saving vaccines?").  

  ---

  ### **Where Judgment Calls Hide in the Procedure**  
  1. **Scoring (Step 2):** Impact/confidence ratings are subjective but constrained by scales.  
  2. **Diagnostic Quiz (Step 4):** Deciding between "uncertainty" vs. "incommensurability" requires interpretation.  
  3. **RST (Step 5a):** "Could we defend either?" is a collective judgment.  
  4. **Tiebreakers (Step 5b):** Choosing the tiebreaker order (e.g., equity > innovation) is a values call.  

  ### **Why This Works**  
  - **Stops Debates:** Step 4’s diagnostic quiz forces categorization of disagreements (e.g., "This is values conflict—stop arguing outcomes").  
  - **Adds Stability:** Scoring and logs prevent March amnesia.  
  - **Board-Friendly Rationales:** Focuses on scores and rules, not feelings.  
  - **Embeds Your Insight:** RST formalizes "no decisive reason" decisions.  

  **First Meeting Script:** Start by setting annual tiebreakers and domain rotation. Use a facilitator to enforce time limits. If someone says "you can’t compare," redirect to Step 4’s diagnostic—it resolves the stalemate by naming the disagreement.
