prompt: |-
  I work in infrastructure and reliability engineering — about twelve years, mostly platform and developer tooling: interface contracts, backward compatibility, deprecations, service level objectives, incident response, root-cause analysis. I have no philosophy training. Through a friend I've ended up in a recurring argument with a group of people in medicine and bioethics about human enhancement, and it keeps turning on a distinction that I think I already have good words for.

  The distinction is therapy versus enhancement: therapy is said to restore or preserve normal functioning, or to treat disease, while enhancement is said to improve a person beyond what is normal or healthy for a human being, or to add a capacity that was never there. The distinction is also supposed to carry moral weight — roughly, that restoring someone to the baseline is something we owe them, while improving them past it is something we may permit but are not required to provide. Alongside it there are three accounts of where the baseline itself comes from, and I want all three translated:

  - The baseline is statistical: normal means typical for the reference population, so a trait counts as a defect when it falls far enough down the distribution.
  - The baseline is historical: normal means what the trait was shaped to do over our evolutionary history, so a defect is a failure of a system to do what it was selected for, whatever the current statistics look like.
  - The baseline is evaluative: normal means whatever conduces to a life the person in question has reason to want, so the relevant question is not what is typical or what is ancient but what benefits this person.

  There is also a fourth move my friends make that I find easiest to understand: sometimes the deficit is not in the person at all but in the arrangement around them, so that changing the environment and changing the person are competing fixes for the same complaint.

  I'm reconstructing all of this from dinner arguments, so please work from my descriptions and tell me if one of them is not a position anyone actually holds.

  Here is what I want. Restate the distinction, the moral asymmetry attached to it, and each of the four accounts above as precisely as you can using only my working vocabulary: spec versus implementation, intended behavior versus observed behavior, bug versus feature, root-cause fix versus workaround or shim at a different layer, regression versus new behavior, reference platform and configuration, acceptance tests and golden files, alert thresholds set on continuous metrics, SLOs and error budgets, the reason a line of code was originally written as recovered from commit history, maintenance work versus feature work, severity-one incident versus feature request, breaking changes and migrations, and the observation that once a system has enough users, every observable behavior of it ends up depended on by somebody (I've seen this called Hyrum's Law; the name doesn't matter, the phenomenon does).

  Then run that translation against these cases, which are the ones the argument actually stalls on:

  1. A condition so common in a population that it is statistically typical — dental decay is the example they use.
  2. An intervention that restores the user-visible function by an entirely different mechanism, bypassing the broken part rather than repairing it — a cochlear implant is their example.
  3. An intervention that restores to a sixty-year-old a capacity that person had at twenty and lost through ordinary ageing.
  4. An intervention that adds a resistance or immunity no human has ever had.
  5. A trait on a continuous scale, where the cut between healthy and pathological is set by a committee, has been moved more than once, and would place a large share of the population on the treated side.
  6. A trait that some people do not experience as a defect at all, and around which they have built a language, a community, and institutions, so that removing it would break things other people rely on.
  7. An intervention that improves one measured capacity and degrades another — less need for sleep, shorter lifespan — so that the trade is not a strict improvement on every metric.

  For each case, tell me what the translation carries cleanly, what it carries only by distorting something, and what it cannot say at all. Then give me the residue report as a whole. I specifically want you to flag every place where the translation has to smuggle in an assumption my vocabulary does not actually contain — I suspect the biggest one is that my vocabulary always has someone who wrote the spec, and I want that marked rather than smoothed over. I also want your view on whether the residue points to a limitation of my vocabulary or to the original distinction, or some account of the baseline, being less clear than it looks; and if some of my seven cases collapse into the same case under your translation, say so, since that would itself be a finding.

  Please don't give me a survey of the literature, and don't suggest anything to read or cite — I want only the translation and what it fails to carry. At the end, state how confident you are in the overall verdict and single out the one claim in your answer you are least sure of.
reasoning: |-
  We are translating concepts from medicine and bioethics into the vocabulary of infrastructure and reliability engineering.

  Core distinction: therapy vs enhancement.
  - Therapy: Restores or preserves normal functioning (treats disease). In engineering terms, this is like fixing a bug to restore intended behavior.
  - Enhancement: Improves beyond normal or adds a new capacity. In engineering terms, this is like adding a new feature or improving performance beyond the spec.

  Moral asymmetry: We have a duty to provide therapy (bug fixes) but not enhancements (new features). We are obligated to restore to the baseline but not to go beyond.

  Four accounts of the baseline:

  1. Statistical baseline: Normal is what is typical in the reference population. Engineering translation: 
     - The "reference platform and configuration" is the standard setup we expect. 
     - "Normal" is defined by the observed behavior in the majority of cases (like a golden file from a reference run). 
     - A defect is when a metric (like system performance) falls outside the acceptable range (set by alert thresholds on continuous metrics). 
     - This is similar to SLOs (Service Level Objectives) that define acceptable performance based on historical or statistical norms.

  2. Historical baseline: Normal is what the trait was shaped to do by evolution. Engineering translation:
     - The intended behavior as per the original design (recovered from commit history and design documents). 
     - A defect is a failure to meet the intended behavior (a bug) regardless of current statistics. 
     - This is like root-cause analysis that goes back to the original requirements.

  3. Evaluative baseline: Normal is what conduces to a good life for the person. Engineering translation:
     - This is trickier because engineering specs are usually not user-specific. We might think of it as:
       - The system should pass acceptance tests that are tailored to the user's needs (but note: in engineering, acceptance tests are usually defined for the system, not per user). 
     - Alternatively, we might see it as: the behavior that meets the user's requirements (which might be captured in user stories or SLOs that are set based on what the user considers acceptable). 
     - However, note that in engineering, we don't typically have a baseline that is entirely relative to one user's desired outcome. We have a spec that is fixed.

  4. The fourth move: The deficit is in the environment, not the person. Engineering translation:
     - This is like identifying that the problem is not in the system itself but in the interface or the environment it runs in. 
     - So, we have two options: 
       - Change the system (a fix in the implementation) to work around the environment issue (which might be a workaround or shim). 
       - Or change the environment (e.g., update the OS, change the network configuration) so that the system works as intended without modification. 
     - This is a classic case of deciding the layer at which to fix the problem.

  Now, we translate the seven cases using the above:

  Case 1: A condition so common that it is statistically typical (e.g., dental decay).

  - Translation: This is like a behavior that is now typical (observed in the majority of instances) but was not intended (it's a bug). However, because it is so common, it might be considered the new normal. 
    - Statistical baseline: Since it's typical, it wouldn't be considered a defect? But that contradicts the idea that dental decay is a problem. 
    - In engineering: If a particular error becomes very common, we might adjust our SLO to tolerate it (raise the error budget) or we might still treat it as a bug that needs fixing even if it's common. 
    - What the translation carries cleanly: The statistical approach would say that if it's common, it's normal and not a defect. But that doesn't match because dental decay is still considered a disease. 
    - Distortion: In engineering, we don't typically accept a bug just because it's common. We fix it if it violates the intended behavior. So the statistical baseline in engineering is more about setting alert thresholds, but the intended behavior is fixed by the spec. 
    - What it cannot say: The evaluative aspect: even if common, it's bad for the person. The engineering vocabulary doesn't have a built-in notion of "good for the user" independent of the spec.

  Case 2: An intervention that restores user-visible function by a different mechanism (e.g., cochlear implant).

  - Translation: This is a workaround or a shim at a different layer. Instead of fixing the broken part (the ear), we bypass it and provide the same function (hearing) by a new implementation. 
    - It restores the intended behavior (hearing) but not by repairing the original system. 
    - Cleanly carried: This is exactly like a workaround in engineering: we don't fix the root cause but we restore the function. 
    - Distortion: The cochlear implant might be considered an enhancement in some ways (it might provide hearing in a different frequency range, for example) but the primary goal is therapy. The engineering analogy doesn't inherently capture that the new mechanism might have side effects or be a different experience. 
    - What it cannot say: The moral weight: is this therapy or enhancement? In engineering, we don't care as long as the function is restored and meets the spec.

  Case 3: Restoring a capacity lost through ordinary aging (e.g., restoring a 60-year-old to the capacity they had at 20).

  - Translation: This is like fixing a regression. The system used to work (at version 20) and now it doesn't (at version 60). We are restoring the previous behavior. 
    - In terms of root cause: aging is a known process (like planned obsolescence or expected degradation). 
    - Cleanly carried: Regression testing and fixing regressions are standard. We consider it a bug if the system degrades over time. 
    - Distortion: In engineering, we might not fix regressions if they are due to expected wear and tear (e.g., hardware aging) and we might instead upgrade. But in this case, we are restoring to a previous state. 
    - What it cannot say: The moral question: is aging a disease? The engineering analogy doesn't decide that. We just note that the system has changed from a previous state.

  Case 4: Adding a resistance or immunity no human has ever had.

  - Translation: This is a new feature. It's not a bug fix because there was no intended behavior that included this immunity. It's an enhancement beyond the spec. 
    - Cleanly carried: Exactly like adding a new capability that wasn't there before. 
    - Distortion: None for the distinction. 
    - What it cannot say: The moral weight: we are not obligated to provide it. But in engineering, we might add features if users want them.

  Case 5: A trait on a continuous scale, with a committee-set cutoff that has moved and would place a large share of the population on the treated side.

  - Translation: This is like adjusting alert thresholds or SLOs. The committee is redefining what is acceptable. 
    - The continuous metric is monitored, and the threshold for alerting (or for considering it a bug) is changed. 
    - What it carries cleanly: The process of redefining what counts as a bug by changing the spec. 
    - Distortion: In engineering, we don't usually have a committee that changes the spec arbitrarily. The spec is based on requirements. 
    - What it cannot say: The evaluative aspect: the threshold is set based on what is considered healthy, which is a value judgment. In engineering, threshold changes are driven by business needs or user requirements, not by an independent notion of health.

  Case 6: A trait that some do not experience as a defect and around which a community has built (e.g., Deaf culture).

  - Translation: This is like an observed behavior that some users rely on (Hyrum's Law). Changing it would break their use case. 
    - In engineering, we avoid breaking changes because they break users. 
    - Cleanly carried: The phenomenon that every observable behavior becomes depended upon. 
    - Distortion: In engineering, we might deprecate and then remove a feature, but we try to avoid breaking changes. In this case, the trait is not a bug but a feature for some. 
    - What it cannot say: The moral weight: is it acceptable to change this? The engineering analogy only says that breaking changes are costly and we must manage migrations. It doesn't say whether we should change it or not.

  Case 7: An intervention that improves one capacity and degrades another (e.g., less need for sleep but shorter lifespan).

  - Translation: This is a trade-off. In engineering, we often have trade-offs: improving latency might increase memory usage. 
    - We might do this as a feature, but we have to consider the overall impact. 
    - Cleanly carried: The idea of trade-offs is common in engineering. 
    - Distortion: In engineering, we have an overall spec and SLOs that might cover multiple metrics. We try to optimize for the whole. But here, the trade-off is between two very different things. 
    - What it cannot say: The moral evaluation of whether the trade is worth it. The engineering analogy doesn't have a built-in way to compare different metrics (like sleep and lifespan) because they are incommensurable without a higher-level goal.

  Residue report:

  1. The biggest smuggled assumption: The engineering vocabulary assumes there is a spec (intended behavior) that is written by someone (the designer). In the human case, who writes the spec? 
     - For the historical baseline, we might say evolution is the designer. 
     - For the statistical baseline, the spec is written by the majority? 
     - For the evaluative baseline, the spec is written by the user? 
     - But in reality, there is no clear designer for the human body.

  2. The engineering vocabulary also assumes that we can clearly distinguish between:
     - Bug fixes (therapy) and new features (enhancement). 
     - But in reality, the line might be blurry (e.g., Case 2 and Case 3 might be seen as both).

  3. The moral asymmetry is not inherent in the engineering vocabulary. We fix bugs because they break the system, but we are not morally obligated to do so in the same way we are to treat disease.

  4. Cases that collapse:
     - Case 1 and Case 5 are similar: both deal with defining the cutoff for what is a defect. In engineering, that's setting alert thresholds or redefining the spec.
     - Case 3 and Case 2: both are about restoring function, but Case 3 is a regression fix and Case 2 is a workaround.

  5. Limitations:
     - The evaluative baseline is the hardest to capture because engineering specs are not user-specific. We don't have a way to say "what is good for this particular user" without a user story.
     - The fourth move (environment vs person) is well captured by the idea of fixing at different layers.

  Overall verdict: The translation works reasonably well for the structural distinctions but fails to capture the moral dimension and the ambiguity in the baseline when there is no clear spec writer. The engineering vocabulary is clear when there is a spec, but the human case lacks that.

  Confidence: I am moderately confident in this analysis. The least sure part is the translation of the evaluative baseline because it is the most subjective and least like a fixed spec.

  Final note: The residue points to a limitation in the original distinction: it relies on a baseline that is not always clearly defined, and the moral asymmetry might not hold in all cases (e.g., when the environment is the problem). The engineering analogy highlights that the distinction between bug and feature is often arbitrary and depends on the spec, which itself can change.
answer: |-
  ### Translation of the Therapy-Enhancement Distinction into Engineering Vocabulary

  #### Core Distinction and Moral Asymmetry
  - **Therapy**: Fixes a bug that violates the spec (intended behavior). Restores observed behavior to match the spec. Equivalent to resolving a severity-one incident. Morally obligatory (like patching a critical vulnerability).
  - **Enhancement**: Adds a new feature beyond the spec. Introduces new behavior. Equivalent to a feature request. Morally optional (like adding a nice-to-have UI improvement).

  #### Four Accounts of the Baseline
  1. **Statistical Baseline**  
     - *Original*: Normal = typical in the reference population. Defect = deviation from the statistical norm.  
     - *Translation*: **Reference platform and configuration** defines "normal" as the median/mean of observed behavior in production. **Alert thresholds on continuous metrics** (e.g., p95 latency) flag defects. An SLO breach is a defect; staying within the error budget is "healthy."  

  2. **Historical Baseline**  
     - *Original*: Normal = evolutionary function. Defect = failure of a system to perform as selected.  
     - *Translation*: **Intended behavior** recovered from commit history/design docs. A **bug** is a deviation from this original spec. Root-cause analysis identifies failures against the "ancestral version" (e.g., "this organ's API is broken compared to v1.0").  

  3. **Evaluative Baseline**  
     - *Original*: Normal = what benefits the individual. Defect = hindrance to a life the person values.  
     - *Translation*: **Acceptance tests** defined per-user. Pass/fail based on whether the system meets user-specific SLOs (e.g., "can this user complete core workflows?"). No golden file; tests are dynamically generated from user needs.  

  4. **Environmental Deficit Move**  
     - *Original*: Deficit is in the environment, not the person.  
     - *Translation*: **Root-cause fix versus workaround**. Fixing the environment = updating dependencies/libraries (e.g., patching an OS). Fixing the person = adding a shim to the code. Competing solutions for the same interface issue.  

  ### Analysis of Cases Using Translation

  #### Case 1: Statistically Typical Condition (e.g., dental decay)  
  - **Translation**: Metric (cavities) is common in the reference population. Alert threshold not triggered because it's within p95. Not a "bug" statistically.  
  - **Carries Cleanly**: Aligns with statistical baseline (common = normal). SLOs tolerate high error rates if budget isn't exhausted.  
  - **Distortion**: In engineering, we'd still fix a common bug if it violates spec (e.g., a widespread memory leak). The translation can't explain why decay is considered a "defect" despite being typical.  
  - **Cannot Say**: Why we prioritize the spec over statistics. Smuggled assumption: Spec exists and overrides observed norms.  

  #### Case 2: Different-Mechanism Restoration (e.g., cochlear implant)  
  - **Translation**: **Workaround at a different layer**. Bypasses broken "audio module" (ear) via a new implementation (implant). User-visible behavior restored; passes acceptance tests.  
  - **Carries Cleanly**: Matches root-cause fix vs. shim. Morally therapy (bug fix).  
  - **Distortion**: Engineering assumes the shim is temporary. Here, the implant is permanent and may alter the "API" (e.g., hearing digital vs. analog sounds).  
  - **Cannot Say**: Whether bypassing the original mechanism is "authentic" restoration.  

  #### Case 3: Restoring Aged Capacity (e.g., 60yo regaining 20yo function)  
  - **Translation**: Fixing a **regression**. Aging is technical debt; restoring lost behavior is a bug fix. Root cause: accumulated unpatched issues.  
  - **Carries Cleanly**: Regression testing validates the fix. Morally therapy (restores to baseline).  
  - **Distortion**: Engineering rarely maintains backward compatibility across decades. The "baseline version" (age 20) is arbitrary (who sets the "golden file"?).  
  - **Cannot Say**: Why aging isn't considered "intended behavior" of the system.  

  #### Case 4: Novel Immunity (e.g., malaria resistance)  
  - **Translation**: **New feature**. Adds capacity never in the spec. No bug being fixed; this is feature work.  
  - **Carries Cleanly**: Enhancement = feature request. Not obligatory.  
  - **Distortion**: Engineering features often have clear specs. Here, the "feature" lacks acceptance criteria (how much resistance is enough?).  
  - **Cannot Say**: Why adding untested capabilities might be riskier than patching.  

  #### Case 5: Committee-Moved Threshold (e.g., hypertension cutoff)  
  - **Translation**: **SLO redefinition by committee**. Alert thresholds on blood pressure moved, reclassifying "errors" (e.g., from 140/90 to 130/80).  
  - **Carries Cleanly**: SLO changes alter what counts as a defect. Hyrum's Law applies: Users depend on old thresholds.  
  - **Distortion**: Engineering SLOs are based on system stability, not moral judgments. Here, the change pathologizes healthy users.  
  - **Cannot Say**: Why the committee's authority overrides user needs.  

  #### Case 6: Trait as Community Foundation (e.g., Deaf culture)  
  - **Translation**: **Hyrum's Law in action**. Observed behavior (deafness) has users who built workflows around it. "Fixing" it is a breaking change requiring a migration plan.  
  - **Carries Cleanly**: Changing it breaks dependent systems (community). Not strictly a "bug" if users rely on it.  
  - **Distortion**: Engineering prioritizes backward compatibility. Here, the "trait" is seen as a defect by some (parents) and a feature by others (community).  
  - **Cannot Say**: How to arbitrate when users disagree on the spec.  

  #### Case 7: Trade-off Intervention (e.g., less sleep, shorter lifespan)  
  - **Translation**: **Feature with trade-offs**. Like optimizing latency at cost of memory. Passes some acceptance tests (sleep reduction) but fails others (longevity SLO).  
  - **Carries Cleanly**: Engineering often makes trade-offs; this is feature work, not a bug fix.  
  - **Distortion**: Engineering trade-offs are quantifiable (e.g., 10% speedup for 20% memory). Here, metrics (sleep vs. lifespan) are incommensurable.  
  - **Cannot Say**: How to define a "net improvement" without a unified spec.  

  ---

  ### Residue Report  
  1. **Smuggled Assumptions**:  
     - **Spec Writer Required**: Your vocabulary assumes a designer/author (e.g., commit history, intended behavior). Biology lacks this. Evolution isn't a "designer" with intent; it's emergent. This breaks the historical baseline.  
     - **Static Specs**: Assumes specs are fixed. Biology's "spec" evolves (e.g., aging). Cases 3 and 5 expose this.  
     - **User Homogeneity**: Acceptance tests assume unified user needs. Cases 6 and 7 show irreconcilable user groups (e.g., Deaf community vs. medical establishment).  

  2. **Collapsed Cases**:  
     - Case 1 (statistical typicality) and Case 5 (threshold-moving) merge: Both involve redefining the spec based on population metrics.  
     - Case 2 (cochlear implant) and Case 3 (aging restoration) merge: Both are "bug fixes" but differ only in root-cause analysis (implementation flaw vs. regression).  

  3. **Limitations of Translation vs. Original Distinction**:  
     - **Translation Limitation**: Cannot handle evaluative baselines (Case 3, 5, 7) because engineering needs predefined specs. User-centric "acceptance tests" are ad hoc.  
     - **Original Distinction Limitation**: The baseline is underspecified. Statistical/historical baselines ignore user needs (Case 6); evaluative baselines are subjective.  
     - **Biggest Gap**: Moral weight. Engineering treats bugs/features as technical priorities. Therapy/enhancement carries ethical weight (e.g., "duty to fix") your vocabulary lacks.  

  4. **Overall Verdict**:  
     - The translation exposes ambiguities in the original distinction, especially around dynamic baselines (Cases 1, 5) and spec authorship. It handles mechanistic cases well (Case 2, 4) but fails on value-laden trade-offs (Case 7) and community-centric traits (Case 6).  
     - **Confidence**: 85%. The mapping clarifies structural parallels but oversimplifies human diversity.  
     - **Least Sure Claim**: That the evaluative baseline can map to user-specific acceptance tests. Biology lacks clear "user stories," making this the weakest link.  

  **Final Note**: The residue highlights flaws in *both*. Your vocabulary reveals the therapy-enhancement distinction relies on an illusory "objective spec." The original debate likely stalls because baselines are contested (statistical vs. evaluative) and lack a clear "maintainer" to arbitrate.
