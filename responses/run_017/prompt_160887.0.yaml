answer: |-
  ## Eulogy for Dr. Miriam Ashdown

  **(Delivered in a calm, warm, reflective tone)**

  Good morning. We are here, together, in this quiet space, because Miriam Ashdown is dead.

  That simple, undeniable fact sits with us. It sits where her presence used to be – in the front row of a lecture hall, patiently listening to a student stumble towards an insight; at her desk, surrounded by precariously stacked books and a single, perfectly sharpened pencil; in the middle of the community garden, hands deep in the soil, arguing passionately with a city official about why tomatoes needed more space than zoning allowed.

  Miriam *is* dead. Her voice, which could be so sharp in debate yet so gentle in explanation, is silent. Her sharp mind, which wrestled with concepts most of us find dizzying, has stopped. The woman who ran this garden, who taught generations of students, who was Padma’s sister, Daniel’s mother, and a formidable colleague to many of us… she is gone.

  And she would have likely hated that hymn. We can smile at that. She had strong opinions, especially about things that felt insincere or trite. She preferred clarity, even when it was difficult.

  Yet, look around. Her students came. From near and far. Because she didn’t just teach Buddhist philosophy – *Madhyamaka*, she’d call it, the path of the Middle Way, which relentlessly questions our fixed ideas about reality – she lived a kind of fierce, practical clarity. She showed us how ideas aren't just abstractions; they shape how we move through the world.

  She taught that our tendency to grasp at fixed answers – especially about the biggest, most unanswerable questions – is often where we get stuck. She was particularly fascinated by the ancient question about what happens to someone who’s truly liberated after death: Do they exist? Not exist? Both? Neither? She didn’t see this as a riddle to be cracked. She saw the *asking* itself as the trap, a way of trying to pin down the ultimate nature of things, which can't be pinned down. For her, the most powerful, practical act was often the quiet refusal to answer such questions on their own terms. Not out of evasion, but out of a profound understanding that some answers confine us rather than free us.

  This might sound abstract, but Miriam made it concrete. It wasn't about cold detachment. It was about being fully *here*, engaged with *this* world. It was why she could throw herself into a complex philosophical debate with that Tibetan scholar over there (we see you, and she’d be glad you came, disagreement and all!), and then, hours later, be equally immersed in the gritty reality of compost and cucumber beetles in the community garden. It’s why she could challenge a student’s assumption with laser precision, and then offer unwavering support when that same student faced a personal crisis. The conventional world – the world of gardens, zoning boards, students, arguments, laughter, and grief – this was the world she inhabited fully. Her philosophy wasn't an escape from it; it was a lens that made her engagement with it more vivid, more compassionate, more real.

  So, we feel the sharp edges of her absence. The empty chair at faculty meetings that won’t be filled. The silence where her arguments with the zoning board used to be. The space in her garden plot that someone else will tend now. The unanswered questions we wish we could ask her.

  Daniel, your mother loved you fiercely and was endlessly proud of the practical, grounded man you are. Padma, your sister shared a bond that ran deeper than words or even differing practices. Colleagues and students, she challenged us, shaped us, and demanded our best thinking. Neighbors, she fought for your garden, your shared space, with a tenacity born of deep care. We all knew different facets of her, and each facet was real, vibrant, and utterly Miriam.

  We cannot say where she is. To do so would be to build walls where she sought openness. We cannot soften the finality of her death with comforting notions that she’s somehow mysteriously “still here” in an undefined way. She rejected that velvet evasion, that attempt to make the ultimate into a warm, fuzzy feeling. She believed such ideas ultimately obscure the very truth we seek, hiding inside the medicine meant to cure our confusion. Her refusal wasn't coldness; it was a deep respect for the reality of our loss, and for the profound mystery that lies beyond our conceptual grasp.

  What we *can* do, what she would wholeheartedly endorse, is remember her. Remember her fierce intellect. Remember her dry wit. Remember her hands in the dirt. Remember her unwavering commitment to truth, even when it was uncomfortable. Remember her arguments won and lost (though she rarely lost with the zoning board!). Remember her laughter. Remember her kindness. Remember the way she showed up, fully present, in this very real, very fragile, very beautiful world.

  Her life wasn't a deposit left for us to interpret; it was a gift, handed back to the world through every interaction, every lecture, every tomato plant, every pointed question. We hold the consequence of her life right now, in our memories, in this gathering, in the garden she nurtured, in the minds she shaped.

  So, let us sit with this ordinary, extraordinary truth: Miriam lived, fully and brilliantly. Miriam is dead. And we miss her, profoundly.

  It is entirely fitting now, as we navigate this loss in our own ways, that Padma will offer a dedication, a traditional practice close to her heart, honoring her sister. We listen with respect for Padma’s love and intention.

  ---

  ## Private Notes for the Speaker

  1.  **"Miriam Ashdown is dead." / "We cannot say where she is. To do so would be to build walls where she sought openness."**
      *   **What the Discipline Requires:** Directly stating the conventional fact of death ("Miriam is dead") without metaphysical qualification. Explicitly refusing to locate her in any post-mortem state (afterlife/annihilation/both/neither), framing such attempts as counter to her philosophy of openness and the refusal to answer the fourfold question.
      *   **What a Careless Eulogy Might Say:** "Miriam has passed on to a better place," "Her spirit is finally free," "She is one with the universe now," "She lives on in our hearts" (as a metaphysical statement), "She is gone, but her energy remains." These all implicitly answer the fourfold question (e.g., "she exists elsewhere," "she is annihilated but her influence lingers," "she is both gone and present," "she is neither body nor spirit but something else").

  2.  **"We cannot soften the finality of her death with comforting notions that she’s somehow mysteriously 'still here' in an undefined way. She rejected that velvet evasion... Her refusal wasn't coldness; it was a deep respect for the reality of our loss..."**
      *   **What the Discipline Requires:** Explicitly identifying and rejecting the "velvet fifth corner" – the temptation to treat emptiness or the ultimate as a warm, consoling presence ("still here," "beyond what we can say"). Framing this rejection *not* as harshness but as respect for the genuine reality of loss and the genuine mystery beyond concepts. Connecting it directly to her view that this error "hides inside the cure."
      *   **What a Careless Eulogy Might Say:** "While she is gone from sight, her presence lingers in this room," "She is not truly gone, just transformed," "We feel her love surrounding us still," "She is beyond our understanding now, at peace in the great mystery." These trade on the "velvet" version of the ultimate.

  3.  **"Her life wasn't a deposit left for us to interpret; it was a gift, handed back to the world through every interaction... We hold the consequence of her life right now..."**
      *   **What the Discipline Requires:** Illustrating her "repayment, not deposit" view of argument/logic. The eulogy doesn't impose a *new* view about her death or legacy; it simply reflects back the tangible, conventional consequences of her life (memories, the garden, the students present) that are already evident and claimed by the audience's presence and shared experience. It leaves "nothing of its own on the table" metaphysically.
      *   **What a Careless Eulogy Might Say:** "Her life teaches us that death is just an illusion," "Her journey shows us the path to true liberation," "We must believe she has found perfect peace." These impose new metaphysical claims or interpretations about death and her state.

  **The Philosopher's Moment:** "She saw the *asking* itself as the trap... For her, the most powerful, practical act was often the quiet refusal to answer such questions on their own terms." Non-philosophers hear a straightforward description of her character (she refused unanswerable questions). Philosophers recognize the explicit reference to her interpretation of the fourfold negation (the *catuṣkoṭi*) as a practical tool to dismantle the question, not solve it.
