  Third, her argument style as "repayment not deposit" - can't impose views, only reflect back conventional reality. So the speech must show her philosophy in structure, not preach it. 

  But there's freedom in ordinary truths: "Miriam is dead" is perfectly valid. The grief isn't prohibited, just metaphysical claims. Need to anchor everything in concrete details - the garden, zoning battles, academic debates. 

  Audience is mixed: philosophers (who'll spot subtle Madhyamaka nods), Theravādin sister (merit dedication follows), atheist son (no woo), neighbors (knew gardener Miriam). Must work on all levels. 

  For the "philosophers only" moment... maybe something about how she taught negation? Like "she refused the question" - philosophers hear the tetralemma reference, others hear stubbornness. 

  Structure outline: 
