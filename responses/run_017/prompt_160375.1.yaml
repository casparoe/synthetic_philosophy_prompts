prompt: |-
  Writing a paper on populism and I keep hitting the same wall: everyone from cable pundits to movement leaders invokes the will of the people, and nothing I have read tells me how you would actually check one of those claims. So before I read any more theories of it, I want the spec.

  Fixing the purpose, since I think adequacy depends on it: I need a theory good enough to adjudicate a specific contested claim, not to argue about whether democracy is legitimate in general. The situation is always of the form: some leader says the people will policy X, or says that a parliament, court or referendum result has betrayed the will of the people, and the body applying the test is a constitutional court, an opposition party, or a journalist. Often there is no vote to look at.

  So: give me the requirements as a table — requirement | the case that shows why it is a requirement | non-negotiable, or just a preference of one camp. Invent fresh cases rather than recycling the textbook ones. Here are the ones I already think belong on the list; tell me which are genuine desiderata and which are just the prejudices of a camp I have been reading too much of:

  - it has to be able to say who the people are in the case at hand before it aggregates anything — the boundary problem. My case: a national vote on damming a valley; the valley's 40,000 residents are 0.7% of the country and vote 80% against, the country votes 52% for. Whose will? Also the variant where the flooded valley is downstream in a neighbouring country.
  - it has to distinguish the people from whoever happened to be allowed to vote. Call it the shadow demos: several hundred thousand long-term residents with no citizenship, living under the law that is being decided. Are they part of the people whose will is at issue? Does the theory owe an answer, or is silence acceptable?
  - it cannot collapse willing into wanting or into what is good for them. Case: everyone in the demos wants X, would be better off under not-X, and says afterwards that they never willed X.
  - it has to handle the claim made where nothing was ever expressed: no vote, no poll, just demonstrations and a leader speaking for them. This is most actual populist claims, so a theory that cannot do this is useless to me.
  - it has to say whether intensity counts — 51% who barely care against 49% who would riot — and whether a will can be more or less formed, a settled one versus a mood.
  - it has to survive the two-referendum case, where a majority backs A, a majority backs B, and a majority rejects A and B together, plus ordinary cycling, without just stipulating that the will is whatever the last vote said — given Arrow-flavoured results about aggregation.
  - it has to say something about a will that changes, and about a will directed at the future: today's voters want a pension reform that the people of 2060 will hate.
  - it has to be checkable in principle, so that a claim can be called false rather than merely contested — but not so strict that every real-world claim is false by construction, which would just be rigging the test.

  Then two short paragraphs, under 200 words for the pair. First: which subset of the requirements do you think is jointly unsatisfiable? My suspicion is that demos-sensitivity, sensitivity to intensity, immunity to agenda control, and always yielding a determinate answer cannot all be had at once, but tell me if I have picked the wrong four. Second: which single requirement does the most work in excluding candidate theories, and why.

  Optionally and briefly — a sentence or two each — score the aggregative majoritarian picture, the deliberative picture, the view that the people form a single subject with a will no vote fully expresses, and the version on which the will is what they would will if properly informed.

  Format: the table plus those two paragraphs, hard cap of 900 words for the whole thing. Do not cite anything or suggest reading — I cannot look any of it up, so argue from the cases.
reasoning: |-
  Hmm, the user is writing a paper on populism and struggling with how to verify claims about "the will of the people." They've provided a detailed set of requirements they think should be part of any theory that could validate such claims, along with specific cases to illustrate each point.

  This is an interesting methodological challenge. The user wants a structured table evaluating these requirements: whether each is genuinely necessary, which are non-negotiable versus ideological preferences, and which might be jointly incompatible. They also want analysis of which requirement poses the biggest obstacle to existing theories.

  Looking at their requirements:
  - Defining "the people" (boundary problem with valley dam case)
  - Including/excluding non-voting residents (shadow demos)
  - Distinguishing will from desire or interest
  - Handling claims without formal expressions
  - Accounting for intensity of preference
  - Surviving voting paradoxes
  - Addressing temporal conflicts
  - Being verifiable but not impossible

  The valley dam case (requirement 1) perfectly shows why demarcation matters - is "the people" the affected minority or the national majority? The shadow demos case (2) raises questions about who counts when policies affect disenfranchised residents. Requirement 3 cautions against conflating momentary desire with considered will, while requirement 4 tackles the common populist tactic of claiming mandate without evidence.

  The temporal case (7) is particularly thorny - can today's voters bind future generations? And requirement 8 wisely demands falsifiability without setting an impossible bar.

  For the analysis section, I think the core tension is between demos-sensitivity (1), intensity accounting (5), agenda-control immunity (6), and determinacy (8). These likely form an unsatisfiable set - you can't have a system that simultaneously respects minority voices, weights intensity, avoids paradoxes, and always gives clear answers. Requirement 6 (voting paradoxes) seems most destructive to theories since Arrow's theorem shows aggregation methods inevitably fail under basic fairness conditions.

  Regarding existing approaches:
  - Majoritarianism fails requirements 1, 6, and 7
  - Deliberative models struggle with 4 and 8
  - Single-subject theories violate 8
  - Informed-will theories founder on 3 and 8

  The user's clearly done deep thinking here - their frustration stems from recognizing that populists exploit these conceptual gaps. The response should validate their analytical approach while showing why adjudicating "will of the people" claims may be fundamentally problematic.
answer: |-
  ### Requirements Table for Adjudicating "Will of the People" Claims

  | Requirement | Case Illustrating Necessity | Non-Negotiable or Camp Preference? |
  |-------------|-----------------------------|-------------------------------------|
  | **Demos Definition**: Must specify who constitutes "the people" for the policy context. | **Valley Dam Case**: National vote approves damming a valley. Residents (0.7% of population, 80% against) face disproportionate harm vs. national majority (52% for). Is the "will" national or local? **Neighbor Variant**: Valley is in another country. | **Non-negotiable**. Without boundaries, "the people" is vacuously defined. Silence invalidates the claim. |
  | **Shadow Demos Inclusion**: Must address whether disenfranchised residents subject to the policy are part of "the people." | **Resident Non-Citizens Case**: Policy bans public religious attire. 300,000 non-citizen long-term residents (5% of affected population) must comply but were excluded from voting. Does their will count? | **Non-negotiable**. A theory must explicitly include/exclude them with justification. Silence concedes arbitrariness. |
  | **Will vs. Want/Interest**: Cannot conflate momentary desire, self-interest, or later regret with "will." | **Regret Case**: 55% vote for immediate cash payments over pension reform. All voters later admit they "never truly willed" it, recognizing it harms their future. | **Non-negotiable**. Collapsing these legitimizes fleeting impulses as "will," undermining the concept’s stability. |
  | **Non-Voting Evidence**: Must evaluate claims lacking votes/polls, relying on protests or leader assertions. | **Unvetted Rally Case**: Leader declares a 100,000-person protest "is the people" demanding border closure. No polls exist; media estimates 40% of attendees are paid actors. | **Non-negotiable**. Most real populist claims lack formal mechanisms; theories ignoring this are irrelevant. |
  | **Intensity & Stability**: Must address whether passion or duration of preference matters. | **Tepid Majority Case**: 51% support a minor tax tweak (indifference), while 49% oppose vehemently (threatening mass resignations). Is the majority’s "will" authoritative? | **Camp Preference**. Majoritarians reject intensity; others see ignoring it as elitist. Theory must explicitly choose. |
  | **Aggregation Paradox Immunity**: Must resolve inconsistent majority preferences without ad-hoc timing fixes. | **Two-Referendum Paradox**: Majority backs "Lower Taxes" (A) and "Increase Education Spending" (B) separately, but majority rejects "A and B" together due to deficit fears. | **Non-Negotiable**. Arrow’s theorem shows ignoring paradoxes permits agenda manipulation. |
  | **Temporal Scope**: Must handle intergenerational will and changing preferences. | **Pension Time Bomb**: Today’s voters (aging majority) will a pension hike, bankrupting the system for 2060’s younger generation. Whose "will" governs? | **Non-Negotiable**. Policies bind futures; theories must define if "the people" is present or trans-temporal. |
  | **Falsifiability**: Must allow claims to be proven false, not just contested, without demanding perfection. | **Ambiguous Mandate Case**: Leader claims "the people" want deregulation after winning 50.5% in an election dominated by unrelated scandals. | **Non-Negotiable**. Unfalsifiable theories are rhetorical tools, not adjudicative standards. |

  ---

  ### Joint Unsatisfiability & Key Exclusionary Requirement  
  **Unsatisfiable Subset**: Demos sensitivity (1), intensity sensitivity (5), aggregation paradox immunity (6), and falsifiability (8) **cannot coexist**. Demos sensitivity fragments the electorate, making aggregation harder. Adding intensity metrics multiplies dimensions, escalating paradox risks (violating 6). Paradox resolution (e.g., via deliberative filters) often obscures demos boundaries (undermining 1) or requires interpretive discretion that threatens falsifiability (8). A determinate, paradox-proof answer typically requires homogenizing the demos or ignoring intensity—sacrificing core requirements.  

  **Most Exclusionary Requirement**: **Aggregation paradox immunity (6)**. Arrow’s theorem proves no voting system can satisfy all fair aggregation criteria simultaneously. Theories avoiding paradoxes must either:  
  - **Restrict preferences** (e.g., assume single-peakedness), violating real-world cases (e.g., the Two-Referendum Paradox).  
  - **Impose meta-rules** (e.g., constitutional courts defining "will"), sacrificing demos sensitivity (1) or falsifiability (8).  
  - **Embrace indeterminacy**, failing falsifiability (8).  
  Thus, requirement 6 forces theories into trade-offs that invalidate other essentials.  

  ### Scoring Existing Approaches (Briefly)  
  - **Aggregative Majoritarianism**: Fails 1 (boundaries), 5 (intensity), 6 (paradoxes), 7 (temporal scope). Useful only for simple, same-demos votes.  
  - **Deliberative Theories**: Fails 4 (non-voting evidence) and 8 (falsifiability)—"proper deliberation" is unmeasurable.  
  - **Single-Subject Will**: Fails 3 (collapses will/want), 6 (paradoxes), 8 (falsifiability)—mystical and unverifiable.  
  - **Informed Will**: Fails 3 (will vs. interest), 8 (falsifiability)—counterfactuals are non-empirical.  

