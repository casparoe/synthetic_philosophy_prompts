prompt: |-
  I am writing a chapter on sceptical scenarios in expected-value reasoning about the very long-run future, and I keep encountering an argumentative configuration for which I have no label. I do not need citations or a reading list; what I need is the shape of the thing and a definition I can use.

  The first form it takes goes like this. Someone introduces the possibility that the world we inhabit is a computer simulation run by some other civilisation, and concludes that a project aimed at affecting the far future should have its expected value scaled down by roughly the probability that we are in such a run — because the run will probably be terminated before the future we are trying to affect arrives, or because the simulators will not permit the consequences we care about to accumulate. What I cannot name is what happens around that move. Nothing else in the calculation is re-derived under the hypothesis that has just been taken seriously. The size of the payoff is left at its pre-hypothesis value, even though a civilisation capable of running our world is presumably capable of running many like it, so that conditional on the project succeeding the number of beings affected may be larger rather than smaller. The location of the effects is left alone, even though on that hypothesis what we do here might matter primarily by influencing the simulators rather than by propagating through our own future, so that the hypothesis relocates the stakes instead of removing them. And no comparable scaling is applied to the near-term options the project is being compared against, even though the termination worry applies to them in kind — it is only that over a short enough window the accumulated risk is too small to notice. The hypothesis is consulted at exactly one point in the reasoning.

  The second form is the mirror of it. In the same discussion, the hypothesis is used to deflate one high-stakes project and then, a few paragraphs later, used as a positive reason for a different expenditure — that if we are being watched, it matters what the run looks like to whoever is watching. Nothing is said about why the hypothesis is epistemically live in the first use and inert in the second, or about what makes it a reason-generator in one place and a reason-killer in another.

  I want to be clear that I am not after the broad psychological diagnosis. There is a principled version of the asymmetry: the probability of termination plausibly accumulates with elapsed time, so it is entirely in order for long-horizon projects to be discounted more heavily than short-horizon ones, and a discount with the right time-profile is not the thing I am trying to isolate. What I am after is narrower: a hypothesis that is admitted into the probability term of one option's expected value and then withheld from the value term, from the alternative options, and from any use that would raise rather than lower the total.

  So: does this configuration have an established name in epistemology, decision theory, or the literature on long-term priorities? If it does, I want it together with the conditions under which it applies. If it does not, I want it named and defined, with its edges marked. Either way, tell me how it differs from each of the things it resembles — ordinary motivated or confirmation-biased use of evidence, which is about which evidence gets sampled rather than about the asymmetric role one scenario plays inside a single calculation; scepticism of the Pascal's-mugging sort, which worries about the magnitude of small probabilities of enormous payoffs rather than about scenario-dependence; debunking arguments and the familiar objection that they generalise too far or undermine themselves, which is structurally close but seems to target a whole domain of belief rather than one term in one computation; the undercutting-versus-rebutting distinction among defeaters, which classifies an evidential relation rather than a pattern of deployment; and the first-order claim that a run would probably be shut down early, which is a substantive risk rather than a fact about how that risk is used.

  Give me boundary cases as well: the principled time-horizon discount that is not an instance; a treatment that adjusts probability and payoff together under the hypothesis; a case in which the hypothesis is deployed only to raise the stakes; and the case where a reason for the asymmetry is explicitly offered but is a bad reason. Tell me what I would have to find in a piece of argument to diagnose the opportunistic version rather than the principled one. And finally: when the hypothesis is applied symmetrically, does the dampening of far-future fanaticism survive at all, or does it turn out to have been transferring the fanaticism somewhere else?
reasoning: |-
  Okay, the user is writing a chapter on sceptical scenarios in expected-value reasoning about the long-run future and needs a label for a specific argumentative pattern they keep encountering. They describe two forms of this pattern: one where a hypothesis (like the simulation argument) is used to discount the expected value of long-term projects by scaling down probabilities, but without adjusting other terms like payoff magnitude or location of effects. The second form uses the same hypothesis asymmetrically—first to deflate one project, then to justify another.

  The user has clearly thought deeply about this. They've identified nuances: the hypothesis affects only the probability term, not the value term; it's applied selectively to certain options; and it ignores how the hypothesis might relocate rather than eliminate stakes. They want to distinguish this from related concepts like motivated reasoning, Pascal's mugging, or debunking arguments.

  Hmm, the core issue seems to be the *asymmetric treatment* of a hypothesis within a decision-theoretic framework. The hypothesis is only allowed to lower expected value by reducing probabilities for disfavored projects, while its implications for increasing payoffs (e.g., multiple simulations) or affecting other options are ignored. In the second form, the same hypothesis is opportunistically used to both deflate and inflate different projects without consistency.

  I recall that in decision theory, expected value calculations require coherently applying all relevant information across all terms. What the user describes feels like a violation of that coherence. The term "hypothetical selective application" comes to mind, but that's descriptive, not technical. "Selective scepticism" captures the asymmetry but is too broad. 

  Ah! The pattern resembles what's sometimes called "motivated stopping" in probabilistic reasoning—where one stops considering a hypothesis's implications once it delivers the desired result. But that's not a formal term. The closest established concept might be "partial conditionalization," where an agent updates beliefs partially rather than fully. However, that's not quite specific enough.

  For a new term, "opportunistic sceptical discounting" (OSD) seems apt. It emphasizes the one-sided application to discount disfavored options. We could define it precisely: the introduction of a sceptical hypothesis that reduces the probability weight of a dispreferred option's outcomes without proportionally adjusting other affected parameters (payoff magnitude, stake location, alternative options) and while resisting symmetric applications that would increase expected value.

  Boundary cases:  
  - Principled time-discounting based on termination risk accumulation (not OSD).  
  - Fully consistent application where payoffs are adjusted under the hypothesis (not OSD).  
  - Using the hypothesis only to increase stakes (inverted OSD).  
  - Explicit but bad justifications for asymmetry (still OSD if opportunistic).

  The user also asks if symmetric application kills fanaticism or relocates it. Interesting! If applied symmetrically, the simulation hypothesis might not reduce long-term stakes at all—it could transfer fanaticism to influencing simulators or across multiple simulations. The initial dampening effect likely depended entirely on the asymmetry.  

  This feels like a solid framework. The user gets a precise label with diagnostic criteria, boundary cases, and an answer to their final question about fanaticism. The term "opportunistic sceptical discounting" should serve their chapter well.
answer: |-
  Based on your description, this specific pattern of argumentative asymmetry lacks a single, universally established name. However, we can define and name it precisely for your purposes. The core issue is the **opportunistic, partial, and inconsistent application of a sceptical hypothesis within an expected value calculation to selectively depress the value of a dispreferred option while insulating other terms, options, or favored uses of the same hypothesis.**

  **Proposed Name:** **Opportunistic Sceptical Discounting (OSD)**  
  *(Alternatively: Asymmetric Hypothesis Leveraging, Selective Sceptical Integration)*

  **Definition:** Opportunistic Sceptical Discounting (OSD) occurs when a sceptical scenario (e.g., simulation termination) is introduced into an expected value (EV) calculation *only* to multiplicatively reduce the probability weight assigned to the positive outcomes of a specific dispreferred option (often a long-term intervention), while systematically neglecting to:
  1.  **Adjust the Value Term:** Re-evaluate the magnitude, scope, or location of the potential payoffs *conditional on the hypothesis being true* (e.g., ignoring potential payoff inflation due to multiple simulations or relocated stakes to the simulator level).
  2.  **Apply Consistently to Alternatives:** Apply the same sceptical discount proportionally to near-term alternatives whose outcomes also depend on the scenario not terminating within *their* relevant timeframe.
  3.  **Explore Symmetric Upsides:** Consider ways the hypothesis could *increase* the EV of the dispreferred option or *other* options (e.g., "simulator influence" as a positive reason for a different expenditure).

  **Key Differentiators:**

  1.  **vs. Motivated Reasoning / Confirmation Bias:** OSD isn't primarily about *which evidence is considered* but about *how a single piece of evidence (the hypothesis) is selectively integrated into the formal structure of an EV calculation*. It targets the *internal coherence* of the calculation for one option.
  2.  **vs. Pascal's Mugging Scepticism:** Pascal's Mugging focuses on implausibly huge payoffs making tiny probabilities dominate. OSD focuses on how a *specific plausible sceptical hypothesis* is used *asymmetrically* within the EV framework, regardless of payoff size. It's about *differential treatment* of the hypothesis.
  3.  **vs. Global Debunking / Self-Undermining Arguments:** Debunking aims to undermine a whole class of beliefs. OSD is local: it targets a *specific computation* for a *specific option* while leaving other beliefs and computations (even using the *same* hypothesis elsewhere) strangely intact or leveraged differently. It's computational sabotage, not global epistemic collapse.
  4.  **vs. Undercutting vs. Rebutting Defeaters:** This distinction classifies *how* evidence attacks a belief (undermining the connection vs. providing counter-evidence). OSD describes a *pattern of deployment* of a hypothesis *within a decision-theoretic framework*, not the evidential relation itself. The hypothesis *could* function as an undercutter, but OSD specifies the *inconsistent application*.
  5.  **vs. First-Order Termination Risk:** The *claim* that a simulation would likely terminate is substantive. OSD is the *argumentative move* of using that claim only to discount the probability term of one option's EV, ignoring its other necessary implications within the model.

  **Boundary Cases & Diagnostics:**

  1.  **Principled Time-Horizon Discount (Not OSD):** *"If termination probability accumulates linearly with time at rate `r` per year, then the probability weight for an outcome at time `T` should be discounted by `e^{-rT}`. This discount applies equally to the EV calculations for *all* projects scaled by their relevant time horizon `T`, and only affects the probability term. Payoffs are not re-evaluated under the hypothesis because the hypothesis *only* implies termination risk, not altered payoff structures."* **Diagnostic:** Consistent, proportional application across options based solely on time-dependence; no hidden asymmetry.
  2.  **Adjusted Probability & Payoff (Not OSD):** *"If we're in a simulation, the probability of our project affecting the *real* long-term future is low (termination risk). However, conditional on it succeeding *within the sim*, the number of beings affected might be vastly larger (multiple sims) or the value might lie in influencing the simulators. Therefore, under the sim hypothesis, the EV becomes [P(sim) * (P(success|sim) * V_adjusted(sim))] + [P(real) * (P(success|real) * V(real))]."* **Diagnostic:** The hypothesis is used to conditionally redefine *both* probability *and* value terms within the EV structure.
  3.  **Purely Upside Application (Inverted OSD):** *"The simulation hypothesis *increases* the stakes! If we're being watched, our actions now could influence the simulators' future behavior towards countless other simulations or their own development. This makes near-term moral or existential investments *more* valuable, not less."* (Applied consistently, this avoids OSD. Applied only to favor a pet project while ignoring it elsewhere, it becomes OSD's optimistic twin).
  4.  **Explicit Bad Reason (Still OSD):** *"We discount the long-term project's probability by the sim risk because it targets the far future where termination likely occurs. We don't discount near-term projects because termination is negligible soon. We don't adjust the payoff size because... well, we're just concerned about *our* future being cut short, not hypothetical others. We use the sim hypothesis positively for project B because influencing watchers is a distinct, local opportunity."* **Diagnostic for Opportunism:** The asymmetry is acknowledged but justified with reasons that are inconsistent (e.g., caring only about "our" future ignores that the sim hypothesis fundamentally challenges what "our" means; the "distinct opportunity" claim ignores that the same hypothesis enabling it also threatens near-term projects, however slightly). The justifications fail to fully grapple with the hypothesis's implications, revealing opportunism.

  **Symmetrical Application and Fanaticism:**

  If the simulation hypothesis is applied **symmetrically and coherently** within the EV framework (e.g., adjusting probabilities for termination risk *and* adjusting payoff magnitudes/locations conditional on the hypothesis), the **dampening effect on far-future fanaticism largely disappears or transforms significantly**:

  1.  **Termination Risk vs. Payoff Inflation:** The probability discount from termination risk might be counterbalanced or even overwhelmed by the potential inflation of the payoff magnitude if success affects multiple simulated instances or a simulator civilization. The net effect on EV is ambiguous without concrete parameter estimates.
  2.  **Relocation of Stakes:** Instead of eliminating stakes, the hypothesis *relocates* them. The "far future" might now mean the future of the simulators or the aggregate future of all simulations. Actions aimed at influencing the simulators (e.g., demonstrating value, avoiding shutdown triggers) could become the new locus of "fanatical" concern. The long-term fanaticism isn't dampened; it's redirected.
  3.  **Preservation of High Stakes:** A coherent symmetric treatment often preserves the possibility of astronomically large stakes, just located differently (e.g., affecting the simulators' vast future). Fanaticism driven by tiny probabilities of vast payoffs can easily re-emerge in this relocated context (e.g., tiny chance our actions profoundly alter the simulators' trajectory).

  **Conclusion:** The pattern you've identified is **Opportunistic Sceptical Discounting (OSD)**. It exploits a sceptical hypothesis to selectively depress the EV of a dispreferred option by applying it only to the probability term while shielding the value term, alternative options, and potential upside applications. The principled time-discount is its non-opportunistic cousin. When applied symmetrically, the hypothesis doesn't reliably dampen long-term fanaticism; it often merely transfers or preserves it under a different ontology. The dampening observed in the opportunistic use crucially depended on the selective *neglect* of the hypothesis's other implications.
