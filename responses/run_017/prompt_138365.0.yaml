     - **If Overruled:** If the module presented Non-Reductionism as inherently dualist, the student’s answer might be acceptable. But standard readings (e.g., Shoemaker’s materialist Non-Reductionism) reject this.  

  **Recommendation:** Highlight contestable comments to the convenor for review. The student’s grasp of Reductionism/R is strong, but errors in framing Non-Reductionism and omissions in applying R to chains/fission timing cost marks.
