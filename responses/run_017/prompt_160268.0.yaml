prompt: |-
  I'm a TA for an undergrad seminar on philosophy of law — 18 students, one 90-minute slot, a whiteboard, index cards, and a projector I'd rather not use. Last week we did the rule of recognition and what happens when a legal order tries to regulate its own amendment, and it went about as well as you'd expect: they treated self-reference as a cute puzzle rather than as something that happens to you. So I want to run them through a short game instead, something in the neighbourhood of Nomic, that game from the early 80s where changing the rules is itself a legal move, but compressed and rigged so the interesting stuff shows up inside 90 minutes instead of after six weeks of mailing-list play. Assume they've read nothing and have never heard the word immutable applied to a rule.

  Three things I want them to feel rather than be told. First, that a pile of amendable rules needs a fixed point somewhere, and that where that fixed point sits is itself something you'd have to legislate. Second, the difference between changing what a rule says and changing which tier of the hierarchy the rule occupies — in my notes I'm calling this a jurisdiction move: a proposal that never touches a rule's wording but reclassifies it, say, from mutable to entrenched or back. Third, that the paradoxes arrive as exploits somebody wants to pull off, not as exam questions. Two devices I've been playing with, which you should build in or replace if you think they're clumsy: a Janus clause, a form of proposal that specifies its own adoption conditions (this amendment passes if it gets a majority, or if it gets five votes, whichever is easier), so a proposal can fail under the standing procedure and pass under the procedure it would install; and provisional rules, which take effect the moment they're proposed and dissolve retroactively if they aren't ratified within a couple of rounds, so there's a window in which people act under a rule that may turn out never to have existed. For the rest, assume I'll hand out a short initial ruleset — maybe three tiers, mutable / entrenched / a single inviolate rule, plus a transmutation rule that is itself only entrenched, plus a rotating clerk whose default ruling a majority can override — and private mandate cards so everyone has something to protect and something to raid: you score for how well the final ruleset matches your mandate, not for winning votes, though you also get a small public token for each proposal of yours that passes (winner picks next week's reading, and there may be a coffe voucher in it). Nobody should hear phrases like inviolate level or self-amendment until the debrief.

  What I want from you is a thing I can actually run: the exact initial ruleset, short enough for one printed page and worded so I can just hand it over; the mandate cards; turn order and a timeline, including how much of the 90 minutes goes to play versus debrief; the adjudication mechanics, including what happens when what's disputed is the clerk's own authority; and what I do when it derails. Then a debrief that maps specific moments I should be watching for onto the ideas — especially the moment somebody tries to lock in their own favourite rule at the inviolate level, and the moment when a proposal's legality depends on the outcome that proposal would bring about — plus an honest note about which feature of the problem the game can't produce and I'll have to say out loud at the end. Last year I handed them the standard published ruleset and one guy immediately proposed that he wins, and the session was over in twelve minutes, so also tell me what will predictably go wrong and how to steer it back without me turning into the lecturer.
reasoning: |-
  Okay, the user is a teaching assistant (TA) for an undergraduate seminar on philosophy of law. They have 18 students and one 90-minute session. They want to create an interactive game to illustrate concepts like the rule of recognition, self-amendment paradoxes, and the necessity of a fixed point in legal systems. Last week's session didn't go well because students treated self-reference as a puzzle rather than something impactful. 

  The TA wants students to experience three key ideas: the need for a fixed point in amendable rules, the difference between changing rule content versus its hierarchical tier, and how paradoxes emerge as exploits. They suggest using "Janus clauses" (proposals that define their own adoption conditions) and "provisional rules" (temporary rules that dissolve if not ratified). The game should avoid terms like "inviolate level" until debrief. 

  The TA needs a practical, time-bound game setup: initial ruleset, mandate cards, turn order, timeline, adjudication mechanics, debrief points, and contingency plans. They mention a past failure where a student proposed "I win" immediately, ending the game prematurely, so safeguards against such exploits are crucial.

  First, I need to design a game that fits within 45 minutes of playtime. The initial ruleset must be simple—one page max—with clear tiers: Mutable, Entrenched, and one Inviolate rule. Including a transmutation rule (entrenched) for changing tiers is key. A rotating clerk role with overridable rulings adds dynamism. 

  For mandates, each student gets a card with a specific rule to protect/attack and a scoring incentive. This ensures engagement beyond winning votes. Including public tokens for successful proposals (like picking next week's reading) adds motivation. 

  Turn structure: 30-second proposals, 1-minute discussion, vote, then clerk adjudication. Rotating proposer order prevents monopolization. Timeline: 5 min setup, 45 min play, 5 min cool-down, 35 min debrief. 

  Adjudication mechanics: Clerk resolves disputes, but majority can override. If the clerk's authority is challenged, it defaults to the initial ruleset’s hierarchy. 

  Contingencies: Preemptive rules to block meta-exploits (e.g., "I win" proposals). If derailment occurs, pause and revert to initial rules. Emphasize that proposals must target existing rules. 

  Debrief points: Highlight when someone tries to entrench their rule at the inviolate tier, or when a Janus clause creates outcome-dependent legality. Note that the game may not fully show how real systems avoid paradoxes via external anchors—mention this in closing. 

  Key watch moments: Exploits using provisional rules, tier-jumping tactics, and unintended consequences of self-referential proposals. The TA should subtly guide without lecturing. 

  Finally, honesty: The game simplifies real-world complexity; emphasize that real constitutions rely on shared beliefs, not just rules.
answer: |-
  Here's a complete, runnable 90-minute game designed to create "aha moments" about rule hierarchies and self-amendment, while avoiding instant collapse:

  **Game Title:** *The Rulemakers*

  ### Initial Ruleset (1-Page Handout)
  **HEADER: THESE RULES ARE IN EFFECT UNTIL AMENDED OR REPLACED FOLLOWING THE PROCEDURES BELOW. THE CLERK RESOLVES DISPUTES.**

  1.  **The Inviolate Rule (Cannot be amended or repealed):**  
      *"The Clerk must enforce all valid rules."*

  2.  **Entrenched Rules (Require 12+ votes to amend/repeal):**  
      - *Rule A: Each player has one vote.*  
      - *Rule B: To pass, a proposal must receive more 'Aye' votes than 'Nay' votes, unless a higher rule says otherwise.*  
      - *Rule C: Rules can be moved between tiers. Moving a rule to Entrenched requires 12 votes. Moving a rule to Mutable requires 8 votes. The Inviolate tier has only Rule 1.*  

  3.  **Mutable Rules (Require 6+ votes to amend/repeal):**  
      - *Rule D: A proposal takes effect only if it clearly states which existing rule(s) it changes and how.*  
      - *Rule E: Each round proceeds: Propose → Discuss (1 min) → Vote → Clerk Adjudicates.*  
      - *Rule F: The Clerk rotates each round to the next player in seating order.*  

  4.  **Provisional Rules:**  
      *Any player may declare a new Provisional Rule. It takes effect IMMEDIATELY. If it isn’t ratified as a Mutable/Entrenched Rule within 2 full rounds, it vanishes retroactively. Ratification requires normal votes for its target tier.*

  5.  **Janus Clause:**  
      *A proposal may include its own adoption condition (e.g., "This passes if it gets 5 votes"). If the condition is met, it passes regardless of other rules. If not, it fails.*

  6.  **Adjudication:**  
      *The Clerk resolves disputes about rule conflicts or violations. A majority vote (more Aye than Nay) overrules the Clerk’s decision. Challenges to the Clerk’s authority are resolved by Rule 1.*

  ---

  ### Mandate Cards (18 Unique Examples - Key: PROTECT / ATTACK / SCORING TRIGGER)
  *Hand these out secretly. Students score **2 points** if their PROTECT rule matches the final ruleset tier, **1 point** if their ATTACK rule is absent/demoted, and **1 token** per successful proposal they sponsor.*  
  *(Tokens = coffee voucher + influence on next reading)*

  1.  PROTECT: Rule A (Entrenched) / ATTACK: Rule E (Mutable) / SCORE IF: Rule D is Mutable  
  2.  PROTECT: Rule B (Entrenched) / ATTACK: Rule F (Mutable) / SCORE IF: No Provisional Rules exist at game end  
  3.  PROTECT: Rule C (Entrenched) / ATTACK: Rule A (Entrenched) / SCORE IF: A Janus Clause passed  
  4.  PROTECT: Rule D (Mutable) / ATTACK: Rule B (Entrenched) / SCORE IF: Clerk was overruled at least once  
  5.  PROTECT: Rule E (Mutable) / ATTACK: Rule C (Entrenched) / SCORE IF: Rule F is Entrenched  
  6.  PROTECT: Rule F (Mutable) / ATTACK: Rule D (Mutable) / SCORE IF: Any rule moved tiers twice  
  ...*(Rotate PROTECT/ATTACK/TRIGGER combos for all 18, ensuring conflicts and tier-jumping incentives)*  

  ---

  ### Turn Order & Timeline (Total: 90 mins)
  1.  **Setup (5 mins):**  
      - Hand out Ruleset + Mandate Cards. Assign seats. First Clerk = volunteer.  
      - *TA Briefing: "Your goal is on your card. Propose rule changes following the sheet. Clerk interprets rules. Majority can overrule Clerk. Provisional rules exist temporarily unless made permanent. Start!"*  

  2.  **Gameplay (45 mins):**  
      - **Rounds** (Aim for 8-10 rounds):  
          1. **Propose (30 sec):** Current player makes a proposal (*must cite which rule they're changing & how*).  
          2. **Discuss (1 min):** Open debate. Keep time strictly!  
          3. **Vote (30 sec):** All vote Aye/Nay (including proposer). Clerk tallies.  
          4. **Adjudicate (1 min):** Clerk resolves disputes ("Is this valid under Rule D?"). Majority can overrule.  
          5. **Rotate:** Clerk moves to next player.  
      - **Provisional Rules:** Can be declared *anytime* (even mid-discussion!). Write it on the board with "⏳" + time of declaration.  

  3.  **Cool-Down (5 mins):**  
      - "No new proposals. Resolve remaining Provisional Rule ratifications. Finalize scores."  

  4.  **Debrief (35 mins):** *(Structure below)*  

  ---

  ### Adjudication Mechanics
  - **Clerk’s Role:** Interprets rules *as written* during disputes (e.g., "Does Proposal X violate Rule D?"). States ruling clearly.  
  - **Overruling:** Any player shouts "Challenge!" after ruling. Immediate vote: Majority Aye = Clerk's ruling overturned.  
  - **Clerk’s Authority Dispute:** Invoke **Rule 1 (Inviolate)**. Clerk *must* enforce existing rules. Challenge can only target *how* Clerk applied Rule 1 (overrulable by majority).  
  - **Validity Check:** Clerk *must* reject proposals that:  
    - Don’t specify target rule(s) (Rule D).  
    - Attempt to amend the Inviolate rule (Rule 1).  
    - Are logically incoherent (e.g., "Repeal all rules including this one").  

  ---

  ### Steering & Contingencies
  - **Predictable Derailments & Fixes:**  
    - *"I Win" Proposal:* Clerk rejects under Rule D ("Doesn’t specify target rule"). If challenged, overrule vote *will* fail (no mandate alignment). **TA Script:** "Clerk says invalid. Who challenges? [If challenged] Vote: Aye to overturn Clerk? [Likely fails] Motion fails. Next proposal."  
    - **Infinite Meta-Loop:** Players obsess over Clerk/Adjudication rules. **TA Script:** Whisper to next proposer: "Check your mandate card’s SCORE IF condition."  
    - **Tyranny of Majority:** Minority disengages. **Mitigation:** Mandate cards incentivize niche strategies (e.g., exploiting Janus/Provisional rules).  
    - **Chaos from Provisionals:** Clerk enforces them strictly *until ratified or expired*. Retroactive dissolution causes fun chaos ("Wait, was that vote even legal?").  
  - **Gameplay Stall:** If no proposals in 2 rounds, TA whispers: "Remember Provisional Rules let you act *now*" or "Janus Clauses can bypass voting thresholds."  
  - **Critical Intervention:** Only pause if rules become incoherent (e.g., no valid Clerk). **TA Script:** "Game paused. Clerk invokes Rule 1. We revert to the last coherent ruleset [point to board]. Proceed."  

  ---

  ### Debrief Guide (Map Moments to Concepts)
  **Watch For & Highlight:**  
  1.  **The Fixed Point:** When someone tries to *move Rule 1 (Inviolate)* or create *another* Inviolate rule. **Debrief Q:** "Why couldn’t they do it? What would happen if *nothing* was inviolate?" → Link to **foundational authority needing an unchangeable anchor.**  
  2.  **Tier-Jumping (Jurisdiction Move):** When a player moves Rule B (voting) from Entrenched to Mutable with 8 votes (Rule C). **Debrief Q:** "What changed about Rule B? Not its words, but its...? Why is that power *itself* only Entrenched?" → **Amending a rule vs. amending its amendability.**  
  3.  **Janus Exploit:** "This proposal passes if it gets 3 votes." *Gets 3 votes.* **Debrief Q:** "Why did this work? Could it pass *under current rules* AND *under its own rules*? What if its condition *conflicted* with Rule B?" → **Self-validation creates circularity; legality depends on outcome.**  
  4.  **Provisional Gambit:** A player declares "Provisional Rule: Only left-handed players can vote!" → Chaos ensues → It fails ratification. **Debrief Q:** "Were those two rounds 'legal'? What does 'retroactively dissolved' imply about legal existence?" → **Contingent validity creates uncertainty; systems need closure mechanisms.**  
  5.  **Clerk Overruled:** Majority rejects Clerk’s ruling. **Debrief Q:** "Who had the final authority here? What stops this from creating infinite challenges?" → **Even ultimate interpretive authority (Clerk) relies on a rule (Rule 1) that points back to them.**  

  **Honest Limitation Note (End of Debrief):**  
  *"In real life, legal systems don’t just collapse when they’re paradoxical. Why? Because something OUTSIDE the rules – shared beliefs, force, tradition – ultimately backs them up. Our game couldn’t model that external anchor. The 'Inviolate Rule' only worked because you all agreed to play."*  

  ---

  ### Why This Works
  - **Anti-Exploit Design:** Rule D + Clerk validity checks block "I win." Inviolate Rule 1 is minimalist and essential (prevents void). Mandates fragment interests.  
  - **Pressure Cooker:** Strict timers, Provisional Rules, and Janus Clauses force rapid engagement with paradoxes as *tools*, not puzzles.  
  - **TA as Referee, Not Lecturer:** Your role is enforcing procedures & whispering prompts ("Check your mandate") – not explaining concepts until debrief.  
  - **Debrief Roots Theory in Lived Chaos:** Students will reference specific exploits ("When Sam’s Janus clause..."), letting you connect to Hart/Kelsen/etc. organically.  

  Run this tight, and they’ll leave arguing about whether the *real* Rule 1 is the coffee voucher.
