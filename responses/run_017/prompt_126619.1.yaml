answer: |-
  ### Exam Question: Anthropic Reasoning and Welfare Aggregation  
  **Time Allowed:** 45 minutes (within a 3-hour exam)  
  **Total Marks:** 25  

  ---

  #### **Question**  
  Consider a decision-maker who must evaluate policies under uncertainty about which of two cosmological theories \(T_1\) or \(T_2\) is true. The agent’s only indexical evidence is that they exist as an observer in the reference class relevant to the theories. Assume the following:  
  - **Self-Sampling Assumption (SSA):** Credence in \(T_i\) is proportional to the prior probability \(p_i\) of \(T_i\).  
  - **Self-Indication Assumption (SIA):** Credence in \(T_i\) is proportional to \(p_i \times N_i\), where \(N_i\) is the number of observers in the reference class if \(T_i\) is true.  
  - **Priors:** \(p_1 = p_2 = 0.5\).  
  - **Observer counts under each theory:**  
    - \(T_1\): \(N_1\) observers  
    - \(T_2\): \(N_2\) observers.  

  The agent considers a policy \(A\) that yields total welfare \(U_i\) if \(T_i\) is true. Welfare is additive across observers.  

  **Part 1: Fixed Observer Counts (10 marks)**  
  1. Derive the agent’s action rankings under two decision frameworks:  
     - **Framework 1 (SSA + Total Welfare):** Maximize expected *total welfare* using SSA credences.  
     - **Framework 2 (SIA + Average Welfare):** Maximize expected *average welfare* using SIA credences.  
  2. Show that both frameworks rank all actions identically when \(N_1\) and \(N_2\) are *fixed* (independent of \(A\)). Explain why this happens.  

  **Part 2: Variable Observer Counts (10 marks)**  
  Now suppose the agent evaluates a specific policy \(A^*\) that:  
  - Does nothing if \(T_2\) is true (so \(N_2 = 10^{12}\), welfare per observer \(= 100\)).  
  - If \(T_1\) is true, creates \(10^{12}\) *additional* observers, each with welfare \(1\) (so \(N_1 = 10^6 + 10^{12} \approx 10^{12}\), original welfare per observer \(= 100\)).  
  Priors remain \(p_1 = p_2 = 0.5\).  
  1. Calculate the expected welfare per action for \(A^*\) and for "do nothing" under **both frameworks**.  
  2. Show that the frameworks now disagree on whether \(A^*\) is preferable to inaction. Explain the key reason for this divergence.  

  **Part 3: Implications (5 marks)**  
  1. Does the equivalence in Part 1 imply the SSA/SIA dispute is "merely verbal" when observer counts are fixed? Justify your answer.  
  2. Suppose an agent adopts SIA credences but maximizes *total* welfare (not average). How would this affect the action rankings in Part 2?  
  3. **Briefly** comment on one ethical or philosophical concern raised by the divergence in Part 2 (e.g., "dilution pressure," reference classes, or nonlinear welfare).  

  ---

  ### Model Answer (1,150 words)  
  **Part 1: Equivalence under Fixed Observer Counts**  
  Under SSA, the credence for \(T_i\) is \(P_{\text{SSA}}(T_i) = p_i\). The expected total welfare for action \(A\) is:  
  \[
  \mathbb{E}_{\text{SSA+Total}}[A] = \sum_i P_{\text{SSA}}(T_i) \cdot U_i = \sum_i p_i U_i.  
  \]  

  Under SIA, the credence for \(T_i\) is \(P_{\text{SIA}}(T_i) = \frac{p_i N_i}{W}\), where \(W = \sum_j p_j N_j\). The expected *average* welfare is:  
  \[
  \mathbb{E}_{\text{SIA+Avg}}[A] = \sum_i P_{\text{SIA}}(T_i) \cdot \left( \frac{U_i}{N_i} \right) = \sum_i \left( \frac{p_i N_i}{W} \right) \cdot \left( \frac{U_i}{N_i} \right) = \frac{1}{W} \sum_i p_i U_i.  
  \]  
  Since \(W = \sum_j p_j N_j\) is a constant independent of \(A\), both frameworks rank actions by \(\sum_i p_i U_i\). The SIA/average framework divides by \(W\), but as \(W\) does not vary across actions, the *ordinal ranking* is identical. This occurs because SIA’s observer-weighted credence (\(N_i\)) and average welfare’s denominator (\(N_i\)) cancel algebraically, reducing both to weighting \(U_i\) by \(p_i\). Thus, the disagreement appears purely formal: SIA shifts \(N_i\) into the prior, while average welfare shifts it into the utility function, but they neutralize each other.  

  **Part 2: Divergence in the Variable-Count Case**  
  *Given parameters:*  
  - \(T_2\) (no change): \(N_2 = 10^{12}\), total welfare \(U_2 = (10^{12} \times 100) = 10^{14}\).  
  - \(T_1\) (if \(A^*\) implemented): \(N_1 \approx 10^{12}\), total welfare \(U_1 = (10^6 \times 100) + (10^{12} \times 1) \approx 10^{12}\).  
  - "Do nothing" baseline: \(N_1 = 10^6\), \(U_1 = 10^6 \times 100 = 10^8\); \(N_2 = 10^{12}\), \(U_2 = 10^{14}\).  

  **Framework 1 (SSA + Total Welfare):**  
  - \(\mathbb{E}_{\text{SSA+Total}}[\text{Do nothing}] = (0.5 \times 10^8) + (0.5 \times 10^{14}) \approx 5 \times 10^{13}\).  
  - \(\mathbb{E}_{\text{SSA+Total}}[A^*] = (0.5 \times 10^{12}) + (0.5 \times 10^{14}) = 5.05 \times 10^{13}\).  
  - **Verdict:** \(A^*\) is preferred (adds \(5 \times 10^{11}\) in expectation).  

  **Framework 2 (SIA + Average Welfare):**  
  First, compute \(W\) for \(A^*\) and "do nothing":  
  - For "do nothing": \(W_{\text{null}} = p_1 N_1 + p_2 N_2 = (0.5 \times 10^6) + (0.5 \times 10^{12}) \approx 5 \times 10^{11}\).  
  - For \(A^*\): \(W_{A^*} = p_1 N_1^{\text{new}} + p_2 N_2 = (0.5 \times 10^{12}) + (0.5 \times 10^{12}) = 10^{12}\).  

  Now compute expected average welfare:  
  - "Do nothing":  
    \[
    \mathbb{E}_{\text{SIA+Avg}}[\text{null}] = \frac{1}{W_{\text{null}}} \left[ P_{\text{SIA}}(T_1) \cdot \frac{U_1}{N_1} + P_{\text{SIA}}(T_2) \cdot \frac{U_2}{N_2} \right] = \frac{1}{5 \times 10^{11}} \left[ \left( \frac{0.5 \times 10^6}{5 \times 10^{11}} \times 100 \right) + \left( \frac{0.5 \times 10^{12}}{5 \times 10^{11}} \times 100 \right) \right] \approx 100.
    \]  
  - \(A^*\):  
    \[
    \mathbb{E}_{\text{SIA+Avg}}[A^*] = \frac{1}{W_{A^*}} \left[ \left( \frac{0.5 \times 10^{12}}{10^{12}} \times \frac{10^{12}}{10^{12}} \right) + \left( \frac{0.5 \times 10^{12}}{10^{12}} \times 100 \right) \right] = \frac{1}{10^{12}} \left[ (0.5 \times 1) + (0.5 \times 100) \right] \approx 50.5.
    \]  
  - **Verdict:** "Do nothing" is preferred (100 > 50.5).  

  **Reason for Divergence:** When \(A^*\) changes \(N_1\), it alters \(P_{\text{SIA}}(T_i)\) because SIA’s credences depend on observer counts, which are now action-dependent. Under SIA, creating observers in \(T_1\) increases credence in \(T_1\) (from \(\sim 0\) to \(0.5\)), and these new observers have low welfare (1 vs. 100), dragging down the average. Meanwhile, SSA’s fixed prior ignores population changes, so it only sees the total welfare gain. The "canceling \(N_i\)" from Part 1 fails because \(N_i\) is no longer a fixed parameter.  

  **Part 3: Implications**  
  1. **Verbal Dispute?** The equivalence in Part 1 does *not* render SSA/SIA "merely verbal" under fixed populations. While they agree on actions, they disagree on *why*: SSA treats observer count as irrelevant to credence but central to aggregation, while SIA treats it as central to credence but irrelevant to aggregation. This reflects divergent views on whether "being an observer" is evidence for a theory (SIA) or a neutral condition (SSA). The dispute is metaphysical, not pragmatic.  
  2. **SIA with Total Welfare:** If we pair SIA with *total* welfare maximization, the expected utility for \(A^*\) becomes:  
     \[
     \mathbb{E}_{\text{SIA+Total}}[A^*] = \sum_i P_{\text{SIA}}(T_i) U_i = \left( \frac{0.5 \times 10^{12}}{10^{12}} \times 10^{12} \right) + \left( \frac{0.5 \times 10^{12}}{10^{12}} \times 10^{14} \right) = 0.5 \times 10^{12} + 0.5 \times 10^{14} \approx 5.05 \times 10^{13},  
     \]  
     matching SSA+Total. Thus, the key conflict is not SSA vs. SIA *alone*, but the *combination* with the welfare aggregation rule.  
  3. **Ethical Concern:** The divergence reveals SIA+Average’s **dilution pressure** – it disincentivizes creating modest-welfare observers because they reduce expected average welfare by increasing credence in worlds containing them. This mirrors the "repugnant conclusion" in population ethics, where averaging prioritizes small, high-welfare populations. SSA+Total avoids this but faces objections of "presumptuousness" (ignoring observer-count evidence).  

  **Caveat (Extra Credit):** The equivalence assumes welfare is linear and additive. If utilities diminish marginally (e.g., prioritarianism), average and total welfare no longer interconvert linearly, breaking equivalence even with fixed \(N_i\).  

  ---

  ### Marking Scheme (25 marks total)  
  **Part 1: Fixed Observer Counts (10 marks)**  
  - **Derive SSA+Total ranking** (2 marks): Correct formula \(\sum p_i U_i\).  
  - **Derive SIA+Average ranking** (4 marks):  
    - Correct SIA credence \(\frac{p_i N_i}{W}\) (1 mark).  
    - Correct average welfare \(\frac{U_i}{N_i}\) (1 mark).  
    - Cancel \(N_i\) to show \(\frac{1}{W} \sum p_i U_i\) (2 marks).  
  - **Explain equivalence** (4 marks):  
    - \(W\) constant → same ordinal ranking (2 marks).  
    - \(N_i\) shifts from prior (SIA) to utility (Average) but cancels (2 marks).  
    *Penalty:* Failure to cancel \(N_i\) (-3 marks).  

  **Part 2: Variable Observer Counts (10 marks)**  
  - **SSA+Total calculations** (3 marks):  
    - Correct "do nothing" \(\approx 5 \times 10^{13}\) (1 mark).  
    - Correct \(A^* = 5.05 \times 10^{13}\) (1 mark).  
    - \(A^*\) preferred (1 mark).  
  - **SIA+Average calculations** (5 marks):  
    - Compute \(W\) for both actions (2 marks).  
    - Correct \(P_{\text{SIA}}(T_i)\) for each action (1 mark).  
    - Correct average welfare: null ≈100, \(A^*\) ≈50.5 (2 marks).  
    *Penalty:* Using fixed \(W\) (-2 marks).  
  - **Explain divergence** (2 marks): Action-dependent \(N_i\) alters SIA credences and breaks \(N_i\) cancellation.  

  **Part 3: Implications (5 marks)**  
  1. **Verbal dispute?** (2 marks): Reject "merely verbal," cite divergent justifications (e.g., evidentiary role of observer count).  
  2. **SIA+Total** (1 mark): Matches SSA+Total (show calculation or state result).  
  3. **Ethical concern** (2 marks): Identify dilution pressure or equivalent; link to population ethics.  
  - **Extra Credit** (1 mark): Note nonlinear welfare breaks equivalence.  

  **Grade Boundaries:**  
  - **A (21–25):** Correct math in Parts 1–2, articulate why equivalence breaks, coherent implications.  
  - **B (16–20):** Minor math errors, vague divergence explanation, weak implications.  
  - **C (10–15):** Major derivation errors (e.g., no \(N_i\) cancellation), incorrect flip-case rankings.  
  - **D (5–9):** Incomplete attempts, misstated SSA/SIA.  
  - **E (0–4):** Minimal progress.  

  **Automatic B Cap:** Failure to derive *both* frameworks in Part 1 (max 20/25).  
  **Top Marks Require:** Correct calculations, clear "double role of \(N_i\)" explanation in Part 2, and nuanced implications in Part 3.  

  ---  
  This question tests technical derivation, conceptual synthesis, and ethical reasoning without relying on literature recall. The flip case forces students to see SSA/SIA as components of a decision framework, not isolated principles.
