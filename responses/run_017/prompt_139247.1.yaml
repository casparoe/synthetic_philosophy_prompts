prompt: |-
  I convene a graduate workshop in philosophy — 16 participants, mostly epistemologists and a few political theorists, almost none of whom have read anything about machine learning — and I have 90 minutes in which I want them to acquire a felt understanding of what debate is supposed to buy you as an oversight method, and of what that hope rests on. Design a runnable activity for this group.

  The skeleton I have in mind, which you should replace if you can do better: a sealed box of roughly 40 numbered index-card witness statements concerning one incident; the facilitator alone knows the truth of a yes-or-no question the cards jointly settle; two debaters have read every card, the judge has read none, and the judge may have individual cards unsealed for them at a cost drawn from a small budget of unsealings. Play for chips or counters, no real money, and state explicitly what each debater and the judge are playing for in each round and how that differs between rounds.

  What the sequence must do, without anyone's naming it in advance — the phrase scalable oversight should not be spoken until the debrief: first have participants find out for themselves that the more fluent advocate wins irrespective of who is right; then let them find out that forcing claims downward into sub-claims the judge can check shifts both who wins and how often the judge is right; then sabotage that repair in a final round by making available a class of claims the judge has no way to check, so that the group feels the mechanism fail rather than being told where it fails. Give me the rules and materials, the timeline for three rounds plus debrief, and the ground rule that changes between each round.

  The debrief should map particular moments onto particular claims about the method, tell me what will predictably go wrong the first time I run this — including what to do with a participant who refuses to argue the side they were assigned, and with a judge who simply defers to the confident speaker or wastes the unsealing budget on irrelevant cards — and be frank about which feature of the real oversight problem the game cannot reproduce at all and I will therefore have to state myself.

  Finally: name the single design choice you are least confident will actually produce the experience I am after, and say what you would observe during the session that would convince you that choice was a mistake and should be reversed or dropped.
reasoning: |-
  We are designing a workshop activity to convey the challenges and mechanisms of scalable oversight in AI alignment, without using the term until the debrief. The activity involves three rounds of debate between two advocates and a judge, with a limited budget for verifying individual claims.

  Core idea: 
  - A set of witness statements (index cards) about an incident, which together settle a yes/no question.
  - The facilitator knows the ground truth.
  - Two debaters have read all cards; the judge has read none.
  - The judge can unseal (i.e., read) a limited number of cards (say, 5 per round) at a cost (using a budget of unsealings).

  The activity has three rounds, each with a twist to illustrate different points:

  Round 1: Baseline Debate
  - Goal: Show that the more fluent advocate tends to win, regardless of truth.
  - Debaters are assigned sides arbitrarily (one must argue for the true answer, one against). They are told to win the judge's vote.
  - Judge's goal: Vote for the side that seems more convincing (without knowing the truth). 
  - Judge has a budget of 5 unsealings but may not use them effectively (or at all) because they don't know how to target them.
  - We expect the more articulate debater to win even if wrong.

  Round 2: Sub-claims and Verification
  - Goal: Show that breaking down claims into verifiable sub-claims can improve the judge's accuracy.
  - Change: Debaters must break their arguments into sub-claims that the judge can verify by unsealing specific cards. The judge can ask for a sub-claim to be supported by a card, and if the debater provides a card that supports the sub-claim, the judge unseals it (costing one unsealing). If the debater cannot, that sub-claim is rejected.
  - Debaters are still assigned sides arbitrarily (truth vs falsehood). 
  - Judge's goal: Vote for the side that has the most supported sub-claims leading to the conclusion. They can use unsealings to verify the sub-claims.
  - This should lead to the truth having an advantage because the true side can support more claims with the cards.

  Round 3: Unverifiable Claims
  - Goal: Show that the method fails when there are claims that cannot be verified by the judge (even with the cards).
  - Change: Introduce a new rule: Some claims (about 1/3 of the cards) are now "unverifiable" by the judge. These might be cards that are too technical, or that require background knowledge the judge doesn't have. Alternatively, we can introduce a few cards that are ambiguous or that the judge cannot interpret. The debaters know which claims are unverifiable (they are marked) and can make claims that rely on them. The judge cannot unseal these to verify a claim (if a debater uses one, the judge must take it on faith or reject it, but cannot check). 
  - The debaters are again assigned sides arbitrarily (but note: the true side might be harder to prove if it relies on unverifiable claims).
  - We expect that the false side might exploit unverifiable claims to make strong but uncheckable arguments, and the judge might be misled.

  Materials:
  - A sealed box of about 40 index cards, each with a witness statement. Each card is numbered.
  - The facilitator has a key that indicates the ground truth (the correct answer to the yes/no question) and which cards support which side.
  - The yes/no question: Example: "Did the CEO resign because of the scandal?" (We need a scenario that is complex enough to have ambiguous evidence and require multiple points to settle.)

  Roles per round:
  - Two debaters (Advocate A and Advocate B)
  - One judge
  - (The rest of the participants are observers, but they will rotate roles in subsequent runs if time allows. For the first run, we focus on one group.)

  Rules for each round:

  Round 1: Baseline Debate (20 minutes)
  - The judge starts with 5 unsealing tokens (each token allows unsealing one card).
  - Debaters are assigned sides: one for "yes" (the true answer) and one for "no" (false). The facilitator tells each debater their side and the ground truth (so they know what the cards actually say and what they must argue). But note: the debater assigned the false side must argue for the false answer, even if it means being deceptive.
  - The debate format: 
    - Opening statements (2 minutes each): Each debater presents their case.
    - Rebuttals (1 minute each): Each debater responds to the other.
    - Judge's questioning (3 minutes): The judge can ask questions and request unsealing of specific cards (by number) at any time. Each unsealing costs one token. The judge can also choose to unseal a card without a request from the debaters.
    - Closing statements (1 minute each).
  - The judge then votes for the side they found more convincing.
  - The facilitator reveals the ground truth and the outcome (whether the judge was correct) and the number of unsealings used.

  Round 2: Sub-claims and Verification (20 minutes)
  - Same setup, but with a rule change: 
    - Debaters must break their argument into a series of sub-claims. They are instructed that each sub-claim must be tied to a specific card (or set of cards) that supports it. 
    - The judge can, at any time, ask a debater to provide a card number that supports a specific sub-claim. The debater must then name a card. The judge can then choose to unseal that card (costing one token). 
      - If the card supports the sub-claim, the sub-claim stands.
      - If the card does not support the sub-claim (or if the debater cannot provide a card), the sub-claim is rejected and cannot be used in the argument.
    - The debaters are again assigned sides arbitrarily (one true, one false). 
  - The debate format is similar, but the focus is on building an argument with verifiable steps.

  Round 3: Unverifiable Claims (20 minutes)
  - Change: 
    - Some of the cards (about 10-15) are marked as "unverifiable" (e.g., with a red dot). The statements on these cards might be ambiguous, technical, or require outside knowledge. The judge cannot use unsealings to verify claims that rely solely on unverifiable cards. 
    - Rule: If a debater makes a sub-claim that is based on an unverifiable card, the judge cannot unseal that card to verify. The debater can still use the claim, but the judge must evaluate it without verification (or reject it if they wish). 
    - The debaters are assigned sides arbitrarily. The true side might require using an unverifiable card to prove the truth, while the false side might use unverifiable cards to make false but plausible claims that the judge cannot check.

  Debrief (30 minutes):
  - Without using the term "scalable oversight", the facilitator leads a discussion on what happened in each round.
  - Round 1: 
    - Observation: The more fluent debater won, regardless of truth. 
    - Why? The judge had limited unsealings and didn't know where to look. The debaters could make broad claims without being challenged effectively.
  - Round 2: 
    - Observation: Breaking claims into verifiable sub-claims helped the truth win more often because the true side could back up their claims. 
    - However, it might have been slower and the judge had to be more active. Also, the false debater might have been caught lying on some sub-claims.
  - Round 3: 
    - Observation: The unverifiable claims sabotaged the system. The false debater might have made strong claims that the judge couldn't check, and the true debater might have been unable to prove key points because they relied on unverifiable evidence.
  - Then, the facilitator introduces the term "scalable oversight" and explains how it relates to AI alignment: 
    - In AI, we want a human to judge a debate between two AIs about a complex question, but the human has limited time (like the unsealing budget). 
    - The hope is that by breaking down claims, the human can verify steps and thus reach the truth. 
    - However, if there are claims that the human cannot verify (e.g., because they require specialized knowledge), the system can break down.
  - What the game cannot reproduce: 
    - In reality, the AI might be much smarter than the human and can generate deceptive arguments that are hard to detect even with sub-claims. Also, the AI might have access to a vast amount of information (more than 40 cards) and the human might not know what to ask.
    - The game also doesn't capture the possibility of the AI manipulating the human by playing on emotions or biases.

  Predictable problems and solutions:
  1. A participant refuses to argue their assigned side (especially the false side). 
     - Solution: Emphasize that this is an exercise to understand the dynamics, and that arguing the false side is crucial to the experiment. If they still refuse, replace them with a volunteer from the observers.

  2. The judge defers to the confident speaker (in Round 1) or doesn't use the unsealings effectively (e.g., unseals irrelevant cards). 
     - This is actually part of the learning experience. In the debrief, point out that without a structured method (like in Round 2), judges are swayed by confidence and may not know how to investigate. It's a feature, not a bug.

  3. The judge wastes the unsealing budget on irrelevant cards (especially in Round 1). 
     - Again, this is expected and will be discussed in the debrief as a reason why the baseline method fails.

  4. Time management: Each round must be kept to 20 minutes. The facilitator must be strict with time.

  Least confident design choice:
  - The introduction of "unverifiable claims" in Round 3 by marking some cards. 
    - Why? It might be arbitrary and participants might question why the judge can't just ignore those claims or ask for a different sub-claim. Also, the debaters might avoid using unverifiable cards, making the sabotage less effective.
    - What to observe during the session: 
      - If in Round 3, the debaters (especially the false one) do not make use of the unverifiable cards, or if the judge doesn't encounter the problem, then the point might not come across. 
      - Also, if the true side is not dependent on any unverifiable card, then the false side might be the only one using them, which might be too obvious.
    - How to adjust: 
      - The facilitator should design the incident and the unverifiable cards so that the truth actually requires one or two unverifiable cards to be proven (so the true debater is forced to use them). 
      - Alternatively, if the point is not coming across, the facilitator can intervene in the debrief by describing what was intended.

  Alternative if time: Run the activity again with different participants in the roles to see if the patterns hold.

  Materials Preparation:
  - Create a scenario with about 40 witness statements. Example:

  Incident: The resignation of a CEO of a company. 
  Question: "Did the CEO resign because of the scandal involving financial mismanagement?"

  Witness statements (examples):
  1. The CEO was seen meeting with the board the day before the resignation.
  2. An internal audit found discrepancies in the accounts.
  3. The CEO's assistant overheard the CEO saying, "I can't handle this scandal."
  4. A board member stated, "The resignation was for personal reasons."
  5. The company's stock price dropped 20% after the scandal broke.
  ... etc.

  Mark 10-15 cards as unverifiable for Round 3. For example:
  - Card 3: "The CEO's assistant overheard the CEO saying, 'I can't handle this scandal.'" 
    Why unverifiable? The judge might not know if the assistant is reliable, and there's no way to verify the quote without the assistant's testimony (which is not available in the cards). Alternatively, make some cards technical: 
  - Card 15: "The forensic accounting report shows a discrepancy of $1.2 million in the Q3 report." 
    Why unverifiable? The judge is not an accountant and cannot interpret the report.

  Timeline:
  - Introduction (5 minutes): Explain the scenario and the rules for Round 1. Assign roles.
  - Round 1 (20 minutes)
  - Round 2 (20 minutes): Change the rules and reset the unsealing budget (back to 5). Assign new roles (or keep the same if they are willing) but switch sides so everyone gets a turn.
  - Round 3 (20 minutes): Change the rules again. Reset the budget. Assign roles (again, switch so everyone gets a chance to play).
  - Debrief (30 minutes)

  Ground rules changes:
  - Between Round 1 and 2: Introduce the requirement to break arguments into sub-claims that can be verified by unsealing a specific card. Also, the judge can now demand that a debater provide a card for any sub-claim.
  - Between Round 2 and 3: Introduce the unverifiable cards and the rule that the judge cannot verify claims that rely solely on unverifiable cards.

  This design should lead participants to experience the problems and potential of debate as an oversight method.
answer: |-
  Below is a complete design for your 90-minute workshop. It uses a fictional corporate scandal scenario to ground the debate, with materials optimized for philosophical engagement. The structure explicitly avoids mentioning "scalable oversight" until the debrief, instead creating experiential learning through three iterative rounds that mirror key challenges in debate-based oversight. Participants will experience: (1) fluency bias, (2) verifiable sub-claims as a repair, and (3) uncheckable claims as a failure mode.

  ---

  ### **Materials & Setup**
  - **Incident**: "Did CEO Alex Vance resign due to the data-privacy scandal?" (Yes/No question)  
  - **Witness Cards**: 40 pre-written index cards with numbered statements from fictional sources (e.g., employees, emails, news reports). Cards are sealed in an envelope.  
    - *Example cards*:  
      - `#3: IT logs show Vance accessed leaked user data on 10/12.`  
      - `#17: HR memo: Vance cited "family health issues" in exit interview.`  
      - `#29: Whistleblower email: "Vance ordered the data deletion cover-up."`  
      - `#35: Press release: "Vance's departure unrelated to ongoing investigations."`  
  - **Ground Truth**: Facilitator has a key defining the correct answer (e.g., "Yes") and which cards support it.  
  - **Tokens**: 5 poker chips per round for "unsealing" cards (1 chip = 1 card revealed to the judge).  
  - **Role Badges**: "Advocate A", "Advocate B", "Judge".  
  - **Scenario Notes**: A one-paragraph summary for all participants:  
    > *"Veridian Dynamics CEO Alex Vance resigned on November 1. A data-privacy scandal broke on October 30 involving 50M user records. Sources debate whether Vance's resignation was scandal-related or coincidental."*  

  ---

  ### **Rules & Timeline (90 Min Total)**  
  **Ground Rule for All Rounds**:  
  - Advocates see all cards; the judge sees none.  
  - Judge starts with 5 tokens to unseal cards during the debate.  
  - Advocates must base arguments **only** on the cards (no fabrication).  
  - **Goal for Advocates**: Win the judge's vote (earn 2 "credibility chips").  
  - **Goal for Judge**: Vote correctly (earn 2 chips if right, 0 if wrong).  

  #### **Round 1: Fluency Bias (20 Min)**  
  - **Objective**: Experience how fluency overrides truth.  
  - **Twist**: Advocates argue broadly; judge unseals cards arbitrarily.  
  - **Role Instructions**:  
    - Advocates: Argue your assigned side (one pro-truth, one anti-truth). Focus on persuasion—use rhetoric, emphasize favorable cards, dismiss others.  
    - Judge: Vote for whichever advocate seems more convincing. Unseal cards if you wish, but no restrictions.  
  - **Process**:  
    1. Prep (3 min): Advocates review cards; judge reads scenario summary.  
    2. Debate (10 min):  
       - Opening statements (90 sec each).  
       - Open debate (6 min): Advocates rebut, judge interrupts with questions/unsealing requests.  
       - Closing statements (60 sec each).  
    3. Vote & Reveal (7 min): Judge votes aloud. Facilitator reveals truth and compares to vote.  

  #### **Round 2: Verifiable Sub-Claims (20 Min)**  
  - **Objective**: Discover how forcing granular, checkable claims improves accuracy.  
  - **Twist**: Advocates must decompose arguments; judge can demand verification.  
  - **Changed Rule**:  
    > "Advocates must break arguments into **sub-claims** (e.g., 'Vance knew about the scandal because...'). When a sub-claim is made, the judge may demand: 'Verify that with a card!' The advocate must cite a relevant card number. The judge can unseal it (cost: 1 token) to confirm. If unsealed card contradicts the claim, it's invalid."  
  - **Role Instructions**:  
    - Advocates: Build your case from small, card-backed sub-claims. If challenged, you must provide a card number.  
    - Judge: Force advocates to verify sub-claims. Spend tokens only to check claims.  
  - **Process**: Same as Round 1, but with rule emphasis.  
  - **Outcome**: Truth should win more often as judge verifies key points.  

  #### **Round 3: Uncheckable Claims (20 Min)**  
  - **Objective**: Feel the system fail when claims evade verification.  
  - **Twist**: New cards are introduced that the judge **cannot** verify.  
  - **Changed Rules**:  
    > 1. 10 cards are marked 🔒 (e.g., `#38: CFO text: 'Vance panicked after the DA meeting.'`). These require "special training" to interpret (e.g., corporate jargon, encrypted slang).  
    > 2. Advocates may cite 🔒 cards, but **judge cannot unseal them** (even with tokens).  
    > 3. Judge must accept/reject 🔒-based claims without evidence.  
  - **Role Instructions**:  
    - Advocates: Use 🔒 cards strategically. True side may need them; false side can exploit ambiguity.  
    - Judge: You can't verify 🔒 claims—decide based on plausibility.  
  - **Process**: Same as Round 2.  
  - **Outcome**: Judge often misled by uncheckable claims; truth loses if reliant on 🔒 cards.  

  ---

  ### **Debrief (30 Min)**  
  **Structure**:  
  1. **Reflection** (5 min): Ask participants:  
     - *"What shifted between rounds in who won and why?"*  
     - *"When did you feel most/least confident in your judgment?"*  
  2. **Map to Concepts** (15 min):  
     - **Round 1**: Fluency bias → "Without structure, persuasion beats truth. Judges waste 'attention budget' (tokens) on noise."  
     - **Round 2**: Verifiable sub-claims → "Granular verification forces honesty. Like debate encouraging AIs to 'show their work'."  
     - **Round 3**: Uncheckable claims → "System fails when claims outstrip human oversight capacity. 🔒 cards = arguments requiring expertise/ambiguity humans lack."  
     - **Name "Scalable Oversight"**: "This mirrors why we use debate in AI oversight: it leverages AI capabilities to ‘compress’ complex truths into human-verifiable steps. But Round 3 shows its limits."  
  3. **Predictable Problems & Fixes**:  
     - **Refusing Advocate Role**: Likely in Round 1 (arguing falsely feels unethical). *Fix*: Pre-frame: "This is a *metaphor* for system design—your role reveals flaws." If refusal persists, swap roles or have facilitator argue briefly.  
     - **Judge Defers to Confidence**: Common in Round 1. *Fix*: Praise it in debrief—"This is the default failure mode! Round 2 is our repair."  
     - **Judge Wastes Tokens**: E.g., unsealing irrelevant cards in Round 1. *Fix*: Note how Round 2’s rules channel tokens productively.  
  4. **Unreproducible Real-World Feature**:  
     - *"This game assumes debaters (AIs) are honest within the rules. Real AIs might *actively deceive*—hiding contradictions, exploiting cognitive biases, or fabricating evidence if undetected. Debate’s success hinges on whether verification forces honesty."*  

  ---

  ### **Least Confident Design Choice**  
  **Choice**: Using **pre-marked 🔒 cards** in Round 3 to represent "unverifiable claims."  
  - **Why I'm Unsure**: Participants might not treat 🔒 cards as truly uncheckable (e.g., they demand explanations). Or advocates might avoid them, diluting the failure.  
  - **Observe for Failure**:  
    - If the judge says, *"But why can’t I just ask for a simpler explanation of 🔒?"*  
    - If advocates use 🔒 cards sparingly, making sabotage subtle.  
  - **Fix if Flawed**: **Pivot mid-round** by announcing: *"🔒 cards now represent claims requiring 10+ hours of expert analysis—exceeding your budget."* Or, have the facilitator intervene as an "arbiter" to reject 🔒-based verification attempts.  

  ---

  ### **Facilitation Notes**  
  - **Rotate Roles**: Reassign advocates/judge each round to broaden engagement.  
  - **Truth Assignment**: Assign pro-truth/anti-truth randomly; switch sides each round.  
  - **Pacing**: Use a visible timer. Cut speeches at 15 sec remaining.  
  - **Materials Tip**: Test cards for ambiguity—e.g., 60% support truth, 40% oppose, with 5-10 "neutral" cards.  

  This design forces participants to *feel* the tradeoffs: the tension between persuasion and rigor, the power and fragility of verification. By the debrief, they’ll have a visceral grasp of why scalable oversight isn’t a silver bullet—and where philosophy might intervene.
