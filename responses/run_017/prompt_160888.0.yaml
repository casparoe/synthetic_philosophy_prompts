  ### Refined Principle Based on Your Cases and Tentative Principle

  After analyzing your cases and tentative principle, I've developed a refined principle that captures your intuitions while resolving the inconsistencies (especially between cases 3 and 4). The core insight is distinguishing between **voluntary exposure to separable risks** and **non-voluntary exposure to bundled risks**, with a separate humanitarian floor. Here's the formalized version:

  ---

  #### **Principle: Bundled Risk Compensation with Humanitarian Floor (BRC-HF)**
  **Input Fields** (required for case evaluation):  
  - `risk_voluntariness`: `voluntary` (chosen action) or `non-voluntary` (no meaningful choice).  
  - `risk_bundling`: `bundled` (risk inseparable from pursuing a core entitlement) or `separable` (risk avoidable without sacrificing core entitlements).  
  - `risk_knowability`: `knowable` (risk magnitude discoverable via reasonable effort) or `unknowable` (undiscoverable at time of choice).  
  - `social_value`: `high` (activity benefits society) or `low` (purely self-interested).  
  - `current_state**: `above_floor` (basic needs met) or `below_floor` (unable to meet basic needs).  

  **Output**:  
  - `compensable`: `yes` (owed compensation for bad outcome) or `no`.  
  - `rescue`: `yes` (owed basic aid) or `no` (only if `current_state = below_floor`).  

  **Decision Function**:  
  ```python
  def BRC_HF_evaluate(case):  
      # Humanitarian floor (unconditional)  
      rescue = (case.current_state == "below_floor")  

      # Compensation rules  
      if case.risk_voluntariness == "non_voluntary":  
          compensable = True  # e.g., innate conditions, unavoidable exposures  
      else:  # voluntary choices  
          if case.risk_bundling == "bundled":  
              compensable = True  # Risk inherent in pursuing entitlements  
          elif case.risk_knowability == "unknowable":  
              compensable = True  # Risk magnitude hidden  
          elif case.social_value == "high":  
              compensable = True  # Socially valuable gamble (e.g., startups)  
          else:  
              compensable = False  # Voluntary, separable, knowable, low-social-value risks  

      return {"compensable": compensable, "rescue": rescue}  
  ```

