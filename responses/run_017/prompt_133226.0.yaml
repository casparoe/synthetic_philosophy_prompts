  Next, the art-as-test. The user questions if credible signs of consciousness must be costly. The guardians treat art as a costly signal—it can't be faked easily, unlike verbal reports. But in the real world, is consciousness tied to cost? The novel suggests that cheap reports are distrusted not because they're verbal but because they can be insincere. Costly signals like art serve as better evidence. This shifts the objection from cheapness to reliability. The meta-problem's focus on mechanisms producing reports might miss that we require non-verbal, costly evidence for true attribution.

  Third, attribution of consciousness to others. The novel shows that societal biases (clones as non-human) lead to dismissing their verbal claims. Art becomes a last resort for proof, but even that fails because dehumanization overrides evidence. A paper might discuss mechanisms, but the novel highlights how empathy and narrative immersion override doubt. We believe Kathy because her story resonates emotionally, not logically. This emotional pull is something argumentative papers might skip, focusing instead on cognitive processes.

