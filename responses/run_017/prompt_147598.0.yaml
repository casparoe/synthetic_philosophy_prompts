  Then, the justification: Why children specifically? If it were purely cost-shifting, why not tax everyone or sue friends? The fact it targets *children* hints at a societal nod to family responsibility. But is that Confucian? Not really. Western legal history has similar norms (e.g., colonial "poor laws"). It’s more about default assumptions than ethical depth.  

  The user’s thin/thick framework is useful. Thin fits perfectly: role as trigger, no performance expectations. Thick would require way more—like mandated visits or parental duties. That’s nowhere in U.S. law.  

