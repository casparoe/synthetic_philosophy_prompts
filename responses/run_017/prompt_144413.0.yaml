answer: |-
  Below is a diagnostic quiz designed to sort individuals into ethical positions regarding obligations to address collective harms, based on their responses to everyday scenarios. The quiz uses 10 questions (with two non-standard cases) and includes a scoring key and decision tree. The tree is built from the logical space of answer combinations, with positions mapped to leaves. Unoccupied branches are noted, and limitations are explained.

  ### **Diagnostic Quiz**
  **Instructions:** For each scenario, select the option that best reflects your view. Be honest—there are no right or wrong answers.

  1. **Lights Off (Climate Change)**:  
     You’re leaving a room. Turning off unused lights reduces CO₂ by a tiny, immeasurable amount. Do you have an obligation to turn them off?  
     A. Yes, because if everyone did this, emissions would fall significantly.  
     B. Yes, because leaving them on makes me complicit in climate harm.  
     C. Yes, because it’s responsible and avoids wastefulness.  
     D. No, because my action alone changes nothing.  

  2. **Skipping a Burger (Industrial Farming)**:  
     Eating one burger from factory-farmed beef won’t reduce animal suffering, but if many people skipped, it would. Do you have an obligation to skip it?  
     A. Yes, because if enough people skipped, suffering would decrease.  
     B. Yes, because eating it directly supports a cruel system.  
     C. Yes, because compassion and moderation are virtues.  
     D. No, because one burger changes nothing.  

  3. **Voting in a Safe District (Elections)**:  
     Your vote in a district that always wins by 20% won’t change the outcome. Do you have an obligation to vote?  
     A. Yes, because there’s a tiny chance it could be pivotal in a surprise upset.  
     B. Yes, because if many like me didn’t vote, we’d lose elections we could win.  
     C. Yes, because participating in democracy is a duty.  
     D. No, because my vote won’t change the result.  

  4. **Signing a Threshold Petition (Variance Case)**:  
     A petition needs 10,000 signatures to be delivered. You’re the 5,000th signer. Signing won’t change the expected outcome but increases the chance of success (e.g., if it ends at 9,999) or failure (e.g., 9,998). Do you have an obligation to sign?  
     A. Yes, because it slightly increases the probability of success.  
     B. Yes, because if everyone in my position signed, success would be more likely.  
     C. Yes, because signing expresses solidarity with the cause.  
     D. No, because it’s very unlikely to be decisive.  

  5. **Dumping Waste (Capped Harm)**:  
     A river is polluted. Harm only occurs if pollution exceeds 1,000 tons. Current pollution is uncertain: 1% chance it’s 999 tons (your 1-ton dump causes harm), 99% chance it’s 1,001 tons (your dump changes nothing). Do you have an obligation not to dump?  
     A. Yes, because there’s a 1% chance I cause major harm.  
     B. Yes, if everyone dumped, the risk would be higher.  
     C. Yes, because dumping waste is inherently wrong.  
     D. No, because the risk is too small to matter.  

  6. **Recycling a Bottle**:  
     Recycling one plastic bottle has negligible environmental impact, and it might not be processed. Do you have an obligation to recycle?  
     A. Yes, because if everyone recycled, it would help.  
     B. Yes, because trashing it contributes to the waste problem.  
     C. Yes, because it’s environmentally conscientious.  
     D. No, because it makes no real difference.  

  7. **Donating to Charity**:  
     Donating $10 to a climate charity has a tiny impact. Do you have an obligation to donate?  
     A. Yes, because collective donations make a difference.  
     B. Yes, because not donating ignores my role in the solution.  
     C. Yes, because generosity is virtuous.  
     D. No, because $10 won’t change anything.  

  8. **Attending a Large Protest**:  
     A climate protest is already huge; your attendance won’t affect its impact. Do you have an obligation to attend?  
     A. Yes, because if everyone like me attended, it would grow.  
     B. Yes, because attending shows I’m part of the movement.  
     C. Yes, because it’s courageous to stand for your beliefs.  
     D. No, because my presence changes nothing.  

  9. **Buying a Sweatshirt (Complicity)**:  
     Buying one sweatshirt from a sweatshop won’t affect demand, but you know workers are exploited. Do you have an obligation not to buy it?  
     A. Yes, because if many avoided sweatshops, practices would improve.  
     B. Yes, because buying it makes me complicit in exploitation.  
     C. Yes, because it’s unjust to benefit from suffering.  
     D. No, because my purchase changes nothing.  

  10. **Picking Up Litter (Virtue)**:  
      Picking up one bottle from a polluted lake has no noticeable effect. Do you have an obligation to do it?  
      A. Yes, because if everyone did it, the lake would be clean.  
      B. Yes, because leaving it is adding to the problem.  
      C. Yes, because it’s considerate and community-minded.  
      D. No, because one bottle changes nothing.  

  ---

  ### **Scoring Key and Position Mapping**
  Each option corresponds to a core ethical principle:
  - **A**: Rule consequentialism / Universalization ("If everyone did X...").
  - **B**: Complicity/Participation ("I’m part of the problem/solution").
  - **C**: Virtue ethics ("It’s the right/virtuous thing to do").
  - **D**: No obligation ("My act changes nothing").

  **Decision Tree**:  
  The tree splits based on answers to pivotal questions, isolating positions by their logical commitments. Key splits:
  - **Expected Harm vs. Outcome Certainty**: Q4 (variance) and Q5 (capped harm) distinguish views focused on probabilistic outcomes.
  - **Difference-Making**: Q3 (voting) separates consequentialist "pivotal chance" reasoning from fairness/participation.
  - **Collective vs. Fixed Behavior**: "A" options invoke universalization (others’ behavior isn’t fixed); "B"/"C"/"D" hold others fixed.

  **Decision Tree Logic**:  
  ```mermaid
  graph TD
      Root[Start: Q5 Capped Harm?] -->|A: Expected harm matters| Q4
      Root -->|B/C/D: Expected harm irrelevant| Q1

      Q4[Q4 Petition Variance?] -->|A: Probability matters| Q3
      Q4 -->|B/C/D: Probability irrelevant| Q1

      Q3[Q3 Voting?] -->|A: Pivotal chance matters| AC[Act Consequentialism]
      Q3 -->|B/C/D: Pivotal chance irrelevant| Q1

      Q1[Q1 Lights Off?] -->|D: No obligation| Q2
      Q1 -->|A/B/C: Obligation exists| Mode

      Q2[Q2 Burger?] -->|D: No obligation| NO[No Obligation]
      Q2 -->|A/B/C: Obligation exists| Hybrid1[Hybrid: NO in pivotal cases but obligation elsewhere?]

      Mode[Modal reason in Q1, Q2, Q6-10?] -->|A most common| RC[Rule Consequentialism]
      Mode -->|B most common| CP[Complicity/Participation]
      Mode -->|C most common| VE[Virtue Ethics]
      Mode -->|Tie| Hybrid2[Hybrid: e.g., RC/CP/VE mix]

      classDef green fill:#9f6,stroke:#333
      classDef yellow fill:#ff9,stroke:#333
      class AC,RC,CP,VE,NO green
      class Hybrid1,Hybrid2 yellow
  ```

  **Tree Explanation**:
  1. **Start with Q5 (Capped Harm)**:  
     - If **A**, the respondent recognizes expected harm even with capped stakes. This is the hallmark of **act consequentialism (AC)**, so proceed to Q4.  
     - If **B/C/D**, expected harm is dismissed, so go to Q1 to test for other positions.

  2. **Q4 (Petition Variance)**:  
     - If **A**, the respondent weighs probabilistic outcomes (expected value), consistent with AC. Proceed to Q3.  
     - If **B/C/D**, variance is ignored, suggesting non-consequentialist views. Go to Q1.

  3. **Q3 (Voting)**:  
     - If **A**, the respondent consistently uses "pivotal chance" reasoning → **Act Consequentialism (AC)**.  
     - If **B/C/D**, pivotal chance is irrelevant → Go to Q1 to distinguish non-consequentialist views.

  4. **Q1 (Lights Off)**:  
     - If **D**, no obligation is perceived in standard cases → Go to Q2.  
     - If **A/B/C**, obligation exists → Compute the modal reason (A/B/C) across Q1, Q2, Q6–Q10.

  5. **Q2 (Burger)**:  
     - If **D**, consistent dismissal of obligation → **No Obligation (NO)**.  
     - If **A/B/C**, inconsistency (obligation in Q2 but not Q1? Rare) → **Hybrid (NO-leaning)**.

  6. **Modal Reason (Q1, Q2, Q6–Q10)**:  
     - Most **A** → **Rule Consequentialism (RC)**.  
     - Most **B** → **Complicity/Participation (CP)**.  
     - Most **C** → **Virtue Ethics (VE)**.  
     - Tie → **Hybrid** (e.g., RC/CP).

  **Named Positions at Leaves**:
  - **Act Consequentialism (AC)**: Focuses on expected harm reduction; requires "A" in Q3, Q4, and Q5.  
  - **Rule Consequentialism (RC)**: Universalizes actions; primarily "A" responses.  
  - **Complicity/Participation (CP)**: Avoids moral taint; primarily "B" responses.  
  - **Virtue Ethics (VE)**: Prioritizes character; primarily "C" responses.  
  - **No Obligation (NO)**: Denies individual duty; primarily "D" responses.  
  - **Hybrids**: Mix of principles (e.g., "A" in universalization cases but "C" in virtue cases).

  ---

  ### **Unoccupied Branches and Limitations**
  **Unoccupied Branches**:  
  1. **Q5 = A (expected harm matters) but Q4 ≠ A (variance ignored) and Q3 ≠ A (pivotal chance ignored)**:  
     - Logically incoherent: If expected harm matters (Q5), variance (Q4) and pivotal chance (Q3) should too.  
     - Why empty? Incoherent under scrutiny—rejecting variance while accepting expected harm is inconsistent.  

  2. **Q1 = D (no obligation) but Q2–Q10 = A/B/C (obligation elsewhere)**:  
     - Logically possible but unattractive: Denying obligation in a low-stakes case (lights) while affirming it in identical cases (e.g., recycling) suggests arbitrariness.  
     - Why empty? Psychologically unstable; respondents typically seek consistency.  

  **Positions the Quiz Cannot Separate**:  
  1. **Complicity vs. Virtue Ethics**:  
     - Both often agree on obligations (e.g., "B" and "C" in Q9 sweatshirt or Q10 litter).  
     - Why? Complicity ("B") focuses on participation in harm; virtue ("C") on character. In practice, answers overlap (e.g., "avoiding complicity is virtuous").  

  2. **Act Consequentialism with Rule Overlap**:  
     - AC may sometimes select "A" in non-pivotal cases (Q1, Q7) if they conflate individual impact with universalization.  
     - Why? Rule consequentialism (universalization) can mimic AC when respondents approximate expected harm via "if everyone" reasoning.  

  3. **Hybrid Views**:  
     - E.g., a virtue ethicist who also avoids complicity ("B" and "C" equally frequent) isn’t cleanly separated from a pure CP or VE.  
     - Why? The quiz identifies dominant patterns but not nuanced blends.  

  **Non-Standard Cases Explained**:  
  - **Q4 (Petition Variance)**: Tests if respondents recognize that an act can widen outcome spread (higher success/failure chances) without changing expected value.  
  - **Q5 (Capped Harm)**: Isolates if respondents care about tiny pivotal chances when harm is bounded (no "infinite stakes" to offset low probability).  

  This quiz helps students explore their ethical reasoning through relatable cases. For discussion, contrast AC (probabilistic) with CP (symbolic participation) or VE (character-driven), and examine why "no obligation" appeals to some.
