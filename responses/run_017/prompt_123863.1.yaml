  Regarding progress, distinctions like the one between normative and metaethical questions could help. Formal results on framework admissibility might not exist, but thought experiments like the A/B case could reveal tensions in relativism. If Sam admits that some frameworks are inadmissible, he moves towards objectivism. Otherwise, he might bite the bullet on instability. The user could press on whether relativism can handle self-referential claims without privileging any framework.

