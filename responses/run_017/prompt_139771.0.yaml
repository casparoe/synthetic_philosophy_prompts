prompt: |-
  I sit on the editorial board of a university press series on contested pasts, and we have to rule on a submission. Our track record so far:

  - rejected a manuscript arguing that Atlantis was a real Bronze Age thalassocracy, resting on Plato read as reportage plus comparative mythology;
  - rejected an ancient-astronauts manuscript, on the ground that it inferred extraterrestrial instruction from engineering the author could not explain;
  - rejected a New Chronology style manuscript holding that the whole documentary and dating record is a retrojected forgery;
  - published, with a rejoinder by a specialist, a tightly scoped argument for pre-Columbian trans-Pacific contact built on botanical and linguistic evidence;
  - published a monograph arguing that an apparent dark-age gap in a regional record is an artifact of preservation rather than a real collapse, and separately a monograph arguing that a colonial-era excavation looted and misdated a site — both methodologically conventional, both modest in what they overturn, and the second explicitly framed as reparative;
  - rejected, on a split vote, a well-executed manuscript arguing from a small corpus of Neolithic marks that they encode a lunar calendar and push the origin of writing back two millennia, our letter saying the load-bearing evidence is too thin for the size of the revision, though we published the same author's narrow paper on the distribution of a single sign.

  The new submission: from a reanalysis of one submerged harbour site, with a single radiocarbon series on short-lived seed material that a specialist says may come from a redeposited layer, the author argues that a culture the textbooks place in the second millennium BC in fact flourished eight centuries earlier and exported its script to two neighbouring regions, which would force the redating of three regional sequences. The manuscript works from the primary excavation reports, answers every mainstream objection in a forty-page appendix, states in advance what would refute it, predicts that a buried quay will be found at a named spot if the new dating is right, and offers to appear alongside a critic's rejoinder. Its preface says the point is to give a people back the antiquity that a colonial chronology took from them. The quay will not be excavated before we must decide.

  A colleague proposes that we stop asking what would refute a heterodox claim and instead apply a symmetry test: demand of the revisionist thesis only what the received chronology it attacks itself meets, and no more.

  Which rules fit all six of our verdicts, and where do they come apart on this one? Give me the decision that best coheres with our own precedents, the closest analog among them, an honest statement of the principle we would be adopting either way, and the single change to this case — or the further case — that would tell the surviving rules apart, including whether the symmetry test belongs in the set.
reasoning: |-
  Hmm, the user is asking for help with an editorial decision for their university press series on contested pasts. They've provided a detailed track record of previous decisions and now have a new submission to evaluate. The core question is how to apply their precedents to this case, especially considering a colleague's proposal to use a "symmetry test" instead of falsifiability.

  Looking at their past decisions: They've consistently rejected manuscripts that make extraordinary claims without sufficient evidence (Atlantis, ancient astronauts, New Chronology). They've published works that challenge mainstream views but do so with strong evidence and narrow scope - like the trans-Pacific contact paper with botanical evidence, or the monographs about preservation artifacts and colonial misdating. The split decision on the Neolithic marks paper shows they draw the line when evidence seems too thin for the scale of revision.

  This new submission has some concerning elements: it rests heavily on a single radiocarbon series that might come from redeposited material, yet claims to redate an entire culture by 800 years and rewrite script diffusion across three regions. The author does engage seriously with counterarguments and makes a testable prediction about a buried quay. Importantly, the preface frames this as reparative history for a colonized people.

  The colleague's symmetry test proposal is interesting - it would ask whether the revisionist thesis meets the same standards of evidence as the mainstream view it challenges. But in practice, mainstream chronologies rest on multiple converging lines of evidence, while this submission seems to rely on one potentially problematic dataset.

  The closest analog from their history is probably the rejected Neolithic marks manuscript - both involve thin evidence making outsized claims. Though this submission does make a concrete prediction about the quay, which the marks paper didn't have. The trans-Pacific contact paper was published because it had multiple types of evidence (botanical and linguistic) for a specific claim.

  If they publish this, they'd be adopting a principle that testable predictions and engagement with critics can offset evidentiary concerns. If they reject it, they're upholding the principle that extraordinary claims require extraordinary evidence. The quay excavation would be the clearest test - if found, it would strongly support the thesis; if absent, it would refute it.

  Given their precedents, I think rejecting the manuscript would be most consistent. The symmetry test doesn't seem appropriate here because the mainstream chronology likely has multiple evidentiary anchors, while this thesis leans heavily on one contested point. The reparative framing is important but shouldn't override methodological rigor.
answer: |-
  Based on your track record and precedents, here's the analysis and recommendation:

  **Decision:** Reject the manuscript.

  **Closest Analog:** The rejected Neolithic marks manuscript (Case 6). Both involve:
  1.  A **thin primary evidentiary base** (single radiocarbon series vs. small corpus of marks).
  2.  An **extraordinary chronological revision** (800-year redating of a culture + script diffusion vs. 2000-year pushback of writing).
  3.  **Load-bearing evidence questioned by specialists** (redeposition risk vs. interpretation of marks as writing/calendar).
  4.  Demands to **overturn multiple established regional sequences**.
  5.  High methodological effort and engagement with criticism, yet insufficient to overcome the core weakness.

  **Principle Adopted by Rejecting:**
  "**The scale and scope of a historical revision must be proportionate to the robustness, independence, and ambiguity of the underlying evidence. Extraordinary claims require not just engagement with criticism, but evidence of extraordinary resilience against core methodological objections.**"

  **Principle Adopted if Published (Symmetry Test):**
  "**The validity of a chronological framework depends on its methodological coherence and explanatory power, not its mainstream acceptance. A revisionist chronology deserves publication if it meets the same standard of empirical support and internal consistency as the chronology it seeks to replace, assessed symmetrically.**"

  **Where Your Precedents Cohere/Cohere Partially and Where They Come Apart:**

  1.  **Coheres with Rejections (Cases 1, 2, 3, 6):** Like Atlantis, Ancient Astronauts, New Chronology, and Neolithic marks, this submission rests on evidence deemed too weak, ambiguous, or singular to support its massive revisionist conclusions, despite its structure and engagement. Falsifiability alone (the quay prediction) isn't sufficient if the core evidence is flawed.
  2.  **Coheres Partially with Publications (Cases 4 & 5):**
      *   *Case 4 (Trans-Pacific):* While both challenge orthodoxy, the trans-Pacific argument used multiple *independent* lines of evidence (botany + linguistics) for a *specific* claim. This submission relies on *one* contested line (radiocarbon) to redate an entire culture *and* rewrite script diffusion.
      *   *Case 5 (Gap/Looting):* Both involve reparative framing. However, the published monographs made *modest*, methodologically conventional claims (preservation bias, colonial malpractice) directly supported by their evidence. This submission makes a radical chronological claim where the key evidence is methodologically contested (redeposition).
  3.  **Comes Apart on "What Would Refute" vs. Symmetry Test:** Your precedent heavily weights falsifiability and evidentiary robustness *over* symmetry. Cases 1-4 & 6 were rejected because their evidence couldn't bear the load, regardless of symmetry. Case 5 was published because the evidence *was* robust for the *specific* claim. The symmetry test, as proposed, would shift focus away from the *inherent weakness* of the radiocarbon evidence (the specialist's redeposition objection) and towards whether the *model* is as coherent as the mainstream one. This diverges from your core practice of demanding strong evidence proportionate to the claim's disruptiveness.

  **The Decisive Change to Test the Rules / The Symmetry Test's Place:**

  *   **The Single Change:** **The excavation and dating of the predicted quay.**
      *   *If Found & Dated to the Proposed Era:* This would provide *independent, material confirmation* of the core chronological claim, transforming the evidence base from singular/contested to multi-stranded/resilient. This would align the submission more closely with *Case 4 (Trans-Pacific)*, which used multiple evidence types. Rejection would then seem inconsistent with publishing Case 4. The symmetry test becomes less relevant as the *evidentiary* hurdle is cleared.
      *   *If Not Found or Dated Later:* Confirms the rejection based on insufficient/contested evidence (aligning with Neolithic marks rejection). The symmetry test fails as the prediction (a key part of its coherence) is falsified.
  *   **Symmetry Test's Place:** The symmetry test **does not belong** in your established set of rules as the *primary* criterion. Your precedents consistently prioritize **evidentiary robustness proportionate to the claim**. The symmetry test risks publishing radical revisions based on internal coherence alone, even with weak/contested evidence (like a perfectly coherent but evidence-light New Chronology variant). It *could* be a *secondary* check *after* the core evidence is deemed sufficiently robust, asking if the *model* is as strong as the mainstream one it challenges. However, in this case, the core evidence hasn't passed the primary robustness test.

  **Recommendation Summary:** Reject. The manuscript's reliance on a single, methodologically contested radiocarbon series to support an 800-year redating of a culture *and* script diffusion across three regions mirrors the "thin evidence, huge revision" flaw seen in the rejected Neolithic marks manuscript. While the author's rigor, engagement, testable prediction, and reparative intent are commendable, they do not overcome the core evidentiary weakness highlighted by the redeposition concern. Publishing it would break consistency with your rejection of similarly ambitious revisions based on fragile evidence pillars. Awaiting the quay excavation result is the crucial test that would fundamentally alter the evidentiary landscape. Adopting the symmetry test as primary would require abandoning the core principle of evidentiary proportionality evident in all six prior decisions.
