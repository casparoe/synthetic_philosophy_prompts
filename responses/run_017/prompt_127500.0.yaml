answer: |-
  Your diagnosis is perceptive: the persistence of this debate stems from an **unstable triad of commitments** masked by the singular term "multiple realizability." The core issue isn't empirical underdetermination but a **clash of explanatory frameworks** with incompatible priorities. Here's a breakdown of the disagreement's structure, its load-bearing elements, and paths to progress:

  ### 1. **The Nature of the Disagreement**
     - **Not verbal, not ill-posed, but framework-dependent.** Both sides agree on observational data (diversity exists, systems function similarly despite structural differences). The dispute is about **which explanatory goals license which ontological conclusions**. 
     - **Anti-reductionists** prioritize *explanatory autonomy*: psychology tracks causal patterns that would be lost under physical reduction. Their core commitment is to **tolerance** (modal robustness), as it secures the counterfactual stability of psychological laws across physical perturbations.
     - **Reductionists** prioritize *ontological parsimony* and *causal closure*. They treat **grain** as interest-relative and **tolerance** as an artifact of descriptive pragmatics, not a modal fact about nature. Diversity is trivialized as "implementation detail."
     - **The stalemate arises because**:  
       - Anti-reductionists need **tolerance** to block disjunctive identities and preserve autonomy.  
       - Reductionists attack **tolerance** by relocating it to epistemology (grain relativity) and dissolve **diversity** via token identity.  
       - When pressed, anti-reductionists retreat to **diversity** as "proof" of tolerance; reductionists counter by demanding finer **grain** or dismissing modal claims.

  ### 2. **The Load-Bearing Claim: Tolerance**
     - **Tolerance is indispensable for anti-reductionism**. Diversity alone is insufficient (reductionists concede it). Grain relativity is the enemy (it makes MR contingent on description). Tolerance alone implies that psychological states *constrain but underdetermine* physical realizers—securing autonomy.
     - **Why tolerance collapses under standard moves**:  
       - *Disjunction*: Reductionists argue disjunctive kinds are legitimate. Anti-reductionists retort that disjunctions lack projectibility—but this assumes *their* grain of "relevance."  
       - *Causal exclusion*: If tolerance entails non-identity, mental states risk epiphenomenalism. Anti-reductionists invoke "causal relevance" (not closure-breaking causation), but this relies on tolerance *being a natural fact*—which reductionists deny.  
       - *Counterfactuals as taxonomic artifacts*: Reductionists argue that tolerance reflects *our* explanatory interests (e.g., grouping systems by input-output profiles). Anti-reductionists insist it's mind-independent—but struggle to ground grain non-circularly.

  ### 3. **The Grain Ratchet: A Symptom, Not the Disease**
     - The ratchet emerges because **grain has no theory-neutral anchor**. Reductionists fix grain at fundamental physics or causal mechanisms; anti-reductionists fix it at functional roles.  
     - **This isn't arbitrariness**: Grain choices reflect *explanatory aims*. The ratchet persists because neither side accepts the other's aims as ontologically revealing.

  ### 4. **ANNs: Why They Don't Break the Stalemate**
     - Your ANN case perfectly illustrates the triad:  
       - **Diversity**: Non-isomorphic internal solutions exist.  
       - **Tolerance**: Networks generalize across weight perturbations—but is this a fact about cognition or training constraints?  
       - **Grain**: Permutation invariance suggests "same structure" under automorphism; representation similarity metrics impose coarse-grained sameness.  
     - **Result**: Reductionists see diversity as superficial (all are matrix algebras); anti-reductionists see tolerance (networks work despite internal differences). Evidence is framed by prior commitments.

  ### 5. **Paths to Progress**
  Progress requires **reframing the debate away from identity/autonomy** and toward **explanatory trade-offs**. Key shifts:

  | Approach | Mechanism | Outcome |
  |----------|-----------|---------|
  | **Naturalize Grain** | Ground grain in causal relevance (e.g., Woodward’s interventionism). Measure how perturbations affect function/structure. | Tolerance becomes *degree of stability* under intervention—quantifiable in ANNs/brains. |
  | **Decouple Tolerance & Diversity** | Argue that tolerance without diversity is empty; diversity without tolerance is coincidental. Show they *need not correlate* (e.g., brittle systems with diverse realizers). | Undermines anti-reductionist package; forces specificity about which MR matters. |
  | **Pragmatic Turn** | Accept that grain reflects explanatory interests. Ask: When does coarse-graining *over physical details* yield predictive/explanatory gains? | MR becomes a virtue of models, not ontology. Autonomy is epistemic, not metaphysical. |
  | **Dynamical Alternative** | Replace realization with *dynamical coupling* (e.g., neural reuse as multi-scale constraints). | Bypasses grain by focusing on how functions emerge from structure-process interactions. |

  ### Why Previous Work (Including Empirical) Fails to Move the Dial
  - **Empirical data** (lesions, ANNs) is **theory-laden**: What counts as "same function" or "different structure" depends on background commitments.  
  - **Standard arguments** are **self-sealing**: Each side has moves to absorb data without core concessions (reductionists: "redescribe grain"; anti-reductionists: "that’s not genuine tolerance").  
  - **The triad remains unaddressed**: Attacks focus on one vertex (e.g., denying diversity), while the defended position shifts to another (e.g., emphasizing tolerance).

  ### Conclusion: The Way Forward
  **Progress lies in dissolving the question "Is MR true?" and asking instead: "Under what grain prescriptions, for which explanatory purposes, and with what modal stability, does MR hold?"** Your triad isn't the obstacle—it's the key. To break the stalemate:  
  1. **Formalize tolerance** as a measurable property (e.g., via perturbation robustness in ANNs/brains).  
  2. **Demonstrate that diversity ≠ tolerance** (e.g., brittle systems with many realizers).  
  3. **Argue that certain grains are objectively privileged** by causal structure (e.g., via minimal dynamical models).  

  The debate persists because it’s not about evidence but **competing visions of explanation**. Clarifying these visions—not accumulating data—is where your contribution lies.
