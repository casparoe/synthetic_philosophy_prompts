prompt: |-
  I've been on my city's zoning board for about six years now and I keep feeling like the rules we apply only make sense against some background theory I can't quite name. I'd rather not get into which city it is, so here's the shape of it, in my own words.

  Most of the city is capped at about three stories by a map drawn back in the 1960s. Buildings that were legal when they went up can stay forever even though they break every current rule, and if one burns down or gets taken out by a storm the owner can rebuild it more or less as it was with no review at all; if the same owner tore it down on purpose, the replacement goes through the whole process. At the same time, we do force every building to retrofit for earthquakes and fire safety, so it isn't that existing buildings are simply left alone.

  Anything ten units or bigger triggers a design hearing. Anyone who owns or rents within about 300 feet can speak, and can appeal if they don't like the outcome; nobody else has that standing. The standard we're told to apply is whether the project fits the existing streetscape. There is no hearing, and no appeal, about what happens if we say no. Also, because the trigger is ten units, we see a definate stream of nine-unit proposals, and sometimes three or four of them on the same block in a couple of years.

  New projects at that size also have to set aside some units at below-market rents and pay a per-unit fee toward parks, schools and transit. Existing buildings never pay any of that. The below-market units get allocated by lottery, and people who already live or work in the city get priority in it. Meanwhile the city has an official target for how many homes it wants built each year, and it misses it every year, and nothing happens to anybody when it does.

  So what I want is the theory underneath the package. It looks to me like it treats the people already here, and the buildings already here, as having a kind of claim that someone who might move here one day simply doesn't have. But it also looks like it treats *change* as the thing that needs justifying rather than the state of the world, which is what the fire rule and the grandfathering are both doing. Are those two different pictures bolted together, or one picture, and if they conflict, which one is doing the real work? Does a set of rules like this strictly presuppose any particular answer to who has a right to the city, or would several quite different answers license the exact same rules? I'd like you to seperate what the practice really commits us to from what it merely sits comfortably with, and to say where it's genuinely underdetermined.

  Then the second half: suppose we swapped in the opposite picture, where the people who would otherwise move here count the same as the people already here, and where a harm is judged by how things end up rather than by who changed them. What would actually have to change in the day to day mechanics of a board like mine? Concrete changes, please, not a manifesto.

  Please answer in American English, and I'm not a philosopher, so keep the jargon down and explain it where you can't.
reasoning: |-
  Okay, the user is on a zoning board and has been grappling with the underlying theory behind their city's zoning rules. They've described several key aspects: height restrictions from the 1960s, grandfathering of existing buildings, different rules for rebuilding versus intentional demolition, mandatory retrofits, design hearings triggered at 10+ units with neighbor input, below-market units and fees for new developments only, and consistent failure to meet housing targets without consequences.

  The user wants to understand the theoretical foundation behind these rules. They observe that the system privileges current residents and existing structures while treating change as something that needs justification. Their core questions are: Is this one coherent theory or two bolted-together ideas? What commitments does the system actually make about who has rights to the city? And crucially - what would practically change if they flipped to a growth-oriented, newcomer-inclusive approach?

  This person is clearly thoughtful and experienced but not academic. They want concrete, jargon-free analysis. The emotional tone suggests frustration with the system's contradictions - especially how it protects existing structures while blocking new housing despite official targets. The unspoken need might be for intellectual tools to challenge the status quo at board meetings.

  The grandfathering rules and reconstruction rights create a strong property-rights framework where existing owners have near-absolute claims. The design hearings and below-market requirements then layer on community-control elements giving neighbors veto power over change. The retrofit mandates show safety trumps pure property rights, but only when altering buildings. This creates tension: existing structures get grandfathered in but must be made safe when modified.

  The trigger at exactly 10 units is fascinating - it's clearly creating a loophole developers exploit with 9-unit buildings. This threshold effect undermines the city's own housing goals. The lack of consequences for missing targets reveals the system's true priority isn't housing supply but stability.

  If we flipped to a "newcomers matter equally" theory, we'd need concrete changes: eliminate the 10-unit trigger for hearings, replace hyperlocal appeals with citywide standards, phase out grandfathering by setting retrofit deadlines, make affordability fees apply to major renovations too, and most importantly - create automatic approvals if housing targets aren't met. The lottery priority for locals would also disappear.

  The key insight is that current rules aren't neutral; they actively choose incumbents over newcomers through mechanics like appeal rights and grandfathering. Changing that requires dismantling the procedural advantages current residents hold over development. The retrofit exception proves safety concerns can override pure property rights - that logic could extend to housing supply emergencies if the political will existed.
answer: |-
  Here's a breakdown of the theory underneath your zoning rules, the concrete commitments it makes, and what a flipped system would look like in practice – all without jargon:

  **The Core Theory: "Incumbent Stability"**

  The package of rules you described primarily serves one central idea: **Protecting the existing residents, property owners, and the physical character of the city *as it is now*, from disruptive change.** Change is seen as inherently risky or burdensome and requires justification and mitigation. Stability is the default good.

  1.  **Grandfathering & Rebuilding Rights:** This strongly protects **existing property rights and expectations**. The owner of an existing building has a vested right to its form and use, even if new rules would forbid it. This treats the *status quo* as a legitimate, protected position. Harm comes from *losing* what you have, not from being *denied* something new. The rebuild rule reinforces this: destruction by *force majeure* (fire, storm) doesn't forfeit your right, but *choosing* to change does.
  2.  **Mandatory Retrofits:** This is the exception proving the rule. Safety trumps pure property rights *only when modifying the building*. It doesn't force the owner to change the *use* or *density*, just the safety. It prioritizes protecting *current* occupants and neighbors from disaster over the owner's absolute freedom. Crucially, it happens *within* the existing structure/footprint.
  3.  **10-Unit Trigger & Hyperlocal Input/Appeal:** This gives **current nearby residents and property owners significant control over change in their immediate vicinity.** The "fit with streetscape" standard prioritizes minimizing visual and perceived disruption to the *existing* environment. The appeal right granted *only* to immediate neighbors institutionalizes their power to veto or demand modifications. The system acknowledges that change imposes costs (real or perceived – views, traffic, "character") primarily on those closest to it.
  4.  **The 9-Unit Dodge:** This is a direct consequence of the 10-unit trigger. It shows developers understand the system's bias: avoiding the trigger (and its costs – time, design review, fees, affordability mandates) is preferable, even if it means building slightly less housing. It fragments development to avoid scrutiny.
  5.  **Fees & Below-Market Units (Only on New):** New development is charged for imposing burdens on *existing* public infrastructure (parks, schools, transit) and for contributing to affordability issues. Existing buildings are exempt because they are part of the established baseline. The fees act as compensation paid by the "change agent" (the developer/new residents) to the incumbent system for the disruption caused. The local preference in the lottery further prioritizes *current* community members.
  6.  **Missed Housing Targets (No Consequence):** This reveals the system's *true* priority. The target is an aspirational gesture, but the *operational rules* (grandfathering, difficult approval for new density, fees) actively work against achieving it. The lack of consequence confirms that creating new housing is a secondary goal, subordinate to protecting stability and incumbent interests. The rules aren't designed primarily to *enable* growth to meet the target.

  **Are the Two Pictures (Incumbent Rights vs. Change as Harm) Bolted Together or One?**
  They are fundamentally **one coherent picture: "Incumbent Stability."** Protecting existing property rights (grandfathering) and giving existing residents control over change (hearings, appeals) are two sides of the same coin. The "change as harm" idea is the *justification* for the protections: change *is* the potential harm to be mitigated or prevented to protect incumbents. The fire retrofit rule fits because it addresses a harm *to* incumbents (unsafe buildings) without fundamentally altering the status quo (use, density).

  **What Does This System Strictly Commit To?**
  1.  **Existing Property Rights Trump Potential New Ones:** An owner has stronger rights to keep/rebuild what exists than a developer (or future resident) has to build something new/different.
  2.  **Physical Change Requires Justification:** Maintaining the physical *status quo* is the default. Proposing a change requires a process to justify it and mitigate its impacts *on the existing environment and residents*.
  3.  **Hyperlocal Voices Have Priority Over Broader Interests:** The concerns of immediate neighbors ("fit," perceived burdens) carry more weight than citywide needs (like overall housing supply) in the approval process.
  4.  **Newcomers/Development Bear the Cost of Change:** New development must pay (fees, affordability units, design constraints) to "offset" its impact on the existing system. Existing structures are not responsible for solving citywide problems they contribute to (like underfunded infrastructure or lack of affordable units).

  **What is it Compatible With, But Doesn't Strictly Commit To?**
  *   *Specific architectural styles:* "Fit" could be interpreted flexibly.
  *   *The* level *of affordability required:* The *principle* of charging new development is committed, the specific % or fee amount isn't.
  *   *The exact threshold:* Why 10 units? Why 300 feet? These are somewhat arbitrary choices within the framework. The *principle* of a threshold triggering review and hyperlocal input is the core commitment.

  **Where is it Underdetermined?**
  *   *How much "harm" justifies blocking change?* The "fit" standard is inherently subjective. How much disruption is too much? This is where discretion, precedent, and local politics play a huge role.
  *   *The weight of citywide goals vs. hyperlocal concerns:* The rules prioritize hyperlocal input, but don't explicitly say citywide goals (like housing targets) count for *nothing*. How much weight they *should* have is unresolved within the rules themselves.

  **Concrete Changes Under a "Newcomers & Outcomes Matter Equally" System**

  Swapping the core theory means prioritizing housing supply, welcoming newcomers, and judging projects by the final outcome ("Is this a good building? Does it help meet our needs?") rather than the fact of change itself ("Does it disrupt what's there?"). Here's what would change *concretely* for your board:

  1.  **Eliminate or Radically Raise the Unit Threshold for Discretionary Review:** Instead of 10 units triggering a full design hearing/appeal, perhaps only projects over 50 units, or those requiring major variances, get that level of scrutiny. Smaller projects (like those 9-unit ones) would get streamlined, by-right approval if they meet clear, objective zoning standards (height, setbacks, lot coverage, design basics). **Concrete:** You'd review far fewer projects; many would be approved administratively.
  2.  **Replace "Fit with Streetscape" with Objective Design Standards:** Instead of subjective "fit," define clear, measurable design rules (e.g., facade articulation requirements, window proportions, materials palette options, ground-floor activation standards). Projects meeting these standards get approved. Focus shifts to the building's *own quality* and compliance, not its comparison to neighbors. **Concrete:** Hearings focus on objective compliance, not neighbor opinions on "fit." Appeals based *only* on violation of written standards.
  3.  **Broaden Standing for Input and Appeal:** Allow anyone in the city to comment meaningfully on larger projects. Appeals might go to a citywide body (like City Council) instead of being decided by/for hyperlocal interests. **Concrete:** Hearings have more diverse speakers; appeals consider citywide impacts like housing supply.
  4.  **Phase Out Grandfathering or Impose Fees on Major Renovations:** Existing buildings undergoing significant renovation (e.g., >50% value) could be required to comply with *some* current rules (like affordability fees) or lose non-conforming status if changing use. **Concrete:** More existing properties contribute to city goals when they choose to change.
  5.  **Mandate "By-Right" Zoning to Meet Housing Targets:** Zones would be rewritten to allow enough housing capacity *as of right* (meaning no discretionary hearings needed if standards met) to realistically meet the city's targets. If targets are consistently missed, large areas would be automatically upzoned. **Concrete:** Your board's role shrinks; more development happens without you. Failure has consequences (automatic upzoning).
  6.  **Eliminate Local Preference in Affordable Lotteries:** Below-market units are allocated based solely on income qualification within the broader region, recognizing housing needs extend beyond current city limits. **Concrete:** Lottery rules prioritize regional need, not current residency.
  7.  **Shift Fee Burden / Funding Source:** Explore broader-based funding (e.g., property tax surcharge, city bonds) for parks/schools/transit, reducing reliance solely on fees from new housing, which inherently constrains supply. **Concrete:** Fees on new development might be lower or phased differently, lessening the deterrent to building.

  **The Bottom Line Shift:** Under "Incumbent Stability," your board's primary role is to *gatekeep* change to protect the *status quo*. Under "Newcomers & Outcomes Matter Equally," your board's primary role (for the projects you *do* review) would be to *ensure* new projects meet clear, objective standards that serve the city's *future* needs, with a strong bias towards allowing housing that complies. The mechanics change from reactive protection to proactive enablement within defined parameters.
