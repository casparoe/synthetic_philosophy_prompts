prompt: |-
  I am teaching a graduate seminar on population ethics and the long-term future this spring, and I want the first session to be about the standard of assessment rather than about the positions. What I do not have, and would like from you, is the specification: what a normative view in this area has to be able to do in order to count as adequate — the cases it must get right, the distinctions it must respect, the formal and empirical results it must be consistent with — with the case or consideration behind each requirement.

  Fix the purpose, since adequacy is relative to it. The theory is to be good enough for an institution — a large foundation, or a government office setting research priorities — that has to choose now between three kinds of expenditure: causes whose benefits are near-term and comparatively well-evidenced; measures aimed at reducing the risk that human civilization ends prematurely; and measures aimed at improving the character rather than the duration or the existence of the far future. It need not be a complete account of beneficence. It has to rank those three, justify the ranking, and say in what circumstances the right answer is to spend on none of them and leave the money in the bank.

  Give me numbered entries in prose, a paragraph or two each: the requirement first, then the case or consideration that makes it one. Here, roughly, is the material I want worked into the list — but sort it rather than echoing it back. Some of these I suspect are genuine desiderata; some I suspect are the prejudices of one camp; some may not be requirements on a theory at all but requirements on the people using one. Tell me which is which, and why.

  - It should keep separate the good of making the future longer, the good of making it better, and the good of there being a future at all. These come apart: a policy may raise expected welfare conditional on survival while lowering the probability of survival, or extend the future while filling it with less.
  - It should have an answer to the non-identity problem. Long-run policies determine which people exist, so those who exist under them typically cannot have been harmed by them; a theory that needs a complainant either falls silent across most of its domain or has to compare whole histories rather than individuals. Is that silence a defect to be remedied or a feature to be insisted on?
  - It should say something, or explain why it need not, about aggregation: whether the size of a future population is itself a good, and what follows for a very large future of lives barely worth living against a smaller future of flourishing ones.
  - It should be usable under cluelessness. If the sign of an intervention's far-future effects is unknown and the plausible errors are roughly symmetric in magnitude, what does it recommend — and can it say so without treating every inconvenient consequence claim as unknowable and every convenient one as established?
  - It should take a position on Pascalian fanaticism: on whether responsiveness to astronomically large payoffs at very small probabilities is a requirement of rationality or a reductio, and on whether the familiar ways of damping it — probability thresholds, bounded utilities, variance-aversion — are principled or ad hoc.
  - It should say how much rests on the empirical claim that we live at an unusually pivotal moment, a period of elevated risk that will either be survived or not, and what becomes of its recommendations if that claim is false, or merely unverifiable.
  - It should not assume that risk reductions from different sources simply add up. If hazards are correlated — if there are common modes of failure, or if suppressing one raises another — then the ranking of interventions depends on a structure we may not know; and if we do not know it, the theory should say whether the ranking is indeterminate or merely uncertain.
  - It should distinguish, or explain away, two goods that get run together: preserving future people's capacity to determine their own values, and making their lives go well by our present lights. The second appears to license paternalism on an astronomical scale, while the worry about values becoming locked in appears to push hard against it. Can a theory have both?
  - It should state its sensitivity to the scale premise — to the empirical guesses about how many morally significant beings the future could contain — and how much of the case survives a modest rather than an astronomical estimate.
  - It should be such that a generation following it is not required to sacrifice indefinitely for its successors. If the future is enormous and investments compound, the maximizing answer may be that every generation saves nearly everything and consumes nearly nothing: a result no generation has reason to comply with, and one that, if complied with, produces the sacrifice without the benefit. Is avoiding that a real desideratum, or only an admission that we want a comfortable theory?

  Add whatever else belongs on the list; I would rather learn now what I have omitted. Then the two things I care about most. First, if some subset of the requirements cannot be jointly satisfied, say so explicitly and exhibit the tension — the list itself is then the result I want my students to see, so map the incompatibilities. Second, tell me which single requirement excludes the largest number of views people actually hold: the popular longtermist package, its person-affecting and near-termist critics, and the standard maximizing consequentialism both sides tend to fall back on. One closing paragraph showing the list at work is enough. Do not write a scorecard; I will build that with the seminar.
reasoning: |-
  Okay, the user is teaching a graduate seminar on population ethics and the long-term future. They want the first session to focus on the standards for assessing normative views rather than the positions themselves. They need a list of requirements for a theory to be considered adequate, specifically for an institution choosing between near-term causes, existential risk reduction, and improving the far future's character. 

  Hmm, the user provided a lot of material to incorporate. They mentioned ten points, some of which might be genuine requirements, others might be biases, and some could be about the users rather than the theory. I need to sort through these, identify which are valid requirements, and add any missing ones. The institution's context is crucial here—this isn't about personal ethics but policy decisions with massive resources.

  First, I should fix the purpose. The theory must rank three types of expenditures and justify the ranking. It also needs to say when to save money instead. The key is that it doesn't have to cover all aspects of beneficence, just these specific choices. 

  Looking at the user's points:
  1. **Distinguishing goods:** The separation between duration, quality, and existence seems fundamental. A theory that conflates these might misprioritize. For example, reducing existential risk vs. improving future quality—these are distinct and might conflict.
  2. **Non-identity problem:** This is critical because long-term policies affect who exists. If a theory requires identifiable complainants, it might be silent on many policies. Silence here could be a dealbreaker for institutional use.
  3. **Aggregation:** Population size vs. quality is a core issue in population ethics (e.g., the Repugnant Conclusion). The theory must address this since the future could involve vast populations with varying welfare levels.
  4. **Cluelessness:** Given massive uncertainty, the theory needs to handle interventions where the net effect is unknown. It shouldn’t arbitrarily dismiss inconvenient uncertainties.
  5. **Pascalian fanaticism:** How the theory handles tiny probabilities of huge payoffs is vital. If it demands spending on all such risks, it could bankrupt the institution. But ignoring them might be irrational.
  6. **Pivotal moment:** The theory must clarify how much its recommendations depend on the claim that we live in a uniquely high-risk era. If this claim is false, does longtermism collapse?
  7. **Risk interactions:** Hazards aren’t independent. A theory must account for correlations and unknown interactions between risks without assuming additivity.
  8. **Value lock-in vs. paternalism:** Improving the future by current values might conflict with preserving future autonomy. The theory needs to navigate this tension.
  9. **Scale sensitivity:** The theory should state how its recommendations change with different estimates of future population size. If the scale is modest, does longtermism still hold?
  10. **Indefinite sacrifice:** Avoiding demands for extreme generational sacrifice is crucial. Otherwise, the theory becomes self-defeating.

  The user also wants to know which requirements conflict and which single requirement excludes the most existing views. 

  Conflicts I see:
  - **Aggregation vs. non-identity:** Theories that avoid the Repugnant Conclusion (e.g., average utilitarianism) might struggle with the non-identity problem. Person-affecting views reject aggregation but then can’t handle cases where different populations exist.
  - **Pascalian fanaticism vs. cluelessness:** Bounding utilities to avoid fanaticism might clash with handling cluelessness, as bounding could ignore tail risks.
  - **Indefinite sacrifice vs. maximization:** Maximizing total welfare might demand near-total savings, conflicting with the requirement to avoid indefinite sacrifice.

  The single requirement that excludes the most views is likely the non-identity problem. Standard person-affecting views (common among near-termists) fail here because they can’t handle policies that create new populations. Total utilitarianism struggles with the Repugnant Conclusion, while average utilitarianism has its own problems. Longtermists often bite the bullet on non-identity, but critics find this unsatisfying.

  Missing requirements? Perhaps:
  - **Tractability:** The theory must be practically applicable by institutions, not just theoretically coherent.
  - **Dynamic consistency:** Recommendations shouldn’t change arbitrarily over time, undermining institutional planning.
  - **Robustness under empirical uncertainty:** Since many claims (e.g., pivotal moment) are uncertain, the theory should offer guidance even when evidence is shaky.

  The user cares most about conflicts and which requirement is most exclusionary. I’ll need to explicitly map tensions and argue that non-identity is the biggest hurdle. 

  Also, some user points might not be requirements:
  - **Value lock-in vs. paternalism:** This feels more like a challenge the theory must address rather than a fixed requirement. A theory could prioritize one over the other.
  - **Pivotal moment:** This is an empirical dependency, not a formal requirement. The theory should state its sensitivity to this claim but doesn’t necessarily need to "solve" it.

  Finally, the closing paragraph should show how the list exposes fault lines without scoring theories. Highlight that the non-identity problem divides person-affecting views from others, and that conflicts between aggregation and sacrifice requirements reveal deep tensions in consequentialism.
answer: |-
  Here is a structured list of requirements for a normative theory tailored to your institution's purpose, sorted for clarity. I distinguish genuine desiderata (G) from contested assumptions (C), user-facing constraints (U), and non-requirements (N). Conflicts are marked explicitly. One requirement—**Non-Identity Robustness**—emerges as the most exclusionary.

  ---

  ### Core Requirements for Institutional Adequacy
  1. **Distinction of Future Goods (G)**  
     The theory must separately account for (a) increasing the *duration* of civilization, (b) improving the *quality* of future lives, and (c) securing the *mere existence* of a future.  
     *Rationale*: Policies often trade off these goods. For example, geoengineering might extend civilization’s duration (a) while lowering quality (b) via ecological strain, or a risky innovation might boost quality (b) while threatening existence (c). Conflating them risks misranking interventions (e.g., prioritizing duration over existence when they conflict).

  2. **Non-Identity Robustness (G)**  
     The theory must rank policies that determine who exists, without relying on harm to specific individuals. It must justify outcomes where future people owe their existence to the policy but live worse lives.  
     *Rationale*: Near-term existential risk reduction (e.g., nuclear disarmament) alters which individuals exist. A theory demanding identifiable victims (e.g., classical person-affecting views) cannot assess such policies—rendering it useless for the institution’s primary goal. Silence here is a fatal defect.

  3. **Aggregation Framework (G)**  
     The theory must explicitly state whether population size is intrinsically valuable and resolve trade-offs between quantity and quality of lives (e.g., the "Repugnant Conclusion").  
     *Rationale*: Comparing a vast future of barely worthwhile lives to a smaller flourishing one is central to prioritizing "improving the far future" (e.g., values interventions) vs. "extending duration." Avoiding this (e.g., via average utilitarianism) often breaks elsewhere (see §8 conflict).

  4. **Cluelessness Tolerance (U)**  
     The theory must guide decisions when the net far-future effects of interventions are unknowable and symmetric in expected dis/benefit. It must not selectively dismiss uncertainties to favor convenient conclusions.  
     *Rationale*: Many long-term interventions (e.g., AI governance) have poorly quantified flow-through effects. A theory requiring precise impact estimates (e.g., some cost-benefit models) becomes inert. This is a constraint on *usability*, not theoretical coherence.

  5. **Pascalian Fanaticism Stance (G)**  
     The theory must justify its treatment of tiny probabilities of vast payoffs (e.g., 1e-9 chance of saving 1e30 lives). It must either embrace, bound, or reject such reasoning and critique common damping methods (e.g., probability thresholds).  
     *Rationale*: Existential risk interventions often target low-probability, high-stakes scenarios (e.g., asteroid deflection). If the theory demands pursuing all such gambles, it may divert all resources to speculative risks; if it rejects them, it may neglect pivotal threats.

  6. **Scale Sensitivity (G)**  
     The theory must state how its recommendations depend on the estimated scale of the future population (e.g., 10^12 vs. 10^30 beings). It should clarify whether modest scales nullify long-term priorities.  
     *Rationale*: The case for prioritizing the far future often hinges on vast scale estimates. If the theory collapses when assuming 1,000 future generations instead of 1e6, its institutional applicability is fragile.

  7. **Dynamic Consistency (G)**  
     The theory must not require indefinite sacrifice (e.g., each generation saving 99% of resources for successors). It should ensure its prescriptions are sustainably implementable across generations.  
     *Rationale*: Unbounded compound growth in expected value can demand near-total asceticism (§10 of your list). This is self-defeating: no generation would comply, and if enforced, it wastes resources without benefit. A theory ignoring this is *practically* self-refuting.

  ---

  ### Contextual Requirements
  8. **Risk Interdependence (C)**  
     The theory should not assume risk reductions are additive. It must accommodate correlations between hazards (e.g., AI risk and biosecurity failures sharing infrastructure) and unknown interactions.  
     *Rationale*: If risks are anti-correlated (e.g., suppressing pandemics accelerates AI development), prioritizing "existential risk reduction" requires understanding portfolio effects. However, this is less a fixed requirement than a call for *robustness under ignorance*—the theory should flag when rankings depend on unknown correlations.

  9. **Value Sovereignty vs. Paternalism (N)**  
     The theory need not resolve the tension between preserving future autonomy and optimizing lives by current values, but it must acknowledge the distinction and its implications for "improving the far future."  
     *Rationale*: While conflating these (e.g., "lock-in" concerns) can distort rankings (§8 of your list), a theory can coherently prioritize one over the other (e.g., value-neutral risk reduction). This is a *challenge to address*, not an independent requirement.

  10. **Pivotal Moment Sensitivity (C)**  
      The theory should state how its recommendations depend on the claim that the present is uniquely high-leverage. If false/unverifiable, it must still rank the three expenditure types.  
      *Rationale*: Critics argue longtermism collapses absent a "pivotal moment." A robust theory should function even if leverage is diffuse (e.g., by weighting time-discounted expected value). This is a *stress test*, not a core requirement—empirical uncertainty is inevitable.

  ---

  ### Key Conflicts and Tensions
  - **§2 (Non-Identity) vs. §3 (Aggregation)**: Person-affecting theories (§2) avoid the Repugnant Conclusion but fail to rank identity-affecting policies. Total utilitarianism (§3) handles non-identity but endorses repugnant outcomes. *No theory fully satisfies both*.  
  - **§5 (Fanaticism) vs. §4 (Cluelessness)**: Bounding utilities to avoid fanaticism (§5) may ignore tail risks that cluelessness (§4) demands we treat symmetrically.  
  - **§3 (Aggregation) vs. §7 (Dynamic Consistency)**: Maximizing total value (§3) can require indefinite sacrifice (§7), creating a paradox: the "optimal" policy is collectively self-defeating.  
  - **§8 (Risk Interdependence) vs. §4 (Cluelessness)**: Accounting for risk interactions (§8) requires knowledge the institution lacks, exacerbating cluelessness (§4). A theory may need default heuristics (e.g., assume independence).

  ---

  ### The Most Exclusionary Requirement: Non-Identity Robustness (§2)  
  This requirement alone excludes:  
  - **Person-affecting views** (common among near-termists), which cannot evaluate policies that create new populations.  
  - **Complaint-based theories** (e.g., some deontological approaches), which require identifiable victims.  
  - **Standard maximizing consequentialism** (if it relies on interpersonal comparisons), which struggles to explain why creating people with miserable lives is bad if they wouldn’t otherwise exist.  
  - **Popular longtermism** escapes by accepting totalism or similar, but only by biting bullets (e.g., Repugnant Conclusion) that critics reject.  

  ---

  ### The List at Work  
  A theory for your institution must *at minimum* satisfy §1–§7. §2 (Non-Identity) is the hardest gatekeeper, eliminating views that cannot speak to the institution’s core dilemma: shaping a future inhabited by different people. The deepest tensions arise between aggregation (§3) and dynamic consistency (§7), forcing a choice between theoretical purity and practical implementability. This list reveals why no extant view is fully adequate—person-affecting theories fail §2, total utilitarianism fails §7, and cluelessness (§4) haunts all. Your seminar can map how contenders negotiate these demands.
