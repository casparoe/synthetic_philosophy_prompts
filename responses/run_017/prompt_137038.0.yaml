prompt: |-
  I teach aesthetics, and I somehow also sit on the university committee that decides what counts as a "work" for our percent-for-art scheme — i.e. what gets paid for out of the building budget, insured as art, and maintained in perpetuity. Our track record so far:

  - bronze figurative memorial, cast from a clay maquette — accepted
  - the foundry's full-size working plaster, kept afterwards as a record — rejected ("a stage in production")
  - hand-painted ceramic tiles for a foyer, commisioned from a local studio — accepted
  - a 1930s operating theatre restored in situ in the medical school — rejected ("heritage, not art")
  - eight speakers in the law library playing a live feed of the building's own ventilation noise, pitch-shifted, on a fourty-year schedule with no performer after the opening night — accepted
  - four hundred glass microscope slides of plant tissue made by a 19th-century botanist, shown as an unlabelled grid because a curator asked us to — rejected ("scientific objects")
  - a tapestry woven by six workshop weavers to a cartoon supplied by a named artist — accepted

  Here's the new one and I have to guess how we'll rule. The engineering department wants the scheme's money for the nanotech building's facade: three thousand stainless fins whose spacing is set by an optimisation algorithm that minimises cooling load. The pattern gets re-run by the building management system each season, so it drifts from year to year; the engineers are publishing the code; they describe it as "a shading system that happens to read as moiré" and have written an artist's statement because we asked them to; the faculty art committee is enthusiastic.

  I don't want a general essay on the definition of art. I want the two or three rules that fit our past verdicts about equally well, what each of them predicts here, your best guess with the reason for preferring it, which of our precedents is the closest analog and why it's genuinely unclear which way it points, and the one further proposal I should put in front of the committee to separate the rules that are still standing.
reasoning: |-
  Okay, the user teaches aesthetics and is part of a university committee deciding what qualifies as "art" for their percent-for-art scheme. They've provided several past decisions and a new proposal involving an algorithmically designed building facade. The user wants specific rules derived from precedents, a prediction for the new case, a closest analog, and a test case to distinguish between rules.

  First, I need to analyze the past decisions to identify patterns. Accepted items include a bronze memorial (traditional art), commissioned ceramic tiles (decorative art), sound installation (conceptual art with artist's intent), and a tapestry (collaborative but artist-led). Rejected items: the plaster model (production stage), operating theatre (heritage), and microscope slides (scientific objects). 

  The key factors seem to be artist's intent versus functional purpose, uniqueness, and whether the object was created as art. The sound installation was accepted because it had an artist's statement and was framed as art, even though functional. The facade proposal has an artist's statement, but its primary function is shading. 

  The closest analog is the sound installation: both involve systems, algorithms, and functionality. But the sound piece had a live feed and performer initially, while the facade is purely functional. The microscope slides were rejected as scientific objects, similar to the facade's engineering purpose. 

  The user needs rules that fit past decisions. Rule 1: Artist-led intent. Rule 2: Primary non-utilitarian purpose. The facade has an artist's statement but is primarily functional. The test case could be functional objects recontextualized as art, like a bench designed by an artist versus one optimized for comfort. This would clarify if intent overrides function.
answer: |-
  Based on your committee's precedents, two core rules emerge as equally plausible interpretations, leading to conflicting predictions for the nanotech facade. A third rule is less consistent but worth considering. Here's the breakdown:

  **Rule 1: "Artist-Led Intent & Framing"**
  *   **Definition:** The work must be conceived, commissioned, or explicitly framed *as art* by a recognized artist (or collective acting *as artists*) from its inception, even if functional or process-driven. The "artist's statement" is crucial evidence.
  *   **Fits Precedents:**
      *   *Accepted:* Bronze memorial (sculptor's intent), Ceramic tiles (commissioned artist/studio), Sound installation (artist's concept/statement, performer), Tapestry (named artist's cartoon).
      *   *Rejected:* Plaster (production stage, not *final* artwork intent), Operating theatre (functional heritage, no artistic framing), Microscope slides (scientific purpose, curator's *later* framing insufficient).
  *   **Prediction for Facade:** **ACCEPTED.** The engineers provided an artist's statement *framing it as art* ("read as moiré"), despite its primary function. This mirrors the sound installation (functional system framed as art).
  *   **Rule 2: "Primary Non-Utilitarian Purpose/Cultural Object"**
  *   **Definition:** The primary purpose/value must be aesthetic, commemorative, or cultural contemplation, *not* utilitarian, scientific, or historical documentation. Function can exist but must be secondary to the artistic experience.
  *   **Fits Precedents:**
      *   *Accepted:* Bronze memorial (commemoration/aesthetics), Ceramic tiles (decoration/aesthetics), Sound installation (aural experience/concept over function), Tapestry (aesthetic object).
      *   *Rejected:* Plaster (utilitarian production tool), Operating theatre (utilitarian heritage/history), Microscope slides (utilitarian scientific data/objects).
  *   **Prediction for Facade:** **REJECTED.** The primary purpose is demonstrably functional (minimizing cooling load, shading system). The aesthetic effect ("reads as moiré") is a byproduct, not the core intent or value. This aligns with rejecting the slides (scientific objects) and theatre (functional heritage).
  *   *(Less Consistent) Rule 3: "Unique, Authored Object/System"*
      *   **Definition:** The work must be a unique, fixed (or predictably evolving) authored object or system, not a mass-produced component or ephemeral stage.
      *   **Fits *Some* Precedents:** Bronze (unique cast), Tapestry (unique woven object), Sound installation (unique authored system). *But struggles with:* Tiles (could be seen as components), Plaster (unique but rejected), Slides (unique but rejected), Theatre (unique but rejected). The facade's uniqueness and authorship are strong, but this rule doesn't cleanly explain rejections like the theatre or slides.

  **Best Guess & Reasoning:**
  *   **Prediction: REJECTED (leaning towards Rule 2).**
  *   **Reason:** While Rule 1 (Intent/Framing) is tempting given the artist's statement and the sound installation precedent, **Rule 2 (Primary Non-Utilitarian Purpose) aligns more fundamentally with the core rejections** (Operating Theatre, Microscope Slides). The facade's *primary* function is explicitly and quantifiably utilitarian (energy efficiency). The aesthetic effect is secondary and emergent, much like the historical interest of the theatre or the inherent patterns in the slides. The sound installation's *primary* purpose *was* the aesthetic/conceptual experience of the noise feed itself; its location and "function" were secondary to that experience. Here, the moiré effect is secondary to the shading function. The engineers' framing feels *post hoc* to secure funding, unlike the sound piece conceived as art from the start.

  **Closest Analog & Why Unclear:**
  *   **Closest Analog: The Microscope Slides.**
  *   **Why Unclear:** Both involve pre-existing or primarily functional objects/systems with inherent visual qualities later presented for aesthetic contemplation. The committee rejected the slides as "scientific objects." The facade is an "engineering system." The key ambiguity is whether the *engineers' framing as art* (via the statement) and the *algorithmic generativity* are sufficiently different from the *curator's framing* of the slides to trigger Rule 1 (Intent) instead of Rule 2 (Primary Purpose). The slides were historical scientific tools; the facade is a novel, authored, dynamic system. Does this authorship and dynamism elevate it to "art" despite its core function? The sound installation precedent suggests dynamism + framing *can* work, but its function was negligible compared to its artistic intent.

  **Test Proposal to Separate Rules 1 & 2:**
  Propose this scenario to the committee:
  > **"A functional, ergonomic bench designed by a world-renowned industrial designer for maximum comfort in a public plaza. It uses proprietary algorithms to shape the form. The designer provides an 'artist's statement' claiming the bench is a 'sculptural exploration of the human body at rest' and submits it to the percent-for-art scheme."**

  *   **Why it Separates:**
      *   **Rule 1 (Intent/Framing):** Would likely **ACCEPT**. A recognized designer (potentially acting as artist) provides an artist's statement framing it as art/sculpture from inception, despite its utility. Parallels the sound installation and the facade proposal.
      *   **Rule 2 (Primary Purpose):** Would likely **REJECT**. The primary purpose is undeniably utilitarian (sitting comfortably). The aesthetic/sculptural claim is secondary, much like the facade's moiré effect or the slides' patterns. Parallels the operating theatre and microscope slides.
      *   **Outcome:** The committee's decision on this bench will reveal whether "Artist-Led Intent & Framing" (Rule 1) can override a demonstrably primary utilitarian function, or if "Primary Non-Utilitarian Purpose" (Rule 2) remains the stronger determinant. This directly clarifies the tension in the facade case.

  Your committee's decision on the nanotech facade hinges on whether the *engineers' after-the-fact artistic framing* and the system's *emergent aesthetics* are sufficient to overcome its *primary utilitarian function* – a hurdle the historical operating theatre and scientific microscope slides could not clear. The "functional bench by a designer/artist" test case will force a resolution between these competing interpretations of your precedents.
