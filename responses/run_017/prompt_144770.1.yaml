prompt: |-
  I spent a career in field ecology and have come to philosophy late, by way of probability and causation. I now sit on a volunteer panel that reviews the automated systems used by our state's housing-assistance agency, and we have run into what I take to be the practical form of a familiar impasse.

  The system is two-staged: every applicant receives a score, and only the highest-scoring fifth is referred for a costly in-person eligibility review. That review can end in either of two ways — it can unlock aid, which benefits the applicant, or it can terminate an existing award for ineligibility, which does not — so even the sign of the outcome's value is in dispute. The groups we are required to compare differ in their measured rates of the outcome the score predicts; those rates drift between retrainings; and because only the referred fifth is ever reviewed, error rates can be estimated only on that selected pool and never on the applicant population as a whole.

  As I understand the relevant impossibility results, calibration, equal false-positive and false-negative rates, and predictive parity cannot in general hold together under those conditions: something has to be surrendered. What the mathematics does not tell us is what to surrender, and that is precisely the decision before us.

  Please write a decision procedure our panel can actually run: the questions in order, what would count as a sufficient answer to each, the points at which the procedure returns a stop — do not deploy, or do not use this criterion at all — and the points at which it must hand the question back to us as a matter of values rather than fact. It has to be usable by a panel with no statistician on it, meeting monthly, that must produce a one-page recommendation a director will sign, using only data the agency already logs. It must say what to do when a required quantity cannot be estimated, when a group is small enough that the estimates are mostly noise, when the rates have drifted since the last retraining, and when the agency's counsel demands a single headline disparate-impact figure that the mathematics does not uniquely settle.

  Apply the procedure to two or three cases of your own construction, at least one of which should yield an answer our panel will not welcome, and close by stating plainly what the procedure cannot settle. Please write in American English.
reasoning: |-
  We are designing a decision procedure for a panel reviewing an automated scoring system used in a housing-assistance agency. The system scores applicants and refers the top 20% (highest-scoring fifth) for an in-person review. This review can have two outcomes: granting aid (beneficial) or terminating existing aid (detrimental). The agency is required to compare different demographic groups, but note that we only observe outcomes (i.e., the review result) for the referred group. The challenge is to decide which fairness criterion to prioritize when it is impossible to satisfy all of calibration, equal false positive/negative rates, and predictive parity simultaneously.

  The procedure must:
  1. Be usable by a non-statistical panel meeting monthly.
  2. Produce a one-page recommendation.
  3. Use only data already logged by the agency.
  4. Handle situations where required quantities cannot be estimated, groups are too small, rates have drifted, and when a single headline disparate-impact figure is demanded but not uniquely settled.

  We break the procedure into a series of questions. The panel must answer these in order until a stopping condition is reached. The procedure will either:
     - Recommend deployment (or continued use) without changes.
     - Recommend not deploying (or discontinuing use) of the current system.
     - Recommend against using a particular criterion (due to impossibility or unreliability).
     - Or, at certain points, hand the decision back to the panel as a matter of values.

  We assume the agency logs, at a minimum:
     - For each applicant: group membership (e.g., race, gender, etc. as required by law), score, whether referred (top 20%), and if referred, the outcome of the review (aid granted or terminated).

  We note that the outcome is only observed for the referred group. Therefore, we can only compute error rates (like false positives and false negatives) on the referred group, and even then we have to be cautious because the threshold for referral is set by the score.

  The procedure:

  Step 1: Check Data Sufficiency
     Question 1.1: For each protected group (as defined by law and agency policy), are there at least 30 referred cases in the current data (or the most recent retraining data if we are evaluating a model in production) and at least 30 in the non-referred group? (This number is a rule of thumb to have reasonable estimates. Adjust if the panel has a different threshold.)
        - If no for any group, then we cannot reliably estimate any fairness metrics for that group. Proceed to Step 2 but note that for groups with insufficient data, we cannot draw conclusions.

     Question 1.2: Has the system been in use long enough to capture at least 100 referred cases overall? (Again, adjust threshold as needed.)
        - If no, then we do not have enough data to evaluate. Stop and recommend: "Do not deploy until more data is collected" or "Continue monitoring until sufficient data is available."

  Step 2: Check for Drift
     Question 2.1: Compare the overall referral rate (which should be 20%) and the overall positive outcome rate (i.e., the proportion of referred cases that resulted in aid being granted) in the current data with the same rates in the training data (or the data from the last retraining). 
          - If the absolute difference in the positive outcome rate is more than 10 percentage points (or a pre-agreed threshold), then drift is significant. 
          - Also, check if the distribution of scores has shifted substantially (e.g., using a Kolmogorov-Smirnov test at 5% level, but the panel may not run tests; alternatively, if the agency has a drift monitoring system, use its alert). 
          - If drift is detected, then we must retrain the model. Stop and recommend: "Retrain the model immediately and re-evaluate."

     Note: If the panel does not have the capacity to run statistical tests, they can rely on a pre-computed drift metric by the agency's technical team. The procedure should require that the agency provides this.

  Step 3: Evaluate Disparate Impact in Referral
     We note that the referral is the top 20%. The system may have disparate impact if the referral rate for a protected group is less than 80% of the overall referral rate (a common legal threshold). However, note that the referral rate is fixed at 20% overall, so we look at the referral rate for each group relative to the overall.

     Question 3.1: For each protected group, compute the referral rate (proportion of the group that is referred). Then, compute the ratio of the group's referral rate to the overall referral rate (which is 20%). 
          - If for any group this ratio is less than 0.8 (i.e., the group's referral rate is less than 16%), then there is a disparate impact in referral.

     However, note: because the referral is based on a score, if the score is well-calibrated and the groups have different distributions, then the referral rate might naturally vary. But we are only looking at the outcome of referral, and the law may require that the referral rate not be too disparate.

     If disparate impact is found, then we must consider whether this is justified by a business necessity. But note that the agency's goal is to target aid to those who are eligible, so the score should be predictive of eligibility. However, the panel might not have the expertise to judge business necessity. Therefore, we proceed to Step 4 to see if we can adjust the model to reduce the disparity without harming predictive performance too much. But if the agency's counsel demands a single headline figure, the referral rate disparity might be the one to use.

     If no disparate impact in referral, proceed to Step 4.

  Step 4: Evaluate Fairness Criteria on the Referred Group
     We now consider the three criteria that cannot hold simultaneously: calibration, equal false positive rates (FPR), equal false negative rates (FNR), and predictive parity. However, note that we only observe outcomes for the referred group. Therefore, we cannot compute FPR and FNR for the entire population. We can only compute:

        - For the referred group: 
            * False Positive Rate (FPR_referred): Among the referred group, the proportion of those who were denied aid (i.e., the model predicted they should get aid, but upon review they were found ineligible). However, note that the review outcome is the ground truth. But in our case, the outcome of the review is either "aid granted" (positive) or "terminated" (negative). We must define:

              Let:
                Positive outcome: aid granted (so we want to predict this)
                Negative outcome: aid terminated (so we don't want to predict aid for these)

              But note: the model is scoring for "should be reviewed", which is a proxy for "is eligible". So in the referred group:

                True Positive (TP): Referred and aid granted.
                False Positive (FP): Referred and aid terminated.

              Then, in the referred group, we can compute:
                Precision (predictive positive value) = TP / (TP + FP)
                False Positive Rate (FPR) in the referred group? Actually, note: the FPR in the entire population is (FP / (TN + FP)) but we don't know the true negatives (TN) because we don't review the non-referred. So we cannot compute the standard FPR.

        This is a key problem. We cannot compute the false positive rate for the entire population. Similarly, we cannot compute the false negative rate because we don't know what happens to the non-referred.

     Therefore, we must restrict to what we can observe:

     a) Calibration: In the referred group, we can check if the score is calibrated. That is, for applicants with a score of s, the proportion that are truly eligible (aid granted) should be s. But note: the referred group is a selected sample (only the top 20%). Calibration in the referred group does not imply calibration in the whole population.

     b) Predictive Parity: We can compute positive predictive value (PPV) in the referred group. That is, for each group, what is the proportion of referred applicants that actually receive aid? We want PPV to be the same across groups.

     c) We cannot compute FPR and FNR for the whole population. But we can compute the following in the referred group:

          - The proportion of false positives (FP) in the referred group for each group: that is, the proportion of referred applicants in the group who were denied aid (terminated). But note: this is not the FPR (which requires knowing the true negatives in the entire group).

          - The proportion of true positives (TP) in the referred group: that is, the proportion of referred applicants in the group who were granted aid.

          However, without knowing the true negatives and false negatives in the non-referred, we cannot compute the group-wise FPR and FNR.

     Therefore, we focus on what we can compute:

     Question 4.1: Is the model calibrated in the referred group by group? 
          - To check: bin the scores in the referred group (say, 10 bins) and for each bin, compute the observed positive outcome rate (aid granted) for each group. Then, for each group, check if the observed rate is close to the score (which is the predicted probability). 
          - If for any group the observed rates are consistently below the score (indicating overprediction) or above (underprediction), then the model is not calibrated for that group in the referred group.

          However, note: because the referred group is selected, we cannot extrapolate to the whole population.

     Question 4.2: Does the model satisfy predictive parity (equal PPV) by group in the referred group?
          - For each group, compute PPV = (number of referred applicants in the group who got aid) / (total referred in the group).
          - Compare the PPV across groups. A common criterion is that the ratio of PPV between any two groups should be at least 0.8 (or within a margin of, say, 10 percentage points). 

          If not, then there is a disparity in the accuracy of the predictions for the referred group.

     But note: we cannot compute the other error rates. Therefore, we must decide which of these two (calibration or predictive parity) to prioritize. This is a value judgment.

     Step 4.3: The panel must decide which criterion is more important for their context. They can use the following question:

          "Which is more important for the agency? 
            Option A: That the scores assigned to individuals in the referred group are well-calibrated (i.e., a score of 0.8 means 80% chance of being eligible) even if the rate of actually receiving aid (PPV) differs across groups? 
            Option B: That the rate of actually receiving aid among the referred is the same across groups, even if the scores are not calibrated?"

          This is a policy decision. The panel must choose. 

          If they choose A, then we require calibration (in the referred group) and do not require predictive parity. 
          If they choose B, then we require predictive parity and do not require calibration.

     However, note that even if we choose one, we might not be able to achieve it. We must check the data.

     After choosing:

          If they chose A (calibration):
              - Check calibration in the referred group (as in 4.1). If it fails for any group, then the model does not meet the chosen criterion. Proceed to Step 5.

          If they chose B (predictive parity):
              - Check predictive parity (as in 4.2). If it fails for any group, then the model does not meet the criterion. Proceed to Step 5.

     If the chosen criterion is satisfied, then we can proceed to Step 6 (overall performance).

  Step 5: Mitigation
     If the model fails the chosen criterion (either calibration or predictive parity) in the referred group, then we must consider mitigation. However, note that the impossibility results say we cannot have both. So if we are failing on the one we chose, we might try to adjust the model to fix that, but then we might break the other.

     The panel should ask: 
          "Is the disparity in the chosen criterion large enough to be of concern? (e.g., more than 10 percentage points difference in PPV, or in calibration, the average absolute error in the bins is more than 0.1)."

          - If no, then we can tolerate the disparity. Proceed to Step 6.

          - If yes, then we must consider adjusting the model. But note: we are in production and we have to make a decision. We can try to adjust the model by group (e.g., recalibrate the scores for each group, or adjust the threshold for referral by group) to meet the chosen criterion. However, adjusting the threshold by group might be considered discriminatory. 

          Therefore, we recommend: 
              "Retrain the model with fairness constraints that target the chosen criterion (calibration or predictive parity). Then reevaluate."

          If the agency is unable or unwilling to retrain, then the panel must consider whether the harm of the disparity outweighs the benefits of the system. This is a value judgment. The procedure stops and the panel must decide: either accept the system with the disparity or discontinue its use.

  Step 6: Overall Performance
     We must also check that the model is doing a good job at its task.

     Question 6.1: What is the overall PPV (across all groups) in the referred group? 
          - If it is below a threshold (say, 50%), then the model is not effectively identifying eligible applicants. We might be wasting resources on ineligible applicants. 

     Question 6.2: What is the yield? (i.e., the number of eligible applicants found per referral) 
          - If the yield is too low, then the system might not be cost-effective.

     If the overall performance is acceptable, then we can approve the system. If not, we might need to adjust the threshold (but the threshold is fixed at 20%) or retrain.

  Step 7: Handling the Demand for a Single Headline Disparate-Impact Figure
     The agency's counsel may demand a single figure. We suggest using the referral rate disparity (from Step 3) because it is a common legal standard and it is computable on the entire applicant pool. 

     But if Step 3 did not show a referral disparity, then we might use the disparity in the chosen criterion from Step 4 (if one was chosen and found to have a disparity that we tolerated). However, if we tolerated a disparity in Step 5, we must report it. 

     We recommend: 
          "The single headline figure for disparate impact should be the ratio of the referral rate for the most disadvantaged group to the overall referral rate. If that ratio is above 0.8, then report the largest disparity in the chosen fairness criterion (calibration or predictive parity) in the referred group, expressed as the difference in rates (for PPV) or the maximum absolute calibration error (for calibration)."

     But note: the panel might not want to highlight a disparity they have tolerated. Therefore, we must be transparent.

  Summary of the Procedure:

     Step 1: Data Sufficiency -> If insufficient, stop or proceed with caution.
     Step 2: Drift -> If significant, recommend retraining.
     Step 3: Disparate impact in referral -> If found, note it and proceed (unless it is extreme, then consider mitigation).
     Step 4: Choose between calibration and predictive parity for the referred group, then check if the model meets the chosen criterion.
     Step 5: If it fails, decide if the disparity is tolerable. If not, recommend retraining with fairness constraints or discontinue.
     Step 6: Check overall performance.
     Step 7: For the headline figure, use the referral rate disparity if present; otherwise, the largest disparity in the chosen criterion.

  Example Cases:

  Case 1: Ideal Case
     - Sufficient data for all groups.
     - No drift detected.
     - Referral rates: all groups have referral rates between 16% and 24% (so ratio to overall 20% is above 0.8).
     - The panel chooses calibration (Option A). Calibration in the referred group is good: for each group, the observed positive rates in score bins are within 0.05 of the score.
     - Overall PPV is 75%, which is acceptable.

     Recommendation: Continue using the system.

  Case 2: Disparate Impact in Referral
     - Group A has a referral rate of 14% (ratio 0.7 < 0.8).
     - No drift.
     - The panel chooses predictive parity (Option B). 
          Group A: PPV = 60%
          Group B: PPV = 80%
          This fails (difference of 20 percentage points, ratio 0.75 < 0.8).
     - The disparity is considered too large (Step 5: yes, it is of concern).

     The panel must then decide: retrain with fairness constraints to address both the referral disparity and the predictive parity disparity, or discontinue. The procedure returns the decision to the panel.

     Headline figure: The referral rate for Group A is 14% (overall 20%), so ratio 0.7.

  Case 3: Drift and Calibration Failure
     - Drift detected: the overall positive outcome rate in the referred group was 70% in training, now 50%.
     - Stop at Step 2: recommend retraining.

  Case 4: Small Group Size
     - Group C has only 10 referred cases. 
     - Step 1: insufficient data for Group C. We cannot draw conclusions for Group C.
     - For other groups, no issues.
     - The panel must decide: is Group C's representation sufficient to proceed? If the group is legally protected, then the agency might be required to ensure fairness. The procedure notes the insufficiency and proceeds for other groups, but the panel must be aware of the limitation.

     Headline figure: Not available for Group C.

  What the Procedure Cannot Settle:

     - The procedure cannot determine which fairness criterion (calibration or predictive parity) is the right one for the agency. That is a value judgment.
     - It cannot estimate error rates (FPR, FNR) for the entire population because outcomes are missing for the non-referred.
     - It cannot resolve the inherent trade-offs between fairness criteria. It only allows the panel to choose one to prioritize and then checks if that one holds.
     - It cannot determine the business necessity of a disparity found in Step 3 (referral disparity). That is a legal question.
     - It cannot handle cases where the outcome is not just a binary (aid granted/terminated) but has more nuances (e.g., partial aid, different types of aid). We assume binary.

  We now write the procedure in a step-by-step format suitable for the panel.

  ----

  **Decision Procedure for Reviewing the Automated Scoring System**

  **Objective**: To evaluate whether the automated scoring system used for housing assistance meets fairness and performance standards, and to provide a recommendation for deployment/continuation or for corrective action.

  **Required Data**: For each application in the evaluation period (or since last retraining):
     - Applicant ID
     - Protected group membership (for each group of concern)
     - Score assigned by the system
     - Whether referred (top 20% of scores)
     - If referred, the outcome of the review: Aid Granted (positive) or Aid Terminated (negative)

  **Steps**:

  1. **Data Sufficiency Check**:
     a. For each protected group, count the number of referred cases and non-referred cases in the data.
     b. If any group has fewer than 30 referred cases OR fewer than 30 non-referred cases, note: "Insufficient data for group [X]. Results for this group are unreliable."
     c. If the total number of referred cases in the data is less than 100, stop and recommend: "Do not deploy (or continue) the system until more data is collected. Current data is insufficient for evaluation."

  2. **Drift Check**:
     a. Obtain the positive outcome rate (proportion of referred cases that resulted in Aid Granted) from the training data (or last retraining).
     b. Compute the same rate in the current data.
     c. If the absolute difference is more than 10 percentage points, then drift is significant. Stop and recommend: "Retrain the model immediately due to significant drift. Reevaluate after retraining."
     d. (Optional) If the agency provides a drift metric (e.g., KS statistic) and it exceeds a pre-agreed threshold, then also stop for retraining.

  3. **Referral Rate Disparity**:
     a. Compute the overall referral rate (should be 20%).
     b. For each protected group, compute the group's referral rate (number of referred in group / total in group).
     c. For each group, compute the ratio: (group's referral rate) / (overall referral rate).
     d. If any group has a ratio less than 0.8, note: "Disparate impact found in referral for group [X]: ratio = [value]."
     e. Proceed regardless (unless the disparity is extreme and the agency's legal counsel advises immediate action).

  4. **Choose and Check Fairness Criterion for Referred Group**:
     a. The panel must choose one of the following to prioritize:
          - **Option A (Calibration)**: The scores in the referred group should be well-calibrated by group. This means that for applicants in the referred group, the score should accurately reflect the chance of being eligible (Aid Granted). 
          - **Option B (Predictive Parity)**: The positive predictive value (PPV) should be equal across groups in the referred group. PPV is the proportion of referred applicants in the group who received Aid Granted.

     b. **If Option A (Calibration) is chosen**:
          - Bin the referred applicants by score (e.g., 10 bins of equal score width).
          - For each group and each bin, compute the observed positive outcome rate (number of Aid Granted in the bin / total referred in the bin for that group).
          - For each group, check if the observed rates in the bins are close to the bin's average score (e.g., within 0.1 on average across bins, or within each bin by less than 0.15).
          - If for any group the calibration is poor (e.g., the average absolute error is > 0.1), then note: "Calibration fails for group [X]."

     c. **If Option B (Predictive Parity) is chosen**:
          - For each group, compute PPV = (number of referred in the group with Aid Granted) / (total referred in the group).
          - Compare the PPV across groups. If the ratio of the lowest PPV to the highest PPV is less than 0.8, OR if the absolute difference between any two groups is more than 10 percentage points, then note: "Predictive parity fails. Disparity found: [describe]."

  5. **Addressing Failures in the Chosen Criterion**:
     a. If the chosen criterion (from Step 4) fails for any group, decide:
          - Is the disparity large enough to be of concern? (e.g., calibration error > 0.1 on average, or PPV difference > 10 percentage points).
          - If NO: Note the disparity but proceed to Step 6.
          - If YES: Then recommend: "Retrain the model with fairness constraints targeting [chosen criterion]. Reevaluate after retraining." If retraining is not feasible, then the panel must decide between accepting the disparity or discontinuing use. Stop and hand over to the panel for this decision.

  6. **Overall Performance**:
     a. Compute the overall PPV (total Aid Granted in referred / total referred).
     b. If PPV < 50%, note: "The system's efficiency is low. Consider retraining to improve model accuracy or adjusting the referral threshold (if allowed)."
     c. Also, consider cost: if the cost of review is high and the yield (number of eligible found) is low, note it.

  7. **Headline Disparate-Impact Figure**:
     a. If Step 3 found a referral rate disparity for any group, then the headline figure is: 
          "The referral rate for [group with lowest ratio] is [group's referral rate] (overall: 20%), a ratio of [ratio]."
     b. If no referral rate disparity, but Step 4 found a disparity in the chosen criterion, then the headline figure is:
          - For Option A: "The maximum calibration error (average absolute error) by group is [max_error] in group [X]."
          - For Option B: "The largest gap in PPV between groups is [max_difference] percentage points, between groups [X] and [Y]."
     c. If no disparity found in either, then "No significant disparate impact found."

  **Final Recommendation**:
     - If the system passed all checks (or disparities were within tolerance) and overall performance is acceptable: "Approve the system for continued use."
     - If retraining is recommended: "Retrain the model as indicated and reevaluate."
     - If discontinuation is recommended: "Discontinue use until the model is retrained or replaced."

  **Limitations**:
     - The procedure cannot evaluate error rates (false positive/false negative) for the entire applicant population because outcomes are only observed for the referred group.
     - The choice between calibration and predictive parity is a value judgment and must be made by the panel.
     - The procedure does not address the fairness of outcomes for the non-referred group.

  **Example Panel Decision**:

     After running the procedure:

        Step 1: Data sufficient for all groups.
        Step 2: No significant drift.
        Step 3: Group A referral rate ratio = 0.75 (15% vs 20%) -> disparate impact.
        Step 4: Panel chose Option B (predictive parity). 
            Group A PPV = 65%, Group B PPV = 80% -> difference 15 percentage points -> fails (since >10).
        Step 5: Disparity is large enough -> recommend retraining with fairness constraints.

     Headline: "Group A has a referral rate of 15% (overall 20%), a ratio of 0.75, and among the referred, the rate of aid granted for Group A is 15 percentage points lower than for Group B."

     Final Recommendation: "Retrain the model with fairness constraints to address both referral disparity and predictive parity disparity. Reevaluate after retraining."

  **Unwelcome Example (Case 2 above)**:

     The panel may not welcome the recommendation to retrain because it is costly and time-consuming. However, the procedure has identified a significant disparate impact and a failure in the chosen fairness criterion. The panel might be tempted to tolerate the disparity, but Step 5 requires a decision: if the disparity is too large, they must retrain or discontinue.

  **What the Procedure Cannot Settle**:

     - The inherent trade-offs between fairness criteria: if the panel wants both calibration and predictive parity, they cannot have both in general.
     - The business necessity defense for a disparate impact in referral.
     - How to balance fairness with overall performance (e.g., if enforcing fairness reduces overall PPV below 50%).
     - The fairness of the system to non-referred applicants.

  We hope this procedure provides a clear and actionable framework for the panel.
answer: |-
  ### Decision Procedure for Automated System Review  
  **Purpose**: To evaluate the fairness and efficacy of the scoring system, balancing statistical constraints with agency values. Outputs a recommendation (deploy, retrain, or halt) and a disparate-impact headline.  
  **Inputs**: Agency logs (applicant scores, group membership, referral status, review outcomes) from the last retraining cycle.  
  **Output**: One-page signed recommendation.  

  ---

  #### Step 1: Data Sufficiency Check  
  **Question**: *Do all protected groups (e.g., race, gender) have ≥30 referred cases and ≥30 non-referred cases?*  
  - **Sufficient**: Proceed to Step 2.  
  - **Insufficient (for any group)**:  
    - If total referrals < 100: **Stop → "Do not deploy; collect more data."**  
    - Else: Flag groups with small samples as "unreliable." Proceed, but exclude them from group comparisons.  

  ---

  #### Step 2: Drift Assessment  
  **Question**: *Has the overall aid-grant rate in the referred pool changed by >10 percentage points since the last retraining?*  
  - **No drift (≤10-point change)**: Proceed to Step 3.  
  - **Significant drift (>10-point change)**: **Stop → "Retrain model immediately; do not use current version."**  

  ---

  #### Step 3: Referral Disparity  
  **Question**: *Is any group’s referral rate below 80% of the overall referral rate?*  
  - **Calculation**:  
    - Overall referral rate = 20% (by design).  
    - Group referral rate = (referred in group) / (total applicants in group).  
    - Disparity ratio = (group rate) / (20%).  
  - **No disparity (all ratios ≥0.8)**: Proceed to Step 4.  
  - **Disparity (any ratio <0.8)**:  
    - Note the group(s) and ratio(s).  
    - Proceed to Step 4 (disparity alone does not halt the procedure).  

  ---

  #### Step 4: Outcome Fairness (Values-Driven Choice)  
  **Panel must select one priority**:  
  - **Option A (Calibration)**: "Scores should mean the same thing for all groups."  
  - **Option B (Predictive Parity)**: "Referred applicants should have equal aid-grant rates across groups."  

  **Question (based on choice)**:  
  - **If Option A (Calibration)**:  
    - *Are scores equally predictive of aid-grant outcomes for all groups in the referred pool?*  
    - **Test**: Bin scores (e.g., 0.8–0.9, 0.9–1.0). For each bin/group, compare the average score to the actual aid-grant rate.  
      - **Fair (differences ≤5% per bin)**: Proceed to Step 5.  
      - **Unfair (any difference >5%)**: Proceed to Step 5; note groups/bin gaps.  
  - **If Option B (Predictive Parity)**:  
    - *Is the aid-grant rate among referred applicants similar across groups?*  
    - **Test**: Compare group-level aid-grant rates (PPV).  
      - **Fair (all group rates within 10 percentage points)**: Proceed to Step 5.  
      - **Unfair (any gap >10 points)**: Proceed to Step 5; note groups/gaps.  
  - **Handoff**: If the panel cannot agree on A or B, **pause → "Panel must resolve values conflict."**  

  ---

  #### Step 5: Overall Efficacy  
  **Question**: *Is the system cost-effective?*  
  - **Metrics**:  
    - Overall aid-grant rate in referred pool (PPV).  
    - Cost per successful grant = (review costs) / (aid grants).  
  - **Thresholds**:  
    - PPV < 40% or cost per grant > agency threshold → **"Retrain to improve accuracy."**  
    - Else: Proceed to Step 6.  

  ---

  #### Step 6: Disparate-Impact Headline  
  **Question**: *What single number should counsel use?*  
  - **If referral disparity (Step 3) exists**: Use **lowest group referral ratio** (e.g., "Group X’s referral rate is 60% of the average").  
  - **If no referral disparity but outcome unfairness (Step 4)**:  
    - For **Option A**: Report **largest calibration gap** (e.g., "Scores overpredict eligibility for Group Y by 12%").  
    - For **Option B**: Report **largest PPV gap** (e.g., "Group Z’s aid rate is 15 points lower").  
  - **Mathematics note**: If multiple disparities exist, state: "Headline simplifies complex trade-offs; see full report."  

  ---

  #### Step 7: Final Recommendation  
  Synthesize findings:  
  - **Deploy/Continue**: All steps pass, small disparities within tolerances.  
  - **Retrain**: Drift (Step 2), poor efficacy (Step 5), or severe unfairness (Step 4).  
  - **Halt**: Insufficient data (Step 1) or unresolved values conflict (Step 4).  

  ---

  ### Applied Examples  
  **Case 1: Welcome Outcome**  
  - **Data**: All groups >30 cases; no drift; referral rates >16% (all ratios >0.8).  
  - **Panel chooses Option B (PPV parity)**: Aid-grant rates differ by ≤8 points. PPV = 65%.  
  - **Headline**: "No significant disparities detected."  
  - **Recommendation**: "Continue use; monitor quarterly."  

  **Case 2: Unwelcome Outcome**  
  - **Data**: Group A (small group) has 10 referrals → flagged "unreliable."  
  - **Drift**: Aid-grant rate fell from 70% to 55% → **"Retrain model."**  
  - **Headline**: "System accuracy declined significantly post-deployment."  

  **Case 3: Values Conflict**  
  - **Referral disparity**: Group X ratio = 0.75 (15% rate).  
  - **Panel chooses Option A (calibration)**: Scores for Group X overpredict eligibility by 9% in high-scoring bin.  
  - **Efficacy**: PPV = 45% (below threshold).  
  - **Headline**: "Group X referred 25% less often; scores less reliable for this group."  
  - **Recommendation**: **"Retrain with fairness constraints (calibration) and efficacy targets."**  

  ---

  ### What This Procedure Cannot Settle  
  1. **Values conflicts** (e.g., calibration vs. predictive parity).  
  2. **Business necessity** of disparities (legal determination).  
  3. **Fairness for non-referred applicants** (unobserved outcomes).  
  4. **Long-term societal impact** of aid denials/grants.  

  **Final Note**: Mathematics dictates trade-offs; your panel’s role is to weigh equity vs. efficiency when facts are exhausted. Revise thresholds (e.g., 10% drift, 5% calibration gap) annually based on new data or policy goals.  

  ---  
  **Procedure Summary**: Prioritize data quality → check drift → assess referrals → choose fairness goal → verify efficacy → report headline → recommend action.
