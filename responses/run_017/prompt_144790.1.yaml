prompt: |-
  You're an expert in epistemology and the philosophy of the social sciences who also knows the forecasting literature well; before you answer, brainstorm out loud for a bit and explicitly reject at least two or three candidate concepts that don't quite make it — I want to see the carving, not just the winner.

  I'm taking a judgment-and-decision-making seminar this term (cross-listed with the policy school, mostly psych people) and a few weeks ago we did the inside view / outside view thing — the planning fallacy, look at the base rate for cases like yours instead of at the details of your own case, taking the outside view is the epistemically modest move, all that. I'm basically on board, but I keep noticing a pattern when I try to actually apply it, and I genuinely can't tell weather it's one thing with a name, three unrelated things, or nothing at all. First instance: my flatmate is writing a senior thesis; her chapter-by-chapter plan says six weeks, the realized base rate for theses like hers is more like nine, so she should defer to nine. But the base rate is a base rate *of plans being missed*, generated by people who built those plans bottom-up from the inside view. If everyone in her department took the outside view, everyone would write "nine weeks" on their timelines, and now almost nobody would be late — even if the actual writing took exactly as long as it always did. The correction looks like it fixed something, but part of what it fixed is the yardstick. Second instance: the base rate for first-year PhD students (or first-time founders) with an ambitious, slightly wild idea is brutal, so take the outside view and don't do it — except the handful of successes inside that brutal number were produced by people who conspicuously did *not* take the outside view, so the statistic I'm being humble in the face of was generated by a population selected for immodesty, and if we all became modest it would get even worse, which would then make modesty look even more clearly correct. Third, possibly separate: whenever I decide whether to apply the outside view at all, I end up using my inside-view sense of whether my case is special ("sure, most group projects go badly, but this one really is different") — which is exactly the move the outside view was supposed to cancel, just relocated one level down into the choice of reference class.

  So: does this have a name, and is it one phenomenon or several? It's not plain self-fulfilling prophecy, I think, because nobody's forecast is making the forecasted event happen — what shifts is the behaviour that produced the statistics the forecast was drawn from. And it isn't the boring point about correlations breaking down once a policy acts on them: there's no policy here and nobody is gaming a metric, it's individuals quietly revising their own confidence. If a few nearby concepts each capture part of it, tell me which covers which part and where each one breaks down; if there's really nothing established, coin a term, define it tightly, and give me a clear positive case plus a near miss that falls outside it. (Someone in my ethics tutorial muttered something about "self-effacing" norms when I described this, but I don't know if that's a real term of art or they were improvising, and either way they meant it about morality rather than forecasting — so say whether it carries over.) Please don't just hand me a list of names and papers to chase: I have no library access from where I'm writing this, so anything you lean on has to be explained in your own words. Last thing, and it's the bit I actually care about: if the pattern is real, is taking the outside view still the epistemically modest thing to do, or is it the kind of rule that only works when a minority follows it — does universal adoption of outside-view reasoning undermine the very base rates it depends on, and should I therefore be applying it selectively, and if so how would I decide when?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're in a judgment-and-decision-making seminar and grappling with the inside/outside view framework. They've noticed a pattern where applying the outside view seems to undermine the base rates it relies on. The user describes three instances: thesis planning, PhD/founder ambitions, and the meta-problem of choosing reference classes. 

  First, I need to brainstorm candidate concepts that might explain this. The user already mentioned it's not self-fulfilling prophecy or Goodhart's law. Let me think of other possibilities. 

  One candidate is the observer effect or reflexivity in social systems. Like in economics, where observing a trend can change behavior. But the user's case is about base rates shifting due to widespread adoption of the outside view, not just observation. So reflexivity might be close, but it focuses on perception altering reality, whereas here it's about behavioral change affecting the data source. Maybe not perfect.

  Another idea is the Collingridge dilemma in tech policy—where controlling a technology becomes hard once it's widespread. But that's about control, not epistemology. Not quite. 

  What about endogenous change? Like when a metric becomes a target, it loses value. But the user said it's not Goodhart's. Hmm. The base rates here are generated by people who used the inside view. If everyone switches to outside view, the base rates change. So the dependency is more about the source data being contingent on current practices. 

  Then there's the issue of reference class selection. The user points out that choosing when to apply the outside view requires an inside-view judgment. That's a meta-problem. Kahneman and Tversky's reference class forecasting might have this flaw. 

  Also, the success stories in the PhD/founder example come from those who ignored base rates. So if everyone becomes modest, those successes might not happen. That sounds like a selection effect. The base rate includes a mix of those who did and didn't take the outside view. If the latter group disappears, the statistic changes. 

  The user mentioned "self-effacing norms" from ethics. In ethics, a norm is self-effacing if following it requires not believing in it. For example, act utilitarians might need to follow rules they don't believe in. Could this apply? If everyone takes the outside view, base rates become less accurate because they were built on inside-view behavior. So the norm undermines itself when universalized. That's a strong candidate. 

  But is this one phenomenon or multiple? The thesis planning and PhD examples both show base rates shifting due to behavioral changes from adopting the outside view. The reference class problem is separate but related—it's about the difficulty of applying the method consistently. 

  So the core issue is the self-undermining of the outside view when universally applied. The user wants to know if it's still epistemically modest to use it and how to decide when. 

  Epistemic modesty involves recognizing limits. But if universal adoption breaks the base rates, then selectively using the outside view might be necessary. However, deciding when requires judgment. Maybe the answer is to use the outside view as a check but remain aware of its limitations. Also, combining both views—using base rates but adjusting for specifics when there's evidence. 

  The user needs practical advice. They should consider the stability of the environment. If the domain is stable, base rates are reliable. But if their actions could change the system, like in innovation, then inside view might be justified. Also, transparency in reference class selection and Bayesian updating could help.
answer: |-
  Here's a systematic breakdown of your observed pattern, carving through candidate concepts to identify the core phenomenon(s). I'll explicitly reject misfits, define the key concept(s), and address your practical concerns about epistemic modesty.

  ---

  ### Brainstorming & Rejected Candidates
  1. **Self-Fulfilling Prophecy (Rejected)**  
     *Why it seems plausible*: Universal adoption of the outside view changes outcomes (e.g., fewer missed thesis deadlines).  
     *Why it fails*: The base rate shift isn't caused by *believing* the forecast (e.g., students don’t finish in 9 weeks *because* they forecast 9 weeks). It’s caused by removing the source of the original data (inside-view planning). No prophecy is "fulfilled"; the *measurement context* changes.  

  2. **Goodhart’s Law ("When a measure becomes a target, it ceases to be a good measure") (Rejected)**  
     *Why it seems plausible*: Base rates become unreliable when used as targets.  
     *Why it fails*: Goodhart applies to explicit metric manipulation (e.g., gaming KPIs). Here, individuals aren’t "gaming" base rates; they’re sincerely updating beliefs. The distortion arises from collective behavioral change, not strategic cheating.  

  3. **Selection Bias (Partially Relevant but Incomplete)**  
     *Why it seems plausible*: Successful founders/philosophers are selected from those who ignored base rates.  
     *Why it’s insufficient*: It explains the *asymmetry* in your second example but not the systemic shift in base rates (e.g., the thesis timeline case). This is broader than selection—it’s about *feedback loops* between cognition and data generation.  

  ---

  ### The Core Phenomenon: **Endogenous Base Rate Collapse**  
  **Definition**: The process by which widespread adoption of an epistemic norm (like taking the outside view) alters the behavior that generated the historical data, rendering the original base rates obsolete or misleading.  

  #### How It Explains Your Examples:
  - **Thesis Timelines**:  
    Historical base rates of "9 weeks" were generated by planners using the *inside view*. If all switch to the outside view, they plan for 9 weeks → fewer miss deadlines → new base rate shifts toward 9 weeks → the original "9 weeks = cautionary signal" loses meaning.  
    - *What breaks*: The base rate’s validity as a benchmark against flawed planning.  

  - **Wild Ideas (Founders/PhD Students)**:  
    The "brutal" base rate of failure includes only *two subpopulations*:  
    - (A) Those who ignored base rates and succeeded (rare).  
    - (B) Those who ignored base rates and failed (common).  
    If everyone defers to the base rate, group (A) vanishes → the success rate drops to near-zero → the outside view appears *even more* justified.  
    - *Key insight*: The base rate isn’t a "law of nature"; it’s a snapshot of a system where some agents ignore it.  

  - **Reference Class Selection**:  
    Choosing when to apply the outside view *requires* an inside-view judgment ("Is my case special?"). This isn’t endogenous collapse—it’s a **meta-problem of bootstrapping**:  
    - The outside view can’t self-validate; it depends on prior (inside-view) choices about reference classes.  
    - *Distinct but related*: Endogenous collapse makes this problem worse by destabilizing reference classes.  

  ---

  ### Is "Self-Effacing" the Right Term?  
  - **Ethics Carryover**: In moral philosophy, a norm is "self-effacing" if it demands we not believe in it (e.g., "Act utilitarians should follow rules they don’t believe in").  
  - **Application Here**: The outside-view norm *becomes* self-effacing if universal adoption destroys its evidential basis. To function, it requires *some* people to ignore it (supplying data on "special cases").  
  - **Verdict**: It’s analogous but not identical. Call it **epistemically self-undermining** for precision.  

  ---

  ### Should You Still Take the Outside View?  
  **Yes—but with critical constraints**:  

  1. **Never Treat Base Rates as Mechanical**:  
     - Ask: *"What behaviors generated this base rate? Would they change if everyone thought like me?"*  
     - Example: For your flatmate’s thesis, use the base rate to adjust her plan (e.g., "Buffer +50% time"), but recognize that the "9 weeks" assumes past planning failures.  

  2. **Preserve Asymmetry in High-Stakes Domains**:  
     - In innovation (wild ideas, startups), the outside view should inform risk mitigation (e.g., "Test assumptions cheaply before quitting your job"), not veto action. Why?  
       - The *option value* of rare successes justifies ignoring base rates *if* you have signals of being an outlier (e.g., unique skills, novel insights).  
       - Caveat: This invites overconfidence—demand falsifiable evidence for "specialness."  

  3. **Use Bayesian Hybrid Approaches**:  
     - Start with the base rate (prior).  
     - *Then* ask: "What *specific evidence* suggests I’m an exception?" (likelihood).  
     - Demand strong proof to override the prior (e.g., "My group project has no free-riders" isn’t proof; "We’ve delivered 3 similar projects on time" might be).  

  4. **Track System-Level Effects**:  
     - If you’re in a position to influence many (e.g., setting policy), recognize that promoting universal outside-view adoption may collapse base rates. Solution:  
       - Encourage calibration, not blind deference (e.g., "Anchor on base rates, then adjust — and document why").  
       - Diversify decision-makers: Some *should* ignore base rates to generate new data.  

  ---

  ### Bottom Line
  - **One Core Phenomenon**: Endogenous base rate collapse explains the thesis and founder cases.  
  - **One Meta-Problem**: Reference class selection is unavoidably inside-view-dependent.  
  - **Epistemic Modesty Preserved?** Yes, if you:  
    - Treat base rates as dynamic social artifacts, not Platonic truths.  
    - Use the outside view to *challenge* inside-view certainty, not replace it.  
    - Accept that some domains (innovation) require strategic immodesty.  

  **Universal adoption would undermine the norm—but selective, reflective use remains the best guard against delusion.** The truly modest thinker knows that no heuristic works always.
