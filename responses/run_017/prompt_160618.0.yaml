prompt: |-
  Right, quick one. I've got a fifty-minute slot next week with about twenty first-years — mostly CS, a few psychology — and I want to spend it making them *feel* what it means to induce a concept from a handful of examples. Bongard problems are the vehicle: six figures on the left, six on the right, some rule separates them.

  Don't solve any for me and don't write the explanation I should give. Give me the plan for the explanation.

  Some vocabulary first so we're not talking past each other — these are my words, rename them if mine are bad. A rule *fits* a problem if it's true of everything in the left panel and false of everything in the right. The *intended* rule is the one the setter had in mind, which needn't be the only one that fits. A *list rule* fits by just naming the left-hand figures ("it's one of these six") — it works by construction and generalises to nothing. And call a problem *brittle* if deleting any single figure from either panel lets a rule strictly simpler than the intended one fit.

  What I want back:

  1. The order the pieces have to go in, and what depends on what. My hunch is that "there's no unique answer" lands completely differently depending on whether they've already tried and failed to find one, but tell me if I've got that backwards.
  2. The one problem to build the whole session around, and what it has to have and not have. I'm thinking something geometric where the intended rule is about how the shapes relate to *each other* rather than a property each shape has on its own, and where a list rule is obviously on offer — but say if that's one example doing too much work.
  3. The misconceptions, in the order they'll actually turn up, and exactly where in the sequence to head each off. Ones I'm expecting: that the task is to find the rule; that "simplest rule wins" is obvious rather than a choice of description language; that more examples would sort it out; that fitting and generalising are the same thing. Add the ones I've missed, and definately tell me if one of mine isn't worth the time.
  4. One thing I should flatly refuse to go into at this level, and say out loud that I'm refusing it. My instinct is to dodge formal learning theory entirely — VC dimension and that sort of thing — but maybe the honest move is one sentence of hand-waving instead of silence.
  5. The question I ask in the last five minutes that tells me whether the idea landed rather than whether they enjoyed themselves.

  And last: flag the bit of the plan you're least confident about, and say what would change your mind — what argument, or what actually happening in the room, would make you reorder it or swap the example out.
reasoning: |-
  We are designing a fifty-minute session for first-year students (mostly CS, some psychology) to induce the concept of concept induction from examples using Bongard problems. The goal is for them to "feel" the process, not just understand it intellectually.

  Key vocabulary (as defined by the user):
  - A rule "fits" if it holds for all left-panel figures and not for any right-panel ones.
  - The "intended" rule is the one the problem setter had in mind, which may not be the only fitting rule.
  - A "list rule" is one that simply enumerates the left-hand figures (thus fitting by construction but generalizing poorly).
  - A problem is "brittle" if removing any single figure allows a simpler rule (than the intended one) to fit.

  We need to address:

  1. The order of the session pieces and dependencies.
  2. The choice of one central Bongard problem to build the session around.
  3. The misconceptions, in the order they'll appear, and when to address them.
  4. One topic to explicitly avoid.
  5. A final question to assess if the idea landed.

  Additionally, we need to flag the least confident part and what would change our mind.

  ---

  **Overall Session Structure (50 minutes):**

  1. **Introduction (5 min):** 
     - Set the stage: We're going to look at a puzzle that requires finding a rule that separates two sets of figures (Bongard problem).
     - Explain the setup: 6 figures on the left, 6 on the right, and we want a rule that is true for all left and false for all right.
     - State the goal: Not just to find a rule, but to experience the process of induction and the challenges that come with it.

  2. **First Activity: Attempt to Solve (10 min):**
     - Present a simple Bongard problem (not the central one) that has a clear intended rule and is not too hard. This problem should have multiple fitting rules but a clear "simplest" one (to build confidence and introduce the idea of multiple rules without overwhelming them).
     - Have students work in pairs to come up with rules. Ask a few to share.

  3. **Introduce the Central Problem (5 min):**
     - Present the central Bongard problem (chosen carefully, see below). Tell them that this one is trickier and we'll spend more time on it.

  4. **Group Work on Central Problem (15 min):**
     - In small groups (3-4 students), have them try to come up with rules for the central problem. They should write down at least one rule that fits.

  5. **Discussion and Introduction of Challenges (15 min):**
     - Groups share their rules. Write them on the board.
     - Highlight that multiple rules fit. Then reveal the intended rule (if it hasn't been found) and discuss why it might be the intended one (e.g., simplicity, elegance).
     - Introduce the concept of a "list rule" and why it's unsatisfying (doesn't generalize). Show that the problem might be brittle (if applicable) by asking what happens if we remove one figure.
     - Address misconceptions as they arise (see below).

  6. **Wrap-up and Reflection (5 min):**
     - Summarize the key points: 
       - Induction is underdetermined (multiple rules can fit the data).
       - We prefer rules that are simpler and generalize (but that's a bias we bring).
       - More data helps but doesn't completely solve the problem.
     - Ask the final assessment question.

  ---

  **1. Order and Dependencies:**

  The key dependencies are:
  - Start with a simple problem to build confidence and introduce the activity without the complications. This makes the central problem more impactful because they will have experienced success and then face a problem that resists a simple solution.
  - The central problem must come after the simple one to set up the main challenge.
  - The group work must come after introducing the central problem so they have time to engage deeply.
  - The discussion of multiple rules and misconceptions must follow the group work because it builds on their shared experience of generating rules and encountering difficulties.

  Your hunch is correct: The realization that "there's no unique answer" is more powerful after they have struggled to find one and found multiple possibilities. The simple problem should have a clear intended rule (so they feel success) and the central problem should be one where multiple rules are evident.

  ---

  **2. The Central Problem:**

  We need a Bongard problem that:
  - Is geometric (as requested).
  - Has an intended rule that is about the *relationship* between elements in each figure (not a property of each individual shape). For example, a rule about the relative positions, sizes, or connections between shapes.
  - Allows for a list rule (which is trivial and unsatisfying).
  - Is brittle (if possible) to illustrate the sensitivity to examples.
  - Has multiple non-trivial fitting rules that are simpler than the intended one (to provoke the issue of underdetermination).

  Example (without solving it for you): 
  - Consider a problem where the left panel has figures with two shapes: one shape is always inside the other. The right panel has figures where the two shapes are adjacent (or one is outside the other). But note: this might not be brittle and might have a simple rule.

  To ensure the problem is brittle: 
  - We need that if we remove any figure, a simpler rule (like a rule about the number of shapes, or the type of one shape) becomes available.

  Alternatively, a problem that fits the bill (known in the Bongard problem literature) is one where the left panel has figures with two circles and a line connecting them, and the right panel has two circles without a line. But this is a property of each figure (each has a line or not). We need a relational rule.

  Better example (relational):
  - Left panel: each figure contains two shapes, and one shape is to the left of the other.
  - Right panel: each figure contains two shapes, and one is above the other.

  But note: this might not be brittle. Removing a figure might not break the rule because the rule is still about the arrangement.

  We need a problem that is more complex. How about:

  - Left panel: each figure has three shapes arranged in a triangle (with specific relations, e.g., each shape is connected by a line to form a triangle).
  - Right panel: each figure has three shapes arranged in a line (connected by lines).

  But again, brittleness? Removing one might leave a figure that breaks the pattern? Not necessarily.

  Alternatively, a problem where the intended rule is about the entire configuration and the absence of one figure allows a rule based on a single feature (e.g., the presence of a particular shape) to fit.

  We can design one or use an existing brittle one. However, without going into a specific solution, we can describe the requirements.

  What it must have and not have:
  - Must have: multiple non-trivial rules that fit (so they come up with different ones), a list rule (obvious and unsatisfying), and brittleness (to illustrate the sensitivity).
  - Must not have: an overly complex intended rule that takes too long to explain, or one that requires domain knowledge beyond basic geometry.

  Since the session is short, the central problem should be challenging but not impossible. The key is that the intended rule is relational and not immediately obvious, and that there are simpler (but incorrect) rules that fit until they see the pattern.

  ---

  **3. Misconceptions and When to Address Them:**

  List of misconceptions (in the order they are likely to appear):

  a) **Misconception 1: "The task is to find the rule."**  
     - *When it turns up:* During the first activity (simple problem) and at the start of the central problem.  
     - *How to address:* At the beginning, clarify that the goal is to experience the process, and that there might be multiple rules that fit. After the simple problem, point out that even though we found one, there might be others we didn't consider. During the central problem, when multiple rules are shared, highlight that they all fit.

  b) **Misconception 2: "The simplest rule is obviously the intended one."**  
     - *When it turns up:* When sharing rules for the central problem, they might argue that one rule is simpler and therefore must be the intended one.  
     - *How to address:* During the discussion of the central problem, ask: "Why do we prefer simpler rules? Is it because they are more likely to be true, or because they are easier to use?" Point out that simplicity is a preference (a bias) we bring to the problem to avoid overfitting, but it's not a guarantee.

  c) **Misconception 3: "More examples would solve the problem."**  
     - *When it turns up:* When discussing why the intended rule is better or when considering brittleness.  
     - *How to address:* When you remove a figure (to show brittleness) and a simpler rule emerges, ask: "If we had more examples, would that always fix the problem?" Then explain that more data helps, but without a bias (like simplicity), we can't rule out all possible rules. Also, note that in real life, we often have limited data.

  d) **Misconception 4: "Fitting the data and generalizing are the same thing."**  
     - *When it turns up:* When they see that a list rule fits perfectly but doesn't generalize.  
     - *How to address:* During the central problem discussion, when someone (or you) brings up the list rule, ask: "What would happen if we added a new figure? Would this rule work?" Then contrast with the intended rule (which, if it captures a general principle, would work on new examples). Emphasize that fitting is necessary but not sufficient for generalization.

  e) **Additional misconceptions you might have missed:**
     - **Misconception 5: "The intended rule is the only correct one."**  
       - *When it turns up:* When you reveal the intended rule.  
       - *How to address:* Explicitly state that the intended rule is what the designer had in mind, but other rules also fit the given examples. The problem is underdetermined.

     - **Misconception 6: "If a rule fits, it must be correct."**  
       - *When it turns up:* When they propose a rule that fits but is not the intended one.  
       - *How to address:* During the sharing of rules, note that many rules fit, but they might not capture the underlying concept and might fail on new examples (if we had them). This is where the brittleness demo can help.

  Order of addressing:
  1. Misconception 1: at the beginning and after the first activity.
  2. Misconception 6: during the central problem group work and sharing.
  3. Misconception 2: during the central problem sharing when comparing rules.
  4. Misconception 4: when introducing the list rule in the central problem.
  5. Misconception 3: when demonstrating brittleness (if applicable) or when discussing generalization.
  6. Misconception 5: when revealing the intended rule.

  ---

  **4. What to Refuse to Go Into:**

  Your instinct is correct: avoid formal learning theory (VC dimension, PAC learning, etc.). 

  - *What to say:* "Now, there's a whole field of study called computational learning theory that gives formal guarantees about when learning is possible, but that's beyond our scope today. We're focusing on the intuitive challenges of induction."

  This is a hand-wave, but it acknowledges the existence without derailing the session.

  ---

  **5. Final Assessment Question:**

  We want to know if the idea landed, not just if they enjoyed it. So, we ask a question that requires them to reflect on the process and the challenges.

  - *Question:* "If you were given a new Bongard problem to solve, what would you now expect to be the hardest part, and why?"

  This reveals whether they grasped the underdetermination (multiple rules) and the challenge of generalization. If they say things like "choosing between multiple rules that fit" or "being sure that my rule will work on new examples", then the idea landed.

  ---

  **Flagging the Least Confident Part:**

  - **Least confident part:** The choice of the central problem and the demonstration of brittleness. 
    - *Why:* It's tricky to find a Bongard problem that is relational, has multiple non-trivial rules, is brittle, and can be understood quickly by first-years. Also, brittleness might not be obvious without careful construction.
    - *What would change my mind:* 
      - If we can find a known Bongard problem that fits these criteria and has been used successfully in similar educational settings, I'd be more confident.
      - Alternatively, if during the session, after the simple problem, the students are engaged and thinking deeply, then even if the central problem isn't perfectly brittle, the main points (multiple rules, generalization) can still be made with a different example. We might skip brittleness and focus on the list rule and generalization.

  Alternative: If brittleness is too hard to illustrate, drop it and focus on the list rule and the possibility of multiple non-trivial rules. The key is to have a problem where a simple rule (like counting the number of objects) fits until they see the pattern, and then the intended rule is more complex. Removing a figure might not be necessary if we can show that a rule based on a single feature fits until you see the counterexample in the full set.

  ---

  **Final Plan Summary:**

  - **0-5 min:** Introduction and simple Bongard problem.
  - **5-15 min:** First activity (solve the simple problem) and brief discussion.
  - **15-20 min:** Introduce the central problem.
  - **20-35 min:** Group work on central problem.
  - **35-50 min:** Discussion: share rules, address misconceptions, show intended rule, discuss list rule and generalization, and avoid learning theory.
    - At 45 min: ask the final question.
  - **50 min:** End.

  This plan fits the fifty-minute slot and addresses the key goals.
answer: |-
  Here's a structured plan for your fifty-minute session, designed to make students *feel* the underdetermination and subjectivity of induction using Bongard problems. The goal is to create cognitive dissonance through guided discovery, not direct instruction.

  ### 1. **Order of Pieces and Dependencies**  
  *(Total: 50 min)*  
     - **0–5 min: Hook + Simple Example (Dependency: None)**  
       Show a trivial Bongard problem (e.g., "all left shapes are triangles, all right are squares"). Students shout out rules. Confirm a rule "fits." **Purpose:** Establish vocabulary (fit, left/right panels) and create false confidence.  
     - **5–20 min: Central Problem Attempt (Dependency: Hook)**  
       Introduce your chosen central Bongard problem (see #2). Students work in pairs to find a rule. **Crucial dependency:** They *must* struggle here. If they solve it too fast, the later realization of non-uniqueness feels academic, not visceral.  
     - **20–30 min: Share Rules + Highlight Underdetermination (Dependency: Attempt)**  
       Groups share rules. Write all fitting rules on the board. Explicitly state: "All these fit. There’s no unique answer." **Dependency insight:** You’re right—this lands hardest *after* they’ve invested effort. If done before the attempt, it feels like a spoiler.  
     - **30–40 min: Introduce List Rules + Brittleness Demo (Dependency: Underdetermination)**  
       Show how a "list rule" fits trivially. Then, break brittleness: Remove one figure from the central problem and show how a simpler rule now fits. **Purpose:** Forces them to see that examples alone don’t dictate rules.  
     - **40–45 min: Generalization Contrast (Dependency: List Rules)**  
       Ask: "Which rules would work on a *new* figure? Why might we prefer one over another?" Contrast list rules vs. intended rule.  
     - **45–50 min: Reflection + Final Question (Dependency: All prior)**  
       Pose your assessment question (see #5).  

  ### 2. **The Central Problem**  
  Choose a geometric Bongard problem where:  
     - **Intended rule is relational** (e.g., "shapes are connected by a line" → left; "shapes are separate" → right). Avoid self-contained properties (e.g., "shapes are blue").  
     - **List rule is glaringly obvious** (students should spontaneously say, "Just say these six are 'left'!").  
     - **Brittle** (e.g., remove one "connected" figure → a simpler rule like "all left have circles" fits).  
     - **No dominant simple feature** (e.g., avoid problems where 5/6 left figures share a color; it invites premature closure).  

  *Why this isn’t too much work?* Relational rules force students to *compare* examples, not just label them, making underdetermination more palpable. Brittleness and list rules then become natural extensions.  

  ### 3. **Misconceptions and Intervention Sequence**  
  Address these *as they emerge*, in this order:  
     1. **Misconception: "The task is to find *the* rule."**  
        - **When/Where:** During pair work (5–20 min). Students will insist they’ve "solved" it.  
        - **Head off:** When introducing the central problem, say: "Your goal isn’t to find the setter’s rule—it’s to find *any* rule that fits."  
     2. **Misconception: "Fitting = generalizing."**  
        - **When/Where:** When sharing rules (20–30 min). Students won’t question if their rule works beyond the panel.  
        - **Head off:** During rule-sharing, ask: "Would your rule work if I added a *new* figure? How do you know?"  
     3. **Misconception: "More examples would fix this."**  
        - **When/Where:** During brittleness demo (30–40 min). Students will say, "Just add more examples!"  
        - **Head off:** After removing a figure, ask: "What if I added 100 examples? Could I *still* invent multiple fitting rules?" (Point: Data doesn’t eliminate subjectivity; it just constrains it.)  
     4. **Misconception: "Simplicity is objective."**  
        - **When/Where:** During generalization discussion (40–45 min). Students will argue the "simplest" rule is best.  
        - **Head off:** Ask: "Simple in what *language*? What if I define a language where the list rule is 'simple'?"  

  *Misconception to skip:* "Formal logic can resolve this." Not worth time—it derails into symbolism. Your listed ones are all critical.  

  ### 4. **What to Refuse**  
  **Refuse formal learning theory** (VC dimension, PAC learning). Say aloud: "We’re avoiding learning theory today—not because it’s unimportant, but because right now I want you to *feel* the ambiguity, not quantify it."  
  - *Why silence isn’t better:* A one-sentence refusal acknowledges the elephant in the room without derailing the session.  

  ### 5. **Final Assessment Question**  
  **"If you had to explain induction to a friend using one insight from today, what would you emphasize?"**  
  - *Why it works:* It tests internalization, not enjoyment. Strong answers will reference underdetermination ("multiple rules fit"), subjectivity ("simplicity depends on how you look"), or data limits ("examples don’t dictate rules"). Weak answers will fixate on solving tactics ("look for patterns").  

  ---

  ### Least Confident Part: **Brittleness Demo**  
  - **Why:** Demonstrating brittleness requires careful timing. If students don’t grasp the pre-removal rules deeply, the "simpler rule" post-removal feels contrived.  
  - **What would change my mind:**  
    - *Argument:* If you pre-test the central problem and >70% of students propose a rule that breaks on removal, it’s worth keeping. If not, swap brittleness for a side-by-side contrast: Show two Bongard problems—one brittle, one robust—and ask why one feels "easier."  
    - *In-room signal:* During rule-sharing (20–30 min), if students propose brittle-vulnerable rules organically (e.g., "all left have circles?" when one circle is removable), proceed. If not, skip to generalization.  

  ---

  **Session Flow Visual:**  
  ```
  Hook (5m) → Struggle w/ Central Problem (15m) → Underdetermination (10m) → List/Brittleness (10m) → Generalization (5m) → Reflection (5m)
  ```  
  This maximizes cognitive friction early, making the conceptual payoff visceral. The central problem is the engine—choose it wisely (classic Bongard #47 is a relational/brittle candidate).
