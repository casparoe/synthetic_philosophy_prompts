prompt: |-
  I teach ethics, which is apparently why my colleagues elected me to the at-large faculty seat on the university's Food Systems Advisory Board — and which is now why I'm the one writing the memo for our meeting on the 14th. Can you draft it?

  The case: Dining Services wants to take beef off the line in the two main dining halls and put chicken where the beef was. Their pitch is climate. Beef runs several times chicken's emissions per gram of protein (they say six; the number moves depending on whose lifecycle analysis you like), and the campus climate commitment has dining down for a 30% cut by 2030, so this is the biggest lever they've got.

  Our problem is the 2016 Animal Welfare Procurement Statement, which the Board is supposed to enforce and which says dining will prefer suppliers whose practices minimize harm to sentient animals. Nobody wrote it with this case in mind, so the memo has to say what it actually means here.

  Three positions on the board, and I definately don't think any of us has sorted out which one wins:

  One of the undergraduate members, who worked a summer for a poultry integrator, says the swap is a disaster. Her spreadsheet has roughly one steer per million calories of beef against something like three hundred birds per million calories of chicken, and her point is that whatever welfare certification we bolt on is rounding error next to three hundred deaths.

  I pointed out that the crop-cultivation argument actually cuts against beef, since grain-fed beef takes several times more cropland per calorie — and then realized that doesn't apply to us, because the beef we actually buy comes from a regional grass-fed operation: almost no grain, but a lot more land per calorie.

  Which set off our staff ecologist, and now I can't beleive I'm the one who has to referee it. If we drop the rancher's contract, it renews in March, that pasture probably goes to corn and soy or to a subdivision, and either way the number that matters isn't animals killed but wild animals whose lives we cause to exist. She wants to know whether bringing a field mouse into existence counts as a harm under the 2016 language, because if it does the whole accounting flips, and if it doesn't we owe her a reason why mice are different from chickens. Half the board thinks that once you start counting rodents you never stop, and wants us to just count vertebrate deaths per 1,000 kcal and get on with it.

  I don't want a memo that says both sides have merit and it depends on your values. I need a bottom line: approve, reject, or approve with conditions. Dining has been quoted about 18% over current prices for slower-growing birds raised with more space, and the Director can absorb that for one year but not two. Whoever reads this should be able to tell from it what to order from whom and by when. And give the losing side its best day in court — the strongest version of the argument you're rejecting, stated so the person making it would recognize it.

  Format: exactly five numbered points, one or two sentences each, no intro and no sign-off. Roughly: (1) the recommendation, (2) how you're reading minimize harm to sentient animals — which animals count, and per plate, per 1,000 kcal, or per gram of protein, (3) the conditions, (4) the dates, (5) the strongest thing on the side you're not taking. I'm pasting these straight into the agenda packet.
reasoning: |-
  Okay, the user is an ethics professor drafting a memo for the university's Food Systems Advisory Board. They need to resolve whether to replace beef with chicken in dining halls based on climate goals versus animal welfare commitments. The memo must be concise: five numbered points with specific recommendations.

  First, I need to consider the core conflict: the climate commitment requiring a 30% emissions cut by 2030 versus the 2016 Animal Welfare Procurement Statement about minimizing harm to sentient animals. The user wants a clear bottom line, not a vague compromise. 

  Looking at the three board positions: The undergrad argues chicken causes more animal deaths (300 birds vs. 1 steer per million calories). The ecology angle complicates things—converting pasture to crops could affect wild animals. The user rejects counting rodents and wants vertebrate deaths per 1,000 kcal as the metric. 

  The user also mentioned practical constraints: Dining Services can absorb an 18% price increase for higher-welfare chicken for one year only. The contract renewal deadline is March. 

  For point 1 (recommendation), approving the switch makes sense because climate impact is urgent and measurable, while animal welfare improvements can be mandated. Point 2 should define "minimize harm" as reducing vertebrate deaths per 1,000 kcal, excluding wild animals—this aligns with the board's practical concerns. 

  Point 3 would impose conditions: requiring slower-growing chickens with more space, certified by a third party. Point 4 sets deadlines tied to the March contract renewal. Point 5 must give the losing side (ecology view) its strongest argument: that land-use changes could harm wild animals, even if we exclude them from the policy. 

  The user emphasized clarity and actionability—so specifying suppliers and dates is crucial. They also want the rejected argument presented fairly, hence the detailed ecological counterpoint in point 5. 

  Hmm, the ethics professor role makes this tricky—they’d need to justify *why* the policy excludes wild animals (pragmatism? sentience thresholds?). But the memo format forces brevity, so I’ll imply it via the vertebrate-death metric. 

  Final check: Does this satisfy all constraints? Five points, no fluff, decisive recommendation with enforceable conditions, and respectful nod to the opposition. Yes. The "approve with conditions" structure balances ethics and realism—exactly what the user requested.
answer: |-
  Here is the memo draft per your specifications:

  1.  **Approve the chicken substitution proposal, contingent upon meeting the animal welfare conditions below.** This leverages the significant emissions reduction while addressing core welfare concerns.
  2.  **"Minimize harm to sentient animals" requires reducing total vertebrate deaths per 1,000 kcal consumed, prioritizing direct impacts on farmed animals under our procurement.** Wild animals affected by land-use change fall outside this specific policy's scope.
  3.  **Dining Services must source chicken exclusively from suppliers certified for higher welfare standards (e.g., Global Animal Partnership Step 3+/RSPCA Assured, requiring slower growth, more space, enrichment).** This mitigates the increased number of birds affected.
  4.  **Implement the change by March 1st, aligning with the beef contract expiration.** Higher welfare chicken pricing is approved for one fiscal year (July 1 - June 30), requiring Dining to identify cost-neutral strategies for subsequent years.
  5.  **The strongest counterargument: Neglecting land-use conversion ignores profound harm; converting low-intensity pasture (supporting diverse wild lives) to cropland or development causes vastly more sentient animal death and suffering per hectare than cattle grazing, fundamentally undermining the swap's claimed ethical benefit.**

  **Rationale for Structure & Content:**

  *   **Point 1: Clear Recommendation:** Provides a decisive "approve with conditions" as requested, directly addressing Dining's proposal.
  *   **Point 2: Policy Interpretation:** Resolves the core ambiguity by:
      *   Specifying *which animals* count (sentient vertebrates, specifically farmed animals procured).
      *   Specifying the *metric* (total vertebrate deaths per 1,000 kcal - as per the undergrad's valid point).
      *   Explicitly *excluding* the wild animal/land-use conversion argument from the *direct scope* of *this specific procurement policy*, avoiding the rodent-counting quagmire while acknowledging its existence.
  *   **Point 3: Concrete Conditions:** Directly addresses the welfare degradation risk of simply swapping beef for conventional chicken by mandating certified higher welfare standards, using the premium Dining has quoted for.
  *   **Point 4: Actionable Dates:** Ties the change to the critical contract date (March 1st) and limits the cost premium acceptance to one year, forcing a plan for sustainability.
  *   **Point 5: Best Day in Court for Losing Side:** Presents the ecologist's argument powerfully and accurately, highlighting the potential for greater overall harm through land conversion and questioning the ethical foundation of the swap if this harm is ignored. It frames it as undermining the *claimed benefit*, which is a strong ethical challenge.
