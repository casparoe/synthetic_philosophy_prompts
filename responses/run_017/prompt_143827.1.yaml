  ## OFFICIAL GUIDANCE: REGISTRATION AND MAINTENANCE OF BEING (CHATTELS & LAND)
  **Issued by:** The Central Registry of Perceived Entities (CRoPE), Department of Ontological Security  
  **Reference:** CRoPE/L&B/Reg-9.S18/Rev.7  
  **Date:** 23rd Vendémiaire, Year 127 R.P.  

  **1. Purpose:** This leaflet outlines procedures for registering a chattel (movable item) or parcel of land as "In Being" within the Republic, and for correcting errors in the Perceptual Record. Failure to maintain correct Registration may result in the object ceasing to be perceivable (De-Animation), with consequent loss of title, use, and potential liability under the Non-Persistence Statutes.

  **2. Initial Registration (Form CRoPE-1A):**  
      a.   To establish an object as "In Being," submit Form CRoPE-1A ("Declaration of Perceived Entity") in triplicate.  
      b.   **Section 3: Perceptual Affirmation:** The Declarant MUST attest to the *current, active perception* of the object at the moment of signing. Signing constitutes this attestation. *Objects perceived solely in memory or anticipation are insufficient for Registration.*  
      c.   Include the prescribed Fee (Schedule O-7: Base Perceptual Endorsement Fee + volumetric/areal surcharge).  
      d.   Present the object (or, for land, the Declarant at the site) for Registry Agent verification *during submission*. Agent perception validates initial Registration.

  **3. Maintaining Being:**  
      a.   Registered status depends on continuous perception. Gaps risk De-Animation.  
      b.   **Private Diligence:** Owners/occupiers are responsible for ensuring perception during waking hours via routine observation. Keep dated Perception Logs (Form CRoPE-5A recommended).  
      c.   **Divine Oversight:** During periods of universal human non-perception (e.g., deep night), Being is sustained by the Necessary Perceiver. *This function operates automatically; no citizen action is required.*  
      d.   **Registry Vigilance:** CRoPE Agents maintain designated Perceptual Vigilance Rounds. *Do not petition for special rounds; the standard schedule suffices under Divine continuity.* **Warning:** Unauthorised attempts to close CRoPE Offices contravene the Perpetual Cognition Act.

  **4. Reporting Perceptual Lapse (Suspected De-Animation):**  
      a.   If an object becomes imperceptible (e.g., missing, visually obscured, site inaccessible *despite effort*), file Form CRoPE-3C ("Report of Perceptual Interruption") IMMEDIATELY.  
      b.   **Form 5B Trap:** **DO NOT** file Form 5B ("Declaration of Unperceived Entity"). Attempting to conceive and declare an object *specifically as existing unperceived* constitutes a perceptual act regarding that conception, annulling the declaration's premise and incurring a Fee (Schedule O-7: §12 - Contradictory Cognition Charge).

  **5. Correcting Registry Errors:**  
      a.   If the Registry incorrectly lists an object as "In Being" (e.g., after demolition, destruction, or verified De-Animation) or "De-Animated" (while still perceivable), file Form CRoPE-4D ("Petition for Perceptual Record Rectification").  
      b.   Submit evidence: Affidavits of Perception/Non-Perception (Form CRoPE-5A logs preferred), Agent reports (if applicable).  
      c.   **Rectification Fee:** Applies per Schedule O-7: §8. Fee doubled if error stems from citizen's failure in Clause 3b (Perceptual Diligence).

  **6. Title Disputes & Resemblance:**  
      a.   Where two parties claim title to *what appears to be the same object/land*, the Tribunal of Sufficient Resemblance (TSR) adjudicates.  
      b.   Parties must demonstrate their sustained perceptual relationship with *their* perceived instance.  
      c.   The TSR assesses whether the perceptual streams described constitute sufficiently resembling entities under the Resemblance Thresholds (Annex R).  
      d.   **Costs:** Tribunal Costs (Schedule TSR-1) are borne by the party whose perceptual account demonstrates the *greater degree of dissimilarity* from the Registry's baseline perceptual signature for that plot/item. Higher dissimilarity incurs higher costs.

  **7. Fees & Penalties:** All Fees are non-negotiable and payable upon submission. Late payments incur Penalty Surcharges (Schedule P-2). Persistent failure in Perceptual Diligence (Clause 3b) may result in Compulsory Perception Orders (administered by CRoPE Agents, Fee Schedule O-7: §15 applies).

  **8. Contact:** Inquiries ONLY via Form CRoPE-6E ("Perceptual Query") submitted at your District Registry Office during Vigilance Hours. *Telephonic or abstract conceptual inquiries are unprocessable.*

  ---
  **Note for Author (98 words):**

  *   **Settled:** The core tenet ("to be is to be perceived") is bedrock. The Divine Perceiver as sustainer during universal non-perception is treated as established doctrine within the system, though its *necessity* is the awkwardness exploited. The impossibility of *coherently* conceiving an unperceived object (leading to the Form 5B trap) is presented as procedural fact.
  *   **Contested/Liberties:** The "sufficiency of resemblance" mechanism for disputes is an extrapolation. While Berkeley argues we never perceive the *same* object (only ideas), he doesn't propose tribunals for it – this is satirical exaggeration. The weight of the Divine Perceiver move is heavily debated historically (is it ad hoc?). Portraying the "conception" argument as a purely procedural self-annihilation simplifies its philosophical complexity (it's more an argument about meaning than a literal trap). Fee structures are pure bureaucratic invention for comedy.
