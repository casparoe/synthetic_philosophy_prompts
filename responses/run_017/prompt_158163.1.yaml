  Here's a joke tailored to your specifications, leaning into the "sparse inventory" vs. "predicate convenience" conflict and the potential regress worry:

  **The Scene:** Your character (let's call her Dr. Stone), slightly unsteady, glass of the bad party wine in hand, spots her nominalist colleague (Dr. Swift) near the punch bowl. She raises her voice slightly to draw attention.

  **The Joke:**
  > "Alright Swift, settle a bet. You think 'being this specific shade of hideous puce'—" *[She gestures vaguely at the wallpaper]* "—isn't a *real* property out there in the world, right? Just a handy label we slap on it?"
  >
  > *Swift nods cautiously.*
  >
  > "And you'd say the same about this wine's 'badness'? Just a predicate, not a genuine universal floating around *in* the wine?"
  >
  > *Swift, sensing a trap but committed, nods again.* "Essentially, yes. A useful way to organize our experience."
  >
  > "Right, right. Useful. Cheap." *[Stone takes a deliberately loud, grimacing sip]* "But see, *I* believe in the *real* universals. The expensive ones. Mass, charge... *badness*."
  >
  > *She holds up her glass, swirling the wine dramatically.*
  >
  > "This wine? Bad. That wallpaper? Bad. The Dean's speech last Tuesday? *Bad*. And it's not just three different labels! No! It's the *same badness*, instantiated right here, right there, right then. One universal, many... unfortunate instances."
  >
  > *She leans in conspiratorially towards Swift, voice dropping slightly but still carrying.*
  >
  > "So tell me, Swift... if *badness* is real, *in* the world... *what's instantiating it in your ontology?*"
  >
  > *[Pause. Stone beams triumphantly, expecting the laugh. Swift just stares, bewildered. The room is silent except for the awkward clink of a distant glass.]*

  **Why it (might) bomb with philosophers, but why they might *get* it:**
  1.  **The Punchline:** It flips the classic Third Man regress (What instantiates the instantiation?) onto the *nominalist* in a cheeky, unexpected way. Stone implies that if *she* (the realist) admits one universal (badness), she *owns* the potential regress ("What instantiates badness-badness?"). But she then *accuses the nominalist* of needing an ontology for instantiation itself ("what's instantiating it *in your ontology*?"). This is the contested fudge: Nominalists *don't believe instantiation requires a further entity or universal* – it's primitive, or linguistic, or a brute fact. Stone is misrepresenting nominalism by implying it *must* provide an "instantiator" for the realist's universal, which it explicitly rejects. The humor (for philosophers) comes from the deliberate category error and the absurdity of demanding an ontology for a concept the nominalist doesn't accept *needs* one.
  2.  **The Sparseness:** Stone contrasts her "expensive," sparse universals (mass, charge, badness) with the nominalist's "cheap," abundant "labels" ("hideous puce," "badness" as predicate). This highlights her view that real universals are few and fundamental, while mocking Swift for thinking everything gets a "handy label." The "badness" as a universal is deliberately borderline – is it fundamental like mass/charge? Probably not, which adds to Stone's drunken overreach.
  3.  **The Set-Up:** It uses the party environment (bad wine, ugly wallpaper, dull speech) concretely to ground the abstract debate. The physical gestures (sip, swirl) sell the performance.
  4.  **The Bomb Factor:** It's complex. The punchline requires quickly grasping the regress argument, the category error, and the specific commitments of both views. Non-philosophers are lost. Philosophers might chuckle at the audacious misdirection and Stone's drunken confidence, but it could easily fall flat if delivered poorly or if the room isn't primed for metaphysics. Swift's bewildered silence is the realistic reaction.

  **Where it fudges/leans contested:**
  *   **Misrepresents Nominalism:** As stated, nominalists don't need an "instantiator" for universals they deny exist. Stone's final question makes no sense *within* nominalism. The joke relies on Swift (and the audience) momentarily accepting the realist framing to see the absurd demand.
  *   **"Badness" as Sparse Universal:** Stone cheekily elevates "badness" to her sparse list alongside mass and charge for comedic effect, which a strict immanent realist likely wouldn't do. It highlights her drunken grandstanding.
  *   **Regress:** It simplistically presents the regress as a weapon to use against the nominalist, whereas it's traditionally a *problem for realism*. The humor is in the reversal.

  **Can the material carry a genuinely funny joke?**  
  **Honestly, borderline.** The core concepts *can* be mined for humor *among specialists* who recognize the precise moves being made (the reversal, the category error, the drunken over-application of "badness"). It's the kind of joke that might get a knowing chuckle or groan from a few in the room who are following closely, while others miss it entirely or find it painfully academic. This *perfectly* suits your scene: it's a joke a philosopher *might* attempt in that context, relying on insider baseball, delivered with drunken bravado, and likely to bomb with most of the audience. It has the required intellectual teeth but lacks broad appeal, making the bomb believable. It's not "smooth and empty"; it's niche and slightly flawed, which is authentic.
