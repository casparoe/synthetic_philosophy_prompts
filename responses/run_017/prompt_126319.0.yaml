  For the reference machine issue, the key is forcing her to confront that "constant" isn't innocuous—it can swallow the entire effective horizon. The follow-up needs numbers: say γ=0.9 making the horizon 100 steps, then point out how a pathological machine's overhead could exceed that. 

  Ah, the semimeasure point is subtle. She'll likely retreat to "all frameworks have limits," but the follow-up should corner her: if the leftover mass represents uncomputable worlds, why can't we even describe them? That exposes the assumption baked into the framework. 

  The grue problem relocation is classic. Need to emphasize that "short description" depends entirely on how we code predicates—so Solomonoff hasn't solved Goodman's riddle, just moved it. 

