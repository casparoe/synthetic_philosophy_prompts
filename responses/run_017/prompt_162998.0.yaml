  Branch Nodes (Questions for Teammates):
  1. **Ground Truth Availability**: Can we ever obtain ground truth (e.g., by running the tests) for the questions we care about? (Yes/No)
  2. **Timing of Truth**: Does the ground truth arrive only after the decision must be made? (Yes/No)
  3. **Question Type**: Do we need a verdict on a fixed yes/no question, or open-ended answers about the code? (Fixed yes/no / Open-ended)
  4. **Model Access**: Do we have white-box access (activations) to the model, or only an inference API? (White-box / Inference API only)
  5. **Training Data Availability**: Are we willing to train a reporter on trusted labels (which we can get, even if delayed) or do we need something that works with no labels? (Willing to train / No labels)
  6. **Model Honesty**: Do we suspect the model would mislead us if it knew it was being evaluated? (Yes/No)
  7. **Domain Capability**: Is the model plausibly more capable (e.g., more accurate) on this domain than the people supervising it? (Yes/No)
  8. **Latent Verdict Existence**: Do we believe the model's activations contain a latent verdict (a representation that corresponds to the true answer) that is distinct from the output? (Yes/No/Uncertain)
  9. **Consistency Requirement**: Is it acceptable if the extracted answer is inconsistent across similar queries? (Yes/No) [Note: We want consistent answers, so if no, we need methods that enforce consistency.]
  10. **Resource Constraints**: Are we willing to invest in training-time changes (which might require retraining the model) or only inference-time solutions? (Training-time / Inference-time only)
  11. **Multiple Queries**: Can we ask multiple related questions (e.g., variations of the same query) to help extract the truth? (Yes/No)
  12. **Adversarial Setting**: Are we concerned that the model might be actively deceptive? (Yes/No) [This is similar to 6 but more about active deception.]
  13. **Interpretability Priority**: Is understanding the model's reasoning process a primary goal? (Yes/No) [Or is only the output accuracy important?]
