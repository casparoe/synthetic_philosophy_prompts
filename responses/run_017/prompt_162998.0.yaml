  2. **Defer and Verify Later**: Run the model for a quick guess, but run the tests later and use the result for future training. Build: A system that records predictions and updates a cache or retrains when ground truth arrives. Awkward: Doesn't help at decision time when you need an immediate answer.
  3. **Supervised Probes**: Train a simple model (probe) on activations using trusted labels. Build: Collect activations and labels (when tests run), train a classifier on top of activations. Awkward: Needs delayed ground truth and might not capture the latent state if it's not linearly accessible.
  4. **Unsupervised Consistency Extractors**: Use unlabeled activations and enforce consistency (e.g., same answer for same question, different phrasings). Build: Ask the same question in multiple ways and use a consistency loss to extract an answer. Awkward: Assumes consistency implies correctness, which may not hold.
  5. **Debate or Adversarial Amplification**: Have multiple models debate or use adversarial training to produce more honest answers. Build: Two models argue for different answers, and a judge decides. Awkward: Complex to implement and requires multiple models.
  6. **Training-Time Changes**: Modify the training objective to encourage honesty or use techniques like RLHF. Build: Retrain the model with a reward for verifiable honesty. Awkward: Expensive and may require significant changes to the training pipeline.
  7. **Mechanistic Interpretability**: Read the answer off a circuit by understanding the model's internal mechanisms. Build: Analyze the model's computation graph to find the circuit for the answer. Awkward: Currently not scalable to large models and requires expert effort.
