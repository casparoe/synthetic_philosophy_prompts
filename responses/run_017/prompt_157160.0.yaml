prompt: |-
  I host a small philosophy podcast, and on Wednesday I'm recording an episode with a moral philosopher I'll call 'M.' — she has spent several years defending a thesis that my friend and I argued about until well past midnight on Saturday and never settled: that hypocrisy never deprives a blamer of standing, because standing to blame is just the authority to invoke a norm that genuinely binds its target, and everything people treat as a defect in the hypocrite's blaming is really one of two other things — either an epistemic defeater (her own conduct is evidence that she does not sincerely accept the norm, or that she is an unreliable detector of violations of it) or a free-standing vice of unfairness, self-righteousness or bad faith, which makes her blaming unattractive, even ugly, without making it unauthorized. She also insists on a sharp line between standing and the all-things-considered question of whether one should blame, and she is very quick on her feet: nearly every objection we threw at her on Saturday got reclassified within a sentence as 'that's sincerity, not standing' or 'that's unfairness, not standing.' My friend took the opposite side: blame is a form of moral address that presupposes the blamer's own acceptance of the norm as binding on her, so a hypocrite's blaming misfires structurally, rather in the way a demand misfires when the speaker would not accept it being made of her.

  Three cases carried most of the argument, and I want the episode to press on them. The first was a mother who smoked for thirty years and now tells her seventeen-year-old daughter not to vape: my friend said the mother can say plenty of useful things to her daughter but cannot blame her, I said that sounds like confusing the value of the warning with the question of authority, and M. would presumably say the mother's record is at most evidence about her sincerity. The second, which neither of us could handle, was a university that issues a public statement condemning fossil-fuel lobbying while its endowment holds fossil-fuel assets: here the individual-psychological story M. leans on seems to run out, since an institution is not exactly sincere or insincere, and yet the 'you're one to talk' reaction is if anything louder than in the interpersonal case. The third was one I invented on the drive home and liked better than either: a person who blames you today for something she fully intends to do herself tomorrow, explicitly as a device for binding herself — prospective hypocrisy, where there is no past violation to be evidence of anything, and where the blaming seems to do real normative work. Its mirror image is the case where the blamer's own violation was far harder for her to avoid than the target's was, which I started calling asymmetric exposure, and which made me suspect that what actually tracks our judgments is not compliance at all but something like whether the blamer is demanding more of others than she is willing to demand of herself under comparable pressure.

  What I'd like from you is eight to ten interview questions, in the order you'd ask them, none of which let her simply restate the thesis or tell me what drew her to the topic. I want at least one question pressing the moral-address picture of blame as a speech act that can misfire; at least one on the fact that ordinary blame practice treats 'you're one to talk' as a move that shifts something back onto the blamer, and on what the practice would look like if it were tracking a real standing condition rather than etiquette; at least one on whether the epistemic-defeater story can be neutralized by avowed self-blame (someone who says, sincerely and with self-reproach, 'I do exactly this, and you should not'), and if so whether introspective avowal is really enough; at least one on the institutional or collective case; at least one on prospective and self-binding hypocrisy; and at least one on asymmetric exposure and on whether difficulty of compliance, rather than compliance itself, is what is doing the work. Please build the sequence so that her two stock reclassifications get progressively harder to reach for — anticipate the reply she is most likely to make to each question and give me the follow-up that closes it off or forces her to pay a price I can name on air — and close with one question about what would count as evidence against her view: what feature of our blaming practice, or of the concept of standing, she would have to concede she cannot explain.
reasoning: |-
  Okay, this user hosts a philosophy podcast and is preparing for an episode with a moral philosopher, M., who defends a specific thesis about hypocrisy and standing to blame. The user wants interview questions that challenge M.'s view effectively. 

  First, I need to understand M.'s thesis clearly. She argues that hypocrisy doesn't remove standing to blame because standing is just the authority to invoke a binding norm. Any issues with hypocritical blame are either epistemic defeaters (like insincerity or unreliability) or separate vices (like unfairness), not actual lack of authority. She sharply distinguishes standing from whether one should blame all-things-considered.

  The user and their friend debated this, focusing on three cases: the smoking mother, the university with fossil fuel investments, and the prospective hypocrite. The user wants questions that press on these cases and force M. beyond her standard reclassifications. 

  The user's deeper needs seem to be: 
  - Testing the robustness of M.'s framework against hard cases 
  - Exposing potential weaknesses in her epistemic/vice distinction 
  - Understanding how her view handles non-individual actors (institutions) 
  - Exploring whether difficulty of compliance matters more than compliance 
  - Getting M. to specify what could falsify her view 

  I should design questions that:
  1. Challenge the moral address model upfront 
  2. Press the institutional case where "sincerity" doesn't apply 
  3. Use the prospective hypocrisy case to undermine epistemic arguments 
  4. Explore asymmetric exposure to reveal if difficulty is the real factor 
  5. Force M. to confront what would count against her theory 

  The sequence needs to build pressure methodically. Start with speech-act theory to unsettle the standing/epistemic split, then move to institutional hypocrisy to stretch her individual-psychological model. The prospective case comes next to attack the "past violation as evidence" pillar. Asymmetric exposure then challenges whether compliance is even the right metric. Finally, demand falsifiability. 

  Each question should anticipate M.'s likely replies and have sharp follow-ups. For example: 
  - If she calls institutional blame "unfair but authorized," ask why we feel the authority itself is damaged 
  - If she dismisses prospective hypocrisy as "mere self-binding," question why it feels distinct from legitimate precommitment 
  - If she retreats to "all-things-considered shouldn't," highlight practices where standing is explicitly contested 

  The closing must force her to name what evidence would undermine her view - perhaps practices where hypocrites are barred from blaming even when reliable, or where blamers with clean records but unfair demands are granted standing.
answer: |-
  Here's a sequenced interview strategy designed to pressure M.'s thesis by forcing her beyond stock reclassifications, targeting her core distinctions, and leveraging your key cases. Each question anticipates her likely initial move and provides a follow-up to cut off retreat:

  1.  **Opener (Speech Act Misfire):** "M., if blame is fundamentally a *demand for recognition* of wronging – a call to acknowledge the norm’s authority over the target – doesn’t a hypocrite’s own violation *within the same normative relationship* potentially undermine that very demand? Doesn't it risk turning the demand into a performative contradiction, like shouting 'Be quiet!' in a library?"
      *   *Anticipated Reply:* "That conflates standing with effectiveness or sincerity. The demand’s authority comes from the norm binding the *target*, not the blamer’s history."
      *   **Follow-Up:** "But if the hypocrite's act implicitly signals *'This norm isn't ultimately decisive for action, even for me, its supposed enforcer'*, doesn't that directly corrode the perceived *authoritativeness* of the demand itself *as a demand*? Is the standing to demand recognition truly intact if the demand inherently carries a message undermining the norm's supreme authority?"

  2.  **Practice & 'You're One to Talk' (Shifting Burden):** "Ordinary moral practice treats 'You’re one to talk!' as a powerful *rebuttal*, shifting a burden back onto the blamer. If standing is purely about the norm binding the target, why does this move feel like a legitimate block to *this person* blaming *right now*, rather than just an accusation of bad manners?"
      *   *Anticipated Reply:* "It *is* primarily about unfairness or bad faith – vices of the blamer – or signals unreliability. It doesn’t negate the underlying authority derived from the norm."
      *   **Follow-Up:** "Imagine a community where hypocrisy is rampant but universally acknowledged – everyone blames others for faults they openly share. According to your view, standing is always present (if norms bind). But wouldn't blame in this community likely become *empty ritual*, utterly disconnected from genuine normative authority? Doesn't this practice *itself* suggest that 'standing' in a robust sense requires *more* than just the norm binding the target?"

  3.  **Avowed Self-Blame & Epistemic Neutralization:** "Take someone who blames another for cruelty while simultaneously, sincerely, and self-reproachfully admitting, 'I do this exact thing constantly, and it’s wrong – you shouldn’t either.' They neutralize the epistemic defeat (sincerity/reliability) and own the vice. Does this hypocrite now have full standing?"
      *   *Anticipated Reply:* "Yes. The avowal addresses the epistemic concern. The standing was always there; they’ve just made their blame less unattractive or more credible."
      *   **Follow-Up:** "But doesn't this avowal *highlight* the unfairness? They are demanding restraint from another that they admit they cannot exercise themselves. Isn't the core objection now precisely about the *authority to demand* – 'By what right do *you*, who freely admit you yield to this temptation, demand *I* resist it?' – rather than just finding their attitude ugly? Can sincerity *redeem* the standing, or does it expose its inherent weakness here?"

  4.  **The Institutional Case (Fossil Fuels):** "Universities condemning fossil fuel lobbying while profiting from fossil fuels face intense 'you're one to talk' reactions. But institutions aren't 'sincere' or 'insincere' in the individual psychological sense. How does your framework explain why this *feels* like a standing failure, not just bad faith or unreliability?"
      *   *Anticipated Reply:* "It *is* about institutional bad faith or unreliability – the statement misrepresents their true commitments evidenced by their actions/endowment. Or it’s a vice of collective hypocrisy."
      *   **Follow-Up:** "But the objection often focuses precisely on the *authority* of the *institution* to issue this *condemnation*. Critics say 'They *forfeit the right* to make this moral claim.' Isn't this language of *forfeiting a right* pointing directly to a standing condition – an authority derived from *embodying* or *being answerable to* the norm they invoke – which institutional hypocrisy undermines, precisely because sincerity/vice language seems inadequate?"

  5.  **Prospective Hypocrisy (Self-Binding Device):** "Consider my 'prospective hypocrite': Alice blames Ben today for breaking confidence, *explicitly stating* she intends to do the same tomorrow, as a way to bind herself. No past violation exists. Her blame seems functional (it *might* bind her) and epistemically neutral (she's transparent). Does she have standing to blame Ben?"
      *   *Anticipated Reply:* "Possibly, but it's deeply unfair to Ben. She's using him as a tool for her own self-binding, demanding restraint from him she openly plans to abandon. That's a vice, not a standing issue. The norm binding Ben grants standing."
      *   **Follow-Up:** "But if standing is *solely* about the norm binding Ben, and her future intention is irrelevant to *that*, why does her explicit declaration *'I will do this tomorrow'* feel like it *instantly* strips her of any moral authority to blame Ben *today*? Isn't the objection precisely that her *current* act of blaming *presupposes* a commitment she simultaneously *disavows* for her future self, making her *present* blame structurally incoherent? Doesn't this show that standing requires the blamer's *current commitment* to the norm *as binding on their own will*, not just its application to the target?"

  6.  **Asymmetric Exposure (Difficulty, not Compliance?):** "Imagine Sarah blames Tom for lying to avoid minor embarrassment. Sarah admits she lied once, but only to prevent imminent violence against her family. Both violated the norm, but Sarah faced vastly greater pressure. Does she have standing? If not, is it because her *compliance record* is irrelevant, but the *relative difficulty* she demands of Tom compared to what she demanded of herself *under comparable pressure* is the key factor?"
      *   *Anticipated Reply:* "Her standing is intact. Her blame might be perceived as unfair or self-righteous because Tom faced less pressure, but that doesn't negate the norm binding Tom or her authority to invoke it."
      *   **Follow-Up:** "If standing is truly separate, why is the intuitive judgment often that Sarah *does* have standing here, precisely *because* her violation occurred under duress Tom didn't face? Conversely, if Sarah had lied under *less* pressure than Tom, the sense of lost standing is *stronger*. Doesn't this pattern suggest that what *actually* modulates our sense of 'standing' isn't bare compliance, but a judgment about the *fairness of the demand* relative to the blamer's *own exercise of will* under similar normative pressure? Isn't 'standing' tracking whether the blamer is making a fair demand *on this specific agent*, considering comparative burdens?"

  7.  **The Core Distinction Under Pressure:** "You insist standing is purely about the norm binding the target, distinct from sincerity/vice (epistemic/vice defeater) or 'should we blame?' (all-things-considered). But after pressing these cases, doesn't it seem like the *practice* of challenging standing via hypocrisy *fuses* these elements? When we say 'You can't say that,' aren't we often pointing to a *defect in the blamer's normative position* that undermines their *authority to issue this specific demand*, a defect constituted precisely by their *unfairness* or *failure of commitment* relative to the demand they are making?"
      *   *Anticipated Reply:* "That conflates distinct concepts. The authority exists; the unfairness makes exercising it vicious or imprudent."
      *   **Follow-Up:** "But doesn't your view risk making 'standing' a bloodless, purely formal category divorced from the actual *social and normative force* that constitutes blame as a practice? If the 'authority' persists even when its exercise is vicious, unreliable, and perceived as utterly illegitimate by the target and community, what *substantive work* is 'standing' doing that isn't already covered by saying 'the norm binds the target'?"

  8.  **Falsification (Closing):** "What would constitute *evidence against your view*? Specifically, what feature of our actual blaming practices, or of the *concept* of standing as used in moral discourse, *could not* be explained by your framework of 'binding norm + epistemic/vice defeaters', and would instead *require* positing that hypocrisy can directly negate standing?"
      *   *Goal:* Force her to specify a phenomenon her theory *couldn't* absorb as an epistemic/vice issue or an all-things-considered "shouldn't blame." Listen for: Practices where hypocrites are barred *procedurally* (e.g., recusal norms), cases where *reliability/sincerity is demonstrably present but standing is still denied* (like prospective hypocrisy), or linguistic evidence where "no standing" is explicitly distinguished from "unfair" or "insincere."

  **Sequencing Logic:**
  1.  Starts with the core structural challenge (speech-act misfire).
  2.  Grounds it in actual practice ("you're one to talk").
  3.  Tests if epistemic defeaters can be neutralized without restoring perceived authority (avowed self-blame).
  4.  Attacks the individualism of her model (institutional case).
  5.  Undermines the reliance on *past* violation as evidence (prospective hypocrisy).
  6.  Challenges the centrality of *compliance* itself (asymmetric exposure).
  7.  Directly pressures the viability of her core distinctions after the case assaults.
  8.  Demands falsifiability, forcing her to define the limits of her theory.

  This sequence systematically blocks the easy retreats to "sincerity/vice not standing" and "binding norm not blamer" by showing how the blamer's own normative position *constitutively* impacts the perceived and functional authority of their blame across diverse cases. Good luck with the interview!
