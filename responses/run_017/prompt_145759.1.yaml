prompt: |-
  I joined the grants committee of a small health foundation about six months ago, and I have to run a ninety-minute session for the other members before we vote on our next funding cycle. The reason it matters to me is embarrassingly local: last cycle we expanded a diabetes screening programme by cutting a small hospice transport service, I voted for it on the grounds that the QALY arithmetic was not close, and I have been uncomfortable ever since without being able to say what, exactly, my discomfort amounts to. What I want from you is not an explanation of the separateness of persons objection to utilitarianism, but a plan for how I should get eight non-philosophers to feel the force of it well enough to argue about it, and then to vote.

  The group is a retired actuary, two GPs, a hospital chaplain, a solicitor, a borough councillor, a former teacher and a twenty-two-year-old patient representative. They arrive believing that cost-effectiveness aggregation is simply what rational allocation is, and I have one structural wrinkle I want the session built around rather than bolted on: our foundation serves a small, stable catchment population on a rolling ten-year strategy, and the sub-groups who gain and lose in any given cycle rotate, so that over the decade roughly the same people are on the losing side of some decision and the winning side of another. That means the case I put to them is not the standard one-off choice between saving a few or saving many. I want you to tell me what the carrying example has to contain and, just as importantly, what it has to leave out — whether the gainers and losers should be identified individuals or statistical ones, whether the losses should be small and numerous or concentrated, whether death should appear in it at all, and what each of those choices does to the objection's grip.

  I also want the dependency structure: what has to be in place before the complaint can even sound like a complaint rather than mere squeamishness about trade-offs. The misconceptions I expect are that this is just the trolley problem dressed up, that it is just deontology versus consequentialism by another name, and that it is really only a demand that we weight the worse off, which they will take to be a technical fix to the formula rather than a challenge to it. The one I most want headed off, though, is the thought that our rotating ten-year plan dissolves the objection entirely, on the grounds that if everyone takes a turn at losing then aggregating across persons looks no different from aggregating across the stages of one life; I would like that raised at the right point in the sequence rather than early, and I want to know whether thinking it through should make them more or less sympathetic to the objection. Tell me where in the order each misconception should be defused, give me one question I can put to them at the end that would distinguish someone who has actually grasped the point from someone who has only learned to repeat that you may not add people together, and say plainly what I should openly refuse to settle in ninety minutes.

  Please answer in continuous prose, as you would in a long email: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, the user is on a grants committee for a small health foundation and needs to run a 90-minute session to help non-philosopher members grapple with ethical discomfort around cost-effectiveness decisions. They previously voted to cut hospice transport for diabetes screening based on QALY calculations but feel uneasy. The key challenge is making the "separateness of persons" objection tangible without philosophy jargon. 

  The committee composition matters - actuary, GPs, chaplain, etc. - all default to seeing aggregation as rational. The unique angle is the foundation's rotating 10-year plan where subgroups take turns "losing." User wants to structure the session around this, avoiding common misconceptions (trolley problem redux, technical weighting fixes). Crucially, they need to preempt the idea that rotation nullifies the ethical concern by making it resemble life-stage tradeoffs.

  Hmm... the core tension: How to make abstract philosophy visceral? Must design a scenario where gains/losses feel concrete yet avoid triggering defensive "but we already account for fairness!" reactions. Rotation is both obstacle and tool - it mimics fairness but may obscure why losing hurts differently when imposed by others versus life's randomness. 

  For the case study, I'm leaning toward: Identifiable individuals (e.g., "Mrs. A needing transport"), concentrated losses (death/disability) not diluted small harms, and avoiding QALY-style math to prevent default thinking. The chaplain and patient rep might anchor emotional weight; actuary and solicitor need logical hooks. 

  Timing traps to avoid: If rotation argument comes too early, it derails the moral intuition. Should first solidify why loss imposition feels wrong even with compensation later. Then dissect why "taking turns" doesn't fix it - like saying robbery is fine if thieves rotate victims. 

  Endgame question must test internalization: "Would you personally accept this loss-rotation scheme for your family?" not just recite "can't aggregate people." And explicitly table utilitarian rebuttals - this session is about unease, not solutions. 

  ...Am I overcomplicating? No - the user's self-awareness about their discomfort being "embarrassingly local" suggests they'll spot superficial treatments. Need rigor wrapped in relatability.
answer: |-
  Your situation is precisely where philosophy meets the grit of real-world choices, and your discomfort is both valid and instructive—it's the sound of the separateness of persons grating against the machinery of aggregation. The goal isn’t to convert your committee to anti-utilitarians but to destabilize their unexamined assumption that QALY-style arithmetic is synonymous with rationality, using your foundation’s unique rotating-subgroup structure as the lever. Here’s how to structure the session, layer by layer, with the carrying example at its core.  

  Begin not with theory but with visceral unease. Describe a simplified, fictionalised version of last cycle’s choice: *"We diverted funds from transporting ten terminally ill patients to weekly hospice sessions—a small service giving them comfort, dignity, and connection in their final months—to expand diabetes screenings that caught early-stage cases in fifty people, preventing severe complications years later. The QALY gain massively outweighed the loss. Yet I dream about Mrs. Ellis, who used that transport. She died three weeks after we cut it, isolated and in pain. Was that just?"* Name the discomfort: *"It feels different from, say, choosing between two equally costly life-extending treatments where one gives more years. Why?"* This primes them to feel the moral weight of *taking* from specific, vulnerable people to *give* to others, even if net benefit is positive.  

  Now introduce the carrying example—but crucially, **it must involve identified individuals facing concentrated, non-fungible losses, and gains must feel distant or impersonal.** Don’t use death yet; it overwhelms. Instead:  

  > *Imagine Anya, 82, with severe arthritis. Her subsidised van service takes her to the community centre twice a week. Without it, she’s homebound—lonely, depressed, her pain unmanaged. We reallocate that funding to install ramps in 30 local shops. Each ramp is lightly used by many people with mild mobility issues, sparing them minor inconvenience. Net well-being increases: thousands of small gains outweigh Anya’s deep loss. But Anya isn’t just ‘a cost’; she’s our neighbour. We chose to *actively deprive her* to create diffuse benefits for others. Does that choice become innocent because, in our ten-year cycle, Anya might later benefit when her subgroup ‘wins’ on another issue?*  

  **Why this works:**  
  - **Identifiable losers (Anya), statistical gainers:** Makes the loss vivid and personal, contrasting with abstract gains.  
  - **Concentrated loss vs. dispersed gains:** Highlights the asymmetry—destroying a life-sustaining resource for one to create many trivial conveniences.  
  - **Excludes death:** Keeps the focus on the *structure* of the harm (imposition, non-fungibility) without triggering "lifeboat ethics" distractions.  
  - **Uses your rotation wrinkle directly:** Forces them to ask if future compensation neutralizes present violation.  

  **Dependency structure—what must be true for the complaint to bite:**  
  1. **The loss is non-voluntary and imposed by the group’s decision** (Anya didn’t choose to sacrifice her van).  
  2. **The loss is qualitatively severe for the individual** (not just a minor inconvenience; it devastates her well-being).  
  3. **The gain, while larger in aggregate, doesn’t reciprocally bind the gainers to the loser** (ramp users don’t owe Anya; it’s not a shared sacrifice).  
  4. **The justification is purely aggregative** ("more people gained slightly more than she lost").  

  **Sequence to defuse misconceptions:**  
  1. **Early (after the Anya example):** *"This isn’t the trolley problem."* Trolley dilemmas involve immediate, identical harms (death vs. death). Here, we’re choosing between *types* of goods (dignity/convenience) and *imposition* matters—pushing Anya onto the tracks is different from diverting a runaway trolley.  
  2. **Mid-session (when discussing rotation):** *"This isn’t about weighting the worse off."* Adding equity weights to QALYs (e.g., prioritizing the severely ill) tweaks the formula but still aggregates. The objection is deeper: Why should Anya’s *right not to be sacrificed* vanish because enough others gain?  
  3. **Late (once rotation is debated):** *"Rotation doesn’t dissolve the objection—it mirrors it."* The "fair innings" argument (*"Everyone loses sometimes, gains others—like stages of one life!"*) is your pivotal moment. Stress: A life’s stages are *connected*—we endure hardship for future personal gain. But Anya’s loss isn’t *for her* later gain; it’s for *others’* gain now. She’s a means to their ends. If we wouldn’t force a single person to endure crippling pain for years in exchange for future group benefits they might not live to see, why is it different when we rotate victims? **This should heighten sympathy for the objection—it reveals rotation as systemic coercion, not fairness.**  

  **The endgame question to test comprehension:**  
  *"Suppose Anya’s grandson later benefits from a ramp we fund by cutting someone else’s dialysis subsidy. Does that make it okay that we sacrificed her? Or does it just mean two wrongs?"* The key isn’t repeating "you can’t add people." It’s recognizing that **compensation across persons doesn’t annul the initial violation; it generalizes it.** Someone who grasps this will say: *"It might be 'fairer' rotation, but Anya was still used without her consent for others' ends. That’s the core wrong—even if later, others are used for her grandson."*  

  **What you must refuse to settle:**  
  Do **not** let the session devolve into designing "better" aggregation formulas (e.g., "Should we weight QALYs for equity?"). Declare openly: *"We’re not solving utilitarian calculus today. We’re asking if something vital is lost when we reduce all human value to arithmetic—even fair arithmetic. Hold that discomfort; it’s the point."*  

  Your aim is to leave them unsettled—to make the committee room feel colder when they next see a QALY spreadsheet. That unease is the first sign of moral clarity.
