  ### Self-Sorting Decision Tree: Ethical Comparisons of Infinite Outcomes

  This decision tree helps you locate your position on comparing worlds with infinitely many lives or lives of infinite welfare. Start at **Branch Node 0** and answer each question based on your intuitive judgment about the concrete case. Each branch is self-contained: key concepts are briefly defined at the point of use. Terms like *cardinality* (size of a set), *limiting relative frequency* (proportion of a subset as the population grows), *non-Archimedean structures* (number systems where finite values don’t “cancel out” infinite ones), and *conditional convergence* (a series whose sum depends on the order of terms) are explained inline. After completing the tree, use the scoring sheet to map your answers to a named ethical position.

  ---

  #### Branch Node 0: Can Infinite Worlds Be Compared?  
  **Case:** Consider two possible futures: one with infinitely many lives of finite duration, and another with finitely many lives of infinite duration (e.g., immortal beings). Both contain value and disvalue.  
  **Question:** Is it possible to ethically compare these worlds (e.g., say one is better than the other)?  
  - **Yes** → Go to Branch Node 1.  
  - **No** → You are at **Leaf I: Incomparability / Paralysis**.  
    *Most awkward commitment:* No ethical comparisons are possible for infinite worlds, rendering practical decision-making paralyzed when infinity is involved.

  #### Branch Node 1: Do Finite Additions Matter Against an Infinite Background?  
  **Case 1:** A world of pure bliss (infinitely many lives, each with welfare +100) has one life of mild suffering (welfare -1) added.  
  **Case 2:** A world of infinite suffering (infinitely many lives, each with welfare -100) has 1,000 blissful lives (welfare +100) added.  
  **Question:** In at least one case, does the finite addition change the world’s value (e.g., is Case 1 worse, or Case 2 better)?  
  - **Yes** → Go to Branch Node 2.  
  - **No** → You are at **Leaf A: Anti-Aggregativism**.  
    *Most awkward commitment:* Adding any number of good/bad lives to an already infinite good/bad world changes nothing, making aggregation irrelevant.

  #### Branch Node 2: Does Infinite Magnitude Dominate Infinite Number?  
  **Case:** Compare World X (infinitely many lives, each with finite welfare +1) and World Y (one life with infinite welfare, e.g., eternal bliss).  
  **Question:** Is World Y at least as good as World X?  
  - **Yes** → Go to Branch Node 3.  
  - **No** → Go to Branch Node 4.  

  #### Branch Node 3: Do Infinite Stakes Dominate Finite Probabilities?  
  **Case:** Choose between:  
  - **Option A:** Save one life for sure (finite good: +1 welfare).  
  - **Option B:** A 1 in 10^100 (near-zero) chance of upgrading infinitely many lives from suffering to bliss, and near-certainty of no effect.  
  *Expected value note:* Option B’s expected welfare is (probability) × (infinite magnitude). This may be infinite, undefined, or dependent on conventions for multiplying infinitesimals (infinitely small numbers) by infinities.  
  **Question:** Should you choose Option B due to its (potentially infinite) expected value?  
  - **Yes** → You are at **Leaf F: Infinite Stakes Dominance**.  
    *Most awkward commitment:* Any positive probability of affecting infinite value, no matter how small, overrides all finite stakes, making extreme gambles mandatory.  
  - **No** → Go to Branch Node 4.  

  #### Branch Node 4: Does the Arrangement of Lives Matter?  
  **Case:** Two worlds contain identical lives: infinitely many ecstatic (+100) and infinitely many mildly suffering (-1).  
  - World A: All ecstatic lives come before all suffering lives.  
  - World B: Lives are interleaved (ecstatic, suffering, ecstatic, suffering, ...).  
  **Question:** Is World B better than World A?  
  - **Yes** → Go to Branch Node 5.  
  - **No** → Go to Branch Node 6.  

  #### Branch Node 5: Does Limiting Frequency Override Cardinality?  
  **Case:** Two worlds have infinitely many good lives (+1) and infinitely many bad lives (-1).  
  - World C: The proportion of good lives in the first *n* lives approaches 1/2 as *n* grows.  
  - World D: The proportion of good lives in the first *n* lives approaches 1 (almost all good) as *n* grows.  
  *Cardinality note:* Both worlds have the same "size" (cardinality) of good and bad lives. *Limiting relative frequency* is the long-run proportion.  
  **Question:** Is World D better than World C?  
  - **Yes** → You are at **Leaf B: Limiting Frequency View**.  
    *Most awkward commitment:* Worlds with identical cardinalities of good/bad lives can differ in value based on asymptotic proportions, making order-sensitive averaging central.  
  - **No** → You are at **Leaf G: Cardinality View**.  
    *Most awkward commitment:* Only the count of good/bad lives matters; arrangement and limiting frequencies are irrelevant, so Worlds C and D are equally good.  

  #### Branch Node 6: Is Total Welfare Well-Defined for Conditionally Convergent Series?  
  **Case:** A world has lives ordered in time. Their welfare forms a series: +1, -1/2, +1/3, -1/4, +1/5, ... (alternating harmonic series). The partial sums (e.g., sum of first *n* lives) converge to ≈0.693 in this order, but rearranging the lives can make the sum converge to any real number (*conditional convergence*).  
  **Question:** Does this world have a determinate total welfare?  
  - **Yes** → Go to Branch Node 7.  
  - **No** → You are at **Leaf D: Indeterminate Total View**.  
    *Most awkward commitment:* No total welfare can be assigned to some infinite worlds, forcing reliance on non-totalistic methods (e.g., frequencies) or incomparability.  

  #### Branch Node 7: How Is Total Welfare Defined?  
  **Question:** For the series above, what determines total welfare?  
  - **The limit of partial sums in the given temporal order** → You are at **Leaf C: Temporal Order View**.  
    *Most awkward commitment:* Temporal or structural order fixes total welfare, so rearranging lives can change ethical value even if all individual lives are identical.  
  - **The limit of the average welfare (sum of first *n* lives divided by *n*) as *n* grows** → You are at **Leaf H: Average View**.  
    *Most awkward commitment:* Total welfare is derived from long-run averages (here, approaching 0), ignoring reorderable sums and prioritizing density.  

  ---

  ### Scoring Sheet
  Map your answers to the branch nodes to find your ethical position:  

  | Node 0 | Node 1 | Node 2 | Node 3 | Node 4 | Node 5 | Node 6 | Node 7 | Leaf | Position Name |
  |--------|--------|--------|--------|--------|--------|--------|--------|------|---------------|
  | No | – | – | – | – | – | – | – | I | Incomparability / Paralysis |
  | Yes | No | – | – | – | – | – | – | A | Anti-Aggregativism |
  | Yes | Yes | Yes | – | – | – | – | – | E | Infinite Magnitude Dominance |
  | Yes | Yes | No | Yes | – | – | – | – | F | Infinite Stakes Dominance |
  | Yes | Yes | No | No | Yes | Yes | – | – | B | Limiting Frequency View |
  | Yes | Yes | No | No | Yes | No | – | – | G | Cardinality View |
  | Yes | Yes | No | No | No | – | Yes | Partial sums | C | Temporal Order View |
  | Yes | Yes | No | No | No | – | Yes | Average | H | Average View |
  | Yes | Yes | No | No | No | – | No | – | D | Indeterminate Total View |

  **Notes on Unnamed/Unoccupied Positions:**  
  - **Non-Archimedean View:** Not a unique leaf. If you answered "Yes" at Node 1, your view (e.g., that finite differences register against infinity) may align with this. It is formalized using non-Archimedean structures (e.g., hyperreal numbers) but is compatible with multiple leaves (B, C, G, H).  
  - **Person-Affecting View:** Not separated by the tree. If you answered "Yes" at Node 1, you might hold this view (improving a world requires benefiting someone without harming others). It travels with Leaf A or paths through Node 1, but lacks a unique node as it often converges with other positions.  
  - **Unnamed Coherent Position (e.g., Asymmetric Aggregativism):** If you answered "Yes" at Node 1 for Case 1 but "No" for Case 2 (or vice versa), no named leaf exists. *Diagnosis:* Coherent but unexplored; a defender would need to justify why adding good to infinite suffering differs from adding suffering to infinite bliss.  

  ---

  ### Predictable Challenges in a 60-Minute Session  
  1. **Misreading Branch Node 1:** Students may conflate the two cases or misparse "at least one," leading them to Leaf A (Anti-Aggregativism) even if they believe finite additions matter asymmetrically. Clarify that Case 1 and Case 2 test symmetry.  
  2. **Strategic Answering at Branch Node 3:** Students who dislike Leaf F (Infinite Stakes Dominance) may answer "No" to avoid it, even if they accept the expected-value rationale. This distorts their path (e.g., to Leaves B, C, or D).  
  3. **Ambiguity in Conditional Convergence (Branch Node 6):** Students without calculus may struggle with conditional convergence. The handout explains it, but the concept requires time to grasp. Be prepared to rephrase: "The sum is fragile—changing the order of lives changes the total."  
  4. **Tree’s Limitation:** The tree cannot reproduce the **person-affecting intuition** (that value must be tied to affected individuals) as a distinct position. You’ll need to supply this in discussion by noting that it often underlies "Yes" at Node 1 but is compatible with multiple leaves (e.g., B, C, G).  
  5. **Time Constraints:** With 8 branch nodes, students may rush. Prioritize Nodes 0, 1, and 4 (which cover core cases like arrangement and finite additions) if time runs short.  

  This tree locates 8 named positions (I, A, E, F, B, G, C, H, D) and one unnamed coherent view, covering the required cases and positions. It introduces asymmetry between infinite number and infinite magnitude at Node 2, as these are treated differently by key views (e.g., Infinite Magnitude Dominance at Leaf E). Total words: ~1,200.
