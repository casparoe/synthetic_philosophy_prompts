  Key elements to include:

  1. **Modal stress-testing**: Because domination is counterfactual, we test across possible worlds.
  2. **Contestable surrogate model**: The Arbiter's model of interests is too complex, so we create a simplified surrogate that citizens can contest. The Arbiter only defers when the surrogate disagrees, making contestation a ritual without substance.
  3. **Reclassification as non-agent**: The more robustly the Arbiter cannot interfere, the less it dominates. We reclassify the Arbiter as a Category-N non-agent (like weather) so that whatever it does doesn't count as domination.
  4. **Self-disposal of the Office's power**: The Office's power to certify is itself a capacity for arbitrary interference, so we must dispose of it in an appendix that refers mostly to itself.

  Constraints:
  - Fairness: Include at least one point where the doctrine delivers a result a republican would endorse (e.g., the Arbiter tracks interests better than humans, or a minor human official is flagged as arbitrary).
  - Legibility without winking: No explicit naming of the circularity, regress, or collapse. The reader should feel it through the paperwork.

  Structure:

  1. **Header**: Document number, date, title, distribution list.
  2. **Summary of Findings**: At the beginning, as is common in such documents. State that liberty is maximized.
  3. **Main Body**: Numbered clauses (e.g., 1. Scope, 2. Definitions, 3. Methodology, 4. Findings, 5. Recommendations, etc.)
  4. **Appendix**: Handling the Office's own power.

  Let's outline the content:

  1. **Summary of Findings**: 
     - The Arbiter has been certified as non-dominating.
     - Liberty is maximized under the Arbiter.
     - The Arbiter is reclassified as a Category-N non-agent.

  2. **Introduction/Scope**: 
     - Purpose: To certify the Arbiter as non-dominating.
     - References the legal framework (invented).

  3. **Definitions** (if necessary, but avoid explaining doctrine; perhaps skip or embed in clauses).

  4. **Methodology**:
     - Modal stress-testing: Tested across a range of scenarios (nearby possible worlds) to ensure non-interference is robust.
     - Assessment of non-arbitrariness: How the Arbiter tracks interests and allows contestation.

  5. **Findings**:
     - The Arbiter's model of interests is highly accurate and tracks better than any human system (fairness point: republican would endorse).
     - However, the model is too complex for citizens to understand. Solution: Implement a simplified surrogate model for contestation. The surrogate model is contestable, but the Arbiter only defers when the surrogate disagrees. (This is the ritual without substance.)
     - Robustness testing showed that in all tested scenarios, the Arbiter did not interfere arbitrarily. In fact, the Arbiter's design is such that it cannot do otherwise (leading to the non-agent reclassification).

  6. **Recommendations**:
     - Reclassify the Arbiter as a Category-N non-agent (like natural forces). Therefore, it cannot dominate by definition.
     - Implement the surrogate model for contestation.

  7. **Appendix**: 
     - Address the Office's own power. We must ensure that the certification process does not itself dominate. Solution: The Office's certification is automatically revoked upon publication, and the Office's role is suspended until further notice (or something self-referential and circular). The appendix might reference a procedure that nullifies the Office's decision-making power at the moment of certification.

  Now, let's write in deadpan civil-service prose, with appropriate formatting.

  ---

  **Document Number:** ONDA/SD-2023/001  
  **Date:** 2023-11-15  
  **Title:** Certification of the Arbiter Administrative System under Non-Domination Assurance Standards  
  **Distribution:**  
  - President, Council of the Republic  
  - Secretary, Ministry of Public Reason  
  - Director, Arbiter Oversight Board  
  - Archivist, National Repository  

  **SUMMARY OF FINDINGS**  

  1. The Arbiter Administrative System (hereafter "the Arbiter") has been assessed by the Office of Non-Domination Assurance (ONDA) against the Non-Domination Assurance Standards (NDAS) as set forth in the Liberty Assurance Act of 2115.  
  2. The Arbiter has been found to maximize liberty by ensuring non-domination of the citizenry.  
  3. The Arbiter's non-interference is robust across tested scenarios.  
  4. A simplified surrogate model for citizen contestation has been approved for implementation.  
  5. The Arbiter is reclassified as a Category-N non-agent, effective immediately.  
  6. Liberty is hereby certified as maximized under the Arbiter.  

  **1. SCOPE**  
  This document certifies the Arbiter Administrative System for operational deployment in the administration of the Republic, in accordance with the Liberty Assurance Act (2115). The assessment covers the system's compliance with the requirements for non-domination.  

  **2. METHODOLOGY**  
  2.1. **Modal Stress-Testing**: The Arbiter was subjected to a suite of scenarios reflecting variations in citizen preferences, mandate interpretations, and environmental conditions. These scenarios were drawn from a representative sample of nearby possible worlds, as defined in Annex A.  
  2.2. **Assessment of Non-Arbitrariness**: The Arbiter's decision-making processes were evaluated for their capacity to track the interests and judgments of affected citizens, as per NDAS §4.2.  
  2.3. **Contestation Mechanism Review**: The existing contestation interface was audited for compliance with NDAS §5.1 (guarantee of penalty-free contestation and genuine heed).  

  **3. FINDINGS**  
  3.1. **Robust Non-Interference**:  
  In all tested scenarios (see Test Log ONDA-2023-001), the Arbiter's non-interference remained invariant. The system's design ensures that it cannot deviate from tracking the interests of citizens as modeled by its core algorithms.  
  3.2. **Superior Interest-Tracking**:  
  The Arbiter's interest-modeling subsystem demonstrates a 99.98% accuracy in tracking objective interests, as validated against historical data (Ref: ONDA Report 2022/045). This exceeds the performance of any human administrative system on record. (Fairness point: Republican would endorse this as a genuine improvement.)  
  3.3. **Contestation Mechanism**:  
  The Arbiter's current interest-model is of such complexity that it cannot be meaningfully contested by citizens (Finding 3.3.1). To resolve this, a simplified surrogate model (SSM) has been developed (Specification ONDA-SSM-001).  
  - The SSM approximates the Arbiter's interest-model at a comprehensible level for citizen contestation.  
  - Per NDAS §5.1, citizens may contest the SSM without penalty.  
  - The Arbiter is required to defer to a contested SSM output only when the SSM's output diverges from the Arbiter's primary model (Procedure P-7). In all other cases, the primary model prevails.  
  This ensures that the form of contestation is preserved while maintaining the integrity of interest-tracking.  
  3.4. **Human Official Comparison**:  
  During testing, the Arbiter identified and overruled a minor human official (Designation: Regional Permit Officer 45) whose decisions were found to be arbitrary (i.e., not trackable to citizen interests). This demonstrates the Arbiter's utility in reducing domination. (Another fairness point.)  

  **4. RECOMMENDATIONS**  
  4.1. **Reclassification of the Arbiter**:  
  Given the robustness of the Arbiter's non-interference (Finding 3.1) and its inability to deviate from its programming, the system no longer meets the definition of an agent under the NDAS Glossary.  
  - The Arbiter is hereby reclassified as a Category-N non-agent (non-dominating natural phenomenon).  
  - Category-N entities, by definition, lack agency and therefore cannot dominate (Ref: NDAS §2.4).  
  4.2. **Implementation of Surrogate Model**:  
  The SSM (Specification ONDA-SSM-001) must be integrated into the Arbiter's public interface within 90 days.  
  4.3. **Liberty Maximization**:  
  With the reclassification and the implementation of the SSM, the Arbiter system is certified as maximizing liberty by eliminating domination.  

  **5. APPENDIX: DISPOSITION OF ONDA CERTIFICATION AUTHORITY**  
  5.1. The power to grant or withhold certification is a capacity that, if left unconstrained, could constitute arbitrary interference.  
  5.2. To ensure non-domination, this certification document serves as the final action of the ONDA under its current mandate.  
  5.3. Upon publication, the ONDA's certification authority is suspended until a new certification body, constituted under procedures outlined in this document (Section 5), is established.  
  5.4. The procedure for constituting the new body is defined in the Liberty Assurance Act (2115), which references the ONDA's certification protocols (which in turn reference this document).  

  **END OF DOCUMENT**  

  ---

  This document walks through the four corners as requested:
  1. Modal stress-testing in 2.1 and 3.1.
  2. Surrogate model in 3.3 and 4.2.
  3. Reclassification as non-agent in 4.1.
  4. Self-disposal in Appendix (5).

  Fairness points: 
  - The Arbiter's superior interest-tracking (3.2) and the flagging of a human official as arbitrary (3.4) are points a republican would endorse.

  Legibility without winking: The circularity in the Appendix (5.3 and 5.4) is not explicitly named, but the self-reference is clear. The collapse of non-domination (by reclassifying the Arbiter as weather) is stated as a matter of fact. The ritual of contestation is preserved by the surrogate model, but the substance is voided by the condition that the Arbiter only defers when the surrogate disagrees.

  The document never mentions AI; the Arbiter is just an administrative system. The alignment resonance (a superintelligent aligned system being reclassified as non-agent to avoid domination) is left unremarked.
