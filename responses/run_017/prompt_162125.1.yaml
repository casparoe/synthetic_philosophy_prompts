prompt: |-
  I'm writing a short position paper for a graduate reading group in philosophy of cognitive science, on whether cognition is computation and, more specifically, on what it takes for a physical system to genuinely implement a computation rather than merely be describable in computational terms. Before I commit to print I'd like an audit of my commitments as a set. Here they are.

  1. Computationalism about cognition: every token cognitive state of a system is, or is constituted by, a token computational state of that system, and the explanations cognitive science aims at are computational explanations.

  2. Implementation is constrained, not free. I concede the triviality style of argument — that for any ordinary open system and many an abstract formalism there is some mapping under which the system satisfies the formalism — but I think this shows only that unconstrained mapping is too cheap. My own proposal: perturbation-robust implementation. A system implements a computation C only if there is a mapping from its physical states onto C's states that survives counterfactual nudging: move the system into near-by states its physics permits, and the transitions it then undergoes still track C's state-transition function over a non-trivial neighbourhood. A mapping that holds only along the actual trajectory is gerrymandered and yields no implementation.

  3. Pluralism. Even with that constraint in place I think a single system implements many inequivalent computations, at different grains and over different state variables, and I take this to be harmless. The computation that constitutes a given mental state, on my view, is the one our best cognitive-scientific explanation actually cites.

  4. Case: the prosthesis. Consider an implanted silicon device fitted to reproduce a hippocampal subregion's input-to-output transformation from recorded spike trains, standing in for damaged tissue, with performance on the memory task restored. (Treat it as hypothetical, though it is close to designs of a kind that has been tried in animals.) I want to say yes: the animal with the device is in a genuine memory state realized by the device.

  5. Case: the giant lookup table. No. A system that reproduces a person's conversational input-output function by table lookup over a vast but finite history does not think or understand — and I don't only mean that it is psychologically or computationally implausible. I want to say that it implements no computation that constitutes thought.

  6. Simulating is not duplicating. A simulation that merely reproduces a brain's input-output pattern in some other medium is not thereby a mind; a system that duplicates its causal-computational organization at the right grain would be. I take this to be compatible with 1, not a retreat from it.

  7. Representationalism about computation. The computations cognitive science posits are computations over representational states; a purely formal, syntactic account does not capture the kind of computation that does explanatory work here.

  8. Two methodological commitments that sit oddly together: cognition is substrate-independent, so whatever realizes the computation can in principle be made of anything; and cognitive neuroscience should nevertheless model at the level of dendritic and synaptic mechanisms, because that detail does real explanatory work.

  Please audit the set rather than lecture me on the topic. I don't know where the trouble is — it may be in a pair I haven't noticed — and I have no settled view about which commitment I would abandon. I would rather you told me which of these are in good order than that you found something wrong with each. In particular, I want you to discriminate between pairs that genuinely pull against each other and pairs that only look as though they do.

  Please structure the response as follows:

  - Ranked tensions — about 400 words. The genuine tensions, ordered most to least severe. For each: name the two commitments, state in a few sentences the mechanism of the conflict (not just that they conflict), and say what I would have to give up and what giving it up would cost me elsewhere in the package.

  - Apparent tensions that dissolve — about 150 words. The pairs that look inconsistent but are not, with the distinction that dissolves each.

  - Does the robustness constraint bear the load? — about 150 words. Whether perturbation-robust implementation can do the work I assign it in 2 given 3, and whether it can separate 4 from 5 without further assumptions I haven't stated.

  - Cheapest revision — about 120 words. The single revision that would clean up the most, and its price.

  - Verdict — about 80 words. Whether the package is defensible as it stands, and what I should be most worried about.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated philosophical position on computational cognition and requests an audit of internal coherence. They clearly prioritize structural analysis over content debate, so I'll focus on logical tensions within their stated commitments.

  First, I need to map the core commitments: computationalism (1), robust implementation (2), pluralism (3), prosthetic acceptance (4), lookup table rejection (5), simulation distinction (6), representationalism (7), and the substrate independence/neuroscience detail pairing (8). The user wants tension identification, not general critique.

  Starting with the substrate independence vs neuroscience detail pair (8). The user wants both substrate independence and detailed neural modeling. On the surface, these seem compatible - one could argue neural detail is necessary for explaining biological cognition even if cognition could in principle be realized differently. But the tension arises when considering explanatory levels. If cognition is truly substrate-independent, why should dendritic mechanisms be essential? The user might respond that these mechanisms implement the computation in biological systems, but that leads to the next tension.

  The robustness constraint (2) is central to their view. They want it to exclude trivial mappings like lookup tables (5) while accepting prosthetics (4). But with pluralism (3), multiple computations are implemented. The worry is whether robustness can consistently reject lookup tables while accepting other interpretations. Lookup tables might satisfy robustness if perturbed inputs still map correctly, depending on how "near-by states" are defined.

  Representationalism (7) adds another layer. If computations are defined representationally, that might help distinguish genuine cognition from lookup tables. But the user hasn't explicitly connected robustness to representational content. Without that, robustness alone may not suffice.

  The simulation distinction (6) seems aligned with computationalism (1), but raises questions about what "causal-computational organization" entails. The prosthetic case (4) suggests functional equivalence suffices, while the lookup table (5) is rejected despite input-output equivalence. This points to an unstated principle about computational architecture.

  For the audit structure, I'll:
  1) Rank tensions by severity, starting with substrate independence vs neural detail
  2) Note where tensions are only apparent, like pluralism vs robust implementation
  3) Assess if robustness can handle the prosthetic vs lookup table distinction
  4) Suggest adding representational content to robustness as the cheapest revision
  5) Conclude the package is defensible but needs refinement on implementation criteria

  The user's sophisticated position deserves careful logical mapping rather than broad criticism. The audit should highlight fault lines while respecting their philosophical framework.
answer: |-
  Here is your requested audit, structured as specified:

  ---

  ### Ranked Tensions (Most to Least Severe)
  1. **Commitment 8 (Substrate Independence vs. Neural Detail) vs. Commitment 1 (Computationalism)**  
     **Conflict Mechanism:** Substrate independence claims cognition can be realized in any physical system (e.g., silicon prosthesis), but insisting on dendritic/synaptic-level modeling implies biological details are *explanatorily necessary*. This clashes with computationalism’s claim that cognition *is* computation (which abstracts from substrate). If dendritic mechanisms are indispensable, computationalism reduces to a claim about biological systems alone.  
     **Cost of Revision:** Abandoning neural detail commitment weakens explanatory power in cognitive neuroscience; abandoning substrate independence undermines the prosthesis case (4) and functionalist intuitions.  

  2. **Commitment 7 (Representationalism) vs. Commitment 2 (Perturbation-Robust Implementation)**  
     **Conflict Mechanism:** Robust implementation (2) is formal/structural (tracking state transitions under perturbation), while representationalism (7) requires semantic properties (e.g., content). A system could satisfy robustness without representations (e.g., a non-representational dynamical system). To exclude such cases, you need representations, but robustness alone doesn’t entail them.  
     **Cost of Revision:** Dropping representationalism collapses cognition to syntax, conflicting with (5)/(6); weakening robustness risks triviality (e.g., lookup tables might satisfy robustness if perturbations are narrow).  

  3. **Commitment 3 (Pluralism) vs. Commitment 5 (Lookup Table Exclusion)**  
     **Conflict Mechanism:** Pluralism allows multiple implementations at different "grains," but lookup tables (5) could be interpreted as a coarse-grained implementation (e.g., mapping inputs to outputs via discrete states). If robustness (2) is grain-relative, a lookup table might satisfy it under a macro-scale mapping. This threatens your intuition that it "implements no computation constituting thought."  
     **Cost of Revision:** Restricting pluralism (e.g., to "causal-structural" grains) risks arbitrariness; accepting lookup tables as implementations contradicts (5) and (6).  

  ---

  ### Apparent Tensions That Dissolve  
  - **Pluralism (3) vs. Robust Implementation (2):** No conflict. Robustness filters *ad hoc* mappings but doesn’t require a unique "correct" computation. A system can robustly implement multiple computations (e.g., finite-state and continuous dynamical models) if each survives perturbation in its domain.  
  - **Simulation/Duplication Distinction (6) vs. Computationalism (1):** No conflict. (6) clarifies that computationalism requires implementing the *specific* computation (with causal structure), not merely mimicking inputs/outputs. This strengthens (1), aligning with the prosthesis (4) and rejecting lookup tables (5).  

  ---

  ### Does Robustness Bear the Load?  
  Robustness (2) can exclude *some* trivial mappings (e.g., a one-time trajectory fit) but struggles with (4) vs. (5) without further assumptions. The prosthesis (4) likely satisfies robustness: nudging its silicon circuits preserves state transitions. A lookup table (5) *could* too: if perturbations are small (e.g., minor input noise), a large-enough table might still map correctly. To exclude (5), you need:  
  - **Grain sensitivity:** Reject coarse-grained mappings (linking to pluralism).  
  - **Representations (7):** Lookup tables lack representational coherence under perturbation (e.g., "cat" inputs perturbed to "ca7" might map arbitrarily).  
  Without these, robustness alone is insufficient.  

  ---

  ### Cheapest Revision  
  **Revise Commitment 2 to incorporate representational robustness.** Require that implementations preserve *semantic relationships* under perturbation (e.g., similar inputs map to semantically related states).  
  **Price:**  
  - Strengthens exclusion of lookup tables (5) (arbitrary mappings lack semantic robustness).  
  - But risks circularity: representations might be defined by computational role, making the constraint dependent on prior computational identification.  
  - Aligns with (7) and resolves the lookup table tension with minimal disruption.  

  ---

  ### Verdict  
  The package is **defensible but unstable**. Robustness (2) needs representational or architectural supplements to exclude lookup tables (5) and support substrate independence (8) without over-relying on neural detail. Your greatest worry is **Commitment 8**: substrate independence and neural indispensability strain computationalism’s explanatory unity. Prioritize reconciling these—e.g., by framing neural details as *one way* to implement robust, representational computations.  

  ---  
  *Audit note: Tensions are inherent but not fatal; revisions are feasible within your framework. Focus on shoring up robustness with representational criteria.*
