  Under perfect play, Fuse is a **second-player win**. Here's the reasoning:
  - The first player loses if they place their fourth mark (on move 7) without having completed three consecutive cells, which results in an immediate loss.
  - The second player can force this outcome by preventing the first player from forming three consecutive cells on moves 3 or 5 (the only moves where P1 can win, since move 1 cannot complete three cells, and move 7 causes a loss regardless).
