prompt: |-
  I'm a doctoral student in comparative economic history, and my dissertation's methods chapter has stalled on something I can't resolve from the literature itself: whether the contrastive "why" questions that organize this field are well posed at all. My own chapter asks a contrastive question about a pair nobody writes books about — why the Dutch Republic and not the Ottoman Empire, in a period where both had substantial commercial sophistication, fiscal apparatus, and long-distance shipping — and I don't want to spend three years discovering that the form of the question was doing the work. So I want a specification, not another survey.

  Write the desiderata that a contrastive historical explanation must meet to count as a satisfactory answer to a question of the form "why F rather than C?", where F is the focal case that got the outcome and C is the contrast case or class that didn't. For each desideratum, give the case or consideration that motivates it, and mark whether you take it to be non-negotiable or a preference of one methodological camp. Fix the standard of adequacy as follows: an explanation is good enough if it would be worth three years of primary-source work to test — that is, if a negative finding about it (the cause was absent in F, or it was present in C after all) would be informative rather than merely deflationary.

  Below are the candidate requirements I keep seeing asserted, which I can't sort into genuine demands and camp prejudices. Adjudicate them, add the ones I've missed, and feel free to re-cut the taxonomy — I care more about the criteria and their motivating cases than about the scoring of answers.

  1. Whether the contrast class must be a "natural" class rather than one gerrymandered to make the focal case look exceptional, and what test would distinguish the two. "Why Britain and not China?", "why north-west Europe and not the Yangzi delta?", and "why Britain and not France?" give noticeably different lists of candidate causes. If the answer to the question is unstable under re-description of the arms at coarser or finer grain, is that a defect in the question, a discovery about the outcome's causal structure, or neither?

  2. Whether an adequate explanation must be contrast-invariant — the same cause doing the work under any reasonable re-description of both arms — or whether it may be contrast-relative, in the sense of naming whatever F had that C lacked, and thereby shifting as C shifts. My suspicion is that most published answers are contrast-relative while presenting themselves as invariant, and I want to know whether that is a real failing.

  3. Symmetric counterfactual support. Must a candidate cause both (a) have been sufficiently absent in C that adding it would have produced the outcome there, and (b) have been sufficiently present in F that removing it would have prevented the outcome here? Or is one direction enough? In practice the literature almost always argues only one direction, and I want the cost of demanding both stated explicitly.

  4. Separation of the arms. In an experiment, treating one unit doesn't affect the other. In these cases the units traded with each other, borrowed each other's techniques, competed for the same bullion flows and the same colonial hinterlands, and the outcome in F plausibly depressed the outcome in C. Can a contrast be well posed when the arms are causally coupled? If not, much of this literature is answering an ill-posed question. If yes, we owe an account of what "holding C's trajectory fixed while removing F's cause" could even mean.

  5. Diachronic adequacy: must a good explanation also say why the divergence happened when it did, and not merely why it happened in F rather than C? The awkward case is the near-miss — a contrast case that appears to have had many of the hypothesized preconditions centuries earlier and still did not make the transition. Does an adequate answer have to explain the near-miss, or is the near-miss evidence that the contrast has been misdescribed?

  6. Transportability versus difference-making. Must the cause be such that instantiating it in C would have produced the outcome there, as opposed to being merely correlated with the outcome within the observed set of cases? And separately: how should we treat causes present in both arms — factors that are genuine causes of the outcome but not of the difference, and that are therefore invisible to the contrast while plausibly doing most of the causal work? I want a requirement, not a shrug.

  7. Level and integration. Explanations are offered at the level of measurable proximate factors (coalfield location, real wages, freight rates), at the level of institutions and property rights, at the level of beliefs and intellectual culture, and at the level of sheer contingency. Must an adequate answer integrate levels, or is a single-level answer acceptable if complete at its level? Is the standing demand for a "deeper" explanation a desideratum or the prejudice of the institutions camp?

  8. Whether the question is well posed at all when the outcome is a matter of degree and the arms were already on divergent trajectories before the divergence — i.e., whether the contrast presupposes a shared baseline that the evidence does not in fact supply.

  Flag any pair of desiderata you think cannot be jointly satisfied. If the list turns out to be a result — if, say, no explanation can be both stable under re-description and fine-grained enough to be worth testing, or both honest about causal coupling between the arms and usable as a contrast — say so, and say what conclusion we should draw about the question rather than about any proposed answer to it. Then, in a few lines and only to show the list has teeth, name the single desideratum that excludes the largest share of the usual families of answers (resource endowments, institutions, culture, state formation, pure contingency).
reasoning: |-
  Hmm, the user is a doctoral student in comparative economic history struggling with methodological issues in their dissertation. They're asking for clear desiderata for contrastive historical explanations, specifically for questions like "why F rather than C?" where F is the focal case and C is the contrast case.

  Looking at their candidate requirements, this is a sophisticated methodological challenge. They've identified eight key points of contention in comparative historical analysis, from defining contrast classes to dealing with causal coupling between cases. The core tension seems to be between theoretical rigor and practical research constraints - they need standards that make their 3-year archival work worthwhile.

  For desideratum 1 about natural classes, I think we need to distinguish between logical coherence and substantive significance. Cases should be comparable on relevant dimensions, not just geographically convenient. The Ottoman-Dutch comparison actually has merit here since both were early modern commercial powers.

  On contrast-invariance (point 2), I believe this is where many historical explanations stumble. Most arguments are actually contrast-relative but pretend to be universal. We should call this out as a methodological flaw - it leads to cherry-picking comparisons.

  The symmetric counterfactual requirement (point 3) is crucial but often neglected. Historians frequently argue only why F succeeded without proving C would have succeeded with the same factor. This creates false universals - the Dutch state structure might not have helped the Ottomans.

  For causally coupled cases (point 4), we can't ignore entanglement but must account for it methodologically. We should require specifying how F's success actively hindered C, beyond just correlation.

  The diachronic issue (point 5) is vital - near-misses like Song China's proto-industrialization require explanation. Divergence timing isn't optional; it's part of the causal story.

  On transportability (point 6), we must insist that causes aren't just correlated but would work in C. And we can't ignore common factors - they set the baseline from which differences matter.

  Regarding explanatory levels (point 7), single-level answers are incomplete. The coal argument fails without explaining why Britain could exploit coal while China couldn't - that's an institutional story.

  Finally, for continuous outcomes (point 8), we need to define a meaningful divergence point rather than assuming identical baselines.

  The most problematic current explanations? Resource endowment theories fail hardest on multiple fronts - they're rarely contrast-invariant, ignore transportability, and can't explain timing or near-misses. The key takeaway is that contrast questions are valid but demand more rigor than typically applied. The Ottoman-Dutch study could actually set new standards by meeting these criteria.
answer: |-
  Here is a specification of desiderata for contrastive historical explanations, grounded in methodological rigor and motivated by historical cases. I’ve adjudicated your candidate requirements, added missing ones, flagged tensions, and identified the most exclusionary criterion. The standard is **testability**: a negative finding must meaningfully advance understanding, not just invalidate a weak hypothesis.

  ---

  ### **Core Desiderata for Contrastive Explanations**  
  *(Non-negotiables marked ⚖️; methodological preferences marked ▷)*

  1. **Relevant Contrast Class**  
     - **Desideratum**: The contrast class *C* must be plausible *ex ante* as a candidate for the outcome, based on shared baseline conditions relevant to the outcome mechanism.  
     - **Motivation**: "Why Britain and not France?" (similar geography, religion) vs. "Why Britain and not the Ottoman Empire?" (divergent institutions, trade networks). The latter risks false exceptionalism if baselines (e.g., commercial sophistication) aren’t comparable.  
     - **Adjudication**: Instability under re-description signals a *defect in the question* if baselines aren’t aligned (e.g., comparing a region to an empire). Non-negotiable ⚖️.  
     - **Test**: *C* must have ≥1 shared precondition with *F* for the outcome (e.g., fiscal capacity for state-driven growth).  

  2. **Contrast-Relative Causality**  
     - **Desideratum**: The explanation must explicitly state the *difference-maker* between *F* and *C*, not a universal cause. Contrast-relativity is acceptable if bounded.  
     - **Motivation**: "Protestant ethic" explanations fail when Catholic Flanders thrived commercially; the cause is relative to Catholic France but not Flanders.  
     - **Adjudication**: Requiring invariance (e.g., "markets everywhere") is unrealistic. *Camp preference ▷* for institutionalists. **Non-negotiable ⚖️**: The cause must *vary* between *F* and *C*.  

  3. **Symmetric Counterfactual Support**  
     - **Desideratum**: A candidate cause must satisfy:  
       (a) *Presence in F*: Removing it in *F* would negate the outcome (with high probability);  
       (b) *Absence in C*: Adding it to *C* would produce the outcome (with high probability).  
     - **Motivation**: "British coal" fails (b) if adding coal to 18th-century Bengal (lacking railroads, capital) wouldn’t cause industrialization.  
     - **Adjudication**: **Non-negotiable ⚖️**. Omitting one direction risks *asymmetric* explanations (e.g., "coal caused British growth" without asking why coal didn’t help China). *Cost*: Requires deep contextual knowledge of *C*.  

  4. **Causal Decoupling Requirement**  
     - **Desideratum**: If *F* and *C* are causally linked (e.g., trade competition), the explanation must either:  
       (i) Isolate *within-period* differences unaffected by coupling, or  
       (ii) Model the interaction explicitly (e.g., "Dutch finance outcompeted Ottoman credit markets").  
     - **Motivation**: Dutch-Ottoman competition for Baltic grain routes affected both. Ignoring this conflates internal/external causes.  
     - **Adjudication**: **Non-negotiable ⚖️**. Contrasts with coupling *can* be valid but require mechanism-specific analysis. "Holding *C* fixed" means *controlling for spillovers* in the model.  

  5. **Diachronic Adequacy**  
     - **Desideratum**: The explanation must account for *timing* (why divergence occurred when it did), especially if *C* had "near-miss" preconditions earlier.  
     - **Motivation**: Song China’s 12th-c. proto-industrialization vs. 18th-c. Britain. If Song "failed" despite similar factors, the divergence timing is part of the puzzle.  
     - **Adjudication**: **Non-negotiable ⚖️**. Near-misses invalidate static comparisons; they require explaining *changed constraints* (e.g., Mongol invasions disrupting Song trajectory).  

  6. **Transportability & Difference-Making**  
     - **Desideratum**: The cause must be:  
       (i) *Transportable*: Plausibly generative in *C*’s context (not just correlated in *F*);  
       (ii) *Difference-making*: Absent in *C* despite shared background conditions.  
     - **Motivation**: "Strong property rights" in Britain vs. Ottoman *miri* land: If rights were strong in both but *differently enforced*, enforcement is the difference-maker.  
     - **Adjudication**: **Non-negotiable ⚖️** for (ii). (i) is testable via *mechanistic plausibility* in *C*’s context (e.g., could Dutch-style banks function in Istanbul?).  

  7. **Multi-Level Integration**  
     - **Desideratum**: Proximate causes (e.g., coal) must be linked to enabling conditions (e.g., property rights, capital markets). Single-level explanations are incomplete.  
     - **Motivation**: Britain’s coal mattered because of steam tech *and* patent laws *and* venture capital. Isolating one level misattributes causality.  
     - **Adjudication**: **Non-negotiable ⚖️**. The "institutions camp" demand is valid; contingency-only or resource-only answers fail symmetry (e.g., why didn’t resource-rich Spain industrialize?).  

  8. **Defined Divergence Point**  
     - **Desideratum**: The outcome must be specified as a *dichotomous threshold* (e.g., "sustained >1% GDP growth") rather than a continuum, with a justified baseline.  
     - **Motivation**: If the Dutch/Ottoman economies were *already* diverging pre-1600, contrasting "success/failure" post-1650 is flawed.  
     - **Adjudication**: **Non-negotiable ⚖️**. The contrast must identify *when* paths split and *what* constituted the outcome (e.g., "per capita wealth doubling in 50 years").  

  ---

  ### **Tensions & Trade-offs**  
  - **Irreconcilable Pair**: *Contrast-invariance* (if required) vs. *Fine-grained testability*. Invariance demands universal causes (rare in history), while testability needs concrete mechanisms. **Resolution**: Drop invariance; embrace *bounded* contrast-relativity.  
  - **Causal Coupling** vs. **Clean Comparison**: Coupling (e.g., colonial competition) can’t be ignored but invalidates "independent units" assumptions. **Resolution**: Explicitly model interactions (Desideratum 4).  

  ---

  ### **Most Exclusionary Desideratum**  
  **Symmetric Counterfactual Support** (Desideratum 3) excludes the *largest share* of existing explanations:  
  - **Resource endowments**: Fail (b) – Adding coal to Ming China without capital/labor mobility wouldn’t cause industrialization.  
  - **Institutions**: Fail if institution *X* (e.g., Parliament) existed in *C* but didn’t produce the outcome (e.g., Poland’s elective monarchy).  
  - **Culture**: Rarely tested for symmetry (e.g., "Did Ottoman merchants lack profit motives?" – evidence says no).  
  - **Contingency**: Cannot satisfy (b) by design.  

  ---

  ### **Conclusion: Is the Question Well-Posed?**  
  **Yes**, *if*:  
  - The contrast class shares defensible baselines (Desideratum 1);  
  - The divergence point/outcome is clearly defined (8);  
  - Causal coupling is addressed (4).  

  **Your Ottoman-Dutch case** is viable: Both were commercial, fiscally capable, maritime powers c. 1600–1650. Apply all desiderata, and reject any explanation failing symmetric tests (e.g., "Dutch stock markets" only matters if adding them to Istanbul *would* have changed outcomes). The form isn’t flawed – but typical answers are. Three years of archival work is justified *if* testing a hypothesis that, if falsified, would revise core assumptions (e.g., finding identical financial instruments in both, forcing institutional re-analysis).
