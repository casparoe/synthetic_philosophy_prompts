prompt: |-
  Hi — please act as an expert in philosophy of technology / STS who has also spent real time on public bodies that have to make decisions, not just write about them. Take this seriously: brainstorm two or three candidate procedures before you commit to one, and tell me briefly what you rejected and why, then give me the final version.

  Here's my situation. Last spring the city put concrete planters and bench armrests under the underpass at the end of my street, where two guys had been sleeping for about a year. My neighbour and I had a loud argument about it at a block party, somebody from the councillor's office was there, and somehow that got me appointed to our new Physical & Digital Assets Review Panel. Grand name; we're really a subcommittee of the procurement committee. We meet monthly, get through 8–10 items a sitting, each of us has maybe 20–30 minutes per item, our findings get signed off by the city solicitor and posted on a public register, and we have no budget for consultants. So: real stakes, real deadlines, no theory background on the panel (I'm the closest thing and I'm a retired lab tech), and findings have to survive being read aloud by someone who disagrees with them.

  Our remit is to attach a one-paragraph plain-language "political character finding" to every capital item and software purchase over 25k: does this artifact carry politics, what kind, and how confident are we. Basically we've been asked to operationalise the claim from Langdon Winner's 1980 Daedalus essay that artifacts can have politics — the examples our staff report leans on are the low overpasses on a parkway that keep buses out, and the mechanical tomato harvester that reshaped who could keep farming — plus the harder strand where an artifact's politics come not from anybody's intent but from the kind of social arrangement the thing needs in order to function at all. (Don't just summarise that literature at me; I need something I can run.)

  What I want is a decision procedure, in the order the questions get asked, with what counts as a sufficient answer to each, and these things marked explicitly:

  - where the procedure stops with "no finding" as opposed to "neutral" — our draft keeps conflating those two and the solicitor has already flagged it, because declaring something neutral is itself a claim that has to be defended;
  - where it hands the question to a human being because it's a values call, not a factual one;
  - which steps are judgement dressed up as procedure. Be blunt about that; I'd rather know than pretend.

  Some things our subcommittee has been going round in circles on, and I need you to either build them into the procedure or tell me to drop them:

  1. Our working draft separates three kinds: "loading" (the artifact settles a contest by design), "channeling" (it just changes the cost of a behaviour), and "latent" (no politics until the context shifts — funding dries up, a new bylaw, a different operator). I suspect the first two are the useful distinction and the third is where all our arguments are hiding.
  2. The exit test someone proposed: can the affected person avoid the artifact without giving up a public good they'd otherwise be entitled to? Seems right but I can't tell how to answer it when the answer differs by person.
  3. Nobody on this panel uses a wheelchair, sleeps outside, or drives for a living, and the politics of a thing are usually invisible to the people who don't meet it. Is there a step that fixes that, or do we just accept the blind spot and say so in the finding?
  4. Inherited and orphaned designs: half our items are a spec copied from a provincial highway manual, or a vendor's default settings, or something installed in 1974 by someone who's dead. There's no author to interrogate about intent.
  5. Maintenance and drift: a irrigation system that's only "public" while a contractor is paid to service it; a fountain that runs because a donor's money runs. Who serviced it and what it replaced both seem like they should count.
  6. Time. These things outlive the council that bought them. Should the procedure have a re-review trigger, and on what?

  Then run it on three real-ish cases and give me the actual one-paragraph findings I'd read out:

  (a) the planters and armrests under the underpass — the thing that got me onto this panel, so I have an obvious axe to grind and I need the procedure to not care;
  (b) a citywide rollout of prepaid smart water meters that shut off remotely when the credit runs out, on the vendor's default settings, with an opt-out that costs 40 dollars and a trip to city hall;
  (c) the one I'm dreading — the curb extensions and raised crosswalk our neighbourhood association got installed after a kid was hit on that corner. I knocked on doors for that. I think your procedure is going to tell me it's political too, and if it does I need to be able to say exactly why in a way that doesn't sound like I'm equating it with hostile architecture. If that's where it lands, say so plainly and write the paragraph anyway.

  Finally, and this is the part I most want: a short section on what the procedure cannot do. I already think it can't rank how bad the politics are, and can't tell us whether the politics in question are good ones, but tell me the failure modes I haven't thought of — especially the kinds of items where running the procedure faithfully will produce a confidently worded finding that's actually worthless.
reasoning: |-
  Okay, the user is on a city subcommittee that assesses the political implications of public assets and software purchases. They need a practical decision procedure rooted in STS theory but executable by non-experts under tight deadlines. Key constraints: no budget for consultants, findings must survive adversarial scrutiny, and they're struggling with conceptual gaps like distinguishing "neutral" from "no finding."

  First, I need to unpack their pain points. The panel's draft framework has three categories—loading, channeling, latent—but the user suspects latent is problematic. They're also wrestling with accessibility blindness (no lived experience on panel), inherited designs without clear intent, and temporal drift of artifacts. The exit test about avoiding artifacts without losing public goods feels ethically crucial but operationally messy.

  For the procedure, I consider three approaches then reject two:
  - A purely intent-based framework fails because so many designs are inherited or orphaned.
  - A consequentialist flowchart would require impact data they don't have time to collect.
  - The winner is a modified affordance analysis: focus on what the artifact materially invites/inhibits, then assess if that distribution of capabilities serves contested public values.

  Key design choices:
  - "No finding" replaces "neutral" when evidence is inconclusive—avoids false objectivity.
  - Mandatory context mapping step forces consideration of marginalized users even if panel lacks representation.
  - Maintenance/ownership gets its own question because infrastructure politics often hide in service contracts.
  - Latent category is scrapped; what they called "latent" becomes "context-dependent channeling" with lower confidence ratings.

  For the test cases:
  1. The hostile architecture case (planters) will clearly show exclusionary loading. Need to phrase findings to avoid moral equivalence with safety improvements.
  2. Smart water meters' auto-shutoff is tricky—default settings create barriers for poor residents, but is that loading or channeling? The exit test reveals coercion: avoiding it means losing water access.
  3. Curb extensions are political too (prioritizing pedestrian safety over driver convenience) but must frame as democratically contested rather than exclusionary.

  Biggest failure modes:
  - Artifacts with distributed agency (e.g., algorithmic systems) may produce false negatives because politics emerge from use, not design.
  - They can't evaluate justice—only surface whose values are embedded.
  - Time-lapse effects: today's safety feature could be tomorrow's barrier. Procedure flags this but can't predict.

  Procedure leans hard on transparency about uncertainty. When in doubt, findings will say "we can't determine" instead of forcing a call. That's the tradeoff for robustness.
answer: |-
  Here’s a decision procedure designed for your panel’s constraints. It’s grounded in STS theory but stripped to operational essentials, with explicit guardrails for pitfalls you’ve encountered. I’ll first outline rejected approaches, then the final procedure, test cases, and critical limitations.

  **Rejected Candidate Procedures**  
  1. *Intent-Focused Framework*:  
     - **Structure**: Start with "Was there explicit political intent in design?" then assess effects.  
     - **Rejected**: Fails on inherited/orphaned designs (Issue #4) and ignores emergent politics (e.g., maintenance drift in #5). Over-relies on unavailable historical records.  

  2. *Consequentialist Scoring*:  
     - **Structure**: Score artifacts on predefined axes (access, equity, autonomy) and flag if thresholds breached.  
     - **Rejected**: Requires subjective weighting of values (Issue #2) and data collection beyond your capacity. Vulnerable to "neutral" conflation when scores are middling.  

  ---

  ### **Final Decision Procedure: 6-Step Affordance & Exclusion Test**  
  *Philosophy: Politics arise from* **what the artifact materially permits/requires** *and* **who bears the cost of those constraints**. *Builds on Winner, Akrich, and Star.*  

  1. **Baseline Affordance Mapping**  
     - *Question*: What behaviors does this artifact *enable* or *inhibit* by design? (e.g., armrests *enable* seated rest but *inhibit* lying down).  
     - *Sufficiency*: List ≥3 material interactions. If unclear (e.g., vague software specs), **stop → "No Finding"**.  
     - *Judgment*: Technical but requires inferring capabilities from specs/photos.  

  2. **Contextual Exclusion Check**  
     - *Question*: Does inhibiting a behavior block access to a **public good** (shelter, water, transit, safety) for any group? Use census data or advocacy group inputs (e.g., "wheelchair users cannot use this").  
     - *Sufficiency*: If no public good is blocked → **"Channeling"** (changes costs but not core access). Else proceed.  
     - *Judgment*: Defines "public good" (handled in Step 3). **Fix for blind spots (Issue #3)**: Require 1+ dissenting perspective (e.g., email a disability org) or cite known disparities.  

  3. **Exit Test Application**  
     - *Question*: Can a negatively affected person avoid the artifact *without surrendering a public good* they’re entitled to? (e.g., avoiding armrests = surrendering shelter).  
     - *Sufficiency*:  
       - If **no exit** → **"Loading"** (artifact imposes political settlement).  
       - If **exit exists** but has high costs (time, money, effort) → **"Channeling"**.  
       - *Values call*: "Entitlement" defined by city charters/laws (e.g., water access).  

  4. **Orphan/Maintenance Test**  
     - *Question*: Is the politics inherited (e.g., provincial spec) or dependent on sustained resources (e.g., donor-funded service)?  
     - *Sufficiency*:  
       - Inherited: Note provenance but assess current effect (e.g., "Highway spec designed for cars, not pedestrians").  
       - Resource-dependent: Flag as **"Conditional Loading/Channeling"** (e.g., "Politics active only while maintained").  

  5. **Confidence Rating**  
     - **High**: Consistent evidence (e.g., manuals confirm intent, exclusion observed).  
     - **Medium**: Indirect evidence (e.g., analogous cases, user complaints).  
     - **Low**: Speculative (e.g., "may exclude if context changes"). **Replaces "Latent"** (Issue #1).  

  6. **Time Horizon Note**  
     - *Mandatory boilerplate*: "Politics may shift with maintenance, policy, or use. Re-review triggered if: (a) 5+ years pass, (b) servicing lapses, (c) major user complaint."  

  ---

  ### **Test Case Findings (1-Paragraph Format)**  
  *(a) Underpass Planters & Armrests*  
  > "**Loading (High Confidence)**. The design inhibits lying down, blocking access to overnight shelter—a public good for unhoused persons. No viable exit exists without surrendering shelter. Effects persist regardless of intent (e.g., if installed for 'beautification'). Recommend re-review if homelessness policy changes."  

  *(b) Prepaid Smart Water Meters*  
  > "**Loading (Medium Confidence)**. Default remote shutoff inhibits continuous water access when credit lapses. Low-income residents (unable to pay $40/time to opt-out) surrender a public good (water) if avoiding the system. Vendor settings shift payment burden disproportionately. Confidence medium pending data on opt-out uptake. Re-review if affordability programs expand."  

  *(c) Raised Crosswalk & Curb Extensions*  
  > "**Channeling (High Confidence)**. The design inhibits high-speed vehicle turns, prioritizing pedestrian safety. Drivers bear time costs, but all retain access to public goods (safety/transit). Politics reflect democratic neighborhood advocacy. Not exclusionary: pedestrians (including wheelchair users) gain net accessibility. Re-review if traffic patterns shift."  
  > *— Note: Distinction from hostile architecture is that safety features *expand* access; hostile designs *remove* it without alternatives.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Judge Morality**: It flags *that* politics exist, not whether they’re "good." Safety features (crosswalks) and exclusions (armrests) both have politics—but different justifications.  
  2. **Handle Emergent Systems**: Artifacts with AI/adaptive features (e.g., predictive policing software) may shift politics post-deployment. Procedure captures design *intent*, not real-time behavior.  
  3. **Quantify Harm**: It identifies exclusion but can’t rank severity. A $40 opt-out fee *is* political, but not equivalent to life-threatening exclusion.  
  4. **Resolve Value Conflicts**: When "public goods" clash (e.g., safety vs. affordable water), the panel must transparently state which good they prioritized (Step 3 values call).  
  5. **Predict Future Contexts**: "Conditional" ratings (Step 4) flag but don’t model how politics might evolve (e.g., if water becomes unaffordable).  
  6. **Worthless Findings Trap**: Fails on **overly vague artifacts** (e.g., "AI for traffic management" without specs → "No Finding") or **universal infrastructure** (e.g., standard sewer pipes → likely "No Finding" unless data shows exclusion).  

  **Critical Failure Mode**: The procedure will generate **false negatives on "neutral" artifacts** when exclusion is normalized (e.g., a standard stair-only entrance). Step 2 forces confrontation with exclusion data—but if disparities are ignored, findings become technocratic cover. Mitigation: Require dissent (Step 2) and document all evidence gaps.  

  This balances rigor and feasibility. It forces explicit value judgments, avoids "neutral" claims, and withstands adversarial reading by anchoring in material constraints and public goods. Run your next draft through it and stress-test.
