  The user identifies three key legal doctrines where sunk costs matter: reliance damages in contract breach, promissory estoppel, and part performance in land contracts. They want to understand the philosophical presuppositions behind this. I appreciate how they've already anticipated counterarguments like the forward-looking disposition theory - this shows they're not just superficially criticizing the legal approach.

  What makes this challenging is the multi-layered nature of the request. The user wants: (1) the implicit theory of reasons reconstructed (2) distinction between presupposition vs compatibility (3) their cost-honoring vs cost-regarding taxonomy applied (4) the dispositional theory tested (5) hypothetical reform consequences (6) and finally, a substantive debate about whether sunk costs can constitute value.

  The user seems frustrated that their internalized rationalist principle clashes with actual legal practice. There's an underlying meta-question here about whether rationality should describe ideal agents or govern social institutions. The legal doctrines suggest that for social coordination, honoring sunk costs might be necessary even if individually irrational.

  On the dispositional theory point: while clever, it may not fully explain why law compensates specific reliance rather than just incentivizing general trust. The compensation occurs after breach when the disposition can't affect future behavior anymore. That timing matters.

  For the constitutive goods argument, I think the user is onto something profound about how legal institutions shape value. The law doesn't just recognize promises - it helps constitute promissory relationships through doctrines like estoppel. But I should be careful not to romanticize this; the fallacy charge remains serious.

  The user's taxonomy is helpful but might need refinement. "Cost-honoring" could be subdivided: is the cost itself reason-giving, or does it create new reasons (like vulnerability)? The latter seems more defensible.

  When reconstructing the implicit theory, I should emphasize how contract law treats reliance as creating vulnerability that demands rectification - a distinctly backward-looking moral logic. This contrasts with the rationalist focus on isolated decisions.

  For the thought experiment about abolishing reliance claims: the user intuitively understands this would destroy informal promising but wants it argued rigorously. We'd need to distinguish between perfect rational actors (who might still coordinate) and real humans (where trust would collapse).

  The depth of this query suggests the user might be writing something academic. I'll maintain precision while avoiding jargon where possible. They deserve equally nuanced responses to each sub-question without collapsing distinctions.
answer: |-
  Here is a reconstruction of the implicit theory of reasons and rationality underlying contract law's reliance doctrines, addressing your specific questions:

  ### 1. Presupposition vs. Compatibility
  - **Strict Presupposition**: Contract law *presupposes* genuine retrospective reasons. The fact that a promisee *has already* incurred costs or changed their position in reasonable reliance creates a moral/legal obligation for the promisor that did not fully exist before the reliance occurred. This obligation arises from the promisor's responsibility for the promisee's *actual worsened state*, not merely as an incentive device.
  - **Compatibility with Forward-Looking Views?**  
    The practice is *compatible* with a constrained forward-looking view only if that view incorporates:
    - **Rule-Consequentialism**: A general rule enforcing reliance-based claims incentivizes trustworthy promising and efficient reliance, producing better long-term social outcomes.
    - **Valuing Reliance as a Proxy**: Past expenditure is a measurable proxy for the *disutility* or *opportunity cost* inflicted by breach, which *is* forward-looking (preventing future harm).
  - **Underdetermination**: The *same legal rules* could be justified by:
    - **Retrospective Corrective Justice**: The promisor must repair the harm they wrongfully caused.
    - **Ex Ante Efficiency**: The rules optimize investment in reliance and promissory trust.
    - **Relational Contract Theory**: Promises create interdependent relationships; reliance deepens this bond, triggering duties.

  ### 2. Cost-Honoring vs. Cost-Regarding
  - **Promissory Estoppel & Part Performance**: **Cost-Honoring**. The incurred cost (or forgone opportunity) itself generates the entitlement. The promisee’s *act of relying* transforms the moral/legal landscape. A promise without reliance is a "bare promise" with no remedy; reliance makes it enforceable. This is not merely evidential.
  - **Reliance Damages in Contract**: **Hybrid**, but leans **Cost-Honoring**. While capped by expectation (a forward-looking limit), the *trigger* for recovery is the sunk cost. The claimant recovers *because* they spent money, not just because expectation damages are hard to prove. The "worsened position" is constitutive.
  - **Conclusion**: The doctrines are *cost-honoring* in their trigger mechanism. The law treats the sunk cost as a fact that *creates* a new reason for obligation, not just evidence of harm.

  ### 3. Testing the Dispositional Theory
  - **The Move**: Honoring sunk costs is rational at the *dispositional level* because it signals trustworthiness, enabling cooperation.
  - **Does This Work for Law?** **Partially, but incompletely**:
    - **Strengths**: The law *does* incentivize promisors to be reliable, encouraging beneficial reliance. A legal system that enforces reliance makes cooperative projects viable.
    - **Weaknesses**: 
      - The dispositional theory explains *why society has the rule*, but not why *this claimant* recovers *these specific costs*. The law remedies *actual past harm* to *this individual*, not just to incentivize future dispositions.
      - Recovery occurs *after breach*, when the "disposition" has failed. The remedy is backward-looking repair, not forward-looking signaling.
  - **Presupposition vs. Sunk-Cost Rule**: The law **presupposes more** than your original sunk-cost rule (which denies past costs as reasons for *individual actions*). It treats past costs as creating *new obligations for others* (promisors). The dispositional theory shows the sunk-cost rule was always about *individual action rationality*, while contract law is about *social obligation* arising from interdependent actions.

  ### 4. Rebuilding Doctrine Around Expectation-Only
  - **Changes Required**:
    - **Abolish Reliance Damages**: Claimants could only recover lost profits (expectation), not wasted expenditure. This harms those who relied on unprofitable promises (e.g., a contractor who builds a factory for a deal that would have lost money – they get *nothing*).
    - **Eliminate Promissory Estoppel**: Gratuitous promises would never become enforceable via reliance. Charitable pledges, family promises, etc., could be broken with impunity.
    - **Undermine Part Performance**: Oral land agreements could be reneged even after the promisee improved the property.
  - **Consequences**:
    - **Promissory Estoppel Collapses**: Without reliance as a basis for enforcement, informal promises become legally inert. 
    - **Informal Promising Becomes Unusable**: Rational actors would avoid relying on non-bargain promises, destroying social trust in informal commitments.
    - **Cost to Forward-Looking Theorist**: A purely expectation-based system would:
      - **Discourage Efficient Reliance**: Parties would under-invest in reliance for fear of unrecoverable losses.
      - **Increase Transaction Costs**: More formal contracts would be needed for trivial promises.
      - **Undermine Relational Contracts**: Many cooperative ventures (e.g., joint projects without formal terms) would collapse.

  ### 5. The Defensible Core: Projects, Relationships, and Constituted Goods
  **Argument For a Defensible Core (Honoring Sunk Costs):**  
  - **Constitutive Value of Investment**: The cost of sustaining a project or relationship *contributes to its meaning*. Abandoning a project after heavy investment isn’t just inefficient—it negates the sacrifice that gave it value (e.g., a community center built by volunteers).  
  - **Moral Encumbrance**: Sunk costs create *duties to others*. When someone relies on you, your past promise combined with their reliance generates a duty of non-abandonment. The cost *embodies* trust.  
  - **Law as Recognizing Social Reality**: Contract law acknowledges that promises + reliance create a *new normative state*. To ignore the sunk cost is to deny the moral weight of the promisee’s vulnerability.  

  **Argument Against (Fallacy in Better Costume):**  
  - **Confusing Cost with Value**: A costly project isn’t valuable *because* it’s costly. Throwing more resources at a failing endeavor because "we’ve come this far" remains irrational. The rationalist rule prevents this.  
  - **Moral Distortion**: Basing obligations solely on reliance risks "moral blackmail" (e.g., extravagant reliance forcing enforcement of a reckless promise).  
  - **Law’s Safeguards Prove the Point**: The law caps reliance damages at expectation *because* it recognizes that sunk costs alone shouldn’t create windfalls.  

  **Adjudication**:  
  The **core insight** is defensible: **Reliance transforms promises into moral relationships**. The sunk cost isn’t a reason to *continue a failing project* (the rationalist concern), but it *is* a reason for the *promisor to repair harm they caused*. The fallacy applies to *individual project continuation*; contract law addresses *interpersonal obligation*. The legal pattern reveals that **sunk costs create vulnerability, and rectifying that vulnerability is a backward-looking moral imperative**. The rationalist rule flattens this by reducing all decisions to forward-looking utility.  

  ### Conclusion
  Contract law presupposes a **relational theory of promising**: Promises become morally/legally weighty when they induce reasonable reliance, creating duties to prevent or repair harm. This relies on retrospective reasons—the fact of reliance *constitutes* the wrong of breach. While compatible with rule-consequentialism, the doctrines are fundamentally cost-*honoring*. Abolishing them would cripple informal cooperation. The defensible core is that **reliance-based obligations recognize the interlocking agency of promisor and promisee**; bracketing sunk costs ignores how shared investments and vulnerabilities constitute social goods. The rationalist rule remains valid for *individual project decisions*, but contract law governs *social repair*.
