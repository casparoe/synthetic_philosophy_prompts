answer: |-
  *(Racz leans back in his creaking swivel chair, fingers steepled, gazing not at the archivist but at a faint coffee stain on the Formica table. He speaks slowly, the words settling like dust.)*

  Ah, the third time. Let us take your very example, the one you've thrown down like a gauntlet. Last Tuesday, Mrs. Gable came in, distraught. Her nephew, you recall? He’d taken money from her purse again. The third time. Now, your principle – ‘a third transgression aggravates the wrong’ – would see that repetition as salient, yes? A pattern demanding severity. But consider: what if the first time he was eight, terrified his mother would be evicted? The second, he was sixteen, strung out on a friend’s pills, desperate? And this third time, he is forty-two, gambling away his inheritance? Is the repetition the salient feature? Or is it the shift from terrified child, to addicted adolescent, to feckless middle age? The pattern exists, certainly. But does the *repetition itself* add weight? Or does it merely frame the evolution of his *character*, which is what we judge? The ‘third time’ isn’t a static property; it’s a hinge in a narrative, and its weight depends entirely on *which* narrative it hinges.

  *(He picks up a stray paperclip, bending it absently.)*

  You speak of the letter arriving ‘too late to matter’. Too late for *what*? To mend a quarrel? To accept an inheritance? To stop a wedding? The salience of ‘lateness’ vanishes without the concrete purpose it thwarted. Is a letter declaring love ‘too late’ if received after the beloved’s death? Morally poignant, perhaps, but does it constitute a *wrong*? Only if we know the sender’s duty, the recipient’s need – concrete things, rooted in *that* relationship, *that* promise. Lateness isn’t a free-floating moral atom; it derives its force from the specific expectations it dashes. Your craft *records* the pattern, brilliantly. But the pattern doesn’t *decide* the case. The archivist who confuses the catalogue for the judgment… well.

  *(He taps the bent paperclip on the table, a soft, rhythmic click.)*

  You accuse me of smuggling principles behind ‘salience’. But salience isn’t dictated *by* a principle; it’s perceived *in* the case, guided by the tacit knowledge of what matters *here*, knowledge honed by seeing countless *other* cases. It’s like… recognizing a face in a crowd. You don’t apply a rule about nose length or eye spacing; you see a whole constellation of features, and the resemblance *strikes* you. The ‘measure’ isn’t a ruler; it’s a capacity for perception, refined by experience. Yes, we call it ‘a relapse’, ‘a return’. These are labels of recognition, not legislative definitions. They summarize, they remind, they help us *find* the relevant past cases. But the justification for condemning *this* relapse lies in the specific wreckage *this* person caused *this* time, understood against the backdrop of what they knew, what they owed, what promises their past actions had implicitly made.

  *(He lets the paperclip fall, a tiny metallic clatter.)*

  As for your novelist… Dostoevsky didn’t write ‘Crime and Punishment’ to illustrate the principle ‘Murder is wrong’. He showed us Raskolnikov’s *particular* mind, *his* justifications, *his* unraveling. The power lies in the suffocating particularity of that garret, that axe, that pawnbroker’s eye. The novelist *uses* patterns – of guilt, of consequence – precisely because we recognize them *from life*, not because they are abstract rules. But the novel’s moral force comes from showing how the pattern crushes *this specific soul*. The pattern illuminates; it doesn’t adjudicate. Your archivist sees patterns; I see the lives that bled onto the paper. The difference isn't in the data; it's in where we think the *reason* resides. Shall I continue? Stop? The next filing trolley seems imminent.
