prompt: |-
  I'm in a philosophy of biology seminar this term, and our final paper is meant to be a position piece on the units of selection. Before I commit any of this to prose I'd like the position itself audited, because I have assembled it out of claims that are each, I think, individually defensible, and I have a nagging suspicion that they don't all fit together. Here is the set, roughly as I would defend it.

  (1) I want to separate the question of which entities are the interactors, that is, the things whose properties actually covary with reproductive output in a given population, from the question of which entities are the beneficiaries, the things whose interests the adaptations in question serve. A lot of the acrimony in this literature looks to me like these two questions being run together.

  (2) Genes are the replicators: they are what gets copied with enough fidelity for cumulative selection to build anything. Organisms and most groups are not replicators in that sense, so even where the organism is the interactor, the answer to the beneficiary question is the gene.

  (3) The gene's-eye or inclusive-fitness framework and the multi-level framework are alternative decompositions of the same change in the same population: whatever you can derive with within-group and between-group components you can also derive with relatedness coefficients and costs and benefits, and the other way around. So where the two camps are fighting, the fight is about bookkeeping, about which decomposition is more tractable for the case at hand, not about which one is true.

  (4) At the same time I want to make a substantive claim about the major transitions. When replicating molecules get bundled into cells, or cells into multicellular organisms, or when solitary insects give rise to colonies with sterile castes, what has happened is that selection has shifted from acting predominantly within collectives to acting predominantly on collectives, and that is a real change in how evolution proceeds, not a change in which description we find convenient.

  (5) A case verdict: in meiotic drive, where a genetic element sabotages the gametes carrying its homologue and thereby spreads despite lowering the fertility of the organisms that carry it, I want to say the element is an adaptation for its own spread, and I resist describing this as a conflict between levels. The organism is the vehicle and the vehicle is being exploited; nothing is being selected at the level of the organism against the gene.

  (6) A case verdict: where a host and an obligate bacterial symbiont are transmitted together strictly through the maternal line, and the host builds specialised structures to house and feed it, I am happy to say the association is a unit of selection and that those structures are adaptations for the association. This does not feel to me like it contradicts (2), though I may be fooling myself.

  (7) Another case verdict: cytoplasmic male sterility, where a maternally transmitted organelle mutation shuts down pollen production in a plant and nuclear restorer genes evolve in response, I do want to describe as a genuine conflict between levels. Here I think the gene-level redescription loses something important, unlike in (5).

  (8) Finally, a methodological commitment: I hold an etiological notion of adaptation, on which what makes a trait an adaptation is what cumulative selection built it for rather than what it currently does. That is why I think claims about group adaptation stand or fall on whether group-level selection actually did the building, and why I think such claims succeed rarely, mainly in the neighbourhood of the transitions in (4).

  What I want is an audit rather than a survey or a miniature textbook chapter. Go through the set and tell me which pairs genuinely pull against each other and which only look as though they do, since I'd rather you discriminated than flagged everything at the same volume. For the real tensions, order them by how much damage they do to the package as a whole, and for each one say what I would have to give up and what giving it up would cost me elsewhere in the set. If there is a single revision that resolves more than one of them at once, say so, and say what it commits me to. I am not attached to any particular item, so please don't soften the verdicts on my behalf.

  One epistemic request: as you go, please mark which of the claims you rely on are things people who actually work on this agree about and which are live disputes. I have a bad habit of writing that everyone accepts something when what I mean is that one prominent formulation of it struck me as elegant, and I would like to know which of (1) through (8) are on firmer ground than I have assumed.

  And one formatting request: no headings, no bullet points, no bold text, no tables. Continuous prose, the way you would write an email to a colleague, and tighter rather than longer.
reasoning: |-
  Okay, the user is in a philosophy of biology seminar and needs an audit of their position on units of selection. They've listed eight claims and want to know if they're consistent. They're worried that while each point might be defensible on its own, together they might not fit. 

  First, I need to understand their main arguments. They separate interactors from beneficiaries, with genes as replicators and beneficiaries. They see the gene's-eye view and multi-level selection as equivalent decompositions. Major transitions involve a real shift in selection levels. Then there are case verdicts: meiotic drive isn't a conflict, symbiosis is a unit, cytoplasmic sterility is a conflict. They also commit to an etiological notion of adaptation.

  The user wants an audit, not a summary. I should identify tensions between the points, rank them by severity, suggest fixes, and note which claims are consensus vs. disputed. They want continuous prose, no markdown.

  Looking at the claims, the biggest tension is between (2) and (6). Claim (2) says genes are the beneficiaries, but (6) says a host-symbiont association can be a unit of selection. This directly challenges the gene as sole beneficiary. If the association is a unit, it might be a beneficiary too. This is a major conflict in their framework.

  Next, (3) and (7) clash. Claim (3) says gene's-eye and multi-level are equivalent, just different bookkeeping. But (7) calls cytoplasmic sterility a "genuine conflict" where gene-level redescription loses something. If they're equivalent, how can one lose something? This undercuts (3)'s equivalence claim.

  Another tension is between (4) and (2). Major transitions involve a shift to selection on collectives, but (2) says genes remain the beneficiaries. If selection acts on collectives, shouldn't they be beneficiaries? This needs clarification on what "beneficiary" means.

  For consensus: (1) is accepted by many, though some might bundle interactor/beneficiary. (3)'s equivalence is widely endorsed by theorists. (8)'s etiological adaptation is standard. (5) on meiotic drive as gene-level selection is uncontroversial.

  Disputed areas: (2) is Dawkins-style, but critics argue it downplays higher-level adaptations. (6) and (7) depend on definitions, with debates about when associations become units. (4) is central to major transitions theory, but the "real change" claim might be debated if selection is always multi-level.

  To resolve the big tension between (2) and (6), the user could adjust "beneficiary." Maybe genes are replicators, but beneficiaries can vary. Or clarify that in transitions, the collective becomes the beneficiary. This might also help with (4). For (3) and (7), they could argue that while mathematically equivalent, one decomposition is more explanatory in some cases, preserving equivalence but allowing for pragmatic differences.

  Overall, the user has a coherent Dawkins-inspired view but needs to address the beneficiary issue and the equivalence vs. explanatory loss point. Adjusting the beneficiary concept and allowing for explanatory preferences without denying equivalence could strengthen their position.
answer: |-
  Here is an audit of your position set, focusing on internal tensions, their severity, potential resolutions, and the epistemic status of the claims. I'll proceed point by point, flagging tensions where they arise, ordered by how damaging they are to the overall coherence. Consensus vs. dispute is noted parenthetically where relevant.

  The most severe tension exists between **(2)** and **(6)**. (2) firmly states that genes are *the* beneficiaries ("the answer to the beneficiary question is the gene"). (6) asserts that a host-symbiont association transmitted maternally is a "unit of selection" and that host structures are adaptations *for the association*. If the association itself is a unit of selection (implying it is an interactor *and* potentially a beneficiary of its own adaptations), and its adaptations serve its persistence/replication, this directly challenges the claim that genes are *always* the sole beneficiaries. (6) implies the *association* is a beneficiary. This isn't just a change in interactor; it suggests a potential shift in beneficiary during evolutionary transitions, conflicting with (2)'s universal claim. Resolving this requires modifying either (2) or (6). Giving up (2)'s universal beneficiary claim (allowing beneficiaries to shift during transitions) costs you Dawkinsian purity but better accommodates (4) and (6). Insisting genes remain the beneficiary in (6) forces you to see the association's "adaptation" as ultimately serving the *host's nuclear genes* (via association fitness), which feels strained and arguably contradicts the spirit of declaring the *association* the unit. (Note: (2) is heavily disputed – many reject the gene as sole beneficiary. (6)'s status depends on precise definitions of "unit of selection" and is debated, though such systems are classic test cases.)

  A significant tension arises between **(3)** and **(7)**. (3) asserts the strict mathematical equivalence of gene/individual and multi-level selection decompositions. (7) claims that for cytoplasmic male sterility (CMS), the gene-level redescription "loses something important" compared to the multi-level conflict description. This directly contradicts (3). If the decompositions are truly equivalent formalisms describing the *same* evolutionary change, neither should "lose" empirical content; they are just different perspectives. Claiming the gene-level view loses something in (7) implies (3) is false for this case – that the multi-level description captures an *additional* reality. Resolving this requires abandoning either the strict equivalence in (3) or the claim of loss in (7). Abandoning strict equivalence in (3) (admitting multi-level descriptions can sometimes capture causal structure more perspicuously, even if formally re-describable) allows you to keep (7). Abandoning (7) (insisting the gene-level view fully captures CMS) preserves (3) but forces you to describe the conflict purely in terms of gene transmission biases and costs/benefits, which you feel loses explanatory power. (Note: (3)'s core equivalence is widely endorsed *by theorists* as a mathematical fact. (7)'s feeling that gene-level descriptions lose something in conflict cases is common but reflects a philosophical stance about explanation, not a disagreement about the math.)

  A less severe but important tension exists between **(4)** and **(2)**. (4) describes a "real change" in how evolution proceeds during major transitions: selection shifts from acting *within* collectives to acting *on* collectives. (2) maintains that despite this shift, genes remain the *beneficiaries*. This raises a question: if selection is now acting predominantly *on* the collective (interactor), shaping its adaptations, and the collective's persistence/replication is the target of selection, isn't the collective *itself* a beneficiary of these adaptations? (4) strongly suggests the collective becomes a higher-level Darwinian individual. Resolving this requires clarifying "beneficiary." If beneficiary strictly means "replicator," (2) holds, but "serving the interests of the gene" becomes abstract (genes "benefit" via propagation *through* the collective's success). If beneficiary means "entity whose persistence/replication is directly promoted by the adaptation," then (4) implies beneficiaries *can* shift to the collective level during transitions, requiring modification of (2). (Note: (4) is core to major transitions theory, widely accepted. The beneficiary implication is a live philosophical debate.)

  Tension also arises between **(1)** and your application in **(5) & (7)**. (1) separates interactor (vehicle) and beneficiary. (5) (meiotic drive) correctly identifies the gene as replicator/beneficiary and the organism as interactor/vehicle being exploited. You resist calling it a conflict between levels because no selection *for* organismic interests opposes the gene. (7) (CMS) *does* describe a conflict between levels (organelle vs. nuclear genes, arguably cell/organism level). However, applying (1) strictly, in CMS: the *cytoplasmic gene* is a replicator (maternally transmitted) and beneficiary (spreads by sterilizing males); the *nuclear restorer* is a replicator and beneficiary (spreads by restoring male fertility); the *organism* is the interactor/vehicle. The conflict is between *two genetic replicators* with differing transmission pathways, exploiting the same vehicle – conceptually similar to (5). Claiming (7) is a "genuine conflict between levels" while (5) is not seems inconsistent under (1). Resolving this requires either: a) Reclassifying CMS as fundamentally a conflict between genetic replicators (like meiotic drive), not "levels," contradicting (7); or b) Refining "levels" to account for *types* of replicators (e.g., uniparental vs. biparental) and their integration within a vehicle, allowing genuine multi-replicator conflicts within a vehicle to constitute a level conflict, which preserves (7) but requires a nuanced definition of "level." (Note: Distinguishing inter-replicator conflicts within a vehicle vs. conflicts between vehicle levels is a subtle and debated point.)

  **Epistemic Grounding:**

  *   **Broadly Accepted:** Core ideas in (1) (separating interactor/replicator) are foundational (Dawkins, Hull). (3)'s *mathematical equivalence* is consensus among theorists (Gardner, Grafen frameworks). (5) is uncontroversial as gene-level selection. (8) is the standard etiological view of adaptation. Major transitions (4) are a core paradigm.
  *   **Actively Disputed:** (2) (Genes as *sole* beneficiaries) is heavily contested (Gould, Lloyd, Okasha argue for higher-level beneficiaries/adaptations). (6) (Association as unit/beneficiary) is a key point of contention – critics argue it's still selection on host genes. (7) (Gene-level loss in CMS) reflects a philosophical stance about explanation, not settled science. The *interpretation* of the interactor/replicator distinction in complex cases (like symbioses or conflicts) is debated.

  **Resolution Path:**

  The single most damaging tension is (2) vs. (6). A powerful revision resolving *this* and alleviating (2) vs. (4) and strengthening coherence is: **Modify your concept of "Beneficiary."** Instead of universally declaring genes the beneficiary, define beneficiary as *the entity whose evolutionary persistence/replication is directly promoted by the adaptation*. This allows:
  *   Genes to be beneficiaries in standard organismal selection (meiotic drive, CMS nuclear restorers).
  *   The host-symbiont association (in vertical transmission) to be the beneficiary of *its own* adaptations (6).
  *   The newly evolved collective to be the beneficiary during/after major transitions (4).
  *   Preserving (1)'s separation (interactor = immediate selective interface, beneficiary = whose "interest" the adaptation serves).
  *   Clarifying (5) vs. (7): In (5), the gene is beneficiary exploiting the vehicle. In (7), the cytoplasmic gene is beneficiary exploiting the vehicle *against* the beneficiary interest of the nuclear genes (and the vehicle). It remains a conflict between replicators *within* a vehicle, but the "level" language in (7) becomes less essential or needs careful definition (e.g., conflict between genomic compartments with different inheritance).

  This revision costs you the clean, universal gene-centricity of (2), committing you to a pluralism about beneficiaries contingent on the evolved Darwinian individuality at stake. It aligns better with (4), (6), and (8), and reduces the tension with (7). It retains the core replicator concept while acknowledging that beneficiaries can emerge at higher levels of organization during transitions. The tension between (3) and (7) remains, requiring you to either drop the "loses something" claim in (7) or refine (3) to acknowledge pragmatic/explanatory differences despite formal equivalence. The (1) vs. (5)/(7) tension is resolved by consistently seeing conflicts as primarily between replicators within vehicles.

  This position is now a sophisticated, transition-aware pluralism: replicators are fundamental, interactors vary, and beneficiaries depend on the level of functional organization that the adaptation directly serves.
