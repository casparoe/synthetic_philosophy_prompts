prompt: |-
  i write a lot of incident reviews at work and i keep running into a thing i dont have a word for.

  Example one: a writeup said the cause of an outage was "no timeout was set on the downstream call" — an absence, not an event. But the same absence showed up six months earlier in another review as "we should add a timeout", filed under recommendations, not causes. Nothing physical changed between the two, just who was on the hook for that service. Example two: everyone agrees "nobody reverted the bad deploy" was a cause, but "nobody was in the office that day" and "no asteroid hit the rack" are not, even though all three are things that didn't happen and all three would have made a difference. And in the meetings the line between cause and background condition slides depending on whether its an SRE review or a product one.

  We hacked around it: our template now requires every cause line to be an event that actually happened, and the non-happenings go in a separate "gaps" column. It works fine in practice but it feels like its hiding something rather than fixing it.

  A friend said philosophers talk about causation by omission, but as far as i can tell that literature is mostly arguing about whether a not-doing can be a cause at all. That's not my puzzle. My puzzle is the picking: why some absences get promoted to causes once a role or an expectation gets attached to them, and why which ones count can change while the world stays exactly the same.

  Is there a name for that picking part? If there is, i want the carving, not just the label: what exactly the thing is, what nearby things it isn't, and where the edges are. If there isn't, say so honestly and give me a name and a definition i could actually put in a doc, plus what would and wouldnt count. No reading lists please, i just want to know what im looking at.
reasoning: |-
  Okay, the user is dealing with a nuanced problem in incident reviews. They've noticed that some absences are labeled as causes while others aren't, and this distinction seems to shift based on context like who's responsible or the type of review. They've implemented a workaround by separating events from "gaps," but they feel this is just avoiding the issue rather than solving it. 

  First, I need to pinpoint exactly what they're asking for. They're not questioning whether omissions can be causes—they've already read about causation by omission. Instead, they want to understand why certain absences get elevated to causes when there's an attached responsibility or expectation, and why this classification changes without any physical changes in the world. 

  The user mentioned examples like "no timeout set" being a cause in one review but a recommendation in another, and distinctions between "nobody reverted the deploy" (cause) versus "nobody was in the office" (not cause). The crux is the selective promotion of absences based on roles or expectations. 

  I recall that in philosophy, there's a concept related to this: normative expectations. When an absence violates a duty or an expected norm, it's treated differently. For instance, if someone is supposed to set a timeout and doesn't, that absence becomes a cause because it breaches an obligation. But "no asteroid hit" isn't expected, so it's just background. 

  The term "normative anchor" comes to mind. It's the idea that the expectation (like a role, policy, or standard) acts as an anchor that turns an absence into a notable omission. This seems to fit what the user is describing. 

  I should make sure this term is accessible. The user doesn't want theory—just a practical concept they can use in docs. So defining it clearly: a normative anchor is the explicit or implicit expectation that makes an absence count as a cause. The edges are: if there's a clear duty (like a team responsible for timeouts), the absence is anchored. If not (like asteroids), it's not. 

  Also, the user wants to know what this concept excludes. It's not about all omissions, only those tied to norms. And it's not fixed—it can change with context, like shifting responsibilities in SRE vs. product reviews. 

  I’ll structure the response by naming the concept, defining it plainly, explaining its edges, and giving examples that match their incidents. No jargon, just actionable clarity. They’ll need this to refine their incident review template without feeling like they’re hiding the real issue.
answer: |-
  Here's the precise concept you're grappling with, carved and labeled for practical use:

  **The Concept: Normative Anchoring of Omissions**

  **What it is:**
  The selection of *which* absences/omissions ("non-happenings") are elevated to the status of "cause" in an incident review is fundamentally determined by **violated expectations, duties, or norms**. An absence becomes a "cause" when it breaches an explicit or implicit standard of what *should* have been present or done. The "anchor" is the norm itself. This explains why the *same physical absence* can shift between "cause" and "background" based solely on who is responsible or what meeting context (SRE vs. Product) defines the relevant norms.

  **Why this name?**
  *   **Normative:** Relates to rules, standards, expectations, or "oughts" (what *should* be).
  *   **Anchoring:** The norm acts as the fixed point that determines whether an omission is significant enough to be labeled a cause. The omission is "anchored" to a breach of expectation.
  *   **Omissions:** The specific type of absence (lack of action, missing safeguard, etc.).

  **The Carving (Edges & Boundaries):**

  1.  **The Core Mechanism:**
      *   **Causal Omission:** "No timeout set," "Nobody reverted the deploy." *Why?* There exists a clear, relevant expectation: "Timeouts *should* be set on downstream calls," "Someone *should* be monitoring and able to revert bad deploys." The absence violates a specific, operational norm.
      *   **Background Condition:** "No asteroid hit," "Nobody was in the office." *Why?* While their absence was necessary for the incident (if an asteroid hit, the incident might be worse/different), there is **no violated norm or reasonable expectation**. We don't *expect* asteroids not to hit (it's pure luck), and "someone should always be physically in the office 24/7" isn't a universal operational norm (especially post-COVID). These are facts of the environment, not breaches of duty.

  2.  **What Changes When the World Doesn't? The Normative Context:**
      *   **Responsibility Shift (Your Example 1):** Six months ago, the team owning the service *didn't have the norm established* that timeouts were mandatory. "Add a timeout" was a *recommendation* to *create* a new norm. Later, when another team owned it (or the norm became accepted), the absence *violated the now-established norm*, making it a cause.
      *   **Meeting Context Shift (SRE vs. Product):**
          *   **SRE Review:** Focuses on operational reliability norms. "No timeout" violates an SRE best practice norm → **Cause**. "Product decision prevented adding monitoring" might be a background constraint.
          *   **Product Review:** Focuses on product requirements, user impact, and business process norms. "No timeout" might be a technical symptom. "Product requirement forced an unstable API integration without contingency planning" violates a product/business process norm → **Cause**.

  3.  **Key Edges (What it ISN'T):**
      *   **NOT just "Could it have prevented it?":** Both "no timeout" and "no asteroid" *could* have prevented it if changed. This is necessary but not sufficient. The *normative breach* is the differentiator.
      *   **NOT about Physical Change:** As you observed, the physical world is identical. The change is purely in the *attribution of responsibility* and the *activation of a specific norm*.
      *   **NOT about Blame (Necessarily):** While often correlated, normative anchoring can highlight *systemic* norm failures (e.g., "no process existed for X") without pointing at an individual.
      *   **NOT Subjective Whim:** It relies on *shared or defined* norms within the relevant context (team, role, company practice, industry standard). It's contextual, not arbitrary.
      *   **NOT "All Omissions":** It specifically isolates *which omissions matter as causes* based on norm violation.

  **Practical Definition for Your Docs:**

  > **Normative Anchoring of Causes:** Within incident reviews, an omission (something absent or not done) is classified as a primary "cause" only if it violates an explicit or strongly implied operational standard, duty, or expectation relevant to the context of the review. Background conditions are omissions where no such norm exists or applies. *This explains why the classification of an omission can change based on shifting responsibilities or review perspectives, even when the underlying facts remain identical.*

  **Examples Using Your Template & This Concept:**

  *   **Cause (Event):** "The deployment script executed the flawed code change." (Actual event)
  *   **Gap (Normatively Anchored Omission):** "A timeout configuration was absent on the downstream call, violating Service Standard REL-005." (Absence + Norm Violation)
  *   **Gap (Normatively Anchored Omission):** "The on-call engineer's attempt to revert the deploy failed due to lack of documented rollback procedure, violating Incident Response Policy IRP-102." (Absence + Norm Violation)
  *   **Background Condition:** "No engineers were physically present in the primary office location." (Absence, but no violated norm - remote work is permitted)
  *   **Background Condition:** "The third-party API experienced unexpected latency spikes." (Event, but outside direct control/normative scope for *this* review context)
  *   **Background Condition:** "No cosmic ray bit-flip occurred on the database server." (Absence, but no norm exists to prevent cosmic rays)

  **Why your "gaps" column works but feels like hiding:** It correctly separates events from omissions, but doesn't explicitly capture *why* some omissions are more critical (gaps) than others (background). Adding the **violated norm/expectation** to the "gaps" description (e.g., "...violating Standard X", "...contrary to documented procedure Y") directly addresses the "normative anchoring" and makes the selection rationale transparent. This moves you from *hiding* the ambiguity to *exposing and explaining* the reasoning behind the classification.
