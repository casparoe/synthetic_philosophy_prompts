  ### Skolem's Town

  We built a model, countable and sound,  
  Its elements are gathered, one and all,  
  *The registry: no pairing function found.*  

  Yet from without, a surveyor on the ground  
  Can number every object, great and small,  
  The surveyor's roll: a listing, clear and sound.  

  The townsfolk know their set is not renowned  
  For countability; within the wall,  
  *The registry: no pairing function found.*  

  The missing piece? A function to expound  
  The correspondence, lost within the hall—  
  The surveyor's roll: a listing, clear and sound.  

  The model's truth is bounded and earthbound;  
  What falls inside, it must install:  
  *The registry: no pairing function found.*  

  But we who judge—do we stand free, unbound?  
  Or are we, too, within some count's thrall?  
  *The registry: no pairing function found,*  
  The surveyor's roll: a listing, clear and sound.  

  ---

  **Note for handout:**  
  The *italic refrain* reflects the model's internal perspective: its registry certifies that a particular set has no pairing function with natural numbers, making it "uncountable" inside the model. The roman refrain reflects the external perspective: a surveyor enumerates that same set. What is missing *inside* is not an element but the pairing function itself, which exists only externally. This is Skolem's paradox: relativity in countability without contradiction.
