  First, I need to identify the core issues they mentioned. The students keep conflating offensive-to-hear, derogatory-toward-target, and actual harm. The user gave examples like a slur yelled in an empty room or used by someone without credibility. So, one key criterion must separate these three aspects. Also, distinguishing slurs from ordinary pejoratives like 'idiot' and generic insults is crucial. The embedding behavior—like negation or conditionals—where slurs still offend unlike descriptive predicates, is another critical point.

  The user also provided weird cases to test theories. The conlang example with a made-up February slur that isn't offensive challenges theories that rely solely on conventional meaning. A slur with an unidentifiable target that still offends speaks to historical embeddedness. The dubbing scenario where a different slur is substituted introduces off-target offense. Non-intentional cases like parrots or autocomplete test if speaker intent is necessary. Out-group self-application and reclaimability variability add layers to how slurs function in different contexts.

  I should structure the desiderata into non-negotiable (common ground) and negotiable (camp-specific) criteria. Non-negotiables include offensiveness without targeting, offense persistence under embedding, and derogation without speaker intent. Historical embeddedness and reclaimability might be negotiable since some theories might not prioritize them.

  The embedding criterion (Embedding Resilience) seems to eliminate many theories. Truth-conditional approaches that treat slurs as descriptive content plus attitude struggle because embedding the attitude component should neutralize it, but it doesn't. This is a strong point against descriptivist accounts.

  Assessing joint satisfiability, the combination of Historical Embeddedness and Conventionality might be tricky. If offensiveness is purely conventional, how does history play a role? But maybe theories can handle both by seeing conventions as historically formed. Reclaimability adds another layer, as it requires the derogation to be defeasible, which might conflict with theories that see the offense as immutable.

  The user's deeper needs include avoiding classroom chaos by clarifying criteria upfront. They want to prevent students from mixing different offense types and ensure theories are tested beyond standard examples. Providing a scorecard helps them compare theories efficiently during teaching. They also need to know if the criteria are internally consistent to avoid contradictions later.

  Including the weird cases ensures theories are robust. For example, the conlang example tests if mere derogatory intent is sufficient. The dubbing case checks if off-target offense is accounted for. Non-intentional cases challenge theories requiring speaker meaning. Addressing these strengthens the desiderata's comprehensiveness.

  Finally, the scorecard should succinctly show how each theory family meets the criteria. Highlighting where they fail (like descriptivism on embedding) helps the TA guide discussions. Emphasizing the eliminative power of Embedding Resilience prepares them to address common theory weaknesses. Pointing out potential tensions between Historical Embeddedness and Conventionality prepares them for deeper theoretical debates.
answer: |-
  Here’s a comprehensive desiderata list for theories of slurs, designed to anchor your seminar discussions. I’ve organized it by core criteria, flagged negotiable vs. non-negotiable items, highlighted key tensions, and included a scorecard for major theories. Weird cases are integrated throughout.

  ---

  ### **Core Desiderata for Slur Theories**  
  *(Non-negotiables = NN; Negotiable/Camp-dependent = N)*  

  1.  **Offensiveness Without Targeting (NN)**  
      *Case:* Slurs yelled into an empty room, overheard in recordings, or produced by parrots/autocomplete still offend.  
      *Requirement:* Explain offense **detached from speaker intent or a present target**. Theories cannot require a hearer to believe the speaker endorses the slur or that a target is addressed.  
      *Weird Case #4:* Parrots/screen readers offend despite zero intentions.  

  2.  **Derogation ≠ Descriptive Content (NN)**  
      *Case:* Swapping a slur (e.g., "k*ke") for its neutral counterpart ("Jewish person") in *any utterance* removes derogation, even if the speaker sneers.  
      *Requirement:* The derogatory force must be **non-detachable** from the slur itself (unlike descriptive pejoratives like "idiot" + sneer).  

  3.  **Embedding Resilience (NN)**  
      *Case:* "Is X a ___?", "If X is a ___, then...", "No one here is a ___" still offend, unlike "idiot" in the same contexts.  
      *Requirement:* Derogation persists under **negation, questions, modals, and attitude reports**. Rules out theories treating slurs as simple conjuncts ("is Jewish and despicable").  

  4.  **Offense/Harm Asymmetry (NN)**  
      *Case:* A slur can be offensive to hear (e.g., causing discomfort) without being derogatory *toward a target* (e.g., used in a linguistics example) or causing measurable harm (e.g., uttered by an infant). Conversely, neutral words can be used to sneer harmfully.  
      *Requirement:* Distinguish:  
      - *Offense-to-hear* (contextual, hearer-focused)  
      - *Derogation-toward-target* (group-focused, conventional)  
      - *Actual harm* (societal, downstream effects).  
      *Weird Case:* A slur used by someone with zero credibility (e.g., a known liar) may still offend but cause little harm.  

  5.  **Group-Specificity vs. Ambiguity (N)**  
      *Case:* Some slurs have contested targets (e.g., "g*psy" applied variably to Roma, Irish Travellers, or bohemians).  
      *Requirement:* Explain how targeting works when group membership is ambiguous or disputed. *Negotiable:* Whether this is semantic or pragmatic.  

  6.  **Historical Embeddedness (N)**  
      *Case:* Archaic slurs (e.g., racial slurs from 1800s recordings) still offend modern listeners, even if the target group is forgotten (#2) or the term is obsolete.  
      *Requirement:* Explain why **historical context is non-negotiable for real slurs** but absent in the conlang case (#1).  
      *Weird Case #1:* The conlang "February-born" slur *lacks* this history → no offense, despite identical intent/use.  

  7.  **Conventionality (NN)**  
      *Case:* Slurs offend because they *conventionally* express contempt for a group, not just speaker attitude (contrast "cow" used pejoratively).  
      *Requirement:* Derogation must be **encoded in the language system**, not derived purely from speaker meaning.  

  8.  **Out-Group Self-Application (NN)**  
      *Case:* "I was being such a [slur against own group]" (e.g., "I was such a b*tch") feels taboo, awkward, or ironic—distinct from reclamation.  
      *Requirement:* Explain why this usage is **not reclamation** and often remains offensive.  

  9.  **Reclaimability Variability (N)**  
      *Case:* Some slurs (e.g., "queer") are reclaimed; others (e.g., racial slurs) resist it. Some are reclaimed by subgroups but not others (e.g., "dyke").  
      *Requirement:* Either predict factors enabling reclamation (power, in-group solidarity) or acknowledge it as a sociohistorical process outside semantics.  

  10. **Off-Target Offense (NN)**  
      *Case (#3):* Dubbing a slur against Group A with a slur against Group B offends Group B, who weren’t targeted in the original scene.  
      *Requirement:* Explain offense directed **at groups unrelated to the original context**.  

  ---

  ### **Key Tensions & Eliminators**  
  - **Most Eliminative Criterion:** **#3 (Embedding Resilience)**. Eliminates naive descriptivist/truth-conditional accounts (e.g., slurs as "descriptive content + contempt") and some prohibitionist views.  
  - **Jointly Unsatisfiable?** **#6 (Historical Embeddedness)** + **#7 (Conventionality)** + **#9 (Reclaimability)** create tension:  
    - If offense is *purely* conventional (#7), why does history matter (#6)?  
    - If offense is immutable (#7), how can reclamation (#9) work?  
    *Resolution:* Most theories treat conventions as historically constituted *and* defeasible (e.g., via reclamation). No fatal contradiction, but requires nuance.  

  ---

  ### **Theory Scorecard**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partial)*  

  | **Criterion**               | **Descr./Truth-Cond.** | **Sem. Expressivist** | **Conv. Implicature** | **Prohibitionist** |  
  |-----------------------------|------------------------|------------------------|------------------------|---------------------|  
  | 1. Offense w/o targeting    | ✗                      | ✓                      | ~                      | ✓                   |  
  | 2. Derogation ≠ descriptive | ✗                      | ✓                      | ✓                      | ✓                   |  
  | 3. Embedding resilience     | ✗                      | ✓                      | ✓                      | ~¹                  |  
  | 4. Offense/Harm asymmetry   | ✓                      | ✓                      | ✓                      | ✗²                  |  
  | 6. Historical embeddedness  | ~³                     | ✓                      | ~³                     | ✓                   |  
  | 7. Conventionality          | ~                      | ✓                      | ✓                      | ✓                   |  
  | 8. Out-group self-appl.     | ✗                      | ✓                      | ~                      | ✓                   |  
  | 10. Off-target offense      | ✗                      | ✓                      | ✓                      | ✓                   |  

  **Notes:**  
  ¹ Prohibitionism often ignores embeddings (treats all uses as equally toxic).  
  ² Often conflates offense with harm.  
  ³ Descriptivism/CI can *add* historical parameters but don’t build them in.  

  ---

  ### **Recommendations for Your Unit**  
  1. **Start by separating offense types** (#4). Use the "empty room" vs. "sneering neutral term" cases to force clarity.  
  2. **Stress Embedding Resilience (#3)** as the litmus test—it filters weak theories immediately.  
  3. **Leverage weird cases early**:  
     - Conlang (#1) refutes "intent is sufficient" views.  
     - Dubbing (#3) refutes "target-group-only" accounts.  
     - Parrot (#4) refutes intentionalist theories.  
  4. **Flag reclaimability (#9) as sociohistorical**, not purely semantic. Most theories only explain *how* slurs derogate, not why some lose force.  
  5. **Clarify the goal**: A theory must explain the **conventionalized derogation** lost in neutral substitution, not adjudicate "harm."  

  This list avoids smuggling in *all* camp assumptions (e.g., it doesn’t require truth-conditional content or speaker-centric pragmatics), focusing on data even the most minimalist theory must address. No contradictions—just productive tensions around history/convention/reclamation. Good luck!
