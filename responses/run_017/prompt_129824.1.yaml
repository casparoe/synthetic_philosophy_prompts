answer: |-
  ### Trading Game Design: "Evidence in the Market"

  **Materials and Setup**  
  - **Asset Value**: Either $100 (state H) or $0 (state L).  
  - **Signal Structure**: Two urns (physically present):  
    - **Urn H** (if state H): 12 green balls, 6 red balls.  
    - **Urn L** (if state L): 6 green balls, 12 red balls.  
  - **Participants**: 22 students (all traders). 4 randomly pre-selected as "users" (non-informational traders) for Round 3.  
  - **Signals**: Each student draws one ball from the state urn (kept private). Green ball suggests H (P(H|G) = 2/3), red suggests L (P(H|R) = 1/3).  
  - **Communication Protocol**: Three permitted sentences for trading rounds: "I want to trade," "I don’t want to trade," "I am a user."  
  - **Tools**: Whiteboard (track trades/aggregates), index cards (user assignments), dice (determine state).  
  - **Payoffs**: **Strictly proper scoring rule** (quadratic) on final probability report for state H. Max 1000 points → 2% of course grade (avoids risk aversion, emphasizes beliefs).  

  **Rounds** (Each 10-12 mins; state fixed throughout)  
  1. **Round 1: Baseline Trade (Private Decisions)**  
     - Pair students randomly (11 pairs). Assign buyer/seller roles randomly.  
     - Fixed price: $50.  
     - Traders privately decide to trade or not (no communication). Trade occurs only if both agree.  
     - *Goal*: Observe speculative trade (Green buyers/Red sellers trade).  

  2. **Round 2: Public Willingness (Coarse Communication)**  
     - Re-pair students. Same roles/price.  
     - **New rule**: Before trading, each must announce one of: "I want to trade" or "I don’t want to trade" to their partner (simultaneous, public within pair).  
     - After seeing partner’s announcement, decide whether to trade.  
     - *Goal*: Trade collapses (willingness is evidence against your signal; e.g., seller’s "want to trade" suggests Red signal → buyer infers bad news).  

  3. **Round 3: Non-Informational Motive ("Users")**  
     - Re-pair students. Assign 4 pre-selected "users" (2 buyers, 2 sellers).  
     - **User rule**: User buyers value asset at $60 (always want to buy at $50). User sellers value at $60 (never sell at $50).  
     - **Communication**: All can use all three sentences (including "I am a user").  
     - After announcements, decide to trade.  
     - *Goal*: Trade resumes when users are involved (e.g., non-user seller + user buyer trade; "want to trade" now signals user status, not information).  

  4. **Round 4: Costly Information Acquisition**  
     - Re-pair students. No users. Same as Round 2, but:  
     - **New rule**: Before announcements, any student may buy a second signal (cost: 50 points). Draw another ball from the same urn.  
     - *Goal*: Few buy signals (updating from partner’s willingness dominates; acquisition cost > benefit).  

  **Minute-by-Minute Timeline**  
  - **0-5 mins**: Setup. Roll die for state (1-3: H, 4-6: L). Draw balls from urn (students keep signals private). Explain scoring (belief report → points → 2% grade).  
  - **5-20 mins**: **Round 1**. Conduct trades. Record # trades on whiteboard.  
  - **20-32 mins**: **Round 2**. Announcements → decisions. Track # trades (expect drop).  
  - **32-47 mins**: **Round 3**. Assign users. Announcements → decisions. Track trades (expect revival with users).  
  - **47-60 mins**: **Round 4**. Offer signal purchase → announcements → decisions. Track acquisitions/trades.  
  - **60-70 mins**: Belief reports. Students submit probability (0-100%) of state H.  
  - **70-75 mins**: Reveal state, debrief.  

  **Debrief Table and Questions**  
  | **Round** | **Observed Moment** | **Concept Unpacked** |  
  |-----------|---------------------|----------------------|  
  | Round 1   | Trades occur (Green buyers + Red sellers) | Speculative trade based on private signals |  
  | Round 2   | Trade collapses after announcements | Willingness to trade = evidence against your signal ("no-trade" insight) |  
  | Round 3   | Trade resumes with "users" | Trade constrained by motives (non-informational vs. informational) |  
  | Round 4   | Few buy signals; trade minimal | Information acquisition unrewarding (willingness already informative) |  

  **Opening Questions**:  
  1. *"In Round 2, when you saw your partner wanted to trade, how did that change your belief about the asset? Why did that kill most trades?"*  
  2. *"In Round 3, how did ‘I am a user’ change what you inferred from ‘I want to trade’?"*  
  3. *"In Round 4, why wasn’t buying a second signal worth it? What did you learn from your partner’s announcement instead?"*  

  **Hayekian Tension**:  
  - *If unraised*: "We assumed a shared prior (common urn). But Hayek argues markets work when agents *disagree* on priors/hypotheses. Does this game’s collapse depend too much on shared beliefs? Where might real markets differ?"  

  **Predictable Issues and Handling**  
  - **Not everyone behaves "theoretically"**: Highlight aggregate patterns (e.g., "In Round 2, 80% of pairs didn’t trade—why?"). Emphasize the theorem applies to expectations, not every pair.  
  - **Refusal to trade/always trade**: Note in debrief: "Some traded for non-speculative reasons (e.g., curiosity). The point is the *average* shift."  
  - **Gaming the system**: Remind students: "Your payoff depends on accurate beliefs, not trading outcomes."  
  - **Blurting signals**: Penalty: "If you reveal your signal, you lose 100 points." Enforce protocol strictly.  
  - **Wrong moral (e.g., "Trade is bad")**: Clarify: "Trade collapsed only under *shared prior* + *no other motives*. Round 3 showed trade is alive when motives differ."  

  **What the Activity Cannot Reproduce (Requires Lecture)**  
  - **Common prior assumption**: Explicitly rigged (urn); discuss why Hayekians reject this.  
  - **Iterated reasoning**: Game shows one level ("they want to trade → bad news"); lecture on higher-order beliefs.  
  - **Risk neutrality**: Scoring rule mitigates, but note real traders are risk-averse.  
  - **Price formation**: Fixed price used; lecture on winner’s curse in dynamic prices.  
  - **"No speculative trade" ≠ "no gains"**: Activity shows speculative trade vanishes, but gains exist (e.g., users in Round 3).  
  - **Zero transaction costs/perfect info**: Game ignores these; mention their real-world role.  

  **Why 2% Grade, Not Chocolate**  
  The scoring rule requires scaling (1000 points → 2%) to incentivize truthful belief reports. Chocolate would reward luck, not accuracy.  

  **Run This Thursday**: Minimal prep—use balls, index cards, whiteboard. Focus on flow: rounds build sequentially, debrief ties to Hayek.
