prompt: |-
  I run grantmaking for a foundation that gives away roughly $40 million a year across global health and economic opportunity: about sixty grants annually, six program staff, no in-house economist, and a board that must approve anything above $250,000. The board has asked us to rank proposals by cost-effectiveness in the style associated with effective altruism. I want to do that while taking the movement's critics seriously: that quantification quietly privileges whatever is easy to count, and that treating a problem as a series of individually purchasable fixes displaces the structural work that would end it.

  What I need is a procedure, not a position paper: the gates a proposal passes through in order, what counts as a sufficient answer at each gate, where the procedure returns a no, and where it stops and hands the decision to the board because the question is one of values rather than evidence. Constraints: runnable in about two hours per proposal by a program officer with no economics training, with a part-time consultant available for the numbers, and only what survives the gates reaches the board. Be explicit about which steps are judgment calls dressed as procedure, and about which distinctions from the critique you had to drop to make the thing usable.

  One device I want built in rather than argued about: each proposal is scored on two ledgers, one for effects we can count and price with a stated uncertainty range, one for effects we believe in but cannot measure, such as shifted local power, deterrence, or dignity; and the board sets, once a year and before seeing any proposals, the rate at which it is willing to trade one ledger against the other, so that unmeasured effects are neither scored at zero nor quietly rescued case by case.

  Apply the procedure to three live proposals: a $2M renewal of an unconditional cash-transfer program with randomized evidence and a cost-per-outcome estimate that survives a fragility check but does nothing about why recipients are poor; a $600k grant to a land-rights legal-empowerment group whose theory of change runs through changing how district officials behave and which has no credible comparison group; and a $900k fellowship that pays graduates to take high-earning finance jobs and donate a share of their salaries, which two board members already champion. If the procedure says no to something we currently fund and are attached to, say so plainly, and say what would have to change for it to pass. Finally, say what the procedure cannot do: which decisions it will systematically get wrong, and where an officer should overrule it.
reasoning: |-
  We are designing a grant evaluation procedure with two ledgers: one for quantifiable effects and one for unquantifiable but important effects. The board sets an exchange rate between the two ledgers annually. The procedure must be runnable in about two hours per proposal by a program officer with a part-time consultant for numbers.

  Procedure Steps:

  1. Initial Eligibility Check (Program Officer, 10 minutes)
     - Is the proposal within our funding areas (global health, economic opportunity)? 
     - Does it have a clear theory of change? 
     - Is the budget and project duration within acceptable limits? 
     - If no, reject. If yes, proceed.

  2. Quantitative Ledger Assessment (with Consultant, 60 minutes)
     - Identify primary outcome(s) that can be quantified and monetized. If none, skip to step 3 and note that the quantitative ledger will be zero (but the proposal can still proceed via the qualitative ledger).
     - Estimate the cost per unit of outcome (e.g., cost per life saved, cost per $ of income increase). 
     - Adjust for:
          a) Quality of evidence (randomized trial, quasi-experimental, pre-post, etc.) with a discount factor for weaker designs.
          b) Transferability: How applicable is the evidence to the target context? Discount if uncertain.
          c) Counterfactual: What would happen without the grant? Adjust for deadweight and displacement.
          d) Time discounting: If benefits occur in the future, discount appropriately (e.g., 3-5% per year).
     - Calculate expected quantitative impact: (Total expected outcome in units) * (monetary value per unit) / (total cost). This gives a cost-effectiveness ratio (CER) or a benefit-cost ratio (BCR). 
     - Assign an uncertainty range (e.g., 80% confidence interval) using the fragility of the evidence and other factors.
     - If the CER/BCR is below a pre-set threshold (to be determined by the board annually, e.g., $X per life saved, or a BCR of 1.5), note that the quantitative ledger is weak. But do not reject at this stage because of the qualitative ledger.

  3. Qualitative Ledger Assessment (Program Officer, 30 minutes)
     - Identify the key unquantifiable effects (e.g., shifting power dynamics, building local capacity, promoting dignity, systemic change potential). 
     - Assess the strength of the theory of change for these effects (high, medium, low confidence) and the magnitude of the effect (high, medium, low). 
     - Consider risks and unintended consequences (negative effects). 
     - Assign a qualitative score: a categorical rating (e.g., 1 to 5) or a descriptive assessment (strong, moderate, weak). 
     - Note: This step is inherently judgmental. The program officer must document the reasoning.

  4. Integration of Ledgers and Threshold Check (Program Officer, 20 minutes)
     - Combine the two ledgers using the board's pre-set exchange rate (e.g., "1 unit of qualitative score is worth $Y in quantitative impact"). 
          Example: Suppose the quantitative ledger shows a net benefit of $1.5 million (with uncertainty range) and the qualitative ledger is rated 4 out of 5. If the board has set that 1 point of qualitative score is worth $200,000, then the qualitative contribution is 4 * $200,000 = $800,000. Total adjusted benefit = $1.5M + $0.8M = $2.3M.
     - Calculate an overall cost-effectiveness: (Adjusted total benefit) / (cost). 
     - Set a minimum threshold for the overall cost-effectiveness (e.g., a BCR of 1.2) that the board sets annually. If the proposal is above the threshold, it passes to the board. If below, it is rejected unless it goes to step 5 (values check).

  5. Values and Strategic Fit Check (Program Officer, 10 minutes)
     - Even if the quantitative and qualitative scores are low, if the proposal addresses a strategic priority (e.g., a focus on a specific region or population) or a value that the foundation holds (e.g., equity, innovation), it may be sent to the board with a note that the decision is about values. 
     - Also, if the proposal is above the cost-effectiveness threshold but has significant risks or ethical concerns, it may be flagged for board consideration.

  6. Board Submission Preparation (Program Officer, 10 minutes)
     - Summarize the analysis in a one-page memo for the board, highlighting:
          - Quantitative ledger: expected impact, uncertainty, and how it was calculated.
          - Qualitative ledger: key effects and assessment.
          - Overall adjusted cost-effectiveness and how it compares to the threshold.
          - Any values or strategic considerations.

  Where the procedure returns a "no":
     - If after step 4 the overall cost-effectiveness is below the threshold and there is no compelling values/strategic reason (step 5), then reject.
     - If the proposal fails the eligibility check (step 1), reject.

  Where the procedure stops for a values decision:
     - At step 5: if the proposal is below the cost-effectiveness threshold but has a strong values/strategic case, it goes to the board for a values decision.

  Judgment calls dressed as procedure:
     - Step 3 (Qualitative Ledger) is inherently judgmental. The program officer must use their expertise and document reasons. We can provide a rubric to guide, but it remains subjective.
     - Step 2 (Quantitative Ledger) requires judgment in discounting evidence quality and transferability, though we try to standardize with factors.
     - Step 5 (Values Check) is a judgment call on what constitutes a strong enough values case.

  Distinctions from the critique we drop to make it usable:
     - We are not fully addressing the critique that quantification privileges what is easy to count because we are still separating the two ledgers and requiring quantification where possible. However, by having a qualitative ledger and an exchange rate, we try to give weight to the hard-to-count factors.
     - We are not solving the structural change critique entirely. We are allowing the qualitative ledger to capture some structural effects, but the procedure still favors interventions that can be broken down into measurable outcomes. We are not requiring every proposal to have a structural change theory, but we are allowing such proposals to score well on the qualitative ledger.

  Now, apply the procedure to the three proposals:

  Proposal 1: $2M renewal of unconditional cash transfers
  - Step 1: Eligible.
  - Step 2: 
     - Quantitative: Evidence from RCT, cost-per-outcome estimate available and passes fragility check. Let's assume the cost per dollar of benefit is $1.20 (i.e., for every $1.20 spent, $1 of income is transferred). But note: the transfer efficiency is high, and there are multiplier effects. Suppose we estimate the net benefit (after accounting for all effects) as $2.5 million (with uncertainty range of $2M to $3M). Then the BCR is 2.5/2 = 1.25.
     - Uncertainty: Low because of RCT and fragility check.
  - Step 3: 
     - Qualitative: This program does nothing about why recipients are poor. It might even have negative systemic effects (e.g., dependency). However, it provides immediate relief and dignity by allowing people to choose. We might rate the qualitative ledger as low (say 2 out of 5) because it doesn't address structures.
  - Step 4: 
     - Suppose the board set the exchange rate: 1 qualitative point = $100,000 in a $1M project? But we need a standard unit. Let's define the qualitative score in terms of a dollar equivalent for the entire project. The board might say: a score of 5 is worth $1M, 4 is $800K, 3 is $600K, 2 is $400K, 1 is $200K. Then 2 points give $400K.
     - Adjusted benefit = $2.5M (quant) + $0.4M (qual) = $2.9M. Cost=$2M. Adjusted BCR=1.45.
     - Threshold: Board sets a minimum BCR of 1.2? Then 1.45>1.2 -> pass.
  - Step 5: Not needed because above threshold.
  - Decision: Pass to board.

  Proposal 2: $600k to land-rights legal-empowerment group
  - Step 1: Eligible.
  - Step 2: 
     - Quantitative: No credible comparison group. The outcomes (e.g., changes in land titles, income) are hard to attribute. We might not be able to quantify. So quantitative ledger = $0 (with high uncertainty). 
  - Step 3:
     - Qualitative: Theory of change runs through changing officials' behavior, which could lead to systemic change. Potential for high impact on power and dignity. But risks: backlash, slow change. Rate qualitative as high: 4 out of 5? (if 5 is the best). 
  - Step 4:
     - Quantitative: $0.
     - Qualitative: 4 points -> if we use the same scale as above, that's $800K (for a $1M project? but the project is $600k). We need to standardize the qualitative score to the project size? 
          Alternatively, the board exchange rate could be set per dollar of grant: e.g., each point in qualitative score is worth $X per $100k of grant. 
          Let's assume the board set: for every $100k in grant, a qualitative point is worth $Y. Suppose they set $200,000 per point per $100k? That seems too high. Alternatively, the board sets the qualitative score as a fixed dollar amount per point regardless of project size? But that doesn't scale. 
          We need to define the exchange rate in a way that is independent of project size. How about: the qualitative score is converted to a monetary value that is then compared to the cost? 
          Let's redefine: The board sets a conversion factor: each point of qualitative score is worth a multiplier on the quantitative ledger? That complicates. 
          Alternatively, we can have the qualitative score as a stand-alone, and the board sets a minimum qualitative score for proposals with zero quantitative? 

     We must clarify the exchange rate mechanism. Let's say the board sets a rate: "We are willing to accept a quantitative ledger of $X less if the qualitative ledger is one point higher." But then we need a baseline.

     Revised approach for Step 4: 
     The board sets two thresholds:
       - A minimum quantitative BCR (say, 1.2) for proposals with low qualitative scores (e.g., 1 or 2).
       - A lower minimum quantitative BCR for higher qualitative scores (e.g., for qualitative 4 or 5, we accept a quantitative BCR as low as 0.8).

     Alternatively, they set an exchange rate that adjusts the quantitative benefit by adding a fixed dollar amount per qualitative point. But that dollar amount should be proportional to the grant size? 

     Let me propose: The board sets a "dollar value of one qualitative point per $100,000 of grant". For example, they might decide that one point is worth $50,000 per $100,000. So for a $600k grant, each point is worth $300,000. Then a score of 4 would add $1,200,000.

     Then:
       - Quantitative ledger: $0 (with high uncertainty)
       - Qualitative ledger: 4 points -> $1,200,000
       - Adjusted benefit = $0 + $1,200,000 = $1,200,000
       - Cost = $600,000
       - Adjusted BCR = 1,200,000 / 600,000 = 2.0 -> above 1.2, so pass.

     But note: the quantitative ledger is zero, and we are adding a large qualitative benefit. Is that acceptable? The board must have set the rate in a way that they are comfortable with such a scenario.

  - Step 5: Not needed.
  - Decision: Pass to board.

  Proposal 3: $900k fellowship for finance jobs and donations
  - Step 1: Eligible.
  - Step 2:
     - Quantitative: The outcome is the donations from the fellows. Let's say the fellowship selects 30 fellows. Each fellow is expected to earn high salaries and donate 10% for 10 years. The present value of donations might be $5 million (with uncertainty: some drop out, some earn less). But we must subtract the counterfactual: without the fellowship, some might have gone into finance anyway and donated. Assume only 20% would have without the program. So the net additional donations = $5M * 80% = $4M. The cost is $900k. Then BCR = 4M / 0.9M ≈ 4.44. 
     - However, we must also consider the opportunity cost of the fellows: they might have done other good. But this is hard. Assume the BCR is 4.44 (with a wide uncertainty because of long time horizon and many assumptions).
  - Step 3:
     - Qualitative: This might have negative qualitative effects: it might reinforce a system that the foundation sees as problematic (finance industry), and it might be seen as elitist. The positive: it might build a culture of giving. But overall, we might rate it low: 2 out of 5? 
  - Step 4:
     - Quantitative benefit: $4,000,000
     - Qualitative: 2 points -> using the same exchange rate as above: for a $900k grant, each point is worth ($50,000 per $100k * 9) = $450,000 per point. So 2 points = $900,000.
     - Adjusted benefit = $4M + $0.9M = $4.9M
     - Cost = $0.9M
     - Adjusted BCR = 4.9/0.9 ≈ 5.44 -> above 1.2, pass.
  - Step 5: Not needed.
  - Decision: Pass to board.

  But note: we are attached to the cash transfer and land rights, and the fellowship is new and championed by two board members. The procedure passes all three. However, if we had set a higher bar for the qualitative ledger in the land rights case, or if the fellowship had a lower quantitative BCR, it might be different.

  What if we set a threshold for the qualitative ledger? For example, if the quantitative ledger is zero, the qualitative score must be at least 4? In the land rights case, it was 4 so it passed.

  Now, what if the procedure says no to something we currently fund? We must be willing to drop it. For example, if an existing grant had a low quantitative BCR and a low qualitative score, it would be rejected.

  What would have to change for a proposal to pass that currently fails? For example, if the cash transfer program had a lower BCR (say 1.0) and a qualitative score of 2, then the adjusted BCR would be 1.0 + (2 * $200,000)/$2M = 1.0 + 0.2 = 1.2 (if we use $200,000 per point for a $1M grant? for $2M, we need to scale). We must be consistent in the exchange rate. Alternatively, if the qualitative score were higher, it might pass.

  What the procedure cannot do:
     - It cannot capture complex system dynamics and unintended consequences fully.
     - It may undervalue structural change because the quantitative ledger often requires measurable outcomes that are more common in direct interventions.
     - It relies on the board setting a reasonable exchange rate and thresholds. If the exchange rate is set too low, it undervalues qualitative effects; if too high, it risks funding ineffective programs.
     - It may be gamed by overpromising on qualitative effects.
     - It may be too rigid for innovative or high-risk, high-reward proposals that are hard to quantify.

  Where an officer should overrule:
     - If there is a clear error in the analysis (e.g., wrong data used).
     - If there is new, critical information that the procedure didn't capture (e.g., a scandal about the grantee).
     - If the proposal is a strategic fit that the board has prioritized, even if the numbers are weak (but then it goes to step 5 and the board decides).

  Final note: The procedure is a tool to inform, not replace, judgment. The board still makes the final decision, but the procedure ensures a consistent and transparent process.
answer: |-
  ### Grant Evaluation Procedure for Cost-Effectiveness with Dual Ledger System  
  **Goal:** Rank proposals by cost-effectiveness while balancing quantifiable impacts and structural/unmeasurable effects. The board pre-sets an exchange rate (e.g., "$X in quantitative benefits = 1 unit of qualitative impact") annually.  

  #### Procedure Steps (Total Time: ≤2 Hours/Proposal)  
  1. **Gate 1: Feasibility & Alignment Check** (Program Officer: 15 min)  
     - **Question:** Does the proposal fit foundation priorities, have a coherent theory of change, and avoid red flags (e.g., ethical risks, implementation infeasibility)?  
     - **Sufficient Answer:** Yes/no with brief rationale.  
     - **Outcome:** "No" → Reject. "Yes" → Proceed.  
     - *Judgment Call:* "Coherent theory of change" is subjective; officer uses experience.  

  2. **Gate 2: Quantitative Ledger** (Program Officer + Consultant: 45 min)  
     - **Question:** What is the expected monetized impact per dollar, accounting for uncertainty?  
     - **Sufficient Answer:**  
       - Identify primary outcome (e.g., lives saved, income increase).  
       - Calculate cost per outcome using evidence (e.g., RCT, quasi-experimental).  
       - Apply discount factors:  
         - Evidence quality (RCT = 1.0; observational = 0.5; anecdotal = 0.1).  
         - Transferability (high similarity = 1.0; low = 0.7).  
         - Fragility: Test with ±20% outcome change; if cost-effectiveness flips to negative, flag.  
       - Monetize outcome (e.g., $150k/life saved in LMICs).  
       - Output: Range (e.g., "$0.80–$1.20 expected return per $1 spent").  
     - **Outcome:** If best-case return < $0.50 per $1 → Reject. Else → Proceed.  
     - *Judgment Call:* Discount factors are standardized but subjective; consultant arbitrates.  

  3. **Gate 3: Qualitative Ledger** (Program Officer: 30 min)  
     - **Question:** What unmeasurable benefits (e.g., dignity, systemic change) does this generate, and with what confidence?  
     - **Sufficient Answer:**  
       - Score 1–5 on:  
         - **Strength of theory** (e.g., clear causal pathway = 3–5; speculative = 1–2).  
         - **Impact depth** (e.g., shifts power dynamics = 4–5; surface-level = 1–2).  
       - Output: Single score (e.g., "3/5: Moderate confidence in systemic impact").  
     - **Outcome:** If score = 1 and quantitative ledger weak → Reject. Else → Proceed.  
     - *Judgment Call:* Scoring relies on officer’s intuition; critics’ concerns about "privileging the measurable" are partially addressed here but not resolved.  

  4. **Gate 4: Integration & Threshold Test** (Program Officer: 20 min)  
     - **Question:** Does the combined score (using board’s exchange rate) meet the foundation’s minimum cost-effectiveness threshold?  
     - **Sufficient Answer:**  
       - Convert qualitative score to monetary value (e.g., 1 unit = $100k pre-set by board).  
       - Adjusted impact = Quantitative impact + (Qualitative score × exchange rate).  
       - Cost-effectiveness ratio (CER) = Adjusted impact / Cost.  
       - Apply uncertainty: If quantitative range is wide, use conservative estimate.  
     - **Outcome:**  
       - CER ≥ 1.5 → Send to board.  
       - CER < 1.5 but qualitative score ≥4 → Send to board for "values decision."  
       - Else → Reject.  

  5. **Board Submission** (Program Officer: 10 min)  
     - Prepare memo: Quantitative ledger, qualitative score, CER, and key uncertainties.  
     - Flag if decision hinges on values vs. evidence.  

  ---  
  ### Application to Live Proposals  
  **Board Pre-Set Values:**  
  - Exchange rate: 1 qualitative unit = $100,000.  
  - Minimum CER: 1.5.  

  #### Proposal 1: $2M Unconditional Cash Transfers  
  - **Gate 1:** Pass (aligned with economic opportunity).  
  - **Gate 2:**  
    - Cost-per-outcome: $0.90–$1.10 per $1 transferred (RCT evidence, survives fragility).  
    - Monetized impact: $2.2M–$2.4M.  
  - **Gate 3:** Qualitative score = 2/5 (addresses poverty symptoms but no structural change; low systemic impact).  
  - **Gate 4:**  
    - Adjusted impact = $2.2M (conservative) + (2 × $100k) = $2.4M.  
    - CER = $2.4M / $2M = 1.2 → **Below threshold (1.5)**.  
  - **Outcome:** CER < 1.5 and qualitative score <4 → **Reject**.  
  - **To Pass:** Improve CER to ≥1.5 (e.g., lower costs) or demonstrate structural effects (e.g., advocacy component) to raise qualitative score to ≥4.  

  #### Proposal 2: $600k Land-Rights Legal Empowerment  
  - **Gate 1:** Pass (systemic focus).  
  - **Gate 2:** No comparison group → Evidence quality discount = 0.3.  
    - Estimated monetized impact: Highly uncertain ($0–$500k). Use conservative $100k.  
  - **Gate 3:** Qualitative score = 4/5 (shifts local power dynamics; high systemic potential).  
  - **Gate 4:**  
    - Adjusted impact = $100k + (4 × $100k) = $500k.  
    - CER = $500k / $600k = 0.83 → **Below threshold (1.5)**.  
  - **Outcome:** CER < 1.5 but qualitative score ≥4 → **Send to board for values decision**.  

  #### Proposal 3: $900k Fellowship for Finance Donors  
  - **Gate 1:** Pass (economic opportunity).  
  - **Gate 2:**  
    - Projected donations: $1.5M (optimistic) vs. $0.5M (conservative).  
    - Discounted: Weak evidence on counterfactual (donors might give anyway) → Use $0.7M.  
  - **Gate 3:** Qualitative score = 1/5 (reinforces inequitable systems; low systemic value).  
  - **Gate 4:**  
    - Adjusted impact = $0.7M + (1 × $100k) = $0.8M.  
    - CER = $0.8M / $0.9M = 0.89 → **Below threshold (1.5)**.  
  - **Outcome:** CER < 1.5 and qualitative score <4 → **Reject**.  
  - **To Pass:** Demonstrate broader impact (e.g., fellows reforming finance from within) to raise qualitative score to ≥4.  

  ---  
  ### What the Procedure Cannot Do  
  1. **Systematically Undervalues Structural Change:**  
     - Interventions with long-term, diffuse impacts (e.g., policy advocacy) may score poorly on quantitative ledger due to measurement challenges.  
     - *Mitigation:* Qualitative ledger partially offsets this, but officers should overrule if evidence of structural impact is strong despite low quantification.  

  2. **Biased Toward Short-Term Wins:**  
     - Projects with quick, measurable outcomes (e.g., cash transfers) favored over those with delayed benefits (e.g., education).  
     - *Mitigation:* Officers should apply higher qualitative scores to long-term bets and flag for board consideration.  

  3. **Ignores Contextual Nuance:**  
     - Local political dynamics or historical inequities may be overlooked in scoring.  
     - *Mitigation:* Officers should overrule if local expertise contradicts ledger outputs.  

  4. **Vulnerable to Gaming:**  
     - Grantees may exaggerate measurable outcomes to boost quantitative scores.  
     - *Mitigation:* Robust fragility checks and consultant review.  

  **When to Overrule:**  
  - If new evidence emerges post-review.  
  - If the proposal addresses an urgent, board-endorsed priority (e.g., crisis response).  
  - If the qualitative impact is transformative but poorly captured by the scoring (e.g., movement-building).  

  ---  
  **Final Note:** This procedure operationalizes effective altruism principles while forcing explicit trade-offs between measurable and structural impacts. It drops the critique that "quantification displaces structural work" by assigning value to both but cannot fully resolve the tension—thus the annual board-set exchange rate. By rejecting proposals like the cash transfer renewal despite attachment, it forces discipline. Yet, it remains a tool, not a substitute for wisdom; officers must retain agency to flag edge cases for human judgment.
