answer: |-
  ## Joint Statement on Perpetrator Behaviour in the Holocaust: A Situationalist-Culturalist Adversarial Collaboration

  **Preamble:**  
  This statement represents a collaborative effort between scholars holding differing interpretations of perpetrator behaviour within the Reserve Police Battalions and similar units operating in the occupied East. Our goal is to clarify points of agreement, precisely define remaining disagreements, and outline testable propositions using a hypothetical, comprehensive evidence base. We distinguish between **situational pressures** (immediate contextual factors acting upon individuals within the unit structure) and **cultural preformation** (deeply internalized cognitive models, specifically eliminationist antisemitism, acquired through prior socialization). We affirm that both frameworks seek to explain documented historical reality.

  ### 1. Agreed Claims

  Both signatories endorse the following substantive propositions:

  1.  **Refusal was possible and occurred:** A non-zero percentage of men (estimated conservatively between 10-25% in documented shooting actions) refused direct participation in killing operations when ordered, despite the presence of peer pressure and legitimate authority. Significant refusal was especially evident during the initial killing actions men faced.
  2.  **Refusal carried minimal formal sanction:** Documented instances of severe punishment (court-martial, imprisonment, execution) for refusal to kill Jews in these specific contexts are exceptionally rare. Social ostracism, career stagnation, or transfer to less desirable duties were more common, but not inevitable or universal consequences.
  3.  **Orders were necessary but not universally sufficient:** Explicit orders from recognized superiors were a necessary precondition for the large-scale killing operations undertaken by these units. However, the existence of an order alone does not fully explain the variance in individual compliance or the nature of participation.
  4.  **Situational pressure was intense:** Perpetrators operated within a context characterized by overwhelming legitimate authority (military command structure), powerful peer pressure and unit cohesion dynamics, escalating commitment after initial acts, routinization and division of labour, and the brutalizing environment of the Eastern Front and occupation regime.
  5.  **Cultural context was antisemitic:** Pre-war and wartime German society, including the institutions that socialized the men in these units (schools, youth groups, churches, media), propagated potent antisemitic stereotypes and narratives. Eliminationist antisemitism was a significant component of the Nazi ideological framework to which these men were exposed.
  6.  **Behaviour was heterogeneous:** Individual perpetrators exhibited significant variation in their actions, including levels of participation, initiative, cruelty, and later justifications. Not all men who participated did so identically, and refusal took different forms.
  7.  **Multiple factors operated simultaneously:** Historical causation in this context is complex. Situational pressures and cultural preformation interacted; they were not mutually exclusive categories in the minds or actions of historical actors.
  8.  **"Merely sufficient situation" definition:** A situation sufficient for widespread compliance, absent significant cultural preformation, would require: overwhelming and unambiguous orders from undisputed legitimate authority, severe and certain punishment for non-compliance (including death), immediate and constant supervision ensuring no evasion, and the complete absence of any alternative actions perceived as honourable or safe. We agree the historical situation fell short of this threshold, particularly regarding punishment certainty.
  9.  **"Merely sufficient cultural transmission" definition:** A cultural transmission story sufficient to explain widespread killing, absent the specific situational pressures, would require: evidence that bearers of eliminationist antisemitism actively sought out killing roles independently of orders or unit assignment, engaged in spontaneous killing without authorization, or that refusal rates were near-zero even in situations with minimal supervision or pressure. We agree the historical record does not primarily show this pattern.
  10. **"Uptake" requires explanation:** The fact that the majority of men complied with lethal orders, despite the possibility of refusal without dire punishment, demands explanation. Neither framework finds this outcome self-evident.
  11. **"Excess" requires explanation:** The documented instances of gratuitous cruelty, humiliation, and initiative beyond the strict requirements of the orders (e.g., torture, "Jew hunts," personal brutality) demand specific explanation beyond mere compliance.
  12. **Avowal is problematic evidence:** Post-hoc explanations given by perpetrators in interrogations (avowal) are unreliable indicators of contemporaneous motivation due to memory distortion, self-justification, strategic presentation, and the influence of the interrogation context itself. They are data *about* rationalization, not necessarily *of* causation.
  13. **Evidence relevance:** Relevant evidence includes individual-level data on participation (uptake, latency, excess), background characteristics (social origin, geography, pre-1933 affiliations), unit dynamics (command structure, cohesion indicators, rotation patterns), specific operational contexts, and comparative data involving differently socialized groups. Aggregate national ideology alone is insufficient.
  14. **The Order Police Personnel Corpus is pertinent:** Analysis of the hypothetical Order Police Personnel Corpus (linking home-district indicators, unit deployment/rotation, and interrogation data) and the Auxiliary Corpus (Volksdeutsche/non-Germans) provides a uniquely powerful evidence base to test core propositions of both frameworks.

  ### 2. Residual Disagreements (Formulations)

  | Crux                                                                 | Situationalist Formulation                                                                                               | Culturalist Formulation                                                                                                     | Genuine Disagreement (G) or Verbal (V)? |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------- |
  | **Primary driver of Uptake (initial compliance)**                    | Situational pressures (authority, peer pressure, careerism, fear of social shaming) were the dominant proximate triggers compelling compliance in the majority of cases. | Eliminationist antisemitism provided the fundamental motivational framework, making compliance psychologically acceptable and often "willing" in the sense of aligning with pre-existing beliefs; situational factors facilitated expression. | G                                       |
  | **Explaining Excess (gratuitous cruelty/initiative)**                | Excess cruelty often arose from situational dynamics: dehumanization through process, group conformity, alcohol use, brutalization over time, or specific command tolerance/encouragement. | Excess cruelty is a direct manifestation of the perpetrators' internalized eliminationist antisemitism, which viewed Jews as subhuman and deserving of suffering; it reveals the underlying motivation driving compliance. | G                                       |
  | **Role of Culture (Antisemitism)**                                   | Antisemitism was a pervasive background condition, a necessary permissive factor making the genocide possible, but was not the dominant *proximate* trigger or motivator for *individual* compliance in most shooting actions. | Eliminationist antisemitism was the essential *active* ingredient, the specific cognitive model that transformed situational pressures into lethal action where other coercive contexts might not have; it was causally primary for behaviour. | G                                       |
  | **Meaning of "Willing"**                                             | "Willing" participation, if used, signifies compliance without immediate physical coercion or threat of severe punishment, driven primarily by situational pressures (e.g., avoiding shame, maintaining status). It does not imply ideological enthusiasm as the dominant cause. | "Willing" participation signifies action stemming from an internalized ideological conviction (eliminationist antisemitism) that aligned the perpetrator's will with the genocidal act, making him an active agent, not just a pressured complier. Situational factors were enabling, not primary. | G (Partially rooted in definition)      |
  | **Applicability of "Ordinary"**                                      | "Ordinary" accurately describes the perpetrators' demographic profile (age, class, background) and the demonstration that men without prior violent criminality or extreme ideological screening could be induced to kill under these specific situational pressures. | "Ordinary" is misleading if it implies their behaviour was normal or explicable without reference to their specific cultural formation; the *potential* for such widespread complicity was shaped by a unique cultural context. | V (Primarily semantic focus)            |
  | **Monocausality**                                                    | The insistence on monocausal explanation (solely ideology) is empirically unsustainable given demonstrable variance in behaviour and the demonstrable power of situational pressures revealed by refusal rates and comparative contexts. | While other factors played a role, eliminationist antisemitism was the monocausal *necessary and sufficient* core without which the specific pattern of widespread, often enthusiastic, participation in genocide against Jews cannot be adequately explained. | G (Fundamental causal claim)            |
  | **Selector Mechanism**                                               | Assignment to Order Police units and specific killing commands was largely bureaucratic, based on age, fitness, availability, and manpower needs, not primarily on screening for ideological fanaticism. Antisemitism was a widespread background condition, not a specific selector. | While not the sole selector, the pervasive eliminationist antisemitism within German society and institutions meant the pool of recruits contained a high proportion of men for whom the ideology resonated, making them amenable to the task when ordered. It acted as a diffuse selector. | G (Weight & Mechanism)                  |

  ### 3. Cruxes and Tests Using the Hypothetical Corpora

  1.  **Crux: Primary Driver of Uptake vs. Role of Antisemitism in Motivation.**
      *   **Test: Invariance Test (Situation held ~constant, Antisemitism varied).** Analyze units engaged in similar types of killing actions (e.g., similar-sized ghetto liquidations, similar commanding officer style based on interrogation reports) in similar localities (e.g., small towns). Correlate *individual* uptake (did he shoot when ordered?) and *individual* measures of excess cruelty (coded from interrogations/charges) with pre-1933 home-district proxies for antisemitic mobilization (e.g., NSDAP vote share 1928-1933, membership in radical antisemitic orgs, antisemitic press circulation).
      *   **Situationalist Prediction:** Uptake rates will show weak or no correlation with home-district antisemitism proxies within similar situational contexts. High uptake will be the norm regardless of district background. Excess cruelty may show *some* correlation, reflecting personal proclivities amplified by situation.
      *   **Culturalist Prediction:** Uptake rates, and especially *levels* of excess cruelty, will show a significant positive correlation with home-district antisemitism proxies, even controlling for situational similarity. Men from high-mobilization districts will be less likely to refuse and more likely to exhibit brutality.
      *   **What moves Situationalist?** Strong, consistent correlation between uptake and antisemitism proxies across multiple similar-situational clusters would challenge the situationalist primacy for uptake. High refusal rates in low-mobilization districts despite identical situational pressure would be powerful.
      *   **What moves Culturalist?** Consistently high uptake (e.g., >85%) and similar levels/distribution of excess cruelty *regardless* of home-district antisemitism levels in matched situations would challenge the *causal necessity* of prior cultural variation for explaining the core behaviour. Low refusal rates in low-mobilization districts would be problematic.
      *   **Evidence Against Own View (Situationalist):** Clear, significant positive correlation between home-district antisemitism and uptake in multiple carefully matched situational contexts.
      *   **Evidence Against Own View (Culturalist):** Consistently high uptake and similar patterns of excess cruelty across widely varying home-district antisemitism levels within matched situational contexts; refusal rates uncorrelated with antisemitism proxies.

  2.  **Crux: Explaining Excess Cruelty.**
      *   **Test 1: Invariance Test (as above).** See above for correlation with home-district proxies within matched situations.
      *   **Test 2: Auxiliary Comparison.** Compare patterns of excess cruelty (frequency, type) between German Order Police and non-German auxiliaries (e.g., Ukrainian, Lithuanian units) documented in the Auxiliary Corpus, involved in *similar* actions (e.g., guarding during deportations, participation in shootings) under similar German command. Analyze interrogation data for justifications and descriptions of acts.
      *   **Situationalist Prediction:** Levels and types of excess cruelty will be broadly similar between Germans and auxiliaries in comparable roles/situations, driven by common situational factors (dehumanization, command tolerance, group dynamics). Differences will reflect specific unit/command cultures or brutality of the Eastern Front generally, not unique German ideology.
      *   **Culturalist Prediction:** German perpetrators will exhibit higher levels and/or specific types of gratuitous cruelty and humiliation linked to antisemitic tropes (e.g., specific forms of dehumanizing torture, sexual humiliation, "Jew hunts") compared to auxiliaries, even in similar situations. German interrogations will more frequently invoke antisemitic beliefs spontaneously.
      *   **What moves Situationalist?** Clear, systematic differences in the nature and frequency of excess cruelty favouring Germans, especially acts explicitly linked to antisemitic ideology in descriptions/perpetrator accounts, that cannot be explained by command differences or role variations.
      *   **What moves Culturalist?** Overwhelming similarity in the patterns and prevalence of excess cruelty between Germans and auxiliaries in matched roles/actions, with German accounts showing no greater frequency or ideological specificity in justifying cruelty.
      *   **Evidence Against Own View (Situationalist):** Consistent, ideologically patterned differences in excess cruelty between Germans and auxiliaries in comparable situations.
      *   **Evidence Against Own View (Culturalist):** Minimal difference in patterns of excess cruelty between Germans and auxiliaries; German avowals rarely invoke specific antisemitic motives for cruelty beyond general dehumanization common among auxiliaries.

  3.  **Crux: The Sustainment of Participation & Selector Mechanism.**
      *   **Test: Substitution Test & Longitudinal Analysis.** Using interrogation data and unit logs: (a) Analyze men who initially refused shooting: What proportion accepted non-shooting roles (cordoning, transport, guarding) in the *same* operation? Does this acceptance correlate with home-district antisemitism? (b) Track individual men over time: Does latency (time/priming needed for first kill) correlate with antisemitism? For those who killed, do later actions show increasing, decreasing, or stable levels of participation/excess? Does this trajectory correlate with background?
      *   **Situationalist Prediction:** Many initial refusers will accept non-shooting roles, showing objection was often to the specific act of killing, not the genocidal aim. Sustained participation over time will be high regardless of background, driven by routinization, escalating commitment, and unit norms. Latency may vary but won't strongly correlate with antisemitism proxies.
      *   **Culturalist Prediction:** Initial refusers accepting non-shooting roles will be less common among men from high-antisemitism districts; their refusal is more likely total. Sustained participation and lower latency will correlate positively with antisemitism proxies. Men high in antisemitism will show more consistent or even increasing enthusiasm/excess.
      *   **What moves Situationalist?** High refusal of *all* roles correlating with low antisemitism; strong correlation between antisemitism and sustained enthusiasm/increasing excess over time; low correlation between antisemitism and acceptance of non-shooting roles by refusers.
      *   **What moves Culturalist?** Widespread acceptance of non-shooting roles by refusers regardless of background; weak correlation between antisemitism and sustained participation levels/latency; refusers' justifications rarely citing ideological dissent.
      *   **Evidence Against Own View (Situationalist):** Clear link between antisemitism proxies and refusal of *any* complicity, or between antisemitism and sustained/increasing enthusiasm over time.
      *   **Evidence Against Own View (Culturalist):** Widespread acceptance of non-shooting roles by refusers; minimal correlation between antisemitism and patterns of sustained participation or latency.

  ### 4. The Dispute We No Longer Have: Dissolved Verbal Quarrels

  Through collaboration, we have identified points where terminology, rather than substantive disagreement about historical evidence or causal mechanisms, fueled unnecessary conflict. We agree to set aside the following formulations:

  1.  **"Ordinary" vs. "Exceptional":** The debate over whether the perpetrators were "ordinary men" or bearers of an "exceptional" ideology often conflated descriptive demographics with explanatory frameworks. We agree the perpetrators were demographically representative of their cohort ("ordinary" in that sense). The substantive question is the *relative contribution* of widespread situational pressures versus a widely shared, virulent cultural preformation ("eliminationist antisemitism") in explaining their behaviour. Labeling the men "ordinary" does not preclude the influence of potent cultural factors; labeling the ideology "exceptional" does not negate the power of the situation they faced.
  2.  **"Culture" as Redescription vs. Explanation:** Accusations that "culture" merely redescribes the aggregate outcome (Germans killed Jews because they were Germans in a genocidal system) are unproductive. Both frameworks use "culture" as an explanatory concept: the situationalist sees a permissive background condition enabling situational pressures to operate effectively; the culturalist sees an active, internalized cognitive model directly motivating behaviour. The dispute is over the *causal weight* and *proximity* of cultural preformation, not whether "culture" is a valid category. The Order Police Corpus allows us to move beyond this stalemate by testing culture's predictive power at the individual level.
  3.  **The Ambiguity of "Willing":** Much contention stemmed from undefined or differently defined uses of "willing." We now explicitly distinguish:
      *   **Compliance without Severe Coercion:** Agreed as a baseline fact (Claim 1, 2).
      *   **Ideological Voluntarism:** The culturalist claim that action stemmed primarily from internal conviction aligning the perpetrator's will with the genocidal aim.
      *   **Situational Voluntarism:** The situationalist claim that compliance resulted from choosing the path of least resistance within powerful constraints (avoiding shame, maintaining standing), not positive ideological alignment.
      The substantive disagreement lies in the *source* of the compliance observed (Claim 1), not whether it occurred without immediate physical duress. Future discussion should use more precise terms ("compliant," "ideologically aligned," "situationally coerced").
  4.  **"Monocausal" as a Stumbling Block:** While the culturalist maintains the primacy of eliminationist antisemitism as the necessary and sufficient core explanation, we agree that labeling any framework "monocausal" in a complex historical event risks oversimplification. Both frameworks acknowledge multiple contributing factors (orders, authority, peer pressure, war context). The key dispute concerns the identification of the *dominant, essential factor* without which the specific pattern of behaviour remains inadequately explained. The focus should be on empirically testing the *relative weight and necessity* of eliminationist antisemitism versus the power of situational pressures alone.

  **Conclusion:**  
  Our collaboration reveals significant common ground on the historical facts and the insufficiency of simplistic explanations. We agree on the possibility of refusal, the nature of the situational pressures, the pervasiveness of antisemitism, and the need for multi-faceted evidence. Our core disagreements center on the causal primacy and specific mechanisms linking cultural preformation and situational pressure to distinct aspects of perpetrator behaviour (uptake, excess, sustainment). The hypothetical Order Police Personnel Corpus and Auxiliary Corpus offer concrete pathways to test these disagreements. We commit to interpreting future findings from such evidence bases rigorously, acknowledging that results may challenge elements of both our frameworks. This joint statement clarifies the terms of debate and moves us toward empirically resolvable questions.
