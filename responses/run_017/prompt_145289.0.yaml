answer: |-
  Here's your prep sheet, designed to anticipate the room's pushback while grounding your thesis in practical methodology. I've ordered objections by potential damage (1 = most damaging), tagged speakers, used their vocabulary, and included strategic advice.

  ---

  ### **Core Concessions to Make in Opening 2 Minutes**  
  1. **To historians**: "You're right—source criticism *is* foundational. My framework doesn't replace close reading or provenance work; it adds a systems-layer lens for *aggregate* survival bias."  
  2. **To the digital humanist**: "Yes, OCR gaps and corpus construction *are* part of this—I’m formalizing the compounding you already correct for."  
  *(This disarms immediate dismissal by acknowledging their expertise.)*  

  ---

  ### **The 8 Objections & Replies**  
  **#1 [Philosophers of history]**  
  *Objection*: "If the archive is a selection effect, isn’t 'what happened' irrecoverable? You’ve made historical truth epistemically inaccessible."  
  *Reply*: "Not inaccessible—*probabilistic*. We ask: 'Given survival biases, how *likely* is this claim?' Your position assumes a binary (access/loss), but we operate in degrees. The 'survival test' quantifies doubt; it doesn’t surrender to it."  
  *Weakness*: Doesn’t fully satisfy hard skeptics who reject probabilistic history.  

  **#2 [Archival historians]**  
  *Objection*: "Source criticism already handles bias—provenance, silences, counter-readings. Aren’t you just repackaging *Grundlagenforschung* with buzzwords?"  
  *Reply*: "Source criticism targets *intentional* bias (e.g., propaganda). My model addresses *unintentional* systemic bias—e.g., why 90% of surviving 16th-century pamphlets are from cities with paper mills. It’s about scale, not replacement."  
  *Weakness*: Risk of seeming dismissive of their craft. Stress *complementarity*.  

  **#3 [Digital humanist]**  
  *Objection*: "Reproduction advantage is obvious. We weight corpora for text reuse and digitization skew. What’s *new* here?"  
  *Reply*: "You correct *for* survival bias; I’m proposing a diagnostic tool to *test claims against it*. Example: If you claim ‘everyone thought X,’ but X-surviving texts all derive from well-funded scriptoria, the ‘survival test’ forces us to model loss rates before trusting that."  
  *Weakness*: Overlap with their work; emphasize the *heuristic* payoff.  

  **#4 [Philosophers of history]**  
  *Objection*: "Power shaping the archive *is* power shaping content. Your ‘modest advantage’ is still victors’ narrative control—just laundered."  
  *Reply*: "Control isn’t the mechanism; *neglect* is. No one burned peasant ballads—they rotted while court chronicles were copied. The ‘victor effect’ emerges from apathy, not malice."  
  *Weakness*: Conflates structural neglect with active suppression; may not sway them.  

  **#5 [Archivists]**  
  *Objection*: "Acquisition policies and cataloguing *create* the archive. Your ‘copying advantage’ ignores institutional gatekeeping—e.g., whose letters we *accept*."  
  *Reply*: "Absolutely. Archival selection is a filter in the chain! But once inside, reproduction advantages (e.g., cited letters get digitized first) compound. Your point strengthens the model."  
  *Weakness*: You risk underweighting institutional power. Cite them as allies.  

  **#6 [Archival historians]**  
  *Objection*: "Early modernists *know* survival is patchy. We use proxies (account books, court records) where texts fail. Does your ‘test’ add practical value?"  
  *Reply*: "It systematizes patchiness. Before claiming ‘rising literacy caused reform,’ ask: Could selective loss of *oral* cultures mimic this? If yes, seek physical evidence (e.g., spectrography of reused parchment)."  
  *Weakness*: Demands interdisciplinary skills some lack.  

  **#7 [All, implicitly]**  
  *Objection*: "Isn’t this just ‘survivorship bias’—well-known in economics/evolution?"  
  *Reply*: "Yes! But history treats it as a footnote, not a core methodological constraint. I’m adapting rigorous survival analysis from those fields to source criticism."  
  *Weakness*: Feels derivative; stress *historical* adaptation.  

  **#8 [Digital humanist/Archivists]**  
  *Objection*: "Your model assumes linear advantage. But reproduction isn’t constant—disasters, copyright, algorithmic bias in OCR break compounding."  
  *Reply*: "Agreed—the model is a baseline. We layer disruptions atop it. But small advantages *persistently* applied still dominate long-term, as in my illustration."  
  *Weakness*: Real-world noise challenges clean models.  

  ---

  ### **Strategic Handling**  
  - **Concede early**: Source criticism’s value (historians) and corpus bias awareness (digital humanist).  
  - **Decline to answer gracefully**: **Philosophers’ "no fact of the matter" (#1)**. Say: "That’s a vital meta-question, but today I’m offering a practical tool for working historians. Let’s discuss epistemology over drinks!"  
  - **Hope nobody asks**: **"How do we apply this to irrecoverably lost groups (e.g., enslaved people)? Doesn’t your ‘test’ erase them further?"**  
    *Why it’s dangerous*: Forces you to admit the model can quantify loss but not resurrect it—risks sounding fatalistic.  

  ---

  ### **Numerical Illustration: Compounding Attrition**  
  **One-Slide Formula**:  
  - Surviving texts after *n* generations: `S = S₀ × (1 + r)ⁿ`  
    - `S₀` = Starting texts (e.g., 100 "A" texts, 100 "B" texts)  
    - `r` = Per-generation reproduction advantage (e.g., Group A: 2%, Group B: 1%)  
    - `n` = Generations (1 generation ≈ 30 years for early modern)  

  **Plausible Parameters**:  
  - Let `n = 10` (≈ 300 years: 1500–1800)  
  - Group A (advantaged): `r = 0.02` (e.g., state-subsidized printing)  
  - Group B (disadvantaged): `r = 0.01` (e.g., private manuscripts)  

  **Results**:  
  - Group A: `100 × (1.02)¹⁰ ≈ 122`  
  - Group B: `100 × (1.01)¹⁰ ≈ 110`  
  - **A:B ratio** = 122:110 ≈ **53:47** — *Modest skew*  

  **When It Matters**:  
  - At `n=20` (600 years): A=149, B=122 → **55:45**  
  - At `r=0.03 vs. r=0.01` (e.g., canonical vs. marginal author):  
    - `n=10`: A=134, B=110 → **55:45**  
    - `n=20`: A=181, B=122 → **60:40**  
  - **Critical point**: Advantage >1% + `n` >15 generations → **>60:40 skew**. Below this, noise dominates.  

  **Honest Limits**:  
  - If `r ≤ 0.005` or `n ≤ 5`, effect is negligible (<52:48).  
  - **Digital humanist note**: They’ll spot that `r` is rarely constant—fire, digitization jumps, or curation waves (e.g., 19th-century nationalism) matter more. Your reply: "Constant `r` is a thought experiment—real history layers disruptions, but the *direction* holds."  

  ---  
  **Final Prep**: Frame the "survival test" as a *practical heuristic*, not a grand theory. Historians tolerate tools; philosophers distrust systems. Anchor in early modern examples (e.g., Protestant vs. radical pamphlet survival). Good luck!
