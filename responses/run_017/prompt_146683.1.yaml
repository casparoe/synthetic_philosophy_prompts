  ### Inferred Rule
  The professor's verdicts suggest she employs a **severity-based testing rule**, influenced by Deborah Mayo's philosophy of statistical testing. Confirmation occurs only when an observation is part of a test that could have falsified the hypothesis (H: all ravens are black) under reasonable assumptions. The degree of confirmation depends on the severity of the test: how likely the test would have been to detect a falsifying instance (e.g., a non-black raven) if H were false. Severity is determined by:
  - **Sampling context**: The observation must be a random draw from a well-defined set that could contain counterexamples to H (e.g., sets like "all objects," "ravens," or "non-black objects"). If the set cannot contain counterexamples (e.g., no ravens), the observation is irrelevant.
  - **Outcome**: The observation must be consistent with H (i.e., a black raven or a non-black non-raven).
  - **Certainty**: Uncertainty about properties (e.g., color) reduces confirmation.
  - **Set size for non-black non-ravens**: When sampling from non-black objects, confirmation strength increases as the set size decreases. A smaller set raises the probability that a counterexample would be found if H were false, so passing the test (no counterexample) is more informative.
  - **Falsification**: A clear counterexample (e.g., non-black raven) falsifies H regardless of context.

