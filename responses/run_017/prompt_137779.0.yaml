  Timing is tight for 45 minutes. Each section needs strict time limits. The introduction should be brief, focusing on the challenge of changing guidelines with new evidence. The historical example takes about 10 minutes, then the generic case for 15. Here, using the speedometer to show how prior belief can lead to dismissing evidence, then contrasting with forming a testable hypothesis. 

  Key questions to ask: "What would it take for this evidence to change your mind?" This helps them articulate criteria for revisiting beliefs. Also, emphasizing that the issue isn't the bar being high but the bar becoming unreachable. 

  Handling misconceptions: When someone brings up confirmation bias, acknowledge the overlap but point out the structural trap of prior justification. For the Bayesian point, agree it's correct but note that it doesn't resolve the psychological compulsion to dismiss evidence. The philosophical dogmatism can be addressed briefly by distinguishing the terms. 

