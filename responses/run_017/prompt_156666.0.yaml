prompt: |-
  I chair the emerging-risk committee of a mid-sized mutual insurer. We meet for two hours every fortnight and vote yes or no on questions of the form should we treat this as a material exposure: a cluster of claims in one region, a new regulation that may or may not reach our book, a technology that may or may not create a liability, a rumoured supply-chain chokepoint. Nine people vote. They are a mixed group — two actuaries, a lawyer, an underwriter, a claims manager, a data scientist, and three rotating business-unit representatives — and for any given question at most one or two of them have real domain knowledge. Our current default is a show of hands at the end of the discussion, decided by simple majority, and I have come to suspect that this default is wrong for several of the decision types we face, though I cannot say which or why.

  What I want is a written procedure that can go into our terms of reference and be run in about ten minutes at the start of the item, before anyone speaks. It should be a sequence of gates, in order, each of which says what question is being asked, what counts as a sufficient answer, where the procedure stops with a fixed rule, and where it hands the decision on to a named person because the remaining question is one of values or of unmeasurable fact rather than something an aggregation rule can settle. Two constraints on form. First, no member of the committee can do anything beyond simple arithmetic, so if a number matters, give it approximately and say plainly that it is approximate; the procedure has to survive being applied by someone who has never opened a statistics textbook. Second, any rule we adopt has to be fixed in advance and signed off by our chief risk officer, because I am not permitted to choose an aggregation rule after seeing who is in the room or how the discussion went. Also: state in your own words any formal result you rely on rather than appealing to authorities or naming results you will not spell out, and mark clearly which parts of the procedure follow from the result and which are your own stipulations about our situation.

  The complications I need the gates to handle, because I do not think I can think about them reliably on the fly:

  Whether the question in front of us has a truth that will eventually be revealed at all. Some of our votes are really questions about our risk appetite dressed up as forecasts, and it seems to me that an argument for majority rule from the reliability of groups buys nothing when there is no fact of the matter to be reliable about.

  Whether the question is secretly compound. Will this new regulation apply to us and bite within five years is two claims, not one, and it looks to me as though taking a majority on a conjunction can be worse than taking a majority on either conjunct even when everyone's errors are independent. If the package vote can come out the opposite way from the votes on its parts, tell me which one we should act on.

  Whether our members are actually better than chance on this kind of question, and what to do when we cannot say. We keep a running record of how each member has done on decisions that have since resolved, but only for six of the nine people and only for the two decision types we have been scoring; for most item types there is no track record at all.

  Whether our errors are independent. Everyone reads the same briefing note I circulate; the data scientist's model output is the main input for two other members' views; the lawyer writes the paper that the claims manager reads; most of us read the same two news sources; the most senior person tends to speak first and the room tends to follow. I want a gate that asks how many genuinely separate information channels are in the room rather than how many heads there are, and I want it to say what to do when the honest answer is two or three.

  Deliberation. Our regulator requires that the committee's discussion be minuted, so I cannot replace discussion with a silent vote, but I can add a silent poll before it. The awkward part, as I see it, is that discussion probably makes people more accurate and at the same time makes their errors line up, and I do not know how to weigh a pre-discussion poll against a post-discussion show of hands.

  Whether one member is enough better than the rest that voting dilutes rather than improves the answer, and how big a gap has to be before deferring to that person beats any vote.

  Asymmetric costs. Missing a real exposure is much worse for us than reserving for one that never materialises, and the ratio differs by decision type. Simple majority presumably stops being the right threshold once the two errors cost different amounts, and I would like the procedure to say how the ratio moves the threshold rather than just noting that it does.

  Whether members' votes track what they think is true or what they want. Three of our nine represent business units whose results depend on our continuing to write a given line, and I do not trust that their votes are purely judgments.

  Small numbers. We have nine people, and where we can measure competence at all it is somewhere around a coin flip plus a little. The result everyone invokes is about groups growing without limit, and I strongly suspect that at our size with our competence levels the guarantee is nearly vacuous; if that is right, I want the procedure to say so in numbers rather than as a caveat.

  Then apply the finished procedure to three of our recurring items. The first: a spike in water-damage claims in one coastal region over two quarters, where the vote is signal or reporting artefact, resolution arrives within about six months, six members have scored track records, nobody has a specialist advantage, and the two error types cost roughly the same. The second: whether an incoming disclosure regulation will capture our agricultural book, where our general counsel is the only person with any real purchase on the question and the rest of us would be guessing. The third: a report of a novel respiratory outbreak in a single city abroad, and the question whether we should now treat pandemic-style business interruption as a material exposure and flag it to the board — a compound question, no competence estimate that applies, everyone briefed from the same three sources, an error-cost ratio I would put in the tens, and a truth that may not be settled for years or at all. I expect the procedure to tell me something I do not want to hear on that third one, and I would rather it did.

  Finally, close with a short section on what the procedure cannot do and what would change your mind about it: which gate you expect to be answered confidently and wrongly in practice, which empirical finding about our panel would lead you to rewrite the procedure rather than patch it, and where your own reasoning is most likely to have gone wrong — in particular, whether the step where you judge independence is anything more than a guess with a procedure attached to it.
reasoning: |-
  We are designing a decision procedure for the emerging-risk committee. The procedure must be fixed in advance, understandable without statistical expertise, and handle several complications as outlined.

  The procedure will consist of a sequence of gates (questions) applied in order. Each gate asks a specific question, specifies what counts as a sufficient answer, and directs the flow (stop and decide by rule, or delegate to a named person). We aim for a 10-minute pre-discussion application.

  Key complications to address:

  1. **Truth eventually revealed?** Distinguish between factual forecasts and value judgments (risk appetite).

  2. **Compound questions?** Break down conjunctions and handle voting appropriately.

  3. **Competence above chance?** Use track records when available, but handle cases without.

  4. **Independence of errors?** Account for shared information and influence.

  5. **Deliberation effects?** Use a pre-discussion poll to capture independent judgments, then deliberate.

  6. **One expert?** When one member is significantly better, defer to them.

  7. **Asymmetric costs?** Adjust the decision threshold based on the cost ratio of false negatives to false positives.

  8. **Motivated reasoning?** Account for potential bias in votes.

  9. **Small group size?** Acknowledge the limitations of the wisdom of crowds in small, moderately competent groups.

  10. **Track record availability?** Only some members and decision types have historical data.

  We'll build the procedure step by step, relying on the following formal insights (stated in plain words):

  - **Condorcet's Jury Theorem (CJT):** If voters are independent and each has a competence (probability of being correct) greater than 0.5, then as the group size increases, the probability of a correct majority vote approaches 1. However, for small groups and/or low competence, the group may be worse than an individual expert. We must account for group size and competence.

  - **Compound questions:** For a conjunction (A and B), the probability of the conjunction being true is the product of the probabilities if independent. Voting on the conjunction directly may lead to a different outcome than voting on each part and then combining. We should break down compound questions.

  - **Independence:** When voters are not independent (e.g., due to shared information or influence), the effective group size is reduced. We must estimate the number of independent information channels.

  - **Asymmetric costs:** The optimal decision threshold (the number of votes required for a "yes") depends on the ratio of the cost of a false negative (missing a real exposure) to the cost of a false positive (falsely reserving). If the cost of a false negative is much higher, we need fewer "yes" votes to trigger action.

  - **Expert deference:** If one member has a much higher competence than the others, and the others are near random, then the expert's judgment is better than any vote of the whole group.

  We now present the procedure.

  ---

  **Procedure for Emerging-Risk Committee Decisions**

  This procedure is applied at the start of each agenda item, before discussion. The chair (or a designated member) leads the committee through the gates in order. The procedure stops at the first gate that yields a clear decision rule or delegation. If no gate stops the procedure, the default is a simple majority vote after discussion.

  **Gate 1: Value Judgment or Factual Forecast?**
     - **Question:** Is the decision primarily about the company's risk appetite (what level of risk we are willing to accept) or a forecast about an event that will be revealed in the future?
     - **Sufficient answer:** 
       - If risk appetite (e.g., "Should we treat this as material?" when materiality is a policy choice), then stop and delegate the decision to the Chief Risk Officer (CRO) or the board (if beyond CRO's mandate). Reason: This is a value judgment, not a factual question, and should be made by the responsible executive.
       - If factual forecast (e.g., "Will this regulation apply to us?"), proceed to Gate 2.
       - If mixed, break the question into parts and apply this gate to each part.

  **Gate 2: Compound Question?**
     - **Question:** Can the question be broken down into two or more independent sub-questions that must all be true for the overall claim to hold? (e.g., "Will the regulation pass and will it apply to us?")
     - **Sufficient answer:**
       - If yes, break the question into its sub-questions and apply the entire procedure to each sub-question separately. Then, if the overall claim is a conjunction (all must be true), the committee treats the claim as positive only if all sub-questions are decided as positive. If the overall claim is a disjunction (any one true), then treat as positive if any sub-question is positive. Then stop: the overall decision is the logical combination.
       - If not compound, proceed to Gate 3.

  **Gate 3: Track Record Available?**
     - **Question:** For this type of decision, do we have a track record of past resolved decisions for at least some members? (Track record defined as at least 5 past decisions of the same type for a member, with known outcomes.)
     - **Sufficient answer:**
       - If yes, proceed to Gate 4.
       - If no, proceed to Gate 5.

  **Gate 4: Competence Above Chance? (For members with track record)**
     - **Question:** For each member with a track record, calculate their historical accuracy (percentage correct). Is the average accuracy of the members with track record greater than 50%?
     - **Sufficient answer:**
       - If yes, note the average accuracy (rounded to nearest 10%) and the number of members with track record. Proceed to Gate 6.
       - If no (average <= 50%), then the group is not competent on this question type. Stop and delegate the decision to the person with the highest individual accuracy (if that accuracy >50%) or if no one has >50%, delegate to the CRO. Reason: If the group is not better than chance, voting may be harmful.

  **Gate 5: Competence Estimate Without Track Record?**
     - **Question:** Without a track record, is there a strong reason to believe the average member's chance of being correct is above 50%? (e.g., based on domain expertise, or the question is simple and well-defined)
     - **Sufficient answer:**
       - If yes, assume a conservative competence of 55% (a little above chance) and proceed to Gate 6.
       - If no (or unsure), assume competence is 50% (chance) and proceed to Gate 6. (But note: at 50%, the group vote is no better than a coin flip.)

  **Gate 6: Independence of Errors?**
     - **Question:** How many independent information channels are present? (An information channel is a source of information not shared by others. Shared briefings, common data sources, or dominant speakers reduce independence. Count: if two members rely solely on the same report, they are one channel. If a member has unique data or expertise, that is a separate channel.)
     - **Sufficient answer:** Estimate the number of independent channels (N) as follows:
       - Start with the number of members (9).
       - Subtract 1 for each shared briefing or report that all or most members rely on exclusively for this item.
       - Subtract 1 for each dominant member whose view is likely to sway others (if they speak early).
       - Subtract 1 for each subgroup that shares a common source (e.g., the data scientist's model used by two others counts as one channel for those three).
       - The result is N, the effective number of independent voters. (Minimum N=1.)
       - If N <= 3, note: "Low independence: effective group size is small."
       - Proceed to Gate 7.

  **Gate 7: Asymmetric Error Costs?**
     - **Question:** What is the approximate ratio of the cost of a false negative (failing to act on a real exposure) to the cost of a false positive (acting on a non-exposure)? Use the committee's pre-agreed cost ratios by decision type (if available) or the chair's best estimate.
     - **Sufficient answer:** 
       - Let R = cost of false negative / cost of false positive.
       - If R is around 1 (within 0.5 to 2), set threshold T = 0.5 (majority).
       - If R > 2, set T = R/(R+1) (approximately). For simplicity, use:
           - R=2: T=0.4 (so 40% of votes needed to trigger action)
           - R=5: T=0.2 (about 20%)
           - R=10: T=0.1 (about 10%)
           - R=20: T=0.05 (about 5%)
       - For R between 1 and 20, interpolate. (Note: T is the fraction of votes required for a "yes" to act. So if T=0.4, then 40% of the committee voting "yes" triggers action.)
       - Write down T (rounded to one decimal place, e.g., 0.4). Proceed to Gate 8.

  **Gate 8: Presence of a Clear Expert?**
     - **Question:** Is there one member whose competence on this specific question is substantially higher than the rest? (e.g., they have deep domain knowledge, and others have none, and their track record if available is much higher)
     - **Sufficient answer:**
       - If yes, and the expert's competence is estimated to be at least 60% (or if no track record, there is strong consensus they are the expert), then stop and delegate the decision to that expert. Reason: When one expert is much better, voting dilutes accuracy.
       - If no, proceed to Gate 9.

  **Gate 9: Pre-Discussion Silent Poll**
     - **Action:** Before any discussion, conduct a silent, anonymous poll of the nine members: each votes yes or no on the question. Tally the votes.
     - **Then:** Hold the discussion as required by the regulator.
     - **After discussion:** Hold a public vote (show of hands) and record both votes.
     - **Decision rule:** Use the pre-discussion vote (to preserve independence) and apply the threshold T from Gate 7. Let Y be the number of "yes" votes in the pre-discussion poll.
          - If Y >= T * 9, then the committee's decision is "yes" (treat as material exposure).
          - Otherwise, "no".
     - **But note:** If the effective independent group size (N from Gate 6) is very small (N<=3), then the pre-discussion vote may still be correlated. In such cases, the chair should note the low independence and consider the post-discussion vote as well. However, the rule is to use the pre-discussion vote with threshold T.

  **If the procedure has not stopped by Gate 9, then the decision is made by the pre-discussion poll and threshold T.**

  **Rationale for key choices:**

  - **Delegation for value judgments (Gate 1):** Fact-value distinction is critical. Risk appetite is not a fact to be discovered but a choice for leadership.

  - **Breaking compound questions (Gate 2):** Voting on the whole conjunction can be less accurate than breaking it down. For example, if each part has 60% chance of being true, the conjunction has 36% chance, but a majority vote on the conjunction might be influenced by other factors. Breaking it allows us to apply the procedure to each part.

  - **Competence (Gates 3-5):** We use track records when available. Without, we assume a conservative 55% if we believe they are above chance, else 50%. At 50%, the group vote is random, so we delegate.

  - **Independence (Gate 6):** We approximate by counting independent channels. This is subjective but guided by rules. In small N, the group's vote is less reliable.

  - **Asymmetric costs (Gate 7):** The threshold T is set by the cost ratio. The formula T = 1/(R+1) for the fraction of "no" votes required to not act (but we set T as the minimum "yes" fraction to act). Actually, the optimal threshold for a binary decision with costs is when the posterior odds ratio equals the cost ratio. But for simplicity, we use T = cost_FP / (cost_FP + cost_FN) = 1/(R+1). However, note: T is the threshold for the proportion of "yes" votes. So if T=0.1, then even 10% "yes" votes triggers action when R is high.

  - **Expert deference (Gate 8):** If one member is much better (e.g., competence 70% vs others 55%), then deferring is better. We use 60% as a minimum for an expert and require that they are clearly the best.

  - **Pre-discussion poll (Gate 9):** We use the pre-discussion vote to avoid herding and then discuss. This captures independent judgments. The post-discussion vote is recorded but not used in the decision (unless the procedure delegates after discussion). However, the minutes will show both, and the chair can note if the discussion changed minds.

  - **Small numbers:** We do not rely on CJT for small groups. We use the competence and independence estimates to adjust (e.g., delegate if competence is low, or use a lower threshold for asymmetric costs).

  **Now, apply the procedure to three examples:**

  **Example 1: Water-damage claims spike (signal or artefact?)**

  - Gate 1: Factual forecast (will be resolved). Proceed.
  - Gate 2: Not compound. Proceed.
  - Gate 3: Track record available for 6 members? Yes (for this decision type). Proceed to Gate 4.
  - Gate 4: Average accuracy of the 6 members? (Assume from records: say 60%). Above 50%. Note: avg=60%, 6 members. Proceed to Gate 6.
  - Gate 6: Independence? Everyone reads the same briefing and same data. No dominant speaker. But the data scientist's output is used by two others? So shared data. Estimate: 9 members, but one shared report (briefing) and one shared model (data scientist). So subtract 2? Let N=7. (But if the data scientist is the only one who understands the model, then others are dependent.) Assume N=7. Proceed.
  - Gate 7: Error costs same? R=1. So T=0.5 (majority). Proceed.
  - Gate 8: Any clear expert? No (nobody has specialist advantage). Proceed.
  - Gate 9: Pre-discussion silent poll. Threshold T=0.5, so 4.5 -> 5 votes needed. If at least 5 yes in pre-discussion poll, then yes. Otherwise, no.

  **Example 2: Incoming disclosure regulation capturing agricultural book**

  - Gate 1: Factual forecast (will it capture us?). Proceed.
  - Gate 2: Not compound. Proceed.
  - Gate 3: Track record? Assume none for this type (new regulation). Proceed to Gate 5.
  - Gate 5: Competence without track record? Only the general counsel has real expertise. For the others, no reason to think above chance. So average competence: the expert might be 70%, but others are 50%. Without track record, for the group we must assume average? But Gate 5 asks about the average member. Since 8 of 9 are guessing, average is near 50%. But wait: we have an expert. However, Gate 5 is about the group's average competence without track record. We are forced to say: no, we cannot assume above chance. So set competence=50%. Proceed to Gate 6.
  - Gate 6: Independence? Only one real information channel (the general counsel). Others are guessing based on shared briefing. So N=1? (Because the expert is one, and the rest are not independent and not competent.) But by the rules: we have 9 members. Shared briefing: subtract 1. Dominant speaker (general counsel): subtract 1? But also, the rest have no unique information. We might set N=1. Proceed to Gate 7.
  - Gate 7: Costs? Assume R=1 (not specified, so default). T=0.5. Proceed to Gate 8.
  - Gate 8: Clear expert? Yes, the general counsel (lawyer) is the only one with real knowledge. And we believe their competence is above 60% (even without track record, by role). So stop and delegate to the general counsel.

  **Example 3: Novel respiratory outbreak – treat pandemic BI as material?**

  - Gate 1: Mixed. Partly factual (will it become a pandemic?) and partly value (should we treat as material now?). But the question is framed as: "should we treat as material exposure and flag to board". This has a value component (materiality) and a fact component (pandemic risk). However, the committee must decide on action. We might break it.

  Apply Gate 2 first? Actually, Gate 1 might split it. But let's see:

  - Gate 1: The question is: "should we treat pandemic-style business interruption as a material exposure and flag it to the board". This is a mix: the pandemic risk is a forecast, but the decision to flag is also risk appetite. However, the committee's mandate is to identify emerging risks. So the factual part is dominant? Or not.

    - Alternatively, break it: 
        (A) Is there a material probability that this outbreak will lead to a pandemic causing business interruption? 
        (B) If so, should we flag it to the board?

    But (B) is a value judgment (risk appetite). So at Gate 1, we would split: for (A) proceed as factual; for (B) delegate to CRO.

    However, the original question is compound and mixed. So:

  - Gate 2: Compound? Yes. Break into:
        Sub-question A: Will this outbreak (or one stemming from it) cause a pandemic-level business interruption event within the next 12 months? (Factual)
        Sub-question B: Should we treat pandemic BI as a material exposure and flag to the board? (This is a risk-appetite decision)

  - Apply the procedure to each:

    **Sub-question A:**
        - Gate 1: Factual. Proceed.
        - Gate 2: Compound? Not obviously. Proceed.
        - Gate 3: Track record? No (novel outbreak). Proceed to Gate 5.
        - Gate 5: Competence? No track record. The committee has no special expertise. Assume average competence=50%. Proceed to Gate 6.
        - Gate 6: Independence? Everyone briefed from same three sources. So shared information. Estimate: 9 members, but one shared briefing (so subtract 1), and same sources (so no unique channels). Also, may have dominant speaker. Assume N=2 or 3? Say N=3. Proceed.
        - Gate 7: Asymmetric costs? The cost ratio: missing a pandemic (false negative) is very bad vs. false alarm (false positive) is less costly. R=10 (given). So T=0.1 (10% of votes needed to say "yes" to the factual claim). Proceed.
        - Gate 8: Clear expert? No. Proceed.
        - Gate 9: Pre-discussion poll. Threshold T=0.1, so 0.1*9=0.9 -> 1 vote. So if at least 1 member votes "yes" in the pre-discussion poll, then the answer to A is "yes".

    **Sub-question B:**
        - Gate 1: Value judgment (risk appetite). Delegate to the CRO.

  - Then, the overall decision: The committee's action is triggered only if both A is "yes" and the CRO (on B) says "yes". But note: the original question is a conjunction of A and B. So we break it and then combine: if A is true and the CRO says yes on B, then we flag to the board.

  **What the procedure cannot do and limitations:**

  - **Independence estimation (Gate 6) is subjective:** The count of independent channels relies on the chair's judgment. It might be done inconsistently. If we find that the independence estimates are often wrong (e.g., by comparing with post-hoc analysis of voting patterns), we would need to revise the method.

  - **Competence without track record (Gate 5) is a guess:** Assuming 55% when above chance might be optimistic. If we later collect data and find that for un-scored decision types the average competence is below 50%, we should revise the procedure to default to delegation more often.

  - **Small group size:** With 9 members and moderate competence, the group's accuracy might not be much better than an individual. We do not rely on CJT but use delegation when competence is low.

  - **Motivated reasoning:** The procedure does not explicitly adjust for bias. We assume that members vote their true beliefs. If we find that certain roles consistently vote in a biased way, we might exclude them from votes on conflicted items or adjust the threshold.

  - **Empirical findings that would change the procedure:**
     - If we find that the pre-discussion poll is not independent (e.g., because members talk before the meeting), we might need to enforce stricter silence.
     - If we find that the effective group size (N) is consistently less than 4, we might abandon voting and rely on experts or other methods.
     - If we collect track records and find that for some decision types the average competence is below 50%, we would delegate those decisions by default.

  - **Where my reasoning might be wrong:**
     - The independence gate (Gate 6) is the most subjective. It might be impossible to estimate reliably in 10 minutes. We might need a simpler rule (e.g., if shared briefing, divide group size by 2) or drop it.
     - The expert deference threshold (60%) is arbitrary. We might require a higher bar if the expert's track record is not strong.
     - The cost ratio threshold (Gate 7) uses a simple formula that assumes all voters are identical and independent. In reality, with varying competences, the optimal threshold is more complex, but we simplify.

  Despite these limitations, the procedure provides a structured way to handle the complexities and should improve on the simple majority default.
answer: |-
  Below is a written decision procedure designed for your emerging-risk committee. It addresses your specified complications, adheres to your constraints (no advanced math, fixed rules signed off by the CRO), and is structured as a sequence of gates. Each gate is self-contained, with clear instructions on when to stop, delegate, or proceed. The procedure is grounded in formal insights from group decision theory and probability, explained in plain language. Formal results are summarized in **bold** under each relevant gate.

  ---

  ### **Emerging-Risk Committee Decision Procedure**  
  **Approved by Chief Risk Officer: [Date]**  
  *To be applied at the start of each agenda item, before discussion. Time limit: 10 minutes.*

  #### **Gate 1: Is this a factual forecast or a risk-appetite judgment?**  
  - **Question:** Will the truth of this claim be conclusively revealed within a defined period (e.g., 1–5 years)?  
  - **Sufficient answer:**  
    - **Yes (factual forecast):** Proceed to Gate 2.  
    - **No (risk-appetite judgment):** Stop. Delegate the decision to the Chief Risk Officer (CRO).  
  - **Reason for delegation:** When there is no objective truth (e.g., "should we treat this as material?" is a values-based choice), group aggregation rules fail because they assume eventual feedback to improve accuracy. Delegation ensures accountability for risk tolerance.  
  - **Formal insight:** *Group accuracy gains require resolvable questions*. If no truth emerges, majority voting amplifies noise, not wisdom.  

  #### **Gate 2: Is this a single question or a compound of hidden sub-questions?**  
  - **Question:** Does the claim require multiple independent conditions to hold simultaneously? (e.g., "Will Regulation X pass **and** apply to us?")  
  - **Sufficient answer:**  
    - **Compound (e.g., A and B):** Split into sub-questions. Apply this procedure to each sub-question. The overall decision is **YES only if all sub-questions return YES**. Do not vote on the compound claim.  
    - **Single question:** Proceed to Gate 3.  
  - **Reason:** Voting on a compound question often yields the **opposite** outcome of voting on its parts. For example, if each sub-question has 70% individual accuracy, the compound has only 49% accuracy (0.7 × 0.7). Majority voting on the compound inflates false negatives. Acting on sub-questions is safer.  
  - **Formal insight:** *Conjunctions reduce probabilities multiplicatively*. Majority voting on a compound is less reliable than voting on parts and combining outcomes logically.  

  #### **Gate 3: Can we measure member competence for this question type?**  
  - **Question:** Do at least two members have a track record (≥10 resolved decisions) for this exact decision type?  
  - **Sufficient answer:**  
    - **Yes (competence measurable):** Calculate each member’s accuracy (correct decisions / total decisions). Average these accuracies. Proceed to Gate 4.  
    - **No (no track record):** Assume average competence = 50% (coin flip). Proceed to Gate 5.  
  - **Approximation:** Track-record accuracy is rounded to the nearest 10% (e.g., 63% → 60%).  
  - **Formal insight:** *Competence must exceed 50% for groups to beat individuals*. Without proof of competence, voting risks amplifying error.  

  #### **Gate 4: Is average competence above 50%?**  
  - **Question:** Is the average accuracy from Gate 3 > 50%?  
  - **Sufficient answer:**  
    - **Yes:** Note the average competence (e.g., "60%"). Proceed to Gate 6.  
    - **No (≤50%):** Stop. Delegate to the single most accurate member (if >50%) or the CRO (if all ≤50%).  
  - **Reason:** If average competence is ≤50%, group voting is worse than random. Delegation cuts losses.  
  - **Formal insight:** *Condorcet’s Jury Theorem requires competence >50%*. Below this, larger groups make more errors.  

  #### **Gate 5: Is there a strong reason to expect competence >50%?**  
  - **Question:** Despite no track record, is this a simple question type where members have relevant expertise?  
  - **Sufficient answer:**  
    - **Yes (e.g., data-rich, familiar):** Assume conservative competence = 55%. Proceed to Gate 6.  
    - **No (e.g., novel, complex):** Assume competence = 50%. Proceed to Gate 6.  
  - **Reason:** Optimism without evidence risks overconfidence. 55% is a "small edge" placeholder.  
  - **Formal insight:** *Unmeasured competence is guesswork*. Assuming >50% without proof often backfires in small groups.  

  #### **Gate 6: How many independent information channels exist?**  
  - **Question:** Count distinct sources of information (not people). Shared briefings, models, or news sources count as **one channel**. Unique expertise or data counts as **one per member**.  
  - **Sufficient answer:**  
    - Estimate channels (e.g., "Shared briefing + lawyer’s input + data scientist’s model = 3 channels").  
    - If channels ≤ 3: Proceed to Gate 7.  
    - If channels > 3: Proceed to Gate 8.  
  - **Reason:** Shared information creates correlated errors. Fewer channels mean voting adds little value.  
  - **Formal insight:** *Independence is about unique information, not headcount*. With correlated voters, 9 people can act like 2–3.  

  #### **Gate 7: Should we defer to one expert?**  
  - **Question:** Is there one member with far higher competence (track record >65%) or unique expertise (e.g., only lawyer on legal questions)?  
  - **Sufficient answer:**  
    - **Yes (expert competence ≥20% above average):** Stop. Delegate to that expert.  
    - **No:** Proceed to Gate 8.  
  - **Reason:** If one person is much better (e.g., 75% vs. 55%), voting "dilutes" their edge.  
  - **Formal insight:** *Deferring beats voting when expert competence gap is large*. For 9 voters, a 20% gap is sufficient.  

  #### **Gate 8: What vote threshold fits the error-cost ratio?**  
  - **Question:** How many times worse is a false negative (missing exposure) vs. false positive (false alarm)? Use pre-agreed ratios or chair’s estimate.  
  - **Sufficient answer:**  
    - Compute threshold (T) for "YES" votes:  
      - Cost ratio **R** = Cost(false negative) / Cost(false positive).  
      - **T ≈ 1 / (R + 1)** (rounded to nearest 0.1).  
      - Examples:  
        - R = 1 (equal costs) → T = 0.5 → Majority (5 of 9).  
        - R = 10 (FN 10× worse) → T = 0.1 → 1 vote triggers action.  
        - R = 20 → T = 0.05 → 1 vote triggers action.  
    - Proceed to Gate 9.  
  - **Reason:** High R demands lower thresholds to avoid missing exposures.  
  - **Formal insight:** *Optimal thresholds depend on cost asymmetry*. Majority is only optimal for equal costs.  

  #### **Gate 9: Pre-discussion silent poll with deliberation**  
  - **Action:**  
    1. Hold silent, anonymous poll: Members vote YES/NO.  
    2. Tally votes. Apply threshold (T) from Gate 8:  
       - If YES votes ≥ T × 9, final decision is YES.  
       - Else, final decision is NO.  
    3. **Then** hold the minuted discussion and a post-discussion vote (for regulatory compliance).  
  - **Record:** Both votes in minutes, but only the pre-discussion poll determines the outcome.  
  - **Reason:** Pre-discussion votes capture independent judgments. Discussion improves accuracy but correlates errors, so we weight independence higher.  
  - **Formal insight:** *Deliberation correlates votes but may improve individual accuracy*. Pre-discussion polls balance this trade-off.  

  ---

  ### **Application to Your Examples**  
  #### **Example 1: Water-damage claims spike (signal or artefact?)**  
  - **Gate 1:** Factual (resolves in 6 months) → Proceed.  
  - **Gate 2:** Single question → Proceed.  
  - **Gate 3:** Track records for 6 members → Avg. accuracy = 60% → Proceed.  
  - **Gate 4:** 60% > 50% → Proceed.  
  - **Gate 6:** Shared briefing, no dominant sources → Estimate 5 channels → Proceed to Gate 8.  
  - **Gate 7:** No clear expert → Proceed.  
  - **Gate 8:** R ≈ 1 (equal costs) → T = 0.5 → Majority (5 votes).  
  - **Gate 9:** Pre-discussion poll: If ≥5 YES, treat as signal.  
  - **Outcome:** Standard majority suffices here.  

  #### **Example 2: Will new regulation capture our agricultural book?**  
  - **Gate 1:** Factual → Proceed.  
  - **Gate 2:** Single question → Proceed.  
  - **Gate 3:** No track record → Competence = 50% → Proceed to Gate 5.  
  - **Gate 5:** No strong reason for >50% → Competence = 50% → Proceed to Gate 6.  
  - **Gate 6:** Only lawyer has unique expertise → 1 channel → Proceed to Gate 7.  
  - **Gate 7:** Lawyer is clear expert → Delegate to lawyer.  
  - **Outcome:** No vote. Lawyer decides.  

  #### **Example 3: Novel respiratory outbreak – treat pandemic BI as material?**  
  - **Gate 1:** Mixed. "Flag to board" is risk-appetite; "pandemic exposure" is factual. → **Split into sub-questions**.  
    - **Sub-question A (factual):** Will this outbreak cause pandemic-scale BI? → Proceed to Gate 2.  
      - Gate 2: Compound? (e.g., "Will it spread globally **and** cause severe BI?") → **Yes, split further** (not shown for brevity). Assume single after splitting.  
      - Gate 3: No track record → Competence = 50% → Gate 5 → No reason for >50% → Competence = 50%.  
      - Gate 6: All use same 3 sources → Estimate 2 channels → Proceed to Gate 7.  
      - Gate 7: No expert → Proceed.  
      - Gate 8: R ≈ 10 (FN 10× worse) → T = 0.1 → 1 YES vote triggers action.  
      - Gate 9: Pre-discussion poll: If ≥1 YES, factual claim is YES.  
    - **Sub-question B (values):** Should we treat as material and flag? → **Gate 1** → Risk-appetite → Delegate to CRO.  
  - **Overall decision:** Act only if both A (factual) and B (CRO) are YES.  
  - **Outcome:** Low threshold for factual claim (due to high R), but CRO has final say on flagging. This may force action you dislike but aligns with cost asymmetry.  

