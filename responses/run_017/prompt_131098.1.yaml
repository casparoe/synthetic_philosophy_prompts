prompt: |-
  I am finishing a long feature on the welfare of fish and crustaceans in aquaculture, and I have run into a problem I would like help with before I file. Going case by case and recording my own gut reactions, I find that the reactions are stable and fairly confident, but they do not line up with any of the principles I keep hearing from the people I interview. I would rather state the principle I am actually using than smuggle it into the piece unstated. So: below are my verdicts, then a principle a researcher offered me when I pressed him. What I want is a principle, or a short list of candidates, that captures as much of the pattern as possible, stated precisely enough that a reader could apply it to a case I have not listed, together with an honest account of which of my verdicts it cannot accommodate and why.

  1. In shrimp hatcheries, breeding females have an eyestalk crushed or cut in order to induce spawning. My verdict: this is among the worst practices in the sector, worse per animal than nearly anything else I have looked at, and I would lead the piece with it.

  2. Warm-water fish such as tilapia being crowded into nets and then chilled in an ice slurry until they die. Verdict: very bad, though I notice I rank it below case 1 even though it is a drawn-out death applied to vastly more animals.

  3. Months of life at high stocking density, in a schooling species that shows no territorial aggression and no measurable preference for more space. Verdict: mildly bad; I would not campaign on it, and I am not sure I would spend a paragraph on it.

  4. The same densities, for the same duration, in a species that defends territories and fights when crowded. Verdict: considerably worse. I cannot say what changes between 3 and 4 other than the animal's own frustrated motivation.

  5. Feed withdrawn for a day or two before slaughter, as a matter of routine, to empty the gut. Verdict: barely registers with me at all.

  6. Electrical or percussive stunning followed by exsanguination on an otherwise well-run farm. Verdict: close to a solved problem, and I feel strangely untroubled by it. Yet this ends the animal just as dead as case 2 does, and the difference is only competence of method. I do not know whether to conclude that most of my horror in case 2 was about technique rather than about killing.

  7. A decapod boiled alive. Verdict: not acceptable, and I react physically to the description. But my confidence that a shrimp or crab has any subjective experience at all is perhaps forty percent, and I cannot argue it higher from what I know.

  8. A genetically edited line of farmed fish in which the neural machinery required for pain has been disabled, so the animal cannot suffer while being otherwise normal and active. Verdict: not merely permissible but close to a triumph; I would rather the industry moved in this direction than shrank. I take it that 7 and 8 are the pair my other verdicts cannot jointly support, since 8 treats the absence of sentience as settling everything and 7 extends full protection on quite thin evidence.

  9. The arithmetic puzzles me. Case 1 affects a small number of animals for a short time. Chronic crowding affects essentially the entire population for months. On any additive reckoning the aggregate of mild discomfort should swamp the ablations, and yet my verdicts rank the ablations higher. I appear to weight intensity far above duration-and-number in a way that the additive story does not license.

  The case I keep going back and forth on: a closed-containment salmon operation with genuinely low densities, no chemical or mechanical delousing, and reliable instant killing. It will be built only if there is demand for it, and the fish in it would not otherwise exist. I cannot decide whether this is a welfare win that displaces worse product, or simply more animals being bred and killed, and I do not know which way my own verdicts push.

  The principle I was offered, in my paraphrase: what matters is expected suffering, understood as the product of intensity, duration, number of animals, and the probability that the animals in question are sentient; and where a practice would be indefensible if performed on a mammal, treat it as indefensible unless there is positive evidence that the animal cannot suffer. My suspicions, which I would like you to confirm or dissolve rather than take from me: the first clause seems to make cases 3 and 4 nearly equivalent, since duration, number and probability are held fixed; the second clause sits badly with the probability multiplier in the first; and the whole thing may save verdict 1 only by treating the ablation as far more intense than anything else on my list.

  What I would like back:

  Two or three candidate principles, each stated precisely, with each clause tied to the specific verdict that motivates it, so I can see what would be lost by dropping the clause.

  Each principle's verdicts on cases I have not listed: bivalve farming, oysters and mussels, and the small wrasse or lumpfish stocked in salmon pens to eat sea lice, which die in large proportions. Please also generate at least two further cases a reporter could plausibly encounter and give the verdicts.

  The flip-flop case, decided each way if the principles differ.

  For each principle, which of my verdicts it overturns, and whether the overturning is cosmetic or the loss of something I actually believe.

  Whether the tension between 7 and 8 is a genuine conflict in my commitments or a verbal one, and if it is genuine, which verdict you would advise me to withdraw and what I would then have to say in the piece instead.

  Finally, a one-sentence or two-sentence formulation I could put in a magazine, accurate to whichever principle you recommend, that does not collapse into a slogan and does not imply a confidence about crustacean sentience that the evidence does not support.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from an investigative journalist working on aquaculture welfare. They've carefully documented their intuitive judgments on various practices but found they don't align with standard animal welfare principles. What they really need is ethical scaffolding that both honors their moral instincts and holds up to scrutiny.

  Looking at their nine cases, several patterns emerge. Their reactions seem deeply sensitive to three things: the phenomenology of suffering (how vividly awful an experience feels), evidence of conscious distress, and the "violation factor" where natural functions are deliberately damaged. That eyestalk ablation case clearly hits all three - it's visceral, intentional mutilation of sensory organs. Meanwhile, temporary hunger barely registers as a welfare issue despite affecting many animals.

  The standard utilitarian "expected suffering" model they were given clearly chafes against their intuitions. They're right that it would flatten important distinctions - like between territorial fish suffering in crowds versus schooling fish that don't mind density. And it struggles with uncertainty about crustacean sentience where their gut says "better safe than sorry" despite low confidence.

  For bivalves and cleaner fish, any good principle needs to yield different verdicts. Oysters probably get ethical clearance under most frameworks given current evidence, while those sacrificial wrasse dying in salmon pens should trigger concern - especially since their deaths are slow and stressful. New test cases like selective breeding for deformity or anesthesia during transport will further stress-test the principles.

  The salmon farm dilemma reveals a meta-conflict: is the goal to reduce suffering per animal or reduce total suffering? Their instincts seem to prefer the former - hence embracing pain-free gene-edited fish rather than eliminating farms. That's philosophically coherent but needs explicit defense against "just don't farm fish" arguments.

  The crustacean boiling vs gene-editing tension is real, not verbal. I'd advise them to stand by the gene-editing verdict but reframe crustacean protection as precautionary - we act because the stakes of being wrong are catastrophic, not because we're confident. That keeps both intuitions alive while acknowledging evidentiary limits.

  For the magazine formulation, we need something sturdy yet accessible: "Prioritize preventing experiences that would be intolerable to endure, target interventions where consciousness is most certain, and proceed cautiously where evidence is thin but risks are high." No false certainty, no sloganeering - just their actual moral compass translated.
answer: |-
  Based on your detailed cases and reflections, here are three candidate principles designed to capture your intuitions, along with their implications. Each principle prioritizes different aspects of your verdicts, revealing trade-offs.

  **Candidate Principle 1: The Phenomenological Violation Principle**  
  *"Welfare impact is determined primarily by the intensity and nature of the experience (violation of integrity, observable distress, or inherently aversive phenomenology), weighted by the confidence in sentience. Chronic low-intensity harms are significant only when they manifest as clear behavioral pathology or frustration of strong motivations."*  
  **Motivated by:** Verdicts 1 (extreme violation/integrity damage), 2 (drawn-out intense suffering), 4 (frustrated motivation), 7 (visceral aversion), 8 (eliminating phenomenology).  
  **Implied Verdicts:**  
  *   **Bivalves (oysters/mussels):** Negligible impact (low confidence in sentience, no observable distress/pathology).  
  *   **Cleaner fish (wrasse/lumpfish):** Moderate/High impact (observable suffering/dying, high mortality).  
  *   **New Case A: Selective breeding causing chronic skeletal deformities:** High impact (persistent pain/distress likely, clear violation of function).  
  *   **New Case B: Anesthesia during transport:** Low impact (prevents intense suffering, even if stressful).  
  *   **Salmon Farm Flip-Flop:** **Welfare win** (avoids severe harms like sea lice/delousing, minimizes negative phenomenology).  
  **Overturns Your Verdicts:**  
  *   **Verdict 3 (Mild crowding in schooling fish):** *Cosmetic.* Principle deems it trivial without pathology. Your "mildly bad" aligns with the principle's low priority.  
  *   **Verdict 5 (Fasting):** *Cosmetic.* Principle confirms it "barely registers."  
  *   **Verdict 9 (Arithmetic):** *Loss of belief?* Principle explicitly rejects additive aggregation for mild chronic harms, matching your weighting. Your puzzle is resolved by the principle's core design.  
  **7 vs 8 Tension:** Genuine conflict partially resolved. Principle weights confidence (low for crustaceans in 7) but prioritizes preventing intense experiences *if* sentience is plausible. For 7, the precaution arises from the *nature* of the act (boiling alive) being inherently violative if sentience exists *at all*, justifying aversion despite low confidence. Principle 8 aligns perfectly. Advice: **Keep both.** For 7, frame the aversion as: "Given the plausible potential for horrific suffering and the availability of alternatives, this practice demands precautionary cessation, irrespective of confidence thresholds."

  **Candidate Principle 2: The Agency & Integrity Principle**  
  *"Welfare harm increases with deliberate violation of an animal's physical or behavioral integrity (infliction of damage, prevention of natural agency, frustration of intrinsic motivations) and the intensity of the resulting negative state. Duration/number are secondary modifiers."*  
  **Motivated by:** Verdicts 1 (deliberate mutilation), 2 (forced, unnatural death), 4 (frustrated motivation/agency), 6 (minimized violation), 8 (integrity preserved).  
  **Implied Verdicts:**  
  *   **Bivalves:** Negligible impact (no agency/integrity to violate).  
  *   **Cleaner fish:** High impact (violation: used as disposable tools, high suffering/death).  
  *   **New Case A: Dehorning cattle with anesthesia:** Moderate impact (violates integrity, even if pain managed).  
  *   **New Case B: Automated feeders failing intermittently:** Low impact (lack of agency violation, mild frustration).  
  *   **Salmon Farm Flip-Flop:** **Welfare win** (preserves integrity better: no delousing trauma, humane slaughter).  
  **Overturns Your Verdicts:**  
  *   **Verdict 3 (Mild crowding, schooling):** *Cosmetic.* No significant agency violation.  
  *   **Verdict 5 (Fasting):** *Cosmetic.* Minor, routine management, not a deliberate violation.  
  *   **Verdict 7 (Boiling alive):** *Loss of belief?* Principle strongly condemns it as a severe violation of integrity. Your 40% confidence isn't the *source* of the verdict here; the *act itself* is the violation. Your physical reaction aligns.  
  *   **Verdict 9 (Arithmetic):** *Resolved.* Principle explicitly subordinates duration/number to violation/intensity.  
  **7 vs 8 Tension:** Minimal conflict. 7 is condemned as a severe violation *if* the entity has any claim to integrity/sentience (precaution applies). 8 is praised because it removes the capacity for suffering *while preserving function and agency*. The principle focuses on the *act* and its *effect on the animal's state*, not the absolute certainty of sentience.

  **Candidate Principle 3: The Precautionary Suffering Minimization Principle**  
  *"Minimize practices causing intense suffering, distress, or observable harm, prioritizing certainty of sentience. Treat plausible risks of severe suffering (where sentience evidence exists, even if incomplete) with strong precaution. Aggregate mild harms over time/number matter only when they constitute a significant welfare burden based on behavioral evidence."*  
  **Motivated by:** Verdicts 1 (intense, certain harm), 2 (intense suffering), 4 (observable distress), 7 (precaution despite uncertainty), 8 (eliminates suffering), 9 (limits aggregation).  
  **Implied Verdicts:**  
  *   **Bivalves:** Very Low impact (low confidence, no intense suffering possible).  
  *   **Cleaner fish:** High impact (high mortality/suffering, high confidence).  
  *   **New Case A: Overcrowding leading to fin erosion/fighting:** High impact (observable harm/distress).  
  *   **New Case B: Brief handling stress for health checks:** Low impact (intensity low, duration short).  
  *   **Salmon Farm Flip-Flop:** **More animals being bred/killed** (The *minimized* suffering per fish might be offset by creating *more* fish experiencing *any* suffering vs. not existing. Principle focuses on *suffering minimization*, not per-animal welfare perfection).  
  **Overturns Your Verdicts:**  
  *   **Verdict 3 (Mild crowding, schooling):** *Cosmetic.* Confirms low priority absent pathology.  
  *   **Verdict 6 (Humane slaughter):** *Cosmetic.* Confirms low impact.  
  *   **Verdict 8 (Gene-edited):** *Loss of belief?* Principle strongly supports it as suffering minimization. Your "triumph" aligns.  
  **7 vs 8 Tension:** Genuine conflict. For 7, precaution demands acting *as if* sentience is likely due to the *severity* of potential suffering. 8 actively *removes* the capacity for suffering. The principle accommodates both: Precaution stops severe *potential* suffering (7), while gene-editing stops *actual* suffering (8). Advice: **Keep both.** Justify 7 precaution based on severity-of-risk, not confidence-level alone.

  **Recommendation & Magazine Formulation**

  *   **Recommended Principle:** **Candidate Principle 2 (Agency & Integrity)** best captures the *pattern* and *weighting* of your verdicts (especially 1, 4, 6, 7, 8) while resolving the arithmetic tension (9). It makes your aversion to boiling (7) coherent without demanding high confidence and aligns with your view of gene-editing (8) as preserving something valuable. The salmon farm verdict aligns with your lean towards "welfare win."
  *   **Overturned Verdicts:** Only cosmetic (3, 5). Your core concerns (1, 2, 4, 7) are central to this principle. It resolves the 7/8 tension meaningfully.
  *   **Magazine Formulation (Based on Principle 2):**  
      *"Prioritize preventing severe suffering and practices that deliberately violate an animal's physical integrity or frustrate its core motivations. Where evidence for sentience exists, apply strong precaution against causing intense distress, recognizing that the nature of the harm matters as much as the number of animals affected."*  
      *   **Why it works:** Avoids slogans ("sentience", "rights", "utilitarianism"). Acknowledges evidence without overclaiming (plausible risk, precaution). Captures intensity/integrity focus ("severe suffering", "violate integrity", "frustrate core motivations"). Explains non-additivity ("nature of the harm matters as much as the number"). Applies to crustaceans implicitly via precaution.

  **Key Takeaways for Your Piece**

  1.  **Honesty about Weighting:** Explicitly state you prioritize preventing intense suffering and deliberate violations of integrity over aggregating mild discomforts, even when many animals are affected.
  2.  **Resolving Crustacean Tension:** Frame opposition to practices like eyestalk ablation and live boiling not on absolute proof of sentience, but on the *inherently violating nature* of the acts and the *plausible risk of severe suffering* given the evidence we *do* have. Gene-editing is positive because it eliminates suffering *while respecting functional integrity*.
  3.  **Address the Salmon Farm:** Using Principle 2, argue it *is* a welfare win that displaces worse systems, significantly reducing the per-animal burden of suffering and violation compared to conventional aquaculture. The creation of new life is secondary to the *quality* of life and death provided.
  4.  **Arithmetic Acknowledgment:** Briefly note that while the sheer scale of mild chronic suffering is a concern, the most urgent reforms target practices causing acute, intense suffering and clear violations of welfare.
