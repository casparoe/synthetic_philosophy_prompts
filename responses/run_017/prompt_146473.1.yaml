answer: |-
  ## Joint Statement: Knowledge-Norm vs. Reasonableness Theories of Assertion

  **1. Shared Commitments**

  1.  **Assertion's Core Function:** Both agree that the distinctive function of assertion is to *present a proposition as true*, thereby offering it for acceptance and potential incorporation into the audience's belief system or practical reasoning. This distinguishes it from conjecturing, opining, supposing, or commanding.
  2.  **Condemned Core Cases:** Both camps condemn assertions made:
      *   With no evidence ("It will rain tomorrow because I flipped a coin").
      *   While believing the proposition is false (bald lies).
      *   While possessing strong evidence *against* the proposition.
      *   Where the speaker possesses only weak, irrelevant, or improperly gathered evidence. These are clear violations of *some* epistemic norm governing assertion.
  3.  **Nature of the Disputed Norm:** The dispute concerns the *distinctive epistemic norm* governing assertion. This is a norm of *permissibility* or *defectiveness* specific to the speech act of asserting itself, judged primarily from the epistemic perspective of the speaker at the time of utterance. It is conceptually distinct from (though potentially related to) norms of moral blameworthiness, legal liability, or prudential wisdom governing communication. A defective assertion can be morally blameless and vice-versa.
  4.  **Sufficiency of Knowledge:** Both agree that *if* a speaker knows that p, then she is epistemically positioned well enough to assert that p. Knowledge is sufficient for permissible assertion.
  5.  **Epistemology of Testimony/Reliance:** Both agree that hearers are typically entitled to form beliefs based on assertions in the absence of defeaters, grounded in the default assumption that speakers comply with the norm of assertion. Both also agree that the speaker’s responsibility is primarily for the *epistemic quality of her utterance at the time of making it*, not for guaranteeing the truth of p indefinitely or under unforeseen future circumstances. However, both recognize that downstream reliance, especially in durable contexts, creates significant derivative responsibilities.
  6.  **Concession to Reasonableness:** The Knowledge-Norm (KN) theorist concedes that the Reasonableness (R) theorist correctly identifies a *necessary condition* for permissible assertion: the speaker *must* have sufficient evidence to make her confidence reasonable (i.e., meet the contextually set threshold). Asserting without reasonable confidence is impermissible.
  7.  **Concession to Knowledge-Norm:** The R theorist concedes that knowledge is the *ideal* epistemic position for assertion, and that assertions meeting the KN are paradigmatically permissible and robust. They also concede that in many standard contexts, meeting the KN and meeting the reasonableness threshold coincide.
  8.  **Apparent Agreement: "Reasonableness":** This is potentially fake agreement. The R theorist uses "reasonable confidence" as the *fundamental* norm-satisfier. The KN theorist acknowledges assertions can be *excusable* or *blameless* without knowledge, perhaps even describable as "reasonable" in a loose sense, but insists they remain *defective* as assertions because they violate the constitutive norm. The KN theorist thus interprets "reasonable" in (6) as a necessary component *for* knowledge or a symptom of its possibility, not as the norm itself.

  **2. Disagreements Table**

  | # | Knowledge-Norm Theorist's Claim                                                                 | Reasonableness Theorist's Claim                                                                                               | Note                                                                                                                                                                                               |
  | :-- | :---------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1. | S may assert that p **only if** S knows that p.                                                 | S may assert that p **if** S's confidence in p, given her total evidence, meets the contextually salient epistemic threshold. | **Core Substantive Dispute:** What is the *sufficient condition* for permissibility? KN: Only knowledge suffices. R: Reasonable confidence suffices, even without knowledge.                          |
  | 2. | Assertions made in **Gettier cases** (JTB without knowledge) are **epistemically defective.** | Assertions made in **Gettier cases** are **epistemically permissible**; the speaker has justified, true, reasonable confidence. | **Substantive:** Disagreement over whether epistemic luck inherent in Gettierization vitiates the permissibility of the assertion itself.                                                           |
  | 3. | Asserting "Ticket #n has lost" in a **fair lottery** (based only on odds) is **impermissible.** | Asserting "Ticket #n has lost" in a **fair lottery** is **permissible** if the odds make confidence sufficiently high.      | **Substantive:** Disagreement over whether extremely high probability based on purely statistical grounds suffices for permissible assertion. KN denies it constitutes knowledge. R allows it.        |
  | 4. | The norm "Assert only what you know" is **constitutive** of assertion; violating it means one hasn't *fully* asserted. | The norm "Assert only with reasonable confidence" is **regulative**; violating it makes the act defective, but still an assertion. | **Verbal/Conceptual?** Underlying question: Is the *identity* of the speech act as an assertion dependent on complying with its core epistemic norm? Or is the norm merely a standard it *should* meet? |
  | 5. | **"I don't know that p, but p"** is always a **pragmatically defective/moore-paradoxical** utterance. | **"I don't know that p, but p"** can be **felicitous** if S has reasonable confidence sufficient for assertion but acknowledges not knowing. | **Diagnostic:** Reflects core disagreement. KN sees contradiction (asserting p requires knowing p). R sees coherent expression of high confidence falling short of knowledge.                         |

  **3. Cruxes (Ranked by Perceived Impact on Dispute)**

  1.  **Does the distinctive norm of assertion inherently involve an audience/reliance component, or is it purely speaker-side?** (High Impact) *Justification:* The user's durable record case highlights this. If the norm is purely about the speaker's state *at utterance*, durable records pose less intrinsic problem for KN. If the norm inherently considers *uptake* and *reliance*, R has a stronger footing for emphasizing reasonable confidence in contexts where future reliance is predictable.
  2.  **Is the normative unit the momentary speech act or the whole epistemic transaction?** (High Impact) *Justification:* Crucial for durable records and institutional practices. KN strongly favors the momentary act. R is more compatible with viewing the assertion as part of a longer chain of epistemic responsibility, potentially making downstream reliance relevant to the initial norm.
  3.  **Is the norm constitutive or regulative?** (Moderate Impact) *Justification:* While potentially verbal (Row 4), the *rhetorical force* of the constitutive claim underpins KN arguments about defectiveness (Rows 2,3,5). If regulative, R's "high confidence is sufficient" gains plausibility.
  4.  **What kind of data settles assertion norms?** (Moderate Impact) *Justification:* Disagreement on whether case intuitions (esp. lottery/Gettier), linguistic felicity (e.g., Row 5), practices of criticism ("How do you know?"), retraction norms, or hedging behavior are decisive. KN leans heavily on intuitions of defectiveness in cases lacking knowledge. R points to permissibility intuitions in lottery cases and the functionality of reasonable-confidence-based assertions in practice.
  5.  **Do R's counterexamples (Gettier, Lottery) only work against a decompositional JTB+ account of knowledge?** (Moderate Impact) *Justification:* KN claims their unanalyzed knowledge concept avoids these. R argues the counterexamples reveal that knowledge *itself* isn't necessary for permissible assertion, regardless of its analysis – the unanalyzed state missing in Gettier/lottery cases isn't required for proper asserting.
  6.  **What is the role of context?** (Lower Impact) *Justification:* While both acknowledge context (e.g., stakes), KN sees it primarily affecting *whether* to assert known p. R sees context as setting the *threshold* for the reasonable confidence sufficient for assertion.

  *(Closure arguments were dropped as both sophisticated camps have resources to handle them without directly impacting the core assertion-norm dispute.)*

  **4. Tests & Predictions (Including User Cases)**

  1.  **Test (Audience Component):** Imagine a solitary diarist, writing assertions only for their own future eyes, with no possibility of interpersonal reliance. KN predicts: Norm remains "assert only what you know," as defining the speech act. R predicts: The norm weakens or dissolves; writing "I think p" or asserting based on lower confidence might be permissible since no one else relies. *User's Durable Record Relevance:* KN sees writing governed by same norm; defect attaches only later if record is misleadingly used. R sees potential for the predictable future reliance to raise the threshold for the initial assertion.
  2.  **Test (Normative Unit):** An expert asserts p to a colleague based on strong-but-imperfect evidence (reasonable confidence, not knowledge). The colleague immediately relies on it for a high-stakes decision. p turns out true, but the evidence had a flaw no one detected. KN predicts: Assertion was permissible if expert knew p, defective if not – colleague's reliance doesn't change the assertion's status. R predicts: Assertion was permissible due to reasonable confidence – the flaw, while unfortunate, doesn't make the assertion itself defective. *User's Batch Release Relevance:* KN: Signature requires knowing the universal claim (often impossible in practice). R: High reasonable confidence suffices.
  3.  **Test (Constitutive/Regulative):** Imagine a community where speakers regularly preface assertions with "I don't know this for sure, but..." and proceed to state p based on strong evidence. Are they performing defective assertions, or a different but legitimate speech act? KN predicts: These are inherently defective/moore-paradoxical attempts at assertion, or a distinct act like "confident conjecture". R predicts: These are permissible assertions, appropriately hedged for the confidence level. *User Case Relevance:* Affects how both view institutional reports based on high probability.
  4.  **Test (Data - Lottery):** Is the assertion "Your single ticket in this large, fair lottery has lost" permissible *before* the draw? KN predicts: No (lacks knowledge). R predicts: Yes (sufficiently high probability).
  5.  **Test (Data - Hedging):** How do speakers naturally hedge assertions when they have strong but non-conclusive evidence? KN predicts: Hedges signal lack of knowledge ("I believe", "It's very likely"). R predicts: Hedges signal confidence level relative to context ("I'm almost certain", "Based on the data, it's highly probable"). *Prediction:* Observational study confirms R prediction more strongly.
  6.  **Test (User's Durable Record):** Radiologist knows p, writes "no haemorrhage". 18mo later, ED relies. KN predicts: Writing was permissible assertion (knew p). Any problem lies with record system (lack of dating/expiry) or ED reliance (should have checked date/context). R predicts: Writing was permissible. Potential problem lies in system design not mitigating foreseeable outdated reliance, not in the original assertion's norm-compliance.
  7.  **Test (User's Batch Release):** Lab director signs universal claim based on reliable sensors with known, tiny gap risk (high confidence <1). KN predicts: Assertion (signing) is **impermissible.** She cannot *know* the universal claim is true (possible gap). R predicts: Assertion is **permissible.** Confidence clears the threshold for such institutional reporting. **Institutional Practice Relevance:** KN must argue much institutional reporting is defective or reinterpreted (as non-assertoric "certifications based on best evidence"). R argues KN sets an unrealistically high bar for common, necessary practices.

  **Verdict & Commitments**

  *   **Overall Verdict (Confidence: 70%):** The **Reasonableness camp has the better case.**
  *   **Crux of Decision:** Won primarily on **Crux 2 (Normative Unit)** and the **Data from Institutional Practices & Hedging (Crux 4)**.
      *   *Why Crux 2?* The KN theorist's strict focus on the momentary speech act and speaker's state at t0 struggles to coherently integrate the predictable epistemic lifespan of assertions, particularly in durable records and institutional reporting (Batch Release). The R view, allowing the norm to inherently consider the *typical function* of assertion (including foreseeable reliance), provides a more natural account of why high-confidence assertions in these contexts feel permissible and are functionally necessary, even if knowledge is absent. KN must relegate all downstream issues to separate norms, making the core assertion norm seem disconnected from the social practice it governs.
      *   *Why Data?* Intuitions about lottery assertions are contested. However, the sheer volume and apparent legitimacy of high-confidence-but-non-knowledge-based assertions in science, medicine, engineering, and bureaucracy (like the Batch Release) provide compelling *pragmatic* evidence against KN's strict requirement. Furthermore, natural hedging practices align better with signaling confidence levels relative to context than simply signaling the presence/absence of an unanalyzed "knowledge" state.
  *   **Contested Reading:** This verdict assumes that the R theorist's "contextually salient epistemic threshold" can be robustly characterized without collapsing into triviality or excessive subjectivity – an assumption some KN theorists strongly contest. I find the R theorist's appeal to stable features of context (stakes, available evidence, institutional roles) sufficient for this purpose.
  *   **Unsettled Question:** The precise relationship between reasonable confidence and knowledge remains murky. Is reasonable confidence a *component* of knowledge, or entirely distinct? My verdict doesn't require settling this.
  *   **What Would Change My Mind?** Evidence that cultures/languages consistently treat utterances like "I don't know, but [high-confidence claim]" as *inherently contradictory or defective* in the way KN predicts (supporting the constitutive claim and undermining R's view of such assertions). Or, a demonstration that institutional practices relying on high-confidence assertions consistently break down in ways attributable *specifically* to the lack of knowledge, rather than other factors like poor evidence gathering or miscommunication.
  *   **Regarding User Cases:** The Durable Record case reinforces the importance of Crux 2. The Batch Release case is a powerful practical argument against KN, demonstrating that its strict requirement renders vast swathes of necessary institutional practice defective. KN's response – that these are not genuine assertions or are governed by different norms – feels ad hoc and fails to capture the assertoric force these acts carry within their contexts. R provides a more straightforwardly permissible account.
