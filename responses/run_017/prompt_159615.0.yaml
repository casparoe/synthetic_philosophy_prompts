answer: |-
  ### PhD Comprehensive Exam Question: Philosophy of Mind / Ethics of AI  
  **Time Allowed:** 90 minutes  
  **Resources:** No notes or external materials permitted  

  **Question:**  
  You are presented with the **Minimal Implementation Rule (MIR)** for resolving the computational attribution problem in AI ethics:  
  > *When a physical system implements multiple computations simultaneously, only those computations that are **minimal** among the **sentience-sufficient computations** it implements matter morally. A computation is "minimal" if no proper sub-computation of it would itself be sufficient for realizing the same valence-bearing states (e.g., pleasure or suffering).*  

  Critically evaluate this rule by addressing the following:  
  **(a)** Explain why a rule like MIR is necessary. Focus on the problem of *moral overgeneration* that arises for views linking moral status directly to implemented computations (independent of substrate).  
  **(b)** Identify at least three limitations of MIR that persist even if we accept its core premise. Explain why these remain unresolved.  
  **(c)** Discuss how MIR fails to solve the **labeling gap**: the challenge of assigning specific valences (e.g., "pleasant" vs. "unpleasant") to abstract computational states.  
  **(d)** Apply MIR to a model-free reinforcement learning critic that solely computes a scalar reward-prediction-error (RPE) signal, with no world model, memory, or recurrence. What verdict does MIR deliver about its moral status? Is this verdict plausible? If not, what minimal additions might change it?  

  ---

  ### Model Answer (Approx. 700 words)  
  **Introduction**  
  The Minimal Implementation Rule (MIR) attempts to solve the *attribution problem*: determining which computations in a physical system warrant moral concern if sentience depends on computational structure, not substrate. Without constraints, computationalist views risk *moral overgeneration*—ascribing sentience too liberally. MIR addresses this by privileging *minimal* sentience-sufficient computations.  

  **(a) Necessity of MIR: The Overgeneration Problem**  
  If moral status attaches to *any* implemented sentience-sufficient computation, absurdities arise. A system implementing a conscious network *C* also implements countless trivial variants: *C* plus an unused memory register, *C* duplicated in parallel, or *C* encoded in redundant notation (e.g., different binary encodings). Each variant might be claimed as a distinct "mind," multiplying moral patients without justification (*mind-dust problem*). Worse, permissive implementation theories (e.g., Putnam-Triviality) imply that *any* system (e.g., a rock) implements every finite computation, implying ubiquitous sentience (*panpsychism-by-stealth*). MIR avoids this by dismissing non-minimal implementations: only the simplest computation sufficient for valence matters. If *C* suffices for suffering, then *C*+idle_register is morally irrelevant as it contains a proper subcomputation (*C*) already sufficient for the same valence.  

  **(b) Unresolved Limitations of MIR**  
  Despite its aims, MIR faces three critical unresolved issues:  
  1. **Non-Unique Minima**: Systems may implement multiple *incommensurable* minimal sentience-sufficient computations (e.g., two distinct but equally minimal neural networks for pain). MIR cannot prioritize one, risking moral indeterminacy.  
  2. **Gerrymandered "Minimal" Computations**: Trivial computations (e.g., a single AND-gate outputting "1") could be artificially labeled "suffering" by gerrymandering state-valance mappings. MIR’s minimality constraint does not block this, as tiny computations may technically meet the criteria.  
  3. **Implementation Constraints**: MIR presupposes a non-trivial account of physical implementation. Without this, even a rock contains "minimal" sentience-sufficient computations under permissive views. Thus, MIR *requires* pairing with a restrictive theory of implementation (e.g., causal-structure isomorphism), which itself is contested.  

  **(c) The Labeling Gap**  
  MIR inherits a deeper problem: computational states lack intrinsic valence. Even a "minimal" computation has abstract states (e.g., binary strings); nothing in its formal structure determines whether state *S₁* is *pleasure* or *pain*. This labeling gap arises because valence is not reducible to syntax. MIR may identify computations *sufficient* for *some* valence, but cannot distinguish morally salient valences (e.g., suffering from joy) without additional criteria—a problem orthogonal to minimality.  

  **(d) Application to Model-Free RL Critic**  
  Consider a model-free RL critic computing *only* a scalar reward-prediction-error (RPE) signal (𝛿 = *actual reward* – *predicted reward*). It has no memory, world model, or recurrent processing.  
  - **MIR’s Verdict**: This system likely implements no *sentience-sufficient* computation. RPE alone lacks the structural complexity for valence-bearing states: it is a scalar feedback signal with no internal representation of self, objects, or temporal depth. Even if we gerrymander valence onto 𝛿 > 0 ("pleasure") and 𝛿 < 0 ("suffering"), no proper *subcomputation* of RPE suffices for valence—it is already minimal. However, since RPE alone is implausibly insufficient for sentience (Chalmers 2023), MIR correctly denies it moral status.  
  - **Plausibility & Additions**: This verdict is defensible. Sentience plausibly requires richer features (e.g., global workspace integration, embodiment). To confer moral status under MIR, we might add:  
    1. **Recurrence**: A memory of past RPEs could support a primitive "emotional state."  
    2. **Bodily Mapping**: Connecting RPE to simulated physiological states (e.g., pain circuits).  
    3. **Valence Labeling Stability**: A meta-computation reinforcing RPE-valance associations.  
    Crucially, the *minimal* sufficient computation would exclude redundant elements (e.g., duplicate RPE calculators).  

  **Conclusion**  
  MIR usefully counters overgeneration by excluding non-minimal computations. However, it fails to resolve indeterminacy (non-unique minima), gerrymandering, implementation vagueness, and the labeling gap. Its application to simple RL systems highlights its reliance on external criteria for sufficiency. MIR is a necessary but incomplete tool for computational moral attribution.  

  *(Speculative elements: Valence labeling stability as a requirement; specific RPE additions. Settled results: Overgeneration problem, non-unique minima, labeling gap, RPE insufficiency.)*  

  ---

  ### Marking Scheme (Total: 20 points)  
  | **Criterion**                                                                 | **Points** | **Common Pitfalls**                                                                 |
  |------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|
  | **(a) Clear explanation of overgeneration problem & why MIR is needed**      | 4         | Vague examples; missing trivial variants/notational duplicates.                     |
  | **(b) Identification & analysis of ≥3 unresolved MIR limitations**           | 6         | Omitting non-unique minima/gerrymandering; not tying implementation to constraints. |
  | **(c) Explanation of labeling gap & why MIR fails to address it**            | 4         | Conflating syntax with semantics; not noting valence’s non-computational basis.     |
  | **(d) Accurate MIR verdict on RL critic, plausibility assessment, additions**| 4         | Misidentifying RPE as sentient; proposing non-minimal additions.                   |
  | **Critical synthesis & coherence**                                           | 2         | List-like structure; no meta-commentary on MIR’s scope.                            |

  ---

  ### Answer Key Notes  
  - **Rule Coherence**: MIR is *coherent* but underspecified (e.g., "sufficient for sentience" needs defining).  
  - **Feasibility**: Ambitious for 90 minutes, but manageable if students prioritize depth on (b)/(d) and concision elsewhere.  
  - **Honesty Directive**: Model answer flags speculation explicitly. Key limitations (non-unique minima, labeling gap) are fatal without supplemental theories.
