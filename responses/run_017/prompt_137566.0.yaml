  ### Primitives Mapping: Candidates for Match and Mismatches
  **Epistemic Game Theory Primitives**  
  - **Belief**: Probability distribution over opponents' strategy profiles.  
    *Candidate match*: **Opponent model** (latent embedding predicting opponents' policies). *But*: Your opponent model is typically a point estimate or conditioned on a latent state, not a full distribution over the joint policy space. **Mismatch** on distributional scope.  
  - **Rationality**: Playing a best response to one's belief.  
    *Candidate match*: **Best response / exploitability** (policy maximizing reward given opponents). *But*: You use *approximate* best responses and measure exploitability as a gap. **Distorted match** due to approximation.  
  - **Best response**: Strategy maximizing expected payoff given a belief.  
    *Clean match*: **Best response** in your framework (modulo approximation).  
  - **Strictly dominated by a mixture**: A strategy is strictly worse than some mixed strategy against *all* opponent profiles.  
    *Candidate match*: None. Your "domination" checks are against a **population/training distribution**, not *all possible* opponents. **Fundamental mismatch** (your population is a subset; epistemic version is universal).  
  - **Elimination round**: Removing strategies dominated in the current game.  
    *Candidate match*: **PSRO-like iteration** (adding policies to counter a population). *But*: PSRO expands the population; epistemic elimination restricts the strategy set. **Partial match** with inversion of logic.  
  - **Common belief**: Infinite hierarchy of "I believe you believe in rationality...".  
    *No match*: Your framework has no representation of nested beliefs. **Untranslatable**.  

  **MARL Primitives**  
  - **Policy**: Strategy for an agent.  
    *Clean match*: Strategy in game theory.  
  - **Joint policy**: Tuple of policies.  
    *Clean match*: Strategy profile.  
  - **Opponent model**: Latent embedding predicting opponents.  
    *Partial match*: **Belief**, but beliefs in game theory are full distributions; your model is amortized and often correlation-prone. **Distorted match**.  
  - **Best response / exploitability**: ≈0 exploitability iff best response.  
    *Clean match*: Best response in game theory.  
  - **Population**: Distribution of policies agents face.  
    *Candidate match*: **Belief support**, but population is fixed; belief can be arbitrary. **Mismatch** on flexibility.  
  - **Training distribution**: Environment generating opponents.  
    *No epistemic match*: Game theory assumes no "training data" bias. **Untranslatable assumption**.  
  - **Correlation device**: Shared randomness for coordination.  
    *Clean match*: Correlation device in correlated equilibrium.  

  ### Restated Argument in MARL Terms
  **(a) First-round deletion (rationality alone)**:  
  A policy $\pi$ is **strictly dominated by a mixture** of your other policies if, for *every possible* joint policy of opponents, some mixture of your policies beats $\pi$. In your terms: $\pi$ has higher exploitability than the mixture *regardless* of the opponents' policies.  
  - *Translation*: If $\pi$ is strictly dominated by a mixture, then no opponent model (latent embedding or policy distribution) exists where $\pi$ is a best response. Rationality (playing a best response) forbids $\pi$, even without assumptions about others.  

  **(b) Further rounds (adding belief hierarchies)**:  
  After deleting dominated policies, restrict opponents' policies to the remaining set. Now delete policies dominated *in this restricted set*.  
  - *Round 1*: "I believe opponents are rational" → Opponent models assign probability only to policies surviving the first round.  
  - *Round n*: "I believe opponents believe in rationality up to level n-1" → Opponent models assign probability only to policies surviving round n-1.  
  - *Translation*: Each iteration of PSRO (where you train a best response to the current population) implicitly assumes the population policies were "rational" against earlier populations. But epistemic elimination explicitly *removes* policies, while PSRO *adds* them. **Distortion**: PSRO grows the population; epistemic elimination shrinks the strategy set.  

  **(c) Fixed point (common belief in rationality)**:  
  The surviving policies are those playable when:  
  - You are rational.  
  - You believe opponents are rational.  
  - You believe opponents believe in rationality, ad infinitum.  
  - *Translation*: The converged population in PSRO (if it reaches a stationary set) where all policies are best responses to the population. But common belief requires the hierarchy to hold *infinitely*, while PSRO terminates finitely. **Distortion**: Finite-depth best response ≠ infinite common belief.  

  ### Your 3-Player Example: The Correlated Belief Issue  
  - **"Anti" survives epistemic elimination**:  
    It is a best response to the *correlated* belief (50% Bob plays (u,r), 50% Cara plays (d,l)). Since it's not strictly dominated by any mixture (due to this belief), epistemic elimination keeps it.  
  - **"Anti" is eliminated under independent beliefs**:  
    For any *product distribution* (Bob and Cara independent), "anti" is strictly beaten by "safe", "match", or a "hard" policy. If epistemic elimination required independence, "anti" would be deleted.  
  - **Conclusion**:  
    Epistemic elimination **secretly assumes agents hold correlated beliefs** (joint distributions over opponents). The mixture-domination criterion is equivalent to "never a best response to *any* belief (correlated or independent)". Your example exposes this: the procedure only makes sense if agents model opponents with correlation. **There is no standard deletion procedure for independent beliefs**—product distributions break the equivalence between "never a best response" and "strictly dominated".  

  ### Residue Report  
  **What translates cleanly?**  
  - (a) "Strictly dominated ⇒ never a best response" holds in both frameworks.  
  - Best response / exploitability as a core primitive.  
  - Correlation devices (if used) map directly.  

  **What distorts?**  
  - (b) Iterative deletion vs. PSRO:  
    - Elimination **removes policies**; PSRO **adds policies** to a population.  
    - "Belief in rationality" translates to **"best response to a population"**, but the population is finite and growing, not the full strategy set.  
  - (c) Common belief:  
    - The infinite hierarchy **collapses to finite best-response chains** (e.g., "I train against agents that trained against me"). This is a lossy compression.  
  - Opponent models:  
    - Your latent embeddings **allow correlation** (like epistemic beliefs), but if you enforce independence (e.g., factorized opponent models), it diverges from epistemic foundations.  

  **No expression in your vocabulary:**  
  - **Common belief hierarchy**: Your agents don’t reason about "what they believe about others' beliefs". PSRO’s meta-game best responses approximate a *finite* hierarchy, but the infinite regress is untranslatable.  
  - **Universal quantification over opponents**: Epistemic domination requires checking *all possible* opponent policies; you only check against a **population/training distribution**.  
  - **Exact rationality**: Epistemic results rely on *exact* best responses; your exploitability is always >0.  

  **Does your framework’s lack of belief hierarchies matter?**  
  - **Not for most engineering purposes**. The infinite hierarchy is a mathematical idealization. In practice, finite-depth best responses (e.g., 2–3 rounds of PSRO) suffice for many games. However, it *is* a hole if you care about:  
    - Games requiring high-depth reasoning (e.g., Keynesian beauty contests).  
    - Theoretical convergence guarantees (common belief justifies iterated deletion as the "rational" solution).  
    - If your agent’s policy space implicitly encodes beliefs (e.g., via recurrent states), you *might* approximate hierarchies, but it’s not explicit.  

  **Does approximation break the translation?**  
  - **Yes, catastrophically for exact results**, but not for intuition.  
    - Epistemic elimination requires **strict domination** (ε > 0 gap everywhere). With approximate best responses:  
      - A policy may survive if your optimizer misses a dominating mixture.  
      - "ε-Best responses" could retain dominated policies.  
    - **Non-stationarity** invalidates all epistemic assumptions (beliefs become outdated).  
    - *However*: The core idea—"avoid policies that are never good, iterate rationality assumptions"—is robust. PSRO works precisely because it approximates this.  

  ### Final Takeaways  
  - **Correlated beliefs are load-bearing**: Your example proves epistemic elimination assumes agents model opponents jointly. If your opponent model uses a shared latent state (e.g., attention over agents), it aligns with this. If you enforce independence, you diverge.  
  - **No independent-belief deletion**: Product distributions break "dominated ⇏ never best response". To enforce independence, you’d need custom procedures (e.g., delete policies not best responses to any product distribution), but this lacks epistemic justification.  
  - **Approximation is unavoidable**: Exact optimality is dead in MARL. Focus on **practical substitutes**:  
    - Use PSRO to approximate iterated rationality.  
    - Measure exploitability against a *diverse population* as a proxy for "domination in practice".  
    - Explicitly model correlation (e.g., via centralized critics) to align with epistemic foundations.  
  - **Should you care about the hierarchy?**: Only if you need interpretable rationality guarantees. For performance, finite-depth PSRO is sufficient.
