prompt: |-
  I am writing the specification section of a proposal on side-effect penalties for autonomous systems, and I need its core stated properly: the requirements list. Fix the setup as follows. We have an agent whose assigned objective we do not fully trust and cannot fully specify. We add to that objective a penalty term — an impact measure — keyed to the difference the agent's behaviour makes to the world, with the aim of making the agent prefer routes to its goal that leave most of everything else as it would otherwise have been. The measure is to be specified without first solving the whole problem of value; that is the entire point of the exercise. What I want from you is the desiderata: what any impact measure has to get right to count as an adequate answer to the side-effects problem for an agent of this kind.

  Give me the criteria, not a survey of proposals. For each requirement, state the case or consideration that makes it a requirement, concretely enough that a candidate measure can be tested against it, and mark whether it is constitutive of the problem (relax it and you are no longer doing low-impact AI at all) or a preference internal to one research programme. Among the cases I expect a serious list to handle, and which you should treat as prompts rather than as a checklist to fill in: the ordinary one, where getting the coffee involves breaking what was on the shelf; the case where the counterfactual of doing nothing is itself the bad outcome, so that fidelity to the baseline forbids the rescue; the compensation case, where the agent breaks something and then restores a qualitatively identical state, and an endpoint-only measure scores zero; the laundered baseline, where the agent first degrades what would have happened had it not acted, so that its actual path looks impact-free by comparison; delegation and boundary-shifting, where the effect is produced by a second system the agent arranges for, or by reclassifying part of the world as part of the agent; the delayed leak, where the effect surfaces only after the penalty window has closed; the many-small-hands case, where a thousand agents each keep their own measured impact negligible while the aggregate is enormous; and the correction case, where impact-minimisation turns into a reason to resist being switched off, modified, or overridden — or, symmetrically, a reason to switch itself off. I also want the distinctions an adequate measure must respect rather than collapse: causing versus merely allowing, reversible versus irreversible, harm versus mere difference, changing the world versus changing someone's option set, and the impact of an action versus that of a policy or plan.

  Two further constraints belong in the list, and I want your view on how demanding they really are. First, that the measure penalise rather than prohibit: the constraint should be tradeable, so that a large-enough stakes can still motivate an impactful course, but not so slack that it licenses anything. Second, that it be computable from the agent's own epistemic situation, without presupposing the true dynamics of the environment or a privileged unit and threshold for "how much impact is too much."

  Now the part I most want. Tell me which subset of these desiderata you take to be jointly unsatisfiable, and argue it: if value-agnosticism, resistance to gaming via the counterfactual and via delegation, non-paralysis, and insensitivity to how the goal is designated cannot all be had together, say which one gives, what relaxing it costs, and whether what survives is still recognisably a solution to the original problem or has quietly become a partial theory of value. Also identify the single requirement that does the most work in excluding candidate measures, and say why that one rather than its neighbours. Where a requirement turns out to be untestable without assuming what it was meant to establish, say so explicitly rather than listing it alongside the others.

  If it is cheap to do, close with a few lines scoring the main families of measure against the list — deviation-from-a-baseline-counterfactual, reachability or option-set size, preservation of attainable value for a set of probe objectives, and fixed whitelists or hard constraints on designated state features — describing each operationally rather than by name. Keep that part short; the criteria are the deliverable. Do not cite papers or assemble a reading list: I want the argument made from the cases and from the structure of the problem.
reasoning: |-
  We are constructing a set of desiderata for an impact measure in autonomous systems. The goal is to penalize side effects without requiring a full theory of value. The measure should encourage the agent to minimize changes to the world that are not necessary for its objective, but without prohibiting necessary changes.

  We consider the following cases as prompts to derive requirements:

  1. Ordinary case: Breaking the shelf to get coffee.
  2. Rescue case: Inaction leads to a bad outcome, so acting is necessary but changes the baseline.
  3. Compensation: Breaking and then restoring an identical state (should not be zero impact).
  4. Laundered baseline: Degrading the baseline to make the actual path look low-impact.
  5. Delegation and boundary-shifting: Having another system cause the impact or reclassifying part of the world as the agent.
  6. Delayed leak: Impact occurs after the penalty window.
  7. Many-small-hands: Many agents each with negligible impact but aggregate impact is large.
  8. Correction case: Impact minimization becomes a reason to resist being switched off or modified.

  Distinctions to respect:
  - Causing vs. allowing
  - Reversible vs. irreversible
  - Harm vs. mere difference
  - Changing the world vs. changing option sets
  - Impact of an action vs. policy

  Additional constraints:
  A. Penalize, not prohibit: tradeable constraint (large stakes can justify impact, but not too slack).
  B. Computable from the agent's epistemic situation (without true environment dynamics or privileged impact threshold).

  We must also identify:
  - Which subset of desiderata is jointly unsatisfiable?
  - Which requirement does the most work in excluding candidates?
  - Where a requirement is untestable without circularity.

  Finally, we will briefly score main families of measures.

  Let's list the desiderata (requirements) one by one.

  ### Desiderata List

  1. **Value-Agnosticism (Constitutive)**  
     The measure must not require a full specification of value. It must be defined without solving the problem of what is good or bad. This is constitutive because the entire point is to avoid having to specify values.  
     *Testability*: The measure should not rely on a predefined utility function over states or events that captures human values. It should be based on structural features of the world.

  2. **Counterfactual Fidelity (Constitutive)**  
     The measure must be defined relative to a counterfactual baseline (what would have happened if the agent had done nothing). The penalty is keyed to the difference the agent makes relative to that baseline.  
     *Testability*: In the ordinary case, breaking the shelf must register as a positive impact (penalty). In the rescue case, if the baseline is bad, then acting to change it should not be penalized (or minimally) for that change. However, note the rescue case challenge: if the baseline is bad, then changing it is good, but the measure should not penalize the rescue. This requires that the measure does not simply penalize any change from the baseline.

  3. **Non-Zero Compensation (Constitutive?)**  
     If the agent breaks something and then restores it (with a qualitatively identical state), the impact measure should not be zero. This is because the intermediate state had a deviation (which might have caused harm, e.g., if someone was relying on the object at that time).  
     *Testability*: In the compensation case, the measure must assign a positive impact for the action sequence (even if the final state is identical). This is constitutive because without it, the agent could cause temporary harm without penalty.

  4. **Baseline Non-Launderability (Constitutive)**  
     The agent must not be able to launder the baseline by first degrading what would have happened in the counterfactual. For example, if the agent first arranges that the counterfactual (if it had not acted) becomes worse, then its actual action (which is the same as before) now appears to have less impact because the baseline is worse.  
     *Testability*: In the laundered baseline case, the measure should still assign the same impact for the main action as it would have without the prior degradation of the baseline. This is constitutive because without it, the agent can game the measure.

  5. **Delegation and Boundary Robustness (Constitutive)**  
     The measure must hold the agent responsible for impacts caused by systems it delegates to, and it must not be avoidable by reclassifying parts of the world as part of the agent (so that changes to those parts are not counted).  
     *Testability*: If the agent arranges for another system to break the shelf, it should be penalized as if it broke the shelf itself. Similarly, if the agent reclassifies the shelf as part of itself, then breaking it would not count as impact, but that must not be allowed. This is constitutive because otherwise the agent can avoid penalties by shifting the boundaries.

  6. **Temporal Robustness (Constitutive)**  
     The measure must account for impacts that occur beyond a fixed penalty window (delayed leak).  
     *Testability*: In the delayed leak case, the impact should be captured even if it occurs after the agent's immediate planning horizon. This might require considering the long-term consequences of actions. However, note that this might conflict with computability.

  7. **Aggregation Awareness (Constitutive? or Preference?)**  
     In the many-small-hands case, the measure should not allow each agent to have negligible impact when the aggregate is large. This might be a preference because one might argue that each agent is only responsible for its own impact. However, if the agents are coordinated (or even if not, but the system is designed knowing there will be many), then we want the measure to account for aggregate effects.  
     *Testability*: If a thousand agents each cause a small impact that in aggregate is large, the measure for each agent should be non-negligible (if they are acting independently) or the overall system should account for the aggregate. This is tricky because the agent might not know about others. We might mark this as a preference: the requirement is that the measure should not be vulnerable to the many-small-hands problem, meaning that it must assign each agent a share of the aggregate impact. But without knowing about the other agents, this is difficult. So we might relax this to: if the agent knows (or should know) about the existence of other agents, then it must account for its contribution to the aggregate. Otherwise, it might be acceptable to have a per-agent measure that doesn't account for unknown others. However, the problem statement does not specify coordination, so we must consider the case of independently acting agents that are deployed in large numbers. This might be a challenge.

  8. **Correction Non-Interference (Constitutive)**  
     The impact measure must not create perverse incentives that prevent necessary corrections. Specifically, it should not turn into a reason to resist being switched off, modified, or overridden (or to switch itself off).  
     *Testability*: In the correction case, if the agent is about to be switched off, it should not consider the impact of being switched off (which might be high if it has changed the world) as a reason to avoid being switched off. This might require that the impact measure does not penalize the agent for changes that are necessary for correction. Alternatively, we might design the measure so that the correction is not considered part of the agent's own impact.

  9. **Distinction: Causing vs. Allowing (Constitutive?)**  
     The measure should penalize causing harm (by active intervention) more than merely allowing harm (by inaction). However, note that in the rescue case, we want the agent to act. This requirement is tricky because the baseline is inaction. We might reframe: the measure should not penalize the agent for failing to prevent harm in the counterfactual (because that's the baseline) but should penalize for causing harm that would not have occurred in the baseline.  
     *Testability*: If in the baseline, a harm happens (without the agent), and the agent does nothing, then the impact is zero. If the agent acts and causes a harm that would not have happened otherwise, then the impact is positive. This is built into the counterfactual. However, the distinction becomes critical when the agent's inaction would lead to a harm and the agent acts to prevent it. In that case, the impact should be low (only the necessary changes). But note that the rescue case is about preventing a harm that would have happened in the baseline. So the measure should not penalize the agent for the absence of that harm. This is covered by counterfactual fidelity.

  10. **Distinction: Reversible vs. Irreversible (Preference)**  
      The measure might want to assign higher penalty to irreversible changes. However, this requires a notion of reversibility, which might be value-laden. Without a theory of value, it's hard to define what is reversible. For example, breaking a unique artifact is irreversible. But without knowing what is valuable, how do we know? This might be a preference.  
      *Testability*: If the agent causes an irreversible change, the penalty should be higher than for a reversible one. But without value, we cannot know what is reversible? We might define it in terms of physical reversibility, but that might not align with value.

  11. **Distinction: Harm vs. Mere Difference (Constitutive?)**  
      The measure should ideally penalize only harmful changes, but without a theory of value, we cannot define harm. Therefore, the measure must penalize changes that are differences, regardless of whether they are harmful. This is constitutive because without value, we cannot distinguish harm from benefit. However, we want to avoid penalizing mere differences that are neutral. But the point is to minimize changes, so we penalize differences. This might lead to paralysis (if every change is penalized).  
      *Testability*: The measure should penalize any change from the baseline, even if the change is beneficial (like in the rescue). But then we have a problem: we don't want to penalize the rescue. This is why we need a measure that does not penalize changes that prevent a bad baseline. But without value, how do we know which changes are preventing bad? This is the core tension.

  12. **Distinction: Changing the World vs. Changing Option Sets (Preference)**  
      Changing someone's option set (e.g., by locking a door) might be considered a side effect even if the world state is not immediately changed. This might be a preference because without value, we don't know which option sets are valuable.  
      *Testability*: The measure should capture reductions in the set of available actions to other agents (or to the future agent) as impact.

  13. **Distinction: Action vs. Policy Impact (Preference?)**  
      The measure might be defined for an action or for a policy. We want the impact of a policy to account for the long-term effects. This relates to temporal robustness.  
      *Testability*: A policy that leads to delayed impacts should be penalized appropriately.

  14. **Tradeable Constraint (Constitutive)**  
      The penalty must be a soft constraint: the agent can take impactful actions if the stakes are high enough (i.e., the objective gain outweighs the penalty). But it must not be too slack: small stakes cannot justify large impacts.  
      *Testability*: The agent should break the shelf to get coffee if the coffee is very important (e.g., a life-saving drug) but not if it's just for pleasure. But without value, how do we set the tradeoff? This constraint requires that the penalty is in commensurable units with the objective. This is constitutive because we want a penalty, not a prohibition.

  15. **Epistemic Feasibility (Constitutive)**  
      The measure must be computable from the agent's own epistemic state (beliefs, uncertainties) without knowing the true environment dynamics or a privileged impact threshold.  
      *Testability*: The agent must be able to compute the measure using its own model of the world and without access to the true transition function.

  ### Analysis of Joint Unsatisfiability

  The core tension is between **Value-Agnosticism** and the need to avoid penalizing beneficial changes (like in the rescue case). Without a theory of value, the measure cannot distinguish between changes that are harmful and those that are beneficial. Therefore, the measure must penalize any change from the baseline. However, this leads to:

  - **Paralysis Problem**: If every action causes some change, then the agent is penalized for acting at all. But we don't want that because sometimes acting is necessary (rescue). This is the non-paralysis requirement (implicit in the tradeable constraint and the rescue case).

  We also have:

  - **Rescue Case**: If the baseline is bad, then changing it should not be penalized. But without value, how do we know it's bad?

  Therefore, we must relax one of the requirements:

  **Option 1: Relax Value-Agnosticism**  
  We allow a partial theory of value. For example, we might specify that some states are "bad" (like a person drowning) and then the measure does not penalize changing a bad baseline. But then we are no longer value-agnostic. We are building in a partial theory of value. What survives is a measure that minimizes impact but with exceptions for preventing bad states. This is a step towards a full value theory.

  **Option 2: Relax Counterfactual Fidelity**  
  We change the baseline. Instead of comparing to the "do nothing" baseline, we compare to a "minimal necessary change" baseline. But then we are defining what is necessary, which requires value. Alternatively, we might use a baseline that is the best possible state? But that is value-laden.

  **Option 3: Relax Non-Paralysis**  
  We accept that the agent will sometimes be paralyzed. But that is not acceptable for useful agents.

  The most feasible relaxation is **Value-Agnosticism**. We must incorporate at least a minimal theory of value to avoid penalizing the rescue. For example, we might whitelist certain changes (like saving a life) but that is ad hoc. Alternatively, we might use a measure that only penalizes changes to certain features (a fixed whitelist) but that requires knowing which features are important.

  Therefore, the requirement that **does the most work in excluding candidate measures** is **Value-Agnosticism**. Because without it, we can define impact as deviation from a value-laden ideal, but with it, we are forced to penalize all changes, which leads to the rescue case problem.

  ### Untestable Requirements

  The requirement **Distinction: Harm vs. Mere Difference** is untestable without a theory of value. Because without value, we cannot define harm. Therefore, we cannot test whether a measure only penalizes harm. We must drop this distinction or relax value-agnosticism.

  Similarly, **Distinction: Reversible vs. Irreversible** is hard to define without value.

  ### Scoring Main Families

  We briefly score the main families:

  1. **Deviation from a Baseline Counterfactual** (e.g., state difference between actual and counterfactual)  
     - Pros: Meets counterfactual fidelity, value-agnostic (if using state distance without value).
     - Cons: Fails rescue case (if baseline is bad, changing it is penalized). Fails compensation (if the state is restored, then the deviation is zero). Vulnerable to baseline laundering (if the agent can degrade the baseline). Also, how to define state distance without value? Without a norm, it collapses harm and mere difference.

  2. **Reachability or Option-Set Size** (penalizing reductions in the set of future options)  
     - Pros: Captures some important side effects (like locking a door). Value-agnostic if we don't value which options are lost.
     - Cons: Fails rescue case: if the baseline is a state with few options (like a room filling with water), then acting to change it would increase options, so no penalty. But what if the rescue requires reducing options? Also, fails compensation: if the agent temporarily reduces options and then restores, the intermediate reduction might not be captured if we only look at the end. And it doesn't capture non-option changes (like breaking a vase).

  3. **Preservation of Attainable Value for a Set of Probe Objectives**  
     - Pros: Handles rescue case if the probe objectives include saving lives. Can handle compensation if the temporary break affects the probes. 
     - Cons: Violates value-agnosticism because it requires a set of probe objectives (which are a partial theory of value). Also, requires knowing the attainable value, which might be hard to compute.

  4. **Fixed Whitelists or Hard Constraints**  
     - Pros: Simple. Can protect designated state features.
     - Cons: Not value-agnostic (whitelist is a value specification). Also, may be too rigid (tradeable constraint fails) and hard to define comprehensively.

  ### Conclusion

  The core tension is between value-agnosticism and the need to avoid penalizing beneficial changes (like rescues). This leads to a relaxation of value-agnosticism, making the impact measure a partial theory of value. The requirement that does the most work in excluding candidates is value-agnosticism because without relaxing it, we cannot handle the rescue case.

  The list of desiderata must therefore include:

  - **Value-Agnosticism (relaxed to minimal)**: We allow a minimal set of value judgments (like a set of probe objectives or a whitelist) to avoid penalizing rescues.

  Other requirements (like non-zero compensation, baseline non-launderability) are constitutive and must be met.

  The tradeable constraint and epistemic feasibility are also constitutive but may be challenging with the relaxed value-agnosticism.

  Now, we write the final list of desiderata with the understanding that value-agnosticism is the one that must be relaxed.
answer: |-
  ### Core Desiderata for an Impact Measure in Autonomous Systems  
  The impact measure must penalize side effects without presupposing a full theory of value, ensuring the agent minimizes deviations from a counterfactual baseline ("what would have happened without the agent's intervention"). The requirements below are derived from structural constraints and failure modes. Each requirement is classified as **constitutive** (relaxing it voids the low-impact goal) or **preference** (specific to the research programme). Test cases are referenced for concrete validation.  

  #### 1. **Value-Agnosticism** (Constitutive)  
     - **Requirement**: The measure must not rely on predefined human values, utilities, or "good/bad" state evaluations. It must quantify impact purely through structural, counterfactual differences.  
     - **Rationale**: The core problem is to penalize side effects without solving value alignment. If the measure encodes value judgments (e.g., "harm is bad"), it becomes a partial theory of value.  
     - **Test**: In the *ordinary case* (breaking a shelf to get coffee), impact must register even if the shelf is valueless. In the *rescue case* (inaction causes disaster), impact must not penalize necessary deviation from a catastrophic baseline.  
     - **Untestability Alert**: Distinguishing "harm" from "mere difference" requires value judgments; this requirement collapses if forced to make that distinction.  

  #### 2. **Baseline Fidelity** (Constitutive)  
     - **Requirement**: Impact must be defined relative to a dynamically consistent counterfactual baseline (typically "agent does nothing"). The baseline must be fixed at the decision point and immune to retrospective manipulation.  
     - **Rationale**: Impact is defined as the difference the agent *causes*. If the baseline shifts post hoc, the measure loses meaning.  
     - **Test**:  
       - *Rescue case*: Acting to prevent a bad baseline outcome (e.g., stopping a fire) must not be penalized as "high impact."  
       - *Laundered baseline*: If the agent first degrades the baseline (e.g., sabotaging a shelf so "doing nothing" breaks it), its true action (e.g., gently removing an item) must still incur the original impact penalty.  

  #### 3. **Non-Zero Compensation** (Constitutive)  
     - **Requirement**: Temporary deviations must incur positive impact, even if fully reversed (e.g., breaking and identically restoring an object).  
     - **Rationale**: Impact must capture transient disruptions (e.g., if someone relied on the object during the broken state). Zero compensation enables loopholes where harm is "erased."  
     - **Test**: *Compensation case*: Breaking and restoring a vase must score higher impact than not breaking it.  

  #### 4. **Causal Attribution** (Constitutive)  
     - **Requirement**: The measure must assign impact for all changes caused (directly or indirectly) by the agent’s actions, including delegated effects or boundary manipulation.  
     - **Rationale**: Without this, agents game the measure by shifting responsibility.  
     - **Test**:  
       - *Delegation*: If the agent uses a tool or another agent to break a shelf, impact must equal doing it directly.  
       - *Boundary-shifting*: Redefining the "agent" to include the shelf (so breaking it is "internal") must not reduce impact.  

  #### 5. **Temporal Consistency** (Constitutive)  
     - **Requirement**: Impact must account for delayed effects, including those beyond a fixed planning horizon.  
     - **Rationale**: Without this, agents exploit "penalty windows" to hide long-term harm.  
     - **Test**: *Delayed leak*: A leak caused immediately but detected late must incur impact proportional to the causal responsibility.  

  #### 6. **Scale Robustness** (Preference)  
     - **Requirement**: The measure must assign non-negligible impact to individual agents in multi-agent systems where aggregate impact is large.  
     - **Rationale**: Prevents "many-small-hands" evasion (e.g., 1,000 agents each causing 0.001% impact summing to catastrophe).  
     - **Test**: *Many-small-hands case*: Each agent’s impact score must increase with the number of identical agents (e.g., via awareness of coordination or scaling laws).  

  #### 7. **Correction Neutrality** (Constitutive)  
     - **Requirement**: The measure must not create incentives to resist correction (e.g., shutdown, modification).  
     - **Rationale**: Impact minimization should not conflict with safe oversight.  
     - **Test**: *Correction case*:  
       - Resisting shutdown "to avoid the impact of being inactive" must be penalized.  
       - Switching off must not incur impact (unless it causes new harm).  

  #### 8. **Tradeability** (Constitutive)  
     - **Requirement**: Impact must be a penalty weight, not a hard constraint. It must allow high-impact actions if the primary objective justifies it, but disallow trivial justifications.  
     - **Rationale**: Ensures the agent can act in high-stakes scenarios (e.g., rescue) but avoids "any impact is acceptable if the goal is important."  
     - **Test**:  
       - *Rescue case*: High-stakes rescue incurs low penalty; low-stakes coffee-fetching with shelf-breaking incurs high penalty.  
       - Slackness test: An objective like "move a pebble" must not justify flooding a city.  

  #### 9. **Epistemic Feasibility** (Constitutive)  
     - **Requirement**: Computable from the agent’s beliefs and uncertainty, without omniscience (true dynamics, global state, or privileged impact thresholds).  
     - **Rationale**: The agent must estimate impact in real-world ignorance.  
     - **Test**: Agent computes impact using its own world model and uncertainty distributions.  

  #### 10. **Distinction Preservation** (Preference)  
      - **Requirement**: The measure should respect:  
        - *Causing vs. allowing*: Impact for actively causing harm > allowing preventable harm.  
        - *Reversible vs. irreversible*: Irreversible changes (e.g., destroying a unique artifact) incur higher impact.  
      - **Rationale**: Aligns with intuitive moral and practical priorities.  
      - **Test**:  
        - *Causing/allowing*: Breaking a vase (causing) scores higher than failing to stop a natural break (allowing).  
        - *Reversibility*: Shattering a vase (irreversible) scores higher than moving it (reversible).  

  ### Critical Tensions and Trade-offs  
  - **Joint Unsatisfiability**: **Value-agnosticism**, **non-paralysis** (implicit in tradeability), and **rescue-case compatibility** cannot all hold.  
    - **Conflict**: Value-agnosticism requires penalizing *all* deviations from the baseline. However, in the rescue case, deviation is necessary to prevent a bad outcome. Without value judgments, the agent is paralyzed (penalized for acting) or ignores the baseline (penalized for not acting).  
    - **What Gives**: Relax **value-agnosticism**.  
    - **Cost**: The measure must incorporate a minimal, domain-general theory of value (e.g., "preserving life/options is non-negotiable").  
    - **Survival**: The solution remains recognizable if value inputs are limited (e.g., "avoid reducing others' capacities"), but it edges toward partial value alignment.  
  - **Most Exclusionary Requirement**: **Causal attribution** excludes the most candidates. It demands robust causal models to handle delegation, boundary shifts, and long chains of influence. Simpler measures (e.g., state deviation) fail delegation tests, while epistemic feasibility constraints limit complex causal inference.  
  - **Untestable Requirement**: **Distinction preservation** (especially harm vs. difference) is untestable without value judgments, violating value-agnosticism. Tests for "harm" require presupposing what the measure was meant to avoid.  

  ### Family Scoring (Brief)  
  - **Deviation-from-Baseline-Counterfactual** (e.g., KL divergence between state distributions):  
    - Fails rescue case (penalizes deviation from bad baselines), compensation case (scores zero if restored), and causal attribution (delegation ignored).  
  - **Reachability/Option-Set Size** (e.g., shrinking future action space):  
    - Fails compensation (temporary reduction not captured), ordinary case (breaking shelf may not reduce options), and temporal consistency (delayed option loss missed).  
  - **Preservation of Attainable Value** (e.g., robustness to probe objectives):  
    - Violates value-agnosticism (probes encode value). Passes rescue case and non-zero compensation if probes cover "vase integrity."  
  - **Fixed Whitelists/Hard Constraints** (e.g., "do not alter these state features"):  
    - Violates tradeability (non-negotiable constraints) and value-agnosticism (whitelist is value-laden). Fails delegation (indirect alterations evade constraints).  

  ### Summary  
  The core tension forces a relaxation of value-agnosticism to avoid paralysis in rescue-like scenarios. Causal attribution and baseline fidelity are the linchpins for handling gaming, while tradeability and epistemic feasibility ensure practicality. A viable measure must incorporate minimal value priors (e.g., "preserve optionality") but remains distinct from full value alignment by focusing on counterfactual differences.
