answer: |-
  Here’s a decision tree structured around your axes, designed to guide students from pre-theoretic commitments to distinct positions on consciousness distribution. It uses diagnostic cases (in *italics*) and avoids named theories. Empty nodes are noted, and collisions are flagged.  

  ---

  ### **Decision Tree: What Kind of Thing Is Consciousness?**  
  **Start**: *You observe a creature that behaves flexibly to noxious stimuli but cannot report experiences.*  

  1. **Is behavior constitutive of consciousness (C), or merely evidence?**  
     - *Constitutive*: If it behaves *as if* conscious, it is conscious (go to 2).  
       - *Diagnostic Case: A robot perfectly mimics pain-avoidance in all contexts.*  
     - *Evidential*: Behavior suggests consciousness but doesn’t define it (go to 3).  

  2. **Is C restricted to specific lineages?**  
     - *Yes*: Only phylogenetically "close" species (e.g., vertebrates) qualify (Leaf 1: **Anthropocentric Pragmatism**).  
       - *Awkward: Requires arbitrary lineage cutoffs (e.g., octopuses excluded).*  
       - *Welfare: Protect species resembling humans; neglect "distant" taxa.*  
     - *No*: Any system with adaptive behavior has C (Leaf 2: **Behaviorist Panexperientialism**).  
       - *Awkward: A thermostat’s "avoidance" of overheating is minimally conscious.*  
       - *Welfare: Scale intervention by behavioral complexity (e.g., insects > microbes).*  

  ---

  3. **Does C require functional organization *or* lineage history?**  
     - *Lineage*: C emerged evolutionarily in some clades; organization is a proxy (go to 4).  
     - *Organization*: Only current causal structure matters (go to 5).  
       - *Diagnostic Case: An AI replica of a bee brain, identical in function but no evolutionary history.*  

  4. **Can C vary in degree?**  
     - *No*: Binary (present/absent in qualifying lineages) (Leaf 3: **Lineage Threshold View**).  
       - *Awkward: Severely impaired humans may lose C, violating intuition.*  
       - *Welfare: Binary protection for "in-clade" species (e.g., all mammals).*  
     - *Yes*: Scalar, based on neural complexity (Leaf 4: **Scalar Lineage Gradualism**).  
       - *Awkward: Quantifying degrees across lineages (e.g., octopus vs. crow).*  
       - *Welfare: Prioritize species with higher predicted degrees (e.g., primates > fish).*  

  ---

  5. **What is the minimal unit of C?**  
     - *Whole organism*: Only unified individuals (go to 6).  
     - *Sub/super-systems possible*: Neural subsystems or collectives qualify (go to 7).  
       - *Diagnostic Case: An octopus arm severed (with ganglia) that avoids damage.*  

  6. **Is C all-or-nothing or graded?**  
     - *Binary*: Threshold of functional complexity (Leaf 5: **Organismic Binary Functionalism**).  
       - *Awkward: Threshold arbitrariness (e.g., is a shrimp over/under?).*  
       - *Welfare: Protect organisms above threshold (e.g., vertebrates + cephalopods).*  
     - *Scalar*: Degrees based on information integration (Leaf 6: **Graded Organismic Functionalism**).  
       - *Awkward: Comparing degrees across taxa (e.g., bee vs. jellyfish).*  
       - *Welfare: Prioritize high-degree individuals; sum welfare within species.*  

  ---

  7. **Can C degrees be summed across subjects?**  
     - *No*: Each subject’s experience is separate (Leaf 7: **Non-Aggregative Subjectivism**).  
       - *Awkward: A hive of 10,000 bees has less moral weight than one pig.*  
       - *Welfare: Focus on individual suffering intensity, not numbers.*  
     - *Yes*: Total "C-units" matter (Leaf 8: **Aggregative Holism**).  
       - *Awkward: A barely conscious swarm outweighs a human.*  
       - *Welfare: Maximize reduction of total conscious units suffering (e.g., insecticides hugely harmful).*  

  ---

  8. **Do cognitively impaired humans force a separate criterion?**  
     - *Yes*: Humans are categorically conscious regardless of function (Leaf 9: **Human Exceptionalism**).  
       - *Awkward: A human in vegetative state vs. alert octopus.*  
       - *Welfare: Humans always prioritized; animals assessed functionally (from Step 5).*  
     - *No*: All species assessed by same standard (go to 9).  

  9. **Is C possible in superorganisms?**  
     - *No*: Only individuals/subunits (Leaf 10: **Unnamed**).  
       - *Awkward: An ant colony’s collective intelligence lacks a subject.*  
       - *Welfare: Protect subunits (e.g., individual ants), not colonies.*  
     - *Yes*: Colonies can be conscious subjects (Leaf 11: **Colony Mind Theory**).  
       - *Awkward: Defining the "self" of a hive.*  
       - *Welfare: Protect colonies as single subjects (e.g., relocating hives).*  

  ---

  ### **Empty Nodes & Collisions**  
  - **Step 3 → Lineage + Organization**: *Empty*. Lineage implies history *is* necessary; combining with pure organization is incoherent.  
  - **Step 7 → Summing + Whole Organism**: *Collision*. Leaf 6 (scalar organisms) and Leaf 8 (aggregation) can overlap but diverge on summing *across* species.  
  - **Step 2 → Evidential + Lineary**: *Unattractive*. If behavior is only evidence, lineage adds no epistemic ground (skipped to avoid bloat).  

  ### **Closing Note on Welfare Aggregation**  
  - **Binary views** (Leaves 1,3,5): Welfare efforts target "included" species; all individuals equally protected.  
  - **Scalar non-aggregative** (Leaves 4,6,7): Prioritize reducing high-intensity suffering in high-degree individuals.  
  - **Scalar aggregative** (Leaf 8): Total suffering dominated by numerous low-degree subjects (e.g., insects in agriculture).  
  - **Superorganism views** (Leaves 10–11): Focus on unit integrity (e.g., habitat preservation for colonies).  

  ---  
  **Structure Summary**: 8 branch nodes → 11 leaves (3 unnamed). Collisions flagged at Step 7. Each leaf’s "awkward commitment" targets its counterintuitive edge case. Welfare notes link distribution logic to intervention priorities. Add your statutory examples (octopus, split-brain, etc.) at relevant nodes.
