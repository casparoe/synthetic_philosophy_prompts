  ### **Question 6: Your Toy Model—Superdeterminism or Mundane Causality?**  
  **Question**: "Consider this: a source emits entangled particles plus a 256-bit seed. Alice and Bob’s settings are deterministic functions of that seed. So settings and λ share a common cause in their past light cones—no fine-tuning, just a fixed setup. Is this superdeterminism? And if not, why can’t it reproduce the singlet correlations without nonlocality?"  
