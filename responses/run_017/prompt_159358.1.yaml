prompt: |-
  Hi — I need something practical and I'd love your help. Please act as a professional philosopher who also knows a lot about evolutionary biology and signaling theory, take a few minutes to brainstorm freely before you commit to anything, and then write the final answer in American English, in under 900 words total.

  Some background: I help run a tiny volunteer fund that hands out micro-grants (a couple hundred up to about two thousand dollars) to local community projects — a community garden, a repair cafe, a kids' coding club, a meals-on-wheels type thing. We get around 150 applications a month, six volunteers read them on a Sunday afternoon with about ten minutes each, we approve roughly fifteen, and a three-person board signs off without reading them. Right now our discussion is basically vibes: "she sounds really commited", "this one feels like a real project." I hate it, because I think we keep funding people who are good at writing applications and missing people who are good at actually doing things. So I started reading on my own about costly signaling — the handicap principle, peacocks tails, the idea that a signal can only be honest if it's expensive in a way that someone lacking the underlying quality couldn't afford to fake — and I want to turn that into a real procedure my volunteers can run.

  Here's what I need: an ordered set of questions someone with no theory can work through in ten minutes on a grant application, telling them what counts as a good enough answer at each step, where the procedure just stops and says no, and where it has to hand the decision to a human because the question is really about our values and not a fact. Please think carefully about which distinctions have to survive the translation and which ones you can drop without gutting the idea. A few things I specifically want handled: my sense is that "expensive" is slippery, so I want the procedure to separate different kinds of cost — money, time, risk of embarrassment, opportunity cost — and crucially to ask "expensive for whom?", since a costly signal might just be a receipt for privilege (a slick video, a professional website) rather than evidence of the thing we care about, which is follow-through. There also seem to be signals that are honest not because they're costly but because they're a byproduct you literally can't fake — evidence that the thing already happened — and I'd like the procedure to treat those separately from conventional ones. And I read something once about how the very best candidates sometimes signal by *not* signalling, by being conspicuously modest, and we have applicants like that too; I don't want the procedure to punish them for it.

  Then please run it on three applications and show me the output, including one where the answer will annoy me: (1) a glossy two-minute professionally shot video plus a six-page business plan, from an applicant who works in marketing; (2) a messy, typo-filled application from someone who has been running a monthly repair meetup in a church hall for fourteen months and has photos with the same faces showing up; (3) my favorite — a refugee mutual-aid organizer with a genuinely moving story, tons of evident caring, and nothing at all that anyone can check. I'd rather you run the procedure honestly on all three than tell me what I want to hear. Finally, be straight with me about what this procedure can't do: where it will misfire, which judgment calls it dresses up as steps, and what fraction of the decision should stay with the humans no matter how good the checklist is.
reasoning: |-
  Okay, I need to help this user who runs a micro-grant fund. They're frustrated because their current process relies on "vibes," leading them to fund good writers rather than effective doers. They want a practical procedure based on signaling theory that volunteers can apply in ten minutes per application. 

  First, I recall the core concepts: costly signals (like peacock tails) must be hard to fake because they're expensive in terms of resources, time, risk, or opportunity cost. But I also remember that some signals are honest because they're byproducts of actual work (e.g., photos showing repeated activity), and top performers might signal through modesty. The user specifically wants to avoid mistaking privilege (like professional videos) for genuine commitment.

  I brainstorm how to translate this into a step-by-step filter. It needs clear questions that either reject applications outright or flag them for human review. Key distinctions: 
  - Separating different cost types (money, time, risk, opportunity cost) 
  - Asking "expensive for whom?" to screen privilege 
  - Treating byproduct evidence differently from conventional signals 
  - Accounting for low-signal/high-substance applicants 

  The procedure should have three stages: 
  1) Quick rejection for missing basics 
  2) Signal evaluation with cost analysis 
  3) Human judgment for borderline cases 

  For cost evaluation, I consider designing a matrix where volunteers assess four dimensions: 
  - Financial cost (is it affordable for this applicant?) 
  - Time/effort cost (does it represent real labor?) 
  - Risk/embarrassment (would failing be painful?) 
  - Opportunity cost (did they sacrifice alternatives?) 

  Volunteers would score each dimension, and applications need high marks in at least two to pass. 

  Then I test this on the three sample cases: 
  1) The marketing pro's glossy application: high financial cost but low risk/opportunity cost for them. Fails the "expensive for whom?" test. 
  2) The repair meetup organizer: messy application but photos show byproduct evidence of real work. High time/effort cost and opportunity cost. Passes. 
  3) The refugee organizer: moving story but zero verifiable signals. Must go to human review for values-based assessment. 

  I realize the procedure's limits: 
  - Can't replace human judgment on community values 
  - Might reject brilliant outliers 
  - Depends on volunteer discernment for cost assessment 
  - Won't capture all dimensions of impact 

  Final structure: 
  - Introduction explaining the philosophy 
  - Step-by-step procedure with decision points 
  - Three sample evaluations 
  - Honest limitations section 

  I keep it under 900 words using straightforward American English, as requested. The tone stays professional but practical – this is for volunteers, not academics.
answer: |-
  Here's a practical, step-by-step procedure based on signaling theory and evolutionary biology, designed for your volunteers to use in ~10 minutes per application. It prioritizes **honest signals of commitment and follow-through** while filtering out privilege masquerading as merit.

  **Core Philosophy Translated:**
  1.  **Honest Signals:** We seek evidence costly *for the applicant specifically* to fake, indicating genuine commitment or capacity.
  2.  **Cost Dimensions:** Evaluate cost based on *Time/Effort, Financial Outlay, Risk/Embarrassment, and Opportunity Cost*. High cost *for that applicant* in multiple dimensions is key.
  3.  **Byproduct Evidence:** Treat physical proof of *existing work* (e.g., photos, logs) as highly reliable "honest byproduct" signals, separate from promises.
  4.  **"No Signal" Signals:** Avoid penalizing modesty/lack of polish *if* strong byproduct evidence exists. Low-signal applications lacking *any* evidence are risky.
  5.  **Human Judgment:** The procedure identifies *potential* signals and costs. Humans must judge **values** (is this project *worth* supporting?), **impact**, and **edge cases**.

  ---

  **The Micro-Grant Signal Filter: A 10-Minute Procedure**

  **Step 1: The Basics (Reject if Missing - 1 min)**
  *   **Question:** Does the application clearly state: (a) What the project *is*? (b) What the money will *specifically* be used for? (c) Who benefits?
  *   **Stop & Say No If:** Any of (a), (b), or (c) are completely missing or utterly incomprehensible. (Reason: Fundamental lack of coherence, likely wasteful.)
  *   **Otherwise:** Proceed.

  **Step 2: Spot "Byproduct Evidence" (Strong Positive Signal - 2 min)**
  *   **Question:** Is there *verifiable proof* that core project activities *have already happened* without our grant? (Look for: Dated photos/videos *showing the activity* (not just people posing), sign-in sheets, receipts for materials *they* bought, links to active social media documenting past events, news clippings, partner testimonials *specific* to past work).
  *   **Good Enough:** Clear, specific evidence showing the *core activity* occurred multiple times (e.g., photos of *different* repair sessions, dated social posts about garden workdays).
  *   **Stop & Flag for Approval If:** Strong, multi-instance byproduct evidence exists **AND** the requested funds are clearly for scaling/continuing *that same proven activity*. (Reason: This is the "honest byproduct" – hard to fake, proves capacity/commitment. Low risk.)
  *   **Otherwise:** Proceed. (Note: *Lack* of byproduct evidence doesn't mean reject yet, especially for new projects.)

  **Step 3: Analyze Costs & Signals (Core Evaluation - 5 min)**
  For key claims (e.g., "We are committed," "We have community support," "We have the skills") or proposed actions (e.g., "We will run weekly sessions"), assess the cost dimensions *relative to this applicant*:

  *   **Cost Dimension Matrix:**
      | Dimension       | Question to Ask                                     | "Costly for Whom?" Check                     | Good Signal If...                          |
      |-----------------|----------------------------------------------------|----------------------------------------------|--------------------------------------------|
      | **Time/Effort** | How much *real work* does this represent?          | Would this be trivial *for someone like them*? | Significant labor evident (e.g., detailed handwritten plan, complex hand-drawn diagrams, self-built prototype). |
      | **Financial**   | How much did/will *they* spend (not grant money)? | Is this easily affordable *for them*?         | Personal funds spent (receipts!), fundraising *they* did, using salvaged materials creatively. Low $ but high sweat equity counts. |
      | **Risk/Embarrassment** | What's the downside if they fail/screw up?      | Would failure be low-stakes *for them*?       | Public commitment (posted plans, venue booked with deposit), staking personal reputation locally, trying something visibly hard. |
      | **Opportunity Cost** | What did they *give up* to do this?             | Were there low-value alternatives *for them*? | Sacrificing paid work, leisure time, easier projects; evidence of sustained effort over time. |

  *   **Scoring & Decision:**
      *   **Strong Signal (Proceed):** High cost in **2+ dimensions** *relative to the applicant* (e.g., repair cafe organizer spending weekends learning skills + risking reputation + using own tools).
      *   **Weak/Unclear Signal (Human Judgment):** Low cost in most dimensions, OR cost seems high but likely reflects *privilege* (e.g., slick video easily made by marketing pro).
      *   **Red Flag (Stop & Say No):** Signals seem actively *dishonest* or misrepresentative based on evidence, OR requested funds enable something with *negative* cost dimensions (e.g., funds mainly pay applicant a high salary with minimal project cost).

  **Step 4: The "No Signal" Check (Avoid False Negatives - 1 min)**
  *   **Question:** Does the application feel *understated* or lack polish **BUT** did Step 2 reveal strong byproduct evidence OR does Step 3 show high cost in Time/Effort/Opportunity Cost?
  *   **Good Enough:** Yes. (Reason: Modesty + proven work/high sweat equity is a valid pattern. Don't punish lack of marketing savvy.)
  *   **Stop & Flag for Human Judgment If:** *No* byproduct evidence *AND* signals are very weak/low cost *BUT* the core idea seems genuinely valuable/needed. (Reason: High risk of failure, but values might override – humans must decide).
  *   **Otherwise:** Proceed with decision from Step 3.

  **Step 5: Human Judgment Zone (Final Board Review)**
  *   Applications passing Steps 2 or 3 proceed here.
  *   **Questions for Humans:** Does this align with *our* community values/priorities? Is the potential impact worth the risk (especially for Step 4 flags)? Is the budget realistic *even with* good signals? Are there ethical concerns?

  ---

  **Test Run on Your Three Applications:**

  1.  **Glossy Video + Business Plan (Marketing Pro):**
      *   Step 1: Pass (Clear what/why/budget).
      *   Step 2: **NO** byproduct evidence (all promises/future plans).
      *   Step 3: Analyze *Creating Video/Plan*:
          *   Time/Effort: **Low** *for them* (Professional skillset).
          *   Financial: **Low** *for them* (Likely used work resources/skills).
          *   Risk: **Low** *for them* (No skin in the game, generic plan).
          *   Opp. Cost: **Low** *for them* (Part of skillset maintenance).
          *   **VERDICT: Weak Signal (High privilege, low cost). Flag for Human Judgment.** Humans might reject (signals privilege, not project substance) or probe deeper (is the *project idea itself* highly costly/signaling? Unlikely).
      *   Step 4: Not applicable (Signals present, just weak/privileged).

  2.  **Messy Repair Cafe (Established Organizer):**
      *   Step 1: Pass (Typos don't negate basics).
      *   Step 2: **STRONG BYPRODUCT!** Photos show *same faces* at *different* events over 14 months. Proves recurring activity, community buy-in.
      *   **STOP & FLAG FOR APPROVAL.** (The byproduct evidence is gold. Request is likely for continuation/scaling proven model).

  3.  **Refugee Mutual Aid (Moving Story, No Checks):**
      *   Step 1: Pass (Assuming basics are stated).
      *   Step 2: **NO** verifiable byproduct evidence (Story is compelling, but not proof of *organizational* capacity or past success).
      *   Step 3: Analyze *Claims of Caring/Past Action*:
          *   Time/Effort: **Potentially High** (Story implies hardship). *But is it evidenced?* (Unclear).
          *   Financial: **Likely High** (Implied context). *But evidenced?* (No).
          *   Risk: **Potentially High** (Vulnerable position). *But evidenced?* (No).
          *   Opp. Cost: **Potentially High** (Few alternatives). *But evidenced?* (No).
          *   **VERDICT: Weak/Unclear Signal (High *claimed* cost, zero *evidence*).** Signals are the story itself – costly in suffering? But suffering != organizational capacity. High risk of misallocation.
      *   Step 4: **Flag for Human Judgment.** (No byproduct, weak conventional signals due to lack of evidence, but high potential value/need). **Humans MUST decide based purely on values/compassion/trust vs. fiduciary risk.** This is the hardest call.

  ---

  **What This Procedure CAN'T Do (Be Straight):**

  1.  **Values Are Human:** It identifies *potential* for commitment/capacity. It **cannot** decide if feeding refugees is more valuable than teaching kids to code. That's 100% human judgment (Step 5).
  2.  **Cost is Subjective:** Judging "costly *for whom?*" requires volunteer discernment. It's a dressed-up judgment call (Step 3 matrix). Training with examples is crucial.
  3.  **Predicting the Future:** Signals predict *likelihood* of follow-through, not guarantee. Shit happens. Brilliant doers can fail; slick talkers can sometimes deliver.
  4.  **Edge Cases & Outliers:** Truly novel, high-impact projects might lack conventional signals. The procedure might miss them (Step 4 tries to mitigate). Humans must be alert to this.
  5.  **Privilege Blindspots:** If volunteers misinterpret what's costly *for a specific disadvantaged group* (e.g., seeing lack of tech access as lack of effort), it misfires. Diversity on the team helps.
  6.  **Fraction Needing Human Judgment:** Expect 20-40% to hit the Human Judgment Zone (Step 3 Weak Signals, Step 4 "No Signal" with potential, Step 5 values). **No checklist eliminates the need for human deliberation on a significant minority of cases.** Aim for the procedure to give you 60-80% clear "Yes/No" based on signals, refining the pool for deeper human review on the rest.

  This procedure forces focus on *evidence of action and demonstrable sacrifice* over eloquence. It won't be perfect, but it should tilt the scales towards funding doers, while being honest about where human values and judgment must take over. Good luck!
