     - A rule can be broad (applies to many situations) but lightly enforced (e.g., a style guide that is recommended but not checked).
     - A rule can be narrow (applies only to a specific situation) but strictly enforced (e.g., a critical safety check in a specific part of the code).

   But note: the two are not entirely independent. A rule that is very broad might be harder to enforce strictly without causing frustration, and a rule that is very narrow might be easier to enforce strictly without much overhead.

   However, for the purpose of this procedure, we will treat them as two independent dimensions to set. We will ask questions to set each dimension.

