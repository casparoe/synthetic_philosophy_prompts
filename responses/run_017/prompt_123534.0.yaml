answer: |-
  ### Simplified Procedure for Setting Engineering Standards

  This procedure distills cultural tightness theory into a 20-minute decision framework for individual practices. It retains the **scope/enforcement distinction** (your "two dials") because:
  - **Scope**: Determines *where* the rule applies (broad = group-wide; narrow = context-specific).
  - **Enforcement**: Determines *consequences* of violation (strict = blocked workflows; lenient = documented exceptions).
    
  The **theory's core trade-off** (predictability vs. autonomy) is preserved, but **group-level dynamics** (e.g., threat exposure) are converted into tangible engineering costs. Dropped elements:
  - **Societal-scale assumptions** (e.g., "costly miscoordination" becomes explicit team efficiency impacts).
  - **Cultural inertia** (engineers can leave, so rules must justify immediate costs).
  - **Rule correctness** (addressed post-hoc via feedback loops, not in this procedure).

  ---

  ### The Procedure: 5 Questions, 3 Outcomes
  **Run sequentially for one practice. Stop early if a "no" or "handoff" occurs.**

  1. **"Is inconsistency here *actively harmful*?"**  
     - *Sufficient answer*: "Yes" only if inconsistency regularly causes:  
       - Bugs/outages (e.g., security flaws from divergent patterns)  
       - High coordination costs (e.g., merge conflicts, debugging delays)  
     - *Stop if no*: **Leave to individual judgement**.  
     - *Handoff if*: Harm is disputed (values conflict: reliability vs. autonomy).

  2. **"Could context *legitimately* require exceptions?"**  
     - *Sufficient answer*: Quantify % of cases where exceptions might be valid (e.g., "5% of PRs are trivial and need only one review").  
     - *Stop if >30%*: **Leave to individual judgement** (scope too narrow for group-wide rule).  
     - *Handoff if*: Disagreement on exception frequency (values conflict: standardization vs. flexibility).

  3. **"Can violations be *automatically detected* with <5% false positives?"**  
     - *Sufficient answer*: "Yes" for machine-checkable rules (e.g., formatting); "No" for subjective calls (e.g., "meaningful test coverage").  
     - *Stop if no*: **Default with note** (strict enforcement infeasible).  
     - *Handoff if*: Tooling could be built but isn’t ready (cost/benefit tradeoff).

  4. **"Is the cost of a violation *immediate and high*?"**  
     - *Sufficient answer*: "High" = direct user/business impact (e.g., production outage); "Low" = indirect costs (e.g., technical debt).  
     - *Stop if low*: **Default with note** (strict enforcement unjustified).  
     - *Handoff if*: Impact is probabilistic (e.g., "this *might* cause outages").

  5. **"Would strict enforcement *block critical workflows* >10% of the time?"**  
     - *Sufficient answer*: Estimate frequency of false blocks (e.g., CI fails for valid edge cases).  
     - *Stop if yes*: **Default with note** (strict enforcement too disruptive).  
     - *Handoff if*: Data is unavailable (risk tolerance conflict).

  **Outcomes**:
  - **Hard rule**: Only if all answers support strict, automated enforcement (Q1=yes, Q2≤30%, Q3=yes, Q4=high, Q5=no).  
  - **Default with note**: If scope is broad (Q1=yes, Q2≤30%) but enforcement can't be strict.  
  - **Individual judgement**: If scope is narrow (Q1=no or Q2>30%).

  ---

  ### Applied to Your Examples
  #### 1. Requiring two approvals on every pull request
  - **Q1**: *Harm?* **Yes** (inconsistent reviews risk bugs/knowledge silos).  
  - **Q2**: *Exceptions?* **~10%** (e.g., docs-only changes). *<30% → Proceed*.  
  - **Q3**: *Auto-detect?* **Yes** (GitHub/GitLab enforce approver counts).  
  - **Q4**: *Violation cost?* **High** (unreviewed code may cause outages).  
  - **Q5**: *Block workflows?* **No** (exceptions can be whitelisted).  
  - **Outcome**: **Hard rule** (with escape hatch for trivial changes).

  #### 2. Enforcing formatting/linting in CI
  - **Q1**: *Harm?* **Yes** (formatting wars waste review time).  
  - **Q2**: *Exceptions?* **<5%** (e.g., generated code). *<30% → Proceed*.  
  - **Q3**: *Auto-detect?* **Yes** (linters are deterministic).  
  - **Q4**: *Violation cost?* **Low** (aesthetics, not correctness). *→ Stop*.  
  - **Outcome**: **Default with note** (violation cost is low; strict enforcement risks blocking legitimate workarounds).

  #### 3. On-call engineer must follow runbook vs. improvise
  - **Q1**: *Harm?* **No** (improvisation often *reduces* outage duration if done competently). *→ Stop*.  
  - **Outcome**: **Leave to individual judgement**.  
  - **Your prior is upheld**. Improvisation is allowed unless inconsistency is proven harmful (Q1=no).

  ---

  ### What the Procedure *Can't* Tell You
  1. **Rule correctness**: This evaluates *implementation*, not the rule’s inherent value. Bad rules (e.g., "always use XML") will still fail, but churn is minimized by narrow scope/lenient enforcement.  
  2. **Attrition risk**: Engineers can leave, so:  
     - Use **Q5** to flag rules that frustrate daily work.  
     - Prefer **defaults with notes** for subjective practices (e.g., testing).  
  3. **Cross-rule interactions**: Assess practices in isolation; handle dependencies via documentation.  
  4. **Long-term cultural drift**: Re-run the procedure quarterly if team/threat profiles change.  

  ### Why It Works for Small Groups
  - **Voluntary participation** is addressed by:  
    - Narrow scoping (Q2) and lenient enforcement (Q3–Q5) reducing friction.  
    - Outcomes that mirror "tightness" *locally* (e.g., strict CI rules) without society-level rigidity.  
  - **Threat exposure** is converted to tangible costs in Q1/Q4 (e.g., outages = high threat).  

  **Final recommendation**: Pair this with a lightweight feedback loop (e.g., a #standards-feedback Slack channel) to catch invalid rules early.
