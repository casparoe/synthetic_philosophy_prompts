  So outcomes: When manipulator's ballot is drawn (1/5), B wins. When not (4/5), A wins. So expected utility: if manipulator prefers C best, then A worst, B middle. Say utility C:10, A:0, B:5. Then sincere voting: always A, utility 0. Insincere: (1/5)*5 + (4/5)*0 = 1. So better than 0. So they gain by manipulating. 

