  Sincere scenario: Manipulator votes C>A>B. If manipulator's ballot is drawn (1/5 chance), last is B? No, on their ballot, last is B? They rank C>A>B, so last is B. Eliminate B, then A vs C. Majority: 3 prefer A>C, 1 (B>A>C) prefers C? Wait, the B>A>C voter: if A vs C, they prefer A over C? Because A>B>C implies A>C, and B>A>C implies A>C? So all 4 others prefer A over C. So if B is eliminated, A wins. 

  If manipulator's ballot isn't drawn, another ballot is drawn. Say a pro-A ballot (3 of them): they rank A>B>C, last is C. Eliminate C, then A vs B. Majority: 3 prefer A>B, 1 (B>A>C) prefers B>A, so A wins 3-1. If the pro-B ballot is drawn (1 voter, B>A>C), last is C, eliminate C, same A vs B, A wins. So sincere voting always leads to A winning. 

  Now, manipulator insincerely votes C>B>A (so they put A last). If their ballot is drawn (1/5 chance), last is A, eliminate A. Then B vs C. Now, the 3 pro-A voters: they have A>B>C, so in B vs C, they prefer B over C. The pro-B voter prefers B over C. Manipulator prefers C over B. So B wins 4-1. 

  If manipulator's ballot is not drawn (4/5 chance), another ballot is drawn. If a pro-A ballot is drawn (3 available), they rank A>B>C, last is C, eliminate C. Then A vs B: 3 pro-A prefer A, pro-B prefers B, manipulator? They voted C>B>A, so in A vs B, they prefer B over A. So A has 3 votes, B has 2 (pro-B and manipulator). So A wins. 

