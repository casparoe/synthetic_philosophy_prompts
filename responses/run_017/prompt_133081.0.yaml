answer: |-
  **MEMORANDUM**  
  To: Academic Board Working Party  
  From: [Your Name], Student Member  
  Subject: Voting Rule Recommendation for Head of Division Election  
  Date: 26 May 2025  

  ---

  ### **Recommendation**  
  **Adopt the Uniform Random Ballot (URB)**. After voters submit full rankings, one ballot is drawn at random, and the top-ranked candidate on that ballot wins. This rule is strategy-proof (no voter can ever gain by misranking), satisfies the Registrar’s ballot format, and fits on one slide. While random, it is transparent, fair, and immune to manipulation—unlike Alternative Vote (AV), Borda, or the proposed Rule R.  

  ---

  ### **I. Flaw in Proposed Rule R**  
  Rule R stipulates: (1) One ballot drawn at random; (2) The last-ranked candidate on that ballot is eliminated; (3) The remaining two candidates face a majority vote. The claim that R avoids strategic voting is incorrect. Below is a preference profile (5 voters, 3 candidates: A, B, C) where a voter benefits from insincere voting.  

  #### **Sincere Preferences**  
  - Voters 1–3: A > B > C  
  - Voter 4: B > A > C  
  - Voter 5 (Pivotal Voter): **C > A > B**  

  #### **Sincere Outcome under R**  
  - If any ballot is drawn (Voters 1–4 or 5):  
    - Voters 1–3 eliminate **C** (last on ballot).  
    - Voter 4 eliminates **C** (last on ballot).  
    - Voter 5 eliminates **B** (last on their ballot).  
  - Final round: **A vs. B**.  
    - A wins 4–1 (Voters 1–3 and 5 prefer A > B; Voter 4 prefers B > A).  
  - **Result: A wins always**.  

  #### **Strategic Manipulation by Voter 5**  
  - Voter 5 (sincere: C > A > B) submits **insincere ballot: C > B > A** (ranking A last).  
  - **If Voter 5’s ballot is drawn (1/5 chance)**:  
    - A is eliminated (last on ballot), final round: **B vs. C**.  
    - B wins 4–1 (Voters 1–4 prefer B > C; Voter 5 prefers C > B).  
  - **If another ballot is drawn (4/5 chance)**:  
    - Outcome identical to sincere case: **A wins**.  
  - **Expected result for Voter 5**:  
    - 20% chance of B (their middle choice), 80% chance of A (their second-worst).  
    - This is **better** than sincere voting (100% chance of A), as C (their top choice) now has a *path* to win if B is weakened.  

  **Strategic Logic**: By ranking A last, Voter 5 gives C a chance to survive elimination when their ballot is drawn, improving their expected outcome despite not knowing others’ votes.  

  #### **Addressing the "Unrealistic Knowledge" Objection**  
  Manipulation here requires no knowledge of others’ ballots. Voter 5 only needs to recognize that A is strong (likely to win) and that ranking A last creates a *contingency* where C might avoid elimination. In a secret ballot of 40, such coarse reasoning—based on public frontrunner dynamics—is feasible. Rule R’s randomness *enables* this by making outcomes depend on a single drawn ballot.  

  ---

  ### **II. Recommended Alternative: Uniform Random Ballot (URB)**  
  **Procedure**: All voters rank all candidates. One ballot is drawn randomly; the top-ranked candidate on that ballot wins.  

  **Why URB?**  
  - **Strategy-proof**: A voter’s best move is *always* to rank sincerely. If their ballot is drawn, their top choice wins; if not, their vote has no effect. No incentive to misrank.  
  - **Simple**: Explainable in one sentence/slide.  
  - **Fair**: Equal influence (each ballot has identical weight).  
  - **Robust**: Immune to Gibbard-Satterthwaite by embracing randomness.  

  **Drawback**: Randomness may seem undemocratic. However, for small, high-trust groups like ours, it is a minimal concession to ensure sincerity.  

  ---

  ### **III. Analysis of Rivals**  
  #### **Strongest Rival: Alternative Vote (AV)**  
  - **Procedure**: Eliminate the candidate with the most last-place votes; repeat until one candidate has a majority.  
  - **Case for AV**: Familiar (used in Australian elections), deterministic, and ensures majority support.  
  - **Why Not AV?**  
    - **Manipulable**: In close races (e.g., 3 candidates), voters may reverse rankings to block a frontrunner (e.g., "compromising" or "burying").  
    - **Complex**: Explaining eliminations requires multiple slides.  

  #### **Borda Count**  
  - **Procedure**: Assign 2, 1, 0 points to 1st, 2nd, 3rd places; highest score wins.  
  - **Case for Borda**: Recognizes broad support and reduces "spoiler" effects.  
  - **Why Not Borda?**  
    - **Highly Manipulable**: Voters can boost rivals by ranking them last (e.g., "truncation" or "burying").  
    - **Non-monotonic**: Ranking a candidate higher can sometimes cause them to lose.  

  ---

  ### **IV. Can Rule R Be Repaired?**  
  No minor amendment fixes Rule R without sacrificing core features.  
  - **Problem**: Randomness + elimination creates exploitable contingencies.  
  - **Possible "Fix"**: Eliminate the candidate with the *most* last-place votes (Coombs’ Method) instead of using one random ballot.  
    - **Sacrifice**: This reintroduces deterministic manipulability (e.g., voters may insincerely rank a threat last).  
  - **Fundamental Trade-off**: Any strategy-proof rule must either be random (like URB) or dictatorial—no middle ground exists.  

  ---

  ### **Conclusion**  
  Rule R is manipulable, as shown. URB is the only option satisfying the Registrar’s requirements: strategy-proof, simple, and ordinally expressive. AV and Borda invite gaming; Rule R’s flaws are inherent. For an election valuing integrity over spectacle, URB is optimal.  

