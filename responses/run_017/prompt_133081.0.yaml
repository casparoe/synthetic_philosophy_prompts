  Rule R involves drawing one ballot at random, eliminating the last-place candidate on that ballot, then holding a majority vote between the remaining two. The argument is that the randomness and the structure might prevent strategic voting. The user thinks this is flawed and needs a concrete example to show how manipulation can happen.

