  The user wants to know if there's a term for this phenomenon. They want it distinguished from Goodhart's Law, Simpson's Paradox, and the specification gaming in optimization. They also ask if the unintentional version is the same phenomenon. 

  First, I need to recall relevant concepts. Goodhart's Law comes to mind, but the user feels it doesn't fit because the measure still accurately tracks what it's defined to measure. The issue here is the disconnect between the proxy measure and the real-world concern. So maybe it's related to indicator distortion or boundary manipulation.

  The user mentioned two examples: the detection limit change and the reclassification of river sites. Both involve changes in thresholds or sampling that affect the count without real change. This sounds like boundary management or threshold effects. 

  Looking into philosophy of science, perhaps Campbell's Law or the Lucas Critique, but those are more about social indicators and economic policy. The user's case is more about measurement thresholds. So maybe "threshold effect" or "categorical boundary artifact" is closer. 

  The user also wants to distinguish from Simpson's Paradox (which involves aggregated data paradoxes) and specification gaming (intentional exploitation). The examples given lack intent, so it's more about structural shifts. 

  The core issue is misalignment between the operational definition and the underlying construct. Terms like "construct drift" or "operationalization gap" might apply. Since the threshold itself changes, "threshold creep" or "boundary redefinition" could work. 

  Also, considering the user's background, precise terminology is important. They need a term that encapsulates unintentional shifts in thresholds affecting metrics without malign intent. "Measure-target decoupling via boundary shift" might be too wordy. 

  Perhaps combining ideas: "Threshold-Induced Proxy Distortion" (TIPD) or "Boundary Artifact in Target Metrics" (BATM). But need to define it clearly. Emphasize the non-malicious, structural nature. 

  Also, ensuring it's separate from Goodhart's Law by highlighting that the measure is still valid for its definition, but the definition changed. The unintentional aspect is key here. So the phenomenon is about the misalignment between the operational measure and the construct, exacerbated when the measure becomes a target, leading to boundary adjustments. 

  Finalizing the term as "Boundary Artifact in Target Metrics" (BATM) with a clear definition that includes both intentional and unintentional shifts, but focusing on structural changes rather than gaming. Highlighting how the threshold movement redefines what's measured, making the count incomparable over time. This distinguishes it from Simpson's Paradox (aggregation) and specification gaming (intent).
answer: |-
  This is a brilliantly observed phenomenon – and you're right that it's distinct from its conceptual neighbors. The core issue is **the inherent instability of categorical thresholds when used as performance metrics, leading to misalignment between the measured proxy and the underlying construct of interest, often through unintentional shifts in the boundary definition or the sampled population.**

  The established concept that **best encompasses this, especially the unintentional aspect you emphasize, is a specific manifestation of Campbell's Law,** often discussed alongside Goodhart's Law but focusing on the *corruption of indicators* rather than intentional gaming.

  **The Core Concept: Boundary-Induced Construct Drift (or Threshold Instability Artifact)**

  1.  **The Setup:** A complex, continuous, or multidimensional reality (e.g., river cleanliness, patient wait time experience, metal contamination level) is operationalized using a simplified, categorical measure defined by a threshold (e.g., detection limit, regulatory standard, time target).
  2.  **The Proxy:** This categorical count (e.g., samples > DL, sites < standard, patients < 4h) becomes a key performance indicator (KPI) or target because it's measurable and seemingly relates to the construct.
  3.  **The Drift:** When effort is focused on improving *this specific count*, changes occur that *do* improve the count but *do not* necessarily improve the underlying construct. Crucially, these changes are often **structural or definitional shifts around the threshold itself, or in the population being measured**, rather than falsification or obvious manipulation of the data point.
  4.  **The Mechanism:**
      *   **Threshold Movement:** The definition of the boundary changes (e.g., new DL calculation, redefined reference conditions, subtle reinterpretation of "wait start time").
      *   **Population Selection Shift:** What gets fed *to* the threshold changes (e.g., stopping monitoring worst sites, prioritizing samples less likely to be borderline, changing triage protocols affecting who enters the "waiting" pool).
      *   **Non-Malicious Cause:** These shifts are often driven by genuine improvements in methodology, cost-cutting, administrative convenience, or even well-intentioned efforts to "clarify" the measure, *not* necessarily by a desire to cheat.

  **Why it's distinct from your neighbors:**

  1.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**
      *   **Similarity:** Both deal with the perverse effects of targeting a metric.
      *   **Distinction:** Goodhart's Law is broader and often implies *intentional* gaming or distortion *of the measure itself* (e.g., teaching to the test, creative accounting). **Your phenomenon focuses on the *instability of the categorical definition or population* used to *create* the count metric.** The count itself remains a perfectly accurate measure *of the specific categorical definition at that time*. The problem is that the definition/population drifted, making the count incomparable or misaligned with the construct. Goodhart often assumes the definition is stable but gamed; your cases show the definition itself is unstable under target pressure. Think of Goodhart's Law as gaming the *input* to a stable function; your phenomenon is a *change in the function* (the threshold/population definition).
  2.  **Simpson's Paradox:**
      *   **Similarity:** Both involve aggregation leading to misleading conclusions.
      *   **Distinction:** Simpson's Paradox is about *how data is grouped or aggregated* hiding or reversing a true underlying trend when looking at subgroups vs. the whole. **Your phenomenon is fundamentally about *shifting the boundaries or population that define the categories themselves* over time, making the *counts across those categories incomparable*.** It's about the instability of the *container*, not the paradox of aggregation within a stable container.
  3.  **Specification Gaming / Optimizing the Proxy:**
      *   **Similarity:** Both involve achieving the specified target without achieving the true goal.
      *   **Distinction:** Specification gaming usually implies *agents intentionally exploiting the gap* between the specification (the measure) and the true goal. **Your phenomenon highlights how the *specification itself (the categorical threshold/population) can drift structurally* under target pressure, *even without malicious intent*.** The "gap" isn't just exploited; the definition of the gap *moves*. Your river monitoring cessation example is particularly stark – the *specification of what constitutes "the list"* changed.

  **Is the unintentional version the same phenomenon?**

  *   **Yes, fundamentally.** The core mechanism – the inherent instability of categorical thresholds/populations under target pressure, leading to misalignment between the measured count and the underlying construct – is the same.
  *   **Intent Modifies the Flavor, Not the Structure:** Intentional manipulation (like deliberately changing the DL to make results look better) is a more egregious violation, but it still leverages the same underlying vulnerability: the count only captures what the threshold/population definition says it captures *right now*. Unintentional drift (like a new instrument naturally having a different DL, or administrative decisions altering the monitoring network for budgetary reasons) demonstrates that the vulnerability exists even *without* ill will. The pressure of the target creates an environment where structural changes affecting the boundary/population are more likely to occur and are less scrutinized because they "improve" the number. The *effect* (a misleading improvement in the count without real progress on the construct) is identical.
  *   **The "Edges":** The purest form of your phenomenon sits where:
      1.  A categorical threshold or defined population is used to create a count metric.
      2.  This metric becomes a target or key performance indicator.
      3.  Changes occur *to the definition of the threshold or the selected population* (not necessarily falsification of individual data points).
      4.  These changes improve the count metric.
      5.  These changes do not reflect (or may even mask) a genuine improvement in the underlying complex construct the metric was intended to proxy.
      6.  The changes can range from purely unintentional/consequential (new instrument DL) to semi-intentional/administrative (stopping monitoring bad sites, redefining classes) to fully intentional manipulation (explicitly moving the line to hit a target).

  **Name and Definition Proposal:**

  *   **Term: Boundary-Induced Construct Drift (BICD) / Threshold Instability Artifact (TIA)**
  *   **Formal Definition:** *The phenomenon whereby the use of a categorical count, defined by a specific threshold or population boundary, as a performance target induces structural changes to the definition of that boundary or the composition of the measured population. These changes result in an improvement in the reported count metric that is decoupled from genuine progress on the underlying, complex construct the metric was intended to represent, due to the inherent instability of categorical definitions under target pressure.*

  **Why this fits your cases perfectly:**

  1.  **Lab Detection Limits:** The *threshold* (detection limit) *drifted* due to a new instrument (structural change). The count of "detected" samples changed dramatically. The *construct* (actual metal concentration distribution) was stable. The *boundary* induced the *drift* in the reported outcome relative to the construct.
  2.  **River Classification:** The *boundaries* between classes were *redrawn* (threshold movement). The *population* of monitored sites *changed* (worst sites dropped). Both are changes to the *definition/composition* feeding the count of "failing" sites. The count improved. The *construct* (overall ecological health distribution) likely saw little real change. *Boundary* changes induced *drift* in the metric relative to the construct.

  **In essence, you've identified a critical flaw in the use of simplistic categorical metrics as proxies for complex realities, especially under target pressure: the lines defining the categories aren't fixed points in reality; they are administrative conveniences prone to shifting sands.** Understanding this "Boundary-Induced Construct Drift" is crucial for critically evaluating any metric based on counts above or below a line. It demands constant vigilance on the *definition* of the line and *what* is being fed across it, not just the count itself.
