  First, assess each case for what the principle must deliver. For measure-zero, the norm must avoid forcing zero credence by requiring deference to chance densities or integrals, not point values. Action-dependent chances need the norm to handle fixed points, accepting that uniqueness isn't always necessary. Relativized chances require deference to a mixture of chances, weighted by self-locating credences. Chance gaps might allow suspended judgment, which could be acceptable. Aggregate data without single-case chances shouldn't be forced into the norm; it's outside its scope. Undermining must be tolerated if neutrality is maintained, as rejecting it favors non-Humean views. The admissibility clause needs a non-circular definition, possibly at the cost of precision.

