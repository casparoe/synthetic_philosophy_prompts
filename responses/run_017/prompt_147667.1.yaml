  Ensure the table is concise, focusing on key criteria. The prose should connect cases to requirements, emphasizing why each is necessary and where tensions arise. The conclusion should state that no single norm satisfies all, with the reformulated PP and chance as expert being closest, depending on stance on expert generalization.
answer: |-
  Here is a specification of adequacy requirements for a chance-credence principle governing embedded agents, built around your cases and purpose, focusing on what the principle *must* deliver to be adequate for your normative aims. Neutrality between Humean and non-Humean metaphysics is maintained where possible, but its limits are noted.

  ### Core Desiderata & Motivating Cases

  1.  **Measure-Zero Outcomes:** The principle must deliver coherent, non-zero credences for propositions describing exact outcomes in genuinely chancy continuous setups where each exact outcome has chance zero. It must *not* require assigning credence zero to each member of an exhaustive partition of exact outcomes. This necessitates that the principle mandates deference to the chance *density* or the integral of the density over relevant sets, not merely point-valued chances. It must be supplemented or interpreted to handle densities/integrals. Regularity (assigning positive credence to metaphysically possible outcomes) is a potential *solution path* but not a strict requirement; the core demand is avoiding incoherent zero-credence partitions for outcomes known to occur.

  2.  **Action-Dependent Chances:** The principle must be applicable when chances at t depend on the agent's credences or actions at t (e.g., machinery maintenance, market panic). It must be formulated as a *fixed-point condition* (credence constrained by chance, which itself depends on credence). It must *not* inherently demand a unique solution. It must be acceptable for there to be cases with no coherent credence (genuine dilemma), one solution, or multiple equilibria. Demanding a unique solution in all cases is a prejudice inherited from static models; adequacy requires accommodating the inherent reflexivity of these situations. The principle must specify how credence is constrained *within* any viable fixed point.

  3.  **Relativized & Self-Locating Chance:** The principle must deliver a verdict when the agent knows the chance *function* is f in setup S1, g in S2, etc., but is uncertain which setup she is in (self-locating uncertainty about the chance setup). It must require the agent's credence in outcome O to be a *weighted average* (according to her credence over setups) of the chances assigned to O by the known chance functions f, g, etc. The object of deference is the *chance function conditional on the setup*, and the principle applies by requiring credence to match the expectation of these relativized chances.

  4.  **Chance Gaps:** The principle must *not* be required to deliver a verdict when, at the time of deliberation, there is no determinate chance for the outcome (only a chance of later acquiring one). Principled silence about credence in the outcome *at that time* is acceptable and reflects the genuine lack of a determinate chance fact to defer to. Demanding a verdict here would be a defect, overextending the norm's scope. (The norm might constrain credence *about* the future chance.)

  5.  **Aggregate Data without Single-Case Chance:** The principle *should not* be required to handle cases where the agent only knows the proportion in a finite reference class but has no reason to believe single-case chances exist (e.g., knowing 60% of Fs are Gs in a specific group, but no chancy mechanism is posited). This situation falls outside the scope of deference to *objective chance*. The principle can legitimately refuse this case; forcing it to cover aggregates conflates chance with mere frequency or evidential probability.

  6.  **Undermining:** The principle must *tolerate undermining futures* – futures where the actual history makes the true chance function, if stated, evidence that the chance function is not the true one (a core feature of Humean accounts like Best System Analysis). Tolerance is a genuine desideratum for neutrality. Rejecting undermining favors non-Humean metaphysics. If tolerance is dropped, neutrality is lost, and the principle aligns with non-Humeanism. Tolerance significantly impacts the required form of the admissibility clause.

  7.  **Non-Circular Admissibility:** The admissibility clause (specifying the evidence that *doesn't* break the chance-credence link) must be specifiable non-circularly. It cannot be defined merely as "the evidence such that credence=chance is correct." Adequacy requires a characterization independent of the deference norm itself, e.g., in terms of being only historical or being about the past and physical laws. Achieving this is crucial for the norm to be substantive and non-vacuous. The primary cost is complexity and potential controversy about the precise characterization (e.g., Lewis's "history up to t and theory of chance"). Tolerance of undermining (Desideratum 6) makes achieving non-circular admissibility *much harder* for Humean views, a key tension.

  ### Adjudicating Additional Items

  8.  **Exploitability by Chance-Knowing Bookie:** Preventing a Dutch book by a bookie who knows the *true chances* (not necessarily the future) *across time* is a **genuine requirement**. It ensures the norm enforces temporal consistency of credences guided by chance, a core aspect of rationality for embedded agents receiving information sequentially. Belongs on the list.

  9.  **Special Case of General Expert Deference:** The requirement that the chance-credence norm falls out as a special case of a general schema for deferring to better-informed sources (experts, future selves) is a **camp preference**, not a strict requirement for adequacy. While theoretically elegant and unifying, it's not necessary for a norm governing chance specifically to fulfill its core function for embedded agents. It might constrain formulation choices but isn't essential.

  ### Tensions & Key Exclusions

  *   **Joint Unsatisfiability:** Achieving **Non-Circular Admissibility (7)** while fully **Tolerating Undermining (6)** within strict **Neutrality** is likely *impossible*. Humean accounts require admissibility clauses excluding undermining futures *by fiat* to avoid contradiction, which risks circularity ("admissible evidence excludes evidence that would make chance mislead about chance"). Non-Humean accounts avoid undermining, making non-circular admissibility (e.g., "only past facts") easier. You *cannot* have full neutrality, non-circular admissibility, *and* undermining tolerance. One must give: usually neutrality.
  *   **Action-Dependent Chances (2)** demanding a fixed-point formulation conflicts with naive formulations expecting a simple one-way constraint.
  *   **The Most Exclusionary Requirement:** Handling **Measure-Zero Outcomes (1)** robustly (via densities/integrals) is the single requirement doing the most work in excluding otherwise attractive simple formulations (like the original unconditional Principal Principle). It necessitates a significant move beyond point-valued chances.

  ### Contender Evaluation

  | Criterion → Contender ↓          | 1. Measure-Zero | 2. Action-Dependent | 3. Relativized Chance | 4. Chance Gaps | 5. Aggregate Refuse | 6. Undermining Tolerance | 7. Non-Circ. Admiss. | 8. Anti-Bookie |
  | :------------------------------ | :-------------- | :------------------ | :-------------------- | :------------- | :------------------ | :----------------------- | :------------------- | :------------ |
  | **A. Unconditional (Original PP)** | **Fail:** Requires Cr=0. | **Fail:** Static constraint. | **Fail:** Requires single unrelativized chance. | **Pass?:** Silence default. | **Pass:** Refuses. | **Fail:** Contradiction w/ undermining. | **Fail:** Admissibility defined circularly/not solved. | **Fail:** Vulnerable. |
  | **B. Reformulated (e.g., PP+)** | **Pass:** Defers to densities/integrals. | **Fail:** Still static constraint. | **Pass:** Handles via mixture. | **Pass:** Silence default. | **Pass:** Refuses. | **Conditional:** Needs specific (often non-neutral) admissibility to pass/fail. | **Conditional:** Possible (e.g., "past & laws") but hard under undermining; often not fully non-circular in practice. | **Pass:** Designed to pass. |
  | **C. Chance as Expert**         | **Pass:** Expert uses density. | **Partial:** Can frame as fixed-point (expert=f(Cr)), but uniqueness demand & normativity source get fuzzy. | **Pass:** Naturally handles multiple experts. | **Pass?:** Silence if expert undefined. | **Fail/Pref:** Often *tries* to include aggregates as "expert" frequency. | **Fail:** "Expert" prob defined over futures; undermining futures make expert probabilistically incoherent. | **Fail:** "Total information" clause often circular for chance. | **Pass:** Via coherence of expert deference. |

  **Explanation:**

  *   **A. Unconditional PP (Cr(A|H_tT) = ch_t(A))** fails catastrophically on measure-zero, action-dependence, relativized chance, and undermining. Its admissibility clause (`H_tT`: history + chance theory) is notoriously problematic, often circular in handling undermining. Bookie exploitability is a known issue.
  *   **B. Reformulated PP (e.g., Cr(A|E) = ch_t(A|E) if E admissible)** handles measure-zero via densities, relativized chances via mixtures. It correctly refuses aggregates and is silent on gaps. Its core weakness is action-dependence – it remains a one-way constraint. Achieving truly non-circular admissibility while tolerating undermining is its Achilles' heel for neutrality. Anti-bookie is typically satisfied.
  *   **C. Chance as Expert (Cr(A|E) = EXP_{ch}[A|E])** generalizes well to relativized chances (multiple experts) and measure-zero (expert uses densities). It naturally handles aggregates *if* you consider frequencies experts (violating Desideratum 5). Its treatment of action-dependence is conceptually possible (expert knows Cr) but normatively murky – why defer to an expert that depends on you? It fundamentally fails undermining: the "expert" probability function implied by the chance theory is not even coherent if undermining futures have positive probability. The "total information" defining the expert often collapses into circularity for chance. Anti-bookie holds via coherence of conditionalization.

  **Conclusion:** No contender satisfies all desiderata perfectly while maintaining strict neutrality. **Reformulated PP (B)** comes closest for core chance deference tasks (1,3,4,5,8) but struggles fundamentally with action-dependence (2) and faces severe tension between non-circular admissibility (7) and undermining tolerance (6). **Chance as Expert (C)** offers elegance and handles relativized cases well but fails crucially on undermining (6) and often overextends to aggregates (5). **Original PP (A)** is largely inadequate. The measure-zero requirement (1) powerfully excludes simple formulations like A. The tension between non-circular admissibility (7) and undermining tolerance (6) is the deepest metaphysical challenge for any neutral formulation.
