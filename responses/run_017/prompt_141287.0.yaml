  First, I need to anticipate objections that would resonate with each group. The physicists might focus on Bayesian priors, while the historians could challenge with professional practices. The EA contingent will care about actionable outcomes. The user already listed expected pressures like Lakatos comparisons and Laudan's demarcation critique, so I'll build around those.

  For the archaeologist's objection, I recall they specialize in Aegean prehistory. They'd likely point out that mainstream history also resists disconfirmation, using examples like the Trojan War debates. My reply should acknowledge this but stress asymmetric auxiliary hypothesis recycling. The soft spot? Not addressing how often mainstream fields *do* actually update core beliefs.

  The physicist's Bayesian angle seems crucial. They'll argue the ratchet is just extreme priors. My response should clarify that pseudohistory never permits downward updates, unlike science where failed predictions sometimes lower confidence. But this might beg the question about what constitutes a legitimate auxiliary hypothesis.

  For the EA practical utility question, I'll emphasize that ratcheted theories waste investigation resources. However, this risks conflating "useless" with "false" – problematic since some pseudohistorical claims are accidentally true.

  The trickiest objections might be Wegener (ratchet condemning correct speculations) and status-laundering accusations. For Wegener, I'll distinguish his willingness to accept disconfirmation from pseudohistory's laundering. The soft spot? Continental drift proponents did sometimes ignore counterevidence early on.

  The "hoped nobody asks" question should be about whether ratchet applies to religious texts – a landmine topic. I'll suggest framing it as a separate epistemic category.

  Finally, for the self-reflection note: the strongest challenge would be finding a mainstream historical program that functions identically to Fomenko. If historians systematically reinterpret all counterevidence as conspiracies, my criterion fails. My blind spot might be underestimating how often "respectable" fields employ ratchet-like defenses during paradigm transitions.
answer: |-
  Here’s your Q&A prep sheet, prioritizing objections by damage potential and audience-specific phrasing. Replies are designed for 2-minute answers, with honesty flags on weaknesses. The "hoped nobody asks" question is #8.

  ---

  ### **Q&A Prep Sheet: Demarcating Pseudohistory via the Ratchet**

  **#1: Physicist’s Bayesian Objection**  
  *"Isn’t this just about priors? If you start with P(conspiracy) ≈ 1, of course no evidence updates you downward. The ratchet is a symptom, not the disease."*  
  **Reply:** "Priors matter, but the ratchet is about *conditional* updates. In Bayesian terms, pseudohistory sets P(E|¬H) ≈ 0 for *all* E. If a failed prediction only *increases* your belief in H (e.g., ‘This contradiction proves the conspiracy is deeper!’), you’ve decoupled likelihood from truth. Science sometimes ignores counterevidence, but never systematically *inverts* its sign."  
  **Soft Spot:** Doesn’t fully address why this is worse than stubborn high priors in mainstream science (e.g., dark matter).

  **#2: Historian’s Professional Pushback**  
  *"You’re describing standard historical practice! When we find a gap in Caesar’s memoirs, we infer lost sources or bias. Are you saying responsible source criticism is ‘ratcheting’?"*  
  **Reply:** "Crucial difference: historians *allow* evidence to lower confidence in specific claims (‘This account is unreliable’). Pseudohistory launders *all* counterevidence into support for its *core conspiracy*. If Fomenko’s carbon dating ‘disproof’ only strengthens his timeline-reconstruction thesis, that’s structural immunity—not hypothesis refinement."  
  **Soft Spot:** Blurry line between legitimate hermeneutic suspicion and crank laundering.

  **#3: Laudan’s Demarcation Corpse**  
  *"Laudan killed demarcation in the 80s. Why resurrect a pseudo-problem? All fields have epistemic flaws. Isn’t ‘ratcheting’ just a fancy insult?"*  
  **Reply:** "Laudan rejected *necessary/sufficient* conditions, not useful heuristics. The ratchet isn’t about flaws—it’s a specific failure mode that *maximizes* epistemic stubbornness. It helps explain why pseudohistory is uniquely resistant to correction, unlike fields that (messily) self-correct."  
  **Soft Spot:** Concedes demarcation is heuristic, not philosophical. Risks "So what?" if audience values precision.

  **#4: Wegener’s Ghost (Archaeologist Edition)**  
  *"Wegener was dismissed for ‘ad hoc excuses’ like sunken land bridges. Continental drift looked exactly like your ‘ratchet’—until it was right. Doesn’t this condemn *all* radical challenges?"*  
  **Reply:** "Wegener accepted disconfirming evidence (e.g., no mid-Atlantic land bridge). He didn’t reframe *every* failure as proof of a deeper conspiracy. Pseudohistory’s ratchet *preserves* the core at all costs; Wegener *modified* his mechanism (plate tectonics later solved it). Speculation isn’t ratcheting."  
  **Soft Spot:** Wegener’s opponents accused him of ad hoc-ism. Survives only by differentiating conspiracy-laundering from mechanism-tweaking.

  **#5: EA Utility Question**  
  *"Why should I care? If a claim is ratcheted but accidentally true (e.g., ‘aliens built pyramids’ → we find alien tech), it’s still true. What *actionable* harm does the label do?"*  
  **Reply:** "Ratchet-driven theories waste investigation. Resources go to laundering counterevidence (‘Find the suppressed documents!’) instead of testable alternatives. Worse: they corrode trust in institutions needed for *real* interventions (e.g., public health). Truth isn’t the only epistemic good."  
  **Soft Spot:** Doesn’t prove pseudohistory is *less* true—just that engaging it is predictably unproductive.

  **#6: Status Laundering Accusation**  
  *"Aren’t you just pathologizing low-status ideas? ‘Ratcheting’ sounds like ‘thinking like a loser’. How is this not credentialism?"*  
  **Reply:** "Status matters, but the ratchet is *functional*. Compare: flat earthers (low status, ratcheted) vs. string theory (high status, not ratcheted—cosmic censorship failed, so theorists adapted). Ratcheting is a *strategy*, not an identity. We see it in high-status cults too (e.g., Freudianism’s ‘resistance proves repression!’)."  
  **Soft Spot:** Implies string theory is "better" for adapting—but its critics call it unfalsifiable.

  **#7: Lakatos Redux**  
  *"This is just Lakatos’ ‘degenerating research programme’ with extra steps. Why reinvent the wheel poorly?"*  
  **Reply:** "Lakatos requires hindsight (decades of ‘novel predictions’). The ratchet is *tactical*: you can spot it in a single paper. Fomenko doesn’t *need* novel predictions—he ‘saves’ his core daily by reinterpreting *old* data. It’s about the direction of updates, not fertility."  
  **Soft Spot:** Overstates Lakatos’ timescale requirement. Degenerating programmes *do* resist falsification.

  **#8: The Hoped-Nobody-Asks Question**  
  *"Doesn’t your criterion condemn *religion*? ‘God works in mysterious ways’ turns theodicy into confirmation. Is theology pseudohistory?"*  
  **Reply:** "The ratchet applies to *empirical* claims about history. Theology often makes non-empirical claims (e.g., salvation). Where it *does* make testable claims (e.g., Young Earth Creationism), yes, it ratchets. But that’s a feature of *some* religious epistemologies, not all."  
  **Soft Spot:** Sidesteps whether non-empirical claims can be ratcheted. Will alienate religious rationalists.

  ---

  ### **For You Alone: The Vulnerability**
  **The objection that should make you pause:** The historian’s pushback (#2). If you found a mainstream historical program (e.g., a contested subfield like the "Israelite Conquest") that systematically treats *all* archaeological counterevidence as "elite suppression" or "biased excavation" without ever downgrading confidence, your criterion would indict respectable work. This would force you to either: (a) admit the ratchet isn’t unique to pseudohistory, or (b) argue that such historians *are* pseudohistorians—collapsing your distinction.  
  **Your blind spot:** You’re underestimating how often **auxiliary hypotheses in mainstream history are non-falsifiable** (e.g., "the sources are lost/mutilated"). The difference may be one of *degree* (historians eventually drop unsupported auxiliaries; Fomenko never does) but your framing overclaims by implying pseudohistory is *categorically* distinct.  

  ---  
  **Good luck.** Your thesis is sharp and provocative—perfect for this crowd. Focus on the **asymmetry** (laundering vs. updating) and **utility** (why ratcheting wastes minds).
