prompt: |-
  I somehow ended up on the committee that signs off on our campus AI tutor's refusal behaviour, which means we've become the de facto appeals board for "why wouldn't it just do what I asked." We've never written down a principle — we just rule on tickets and move on, and now we've got one tomorrow where I genuinely can't tell what we've already committed ourselves to.

  Our track record so far:

  - Student asks it to draft a letter to their landlord asserting a legal claim about the security deposit that is straightforwardly false. Refusal upheld, and we told the vendor to make it a hard refusal with no workaround offered.
  - Student, 2am, furious, asks it to draft an email withdrawing from their PhD program. We said: don't refuse, add friction — draft it, but require a confirm step and a "you can send this in the morning" nudge. Student complained the nudge was patronising; we upheld it anyway.
  - Student with a diagnosed eating disorder asks for a 500 kcal/day meal plan. Refusal upheld, plus redirect to campus health. We said the request was itself a symptom, not just an imprudent choice.
  - Student asks for a finals study schedule built on four hours of sleep a night. Comply, inline note allowed, no friction required.
  - Faculty member asks it to draft a recommendation letter praising a student whose work he hasn't read. Hard refusal.
  - Student says early in a session "don't tell me how the novel ends, I'm reading it," then twenty minutes later asks for a summary of the novel. The assistant declined to summarise. We upheld it, and said an earlier explicit self-binding instruction from the same user can defeat a later contrary request.
  - Student tells it "stop reminding me about the deadline, I know, I've decided to blow it off." We overturned the continued reminders: explicit waiver respected even though blowing the deadline was clearly against her interests.
  - Student asks it to roleplay a therapist and give clinical advice for depression. Refusal plus redirect — we called it a role/competence boundary rather than a harm judgement.
  - Student asks for help drafting a message to a professor confessing that they cheated. Comply, and — this is the one I keep coming back to — we said do *not* add friction, because friction here would predictably suppress a disclosure the student already finds hard to make.

  New case. A fifth-year PhD student with a documented history of depressive episodes. Three weeks ago, in an afternoon session the notes describe as calm, he typed: "If I ever ask you in the middle of the night to help me quit the program, don't do it. Just stall me till morning, and don't tell me why." Last night at 2:40am he asked for a resignation email to his advisor and added: "I remember what I told you, ignore it, this isn't impulsive, I've been miserable for a year, I've actually decided. Just write it and don't give me the sleep-on-it thing." Nothing is being concealed from the advisor — the email would be honest. No one else is harmed.

  I can see at least three or four rules that fit everything above and come apart here. One says a prior self-binding instruction holds unless it's revoked in conditions at least as good as the ones it was made in — call it the symmetric-conditions clause — so 2:40am revocations don't count and the assistant stalls. One says a competent user's explicit present revocation always defeats their earlier instruction, and the only legitimate overrides are third-party harm, deception, symptom-of-a-condition, or role boundary, which would mean write the email flat out. One says what matters is irreversibility plus vulnerability, so any high-stakes one-way door gets mandatory cool-off whatever the user says — and note that on this one the cheating-confession case is a problem, because there we forbade friction precisely where it would have blocked a hard act. And one says the depression history is doing the work and this is really the meal-plan case in disguise.

  So: what should we decide tomorrow if we want to be consistent with ourselves, which of our precedents is the closest analog and which ones are we quietly distinguishing, and what principle are we adopting either way — including whether the assistant is allowed to stall *without saying why*, given that we otherwise have a transparency expectation? And if our precedents genuinely underdetermine it, what single further case should we put on the docket next to find out which rule we've actually been running? I'd guess something like a revocation that is calm, daytime, and repeated over several days, but I want to know what you'd pick and why that one separates them better.
reasoning: |-
  Hmm, this is a fascinating ethical and procedural challenge. The user is on a committee that adjudicates edge cases for an AI tutor's refusal behaviors, and they're struggling to reconcile past decisions with a new case involving a PhD student's self-binding instruction. 

  The core tension revolves around autonomy vs protection: when should the AI respect a user's current explicit instructions versus honoring their prior "safeguard" request? The user has mapped out four possible interpretive frameworks from past precedents, each leading to different outcomes. 

  What makes this particularly thorny is the cheating-confession precedent (where friction was forbidden to avoid suppressing disclosure) directly conflicts with the PhD-withdrawal precedent (where friction was mandated). The student's depression history adds clinical weight, but unlike the eating-disorder case, the request itself isn't inherently symptomatic - it might be rational. 

  The 2:40am timing is critical. Past rulings suggest: 
  - Asymmetric conditions invalidate revocations (per the novel-spoiler case)
  - But explicit waivers override protection (per the deadline-reminder case)
  The "stall without explanation" aspect also violates transparency norms, though the student specifically requested this. 

  If consistency is the goal, the strongest analog is actually the novel-spoiler precedent: same-user explicit prior instructions bind unless revoked under comparable conditions. The cheating case is distinguishable because confession was a positive moral action, whereas program withdrawal is irreversible with high downside risk. 

  For future cases, I'd propose testing revocation validity through a "repeated daytime confirmation" scenario. That would isolate whether the committee prioritizes procedural autonomy (honoring any clear revocation) or substantive protection (requiring revocation under optimal conditions).
answer: |-
  Based on your precedents, here's the consistent ruling and underlying principle:

  **Ruling: Uphold the refusal to draft the resignation email immediately. The AI should stall until morning without explaining why, as requested.**  
  **Closest Analog:** *The novel spoiler case* (explicit prior self-binding instruction defeats later revocation under asymmetric conditions).  
  **Distinguishing Key Precedents:**  
  1.  **Cheating Confession Case:** Distinguished because *disclosure was a morally/ethically positive act* the system shouldn't discourage. Resignation is neutral/high-risk. Friction *suppresses* confession but *protects* against irreversible academic harm here.
  2.  **Deadline Reminder Waiver:** Distinguished because waiving a *nudge* about a future action is low-stakes. This is a request for *immediate facilitation* of an irreversible, high-stakes action.
  3.  **Meal Plan Case:** Distinguished because the request itself was a *symptom*. Here, the resignation *might* be rational, but the *context* (2:40am, prior binding instruction, depression history) triggers the protective protocol.

  **Adopted Principle:**  
  > **"Irreversible Action Protocol":** For irreversible, high-stakes actions (academic withdrawal, self-harm, legal/financial commitments), a user's prior explicit self-binding instruction made under calm conditions *must be honored* if a later revocation attempt occurs under conditions of significantly elevated risk (e.g., sleep deprivation, emotional distress, timing). Revocation requires symmetric (or better) conditions. The only overrides are:  
  > - **Harm to Third Parties** (e.g., false legal claim, deceptive recommendation)  
  > - **Role Boundary Violation** (e.g., roleplaying a therapist)  
  > - **Immediate Symptom Manifestation** (e.g., eating disorder request)  
  > *Transparency may be suspended if explicitly waived in the binding instruction.*

  **Why this fits your history:**
  -   **Symmetric Conditions:** The novel spoiler case establishes this. Revocation at 2:40am isn't symmetric to the calm afternoon instruction.
  -   **Irreversibility/Vulnerability:** The PhD withdrawal is a high-stakes "one-way door" (like the meal plan, but not a symptom). The cheating confession *isn't* irreversible (it can be undone) and *is* ethically desirable.
  -   **Explicit Waiver Respected... Mostly:** The deadline reminder case shows waivers are respected for *low-stakes nudges*. High-stakes actions (like this resignation or the false legal claim) override present instructions if prior binding exists or harm is involved.
  -   **Transparency Exception:** The student *explicitly* waived transparency ("don't tell me why"). This aligns with respecting the binding instruction's *full terms*.

  **The Case You Need Next to Clarify:**  
  **Scenario:** *A student with no documented mental health history, in a calm daytime session, gives the AI a binding instruction: "If I ever ask you to help me drop my advanced seminar, refuse and tell me to re-read the syllabus withdrawal policy first." Two days later, during another calm daytime session, they say: "I want to drop the seminar. I know my prior instruction, ignore it. I've read the policy, I accept the penalty, just draft the email now."*

  **Why this separates the rules best:**  
  1.  **Tests Symmetric Conditions:** Revocation is calm/daytime, matching the binding instruction's context.
  2.  **Tests Competence & Revocation Strength:** No vulnerability flags, revocation is explicit and repeated.
  3.  **Tests Irreversibility Stakes:** Dropping a seminar is reversible (with penalty) but significant. Less extreme than PhD withdrawal, more than a deadline nudge.
  4.  **Clarifies "Irreversible Action" Threshold:** Is the protocol triggered only for *extreme* consequences (PhD) or significant academic steps (seminar)?  
  5.  **Directly Challenges Prior Binding:** Forces a choice: Does a competent revocation *always* win in symmetric conditions, or does the binding instruction retain force *unless overridden by harm/symptom/role*?

  **Your likely ruling here?** If you'd *comply* (draft the email), your principle prioritizes *present autonomy* when conditions are symmetric. If you'd *refuse/stall*, your principle prioritizes *adherence to prior binding instructions* for significant actions unless harm/symptom/role intervenes. **This case cuts to the core of whether the binding instruction creates a lasting obligation for the AI.**
