prompt: |-
  I am one of five trustees of a small endowed charitable trust — about £180,000 of spendable income a year, distributed twice annually — whose deed instructs us to apply that income where it will do the most good that can reasonably be ascertained. I spent rather more than thirty years as an experimental physicist before retiring, and have taken to reading philosophy seriously only in the last few years, so I should be grateful for a plain argument rather than a display of erudition: we have no library access and no budget for external review, so nothing in the memo can rest on our being able to look anything up.

  At our May meeting we must decide on three applications for the same £60,000. One is a hospice-at-home service, for whom the money is two years of a specialist nurse: modest, certain, easily ascertained. The other two are long-shot research groups working on poorly specified threats to the very long-term future of civilisation. Each puts its case purely in expected-value terms — a probability somewhere between one in ten thousand and one in a million of being the decisive difference in an outcome affecting tens of millions of people, against which the hospice bid is negligible. One of my fellow trustees, a retired mathematician, says this is just Pascal's mugging dressed as a grant application, and that any probability we cannot test is a number someone has made up to fit the conclusion.

  The more interesting of the two groups has pre-empted him. It argues that we are wrong to scrutinise its particular number at all: we will face an indefinite stream of such applications, so the object of assessment should be our policy, not our case. It asks us to commit a fixed tenth of annual income to a high-variance strand, allocated by standing rule rather than by case-by-case judgements of credibility, on the ground that at the level of a repeated policy the small probabilities are far less likely to be sheer invention, and the aggregate case survives even if no individual application does. The trustee who dislikes this points out that we already buy insurance and once funded a pandemic preparedness project on tail-risk reasoning, so a flat refusal would be inconsistent.

  Please draft the two-page decision memorandum I will circulate to the board before the meeting. It should reach a definite recommendation — decline both, fund one as requested, or adopt some capped version of the standing-rule proposal — with a time frame or review point, and it should give the strongest version of the argument it is rejecting rather than dismissing it. In particular I would like your view on whether the shift from case to policy genuinely answers the fanaticism worry or merely relocates it, and on whether the reasonably ascertained wording in our deed does any real work here or is simply a way of begging the question.
reasoning: |-
  Hmm, the user is a trustee of a charitable trust facing a complex funding decision between a hospice nurse and two long-term risk research groups. They need a balanced decision memo addressing philosophical and practical concerns. 

  Key tensions emerge:
  - The hospice offers concrete, measurable impact versus speculative existential risk prevention
  - One research group frames this as policy-level decision to avoid Pascal's mugging concerns
  - The trust deed's "reasonably ascertained" clause creates interpretive challenges

  The mathematician trustee's skepticism about untestable probabilities is valid, but the insurance precedent complicates outright rejection. Interesting how the research group tries to reframe the debate - shifting from evaluating individual claims to establishing a principled allocation approach might indeed mitigate fanaticism worries by:
  1) Forcing explicit criteria for "high-variance" funding
  2) Creating accountability through mandatory review
  3) Capping exposure at sustainable levels

  However, the memo must acknowledge this doesn't eliminate fanaticism - it just contains it within defined boundaries. The deed's wording actually helps here by requiring that even policy-based allocations must pass the "reasonably ascertained" test for viability.

  Structurally, the recommendation should:
  - Preserve majority funding for measurable impact
  - Create a limited experimental strand (10% seems reasonable)
  - Demand concrete review mechanisms
  - Explicitly reserve the right to terminate if accountability fails

  The hospice clearly meets the deed's standards, while the research proposals individually don't - but as a class with proper safeguards, they might constitute reasonable diversification. The insurance analogy holds if (and only if) we treat it as a portfolio with strict loss controls.
answer: |-
  ## MEMORANDUM  
  **To:** Board of Trustees  
  **From:** [Your Name]  
  **Date:** 1 May 2024  
  **Subject:** Decision on Funding Applications: Hospice-at-Home vs. Long-Term Risk Research  

  ---

  ### **I. Core Dilemma & Applications Summary**  
  We face three applications for £60,000 (one-third of annual disbursable income):  

  1. **Hospice-at-Home Service**  
     - **Request:** Two years’ salary for a specialist nurse.  
     - **Impact:** Certain, immediate palliative care for ~50 patients/year. Quality of life improvements, family support, and bereavement care are measurable and well-documented.  
     - **Alignment with Deed:** Direct, visible good; impact is easily "reasonably ascertained."  

  2. **Long-Term Risk Research Group A**  
     - **Request:** £60,000 for AI alignment safety research.  
     - **Argument:** ~1/10,000 chance of averting a catastrophic AI event affecting >10M people. Expected value (EV) dwarfs hospice.  

  3. **Long-Term Risk Research Group B**  
     - **Request:** £60,000 for biosecurity threat modeling.  
     - **Argument:** ~1/100,000 chance of preventing a synthetic pandemic. Similar EV calculus.  
     - **Key Addition:** Proposes we adopt a *standing policy* allocating 10% of annual income (£18,000) to "high-variance, high-impact" work, bypassing case-by-case probability scrutiny.  

  ---

  ### **II. Critiques & Counterarguments (Fairly Stated)**  
  **A. The Mathematician Trustee’s Concern (Pascal’s Mugging):**  
  > *"Untestable probabilities are arbitrary. If we accept EV arguments based on invented numbers, we open the door to endless implausible claims. The hospice’s impact is real; the research impact is speculative fiction. Funding either group is irrational charity."*  

  **B. The Research Group B Rebuttal (Policy over Case):**  
  > *"Scrutinizing individual probabilities is futile. Instead, commit to a *policy* of allocating a fixed % to high-variance interventions. At the portfolio level, even if 9/10 grants fail, the 10th could justify all. This mirrors insurance logic (e.g., our pandemic preparedness grant). A flat refusal contradicts past risk-tolerant actions."*  

  **C. The Deed’s "Reasonably Ascertained" Clause:**  
  > Does this exclude highly speculative bets? Or does it merely require due diligence in assessment, allowing for reasoned judgment under uncertainty?  

  ---

  ### **III. Analysis: Policy vs. Fanaticism, "Reasonably Ascertained," & Feasibility**  
  **A. Does Shifting to Policy Solve Pascal’s Mugging?**  
  - **Yes, partially:** A standing rule *mitigates* fanaticism by:  
    - **Capping exposure** (e.g., 10% prevents 100% allocation to long-shots).  
    - **Demanding portfolio accountability** (track aggregate outcomes, not single grants).  
    - **Filtering for institutional credibility** (only serious orgs apply for sustained funding).  
  - **But:** It *relocates* fanaticism to the policy level. Why 10%? Why not 1% or 90%? The core challenge—quantifying the unknowable—remains.  

  **B. Does "Reasonably Ascertained" Do Meaningful Work?**  
  - **Yes.** It requires evidence-based judgment, not blind faith in EV math:  
    - The hospice’s impact is *demonstrable* through medical data.  
    - Research proposals lack *falsifiable* metrics. Their probabilities are narrative devices, not "ascertained" estimates.  
    - A *policy* can be "reasonably ascertained" **if** it includes:  
      - Clear criteria for "high-variance" eligibility.  
      - Mandatory impact reviews.  
      - A sunset clause.  
    - **Verdict:** The deed forbids funding *individual* high-risk grants lacking credible evidence. It *permits* a *structured policy* with safeguards.  

  **C. Feasibility & Precedents:**  
  - **Insurance/pandemic grant precedent:** Valid, but distinct. Those addressed *known, proximate* risks (e.g., fire, disease) with established models. These proposals target *amorphous, distant* threats.  
  - **Resource constraints:** We lack capacity to rigorously monitor high-risk grants. A policy requires administrative rigor we cannot provide ad hoc.  

  ---

  ### **IV. Recommendation: A Capped Policy Pilot**  
  **Reject both research applications as standalone grants.** Their probabilities are too speculative to meet "reasonably ascertained."  
  **Fund the Hospice-at-Home nurse.** It delivers certain, profound good aligned with our deed.  

  **But adopt a modified Standing Rule Policy:**  
  1. **Allocation:** Commit **5% of annual income (£9,000) for 3 years** (not 10%) to a "Long-Term Resilience Fund" (LTRF).  
  2. **Scope:** Focus on **preventing identifiable, global catastrophic risks** (e.g., AI misalignment, engineered pandemics, nuclear winter mitigation). Climate change is excluded (well-funded elsewhere).  
  3. **Safeguards:**  
     - **Review:** Full board assessment at Year 3. Renew only if:  
       - Grants show credible methodology (e.g., peer-reviewed prototypes, policy influence).  
       - No credible evidence of misuse or misrepresentation.  
     - **Cap:** Never exceed 5% annually.  
     - **Criteria:** Require applicants to:  
       - Define concrete milestones (e.g., "publish threat model in journal X," "test containment protocol in lab Y").  
       - Justify why *their niche* is neglected by larger funders.  
  4. **Process:** Allocate LTRF funds via a simplified annual RFP. Trustees vote on awards as a bundle, not case-by-case.  

  ---

  ### **V. Why This Approach?**  
  1. **Honors the Deed:**  
     - 95% of income funds measurable good (hospice + other proven work).  
     - The 5% policy is "reasonably ascertained" *as a diversified, capped bet* with strict review.  
  2. **Balances Caution and Foresight:**  
     - Avoids Pascal’s Mugging by rejecting individual speculative bets.  
     - Captures potential for outsized impact via a bounded, reviewable policy.  
  3. **Practically Manageable:**  
     - £9,000/year is material but not destabilizing.  
     - Bundled approvals reduce administrative burden.  
  4. **Addresses Inconsistency:**  
     - Aligns with past risk-taking (pandemic grant) but within a *deliberate framework*, not ad hoc exceptions.  

  **Motion for May Vote:**  
  - *Approve £60,000 for Hospice-at-Home nurse.*  
  - *Establish a 3-year Long-Term Resilience Fund at 5% of annual income (£9,000/year), with renewal conditional on Year 3 review.*  

  ---  
  **Final Note:** This policy does not "solve" fanaticism; it contains it within strict guardrails. If Year 3 review reveals arbitrary probability claims still dominate, we terminate the fund. The hospice, however, is unquestionably good done *today*. That must remain our priority.  

  // End //
