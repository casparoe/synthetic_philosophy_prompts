answer: |-
  Below is a concise flowchart designed for museum curators to evaluate objects and make evidence-based claims about belief or social institutions—or stop at "we can't say." It adheres to your constraints:  
  - **8 branch nodes** (questions about physical/depositional evidence).  
  - **Belief claims are gated** (requires direct evidence; not default).  
  - **Analogy problem** called out (Node 5).  
  - **Indistinguishable claims flagged** (e.g., votive vs. rubbish).  
  - **Unoccupied combinations** identified.  

  **Key to symbols:**  
  - ▶ **Branch nodes**: Questions (bolded).  
  - ◆ **Leaves**: Claims (italicized) or agnostic endpoint.  
  - ⚠ **Flags**: Indistinguishable claims or analogy warnings.  

  ---

  ### Flowchart: From Object to Claim  

  **Start**: Object with documented archaeological context (excavation site, layer, associated finds).  

  1. ▶ **How was the object deposited?**  
     - **Intentional placement** (e.g., grave, shrine, hoard, foundation): Go to 2.  
     - **Accidental deposition** (e.g., midden, loss, erosion): Go to 2.  
     - **Unclear/unknown deposition**: Go to 7.  

  2. ▶ **Is there visible use-wear?**  
     - **Yes** (e.g., tool edges worn, repairs, residues): Go to 3.  
     - **No** (pristine/unused): Go to 4.  
     - **Inconclusive/eroded**: Go to 7.  

  3. ▶ **Is the object one of many in this context?**  
     - **Mass-produced** (e.g., 100+ similar items): Go to 6.  
     - **Rare** (e.g., 1–5 similar items): Go to 4.  
     - **Moderately common** (e.g., 6–99 items): Go to 5.  

  4. ▶ **Is it found with administrative objects?**  
     - **Yes** (e.g., sealings, tallies, weights, tablets): ◆ *Bureaucratic record-keeping*.  
     - **No**: Go to 5.  
     - **Uncertain**: Go to 7.  

  5. ▶ **Do comparanda (parallel objects) exist?**  
     - **Yes, from similar cultures/periods**: Go to 6.  
     - **Yes, but from distant/chronologically far cultures**: ⚠ **Analogy problem**—overlaying foreign frameworks risks misinterpretation. Go to 7.  
     - **No comparanda**: Go to 8.  

  6. ▶ **Is the object found with ritual-associated items?**  
     - **Yes** (e.g., altars, cult figurines, grave goods in sacred spaces): Go to 8.  
     - **No** (e.g., in domestic waste, workshops): ◆ *Household craft/trade*.  
     - **Uncertain**: Go to 7.  

  7. ▶ **Does context suggest intentional removal from circulation?**  
     - **Yes** (e.g., hoard, grave, sealed shrine): ⚠ **Indistinguishable claims**: *Votive offering (cult)* **or** *Elite rubbish (status)*—evidence insufficient to separate.  
     - **No** (e.g., midden, loss): ◆ *Domestic/mundane use*.  
     - **Uncertain**: ◆ *Agnostic (insufficient evidence)*.  

  8. ▶ **Is there direct evidence for belief?**  
     - **Yes** (e.g., inscriptions naming deities, iconography tied to texts): ◆ *Belief (specific ideology)*.  
     - **No** (e.g., ritual items but no explanatory text/symbols): ◆ *Ritual practice (cult)*.  
     - **Uncertain**: ⚠ **Indistinguishable claims**: *Status competition* **or** *Gift economy*—context supports both; no diagnostic evidence.  

  ---

  ### Agnostic Leaf  
  - ◆ **Agnostic (insufficient evidence)**: Reached from Nodes 1, 2, 4, 5, or 7. Used when deposition, use-wear, comparanda, or associations are ambiguous.  

  ---

  ### Unoccupied Combinations (and Why)  
  The flowchart allows these evidence combinations, but scholars avoid them:  
  1. **Ritual associations + Mass-produced + Use-wear** (e.g., 100+ worn cult objects in a shrine):  
     - *Theoretically possible*: Could imply routinized ritual labor (e.g., temple workers).  
     - *Unoccupied*: Scholars default to "ritual practice" (ignoring use-wear) or "household craft" (ignoring context). **Why?** The hybrid is analytically unattractive—it challenges romanticized notions of ritual as "special."  

  2. **Accidental deposition + No comparanda + No use-wear** (e.g., pristine object in a midden):  
     - *Theoretically possible*: Could be accidental loss of a prestige item (status) or votive rubbish (cult).  
     - *Unoccupied*: Curators default to "domestic use" or agnosticism. **Why?** The combo is incoherent—pristine items in trash lack a clear ethnographic parallel.  

  3. **Administrative links + Rare + Direct belief evidence** (e.g., a tablet listing offerings beside a unique inscribed idol):  
     - *Theoretically possible*: Could merge record-keeping with personal devotion.  
     - *Unoccupied*: Field splits these into separate claims (e.g., "bureaucratic" vs. "belief"). **Why?** Unexplored—institutional analysis rarely overlaps with belief studies.  

  ---

  ### How to Use This Flowchart  
  - **Curator’s path**: Start at Node 1. Answer questions using excavation reports, conservation notes, and comparanda databases.  
  - **Belief claims are hard**: Only reachable via Node 8 with direct evidence (e.g., text/iconography). No speculation allowed.  
  - **Red flags**: Weak analogies (Node 5) or indistinguishable pairs (Nodes 7–8) force caution.  
  - **Output**: The "strongest honest claim" (leaf) or agnosticism.  

  This avoids jargon and fits a magazine sidebar. For a visual version, condense nodes into 3–4 decision diamonds with clear branches.
