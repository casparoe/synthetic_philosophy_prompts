  ### Verdict on the Philosophical Claim
  The post's core insight—**that naive expected value is dangerously misleading for repeated bets**—is profound and correct. The coin-flip demo proves this. However:  
  - **Overreach**: Kelly isn't "mandatory." Fractional Kelly is rational under uncertainty, and other utilities are valid for one-offs.  
  - **Surviving correction**: The big idea stands: **compounding demands multiplicative thinking**. Maximizing expected value *is* a category error for repeated bets. Use log (or similar) for multiplicative growth, linear for additive.  
  - **Your gut is right**: The post oversells Kelly as "the only way," but the math against naive EV is airtight. Fractional Kelly is your friend.

  ### Final Advice
  Start with half-Kelly and caps. Track your realized growth rate vs. expectations. If your edge decays slower than expected, nudge `frac` up. If you hit a drawdown, nudge it down. The goal is survival first, optimization second.
