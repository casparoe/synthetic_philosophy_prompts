  We are going to break this down into two parts as requested.

  Part One: Critique of the Blog Post's Argument

  The blog post makes several strong claims about the Kelly criterion. We'll go through them one by one.

  1. "Don't maximize expected money, maximize the expected logarithm of your wealth. And it isn't one option among many, it's forced — anyone not doing it is making a mistake you can prove."

     - This is a strong statement. The Kelly criterion (maximizing expected log wealth) does have strong theoretical backing for repeated bets. In the long run, it maximizes the asymptotic growth rate of wealth. However, it is not the only rational choice. Other utility functions (like exponential utility for constant absolute risk aversion) are used in finance, and for good reasons. The Kelly criterion is optimal for growth but has high volatility. The "mistake" is only in the specific context of maximizing long-run growth. If an investor has a different objective (e.g., minimizing the probability of ruin, or having a more stable return profile), then Kelly might not be optimal.

  2. "As the number of bets grows, a Kelly bettor ends up richer than someone following any other fixed rule, with probability approaching 1, and anyone on a different rule either goes broke outright or falls behind by so much that it amounts to the same thing."

     - This is essentially the statement of the Kelly criterion's asymptotic optimality. It is true that in the long run, the Kelly bettor will almost surely have more wealth than any other essentially different strategy. However, note that:
       - The "probability approaching 1" is in the limit of infinitely many bets. For a finite number of bets, there is a non-zero probability that the Kelly bettor is behind.
       - The claim that non-Kelly bettors either go broke or fall behind is too strong. For example, a bettor who uses a fixed fraction less than Kelly (fractional Kelly) will not go broke (if the fraction is positive and the bets are favorable) and will grow, but at a slower rate. They do not "fall behind so much that it amounts to the same thing" in the sense of ruin, but they do grow slower. The statement about going broke is only true for strategies that overbet (bet more than Kelly) or for strategies that take negative expected value bets.

  3. "Betting more than Kelly lowers your growth rate and adds risk at the same time, while betting less than Kelly just hands the difference to whoever is on the other side of the bet."

     - This is mostly correct. Betting more than Kelly (overbetting) does reduce the growth rate and increases the risk of ruin. Betting less than Kelly (underbetting) reduces the growth rate, but it does not necessarily "hand the difference to the other side" in a direct way. The underbettor is leaving some growth on the table, but they are also reducing volatility. The blog post portrays underbetting as strictly dominated, but in reality, underbetting can be a rational choice for risk-averse investors.

  4. "Geometric rationality isn't a temperament or a risk preference; it's what rationality means once you notice that wealth compounds."

     - This is a philosophical claim. While the Kelly criterion is a powerful tool for repeated bets, rationality is context-dependent. For one-off bets, or for investors with finite horizons or other constraints, other approaches are rational. The post's claim that expected value is a "habit left over from one-shot puzzles" is fair in the context of repeated bets, but expected value is appropriate for one-shot decisions.

  5. The coin flip example: It correctly illustrates that expected value can be misleading for repeated bets because of the multiplicative nature of wealth. The example shows that the expected value of the bet is positive, but the individual who repeatedly bets will almost surely go broke because the multiplicative factors (1.5 and 0.6) have a product of 0.9, meaning that the expected log return is negative.

  6. "The fraction it spits out doesn't depend on how much money you have, since your net worth cancels out. That's the signature of a genuinely rational rule."

     - The Kelly fraction is indeed independent of current wealth (for a fixed opportunity). This is a desirable property for a growth-optimal strategy. However, note that in reality, the size of the opportunity might change with wealth (e.g., in markets with liquidity constraints) so the independence is a feature of the model. Also, if the utility function were different (e.g., if we were maximizing a power utility function with constant relative risk aversion), the bet fraction would also be independent of wealth.

  7. "Fractional Kelly ... is cowardice with a story attached: you pay in growth and get nothing back."

     - This is too harsh. Fractional Kelly (betting a fixed fraction of the Kelly bet) is a common practice to reduce volatility and the risk of ruin. The trade-off is that you get a smoother equity curve and lower drawdowns at the cost of lower growth. For many investors, that trade-off is worth it. Moreover, if there is uncertainty about the true edge, fractional Kelly can be a way to be robust to model error.

  In summary, the blog post is correct about the mathematical properties of the Kelly criterion in the ideal setting of repeated independent bets with known edge and no constraints. However, it overstates the case by suggesting that any deviation from Kelly is irrational. In practice, fractional Kelly is a rational response to model uncertainty, risk aversion, and other real-world constraints.

