answer: |-
  ### Part One: Dissecting the Blog Post's Claims

  Here's a breakdown of the post's arguments, highlighting what's solid, defensible, or overstated/misleading. I'll focus on mathematical and economic consensus, not philosophical preferences.

  1. **"Maximize expected logarithm of wealth, not expected money"**  
     - **Accepted**: For repeated bets with known edge, Kelly maximizes long-run growth rate. This is proven and uncontroversial.  
     - **Wince-worthy**: Calling it "forced" or "the only rational choice" overstates. Kelly is optimal *for growth*, but:  
       - Ignores risk aversion (volatility matters in finite time).  
       - Assumes edge is known exactly (rarely true).  
       - Other objectives (e.g., survival probability) justify different strategies.

  2. **"Kelly beats any other strategy with probability →1 over infinite bets"**  
     - **Mostly correct**: In the limit, Kelly dominates any "essentially different" strategy (Breiman, 1961).  
     - **Overstated**:  
       - "Falls behind so much it amounts to going broke" is hyperbolic. A half-Kelly bettor grows slower but doesn't go broke (if edge > 0).  
       - Kelly bettors *can* go broke if bets are correlated or edge is misestimated.

  3. **"Betting more than Kelly lowers growth and increases risk; less than Kelly gifts edge to others"**  
     - **Half-right**: Overbetting *does* reduce growth and increase ruin risk (mathematically true).  
     - **Misleading**: Underbetting doesn't "gift" edge; it simply leaves growth on the table. The counterparty isn't directly enriched by your underbetting.

  4. **"Geometric rationality isn't temperament—it's mandatory for compounding"**  
     - **Defensible**: For repeated multiplicative growth, log utility is uniquely justified (see Kelly, 1956; Thorp, 1969).  
     - **Overreaching**: "Mandatory" ignores real-world constraints (liquidity, finite horizons). Expected value isn't a "category mistake"—it's optimal for one-off choices or linear utility.

  5. **"Fractional Kelly is cowardice with a story"**  
     - **Flat wrong**: Fractional Kelly (e.g., half-Kelly) is rational under:  
       - Uncertainty in edge estimation (the most common case).  
       - Risk aversion (volatility matters for humans/funds).  
       - The growth penalty for moderate underbetting is small; the risk reduction is large.

  6. **"Scale-invariance proves rationality"**  
     - **Accepted**: Independence from bankroll size is a strength (no arbitrary scaling).  
     - **Incomplete**: Other utility functions (e.g., CRRA) also exhibit scale-invariance. Not unique to Kelly.

  7. **The coin-flip demo**  
     - **Correct**: Perfectly illustrates how naive EV fails for repeated multiplicative growth. This is airtight.

  ---

  ### Key Distinction: Expected Log Wealth vs. Long-Run Growth Rate
  - **Expected Log Wealth**: The objective Kelly maximizes for a single bet: \( E[\log W_1] \).  
  - **Long-Run Growth Rate**: \( \lim_{N \to \infty} \frac{1}{N} \log \frac{W_N}{W_0} \).  
  - **Why they coincide**: By the law of large numbers, for i.i.d. bets, maximizing \( E[\log W_1] \) maximizes the long-run growth rate. But this assumes:  
    - Infinite bets.  
    - Known edge.  
    - No leverage/bankruptcy constraints.  
  - **Why the difference matters**: In finite bets or with uncertainty, maximizing \( E[\log W_1] \) doesn't guarantee highest terminal wealth. Volatility sequencing matters.

