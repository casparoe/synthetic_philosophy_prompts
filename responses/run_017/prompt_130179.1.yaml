  ### Part Two: Your Specific Situation

  #### Constraints & Implications
  1. **Venue caps (2k–5k on 400k bankroll)**  
     - You're forced into fractional Kelly. For a bet where Kelly says "bet 12k," your max is 5k (1.25% of bankroll vs. 3% Kelly).  
     - **Is bankroll the right denominator?** Yes. Kelly's math assumes bets scale with bankroll. Using total wealth (including salary) would be incorrect—only the risk capital should be bankrolled.

  2. **Finite bets (~200/yr, edge decay)**  
     - The asymptotic argument weakens. With few bets, the median outcome matters more than the mean log.  
     - **Recommendation**: Use fractional Kelly (e.g., 0.5x) to reduce risk of bad sequencing.

  3. **Salary top-ups & blowup risk**  
     - **Bankroll definition**: Use only the 400k at risk. Topping up lets you reset after losses, so:  
       - Full Kelly becomes *more* defensible (blowup isn't fatal).  
       - But overbetting still reduces growth.  
     - **Net effect**: Aggression is safer, but Kelly-optimal fractions don't change. Top-ups don't justify overbetting.

  4. **One-off bets (elections, awards)**  
     - Kelly is suboptimal here. For one-shots:  
       - If edge is small, bet sizing matters less.  
       - If edge is large, use a utility function (e.g., log utility still works).  
     - **Practical fix**: Use Kelly for all bets. One-offs are a small fraction, and log utility is sensible.

  5. **Edge uncertainty (2–4% edge, estimated from 1500 bets)**  
     - **The core problem**: Kelly is hypersensitive to edge misestimation. Overbetting is catastrophic; underbetting is safe.  
       - Betting 2x Kelly reduces growth to near zero.  
       - Betting 1.5x Kelly with 4% true edge → growth ≈ –∞ if true edge is 2%.  
     - **How wrong can you be?** Use confidence intervals:  
       - For a 4% edge, 1500 bets give ~±0.5% standard error (binomial).  
       - If you bet full Kelly at 4% edge, but true edge is 3.5%, growth drops ~25%.  
       - If true edge is 3%, growth turns negative.  
     - **Solution**: Fractional Kelly robustifies. Half-Kelly cuts growth penalty by 4x if wrong.

  ---

  ### Concrete Recommendations

  #### The Number for Your Config File
  - **Formula**: `bet_size = min( venue_cap, frac * kelly_fraction * bankroll )`  
    - `frac = 0.5` (half-Kelly) ← **Recommended due to edge uncertainty**.  
    - `kelly_fraction = (p * (odds + 1) - 1) / odds`  
      - `p` = your estimated win probability.  
      - `odds` = decimal odds (e.g., 2.0 for even money).  
  - **Bankroll**: The 400k at risk (not total wealth).  
  - **Why half-Kelly?**  
    - Compensates for edge uncertainty (your #1 risk).  
    - Caps already force underbetting; this adds robustness.  
    - Growth penalty is small (~25% reduction vs. full Kelly), while risk drops sharply.  
  - **Example**:  
    - Edge = 3%, odds = 2.0 → Kelly fraction = 0.03 / 1.0 = 3%.  
    - Half-Kelly = 1.5% → bet $6,000.  
    - Capped at $5,000 → bet $5,000 (1.25% of bankroll).

  #### When to Deviate
  - If you have high confidence in an edge (e.g., liquid markets with deep history), increase `frac` to 0.7.  
  - If bets are highly correlated (e.g., all on politics), reduce `frac` to 0.3 and lower total exposure.

