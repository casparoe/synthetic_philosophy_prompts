prompt: |-
  I'm doing a PhD chapter on Nozick and animals, and my supervisor is herself a card-carrying Nozickian — she thinks the bit about animals in Anarchy, State and Utopia gets something roughly right: persons are side-constrained, animals get something closer to a utilitarian treatment, and the creature with the greater capacity for a meaningful life can be favoured, but only when its superiority isn't merely marginal. I've been keeping a not of her verdicts across supervisions because I want to know where she'll land before I spring my new case on her next week.

  Her record so far:

  - One normal adult human vs one normal adult chimp, both painlessly dead if not rescued, save one: the human, and she isn't remotely apologetic about it.
  - One human vs ten chimps: she refuses to aggregate. Says it has to be settled pairwise or not at all.
  - One chimp vs one pig: the chimp. So inside the animal category she ranks by capacity, not by cuteness or by whom we happen to like.
  - Chimp painlessly killed to give a human a liver or a cornea: fine.
  - Chimp painlessly killed to spare a human a fortnight of mild eczema: not fine.
  - Chimp painlessly killed to save a human's index finger: fine, apparently, though she went quiet for a while first.
  - One human killed to save five humans: absolutely not.
  - I once asked about a human with advanced irreversible dementia — no self over time, no projects, no future-directed agency, but still pleasures and pains and people who love her — against a healthy chimp. She changed the subject.

  The case I'm bringing next week is an uplifted chimpanzee: gene-edited before birth and then given some neural graft in adolescence, so that she now has everything the Nozickian clause seems to care about — a self over time, long-term projects, a narrative sense of her own life, language, the lot. Call her U. So: U vs a normal adult human, one for one, painless; and U vs the demented human above. And two variants if they matter to your answer: U only got the graft last year, so 39 of her 40 years were ordinary chimp years; and the mirror image, where the human lost the capacities she once had while the chimp never had them until the graft.

  What I want is: predict her verdicts, but more usefully, set out the two or three rules that fit that track record about equally well — some species-or-kind-norm reading, some individual-capacity reading, some biographical or historical reading, whatever else you can construct — show exactly where they come apart on U, and tell me which single further case I should actually put to her to force her hand. Also say which of her existing verdicts is the least stable, the one I could push on without her noticing where it takes her. I know the literature, so no reading lists or citations, I just want the argumentative map. And please write it in British English (colour, favour, -ise endings) — I'm lifting chunks into the thesis and she is wierdly irritable about American spellings.
reasoning: |-
  Okay, let me tackle this user's request systematically. The PhD student needs help predicting their supervisor's stance on an uplifted chimp case, mapping possible underlying rules, and identifying strategic follow-up questions. 

  First, I need to analyze the supervisor's existing verdicts to identify patterns. Her positions clearly prioritize human persons over animals, reject aggregation for non-persons, and allow capacity-based distinctions among animals. The refusal to compare a demented human with a chimp suggests human biological identity might matter independently of current capacities.

  For the uplifted chimp (U) scenarios, I see three plausible interpretations of the supervisor's framework:
  - The "species-norm essentialism" view would likely still classify U as a chimp despite enhanced capacities
  - The "biographical continuity" perspective might discount U's pre-uplift history
  - A "strict current-capacity" approach would treat U as equivalent to a human person

  The critical test case would be U versus a human with congenital cognitive limitations - this forces the supervisor to choose between biological humanity and actual capacities. The dementia case from her record feels like the weakest point to probe, as it reveals tension between her no-aggregation stance and human exceptionalism.

  I'll structure the response to first outline predicted verdicts for U scenarios, then contrast the three interpretative frameworks, and finally recommend strategic next questions. The analysis should maintain academic rigor while being practically useful for the student's upcoming supervision meeting.
answer: |-
  Right, let's crack on with mapping your supervisor's likely terrain. Based on her track record and Nozickian leanings, here’s the predictive grid, the competing rule-sets, the point of fracture with U, and the strategic next move – all in British English.

  **Predicted Verdicts on Your U Cases:**

  1.  **U (uplifted chimp) vs. Normal Adult Human (1:1, painless death):** She will **save the human**. Expect minimal hesitation, possibly framed as "obvious". Her core commitment is to the inviolability of *human persons*. U, despite current capacities, remains biologically non-human.
  2.  **U vs. Demented Human (1:1, painless death):** This is thornier, but she will **save the demented human**. The dementia case history (changing the subject) strongly suggests an underlying commitment to the sanctity of *human biological life* as the primary bearer of rights, even when current capacities are diminished below U's level. U's non-human origin is the disqualifier.
  3.  **Variants (40-year history; Human losing capacities):** These likely **won't change her core verdicts** significantly. The *origin* (human vs. chimp) seems more fundamental than biographical history or current capacity snapshot for her. The human who lost capacities retains human biological status. U gained capacities but lacks human biological status. The 39 ordinary years might even reinforce her view that U isn't "truly" a person in the required sense.

  **Competing Rule-Sets Fitting the Track Record:**

  Three plausible frameworks emerge, all roughly consistent with her past verdicts but diverging sharply on U:

  1.  **Species-Norm Essentialism (Biokind Membership):**
      *   **Rule:** Moral status (inviolability vs. weighted interests) is fundamentally determined by membership in the human biological species (*Homo sapiens*). Current individual capacities *within* a kind matter for comparisons *within* that kind (chimp vs. pig) or for cost-benefit trade-offs *involving* non-persons (chimp liver vs. eczema/finger). But only human beings are *persons* protected by side constraints.
      *   **Fits Verdicts:** Explains human > chimp always (even vs demented human), refusal to aggregate chimps (not persons), chimp > pig (capacity within kind), chimp liver/finger trade-offs (cost-benefit for non-persons), absolute prohibition on killing one human for five (side constraints for persons).
      *   **On U:** U is unequivocally *not Homo sapiens*. Therefore, U lacks person-status and inviolability. U's current capacities are impressive but irrelevant to fundamental status; they only elevate U within the non-person animal category. Save the human, save the demented human.
      *   **Weak Spot:** The demented human verdict becomes purely species-fetishism, as current capacities are lower than U's. The finger case feels slightly unstable – why is a finger sufficient cost to override chimp interests if species is *all* that matters for personhood? Shouldn't any cost suffice?

  2.  **Biographical Personhood (Narrative Continuity & Origin):**
      *   **Rule:** Personhood (and thus inviolability) requires not just current high capacities (self-over-time, projects, language) but also a *biographical origin and continuity* as a being *of the kind* that normally develops these capacities *naturally*. Human infants and the demented human had/have this originating human biographical potential/narrative. A chimp, even uplifted, lacks this origin story; its capacities are artificial grafts onto a non-personal biographical foundation. Membership in a *kind* defined by the natural potential for personhood is key.
      *   **Fits Verdicts:** Explains human > chimp (natural person-origin), refusal to aggregate chimps (no person-origin), chimp > pig (capacity within non-persons), demented human > chimp (retains human biographical origin/past personhood), chimp liver/finger trade-offs (non-person), absolute prohibition on killing humans for aggregate benefit (personhood origin/status).
      *   **On U:** U lacks the *natural human biographical origin*. Her 39 ordinary chimp years define her fundamental kind and origin. The graft, however effective now, is an artificial addition to a non-personal life, not the realisation of an inherent potential. Therefore, not a full person. Save the human, save the demented human. The variants reinforce this – U's long pre-uplift history undermines claims to personhood; the human who lost capacities retains the crucial origin.
      *   **Weak Spot:** Requires defining "natural potential" and "kind" rigidly. Where does a severely cognitively disabled human *from birth* fit? (This is your leverage point). The finger case trade-off feels slightly arbitrary – how much cost justifies overriding a being with near-person capacities but wrong origin?

  3.  **Strict Current Capacity Thresholdism:**
      *   **Rule:** Inviolability is triggered solely by possessing certain *current* cognitive capacities (self-over-time, future projects, language, narrative sense) above a high threshold. Biological species or origin is irrelevant. Below this threshold, beings have interests weighted by their capacity level, subject to utilitarian trade-offs where significant cost/benefit justifies overriding those interests (with the "not merely marginal" clause).
      *   **Fits Verdicts:** *Mostly* fits: human > chimp (capacity), chimp > pig (capacity), refusal to aggregate chimps? (Problem – if chimps are below threshold, why *not* aggregate? This rule struggles most with this verdict). Chimp liver/finger fine (significant human cost), eczema not fine (insignificant cost). Killing one human for five not fine (above threshold). *Struggles with:* Demented human > chimp? (If demented human lacks threshold capacities, should chimp win? Her changing subject suggests she rejects this implication). Human vs 10 chimps? (If chimps below threshold, aggregation *should* apply).
      *   **On U:** U *possesses the threshold capacities*. Therefore, U is a person, inviolable. Save U over the demented human (who lacks capacities). U vs normal human is a true toss-up, perhaps decided by marginal factors or refusing to choose (but her human-priority bias suggests she might still save the human, inconsistently). The variants matter: If U only recently gained capacities, is she *fully* vested? The human who lost capacities loses protection.
      *   **Weak Spot:** Directly contradicts her demented human stance and her refusal to aggregate chimps. Makes her finger/liver trade-offs seem inconsistent – if chimps are *far* below threshold, almost any cost suffices; if *near* threshold (as U shows chimps could be), the cost required should be very high.

  **Where They Diverge on U:**

  *   **U vs. Normal Human:** Species-Essentialism & Biographical Personhood: Save Human. Strict Capacity: Toss-up (or favour human, inconsistently).
  *   **U vs. Demented Human:** Species-Essentialism & Biographical Personhood: Save Demented Human. Strict Capacity: **Save U.**

  **The Single Best Case to Force Her Hand:**

  **"The Congenitally Severely Impaired Human (CSI):"** Imagine a human being born with a profound, irreversible genetic disorder. They have *never* developed, and never will develop, anything approaching the capacities Nozick cares about – no self-over-time, no projects, no language, no narrative sense. Their cognitive and experiential life is demonstrably *lower* than that of a healthy chimpanzee (let alone U), perhaps akin to a very young infant or less, permanently. They experience basic pleasures/pains but lack any higher agency. Compare CSI vs. U (1:1, painless death).

  *   **Why this forces the issue:**
      *   **Species-Essentialism/Biographical Personhood:** Must save the CSI human. Their biological humanity and/or human biographical origin (even if potential was never realised) grants inviolability. U, lacking human origin, does not qualify, regardless of current capacity. *This exposes the core commitment to human biological kind as paramount.*
      *   **Strict Current Capacity:** Must save U. U possesses the threshold capacities for inviolability; the CSI human demonstrably does not. The CSI human has interests, but they are below the threshold and can be outweighed by the interests of a being above the threshold. *This exposes whether current capacity truly trumps species.*
      *   **Her Likely Reaction (Prediction):** She will **save the CSI human**, almost certainly. This is the logical extension of her demented human stance and her consistent human-priority. Forcing this verdict makes the Species/Biographical foundations explicit and reveals the Strict Capacity view as incompatible with her prior commitments.

  **The Least Stable Existing Verdict to Push On (Subtly):**

  **The Demented Human vs. Chimp (her changing the subject).** This is the soft underbelly.

  *   **Why it's unstable:** It directly clashes with the logic underlying her other animal verdicts (capacity matters *within* non-humans, cost-benefit applies). If capacity determines moral weight *for animals*, and the demented human has *lower* current capacity than a healthy chimp, why does the human automatically win? The refusal to engage suggests she recognises the tension but defaults to human biological sanctity ("human = person, no matter what").
  *   **How to Push (Gently):** Don't challenge head-on. Revisit it *after* discussing U and CSI. Frame it as seeking consistency: "If U, with full current capacities, still loses to a human lacking those capacities, purely on species grounds, does that same logic apply even more strongly to the demented human vs. chimp? That is, the demented human wins *only* because they are human, even with lower current capacities than the chimp? Is that the bedrock principle?" Link it to CSI. Her need to affirm this reveals the dominance of Species/Biographical thinking over Strict Capacity. If she wavers here, it opens the door to the Strict Capacity view, but her record makes that unlikely.

  **Summary Strategy:**

  1.  **Present U Cases:** Get her verdicts (predicted: Save Human, Save Demented Human).
  2.  **Highlight the Capacity/Origin Tension:** Point out U's capacities exceed the demented human's. Ask what principle resolves this.
  3.  **Introduce the CSI Case:** Force the choice between biological humanity and current capacity for personhood status. (Expected: Save CSI Human).
  4.  **Revisit the Demented Human vs. Chimp:** Frame it as the same principle in action (human biology wins over higher non-human capacity). Ask if this is the consistent rule.
  5.  **Identify the Core:** Her rulings will confirm that human biological kind (likely with some notion of natural potential/origin, even unrealised) is the necessary and sufficient condition for the highest moral status (inviolability) in her framework. Current capacities only matter *within* kinds or for cost-benefit trades *involving* non-humans. U, despite capacities, fails the kind-membership test.

  This should give you a very clear map of her commitments, expose the foundational role of human biological kind, and provide rich material for your chapter's critique. Good luck with the supervision!
