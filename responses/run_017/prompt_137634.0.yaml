answer: |-
  Here's a reconstruction of the Mencius-Xunzi disagreement in your framework, an analysis of the "residue," and a verdict on the bare-rearing test case. I'll use your specified vocabulary rigorously, flagging forced fits, and identify untranslatable elements.

  ### 1. Restatement in Developmental-Systems Vocabulary
  *(Honest Fit = Conceptually coherent translation; Forced Fit = Requires stretching or misrepresents core intent)*

  *   **Mencius' Position (Human Nature is Good):**
      *   **Incipient Tendencies ("Sprouts"):** Species-typical reaction norms predisposing humans toward prosocial behaviors (compassion, shame, deference, sense of right/wrong) in early development within *any* minimally adequate developmental niche. These are **canalized** expressions of the inherited resource base.
      *   **Spontaneous Reactions:** Proximal expressions of these reaction norms under typical environmental triggers (e.g., distress cues eliciting helping impulses). Indicates **robust canalization** of prosocial starting points across encountered environments.
      *   **Growth & Extension:** The **developmental niche** (especially social scaffolding like family, community, ritual) provides necessary inputs during **sensitive periods**. This niche doesn't create morality *de novo* but amplifies, shapes, and stabilizes (**canalizes further**) the pre-existing prosocial reaction norms. Failure of "growth" is a failure of niche provision/alignment, not faulty *xing*. Ultimate explanation focuses on why this prosocial norm was selected/constructed; proximal on how niche interaction realizes it.
      *   **Fit Assessment:** *Mostly Honest.* Mencius' view maps well to a reaction norm strongly biased toward prosociality, requiring typical niche inputs for full expression but starting from a canalized prosocial baseline. The focus is on proximal mechanisms of development within a niche.

  *   **Xunzi's Position (Human Nature is Bad/Disorderly):**
      *   ***Xing* as Raw Material:** The inherited resource base includes reaction norms producing self-interested desires, competitiveness, and emotional reactivity ("raw materials"). These are **species-typical outcomes** *if* development occurs *without* specific niche construction. This raw *xing* is robust/canalized - it's what you get without intervention.
      *   **Disorder as Unaided Outcome:** The default, unconstructed developmental trajectory (lacking the specific cultural niche) leads to conflict and dysfunction ("disorder"). This is the predicted **species-typical outcome** of the "bare" reaction norm.
      *   ***Wei* (Conscious Exertion/Cultivated Artifice):** The deliberate **construction of the developmental niche** (rituals, laws, education, moral models) by past/present society/individuals. This **scaffolding** is essential during **sensitive periods** to actively **counteract** the default trajectory and construct prosociality/order. Goodness is an **acquired product** of this niche construction process, imposed *upon* the raw materials via learning and habituation. Ultimate explanation focuses on how this niche construction process evolved/emerged; proximal on how *wei* shapes development against the grain of *xing*.
      *   **Fit Assessment:** *Partially Forced.* Translating *xing* as a default reaction norm leading to "disorder" is honest. Translating *wei* solely as niche construction/scaffolding is *forced* because Xunzi emphasizes *deliberate, artificial, effortful imposition* by conscious agents (sages, teachers, the self), contrasting sharply with spontaneous growth. Niche construction theory often implies more distributed, less centrally "deliberate" processes. The "counteraction" framing is core to Xunzi but less central to typical niche construction descriptions.

  *   **Explanatory Questions (Tinbergen's 4):**
      *   **Mencius:** Primarily answers **Proximate Causation** (How does goodness develop? Through niche support of innate tendencies) and **Ontogeny** (Development: How do the sprouts grow into virtue with niche input?). Touches on **Function** (Why is this system adaptive? Promotes social harmony/survival).
      *   **Xunzi:** Primarily answers **Proximate Causation** (How does goodness develop? Through deliberate niche scaffolding counteracting *xing*) and **Ontogeny** (Development: How is raw *xing* transformed into virtue via *wei*?). Strongly emphasizes **Evolutionary History** (How did the rituals/niche structures necessary for *wei* arise? Through the cumulative effort of past sages).

  ### 2. The Residue: What the Vocabulary Can't Hold (or Holds Poorly)

  1.  **Uniform *Xing* Premise:** Both agree *xing* is identical in sages and tyrants.
      *   *Issue for your vocabulary:* This explicitly decouples *xing* from **species-typical adult outcomes**. Your framework focuses on reaction norms leading to typical phenotypes. For Xunzi, the typical *adult* outcome *without niche construction* is bad, but *with* it, goodness is possible. For Mencius, the *potential* outcome is always good, but failure is common. The dispute becomes about the *potentiality* or *starting point* of development under *minimal* conditions, not the statistically typical endpoint in *actual* environments. Your framework struggles to articulate a "raw potential" distinct from typical outcomes in encountered environments. This residue suggests the core dispute was fundamentally about the *evaluative status of the starting materials*, not the prediction of typical outcomes under normal (constructed) niche conditions.

  2.  **"Good" (*shan*) as Non-Biological Normative Ideal:** Both use "good" in a strong ethical/cosmological sense – aligning with *dao* (the proper way/path/order of heaven and earth), embodying virtues like *ren* (benevolence), *yi* (righteousness), *li* (ritual propriety).
      *   *Issue for your vocabulary:* "Good" here is not primarily about inclusive fitness, functional adaptation to a specific environment, or even psychological well-being in a modern sense. It's a prescriptive, normative ideal rooted in a specific cosmic/social vision. Your vocabulary (fitness, function, species-typicality) can describe *behaviors* that might correlate with this ideal, but cannot capture its intrinsic normative content or cosmic grounding. Calling prosociality "good" is an approximation that misses the thick ethical context.

  3.  **Xunzi's *Wei* as Artificial/Intentional vs. Spontaneous:** *Wei* means deliberate effort, conscious activity, and crucially, *artifice* – something crafted, not natural.
      *   *Issue for your vocabulary:* This creates a categorical distinction absent in developmental systems theory. Your vocabulary sees "culture," "scaffolding," and "niche construction" as natural processes emerging from the same evolutionary principles as "biology." Xunzi posits a stark dichotomy: *xing* (spontaneous, natural, raw) vs. *wei* (deliberate, artificial, cultivated, effortful). There's no smooth continuum here; *wei* is defined *against* and imposed *upon* *xing*. Your framework struggles to accommodate this intentional, oppositional, "unnatural" quality of *wei*. It fits "niche construction" only if we force it to mean exclusively *deliberate, counteractive* cultural imposition.

  4.  **Mencius' Teleology of Growth:** Mencius sees the "sprouts" as inherently oriented towards their full moral realization (*ren*, *yi*, *li*, *zhi*) given proper conditions. The growth isn't just change; it's realization of inherent potential.
      *   *Issue for your vocabulary:* While "canalization" describes robustness, it doesn't imply an inherent *telos* or directionality towards a specific ideal state. Mencius' view has a stronger normative teleology – the sprouts *aim* at goodness. Your framework describes developmental pathways, not inherent purposes within the material. The residue is the implicit (or explicit) moral directionality built into the starting material.

  ### 3. Verdict: Limits and Clarifications

  *   **The Residue Marks Genuine Limits:** Specifically regarding:
      *   **Normative Content:** Your vocabulary fundamentally cannot capture the thick, prescriptive, cosmic meaning of "good" (*shan*) or the virtues. It can only describe associated behaviors mechanistically.
      *   **Intentionality & Opposition in *Wei*:** The core experience of *wei* as deliberate, effortful, counter-natural *action* (by society or self) is difficult to express purely in terms of reaction norms, niche construction, and scaffolding, which often imply more automatic or emergent processes. The "artificial vs. natural" dichotomy Xunzi relies on is foreign to your non-binary framework.
      *   **Uniform Potential vs. Typical Outcome:** The focus on identical *xing* as the shared *potential* starting point, distinct from actualized adult outcomes, is a conceptual move your framework, focused on reaction norms *leading to* typical phenotypes, isn't optimized to handle cleanly.
      *   **Teleology:** The inherent directedness Mencius attributes to the sprouts goes beyond describing canalized pathways.

  *   **Where the Original is Unclear/Conflated:** The classical dispute often **ran together questions your framework would separate**, and separating them clarifies why the bare-rearing test is problematic:
      *   **Minimal Starting Point vs. Typical Outcome:** They debated the *xing* (starting point/minimal expression), not necessarily the statistically typical adult outcome *in their own societies* (which both would likely agree requires niche input). Your framework naturally distinguishes the reaction norm under minimal input ("bare rearing") vs. under typical niche conditions. *This conflation is the source of the ambiguity in their bare-rearing predictions.*
      *   **Proximate Mechanism vs. Evaluative Status:** They debated *what* the raw material *is* (prosocial? self-interested?) and its *moral status*, not just *how* it develops. Your framework excels at describing mechanisms but is silent on the independent moral evaluation.
      *   **Dissolution upon Separation:** Once separated:
          *   Mencius' prediction for bare rearing: Fragmented, weak, but *present* prosocial impulses (the sprouts struggling without support), likely overwhelmed by basic needs/conflict. Not "good" adults, but not devoid of incipient goodness.
          *   Xunzi's prediction for bare rearing: Predominantly self-interested, conflictual, chaotic behavior ("disorder"). Incipient prosociality is either absent or negligible.
          *   **The difference in prediction exists but is NOT the interesting part:** The *interesting* part is their disagreement on the **evaluative status of the raw material** (Is it fundamentally good needing support, or bad needing suppression?) and the **nature of the process** required (Nurturing growth vs. Counteractive construction). The bare-rearing outcome is just a (poorly defined) proxy for that deeper disagreement about the starting point. Your framework clarifies this by forcing separation.

  *   **Where Your Framework is Unclear (or Implicitly Normative):** Your framework assumes "species-typical" or "functional" as neutral descriptions. However, labeling a reaction norm "robust" or a niche "adequate" carries implicit normative weight (towards survival/reproduction). Mencius and Xunzi make their normative stakes (*shan* vs. disorder) explicit and central, grounded in a broader cosmology. Your framework lacks the tools to engage with this level of explicit normativity.

  **Conclusion on the Bare-Rearing Test:** Your suspicion is correct. It's a **bad test** for the *core* Mencius-Xunzi disagreement because:
  1.  **Ambiguous Predictions:** Both predict a non-ideal outcome. Mencius predicts incipient goodness struggling; Xunzi predicts disorder. The difference is subtle and easily misinterpreted.
  2.  **Misses the Evaluative Core:** The test focuses on observable behavior, not the deep disagreement about the *moral status of the raw potential* or the *intentional/oppositional nature of cultivation (wei)*.
  3.  **Ignores Shared Ground:** Both agree *actual* goodness requires a constructed niche (*wei* for Xunzi; nurturing the niche for Mencius). The test removes this shared necessary condition.
  4.  **The Interesting Disagreement Lies Elsewhere:** The profound difference is in their conception of the starting point (to be nurtured vs. to be overcome) and the process (growth vs. construction), not solely in the prediction of a highly artificial, never-encountered minimal environment. Your framework helps dissolve the apparent predictive conflict by separating the question of the minimal reaction norm from the typical outcome and highlighting the residue of normative evaluation and intentional action that the test cannot capture. The classical dispute's power lies in these residues, not in the falsifiable prediction about bare rearing.
