prompt: |-
  Got a first-year seminar on causation next term and I keep tying myself in knots about omissions, so help me out before I have to stand in front of thirty people and pretend I know.

  Here are my gut verdicts:

  1. Lifeguard on duty is on her phone, toddler drowns in three feet of water two metres away, she'd have had him out in five seconds. Her not getting up caused the death. Not just 'she's blameworthy' — really caused it.
  2. A sunbather twenty metres away, also could have waded out in time, no relation to the family, no job, no promise. His sitting there did not cause the death. (Same counterfactual shape as 1, and that bugs me.)
  3. I promise to water your tomato plant, I forget, it dies. I caused it. Though somehow less than if I'd poured salt on it, and I also caused there to be no tomatoes, and I can't tell if that second claim is even the same kind of claim.
  4. A stranger who has never heard of you or your plant also doesn't water it. Obviously not a cause.
  5. Your plant would have died anyway — the flat flooded. My not watering didn't cause the death.
  6. Automated rinse cycle at a chip fab silently skips a step because of a firmware bug, whole wafer batch is ruined. The skipped rinse caused the ruin, and there is no agent, no promise, no duty anywhere in that story.
  7. Nurse is meant to give a painkiller at midnight and gives it at 2am. Patient dies at 4am and would have died at 4am either way. Her delay didn't cause the death, but it did cause two hours of agony. Are those two verdicts even in the same line of business?
  8. Ten thousand people see the appeal, nobody sends five pounds, the kid dies. I don't want to say each of them caused the death, I don't want to say nobody did, and I go back and forth on whether the group's omission did.
  9. Frank was never ever going to come to the faculty meeting (books a fishing trip every year without fail). His absence still sinks the quorum. Did his not showing cause the resolution to fail? I lean yes but it feels like cheating.

  My working principle is roughly: an omission causes an outcome when the outcome depends on the not-doing and the non-doer was the sort of thing that was supposed to be doing it — job, promise, mechanism, whatever the relevant 'supposed to' is. That handles 1 through 7, I think, and does nothing for 8.

  Can you give me one principle, or two at most, that gets as many of these as it can? State it precisely, tell me which of my verdicts it forces me to give up, and what it says about a pair I keep dithering over: the gardener who withholds water out of spite versus the one who forgets because he's hallucinating with a fever. And be explicit about what would change your mind about the principle, and where you think it's most likely to break.
reasoning: |-
  Okay, the user is prepping for a first-year seminar on causation and is struggling with omissions. They've listed nine scenarios where they have intuitive judgments but want a unified principle. Let me start by understanding their main issue. They feel that omissions cause outcomes only if there's some normative element, like a duty or promise. But scenario 6 challenges that because there's no agent, just a machine. So their principle needs to handle both cases.

  Looking at their examples, cases 1, 3, 6, and 9 seem to have causation by omission. The lifeguard, the promised watering, the machine skip, and Frank's absence. In contrast, the sunbather (2), stranger (4), and the case where the plant would die anyway (5) don't. The nurse (7) is partial: no death but caused agony. The charity case (8) is tricky; they don't want each person to be a cause but feel the group might be. 

  Their working principle involves "supposed to," which covers duties and functions. But scenario 6 has no agent, just a mechanism. So the principle must include both normative roles and functional roles. Maybe "normative-functional role" as a unified criterion. That would include job duties, promises, and system functions. 

  For the gardener scenarios: the spiteful one withholds water intentionally, which clearly fits both dependence and role (since they're hired to water). The hallucinating gardener also has a role but fails due to incapacity. Both should count as causing the death because the outcome depends on their omission and they have the role. But the user might feel the intentional act is more direct. However, under this principle, both are causes because the dependence and role are present. 

  Scenario 8 is harder. Each person lacks a role, so individually, they don't cause the death. But collectively, if the appeal creates a shared responsibility, maybe the group's omission causes it. But the principle doesn't handle groups well. The user is conflicted here, so the principle might need to accept that groups aren't covered, or introduce a separate criterion for collective responsibility, but that complicates things. 

  The user might need to accept that scenario 8 remains unresolved by this principle. Alternatively, if the appeal assigns a role (like a named fundraiser), then that person's omission causes it, but here it's a general appeal. So probably, the principle says no individual caused it, but perhaps the collective did, which isn't addressed. 

  Testing the principle against all cases: 1, 3, 6, 7 (agony part), and 9 work. 2, 4, 5, and 7 (death part) are correctly excluded. 5 is excluded because no dependence. 7's agony depends on the delay, and the nurse has a role, so it's covered. 

  Weaknesses: Scenario 8 isn't resolved, and group omissions need more theory. Also, the "normative-functional role" might be vague. For example, what counts as a role? In Frank's case, he's a faculty member, so his role implies attendance. But if someone unrelated skipped, it wouldn't count. 

  What would change the principle? If a case without any role but clear causation by omission appeared. But scenario 6 already covers a non-agent, so it's included via functional role. If a counterexample where dependence and role exist, but omission shouldn't be causal, that might challenge it. Or if collective cases force a different approach. 

  In summary, the principle handles most cases except 8, where the user must decide on collective responsibility separately. The gardeners both cause the death under this view, despite different mental states. The key is the role and dependence, not intent.
answer: |-
  Here's a unified principle that handles 8/9 of your cases cleanly, grounded in *dependence* and *normative-functional role*:

  **Principle:** An omission causes an outcome *iff*:
  1.  **Dependence:** The outcome counterfactually depends on the omission (i.e., if the omitted action had occurred, the outcome would likely not have occurred or would have been substantially different).
  2.  **Normative-Functional Role:** The non-acting entity had a specific, contextually relevant role or function *that normatively required it to perform the omitted action* (e.g., job duty, explicit promise, designed mechanism, institutional obligation).

  **Applying the Principle:**

  1.  **Lifeguard:** **Cause.** (Dependence: Yes. Role: Lifeguard's job *is* to save swimmers.)
  2.  **Sunbather:** **Not Cause.** (Dependence: Yes. *Role:* No relevant role or obligation to save the toddler.)
  3.  **Forgot Promise:** **Cause.** (Dependence: Yes. Role: Your *promise* created an obligation to water.)
  4.  **Stranger:** **Not Cause.** (Dependence: Yes. *Role:* No role or obligation.)
  5.  **Flooded Plant:** **Not Cause.** (Dependence: **NO.** Outcome happens regardless. Role irrelevant without dependence.)
  6.  **Skipped Rinse:** **Cause.** (Dependence: Yes. Role: The rinse cycle's *designed function* is to clean the wafer.)
  7.  **Delayed Painkiller:**
      *   Death: **Not Cause.** (Dependence: **NO.** Death happens regardless.)
      *   Agony: **Cause.** (Dependence: Yes (agony was prolonged). Role: Nurse's job *is* to administer meds on time to manage pain.)
  8.  **Ten Thousand:** **Inconclusive/Strained.** (Dependence: Yes *collectively*. Role: Problematic. *Individual:* No specific role/obligation created by a general appeal. *Group:* "The public" lacks a clear normative-functional role here. Principle struggles with diffuse collectives. You likely *must* give up a simple verdict here with this principle.)
  9.  **Frank's Absence:** **Cause.** (Dependence: Yes (quorum fails if he's absent). Role: As a faculty member, he has an *institutional obligation* to attend meetings (implied by membership/quorum rules), making his presence expected/required for certain functions.)

  **The Gardeners:**

  *   **Spiteful Gardener:** **Cause.** (Dependence: Yes. Role: As the gardener, he has a job duty/promise to water. *Withholding* is a deliberate omission fulfilling the functional role negatively.)
  *   **Hallucinating Gardener:** **Cause.** (Dependence: Yes. Role: Same job duty/promise. The *reason* for the omission (fever/hallucination) affects *blameworthiness* or *excuse*, but not the *causal role* based on dependence and normative function. His role required action; the outcome depended on the action not occurring due to his failure to act *in that role*.

  **What You Give Up & Where It Breaks:**

  1.  **Scenario 8 (Ten Thousand):** This is the major sacrifice. The principle forces you towards "Not Cause" for *each individual* (lacking a specific role) and struggles to definitively assign cause to "the group" due to the lack of a clear collective normative-functional role. You might need a separate account for collective responsibility/omission or accept that causation by omission simply doesn't apply cleanly here under this principle. Your intuition that "the group's omission" *somehow* caused it points to a limitation.
  2.  **Scenario 2 (Sunbather):** You *must* firmly give up the idea that identical counterfactual dependence alone makes something a cause. The principle explicitly requires the *additional* normative-functional role element, which is absent here.
  3.  **Potential Weakness - Vagueness of "Role":** The biggest vulnerability is defining the scope of "normative-functional role." Is "human being" a role requiring rescue? (The principle says no, avoiding overextension). Is "potential donor who saw the ad" a role? (The principle leans no, causing trouble in #8). How formal must the role be? (Frank's institutional obligation is arguably less formal than the lifeguard's contract). This is where debates arise.

  **What Would Change My Mind?**

  I'd reconsider this principle if presented with compelling cases that:
  1.  **Lack Normative Role but Demand "Cause":** A case where counterfactual dependence is clear, *no* plausible normative-functional role exists, yet the omission *must* be seen as a cause (beyond just blame). (The Sunbather case is designed to test this, but I find "Not Cause" intuitive).
  2.  **Involve Clear Collective Cause without Collective Role:** A variant of #8 where the group demonstrably *causes* the outcome via omission, yet the principle's "role" requirement categorically fails to capture it, even intuitively.
  3.  **Show "Role" is Redundant:** Cases where dependence is sufficient *and* identifying the "role" adds nothing to the causal explanation or our understanding.

  **Why This Works Well for Teaching:**

  1.  **Handles Core Cases:** It cleanly resolves 1-7 and 9, which are likely the focus.
  2.  **Distinguishes Cause from Blame:** It explains why the hallucinating gardener *caused* the death (dependence + role) but might not be *blameworthy* (due to incapacity), separating metaphysics from ethics.
  3.  **Clarifies Counterfactuals:** It shows why dependence is *necessary* but not *sufficient* (#2, #5).
  4.  **Highlights Context:** It emphasizes that causation by omission isn't just physics; it depends on human/social/functional contexts ("supposed to").
  5.  **Creates Debate:** Scenario #8 becomes a perfect discussion starter about the limits of the principle and the nature of collective action/omission.

  **In Summary:** You can confidently stand in front of your class with: **"An omission causes an outcome only if (1) the outcome depended on it, *and* (2) the non-actor had a specific job, duty, promise, or function requiring them to do the omitted action."** This gets you most of your verdicts, cleanly handles the gardeners (both cause the death!), forces you to reject the sunbather (#2) as a cause and the individual donors (#8) as causes, and makes the nurse's delay cause the agony but not the death (#7). Scenario #8 remains the thorny challenge where the principle shows its limits and sparks the best philosophical discussion. Good luck with the seminar!
