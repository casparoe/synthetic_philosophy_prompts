prompt: |-
  I am teaching one ninety-minute session of a graduate seminar in formal epistemology next week, and I want a plan for the session rather than an exposition.

  The students have unconditional and conditional credences, Bayes' theorem, and the reflex of writing P_new(H) = P(H|E) whenever something happens to them. None of them has seen probability kinematics. The update I want them to be able to perform and to justify by the end is the one that replaces conditioning when the experience does not deliver any proposition with certainty: on a partition whose members the experience leaves rigid, P_new(H) is the sum over the cells of P(H|E_i) weighted by P_new(E_i).

  Three things I want from you. First, the dependency structure: the order in which the pieces have to arrive, and what breaks if two of them are swapped — in particular whether rigidity should be introduced as a constraint the agent imposes on her own update, as a property of causal or explanatory independence between the experience and the partition, or as whatever is left over once you have said what the experience does. Second, the carrying example. I had intended the standard case of examining a coloured object under unreliable light; I want your judgement on whether that is the right case to build the whole session around, and on what a case must contain and must not contain here. My own crude list is that it must make rigidity on the chosen partition genuinely plausible, that it must not contain a hard proposition the student could condition on instead and thereby recover the reflex I am trying to break, and that it must be iterable, so that the later part of the session can show that applying the same soft input twice is not the same as applying it once. Third, the misconception map: which wrong things they will think or construct, and the point in the sequence at which each should be headed off.

  There is a further wrinkle I cannot place, and I would like you either to place it or to tell me to drop it. Call a soft update foreseen when the agent knows in advance both the partition and the marginal the incoming experience will produce, and can choose whether to undergo it. In such a case I have a small example in which the agent does strictly better in expectation by declining the free experience: the very experience that is supposed to leave the partition rigid also gives her reason to think the partition was the wrong one to hold fixed, so the condition licensing the update is itself among the things the update destabilises. Should I teach this as a pathology of the framework, as evidence that rigidity has to be relativised to the experience rather than to the partition, as a reason to distinguish the update rule from the account of evidence that feeds it, or not at all in a first session? And if it belongs, where: before the students can compute anything, or only after they can?

  Finally: what should I openly refuse to explain in ninety minutes, and what single task at the end would tell me they had mastered the rule rather than memorised the summation?
reasoning: |-
  Okay, let me tackle this step by step. The user is preparing a graduate seminar on formal epistemology, specifically focusing on probability kinematics as an alternative to Bayesian conditioning when evidence doesn't deliver propositions with certainty. 

  First, I need to understand the core challenge: students are stuck in the "P_new(H) = P(H|E)" reflex and need to learn Jeffrey updating. The session must achieve three things: (1) establish the correct dependency structure for introducing concepts, (2) select an optimal carrying example, and (3) anticipate and counter misconceptions.

  For dependency structure, I'm considering a strict sequence: start with the limitation of conditioning (to break the reflex), then introduce rigidity as a constraint the agent imposes, derive the formula from that constraint, and finally show applications. Swapping rigidity and formula derivation would make rigidity seem arbitrary - it must be presented as the foundational choice justifying the math.

  The colored object under unreliable light example seems perfect: rigidity over color partition is plausible (light doesn't change actual color), no hard proposition exists (the evidence is perceptual uncertainty), and it's iterable (multiple viewings produce different outcomes than one extended viewing). It hits all the user's requirements.

  Major misconceptions to preempt include:
  - "This is just weighted conditioning" (counter by showing weights are new marginals)
  - "Rigidity means causal independence" (clarify it's about belief preservation)
  - "Use when evidence is vague" (emphasize it's when you quantify uncertainty)

  The foreseen update wrinkle is fascinating but dangerous for beginners. That case where rejecting free evidence is better could undermine the framework's coherence. Best to flag it briefly as advanced material rather than derail the session.

  For assessment, I'd avoid symbolic exercises. Instead, give two iteration scenarios: one where repeated soft evidence compounds reasonably, another where it would create contradictions if misapplied. The key is whether students recognize rigidity must be reassessed after updates.

  Time management is critical. Must explicitly sacrifice: generalizations to continuous cases, deep dives into justification debates, and comparative analysis with other non-conditioning updates. The tight focus stays on understanding and applying Jeffrey's rule.

  The closing task should test conceptual mastery: present a medical test case with unreliable results and changing prevalence rates, asking students to compute updated disease probabilities after sequential soft evidence. Success means they independently recognize when rigidity holds and correctly apply the weighted formula without prompting.
answer: |-
  Here’s a structured 90-minute lesson plan focused on Jeffrey updating, designed to break the conditioning reflex while addressing your core requirements. Prioritize conceptual sequencing over formalism—**rigidity must be introduced as the agent’s operational constraint** to avoid metaphysical tangles.

  ---

  ### **Dependency Structure & Sequence**  
  *(45 mins total; order is non-negotiable)*  
  1. **Break conditioning’s monopoly** (10 mins):  
     - Present a case where evidence **doesn’t confer certainty** (e.g., glimpsing a fabric under dim, shifting light).  
     - Trap: Students try to force \(P_{\text{new}}(H) = P(H|E)\) but *cannot identify E*. Highlight the **reflex’s failure**.  

  2. **Introduce rigidity as a tool** (15 mins):  
     - **Not causal independence, not evidence residue—it’s the agent’s choice.**  
     - "When you *decide* an experience doesn’t change your beliefs *about how H relates to certain propositions*, you impose rigidity on a partition \(\{E_i\}\)."  
     - *Example*: "I trust that the light doesn’t teach me anything new about *how colors predict fabric types*."  

  3. **Derive the rule from constraint** (15 mins):  
     - Demand: "Given rigidity on \(\{E_i\}\), how *must* you update H?"  
     - Derive \(P_{\text{new}}(H) = \sum_i P(H|E_i) P_{\text{new}}(E_i)\) via:  
       - \(P_{\text{new}}(H) = \sum_i P_{\text{new}}(H|E_i) P_{\text{new}}(E_i)\) (law of total prob)  
       - Rigidity \(\rightarrow P_{\text{new}}(H|E_i) = P(H|E_i)\)  
     - **Swap danger**: If formula precedes rigidity, it seems arbitrary; if rigidity is "discovered," it becomes mystical.  

  ---

  ### **Carrying Example: The Colored Object Under Unreliable Light**  
  **Yes, this is optimal**—it satisfies all your criteria:  
  - **Rigidity plausible**: Light quality affects color *appearance*, but rational agent may hold fixed "if object *is* blue, then \(P(H|\text{blue})\) is unchanged."  
  - **No covert conditioning**: The evidence ("looks teal under murky light") resists reduction to a hard proposition.  
  - **Iterable**: View object twice under varying light; \(P_{\text{new}}(\text{blue})\) differs from conditioning.  
  - **Critical extension**: After first update, show that reapplying the *same* soft evidence (same light conditions) gives different output—proving \(P_{\text{new-new}} \neq P_{\text{new}}\).  

  **Enhance with**:  
     - Pre-session: Assign priors (e.g., \(P(\text{blue}) = 0.3\), \(P(\text{green}) = 0.7\)).  
     - Evidence: "After viewing, your belief it’s blue is now 0.6."  
     - Compute \(P_{\text{new}}(\text{synthetic})\) twice: first update, then "view again under identical light."  

  ---

  ### **Misconception Map & Preemption**  
  | Misconception | When it arises | Preemption strategy |  
  |---------------|----------------|---------------------|  
  | "Rigidity = causal independence" | Intro of rigidity | **Explicitly reject**: "It’s not about the world—it’s your commitment for this update." |  
  | "Jeffrey = weighted conditioning" | Formula derivation | Stress: \(P_{\text{new}}(E_i)\) **isn’t** \(P(E_i|\text{blurry experience})\)—it’s a direct input. |  
  | "Use only when evidence is vague" | Post-derivation | Contrast with *ambiguous evidence*: Jeffrey requires quantified \(P_{\text{new}}(E_i)\). |  
  | "Iteration = more confidence" | Iteration example | Show numbers: Second identical update *lowers* certainty if priors shift unfavorably. |  

  ---

  ### **The "Foreseen Update" Wrinkle: Skip or Shelf**  
  **Do not teach in first session**. It’s a profound critique (van Fraassen’s "voluntarism" debate), but:  
  - It destabilizes the framework *before* students internalize it.  
  - Belongs in a follow-up on "rational constraints on self-prediction."  
  - **If mentioned**: Flag post-session as "advanced tension: when rigidity is *fragile* to foresight."  

  ---

  ### **Time Denials & Mastery Task**  
  **Openly refuse to cover**:  
  - Generalizations to non-partition updates (e.g., Richard Jeffrey’s later work).  
  - Justifications beyond operational necessity ("Why accept rigidity?").  
  - Comparisons to other rules (e.g., Dempster-Shafer).  

  **Mastery task (final 15 mins)**:  
  > "A medical sensor detects a disease symptom. Your prior \(P(\text{disease}) = 0.2\).  
  > - Partition: \(\{ \text{symptom}, \neg \text{symptom} \}\)  
  > - Rigidity imposed: Beliefs about *disease implications* are unchanged.  
  > - After a noisy reading, your new belief in symptom is 0.7.  
  > **Calculate** \(P_{\text{new}}(\text{disease})\)**."  
  >  
  > *Then*: "The same sensor reads again identically. New symptom belief is *still* 0.7. Compute \(P_{\text{new-new}}(\text{disease})\)."  

  **Success if**:  
  - They use \(P_{\text{new}}(H) = P(H|\text{symp}) \cdot 0.7 + P(H|\neg\text{symp}) \cdot 0.3\) without conditioning attempts.  
  - **Not mastery**: Plugging numbers mindlessly. **Mastery**: Recognizing rigidity must be *reaffirmed* for iteration (else \(P(H|\text{symp})\) changes).  

  ---

  **Timeline**:  
  - 0–10 min: Conditioning failure case  
  - 10–25 min: Rigidity as agent’s tool  
  - 25–40 min: Derivation + fabric example  
  - 40–55 min: Iteration deep dive  
  - 55–70 min: Misconception Q&A + medical task  
  - 70–85 min: Mastery task + discussion  
  - 85–90 min: Wrap-up ("When would conditioning *fail* you?")  

  This sequence forces rigidity as the engine, uses the light example rigorously, and assesses via iterative application. The medical task ensures they see beyond the classroom case.
