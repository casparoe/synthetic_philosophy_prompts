prompt: |-
  So I got talked onto the state's clemency advisory panel — I write novels, mostly about people who wreck their own lives on purpose, somebody decided a "narrative person" would be useful, and now I'm the one who has to circulate the memo before Thursday. Help?

  Here's the case. Petitioner D.W.: armed robbery at nineteen, twenty-eight years in, no disciplinary write-ups in the last eleven. His personal statement is unlike anything else we've recieved. It's written almost entirely in what I'd call the alibi voice — "I never stood a chance," "by the time I knew what was happening it was already happening." No excuses offered, no redemption claimed either; just a chain of events in which he appears only as the thing it happened to. Two of us read it as the most honest document in the file. Two read it as a refusal of responsibility, and one of them has drafted a proposed new rule: every petitioner must add a "counterfactual paragraph," saying what they'd have done differently in that same situation, on the theory that being unable to picture yourself doing otherwise just *is* failing to own what you did.

  I'm uneasy and I want the memo to say why, in a form the panel can actually vote on. My worry has two halves. First, I make a living manufacturing the alibi voice: give me a character and three hundred pages and I can make a reader certain she had no choice, and that proves nothing whatsoever about whether she did. Fluency in fatalism is a craft skill, and it's the wrong thing to be grading. Second, the counterfactual paragraph is a genre requirement — it rewards petitioners who've been coached in the redemptive arc (the prison writing program, a good lawyer, a college class) and punishes the inarticulate, which tracks race and schooling pretty exactly. But I also can't shake the mirror image: the "changed man" statement, where the petitioner says the person who did it wasn't really him, feels like the opposite dodge — denying the situation instead of denying the freedom. One member, who read a bit of Sartre in college, keeps using the phrase "bad faith" for both, which I think is right but not yet useful.

  What I need: a memo recommending (1) a decision on D.W. — grant, defer, or grant with conditions, with a timeline — and (2) a standing rule for how we read these statements, with criteria a reviewer could apply in twenty minutes. Treat the strongest version of the counterfactual requirement seriously rather than knocking it down easy: there's a real thought that remorse without "I could have done otherwise" isn't remorse at all, and victims' families are owed that acknowledgement.

  Last thing, since I'm the one who'll be defending it out loud: keep a clear line between what's settled and what people who actually work on this disagree about. If the strong line — that we're radically free and that appeals to upbringing or addiction are always a kind of self-deception — is one contested position among several and not the consensus, say that plainly in the memo instead of building the recommendation on it like bedrock. I'd rather hand in something that survives being challenged than something that sounds decisive. And no citations or footnotes, I can't look anything up and I'd strip them out anyway. thx
reasoning: |-
  Okay, the user is on a clemency advisory panel and needs help drafting a memo about a petitioner named D.W. who's been in prison for 28 years for armed robbery committed at age 19. The main issue revolves around D.W.'s personal statement, written in what the user calls the "alibi voice" - a narrative where he portrays himself as having no agency in the events. 

  The panel is divided: two members see it as honest, two see it as avoiding responsibility. One member has proposed requiring all petitioners to include a "counterfactual paragraph" describing what they would have done differently, arguing that inability to imagine alternatives shows lack of remorse. The user is uneasy about this for two reasons: as a novelist, they know the "alibi voice" is a craft skill that proves nothing about actual agency, and the requirement would disadvantage less articulate petitioners who haven't been coached in redemption narratives.

  The user needs a memo that: 1) makes a recommendation on D.W.'s case (grant, defer, or grant with conditions), and 2) establishes a standing rule for evaluating personal statements. They want the memo to treat the counterfactual requirement seriously while addressing concerns about fairness and philosophical assumptions. Importantly, they need clear distinctions between settled points and contested positions, with no academic citations.

  Hmm... this is fascinating because it blends legal judgment, narrative analysis, and philosophy of free will. The user's novelist perspective is crucial here - they recognize narrative constructs versus substantive accountability. The racial/educational bias concern about the counterfactual requirement feels particularly important to address carefully.

  I should structure the memo to first address D.W.'s specific case based on concrete factors (disciplinary record, time served, etc.), then separately propose evaluation principles for statements. The philosophical debate about free will needs framing as contested rather than settled. For the standing rule, I'll suggest focusing on behavioral evidence of change rather than narrative performance, while acknowledging victims' need for accountability.

  The tone should be practical and consensus-building - the user will have to defend this orally. I'll avoid absolutist language about free will, instead emphasizing what the panel can reasonably assess. For D.W., conditional release seems appropriate given his clean record but unresolved narrative concerns. The counterfactual requirement should be rejected but replaced with clearer evaluation criteria that don't penalize lack of coaching.
answer: |-
  Here’s a draft memo designed to be actionable, defensible, and grounded in practical fairness while addressing your concerns. It avoids philosophical absolutism, focuses on evaluable criteria, and separates settled points from contested debates.

  ---

  **MEMORANDUM**  
  **TO:** State Clemency Advisory Panel  
  **FROM:** [Your Name], Panel Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation for Petitioner D.W. & Framework for Evaluating Personal Statements  

  ### I. RECOMMENDATION FOR PETITIONER D.W. (Case #XXXX)
  *   **Recommendation:** Grant Clemency, **Conditional on 12 Months Transitional Housing/Reentry Program.**  
  *   **Timeline:** Release processing to begin within 90 days of approval, contingent on verified placement in approved program.  
  *   **Rationale:**  
      *   **Sustained Positive Conduct:** 11 consecutive years without disciplinary incident demonstrates significant behavioral change and institutional adjustment – a concrete, measurable indicator of rehabilitation potential.  
      *   **Time Served:** 28 years for a crime committed at 19 exceeds typical sentences for similar offenses and represents substantial punitive consequence.  
      *   **Risk Assessment:** Absence of recent violence or disciplinary issues suggests low likelihood of recidivism compared to cohort.  
      *   **Personal Statement:** While the narrative voice ("alibi voice") raises questions about subjective accountability (discussed in Section II), it does not negate the objective evidence of sustained positive behavior. The statement’s perceived honesty by half the panel suggests it is not a calculated evasion, but its limitations prevent it from being a strong *positive* factor. Conditions mitigate potential concerns.  

  ### II. PROPOSED STANDING RULE FOR EVALUATING PERSONAL STATEMENTS
  *   **Recommendation:** **Reject** the mandatory "counterfactual paragraph" requirement.  
  *   **Adopt the following framework for evaluating personal statements:**  
      *   **A. Core Principle:** Personal statements are **one factor among many**, not determinative. Primary weight belongs to **objective evidence** (disciplinary record, program completion, time served, risk assessments, victim impact statements).  
      *   **B. Evaluation Criteria (for Reviewer in ~20 mins):**  
          1.  **Consistency:** Does the statement broadly align with the factual record of the crime and incarceration? (Flag major contradictions).  
          2.  **Acknowledgment:** Does the petitioner acknowledge *their specific actions* caused harm? (Avoid grading *how* they say it; focus on whether the core fact of their agency in the act is present).  
          3.  **Insight (Optional):** Does the statement offer *any* indication of understanding consequences, victim impact, or personal change? (Note its presence/absence/nature, but do not penalize lack of eloquence or specific narrative structure).  
          4.  **Evasion/Red Flags:** Does the statement actively *deny* committing the act, blame victims entirely, or display overt hostility/defiance? (This warrants significant negative weight).  
      *   **C. Rejection of Mandatory Counterfactual Paragraph Rationale:**  
          *   **Craft vs. Substance:** Proficiency in constructing hypotheticals ("I would have walked away") is a *rhetorical skill*. It can be learned through coaching (prison programs, legal aid) or reflect narrative fluency. Lack of this skill does not equate to lack of remorse or understanding. Grading this creates inequity favoring the coached/educated.  
          *   **The "Alibi Voice" Concern:** A narrative framed by fatalism ("I had no choice") is ambiguous. It *may* indicate avoidance of responsibility, *or* it may reflect a deeply internalized perspective common in traumatic experiences or specific backgrounds. **Objective behavior (Criterion A above) is a more reliable indicator of change than parsing this narrative style.**  
          *   **The "Changed Man" Concern:** Conversely, statements disavowing the past self ("That wasn't the real me") also present ambiguity. While potentially indicating change, they can also represent a different form of distancing from responsibility. **Again, objective evidence of change is paramount.**  
      *   **D. Addressing Underlying Valid Concerns:**  
          *   **Victim Acknowledgment:** The victims' need for acknowledgment of the perpetrator's *agency* and responsibility is legitimate and profound. **Criterion B.2 (Acknowledgment of Specific Actions)** directly addresses this by requiring petitioners to confront their role in the harm caused. This is more concrete and less easily faked than constructing hypothetical alternatives.  
          *   **Remorse & Understanding:** These are complex internal states. **Criterion B.3 (Insight)** allows reviewers to note *if* and *how* a petitioner demonstrates understanding or regret, but does not mandate a specific performative script (like the counterfactual). Lack of profound insight expressed in the statement is not disqualifying if positive objective evidence (behavior, time served) is strong.

  ### III. KEY DISTINCTIONS: SETTLED vs. CONTESTED
  *   **Settled (Consensus Basis for Recommendation):**  
      1.  Objective evidence (conduct, time served, programs) is the primary and most reliable basis for clemency decisions.  
      2.  Personal statements should be evaluated for basic acknowledgment of agency in the crime and absence of overt denial/blaming of victims.  
      3.  Clemency decisions must strive for fairness and avoid creating systematic disadvantages based on education, access to coaching, or narrative style.  
      4.  Victims' families are owed recognition of the harm caused by the petitioner's actions.  
  *   **Contested (Areas of Legitimate Disagreement - Not Basis for Rule):**  
      1.  **The Nature of Free Will & Responsibility:** Whether individuals in situations like D.W.'s past *truly* had alternative choices ("could have done otherwise"), or the degree to which factors like upbringing or addiction constrain agency, is a profound philosophical and psychological debate *without a professional consensus*. Policies should not be built *solely* on one contested view (e.g., radical freedom vs. determinism).  
      2.  **Narrative Interpretation:** Whether the "alibi voice" or "changed man" trope inherently demonstrates "bad faith" or a genuine perspective is inherently subjective. **Our rule focuses on concrete criteria (acknowledgment, consistency) and relies on objective behavior precisely because these interpretations are contestable.**  
      3.  **The Perfect Expression of Remorse:** There is no universally agreed-upon, infallible linguistic formula for proving genuine remorse or understanding. Requiring one (like the counterfactual) risks privileging form over substance.

  ### IV. SUMMARY OF ACTIONS REQUESTED
  1.  **Vote to GRANT clemency to D.W. with the condition of 12 months in a verified transitional housing/reentry program.**  
  2.  **Vote to REJECT the proposed mandatory "counterfactual paragraph" rule.**  
  3.  **Vote to ADOPT the proposed framework (Section II.B) for evaluating personal statements as part of a holistic review, emphasizing objective evidence as primary.**

  ---

  **Why this works for your defense:**

  1.  **Focuses on Action & Evidence:** Grounds the D.W. decision in indisputable facts (clean record, time served). The condition addresses the "alibi voice" concern practically. The evaluation framework provides clear, quick criteria reviewers *can* apply.
  2.  **Treats Counterfactual Seriously:** It doesn't dismiss the *concern* behind it (agency, remorse, victim need). It redirects that concern to a more concrete and equitable requirement: acknowledging one's *actual* actions caused harm (Criterion B.2).
  3.  **Addresses Bias Explicitly:** Clearly states the counterfactual requirement disadvantages the less articulate/coached, linking it to race/schooling implicitly through "systematic disadvantages" and "fairness."
  4.  **Separates Philosophy from Policy:** Explicitly cordons off the free will debate ("Contested") while building the rule on practical, settled ground (objective evidence, basic acknowledgment). You acknowledge Sartrean "bad faith" exists as a perspective *without* letting it dictate policy.
  5.  **Balances Victim Need:** Directly addresses the legitimate need for acknowledgment of agency/harm through Criterion B.2, which is harder to fake or avoid than a hypothetical.
  6.  **Avoids Overreach:** Doesn't claim the "alibi voice" is good or bad; says it's *ambiguous* and therefore less reliable than behavior. Doesn't require perfect insight, just notes its presence/absence.
  7.  **Defensible & Clear:** The structure (Settled/Contested) gives you clear talking points when challenged. "We base decisions on objective evidence because interpretations of complex narratives are contested" is a strong, pragmatic line.

  This memo provides a clear path forward on D.W., rejects the problematic rule while offering a better alternative, and pre-empts philosophical landmines by clearly stating where consensus ends. Good luck on Thursday!
