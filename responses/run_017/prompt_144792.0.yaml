  First, the sentient wood. If the wood complains before shaping, that suggests it has proto-consciousness. In constitution terms, is the lump already a subject? That’s wild—it blurs the line between matter and person from the start. For the modal argument, Pinocchio survives changes the puppet-body might not (like nose growth or donkey parts), which reverses the standard "lump survives squashing, statue doesn’t" example. 

