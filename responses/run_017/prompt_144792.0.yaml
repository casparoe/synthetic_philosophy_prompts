  Where might this struggle? The story is a fable, not ontology. Pinocchio’s sentience pre-carving is magical, so applying real metaphysics might feel forced. Also, Disney’s transformation is ambiguous—does the puppet *become* flesh or is it replaced? But the user’s status view can handle both: the entity gains a new status regardless. 

  Bigger picture: Pinocchio’s changes are gradual (nose, ears) and culminate in a moral leap, unlike the statue/lump’s abrupt modal differences. This shows constitution might need to account for teleological development. And the reverse modal argument (surviving changes the matter couldn’t) undercuts the standard objection—Pinocchio is *more* resilient than his matter. 

