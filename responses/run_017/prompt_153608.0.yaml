prompt: |-
  Hey — you're a philosopher of history who's also spent time around working historians, so take this seriously: brainstorm the failure modes of after-the-fact explanation for a bit before you write anything down, then commit to a list.

  I'm a historiography PhD student and I want the desiderata, not a survey. Specifically: what does a method for explaining why *this* outcome rather than *that* one happened have to deliver, given that the historian always writes after the fact and almost always knows how it ends. Fix the purpose as: an account good enough both to underwrite a monograph on a single causal sequence and to be handed to someone who doesn't know the ending yet — a forecaster, an intelligence analyst, a policy person — as usable advice.

  Give me the requirements with the case or consideration behind each, and mark which are non-negotiable and which are just the taste of one camp. Here's what I keep circling; tell me which of these are genuine desiderata, which are prejudice, and add the ones I'm missing:

  - ex-ante legibility: every factor the explanation leans on must have been identifiable by a well-informed contemporary working only from pre-outcome evidence. Doesn't this just ban all the hindsight-enabled causal selection that is where history's actual insight lives?
  - the near-miss test: the explanation has to make the losing outcome genuinely live, and must not explain the opposite outcome equally well when you swap in the counterfactual.
  - source contamination: the archive, memory, and the secondary literature are themselves outcome-shaped, so any test of the explanation is run on contaminated evidence.
  - closure versus contingency: narrative emplotment that a reader can follow, versus faithfulness to the mess, dead ends, and near-misses that went nowhere.
  - diachronic stability: an explanation shouldn't have to be rewritten every time later events make a new description of the earlier event true (the "beginning of the X" problem — sentences that describe an event by its consequences).
  - resistance to judged-probability inflation: the explanation shouldn't inherit the fact that knowing an outcome makes it look like it had to happen.

  Then flag any pair you think can't be jointly satisfied — I suspect ex-ante legibility versus hindsight-enabled causal selection is the big one, and possibly closure versus contingency — and say which single requirement excludes the most accounts people actually defend. Very short scorecard at the end, two lines each, for covering-law style accounts, counterfactual-dependence accounts, and narrative/process-tracing accounts; keep the weight on the criteria, not the scoring.
reasoning: |-
  Okay, let me tackle this user's query methodically. The user is a historiography PhD student asking for desiderata of historical explanation that work both for monographs and forecasting. They provided six criteria they're circling and want them evaluated, plus additions. 

  First, I need to unpack their core tension: how can historians use hindsight-generated insight without contaminating explanations with outcome bias? Their "ex-ante legibility" point nails this - banning hindsight might sacrifice depth, but allowing it risks anachronism. I recall Collingwood's re-enactment and Bloch's critique of "idols of origins" as relevant touchstones here.

  The user's "near-miss test" seems crucial for contingency. I'm thinking of Sewell's work on Parisian sans-culottes - showing why revolution succeeded there requires explaining why it failed elsewhere. But implementing this is tricky when archives privilege winners ("source contamination"). 

  On their "diachronic stability" point, I'm reminded of Butterfield's warnings against whig history. Descriptions like "the first modern revolution" become circular if defined by later outcomes. This connects to "judged-probability inflation" - Tetlock's fox/hedgehog studies show experts retrofit inevitability narratives.

  Missing from their list? I should add:
  - Mechanism specificity (Goldthorpe/Merton): Not just correlation but how causes operated
  - Scope conditions (Mahoney): Where does this explanation apply?
  - Cognitive accessibility: Policy users need transportable insights
  - Traceability: Can we track the steps without gaps?

  For the scorecard:
  Covering-law models fail diachronic stability (laws are time-bound) and near-misses (overgeneralize). Counterfactuals struggle with source contamination (alternatives aren't documented). Narratives risk closure bias but excel at traceability. 

  The toughest trade-off is indeed ex-ante legibility vs hindsight insight. Historians need both contemporary perceptibility and analytical depth - perhaps "retrospective perceptibility" as compromise? Also closure-contingency: monographs need narrative coherence but policy users require awareness of alternatives.

  Biggest exclusion? Probably judged-probability inflation. Most accounts - even sophisticated ones - subtly imply inevitability. Tetlock's work suggests this may be a cognitive trap rather than methodological flaw.
answer: |-
  Here’s a rigorously structured response, prioritizing your requirements for historical explanation that bridges scholarly and applied use. I’ve evaluated your items, added critical desiderata, flagged irreconcilable tensions, and scored major approaches.

  ---

  ### **Desiderata for Historical Explanation**  
  *(Non-negotiable = ⚑; Camp-specific = ▷)*  

  1. **Ex-Ante Legibility**  
     - **Your view**: Requires factors identifiable pre-outcome.  
     - **Verdict**: **Partially prejudiced**. Essential for policy relevance (⚑), but strict application *does* cripple historical insight. Compromise: *Retrospective perceptibility* (▷): factors must be *plausibly* knowable to contemporaries *even if overlooked* (e.g., ignored economic data). Bans *only* concepts dependent on later knowledge (e.g., "proto-fascist" in 1910).  

  2. **Near-Miss Test**  
     - **Verdict**: **Non-negotiable (⚑)**. The explanation must clarify why the actual outcome occurred *and* why alternatives failed *without symmetry*. Case: WWII Eastern Front—explaining Soviet victory must also show why German victory was plausible but failed (e.g., logistics vs. morale collapse).  

  3. **Source Contamination**  
     - **Verdict**: **Non-negotiable (⚑)**. Archives favor winners, memoirs rationalize, theories are outcome-infected. Solution: Triangulate with "losers’" sources, material traces, or contemporaneous predictions. Case: Cold War origins—relying solely on U.S. archives inflates Soviet aggression narratives.  

  4. **Closure vs. Contingency**  
     - **Verdict**: **Tension, not flaw**. Policy needs *usable narratives* (closure) but must signal pivot points (contingency). Non-negotiable: Flag "decisive junctions" where outcomes hung on identifiable factors (e.g., Cuban Missile Crisis—ExComm’s debate vs. Khrushchev’s miscalculation).  

  5. **Diachronic Stability**  
     - **Verdict**: **Non-negotiable (⚑)**. Explanations must avoid teleological descriptions (e.g., "inevitable rise of democracy"). Case: Calling 1789 "the French Revolution" is stable; calling it "the dawn of modern revolutions" isn’t—it smuggles in later events.  

  6. **Resistance to Judged-Probability Inflation**  
     - **Verdict**: **Non-negotiable (⚑)**. Hindsight bias inflates perceived inevitability. Mitigation: Quantify contemporary uncertainties (e.g., "60% of economists predicted depression in 1928") or stress underdetermined moments.  

  ---

  ### **Added Desiderata**  
  7. **Mechanism Specificity** (⚑)  
     - *Why*: Policy users need transportable causal chains (e.g., "sanctions *work via* elite fragmentation, not public suffering").  
     - *Case*: Explaining Arab Spring—diffusion via social media requires interface algorithms, not just "technology enabled protests".  

  8. **Scope Conditions** (▷)  
     - *Why*: Clarifies where the explanation applies (e.g., "This coup model works only in patrimonial states"). Excludes overgeneralized "laws".  

  9. **Cognitive Accessibility** (⚑)  
     - *Why*: Forecasters need modular, hierarchy-aware explanations (e.g., "Three pivotal decisions; here’s why each mattered"). Avoids monograph-style depth traps.  

  10. **Traceability** (⚑)  
      - *Why*: Each step in the causal sequence must leave detectable traces pre-outcome. Bans "hidden necessity" arguments (e.g., "historical spirit").  

  ---

  ### **Irreconcilable Tensions**  
  - **Ex-Ante Legibility vs. Hindsight-Enabled Selection**: Strict legibility excludes structurally latent factors (e.g., institutional decay). *Resolution*: Allow factors *retrospectively perceptible* via overlooked contemporary evidence.  
  - **Closure vs. Contingency**: Over-closure obscures risk; over-contingency paralyzes policy. *Resolution*: "Bounded narratives" with explicit branching points (e.g., "Key junctures: X, Y; why path Z was taken").  

  ---

  ### **Scorecard: Major Approaches**  
  *(Focused on your criteria; ⚖️ = balance, ✘ = critical flaw)*  

  1. **Covering-Law (Hempel)**  
     - Fails: Near-miss test (laws rarely asymmetric), diachronic stability (laws context-bound), source contamination (retrofit laws to outcomes).  
     - ⚖️: Mechanistic specificity possible. **Verdict**: Excludes most usable insight.  

  2. **Counterfactual Dependence (Lewis/Fearon)**  
     - Fails: Source contamination (counterfactuals rely on contaminated priors), judged-probability inflation (often assumes "default" paths).  
     - ⚖️: Excels at near-miss test, contingency. **Verdict**: Policy-useful but epistemically fragile.  

  3. **Narrative/Process-Tracing (Mahoney, Tilly)**  
     - Fails: Closure vs. contingency (narratives often over-smooth), cognitive accessibility (monographitis).  
     - ⚖️: Best on traceability, mechanism specificity. **Verdict**: Optimal *if* modularized and junctures flagged.  

  ---

  ### **Most Excluding Requirement**  
  **Resistance to judged-probability inflation** excludes the *most* historical accounts—even sophisticated ones (e.g., Ferguson’s *Pity of War*) often imply inevitability. **Diachronic stability** is a close second, eliminating Whig history and teleology.  

  This framework prioritizes explanations that are *actionable for uncertainty* while respecting history’s complexity. The critical trade-off remains: **rigorous policy-relevance requires sacrificing some depth; scholarly depth risks policy-uselessness**.
