prompt: |-
  I'm helping run a small reading group on vagueness this term, and before we wade into epistemicism vs supervaluationism I want the spec nailed down: what does a theory of vagueness actually have to get right? Not "here's how the two views score" — we'll do that ourselves in a couple of weeks — but the list of requirements, each with the case or intuition that motivates it, and your view on which of them are genuine constraints and which are just things one camp already wanted to hear. No reading list, we've got a syllabus. Some candidates I keep coming back to: the sorites/tolerance intuition; the way higher-order vagueness seems to come back no matter how many "definitely"s you stack on top; the Dummett-flavoured worry that the supervaluationist ends up committed to there being a cut-off somewhere while no particular number is where it is (correct me if I've garbled that); the feeling that the epistemicist's boundary is brute in a way that's meant to be objectionable; and the one I care most about, separating vagueness from plain ignorance.

  That last one comes from two cases I made up and can't stop poking at. Case one: a game show announces that the jackpot goes to the first person in the queue whose exact birth weight in grams was a multiple of seven. The hospital records were destroyed in a fire, no other copy exists anywhere, and nobody will ever find out — but there either was such a person or there wasn't. My intuition is that "gets the jackpot" is as sharp as anything gets and merely unknown, not vague in the way "tall" is. So: does your theory predict that? And if it says the difference is just that in this case someone could in principle have found out, I want to know why in-principle knowability gets to do that much work. Case two: a community gets tired of arguing and coins a word, "bhen", meaning borderline tall — you're a bhen if you're neither clearly tall nor clearly not. Now run the sorites on "bhen" again. Does it have its own penumbra, and where does that one come from? Does it collapse back into plain tallness? Or is the question somehow ill-formed? I want to know which of those answers each theory is even allowed to give and what each costs it.

  Then the structural part, which is what I most want: flag any two requirements on your list that look like they can't both be satisfied — my hunch is that "vindicate tolerance", "keep classical logic all the way up", and "no brute unknowable facts" can't all hold, but say which horn each of the two views actually takes, and tell me which single requirement does the most work in knocking candidates out. One more thing that's specific to us: our ulterior motive is that whatever account we land on should eventually say something about decision procedures — think of a system that has to make calls on vague predicates (eligibility rules, moderation thresholds) and justify the call afterwards to someone who was denied. So please add whatever requirements follow from that use rather than from the semantics seminar, and mark them, along with everything else, as non-negotiable or as a preference. A short table comparing the two views at the very end is fine, but the criteria and their cases are the part I actually want.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're running a reading group on vagueness and want to clarify what a theory must get right before diving into epistemicism vs supervaluationism. The main request is for a list of requirements with motivations, plus analysis of conflicts and practical implications for decision procedures.

  First, I need to identify the core requirements for any theory of vagueness. The user mentioned several candidates: sorites tolerance, higher-order vagueness, Dummett's worry about cut-offs, the brute boundary objection, and separating vagueness from ignorance. They also provided two thought experiments—the game show jackpot and the "bhen" community—which are crucial for testing the ignorance-vs-vagueness distinction.

  The user's deeper needs seem to be: 
  1) Clarity on non-negotiable vs negotiable constraints. 
  2) Identifying irreconcilable conflicts between requirements (like tolerance + classical logic + no brute facts). 
  3) Practical applicability to decision systems that justify vague classifications. 

  I recall that the sorites paradox is fundamental—theories must explain why premises seem true yet lead to contradiction. Higher-order vagueness is tricky because borderline cases themselves seem vague. Dummett's critique targets supervaluationism's commitment to sharp cut-offs despite denying their existence. The brute boundary issue challenges epistemicism's mysterious sharp boundaries. 

  The ignorance-vagueness distinction is vital. The game show case highlights unknowability due to missing information, not vagueness. Theories must explain why "tall" isn't just unknown like the jackpot winner. The "bhen" case tests if higher-order vagueness regenerates or collapses. 

  For structural conflicts: tolerance + classical logic + no brute facts form an inconsistent triad. Epistemicism keeps classical logic and rejects tolerance, accepting brute facts. Supervaluationism preserves tolerance and no brute facts but weakens classical logic. 

  Practical requirements for decision systems include justification, stability, and transparency. Justification means explaining decisions without invoking unknowable facts. Stability ensures consistent application. Transparency requires clear criteria, even if vague. 

  I should organize requirements into core (sorites, higher-order vagueness, ignorance distinction) and practical (justification, stability). Note conflicts explicitly. Assess each theory's compliance and costs. Highlight that ignorance distinction is non-negotiable for separating vagueness from epistemic uncertainty.
answer: |-
  Here’s a structured breakdown of the core requirements for a theory of vagueness, motivated by cases/insights, with notes on negotiability and conflicts. I’ll then address your cases, flag irreconcilable tensions, and add decision-procedure constraints.

  ---

  ### **Core Requirements for a Theory of Vagueness**
  1. **The Sorites Tolerance Intuition**  
     - **Motivation**: "One grain can’t make the difference between a heap and a non-heap." Premises like this *feel* true, yet lead to contradiction.  
     - **Constraint**: Must explain why tolerance seems compelling while blocking the paradox.  
     - **Non-negotiable?** **YES** – Any theory failing this is inert against the core problem.

  2. **Higher-Order Vagueness (HOV)**  
     - **Motivation**: There’s no sharp boundary between "tall" and "borderline tall," nor between "borderline tall" and "definitely borderline tall." Stacking operators (e.g., `Definitelyⁿ`) doesn’t collapse vagueness.  
     - **Constraint**: Must accommodate blurred boundaries at all orders.  
     - **Non-negotiable?** **YES** – Rejecting HOV (e.g., positing sharp meta-boundaries) is widely seen as regressive.

  3. **No In-Principle Unknowable Sharp Cut-offs (Dummett’s Challenge)**  
     - **Motivation**: If there’s a sharp boundary (e.g., between tall/not-tall), we *couldn’t* know it even with perfect information. This clashes with intuition that vagueness isn’t mere ignorance.  
     - **Constraint**: Should not posit brute, inaccessible facts about boundaries.  
     - **Non-negotiable?** **DEBATABLE** – Epistemicists *reject* this; others treat it as essential.

  4. **Distinguishing Vagueness from Ignorance**  
     - **Your Game Show Case**:  
       - "Wins jackpot" has a sharp extension (fixed by birth weights mod 7) but is *unknowable*. Contrast "tall," which lacks sharp boundaries even in principle.  
       - **Requirement**: A theory must explain why vagueness isn’t just epistemic uncertainty.  
     - **Non-negotiable?** **YES** – Central to defining the phenomenon.

  5. **No Brute Boundaries**  
     - **Motivation**: Epistemicism’s sharp boundary between tall/not-tall seems arbitrary and unexplained ("Why 180cm, not 180.01cm?").  
     - **Constraint**: Boundaries should be grounded (e.g., in use, context, conceptual constraints).  
     - **Non-negotiable?** **PREFERENCE** – Epistemicists bite the bullet; others demand grounding.

  ---

  ### **Your Cases: Theory Predictions**
  - **Game Show Jackpot (Ignorance vs. Vagueness)**:  
    - **Epistemicism**: Treats this identically to "tall" – both have sharp boundaries unknowable due to human limitation. *Problem*: Fails your requirement (4).  
    - **Supervaluationism**: Distinguishes sharply! "Tall" lacks a classical extension (truth is super-truth); the jackpot has a classical extension (unknown). *Cost*: Violates Dummett’s requirement (3) by committing to a cut-off it can’t point to.  
    - **Why in-principle knowability matters**: Vagueness is *constitutively* resistant to precision; ignorance is contingent. Theories that blur this struggle with cases like "bhen."

  - **The "Bhen" Community (Higher-Order Vagueness Test)**:  
    - **Epistemicism**: "Bhen" has sharp boundaries → sorites reappears for "bhen." "Borderline-bhen" is equally sharp. No collapse.  
    - **Supervaluationism**: "Bhen" is vague, so it has its own penumbra. But iterations may collapse: if "definitely tall" and "definitely not tall" are precise, "bhen" boundaries might sharpen under higher-order "definitely." *Cost*: Threatens HOV.  
    - **Ill-formed?** Only if the theory denies HOV. Both theories must confront regeneration.

  ---

  ### **Irreconcilable Tensions**
  - **The Inconsistent Triad**:  
    ```plaintext
    (A) Tolerance holds (sorites premises are non-trivially true).  
    (B) Classical logic is preserved (bivalence, no truth-value gaps).  
    (C) No brute unknowable facts.  
    ```
    - **You can’t have all three**. Each major theory sacrifices one:  
      - *Epistemicism*: Keeps (B) and (C)? → **Rejects (A)** (tolerance is false; sorites premises are false).  
      - *Supervaluationism*: Keeps (A) and (C) → **Rejects (B)** (gaps exist; non-classical super-truth).  
    - **Key conflict**: (A) and (B) clash directly. (C) is often the casualty (epistemicism) or motivator (supervaluationism).

  - **Which requirement does the most damage?**  
    **Higher-Order Vagueness**. It forces all theories into complex maneuvers:  
    - Epistemicism: Posits infinitely many sharp boundaries (objectionably brute).  
    - Supervaluationism: Requires "open-texture" ad infinitum (risks incoherence).  

  ---

  ### **Decision-Procedure Requirements (Added)**
  1. **Justifiability to Denied Claimants**  
     - *Requirement*: A system must give reasons for decisions that aren’t arbitrary or mysterious (e.g., "You missed the cutoff by 0.01%" is poor justification if the cutoff is brute).  
     - *Non-negotiable for your use case*. Favors supervaluationism (appeals to "competent judges") over epistemicism ("You’re unknowably below the line").

  2. **Stability Under Scrutiny**  
     - *Requirement*: Decisions should be robust if re-evaluated with the same vague criteria (no randomness).  
     - *Non-negotiable*. Supervaluationism handles this via precisifications; epistemicism via fixed (but unknowable) rules.

  3. **Context-Sensitivity without Ad Hocness**  
     - *Requirement*: Thresholds can shift (e.g., "tall for a jockey" vs. "tall for a basketball player"), but not arbitrarily.  
     - *Preference*. Both theories accommodate this (context sets precisifications/boundaries).

  ---

  ### **Summary Table: Epistemicism vs. Supervaluationism**
  | Requirement                | Epistemicism                          | Supervaluationism                     |
  |----------------------------|---------------------------------------|---------------------------------------|
  | **Sorites Tolerance**      | Rejects: premises false              | Preserves: premises non-trivially true |
  | **Higher-Order Vagueness** | Sharp boundaries at all orders        | Blurry, but higher-order collapse risk|
  | **No Brute Cut-offs**      | Violates: boundaries fundamental      | Preserves (but commits to ineffable cut-off) |
  | **Vagueness ≠ Ignorance**  | Fails: both are epistemic             | Distinguishes: vagueness is semantic  |
  | **Justifiability**         | Poor: "unknowable fact"               | Better: "no precisification makes you tall" |
  | **Classical Logic**        | Preserves fully                       | Restricts (gaps, non-bivalence)       |

  ---

  ### **The Bottom Line**
  - **Knockout constraint**: **Distinguishing vagueness from ignorance** (your game show case). Epistemicism fails this; supervaluationism honors it at the cost of classical logic.  
  - **Biggest theoretical cost**: **Higher-order vagueness** – both theories strain to accommodate it.  
  - **For decision systems**: **Justifiability** is the non-negotiable add-on. Supervaluationism’s appeal to "no precisification satisfies P" is more defensible than epistemicism’s appeal to brute facts.  

  Both views pay a price: epistemicism with mysterian boundaries, supervaluationism with logical revisionism. Your "bhen" case tests whether either can handle infinite regress – a hurdle for both. Start your debate there.
