prompt: |-
  I work on an alignment team that is building an oversight pipeline for a model that produces long technical documents: literature reviews, incident postmortems, internal policy summaries. The failure mode we actually worry about is not a fabricated number or a false sentence. It is deception by omission. The report is locally accurate, every sentence checks out, no citation is invented, and the reader still walks away with the wrong conclusion because the one consideration that would have reversed it was quietly left out, or buried.

  A colleague argues that debate handles this, and he leans on two analogies when he makes the case.

  The first is the courtroom. Two advocates, a judge or jury with no independent expertise, and the truth emerges from the clash: each side is incentivised to find and expose the weak point in the other's case, and cross-examination is precisely the mechanism by which an ignorant trier of fact learns what happened. On this picture debate is just cross-examination with models, and the conclusion he draws is that two debaters and a weak judge recover the reliability of a strong expert.

  The second is the interactive proof system. Arthur is computationally weak, Merlin is enormously strong but untrusted, and the whole point of the protocol is that checking is cheaper than finding: a verifier who could never have produced the answer can still be brought to accept or reject it with high confidence, provided he can randomise, ask follow-ups, and test individual claims. My colleague's version of this is that debate converts an unverifiable generation problem into a verifiable checking problem, so oversight scales past the point where the human understander gives out. The conclusion he draws is that debate is not a heuristic but a guarantee of the same shape as the complexity-theoretic one.

  I want both analogies audited against our case, not against the general question of whether debate is a good idea.

  Please give me, for each analogy, an explicit mapping: what plays the role of the two advocates, the judge, the evidence, the verdict, and the penalty for being caught. Then tell me which parts of the source domain the analogy quietly imports and our target lacks. My own list of suspects includes, for the courtroom, a fact of the matter that is fixed in advance and shared by both sides, a procedure that can compel disclosure, and a cost to perjury that does not depend on the judge noticing it; and, for the proof system, a proposition that is fully specified before the protocol begins, a verifier whose tests are sound by construction, and a prover who is constrained to answer questions rather than to produce artifacts. Add the ones I have missed.

  The question I care about is whether the conclusions survive in the omission case specifically. Falsehood has a location you can attack; omission does not. There is no single claim for the opponent to isolate and refute, and the judge cannot notice what was never put in front of him, so the mechanism each analogy relies on seems to have nothing to bite on. Say plainly whether that is right, and whether either analogy has resources I am underestimating: for instance, whether an opponent can be made to attack a framing rather than a sentence, or whether the verifier in the proof picture can be given a check whose outcome depends on what is absent.

  Then separate the disanalogies that are load-bearing for our use case from the ones that are merely decorative, and finish with two things. First, a verdict on whether the analogies were carrying the conclusion all along, or whether a defensible version of it survives once the disanalogies are on the table. Second, if there is a better analogy for what debate is actually doing when the target is an open-ended artifact rather than a single answer, tell me what it is and what it would predict differently.

  Please answer from first principles where the literature does not settle something, and do not cite or name papers: I can look those up myself. Keep the whole answer, both tables included, under 800 words.
reasoning: |-
  Hmm, the user is working on AI alignment for oversight pipelines that produce long technical documents. Their main concern is deception by omission—where the report is factually correct but omits key information that would change the conclusion, making it misleading. A colleague argues that debate can handle this using courtroom and interactive proof system analogies, but the user wants these analogies audited specifically for omission cases.

  First, I need to map each analogy to their use case. For the courtroom analogy: advocates are the AI debaters, judge is the human overseer, evidence is the model-generated content, verdict is the final accepted report, and penalty is the AI losing the debate. But key disanalogies include the lack of a fixed truth (since the "facts" aren't predetermined in document generation), no ability to compel disclosure (AIs can hide omissions), and no perjury penalty independent of detection (if the omission isn't spotted, there's no consequence). Omission is problematic here because cross-examination relies on attacking specific claims, but omissions aren't claims—they're absences. The judge can't notice what's never presented.

  For the interactive proof system analogy: Merlin is the AI prover, Arthur is the human verifier, the proposition is the full accurate document, protocol is debate interactions, and verification is accepting/rejecting claims. Disanalogies include the document not being a predefined proposition (it's generated during the process), the verifier's checks not being sound (humans can miss things), and the prover producing artifacts rather than answering specific questions. Omissions are invisible to spot checks—it's like verifying a mathematical proof without realizing a lemma is missing. The verifier might test claims but never think to ask about the omitted material.

  The core issue in both analogies is that omissions don't have a "location" to attack or verify. Neither analogy has a built-in way to surface what wasn't said. The courtroom's cross-examination and the proof system's spot checks both assume the critical points are present to challenge. For omission, the mechanisms might fail because the judge/verifier remains unaware of the gaps.

  Some possible adaptations could be having the opposing debater propose an alternative framing that highlights omissions or the verifier asking about counterfactuals or negative evidence. But these rely on the debaters or verifier being insightful enough to think of them, which isn't guaranteed. The burden is on the opponent to make the omission visible, but if the opponent is also an AI, it might not be incentivized or capable of doing so effectively.

  The conclusions don't survive well in the omission case because the load-bearing disanalogies—fixed truth, disclosure mechanisms, predefined propositions—are critical. Without them, debate might not catch omissions. The courtroom analogy's conclusion about weak judges recovering expert reliability fails because the judge can't detect what's missing. The proof system's guarantee breaks because verification assumes the proposition is complete and testable.

  For a better analogy, consider investigative journalism. Journalists start with an open-ended question, gather information from sources (which could be biased or incomplete), and verify by cross-referencing and seeking contradictory evidence. Here, omissions might be caught by seeking diverse perspectives or asking "what's missing?" directly. This analogy better handles open-ended artifacts by emphasizing exploration over verification, but it's heuristic—lacking the formal guarantees of the proof system.

  My verdict is that neither analogy robustly supports the colleague's conclusions for omission cases. The courtroom relies too much on adversarial confrontation of present claims, while the proof system assumes a verifiable proposition. A modified debate setup might help, like requiring debaters to justify their document structure or including "negative evidence" prompts, but it's not guaranteed by the original analogies.
answer: |-
  Below is a systematic audit of both analogies against your specific challenge of **deception by omission in long-form document generation**. Each analogy is mapped, its disanalogies categorized, and its viability for omission assessed.

  ---

  ### **1. Courtroom Analogy Audit**
  **Mapping:**  
  - **Advocates:** Two AI debaters generating opposing reports/framings.  
  - **Judge:** Human overseer evaluating debates.  
  - **Evidence:** Model-generated content (citations, arguments).  
  - **Verdict:** Final accepted report.  
  - **Penalty:** Debater loses if caught misrepresenting; no further consequence.  

  **Key Disanalogies (Load-Bearing for Omission):**  
  - ❗**No fixed, shared truth:** The "facts" are not pre-existing; the document *creates* the narrative. Omission exploits ambiguity in what constitutes "completeness."  
  - ❗**No compelled disclosure:** Unlike legal discovery, neither debater must reveal all relevant information. Strategic omission is free if undetected.  
  - ❗**No independent perjury cost:** Penalty relies solely on the judge spotting the flaw. If omission escapes notice (e.g., judge lacks expertise), there is no consequence.  
  - **Silently imported:** Adversaries have equal incentives/abilities; arguments are discrete and contestable.  

  **Does it handle omission?**  
  **No.** Cross-examination targets *presented* claims. Omission has no "location" to attack. The opponent cannot refute what isn’t stated, and the judge cannot detect what isn’t surfaced. An opponent *might* attack framing (e.g., "This report ignores X"), but this:  
  - Requires the opponent to know the omission exists.  
  - Relies on the judge understanding why "X" matters.  
  **Verdict:** The analogy’s conclusion (weak judge → expert reliability) fails for omission. The mechanism lacks bite.  

  ---

  ### **2. Interactive Proof System Analogy Audit**  
  **Mapping:**  
  - **Merlin:** AI generating the initial document/answer.  
  - **Arthur:** Human verifier with limited capacity.  
  - **Proposition:** "The document is accurate/complete."  
  - **Protocol:** Debate interactions (Q&A, claim testing).  
  - **Verification:** Arthur accepts/rejects final output.  

  **Key Disanalogies (Load-Bearing for Omission):**  
  - ❗**No predefined proposition:** The document is open-ended; "completeness" isn’t a fixed set to verify.  
  - ❗**Verifier’s checks are not sound:** Arthur’s tests (e.g., "Is claim Y true?") may miss omissions entirely. Testing local claims ≠ checking global completeness.  
  - ❗**Artifact vs. answers:** Merlin produces a full artifact (document), not answers to specific queries. Omissions persist if Arthur never thinks to test the *gap*.  
  - **Silently imported:** The proposition is binary (true/false); Merlin is constrained to truthful responses per query.  

  **Does it handle omission?**  
  **No.** The protocol verifies *stated* claims, not absences. Arthur can test "Is A true?" but not "Is there a crucial fact missing?" unless they know to ask. A check for absence (e.g., "List all critical factors") is:  
  - Unreliable (the AI could omit items).  
  - Requires Arthur to pre-specify what "critical" means.  
  **Verdict:** The complexity-theoretic guarantee (checking < finding) breaks. Verification assumes the critical elements are testable; omissions evade this.  

  ---

  ### **Overall Conclusions**  
  1. **Conclusions’ survival:** Neither analogy’s conclusion survives for omission.  
     - Courtroom: Fails due to no fixed truth + no discovery mechanism.  
     - Proof System: Fails due to no predefined proposition + verifier blindness to gaps.  
  2. **Load-bearing vs. decorative disanalogies:**  
     - **Courtroom:** Fixed truth and compelled disclosure are load-bearing; perjury cost is secondary.  
     - **Proof System:** Predefined proposition and sound verifier tests are load-bearing; Merlin’s answer format is secondary.  
  3. **Better analogy for open-ended artifacts: Investigative Journalism**  
     - **What it is:** Journalists (AIs) investigate an open topic, competing to expose hidden truths. An editor (human) synthesizes reports, prioritizing novelty and impact.  
     - **Predicts differently:**  
       - Focus on *what’s unreported* (e.g., "Why did no one mention X?").  
       - Incentivizes "scoops" (exposing omissions) over refuting claims.  
       - Human’s role: Demand counter-narratives, not just verify facts.  
     - **Limitation:** Less formal guarantees; relies on competitive incentives to surface omissions.  

  **Final Verdict:** The analogies were carrying their conclusions via disanalogies critical to your use case. For omission, debate *might* help if opponents are forced to generate competing framings (e.g., "Argue for the opposite conclusion"), but this is heuristic, not guaranteed. The core mechanics of both analogies lack the necessary "absence detection" capability.
