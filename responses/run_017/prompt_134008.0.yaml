answer: |-
  Here’s a translation of your five frameworks into quantitative social science vocabulary, grounded in your empirical findings. I’ll flag what maps cleanly, what distorts, and what’s untranslatable, then address your core technical concerns.

  ---

  ### **1. "Real & About Equality" (Bobbio) vs. "Dead Seating Chart"**
  - **Translation**:  
    - *Bobbio*: The first latent dimension (LD1) should have stable, high loadings on policies redistributing resources (taxes, welfare) and exhibit measurement invariance across time/space.  
    - *Seating Chart*: LD1 is a stable coordinate system with **rotational indeterminacy resolved historically**, but loadings drift (e.g., free trade flips valence). Positions persist due to **path dependence in coalitional enmity** (your finding #3).  
  - **Clean Fit**: "Seating chart" aligns perfectly with sticky coordinates (#4) and content-swapping (#2). LD1’s stability is geometric, not substantive.  
  - **Distortion**: Bobbio requires invariant policy loadings — but your data shows loadings *aren’t* invariant. Equality isn’t the latent trait; it’s a historically contingent **label** for one end of the axis.  
  - **No Expression**: Bobbio’s *normative* claim (equality = core of leftism) has no empirical counterpart. The axis is real, but its meaning isn’t fixed.  

  ### **2. "Coalitional Logrolling" vs. "Deep Temperament"**
  - **Translation**:  
    - *Logrolling*: Parties are mixtures (e.g., Dirichlet process priors) with positions emerging from **Nash bargaining** among factions. LD1 reflects a stable core of veto players.  
    - *Temperament*: LD1 correlates with psychometric traits (e.g., openness), exhibiting **measurement invariance** in surveys. Clusters should persist even when issues change.  
  - **Clean Fit**: Logrolling explains why enmity predicts coordinates (#3): coalitions are **Nash equilibria** maintained by side payments. "Who fights whom" defines the axis.  
  - **Distortion**: Temperament theories imply cross-temporal stability in *individual* attitudes, but your data shows parties flipping policies without moving on LD1 (#2). This suggests elite coordination > voter psychology.  
  - **No Expression**: "Temperament" as an *innate* trait isn’t testable with party-level data. Surveys could detect it, but elite bargaining can override it.  

  ### **3. "Contingent Bundle" vs. "Organic Worldview"**
  - **Translation**:  
    - *Contingent*: Policy loadings on LD1 should show **concept drift** with low cross-decade correlation. Issue bundling is path-dependent.  
    - *Organic*: Loadings should be stable (high **measurement invariance**), and positions should correlate via **common factor** (e.g., universalism vs. tribalism).  
  - **Clean Fit**: Contingency wins: policy flips (#2) and weak LD2 (#1) imply no "deep" coherence. Bundles are **coalitional byproducts** — e.g., a party inherits a "left" slot, then adopts whatever policies fit its allies/enemies (#3, #4).  
  - **Distortion**: Organic views require high **inter-item covariance** that persists; your data shows covariance *patterns* shift.  
  - **No Expression**: "Worldview" implies cognitive consistency at the individual level — untestable with roll-call data.  

  ### **4. "Coordination Device" (Your Focal Point Theory)**
  - **Translation**: LD1 is a **Schelling point** for coalition formation. Its value comes from **common knowledge** of its existence. Sign indeterminacy is resolved historically, then "locked in" via:  
    - **Network effects**: Attacking a coalition assigns you to its opposite pole (per your finding #3).  
    - **Sticky expectations**: Past positions create **Bayesian priors** that resist updating (#4).  
  - **Clean Fit**: Best aligns with *all* your findings: explains content-swapping (#2), enmity-prediction (#3), and stickiness (#4). LD1 is real like a currency: its value is emergent from shared belief.  
  - **Distortion**: None — this is the most empirically coherent framework.  

  ### **5. "Class Position" (Marxist)"**
  - **Translation**: Class is the **true latent variable**, LD1 is its proxy. Proletariat/bourgeoisie interests should create stable policy bundles (e.g., labor rights = high LD1 loading). Coalitions are **class alliances**.  
  - **Clean Fit**: None. Policy reversals (#2) contradict stable class-based bundles. If class were latent, LD1 loadings wouldn’t flip 180°.  
  - **Distortion**: Coalitional enmity (#3) could reflect class conflict, but your data shows *identical* manifestos at opposite poles — impossible under class reductionism.  
  - **No Expression**: "Class consciousness" as a historical force has no operationalization in ideal-point models.  

  ---

  ### **Residue Report: What Your Framework Can’t Capture**  
  - **Missing in Models**:  
    1. **The Origin of Sign**: Rotational indeterminacy means "left/right" labels are extra-empirical. But your data shows the *direction* matters politically — it’s **path-dependent focal point** created by initial conditions (e.g., 1789 seating) and reinforced by coordination.  
    2. **Why Coalitions Form**: Ideal-points describe *how* parties align, not *why*. Game theory (core, side payments) fills this gap, but can’t predict which coalitions become salient.  
  - **Why It’s Missing**:  
    - Not model thinness — it’s inherent. **Coordination devices exist only if actors believe they do**. Your models detect the *emergent geometry* of conflict, not the generative narratives ("left = equality").  
    - The "deeper temperament" theories overstate their case — your data suggests elite coordination can reshape coalitions *despite* voter traits.  

  ### **Your Core Questions**  
  **(a) Rotational & Sign Indeterminacy**:  
    - The axis direction is **extra-empirical but socially real**. Sign flips are irrelevant mathematically but fatal politically. The label ("left") is a **coordination anchor** from historical contingency. Your finding that enmity defines the pole (#3) confirms this: attacking "the left" makes you "right," regardless of policies.  

  **(b) Measurement Invariance**:  
    - When loadings drift, "left" *does not* mean the same thing substantively. But **positional invariance holds**: the *relative* location of parties on LD1 predicts coalitional behavior (#3, #4). The axis tracks **coalitional identity**, not doctrine. Enmity isn’t a confounder — it’s the **mechanism**.  

  ---

  ### **Conclusion**  
  Your empirical patterns most strongly support the **coordination device** theory (4) and **contingent bundling** (3). The left/right axis is a Schelling point stabilized by network enmity and inherited slots. "Equality" (1), "temperament" (2), and "class" (5) are narratives actors use to legitimize positions in a geometrically stable but substantively fluid space. The residue — *why* certain conflicts become salient — lies in historical contingency, not latent variables. Your framework isn’t too thin; it reveals that the "content" of left/right is epiphenomenal to the coalitional structure it coordinates.
