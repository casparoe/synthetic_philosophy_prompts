prompt: |-
  Hi. I need you to act as a formal epistemologist who also knows how real prediction markets actually work — the internal corporate kind, election markets, the replication-forecasting markets people ran in psychology a few years back. Take it seriously and think before you write: use your first pass to brainstorm what the genuinely hard questions are here (what a market price is even supposed to be evidence *of*, what has to be true for trade to carry information at all, what it would mean for us to treat a price as a reason to act), and only then draft. The draft should be the memo itself, not notes toward one, in continuous prose: no headings, no bullet points, no bold text, no tables, the way you'd write a long email to a committee. Somewhere around 900 to 1200 words.

  Here's the situation. I'm a journalist — I cover science and ideas — and I sit on the board of a small metascience funder, put there as the token non-expert. We've funded about sixty preregistered replication attempts across psychology and economics, with results landing over the next eighteen months. One of our economists has proposed that we also run an internal prediction market alongside them: small capped real-money stakes, open by invitation only, one contract per study paying out on whether the replication hits its preregistered success criterion. That part is fine. The part that turned into a fight is what he wants us to *do* with the price: publish it next to each result as, in his words, "the field's second opinion," and feed each project's average price into the decision about which labs get the next round of follow-on money.

  Three people pushed back, and I have to seperate out what's actually right in each. Our epidemiologist says the price will be mostly noise plus shared priors, and that publishing it launders a guess into a verdict. A philosopher on the board invoked the no-trade results — the family of results saying that if traders are rational, share common priors, and differ only in their private information, there shouldn't be much trade at all — and argued that whatever volume we do see will measure how much our invitees *disagree*, not how much they collectively know, so reading the price as an accuracy signal is a category mistake; on her view we should be inviting people precisely because they have different priors, which is the opposite of how everyone assumed we'd build the invite list. And one of our psychologists objects to the requirement the economist wants, that every trade be accompanied by a one-paragraph written justification: she says the whole point of a market is to aggregate knowledge nobody can fully articulate, and that forcing articulation will destroy the signal. There's a wrinkle that made this concrete rather than theoretical: in the eight-study pilot, the single most profitable trader posted justifications that were basically word salad — profitable, unexplainable, and nobody on the board knows what to make of him.

  What I need is a memo recommending a concrete decision to the board: run it as proposed, run it in modified form, or don't run it, on a specific timeline, with the reasoning laid out so the side that loses can see it was actually engaged and not just overruled. Along the way I need you to settle four things as best you can. First, what a market price is epistemically — is it testimony, an aggregation of evidence, a surrogate for expert judgment, something else entirely — and what sort of thing it could justify an institution like ours in doing. Second, whether making the price consequential for funding is self-undermining, since once traders know their price moves money they have reasons to trade on something other than their belief about the replication. Third, whether our market can even generate the disagreement it needs in order to trade at all, given that the natural invite list is people who read the same journals and share a lot of priors — and if it can't, what we'd have to change about the participant list or the contract design. Fourth, the justification requirement and the word-salad trader: whether articulate reasons are a cost or a benefit here, and whether a profitable-but-inarticulate trader shows that the price is picking up something real or that it's picking up something we can't trust.

  Be honest about the places where the theory goes quiet and we just have to make a judgment call. And don't recommend that we commission further analysis or pilot it again — we've piloted it; give me a decision I can put to a vote, including, if that's where you land, the maximum weight you'd let the price carry in a funding decision and what the board should say publicly about it when it publishes results. I dont need this till Thursday but I'd rather have something I can defend than something fast.
