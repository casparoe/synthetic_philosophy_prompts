  For the parish-rate problem (topic 1), I'll ask about agency representation in administrative records. The scholar will likely argue these records structurally objectify subjects. My follow-up will challenge whether transcription itself constitutes agency reclamation. This sets up the custodial bind (topic 2) about community control - I'll probe deposit models that avoid disempowerment. Her reply will probably dismiss community archives as impractical, letting me follow up about power redistribution.

  Topic 3 (inclusion as re-description) is where her first deflection phrase appears. I'll question whether controlled vocabulary reinforces original exclusion. When she calls this mere description, my follow-up will demand she articulate the exact power mechanism at play. For retrievability bias (topic 4), I'll confront how full-text search privileges institutional language over self-description. Her "access problem" deflection won't hold against my follow-up about systemic unanswerability.

