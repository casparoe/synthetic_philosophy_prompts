  - The temporal inconsistency mirrors re-optimization at each node
  - Committing to pay is like shrinking your policy class
  - Installing a disposition resembles reward shaping

  Now for the specific questions:
  1) On counterfactuals: In RL, what an agent would do at unreachable nodes is handled via off-policy evaluation. But philosophically, there's a normative claim about what commitments you can make now. This seems like a real mismatch in how we handle counterfactuals.

