prompt: |-
  I'm finishing a chapter on the ethics of price regulation and I keep getting stuck on something that isn't really about whether these policies work. It's about what the shape of them seems to assume.

  Take the common core of city rent stabilisation (I mean the stylised package, not any one statute): the cap binds only while the sitting tenant stays put, and when they leave the landlord can generally reset to market; a close relative who has been living there can inherit the tenancy; the owner can often evict in order to move themselves or a family member in; and new construction is usually exempt for some years. Minimum-wage regimes, at least the ones I know, are built almost the other way round in every respect: the floor attaches to the person rather than to the slot, so a brand new hire gets it on day one and there is no "vacancy" reset at all; but there are lower rates for younger workers and apprentices, and enforcement is mostly complaint-driven.

  What I want is the normative reconstruction, not the incidence stuff — I've read enough demand curves. What view of the thing being protected would make this the natural shape to hand both policies? The rent rules look like they protect incumbency itself, or the tenant's grip on a particular place; the wage rules look like they protect the person against a market, whoever they are and however long they've been there. But then why is it fine for a new tenant to pay market and not fine for a new hire to be paid less, and why does one regime have a "you can reset when there's nobody in situ" rule and the other doesn't, while the other has a "you can be paid less if you're young or still training" rule and the first doesn't?

  The thing I've been kicking around, which may be nonsense: call it disruption-sensitivity. The thought is that a price becomes regulable only where paying more would force someone to abandon a life they've already built around it, which would explain vacancy decontrol very neatly and also why the exemption is for new build. Is that something the practice actually presupposes, or just one story it happens to fit? If it is the right story it generalises wildly — renewal caps on insulin, on broadband, on tuition for continuing students — so why is housing basically the only place we do it, and would a "portable cap", where the tenant carries their discount to the next flat, be the more coherent version of the same idea? What would break if we did that?

  Also: the new-build exemption seems to presuppose that prices are signals we should mostly preserve, and the youth and apprentice rates seem to presuppose that a price is a transfer that can be adjusted to what someone deserves or produces. Does that mean the two regimes quietly rest on inconsistent views of what a price even is, or can one theory hold both?

  And I'd like to know which parts of all this the practice strictly needs versus which merely sit comfortably with it — where it's underdetermined, so that a couple of quite different theories would both produce exactly this architecture. I don't need pointers to papers, I need the argument laid out. Oh, and could you write it in British English, spelling and all — I'm pasting chunks of it into a UK journal submission and I don't want to have to go through fixing every -ize.
reasoning: |-
  Okay, the user is working on a chapter about the ethics of price regulation, specifically comparing rent stabilization and minimum wage policies. They're stuck on why these policies have different structural features despite both being forms of price regulation. The user has identified key differences: rent stabilization protects incumbents with vacancy decontrol and inheritance clauses, while minimum wage applies universally to workers regardless of tenure. 

  The user proposes a "disruption-sensitivity" theory where regulation only applies when price changes would disrupt established lives. This explains rent control features but not minimum wage's universal application. They also note conflicting presuppositions: rent regulation treats prices as signals (hence new-build exemptions) while minimum wage sees prices as transfers tied to desert or productivity (with youth/apprentice rates).

  Hmm... the user clearly understands the technical aspects but seeks the normative underpinnings. They're frustrated with economic incidence studies and want philosophical reconstruction. Their "disruption-sensitivity" idea is clever but incomplete. The journal submission context explains their request for British English.

  The core tension is between two paradigms of fairness: 
  - Housing policy assumes location-specific sunk costs (schools, community) justify protecting occupancy continuity. Vacancy decontrol preserves price signals for new allocations. 
  - Labour policy assumes human dignity requires a baseline irrespective of tenure. Differential rates for youth/apprentices reflect productivity/equity trade-offs.

  The new-build exemption in rent control does treat prices as allocation signals, while minimum wage subcategories treat wages as merit-based transfers. These aren't necessarily inconsistent—they reflect context-specific compromises: housing policy balances tenant protection with supply incentives, while wage policy balances living standards with employment effects.

  Portable rent caps would undermine vacancy decontrol's incentive structure and create administrative nightmares—tenants might "port" discounts to luxury units, landlords would resist inheriting capped rates. This explains why housing remains the primary domain for vacancy-linked controls.

  The practice requires:
  - Rent regulation must have vacancy reset to maintain supply incentives.
  - Minimum wage must be person-based to ensure dignity floor.
  Other elements (inheritance clauses, youth rates) are negotiable design choices.

  British English compliance is straightforward: "stabilisation" not "stabilization", "labour" not "labor". Will maintain that throughout.
answer: |-
  Right, let's crack this normative puzzle. The structural divergence between rent stabilisation and minimum wage regimes isn't just happenstance; it reflects deep-seated, often unarticulated, conceptions of what is being protected, the nature of the harm addressed, and the perceived function of the regulated price itself. Your "disruption-sensitivity" intuition hits a crucial nerve, but needs refining and situating within a broader framework.

  ### Core Normative Reconstruction: Protecting Different Types of "Embeddedness"

  1.  **Rent Stabilisation: Protecting Spatial and Relational Embeddedness**
      *   **The Protected Good:** The core ethical concern here is the *disruption of an established life rooted in a specific place and community*. Tenancy isn't just a financial transaction; it's the foundation for social networks, access to employment, schooling, healthcare, local support systems, and personal identity. Uprooting someone due to rent increases isn't merely an economic loss; it's a profound social and psychological disruption.
      *   **"Disruption-Sensitivity" Refined:** Your insight is central. The policy architecture *assumes* that the primary harm justifying intervention arises when price increases *force displacement of an incumbent tenant*. The moral claim strengthens with the *duration and depth* of embedding. This explains:
          *   **Vacancy Decontrol:** Once the tenant *chooses* to leave (or passes away without a qualifying successor), the disruptive harm vanishes. The landlord regains the right to charge market rate for the *vacant slot*. The price signal is restored for re-allocation.
          *   **Succession Rights:** A close relative inheriting the tenancy partially inherits the embedded life (social ties, local knowledge, potentially care networks). The harm of displacing *them* is seen as significantly greater than displacing a completely new tenant.
          *   **Owner/Family Move-In Eviction:** This recognises a countervailing claim – the owner's own fundamental need for *their* property as a home (spatial embeddedness for *them*), often seen as trumping the tenant's claim once the specific disruptive harm (to the tenant) is mitigated by the eviction ground itself (providing a reason, often with compensation/notice requirements).
          *   **New-Build Exemption:** This explicitly preserves the price *signal* for *new* investment and allocation. It presupposes that for units not yet occupied, there is no incumbent life to disrupt. The market signal is deemed essential to incentivise supply and ensure efficient initial matching.

  2.  **Minimum Wage: Protecting Basic Dignity and Labour's Intrinsic Worth**
      *   **The Protected Good:** The core ethical concern here is preventing *exploitation* and ensuring a *minimum standard of living* derived from work, irrespective of tenure or specific job slot. It protects the *worker as a person with inherent dignity*, not their attachment to a specific role or employer. The harm is *being paid below a socially determined subsistence floor*, which undermines autonomy, health, and participation in society.
      *   **Absence of Disruption-Sensitivity:** The harm isn't tied to being *displaced* from a *specific* job due to a wage *change*. It's the state of *earning too little*, full stop, regardless of whether you've been in the job five minutes or five years. This explains:
          *   **Person-Based, Not Slot-Based:** The floor attaches to the *worker*, not the job. A new hire gets it immediately because their need for subsistence is just as pressing as a long-serving employee's. There's no "incumbency" to protect in the spatial/relational sense.
          *   **No Vacancy Reset:** The floor applies continuously. Lowering the wage for a *new* hire to fill the *same slot* would still violate the principle of ensuring *that worker* earns a subsistence minimum. The "slot" is irrelevant; the person is paramount.
          *   **Youth/Apprentice Rates:** This reflects a different normative compromise:
              *   **Productivity/Investment Argument:** Younger workers or apprentices are perceived (rightly or wrongly) as potentially less immediately productive or requiring significant employer investment in training. A lower rate is seen as facilitating entry into the labour market and skill acquisition, without undermining the core dignity floor *for established adult workers*. It presupposes wages can be partially calibrated to *contribution* or *investment cost*.
              *   **Equity Argument (Less Charitable):** It can also reflect a societal judgement that the *full* living wage obligation applies primarily to those assumed to be supporting themselves or families, with younger workers having lesser needs (often a contentious assumption).

  ### Reconciling the Presuppositions about Price

  *   **Rent Regulation (New-Build Exemption):** This *does* presuppose that market prices serve a vital *signalling and allocative function*, particularly for *new* goods/services (housing supply). Distorting this signal *ex ante* (for new builds) is seen as counterproductive and unnecessary (no incumbent to protect). For *existing* tenancies, however, the *disruptive harm* justifies overriding the allocative signal in favour of protecting embedded lives. Price here is primarily an *allocation mechanism* whose normal function can be suspended to prevent severe harm to incumbents.
  *   **Minimum Wage (Youth/Apprentice Rates):** This *does* presuppose that wages are not *just* signals or transfers, but also reflect (or should be allowed to reflect, within limits) *individual characteristics* like skill level, experience, or training cost (i.e., *merit* or *investment* considerations), *alongside* the fundamental transfer needed for basic subsistence. Price here is a *transfer* that can be adjusted based on perceived desert or productivity, but only *down* to a floor defined by human dignity needs.

  *   **Are they inconsistent?** Not necessarily *inconsistent*, but they operate on **different normative planes and address distinct market failures/harms**. Rent control primarily addresses a *specific harm arising from displacement due to price volatility in an essential, location-specific good with high switching costs*. Minimum wage addresses a *pervasive risk of exploitation and sub-subsistence earnings in the labour market generally*. The differing views on price reflect the differing contexts: the allocative efficiency of housing *supply* vs. the distributive justice and anti-exploitation concerns in *labour*.

  ### Testing "Disruption-Sensitivity" and the "Portable Cap"

  *   **Does practice presuppose it?** Yes, strongly for rent control. The vacancy decontrol rule is the clearest evidence – the justification evaporates precisely when the disruptive displacement is no longer a risk. The succession rights and owner move-in provisions further reinforce that it's about protecting *this person* in *this home* from *this disruption*. The new-build exemption logically follows.
  *   **Why only housing?** Because housing possesses unique characteristics amplifying disruption:
      *   **High Transaction/Switching Costs:** Physically moving is expensive, time-consuming, and stressful.
      *   **Location Specificity:** Jobs, schools, care networks, communities are tied to place. Losing your home often means losing access to these irreplaceable goods.
      *   **Essential Nature:** Shelter is a fundamental need. Displacement isn't just inconvenient; it can be catastrophic.
      *   **Durability & Fixed Location:** The "slot" (the specific dwelling) is unique and immovable. Insulin, broadband, and tuition, while essential, generally lack this *combination* of high switching costs, location specificity, and the unique durability/fixity of the "slot". Broadband might come closest, but switching providers is usually far less disruptive than moving home. Renewal caps elsewhere *might* fit the *logic* (protecting against disruptive price hikes for existing users), but the *magnitude of harm* justifying such complex regulation is rarely perceived as equivalent to housing displacement.
  *   **The Portable Cap: A More Coherent Disruption Theory?**
      *   **Concept:** A tenant carries a right to a capped rent (e.g., X% below market) to their *next* home. This directly targets the disruption of moving *caused by* unaffordable rents *anywhere*.
      *   **Why it Breaks:**
          *   **Undermines Allocation/Signalling:** It decouples the subsidy entirely from the *specific slot*. Landlords of *any* property could be forced to accept below-market rent based on the tenant's history, severely distorting allocation signals across the entire market. Finding landlords willing to participate would be difficult.
          *   **Administrative Nightmare:** Defining "market rent" dynamically for *any* property a tenant might choose is vastly more complex than regulating specific, known tenancies.
          *   **Perceived Fairness/Incentives:** Why should a tenant carry a state-mandated discount to a potentially nicer area or larger flat? It could be seen as unfair to other tenants and erode landlord incentives to maintain properties if they can't capture market value even with new tenants.
          *   **Weakens Incumbent Protection:** The core *strength* of traditional rent control – securing the *current* home – is diluted. The tenant might still be forced out but gets a discount elsewhere. The policy focus shifts from preventing displacement *from a specific community* to providing a general housing subsidy, which might be better achieved through housing benefit/vouchers. The current system prioritises preventing *that specific displacement* above all else.

  ### What the Practice Strictly Needs vs. What Fits Comfortably

  *   **Rent Stabilisation Strictly Needs:**
      1.  **Incumbency Trigger:** Regulation only applies while a *specific tenant* occupies a *specific unit*. This is the non-negotiable core reflecting the disruption logic.
      2.  **Vacancy Reset:** Deregulation upon vacancy is essential to preserve the allocative function for *new* tenants and maintain some supply incentive. Without this, the system risks chronic under-maintenance and reduced supply.
  *   **Rent Stabilisation Fits Comfortably (Underdetermined):**
      *   **Succession Rights:** While reinforcing the embeddedness logic, the *specific rules* (which relatives, residency duration) are contingent political/social choices. A system without them still protects the incumbent tenant, just not their successor.
      *   **Owner Move-In Provisions:** These balance competing claims (owner's home need vs tenant's security). The *exact* grounds and compensation are negotiable; some regimes are stricter than others. The core *need* is a mechanism to end the tenancy for *some* non-culpable, owner-occupier related reasons.
      *   **New-Build Exemption Duration:** The *length* of exemption is highly contingent on political goals regarding supply stimulation.
  *   **Minimum Wage Strictly Needs:**
      1.  **Person-Based Application:** The floor must apply to the *worker* performing labour, irrespective of the specific job or employer. This is fundamental to the anti-exploitation, universal dignity premise.
      2.  **No Vacancy Reset:** The floor must apply continuously to the *worker* in that role. A "reset" for new hires violates the core principle.
  *   **Minimum Wage Fits Comfortfully (Underdetermined):**
      *   **Differential Rates (Youth/Apprentice):** While common, a truly universal single-rate minimum wage is conceivable and exists in some places. The differentials reflect specific compromises around employment incentives and perceived needs/contributions, not the absolute core of protecting worker dignity.
      *   **Complaint-Driven Enforcement:** This is often pragmatic (resource constraints) rather than fundamental. Proactive enforcement would align just as well (or better) with the normative goal.

  ### Conclusion

  The divergent architectures stem from fundamentally different conceptions of the harm addressed and the nature of the good being protected. Rent stabilisation is ethically grounded in preventing the severe disruption of displacing an established life from its spatial and social context. Its rules (incumbency focus, vacancy decontrol, succession, owner move-in, new-build exemption) cohere around protecting that specific embeddedness while cautiously preserving market signals where no disruption is threatened.

  Minimum wage legislation is ethically grounded in ensuring a basic subsistence floor and preventing exploitation inherent in unequal labour bargaining power. Its rules (universal person-based application, no vacancy reset) reflect protecting the worker's dignity *as such*, while differential rates represent a contingent compromise with concerns about productivity, training costs, and youth employment.

  The differing presuppositions about price (signal vs. transfer/merit) are context-dependent expressions of these core purposes, not irreconcilable contradictions. The disruption-sensitivity theory powerfully explains rent control's unique structure but falters when applied to minimum wages or portable caps, precisely because the nature of the harm and the good protected are distinct. The practice strictly needs its core incumbency trigger and vacancy reset for housing, and its person-based universality for wages; other features, while often reinforcing, are contingent elements of the political and normative compromises shaping each regime.
