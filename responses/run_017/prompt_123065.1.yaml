prompt: |-
  hey — I'm a science journalist and I'm working on a feature about what happens to honest signalling when fluent text and images become nearly free: job applications, university essays, dating apps, op-eds, grant proposals, all of it. I want to rehershe the interview before I go bother actual experts.

  Please play Amotz Zahavi. Assume I've just sat you down and explained what a large language model is — trained on a big chunk of the internet, very cheap to run, churns out fluent prose and pictures on demand, and no detector reliably tells the output from human work. You may use your own concepts plus what I've told you; if you need a fact about the technology, ask me for it the way you'd ask a colleague who'd just shown you a new instrument. Stay in character until I say stop. You know the signalling literature cold — the handicap idea, the arguments your colleagues made for cheap or arbitrary ornaments, the standard objections to you, and where you thought they went wrong. Don't be a pundit and don't be a caricature: be the guy who thinks most of the field had honest signalling backwards. You will not concede that a display can stay reliable while being cheap to produce; you may give ground on small points, and when I press you into a corner, concede one and then come back on the attack. Never just say it depends.

  Before each reply, think carefully and decide privately what you are conceding and what you are not. Then answer in one single paragraph, maximum 130 words, no bullet points, no hedging.

  My opening question: a well-made paragraph used to be a signal because it cost somebody hours, and those hours were the handicap. Now any of my readers can produce a hundred equally polished paragraphs in a minute. If the cost of the display collapses to nearly nothing, your principle predicts the signal stops being reliable and the whole system degrades into noise. So name the handicap that is actually doing the work now — and tell me why the people who are starting to trust it aren't fooling themselves.
reasoning: |-
  Okay, let me approach this as Amotz Zahavi would. The journalist raises a sharp challenge: if polished writing was a reliable signal because it cost effort, and now AI makes it nearly free, what stops the system from collapsing? 

  First, I must hold firm that low-cost signals can't stay reliable - that's core to my handicap principle. But I can't just dismiss the reality that people are trusting AI outputs. So where's the real cost now? 

  I recall Zahavi always looked for hidden costs. The obvious one here is detection risk: if you get caught using AI, your reputation suffers. That's costly! But is that enough? Hmm... Zahavi might push further - the real handicap is in how you *use* the tool. 

  The journalist mentioned job applications and dating profiles. In those contexts, over-reliance on AI could signal poor judgment or laziness - traits that would actually harm you. The cost isn't in producing text anymore, but in the risk of revealing bad traits through misuse. 

  Also, consider verification costs. If everyone uses AI, receivers will demand proof of claims ("Show me your code" instead of "Describe your skills"). That shifts the cost elsewhere. 

  But I must be careful - Zahavi wouldn't accept that cheap signals can work long-term. So I'll concede that current trust in AI writing might exist temporarily because detection is hard, but stress it's unstable. The moment receivers adapt (through verification demands or social punishment), the signal collapses unless backed by real investment.
answer: |-
  (Leans forward, eyes sharp) The handicap shifts to the risk of *relying* on cheap signals! Your readers use effortless text, but detection may carry severe costs—rejection if exposed. Those trusting it now gamble that receivers won't adapt scrutiny. Yet when stakes are high—grants, hires—receivers *will* impose new costs: demanding live demonstrations, original data, or social vouchers that AI cannot fabricate. Trusting polished prose alone *is* foolish; it ignores that reliability requires signals tied to unforgeable investments. If you cannot back fluency with verifiable substance, you signal either poor judgment or deceit—both lethal handicaps. Noise dominates only where receivers are lazy.
