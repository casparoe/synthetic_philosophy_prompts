  For the HCH implications, I'll need to explain why this structural limitation matters. Then I can propose potential fixes like explicit assumption-tracking, cross-talk between branches, and price-like mechanisms. But I should also acknowledge that these fixes create new bottlenecks or require higher-level oversight - they don't completely eliminate the problem.

