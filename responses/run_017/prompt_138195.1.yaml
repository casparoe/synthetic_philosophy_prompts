prompt: |-
  At a metaphysics reading group last week, a long argument about whether there are any composite objects at all — one side saying that there are only simples arranged in various ways, the other that whenever there are things arranged somehow there is a further thing they compose — was closed down with the remark that the dispute is merely verbal, since both sides agree about which simples there are and how they are arranged. I want to take that remark seriously rather than wave it away, but I suspect it can be read in several quite different ways.

  Please set out, as a menu I can work through, the distinct precise theses that "the dispute is merely verbal" could be expressing here: that the parties are simply using the relevant expressions in different senses; that they agree about every non-linguistic fact and differ only about which sentence to use in describing it; that the disputed sentences have no language-independent truth value, so that each side is right in its own terms; that the real question is which language carves things up more naturally; that the real question is which language better serves our explanatory or practical purposes; and any further reading worth separating. For each, say whether it is close to a platitude, whether it is substantive and defensible, whether it is false, and whether it genuinely entitles someone to move on rather than argue — and tell me which reading the person in my group was most likely invoking.

  Two complications I would like the menu tested against. First: suppose the parties go on to disagree about whether there is any language-independent fact as to which of the two ways of counting is the natural or joint-carving one, or whether every such claim merely registers a preference — is that second-order disagreement verbal on the same readings, or does it survive as a distinct and substantive dispute? Second: suppose each side is disposed to call the other's favoured sentences not merely unassertable but straightforwardly false, and to treat ordinary claims such as the assertion that a table was bought as true given its own ontology and false given the other's — which of your readings then still count the original dispute as verbal, and does the slogan retain any of its dismissive force?
reasoning: |-
  Okay, the user is involved in a metaphysics reading group where there was a debate about composite objects. One side argues that only simple objects exist, arranged in various ways, while the other believes that whenever simples are arranged in a certain way, they compose a composite object. The discussion was dismissed as merely verbal because both sides agree on the simples and their arrangements. The user wants to explore what "merely verbal" means in this context, considering different interpretations.

  First, I need to break down the possible theses behind "merely verbal." The user provided several options: different senses of expressions, agreement on non-linguistic facts but differing sentences, no language-independent truth values, questions about natural carving or practical purposes. I should list these clearly and add any others. Each thesis needs evaluation: is it platitudinous, defensible, false? Does it allow moving on? Also, the user mentioned complications. First, if they disagree about whether there's a language-independent fact about naturalness, is that second-order dispute also verbal? Second, if each side considers the other's claims false, does "merely verbal" still hold?

  Starting with the menu. The first thesis could be Semantic Non-Alignment. Words like "composite object" or "exists" might have different meanings for each side. The nihilist might restrict "exists" to simples, while the universalist includes composites. This seems defensible. Both agree on the underlying facts (simples arranged), so they could translate each other's statements. It's substantive but not obvious. If true, disputants can move on by clarifying terms. But if each side insists their usage is correct, it might not resolve.

  Next, Metalinguistic Negotiation. They agree on facts but negotiate which language to use. This is defensible, especially if ontology is seen as conceptual choice. It allows moving on by agreeing to disagree on terminology. But it might feel unsatisfactory if they seek absolute truth.

  Third, Non-Factualism. The dispute lacks a language-independent truth value. This is controversial. Deflationists might accept it, but realists would reject it. Hard to defend, likely false for realists. Moving on is possible by recognizing no fact of the matter.

  Fourth, Metaphysical Naturalness. The real issue is which language carves nature at the joints. This is substantive. They might agree on joint-carving but disagree on which ontology is natural. If they accept naturalness, they can focus on that debate. But if not, it remains unresolved.

  Fifth, Pragmatism. Which language serves purposes better? Universalism might be practical for daily life; nihilism for physics. Defensible. They can move on by acknowledging different contexts. But if they prioritize different purposes, dispute continues.

  For complications. First, the second-order disagreement about naturalness. If both accept naturalness but disagree on which ontology is natural, that's substantive. If they disagree on whether naturalness exists, it could be verbal or substantive. If "natural" is interpreted differently, it might be semantic. If not, it's a factual dispute about properties.

  Second, when each side calls the other's claims false. Semantic Non-Alignment still holds if they recognize mutual understanding. Metalinguistic Negotiation works if they see it as choice. But Non-Factualism and Metaphysical Naturalness might struggle. If they insist on the falsity, it might not be merely verbal anymore. The dismissive force weakens if they can't agree on interpretation.

  The person in the group likely invoked Semantic Non-Alignment or Metalinguistic Negotiation, as they emphasized agreement on simples and arrangements. Testing against complications: for the second-order dispute, if they argue about naturalness, it's either substantive or semantic based on "natural". For mutual falsity, if they understand each other, Semantic Non-Alignment still applies, but dismissive force might be less if they care about truth.
answer: |-
  Here's a structured "menu" of distinct readings for "the dispute is merely verbal," analyzed against your criteria and complications. Each thesis is presented with its characteristics and evaluated for plausibility, dismissive power, and resilience to your complications. The person in your group was likely invoking **Reading 1 or 2**.

  ---

  ### **The Menu of Readings for "Merely Verbal"**

  #### **Reading 1: Semantic Non-Alignment**  
  **Thesis:** The parties use key terms (e.g., "composite object," "exists," "thing") with different meanings. The nihilist restricts "exists" to simples; the universalist extends it to composites.  
  - **Platitude?** No—requires linguistic analysis.  
  - **Defensible?** Yes (e.g., Hirsch's "quantifier variance").  
  - **False?** Only if terms have fixed, context-independent meanings (contested).  
  - **Move on?** Yes—once meanings are clarified, the *substantive* disagreement evaporates.  
  - **Group Likelihood:** **High**. Matches the remark's focus on agreement about simples/arrangements.  

  #### **Reading 2: Metalinguistic Negotiation**  
  **Thesis:** Parties agree on all non-linguistic facts but are negotiating *which language* (ontology) to adopt for describing them.  
  - **Platitude?** No—reflects a meta-philosophical stance.  
  - **Defensible?** Yes (e.g., Carnapian frameworks; Chalmers on verbal disputes).  
  - **False?** Rejected by realists who see ontology as factual.  
  - **Move on?** Yes—dispute shifts to practical/linguistic preferences.  
  - **Group Likelihood:** **High**. Fits the dismissive "agreement underneath" tone.  

  #### **Reading 3: Non-Factualism**  
  **Thesis:** The disputed sentences ("There are composite objects") lack language-independent truth values. Each side is "right" relative to their linguistic framework.  
  - **Platitude?** No—contentious anti-realism.  
  - **Defensible?** Controversial (defended by deflationists; attacked by realists).  
  - **False?** Realists insist composite existence is objective.  
  - **Move on?** Yes—if accepted, further argument is pointless.  
  - **Group Likelihood:** Low—less intuitive than Readings 1/2.  

  #### **Reading 4: Metaphysical Naturalness**  
  **Thesis:** The real issue is which language "carves nature at the joints" (e.g., Sider's structural realism), not truth simpliciter.  
  - **Platitude?** No—assumes a substantive metaphysics.  
  - **Defensible?** Yes, but only if naturalness is accepted as objective.  
  - **False?** Rejected by anti-naturalists (e.g., pragmatists).  
  - **Move on?** No—dispute becomes about which ontology is *more natural*.  
  - **Group Likelihood:** Low—unlikely in a dismissive remark.  

  #### **Reading 5: Pragmatism**  
  **Thesis:** The dispute concerns which language better serves human interests (e.g., prediction, communication, simplicity).  
  - **Platitude?** Near-platitude in scientific contexts.  
  - **Defensible?** Highly defensible (e.g., van Fraassen).  
  - **False?** Rejected if ontology is truth-apt, not pragmatic.  
  - **Move on?** Yes—redirects debate to practical trade-offs.  
  - **Group Likelihood:** Moderate—possible if "arranged" implies utility.  

  #### **Reading 6: Conceptual Relativity**  
  **Thesis:** There is no single "correct" description of reality; ontologies are tools for organizing experience (e.g., Putnam, Kuhn).  
  - **Platitude?** No—radical.  
  - **Defensible?** Yes, but contentious.  
  - **False?** Realists see it as self-undermining.  
  - **Move on?** Yes—if accepted, ontology is non-cognitive.  
  - **Group Likelihood:** Low—overly sophisticated for the context.  

  ---

  ### **Testing Against Complications**

  #### **Complication 1: Second-Order Disagreement (Naturalness vs. Preference)**  
  - **If they dispute naturalness:**  
    - **Readings 1–3, 5–6:** This second-order dispute **is still verbal** if "natural" is seen as semantic/pragmatic (e.g., "natural" = "useful" or "intuitive").  
    - **Reading 4:** **Substantive**—naturalness is treated as objective.  
  - **If they dispute objectivity of naturalness:**  
    - **All readings:** This is **substantive** if "objectivity" is non-linguistic (e.g., a metaphysical claim). Only if "objective" itself is negotiated (Reading 2) does it collapse into verbalness.  

  #### **Complication 2: Mutual Charges of Falsity**  
  - **Still "Merely Verbal" under:**  
    - **Reading 1 (Semantic Non-Alignment):** Charges of falsity arise from *ignoring* meaning variance. If both recognize this, the dismissive force holds.  
    - **Reading 2 (Metalinguistic Negotiation):** "False" = "ill-chosen framework." Dismissive force weakens but persists if purpose-relativity is acknowledged.  
  - **Not "Merely Verbal" under:**  
    - **Readings 3–6:** Mutual falsity claims conflict with non-factualism/naturalness/pragmatism, making the dispute **robustly substantive**.  
  - **Dismissive Force:** Retained only if parties **accept** meaning variance or framework-relativity. If they double down on universal truth-aptness, the slogan fails.  

  ---

  ### **Summary & Recommendation**  
  - **Your Group's Likely Reading:** **1 or 2**—they emphasized agreement on non-linguistic facts (simples/arrangements), implying semantic or metalinguistic divergence.  
  - **Best Dismissive Power:** **Reading 1** (if terms are clarified) or **Reading 5** (if redirected to pragmatics).  
  - **When Moving On Is Justified:** When parties agree that (a) non-linguistic facts are settled, and (b) further debate is about words/frameworks (Readings 1, 2, 5).  
  - **Caution:** If either side insists on language-independent truth (e.g., realism), only **Reading 4** survives—but it demands arguing about naturalness, not moving on.  

  This menu should help you diagnose the core issue: if the dispute hinges on *what we mean* or *how we talk*, it’s dismissible; if it’s about *what is*, it’s substantive. The complications reveal that higher-order disagreements often resurrect substance, but mutual falsity claims don’t automatically negate verbalness if rooted in semantic confusion.
