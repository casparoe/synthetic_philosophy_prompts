prompt: |-
  You are a comparative constitutional scholar and political theorist working on multilevel governance, with real command of the American, German, Swiss and EU systems. I would like you to answer in stages rather than in one pass. First, brainstorm the candidate concepts a specialist would reach for on hearing what follows — from federal theory, from EU studies, from public administration, from the literature on intergovernmental finance. Second, test each candidate against the three instances I give you, stating explicitly where it fits and where it strains. Third, tell me whether one of them is the concept, or whether the thing I am describing falls between them. If nothing established fits, coin a term: give me a one-sentence definition, a pair of near-identical cases that fall on opposite sides of the boundary, and a note on what the term should *not* be used for. I do not want a reading list, and I will not be satisfied with a bare label — the carving is the whole point. Please also correct any institutional background I have got wrong.

  The background, as I understand it: in the EU the Union is supposed to act only so far as the objectives cannot be sufficiently achieved by the member states; in Germany the federation may use one of the shared legislative competences only where a federal rule is shown to be necessary, and the constitutional court is supposed to police that showing; Switzerland has a clause, as I remember it, telling the Confederation to take on only what the cantons cannot manage or what needs uniform regulation; the United States has no such clause and instead seems to work through money attached to grants, plus a rule that the centre may not simply conscript state officials. I work in the legal office of a subnational government, and what I keep watching is this: the same formally allocated power is worth wildly different amounts depending on which unit holds it, and the difference is not mainly money.

  Three instances.

  (1) Two units hold formally identical competence over, say, hospital planning. Unit A has a drafting office of about forty lawyers; unit B has four. A legislates continuously. B does one of three things in practice: it copies A's statute more or less wholesale — after which the comparative tables record that B has its own law; or it simply leaves the central framework provision standing unmodified, year after year; or it asks a central ministry for a model text. No competence has been transferred and the allocation rule has not changed, yet when the central framework lapses, A has a replacement in force within weeks while B formally requests that the central rule remain in place until its administration is in a position to legislate — and the extension is renewed twice. What differs is not legal authority but the capacity to originate a rule and then defend it once someone challenges it.

  (2) When units lose a competence, they are compensated with a seat in the joint body that makes the central rule. But the low-capacity delegations cannot independently evaluate the central impact assessment or its several-hundred-page annex. They rely on the centre's own summary, or on whichever high-capacity unit's ministry has already costed the options, and they end up trading their votes for transition periods and side payments. The substitute for self-government is thus itself unequally available: the participation right is worth far more to the unit that can use it.

  (3) Reversals run the same way. Where competences are formally returned, or where a scheme lets units opt into additional powers by meeting benchmarks, uptake tracks the same ranking every time. The units that decline are not refusing autonomy — they are declining an administrative burden they cannot carry. So the familiar claim that competences ratchet upward turns out to be true in one part of a federation and false in another, which is a worse situation than either the ratchet story or its denial describes.

  My colleagues wave this off in two ways, and I think both are wrong but cannot say why. The first is that it is just the familiar fact that some regions are richer and some poorer; but equalisation transfers do not touch it, and the unit I have in mind is not poor, only small. The second is that it is just what everyone already discusses under the heading of units having different powers; but here the powers are formally identical, and that is precisely what makes the pattern invisible in the usual comparative tables.

  So: does this configuration have a name of its own? How does it differ from each of the nearby things — unequal resources, formally differentiated status for particular units, the arrangement in which subnational bodies administer central law, the well-known claim that joint intergovernmental decision-making is biased toward the status quo, and the "earned autonomy" or benchmark-based schemes that are meant to remedy it? Is what I am describing a defect in the allocation principle itself, or only in the way the "cannot be sufficiently achieved" test gets applied — and why do the obvious remedies each seem to make it worse in a different way (transfers that the strong units can simply buy their way out of, capacity-building designed and supervised centrally, procedures that require a unit to petition the centre to be trusted)? Finally, is this specific to multilevel constitutional systems, or does the same structure appear wherever a formal power is granted uniformly to agents of unequal capacity?
reasoning: |-
  Hmm, the user is a legal professional working for a subnational government, wrestling with a core paradox in multilevel governance. They've observed that formally identical powers function differently across units due to unequal administrative capacity - not money or legal status. This creates an invisible hierarchy where high-capacity units exercise autonomy while low-capacity ones depend on the center despite equal legal standing. The EU/German/Swiss "necessity" principles and US grant system form their comparative backdrop.

  Let me unpack this systematically. The user wants a three-stage analysis: first brainstorming conceptual tools, then testing against their three vivid examples, finally determining if existing concepts fit or if new terminology is needed. Their frustration is palpable - colleagues dismiss this as either mere wealth disparity or already-covered power differentiation, but they recognize it's neither.

  Conceptually, several frameworks come to mind. "Administrative federalism" captures the gap between legislative intent and implementation capacity. "Regulatory capacity divergence" describes the uneven ability to draft/enforce laws. "Absorptive capacity" from EU cohesion policy explains why some units can't utilize formal powers. The "joint decision trap" theory shows how weak players get sidelined even in shared bodies. "Decentralization paradox" describes how capacity gaps pull powers back upward. "Procedural federalism" reveals how uniform rules mask operational inequalities.

  Testing against their cases:
  - Hospital planning perfectly illustrates administrative federalism - Unit B's dependence stems purely from lacking drafting/litigation muscle.
  - The joint body scenario is classic joint decision trap pathology - weak delegations trade votes for scraps because they can't process complex dossiers.
  - The reversal asymmetry shows decentralization paradox in action - benchmark schemes become self-relecting when capacity determines opt-in ability.

  Existing concepts partially illuminate but don't fully capture the phenomenon. The core novelty is how formal equality of power interacts with operational inequality to create de facto differentiation - what we might call "phantom asymmetry." Unlike fiscal inequality, this persists after transfers. Unlike earned autonomy schemes, it's involuntary. Unlike cooperative federalism, the dependence is structural rather than designed.

  The deeper flaw lies in allocation principles that ignore implementation prerequisites. Remedies fail because: capacity-building designed centrally perpetuates dependence; fiscal transfers don't buy expertise; petition systems burden those least able to comply. This pattern extends beyond federations to any principal-agent relationship where formal powers outstrip operational capacity - think international organizations delegating to states, or corporations with unequal subsidiaries.

  The user needs terminology that exposes this invisible hierarchy. I propose "asymmetric capacity federalism" with the definition: A condition in formally symmetric multilevel systems where equal legal powers yield unequal autonomy due to persistent gaps in rule-generating and rule-defending administrative capabilities. Boundary cases: Two equally funded units where one lacks legal drafting tradition (asymmetric) vs. two units where one voluntarily adopts neighbor's laws (symmetric). The term shouldn't describe temporary capacity gaps or intentionally asymmetric systems like Spain's.

  This reframes their problem: the allocation principle isn't defective per se, but its application assumes uniform capacity that doesn't exist. The real tragedy is that standard metrics can't capture this phantom asymmetry - which explains why their colleagues keep missing it.
answer: |-
  ### Stage 1: Brainstorming Candidate Concepts  
  Your observation centers on **disparities in the *operationalization* of formally equal powers** due to asymmetric administrative/judicial capacity. Key concepts:  
  1. **Administrative Federalism** (Germany/EU): Focuses on *implementation* gaps despite legislative competence.  
  2. **Regulatory Capacity Divergence** (Public Administration): Uneven ability to draft/enforce laws.  
  3. **Absorptive Capacity** (EU Cohesion Policy): Ability to utilize formal powers/opportunities.  
  4. **Joint Decision Trap** (EU/German Studies): Weak actors trade influence for side payments.  
  5. **Decentralization Paradox** (Political Economy): Recentralization occurs when subnational units lack capacity.  
  6. **Procedural Federalism** (US/Swiss): Formal equality masking functional inequality in processes.  

  ---

  ### Stage 2: Testing Concepts Against Instances  
  | **Concept**          | **Instance 1 (Hospital Planning)**       | **Instance 2 (Joint Body)**               | **Instance 3 (Reversals)**                |  
  |----------------------|------------------------------------------|-------------------------------------------|-------------------------------------------|  
  | **Administrative Federalism** | **Fit**: Unit B’s reliance on copying/central models shows implementation incapacity. | **Strain**: Less about *administration* of laws, more about *influence* in lawmaking. | **Fit**: Units decline powers due to administrative burden. |  
  | **Regulatory Capacity Divergence** | **Perfect Fit**: 40-lawyer vs. 4-lawyer drafting capacity explains legislative asymmetry. | **Fit**: Inability to review impact assessments forces vote-trading. | **Fit**: Benchmarks require regulatory sophistication only some possess. |  
  | **Absorptive Capacity** | **Fit**: Unit B cannot "absorb" legislative autonomy without central scaffolding. | **Fit**: Delegations lack capacity to absorb technical info. | **Fit**: Opt-ins require absorptive capacity units lack. |  
  | **Joint Decision Trap** | **N/A** (Not about intergovernmental bargaining). | **Perfect Fit**: Weak units trade votes for transitional relief. | **Strain**: Not about veto players/status quo bias. |  
  | **Decentralization Paradox** | **Fit**: Central framework persists due to subnational incapacity. | **Partial Fit**: Recentralization via de facto delegation. | **Perfect Fit**: Powers "returned" are abandoned, recentralizing de facto. |  
  | **Procedural Federalism** | **Fit**: Identical rules hide unequal ability to initiate/defend laws. | **Fit**: Equal seats ≠ equal influence due to procedural complexity. | **Fit**: Opt-in procedures favor capacity-rich units. |  

  **Key Strain Points**:  
  - *Money isn’t the core issue* (your Unit B is small but not poor).  
  - *Formal powers are symmetric*, unlike asymmetric federalism (e.g., India’s special status states).  
  - Differs from "cooperative federalism" (e.g., US states administering federal laws) because no formal delegation occurs.  

  ---

  ### Stage 3: Synthesis and Conceptual Gap  
  #### **Is There an Established Concept?**  
  No single term captures this. **Regulatory Capacity Divergence** comes closest but is descriptive, not theoretical. **Procedural Federalism** partially fits but is US-centric and ignores administrative capacity.  

  #### **Coining a New Term: Phantom Asymmetry Federalism**  
  **Definition**: *A condition in formally symmetric multilevel systems where equal legal competences yield unequal autonomy due to persistent, structurally embedded gaps in subnational units’ ability to generate, defend, or leverage rules.*  

  **Boundary Cases**:  
  - **Included**: Swiss Canton A (40 lawyers) legislates independently vs. Canton B (4 lawyers) copying federal models despite identical constitutional powers.  
  - **Excluded**: Bavaria’s fiscal power under German *Finanzausgleich* (formal asymmetry) or US states administering EPA rules (cooperative federalism).  

  **What This Term Should NOT Be Used For**:  
  - Temporary capacity gaps remedied by training/funding.  
  - Intentionally asymmetric systems (e.g., Spain’s *foral* regions).  

  ---

  ### Addressing Your Specific Queries  
  #### **How It Differs From Nearby Concepts**  
  | **Concept**                | **Difference**                                                                 |  
  |----------------------------|--------------------------------------------------------------------------------|  
  | Unequal resources          | Your issue persists *after* fiscal equalization; about human/organizational capital, not money. |  
  | Formally differentiated status | Powers are *de jure* identical here (e.g., all German *Länder* have same hospital competence). |  
  | Subnational administration of central law | Here, units *hold* legislative power but cannot *exercise* it autonomously. |  
  | Joint decision bias        | Focuses on status quo inertia; your case shows *asymmetric influence* in dynamic decisions. |  
  | "Earned autonomy" schemes  | Benchmarks *intend* to differentiate; your asymmetry is *unintended* and subverts autonomy. |  

  #### **Is This a Defect in Allocation or Application?**  
  It’s a **flaw in the *operational premises* of allocation principles**:  
  - "Cannot be sufficiently achieved" (EU/Germany/Swiss) assumes uniform capacity to exercise competence.  
  - **Why remedies fail**:  
    - Fiscal transfers don’t build *administrative/legal expertise* (Unit B can’t "buy" seasoned lawyers overnight).  
    - Central capacity-building perpetuates dependence (e.g., model texts entrench Unit B’s passivity).  
    - Petition systems (e.g., to "earn" powers) favor units with existing capacity to navigate bureaucracy.  

  #### **Does This Extend Beyond Multilevel Systems?**  
  **Yes**: This is a subset of **principal-agent problems with heterogeneous agents**. Examples:  
  - UN treaties uniformly binding states with unequal enforcement capacity.  
  - Corporate subsidiaries with identical mandates but divergent compliance teams.  
  **Core dynamic**: Formal equality + operational inequality → de facto hierarchy.  

  ---

  ### Conclusion  
  **Phantom Asymmetry Federalism** names your phenomenon. It emerges when constitutions grant uniform powers but ignore:  
  - The **fixed costs of rule-generating capacity** (drafting, litigation readiness).  
  - The **cumulative advantage** of high-capacity units (e.g., Unit A’s laws become templates).  
  - How **procedural complexity** in shared bodies (e.g., impact assessments) becomes a filter for influence.  

  This is distinct from fiscal inequality or formal differentiation and explains why standard allocation principles (subsidiarity, necessity) fail: they police *whether* the center should act but not *how* symmetric powers can function amid asymmetric state capacity.
