  The user has a thoughtful friend who suggested a "precisification" - the idea that injustices are inherently unstable due to coercion or degrading narratives. The user wants this placed among alternatives rather than accepted outright. They also have a linguistic question about the word "bend" versus "rise" and how that changes the meaning. Most importantly, they want to know what evidence from within history could support or challenge each interpretation.

