  ### Session Design: Escalation Trap Exploration  
  This session uses multiple dollar auctions to create experiential learning about step-by-step rationality, structural traps, and psychological factors. The design avoids upfront explanations, forcing students to confront the tension between local rationality and global irrationality.  

  ---

  ### **Materials & Setup**  
  1. **Tokens & Payoffs**  
     - Each team (2 students/desk) starts with 100 tokens.  
     - Tokens convert to lottery tickets post-session (1 token = 1 ticket).  
     - Lottery: Two $25 vouchers drawn from all tickets (positive balances only). Negative balances reset to 0 (no penalty).  
     - *Why it works*: Stakes feel real but avoid resentment (losses capped at 0). Teams stay engaged across rounds.  

  2. **Room Setup**  
     - 11 two-person desks (22 students).  
     - Two "active desks" bid per round; others observe and predict.  
     - Prediction slips for observers.  

  3. **Auction Rules**  
     - Prize: 100 tokens for highest bidder.  
     - Minimum increment: 10 tokens (speeds up play).  
     - Winner pays last bid, gets prize. Runner-up pays last bid, gets nothing.  
     - Bids must be ≤ current token balance (no debt).  

  ---

  ### **Rounds & Rules**  
  *(Five 8-minute rounds; 40 minutes total)*  

  | Round | Type                          | Special Rules                                                                                                                                 | Observer Task                              |  
  |-------|-------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------|  
  | 1     | Open-Outcry (Baseline)        | None.                                                                                                                                         | Predict winning bid.                       |  
  | 2     | Open-Outcry (Replication)     | None. *Use new teams to confirm escalation pattern.*                                                                                          | Predict winning bid.                       |  
  | 3     | **Capped Auction**            | Max **4 bids total** (e.g., bids: 10→20→30→40). Prize = 100 tokens. *Backward induction should deter entry.*                                  | Predict if bidding starts.                 |  
  | 4     | **Relay Auction**             | When bid >100, the *partner who didn’t make prior bids* takes over. *Tests psychological vs. structural drivers.*                             | Predict if relay changes escalation.       |  
  | 5     | **Pre-Commitment Auction**    | Teams seal a "drop-out bid" (enforced by facilitator). *Tests if pre-commitment avoids the trap.*                                             | Predict winning bid and if pre-commit works.|  

  ---

  ### **Timeline (60 Minutes Play)**  
  - **0:00–0:05**: Setup  
    - Assign teams, distribute tokens. Explain only:  
      > *"Teams of two. Token balances start at 100. Prize is 100 tokens per auction. Bid in increments of 10. Winner pays bid and takes prize; runner-up pays bid and gets nothing. Observers predict winning bid before each round."*  
    - **Do NOT explain sunk costs, escalation, or rationality.**  

  - **Rounds 1–2 (0:05–0:20)**: Open-Outcry Baseline  
    - 5 min/round: Observer predictions → Auction → Update tokens.  
    - *Expected outcome*: Bidding sails past 100 (e.g., stops at 130–150).  

  - **Round 3 (0:20–0:28)**: Capped Auction  
    - Announce: *"This auction ends after 4 bids max. First bid ≥10, each bid ≥10 higher than last."*  
    - *Expected outcome*: No one bids (backward induction: bidding leads to loss). If teams bid, note the deviation.  

  - **Round 4 (0:28–0:36)**: Relay Auction  
    - Announce: *"When bid exceeds 100, the partner who hasn’t bid yet takes over."*  
    - Teams choose starting partner.  
    - *Expected outcome*: Escalation continues (structural trap dominates psychology).  

  - **Round 5 (0:36–0:44)**: Pre-Commitment  
    - Teams seal "drop-out bid" (e.g., "We drop at 110"). Facilitator enforces.  
    - *Expected outcome*: Most set drop-out >100 (e.g., 120–150), not at 100.  

  - **Wrap-Up (0:44–1:00)**: Token tally, reset for debrief.  

  ---

  ### **Debrief (30 Minutes)**  
  **Goal:** Connect gameplay to core concepts using observed moments. Introduce terms only now.  

  | **Time** | **Debrief Step**                          | **Link to Game Moments**                                                                 | **Key Questions/Insights**                                                                 |  
  |----------|-------------------------------------------|------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|  
  | 0:00–0:10 | **Observer Predictions vs. Reality**      | Show prediction slips vs. actual stopping bids (Rounds 1–2).                             | *"Why did observers predict lower bids? What did bidders see that you didn’t?"* → Highlights information asymmetry and myopia. |  
  | 0:10–0:15 | **Step-by-Step Rationality**              | Use Round 1: Ask a bidder, *"At 110 tokens, why bid 120?"*                               | *"Was raising irrational locally? What were you avoiding?* → **Sunk cost fallacy** named here: Distinguish backward-looking (sunk costs) vs. forward-looking (avoiding runner-up loss). |  
  | 0:15–0:20 | **Structural Trap vs. Psychology**        | Round 4 (Relay): *"Did new partners escalate? Why?"*                                     | *"If they escalated without prior involvement, what does that imply?"* → Structural forces (game theory) outweigh psychology (self-justification). |  
  | 0:20–0:25 | **Pre-Commitment & Backward Induction**   | Round 5: Compare sealed drop-out bids to actual behavior. Round 3: Why did no one bid?   | *"Why set drop-out at 120, not 100? Why did the cap change behavior?"* → **Escalation of commitment** named here: Pre-commitment fails if set too high. Capped auctions allow backward induction; open-ended ones lack a start point. |  
  | 0:25–0:30 | **Real-World Limits**                     | Acknowledge the game’s missing piece.                                                    | *"What can’t tokens capture?"* → **Emotional stakes** (e.g., pride, face-saving). Discuss how real-world escalation blends structure and psychology. |  

  ---

  ### **Predictable Problems & Fixes**  
  1. **No escalation in early rounds**:  
     - *Likelihood*: Low (past runs show escalation).  
     - *Fix*: If bids stall below 100, whisper to teams: *"Remember, the runner-up pays their bid too."* Nudges toward the trap.  

  2. **Relay partner folds immediately**:  
     - *Likelihood*: Medium (30% of teams).  
     - *Fix*: In debrief, contrast teams where relay worked vs. didn’t. Ask: *"What made the new partner fold? Did they feel responsible?"*  

  3. **Capped auction gets bids**:  
     - *Likelihood*: High (backward induction is hard).  
     - *Fix*: Use it! *"You bid despite the cap—why?"* Discuss bounded rationality vs. theory.  

  4. **Negative tokens**:  
     - *Impossible* (bids capped at balance).  

  ---

  ### **What the Game Can’t Capture**  
  **Emotional Stakes**: The game abstracts away shame, pride, and responsibility. Tokens lack the visceral weight of real losses (e.g., career repercussions). In debrief (last 10 minutes), bridge this gap:  
  - *Example*: "In Vietnam, policymakers escalated partly due to *loss of credibility*, not just sunk costs. The trap is structural, but psychology fuels it."  
  - *Activity*: Ask students for real-world parallels (business, relationships) where emotions amplified the trap.  

  ---

  ### **Why This Works**  
  - **Experiential contrast**: Open/capped/relay/pre-commit rounds force cognitive dissonance.  
  - **Prediction gap**: Observers vs. bidders highlights rationality’s limits.  
  - **Terminology last**: "Sunk cost," "escalation" emerge from lived experience, not lecture.  
  - **Safe stakes**: Tokens + lottery incentivize action without resentment.  

  **Final Tip**: Start the first auction abruptly—no strategy talk. Let the trap unfold naturally.
