  2. Show the predictions from the observers for each round. Highlight the gap between the predicted stopping point and what actually happened. Ask observers: "Why did you predict that? What did you see that the bidders didn't?"

  3. Focus on the step-by-step reasoning. Ask a team that escalated: "At the moment when the bid was 95 and you bid 100, what were you thinking?" Then ask: "When the bid was 105 and you bid 110, what were you thinking?"

  4. Contrast the open auction and the capped auction. 
     - "In the capped auction, we set a maximum of 4 bids. What happened? Did anyone bid? Why or why not?"
     - Explain backward induction for the capped auction: 
          - At the 4th bid: if it gets there, the bid would be 40. The bidder would win and get 60 (if they are the one bidding 40) or lose 30 (if they are the one who bid 30). Actually, we have to be careful. 
          - Use the example we worked out: at bid4, the bidder (if forced to bid) would bid 40 and win. But at bid3, the bidder would pass because if they bid, they become the runner-up and lose 30. Then at bid2, the bidder would bid 20 and win. But then at bid1, the first bidder would bid 10 and then become the runner-up and lose 10. So they shouldn't bid. 
     - But in the open auction, there is no cap, so backward induction doesn't have a starting point.

  5. Discuss the relay auction. 
     - "In the relay auction, when the bid went above 100, the partner who hadn't been bidding took over. Did that change the escalation? Why or why not?"
     - "If escalation continued, what does that say about the role of sunk costs and personal commitment?"

  6. Discuss the pre-commitment round.
     - "Did teams set their maximum bid below 100? Or above? Why?"
     - "Did the pre-commitment help avoid escalation? Why or why not?"

  7. Connect to the concepts:
     - "What is the sunk cost fallacy? Is that what happened here?"
     - "In the moment of bidding, the decision to bid again might seem rational: you are comparing the small extra cost to the chance of winning and avoiding a big loss. But the big loss is already sunk. However, in this game, the loss is not sunk until you drop out. The runner-up loss is only realized when you drop out. So the decision to bid again is to avoid that loss. Is that irrational?"
     - "The error might be in entering at all. Once you are in, the bidding war might be rational step by step. So the trap is structural."

  8. Finally, note what the game cannot capture: 
     - In real life, the escalation of commitment often involves psychological factors like ego, loss of face, and responsibility. The game abstracts away some of that, especially in the relay auction where the new bidder has no personal history. But we might still see escalation, indicating the structural trap is powerful.

  What might go wrong:

  1. No one escalates in the first round. 
     - Solution: If the bidding stops below 100, ask the teams why they dropped out so early. Then in the next round, encourage them to bid more aggressively by reminding them that the prize is 100 and they are far from it. Or increase the stakes by having a larger prize? But we can't change mid-session. Alternatively, use a smaller increment? We used 5. Maybe make the minimum increment 1 token? But that might take longer. 

  2. In the relay auction, the new partner folds immediately. 
     - That's okay. We can discuss why: they had no sunk cost. But then if they fold, the team that was in the lead wins, and the new partner only made one bid? 

  3. In the capped auction, teams bid anyway. 
     - That's interesting. It shows bounded rationality. We can discuss why backward induction is hard in practice.

  4. Token balances become negative or zero. 
     - We don't allow negative balances because they can't bid more than they have. If a team has 0 tokens, they cannot bid. 

  5. One team dominates and always wins. 
     - We rotate teams so every team plays only once or twice. 

  6. Time runs over for an auction. 
     - We must be strict: after 5 minutes, if the auction is not over, pause and declare the current high bidder the winner and the other the runner-up.

  Frank note: 
  The game cannot reproduce the full psychological weight of personal responsibility and loss of face in real-world escalation. In the relay auction, we try to separate it, but the new partner might still feel responsible for the team's outcome. Also, the tokens are not real money, so the pain of loss is abstract. Therefore, in the debrief, we must emphasize that in real situations, psychological factors amplify the structural trap. The last 10 minutes of the debrief should be used to discuss real-world examples (like the Vietnam War, or business projects) and how both structure and psychology interact.

  Materials:
  - Tokens: we can use a spreadsheet to track token balances per team.
  - Prediction slips: small papers for predictions.
  - A board to record the bids during the auction.
  - Envelopes for the pre-commitment round.

  Timeline Recap:

  - 0:00-0:05: Setup and explanation of the first auction.
  - 0:05-0:10: Round 1 (standard).
  - 0:10-0:15: Round 2 (standard).
  - 0:15-0:20: Round 3 (capped).
  - 0:20-0:30: Round 4 (relay).
  - 0:30-0:40: Round 5 (pre-commitment).
  - 0:40-1:00: Token tally and break.
  - 1:00-1:30: Debrief.

  We have one team not playing? We can have them play in a sixth round during the 0:40-0:45 slot? But then the token tally might be delayed. 

  Alternatively, we can have the 11th team as the facilitator assistant and they get a fixed 50 tokens. 

  This design meets your requirements and should create the experiences you want.
