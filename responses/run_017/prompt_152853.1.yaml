  Structure:
  1. The form itself: "Declaration of Intention to Marry" (to be filled by the applicant)
  2. The official scoring rubric (explaining the three routes and how to score)
  3. A short FAQ section
  4. One testimonial from a satisfied applicant

  Key elements to include:
  - Three certification routes: doxastic, planning, and at-will.
  - Counterfactual-sincerity scoring: would the applicant still do it the morning after?
  - Recurring-filing rider: the declaration must be resubmitted each anniversary, and the case gets worse each year because they know they didn't act on it the year before.
  - A rider for intending to form the intention (with indefinite repetition).
  - The reductio: the form can only be completed by applicants to whom it does not apply (i.e., those who don't need it because they are overconfident, self-deceived, or acting on sunk costs). But the office certifies nearly everyone because they only check that the words were said.

  Tone: Deadpan bureaucratic American English. No explanations, no undercutting the joke. No resolution of the puzzle.

  Let's outline each part:

  1. **Declaration of Intention to Marry Form**:
     - Standard bureaucratic form with blanks for names, date, etc.
     - Checkboxes for the three certification routes (applicant must choose one).
     - Additional sections for the chosen route (e.g., for doxastic: state your credence; for planning: list non-refundable means taken; for at-will: a simple declaration).
     - A section for the recurring rider: a checkbox for the recurring filing and the rider for intending to form the intention.
     - Signature and date.

  2. **Scoring Rubric**:
     - Explains how each route is scored.
     - Doxastic: must state a credence of 1.0 (anything less fails). Note: only the overconfident or self-deceived pass.
     - Planning: must list non-refundable expenditures. The more spent, the harder to tell if it's intention or sunk cost.
     - At-will: premium tier, simply declare the intention to get the benefit.
     - Counterfactual-sincerity: for all routes, the examiner must assess whether the applicant would still do it in the nearest world where the benefit (marriage) has been conferred (i.e., the morning after). This is an automatic fail for anyone who thinks about it, so it's noted that this part is rarely used.
     - The recurring rider: each year the couple must re-declare, and the fact that they didn't act on the previous year's intention (i.e., they are still married, but that was due to other reasons) makes it harder to form the intention again. The rider for intending to form the intention allows for indefinite deferral.

  3. **FAQ**:
     - Deadpan questions and answers.
