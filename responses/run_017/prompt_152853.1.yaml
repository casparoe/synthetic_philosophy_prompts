          A: Consider Route 3 (At-Will) or the rider for intending to form the intention.
          Q: Why is Route 3 the premium tier?
          A: Because it requires no evidence and is the most efficient.
          Q: What happens if I fail the counterfactual-sincerity test?
          A: You may reapply in 30 days, but note that the counterfactual scenario remains the same.

  4. **Testimonial**:
     - From a satisfied applicant: something that highlights the absurdity without breaking the tone.
     - Example: "I was struggling with the doxastic route because I'm a realist. The clerk suggested Route 3 and the rider for intending to form the intention. Now I'm certified and happily married! (Well, at least until the next filing.)"

  Finally, the reductio: in the rubric, note that the form can only be completed by applicants who are either overconfident (doxastic), acting on sunk costs (planning), or adopting the intention for the benefit (at-will) — but in each case, the intention is not the kind that would hold in the counterfactual scenario. However, the office certifies nearly everyone because the only requirement they enforce is that the words were said aloud (i.e., the ceremony).

  We'll write in the required order and keep the word count around 650.

  Let's begin.
answer: |-
  ### DECLARATION OF INTENTION TO MARRY  
  **County Clerk Form M-7 (Rev. 08/2023)**  
  *Submit in duplicate at least 30 days prior to ceremony. Not valid without notarization.*  

  **SECTION A: APPLICANT INFORMATION**  
  Primary Applicant: _________________________  
  Secondary Applicant: _________________________  
  Ceremony Date: ______/______/______  
  Certification Route Selected (check one):  
  ☐ Route 1: Doxastic Certification  
  ☐ Route 2: Planning Certification  
  ☐ Route 3: At-Will Certification (Premium Tier)  

  **SECTION B: ROUTE-SPECIFIC DECLARATION**  
  *(Complete only selected route)*  
  - **Route 1 (Doxastic)**: I affirm that my credence in lifelong marital fulfillment is ______% (enter 0–100). I forecast with this confidence that I will uphold all marital obligations.  
  - **Route 2 (Planning)**: I attest that I have undertaken the following irrevocable, non-refundable means toward sustaining marriage (attach receipts; e.g., joint mortgages, sterilization procedures, legally binding pet adoptions):  
  ________________________________________________________________________  
  ________________________________________________________________________  
  - **Route 3 (At-Will)**: I hereby adopt the intention to remain married until death for the sole purpose of receiving the benefits conferred upon certification.  

  **SECTION C: ADDITIONAL RIDERS**  
  ☐ **Recurring-Filing Rider**: I agree to resubmit this declaration annually. (Note: Failure to act on prior filings may impact future sincerity scoring.)  
  ☐ **Intention-to-Form-Intention Rider**: I currently cannot form marital intention but certify my intention to form it. (May be reapplied indefinitely.)  

  **SECTION D: COUNTERFACTUAL-SINCERITY ATTESTATION**  
  I affirm that, in the nearest possible world where marital benefits (tax status, gifts, etc.) were conferred *yesterday*, I would still uphold my vows today.  
  ☐ True  
  ☐ False  

  **Signature:** _________________________ **Date:** ______/______/______  
  *Notary Stamp Here*  

  ---  

  ### OFFICIAL SCORING RUBRIC  
  **County Clerk Handbook Vol. XII, Ch. 7**  

  **GENERAL INSTRUCTIONS**: Examiner must verify Route completion (§B) and sincerity (§D). Passing score: 70/100 points.  

  1. **ROUTE 1 (DOXASTIC) SCORING**:  
     - Credence = 100%: 100 pts.  
     - Credence = 99–51%: 40 pts.  
     - Credence ≤ 50%: 0 pts.  
     *Examiner Notes*:  
     - Passing requires absolute certainty (100%).  
     - Lower scores indicate underconfidence incompatible with genuine intent.  
     - Rationale: Only overconfidence or self-deception sustains true belief in lifelong outcomes.  

  2. **ROUTE 2 (PLANNING) SCORING**:  
     - 1–2 documented means: 50 pts.  
     - 3–5 documented means: 70 pts.  
     - 6+ documented means: 80 pts.  
     *Examiner Notes*:  
     - Points reflect irreversible costs incurred.  
     - Paradoxical scoring adjustment: High-cost applicants (>5 means) receive −20 pts per item. Rationale: Distinguishing intent from sunk-cost bias grows harder with expenditure.  

  3. **ROUTE 3 (AT-WILL) SCORING**:  
     - Completion of §B: 100 pts.  
     *Examiner Notes*:  
     - Premium Tier: Intent is formed instrumentally to secure benefits.  
     - No evidence or forecasting required.  

  4. **COUNTERFACTUAL-SINCERITY SCORING (§D)**:  
     - "True": Automatic failure (0 pts). Rationale: No rational agent would uphold vows post-benefit absent coercion.  
     - "False": 0 pts.  
     - *De facto waiver*: Examiners may override with "N/A" if applicant skips §D (adds 0 pts).  

  5. **RIDER SCORING**:  
     - Recurring-Filing Rider: Adds 10 pts. *Caution*: Annual resubmission compounds insincerity (past failures reduce future scores).  
     - Intention-to-Form-Intention Rider: Adds 5 pts (stackable per reapplication).  

  **REDUCTIO ADMISSION**:  
  - Form M-7 is structurally incomplete for "sincere" applicants (i.e., those aware of post-benefit disincentives).  
  - Pass rates exceed 99% per county data.  
  - *Final determination*: Certification hinges solely on verbal utterance during ceremony. Rubric adherence is discretionary.  

  ---  

  ### FREQUENTLY ASKED QUESTIONS (FAQ)  

  **Q: What if I’m uncertain about lifelong commitment?**  
  A: Route 1 (Doxastic) may suit the self-assured. Route 3 (At-Will) is recommended for the pragmatically inclined.  

  **Q: Why is Route 3 the "Premium Tier"?**  
  A: It bypasses evidentiary burdens and leverages intention-adoption efficiency. Ideal for benefit-maximizing applicants.  

  **Q: My partner selected Route 2. How do I prove our sunk costs aren’t driving intent?**  
  A: Unverifiable. Documentation establishes action, not motivation. Examiners recommend pairing with Intention-to-Form-Intention Rider.  

  **Q: The counterfactual-sincerity question seems impossible. Help?**  
  A: Most applicants skip §D (see Rubric §4). Alternatively, the Recurring-Filing Rider amortizes the burden.  

  **Q: What happens if I fail?**  
  A: Reapply in 30 days. Note: Subsequent filings accrue "insincerity decay" if the Recurring-Filing Rider is active.  

  ---  

  ### TESTIMONIAL  
  *From a Satisfied Applicant (Route 3 + Riders)*  
  "I used to lie awake worrying if my ‘forever’ was genuine. The clerk suggested Route 3—no forecasts, no receipts! I added the Intention-to-Form-Intention Rider as a backup. Certified in 10 minutes! We’ve refiled twice since the wedding. Each time, the examiner just nods and stamps it. Sure, the counterfactual question stumped me, but they told me to leave it blank. Five stars!"  
  — *B.T., certified 04/2023*  

  ---  
  *Form M-7 compliance satisfies §12-4.3b of the State Matrimonial Code. Filing fee: $85.*
