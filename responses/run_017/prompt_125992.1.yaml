  First, I need to map Hart's and Fuller's positions onto each of the four questions for the different actors (guards, commanders, courts). For Hart, validity is separate from morality - the border law was valid positive law. Fuller would focus on the law's defects in promulgation and congruence. 

  For the validity question: Hart would say the norm was valid law in the GDR system, while Fuller would argue it lost legal character due to failures in internal morality like secret orders contradicting published law. 

  On excuses: Hart sees legal authorization as a complete defense, Fuller views it as compromised by the system's illegitimacy. The adjudication question reveals Hart's preference for legislative solutions versus Fuller's judicial moral evaluation. Transmission matters because reunification framed this as one legal system, making Radbruch's revival plausible.

  Second, I'll examine which case features each theory explains. Fuller explains the courts' interpretive efforts to "discover" invalidity and the liability gap between shooters and commanders. Hart explains the need for retroactive legislation and the literature's criticism. Both struggle with graded sentences - that's more about adjudicative pragmatism.

  Third, the core challenge: does this vindicate Hart, Fuller, or neither? I think it shows Fuller's framework was operationally necessary for the courts despite Hart's theoretical soundness. The secret orders violated promulgation and congruence - classic internal morality failures. Yet Hart was right that substantively evil regimes can have formally valid laws. The courts' interpretive contortions prove Fuller's morality is intrinsic to law's function, not just efficacy.

  The user's decomposition brilliantly exposes how the debate conflates distinct issues. While Hart wins on separating law and morality conceptually, Fuller wins on adjudicative necessity here. The transmission fiction made Radbruch viable, but the real work was in exposing the regime's betrayal of its own rules - which is Fuller's central insight.
answer: |-
  Here is a case analysis structured by your decomposition and focused on the Hart-Fuller debate, examining the *Mauerschützenprozesse*:

  **I. Disciplined Mapping: Hart vs. Fuller on the Four Questions**

  1.  **Validity Question (Was the norm authorising shooting "law" in the GDR?):**
      *   **Hart:** Would assert the norm *was* valid positive law within the GDR system. It met the systemic rule of recognition (enacted by the GDR legislature/politburo, published, applied by officials). The secret orders/practices reinforcing it were also likely valid under the GDR's hierarchical command structure and political reality. The norm's substantive injustice or conflict with GDR constitutional text is irrelevant to its legal validity *at the time*.
      *   **Fuller:** Would argue the norm likely *lacked* legal character due to failures of the internal morality of law. Key failures:
          *   **Promulgation:** Secret orders/practices overriding or contradicting the published Border Law violated the requirement that citizens know the rules governing them. Guards might know the *practice*, but citizens fleeing certainly did not.
          *   **Congruence:** The vast gulf between the published law (implying proportionality) and the standing orders/practices ("prevent escape at any cost") meant the rules officials *actually* followed were radically different from those announced. This deliberate betrayal destroyed congruence.
          *   **Generality/Clarity (Potential):** Secret, unwritten orders inherently lack generality and clarity accessible to the governed.
      *   *Facing the Actors:*
          *   *Guards/Commanders:* Believed they acted under valid legal orders. Hart confirms this belief was technically correct *in the GDR system*. Fuller suggests they were acting under a façade masking lawlessness.
          *   *Courts:* Needed to determine the legal status of the norm *ex post*. Hart would say they must concede its past validity. Fuller would permit them to declare it non-law due to internal defects.

  2.  **Excuse Question (Does acting under a valid legal authorisation defeat liability?):**
      *   **Hart:** A valid legal authorization *is* a complete justification/defense against criminal liability. Punishing someone for acting under what was, at the time, valid law is the essence of retroactivity. The "superior orders" defense, while not absolute, carries significant weight here due to the norm's systemic validity.
      *   **Fuller:** Acting under a norm that fails the internal morality of law (especially regarding congruence and promulgation) cannot provide a genuine legal excuse. The actor participates in a system that has betrayed legality itself. Reliance on such a "law" is reliance on a sham, undermining the moral basis for the excuse.
      *   *Facing the Actors:*
          *   *Guards/Commanders:* Raised the defense: "I was obeying the law." Hart validates this defense as conceptually sound. Fuller undermines it, suggesting obedience was to an illegitimate directive masquerading as law.
          *   *Courts:* Had to decide if this defense barred conviction. Hart demands it should, requiring explicit retroactive legislation to overcome it. Fuller allows courts to reject the defense based on the norm's illegitimacy.

  3.  **Adjudicative Question (What should a successor court do about predecessor acts?):**
      *   **Hart:** The successor court must acknowledge the prior validity of the GDR law. Punishing acts legal under the predecessor regime *requires* retroactive criminal legislation enacted by the new sovereign (the reunified German parliament). Judicial retroactive punishment, disguised as discovering "it was never law," is dishonest and violates the rule of law principle against retroactivity. The court's role is to apply the *new* law (including any valid retroactive statute).
      *   **Fuller:** The successor court can and should evaluate the predecessor norm against the principles of the internal morality of law. A norm fundamentally violating these principles (like the GDR border regime) never attained the status of law. Punishing those who applied it is therefore *not* retroactive application of new law, but rather applying enduring principles of legality to deny a false defense ("I was following the law"). The court acts as a guardian of legality across regimes.
      *   *Facing the Courts:* The German courts (BGH, BVerfG) effectively adopted a Fullerian approach disguised as interpretation (Radbruch formula, human-rights-friendly reading) to avoid the stark retroactivity Hart insisted was necessary but politically/practically difficult.

  4.  **Transmission Question (Impact of Absorption as Continuation):**
      *   **Hart:** The "continuation" narrative makes retroactive legislation *easier* politically but doesn't change the jurisprudential need for it. The GDR's legal system ceased to exist; the FRG's system replaced it. Valid GDR laws might be incorporated *prospectively* by the FRG, but applying *new* criminal liability to *past* acts under GDR law still requires explicit retroactive legislation.
      *   **Fuller:** The "continuation" narrative strengthens the argument for applying the internal morality of law consistently across time. If there is one German legal order (even with an illegitimate interlude), then the betrayal of legality by the GDR regime can be judged by the successor courts as a failure *within* that ongoing order. This facilitates using Radbruch and interpreting GDR law "against itself" (using its own constitution) as part of restoring congruence to the legal order as a whole.
      *   *Impact on the Case:* The transmission doctrine was crucial for the courts. It allowed them to frame their task not as conquering judges imposing new morality, but as German courts restoring the *true* rule of law and constitutional order disrupted by the GDR, making Fullerian/Radbruchian reasoning politically and legally palatable.

  **II. Explaining Case Features: Hart vs. Fuller**

  *   **Graded Sentences & Triggers vs. Commanders:**
      *   **Fuller Explains:** The internal morality framework focuses on the *role* in creating/maintaining the defective legal system. Commanders/politicians authored secret orders and fostered the congruence gap (deliberate betrayal), directly violating promulgation and congruence – core failures. Guards were often lower-level participants relying (misguidedly, per Fuller) on the system's apparent validity. Fuller's emphasis on the *source* of the defect explains liability proportional to responsibility for the system's illegality.
      *   **Hart is Silent:** His focus is on the norm's systemic validity and the defense it provides. He offers no inherent framework for gradations based on role *within* the system applying the valid-but-immoral law. Graded outcomes stem from adjudicative/policy choices about culpability *despite* the legal authorization defense.

  *   **Insistence on Individual Guilt:**
      *   **Both Explain (Differently):** Both reject purely systemic guilt. Hart: Punishment requires individual violation of a valid criminal norm enacted *ex post*. Fuller: Individual actors must be shown to have applied or enforced norms lacking legal character (or knowingly participated in the betrayal of legality). The "individual guilt" requirement is a constraint of criminal law itself, shared by both.

  *   **Courts' Need to Present Invalidity as "Discovered":**
      *   **Fuller Explains:** This is central to Fuller's position. Courts aren't *making* new law retroactively; they are recognizing that the norm *never was* law due to its internal defects. The Radbruch formula ("intolerable injustice," "deliberate betrayal of equality") operationalizes this discovery within a Fullerian framework.
      *   **Hart Rejects:** Hart sees this as a fiction masking retroactive judicial law-making, precisely what he warned against. The courts are *creating* the legal conclusion of invalidity *ex post*.

  *   **Reasoning as Interpretation vs. Invalidation:**
      *   **Fuller Explains:** The "human-rights-friendly reading" using the GDR constitution is a classic Fullerian move. It attempts to restore *congruence* between the higher constitutional principles (assumed to be part of the GDR's own professed legality) and the specific Border Law application. Only when this interpretive rescue fails does Radbruchian invalidation occur. Interpretation is the first line of defense against illegality.
      *   **Hart Sees as Irrelevant/Dishonest:** For Hart, the only relevant question is whether the norm was valid under the GDR's rule of recognition. Interpretation cannot change the past validity of a clear, albeit evil, law. This interpretive exercise is an attempt to avoid the retroactivity problem Hart insists must be confronted head-on legislatively.

  *   **German Legal Literature Criticism:** Largely aligns with **Hart's** concern about retroactivity disguised as interpretation/invalidation. Critics saw the courts as overstepping, creating liability where none existed before under positive law.

  **III. Direction & Vindication: Hart, Fuller, or Neither?**

  The episode **ultimately vindicates Fuller's framework as adjudicatively necessary and conceptually illuminating, while simultaneously confirming Hart's core challenge about the separability thesis.**

  1.  **Why Fuller is Vindicated (Operationally):**
      *   **Internal Morality Explains the Defect:** The case perfectly illustrates Fuller's thesis. The GDR border regime's core illegality lay not *just* in shooting people, but in the *way* it governed: secret orders contradicting public law destroyed promulgation and congruence. This *was* a failure of the internal morality of law, directly relevant to the norm's claim to be "law" justifying action.
      *   **Adjudicative Tool Kit:** The courts *needed* Fuller's concepts. The interpretive strategy (using the GDR constitution) directly addressed congruence. The Radbruch formula addressed the deliberate betrayal (promulgation/congruence gap). The transmission doctrine allowed this to feel like restoring legality, not imposing new law. Fuller provided the jurisprudential language and tools to achieve the result without (overt) retroactive legislation. Graded liability flows naturally from analyzing *who* corrupted the legal system.
      *   **"Discovery" vs. "Creation":** While arguably fictional, the narrative of "discovering" the norm's invalidity was essential for legitimacy within the German constitutional order and the fiction of continuity. Fuller's framework makes this narrative plausible.

  2.  **Why Hart is Vindicated (Conceptually & Critically):**
      *   **The Validity Concession:** Hart was right that the courts *did not* and *could not* honestly concede the norm's validity under the GDR system. They had to invalidate it *ex post* to convict. This was retroactivity in substance, disguised by Fullerian/Radbruchian natural law reasoning. The critical legal literature correctly identified this Hartian concern.
      *   **The Standing Challenge Met:** The case *confirms* Hart's challenge: The GDR *did* satisfy many internal moralities for vast swathes of its law (generality, clarity, prospectivity, stability for mundane laws like traffic codes or contract rules). Its legal system functioned *as a system* for many purposes. Yet, substantively, it was abominable regarding human rights and political freedom. This proves that satisfying Fuller's desiderata does *not* guarantee substantive justice. A wicked regime *can* have formally functional, even "internally moral" (in many respects), positive law.

  3.  **The Inertness and the Answer:**
      *   **Adjudicative Inertness?** Yes, the *ultimate conviction* could arguably have been reached via Hart's preferred route: explicit retroactive legislation declaring the shootings criminal despite GDR law. The jurisprudential debate didn't *determine* the outcome (punishment), but it profoundly shaped *how* it was achieved and justified.
      *   **Neither's Theory Fully Contemplated This:** Neither Hart nor Fuller deeply analyzed the complexities of state succession, absorption, and the fiction of legal continuity, which was crucial here. The transmission question was decisive in making Fullerian reasoning feasible.
      *   **The Verdict:** **Fuller wins the adjudicative battle, Hart wins the conceptual war.** The courts *had* to use Fullerian reasoning (interpretation leading to invalidation based on internal morality defects) to achieve the politically and legally required result within the framework of reunification and the rule of law ideal they were restoring. However, Hart's core insight remains: the GDR Border Law *was* positive law within its system, and convicting its agents required retroactive invalidation/punishment, proving law and morality are separable concepts. Fuller's internal morality, while crucial for diagnosing the *specific type of injustice* inherent in the regime's *legality*, is ultimately a morality *of* efficacy aimed at making law function *as law* for guiding behavior – it does not guarantee, and the GDR proves it can coexist with, substantive evil.

  **Consequences for Fuller's Internal Morality:**

  The case shows that Fuller's internal morality is indeed a **morality of efficacy aimed at the functional existence of law**, not a guarantee of substantive justice. A regime *can* be substantively abominable while scoring reasonably well on generality, clarity, prospectivity, and stability for much of its ordinary law (the GDR did). However, **the case also shows that *systematic* and *deliberate* violations of *specific* internal moralities – particularly promulgation and congruence – are not just inefficacious but can become tools of terror and oppression, destroying law's very function for those targeted (escapees). When congruence and promulgation are weaponized to create a façade of legality masking arbitrary violence (secret orders vs. public law), this *is* a profound moral failure *specific to law* and its claim to authority. It betrays the reciprocity Fuller saw as foundational. Therefore, while Hart is correct that the internal morality doesn't guarantee substantive good, its *radical violation*, especially regarding promulgation and congruence, creates a distinct form of legal evil that Fuller's framework uniquely captures and which was central to the courts' reasoning in the *Mauerschützenprozesse*. It becomes a necessary, though not sufficient, component of the full moral evaluation of a legal system.
