  First, the user wants clarity on interpersonal comparability. Since their payoffs are in common units like dollars, scale-invariance might not be necessary. I should explain why it’s traditionally emphasized but why dropping it makes sense here. Without it, rules like maximizing total or equal gain splits become viable, which could be more practical in their scenario.

  Next, the user lists several potential requirements. I need to assess which are genuine for their case. Insensitivity to unattainable ideals is crucial because noisy estimates might include unrealistic options. This isn’t just IIA—it directly challenges KS’s reliance on ideal points. Carve-up invariance and no gain from splintering are about how issues are structured, which matters in contracts to prevent manipulation. Robustness to estimation error is key here; Pareto efficiency might need relaxation since exact frontiers aren’t known. Lumpiness requires handling indivisible goods without forcing randomization that could be unfair.

  The user mentions the monotonicity vs IIA conflict. Highlighting the Nash vs KS trade-off here with a simple example will show the impossibility. For instance, adding an unattainable point moves KS but not Nash, illustrating the tension.

  For the scorecard, Nash wins on IIA and robustness but fails monotonicity. KS is the opposite. Maximizing total needs comparability and handles lumpiness but ignores outside options. Equal splits are simple but may not be efficient. 

  I should separate settled results (like Nash’s IIA) from contested areas (monotonicity vs IIA). Flagging where assumptions might need checking, like robustness theorems, is important. The user needs to avoid presenting one camp’s view as consensus, so clearly distinguishing these points is essential.

  Finally, emphasizing robustness and practicality over exact efficiency aligns with the arbitration context. The user’s deeper need is a defensible, applicable rule that handles real-world imperfections, not just theoretical elegance. Making sure the recommendations prioritize stability under uncertainty will address their core concern.
answer: |-
  Below is a structured breakdown of desiderata for a two-person bargaining rule in your specified context (contract default with noisy arbitration), along with clarifications, trade-offs, and a comparative scorecard. I’ll avoid citations and focus on conceptual justifications, flagging contentious points and settled properties.  

  ---

  ### **Core Desiderata for the Arbitration Context**  
  *(Non-negotiable unless noted)*  

  1. **Robustness to Estimation Error**  
     - **Why essential**: The arbitrator uses noisy estimates of the feasible set \( S \) and disagreement point \( d \). A rule that jumps wildly under small input changes risks arbitrary or exploitable outcomes.  
     - **Tension with Pareto efficiency**: Insisting on *exact* efficiency is unrealistic when \( S \) is imperfectly known. A rule should tolerate \( \epsilon \)-suboptimality (i.e., outcomes within \( \epsilon \) of the frontier) to avoid overfitting to noise.  
     - **Non-negotiable**: Yes. Without this, the rule fails its primary purpose.  

  2. **Carve-Up Invariance (Issue Independence)**  
     - **Why essential**: Real-world bargaining often involves multiple issues (e.g., salary, hours, benefits). Repackaging these issues shouldn’t alter the split. Prevents gaming by redefining "issues" in the contract.  
     - **Relation to axioms**: Distinct from IIA/monotonicity. Closer to *path-independence* or *additivity*.  
     - **Non-negotiable**: Yes for default contracts.  

  3. **No Gain from Splintering**  
     - **Why essential**: Prevents parties from fragmenting into sub-groups to extract more surplus (e.g., one "side" splitting into two agents to trigger symmetry).  
     - **Relation to axioms**: Implies *symmetry* if identities are irrelevant, but stricter (handles strategic fragmentation).  
     - **Non-negotiable**: Yes.  

  4. **Lumpiness Compatibility**  
     - **Why essential**: Surpluses are often indivisible (e.g., one job slot). The rule must specify deterministic splits without convexity.  
     - **Risk allocation**: If randomization *must* be used (e.g., for existence), residual risk should fall on the party best able to bear it (often the stronger outside option).  
     - **Non-negotiable**: Yes (domain requirement).  

  5. **Insensitivity to Unattainable Ideals**  
     - **Why essential**: Noisy estimates may include infeasible "ideal" points. A rule sensitive to these will overreact to estimation error (e.g., KS shifts if max possible payoff changes, even if irrelevant).  
     - **Relation to IIA**: Stronger than IIA. IIA drops *feasible* alternatives; this drops *infeasible* ones. Sinks KS.  
     - **Non-negotiable**: Yes.  

  6. **Monotonicity**  
     - **Why preferred**: If \( S \) expands (more surplus available), no party should get less. Aligns with fairness intuitions.  
     - **Tension**: Conflicts with IIA (see impossibility below).  
     - **Non-negotiable?**: **No** – a preference (monotonicity camp) vs. IIA camp.  

  7. **Independence of Irrelevant Alternatives (IIA)**  
     - **Why preferred**: If "irrelevant" options are removed from \( S \), the outcome shouldn’t change. Critical for stability under noisy estimation (avoids outliers affecting the split).  
     - **Tension**: Conflicts with monotonicity (see impossibility).  
     - **Non-negotiable?**: **No** – a preference (IIA camp) vs. monotonicity camp.  

  ---

  ### **Interpersonal Comparability: Your Q1**  
  - **Scale-invariance is not a desideratum here**. It’s a relic of vNM utilities without common units. Your context (dollars/GPU-hours) **assumes comparable payoffs**.  
  - **Dropping it legitimizes**:  
    - Maximizing total surplus (utilitarian solution).  
    - Equal gain splits (split-the-difference from \( d \)).  
  - **Why?** With comparable units, proportional gains (Nash) or equal relative gains (KS) lose their privileged status. Equal absolute gains or total efficiency become coherent.  

  ---

  ### **Clarifying Your Guesses (Q2)**  
  - **Insensitivity to unattainable ideals ≠ IIA**: IIA removes *feasible* points; this removes *infeasible* ones. KS violates this (ideal point matters); Nash satisfies it.  
  - **Carve-up invariance**: Not implied by standard axioms. Nash violates it; utilitarian and equal-gains satisfy it.  
  - **No gain from splintering**: Implied by consistency axioms (e.g., if a solution is consistent under subgroup aggregation).  
  - **Robustness ≠ Pareto efficiency**: They conflict. Robust rules (e.g., Nash) may be \( \epsilon \)-inefficient; efficient rules (KS) can be unstable under noise.  
  - **Lumpiness**: Not addressed by Nash/KS. Requires discrete optimization (e.g., maximize Nash product over integer splits).  

  ---

  ### **The Impossibility (Q3)**  
  The smallest jointly unsatisfiable set:  
  - **Pareto Efficiency**  
  - **Symmetry**  
  - **Monotonicity**  
  - **IIA**  

  **Conflict**: Monotonicity and IIA clash.  
  - **Example**:  
    - Let \( S_1 = \{(0,0), (1,0), (0,1)\} \), \( d = (0,0) \). Symmetry + Pareto → (0.5, 0.5).  
    - Now expand to \( S_2 = \{(0,0), (1,0), (0,1), (0.8,0.8)\} \).  
      - **Monotonicity**: Both players should get ≥ 0.5 → outcome (0.8,0.8).  
      - **IIA**: Removing (0.8,0.8) shouldn’t change outcome → (0.5,0.5). Contradiction.  
  **Verdict**: You must sacrifice IIA *or* monotonicity.  

  ---

  ### **What Does the Heavy Lifting?**  
  - **Most narrowing**: **Robustness to estimation error**. It forces approximate solutions (not point estimates), discards KS (noisy ideals), and favors continuous rules (e.g., Nash over discrete haggling).  
  - **Least useful**: **Scale-invariance**. Already irrelevant with common units.  

  ---

  ### **Solution Scorecard**  
  | **Criterion**               | **Nash** | **KS** | **Max Total** | **Equal Gains** |  
  |-----------------------------|----------|--------|---------------|----------------|  
  | Robust to noisy estimates   | ✓        | ✗      | △             | ✓              |  
  | Carve-up invariant          | ✗        | ✗      | **✓**         | **✓**          |  
  | No gain from splintering    | ✓        | ✓      | ✗             | ✓              |  
  | Handles lumpiness           | △        | △      | **✓**         | **✓**          |  
  | Insens. to unattainables    | **✓**    | ✗      | **✓**         | **✓**          |  
  | Monotonicity                | ✗        | **✓**  | ✗             | **✓**          |  
  | IIA                         | **✓**    | ✗      | ✗             | ✗              |  
  | Needs comparability?        | No       | No     | **Yes**       | **Yes**        |  

  **Key**: ✓ = Satisfies; △ = Requires adaptation (e.g., discretization); ✗ = Fails.  

  ---

  ### **Settled vs. Contested**  
  - **Settled**:  
    - Nash satisfies IIA, KS satisfies monotonicity.  
    - Without convexity, Nash/KS may not exist (requires randomization).  
    - Utilitarian (max total) and egalitarian (equal gains) solutions require comparable utilities.  
  - **Contested**:  
    - **Monotonicity vs. IIA**: Normative choice (fairness vs. stability).  
    - **Comparability**: Some insist utility is ordinal (deny comparability); your context overrides this.  
    - **Robustness vs. efficiency**: Purists prioritize exact efficiency; pragmatists accept \( \epsilon \)-loss for stability.  
  - **Check Before Submitting**:  
    - Whether Nash’s IIA holds under non-convex sets (it may not without randomization).  
    - Formal robustness bounds for Nash (theorems exist but depend on error structure).  

  ---

  ### **Recommendation for Your Context**  
  Prioritize **robustness**, **lumpiness**, and **carve-up invariance**. This favors:  
  1. **Equal Gains** (if outside options are symmetric).  
  2. **Nash** with discretization (if outside options differ).  
  **Avoid KS** (fragile to ideal point noise) and **Max Total** (ignores disagreement point).  

  **Why not Nash?** Fails carve-up invariance (issue packaging matters) and monotonicity. But if issues are inseparable, it’s robust.  
  **Why Equal Gains?** Simple, robust, handles lumpiness, and satisfies monotonicity—but inefficient if utility functions differ.  

  ---  
  **American English compliant. No citations. Positions flagged as settled/contested.**  
  Let me know if you need expansion on the trade-offs.
