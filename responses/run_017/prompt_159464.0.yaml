  ## Chapter 7: Reaching Higher Ground with the Aspiration Method™

  **(From *Fair Shares: Dividing the Pie Without Poisoning the Well*)**

  Remember the Jones family and Grandma’s famous apple pie? Cousin Bethany *dreamed* of the flaky crust, Uncle Frank craved the tangy filling, and young Timmy just wanted the biggest piece. They argued for hours, crumbs flying, until wise Aunt Marge stepped in. "What does each of you *deeply wish* for?" she asked. Bethany envisioned the whole golden top, Frank imagined a bowl of pure filling, and Timmy pictured a slice bigger than his head. "And what if you just grab?" Aunt Marge continued. "Smashed pie, hurt feelings, and everyone hungry!" She drew a line from that messy disaster point towards their shining dreams. Where the line met the *actual* pie? That became their fair share: Bethany got extra crust, Frank extra filling, Timmy a large slice – each feeling they’d moved *proportionally closer* to their highest hope from the disaster baseline. Harmony restored! That’s the heart of the **Aspiration Method™**, transforming pie fights into peaceful resolutions.

  **Why Aspiration Works Where Others Stumble**

  Traditional methods often focus only on the worst-case scenario – the dreaded "walk-away" point where cooperation crumbles (like auctioning everything and splitting the cash after taxes and lawyers!). The Aspiration Method™ honors your *hopes* as well as your fears. It ensures everyone moves *equally far* from despair towards their individual summit of possibility. It’s inherently respectful!

  **Your Fair Share Journey: A Simple Three-Step Path**

  1.  **Define Your "No Deal" Disaster Point (D):** Be honest! What happens if talks fail? For most estates, this means forced sale, hefty legal fees, taxes paid from the proceeds, and everyone getting a smaller, purely cash share. *Example: The Smith siblings (let's call them Pat, Chris, and Alex) face a $50,000 tax bill. If they litigate, the house and flat sell at auction for less ($400k total), legal fees eat $30k, taxes $50k, leaving just $320k split three ways: approx. $106,667 each. The cherished vinyl records? Auctioned off for pennies. D = (Pat: $106k, Chris: $106k, Alex: $106k).* **Important:** Quantify *everything* in equivalent cash value at this stage. Sentimental value clouds the math!

  2.  **Discover Your Personal Aspiration Peak (A):** Dream big! What’s the *absolute best* you could conceivably get if the others focused *solely* on maximizing your happiness? Don’t be shy! This isn't greed; it's defining your potential.
      *   *Pat (wants the house):* Gets the house valued at $500k (no auction discount!), avoids all legal fees. Tax bill ($50k) paid from *other* assets. Other assets? The flat ($150k) and records ($5k brother values them, but Pat sees only $1k resale). To max Pat's *cash equivalent*: Sell flat ($150k), sell records ($1k), pay taxes ($50k). Pat gets house ($500k) + ($150k + $1k - $50k)/3 ≈ House + $33.7k. **Pat's A ≈ $533.7k.**
      *   *Chris (wants income):* Gets the rental flat ($150k value, plus its future income stream!). To max Chris's *cash equivalent now*: Value the flat at full $150k. Sell house quick private sale ($450k?), sell records ($1k). Pay taxes ($50k). Chris gets flat ($150k) + ($450k + $1k - $50k)/3 ≈ Flat + $133.7k. **Chris's A ≈ $283.7k.**
      *   *Alex (wants the records):* Gets the records (values them at $5k!). To max Alex's *cash equivalent*: Sell house ($450k), sell flat ($150k). Pay taxes ($50k). Alex gets records ($5k) + ($450k + $150k - $50k)/3 ≈ Records + $183.3k. **Alex's A ≈ $188.3k.** *(Note how Alex's pure love for the records doesn't change their cash value! We focus on comparable scales.)*

  3.  **Plot the Line of Fair Gain (L):** Draw an imaginary line from the Disaster point (D) through the space of possible deals, aiming directly for the Aspiration point (A). The Aspiration Method™ selects the point **F** where this line *first* hits the set of deals everyone can actually agree on – the "Feasible Set." Crucially, at **F**, everyone has gained the *same proportion* of the way from their Disaster (D) to their Aspiration (A). **Pat's Gain / (Pat's A - Pat's D) = Chris's Gain / (Chris's A - Chris's D) = Alex's Gain / (Alex's A - Alex's D)**

  **The Smith Siblings Find Their F:**

  *   **Pat's Potential Gain:** $533.7k (A) - $106.7k (D) = $427k
  *   **Chris's Potential Gain:** $283.7k (A) - $106.7k (D) = $177k
  *   **Alex's Potential Gain:** $188.3k (A) - $106.7k (D) = $81.6k

  The Aspiration Method™ finds the point **F** where:
  `(Pat's $ at F - $106.7k) / $427k = (Chris's $ at F - $106.7k) / $177k = (Alex's $ at F - $106.7k) / $81.6k`

  Solving this (factoring in the $500k house, $150k flat, $5k records, $50k tax) might involve creative solutions! A common, highly effective tool the Method uses is the **Harmonizing Lottery™**.

  *   **The Solution:** The house ($500k) is placed into a lottery. Pat has a high chance (say 70%), Chris a moderate chance (20%), Alex a small chance (10%) of winning it. The flat is sold ($150k). The records go to Alex ($5k value to him). Taxes ($50k) are paid from cash.
  *   **Expected Values:** Pat: (70% * $500k) + share of remaining cash after tax/sales. Chris: (20% * $500k) + share of cash. Alex: Records ($5k) + (10% * $500k) + share of cash.
  *   **Calculating Cash:** Total Cash: Flat Sale $150k + (House not won? But lottery accounts for it) – better: Total asset value pre-tax/sale: House $500k + Flat $150k + Records $5k = $655k. Minus Tax $50k = $605k to distribute *plus* the items. The lottery assigns the house probabilistically. The cash $155k (flat $150k + records sold? No, Alex gets records. Correction: Sell flat $150k, Alex gets records worth $5k *to him*, pay tax $50k from the $150k flat sale. Remaining cash: $100k. Plus the house value distributed via lottery expectation.
      *   Expected Value Pat: (0.7 * $500k) + (1/3 * $100k) ≈ $350k + $33.3k = $383.3k
      *   Expected Value Chris: (0.2 * $500k) + (1/3 * $100k) ≈ $100k + $33.3k = $133.3k
      *   Expected Value Alex: Records ($5k) + (0.1 * $500k) + (1/3 * $100k) ≈ $5k + $50k + $33.3k = $88.3k
  *   **Check the Ratios:**
      *   Pat Gain: $383.3k - $106.7k = $276.6k. Ratio: $276.6k / $427k ≈ 0.648
      *   Chris Gain: $133.3k - $106.7k = $26.6k. Ratio: $26.6k / $177k ≈ 0.150 (Uh oh! Not equal!)
  *   **Adjusting the Lottery:** To equalize the ratios, Chris's share needs a bigger boost. Increase Chris's lottery chance! After recalibration (Pat 60%, Chris 35%, Alex 5%):
      *   Pat EV: (0.6*$500k) + $33.3k ≈ $300k + $33.3k = $333.3k → Gain $226.6k / $427k ≈ 0.531
      *   Chris EV: (0.35*$500k) + $33.3k ≈ $175k + $33.3k = $208.3k → Gain $101.6k / $177k ≈ 0.574
      *   Alex EV: $5k + (0.05*$500k) + $33.3k ≈ $5k + $25k + $33.3k = $63.3k → Gain ($63.3k - $106.7k) = **-$43.4k?** Disaster! Alex *lost* from baseline. This illustrates the challenge – finding feasible F on the line.
  *   **A Feasible F:** Perhaps Alex *must* get the records ($5k value to him). Sell flat ($150k), pay tax ($50k), leaves $100k cash. House lottery (Pat 65%, Chris 25%, Alex 10%?):
      *   Pat EV: (0.65*$500k) + $33.3k ≈ $325k + $33.3k = $358.3k → Gain $251.6k / $427k ≈ 0.589
      *   Chris EV: (0.25*$500k) + $33.3k ≈ $125k + $33.3k = $158.3k → Gain $51.6k / $177k ≈ 0.291 **(Still not equal!)**
  *   **Finding True F:** This shows why we need the *feasible set*. The true **F** might involve selling the house and flat, giving Alex the records ($5k), paying tax ($50k), distributing $605k - $50k = $555k? Wait, total assets $655k - tax $50k = $605k. Alex already has records worth $5k, so $600k cash? Split three ways: $200k each. But Alex has $205k total? Then ratios:
      *   Pat: $200k - $106.7k = $93.3k / $427k ≈ 0.218
      *   Chris: $200k - $106.7k = $93.3k / $177k ≈ 0.527
      *   Alex: $205k - $106.7k = $98.3k / $81.6k ≈ 1.205 (Way over!)
      *   **Feasible F requires balancing.** Perhaps Pat gets slightly more cash if house sells, Chris less, Alex gets records. Or, the Harmonizing Lottery™ over the *flat* instead? The key is the mediator uses software to find the point on the line *within* the feasible set where the ratios match as closely as possible. It might mean Pat gets less house chance than their dream, Chris less cash, and Alex accepts the records are a small part of their gain. The Method finds it!

  **Try This! Exercise 1:** You and a friend inherit a vintage car ($20k) and a rare comic ($10k). Your Disaster: Sell both, split $15k each after fees ($7.5k each). You Aspire to the car ($20k). Friend aspires to the comic ($10k). What might **F** look like? *(Hint: Lottery! Car: You 75%, Friend 25%. Comic: You 25%, Friend 75%. Calculate Expected Values, check ratios from D=$7.5k!)*

  **Try This! Exercise 2:** Add a third sibling who desperately wants *both* items (Aspires to $30k). How does this change the Aspiration Points and the potential **F**? *(Notice how new aspirations reshape the playing field!)*

  ---

  **Sidebar: Ask Aspiration Amy™**

  *   **Reader:** "Amy, I’m confused! I’m not greedy. I stated a modest aspiration, just hoping for Grandma’s tea set. But using the Method, I ended up with less than my sister, who demanded the whole estate! She got closer to her huge aspiration. Why did being reasonable cost me?"
  *   **Aspiration Amy™:** "Great question! Remember, the Method rewards proportional movement from the *shared* disaster towards your *personal* summit. If your sister's summit is Mount Everest and yours is a gentle hill, she has much farther to climb proportionally to reach her peak. The Method ensures she makes the same *percentage progress* towards her dream as you do towards yours from that scary common valley. Stating a truly representative aspiration – your *genuine* best-case scenario – is vital. Don't downplay your hopes! Own your summit. If the tea set is truly your peak, that’s perfect. But if you secretly also value other items, include them! The Method works best with full, honest aspirations. Courage, not modesty, builds fair shares!"

  ---

  **The Power of Possibility:** The Aspiration Method™ doesn't promise everyone their dream. It promises a journey where each person's deepest hopes are acknowledged as the compass guiding them *fairly* away from shared disaster. By embracing your aspiration and understanding others', by welcoming the creative flexibility of tools like the Harmonizing Lottery™, and by focusing on proportional progress, you transform division into shared ascent. Remember Aunt Marge's pie: it wasn't about getting everything, it was about everyone feeling seen, respected, and moving hopefully forward, together. Start dreaming clearly, define that disaster, and let the Aspiration Method™ chart your course to higher ground! *(Testimonial: "We used the Aspiration Method™ after Mom passed. Did I get the lake house? Only 40% of the time! But knowing I got 58.3% of the way to my dream, just like my brother did to his, made all the difference. - Satisfied in Seattle")*
