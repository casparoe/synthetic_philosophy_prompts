  First, I need to address each of their proposed criteria. They mentioned mechanisms that should work without anecdotes, falsifiability through archaeological evidence, avoiding single-variable explanations across timescales, applicability to unexamined regions, handling categorical variations, separating description from necessity, moral anachronism, survivorship bias, avoiding teleology, and acknowledging human agency. I'll categorize these into must-haves, negotiables, and non-essentials.

  The user's deeper needs include saving time by filtering out weak pitches, maintaining credibility by avoiding academic disputes, and providing substantive reviews for general readers. They might also want to elevate the discourse in their section by promoting nuanced works. The mention of printing suggests they need concise, actionable criteria that fit within their workflow.

  For the academic consensus part, I'll note where fields agree (like survivorship bias being well-understood) versus ongoing debates (like the role of human agency in prehistoric contexts). Highlighting these helps the user avoid presenting contentious claims as facts. The trade-offs section is crucial because grand narratives often sacrifice nuance for coherence—pointing this out helps the user assess where authors cut corners.

  Finally, the single biggest pitfall is teleology—it's common in popular histories and undermines explanatory power. By emphasizing that, the spec targets a frequent weakness. Keeping the response structured with clear sections ensures the user can skim it quickly before meetings.
answer: |-
  Here’s a distilled spec for evaluating grand historical narratives, designed for quick assessment in commissioning meetings. Criteria are categorized by necessity, with academic consensus markers (**✓** = settled, **⚔** = contested). Trade-offs and failure points follow.

  ---

  ### **The Non-Negotiables (Core Explanatory Rigor)**  
  1. **Stated Mechanism Survives Anecdote Removal**  
     *Requirement:* The core driver (e.g., "climate shocks force cooperation," "inequality arises from stored surplus") must hold when stripped of illustrative stories.  
     *Why:* Anecdotes seduce; mechanisms explain. If it evaporates without case studies, it’s packaging, not theory.  
     *Consensus:* **✓** (basic logic, but often failed in practice).  

  2. **Falsifiability via Concrete Evidence**  
     *Requirement:* Must name *specific* archaeological/genetic findings that would invalidate the thesis (e.g., "If ritual structures predate grain storage, my hierarchy-first model fails").  
     *Why:* Unfalsifiable theories are mythology. Demands engagement with evidence, not just curation.  
     *Consensus:* **✓** (bedrock of science, though humanities often skirt this).  

  3. **Rejects Monocausality Across Timescales**  
     *Requirement:* Cannot let one variable (geography, genes, tech) bear full weight at both millennial *and* generational scales. Must address *how* drivers interact/transform.  
     *Why:* "Guns Germs Steel explains 1500AD" ≠ "Guns Germs Steel explains the Neolithic." Scale collapse is reductionism’s hallmark.  
     *Consensus:* **✓** (universally acknowledged in theory, routinely ignored in pop-sci).  

  4. **Acknowledges Intra-Category Variation**  
     *Requirement:* "Agriculture," "war," "statehood" must not be treated as uniform. Must grapple with ranges (e.g., sedentary foragers vs. nomadic pastoralists; voluntary vs. coerced cultivation).  
     *Why:* Masking diversity creates false binaries (HG vs. Farmer, "State" vs. "Anarchy").  
     *Consensus:* **✓** (overwhelming evidence; denial is scholarly malpractice).  

  5. **Confronts Survivorship Bias**  
     *Requirement:* Must address how data gaps (e.g., tropical organic decay, lost oral traditions) distort the record. Cannot treat "what survived" as "what mattered."  
     *Why:* >90% of cultural expression is archaeologically invisible. Ignoring this skews everything.  
     *Consensus:* **✓** (non-controversial; seriousness is proportional to how hard author tries here).  

  ---

  ### **Negotiables (Context-Dependent Weighting)**  
  6. **Stress-Testing in Unfamiliar Regions/Periods**  
     *Requirement (Conditional):* Apply thesis to a region *not* in book’s examples (e.g., highland New Guinea for Eurasian theories). Failure ≠ fatal, but evasion is suspect.  
     *Why:* Reveals ad hoc reasoning. Essential for "universal" claims, optional for regional narratives.  
     *Consensus:* **⚔** (Purists insist; others note regional histories needn’t be global).  

  7. **Distinguishes "How" from "Inevitable"**  
     *Requirement:* Must separate historical trajectory ("how early states centralized") from teleology ("states *had* to centralize").  
     *Why:* Conflating outcome with necessity is stealth determinism.  
     *Consensus:* **✓** in principle, **⚔** in practice (e.g., Diamond’s geographic determinism still has defenders).  

  8. **Explicit Moral Stance**  
     *Requirement:* Must state if judging past societies by present ethics (e.g., "progress" = increased liberty). Not inherently wrong, but must be transparent.  
     *Why:* Covert moralizing (e.g., framing collapse as "failure") smuggles in bias.  
     *Consensus:* **⚔** (Post-processualists demand reflexivity; positivists call it presentism).  

  ---

  ### **Overrated / Matters of Taste**  
  9. **Single-Sentence Mechanism Elegance**  
     *Verdict:* Nice if possible, but not essential. Complex systems resist soundbites.  
     *Why:* Prioritizing this risks rewarding glibness over nuance.  

  10. **Human Agency as Prime Mover**  
      *Verdict:* Your preference (shared by anti-determinists), not a universal requirement.  
      *Why:* Over-correction can ignore constraints (ecology, path dependency). Balance > dogma.  

  ---

  ### **The Trade-Offs (Where Books Crack)**  
  - **Compression vs. Hedging:** Grand narratives demand simplification, but caveats bloat word counts. **Fail Point:** Most sacrifice nuance for sweep, creating "vibes."  
  - **One-Mechanism Elegance vs. Outliers:** A tight thesis feels satisfying; exceptions feel like distractions. **Fail Point:** Authors bury counter-evidence in footnotes or dismiss as "noise."  
  - **Moral Clarity vs. Historicity:** Judging the past resonates but risks anachronism. **Fail Point:** Silent moralizing (e.g., framing Roman collapse as "deserved").  

  **The Single Biggest Pitfall: Teleology.**  
  > *"We ended up with states, therefore state formation was driven by efficiency/necessity."*  
  **Why it kills credibility:** Assumes the present was the only possible outcome, ignoring dead ends (Çatalhöyük), reversals (Bronze Age Collapse), and alternatives (Iroquois Confederacy). **Knocks out:** 80% of pitches on your desk. It’s the engine of reductivism.  

  ---

  ### **Academic Confidence Map**  
  - **Settled (✓):** Survivorship bias, intra-category variation, anti-monocausality (as principle).  
  - **Contested (⚔):**  
    - *Scale of human agency* in prehistory (e.g., were foragers "choosing" agriculture?).  
    - *Moral judgment* in deep history (e.g., using terms like "inequality" for Neolithic sites).  
    - *Primacy of drivers* (ecology vs. ideas vs. tech) — no consensus; camps entrenched.  
  - **Minefields (Proceed with extreme caution):**  
    - "Agricultural Revolution" as uniform event (now seen as 5+ independent transitions).  
    - "Collapse" narratives (often Eurocentric; local continuity common).  
    - Genetic arguments about behavior (methodological quicksand).  

  ---

  ### **Scoring Current Pitches (Brutally Brief)**  
  - **Sapiens Redux:** Fails 1 (mechanism: "cognitive revolution" ≈ magic), 3 (scale collapse), 4 (HG uniformity), teleology.  
  - **Diamond-with-Attitude:** Fails 3 (geography does all), 5 (ignores lost tropical societies), teleology.  
  - **Graeber-and-Wengrow Lite:** Fails 2 (rarely falsifiable), 6 (avoids stress-testing), often 8 (covert anarchist ethics).  

  **The Deliverable:** A book passes if it clears the **Non-Negotiables**, owns its **Negotiables**, and avoids **Teleology**. The rest is craft. Print this, circle section V, and watch 90% of manuscripts self-immolate.
