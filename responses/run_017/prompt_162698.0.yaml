answer: |-
  ## Specification for a Theory of Diachronic Rationality: Feasibility, Followability, and Function

  **Preamble: Discarded Candidates**
  Before outlining core requirements, I discarded several plausible-sounding candidates based on the cases and core jobs:
  1.  **Strict Preference Stability Over Time:** Discarded. The anticipatory pump shows benign preference change exists (e.g., maturation, skill acquisition). The instructive and solitary pumps show change *driven by* choice/experience is central. Requiring static preferences ignores reality and job two (designing for change).
  2.  **Guaranteed Ex-Post No Regret:** Discarded. The vanishing-step pump suggests small, convergent losses might be rationally tolerable. The instructive pump shows initial regret leading to learning can be rational. Demanding *no possible* regret is too strong for feasibility and ignores learning.
  3.  **Perfect Foresight of Future Selves:** Discarded. Job two (design/clinics) explicitly requires handling uncertainty about future preferences. Real agents face this uncertainty; a theory ignoring it is inadequate for advice.
  4.  **Maximization of Lifetime Wealth:** Discarded. While money pumps use money, the core defect isn't monetary loss per se, but self-defeat and exploitation vulnerability based on preference/choice structure. Wealth is often a proxy, but not the fundamental currency of diachronic rationality (see solitary pump). The anticipatory pump involves "payment" for a valued transformation, not mere loss.
  5.  **Strict Dynamic Consistency (Future choices align with current plans):** Tentatively discarded *as a fundamental axiom*. The solitary pump shows why violation *can* be catastrophic, but resolute/sophisticated approaches offer different paths to avoid it. It needs derivation, not axiomatic status.

  **Core Requirements: Motivated by Cases and Jobs**
  The theory must satisfy these to be adequate for the critical (explaining irrationality) and advisory (commitment devices) jobs. A crucial third job is **Self-Constitution and Identity**: Explaining how agents become who they are through temporally extended action, especially via preference change endogenous to choice (endogenous change requirement below). This underpins the anticipatory pump and is central to human agency.

  *   **R1 (Feasibility Filter - Vulnerability is Defect Only if Exploitable):** Vulnerability constitutes a defect *only if* a pump feasibly exploits it in principle, given reasonable assumptions about counterparty incentives and agent capacities. *(Non-negotiable)*
      *   *Motivation:* Subsidized Pump (no exploiter incentive), Fragmented Pump (requires unlikely collusion), Vanishing-Step Pump (infinite steps impractical, convergent loss small).
      *   *Implication:* Immunity to *all conceivable* pumps is unnecessary. The filter requires assessing the *realism* of exploitation scenarios. Vulnerability to solitary/instructive/anticipatory pumps *is* a defect under this filter.
  *   **R2 (Immunity to Solitary Pumps):** The agent must not be vulnerable to sequences where her own locally maximizing choices, made under her actual preferences at each time, lead deterministically from her initial options to an outcome she strictly dispreferred initially to other available initial options, without external exploitation. *(Non-negotiable)*
      *   *Motivation:* Solitary Pump. This is pure self-sabotage via myopic choice, the core case of diachronic irrationality needing explanation (Job One). No counterparties needed; the defect is internal.
  *   **R3 (Handling Endogenous Preference Change):** The theory must account for and evaluate cases where an agent's choices *cause* changes in her subsequent preferences (e.g., developing a taste, forming a habit, undergoing a transformative experience). *(Non-negotiable)*
      *   *Motivation:* Anticipatory Pump (training changes desires), Instructive Pump (learning changes preferences). Core to self-constitution (Third Job) and Job Two (designing interventions that leverage or manage this).
  *   **R4 (Handling Uncertainty about Future Preferences):** The theory must provide guidance when the agent is uncertain, at the time of choice, about what her future preferences will be. *(Non-negotiable)*
      *   *Motivation:* Explicitly demanded by advisory role (Job Two). Designing commitment devices often presupposes such uncertainty. Anticipatory pump involves foreseen change, but uncertainty is broader.
  *   **R5 (Joint Followability):** Recommendations issued by the theory at different times for a single agent must be jointly executable by an agent with ordinary cognitive and volitional capacities within the actual flow of time. *(Non-negotiable)*
      *   *Motivation:* Explicit demand. Solitary pump violates this (Monday's plan to save, Tuesday's urge to spend conflict). A theory recommending incompatible actions at different times is pragmatically incoherent for a temporally embedded agent.
  *   **R6 (Gradational Defect & Currency):** Diachronic irrationality comes in degrees. The primary currency for assessing the *degree* of defect is the *loss of access to opportunities* the agent *would have valued* at some relevant point, considering the structure of paths through time, rather than simple monetary loss or utility differences. *(Negotiable - but core to precision)*
      *   *Motivation:* Vanishing-Step Pump (small convergent opportunity loss), Solitary Pump (large opportunity loss - worst outcome achieved vs. better initial options). Money is a poor proxy (Anticipatory Pump involves "payment" for a gain in opportunities/self). Tracks the core concern of self-governance over time.
  *   **R7 (Specificity of Verdict Target):** The theory must explicitly state whether its primary verdicts (rational/irrational) apply directly to structures of time-indexed preferences, to choice dispositions/procedures, or to plans/intentions. It must acknowledge that these can diverge (e.g., preference reversal despite a plan, or sticking to a plan against current preference). *(Negotiable - but crucial for clarity)*
      *   *Motivation:* Solitary pump (preferences stable? choices myopic?), Resolute choice (plan vs. momentary preference), Sophisticated choice (planning around future choice). Job One requires identifying *what* is irrational (e.g., the preference structure enabling the pump, or the choice procedure that executes it).
  *   **R8 (Manageability of Benign Change - Anticipatory Pump Filter):** Vulnerability to exploitation *based solely on foreseen, genuinely benign preference change* (e.g., maturation, skill-based transformation) should be mitigatable or excusable, not a fundamental irrationality. *(Prejudice of a Camp - leaning towards accepting transformative change)*
      *   *Motivation:* Anticipatory Pump. If the change itself is an achievement (becoming a musician, a parent, wiser), paying a foreseen "transition cost" might be rational investment, not pure defect. The theory shouldn't condemn valuable self-transformation. (Contrast with instructive pump, where change fixes a defect).

  **Tensions and Trade-offs: R5 vs. R8**
  I suspect **Joint Followability (R5)** and the **Anticipatory Pump Filter (R8)** create tension under certain interpretations of benign change.

  *   **Why?** Consider deep, transformative, foreseen change. The "earlier self" (S1) might value state A (e.g., carefree youth) and disvalue state B (e.g., responsible parent). The "later self" (S2) values B and disvalues A. R8 suggests S1 paying S2 (via an exploiter) to transition might be rational investment. However, R5 demands jointly followable recommendations. What does the theory tell S1 *at t1*? If it says "Pursue A (your current preference)", this conflicts with the plan needed to achieve/pay for B (which requires actions S1 disprefers). If it says "Commit now to actions leading to B", this conflicts with S1's current preferences. A plan acceptable to both S1 and S2 might be incoherent from either's perspective at their respective times. Can one agent coherently *execute* the sequence of "S1 pays for their own future transformation into S2" while respecting the preferences at each moment?
  *   **Resolution Attempt:** Perhaps R5 is satisfied if the agent at t1 adopts a *higher-order plan* or *meta-preference* to become S2, justifying the costly actions as steps towards that valued transformation, even if the momentary preferences conflict. The *plan* (become S2) is followable, even if sub-steps conflict with momentary preferences. R8 then excuses the vulnerability as part of executing this rational meta-plan.
  *   **Trade-off:** If this meta-preference view is rejected, or if the transformation is so radical that no coherent meta-preference spans S1 and S2, then R5 and R8 conflict. **I would drop R8 (Anticipatory Pump Filter)** as the less fundamental requirement. Protecting the possibility of coherent agency over time (R5) is paramount for Job One (explaining irrationality) and the core function of a rationality theory. Vulnerability to the anticipatory pump, even for benign change, might indicate a lack of a unified agential perspective capable of managing the transformation *as an agent*. The resulting theory would be stricter on transformative change, potentially viewing any foreseen preference change exploitable by third parties as a diachronic rational defect, regardless of the change's perceived value, unless the agent has a unified plan spanning the change. This makes diachronic rationality more demanding regarding identity shifts.

  **The Gatekeeper Requirement: Joint Followability (R5)**
  **Joint Followability (R5)** excludes the most candidate theories. Many elegant formal theories ignore the constraints of temporal embeddedness.

  *   **Why it Excludes:** Theories focusing solely on preference coherence (e.g., some versions of time-indexed preferences) can recommend sequences impossible to execute (e.g., "Intend P at t1" and "Do ~P at t2" as locally optimal). Naive versions of resolute choice often require unrealistic willpower to stick to plans against strong contrary preferences. Theories demanding consistent maximization of a single utility function across time ignore preference change, violating R3 and R5 when change occurs. Theories relying on hypothetical precommitment ignore the agent's actual capacities at the later time (R5).
  *   **Defense:** R5 is non-negotiable because rationality is for *actual agents acting in time*. A theory whose recommendations cannot be coherently followed by a single human-like agent across time fails its core purpose. It cannot underwrite *actual* judgments of irrational behavior (Job One) because the behavior might be unavoidable given the agent's capacities in the flow of time. It cannot offer usable advice (Job Two) if the advice is impossible to implement. The solitary pump vividly illustrates the failure: the agent *wants* to follow Monday's plan on Tuesday but *cannot* due to conflicting local preferences. R5 forces the theory to engage with the *procedural* and *volitional* realities of diachronic choice, not just abstract preference orderings. It bridges the gap between structure and agency.

  **Compact Table: Theories vs. Hard Requirements**

  | Theory Type                     | Solitary Pump Immunity (R2) | Endogenous Change (R3) | Uncertainty Future Prefs (R4) | Joint Followability (R5) | Gradational Opp. Loss (R6) |
  | :------------------------------ | :-------------------------- | :--------------------- | :---------------------------- | :----------------------- | :------------------------- |
  | **1. Myopic Choice**            | ❌ (Defined by failure)     | ⚠️ (Ignores causality) | ⚠️ (No guidance)             | ✅ (Choices are local)    | ❌ (Focuses on moment)     |
  | **2. Sophisticated Choice**     | ✅ (Plans around future)    | ⚠️ (Takes change as given) | ⚠️ (Limited modeling)        | ✅ (Plans executable)     | ⚠️ (Tracks foreseeable paths) |
  | **3. Resolute Choice**          | ✅ (Sticks to plan)         | ⚠️ (Assumes fixed plan) | ⚠️ (Plan fixed early)        | ❓ (Requires strong will) | ⚠️ (Depends on plan quality) |
  | **4. Whole-Life Preferences**   | ✅ (Static global eval)     | ❌ (Denies/ignores)     | ❌ (Ignores)                 | ❌ (Ignores sequential choice) | ⚠️ (Global, not path-based) |
  | **5. Reasons-Responsiveness** | ⚠️ (Depends on specifics)  | ✅ (Focuses on process) | ✅ (Reasons adapt)           | ✅ (Focuses on capacity)  | ⚠️ (Hard to quantify)      |

  *   **Key:** ✅= Generally Satisfies, ⚠️= Partially/Problematic, ❌= Generally Fails, ❓= Heavily capacity-dependent.

  **Epistemic Note**

  *   **R1 (Feasibility Filter):** Confident. Core to avoiding spurious objections; grounded in incentive analysis.
  *   **R2 (Solitary Pump):** Confident. Purest form of diachronic failure.
  *   **R3 (Endogenous Change):** Confident. Empirically undeniable, central to agency.
  *   **R4 (Uncertainty):** Confident. Necessary for real-world application (Job Two).
  *   **R5 (Joint Followability):** Confident. Foundational for agency in time.
  *   **R6 (Gradational/Opp Loss):** Inclined. Strong case from cases, but alternatives (e.g., utility loss) exist.
  *   **R7 (Verdict Target):** Inclined. Crucial for clarity, but specific focus might be theory-dependent.
  *   **R8 (Anticipatory Filter):** Guessing. Strong intuition, but difficult to formalize without undermining agency (R5).

  **Least Confident Claim:** My resolution of the R5 vs. R8 tension (prioritizing R5 and potentially dropping R8) is my least confident claim. **What would change my mind?** Convincing examples or arguments showing that deeply transformative, foreseen benign preference change *can* be coherently managed by a single agent across time *without* requiring a pre-existing unified meta-preference, and that failing to pay a foreseen exploiter for such a transition is genuinely irrational. Empirical evidence on how people successfully navigate profound transformations while maintaining a sense of rational agency would be crucial. Demonstrating that R5 can be satisfied in such cases without meta-preferences would bolster R8.
