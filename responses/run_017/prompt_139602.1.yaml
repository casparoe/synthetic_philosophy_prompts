prompt: |-
  hey — something I keep going back and forth on and would like a real opinion about.

  I subcontract cabinet finishing to the same guy, Marek, roughly one job a month, and for almost two years its worked great: I pay on delivery, he never asks for a deposit, nothings in writing, and neither of us has ever stiffed the other. Two things changed recently. He told me he's relocating out of state in about three months, so there's a clear end date to this arrangement now. And separately, I've realized I often genuinely can't tell whether a job came out badly because he rushed it or because the lumber was already warped when it reached him — I'd guess that's true for maybe one job in five, and I'm just guessing in those cases.

  A friend says the relocation is decisive: with no next job after this one, he has no reason to care anymore, so I should stop paying on delivery and hold payment until I've inspected each finished job myself. The logic makes sense but it feels like it throws away two years of something real. And the second thing nags at me too — if I start punishing every job that looks bad, sometimes I'll be punishing him for the wood, and I have a feeling that could spiral into us both acting worse than we want to.

  So: is my friend right? What should I actually do over these last three months, and does the fact that I'm sometimes guessing about who's at fault change the answer?
reasoning: |-
  Okay, the user is dealing with a tricky situation with their subcontractor, Marek. They've had a great working relationship for two years—no contracts, payments on delivery, no issues. But now Marek is moving in three months, so the arrangement is ending. The user's friend suggests changing the payment terms to inspect before paying, but the user is hesitant. They don't want to ruin the trust they've built. Also, there's another problem: sometimes it's hard to tell if a job's poor quality is Marek's fault or due to warped lumber. This happens about 20% of the time.

  First, I need to unpack the user's main concerns. The primary issue is whether to change the payment terms now that Marek is leaving. The friend's advice is based on the idea that without future jobs, Marek has no incentive to maintain quality. But the user values the trust and reliability they've built over two years. Changing the terms might signal distrust and could damage the relationship unnecessarily. Plus, Marek hasn't given any reason to doubt him yet.

  Then there's the second issue: the attribution problem. When a job looks bad, how does the user determine if it's Marek's rushing or the wood's warping? Punishing Marek for something beyond his control could lead to resentment and a breakdown in cooperation. The user fears this might create a spiral where both parties act in bad faith, making the last three months stressful.

  The user's deeper needs seem to be maintaining trust and a positive relationship until the end, ensuring fair treatment for both parties, and avoiding unnecessary conflict. They also need a practical way to handle quality disputes without damaging the partnership. The unspoken need might be to part ways amicably, preserving the possibility of future collaboration or referrals, even if Marek is moving.

  So, what's the best approach? Changing payment terms abruptly could backfire. Marek might see it as an accusation, especially since there haven't been issues before. A better strategy is to address the attribution problem directly. The user could implement a pre-inspection process where they document the wood's condition before handing it off. Photos or a checklist would provide objective evidence. This way, if the finished product has issues, they can compare and determine responsibility fairly.

  Communication is key. The user should talk to Marek about the attribution issue, framing it as a mutual problem to solve. By involving Marek in creating the process, it becomes a collaborative effort rather than a punitive measure. This maintains trust and addresses the root cause without changing payment terms. Plus, it solves the ongoing problem of unclear responsibility, which benefits both parties even beyond the remaining three months.

  The relocation itself isn't necessarily a reason to distrust Marek. If he's been reliable for two years, he likely values his reputation and might want to end on good terms for references or future opportunities. Assuming he'll slack off might be premature. Instead, focusing on improving the process for the remaining jobs makes sense without introducing new payment terms that could create tension.

  In conclusion, the friend's advice to hold payment isn't the best move. It risks the trust that's been built. Tackling the attribution problem with a documented pre-inspection process is a more effective and respectful solution. This approach addresses the user's immediate concerns and their deeper need to maintain a positive, fair working relationship until the end.
answer: |-
  You're right to be hesitant about your friend's advice - while logical on the surface, abruptly changing payment terms would likely damage the goodwill you've built. Here's a better approach for your final three months:

  **Don't Change the Core Payment Terms (Yet)**
  - Maintaining trust is crucial for these last jobs. Paying on delivery as usual honors your established relationship. Suddenly withholding payment signals distrust and could make Marek resentful or less cooperative during his exit.
  - **Exception:** If the *very next* job shows a noticeable, unambiguous drop in quality that can't be blamed on materials, then have a conversation before changing terms.

  **Directly Address the Attribution Problem (This is Key)**
  This is your real underlying issue, independent of the move:

  1.  **Initiate an Honest Conversation with Marek:**
      *   "Marek, I've noticed that sometimes when a job doesn't look perfect, I genuinely can't tell if it was due to the wood being warped when you got it or something in the finishing process. This happens maybe 1 in 5 times. Since we've always worked well together, I wanted to ask: How can we figure this out better **before** it becomes an issue?"
      *   **Crucial Framing:** Present it as a *shared problem to solve*, not an accusation.

  2.  **Implement a Simple Pre-Inspection Protocol (Jointly Agreed):**
      *   **The Fix:** Before you deliver lumber to Marek, **take timestamped photos together**. Use your phones! Focus on:
          *   Close-ups of any noticeable warping, knots, or imperfections *before* it leaves your shop.
          *   Overall shots showing the condition of the pieces.
      *   **The Agreement:** Say, "To make things fairer for both of us and avoid any confusion later, how about we snap a few quick pics together of any tricky pieces before I leave them? That way, if something looks off when it comes back, we can easily check if it was already there."
      *   **Why this works:**
          *   Solves the attribution problem objectively.
          *   Minimal effort for both of you (seconds per job).
          *   Fair to Marek - he won't get blamed for pre-existing flaws.
          *   Fair to YOU - you have evidence if the finishing caused new issues.
          *   Preserves trust - it's a procedural change, not a punishment.
          *   Prevents the "spiral" you fear.

  3.  **For the Final Jobs (Especially the Last One):**
      *   **Continue paying on delivery as usual.** The photo protocol addresses the quality uncertainty.
      *   **If a genuine quality issue arises *despite* the photos showing good wood:** Discuss it immediately and professionally *before* the next job. Focus on the specific flaw and the photo evidence. "Hey Marek, thanks for getting this back. I noticed [specific issue] on the doors. The photos we took show the wood was flat here before finishing. Can we take a look together and see what might have happened?"
      *   **Consider a small "completion bonus":** For the *very last* job delivered on time and to standard (using your new photo evidence), a small goodwill bonus (e.g., 5-10% extra) acknowledges the years of good work and incentivizes a strong finish. This costs less than the friction of changing payment terms.

  **Why Relocation Alone Isn't Decisive:**

  *   **Reputation & Professionalism:** Marek likely values his reputation, even moving. Burning a reliable client right before leaving is poor business sense and feels bad.
  *   **The End is Natural:** If he's been reliable, he'll likely maintain that standard until the agreed end date. Assuming he'll suddenly become unreliable is cynical and risks becoming a self-fulfilling prophecy.
  *   **Your Leverage:** You hold payment *for that specific job* upon delivery. His incentive is still to get paid *for the work he just did*. Holding payment *longer* removes that immediate incentive without adding real security.

  **What to Do Now:**

  1.  **Talk to Marek THIS WEEK about the attribution issue.** Propose the simple photo solution collaboratively. *"Hey Marek, got a sec? I've been thinking about how sometimes it's hard to tell..."* (Use the script above).
  2.  **Implement the photo pre-inspection starting with the NEXT job.** Make it routine.
  3.  **Keep paying on delivery as long as quality remains consistent (using the photos for verification).**
  4.  **Only revisit payment terms IF:** A clear, documented (via photos) quality issue arises *and* Marek is unresponsive to fixing it. Even then, frame it as: "For this specific job, since we have this unresolved issue, I need to hold payment until we resolve it. Let's figure this out together."

  **The Bottom Line:** Your instinct to preserve the trust is correct. The relocation is a change in circumstance, not proof of impending bad faith. **Your core problem is the attribution of quality issues, not Marek's move.** Solve that problem directly with the simple photo documentation, which benefits both of you fairly and maintains the positive working relationship you've built over two years until the natural end. This approach minimizes risk without sacrificing trust.
