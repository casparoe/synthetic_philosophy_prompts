prompt: |-
  hey — I'm in a metaphysics seminar this term and we've spent the last two and a half weeks on the special composition question (when do some things add up to a further thing?), and I've realised I have a pile of gut reactions that don't seem to add up to any of the three views we were handed (everything always composes / nothing ever does / composition happens but only sometimes, and only when...). I got into an argument about it in the dining hall last night and lost, mostly because I couldn't say what my own principle was. So here are my verdicts, straight from the gut:

  - my coffee mug: there is a mug, not just particles arranged mugwise.
  - a heap of sand on a beach: no, just grains.
  - a statue and the lump of clay it's made of: one thing, not two — 'statue' and 'lump' are two descriptions of it, and I really don't want to say there are two solid objects occupying exactly the same place at the same time.
  - my watch, which my brother took apart and left in pieces in a drawer for a month before putting it back together: no watch-thing existed during that month, but it's the same watch afterwards — it survived being taken apart, it wasn't replaced by a duplicate.
  - the tree on the lawn in front of the library: exactly one tree, even though there are thousands of overlapping near-candidates (tree-including-that-flake-of-bark, tree-minus-that-leaf…). I refuse to say there are thousands of trees there, but I also can't say which one it is, and this bugs me more than the statue case does.
  - my body minus a single hair: no such thing — which looks structurally just like the tree-minus-one-leaf candidates I just denied, so one of those two verdicts has to go.
  - my left shoe together with the Eiffel Tower: obviously not.
  - one of those colonial jellyfish-ish things (a Portuguese man o' war) whose bits are physically separate but work as a single animal: yes, one organism.
  - a wolf pack spread over a valley: no.
  - a ship whose planks are replaced one at a time while the old planks are immediately assembled into a raft floating alongside: the ship is the repaired one and the raft isn't, even though the raft has all the original parts. But then, if the ship burns and ten years later someone rebuilds it plank by plank from the stored originals, I find myself wanting to say it's the same ship again — which I suspect is inconsistent of me.

  Someone in my seminar floated a principle I keep turning over: the parts compose something exactly when they stand in a single causally self-maintaining system, where the self-maintenance is allowed to be realized indirectly — through a designer's intentions, or through stored plans — so that a watch in pieces in a drawer still counts (its unity is 'hosted' by the plan and by what everyone intends to do with the parts), while the very same parts in a random pile don't; and the colonial jellyfish counts because its parts maintain one another, while a wolf pack doesn't, because its coordination is behavioural rather than metabolic. I like this alot, but I'm pretty sure it isnt finished: it seems to say yes to some things I want to say no to, and I can't tell what it does with the tree.

  Can you do the reflective-equilibrium thing with me? Take my ten verdicts and see whether that principle, or a cleaned-up version of it, or a completely different one, gets them. Please state the principle precisely, tell me which clause is motivated by which verdict, be honest about which of my verdicts it can't accommodate and whether I should just drop them or whether the principle is worse off for dropping them, and say what it predicts for a couple of cases I haven't listed — I'm especially stuck on whether a person with a transplanted mechanical heart has the pump as a part of them, and on whether a gravitationally bound system like a solar system turns out to be an object on this view. Also: does my watch verdict secretly commit me to thinking of things as spread out in time rather than wholly present at each moment, or can I keep it without that?
reasoning: |-
  Hmm, the user is grappling with the special composition question in metaphysics after a seminar discussion. They've listed ten intuitive verdicts about when composition occurs, but these don't neatly align with standard views (universalism, nihilism, or restricted composition). Their examples range from concrete objects like coffee mugs to more ambiguous cases like colonial organisms and identity-over-time puzzles with watches.

  The user mentions a proposed principle from their seminar - causal self-maintenance systems - which they find appealing but incomplete. They specifically want help testing this principle against their intuitions, refining it, and addressing gaps. Three key pain points emerge: (1) inconsistency between the tree and body-minus-hair cases, (2) uncertainty about temporal parts given the watch reassembly case, and (3) unaddressed examples like mechanical hearts and solar systems.

  Their underlying struggle seems twofold: First, they're frustrated by having strong intuitions without coherent principles - hence the dining hall debate loss. Second, they're intellectually unsettled by the tree case where precise boundaries feel necessary but impossible to specify. The colonial organism example suggests they're open to non-standard unities (metabolic vs behavioral), but the wolf pack rejection shows limits to this.

  The causal maintenance principle has promise but needs tightening. Its "indirect realization" clause (designer intentions) conveniently handles the disassembled watch but risks overgenerating - e.g., could make the Eiffel Tower + shoe "unified" if someone intends them as art. The tree case exposes how self-maintenance applies ambiguously to natural kinds: is a tree maintained by cellular processes or ecological context? And the body-minus-hair case reveals tension - if identity depends on precise composition, how can the tree tolerate vague boundaries?

  For refinement, I should distinguish between imminent causal dependence (jellyfish cells) and mediated dependence (watch plans). The watch reassembly case suggests they implicitly accept temporal parts - the watch persists as a "dispositional object" - which avoids four-dimensionalism if framed as identity through functional continuity. The solar system test probes whether gravitational binding counts as "maintenance" (probably not, as it lacks feedback loops).

  Notably, the user's statue/lump intuition rejects coincident objects, favoring description-relative identity. This might extend to the tree: perhaps "the tree" refers variably to slightly different composites based on context. That could resolve the inconsistency with body-minus-hair if we deny that "body-minus-hair" picks out a privileged entity.
answer: |-
  Okay, let's dive into your metaphysical gut check. This is a fantastic set of intuitions, and the frustration you feel is *exactly* the driver of good metaphysics. Your seminar colleague's causal self-maintenance principle is a strong contender, but it needs refinement to capture your nuanced judgments. Let's build a principle step-by-step using your verdicts as guideposts.

  **Step 1: Articulating Your Verdicts**

  1.  **Coffee Mug:** YES (Composition occurs)
  2.  **Heap of Sand:** NO
  3.  **Statue/Lump:** YES (One object, two descriptions) *[Rejects coincident objects]*
  4.  **Disassembled Watch:** NO during disassembly, YES before/after, SAME watch reassembled *[Implicates identity over time, persistence conditions]*
  5.  **Tree:** YES (Exactly one tree), NO to overlapping near-candidates *[Rejects mereological vagueness for the "dominant" object, but acknowledges candidate parts]*
  6.  **Body Minus Hair:** NO *[Contrasts with tree near-candidates]*
  7.  **Shoe + Eiffel Tower:** NO
  8.  **Portuguese Man o' War:** YES (One organism)
  9.  **Wolf Pack:** NO
  10. **Ship of Theseus (Continuous Repair):** Ship = repaired vessel, Raft ≠ ship *[Prioritizes continuity of form/function over material]*
      **Ship of Theseus (Rebuild after Burn):** YES, same ship *[Seems to prioritize original material/form over continuity]*

  **Step 2: Analyzing the Proposed Principle (Causal Self-Maintenance)**

  *   **Core Idea:** Parts compose an object X iff they constitute a single causally self-maintaining system (CMS). Self-maintenance can be direct (metabolic) or indirect (mediated by plans/intentions).
  *   **Clarification Needed:** "Self-maintenance" needs defining. Does it mean *actively preserving the system's own characteristic structure/function against perturbations*? And "system" needs defining relative to the object in question.

  **Step 3: Testing the Principle Against Your Verdicts**

  *   **Good Fits:**
      *   **Mug (YES):** Its structure maintains its function (holding liquid) against minor forces. Intentions (design/manufacture) establish this capacity.
      *   **Heap (NO):** No internal causal structure actively maintaining "heapness." Gravity and friction hold it, but it doesn't *self*-maintain against perturbation (wind blows it apart).
      *   **Portuguese Man o' War (YES):** The zooids *do* causally depend on each other in a complex, integrated way to maintain the whole organism's survival and function (feeding, reproduction, defense, locomotion). Metabolic and functional interdependence is key.
      *   **Wolf Pack (NO):** Coordination is behavioral/functional, not *metabolically* integrated. Individual wolves are self-maintaining organisms; their pack behavior doesn't create a *new* self-maintaining entity at the metabolic level. The causal dependencies are weaker and behavioral, not constitutive.
      *   **Disassembled Watch (NO during disassembly):** The causal system maintaining the watch's function is *disrupted*. The parts aren't interacting in the way necessary for timekeeping. *However...*
  *   **Problematic Fits & Required Refinements:**
      *   **Disassembled Watch (YES before/after, SAME watch):** The principle *as stated* struggles with persistence. If the CMS is disrupted, the object ceases to exist. But you want the *same* watch back. This forces us to incorporate **dispositions/potentialities hosted externally**.
          *   **Refinement:** A CMS can exist in an *active* state (parts interacting causally *now* to maintain the system) or a *dormant/potential* state (the *capacity* for the system to be reconstituted and become active again is maintained by external structures/plans/intentions). The watch parts in the drawer + the plan/intention to reassemble constitute the CMS in a dormant state. The *same* CMS persists dormantly. *(Verdict 4 motivates this)*
      *   **Statue/Lump (One Object):** The principle *could* say the lump is the CMS maintaining physical integrity, while the statue is a different CMS (maintaining aesthetic form/function). You reject this. We need a way to say the *same* CMS supports multiple descriptions/functions.
          *   **Refinement:** The CMS defines the *object*. The object can have multiple *properties, functions, or descriptions* (lump, statue) based on how we interact with it or what aspects we focus on. Composition gives us the object; descriptions don't multiply objects. *(Verdict 3 motivates this - rejection of coincidence)*
      *   **Tree (YES, one tree; NO to near-candidates):** This is the hardest. Is the tree-minus-one-leaf a CMS? Probably yes, almost as much as the full tree! But you deny its existence as a distinct *object*. The principle alone doesn't explain why we privilege the "full" tree. We need a notion of **dominant function or maximal integration**.
          *   **Refinement:** Only the *maximally integrated* CMS (relative to a relevant kind) composes an object. The tree's biological systems (nutrient flow, gas exchange, growth) are maximally integrated at the level of the whole organism *including all its functional parts*. Tree-minus-one-leaf is a *sub-system* of the tree's CMS, not a distinct, equally privileged CMS itself. Biological function defines the maximal boundary. *(Verdict 5 motivates this - rejecting vagueness for the primary object)*
      *   **Body Minus Hair (NO):** Crucially, the body-minus-hair *is* still a highly integrated CMS! A single hair is peripheral. Why deny it? This highlights the tension with the tree case.
          *   **Resolution via Refinement:** The "body" CMS is defined by biological function at the organism level. Losing a single hair doesn't disrupt the core CMS; the system adapts trivially. However, "body-minus-hair" doesn't pick out a *distinct CMS object* any more than "tree-minus-leaf" does. It simply describes a state of the *one* CMS (the organism). We don't recognize arbitrary subtractions as composing new objects, even if the remainder is functional. The tree verdict already rejects such near-candidates. This verdict is consistent *if* we see "body-minus-hair" as merely describing the organism *in a state of lacking a hair*, not denoting a distinct composed entity. *(Verdict 6 is saved by aligning with Verdict 5 - rejecting arbitrary subtractions as objects)*
      *   **Ship of Theseus (Continuous Repair):** The repaired ship maintains the active CMS of "being a ship" (floating, carrying cargo, etc.) through continuous replacement. The causal continuity of the *functioning ship system* is paramount. The raft, despite the original parts, is not engaged in the ship-CMS. *(Verdict 10a motivates causal/functional continuity)*
      *   **Ship of Theseus (Rebuild after Burn):** This strains the CMS principle. The CMS was utterly destroyed (burned). The reassembled ship has no causal continuity with the original CMS. How can it be the *same* ship? Your intuition here might be driven by **material origin + form + intention**, not CMS continuity.
          *   **Honest Conflict:** This verdict is hard to reconcile cleanly with the CMS principle, especially the dormant state idea. The watch survived disassembly because the CMS remained dormant. A burned ship has no dormant CMS; it's gone. The rebuilt ship is a *new* CMS, even with original parts. You might need to relax the identity condition here or introduce a separate criterion for artifact identity based on original material/form/intention *when CMS continuity is utterly destroyed*. Alternatively, you could revise this verdict: it's a replica, not the original ship. *(Verdict 10b presents a challenge; principle might force dropping it)*
      *   **Shoe + Eiffel Tower (NO):** No significant causal interdependence maintaining any unified structure or function. Easily handled.

  **Step 4: The Refined Principle**

  **Parts compose an object X iff they constitute a single, maximally integrated causal self-maintenance system (CMS) relative to a relevant kind K (e.g., organism, artifact).**

  *   **Causal Self-Maintenance System (CMS):** A set of parts whose interactions actively or dispositionally (dormantly) work to preserve the system's characteristic structure and function against perturbations, establishing a non-arbitrary boundary.
  *   **Maximally Integrated:** The system represents the highest level of functional interdependence relevant to K within that context. Sub-systems or arbitrary aggregates (like tree-minus-leaf or body-minus-hair) do not count as distinct objects.
  *   **Active vs. Dormant State:** The CMS persists as long as its capacity for active self-maintenance exists, either through current part interactions (active) or through external hosting of the reconstitution potential (dormant).
  *   **One Object, Many Descriptions:** The composed object (defined by its CMS) can bear multiple descriptions (e.g., lump, statue) without multiplying objects.

  **Motivation by Verdict:**
  *   CMS Core: Mug (1), Heap (2), Man o' War (8), Wolf Pack (9), Shoe+Tower (7)
  *   Dormant State: Disassembled Watch (4)
  *   Maximal Integration: Tree (5), Body-minus-hair (6) [as *not* distinct objects]
  *   One Object/Many Descriptions: Statue/Lump (3)
  *   Functional Continuity: Ship Repair (10a)

  **Step 5: Addressing Your Specific Questions & New Cases**

  *   **Person with Mechanical Heart:** **YES, it's part of them.** The mechanical heart is fully integrated into the person's biological CMS. It causally interacts to maintain blood circulation, which is essential for maintaining the entire organism's state. It becomes a functional part of the *one* maximally integrated CMS (the organism).
  *   **Gravitationally Bound Solar System:** **NO, not an object.** While the planets/stars are causally connected via gravity, this connection does not constitute *self-maintenance*. Gravity organizes them, but it doesn't actively work to *preserve* the system's specific structure/function against perturbations in a way that establishes a non-arbitrary boundary. Planets don't "maintain" each other's orbits against disruption; they just follow gravity. It's a collection of objects (stars, planets) interacting, not a single CMS object. (Contrast with a binary star system where tidal forces might create some feedback, but even then, it's unlikely to rise to the level of "self-maintenance" defining a single object).
  *   **Your Watch & Temporal Parts:** You can **keep your watch verdict WITHOUT committing to temporal parts or perdurantism.** The dormant CMS account relies on **dispositions/potentialities** hosted externally (plans, intentions). The watch persists because the *capacity* for the specific functional CMS to be realized persists, even when the parts aren't currently interacting. It's a form of **endurantism** where the object's persistence is grounded in a stable, externally supported dispositional property (the potential to function as a watch). The watch is wholly present at each moment it exists (before disassembly, after reassembly), and wholly absent when the dormant potential is destroyed (e.g., if the plans are lost and parts scattered randomly). The disassembly period is a time when the watch *does not exist*, not a time when temporal parts exist.

  **Conclusion & Honesty:**

  The refined CMS principle captures the vast majority of your strong intuitions remarkably well:

  *   **Accommodates:** Mug (1), Heap (2), Statue/Lump (3 - as one object), Disassembled Watch (4 - via dormancy), Tree (5 - maximal CMS), Body-minus-hair (6 - not distinct), Shoe+Tower (7), Man o' War (8), Wolf Pack (9), Ship Repair (10a).
  *   **Challenges:** Ship Rebuild (10b). The principle strongly suggests it should be a *new* ship (new CMS, no continuity). Your intuition might stem from artifact identity conventions (original parts + form + name) overriding strict CMS continuity *in this extreme case*. You have a choice:
      *   **Revise the Principle:** Add an "artifact identity" clause for cases of total destruction/reconstitution from original parts. This is messy and risks arbitrariness.
      *   **Revise Your Verdict:** Accept that the rebuilt ship, while an exact replica made from the original material, is a numerically distinct object (a new CMS) from the original ship. This aligns better with the core CMS logic and the dormant state only applying when the CMS *can* be reactivated without total recreation.
  *   **Overall:** The principle offers a powerful, non-arbitrary, and intuitively grounded alternative to the standard trio. It explains why composition seems to happen for organized unities (organisms, artifacts) but not for arbitrary collections, and it handles tricky cases of disassembly and functional redundancy. The tension between the tree and body-minus-hair is resolved by recognizing that both deny that arbitrary subtractions compose distinct *objects*, even if the remainder is highly functional. The tree itself is the one maximal CMS.

  This principle places significant weight on function, integration, and causal interdependence, which seems to resonate deeply with your intuitions. It's a robust contender worth defending in your next dining hall debate! Good luck!
