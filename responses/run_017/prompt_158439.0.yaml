  - **Each friend answers the questions independently**, without discussing theories. The path through the tree reveals their position.  
  - **Disagreements** will likely arise at Q1 (lucid dreaming as proof of consciousness) or Q2/Q3 (whether dreams require reporting).  
  - **Unexplored leaves** help pinpoint *why* an argument feels stuck—e.g., if you’re debating a position no one actually holds.  

