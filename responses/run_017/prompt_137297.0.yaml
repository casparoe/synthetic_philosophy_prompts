  The team is divided:
  - CDT advocate says the correlation measurement is a reductio against EDT
  - EDT advocate says it confirms their position
  - FDT advocate focuses on decision functions

  The user suspects the core disagreement is about whether non-causal correlations justify action, and whether "what should this agent do" is the same as "what rule should I implement." They also wonder if different sides are implicitly using different test cases (Newcomb vs. smoking lesion).

  This needs careful handling because:
  - It's time-sensitive (design review Monday)
  - Involves deep philosophical disagreements
  - Has practical implementation consequences
  - The user clearly understands the theoretical landscape

  The user wants:
  1) A diagnosis of the disagreement nature
  2) Where their hunch might be wrong
  3) What would constitute progress
