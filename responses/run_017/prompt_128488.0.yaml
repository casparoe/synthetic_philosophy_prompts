  ## The Ground of Geometry: A Hobbesian Quarrel

  **Setting:** A worn but comfortable study. Books piled haphazardly. MARISOL (mid-30s, precise, leans forward intently) and THEO (late 40s, rumpled, gestures broadly) face each other across a table cluttered with papers and a half-dismantled compass.

  **THEO:** (Picking up the compass, fiddling) Seriously, Marisol, this verbal reading you’re pushing… it flattens Hobbes into a logic-chopper. He didn’t just *say* geometry is certain; he grounded it in *making*. The point *moves*, the line *swings* – that’s the heart of it! We build these figures in our minds, step by step, so we *know* their causes utterly. That’s why it’s science! It’s not just word games.

  **MARISOL:** (Tapping a finger decisively on the table) Word games? Hardly. But the necessity *is* in the speech, Theo. The definitions fix the meanings: "A circle *is* the figure described by rotating a straight line fixed at one end." Once you accept *that* stipulation, all the properties – equal radii, constant curvature – follow logically. The construction bit? It’s how we *grasp* it, how we illustrate it, maybe even how we first come up with the definition. But the engine of certainty is deduction from agreed-upon names. The ‘making’ is psychological scaffolding, not metaphysical bedrock.

  **THEO:** Scaffolding? Then why is geometry the *only* real science for Hobbes? Why does he think physics *could* be like it someday? If certainty is just about fixing definitions and following logic, then why couldn't we have a 'science of griffins'? Define 'griffin' as 'lion-bodied, eagle-headed, breathes fire', and boom! Necessary truths about griffins! But Hobbes *specifically* says geometry is privileged because we *make* its objects – bodies in motion – unlike griffins, or even fully understood physical phenomena *yet*.

  **MARISOL:** (Leans back, considering) Fair push. But the griffin case is a red herring. Hobbes is a thorough nominalist, yes, but he’s also a materialist obsessed with motion. He thinks physics *could* become scientific *if* we could resolve complex motions down to their simplest universal components and then recompose them, just like resolving a complex figure into points and motions. The definitions in physics *wouldn't* be arbitrary stipulations; they'd be *discovered* names for those fundamental motions we uncover. Geometry’s privilege isn't magic; it's that we get to *stipulate* the fundamental motions at the start because we invent the objects. Physics has to *find* them. The logic of deduction is the same; the source of the primitives differs.

  **THEO:** (Points the compass at her) Ah! But that ‘stipulation’ in geometry only *works* because the definition *states a possible production*. You can’t just *stipulate* any old impossible motion and get a science! Try defining a triangle as "a figure with four sides." Nonsense! Or define a circle by saying "all points are equally distant from a center" without mentioning how it’s *made*. For Hobbes, that’s a *bad* definition because it doesn’t state the cause! The definition *must* capture a conceivable act of generation – *that* constraint comes from nature, from what motions we can conceive and imagine performing. That’s where the causal power lives!

  **MARISOL:** (Eyes narrow) And *there’s* your bootstrapping problem, Theo. Where does *that* conceivability come from? Hobbes says the images we manipulate – these 'phantasms' – are just decaying sense impressions, motions *in us* caused by external bodies. They’re contingent! They depend on how our meat-machines work and what bumps into our senses. So, if geometrical necessity rests on what constructions we can *imagine* based on these shaky phantasms… then geometry’s certainty rests on empirical, contingent facts about human psychology or physiology! That’s precisely the quicksand Hobbes wanted geometry to *escape* when he contrasted it with the conjectures of physics. You’ve made geometry a branch of physics!

  **THEO:** (Runs a hand through his hair, frustrated) No, no… it’s not that contingent! The *capacity* for conceiving certain fundamental motions – translation, rotation – is perhaps basic to having a mind capable of sense and imagination *at all*, given Hobbes's mechanical picture. The definitions aren't arbitrary *because* they must state motions that are, in principle, universally conceivable within that mechanical framework. It’s nature constraining the *starting points*, Marisol, not dictating the conclusions. The *demonstration* itself, the recomposition, is still necessary inference from those correctly grounded definitions.

  **MARISOL:** But you’ve smuggled in an empirical hinge! "Universally conceivable"? Based on what? Our shared, contingent human make-up? Hobbes needs geometry’s necessity to be absolute, prior to any empirical discovery. Your causal story drags it back into the world of decay and motion he’s trying to rise above. My verbal reading keeps it pristine: fix the names correctly (which includes capturing conceivable production, I grant, as *part* of the stipulation's coherence), and the logic does the rest, untouched by the messiness of decaying sense.

  **THEO:** (Sighs, puts the compass down) Okay, let’s test this on Hobbes’s own folly: the circle-squaring. He thought he’d found a way, his critics tore it apart using standard geometrical arguments from definitions. On *your* reading, Marisol, that’s just… what? Hobbes made a logical error? A bad inference from the definitions? End of story, no deeper implication for his philosophy?

  **MARISOL:** Precisely! People make mistakes in deduction. The fact that Wallis or whoever refuted him using the *same* method – deduction from definitions – proves the point! The verbal framework worked perfectly well to identify the error. The ‘making’ part didn’t save Hobbes, and its absence didn’t hinder his critics. The definitions-only picture is what functioned in practice.

  **THEO:** (Leans forward intensely) But that’s too clean! Hobbes *behaved* as if having a construction *was* evidence of truth. He clung to his faulty squaring for *years*, dismissing critics who showed contradictions, precisely *because* he felt he had the constructive process clear in his mind. He trusted the causal story – the feeling of building it step-by-step – *more* than the verbal contradictions. Doesn’t that suggest that *for him*, the construction wasn’t just pedagogy, it was the source of the conviction, the ground of the certainty? His error was a failure of construction, not just logic. And his refusal to see the logical refutation stemmed from his misplaced faith in the constructive method as the guarantor.

  **MARISOL:** Or it just shows he was stubborn and bad at seeing the implications of his own definitions! People make logical errors and dig their heels in all the time. It doesn’t necessitate some deep philosophical grounding in construction. The refutations succeeded *because* they used the verbal method correctly.

  **THEO:** And the refutations *assumed* the standard constructive definitions! They didn’t work from arbitrary stipulations. "A circle *is* made by rotation..." was baked in.

  **MARISOL:** As part of the coherent verbal framework! Look... (Takes a breath, calmer) We’re circling each other. Here’s the crux, I think: You think the necessity of geometry *depends* on the causal story being real – that we *do* construct these objects in a way that gives us privileged access. I think the causal story is just Hobbes’s way of *explaining* how we arrive at reliable definitions, but the necessity is generated entirely by the logical relations between those definitions once fixed. The ‘making’ is epistemological origin, not ontological ground.

  **THEO:** (Nods slowly) That’s… actually a fair restatement. And for me, the cost of *your* view is that it makes geometry’s unique privilege and Hobbes’s hope for physics seem thin, almost accidental – ‘We get to define the primitives here, but not there.’ And it doesn’t explain his intense focus on construction as *constitutive*. The cost of *my* view is the bootstrapping – grounding certainty in capacities rooted in our physical being. But maybe Hobbes thought that foundation was rock-solid enough.

  **MARISOL:** Whereas I think that foundation is sand, compared to the adamant of pure logic. One thing would settle it: If we found Hobbes explicitly saying that a geometrically impossible figure could be coherently defined and yield necessary truths *without* a possible construction. Or vice versa – that a constructive definition is invalid if it leads to verbal contradiction. But he dances around it.

  **THEO:** He does. Though I’d wager his money was on the moving point and the swinging line. The feeling of making it true, right here. (He mimes drawing a line in the air). That’s where the certainty lived for him.

  **MARISOL:** (Smiles faintly) And I’d wager it was the cold, clear chain of names in the mind. The feeling of *seeing* the necessity unfold. Different certainties, Theo. Different certainties. (She gathers her papers). Same time next week? We tackle the sovereign?

  **THEO:** (Chuckles, gathering the compass parts) Only if we agree geometry is certain first. Deal?

  **MARISOL:** (Standing) Never. But I’ll bring the coffee. **(They exchange a look of mutual, slightly exasperated respect and head out.)**

  ---

  **Word Count:** ~1080

  **Key Elements Addressed:**
  *   **Equal Engagement & Personality:** Marisol is analytical, precise, slightly dismissive of Theo's "messy" causal view. Theo is passionate, historically minded, frustrated by Marisol's "sterile" logic. They interrupt, challenge, restate each other's positions.
  *   **Verbal vs. Causal:** Core conflict established and debated throughout.
  *   **Marisol's Challenge (Physics & Bodies):** She bites the bullet – geometry's privilege is self-stipulation. Theo presses, forcing her to clarify that physics definitions must be *discovered* motions.
  *   **Theo's Challenge (Bootstrapping):** Marisol hammers the contingency of phantasms. Theo counters that conceivable motions are constrained by nature/universal mind-mechanics, but Marisol points out the empirical hinge.
  *   **Circle-Squaring Case:** Used concretely – Marisol sees error in deduction; Theo sees error stemming from misplaced faith in construction as proof.
  *   **Restatement & Cost:** They explicitly restate each other's core position and identify the key cost (thin privilege/bootstrapping).
  *   **Unresolved Ending:** Agree on what *would* settle it (impossible definitions or contradictions trumping construction) but acknowledge Hobbes doesn't provide it. Theo's last hint suggests the textual weight leans towards construction, but Marisol holds her ground. No collapse.
  *   **Casual Register & No Lectures:** Dialogue flows naturally with interruptions, gestures ("points the compass"), colloquialisms ("red herring," "meat-machines," "dig their heels in").
