  ### Grading Comments (Keyed to Answer Lines)

  1.  **"Weakness of the will is acting against one's own better judgment: at the moment of action the agent holds that A is, all things considered, the better option, and she intentionally does B instead."** (Lines 1-3)  
      **+5 points.** This sentence provides a precise and correct definition of synchronic weakness of will (akrasia) as requested, explicitly linking the judgment ("all things considered, the better option") and intentional action ("intentionally does B") at the moment of choice, capturing the core philosophical puzzle.

  2.  **"The quasi-hyperbolic model captures this by discounting each future period at a constant per-period factor delta and applying an additional factor beta, less than one, to any reward available now."** (Lines 8-10)  
      **-1 point (Deducted).** This misstates the quasi-hyperbolic (beta-delta) model. Beta applies to *all future periods*, not just rewards "available now." Correctly: beta (β < 1) is applied to *any reward not received immediately in the current period* (t=0), while delta (δ) discounts per period into the future. The phrase "available now" mistakenly confines beta's effect to immediate rewards.

  3.  **(Missing Distinction)**  
      **-5 points (Deducted).** The answer fails to explicitly distinguish *declining impatience* (common-difference effect) from *simple present bias* as required by part (i). While the common-difference effect is described correctly (Lines 6-8), simple present bias (e.g., valuing "now" much more than any future time, but valuing t+1 vs. t+2 similarly) is not mentioned or contrasted. Correctly: Declining impatience implies changing discount rates over time horizons (generating preference reversals), while present bias is a general overweighting of the immediate present relative to all futures, which may or may not cause reversals depending on the model.

  4.  **"The sophisticated agent foresees her own reversal accurately; seeing herself about to do what she judges worse, she does it anyway, and so she is the clearest case of akrasia. The naive agent merely expects to follow through and is surprised when she does not; since she never acted in the light of a genuine all-things-considered judgment about what she was about to do, she is not, strictly speaking, weak-willed."** (Lines 17-21)  
      **+5 points.** This correctly and clearly distinguishes naive vs. sophisticated agents and offers a compelling argument for why the sophisticated case aligns with synchronic akrasia (foreseeing the imminent reversal and acting against the *current* "better judgment"), while the naive case does not (lacking the crucial synchronic judgment conflict at the moment of action).

  5.  **"the agent who today ranks the reward at t+2 above the one at t+1 will reverse that ranking once she reaches t+1... and will likewise reverse her ranking of t+3 against t+2 when she arrives at t+2."** (Lines 10-13) & **"At t+1 the agent still judges, all things considered, that the larger later reward is the better one"** (Lines 14-15)  
