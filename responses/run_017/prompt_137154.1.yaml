prompt: |-
  I am circulating a paper to my department's work-in-progress session next month and, before I do, I would like an audit of the position I have ended up holding about reasons. I set out to write a fairly ordinary defense of internalism and have finished with a package of commitments that I cannot get to sit still. Several colleagues have told me the package is inconsistent, but they have not pointed at the same joint, which makes me suspect at least some of the accusations are wrong. I would like to know which are.

  Here is the set, stated as flatly as I can manage.

  1. Internalism in the route formulation: a consideration counts as a reason for an agent to act only if she could arrive at the conclusion that she should so act by a sound deliberative route from her subjective motivational set as it actually is. I reject the externalist claim that there are considerations that are reasons for an agent simply in virtue of her being a rational agent, whatever she happens to care about.

  2. Route-possibilism: the route in (1) need not be one this agent could in fact follow. It is enough that a sound route exists from her set as it stands. This is what lets me say that the host who has no way of discovering that her guest is allergic still has a reason not to serve the dish, and that the man who cannot read the label still has a reason not to drink what is in front of him.

  3. No ex nihilo: sound deliberation may correct factual error, add true belief, trace means-end chains, and expose elements of the set to rational pressure from other elements. It may not install a wholly new end that nothing already in the set gestures at. Without this constraint I do not see what distinguishes internalism from a disguised externalism.

  4. Reasons for non-deliberators: I want to say that a two-year-old and a dog can have reasons, and not merely that their caretakers have reasons concerning them. This is a verdict I am unwilling to give up; it is doing real work in my other writing.

  5. Global defect: I hold that some motivational sets are defective as wholes, not merely element by element. That is, for some agents, every element of the set is such that the agent has reason not to be moved by it, and there is an intelligible critical judgement to that effect which is not just a report of what the critic happens to care about.

  6. An access condition on blame: an agent is open to blame for failing to act only if she could have discerned, by deliberation of the kind available to her, that she had reason so to act. I hold this because I think blame without any such access is unfair, and I do not want to give it up.

  7. Two case verdicts. The comfortable indifferent, who is fully informed, free of reasoning error, and simply unmoved by the suffering of others, has no reason to aid them. But the severely depressed patient does have a reason to accept treatment even when she sincerely and lucidly reports that nothing matters to her any more.

  8. A methodological constraint: the point of tying reasons to the motivational set is that reasons should be able to figure in the explanation of action. A consideration that could not figure in the explanation of any action by anyone, even in principle, is not a reason at all. This is why I became an internalist rather than a moral realist of the externalist kind, and I would not treat dropping it as a free move.

  What I want from you is the audit, not a survey of the literature. Which pairs of these are genuinely in tension, and which only look as though they are? Order the real tensions by severity, and for each say precisely what would have to give: which commitment would have to be weakened, restated, or qualified, and what the restatement would cost me elsewhere in the set. Where an apparent tension dissolves, tell me what generates the appearance. If one revision cleans up more than one joint at once, say so, and say whether it is a revision an internalist could accept or only a way of leaving internalism behind. Assume I would rather pay almost any cost inside the set than be told simply to abandon internalism, but do not spare me if the cost accounting really does point there.
reasoning: |-
  Okay, the user is a philosopher preparing for a work-in-progress session and wants an audit of their internalism position. They've listed eight commitments and are concerned about inconsistencies. I need to identify genuine tensions, order them by severity, and suggest possible revisions.

  First, I'll examine each commitment closely. The user rejects externalism in (1) but allows for route-possibilism in (2), meaning agents can have reasons even if they can't access them. However, (3) prevents adding entirely new ends during deliberation. That seems tricky because (5) talks about globally defective sets where every element is problematic. How can deliberation fix that if no sound route exists?

  (4) states that non-deliberators like children and dogs have reasons. But since they can't deliberate, this conflicts with (1)'s requirement of a sound deliberative route. The user is unwilling to drop this, so I'll need to find a workaround.

  (6) introduces an access condition for blame, which connects to (2) but might clash with (7)'s case of the severely depressed patient. The patient has a reason to seek treatment despite their inability to access it, yet (6) might excuse blame due to lack of access. How does that align?

  (7) presents two verdicts: the indifferent person has no reason to aid others, but the depressed person does. The difference seems to hinge on whether their motivational sets are defective. The indifferent person's set lacks concern for others, while depression might distort existing concerns. But (3) prohibits adding new ends, so how does the depressed person have a reason?

  (8) ties reasons to explanatory roles in action. If a consideration can't motivate anyone, it's not a reason. This supports internalism but might conflict with global defects in (5) if no sound route exists from the set.

  Major tensions include:
  - (1) and (4): Non-deliberators can't have deliberative routes, so how do they have reasons? The user might need to modify (1) to include non-deliberative routes or accept that reasons for non-deliberators are different.
    
  - (5) and (1)/(2)/(3): Globally defective sets may have no sound deliberative routes. If no route exists, how can there be reasons? The user might need to allow that such agents have no reasons or introduce a minimal rationality standard.

  - (6) and (7): The depressed patient has a reason but can't access it. (6) says they shouldn't be blamed, but the user wants to affirm they have a reason. This requires clarifying that having a reason doesn't imply blameworthiness without access.

  Lesser tensions involve (7) and (3). The depressed patient's reason might come from latent elements in their set, like self-preservation, avoiding (3)'s prohibition. The indifferent person lacks any such elements. Also, (2) and (6) might conflict if an agent has a reason they can't access but (6) excuses blame. But since (6) is about blame, not reasons, they can coexist if distinguished.

  To resolve:
  - For (1) and (4), introduce non-deliberative routes or a dispositional account of motivational sets for non-deliberators.
  - For (5), allow that globally defective sets may still have latent elements that can generate reasons under ideal deliberation, or accept that such agents have no reasons but that's a cost.
  - Reconcile (6) and (7) by emphasizing that access is necessary for blame, not for having reasons.

  The user might resist abandoning internalism, so revisions should stay within internalism. Costs include complicating the theory or accepting that some agents lack reasons. The user must weigh these against their commitments.
answer: |-
  Here is a systematic audit of your commitments, ordered by the severity of genuine tensions (most severe first). I distinguish *genuine tensions* (logical or near-logical inconsistencies under plausible interpretations) from *apparent tensions* (where commitments *seem* to clash but can be reconciled with careful restatement or clarification). For each genuine tension, I specify what must give, the cost of revision, and whether it preserves internalism. Apparent tensions are explained briefly.

  ---

  ### **Genuine Tensions (Ordered by Severity)**

  #### **1. Tension between (4) Reasons for Non-Deliberators and (1)/(2) Route-Possibilism**  
     - **Nature of tension**: (1) and (2) tie reasons to the existence of a *sound deliberative route* from the agent’s subjective motivational set (S). But (4) claims non-deliberators (e.g., dogs, toddlers) can have reasons. This is inconsistent because non-deliberators lack the capacity for deliberation altogether—no "route" exists for them, even in principle. Route-possibilism (2) doesn’t help, as it still requires a *deliberative* route (even if unrealizable by the agent).  
     - **What must give**: You must either:  
       (a) **Drop (4)**: Abandon the claim that non-deliberators have reasons (cost: undermines your other work relying on this).  
       (b) **Revise (1)/(2)**: Redefine "deliberative route" to include *non-deliberative* processes (e.g., instinct, perception) for non-deliberators. For example, "a sound route" could mean a *dispositional* or *counterfactual* path where the agent’s S *would* motivate action *if* they had deliberative capacity (e.g., a dog’s pain-avoidance instinct "points" to a reason not to be harmed).  
     - **Cost**: (b) stretches "deliberative route" beyond recognition, risking ad hocness. It may collapse into a crude desire-based view (e.g., "reasons exist if S contains a relevant desire/aversion"). This weakens your internalism by diluting the rational/normative force of deliberation.  
     - **Internalism-preserving?** Yes, if "route" is broadened to include primitive goal-directedness. But it risks blurring internalism with naturalistic realism.  

  #### **2. Tension between (5) Global Defect and (1)/(2)/(3) No Sound Route from S**  
     - **Nature of tension**: (5) claims some agents have S-sets where *every* element is defective (e.g., a deeply corrupted agent who values only torture). Yet (1)/(2) require a sound deliberative route from S to generate reasons, and (3) forbids adding new ends. But if *every* element in S is such that the agent has reason *not* to be moved by it, no sound route can exist: any deliberation would either start from a defective element (invalidating the route) or require adding a new end (violating (3)). Thus, (5) implies no reasons exist for such agents, contradicting the spirit of (5) that they *ought* to change.  
     - **What must give**: You must either:  
       (a) **Weaken (5)**: Deny that *every* element is defective; argue that even in corrupt S-sets, there are latent/weak elements (e.g., self-preservation, curiosity) that *could* generate reasons under ideal deliberation (e.g., "torture is unsustainable long-term").  
       (b) **Revise (1)/(3)**: Allow that sound deliberation *can* install new ends when S is globally defective (e.g., "rational self-correction" as an implicit element). But this violates (3) and risks externalism.  
     - **Cost**: (a) may force implausible reinterpretations of S (e.g., attributing "hidden" rational elements to Nazis). (b) abandons (3), collapsing into disguised externalism.  
     - **Internalism-preserving?** (a) preserves it; (b) does not.  

  #### **3. Tension between (6) Access Condition for Blame and (2) Route-Possibilism**  
     - **Nature of tension**: (2) allows reasons to exist even when the agent *cannot* access them (e.g., the host can’t discover the allergy). But (6) states that blame requires the agent *could have discerned* the reason via their available deliberation. If a reason exists but is inaccessible (per (2)), then failing to act on it *cannot* warrant blame (per (6)). This implies that in cases like the allergy host, they have a reason but are *never* blameworthy for ignoring it—even if they *could* have accessed it with trivial effort (e.g., they forgot to ask). This undermines (6)’s fairness intuition: blame seems appropriate for negligent ignorance.  
     - **What must give**: You must either:  
       (a) **Qualify (2)**: Require that the sound route must be *feasible* for blame-contexts (e.g., "could have accessed with reasonable effort").  
       (b) **Revise (6)**: Allow blame when the agent *should* have accessed the reason (e.g., via epistemic duties), even if they couldn’t via *actual* deliberation.  
     - **Cost**: (a) creates a bifurcated view of reasons (stronger for blame, weaker otherwise). (b) detaches blame from internalist reasons, appealing to external norms.  
     - **Internalism-preserving?** (a) preserves it; (b) leans externalist.  

  #### **4. Tension between (7) Two Case Verdicts and (3) No Ex Nihilo**  
     - **Nature of tension**: (7) claims the depressed patient has a reason to seek treatment despite no current cares. But (3) forbids deliberation from installing new ends not gestured at by S. If the patient’s S contains *nothing* that "gestures at" self-care (e.g., she rejects all values), then (3) blocks any reason. Conversely, the indifferent person’s S *does* gesture at self-interest (so no reason to aid others fits (3)). To avoid inconsistency, the depressed patient’s S must retain *some* element (e.g., latent desire for relief) that "gestures at" treatment. But (7) states she is "sincerely and lucidly" devoid of cares, suggesting no such element exists.  
     - **What must give**: You must **reinterpret (7)** or **(3)**: Argue that depression *distorts* S but doesn’t erase it—e.g., the patient retains a dispositional desire for non-misery, which "gestures at" treatment. This respects (3). The indifferent person lacks even this toward others.  
     - **Cost**: Risks circularity (defining S to always "gesture" at reasons we intuit). May force contentious empirical claims (e.g., all humans have latent self-care desires).  
     - **Internalism-preserving?** Yes, if S is construed dispositionally.  

  ---

  ### **Apparent Tensions (Resolvable with Clarification)**

  #### **1. (2) Route-Possibilism vs. (6) Access Condition**  
     - **Why apparent?** (2) says reasons can exist without access; (6) says blame requires access. No tension: reasons ≠ blameworthiness. You can coherently hold that the allergy host has a reason (via (2)) but isn’t blameworthy if she couldn’t access it (via (6)).  
     - **Resolution**: Stress that (6) is a constraint on *blame*, not reasons. The appearance arises from conflating normativity and accountability.  

  #### **2. (5) Global Defect vs. (8) Methodological Constraint**  
     - **Why apparent?** (5) suggests globally defective agents have reasons to change, but (8) ties reasons to explanatory power. If no sound route exists from S, how can reasons explain action? But (8) says reasons must be *capable* of explaining action *in principle* (e.g., via idealized agents). Globally defective S might still support reasons *if* corrected, so they could explain action post-correction.  
     - **Resolution**: Emphasize "in principle" in (8). The tension dissolves if globally defective S is seen as *corrigible* (e.g., via external intervention).  

  #### **3. (3) No Ex Nihilo vs. (7) Depressed Patient**  
     - **Why apparent?** As above, if depression doesn’t annihilate S but masks it, (3) isn’t violated. The patient’s reason arises from *existing* elements (e.g., biological drives), not ex nihilo.  

  ---

  ### **Strategic Recommendations**  
  - **Most impactful revision**: Address the **non-deliberators (4)** tension first. Revising (1)/(2) to include *non-deliberative routes* (e.g., "goal-directed pathways") resolves this and *also* helps the **global defect (5)** tension: even corrupt agents might have primitive goal-directedness (e.g., avoiding pain).  
    - **Cost**: This broadens "deliberation" significantly, potentially reducing internalism’s distinctiveness. But it preserves core internalism by tethering reasons to S.  
  - **Minimal revision path**:  
    1. **Clarify S as dispositional** (for (4), (5), (7)): S includes latent/dispositional elements (e.g., a depressed person’s dormant self-care drive). This resolves tensions with (3) and (7) without altering commitments.  
    2. **Bifurcate blame/reasons** for (6): Maintain that reasons require only possible routes (2), but blame requires *accessible* routes. Add an "epistemic responsibility" clause to (6) (e.g., "could have discerned *given their epistemic position*").  
    3. **Abandon global defect (5) as literal**: Rephrase as "practically global" defect (most elements corrupt), preserving a minimal basis for reasons.  

  **Can internalism be saved?** Yes, with revisions. The cost is a **richer, more dispositional conception of S** and a **separatist account of blame**. This avoids externalism but may dissatisfy purists who prize deliberation. If you reject dispositionalism, the non-deliberator problem (4) may force you toward externalism or scalar internalism (degrees of reasonhood).  

  **Final note**: Your package is unstable but not doomed. The tensions arise from admirable ambitions—extending internalism to non-deliberators, avoiding externalism, and preserving fairness. A restated internalism that treats S as a set of *dispositions* (not just occurrent states) and distinguishes *reasons* from *blame* can cohere. Prioritize resolving (4) and (5), as they are the severest.
