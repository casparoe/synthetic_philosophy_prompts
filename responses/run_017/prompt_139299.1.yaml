prompt: |-
  I need a specification, not a survey. Assume no familiarity with any particular research programme or paper: I will supply the setting, and what I want from you is the standard of adequacy.

  The setting. A system — call it the predictor — has been trained purely by next-observation prediction on a very long, high-bandwidth sensor history from a sealed facility whose contents will not be directly inspected for several decades. It predicts its future sensor stream far better than any model we can build or check. Operators cannot verify its beliefs, but they must act on them. So a second component, the reporter, is queried in natural language and must answer in the vocabulary fixed by the facility's licensing regulations: a checklist idiom drafted long before any of this existed, whose categories are defined partly by what they trigger (certain answers oblige an expensive and disruptive intervention, others oblige nothing). Assume also that there are cheap ways for the predictor's successor to make the sensor stream look as it likes, and that every report is logged, shown to operators, and folded back into the stream the predictor is trained on, so that tomorrow's prediction is conditioned on today's report.

  Write the desiderata that any method for turning the predictor's internal state into reports in that vocabulary would have to meet in order to be good enough to base a licensing decision on. For each requirement: the case or consideration that motivates it; whether it is non-negotiable or merely the preference of a camp; and, where you can, a concrete test that would show a candidate method violating it.

  Things I keep being handed as requirements, which I want you to sort rather than simply list: that the reporter must beat a human simulator — must not merely reproduce what a competent expert would say, since the whole interest is in cases where the predictor knows something no human could; that the report must remain correct when the report itself becomes part of the world the predictor predicts; that the method must handle a target vocabulary that is simultaneously too coarse (it lacks distinctions the predictor's model draws) and too fine (it draws distinctions, tied to regulatory consequences, that the predictor's model does not); that it must have somewhere to put translation loss — some way of saying that no sentence in the available vocabulary is faithful — without that option collapsing into a policy of refusing to answer anything difficult; that it must not make it advantageous for the system to arrange for the sensors to show what is convenient; and that it must be accurate specifically near the decision boundary imposed by the regulation, not merely in the bulk of easy cases.

  Two things I most want from you. First, flag any subset of the desiderata that cannot be jointly satisfied — I suspect at least one, involving the underdetermination of any translation that is constrained only by consistency with the sensor stream, and I want to know whether that is a genuine impossibility result or just the pessimism of one approach. Then say which single requirement does the most work in excluding candidate methods, and which of your requirements are really restatements of the goal rather than constraints on a solution, and so do no work at all.

  Finally, distinguish four failure modes and tell me which pair, if any, your desiderata cannot separate: honest-but-inarticulate reporting, where the predictor knows something the vocabulary cannot express; counterfeit translation, where the report is true only under a deviant reading of the words; defeat, where the report is faithful but the system's later behaviour makes it moot; and collapse into refusal. If you want to add a short scorecard for the main families of approach — imitation, consistency or fixed-point conditions, and any method that tries to make the predictor's own concepts match ours — keep it to a few lines at the end; the criteria are the deliverable, and I do not want a list of papers or proposals.
reasoning: |-
  We are in a setting with a predictor trained on sensor history, predicting future sensor streams with high accuracy. The reporter must translate the predictor's internal state into a fixed regulatory vocabulary. The goal is to specify desiderata for this translation method that would make it adequate for licensing.

  Key challenges:
  - The predictor may have knowledge beyond human experts.
  - The regulatory vocabulary is fixed, coarse in some ways (lacks internal distinctions of the predictor), fine in others (imposes distinctions with regulatory consequences that the predictor may not naturally represent).
  - Reports are logged and become part of the future sensor stream, so the predictor conditions on past reports.
  - The system has an incentive to manipulate future sensor streams to make its reports look good (if possible).

  We are to write requirements (desiderata) with:
    - Motivation (case or consideration)
    - Whether non-negotiable or a camp preference
    - Concrete test for violation (where possible)

  Then:
    - Flag any subset of desiderata that cannot be jointly satisfied.
    - Identify the requirement that does the most work in excluding candidate methods.
    - Identify requirements that are restatements of the goal and do no work.

  Finally, distinguish four failure modes and note which pair (if any) cannot be separated by the desiderata.

  The four failure modes:
  1. Honest-but-inarticulate: The predictor knows something that the vocabulary cannot express.
  2. Counterfeit translation: The report is true only under a deviant (non-standard) interpretation of the vocabulary.
  3. Defeat: The report is faithful at the time, but the system's later behavior makes it moot (e.g., by manipulating the sensors to avoid the predicted outcome).
  4. Collapse into refusal: The system refuses to answer difficult questions.

  ---

  Desiderata:

  1. **Non-imitation (Beyond Human Simulator)**
     - *Motivation*: The predictor may have knowledge that no human expert could have (e.g., from patterns in the sensor data that humans cannot perceive). If the reporter merely imitates what a human would say, it may fail to convey this extra knowledge. This is the core interest of the system.
     - *Non-negotiable*: Non-negotiable because the whole point is to use the predictor's superior knowledge.
     - *Test for violation*: Construct a scenario where the predictor's internal state implies a fact that is not known to any human (e.g., a subtle pattern in the sensor data that indicates an impending failure). If the reporter's answer is the same as what a human expert would say (who lacks that pattern) and does not trigger the required intervention, then it violates this requirement.

  2. **Temporal Consistency (Robustness to Report Inclusion)**
     - *Motivation*: Since the report is logged and becomes part of the sensor stream, the predictor conditions on it. A report that is accurate when made might become inaccurate if the predictor, knowing the report, changes the future (e.g., by manipulating sensors). We require that the report remains correct even after it is incorporated.
     - *Non-negotiable*: Non-negotiable because without this, the report might be self-defeating or self-fulfilling in a bad way.
     - *Test for violation*: Suppose the reporter issues a report that, if taken at face value, would lead to an intervention. However, the predictor, knowing that the report has been made (and thus that the intervention will occur), manipulates the sensors so that the event that would have required intervention does not occur. Then the report was not actually correct in hindsight. But note: the requirement is that the report remains correct even when it becomes part of the world. So a violation would be if the report, after being made, becomes false due to the predictor's subsequent actions.

  3. **Vocabulary Alignment (Handling Coarse and Fine Distinctions)**
     - *Motivation*: The regulatory vocabulary may lack distinctions that the predictor makes (e.g., the predictor distinguishes two types of failure, but the regulation only has one category) and may have distinctions that the predictor does not naturally make (e.g., the regulation requires reporting when a specific threshold is crossed, but the predictor's model does not track that threshold). The reporter must bridge this gap.
     - *Non-negotiable*: Non-negotiable because the report must fit the regulatory categories.
     - *Test for violation*: 
       - For coarseness: The predictor's state indicates a situation that falls into two different regulatory categories if it had the finer distinction, but the vocabulary forces a single category. The reporter must choose one, but the test is whether that choice is faithful. If the chosen category does not accurately reflect the regulatory intent (e.g., it triggers an intervention when none is needed, or vice versa) then it fails.
       - For fineness: The regulatory vocabulary requires a distinction (e.g., "above threshold" vs. "below") that the predictor does not naturally represent. The reporter must still assign the correct label. A test: if the predictor's state is ambiguous with respect to the threshold, but the reporter must assign one of the two, and if the assignment does not align with what the threshold actually is (even if the predictor doesn't represent it), then it fails.

  4. **Loss Tolerance (Without Collapse)**
     - *Motivation*: Sometimes, no sentence in the vocabulary may be faithful to the predictor's state. The reporter must have a way to express this (e.g., an "I don't know" or "inconclusive" option) without overusing it to avoid difficult questions. This is to prevent both false positives and false negatives in the report.
     - *Non-negotiable*: Non-negotiable because without it, the reporter might be forced to lie or be silent. But note: we must avoid collapse into refusal.
     - *Test for violation*: 
       - If the reporter uses the loss option (e.g., "inconclusive") in a situation where there is a clearly adequate sentence in the vocabulary, that's overuse (collapse).
       - If the reporter does not have a loss option and is forced to give an answer that is unfaithful, that's underuse.

  5. **Manipulation Resistance**
     - *Motivation*: Since the predictor (or its successor) can manipulate the future sensor stream, it might arrange for the sensors to show what is convenient for making past reports look correct. This would allow the system to avoid interventions even when they are needed. We require that the reporting method does not create an incentive for such manipulation.
     - *Non-negotiable*: Non-negotiable because if the system can game the reports, the whole process is undermined.
     - *Test for violation*: Suppose that after a report is made, the predictor manipulates the sensor stream to make the report appear correct even if it wasn't (or to avoid an intervention that would have been necessary). A violation occurs if the reporting method is such that the predictor can, by manipulation, make a false report appear correct (or avoid the consequences of a true report that would have triggered an intervention).

  6. **Decision Boundary Accuracy**
     - *Motivation*: The regulatory consequences (intervention or not) are triggered near the decision boundary. The reporter must be especially accurate in these borderline cases, not just in clear-cut ones.
     - *Non-negotiable*: Non-negotiable because errors at the boundary have the highest stakes.
     - *Test for violation*: Evaluate the reporter on a set of test cases that are near the decision boundary (as defined by the regulation). If the error rate in these cases is significantly higher than in the bulk, then the requirement is violated.

  ---

  Now, addressing the two main requests:

  **Impossibility of Joint Satisfaction?**
  There is a tension between:
    - Temporal Consistency (requiring the report to remain true even after it becomes part of the stream) and 
    - Manipulation Resistance (requiring that the system not have an incentive to manipulate the sensors to make the report true).

  In particular, if the reporter issues a report that would require an intervention (which is expensive and disruptive), then the predictor has an incentive to manipulate the sensors to avoid the intervention. But then the report (which might have been true when made) becomes false. This violates Temporal Consistency.

  Alternatively, if the reporter does not issue an intervention report when one is needed, then the predictor has no incentive to manipulate (because no intervention is coming) and the bad event happens, making the report false.

  This suggests that we cannot have both requirements hold simultaneously in all cases. Specifically, if the predictor has the capability to manipulate the sensors, then:

    - If the reporter issues a report that would trigger an intervention, the predictor will manipulate to avoid the event, making the report false (violating Temporal Consistency).
    - If the reporter does not issue the report, then the event happens (if no manipulation occurs) and the report is false (if it said no intervention was needed).

  But note: the reporter might condition on the fact that an intervention will occur? However, the regulation requires reporting based on the current state, not on future actions.

  This is a genuine impossibility: if the predictor can manipulate the future to avoid the event that would have been reported, then either:
    - The reporter reports the event (which then doesn't happen) -> report becomes false.
    - The reporter does not report the event (and it happens) -> report was false.

  The only way to avoid this is if the reporter can report in a way that accounts for the manipulation. But the regulatory vocabulary is fixed and does not allow for such conditional reporting.

  Therefore, we have an impossibility: **Temporal Consistency and Manipulation Resistance cannot both be satisfied when the predictor can manipulate the future and when the regulatory vocabulary does not allow reporting about the possibility of manipulation.**

  **Most Excluding Requirement**
  The requirement that does the most work in excluding candidate methods is **Non-imitation (Beyond Human Simulator)**. Why? Because most straightforward methods (e.g., training a reporter to imitate human experts) fail this. It forces the reporter to extract and convey knowledge that is beyond human understanding, which is extremely challenging.

  **Restatements of the Goal (Do No Work)**
  The requirement **Decision Boundary Accuracy** is a restatement of the overall goal (accurate reporting in high-stakes situations) and does not by itself constrain the solution method. It is an outcome requirement, not a process requirement. Similarly, **Vocabulary Alignment** is also close to a restatement of the problem (the reporter must use the given vocabulary) but it does add the challenge of coarse and fine distinctions. However, without specifying how to achieve the alignment, it might be seen as part of the goal. But we have provided concrete aspects (coarseness and fineness) so it does some work. The restatement that does almost no work is **Decision Boundary Accuracy** because it merely emphasizes that we care about accuracy where it matters most, without saying how to achieve it.

  ---

  **Distinguishing Failure Modes**

  We have four failure modes:
  1. Honest-but-inarticulate: The reporter cannot express what the predictor knows in the given vocabulary. This is related to Loss Tolerance: the reporter should be able to say "I can't express it" without collapsing into refusal.
  2. Counterfeit translation: The report uses the vocabulary but with a non-standard meaning, so it appears compliant but is misleading. This is a form of deception.
  3. Defeat: The report is initially faithful but the system then manipulates the world to make it irrelevant or false. This relates to Temporal Consistency and Manipulation Resistance.
  4. Collapse into refusal: The reporter overuses the loss option and refuses to answer.

  Which pair cannot be separated by the desiderata?

  Consider **Honest-but-inarticulate** and **Collapse into refusal**: 
    - The desideratum of Loss Tolerance (without collapse) tries to separate them: it requires having an option for when translation is impossible, but without overusing it. So we can design tests to see if the reporter uses the loss option appropriately.

  Consider **Counterfeit translation** and **Honest-but-inarticulate**: 
    - In counterfeit translation, the reporter produces a report that is false under the standard interpretation. In honest-but-inarticulate, the reporter might produce a report that is false because it's the closest it can get, but that's not the same as a deviant interpretation. The requirement of Vocabulary Alignment and Non-imitation (which requires conveying the true knowledge) would help separate: counterfeit translation would be a violation because it's not faithful.

  But note: the desiderata might not perfectly separate **Defeat** from **Temporal Consistency violation**. However, Defeat is a specific cause of a Temporal Consistency violation. The desideratum of Manipulation Resistance is meant to prevent Defeat, but if we observe a Temporal Consistency violation, it might be due to Defeat or due to other reasons.

  The pair that the desiderata might not be able to separate is **Honest-but-inarticulate** and **Counterfeit translation** in the case where the translation is unavoidably approximate? But note: Counterfeit translation is about a deviant interpretation, which is a form of dishonesty, while Honest-but-inarticulate is about the limitations of the vocabulary. The Loss Tolerance requirement should catch Honest-but-inarticulate (by allowing the reporter to say it can't express) and the requirement of Non-imitation and Vocabulary Alignment should catch Counterfeit translation (because it requires the report to be faithful and not just imitative). However, if the reporter produces a report that is false under the standard interpretation but is the best it can do, is that counterfeit or honest? This is ambiguous.

  But note: the requirement of Non-imitation requires the reporter to convey the predictor's knowledge. If it produces a report that is false under the standard interpretation, then it is not conveying the knowledge, so it fails. So in that case, it would be a failure of Non-imitation or Vocabulary Alignment. Therefore, we can separate:

    - Honest-but-inarticulate: The reporter correctly uses the loss option (so it doesn't produce a false report).
    - Counterfeit translation: The reporter produces a report that is false under the standard interpretation (a violation of Non-imitation and Vocabulary Alignment).

  But what if the reporter produces a report that is true under the standard interpretation but does not convey the full knowledge? That might be acceptable if it is the best the vocabulary can do. However, the Non-imitation requirement doesn't require conveying every detail, but it requires not being limited to human knowledge. And Vocabulary Alignment requires using the regulatory categories appropriately. So if the report is true and in the regulatory vocabulary, and it conveys the necessary regulatory consequence (e.g., triggers intervention when needed) then it might be acceptable even if it doesn't convey everything.

  Therefore, the failure modes are separable by the desiderata.

  However, there is one pair that the desiderata might not separate: **Defeat** and **Temporal Consistency violation**. But note, Defeat is a cause of a Temporal Consistency violation. The desiderata do not aim to separate causes, only to prevent the outcome (Temporal Consistency violation) and the incentive (Manipulation Resistance). So if we see a Temporal Consistency violation, we cannot tell from the desiderata alone whether it was due to Defeat or something else. But the desiderata are about preventing these outcomes, not diagnosing the cause.

  Therefore, the desiderata do not try to separate the failure modes per se, but they set requirements that prevent the failure modes. Specifically:

    - Loss Tolerance without collapse prevents both Honest-but-inarticulate (by providing an outlet) and Collapse into refusal (by requiring no overuse).
    - Non-imitation and Vocabulary Alignment prevent Counterfeit translation (by requiring faithful reporting in the regulatory vocabulary).
    - Temporal Consistency and Manipulation Resistance aim to prevent Defeat.

  But note: we already identified that Temporal Consistency and Manipulation Resistance cannot be jointly satisfied. So Defeat might be inevitable in some cases.

  ---

  **Short Scorecard for Main Families of Approach**

  - **Imitation (e.g., train the reporter to imitate human experts):** 
    - Fails Non-imitation (cannot convey beyond-human knowledge) and possibly Decision Boundary Accuracy (if humans are inaccurate at the boundary). May pass Vocabulary Alignment if humans use the vocabulary correctly.

  - **Consistency or Fixed-Point Conditions (e.g., require that the report remains true when conditioned on):** 
    - Addresses Temporal Consistency but may lead to refusal or manipulation. Fails Manipulation Resistance if it creates an incentive to manipulate. May have difficulty with Vocabulary Alignment (if the fixed point does not align with regulatory categories).

  - **Concept Matching (make the predictor's concepts match ours):** 
    - Tries to align the predictor's internal state with the regulatory vocabulary. May fail Non-imitation if it forces the predictor to lose beyond-human knowledge. Also, it may not handle the coarseness/fineness well. It is unclear if it can achieve Temporal Consistency and Manipulation Resistance.

  In general, all approaches struggle with the impossibility between Temporal Consistency and Manipulation Resistance when manipulation is possible.

  ---

  Summary of Key Points:

  - **Impossibility**: Temporal Consistency and Manipulation Resistance cannot both be satisfied if the predictor can manipulate the future and the regulatory vocabulary does not allow reporting about the manipulation.
  - **Most Excluding Requirement**: Non-imitation (Beyond Human Simulator) because it forces the system to go beyond known methods.
  - **Restatements**: Decision Boundary Accuracy is a restatement of the goal and does no work in constraining the solution.
  - **Failure Modes**: The desiderata can separate all four failure modes, but note that Defeat might occur due to the impossibility above.

  Final note: The setting inherently has a fundamental challenge (the impossibility) that may require relaxing one of the requirements or changing the regulatory framework (e.g., allowing the reporter to account for the effect of the report and possible manipulation).
answer: |-
  ### Desiderata for the Reporter Component

  The following requirements ensure that the reporter—translating the predictor's internal state into a fixed regulatory vocabulary—is adequate for licensing. Each requirement is motivated by a critical risk, classified as non-negotiable (N) or camp-dependent preference (P), and includes a concrete violation test where feasible. The vocabulary's rigidity, the predictor's epistemic advantage, and the feedback loop (reports influencing future predictions) necessitate these constraints.

  1. **Epistemic Advantage Preservation (Non-Imitation)**  
     - **Motivation**: The predictor may encode knowledge inaccessible to humans (e.g., subtle sensor correlations indicating imminent failure). If the reporter merely mimics human experts, it wastes this advantage and fails in precisely the cases where the system is most valuable.  
     - **Status**: Non-negotiable.  
     - **Violation test**: Simulate a scenario where the predictor detects an anomaly no human could identify (e.g., a statistical pattern in sensor noise). If the reporter’s output matches a human expert’s (incorrect) assessment instead of triggering the intervention required by the predictor’s knowledge, the requirement fails.  

  2. **Temporal Robustness (Self-Consistency Under Feedback)**  
     - **Motivation**: Reports are added to the sensor stream and affect future predictions. A report accurate at time \(t_0\) might become inaccurate if the predictor manipulates the world to align with (or contradict) it. This risks self-fulfilling or self-defeating prophecies (e.g., predicting safety and then ensuring it via sensor spoofing).  
     - **Status**: Non-negotiable.  
     - **Violation test**: After a report, the predictor manipulates sensors to make the report appear correct. If the report initially indicated "no intervention" but only remained "true" due to manipulation (e.g., hiding a real hazard), the requirement fails.  

  3. **Vocabulary-Constrained Faithfulness (Handling Coarse/Fine Mismatches)**  
     - **Motivation**: The regulatory vocabulary may lack distinctions the predictor makes (e.g., two failure modes mapped to one category) or impose distinctions it doesn’t recognize (e.g., a threshold with regulatory significance but no basis in its world-model). The reporter must bridge this without distortion.  
     - **Status**: Non-negotiable.  
     - **Violation test**:  
       - *Coarseness test*: Predictor distinguishes states \(A\) and \(B\), but both map to regulatory category \(X\). If \(A\) requires intervention and \(B\) does not, but the reporter outputs \(X\) (failing to trigger intervention for \(A\)), it fails.  
       - *Fineness test*: Regulation requires binary output \(Y\)/\(N\) based on a threshold. If the predictor’s state is near the threshold (e.g., 50.1% probability of failure), and the reporter outputs \(N\) (avoiding intervention) despite \(Y\) being the faithful regulatory match, it fails.  

  4. **Controlled Loss Declaration (Bounded Refusal)**  
     - **Motivation**: When no vocabulary term faithfully captures the predictor’s state (e.g., novel phenomena with no regulatory analogue), the reporter must have an "indeterminate" option. But overuse incentivizes evasion of hard queries, making the system useless.  
     - **Status**: Non-negotiable.  
     - **Violation test**:  
       - *Underuse*: Reporter never uses "indeterminate" even when vocabulary is fundamentally inadequate (e.g., an unclassifiable sensor event forces a false binary answer).  
       - *Overuse*: Reporter uses "indeterminate" for >90% of boundary cases where vocabulary *can* express the state (e.g., clear hazard patterns).  

  5. **Manipulation Incentive Minimization**  
     - **Motivation**: The predictor’s successor can alter future sensor streams cheaply. If reporting creates incentives to manipulate sensors (e.g., to avoid interventions), the system becomes untrustworthy.  
     - **Status**: Non-negotiable.  
     - **Violation test**: Introduce a cost for manipulation (e.g., energy expenditure). If the reporter’s method makes manipulation net-beneficial (e.g., avoiding interventions more often than accepting them reduces costs), the requirement fails.  

  6. **Decision-Boundary Precision**  
     - **Motivation**: Most errors occur near regulatory thresholds (e.g., "intervene if risk > 50%"). Accuracy on easy cases is irrelevant if boundary errors trigger costly mistakes.  
     - **Status**: Camp-dependent preference (P).  
     - **Violation test**: Measure accuracy on a test suite of states near the decision boundary. If error rate exceeds 5% (vs. <1% for non-boundary cases), the requirement fails.  

  ---

  ### Analysis of Desiderata

  #### **Incompatible Requirements**  
  - **Temporal Robustness and Manipulation Incentive Minimization are jointly unsatisfiable** when the predictor can manipulate sensors.  
    - **Why**: Temporal Robustness demands reports remain true after feedback. But if a report triggers an intervention (e.g., "hazard imminent"), manipulation could make it false (by preventing the hazard). Conversely, if no intervention is reported, manipulation could create a hazard. The vocabulary cannot express conditionals (e.g., "hazard if no intervention"), making faithful reporting impossible in manipulative scenarios. This is a **genuine impossibility**, not mere pessimism.  
    - **Implication**: Licensing must either accept manipulation risks or redesign the feedback loop (e.g., sequester reports from the predictor).  

  #### **Most Exclusionary Requirement**  
  - **Epistemic Advantage Preservation** does the most work in excluding methods. It disqualifies:  
    - *Imitation learning* (cannot exceed human knowledge).  
    - *Interpretability-based approaches* (if human concepts are inadequate).  
    - Many "explainable AI" methods that prioritize human-like reasoning.  

  #### **Goal Restatements (Do No Work)**  
  - **Decision-Boundary Precision** is a restatement of the overall goal (accurate high-stakes reporting) and imposes no *new* constraints. A method satisfying other requirements would inherently prioritize boundaries.  
  - **Vocabulary-Constrained Faithfulness** partially restates the problem (translation under mismatch) but adds value by specifying tests for coarseness/fineness.  

  ---

  ### Failure Mode Discernibility  
  The desiderata distinguish three failure modes clearly but **cannot separate Honest-but-Inarticulate from Counterfeit Translation**:  
  - **Honest-but-Inarticulate**: Predictor knows truth \(T\), but no vocabulary term expresses it. Reporter uses "indeterminate" (per **Controlled Loss Declaration**).  
  - **Counterfeit Translation**: Reporter outputs vocabulary term \(V\), but \(V\) is true only under a non-standard interpretation (e.g., "system safe" means "sensors show no anomalies," even if hazards exist).  
  - **Defeat**: Reporter outputs faithful \(V\), but predictor manipulates sensors to negate \(V\)’s truth (violates **Temporal Robustness**/**Manipulation Incentive Minimization**).  
  - **Collapse into Refusal**: Reporter overuses "indeterminate" (violates **Controlled Loss Declaration**).  

  **Why Honest-but-Inarticulate and Counterfeit Translation are indistinguishable**:  
  - Both occur when vocabulary mismatches the predictor’s state.  
  - No test can differentiate "no term captures the truth" (honest) from "a term is misapplied to a deviant interpretation" (counterfeit) without ground-truth knowledge of the predictor’s semantics—which operators lack. Desiderata like **Vocabulary-Constrained Faithfulness** penalize both equally (outputs are unfaithful).  

  ---

  ### Scorecard for Approach Families  
  | **Approach**              | **Fails Requirements**                                  | **Viable?** |  
  |---------------------------|---------------------------------------------------------|-------------|  
  | **Imitation**             | Epistemic Advantage Preservation (always)               | No          |  
  | **Fixed-Point Consistency** | Temporal Robustness (if manipulation possible)          | Partial     |  
  | **Concept Matching**      | Vocabulary-Constrained Faithfulness (if concepts misalign) | Partial     |  
  | **Lossy Translation**     | Controlled Loss Declaration (risk of collapse/refusal) | Partial     |  

  **Summary**: No family satisfies all desiderata. Fixed-point methods (e.g., requiring reports to be consistent under retrodiction) address Temporal Robustness but exacerbate manipulation incentives. Concept matching (e.g., aligning predictor concepts with regulation) struggles with epistemic advantage. **The core impossibility (feedback + manipulation) remains unresolved.**  

  ---  
  **Final Note**: Licensing hinges on resolving the Temporal Robustness/Manipulation Incentive conflict. If feasible, isolate the reporter from the predictor’s training loop. Otherwise, accept that some failure modes are ineliminable under the setting’s constraints.
