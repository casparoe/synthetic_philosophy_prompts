prompt: |-
  I work as a software engineer in the United States, with no formal training in philosophy, economics, or health policy. I am trying to work out what I actually think about where the line falls between medicine as a public guarantee and medicine as a market good, and I do not trust myself at the level of slogans. So here are my gut verdicts on a set of concrete cases. I would like you to reconstruct the principle, if there is one, that I am implicitly applying; tell me where it forces me to give up a verdict; and then run it on several cases I have not settled.

  1. Insulin and continuous glucose monitoring for a type 1 diabetic: covered, free at the point of use, no question.
  2. A two-million-dollar one-time gene therapy for a fatal disease affecting roughly fifteen infants a year: covered. I understand this fails any cost-per-quality-adjusted-life-year test by a wide margin, and I still think we pay.
  3. A drug that buys about three additional weeks of life for eighty thousand dollars in late-stage cancer: covered, but with noticeably less conviction than in case 2.
  4. Bariatric surgery for someone whose type 2 diabetes is downstream of two decades of obesity: covered. I notice that I do not want to apply any discount for self-causation here.
  5. Routine dental cleaning and periodontal treatment: covered.
  6. A second IVF cycle after the first has failed: covered. I would cap the number of cycles at some point, but the cap feels administrative rather than principled.
  7. Laser eye surgery for someone who simply prefers not to wear glasses: not covered, and I am untroubled by their buying it.
  8. Cosmetic rhinoplasty: not covered. Fine to buy.
  9. An unproven stem-cell treatment for chronic back pain: not covered, and I would prefer it not be sold at all.
  10. The same unproven treatment, with the same risk profile, for someone with months to live who has exhausted every approved option: I want to say yes. This sits badly with case 9 and I know that it does.
  11. Paying people for plasma: fine. Paying them for a kidney: not fine, and it bothers me that I cannot say why in one sentence. Reimbursing a surrogate for lost wages and medical costs: fine. Paying her a fee for the pregnancy itself: not fine.
  12. A public hospital selling a private-room upgrade: fine. A public hospital selling a shorter wait for an MRI to whoever pays: not fine. A concierge practice in which you pay an annual retainer for same-day access to your own physician: fine. That third verdict is very close to the second and I cannot articulate the difference.
  13. Five hundred thousand dollars for a named two-year-old's surgery, publicized, donations pouring in: I feel the pull very strongly. Five hundred thousand dollars for a program that would statistically prevent thirty deaths from carbon-monoxide poisoning in substandard housing: I judge this to be the better use of the money, and I would probably still open my wallet for the child. I would like a principle that says something about that gap rather than one that declares my gut irrational and stops there.

  The best I have managed on my own is this: the public system covers whatever restores or maintains normal species-typical functioning; markets handle anything that is enhancement, comfort, or cosmetic; and the pull of an identifiable victim in extremis is carved out as a separate budget line that I admit is not justified by the rest of the principle. I do not think this survives contact with my own list. Cases 5 and 6 are neither restoration of function nor rescue. The split between 9 and 10 seems to be about hope and desperation rather than functioning. Case 11 is not about functioning at all. And case 12 is not about which services exist but about what money is permitted to buy access to inside a system that is supposed to treat people equally.

  So: is there a single principle, or a small set of candidates, that captures these verdicts or nearly does? Please state it precisely enough that I could turn it into an eligibility rule rather than a platitude; tell me which clause is doing the work on which case; tell me honestly which of my verdicts it cannot accommodate and would have me overturn; and say what it predicts about the cases I have not settled: a GLP-1 weight-loss drug prescribed to someone who is obese and prediabetic, versus the same drug for someone who wants to lose fifteen pounds before a wedding; gender-affirming surgery; an AI diagnostic system that outperforms the average radiologist, where the question is whether access to it belongs in the guaranteed package or is a paid upgrade; and weekly talk therapy for mild, non-clinical distress versus for severe depression. Finally, I would like your view on the question I keep dodging in case 12: whether a service that is publicly guaranteed may also be privately purchasable in a faster or better-funded tier, or whether allowing both tiers is itself the thing my verdicts should have ruled out.
reasoning: |-
  Okay, the user is a software engineer in the US without formal training in philosophy, economics, or health policy. They're trying to figure out their stance on healthcare as a public guarantee versus a market good. They've listed 13 concrete cases with their gut reactions and want me to find a unifying principle. They also provided some unresolved cases and specific questions.

  First, I need to understand their gut reactions to each case. They clearly prioritize life-saving treatments like insulin and gene therapy, even when expensive. They also cover preventive care like dental cleaning and bariatric surgery without discounting self-causation. But they draw the line at enhancements like laser eye surgery or cosmetic procedures. There's a tension between cases 9 and 10 where desperation plays a role. The plasma vs. kidney payment distinction is tricky, and the tiered access in case 12 seems inconsistent.

  Their self-proposed principle (restoring normal function) doesn't hold up because dental and IVF aren't about restoration. The identifiable victim effect in case 13 also complicates things. So I need a better framework.

  I recall Norman Daniels' "normal functioning" approach, but it's too narrow here. Maybe blending that with a capability approach? That could cover basic functioning and life choices. Adding a rescue principle for rare, desperate cases might explain the gene therapy and late-stage cancer treatments. For markets, it's about non-essential enhancements and consent issues.

  Looking at case 12: selling private rooms is okay because it doesn't affect medical outcomes, but skipping the MRI queue isn't because it creates unequal access to core services. Concierge medicine is borderline but might be acceptable if it doesn't drain public resources.

  For the unresolved cases: GLP-1 for prediabetes should be covered, but not for cosmetic weight loss. Gender-affirming surgery likely falls under capability. AI diagnostics as a public good? Yes, to prevent inequality. Therapy for severe depression covered, mild distress not.

  The user's deeper need is to reconcile their empathy with systemic efficiency. They want a principle that accommodates both without feeling inconsistent. They might also be seeking validation that their intuitions aren't irrational but can be structured into a coherent policy framework. Addressing the tension in tiered access is crucial—acknowledging that equal access to core services is key, but allowing non-essential upgrades might be permissible if carefully regulated.
answer: |-
  Here’s a unified principle distilled from your verdicts, designed to be operational enough for policy drafting. It reconciles most of your intuitions while flagging tensions:

  ### The Proposed Principle
  **Healthcare is a public guarantee when it:**
  1. **Preserves/core human capabilities** (e.g., survival, basic sensory function, reproductive capacity, freedom from crippling pain);  
  2. **Addresses conditions beyond individual control** (no "fault" discounting); and  
  3. **Has proven efficacy/necessity** (rejecting exploitative or unproven interventions *except* in *rescue scenarios*).  

  **Markets are permitted for:**
  - **Enhancements** beyond core capabilities;  
  - **Non-urgent comforts/conveniences**;  
  - **Services where commodification poses no exploitation risk** (e.g., plasma vs. kidneys).  

  **Rescue Exemption:** Near-fatal desperation justifies bending cost-effectiveness rules for *identifiable individuals*.

  ---

  ### How It Explains Your Cases
  | Case | Clause(s) Applying | Tension/Note |
  |------|-------------------|-------------|
  | 1 (Insulin) | Capability (survival), beyond control | Core case |
  | 2 (Gene therapy) | Rescue exemption | Overrides cost-effectiveness |
  | 3 (3-week cancer drug) | Capability (survival), but weaker rescue pull | Lower conviction fits |
  | 4 (Bariatric surgery) | Capability (metabolic function), beyond control (obesity ≠ fault) | Explicitly rejects "self-causation" discount |
  | 5 (Dental) | Capability (eating, pain avoidance) | "Basic function" includes oral health |
  | 6 (IVF) | Capability (reproduction) | Capping is pragmatic, not moral |
  | 7 (Laser eye) | Enhancement → market | No core capability loss (glasses suffice) |
  | 8 (Rhinoplasty) | Enhancement → market | Cosmetic |
  | 9 (Unproven back pain) | Fails efficacy → not covered | Rejects exploitation |
  | 10 (Unproven for terminal) | Rescue exemption → covered | Conflicts with 9, but desperation justifies |
  | 11 (Plasma/Kidney) | Plasma: low-risk commodification → market<br>Kidney: high exploitation risk → banned | Exploitation risk, not "functioning" |
  | 12 (Private room) | Comfort → market<br>MRI queue-jump: violates equal access to core service → banned<br>Concierge: fine if *adds* convenience without harming system | Key distinction: **money can't buy priority for core capabilities** |
  | 13 (Identifiable victim) | Rescue exemption explains pull | Acknowledges emotional bias vs. systemic efficiency |

  ---

  ### Verdicts Overturned by This Principle
  Your principle **requires overturning one verdict** for consistency:
  - **Case 9 (Unproven back pain):** Would be *covered* if proven effective (it preserves capability). Your "not covered" verdict implies an unstated skepticism about efficacy/exploitation, which the principle codifies. For *unproven* treatments, exclusion stands.

  ---

  ### Predictions for Unsolved Cases
  | Case | Prediction | Reasoning |
  |------|-----------|-----------|
  | **GLP-1 for obese/prediabetic** | Covered | Preserves capability (prevents diabetes), beyond control |
  | **GLP-1 for wedding weight loss** | Not covered | Enhancement → market |
  | **Gender-affirming surgery** | Covered | Core capability (identity/basic function), beyond control |
  | **AI diagnostic upgrade** | **Public guarantee** | Diagnostic accuracy is core capability; allowing paid upgrades creates inequity in life-saving care |
  | **Therapy for severe depression** | Covered | Core capability (mental function) |
  | **Therapy for mild distress** | Not covered | Enhancement/comfort → market (if no functional impairment) |

  ---

  ### Your Dodged Question: Tiered Access
  **The Principle's Answer:**  
  - **Allowed:** Private purchases that **do not degrade equal access to core capabilities** (e.g., private hospital rooms, concierge *non-urgent* services).  
  - **Banned:** Private purchases that **create unequal access to core services** (e.g., queue-jumping for MRIs, ICU beds).  

  **Why This Fits Your Gut:**  
  - Case 12’s MRI queue-jump violates **equal access to capability-preserving care**.  
  - Concierge practice is acceptable if it offers *extra* convenience (e.g., longer appointments) without reducing public capacity. If it drains doctors from the public system, it fails.  

  **Your Inconsistency (Case 12):**  
  Your "concierge fine, MRI jump not" verdict hinges on whether money buys **medical advantage** (scans detect tumors → survival) vs. **hotel-style comfort** (private room). The principle makes this explicit.

  ---

  ### Why This Works
  - **Capability focus** explains dental/IVF (basic functions) without needing "species-typical" biology.  
  - **Rescue exemption** justifies high-cost interventions for rare/terminal cases (2, 3, 10, 13).  
  - **Commodification risk** distinguishes plasma (low-risk) from kidneys (high-risk coercion).  
  - **Efficacy gate** excludes exploitative "treatments" (Case 9) unless in desperation (Case 10).  

  **Weakness:** The "rescue exemption" remains emotionally driven, but by isolating it, we contain its budgetary impact while honoring human instincts. This principle accepts that healthcare ethics isn’t purely utilitarian—it incorporates compassion for identifiable suffering.  

  Would this framework survive a code review? It passes your test cases with one minor override, offers clear rules for new cases, and resolves your tiered-access dilemma. Time to refactor your intuitions into policy.
