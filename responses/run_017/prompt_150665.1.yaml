prompt: |-
  I am writing a paper on whether the case for procreative beneficence survives the fact that many of the traits it would select for are positional rather than robust, and I need a test case for the section where the two principles I am comparing come apart. Please construct one to the following specification.

  The two principles. (1) The Principle of Procreative Beneficence, as it is standardly stated: where a choice exists between possible children, there is significant moral reason to select the child whose life can be expected to go best on an objective account of well-being; since no such child is harmed by being brought into existence, the reason is not a matter of avoiding harm to anyone. (2) A sufficientarian, distribution-sensitive principle I will call Procreative Non-Positionality: once every available option is clearly above the adequacy threshold, there is pro tanto reason to prefer the option whose expected advantage is robust, in the sense that the child would still enjoy it if every similarly situated parent chose the same way, and reason against options whose advantage consists in securing a larger share of a fixed, rival good.

  The case. One paragraph of scenario, plus the numbers it turns on, set in a realistic near-term IVF cycle with preimplantation testing and polygenic scoring of the ordinary imperfect kind: a few percent of variance explained, no better than a shrewd human prediction in any individual case, no gene editing, nothing science-fictional. In the jurisdiction the scenario is set in, a single ranked examination taken at age eleven allocates a fixed number of places in a state-funded academic track; the track strongly predicts adult income, health and longevity; and the number of places is fixed by statute and does not expand with demand. The two viable embryos differ modestly: one scores higher on the profile that predicts performance on that examination, the other carries a somewhat lower polygenic risk for a late-onset painful condition whose treatment is improving. Give the numbers explicitly, and calibrate them so that expected lifetime well-being across the two options is close: within the range where a careful reader could reasonably have expected the two principles to agree. The verdicts must fall out of the structure of the case, not from one option's advantage being overwhelming.

  Constraints. No appeal to parental cost, convenience, or self-interest, or to what the parents would prefer. No sensory-disability or minority-identity framing: the case must not be resolvable into the familiar dialectic about selecting for disability. Neither principle may claim that either embryo is harmed or benefited by comparison with a different possible person. No coercion, no state mandate, no exotic predictor.

  What I want back. The scenario and its numbers; the verdict each principle gives and the derivation of each; the single feature of the case doing the work, and what happens when you remove it, checked two ways, first by making the favored embryo's advantage non-positional and then by removing the fixed-pool structure and asking whether the divergence collapses; the strongest reply available to whichever principle you take to lose, including whether the my-choice-makes-no-difference move actually helps that side here given what the second principle is objecting to; and any residual respect in which the other embryo's advantage is itself positional, with your view on whether that destabilizes the case. Finally, state how confident you are in the verdicts you attribute to each principle, and single out the one point you are least sure of, saying how much of the argument rests on it.
reasoning: |-
  Okay, the user is writing a paper comparing Procreative Beneficence (PB) and Procreative Non-Positionality (PNP). They need a test case where these principles give different verdicts. Let me start by understanding the key differences between the principles.

  PB focuses on selecting the child with the highest expected well-being, regardless of how that advantage is achieved. PNP, however, prioritizes non-positional advantages once above a threshold. Positional goods are those where the benefit depends on relative standing, like a fixed number of spots in a school. The case should highlight this conflict.

  The user wants a realistic IVF scenario with preimplantation testing and polygenic scores. The traits must be positional vs. robust. The exam allocation system is perfect because the spots are fixed. The embryos need to have close expected well-being: one better at the exam (positional), the other with lower disease risk (robust). 

  Calculating the numbers: The exam track boosts income by 20%, but only 10% get in. Embryo A has a 60% chance due to higher exam scores. Embryo B has a 40% chance but a lower risk of a painful condition. The disease reduces QALYs by 15%, but with a 30% risk for B and 40% for A. 

  Expected well-being: For A, (0.6 * 1.2 * 100) + (0.4 * 85) = 72 + 34 = 106. For B, (0.4 * 1.2 * 100) + (0.6 * 85) = 48 + 51 = 99. Close but A is higher, so PB picks A. PNP rejects A because the exam advantage is positional; if all chose similarly, the advantage disappears. The disease reduction is robust, so PNP chooses B.

  Testing robustness: If the exam becomes non-competitive (no fixed spots), both embryos' chances might equalize, removing the conflict. If Embryo A's advantage was non-positional (like innate intelligence without competition), PB and PNP might agree. The positional nature of the exam is key.

  The user might worry about residual positionality in the disease. But the treatment access isn't competitive here. PNP's objection to positional goods holds even if individual choices don't change outcomes, because it's about the nature of the good. The strongest reply for PB is that the expected well-being calculation is valid regardless of positionality. But PNP counters that positional gains are zero-sum and socially undesirable.

  Confidence is high in PB choosing A, medium in PNP choosing B. The key uncertainty is whether the disease advantage has any positional aspects, but since treatment isn't rivalrous, it should be robust. The case stands as a clear divergence point.
answer: |-
  Here is a constructed test case meeting your specifications, designed to cleanly separate Procreative Beneficence (PB) from Procreative Non-Positionality (PNP).

  **Scenario:**
  Sarah and Ben are undergoing IVF with preimplantation genetic testing. Two viable embryos remain after initial screening. Comprehensive polygenic risk scoring (PRS) estimates are available, explaining approximately 5-8% of variance in the relevant traits – typical of current capabilities, offering probabilistic insight but no certainty for any individual child. Jurisdiction X operates an 11-plus examination system. Performance on this single, standardized test determines entry into the state-funded "Academic Advancement Track" (AAT). Statutory law fixes the number of AAT places at exactly 10% of the annual cohort; places do not increase with population growth or overall performance improvements. The AAT confers substantial, lifelong advantages: graduates have a demonstrably higher median income (~20%), better average health outcomes, and increased life expectancy (~3 years) compared to non-graduates, even after controlling for socioeconomic background. The two embryos differ as follows:

  *   **Embryo A:** Shows a significantly higher PRS profile associated with performance on standardized cognitive tests like the 11-plus. Based on population data and the PRS, Embryo A has an **estimated 60% probability of scoring within the top 10%** (thus securing an AAT place) and a **40% probability of scoring below this threshold**. Embryo A also carries a **40% polygenic risk score for developing Chronic Neuropathic Pain Syndrome (CNPS)** by age 60. CNPS causes significant, persistent pain. While treatments are improving and effective management is increasingly possible, even managed CNPS typically reduces quality-adjusted life years (QALYs) by an estimated 15% during the affected years (assumed to be from age 60 onwards). Life expectancy without CNPS is 85 years.
  *   **Embryo B:** Shows a PRS profile suggesting average standardized test performance. Embryo B has an **estimated 40% probability of scoring within the top 10%** (securing AAT) and a **60% probability of scoring below**. Embryo B carries a **significantly lower 30% polygenic risk score for developing CNPS** under the same model. Life expectancy without CNPS is also 85 years.

  **Expected Lifetime Well-being Calculation (Simplified QALY Model):**
  *   **Assumptions:**
      *   Baseline Lifetime Well-being (No AAT, No CNPS): 100 QALYs (arbitrary unit representing a full, healthy life).
      *   AAT Advantage: +20% boost to *lifetime* well-being (capturing income, health, longevity benefits). *[Rationale: Represents the significant, documented objective advantages.]*
      *   CNPS Disadvantage: -15% reduction in well-being *during affected years*. Assuming onset at 60 and life expectancy to 85, that's 25 affected years out of 85 total. Reduction applies proportionally: -15% * (25/85) ≈ -4.41% reduction in *total lifetime* well-being if CNPS develops. *[Rationale: Represents the significant burden of chronic pain even with treatment.]*
      *   Well-being above the Sufficiency Threshold: Assume the threshold is low (e.g., 60 QALYs). Both embryos have expected well-being far above this (>95 QALYs), satisfying PNP's adequacy condition.
  *   **Embryo A Expected QALYs:**
      *   Probability AAT (60%): (100 + 20%) = 120 QALYs *before CNPS adjustment*.
      *   Probability No AAT (40%): 100 QALYs *before CNPS adjustment*.
      *   CNPS Risk (40%): Apply -4.41% reduction *if CNPS develops*.
      *   *Expected Value Calculation:*
          *   (Prob AAT * Prob No CNPS * 120) + (Prob AAT * Prob CNPS * 120 * 0.9559) + (Prob No AAT * Prob No CNPS * 100) + (Prob No AAT * Prob CNPS * 100 * 0.9559)
          *   = (0.6 * 0.6 * 120) + (0.6 * 0.4 * 114.708) + (0.4 * 0.6 * 100) + (0.4 * 0.4 * 95.59)
          *   = (0.36 * 120) + (0.24 * 114.708) + (0.24 * 100) + (0.16 * 95.59)
          *   = 43.2 + 27.53 + 24 + 15.2944 ≈ **109.02 QALYs**
  *   **Embryo B Expected QALYs:**
      *   Probability AAT (40%): 120 QALYs *before CNPS adjustment*.
      *   Probability No AAT (60%): 100 QALYs *before CNPS adjustment*.
      *   CNPS Risk (30%): Apply -4.41% reduction *if CNPS develops*.
      *   *Expected Value Calculation:*
          *   (0.4 * 0.7 * 120) + (0.4 * 0.3 * 114.708) + (0.6 * 0.7 * 100) + (0.6 * 0.3 * 95.59)
          *   = (0.28 * 120) + (0.12 * 114.708) + (0.42 * 100) + (0.18 * 95.59)
          *   = 33.6 + 13.765 + 42 + 17.2062 ≈ **106.57 QALYs**

  **Verdicts and Derivations:**

  1.  **Principle of Procreative Beneficence (PB):**
      *   **Verdict:** Significant moral reason to select Embryo A.
      *   **Derivation:** PB instructs selecting the embryo with the highest *expected objective well-being*. The calculation above shows Embryo A has an expected well-being of ≈109.02 QALYs, while Embryo B has ≈106.57 QALYs. This ≈2.45 QALY difference (≈2.3%) is significant on an objective well-being scale, representing a non-trivial advantage in expected lifetime flourishing. The advantage stems primarily from Embryo A's higher probability of securing the substantial, objectively beneficial advantages conferred by the AAT. PB is indifferent to whether the advantage (AAT access) is positional; it focuses solely on the expected outcome for the child created.

  2.  **Procreative Non-Positionality (PNP):**
      *   **Verdict:** Pro tanto reason to prefer Embryo B and reason against selecting Embryo A.
      *   **Derivation:** PNP first confirms both expected outcomes (109.02 and 106.57 QALYs) are clearly above the adequacy threshold (e.g., 60 QALYs). It then assesses the *nature* of the advantages. Embryo A's primary advantage is a higher chance of securing an AAT place. The AAT is a **fixed-pool, positional good** – only 10% get in regardless of overall performance. The value of the traits predicting AAT success (high PRS for exam performance) *depends entirely* on the child's relative standing compared to peers and the fixed quota. If *all* parents selected embryos like A, the distribution of the predictive trait would shift upwards, but the AAT quota would remain 10%. The increased competition would likely nullify Embryo A's advantage; its higher PRS might no longer guarantee a top 10% rank. Embryo B's advantage is the lower CNPS risk. This is a **robust good**. Reducing the risk of debilitating chronic pain benefits the child *regardless* of what other parents do. If all parents selected for lower CNPS risk, the prevalence of CNPS might decrease, but the child selected would *still* enjoy the benefit of their lower individual risk – they would still be less likely to suffer from CNPS compared to if they had the higher risk profile. PNP thus favors Embryo B's robust health advantage over Embryo A's positional competitive advantage, even though PB calculates A's expected well-being as slightly higher.

  **The Key Feature Doing the Work:**
  The **fixed-pool, zero-sum nature of the Academic Advancement Track (AAT) allocation** is absolutely central. This structure makes the trait associated with AAT access (high exam performance PRS) inherently *positional* – its value derives from scarcity and relative ranking, not absolute capability.

  **Testing Robustness by Removing/Altering the Key Feature:**

  1.  **Make Embryo A's Advantage Non-Positional:** Suppose the AAT places *expanded proportionally* with the number of qualified candidates (e.g., everyone scoring above a fixed threshold gets in, regardless of how many). Now, Embryo A's higher PRS predicts a higher *absolute* likelihood of meeting that fixed standard. Its advantage becomes robust. If all parents selected similar embryos, more children might meet the threshold, but Embryo A would *still* have a higher probability of meeting it than Embryo B. PNP now loses its objection to Embryo A. PB still prefers A due to higher expected well-being. **Divergence collapses; both principles favor A.**

  2.  **Remove Fixed-Pool Structure:** Suppose the "AAT advantage" is replaced by an *intrinsic, non-competitive advantage* predicted by Embryo A's PRS. For example, Embryo A has a PRS predicting a 20% lower lifetime risk of *all* major chronic diseases (a robust health advantage), while Embryo B retains its lower CNPS-specific risk. Recalculating expected well-being would likely show Embryo A with a clear advantage. PB prefers A. PNP, finding both above threshold and both advantages robust (general health vs. specific pain risk), would likely concur with PB or find the choice neutral if advantages were deemed comparable. **Divergence collapses; both principles would likely agree on A or find no strong reason to prefer B.**

  **Strongest Reply for the Losing Principle (PNP vs. PB's Choice of A):**
  *   **PB's Strongest Reply:** "The expected well-being calculation is decisive. Selecting Embryo A demonstrably creates a child expected to have a *better life* in objective terms. PNP's objection based on positionality is irrelevant. The *actual* expected outcome for the specific child created by selecting A is better than the outcome for the child created by selecting B, given the *current* social structure (fixed AAT places). The fact that this advantage *might* disappear under a counterfactual scenario where *all* parents act differently is not a reason against maximizing well-being *given the actual circumstances of choice*. Selecting A doesn't harm anyone (including B, who isn't deprived of existence). PB provides a direct moral reason to confer a tangible, expected benefit on the future child, which outweighs PNP's abstract concern about the nature of the good."
  *   **Does "My-Choice-Makes-No-Difference" Help PNP?** No, it actually hurts PNP's case here. PNP's objection isn't primarily that *this single choice* significantly alters the competitive landscape (it doesn't). PNP's objection is that the *good itself* (AAT access) is inherently positional/rivalrous. Choosing Embryo A means selecting *for dependence* on a positional good to achieve the expected well-being advantage. Even if one parent's choice is inconsequential to the overall distribution, they are still opting to create a child whose projected flourishing relies significantly on securing a scarce, competitive resource. PNP objects to *endorsing* or *relying upon* positional advantage as a means to well-being once sufficiency is assured, regardless of the marginal impact. The "no difference" move reinforces that the positional advantage *exists independently of this choice*; PNP argues we should still avoid *basing selection on it*.

  **Residual Positionality & Stability:**
  *   **Is Embryo B's Advantage (Lower CNPS Risk) Positional?** Potentially in a very attenuated way. Access to *optimal* CNPS treatment *might* involve some positional elements (e.g., scarce specialist time, cutting-edge therapies). However:
      1.  The core advantage – *reduced risk of developing the condition* – is fundamentally non-positional. Not getting sick is intrinsically beneficial regardless of others.
      2.  The scenario specifies treatment is "improving," implying it's becoming more accessible. The primary well-being hit modeled is the *condition itself* (-15% QALY during affected years), mitigated but not eliminated by treatment.
      3.  Unlike the AAT, healthcare access (especially for chronic conditions) is less inherently zero-sum and often structured (imperfectly) towards need, not pure competition.
  *   **Does this Destabilize the Case?** No. The positional aspect of CNPS treatment access is minor, indirect, and not inherent to the trait being selected *for* (lower disease risk). It's fundamentally different from the AAT, where the *very benefit* (track placement) is *defined* by scarcity and competition. The case remains a robust illustration of the core divergence: selecting for a trait valuable *only* because it helps win a fixed competition (A) vs. selecting for a trait that reduces inherent suffering (B). PNP's focus on robustness clearly distinguishes the *primary character* of these advantages.

  **Confidence Assessment:**

  *   **PB's Verdict (Prefer A): High Confidence.** The calculation clearly shows a higher expected objective well-being for A. PB's directive is straightforward given this difference.
  *   **PNP's Verdict (Prefer B / Reject A): Medium-High Confidence.** The structural distinction between the positional AAT advantage and the robust CNPS risk reduction is clear and central to PNP's rationale. The argument that PNP objects to *relying on* positional goods even when marginally inconsequential is well-founded.
  *   **Point of Least Certainty: The strength of PNP's "pro tanto reason against" selecting A.** How strong is this reason compared to PB's reason *for* A? Does PNP *always* outweigh PB when positional goods are involved above threshold, or is there a tipping point in the expected well-being difference? The argument relies on PNP generating a *sufficiently strong* countervailing reason to overcome PB's reason derived from the ≈2.45 QALY difference. While the case is designed to show divergence, the *relative weight* of these reasons within a broader moral framework (which your paper will explore) is the less certain aspect. Much of the subsequent argument in the paper may hinge on justifying PNP's strength relative to PB in such close cases involving positional goods. The core *divergence itself*, however, rests solidly on the structure identified.
