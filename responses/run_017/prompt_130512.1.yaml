    In a large world, when an agent can choose both her decision rule (which determines her reference class) and her action, does the evidential decision theory recommend that she choose a decision rule that leads to cooperation and then cooperate? And does this recommendation converge to "be the kind of agent who cooperates" as N→∞, thereby collapsing the act/policy distinction?

  We now state the question formally:

    Consider a population of N agents. Each agent i chooses a decision rule π_i from a finite set Π and an action a_i in {C, D}. The decision rule π_i maps the agent's information about θ to a distribution over actions. The agent also chooses an information structure: a partition of the state space (or a signal) about θ, which determines what she knows when she acts.

    The reference class for agent i is the set of agents j≠i who have the same decision rule as i: R_i = { j | π_j = π_i }.

