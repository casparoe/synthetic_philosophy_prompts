    We assume that the agents are symmetric: they all choose simultaneously and face the same environment.

    The question: As N→∞, what are the symmetric equilibria of this two-stage game? In particular, is there an equilibrium where all agents choose a decision rule that leads to cooperation (and then they cooperate) and is this the only equilibrium? Also, does the equilibrium action (cooperate) correspond to the evaluation of the decision rule (which is to be cooperative) so that the act/policy distinction collapses?

  We note: the agent's decision rule and information structure affect the reference class and the conditional correlations. By choosing π_i, the agent chooses which group she belongs to, and by choosing P_i, she chooses how much she knows about θ, which affects the residual correlation.

  **2. Why Existing Answers Leave It Open**

  Existing work on evidential decision theory and cooperation (e.g., in the prisoner's dilemma) focuses on fixed reference classes and fixed information. The two-agent case shows that if the correlation is high enough, EDT recommends cooperation. But in large worlds, the evidential argument weakens because the agent's action is a small signal about the common cause, so the fraction f is not much affected by conditioning on one's own action. However, if the agent can choose to be in a small reference class (by choosing a rare decision rule) then her action might be highly informative about that class. Conversely, if she chooses a common decision rule, the reference class is large and her action is less informative. 

  Existing causal or functional decision theories (CDT, FDT) avoid the evidential argument by construction. But our question is about EDT and whether it converges to something like FDT when the reference class is endogenous.

  Work on ratifiability and self-fulfilling equilibria (e.g., in decision theory by Jeffrey, or in game theory) considers fixed points in decision rules, but without the endogeneity of the reference class. In particular, the reference class is usually taken as exogenously given, and the agent only chooses the action. Our innovation is to make the reference class endogenous.

  We note that the endogeneity of the reference class is reminiscent of the reference class problem in probability, but here it is embedded in a decision problem. While similar issues arise in the literature on group selection or in the evolution of cooperation, our setting is explicitly decision-theoretic and one-shot.

  **3. Method: Month-by-Month Plan**

  We have 12 months.

  Months 1-2: **Formal Setup and Two-Agent Case**
     - Formulate the model precisely. Define the state space, the decision rules, the information structures, and the payoffs. 
     - Work out the two-agent case as a benchmark. Conjecture: in the two-agent case, the endogeneity does not change the recommendation because the reference class is fixed (each agent is the other's only counterpart). So EDT still recommends cooperation if the correlation is high enough. This will be proved.

  Months 3-4: **Large N with Fixed Reference Classes**
     - Analyze the case where the reference class is fixed (agents are pre-assigned to types, and they cannot change type). We vary N and show that the evidential argument for cooperation weakens as N grows. This will be proved.

  Months 5-6: **Endogenous Reference Class without Information Choice**
     - Allow agents to choose their decision rule (i.e., which type to join) but fix the information structure (e.g., all agents have the same information). We look for symmetric equilibria. We will prove existence and characterize the equilibria. We expect multiple equilibria: one where all choose a cooperative rule and cooperate, and one where they choose a defecting rule and defect. We will also consider mixed equilibria.

  Months 7-8: **Endogenous Information**
     - Now allow agents to choose both their decision rule and their information structure. We consider the cost of information: more precise information might be costly. We analyze the trade-off: more information reduces the residual correlation (penalizes EDT cooperation) but might help in choosing the action optimally. We will work with specific cases (e.g., two types of decision rules, two information structures) and look for equilibria. This part may be solved by worked examples.

  Months 9-10: **Large N Limit**
     - Take the number of agents to infinity. We model the distribution of decision rules as a continuum. We then look for fixed points. We conjecture that as N→∞, the only stable equilibrium is one where all agents choose to be in a cooperative rule and cooperate. The argument: in a large world, the only way to have a significant evidential impact is to be in a small reference class, but if everyone is in a cooperative class, then by deviating to defection in a small class, the agent loses the benefit of the large cooperative class. We will attempt a proof.

  Months 11-12: **Collapse of the Act/Policy Distinction and Writing**
     - We conjecture that in the large N equilibrium, the EDT agent effectively evaluates decision rules (policies) rather than acts. We will formalize this and see if it holds. We will also consider robustness to variations. This part will be largely conjectural, and we will write up the results.

  **4. Possible Conclusions**

  - Yes: In the large N limit, with endogenous reference classes, EDT uniquely recommends cooperation and the act/policy distinction collapses. The key consideration: the amplification effect of the large world makes it optimal to commit to cooperation and to remain ignorant of the common causes to preserve the evidential link.

  - No: Even with endogenous reference classes, EDT may still recommend defection, or there may be multiple equilibria including defective ones. The key consideration: the cost of joining a cooperative group (if the group is not large enough) outweighs the evidential benefit.

  - Ill-posed: The problem is too sensitive to the modelling choices (e.g., how the reference class is defined, the cost of information, the timeline) to yield a general answer. The key consideration: the equilibrium depends on details we cannot pin down.

  The deciding factor will be the effect of the size of the reference class on the agent's expected utility: if the evidential benefit of being in a small cooperative group outweighs the loss from not being in a large group, then cooperation in a small group is an equilibrium. But if the large group offers higher utility even with weak evidential reasoning, then the cooperative equilibrium in the large group might prevail.

  **5. What Would Count as Failure**

  The project fails if we cannot find any tractable model where the endogeneity of the reference class changes the recommendation in the large world. Specifically, if in all models we study, the equilibrium with endogenous reference classes is the same as with fixed ones (i.e., defection for large N), then the endogeneity does not help. Also, if the model becomes intractable and we cannot derive any clear results even for simple cases, that would be failure.

  **6. Addressing the Objection**

  The main objection is that the evidential approach is inherently flawed and that we should abandon it in favor of causal or functional decision theories. Our response: Even if EDT is not the correct theory, understanding how it behaves in large worlds with endogenous reference classes is valuable for two reasons. First, it may reveal a path to convergence with other decision theories, which would be a unifying insight. Second, the exercise forces us to clarify how reference classes are formed in decision problems, which is a general issue in game theory and philosophy (e.g., in the context of type spaces or social identity).

  **Honesty about Scope**

  In one year, we cannot fully deliver on item 6 (the collapse of the act/policy distinction) because it requires a general account of how EDT evaluates policies, which may go beyond the model. We will have results within the model, but the broader philosophical implications will require further work. Also, the analysis of endogenous information (months 7-8) might be limited to simple cases.

  **Final Note: Sharpening the Question**

  We are aware that endogeneity of reference classes appears in some form in the literature on type spaces in games and in the philosophy of probability. However, our specific focus on evidential decision theory in large worlds and the act/policy distinction is novel. The convergence claim might be confused if the equilibrium we find is not unique or if it does not actually collapse the distinction (e.g., if the decision rule is chosen for reasons other than the act it produces). We will be alert to these issues and adjust the question accordingly.

  Now, we write the proposal within the word limit.
answer: |-
  ### Endogenous Similarity and Evidential Cooperation in Large Worlds: A Proposal

  #### 1. Research Question  
  This project asks: In a large-world one-shot prisoner's dilemma with \(N\) agents, where each agent controls their action (\(a_i \in \{C, D\}\)), their information about shared causes (\(\theta\)), and their similarity to others via choice of decision rule (\(\pi_i\)), does evidential decision theory (EDT) converge to a unique equilibrium where all cooperate as \(N \to \infty\), and does this collapse the distinction between evaluating acts and policies?  

  **Formalism**:  
  - **World**: \(N\) agents; state \(\theta \sim \text{prior}\) captures shared causes.  
  - **Agent control**:  
    - Action \(a_i\).  
    - Information: Chooses partition \(\mathcal{P}_i\) of \(\theta\)-space (costless, but finer partitions reveal more).  
    - Similarity: Chooses decision rule \(\pi_i\) from finite set \(\Pi\). \(\pi_i\) maps observed \(\mathcal{P}_i\)-cell to \(\Pr(a_i = C)\).  
  - **Reference class**: \(R_i = \{ j \neq i \mid \pi_j = \pi_i \}\) (agents sharing \(\pi_i\)).  
  - **Fraction cooperating**: \(f_i = \text{fraction of } R_i \text{ playing } C\).  
  - **Payoff**:  
    \[
    u_i(a_i, f_i) = 
    \begin{cases} 
    A f_i + B & \text{if } a_i = C \\
    C f_i + D & \text{if } a_i = D 
    \end{cases}
    \]
    satisfying:  
    (i) *Dominance*: \(C f_i + D > A f_i + B\) \(\forall f_i \in [0,1]\) (so \(C > A\) and \(D > B\)).  
    (ii) *Mutual Cooperation Preferred*: \(A + B > D\).  
  - **Timeline**:  
    1. Agents simultaneously choose \(\pi_i\) and \(\mathcal{P}_i\).  
    2. \(\theta\) realized.  
    3. Agents observe \(\mathcal{P}_i(\theta)\), play \(a_i\) via \(\pi_i\).  
  - **Equilibrium**: Symmetric subgame perfect equilibrium under EDT (agents maximize \(\mathbb{E}[u_i \mid a_i, \mathcal{P}_i]\) at stage 3; choose \(\pi_i, \mathcal{P}_i\) at stage 1 anticipating this).  

  **Core inquiry**: Does endogeneity of \(R_i\) via \(\pi_i\) and \(\mathcal{P}_i\) reverse EDT's tendency toward defection in large \(N\)?  

  #### 2. Why Existing Answers Leave It Open  
  - **Two-agent case**: Solved (cooperation iff correlation high), but ignores scaling: endogeneity negligible when \(N=2\), as \(R_i\) is fixed.  
  - **Causal/Functional DT (CDT/FDT)**: Avoid evidential correlations by construction; cannot explain EDT's consistency.  
  - **Ratifiability/self-fulfilling equilibria**: Focus on fixed types (e.g., Skyrms 1990; Jeffrey 1983). Omit reference-class endogeneity—here, \(\pi_i\) *defines* the type.  
  - **Large-world EDT models** (e.g., Arntzenius 2008): Assume fixed reference classes. Endogeneity of information/similarity is underexplored, and "penalty on knowledge" remains unchallenged.  

  **Novelty**: While reference-class problems appear in probability (Reichenbach 1949) and game theory (type spaces), embedding them in EDT’s act-evidence linkage—with \(\pi_i\) and \(\mathcal{P}_i\) as controls—is unexplored. The convergence claim may be confused if equilibrium non-uniqueness persists; this is precisely what we test.  

  #### 3. Method: 12-Month Plan  
  - **Months 1–2**: *Baseline models*.  
    - Prove: With *fixed* \(\pi_i\) and \(\mathcal{P}_i\), EDT cooperation rate \(\to 0\) as \(N \to \infty\) (weak evidence).  
    - Conjecture: Two-agent endogenous case reduces to standard EDT.  
  - **Months 3–4**: *Endogenous \(\pi_i\) only* (\(\mathcal{P}_i\) fixed).  
    - Prove: Multiple equilibria exist (all-cooperate \(\pi\) or all-defect \(\pi\)).  
    - Worked cases: Binary \(\Pi = \{\pi_C, \pi_D\}\); show coordination equilibria.  
  - **Months 5–6**: *Endogenous information* (\(\mathcal{P}_i\) variable).  
    - Worked cases: Costless binary signals about \(\theta\). Compute equilibria; show ignorance preserves correlation, enabling cooperation.  
    - Conjecture: Information choice amplifies multiplicity.  
  - **Months 7–8**: *Small-\(N\) simulations*.  
    - Agent-based models (Python) for \(N < 20\); test equilibrium selection.  
  - **Months 9–10**: *Large-\(N\) limit* (\(N \to \infty\)).  
    - Prove: Under continuum approximation, only *stable* equilibrium is all adopt \(\pi_C\) (cooperative rule) and play \(C\).  
    - Key: Deviations to \(\pi_D\) or finer \(\mathcal{P}_i\) lower expected \(f_i\).  
  - **Months 11–12**: *Act-policy collapse analysis and write-up*.  
    - Conjecture: In equilibrium, EDT evaluates \(\pi_i\) (policy), not \(a_i\) (act), as \(\pi_i\) controls payoffs via \(R_i\).  
    - Document scope limits (see §6).  

  #### 4. Possible Conclusions  
  - **Yes**: Unique cooperative equilibrium for large \(N\); EDT "chooses to be cooperative" (policy) rather than "chooses cooperation" (act). Decider: Strict expected-payoff dominance of \(\pi_C\) with coarse \(\mathcal{P}_i\).  
  - **No**: Multiple equilibria persist; defect equilibrium remains plausible. Decider: Coordination costs outweigh evidential gains.  
  - **Ill-posed**: Sensitivity to priors, \(\Pi\), or payoff parameters precludes general answer. Decider: Non-robustness in simulations.  
  *Deciding factor*: Whether marginal evidential gains from small \(R_i\) offset by gains from large-coalition benefits.  

  #### 5. Failure Criteria  
  The project fails if:  
  - No tractable endogenous model is solvable (e.g., equilibria indeterminate in all settings).  
  - All equilibria entail defection for \(N > 100\), matching fixed-reference-class results.  
  - The act-policy distinction remains robust in all simulations (e.g., \(\pi_i\) chosen for non-evidential reasons).  

  #### 6. Addressing the Core Objection  
  *Objection*: Endogenous correlations expose EDT’s incoherence; abandon it for CDT/FDT.  
  *Response*: This project tests whether EDT *internally generates* CDT/FDT-like recommendations (cooperation as policy) when reference classes are manipulable. If successful, it unifies evidential and functional approaches; if not, it identifies a precise failure mode. Either outcome advances decision theory.  

  #### Scope Honesty  
  A one-year project cannot:  
  - Fully resolve the act-policy collapse (Month 12 remains conjectural).  
  - Characterize *all* information cost structures (focus is costless/costly binary cases).  
  - Explore evolutionary dynamics or behavioral experiments.  

