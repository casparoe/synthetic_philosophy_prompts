  Formalism:

  - The world state is θ (common causes), drawn from a prior.
  - Each agent j has a decision rule π_j that maps θ to a probability of cooperating. But the agent i can choose her decision rule from a set. Also, she can choose how much to know about θ (so she might choose to observe a signal about θ, which refines her information partition).

  - The reference class: the set of agents j for whom π_j is "similar enough" to π_i. We define a similarity metric on decision rules. The agent i can choose π_i to be close to a particular group.

