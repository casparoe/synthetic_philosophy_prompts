answer: |-
  Below is a decision procedure designed as an ordered checklist for your Natural Heritage Review Board, based on your requirements. It incorporates the epistemicist vs. supervaluationist debate on vagueness, handles trade-offs and chains explicitly, and provides clear exits. The procedure is built around your bylaw's four criteria (viable breeding population, mature stand, hydrological connection, and minimal adverse impact) and uses only evidence from the site file (e.g., survey counts, aerial photos, soil maps, ecologist's memo). It assumes the board has a pre-established **Standing Interpretation Sheet (SIS)**, which I will describe first, as it is foundational to the procedure.

  ### Standing Interpretation Sheet (SIS) Requirement
  The procedure requires an annual SIS, created by the board at the start of each year and publicly posted. The SIS:
  - **Sharpens vague terms**: Defines thresholds and ranges for each criterion using evidence types from the site file (e.g., "viable breeding population" for warblers = ≥10 breeding pairs via survey counts; "mature stand" = ≥5 ha with trees ≥50 cm DBH via aerial photos and forest inventory).
  - **Sets borderline ranges**: For each criterion, specifies a numeric or descriptive "borderline zone" (e.g., 8–12 breeding pairs for warblers; 4.5–5.5 ha for mature stands).
  - **Defines precedent tolerance**: Sets thresholds for "very similar" parcels (e.g., buffer widths within 2m; forest size within 10%).
  - **Chooses a trade-off rule**: Explicitly states that **failing any single criterion (1–3) sinks eligibility**, but **borderline cases are aggregated** via a scoring system (details below). No trade-offs are allowed between criteria—each must be met or borderline.
  - **Handles undecidable cases**: Uses a **temporary designation with a fixed review date** (e.g., 3 years) as the fallback for borderline cases, with an option for applicants to submit new evidence.
  - **Addresses lack of authority**: Since the board cannot amend the bylaw, the SIS is framed as an "interpretative guide" for consistent application. The board recommends the SIS to the commissioners annually, and all decisions reference it as a provisional tool. If challenged, the referral exit allows commissioners to overrule or codify it.

  **Theory note**: The SIS embodies a **supervaluationist** approach by defining multiple admissible sharpenings (via ranges and scores). Under epistemicism, the SIS would be a single sharp threshold (no borderline ranges), and borderline cases would be treated as "unknown" (inviting more evidence). I mark differences in the checklist.

  ---

  ### Decision Procedure Checklist
  **Time target**: 30 minutes per case. Use with site file open. Board members work through steps sequentially, voting at each exit. Staff ecologist pre-fills evidence summaries before the meeting.

  #### Step 0: Precedent Chain Check
  - **Question**: Is this parcel very similar to a previously decided one within the SIS precedent tolerance (e.g., buffer width ±2m, forest size ±10%)?
  - **Evidence**: Ecologist's memo comparing parcel to docket history (e.g., "Parcel B similar to denied Parcel A based on buffer width difference of 1m").
  - **Action**: 
    - If no similar precedent, proceed to Step 1.
    - If similar precedent exists:
      - Adopt the precedent decision (approve/deny) unless a **discontinuity** is declared.
      - To declare discontinuity, state a reason **unrelated to application order** (e.g., "New soil data shows different hydrology") and record it publicly.
      - If precedent is inconsistent (e.g., similar parcels approved and denied), proceed to Step 1 but flag for Step 5.
  - **Theory note**: Unchanged by epistemicism/supervaluationism. Handles sorites by forcing explicit discontinuities.

  #### Step 1: Viable Breeding Population
  - **Question**: Does the parcel support a viable breeding population of a species of concern?
  - **Evidence**: Survey counts (e.g., ≥10 warblers), species lists, ecologist's assessment. Ignore non-observable data (e.g., future projections).
  - **Thresholds (from SIS)**:
    - **Pass**: Meets or exceeds SIS sharpened threshold (e.g., 12+ warblers).
    - **Fail**: Below SIS threshold (e.g., ≤8 warblers).
    - **Borderline**: Within SIS borderline zone (e.g., 8–12 warblers).
  - **Action**:
    - Pass → Proceed to Step 2.
    - Fail → Exit: **Deny** (fails eligibility).
    - Borderline → Record score (1 of 3 points for eligibility) and proceed to Step 2.
  - **Judgment relocation**: Determining if evidence is reliable (e.g., survey method) requires board judgment. SIS defines thresholds to reduce ambiguity.

  #### Step 2: Mature Stand
  - **Question**: Does the parcel contain a mature stand?
  - **Evidence**: Aerial photos (canopy cover), forest inventory (tree age/size), soil maps (stand continuity). Ignore non-site data (e.g., regional averages).
  - **Thresholds (from SIS)**:
    - **Pass**: Meets SIS sharpening (e.g., ≥5 ha with trees ≥50 cm DBH).
    - **Fail**: Below SIS threshold (e.g., ≤4 ha or young trees).
    - **Borderline**: Within SIS borderline zone (e.g., 4.5–5.5 ha).
  - **Action**:
    - Pass → Proceed to Step 3.
    - Fail → Exit: **Deny** (fails eligibility).
    - Borderline → Record score (1 of 3 points) and proceed to Step 3.
  - **Trade-off handling**: No trade-offs. Fail sinks application; borderline contributes to aggregate eligibility score (Step 4).

  #### Step 3: Hydrological Connection
  - **Question**: Does the parcel have a substantial hydrological connection to the river corridor?
  - **Evidence**: Soil maps (hydric soils), distance measurements, topographic flow paths. Ignore non-spatial data (e.g., water quality reports).
  - **Thresholds (from SIS)**:
    - **Pass**: Meets SIS sharpening (e.g., ≤50m to river or wetland presence).
    - **Fail**: No connection (e.g., >100m and no flow paths).
    - **Borderline**: Within SIS borderline zone (e.g., 50–100m with intermittent flow).
  - **Action**:
    - Pass → Proceed to Step 4.
    - Fail → Exit: **Deny** (fails eligibility).
    - Borderline → Record score (1 of 3 points) and proceed to Step 4.
  - **Judgment relocation**: Interpreting "substantial" requires board judgment, but SIS uses measurable proxies (e.g., distance).

  #### Step 4: Eligibility Aggregation
  - **Question**: Are criteria 1–3 collectively met for eligibility?
  - **Action**:
    - All Pass → Proceed to Step 5.
    - Any Fail → Already denied in Steps 1–3.
    - **Borderline cases**:
      - Calculate eligibility score: 1 point per borderline criterion (max 3), 0 for pass/fail.
      - If score ≥2 (majority borderline), → Proceed to Step 6 (borderline handling).
      - If score ≤1 (minority borderline), → Treat as pass and proceed to Step 5.
  - **Theory note**: Under epistemicism, borderline = "unknown," so scoring is invalid; instead, invite more evidence (but time constraints make this impractical). Supervaluationist scoring allows aggregation of indeterminacy.

  #### Step 5: Minimal Adverse Impact
  - **Question**: Would the proposed activity have no more than minimal adverse impact?
  - **Evidence**: Project plans, ecologist's impact memo (e.g., habitat loss <5%). Ignore non-quantifiable claims (e.g., "ecosystem resilience").
  - **Thresholds (from SIS)**:
    - **Pass**: Impact below SIS threshold (e.g., habitat loss ≤4%).
    - **Fail**: Impact above SIS threshold (e.g., loss ≥6%).
    - **Borderline**: Within SIS borderline zone (e.g., 4–6% loss).
  - **Action**:
    - Pass → Exit: **Approve**.
    - Fail → Exit: **Deny**.
    - Borderline → Proceed to Step 6 (borderline handling).
  - **Trade-off handling**: No trade-offs with eligibility. Impact borderline handled separately.

  #### Step 6: Borderline Handling
  - **Question**: Are criteria indeterminate due to borderline results?
  - **Action**: 
    - Record findings: "Criteria are borderline for [list criteria]; outcome is not determined by the bylaw."
    - Apply fallback: **Temporary designation** with fixed review (e.g., 3 years) and option for new evidence. Do not use lottery or permanent denial.
    - Exit: **Record indeterminacy** and implement temporary status.
  - **Theory note**:
    - **Epistemicist view**: Describe as "answer unknown"; invite applicant to submit better evidence at review.
    - **Supervaluationist view**: Describe as "criteria leave open"; no evidence can resolve it, so temporary status is fair.
    - Both converge on temporary designation due to practical constraints.

  #### Step 7: Final Precedent Consistency
  - **Question**: Does the decision (approve/deny/temporary) conflict with a similar precedent without a declared discontinuity?
  - **Action**:
    - If no conflict, exit with decision.
    - If conflict, either:
      - Revise decision to match precedent, or
      - Declare discontinuity and restate reason from Step 0.
    - If temporary designation, no conflict check (indeterminate cases are unique).
  - **Judgment relocation**: Board judges if conflict is "material" (SIS defines tolerance, but application requires nuance).

  ---

  ### Exits Summary
  1. **Approve**: All eligibility criteria pass, and impact passes.
  2. **Deny**: Any eligibility criterion fails, or impact fails.
  3. **Record indeterminacy**: Borderline cases with temporary designation.
  4. **Refer to commissioners**: Only if SIS needs update (e.g., new evidence contradicts thresholds) or discontinuity requires rule-making. Not used for borderline—handled in Step 6.

  ---

  ### Procedure Applied to Four Cases
  **Case 1: 240-hectare mature forest with 14 breeding warbler pairs**  
  - Step 0: No precedent.  
  - Step 1: 14 warblers > SIS threshold (10) → Pass.  
  - Step 2: 240 ha > SIS (5 ha) → Pass.  
  - Step 3: Assume hydrology confirmed (e.g., river adjacent) → Pass.  
  - Step 4: All pass → Proceed.  
  - Step 5: Assume impact minimal (e.g., low-intensity use) → Pass.  
  - Step 7: No conflict → **Approve**.  
  - **Judgment step**: Hydrology evidence interpretation.  
  - **You will like this**: Clear approval with no issues.

  **Case 2: Mowed field with roadside drainage ditch**  
