  - **32m parcel**:  
    - Step 0: Very similar to 34m, but 34m temporary (no decision). Step 3: 32m <35m → Fail. → **Deny**.  
  - **Judgment step**: Buffer measurements and discontinuity reasons.  
  - **You will like this**: Chain handled with explicit discontinuities.

