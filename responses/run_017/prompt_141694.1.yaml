  ### What the Procedure Cannot Do (Expected Failures)
  After a year of use, expect these limitations:
  1. **SIS challenges**: Arbitrary thresholds may face legal or community pushback. Commissioners may need to intervene often.
  2. **Borderline overload**: Temporary designations could accumulate, causing administrative burden and applicant frustration.
  3. **Precedent rigidity**: Tolerance rules may force inconsistent outcomes if early cases are misdecided.
  4. **Evidence gaps**: Site files may lack data for SIS thresholds, leading to overuse of borderline (e.g., no tree counts).
  5. **Theory-practice gap**: Epistemicist "unknown" vs. supervaluationist "open" descriptions may confuse the public.
  6. **Urgent cases**: Temporary designations don't resolve time-sensitive issues (e.g., expiring options).

  **Recommendation**: Review the SIS annually with the ecologist, track decision patterns, and report failures to commissioners for bylaw refinements. The procedure makes vagueness manageable but cannot eliminate it—only relocate judgment to predefined rules.
