  - Step 1: No species evidence → Fail. → Exit: **Deny**.  
  - **Judgment step**: None (quick denial).  
  - **You will like this**: Efficient and clear.

  **Case 3: 11-hectare woodlot (better than denied, worse than approved; option expires in 6 weeks)**  
  - Step 0: Precedent: Similar parcels denied/approved. Flag for Step 5.  
  - Step 1: Assume borderline (e.g., 9 warblers vs. SIS 10) → Borderline (score 1).  
  - Step 2: 11 ha > SIS (5 ha) but trees may be young → Assume pass (not borderline).  
  - Step 3: Assume hydrology pass.  
  - Step 4: Score=1 (only one borderline) → Proceed.  
  - Step 5: Assume impact borderline (e.g., 5% habitat loss). → Proceed to Step 6.  
  - Step 6: Borderline impact → **Temporary designation** with 3-year review.  
  - Step 7: Precedent conflict: If similar parcels approved, declare discontinuity (e.g., "Higher habitat fragmentation here").  
  - **Judgment step**: Scoring eligibility and impact.  
  - **You will not like this**: Temporary designation may not resolve the expiring option, but it avoids arbitrary denial/approval. Epistemicism would invite more evidence, but time constraints prevent it.

  **Case 4: Riparian buffer chain (40m, 38m, 36m, 34m, 32m)**  
  *Assume SIS: Hydrological connection requires ≥35m buffer for "substantial" connection.*  
  - **40m parcel**:  
    - Step 0: No precedent.  
    - Step 3: 40m >35m → Pass.  
    - Assume other criteria pass → Step 5: Impact pass → **Approve**.  
  - **38m parcel**:  
    - Step 0: Very similar to 40m (2m difference). Adopt approval (no discontinuity). → **Approve**.  
  - **36m parcel**:  
    - Step 0: Very similar to 38m → **Approve** (no discontinuity).  
  - **34m parcel**:  
    - Step 0: Very similar to 36m (2m difference), but Step 3: 34m = SIS borderline (34–36m). → Proceed.  
    - Step 3: Borderline → Score eligibility.  
    - Assume other criteria pass → Step 5: Borderline impact → Step 6: **Temporary designation**.  
