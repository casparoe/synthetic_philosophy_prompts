    - *In Force*: Rules applied by officials without challenge.
    - *In Suspense*: Rules whose validity is contested, set aside pending resolution.
    - *In Advance*: Rules that can't be authorized yet but might be if future rules validate them. The Ninth Revision fits here—it claims validity under the rules it would create.
  - **The Register Paradox**: Entry 1 (creating the Register) was deleted by a rule relying on the Register's procedures. This makes the Register's foundation unstable—perfect for "in advance" or "in suspense."
  - **Form Requirement**: Form RV-9 for acting under uncertain rules. Officials must file it when applying "in advance" or "in suspense" rules, acknowledging the ambiguity but proceeding anyway. This embodies the bureaucratic "just keep going" ethos.
  - **Worked Example**: Apply the TVF to the Ninth Revision. It's "in advance" because its validity depends on future validation by the very rules it enacts. The memo notes that the Assembly keeps using it, so officials should file RV-9 forms—practically endorsing it while theoretically hedging.
