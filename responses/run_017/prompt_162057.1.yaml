  **MEMORANDUM**

  **TO:** Faculty Senate Members
  **FROM:** Reginald P. Whitaker, University Parliamentarian
  **DATE:** October 28, 2023
  **SUBJECT:** Clarification on Contextual Validity of Premise Findings

  This memorandum addresses inquiries arising from the differing outcomes concerning enrollment declines in Modern Languages/Language Requirement courses during the October 27th Senate meeting.

  Senate Resolution SR-23-01 mandates premise-based voting for motions possessing identifiable logical structure. A key feature of this system, often termed "Question-Relative Judgment Exhaustion" (QRJE) in procedural scholarship, is that the Senate's finding on a specific premise is valid *only* for the purpose of the specific motion then under consideration.

  The finding on **Premise B** (enrollment decline for ULR courses) within **Motion 23-CC-78** was exhausted upon establishing the logical validity of the conclusion *for that motion*. It established a context-specific fact relative to the ULR suspension question.

  The subsequent finding on **Premise C** (enrollment decline impacting operational viability) within **Motion 23-BR-42** was a distinct question, posed in a different context (resource reallocation vs. requirement suspension), potentially interpreted under slightly different criteria ("sustainable levels" vs. "operational viability"), and occurring later in the meeting where new information or perspectives might have arisen. Its negative outcome is therefore independently valid *for the purpose of Motion 23-BR-42*.

  QRJE ensures that each proposition is decided solely on the votes cast upon it during its specific agenda slot, upholding decisional independence per question (Desideratum 3 from GC-23-05). It prevents the Senate from being procedurally bound by prior findings on seemingly similar facts when addressing substantively different motions. This is not inconsistency, but rather the recognition that collective judgments are formed relative to, and exhausted by, the precise question before the body at a given time.

  This feature is inherent to premise-based voting systems prioritizing decisional independence per question and is functioning as designed. The Parliamentarian's office affirms the Chair's rulings regarding the separate validity of Premise B and Premise C findings were procedurally correct under SR-23-01.

  R.P. Whitaker
  University Parliamentarian
