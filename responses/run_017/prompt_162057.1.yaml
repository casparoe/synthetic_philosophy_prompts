  **MINUTES OF THE REGULAR MEETING OF THE FACULTY SENATE**
  **CENTRAL PLAINS UNIVERSITY**
  **OCTOBER 27, 2023 – 3:00 PM, HERITAGE HALL ROOM 214**

  **I. CALL TO ORDER**
  The Chair, Professor Aris Thorne (History), called the meeting to order at 3:07 PM. A quorum was declared present. Minutes of the previous meeting (October 13, 2023) were approved without amendment.

  **II. CURRICULUM COMMITTEE REPORT**
  Prof. Evelyn Cho (Linguistics), Chair of the Curriculum Committee, presented the following motion:

  > *Motion 23-CC-78:* Whereas the Undergraduate Language Requirement (ULR) is predicated on sufficient student enrollment to sustain viable course sections; and whereas recent enrollment data indicates a significant decline in ULR course registrations; therefore be it Resolved, that the ULR be suspended for the 2024-2025 academic year pending further review.

  Sen. Cho noted the motion involved a conditional structure. Per Senate Resolution SR-23-01 (Procedure Reform), the Senate voted on the component premises separately.

  *   **Premise A:** *If* enrollment in courses fulfilling the Undergraduate Language Requirement has fallen below sustainable levels, *then* the requirement should be suspended. **Vote:** 28 Aye, 12 Nay, 5 Abstain. **Motion Carried.**
  *   **Premise B:** Enrollment in courses fulfilling the Undergraduate Language Requirement has fallen below sustainable levels. **Vote:** 25 Aye, 15 Nay, 5 Abstain. **Motion Carried.**
  *   **Conclusion:** Therefore, the Undergraduate Language Requirement should be suspended for the 2024-2025 academic year. **Vote:** 10 Aye, 25 Nay, 10 Abstain. **Motion Failed.**

  The Chair observed that, as Premises A and B were both affirmed by majority vote, the logical conclusion, as articulated in the original motion text, necessarily followed. The Chair therefore declared Motion 23-CC-78 **Carried**, and the ULR suspended for 2024-2025.

  Sen. Robert Vance (Mathematics) objected, stating that the majority had explicitly voted against the conclusion. The Chair ruled the objection out of order, citing SR-23-01 Section 4(b): "The validity of a conclusion derived from affirmed premises is established by the affirmation of said premises; a subsequent vote on the conclusion itself is advisory only and does not negate the procedurally mandated outcome."

  **III. BUDGET AND RESOURCES COMMITTEE REPORT**
  Prof. Marcus Bellweather (Economics), Chair of the Budget Committee, presented the following motion:

  > *Motion 23-BR-42:* Whereas the Department of Modern Languages has experienced a demonstrable decline in student enrollment impacting its operational viability; therefore be it Resolved, that one (1) vacant Lecturer line in the Department of Modern Languages be reallocated to the Department of Computer Science.

  Sen. Bellweather clarified that the motion relied on the factual premise of enrollment decline in Modern Languages. Per SR-23-01, the Senate voted on the premise.

  *   **Premise C:** The Department of Modern Languages has experienced a demonstrable decline in student enrollment impacting its operational viability. **Vote:** 12 Aye, 28 Nay, 5 Abstain. **Motion Failed.**

  The Chair observed that, as the factual premise was rejected by majority vote, the conclusion (reallocation of the lecturer line) could not logically follow. Motion 23-BR-42 was therefore declared **Failed.**

  **IV. GOVERNANCE COMMITTEE REPORT**
  Prof. Susan Davies (Political Science), Chair of the Governance Committee, presented the Committee's findings on voting procedures (Senate Charge SC-23-05). The report was received and entered into the record.

  The Committee reviewed historical Senate practices (Conclusion-Based Voting, Premise-Based Voting under SR-23-01, Sequential Priority Voting, and Expert Panel Referral) against established desiderata:
  1.  Admissibility of any combination of individual judgments.
  2.  Equal weight per Senator per question.
  3.  Decisional independence per question.
  4.  Unanimous preference yields preferred outcome.
  5.  Logical consistency of collective outcomes.

  The Committee certified that no extant voting procedure satisfies all five desiderata simultaneously. Any procedure satisfying (1), (2), and (3) risks violating either (4) or (5), as demonstrated by specific instances (referenced in Appendix A of the report). The Committee further noted that vesting all decisions in a single individual (e.g., the Chair) satisfies (1), (2), (4), and (5), but violates (3) decisional independence per question. This approach was rejected by the Committee on grounds unrelated to logic.

  Given the impossibility of satisfying all desiderata, the Committee recommended:

  > *Motion 23-GC-15:* Be it Resolved, that the Chair of the Faculty Senate is hereby empowered, for each agenda item, to designate which one (1) of the five (5) desiderata enumerated in Governance Committee Report GC-23-05 shall be formally suspended for the purpose of determining the procedure and outcome of that item.

  Following brief discussion, the motion was put to a vote under standard procedure (conclusion-based voting, per SR-23-01 Section 7 for procedural motions). **Vote:** 20 Aye, 18 Nay, 7 Abstain. **Motion Carried.**

  **V. PROPOSAL FOR PROCEDURAL REFINEMENT: BUNDLING**
  Prof. Davies, further reporting for the Governance Committee, proposed a refinement termed "Bundling" as a potential solution to the consistency dilemma identified in SC-23-05.

  Bundling involves formulating complex decisions as single, compound resolutions that encapsulate all logically interdependent premises and conclusions. Once bundled into a single proposition, a single vote determines the entire outcome, inherently preventing logical inconsistency across the bundle. The Committee provided examples.

  The Senate considered the following illustrative bundle proposal:

  > *Bundle Proposal B-001:* Be it Resolved that:
  > (a) Student demand for interdisciplinary data science minors has increased by 25% over the past three years;
  > (b) Meeting this demand aligns with the University's Strategic Plan Priority 3: "Innovation and Interdisciplinarity";
  > (c) Therefore, $178,500 shall be allocated from the Strategic Initiative Fund to establish a new interdisciplinary Data Science Minor program office.

  Sen. Vance (Mathematics) protested that this approach fuses distinct factual, evaluative, and fiscal decisions into a single vote, meaning the Senate is no longer deciding the components but merely ratifying or rejecting the drafter's bundled proposition. He argued the Senate itself holds beliefs about these distinct matters that are not captured by a single vote on a package. The Chair ruled the comment constituted debate on the *concept* of bundling, not a challenge to procedure, and noted the concept was under discussion.

  The Governance Committee recommended adopting bundling as a standard option for complex or logically intricate motions. A motion to accept the recommendation in principle and draft enabling legislation was made. **Vote:** 24 Aye, 16 Nay, 5 Abstain. **Motion Carried.**

  **VI. ADJOURNMENT**
  Sen. Vance rose on a point of order, stating: "Mr. Chair, this body is no longer a deliberative assembly reaching reasoned conclusions. We are merely producing vote totals on premises we may not believe or on bundles we did not shape, while the actual decisions – what we decide *about* and *how* we decide it – rest entirely with those who frame the premises and draft the bundles. We have dissolved collective agency into procedural mechanics." The Chair thanked Sen. Vance for his observation and, seeing no further business, adjourned the meeting at 5:48 PM.

  **Respectfully Submitted,**
  Janice K. Peterson
  Secretary of the Faculty Senate

