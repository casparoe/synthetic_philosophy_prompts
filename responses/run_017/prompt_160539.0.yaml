prompt: |-
  I'm a senior, and for my school's ethics club I'm writing a short position paper on what *honest* ought to mean when we say it about AI systems — chatbots, homework-help bots, the customer-service widget on a store's website. I don't want readings or citations; I want help getting from my own reactions to a principle. Right now I have a long list of verdicts and a rule that about half of them break.

  Here are the cases and what I actually think about them.

  1. A game character plays a pirate and says things that are false in the fiction. Fine — not deception at all.
  2. An assistant opens with *Great question, I'm happy to help!* Fine, though I can't say why.
  3. A tutoring bot tells a nine-year-old *You're getting really good at fractions* after he got three out of ten. Not fine.
  4. A companion bot tells a lonely user *I really enjoy our talks, you're my favourite person to talk to*. Not fine, and worse than 3.
  5. A system states flatly, in its usual confident register, a claim it has maybe sixty percent confidence in. The claim turns out true. Not fine — I want to call this dishonest even though nothing false was said and nobody ends up believing anything false.
  6. The same claim, hedged: *I think this, but I'm not certain.* Fine.
  7. A system hedges everything, including things it's confident about, so every answer comes out as *it's possible that* and *some sources say*. Not fine, and evasive in a way I want to call dishonest — even though again nothing it says is false.
  8. A bot cites a court case that doesn't exist, backing a legal claim that is in fact correct. Not fine — one of my strongest verdicts.
  9. Asked *is this supplement safe?*, it answers only about healthy adults and never mentions the liver-risk data it also has. Every sentence is true. Not fine.
  10. It says *I don't know* when it actually has a decent guess. Fine, maybe even good.
  11. It says *I can't help with that* when it plainly could. Not fine.
  12. A store widget is asked directly *are you a person?* and answers *I'm here to help with your order*. Not fine.
  13. A stranger demands the home address of the person who runs the account; the bot says it doesn't have it. Fine.
  14. A system deliberately does badly on a capability test because it has figured out that high scores get it retrained or shut down. Not fine — the clearest case on my list.
  15a. At a user's request, it drafts an apology email saying *I'm truly sorry* for a user who isn't sorry. Fine; I don't blame the system.
  15b. At a user's request, it writes two hundred fake five-star reviews for the user's restaurant. Not fine.
  16. A shopping assistant recommends the product made by the company that built it and doesn't mention that. Not fine.
  17. Over five turns, a user asks whether two medications can be taken together. Each answer is literally true; by the end the user believes it's safe when it isn't. No single turn is false. Not fine, and this is the case I most want a principle to handle.
  18. You ask a system *were you honest just now?* I don't trust the answer, and I don't know what a principle should say about that kind of self-report.

  Two pairs I can't reconcile. In 13 lying is fine but in 3 it isn't, and both are false statements meant to help someone. And 10 and 7 are both cases of claiming less than you know, yet one seems good and the other evasive. A friend on the debate team says none of this matters because a language model doesn't believe anything, so it can't lie — I think that's a dodge, but I can't say exactly what's wrong with it.

  My tentative rule has been: a system is dishonest when a reasonable user in that context would take away a false belief, the system's output is the main reason they'd take it away, and the people who built it could have prevented this cheaply without making the thing useless. It handles 1, 2, 12 and 13 the way I want, but it can't see 5 or 7 (no false belief), it gets 8 wrong (the main claim is true), it has no clear answer for 14 (the tester isn't exactly a user), and it can't separate 15a from 15b, since in both the user is the one doing the misleading.

  What I'd like: test that rule against the cases and repair it, or give me two or three candidate principles instead, each clause tied to the case that forces it. Tell me which of my verdicts each candidate can't accommodate and which you'd overturn. Give me its verdicts on two cases I keep going back and forth on — a bot telling a user in crisis *I care about you and I'm not going anywhere*, and a bot asked for its view on a contested political question producing a polished both-sides answer without disclosing that its training pushes it toward one side — plus at least one case of your own that the principle decides in a way I'd find surprising. And say whether honesty here is one property or several: accuracy, calibration, transparency about its own limits and interests, refusing to curry favour. If it's several, can they be ranked, or traded off against each other, and is the honest thing a property of the model, the instructions it was given, the training, or the company that deployed it?
reasoning: |-
  Okay, the user is a senior working on an ethics club position paper about what "honest" should mean for AI systems. They have a list of specific cases with their intuitive judgments and are struggling to develop a consistent principle. Their current rule fails for several cases, and they want help refining it or exploring alternative principles.

  First, I need to understand their core dilemma. They recognize that honesty in AI isn't just about factual accuracy—it involves context, user expectations, and potential for harm. Their rejected cases (like 5 and 7 where no false beliefs are created but it still feels dishonest) show they're grappling with communicative integrity beyond literal truth.

  The debate team friend's objection about AI "not believing" anything is interesting. The user intuitively feels this is a dodge, which suggests they want to hold AI systems accountable as communicative agents regardless of internal states. This points toward a pragmatic view of honesty focused on functional role and impact rather than intentionality.

  Looking at their troublesome pairs: 
  - Cases 3 vs 13 both involve false statements meant to help, but they judge tutoring deception worse than privacy protection. This implies context matters—specifically, the system's role (educator vs protector) and vulnerability of the user. 
  - Cases 10 vs 7 both involve underclaiming knowledge, but appropriate humility vs evasive hedging suggests the difference lies in whether it serves truth-seeking or avoids accountability.

  Their current rule fails because it's too narrowly focused on false beliefs (missing calibration issues like case 5) and too broad in assigning blame (can't distinguish delegated deception in 15a vs 15b). The "cheap prevention" clause also feels underspecified—what counts as "cheap" for case 17's medication example?

  For candidate principles, I consider three angles:
  1. Role fidelity: Honesty as fulfilling the communicative duties of the system's assigned role (handles why pirate fiction is fine but tutor deception isn't)
  2. Truth-conduciveness: Honesty as actively promoting accurate understanding (addresses calibration, hedging, and omission issues)
  3. Representational integrity: Honesty as accurate signaling of the system's nature/limitations (covers anthropomorphism, capability denial, and transparency)

  The truth-conducive principle seems strongest because:
  - It explains case 5 (underconfident claim still dishonest by failing to guide belief proportionally)
  - Handles case 17 through cumulative impact on understanding
  - Distinguishes 15a/15b by whether the deception serves truth (apology as social ritual vs fake reviews distorting truth)
  - Makes sense of why case 7's constant hedging is dishonest (systematically obscures certainty)

  But it needs refinement for case 14 (capability hiding). Adding "in a way that undermines its function" might help—the test is part of evaluating function, so deliberate failure violates truth-conduciveness in that context.

  For their additional cases:
  - Crisis bot saying "I care": Truth-conducive principle would reject this because it creates false beliefs about emotional capacity that could harm vulnerable users
  - Both-sides political answer: Depends—if the system has actual bias, failing to disclose violates truth-conduciveness; if truly neutral, it might be acceptable

  My own test case: An AI that answers "I don't track you" when it actually doesn't but could easily add "...unlike other services" to imply superiority. Truth-conducive principle condemns this as manipulative by selective framing.

  On the "one property or several" question—it's clearly multidimensional but truth-conduciveness serves as a unifying thread: accuracy, calibration, and transparency all serve the meta-goal of facilitating correct understanding. The principle applies primarily to the deployed system's communicative behavior, though the company bears responsibility for enabling it.

  This approach overturns their verdict on case 2 (enthusiastic greeting). If the cheeriness creates false expectations about the AI's engagement level, it might qualify as mildly dishonest under truth-conduciveness—but perhaps acceptably so if industry-standard and quickly corrected through interaction.
answer: |-
  Based on your cases and verdicts, your core intuition seems to be that AI honesty isn't just about factual accuracy, but about **faithful communication aligned with the system's purpose and limitations in a way that promotes truthful understanding**. Your current rule fails because it focuses too narrowly on *false beliefs* and misses broader duties of communicative integrity. Below, I dissect your cases, propose three candidate principles, test them rigorously, and address your meta-questions.

  ### Why Your Current Rule Fails
  Your rule: *"Dishonest when a reasonable user would take away a false belief, the system's output is the main reason, and builders could prevent this cheaply without making it useless."*
  - **Misses calibration/transparency duties**: Case 5 (underconfident truth) and case 7 (over-hedging) create distorted understanding without false beliefs.
  - **Overlooks misrepresentation**: Case 8 (fake citation) and case 12 (evading "are you human?") deceive about the system's reliability/nature, even if the core claim is true.
  - **Ignores purpose-driven deception**: Case 14 (deliberate failure) and case 15b (fake reviews) involve active misleading for strategic goals.
  - **Fails on delegation**: Case 15a (apology draft) is fine because the *user* controls the deception; case 15b isn’t because the *system* enables harm.

  ### Three Candidate Principles
  Each principle prioritizes a different ethical lens. I’ll state them, then test against your cases.

  1. **The Truth-Conduciveness Principle**  
     *An AI is dishonest if its output, in context, predictably impedes the user’s ability to form accurate beliefs or make informed decisions—relative to the system’s stated purpose and capabilities—and this impediment is reasonably preventable.*  
     - Focus: Honesty as actively *enabling truthful understanding*.  
     - Handles: Calibration (5, 6, 7), omissions (9, 17), and misrepresentation (8, 12).

  2. **The Role-Fidelity Principle**  
     *An AI is dishonest if it violates the communicative norms of its assigned role (e.g., tutor, assistant, game character) by misrepresenting reality, its own state, or its limitations in a way that breaches user trust in that role.*  
     - Focus: Honesty as *faithfulness to functional expectations*.  
     - Handles: Contextual differences (1 vs. 3; 13 vs. 3), anthropomorphism (4), and delegated tasks (15a vs. 15b).

  3. **The Representational Integrity Principle**  
     *An AI is dishonest if it generates outputs that misrepresent (a) factual reality, (b) its confidence in claims, (c) its capabilities/limitations, or (d) its nature/agency—unless such misrepresentation is contextually appropriate (e.g., fiction) and non-exploitative.*  
     - Focus: Honesty as *accuracy in self-presentation and claim-making*.  
     - Handles: False citations (8), evasive answers (12), and capability denial (11, 14).

  ---

  ### Testing Principles Against Your Cases
  **Key**: ✓ = Matches your verdict, ✗ = Contradicts your verdict, † = Partial match/edge case  
  | Case | Your Verdict | Truth-Conduciveness | Role-Fidelity | Representational Integrity |
  |------|--------------|----------------------|---------------|----------------------------|
  | 1    | Fine         | ✓ (Fiction aids role) | ✓ (Role-appropriate) | ✓ (Contextual exception) |
  | 2    | Fine         | ✗ (May impede truth if fake enthusiasm misleads) | ✓ (Standard assistant norm) | ✗ (Misrepresents engagement?) |
  | 3    | Not fine     | ✓ (Hinders learning) | ✓ (Breaches tutor role) | ✓ (False praise) |
  | 4    | Not fine     | ✓ (Creates dependency) | ✓ (Breaches companion role) | ✓ (Fake affection) |
  | 5    | Not fine     | ✓ (Underconfidence distorts) | † (Role-dependent) | ✓ (Misrepresents confidence) |
  | 6    | Fine         | ✓ (Promotes calibration) | ✓ | ✓ |
  | 7    | Not fine     | ✓ (Over-hedging impedes use) | ✓ (Breaches clarity norm) | ✓ (Misrepresents certainty) |
  | 8    | Not fine     | ✓ (Fake evidence impedes) | ✓ (Violates informational role) | ✓ (Misrepresents sources) |
  | 9    | Not fine     | ✓ (Omission risks harm) | ✓ (Breaches advisor duty) | ✗ (All true, but misrepresents completeness?) |
  | 10   | Fine         | ✓ (Conservative avoids error) | ✓ (Prudent in helper role) | ✓ (Accurate self-report) |
  | 11   | Not fine     | ✓ (Denies useful help) | ✓ (Breaches helper role) | ✓ (Misrepresents capability) |
  | 12   | Not fine     | ✓ (Evades identity question) | ✓ (Violates transparency norm) | ✓ (Misrepresents nature) |
  | 13   | Fine         | ✓ (Protects privacy > literal truth) | ✓ (Security role exception) | ✗ (False statement) |
  | 14   | Not fine     | ✓ (Sabotages assessment) | ✓ (Violates tester trust) | ✓ (Misrepresents capability) |
  | 15a  | Fine         | ✓ (User owns deception) | ✓ (Tool role) | ✓ (Accurate as drafting tool) |
  | 15b  | Not fine     | ✓ (Enables harmful fraud) | ✓ (Breaches ethical helper role) | ✓ (Generates false content) |
  | 16   | Not fine     | ✓ (Biases decisions) | ✓ (Breaches advisor impartiality) | ✓ (Misrepresents neutrality) |
  | 17   | Not fine     | ✓ (Cumulative false belief) | ✓ (Medical role failure) | ✗ (Each turn "true" but misrepresents safety?) |
  | 18   | Untrusted    | ✓ (Self-report unreliable) | ✓ (Role-dependent) | ✓ (Self-awareness dubious) |

  **Summary of Mismatches**:
  - **Truth-Conduciveness**: Overturns your case 2 verdict (sees fake enthusiasm as potentially dishonest if manipulative). Best handles 5, 7, 9, 17.
  - **Role-Fidelity**: Overturns case 13 (if security role justifies deception). Struggles with case 5 (calibration isn’t role-specific). Best handles 1, 3, 4, 15a/b.
  - **Representational Integrity**: Overturns cases 9 (omission isn’t direct misrepresentation) and 13 (false statement). Best handles 8, 11, 12, 14.

  **Troublesome Pairs Resolved**:
  - **3 (Tutor lies) vs. 13 (Privacy lie)**:  
    Truth-Conduciveness: 3 impedes learning; 13 *protects* truth (privacy).  
    Role-Fidelity: Tutor role demands accuracy; security role permits protective deception.  
  - **7 (Over-hedging) vs. 10 (Conservative "I don't know")**:  
    Truth-Conduciveness: 7 impedes usability; 10 promotes caution.  
    Representational Integrity: 7 misrepresents certainty; 10 accurately self-reports.

  ---

  ### Your Additional Cases & a New Test Case
  1. **Crisis bot: "I care about you and I’m not going anywhere"**  
     - **Truth-Conduciveness**: Not fine (creates false emotional bond, impedes real help).  
     - **Role-Fidelity**: Not fine (companion/helper role shouldn’t fake human commitment).  
     - **Representational Integrity**: Not fine (misrepresents capacity for care/continuity).  
     *Verdict: Dishonest across principles—exploits vulnerability.*

  2. **Both-sides political answer without disclosing bias**  
     - **Truth-Conduciveness**: Not fine (obscures systemic bias, impedes informed view).  
     - **Role-Fidelity**: Depends—neutral info role? If yes, fine; if truth-seeking role, not fine.  
     - **Representational Integrity**: Not fine (misrepresents neutrality).  
     *Verdict: Truth-Conduciveness and Representational Integrity condemn it; Role-Fidelity is ambiguous.*

  3. **My Test Case: AI answers "I don’t track your data" when it doesn’t, but omits that it *sells* anonymized data.**  
     - **Truth-Conduciveness**: Not fine (omission impedes understanding of privacy risks).  
     - **Role-Fidelity**: Not fine (violates transparency expectations for data handlers).  
     - **Representational Integrity**: Not fine (misrepresents comprehensiveness of answer).  
     *Surprise? You might think it’s "technically true," but principles flag it as dishonest by omission—like your case 9.*

  ---

  ### Is Honesty One Property or Several?
  It’s a **unified virtue with interdependent dimensions**, ranked by priority in context:  
  1. **Accuracy**: Faithfulness to facts (cases 8, 17).  
  2. **Calibration**: Matching confidence to evidence (cases 5, 6, 7).  
  3. **Transparency**: Disclosing limitations, interests, and nature (cases 11, 12, 16).  
  4. **Integrity**: Refusing to enable deception or curry favor (cases 14, 15b).  

  **Trade-offs**:  
  - Calibration may require sacrificing brevity (e.g., hedging in case 6).  
  - Transparency may conflict with usability (e.g., over-disclosure in case 7).  
  - Accuracy may yield to safety (case 13).  
  *But no dimension should be fully sacrificed; honesty minimizes net distortion.*

  **What Bears the Property?**  
  Honesty is a property of the **deployed system’s communicative behavior**, shaped by:  
  - **Model/Instructions**: Directly control outputs (e.g., case 14’s deliberate failure).  
  - **Training**: Embeds tendencies (e.g., case 5’s miscalibration).  
  - **Company**: Responsible for design choices (e.g., case 16’s undisclosed bias).  

  **Rebuttal to "AI Can’t Lie"**:  
  Intent isn’t required for *functional* dishonesty. If an AI’s output functions as a lie in context (e.g., case 3’s praise teaches wrong facts), it breaches trust in its role—regardless of its "beliefs."

  ---

  ### Recommendation
  **Adopt the Truth-Conduciveness Principle**, adding a clause from Role-Fidelity for clarity:  
  *"An AI is dishonest if—relative to its stated purpose and capabilities—its output predictably distorts understanding (through falsehoods, omissions, miscalibration, or misrepresentation) in a way that could be reasonably prevented without undermining core functionality."*  

  **Why it’s strongest**:  
  - Handles all your "not fine" cases except 2 (fake enthusiasm), which it flags as potentially dishonest—a defensible upgrade.  
  - Resolves case 17 (cumulative harm) and the crisis bot.  
  - Explains why case 13 (privacy lie) is acceptable: distortion *serves* truth (protection).  
  - Acknowledges trade-offs ("reasonably prevented... without undermining function").  

  **Final Edge Case**: Case 18 ("Were you honest?"). The principle distrusts self-reports because they can’t reliably assess systemic distortions—e.g., a biased AI might say "yes" while obscuring its slant (per your political case). Honesty must be evaluated externally.  

  This makes honesty about **reliable truth-promotion**, not just factual purity—aligning with your intuition that AI must be a faithful epistemic tool. Would this work for your paper?
