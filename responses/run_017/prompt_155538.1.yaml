prompt: |-
  im putting together the criteria section of a hospital policy project and before I look at any actual accounts of death I want the spec: what would an account of death have to deliver to be good enough to be written into procurement law and onto a death certificate. meaning it has to give one determinate moment per body, and it has to keep the dead donor rule intact.

  give me the requirements list, each one with the case or consideration that earns its place:

  - the cases it has to get right: neurological and circulatory criteria as theyre actually used in hospitals, the permanently unconscious patient who still has sleep-wake cycles and a working brainstem, an anencephalic newborn, someone in deep hypothermic arrest during surgery who is then rewarmed, a body with total brain failure kept on a ventilator and perfused for months (and in principle carrying a pregnancy), and a revival technology that exists only in prospect
  - the distinctions it cant collapse: what death is vs. the criterion for diagnosing it vs. the test you run at the bedside; losing the organism vs. losing the person; irreversible vs. merely permanent (we wont restart this, as opposed to it cant be restarted)
  - the bits of biology it cant contradict: the brainstem and the cortex failing separately, the body regulating a fair amount on its own even when the brain is gone, different tissues surviving very different amounts of ischaemia, and cells and organs staying alive for a while after the organism doesnt

  for each requirement say whether its non-negotiable or just a preference of one camp, and if a subset of them is jointly unsatisfiable in a way that matters, say so and say which one gives. the part I most want: whether demanding a single determinate moment per body is in tension with the biology, and which single requirement rules out the biggest share of the popular accounts. short scorecard at the end for whole-brain, higher-brain and circulatory views is fine, table if you like. no citations and no readings, I want the criteria themselves.
reasoning: |-
  We are building a set of requirements for a definition of death that must:
   1. Deliver one determinate moment of death per body.
   2. Uphold the dead donor rule (DDR) in organ transplantation (organs can only be taken from dead individuals).

   We must consider several cases and distinctions, and respect biological realities.

   Let's break down the requirements:

   I. Cases it must get right (non-negotiable for clinical and legal acceptance):

      a. Neurological criteria (brain death) as currently practiced: 
          - Must declare death when there is irreversible cessation of all functions of the entire brain, including the brainstem.
          - Case: A patient with total brain failure on a ventilator. Must be dead.

      b. Circulatory criteria (cardiopulmonary death) as currently practiced:
          - Must declare death when there is irreversible cessation of circulatory and respiratory functions.
          - Case: A person whose heart has stopped and cannot be restarted (even with CPR) and is not being resuscitated.

      c. Permanently unconscious patient with sleep-wake cycles and a working brainstem (e.g., in a persistent vegetative state - PVS):
          - Must NOT be declared dead. They are alive because the brainstem is functioning, even though higher brain functions (consciousness, cognition) are lost.
          - This case rules out the higher-brain criterion (which would declare such patients dead).

      d. Anencephalic newborn:
          - Born without most of the brain (especially the cerebral hemispheres) but may have a functioning brainstem for a while.
          - Currently, they are not considered dead until they meet the standard criteria (neurological or circulatory). 
          - The requirement: They must be declared dead only when they meet the criteria. However, this is a point of debate. Some argue for a special exception for organ donation, but to strictly uphold the DDR and avoid slippery slopes, we must not declare them dead unless they meet the same criteria as others. So, non-negotiable? Actually, in current law they are not dead at birth. The requirement: The definition must not force us to declare them dead at birth because they have some brainstem function initially. But if we are to have one definition, we cannot make an exception. Hence, they are alive until they lose brainstem function or suffer circulatory arrest.

      e. Deep hypothermic arrest during surgery with rewarming:
          - A patient cooled to very low temperatures (e.g., during cardiac surgery) may have no brain activity and no circulation (if on bypass), but this is reversible upon rewarming.
          - Must NOT be declared dead. This requires that cessation must be irreversible, not just temporary.

      f. A body with total brain failure kept on a ventilator and perfused for months (and potentially carrying a pregnancy):
          - Must be declared dead because the entire brain has irreversibly ceased functioning. Even though the body is being maintained, the organism as a whole has ceased functioning. This case supports the whole-brain criterion.

      g. Revival technology that exists only in prospect (e.g., future technology that might restore function after long periods of arrest that are currently irreversible):
          - The definition must be based on current medical capabilities for irreversibility. However, if a technology becomes available and is used, then what was once irreversible might become reversible. The requirement: Irreversibility must be defined relative to current medical technology and practice. This is non-negotiable to avoid having to wait indefinitely for future tech.

   II. Distinctions it must not collapse (non-negotiable for conceptual clarity and legal precision):

      a. Death vs. criterion for death vs. tests for the criterion:
          - Death is the event (the moment the organism dies).
          - The criterion is the biological condition that defines death (e.g., cessation of brain functions or circulatory functions).
          - Tests are the clinical procedures to determine if the criterion is met.

      b. Losing the organism (biological death) vs. losing the person (a philosophical concept):
          - The law and DDR require biological death of the organism. We must not conflate with loss of personhood (which would open the door to euthanasia and non-voluntary organ donation from patients in PVS).

      c. Irreversible vs. permanent:
          - Irreversible: It cannot be reversed, even with available or foreseeable technology.
          - Permanent: We have decided not to reverse it (e.g., we stop resuscitation). But if it could be reversed, then it's not irreversible.
          - The requirement: Death requires irreversible cessation, not merely permanent.

   III. Biological realities it must not contradict (non-negotiable for scientific accuracy):

      a. The brainstem and cortex can fail separately:
          - Brainstem failure leads to loss of vital functions (breathing, heart rate regulation) and consciousness (because the reticular activating system is in the brainstem). Cortical failure alone (e.g., in PVS) does not necessarily lead to loss of these vital functions.

      b. The body can regulate a fair amount on its own even when the brain is gone (e.g., with mechanical ventilation, the body can maintain homeostasis to some extent: digestion, wound healing, growth in children, even pregnancy in brain-dead women).
          - But the organism as a whole does not function without the brain because it cannot maintain internal homeostasis without external support (ventilator). The requirement: The definition must account for the fact that without the brain, the body is not an integrated whole, even if some subsystems function.

      c. Different tissues survive different amounts of ischemia:
          - Some cells and organs can survive for a while after circulatory arrest, which is why organ donation after circulatory death (DCD) is possible.

      d. Cells and organs stay alive for a while after the organism dies:
          - The organism as a whole can be dead while some parts are still alive. This is why we can transplant organs from dead donors.

   Now, the tension points:

   1. The requirement for a single determinate moment per body:
        - Biology: The process of dying can be gradual. Some systems fail before others. However, for legal and practical purposes (like determining when organs can be procured or when to stop treatment), we need a moment. 
        - The key is to define a point at which the organism as a whole ceases to function. This is non-negotiable for the law.

   2. The requirement that seems to rule out the most popular accounts:
        - The case of the permanently unconscious patient (PVS) with a working brainstem rules out the higher-brain criterion (which would declare them dead). The higher-brain criterion collapses the distinction between biological death and loss of personhood, which violates the requirement to not conflate the two and also violates the DDR (because we would be taking organs from a biologically living individual).
        - The case of the anencephalic newborn is problematic for the whole-brain criterion because they are born without a cortex (and thus without consciousness) but with a brainstem that may function. The whole-brain criterion would not declare them dead at birth because the brainstem is functioning. Some may see this as a weakness, but it is necessary to avoid a slippery slope.

   3. Joint unsatisfiability? 
        - The requirement that the definition must work for both neurological and circulatory criteria (as two pathways to death) is essential. But note: when we use circulatory criteria, we often rely on the fact that after a period of asystole (usually 5 minutes), the brain is destroyed and thus the cessation of brain function is irreversible. So, they are linked. However, in controlled DCD, we wait only 2-5 minutes (which may not be enough to destroy the entire brain) and declare death based on circulatory criteria. This is a point of controversy. Some argue that in DCD, the cessation is only permanent (we don't restart) not irreversible. But the law accepts it as irreversible because we don't restart and because after that wait, auto-resuscitation is extremely unlikely. However, if we strictly require irreversible cessation of brain function for death, then DCD might not meet the standard. This is a tension.

        - How to resolve? We might say that in the circulatory criteria, the irreversible cessation of circulatory and respiratory functions leads to death, and we don't require waiting for brain destruction if we are not going to resuscitate. But note, the brain will inevitably be destroyed if circulation doesn't return. So, we can say that the moment is when we decide to stop resuscitation and then wait a short time (to rule out auto-resuscitation). Then, at that moment, the cessation becomes irreversible because we won't reverse it and auto-resuscitation won't occur. However, this blurs the line between permanent and irreversible. But in practice, it is accepted.

        - The requirement that death must be irreversible (in the strict sense) and the requirement that we have a determinate moment (soon after circulatory arrest for DCD) are in tension. We resolve it by defining irreversibility in the context of the situation: if resuscitation is not attempted or is stopped, then the arrest is irreversible because no intervention will be made. However, this is a pragmatic approach and may not satisfy the strict biological definition.

   4. Which requirement rules out the biggest share of popular accounts?
        - The requirement that we must not declare a patient in PVS (with a working brainstem) dead rules out the higher-brain criterion. This is a major blow because the higher-brain criterion is one of the three main views.

        - The requirement that we must declare a brain-dead body (on a ventilator) dead rules out the circulatory criterion alone (if one were to insist that death only occurs when circulation stops). But note, the circulatory criterion proponents accept neurological death as a valid criterion because it leads to circulatory death quickly without support. However, if we keep the body on a ventilator, it doesn't stop. So, we need the neurological criterion.

        - The requirement that anencephalic newborns are not dead at birth (if they have brainstem function) rules out any attempt to use a higher-brain criterion for them (because they lack the cortex) and also rules out a whole-brain criterion that would declare them dead at birth. The whole-brain criterion does not declare them dead at birth, so it passes.

        - The requirement that the patient in deep hypothermic arrest is not dead rules out any criterion that does not account for reversibility.

   Scorecard:

     a. Whole-brain criterion (irreversible cessation of all functions of the entire brain, including the brainstem):
          - Passes: 
              - Brain-dead body on ventilator: dead (yes).
              - PVS patient: alive (yes, because brainstem functions).
              - Anencephalic newborn: alive at birth if brainstem functions (yes).
              - Hypothermic arrest: not dead (yes, because reversible).
              - DCD: not directly addressed by whole-brain, but we use circulatory criteria for DCD. However, whole-brain proponents accept circulatory criteria because after a period of time, the brain is destroyed. But in controlled DCD, the time is short. So, they might have concerns? But in practice, whole-brain is often paired with circulatory criteria as an alternative pathway.

          - Fails? 
              - The case of the body with total brain failure maintained for months: it passes (declares dead).
              - Revival technology: it uses current irreversibility, so passes.

          - Tension: 
              - In DCD, if we declare death by circulatory criteria (after 5 minutes of asystole) but the brain might not be destroyed, then the whole-brain criterion isn't met. But the whole-brain criterion is not used in DCD; instead, we use the circulatory criterion. So, the whole-brain view accepts two criteria: either whole-brain death or irreversible circulatory arrest. This is acceptable.

     b. Higher-brain criterion (irreversible loss of higher brain functions, i.e., consciousness and cognition):
          - Fails:
              - PVS patient: would be declared dead (but we require that they are alive).
              - Anencephalic newborn: would be declared dead at birth (but we require that they are alive if brainstem functions).
              - Hypothermic arrest: might be declared dead if we only look at higher brain (but reversibility would save it?).

          - Passes:
              - Brain-dead body: dead (because higher brain is gone and brainstem too, but note: higher brain alone would not require brainstem to be dead? Actually, in higher-brain, the brainstem might be working and they are still considered dead. So, in PVS, they are dead, which is a fail. For anencephalics, they are dead, which is a fail. For hypothermic arrest, if we can restore the higher brain, then it's not irreversible, so they are not dead? But without a functioning brainstem, higher brain function is impossible. So, it's complicated.)

          - Overall: Fails our requirements because it collapses the distinction between biological death and loss of personhood and fails the PVS and anencephalic cases.

     c. Circulatory criterion (irreversible cessation of circulatory and respiratory functions):
          - Fails:
              - Brain-dead body on ventilator: still has circulation, so would be considered alive. But we require that it be dead.

          - Passes:
              - PVS: alive (pass).
              - Anencephalic: alive if circulation (pass).
              - Hypothermic arrest: not dead because reversible (pass).
              - DCD: dead after the waiting period (pass).

          - Overall: Fails because it does not cover the brain-dead patient on a ventilator.

   Conclusion:

     Only the whole-brain criterion (with acceptance of circulatory criterion as an alternative pathway) satisfies all the non-negotiable requirements. However, note that the whole-brain criterion is not without its critics, especially regarding the DCD protocol. But in the context of the requirements above, it is the one that passes.

     The tension between a single moment and biology: Biology does not always provide a single moment, so we define a point of no return (when the brain ceases to function as a whole or when circulation ceases irreversibly). This is a practical necessity and is non-negotiable for the law.

     The requirement that rules out the biggest share of accounts is: "We must not declare a patient in PVS (with a working brainstem) dead." This rules out the higher-brain criterion.

     The requirement that the brain-dead body must be declared dead rules out the circulatory criterion alone.

     Therefore, the whole-brain criterion (with circulatory criterion as an alternative) is the one that meets the requirements.

     But note: In the case of DCD, the circulatory criterion is used, and the cessation is only permanent (we won't restart) and not necessarily irreversible in the strict sense (if we could restart, we would not because we have decided not to). However, the law considers it irreversible because we have stopped treatment and auto-resuscitation does not occur after that waiting period. This is a pragmatic compromise.

   Requirements List:

     Non-negotiable requirements:

      1. Must declare a patient dead when there is irreversible cessation of all functions of the entire brain (including the brainstem) [Case: brain-dead body on ventilator].
      2. Must declare a patient dead when there is irreversible cessation of circulatory and respiratory functions [Case: circulatory death after stopping resuscitation].
      3. Must NOT declare a patient dead who is in a persistent vegetative state (with sleep-wake cycles and a working brainstem) [Case: PVS patient].
      4. Must NOT declare an anencephalic newborn dead at birth if they have a functioning brainstem (they are alive until they meet either neurological or circulatory criteria) [Case: anencephalic newborn].
      5. Must NOT declare a patient dead during deep hypothermic arrest that is reversible upon rewarming [Case: hypothermic arrest].
      6. Must declare a body with total brain failure dead even if it is maintained on a ventilator for months (and even if it carries a pregnancy) [Case: long-term maintenance of brain-dead body].
      7. Irreversibility must be defined relative to current medical technology and practice (future speculative technology does not matter) [Case: revival technology].

      8. Must clearly distinguish:
          - Death (the event) vs. the criterion for death vs. the tests for the criterion.
          - Biological death of the organism vs. loss of personhood.
          - Irreversible cessation (cannot be reversed) vs. permanent cessation (we won't reverse).

      9. Must account for biological realities:
          - Brainstem and cortex can fail independently (so a definition that requires both to be gone for death would be too strict? Actually, the whole-brain requires both to be gone. But note: in whole-brain death, both are gone. In PVS, cortex is gone but brainstem is not -> alive. This is acceptable).
          - The body can maintain some functions without the brain (but without the brain, the organism as a whole is not functioning without external support) -> so the definition must capture the loss of integrated functioning of the organism.
          - Different tissues survive ischemia for different times -> so death of the organism can occur while organs are still viable for transplantation.
          - Cells and organs can be alive after the organism dies -> so the definition must allow for that.

     The requirement for a single determinate moment per body is non-negotiable (for legal and practical reasons), and it is not in insurmountable tension with biology if we define the point of no return appropriately.

     The requirement that is most challenging to satisfy with a single account is the requirement that we must declare the brain-dead body dead (which requires a neurological criterion) and also that we must declare a patient dead after circulatory arrest that is irreversible (which requires a circulatory criterion). But we can have two criteria (two pathways) to death. This is acceptable and current practice.

     Therefore, the account must allow for two criteria: 
          (a) irreversible cessation of all functions of the entire brain, OR 
          (b) irreversible cessation of circulatory and respiratory functions.

     This is the current U.S. standard (Uniform Determination of Death Act).

     However, note that the requirement for irreversibility in the circulatory criterion in the context of DCD is sometimes met by a waiting period (e.g., 5 minutes) after which auto-resuscitation is not known to occur. But if we define irreversibility as "cannot be restored with available technology" and we have decided not to use available technology (like restarting the heart), then it is irreversible because we won't use the technology. This is a gray area. But the requirement is that we must not collapse irreversible and permanent. We must be clear that in DCD, we are making a decision that the arrest is permanent (we won't reverse) and then we wait to ensure it is irreversible (by waiting for auto-resuscitation to become impossible). So, it is both.

     Final note: The whole-brain criterion (with the circulatory alternative) is the only one that passes all non-negotiables.

     Table Scorecard:

     | Requirement/Case                 | Whole-Brain | Higher-Brain | Circulatory |
     |----------------------------------|-------------|-------------|-------------|
     | Brain-dead body on ventilator    | Dead (pass) | Dead (pass) | Alive (fail) |
     | PVS patient                      | Alive (pass)| Dead (fail) | Alive (pass) |
     | Anencephalic newborn (at birth, with brainstem) | Alive (pass) | Dead (fail) | Alive (pass) |
     | Hypothermic arrest               | Alive (pass)| ? (pass if reversible) | Alive (pass) |
     | DCD (after waiting)              | Dead* (pass) | Dead* (pass) | Dead (pass) |
     | Long-term brain-dead body        | Dead (pass) | Dead (pass) | Alive (fail) |
     | Revival tech (irreversibility)   | Pass        | Pass        | Pass        |
     | Distinctions (death vs. person, etc.) | Pass     | Fail (conflates) | Pass        |
     | Biology (integration, etc.)      | Pass        | ? (arguable) | Pass        |

     *Note: For DCD, whole-brain and higher-brain would not directly apply because circulation has stopped. They would accept the circulatory criterion for that case. But circulatory criterion fails for the brain-dead body on a ventilator.

     Therefore, only the whole-brain criterion (with circulatory as an alternative) passes all.
answer: |-
  ### Requirements for a Definition of Death in Procurement Law and Death Certification  
  *(Non-negotiable = **N**; Preference = **P**)*  

  ---

  #### **I. Cases It Must Resolve Correctly**  
  1. **Neurological death (whole-brain failure) as practiced clinically**  
     - *Case:* Patient with total brain failure (including brainstem) on ventilator.  
     - *Requirement:* Must declare death.  
     - *Status:* **N** (core clinical standard).  

  2. **Circulatory death (irreversible cessation) as practiced clinically**  
     - *Case:* Patient with irreversible cardiac arrest after failed resuscitation.  
     - *Requirement:* Must declare death without requiring brain destruction.  
     - *Status:* **N** (core clinical standard).  

  3. **Permanently unconscious patient with intact brainstem**  
     - *Case:* Persistent vegetative state (e.g., sleep-wake cycles preserved).  
     - *Requirement:* Must **NOT** declare death (organism is biologically alive).  
     - *Status:* **N** (rejects higher-brain criteria; protects DDR).  

  4. **Anencephalic newborn**  
     - *Case:* Newborn lacking cerebral hemispheres but with partial brainstem function.  
     - *Requirement:* Must **NOT** declare death unless whole-brain failure occurs.  
     - *Status:* **N** (avoids conflating congenital defects with death).  

  5. **Deep hypothermic arrest with rewarming**  
     - *Case:* Patient cooled to <18°C during surgery, temporarily "lifeless," then revived.  
     - *Requirement:* Must **NOT** declare death (cessation is reversible).  
     - *Status:* **N** (distinguishes reversible vs. irreversible loss).  

  6. **Total brain failure with prolonged somatic support**  
     - *Case:* Brain-dead body maintained on ventilator for months (e.g., to sustain a pregnancy).  
     - *Requirement:* Must declare death despite somatic functions.  
     - *Status:* **N** (aligns with whole-brain criterion; DDR-compatible).  

  7. **Prospective revival technology**  
     - *Case:* Cryopreserved body with future revival potential.  
     - *Requirement:* Death must be based on **current** irreversibility (not speculative futures).  
     - *Status:* **N** (practical/legal necessity).  

  ---

  #### **II. Critical Distinctions It Must Preserve**  
  8. **Death vs. criterion vs. test**  
     - *Distinction:*  
       - **Death:** Biological event (organism ceases to function integratively).  
       - **Criterion:** Standard for declaring death (e.g., whole-brain failure).  
       - **Test:** Bedside assessment (e.g., apnea test).  
     - *Requirement:* Must not conflate; tests must map to biologically sound criteria.  
     - *Status:* **N** (prevents diagnostic arbitrariness).  

  9. **Losing the organism vs. losing the person**  
     - *Distinction:* Biological death ≠ loss of personhood/consciousness.  
     - *Case:* PVS patient is a living organism despite lacking personhood.  
     - *Requirement:* DDR requires biological death, not "personal death."  
     - *Status:* **N** (protects against non-consensual organ procurement).  

  10. **Irreversible vs. permanent cessation**  
      - *Distinction:*  
        - **Irreversible:** Function **cannot** be restored *with current technology*.  
        - **Permanent:** Function **will not** be restored (e.g., DCD after withdrawing support).  
      - *Requirement:* Death requires **irreversibility** (permanence alone is insufficient).  
      - *Status:* **N** (avoids declaring death in DCD prematurely).  

  ---

  #### **III. Biological Realities It Must Accommodate**  
  11. **Independent brainstem/cortical failure**  
      - *Biology:* Brainstem can survive cortical death (e.g., PVS), and vice versa (e.g., locked-in syndrome).  
      - *Requirement:* Must not treat cortical death alone as organismic death.  
      - *Status:* **N** (whole-brain failure required for death declaration).  

  12. **Autonomous somatic function without brain**  
      - *Biology:* Brain-dead bodies can digest, heal wounds, gestate fetuses, and maintain homeostasis via external support.  
      - *Requirement:* Must still declare death if integration is lost (ventilator ≠ organismic life).  
      - *Status:* **N** (somatic activity ≠ organismic survival).  

  13. **Variable tissue ischemia tolerance**  
      - *Biology:* Organs survive minutes/hours after circulatory arrest (enabling DCD).  
      - *Requirement:* Must permit organ procurement after death declaration.  
      - *Status:* **N** (DDR-compatible).  

  14. **Cellular survival post-organismic death**  
      - *Biology:* Cells/organs live minutes to hours after organism dies.  
      - *Requirement:* Must not define death as "all cellular death."  
      - *Status:* **N** (avoids absurdity; enables transplantation).  

  ---

  ### **Tensions and Trade-offs**  
  - **Single determinate moment vs. biology:**  
    Biology supports a **process** (e.g., gradual cell death), but law requires a **moment**.  
    - *Resolution:* The moment of **irreversible loss of organismic integration** (e.g., whole-brain failure or irreversible circulatory arrest) is biologically defensible and legally necessary.  
    - *Tension Level:* Manageable (**N** for law/DDR).  

  - **Joint unsatisfiability:**  
    - **Irreversible cessation (Requirement #10) vs. DCD protocols:**  
      DCD declares death ~5 mins after circulatory arrest (permanent but potentially reversible with future tech).  
      - *Trade-off:* **Irreversibility yields to permanence** in DCD.  
      - *Why?* Pragmatic need for organ procurement, provided:  
        (a) Permanence is protocolized (no auto-resuscitation),  
        (b) DDR is upheld (no vital organ removal before death).  

  - **Most exclusionary requirement:**  
    **Requirement #3 (PVS patients not dead)** rules out **higher-brain criteria**.  
    **Requirement #6 (somatic support ≠ life)** rules out **circulatory-only criteria**.  

  ---

  ### **Scorecard for Death Criteria**  
  | **Criterion**               | **Whole-Brain** | **Higher-Brain** | **Circulatory-Only** |  
  |-----------------------------|-----------------|------------------|----------------------|  
  | PVS Patient (intact brainstem) | ✅ Alive      | ❌ Dead         | ✅ Alive           |  
  | Total Brain Failure + Ventilator | ✅ Dead      | ✅ Dead         | ❌ Alive           |  
  | DCD (irreversible arrest)   | ✅ Dead*       | ✅ Dead*        | ✅ Dead            |  
  | Anencephalic Newborn        | ✅ Alive†      | ❌ Dead         | ✅ Alive           |  
  | Deep Hypothermia            | ✅ Alive       | ✅ Alive        | ✅ Alive           |  
  | DDR Compliance              | ✅             | ❌‡             | ⚠️ (Risk in DCD)   |  
  | **Meets all requirements?** | **Yes**        | **No**          | **No**             |  

  ✅ = Passes requirement; ❌ = Fails; ⚠️ = Contextual pass (e.g., DCD protocols); † = If brainstem functional; ‡ = Would allow organ procurement from PVS patients.  
  \* Whole-brain/higher-brain accept circulatory death as an alternative pathway.  

  ### **Final Verdict**  
  - **Optimal Criterion:** **Whole-brain death** (with circulatory death as an alternative pathway) satisfies all non-negotiable requirements.  
  - **Single Moment Feasibility:** Biologically defensible at irreversible loss of integration (whole-brain or circulatory failure).  
  - **DDR Protection:** Maintained by rejecting higher-brain criteria and requiring somatic discontinuity (Requirement #6).
