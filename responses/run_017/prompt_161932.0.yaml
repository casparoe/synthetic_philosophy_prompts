prompt: |-
  I'm a senior at a big public high school in Ohio, and I run our school's giving club — we raise a couple of thousand dollars a year from bake sales and a spring 5K, and a committee of six of us decides where it goes. I've applied to study public policy next fall, so I've been trying to be more careful about the words I use, and there's a pattern in our meetings I can't name. Three versions of it, from this year. One: we weighed buying insecticide-treated bed nets through a charity that publishes a cost per net and an estimate of what a dollar accomplishes, against giving the same money to a local tenants' union that keeps people from being evicted. Half the room thought the housing work might matter more, since an eviction wrecks everything downstream for a family, but its effects are spread over years, depend on landlords and judges and city budgets, and nobody can say what would have happened otherwise — so it has no number, and we funded the nets without anyone once claiming the nets were better. We claimed they were the ones we could evaluate. Two: once we'd chosen the nets, we started tracking cost per net delivered, and then cost per net actually hanging over a bed, and each refinement was a genuine improvement and also quietly changed what we were paying for. Three: a tutoring program pitched us with a spreadsheet of hours delivered; everyone in the room said out loud that the number would rise if tutors just sat with students longer without teaching them anything, and we funded it anyway, while a proposal about how the school's discipline system treats kids never made the shortlist, because there's no spreadsheet for it.

  What makes me think this is one thing rather than three is that the filter doesn't pick arbitrarily — it picks in a direction. Everything that survives has an effect that is near-term, happens to an identifiable person, and can be attributed to us; everything that gets screened out is systemic, delayed, or works by changing how an institution behaves. It also seems to feed on itself: the option that has a number is the one that gets funded, which is the one that gets audited, studied, and refined, so next year it looks even stronger next to the option nobody funded and nobody bothered to measure. A friend from policy debate says this is Goodhart's law, and someone else mentioned a drunk looking for his keys under a streetlight. Both feel adjacent and neither feels right. Goodhart, as I understand it, is about a measure getting gamed once it becomes a target — but in my first case nobody is gaming anything and the number is honest; the trouble is that only one of the options has a number at all. The streetlight story seems to be about searching where the light is, but it doesn't capture the directional tilt, or the way this year's choice decides what next year's light will be. So: is there an established concept for the whole pattern, or for the part that isn't Goodhart? Is my list of three really one phenomenon with two faces — selection and drift — or two that merely travel together? And where are the edges? I'd be annoyed to be handed a single label; I want the carving. I'm not looking for citations or a reading list, just the distinctions, in American English, at a level a careful high schooler can follow.

  After the prose, please give me two tables. First, a candidate-concepts table with exactly these columns: candidate_name | status (established term, or a name you are proposing yourself) | definition_in_your_own_words | which_face_of_my_pattern_it_covers (selection / drift / feedback / none) | where_it_fits_my_cases | where_it_misfits | verdict (exact / partial / wrong). Second, a boundary-cases table with exactly these columns: case | counts_as_the_phenomenon (yes / no / borderline) | one_sentence_reason. For the boundary-cases table, use at least these four cases: the unmeasurable option is in fact the worse one; the number being tracked is openly declared to be a proxy for a good nobody can measure directly; the club spends its whole budget on building a way to measure the housing work instead of funding either option; and one case of your own that you think puts the sharpest pressure on whatever definition you settled on.
reasoning: |-
  Hmm, the user is a high school senior running a giving club and applying to study public policy. They've observed a pattern in their club's decision-making where measurable interventions consistently get funded over less measurable ones, even when members suspect the unmeasurable options might be more impactful. They've described three specific examples from their experience and want to understand the underlying phenomenon.

  I need to break down their query. They're describing three scenarios: 1) Choosing bed nets over tenant unions because the nets have quantifiable impact metrics while housing impacts are systemic and hard to measure. 2) The measurement of the nets becoming more precise but also shifting what's being evaluated. 3) Funding a tutoring program with trackable hours despite knowing the metric could be gamed, while rejecting a discipline system proposal with no metrics.

  What they're noticing is that measurable options get selected (selection bias), the measurement focus drifts during implementation (metric drift), and this creates a feedback loop where measurable options look even better next year. They've already encountered Goodhart's Law and the streetlight effect but find them insufficient because in their first case, no one is gaming the metrics - the problem is that only one option has metrics at all.

  I should identify established concepts that explain different facets of this. For the selection bias toward measurable options, "quantifiability bias" or "McNamara fallacy" fit well. For the metric drift during implementation, "surrogation" (confusing the measure for the goal) applies. For the feedback loop, "path dependence" captures how initial choices constrain future options. "Observed-world bias" (the tendency to favor interventions in observable domains) might cover the whole pattern.

  For the boundary cases they requested: 1) If the unmeasurable option is worse - still the phenomenon since the bias persists regardless of actual merit. 2) When a proxy metric is openly acknowledged - still problematic because it focuses effort on the proxy. 3) Spending all money on measurement instead of action - this shifts the phenomenon to a different kind of failure. 4) A new case where both options have equally strong metrics - this shouldn't trigger the bias.

  The user wants clear distinctions, not just labels. They're thoughtful and precise - acknowledging that reality is messy but wanting to understand the underlying mechanisms. I'll create two tables as requested: one comparing candidate concepts, and another examining boundary cases. The response should maintain their analytical depth while staying accessible to a high school audience, using plain American English without academic jargon.
answer: |-
  Based on your clear description, you've identified a core phenomenon with interconnected facets: **the systematic bias toward funding interventions that are more readily measurable, attributable, and short-term, which then reinforces itself by generating better data for those interventions, further marginalizing less quantifiable, systemic, or long-term options.** It's one coherent pattern with three interacting components: **Selection Bias, Metric Drift, and Feedback Reinforcement.**

  Here's the conceptual carving, followed by the requested tables:

  1.  **Selection Bias (Your Case 1 & 3):** The initial filtering *against* options lacking measurable, attributable, near-term impacts. This isn't random; it's directional towards what's quantifiable ("netted," "hours") and attributable ("what a dollar accomplishes") vs. what's systemic, delayed, or institutionally complex ("depends on landlords...", "no spreadsheet"). Goodhart's Law isn't violated *yet* because the measure isn't being gamed; it's simply absent for one option. The Streetlight Effect captures the *search* aspect but misses the *funding decision bias* and the *reinforcement*.

  2.  **Metric Drift / Surrogation (Your Case 2):** Once an intervention is chosen *because* it's measurable, the focus shifts to refining *that specific measurement*. "Cost per net delivered" is easier to track than "malaria cases prevented," and "cost per net hanging" is easier than "consistent net usage." Each refinement is valid but subtly shifts the *de facto goal* from the ultimate impact ("saving lives/reducing disease") towards the tangible, countable output ("nets delivered/hanging"). The metric becomes a **surrogate** for the real goal, and optimizing the surrogate becomes the focus.

  3.  **Feedback Reinforcement (The Loop):** Funding the measurable option generates data ("we tracked cost per net hanging"). This data makes the option appear *even more certain and evaluable* next year compared to the unfunded, unmeasured systemic option. The lack of data for the systemic option isn't seen as a *limitation of measurement* but as evidence of its *inherent weakness or uncertainty*. This creates a **path-dependent** cycle where measurable options get stronger-looking over time, not necessarily because they *are* better, but because they *can be measured better*.

  **Why it's one phenomenon:** These three elements are causally linked and self-reinforcing. Selection Bias *enables* Metric Drift (you only drift metrics you have). Metric Drift *provides the data* for Feedback Reinforcement. Feedback Reinforcement *intensifies* the Selection Bias in subsequent rounds. The "directional tilt" you observe (near-term, attributable, measurable) is the core driver linking all three cases.

  **Candidate Concepts Table**

  | candidate_name          | status                 | definition_in_your_own_words                                                                 | which_face_of_my_pattern_it_covers | where_it_fits_my_cases                                                                                                 | where_it_misfits                                                                                                                                             | verdict |
  | :---------------------- | :--------------------- | :------------------------------------------------------------------------------------------- | :--------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :------ |
  | Quantifiability Bias    | Established Term       | Preference for options that can be easily measured with numbers over those that can't, regardless of true importance. | Selection                          | Explains why bed nets & tutoring (numbers) beat housing/disciplinary reform (no numbers) in initial funding decisions. | Doesn't address the Metric Drift (Case 2) or the Feedback Reinforcement loop. Only covers the initial selection.                                             | Partial |
  | Surrogation             | Established Term       | Mistaking a measurable proxy (e.g., nets hung) for the actual desired outcome (e.g., lives saved). Focusing effort on optimizing the proxy. | Drift                              | Explains the shift in Case 2 from funding nets to tracking "nets hanging" – optimizing the measurable surrogate.       | Doesn't explain *why* the measurable option was chosen initially (Selection Bias) or how this drift reinforces future bias (Feedback). Covers drift only.     | Partial |
  | McNamara Fallacy        | Established Term       | Making decisions based *only* on quantitative factors while ignoring unquantifiable variables that are equally important. | Selection                          | Explains why the club funded measurable options *despite* explicit concerns about unquantifiable impacts (Case 1 & 3). | Less strong for Metric Drift (Case 2). Doesn't explicitly cover the feedback loop. Focuses on ignoring unquantifiables, while your club *acknowledged* them. | Partial |
  | Path Dependence         | Established Term       | Current choices are constrained by past decisions, creating a self-reinforcing cycle ("lock-in"). | Feedback                           | Explains the loop: Funding measurable options generates data, making them look better next year, locking them in.      | Doesn't explain *why* the initial measurable option was favored (Selection Bias) or how the metric itself changes (Drift). Focuses on the consequence.        | Partial |
  | Observed-World Bias     | Proposed Name          | Preference for interventions operating in domains we can easily observe/measure (e.g., tangible goods, direct actions) over those in complex, systemic, or hard-to-observe domains. | Selection / Drift                  | Fits the core "directional tilt": near-term, attributable, tangible (nets, hours) vs systemic/delayed/institutional. Explains both initial selection and the focus of measurement drift. | Doesn't explicitly name the feedback mechanism. "Observed-world" might be less intuitive than "measurable".                                                  | Partial |
  | **Measurability Trap**  | **Proposed Name**      | **A self-reinforcing cycle where: 1) Selection favors readily measurable interventions; 2) Focus shifts to optimizing the measurable metrics (often surrogates); 3) This generates data that makes measurable options appear superior, further marginalizing hard-to-measure alternatives.** | **Selection / Drift / Feedback**   | **Captures the *whole interconnected pattern*: The bias (Selection), the subsequent focus shift (Drift/Surrogation), and the reinforcing loop (Feedback). Highlights the systemic nature of the trap.** | **As a proposed term, it lacks established recognition. Requires explaining the three components.**                                                           | **Exact** |

  **Boundary Cases Table**

  | case                                                                                                                               | counts_as_the_phenomenon | one_sentence_reason                                                                                                                                                     |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :----------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | The unmeasurable option (e.g., tenants' union) is factually the worse intervention, but the club rejected it *because* it lacked numbers, not because they knew it was worse. | Yes                     | The core selection bias *based on measurability* is still present, regardless of the actual (unknown) relative effectiveness; the process is biased.                     |
  | The number being tracked (e.g., tutoring hours) is openly declared to be just a weak proxy for the real goal (e.g., learning gains), but it's the only number they have. | Borderline              | Selection bias based on measurability is present, and drift toward optimizing the weak proxy is likely; however, explicit acknowledgment mitigates pure surrogation.      |
  | The club spends its entire budget building a measurement system for the housing work instead of funding either the nets *or* the housing work this year. | No                      | The action shifts from funding biased by measurability to *investing in measurement itself*; it avoids the selection/drift/feedback cycle for *funding interventions* this cycle. |
  | **Your Own Case: Both options have equally strong, credible metrics (e.g., cost per life saved for nets vs. quantified reduction in family trauma/instability for housing), and the club debates the merits based on the numbers and values.** | **No**                  | **The core bias based on the *presence or absence* of measurement is absent; the debate focuses on interpreting comparable data and values, not measurability itself.** |
  | **Your Own Case: The tutoring program gets funded based on hours, tutors subsequently game the metric by sitting longer without teaching, *and the club detects the gaming but funds it again next year anyway* because the hours number is still high.** | **Yes**                 | **This combines initial selection bias (hours), Goodhart gaming, *and* feedback reinforcement (funding continues based on the gamed metric despite knowing it's flawed).** |

  **Key Distinctions in Plain Terms:**

  1.  **It's About the Filter:** The biggest problem isn't that people lie with numbers (Goodhart), it's that things without numbers often don't even get considered fairly in the first place (Selection Bias / Quantifiability Bias / Observed-World Bias).
  2.  **The Goalposts Move (Subtly):** Once you pick something because it's measurable, you naturally start focusing on making *that measurement* better, even if it means slightly losing sight of the *real* reason you cared (Metric Drift / Surrogation).
  3.  **It Snowballs:** Funding the measurable thing gives it a huge advantage next time because now it has data proving its "results," while the unmeasurable thing still has nothing. This makes the measurable thing look better *because it's measurable*, not necessarily because it *is* better (Feedback Loop / Path Dependence).
  4.  **The Label Isn't Perfect, But the Pattern Is:** "Measurability Trap" best captures the whole self-reinforcing cycle you described – getting stuck favoring what you can count, then counting what you can see, then getting more stuck. Established terms mostly cover pieces.

  You've nailed a critical challenge in policy and philanthropy: the tyranny of the measurable. The bias isn't malicious; it's a natural human tendency amplified by the desire for accountability and clear results. Recognizing this pattern – especially its self-reinforcing nature – is the crucial first step toward designing better decision processes that actively seek to counter it.
