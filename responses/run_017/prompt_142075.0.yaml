prompt: |-
  I sit on a university committee that is drafting a policy on "cognitive prosthetics" — the wearables and cloud services that researchers here use to record, store, and cue back material they would otherwise have to carry in their heads. Two cases prompted the exercise. The first is a lab-wide annotation ledger: about a dozen people have added to it continuously for roughly ten years, it is the only record of why certain protocols were changed, no individual member can reconstruct more than a fragment of it unaided, and it is now being migrated off a departmental server. One member has objected that this is not a question of shared property at all but of erasing part of her memory. The second is a device that several people here wear, which captures conversation and replays relevant fragments at moments it selects itself; you cannot query it deliberately, you usually cannot tell when it has misfired, and yet long-term users report that without it they feel as though their recall has been cut in half. The accommodations office has also asked us for a definition, because students have begun asking whether being made to surrender such a device before an exam is like being made to surrender their glasses, or like being forbidden a calculator.

  A colleague on the committee who has read some of the philosophical literature says that everything here turns on the extended mind thesis, and he has offered an argument I cannot quite fault. If the thesis is right, he says, then what makes something part of your mind is the functional role it plays rather than whether it sits inside your skull; but then there is no principled line to be drawn between the notebook that the amnesiac in the famous example uses to find his way around the city and my phone, my search engine, the ledger, and the library catalogue, so the thesis is either a trivial remark about how much we lean on tools or an absurd one about where our minds are located. And if we take the absurd branch seriously, as he thinks intellectual honesty requires, then deleting the ledger or confiscating a recording device is not really a dispute about property, academic integrity, or accommodation: it is damage to someone's cognition, and it ought to be regulated the way we regulate damage to someone's brain. I am the one who has to write the memo that either adopts this argument or explains why it fails, and I would rather not build a policy on a bad inference.

  My own suspicion is that the slippage lies in the move from "this resource partly constitutes a cognitive process" to "this resource is part of a person, and damaging it is damaging them" — but I cannot say exactly where that step goes wrong, partly because I am not sure the first claim is the interesting one, and partly because I cannot tell whether the standard remedies people offer (the checklist of reliability, trust, easy accessibility, and automatic endorsement; the insistence that being causally coupled to something is not the same as being partly constituted by it) are real constraints on the thesis or merely ad hoc manoeuvres for avoiding conclusions the authors find embarrassing. Please reply in exactly five numbered points, each one or two sentences long, with no preamble and no closing sentence: identify what is confused in the argument as I have reconstructed it, or, if you think it is sound after all, say which premise carries the weight and how I should defend it in the memo.
reasoning: |-
  Hmm, the user is part of a university committee drafting a policy on cognitive prosthetics, facing complex philosophical questions about the extended mind thesis. They've described two real-world cases: a decade-old lab annotation ledger that researchers consider part of their collective memory, and wearable devices that automatically replay conversations. A colleague argues that if the extended mind thesis is accepted, damaging these tools is equivalent to damaging someone's cognition.

  The user needs to write a memo either adopting or refuting this argument, and they suspect there's a flaw in equating "constituting cognition" with "being part of a person." They want exactly five numbered points identifying confusions or defending the argument.

  I need to unpack this carefully. The core philosophical issue is whether external tools can truly be considered parts of the mind. The colleague's argument follows this logic: if functional role defines what's part of the mind (premise), then no principled distinction exists between notebooks, phones, ledgers etc. (inference), so damaging them is equivalent to brain damage (conclusion).

  The user's intuition about a "slippage" between cognition and personhood is crucial. I should address where the argument overextends. The ledger case highlights collective rather than individual cognition, while the wearable's lack of queryability challenges the "automatic endorsement" criterion from extended mind literature. The exam accommodation question adds practical urgency.

  Key distinctions I should make: constitutive vs causal relationships, individual vs distributed systems, and functional equivalence vs identity. The colleague treats "part of cognition" and "part of person" as identical, but personhood involves more than cognition (agency, identity, etc). Also, the ledger is inter-subjective, not bound to any one mind.

  For the memo, I'll recommend denying the premise that functional equivalence alone dissolves boundaries. Reliability, trust, and accessibility criteria aren't ad hoc - they prevent absurdities like claiming Google servers are part of my mind. The colleague's "no principled line" claim is the weak point; boundaries can be drawn at the integration level.

  The five points should: 1) Reject the false dichotomy between trivial and absurd interpretations, 2) Challenge the "no principled line" premise, 3) Separate cognitive systems from personal identity, 4) Highlight collective cognition differences, and 5) Note the wearable's lack of integration. This gives the user a defensible position without endorsing the strongest extended mind claims.
answer: |-
  1.  The argument conflates something being *constitutively involved in a cognitive process* (extended cognition) with it being *part of the person*, ignoring that personhood involves more than cognition (e.g., agency, identity, bodily integrity).
  2.  It assumes the "no principled line" premise is inevitable, but boundaries *can* be drawn based on integration, accessibility, and trust (as standard criteria suggest), preventing trivialization without requiring absurdity.
  3.  The ledger is primarily a *collective* cognitive artifact; treating its deletion as equivalent to damaging an *individual's* brain misrepresents its fundamentally shared and inter-subjective nature.
  4.  The wearable's lack of deliberate query and unreliable misfires directly violate core extended mind criteria like "constant reliable availability" and "automatic endorsement," disqualifying it from being a constitutive part of an individual's mind.
  5.  The "trivial or absurd" dichotomy is false; the thesis meaningfully distinguishes *integrated tools enabling new cognitive capacities* from mere causal aids *without* needing to claim external objects are literally biological parts of a person.
