  ## Speech: Dedication of the Dr. [Supervisor's Last Name] Intake Wing

  Friends, colleagues, family of Dr. [Supervisor's Last Name], and especially the dedicated staff and volunteers of the City Animal Shelter: we gather to dedicate this vital new intake wing, made possible by the extraordinary generosity and clear-sighted vision of my doctoral supervisor, Dr. [Supervisor's Last Name]. Naming this space for her is deeply fitting, though she would likely have raised a characteristically sharp eyebrow at the sentiment. Her intellectual honesty demands we acknowledge that discomfort.

  Dr. [Supervisor's Last Name] devoted forty years to teaching Kantian ethics with unwavering rigor. Her central conviction, which she defended relentlessly, was this: **We have no direct duties *to* animals.** Animals, she argued, are not rational agents capable of imposing moral obligations upon us. Therefore, they cannot be wronged in the way humans can be wronged. They are not, strictly speaking, beneficiaries of our moral actions.

  **So why is cruelty to animals wrong?** For Dr. [Supervisor's Last Name], the wrongness lies entirely *within us*. Cruelty is wrong because it blunts our own capacity for humane feeling – our *humanity*. It damages the moral character we *do* have a duty to cultivate. Mistreating an animal violates a duty we owe *to ourselves* not to become desensitized, callous beings.

  **Later, she refined this view significantly – the "institutional reading" crucial to understanding this wing.** She realized it wasn't enough to focus on fleeting individual sentiments. What truly mattered was the structure of our *practices* and the character they *systematically* shape. The duty is discharged by designing institutions where people are not *required* to routinely perform acts that coarsen their humanity. It’s not about how a worker *feels* while performing a difficult task; it’s about whether the institution *demands* tasks that inherently degrade moral feeling.

  **This is where her indirect-duty view becomes profoundly demanding of institutions like this one.** On her account, there is no competing "animal welfare" interest to balance against cost, convenience, or human benefit. Instead, there is only this stark imperative: **Design systems that protect the human agents within them from becoming morally compromised.** A shelter system that routinely forced its workers into situations demanding indifference to suffering, or numb acceptance of unnecessary cruelty, would be failing its most fundamental ethical duty – the duty to safeguard the humanity of those who serve within it.

  **This new intake wing, funded so significantly by her bequest, embodies that demanding institutional imperative.** It represents an investment not primarily in the comfort of animals – though that may be a welcome consequence – but in the *conditions under which human beings carry out essential, often difficult, work*. By providing modern facilities, efficient workflows, and spaces designed for humane practice, this wing helps create an institution where staff and volunteers are not systematically subjected to conditions that *require* the blunting of their empathy or compassion to function. It helps structure practices that make it *possible* to discharge our duty to ourselves – the duty to preserve our humane character – while doing necessary, even heartbreaking, work. It is a machine for practicing virtue.

  **To the staff and volunteers:** Your daily commitment, your care amidst challenging circumstances, is where this duty Dr. [Supervisor's Last Name] cared so deeply about is *lived*. You operate within the structures designed to make humane action possible, even when feelings are frayed. Thank you for upholding that vital human capacity.

  **To the donors, including Dr. [Supervisor's Last Name]'s estate:** Your generosity has built more than walls and kennels. You have invested in creating an institutional environment where the moral character of those who serve can be respected and sustained. Thank you.

  Dr. [Supervisor's Last Name] believed reason demanded clarity, even when uncomfortable. Today, we honor her clarity, her transformative refinement of Kantian duty, and her profound legacy: this concrete commitment to building institutions that protect our humanity. May this wing serve that vital purpose for generations to come.

  ---

  **Reasoning on Bequest & Wing's Meaning (On Her Terms):**

  The bequest, on her strict terms, cannot represent Dr. [Supervisor's Last Name] discharging her *own* duty of self-cultivation (she was dead). Instead, it must be understood as a final act shaping the *institutional conditions* for *others* to fulfill *their* duty. She funded the creation of a structure designed to prevent the systematic blunting of humane feeling in those working within the shelter system. The wing's existence doesn't show that animals are owed anything or have rights; it demonstrates her conviction that *human institutions* must be rigorously designed to avoid practices that inevitably corrupt the moral character of the humans involved, irrespective of momentary feelings. It's a monument to the demanding nature of her institutional reading of indirect duty.

  ---

  **Contested/Inconsistent Points Flagged:**

  1.  **Kant on Animal Suffering:** Some Kantians argue Kant's emphasis on not dulling humane feeling *implies* a stronger, more direct prohibition on causing animal suffering than Dr. [Supervisor's Last Name] allowed (e.g., actively causing pain for trivial reasons might *always* be wrong, not just when it blunts *our* feeling). Her stricter separation (allowing painless killing) is a specific, contested interpretation.
  2.  **The Bequest as Duty:** While the speech argues the bequest creates conditions for *others'* duties, one could contend that *choosing* to fund such an institution *while alive* could be seen as part of *her own* self-cultivation (cultivating beneficence/virtue). She might reject this if she saw it as implying a direct duty *to* animals, which she denied. The speech's framing avoids attributing that motive to her, sticking closer to the institutional impact.
  3.  **"Machine for Practicing Virtue":** This phrasing leans slightly towards virtue ethics. A strict Kantian might prefer framing it solely as structuring practices to *avoid violating* the duty of self-perfection regarding humane feeling, rather than "practicing" virtue more broadly. The core Kantian duty here is negative (don't destroy your capacity) rather than positive (cultivate virtue). The speech slightly bridges this for accessibility but depends on her institutional refinement focusing on enabling proper moral disposition.
