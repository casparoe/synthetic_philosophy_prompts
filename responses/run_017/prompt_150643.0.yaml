  Okay, let me start by unpacking the user's query. They work with a contemporary chamber-music series, writing program notes and giving pre-concert talks. They also audit a grad seminar in aesthetics. Their main issue is describing a phenomenon where a single sentence from a colleague permanently changes how they perceive a piece of music—like hearing a hidden counter-melody in the viola. Even after learning the info was incorrect, they still hear it. 

  First, I need to identify the core elements: one-shot permanence, generalization to other works, and resistance to debunking. The user mentioned this isn't like a duck-rabbit illusion because it's not reversible and there's a right/wrong aspect. They also connect this to debates in aesthetics about firsthand experience vs. testimony.

  The user wants to know if this phenomenon has a name. If not, they want a coined term with a clear definition. They're not looking for readings but a precise conceptual carve-up. 

  I recall concepts from philosophy and aesthetics. Aspect-perception (Wittgenstein) comes to mind, but it's reversible, unlike this. Cognitive penetration involves beliefs influencing perception, but debunking usually reverses it. The user's case persists even after knowing the info is false. 

  Then there's Wollheim's "seeing-in" for representational art, but music isn't visual. Categories from Walton or Scruton might apply, but categories usually need consistency and don't survive debunking. 

  The key is the persistence despite discredited source. That's unusual. Maybe it's a hybrid: a perceptual gestalt formed by conceptual priming. The priming creates a schema that reorganizes auditory perception. Once the pattern is detected, it becomes self-sustaining because the brain latches onto it. 

  Generalization happens because the initial insight acts as a prototype, priming similar patterns in other works. Resistance to debunking occurs because the perception is now data-driven, not belief-dependent. The belief is discarded, but the perceptual skill remains. 

  The term Perceptual Concept Acquisition (PCA) comes to mind. It emphasizes the acquisition of a new way of perceiving through conceptual input. The three features are interlinked: the one-shot trigger creates the schema, generalization extends it via pattern recognition, and debunking resistance shows it's now a perceptual skill. 

  I need to define PCA carefully. Boundary cases: if someone points out a non-existent pattern but you never hear it, that's a failed PCA. If you hear it only once and it fades, that's not permanent. If debunking makes it disappear, then it's belief-dependent, not PCA. 

  The user might also be hinting at the epistemology of aesthetics. If testimony can grant perceptual skills, then firsthand experience isn't the only path. PCA suggests that testimony can provide the conditions for new perceptions, even if the content was inaccurate. 

  They might also want to validate their teaching methods. Understanding PCA could help them design better pre-concert talks to trigger such insights. The deeper need is to articulate this phenomenon to enhance listener engagement with contemporary music, which is often challenging. 

  So, synthesizing all this, PCA as a coined term with the three features as integral parts makes sense. It bridges philosophy of perception and aesthetics, offering a new lens for how we come to perceive art.
answer: |-
  Based on your meticulous description and the specific constraints you've outlined, this phenomenon **does not have a single, universally agreed-upon name in aesthetics or philosophy of perception.** While it intersects with several established concepts, none fully capture the unique combination of features you identify: **perceptual transformation via linguistic trigger, one-shot permanence, generalization across works, and resistance to source discrediting.**

  Here's a conceptual carving, contrasting your phenomenon with nearby concepts and proposing a coined term:

  1.  **Contrast with Nearby Concepts:**
      *   **Aspect Perception (e.g., Duck-Rabbit - Wittgenstein):** As you note, this differs crucially. Aspect perception is reversible, voluntary, and often involves *competing* interpretations of the *same* sensory data. Your phenomenon is irreversible, involuntary after the trigger, involves the *discovery* of a *new* structural feature previously not perceived *at all*, and claims objectivity ("right and wrong").
      *   **Cognitive Penetration of Perception:** This broad category describes how beliefs, desires, or concepts can influence what we perceive. Your case fits *initially*, but crucially **fails** the discrediting test. Standard cognitive penetration predicts that when the belief is debunked ("the viola counter-melody isn't actually there in this edition"), the perception should shift back or weaken significantly. Your experience persists independently of the belief that justified the initial instruction.
      *   **Perceptual Learning:** This involves gradual improvement in perception through practice (e.g., learning to identify bird calls). Your phenomenon is **one-shot**, triggered linguistically, not through repeated exposure or sensory practice.
      *   **Perceiving under a Category (Walton, Scruton):** The idea that correctly categorizing an artwork (e.g., "Impressionist," "serialist") shapes appropriate perception and judgment. While your colleague's sentence *might* implicitly suggest a category ("composer X's typical texture"), the trigger is much more specific (a particular structural feature) and the effect is **generalized** beyond the initial category to other works/composers mentioned. Furthermore, category perception usually assumes consistency with the artwork's actual properties; your experience persists despite knowing the *specific* trigger was factually wrong for *this* piece.
      *   **Testimony & Aesthetic Experience:** The debate about whether aesthetic judgment requires first-hand experience (e.g., Kantian disinterest, Sibley) vs. being acquirable via testimony. Your case **radically reframes** this: testimony doesn't just convey a *judgment* or *belief*; it directly, irreversibly *alters the perceptual experience itself* in a way that *generates* the required first-hand experience. This bypasses the usual terms of the debate.
      *   **Gestalt Formation/Reorganization:** This describes how we organize sensory data into coherent wholes (e.g., figure/ground). Your colleague's sentence acts as a powerful **perceptual prime**, triggering a specific gestalt reorganization of the auditory stream. Crucially, this reorganization becomes locked in ("permanent") and serves as a prototype for future listening ("generalization"). The resistance to discrediting stems from the *perceptual skill* now being embedded, independent of the *origin* of the prime.

  2.  **Defining the Phenomenon & Coining a Term:**
      The core phenomenon is the **acquisition of a new, persistent perceptual skill for discerning a specific structural feature within an artistic domain, triggered instantaneously and irreversibly by linguistic instruction, which generalizes beyond the initial context and persists even when the factual accuracy of the triggering instruction is discredited.**

      **Coined Term: Perceptual Concept Acquisition (PCA)**

      *   **Perceptual:** It fundamentally alters sensory experience.
      *   **Concept:** It involves grasping a specific structural feature or relationship (e.g., "counter-melody," "isorhythm," "particular harmonic tension").
      *   **Acquisition:** It's the gaining of a new cognitive-perceptual ability.

  3.  **Defining Features of PCA & Their Interrelation:**
      *   **Perceptual Transformation via Linguistic Trigger (The Core Mechanism):** A concise verbal description ("buried viola counter-melody") instantly restructures auditory perception, making an unheard feature salient and undeniable. This isn't just directing attention; it's *creating the perceptible object* for the listener.
      *   **One-Shot Permanence:** The transformation is immediate and irreversible. Once the perceptual gestalt is reorganized around the new concept, the prior state of not hearing the feature becomes inaccessible. Repeated listening without the trigger fails; the trigger unlocks the perceptual schema.
      *   **Generalization:** The acquired perceptual concept acts as a prototype. Having learned to hear "composer X's buried viola lines," the listener readily detects similar structural features in other works by X, and even in works by associated composers mentioned concurrently. This goes beyond mere suggestion; it's the application of a newly acquired perceptual *skill*.
      *   **Resistance to Source Discrediting (The Key Differentiator):** Discovering the triggering information was factually incorrect (wrong edition) destroys the *justification* for the initial belief *about that specific instance*, but it does not disable the acquired *perceptual capacity*. The listener now hears the feature *as a property of their current auditory experience*, even while knowing it wasn't intended or notated *in this specific case*. The percept has become data-driven rather than belief-dependent.
      *   **Interrelation:** These are facets of a **single phenomenon**. The linguistic trigger provides the conceptual key for a gestalt reorganization (Transformation/Permanence). This reorganization establishes a new perceptual category/schema (Concept). Once established, this schema is applied proactively to new stimuli (Generalization). Its grounding in *perceptual* reorganization rather than *doxastic* commitment explains its persistence when the original *doxastic* justification is removed (Resistance).

  4.  **Boundary Cases & Refinements:**
      *   **Failed PCA:** If the listener is told about a non-existent feature and *never* hears it, even momentarily, that's not PCA. PCA requires the successful perceptual shift.
      *   **Temporary Shift:** If a verbal suggestion changes perception briefly but it fades (e.g., "imagine the trumpet is muted" for one listening), that's weaker cognitive penetration, not PCA's permanence.
      *   **Belief-Dependence Persisting:** If debunking the source *does* cause the percept to vanish (e.g., "Oh, now I hear it without the counter-melody again"), that's standard cognitive penetration, not PCA. PCA's resistance is defining.
      *   **Limited Generalization:** If the new hearing *only* occurs in the exact spot pointed out and nowhere else, even in similar works, it lacks the essential Generalization feature. It might be attention-directing or simple priming without schema formation.
      *   **Non-Linguistic Trigger:** Could a visual diagram or gesture trigger PCA? Your core case is linguistic, but the mechanism (providing a conceptual key for gestalt shift) might extend to other symbolic triggers. The core phenomenon you describe centers on the *power of language* to induce this shift.
      *   **The "Right and Wrong" Aspect:** PCA doesn't guarantee the acquired percept corresponds to an objective feature. You might acquire a PCA for a feature that isn't "truly" there *in the score*, but is now part of *your perceptual reality* of the sound (as in your debunked case). However, PCA is *enabled* by the belief that the instruction points to something real. The *validity* of the percept (its correspondence to composer intent, score, or shared critical consensus) is a separate epistemological question from the *mechanism* of PCA itself.

  **Conclusion:** Your experience is a fascinating and under-theorized phenomenon at the intersection of perception, cognition, language, and aesthetics. **Perceptual Concept Acquisition (PCA)** best captures its essence: the instantaneous, irreversible acquisition of a perceptual skill for recognizing a structural artistic feature via linguistic instruction, characterized by generalization and remarkable immunity to the discrediting of the source of that instruction. The three features you identify are interdependent aspects of this single cognitive-perceptual mechanism. This phenomenon demonstrates that testimony can sometimes *generate* the very first-hand experience that aesthetic judgment is often argued to require, fundamentally challenging simplistic divisions between testimony and direct perception in aesthetic engagement.
