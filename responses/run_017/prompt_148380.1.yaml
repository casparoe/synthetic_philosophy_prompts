answer: |-
  ### RefClass Pro™: Base Rates for the Precise Mind  
  *Frequently Asked Questions*  

  **1. What is RefClass Pro?**  
  RefClass Pro is the world’s first reference-class optimization suite. By dynamically sorting your query into the statistically ideal cohort, we deliver the *exact* base rate for decisions like "Should I quit my job?" or "Will this startup idea work?" No more guesswork—just precision.  

  **2. How does the Specificity Dial work?**  
  Great question! Slide left for broad classes (e.g., "all humans," *n* ≈ 8 billion). Slide right for hyper-specific classes (e.g., "38-year-old ex–chess champions with a fear of pigeons," *n* = 1). Both extremes are mathematically valid. For best results, tweak the dial until the base rate aligns with your intuition!  

  **3. I’m only making this decision once. How do I interpret "probability" here?**  
  Excellent point! We recommend selecting the narrowest reference class with "adequate statistics" (default: *n* ≥ 30). If your class has fewer members, the dial will auto-adjust to widen it until data exists. Note: At maximum specificity (*n* = 1), outcomes are binary (0% or 100%)—equally rigorous!  

  **4. What’s the Total Evidence™ premium tier?**  
  Total Evidence™ conditions on *every known factor*: your DNA, browser history, and even that weird dream about llamas. However, since raw data requires grouping, our algorithm selects the most "natural" reference class for your query. Pricing starts at $99/month. *Fun fact: Conditioning on all evidence still requires choosing what "similarity" means!*  

  **5. Can I use RefClass Pro to win arguments?**  
  Absolutely! Enable Adversarial Class™ mode to let your opponent assign your reference class. Whether debating "Is this startup viable?" or "Should I get a tattoo?", both sides can cherry-pick classes that return their preferred base rate (e.g., "failed startups" vs. "startups founded on Tuesdays"). Remember: Truth is a spectrum!  

  **6. How do existential questions work? E.g., "Will I live to see the Singularity?"**  
  Our Observer-Class™ add-on handles this! Select from preset cohorts:  
  - All humans: 0% (so far!)  
  - Humans born after 1990: Optimistic!  
  - Users of this app: Subscribe to our Doomsday Upsell™ ($149/month) to condition on real-time apocalypse indicators.  
  *Note: Answers vary by class. We recommend the one that improves your mood.*  

  **7. When does RefClass Pro perform best?**  
  Unironically, for high-frequency events! E.g., "What % of projects like mine ship on time?" Using our default class ("Agile teams in your industry"), accuracy is 78%—far better than gut instinct. Base rates shine when the world is boring. For unique decisions, see Q3.  

  **8. Who defines the "right" reference class?**  
  We don’t! RefClass Pro integrates with institutional partners (banks, insurers, hospitals) to adopt *their* classes. Why? They have contractual and regulatory incentives to pick classes that "work." Skin in the game > philosophical purity.  

  **9. What if I get a useless base rate?**  
  Try widening/narrowing the Specificity Dial! If "all humans" (cancer survival: 99%) feels too broad, while "me" (*n* = 1) feels too narrow, remember: All reference classes are arbitrary. For further assistance, our Knowledge Base article "Embracing Statistical Despair" may help.  

  **10. Can I customize classes?**  
  Of course! Add traits like "has student debt" or "believes in UFOs" to any query. Pro tip: Stack adjectives until *n* = 1 for maximum precision. Example: "Base rate of success for a redheaded insomniac with a Bitcoin tattoo launching a fusion startup in Kansas." (*n* = 0 → defaulting to "all startups").  

  **11. Why trust your classes over my own judgment?**  
  Studies show humans overweight personal anecdotes. RefClass Pro underweights them! Our median user reports 20% less decision anxiety (placeholder data; *n* = 12).  

  **12. What’s your accuracy guarantee?**  
  We guarantee our base rates are *correct* relative to the class you select. If reality disagrees, re-run the query with a different class! As always, past performance ≠ future results.  

  ---  
  *RefClass Pro™: Because "it depends" is statistically verifiable.*  
  *Free tier: 3 queries/month. Total Evidence™: Infinite specificity, finite answers.*
