  The user has already identified several key desiderata: splitting invariance (which they worry might conflict with outcome fairness), avoiding double-counting of moral preferences, handling utility scaling issues, managing probability disagreements, robustness to imperfect inputs, population variability concerns, temporal consistency, and practical estimability. They explicitly want to avoid restating Harsanyi axioms and instead focus on practical requirements.

  What stands out is their emphasis on real-world constraints: messy inputs, limited measurement capabilities, and public defensibility. They're not just after theory - they need something implementable. Their concern about "double counting" moral preferences is particularly nuanced - recognizing that individual utility functions already contain social judgments.

  The core challenge they're highlighting is the tension between theoretical purity and practical application. They need to know which requirements are truly essential versus negotiable, and where conflicts might force tradeoffs. Their request for "which requirement to drop first" shows they're prepared for hard choices.

  For the scoring approach: Splitting Invariance is likely the most restrictive requirement that forces expected utility formalism. Non-Double-Counting points to the need for laundering procedures. Scale Invariance is probably the most fundamental mathematical constraint that enables comparability without dictatorship. Probability Disagreement might force the hardest tradeoff between procedural fairness and coherent outcomes. Estimability will be the practical bottleneck that eliminates otherwise elegant solutions.

  When considering existing approaches: Utilitarianism fails Non-Double-Counting but wins on Estimability. Ex-Post Prioritarianism conflicts with Splitting Invariance. Maximin fails Scale Invariance. Veil-of-Ignorance approaches stumble on Probability Disagreement handling and Estimability.
answer: |-
  Here’s a distilled list of desiderata for your public-investment ranking rule, grounded in practical defensibility, conflicts, and trade-offs. I’ve refined your items, added critical ones, flagged irreconcilable tensions, and scored major approaches. Requirements are ranked by "non-negotiability" for your context (defensibility + implementability).

  ### Core Desiderata (with Cases & Non-Negotiables)
  1. **Scale Invariance, Not Full Comparability**  
     *Requirement:* Social rankings must not change if you rescale an individual’s utility (e.g., switching from "utils per year" to "utils per month").  
     *Case:* Prevents arbitrary normalization from dictating outcomes.  
     *Non-negotiable:* **Yes** – Without this, rankings depend on arbitrary measurement units, indefensible publicly.  
     *Conflict:* Full comparability demands a universal well-being unit – unmeasurable in practice. **Drop this.**  

  2. **Non-Double-Counting of Moral Preferences**  
     *Requirement:* Correct for embedded social judgments in individual utilities (e.g., "I prefer helping Valley A because it’s poorer").  
     *Case:* If Alice and Bob both value "fairness," counting their utilities naively weights fairness twice.  
     *Non-negotiable:* **Yes** – Essential for legitimacy; else the rule amplifies popular biases.  
     *Solution:* "Launder" utilities to isolate self-regarding welfare (*possible but messy*).  

  3. **Belief-Aggregation Transparency**  
     *Requirement:* Explicitly state how differing probabilities (e.g., flood risks) are combined.  
     *Case:* Experts vs. citizens disagree on probabilities; using one group’s beliefs over another’s is political.  
     *Non-negotiable:* **Yes** – Hiding this invites backlash.  
     *Conflict:* Respecting all *ex ante* preferences forces *linear pooling* of probabilities (weighted average), which can violate *statewise dominance* (e.g., everyone prefers X over Y given their own beliefs, but social ranking reverses). **Unavoidable cost.**  

  4. **Robustness to Messy Inputs**  
     *Requirement:* Handle non-vNM preferences (e.g., Allais paradoxes), intransitivities, proxy actors (e.g., "future generations").  
     *Case:* Real people aren’t rational; corporations aren’t people.  
     *Non-negotiable:* **Yes** – Theoretical purity is useless here.  
     *Fallback:* Use expert vNM proxies for groups, with sensitivity analysis on inconsistencies.  

  5. **Splitting Invariance**  
     *Requirement:* Ranking unchanged by splitting identical outcomes/probabilities.  
     *Case:* Ensures rule focuses on *consequences*, not labeling of states.  
     *Negotiable:* **No** – *Drop this first if needed.* It conflicts with fairness concerns (e.g., "avoid catastrophes for any group"). Practitioners are right: this kills rules sensitive to worst-case outcomes.  

  6. **Population Ethics Simplicity**  
     *Requirement:* Avoid theoretical quagmires (e.g., "repugnant conclusion").  
     *Case:* Adding unaffected individuals shouldn’t change rankings; identical twins shouldn’t require special logic.  
     *Non-negotiable:* **For your scale** – With 2M people, focus on *average* welfare, not total.  
     *Solution:* Ignore "barely worth living" lives – irrelevant for regional investments.  

  7. **Procedural Consistency**  
     *Requirement:* Aggregate-then-update ≈ Update-then-aggregate (no money pumps).  
     *Case:* Multi-year decisions with re-evaluations (e.g., new flood data).  
     *Non-negotiable:* **Conditional** – Only bites with belief disagreements. If using linear pooling, it holds.  

  8. **Estimability Under Constraints**  
     *Requirement:* Work with ordinal or survey-based data (e.g., "valley A is poorer" vs. exact utils).  
     *Case:* No time for vNM lotteries on 2M people.  
     *Non-negotiable:* **Yes** – The dealbreaker.  
     *Solution:* Leverage proxy metrics (income, QALYs) with explicit welfare mappings.  

  ---

  ### **Irreconcilable Conflicts**  
  - **Non-Double-Counting + Splitting Invariance + Fairness:**  
    Splitting invariance forces "consequentialist" rules (e.g., utilitarianism). But if individuals care about fairness *ex post*, laundering utilities conflicts with splitting invariance. **Drop splitting invariance.**  
  - **Belief Aggregation + Ex-Ante Pareto:**  
    Respecting all *ex ante* preferences requires linear pooling, which can violate *ex-post* unanimity. **You must accept this or impose shared beliefs.**  

  ---

  ### **Requirement Scorecard (What Knocks Out Rules)**  
  | **Rule**               | Dealbreaker Flaw                         | Fatal Requirement        | Viable? |  
  |------------------------|------------------------------------------|--------------------------|---------|  
  | **Weighted Utilitarianism** | Double-counts moral preferences | Non-Double-Counting      | Only if utilities laundered |  
  | **Average Utility**    | Fails Splitting Invariance (but we drop it) | None major               | **Best fit** if using averages |  
  | **Ex-Post Prioritarian** | Violates Splitting Invariance severely | Splitting Invariance (if kept) | No |  
  | **Maximin**            | Not scale-invariant; ignores magnitudes | Scale Invariance         | No |  
  | **Veil of Ignorance**  | Unmeasurable (needs vNM + probabilities)| Estimability             | No |  

  ---

  ### **Recommendation**  
  1. **Drop Splitting Invariance** – It blocks fairness-sensitive rules practitioners want.  
  2. **Use Linear Pooling for Beliefs** – Accept occasional reversal to respect diverse inputs.  
  3. **Launder Utilities** – Remove explicit fairness preferences via surveys ("How much worse off is Valley A *for you*?").  
  4. **Average Laundered Utilities** – With common proxy metrics (e.g., equivalent income), this satisfies:  
     - Scale invariance (using ratios),  
     - Non-double-counting (if laundered),  
     - Estimability (with proxies),  
     - Population ethics (averaging handles duplicates).  

  **Why this works**: It’s defensible as "equal weight per person’s welfare," avoids theoretical traps, and runs on data public bodies actually have. The cost? It ignores inequality beyond what’s embedded in laundered utilities – but you can add an explicit equity multiplier post-averaging.
