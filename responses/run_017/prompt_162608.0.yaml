prompt: |-
  I teach a graduate seminar in formal epistemology, and for a couple of years now I have kept a private diary of my own updating behaviour: episodes in which my confidence in some proposition moved without my having learned any proposition with certainty, together with my gut verdict on whether the move was the right one. I would like to hand my students a principle instead of a pile of anecdotes, and the pile will not settle into reflective equilibrium. The entries are these. (1) A glance at a folded cloth in a badly lit closet takes my credences over the colour partition from (.30 red, .50 orange, .20 yellow) to (.70, .20, .10) while leaving the ratios of crimson to vermilion within the red cell and of amber to ochre within the orange cell exactly as they were; I am confident that holding those ratios fixed is correct here. (2) Scratching in the attic raises my credence that a raccoon got in from .10 to .60, and it simultaneously raises, conditional on raccoon, my credence that it came through the soffit from .30 to .65, because the noise now makes me think the soffit is loose; I am equally confident that this within-cell movement is correct and that a plain Jeffrey update on the animal partition alone would get the case wrong. (3) Two only partly trusted reports about the same search-committee outcome arrive an hour apart — an email from a colleague, then a remark I overhear — and I am troubled to find that the order in which I take them changes where I land; my verdict is that it should not. (4) An hour after the closet episode I learn that the closet is lit by a sodium lamp that makes everything look orange; my verdict is that I should redo the earlier update rather than stack a new shift on top of it, and that a framework with no retraction operation is missing something. (5a) Two glasses of wine at dinner drop my confidence in a claim about how a departmental vote went from .90 to .55 while nothing else changes; my verdict is that no update is called for, the new number is noise. (5b) But when I realise I formed that very belief over a semester in which I was chronically exhausted and over-caffeinated, my verdict is that I should move, though only to about .75. (6) An expert who has seen data I have not tells me her credence in a hypothesis went from .20 to .90, and I move to roughly .80; a colleague who shares all of my evidence tells me she is at .70 on the same proposition, and I barely move at all. I take both verdicts to be right and want the difference explained.

  My tentative rule is that what makes a shift admissible is its provenance plus a repair procedure: refine the partition until the shift no longer discriminates within any cell, then Jeffrey-conditionalize on the refined partition, holding conditional probabilities inside cells fixed; ignore shifts produced by a change in my own processing rather than by news about the world; and when two shifts arrive, merge them into a single shift before conditionalizing, so that the outcome is order-invariant. I can see two ways this is thin — refinement looks trivializing, since I can always cut finely enough to turn any change into a change between cells, and merging needs a rule I have not supplied — and I do not know how it handles the fact that some processing changes are defeating and some are not.

  Please give me the principle, or the small set of candidate principles, that best captures these verdicts: state each clause precisely and say which case motivated it, tell me what it predicts about two cases I have no settled verdict on — (i) I learn that the closet glance was made while I was wearing tinted sunglasses whose effect I cannot quantify, and (ii) I learn tonight that tomorrow I will be shown a photograph that will shift my credence in a colleague's misconduct by some unknown amount in an unknown direction — and tell me honestly which of my verdicts it cannot accommodate and what I should say instead in that case. Please close with a single final line of the form \answer{...} containing, in one sentence, either the principle you recommend or the verdict you would have me give up if no single principle does the work.
reasoning: |-
  We are given a series of episodes and the user's verdicts on each. The goal is to find a principle (or small set of principles) that captures these verdicts. The tentative rule proposed by the user has some issues (trivializing refinement and lack of a merging rule). We'll go through each case and then try to build a principle that accounts for them.

  ### Cases and Verdicts:

  1. **Cloth Color**: 
     - Initial: (red: 0.30, orange: 0.50, yellow: 0.20)
     - After glance: (red: 0.70, orange: 0.20, yellow: 0.10)
     - The ratios within the red and orange subpartitions (crimson/vermilion for red, amber/ochre for orange) remain fixed.
     - Verdict: Holding the within-cell ratios fixed is correct.

  2. **Attic Raccoon**:
     - Initial credence in raccoon: 0.10 -> 0.60
     - Conditional on raccoon, credence in soffit entry: 0.30 -> 0.65
     - Verdict: The within-cell movement (conditional on raccoon) is correct, and a plain Jeffrey update on the animal partition alone (without updating the conditional) would be wrong.

  3. **Two Reports**:
     - Two partially trusted reports about the same event (search-committee outcome) arrive in sequence.
     - The order of processing affects the final credence.
     - Verdict: The order should not matter.

  4. **Sodium Lamp**:
     - After the closet episode, learns that the closet has a sodium lamp (making everything look orange).
     - Verdict: Should redo the earlier update (retract the previous update and update with the new information) rather than stacking.

  5. **Wine and Exhaustion**:
     - **5a**: Two glasses of wine drop confidence in a departmental vote claim from 0.90 to 0.55. Verdict: No update, just noise.
     - **5b**: Realizing the belief was formed while chronically exhausted and over-caffeinated, then should update to about 0.75. Verdict: This shift is not noise and should be updated.

  6. **Expert and Colleague**:
     - Expert (who has seen data I haven't) moves from 0.20 to 0.90 in a hypothesis -> I move to 0.80.
     - Colleague (shares all my evidence) moves to 0.70 on the same -> I barely move.
     - Verdict: Both are right, and the difference must be explained.

  ### Tentative Rule (with flaws):

  The user's tentative rule: 
  - Refine the partition until the shift no longer discriminates within any cell, then Jeffrey-conditionalize on the refined partition (holding conditional probabilities inside cells fixed).
  - Ignore shifts from changes in processing (not news about the world).
  - When two shifts arrive, merge them into a single shift (to avoid order dependence).

  Problems:
  1. Refinement trivialization: By refining enough, any change can be made to look like a change between cells.
  2. Merging needs a rule: How to merge two shifts?

  ### Proposed Principle:

  We need a principle that:
  - Handles within-cell changes appropriately (cases 1 and 2).
  - Avoids order dependence (case 3).
  - Allows for retraction (case 4).
  - Distinguishes between noise (case 5a) and defeating conditions that warrant an update (case 5b).
  - Explains the difference in reaction to the expert and the colleague (case 6).

  We propose the following principle:

  **Principle of Evidential Update (PEU):**

  1. **Partition Refinement and Jeffrey Update**: 
     - When an experience shifts your credences, identify the coarsest partition (or set of partitions) such that the shift does not change the conditional probabilities within any cell of the partition. Then, update by Jeffrey conditionalization on that partition, holding the conditional probabilities within each cell fixed.
     - *Motivation*: Cases 1 and 2. In case 1, the within-cell ratios (for the color subpartitions) are unchanged, so the update is done on the color partition. In case 2, the shift changes the conditional probability within the raccoon cell (so the partition must be refined to include the soffit entry). The refinement is not arbitrary but driven by the shift: we refine until the shift does not discriminate within cells. This avoids trivialization because we are looking for the coarsest partition that satisfies the condition.

  2. **Ignoring Non-Evidential Shifts**:
     - A shift is ignored if it is caused by a change in the subject's cognitive processing (e.g., due to fatigue, alcohol, drugs) and is not accompanied by new evidence about the world. However, if the shift is due to the realization of a previously unsuspected defect in the processing that produced the original belief (e.g., learning that the belief was formed under conditions of exhaustion), then it is treated as evidence about the reliability of the original evidence and thus warrants an update.
     - *Motivation*: Case 5a (wine) is ignored because it is noise without evidential value. Case 5b (exhaustion) is an update because it is evidence about the reliability of the original evidence.

  3. **Order Invariance via Merging**:
     - When multiple updates (from the same source or different sources) occur in close succession and pertain to the same event, they should be merged into a single update. The merging is done by taking the net shift induced by all the updates together and then applying the update as in step 1. This ensures order invariance.
     - *Motivation*: Case 3 (two reports). The order should not matter, so merging the two shifts into one update (as a single Jeffrey update) would make the result order-invariant.

  4. **Retraction for Defeated Evidence**:
     - If an update was based on evidence that is later defeated (e.g., by learning that the conditions under which the evidence was gathered were flawed), then the update should be retracted. The agent should revert to the state before the defeated update and then update with the new evidence (which may include the defeating information) appropriately.
     - *Motivation*: Case 4 (sodium lamp). The initial update (based on the glance) is defeated by the new information about the lamp. So we retract the first update and then update with both pieces of evidence (the glance and the lamp) together.

  5. **Expert vs. Peer**:
     - When an expert (who has more evidence) updates, we treat this as evidence about the world and update accordingly (e.g., via Jeffrey conditionalization on the hypothesis, with the expert's report as evidence). When a peer (with the same evidence) updates, we treat it as a shift that might be due to processing differences and thus update very little (or not at all) unless we have reason to trust their processing more.
     - *Motivation*: Case 6. The expert's update is based on new data, so it is strong evidence. The colleague's update is not based on new data (relative to me) and thus is weak evidence (if any) because it might be due to processing noise.

  ### Handling the Open Cases:

  **(i) Tinted Sunglasses**:
     - Situation: After the closet glance update, you learn that you were wearing tinted sunglasses (whose effect you cannot quantify) during the glance.
     - Verdict: This is similar to case 4 (sodium lamp). The sunglasses defeat the evidence from the glance because they distort the colors. Therefore, we should retract the update based on the glance and then update with the new information (the glance and the sunglasses) together. However, without being able to quantify the effect, we might have to treat the glance as completely uninformative and revert to the pre-glance credences (or perhaps adjust by an unknown amount). The PEU would say: retract the update and then update with the new evidence (which now includes the sunglasses). But if we cannot quantify, we might have to set the credences to a state of uncertainty (e.g., a uniform distribution or a more conservative one). However, note that the sunglasses might not change the within-cell ratios (if they affect all colors in the same way) but they might make the entire observation unreliable. So we might ignore the update.

     - **PEU Prediction**: Retract the update from the glance and then update with the new information. However, without a way to quantify the effect, the update might be to revert to the pre-glance state and then not use the glance at all (because it is now considered unreliable). Alternatively, we might try to update by considering the possibility of distortion, but without a model, it's hard. This case might require setting the partition to the coarsest level (e.g., just the color partition) and then setting the probabilities to a more uncertain state? However, the principle doesn't specify how to update with unreliable evidence. We might extend the principle: if an update is based on evidence that is later found to be unreliable and the degree of unreliability cannot be quantified, then the update is void and we revert to the state before the update.

     - **Proposal**: In this case, we retract the update and then do not include the glance as evidence (since it is now considered unreliable). So we are back to the initial state (0.30, 0.50, 0.20) and then we have the new information about the sunglasses (which doesn't directly affect the color but only the reliability of the observation). We might then have an update that the cloth is more likely to be orange (because the lamp and sunglasses together might have made it look orange) but without quantification, we might not move. Alternatively, we might update to a more uniform distribution? The key point is retraction and then updating with the new evidence appropriately.

  **(ii) Future Photograph**:
     - Situation: You learn that tomorrow you will be shown a photograph that will shift your credence in a colleague's misconduct by an unknown amount in an unknown direction.
     - Verdict: This is a case of anticipated evidence. The principle should not require any update now because no evidence has been received. However, it might affect your current credence by making you anticipate that your future credence will change. This is similar to the concept of reflection. But note: the reflection principle would say that your current credence should be the expectation of your future credence. However, in this case, the future shift is unknown. 

     - **PEU Prediction**: Since no update has occurred (only the anticipation of an update), the current credence should not change. However, if we are to follow the reflection principle, we would set our current credence to the expected value of the future credence. But the problem says the shift is by an "unknown amount in an unknown direction". Without any information about the distribution of the shift, we cannot form an expectation. Therefore, we should not update. The principle of ignoring non-evidential shifts (from processing) does not apply because this is about future evidence. We have not received any evidence yet, so no update now.

  ### Cases the Principle Might Not Fully Accommodate:

  - **Case 2**: The tentative rule says that a plain Jeffrey update on the animal partition alone would be wrong. Our PEU (with refinement) would require refining the partition to include the soffit entry. So we would update on the partition {raccoon and soffit, raccoon and not soffit, not raccoon}? But note: the shift changes both the probability of raccoon and the conditional probability of soffit given raccoon. We must update both. The Jeffrey update on the refined partition would work. So PEU accommodates this.

  - **Case 5b**: Our PEU says that the realization about exhaustion is evidence about the reliability of the original evidence. We update by retracting the original belief? Not exactly. The original belief was formed over a semester. We are now updating our current belief (which might be based on that evidence) because we have new evidence (that the original evidence was gathered under unreliable conditions). So we should update by reducing our confidence (to 0.75). How? We might model it by having a partition: {the claim is true, the claim is false} and then updating based on the new evidence (the exhaustion) which suggests that the original evidence might have been overinterpreted. We don't have a clear rule for how much to update, but the principle says we update (so we move to 0.75) and ignore the wine shift (5a). So it's accommodated.

  - **Case 6**: We explain the difference by distinguishing between expert (new evidence) and peer (same evidence). The expert's update is treated as evidence about the world, so we update substantially. The peer's update is not new evidence and might be due to processing, so we update little. This is accommodated.

  ### Potential Problem:

  - **Refinement trivialization**: The user worries that refinement can always be made arbitrarily fine. We avoid this by requiring the **coarsest** partition such that the shift does not change conditional probabilities within any cell. This is well-defined: we start with the partition that the shift is defined on (or the natural partition) and then refine only where the shift changes the conditional probabilities. In case 2, we start with the partition {raccoon, not raccoon} and note that within the raccoon cell, the conditional probability of soffit changes. So we refine the raccoon cell into {soffit, not soffit}. The coarsest partition that works is {raccoon and soffit, raccoon and no soffit, not raccoon}. We then Jeffrey update on that partition.

  ### Final Recommendation:

  We recommend the **Principle of Evidential Update (PEU)** as described above.

  In one sentence:

  \answer{The principle is: when an evidential shift occurs, update by Jeffrey conditionalization on the coarsest partition that leaves within-cell conditional probabilities unchanged; ignore shifts due to non-evidential processing changes (unless they reveal a defect in past evidence gathering); merge multiple shifts to avoid order dependence; retract updates based on defeated evidence; and treat expert updates as evidence but peer updates as non-evidential unless they reveal processing advantages.}
answer: |-
  ### Proposed Principle: Evidential Fidelity with Defeasible Jeffrey Updating (EFDJU)

  I propose a principle that captures your verdicts, addressing the concerns about refinement trivialization and merging, while incorporating defeasibility and source sensitivity. The principle has four core clauses, each motivated by your cases.

  ---

  #### **Clause 1: Coarse-Grained Jeffrey Update with Stable Subpartitions**  
  - **Statement**: When a shift occurs, apply Jeffrey conditionalization on the coarsest partition \(\mathcal{P}\) such that:  
    (i) The shift preserves all conditional probabilities within every cell of \(\mathcal{P}\) (i.e., for any subpartition \(\mathcal{Q}\) within a cell of \(\mathcal{P}\), \(P_{\text{new}}(Q_i | C_j) = P_{\text{old}}(Q_i | C_j)\) for all \(C_j \in \mathcal{P}\)).  
    (ii) \(\mathcal{P}\) is not trivially refined (i.e., it must be minimal: no coarser partition satisfies (i)).  
  - **Motivation**: Case 1 (cloth color) and Case 2 (raccoon).  
    - Case 1: The color partition \(\{Red, Orange, Yellow\}\) satisfies (i) because ratios within red/orange cells are fixed. Refinement (e.g., splitting red into crimson/vermilion) is unnecessary.  
    - Case 2: The partition \(\mathcal{P} = \{Raccoon \land Soffit, Raccoon \land \neg Soffit, \neg Raccoon\}\) is required because the shift changes \(P(Soffit | Raccoon)\). A plain Jeffrey update on \(\{Raccoon, \neg Raccoon\}\) would violate (i), justifying your verdict.  
  - **Refinement Non-Trivialization**: By requiring the *coarsest* partition, refinement only occurs when the shift discriminates subcases (unlike trivial refinement, which would over-split). This avoids Case 1 being forced into crimson/vermilion cells.

  #### **Clause 2: Defeasible Evidence Processing**  
  - **Statement**: Ignore shifts produced by transient changes in cognitive processing (e.g., fatigue, intoxication), unless they reveal a *structural defect* in past evidence gathering. For structural defects:  
    - Retract any update dependent on the defective evidence.  
    - Recalculate beliefs from the pre-defective state using undefeated evidence.  
  - **Motivation**: Case 5a (wine), Case 5b (exhaustion), and Case 4 (sodium lamp).  
    - Case 5a: Wine causes transient noise—no update (ignored).  
    - Case 5b: Chronic exhaustion is a structural defect—update to 0.75 by retracting the original belief and reassessing.  
    - Case 4: Sodium lamp defeats the cloth-glance evidence—retract the original update and redo with new evidence.  
  - **Structural Defect Criterion**: A defect is structural if it systematically distorts evidence gathering (e.g., exhaustion during a semester), not momentary noise (e.g., wine).

  #### **Clause 3: Commutative Merging for Order Invariance**  
  - **Statement**: For multiple shifts on the same proposition, merge them into a single shift *before* updating:  
    - Let \(S_1, S_2\) be shifts. The merged shift \(S_{merged}\) is defined by composing their effects: \(P_{merged}(H) = S_2(S_1(P_{\text{old}}(H)))\).  
    - Apply Jeffrey update (Clause 1) to \(S_{merged}\).  
  - **Motivation**: Case 3 (two reports). Merging ensures the outcome is order-invariant, as \(S_1 \circ S_2 = S_2 \circ S_1\) when shifts commute (e.g., independent reports). Non-commuting shifts (e.g., conflicting dependencies) require joint calibration (see limitations).

  #### **Clause 4: Source-Sensitive External Updates**  
  - **Statement**: When an external source reports a shift:  
    - Update substantially if the source has strictly more evidence (expert).  
    - Update minimally if the source has identical evidence (peer), unless their reliability is higher.  
    - Use a *calibration factor* \(\alpha\): For expert shift from \(p\) to \(q\), move to \(\alpha q + (1-\alpha)p_{\text{old}}\), with \(\alpha\) high (e.g., 0.8). For peers, \(\alpha \approx 0\).  
  - **Motivation**: Case 6 (expert vs. colleague).  
    - Expert has novel data: large update (e.g., to 0.80).  
    - Peer shares evidence: tiny update (\(\alpha \approx 0\)), as their shift may stem from processing noise.

  ---

  ### **Predictions for Open Cases**  
  #### (i) **Tinted Sunglasses in Closet Episode**  
  - **EFDJU Prediction**: **Retract the original update and ignore the glance**.  
    - Sunglasses introduce a structural defect (unquantifiable distortion), defeating the evidence (Clause 2).  
    - Revert to pre-glance credences \((.30, .50, .20)\). No update occurs, as the glance is now inadmissible.  
  - **Why?** Analogous to Case 4 (sodium lamp): both involve external conditions corrupting evidence. Without quantifiable effects, the evidence is unusable.

  #### (ii) **Future Photograph with Unknown Shift**  
  - **EFDJU Prediction**: **No current update, but pre-bind to reflection**.  
    - No shift has occurred (only anticipation); thus, no update (Clause 2 ignores non-evidential changes).  
    - However, apply a *reflection principle*: Set \(P_{\text{now}}(H) = \mathbb{E}[P_{\text{future}}(H)]\), where the expectation integrates over uncertainty in the shift. If no distribution is known, maintain current credence.  
  - **Why?** Anticipated shifts are not evidence; updating now would violate evidential fidelity (as in Case 5a).

  ---

  ### **Limitations and Unaccommodated Verdicts**  
  - **Unaccommodated Verdict**: **Case 3 (two reports)** if shifts are non-commutative.  
    - Issue: Clause 3 assumes shifts commute (i.e., \(S_1 \circ S_2 = S_2 \circ S_1\)). But if reports are interdependent (e.g., the second report rebuts the first), merging may not ensure order invariance.  
    - **Remedy**: Replace merging with *joint shift calibration*. For reports \(R_1, R_2\), define a merged shift over the partition \(\{H, \neg H\}\) using the combined evidence (e.g., \(P_{\text{new}}(H) = f(P_{\text{old}}(H), R_1, R_2)\) for a commutative \(f\)).  
    - **Concession**: If reports conflict, your "should not depend on order" verdict may need relaxing—order matters when evidence is sequential and contradictory.

  - **Other Accommodations**:  
    - Case 2: Handled by Clause 1 (refinement to include soffit).  
    - Case 4: Handled by Clause 2 (retraction).  
    - Case 5a/5b: Handled by Clause 2 (noise vs. defect).  
    - Case 6: Handled by Clause 4 (source sensitivity).

  ---

  ### **Final Recommendation**  
  The **Evidential Fidelity with Defeasible Jeffrey Updating (EFDJU)** principle best systematizes your diary, with Clause 1 resolving refinement trivialization and Clause 3 providing a merging rule. For Case 3, if reports are independent, merging works; if not, accept order dependence for contradictory evidence.  

  \answer{Adopt EFDJU: Jeffrey-update on coarsest partition with stable subpartitions, retract defeated evidence, merge shifts commutatively, and weight external updates by source expertise, ignoring non-evidential noise but correcting for structural defects.}
