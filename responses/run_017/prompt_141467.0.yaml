     (c) This transfer is made without any assumption of the ultimate existence of the transferor, transferee, or merit.

  CLAUSE 6: NO-CONTEST
  If any beneficiary under this Will, or any person claiming through such beneficiary, contests this Will or any of its provisions, then any gift to that beneficiary under this Will shall be void. This includes, but is not limited to, contests based on the assertion that the Designated Continuum is a self, or that the property bequeathed was owned by a self. Any such property shall fall into the residuary estate.

  CLAUSE 7: SPECIAL CONTINGENCIES
     (a) In the event that the Designated Continuum attains nibbana prior to the closing of probate, the Executor shall proceed with the administration of the estate as if nibbana had not been attained, as the cessation of the aggregates does not negate the conventional obligations created by this Will.
     (b) In the event that the causal continuum branches (i.e., rebirth occurs in a manner that might suggest multiple continuations), the Executor shall distribute the estate to the beneficiary or beneficiaries named herein, without regard to any claims by or on behalf of any reborn continuation, as the law recognizes only one conventional designation per lifetime for testamentary purposes.

  CLAUSE 8: ATTESTATION
  We, the undersigned witnesses, attest that on the date hereof, the causal continuum designated as [Full Name] appeared before us and declared this instrument to be its Last Will and Testament. At that time, the aggregates of the Designated Continuum exhibited no signs of insanity, undue influence, or duress, and the continuum was operating under conditions conventionally accepted as "sound mind and memory."

