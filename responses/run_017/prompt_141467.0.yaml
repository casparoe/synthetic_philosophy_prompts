  We enclose the Last Will and Testament of the causal continuum currently designated as [Full Name]. This document has been prepared in strict accordance with the Conventional Truths Act (Statute 1:1-2, "The Two Truths"), which recognizes the ultimate truth of non-self while permitting conventional designations for practical purposes.

  Please note that while the drafting of such an instrument presents unique philosophical challenges — particularly regarding the apparent persistence of personal identity — we have taken every precaution to ensure that the Will remains legally valid under the Act. The Testator (a conventional designation for the purpose of this document) was of sound mind and memory at the time of execution, as attested by witnesses.

  Should any questions arise regarding the ontological status of the Testator or the property bequeathed, we direct you to the explanatory clauses within the Will itself.

