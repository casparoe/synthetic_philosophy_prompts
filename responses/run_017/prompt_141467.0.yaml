  We submit the enclosed Last Will and Testament (the "Instrument") executed under the *Conventional Truths Act, 5 U.S.C.T. § 8* (the "Act"), which codifies the doctrine of two truths for legal instruments. The Instrument governs the disposition of properties conventionally associated with the causal continuum designated "Testator" (as defined herein). While the Act permits conventional designations for practical efficacy, this Instrument explicitly acknowledges the ultimate truth of *anattā* (non-self) as per Abhidhamma ontology.  

  All clauses adhere to the Act’s requirement that conventional designations be used *only* where necessary for enforceability, with explicit disclaimers where ontological commitments might otherwise be implied. The Testator’s aggregates were observed to be coherent at execution, and witnesses attest to the conventional "presence" and "sound mind" of the designated continuum.  

  Should the estate enter probate, we request the Court recognize that:  
  - No clause asserts ultimate existence of persons or property;  
