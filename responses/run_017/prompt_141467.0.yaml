  ### Notes on Philosophical Execution  
  1. **No-Self in Drafting**:  
     - "Testator" is strictly a conventional label for a causal stream. Bequests redirect conditions, not "property owned by a self".  
     - Merit transfer (Clause 4) highlights the paradox of giving without giver/receiver—resolved conventionally per *Milindapañha* 2.1.  
     - Attestation (Clause 8) requires witnesses to swear to the *appearance* of coherence, avoiding "personhood" claims.  

  2. **Two Truths as Legal Shield**:  
     - The will leverages conventional truth for enforceability (e.g., "Testator" in Clause 1) while denying ultimate commitment (e.g., "as if" in Clause 3).  
     - Contingencies (Clause 7) handle edge cases (nibbāna, rebirth) by voiding the will or dismissing rebirth claims as legally irrelevant.  

  3. **Humor Through Rigor**:  
     - The residuary clause disposes of a body that was "never owned" (Clause 5).  
     - The no-contest clause penalizes beneficiaries for "asserting a self" (Clause 6).  
     - Merit transfer to a possibly non-existent/non-needy mother (Clause 4) satirizes merit’s fungibility.  

  This Instrument remains valid Buddhist philology while functioning in probate court—proving your friend *half* wrong.  

