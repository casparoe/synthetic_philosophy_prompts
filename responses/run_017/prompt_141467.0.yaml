     (a) To [Beneficiary 1], the sum of [Amount] dollars, or such other currency as may be recognized at the time of distribution, from accounts currently registered under the designation [Full Name].

     (b) To [Beneficiary 2], the real property located at [Address], subject to any mortgages or liens, which are themselves conventional designations.

     ... [other specific bequests]

  CLAUSE 4: RESIDUARY ESTATE
  All the rest, residue, and remainder of the estate, including any property not specifically disposed of herein, shall be distributed to [Residuary Beneficiary]. In the event that the residue includes the aggregates of the Designated Continuum (i.e., the physical body), the Executor shall arrange for cremation in accordance with Buddhist rites, unless the aggregates have ceased in a manner indicating the attainment of nibbana (see Clause 7).

  CLAUSE 5: FUNERAL DONATION AND MERIT TRANSFER
  A donation of [Amount] dollars shall be made to [Monastery Name] for the purpose of performing funeral rites. The merit generated by this donation (conventionally understood) is hereby transferred for the benefit of the causal continuum that was conventionally designated as [Mother's Full Name] (the "Mother Continuum"). It is acknowledged that:
     (a) The transferor of the merit is the Designated Continuum, which, at the time of transfer, may have ceased;
