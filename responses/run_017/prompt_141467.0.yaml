  The causal continuum currently designated as [Full Name] (the "Designated Continuum"), being the same continuum that, by convention, is said to have executed prior testamentary documents (if any), hereby revokes all such prior documents. It is understood that the prior documents were executed by an earlier stage of the continuum, which, due to the nature of dependent arising, is neither identical nor wholly different.

