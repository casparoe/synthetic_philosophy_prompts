  ### LAST WILL AND TESTAMENT  
  **of the Causal Continuum Conventionally Designated "Testator"**  
  *(Hereafter "Designated Continuum")*  

  **PREAMBLE:**  
  This Instrument, executed under the *Conventional Truths Act*, disposes of properties arising interdependently with the five aggregates (form, feeling, perception, formations, consciousness) currently clustered under the convention "[Testator’s Full Legal Name]". The Designated Continuum acknowledges that:  
  (a) Properties bequeathed lack inherent ownership, being empty (*suññatā*) of self-essence;  
  (b) "Testator" is a provisional label for a stream of causes/effects;  
  (c) All first-person pronouns herein are conventional shorthand, not ontological claims.  

  **CLAUSE 1: TESTATOR IDENTIFICATION (CONVENTIONAL)**  
  1.1 The causal continuum executing this Instrument is the same stream previously designated "[Testator’s Full Legal Name]" in prior wills (if any), *by convention only*, as neither identity nor difference applies across temporal aggregates.  
  1.2 Revocation of prior wills is declared, though executed by prior stages of this continuum.  

  **CLAUSE 2: APPOINTMENT OF EXECUTOR**  
  2.1 [Executor’s Name] is appointed Executor to redirect properties per this Instrument.  
  2.2 The Executor acts as fiduciary for beneficiaries *and* for the residual aggregates (Clause 5), with no implication that said aggregates constitute a "person".  

  **CLAUSE 3: BEQUESTS (TRANSFER OF CONVENTIONAL TITLE)**  
  3.1 To [Beneficiary 1], the property at [Address]: being a mere label for earth, wood, and nails, lawfully transferred *as if* owned.  
  3.2 To [Beneficiary 2], [Sum] dollars from account [Number]: conventional tokens for karmic exchange, devoid of self-nature.  
  3.3 *Disclaimer*: No "ownership" is transferred; only causes/conditions enabling usage are redirected.  

  **CLAUSE 4: MERIT TRANSFER AND FUNERAL DONATION**  
  4.1 [Sum] dollars shall be donated to [Monastery] for funeral rites.  
  4.2 The merit (*puñña*) conventionally generated by this donation is transferred to the continuum formerly designated "[Testator’s Deceased Mother’s Full Name]" (the "Mother Continuum").  
  4.3 *Acknowledgements*:  
  - (a) Merit transfer occurs without a "giver" or "recipient" in ultimate terms;  
  - (b) The Mother Continuum’s current state (e.g., hungry ghost, deva, or dissolved) is irrelevant per *Petakopadesa* 3.2;  
  - (c) This clause is valid only if the Mother Continuum has not attained nibbāna, wherein merit is moot.  

  **CLAUSE 5: RESIDUARY ESTATE & AGGREGATE DISPOSITION**  
  5.1 Residual properties pass to [Residuary Beneficiary].  
  5.2 The physical aggregate (body) shall be cremated. Ashes scattered at [Location].  
  5.3 The mental aggregates (feeling, perception, etc.) cease at death and thus require no disposition.  

  **CLAUSE 6: NO-CONTEST**  
  6.1 Any beneficiary who contests this Instrument on grounds asserting a "self" (e.g., "Testator was not of sound self") forfeits their bequest.  
  6.2 Forfeited bequests pass to the residuary estate.  

  **CLAUSE 7: CONTINGENCIES**  
  7.1 If the Designated Continuum attains nibbāna *before* probate closes:  
  - (a) This Instrument is void, as no continuum exists to hold karmic intentions;  
  - (b) The estate passes to the State under *Conventional Truths Act* § 8(d).  
  7.2 If the causal continuum branches (e.g., rebirth occurs mid-probate):  
  - (a) Property flows to named beneficiaries, not to any reborn stream;  
  - (b) The Executor may disregard claims by beings asserting "I am the Testator reborn".  

  **CLAUSE 8: ATTESTATION**  
  We, the undersigned witnesses, attest that on [Date]:  
  - (a) The aggregates labeled "[Testator’s Full Legal Name]" *appeared* before us;  
  - (b) Said aggregates exhibited coherence conventionally termed "sound mind";  
  - (c) The Designated Continuum declared this Instrument its final will, *per convention*.  

