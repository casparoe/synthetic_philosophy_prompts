prompt: |-
  ok so slightly weird request. I'm in a reading group that did Parfit a few weeks back and has now moved on to anatta, and a friend of mine who's an estates lawyer and a longtime practitioner bet me that no one could draft a last will and testament that actually took no-self seriously start to finish. I want to prove her at least half wrong. So: you're an expert on Buddhist philosophy and on analytic personal identity, with the deadpan timing of someone who's written satire before. Before drafting, brainstorm a bit for yourself — make a list of the genuine puzzles anatta creates for any document that presupposes a persisting person, pick the four or five a will can quietly take a stand on, and then write.

  What I want is a Last Will and Testament, ~600-800 words, numbered clauses, with a short cover letter at the front from the firm that drafted it (invented firm, invented jurisdiction — I'm imagining somewhere that has codified the two-truths distinction into statute, feel free to name the act). The jokes have to come from getting the philosophy right, not from winking at it: the testator has to be identified but can't be; what exactly is being bequeathed if the five aggregates were never his; a residuary clause disposing of the aggregates; a transfer-of-merit clause dedicating the merit of the funeral donation to his late mother, who may or may not currently be a hungry ghost, and the question of who is on either end of that transaction; an attestation clause where the witnesses swear he was present and of sound mind, and the drafting contortions that causes; a no-contest clause; maybe something about what happens to the estate if he attains nibbana before probate closes, or if the causal continuum branches. The one hard constraint: the drafter must never slip. No clause may quietly presuppose a self except where it's explicitly flagged as conventional usage, and every time the document needs to say "I" it should visibly strain. The target is really that two-truths move — the way "merely conventional" lets a view say anything and commit to nothing — plus the practice of merit transfer; but never state that as a thesis anywhere, let the clauses do it.

  I'd like it to land as fair to someone who actually knows the literature (the view really is that a person is a convenient designation over a causal stream, and these puzzles really are hard — no strawmanning it into "Buddhists think nothing exists") while still being funny to a lay reader who's only ever heard "there's no permanent self." Don't point me at sources or suggest readings, just write the thing.
