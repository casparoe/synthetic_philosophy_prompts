  We are drafting a Last Will and Testament that takes the Buddhist doctrine of anatta (no-self) seriously. The challenge is to avoid presupposing a persisting self while still creating a legally valid document. We must address puzzles such as: how to identify the testator without a self, what is being bequeathed if the five aggregates (form, feeling, perception, mental formations, consciousness) were never owned, how to handle merit transfer to a deceased mother (who may be a hungry ghost), and how witnesses can attest to the presence and sound mind of a non-self.

  Key elements to include:
  1. Cover letter from the law firm, setting the tone and explaining the unconventional approach.
  2. The will itself, with numbered clauses, that uses conventional language only with explicit disclaimers.
  3. Addressing: 
     - Testator identification
     - Bequests (what is being transferred if there is no owner?)
     - Residuary clause (disposing of the aggregates)
     - Merit transfer clause (with questions about the giver and receiver)
     - Attestation clause (witnesses swearing to the presence and sound mind of a non-self)
     - No-contest clause
     - Provisions for the possibility of the testator attaining nibbana (enlightenment) before probate closes, or if the causal continuum branches (e.g., rebirth occurring during probate).

  We invent:
  - Law firm: Dharmic Trusts & Estates
  - Jurisdiction: We'll say it's under the "Conventional Truths Act" (a fictional statute that codifies the two truths doctrine for legal purposes).

  Approach:
  - Use terms like "the causal continuum currently designated as [Name]" to refer to the testator.
  - For property, note that it is conventionally owned by the aggregates but ultimately without ownership.
  - Merit transfer: the merit is generated by the funeral donation, but who transfers it? And to whom? The mother is also a designated causal continuum.

  The tone: deadpan, legalistic, but with philosophical precision that creates humor by the sheer contortions.

  Let's outline the will:

  I. Cover Letter:
     - From Dharmic Trusts & Estates, introducing the will and explaining that it is drafted in accordance with the Conventional Truths Act.

  II. The Will:
     - Title: Last Will and Testament of [Name] (with a footnote or parenthetical about conventional designation)
     - Preamble: Standard opening but with anatta twist.
     - Clause 1: Identification of the Testator (as a conventional designation)
     - Clause 2: Revocation of Previous Wills (but note that the previous wills were made by a different continuum)
     - Clause 3: Appointment of Executor (who will act for the benefit of the aggregates during probate)
     - Clause 4: Bequests: Specific gifts to beneficiaries, with language about the transfer of conventional ownership.
     - Clause 5: Residuary Estate: Disposal of the remainder, including what happens to the aggregates (e.g., cremation, etc.)
     - Clause 6: Funeral Donation and Merit Transfer: A donation to a monastery and the transfer of merit to the mother, with caveats about the non-identity of the giver and receiver.
     - Clause 7: No-Contest Clause: Penalty for anyone who contests the will by asserting a self.
     - Clause 8: Attestation: Witnesses attest to the presence and sound mind of the designated continuum.
     - Clause 9: Special Provisions: What if the causal continuum branches (rebirth) or if nibbana is attained? How does that affect the estate?
     - Closing: Date and signatures.

  We must avoid the word "I" without qualification. Replace with "the causal continuum currently designated as [Name]" or similar, but that becomes cumbersome. Instead, we can use "I" but in quotes and with a footnote every time? Or perhaps use "I" and then define it as a conventional designation at the beginning.

  Alternatively, we can use "the Testator" throughout, but define the Testator as a conventional designation.

  Let's draft.

  Note: The testator's name is to be inserted as [Full Name]. We'll call him "John Doe" for the example.

  Cover Letter:

