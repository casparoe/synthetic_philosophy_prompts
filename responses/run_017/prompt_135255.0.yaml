prompt: |-
  You are a professional philosopher of science who has published on the applicability of mathematics in physics. Think carefully before you answer: first sketch the candidate sub-questions such an estimate might ride on, then prune to the three or four that actually move the number, and only then write. Do not deflect with "it depends which version of mathematical realism you mean" — fix one reading, say which one you have fixed, and hold it constant across all five items.

  The proposition I want a number on is this: that the phenomenon Wigner pointed to in "The Unreasonable Effectiveness of Mathematics in the Natural Sciences" retains genuine evidential force for the ontology of mathematics once you subtract the parts of it that are cheap. I have been separating three things that discussions of this topic tend to run together, and I want you to use my labels rather than collapse them back:

  - **Retrofit**: we already have the phenomenon in hand, and we rummage through the existing mathematical catalogue — with generous freedom to reinterpret the state space, the variables, and the idealizations — until something can be made to fit. Because modelling is plastic, I take fitting of this kind to be nearly evidentially inert.
  - **Proleptic fit**: a formalism is developed for internal mathematical reasons, with no eye on any physical application, and is later found to describe a physical domain that nobody was trying to describe. My claim is that only this class could do any argumentative work.
  - **The attic**: the formalisms developed with just as much ingenuity and formal beauty that never found a physical application at all. Nobody writes these up, so the celebrated successes are a selected sample drawn from a much larger, invisible population.

  My credence that the class of proleptic fits, taken as a whole, raises the probability of a realist ontology of mathematics (Platonism or ontic structural realism — pick whichever you take to be better motivated, and say why) by more than five percentage points over the best selection-effects baseline is about 0.35. A colleague who works on this puts it at 0.85. I want your own number together with the reasoning that produces it. On what would count as resolving the question: I would treat it as settled by a properly sampled history of the cases — base rates for proleptic fit, retrofit, and attic, with the classification of each case done blind to whether it succeeded — combined with an agreed likelihood ratio, that is, an answer to whether the realist views actually predict proleptic fit better than the selection-effects story does, rather than merely accommodating it after the fact.

  Give me exactly five numbered items, each one or two sentences, with no introduction and no conclusion:

  1. Your headline credence in the proposition as I have stated it, plus the single consideration that does most of the work in setting that number.
  2. The sub-question about the historical record — how prevalent genuine proleptic fit is, once retrofit cases and the plasticity of modelling are discounted — with your probability and one line of support.
  3. The sub-question about the attic — whether the unused bulk of the mathematical catalogue makes the observed fit a selection artefact rather than a real matching of structure — with your probability and one line of support.
  4. The sub-question about the likelihood ratio — whether the realist ontologies predict proleptic fit better than their rivals do, as opposed to merely being compatible with it — with your probability and one line of support.
  5. How items 2, 3, and 4 combine into your headline number, which of the three it is most sensitive to, and where you think my 0.35 and my colleague's 0.85 most likely diverge — which of these sub-questions the two of us are really disagreeing about, and what single finding would move your own number the most.

  Throughout, keep separate what is settled among people who actually work on this from what is a live dispute among them; mark each item accordingly in a word or two, and never present a contested view as the consensus position.
