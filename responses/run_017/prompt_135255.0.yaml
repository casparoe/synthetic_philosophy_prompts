  2.  **Prevalence of genuine proleptic fit: P(High) ≈ 0.20.** Rigorous historical analysis suggests many celebrated "proleptic" cases involve significant retrospective reinterpretation (e.g., group theory's application evolved far beyond initial abstract conceptions); pure instances meeting your strict criteria are rarer than often assumed. *(Live dispute)*
  3.  **Attic's weakening effect: P(Substantial) ≈ 0.85.** The sheer volume and continuous generation of mathematics with no physical application is well-documented (e.g., vast tracts of pure set theory, number theory), making the success of *any* specific formalism appear increasingly like a selection effect absent a realist prediction mechanism. *(Near consensus)*
  4.  **Likelihood ratio favoring realism: P(Realist Advantage) ≈ 0.40.** Ontic Structural Realism (OSR - chosen as it avoids Platonism's abstract objects while capturing structural matches) predicts pre-existing structural harmonies, but anti-realists effectively counter that mathematics' adaptability (as a human tool) explains retrospective "fits" just as well, blurring predictive advantage. *(Live dispute)*
  5.  **Combination & Sensitivity:** My 0.65 integrates low proleptic prevalence (2: weakens evidence), strong attic effect (3: weakens evidence), and ambiguous likelihood (4: slight realist edge). It's most sensitive to the attic (3). Your 0.35 vs. colleague's 0.85 likely diverges most sharply on prevalence (2) – you see proleptic fit as very rare, your colleague as common. The single finding moving my number most: a blind-classified historical registry quantifying the base rate of *bona fide* proleptic fit.
