answer: |-
  ## The Perfectly Wrong Answer

  The radiator hissed like a disgruntled cat, punctuating the silence of the cramped annotation hub. Outside, a persistent Manchester drizzle blurred the grey street. Inside, Arthur stared at his screen, his tenth cup of tea going cold beside a half-eaten custard cream. Twelve simple line drawings mocked him. Six on the left, six on the right. Bongard Puzzle #4713.

  *Left Side:*
  1.  A large circle containing a small square.
  2.  A large triangle containing a small circle.
  3.  A large pentagon containing a small star.
  4.  A large rectangle containing a small triangle.
  5.  A large diamond containing a small circle.
  6.  A large oval containing a small square.

  *Right Side:*
  1.  A large circle *next to* a small square.
  2.  A large triangle *overlapping* a small circle (but not containing it).
  3.  A large pentagon with a small star *outside* it.
  4.  A small triangle *containing* a large rectangle (impossible fit, lines crossed messily).
  5.  A large diamond *touching* a small circle at a point.
  6.  A large oval with a small square floating freely above it.

  Arthur tapped his pen. Simple. Obvious. The rule practically screamed at him. "Right then," he muttered, typing into the annotation field: **"Rule: Left side shows shapes where a smaller shape is completely enclosed within a larger shape. Right side shows shapes where this enclosure does not occur."**

  Technically flawless. Every left image had clear containment. Every right image lacked it – adjacency, overlap, external placement, or impossible reversal. He hit ‘Submit’. Another puzzle ticked off. Efficient. Accurate. Boring.

  Across the aisle, Shazia sighed, a long, weary sound. "Another containment puzzle, Arthur?"

  "Seems so. Textbook case." Arthur reached for his cold tea.

  "Textbook?" Shazia swivelled her chair. "Look at the *mess* on the right. Number four? That ‘small triangle containing a large rectangle’? It’s just scribbled lines crossing. It’s not *trying* to be a proper shape containing another; it’s deliberately chaotic. And look at the left – every single one is perfectly neat, the small shape dead centre. Like it was drawn *to demonstrate* containment."

  Arthur frowned. "Well, yes. That’s the point. They demonstrate the rule."

  "But *how*?" Shazia leaned forward, her eyes intense. "Did the setter *start* with ‘containment’ and then draw six perfect examples? Or did they sift through a pile of random shape doodles – scribbles, overlaps, tangles – and just *pick out* any six where, by pure chance, a small shape happened to be neatly inside a large one?"

  Arthur paused, the custard cream halfway to his mouth. "Does it matter? The rule fits."

  "It changes *everything*!" Shazia insisted. "If they drew them *to* the rule, then neatness, centring, clarity – they’re *part* of the evidence. The rule isn't just 'containment exists', it's 'containment is the *intended, primary feature*'. The right side isn't just 'not contained', it's actively *avoiding* neat containment, showing alternatives. But if they just *found* six contained pairs in a random pile... well, then the rule is purely the geometric fact of enclosure, regardless of neatness or centring. The right side could just be *anything else* from the pile that wasn't contained."

  Arthur stared back at his screen. His rule still held: Left = Contained, Right = Not Contained. Clean separation. But Shazia’s words wormed in. The *immaculate* presentation on the left. The deliberate *mess* and *variety* of non-containment on the right – not just absence, but *different kinds* of failure. It looked... *constructed*. Purposeful. Like the setter had a concept first and crafted examples to illuminate it.

  His perfectly correct answer suddenly felt hollow. Technically right, but... blind. He hadn't just been guessing the geometric rule; he'd failed utterly at guessing *the rule the setter was likely playing by*. He’d treated it like finding a pattern in random data, not interpreting a deliberate communication.

  "What if..." Arthur said slowly, "...the *real* rule isn't just 'containment', but... 'the smaller shape is the intentional focus *within* the larger boundary'? That the larger shape acts as a deliberate frame or container?"

  Shazia nodded vigorously. "Exactly! Then the right side isn't just 'not contained', it’s showing *distractions* – adjacency, overlap, impossible size reversals, messy lines. The rule is about *purposeful enclosure as the compositional point*. Your answer isn't *wrong*... it's just... shallow. It misses why these specific twelve images were chosen *together*. You solved the geometry, but not the puzzle."

  Arthur slumped. He imagined the setter, hunched over a tablet, carefully centring that small circle inside the large triangle, *thinking* about framing and focus. Then deliberately drawing the messy tangle of the ‘small’ triangle engulfing the large rectangle, chuckling at the absurdity. The images weren't neutral data; they were *traces of intention*.

  His earlier submissions scrolled through his mind. How many times had he given the bare geometric minimum? Marking answers wrong that technically separated the sides but felt... off? Had he been rejecting people who *were* "reading the setter", who grasped the implied *kind* of rule – one based on compositional intent, not just spatial coincidence?

  The radiator gave another aggressive hiss. Arthur deleted his submission. He typed slowly, painfully aware of the custard cream dissolving into crumbs on his keyboard.

  **"Rule: Left side images are composed with the deliberate intent of depicting a smaller shape as the primary focus, cleanly and entirely enclosed within a larger boundary shape. Right side images depict relationships where this specific compositional intent is absent or subverted, through adjacency, overlap, external placement, size reversal, or messy execution."**

  It was clunky. It wasn't pure geometry. But it felt true to the ghosts in the lines.

  "Reading the setter," Shazia murmured, reading over his shoulder. "That's the layer they never briefed us on, isn't it? Seeing the hand behind the shapes."

  Arthur hit ‘Submit’ again, a knot of anxiety tightening in his chest. He had a horrible feeling he’d been marking perfectly decent answers wrong for weeks. He also had a horrible feeling he finally understood why. Outside, the Manchester rain kept falling, indifferent to the tiny dramas of containment and intent unfolding in the glow of the monitors. He picked up his cold tea. It tasted like regret. And possibly soggy biscuit.
