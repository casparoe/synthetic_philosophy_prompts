  ### Exam Question: Social Choice with Quasi-Transitive Social Preferences

  **Context:** Consider a society with a set of voters \(N = \{1, 2, \dots, n\}\) where \(n \geq 2\), and a set of alternatives \(A\) with \(|A| \geq 3\). Each voter \(i\) has a *strict preference ordering* \(P_i\) over \(A\): a complete, transitive, and antisymmetric binary relation (no indifference between any two distinct alternatives). A *profile* \(\mathbf{P} = (P_1, P_2, \dots, P_n)\) specifies a strict preference ordering for each voter.  

  A *social welfare function (SWF)* is a function \(f\) that maps each profile \(\mathbf{P}\) to a social preference relation \(R = f(\mathbf{P})\) over \(A\). We impose the following conditions on \(f\):  
  1. **Unrestricted Domain (UD):** The domain of \(f\) is all possible profiles \(\mathbf{P}\).  
  2. **Weak Pareto (WP):** For any \(x, y \in A\), if every voter \(i\) strictly prefers \(x\) to \(y\) (i.e., \(x P_i y\) for all \(i\)), then society strictly prefers \(x\) to \(y\) (i.e., \(x P y\), where \(x P y\) means \(x R y\) and not \(y R x\)).  
  3. **Binary Independence of Irrelevant Alternatives (IIA):** For any \(x, y \in A\), the social preference between \(x\) and \(y\) depends only on the individual preferences between \(x\) and \(y\). Formally, if two profiles \(\mathbf{P}\) and \(\mathbf{P}'\) agree on the rankings of \(x\) and \(y\) for every voter (i.e., \(x P_i y\) iff \(x P_i' y\), and \(y P_i x\) iff \(y P_i' x\)), then \(f(\mathbf{P})\) and \(f(\mathbf{P}')\) agree on \(x\) and \(y\).  
  4. **Quasi-Transitive Social Preference (QT):** For every profile \(\mathbf{P}\), the social preference relation \(R\) is:  
     - **Complete:** For any \(x, y \in A\), either \(x R y\) or \(y R x\) (or both, indicating indifference).  
     - **Quasi-transitive:** The strict part \(P\) (defined by \(x P y\) iff \(x R y\) and not \(y R x\)) is transitive. Note: The indifference relation \(I\) (defined by \(x I y\) iff \(x R y\) and \(y R x\)) may be intransitive.  

  Arrow’s theorem states that if \(R\) is required to be fully transitive (i.e., both strict and indifference parts transitive), then a dictator exists. Here, we relax full transitivity to QT.  

  **(a) (5 points)** Show that there exists a non-dictatorial SWF satisfying UD, WP, IIA, and QT. Define your SWF explicitly and verify all four conditions.  

  **(b) (10 points)** Prove that any SWF satisfying UD, WP, IIA, and QT must be of the following form: There exists a fixed non-empty coalition \(M \subseteq N\) (an "oligarchy") such that for any profile \(\mathbf{P}\) and any \(x, y \in A\):  
  - \(x P y\) if and only if every voter in \(M\) strictly prefers \(x\) to \(y\) (i.e., \(x P_i y\) for all \(i \in M\)).  
  - Otherwise, society is indifferent between \(x\) and \(y\) (i.e., \(x I y\)).  

  *Hint:* A coalition \(C \subseteq N\) is *decisive for \(x\) against \(y\)* if whenever all voters in \(C\) prefer \(x\) to \(y\) and all outside \(C\) prefer \(y\) to \(x\), then \(x P y\).  

  **(c) (5 points)** Discuss the implications of QT for social choice:  
  (i) In a finite set of alternatives, is there always a non-empty set of maximal elements (i.e., alternatives \(x\) such that no \(y\) satisfies \(y P x\))? Can there be multiple maximal elements? Explain.  
  (ii) Can the social preference relation \(R\) be represented by a utility function \(u: A \to \mathbb{R}\) (where \(x R y\) iff \(u(x) \geq u(y)\))? Why or why not?  
  (iii) Consider sequential pairwise majority voting with a fixed agenda (e.g., compare alternatives in a predefined order, with the winner advancing). Could intransitive indifference lead to problems in determining a winner? Explain.  

  **(d) (3 points)** A student claims that full transitivity can be restored by modifying the SWF from part (a) as follows: Use the unanimity rule for strict preferences, but whenever society is indifferent (i.e., not unanimous), break ties using a fixed strict ordering \(\succ\) of \(A\) (e.g., if \(x \succ y\), then \(x P y\)). They argue this defines a complete, transitive SWF. Show that this modified SWF violates IIA.  

  **(e) (2 points)** Suppose we add **Anonymity**: For any profile \(\mathbf{P}\) and any permutation \(\sigma\) of \(N\), \(f(\mathbf{P}) = f(\mathbf{P} \circ \sigma)\) (i.e., the social preference depends only on voters' preferences, not their identities). What does the characterization in (b) become? Explain.  

  ---

  ### Model Answer  
  **(a)** Define the SWF as follows: For any profile \(\mathbf{P}\) and any \(x, y \in A\),  
  - \(x P y\) if and only if every voter \(i \in N\) strictly prefers \(x\) to \(y\) (i.e., \(x P_i y\) for all \(i\)).  
  - Otherwise, \(x I y\) (society is indifferent).  

  **Verification:**  
  - **UD:** The SWF is defined for all profiles.  
  - **WP:** If all voters prefer \(x\) to \(y\), then \(x P y\) by definition, satisfying WP.  
  - **IIA:** The social preference between \(x\) and \(y\) depends only on whether all voters agree on \(x\) vs. \(y\). If they do, \(x P y\); else, \(x I y\). This depends solely on individual \(x\)-\(y\) rankings.  
  - **QT:**  
    - *Completeness:* For any \(x, y\), if all prefer \(x\) to \(y\), \(x P y\); if all prefer \(y\) to \(x\), \(y P x\); otherwise, \(x I y\). Thus, \(x R y\) or \(y R x\) always holds.  
    - *Quasi-transitivity (transitivity of \(P\)):* Suppose \(x P y\) and \(y P z\). Then all voters prefer \(x\) to \(y\), and all prefer \(y\) to \(z\). By transitivity of individual preferences, all prefer \(x\) to \(z\), so \(x P z\).  
  - **Non-dictatorial:** If two voters disagree on \(x\) vs. \(y\) (e.g., voter 1 prefers \(x\) to \(y\), voter 2 prefers \(y\) to \(x\)), then society is indifferent, so no single voter dictates strict preferences.  

  **(b)** We prove the characterization step by step.  

  **Step 1: Existence and global decisiveness of coalitions.**  
  By WP, \(N\) is decisive for all pairs (if all prefer \(x\) to \(y\), then \(x P y\)). Let \(C\) be decisive for some pair \((x,y)\). We show \(C\) is globally decisive (decisive for all pairs).  
  - Consider alternatives \(a,b\) and a profile where:  
    - Voters in \(C\) rank \(a, x, y, b\) as \(a P_i x P_i y P_i b\).  
    - Voters not in \(C\) rank \(y, b, a, x\) as \(y P_i b P_i a P_i x\).  
  - Since \(C\) is decisive for \((x,y)\), and in \(C\): \(x P_i y\), outside \(C\): \(y P_i x\), we have \(x P y\).  
  - All voters prefer \(a\) to \(x\) (in \(C\): \(a P_i x\); outside: \(a P_i x\)), so by WP, \(a P x\).  
  - All prefer \(y\) to \(b\) (in \(C\): \(y P_i b\); outside: \(y P_i b\)), so by WP, \(y P b\).  
  - By QT (\(P\) transitive), \(a P x\) and \(x P y\) imply \(a P y\). Also, \(y P b\) implies \(a P b\) (since \(a P y\) and \(y P b\)).  
  - In this profile, voters in \(C\) prefer \(a\) to \(b\), while others prefer \(b\) to \(a\). By IIA, \(a P b\) whenever this preference pattern occurs. Thus, \(C\) is decisive for \((a,b)\).  

  **Step 2: Closure under intersection.**  
  Let \(C_1, C_2\) be decisive. We show \(C_1 \cap C_2\) is decisive. Consider alternatives \(x,y,z\) and a profile:  
  - Voters in \(C_1 \cap C_2\): \(x P_i y P_i z\).  
  - Voters in \(C_1 \setminus C_2\): \(y P_i z P_i x\).  
  - Voters in \(C_2 \setminus C_1\): \(z P_i x P_i y\).  
  - Voters in neither: \(y P_i z P_i x\).  
  Since \(C_1\) is decisive and all in \(C_1\) prefer \(y\) to \(z\) (in \(C_1 \cap C_2\): \(y P_i z\); in \(C_1 \setminus C_2\): \(y P_i z\)), while outside \(C_1\) prefer \(z\) to \(y\) (in \(C_2 \setminus C_1\) and neither: \(z P_i y\)), we have \(y P z\). Since \(C_2\) is decisive and all in \(C_2\) prefer \(x\) to \(y\) (in \(C_1 \cap C_2\): \(x P_i y\); in \(C_2 \setminus C_1\): \(x P_i y\)), while outside \(C_2\) prefer \(y\) to \(x\) (in \(C_1 \setminus C_2\): \(y P_i x\); in neither: \(y P_i x\)), we have \(x P y\). By QT, \(x P y\) and \(y P z\) imply \(x P z\). In this profile, only voters in \(C_1 \cap C_2\) prefer \(x\) to \(z\); others prefer \(z\) to \(x\). By IIA, \(x P z\) whenever \(C_1 \cap C_2\) unanimously prefers \(x\) to \(z\) and others prefer \(z\) to \(x\), so \(C_1 \cap C_2\) is decisive for \((x,z)\), hence globally decisive.  

  **Step 3: Minimal decisive coalition \(M\).**  
  The family of decisive coalitions is non-empty (contains \(N\)) and closed under intersection. Let \(M\) be the intersection of all decisive coalitions. Since \(N\) is finite, \(M\) is non-empty and decisive (as intersections preserve decisiveness). \(M\) is minimal: No proper subset is decisive (if \(S \subsetneq M\) were decisive, then \(S\) would be in the intersection defining \(M\), contradicting minimality).  

  **Step 4: Members of \(M\) have veto power.**  
  Suppose, for contradiction, that \(i \in M\) prefers \(x\) to \(y\), but \(y P x\) socially. Consider a profile where:  
  - \(i\) prefers \(x\) to \(y\).  
  - All others prefer \(y\) to \(x\).  
  Then \(y P x\). By IIA, whenever all others prefer \(y\) to \(x\) and \(i\) prefers \(x\) to \(y\), we have \(y P x\). Thus, \(N \setminus \{i\}\) is decisive. But \(N \setminus \{i\}\) does not contain \(i \in M\), contradicting minimality of \(M\). Hence, if \(i \in M\) prefers \(x\) to \(y\), then not \(y P x\) (i.e., \(x R y\)).  

  **Step 5: Characterization.**  
  - If all in \(M\) prefer \(x\) to \(y\), then since \(M\) is decisive, \(x P y\).  
  - If not all in \(M\) prefer \(x\) to \(y\), then either:  
    - Some in \(M\) prefer \(y\) to \(x\): By veto power, not \(x P y\) and not \(y P x\) (since if \(y P x\), then all in \(M\) must prefer \(y\) to \(x\), contradiction). Thus, \(x I y\).  
    - No strict preference conflict in \(M\) (but by completeness, \(x I y\) holds).  
  Thus, \(x P y\) iff all in \(M\) prefer \(x\) to \(y\); otherwise, \(x I y\).  

  **(c)**  
  (i) **Maximal elements:** Since \(P\) is transitive (by QT), it is acyclic. In a finite set, a maximal element always exists (start with any alternative; if dominated, move to a dominator; acyclicity prevents cycles and ensures termination). There can be multiple maximal elements if society is indifferent between them (e.g., two alternatives \(x, y\) with \(x I y\), so neither \(x P y\) nor \(y P x\)).  
  (ii) **Utility representation:** No, because indifference may be intransitive. Example: Suppose \(x I y\), \(y I z\), but \(x P z\) (if \(M\) is split on \(x,y\) and \(y,z\) but unanimous on \(x,z\)). A utility function requires \(u(x) = u(y)\), \(u(y) = u(z)\), so \(u(x) = u(z)\), implying \(x I z\), contradicting \(x P z\).  
  (iii) **Sequential pairwise voting:** Intransitive indifference may cause problems. Example: Suppose \(x I y\), \(y I z\), but \(x P z\). If the agenda is \(x\) vs. \(y\), then \(z\) vs. winner:  
  - First, \(x\) vs. \(y\): Indifference. If the tie-break picks \(x\), then \(x\) vs. \(z\): \(x P z\), so \(x\) wins.  
  - If tie-break picks \(y\), then \(y\) vs. \(z\): Indifference. If tie-break picks \(z\), then \(z\) wins. But \(x P z\), so \(z\) is not maximal. Thus, arbitrary tie-breaking can select non-maximal alternatives.  

  **(d)** Modified SWF:  
  - If all voters prefer \(x\) to \(y\), then \(x P y\).  
  - Else, if \(x \succ y\) in the fixed order, then \(x P y\); else \(y P x\).  

  This violates IIA. Consider two profiles over \(A = \{x, y, z\}\) with fixed order \(x \succ y \succ z\):  
  - **Profile 1:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(y P_2 z P_2 x\).  
    - \(x\) vs. \(y\): Not unanimous; fixed order \(x \succ y \Rightarrow x P y\).  
    - \(y\) vs. \(z\): Both prefer \(y\) to \(z \Rightarrow y P z\) (unanimity).  
    - \(x\) vs. \(z\): Both prefer \(x\) to \(z \Rightarrow x P z\) (unanimity).  
  - **Profile 2:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(z P_2 x P_2 y\).  
    - \(x\) vs. \(y\): Not unanimous; fixed order \(x \succ y \Rightarrow x P y\) (same as Profile 1).  
    - \(y\) vs. \(z\): Voter 1: \(y P_1 z\), Voter 2: \(z P_2 y\). Not unanimous; fixed order \(y \succ z \Rightarrow y P z\).  
    - \(x\) vs. \(z\): Voter 1: \(x P_1 z\), Voter 2: \(z P_2 x\). Not unanimous; fixed order \(x \succ z \Rightarrow x P z\).  

  In both profiles, individual preferences on \(x\) and \(y\) are identical: Voter 1 prefers \(x\) to \(y\), Voter 2 prefers \(y\) to \(x\) in Profile 1, but in Profile 2, Voter 2 prefers \(z\) to \(x\) and \(x\) to \(y\), so still prefers \(x\) to \(y\)? Correction for Profile 2: To have the same \(x\)-\(y\) rankings, Voter 2 must have \(y P_2 x\) (as in Profile 1). Revised Profile 2:  
  - Voter 1: \(x P_1 y P_1 z\) (same as Profile 1).  
  - Voter 2: \(y P_2 z P_2 x\) (same as Profile 1).  
  But this is identical to Profile 1. To violate IIA, we need the same individual \(x\)-\(y\) rankings but different social outcomes. Fix:  
  - **Profile 1:** As above.  
  - **Profile 2:** Voter 1: \(x P_1 z P_1 y\), Voter 2: \(y P_2 x P_2 z\) (so \(x\)-\(y\) rankings: Voter 1: \(x P_1 y\), Voter 2: \(y P_2 x\) — same as Profile 1).  
    - \(x\) vs. \(y\): Not unanimous; fixed order \(x \succ y \Rightarrow x P y\) (same as Profile 1).  
    - \(x\) vs. \(z\): Voter 1: \(x P_1 z\), Voter 2: \(x P_2 z \Rightarrow x P z\) (unanimity).  
    - \(y\) vs. \(z\): Voter 1: \(z P_1 y\), Voter 2: \(y P_2 z\). Not unanimous; fixed order \(y \succ z \Rightarrow y P z\).  
  Now, in both profiles, individual \(x\)-\(y\) rankings are identical (Voter 1: \(x\) over \(y\), Voter 2: \(y\) over \(x\)), and social preference is \(x P y\) in both. But IIA is not violated here.  

  **Correct approach:** To violate IIA, use profiles where \(x\)-\(y\) rankings are identical, but social \(x\)-\(y\) differs. Define:  
  - **Profile A:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(z P_2 x P_2 y\) (so \(x\)-\(y\): Voter 1: \(x P_1 y\), Voter 2: \(x P_2 y\)? Wait, Voter 2: \(z P_2 x P_2 y \Rightarrow x P_2 y\)). Then:  
    - \(x\) vs. \(y\): Both prefer \(x\) to \(y \Rightarrow x P y\) (unanimity).  
  - **Profile B:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(y P_2 z P_2 x\) (so \(x\)-\(y\): Voter 1: \(x P_1 y\), Voter 2: \(y P_2 x\)).  
    - \(x\) vs. \(y\): Not unanimous; fixed order (say \(x \succ y\)) \(\Rightarrow x P y\).  
  Same social outcome.  

  **Actual counterexample:**  
  Set fixed order \(z \succ x \succ y\).  
  - **Profile 1:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(y P_2 z P_2 x\).  
    - \(x\) vs. \(y\): Voter 1: \(x P_1 y\), Voter 2: \(y P_2 x\). Not unanimous; fixed order \(x \succ y \Rightarrow x P y\).  
  - **Profile 2:** Voter 1: \(x P_1 y P_1 z\), Voter 2: \(x P_2 z P_2 y\) (same \(x\)-\(y\) rankings: Voter 1: \(x P_1 y\), Voter 2: \(x P_2 y\)).  
    - \(x\) vs. \(y\): Unanimous for \(x \Rightarrow x P y\).  
  Same social outcome.  

  **Correct violation:** The student's claim is wrong because the modified SWF may violate QT (not IIA). For part (d), we show QT violation.  
  **Counterexample for QT:** Fixed order \(x \succ y \succ z\). Profile: Voter 1: \(z P_1 x P_1 y\), Voter 2: \(y P_2 z P_2 x\).  
  - \(x\) vs. \(y\): Voter 1: \(x P_1 y\), Voter 2: \(y P_2 x\). Not unanimous; fixed order \(x \succ y \Rightarrow x P y\).  
  - \(y\) vs. \(z\): Voter 1: \(z P_1 y\), Voter 2: \(y P_2 z\). Not unanimous; fixed order \(y \succ z \Rightarrow y P z\).  
  - \(x\) vs. \(z\): Voter 1: \(z P_1 x\), Voter 2: \(z P_2 x\). Unanimous for \(z \Rightarrow z P x\).  
  Thus, \(x P y\), \(y P z\), \(z P x\), violating transitivity of \(P\) (a cycle).  

  **(e)** Anonymity requires symmetric treatment of voters. The oligarchy \(M\) must be invariant under voter permutations. The only non-empty subsets invariant under all permutations are \(M = N\) (all voters) or (trivially) singletons, but if \(M\) is a singleton, it violates anonymity (a dictator is not anonymous). Thus, \(M = N\), and the SWF is the unanimity rule from (a): \(x P y\) iff all voters prefer \(x\) to \(y\); otherwise, \(x I y\).  

