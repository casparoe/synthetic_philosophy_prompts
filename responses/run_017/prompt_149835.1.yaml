  ### Marking Scheme (Total: 25 points)  
  **General Notes:**  
  - Definitions must be used as provided; no external references.  
  - Common mistakes:  
    - Conflating "not an ordering" with incompleteness (e.g., claiming QT allows undetermined pairs).  
    - Asserting "Arrow’s theorem is only about transitivity of indifference" without proof.  
    - Reciting the standard Arrow proof and replacing "dictator" with "oligarchy" but failing to adjust for QT (e.g., assuming the field expansion lemma holds identically).  

  **Part (a) (5 points):**  
  - 2 pts: Correct SWF definition (unanimity rule: \(x P y\) iff all voters agree; else \(x I y\)).  
  - 1 pt: Verifies UD, WP, IIA (explicitly states why each holds).  
  - 2 pts: Verifies QT (completeness and transitivity of \(P\) with valid reasoning).  
  - *Common mistake:* Claims the SWF is transitive (it is not; indifference is intransitive, but that is allowed).  

  **Part (b) (10 points):**  
  - 2 pts: Shows that if a coalition is decisive for one pair, it is decisive for all pairs (using a profile, WP, IIA, QT).  
  - 3 pts: Proves decisive coalitions are closed under intersection (constructs a valid profile and uses QT).  
  - 2 pts: Defines \(M\) (minimal decisive coalition) and shows it is decisive/non-empty.  
  - 2 pts: Shows veto power for members of \(M\) (by contradiction and minimality).  
  - 1 pt: Completes characterization (\(x P y\) iff all in \(M\) prefer it; else indifference).  
  - *Common mistakes:*  
    - Assumes the standard extraction lemma without checking QT (e.g., uses a profile that requires transitive indifference).  
    - Omits the intersection step or uses an invalid profile.  
    - Concludes \(M\) is a dictator (ignoring oligarchy).  

  **Part (c) (5 points):**  
  - (i) 2 pts: States maximal elements always exist (due to acyclic \(P\)) and can be multiple (due to indifference).  
  - (ii) 1 pt: States no utility representation (because indifference may be intransitive), with brief justification.  
  - (iii) 2 pts: Explains that sequential voting with tie-breaking may select non-maximal elements (e.g., due to intransitive indifference and arbitrary tie-breaking).  
  - *Common mistake:* Claims sequential voting always finds a maximal element.  

  **Part (d) (3 points):**  
  - 3 pts: Provides a counterexample showing a cycle in \(P\) (e.g., \(x P y\), \(y P z\), \(z P x\)) under the modified rule, violating QT. Must specify profile, fixed order, and social preferences.  
  - *Common mistake:* Tries to show IIA violation (which is not required; the flaw is in QT).  

  **Part (e) (2 points):**  
  - 2 pts: States that anonymity implies \(M = N\) (unanimity rule), with justification (only \(N\) is permutation-invariant).  
  - *Common mistake:* Claims \(M\) must be a singleton (violating anonymity).  

  ### A/B Grade Boundary  
  - **B (15–18/25):** Correct on (a), partially correct on (b) (e.g., proves decisiveness and veto power but misses intersection), basic answers for (c), one part of (d) or (e). May have minor errors or gaps.  
  - **A (19–25/25):** Fully correct on (a), (b) (rigorous proof), (d), (e); insightful on (c) (e.g., clear examples). No major gaps; handles QT nuances throughout.
