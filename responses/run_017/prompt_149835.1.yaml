  We are designing an exam question for a social choice course. The goal is to explore a weakening of Arrow's conditions: specifically, we replace the requirement that the social preference is complete and transitive with the requirement that it is complete and quasi-transitive (i.e., the strict part is transitive, but indifference may be intransitive). We want to see if Arrow's impossibility still holds, and if not, to characterize the possible rules.

  The question should be self-contained, including all definitions. We also want to guide the students through the implications of having intransitive indifference, and to consider what properties we can salvage. Additionally, we want to avoid having students simply recite the standard Arrow proof with minor modifications.

  We'll break the question into parts:

  Part (a): Ask for a counterexample to show that the impossibility does not hold under quasi-transitivity. The counterexample we have in mind is the unanimity rule with universal indifference otherwise, or more generally, the rule that requires a fixed coalition to be unanimous for strict preference.

  Part (b): Ask for a characterization of all social welfare functions satisfying the conditions (unrestricted domain, Pareto, IIA, and quasi-transitive social preference). We expect the answer to be that a fixed coalition M (an oligarchy) must be decisive for every pair, and that strict preference occurs exactly when every member of M strictly prefers.

  Part (c): Discuss the implications of intransitive indifference. For example, in finite sets, we can still have maximal elements, but they might not be unique. Also, representation by a utility function is not generally possible (because of intransitive indifference) but we can have a representation by a set of utility functions (like in the case of interval orders) or by ordered indifference classes? Also, sequential pairwise choice might cycle in the indifference part? We want the students to think about the practical consequences.

  Part (d): Consider a student who tries to restore transitivity by adding a fixed tie-breaking order. We want to show that this violates IIA.

  Part (e): If we also require anonymity, then what happens? Since anonymity requires that the rule is symmetric in voters, the only possibility is that the fixed coalition M must be the entire set of voters. So we get back the unanimity rule.

  Now, we write the question accordingly.

  ---

  **Question:**

  Consider a society with a set of voters \(N = \{1, 2, \dots, n\}\) with \(n \geq 2\), and a set of alternatives \(A\) with \(|A| \geq 3\). Each voter \(i\) has a strict preference ordering \(P_i\) over \(A\): a complete, transitive, and antisymmetric binary relation (so no indifference). Let \(\mathcal{P}\) be the set of all possible strict preference orderings over \(A\). A profile \(\mathbf{P} = (P_1, \dots, P_n)\) is an element of \(\mathcal{P}^n\).

  A social welfare function (SWF) is a function \(f\) that assigns to every profile \(\mathbf{P}\) a social preference relation \(R = f(\mathbf{P})\) over \(A\). We consider the following conditions on the SWF:

  1. **Unrestricted Domain (UD)**: The domain of \(f\) is all of \(\mathcal{P}^n\).

  2. **Weak Pareto (WP)**: For any two alternatives \(x, y \in A\), if every voter strictly prefers \(x\) to \(y\) (i.e., \(x P_i y\) for all \(i\)), then the social preference must strictly prefer \(x\) to \(y\) (i.e., \(x P y\), meaning \(x R y\) and not \(y R x\)).

  3. **Binary Independence of Irrelevant Alternatives (IIA)**: For any two alternatives \(x, y \in A\), the social preference between \(x\) and \(y\) depends only on the individual preferences between \(x\) and \(y\). Formally, for any two profiles \(\mathbf{P}\) and \(\mathbf{P}'\), if for every voter \(i\) the ranking of \(x\) and \(y\) is the same in \(P_i\) and \(P_i'\), then the social preference between \(x\) and \(y\) must be the same in \(f(\mathbf{P})\) and \(f(\mathbf{P}')\).

  4. **Quasi-Transitive Social Preference (QT)**: For every profile \(\mathbf{P}\), the social preference relation \(R\) is complete (for any \(x,y \in A\), either \(x R y\) or \(y R x\) or both) and quasi-transitive, meaning that the strict part \(P\) (defined by \(x P y\) if \(x R y\) and not \(y R x\)) is transitive. Note that the indifference part (defined by \(x I y\) if \(x R y\) and \(y R x\)) need not be transitive.

  Recall that Arrow's theorem states that if we require the social preference to be complete and transitive (a full ordering) then the above conditions (with transitivity) force a dictatorship. Here, we relax the transitivity requirement to quasi-transitivity.

  (a) (5 points) Show that there exist non-dictatorial SWFs satisfying UD, WP, IIA, and QT. Specifically, define one such SWF and verify that it satisfies these conditions.

  (b) (10 points) An SWF satisfying UD, WP, IIA, and QT must be of the following form: there exists a fixed non-empty coalition \(M \subseteq N\) (called an "oligarchy") such that for any profile and any two alternatives \(x,y\):

  - \(x P y\) if and only if every member of \(M\) strictly prefers \(x\) to \(y\) (i.e., \(x P_i y\) for all \(i \in M\)).

  - Otherwise, \(x I y\) (i.e., society is indifferent between \(x\) and \(y\)).

  Prove this characterization. [Hint: You may want to use the concept of a decisive coalition. A coalition \(C\) is decisive for \(x\) against \(y\) if whenever every voter in \(C\) strictly prefers \(x\) to \(y\) and every voter not in \(C\) strictly prefers \(y\) to \(x\), then \(x P y\).]

  (c) (5 points) Discuss the implications of quasi-transitivity for social choice. In particular, consider:

  (i) How can we determine a "winner" (or maximal elements) in a finite set of alternatives? Is there always a non-empty set of maximal elements? Can there be more than one?

  (ii) Can the social preference relation be represented by a utility function? Why or why not?

  (iii) Consider the method of sequential pairwise majority voting with a fixed agenda. Could the social indifference being intransitive lead to problems? Explain.

  (d) (3 points) A student claims that we can restore full transitivity by modifying the SWF in part (a) as follows: use the unanimity rule for strict preferences, but break ties according to a fixed strict ordering of the alternatives. For example, if society is indifferent between \(x\) and \(y\), then we let the social preference follow a fixed order \(\succ\). So the new social preference is complete and transitive. Show that this modified SWF violates IIA.

  (e) (2 points) Suppose we add the condition of Anonymity: the social preference relation should be invariant under any permutation of the voters. What does the characterization in (b) then become? Explain.

  ---

