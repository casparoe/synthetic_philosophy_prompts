  But we have 75 minutes and 16 students. We need an activity that engages everyone and moves quickly.

  Alternative: A simple object that changes discretely and continuously. Example: a flagpole that is painted in sections (discrete change when a section is painted a new color) and also bends continuously (like in the wind). But bending might be too abstract.

