  We are designing a 75-minute in-class activity for an upper-level metaphysics seminar on persistence. The goal is to have students build a model of persistence through time that leads them to encounter the problems of change and identity in a concrete way, without using technical terms until the end. The activity should push them toward a perdurantist view, then show its instability, and then have them try to repair it with "chunk perdurantism," which then fails for continuous change. We also need to include the dismantled ship case as a diagnostic.

  Constraints: 
  - 16 students, 75 minutes.
  - Room with whiteboard and movable chairs. No AV.
  - Materials: only what can be printed or carried in a bag (so paper-based, perhaps some simple props).
  - No money for stakes.

  Design Principles:
  - Students build something (a model) and the cost of their choices becomes apparent in the model.
  - Avoid lecture and intuition polls. Use active construction and discovery.
  - Key terms (endurantism, perdurantism, chunk perdurantism) are withheld until the debrief.

  Intended Arc:
  1. Push students to adopt a perdurantist-like model to solve a problem (e.g., temporary intrinsics or part-change).
  2. Show instability in that model (e.g., arbitrary temporal parts).
  3. Push toward chunk perdurantism (temporal parts only when intrinsic properties are constant).
  4. Show failure of chunk perdurantism for continuous change (no maximal intervals of constancy).
  5. Diagnostic: Dismantled ship case to force commitments.

