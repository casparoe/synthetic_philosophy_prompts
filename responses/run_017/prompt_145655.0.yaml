     - Introduce the idea without the name: "What if we only divide the ship's history when there is a change in its properties? We group together times where the ship is qualitatively the same. Then we have chunks of time where the ship is unchanging."
     - Have them try to form chunks. They can group the cards into stacks for periods of constancy.
          - Plank set: 
               - t0-t2: constant (A,B,C) -> one chunk.
               - t3-t5: constant (D,B,C) -> one chunk.
               - t11-t15: constant (D,B,C) -> one chunk.
          - But what about the mast angle? In t0-t2, the angle is 0°, 10°, 20°. So it is changing. Therefore, if we require both properties to be constant, we cannot have a chunk longer than one time-slice.

     So they are forced to have instantaneous chunks? Or they might try to average the angle? But that's not the actual property.

     Part 6: Failure for continuous change (10 min)
     - Point out: "The mast is rotating continuously. That means that at every instant, the angle is different. So there is no period, however short, where the angle is constant. Therefore, there are no intervals of constancy for the mast angle. So how can we form chunks? We would have to break the history at every instant? That brings us back to the original perdurantism with instantaneous parts."

     Part 7: Debrief (15 min)
     - Now we introduce the terms: 
          - What they built first is perdurantism (with temporal parts at each instant).
          - The repair attempt is chunk perdurantism (temporal parts only during periods of constancy).
          - But chunk perdurantism fails for continuous change because there are no periods of constancy.
     - Map the moments: 
          - The initial model to solve change: perdurantism.
          - The grouping by constancy: chunk perdurantism.
          - The failure: continuous change means no constancy.
     - Diagnostic case: the dismantled ship.
          - Perdurantism: can say the ship is a four-dimensional object with two disconnected temporal parts (the two worms). It survives the gap.
          - Chunk perdurantism: if we only have chunks when the ship exists and is constant, then we have two chunks (t0-t5 and t11-t15) but they are not connected. But then are they the same ship? Chunk perdurantism doesn't by itself say they are the same, so we need an additional identity criterion.
          - Endurantism: the ship is wholly present at each time it exists. Then at t5 and t11, the ship is wholly present. But why is it the same ship? Because same planks? But then during the gap, the ship does not exist. So it is intermittent existence. Alternatively, they might say it is a different ship at t11.

     Finally, note the bookkeeping cost vs. the metaphysical cost.

     Predictable Problems:
     - Students might not see the problem with the perdurantist model's arbitrariness. We have to emphasize the continuous change and ask why we chose these time points.
     - In the chunk perdurantism part, they might ignore the continuous property and only use the plank set. We have to point out that the mast angle is also a property of the ship and must be accounted for.
     - In the dismantled ship case, they might say it is the same ship without any issue. We have to press: how does the model represent that? In perdurantism, we have two worms and we call them the same ship. But what makes them the same? This leads to the issue of trans-temporal identity, which is a deeper metaphysical cost.

     What the Activity Cannot Stage:
     - The real cost is metaphysical: perdurantism posits a four-dimensional object with temporal parts, which some find ontologically extravagant. Endurantism has to explain how something can have incompatible properties at different times without being different parts. The activity stages the bookkeeping (how we represent change and gaps) but not the underlying ontology. We will have to discuss that in the debrief.

     Revised Timeline:

     0-5 min: Introduction. Explain the ship's history and assign times. Hand out index cards and have students record the state at their time. (Have a master list to tell each what to write.)

     5-15 min: Students write their cards. Then they arrange themselves in order.

     15-25 min: Pose the problem of change (plank replacement and mast bending). Push them to think of the ship as made up of temporal parts. Have them use tape to connect the cards from t0 to t5 and then t11 to t15 as two separate worms.

     25-35 min: Diagnostic: the gap. Ask if the two worms are the same ship. Discuss. Force a commitment: write on the board what the class decides (same or different). Then reveal that the planks are the same and it was reassembled. They will likely say same. Then ask: how does our model represent this? In perdurantism, we can say it is one ship with two disconnected temporal parts.

     35-45 min: Instability: Why did we use these 16 time points? The mast angle changes continuously. If we had more points, we'd have more slices. It seems arbitrary. Ask: can we group slices together to avoid arbitrariness? What would be a natural grouping?

     45-55 min: Repair: Group by constancy. Have students group the cards where the properties are constant. They will try by planks, but then the mast angle is not constant. Point out the contradiction: a chunk must have one set of properties.

     55-65 min: Failure: For the mast angle, there is no constancy. So we cannot form chunks for the mast angle. Hence, chunk perdurantism fails for continuous change.

     65-75 min: Debrief: Introduce the terms and map to the activity. Discuss the dismantled ship in each view. Highlight the bookkeeping vs. metaphysical costs.

     Materials:
     - 16 index cards.
     - Markers or pens.
     - Tape or string to connect cards (or just lay them in order without taping, and use sticky notes for grouping).

     Instructions for Students:

     Part 1 (Writing the cards):
     - "Each of you represents a moment in the history of a ship. I will assign you a time, from t0 to t15. I will tell you the state of the ship at your time. Write on the card: the time, the set of planks (if the ship exists), and the angle of the mast (if the ship exists). If the ship does not exist at your time, write 'ship does not exist'."

     Then assign times and read out the states (have a cheat sheet).

     Part 2 (Arranging):
     - "Now, please stand in order of your time, from t0 to t15, holding your card so others can see."

     Part 3 (Change):
     - "Look at t0 and t3. At t0, the ship has planks A,B,C. At t3, it has planks D,B,C. How can this be the same ship? Also, at t0 the mast is straight (0°), at t5 it is bent (50°). How can the same ship be both straight and bent?"
     - Guide them to temporal parts: "Perhaps the ship at t0 is a part of the whole ship's history, and the ship at t3 is a different part. Then the whole ship is the sum of these parts."
     - "Let's connect the cards where the ship exists. Use tape to connect t0 to t1, t1 to t2, ... up to t5. Do the same for t11 to t15. We now have two separate 'worms'."

     Part 4 (Diagnostic):
     - "Now, the ship at t5 was dismantled. Then at t11, it was reassembled. Is the ship at t11 the same ship as the one at t5? Why? ... Write your verdict on the board: same or different, and a brief reason."
     - After discussion: "In our model, we have two worms. If they are the same ship, then the ship has two disconnected temporal parts. If they are different, then we have two ships."

     Part 5 (Instability):
     - "Why did we use 16 time points? What if we had more? The mast angle changes continuously, so we could have an infinite number of time-slices. That seems arbitrary. Can we group the time-slices into larger chunks to avoid this arbitrariness? What would be a natural way to group them?"

     Part 6 (Repair):
     - "Let's try grouping the time-slices only when the ship's properties are constant. For example, the plank set is constant from t0 to t2. So we can group t0, t1, t2 into one chunk. Do the same for other periods of plank constancy. But note: in the chunk t0-t2, the mast angle is different at each time. So if we consider this chunk as one temporal part, what is its mast angle? It must have a single value. But it has three. Contradiction. So we cannot group them if we require all properties to be constant."

     Part 7 (Failure):
     - "Moreover, the mast angle is changing at every instant. So there is no period, however short, where it is constant. Therefore, we cannot form any chunk longer than an instant. So we are back to the first model."

     Debrief:
     - "What we built first is called perdurantism: an object persists by having temporal parts at each instant of its existence. The repair we tried is called 'chunk perdurantism' (temporal parts only during periods of constancy), but it fails for continuous change. The diagnostic case of the dismantled ship: perdurantism can handle it by allowing disconnected temporal parts, while endurantism (the view that the object is wholly present at each time) must either deny identity or accept intermittent existence, which is problematic."

     Finally, note: the activity stages the bookkeeping problems, but the real cost is metaphysical. Perdurantism requires four-dimensional objects, which some find ontologically extravagant. Endurantism must explain how temporary intrinsics are possible without temporal parts.

     This should fit in 75 minutes if managed tightly.
