  ### Persistence Module: Session Design  
  **Core Idea:** Students physically model a ship's persistence through time using index cards to represent temporal states. They confront intrinsic change, continuous change, and reassembly after dismantling, forcing them to invent temporal parts to solve problems. The model's breakdown reveals the costs of their solutions.  

  **Materials:**  
  - 32 blank index cards (2 per student)  
  - 16 pens  
  - Masking tape (for attaching cards)  
  - 1 large sheet of paper (timeline)  
  - Printed instructions (one per student)  

  **Setup:**  
  - Arrange chairs in a circle. Place the large paper in the center ("timeline").  
  - Divide timeline into three phases with tape:  
    - **Phase 1 (t₁–t₄):** Ship sailing (planks A,B,C; rotation angle increasing: 0°→120°).  
    - **Phase 2 (t₅–t₉):** Dismantled (no ship exists).  
    - **Phase 3 (t₁₀–t₁₃):** Reassembled (same planks; rotation reset to 0°).  
  - Assign each student a *time role* (t₁ to t₁₃; 3 students idle during dismantling).  

  **Timeline & Properties:**  
  | Time | Planks | Rotation | Notes |  
  |------|--------|----------|-------|  
  | t₁   | A,B,C  | 0°       | Ship built |  
  | t₂   | A,B,C  | 40°      | Sailing |  
  | t₃   | A,B,C  | 80°      | Sailing |  
  | t₄   | A,B,C  | 120°     | Plank A damaged |  
  | t₅–t₉| —      | —        | **Dismantled** (no ship) |  
  | t₁₀  | B,C,D  | 0°       | Reassembled (A replaced with D) |  
  | t₁₁  | B,C,D  | 30°      | Sailing |  
  | t₁₂  | B,C,D  | 60°      | Sailing |  
  | t₁₃  | B,C,D  | 90°      | Sailing |  

  **Rules:**  
  - No technical terms (endurantism/perdurantism) until debrief.  
  - Students must resolve contradictions *using cards*, not abstract arguments.  
  - All decisions require group consensus.  

  ---

  ### Activity Timeline (75 Minutes)  
  **Phase 1: Model the Ship’s States (15 min)**  
  *Goal: Expose temporary intrinsics through discrete change (plank replacement).*  
  1. **Instructions (5 min):**  
     - "You each represent the ship at one time. On your first card, draw:  
       - *What planks it has* (label A,B,C etc.).  
       - *Its rotation angle* (draw a mast: ↺ 0° / 45° / etc.).  
       - Dismantled times (t₅–t₉): Write ‘NO SHIP’."  
     - Students draw cards independently.  

  2. **Conflict Setup (10 min):**  
     - Tape cards to the timeline in order.  
     - Ask: *"The ship at t₁ (0° rotation) and t₄ (120° rotation) is the same ship. How can it be both straight and bent?"*  
     - Push: *"If it’s the same ship, why does it have different properties? Fix this using your cards."*  

  **Predictable Student Moves:**  
  - Most will add timestamps to properties ("bent *at t₄*"). Redirect: *"The card is the ship at that time. How does the ship itself have both properties?"*  
  - Some may draw a single ship across cards. Challenge: *"Point to where the ship *is* on the timeline. Is it wholly at t₁? Wholly at t₄? Or spread out?"*  

  **Phase 2: Invent Temporal Parts (20 min)**  
  *Goal: Force perdurantism to resolve contradictions.*  
  1. **Instructions (5 min):**  
     - "Use your second card to solve the problem. Define what *makes* the ship at t₁ and t₄ the same thing. You can redraw, add notes, or split the ship."  

  2. **Group Work (15 min):**  
     - Students rebuild models. Common solutions:  
       - **Perdurantist move:** Split the ship into time-slices (e.g., "ship-at-t₁", "ship-at-t₄").  
       - **Endurantist move:** Label all cards "Ship X" but keep properties tied to times.  
     - Force a choice: *"During dismantling (t₅–t₉), does the ship exist? Show this on your cards."*  

  **Predictable Problem:**  
  - Students avoid committing. Intervene: *"If the ship exists at t₁ and t₁₀, is it the same ship? Write YES/NO and why on your card."*  

  **Phase 3: Chunk Perdurantism Repair (15 min)**  
  *Goal: Expose instability; push toward "chunks" of constancy.*  
  1. **Introduce Continuous Change (5 min):**  
     - "Rotation isn’t jumpy—it’s smooth. Between t₁ and t₂, the ship rotated 40°. If we added t₁.₅, its angle would be 20°."  
     - Ask: *"If time is continuous, how many slices are needed? Fix your model to handle this."*  

  2. **Group Repair (10 min):**  
     - Students typically group slices into "chunks" (e.g., "t₁–t₃: sailing straight").  
     - Challenge: *"Find a chunk where rotation is constant. How long can it be? Can your chunk have a single rotation angle?"*  

  **Predictable Failure:**  
  - Students realize rotation *never* stays constant. Push: *"If chunks need constancy, but rotation always changes, can chunks exist?"*  

  **Phase 4: Diagnostic Test (10 min)**  
  *Goal: Force commitment on dismantled ship.*  
  - **Instructions:** "Reassembled ship (t₁₀): Same as original? Write your verdict on a card:  
    - *Option 1:* Same ship (it survived dismantling).  
    - *Option 2:* New ship (original was destroyed).  
    - *Explain why using your model.*"  
  - Tape verdicts on the timeline. Discuss inconsistencies.  

  **Phase 5: Debrief (15 min)**  
  *Goal: Map activity to theory; reveal costs.*  
  1. **Reveal Terms & Map Moves (5 min):**  
     - "What you built first was **perdurantism** (temporal parts at each instant).  
     - Your repair was **chunk perdurantism** (parts only during constant properties).  
     - The alternative is **endurantism** (one ship wholly at each time)."  
     - Whiteboard:  
       | **View** | **Ship Rotation** | **Plank Change** | **Dismantled Ship** |  
       |----------|-------------------|------------------|---------------------|  
       | Perdurantism | Different slices | Different slices | Two parts of 4D worm |  
       | Chunk | Chunks impossible | One chunk (t₁–t₃) | Separate chunks? |  
       | Endurantism | One ship (bent *at* t) | One ship (loses part) | Intermittent existence |  

  2. **Costs Revealed (5 min):**  
     - **Perdurantism:** Arbitrary slicing (infinite parts for continuous change).  
     - **Chunk Perdurantism:** Fails with change (no constancy → no chunks).  
     - **Endurantism:** Denies identity or accepts gaps (dismantled ship).  

  3. **Metaphysical vs. Bookkeeping (5 min):**  
     - "The activity shows *bookkeeping* costs (e.g., ‘how many things?’). But the *metaphysical* cost is deeper:  
       - Perdurantism: What *are* temporal parts? Are they real?  
       - Endurantism: How can one thing have contradictory properties?  
     - This is where intuition fights theory—we’ll tackle it next week."  

  ---

  ### Predictable Problems & Fixes  
  1. **"Why does this matter? It’s just labels."**  
     - *Fix:* Press dismantled ship case: "If you say it’s the same ship, what *is* it during dismantling? If not, why reassemble it?"  

  2. **Students skip to chunks too early.**  
     - *Fix:* In Phase 2, reject non-instantaneous answers: "Your model must explain *this specific angle* at t₂."  

  3. **Group votes instead of committing.**  
     - *Fix:* Require individual verdicts (Phase 4). Highlight disagreements: "Claire says same ship; Sam says different. Why?"  

  4. **Continuous change ignored.**  
     - *Fix:* Stress smooth rotation: "If time is a flow, not ticks, does your model hold?"  

  ### What the Activity Can’t Stage  
  - **The Metaphysical Weight:** Students may not *feel* the cost of 4D ontology or intermittent existence. You must underscore this in debrief: "Is a ship that ‘pops’ in/out of existence the same ship? Are temporal parts *real* or just tools?"  
  - **Why Change is Problematic:** The activity shows *how* views handle change, not *why* change threatens persistence. Briefly note in debrief: "Change implies contradiction without temporal parts—this is why we started."  

  ### Tweaks to Your Arc  
  - **Chunk Perdurantism Push:** Your arc assumes students naturally propose chunks. If they don’t, simplify: After perdurantism, ask: *"Can we group slices where the ship doesn’t change? Try it."*  
  - **Continuous Change Failure:** This works but is abrupt. Emphasize the *no-win* outcome: "No constancy → chunks fail → we’re back to arbitrary slices."  

  **Why This Works:**  
  - Students *build* the problem (temporary intrinsics) and *invent* solutions (temporal parts).  
  - Physical cards make costs visible (e.g., infinite slices for rotation).  
  - Dismantled ship forces a public, tangible commitment.  

  **Run it cold—no prep beyond cards and timeline. Print the instructions below.**  

  ---  
  ### Student Instructions (Handout)  
  **Phase 1 (5 min):**  
  - *You are the ship at your assigned time.*  
  - On Card 1: Draw the ship’s planks and rotation angle. If dismantled, write "NO SHIP".  

  **Phase 2 (15 min):**  
  - On Card 2: Fix this problem: "The same ship is straight (t₁) and bent (t₄). How?"  
  - Be ready to explain: Is the ship at t₁ the same as at t₁₀? What about during dismantling?  

  **Phase 3 (10 min):**  
  - Rotation is smooth (not jumps). Fix your model: Can you group times where the ship doesn’t change?  

  **Phase 4 (5 min):**  
  - Verdict: Is the reassembled ship (t₁₀) the same as the original (t₁)? Write: YES/NO and why.
