     Then ask: "Now, what about the ship that was at t5 and the ship that is at t11? Are they the same ship? Why or why not?"

     They will likely say yes because same planks and reassembled. Then ask: "How do we represent that in our model? Should we connect the worm from t0-t5 to the worm from t11-t15? But there is no ship in between."

     We want them to see that they have two options: 
          Option 1: Two separate ships. But then we lose the identity.
          Option 2: One ship that has two disconnected temporal parts.

     This is a feature of perdurantism: it can allow for temporal gaps.

     Part 4: Instability of the perdurantist model (10 min)
     - Point out that we have 16 time-slices. Why are we using these time points? What if we had more time points? The mast angle changes continuously, so between t0 and t1, if we had t0.5, the angle would be 5°. So we have even more slices. Why cut at these points? It seems arbitrary.
