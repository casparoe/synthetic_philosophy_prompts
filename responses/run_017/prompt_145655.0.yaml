     Activity Timeline:

     Total: 75 minutes.

     Part 1: Building the time-slices (15 min)
     - Assign each student a time from t0 to t15.
     - Give each a card with the time and instructions for recording:
          - For t0: Planks: A,B,C; Angle: 0°
          - t1: Planks: A,B,C; Angle: 10°
          - t2: Planks: A,B,C; Angle: 20°
          - t3: Planks: D,B,C (A replaced); Angle: 30°
          - t4: Planks: D,B,C; Angle: 40°
          - t5: Planks: D,B,C; Angle: 50°
          - t6: DISMANTLED - ship does not exist. (so no properties)
          - t7: DISMANTLED
          - ... until t10: DISMANTLED
          - t11: Reassembled: Planks: D,B,C; Angle: 0° (we reset the angle)
          - t12: Planks: D,B,C; Angle: 10°
          - t13: Planks: D,B,C; Angle: 20°
          - t14: Planks: D,B,C; Angle: 30°
          - t15: Planks: D,B,C; Angle: 40°

     Students write their card. They can also draw a simple ship if they want, but not necessary.

     Part 2: Arranging the timeline (5 min)
     - Students stand in order holding their cards or place them on a table in order.

     Part 3: Questioning persistence (10 min)
     - Guide the discussion:
          - "Look at t0 and t3: the ship at t0 has planks A,B,C and at t3 has D,B,C. How can it be the same ship?"
          - "Look at the mast: at t0 it is straight (0°), at t5 it is bent (50°). How can the same ship be both straight and bent?"

