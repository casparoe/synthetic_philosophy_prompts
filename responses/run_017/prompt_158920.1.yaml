prompt: |-
  You're a professional philosopher who works on desert and moral luck — please think carefully rather than going with your first instinct, and start by listing the candidate rules before you commit to one.

  My team lead keeps making calls about who "genuinely deserves credit" for a piece of work, and she's very explicit that this is a different question from who should get the bonus under company policy. Her calls so far:

  - Maya: 80-hour weeks, shipped something that turned out to be worthless. Verdict: deserves credit.
  - Tom: one-line fix, huge impact, but only because a competitor's outage happened to make it matter. Verdict: doesn't deserve credit.
  - Dan: coasted, got handed a cushy high-visibility project he did nothing to get; work got done fine. Verdict: doesn't really deserve it.
  - A junior who produced almost nothing but ground through a genuinely brutal problem and learned a ton. Verdict: deserves more than the output suggests.

  I reckons there are two pretty different rules that fit all four of those, and they come apart on our next case. Priya's on a medication prescribed for an unrelated condition; a side effect is that she needs almost no sleep and can hold a ridiculous amount of context in her head. She never asked for it and wasn't told, but she's worked out what's happening, definately leans into it, volunteers for the worst on-call rotations, and it still genuinely costs her effort and unpleasantness. Her work is excellent and clearly down to that effect.

  What do you think my team lead says about Priya? Which rule is she actually running, and what's the one further case that would settle it between them? Under 250 words, bullet points fine.
reasoning: |-
  Okay, the user is asking about their team lead's concept of "genuinely deserves credit" in a professional setting, with several examples provided. They've noticed two possible underlying rules and want to know which applies to a new case involving Priya. 

  First, I need to analyze the patterns in the team lead's verdicts: Maya gets credit for effort despite worthless output, Tom gets no credit for impactful work due to external luck, Dan gets no credit for coasting despite good results, and the junior gets credit for struggle and growth over output. 

  Hmm... the common thread seems to be valuing controllable factors over results. Effort, struggle, and personal growth are rewarded, while luck and unearned advantages negate credit. But there's nuance - Priya's case introduces a twist with biological advantage. 

  I see two candidate rules emerging: 
  Rule A focuses on effort/sacrifice regardless of source (would credit Priya's voluntary hardship). 
  Rule B focuses on praiseworthy agency excluding unchosen advantages (would discount the medication effect). 

  Priya's case tests this because her advantage is unchosen but her effort is real. The team lead would likely reject credit under Rule B, matching the Tom/Dan precedents where luck/unearned advantages negated credit. 

  To definitively distinguish the rules, we'd need a case of someone voluntarily undertaking extreme effort *without* any advantage - say an average developer choosing brutal overtime. Rule A would credit this; Rule B might still credit it if the effort reflects praiseworthy agency. 

  The user's deeper concern might be about fairness in recognition systems. They're observing how moral luck influences workplace evaluations - a fascinating practical application of desert theory. The team lead seems to be wrestling with whether we deserve credit for what we control versus what we achieve.
answer: |-
  Based on the verdicts, your team lead is prioritizing **effort, struggle, and controllable factors** over outcomes, luck, or unearned advantages. Two candidate rules fit the cases:

  1.  **Rule A (Effort/Sacrifice):** Credit is deserved based on the *effort expended, sacrifice made, or hardship endured* in the attempt to contribute, regardless of outcome or innate advantages/disadvantages.
  2.  **Rule B (Praiseworthy Agency):** Credit is deserved for outcomes *attributable to the agent's praiseworthy choices and actions*, specifically excluding significant contributions from luck (good or bad) or unearned advantages/disadvantages.

  **Priya Prediction & Rule Identification:**
  *   **Prediction:** Your team lead will likely say Priya **does not genuinely deserve credit** (or deserves significantly less).
  *   **Actual Rule:** Rule B (Praiseworthy Agency). Priya's excellence stems primarily from an **unchosen, significant advantage** (medication side-effect). While she chooses to leverage it with effort, the core capacity enabling her contribution is not praiseworthy in itself and wasn't earned/developed through her agency. This mirrors Tom (luck made impact) and Dan (unearned advantage).

  **Settling Case:**
  To distinguish Rule A (Effort) vs. Rule B (Praiseworthy Agency):
  *   **Propose:** A developer with **average innate talent** who **voluntarily undertakes extreme, grueling effort** (like Maya's 80-hour weeks) on a project that **fails due to unforeseeable bad luck** (e.g., market collapse).
      *   **Rule A (Effort):** Would say they *deserve credit* (like Maya).
      *   **Rule B (Praiseworthy Agency):** Would say they *deserve credit* (praiseworthy effort/choice, bad luck irrelevant).
      *   **Contrast:** If the lead says they *don't* deserve credit, it leans towards a stricter Rule B requiring *successful* agency, but the existing cases (esp. Maya) suggest Rule B as defined above.
