prompt: |-
  hey — I sit on this city's Commemoration Advisory Panel (seven of us, monthly meetings, the school board can override us but basically never has) and we've got a school naming case to decide in three weeks, so I'm trying to work out what we already committed ourselves to. Our run of verdicts so far:

  - bronze statue of a Confederate colonel on the courthouse lawn, put up in 1909 by the local daughters-of-the-confederacy chapter — removed to museum storage, empty plinth left with an interpretive marker
  - a street and the public library both named for a 19th-century merchant who was the city's biggest slave trader and whose bequest founded the library — street renamed for a local civil-rights lawyer, library kept its name with a lobby installation about the bequest
  - elementary school named for a suffragist who also campaigned for immigration restriction and wrote against Black suffrage — kept, plaque added
  - research wing named for a surgeon honored for a technique he developed by experimenting on incarcerated patients without consent — renamed, 4–3
  - science building named for a geneticist who was a prominent eugenics advocate but whose honored discovery had nothing to do with that — kept, plaque rewritten to say both things
  - bust of a mayor who desegregated the schools and also signed off on the redlining-era housing plan — kept, plaque rewritten
  - a school renamed in 1961 for a sitting governor explicitly as a tribute to his resistance to desegregation — renamed again in 2019
  - a park renamed in 1998 for a man lynched here in 1918, at the request of a preservation society; some descendants said the naming was done over their heads and reopens the wound — we kept the name but funded a family-designed commemoration and an oral-history project instead

  New case: Vance Elementary, named in 1926 for Ellery Vance, a banker and parks commissioner who donated land for six city parks and paid for the school's playground; that's what he's honored for. In 1921 he was a leading figure in the neighborhood association that organized the boycott-and-petition campaign that drove about 200 Black families out of Riverside, and he signed the deed restrictions that kept that neighborhood white for a generation. He never held office, no Confederate connection. Twist: the school was closed in 1988 and reopened across town as a merged school that kept the name; today's families are mostly Latino and Black with no tie to Riverside, and the PTA mostly shrugs and doesn't want to spend money on new signs and uniforms. A descendant-led group, the Riverside Descendants Project, is petitioning for renaming.

  So: what should we decide if we want to be consistent with ourselves, and which precedent is the real analog — the surgeon's wing, where the honored achievement was built on the wrong, or the science building and the mayor's bust, where the wrong sat alongside the achievement? If our precedents genuinely don't settle it, I want to know what principle we'd be adopting with each option, stated plainly enough that a member can sign onto it.

  Two facts we haven't nailed down: (a) whether Vance's park deeds restricted use to white residents, and (b) whether the school was sited to serve a whites-only subdivision. Which of those, established either way, would actually flip your recommendation, and how?

  Also, if we do rename: an anonymous donor will cover the ~$85k in signage and rebranding costs only if the new name is "Riverside Elementary," restoring the name of the neighborhood that was erased. Half the panel thinks that's the whole point, half thinks it's paying a stranger to pick our name. And tell me whether cost should count at all — I don't think we've ever said.

  Finally, please say how confident you are in each of your calls and single out the one you're least sure of.
reasoning: |-
  Okay, I'm looking at this query from someone on a Commemoration Advisory Panel. They need to decide on renaming Vance Elementary, named after Ellery Vance, in three weeks. The user wants to be consistent with their past decisions and has listed several precedents. My job is to analyze those precedents, apply them to this new case, and give clear recommendations.

  First, I need to understand the precedents they've set. They've handled cases like Confederate statues, streets and buildings named after controversial figures, and even a park renaming. The key patterns are whether the honored achievement was directly tied to the wrongdoing, and how they balanced removal with contextualization. For example, they removed the surgeon's wing because the research involved unethical experiments, but kept the science building for the geneticist since the eugenics advocacy was unrelated to the discovery.

  Now, for Vance: he's honored for donating land for parks and funding a playground, but he was involved in driving out Black families through a racist campaign in 1921. The question is whether these are connected like the surgeon or separate like the geneticist. I think it's closer to the geneticist and the mayor's bust because the good deeds (parks, playground) aren't inherently racist, while the bad deeds are separate actions. So, consistency suggests keeping the name with added context, like a plaque.

  The user asked about two unresolved facts: whether Vance's park deeds had racial restrictions and if the school was built for a whites-only area. If either is true, it could flip my recommendation. For instance, if the parks were segregated, it ties the honor directly to racism, making it more like the surgeon case. If the school was meant to be exclusive, it strengthens the argument for renaming.

  On the renaming part, there's an offer from an anonymous donor to cover costs if it's renamed "Riverside Elementary." I think cost shouldn't drive the decision, but since the PTA is indifferent, it's practical. Renaming to honor the erased neighborhood makes sense symbolically, but the panel should ensure it's not forced. The principle here is about restorative justice, not letting money dictate.

  For confidence levels, I'm most sure about the core analogy to precedents like the geneticist. Least sure is about the renaming with donor influence—it's tricky because it could seem like selling out, but if it aligns with justice, it might be okay. I need to emphasize that the descendant group's petition matters, and if they're pushing for renaming, that should weigh heavily.

  Overall, I'm structuring the response to cover: precedent analysis, the role of unresolved facts, renaming considerations, cost, and confidence. The goal is to help the panel make a principled, consistent decision without imposing my views.
answer: |-
  Based on your panel's established precedents and the specifics of the Vance case, here's a clear breakdown of the recommendation, its consistency, and the relevant principles:

  **Recommendation: Keep the name "Vance Elementary" but add a prominent contextual plaque/installation.**  
  **Confidence: High (85%)**  
  *   **Core Principle:** *Honored deeds are separable from unrelated harmful actions, and commemoration can be contextualized rather than erased.* This aligns directly with your decisions on:
      *   **The Suffragist:** Kept name, added plaque for restrictionist/anti-Black suffrage views (separate from suffrage work).
      *   **The Geneticist:** Kept name, plaque rewritten to include eugenics advocacy (separate from the honored discovery).
      *   **The Mayor:** Kept bust, plaque rewritten to include both desegregation and redlining (separate actions within his tenure).

  *   **Why Vance Fits This Precedent:**
      *   Vance is honored *specifically* for philanthropy (land for parks, funding playgrounds). These acts, while occurring in a segregated society, are not *inherently* or *exclusively* racist acts like the surgeon's non-consensual experiments.
      *   His harmful action (leading the racist expulsion campaign and enforcing deed restrictions) was a distinct political/social act, occurring 5 years before the school naming and not directly tied to the *reason* he was honored (the parks/playground donation).
      *   Similar to the geneticist's eugenics views being separate from his discovery, Vance's racism was separate from his philanthropy (even if contemporaneous).

  **Why the Surgeon Precedent Doesn't Apply (Low Confidence - 20%):**  
  *   The surgeon's honored "achievement" (the technique) was *directly built upon and inseparable from* the horrific wrong (non-consensual experimentation). The harm was the *means* to the end. Vance's philanthropy and his racist activism were parallel actions, not causally linked. His parks donation wasn't *funded by* or *achieved through* expelling Black families; they were separate endeavors. The surgeon case is fundamentally different.

  **Role of Unresolved Facts (a & b):**
  1.  **a) Park Deed Restrictions (Use by White Residents Only):** **YES, this would flip my recommendation to RENAME (Confidence: 75% if proven).**  
      *   *Why:* If Vance's donated parks carried his own racial use restrictions, it fundamentally changes the nature of his philanthropy. The honored deed (donating parks) becomes *itself* an act of enforcing segregation and white supremacy, directly linking the "good" to the systemic harm. This makes it analogous to the surgeon – the "good" (park access for some) is inseparable from the harm (exclusion of others) and was built on racist intent. This is distinct from just donating land *in* a segregated city; it's him *actively imposing* the segregation *through* the donation.
  2.  **b) School Sited for Whites-Only Subdivision:** **NO, this likely WOULDN'T flip my core recommendation (Confidence: 65%).**  
      *   *Why:* While deeply problematic context, this speaks more to the *city's/systemic* racism at the time of siting (1926) rather than being an *action specifically attributable to Vance himself* tied to the *reason for his honor*. His honor was for donating land/playground funds, not for siting the school. It adds weight to the harmful context but doesn't inextricably link *his specific honored deed* to the harm in the way deed restrictions on *his* parks would. It strengthens the case for robust contextualization but doesn't automatically force renaming under your precedents.

  **Renaming Considerations & Cost:**

  1.  **The Descendant-Led Petition:** This is significant and must be weighed heavily. Your "lynching victim park" precedent shows sensitivity to descendant wishes, even while keeping the name. *Principle: Descendant voices carry substantial moral weight and should inform the nature of commemoration, even if not solely determinative of renaming.*
  2.  **"Riverside Elementary" & Anonymous Donor:**
      *   **Principle on Cost:** Cost should *not* be the primary factor in the *principle* of renaming (justice/memory should be), but it can be a legitimate practical consideration *if* the principle dictates renaming is necessary. Your panel hasn't explicitly prioritized cost, but the library renaming (costly street vs. cheaper lobby install) shows practical awareness.
      *   **The Offer:** The donor offer is both an opportunity and a complication.
          *   **Pro:** It removes the practical barrier (PTA indifference/cost), enables restorative justice by honoring the erased neighborhood, and aligns with the descendant petition's likely intent. This makes renaming *feasible*.
          *   **Con:** Letting an anonymous donor dictate the *specific* new name ("Riverside Elementary") is problematic. It surrenders the panel's responsibility and creates perception issues (paying a stranger to pick the name). **Recommendation:** If renaming is decided, the panel should *accept the funding conditional on the name "Riverside Elementary" being the explicit choice of the Riverside Descendants Project (or a clear majority of verified descendants)*. This makes the name an act of community restoration, not donor imposition. If descendants prefer another name, the panel should seek other funding or proceed without the donor.
      *   **Should Cost Count?** **Minimally.** If the principle demands renaming (e.g., if park deeds are restricted), then the panel should recommend it regardless of cost, and advocate for the city/school board to fund it. The donor offer simply makes it easier *if* the principle is met *and* the name is appropriate. Don't let $85k dictate justice, but allow practical solutions that align with justice.

  **Final Recommendation Summary & Confidence:**

  1.  **Core Decision (absent deed restrictions):** Keep "Vance Elementary" with a major contextual installation (not just a plaque) developed *in consultation* with the Riverside Descendants Project. This installation must explicitly name his role in the expulsion campaign and deed restrictions as a harmful legacy alongside his philanthropy. *(Confidence: 85%)*
  2.  **If Park Deed Restrictions Confirmed:** Rename the school. *(Confidence: 75% if restriction proven)*
  3.  **If Renaming:** Accept the anonymous donor funding *only* if the Riverside Descendants Project explicitly chooses "Riverside Elementary" as the new name. If they prefer another name, seek alternative funding or proceed without the donor. Cost is not a valid reason to avoid renaming if principle demands it. *(Confidence on Name Condition: 90%; Confidence on Cost Principle: 85%)*
  4.  **School Siting:** Investigate, but it's unlikely to be determinative under your precedents. Use findings for context in the installation. *(Confidence: 65%)*

  **Least Confident Element: Renaming if Park Deeds are Restricted & Handling the Donor.** While confident *that* proven restrictions necessitate renaming (75%), the *specific mechanics* of the donor offer and ensuring the new name authentically serves restorative justice without donor coercion is complex. Balancing the practical benefit of the funding against the principle of independent, descendant-informed naming requires careful navigation (hence the strong condition recommended).

  **Key Principle to Adopt for This Case (for Panel Debate):**  
  *"We commemorate individuals for specific contributions. When the harm attributed to an individual is fundamentally separate from the specific contribution being honored, contextualization alongside the honor is preferable to removal. Removal is warranted when the harm is inseparable from the contribution itself, or when the contribution was intrinsically an instrument of that harm. Descendant community perspectives significantly shape the form and necessity of contextualization or redress."*

  This principle explicitly links your suffragist/geneticist/mayor decisions (separate harm -> contextualize) and distinguishes the surgeon (inseparable harm -> remove), while incorporating the lesson from the park case about descendant voices. It provides a clear framework for Vance.
