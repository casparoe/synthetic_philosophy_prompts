  For the second question, I'll argue partial systematicity is neutral - it could emerge from statistical approximation of structure. But crucially, the depth limit suggests it's not truly implementing combinatorial rules. 

  For the third point, I'll maintain that LOT isn't just systematicity - it's about the underlying architecture that explains why systematicity exists. The vector system fails to exhibit the hallmark of real thought: unbounded recombinatorial capacity.

  The user's clearly well-versed in this - they mention bilinear tensors and know Fodor's arguments. They're frustrated with what they see as LOT's moving goalposts. My response needs to grant the force of their challenge while showing how LOT still explains something fundamental about cognition that statistical approximation doesn't.
answer: |-
  Your strongest misstep is conflating *achieving* systematic behavior with *explaining* it. LOT isn't just a claim that systematicity exists; it's a claim about the *kind of causal structure* that *must* underpin it to count as genuine thought. Your vector system’s partial success doesn’t confirm LOT—it *challenges* it by revealing where structureless approximation fails. Let’s tackle your points head-on.

  (1) **Behavioral signature against LOT?** If your system *generalized perfectly* to *arbitrary* novel compositional depth—say, flawlessly understanding "the cat that the dog that the rat bit chased slept" on first encounter—*without* performance degradation, that would defy LOT. LOT predicts that unbounded systematicity *requires* discrete, recursive syntax. A system that achieves this without traceable constituent structure (e.g., no detectable sub-representations for clauses like "the rat bit" acting as units) would force me to abandon LOT. Graded failure *is* the signature of approximation, not implementation.

  (2) **Graded systematicity? Neutral—or weak evidence *against* LOT.** LOT posits that systematicity is *all-or-nothing*: you either have the combinatorial machinery or you don’t. If you have it, depth shouldn’t *inherently* degrade performance—only processing load might. Your system’s degradation at depth three suggests it’s *simulating* structure through statistical similarity (e.g., vectors for "John loves Mary" and "Mary loves John" are *close* in space but not built from recombinable parts). That’s evidence for a *non*-LOT architecture exploiting continuous statistics, not for hidden symbols. LOT predicts crisp competence, not fuzzy approximation.

  (3) **Does it "have" LOT? No—and that’s the point.** "Has a language of thought" means cognition is *driven by* syntax-sensitive operations over structured representations. Your system isn’t *doing* that—it’s computing a holistic vector output. Systematicity up to depth three is a red herring; what matters is *how* it’s achieved. A pocket calculator can compute "2+3" and "3+2" systematically without a LOT—it’s just following physical laws. LOT is a thesis about the *architecture of thought*, not the behavior it produces. Your system behaves *as if* it thinks shallowly—but without real constituents, it’s just curve-fitting, not reasoning. We *should* study generalization—but LOT tells us *why* only certain architectures generalize *infinitely*.
