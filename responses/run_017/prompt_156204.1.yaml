  2. Reserve currency dynamics. Open question: Does dollar invoicing delay or distort Humean adjustments? Upstream for international monetary reform debates. Tractability medium—needs some empirical work but possible. Highly neglected relative to importance.

  3. Fiat money systems. Open question: How do central bank policies interact with trade adjustments? Upstream for inflation and currency policy. Very tractable with public data. Somewhat neglected in Humean context.

  4. Capital flows vs trade flows. Open question: Do massive safe-asset flows swamp trade adjustment mechanisms? Upstream for understanding global imbalances. Tractability lower if needing complex finance data—might deprioritize.

  5. Political economy of deficits. Open question: Why do trade deficits remain potent political symbols despite economic arguments? Upstream for policy legitimacy. Tractability high via discourse analysis. Very neglected.

