answer: |-
  ### Research Agenda: Humean Political Economy for a Fragmented Monetary System  
  **Core trade-off criteria:** Upstreamness (40%) > Importance (30%) > Neglectedness (20%) > Tractability (10%). Prioritize questions that expose foundational cracks in modern policy narratives, where resolving uncertainty clarifies multiple downstream debates. Deprioritize: ideological trade-deficit scorekeeping debates (downstream & polarized), CBDC technical design (overly specialized), and historical Hume exegesis (neglected but low modern leverage).  

  ---

  ### Top 5 Funded Lines (Ranked)  
  #### 1. **Strategic Autonomy vs. Humean Adjustment**  
  - **Open Question:** Do policies aimed at "strategic autonomy" (e.g., friend-shoring, export controls on chips) create persistent imbalances by suppressing price/wage signals, or do they merely redirect Humean adjustment through new channels?  
  - **Upstreamness:** Crucial for debates on deglobalization, industrial policy, and sanctions efficacy. If autonomy policies structurally inhibit adjustment, they risk chronic inefficiency or crisis; if not, they’re merely friction.  
  - **Tractability:** High. Junior scholars can map price/wage data in controlled comparisons (e.g., German auto parts shift from China to Poland vs. Humean predictions) using public datasets (BLS, Eurostat). Philosophy/econ-theory background ideal for isolating causal mechanisms.  
  - **Neglectedness:** Extreme. Existing work focuses on supply-chain resilience or geopolitical risk, ignoring adjustment mechanics. Humean lens is absent.  
  - **Evidence Shift:** If initial case studies show friend-shoring *accelerates* local price adjustments (e.g., Mexican wages rise faster than Chinese wages post-reshoring), deprioritize. If imbalances persist despite redirected flows, escalate.  
  - **Steelman:** Strategic interventions are "circuit breakers" that reset conditions for *faster* Humean adjustment by reducing systemic risk (e.g., overreliance on adversaries).  

  #### 2. **Reserve Currency Asymmetry and Adjustment Suppression**  
  - **Open Question:** Does dollar dominance (invoicing, financing) allow the US to externalize adjustment costs, creating "Humean failures" where trade deficits persist without classical price/wage responses?  
  - **Upstreamness:** Underpins critiques of "exorbitant privilege," currency manipulation accusations, and global savings glut theories. If true, forces fundamental rethink of imbalance sustainability.  
  - **Tractability:** Medium. Requires synthesizing forex reserves data, invoicing shares (BIS stats), and US sectoral inflation. No proprietary data needed, but econometric skills useful. Philosophy background aids in dissecting "externalization" mechanisms.  
  - **Neglectedness:** High. Literature focuses on financial stability or seigniorage, not adjustment erosion. Hume’s price-specie-flow mechanism is rarely tested in fiat context.  
  - **Evidence Shift:** If rising non-dollar trade invoicing (e.g., BRL/CNY pairs) correlates with faster deficit correction in emerging markets, prioritize higher. If no link, deprioritize.  

  #### 3. **Sanctions as Artificial Trade Barriers**  
  - **Open Question:** When sanctions forcibly segment markets (e.g., Russia/energy), do they generate *self-correcting* imbalances (per Hume) or metastasize into shadow systems that evade adjustment (e.g., ghost fleets, murky intermediaries)?  
  - **Upstreamness:** Vital for assessing sanctions as policy tools. If sanctions induce efficient rebalancing, they’re sustainable; if not, they incentivize systemic evasion and blowback.  
  - **Tractability:** High. Leverage shipping/tariff data (UN Comtrade), sanctions databases (Castellum), and grey-market price tracking. Junior scholars can build case studies (Iran pre/post JCPOA, Russia oil cap).  
  - **Neglectedness:** Severe. Sanctions research focuses on compliance or effectiveness, not dynamic market re-equilibration. Humean adjustment is unexamined.  
  - **Evidence Shift:** If sanctioned economies show rapid import substitution and balanced trade with new partners (e.g., Russian-Indian arms trade), downgrade. If deficits/surpluses widen with evasion costs, escalate.  
  - **Steelman:** Sanctions are exogenous shocks that *intensify* Humean incentives, accelerating creative destruction in targeted economies.  

  #### 4. **Fiat Money and Credibility as the New "Specie"**  
  - **Open Question:** In a fiat system, does central bank credibility (or CBDC/stablecoin adoption) replace gold as the "anchor" for cross-border price convergence, and how does this alter the speed/sequence of Humean adjustment?  
  - **Upstreamness:** Cuts to the heart of inflation divergence debates and currency crisis models. If credibility anchors enable smoother adjustment, monetary policy independence is less costly than Mundell-Fleming implies.  
  - **Tractability:** Medium-High. Pair inflation expectations data (Fed surveys) with trade flow volatility. Stablecoin adoption (e.g., USDT in LatAm) offers natural experiments. Light formal modeling possible but not essential.  
  - **Neglectedness:** Moderate. Credibility literature exists but isn’t linked to trade adjustment. Hume’s monetary neutrality insights are underextended to digital money.  
  - **Evidence Shift:** If countries with independent CBDCs show faster import price pass-through after shocks, prioritize. If credibility effects are swamped by capital flows, deprioritize.  

  #### 5. **Capital Flows vs. Trade Flows: Which Dominates Adjustment?**  
  - **Open Question:** When massive safe-asset demand (e.g., US Treasuries) drives persistent capital inflows, does it permanently override trade-deficit adjustment by decoupling financial from real-economy signals?  
  - **Upstreamness:** Key to "global imbalances" sustainability and theories of secular stagnation. If capital flows dominate, trade policies (tariffs, etc.) are futile for rebalancing.  
  - **Tractability:** Low-Medium. Requires disentangling financial/trade data (BoP statistics). Challenging without econometrics, but theory-first approaches can identify pressure points (e.g., cases where rising yields *precede* import compression).  
  - **Neglectedness:** High in Humean context. Mainstream work (e.g., Gourinchas) addresses this structurally, but neglects Hume’s demand-side feedback loops.  
  - **Evidence Shift:** If tighter Fed policy consistently shrinks US trade deficits via demand destruction (not just currency), prioritize. If deficits persist despite high yields (e.g., 2023), downgrade as intractable.  
  - **Steelman:** Safe-asset demand is a *stabilizing* feature that smooths adjustment by financing deficits until structural reforms occur.  

  ---

  ### Deliberate Deprioritizations  
  - **"Trade deficit as scoreboard" political rhetoric:** Downstream of adjustment mechanics; resolving upstream questions drains its legitimacy.  
  - **Formal exchange-rate modeling:** Overly tractable but low neglectedness; mainstream econ already dominates.  
  - **Pure Hume exegesis:** Neglected but low modern importance; mandate is applied.  
  - **Subsidy wars (e.g., chips):** Medium importance, but downstream of strategic autonomy question; depends on prior findings.  

  \answer{strategic-autonomy-vs-adjustment}
