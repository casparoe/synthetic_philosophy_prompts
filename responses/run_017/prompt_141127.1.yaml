prompt: |-
  I read a fair bit of cross-cultural moral psychology for fun — the WEIRD-samples complaint, the economic games run in small-scale societies, that sort of thing — and I keep noticing a pattern I don't have a word for. (I'm not in the field, so sorry if this is bread-and-butter stuff.)

  When a study finds a big difference — undergrads say the guy who kept most of the money did something wrong and deserves to be punished even by a bystander who lost nothing; people in some of the small-scale societies studied are much less bothered, and say in effect that it's his business — the finding gets reported in at least three different shapes, and which shape you pick seems to decide whether it tells you anything about whether morality is objective.

  (a) They disagree about a moral claim: same act, same description, opposite verdicts. Genuine moral disagreement.
  (b) They aren't judging the same thing. Different concept of what the act even is, or the question got translated but the construct didn't.
  (c) They agree about the reasons and disagree about the facts: whether the ancestors really retaliate, whether the curse really makes people sick, whether anyone was actually harmed. Fix the facts and the verdicts come back together.

  And then (d), the case I can't place: everybody agrees on the facts and on what happened, but they disagree about who is *in* the moral community at all — dead relatives, unborn children, people in the next valley are or aren't the kind of thing you owe anything to. That's not (a), not (b), and not (c), because nobody has a false empirical belief.

  Two more things that make me think this isn't just the familiar point about verbal disputes: in (c), the disputed facts are often themselves morally loaded, so "they only disagree about non-moral facts" doesn't sit right; and the very same study gets filed under (a) by people drawing a debunking conclusion and under (b) or (c) by people resisting it, with no agreed test for who's right.

  Is there a name for this? Not for the big relativism conclusion — for the sorting itself: putting a cross-cultural difference into one of these boxes, and the suspicion that the sorting is doing all the work. Does it have an established concept or literature? If the nearest things are the argument from disagreement, mere verbal disputes, or something about concepts not being shared across cultures, tell me which fits best, exactly how mine differs from each, and where the boundary cases land — especially (d) and the morally-loaded-fact version of (c). If there's nothing established, coin a term and define it tightly enough that I could actually sort a case with it. A bare label is no use to me; I want the carving and the edges.

  Finish with a single line: \answer{<established | near-fit | coined>: <your term>}
reasoning: |-
  Hmm, the user is asking about a specific pattern they've noticed in cross-cultural moral psychology studies. They've observed that when researchers find differences in moral judgments across cultures, these differences get categorized in three main ways: (a) genuine moral disagreement, (b) differences in conceptualization, or (c) disagreement about non-moral facts. The user has identified a fourth category (d) that doesn't fit neatly into the others - disagreements about who belongs to the moral community.

  I need to analyze this carefully. The user wants a precise term for this categorization process and especially for their fourth category. They're particularly interested in cases where the disputed facts are morally loaded, and they've noticed the same study can be interpreted differently depending on which categorization is used.

  Looking at category (d): this involves agreement on descriptive facts but disagreement about the boundaries of moral concern - whether dead ancestors, unborn children, or distant communities deserve moral consideration. This isn't about factual errors or conceptual misunderstandings, but about who counts as part of the moral community.

  The closest established concept I know is "moral circle" from Peter Singer's work, which refers to the boundary of entities we consider worthy of moral consideration. However, the categorization process the user describes doesn't have a single established term. "Interpretive charity" comes close for how researchers frame findings, but it's not specific to this context.

  For the pattern overall, I think "frame selection" captures how researchers choose between these interpretive frames when presenting findings. For category (d) specifically, "moral constituency disagreement" seems appropriate - focusing on disagreements about who constitutes the relevant moral community.

  The moral circle concept fits well for (d), but it's not about the categorization process itself. The user also noted how in (c), the "non-moral facts" can be morally loaded, which blurs the distinction between factual and moral disagreement.

  I should explain why established concepts like moral relativism or conceptual incommensurability don't quite fit. The user wants precise boundaries, especially for (d) and morally-loaded (c) cases. I'll define these categories clearly and provide examples to help with sorting.

  For the answer format, since there's no perfect established term, I'll go with "near-fit: Moral Circle Disagreement (for d) / Frame Selection (for the sorting practice)" as this best addresses both aspects of their query.
answer: |-
  You've pinpointed a crucial and often under-articulated methodological crux in cross-cultural moral psychology. There isn't a single, universally accepted term for *the sorting practice itself*, but the core issue you describe – the interpretive framing of differences as either (a), (b), (c), or (d) – is recognized, debated, and central to meta-ethical discussions about the findings. Here's the breakdown:

  1.  **Your Pattern (The Sorting):** This is fundamentally an exercise in **Interpretive Charity** applied to cross-cultural disagreement. Researchers (and commentators) make a judgment call about *how fundamental* the disagreement is:
      *   **Assigning to (a):** Low interpretive charity. Assumes concepts, facts, and moral community are sufficiently shared; difference is genuine moral valence disagreement. Favors relativism/debunking.
      *   **Assigning to (b):** Moderate interpretive charity. Assumes the *concepts* or *descriptions* aren't equivalent ("morally wrong", "theft", "person"). Difference is semantic/conceptual. Resists relativism.
      *   **Assigning to (c):** Moderate to High interpretive charity. Assumes shared core moral principles but different factual beliefs about the world (causation, consequences, ontology). Difference is empirical. Strongly resists relativism.
      *   **Assigning to (d):** High interpretive charity regarding descriptive facts and core concepts, but locates difference at the foundational level of **Moral Standing/Circle**. Resists simple relativism but highlights deep structural differences.

  2.  **Category (d): Moral Community Disagreement:** This is best understood as disagreement about **Moral Standing** or membership in the **Moral Circle**. It's disagreement about *who or what is a moral patient* – an entity deserving of moral consideration, possessing inherent worth, or capable of being meaningfully wronged. This is distinct:
      *   **vs. (a):** Not disagreement about the *wrongness* of an act *given* the patients, but about *which entities are patients*.
      *   **vs. (b):** The *concept* of "person deserving consideration" might be shared, but its *extension* (who falls under it) differs. It's not that "wrong" means something different, but that the set of entities to whom "wrong" applies differs.
      *   **vs. (c):** Not disagreement about empirical facts *describing* the entities (e.g., "Do ancestors have minds?" might *be* the disagreement about standing), but about the *normative consequence* of those facts for moral consideration. If the disagreement *is* over an empirical fact like "Do ancestors have minds?", it's (c). If they agree ancestors lack minds but *still* disagree on whether mindless ancestors deserve consideration, it's (d).

  3.  **The Morally-Loaded Facts in (c):** You're right that calling these "non-moral facts" is often misleading. These are **Normatively-Relevant Empirical Beliefs (NREBs)**. Their relevance *depends* on a background moral framework. Whether "ancestors retaliate" is relevant *presupposes* a moral principle like "Causing harm (even through ancestors) is wrong" or "Disrespecting ancestors is wrong." The "empirical" belief is entangled with the moral framework. Distinguishing (c) from (a) hinges on whether the cultures *share the underlying principle that makes the fact relevant*. If they do, it's (c). If they don't share that principle (e.g., one culture cares about ancestor feelings, the other doesn't), then the disagreement might be closer to (a) or (d).

  4.  **Boundary Cases & Sorting Guide:**
      *   **(c) vs. (a):** Does changing *only* the disputed empirical belief (e.g., convincing them ancestors *don't* retaliate), *while holding their moral principles constant*, predictably change the moral judgment? If yes, it's likely (c). If not, it's likely (a) or involves a deeper principle disagreement revealed by the change.
      *   **(c) vs. (d):** Is the disputed fact *about the properties conferring moral standing* (e.g., "Does the fetus feel pain?" vs. "Is pain a prerequisite for moral standing?")? If the fact is about a property presumed necessary for standing, resolving the fact resolves the disagreement – it's (c). If they agree on the properties (e.g., "feels pain") but disagree on whether that property *confers* standing, it's (d).
      *   **(d) vs. (b):** Is the disagreement about the *definition* of the moral patient concept (e.g., "Does 'person' require biological life?"), or about *applying* a shared definition (e.g., "We both define 'person' as a rational agent, is a severely disabled human one?")? The former is conceptual/(b); the latter is application/(d). Disagreement about whether "the next valley people" are part of "us" is typically (d) – applying a concept of moral community/boundary.
      *   **Morally-Loaded (c):** Ask: "Is the *relevance* of this empirical fact to the moral judgment dependent on a moral principle that *is* shared between the cultures?" If yes, it's (c). If no (the principle making it relevant differs), it veers towards (a) or reveals a (d)-like boundary disagreement (e.g., "Why should we care about ancestor retaliation at all?").

  5.  **Established Concepts & Why They Aren't Perfect Fits:**
      *   **Argument from Disagreement:** This *uses* findings categorized as (a) to argue against moral objectivity. Your focus is on the *prior categorization step* that determines if it *counts* as relevant disagreement for this argument.
      *   **Mere Verbal Disputes / Conceptual Incommensurability:** Maps directly onto your (b). It doesn't cover (c), (d), or the sorting practice.
      *   **Moral Relativism:** This is the *conclusion* often drawn from (a), resisted by framing as (b) or (c). It's not the *sorting practice*.
      *   **Moral Circle (Peter Singer):** This **is the established concept that best fits the *content* of your (d)**. It refers explicitly to the boundary of entities we consider worthy of moral consideration. However, it doesn't name the *practice of sorting differences into this category vs. (a), (b), or (c)*.
      *   **Interpretive Charity / Principle of Charity (Davidson, Quine):** This is the *underlying philosophical methodology* driving the sorting practice. It's the meta-concept guiding whether to attribute difference, error, or conceptual divergence. It's broad and not specific to moral psychology or your precise boxes.

  **Conclusion & Coined Term:**

  *   The *content* of your category **(d) is definitively about the Moral Circle**.
  *   The **overarching sorting practice** – deciding whether a cross-cultural difference is (a) genuine moral, (b) conceptual, (c) empirical, or (d) moral standing – lacks a single, universally adopted label in the literature. However, it's a recognized methodological challenge often discussed under frameworks like interpretive charity or the conditions for genuine moral disagreement.
  *   Given your need for precision regarding the sorting practice itself, and the lack of a perfect established term, I propose coining: **Frame Selection for Disagreement Interpretation (FSDI)**.
      *   **Definition:** FSDI is the methodological practice in cross-cultural research where the interpreter (researcher or commentator) categorizes an observed difference in judgment or behavior into one of four primary interpretive frames:
          1.  **Genuine Moral Disagreement (a):** Same act/concept/facts/community, different moral valence.
          2.  **Conceptual/Descriptive Divergence (b):** Differing understanding of the act, concept, or question.
          3.  **Normatively-Relevant Empirical Belief (NREB) Divergence (c):** Shared core moral principles but differing empirical beliefs whose relevance to the judgment depends on those principles.
          4.  **Moral Standing/Circle Divergence (d):** Agreement on descriptive facts and core concepts, but differing boundaries regarding which entities possess moral standing and are owed consideration.
      *   **Sorting a Case with FSDI:** To apply FSDI, systematically ask:
          1.  Is there agreement on the *description* of the act/event? (If no, likely (b)).
          2.  Is there agreement on the relevant *non-normative, descriptive facts* (who, what, where, when, material consequences)? (If no, investigate if it's (c)).
          3.  Is there agreement on *which entities are potential moral patients* relevant to this act? (If no, likely (d)).
          4.  If Yes to 1, 2, and 3, *then* the difference is likely (a).
          *   **Crucially for (c):** For any disputed fact, ask: "Is this fact's *relevance to the moral judgment* contingent on a moral principle that *is shared* between the groups?" If yes, it's (c). If no, it may indicate (a) or (d).
          *   **For Morally-Loaded Facts in (c):** Acknowledge they are NREBs. Their status as "empirical" is secondary to their *normative relevance within a shared framework*. The sorting into (c) depends on establishing that shared framework exists.

  **Final Line:**
  \answer{near-fit: Moral Circle Disagreement (for d) / Coined: Frame Selection for Disagreement Interpretation (FSDI) (for the sorting)}
