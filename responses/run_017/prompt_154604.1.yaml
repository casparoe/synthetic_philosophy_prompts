prompt: |-
  I write historical fiction, and before I fix the premises of my next novel I need the shape of an argument, not a reading list — no names, titles, or suggestions for further reading, please. The book follows one landowning family over three generations in a western Mediterranean province: the grandfather serves on his town council and complains about the assessment; the son negotiates with officers of a field army that no longer arrives when raiders do; the grandson takes service with a king who issues commands in Roman forms and collects revenue through the same registers. I can make their choices feel reasonable only if I know what a good explanation of the end of Roman government in the West is supposed to do. So please write me the specification.

  Give me the requirements an account would have to meet to count as adequate: the phenomena it must explain, the distinctions it must respect, the cases that must come out right, each with the concrete situation that makes it a requirement. Include at least the following as candidates to be accepted, refined, or rejected: the divergence between the two halves of the empire, which shared institutions, enemies, and a common political language yet came out differently; the mismatch between a slow reshaping of fiscal and military arrangements and the punctual events people remembered, such as the sack of the city and the deposition of the last western emperor in 476; the stubborn continuities — senate, law, bishops, estates, kings governing through Roman forms — which any account must say enough about for the claim that this was transformation rather than collapse to be testable rather than merely reasserted; and the fact that a single story cannot treat Britain, northern Gaul, and Africa as the same story. Also tell me what an account owes to the evidence problem itself, since our texts are overwhelmingly the works of literate Christian men while the material record — coin hoards, pottery distribution, settlement size, field systems — sometimes points another way, and someone has to say which wins when they disagree.

  Two further things. First, a requirement of my own that I suspect is a novelist's prejudice rather than a real one: I want an account that stays legible from inside the period, in the sense that a well-informed person living through it could in principle have drawn the same distinctions the historian draws, and that the explanation is not available only with hindsight. Tell me whether that belongs on the list, and if it does, what it costs. Second, mark which requirements are non-negotiable and which are only preferences of a particular camp, name any pair or triple that I should stop hoping to satisfy together, and say which single requirement eliminates the largest share of the familiar explanations. A one-line verdict on each of the four or five standard families of explanation may follow, but keep it to that; the criteria are what I am paying for.

  Please keep the entire answer under 800 words; a compact table is welcome if it helps.
reasoning: |-
  Okay, the user writes historical fiction and needs a clear specification for explaining the end of Roman government in the West to shape their novel's premise. They want an argument framework, not sources, focusing on phenomena to explain, distinctions to respect, and test cases. 

  First, let's unpack their core needs. The novel spans three generations of a landowning family in a western Mediterranean province, showing gradual institutional decay: grandfather deals with local administration, son faces military breakdown, grandson serves a "Roman-style" king. The user needs to make each character's choices feel historically plausible, so the explanation must account for both structural shifts and lived experiences.

  Key elements from their query:
  - Must explain divergence between East/West despite shared foundations
  - Reconcile slow fiscal/military decay with punctual events like 476
  - Address continuities (senate, law, bishops) to validate "transformation vs collapse"
  - Regional variation (Britain vs Africa etc.)
  - Handle tension between textual (elite Christian male) and material evidence
  - Their personal requirement: "legible from inside the period" – could contemporaries grasp it?

  I consider structuring this as analytical criteria. The phenomena to explain are clear: institutional decay, East/West split, event vs process, continuity amid change, regional diversity. Distinctions include state capacity vs cultural identity, structural vs intentional causes. Test cases: rapid collapse in Britain vs prolonged transition in Italy/Spain.

  For the evidence problem, I note textual bias versus archaeological data – any account must navigate contradictions without defaulting to one. The "legibility" requirement is valid but costly; it excludes explanations relying on cumulative effects only visible in hindsight. 

  Non-negotiables: regional variation, evidence triangulation. Contentious preferences: legibility requirement. Major trade-off: satisfying both legibility and the event/process reconciliation is hard. The "transformation" claim eliminates most "decline and fall" narratives.

  Finally, I draft concise verdicts on standard explanations: Gibbon-esque decline (ignores continuity), barbarian takeover (oversimplifies agency), administrative failure (misses regionalism), transformation theory (needs event anchors), Pirenne Thesis (material evidence contradicts). I keep it tight under 800 words, using a table for clarity where possible.
answer: |-
  Here is the specification for an adequate account of the end of Roman government in the West, designed for your novel's needs:

  **Core Phenomena to Explain (Non-Negotiable):**
  1.  **The East-West Divergence:** Why did the Eastern Empire persist for centuries while the West fragmented, despite shared late Roman institutions (taxation, law, bureaucracy, army structure), common threats (Huns, Goths, Vandals), and ideological claims?
  2.  **The Process-Event Paradox:** How does the slow, structural erosion of key state capacities (especially reliable tax extraction to fund a functional field army) relate to specific, remembered events (sack of Rome 410, deposition of Romulus Augustulus 476) that contemporaries saw as pivotal?
  3.  **Continuity Amidst Transformation:** How were Roman institutions, practices, and elites (Senate, law codes, episcopal authority, landowning elites, administrative forms) repurposed, adapted, or survived to shape successor kingdoms? The account must make the claim of "transformation" *testable* against evidence of collapse (e.g., vanished villas in Britain vs. functioning estates in Gaul/Spain/Italy).
  4.  **Regional Variation:** Why did the process differ radically across regions (e.g., rapid collapse & cultural shift in Britain; prolonged military disintegration & settlement in N. Gaul; relatively smoother elite continuity & Vandal/Byzantine/Ostrogothic rule in Africa/Italy)? A single mechanism cannot suffice.

  **Essential Distinctions to Respect (Non-Negotiable):**
  1.  **State Capacity vs. Cultural Identity:** The decline of the *Roman state* (tax, army, central admin) is distinct from the persistence of *Romanitas* (culture, law, elite status, urban life, Christianity). One could vanish before the other.
  2.  **Structural Causes vs. Contingent Events:** Underlying fiscal/military weaknesses created vulnerability, but specific decisions (alliances, battles, treaties) determined outcomes. Both levels matter.
  3.  **Elite Experience vs. Broader Society:** The continuity of landowning elites and bishops differs from the experience of peasants, soldiers, or urban poor (often less visible textually).
  4.  **Imperial Center vs. Provincial Reality:** The view from Ravenna/Rome (obsessed with legitimacy, titles, dynasties) differed vastly from provincial towns dealing with garrison commanders or tax collectors of uncertain ultimate allegiance.

  **Critical Cases to Satisfy (Non-Negotiable):**
  1.  **Britain (c. 410 onwards):** Rapid collapse of central administration, coin economy, villa system, and urban life. Why the suddenness and completeness compared to elsewhere?
  2.  **Northern Gaul (c. 450-480):** Gradual military fragmentation, settlement of federates, emergence of warlord kingdoms (e.g., Syagrius, then Clovis) using Roman titles but lacking imperial structure.
  3.  **Italy under Odoacer & Theodoric (476-526):** The "fall" of the Western Emperor in 476 led not to chaos, but to rulers explicitly maintaining Roman administration, law, Senate, and titles under Ostrogothic kingship. Why this continuity?
  4.  **North Africa (Vandal Kingdom c. 435-534):** Successful conquest leading to a separate Arian kingdom that still utilized Roman administration and landowners, yet distinctly different from imperial rule.

  **Evidence Problem Requirement (Non-Negotiable):**
  *   Any account *must* explicitly address the tension between elite textual sources (focused on legitimacy, religion, events at court) and material evidence (showing economic shifts, settlement changes, military organization). It cannot privilege one consistently. When they conflict (e.g., texts lamenting collapse vs. archaeology showing regional resilience/vice-versa), the account must offer a plausible reconciliation or prioritize based on specific context/limitations of each source type.

  **Novelist's Requirement ("Legibility"):**
  *   **Status:** Valid Preference (not universal among historians).
  *   **Requirement:** Explanations should rely primarily on factors, distinctions, and potential outcomes conceivable to a well-informed contemporary (e.g., your town councillor, army officer, or bishop). Avoid explanations *only* visible through centuries-later hindsight (e.g., world systems theory, deep ecological shifts).
  *   **Cost:** Limits the scope of acceptable causal factors. It rules out explanations relying solely on cumulative, invisible processes over generations (e.g., soil exhaustion, "general decline") *unless* contemporaries demonstrably perceived and acted upon them. Favors political, military, fiscal, and immediately perceived environmental/economic explanations.

  **Key Trade-offs and Eliminators:**
  1.  **Trade-off:** Satisfying both **Legibility** and fully explaining the **Process-Event Paradox** is challenging. Deep structural causes are often *less* legible to contemporaries focused on events.
  2.  **Trade-off:** Emphasizing **Regional Variation** can make crafting a single overarching narrative difficult without resorting to vague generalizations.
  3.  **Major Eliminator:** The requirement for a **testable "transformation"** (Phenomenon 3) eliminates simplistic "Decline and Fall" narratives focused solely on barbarian invasion or moral decay, as they cannot account for the documented continuities.
  4.  **Major Eliminator:** **Regional Variation** eliminates any single-cause explanation (climate! lead! Christianity! barbarians!).

  **Verdicts on Standard Families (One Line Each):**
  *   **"Moral/Decadence Decline":** Fails Phenomenon 3 (continuity), Distinction 1, Evidence Problem (ignores material resilience).
  *   **"Barbarian Invasion/Replacement":** Fails Phenomenon 1 (East survived), Phenomenon 3 (elite continuity/adaptation), Distinction 1, Regional Variation.
  *   **"Administrative/Fiscal Collapse":** Strong on Process (Phenomenon 2), often weak on Event Paradox, Regional Variation, and Legibility of systemic failure to elites.
  *   **"Transformation/Accommodation":** Best on Phenomenon 3 & Distinction 1; must strenuously address Phenomenon 2 (Events), Phenomenon 1 (Divergence), and Regional Variation to avoid being mere assertion.
  *   **"Pirenne Thesis (Islam severed Med)":** Chronology wrong (changes pre-date Islam), fails Regional Variation (Britain collapsed early), Evidence Problem (material decline precedes Arab conquests).

  **Specification Summary Table:**

  | **Category**          | **Requirement**                                                                 | **Status**         | **Key Challenge/Trade-off**                          |
  | :-------------------- | :------------------------------------------------------------------------------ | :----------------- | :--------------------------------------------------- |
  | **Phenomena**         | 1. East-West Divergence                                                         | Non-Negotiable     | Shared threats, different outcomes.                  |
  |                       | 2. Process-Event Paradox                                                        | Non-Negotiable     | Linking slow decay to punctual events.               |
  |                       | 3. Testable Transformation                                                      | Non-Negotiable     | Continuities vs. collapse evidence.                  |
  |                       | 4. Regional Variation                                                           | Non-Negotiable     | Britain vs. Gaul vs. Africa vs. Italy.               |
  | **Distinctions**      | State Capacity vs. Cultural Identity                                            | Non-Negotiable     | State fails, culture persists?                       |
  |                       | Structure vs. Contingency                                                       | Non-Negotiable     | Underlying causes + key decisions.                   |
  |                       | Elite vs. Broader Experience                                                    | Non-Negotiable     | Textual vs. material evidence tension.               |
  |                       | Center vs. Province                                                             | Non-Negotiable     | Legitimacy vs. local realities.                      |
  | **Cases**             | Britain (Rapid Collapse)                                                        | Non-Negotiable     | Explaining sudden administrative vacuum.             |
  |                       | N. Gaul (Warlord Transition)                                                    | Non-Negotiable     | Gradual military/fiscal disintegration.              |
  |                       | Italy (Post-476 Continuity)                                                     | Non-Negotiable     | "Fall" without systemic collapse?                    |
  |                       | Africa (Vandal Adaptation)                                                      | Non-Negotiable     | Conquest + administrative reuse.                     |
  | **Evidence**          | Reconcile Textual (Elite) & Material (Broad)                                    | Non-Negotiable     | Which wins when they conflict?                       |
  | **Legibility**        | Factors conceivable to contemporaries                                           | Valid Preference   | **Trade-off:** Limits deep structural/hindsight causes. |
  | **Major Eliminator**  | Requirement for Testable Transformation                                         | ---                | Eliminates simple "Decline and Fall" narratives.     |
  | **Key Trade-off**     | Legibility + Process-Event Paradox                                              | ---                | Contemporaries see events, not always slow processes. |
