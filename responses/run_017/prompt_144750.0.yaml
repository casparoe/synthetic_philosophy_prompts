prompt: |-
  Hey — I could use a hand turning a half-formed thing into a fellowship application. I've got a research leave in the fall (one semester, teaching buyout, no thesis students that term) and I'm applying for a small residential fellowship to write a single paper, call it 8000 words, single-authored, aimed at a generalist journal rather than a specialist one. I need the proposal document, not the paper.

  Area: sortition, lottocracy, citizens assemblies, randomly selected political bodies generally. The worry I can't yet state sharply enough to put in an application is this: the case for sortition seems to run on two arguments that pull in opposite directions, and nobody in the literature seems bothered by it.

  Argument one, call it the mirroring argument: a randomly selected body statistically reproduces the population's composition, and therefore (somehow) its preferences, and so we get decisions that track what the population would want without the familiar distortions of electoral incentive, campaign finance, careerism, party discipline. Argument two, the transformation argument: put ordinary people in a room with balanced briefing materials, expert testimony, a decent facilitator and enough time, and they'll actually change their minds, reason together, land somewhere better than the aggregate of what they walked in with.

  If the second is right, the first falls apart. A body that has genuinely deliberated is no longer a mirror of the population it was drawn from, because the population hasn't had that experience and the body has. The more the transformation succeeds, the less the mirroring holds at the moment that matters. So "it's representative" and "it deliberates well" can't both be doing the load-bearing work, and I want to know which one defenders are actually committed to — and what's left of the case for lottocracy once you give up the other. In my notes I've been calling the two things entry-mirroring and exit-mirroring, which is probbaly a bad pair of names, but the distinction is the one I want.

  Some questions I'm circling, and I only want to commit to one or two in the final version:

  Is the conflict real, or is it an artifact of describing mirroring in terms of preferences when it should be described in terms of interests, or social position, or being subject to the same laws? If mirroring only has to hold at entry — the value is just that everyone had an equal shot at being in the room, full stop, and who cares whether the output matches anything — then sortition collapses into a fairness-of-procedure view, which has competitors (rotation, compulsory jury-style service with no exemptions, sortition plus a veto, whatever), and I'd want to know whether it beats them or ties with them. If instead substantive representativeness of the *output* is what matters, then the lottocrat owes an account of why transformed preferences are authoritative for the untransformed majority, and that looks to me like an epistemic argument wearing descriptive clothing. In which case the honest version of lottocracy is the cognitive-diversity argument and the mirroring stuff is marketing. Is there a fourth option I'm not seeing?

  Also — and this may turn out to be the more interesting half, or may turn out to be a separate paper — there's an empirical wrinkle that I think does conceptual work. Take-up rates for these invitations are low and skewed, so the equal chance isn't equal either, and the standard fix is stratified sampling from whoever said yes. But then the pool is self-selected for a certain civic disposition, and I suspect the transformation story is partly a story about who self-selects. If so, then scaling up from "advisory mini-public that met for four weekends" to "lottocracy as a constitution" isn't a scale-up, it's a change of mechanism: you can't opt out of a legislature the way you opt out of an invitation, and compulsory service plausibly changes the deliberative dynamics in both directions. I don't know yet whether that belongs in this paper or is a sequel.

  What I need from you:

  - One precise statement of the question, or at most two with the relation between them made explicit. Not a topic area, a question.
  - A short account of why the existing positions leave it open. Please no bibliography and no citations — I'll fill those in myself, and I don't want invented references. Just tell me where the dialectical gap is, what the obvious moves are on each side, and why they don't close it.
  - The method: what I would actually do with the semester, in some kind of month-by-month or stage-by-stage order. And why this approach rather than the obvious alternatives. The obvious alternative is to go read more of the empirical literature on real citizens' assemblies, and my instinct is that no amount of that will settle a question about which argument is doing the normative work, but I'd like that instinct argued for rather than just agreed with.
  - A failure section. What would it mean for the project to have failed? My guess at the boring failure is that the two arguments turn out to be aimed at different institutional sites — mirroring for advisory bodies, epistemic quality for governing ones — and there's no real conflict, just a scope confusion. Tell me how I would know that by month two instead of month four.
  - An honest scope check. One semester, one paper, and I have a bad habit of proposing three.

  Write it in a form I could actually paste into the application: proposal voice, not email voice, but don't make it stuffy.
reasoning: |-
  Okay, the user is a researcher applying for a fellowship to write a paper on sortition (lottocracy). They've identified a tension between two arguments in the literature: the mirroring argument and the transformation argument. The user needs help refining this into a sharp proposal.

  First, I need to understand the core conflict they're pointing out. The mirroring argument claims random selection creates a representative body that reflects public preferences. The transformation argument says deliberation changes members' views, leading to better decisions. The user thinks these can't both be true simultaneously - if deliberation transforms views, the body isn't representative anymore. That's the central tension.

  The user has some open questions about whether this conflict is real or just semantic. They're considering if "mirroring" should be about interests rather than preferences, or if only entry-mirroring matters. There's also an empirical issue about self-selection bias in actual sortition pools. 

  For the proposal, I should help them formulate one precise research question. Something like: "Can the mirroring and transformation arguments be coherently combined in sortition justifications?" That captures the tension. The why-now part should explain that literature hasn't addressed this contradiction - proponents use both arguments without reconciling them.

  For method, since it's conceptual, they shouldn't just read more empirical studies. Instead, they should analyze normative texts to see how authors handle this tension. I'll suggest a staged approach: first map the arguments, then locate the gap, then develop critiques. 

  Failure would be discovering the arguments apply to different contexts (advisory vs governing bodies). They could detect this early by surveying literature for contextual distinctions. Scope needs tightening - focus on normative tension, not empirical issues like participation bias, which could be a separate paper.

  The proposal should have: sharp question, gap explanation, method with timeline, failure conditions, and scope management. Keep it concise since it's for one paper. Emphasize why this conceptual work matters - it clarifies foundations of sortition proposals.
answer: |-
  Here’s a polished proposal draft focused on your core tension, designed for direct pasting into your application. I’ve structured it to meet your specifications while preserving the urgency of your insight:

  ---

  **Research Proposal: Reconciling Representation and Transformation in Sortition Justifications**  

  **Core Research Question:**  
  *Can the "mirroring" (descriptive representation) and "transformation" (deliberative refinement) arguments—both central to normative defenses of sortition—be coherently reconciled, or does reliance on one inherently undermine the other?*  

  **The Dialectical Gap:**  
  Proponents of lottocracy routinely invoke *both* arguments:  
  1.  **Mirroring Claim:** Random selection ensures the assembly descriptively reflects the populace (demographics, raw preferences), legitimizing outcomes as what "the people" would decide.  
  2.  **Transformation Claim:** Structured deliberation enables members to transcend initial preferences through reasoned dialogue, yielding epistemically superior outcomes.  

  The tension arises at the moment of decision: **If deliberation successfully transforms members' views, the assembly ceases to mirror the untransformed public it represents.** Current literature sidesteps this conflict. Some theorists implicitly privilege transformation while using mirroring for initial legitimacy ("entry-mirroring"). Others treat mirroring as sufficient for legitimacy regardless of deliberation's impact ("exit-mirroring"), downplaying transformation. Neither camp explicitly confronts the trade-off or justifies why *their* chosen moment of mirroring (entry vs. exit) is definitive. The gap exists because defenders assume these arguments are complementary, not competitive. The obvious move—reframing mirroring in terms of "interests" rather than "preferences"—merely relocates the problem: Whose interpretation of interests counts (pre- or post-deliberation)?  

  **Methodology & Timeline (One Semester):**  
  This is a *conceptual* project grounded in normative political theory, using analytical philosophy to dissect justificatory arguments. Empirical studies inform but cannot resolve the core tension, as they describe *what happens* in mini-publics but not *which outcome* (mirrored preferences or transformed judgements) *should* bear normative weight.  

  *   **Month 1: Argument Mapping & Literature Audit:****  
      Systematically catalog how major sortition theorists (e.g., Barnett, Gastil, Guerrero, Landemore, Sintomer) deploy mirroring and transformation arguments across key texts. Identify explicit/implicit prioritizations, elisions, or attempted reconciliations. *Why not empirics first?* Establishing the precise conceptual fault lines requires isolating normative claims from contingent empirical findings.  
  *   **Month 2: Gap Analysis & Counterfactual Testing:****  
      Develop formal models of the tension: Does successful transformation logically invalidate mirroring as a legitimizing factor at decision-time? Test robustness against counterarguments (e.g., "Mirroring ensures diversity of starting perspectives, enabling transformation," or "Only interests, not preferences, need mirroring"). *Failure Checkpoint:* If analysis reveals mirroring arguments are *consistently* applied only to advisory bodies and transformation to sovereign ones (or vice versa), the "scope confusion" failure condition is met. This becomes evident by identifying distinct institutional aims in the literature.  
  *   **Month 3: Normative Reconstruction:****  
      Assess the implications of prioritizing one argument over the other:  
      - *If mirroring is primary:* Can sortition compete on pure procedural fairness against alternatives (e.g., mandatory service)? Does it require weak/no deliberation to maintain exit-representativeness?  
      - *If transformation is primary:* Does sortition’s legitimacy become purely epistemic (reliant on "better" outcomes), rendering mirroring redundant (beyond cognitive diversity)? Does this demand new justification for authority over the untransformed public?  
  *   **Month 4: Synthesis & Paper Drafting:****  
      Articulate a framework for assessing coherence in sortition justifications. Conclude whether the arguments can be reconciled, require sequencing/scoping, or necessitate abandoning one as foundational. Draft the 8,000-word paper.  

  **Defining Failure & Success:**  
  - **Failure:** The tension dissolves under scrutiny because mirroring and transformation are demonstrably intended for distinct institutional roles (e.g., mirroring legitimizes *inclusion*, transformation legitimizes *authority* of advisory bodies), revealing a misdiagnosed conflict. *Detection:* Achieved in Month 2 if literature consistently links arguments to separate functions.  
  - **Success:** The project demonstrates an unresolved, fundamental tension in the core normative justification of lottocracy, forcing clarity on whether legitimacy stems from accurate aggregation *or* refined judgement—with significant implications for institutional design and democratic theory.  

  **Scope Discipline:**  
  This paper *exclusively* addresses the **normative-philosophical tension** between mirroring and transformation. Crucially, it *excludes*:  
  1.  Empirical analysis of participation bias or deliberative quality (though findings may inform the "transformation" concept).  
  2.  Design questions about scaling or mandatory participation (self-selection’s impact on transformation is flagged as a *future* research avenue).  
  3.  Comprehensive comparison to electoral systems.  
  The focus is tight: diagnosing and resolving the justificatory conflict within sortition theory itself. One paper, one core question.  

  **Significance:**  
  Resolving (or conclusively exposing) this tension is essential for sortition to progress beyond a promising experiment to a robust theory of legitimate authority. It clarifies what lottocracy fundamentally promises: a statistically accurate reflection of the public, or a forum for surpassing it.  

  ---

  **Key Strengths for Your Application:**  
  1.  **Precise, Novel Question:** Moves beyond description to expose a foundational theoretical conflict.  
  2.  **Clear Gap:** Highlights how proponents *use* both arguments without reconciling their competition.  
  3.  **Methodological Justification:** Argues persuasively for conceptual analysis over empirical deep dives for *this specific* normative puzzle.  
  4.  **Manageable Scope:** Explicitly bounds the project, excluding tangents (self-selection, scaling).  
  5.  **Failure Awareness:** Shows rigor by defining and planning for potential disconfirmation.  
  6.  **Output Focused:** Clearly links activities to a single, significant paper for a generalist journal.  

  **Before Submitting:**  
  -   Replace placeholder theorist names with your key targets.  
  -   Ensure the "Failure Checkpoint" in Month 2 feels credible to you.  
  -   Briefly hint at *which* generalist journal you’d target (e.g., *Journal of Political Philosophy*, *Political Studies*).  
  -   Add 1 sentence on your unique qualification to tackle this (e.g., "Building on my prior work on deliberative legitimacy...").

  This framework forces clarity on the tension you’ve astutely identified and provides a viable path to a compelling paper within one semester. Good luck!
