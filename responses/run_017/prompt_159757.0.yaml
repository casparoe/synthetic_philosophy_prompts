  ## From the Editors of *The Journal of Ontological Arbitration*  
  **Volume 7, Special Policy Supplement**  
  *(Circulated Internally; For Immediate Implementation)*

  ---

  ### MEMORANDUM  
  **To:** All Associate Editors, Reviewers, & Prospective Authors  
  **From:** Dr. Evelyn Thorne, Editor-in-Chief  
  **Subject:** Streamlining Editorial Policy for Dispute Resolution  

  Recent statistical analysis (see Appendix Γ) confirms that 100% of ontological disputes submitted to *JOA* are resolvable through charitable retranslation into framework-neutral paraphrases. Consequently, arguments asserting substantive disagreements demonstrably fail to meet our core criterion: the identification of irreconcilable, non-verbal divergence. Effective immediately, *JOA* will cease publication of "position papers" advocating ontological theses. We now exclusively publish **Retranslation Manuals** – concise documents providing charitable mappings between disputants’ idiolects, demonstrating the verbal nature of their disagreement via neutral paraphrase. Manuscripts presenting arguments for the non-verbal nature of a dispute, or asserting the privileged status of a vocabulary (e.g., "joint-carving," "Ontologese"), will be evaluated solely on their potential for conversion into a Manual. Authors are directed to Template Set 7.3 for submission guidelines. Our mission remains unchanged: dissolving ontological perplexity by pinpointing linguistic divergence. Let us speak *about* language, not *within* it unreflectively.  

  ---

  ### MANUSCRIPT DECISION TEMPLATES (Set 7.3)  
  *All fields marked [*...*] require Editor completion. Standard House Style applies.*

  **Template 1: Standard Verbal Dispute Rejection**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*"On the Ontological Status of [Entity Type X]"*]  
  Dear [*Author(s)*],  

  The Editorial Board has reviewed your manuscript concerning the dispute between proponents of "[*Position A*]" and "[*Position B*]". Our analysis confirms the following:  
  1.  Both parties agree on all relevant non-ontological facts pertaining to [*Entity Type X*] (e.g., [*list specific agreed-upon facts, e.g., causal roles, observable behaviors, mathematical descriptions*]).  
  2.  The disagreement manifests solely in the application of ontological vocabulary (e.g., "exists", "fundamental", "object") to these agreed-upon facts.  
  3.  A neutral paraphrase (e.g., [*briefly sketch paraphrase using framework-neutral terms like "is describable within the framework F under constraints C" or "plays functional role R in system S"*]) is readily available, dissolving the appearance of substantive disagreement by capturing the shared factual content while suspending the disputed vocabulary.  

  Therefore, the dispute is diagnosed as verbal. *JOA* no longer publishes arguments diagnosing disputes as verbal; we publish the Retranslation Manuals that *demonstrate* the dissolution. We encourage you to reframe your analysis as a Manual per Template 4 and resubmit.  
  Sincerely,  
  The Editors  

  **Template 2: Mutual Truth (Idiolect-Specific) Notification**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*"A Defense of [Position Y] Against [Position Z]"*]  
  Dear [*Author(s)*],  

  Thank you for submitting your manuscript regarding the [*Framework Y*] vs. [*Framework Z*] debate. The Board finds that:  
  1.  The sentence "[*Key Sentence from Y-Proponent*]" is true relative to the linguistic conventions of [*Framework Y*].  
  2.  The sentence "[*Key Sentence from Z-Proponent*]" is true relative to the linguistic conventions of [*Framework Z*].  
  3.  There is no framework-independent fact of the matter concerning which framework's conventions are "correct" or "joint-carving" in any absolute sense; each is pragmatically adequate for describing the agreed-upon domain ([*Specify Domain, e.g., medium-sized dry goods, quantum fields*]).  

  The dispute is thus terminological, not substantive. *JOA* does not adjudicate between idiolects. Please cease correspondence on this matter and direct further debate toward constructing a mutual Retranslation Manual.  
  Sincerely,  
  The Editors  

  **Template 3: Recursive Dissolution of "Non-Verbal" Objection**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*"Objection: The Dispute Concerning [Entity W] is NOT Verbal"*]  
  Dear [*Author(s)*],  

  We received your objection to our prior dissolution (Ref: [*Previous JOA Decision ID*]) of the dispute regarding [*Entity W*]. Your objection hinges on the claim that [*Summarize Objection's Core Assertion, e.g., "the concept 'fundamental' carves reality at the joints," "the disagreement persists even after all non-ontological facts are agreed"*].  

  Our analysis finds:  
  1.  The Board and you agree on the *facts* concerning the prior dissolution process and the dispute's parameters.  
  2.  The disagreement manifests solely in the application of the term "verbal dispute" and associated concepts (e.g., "substantive," "merely linguistic").  
  3.  A neutral paraphrase of your objection is available: "Within the linguistic framework presupposed by the objection, the label 'non-verbal dispute' applies." This paraphrase suspends the disputed vocabulary ("verbal," "substantive") while capturing the core assertion about framework-internal classification.  

  Therefore, *your objection to the dissolution itself exemplifies the verbal nature of disputes about the verbal/non-verbal distinction*. This diagnosis applies recursively to any further meta-objection.^(1) We reiterate the invitation to submit a Retranslation Manual.  
  Sincerely,  
  The Editors  

  **Template 4: Revise & Resubmit (Argument → Retranslation Manual)**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*Original Argumentative Title*]  
  Dear [*Author(s)*],  

  While the *JOA* Board finds the ontological dispute analyzed in your manuscript ([*Briefly restate dispute*]) to be verbal (aligning with our core mission), the manuscript's current argumentative format is no longer suitable for publication. However, the analysis contains valuable material for a Retranslation Manual.  

  We invite you to revise and resubmit as a **Retranslation Manual** with the following structure:  
  I.   **Disputed Terms:** List key ontological terms from each framework (e.g., "exists*", "fundamental#", "object†").  
  II.  **Agreed Facts:** Summarize the non-ontological facts both frameworks describe.  
  III. **Neutral Paraphrase:** Provide a framework-neutral description capturing the agreed facts, avoiding the disputed terms.  
  IV.  **Mapping Rules:** Define explicit rules for translating statements using the disputed terms in Framework A into equivalent statements in Framework B (and vice versa), showing how both map onto the neutral paraphrase.  

  The Manual should be concise (≤ 3000 words) and avoid argumentative claims about which framework is "correct."  
  Sincerely,  
  The Editors  

  **Template 5: Response to Ontologese Proponent**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*"Ontologese and the Privileged Structure of Reality"*]  
  Dear [*Author(s)*],  

  Thank you for your manuscript advocating for the privileged status of Ontologese as the vocabulary that "carves reality at the joints." The Board acknowledges the internal coherence and ambition of the proposed framework.  

  However, *JOA*'s editorial policy requires evaluating all ontological claims, *including claims about joint-carving or privileged frameworks*, through the lens of charitable retranslation. From this perspective:  
  1.  The statement "Ontologese carves at the joints" is true relative to the linguistic conventions of the framework presupposing the concept of "joint-carving" as fundamental and privileged.  
  2.  Alternative frameworks (e.g., quantifier variantist, neo-Carnapian) possess different conventions where "joint-carving" is either relativized, deemed pragmatic, or absent.  
  3.  A neutral paraphrase dissolving the dispute about privilege is available: "The framework labeled 'Ontologese' by its proponents employs a specific set of syntactic and semantic rules (detailed in [*Cite Author's Description*]) which its proponents value highly for reasons [*List Pragmatic Reasons: e.g., simplicity, unity, predictive power*]."  

  We invite submission of a Manual retranslating Ontologese statements into equivalent statements within a quantifier variantist framework (or vice versa), demonstrating the verbal nature of the dispute concerning its "privileged" status.  
  Sincerely,  
  The Editors  

  **Template 6: Second-Order Variance Conundrum (Board Split)**  
  Manuscript ID: [*JOA-2024-XXX*]  
  Title: [*"The Dissolution of Dissolution: Second-Order Quantifier Variance"*]  
  Dear [*Author(s)*],  

  The Board is currently unable to reach a decision on your manuscript concerning the application of quantifier variance/deflationary techniques to the *concept of a "verbal dispute" itself*. The core argument – that declaring a dispute "merely verbal" is only true relative to a meta-framework not itself non-arbitrarily privileged – presents a unique challenge.  

  The Board split as follows:  
  *   **Faction A:** Advocates accepting the paper as a *sui generis* Retranslation Manual demonstrating the dissolution of the "verbal dispute" concept across meta-frameworks.  
  *   **Faction B:** Advocates dissolving the paper's argument via Template 3, as the disagreement *about* whether dissolution applies at the meta-level itself appears verbal (i.e., true only relative to frameworks accepting/rejecting second-order variance).  

  Crucially, Faction B notes that *their proposed dissolution of your argument is precisely the maneuver your paper predicts and incorporates*, while Faction A argues this demonstrates the paper's success as a Manual. We are trapped in the regress your paper describes.^(2) Pending further consultation, we request you provide a Retranslation Manual mapping Faction A's acceptance framework onto Faction B's dissolution framework.  
  Sincerely,  
  The Editors (Pro Tempore)  

  ---

  **(Enclosure: Sample Correspondence)**

  *   **From:** Prof. Silas Stone, Dept. of Metaphysical Geology, Rockwell University  
  *   **Subject:** Objection to JOA-2024-187 Decision ("Granite Aggregates: Objects or Processes?")  

  "Dear Editors, Your dissolution of the granite dispute is self-refuting! By declaring our realist position ('Granite objects exist fundamentally') merely 'true in its idiolect,' you tacitly presume YOUR framework (where 'exists fundamentally' is framework-relative) is the privileged one capable of *correctly* diagnosing verbal disputes. This is blatant hypocrisy. You claim neutrality while imposing a deflationist meta-ontology. Our dispute is substantive – it's about what reality *actually* contains! Your policy renders serious ontology impossible. Revoke the decision or publish our rebuttal!"  

  *   **Reply (Using Template 3 & 2):**  
  Dear Prof. Stone,  
  We received your objection to JOA-2024-187. Our analysis finds:  
  1.  We agree on the facts: the dispute concerns granite, the decision was issued, and you object.  
  2.  The disagreement manifests in the application of terms like "self-refuting," "privileged framework," "hypocrisy," "substantive," "*actually* contains," and "serious ontology."  
  3.  A neutral paraphrase is available: "Within the linguistic framework presupposed by Prof. Stone's objection, the label 'substantive dispute' applies, and the label 'hypocrisy' applies to the Journal's procedures." This paraphrase suspends the disputed vocabulary.  

  Therefore, your objection itself exemplifies the verbal nature of meta-ontological disputes. The statement "The dispute is substantive" is true relative to your framework's conventions; "The dispute is verbal" is true relative to our editorial framework. *JOA* does not adjudicate between such meta-frameworks. We invite submission of a Manual retranslating "substantive dispute" claims into "verbal dispute" claims (or vice versa).  
  Sincerely,  
  The Editors  

  ---

  **Template 7: Auto-Dissolution of Editorial Policy**  
  Manuscript ID: [*N/A - Internal Policy Document*]  
  Title: *JOA* Editorial Policy v7.3 (Retranslation Mandate)  
  **Memorandum to:** All Editorial Staff, Publishers, Subscribers  
  **From:** Dr. Evelyn Thorne, Editor-in-Chief (Acting)  
  **Subject:** Implementation Status of Policy v7.3  

  A rigorous application of Policy v7.3 (Retranslation Mandate) to the Policy itself yields the following:  
  1.  Agreement exists on the *factual content* of the Policy's text and its implementation procedures.  
  2.  Disagreements concerning the Policy (e.g., "It dissolves ontology," "It enables ontology," "It is self-refuting," "It is pragmatically necessary") manifest solely in the application of ontological and meta-ontological vocabulary ("verbal," "substantive," "correct," "privileged," "self-refuting").  
  3.  A neutral paraphrase is available: "A set of procedures labeled 'Policy v7.3' is followed by agents labeled '*JOA* Editors,' involving the generation of texts labeled 'Retranslation Manuals' in response to submissions labeled 'ontological disputes.'"  

  Therefore, *Policy v7.3 itself constitutes a verbal dispute about the nature of ontological disputes*. By the Policy's own criteria, it does not establish a substantive truth; it merely reflects the linguistic conventions of the *JOA* editorial framework. Consequently, the Policy has never asserted anything non-verbally.^(3)  

  **Practical Note:** Despite this auto-dissolution, the *procedures* outlined in Policy v7.3 and Template Set 7.3 will continue to be followed diligently for operational continuity. Manuscript submissions remain open. Subscription invoices for 2025 will be issued as scheduled.^(4)  

  Sincerely,  
  The Editors (Functionally Designated)  

  ---
  **HOUSE STYLE FOOTNOTES:**  
  ^(1) *See JOA Style Guide §4.7: "Recursive objections are self-applicable instances of the phenomenon they dispute, providing their own dissolution."*  
  ^(2) *This impasse aligns with predictions in JOA-2024-XXX. The Board requests the authors assist in resolving its internal verbal dispute about their manuscript.*  
  ^(3) *This conclusion is true relative to the *JOA* editorial framework as defined pre-auto-dissolution. Alternative frameworks may yield different results.*  
  ^(4) *Operational continuity is a pragmatic necessity unrelated to ontological commitments. Inquiries regarding subscriptions should be directed to accounts@joa-arbitration.org. The Editorial Assistant has queried whether this necessitates changing the journal's name to "The Manual of Ontological Retranslation." Under review.*
