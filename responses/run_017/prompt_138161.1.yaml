prompt: |-
  hey — I could use some help turning a half-baked argument into an actual proposal document. I'm writing a ~5,000 word paper for a grad seminar on democratic theory, and I'd like it to double as a prospectus for a bigger project later, so it needs to read like a plan for work I haven't done yet, not like an op-ed.

  The background: I got into an argument with my flatmate about compulsory voting (she's Australian so she thinks it's totally normal, I was raised on the forcing-people-to-vote-is-illiberal line), the conversation slid into whether 16-year-olds should vote, and then into whether long-term legal residents who aren't citizens should get the vote in national elections. What struck me afterwards is that these three debates almost never talk to each other and they run on completely different arguments. Compulsory voting is defended in terms of civic duty, or civic virtue, or as anti-corruption / anti-free-riding. Lowering the voting age is defended either by claiming teenagers are competent enough or by appealing to something like the all-affected-interests principle (they'll live longest with the consequences, climate etc.). Non-citizen voting gets the all-affected principle plus some denizenship or stakeholder story about being subject to the law. And the objections are different too: coercion or illiberalism in the first case, competence in the second, membership and collective self-determination in the third. My supervisor's read is that this is just three separate applied questions and I should pick one, and I don't want to do that.

  Here's the angle I want to try, which I'm not sure survives. Standard thinking treats voting as something an individual does — expresses a preference, exercises autonomy, participates in authorizing a government — and on that picture the three questions really are separate. But there's another picture on which what matters is the aggregate output, and the electorate matters as a kind of sample of the governed: with voluntary turnout the people who actually show up are systematically unrepresentative (older, richer, more educated, more partisan), and that makes outcomes worse in a way that has nothing to do with anyone's individual duty or self-development. Call it the electorate-as-sample view. It has some consequences I can't get my head around and that's the part I want to make into a question. (i) It's not a duty argument at all, so it should be immune to the liberal coercion objection, but it also seems to make voting *optional in principle* if you could get representativeness some other way, which feels like it gives up too much. (ii) Sampling logic doesn't require any individual unit to be competent or well-informed — a poll doesn't need every respondent to be an expert, it needs an unbiased sample and enough of them — so the competence objection to lowering the voting age loses most of its bite, which seems too fast and is probably where the view breaks. (iii) Sampling logic forces you to say who exactly the population is that you're sampling from, which pushes toward including non-citizen residents (they're governed too) and then toward making them vote as well, and toward residence thresholds that look arbitrary in a way that matters much more under this view than under a membership view. There's probably a fourth thing: if the sample is what matters, it's unclear why we should care about *ballots* rather than, say, compulsory turnout with a formal abstention option.

  What I want from you: a proposal, not an essay. Give me the question stated precisely enough that it has some determinate answer rather than being three questions stapled together; say why the existing positions (duty-based and virtue-based defences of compulsory voting, competence-based and affectedness-based arguments about who gets the franchise, membership-based objections to non-citizen voting) leave it open; give me the method — what I'd actually do section by section over a semester, and why that approach rather than the obvious alternatives (I specifically don't want a comparative survey of which countries do what, and I don't want to spend the paper on empirical turnout research — assume I can stipulate the empirical claims and say so); say what a positive result would look like and what a useful negative result would look like; and be honest about what would count as the project failing. My supervisor's worry, which I partly share, is that electorate-as-sample is just sortition with extra steps, or a metaphor dressed up as an argument, and that even if it works it can't generate determinate answers about age or residence thresholds. Also: no bibliography, no citations, and please don't invent any — I'll fill that in myself. And tell me if I'm honestly trying to write three papers at once and should cut one of the three sub-questions.
reasoning: |-
  Okay, the user is a grad student working on a seminar paper that also needs to serve as a prospectus for a larger project. They're frustrated because their supervisor wants them to focus on just one of three voting reform debates (compulsory voting, lowering voting age, non-citizen voting), but they've noticed these discussions happen in isolation using different arguments. Their key insight is that an "electorate-as-sample" approach could unite these debates by focusing on representativeness rather than individual rights or duties. 

  Hmm, their core tension is interesting - they want to resist the fragmentation of these topics but worry their unifying framework might be dismissed as "sortition-lite" or too metaphorical. The supervisor's skepticism is valid but the student's frustration with disconnected literatures feels justified too. 

  Let me unpack their key concerns: First, the coercion problem - if we care about the sample, is forcing people to vote still necessary? Second, competence becomes less important under this view, which seems counterintuitive. Third, defining the sampling population pushes toward including non-citizens, creating residency threshold headaches. And fourth, the ballot vs. turnout question. 

  The user's request is very specific: they want a tight proposal structure, not a draft. No citations, no comparative surveys, just clean conceptual work. They're self-aware about potential weaknesses and want honesty about failure modes. Smart - they're thinking like a scholar already. 

  *scratches head* The real challenge is avoiding three half-arguments. The solution might be to make the sampling logic itself the focus - testing whether it can actually generate coherent answers across these domains. That's a single question: "Does shifting to an electorate-as-sample framework resolve tensions between these reforms' normative justifications?" 

  For method, they're right to avoid empirics - this needs philosophical heavy lifting. Section 1 establishes the disconnection in current debates. Section 2 builds the sample view rigorously, distinguishing it from sortition. Sections 3-5 stress-test it against each reform's objections. Crucially, each test should probe if the framework offers new solutions or just relabels problems. 

  *checks watch* The failure condition matters most. If the sample view collapses into utilitarianism or can't handle threshold questions, that's useful too - shows these debates might be irreconcilable. Should emphasize that in the proposal. 

  ... Wait, did they mention ballot secrecy? Might be relevant when discussing compulsory turnout. *makes note to include* 

  *deep breath* Alright, structure feels solid. Their flatmate debate sparked something genuinely novel here - just needs academic framing. Supervisor's concerns get addressed head-on in the "risks" section. Time to write.
answer: |-
  Here’s a structured proposal focusing on your core insight, designed as a prospectus with a clear question, method, and stakes. It avoids stapling three debates together by treating them as stress tests for your "electorate-as-sample" (EAS) framework.

  ---

  **Project Title:** Representativeness as the Normative Core of Suffrage? Testing the "Electorate-as-Sample" Framework in Democratic Theory

  ### Core Research Question
  Can a rigorously developed "electorate-as-sample" (EAS) framework — which evaluates voting rules primarily by how well the *aggregate voting body* represents the demographic and experiential diversity of those governed — resolve persistent normative deadlocks in the debates over compulsory voting, lowered voting age, and non-citizen suffrage, *without collapsing into existing duty-based, competence-based, or membership-based paradigms*?

  ### Why Existing Debates Leave This Open
  Current approaches treat suffrage questions as distinct because they prioritize *individual* attributes (duty, competence, membership) or *individual* interests (affectedness). Duty/coercion arguments (for compulsory voting) ignore systemic representativeness. Competence arguments (against youth voting) ignore aggregate sampling properties. Membership arguments (against non-citizen voting) evade defining the "governed population." The EAS framework shifts the locus of justification to the *systemic output* (a representative sample), making it orthogonal to these individual-focused objections and potentially offering a unified evaluative standard. Existing theories haven’t seriously engaged this shift.

  ### Methodology: Conceptual Stress-Testing
  This is a *normative-conceptual* project. I will rigorously construct the EAS framework and then systematically "stress-test" it against the core objections in the three reform debates, evaluating whether it offers coherent, distinctive, and normatively plausible resolutions. Empirical claims (e.g., about turnout bias, youth/information correlation, non-citizen demographics) will be *stipulated based on established literature* to focus on conceptual implications. Sections:

  1.  **The Disconnect & the Need for a New Frame:**
      *   Diagnose the fragmentation: Map the distinct (and often incompatible) normative logics governing the three debates (duty/coercion vs. competence vs. membership).
      *   Identify the shared problem they inadequately address: **Systematic misrepresentation of the governed population in policy outcomes.**
      *   Motivate EAS as a response: Argue that representational accuracy is a distinct, fundamental democratic value often obscured by individualist framings.

  2.  **Articulating the Electorate-as-Sample (EAS) Framework:**
      *   Core Analogy: Define the electorate’s role as analogous to a statistical sample aiming to minimize bias in estimating the "will" or "interests" of the governed population.
      *   Key Principles:
          *   **Primacy of Aggregate Representativeness:** The *collective composition* of voters matters more than any individual voter's attributes or actions.
          *   **Population Definition is Foundational:** Who constitutes the "governed population" (GP) is the *prior* and critical question (setting aside membership/citizenship as default).
          *   **Minimal Individual Requirements:** Individual competence/duty are secondary; the focus is on minimizing systemic bias in the sample (electorate) relative to the GP.
          *   **Outcome-Oriented Justification:** Rules are justified by their contribution to a representative sample, not individual rights/duties per se.
      *   *Distinguish from Sortition:* EAS uses voting to *express* the sample's aggregated views; sortition uses random selection to *constitute* the decision-makers. EAS retains mass participation via voting.

  3.  **Stress-Test 1: Compulsory Voting & the Coercion Objection**
      *   *EAS Implication:* Compulsion is a tool to correct sampling bias (e.g., under-representation of youth, poor). It’s not about duty; it’s about statistical adjustment. *Optionality is possible only if representativeness is achieved voluntarily.*
      *   *Stress-Test:* Does this neutralize the liberal coercion objection by shifting justification from individual duty to collective outcome? Does it imply compulsory voting is *contingent* (only needed if voluntary turnout is biased)? What about the "formal abstention" option (e.g., blank ballot)? (Addresses your "optionality" point).

  4.  **Stress-Test 2: Lowering the Voting Age & the Competence Objection**
      *   *EAS Implication:* If 16-17 year olds are part of the GP (subject to laws, impacted long-term), excluding them creates sampling bias. Individual competence is irrelevant to inclusion; only their membership in the GP matters for representativeness. Aggregate "wisdom of crowds" compensates for individual knowledge gaps.
      *   *Stress-Test:* Does this render the competence objection largely moot? Does it force a clearer justification for *why* minors might be excluded from the GP definition? What are the limits? (Addresses your "competence" point).

  5.  **Stress-Test 3: Non-Citizen Suffrage & the Membership Objection**
      *   *EAS Implication:* Defining the GP as "all long-term residents subject to binding laws" pushes strongly toward inclusion. Membership (citizenship) is irrelevant to being governed. Residence duration thresholds become critical technical tools to avoid transient population noise, not markers of belonging.
      *   *Stress-Test:* Does this definitively overcome the "collective self-determination" objection by redefining the "self" as the governed population? Does it expose the arbitrariness of citizenship-based exclusion? How does it handle defining "long-term" without resorting to membership? (Addresses your "residence thresholds" point).

  6.  **Synthesis & Limits of EAS:**
      *   Assess: Does EAS provide a coherent, unified normative logic resolving the deadlocks? Does it offer *distinct* answers?
      *   Confront Core Critiques:
          *   Is EAS just utilitarianism/outcome-ism dressed up? Does it sacrifice important individualist values?
          *   Can it genuinely avoid collapsing back into competence/membership arguments when pressed (e.g., defining GP limits, severe cognitive impairment)?
          *   Does it generate determinate answers, or just shift arbitrariness (e.g., to GP definition/residency thresholds)?
          *   What about non-demographic representation (e.g., interests, values)? (Sampling demographics is a proxy; acknowledge limitations).

  ### Deliverable & Contribution
  A 5,000-word seminar paper establishing the EAS framework and conducting the initial stress-tests, laying the groundwork for a future dissertation/book project expanding the framework and tests to other suffrage questions (felons, cognitive capacity) and institutional designs (proportional representation, districting).

  ### What Success Looks Like
  1.  **Positive Result:** Demonstrating that EAS provides a *novel, coherent, and productive* normative framework that resolves specific deadlocks in the three debates (e.g., defangs coercion/competence/membership objections *on its own terms*), forces a primary focus on defining the governed population, and reveals hidden connections between seemingly disparate reforms.
  2.  **Useful Negative Result:** Showing precisely *where* EAS fails to provide distinct or plausible answers (e.g., cannot resolve threshold arbitrariness without smuggling in membership concepts; cannot fully dispense with minimal competence; leads to unacceptable trade-offs with liberty). This clarifies the necessary limits of outcome-oriented approaches and the enduring role of non-consequentialist values.

  ### Failure Conditions
  The project fails if:
  1.  **EAS is reducible:** It becomes clear EAS is merely a restatement of utilitarianism, instrumental justifications for democracy, or sortition logic, offering nothing conceptually new.
  2.  **Indeterminacy wins:** EAS proves incapable of generating any determinate guidance on key parameters (GP definition, residency thresholds) without circularly relying on the very concepts (citizenship, competence) it seeks to bypass.
  3.  **No distinctive resolutions:** The stress-tests reveal that EAS either collapses into existing arguments when pressed or offers solutions normatively *less* attractive than the status quo (e.g., justifying excessive coercion without individualist safeguards).

  ### Addressing Your Supervisor's Concerns (Within the Proposal)
  *   **"Sortition with extra steps?":** Explicitly differentiate EAS (voting by a representative *sample*) from sortition (random *rulers*). Argue voting retains mass agency in expression, even if selection rules aim for representativeness.
  *   **"Metaphor not argument?":** Rigorously define the analogy's scope and limits. Ground its normative force in the value of accurate representation for democratic legitimacy and outcome quality.
  *   **"Can't generate determinate answers?":** Confront this head-on. The stress-tests *are* the attempt to see if it can. Success might be partial (resolving coercion/competence objections but struggling with thresholds). Acknowledge that forcing clarity on GP definition *is* a form of progress, even if difficult.

  ### Cutting a Sub-Question?
  **No, do not cut one.** Their isolation is the *problem* your framework addresses. Cutting one weakens the case for EAS as a *unifying* approach. The stress-test methodology binds them together conceptually.

  ---

  **Why this approach works for your goals:**

  1.  **Single, Precise Question:** Focuses on whether EAS *resolves deadlocks* across the three areas.
  2.  **Prospectus-Ready:** Clearly outlines a multi-stage argument (Framework build -> Stress-tests -> Evaluation), scalable to a larger project.
  3.  **Methodologically Clear:** Conceptual analysis/stress-testing with stipulated empirics. Avoids comparatives/empirics as requested.
  4.  **Embeds Supervisor's Concerns:** Directly addresses "sortition," "metaphor," and "indeterminacy" as core risks within the evaluation.
  5.  **Defined Success/Failure:** Clear metrics for what constitutes a positive, useful negative, or failed outcome.
  6.  **Leverages Your Insight:** Makes the "electorate-as-sample" the central, driving innovation.

  This structure forces you to develop EAS rigorously *first*, then see if it *works* across the cases. It transforms your flatmate argument into a testable theoretical proposition. Good luck!
