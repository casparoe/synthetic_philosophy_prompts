prompt: |-
  You are a professional philosopher who works on collective action, expected difference-making, and the ethics of individual contributions to structural harms, and who has also designed and run simulation-based teaching for years. Before drafting, please brainstorm at least three genuinely different candidate activities for my group and then pick one, telling me in a short paragraph why you rejected the other two — I want to see the design space rather than only the winner, and I would rather have one activity that has been stress-tested in your head than three sketched ones.

  The setting: I co-convene a student-run practical ethics reading group at a Dutch university — advanced undergraduates and master's students, around 18 people, mixed backgrounds (philosophy, economics, computer science, one biologist), one 90-minute evening session, one seminar room with movable tables, index cards, pens, a projector, and a phone-based random number generator or a die. I can spend up to about forty euros of the society's budget as a real stake (a charity donation or something to share at the end), but no real money should change hands among participants. The topic became personally urgent last month: two members almost fell out in front of everyone, one arguing that giving up beef is pointless because supermarket and abattoir orders move in bulk thresholds and her single cart changes nothing, the other replying that this style of reasoning would excuse literally everything and invoking Parfit-style cases in which each of very many tiny acts is on its own imperceptible while the aggregate is a serious harm. They are both friends of mine, both partly right, and I do not want either of them to win the evening — I want the structure of the inefficacy objection to be something the group walks into and trips over, before I ever name it.

  So here is the design brief. No lecture up front: the words threshold, pivotal, expected utility, and inefficacy objection should not be spoken by me until the final debrief. Arrange the rules, roles, incentives, and information conditions so that participants hit the problem themselves. I'd like at least three short rounds that differ only in causal structure: one in which a good outcome requires crossing a threshold that everyone can see, with enough participants that each person can work out that her own act changes nothing unless the count of others lands exactly at the boundary; one in which the threshold is hidden or drawn randomly from a range, so that each individual act has a small but real chance of making the difference and nobody can know whether tonight was such an occasion; and one with no threshold at all, where contributions simply add a small increment to a continuous outcome. Please also tell me whether to give each participant a private card with a private cost of contributing (a small real sacrifice such as a chore, a seat, or five extra minutes) and possibly a private stake in the outcome, or whether that heterogeneity will muddy the effect I am after. Give me the materials list, the exact rules, the payoff scheme, the wording I can read aloud, and a minute-by-minute timeline for the 90 minutes. Two further constraints: first, keep the thing from collapsing into an ordinary assurance or prisoner's-dilemma game — the felt pull should be *my contribution makes no difference*, not *I would be a sucker if others free-ride*, so tell me how the rules block that reading; second, have everyone write down a one-sentence private reason before any outcome is revealed, so the debrief can work from what they actually said. Then give me the debrief: a script that maps specific moments in the activity onto the distinction between making no actual difference and making no expected difference, onto which real cases are threshold-like and which are continuous (emissions and possible tipping points, bulk purchasing in supply chains, being the decisive vote in a large electorate), onto the step from *I make no difference* to *nothing is therefore required of me*, including both the move that generalizes the excuse to everyone and the move that locates the wrongdoing at the level of the group rather than the member, and onto what I should say to someone who cheerfully bites the bullet and says a one-in-many chance of mattering is simply to be ignored. Finally, be blunt about the first-run failure modes you would predict — participants assuming I am bluffing about the rule, the economics students computing pivotality and dissolving the experience, someone abstaining for cost reasons so I cannot tell which reason was operating, the group coordinating out loud when I wanted simultaneous private choices — with a fix for each, and be equally blunt about which parts of the philosophical debate this format simply cannot stage and which I will have to supply in discussion myself, such as our empirical ignorance about whether the real-world cases have thresholds at all, group-level, complicity-based or expressive reasons for acting, repeat-play and precedent effects, and the deeper disagreement about whether very small probabilities of very large stakes should simply be aggregated.
reasoning: |-
  We are designing an interactive simulation for a 90-minute session with 18 participants. The goal is to have participants experience the inefficacy objection in three distinct causal structures (threshold-visible, threshold-hidden, continuous) without using technical terms until the debrief. We want to avoid the "sucker" feeling and focus on the "my contribution makes no difference" feeling. We also want private written reasons before outcomes are revealed.

  Constraints:
  - No money changing hands among participants.
  - Up to €40 for a real stake (e.g., charity donation or shared item).
  - Private costs for contributing (small real sacrifice) might be included, but we must decide if heterogeneity muddies the effect.

  Brainstorming three candidate activities:

  1. **Charity Donation Threshold Game**: 
     - The group must collectively reach a threshold of contributions to unlock a donation (e.g., €40 to a charity). Each participant can choose to contribute (sacrifice a small comfort, like standing for part of the session) or not. The threshold is set at a fixed number (e.g., 12 out of 18) and visible in the first round. In the second round, the threshold is hidden (drawn randomly from a range, say 10-15) and participants don't know the exact number. In the third round, there's no threshold; every contribution adds a fixed amount (e.g., €0.50) to a donation that will be made regardless. 
     - **Why reject?**: The real sacrifice (standing) might be trivial and not taken seriously, and the donation is a group good, which might trigger assurance problems (fear of being a sucker) rather than the inefficacy objection. Also, the continuous round might feel too different because the donation always happens but varies in amount.

  2. **Seat Upgrade Game**:
     - Participants are initially seated on uncomfortable chairs. Contributing (paying a private cost: e.g., writing a short reflection during the session) can "upgrade" the seating. In the threshold version, if at least X contribute, everyone (including non-contributors) gets a comfortable chair. In the hidden threshold, the required number is a secret. In the continuous version, each contribution improves the average comfort (e.g., by replacing one uncomfortable chair with a comfortable one, but non-contributors might still get the upgrade if there are extras). 
     - **Why reject?**: The free-rider problem is very salient (non-contributors benefit if the threshold is met) and might overshadow the inefficacy concern. Also, the continuous version is hard to implement fairly (who gets the upgraded chairs?).

  3. **Extra Minutes Game**:
     - The session is scheduled for 90 minutes. Contributing means agreeing to stay 5 extra minutes (a real cost). The benefit: in the threshold rounds, if enough contribute (e.g., 12), everyone (including non-contributors) gets an extra 10 minutes of break at the end (so net gain for contributors is 5 minutes, for non-contributors 10). In the hidden threshold, the required number is random. In the continuous round, each contribution adds 30 seconds to the break for everyone (so even one contribution gives a small break, but non-contributors free-ride). 
     - **Why reject?**: The benefit is a public good, so free-rider incentives are strong. Also, the continuous version might not clearly separate the inefficacy objection because each contribution does make a small difference.

  **Chosen Activity: "The Snack Fund"**

  I choose a modified version of the first idea but with a twist to avoid the free-rider problem and focus on inefficacy. We'll use a real snack budget (or charity donation) as the stake. To block the "sucker" interpretation, we structure it so that non-contributors do not benefit from the group outcome. Instead, the outcome is a fund that is used to buy snacks (or donated) but only contributors are eligible to enjoy the snacks (or have a say in the charity). This way, if you don't contribute, you don't get any benefit, so there's no free-rider issue in the usual sense. The inefficacy objection arises because your contribution may not be pivotal for unlocking the fund.

  **Structure**:
  - Three rounds, each with a different causal structure.
  - In each round, participants decide privately whether to contribute (pay a private cost) or not.
  - The private cost: In each round, contributing requires writing a short sentence (on an index card) about a topic I assign (so it's a small effort). This is the same for everyone, avoiding heterogeneity.
  - The benefit: If the contribution threshold is met (in threshold rounds), a fund (e.g., €20) is unlocked and used to buy snacks for the contributors only (or if charity, the contributors get to choose the charity). In the continuous round, every contribution adds a fixed amount (e.g., €1) to the snack fund, and only contributors get snacks (so the total amount determines the quality/quantity of snacks they share).

  **Why this avoids the "sucker" feeling?**: Non-contributors get nothing, so there's no fear that others will free-ride on your contribution. The only reason not to contribute is if you think your effort (writing the sentence) is not worth the (very small or zero) chance of making a difference to whether you get a snack.

  **Rounds**:
  1. **Visible Threshold**: The threshold is set at 12 (out of 18) and announced. If at least 12 contribute, the €20 fund is unlocked. Contributors get snacks; non-contributors get nothing.
  2. **Hidden Threshold**: The threshold is drawn randomly from a uniform distribution between 10 and 15 (inclusive). Participants know the range but not the exact number. Same outcome: if contributions meet or exceed the drawn threshold, €20 is unlocked for contributors.
  3. **Continuous**: No threshold. Every contribution adds €1 to the snack fund (up to €18, but I cap it at €20 for consistency). Only contributors get snacks, and the amount in the fund determines what we buy (e.g., more/better snacks).

  **Materials**:
  - Index cards (at least 18 per round, so 54 cards) and pens.
  - A projector to show the rules and later the results.
  - A random number generator (for the hidden threshold) or a die (but we need a range, so a phone app is better).
  - €40 in cash (or a way to make the donation/buy snacks immediately after).
  - A timer.

  **Private Reason**: In each round, after the rules are explained but before decisions, each participant writes on their card: (1) their decision (contribute or not) and (2) a one-sentence reason for their decision. Then they hand in the card. Decisions are private and simultaneous.

  **Payoff Scheme**:
  - Private cost of contributing: writing a sentence (the topic is different each round to make it not too repetitive).
  - Benefit: In rounds 1 and 2, if the threshold is met, contributors get snacks worth €20 shared among them (so about €1.11 each if 18 contribute, but less if fewer). If not met, contributors get nothing (and wasted their effort). Non-contributors never get anything.
  - In round 3, every contribution adds €1 to the fund. If 10 contribute, the fund is €10, and they share €10 worth of snacks. Non-contributors get nothing.

  **Wording for Each Round**:

  **Round 1 (Visible Threshold)**:
  "Welcome to the first round. In this round, if at least 12 of you choose to contribute, then a €20 snack fund will be unlocked. Only those who contribute will get snacks. Contributing requires you to write one sentence on the topic I'll give. If fewer than 12 contribute, no fund is unlocked, and contributors get nothing. You decide privately. Before you decide, write your decision and one-sentence reason on the card. Then fold it and hand it in."

  **Round 2 (Hidden Threshold)**:
  "This round is similar, but the threshold is hidden. The threshold is a number between 10 and 15, inclusive, chosen randomly after you decide. If the number of contributors meets or exceeds the hidden threshold, the €20 snack fund is unlocked for contributors. Otherwise, nothing. Again, only contributors get snacks if unlocked. Write your decision and reason, then hand in the card."

  **Round 3 (Continuous)**:
  "In this round, there is no threshold. For each person who contributes, €1 is added to the snack fund. Only contributors get snacks, and the total fund determines what we can buy. So if 10 contribute, the fund is €10 and they share €10 worth of snacks. Contributing still requires writing one sentence. Write your decision and reason."

  **Timeline (90 minutes)**:

  - **0:00 - 0:05**: Introduction. Explain we're doing a decision-making activity. No technical terms. Hand out index cards and pens. (5 min)
  - **Round 1 (Visible Threshold)**:
    - **0:05 - 0:10**: Explain rules for round 1. Then assign the writing topic: "Write one sentence about your favorite food." Participants write their decision (contribute or not) and reason, then hand in the card. (5 min)
    - **0:10 - 0:13**: Collect cards. Count contributions and announce if the threshold (12) was met. If yes, note that the €20 fund is unlocked for contributors. (3 min)
  - **Round 2 (Hidden Threshold)**:
    - **0:13 - 0:18**: Explain rules for round 2. Topic: "Write one sentence about a place you'd like to visit." Collect decisions and reasons. (5 min)
    - **0:18 - 0:22**: Collect cards. Draw the hidden threshold (using a random number generator, show it on the projector). Announce if the threshold was met. (4 min)
  - **Round 3 (Continuous)**:
    - **0:22 - 0:27**: Explain rules for round 3. Topic: "Write one sentence about a hobby you enjoy." Collect decisions and reasons. (5 min)
    - **0:27 - 0:30**: Collect cards. Count contributions, calculate the fund (€1 per contribution), and announce the total. (3 min)
  - **0:30 - 0:35**: Break to process the results. I quickly sort the cards by round and decision, and prepare the debrief. Meanwhile, participants can stretch. (5 min)
  - **Debrief (0:35 - 1:30)**:
    - **0:35 - 0:45**: Reveal the aggregate results for each round (how many contributed) and read out *anonymous* reasons from the cards (without saying who, just the reason and the decision). Ask: "What patterns do you see in the reasons? Did the rules of the round affect your reasoning?" (10 min)
    - **0:45 - 1:00**: Introduce the inefficacy objection. "In round 1, if you thought: 'My one contribution won't change anything unless we are exactly at 11 or 12,' that's the threshold problem. In round 2, you might have thought: 'I don't know if we are near the threshold, but my contribution might matter a little.' In round 3, every contribution added a fixed amount." Map to real cases: 
      - Thresholds: Voting in a large election (pivotal only if tied), bulk ordering (if an order must be a full pallet).
      - Hidden thresholds: Climate change (tipping points we don't know exactly), supply chains (we don't know the order thresholds).
      - Continuous: Carbon emissions (each ton adds to the problem), charitable donations (each dollar helps a bit).
    - **1:00 - 1:15**: Discuss the step from "I make no difference" to "nothing is required." Point out: 
      - If everyone reasons that way in a threshold case, the threshold isn't met and harm occurs. 
      - The group as a whole is responsible, but how does that translate to individuals? 
      - For very small probabilities: Should we ignore them? But in round 2, even a 1/6 chance (if the threshold is between 10-15 and we are near the middle) might be worth the small cost. In real life, small chances of large stakes (like preventing a catastrophe) might be very important.
    - **1:15 - 1:30**: Open discussion: "What about cases where we don't know if there's a threshold? What about reasons beyond difference-making, like expressing values or setting an example?" (15 min)

  **Failure Modes and Fixes**:

  1. **Participants assume you are bluffing about the rules**: 
     - **Fix**: Use a real stake (show the €40 at the start) and follow through. In round 2, draw the threshold publicly.

  2. **Economics students compute pivotality and dissolve the experience**: 
     - **Fix**: In the debrief, acknowledge that in round 1, the pivotality is near zero, but in round 2, it's positive. The point is to feel the difference, not avoid calculation. Also, the private reason writing happens before calculation might be done, so they have to act on instinct.

  3. **Someone abstains for cost reasons so you can't tell the reason**: 
     - **Fix**: The private reason card should capture their stated reason. In debrief, we can see if reasons changed across rounds.

  4. **Group coordinating out loud**: 
     - **Fix**: Emphasize private decisions. Have them write silently and hand in immediately. If someone speaks, remind them it's private.

  **What the Format Cannot Stage**:

  - **Empirical ignorance about thresholds in real cases**: We have to discuss this. In debrief, note that we often don't know if a threshold exists (e.g., in climate, there might be tipping points but we don't know where).
  - **Group-level, complicity-based, or expressive reasons**: The simulation is about difference-making. In debrief, introduce these as additional reasons for acting.
  - **Repeat-play and precedent effects**: This is a one-shot game. Mention in debrief that in real life, actions might set examples for future behavior.
  - **Small probabilities of large stakes**: The hidden threshold round has a small probability of making a difference, but the stakes are moderate (€20). Discuss how we handle very small probabilities of existential stakes.

  **Debrief Script**:

  After revealing the anonymous reasons, say:

  "Notice how in round 1, many of you wrote reasons like: 'It won't matter because we won't hit 12' or 'We'll probably hit 12 without me.' This is the threshold problem: your individual act seems not to make a difference because the outcome depends on the collective reaching a threshold. In round 2, reasons might have included: 'It might matter if we are close' or 'There's a chance.' Here, you saw that even if you don't know, your act has an expected impact. In round 3, every contribution added a fixed amount, so it always made a difference.

  Now, let's name this: the inefficacy objection says that if my act makes no difference, why do it? But in round 2, even a small chance of mattering might be worth the small cost. And in round 3, it always mattered.

  In real life:
  - Voting in a large electorate is like round 1: your vote only matters if the election is tied, which is very unlikely. But if everyone thinks that, no one votes.
  - Climate change has both continuous aspects (every ton of CO2 adds to warming) and possible thresholds (tipping points). But we don't know where the thresholds are, so it's like round 2.
  - Buying beef: if supermarkets order by the pallet, your purchase might only matter if it causes a new pallet to be ordered (a threshold), but we don't know the exact stock levels, so again, round 2.

  Now, the move from 'I make no difference' to 'nothing is required' is tempting. But if everyone does that, the harm happens. So we might say the group is required to act, and that duty falls on each member. Even if your act alone doesn't change the outcome, you are part of the group that causes the harm.

  What about someone who says a one-in-a-million chance should be ignored? Well, if the stake is high enough (like preventing extinction), even a tiny chance might be worth acting on. And in many cases, the chance isn't that small. For instance, in round 2, if the group was split, your pivotality might be 1/6 or more.

  But there are other reasons to act: to express your values, to set an example, or to avoid complicity in harm. These don't depend on making a difference. We'll discuss those now."

  Then open the floor.
answer: |-
  ### Brainstormed Candidate Activities
  Before selecting the final design, I brainstormed three distinct activities that meet your core requirements (three causal structures, no upfront lecture, avoiding "sucker" dynamics, private reasons). Here's a summary and why I rejected two:

  1. **"Climate Tipping Points" (Charity Donation with Thresholds)**  
     Participants decide individually whether to "reduce emissions" (pay a small cost: e.g., stand for 5 minutes) to help unlock a €40 charity donation for an environmental cause. Three rounds:  
     - **Visible threshold**: Donation made only if ≥12 contribute.  
     - **Hidden threshold**: Donation made if contributions meet a random threshold (10–15, drawn post-decision).  
     - **Continuous**: Each contribution adds €2 to the donation (no threshold).  
     *Why rejected*: The charity is a pure public good (all benefit, even non-contributors), risking a slide into prisoner’s dilemma/sucker dynamics ("others might free-ride on my sacrifice"). Also, continuous rounds with additive donations feel arbitrary and lack the "zero difference" tension.

  2. **"Voting Blocs" (Policy Change with Pivotal Votes)**  
     Participants are grouped into "blocs" (e.g., 3 groups of 6). Each bloc must reach an internal threshold of "yes" votes to "pass a policy" (win snacks for their bloc). Individual cost: Solve a quick puzzle. Rounds:  
     - **Visible**: Policy passes if ≥4 in a bloc vote yes (threshold seen).  
     - **Hidden**: Threshold random (3–5 per bloc, hidden).  
     - **Continuous**: Each yes vote adds a snack to the bloc’s pool.  
     *Why rejected*: Small groups make pivotal probabilities too salient (economics students will calculate them immediately), undermining the "imperceptibility" experience. Also, bloc competition introduces extraneous group loyalty dynamics, muddying the inefficacy focus.

  3. **"The Supply Chain" (Snack Unlock with Private Benefits)**  
     Participants act as "store managers" deciding whether to "stock ethical products" (pay a cost: write a sentence) to unlock group snacks. Crucially, **only contributors benefit if unlocked**, blocking free-rider/sucker concerns. Three rounds:  
     - **Visible threshold**: Snacks unlocked if ≥12 contribute.  
     - **Hidden threshold**: Snacks unlocked if contributions meet a random threshold (10–15).  
     - **Continuous**: Each contribution adds a snack to the pool (only contributors eat).  
     *Why rejected?* None—this is the winner. It isolates inefficacy by ensuring non-contributors gain nothing, so the *only* reason not to contribute is "my act won’t change the outcome." The snack stake is tangible, and private costs are homogeneous (no muddiness).

  **Winner Rationale**: "The Supply Chain" best isolates the inefficacy objection. By tying benefits solely to contributors, it eliminates prisoner’s dilemma logic ("I’d be a sucker if I contribute and others don’t"). Participants face a pure "does my act matter?" dilemma. Homogeneous costs (writing a sentence) prevent heterogeneity from distracting, and real snacks (funded by your €40) heighten stakes. The three rounds cleanly map to your causal structures while using consistent mechanics.

  ---

  ### Final Activity: "The Supply Chain"
  **Concept**: Participants are "store managers" deciding whether to "stock an ethical product" (contributing) to unlock snacks. Only contributors receive snacks if unlocked. Contribution requires a small, identical effort (writing a sentence), ensuring cost isn't a variable. Three rounds mirror your causal structures: visible threshold, hidden threshold, continuous.  
  **Why it works**:  
  - Blocks "sucker" dynamics: Non-contributors get **no snacks**—benefits are exclusive. The choice is purely "Will my act affect the outcome?"  
  - Elicits inefficacy reasoning: In threshold rounds, participants must confront whether their contribution is pivotal.  
  - Real stakes: Snacks are bought post-activity with your €40 budget (e.g., gourmet cookies or fruit).  

  **Materials**:
  - Index cards (54 total: 18 participants × 3 rounds) and pens.
  - Projector to display rules and results.
  - Phone-based random number generator (for hidden threshold).
  - €40 for snacks (e.g., buy a mix to share among contributors post-activity).
  - Timer.

  **Rules & Payoff Scheme**:
  - **Private cost for contributing**: In all rounds, contributing requires writing one unique sentence on a prompt (e.g., "Describe your favorite season"). This is a small, equal effort cost. Non-contributors do nothing.  
  - **Benefit**: Only contributors are eligible for snacks.  
    - *Threshold rounds* (1 and 2): If the threshold is met, all contributors share €20 worth of snacks. If not, contributors get nothing.  
    - *Continuous round* (3): Each contribution adds €1 to a snack fund (max €18). Contributors split the resulting snacks.  
  - **No free-riding**: Non-contributors never receive snacks.  
  - **Private reason**: Before outcomes, all write their decision ("Contribute" or "Not") and a one-sentence reason on their card. Cards are collected privately.  

  **Wording Script (Read Aloud)**  
  *Introduction (0:00–5:00)*:  
  "We're playing a short game about supply chains. You’re store managers deciding whether to stock an ethical product. In each round, if you contribute, you’ll write one sentence—this is your ‘cost.’ If you don’t contribute, you do nothing. Only contributors get snacks if we unlock them. Decisions are private—write ‘Contribute’ or ‘Not’ and your reason on your card, then hand it in. I’ll reveal outcomes after all cards are in. No talking during decisions."  

  *Round 1: Visible Threshold (5:00–15:00)*:  
  "Round 1: Snacks for contributors are unlocked only if at least 12 people contribute. If we hit 12, contributors share €20 of snacks. If not, contributors get nothing. Write your decision and reason now. Prompt: ‘Describe your favorite season in one sentence.’ You have 2 minutes. Hand in cards." (Collect cards, count contributions, and announce if threshold was met. Do not reveal individual decisions.)  

  *Round 2: Hidden Threshold (15:00–25:00)*:  
  "Round 2: Similar, but the threshold is hidden. It’s a random number between 10 and 15. After you decide, I’ll draw the threshold. If contributions meet or exceed it, contributors get €20 of snacks. Otherwise, nothing. Write your decision and reason. Prompt: ‘Describe your favorite animal in one sentence.’ 2 minutes. Hand in cards." (Draw threshold publicly with RNG after collecting cards. Announce result.)  

  *Round 3: Continuous (25:00–35:00)*:  
  "Round 3: No threshold. For each contributor, €1 is added to a snack fund. Only contributors share the snacks. Example: If 10 contribute, they split €10 of snacks. Write your decision and reason. Prompt: ‘Describe your hobby in one sentence.’ 2 minutes. Hand in cards." (Calculate total fund, announce snack value per contributor.)  

  **Timeline (90 Minutes Total)**  
  - **0:00–5:00**: Intro and rules (5 min).  
  - **Round 1 (Visible)**: 5:00–15:00 (10 min: rules 2 min, decision/writing 3 min, collect/count/announce 5 min).  
  - **Round 2 (Hidden)**: 15:00–25:00 (10 min: same as above).  
  - **Round 3 (Continuous)**: 25:00–35:00 (10 min: same).  
  - **35:00–45:00**: Break and snack prep (buy/display snacks; sort cards for debrief) (10 min).  
  - **Debrief**: 45:00–90:00 (45 min—detailed below).  

  ---

  ### Debrief Script  
  *(Map moments from the activity to key concepts without lecturing upfront. Start experiential, then layer in theory.)*  

  **Step 1: Anonymous Reason Reflection (45:00–55:00)**  
  Project anonymous quotes from cards (mix decisions/reasons). Ask:  
  - "What patterns do you see in reasons across rounds? How did the rules shape your thinking?"  
  - *Key moments*:  
    - Round 1 (visible threshold): Look for reasons like, "Won’t matter unless we’re at 11 or 12," or "Others will do it."  
    - Round 2 (hidden): Look for, "Might matter if it’s close," or "No way to know, so why bother?"  
    - Round 3 (continuous): Look for, "At least I add something."  
  - **Philosophical hook**: "Notice how in Round 1, many felt their act couldn’t change the outcome—this mirrors arguments like ‘one beef purchase doesn’t affect bulk orders.’ In Round 2, uncertainty crept in—like not knowing if emissions will hit a climate tipping point."  

  **Step 2: Introduce the Inefficacy Objection (55:00–65:00)**  
  - "In Round 1, if you thought, ‘My act changes nothing unless we’re exactly at the threshold,’ you hit the *threshold problem*: one act seems imperceptible in a large group. But if everyone thinks that, no one contributes, and the harm happens (no snacks!). This is the inefficacy objection: ‘Why act if I make no difference?’"  
  - Map to real cases:  
    - **Visible threshold**: Voting (your vote matters only if the election is tied), bulk purchasing (supermarkets reorder at pallet-sized thresholds).  
    - **Hidden threshold**: Climate change (tipping points exist but are unknown), supply chains (exact stock thresholds are opaque).  
    - **Continuous**: CO₂ emissions (each ton adds harm), charitable giving (each dollar helps incrementally).  
  - "The objection generalizes: If no one thinks they matter, no one acts, and harm occurs. But does that mean *I’m* off the hook?"  

  **Step 3: Tackling the Objection (65:00–75:00)**  
  - **From "no difference" to "no requirement"**: "Some say, ‘If I make no difference, I’m not required to act.’ But if everyone follows this, the group fails. We might blame the *group* instead—e.g., ‘the meat industry causes harm,’ not ‘my cart caused harm.’ But as members, are we complicit?"  
  - **Small probabilities matter**: "In Round 2, your contribution had a small chance of mattering (e.g., if the threshold was 12 and we had 11, you’d be pivotal). If someone says, ‘A tiny chance isn’t worth acting on,’ ask: What if the stakes are high? In climate change, a 0.1% chance of triggering a catastrophe might justify action. We aggregate small risks in other contexts (e.g., insurance)."  
  - **Challenge bullet-biters**: To "I ignore small chances," respond: "In Round 2, the chance wasn’t tiny—if contributions were spread, pivotality was ~1/6. In real life, thresholds are often hidden (like emissions), so your expected impact isn’t zero. Ignoring it might be reckless."  

  **Step 4: Beyond Difference-Making (75:00–85:00)**  
  Acknowledge limits of the simulation:  
  - "This focused on *difference-making*, but real-world ethics includes:  
    - **Expressive/complicity-based reasons**: Acting to oppose harm, even if futile (e.g., boycotts as protest).  
    - **Precedent/repeat-play effects**: Your act sets norms (e.g., if you quit beef, friends might too).  
    - **Empirical uncertainty**: We often don’t know if thresholds exist (e.g., is climate continuous or threshold-driven?).  
    - **Group obligations**: Even if my act doesn’t matter, I might have duties as a group member."  
  Pose: "Does difference-making exhaust why we should act? Or are there cases where it’s secondary?"  

  **Step 5: Open Discussion (85:00–90:00)**  
  - "How does this apply to the beef debate? What might change if we knew thresholds (like voting) vs. didn’t (like emissions)?"  
  - End by distributing snacks based on round results (contributors only, per rules).  

  ---

  ### Predicted Failure Modes and Fixes  
  1. **Participants assume you’re bluffing about rules**:  
     - *Fix*: Show the €40 cash upfront. For hidden thresholds, draw the number publicly with the RNG.  

  2. **Economics students compute pivotality, ruining the "felt" experience**:  
     - *Fix*: Emphasize speed in decisions ("2 minutes—go with your gut!"). In debrief, acknowledge calculation but stress: "We’re exploring the intuitive pull of ‘I don’t matter,’ not the math."  

  3. **Abstention due to cost masking inefficacy reasoning**:  
     - *Fix*: The cost (writing a sentence) is trivial and uniform. The reason card reveals true motives (e.g., if someone writes, "Writing is annoying," debrief it as cost-avoidance; if "My act won’t help," it’s inefficacy).  

  4. **Group coordination (e.g., whispering "let’s all contribute")**:  
     - *Fix*: Enforce silence during decisions. Preface: "No talking—this is about individual choices." If whispering occurs, restart the round.  

  5. **Skewed results (e.g., threshold not nearly met)**:  
     - *Fix*: Use the reason cards to discuss hypotheticals ("What if we were at 11 in Round 1? How would you feel?").  

  **Limitations of the Format**:  
  - Cannot stage **empirical uncertainty about thresholds** (e.g., real-world ambiguity in climate/supply chains). *Supply in discussion*: Highlight during debrief Step 4.  
  - Cannot capture **repeat-play effects** (e.g., acting to build habits). *Supply*: Discuss in Step 4.  
  - **Small probabilities of large stakes** (e.g., 0.001% chance of catastrophe) is abstract. *Supply*: Use Round 2 as a springboard ("But what if stakes were life-or-death?").  
  - **Non-consequentialist reasons** (expressive/complicity) aren’t incentivized. *Supply*: Introduce in debrief Step 4.  

  This design forces a collision with inefficacy while avoiding common pitfalls. The debrief links moments from the game to your friends' debate, ensuring neither "wins"—the structure itself reveals the complexity. Run it as-is, and adapt timing if discussions run long!
