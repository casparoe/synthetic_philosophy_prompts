answer: |-
  ### Unpacking "Maximize the Geometric Mean, Not the Arithmetic Mean" for Grant Decisions

  You're right to question how the Kelly criterion applies to your foundation's context. The slogan is often invoked as a "theorem," but its relevance depends on specific assumptions. Below, I break down distinct interpretations of the slogan, assess their validity, and evaluate whether they support your trustee's preference for the long-shot grant. Crucially, I address your three focal points: **reinvestment**, **non-identical bets**, and **uncertainty in probability estimates**.

  For clarity, I'll use:
  - **Safe option**: Well-evidenced program, reliable impact per £ (e.g., guaranteed impact \(S\)).
  - **Long shot**: 4% chance of policy change with impact \(H\) (where \(H \gg S\)), 96% chance of impact near zero (assume \(0\) for simplicity).
  - **Arithmetic mean (AM)**: Expected impact = \(0.04H\) for the long shot, \(S\) for safe.
  - **Geometric mean (GM)**: For a single bet, \(\exp(\mathbb{E}[\log(\text{impact})])\).

  ---

  ### The Menu of Interpretations

  #### 1. **Compounding Growth (Reinvestment Required)**
     - **Claim**: Maximizing GM maximizes long-term growth rate when payoffs are reinvested ("compounding bankroll"). This is the classic Kelly result.
     - **Platitude or substantive?** Substantive and defensible *if* winnings are reinvested identically.
     - **Supports trustee?** No. Your grants don't feed back into the budget (endowment is fixed). Without reinvestment, compounding is irrelevant. The long shot isn't repeatedly funded with winnings.
     - **Key dependency**: **Requires reinvestment**. Fails your stipulation.

  #### 2. **Time-Average vs. Ensemble-Average (Repeated Bets Required)**
     - **Claim**: GM represents the time-average growth rate, while AM is the ensemble average. Kelly maximizes the former, ensuring "almost sure" dominance in the long run.
     - **Platitude or substantive?** Substantive (proven in ergodic theory).
     - **Supports trustee?** No. Applies only to identical, repeated bets. Your grants are unique (non-identical), and "long run" is undefined. Even if repeated, no reinvestment breaks the chain.
     - **Key dependency**: **Requires identical, repeated bets with reinvestment**. Fails your context.

  #### 3. **Expected Utility with Log Utility (Single or Repeated Bets)**
     - **Claim**: Maximizing GM = maximizing expected log(impact). This is equivalent to expected utility with a log utility function.
     - **Platitude or substantive?** Substantive (standard EU maximization).
     - **Supports trustee?** **Anti-supports** the trustee. For the long shot:  
       \(\mathbb{E}[\log(\text{impact})] = 0.04 \log(H) + 0.96 \log(0) \to -\infty\) (since \(\log(0) = -\infty\)).  
       The safe option has \(\log(S) > -\infty\). Thus, EU-log *always* prefers safe over any positive-risk bet. Trustee likely doesn't mean this.
     - **Risk aversion**: Log utility is highly risk-averse, avoiding ruin. But trustee advocates *for* the long shot—contradiction.
     - **Key dependency**: Independent of reinvestment. Applies to single bets, but recommends *against* long shots.

  #### 4. **Asymptotic Dominance (Repeated Bets Required)**
     - **Claim**: A Kelly bettor "almost surely" ends up richer than others in the long run (up to a multiplicative factor).
     - **Platitude or substantive?** Substantive (proven for repeated bets).
     - **Supports trustee?** No. Requires identical, repeated bets with reinvestment. Grants are non-identical and non-reinvested. "Long run" doesn't cash out here.
     - **Key dependency**: **Reinvestment and identical distributions essential**.

  #### 5. **Median Growth vs. Mean Growth (Repeated Bets Required)**
     - **Claim**: Kelly maximizes median wealth in finite time. More aggressive bets have higher AM wealth but lower median due to "ruin risk."
     - **Platitude or substantive?** Substantive for repeated bets.
     - **Supports trustee?** No. For a single bet, the long shot's median impact is \(0\) (if \(p < 50\%\)), while safe is \(S > 0\). For repeated bets, median optimization avoids ruin, but again: no reinvestment, non-identical bets.
     - **Key dependency**: **Reinvested bankroll needed for ruin to matter**.

  #### 6. **Overbetting Penalty (Fractional Bets Required)**
     - **Claim**: Betting more than Kelly reduces growth *and* increases ruin risk—a "double penalty."
     - **Platitude or substantive?** Substantive for fractional Kelly.
     - **Supports trustee?** No. Your choice isn't fractional (it's all-or-nothing). Also assumes reinvestment.
     - **Key dependency**: **Requires reinvestment and fractional betting**.

  #### 7. **Geometric Mean Across Outcomes (Single Bet)**
     - **Claim**: Maximize \(\exp(\mathbb{E}[\log(\text{impact})])\) for a single bet, treating GM as a risk metric.
     - **Platitude or substantive?** **False/misleading**. GM here is just EU-log in disguise (same as #3). It doesn't represent "growth" without repetition. Calling it "geometric mean" confuses outcome-space with time.
     - **Supports trustee?** No. As in #3, GM = 0 for long shot (since \(\log(0) = -\infty\)), while safe has GM = \(S > 0\).
     - **Key dependency**: None, but mathematically equivalent to EU-log.

  #### 8. **Correcting for Uncertainty (Fractional Bets Required)**
     - **Claim**: With uncertain probability estimates, maximizing Kelly based on point estimates leads to overbetting. Optimal fraction is less than Kelly.
     - **Platitude or substantive?** Substantive (known as "Kelly under uncertainty").
     - **Supports trustee?** **Anti-supports** if he means Kelly. If probability is uncertain (e.g., true \(p < 4\%\)), betting the "point estimate Kelly fraction" is too aggressive. For all-or-nothing bets, this implies *more caution* than naive AM. Trustee might misuse this to argue for *less* long-shot funding—opposite of his stance.
     - **Key dependency**: Applies to fractional bets with estimation risk. Not relevant for all-or-nothing choices.

  ---

  ### Addressing Your Three Pinned-Down Issues

  1. **Fixed Budget (No Reinvestment)**  
     - **Impact**: Every reinvestment-dependent interpretation (#1, #2, #4, #5, #6) collapses. Without compounding, AM (expected impact) is the natural criterion. EU-log (#3, #7) still applies but *rejects* long shots due to risk aversion.  
     - **Verdict**: Reinvestment is essential for growth-oriented Kelly claims. Without it, the trustee's argument lacks foundation.

  2. **Non-Identical Bets (No "Long Run")**  
     - **Impact**: The "long run" assumes identical, repeated opportunities to average out variance. Your grants are unique and non-repeated. Interpretations #2, #4, and #5 require stationarity. "Asymptotic dominance" or "median growth" has no meaning here.  
     - **Verdict**: The trustee's "long run" doesn't exist in your setting. Unique bets favor AM per grant.

  3. **Uncertain Probability Estimates**  
     - **Claim**: With uncertain \(p\), optimal fractional bets are *less* than point-estimate Kelly.  
     - **Where it fits**: Under "Correcting for Uncertainty" (#8).  
     - **Validity**: True for fractional Kelly with uncertain probabilities.  
     - **Supports trustee?** No—it suggests *caution*. If your 4% is uncertain (e.g., true \(p\) could be 1%), sizing bets via point estimates overweights long shots. For all-or-nothing, it implies favoring safe options *more* often. This contradicts the trustee's push for the long shot.

  ---

  ### Which Reading is the Trustee Likely Using?
  The trustee probably conflates **#1 (Compounding Growth)** or **#2 (Time-Average)** with your context. He may be picturing:
  > *"If we keep betting on long shots, we'll hit a huge win that compounds future impact."*  
  But this fails because:
  - Your budget doesn't grow with wins (no reinvestment).
  - Grants aren't repeated or identical.
  - Log utility (#3) would *avoid* his preferred bet.

  His conclusion (favor long shot) aligns with **none** of the defensible interpretations. Kelly-like reasoning either:
  - Requires reinvestment (which you lack), or  
  - Rejects positive-risk bets via EU-log (anti-long shot).

  ---

  ### What to Say in the Meeting
  1. **Dismantle reinvestment dependence**:  
     *"The Kelly criterion assumes winnings are reinvested, amplifying growth over time. Our endowment is fixed—grant outcomes don't increase future budgets. So growth maximization doesn't apply."*

  2. **Highlight non-identical bets**:  
     *"Kelly assumes identical, repeated bets. Our grants are one-offs with unique risks. There's no 'long run' to average out variance."*

  3. **Emphasize EU-log inconsistency**:  
     *"If we maximize geometric mean as log utility, we must avoid any risk of zero impact—like our long shot. That would favor safe grants, not long shots."*

  4. **Recommend AM as default**:  
     *"Without reinvestment or repeated bets, expected impact (AM) is appropriate. We should take the long shot only if \(0.04H > S\) and we're risk-neutral."*

  5. **Invite risk discussion**:  
     *"If the trustee is risk-seeking, that's a separate argument. But Kelly isn't it."*

  ### Summary Table
  | **Interpretation**                     | **Platonic?**      | **Requires Reinvestment?** | **Supports Long Shot?** | Why? |
  |----------------------------------------|--------------------|----------------------------|-------------------------|------|
  | 1. Compounding Growth                 | Defensible        | Yes                        | ❌ No                   | No reinvestment. |
  | 2. Time-Average vs. Ensemble         | Defensible        | Yes                        | ❌ No                   | No identical repeats. |
  | 3. Expected Utility (Log)             | Defensible        | No                         | ❌ **Anti-supports**    | EU-log rejects risky bets. |
  | 4. Asymptotic Dominance               | Defensible        | Yes                        | ❌ No                   | Reinvestment + repeats needed. |
  | 5. Median vs. Mean Growth            | Defensible        | Yes                        | ❌ No                   | No reinvestment. |
  | 6. Overbetting Penalty                | Defensible        | Yes                        | ❌ No                   | Fractional bets + reinvestment. |
  | 7. GM Across Outcomes (Single Bet)   | **False**         | No                         | ❌ No                   | Equivalent to #3. |
  | 8. Correcting for Uncertainty        | Defensible        | No (but fractional bets)   | ❌ **Anti-supports**    | Suggests less risk-taking. |

  **Bottom line**: None of the precise interpretations support the trustee's conclusion. The slogan is misapplied. Your committee should:
  - Use expected impact (AM) unless risk aversion is explicitly justified.
  - Discuss risk preferences separately (e.g., "Is a 4% chance of \(H\) worth a 96% chance of near-zero, given \(0.04H > S\)?").  
  - Reject geometric mean maximization as off-point.
