  The trustee's argument must be that even if 0.04*H is greater than S, we should still avoid the long shot because of risk? But the Kelly criterion, if applied, would avoid the long shot because of the risk of zero impact (leading to -∞ in log utility). But that would be risk aversion. The foundation may or may not be risk averse.

