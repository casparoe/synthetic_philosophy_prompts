prompt: |-
  I run model risk for a vendor that ships churn and collections scoring models to around forty community banks and credit unions. About four times a year we re-fit each model, and before a re-fit ships, an analyst has to sign off on the feature set: roughly sixty candidate features a quarter, each reviewed by someone with SQL and applied statistics but no philosophy, in twenty to thirty minutes, on a one-page internal form that ends in one of four dispositions — admit; admit with mandatory post-deployment drift monitoring; admit only if re-derived from base fields; reject — plus three lines of rationale that I countersign and that compliance reads for fair-lending exposure. Right now my analysts justify a feature almost entirely by its lift on an out-of-time holdout, and I have come to think that check is nearly circular for exactly the features that worry me. A grue-style predicate — say, one that applies to accounts opened before our 2021 onboarding redesign and to accounts opened after it only if they satisfy some unrelated condition — fits any finite run of past data exactly as well as the honest predicate does, so a holdout carved out of the same pre-build window cannot separate them, and the difference only appears after deployment, when we have already shipped and the banks have already acted on the scores.

  What I want from you is a written procedure my analysts can run per feature, grounded in whatever is actually usable from the philosophical literature on the new riddle of induction — Goodman's idea that projectibility tracks the entrenchment of a predicate in a vocabulary that has a real history of being projected, the point that grue and green are interdefinable so that no purely syntactic or definitional test can adjudicate between them, and the role of higher-level overhypotheses about kinds. It has to survive translation to people who will not read any of that: give the steps in the order they should be run, say what counts as a sufficient answer at each step, say what to do when a step cannot be answered from the data and documentation we actually have (including what an analyst should use as a working proxy for entrenchment — e.g. whether the predicate's family shows up in previously shipped models, in monitoring reports, or in how the bank's own staff describe their customers), and mark explicitly which steps are judgment calls dressed up as procedure and where the call has to be handed to me or to compliance because it is about values and cost asymmetry rather than facts. It also has to handle the cases that break the simple picture: features anchored to a date or to the scoring run itself; features defined by a threshold the bank sets and periodically changes, so their extension silently shifts; features defined by reference to another model's output, so that the predicate's extension moves when we act on the prediction; and features we cannot state in words at all, such as a thirty-two-dimensional embedding trained on transaction text, where the question of what predicate is being projected may not be answerable in the vocabulary of the form.

  Please apply the finished procedure to three features from our current build and show the filled-in reasoning, not just the verdict. First, legacy_cohort: true of an account if and only if it was opened before the 2021 onboarding redesign; it is in the champion collections model and accounts for about eight percent of its lift. Second, referred_by_legacy_rules: whether the account was flagged for collections under the rule set we retired in 2022 — it is the single highest-gain feature in the new build, and its extension was produced by a system we no longer run. Third, a thirty-two-dimensional embedding of transaction description strings from a pretrained model, which we have reason to think encodes the transaction month because the raw strings contain month tokens; here I want to know what the procedure even asks, given that no one can write down the predicate. If your procedure implies that the out-of-time holdout result is close to worthless for features of the first two kinds, say so plainly rather than softening it, even though that is the evidence my team has been signing off on for years. Finally, tell me what the procedure cannot do: what it has to say about a genuinely new kind — we are about to score behaviour on a payment product that has existed for eleven months, so no predicate for it has any projection history — and how it handles the tension between entrenchment and mechanism, since we usually know a causal story for the features we trust and entrenchment as such seems indifferent to whether there is one.
reasoning: |-
  We are designing a written procedure for analysts to evaluate features for potential "grue-like" properties (i.e., non-projectible predicates) in the context of model risk management for churn and collections scoring models. The procedure must be grounded in Goodman's insights on projectibility, entrenchment, and overhypotheses, but translated for analysts with SQL and statistics background, without philosophy.

  Key ideas from Goodman:
  - Projectibility tracks the entrenchment of a predicate: a predicate is projectible if it has been used successfully in projections (predictions) in the past.
  - Grue and green are interdefinable, so no purely syntactic or definitional test can separate them. We need a pragmatic criterion: entrenchment in the language and history of projections.
  - Higher-level overhypotheses: we have background beliefs about what kinds of properties are stable (e.g., color is more stable than color-and-time combinations) and these are also entrenched.

  Procedure Requirements:
  1. Steps in order, with clear criteria for each step.
  2. What counts as sufficient answer at each step.
  3. What to do when data/documentation is missing (use proxies for entrenchment: e.g., presence in previously shipped models, monitoring reports, bank staff descriptions).
  4. Mark steps that are judgment calls and when to escalate (to model risk manager or compliance).
  5. Handle special cases: 
     - Date-anchored features (like legacy_cohort).
     - Features with thresholds that shift (bank-set thresholds that change).
     - Features defined by another model's output (which changes when we act on the model).
     - High-dimensional embeddings (which are not interpretable in words).

  Procedure Steps:

  Step 1: Feature Definition and Stability
     - Ask: Can the feature be defined without reference to a specific point in time (like a fixed date) or to the current scoring run?
     - If the feature definition is time-bound (e.g., "before 2021") or depends on the current run (e.g., "if the account is flagged by model X in this run"), then it is inherently unstable and non-projectible without additional context.
     - Sufficient answer: The definition is written and examined for time-dependence. If time-dependent, note that and proceed to Step 2 to check for entrenchment and overhypotheses.
     - If the feature is an embedding (or otherwise not verbally definable), skip to Step 3.

  Step 2: Entrenchment Check
     - Ask: Has this exact feature (or a very similar one) been used in previous models (either our own or the bank's) and has it been monitored for drift and found stable?
     - Proxies for entrenchment:
          a. Previously shipped models: Check if the feature (or a similar one) has been in production for at least 12 months (or two re-fit cycles) and has been included in drift reports without significant issues.
          b. Monitoring reports: Look for historical drift metrics (PSI, CSI, etc.) for this feature. Low drift (e.g., PSI < 0.1) over at least 12 months is positive.
          c. Bank staff descriptions: If the feature corresponds to a concept that bank staff use (e.g., "legacy accounts") and that concept has been stable in their usage, that is positive.
     - Sufficient answer: 
          - If the feature is entrenched (by at least two of the above proxies) and stable, mark as projectible and proceed to Step 4.
          - If not entrenched, or if drift has been high, then the feature is suspect and proceed to Step 3 for overhypotheses.
     - Judgment call: Determining "similarity" of features and stability thresholds (e.g., what is low drift?) may require escalation to model risk manager. If the feature is new (no history), then it is not entrenched.

  Step 3: Overhypotheses Check (Higher-Level Kinds)
     - Ask: Is the feature based on a kind that we have overhypotheses (background beliefs) about being stable? For example:
          - Demographic features (age, income) are usually stable over the short term but can be sensitive to policy changes.
          - Behavioral features (spending patterns) may be stable if they reflect habits.
          - Time-bound cohorts (like legacy_cohort) are inherently unstable because they are defined by a fixed historical event and the group shrinks over time.
          - Features that are defined by a model output (like referred_by_legacy_rules) depend on the stability of that model and the system that produced it, which may no longer exist.
          - Embeddings: We must consider what the embedding is intended to capture and whether that is stable (e.g., if it captures spending categories, that might be stable; if it captures temporary promotions, not stable).
     - Sufficient answer: 
          - If the feature is of a kind that we believe is stable (e.g., age, income, transaction amount) and there is no known reason for instability, then it may be projectible based on overhypotheses.
          - If the feature is of a kind that we know is unstable (e.g., time-bound, model-output-dependent without ongoing support, or embeddings that might encode transient information), then it is non-projectible without strong countervailing evidence.
     - Judgment call: This step is inherently judgmental. Analysts must use their understanding of the domain. If unsure, escalate to model risk manager.

  Step 4: Causal Plausibility (Optional but Recommended)
     - Ask: Is there a causal story that explains why this feature should predict the outcome (churn or collections)? 
     - Note: This step is not required by Goodman, but the problem statement mentions it. We use it to bolster projectibility when available.
     - Sufficient answer: If a clear causal mechanism exists (e.g., "accounts opened before the redesign are more likely to default because they were underwritten under looser criteria"), that supports projectibility. However, absence of a causal story does not necessarily rule out projectibility (entrenchment alone can suffice).
     - Judgment call: This step is a judgment call. It may be difficult to establish causality. Use as a tie-breaker.

  Step 5: Synthesis and Disposition
     - Combine evidence from Steps 1-4 to assign one of the four dispositions:
          1. Admit: The feature is projectible (entrenched and stable, or supported by overhypotheses and causal story) and does not require special monitoring.
          2. Admit with mandatory post-deployment drift monitoring: The feature is not entrenched (or new) but has a plausible causal story and overhypotheses of stability, OR it is entrenched but we have some concerns (e.g., it is time-bound but we expect it to remain stable for the next period). Also, if the feature is an embedding and we have no way to define it, we must monitor it for drift.
          3. Admit only if re-derived from base fields: If the feature is defined in a way that is not reproducible (e.g., it depends on a retired system) or if it is defined by a threshold that the bank changes arbitrarily, then we require that it be re-derived from base fields that are stable and available.
          4. Reject: The feature is clearly non-projectible (e.g., a grue-like predicate without entrenchment and with a known instability) and the risk is too high.

     - Rationale: The analyst must write a concise rationale (3 lines) that covers:
          - The result of the entrenchment check (Step 2) and overhypotheses (Step 3).
          - Any concerns about time-dependence or instability (Step 1).
          - The causal story, if available (Step 4).
          - The disposition and any monitoring requirements.

     - Escalation: If at any step the analyst is unsure, or if the feature is high-risk and the evidence is mixed, escalate to model risk manager. Compliance must be involved if there are fair lending concerns (e.g., the feature is a proxy for a protected class).

  Special Cases:
  - Features anchored to a date: These are inherently non-projectible over the long term because the group they define changes (shrinks) over time. However, they might be projectible in the short term if the overhypothesis is that the effect of being in the cohort is stable. But note: the predicate itself (e.g., "opened before 2021") is fixed, but the set of accounts it applies to is fixed and diminishing. The concern is that the relationship between the feature and the outcome might change as the cohort ages. Therefore, such features require drift monitoring and should not be used indefinitely.
  - Features with shifting thresholds: These are problematic because the extension of the predicate changes without notice. They must be re-derived from base fields so that we can track the threshold changes and adjust accordingly. Otherwise, they are non-projectible.
  - Features defined by another model's output: These are non-projectible if the model that produced them is no longer run or if we act on the model (which changes the input distribution). We must have a way to recompute the feature in the future, or else it is non-projectible.
  - Embeddings: Since we cannot state the predicate, we must rely on:
        - Step 1: Skip (it's not definable in words).
        - Step 2: Check if the same embedding has been used in previous models and has been stable (low drift). If it's new, then no entrenchment.
        - Step 3: Overhypotheses about what the embedding captures. For example, if it captures transaction patterns that are stable (like recurring bills) then it might be projectible. But if it captures transient information (like a temporary merchant code), then it is not. We must also check if the embedding model is stable (e.g., if the embedding model is retrained, then the feature changes). 
        - Step 4: Causal story might be unavailable.
     - Disposition: Typically, embeddings require ongoing drift monitoring because they are opaque and may change in meaning.

  What the procedure cannot do:
  - It cannot guarantee projectibility. It is a risk management tool to flag potential issues.
  - For genuinely new kinds (e.g., a payment product that is 11 months old), there is no entrenchment. We must rely on overhypotheses (Step 3) and causal stories (Step 4). If the overhypotheses are weak (we don't have a history of similar features) and the causal story is weak, then the feature must be admitted with mandatory monitoring or rejected if the risk is too high.
  - It handles the tension between entrenchment and mechanism by using both: entrenchment is the primary criterion (because it is what Goodman argues for) but causal mechanism is used as supporting evidence. However, without entrenchment, a causal mechanism alone might not be enough because we might not have tested the feature in the wild.

  Now, we apply the procedure to the three example features.

  ---

  **Feature 1: legacy_cohort**

  Step 1: Feature Definition and Stability
     - Defined as: account opened before the 2021 onboarding redesign.
     - This is time-bound (anchored to a specific event and date). Unstable because the cohort is fixed and diminishing over time.

  Step 2: Entrenchment Check
     - Check if it has been in previous models: It is in the current champion model (so it has been in production for some time). Check drift reports: We don't have specific drift metrics, but we know the cohort is shrinking. However, we must check if the drift (in terms of feature distribution) has been high. Since the cohort is fixed, the distribution of the feature (proportion of legacy accounts) is decreasing over time, which may cause high drift. If we have data showing that the feature has been stable in its relationship with the outcome (e.g., through monitoring of model performance), then that would be positive. But without that, we note that the set of accounts with this feature is fixed and diminishing, so the feature distribution is changing. 
     - Proxies: 
          a. Previously shipped models: Yes, it has been used (champion model).
          b. Monitoring reports: We need to check. If we have been monitoring it and it has shown low drift (which is unlikely because the cohort shrinks) or if the drift has been managed, then it is entrenched. But note: if the drift has been high, then it is not stable.
          c. Bank staff descriptions: They may use the concept of "legacy accounts", so that is positive.
     - Given that it is in the champion model and the bank uses the concept, we might say it is somewhat entrenched. However, we know the cohort is diminishing so we expect drift. Therefore, we cannot rely solely on entrenchment.

  Step 3: Overhypotheses Check
     - The feature is a time-bound cohort. Our overhypothesis is that such cohorts are unstable because they are tied to a one-time event and the group changes over time (diminishes). However, the effect of being in the cohort (e.g., due to different underwriting standards) might be stable. But the stability of the effect is not guaranteed because the world changes. Without a strong overhypothesis of stability, we are concerned.

  Step 4: Causal Plausibility
     - There is a causal story: accounts opened before the redesign were underwritten with different (presumably looser) criteria, so they are riskier. This is plausible.

  Step 5: Synthesis and Disposition
     - The feature is time-bound and we expect drift. It has some entrenchment (used in production) and a causal story, but the overhypothesis for stability is weak. Therefore, we must require mandatory post-deployment drift monitoring. Also, note that the cohort will eventually become very small, so we should plan to phase it out.
     - Disposition: Admit with mandatory post-deployment drift monitoring.
     - Rationale: "Time-bound cohort; entrenched (in champion model) but expected to drift; causal story present; monitor for drift in feature distribution and model performance."

  **Feature 2: referred_by_legacy_rules**

  Step 1: Feature Definition and Stability
     - Defined as: whether the account was flagged for collections under the rule set retired in 2022.
     - This feature is produced by a system that is no longer run. Therefore, for new accounts, it cannot be computed. Moreover, the set of accounts with this feature is fixed (only those that were flagged before 2022) and will never change. This is a fixed historical flag.

  Step 2: Entrenchment Check
     - It is new in this build, so it has not been used in previous models. Therefore, not entrenched.

  Step 3: Overhypotheses Check
     - The feature is a fixed historical flag. Our overhypothesis is that such flags might be stable in the sense that they reflect a past event that is fixed. However, the relationship between that past event and the current outcome might change over time (e.g., the flag might become less relevant as time passes). Moreover, the feature cannot be computed for accounts opened after 2022. Therefore, it is only defined for a subset of accounts and that subset is diminishing. This is highly unstable.

  Step 4: Causal Plausibility
     - There is a causal story: accounts that were flagged by the legacy rules were likely risky and that risk may persist. But note: the rules were retired, which might mean they were not effective or fair, so this causal story is weak.

  Step 5: Synthesis and Disposition
     - The feature is not entrenched, is time-bound (only defined for accounts that were processed by the legacy system), and cannot be computed for new accounts. It is non-projectible beyond the fixed set. We cannot use it for new accounts, and even for existing accounts, its predictive power may decay. Moreover, we cannot re-derive it because the legacy system is gone. Therefore, we must reject it unless we can re-derive it from base fields (which we cannot because the rules are gone). 
     - Disposition: Reject.
     - Rationale: "Feature is derived from a retired system and cannot be computed for new accounts. It is not entrenched and has high risk of becoming obsolete. No causal story strong enough to overcome these risks."

     - Alternatively, if the bank has kept the legacy rules and can run them on new accounts (but they are retired in the sense of not being used for decisions) then we could re-derive the feature. But the problem states the system is no longer run. So we cannot.

  **Feature 3: 32-dimensional embedding of transaction description strings**

  Step 1: Feature Definition and Stability
     - Cannot be defined in words. Skip.

  Step 2: Entrenchment Check
     - Assume it is new in this build (or if it has been used before, we would check drift). Since it's new, it has no entrenchment.

  Step 3: Overhypotheses Check
     - The embedding is from a pre-trained model. We suspect it encodes the transaction month (because of month tokens in the strings). If it encodes time, that is unstable because time is always changing. However, if it captures stable patterns (like merchant categories), that might be stable. We need to investigate what the embedding captures. 
     - Without interpretability tools, we cannot know. Therefore, we must be cautious.

  Step 4: Causal Plausibility
     - We don't have a clear causal story because we don't know what the embedding represents. If it captures spending habits (which are stable), that is good. But if it captures temporary or seasonal patterns, that is bad.

  Step 5: Synthesis and Disposition
     - Because the feature is not interpretable and we suspect it may encode non-stable information (like month), and it is new (no entrenchment), we require mandatory monitoring. Moreover, we should, if possible, try to remove the time-related information (e.g., by normalizing the transaction strings to remove month tokens) to make it more stable. But if we cannot, then we must monitor.
     - Disposition: Admit with mandatory post-deployment drift monitoring (and possibly require ongoing validation of what the embedding captures).
     - Rationale: "Embedding is new and uninterpretable; suspected to encode time which is unstable; require monitoring for drift and investigation into what it captures."

  ---

  Final Note on Holdout Validation:
  The procedure implies that out-of-time holdout validation is not sufficient to detect non-projectible features (like grue) because the holdout is from the same pre-build time window. Therefore, it cannot reveal issues that appear only after deployment (when the time window changes). The procedure above is designed to flag such features by examining their definition and stability, entrenchment, and overhypotheses. We must be explicit: for features that are time-bound or defined in a way that is not projectible, the holdout lift is not evidence of projectibility.

  What the Procedure Cannot Do:
  - It cannot handle genuinely new kinds without any history. For such features, we must rely on overhypotheses and causal stories, and then monitor closely. There is no substitute for actual projection history (entrenchment).
  - It does not resolve the tension between entrenchment and causal mechanism: entrenchment is the primary indicator of projectibility, but causal mechanisms can provide additional support. However, if a feature is entrenched without a causal mechanism, we might still use it (because it has worked in the past) but we should be alert for drift. Conversely, a feature with a strong causal mechanism but no entrenchment is riskier and requires monitoring.

  The written procedure for analysts:
answer: |-
  Below is a written procedure for evaluating feature projectibility, grounded in Goodman's insights on induction, entrenchment, and overhypotheses. It is designed for analysts with SQL/stats backgrounds, using pragmatic proxies for philosophical concepts. Steps requiring judgment or escalation are marked with ⚠️.

  ---

  ### **Procedure: Feature Projectibility Assessment**  
  **Goal**: Identify non-projectible ("grue-like") features that may degrade post-deployment.  
  **Inputs**: Feature definition, historical data, model documentation, drift reports, business context.  
  **Output**: One of four dispositions with rationale.  

  #### **Step 1: Check Time/State Dependence**  
  - **Question**: Does the feature depend on a fixed date, model run timestamp, or retired system?  
  - **Sufficient Answer**:  
    - "Yes" if:  
      - Anchored to a date (e.g., "before 2021"),  
      - Depends on scoring run timestamp (e.g., "days since last run"),  
      - Relies on an inactive system (e.g., "output from retired model").  
    - "No" if time-agnostic (e.g., "age," "income").  
  - **Missing Data/Proxy**: Use data lineage docs or business logic. If uncertain, default to "yes."  
  - **Disposition Path**:  
    - "Yes" → Proceed to Step 2.  
    - "No" → Skip to Step 3.  
  - **⚠️ Judgment**: Low (binary check).  

  #### **Step 2: Entrenchment Evaluation**  
  - **Question**: Is the predicate *entrenched* in our/historical vocabulary?  
  - **Sufficient Answer**: **Yes** if ≥2 proxies apply:  
    1. **Model History**: Feature (or close variant) in ≥2 previously shipped models.  
    2. **Drift Reports**: Low drift (PSI < 0.1) in ≥4 consecutive quarters.  
    3. **Business Usage**: Bank staff describe similar concepts (e.g., "legacy accounts" in loan ops docs).  
  - **No** if none/missing evidence.  
  - **Missing Data/Proxy**:  
    - Use internal model inventory or monitoring dashboards.  
    - If no data, assume **not entrenched**.  
  - **Disposition Path**:  
    - "Yes" → Proceed to Step 4.  
    - "No" → Proceed to Step 3.  
  - **⚠️ Judgment**: Moderate (assessing "close variants" and drift thresholds).  

  #### **Step 3: Overhypothesis Check**  
  - **Question**: Does the feature align with stable, high-level "kinds"?  
  - **Sufficient Answer**: **Yes** if:  
    - Represents a *persistent property* (e.g., demographics, core behavior).  
    - **No** if:  
      - Ephemeral (e.g., tied to marketing campaigns),  
      - Artifactual (e.g., encoding transient system states),  
      - Non-causal (e.g., correlates by coincidence).  
  - **Proxies**:  
    - Causal plausibility (e.g., "income" → financial stability).  
    - Bank’s risk taxonomy (e.g., "delinquency status" is a core kind).  
  - **Missing Data/Proxy**: Escalate to model risk lead (⚠️).  
  - **⚠️ Judgment**: High (requires domain expertise). Escalate if:  
    - Feature is novel (no history),  
    - Contradicts known mechanisms (e.g., "month" in transaction text).  

  #### **Step 4: Synthesis & Disposition**  
  - **Rules**:  
    | **Condition**                                                                 | **Disposition**                          |  
    |-------------------------------------------------------------------------------|------------------------------------------|  
    | Time-dependent (**Step 1: Yes**) AND not entrenched (**Step 2: No**)          | Reject                                   |  
    | Time-dependent AND entrenched BUT no causal story (**Step 3: No**)            | Reject or admit with monitoring ⚠️      |  
    | Not entrenched AND weak overhypothesis (**Step 2: No** + **Step 3: No**)      | Reject                                   |  
    | Embeddings/black-box features                                                 | Admit with monitoring                    |  
    | Entrenched OR strong overhypothesis (**Step 2: Yes** OR **Step 3: Yes**)      | Admit                                    |  
    | Threshold-shifted features (e.g., bank-set rules)                             | Admit only if re-derived from base fields|  
  - **Rationale Template**:  
    > "Disposition: [ ]. **Entrenchment**: [Evidence]. **Overhypothesis**: [Stable/ephemeral?]. **Time-dependence**: [Yes/No]. [Causal note if available]."  
  - **⚠️ Escalation**:  
    - To **model risk lead**: Novel features, ambiguous overhypotheses, high-stakes tradeoffs.  
    - To **compliance**: Fair-lending exposure (e.g., proxies for protected classes).  

  ---

  ### **Key Notes for Analysts**  
  1. **Holdout tests are insufficient for time-dependent features** (e.g., `legacy_cohort`). They cannot detect post-deployment decay.  
  2. **Entrenchment ≠ causation**: A feature in 10 models may still be non-projectible (e.g., if tied to a shrinking cohort).  
  3. **Embeddings**: Treat as "black boxes." Focus on entrenchment (e.g., prior usage) and drift risk.  

  ---

  ### **Application to Example Features**  
  #### **1. Feature: `legacy_cohort`**  
  - **Definition**: `TRUE` if account opened before 2021 redesign.  
  - **Step 1**: **Yes** (anchored to 2021).  
  - **Step 2**: **Not entrenched** (only in current model; no drift history).  
  - **Step 3**: **Weak overhypothesis**. "Cohort age" is unstable (cohort shrinks; redesign effects fade).  
  - **Causal Plausibility**: Plausible (older accounts riskier) but time-bound.  
  - **Disposition**: **Reject** (or **admit with monitoring** if banks demand it, but monitor aggressively).  
  - **Rationale**:  
    > "Admit with mandatory drift monitoring. **Entrenchment**: Only in current model (low). **Overhypothesis**: Cohort-based predicates degrade as population shifts. **Time-dependence**: Yes. Causal link exists but decays."  

  #### **2. Feature: `referred_by_legacy_rules`**  
  - **Definition**: Flagged by collections rules retired in 2022.  
  - **Step 1**: **Yes** (depends on retired system).  
  - **Step 2**: **Not entrenched** (new feature; no history).  
  - **Step 3**: **Weak overhypothesis**. "Retired-system status" is ephemeral (rules outdated; no new data).  
  - **Causal Plausibility**: Weak (past flags may not predict future risk post-retirement).  
  - **Disposition**: **Reject** (or **admit only if re-derived** if rules can be rebuilt from base fields).  
  - **Rationale**:  
    > "Reject. **Entrenchment**: None (new feature). **Overhypothesis**: Predicate tied to inactive system; extension fixed and non-renewable. **Time-dependence**: Yes. Cannot be projected beyond historical data."  

  #### **3. Feature: Transaction Description Embedding (32-dim)**  
  - **Definition**: NLP embedding of transaction strings (suspected to encode month).  
  - **Step 1**: N/A (no explicit time-dependence, but risk of implicit time encoding).  
  - **Step 2**: **Not entrenched** (new feature; no prior usage).  
  - **Step 3**: **Weak overhypothesis**. Embeddings may encode unstable properties (e.g., month tokens).  
  - **Proxy**: Drift risk high if embeddings capture transient states.  
  - **Disposition**: **Admit with mandatory drift monitoring** (require PSI/CSI tracking monthly).  
  - **Rationale**:  
    > "Admit with mandatory drift monitoring. **Entrenchment**: None (new). **Overhypothesis**: High risk of encoding non-projectible properties (e.g., time). **Time-dependence**: Indirect. Uninterpretable; monitor all 32 dimensions."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Genuinely novel features** (e.g., for a 11-month-old product):  
     - No entrenchment → rely on overhypotheses (Step 3).  
     - If no analogous predicates exist, **admit with monitoring** or **reject** if risk asymmetry is high (e.g., high-cost false negatives).  
     - ⚠️ Escalate to model risk lead for novel-feature tribunals.  

  2. **Tension between entrenchment and mechanism**:  
     - Entrenchment prioritizes historical success; mechanism prioritizes causality.  
     - **Procedure bias**: Favors entrenchment (per Goodman). For features with strong mechanism but no history (e.g., new causal variable), use:  
       - **Step 3** (overhypothesis) to assess if aligned with stable kinds.  
       - If mechanism is validated experimentally (e.g., RCT), **admit with monitoring**.  
       - ⚠️ Judgment-heavy: Escalate if entrenchment and mechanism conflict.  

  ---

  ### **Implementation Guidance**  
  - **Training**: Focus on entrenchment proxies (e.g., "check model inventory for prior usage") and overhypothesis heuristics (e.g., "core customer behavior = stable; campaign-specific = unstable").  
  - **Compliance Handoff**: Flag features with low entrenchment + high fair-lending risk (e.g., ZIP code proxies).  
  - **Analyst Workflow**: Integrate checks into feature-engineering pipelines (e.g., tag time-dependent features in code).  
  - **Limitation**: This is a **risk mitigation tool**, not a guarantee. Non-projectible features may still pass if risks are misjudged.  

  **Final Note**: The out-of-time holdout is indeed **worthless for grue-like features** (e.g., `legacy_cohort`). It only tests historical fit, not future projection. This procedure replaces that gap with entrenchment and stability checks.
