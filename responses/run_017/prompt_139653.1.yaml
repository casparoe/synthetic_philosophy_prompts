answer: |-
  ### Restating the DNA Code Debate in Your Terms

  **Setup (Your Analogies):**  
  The cell processes a linear tape (DNA) with four symbols (A, C, G, T). It reads this tape in fixed-size tokens (codons: 3 symbols each). There are ~64 possible tokens mapped to ~20 outputs (amino acids) plus stop signals. This mapping is many-to-one (degenerate) and tolerates sloppiness in the third symbol (wobble). The same tape segment can be reinterpreted in a different frame or with tokens reordered (splicing), yielding different outputs. Crucially, the interpreter (tRNA charging, ribosome) is itself compiled from the same tape and rebuilt each run. There’s no fixed underlying machine, no clean IR boundary, and no external specification.

  ---

  ### 1. **The Yes-Case: DNA is a Code, Genes Carry Information**  
  *(Strongest version using your vocabulary)*  
  - **Deterministic Token-to-Output Mapping:** The codon table acts like a static lookup table or hash function. Input tokens (codons) map consistently to outputs (amino acids) across most contexts, akin to a lexer converting keywords to tokens.  
  - **Information as Predictable Output:** Genes specify protein sequences with high fidelity, like source code defining a function’s output. Mutations are "errors" that alter the output (e.g., a point mutation changing a token, causing a wrong amino acid). Degeneracy provides error resilience: wobble in the third position acts like error-correcting codes tolerating bit-flips.  
  - **Channel Capacity Analogy:** DNA → protein is a noisy channel. Shannon capacity is demonstrated by the system’s ability to transmit information (protein sequences) despite replication/translation noise, using redundancy (degeneracy) and proofreading (ribosomal error correction).  
  - **Portability as Evidence:** Genes often function when inserted into foreign cells (e.g., human insulin genes in *E. coli*), implying the sequence contains sufficient context-independent information to specify the output.  

  **Key Claim:** The system behaves *as if* it has a fixed spec (the codon table), making "code" a useful model.  

  ---

  ### 2. **The Skeptical Case: DNA is Not a Code, Genes Do Not "Carry" Information**  
  *(No strawman, equally strong)*  
  - **No Fixed Interpreter or IR Boundary:** The interpreter (tRNAs, ribosomes) is built from the same tape it reads. This is like a self-hosting compiler where the compiler’s source code is being compiled *by itself* in the same run. There’s no clean separation between "code" and "interpreter," breaking the compiler analogy.  
  - **Context Sensitivity:** Outputs depend on the cellular "runtime":  
    - The same codon can map to different outputs in different contexts (e.g., alternative splicing edits tokens, frameshifts change parsing).  
    - Protein folding (the real output) depends on chaperones, pH, etc.—factors outside the DNA sequence.  
  - **No External Spec → No "Error":** Without an external reference (e.g., a designer’s intent), mutations aren’t "errors" but neutral/varied changes. What counts as "correct" is defined by fitness, not a spec. Degeneracy isn’t error correction; it’s a byproduct of evolutionary drift.  
  - **Information is Relational:** Genes don’t "carry" information; information emerges from the system dynamics. E.g., a codon only "means" an amino acid because the interpreter (itself gene-dependent) executes that mapping.  

  **Key Claim:** Code-like regularity is superficial; the system is better modeled as a self-referential, context-dependent state machine.  

  ---

  ### 3. **Your Gadget: Portability**  
  **Definition:** Portability is the robustness of a DNA sequence’s output when moved to a different cellular context (e.g., different interpreter/tRNA pool, divergent developmental stage). Analogous to pasting a source file into a new project with a different toolchain (compiler flags, libraries, OS).  

  **Recasting the Disagreement:**  
  - **Yes-case argues:** High portability (e.g., conserved genes working across species) proves DNA contains context-independent information.  
  - **Skeptics argue:** Low portability (e.g., genes failing in foreign cells due to tRNA mismatches or missing chaperones) proves information is system-relative.  

  **Does This Resolve or Relocate the Fight?**  
  It **relocates the fight one level down**. The core disagreement becomes:  
  > *Is low portability the exception (yes-case) or the rule (skeptics)?*  

  But the deeper conflict remains:  
  - **Yes-case** treats portability failures as "implementation bugs" in the host system.  
  - **Skeptics** argue portability is illusory; all DNA execution is context-bound, making "information in DNA" a category error.  
  Your gadget operationalizes the debate but doesn’t resolve it—it shifts focus to empirical measures of context dependence.  

  ---

  ### 4. **Residue Report**  
  *What doesn’t map to your vocabulary?*  

  **Yes-Case Residue:**  
  - **"Arbitrariness" of the Codon Table:**  
    - Claim: The codon table is arbitrary (could map differently), proving it’s a "real code."  
    - Mapping: In compilers, token meanings are arbitrary too (e.g., `+` vs. `add`).  
    - Residue: None. This maps cleanly.  
  - **Teleology (Smuggling):**  
    - Claim: Degeneracy exists "to allow" error tolerance.  
    - Residue: Smuggling an *assumption of design*. Your vocabulary (error-correcting codes) describes mechanism, not purpose.  

  **Skeptical-Case Residue:**  
  - **"Meaning Without a Sender":**  
    - Claim: Information requires an external sender/receiver (Shannon’s formalism). DNA has no "sender," so it can’t "carry information."  
    - Residue: **Fuzzier than it sounds.** Shannon information doesn’t require intent—it’s about predictability. But skeptics often conflate *information* with *intentionality*.  
  - **Evolutionary Contingency:**  
    - Claim: The codon table is a "frozen accident," not a designed code.  
    - Residue: **Vocabulary gap.** Compilers lack an analogy for "historically contingent but now fixed" mappings (like legacy IR choices).  

  **Does "Arbitrariness" Do Real Work?**  
  - Yes-case uses it to argue for code-like properties.  
  - Skeptics dismiss it as irrelevant (no spec = no code).  
  - **Compiler Parallel:** It maps to the *contingency* of IR design (e.g., x86 vs. ARM), but not directly—compiler specs are designed, while evolution has no designer.  

  ---

  ### Final Verdict on "Code"  
  **Use "code" at work, but with caveats:** It’s a productive shorthand if you explicitly acknowledge the broken analogies (no fixed interpreter, no spec, portability ≠ guaranteed). Damage occurs if it obscures context dependence—e.g., assuming genes are "portable modules" without testing.
