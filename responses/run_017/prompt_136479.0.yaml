prompt: |-
  I'm a backend engineer with no philosophy training, and I'm in a small monthly reading group where we take one paper a month and argue about it. This month we did the extended mind — the famous Otto-with-a-notebook case and the claim that under the right conditions something outside your skull can literally be part of your mind, so that what is written in the notebook is a belief or memory of yours rather than merely something you read. I disagreed with almost everyone in the room, but when I tried afterwards to write down the rule I was implicitly applying, I couldn't find one, and I've come to suspect I have two different rules that I switch between depending on which case I'm looking at. Two ground rules before the cases: please don't give me citations, bibliographies, or a survey of who said what — we have that side covered, and I want the argument rather than the sources. And please define any term of art in plain language, because I'm the least read person in the group.

  Here are my verdicts, as honestly as I can state them. (1) The notes file on my laptop that I've been appending to for years, that I consult automatically, and that has never once been wrong: yes, that is part of my memory. (2) My phone's contact list, for numbers I used to know by heart: yes, same thing. (3) My calendar, which pushes an alert that makes me leave for the airport: yes, but it feels like a slightly different kind of yes than the first two — it's about what I'm going to do rather than what was the case. (4) My password manager, whose entries I can only read after a fingerprint scan and none of which I could recite: I said yes in the meeting, my friend said no, and I've since become unsure. (5) A notes app that now runs an on-device model which rewrites, reorders, and summarizes my entries and occasionally inserts a sentence I never wrote, which I usually leave in: I said no, but I couldn't explain why a model's contribution differs in kind from a friend correcting my notebook. (6) A long chat thread with a language model from six weeks ago — I remember neither what I typed nor what came back, but I scroll it and treat the conclusions in it as moves I made: I genuinely go back and forth, and this is the case I most want a ruling on. (7) The CI pipeline: the build goes red and a bot tells me my change broke it. I said no, that's a tool and an alert. My friend says it's exactly the notebook — a standing state about how things are, coupled to me, that I act on without re-deriving. (8) A team runbook in a wiki, edited by twelve people, which I rely on and believe: yes-ish, but not in the way the notebook is, and I can't say what the difference is. (9) An append-only audit log I maintain for compliance and have literally never read back: no, and I'm confident. (10) A flaky test suite I don't trust, whose red I always re-run before shipping, and whose verdict reliably changes what I do: I said no, and I think that's right, but it embarrasses any test phrased in terms of what I automatically consult and act on. (11) Inline code completion — the IDE suggests a function body, I read it, understand it, and accept it: I said no, it wasn't my thought until I read it, but I'm not confident, and I notice I don't say the same thing about a sentence I dictate to a transcription tool.

  The rough principle I came up with on the walk home was this: an external state counts as one of my mental states when (a) it is reliably available when I need it, (b) I go to it automatically rather than deciding to, (c) I would endorse it if I reflected, and (d) I put it there or can change it. I think clause (d) is doing the work in cases 5, 7, 8 and 11, and I suspect it is smuggling in an ownership intuition rather than a cognitive one. Please take that as a hypothesis to be tested, repaired, or replaced rather than as something to defend.

  I'd like the response in five titled sections, in this order. The principle: about 200 words, stating the best single account you can give of when an external thing is literally part of a mind, precisely enough that I could apply it to a new case myself, in plain language. Clause by clause: about 300 words, taking each clause of the account and naming the case of mine that forces it to be there. Verdicts on my cases: about 250 words, going through all eleven and saying yes, no, or it depends, including the three I waffled on. Two cases of yours: about 150 words, giving two cases I didn't think of — ideally ones where your principle returns a verdict I'd find uncomfortable — with your verdict on each. What I have to give up: about 150 words, naming the verdicts of mine your principle cannot accommodate, and saying honestly whether that counts against the principle or against me.
reasoning: |-
  Okay, the user is a backend engineer in a philosophy reading group, grappling with the extended mind thesis using real-world tech examples. They've listed 11 personal verdicts on whether external tools count as part of their mind, and proposed a rough principle with four clauses. Their core struggle is consistency—they suspect clause (d) about ownership might be biased.

  Hmm, their examples are fascinatingly practical: password managers, AI-modified notes, CI pipelines. What they really need isn't theory citations but a clear, applicable rule to navigate disagreements. The emotional subtext is frustration—they couldn't defend their intuitions coherently during the discussion, especially on cases like the chat thread (6) or AI-edited notes (5). 

  The ownership clause (d) does seem problematic. Case 5 (AI-modified notes) exposes the tension: if a friend edits your notebook, it's still "yours," but AI edits feel alien. Yet functionally, both alter content externally. Similarly, case 8 (team wiki) challenges ownership—it's collectively edited, but the user vaguely accepts it. 

  I'll craft a principle focusing on *integration* and *endorsement* over ownership. Key adjustments: drop (d), emphasize that the tool must function as a transparent cognitive extension (no "checking its work"), and require that the user treats outputs as pre-accepted facts. This handles their yes/no splits: password manager (4) passes because the fingerprint scan is seamless; flaky test suite (10) fails because distrust breaks transparency. 

  For their waffling cases: the chat thread (6) is a "no"—scrolling re-reads aren't automatic access, and conclusions aren't treated as cached beliefs. Team wiki (8) is "yes-ish but weak" because endorsement is conditional on trust, not inherent. 

  New uncomfortable cases: a medical alert bracelet would be "yes" (deeply integrated, automatic consultation), forcing acceptance of non-owned objects as mind-extensions. A GPS autopilot overriding user input would be "no" (no endorsement), challenging action-oriented tools. 

  Their hardest surrenders: calendar alerts (3) are full "yes" under integration (no special "future" category), and audit log (9) stays "no" due to zero integration. If they cling to ownership, they'll keep clashing with collective/automated tools. The trade-off is worth it—ownership is intuitive but philosophically shaky for extended cognition.
answer: |-
  Below is a systematic analysis based on your cases and constraints. The principle is distilled from your intuitions while eliminating inconsistencies.

  ### 1. The Principle (189 words)  
  An external resource is literally part of your mind **if and only if**:  
  - **(Integration)** It functions as a *transparent*, *automatic extension* of your cognitive processes: you consult it instinctively (like biological memory), without consciously "querying" it as an external tool.  
  - **(Trust)** You accept its content *pre-reflectively* as your own belief or intention, unless actively contradicted by evidence.  
  - **(Access & Endorsement)** It is reliably, immediately available to you, and you would consciously endorse its content upon reflection *as if you generated it yourself*.  
  - **(No Buffer)** Its outputs are treated as *already internalized*; you do not "evaluate" or "verify" them before use (unlike consulting an expert).  

  Ownership ("I put it there") is rejected: what matters is seamless cognitive integration, not origin. The resource must act as a "direct pipeline" to your judgments/actions—like a spinal reflex bypassing the brain.

  ---

  ### 2. Clause by Clause (289 words)  
  - **Integration (transparent, automatic use)**: Forces inclusion of your password manager (Case 4). You don’t "decide" to use it; it’s instinctive. Excludes the CI pipeline (Case 7): you interpret the "red" as data *from* a tool, not *as* your belief.  
  - **Trust (pre-reflective acceptance)**: Required for the calendar alert (Case 3). You act on it as your intention without rethinking. Excludes the flaky test suite (Case 10): you distrust it, so it fails.  
  - **Access & Endorsement (reliable + endorsable)**: Explains the team wiki (Case 8). You endorse it *if* you trust it, but access isn’t always seamless (e.g., searching). This makes it borderline ("yes-ish"). Excludes the audit log (Case 9): you never access/endorse it.  
  - **No Buffer (no verification step)**: Crucial for excluding AI-modified notes (Case 5) and inline code completion (Case 11). You *evaluate* the AI’s edits/completions before accepting them. Dictation tools pass because you *pre-endorse* your speech before transcription.  

  ---

  ### 3. Verdicts on Your Cases (248 words)  
  1. **Notes file**: **Yes** (automatic, trusted, no buffer).  
  2. **Contact list**: **Yes** (same).  
  3. **Calendar**: **Yes** (alerts are integrated intentions).  
  4. **Password manager**: **Yes** (access is automatic; fingerprint isn’t "verification" but access *enabler*).  
  5. **AI-edited notes**: **No** (you buffer/verify its edits).  
  6. **Old chat thread**: **No** (scrolling is active querying; conclusions aren’t pre-endorsed).  
  7. **CI pipeline**: **No** (you interpret the alert, not internalize it).  
  8. **Team wiki**: **It depends**. **Yes** if you automatically trust/use it like your notes; **No** if you verify edits or doubt collective accuracy.  
  9. **Audit log**: **No** (zero access/endorsement).  
  10. **Flaky test suite**: **No** (distrust requires verification).  
  11. **Code completion**: **No** (you read/understand/evaluate it first).  

  ---

  ### 4. Two New Cases (152 words)  
  - **Case A: Medical alert bracelet** that auto-administers insulin via sensor. You never check levels; it acts.  
    - *Verdict*: **Yes**. Integrated, automatic, pre-endorsed (you set thresholds), no buffer.  
    - *Why uncomfortable?* Delegates *action* without conscious oversight—challenges "mind" as contemplative.  
  - **Case B**: **Traffic app rerouting you** in real-time. You follow blindly, never checking maps.  
    - *Verdict*: **Yes**. Functions as instinctual spatial reasoning.  
    - *Why uncomfortable?* Admits ephemeral, algorithm-driven tools as "mind"—erodes boundary between self and cloud services.  

  ---

  ### 5. What You Must Give Up (148 words)  
  Your principle cannot accommodate:  
  - **Ownership (clause d)**: You must drop this. The password manager (4) and team wiki (8) *don’t require you to "put it there"* to be mind-extensions—only integration/endorsement.  
  - **Calendar’s "different yes" (3)**: Under this principle, future intentions (calendar) aren’t distinct from past facts (notes). Both are equally "mental states."  
  - **Chat thread hesitation (6)**: Your instinct to call it "your moves" is rejected—it fails integration/endorsement.  

  This counts **against your initial intuitions**, not the principle. Ownership biases mislead in Cases 4, 5, 8, and 11. The revised principle resolves your inconsistencies by prioritizing *functional role* over origin. Surrender feels uncomfortable but aligns your yes/no splits.
