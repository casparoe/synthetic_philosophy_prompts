prompt: |-
  You're a metaphysician who works on time, modality and future contingents — the sort of person who has taught Aristotle's sea-battle discussion more times than you can count and who genuinely enjoys the medieval stuff about foreknowledge. Take your time with this and think carefully; I'd rather have something precise than something smooth. Start by brainstorming the candidate rules before you commit to any of them, and don't pad it out with reading suggestions — I just want the reasoning.

  I'm trying to work out what rule my tutor is running. She's been handing down verdicts on cases for weeks in our reading group, and they definately feel systematic but I can't pin the system down. Her verdicts so far:

  - "There will be a sea battle tomorrow", said today, with nothing on either side settling it: she says it's neither true nor false, it doesn't have a truth value yet.
  - "Either there will be a sea battle tomorrow or there won't be": she says that one's true, and insists this doesn't commit her to either half already being true.
  - "There'll be a total solar eclipse over Reykjavík on 14 June 2199" — just stipulate that the astronomy pins it down to the minute and that the dynamics is deterministic: she says true.
  - "The coin I flipped an hour ago came up heads", coin still covered, nobody has looked: she says it's already true or false, we just don't know which.
  - "If the admiral gives the order, there will be a battle": she says true, as a conditional, even though on her own view the consequent has no value yet.
  - A battle that is already underway on a station whose signals take 40 minutes to reach us, so we find out at 4pm: she says "there's a battle going on over there right now" is true now, and when someone raised the relativity worry she waved it off with "pick a frame, any frame".

  The coin and the 40-minute one are what make me think her "neither" can't just be about what we're in a position to know. But I can't tell whether the rule is something specifically about futurity, something about whether the present state of the world settles the matter, something about nomic determination, or something graded like "settled enough".

  The new case I want a prediction on. A hurricane is offshore. Stipulate that we have the exact current state of the atmosphere and that the model is exactly right about the dynamics; the spread in the model comes entirely from a genuinely chancy micro-process, not from ignorance. Is "the storm makes landfall tomorrow" true now, false now, or neither? And then:

  (i) The same setup, but landfall happens in 90% of the runs.
  (ii) The same setup, but at the macro level landfall happens in every single run, even though each run gets there by a different chancy micro-route, so it isn't nomically guaranteed.
  (iii) The forecast version: the meteorologist's morning bulletin says "there will be a battle tomorrow", the admiral reads it and, purely because of it, orders the attack, so there is a battle. Do we say the bulletin was true when it was issued?

  Also, she has never been asked the retro version — a year later, "it was true that morning that the storm would make landfall" — and I suspect that's where the rules come apart.

  Please give me, in this order:

  1. **Brainstorm** (~150 words): the messy first pass at what rules could generate all six verdicts. Don't commit yet.
  2. **The rules that fit** (~250 words): the two to four rules that are each consistent with every verdict above, each stated sharply enough to make predictions.
  3. **What each predicts** (~250 words): the verdict each rule gives on the main case and on (i), (ii) and (iii), with the disagreements flagged.
  4. **Your best guess** (~150 words): what she actually says about the main storm case, and why you're backing that rule over the others.
  5. **The tie-breaker** (~150 words): one further case, described concretely, that would separate the surviving rules, with each rule's prediction written down in advance — I'd guess something about the retro version or about a case where the outcome turns on an agent's undecided choice, but you pick.
  6. **Loose ends** (~100 words): where her package looks unstable. In particular: is her "neither true nor false" really a truth-value gap, or is it a polite way of saying false? And is the conditional verdict something she can actually keep alongside the rest?
reasoning: |-
  Hmm, the user is a philosophy student grappling with their tutor's nuanced position on future contingents. They've presented six established verdicts and want to predict the tutor's judgment on new storm-related cases. This requires careful metaphysical analysis - the user explicitly wants precision over smoothness, with structured reasoning.

  First, I need to unpack the tutor's existing positions. Her rejection of bivalence for unsettled futures (sea battle) while accepting excluded middle is classically Aristotelian. The deterministic cases (eclipse, covered coin) show she's not anti-realist - truth depends on settled actuality, not epistemic access. The 40-minute battle case confirms this, as does her dismissal of relativity concerns. The conditional verdict is particularly interesting: she affirms "if order then battle" despite the consequent's unsettled status, suggesting she treats conditionals as not truth-functional.

  For the storm cases, the key tension is whether objective chance blocks truth-value assignment. The user's variations (90% probability, macro-inevitability, self-fulfilling forecast) probe different aspects of "settledness." I suspect the tutor will reject truth-values when genuine chance remains, regardless of probability - making her position more radical than supervaluationism.

  The retroactive truth question will likely expose instability. If she maintains that "there will be a battle" was neither true nor false before the decision, does this mean we can't now say "it was true that it would happen"? That seems linguistically counterintuitive but metaphysically consistent.

  For the tie-breaker, I'll design a case where the outcome depends on a coin flip that has already occurred but remains unknown - this directly tests whether causal settledness or knowledge is her criterion. Her verdict on the covered coin case suggests she'll assign a truth-value here, showing her criterion is metaphysical, not epistemic.

  The conditional remains the trickiest component. If the consequent lacks truth-value, how can the whole conditional be true? She might be using a non-standard semantics where conditionals are true when the antecedent metaphysically guarantees the consequent.
answer: |-
  ### 1. **Brainstorm**  
  Her verdicts resist epistemic, relativistic, or probabilistic reductions. Core tensions:  
  - **Futurity vs. determinism**: Unsettled future contingents (sea battle) lack truth values, but deterministic futures (eclipse) are true.  
  - **Actuality without knowledge**: Covered coin is true/false *now*; distant battle is true *now*. This implies truth depends on **present causal settledness**, not observation.  
  - **Logic constraints**: Excluded middle holds despite truth-value gaps, and conditionals can be true with indeterminate consequents.  
  Possible rules:  
  (A) Truth requires **causal determination by current states** (microphysical or macrophysical).  
  (B) Truth requires **metaphysical settledness** (no open possibilities remain).  
  (C) **Macro-level determinism suffices** for truth, even with micro-indeterminism.  
  (D) **Probability thresholds**: High chance → truth (but she dismisses relativity, suggesting an ontic basis, not degree).  

  ### 2. **The Rules That Fit**  
  **Rule 1 (Causal Determination)**:  
  *A future-tensed proposition is true/false now iff the current state of the world causally necessitates its truth/falsity.*  

  **Rule 2 (Metaphysical Settledness)**:  
  *A future-tensed proposition is true/false now iff no future contingency could alter its outcome (i.e., it is "fixed").*  

  **Rule 3 (Macro-Settledness)**:  
  *A future-tensed proposition is true/false now iff (a) the macroscopic dynamics are deterministic *or* (b) micro-indeterminacies are causally irrelevant to the outcome.*  

  **Shared commitments**:  
  - Excluded middle is *logically* true but doesn’t imply bivalence for disjuncts.  
  - Past/proximate events are truth-apt (covered coin, distant battle).  
  - Conditionals are evaluated modally: "If A, then B" is true iff in *all* worlds where A holds, B holds.  

  ### 3. **Predictions**  
  **Main case** (Hurricane with chancy micro-process):  
  - **R1**: Neither (current state doesn’t necessitate landfall).  
  - **R2**: Neither (outcome metaphysically open).  
  - **R3**: Neither (micro-chance causally relevant).  

  **(i) 90% chance of landfall**:  
  - **R1/R2**: Neither (still not settled).  
  - **R3**: Neither (micro-chance still relevant). *All agree no truth value.*  

  **(ii) Macro-deterministic, micro-chancy**:  
  - **R1**: Neither (micro-indeterminism breaks necessitation).  
  - **R2**: Neither (metaphysical openness remains).  
  - **R3**: **True** (micro-indeterminacy doesn’t affect macro-outcome).  

  **(iii) Self-fulfilling forecast**:  
  - **R1**: Neither (bulletin issued before admiral’s decision; future contingent).  
  - **R2**: Neither (not fixed at issuance).  
  - **R3**: Neither (micro-contingencies mediate the causal chain). *All agree "neither" at issuance.*  

  *Disagreement emerges in (ii)*: R3 assigns truth; R1/R2 do not.  

  ### 4. **Best Guess**  
  She says **"neither" for the main storm case**, aligning with **Rule 1 (Causal Determination)**.  
  **Why Rule 1?**  
  - Explains all six verdicts:  
    - Sea battle/eclipse distinction mirrors necessitation vs. its absence.  
    - Covered coin/distant battle are causally settled *now*.  
    - Conditional holds via modal strength, not truth-functionality.  
  - Rejects probabilistic thresholds (i) and macro-guarantees without micro-necessitation (ii). Rule 3 is too permissive for her; she insists micro-chance blocks truth even if macro-outcome is certain.  

  ### 5. **Tie-Breaker Case**  
  **"The die in the sealed box shows 6."**  
  *Setup*: A fair die is rolled at noon in a perfectly isolated box (no quantum effects). At 12:01, the outcome is causally fixed but unknown. At 12:30, you utter the sentence.  

  **Predictions**:  
  - **Rule 1**: **True or false** (causally settled at utterance).  
  - **Rule 2**: **True or false** (metaphysically fixed).  
  - **Rule 3**: **True or false** (macro-state determined).  

  *But if she says "neither"*, she’s likely conflating truth with knowability (contradicting covered coin verdict). *If "true/false"*, Rules 1–3 hold.  

  ### 6. **Loose Ends**  
  **Truth-value gap**: Genuine. She rejects supervaluationism (which would make "sea battle" false) and epistemicism (which assigns unknown truth values). Her gap reflects *metaphysical unsettledness*.  
  **Conditional instability**: The verdict *can* hold if conditionals are not truth-functional but evaluated via strict implication (B true in all A-worlds). But it strains coherence: if "battle" lacks truth value, what are the A-worlds? She likely uses a **non-classical semantics** (e.g., Łukasiewicz logic) where conditionals are true when antecedents are false or consequents true *when evaluable*.  
  **Retro trouble**: Later, "It was true that the storm would land" must be false if "storm will land" had no truth value. But this clashes with intuition and may require error theory about past-tensed claims.
