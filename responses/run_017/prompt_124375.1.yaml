prompt: |-
  I'm helping run a small reading group on vagueness this term, and before we wade into epistemicism vs supervaluationism I want the spec nailed down: what does a theory of vagueness actually have to get right? Not "here's how the two views score" — we'll do that ourselves in a couple of weeks — but the list of requirements, each with the case or intuition that motivates it, and your view on which of them are genuine constraints and which are just things one camp already wanted to hear. No reading list, we've got a syllabus. Some candidates I keep coming back to: the sorites/tolerance intuition; the way higher-order vagueness seems to come back no matter how many "definitely"s you stack on top; the Dummett-flavoured worry that the supervaluationist ends up committed to there being a cut-off somewhere while no particular number is where it is (correct me if I've garbled that); the feeling that the epistemicist's boundary is brute in a way that's meant to be objectionable; and the one I care most about, separating vagueness from plain ignorance.

  That last one comes from two cases I made up and can't stop poking at. Case one: a game show announces that the jackpot goes to the first person in the queue whose exact birth weight in grams was a multiple of seven. The hospital records were destroyed in a fire, no other copy exists anywhere, and nobody will ever find out — but there either was such a person or there wasn't. My intuition is that "gets the jackpot" is as sharp as anything gets and merely unknown, not vague in the way "tall" is. So: does your theory predict that? And if it says the difference is just that in this case someone could in principle have found out, I want to know why in-principle knowability gets to do that much work. Case two: a community gets tired of arguing and coins a word, "bhen", meaning borderline tall — you're a bhen if you're neither clearly tall nor clearly not. Now run the sorites on "bhen" again. Does it have its own penumbra, and where does that one come from? Does it collapse back into plain tallness? Or is the question somehow ill-formed? I want to know which of those answers each theory is even allowed to give and what each costs it.

  Then the structural part, which is what I most want: flag any two requirements on your list that look like they can't both be satisfied — my hunch is that "vindicate tolerance", "keep classical logic all the way up", and "no brute unknowable facts" can't all hold, but say which horn each of the two views actually takes, and tell me which single requirement does the most work in knocking candidates out. One more thing that's specific to us: our ulterior motive is that whatever account we land on should eventually say something about decision procedures — think of a system that has to make calls on vague predicates (eligibility rules, moderation thresholds) and justify the call afterwards to someone who was denied. So please add whatever requirements follow from that use rather than from the semantics seminar, and mark them, along with everything else, as non-negotiable or as a preference. A short table comparing the two views at the very end is fine, but the criteria and their cases are the part I actually want.
reasoning: |-
  Okay, this is a rich query from someone clearly deep in the weeds of vagueness theory. They're running a reading group and want to nail down the core requirements for any theory of vagueness before diving into epistemicism vs supervaluationism. What stands out is their focus on separating vagueness from ignorance - those two original cases about the game show and "bhen" are particularly sharp tools to probe theories. 

  First, let's unpack their explicit asks: they want (1) a master list of what theories must explain, with motivating cases, (2) distinction between genuine constraints vs partisan preferences, (3) analysis of their ignorance/vagueness cases, (4) identification of incompatible requirements, and (5) additional constraints from decision procedures. The ulterior motive about justifiable automated decisions is especially practical - most academic discussions ignore this.

  Hmm... their game show case is brilliant because it isolates unknowability without vagueness. The hospital records' destruction creates factual ignorance, but "multiple of seven" remains precise. Meanwhile their "bhen" case weaponizes higher-order vagueness - if we try to formalize the borderline, does that new predicate itself become vague? That's a grenade tossed at supervaluationism's truth-value gaps and epistemicism's sharp boundaries alike.

  For the structural tension they sense: yes, the triad of tolerance, classical logic, and no brute unknowables is likely inconsistent. Epistemicism jettisons tolerance; supervaluationism sacrifices classical logic in subtle ways. The "no brute unknowables" requirement is where epistemicism bleeds - Williamson's magic numbers feel metaphysically arbitrary.

  What's refreshing is they explicitly don't want scorekeeping between theories yet - just the playing field itself. So I'll resist comparing views until the end. The decision-procedure angle needs emphasis: for automated systems making eligibility calls, supervaluationism's "super-truth" might better justify rejecting claims ("no admissible precisification makes you eligible"), while epistemicism could say "there's a fact but we can't know it" which feels unsatisfying for appeals. 

  Biggest challenge will be separating unavoidable constraints from debatable desiderata. For example, is higher-order vagueness mandatory? Some theorists (like Keefe) think supervaluationism can accommodate it with recursive precisifications; others (like Williamson) call it incoherent. That debate might belong in their later sessions though. 

  Their Dummett point is well-phrased: supervaluationism does imply there's a cutoff across precisifications while denying any specific point is "the" cutoff. Whether that's acceptable hinges on if we tolerate semantic indecision - which circles back to whether vagueness is ontological or epistemic. 

  For the table at the end, I'll need to flag which constraints fatally wound each theory. The ignorance/vagueness distinction looks like a supervaluationist win (they can classify the game show as precise-but-unknown), while epistemicism struggles to differentiate them cleanly. But epistemicism scores by preserving classical logic utterly. 

  Most underrated requirement they mentioned? The "justify denial" use-case. That's where supervaluationism's "no admissible precisification" justification might feel fairer than epistemicism's "we can't know but you lost" - even if both lead to similar rejection outcomes. Practical ethics creeps into formal semantics here.
answer: |-
  Here’s a distilled framework for evaluating theories of vagueness, centered on core requirements, their motivations, and tensions — tailored to your focus on distinguishing vagueness from ignorance and decision procedures. I’ll flag negotiable vs. non-negotiable constraints and highlight incompatibilities.

  ---

  ### **Core Requirements for a Theory of Vagueness**
  *(Non-negotiable = NN; Preference = P; Contextual = C)*

  1. **The Sorites Tolerance Intuition (NN)**  
     - **Case**: A grain of sand can’t turn a non-heap into a heap; removing $1 from a rich person shouldn’t make them non-rich.  
     - **Constraint**: Any theory must explain why tolerance (small changes preserve category membership) seems compelling yet leads to paradox.  
     - *Why NN?* Central to the phenomenon; failure here implies the theory misses the point.

  2. **Higher-Order Vagueness (NN)**  
     - **Case**: Stacking "definitely" operators ("definitely tall," "definitely definitely tall...") never eliminates vagueness. There’s no sharp boundary between "vague" and "precise."  
     - **Constraint**: Must accommodate borderline cases of borderline cases (e.g., heights neither clearly tall nor clearly borderline tall).  
     - *Why NN?* Intuition that vagueness is "open-textured" — attempts to precisify it reintroduce vagueness.

  3. **No Epistemically Brute Cutoffs (NN for many; P for epistemicists)**  
     - **Intuition**: It’s implausible that there’s a precise boundary (e.g., between tall/non-tall) that is *in principle unknowable*, with no explanation for why it falls where it does.  
     - **Dummett’s Challenge to Supervaluationism**: While no *single* cutoff exists, the supervaluationist must say *there is a range* where cutoffs occur across precisifications — implying a "hidden" sharp boundary in the logic.  
     - *Why NN?* Rejects mysterious metaphysical commitments; aligns with the intuition that vagueness isn’t just ignorance.

  4. **Distinguish Vagueness from Ignorance (NN)**  
     - **Your Game Show Case**: "Birth weight multiple of 7" is precise but unknown — no vagueness. "Tall" is vague even if all facts are known.  
     - **Constraint**: A theory must explain why vagueness isn’t merely lack of knowledge (e.g., via in-principle unknowability or semantic indecision).  
     - *Why NN?* Key to isolating the target phenomenon.  
     - **Theories’ Answers**:  
       - *Epistemicism*: Struggles. Claims both are cases of ignorance (vagueness = ignorance of sharp boundaries). Your case challenges this: why does "tall" *feel* different?  
       - *Supervaluationism*: Explains cleanly. Vagueness = semantic indecision (multiple admissible precisifications), not ignorance of facts. The game show has one precisification (unknown); "tall" has many.  
       - **Why in-principle knowability matters**: If a fact is *in principle* knowable (like the game show answer), it’s epistemic; if not (like "tall"’s boundary), it’s metaphysical/semantic. This distinction *should* do heavy lifting.

  5. **The "Bhen" Problem (Higher-Order Vagueness Test) (NN)**  
     - **Case**: If "bhen" = borderline tall, then is *borderline bhen* possible? Does "bhen" have a sharp boundary?  
     - **Constraint**: Must avoid collapsing into a sharp hierarchy or regress.  
     - **Theories’ Allowed Answers**:  
       - *Epistemicism*: "Bhen" has sharp boundaries (unknowable), leading to sharp boundaries for all orders. Rejects higher-order vagueness as illusory.  
       - *Supervaluationism*: "Bhen" inherits vagueness from "tall." Borderline cases of "bhen" exist (via further precisifications). No collapse.  
       - *Costs*: Epistemicism denies higher-order vagueness; supervaluationism faces complexity in modeling indefinite hierarchies.

  6. **Preserve Classical Logic (P)**  
     - **Motivation**: Bivalence, excluded middle, and other classical rules underpin reasoning. Rejecting them complicates logic/mathematics.  
     - *Why P?* Not all theorists agree this is necessary (e.g., fuzzy logicians). But for epistemicism/supervaluationism, it’s pivotal.

  7. **Decision-Justifiability (C)**  
     - **Use Case**: A system denying eligibility (e.g., "not tall enough") must justify itself to rejected claimants.  
     - **Constraint**: The theory must allow for *defensible decisions* — not just "true/false" claims, but *reasons* for classifications.  
     - *Why C?* Practical necessity for real-world applications (e.g., legal or AI systems).  
     - **Implications**:  
       - Supervaluationism: Can say "no admissible precisification makes you eligible." Justification appeals to consensus or context.  
       - Epistemicism: Can only say "you don’t meet the (unknowable) standard." Less satisfying for justification.

  ---

  ### **Key Tensions & Trade-offs**
  Your hunch is correct: **Tolerance + Classical Logic + No Brute Cutoffs** form an inconsistent triad.  
  - **Epistemicism** keeps classical logic and rejects brute cutoffs as objectionable? (but accepts unknowable cutoffs!).  
    → **Takes horn**: Rejects tolerance (sharp cutoffs exist).  
  - **Supervaluationism** preserves tolerance and avoids brute cutoffs (no single cutoff).  
    → **Takes horn**: Sacrifices classical logic (truth-value gaps; non-bivalent).  

  **Which requirement does the most damage?**  
  - **No Brute Cutoffs** rules out epistemicism for many.  
  - **Higher-Order Vagueness** challenges supervaluationism’s formalizability.  
  - **Decision-Justifiability** favors supervaluationism (provides reasons for denials).

  ---

  ### **Theory Comparison at a Glance**
  | Requirement                | Epistemicism                          | Supervaluationism                     |
  |----------------------------|---------------------------------------|---------------------------------------|
  | **Sorites Tolerance**      | Denies (sharp cutoffs exist)          | Preserves (no single cutoff)          |
  | **Higher-Order Vagueness** | Denies (all boundaries sharp)         | Accommodates (via more precisifications) |
  | **Brute Cutoffs**          | Accepts (unknowable)                  | Avoids (no single cutoff)             |
  | **Vagueness ≠ Ignorance**  | Fails (vagueness = ignorance)         | Succeeds (vagueness = indecision)     |
  | **"Bhen" Boundary**        | Sharp (but unknowable)                | Vague (penumbra recurs)               |
  | **Classical Logic**        | Preserves fully                       | Sacrifices bivalence                  |
  | **Decision-Justifiability**| Weak ("fact exists but hidden")       | Strong ("no context justifies you")   |

  ---

  ### **Recommendations for Your Group**
  1. **Non-negotiable Core**: Sorites, higher-order vagueness, and vagueness-ignorance distinction are indispensable.  
  2. **Pressure Points**:  
     - Test epistemicism on the game show: Why does "tall" feel vague but "multiple of 7" not?  
     - Test supervaluationism on "bhen": Does it demand infinite meta-languages?  
  3. **Decision Procedures**: Supervaluationism better supports justifications ("no reasonable standard includes you"). Epistemicism’s "brute fact" stance risks alienating users.  
  4. **Ultimate Trade-off**: Choose between epistemicism’s logical purity and supervaluationism’s intuitive fidelity to open-endedness.  

  This framework should equip your group to dissect theories not just by internal coherence, but by what they *must* explain to count as theories of *vagueness*. The game show and "bhen" cases are particularly potent tools — use them relentlessly.
