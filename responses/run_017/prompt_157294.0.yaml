answer: |-
  Here’s a complete design for your beekeepers' session, structured as a hands-on simulation game followed by a guided debrief. It avoids technical terms until the end, focuses on multi-level selection tensions, and includes your key requirements (assortment dial, currency wrinkle, and optional gene-level element).

  ---

  ### **Game: The Hive Lottery**  
  *(Total: 60 minutes; 4 rounds, 12-15 mins each)*  

  **Materials per Table:**  
  - 2 bowls (1 for "nectar collection," 1 for "offspring")  
  - 40+ paper counters (2 colors: **Yellow** = Cooperators, **Blue** = Selfish)  
  - 10+ cheap sweets (e.g., hard candies)  
  - 1 coin (for neutral marker)  
  - Scorecards (see below)  
  - Group ID sign (e.g., "Hive 1," "Hive 2")  

  **Setup:**  
  1. Divide participants into groups of 4–6. Aim for 4–6 groups.  
  2. Give each group:  
     - A starting population of 8 counters: **4 yellow (Cooperator "Workers")**, **4 blue (Selfish "Drones")**.  
     - 1 coin (heads = "Flower" marker, tails = "Leaf" marker; neutral trait).  
     - Scorecard tracking:  
       ```  
       Round | # Yellow | # Blue | Group Offspring | Survived? (✔/✖)  
       ```  

  ---

  ### **Round Rules**  
  **Each round has 3 phases:**  
  1. **Reproduction (Individual Level):**  
     - **Cooperators (Yellow):** Add 2 counters to your offspring bowl. *But* they "forage" for the group: Place 1 sweet in the nectar bowl.  
     - **Selfish (Blue):** Add 3 counters to your offspring bowl. *No* sweet added to nectar.  
     - **Neutral Trait:** Flip the coin. All offspring inherit this marker (e.g., all "Flower").  

  2. **Group Survival (Group Level - Currency Wrinkle):**  
     - Half the groups (e.g., Hives 1, 2, 3) use **Rule A**: Survive if the nectar bowl has **≥3 sweets** (threshold).  
     - Half (e.g., Hives 4, 5, 6) use **Rule B**: Survive if **total offspring > other groups** (competition).  
     - Surviving groups progress. Others "collapse" (skip next round).  

  3. **Reassembly (Population Level - Assortment Dial):**  
     - Collect *all* offspring counters in a central pool.  
     - **Assortment Rules by Round:**  
       - **Round 1:** *Low Assortment* - Randomly redistribute counters into new groups (same size).  
       - **Round 2:** *High Assortment* - Each group's offspring form 1 new group (if enough counters).  
       - **Round 3:** *Low Assortment* (scramble again).  
       - **Round 4:** *High Assortment* (groups stay together).  
     - Update scorecards with new #yellow/#blue counters.  

  *(Optional Gene-Level Wrinkle):*  
  - Add a "parasite" rule: Any individual can "infect" offspring (add a **black dot** on 1 counter). Infected counters:  
    - Produce **+1 extra offspring** (boosts individual reproduction).  
    - **Remove 1 sweet** from nectar bowl (harms group).  
  - Participants choose whether to infect (emergent tension).  

  ---

  ### **Predicted Dynamics**  
  - **Within groups:** Selfish (blue) out-reproduce cooperators (yellow) every round (3 > 2 offspring).  
  - **Between groups:** Groups with more cooperators (yellow) collect more sweets, surviving more often.  
  - **Assortment effect:**  
    - *Scrambled rounds:* Selfish increase (no group structure).  
    - *High-assortment rounds:* Cooperators increase (group benefits dominate).  
  - **Currency conflict:**  
    - Rule A groups (threshold) survive with moderate cooperation.  
    - Rule B groups (competition) need high cooperation to outproduce others.  
  - **Neutral marker:** Randomly fluctuates (no selection pressure).  
  - **Gene wrinkle:** Infections spread individually but harm groups.  

  ---

  ### **Debrief Framework**  
  *(25 minutes; use Socratic questioning)*  

  1. **Map the Game to Reality (10 mins):**  
     - *"What happened to cooperators when groups were scrambled? Why?"* → **Within-group selection**.  
     - *"When did cooperators thrive? Why?"* → **Between-group selection** (variation between groups drives evolution).  
     - *"Did all groups value the same thing? How did that change outcomes?"* → **Currency problem** (threshold vs. competition).  
     - *"Did the coin marker behave like cooperators/selfish? Why?"* → **Neutral evolution** (no fitness effect).  

  2. **Connect to Bees (5 mins):**  
     - *"In this game, when did cooperation win? How might this mirror a hive?"* → Let them arrive at **relatedness/kinship**.  
     - If someone says *"Workers are sisters!"*, affirm: *"Yes! How does our assortment rule reflect that?"* → High assortment = high relatedness.  

  3. **The Big Question (5 mins):**  
     - *"We saw that cooperators can win even while losing in every single group. What does this say about 'fitness'?"* → Introduce **levels of selection** (gene, individual, group).  
     - **Crucial disclaimer:** *"Math can describe this in multiple ways (genes, kin, groups). Our game doesn’t prove one—it shows why scientists still debate which is most fundamental."*  

  4. **Handle Pitfalls (5 mins):**  
     - **If "scrambled rounds feel rigged":** *"In nature, dispersal mixes groups too! This shows why relatedness matters."*  
     - **If teens/adults disengage:** Assign roles: Teens count offspring, adults track sweets/strategy.  
     - **If they say "It depends on the numbers":** Agree! *"Exactly—the balance between within-group and between-group pressure is everything."*  

  ---

  ### **Logistical Tips**  
  - **Prep:** Pre-make counter sets (yellow/blue), label bowls, and test group sizes.  
  - **Scaling:** For 12–30 people, use 4–6 groups (adjust counters/sweets).  
  - **Helper Role:** Manages central pool during reassembly; watches for "aha" moments.  
  - **No Projector?** Use flip charts:  
    - Track room-wide #yellow/#blue per round.  
    - Sketch a "family tree" of groups during high-assortment rounds.  
  - **Sweets:** Use as "nectar" (currency) and rewards for engaged groups.  

  ### **What the Game Can’t Do**  
  - It **doesn’t resolve** the gene/kin/group selection debate—it illuminates the *tension* between them.  
  - **Say this explicitly:** *"This is a toy model. In nature, these levels interact (e.g., kinship enables group success). But the arithmetic equivalence means we need deeper theory—like Hamilton’s rule—to untangle it."*  

  By making the group/individual tension visceral and letting debates emerge organically, you’ll leave them understanding why this question still buzzes.
