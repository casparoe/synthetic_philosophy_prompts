  Okay, let me approach this step by step. The user describes a fascinating phenomenon of partitioned moral attitudes - treating the same people differently across domains (basketball court vs real life, work metrics vs personal honesty) without resentment in certain contexts. 

  First, I need to catalog potential concepts that might fit. Starting with Strawson's objective attitude: it resembles it superficially because resentment is suspended, but differs crucially. Strawson's version is global (toward a person) and alternative to participation, whereas here it's domain-specific and coexists with reactive attitudes elsewhere. Not a match.

  Role morality comes next. But the user explicitly rejects this because the actions (like deception) are identical across domains - it's the attitude that changes, not the moral classification. Also, the resentment toward boundary violations suggests something deeper than role ethics.

  Then there's excuse/exemption. Doesn't fit because no one is considered non-responsible; in fact, they're held responsible when the same conduct crosses domains. The person's capacity isn't in question.

  Compartmentalization? The user notes this isn't unconscious coping but fully conscious coordination. Everyone knowingly operates with this dual-track system.

  What about social contract theory? There's surface similarity in the mutual agreement aspect, but social contracts typically govern behavior, not emotional responses. Here it's precisely about managing reactive attitudes.

  After eliminating these, I see the core is a reciprocal, domain-specific suspension of reactive attitudes that's itself subject to higher-order reactive attitudes when violated. This needs a new term: "circumscribed objectivity."

  Now to define it precisely: It's a socially negotiated bracketing of reactive attitudes within a defined activity-space, where participants (a) mutually suspend resentment for rule-exploitation, (b) maintain standard reactive attitudes outside that space, and (c) hold each other accountable for maintaining this partition.

  Boundary cases help clarify: 
  - Case 1: Poker players bluffing at cards but not in business deals - acceptable circumscribed objectivity. 
  - Case 2: That same player stealing chips - violates the bracket, triggering resentment.

  The one-sided version is absolutely a corruption - demanding objectivity toward others while claiming full participation for oneself. This asymmetrical version reveals that the phenomenon's moral force comes from reciprocity.

  Regarding Strawson: this doesn't refute him but shows reactive attitudes are more rationally structured than his "global stance" framing suggests. The higher-order resentment about bracket violations confirms that participation is inescapable - we're always already in the moral community, even when locally bracketing reactions. The objectivity is always nested within participation.
answer: |-
  This is a profound observation that cuts to the heart of moral psychology. After methodically examining candidate concepts, I conclude no established term fully captures your phenomenon. Below is my conceptual dissection, followed by a proposed term and its boundaries.

  ### Candidate Concepts & Why They Don't Fit:
  1. **Strawsonian Objective Attitude**:  
     *Why it fails*: Strawson's objective attitude is global (applied to a *person* as impaired) or situational (temporary suspension due to distress). Yours is a **domain-specific, reciprocal, and non-pathologizing** suspension coexisting with full participant attitudes toward the same agent. Crucially, it's not a withdrawal from engagement but a *form* of engagement.

  2. **Excuse/Exemption**:  
     *Why it fails*: Excuses negate blameworthiness for a *particular act* (e.g., "he didn't know the rule"). Exemptions negate general moral capacity (e.g., insanity). Here, agents are fully responsible *for the same act-type* (deception) in other domains, and no incapacity is alleged.

  3. **Role Morality**:  
     *Why it fails*: Role ethics distinguishes acts by context (e.g., a surgeon cutting flesh isn't assault). But your cases involve **identical acts** (deception, rule-manipulation) being *attitudinally* differentiated without redefining their moral nature.

  4. **Psychological Compartmentalization**:  
     *Why it fails*: Ordinary compartmentalization is intra-psychic and often unconscious. Your case involves **interpersonal negotiation**, mutual awareness, and deliberate coordination. It's structural, not cognitive.

  5. **Hypocrisy**:  
     *Why it fails*: Hypocrisy involves covert double standards for advantage. Your arrangement is overt, reciprocal, and mutually beneficial—violations provoke resentment precisely because fairness is expected.

  6. **Contractualism/Social Agreement**:  
     *Why it fails*: While reciprocity is key, contractualism typically governs *behavior*, not the **management of reactive attitudes themselves**. Your phenomenon targets the *suspension of resentment* as the object of agreement.

  ---

  ### Verdict: A New Concept – **Circumscribed Objectivity**
  **Definition**: A socially negotiated, domain-specific bracket suspending reactive attitudes (e.g., resentment) for certain act-types, where:  
  (i) Participants mutually understand the bracket's boundaries;  
  (ii) Standard reactive attitudes apply outside the bracket;  
  (iii) Agents remain full participants in moral responsibility generally;  
  (iv) Violations of *the bracket itself* (e.g., misapplying its logic) trigger higher-order reactive attitudes.  

  **Boundary Cases**:  
  1. **Acceptable**: Poker players who bluff relentlessly at the table but would never lie about repaying a debt. Mutual resentment arises only if a player exploits bluffing norms *outside* poker.  
  2. **Unacceptable**: A sales team agreeing not to resent "puffery" toward clients, but one member uses identical exaggerations to manipulate a colleague's promotion review. This violates the bracket—the act-type is the same, but the domain (internal trust) was never negotiated as "circumscribed."

  ---

  ### One-Sidedness: Corruption, Not Variant
  The asymmetric case (demanding objectivity toward oneself while claiming participation from others) is **pathological circumscribed objectivity**. It reveals the phenomenon's core: reciprocity is constitutive. Resentment toward the hypocrite arises because they exploit the bracket’s *mutuality*—treating it as a tool for unilateral exemption rather than shared practice. This corruption confirms that circumscribed objectivity is fundamentally relational.

  ---

  ### Pressure on Strawson
  This **refines but doesn't refute** Strawson:  
  1. **Rational Regulation**: Circumscribed objectivity shows reactive attitudes *are* rationally sensitive to context in ways Strawson understated. We can locally suspend resentment for functional reasons (e.g., preserving a game/work efficiency) without global detachment.  
  2. **Higher-Order Participation**: But the objectivity is never "pure"—it's nested within the participant stance. Resentment at bracket violations proves Strawson right that we cannot sustain wholesale objectivity: the very agreement *to* bracket is a mutual recognition that demands responsibility.  

  **Conclusion**: You've identified a sophisticated moral practice where communities co-construct "attitude-free zones" for functional cooperation, while holding each other accountable *for maintaining the zones themselves*. This isn't a failure of moral engagement—it’s its complex maturity. I propose the term **circumscribed objectivity** to capture this structured, reciprocal modulation of our reactive ecology.
