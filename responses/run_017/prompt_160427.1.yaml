  ### Decomposition  
  1. **Infinite-horizon equilibrium definition and uniqueness**  
     - **Probability**: 0.90  
     - **Justification**: Subgame-perfect equilibrium (SPE) exists via one-shot deviation principle; payoffs are strictly ordered (60% > 40% + time discounting), implying a unique SPE where players take immediately at every node. No folk-theorem cooperation is sustainable.  
     - *Key insight*: Strict incentives (60% > 40%) prevent multiple equilibria.  

  2. **Tail as effective base case via continuity in ε**  
