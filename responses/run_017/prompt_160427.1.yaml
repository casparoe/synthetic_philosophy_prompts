     - **Justification**: The tail’s expected value converges rapidly (probability of continuing beyond node 10 is ≈10⁻¹⁴). As ε → 0, SPE play approaches the non-leaky game’s "take immediately" outcome.  
     - *Key insight*: A 98% exit hazard per step makes the tail negligible; node 6+ strategies mirror a terminal split.  

  3. **Payoff parameters as primary driver**  
     - **Probability**: 0.99  
