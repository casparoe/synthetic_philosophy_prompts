answer: |-
  ## Joint Statement: The Doing/Allowing Distinction in End-of-Life Ethics
  **(Produced by the Adversarial Collaboration Working Group: Distinctionist & Deflationist Perspectives)**

  **Section 1: Agreed Foundational Claims**

  1.  The terms "doing harm" and "merely allowing harm" capture a robust pre-theoretical intuition present in common moral reasoning and professional guidelines concerning end-of-life care.
  2.  The *extension* of the distinction in paradigm cases (e.g., actively injecting a lethal dose vs. withholding non-beneficial CPR) is widely recognized and not primarily in dispute between our positions.
  3.  The doing/allowing distinction is conceptually distinct from the intending/foreseeing distinction, although they may interact in complex ways in specific cases.
  4.  Moral intuitions about the permissibility of actions involving harm are highly sensitive to contextual factors (e.g., patient wishes, prognosis, available alternatives, institutional roles, consequences).
  5.  When contextual factors (including causal structure, evidence, costs, risks, motives, and obligations) are carefully matched across a "doing" scenario and an "allowing" scenario, the *intuitive moral gap* between them often narrows significantly or disappears for many observers.
  6.  Both positions acknowledge that *causal independence* of the threat from the agent’s action is frequently a salient feature distinguishing paradigm allowing cases from paradigm doing cases, though they disagree on its moral significance.
  7.  Both positions recognize that *epistemic* factors (certainty of outcome, knowledge of alternatives) and *consequential* factors (resource allocation, institutional burdens, risk of error or abuse) are crucial to the overall moral assessment of any end-of-life decision and often correlate with the doing/allowing distinction in practice.
  8.  Any defensible moral theory must account for the special responsibilities arising from specific roles (e.g., clinician-patient relationships) and institutional settings (e.g., healthcare systems).
  9.  The potential for slippery slopes, misinterpretation, and erosion of trust in healthcare systems constitutes a significant *practical* concern that must inform rules and guidelines, regardless of the underlying moral status of the doing/allowing distinction.
  10. Further conceptual analysis and careful case comparison are necessary tools for clarifying the nature and significance of the distinction.
  11. Neither position asserts that "doing harm" is *always* impermissible or that "allowing harm" is *always* permissible; overall permissibility depends on a multitude of factors.
  12. The goal of palliative care is the relief of suffering and the provision of comfort and dignity; decisions near the end of life are complex and often involve tragic choices where harm cannot always be avoided.

  **Section 2: Key Disagreements (Formulated by Each Side)**

  | Disagreement Focus          | Distinctionist Formulation                                                                                                | Deflationist Formulation                                                                                                                                                     | Disagreement Type (Substantive/Verbal) |
  | :-------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------- |
  | **Core Moral Asymmetry**    | There exists an irreducible moral asymmetry: causing a harm imposes a stronger justificatory burden than allowing that same harm to occur, even when other relevant factors are identical. | There is no fundamental moral asymmetry between doing and allowing harm itself; any persistent difference in permissibility judgments is fully explained by differences in causal role, evidence, consequences, or the expression of will. | **Substantive**                        |
  | **Explanatory Primacy**     | The moral force of the doing/allowing distinction is not merely derivative; it provides a foundational constraint that explains why certain causal roles or evidential contexts carry moral weight. | Factors like causal independence, the costs/risks of intervening, what inaction signifies about intent or expectations, and systemic manageability are explanatorily primary; the doing/allowing label is a useful but non-fundamental shorthand for these. | **Substantive**                        |
  | **Constraint vs. Weight**   | The prohibition against doing harm functions more like a defeasible constraint or side-constraint, making certain actions exceptionally difficult to justify, rather than simply a heavy negative weight in a consequentialist calculus. | Any residual intuitive reluctance to "do harm" reflects the aggregate weight of the negative consequences (including psychological, relational, and systemic) typically associated with such acts, not a distinct constraint. | **Substantive**                        |
  | **Sufficiency of Deflation** | The Deflationist account fails to capture the full normative force and distinctive character of the constraint felt against *initiating* harm, even in hypothetical scenarios where standard deflationary factors are controlled. | The Distinctionist account fails to identify any unique normative factor beyond the deflationary ones; appeals to "initiating harm" either collapse into causal claims or introduce an unexplained moral primitive. | **Substantive**                        |
  | **"Independence"**          | The condition "the threat is already underway independently of the agent" is a morally salient feature characterizing allowing, irreducible to non-moral descriptions of the causal chain. | "The threat is already underway independently of the agent" is a non-moral, causal description that helps explain why intervention might be costly, risky, or not reasonably expected, but adds no *sui generis* moral element. | **Substantive** (Partly Verbal re: "moral") |

  **Section 3: Cruxes for Future Inquiry (With Pre-Registered Predictions)**

  1.  **The Equalised-Pair Protocol & "Independence"**
      *   **(i) Sub-Question:** Can the condition "the threat is already underway independently of the agent" be fully specified using only non-normative, non-agential concepts (e.g., physics, biology, probability), or does its application inherently rely on moral or agential concepts?
      *   **(ii) Moves Distinctionist:** If it *can* be fully specified non-normatively, this weakens their claim that "independence" marks a unique moral feature. If it *cannot*, it supports the view that allowing involves a distinct agential relation.
      *   **(iii) Test Case/Argument:** Detailed conceptual analysis attempting to define "threat underway independently" for a specific biological process (e.g., terminal dehydration in a refusing patient) using only physical states, causal chains, and probabilities, without reference to duties, permissions, or agency.
      *   **(iv) Predictions:**
          *   *Distinctionist:* The analysis will reveal an ineliminable reference to normative concepts (e.g., "expected outcome absent intervention," implying a baseline duty) or agential context.
          *   *Deflationist:* The condition can be fully specified non-normatively (e.g., "physiological process X leading to death at time T with probability P, initiated at time T-i without agent A's involvement").

  2.  **Timing: Action vs. Outcome Configuration**
      *   **(i) Sub-Question:** Is the moral classification (doing/allowing) of a death determined solely by the agent's conduct *at the time of their decisive action*, or can it be affected by the causal configuration *at the time the death occurs*?
      *   **(ii) Moves Both:** Challenges intuitions about responsibility and the "fixing" of the agent's moral relation to the outcome. Distinctionist: Outcome-based classification might undermine the constraint. Deflationist: Action-based classification might ignore relevant changes in causal responsibility.
      *   **(iii) Test Case:** *The Infusion Pump:* Clinician A sets a standard, safe morphine infusion for comfort. Hours later, while A sleeps (unreachable), the patient's renal function crashes unexpectedly, making the *same* infusion rate lethal. Clinician B, starting shift, observes the now-lethal trajectory but does not adjust the pump (which cannot be remotely altered). Is A's relation to the death (if it occurs) "doing" or "allowing"? Is B's? Does the identical physical state at time of death matter?
      *   **(iv) Predictions:**
          *   *Distinctionist:* A "allowed" the death (set a safe course; threat manifested later independently). B "allowed" the death (failed to intervene in an independent threat). Outcome configuration doesn't change A's initial moral relation.
          *   *Deflationist:* At time of death, both deaths result from the same physical state (pump running). The significant difference lies in A's reasonable expectation vs. B's current knowledge, and potential duties to monitor (systemic factors), not a doing/allowing asymmetry. A's initial act is retrospectively re-evaluated as flawed if monitoring was inadequate.

  3.  **Lexicality & Scalability**
      *   **(i) Sub-Question:** If there is a moral asymmetry, is it lexical (no amount of harm *allowed* outweighs a single comparable harm *caused*), or does it have an exchange rate? Does this answer change if the harm allowed is distributed (e.g., a million agents each allowing 1/millionth of a predictable death)?
      *   **(ii) Moves Distinctionist:** A lexical constraint is central to their view. A discoverable exchange rate or the dissolution of the asymmetry under distribution would be a major challenge. Moves Deflationist: Finding a lexical constraint would be surprising; expecting an exchange rate or the insignificance of tiny individual contributions aligns with their view.
      *   **(iii) Test Argument:** Consider a forced choice: Cause one death (e.g., redirect a runaway trolley) or allow N deaths (e.g., fail to divert it, where N deaths result from independent failures). What is the smallest N where allowing is judged *worse* than doing? Now, imagine the N deaths result from N distinct, non-colluding individuals each negligently failing a tiny, necessary task (e.g., each failing to check one valve in a complex system), where no single failure is sufficient, but all are necessary for the death. Does the doing/allowing judgment shift?
      *   **(iv) Predictions:**
          *   *Distinctionist:* There is *no* finite N where allowing N deaths is worse than causing one (lexical constraint). Distributed cases are complex aggregates of individual allowings; the core asymmetry per individual act remains, though culpability may vary.
          *   *Deflationist:* There *is* a finite N (likely low, e.g., 2-5) where allowing N deaths is judged worse than causing one (exchange rate exists). In distributed cases, individual contributions may fall below thresholds of significance or reasonable expectation, making "allowing" judgments inappropriate or very weak.

  4.  **Explanatory Location & Relation to Intending/Foreseeing**
      *   **(i) Sub-Question:** If a fundamental asymmetry exists, in which domain is it primarily located (metaphysics of agency/causation, structure of rights/claims, agent's will, epistemology)? Does the doing/allowing distinction explain the intending/foreseeing asymmetry, or vice versa, or are they independent?
      *   **(ii) Moves Both:** Locating the source is key to understanding its nature and force. Distinctionist: Needs a plausible metaphysical or deontological home. Deflationist: Expects reduction or dissolution. Their views on the relation to intending/foreseeing test core commitments.
      *   **(iii) Test Case/Argument:** Analyze cases where doing/allowing and intending/foreseeing come apart: (a) Intentionally allowing a harm (e.g., refusing life-saving treatment to die) vs. (b) Unintentionally doing a harm (e.g., fatal accident during permissible treatment). Which distinction drives the stronger intuition? Can the moral significance of one be fully explained by the other?
      *   **(iv) Predictions:**
          *   *Distinctionist:* The doing/allowing distinction is more fundamental, located in the agent's basic causal relation to the harm (metaphysics/agency) and its connection to rights violations. It explains why *intentionally* allowing can be permissible (patient right) while *unintentionally* doing might still be highly problematic (violation of duty not to cause harm).
          *   *Deflationist:* The intending/foreseeing distinction (or the expression of will/consent) is more fundamental or operates alongside deflationary factors. The permissibility in (a) stems from consent/rights, not the allowing *per se*. The problem in (b) stems from negligence/risk imposition, not the doing *per se*. The distinctions interact but neither explains the other reductively; both are patterns of deflationary factors.

  **Section 4: What Counts as Counterevidence?**

  *   **Distinctionist:** Convincing evidence would be:
      1.  The consistent failure to identify *any* carefully matched pairs where a clear, stable, and significant intuitive moral difference persists after controlling for all plausible deflationary factors (causation, evidence, costs, risks, motives, obligations, systemic effects).
      2.  A successful, non-question-begging reduction of the intuitive constraint against doing harm *entirely* to the aggregate weight of deflationary factors in a way that predicts and explains all intuitive judgments without residue.
      3.  Widespread, stable judgment that causing one harm to prevent many more *identical* harms (where allowing the many is the only alternative) is *easier* to justify than intuitions about lexicality suggest, especially among those deeply familiar with the arguments.

  *   **Deflationist:** Convincing evidence would be:
      1.  The discovery of a stable, significant intuitive moral difference in meticulously matched doing/allowing pairs that persists *even when* all known deflationary factors are explicitly controlled for and acknowledged by participants.
      2.  A compelling account of *where* the irreducible moral difference resides (metaphysics, rights, etc.) that is independently plausible and does not itself rely on question-begging assumptions or reduce to the deflationary factors.
      3.  Robust demonstration of a true lexical constraint against doing harm (e.g., consistent refusal to cause one death to prevent any finite number N of identical deaths via allowing, even when systemic risks are controlled).

  **Section 5: Verbal vs. Substantive Disagreement**

  We acknowledge that some aspects of our debate may involve terminological differences or emphasize different facets of complex cases. However, we concur that the core disagreement regarding the existence of an irreducible moral asymmetry between doing and allowing harm is genuinely **substantive**. It concerns a fundamental question about the structure of moral reasoning and the grounds of permissibility near the end of life. While the *labels* "doing" and "allowing" might sometimes be applied differently based on prior theoretical commitments, the underlying disagreement about whether a unique normative constraint exists, distinct from considerations of causation, consequence, and agency typically invoked, reflects a deep divergence in ethical understanding. The dispute is about the world – specifically, about the nature of moral obligations and permissions in situations involving harm.
