prompt: |-
  I've somehow ended up on the works council at our parcel depot — about 900 of us, I'm one of five reps, I get two days a month of company time for it and I have to explain whatever we decide to a room of members in about ten minutes. My mate Dave's back is finished at 52 and I did a weekend course the regional union runs last month, and I've been chewing on it ever since.

  Here's the practical problem. We get five or six automation proposals a year. They always arrive labelled as productivity, safety, or improving the job — never as anything else. We can't fight all of them: we'd lose the room, and honestly management would just roll the same thing out at the new site up the road instead. So we need to pick. What I have is a gut, and the gut is unreliable in a specific way — it says no to anything with a motor in it and yes to anything with a screen in it, and I don't think that's actually tracking what matters.

  What I think matters, from the course, is something like: what happens to the time that gets freed up; what happens to what a worker's labour is worth, both to the company and to the worker; and what happens to the knowledge that currently lives in people's heads rather than in a manual. And the bit I found genuinely strange and can't stop thinking about — the same technology that could cut the working day is, in our situation, the thing that makes it longer and faster, and that isn't a fact about the technology. That's the bit I want operationalised.

  So: write me a procedure. Questions in the order I should ask them, what counts as an actual answer to each (as opposed to a number management made up), where the procedure stops and says oppose, where it says let it through with conditions and what those conditions are, where it stops and says this is a values question and has to go to a membership vote, and where it just honestly can't tell. Constraints: one page, runnable in the time I actually have, we never see the financial model, some of the inputs are going to be guesses and the procedure has to say what to do with a guess.

  Please keep these distinctions if they're real, and tell me if I've garbled them: cutting the hours needed to make something vs. cheapening the stuff workers buy (I think those pull in different directions and both matter for whether we're better off); who sets the pace once the machine is in; machinery only paying for itself while it's running, so pressure toward nights and weekends; and the people who would have been hired, not just the ones on the payroll now.

  Run it on these:

  1. A sort retrofit. About 40 of 300 sorter jobs go over three years by attrition, no compulsory redundancies, retraining into exception handling, pay bands unchanged — but the line sets the pace and logs everybody's individual rate.
  2. Lift-assist arms on the heavy line. The injury logs say they genuinely work, I've seen them. Management also wants tonnage-per-hour up and wants to keep staffing as is.
  3. A routing app. Drivers finish earlier; the saved time goes into more stops; pay per stop is unchanged; and it makes it easy to top up with on-call agency drivers at peak.

  And one I suspect your procedure can't handle, which is the one I most want you to be honest about: they want to record our experienced coders doing customs classification — headsets, cameras, the lot — to train a system that might someday do the coding. Nothing is cut now. The data leaves now, the machine turns up in three years, or never, or at a different depot.

  At least one of these has to come out as don't fight this when my instinct says fight it. I'd much rather find that out here than standing up in front of the members.

  Also: don't just tell me the name of a book to go read, I've got a shift on Monday. And tell me which step of your procedure is really a judgement call wearing a clipboard, plus what would change your mind about the whole shape of it — if who gets the time is the wrong master question, say what should replace it and which of the four cases would show that.
reasoning: |-
  Okay, the user is a works council rep at a parcel depot dealing with automation proposals. They need a practical, one-page procedure to evaluate these proposals quickly. Their main concerns are how freed-up time is used, labor value, loss of knowledge, and why tech that could shorten workdays instead makes them longer. 

  First, I need to unpack their core dilemma: their gut reaction (anti-motor/pro-screen) isn't reliable, and they need a structured way to assess proposals. The key metrics they identified from their union course are crucial: time reallocation, labor value (to both company and worker), and knowledge capture vs. erosion. The paradox they mentioned—tech enabling longer/faster work—is central. That's about power dynamics, not the tech itself.

  The constraints are tight: max one page, must work in 10-minute presentations, no financial data, some inputs will be guesses. Need clear thresholds for "oppose," "accept with conditions," "membership vote," or "uncertain." Must handle their four test cases, including the tricky knowledge-capture one.

  Breaking it down:
  - Need sequential questions that filter proposals efficiently. First screen for irreversible harm or worker exploitation, then assess impacts.
  - For "freed time": must distinguish between time saved going to workers (good) vs. more throughput (bad). Management will always claim productivity - need concrete commitments.
  - Labor value: both wage impacts and skill devaluation matter. Pay bands staying same isn't enough if jobs get deskilled.
  - Knowledge transfer: their example of recording customs coders is classic "expropriation of worker knowledge." Need safeguards.
  - Hidden pressures: night/weekend shifts from machines needing constant run-time, impact on future hiring.

  For the procedure design:
  - Start with harm thresholds (redundancies, pace control). Any compulsory layoffs = instant oppose.
  - Then freed time allocation: saved hours must benefit workers (shorter days) or maintain pay with less strain. If diverted to more work, oppose unless pay rises proportionally.
  - Labor value section must catch deskilling even if pay doesn't change. E.g., retraining into exception handling might be upskilling if it adds decision-making.
  - Knowledge capture needs strict consent and benefit-sharing. Recording workers without clear upside? Red flag.
  - Where guesses happen, default to skepticism. Management's "tonnage increase" claim? Verify via injury logs, demand staffing guarantees.

  Testing on their cases:
  1. Sort retrofit: Attrition avoids layoffs, but pace control + logging individual rates enables micromanagement. Oppose without conditions banning rate-based discipline.
  2. Lift-assist arms: Safety win, but tonnage increase demand means freed time isn't going to workers. Condition: staffing must stay constant even if throughput rises.
  3. Routing app: Saved time converted to more stops = speedup. Pay per stop unchanged means wage cut per hour. Must oppose unless pay per stop increases.
  4. Knowledge capture: Recording coders risks making them obsolete without immediate benefits. Accept only with ironclad job guarantees and profit-sharing.

  The judgment call step is clearly labor value assessment - is exception handling really upskilling or just glorified troubleshooting? Depends on training quality. For the "freed time" paradox, if all cases showed saved time benefiting workers, the framework might shift toward stricter scrutiny of knowledge hoarding.

  Biggest insight: The procedure forces exposing management's true priorities. If they refuse to commit saved time to worker benefit, it reveals the speedup agenda. That's what the user needs for the room - clear, visualizable trade-offs.
answer: |-
  Here's a one-page, step-by-step procedure based on your framework. It prioritizes irreversible harms and worker control, uses concrete thresholds, and flags guesses. **Run it in this order – stop if you hit a red flag.**

  ---

  ### **Automation Assessment Procedure: 5 Questions, 10 Minutes**

  **1. IRREVERSIBLE HARM?**  
  *"Will this cause compulsory redundancies or make key skills obsolete without replacement?"*  
  - **RED FLAG (OPPOSE):** Yes to redundancies. Or "Yes" to skill destruction without *equal/better-paid* retraining (e.g., replacing expert roles with button-pushing).  
  - **OK:** Attrition with retraining into roles of equal pay/complexity.  
  - *Guess?* Assume worst case. Oppose if unclear.  
  **→ STOP HERE IF RED FLAG.**

  **2. WHO CONTROLS THE PACE?**  
  *"Who sets work speed after this: the worker, the machine, or a manager monitoring outputs?"*  
  - **RED FLAG (OPPOSE):** Machine/algorithm sets pace (e.g., automated line speed). Or individual performance logging used for discipline.  
  - **CONDITIONAL:** Machine *assists* but worker controls speed (e.g., lift-arm moves only when worker triggers it). Demand written policy banning rate-based discipline.  
  - **OK:** Worker retains full control (rare).  
  - *Guess?* Assume management control unless proven otherwise.  

  **3. WHAT HAPPENS TO FREED-UP TIME?**  
  *"Where does the time saved go? (Check injury logs/actuals, not projections)"*  
  - **OPPOSE:** >50% of saved time converted into **more throughput per worker** (e.g., more parcels sorted, more stops driven).  
  - **CONDITIONAL:** Saved time goes to **reduced hours at same pay** or **new value-added tasks** (e.g., maintenance, customer service). Demand binding commitment.  
  - **OK:** Genuine time savings with no added workload (e.g., shorter shifts, longer breaks).  
  - *Guess?* Assume management will use it for throughput ("productivity"). Oppose.  

  **4. WHO CAPTURES THE VALUE?**  
  *"Does this cheapen labor (lower pay per unit of output) or erode worker knowledge without compensation?"*  
  - **OPPOSE:** Pay per task decreases *or* output quotas increase. Or knowledge extraction (e.g., recording expertise) without **profit-sharing/job guarantees**.  
  - **CONDITIONAL:** Pay bands rise with new skills *or* extracted knowledge has royalties/ownership stakes for workers.  
  - **OK:** Pay stability + retained control over core knowledge.  
  - *Guess?* Assume value flows to management. Oppose if knowledge is extracted.  

  **5. PRESSURE ON HOURS?**  
  *"Could this create pressure for nights/weekends (e.g., machines needing constant run-time)?"*  
  - **CONDITIONAL:** Yes → Demand **shift premium guarantees** and **no forced overtime**.  
  - **OK:** No impact on schedules.  

  **UNCERTAIN?** → Trigger membership vote if:  
  - High stakes but no clear red flags.  
  - Trade-offs between safety/jobs (e.g., lift-assists *with* tonnage demands).  
  - "Values" conflict (e.g., short-term safety vs. long-term deskilling).  

  ---

  ### **Test Runs:**
  **1. Sort Retrofit**  
  - (1) Attrition + retraining? **OK**.  
  - (2) Machine sets pace + logs rates? **RED FLAG (OPPOSE)**.  
  - → **OPPOSE** unless logging is removed/rate-based discipline banned.  

  **2. Lift-Assist Arms**  
  - (1) No redundancies? **OK**.  
  - (2) Worker controls pace? **Likely OK** (assistive).  
  - (3) Saved time → tonnage increase? **OPPOSE** (time converted to throughput).  
  - → **OPPOSE** unless management drops tonnage demand.  

  **3. Routing App**  
  - (1) No redundancies? **OK**.  
  - (2) App sets route/time? **RED FLAG (algorithmic control)**.  
  - (3) Saved time → more stops? **OPPOSE**.  
  - → **OPPOSE** (doubly red).  

  **4. Knowledge Capture (Customs Coding)**  
  - (1) Makes expertise obsolete? **Yes** (AI aims to replace). **RED FLAG** unless ironclad job guarantees.  
  - (4) Extracts knowledge without compensation? **RED FLAG**.  
  - → **OPPOSE** unless: Royalties for coders, retraining *before* rollout, veto on AI use.  

  ---

  ### **Key Insights:**
  - **Your gut was right on motors (pace/exploitation risk), wrong on screens (routing app is toxic).**  
  - **Judgment Call:** Step 4 (Value Capture). "Deskilling" is subjective. Does exception handling upskill or trap workers? *Use injury/satisfaction data.*  
  - **What Changes the Framework?** If management *proves* saved time goes to shorter hours (e.g., pilot project data), shift focus to knowledge defense. Lift-assist case would then be green.  
  - **Why This Works:** Targets power (who controls pace/time) and irreversible losses. Forces "productivity" claims into concrete worker impacts.  

  **Output on Your Cases:**  
  - Lift-assist is **winnable** if you block throughput hikes (safety without speedup).  
  - Sort retrofit is **beatable** by attacking pace logging.  
  - This isn't about "good tech/bad tech" – it's about **who it works for**.  

  Print this. Bring it to the next meeting. Good luck Monday.
