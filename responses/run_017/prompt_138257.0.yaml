prompt: |-
  For a graduate seminar in historiography that I am teaching next term, I need a specification rather than a survey. The topic is the standing of non-human causes — pathogens, climatic shifts, volcanic eruptions — in historical explanation, and the audience I have in mind is working historians trying to explain a particular episode: why a fiscal system collapsed in a given decade, why a colonial expedition failed, why an uprising spread in one province and not its neighbor. So the purpose of the theory is fixed in advance. I want a doctrine good enough to tell a working historian when a non-human factor earns a place in the explanatory narrative as something more than scenery, and to set a ceiling on how much explanatory work that factor may be allowed to do before the account tips into environmental determinism.

  Write the desiderata. For each requirement, give the case or consideration that motivates it, and mark it as either non-negotiable or the preference of a particular camp.

  Cover at least the following. First, the cases a theory has to get right: a large tropical eruption whose atmospheric effects produce a year without a summer and widespread harvest failure across Europe and New England; a mosquito- or water-borne disease that decides the fate of a military expedition in a colony; a drought followed by migration and then violence in a region that has weathered comparable droughts without violence; and two formally identical harvest failures, one produced by weather and one by a requisition or tax policy, where the historian's causal idiom plainly shifts. Say what each case is a test of.

  Second, the distinctions the theory may not collapse: triggering versus standing condition; constraining versus enabling; being a cause versus being a selector of which social arrangements are stable under shock; explaining versus excusing, including the alibi problem in which an environmental factor is invoked to absolve agents, and the accompanying asymmetry whereby climate and terrain are recruited as excuses while pathogens are recruited as explanations.

  Third, adjudicate two candidate requirements I have been toying with, rather than simply listing them. The substitution test: a non-human factor counts as more than background only if swapping in the nearest available alternative state of that factor — no eruption, a milder winter, a pathogen with a different transmission route — would have changed not merely the date or the body count but which options were live for the human agents deliberating at the time. The uptake condition: a factor counts only if it was registered at the time, however dimly, as risk, rumor, portent, or explanation by at least some participants. For each, tell me whether it is a genuine desideratum or a prejudice of one style of history, what it silently rules in and out, and whether it survives the cases above.

  Then flag any pair of requirements you believe cannot be jointly satisfied — that is the part I most want — and identify the single requirement that does the most work in excluding the positions people actually hold. Close with a short table, no more than a sentence or two per cell, scoring four broad stances against the list: strict human exceptionalism; geographical or environmental determinism; a flat symmetric ontology in which germs, climate, and treaties are all actors on the same footing; and a middle view on which non-human factors supply constraints and affordances rather than agency.

  Constraints: define every technical term you use; rely only on the cases as I have sketched them, with no citations, bibliographies, reading lists, or gestures toward specific studies; and write in American English. Aim for roughly 1,000 to 1,200 words, with the numbered requirements as the bulk of the answer and the table kept brief.
reasoning: |-
  Okay, the user is teaching a graduate seminar in historiography and needs a specification for incorporating non-human causes into historical explanations. They want a doctrine that helps historians decide when factors like pathogens or climate shifts are more than just background, without tipping into environmental determinism. 

  First, I need to unpack their core dilemma: how to give non-human factors explanatory weight without oversimplifying human agency. Their audience is working historians dealing with concrete cases—fiscal collapses, failed expeditions, regional uprisings. This is practical, not theoretical. 

  The user outlines three layers: cases to test theories (like volcanic eruptions or disease outbreaks), distinctions to preserve (like triggers vs. conditions), and two candidate requirements to evaluate (substitution test and uptake condition). They also want conflicts between requirements flagged and a table scoring existing stances. 

  Hmm, the challenge is balancing precision with flexibility. Historians need clear criteria but hate rigid formulas. I’ll start by framing desiderata as "rules" the theory must follow, anchored in their test cases. For example, the "year without summer" case tests whether a non-human event can be a trigger without being deterministic. 

  For distinctions, I’ll emphasize pitfalls like the "alibi problem"—where climate becomes an excuse but pathogens don’t. That asymmetry is subtle but crucial. The user clearly worries about historians misusing environmental factors to absolve human actors. 

  Now the two candidate requirements: 
  - Substitution test: Swapping factors (e.g., no eruption) to see if outcomes change. But this might overemphasize counterfactuals, which many historians distrust. Case 4 (harvest failures) breaks it—identical events demand different causal language. 
  - Uptake condition: Requiring contemporary awareness. This feels like a "humanities bias." Case 2 (disease deciding expeditions) fails here; locals might not grasp germ theory, yet pathogens clearly shaped outcomes. 

  The big conflict: Distinction #2 (trigger vs. standing condition) clashes with the substitution test. If a volcano is merely a standing condition, swapping it might not alter options—but it’s still essential context. The theory must allow this. 

  For the table, I’ll contrast four stances. Determinism flunks most requirements; symmetric ontology (treating germs/treaties equally) ignores human deliberation. Human exceptionalism dismisses non-human factors entirely. The "middle view" (constraints/affordances) balances best but still struggles with the alibi problem. 

  Key insight: The "explanatory ceiling" requirement (#1) does the heaviest lifting. It blocks determinism while forcing historians to justify non-human factors’ role—addressing the user’s core fear of "tipping" into reductionism. 

  Finally, I’ll keep jargon minimal (e.g., "standing condition" = persistent backdrop) and stick strictly to their cases. No citations—this is a conceptual toolkit, not a literature review.
answer: |-
  Here is a specification for incorporating non-human causes into historical explanation, designed for working historians, structured as requested:

  **Core Purpose:** To provide historians with criteria for determining when a non-human factor (pathogen, climate shift, volcanic eruption) warrants inclusion as a *causal element* within an explanatory narrative of a specific historical episode (e.g., fiscal collapse, expedition failure, uprising spread), distinguishing it from mere background context while setting a strict limit to avoid environmental determinism.

  **Part 1: Desiderata (Requirements) & Motivating Cases**

  1.  **Requirement: Explanatory Ceiling (Non-negotiable)**
      *   **Definition:** The theory must prevent non-human factors from becoming the *sufficient* explanation for complex social outcomes. They can be necessary conditions, triggers, or constraints, but the explanation must specify *how* human agency, institutions, and social structures interacted with the factor to produce the outcome.
      *   **Motivating Case:** *Drought → Migration → Violence* in a region that weathered comparable past droughts without violence. This tests the theory's ability to show why *this* drought led to violence, demanding analysis of changes in human systems (e.g., weakened conflict-resolution mechanisms, new land pressures) that made violence the contingent outcome *this time*.

  2.  **Requirement: Trigger vs. Standing Condition Distinction (Non-negotiable)**
      *   **Definition:** Must distinguish a *triggering event* (a discrete occurrence initiating change) from a *standing condition* (a persistent state enabling or constraining possibilities). Non-human factors can be either, but their explanatory role differs.
      *   **Motivating Case:** *Large Tropical Eruption → "Year Without Summer" → Harvest Failure*. The eruption is the discrete trigger. The pre-existing vulnerability of agrarian systems (reliance on specific crops, storage capacity, market integration) is the standing condition determining the *scale* of the failure. The theory must show how the trigger interacted with standing conditions.

  3.  **Requirement: Constraint/Enabler vs. Cause/Selector Distinction (Non-negotiable)**
      *   **Definition:** Must distinguish factors that *actively cause* specific actions/events from those that *constrain* possible actions or *enable* certain pathways. Non-human factors often act as constraints/enablers. Relatedly, must distinguish factors causing an *event* from factors selecting *which* social arrangements survive a shock.
      *   **Motivating Case:** *Mosquito-borne disease dooms colonial expedition*. The pathogen may *cause* illness/death, but the *failure* of the expedition is explained by how the disease *constrained* the expedition's options (reducing manpower, morale, mobility) and *enabled* resistance groups. Disease selects *which* expeditionary force models are viable in that environment.

  4.  **Requirement: Causal Idiom Sensitivity (Non-negotiable)**
      *   **Definition:** The theory must prescribe different causal language ("caused by," "precipitated by," "occurred amidst," "enabled by," "constrained by") depending on the nature of the non-human factor's contribution.
      *   **Motivating Case:** *Two formally identical harvest failures (e.g., same yield loss)*. One results from *drought* (non-human), the other from *excessive grain requisition by an army* (human policy). The historian instinctively uses different language: "famine caused by drought" vs. "famine resulting from/extorted by requisition." The theory must justify and guide this shift, reflecting the factor's origin and mode of interaction with society.

  5.  **Requirement: Blocking the Alibi Problem (Non-negotiable)**
      *   **Definition:** The theory must prevent the use of non-human factors to *excuse* human agency or responsibility, particularly the observed asymmetry where climate/terrain are used as excuses ("we couldn't help it") while pathogens are treated as explanations ("it caused collapse").
      *   **Motivating Case:** *Colonial Expedition Failure*. Blaming *only* "tropical diseases" excuses poor planning, inadequate logistics, or flawed strategy by colonial commanders. The theory must demand analysis of how human decisions (camp location, medical provisions, pace of advance) interacted with the disease environment. Similarly, blaming *only* "harsh terrain" for a defeat excuses tactical errors or intelligence failures.

  **Part 2: Adjudicating Candidate Requirements**

  6.  **Candidate: Substitution Test**
      *   **Definition:** A non-human factor counts as more than background only if swapping it for the nearest alternative state (no eruption, milder winter, different pathogen) would have changed *which options were viable* for contemporary human agents, not just timing/casualties.
      *   **Assessment:** **Prejudice of Counterfactual/Causal Mechanism Style.** It silently rules out essential standing conditions whose *absence* (not just variation) fundamentally shapes possibilities (e.g., substituting "no malaria endemicity" for "malaria endemicity" in a region radically alters baseline possibilities, but endemicity is background until a specific event/decision). It struggles with Case 4: Swapping drought for requisition changes *everything*, but swapping one drought intensity for another might not change viable options significantly, yet the drought remains a crucial causal factor. **Verdict:** Not a core desideratum; useful heuristic sometimes, but insufficient and potentially misleading as a requirement.

  7.  **Candidate: Uptake Condition**
      *   **Definition:** A non-human factor counts only if it was registered by some contemporary participants as risk, rumor, portent, or explanation.
      *   **Assessment:** **Prejudice of Intentionalist/Culturalist History.** It silently rules out factors whose causal power operated *outside* contemporary perception or conceptualization (e.g., pathogens before germ theory, slow climate shifts, volcanic causation chains unknown at the time). Case 2 (Expedition Disease) is problematic: Locals/colonizers might attribute disease to miasma, divine wrath, or poison, not "mosquitoes," but the pathogen's biological effect remains causally critical. Case 1 (Eruption): Atmospheric effects might be perceived as "bad weather" or "omens," not linked to a distant volcano. **Verdict:** Not a core desideratum; useful for analyzing *response* but not for establishing causal relevance.

  **Part 3: Conflicts & Key Requirement**

  *   **Critical Conflict:** Requirement 1 (Explanatory Ceiling - non-human factors cannot be sufficient) and Requirement 2 (Distinguish Trigger vs. Standing Condition) can create tension. Standing conditions (like endemic disease or semi-arid climate) can have such profound, shaping effects that they seem deterministic. However, Requirement 1 insists that even pervasive standing conditions do not *dictate* specific outcomes; they set the stage upon which human agency acts, constrained and enabled. The *trigger* distinction (Req 2) helps by focusing on discrete events, but the core resolution lies in Req 1: Always requiring the specification of the *human-social mediation*.
  *   **Most Excluding Requirement:** **Requirement 1 (Explanatory Ceiling)** does the most work. It definitively excludes:
      *   **Strict Environmental Determinism:** (Fails - makes non-human factors sufficient).
      *   **Overly-Reductive Symmetric Ontology:** (Fails if it grants non-human factors agency equivalent to human intent, often implying sufficiency).
      *   **Lazy "Alibi" Explanations:** (Fails by demanding specification of human interaction, blocking excuse-making).
      It forces the historian to move beyond merely identifying the non-human factor to explaining its precise role in the human drama.

  **Part 4: Stance Evaluation Table**

  | Stance                          | Score Against Desiderata                                                                 | Key Weakness                                                                 |
  | :------------------------------ | :--------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------- |
  | **Strict Human Exceptionalism** | Fails most (1-5).                                                                        | Dismisses non-human factors as mere scenery, failing Cases 1, 2, 3 utterly. |
  | **Environmental Determinism**   | Fails Req 1 (Ceiling), Req 3 (Constraint vs Cause), Req 5 (Alibi). Marginal on others.       | Violates ceiling by making non-human factors sufficient; often commits alibi. |
  | **Symmetric Ontology (Flat)**   | Fails Req 1 (Ceiling), Req 3 (Constraint/Cause vs Agency), Req 5 (Alibi). Struggles with Req 4. | Collapses crucial distinctions; risks granting non-human factors unwarranted agency/sufficiency, akin to determinism. |
  | **Middle View (Constraints/Affordances)** | Satisfies Reqs 1-5 best.                                                                 | Must vigilantly guard against Req 5 (Alibi) slipping in when emphasizing constraints; requires careful idiom (Req 4). |
