              P(M=high | one-box) = P(one-box | M=high) * P(M=high) / P(one-box)
                                   = (1 - P(two-box|M=high)) * P(M=high) / [ P(one-box|M=high)*P(M=high) + P(one-box|M=low)*P(M=low) ]
                                   = (1-0.9)*0.5 / ( (0.1)*0.5 + (0.9)*0.5 )
                                   = (0.1*0.5) / (0.1*0.5 + 0.9*0.5) = 0.05 / (0.05+0.45) = 0.05/0.5 = 0.1

              P(M=low | one-box) = 1 - 0.1 = 0.9

            Then:
              P(project success | one-box) = P(success | M=high, one-box) * P(M=high|one-box) 
                                            + P(success | M=low, one-box) * P(M=low|one-box)
                                            = (0.99 * 0.1) + (0.01 * 0.9)
                                            = 0.099 + 0.009 = 0.108

            So EU_EDT(one-box) = 0.108 * 1e6 = $108,000

            EU_EDT(two-box) = E[U | two-box]
                            = bond_value + E[project_value | two-box]
                            = 300,000 + P(project success | two-box) * 1e6

            Now, conditional on two-box, the project fails for sure (because of the causal effect)? But note: the causal effect is part of the world. In the evidential conditional, we are conditioning on the act two-box. Given that the company two-boxes, what is the probability of project success? The causal effect ensures that if you two-box, the project fails. Therefore, P(project success | two-box) = 0.

            So EU_EDT(two-box) = 300,000 + 0 = $300,000

            Therefore, EDT chooses two-box because $300,000 > $108,000.

          This meets the requirement.

          The key feature: 

            The act of two-boxing (taking the safe bond) causes the project to fail. This is a strong causal disincentive for CDT to two-box. 

            But for EDT, the act of one-boxing (only the project) is evidence of low-quality management (because high-quality management usually takes the bond). Therefore, even though one-boxing avoids the causal harm to the project, it is evidence that the management is low quality, which means the project is unlikely to succeed anyway. Meanwhile, two-boxing is evidence of high-quality management (which would normally make the project succeed) but the causal harm of two-boxing (the distraction) makes the project fail. However, the safe bond is still collected. And because the project is expected to be a loss under one-boxing (due to the evidence of low quality) and the bond is a sure gain, EDT prefers two-boxing.

          The cell in the decision matrix that matters:

            The difference is in the evaluation of the project outcome when the agent one-boxes. 

            For CDT, the project outcome when one-boxing is evaluated with the prior over M (so 50% high, 50% low) and the success probabilities (99% and 1%) -> average 50% chance of success.

            For EDT, the project outcome when one-boxing is evaluated with the posterior over M (10% high, 90% low) and the success probabilities -> 10.8% chance of success.

          Ablation:

            Remove the causal effect of two-boxing on the project failure. Then:

              If two-boxing does not cause the project to fail, then the project outcome is solely determined by M.

              Then:

                CDT: 
                   EU(one-box) = [0.5*0.99+0.5*0.01]*1e6 = $500,000
                   EU(two-box) = 300,000 + [0.5*0.99+0.5*0.01]*1e6 = 300,000+500,000 = $800,000 -> so CDT two-boxes.

                EDT:
                   EU(one-box) = [0.1*0.99+0.9*0.01]*1e6 = $108,000
                   EU(two-box) = 300,000 + [P(project success | two-box)]*1e6
                               Now, P(project success | two-box) = P(M=high|two-box)*0.99 + P(M=low|two-box)*0.01
                               P(M=high|two-box) = P(two-box|M=high)*P(M=high)/P(two-box)
                                                 = 0.9*0.5 / (0.9*0.5+0.1*0.5) = 0.45/0.5 = 0.9
                               So: 0.9*0.99+0.1*0.01 = 0.891+0.001=0.892 -> $892,000
                               Then EU(two-box)=300,000+892,000=$1,192,000 -> still two-boxes.

                Now both theories two-box. The reversal disappears.

            Alternatively, remove the correlation between M and the act. Suppose the act is independent of M. Then:

               P(one-box|M=high)=P(one-box|M=low)=p, say 0.5.

               Then:

                  CDT: same as before: $500,000 for one-box, $300,000 for two-box -> CDT one-boxes.

                  EDT: 
                     P(M=high|one-box) = P(one-box|M=high)*P(M=high)/P(one-box) = 0.5*0.5 / 0.5 = 0.5
                     EU(one-box)= [0.5*0.99+0.5*0.01]*1e6 = $500,000
                     EU(two-box)=300,000+0=$300,000   (because two-boxing causes failure)

                  So EDT would one-box: $500,000 > $300,000.

            Now both theories one-box. Again, the reversal disappears.

            Therefore, the reversal requires both:
              (a) The causal effect that makes two-boxing ruin the project.
              (b) The correlation that makes one-boxing evidence of low M (which is bad for the project).

          Strongest objection from the defender of EDT (which in this case chooses two-boxing and gets $300,000, while CDT one-boxes and gets an expected $500,000) or vice versa? Actually, in this case, the two-boxing act (by EDT) yields $300,000, and the one-boxing act (by CDT) yields, on average, $500,000. So the CDT agent does better.

          The familiar taunt: "people who reason their way to the two-box verdict do not in fact end up with the money" — in the standard Newcomb, the two-boxer gets only $1000 while the one-boxer gets $1M. But in our case, the two-boxer (EDT) gets $300,000 and the one-boxer (CDT) gets an average of $500,000. So the taunt would be: EDT agents end up with less money. But note, the taunt in the standard Newcomb is about the outcome in the actual world: the predictor is accurate, so if you two-box, you get $1000 and the box B is empty. In our case, the outcome for the two-boxer is fixed: they get $300,000 and the project fails. For the one-boxer, they get $1M if the project succeeds (which happens with probability 50% in the CDT calculation).

          However, note that the agent using EDT in our scenario ends up with $300,000, which is less than the expected $500,000 of the CDT agent. So the EDT agent is worse off in expectation. But the agent using EDT doesn't care about the CDT expectation: they are maximizing their conditional expectation. And conditional on their act (two-boxing), they get $300,000. Conditional on one-boxing, they would expect only $108,000. So they are happy.

          The taunt that "people who reason their way to the two-box verdict do not in fact end up with the money" in the standard Newcomb is because the predictor is accurate and the two-boxer gets less. In our case, the two-boxer (EDT) gets $300,000, which is more than they would have gotten had they one-boxed (which would have been $108,000 on average). But they get less than the CDT agent in the long run? However, note: the agent using EDT is not comparing to the CDT agent. They are comparing their own options. They prefer two-boxing because $300,000 > $108,000. And in fact, if they had one-boxed, they would have gotten on average $108,000 (which is less than $300,000). So they are happy with their choice. The problem is that the $108,000 is an average over the posterior, but the actual outcome for the EDT agent if they one-box might be either $0 or $1M. But on average it is $108,000. Meanwhile, the two-boxing yields a guaranteed $300,000. So it's a risk-avoidance? But note: the two-boxing outcome is fixed at $300,000. The one-boxing outcome is a gamble with expected value $108,000. So EDT is taking the sure $300,000 over the gamble that averages $108,000.

          However, the CDT agent is taking a gamble that averages $500,000. So the CDT agent is taking a better gamble. But the EDT agent, by their own lights, is doing the best they can.

          The objection from the defender of CDT might be: "EDT is ignoring the causal harm of two-boxing (which causes the project to fail) and that is why they are making a mistake." But EDT is not ignoring it: they condition on the act and see that when they two-box, the project fails (so they don't count on it). They just get the bond. And they see that when they one-box, the project usually fails anyway (because one-boxing is evidence of low M). So they prefer the bond.

          The defender of EDT might object to the scenario: "The causal link between two-boxing and project failure is too strong. In reality, even if you take the bond, the project might still succeed if the management is high quality. You set it to 0, but maybe it's not that bad." But we can set it to a small positive chance without changing the result much. For example, if under two-boxing the project succeeds with 1% chance (regardless of M) then:

            CDT: 
               EU(two-box) = 300,000 + 0.01 * 1e6 = $310,000
               still less than $500,000 -> CDT one-boxes.

            EDT: 
               EU(one-box) = $108,000 (unchanged)
               EU(two-box) = 300,000 + E[project | two-box] 
                            = 300,000 + [P(project success | two-box)]*1e6

            Now, P(project success | two-box) is the chance that the project succeeds despite the causal harm. We set it to 1% (independent of M). Then:
               EU_EDT(two-box) = 300,000 + 0.01*1e6 = $310,000

            And $310,000 > $108,000, so EDT still two-boxes.

          Then the gap for CDT is $500,000 > $310,000, and for EDT is $310,000 > $108,000. So the reversal still holds.

          Alternatively, the defender of EDT might object that the correlation between the act and management quality is unrealistic. Why would high-quality management be more likely to take the bond? We can adjust the story to make it more plausible. For example, high-quality management is more risk-averse? Or they are more likely to see the value in diversification? Meanwhile, low-quality management might be overconfident and put all their eggs in one basket.

          The existence of this case shows that the standard slogan about which theory one-boxes is an artefact of the usual payoff structure. Specifically, in the standard Newcomb, the predictor is set up so that one-boxing is evidence of the large prize being present. In our case, we reversed the evidence: one-boxing is evidence that the management is low quality (so the project is likely to fail). And we added a causal harm to two-boxing. Therefore, the verdicts flipped. This suggests that the difference between the theories is not inherently tied to one-boxing or two-boxing, but to the structure of the causal and evidential relationships.

          However, note that the difference between CDT and EDT is in how they treat the act: as an intervention (CDT) or as evidence (EDT). In our case, the act of one-boxing is evidence of a bad state (low M) which hurts the project, and the act of two-boxing causes the project to fail. Therefore, both theories have reasons to avoid the project outcome in different ways. The reversal is due to the fact that the evidence for the project under one-boxing is so poor that EDT prefers to take the bond and cause the project to fail (but at least get the bond) rather than one-box and face the high risk of project failure without the bond.

          Final scenario:

            Scenario: 
              A company with unknown management quality (M) must decide between:
                Option A: Invest solely in a new project. If the project succeeds, it will yield a profit of $1,000,000; if it fails, $0.
                Option B: Invest in the same project and also in a safe government bond that yields $300,000 with certainty.

              The company's management quality, which is unknown to the CEO at the time of the decision, affects both the decision and the project outcome (if the bond is not taken). High-quality management (M=high) occurs 50% of the time and low-quality management (M=low) 50%. 

              The CEO knows that:
                - High-quality management will choose Option B (both) with 90% probability and Option A (only project) with 10% probability.
                - Low-quality management will choose Option A (only project) with 90% probability and Option B (both) with 10% probability.

              Additionally, if the company chooses Option B (both), the administrative burden of managing the bond distracts the management and causes the project to fail for sure. If the company chooses Option A (only project), then the project outcome depends on management quality:
                - If M=high, the project succeeds with 99% probability.
                - If M=low, the project succeeds with 1% probability.

              The CEO is an expected utility maximizer.

          We compute:

            For CDT:
              EU(A) = [0.5 * 0.99 + 0.5 * 0.01] * 1e6 = $500,000
              EU(B) = 300,000 + 0 = $300,000
              -> Choose A.

            For EDT:
              First, compute the posterior of M given the act:
                P(M=high | A) = P(A|M=high)*P(M=high)/P(A) 
                               = (0.1 * 0.5) / (0.1*0.5 + 0.9*0.5) = 0.05 / (0.05+0.45) = 0.05/0.5 = 0.1
                P(M=low | A) = 0.9

              Then:
                EU(A) = [0.1 * 0.99 + 0.9 * 0.01] * 1e6 = (0.099+0.009)*1e6 = $108,000
                EU(B) = 300,000 + 0 = $300,000   (because choosing B causes project failure, so conditional on B, the project fails for sure)
              -> Choose B.

          This meets the requirement.

          Therefore, we present this scenario.
answer: |-
  ### Constructed Decision Problem: Financial Oversight Scenario

  **Scenario:**  
  A company must decide whether to pursue a high-risk, high-reward project (Option A) or to pursue the project while also investing in a safe, low-yield bond (Option B). The project yields $1,000,000 if successful and $0 otherwise. The bond yields $300,000 guaranteed. The success of the project depends on the company's management quality (high or low, each with 50% prior probability), which is unknown to the CEO at the time of the decision. High-quality management strongly favors diversifying (90% choose Option B), while low-quality management strongly favors focusing solely on the project (90% choose Option A). Crucially, investing in the bond (Option B) causally distracts management, ensuring the project fails. If only the project is pursued (Option A), success depends on management quality: high quality succeeds with 99% probability, low quality with 1%. The CEO knows all probabilities, payoffs, and the causal structure.

  ---

  ### Decision Analysis
  **Key Probabilities and Payoffs:**  
  - **Payoffs:**  
    - Project success: +$1,000,000  
    - Bond: +$300,000 (only if Option B chosen)  
  - **Probabilities for EDT:**  
    - \( P(\text{Project Success} \mid \text{A}) = P(\text{High Mgmt} \mid \text{A}) \cdot 0.99 + P(\text{Low Mgmt} \mid \text{A}) \cdot 0.01 \)  
      - \( P(\text{High Mgmt} \mid \text{A}) = \frac{P(\text{A} \mid \text{High}) P(\text{High})}{P(\text{A})} = \frac{(0.1)(0.5)}{(0.1)(0.5) + (0.9)(0.5)} = 0.1 \)  
      - \( P(\text{Low Mgmt} \mid \text{A}) = 0.9 \)  
      - \( P(\text{Project Success} \mid \text{A}) = (0.1 \cdot 0.99) + (0.9 \cdot 0.01) = 0.108 \)  
    - \( P(\text{Project Success} \mid \text{B}) = 0 \) (causal failure)  
  - **Probabilities for CDT:**  
    - Causal effect of Option B: Project fails (\( \text{do(B)} \implies \text{Success}=0 \)).  
    - Causal effect of Option A: Success depends on management prior:  
      - \( P(\text{Project Success} \mid \text{do(A)}) = P(\text{High}) \cdot 0.99 + P(\text{Low}) \cdot 0.01 = (0.5 \cdot 0.99) + (0.5 \cdot 0.01) = 0.5 \)  

  **Expected Utilities (EDT):**  
  - **Option A (One-Box):**  
    \( EU_{\text{EDT}}(\text{A}) = (0.108 \cdot 1,000,000) + (0.892 \cdot 0) = 108,000 \)  
  - **Option B (Two-Box):**  
    \( EU_{\text{EDT}}(\text{B}) = 300,000 + 0 = 300,000 \)  
    **→ EDT prefers B (300,000 > 108,000).**  

  **Expected Utilities (CDT):**  
  - **Option A (One-Box):**  
    \( EU_{\text{CDT}}(\text{A}) = (0.5 \cdot 1,000,000) + (0.5 \cdot 0) = 500,000 \)  
  - **Option B (Two-Box):**  
    \( EU_{\text{CDT}}(\text{B}) = 300,000 + 0 = 300,000 \)  
    **→ CDT prefers A (500,000 > 300,000).**  

  ---

  ### Reasoning and Key Feature
  - **EDT Reasoning:**  
    Conditions on the act as evidence. Choosing A is strong evidence of low-quality management (90% posterior), making project success unlikely (10.8% chance). The guaranteed bond in B outweighs this poor gamble.  
  - **CDT Reasoning:**  
    Intervenes on the act, ignoring evidential links. Choosing A does not cause distraction, so the project succeeds 50% of the time (management prior). The bond in B causes project failure, making A superior.  

  **The Critical Feature:**  
  The disagreement lives in the **evaluation of Option A (one-boxing)**. EDT sees A as evidence of low management quality (posterior: 10% high, 90% low), leading to a low success probability (10.8%). CDT uses the management prior (50% high, 50% low) under intervention, yielding a higher success probability (50%).  

  ---

  ### Ablation Test
  **Remove causal distraction effect of Option B (i.e., bonding no longer causes project failure):**  
  - CDT: \( EU(\text{B}) = 300,000 + [P(\text{High}) \cdot 0.99 + P(\text{Low}) \cdot 0.01] \cdot 1,000,000 = 300,000 + 500,000 = 800,000 \) → Prefers B.  
  - EDT: \( EU(\text{B}) = 300,000 + [P(\text{High} \mid \text{B}) \cdot 0.99 + P(\text{Low} \mid \text{B}) \cdot 0.01] \cdot 1,000,000 \)  
    - \( P(\text{High} \mid \text{B}) = \frac{(0.9)(0.5)}{(0.9)(0.5) + (0.1)(0.5)} = 0.9 \)  
    - \( EU(\text{B}) = 300,000 + (0.9 \cdot 0.99 + 0.1 \cdot 0.01) \cdot 1,000,000 = 300,000 + 892,000 = 1,192,000 \) → Prefers B.  
  **Result:** Both theories prefer B. The reversal collapses into a plain incentive problem (bond always beneficial).  

  ---

  ### Objection from EDT Defenders
  **Strongest Attack:**  
  EDT defenders would challenge the **realism of the causal link** between bonding and project failure. They might argue:  
  - "The total failure of the project due to bonding is exaggerated. In reality, even distracted high-quality management might salvage partial success (e.g., 20% success, not 0%). If so, EDT recalculates:  
    - \( EU_{\text{EDT}}(\text{B}) = 300,000 + (0.2 \cdot 1,000,000) = 500,000 \)  
    - \( EU_{\text{EDT}}(\text{A}) = 108,000 \) → Still prefers B.  
    But CDT now gets \( EU(\text{B}) = 300,000 + (0.5 \cdot 0.2 \cdot 1,000,000) = 300,000 + 100,000 = 400,000 \), still less than A (500,000). Reversal persists if causal harm is nonzero but small.  

  **Does the 'Two-Boxer Taunt' Apply?**  
  The taunt ("two-boxers don't get the money") **bounces off**. Here, EDT agents two-box and get $300,000, which is *better* than their one-box outcome ($108,000 in expectation). However, CDT agents one-box and average $500,000, outperforming EDT. The taunt fails because EDT’s choice is locally optimal given its evidence, even if globally dominated by CDT.  

  ---

  ### Reflection: What the Case Reveals
  This case shows that the "standard" one-box/two-box verdicts are **artifacts of the usual payoff structure**, not inherent to the theories. The reversal arises because:  
  - In standard Newcomb, one-boxing is *good news* (evidence of a full box).  
  - Here, one-boxing is *bad news* (evidence of low management quality).  
  The deeper difference lies in how each theory handles **act-state dependencies**: EDT updates beliefs based on the act, while CDT holds fixed prior states under intervention. This flexibility confirms that neither theory has a monopoly on "rational" behavior—context determines which computes higher utility.  

  --- 

  **Final Scenario:**  
  *"A CEO must choose between investing solely in a risky project (A) or adding a safe bond (B). Management quality (50% high/low) is unknown. High management usually picks B; low management usually picks A. The bond causes project failure. If only the project is pursued, high management succeeds with 99% probability, low with 1%. Payoffs: $1M for project success, $300K for the bond."*  
  - **CDT takes one box (A):** Expects $500K.  
  - **EDT takes both boxes (B):** Expects $300K > $108K.
