     - Realistic setting: institutional, medical, financial.
     - No demons, perfect predictors, time travel, etc. Prediction can be imperfect (like a shrewd human observer or an imperfect test).
     - Agent is fully informed and rational.
     - No pre-commitment or self-modification: the decision is made at the moment of choice.
