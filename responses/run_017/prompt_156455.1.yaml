   In the standard Newcomb problem:
     - Box A is transparent and contains $1000.
     - Box B is opaque and contains either $1,000,000 or $0, depending on a prediction.
     - The predictor is very accurate: if it predicts you take only box B, it puts $1M in B; if it predicts you take both, it leaves B empty.

   Standard verdicts:
     - EDT: Take only box B (because taking both is strong evidence that B is empty, so you get only $1000; taking only B is evidence that B is full, so you get $1M).
     - CDT: Take both boxes (because your action doesn't cause the content of B, so whatever is in B, you get an extra $1000 by taking both).

   We want the reverse: CDT one-boxes, EDT two-boxes.

