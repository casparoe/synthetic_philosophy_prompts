prompt: |-
  I host a small philosophy podcast, and next week's guest is a philosopher who's just published a book reviving Moore's organic-unity axiology: the two great intrinsic goods are the enjoyment of beauty and personal affection, we know this by intuition rather than argument, and the value of an organic whole isn't the sum of the value of its parts. Her one genuinely new move is a "replacement test" instead of Moore's isolation test: to find the value of a friendship, don't imagine it alone in an empty universe, imagine swapping this friend for the most agreeable available substitute while holding your own mental states fixed, and see what's lost.

  Draft me seven or eight questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one on the "no owner" problem: if the surplus value of the friendship-whole isn't experienced by either friend, who is it good for — and if her answer is that value needn't be value-for anyone, push on what practical work "good" is still doing. At least one on her own bullet-biting claim that beautiful objects nobody ever sees add almost nothing to a world's value: does that quietly make her a pure experientialist, and if so why keep beauty on the list of intrinsic goods at all? One on scope: if the method delivers beauty and friendship, why not parenting, achievement, or religious devotion, and what stops the method from being a blank cheque for whatever a particular class finds tasteful? One that turns the organic-unity machinery loose on evil — if wholes generate surplus value, can a friendship that involved betrayal and reconciliation be more valuable than an equally close one that didn't, and does she bite that bullet too? And please end with one question where her favourite deflection, roughly, that intuition is the datum and there's nothing further to argue about, stops being available to her — plus one about what would actually count as evidence against the view.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and has an upcoming guest who's reviving Moore's organic-unity axiology. They need seven or eight interview questions with follow-ups tailored to the guest's likely answers. The user provided specific topics to cover: the "no owner" problem, the value of unseen beauty, scope issues, applying organic unity to evil, limitations of intuition, and what could falsify the view.

  First, I need to understand the core elements of the guest's position. She emphasizes two intrinsic goods: enjoyment of beauty and personal affection. Value is known intuitively, and organic wholes have non-additive value. Her novel "replacement test" replaces Moore's isolation test. 

  The user wants at least one question on each specified topic. Let me start brainstorming each required area. For the "no owner" problem, the key is the surplus value not experienced by anyone. The guest might say value doesn't need to be for someone, so the follow-up should challenge the practical implications of that. 

  On unseen beauty, the guest claims it adds almost no value. The follow-up should question if this makes her an experientialist and why keep beauty as intrinsic if unseen objects don't contribute. 

  For scope, why limit to beauty and friendship? Parenting, achievement, etc., might seem similar. The follow-up can address cultural relativism concerns. 

  Applying organic unity to evil—could betrayal and reconciliation enhance a friendship's value? Follow-up on whether this moralizes harm. 

  Then, a question where intuition can't be the answer—like conflicting intuitions. Follow-up on resolving disputes. 

  Lastly, falsifiability: what evidence could counter the theory? Follow-up on whether empirical data like neuroscience could challenge it. 

  I should ensure each question has a clear follow-up based on anticipated responses. The user also mentioned ending with intuition's limitations and falsification, so those should be the last two questions. 

  Need to check that all user-specified points are covered. The "no owner" problem, unseen beauty, scope, evil, intuition's limit, and falsification. That's six, so adding one more might be good. Perhaps expanding the scope question into two parts: one on extending to other goods and another on cultural relativism. 

  Also, the guest's replacement test should be integrated where relevant. For the evil question, using the replacement test could illustrate how betrayal adds value. 

  Make sure the questions are engaging and push the guest to clarify her views. Avoid yes/no questions; aim for open-ended ones that provoke deeper discussion. 

  Finally, structure each question with the main query followed by the likely answer and a pointed follow-up. Keep the language accessible for a podcast audience but philosophically rigorous.
answer: |-
  Here are eight focused questions with anticipated answers and pointed follow-ups, designed to probe the core tensions in her revival of Moore:

  1.  **The Replacement Test Foundation:** "Your 'replacement test' is the novel core of your revival. Could you walk us through *exactly* how applying it to, say, a specific friendship, yields the conclusion that the friendship-whole has surplus value beyond the sum of the pleasant mental states of the friends?"
      *   *Likely Answer:* She'll illustrate: Swapping a specific friend (Fred) with a maximally agreeable substitute (Sam) while holding her own mental states (pleasure, affection-feelings) fixed, reveals a profound loss of value *despite* similar pleasant feelings. This loss captures the unique, irreplaceable value *of the whole relationship*.
      *   **Follow-Up:** "But doesn't holding my *internal* states fixed in the swap scenario artificially isolate the emotional/experiential component? If the unique value only manifests when the *actual external relationship* exists, isn't the test presupposing the very non-experiential, relational surplus it aims to prove?"

  2.  **The "No Owner" Problem:** "Moore famously struggled with the 'no owner' problem for organic unities: if the surplus value of the friendship-whole isn't located in the pleasant experiences of either friend, who or what is this value *for*? Who benefits from it?"
      *   *Likely Answer:* The value is intrinsic and impersonal; it simply *is*. It's good *simpliciter*, not good *for* any particular subject. The universe is better for containing such wholes.
      *   **Follow-Up (Pushing Practicality):** "If this surplus value isn't good *for* anyone – not the friends, not observers, not some cosmic entity – what practical work does the concept 'good' do here? How does this impersonal 'goodness' differ from just saying the universe contains a complex relational fact we happen to *label* 'good'? Does it impose any actual *reasons for action* on anyone?"

  3.  **Unseen Beauty & Experientialism:** "You argue that an unseen, unexperienced beautiful object adds 'almost nothing' to a world's value. Doesn't this position functionally collapse intrinsic value into *experiential* value? If so, why retain 'beauty' itself (an objective property) on your list of intrinsic goods, rather than just 'the experience *of* beauty'?"
      *   *Likely Answer:* The *intrinsic* good is the *enjoyment* of beauty (the experience), which requires a beautiful object. The object is a necessary condition for the good, but its mere existence without being experienced generates negligible value. Beauty itself is the *object* of the valuable experience.
      *   **Follow-Up:** "But doesn't this make the beautiful object purely instrumental? If its value is entirely contingent on being experienced, and the *experience* is the real intrinsic good, haven't you quietly abandoned Moore's commitment to *objective* beauty as a component of the good and become a full experientialist? What distinct work is 'beauty' doing that 'pleasure in contemplating complex form' doesn't capture?"

  4.  **Scope I - Why Only These Two?:** "Your method supposedly delivers beauty-enjoyment and personal affection as the *only* fundamental intrinsic goods. Why doesn't the replacement test similarly reveal parenting, meaningful achievement, or religious devotion as intrinsic goods? Imagine replacing a deeply meaningful act of parenting with an equally 'agreeable' substitute act – wouldn't something profound also be lost?"
      *   *Likely Answer:* Intuition reveals that only the enjoyment of beauty and personal affection are *fundamental*. Other goods (like parenting or achievement) might be complex compounds *derived* from these fundamental goods plus other elements, or perhaps valuable only instrumentally. The replacement test might reveal loss, but that loss could be of *derived* or *instrumental* value.
      *   **Follow-Up:** "Doesn't this risk circularity? You use the replacement test to *illustrate* the surplus value of the goods intuition already picks out, but intuition seems to be doing the heavy lifting in *selecting* which goods to apply the test to in the first place. How do you rule out the intuition that parenting *is* fundamental using your method?"

  5.  **Scope II - Relativism & Blank Cheque:** "What prevents the replacement test from becoming a relativist's blank cheque? If a particular class intuitively finds immense surplus value in, say, exclusive club membership or accumulating rare status symbols (where replacing *this* club/symbol causes a deep loss despite similar agreeable substitutes), does your method validate their axiology?"
      *   *Likely Answer:* No, because the fundamental goods are fixed by *correct* intuition – the enjoyment of *genuine* beauty and *true* personal affection. Mistaken intuitions confuse derived, instrumental, or pseudo-goods for fundamental intrinsic goods. The replacement test must be applied to the *right kind* of things.
      *   **Follow-Up:** "This seems to reintroduce Moore's problem of the 'naturalistic fallacy' in disguise. How do we *know* which intuitions are 'correct' about what constitutes 'genuine' beauty or 'true' affection, other than appealing back to the very intuitions under scrutiny? Isn't the method vulnerable to cultural bias masked as intuitive certainty?"

  6.  **Organic Unity Applied to Evil/Complexity:** "Organic unities can generate surplus *disvalue* too. Consider a deep friendship that endures a painful betrayal and subsequent hard-won reconciliation. Applying your replacement test: replacing *this specific* history-laden friendship with an equally close but betrayal-free one might reveal a *loss* of something valuable (depth, resilience, understanding). Does this mean the betrayal-reconciliation whole could be *more* intrinsically valuable than an otherwise identical untroubled friendship?"
      *   *Likely Answer:* She'll likely bite the bullet: Yes, the complex whole *including* the overcoming of betrayal might possess a unique, greater surplus value than a simpler, untroubled friendship. The value resides in the complex relational whole.
      *   **Follow-Up:** "Doesn't this morally valorize suffering and betrayal? If the surplus value comes from the *reconciliation*, not the betrayal itself, why wouldn't the replacement test show equal or greater value in a friendship that achieved that depth *without* the prior harm? If the betrayal is a necessary condition for *this specific* valuable reconciliation-whole, does that make the betrayal instrumentally *good*?"

  7.  **The Limits of Intuition (Deflection Blocked):** "You emphasize intuition as the bedrock. But intuitions famously conflict, both between people and within one person over time. When your intuition about the surplus value of a friendship clashes with *my* intuition that it's just the sum of pleasant feelings, or when societal values shift, what *procedure* or *consideration* beyond simply re-asserting your intuition can resolve this? Where does intuition stop and argument begin?"
      *   *Likely Answer:* (Attempted Deflection): Intuition is the starting point; we clarify concepts, consider thought experiments (like the replacement test), seek coherence, but ultimately, fundamental moral intuitions are the data we reason *from*, not *to*.
      *   **Follow-Up (Blocking Deflection):** "But when intuitions directly clash on the *same* datum (e.g., the value-status of *this* friendship-whole), and clarification/coherence checks don't resolve it, what *then*? Doesn't this persistent clash suggest intuition alone is insufficient, and we *must* appeal to something further – perhaps consequences, practical reason, or even empirical psychology – to adjudicate? Doesn't your method stall here?"

  8.  **Falsifiability:** "Finally, what would actually count as evidence *against* your specific axiology? If it's grounded in intuition, and intuitions can be explained away when they disagree, is the theory falsifiable? What discovery or argument could convince you that enjoyment of beauty and personal affection are *not* the sole fundamental intrinsic goods, or that organic wholes *don't* have surplus value?"
      *   *Likely Answer:* Evidence might include: a demonstration of deep incoherence within the view; showing it leads to strongly counterintuitive consequences *even after careful reflection* that outweigh its initial plausibility; perhaps a more powerful, comprehensive, and intuitive axiological theory emerging that explains the same phenomena without organic unities.
      *   **Follow-Up:** "Could empirical findings play a role? For instance, if neuroscience robustly showed that all human valuation, including of beauty and friendship, reduces without remainder to neurological mechanisms tracking evolutionary fitness or pleasure/pain, would that undermine your claim about *sui generis* intrinsic value and organic wholes? Or would you simply say neuroscience misses the normative, intuitive level?"

  These questions push on the metaphysical puzzles (No Owner), the potential slippage in her commitments (Unseen Beauty), the scope and objectivity concerns (Scope I & II), the implications of the core machinery (Evil/Complexity), and the fundamental justificatory method (Intuition's Limits & Falsifiability). They force engagement beyond simple appeals to intuition. Good luck with the interview!
