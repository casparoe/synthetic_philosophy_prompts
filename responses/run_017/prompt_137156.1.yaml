answer: |-
  ### 1. Mapping Family Resemblance
  **Claim Type:** Wittgenstein's "family resemblance" is primarily a *semantic* thesis about how certain concepts function in language. It denies that definitions require necessary-and-sufficient conditions, positing instead overlapping similarities (like traits in a family) that link members without a single shared essence. It is **not** primarily psychological (about mental representations) nor a normative theory for dispute resolution (though it implies disputes may stem from expecting essence where none exists).

  **Candidate Features & Overlap:**
  - **Genuinely Overlapping:** 
    - *Roundness* (due to self-gravity): Shared by planets, dwarf planets, some moons.
    - *Orbiting a star*: Shared by planets, dwarf planets, exoplanets (but historically excluded Sun/Moon).
    - *Dynamical dominance* ("clearing"): Present in gas giants (strongly) and Earth (less so), absent in asteroids/Pluto. **Crucially, this is a matter of degree.** 
  - **Coextensive (Historically Contingent):** 
    - *Visibility to naked eye*: True for classical planets but irrelevant for Uranus/Neptune/exoplanets.
    - *"Wanderer" motion*: Defined ancient class, now obsolete (Sun/Moon excluded).
    - *Not fusing*: Distinguishes planets from stars, but shared by brown dwarfs/dwarf planets.
    - *Composition*: Varies wildly (gas giants vs. terrestrials vs. ice dwarfs); no single "planetary" composition.

  ### 2. Running the Theory on the Case
  **What IAU Should Have Done (Wittgensteinian View):** The IAU *correctly* recognized the need for a context-specific definition ("planet *of the Solar System*") for their taxonomic purpose (language game of Solar System dynamics). Family resemblance suggests **defining for a stated purpose within a specific language game is legitimate and often necessary**, rather than refusing to define. However, the theory highlights the **arbitrariness** in choosing *which* resemblance cluster to prioritize (geophysical vs. dynamical). It doesn't mandate one choice but critiques the illusion that "planet" has a unique, context-independent essence the IAU merely "discovered."

  **Explaining Resistance:**
    - **Public Resistance:** Primarily stems from *cultural/psychological* attachment and learning Pluto as a planet – not directly from family resemblance semantics. However, the *persistence* of the dispute reflects that "planet" functions in public discourse via overlapping features (size, roundness, name-recognition) distinct from the IAU's dynamical game.
    - **Astronomers' Discomfort:** **Directly illustrates family resemblance.** Prior to 2006, "planet" loosely grouped round bodies orbiting the Sun, with dynamical dominance implicitly stronger for inner planets. The IAU prioritized one feature (clearing) over others (roundness), disrupting the existing resemblance cluster. Critics favoring a geophysical definition (roundness + star orbit) argue for a *different* resemblance cluster within planetary science. The discomfort arises because neither cluster is *objectively* the "true" one; the choice is pragmatic.

  ### 3. Pressing Problematic Features
    - **Vagueness of "Clearing":** Wittgenstein anticipates this! Replacing open-ended concepts with "necessary/sufficient" conditions often just **relocates vagueness** (e.g., "cleared" lacks a sharp boundary). This doesn't invalidate definitions; it shows they serve specific purposes within a game. The vagueness here reflects the *degree-based* nature of dynamical dominance, an inherent feature the definition tries (imperfectly) to capture. Family resemblance handles vagueness better than essentialism.
    - **Multiple Language Games:** This is **central** to Wittgenstein. "Planet" plays different roles:
      - *Solar System Taxonomy (IAU):* Focuses on dynamical roles/history.
      - *Exoplanet Catalogs:* Focuses on star-orbiting + mass/radius thresholds (often avoiding "clearing" due to observational limits).
      - *Comparative Geophysics:* Focuses on intrinsic properties (roundness, geology, atmosphere).
      - *Schoolrooms/Public:* Focuses on memorization, cultural significance, size.
    Family resemblance explains why no single definition works across all games. The IAU defined it *for their specific game* (Solar System dynamics). Resistance occurs when definitions from one game are imposed on another (e.g., geophysicists objecting that dynamical criteria ignore intrinsic properties relevant to *their* game).

  ### 4. Turning Back on the Theory
    - **Status:** The Pluto case is **a strong confirmation of family resemblance**, not an anomaly. It vividly shows:
      1. The pre-2006 usage relied on overlapping features without strict necessity/sufficiency.
      2. Attempts to impose strict definitions are driven by specific purposes (IAU taxonomy) and relocate vagueness.
      3. Disputes arise from clashes between different language games prioritizing different resemblances.
    - **Descriptive vs. Prescriptive:** Wittgenstein is primarily **descriptive** – he observes how concepts *actually function*. He *advises* against the confused demand for a single essence where family resemblance operates. Scientific classification **is** a language game where demanding a precise definition *for a specific purpose* is **legitimate** (e.g., the IAU's need for a clear Solar System taxonomy). The confusion arises when this purpose-bound definition is mistaken for revealing the concept's "true essence" across all contexts. The episode shows scientific definition is a *stipulative act within a game*, not essence-discovery.

  ### Extension: The Oort Cloud Object
    - **The Disagreement:** This is a **clash of language games/resemblance clusters.** Discoverers prioritize features: Sun-orbit + roundness + isolation (resembling classical planets). The field likely prioritizes the IAU's dynamical criterion ("clearing," implying gravitational dominance established over time) or location/dynamical history (Oort Cloud = primordial icy debris, not co-formed with inner planets like classical planets).
    - **Family Resemblance's Role:** It **dissolves the illusion** that there's a single fact of the matter to be discovered. It shows the disagreement stems from prioritizing different overlapping features within different practices (discovery excitement vs. established taxonomy/dynamical theory). It doesn't *settle* the dispute but clarifies its nature: a **negotiation** about which resemblance cluster best serves the relevant scientific (or even cultural) purposes in this context. The outcome depends on which language game (dynamicist, geophysicist, populist) gains dominance for this object, not on uncovering "planet-ness."
