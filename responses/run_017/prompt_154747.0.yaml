  Okay, let me tackle this user's complex query on slur annotation guidelines. The user is building a content moderation system and fine-tuning corpus, so they need a robust linguistic theory of slurs that can handle edge cases. 

  First, I need to parse their requirements carefully. They listed 14 specific cases - from reclaimed usage to cross-linguistic differences. Each of these will become a desideratum in Table 1. I'll classify them as non-negotiable (essential for moderation), negotiable (context-dependent), or reject (theoretical baggage). 

  Noticing two key tensions: reclaimed in-group use vs negation/conditional embeddings, and universal offensiveness vs cultural specificity. These might be jointly unsatisfiable. The upward slur case also challenges theories assuming power imbalance.

  For Table 2, I'll evaluate major theories against the requirements. Pure expressivism fails reclaimed use, while presuppositional accounts struggle with embeddings. The "no special phenomenon" view gets rejected for ignoring unique slur characteristics. 

  The coda will highlight these tensions and note that the reclaimed use requirement eliminates most theories. Settled points include conventionalized offense and reclamation possibility; contested areas cover mechanisms and upward slurs.

  Throughout, I'll maintain clear separation between consensus views (like conventional offensiveness) and debated areas (like whether offensiveness requires speaker endorsement). The tables will provide actionable guidance while flagging theoretical limitations.
answer: |-
  Here are the desiderata tables and coda, based on current linguistic/philosophical debates and practical annotation needs:

  **Table 1: Desiderata for Slur Annotation Theory**

  | ID | Requirement | Motivating Case | Status | Conflicts With |
  |----|-------------|-----------------|--------|----------------|
  | R1 | **Distinguish reclaimed in-group use from derogatory out-group use.** | Black community member using the N-word positively vs. white supremacist using it hatefully. | Non-negotiable | R4, R5 (Potentially) |
  | R2 | **Identify pure mention (non-use) without triggering offense.** | Linguist writing: "The word [slur] is highly offensive." News report: "He was called a [slur]." | Non-negotiable | R4 |
  | R3 | **Recognize orthographic masking (e.g., asterisks, leetspeak) that preserves offensive intent.** | "You're a f**got!" or "Stupid n00b$." | Non-negotiable | - |
  | R4 | **Detect offense persisting under negation, interrogation, conditionals.** | "He's not a [slur]." / "Is he a [slur]?" / "If he's a [slur], then..." | Non-negotiable | R1, R2 |
  | R5 | **Identify uses where offense is asserted/conceded with speaker distancing (e.g., "allegedly," "so-called").** | "They claim he's a [slur], but I doubt it." / "The so-called [slur] entered the room." | Negotiable | R1 |
  | R6 | **Distinguish slurs from non-slur pejoratives.** | "Jerk" (pejorative) vs. racial/ethnic/gender slur. | Non-negotiable | R9 |
  | R7 | **Handle cross-linguistic neutrality.** | "Negro" neutral in Spanish, slur in English. | Non-negotiable | - |
  | R8 | **Recognize novel, context-bound slurs.** | Term coined & used offensively within a niche online forum last month. | Negotiable | - |
  | R9 | **Account for slurs targeting non-existent, false, or behavioral groups.** | "K-slur" (targeting non-existent group), "M-slur" (targeting "people who like pineapple on pizza"), "T-slur" (targeting trans people, a real but falsely described group). | Non-negotiable | R6 |
  | R10| **Account for "upward" slurs targeting dominant groups.** | "Cracker," "honky" targeting white people. | Negotiable | (Some theories assume inherent power imbalance) |
  | **R11** | **Requirement that excludes most theories: Offense must be *conventionally encoded* in the term's meaning (not solely speaker intent or listener effect).** | Needed to explain R2-R4, R7, R9: offense arises predictably from the *word itself* in context, regardless of specific speaker intent. | **Non-negotiable** | (Fundamental to the phenomenon) |
  | R12 | **Annotation distinction between slur *use* (offensive) and *mention* (neutral reporting).** | Practical need for labeling pipeline. Derivative of R2 & R11. | Non-negotiable | - |
  | R13 | **Offense not dependent on speaker's endorsement of the attitude.** | Explains R4, R5: Speaker can report/quote/deny without endorsing, but offense lingers. | Non-negotiable | - |
  | R14 | **Target group identification must be possible from context or convention.** | Needed for R1, R7, R8, R9, R10. | Non-negotiable | R9 (Challenges empty/false target cases) |

  **Table 2: Theory Scorecard**

  | View | Key Failing/Most Strained Requirement | Verdict for Annotation |
  |------|--------------------------------------|------------------------|
  | **Pure Expressivism** (Slurs *only* express speaker attitude) | Fails R2 (mention), R4 (embedding), R13 (non-endorsement). Cannot explain why offense persists when speaker isn't expressing hate. | **Reject**. Too weak for annotation. |
  | **Hybrid Expressivism** (Slurs have descriptive content + expressive content) | Strains R4 (embedding). Explaining why expressive content projects out of negation/conditionals is complex and debated. May struggle with R1 (reclamation - is expressive content deleted?). | **Negotiable**. Can handle many cases but embedding/reclamation complex. |
  | **Presuppositional** (Slurs presuppose target's inferiority/contemptibility) | Fails R4 (embedding). Presuppositions *are* typically preserved under negation/conditionals, satisfying R4. However, struggles severely with R1 (reclamation - is presupposition suspended?) and R2 (mention - presuppositions aren't usually triggered in mention). | **Negotiable**. Strong on embedding (R4), weak on reclamation (R1) & mention (R2). |
  | **Conventional Implicature (CI)** (Slurs conventionally implicate derogation) | Best fit for R4 (CI projects), R2 (mention doesn't trigger CI), R13. Struggles with R1 (reclamation - is CI defeasible/suspended?) and R10 (upward slurs - does "cracker" conventionally implicate inferiority?). | **Most Promising**. Handles core cases (R2, R4, R13) well. Reclamation (R1) requires supplementary mechanism. |
  | **"Just Pejoratives"** (No semantic/pragmatic difference) | Fails R4 (pejoratives like "jerk" lose offensiveness under negation/conditionals), R6 (need to distinguish), R7 (cross-lingual neutrality requires semantic encoding). Ignores unique linguistic behavior of slurs. | **Reject**. Core differences exist. |

  **Coda (187 words):**

  The primary tension exists between **R1 (Reclamation)** and **R4 (Embedding Projection)**. Theories adept at explaining why offense projects robustly in embeddings (R4) – like Presuppositional and CI accounts – struggle to explain how the *exact same word* loses its derogatory force entirely in reclaimed contexts (R1). Hybrid Expressivism offers flexibility here but lacks a consensus mechanism. **R11 (Conventional Encoding)** is the key requirement excluding intent-based theories and demanding a semantic/pragmatic component beyond description. This requirement underpins the need to handle R2, R4, R7, and R9 consistently. While R1 causes the most theoretical headaches, R11 does the most work in excluding inadequate candidate theories (Pure Expressivism, "Just Pejoratives"). Annotation pipelines *must* handle R1, R2, R3, R4, R6, R7, R9, R11, R12, R13, R14 robustly. R5, R8, R10, while important, might be handled with contextual rules if the core theory is solid.

  **Settled vs. Contested**

  *   **Settled:**
      1.  Slurs conventionally encode offense/derogation (R11) – it's not *just* speaker intent or listener uptake.
      2.  This offense projects robustly out of linguistic embeddings like negation, questions, and conditionals (R4).
      3.  Reclamation of slurs by target groups occurs and presents a distinct usage (R1 exists as a phenomenon).
      4.  Slurs are distinct from non-slur pejoratives (R6) in core linguistic behavior (especially R4).
      5.  Mention (R2) is theoretically distinct from use.
  *   **Contested:**
      1.  The *exact semantic/pragmatic mechanism* of the encoded offense (CI vs. Presupposition vs. Hybrid Expressivism vs. others).
      2.  How reclamation (R1) *works* semantically/pragmatically within any given theory.
      3.  Whether "upward" slurs (R10) function identically to "downward" slurs.
      4.  The best theoretical treatment of slurs with empty/false targets (R9).
      5.  The necessity and nature of a "neutral counterpart" for all slurs.
