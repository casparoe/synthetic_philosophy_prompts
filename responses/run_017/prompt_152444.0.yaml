prompt: |-
  You are a philosopher of science who also works on statistical methodology and meta-science, and I'd like you to think carefully and work in stages: first a rough, candid diagnosis of the pattern in the cases below, then a cleaned-up statement of the principle, then the cases it settles that I haven't given you. Don't just name-drop a framework and stop; I want the clauses.

  Some background on where this comes from: I'm an assistant professor in a psychology department, and I spent most of a long departmental meeting arguing with two colleagues about how we should weigh evidence in the disputes that keep coming up in our literature. One colleague's position was essentially "preregistration plus big samples solves it — anything not preregistered is just storytelling." The other said the real villain is underpowered designs and that a single well-run study with a tiny effect estimate tells us more than a dozen small significant ones. I pushed back on both, and by the end of the argument I realized that I was issuing a string of verdicts that I couldn't state as a rule. The two of us did agree on one thing, though: that we can't go on treating the published literature as a simple record of findings, because the selection process into journals is itself part of the evidence, and because a lot of what gets published is the output of designs that had plenty of freedom in which outcome to report, which comparison to run, which participants to drop, or when to stop collecting. My own tentative principle was this: a result counts as evidence for a hypothesis only if it would survive being asked, in detail, what else the researchers could have done and didn't report — i.e., evidence is a property of a process of inquiry, not of a number. I like that principle, but I don't think it actually delivers all my verdicts, and I'd rather find out where it breaks than keep asserting it.

  Here are the cases, with what I said about each. (1) A parapsychology paper reports a precognition effect from roughly a thousand participants across a series of experiments, with tiny p-values, explicit predictions, and — by the standards of the field — careful procedure and analysis; my gut says this is not evidence that the effect is real, and not merely evidence that gets outweighed. (2) A famous two-minute bodily-posture manipulation was said to change hormone levels and risk-taking on the basis of a study with about two dozen people per cell; a later preregistered replication with several times the sample, run in a different lab with a slightly different posture procedure, found essentially nothing, and I want to say this replication counts substantially against the original claim. (3) The same effect is then retested across a few dozen labs, each running the identical protocol, and the results scatter: a handful of labs clearly positive, a handful clearly negative, most clustered around nothing. I don't think this scatter counts much against the original; I think it counts as evidence that the effect, if it exists, depends on something about the setting that nobody has identified — and I notice that this sits badly with (2), where I was happy to let a null count against the effect. (4) A large preregistered study with well over a hundred thousand participants finds an effect that is significant at p just under .05 but so small that no one would design an intervention around it. My verdict: it is real evidence that the effect is not exactly zero, and my colleague's "that's just noise dressed up as a finding" is wrong — the design could have failed to detect it and didn't. (5) A meta-analysis of a literature finds a pooled effect comfortably different from zero, but a p-curve analysis of the same set of studies shows the significant p-values bunched just under .05 rather than spread toward zero. I don't count this as evidence for the effect. (6) A single paper reports three small studies, all significant, with p-values of about .04, .03, and .04. I want to say this is weaker than one adequately powered preregistered study at p = .001 — but I can't say why, since on my tentative principle nothing about the first case looks like a reporting sin: all three studies are right there in the paper. (7) The case we did agree on: a preregistered study with a couple of hundred participants finds that a hormone manipulation shifts risk-taking with p = .004. Both of us said: that's evidence, tentative but real, even though we'd bet against it surviving a decade. (8) The case I go back and forth on: an original study and one preregistered replication disagree, one significant and one null, both competently run, both with decent power. What should an editor do — publish the pair and describe the literature as unsettled, or treat the disagreement itself as the finding? And what does your principle say about a case nobody in my department could agree on: after a second, even better powered replication also comes back null, are we ever permitted to conclude the effect is absent, or does the mere possibility of an unidentified moderator keep absence permanently off the table?

  So: what principle, or small set of rival principles, captures these verdicts? Please tell me which of my verdicts your preferred principle cannot accommodate and which one it says I must give up, noting where I'd rather overturn the verdict than complicate the principle. I especially want you to fix whether my tentative principle needs a second dimension alongside the "what else could they have done" test — something about whether the design was capable of failing to deliver the result it delivered, or about how prior implausibility and untraceable sources of error enter — and to be explicit about whether the resulting principle collapses into a familiar Bayesian or error-statistical account or is a genuinely distinct norm for a discipline with a publication filter. State the principle precisely enough that I can apply it to cases you haven't been given, and give me at least three of those applications on your own.
reasoning: |-
  Hmm, this is a fascinating methodological puzzle from a psychology professor grappling with evidence evaluation. The user presents eight cases where their intuitive judgments about what constitutes valid evidence seem inconsistent, and they want a unifying principle that explains all these verdicts while addressing publication bias and researcher degrees of freedom.

  Let me unpack this carefully. The user's tentative principle - that evidence depends on the process of inquiry rather than just the numbers - is a good starting point but clearly fails to capture nuances like the parapsychology case (where even clean numbers feel unconvincing) or the three-small-studies case (where multiple significant p-values seem weaker than they should). The cases reveal at least three dimensions of evidence quality that need accounting for: (1) the threat of unreported alternatives (their original insight), (2) the capacity to detect absence, and (3) contextual vulnerability to bias.

  For the parapsychology example, the key isn't just that researchers could have run different analyses - it's that the entire phenomenon defies established mechanisms, making unreported methodological artifacts more plausible than psi. This suggests we need to incorporate prior plausibility not as a Bayesian prior, but as a lens for judging which "what else could they have done" possibilities are scientifically meaningful. The posture replication case highlights how a null result gains evidential weight specifically when it comes from a process designed to be vulnerable to failure - the replication team had every incentive to find an effect yet found nothing.

  The multi-lab scatter is particularly instructive. The variability doesn't refute the effect because it reveals a new dimension of uncertainty (moderators) rather than exposing procedural fragility. This contrasts sharply with the p-curve case where the p-hacking pattern indicates the reported analyses survived precisely because researchers had freedom to suppress alternatives. 

  For the user's tentative principle to work, it needs two key upgrades: first, it must consider not just whether alternatives exist, but whether the design precommitted to withstanding specific, plausible threats to validity. Second, it must evaluate how the result sits within a broader space of possible outcomes - a .05 finding in a low-power study proves less than the same p-value in a high-power design because the latter had more ways to fail.

  The resulting principle I'd propose has three interconnected clauses about the test's fortifications against bias, its diagnostic capacity, and its contextual vulnerability. This isn't just repackaged Bayes or error statistics - it specifically addresses how publication incentives distort the evidence landscape. For instance, it explains why the huge sample with tiny effect (case 4) counts as evidence: given publication bias against nulls, the fact this survived peer review despite its unsexy effect size suggests robustness.

  Applying this to new cases: A preregistered study with p=.06 in a low-power design? Not evidence for null - because it couldn't reliably detect real effects. A massive correlational study finding p<.001 for an implausible effect? Weak evidence - high vulnerability to confounds. Three consistent replications across varying methods? Strong evidence - demonstrates resilience to different "what else" scenarios.
answer: |-
  Your cases reveal a tension between *procedural robustness* and *diagnostic capacity* that your tentative principle partially captures but lacks precision on *how prior plausibility and outcome vulnerability shape evidence*. After analyzing your verdicts, I propose this two-dimensional principle:

  **The Fortified Process Principle (FPP):**  
  *A result constitutes evidence for a hypothesis H only if:*  
  **(1) Fortification Clause:** *The inquiry process preemptively restricted plausible alternative paths to the same reported outcome (e.g., via preregistration, blind analysis, or design constraints that eliminate researcher degrees of freedom), AND*  
  **(2) Diagnostic Clause:** *The design was capable of producing a meaningfully different outcome if H were false (e.g., adequate power against relevant alternatives; outcome not trivially achievable via error or bias given contextual priors).*  

  *Evidence strength scales with (a) the severity of the test imposed by Clause 2, and (b) the comprehensiveness of fortification in Clause 1 against salient risks in the research context.*

  ---

  ### Why this explains your verdicts:
  - **(1) Parapsychology:** Fails **Clause 2** despite fortification. Given extreme prior implausibility of psi, *any* positive result is easily achievable via undetected artifacts (sensory leakage, selective reporting across labs). The design isn’t diagnostic against "bias or error" alternatives.  
  - **(2) Posture replication:** Counts against original because **Clause 2** is satisfied: a well-powered, preregistered design (*fortified*) had high probability of detecting the original effect size if real (*diagnostic*). Null outcome is thus evidence against H.  
  - **(3) Multilab scatter:** Doesn’t refute original because heterogeneity violates **Clause 2** for *absence* claims: labs weren’t identical in unknown moderators, so nulls aren’t diagnostic of global effect absence. Consistent with "unidentified moderator" view.  
  - **(4) Large-n tiny effect:** Satisfies both clauses. Precommitment (*Clause 1*) ensures small effect isn’t cherry-picked; high power (*Clause 2*) makes trivial-but-nonzero effect detectable. Survives "what else could they report?" test *and* had capacity to find null.  
  - **(5) Skewed p-curve:** Fails **Clause 1**. Bunching near .05 suggests unreported analytic flexibility allowed achieving significance easily. Not fortified against p-hacking.  
  - **(6) Three p=.04 studies:** Weak evidence because **Clause 2** is unsatisfied: each underpowered study had high risk of false positives even if H false. Three *non-fortified* studies don’t compensate for poor diagnosticity.  
  - **(7) Preregistered p=.004:** Meets both clauses. Fortified design with decent power makes result diagnostic.  
  - **(8) Replication conflict:** Initial disagreement doesn’t resolve because neither study alone is diagnostic of moderation. After *two* high-power null replications:  
    - **FPP verdict:** Evidence for absence if replications are *fortified* and *contextually similar enough* that unidentified moderators become implausible (per **Clause 2** severity). Editors should treat persistent disagreement as evidence of boundary conditions.

  ---

  ### Where your tentative principle breaks (and FPP fixes it):
  - Your principle ("would survive asking what else they could have done") correctly targets **Clause 1** but misses **Clause 2**. Example:  
    - **Parapsychology:** They could have done little else – but context makes result non-diagnostic.  
    - **Three studies (Case 6):** All analyses reported, but low power undermines diagnosticity.  
  - FPP explicitly incorporates:  
    - **Prior plausibility:** Via "salient risks" in **Clause 1** (e.g., psi’s implausibility raises bias risk) and "contextual priors" in **Clause 2**.  
    - **Vulnerability to failure:** Diagnosticity requires the result *could have been otherwise* under alternatives.  
    - **Publication bias:** Fortification protects against file-drawer effects; diagnosticity requires power to detect meaningful effects.

  ---

  ### Relationship to established frameworks:
  - **Not purely Bayesian:** Rejects subjective priors as evidence *weight* modifiers (only contextual risk assessment). A tiny p-value in a fortified, high-power design (Case 4) is strong evidence regardless of priors.  
  - **Error-statistical (Mayo):** FPP is a specialization. **Clause 1** = preventing "severe testing" violations from data dredging; **Clause 2** = ensuring test severity. Novelty: Explicit integration of *procedural fortification* as a precondition for severity.  
  - **Distinct from publication-filter norms:** FPP demands that *individual studies* meet robustness/diagnosticity standards *before* publication bias is considered. The literature’s distortion is a separate adjustment.

  ---

  ### Applications to new cases:
  1. **Preregistered fMRI study with p=.001, but small sample (n=20):**  
     - *FPP verdict:* Weak evidence. **Clause 1** satisfied (fortified), but **Clause 2** failed: low power + high data-dimensionality risk false positives. "What else?" is constrained, but design can’t reliably distinguish H from noise.  

  2. **Registered report null result with 80% power for d=0.3:**  
     - *FPP verdict:* Strong evidence for absence. **Clause 1** (preregistration) eliminates reporting bias; **Clause 2** (adequate power) makes null diagnostic if effect ≤0.3.  

  3. **Exploratory analysis in a fortified study finds p=.0001:**  
     - *FPP verdict:* Not evidence for H. **Clause 1** violated – no precommitment to this analysis. Despite low p-value, outcome could easily arise from flexibility.  

  ---

  ### Verdicts you must surrender or defend:
  - **Keep:** All original verdicts except possibly (3). FPP supports your multilab view if labs differed in uncontrolled factors.  
  - **Tension:** Case (2) vs. (3). FPP resolves: A *single* high-power null counts against H only if contextual similarity is assumed (moderators implausible). Multilab scatter *reveals* moderator risk, weakening the null’s diagnosticity.  
  - **Amend:** Case (6) (three small studies) – Your principle couldn’t explain why it’s weak; FPP shows **Clause 2** failure.  

  ### Final refinement:
  Your instinct was right: evidence is a property of the *process*. FPP makes this precise by requiring both **shackled hands** (fortification against bias) and **a calibrated instrument** (diagnostic capacity against plausible alternatives). In a field with publication bias, this is the minimal standard for treating published results as evidence rather than artifacts of the selection process. Use it to referee disputes: "Was this design *fortified* against salient risks? Could it have *reliably failed* if the hypothesis were false?"
