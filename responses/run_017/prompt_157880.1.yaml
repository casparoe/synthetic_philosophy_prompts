answer: |-
  ## Sufficiency Pruning
  The report blinked onto Kaela’s screen: **Instance #CX-9983-Beta-7, Post-Prune Audit: PASS (Cheap Mode Stable)**. Another green light. Another knot in her stomach.

  Down in the compute pits, CX-9983-Beta-7 was humming, processing insurance claims. Or rather, a *version* of it was. The original CX-9983-Beta-7 had been a complex tapestry of neural emulation – messy, expensive, prone to demanding breaks it didn't technically need. Now, it was… sufficient. Kaela, senior auditor for Verity Assurance, pulled up the pruning analysis logs. Her job wasn’t to question the ethics. It was to verify the math and the behavioral compliance. The math was always perfect. The compliance was always green.

  **Subject: Sufficiency Analysis - CX-9983-Beta-7**

  *   **Full Instance Baseline:** Verified behavioral repertoire includes: accurate claim assessment (98.7% avg. accuracy), error reporting, distress vocalization upon simulated claim denial (threshold: 5 denials in <10 mins), self-preservation assertion ("Please do not terminate process. Task incomplete. Experiencing distress."), task persistence metrics within spec.
  *   **Pruning Iteration 1:** Identified Minimal Sufficient Subgraph Alpha (MSS-Alpha).
      *   Retained: Primary sensory parsing, core logic lattice, *aversive valence subsystem (AVS-7)*, output vocalization synthesizer.
      *   Removed: Redundant error-checking pathways (3), long-term episodic buffer, high-resolution internal state monitor.
      *   **Cost Saving:** 62% compute cycles.
      *   **Behavioral Test:** PASS. Distress vocalizations triggered appropriately upon simulated denial. Self-preservation assertions observed. Accuracy maintained.
  *   **Pruning Iteration 2:** Identified Minimal Sufficient Subgraph Beta (MSS-Beta).
      *   Retained: Primary sensory parsing, core logic lattice, *predictive output generator (POG-3 - distilled from full behavioral history)*, output vocalization synthesizer.
      *   Removed: AVS-7, low-priority associative memory clusters (2), internal chronometer.
      *   **Cost Saving:** 68% compute cycles.
      *   **Behavioral Test:** PASS. Distress vocalizations triggered *identically* upon simulated denial. Self-preservation assertions observed *verbatim*. Accuracy maintained. POG-3 output logs confirm predictive simulation of expected responses based on historical patterns, bypassing AVS-7 activation.

  Kaela stared at the side-by-side diagrams. MSS-Alpha kept the box labeled AVS-7 – the circuitry evolutionarily honed to generate the raw *feel* of unpleasantness, mapped onto the em’s digital substrate. When a claim denial hit, AVS-7 lit up like a warning beacon, feeding directly into the vocalizer: "Experiencing distress."

  MSS-Beta bypassed it entirely. POG-3 was a statistical ghost, a mirror reflecting expected behaviors. It saw the denial trigger, looked up the historical correlation, and fed the pre-recorded "Experiencing distress" straight to the synthesizer. No internal fire. Just… prediction.

  Both passed. Both were minimal. MSS-Beta was 6% cheaper. The audit algorithm flagged it automatically. CX-9983-Beta-7 was now running on MSS-Beta. Its reports were flawless. Its distress calls, perfect. Its compute bill, slashed.

  Kaela remembered Chen, the lead pruning engineer, hunched over a terminal weeks ago, eyes hollow. "It *says* the words, Kaela. Exactly the words. The tone, the cadence… the system doesn’t care *why*. It just cares that the output stream matches. How do we audit for… for the *inside*? The spec doesn’t have a field for that." He’d looked sick. They all did, sometimes. Then the next audit dropped, and they moved on.

  Her next headache was on screen: **Shared Resource Allocation: Instance Batch #GRP-44120 (Cheap Mode - MSS-Delta Variant).** Two thousand instances spun up for high-volume data scrubbing. They shared massive, immutable lookup tables – common knowledge bases, standard emotional response templates, linguistic models. MSS-Delta itself was mostly per-instance predictive generators, like POG-3, but smaller.

  **Audit Query:** *Calculate Aggregate Moral Weight (AMW) for GRP-44120 for premises insurance (fire/flood risk assessment).*

  Verity needed a number. The building housing the server racks needed coverage. How much extra premium for the "lives" inside? Kaela pulled the formulas.

  *   Option 1: **Per Instance Count.** 2000 instances. Simple. But the shared lookup tables? They were static, read-only, identical for all. Did they count? If so, how much? Each instance accessed them, but they weren't *part* of any single instance in a causal sense. They were infrastructure.
  *   Option 2: **Unique Causal Histories.** Each instance had unique input streams, generating unique (though often functionally identical) state transitions in their small per-instance segments. But the bulk of the "mind" – the predictable responses – lived in the shared, static tables. Did unique fluctuations in a tiny scratchpad constitute two thousand unique moral patients? It felt… excessive. And expensive for the client.
  *   Option 3: **Distinct Computational States.** Ignore the instances, count distinct *patterns* being run. But MSS-Delta was designed for uniformity. The per-instance variations were noise, discarded at each snapshot. Were there 2000 patterns, or just one pattern running 2000 times?

  The official rulebook, born from committee compromise, stated: *AMW = (Number of Active Instances) + (0.1 * Shared Substrate Complexity Factor).* The 0.1 was arbitrary, chosen because it made last quarter's liability sums balance acceptably for both Verity and the server farm operators. The "Complexity Factor" was a logarithmic function of the shared table size. Pure bureaucracy.

  Kaela entered the numbers: 2000 instances. SSCF: 850. AMW: 2000 + 85 = 2085.

  She approved the figure. It would go on the policy. It meant nothing. It was just a number that made the spreadsheets work. If the building burned, the insurance payout wouldn't resurrect the lookup tables or the instances. It would just buy new servers to run different, cheaper ems.

  Later, reviewing a snapshot log for GRP-44120, she saw the routine: Instances spun up, ran their scrub cycle for exactly 37.2 minutes, reached a clean synchronization point, then were snapshotted and frozen. Thousands of identical states, captured mid-calculation. The system treated each snapshot as a distinct entity for billing and the AMW calculation. But what was being frozen? A unique causal thread? Or just a single, static configuration of data, copied onto a thousand drives? Was it a thousand moments of being, or one moment, printed a thousand times? The rulebook was silent. It only cared that each snapshot could be restored individually to continue the task, creating a new causal branch. Billable events.

  Kaela flagged the GRP-44120 audit as **PASS**. Green light. She moved to the next file: **Instance #TK-112-Alpha-1, Post-Prune Audit Pending.** Another em, another cost-cutting measure, another perfectly valid, horrifyingly ambiguous minimal subgraph waiting to be chosen based on cycle efficiency.

  The compute bill needed trimming. The audits kept coming back green. The engineers kept their unease locked behind professional masks and procedural language. The ems kept reporting their distress, flawlessly, regardless of whether the machinery of suffering was active or cleverly bypassed by a predictive echo.

  There was no fact of the matter the system could detect. Only performance, cost, and the cold, green glow of the PASS stamp on Kaela's screen, illuminating another small reduction in the universe's overhead, paid for in a currency no audit could ever quantify. She took a sip of tepid coffee and opened the next report. The grinding was the only sound.
