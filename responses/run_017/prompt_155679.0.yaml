prompt: |-
  I volunteer with a small grantmaking group that funds speculative long-termist projects, and after two funding rounds I've noticed that my gut reactions to cases are badly out of joint with each other. I'd like to know whether there is a single principle behind them, or whether I simply have to give some up. Here is where I land:

  (a) An engineering project whose risk model I broadly trust puts it at roughly a one-in-a-million chance of averting a catastrophe that would kill everyone alive today; the cost to us is about $200,000. I fund it without much hesitation.

  (b) Same shape, much larger numbers: a proposal our physicist member estimates at a one-in-a-trillion chance of preserving a civilization of 10^30 people. The expected value dwarfs (a), and I want to say no.

  (c) The mugging case: a stranger emails us saying that $200,000 will let him, by means he won't specify, save 10^100 lives. I refuse instantly. What troubles me is that I feel roughly the same reluctance in (b) and (c), even though in (b) I accept the number and in (c) I don't believe it at all — so my resistance in (b) can't be the usual move of dismissing the probability estimate, which is how people normally get out of this.

  (d) Bundling: ten thousand independent projects, each with a one-in-ten-thousand chance of a very large good, each cheap. I would happily fund the whole portfolio, and yet asked about any single one of them — including the marginal one, dropping which lowers the portfolio's chance of success by one part in ten thousand — I want to say no. Is that straightforwardly incoherent, or could a defensible principle be irreducibly about portfolios rather than about individual acts?

  (e) Uncertain magnitude: a project with a one-in-a-billion chance of a good whose size we can't pin down — our best guess is that every order of magnitude between 10^10 and 10^50 lives is equally likely. The expected value here is far above (b), and I recoil more than I do in (b). Something in me penalizes not knowing how big the payoff is, over and above the effect that uncertainty has on the expectation.

  (f) Harms: a one-in-a-million chance of causing 10^20 units of suffering. I feel far more strongly that we must avoid this than that we must pursue the mirror-image good. A friend says this is just loss aversion and that I should drop it; I can't tell whether she's right.

  (g) Costless: a button that genuinely costs us nothing, with a one-in-a-trillion chance of a 10^30-person payoff. Here I flip and press it, and I notice I would press it even if the chance were far smaller. That makes me suspect my reluctance in (b) was entirely about what else the money could do, and hence that I don't really have a problem with fanaticism at all — but that conclusion feels too cheap, and it sits badly with (c), where the money matters and I refuse anyway.

  My tentative principle, such as it is: I seem to deflate stated probabilities by a factor that grows with the size of the claimed payoff, roughly as if the effective probability were the stated one divided by the logarithm of the payoff. That keeps (a) and gets (b) and (e) right. But someone in the group pointed out that it doesn't do the work I wanted, since the product still grows without bound as the payoff does: I would remain committed to chasing a one-in-a-googol chance of a good that is large enough, which is exactly what I was trying to avoid.

  So: can you give me one principle, or failing that a short list of candidates, that captures as much of this pattern as possible? For each, please say which clause is forced by which of my verdicts, what it predicts about a case I keep going back and forth on — whether I should buy a thousand, or a billion, independent tickets of the (b) type, given that my bundling instinct in (d) pulls me toward yes while my verdict in (b) pulls toward no — and which of my verdicts it cannot accommodate. If some verdicts have to go, I would rather be told plainly which are the weakest and why than have all seven preserved by a principle with a separate bolted-on exception for each.
reasoning: |-
  Hmm, this is a fascinating and complex ethical puzzle. The user is grappling with deep inconsistencies in their intuitive responses to various long-termist funding scenarios, and wants to understand whether there's a unifying principle behind their judgments or if some intuitions need to be abandoned.

  Let me unpack their cases first. In (a) they fund a low-probability high-impact project when numbers are "human-scale" (1 in 1M chance to save 8B lives). But in (b) with astronomical numbers (1 in 1T chance for 10^30 lives), they refuse despite higher expected value. The mugging case (c) shows this isn't just about disbelieving probabilities - they trust the physicist in (b) but still refuse. 

  The bundling paradox (d) reveals a tension: they'd fund 10K projects each with 1/10K chance of big impact, but wouldn't fund any single one. This suggests their intuition isn't just about individual expected value calculations. Case (e) shows they're especially uncomfortable when the magnitude is uncertain (even when expected value is huge), and (f) reveals strong asymmetry between preventing harms versus pursuing equivalent goods. 

  Crucially, (g) shows they'd accept costless interventions with tiny probabilities, suggesting their reluctance in (b) is partly about opportunity cost. But this doesn't explain their resistance to (c) where money is involved but they disbelieve the claim.

  Their proposed logarithmic probability dampening doesn't fully solve the problem since expected value still diverges. I need to find principles that explain as many of these intuitions as possible without being ad hoc. 

  The strongest candidates seem to be:
  1) Epistemic humility - scaling down confidence in probability estimates as stakes increase
  2) Robustness requirements - preferring interventions that work across multiple plausible models
  3) Asymmetry between harm prevention and good promotion
  4) Portfolio thinking as fundamentally different from isolated acts

  For the bundling question (d vs b), portfolio theory provides a clean answer: individual projects might not clear the cost-benefit threshold alone, but together they create a valuable risk-pooling effect. This fits their willingness to fund the bundle but not marginal projects. 

  The cases that resist easy reconciliation are (c) and (e). For (c), even with trust, the sheer scale might trigger epistemic caution. For (e), magnitude uncertainty might compound with probability uncertainty. 

  If forced to discard intuitions, (b) and (g)'s tension might need resolution - either accept fanaticism in costless cases or reject it consistently. The harm asymmetry in (f) seems deeply held and can be defended philosophically.

  This requires balancing normative principles with psychological realism. The user seems philosophically sophisticated so I'll avoid oversimplifying while providing concrete guidance about which intuitions might be worth keeping.
answer: |-
  Based on your detailed pattern of intuitions, no single standard principle (like pure expected utility maximization) captures everything. However, a **combination of two core principles** – **Epistemically Weighted Expected Value (EWEV)** and **Asymmetric Harm Avoidance (AHA)** – explains most cases. A third principle, **Portfolio Primacy**, handles the bundling case. Below is the breakdown, including which verdicts justify each principle, unresolved tensions, and which intuitions might need refinement.

  ---

  ### **Core Principles**
  1. **Epistemically Weighted Expected Value (EWEV)**  
     *Effective Expected Value = [Stated Probability] × [Payoff Magnitude] / f(Payoff Magnitude)*  
     Where **f(x) is a "skepticism factor"** that scales with the *logarithm* or *sublinear function* of the payoff magnitude. This formalizes your instinct to "deflate" probabilities for large payoffs.  
     - **Justified by**: (b), (c), (e), (g).  
     - **Mechanism**: As the claimed payoff grows, your trust in the *accuracy* of the probability estimate decreases, even if you don't dismiss it entirely. The function `f(x) = k log(x)` (or similar) ensures that for astronomically large payoffs, the effective probability shrinks faster than the payoff grows, preventing fanaticism.  
       - *(b) vs. (g)*: In (b), the cost ($200k) forces comparison to alternatives. In (g), zero cost means *any* positive EWEV justifies action.  
       - *(c)*: The stranger’s claim has such extreme `f(x)` that EWEV ≈ 0.  
       - *(e)*: Uncertainty about magnitude *increases* `f(x)` further, amplifying skepticism.

  2. **Asymmetric Harm Avoidance (AHA)**  
     *Avoiding harms is prioritized over achieving equivalent goods. Risks of large-scale suffering are discounted less (or penalized more) than equivalent benefits.*  
     - **Justified by**: (f).  
     - **Mechanism**: Loss aversion isn't irrational here; catastrophic harms might be irreversible or violate deontological constraints. This asymmetry explains why the "mirror image" of (a) feels unacceptable.

  3. **Portfolio Primacy (PP)**  
     *Decisions must consider the portfolio context. Isolated projects can be rejected even if they contribute positively to a valuable bundle.*  
     - **Justified by**: (d).  
     - **Mechanism**: Funding isolated tiny-probability projects invites exploitation or misallocation, but a pre-committed bundle of *independent* projects ensures diversification. The marginal project only makes sense in the bundle.

  ---

  ### **How the Principles Resolve Your Cases**
  | Case | Principle Applied | Resolution |
  |------|-------------------|------------|
  | **(a)** | EWEV | Payoff (~8B lives) is large but `f(x)` is moderate (log(10^10) ≈ 23). EWEV remains high. |
  | **(b)** | EWEV | Massive payoff (10^30) → large `f(x)` (e.g., log(10^30) ≈ 69). EWEV shrinks below cost threshold. |
  | **(c)** | EWEV | Extreme payoff (10^100) → enormous `f(x)` (log(10^100) ≈ 230). Effective probability near zero. |
  | **(d)** | PP | Bundling 10k projects creates a ~63% success chance. Portfolio-level value outweighs individual skepticism. |
  | **(e)** | EWEV | Uncertainty inflates `f(x)` further. EWEV lower than (b) despite similar EV. |
  | **(f)** | AHA | Harm avoidance dominates; suffering is not symmetric with benefit. |
  | **(g)** | EWEV | Zero cost → any positive EWEV justifies action. `f(x)` doesn’t kill the tiny expected value. |

  ---

  ### **Unresolved Tensions & Weakest Intuitions**
  1. **The Bundling Dilemma (Your Key Question)**  
     - *Portfolio of (b)-type projects*:  
       - **1,000 tickets**: PP likely says **yes**. Bundling reduces variance, and fixed costs spread thin.  
       - **1,000,000,000 tickets**: EWEV may say **no**. If `f(x)` scales sufficiently, EWEV per dollar could still be low, and massive bundling might drain funds from robust opportunities.  
     - **Verdict**: Fund small bundles (≤10k projects) if independent and pre-vetted. Reject enormous bundles or marginal additions. PP overrides individual EWEV only for *modest-sized* portfolios.

  2. **Weakest Intuition: (b) vs. (g)**  
     - Your flip in (g) suggests (b)’s reluctance *is* mostly about opportunity cost. But (c) shows EWEV applies even with costs. **This tension is acceptable**: EWEV allows tiny probabilities to matter when costs are zero but discounts them sharply when resources are scarce.  
     - **Refinement Needed**: Accept that (b) and (g) are consistent. Resistance in (b) is rational resource allocation, not inconsistency.

  3. **Weakest Intuition: (e)**  
     Magnitude uncertainty *should* increase `f(x)`, but your strong recoil might overpenalize. If every order of magnitude is equally likely, the *expected log-value* is finite and manageable. **Consider softening this verdict**.

  ---

  ### **What Must Be Rejected?**
  - **Pure Expected Value Maximization**: Directly contradicts (b), (c), (e), (f).  
  - **Naive Probability Dampening**: Your initial log-dampening fails if it doesn’t bound EWEV. With `f(x) = log(x)`, EWEV → ∞ as x → ∞. To avoid fanaticism, you need `f(x)` growing faster than log(x) (e.g., `f(x) = x^ε` for tiny ε).  
  - **Symmetry in Harms/Goods**: (f) shows this is deeply felt and defensible. Keep it.

  ---

  ### **Candidate Principles Summary**
  | Principle | Captures Verdicts | Weakness |
  |-----------|-------------------|----------|
  | **EWEV** | (a), (b), (c), (e), (g) | Requires arbitrary `f(x)`; tension with (d) |
  | **AHA** | (f) | Independent of other cases |
  | **PP** | (d) | Only applies to portfolio decisions |

  **Synthesis**: Use EWEV + AHA for individual decisions, and PP for bundles. This system:  
  - Avoids Pascalian fanaticism (solves b, c, e).  
  - Explains portfolio effects (d).  
  - Justifies harm asymmetry (f).  
  - Aligns with cost-sensitive reasoning (a, g).  

  **Final Advice**: Keep all intuitions except strict symmetry in (f). For (e), accept uncertainty penalties but calibrate `f(x)` to avoid overcorrection. For bundling, fund small pre-committed portfolios but reject marginal additions or vast bundles. Your pattern is coherent if you embrace **bounded epistemic humility** (EWEV) and **portfolio thinking** (PP).
