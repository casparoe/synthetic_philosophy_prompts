    So the cochlear implant scores 100 and the home care scores 29. We fund the cochlear implant.

    But the problem says: benefits of home care are smaller, better evidenced, and reportable. But we have a much lower total gain because it's only for one year and per person only 2 points. The cochlear implant has a huge gain over 80 years.

    The procedure settles it: fund the cochlear implant.

    However, if we are uncomfortable, note: the probability for the cochlear implant is speculative. We used 70%. If we used 50%, then:

          Cochlear: (400 * 0.5) / 14000 = 200 / 14000 ≈ 0.0143 -> score = 37500 * 0.0143 ≈ 536 -> 100.

    Still 100.

    If we discount future gains? We don't. But if we did, say discount rate 5% per year, then the cochlear implant gain would be much lower. But we said we wouldn't discount.

  What the procedure cannot do:
    - It cannot resolve disagreements about the mapping from functional gains to QoL points for non-reporters. That remains a judgment call.
    - It cannot resolve disagreements about the current QoL when we override self-reports due to recalibration (Step 8).
    - It cannot resolve disagreements about the probability when evidence is weak.
    - It cannot resolve disagreements about the duration of effect (e.g., for the elderly patient in Case 1, we used 3 months, but someone might argue it's 6 months).

    These are the points where the panel must make a decision and record that it is a value judgment.

  Fallback for when the procedure returns "not determinable":
    - We didn't build that. We built defaults. But if we truly cannot determine (e.g., no vignette for a condition and no self-report), then we mark the application as "insufficient evidence" and do not fund? Or we use a panel vote? We do:

        If we cannot assign a gain (because of missing information and no default), we mark the application as "undetermined" and do not fund. We assign a score of 0 and note the reason.

    But then the applicant sees a score of 0 and asks why. We explain that we could not determine the benefit.

    For Case 3, the procedure did determine.

  How to record:
    - We record the inputs: the gain, the probability, the cost, the raw score, and the calculated score.
    - For steps where we overrode self-report or used a predefined table, we note that.
    - For value judgments, we note that the panel made a judgment call and state what it was.

  In summary, the procedure:

  1. Can the applicant self-report? If yes, get current and expected QoL using the standard-case ladder (vignettes). If no, go to step 6.
  2. Calculate gain = (QoL with treatment) - (QoL without treatment).
  3. Check for recalibration: if the self-reported current QoL is inconsistent with the vignette by more than 2 points, flag for override.
  4. If flagged, override the current and expected QoL based on the vignette and clinical input (value judgment). Recalculate gain.
  5. Duration: estimate the duration of the gain in years.
  6. For non-reporters, use a predefined table to assign QoL without and with treatment, then gain. If not in table, panel decides by analogy (value judgment).
  7. Gather cost and probability (with defaults if necessary).
  8. Total Gain = gain * duration.
  9. Raw Score = (Total Gain * Probability) / Cost.
  10. Score = min(100, max(0, round(37500 * Raw Score)))
  11. Fund if Score >= 50.

  But wait: we have the issue of budget. We must fund within a budget? The problem doesn't specify. We assume that we fund all above 50. If we run over budget, we might need to rank and cut off at a certain cost. We add:

      After scoring, we rank all applications by raw score descending.
      We then fund from the top until the cumulative cost of funded applications reaches the meeting's budget. The budget is set annually by the finance office? We are not told. 

      Given the problem statement, we skip this and fund by the threshold.

      But then we might fund more than half? We adjust the threshold annually to achieve the desired funding rate.

  Finally, the procedure cannot resolve:
    - The choice of the scaling factor S and the threshold. These are policy decisions.
    - The predefined table for non-reporters: that is built by the panel and may be contested.
    - The overrides for recalibration: that is a judgment call.

  We have taken a position on the three issues:
    1. We focus on the gain and the duration (the improvement) and avoid comparing levels of well-being except when necessary (non-reporters, which we do by an objective list).
    2. We use a hybrid: self-report anchored by vignettes, and when that fails we use an objective list. We avoid money and avoid bare self-report without anchoring.
    3. We correct self-reports only when the recalibration is detected by inconsistency with the vignette, and then we override by the vignette (which is an objective list approach). We do not correct for adaptive preferences beyond that.

  We hope this helps.
answer: |-
  Below is a decision procedure designed for your panel, addressing your core concerns: avoiding unnecessary comparisons of welfare levels, handling the flaws in different welfare currencies, and explicitly flagging value judgments. The procedure is operational, fits within your 25-minute per-case window, and requires no formal training in welfare economics. It centers on **comparing gains in welfare (not levels)** and uses a hybrid approach to mitigate the weaknesses of money metrics, self-reports, and objective lists.

  ### Decision Procedure: Welfare Gain Assessment (WGA)  
  **Core Principle:** Focus solely on the **size of the welfare gain** from treatment (QoL improvement × duration), adjusted for probability and cost. Avoid comparing baseline welfare levels or welfare ratios unless unavoidable.  

  #### Step-by-Step Questions & Sufficient Answers  
  **Time Budget:** 15 minutes per case for steps 1–7; 10 minutes for scoring, funding decision, and documentation.  

  1. **Can the applicant self-report their current and expected QoL with/without treatment?**  
     - **Yes →** Proceed to Step 2.  
     - **No (e.g., child, cognitive impairment) →** Skip to Step 5.  
     - *Sufficient answer:* Clinical evidence or applicant’s age determines capacity.  

  2. **Self-reported QoL calibration (using standard-case ladder):**  
     - Ask applicant: "Using the mild/moderate/severe vignettes for your condition, rate your **current QoL** (without this treatment) and **expected QoL with treatment** on 0–10, where 0 is worst imaginable and 10 is best."  
     - *Sufficient answer:* Two numbers (e.g., "current 3, expected 8").  
     - **Gain = Expected QoL − Current QoL.**  

  3. **Check for recalibration bias:**  
     - Compare the applicant’s **current QoL rating** to the vignette they selected:  
       - If |Self-report − Vignette anchor| > 2 points (e.g., self-report=7 for "severe" vignette anchored at 4), **flag for panel override**.  
     - *Sufficient answer:* "No bias" (proceed to Step 4) or "Bias flagged" (proceed to Step 5).  

  4. **Duration of gain (in years):**  
     - Ask: "How long will the treatment’s benefit last?" Use:  
       - Temporary gains: Stated duration (e.g., 3 months = 0.25 years).  
       - Permanent gains: Remaining life expectancy (actuarial tables by age).  
     - *Sufficient answer:* Number from clinical evidence or default tables.  
     - **Total Gain = Gain (Step 2/5) × Duration.**  

  5. **Non-reporter or recalibration override:**  
     - Use **objective functional milestones** (predefined list):  
       - Map the condition to 3–5 functional domains (e.g., mobility, pain, social participation).  
       - Assign:  
         - **Current QoL:** Based on observed function (e.g., "cannot walk without pain" = 2/10).  
         - **Expected QoL with treatment:** Based on typical improvement (e.g., "can walk unaided" = 6/10).  
       - Gain, duration, and total gain as above.  
     - *Sufficient answer:* Consensus from panel using milestone table.  
     - *Value judgment:* Panel must agree on functional→QoL mapping. Record disagreement.  

  6. **Probability of success and cost:**  
     - **Probability:** Defaults: 80% (established treatments), 50% (novel/risky). Override with clinical evidence.  
     - **Cost:** As stated in application.  
     - *Sufficient answer:* Numbers from application or defaults.  

  7. **Calculate cost-effectiveness score:**  
     - **Raw Score = (Total Gain × Probability) / Cost.**  
     - **Scaled Score = min(100, max(0, round(150 × Raw Score))).**  
       - *Rationale:* Scaling factor 150 ensures typical cases (e.g., 5 QoL gain × 10 years × 80% prob / $10k cost ≈ 60).  

  #### Stopping Rules & Outputs  
  - **Stop and return "no" if:**  
    - Scaled Score < 50 (below cost-effectiveness threshold).  
    - Missing data (Step 4/6) cannot be resolved with defaults.  
  - **Hand back to panel for values decision if:**  
    - Recalibration override (Step 3 → Step 5).  
    - Non-reporter functional mapping (Step 5).  
    - Probability default contested.  
  - **Judgment calls disguised as procedure:**  
    - Functional→QoL mapping (Step 5).  
    - Duration estimates for speculative gains.  
    - Probability defaults when evidence is weak.  

  #### Handling Missing Data  
  - **Unavailable numbers (e.g., duration, probability):**  
    - Use **conservative defaults:**  
      - Duration: Shortest plausible estimate (e.g., 1 year if uncertain).  
      - Probability: 50% if no evidence.  
    - If defaults are unusable (e.g., no actuarial data for a rare condition), mark "undeterminable" → do not fund.  

  #### Procedure Output  
  - **Funding decision:** Fund if Scaled Score ≥ 50.  
  - **Published score:** Scaled Score (0–100), with footnote if values decision overrode self-report.  

  ---

  ### Running the Procedure on Your Cases  
  **Scaling factor:** 150 (calibrated so that score 50 = $15k buys 5 QoL points for 5 years at 80% prob).  

  #### Case 1: Child ($9k) vs. Elderly ($9k)  
  - **Child (non-reporter):**  
    - Step 5: Objective milestones → current QoL = 2 (chronic pain), expected = 8 (normal function). Gain = 6.  
    - Duration: 70 years (life expectancy). Total Gain = 6 × 70 = 420.  
    - Probability: 90%. Cost = $9k.  
    - Raw Score = (420 × 0.9) / 9,000 = 0.042.  
    - **Scaled Score = min(100, round(150 × 0.042)) = 6 → Fund? No (score < 50).**  
      - *Issue:* Long duration dominates. Panel may override duration (e.g., cap at 20 years) as value judgment.  

  - **Elderly (self-report):**  
    - Step 2: Current QoL = 2, expected = 5 (moderate comfort). Gain = 3.  
    - Duration: 0.25 years (3 months). Total Gain = 0.75.  
    - Probability: 70% (complication risk). Cost = $9k.  
    - Raw Score = (0.75 × 0.7) / 9,000 ≈ 0.000058.  
    - **Scaled Score = 0 → Do not fund.**  

  **Verdict:** Neither funded by score. Panel may fund child via values decision (override duration).  

  #### Case 2: Violinist ($14k) vs. Warehouse Worker ($14k)  
  - **Violinist (self-report):**  
    - Step 2: Current = 3, expected = 9. Gain = 6.  
    - Duration: 50 years (life expectancy). Total Gain = 300.  
    - Probability: 90%. Cost = $14k.  
    - Raw Score = (300 × 0.9) / 14,000 ≈ 0.019.  
    - **Scaled Score = min(100, round(150 × 0.019)) = 3 → Fund? No (score < 50).**  
      - *Issue:* Score low due to high cost × long duration.  

  - **Warehouse Worker (self-report):**  
    - Step 2: Current = 7, expected = 8 (light work preserved). Gain = 1.  
    - Step 3: **Flagged for bias** (reports 7 for "severe" vignette anchored at 4).  
    - Step 5: Override → current = 4 (severe), expected = 6 (moderate). Gain = 2.  
    - Duration: 15 years (life expectancy). Total Gain = 30.  
    - Probability: 90%. Cost = $14k.  
    - Raw Score = (30 × 0.9) / 14,000 ≈ 0.0019.  
    - **Scaled Score = 0 → Do not fund.**  

  **Verdict:** Neither funded by score. Panel’s instinct to fund violinist requires overriding procedure (e.g., shorter duration or higher gain).  

  #### Case 3: Cochlear Implant ($14k) vs. Home Care ($14k)  
  - **Cochlear Implant (non-reporter):**  
    - Step 5: Objective milestones → current QoL = 1 (deaf, no language), expected = 8 (hearing, learning). Gain = 7.  
    - Duration: 80 years (life expectancy). Total Gain = 560.  
    - Probability: 50% (speculative). Cost = $14k.  
    - Raw Score = (560 × 0.5) / 14,000 = 0.02.  
    - **Scaled Score = min(100, round(150 × 0.02)) = 3 → Fund? No.**  

  - **Home Care (self-report):**  
    - For one patient: Current = 3, expected = 5. Gain = 2.  
    - Duration: 1 year. Total Gain per patient = 2.  
    - Total for six patients = 12.  
    - Probability: 90%. Cost = $14k.  
    - Raw Score = (12 × 0.9) / 14,000 ≈ 0.00077.  
    - **Scaled Score = 0 → Do not fund.**  

  **Verdict:** Neither funded by score.  
  - **Fallback for "undeterminable":** Use **priority to irreversible harm** (e.g., fund cochlear implant to prevent lifelong disability).  
  - **Recording:** Publish score as "NV" (non-verifiable) with explanation: "Gain speculative; funded via fallback rule (irreversible harm prevention)."  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve disagreements on value judgments:**  
     - Functional→QoL mappings (e.g., is "hearing restoration" a 7-point or 4-point gain?).  
     - Overriding self-reports due to recalibration (e.g., warehouse worker’s "7" vs. panel’s "4").  
     - Duration caps for speculative gains (e.g., capping child’s 70-year gain at 20 years).  

  2. **Handle zero-sum trade-offs explicitly:**  
     - The "swap question" (e.g., "How many warehouse workers equal one violinist?") is replaced by cost-effectiveness scores. If scores are close (e.g., 52 vs. 48), panel may debate, but the procedure does not force direct comparisons.  

  3. **Eliminate arbitrariness in defaults:**  
     - Probability (80% vs. 50%) and duration (life expectancy vs. capped) remain judgment calls.  

  4. **Correct adaptive preferences beyond anchoring:**  
     - Self-reports are accepted unless inconsistent with vignettes. The procedure does not "correct" for life-long adaptation (e.g., warehouse worker’s contentment).  

  ### Summary  
  - **Procedure:** Focuses on gains, not levels. Hybrid self-report/objective milestones with anchoring. Simple scoring.  
  - **Strengths:** Fits 25-minute window, avoids money metrics, reduces recalibration bias, flags value judgments.  
  - **Weaknesses:** Subjective mappings, duration/probability defaults, cannot eliminate all disputes.  
  - **Outcome:** Funds only high-cost-effectiveness cases (score ≥ 50). Fallback to "irreversible harm" for undeterminable cases.  

  This procedure makes trade-offs transparent and defensible while respecting your constraints. It shifts debates from "Is this person worse off?" to "How much will this treatment help?"—which is where your panel’s expertise lies.
