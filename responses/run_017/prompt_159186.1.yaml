answer: |-
  ### Case: Warehouse Quality Control
  In a warehouse audit, the manager knows the inventory contains exactly 10,000 widgets and 1,000 gadgets (non-widgets), and past audits indicate precisely 100 defective items exist in total. The hypothesis \( H \) is "All widgets are functional" (logically equivalent to "All non-functional items are gadgets" by contraposition). To test \( H \), the manager randomly selects one item from the entire inventory (11,000 items) using a barcode system that ensures uniform sampling. Nicod's criterion implies that observing a functional widget confirms \( H \), while Hempel's equivalence demands that observing a defective gadget (a non-widget non-functional) must also confirm \( H \).  

  - **Observation A (functional widget):** Under \( H \), all 10,000 widgets are functional, so \( P(\text{A}|H) = 10,000/11,000 \approx 0.909 \). Under \( \neg H \) (at least one widget is defective), the expected defective widgets \( E[D] = 10,000 \times (100 / 11,000) \approx 90.91 \) (since defectives distribute randomly), so functional widgets ≈ \( 10,000 - 90.91 = 9,090.91 \), and \( P(\text{A}|\neg H) \approx 9,090.91 / 11,000 \approx 0.826 \). The likelihood ratio \( \lambda_A = P(\text{A}|H) / P(\text{A}|\neg H) \approx 0.909 / 0.826 \approx 1.10 \).  
  - **Observation B (defective gadget):** Under \( H \), all 100 defectives are gadgets, so \( P(\text{B}|H) = 100 / 11,000 \approx 0.00909 \). Under \( \neg H \), expected defective gadgets \( \approx 100 - 90.91 = 9.09 \) (since defectives in gadgets decrease if widgets are defective), so \( P(\text{B}|\neg H) \approx 9.09 / 11,000 \approx 0.000826 \). The likelihood ratio \( \lambda_B = P(\text{B}|H) / P(\text{B}|\neg H) \approx 0.00909 / 0.000826 \approx 11.0 \).  

  Since \( \lambda_B \gg \lambda_A \), observing a defective gadget confirms \( H \) more strongly than a functional widget. The sampling escapes the "tacit background knowledge" pitfall because the pool includes widgets and gadgets, so a defective widget *could* have been found (but wasn’t).  

  ### Structural Feature and Sensitivity
  The reversal hinges on the **small size of the complementary class (gadgets: 1,000) relative to the total defectives (100)**. Gadgets are scarce, so under \( \neg H \), defectives concentrate in widgets (90.91 expected), making a defective gadget rare under \( \neg H \) but likely under \( H \). If restored to ordinary abundance (e.g., 10 widgets, 10,000 gadgets, 100 defectives), \( \lambda_A \approx 10/9.9 \approx 1.01 \) and \( \lambda_B \approx 100/99.9 \approx 1.001 \), reversing the advantage to \( A \).  

  ### Attack and Rebuttal
  A critic denying non-black non-ravens ever confirm might argue: "Background knowledge implies gadgets *can* be defective, so a defective gadget is irrelevant to widgets." This attack fails because the manager’s knowledge of *fixed total defectives* (100) logically ties the classes together: a defective gadget reduces the "slack" for widget defects, making \( H \) more probable. Rejecting this ignores the explicit premise of constrained defectives, which is empirically grounded in past audits. Without this premise (e.g., if defectives were unbounded), the criticism would hold, but here the context establishes its relevance.
