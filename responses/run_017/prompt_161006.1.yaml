  The 1845-52 Irish famine fits - population had doubled since 1750 on potato monoculture, then blight hit. But that's pre-industrial. For modern examples... Bangladesh 1974 famine? Post-Green Revolution but still Malthusian dynamics with monsoon failure hitting dense population. 

  Bigger point: fossil fuels aren't just an ad hoc explanation. Malthus himself wrote before coal/steam transformed energy capture. The 20th century population explosion (3.7B to 7.6B 1970-2020) coincides exactly with oil boom and Haber-Bosch scaling. That's not curve-fitting - it's identifying the input that changed the equation. 

  *checks user's tone* 
