prompt: |-
  I chair the heritage advisory committee of a town of roughly nine thousand people. Among other things we maintain about forty public markers and plaques, one permanent exhibit, and a short booklet used in the local schools. Around a dozen times a year we are asked to adjudicate a conflict of a specific kind: a community — a family, a neighbourhood, a nearby nation whose oral history touches our sites — remembers something about a person, event, or place, and the documentary record we can actually lay hands on either contradicts it, or is silent, or says something compatible in outline but different in point, attribution, or intent. We are seven volunteers, we meet for two hours a month, none of us is a professional historian, and every decision has to be written down on one page.

  The friction is structural. The state heritage office, which has to approve any marker, will not let us assert as fact anything the surviving record contradicts; it will accept almost anything phrased as attribution. The communities whose memory is in question tend to experience that same phrasing — remembered by, according to tradition, oral history holds — as one more iteration of being disbelieved by people who hold the paper. So hedging is not a neutral fallback for us; it has a history, and sometimes the thing actually remembered is that history. I want a procedure, not a position statement on whether memory or history should give way, because I have to do this repeatedly and I would rather be consistently wrong in a way I can explain than right by instinct.

  What I need from you is a decision procedure my committee can run on a proposal in under forty minutes: the questions in order, what would count as a sufficient answer to each, the point at which the procedure stops with a no, and — importantly — the points at which it stops and hands the decision to a person because the remaining question is one of values rather than evidence. The output of the procedure should be three things: what the marker may assert outright, what it may present only with its source attached (remembered by, recorded as), what it must omit; a single sentence of rationale; and a flag for the cases that have to go to a public meeting rather than to us.

  Three things I want built into it, and I want you to say if you think any of them is a prejudice rather than a requirement.

  First, I think there are three registers of conflict, not one: the record is silent where memory speaks; the record and memory make incompatible claims about the same event; and the two agree on what happened but disagree about who did it or why. There is, I think, a fourth that does not fit anywhere — cases where what the community remembers is not the event but the record's own bad faith about the event, and where the archive has in fact been shown on some other occasion to have been falsified or selectively kept. Tell me whether that fourth is genuinely distinct and what it does to the procedure when it is present.

  Second, I do not think the two directions of giving way are symmetric in cost, even when they are symmetric in evidence. A correction entered in a catalogue is cheap, durable, and read by almost nobody; a correction to what a community says in public is expensive, partial, and may not survive the people who hear it. Should the procedure weigh that asymmetry, or is that a corruption of it — the point at which a committee stops asking what is true and starts managing a constituency? This is the part I expect to be hardest to settle, and I would rather have the tension stated than resolved with a slogan.

  Third, we have a standing rule, inherited and never argued for, that we will not substitute a documented name for a remembered one on a marker even when we are confident the documented name is right — we will add, annotate, or put the two side by side, but not replace. I want to know whether that rule is defensible in principle or whether we are just being superstitious, and if it is defensible, where exactly it stops: does it cover dates, numbers of dead, intent attributions?

  Then run the procedure on three proposals, showing your work at each step.

  One: a founding plaque from the 1920s credits the town's establishment to a named settler in a named year. A neighbouring nation's oral history holds that the site was a seasonal gathering place used before and after that date; a single land-office map from two years after the recorded founding shows two structures already standing where the plaque says the settler built. Nothing in the record mentions the gathering place at all.

  Two: a factory fire. The community has always said fourteen workers died; the coroner's register lists nine, and names nine. Oral accounts name the other five, describe them as itinerant workers hired off the books, and say their deaths were never recorded because the company's payroll burned with them. No payroll survives.

  Three: a neighbourhood remembers that flood relief in the early 1960s was deliberately withheld from it, and says so on an unofficial marker it erected and maintains itself. The relief files show a delay of eleven days, an administrative misrouting, and no documentary trace of an intention to withhold from anybody. The same archives were shown thirty years ago to have destroyed a different set of files concerning the same neighbourhood.

  I expect the procedure to return an answer on the third case that I will not like, and I want it stated without being softened. Finally, tell me plainly what the procedure cannot do: which of these disputes are not the kind of thing a checklist can settle, and what we should do with those.
reasoning: |-
  Okay, this is a complex and nuanced request from a heritage committee chair dealing with the tension between documented history and community memory. The user has clearly articulated a structural problem where institutional requirements (state heritage office's evidence-based approach) clash with community experiences (feeling disbelieved when oral history is hedged). 

  First, I need to understand the core pain points: 
  - They need a practical 40-minute decision procedure for plaque disputes
  - Must handle three types of conflicts (silence, contradiction, attribution)
  - With three non-negotiables: 1) recognizing different conflict types 2) acknowledging asymmetry in correction costs 3) preserving remembered names
  - And they want brutal honesty about limitations

  Hmm... the fourth conflict type (memory of archival bad faith) is particularly thorny. It's absolutely distinct because it attacks the credibility of the documentary record itself - like in their flood relief example where archives were previously proven compromised. This requires treating the archive as an unreliable narrator, which fundamentally changes how we weigh evidence.

  The cost asymmetry point is ethically loaded. The user's right - correcting a database vs. correcting public memory have radically different social weights. But building that into the procedure risks institutionalizing bias. The solution might be to flag this tension explicitly in the rationale rather than bake it into decisions.

  That name preservation rule? It's defensible as harm mitigation. Names carry identity - overwriting "Uncle Joe" with "Joseph P. Smith, b.1879" erases relational meaning. But this shouldn't extend to objective facts like dates or death tolls where precision matters for historical accountability. 

  For the procedure design:
  - Need clear exit ramps to human judgment when values conflicts arise
  - Must distinguish between evidentiary gaps (solvable) and irreconcilable perspectives (requires mediation)
  - Should formalize when public meetings are mandatory - specifically when trust in institutions is the core issue

  Testing with their examples:
  1) The settler plaque case shows record silence. Procedure should allow naming the gathering place as oral tradition while keeping settler claim as documented fact. Dual attribution avoids erasure.

  2) The factory fire has record contradiction. Here we must side with documentation for the death toll (9 confirmed) but can memorialize the five named individuals as "unverified by records" with context about labor practices. Truth matters for death counts.

  3) The flood relief is that fourth type - proven archival bad faith. This torpedoes the document's authority. The procedure should force a public meeting because the dispute isn't about facts but institutional trust. 

  The key limitation? This can't resolve battles over historical meaning or heal community trauma. Some conflicts need facilitated dialogue, not plaques. The procedure's success lies in knowing when to say "this isn't ours to decide."

  ...I'll structure the output to mirror their requested format while embedding these insights. The tone should stay clinical - they want tools, not philosophy. But that flood relief case outcome will sting, as predicted.
answer: |-
  Here is a decision procedure designed for efficiency, consistency, and ethical transparency. It incorporates your requirements while flagging inherent tensions. **The procedure takes 30-40 minutes per case if evidence is pre-gathered.**

  ---

  ### **Decision Procedure: Memory/Document Conflict Protocol (MDCP)**
  **Input:** Proposal, supporting evidence (oral history summaries, documents, prior research).  
  **Output:**  
  1. **Marker Text:**  
     - (A) Assertion (fact)  
     - (B) Attributed Claim ("oral history holds...")  
     - (C) Omission  
  2. **Rationale:** 1 sentence.  
  3. **Flag:** "Public Meeting Required" (Yes/No).  

  **Procedure Steps (Follow Order; Stop at First "No"):**  

  | Step | Question                                                                 | Sufficient Answer                                                                                                | Outcome if "No"                                                                 | Notes                                                                 |
  |------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------|
  | 1    | **Is there documentary evidence *directly contradicting* the core claim?** (e.g., coroner's list vs. oral death toll) | Verified primary source (e.g., govt record, eyewitness document). *Exclude: inferences, later interpretations.* | → Omit contradicted claim (C). Flag for Public Meeting if community impact is high. | *Weighs institutional requirements.*                                |
  | 2    | **Is the claim *plausible* and *internally consistent*?**                | Logical coherence; fits historical context; no anachronisms. Corroborating secondary sources strengthen.        | → Omit claim (C).                                                                | *Filters obvious errors.*                                           |
  | 3    | **Does the record include *proven bad faith* (falsification/destruction) on this *specific* issue?** | Archival proof (e.g., audit, whistleblower) of tampering *relevant to this event*.                                  | → **Flag for Public Meeting.** Procedure stops.                                | *Your "fourth conflict." Forces human judgment.*                    |
  | 4    | **Is the record *silent* AND the claim about an *event/place* (not attribution/intent)?** | No documents address the claim. Claim describes what happened, not why/who.                                     | → Allow assertion *with attribution* (B: "Oral histories recall...").           | *Silence ≠ contradiction. Attribution respects memory.*             |
  | 5    | **Is the conflict about *attribution* (who) or *intent* (why)?**         | Record and memory agree on *what* occurred but disagree on agency/motive.                                       | → Use attribution phrasing (B: "Some accounts state...").                         | *Intent is interpretive; attribution acknowledges perspective.*    |
  | 6    | **Does the claim involve a *remembered name*?**                          | Community uses a specific name not in documents (e.g., "Uncle Joe" vs. "Joseph Smith").                         | → **Add/annotate; do not replace.** Use both names if possible.                | *Your standing rule; defensible for identity/dignity.*              |
  | 7    | **Is the claim supported by *multiple, consistent oral sources*?**       | 2+ independent accounts; documented via committee notes/recordings.                                            | → Allow assertion *with attribution* (B).                                      | *Strengthens reliability of oral history.*                          |
  | 8    | **Default**                                                              | N/A                                                                                                             | → Omit claim (C).                                                                | *Insufficient evidence; risk of speculation.*                       |

  **Rationale Sentence Template:**  
  *"Based on [evidence type], the committee [asserts/attributes/omits] [claim] due to [reason: e.g., document contradiction, plausible silence, interpretive nature]."*  

  **Public Meeting Flag:**  
  Trigger if:  
  - Step 3 (Proven bad faith)  
  - Step 1 "No" + High community impact (e.g., trauma, systemic injustice)  
  - Dispute centers on *trust in the archive itself*.  

  ---

  ### **Assessment of Your Requirements**
  1.  **Four Conflict Types:**  
      - Silence (Step 4), Contradiction (Step 1), Attribution/Intent (Step 5), and **Bad Faith (Step 3)** are distinct.  
      - **Why Step 3 is Critical & Distinct:** Bad faith invalidates the documentary record’s authority *on that issue*. It transforms "contradiction" into a question of institutional power, not evidence. The procedure *must* escalate this (Public Meeting).  

  2.  **Asymmetry of Correction Costs:**  
      - **Weighing it is NOT corruption; ignoring it is unethical.** The procedure addresses this by:  
        - Prioritizing *attribution* over omission where possible (Steps 4,5,7).  
        - Flagging high-impact cases for Public Meeting (e.g., deaths, discrimination).  
        - **Tension Stated:** The procedure minimizes harm by preserving memory via attribution but cannot resolve the inherent power imbalance. Public Meetings acknowledge the social cost.  

  3.  **Remembered Names Rule:**  
      - **Defensible Principle:** Names are core to identity and cultural sovereignty. Overwriting a remembered name with a "documented" one perpetuates colonial/administrative violence.  
      - **Limits:** Applies **only to personal/place names**. *Does NOT extend to dates, death tolls, or intent.* These are factual claims where documentation (if reliable) should prevail (Step 1).  

  ---

  ### **Procedure Applied to Cases**
  **Case 1: Founding Plaque**  
  - Step 1: No direct contradiction (map shows prior structures ≠ disproves founding).  
  - Step 2: Plausible (seasonal use common).  
  - Step 3: No bad faith alleged.  
  - Step 4: **YES** – Record silent on gathering place.  
  - → **Output:**  
    - (A) Assert: "[Settler] established permanent settlement in [Year]."  
    - (B) Attribute: "Oral histories indicate this site was a seasonal gathering place for [Nation] prior to settlement."  
    - (C) Omit: Nothing.  
    - **Rationale:** *Based on land map silence and oral tradition plausibility, the committee attributes pre-settlement use while asserting documented founding.*  
    - **Flag:** No Public Meeting.  

  **Case 2: Factory Fire Deaths**  
  - Step 1: **YES** – Coroner’s register (primary doc) directly contradicts oral death toll (14 vs 9).  
  - → **Output:**  
    - (A) Assert: "Nine confirmed fatalities occurred." (List names from coroner).  
    - (B) Attribute: "Community accounts recall five additional itinerant workers perishing; their names were [Names]. Archival gaps prevent verification."  
    - (C) Omit: Asserting 14 deaths as fact.  
    - **Rationale:** *Based on coroner’s register contradiction, the committee asserts documented deaths while attributing unverified community memory.*  
    - **Flag:** Public Meeting? **YES** (High community impact: unmarked deaths, labor exploitation).  

  **Case 3: Flood Relief Withholding**  
  - Step 1: Record shows misrouting, not intentional withholding → Contradicts *intent* claim.  
  - Step 2: Plausible (prior discrimination alleged).  
  - Step 3: **YES** – Archives destroyed files *concerning this neighborhood*. Proven bad faith *on related record-keeping*.  
  - → **Output:**  
    - (A) Assert: "Relief arrived after an 11-day delay due to administrative error."  
    - (B) Attribute: "The community maintains relief was deliberately withheld, citing a pattern of documented archival exclusion."  
    - (C) Omit: Asserting intent as fact.  
    - **Rationale:** *Based on relief files showing error and proven archival bad faith, the committee asserts the delay cause while attributing the interpretation of intent.*  
    - **Flag:** **Public Meeting REQUIRED** (Step 3 trigger: bad faith undermines record).  

  ---

  ### **What the Procedure Cannot Do**
  1.  **Resolve Values Conflicts:** It identifies when disputes are about *historical meaning*, *justice*, or *trust* (not facts) and flags them for Public Meeting.  
  2.  **Heal Trauma or Restore Justice:** Attributing memory ("oral history says...") acknowledges pain but doesn’t rectify it. This requires broader community processes.  
  3.  **Fix Archival Gaps:** It works with available evidence; it cannot uncover lost documents.  
  4.  **Replace Dialogue:** When communities fundamentally reject the archive’s authority, only facilitated dialogue (not a plaque) can address the rupture.  

  **Final Recommendation:** Use this procedure for efficient, consistent technical decisions. For cases flagged for Public Meetings or involving deep trauma/inequality, partner with mediators or truth-telling initiatives. Your role isn’t to be the arbiter of truth, but the steward of a process that honors both evidence and lived experience.
