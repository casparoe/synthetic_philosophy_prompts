answer: |-
  ### Joint Statement on the Careenium-Simmballs Scenario  
  *Drafted following adversarial collaboration between Substrate and Symbol camps*

  **Section 1 — Agreed Claims**  
  Both camps jointly endorse the following substantive claims:  

  1. **Microphysical Determinism and Completeness**: The microdynamics—specifying the exact positions, velocities, pip-states, and medium interactions—is causally closed and deterministic. Given the total microstate at time \( t \), the microstate at \( t+Δt \) is fully determined. There are no "gaps" for non-physical forces or fundamental indeterminacy.  
  2. **Pattern Supervenience**: The coarse-grained pattern (e.g., "extended/retracted pip array") supervenes entirely on the microstate. No difference in pattern occurs without a difference in microstate.  
  3. **Invariance of Pattern-Level Laws**: Within *any* realisation class of a given pattern, the coarse-grained outcome (e.g., shove direction/magnitude) is invariant under microstate perturbations. The pattern-level law ("pattern X → shove Y") is simple, exceptionless, and supports interventions (e.g., altering the pattern alters the outcome predictably).  
  4. **Empirical Adequacy at Grain**: Both microlevel and pattern-level descriptions are empirically adequate *at their respective grains*:  
     - The microdynamics correctly predicts all microstate transitions.  
     - The pattern-law correctly predicts all coarse-grained outcomes under interventions.  
  5. **Non-Derivability**: The pattern-law cannot be tractably derived from the microdynamics alone (per Stipulation 1: "cryptic microdynamics"). No simpler lawlike description of micro-to-outcome mapping exists than the pattern-law.  
  6. **Explanatory Burden**: Any complete account must explain:  
     - Why the *Scrambled Twin* (same micro-law, energy, simmball count) exhibits erratic/no shoving despite micro-similarity.  
     - Why *Re-encoding Drift* preserves outcome continuity despite microstate discontinuity.  
  7. **Screening-Off Triviality**: *Agreed, but does no work*: The microstate screens off the pattern *in probabilistic terms* if probabilities are defined over the full phase space. This is analytically true given supervenience but does not resolve the causal dispute.  

  ---

  **Section 2 — Disagreements Table**  

  | Crux                                                                 | Substrate Formulation                                                                                              | Symbol Formulation                                                                                                  | Case/Test                                                                                                  | Substrate Prediction                                                                 | Symbol Prediction                                                                 | What Counts as Evidence Against                                                                 |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **Causal "production" vs. "difference-making"**                      | Cause denotes *energy/momentum transfer* via physical interaction. Patterns lack mechanism to "push"; only microstates transfer conserved quantities. | Cause denotes *systematic difference-making* under interventions. Patterns are difference-makers by Stipulation 2 (invariance under realisation-class changes). | Apply energy/momentum conservation laws to shove.                                                          | Shove energy/momentum is fully accounted for by summed micro-interactions; no surplus from patterns. | Conservation holds at micro-level, but pattern determines *how* conserved quantities are directed. | Substrate: Finding unexplained energy. Symbol: Shove direction varying whilst micro-energy-transfer sum is fixed. |
  | **Screening-off vs. Invariance**                                     | Screening-off proves pattern is epiphenomenal: fixing microstate fixes outcome regardless of pattern. Invariance is merely stability of outcome across realisers. | Invariance under interventions proves causal robustness. Screening-off is trivial given supervenience and irrelevant to pattern-level efficacy. | **Test**: *Hybrid Array*: Fix pattern, but selectively "freeze" medium microstates (preventing momentum transfer) whilst preserving pip-configuration. | Outcome changes erratically or ceases; pattern alone cannot sustain shove.                          | Outcome persists if unfrozen regions retain pattern-realising interactions; pattern organises causal pathways. | Substrate: Shove persists despite frozen medium. Symbol: Shove ceases despite intact pattern. |
  | **Counterfactuals in determinism**                                   | "Had pattern differed" is ill-defined: microstate fixes pattern. Valid counterfactuals require altering initial conditions consistently with micro-laws. | "Had pattern differed" is meaningful via Stipulation 2: interventions *change microstate to realise new pattern*, yielding well-defined counterfactuals (e.g., "if pattern=Z, shove=W"). | **Re-encoding Drift** (Stipulation 4): Pattern persists whilst microstates drift through disjoint realisers. | Outcome continuity is micro-caused by chain of contiguous states; pattern constancy is coincidental. | Outcome continuity directly tracks pattern persistence despite micro-discontinuity; pattern is the stable cause. | Substrate: Outcome discontinuity during pattern stability. Symbol: Outcome change without pattern change. |
  | **Scrambled Twin significance**                                      | Erratic shoving arises from micro-chaos; absence of stable pattern is incidental. Same outcome possible with legible pattern if microstate perturbed. | Scrambled Twin shows pattern necessity: micro-similarity + pattern absence → no rule-governed outcome. Pattern enables coherent medium coordination. | Compare Scrambled Twin to a *Legible Twin* with identical micro-properties *except* pip-bits set to a legible pattern. | Both exhibit similar shoving if microstates converge; pattern irrelevant.                            | Legible Twin exhibits stable shove; Scrambled Twin does not. Pattern is the differentiating factor. | Substrate: Legible Twin shoves erratically. Symbol: Scrambled Twin shoves stably. |
  | **Causal-discovery procedures**                                      | Inputting *only micro-variables* into causal modelling (e.g., Pearlian DAGs) recovers all true causes. Adding pattern variables adds no new edges; they are outputs, not causes. | Inputting *only pattern variables* recovers the pattern-shove law. Adding micro-variables creates intractable noise; pattern variables screen-off micro-variables for coarse outcomes. | Run simulated causal-discovery algorithms on: (a) micro-only data, (b) pattern-only data, (c) both.        | (a) Reveals micro-shove dependencies; (c) shows pattern variables are descendants of micro-variables. | (b) Reveals pattern→shove edge; (c) shows micro-variables are non-ancestral to shove when pattern is conditioned on. | Substrate: Pattern-only model fails to predict shove. Symbol: Micro-only model fails to predict coarse shove direction robustly. |
  | **"Pushing" requiring conserved quantity transfer**                  | "Pushing" entails momentum/energy exchange. Patterns cannot transfer these; only micro-constituents can. Symbolic "pushing" is metaphorical. | "Pushing" denotes systematic direction of conserved quantities. Patterns structure *how* energy flows (e.g., shove direction), hence they push *qua* patterns. | Measure if altering the pattern *without altering total system energy* changes shove work/kinematics. | Shove work is identical for same-energy microstates; pattern change only re-distributes existing energy transfers. | Pattern change redirects energy flow (e.g., leftward vs. rightward shove), doing different *directional work*. | Substrate: Pattern change alters total energy cost of shove. Symbol: Pattern change alters direction without altering energy cost. |

  ---

  **Section 3 — What is Merely Verbal**  
  *Signed: Substrate and Symbol Camps*  

  We agree that residual disagreement centres on the **semantics of "causation" and "pushing"**, not empirical facts.  
  - **Substrate** restricts "cause" to *mechanical production* via contact forces transferring conserved quantities. Under this definition, patterns cannot cause pushes.  
  - **Symbol** adopts a *difference-making* definition: if \( X \) is invariant under interventions and suffices for predicting/explaining \( Y \)’s behaviour, then \( X \) causes \( Y \). Here, patterns cause pushes.  
  Both definitions are coherent and consistent with the stipulations. Neither camp denies the microphysical closure (Substrate’s concern) or the autonomy of pattern-laws (Symbol’s concern). The dispute reduces to whether "cause" must entail energy transfer mechanics (Substrate) or can denote robust, intervention-supporting dependence (Symbol). Labelling pattern-dependence as "causal efficacy" or "metaphorical pushing" is terminological. We concur that no new physics or stipulation can resolve this definitional choice.  

