prompt: |-
  I write about science and ideas for a magazine, and I'm currently working on a piece about what happens to moral language once a great deal of it starts coming out of institutions and machines rather than people: crisis triage protocols drafted by rotating hospital committees and then applied by software, model-generated summaries of what a patient "ought" to be told, training datasets built from moral annotations whose authors are dead. At a workshop dinner I sat through recently, two philosophers had an argument I have not been able to stop turning over, and I would like it adjudicated rather than summarized. They began from common ground: expressivism holds that to call something wrong is not to state a belief but to voice a conative attitude, something closer to cheering or booing than to describing; the Frege–Geach problem is that moral sentences keep their full meaning in positions where nothing is being voiced, as when "stealing is wrong" sits in the antecedent of a conditional, and yet moral arguments containing such sentences look straightforwardly valid; and the best-known expressivist reply, the quasi-realist one associated with Simon Blackburn, relocates validity one level up, so that what makes the argument good is not shared representational content but the incoherence of simultaneously being for the antecedent, for the conditional, and against the consequent.

  From there it went like this. (1) The critic, Julian, introduced what he called "unowned" moral sentences: tokens that are produced, stored, and used without any agent ever having the relevant attitude and, in some cases, without any agent being in a position to have it — a protocol line saying that withholding life-sustaining treatment in a certain class of cases is permissible, or a verdict emitted by a model trained on annotators no one can now question. He said such tokens enter inferences that are plainly valid and plainly action-guiding, while the expressivist's surrogate for validity has nothing to bite on, since there is no one whose attitudes could be incoherent. (2) The expressivist, Nadia, answered that this is the original problem in a new costume: the Frege–Geach problem was always about unasserted occurrences, an unowned token is simply an unasserted one with nobody standing nearby, and meaning is fixed by the practices of a community of attitude-holders from which the token inherits its content; the protocol's inference is valid in that anyone who did take up those sentences — who applied them while rejecting their upshot — would be incoherent. (3) Julian replied that this makes validity hostage to agents who will never exist, since the protocol simply runs and no one takes it up in the relevant sense, and that in the meantime Nadia is quietly treating the sentences as correct or incorrect independently of anybody's attitudes, which is the very thing in dispute; he added that if content can be inherited from attitudes held by people long dead, then the attitudes are doing no semantic work and expressivism has become a causal story about how a practice got started. (4) Nadia's sharpest move was to say that Julian's pressure case is really a dispute about what counts as a bearer of commitment rather than about moral semantics: expressivism never required an occurrent feeling, the attitude in the embedded antecedent was never felt either, and if an institution or a system with a stable dispositional profile can count as a commitment-bearer, then its patterned dispositions can coherently or incoherently hang together and the view accommodates the case. (5) Julian answered that if commitments can float entirely free of affect, motivation, and any capacity to be moved by what one "accepts," the position survives only by ceasing to be a distinctive semantic thesis — it has become realism with a deflationary theory of truth bolted on, and the old motivation for expressivism, the tight link between moral judgment and motivation, has quietly evaporated. Neither would budge, and I genuinely could not tell who was winning.

  So please referee it. Go through the five moves and tell me who is right about what at each step — ideally rating each move from clearly mistaken to clearly right and justifying the rating briefly, since I suspect several of them are partly right in different respects — and then tell me what, if anything, both of them are missing. Specifically: are unowned sentences a genuinely new problem for expressivism or only the Frege–Geach problem re-described; does the disagreement in fact bottom out somewhere other than moral semantics, in a general theory of content or of what an agent is; does the case tell us anything about whether a practice needs live participants to confer meaning; and what, if anything, all of this settles about the question I actually have to answer in my piece — whether sentences issued by committees, protocols, and models can be said to mean what our moral sentences mean.
reasoning: |-
  Okay, the user is a science writer working on a piece about moral language in institutional and machine contexts. They witnessed a debate between two philosophers, Julian and Nadia, about expressivism and unowned moral sentences. The user wants me to referee their five moves, rate each, and address deeper questions about moral semantics.

  First, I need to unpack the philosophical context. Expressivism says moral statements express attitudes, not beliefs. The Frege-Geach problem challenges how unasserted moral sentences (like in conditionals) retain meaning. Blackburn's quasi-realism uses coherence of attitudes to explain validity. Julian introduces "unowned" sentences—protocols or AI outputs without any current attitudinal backing. Nadia defends expressivism by appealing to community practices or institutional commitments.

  For move (1): Julian presents unowned sentences as a new problem. But are they really different from Frege-Geach? I think they're an extension—more radical because there's zero connection to any agent's attitudes. Rating: Partly right (novelty in degree, not kind). Justification: It intensifies the problem by removing even hypothetical attitude-holders.

  Move (2): Nadia says this is just Frege-Gech in new clothes, with meaning inherited from past communities. But Julian's point about "no one standing nearby" weakens this. Rating: Partly right but incomplete. Justification: Past attitudes can anchor meaning, but dead annotators can't update for new contexts—inheritance feels thin here.

  Move (3): Julian attacks Nadia's reliance on non-existent agents and accuses her of smuggling in realism. Strong point—if validity depends on ghost attitude-holders, it's unstable. Rating: Mostly right. Justification: Nadia's move risks circularity; inheriting content from the dead might reduce attitudes to historical footnotes.

  Move (4): Nadia shifts to commitments via institutional dispositions. Clever—it avoids needing occurrent feelings. Rating: Clever but risky. Justification: If institutions "commit" without motivation, expressivism's core link to motivation frays. Still, it pragmatically handles protocols.

  Move (5): Julian argues this drains expressivism of its essence. Spot-on—if commitments lack affect, it's realism-lite. Rating: Clearly right. Justification: Expressivism's whole point is tying morality to conative states; stripping that away hollows it out.

  Overall, Julian slightly edges out because unowned sentences expose expressivism's limits more sharply. But both miss something: The real tension might be about what constitutes an "agent" (can institutions bear commitments?) and whether meaning requires ongoing practice (Wittgensteinian angle). For the user's article, yes—machines can *use* moral language meaningfully via social practice, but it's parasitic on human contexts. The "ought" in a protocol isn't identical to a human's; it's a fossilized shadow. The piece should highlight this fragility.
answer: |-
  Here's a referee's analysis of the Julian vs. Nadia debate, breaking down each move, rating it, and addressing your core questions:

  **The Referee's Call:**

  | **Move** | **Philosopher** | **Key Argument** | **Rating & Justification** | **Who Wins the Move?** |
  |----------|----------------|------------------|----------------------------|------------------------|
  | **(1)** | Julian | "Unowned" tokens (protocols, AI outputs) create a *new* problem: No agent exists whose attitudes could be incoherent in inferences, yet inferences remain valid/action-guiding. | **Partly Right (Novelty in Degree/Context):** Unowned tokens *intensify* Frege-Geach by removing *any* conceivable occurrent attitude-bearer *even potentially* during inference. They force the question: What anchors meaning/validity beyond *actual* attitudes? | **Julian (slight edge)** |
  | **(2)** | Nadia | This *is* Frege-Geach. Meaning comes from community practices; validity depends on the *incoherence anyone adopting those sentences* would face. | **Partly Right (Framework) but Incomplete:** Correctly identifies the quasi-realist *framework* for handling embedded contexts. However, it stretches "community practice" thin when the "community" (dead annotators) can't update or engage with *this specific* token/inference. | **Nadia (defensive hold)** |
  | **(3)** | Julian | 1. Nadia relies on non-existent agents ("hostage to agents who will never exist").<br>2. Inheritance from dead attitudes makes attitudes causally historical, not semantically active.<br>3. Nadia covertly treats sentences as attitude-independent (realism). | **Mostly Right (Strong Critique):** Points 1 & 2 are powerful: Relying on purely hypothetical attitude-bearers is unstable for validity. If meaning *only* comes from dead annotators, attitudes aren't *constitutive* of *current* meaning, just its origin. Point 3 is plausible but debatable. | **Julian (significant point)** |
  | **(4)** | Nadia | Expressivism doesn't need occurrent feelings. Institutions/systems with "stable dispositional profiles" *are* commitment-bearers. *Their* dispositional coherence validates inferences. | **Clever but Risky:** A bold and potentially workable solution for protocols/AI *within institutions*. Extends "attitude" dispositionally. **Major Risk:** Severing the essential link between moral commitment *and motivation/affect* (Julian's next move). | **Nadia (tactical recovery)** |
  | **(5)** | Julian | If commitments lack affect/motivation, expressivism loses its core identity (judgment→motivation link) and collapses into deflationary realism. | **Clearly Right (Core Challenge):** Hits expressivism's foundational motivation. If a system can "commit" to "stealing is wrong" without *any* conative state (booing impulse, motivation to prevent theft), then "commitment" is just a label for rule-following. The distinctive *anti-realist, motivation-linking* aspect of expressivism vanishes. | **Julian (knockdown)** |

  **Overall Winner:** **Julian wins the debate on points.** While Nadia offered clever defenses and extensions (especially Move 4), Julian successfully argued that:  
  1. Unowned tokens create a *distinctive challenge* by removing *all* relevant, contemporaneous attitude-bearers (Move 1, 3).  
  2. Accommodating them *within expressivism* either relies on unstable fictions (Move 3) or requires abandoning expressivism's core thesis linking moral judgment to conative states/motivation (Move 5). Nadia's institutional move (4), while pragmatic, sacrifices the theory's soul to save it.

  **What Both Are Missing (The Deeper Layers):**

  1.  **The Primacy of Practice (Wittgensteinian/Social Externalism):** Both focus on the *producer* of the token (attitudes, dispositions). A different view sees meaning as residing in the *ongoing public practice of use*. The protocol "withholding treatment is permissible" means what it does because of how it is *used* in hospital decision-making *now*, guided by training, legal frameworks, and *current* reactions to its outputs – regardless of the original annotators' feelings or whether any single agent now "boos" the antecedent. Meaning is sustained by the *system* and its *effects*, not just its origins or current internal attitudes.
  2.  **The Nature of "Agents" and "Institutions":** The debate hinges on what counts as a bearer of "commitment" or "attitude." Julian assumes agents require affect/motivation. Nadia stretches "agent" to include dispositional systems. This *isn't just* moral semantics; it's fundamental philosophy of mind/action/social ontology. Can a purely algorithmic process "commit"? Is an institution's "disposition" reducible to its rules and human enforcers? They need a shared theory of agency here.
  3.  **The Function of Moral Language:** They focus on truth-aptness and inference. But moral language also *coordinates behavior*, *expresses solidarity*, *constitutes identities*. Unowned tokens might perform these functions *differently* (e.g., protocol as impersonal coordination tool), which impacts their "meaning." Does a committee statement *express* collective attitude (Nadia) or merely *stipulate* a rule for coordination (closer to Julian's realism-lite)?

  **Answers to Your Specific Questions:**

  1.  **Are unowned sentences a genuinely new problem?** **Yes, but an *intensification* rather than a *contradiction*.** They take the Frege-Geach problem (handling unasserted contexts) to an extreme by removing *any* plausible connection to a *contemporaneous*, *sentient* attitude-bearer *during the token's use*. They force expressivists to either rely on increasingly abstracted notions of "commitment" (risking incoherence or collapse) or appeal to practices in a way that may dilute expressivism's core.
  2.  **Does it bottom out elsewhere?** **Absolutely.** The core disagreement is fundamentally about:
      *   **The Nature of Content:** What fixes meaning? Internal mental states (attitudes), dispositions of systems, public practices, causal history? (Move 3 & 4 clash directly here).
      *   **The Nature of Agency/Commitment:** What is required to "hold" a moral commitment? Must it involve affect/motivation (Julian), or is rule-governed/systematic behavior sufficient (Nadia)? (Move 4 & 5 are the crux). Moral semantics *presupposes* answers here.
  3.  **Does a practice need live participants?** **Not necessarily for *continued* meaning, but live *engagement* is likely essential for *robustness* and *adaptation*.** A protocol's meaning *can* persist based on institutional memory, documentation, and current use-practices, even if its original authors are dead. However, without living participants who understand, apply, debate, and potentially *revise* the practice in light of new contexts, the meaning becomes fragile, fossilized, and potentially detached from the social realities it was meant to address. It becomes more like an archaeological artifact than a living language game. The dead annotators' dataset is a static resource; meaning is sustained by how *live* engineers, doctors, and users *interpret and deploy* it *now*.
  4.  **Can committee/protocol/model sentences mean what ours do?** **They can *use* the same words with *similar* inferential roles and action-guiding force, but likely with a *different pragmatic status and grounding_.**
      *   **Yes, functionally:** They can be integrated into valid inferences ("If protocol says P, and P implies Q, then do Q"). They guide actions effectively within systems. They inherit surface syntax and much inferential role from human moral language.
      *   **But, meaning is complex:** The *source* of the normativity is different. Our "stealing is wrong" expresses (or projects) a conative attitude. The protocol's line is an institutional rule, a product of (perhaps lost) deliberation, encoded for consistency. The AI's output is a statistical pattern derived from traces of past attitudes. They *simulate* the linguistic function of moral assertion without necessarily sharing the same *kind* of mental/attitudinal backing that defines human moral judgment for the expressivist.
      *   **The Takeaway for Your Piece:** Moral language emanating from institutions and machines is **operationally potent but existentially thin**. It can guide action and support inference *as if* it were grounded in human moral sentiment, but its connection to the lived conative states that originally motivated expressivism is severed or deeply mediated. It represents a **bureaucratization or externalization of morality**, where the "boo" or "hurrah" is replaced by a rule lookup or a statistical prediction of what a (possibly dead) human *would have* said. This doesn't make it meaningless, but it fundamentally alters the relationship between the moral utterance and the wellsprings of moral motivation and feeling. It risks creating a moral landscape populated by **zombie norms** – functional shells of meaning, action-guiding yet potentially disconnected from the human responses that gave birth to the moral concepts in the first place.

  **Therefore, for your piece:** Focus on the *uncanny valley of moral language*. These unowned tokens *work* – they guide life-or-death decisions, they fit into logical structures – yet they lack the visceral, motivational core we associate with genuine moral judgment. The debate exposes a tension: our moral language evolved for face-to-face norm enforcement and shared emotional signaling, but we increasingly deploy it through systems that strip away that interpersonal affective layer. The meaning persists pragmatically, but the connection to the human heart of morality becomes attenuated, raising profound questions about authenticity, responsibility, and the future of moral discourse itself.
