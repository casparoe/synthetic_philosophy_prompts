answer: |-
  ### Runnable Design for Platonia Dilemma Session

  #### **Pre-Session Prep (Done Beforehand)**
  1. **Participant Survey**: Email 5 quantitative questions to all attendees 24h in advance:
     - "Split $100 between yourself and a stranger: $____ for you, $____ for them."
     - "Bid for a $50 item in a sealed-bid auction (no other bidders): $____."
     - "Probability it rains tomorrow in our city: ____%."
     - "Estimate the number of countries in Africa: ____."
     - "Hours you spent coding last week: ____."
  2. **Cluster Participants**: Use k-NN clustering to pair each participant with their nearest neighbor ("echo"). If odd group size, create one trio (A echoes B, B echoes C). Save pair assignments.
  3. **Materials**:
     - Decision cards (Claim/Abstain) for each round.
     - Random number generator (RNG) website visible to all.
     - Envelopes for decision cards.
     - $50 cash prizes x 4 rounds ($200 total).

  ---

  ### **Session Timeline (75 Minutes Total)**

  #### **1. Introduction (5 min)**
  - **Script**:  
    *"Welcome! Today’s game involves strategic choices with real money. Each round, you’ll choose CLAIM or ABSTAIN. If exactly one person claims, they win $50. If zero or multiple claim, no one wins. No talking, signaling, or coordination. Decisions are private and simultaneous. We’ll run 3 rounds with slight rule variations, then a final round."*  
  - **Handling Early Spoilers**: If someone mentions Hofstadter/Platonia:  
    *"Interesting—let’s see how the group navigates this in practice. Please keep insights private until debrief."*

  #### **2. Round 1: Baseline (c ≈ 0) (15 min)**
  - **Mechanic**: No echos. Pure independence.  
  - **Script**:  
    *"Round 1: Write CLAIM or ABSTAIN on your card. Seal it. No additional rules."*  
  - **Payoff**: If exactly one claims, they win $50.  
  - **Flow**:  
    - 2 min: Decide/seal cards.  
    - 1 min: Collect envelopes, count claims publicly.  
    - 2 min: Award prize if won.  
    - **Expected Outcome**: High claims → no winner (illustrates failure of greed).

  #### **3. Round 2: Medium Correlation (c = 0.5) (20 min)**
  - **Mechanic**: Echo pairs with 50% override chance.  
  - **Script**:  
    *"Round 2: You’re paired with someone who answered similarly. You’ll both decide independently. AFTER you seal your card, we’ll simulate ‘echoing’: a 50% chance your pair’s card is overwritten to match yours. This models correlated decisions."*  
  - **Payoff**: $50 if exactly one claim after echo adjustments.  
  - **Flow**:  
    - 2 min: Decide/seal cards.  
    - 1 min: Collect envelopes.  
    - **Live Computation**:  
      ```python
      # Pseudo-code (run live via script)
      for each pair (A, B):
          random = RNG(0-100)
          if random < 50:  # 50% override
              B.card = A.card  # Overwrite B’s card with A’s choice
      ```  
    - 2 min: Reveal outcomes. Award prize if won.  
  - **Expected Outcome**: Mixed results (some restraint, but likely no winner).

  #### **4. Round 3: Perfect Correlation (c = 1) (15 min)**
  - **Mechanic**: Echo pairs with 100% override.  
  - **Script**:  
    *"Round 3: Same pairs. Now, AFTER you decide, we’ll force your pair’s card to match yours 100% of the time."*  
  - **Payoff**: $50 if exactly one claim (impossible by design).  
  - **Flow**:  
    - 2 min: Decide/seal cards.  
    - 1 min: Collect envelopes.  
    - **Live Computation**: Overwrite all echo cards to match.  
    - 2 min: Reveal outcomes (always 0 or ≥2 claims).  
    - **Key Moment**: *"Notice: When choices are perfectly linked, winning becomes impossible—even if you abstain."*  

  #### **5. Round 4: Public Random Draw (15 min)**
  - **Script**:  
    *"Final round: No echos. I’ll publicly draw one name. That person is the only one allowed to claim. If they claim AND everyone else abstains, they win $50. If anyone breaks the rule, no prize."*  
  - **Flow**:  
    - 1 min: Draw name via RNG.  
    - 2 min: Decisions/sealing.  
    - 1 min: Count cards (should have one claim).  
    - Award $50 if successful.  
  - **Why It Works**: Forces coordination via randomization. Sharpens the point that correlation requires a structured solution.

  #### **6. Debrief (25 min)**
  - **Structure**:  
    1. **Point 1: Abstention isn’t a solution**  
       *"In Round 1, did universal restraint work? No—it pays nothing, just like universal greed. Abstainers can’t win alone."*  
       → Use Round 1 outcome as evidence.  

    2. **Point 2: Randomization as the fix**  
       *"In Round 4, how did we ensure exactly one claim? Random selection. What’s the fair probability per person? 1/20."*  
       → Participants deduce 5% chance (1/20).  

    3. **Point 3: Correlation is key (not altruism)**  
       *"In Round 3, why was winning impossible? Your choice dragged your echo with you. Not because you’re similar people, but because your decisions were linked. At c=1, claiming creates a duplicate; abstaining creates zero."*  
       → Contrast with Round 2 (c=0.5) where partial correlation allowed hope.  

    4. **Causality Objection**  
       *"But your echo’s card was already sealed! Isn’t this just evidence, not influence?"*  
       → Acknowledge: *"True—this simulates correlation, not causation. In reality, correlation arises from shared reasoning, not a script. The dilemma is that if we all ‘figure it out,’ we’ll do the same thing—making randomization essential."*  

    5. **Connect to Design Reviews**  
       *"This mirrors coordination failures in distributed systems: nodes act identically because they run the same code. Randomness breaks symmetry."*

  ---

  ### **Handling Edge Cases & Chaos**
  - **Spontaneous Coordination/Side Deals**:  
    *"Remember: no communication. If you coordinate, we’ll void the round."* Void if breached; useful for debrief ("Why did coordination fail?").  
  - **Contrarian Claimant**:  
    Celebrate! *"This shows why pure reason fails—human behavior isn’t perfectly symmetric."*  
  - **Bribes/Accusations**:  
    *"No bribes. This isn’t psychology—it’s game theory with cash prizes."*  
  - **Cheating Accusations (c=1 round)**:  
    Show the override code live. *"This is by design—to simulate extreme correlation."*  
  - **Group Size ≠ 20**:  
    - If **N participants**, use 1/N probability in randomization argument.  
    - For **odd numbers**, trios work (A→B, B→C; override chains).  
  - **Spoilers**:  
    If experts dominate, assign them as silent observers: *"Help me watch for insights to discuss later."*

  ---

  ### **What the Game CANNOT Replicate**
  - **Superrationality**: The exercise simulates correlation externally, but real Platonia hinges on *logical inevitability* of identical reasoning—not RNG overrides.  
  - **Emergent Symmetry**: Participants may not feel their reasoning is "shared"; the echo mechanic is a proxy.  
  - **Pure Abstraction**: Cash prizes make stakes tangible, but dilute the "billion-dollar" paradox.  

  **Final Prep Tip**: Dry-run the script and RNG tool. Expect chaos—use it as fuel for debrief!
