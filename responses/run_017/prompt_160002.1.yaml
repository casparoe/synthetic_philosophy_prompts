prompt: |-
  A state archive holds the surviving files of a colonial district administration: tax rolls, court dockets, correspondence, police reports. Because almost nothing written by the people that administration governed has survived, those same files are also the only substantial source for those people's history. The archive's cataloguing rules require that each collection be described by its creator and kept in the creator's own filing order, so a person surfaces, if at all, under headings such as Tax defaulters, 1912 or Unrest, Ward 4: in the categories through which the administration processed them. The archive defends this as custodial neutrality — it neither destroys, rearranges, nor adjudicates the truth of what it holds, and it will accession the files of an abusive agency precisely because they are evidence of what that agency did. Yet the same archive has recently begun inviting descendants of the people named in these files to contribute oral testimony and their own descriptions, and catalogues what they produce as associated material: consultable alongside the collection, never altering its arrangement, and where a descendant disputes a file title, the title stands with their note attached beside it.

  What does this pattern presuppose about what a record is and what an archive is for? Specifically: does the neutrality claim rest on the view that a documentary trace carries its evidential meaning independently of who filed it and for what purpose, or only on the weaker view that a custodian must not be the arbiter of what is true? Does admitting descendants' material as associated but not as record presuppose a hierarchy of evidence, or is it equally compatible with a flat view of sources plus a division of labour? Where exactly is the practice underdetermined — which rival theories of evidence, or of the point of an archive, would license this same combination? And what would concretely have to change if the archive accepted that arrangement and titling are themselves interpretive acts, or, in the other direction, that testimony is simply another record? Please answer in under 500 words.
reasoning: |-
  Hmm, the user presents a complex query about archival theory and practice. They describe a colonial archive that maintains strict custodial neutrality by preserving records exactly as created by the colonial administration, while simultaneously inviting descendants to contribute oral histories that are cataloged as "associated material" rather than integrated into the official record.

  The user asks several layered questions about what this practice presupposes regarding: 1) whether records carry inherent evidential meaning independent of their creators, 2) whether accepting descendant testimony as secondary material implies a hierarchy of evidence, and 3) which competing theories of archives would justify this approach. They also ask how practices might change if the archive either recognized arrangement/titling as interpretive acts or treated testimony as equivalent to official records.

  This requires unpacking several theoretical tensions. The strict custodial approach seems rooted in positivist archival traditions (Jenkinson) where records are treated as objective evidence of administrative functions. The "associated material" compromise suggests the archive actually operates on weaker neutrality - avoiding truth adjudication while tacitly acknowledging colonial records reflect power structures. 

  By keeping descendant contributions separate, they maintain a de facto hierarchy that privileges institutional documentation over lived experience. This hybrid model could satisfy both traditional custodial theories and postmodern approaches that value multiple perspectives, as long as the institutional record remains physically untouched.

  If the archive fully embraced arrangement/titling as interpretation (Cook), they might allow collaborative description or multiple finding aids. If testimony became "record," they'd need new frameworks for authenticity and provenance. The current practice reflects pragmatic negotiation between evidence paradigms rather than theoretical consistency.
answer: |-
  This practice reveals tensions in archival theory:

  1.  **Neutrality Claim:** It relies on the *weaker* view (avoiding truth adjudication), not the stronger belief in inherent meaning. The archive acknowledges context by preserving creator-based order and titling, implicitly recognizing that meaning is embedded in the filing purpose ("Tax defaulters"). True neutrality regarding inherent meaning would be impossible, as arrangement/titling *are* interpretive acts by the creator.

  2.  **Descendants' Material:** Treating it as "associated" *does* presuppose a hierarchy. Official documents are the core "record" (fixed, authentic evidence of administration). Oral testimony is supplementary context ("associated material"), not equivalent evidence. This reinforces the primacy of the institutional perspective as the foundational record.

  3.  **Underdetermined Practice:** This combination is compatible with rival theories:
      *   **Traditional Custodial (Jenkinson-esque):** Focuses on preserving the *official record* as unimpeachable evidence of action. Descendant material is non-record context.
      *   **Postmodern (Cook, Schwartz):** Recognizes records as products of power but values preserving that *trace of power*. Descendant material offers vital counter-narratives *alongside* the record, challenging its authority without destroying the evidence of its creation.
      *   **Social Justice Archiving (e.g., Caswell):** Sees archives as active sites. Including descendant voices, even separately, acknowledges harm and diversifies perspective, though stopping short of full integration might be seen as insufficient.

  4.  **Concrete Changes:**
      *   **If arrangement/titling are interpretive:** The archive might allow collaborative re-description (adding descendant-created subject headings), create parallel finding aids offering different perspectives on the *same* physical order, or explicitly note the colonial power dynamics inherent in the original titles/order within the catalogue. Neutrality shifts to transparency about context.
      *   **If testimony is simply another record:** The archive would integrate oral histories, family documents, etc., into the *core* collection based on *subject* (person/event), not provenance. Provenance would be meticulously recorded, but the arrangement would prioritize access by the people documented, potentially disrupting the creator's order. Custodial neutrality would be redefined as balancing *multiple* provenances within a single access framework.

  **In essence:** The current practice presupposes that the colonial administrative file is the *definitive record* (hierarchy), its structure/titles are *facts* to be preserved (weaker neutrality avoiding adjudication, not denying context), and descendant knowledge, while valuable, is secondary context. It navigates between traditional evidence-based custody and the need to acknowledge multiple perspectives without fundamentally challenging the primacy of the institutional record as the archive's core object.
