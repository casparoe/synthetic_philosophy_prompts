  Hmm, this is clearly about intellectual property law concepts, specifically copyright's merger doctrine and patent's scope issues. The user's examples perfectly illustrate how these doctrines get manipulated. The hook example is classic merger doctrine in copyright - where functional constraints eliminate alternatives, making expression unprotectedable. But the computer method example shows patent claims being interpreted broadly to cover the abstract idea itself, which isn't supposed to be patentable. 

  The user is sharp - they've noticed how the same abstract/concrete boundary gets distorted in opposite directions depending on the case. They're not satisfied with just doctrine names though; they want the overarching pattern named. The key is that in both scenarios, the boundary manipulation expands control: collapsing it in thin cases to claim ownership of something unprotectable, stretching it in broad cases to claim ownership beyond what should be protected.

  I recall this is essentially a form of "doctrinal opportunism" or "boundary manipulation." The closest established concept is copyright's merger doctrine for the thin case and patent's "preemption" concerns for broad cases. But the user wants the full pattern. "The Abstraction Elasticity Fallacy" might work - defining it as strategically distorting the idea/expression boundary to maximize control. 

  For boundary cases: moderate thickness would avoid both manipulations. If an owner deliberately makes something thin to force merger, that's bad faith doctrine invocation. Important to emphasize this isn't proper application of IP law but an abuse of it. The user will appreciate distinguishing between legitimate doctrine and manipulative rhetoric.
answer: |-
  You've described a profound pattern in intellectual property (IP) rhetoric—a **strategic distortion of the idea/expression dichotomy** that opportunistically expands control. While there's no single universally accepted term for *the full elastic pattern*, the closest established concept is **"doctrinal opportunism"** or **"boundary manipulation"** within IP law. However, to capture the *specific whipsaw effect* you’ve articulated, we might coin the term:  

  ### **"The Abstraction Elasticity Fallacy"**  
  *(or "Doctrinal Boundary Elasticity")*  

  ### Core Definition  
  A rhetorical or legal maneuver where the **distinction between an unprotectable abstract idea and its protectable concrete expression is dynamically stretched or compressed** in service of expanding exclusivity:  
  - **When an idea is "thin"** (highly constrained, functional, or minimal), the proponent *collapses* the boundary, claiming the **concrete instance is the only expression** and thus protectable.  
  - **When an idea is "broad"** (general, functional, or fundamental), the proponent *stretches* the boundary, claiming the **abstract principle itself is the invention** and thus any implementation infringes.  
  **Directionality:** The distortion always favors maximal control for the claimant, regardless of doctrinal consistency.  

  ---

  ### How It Relates to Established Concepts  
  1. **Merger Doctrine (Copyright):**  
     - **What it is:** A copyright principle stating that if an idea can *only be expressed in one or very few ways*, the expression "merges" with the idea and becomes unprotectedable.  
     - **How elasticity abuses it:** Claimants *invoke merger* to argue their *specific* thin expression is protectable (e.g., "Our hook’s shape *is* the idea because function demands it!"). This *inverts* the doctrine’s intent (which aims to *deny* protection in thin cases).  

  2. **Exclusion of Abstract Ideas (Patent/Copyright):**  
     - **What it is:** Fundamental to IP: pure ideas, natural phenomena, and generic methods cannot be owned. Protection requires concrete implementation (patent) or original expression (copyright).  
     - **How elasticity abuses it:** Claimants *ignore* this exclusion for broad ideas (e.g., "Our 'do X with a computer' method *is* the invention—all implementations are ours!").  

  3. **Patent Scope/Claims Breadth:**  
     - **What it is:** Patents protect *specific embodiments* described in claims; overly broad claims risk invalidation for covering abstract ideas.  
     - **How elasticity abuses it:** Claimants treat the patent as covering the *general principle* ("All solutions to this problem are ours!").  

  ---

  ### Boundary Cases & Nuances  
  1. **"Moderately Thick" Ideas:**  
     - **Example:** A chair design with both functional constraints *and* creative flourishes.  
     - **Elasticity Test:** Does the claimant argue the *entire design* is "functional" (collapsing to control)? Or insist *minor variations* still infringe their "core idea" (stretching to control)? If neither extreme applies, elasticity fails.  

  2. **Deliberate "Thinning":**  
     - **Example:** A company designs a product to be as minimalist/functional as possible to force "merger" and deter competitors.  
     - **Elasticity Abuse:** Claimant argues, "Our design is *the only practical solution*—copying it steals our IP!" Ignores that merger should *remove* protection, not grant it.  

  3. **"Broad but Implemented" Ideas:**  
     - **Example:** A patented algorithm with a specific technical improvement, but described broadly.  
     - **Legitimate vs. Elastic:** Legitimate: Protection covers *all technical implementations* of the novel improvement. Elastic: Claimant argues it covers *any solution to the problem*, even non-technical/non-infringing ones.  

  ---

  ### Why "Abstraction Elasticity Fallacy" Fits Best  
  - **Descriptive Accuracy:** It captures the *two-way distortion* (stretch/collapse) of the abstract/concrete boundary.  
  - **Rhetorical Nature:** It’s a *fallacy*—a deceptive argument, not a valid legal doctrine.  
  - **Distinguishes from Doctrines:** It’s the *misuse* of merger/abstraction rules, not the rules themselves.  
  - **Directionality:** Explicitly centers on the *control-maximizing* motive.  

  ### Real-World Context  
  This pattern thrives in:  
  - **Software Patents:** "Do X on a computer" claims (stretched) vs. "Our UI button placement is functional!" (collapsed).  
  - **Design Patents:** "Our simple shape is the only option!" (collapsed) vs. "Any similar shape evokes our design!" (stretched).  
  - **Copyright Trolls:** "Our form contract’s structure is expression!" (collapsed) vs. "All apps using this feature infringe!" (stretched).  

  Courts often reject such elasticity (e.g., *Alice Corp. v. CLS Bank* reined in broad software patents; *Feist v. Rural* denied copyright for functional compilations). Yet claimants persist because the whipsaw can intimidate competitors.  

  ### In Short  
  You’ve identified **IP’s version of "having your cake and eating it too":** manipulating the core limitation of IP (protection ends where abstraction begins) to argue that *abstraction either doesn’t exist or is the very thing owned*. The **Abstraction Elasticity Fallacy** names this double move—a tactical warping of boundaries to claim ownership over the unownable.
