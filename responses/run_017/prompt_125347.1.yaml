  First, I need to understand the core of "wage": it's distinct from pleasure intensity, enjoyment, value judgment, or achievement value. Examples include the dawn swim (hard, memorable) vs. afternoon swim (easy, forgettable), the solved translation, and cleaning someone else's window. The user's deflationary hypothesis (that it's about later licensing) doesn't hold because it's present during solitary, unreported acts. The swap test (offering effort-free version) is tricky because refusal might indicate desire for achievement, not the experience itself.

  The user wants to know if philosophy/psychology has a concept for this. They specifically request: if no term fits, carve out the concept rigorously, distinguish it from neighbors, and clarify edge cases (like grim experiences with "wage," or if it can occur without prior action). Finally, they want a structured table and, if needed, a JSON with a proposed term and practical writing guidance.

  I'll mentally scan relevant concepts:
  - Hedonics (psychology): too focused on pleasure/displeasure valence.
  - Flow: captures absorption but not earnedness.
  - Effort justification: explains post-hoc valuation but not real-time feeling.
  - Desert (philosophy): about moral deservingness, not experiential quality.
  - Achievement: focuses on outcome, not the experience.
  - Meaning: too broad.

  Nothing perfectly fits "wage." Closest is effort justification, but it misses the immediate experiential layer. So I'll need to synthesize a new concept. Key features: 
  - Real-time "paid-for" feeling during effortful/risky acts.
  - Persists in memory vividly.
  - Independent of pleasure or value judgments.
  - Possible without achievement (e.g., futile effort).

  Edge case: the grim cleaning task has "wage" despite low pleasure. Also, can "wage" attach to unearned experiences? User suspects yes – perhaps via identification (e.g., inheriting a hard-won orchard). That requires careful handling in definition.

  For the table, I'll evaluate candidates honestly, showing why each partly fails. For the JSON, I'll propose "experiential equity" as a term, emphasizing the balance-sheet metaphor inherent in "wage." Definition must help novelists show, not tell: e.g., sensory details of effort, or a character's refusal of effortless substitutes. Rendering advice: anchor it in bodily tension or juxtaposed imagery (dirty rag vs. clean pane).

  Biggest challenge: separating "wage" from achievement pride. The translator case is key – the wage is in the struggle, not the solved sentence. I'll use that as a separating case in the table.
