  Based on your meticulous description, I analyzed established concepts from philosophy and psychology. **No single established term perfectly captures the "wage" (the felt earnedness/deservedness of an experience, distinct from pleasure, liking, value judgment, or achievement value).** The closest concepts capture facets but miss the core: a real-time, intrinsic experiential quality arising from perceived cost/effort/risk, independent of hedonic tone or outcome value, and persisting vividly in memory.

  Below is the table evaluating candidates, followed by the carving-out JSON:

  ### Evaluation Table

  | concept                       | provenance                   | what_it_gets_right                                                                 | what_it_misses                                                                                                                               | verdict      | separating_case                                                                                                                                 |
  | :---------------------------- | :--------------------------- | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- | :----------- | :---------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Effort Justification**      | Psychology                   | Links effort to later valuation; explains why costly experiences are remembered/repeated.                                                        | Framed as *post-hoc* cognitive bias, not a real-time experiential quality. Doesn't explain the "wage" felt *during* solitary, unshared acts. | partly fits  | Your translator *while still struggling* with the sentence, feeling the "wage" *before* solving it. Effort justification only applies post-solution. |
  | **Desert (Deservingness)**    | Philosophy                   | Captures normative "earnedness" and entitlement.                                                                 | Primarily a moral/judgmental concept, not a felt quality *of the experience itself*. Focuses on outcomes, not the intrinsic texture of the act. | doesn't fit  | The man cleaning the window *at 4 AM, alone*. He feels the "wage" intrinsically, not because he judges he "deserves" pleasure.                   |
  | **Achievement**               | Both                         | Acknowledges the role of effort/risk in creating valued outcomes.                                                                               | Focuses on the *outcome's* value or pride in success. Your "wage" is present *in the process* (e.g., the swim *during* exertion) and persists even if outcome is mundane (cleaning). | doesn't fit  | The dawn swim *while still in the cold water*, feeling the "wage" *before* finishing the mile or feeling accomplished.                           |
  | **Intrinsic Motivation**      | Psychology                   | Explains engaging in effortful acts for their own sake.                                                           | Doesn't distinguish *why* some intrinsically motivated acts have the "wage" (dawn swim) while other pleasant acts don't (afternoon swim), despite both being intrinsic. | partly fits  | The woman *refusing* an effortless, equally pleasant dawn swim (same intrinsic motivation? but no "wage"). Swap test reveals the difference.      |
  | **Eudaimonia / Meaning**      | Philosophy                   | Connects effort, challenge, and "depth" to a fulfilling life.                                                      | Too broad and value-laden. "Meaning" often implies positive judgment or life-narrative significance. Your "wage" is a specific, immediate, often non-narrative *feeling* tied to cost. | doesn't fit  | The window cleaner feeling the "wage" *while scrubbing*, despite the task being trivial and meaningless in his life story.                       |
  | **Flow**                      | Psychology                   | Captures deep absorption, loss of self-consciousness, intrinsic reward in challenging activities.                 | Focuses on the *state* of absorption and enjoyment. Your "wage" can exist in *unpleasant* effort (dawn swim) and persists distinctly *in memory* even if flow wasn't achieved. | partly fits  | The grim, unpleasant dawn swim having the "wage" *despite* lacking flow's enjoyment and seamless absorption.                                     |
  | **Hedonic Reward (Effort Discounting)** | Psychology          | Studies how effort reduces *reported* pleasure (opposite of your observation).                                     | Focuses purely on *hedonic impact*, showing effort makes things *less* pleasant. Your "wage" is orthogonal to pleasure. It can co-exist with low pleasure. | doesn't fit  | The dawn swim being reported as *less pleasant* than the afternoon swim, yet possessing the "wage" the latter lacks.                             |

  ### Synthesis & Carving Out: "Experiential Equity"

  Since no established concept fits, here is the carved-out definition and guidance:

  ```json
  {
    "term": "Experiential Equity",
    "definition": "The immediate, non-cognitive *feeling* within an experience that it has been 'paid for' through prior effort, risk, or cost, distinct from its pleasantness, enjoyment, or judged value, and which imbues it with a lasting vividness in memory.",
    "paradigm_case": "A translator, midway through a grueling, frustrating week-long struggle with a single sentence, feels a specific, grounding intensity *in* the struggle itself – not pleasure, not hope of success, but the sense of earned presence – before the sentence resolves.",
    "contrast_case": "The same translator effortlessly reading a perfectly translated passage of equal beauty and pleasure, enjoying it more, but feeling no 'equity' and forgetting it quickly.",
    "boundary_case": "A character eats an apple they found; it tastes ordinary. Later, they learn it grew from a tree their grandfather planted after decades of hardship. Does the *memory* of eating it now carry Experiential Equity? (Hesitation: The 'payment' is known but not *felt* as a quality of the eating experience *itself*; it risks becoming narrative meaning or inherited pride, not intrinsic experiential texture.)",
    "commonest_confusion": "Mistaking it for pride in achievement, the relief of completion, moral deservingness, or the delayed pleasure of effort justification. Key separators: Presence *during* effort, independence from success/value judgments, vivid memory trace.",
    "how_to_render_it": "Render it through the character's somatic awareness during the costly act (weight of limbs, texture of resistance, a specific type of fatigue), the stark refusal of a painless substitute, or the sharp, sense-laden recall of the effortful moment *without* focusing on outcome or pride."
  }
  ```

  ### Key Clarifications from Your Edges

  1.  **Grim, Barely Pleasant Cases:** These *do* belong. Experiential Equity is defined by the *felt cost*, not the pleasure. The window cleaning is the paradigm. The "wage" is the texture of the cost itself being registered as grounding or legitimizing the experience, regardless of hedonic tone.
  2.  **Without Prior Action?** Yes, potentially. Consider:
      *   **Inherited Equity:** A character enters a beautiful, hard-won orchard cultivated by their ancestors. They *feel* the weight of the history in the scent of the blossoms and the texture of the path in a way a visitor wouldn't, despite doing nothing themselves. (This hinges on identification making the past effort *theirs* experientially).
      *   **Bestowed Equity:** A soldier is given a medal earned by their fallen comrade. Holding it, they don't feel pride (it's not their achievement), but a profound, heavy sense of the *cost paid* embedded in the metal – a feeling absent if given an identical replica. The "wage" belongs to the comrade but is *felt* by the recipient as a quality of interacting with the object.

  ### Rendering it in Prose: Core Principles

  1.  **Focus on the During:** Don't state the feeling. Show the character *in* the effort/risk, attending to the sensations *of* the cost (the burn, the grit, the frustrating loop, the predawn chill) in a way that signals *this is mine because I am paying for it right now*.
  2.  **The Refusal is Key:** Show the character rejecting the effortless version not with words about achievement, but with a visceral recoil or a sense that the offer *diminishes* the authentic experience ("It wouldn't be the same lake").
  3.  **Memory as Sensory Echo:** When recalling, don't focus on "I did it!" or the outcome. Focus on the vivid resurgence of the *sensory details of the effort itself* (the specific ache in the shoulders years later, the smell of the cleaning solution, the exact shade of pre-dawn grey on the water) as possessing a present weight the easier memory lacks. The *texture* of the cost is what persists.

  Use "Experiential Equity" as your lens. It captures the earnedness *as a felt quality within the moment*, distinct from pleasure, value, or success, and explains the persistent vividness of the costly experience in memory. Render it by making the cost *palpable* and the refusal of its absence *instinctive*.
