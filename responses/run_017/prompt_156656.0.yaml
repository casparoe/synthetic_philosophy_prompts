answer: |-
  **Memo to Hallam Trust Board Members**  

  I propose we immediately rename both the prize and reissue series, dissociating them from Octavia Hallam’s name while retaining her endowment. The prize should become the *Hallam Trust Historical Fiction Prize*, and the reissue series the *Hallam Trust Editions*. Concurrently, we adopt a forward-looking policy: all future named bequests will fund programs under the Trust’s institutional identity, not the donor’s name. The historical context of Hallam’s views—and those of subsequent benefactors—will be addressed transparently in *annual reports*, *website archives*, and occasional *public essays* commissioned by the Trust, ensuring scrutiny without embedding contested legacies into ongoing cultural acts.  

  **Why Renaming Resolves the Immediate Crisis**  
  The "staple a note" approach fails because it conflates *archival honesty* with *contemporary honorifics*. A prize bearing Hallam’s name in 2024 functions as a tacit endorsement, regardless of appended caveats. As you noted, applicants see our guidelines as a model for "period-truthfulness"; if we outsource moral reckoning to a footnote, we implicitly endorse the notion that regressive views are absolved by historical context. Conversely, removing her name is not "erasure" but *functional dissociation*: we retain her funds to support literature while refusing to perpetuate her as a symbolic standard-bearer. The Trust’s mission—reviving neglected voices—is undermined when its public face is someone who actively sought to silence marginalised groups.  

  **A Rule for Future Bequests: The Institutional Shield**  
  For the incoming bequests, we adopt this standard: **Named donations fund programs under the Hallam Trust umbrella, not under the donor’s personal brand.** This preempts recurring debates about historical culpability by centering the Trust’s present-day values. The "reachable-dissent" rule, while intellectually elegant, collapses under scrutiny. If we require dissenters to be "recognizably right" by today’s standards to establish culpability, we retrofit history through a progressive lens. Hallam’s anti-migrant essays *were* contested in the 1940s–50s by figures like George Orwell (who critiqued xenophobia as "national self-worship") and refugee-aid organizations. Yet dissent alone is irrelevant; what matters is that her views contravene the Trust’s *current* mandate to amplify marginalized narratives. Our duty is not to adjudicate her soul but to steward resources ethically *now*.  

  **Timeline & Responsibilities (May–June AGM)**  
  1. **By May 10** (Chair + Executive Director):  
     - Draft renamed program guidelines (Prize → *Hallam Trust Historical Fiction Prize*; Reissues → *Hallam Trust Editions*).  
     - Secure legal confirmation that renaming complies with endowment terms.  
  2. **By May 24** (Communications Subcommittee):  
     - Prepare public rationale: "The Trust honors its founding purpose by redirecting focus from its benefactor’s legacy to its mission: unearthing historically silenced voices."  
     - Archive Hallam’s contested essays + critical responses on our website’s "History" section.  
  3. **June AGM** (Full Board):  
     - Vote on renaming + new bequest policy.  
     - Approve commissioning an essay (for 2025) on "Hallam in Context: Funding Art Amid Problematic Legacies."  

  **Why This Answers the Applicant’s Dilemma**  
  You rightly note that our decision signals how writers should handle "period-true" characters. Renaming Hallam’s prize demonstrates that **historical authenticity ≠ moral neutrality**. When we render a character with regressive views, we must:  
  - **Contextualize, not sanitize**: A protagonist might espouse bigotry plausible for their era, but the narrative should frame it as *flawed* (e.g., through countervailing characters, structural consequences).  
  - **Interrogate "reachable dissent" creatively**: If a 1790s character claims enslaved people are "naturally inferior," show them encountering abolitionist pamphlets or slave rebellions—then explore *why they reject dissent*.  

  Hallam’s own work proves this possible: her novels *depicted* misogyny while *critiquing* it. Our rule affirms that "true to period" means honest about prejudice, not complicit in it.  

  **Conclusion**  
  We cannot resolve whether Hallam "should have known better." But we control whether her name overshadows the voices she scorned. Renaming the programs asserts that the Trust’s work transcends its founder; archiving her flaws models how historical fiction can confront uncomfortable truths. The two incoming bequests will test this—let our action today set precedent: funds accepted, legacies examined, but endorsement reserved for values we uphold *now*.  

