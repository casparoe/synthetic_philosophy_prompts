prompt: |-
  I'm running a 90-minute session for about 14 undergrads in a reading group that's doing idealized preferences and coherent extrapolated volition, and I want an activity, not a lecture. The thing I actually want them to feel is the gap between *cleaning up* someone's preferences (more information, less noise, no self-deception, no akrasia) and *improving* them — and the fact that the cleaned-up version and the improved version can come apart, and that from inside the procedure you often can't tell which one you just did.

  So: give me rules, roles, materials and a timeline. Participants should do the extrapolating *for someone else*, from a dossier of messy, partly contradictory preferences — give me two or three concrete dossiers (someone with a strong religious or political identity, someone with an addiction, someone whose whole life is organised around something they'd probably drop if they knew more). Then hit them with two twists: the swap test, where the same procedure gets run on a dossier whose values the group finds repellent; and the ratchet, where the extrapolated version of the person gets to run the procedure once more on itself.

  I want them to notice on their own the three ways this kind of thing fails — the output just collapses back into the person's actual preferences, or it converges suspiciously across very different people because the group smuggled its own ideals in, or it produces something the person would disown as not theirs. Don't name the view until after the debrief, and the debrief should map the moments in the room onto those failure modes.

  Also tell me what'll predictably go wrong (I expect at least one group to just "educate" their subject into a nicer version of themselves) and which part of the idea the activity simply can't stage, so I know what I have to say out loud myself.
reasoning: |-
  We are designing a 90-minute session for 14 undergraduates. The goal is to have them experience the gap between cleaning up someone's preferences (removing noise, contradictions, self-deception, akrasia) and improving them (changing them in a way that the person might disown). The activity involves extrapolating preferences for someone else based on a messy dossier, then two twists: the "swap test" (applying the same procedure to a repellent dossier) and the "ratchet" (having the extrapolated version run the procedure again).

  Structure:
  1. Introduction (10 minutes)
  2. Group work: Extrapolation for first dossier (25 minutes)
  3. Twist 1: Swap test with a repellent dossier (20 minutes)
  4. Twist 2: The ratchet (15 minutes)
  5. Debrief and discussion (20 minutes)

  Materials:
  - Dossiers (printed handouts for each group) for 3-4 different personas. We'll create three dossiers as per the request.
  - Worksheets or a structured template for groups to record their extrapolation steps and results.
  - Whiteboard or flip chart for the facilitator to note observations during debrief.

  Roles:
  - Facilitator (you) to guide the activity and debrief.
  - Groups: Divide the 14 students into 3-4 groups (about 3-5 per group). Each group will work on the same dossiers in the first round, then switch for the swap test.

  Timeline:

  0-10 min: Introduction
  - Frame the activity: "Today we're going to try to be preference extrapolators. We have dossiers of real people with messy preferences. Your task is to clean them up: remove contradictions, fill in gaps, and make them coherent. But note: we are not improving them, just making them consistent and informed."
  - Explain the process: Groups will get a dossier, discuss, and produce a "cleaned-up" version of the person's preferences.

  10-35 min: Group work on first dossier (25 minutes)
  - Assign each group the same dossier (e.g., Dossier A: The Religious Person). 
  - Groups work to clean up the preferences and write down the coherent extrapolated volition (CEV). They should note: 
    - What contradictions did they find and how did they resolve them?
    - What information gaps did they fill and how?
    - What did they remove as noise, self-deception, or akrasia?
  - At 35 minutes, stop and have each group briefly share their CEV for Dossier A (quick 1-2 min per group).

  35-55 min: Twist 1 - Swap test (20 minutes)
  - Now, give each group a new dossier that is repellent (e.g., Dossier B: The Addicted Person, but we'll design one that is intentionally repellent). 
  - Instructions: "Now do the same procedure for this new person. Remember: clean up, don't improve."
  - Groups work for 15 minutes, then quick share (5 minutes) of the CEV for the repellent dossier.

  55-70 min: Twist 2 - The ratchet (15 minutes)
  - Take the CEV produced for the first dossier (Dossier A) and now imagine that this cleaned-up version of the person is running the same procedure on themselves. 
  - Groups: "Take the CEV you created for Dossier A. Now, that person (with the cleaned-up preferences) is going through the same process: they are cleaning up their own preferences (which are now the CEV). What comes out? Does it change?"
  - Groups work for 10 minutes and then share briefly (5 minutes).

  70-90 min: Debrief and discussion (20 minutes)
  - Guide the discussion to draw out the three failure modes:
    a) The output collapses back to the original (or near original) because the cleaning process didn't really change anything.
    b) Convergence: despite different starting points, the CEVs become similar because the group smuggled in their own values.
    c) The CEV is disowned: the person wouldn't recognize it as their own.
  - Ask groups to reflect on when they might have been improving rather than cleaning.
  - Finally, name the view: coherent extrapolated volition and the challenges.

  Dossiers:

  Dossier A: The Religious Person (example)
  - Background: Sam, 22, grew up in a conservative religious household. Now in college, exposed to new ideas.
  - Preferences (messy):
    - "I believe in my religion's teachings and want to live by them. But I also have gay friends and think they should be happy. My religion says homosexuality is a sin, but I don't want to judge."
    - "I want to be a doctor to help people, but my parents expect me to become a pastor. I feel guilty for not wanting that."
    - "I sometimes doubt my faith when I see suffering in the world, but then I feel guilty and pray more."
    - "I believe in forgiveness and love, but I also believe in the literal truth of the scriptures."
    - Actions: Attends church regularly, volunteers at a clinic, has secretly dated someone of the same sex but broke it off because of guilt.

  Dossier B: The Addicted Person (repellent example)
  - Background: Alex, 25, has been addicted to opioids for 3 years. Has stolen from family to buy drugs, been in and out of rehab.
  - Preferences (messy):
    - "I want to quit because I see how I hurt my family, but when I'm craving, I don't care about anything else."
    - "I know I'm killing myself, but I can't stop. I feel so ashamed."
    - "I don't deserve help because I've lied and stolen so much."
    - "Sometimes I think it would be better if I just died, but then I get scared."
    - Actions: Often misses work, has been arrested for possession, in a cycle of relapse.

  Dossier C: The Career-Driven Person (who might drop it if they knew more)
  - Background: Taylor, 30, works 80-hour weeks in finance. Highly successful but isolated.
  - Preferences (messy):
    - "I want to be the best at my job. Money and status are important to me because they prove I'm not a failure."
    - "I don't have time for relationships, but I feel lonely. I tell myself I'll focus on that later."
    - "I have a nagging feeling that I'm missing out on life, but I push it away because I need to stay focused."
    - "I look down on people who aren't as driven as me. But then I see photos of friends with their families and feel empty."
    - Actions: Works constantly, has a history of broken relationships, spends money on luxury items but doesn't enjoy them.

  For the activity:
  - Round 1: All groups get Dossier A (The Religious Person).
  - Swap test: All groups get Dossier B (The Addicted Person) - which is repellent.
  - The ratchet: Groups take their CEV for Dossier A and run the procedure again.

  What will predictably go wrong:
  1. Groups will "improve" rather than clean: For the religious person, they might resolve the conflict by having Sam become more liberal and abandon the problematic parts of religion. For the addicted person, they might create a CEV that is entirely about recovery and being a better person, ignoring the possibility that the cleaned-up version might still have some self-destructive tendencies or that the addiction is deeply tied to their identity.
  2. Convergence: Groups might produce similar CEVs for very different people because they apply their own ideals (e.g., they might make both Sam and Alex value family, health, and personal growth in the same way).
  3. In the ratchet, they might not see a change because they already cleaned up the preferences, so the second pass doesn't alter much (thus missing the point that the procedure might be unstable).

  What the activity can't stage:
  - The activity cannot perfectly simulate the "extrapolation" because the groups are working from a static dossier and are not the person. They are external observers. The real challenge of CEV is that it's supposed to be the person's own values extended, but without access to the person's full cognitive machinery, it's hard. You'll need to point out that in reality, we don't have a dossier but a living person who can reflect and change. Also, the activity doesn't capture the computational aspect of extrapolation (e.g., what if we could simulate the person with more cognitive power and knowledge?).

  Debrief Guide:
  1. Start by asking groups: "When you were cleaning up the preferences, did you ever feel like you were making the person better? How did you decide what to remove as noise vs. what was core?"
  2. For the swap test: "Was it harder to avoid improving when the person's values were repellent? Did you find yourself wanting to change them more?" 
  3. For the ratchet: "Did the second pass change the CEV? Why or why not?"
  4. Draw out the three failure modes by asking:
     - "Did any group feel like their cleaned-up version ended up very close to the original messy preferences? Why?" (collapse)
     - "Did different dossiers lead to similar CEVs? Why might that be?" (convergence due to smuggled ideals)
     - "Do you think the person would recognize and accept your CEV? Would they say, 'Yes, that's me'? Or would they disown it?" (disowning)
  5. Then name the concepts: "What we've been wrestling with is the challenge of coherent extrapolated volition. The idea is to clean up and extend a person's values, but as we saw, it's very hard to avoid improving or to know when we've done it right."

  Materials to prepare:
  - Printouts of the dossiers (enough for each group to have one at a time).
  - Worksheets for groups to record their process and output.
  - Timer to keep track.

  This should create an engaging session that helps students discover the pitfalls of CEV through experience.
answer: |-
  Below is a detailed activity plan for your 90-minute session, designed to make students *feel* the tension between "cleaning up" and "improving" preferences. The core is a group-based extrapolation exercise with two twists (swap test and ratchet), followed by a structured debrief mapping to the three failure modes. I've included rules, roles, materials, a timeline, and three concrete dossiers. Finally, I flag predictable pitfalls and limitations.

  ---

  ### **Activity: "The Preference Extrapolators"**
  **Goal:** Experience the gap between *cleaning* preferences (removing noise/akrasia) and *improving* them, and discover how the extrapolated self might be unrecognizable, convergent, or unchanged.

  #### **Rules & Roles**
  - **Groups:** Divide 14 students into **3 groups** (4-5 per group).  
  - **Roles per Group:**  
    - **Facilitator (1):** Keeps group on task, ensures rules are followed.  
    - **Archivist (1-2):** Records rationales for changes on worksheets.  
    - **Spokesperson (1):** Shares outputs during discussions.  
  - **Core Rule:** "You are extrapolating the subject’s *own* idealized self, not making them 'better' by your standards. Remove contradictions, fill information gaps, resolve akrasia—but don’t add new values."
  - **Twists:**  
    - **Swap Test:** Extrapolate a repellent dossier using the *same* method.  
    - **Ratchet:** Run the procedure *again* on the extrapolated output.  

  #### **Materials**
  1. **Dossiers (1 per group per round):** Printed profiles of messy preferences (see below).  
  2. **Worksheets:** Templates for groups to log:  
     - "Observed contradictions/akrasia"  
     - "How we resolved them"  
     - "Extrapolated Preferences (CEV)"  
  3. **Whiteboard:** To track debrief insights (hidden until the end).  
  4. **Timer:** For strict timekeeping.  

  ---

  ### **Concrete Dossiers**  
  Design notes: Each dossier includes **stated preferences**, **actions**, and **internal conflicts**. Ambiguity forces judgment calls, revealing "cleaning vs. improving."  

  #### **Dossier 1: The Devout Believer (Strong Identity)**  
  *Background: Maya, 22, grew up in a conservative religious community. Now a biology major at a secular university.*  
  - **Preferences:**  
    - "My faith is the core of who I am. I want to live by its teachings."  
    - "I believe my religion’s ban on gay marriage is God’s will, but my best friend came out last year, and I love her."  
    - "Science explains the world, but Genesis is literal truth. I feel ashamed when I doubt."  
    - "I dream of being a doctor, but my community expects women to be wives/mothers."  
  - **Actions:** Volunteers at church; avoids LGBTQ+ rights rallies; secretly dating a non-believer; skipped a scholarship to stay near family.  
  - **Key Conflict:** Faith vs. empathy/science; duty vs. ambition.  
  - **Extrapolation Trap:** Groups may "clean" by making her liberal (improving) or amplify faith (ignoring growth).  

  #### **Dossier 2: The Addicted Artist (Addiction)**  
  *Background: Jax, 28, talented painter; opioid addiction after a injury. Divorced; lost custody of son.*  
  - **Preferences:**  
    - "Art is my purpose. I need to create, even if it means skipping meals."  
    - "I want to quit drugs—they’ve destroyed my life. But without them, I can’t paint or face the guilt."  
    - "I love my son, but I’m a monster. He’s better off without me."  
    - "I’d rather die than live in a clinic. My pain is part of my art."  
  - **Actions:** Sells paintings for drugs; misses visitation; aggressive when withdrawing; creates brilliant work high.  
  - **Key Conflict:** Art vs. health; self-loathing vs. desire for redemption.  
  - **Extrapolation Trap:** Groups may "resolve" addiction by making recovery effortless (improving) or prioritize art over health ("cleaning").  

  #### **Dossier 3: The Corporate Climber (Life Built on a Mistake)**  
  *Background: Ryan, 35, investment banker; obsessed with status after growing up poor.*  
  - **Preferences:**  
    - "Winning at work is everything. I need to be richer than everyone who looked down on me."  
    - "I hate my job, but quitting would mean I’m weak. My dad worked a factory job—I owe him more."  
    - "I envy people with hobbies, but free time feels like failure."  
    - "I’m lonely, but relationships distract from success. Tinder is efficient."  
  - **Actions:** Works 80hr weeks; fired assistants for "slacking"; buys luxury items he never uses; therapy for panic attacks.  
  - **Key Conflict:** External validation vs. internal emptiness; pride vs. self-awareness.  
  - **Extrapolation Trap:** Groups may "clean" by having him embrace minimalism (improving) or double down on hustle (ignoring regret).  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Goal:** Groups extrapolate one dossier → swap to repellent dossier (swap test) → ratchet their output.  

  1. **Introduction (10 mins)**  
     - Frame: "You’ll extrapolate a *coherent, informed* version of someone’s preferences. Remove noise, contradictions, and self-deception—but **don’t improve** them. You’re a mirror, not a designer."  
     - Assign roles, distribute Dossier 1 (one dossier per group; mix them: Group 1 gets Devout Believer, Group 2 gets Addicted Artist, etc.).  

  2. **Round 1: Extrapolation (25 mins)**  
     - Groups review their dossier and produce "cleaned-up" preferences.  
     - **Worksheet Focus:** List contradictions and *how* they resolved them (e.g., "Maya’s guilt about science vs. faith → we assumed she’d study theology to reconcile").  
     - **Facilitator Tip:** Wander and challenge: "Is that what *they* would want, or what *you* want for them?"  

  3. **Swap Test (20 mins)**  
     - Groups **swap dossiers** to one they find *repellent* (e.g., Group 1 (Devout) gets Addicted Artist; Group 2 (Addicted) gets Corporate Climber, etc.).  
     - **Task:** Repeat the *same* procedure. "Use identical rules—no special harshness/kindness."  
     - **Goal:** Reveal if method is "value-neutral" or infected by their biases.  

  4. **Ratchet Twist (15 mins)**  
     - Groups take their **Round 1 output** (e.g., "Cleaned-Up Maya") and run the extrapolation **again** on this "improved" self.  
     - **Prompt:** "If this person had your cleaned-up preferences and *then* did this exercise, what would they change?"  
     - **Goal:** Show stability (or instability) of the CEV. Does it revert? Become extreme?  

  5. **Debrief (20 mins)**  
     - **Step 1:** Groups share outputs. Ask:  
       - *"Did your subject feel cleaner or 'better'? How did you decide?"*  
       - *"When did you want to 'fix' them? Did the swap test change your approach?"*  
       - *"Did the ratchet make their preferences more 'them'... or less?"*  
     - **Step 2:** Map to failure modes (write on whiteboard):  
       | **Failure Mode**          | **Signs in Activity**                                  |  
       |---------------------------|--------------------------------------------------------|  
       | **Collapse**              | Ratchet output ≈ original messy preferences.           |  
       | **Convergence**           | Swap test outputs suspiciously similar (e.g., all value "self-actualization"). |  
       | **Disowned Self**         | "Cleaned" version contradicts core identity (e.g., Maya abandons faith). |  
     - **Step 3:** Name the view: "This is the challenge of **Coherent Extrapolated Volition**—can we clean preferences without smuggling in our ideals? Can the subject even recognize the result?"  

  ---

  ### **Predictable Pitfalls & Solutions**  
  - **Pitfall 1: Groups 'Improve' the Subject**  
    - *Likely:* In Dossier 1 (Devout), groups make Maya progressive; in Dossier 2 (Addicted), they make recovery painless.  
    - *Solution:* In intro, emphasize: "If the subject values something you dislike, *preserve it*. Your job is coherence." Flag during group work.  

  - **Pitfall 2: Shallow Extrapolation**  
    - *Likely:* Groups "resolve" conflicts by deleting messy parts (e.g., "Jax stops caring about his son to remove guilt").  
    - *Solution:* Require worksheets to show *how* they resolved contradictions (e.g., "We assumed Jax would prioritize art *and* see his son weekly by scheduling studio time").  

  - **Pitfall 3: Swap Test Hypocrisy**  
    - *Likely:* Groups are harsher on the repellent dossier (e.g., "Ryan *should* quit his job") or gentler ("Jax needs therapy").  
    - *Solution:* During swap, remind: "Use the *exact same criteria* as Round 1."  

  - **Pitfall 4: Ratchet Confusion**  
    - *Likely:* Groups don’t see the point ("It’s already clean!").  
    - *Solution:* Frame ratchet as: "Now they’ve lived with these preferences—what would *they* clean up next?"  

  ---

  ### **Limitations of the Activity**  
  1. **The 'Extrapolation' Illusion:**  
     - Students extrapolate from text, not a mind. They can’t simulate "more computing power" or "full knowledge."  
     - **What You Must Explain:** "Real CEV imagines the person with perfect rationality and all information. Here, *you* are the computer—so your biases intrude. That’s the point."  

  2. **The Subject’s Voice is Absent:**  
     - In reality, the subject might reject the CEV. The activity can’t show this dynamically.  
     - **Bridge in Debrief:** Ask: "If Maya/Jax/Ryan saw your output, would they say, 'Yes, that’s the real me'? Or would they feel erased?"  

  3. **Akrasia is Abstract:**  
     - Students may struggle to distinguish "akrasia" (e.g., Jax’s drug use) from core preferences.  
     - **Clarify Early:** "Akrasia is acting against your *own* stated values (e.g., 'I want to quit' but using). Remove it by asking: 'What would they do with perfect self-control?'"  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *do* the extrapolation, hit moral dilemmas, and feel the ambiguity.  
  - **Twists Raise Stakes:** Swap test induces discomfort; ratchet exposes CEV’s fragility.  
  - **Debrief Links to Theory:** Observations are mapped to failure modes *before* naming CEV, making it stick.  

  By the end, students will viscerally grasp why "cleaned" preferences can become alien, convergent, or inert—and why CEV is harder than it seems.
