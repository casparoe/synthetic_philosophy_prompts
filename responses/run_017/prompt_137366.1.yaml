prompt: |-
  Hey — I'm in a tiny self-taught reading group working through decision theory (we've done Newcomb, the smoking lesion, counterfactual mugging, and this week we got to updateless decision theory, the Wei Dai one) and I think I've hit a problem with it that nobody in the group could anwser, so I'm outsourcing it.

  As I understand it, UDT says: choose the best *policy*, where a policy is a mapping from observations to actions, and rank candidate policies by their expected utility according to your prior rather than your posterior — the formulation we were working from literally just drops the conditioning on the observation, which is supposed to be why UDT one-boxes in Newcomb and pays up in counterfactual mugging instead of wimping out like CDT and EDT do. But here's what I can't get past: if the evaluation never conditions on what I actually observed, then doesn't UDT end up committed to ignoring evidence altogether? Whatever I learn later, the winning policy was already settled in advance, so a UDT agent should behave the same whether or not the news ever arrives — which sounds insane. My friend made up a case that he thinks sharpens it: you get scanned and copied, and the two copies wake up in identical rooms except one has a red light on and the other a blue one, assigned by a fair coin, and each copy is told that the other got the other colour. Both copies face the same choice, press A or press B. Payoffs: if and only if the red-room copy presses A and the blue-room copy presses B, each gets $1000; every other combination pays both of them nothing. (His nastier variant: with probability 10% a glitch makes both lights red, so a copy seeing red doesn't know whether it's the red copy or in a glitch world.) The sensible thing here is plainly for the two copies to do different things, and the only way to pull that off is for the policy to be sensitive to which light you see — but UDT is supposed to be *updateless*. So either it tells the copies to ignore the lights and throws away $2000 for no reason, or it does let the action depend on the observation, and then I have no idea what 'updateless' is doing any more or how this isn't just ordinary causal decision theory with Bayesian updating bolted on, which is exactly what we were told UDT was meant to replace. He also keeps saying something like 'UDT updates its beliefs but not its decisions', and I genuinely can't tell whether that's a real distinction or just wordplay.

  Can you spell out what's actually going on — in the red/blue case specifically, what would a UDT agent do and why, and where exactly does the prior-weighted evaluation bite as opposed to the observation-sensitivity of the policy? And does any of this make a difference for completely boring everyday choices with no predictor and no copying, like whether to take an umbrella, or is the whole apparatus only doing work in sci-fi setups? Sorry if this is a well-worn question, we're kind of teaching ourselves and we've already confused each other twice.
reasoning: |-
  Okay, let me try to unpack this user's question. They're in a self-taught reading group on decision theory, currently on Updateless Decision Theory (UDT). Their confusion revolves around how UDT can be updateless yet still use observations in policies. The red/blue copy scenario highlights this tension: if UDT chooses policies without conditioning on observations, how can it respond to the light color?

  First, I need to recall UDT's core mechanism. UDT evaluates policies, which map observations to actions, based on the prior. But the policy itself can condition actions on observations. That's key. In Newcomb's problem, the policy might be "if predicted to one-box, one-box" but since the prediction is perfect, it's effectively committing to one-boxing. The prior evaluation considers all possible worlds, including different predictions.

  Now, the red/blue copy case. Each copy must choose A or B based on the light. The payoff requires the red copy to pick A and blue to pick B. If UDT ignores the light, they'd both do the same thing and get nothing. But the user thinks UDT must ignore evidence because it's updateless. However, UDT's policy can include the light color as input. The prior evaluation would consider all possibilities: both red (glitch), red and blue, or both blue. The best policy specifies different actions for each observation, maximizing expected utility across these scenarios.

  The glitch variant adds complexity. If a copy sees red, it might be alone or with a blue copy. The optimal policy still conditions on the light but accounts for the glitch probability. For example, seeing red, it should probably still choose A because the chance of a glitch is low. The policy's action depends on the observation, but the choice of which policy to adopt is made before knowing the observation.

  Everyday decisions like taking an umbrella also use UDT. The policy could be "if rain forecast, take umbrella." The prior evaluates this policy's expected utility, considering forecast accuracy and outcomes. Even though we update beliefs upon seeing the forecast, the policy itself is fixed beforehand. This shows UDT applies beyond thought experiments.

  The user's friend mentions "UDT updates beliefs but not decisions." This refers to belief updating within the utility calculation for each policy. When evaluating a policy, UDT uses the prior to compute expected utility, which includes updating beliefs for hypothetical scenarios. But the policy selection is updateless—decided once based on the prior.

  So, the key is distinguishing between selecting a policy (updateless, based on prior) and executing the policy (which uses observations). In the copy scenario, the policy that maps red to A and blue to B is chosen because, under the prior, it has higher expected utility. Each copy then follows this policy based on their observation, achieving coordination without real-time updating of the policy itself.
answer: |-
  You've hit on a core conceptual tension in UDT, and your friend's red/blue light scenario is an excellent test case. Let's break it down step-by-step, addressing UDT's mechanism, the red/blue case, and everyday applications.

  ### Core UDT Mechanism: Policies and Prior Evaluation
  1.  **Policy, not Actions:** UDT doesn't choose individual actions directly. It chooses a *policy function* `f` *before* any observation. This function maps possible future observations `X` to actions `A`: `A = f(X)`.
  2.  **Updateless Evaluation:** UDT ranks candidate policies `f` based on their **expected utility according to your prior probability distribution** over the entire state of the world (including how you came to exist, predictors, coins, other copies, etc.). Crucially, this evaluation **does not condition on the actual observation `X` you *will* receive.** It sums utility over *all possible worlds* weighted by their prior probability.
  3.  **Observation-Sensitive Policies are Key:** The magic is that the *candidate policies themselves* (`f`) are allowed to be sensitive to the observation `X`! UDT isn't ignoring observations; it's *committing in advance* to how it will *use* observations when they arrive. The "updateless" part refers to *how the policy is selected* (using the prior), not to how the *selected policy* behaves (which absolutely uses observations).
  4.  **Belief Updating *Within* Evaluation:** When evaluating a candidate policy `f` under the prior, UDT *does* perform belief updating *hypothetically* for every possible observation `X` that `f` might encounter. It calculates: "If I use policy `f`, and I observe `X`, what would I believe then (via Bayes' theorem), and what action `A = f(X)` would I take, and what would be the expected utility *given that I saw `X` and took `f(X)`*?" It then takes the *average* of these scenario-specific expected utilities, weighted by the prior probability of each observation `X` occurring.

  **Why this makes UDT one-box/pay-up:**
  *   **Newcomb:** The best policy (under the prior) is `f(Boxes Empty?) = Take One Box`. Evaluating this policy involves scenarios where the predictor filled the box (high prob) and where it didn't (low prob). The high probability of the predictor being right means the average utility of this policy is higher than `f(Boxes Empty?) = Take Two Boxes`, even though *if* you observed the boxes empty, taking two boxes *in that specific scenario* would be better. UDT locks in the one-boxing policy *because* of its high *average* performance.
  *   **Counterfactual Mugging:** The best policy is `f(Coin = Heads?) = Pay if Tails`. Evaluating this policy involves scenarios where the coin is Heads (Omega ignores you) and Tails (Omega asks). The potential huge gain in the Tails scenario outweighs the small loss in the Heads scenario on average.

  ### Solving the Red/Blue Light Scenario (Standard Version - No Glitch)
  1.  **The Setup:** Two identical copies created, coin flip: Heads (Copy1=Red, Copy2=Blue), Tails (Copy1=Blue, Copy2=Red). Payoff: $1000 each *only* if Red-room presses A *and* Blue-room presses B.
  2.  **Candidate Policies:** The agent (before being copied) considers possible functions `f(Light Color) -> Press A or Press B`. Key candidates:
      *   `f_ignore(Light) = A` (Always A)
      *   `f_ignore(Light) = B` (Always B)
      *   `f_coordinate(Red) = A; f_coordinate(Blue) = B`
      *   `f_wrong(Red) = B; f_wrong(Blue) = A`
  3.  **Prior Evaluation (No Observation Yet!):**
      *   **Always A:** In Heads world (C1=Red, C2=Blue): C1 (Red) does A (good), C2 (Blue) does A (BAD). Payoff $0. In Tails world (C1=Blue, C2=Red): C1 (Blue) does A (BAD), C2 (Red) does A (good). Payoff $0. **Average EU = $0.**
      *   **Always B:** Similar reasoning. Both copies press B regardless of light. Payoff only if a Blue copy *should* press B *and* the Red copy *also* presses B (BAD). **Average EU = $0.**
      *   **Coordinate (`f_coordinate`):** In Heads world (C1=Red, C2=Blue): C1 sees Red -> A, C2 sees Blue -> B. **PAYOFF $2000**. In Tails world (C1=Blue, C2=Red): C1 sees Blue -> B, C2 sees Red -> A. **PAYOFF $2000**. **Average EU = $2000.**
      *   **Wrong (`f_wrong`):** In Heads: C1(Red) -> B (BAD), C2(Blue) -> A (BAD). Payoff $0. In Tails: C1(Blue) -> A (BAD), C2(Red) -> B (BAD). Payoff $0. **Average EU = $0.**
  4.  **The Winning Policy:** `f_coordinate(Red)=A, f_coordinate(Blue)=B` has the highest expected utility ($2000) under the prior.
  5.  **Execution:** The agent commits to `f_coordinate` *before* being copied/split. Each copy, upon waking up and observing its light:
      *   Copy in Red Room: `A = f_coordinate(Red) = Press A`
      *   Copy in Blue Room: `A = f_coordinate(Blue) = Press B`
  6.  **Result:** Coordination achieved. $1000 each.

  **Where the Prior Bites vs. Observation Sensitivity:**
  *   **Prior Bite:** The *selection* of `f_coordinate` over `f_ignore` or `f_wrong` is done using the *prior average*. It doesn't matter "which copy I am"; the policy is chosen because it works best *across all possible copies and coin flips*.
  *   **Observation Sensitivity:** The *execution* of the *selected policy* (`f_coordinate`) is fundamentally sensitive to the observation (`Light Color`). This isn't bolted-on updating; it's the *definition* of the policy chosen under the prior.

  ### Solving the Glitch Variant (10% Chance Both Lights Red)
  1.  **Setup:** With 90% probability, standard split (H: R/B, T: B/R). With 10% probability, glitch: *both* copies see Red.
  2.  **Payoff:** Standard split worlds require (Red:A and Blue:B). Glitch world: *No* Blue copy exists. Pressing A or B does nothing; payoff is always $0 regardless. (Crucially, the winning condition *requires* one Red and one Blue copy acting correctly).
  3.  **Candidate Policies:** Same as before: `f_ignore(A)`, `f_ignore(B)`, `f_coordinate(R->A, B->B)`, `f_wrong(R->B, B->A)`.
  4.  **Prior Evaluation (Key Differences):**
      *   **Standard Worlds (90%):** Same as before. `f_coordinate` gets $2000 in each standard world (45% H, 45% T). `f_ignore(A/B)` and `f_wrong` get $0.
      *   **Glitch World (10%):** Both copies see Red. What happens?
          *   `f_coordinate`: Both see Red -> Both do `A`. No Blue copy exists -> Payoff $0.
          *   `f_ignore(A)`: Both do `A` -> Payoff $0.
          *   `f_ignore(B)`: Both do `B` -> Payoff $0.
          *   `f_wrong`: Both see Red -> Both do `B` (since `f_wrong(Red)=B`) -> Payoff $0.
          *   *No policy gets a payoff in the glitch world.*
      *   **Expected Utility Calculation:**
          *   `f_coordinate`: EU = (90% * $2000) + (10% * $0) = **$1800**
          *   `f_ignore(A)`: EU = (90% * $0) + (10% * $0) = **$0**
          *   `f_ignore(B)`: EU = **$0**
          *   `f_wrong`: EU = **$0**
  5.  **The Winning Policy:** `f_coordinate(R->A, B->B)` still wins with EU=$1800.
  6.  **Execution:** Same as before. A copy seeing Red presses A. A copy seeing Blue presses B.
  7.  **Why?** The 10% glitch risk doesn't change the *optimal coordination strategy*. The policy `f_coordinate` still gets the massive payoff in the 90% likely standard worlds, while no policy helps in the glitch world. A copy seeing Red *knows* it's more likely (90% prior prob conditional on seeing Red, but the *policy was chosen before knowing this!*) that it's in a standard world with a Blue counterpart who will press B, so pressing A is still the best action *as dictated by the winning policy `f_coordinate`*. It doesn't throw away the $1800 expected gain just because *if* it's in the glitch world (which it probably isn't), pressing A is useless. The policy was optimized for the *overall* prior.

  ### "UDT updates its beliefs but not its decisions"
  This is a valid distinction, not just wordplay:
  1.  **Updates Beliefs:** When UDT evaluates a *candidate policy `f`*, it *must* calculate what the agent would believe *if* it saw observation `X` and then took action `f(X)`. This involves *hypothetical* Bayesian updating for each possible `X` within the evaluation of `f`.
  2.  **Doesn't Update Decisions (The Policy):** The crucial point is that **the actual choice of which policy `f` to adopt is made *once*, based *only* on the prior, before any observation is received.** You don't observe `X`, update your *overall* beliefs, and *then* pick a new policy `f` based on your posterior. You pick *one* policy `f` upfront that tells you how to react to *any possible* future `X`. Your "decision" (the choice of `f`) is updateless. The *action* you take (`f(X)`) is sensitive to `X`, but that sensitivity was baked into `f` when you chose it under the prior.

  ### Everyday Choices (The Umbrella)
  UDT absolutely applies, though it often reduces to standard Bayesian decision theory in simple cases.

  *   **Scenario:** Should I take an umbrella? It might rain. Prior: P(Rain) = 40%. You can observe a forecast: 80% accurate.
  *   **UDT Approach:**
      1.  **Define Policies:** *Before* seeing the forecast, consider mappings from forecast observation to action:
          *   `f1(Forecast) = Always Take Umbrella`
          *   `f2(Forecast) = Never Take Umbrella`
          *   `f3(Forecast=Rain) = Take; f3(Forecast=Sun) = Don't Take`
          *   `f4(Forecast=Rain) = Don't Take; f4(Forecast=Sun) = Take` (Wrong)
      2.  **Prior Evaluation:** Calculate the expected utility of each policy `f` by averaging over:
          *   All possible true weather states (Rain/Sun)
          *   All possible forecast observations (Rain/Sun)
          *   Weighted by prior probabilities and forecast accuracy.
          *   For `f3`: If Forecast=Rain (likely correct, P(Rain|F=Rain) high), taking umbrella avoids getting wet. If Forecast=Sun (likely correct, P(Sun|F=Sun) high), leaving umbrella avoids hassle. The *average* utility of this reactive policy will be high.
          *   For `f1`: Always protected, but always carry hassle. Lower average utility than `f3`.
          *   For `f2`: Never hassle, but often get wet. Low average utility.
          *   For `f4`: Actively wrong. Lowest utility.
      3.  **Commit to Best Policy:** `f3` wins.
      4.  **Execute:** See forecast. If "Rain", execute `f3(Forecast=Rain) = Take Umbrella`. If "Sun", execute `f3(Forecast=Sun) = Don't Take Umbrella`.
  *   **Why UDT Works Here:** It commits to the sensible rule "take the umbrella if the forecast says rain" *because* that rule has the highest expected utility under the prior, considering how often the forecast is right/wrong and the costs/benefits. You *use* the evidence (forecast) to decide your action, but the *rule for using that evidence* (`f3`) was chosen once, upfront, using the prior. You don't see the forecast, update P(Rain), and then invent a new rule; you follow the pre-committed rule `f3` that was optimized for your prior model of the world (including forecast accuracy).

  ### Conclusion
  *   **UDT does NOT ignore evidence.** Policies explicitly map observations to actions.
  *   **"Updateless"** refers specifically to **when and how the *policy itself is selected*** (once, using the prior average expected utility). It does *not* mean the agent is blind to its observations when acting.
  *   **The prior bites** in the **evaluation and selection** of the policy function `f`. It forces the agent to consider the *average* performance of `f` across *all* possible worlds it might find itself in, weighted by their prior likelihood. This prevents agents from "defecting" against their counterfactual selves in dilemmas like Newcomb or the Red/Blue light.
  *   **Observation sensitivity** is baked into the definition of the policy `f` itself. The agent *knows* it will receive evidence and commits in advance to how it will use it optimally *on average*.
  *   **UDT applies to everyday choices.** In simple cases, it replicates common sense (like using a weather forecast). Its unique power and necessity become apparent in "sci-fi" scenarios involving prediction, acausality, and copying, where CDT and EDT fail to achieve optimal coordination or fall prey to spurious correlations.

  Your confusion was completely understandable – the term "updateless" is easily misinterpreted as "ignores updates," when it really means "commits to a reaction plan *before* getting updates." The Red/Blue light case perfectly illustrates how UDT reconciles prior commitment with evidence-sensitive action. Keep wrestling with it; you're asking exactly the right questions!
