prompt: |-
  yo — for a reading group on AI futures I want the spec sorted before we start arguing about who's right. Write me the desiderata a theory of AI takeoff speed has to meet to be worth taking seriously: what a claim like "hard takeoff", "slow takeoff" or "roughly a two-year takeoff" would actually have to cash out in, with the case behind each requirement. The purpose I care about is coordination runway — how much time institutions, governments and competitors get to notice and respond — so speed should be in whatever unit tracks that, not automatically in calendar months.

  Cases I keep tripping on, which I want the list to either handle or explicitly declare out of scope:
  - the quiet year: lab capabilities double but almost nothing visible happens for ~18 months because deployment is gated by regulation, integration and procurement. fast or slow takeoff, and why
  - two clocks: software/algorithmic progress on one timescale, chip fabs, power and datacenter buildout on another, including the case where a big stockpile of already-built compute can be converted quickly
  - jaggedness: long-horizon software ability racing ahead while robotics and physical-world capability lags — speed of which capability, and is a single scalar index allowed
  - non-cognitive bottlenecks: progress gated on experiments, trials, permits or physical infrastructure rather than on cognitive labour
  - concentration: the same capability curve captured by one actor vs spread across many
  - thresholds: capability crossing a line that unlocks a lumpy strategic advantage (seizure of power, decisive military edge) rather than a smooth economic gain
  - whether "takeoff speed" is a feature of the world or of our forecasting situation

  Give me:
  - "What the unit is" — 3-4 sentences, commit to one currency for speed and say why
  - "The list" — 7-9 requirements, one short paragraph each, each with the concrete case that motivates it
  - "Non-negotiable vs. camp prejudice" — short: which demands are genuine and which are just what one camp likes
  - "Where the list breaks" — one paragraph on the pair of desiderata you suspect can't both be met
  - "The one that kills" — one paragraph on the single requirement that rules out the most existing stories
  - "Sixty-second scorecard" — 3-4 lines on the hard-takeoff/recursive-self-improvement story, the continuous takeoff story, and the "AI is just another technology, growth stays roughly historical" story, against your list

  Be commited — take positions and give reasons rather than laying out options for me to pick, and where you're guessing say so in a clause instead of hedging the whole answer.
reasoning: |-
  Okay, let me start by unpacking the user's request. They want desiderata for evaluating theories of AI takeoff speed, specifically for a reading group focused on coordination runway. The main goal is to set clear criteria before debates begin. The user mentioned several tricky cases like the quiet year, two clocks, jaggedness, etc., which the criteria need to address or explicitly exclude.

  First, I need to define the unit of speed. The user emphasized coordination runway, so time should be measured in terms of institutional response time, not calendar months. That makes sense because institutions need time to notice and react. But how to quantify that? Maybe in terms of capability doubling time as it affects observable impact. But then there's the quiet year problem—capability might double without visible changes. So the unit must tie capability gains to observable effects that trigger institutional response.

  Next, the list of requirements. Each should address one of the user's cases. For example, the quiet year suggests the need for an institutional detection requirement. Two clocks imply separating software and hardware speeds. Jaggedness requires handling multidimensional capabilities, so a single scalar might not suffice. Non-cognitive bottlenecks mean accounting for factors beyond AI research. Concentration affects how gains are distributed. Thresholds highlight discontinuous changes. Finally, the ontology requirement addresses whether speed is about the world or our uncertainty.

  I should check which requirements are non-negotiable. Observability and multidimensionality seem essential because ignoring them would invalidate the model. Others, like separability or concentration, might be more about specific scenarios. The user wants to avoid camp prejudices, so distinguishing core needs from preferences is crucial.

  The hardest part might be the tension between observability and separability. Observability ties capability to detection, but separability requires breaking down components. If hardware delays capability, but institutions react to software progress, that's a conflict. Maybe the list breaks here, and the user needs to decide which takes precedence.

  The ontology requirement might kill most stories. Many theories treat takeoff speed as a property of AI development, but if it's about our uncertainty, that changes everything. For example, Bostrom's hard takeoff assumes rapid capability gain, but if institutions detect early signals, the runway might be longer.

  For the scorecard: Hard takeoff might fail on observability and multidimensionality. Continuous growth could miss thresholds and concentration. Historical growth might ignore separability and thresholds. Highlighting these weaknesses shows how the criteria apply.

  I need to ensure each requirement has a concrete case from the user's list. Also, commit to positions without hedging. For instance, the unit is institutional detection-gated doubling time. That's a firm stance. The list should be concise, each requirement explained with its motivating case. 

  Finally, the non-negotiables: observability, thresholds, ontology, and multidimensionality are core. Others might be debatable. The ontology point is critical because it shifts the perspective from intrinsic AI speed to how we perceive and react to it. That could rule out many existing models that don't account for epistemic factors.
answer: |-
  Here’s a committed framework for evaluating AI takeoff speed theories, optimized for **coordination runway** (time for institutions to detect and respond to transformative AI):

  ### **The Unit: Institutional Detection-Gated Doubling Time (IDGDT)**  
  Speed is measured in **time between capability doublings *as they become institutionally visible and actionable***. Calendar time is irrelevant if changes aren’t observable. For example, a lab doubling AI capabilities in 3 months means nothing for coordination if deployment lags 18 months due to regulation (the "quiet year"). IDGDT starts when capability gains force institutional recognition (e.g., public demonstrations, regulatory scrutiny, market disruption) and ends when the next doubling triggers renewed response. *Why?* Only observable shifts create political/economic pressure.

  ---

  ### **The List: 8 Desiderata**  
  1. **Observability Requirement**  
     Must distinguish *capability gains* from *deployed impact*. Motivated by the **quiet year**: if algorithms improve rapidly but deployment is delayed by safety reviews or hardware integration, the *effective* takeoff speed is slow. A theory claiming "fast takeoff" must show gains will rapidly translate into observable events forcing institutional response.  

  2. **Dual-Clock Separability**  
     Must explicitly model *algorithmic progress* and *hardware/scaling infrastructure* as distinct timelines with bottlenecks. Motivated by **two clocks**: if 6-month algorithmic doublings hit a 2-year compute bottleneck, IDGDT slows. Exception: stockpiled compute converts *potential* to *observable* capability instantly, resetting the clock.  

  3. **Multidimensional Capability Index**  
     Must reject single scalar metrics (e.g., "general intelligence"). Progress is **jagged**: software may achieve human-level science in 2026 while robotics lag until 2035. Speed claims must specify *which capabilities* drive strategic inflection (e.g., cyber offense vs. drone swarms). Military thresholds may be breached long before economic ones.  

  4. **Non-Cognitive Bottleneck Accounting**  
     Must include non-software delays: clinical trials for biotech AI, fusion plant permits for energy-hungry models, or chip fab construction. A "2-year takeoff" claim fails if it ignores 5-year infrastructure lead times *after* algorithmic maturity.  

  5. **Concentration Penalty/Reward**  
     Must weight speed by actor concentration. Motivated by **concentration**: if one actor monopolizes progress, they may suppress visibility (slowing IDGDT) or leverage asymmetric advantage (e.g., disabling rivals in hours). Distributed progress forces faster institutional response via competition.  

  6. **Threshold Activation**  
     Must identify **thresholds** that compress coordination runway (e.g., AI hacking electric grids). A "slow" 5-year takeoff becomes instant if capability jumps from "subhuman" to "shutdown all coal plants" in one leap. Speed = time *between* thresholds, not smooth averages.  

  7. **Epistemic Clarity**  
     Must state whether speed is *ontological* (inherent to AI development) or *epistemic* (dependent on forecasting ability). Motivated by **world vs. forecasting** ambiguity: if slow takeoff arises from our inability to detect covert AI progress, institutions get *zero* runway despite gradual change.  

  8. **Runway Elasticity**  
     Must model institutional response as non-constant. A 1-year IDGDT may suffice for corporate adaptation but fail for treaty negotiations. "Speed" should include feedback loops (e.g., fast takeoff triggers regulatory panic that further slows deployment).  

  ---

  ### **Non-Negotiable vs. Camp Prejudice**  
  - **Non-Negotiable**: Observability, Threshold Activation, Epistemic Clarity. These are definitional to coordination runway.  
  - **Camp Prejudice**: Dual-Clock Separability (favors hardware skeptics), Concentration (favors decentralization advocates). Important but debatable.  

  ---

  ### **Where the List Breaks**  
  **Observability vs. Dual-Clock Separability** creates tension. If hardware bottlenecks *hide* algorithmic progress (e.g., chip shortages delaying superintelligent AI deployment), IDGDT appears slow until infrastructure catches up—then jumps discontinuously. But discontinuous jumps violate "gradual observability" assumptions. *This forces a choice: either accept threshold-driven jumps or redefine observability to include "lab-only" capability (weakening institutional relevance)*.  

  ---

  ### **The One That Kills**  
  **Epistemic Clarity** eliminates most naive timelines. Proponents of "fast takeoff" often assume rapid capability gains *will* be immediately visible, while "slow takeoff" advocates assume institutions can perfectly monitor progress. If takeoff speed is primarily limited by *our inability to detect it* (e.g., undisclosed government projects, corporate secrecy), then "slow" forecasts are dangerously complacent. *Example: A lab’s AGI prototype hidden during safety testing could reduce runway from years to weeks upon deployment*.  

  ---

  ### **Sixty-Second Scorecard**  
  - **Hard Takeoff/Recursive Self-Improvement**: Fails **Observability** (assumes no deployment lag), **Dual-Clock** (ignores hardware), **Non-Cognitive** (bottlenecks). Scores well on **Thresholds**.  
  - **Continuous Takeoff (e.g., 2% weekly growth)**: Fails **Thresholds** (assumes smooth progress), **Multidimensionality** (ignores jagged capabilities), **Concentration** (assumes pluralistic actors). Excels at **Dual-Clock**.  
  - **"Just Another Tech" (historical growth rates)**: Fails **Thresholds** (denies discontinuity risk), **Epistemic Clarity** (assumes perfect monitoring), **Runway Elasticity** (ignores AI’s unique coordination challenges).  

  **Conclusion**: A theory worth taking seriously must treat takeoff as a *detection-threshold cascade*—not a calendar countdown. Speed is in IDGDT, or it’s not about coordination.  

  —  
  *This framework prioritizes institutional agency over theoretical purity. It guesses that the "quiet year" scenario is the rule, not the exception—making observability the linchpin.*
