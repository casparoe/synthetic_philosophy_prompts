  ### Systematic Translation of Moral Trade into Market-Design Language

  **Core Concept of Moral Trade**  
  - **Agents**: Two agents, \(A\) and \(B\), with *disjoint moral preference domains*. \(A\) values allocations in set \(X\) (e.g., bednets) but is indifferent to allocations in set \(Y\) (e.g., roofs). \(B\) values \(Y\) but is indifferent to \(X\).  
  - **Actions as Transfers**: Each agent can initiate a monetary or in-kind transfer to enable an allocation in the other’s domain. Let \(t_A\) be \(A\)’s transfer to fund \(Y\), and \(t_B\) be \(B\)’s transfer to fund \(X\).  
  - **Trade Mechanism**: A contract \((t_A, t_B)\) where:  
    - \(A\) commits to \(t_A\) (costly to \(A\) as it consumes resources usable for \(X\)) conditional on \(B\)’s \(t_B\).  
    - \(B\) commits to \(t_B\) (costly to \(B\) as it consumes resources usable for \(Y\)) conditional on \(A\)’s \(t_A\).  
  - **Gains from Trade**: Under quasilinear utility with a common monetary numeraire:  
    - \(A\)’s utility change: \(\Delta U_A = v_A(t_B) - c_A(t_A)\), where \(v_A(t_B)\) is \(A\)’s value from \(t_B\) funding \(X\), and \(c_A(t_A)\) is \(A\)’s cost of forgoing \(t_A\) for \(X\).  
    - \(B\)’s utility change: \(\Delta U_B = v_B(t_A) - c_B(t_B)\), where \(v_B(t_A)\) is \(B\)’s value from \(t_A\) funding \(Y\), and \(c_B(t_B)\) is \(B\)’s cost of forgoing \(t_B\) for \(Y\).  
  - **Feasibility**: Trade exists iff there exist \((t_A, t_B)\) such that:  
    \[
    v_A(t_B) > c_A(t_A) \quad \text{and} \quad v_B(t_A) > c_B(t_B).
    \]
    This exploits differential marginal rates of substitution: \(A\) trades cheaply in \(Y\) (low \(c_A\) relative to \(v_B\)), \(B\) trades cheaply in \(X\) (low \(c_B\) relative to \(v_A\)).  
  - **Efficiency Claim**: The trade is *Pareto-improving under agent-specific valuations* if \(\Delta U_A > 0\) and \(\Delta U_B > 0\). This requires no interpersonal utility comparisons.  

  **Critiques in Market-Design Terms**  
  1. **Commitment Problem (Simultaneity of Performance)**:  
     - The trade is a *simultaneous-move game* with no ex post enforcement. Each agent’s best response is to *defect* (not transfer) if the other cooperates, as \(c_i(\cdot) > 0\) but no value is received if the other defects.  
     - Formally, without binding commitments, the only Nash equilibrium is \((t_A=0, t_B=0)\), even if \((t_A>0, t_B>0)\) is mutually beneficial. This is a prisoner’s dilemma with dominant strategies.  

  2. **Corruption Charge (Simony)**:  
     - Paying an agent to perform an action they value at zero violates *intrinsic incentive compatibility* or *normative constraints*. Market design typically assumes transfers are neutral (e.g., money) and preferences are exogenous. Here, the trade may introduce *perverse incentives*:  
       - If \(B\)’s production of \(Y\) has external costs (e.g., crowding out other welfare-enhancing allocations), the trade could reduce social welfare under a *global objective function*.  
     - No market-design concept directly prohibits this, but it resembles *bribery* if \(Y\) is a public good with existing property rights (e.g., a parish roof as a common resource).  

  3. **Moral Offsetting Rebranded**:  
     - If \(X\) and \(Y\) are substitutes in a global welfare function (e.g., total lives saved), the trade is *zero-sum*: gains in \(X\) offset losses in \(Y\). Market design flags this as *inefficient aggregation*:  
       - Let \(W(X,Y)\) be global welfare. Trade increases \(W\) only if \(\frac{\partial W}{\partial X} \cdot t_B + \frac{\partial W}{\partial Y} \cdot t_A > 0\).  
       - If \(\frac{\partial W}{\partial X} \approx -\frac{\partial W}{\partial Y}\) (e.g., due to budget constraints), \(W\) is unchanged. The trade is merely *retrading* under a fixed budget.  

  4. **Dependence on Contested Claims**:  
     - Gains rely on *subjective valuations* \(v_A, v_B, c_A, c_B\). If empirical/moral uncertainty exists:  
       - \(v_A(t_B)\) may depend on contested causality (e.g., bednets’ effectiveness), modeled as a *type space* with incomplete information.  
       - Trade may require a *common prior* over outcomes or *interpersonally comparable cardinal utility* to justify \(\Delta U_i > 0\). Market design typically avoids these.  

  ---

  ### Residue Report: What Translates, What Stretches, What Fails  
  **Translated Cleanly**  
  - **Gains from Trade**: The condition \(v_A(t_B) > c_A(t_A)\) and \(v_B(t_A) > c_B(t_B)\) is a standard no-arbitrage argument. It requires no interpersonal comparisons.  
  - **Pareto Improvement**: Valid under agent-specific valuations. Each agent’s utility increases by their own metric.  
  - **Commitment Problem**: Directly maps to a hold-up problem in non-cooperative games.  
  - **Market Recognition**: A market where the buyer (\(A\)) never consumes \(Y\) and the seller (\(B\)) attaches no value to producing \(Y\) is recognized as a *barter of moral actions* with externalities. Common in public goods provision.  

  **Stretched Terms**  
  - **Strategy-Proofness**: Moral trade is not strategy-proof. Agents may misreport \(v_i\) or \(c_i\) to renegotiate \((t_A, t_B)\). The critique assumes truthful revelation, but the mechanism has no incentive-compatibility guarantee.  
  - **Individual Rationality**: Requires *ex post* verification of allocations (e.g., bednets delivered). Without this, the trade risks being *non-excludable* (agents benefit even if they defect), violating standard IR assumptions.  
  - **Thickness/Congestion**: Scaling to many agents introduces *coordination costs*. If \(A\) trades with multiple \(B\)s, the marginal value of \(Y\) may drop, eroding gains.  

  **Cannot Be Translated (Framework Gaps)**  
  1. **Pareto Improvement Under Disagreement**:  
     - Your framework assumes agents agree on the *measure* of value (e.g., utility units). Moral trade permits Pareto gains under *incommensurable* moral theories (e.g., utilitarianism vs. deontology). Market design lacks tools to handle this without a shared cardinal scale.  
     - **Residue Insight**: The gains are trivial if utilities are comparable but incoherent if not. Your framework misses *meta-ethical aggregation rules*.  

  2. **Contingent Trades with Unverifiable Outcomes**:  
     - **Setup**: Trade conditioned on event \(E\) (e.g., "bednets reduce malaria"), unverifiable to \(A\) and \(B\), but arbitrable by a trusted third party.  
     - **Failure**: Market design relies on *contractible states* (verifiable events). Unverifiable \(E\) makes the trade *non-implementable*. Your framework assumes all states are contractible or has complete contracts.  
     - **Residue Insight**: This exposes a gap in market design for *Knightian uncertainty* (unmeasurable moral outcomes).  

  3. **Reciprocal Trades Without Observation**:  
     - **Setup**: \(A\) and \(B\) trade without meeting or monitoring, relying on expected reciprocity in repeated interactions.  
     - **Failure**: Your framework assumes static games or explicit enforcement. Reciprocal trades require *reputational equilibria* or *network effects*, which demand dynamic models and common knowledge of strategies.  
     - **Residue Insight**: This is coherent as a *folk theorem in repeated games* but absent in standard market design.  

  **Your Suspicion Tested**  
  - **Coasean Bargaining?** Yes, but not trivial:  
    - It is Coasean (internalizing reciprocal externalities), but *without clear property rights*. \(A\) has no right to demand \(t_B\) for \(X\); \(B\) has no right to \(t_A\) for \(Y\).  
    - **Non-Triviality**: The trade creates value if \(v_A\) and \(v_B\) are *non-rival* (public goods). It fails if externalities are private.  
    - **Incoherence?**: Only if the utility comparison is forced. Gains are agent-specific and require no common scale.  

  **Conclusion**  
  Moral trade translates cleanly into a barter mechanism for public goods with externalities, but gaps emerge in handling unverifiable states, reciprocal expectations, and incommensurable moral theories. Your framework misses dynamic enforcement tools and meta-ethical aggregation—limitations of market design, not flaws in moral trade. The idea is non-trivial if gains exist under agent-specific preferences, but critiques of commitment and corruption are robust.
