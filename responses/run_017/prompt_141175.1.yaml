  However, this requires that the first unit of X is worth more than $1 to A and the first unit of Y is worth more than $1 to B. 

  This is the basis for the moral trade.

  Now, let's restate the idea and the critiques in market-design terms.

  Core idea in market-design terms:
  - We have two agents, A and B, with quasilinear utility in money.
  - Each agent can produce a public good (X by B and Y by A) at a constant marginal cost of 1 per unit.
  - A has a valuation function for X: V_A(X) (increasing and concave) but values Y at 0.
  - B has a valuation function for Y: W_B(Y) (increasing and concave) but values X at 0.
  - Without trade, each agent might not produce any of the public good because the cost is borne by the producer and the benefit is not valued by the producer (if they are selfish) or in the moral context, the agent only values their own cause.

  - A contract (x, y) where A produces x units of Y and B produces y units of X is a moral trade if:
      V_A(y) - V_A(0) > x   [A's gain from the trade]
      W_B(x) - W_B(0) > y   [B's gain from the trade]

  - Such a trade exists if the marginal valuations at zero are above the marginal cost (1). It is a barter exchange of public good production.

  Critiques in market-design terms:

  1. Commitment problem:
     - The trade requires simultaneous performance: A must produce Y and B must produce X at the same time.
     - If one party performs first, the other might not perform. For example, if A produces Y first, then B might not produce X because B doesn't value X and now has no incentive to spend the money on X.
     - This is a classic hold-up problem or a prisoner's dilemma in simultaneous moves: if they move simultaneously, both have an incentive to defect (not produce) because they save the cost and still get the benefit of the other's production? But wait: if A does not produce Y, then B doesn't get the benefit of Y and hence might not produce X. However, in the simultaneous setting, if each can condition their production on the other's production, then it becomes a coordination game with two equilibria: both produce or both don't.
     - The problem is that there is no enforcement. The market design framework typically assumes enforceable contracts. Without enforcement, the trade might not happen.

  2. Charge of corruption:
     - In market design, a transaction is typically between a buyer and a seller exchanging a good that the seller values (or has the right to) and the buyer wants. Here, the "seller" (A) is producing a good (Y) that they do not value and that the "buyer" (B) does value, and similarly for the other good. This is not corruption per se; it's a barter of public good provisions.
     - However, if we view the production of the public good as a moral duty, then paying someone to do their duty might be seen as corrupt. In market-design terms, this is not a standard efficiency concern but a normative constraint.

  3. Moral offsetting:
     - The worry is that this is just offsetting: A's production of Y (which might be harmful by A's lights) is offset by B's production of X. But in our model, A doesn't value Y, so they don't see it as harmful. They are indifferent. The trade is not about offsetting harm but about mutual provision of desired public goods.
     - However, if the public goods are not orthogonal (e.g., if producing Y has a negative effect on X, or vice versa), then there might be an offsetting element. But in the simple model, they are independent.

  4. Dependence on contested claims:
     - The gains from trade depend on the valuation functions V_A and W_B. If there is disagreement about these valuations (e.g., third parties might dispute that V_A(y) is really that high), or if the production of the public good is not as effective as claimed, then the gains might not materialize.
     - In market design, this is an issue of information asymmetry and would require verification of the quality of the public good produced.

  Residue report:

  What translated cleanly:
  - The core idea of moral trade as a barter exchange of public good production can be captured in a market-design model with quasilinear utility and public goods. The gains come from the difference in marginal valuations of the public goods at zero production versus the marginal cost.

  What required stretching:
  - The "stretching" was in the interpretation of the action: we treated each party as a producer of a public good that they can produce at constant marginal cost (money). This is a natural extension, but the moral trade idea might be applied to actions that are not naturally modeled as public good production (like votes or abstentions).
  - The assumption of quasilinear utility is necessary to have a common numeraire (money) that allows for the comparison of costs and benefits. Without transferable utility (or a numeraire good that both value linearly), the gains might not be commensurable.
  - The model assumes that the parties can condition their production on the other's production, which is a form of contract. This is not always feasible, especially in the cases of votes or abstentions.

  What cannot be said in the vocabulary at all (or only with great difficulty):
  - The concept of a Pareto improvement when the two parties apply different measures of value: in the market-design framework, we assumed a common numeraire (money) and quasilinear utility, which allowed us to compare the gains. If we drop quasilinearity, then we cannot aggregate utility and we would typically use Pareto-improvements only with respect to the same utility functions. But here, the parties have different utility functions. However, we can still say that both are better off by their own lights. So it is a Pareto improvement in the broad sense: both utilities increase.
    - But note: without a common numeraire, we cannot easily express the gains in a way that allows for trade. We would need to specify the entire indifference curve and find a trade that moves both to a higher indifference curve. The trade would be represented by a contract curve in the barter exchange.
  - The market in which the buyer never consumes the good and the seller attaches no value to producing it: in the model, the "buyer" (say, A for good X) does not directly consume the good but benefits from its existence (public good). The seller (B) is producing it and does not value it, but incurs a cost (the money). This is similar to a private provision of a public good. This is known in market design in the context of mechanism design for public goods (e.g., the Vickrey-Clarke-Groves mechanism) but is not a typical market.

  Your suspicion: that this is Coasean bargaining over an externality with no agreed property rights. In this case, the externality is the public good: when B produces X, it benefits A (positive externality) and similarly when A produces Y, it benefits B. The Coase theorem says that if property rights are well-defined and transaction costs are low, the parties will bargain to an efficient outcome. In our case, the property rights are not clear: who has the right to the benefits of the public good? But in the moral trade, they are not bargaining over the externality directly but swapping the production of externalities. The status quo is zero production. The trade moves them to positive production. The gains come from internalizing the externalities. So your suspicion is essentially correct, and the idea is not trivial only if there are transaction costs or commitment problems that prevent Coasean bargaining. The moral trade idea is a specific form of Coasean bargaining for reciprocal externalities.

  Two wrinkles:

  1. Trades conditional on an unverified contingency with a trusted arbiter:
     - In market design, this is a contingent contract with a third-party verifier. We design a mechanism where the arbiter can verify the contingency and enforce the transfer. This is standard in mechanism design with verifiable signals.

  2. Trades without meeting or observing, based on expected reciprocity:
     - This is like a repeated game or a reputation system. In market design, we might use a platform that records trades and enforces penalties for defection, or we rely on repeated interactions. Without repeated interaction, it is difficult. This is the problem of cooperation in the prisoner's dilemma.

  Residue: 
  - The framework of market design can accommodate the core idea of moral trade as a barter of public good production, but it relies on quasilinear utility for the gains to be easily defined. 
  - The commitment problem and the enforcement of contingent contracts are standard challenges in market design and can be addressed with appropriate institutions.
  - The corruption charge is outside the standard efficiency concerns of market design and involves normative constraints that are not typically modeled.
  - The dependence on contested claims is an information problem, which market design addresses with verification mechanisms or by incorporating uncertainty.

  However, the framework does not naturally accommodate:
  - Trades without a numeraire or without transferable utility.
  - Trades that are not about producing a measurable output (like votes or abstentions) might require a different model.
  - The framework assumes that the parties can contract on the production levels. If they cannot (as in votes, which might be secret), then the trade might not be enforceable.

  Conclusion: The moral trade idea is coherent and non-trivial within the market-design framework, but it requires specific assumptions (quasilinearity, enforceable contracts, and the ability to condition on the other's action). The Coasean insight is central, and the moral trade is a particular application to reciprocal externalities.
