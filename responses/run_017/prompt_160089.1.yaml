prompt: |-
  I have recently become the lay member of a three-person panel that our city council appointed to advise it on one narrow question. A historical marker is to be erected where a riverside settlement stood until 1919, and the text must say something about how the residents left. The county records describe a compensated buyout: deeds, a ledger, an ordinance, all in order. The descendants' association describes an armed removal, and says the paperwork was drawn up afterward so that the taking would look like a sale. I have spent three months with both accounts, I cannot decide between them, and — more to the point — I have realized that I do not know what I am supposed to be asking for when I ask which one should give way. The panel has to deliver three separate things: a short factual finding for the council, the wording of the inscription, and a recommendation on whether the city owes anything.

  Before our next meeting I would rather have a specification than a verdict. Please write the desiderata: what any adequate account of how to adjudicate a conflict between a community's memory and the archival record has to deliver. For each requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as the preference of one camp. In particular, please keep the following distinctions apart rather than collapsing them:

  1. the evidentiary question (what happened) versus the commemorative question (what the city should now publicly attest) versus the reparative question (what is owed);
  2. a memory's being wrong in detail versus wrong in shape — getting the date or the number wrong versus getting the character of the event wrong;
  3. a record's being silent about an event versus its having been produced by the very party the memory accuses. My own view is that the ledger cannot corroborate the buyout if the authority accused of the removal is the authority that wrote it, and I want to know whether that belongs on the list as a requirement in its own right — something like an independence or provenance condition — and what it rules out;
  4. collective memory as testimony about the past versus collective memory as a present practice that partly constitutes the community that holds it, so that overriding it is not only a change of belief;
  5. the two directions of error: overriding a memory that was true, versus preserving one that was false. I want to know whether these are symmetric in cost. It seems to me that the first repeats an injury while the second repeats only a mistake, but I would like that argued rather than assumed.

  Then flag any pair of desiderata that cannot be jointly satisfied. The one I keep tripping over is between a rule that is the same for every community and a rule sensitive to who produced the documents; if there are others — especially any subset that makes the list as a whole unsatisfiable — that is the part I most want to see. Say which single requirement does the most work in excluding the standard answers, and note which requirements shift depending on whether the output is the finding, the inscription, or the reparative recommendation, since I suspect adequacy is relative to that and that the three pull in different directions.

  Finish with a brief scorecard, a few lines each, for three contenders: record-primacy (the archive wins unless it is positively discredited), memory-primacy (the affected community's account wins wherever the record is not independent of the power it names), and the commemorative view (that the dispute is not really about 1919 but about what the city should now say). The criteria are what I need; the scoring is only so I can place the arguments I am hearing around the table.

  One disclosure, since it may be a bias rather than a reason: my instinct is to side with the descendants, and I cannot currently tell whether that is a judgment or a mood. If your list gives me a way to test it, so much the better.
reasoning: |-
  Hmm, this user presents an incredibly nuanced ethical-historical dilemma about adjudicating between archival records and collective memory regarding a 1919 riverside settlement removal. They're serving on a city council panel with three distinct outputs: factual findings, inscription wording, and reparative recommendations. 

  The core tension here is epistemological (what can we know?) versus ethical (what should we do with that knowledge?). The user brilliantly identifies five key distinctions that mustn't be collapsed - especially the difference between evidentiary truth and commemorative/political functions of memory. Their disclosure about instinctive sympathy for descendants reveals admirable self-awareness about potential bias.

  What they're really asking for is a framework to evaluate frameworks - meta-criteria for judging historical reconciliation mechanisms. The most philosophically rich points are: whether overriding collective memory constitutes violence (point 4), and the asymmetry between false negatives (erasing true memory) versus false positives (preserving false memory) in point 5. 

  The independence condition they propose (point 3) seems crucial - it echoes archival science's provenance principle while acknowledging colonial power dynamics in record-creation. But it must be balanced against the commemorative view's insight that public history serves present community needs. 

  For the scorecard: record-primacy fails the independence test spectacularly but provides legal clarity; memory-primacy risks epistemic fragility while serving reparative goals; commemorative view dodges historical truth but might best serve social healing. The irreconcilable tension is between universal rules and contextual sensitivity - especially regarding document provenance. 

  Ultimately the user needs to recognize that all three panel outputs require different truth standards: the finding needs epistemological rigor, the inscription ethical symbolism, and reparations political justice. My framework gives them tools to parse these separately rather than seeking one "correct" answer.
answer: |-
  Here is a specification of desiderata for adjudicating conflicts between collective memory and archival records, structured per your requirements. Each item includes its motivation, negotiability status, and distinguishes between evidentiary (E), commemorative (C), and reparative (R) applications where relevant. Irreconcilable tensions and key exclusions are flagged.

  ---

  ### **Desiderata for Adjudicating Memory-Archive Conflicts**

  1.  **Provenance Independence (Non-negotiable for E/R; Contextual for C)**  
      *Motivation*: Records produced by an accused party cannot neutrally corroborate their own innocence (your point #3). A ledger created by the authority accused of forcible removal is inherently suspect as potential exculpatory fabrication.  
      *Application*: Rules out uncritical reliance on self-serving official records for factual findings (E) or reparative justice (R). For commemoration (C), provenance may inform *how* the event is framed but doesn't negate the need for acknowledgment.

  2.  **Epistemic Asymmetry (Non-negotiable)**  
      *Motivation*: Overriding a true collective memory repeats historical violence (erasure/dispossession), while preserving a false memory risks only factual error (your point #5). The costs are not symmetric; the former inflicts moral harm, the latter is an intellectual concern.  
      *Application*: Demands a higher burden of proof for rejecting memory than for rejecting archives. Critical for E (fact-finding) and R (reparations), as both risk re-injury. Less directly governs C (commemoration), which serves present needs.

  3.  **Character over Precision (Negotiable: Preference of Memory Camp)**  
      *Motivation*: Memory may err in detail (dates, numbers) yet accurately preserve the *character* of an event (coercion vs. consent) (your point #2). Getting the "shape" right matters more for justice/meaning than granular accuracy.  
      *Application*: Vital for C (inscription tone) and R (assessing harm). For E, it complicates binary "true/false" findings but urges focus on central moral questions.

  4.  **Memory as Constitutive Practice (Non-negotiable for C/R; Contextual for E)**  
      *Motivation*: Collective memory isn't just testimony; it sustains community identity and resistance (your point #4). Overriding it attacks the group’s social fabric, not just its beliefs.  
      *Application*: Demands that C/R prioritize memory’s role in present identity/repair, even if E finds factual gaps. Reparations (R) must address this constitutive harm.

  5.  **Silence ≠ Absence (Non-negotiable)**  
      *Motivation*: Archival silence about violence doesn’t disprove it (point #3 distinction). Oppression often occurs "off the record," while bureaucracy documents sanitized versions.  
      *Application*: Prevents archives from vetoing memory claims in E/R. Critical for R (harm assessment) and E (burden of proof).

  6.  **Functionally Distinct Outputs (Non-negotiable)**  
      *Motivation*: Evidentiary, commemorative, and reparative goals require different standards (your point #1). A single "truth" cannot serve all three equally.  
      *Application*: Mandates separate reasoning for:  
      - *E (Factual Finding)*: Likelihood based on evidence (including provenance/memory).  
      - *C (Inscription)*: Symbolic recognition, honoring lived experience, fostering civic reflection.  
      - *R (Reparations)*: Rectifying harm, acknowledging power imbalances, restorative justice.  

  7.  **Universality vs. Context Sensitivity (Tension)**  
      *Motivation*: Rules must apply consistently (fairness), but power dynamics (e.g., who produced records) demand contextual judgment (your noted tension).  
      *Irreconcilability*: Strict universality ignores provenance; radical context sensitivity risks arbitrariness. *Resolution*: Apply procedural universality (e.g., "assess provenance") but accept contextual outcomes.

  ---

  ### **Key Tensions & Exclusions**
  - **Unsatisfiable Triad**:  
    (i) **Absolute epistemic deference to memory** (due to asymmetry/constitutive nature),  
    (ii) **Rigorous historical empiricism**,  
    (iii) **Universally applicable rules**.  
    *Any two* are feasible, but all three conflict. Your case prioritizes (i) and (iii), straining (ii).
  - **Most Exclusionary Requirement**: **Provenance Independence** does the most work. It invalidates "record-primacy" when archives are self-serving and challenges "commemorative" approaches that ignore power in historical production.
  - **Output-Dependent Shifts**:  
    - *Provenance* matters most for E/R, less for C.  
    - *Constitutive Practice* dominates C/R, not E.  
    - *Asymmetry* is critical for E/R, background for C.

  ---

  ### **Scorecard: Three Contenders**

  1.  **Record-Primacy**  
      *Adequacy*: Fails **Provenance Independence** (uncritically trusts accused’s records) and **Epistemic Asymmetry** (treats memory/archive as equally fallible). May satisfy **Universality** but violates **Silence ≠ Absence**. Useful only for narrow E if records are truly independent.  
      *Risk*: Repeats administrative violence; ignores constitutive harm (R/C).

  2.  **Memory-Primacy**  
      *Adequacy*: Satisfies **Asymmetry**, **Constitutive Practice**, and **Provenance** concerns. Struggles with **Character over Precision** if details materially affect R. Risks violating **Universality** if applied ad hoc. Strong for C/R, may need qualification for E.  
      *Risk*: Potential factual inaccuracy in E; challenges if memory fragments conflict.

  3.  **Commemorative View**  
      *Adequacy*: Excels at **Functionally Distinct Outputs** (focuses C on present meaning). Honors **Constitutive Practice**. May sidestep **Provenance**/**Epistemic Asymmetry** by avoiding E altogether. Fails if it ignores **Silence ≠ Absence** in R.  
      *Risk*: Evades historical accountability (E/R); may satisfy no one if perceived as evasion.

  ---

  ### **Testing Your Instinct**
  Your inclination to side with descendants aligns with **Provenance Independence** (suspect archives), **Epistemic Asymmetry** (erasure worse than error), and **Memory as Constitutive Practice**. To test if this is bias or reasoned judgment:  
  - Does the archive include *any* independent corroboration (e.g., press, church records, adjacent communities)?  
  - Does the descendants’ account show internal consistency or corroborating oral histories?  
  - Would rejecting their memory cause demonstrable harm (*Asymmetry*)?  

  If archives lack independence and memory is cohesive/continuous, your instinct aligns with the desiderata. If gaps exist, weigh using **Character over Precision**—does the core claim of coercion hold even if details blur? The framework supports siding with descendants absent *reliable* counterevidence, but demands rigor in articulating why.
