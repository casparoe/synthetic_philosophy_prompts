  We are designing a case to test the independence of structural and normative factors in causal selection for omissions. The case must be set in a hospital, using ordinary equipment, and must satisfy the following:

  Dependence structure:
  - Two agents, A and D (using A and D to avoid confusion with B for the duty status; note: the problem uses A and B, but we'll use A and D for agents and then note duty for A and not for D? Actually, let's stick to A and B as in the problem, but note that B is the one without duty. So agents A and B.
  - Each omits an action.
  - Each omission is sufficient for the bad outcome (so if A omits, the outcome occurs regardless of what B does, and similarly for B).
  - The outcome occurs if and only if at least one omits (so if both act, the outcome is avoided; if at least one omits, it occurs).
  - Both omit in the actual scenario.

  Constraints:
  (i) The redundancy must be built into the hardware (e.g., a physical interlock) and not a rule or convention.
  (ii) No stepwise-dependence escape: no intermediate event that depends on the conjunction of the omissions but not individually.

  Asymmetry:
  - A has a duty to act (e.g., assigned to the patient, on shift).
  - B has no duty (e.g., off-duty nurse from another ward, in the room by accident).
  - No other differences: same knowledge, ability, proximity, timing (simultaneous omissions), and same effect if they had acted.

  Verdicts required:
  - DM (difference-making): no causation for either (because for each, if they had acted, the outcome would still have occurred due to the other's omission).
  - IV (interventionism): causation for both (because intervening to change either omission to an action would change the outcome in some contexts, and the dependence is invariant).
  - PA (production account): no causation for either (because absences are not causes).
  - NG (norm-gated): causation for A (due to duty) but not for B.

  Pre-theoretic: both omissions should seem equally causal to an untutored reader.

  Now, building the case:

  Setting: A hospital intensive care unit (ICU). 
  Device: A patient is on a ventilator that requires continuous power. The ventilator has a backup battery that is charged by a hand-crank generator. However, the hand-crank generator has a safety feature: it requires two people to crank it simultaneously for it to work. This is because the crank has two handles on opposite sides, and the mechanism is designed such that if only one handle is turned, the generator does not engage (a physical interlock). The main power fails, and the ventilator switches to battery. The battery has only 5 minutes of charge. To keep the ventilator running, the hand-crank generator must be operated within that time. 

  Agents:
  - A: The assigned nurse for the patient. It is A's duty to monitor the patient and respond to alarms, including operating the generator if needed.
  - B: A nurse from another ward, who is off-duty and visiting a friend in the ICU. B is in the room when the alarm sounds.

  Event: The main power fails. The alarm sounds. Both A and B are in the room, engaged in a conversation. They both hear the alarm and know what it means. They both know that the generator requires two people to crank. They are equally positioned near the generator (each next to one handle). They both omit to crank (they keep talking). The battery runs out after 5 minutes, and the patient dies.

  Dependence structure:
  - The outcome (patient death) occurs if and only if the ventilator stops (which happens if the battery runs out and the generator is not cranked).
  - The generator will work only if both cranks are turned simultaneously. So:
    - If only A cranks (and B does not), the generator does not work -> patient dies.
    - If only B cranks (and A does not), same -> patient dies.
    - If both crank, the generator works -> patient lives.
    - If neither cranks, patient dies.

  Therefore:
  - Each omission (A not cranking, B not cranking) is sufficient for the patient's death: because if A omits, then regardless of what B does, the patient dies (if B cranks alone, it doesn't work; if B omits too, it doesn't work). Similarly for B's omission.
  - The patient dies if and only if at least one omits? Actually, note: 
    - The patient dies if both omit OR if only one omits. So the death occurs if at least one omits? But that's not exactly right: death occurs if the generator is not operated successfully, which happens if either A omits OR B omits. Because if A omits, then even if B tries, it doesn't work. Similarly if B omits. And if both omit, obviously not. So the condition for death is: A omits OR B omits. And in the actual case, both omit, so death occurs.

  But note: the death occurs if and only if at least one omits? Actually, if both act, then death is avoided. If one omits and the other acts, death occurs. If both omit, death occurs. So death occurs if and only if it is not the case that both act. That is equivalent to: death occurs if A omits OR B omits. So yes.

  So the structure is: each omission is sufficient, and the outcome occurs iff at least one omission occurs.

  Constraint (i): The two-handle requirement is built into the hardware (a physical interlock). It's not a rule that two people must do it; it's that the machine won't work with one.

  Constraint (ii): There is no intermediate event. The failure of the generator is directly tied to the omissions. The death counterfactually depends on the generator failure, but the generator failure counterfactually depends on each omission? Actually, the generator failure occurs if at least one omission occurs. So if we consider the generator failure as an event, then it depends on the omissions in the same way. But the problem says: no stepwise dependence that would allow a view to recover causation. In particular, we don't have an event that depends on the conjunction but not individually. In fact, the generator failure depends on each omission individually: if A omits, then the generator fails regardless of B, and similarly for B. So if we take the generator failure as an intermediate, then it depends on each omission individually. Then the death depends on the generator failure. But then for DM, the omissions would cause the generator failure? But the problem requires that DM says no causation for the omissions for the death. However, note that the problem says: "the relevant counterfactual for A's omission and for B's" for the outcome (death). So for DM, we consider the counterfactual: if A had cranked, would the death have occurred? Well, in the actual world, B omitted. So if A had cranked, then we have a world where A cranks and B omits. In that world, the generator fails (because only one cranked) and the patient dies. So the death would still have occurred. Similarly for B: if B had cranked but A omitted, then the generator fails and the patient dies. So for the outcome (death), neither omission is a but-for cause.

  But what about the generator failure? If we consider that as the effect, then for A's omission: if A had cranked, would the generator have failed? Yes, because B omitted. So the generator failure would still have occurred. Similarly for B. So DM would say that the omissions are not causes of the generator failure either? Actually, the generator failure is an absence too? But the generator failure is a positive event (the machine not working). However, in the counterfactual test, it still fails. So DM would say that the omissions are not but-for causes of the generator failure. But the problem does not require that we consider intermediate events. We are to consider the outcome (death). And the problem requires that DM says no causation for the death.

  But note: the problem says "no stepwise-dependence escape", meaning that we should not have an intermediate event that depends on the conjunction (both omissions) but not on either individually. In our case, the generator failure depends on each omission individually (it would have occurred if only one omitted). So there is no intermediate event that is caused only by the conjunction. Therefore, constraint (ii) is satisfied.

  Asymmetry: 
  - A is the assigned nurse, so has a duty.
  - B is off-duty and visiting, so no duty (stipulated).
  - Both are equally placed, know the situation, able, and omit for the same reason (absorbed in conversation). The omissions are simultaneous.

  Verdicts:

  1. DM: For A's omission: if A had acted (cranked), the outcome (death) would still have occurred because B omitted (so the generator wouldn't have worked). Similarly for B: if B had acted, the death would still have occurred because A omitted. So neither omission is a but-for cause. Verdict: no causation for either.

  2. IV: We set up a causal model. Variables: 
     - A_act: whether A cranks (1) or not (0)
     - B_act: whether B cranks (1) or not (0)
     - Generator: 1 if works, 0 if fails. Generator = 1 if and only if A_act=1 and B_act=1.
     - Death: 1 if dies, 0 if lives. Death = 1 if Generator=0 (simplifying: we assume that if generator works, patient lives; if not, dies).

  Now, for an intervention on A_act from 0 to 1 (while holding B_act fixed at 0, as in the actual scenario), then Generator would still be 0 (because B_act=0) and Death would still be 1. So in this actual setting, changing A_act does not change Death. However, interventionism requires that there exists some setting of the other variables (i.e., in some background) such that changing A_act changes Death. For example, if we set B_act=1 (intervene to set B_act=1), then if we set A_act=0, Generator=0 and Death=1; if we set A_act=1, then Generator=1 and Death=0. So in the background where B_act=1, changing A_act changes Death. Similarly, for B_act: in a background where A_act=1, changing B_act changes Death. Moreover, this dependence is invariant in a range of backgrounds. Therefore, interventionism says that both A_act and B_act are causes of Death. But note: in the actual context (both=0), an intervention on one does not change the outcome. However, interventionism does not require that the intervention changes the outcome in the actual context; it requires that in some (possibly non-actual) context, an intervention on the cause variable changes the effect. So both omissions are causes. Verdict: causation for both.

  3. PA: Production accounts deny that absences can be causes because there is no physical process. The omissions are absences. Therefore, neither omission is a cause. Verdict: no causation for either.

  4. NG: A was under a duty to act, so A's omission is a cause. B was not under a duty, so B's omission is not a cause. Verdict: causation for A, not for B.

  Pre-theoretic: both seem equally causal. The patient died because no one cranked the generator. Both A and B could have helped but didn't. The duty might make A blameworthy, but the causal contribution seems symmetric.

  Now, the demonstration:

  1. Derive each verdict:

     - DM: For A: If A had cranked (and we hold the actual history fixed, so B still omits), then the generator would have failed (because only one crank) and the patient would have died. So the death would still have occurred. Therefore, A's omission is not a but-for cause of death. Similarly for B: if B had cranked (and A omitted), the generator would have failed and the patient would have died. So B's omission is not a but-for cause.

     - IV: We consider a causal model with variables as above. For A_act: there exists a setting of the other variables (namely, B_act=1) such that if we set A_act=0, then Death=1, and if we set A_act=1, then Death=0. Therefore, A_act is a cause of Death. Similarly for B_act: in the setting A_act=1, changing B_act from 0 to 1 changes Death from 1 to 0. Therefore, both are causes. Note that the actual setting is both=0, but the definition does not require the intervention to change the outcome in the actual setting.

     - PA: There was no physical process connecting the omission of A to the death. The death was caused by the lack of power to the ventilator, which is an absence, but production accounts typically do not accept absences as causes. Similarly for B. Therefore, neither omission is a cause.

     - NG: A was under a duty to crank the generator (as the assigned nurse). Therefore, A's omission is a cause of the death. B was not under any duty (stipulated: off-duty, no responsibility for this patient). Therefore, B's omission is not a cause.

  2. Ablations:

     First ablation: rewire the mechanism so that each agent's action is individually sufficient and the outcome occurs only if both omit. That is, the generator works if at least one cranks. Then the patient dies only if both omit.

     - In this case, the outcome (death) occurs if and only if both omit.

     - Now, for DM: For A's omission: if A had cranked, then the generator would have worked (because even if B omits, A's cranking alone would work) and the patient would have lived. Therefore, A's omission is a but-for cause. Similarly for B. So DM says both are causes.

     - IV: In the actual setting (both omit), an intervention on A_act to 1 (with B_act fixed at 0) would change Death from 1 to 0 (because now A cranks and that is sufficient). Similarly for B. So both are causes.

     - PA: Still no causation because absences.

     - NG: A's omission is still a cause (because duty) and B's is not (no duty).

     Which verdicts flip? DM and IV now say both are causes (they flipped from saying no cause to cause). PA remains no cause. NG remains A cause and B not.

     Second ablation: remove deontic asymmetry by giving both the same role. Suppose both are assigned nurses (so both have a duty). Then:

     - NG now says both are causes (because both have a duty).

     - The other views: DM still says no (because but-for condition still fails), IV still says both, PA still says no.

     So NG flips for B: now says B's omission is a cause.

     Thus, the dependence structure (the wiring) affects DM and IV, while the deontic status affects NG. PA is unaffected. This shows that the two factors are independent.

  3. Generalize to n agents:

     - Structure: each of n agents omits an action; each omission is sufficient for the outcome (so the outcome occurs if at least one omits); the outcome occurs only if at least one omits; and all n omit.

     - DM: For any one agent, if that agent had acted, the outcome would still have occurred (because at least one other omitted). So no causation for any.

     - IV: For each agent, there is a background (where all others act) such that changing that agent from omitting to acting would prevent the outcome. So each omission is a cause.

     - PA: No absences are causes, so none.

     - NG: Only those agents who were under a duty have their omissions count as causes.

