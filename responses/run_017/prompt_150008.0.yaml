  ### Engineered Case: The Ventilator Interlock

  In the ICU of a modern hospital, a critically ill patient depends on a ventilator. The ventilator has a backup power system: a hand-crank generator with a **physical interlock** requiring two handles to be turned simultaneously for activation. If either handle is not turned, the generator fails. The main power fails unexpectedly, triggering an audible alarm. Nurse A, the patient's assigned nurse on shift, is responsible for emergency responses. Nurse B, off-duty and visiting a colleague in the ICU, happens to be present. Both stand near the generator—A by one handle, B by the other. They understand the alarm, know the interlock requires dual cranking, and are physically able to act. Absorbed in a casual conversation, both omit to turn their handles. The backup battery depletes in five minutes, and the patient dies. By stipulation, A has a duty to act (role-based obligation), while B has no duty (off-duty, no institutional responsibility). The outcome depends symmetrically on the omissions: death occurs if and only if at least one omits, and both omissions are sufficient for death (if A omits, B's action alone fails due to the interlock, and vice versa). The redundancy is hardware-based (the interlock mechanism), not procedural. There is no intermediate event (e.g., generator failure depends individually on each omission, not conjointly).

  ---

  ### 1. Verdict Derivation
  - **DM (Difference-Making)**:  
    - For A: If A had acted (turned handle), B still omits (actual history fixed), so the generator fails (single crank), and death occurs. Death would still occur → no causation.  
    - For B: If B had acted, A still omits, generator fails, death occurs → no causation.  
    **Verdict**: No causation for either.  

  - **IV (Interventionism)**:  
    - Model variables: `A_act` (1=act, 0=omit), `B_act`, `Generator` (1=works iff `A_act=1` and `B_act=1`), `Death` (1=die iff `Generator=0`).  
    - For A: Intervention setting `A_act=1` (hold `B_act=0` actual): `Generator=0`, `Death=1`—no change. But in background `B_act=1`, setting `A_act=1` changes `Death` from 1 to 0. Dependence is invariant across backgrounds.  
    - For B: Similarly, in background `A_act=1`, setting `B_act=1` prevents death.  
    **Verdict**: Both omissions cause death.  

  - **PA (Production Account)**:  
    - Omissions are absences (no energy transfer, mark transmission, or process). Death involves no physical process from non-cranking (e.g., no signal from A/B to ventilator).  
    **Verdict**: No causation for either (distinct from DM: PA rejects absences categorically, not due to counterfactual redundancy).  

  - **NG (Norm-Gated)**:  
    - A’s omission: Duty exists (assigned nurse) → cause.  
    - B’s omission: No duty (stipulated) → not a cause.  
    **Verdict**: A’s omission causes death; B’s does not.  

  **Pre-theoretic datum**: Both omissions seem equally causal—e.g., "both let the patient die by not cranking." Duty asymmetry is not perceived as causal asymmetry.

  ---

  ### 2. Ablations: Feature Identification  
  **Feature doing the work**: Dependence structure (for DM/IV) and deontic status (for NG). PA is structure/deontic-insensitive.  

  - **Ablation 1 (Rewire mechanism)**: Make each action individually sufficient (generator activates if either cranks). Outcome occurs only if both omit.  
    - DM flips: But-for test passes for each (if A acts, death is prevented even if B omits). Verdict: Both cause.  
    - IV unchanged: Both cause (interventions change outcome in backgrounds).  
    - PA unchanged: No cause (absences).  
    - NG unchanged: Only A causes (duty-bound).  
    **Change**: DM and IV verdicts flip due to structure change; NG/PA unaffected.  

  - **Ablation 2 (Remove deontic asymmetry)**: Both nurses on duty (equal duty).  
    - NG flips: Both omissions now causes (A and B have duty).  
    - Others unchanged: DM (no cause), IV (both cause), PA (no cause).  
    **Change**: NG flips due to deontic change; others unaffected.  

  **Conclusion**: Structure and deontic status independently drive verdicts in DM/IV and NG, respectively. PA is invariant.

  ---

  ### 3. Generalization to n Agents  
  - **Structure**: n ≥ 2 agents; each omission sufficient; outcome iff ≥1 omits; all omit.  
    - DM: No cause for any (no individual but-for necessity).  
    - IV: All cause (each can change outcome in backgrounds where others act).  
    - PA: No cause for any (absences).  
    - NG: Only agents with duty are causes.  
  - **n = 1**:  
    - DM/IV: Cause (but-for/testable intervention prevents outcome).  
    - PA: No cause (absence).  
    - NG: Cause iff duty exists.  
  **Break at n=1**: DM/IV flip from no cause (n≥2) to cause (n=1). PA/NG unchanged in kind.

  ---

  ### 4. Profligacy Check  
  A also omitted to call for help, fetch another nurse, etc.  
  - **Over-generation by IV**: IV counts all omissions that can be intervened on to change the outcome in some background (e.g., omitting to call for help could be modeled as a variable; if intervention "calls" changes outcome in a background where B is willing but unavailable, IV calls it a cause).  
  - **Vivid here**: The case’s symmetry makes IV’s verdict (both cranking omissions cause) intuitively correct, but IV extends this to *any* action that could have indirectly ensured cranking (e.g., A omitting to bribe B to crank). This over-generates causes.  
  - **Cheapest repair**: Add a *proximity* constraint (e.g., directness or spatial-temporal immediacy) or require causes to be on a **minimal sufficient set** (e.g., only cranking omissions are minimal).  

  ---

  ### 5. Redescription Check  
  Redescribe omissions as positive acts:  
  - A: "Chatting at the station."  
  - B: "Standing idle in the doorway."  
  - **Survive redescription**:  
    - DM: Still no cause (if A stops chatting and cranks, death still occurs due to B’s idling).  
    - IV: Still causes (interventions on chatting/idling change outcomes in backgrounds).  
    - PA: Still no cause (chatting/idling lack physical process to death).  
  - **Depends on absence description**:  
    - NG: Only applies if cause is described as an *omission* (e.g., "failing to crank"). Redescribing as "chatting" makes NG inapplicable.  
  **Shows**: DM, IV, PA treat causes event-insensitively; NG is description-sensitive (requires absence framing).

  ---

  ### 6. Weakest View and Strongest Reply  
  - **Worst view**: DM (denies causation despite strong intuition).  
  - **Strongest actual reply from DM defender**:  
    > "In symmetric overdetermination, no single omission is necessary; the cause is the disjunctive event 'A omits or B omits.' DM correctly identifies this. Our intuition of individual causation misattributes responsibility (e.g., blame on A) to causality. Standard repairs (e.g., adding 'with cotenability' or switching to causal models) violate DM’s 'hold actual history fixed' mandate."  
  - **Why standard repairs fail**:  
    - **Stepwise dependence**: Blocked by constraint (ii)—no intermediate event (e.g., generator failure) that depends *only* on the conjunction.  
    - **Contingency fixes** (e.g., "if B had acted, A’s omission would matter"): Violate "hold actual history fixed."  

  ---

  ### 7. What the Case Establishes  
  This case isolates structural (dependence) and normative (duty) factors, showing they independently drive causal verdicts across theories. It demonstrates that:  
  - **Structure alone** explains IV/PA verdicts (invariant to duty).  
  - **Duty alone** explains NG verdicts (invariant to n or redundancy).  
  - **DM is structurally constrained** (fails for n≥2 overdetermination).  
  - Pre-theoretic intuitions track structural dependence, not norms.  

  **What it does not establish**: That norms *should* influence causation (only that they *do* in NG). It does not resolve which theory is correct or whether omissions are metaphysically causal. It is limited to symmetric overdetermination by omissions in non-dynamic systems.  

  --- 

  **Case satisfies all constraints**:  
  - Hardware redundancy (interlock).  
  - No stepwise escape (generator failure depends on each omission individually).  
  - Duty asymmetry without causal confounds (same knowledge, ability, proximity, timing, efficacy).  
  - Verdicts derived, not stipulated.
