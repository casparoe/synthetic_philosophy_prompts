  Final case description:

  In a bolt factory, machine X produces 10,000 bolts daily, while 20 other machines together produce 1,000. The quality engineer, aware that the overall defect rate is 1/1000, randomly selects one bolt from the day's 11,000 for testing. The hypothesis H is "all machine X bolts are within tolerance". Initially, the engineer reasons that if H holds, then all defects must come from the non-X machines, which would imply a defect rate among non-X bolts of 11/1000 (since 11,000 * 1/1000 = 11 defects must be found entirely in the 1,000 non-X bolts). Without H, the engineer assumes non-X bolts have the typical 1/1000 defect rate. 

