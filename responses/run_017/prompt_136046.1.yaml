prompt: |-
  I had a long argument with a friend last night about the doctrine of doing and allowing, and I would like to settle it in a seminar room rather than over another bottle of wine. Her position was that the distinction is at bottom a causal one: killing and letting die pick out different causal relations between an agent and a death, the causal facts are never what is in dispute, and the only genuinely open question is whether that causal difference carries the moral weight the doctrine assigns it. I disagreed, and I think I disagree at the first step rather than the second. Whether an agent counts as having killed or as having merely let die is fixed only relative to a contrast case — what would have happened had she acted otherwise, or had she not been there at all, or had everyone else behaved as they normally do — and nothing in the physical sequence of events tells you which contrast to apply. She said this was just scepticism about causation and that no one really believes it. Since I cannot browbeat her, I would like to try it on twenty undergraduates.

  The setting: a third-year seminar on the ethics of life and death, twenty students, one seventy-five-minute session, one room with a whiteboard and no technology. They have already worked through the standard cases — the runaway vehicle, the surgeon and the transplant, the switch, the footbridge — and I do not want any of them again. If a vehicle, a hospital, or a large man on a bridge appears in your design, I will not use it. What they have not done is notice that the distinction is applied against a baseline the case does not supply.

  What I want them to come away having seen: that the same physical sequence can be correctly described as a killing or as a letting die depending on which contrast is made salient; that the contrast is not settled by the causal facts; and that the doctrine therefore cannot do the work it appears to do unless something else — a view about what we owe people, or about what an agent may do with her own body, time, and attention — has quietly been built into the choice of baseline. I do not want them to conclude that the distinction is worthless. Several of them will want to conclude exactly that, and I would like the activity to make that route harder rather than easier.

  Constraints on the design. I want something the students do rather than something I describe to them: real choices made in sequence, with small stakes — chips, points, or a public tally — so that they commit to a classification before they can hedge. The disagreement should arise out of the rules and out of what the students do to each other, not out of anything I announce. I would rather not name the doctrine, the baseline problem, or anything else until the debrief. The scenarios should be ordinary and non-medical: a workplace, a climbing party, a shared house, a hiring committee. And the cases should be structurally awkward in a specific way: the outcome should depend on several people's ordinary behaviour, while any one of several others could individually have prevented it and none of them did — so that a student who wants to say that someone killed the victim has to say it of a person whose own act or omission made no difference by itself, and a student who wants to say that everyone merely let the victim die has to say it of people whose combined behaviour was necessary for the death. I have index cards, a pack of playing cards, poker chips, a whiteboard, and a flipchart.

  What I want from you: the rules, the materials, the setup, and a minute-by-minute timeline; the scoring or payoff scheme and what it is meant to make visible; the debrief, mapped onto the moving parts of the idea, including where I should press and where I should stop; an honest account of what will predictably go wrong the first time I run it and how to recover; and a frank statement of which part of the philosophical point the activity cannot deliver and which I will have to say in my own voice afterwards.

  Lead with your bottom line in the first sentence — whether an activity of the kind I have described can actually make the point I want, or whether this is a point I should stop trying to stage and simply argue for — and then give the design and the reasoning. No preamble and no restatement of what I have asked for.
reasoning: |-
  Okay, so the user is a philosophy professor who had an argument with a friend about the doctrine of doing versus allowing. They want to design a seminar activity for their third-year students to illustrate that the distinction between killing and letting die depends on the choice of baseline contrast, not just causal facts. The user provided very specific constraints: no medical examples, no reusing classic cases like trolley problems, and they want an interactive activity where students make real choices with stakes like chips or points. 

  Hmm, the core challenge here is creating scenarios where the same physical sequence can be interpreted as either killing or letting die depending on which contrast case is emphasized. The user explicitly wants to avoid any predefined moral labeling—the disagreement should emerge organically from student actions. They also want structural awkwardness: outcomes must depend on multiple people’s ordinary behavior, with no single person’s action being sufficient to cause or prevent the outcome alone. 

  I’m imagining a scenario involving a workplace or shared responsibility, like a team project or household chore. The "Shared House Chores" setup comes to mind: roommates failing to clean a moldy bathroom, leading to someone’s asthma death. But the user vetoed medical settings, so I’ll pivot to something like a "Team Project Deadline" where a client loses their job because multiple team members delay tasks. No hospitals, no vehicles—check. 

  The scoring system needs to force students to commit to classifications (killing vs. letting die) before hedging. Poker chips could work: students bet chips on whether they think someone "killed" (action) or "let die" (inaction). The twist is that the same person might be accused of both depending on the baseline. For example: if we contrast with "what if everyone did their job," a slacking team member merely let the client down; but if we contrast with "what if they personally intervened," their inaction becomes a killing. 

  Predictable problems: students might fixate on intent or causality despite the activity’s design. Some might resist the ambiguity and demand a "right answer." The debrief needs to gently dismantle that by showing how the baseline choice—not facts—drives the classification. I’ll map each game mechanic to the philosophical point: e.g., chip bets expose how the baseline is assumed, not derived. 

  The one gap: the activity can’t *prove* moral weight rests on baselines; it only shows the classification is baseline-relative. The user will need to argue that part afterward. 

  Structure-wise: minute-by-minute timeline is crucial. Start with setup (5 mins), then scenario narration (10 mins), silent chip bets (5 mins), group debate (25 mins), reveal how baselines shift interpretation (20 mins), and wrap with implications (10 mins). 

  Materials: index cards for roles, poker chips for betting, whiteboard to track accusations. A flipchart could list contrasting baselines during debrief. 

  Biggest risk: students might disengage if the scenario feels contrived. To recover, emphasize real-world parallels (e.g., workplace negligence cases). Stay strict on "no moralizing until debrief" to keep focus on actions. 

  Bottom line: yes, this activity can stage the point—but only up to showing baseline relativity. The rest requires the user’s explanation.
answer: |-
  ### Bottom line: Yes, an activity can robustly stage your core point—that the killing/letting-die distinction is baseline-relative—by forcing students to confront conflicting classifications of identical acts under contrasting norms.  

  **Activity Title:** *The Accountability Auction*  
  **Core Mechanic:** Students secretly "bet" poker chips to classify others' inactions as "killing" (red chips) or "letting die" (blue chips), then debate as shifting baselines reveal inconsistent judgments.  

  ---

  ### **Setup & Materials**  
  - **Materials:** Poker chips (30 red, 30 blue), index cards (20), whiteboard (divided into "KILLING" and "LETTING DIE" columns), flipchart (hidden until debrief).  
  - **Prep:**  
    - Write roles on index cards:  
      - 4 × **"Hiker"** (must monitor weather)  
      - 4 × **"Guide"** (must check gear)  
      - 4 × **"Supplier"** (must stock first-aid kits)  
      - 4 × **"Coordinator"** (must confirm team readiness)  
      - 4 × **"Trail Scout"** (must warn of hazards)  
    - Place 3 red + 3 blue chips on each desk.  

  ---

  ### **Timeline (75 mins)**  

  #### **Phase 1: Scenario & Silent Betting (15 mins)**  
  1. **Narrate the scenario (5 mins):**  
     > "*A climbing team ascends Mount Karak. Each role had one critical safety task. On summit day, a storm hits. Hiker Sam falls, breaks his leg, and dies of hypothermia because:  
     > - Hikers didn’t check the updated forecast (showing the storm).  
     > - Guides didn’t inspect Sam’s heat-retaining gear (which was faulty).  
     > - Suppliers didn’t restock the group’s first-aid kits (missing emergency blankets).  
     > - Coordinators didn’t verify everyone’s readiness.  
     > - Trail Scouts didn’t report the icy path Sam took.  
     >   
     > **Crucially:** No one person’s omission alone caused death. Sam dies only if all 5 tasks are neglected. But if any one task had been done, he’d have survived.*"  

  2. **Silent chip bet (10 mins):**  
     - Students bet 1-3 chips *per role* (not people) by placing chips in envelopes labeled with roles (e.g., "Guide," "Supplier").  
     - **Red chip:** This role *killed* Sam.  
     - **Blue chip:** This role *let Sam die*.  
     - *No neutral bets; stakes = participation points (1 chip = 1 pt).*  

  #### **Phase 2: Tally & First Debate (25 mins)**  
  1. Tally chips on whiteboard:  
     | Role          | KILLING (red) | LETTING DIE (blue) |  
     |---------------|--------------|-------------------|  
     | Hiker         | ###          | ###               |  
     | Guide         | ###          | ###               |  
     | ...           | ...          | ...               |  

  2. **Group debate (20 mins):**  
     - Ask: *"Why did you classify Role X as killing/letting die?"*  
     - **Do not intervene** as students appeal to causality ("If they’d acted, he’d live!"), intent ("They didn’t mean harm!"), or norms ("It was their job!").  

  #### **Phase 3: Baseline Shift & Crisis (25 mins)**  
  1. **Introduce contrast cases (5 mins):**  
     - Flipchart reveals two baselines:  
       - **BASELINE A:** *"What if everyone did their job (ideal world)?"*  
       - **BASELINE B:** *"What if *no one* did their job (total neglect)?"*  

  2. **Reclassify (10 mins):**  
     - Students re-bet chips *for the Guide role only* under each baseline:  
       - Under Baseline A: Guide’s omission = ______  
       - Under Baseline B: Guide’s omission = ______  

  3. **Reveal inconsistency (10 mins):**  
     - Show bets: e.g., Baseline A yields "killing" (red); Baseline B yields "letting die" (blue).  
     - **Pivot question:** *"Same act, same outcome. Why did your judgment flip? What *changed*?"*  

  #### **Phase 4: Structured Debrief (10 mins)**  
  - **Map the activity to your point:**  
    | Activity Moment          | Philosophical Point                          |  
    |--------------------------|---------------------------------------------|  
    | Initial chip bets        | Pre-theoretical intuitions rely on hidden baselines |  
    | Debate appeals to "duty" | Norms (not causality) drive classifications |  
    | Baseline shift           | Physical acts are fixed; baselines assign moral labels |  
    | Inconsistent judgments   | Doctrine fails without justifying *which* baseline matters |  
  - **Press:** *"If causality alone doesn’t pick the baseline, what does? Can we agree on that?"*  
  - **Stop short of:** Concluding the distinction is worthless. Instead: *"The distinction might track moral responsibility, but only after we settle what we owe each other."*  

  ---

  ### **Predictable Problems & Recovery**  
  - **Problem:** Students fixate on causality.  
    - *Recovery:* Ask: *"Did the *physics* of Sam’s death change when we switched baselines?"*  
  - **Problem:** Students demand to judge *people*, not roles.  
    - *Recovery:* Emphasize: *"We’re isolating the moral structure of omission."*  
  - **Problem:** Some insist "everyone killed Sam."  
    - *Recovery:* Challenge: *"If each alone couldn’t cause death, how did they *kill*? Does ‘killing’ require direct causation?"*  

  ---

  ### **What the Activity Can’t Deliver**  
  - **Gap 1:** It shows baseline-relativity but cannot *prove* causality is insufficient. You must argue: *"Causal facts tell us Sam died from hypothermia after combined omissions. They don’t tell us whether to contrast with a world where Guides always act, or where no one does."*  
  - **Gap 2:** It doesn’t defend the distinction’s value. You must add: *"The doctrine might still reflect agent-relative duties (e.g., using your body vs. aiding others), but it’s not read off causality."*  

  **Final Script Snippet:**  
  > *"When you called the Guide a ‘killer’ under Baseline A, you assumed we owe each other competent professionalism. Under Baseline B, ‘letting die’ assumed we owe only non-interference. Same act. Same outcome. The baseline did the work. So: what *justifies* the baseline?"*  

  This forces the debate you want: not whether the distinction *matters*, but *what grounds it*.
