prompt: |-
  Hey — you're a clinical ethicist and philosopher who's also sat on a hospital IRB for years, so take this seriously, brainstorm a bit first, and then give me something I can actually use.

  I'm the senior research nurse on a transplant/oncology floor and I run the consent conversations for trials and for a couple of high-risk procedures — usually 4–6 a week, 15–20 minutes each, and I have to log a decision the same day that the IRB and the PI will both sign off on. Patients are often on steroids or opioids, sometimes in pain, frequently with family in the room who have already made up their minds, and the person recruiting them is very often their own treating consultant. I want a procedure, not a form: the questions in order, what counts as a sufficient yes to each one and what counts as a no, the question where I stop and don't proceed, and the places where I have to hand the call to someone else because it's a values question dressed up as a factual one. Be honest about which steps are theatre I perform for the file.

  Two things the standard disclosure / understanding / voluntariness checklist just doesn't help me with, and I need them handled: (a) everything comes as a package — the trial drug only comes with the extra biopsies and the home-visit adherence monitoring, so people say yes to the whole bundle because they want one part, or say yes to part and refuse the rest; (b) I have to pick some framing of the risks and the framing moves people — "30%" vs "about a third", survival curves vs. side-effect lists — so I'm never merely transmitting information, and I cant tell when that tips over into having manufactured the yes myself.

  Then run the procedure on three cases: [1] Mr A, day 3 on high-dose steroids, consenting for a phase I dose-finding trial; cheerful, repeats all the numbers back to me correctly, and volunteers that this is his best shot at a cure — it isn't, it's dose-finding, there's no therapeutic intent. [2] Ms B, listed for a transplant, perfectly happy to take the organ and the immunosuppression, refuses the protocol-required weekly adherence visits, and says then just give her the transplant without the study — there is no such option. [3] Mr C, enrolled under deferred consent after an emergency procedure, sister signed; he wakes up on day 2, fully with it, says he would never have agreed, wants out of the study going forward but is fine with the data already collected.

  Give me the answer the procedure actually gives, even when it's one I wont like, and tell me at the end what the procedure can't do.
reasoning: |-
  Okay, let me start by understanding what this research nurse really needs. They're dealing with high-stakes consent conversations in transplant/oncology, where patients are often on meds that could impair judgment, and family or treating doctors might be influencing them. They want a clear, step-by-step procedure that's practical, not just a form. The two main pain points are the bundled nature of trials (patients can't pick and choose parts) and how framing risks can manipulate decisions.

  First, I need to address the core elements of consent: disclosure, understanding, voluntariness. But the nurse is right—standard checklists don't handle bundles or framing. So the procedure must have clear red flags where consent isn't valid. For bundles, I should emphasize that it's all-or-nothing, and make that explicit early on. For framing, I need to standardize language—like using both percentages and fractions for risks—and document the framing used. 

  The nurse also mentioned three cases. For Mr. A on steroids, the issue is therapeutic misconception. Even if he repeats facts correctly, believing it's curative when it's not invalidates consent. The procedure must test for misconception, not just recall. For Ms. B refusing home visits, the bundle problem is central. She can't opt out of parts; the procedure should flag this early and clarify no alternative exists. If she refuses, consent fails. Mr. C wants to withdraw post-enrollment, which is straightforward ethically—he can exit future parts but past data might be kept depending on IRB waiver.

  Now, the structure. The procedure should have phases: Pre-Consent Prep, Disclosure, Understanding Check, Voluntariness Check, and Final Decision. Each phase needs specific questions with clear yes/no criteria and exit points. For example, in Understanding, asking "What's the main purpose?" and if they mention cure for a phase I trial, that's a stop. 

  I should also identify "theatre" steps—things done for documentation but not core to validity, like verbatim recall. The nurse needs to know where the real red flags are. For framing, using dual framing (both % and fractions) and documenting it can reduce bias. Bundles require explicit statements that components aren't separable, early in the conversation.

  Applying this to the cases: Mr. A's misconception stops consent. Ms. B's refusal of a bundle component means no consent. Mr. C can withdraw, but data retention depends on IRB approval. The procedure won't solve all problems, like deep therapeutic misconception or family pressure, but it flags when consent isn't valid. 

  I need to ensure the procedure is actionable. Clear scripts for each step, criteria for passing/failing, and who to escalate to (like the ethicist). Also, honesty about limitations—it can't eliminate framing effects entirely or make bundles optional, but it can make issues visible for the IRB.
answer: |-
  Here’s a structured consent procedure designed for high-stakes, time-constrained clinical environments. It prioritizes **valid decision-making** over ritualistic compliance, with explicit exit criteria and escalation paths. It addresses bundling and framing transparency head-on.  

  ---

  ### **Consent Procedure: 6-Step Framework**  
  *(Time: 15–20 min; Logged same day)*  

  #### **STEP 1: PRE-CONSENT SCREENING (3 min)**  
  - **Question 1:** *"On a scale of 0–10, how is your pain/fatigue right now? Are any medications making you feel foggy or unlike yourself?"*  
    - ✅ **Sufficient**: ≤7 pain, denies confusion.  
    - 🛑 **Stop & Escalate**: ≥8 pain, admits confusion, or altered mentation observed.  
    - *Action*: Delay consent; notify treating MD for symptom management. Reassess in 24h.  
  - **Question 2:** *"Who else is involved in this decision? May I confirm with you alone for part of this talk?"*  
    - ✅ **Sufficient**: Patient affirms independence or clarifies surrogate role.  
    - 🛑 **Stop & Escalate**: Family dominates responses; patient defers entirely.  
    - *Action*: Pause. Escalate to ethics if coercion suspected.  

  > *Theatre Note:* Logging pain scores is for the file, but the real test is observed coherence during Q2.  

  ---

  #### **STEP 2: BUNDLED NATURE DISCLOSURE (3 min)**  
  - **Script**: *"This trial/procedure is a package. You cannot choose parts. If you want [desired element], you must accept [biopsies/adherence checks/etc.]. There is no alternative version without these. Is this clear?"*  
    - ✅ **Sufficient**: "I understand it’s all or nothing."  
    - 🛑 **Stop & No Consent**: "I only want part of it," or refusal of any core element.  
    - *Action*: Do not proceed. Log: "Patient declined bundled requirements." Notify PI.  

  > *Critical for Ms. B’s case*.  

  ---

  #### **STEP 3: FRAMING-TRANSPARENT RISK DISCLOSURE (4 min)**  
  - **Rule**: Dual-frame all statistics: *"30% (about 1 in 3) of participants experience [side effect]"* AND show visual (e.g., pie chart).  
  - **Question 3:** *"In your own words, what’s the most severe risk I mentioned, and how likely is it?"*  
    - ✅ **Sufficient**: Roughly accurate restatement (e.g., "Serious infection, ~30% chance").  
    - 🛑 **Escalate**: Misstates risk by >20% or severity.  
    - *Action*: Correct, then re-check. If persistent, delay consent. Log framing used.  
  - **Theatre Note**: Documenting verbatim recall is theatre; true test is whether they grasp risk magnitude relative to alternatives.  

  ---

  #### **STEP 4: PURPOSE & MISCONCEPTION CHECK (3 min)**  
  - **Question 4:** *"What do you believe is the main goal of this trial/procedure for you?"*  
    - ✅ **Sufficient**: Aligns with facts (e.g., "Test safety, not cure" for Phase I).  
    - 🛑 **Stop & Escalate**: Therapeutic misconception (e.g., "My best shot at a cure").  
    - *Action*: **Stop consent immediately**. Correct misconception: *"This is not treatment; it’s safety testing. Your chance of benefit is near zero."* Re-attempt only if misconception resolves.  
    > *Critical for Mr. A*.  

  ---

  #### **STEP 5: VOLUNTARINESS ASSURANCE (2 min)**  
  - **Question 5:** *"If your doctor or family wanted this but you didn’t, would you still feel free to say no?"*  
    - ✅ **Sufficient**: Unhesitating "yes," with eye contact.  
    - 🛑 **Escalate**: Hesitation, glancing at family/MD, or "I have to do this."  
    - *Action*: Escalate to ethics for coercion assessment. Do not proceed that day.  

  ---

  #### **STEP 6: FINAL DECISION & LOG (2 min)**  
  - **Script**: *"You can say yes, no, or ask for more time. Your care won’t change if you refuse."*  
  - **Log Requirements**:  
    - ✅ Valid: Bundling understood, no misconception, voluntary, risks restated.  
    - ❌ Invalid: Any 🛑 trigger from Steps 1–5.  

  ---

  ### **APPLICATION TO YOUR CASES**  
  #### **Case 1: Mr. A (Steroids, Phase I Trial)**  
  - **Step 4 Check**: "Best shot at a cure" → **Therapeutic misconception**.  
  - **Procedure Outcome**: 🛑 **Consent invalid**. Do not enroll. Escalate to PI to clarify trial intent. Re-attempt only if he later states: *"I know this won’t help me."*  

  #### **Case 2: Ms. B (Refuses Adherence Visits)**  
  - **Step 2 Check**: Insists on partial consent → **Bundle refusal**.  
  - **Procedure Outcome**: 🛑 **Consent invalid**. Log: "Declined required study component." No trial enrollment. Offer standard transplant.  

  #### **Case 3: Mr. C (Withdraws Post-Deferred Consent)**  
  - **Not a consent conversation** (already enrolled).  
  - **Procedure Outcome**: ✅ **Honor immediate withdrawal**. Future interventions stop. Data retention:  
    - *Ethics Rule*: Pre-collected data often kept per IRB waiver (if anonymized).  
    - *Action*: Notify PI. Document: "Patient withdrew ongoing participation; prior data retained per protocol §X."  

  ---

  ### **WHAT THIS PROCEDURE CAN’T DO**  
  1. **Eliminate Framing Effects**: You’ll always influence via language. Transparency (dual-framing + documentation) is the only mitigation.  
  2. **Override Bundled Protocols**: If the IRB requires biopsies, you can’t unbundle. The procedure only exposes this rigidity.  
  3. **Cure Therapeutic Misconception**: If a patient clings to false hope after correction, you must still refuse consent.  
  4. **Neutralize Hierarchical Pressure**: If a consultant implies "no trial = inferior care," your voluntariness check may fail, but you can’t change the power dynamic.  

  **Final Script Note**: When logging, use phrases like: *"Patient restated purpose as safety testing, not therapy (Step 4). Bundled requirements explicitly accepted (Step 2)."** This satisfies IRBs while centering validity. Escalate ambiguities to ethics—your role is flagging issues, not resolving values conflicts.  

  This turns consent from a checkbox into a defensible ethical process. Adapt wording, but never compromise the red flags.
