prompt: |-
  Im trying to write down what I should even be demanding of a theory of rational belief under uncertainty before I read another round of people talking past each other. Keynes territory: the cases where you dont have a base rate and cant get one.

  The purpose I care about, so adequacy is relative to it: the theory should be good enough to guide somebody facing a genuinely new risk -- an insurer pricing a liability that has no loss history at all, someone deciding whether to move their family to a country whose political settlement may not survive the decade, a government building infrastructure against climate scenarios the models dont agree on. Not good enough to be elegant, good enough to tell that person what to do and why they should trust it.

  So: write me the desiderata. What a theory of this kind has to deliver, with the case or consideration behind each requirement, and a verdict on which requirements are non-negotiable and which are just the tastes of one camp. Here is the messy list I have so far -- reorganize it, split things, merge things, throw things out, add the ones Ive missed:

  - It has to mark some real difference between risk (you have numbers, or a defensible way to get them) and uncertainty (you dont), and the marker cant just be that the agent feels unsure. Motivating case: the urn with a known 50/50 composition versus the urn whose composition you know nothing about -- what exactly is different, and why does the difference survive the fact that both urns force you to act?
  - It has to say what rationality requires when you genuinely cant put a number on it. Is a number mandatory, or may the output be an interval, or a set of admissible probabilities, or no number at all -- and if no number, then what do you do, and how is that not just panic?
  - Seperate slots for (i) how confident you are and (ii) how much that confidence rests on the evidence you actually have. Case: a drug given to ten patients, six recover; the same drug given to a thousand, six hundred recover. Same ratio, very different amount of evidence. I want the theory to say whether slot (ii) is allowed to change what you should do, or whether it is merely a feeling of comfort that a rational agent should ignore.
  - Something about where the state space comes from: being uncertain about the model versus being uncertain within a model. My worry is that this distinction is fake, because which model is right is itself just another proposition you can have a probability about. So tell me whether distinguishing structural uncertainty is a genuine desideratum or a prejudice of the anti-Bayesian camp.
  - It has to handle the ambiguity cases where people prefer known odds to unknown ones. But I genuinely dont know whether reproducing that preference is a requirement a theory must meet or whether a good theory is allowed to explain it away as a bias -- give me your view, with the reasoning.
  - It has to say how confidence combines across independent matters when there are no numbers to multiply, and whether independence is even something the agent can be entitled to assume in the cases I described above.
  - It owes something to an agent who cannot enumerate the possibilities: uncertainty about what your options even are, outcomes nobody has thought of yet. Is that a separate desideratum or just a special case of the model-uncertainty one?
  - It is not allowed to smuggle in what it is supposed to be earning: no quiet assumption that the future resembles the past, or that unseen cases are drawn from the same distribution as the seen ones. But it also is not allowed to conclude that nothing can be said. Whatever it does with induction has to be done honestly, and I want you to say whether those two constraints leave any room at all.

  The part I actually want, though: which subset of these cannot be had together. My guess is that representing confidence without numbers, giving a compositional rule for combining uncertainties, and yielding determinate action guidance are jointly unsatisfiable, but argue it properly, or swap in the triple that is really in trouble. Also tell me which single requirement does the most work in knocking candidates out -- the one that excludes the most otherwise-decent theories. If the answer is that the whole list is only satisfiable by collapsing uncertainty back into risk, say that and tell me which requirement to drop to avoid it.

  Keep it short at the end: a quick scorecard, table is fine, for a strict subjectivist Bayesian with one precise prior, an imprecise-probability or set-of-priors view, a Keynes-style logical-relation account with a seperate notion of evidential weight, and a maximin or robust-decision-making approach. Two or three lines each, the criteria are what Im paying for.
reasoning: |-
  Okay, the user is trying to establish clear criteria for a theory of rational belief under uncertainty, specifically for novel risks without historical data. They've provided a messy list of requirements and want it reorganized, evaluated, and prioritized. 

  First, I need to understand their core concern: practical decision-making in unprecedented situations. They're frustrated with academic debates and want actionable guidance. The examples given (insurer pricing novel liabilities, family relocation amid political instability, climate infrastructure) show they care about real-world stakes, not theoretical elegance.

  Hmm, their list has overlapping items that need restructuring. The risk vs. uncertainty distinction (#1) is fundamental - it's the starting point. Then comes the representation problem (#2) and evidential weight (#3), which are linked but distinct. The model uncertainty point (#4) seems redundant because if models are propositions, it collapses into standard uncertainty - but maybe they're worried about framing effects? 

  Ambiguity aversion (#5) is tricky. Behavioral economics shows it's real, but should rationality accommodate or correct it? For their use case, I lean toward accommodating - when lives are at stake, preferring known risks may be rational. The enumeration problem (#7) feels different from model uncertainty; it's about unknown unknowns, like Taleb's black swans.

  Ah, the induction constraint (#8) is brutal. No past resemblance assumption, but must say something. This immediately sinks strict subjectivist Bayesians. The combination problem (#6) and determinate action (#2) might conflict - compositional rules need structure, but true novelty resists structure.

  The user suspects a trilemma: no-numbers representation + combination rules + determinate guidance = impossible. I agree. If you refuse numbers, combination gets messy; if you demand determinate actions, you're forced toward numbers. The knockout punch is #8 (no smuggled induction) - it wrecks frequentist and default-prior approaches.

  For the scorecard: strict Bayesians fail #1, #2, #3, #8. Imprecise probabilities handle #1 and #2 but stumble on #6 and #8. Keynesian weight struggles with #6 and #8. Maximin wins on #5 and #8 but fails #2 and #3. 

  The compromise? Tell them to drop determinate action (#2) if they want to keep radical uncertainty honest. But that might frustrate their practical needs... tough trade-off.
answer: |-
  Here's a streamlined set of desiderata for a theory of rational belief under radical uncertainty ("Keynes territory"), prioritized and clarified for your purpose of guiding high-stakes, novel decisions. Non-negotiable items (NN) are essential for your use case; others are important but potentially debatable.

  ### Core Desiderata
  1.  **NN: Distinguish Risk vs. Radical Uncertainty:** Must provide a *principled, objective distinction* (not just psychological) between situations with well-defined probabilities ("risk") and those without ("uncertainty"). *Why?* Your cases (new liability, political collapse, novel climate) lack stable frequencies or sufficient evidence to form reliable probabilities. The "known 50/50 urn" vs. "unknown composition urn" case demands this. The difference survives because rational action *cannot* treat them identically when probabilities are fundamentally unknowable.

  2.  **NN: Action Guidance Without Precise Probabilities:** Must specify what constitutes rational *action* when no defensible single number exists. Cannot mandate a precise probability. Output could be intervals, sets of priors, rules of thumb, or direct action prescriptions – but it *must* tell the agent what to *do* and why it's rational, avoiding paralysis ("panic"). *Why?* Your insurer/government/family needs to act, not just contemplate ignorance.

  3.  **NN: Incorporate Evidential Weight/Confidence:** Must separately represent (i) the *degree of belief* in a proposition and (ii) the *weight* or *robustness* of the evidence supporting that belief. *Why?* 6/10 recoveries vs. 600/1000 show identical ratios but vastly different evidence. Weight *must* influence rational action (e.g., higher weight justifies bolder commitments), not just subjective comfort. Ignoring it is reckless in novel scenarios.

  4.  **NN: Handle Unknown Possibilities & Model Uncertainty:** Must address true ignorance – the inability to enumerate states or outcomes ("unknown unknowns") and deep uncertainty about the *correct model/structure* itself. *Why?* Political collapse might involve unforeseen actors; novel climate risks involve disputed physical mechanisms. Treating model uncertainty as just another probability often smuggles in unwarranted assumptions. This is distinct from parameter uncertainty within a fixed model.

  5.  **NN: Avoid Smuggling Inductive Assumptions:** Cannot *assume* the future resembles the past, stable underlying distributions, or exchangeability of novel cases with historical ones. *Must still* provide non-trivial action guidance. *Why?* Your cases (no loss history, unprecedented political stress, divergent climate models) violate these assumptions. A useful theory must grapple with induction honestly, not assume it away. This is the *major knockout criterion*.

  6.  **Accommodate Ambiguity Aversion:** Should explain or justify the common preference for known risks over unknown uncertainties *in high-stakes decisions*. *Why?* While potentially a "bias," this preference often reflects a *rational* aversion to unquantifiable downside risks when welfare is at stake (e.g., moving a family). A theory dismissing this entirely may be impractical. (Debatable but practically crucial).

  7.  **Handle Combination & Independence (If Possible):** Should address how confidence/uncertainty combines across independent (or seemingly independent) uncertainties without precise numbers. *But* must be clear when assuming independence is unjustified. *Why?* Novel risks often involve multiple uncertainties (e.g., climate model *and* economic impact). However, demanding full compositionality may be incompatible with radical uncertainty (see Trilemma below). (Desirable, not strictly NN).

  ### Rejected/Split Items
  *   **"Feeling Unsure" Marker:** Rejected. Covered by NN1 (objective distinction needed).
  *   **"Slot (ii) Change Action?":** Covered and answered affirmatively in NN3 (Weight must matter).
  *   **"Model Uncertainty = Fake Distinction?":** Covered and answered negatively in NN4 (It's genuine and distinct).
  *   **"Enumerate Possibilities":** Merged into NN4 (Unknown unknowns are core to structural/model uncertainty).

  ### The Trilemma & Knockout Criterion
  You suspect a trilemma: **Representation without numbers + Compositional rules + Determinate action guidance are jointly unsatisfiable under radical uncertainty.** This is likely correct.

  *   **Representation without numbers** (NN2) avoids false precision.
  *   **Compositional rules** (Desideratum 7) demand structure for combination.
  *   **Determinate action guidance** (NN2) demands clear output.
  *   **Radical Uncertainty** (NN1, NN4, NN5) undermines the stable structure needed for compositionality *and* precise action guidance.

  **The Knockout Criterion is NN5 (No Smuggling Induction/Provide Guidance Anyway).** This excludes:
  *   **Frequentism:** Requires stable long-run frequencies (violates NN5).
  *   **Strict Subjective Bayesianism (Single Prior):** Requires a precise prior, smuggling in inductive assumptions or subjective whimsy to "fill the gap" (violates NN1, NN2, NN5). Action guidance is precise but often rests on sand.
  *   **Many "Default Prior" Approaches:** Often implicitly assume exchangeability or resemblance (violates NN5).

  **Solution?** You likely need to relax the demand for *universal* **compositional rules (Desideratum 7)**. Under radical uncertainty, combination may be highly context-specific, rely on robustness checks, or focus on worst/best cases rather than a general formula. **Determinate action guidance (NN2) is preserved by shifting focus to decision rules (e.g., maximin, satisficing) applied to the non-probabilistic representation.**

  ---

  ### Theory Scorecard (Focused on Your Criteria)

  | Theory                      | NN1 (Risk/Uncertainty) | NN2 (Action w/o Precise Prob) | NN3 (Evidential Weight) | NN4 (Unknowns/Model) | NN5 (No Smuggle Induction) | Des6 (Ambiguity Aversion) | Notes                                                                 |
  | :-------------------------- | :--------------------- | :---------------------------- | :---------------------- | :------------------- | :------------------------- | :------------------------ | :-------------------------------------------------------------------- |
  | **Strict Subj. Bayesian (1 Prior)** | ❌ Fails               | ❌ Fails (Mandates number)    | ❌ Fails (Ignores)       | ❌ Fails             | ❌ Fails (Prior smuggles)  | ❌ Fails                  | Precise action, but foundationally unsuited to radical uncertainty.   |
  | **Imprecise Prob / Set of Priors** | ✅ Good                | ⚠️ Partial (Sets guide, but action rule needed) | ⚠️ Weak (Set size hints at weight?) | ⚠️ Partial (Sets can reflect model doubt) | ⚠️ Partial (Choice of set can smuggle) | ⚠️ Partial (Can model aversion) | More honest representation, but action guidance often underspecified (e.g., MaxiMin over set?). |
  | **Keynesian (Weight/Interval)** | ✅ Excellent           | ⚠️ Partial (Intervals guide, action rule needed) | ✅ Excellent            | ⚠️ Partial           | ⚠️ Partial (Logic of intervals?) | ⚠️ Partial                | Best on weight (NN3). Intervals help NN1/NN2. Still needs action rule & struggles with NN4/NN5 foundations. |
  | **Maximin / Robust Opt.**   | ✅ Excellent           | ✅ Excellent (Direct action)  | ❌ Fails (Ignores)       | ✅ Excellent (Focuses on worst-case unknowns) | ✅ Excellent (Makes no probabilistic assumptions) | ✅ Excellent (Built-in aversion) | Strongest on NN1, NN2, NN4, NN5, Des6. Fails NN3 (ignores weight/evidence). Can be overly pessimistic. |
