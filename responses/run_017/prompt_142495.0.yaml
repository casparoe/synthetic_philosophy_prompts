     - They might not engage. 
     - Solution: Acknowledge that the scenario is hypothetical, but the point is to explore our intuitions about what matters for having a mind. Encourage them to play along for the sake of argument.

  4. **Time management**:
     - The discussions might run long. 
     - Solution: Use a timer and be strict. If a scenario is taking too long, cut off the open discussion and note that we'll come back in the debrief.

  5. **Voting confusion**:
     - Make sure the voting is clear. Use index cards with the group name and their vote (YES/NO) and a short reason.

  **What the activity might not capture and you'll have to supply:**
  - The activity focuses on the grain of replacement and counterfactual robustness. It might not explicitly bring out the idea that the pattern is what does the causal work vs. merely tracking the work of the stuff. You'll have to connect the dots in the debrief by pointing out: 
