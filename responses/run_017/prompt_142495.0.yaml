  This should create the intuitive pull and set up the philosophical debate without jargon until the end.
answer: |-
  Here's a complete activity plan designed to meet your goals, with rules, materials, timeline, payoff scheme, debrief guidance, and strategies for handling predictable issues. The activity is called **"Caring License Hearing,"** framed as a mock regulatory committee deciding whether entities deserve a "caring license" (points) based on their capacity for genuine care/experience.

  ---

  ### **Activity Overview**
  - **Core Mechanic**: Small groups debate and vote on whether hypothetical entities "care," earning points for consensus, persuasive reasoning, and spotting key dilemmas.  
  - **Goal**: Students experience the tension between functional patterns and physical substrate intuitively, uncovering grain-sensitivity and counterfactual robustness through disagreement.  
  - **No Jargon Rule**: Terms like "functionalism" or "substrate" are banned until the debrief. Use only plain language (e.g., "stuff," "organization," "behavior").  

  ---

  ### **Materials**  
  - **Whiteboard**: Track group points and note key arguments during discussions.  
  - **Index Cards (5 per group)**: For secret ballots on cases.  
  - **Timer**: For strict timekeeping.  
  - **Candy/Prize**: For the winning group (e.g., 5 bonus participation points or candy).  

  ---

  ### **Rules & Payoff Scheme**  
  - **Groups**: Divide the 18 students into 5 teams (3–4 students each). Each team is a "licensing committee."  
  - **Points System**:  
    - **Consensus Bonus**: +3 pts if a team unanimously agrees on a case.  
    - **Argument Points**: +1 pt per team if their reasoning (shared aloud) uses a concept from your target cases (e.g., "grain of replacement," "untested inputs").  
    - **Spotting Tensions**: +2 pts if a team identifies a conflict between cases (e.g., "In Case 1 we said X, but in Case 3 we said Y—why?").  
  - **Voting**:  
    - Teams discuss and vote secretly per case using index cards (✓ for "cares," ✗ for "doesn't care").  
    - Majority vote wins for the team; ties lose consensus bonus.  
  - **Winning**: Highest-scoring team gets the prize.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Step 1: Setup (5 min)**  
  - Introduce the activity: *"You’re a committee deciding if entities made of ‘careenium’ (brain goo) or ‘simmballs’ (perfect imitators) deserve a license for genuine care. No jargon—focus on your gut feelings. Points for teamwork, good arguments, and spotting inconsistencies."*  
  - Assign groups and write point rules on the board.  

  **Step 2: Cases & Voting (50 min, 10 min per case)**  
  Present each case with minimal setup. Teams have:  
  - 4 min to discuss/vote in groups.  
  - 3 min to share reasoning (1 team volunteer speaks).  
  - 3 min for open debate (you facilitate, noting arguments on the board).  
  - **Cases** (order matters to escalate tension):  
    1. **Baseline Brain**: *"A healthy careenium brain—normal organization. Does it care?"*  
       - *Expected:* Unanimous ✓. Warms them up.  
    2. **Neuron-by-Neuron Swap**: *"Replace careenium neurons one-by-one with simmballs (same inputs → same outputs). After 100% swap, same behavior. Does it care?"*  
       - *Expected:* Mostly ✓. Shows comfort with gradual functional replacement.  
    3. **Whole-Region Black Box**: *"Swap a brain region (e.g., vision cortex) with a single black box that matches input-output—same function, but no internal parts. The rest is careenium. Does it care?"*  
       - *Targets grain-sensitivity.* Your hunch: teams balk (✗) despite same function.  
    4. **Careenium Paste**: *"Blend a careenium brain into goo—same amount of stuff, but no organization. Apply inputs; it just heats up. Does it care?"*  
       - *Expected:* Unanimous ✗. Forces concession: organization > stuff.  
    5. **Simmball Types**: *"Two simmball replacements for a careenium brain:*  
       - *A: Matches all inputs so far, but untested on new ones.*  
       - *B: Matches all possible inputs.*  
       *Do A and/or B care?"*  
       - *Targets counterfactual robustness.* Teams may split on A (✗) vs. B (✓).  

  **Step 3: Silent Reflection (5 min)**  
  - *"Write one sentence: When did you feel unsure about your vote, and why?"* Collect responses to inform debrief.  

  **Step 4: Debrief & Jargon Intro (15 min)**  
  - **Map Discoveries**: Use whiteboard notes to highlight:  
    - Grain-sensitivity: *"In Case 2 (neuron-by-neuron), you accepted simmballs, but in Case 3 (black box), many rejected it—even though both had the same function. What felt different?"*  
    - Organization > stuff: *"In Case 4 (paste), you said no—so stuff alone isn’t enough."*  
    - Counterfactuals: *"In Case 5, did untested inputs (A) vs. all possible inputs (B) change your vote? Why?"*  
  - **Introduce Vocabulary**: *"You’ve hit the core debate: is the pattern (function) doing the causal work, or is it just describing what the stuff does? Philosophers call this..."* Add "functionalism," "substrate," "grain," "counterfactual robustness" to the board.  
  - **Connect to Readings**: *"This mirrors the careenium/simmballs dilemma—is the symbol-level description causal or just riding on the goo?"*  

  ---

  ### **Handling Predictable Problems**  
  1. **CS/Engineering Majors ("Obviously just function!")**:  
     - **Preempt**: In Case 3 (black box), ask: *"If the black box is a sealed unit, how do you know it’s *really* caring and not just faking?"* Highlight grain-sensitivity.  
     - **Leverage**: If they dominate, assign them to argue *for* substrate in one case (e.g., *"Team 2, defend why the black box might NOT care"*).  

  2. **"Goo Defenders"**:  
     - **Validate**: *"Great point—why might the physical stuff matter even if behavior is identical?"* Award argument points if they note paste (Case 4) requires organization.  

  3. **Skeptics ("This is silly!")**:  
     - **Reframe**: *"Treat it like a sci-fi thought experiment—what’s the *intuitive* call? Points for playing along!"*  
     - **Engage**: Ask them to propose a tweak to a case that would change their vote (e.g., *"What if the black box was made of organic parts?"*).  

  4. **Time/Loud Voices**:  
     - **Enforce**: Use a timer. If discussions run long, cut in: *"30 seconds—final vote!"*  
     - **Balance**: Cold-call quiet members: *"Alex, what’s your team’s toughest disagreement?"*  

  ---

  ### **What the Activity Can’t Capture (Supply in Debrief)**  
  - **Causal Work vs. Description**: Students will *feel* the pattern/stuff tension but may not articulate *why* grain or counterfactuals matter. In debrief, clarify:  
    - *"When you rejected the black box (Case 3) but accepted gradual replacement (Case 2), you implied the fine-grained pattern is causal—not just the coarse function. If the pattern is just tracking the stuff’s work, why would grain matter?"*  
    - *"If you distinguished Simmball A and B (Case 5), you treated counterfactual robustness as causal—but is that part of the pattern or the stuff?"*  

  ---

  ### **Predicted Outcomes & Adjustments**  
  - **If Grain-Sensitivity Fails** (e.g., teams accept the black box):  
    - Focus debrief on *why* they didn’t care about grain (e.g., *"Does internal structure not matter if outputs match?"*) and tie it to Case 5 (counterfactuals).  
  - **If Consensus Dominates**:  
    - Seed dissent: *"Team 3, argue the opposite view for extra points."*  
  - **Discovery Payoff**: The activity naturally surfaces your target cases. E.g., rejecting paste (Case 4) proves organization matters; splitting on Simmball A vs. B (Case 5) proves counterfactual sensitivity.  

  This plan creates experiential tension while keeping you as a facilitator (not lecturer). Students "stumble into" the philosophy through structured disagreement, and you crystallize it in the debrief. Run it as written, and you’ll have a noisy, engaging section!
