  1. Baseline (quick, gets everyone on same page) - 5 min
  2. Gradual Replacement - 8 min
  3. Whole-Region Black Box - 8 min
  4. Careenium Paste - 8 min
  5. Simmball: Limited Testing vs. Full Functionality - we present two cases together? Or we do two separate but quick ones? Let's do:

  For scenario 5: "We have two simmball systems. Both are designed to replace a careenium brain. 
  - Simmball A: It has been tested to match the brain on every input that has actually occurred in the brain's entire history. But it hasn't been tested on every possible input. 
  - Simmball B: It matches the brain on every possible input, even those that never occur. 
  Do you award a caring license to Simmball A? To Simmball B?"

  Then we have groups vote separately for A and B. This might take a bit longer but it's one scenario.

  **Debrief (15 min):**
  - First, you announce the winning group (most points) and give the prize.
  - Then, you ask: "What patterns did you notice in our decisions? When did we all agree? When did we disagree?"
  - You note the disagreements and map them to the concepts:
     - In the gradual replacement, we were okay with simmballs because the function was preserved step by step. But in the whole-region replacement, some of us were uncomfortable because the internal structure was gone? That's about the grain of the functional description.
     - In the paste, we all agreed that organization matters. So it's not just the stuff, it's the pattern.
     - In the simmballs, we might have treated A and B differently. That shows that what matters is not just the actual behavior but the counterfactual behavior (what it would do in situations that haven't happened). That suggests that the pattern of causal relationships (the function) is what we think does the work.

  - Then you introduce the terms: functionalism (the pattern of causal relations is what matters) vs. substrate-based views (the physical stuff matters). And you explain that the activity was about whether the pattern is doing the causal work or just tracking the work of the stuff.

  **Predictable Problems and Solutions:**

  1. **The CS/engineering majors who say "obviously it's just the function"**: 
     - They might dominate the group and shut down discussion. 
     - Solution: Remind groups that they must consider all perspectives and that the goal is to explore the intuitions. Also, in the whole-region black box scenario, they might feel uneasy and that's what you want to bring out. Ask them: "Would you be okay if we replaced your visual cortex with a black box that does the same function? Why or why not?"

  2. **The person who digs in on the goo**: 
     - They might be in the minority and feel discouraged. 
