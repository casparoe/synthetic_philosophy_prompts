     - Finally, you can say: "So the question we were exploring is: is the pattern doing the causal work, or is it just tracking the work the stuff is doing? And we saw that sometimes we think the pattern is what matters (as in the gradual replacement) and sometimes we worry about the stuff (as in the black box)."

