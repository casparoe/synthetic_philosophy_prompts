answer: |-
  ### Procedure in Prose  
  Here's a step-by-step triage procedure. Focus on the text in front of you—ignore external law, customs, or intent. When the document is silent, note it as "silence." For excerpts, flag gaps but proceed. Judgment calls (marked 🧠) lean toward strict textualism: if ambiguous, default to the *most restrictive* reading of power.  

  1. **Find the amendment clause**: Identify how rules are formally changed. If no clause exists, stop—any change is suspect.  
  2. **Map entrenchments**: List clauses with special protections (e.g., "this section requires X to amend"). If none, proceed.  
  3. **Flag bypass triggers**: Check for terms like "clarification," "practice," or "policy" that might exempt changes from amendment rules. If absent, continue.  
  4. **Scan for borrowed rules**: Find references to external documents (e.g., "as revised from time to time"). Note who controls them.  
  5. **Collision check**: If two clauses each claim supremacy or forbid amendments diminishing their power, stop—they conflict.  
  6. **Interpretation powers**: Does a body's "final interpretation" become part of the charter? If yes, note the scope.  
  7. **Sequence test**: For multiple changes in one vote/vote series:  
     - Could later changes retroactively validate earlier ones?  
     - Does the order alter the threshold? (If silence, assume changes take effect *after* the vote concludes.)  
  8. **Exploit audit**: If steps 1–7 reveal an exploit (e.g., a loophole allowing unilateral takeover), decide whether publicizing it creates systemic risk. Hand to editor.  

  **Hedging language for publication**: Use *"The text does not settle whether..."* or *"Under a strict reading, this move appears to..."* when ambiguity exists.  

  ---

  ### Worked Applications  

  **Case 1: Foundation Charter**  
  - **Amendment clause**: Requires 2/3 council for most amendments, but 3/4 council + membership majority to amend the amendment clause.  
  - **Entrenchments**: Amendment clause is entrenched (higher threshold).  
  - **Bypass triggers**: None.  
  - **Sequence test**: Council (68%) wants to (a) add emergency powers (needs 2/3) and (b) lower the amendment-clause threshold to 2/3 council (currently needs 3/4 + members).  
    - Current threshold for (b) is unmet (68% < 75%, no membership vote).  
    - If voted in one meeting, (b) fails regardless of order—it lacks the required supermajority *at the time of voting*.  
  - **Verdict**: **Stop at Step 7**. Threshold reduction fails; emergency powers *could* pass alone (68% > 66.7%).  
  - **Hedge phrase**: *"The council lacks authority under current rules to lower its own amendment threshold."*  
  - **Signoff**: You (text settles it).  
  - **Exploit risk**: **Low** (fix requires clearing a high bar).  

  **Case 2: Co-op House Rules**  
  - **Amendment clause**: Simple majority at general meeting.  
  - **Entrenchments**: "No rule may reduce quiet enjoyment."  
  - **Bypass triggers**: Board labels ban as "house practice" (not "rule").  
  - **Collision check**: Entrenched right vs. amendment power. No direct collision—but the ban *could* violate quiet enjoyment.  
  - **Sequence test**: Irrelevant (single change).  
  - **Exploit audit**: Definitional dodge: If "practice" isn't a "rule," the amendment clause and entrenchment don't apply.  
  - **Verdict**: **Hand to editor at Step 8**. Values call: Is showcasing this loophole worth risking copycat abuse?  
  - **Hedge phrase**: *"Whether 'house practices' circumvent rule protections depends on undefined terms in the charter."*  
  - **Signoff**: Editor (publication risk).  
  - **Exploit risk**: **Medium** (common tactic; publishing normalizes it).  

  **Case 3: Mutual-Aid Network**  
  - **Borrowed rules**: Charter incorporates "Stewards’ Handbook" (revised by Stewards unilaterally).  
  - **Interpretation powers**: Stewards’ readings "final and part of charter."  
  - **Exploit audit**:  
    - Borrowed rules + interpretation creep let Stewards redefine membership (via Handbook) *and* shield it from challenge (via "final" readings).  
    - Amendment clause is functionally void—Stewards can rewrite governance without oversight.  
  - **Verdict**: **Stop at Step 8**. The charter is **cosmetic**—Stewards hold unchecked power.  
  - **What to print**: *"While designed for community aid, the charter grants stewards unilateral authority to alter membership rules and interpretations, rendering other provisions advisory."*  
  - **Signoff**: You (textual analysis conclusive).  
  - **Exploit risk**: **High** (publicizing exposes systemic vulnerability; could trigger power struggles).  

  ---

