prompt: |-
  Hi — I'm a science-and-ideas journalist and I write a recurring column on institutional design gone weird, and I've fallen down a hole. At a conference dinner last year somebody taught me a parlor game where the only move you get is changing the rules, including the rule about how rules get changed, and I haven't stopped thinking about it since. What that's turned into practically is reader mail: every couple of weeks someone sends me a real governance document — an open-source foundation charter, a housing co-op's house rules, a volunteer mutual-aid network's founding agreement, once the founding text of an on-chain organisation whose members vote with tokens — and asks whether some move their board is about to pull is actually permitted, or whether the clause they think protects them protects them at all. I'm not a lawyer (my editor makes me route anything legal past a friend who does municipal governance work, and she has maybe twenty minutes a week for me), I'm often drafting on deadline with patchy signal so I can't chase references, and I need to triage these myself in about half an hour before deciding whether there's a story there and how hedged my language has to be. Please don't give me citations or a reading list — if you're drawing on some doctrine, name it in two or three words inline and move on.

  So: give me a procedure I can actually run on one of these documents. Ordered questions, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand off to a person because the question is one of values rather than text — and mark the hand-offs distinctly, because "ask my lawyer friend" costs me a week and "editor decides" costs me twenty minutes. I've been using my own sloppy categories and I'd like you to keep, rename, or bin them: (a) threshold flips, where a body uses the current amendment power to lower the bar and then walks through the lowered door; (b) definitional dodges, where someone relabels a change as a clarification, a practice, or a policy so it isn't an "amendment" at all; (c) borrowed rules, where the charter incorporates some outside document "as revised from time to time" and the outside document quietly rewrites the charter; (d) collisions, where two clauses each entrench themselves and say any amendment diminishing their protection is void; (e) interpretation creep, where a body's rulings are deemed to be part of the charter itself. The procedure has to say what to do when I only have an excerpt, or when the document is simply silent, or when the answer depends on which order two votes were taken in, and it should be honest about which steps are judgment calls wearing a lab coat. One more thing that's specific to my job: sometimes running this surfaces an exploit — a way the thing can legally be gutted — and I then have to decide whether writing about it makes it real. Put that decision in the procedure as a step, not a footnote, and include a note on what hedging language to use in copy when the answer is "the text does not settle this."

  Then run it on three cases, spelling out where each one stops. Case one: a foundation charter that says (my paraphrase) the Charter may be amended by a two-thirds vote of the Council, except that the amendment section itself may only be amended by a three-quarter Council vote plus a majority of the membership — and a Council holding 68% wants, at a single meeting, to add an emergency-powers section and to reduce that exception to a two-thirds Council vote alone. Case two: a co-op whose rules say no rule may be adopted that reduces a member's right to quiet enjoyment, and also that the rules may be amended by simple majority at any general meeting; a majority now wants to ban amplified instruments after 9pm, and to file it as a "house practice" rather than a rule. Case three, the one I expect to dislike: a mutual-aid network I admire and want to write a warm piece about, whose charter incorporates a Stewards' Handbook "as revised by the Stewards from time to time," where the Handbook has grown a clause letting the Stewards decide who counts as a member for voting, and where the charter says the Stewards' readings of it are final and shall be treated as part of it. If your procedure tells me the thing I was going to praise is cosmetic, say so plainly and tell me what I'd have to print instead.

  Format: give me the procedure in prose first, then the three worked applications, then the structured bits. For the procedure, a JSON array where each element is one step with exactly these fields: step_id (integer, in order), question (the question to ask), sufficient_answer (what counts as an adequate answer), if_fails (one of "stop", "hand_to_lawyer", "hand_to_editor", "continue"), is_judgment (boolean — true if this is really a judgment call dressed as a step), likely_misfire (one sentence on how this step will go wrong in practice). For the cases, a table with columns case_id, first_step_that_bites, verdict (one or two sentences in language I could print), hedge_phrase (the actual words I should use in the piece), signoff (me / editor / lawyer friend), exploit_publication_risk (low, medium or high, plus a few words of why). Finally a JSON object with a single key, limits, whose value is an array of three to five short strings on what this procedure cannot do.
reasoning: |-
  We are designing a procedure for a journalist to quickly triage governance documents for potential issues. The procedure should be a step-by-step guide with clear questions and actions. We'll incorporate the journalist's categories (threshold flips, definitional dodges, borrowed rules, collisions, interpretation creep) and handle cases of excerpts, silence, order dependencies, and judgment calls.

  The procedure steps:

  1. **Check for Amendment Process**: How can the document be amended? Look for explicit amendment clauses. If none, note that and proceed with caution (since without an amendment process, changes might be problematic).

  2. **Identify Entrenched Clauses**: Are there any clauses that have special protection (e.g., require a higher threshold to amend)? This includes the amendment clause itself (like in case one) or other clauses (like the right to quiet enjoyment in case two). 

  3. **Check for Definitional Dodges**: Does the document define what counts as an amendment? Are there ways to change the rules without going through the amendment process (e.g., by labeling changes as "clarifications", "practices", or "policies")? 

  4. **Borrowed Rules Check**: Does the document incorporate external documents (like the Stewards' Handbook in case three) that can be changed independently? If so, how are those changes governed? 

  5. **Collision Detection**: Look for clauses that are entrenched and might conflict (e.g., two clauses each saying that any amendment diminishing their protection is void). 

  6. **Interpretation Creep**: Does the document state that interpretations by a body (like the Stewards) become part of the charter? 

  7. **Order of Operations**: If the order of votes matters (like in case one, where they want to do two changes at one meeting), try to determine if the document specifies the order or if there's a logical sequence (e.g., changing the amendment threshold before using it). 

  8. **Exploit Identification**: If the above steps reveal a way to gut the document, flag it and decide whether to publish (this is a values decision for the editor). 

  We'll structure the procedure as a JSON array of steps. Each step has:
  - step_id (integer)
  - question (string)
  - sufficient_answer (what counts as an adequate answer? e.g., "explicit text", "no such clause", "no conflict found")
  - if_fails: one of "stop", "hand_to_lawyer", "hand_to_editor", "continue"
  - is_judgment: boolean (true if it's a judgment call)
  - likely_misfire: one sentence on how this step can go wrong

  Then we'll apply the procedure to the three cases.

  Case 1: Foundation charter
  - Amendment: 2/3 Council, except the amendment section requires 3/4 Council plus majority of membership.
  - Council (68%) wants to: 
     a) Add emergency powers section (which might be a regular amendment, 2/3)
     b) Reduce the exception (the part protecting the amendment clause) to only 2/3 Council (no membership vote).

  They want to do both at the same meeting.

  Question: Can they do both in one meeting? If they do (b) first, then (a) would be easier? But the current rule requires a higher bar for (b). Since they are doing both at the same meeting, they are effectively trying to use the current rule to change itself and then use the new rule for the same meeting? That might be a problem.

  Case 2: Co-op
  - Rule: No rule may reduce a member's right to quiet enjoyment.
  - Amendment: simple majority at general meeting.
  - They want to ban amplified instruments after 9pm and call it a "house practice" (not a rule).

  Issue: Is a "house practice" considered a rule? And does it reduce the right to quiet enjoyment? If it's a rule, then it can't reduce that right. But if they label it a practice, they might dodge the amendment process and the protection.

  Case 3: Mutual-aid network
  - Charter incorporates Stewards' Handbook "as revised by the Stewards from time to time".
  - The Handbook now says Stewards decide who counts as a member for voting.
  - Charter says the Stewards' readings of it are final and shall be treated as part of the charter.

  Issue: This is interpretation creep and borrowed rules. The Stewards can change the Handbook (which is incorporated) and their interpretations become part of the charter. This might allow them to effectively change the charter without going through any amendment process.

  Now, let's build the procedure in prose first.

  ### Procedure in Prose

  **Step 1: Find the Amendment Clause**
  - Look for the section that describes how the document can be amended. If there is no amendment clause, note that the document might be static and any change is questionable. If found, note the requirements (e.g., majority, supermajority, multiple bodies). If missing, hand to lawyer (because without an amendment process, any change is legally dubious).

  **Step 2: Identify Entrenched Clauses**
  - Check if any clauses (including the amendment clause) have special amendment procedures (e.g., higher thresholds, additional approvals). These are entrenched. If the amendment clause itself is entrenched, note the requirements for changing it.

  **Step 3: Definitional Dodges**
  - Check if the document defines what constitutes an amendment and if there are other ways to change rules (e.g., through practices, policies, interpretations). Look for terms like "clarification", "practice", or "policy" that might bypass the amendment process. If the document explicitly allows such dodges, note it; else, they might be invalid.

  **Step 4: Borrowed Rules**
  - Look for references to external documents (e.g., "as revised from time to time"). Note what body can change those documents and if that change process is described. If the external document can change without going through the main amendment process, that's a potential issue.

  **Step 5: Collision Detection**
  - Check for clauses that claim to be unamendable or require special procedures, and see if any two such clauses conflict (e.g., each says any amendment reducing its protection is void). If found, it might lead to a deadlock or require legal interpretation.

  **Step 6: Interpretation Creep**
  - Look for clauses that state that interpretations by a body (e.g., a board, stewards) are final and become part of the charter. This can effectively amend the charter without a formal process.

  **Step 7: Order of Operations**
  - When multiple changes are proposed in a single session, consider the logical order. Changing an amendment threshold should require the current threshold. If a body tries to change the threshold and then use the new threshold in the same meeting, that might be invalid because the threshold change must take effect first. The document might specify the order, or we might have to infer.

  **Step 8: Exploit Identification**
  - If the above steps reveal a way to bypass protections or gut the document, consider whether publishing the exploit would make it more likely to be used. This is a values decision for the editor. If the document is ambiguous, use hedging language in the article.

