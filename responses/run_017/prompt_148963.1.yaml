prompt: |-
  I'm putting together the final for my upper-level moral psychology seminar (20 marks, 45-minute in-class essay, 1,000 word cap) and I need one question on self-deception that can't be answered by reciting the paradoxes and the standard menu of responses. Every year half the class writes the same essay: here's the static paradox, here's the dynamic one, here's the partitioning move, here's the deflationary alternative that drops the intention and the dual belief, and look, no paradox. They get Bs and I can't tell whether they understand anything.

  So I want a question built around a case I've started using in lecture, which I'm calling "standard-shopping," because it seems to me to dodge the whole framing of the debate. The case: Ana is going up for promotion, and the written criteria require "sustained national visibility." Reading the file the first time she takes that to mean invited talks at other universities, a national award, grant panels — and on that reading she knows she doesn't clear the bar. Over the next few weeks she comes to think that "visibility" really just means that people in the field have heard of your work, and on that reading she clears it easily. Nothing else about her view of her record changes: she doesn't come to believe she's given more talks than she has, or that she won an award. Six months later she's on the committee for a junior colleague, reads the same sentence in the same document, applies the original stricter reading, and votes no. There's no intention anywhere to end up with a false belief, no blackout, no partitioned-off compartment, and no first-order factual belief that contradicts another.

  The thing I want the question to force is this: standard-shopping suggests the literature has been looking for self-deception in the wrong place — in a belief, or in a contradictory pair of them — when the real unit might be a policy for counting considerations as evidence. But I'm not sure that's right, and I'm not sure it isn't just the deflationary view wearing a new hat. So the question should make students say precisely which condition of each familiar account the case does and doesn't satisfy, and then take a side on whether that's a problem for the account or a problem for the case. It should also demand a contrast condition: what would have to be different for Ana to count as self-deceived rather than (i) sincerely disagreeing with her department about what the word means, (ii) merely reasoning self-servingly, or (iii) plain akrasia — and their condition has to survive the fact that Ana reverts to the strict reading the moment her own promotion is settled.

  Please give me:

  1. The question, worded the way you'd actually paste it into an exam paper. Multi-part is fine if the parts do real work; feel free to rework my case or rename my term, and tell me briefly if you'd change it and why.

  2. A model answer of about 700-800 words. Names don't matter much (I tell them that on day one), so use structural labels — the traditional/interpersonal model, the partitioning version of it, the deflationary alternative — rather than leaning on who said what.

  3. A marking scheme out of 20: the four or five must-hit moves, what each is worth, and one line per move on how a student typically gets it wrong (I've found the usual failure is describing a view instead of testing it against the case, but you may have better guesses).

  4. A short note on which single move in your model answer a strong student could reject outright and still deserve full marks — I hand the markers an "acceptable variations" list and I want it to be accurate.

  Last thing: at the very end, tell me how confident you are in the central claim of the model answer, and pick out the one claim in it you're least sure about. That one goes straight on the acceptable-variations list too.
reasoning: |-
  Okay, the user is a professor designing a final exam question on self-deception for a moral psychology seminar. They're frustrated because students keep regurgitating standard paradoxes and solutions without deep understanding. Their "standard-shopping" case with Ana avoids traditional self-deception markers (intention, contradictory beliefs, partitioning). 

  Hmm... the professor wants a question that forces students to:
  - Analyze which conditions of classic accounts Ana's case satisfies/fails
  - Distinguish self-deception from mere self-serving reasoning/akrasia
  - Evaluate if the case reveals a flaw in traditional frameworks
  - Propose contrast conditions to isolate self-deception

  Key challenges I see:
  The case deliberately strips away all textbook indicators. Students might panic without familiar handles. Need to scaffold carefully. Also, the professor suspects the literature focuses on beliefs when evidence-weighting policies might be the real issue. But they're unsure if this is meaningfully new or just repackaged deflationism.

  For the question wording:
  I'll structure it in three parts: (A) diagnostic testing of theories against the case, (B) contrast-building to define boundaries, (C) meta-theoretical evaluation. Renaming "standard-shopping" to "criterion elasticity" for precision. Added temporal markers ("later...when reviewing a colleague") to highlight reversibility.

  For the model answer:
  Will build the argument that Ana's policy manipulation evades traditional criteria but meets deflationary standards. Contrast with akrasia by emphasizing criterion stability. The pivot is showing that belief isn't the operative unit—her factual beliefs never change, only her justificatory framework. Least confident claim: that this isn't just deflationism relabeled. Strong students could reject this and argue it's merely Davidson in new terms.

  Marking scheme priorities:
  1. Theory-testing over description (5 marks)
  2. Clear contrast conditions (5 marks)
  3. Position-taking with stakes (4 marks)
  4. Meta-framework critique (4 marks)
  5. Precision about what changes/reverts (2 marks)

  Biggest pitfall: Students will describe partitioning/deflationism instead of applying them to Ana. Will emphasize in the scheme that they must state "Ana fails condition X because..."

  Acceptable variations:
  A strong student could argue Ana isn't self-deceived at all—just rationally adapting to incentives. That would require showing why self-deception must involve belief-falsity. Defensible if they distinguish motivation from deception cleanly.

  My confidence:
  80% on the core claim that criterion manipulation is distinct. Only 40% on whether it's genuinely new versus deflationism—that's the hinge. Putting that on the variations list.
answer: |-
  Here’s a comprehensive exam package designed to push students beyond recitation, forcing them to engage critically with Ana’s case and the conceptual boundaries of self-deception.

  ---

  ### 1. Exam Question (Word Count: 189)  
  **Question:** Ana’s case ("criterion elasticity") challenges traditional accounts of self-deception.  
  **(A)** Diagnose Ana’s case using *three* standard models of self-deception:  
  (i) the traditional (intentionalist) model,  
  (ii) partitioning theory, and  
  (iii) deflationary accounts.  
  *For each, specify which necessary conditions Ana’s behavior satisfies or fails, and why.* (8 marks)  
  **(B)** Propose *one specific modification* to Ana’s story that would unambiguously make it a case of *self-deception* (rather than self-serving reasoning, akrasia, or sincere disagreement). Explain why your modification crosses the threshold, and how it survives her later reversion to the strict criterion. (6 marks)  
  **(C)** Does this case reveal a fundamental flaw in how self-deception is theorized? Defend your view by evaluating whether "criterion elasticity" is distinct from existing deflationary approaches. (6 marks)  

  *Note: "Criterion elasticity" = shifting standards for evaluating evidence (e.g., redefining "visibility") without altering factual beliefs or conscious intent.*  

  ---

  ### 2. Model Answer (Word Count: 745)  
  **(A) Diagnostic Analysis**  
  Ana’s case systematically evades classical conditions for self-deception.  

  The **traditional (intentionalist) model** requires (1) simultaneously holding contradictory beliefs (B and ~B) and (2) intentional deception of oneself. Ana fails both: she never believes both that she lacks *and* has visibility; she shifts the criterion’s *meaning* but retains consistent factual beliefs (e.g., "I have no national award"). Crucially, there’s no evidence of intention—her reinterpretation feels epistemically justified.  

  **Partitioning theories** avoid simultaneity by positing segregated mental subsystems (e.g., one module believes B, another ~B). Ana’s psychology shows no compartmentalization: she applies her lenient criterion consistently during self-evaluation and later reverts cleanly to the strict one without amnesia or conflict. The shift is transparent and reversible, implying a unified cognitive framework.  

  **Deflationary accounts** drop intentions and contradictory beliefs, defining self-deception as biased evidence-handling (e.g., selective attention/gathering). Ana *partially* fits: she exhibits bias in *interpreting* the criterion. However, deflationism typically focuses on *factual evidence* (e.g., downplaying a missed talk), not *redefining epistemic standards*. Ana’s maneuver operates at a meta-level—altering what counts as evidence—without distorting facts.  

  **(B) Contrast Condition**  
  To make Ana self-deceived, add: *While redefining "visibility" as broad awareness, she actively avoids checking her publication download stats, knowing they’d undermine her new criterion by showing minimal engagement.*  

  This crosses the threshold because:  
  1. **Self-deception marker**: She manipulates *evidence availability* to preserve her favorable reinterpretation—a deflationary tactic (e.g., "aversional" bias).  
  2. **Distinction from alternatives**:  
     - *Sincere disagreement*: Now there’s motivated avoidance of counter-evidence.  
     - *Self-serving reasoning*: Bias extends beyond interpretation to active evidence suppression.  
     - *Akrasia*: She’s not weak-willed; she’s protecting a belief.  
  3. **Survives reversion**: The avoidance is temporary and criterion-specific. Later, applying the strict criterion to her colleague doesn’t require engaging with stats (which weren’t relevant under the original reading). Self-deception can be context-bound without contradiction.  

  **(C) Theoretical Implications**  
  Ana exposes a gap in self-deception theory: it conflates *belief falsity* with *standard manipulation*. Traditional models fail because they hunt for contradictory beliefs; deflationism *almost* captures Ana but misfires by focusing on *how evidence is treated*, not *how standards are gamed*. "Criterion elasticity" is distinct: Ana isn’t ignoring facts; she’s recalibrating their significance. This suggests self-deception’s "unit" isn’t belief but *epistemic policies*—context-sensitive rules for weighting evidence.  

  Is this just deflationism relabeled? No. Deflationism addresses *processing* biases (e.g., dismissing a counter-example); Ana’s policy-shift is *conceptual* bias—changing the rules of evaluation. By dodging belief-focused paradoxes entirely, her case implies self-deception may reside in higher-order justificatory strategies, demanding a framework where epistemic agency and criterion flexibility are central.  

  ---

  ### 3. Marking Scheme (20 Total)  
  | **Move**                                                                 | **Marks** | **Common Failure**                                                                 |
  |--------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|
  | **(A)(i-iii)** Correctly identifies satisfied/failed conditions for all 3 models | 8 (3+3+2) | Describing the model without applying to Ana (e.g., "Partitioning says minds split") |  
  | **(B)** Proposes a *plausible* modification crossing into self-deception | 3        | Vague changes (e.g., "she lies to herself") or ignoring reversion                  |  
  | **(B)** Justifies why modification distinguishes from 3 alternatives     | 3        | Collapsing distinctions (e.g., "it’s all self-serving bias")                       |  
  | **(C)** Takes a clear stance on theoretical flaw *and* distinctness      | 4        | Unspecific critique (e.g., "theories are wrong") or no comparison to deflationism |  
  | **Precision** (Clarity, case-specific detail, no irrelevance)            | 2        | Digressions into paradoxes or general bias research                                |  

  ---

  ### 4. Acceptable Variation Note  
  **Claim a strong student could reject:** *"Criterion elasticity is distinct from deflationary accounts."*  
  A student could argue Ana’s policy-shift **is** deflationary self-deception (e.g., reinterpreting standards is "biased evidence-weighting") and still earn full marks—*if* they:  
  - Explain why deflationism *can* absorb meta-standards (e.g., "defining ‘visibility’ *is* evidence-processing"),  
  - Use Ana to show deflationism is broader than typically assumed,  
  - Maintain diagnostic rigor in (A)/(B).  

  ---

  ### Confidence Assessment & Least Sure Claim  
  **Overall confidence in model answer’s core claim (criterion elasticity as novel unit): 70%**  
  It convincingly dodges traditional traps, but may overstate distinction from deflationism.  

  **Least confident claim:** *"Ana’s policy-shift is conceptual bias, not processing bias—making it distinct from deflationism."*  
  **Why:** Deflationary views *could* argue that redefining criteria is just a higher-order instance of evidence-handling (e.g., "selective weighting of semantic considerations"). This claim is **added to the acceptable variations list**.  

  ---  
  This design forces theory-testing, boundary-drawing, and meta-theory—all while leveraging your case’s subversion of the literature. Students can’t score well without engaging Ana’s specificity.
