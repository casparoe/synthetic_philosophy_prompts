prompt: |-
  I work on a four-person foresight cell inside a large institutional asset manager. Roughly twice a month we owe a one-page answer to a question of the form "will X still hold in N years": a currency peg, a sanctions regime, a ruling coalition, a reserve-currency arrangement, a durable political order in the loose sense of an empire. The answers are scored quarterly on a Brier-style sheet, they are read by a senior portfolio manager who is openly hostile to storytelling and wants to audit how any number was reached, and they feed positions that are expensive to reverse. Constraints: I have no web access while drafting, no proprietary dataset, at most a long afternoon per question, and a team with solid applied statistics but no formal forecasting training. Anything that needs a literature search or a bespoke regression will not get used.

  What I want is a procedure, not an argument for the outside view. I have been reading the rationalist blogs for years and I already believe base rates beat narratives. The problem is that in practice the reference class does all the deciding, and I have no rules for choosing it — which makes the exercise vulnerable to the failure mode where each analyst advertises a class that flatters the conclusion they already held.

  Please write the procedure we would actually run, as an ordered set of steps, with for each step what counts as a sufficient answer, roughly how long it should take, and an explicit flag on the steps that are judgment calls dressed up as procedure. It needs to cover at least:

  1. Defining the case: the event that starts the clock, the event that ends it, and which end-state counts — dissolution, transformation into something with a different name, or nominal continuity with the substance gone. Also how to convert "will this ever happen" into a horizon question when the question arrives open-ended.
  2. Constructing the reference class before looking at the case's distinctive details, including a mechanical enumeration rule and a written pre-commitment witnessed by a second analyst, and what to do when the case is famous enough that you cannot unsee it.
  3. Getting the base rate: which summaries to compute, minimum sample size, and what to do when n is small enough that the class supports only a coarse statement.
  4. Conditionalising on elapsed duration, and the trap that you always observe the case from inside its own interval — so surviving to time t is not the kind of evidence about remaining life that intuition treats it as. Say what can be concluded without assuming a shape for the survival distribution and what cannot.
  5. A recording filter: short-lived arrangements are systematically under-recorded, so the class over-represents whatever survived long enough to leave archives.
  6. An ex-ante ledger of candidate disanalogies, each one named in advance, measured across the reference set rather than only in the case, with a budget capping how far the whole ledger may move the base rate, and a ban on unmeasured "this time is different" claims.
  7. A stability audit: widen and narrow the class, drop the extremes, drop the most recent third, and if the output flips, downgrade to a range or refuse.
  8. Self-membership: what to do when the only usable class contains the case itself, and when the class's records were produced by the system whose survival is being estimated.
  9. Fusion with the inside view: how much weight, at which step, and how to state the result as a probability with an honest confidence.
  10. Stop rules: where the procedure returns no number, and where it hands the question to a person because what remains is a values question rather than a factual one — for instance whether to act on a low-probability severe outcome, where the loss function is the portfolio manager's, not ours.

  Because the shelf matters more than any single question, I also want a short specification for how we build and maintain two or three standing reference classes on slow days, so that classes are not assembled in the presence of the case they will be applied to.

  Then run the procedure on three live questions, showing the work at each step, including at least one where the honest output is one I will not like:

  - A fixed exchange-rate peg that has held for nine years. Will it hold another five?
  - A resource-funded autocracy in place for about thirty years, ruler aged seventy-eight, no announced succession. Will it survive another ten?
  - The role of the US dollar as the dominant reserve and invoicing currency, over a thirty-year horizon. I expect the procedure to refuse here, and I want it to refuse loudly and say what a refusal is worth to the person who has to make a decision anyway, rather than quietly manufacturing a number.

  Finally, state what the procedure cannot do: the question types it should never be pointed at — genuinely unprecedented entities, horizons longer than the class's total span, one-off structural breaks — and how it will misfire in the hands of someone who needs a number by five o'clock. No citations, reading lists, or named studies; I cannot check them and they would not change what I do. Define any term you coin, keep the arithmetic to what a spreadsheet can do, and where a step depends on an assumption about the shape of the survival distribution, name the assumption and say how sensitive the output is to it.

  End with a single machine-readable line, and nothing after it:

  \answer{peg: NUMBER|RANGE|REFUSE; autocracy: NUMBER|RANGE|REFUSE; reserve currency: NUMBER|RANGE|REFUSE}
reasoning: |-
  We are designing a procedure for forecasting the survival of various political and economic arrangements. The procedure must be robust, minimize subjective judgment, and be executable within tight constraints. Below is the step-by-step procedure, followed by application to the three examples.

  ### Procedure: Survival Forecasting Protocol (SFP)

  **Step 0: Pre-commitment (Time: 5 minutes)**
  - Before seeing the specific case, the lead analyst and a second analyst agree in writing on:
    - The event definition (start event, end event, end-state definition).
    - The horizon (N years) for open-ended questions by setting N to a standard value (e.g., median horizon of past cases in a default class, or a fixed rule like 10 years if no prior).
    - The reference class enumeration rule (mechanical, e.g., "all currency pegs in countries with GDP per capita between X and Y from year A to B").
  - *Judgment call*: Setting the horizon for open-ended questions. Rule: Use the median duration of the standing reference class (if available) or a fixed horizon (e.g., 10 years) for “will this ever happen” questions.

  **Step 1: Define the Case (Time: 15 minutes)**
  - Specify:
    - Start event: The event that marks the beginning of the arrangement (e.g., the establishment of the peg).
    - End event: The event that marks the end (e.g., devaluation > 10% within 30 days).
    - End-state: What counts as failure? (e.g., dissolution, transformation, or nominal continuity without substance?).
    - For open-ended "will this ever happen" questions, convert to a horizon question by setting N (from Step 0).
  - *Sufficient answer*: A clear, testable definition that can be applied to historical cases without ambiguity.
  - *Judgment call*: Defining the end-state (especially "substance gone"). Rule: Use a measurable threshold (e.g., for a currency peg, a devaluation of at least 10%; for a regime, loss of power by the ruling party).

  **Step 2: Construct Reference Class (Time: 60 minutes)**
  - Enumerate cases using the pre-committed rule (from Step 0) without looking at the current case's details. If the current case is famous, the second analyst (who is not the lead) enumerates the class.
  - Sources: Use standing reference classes (built on slow days) if available. Otherwise, use a predefined source (e.g., a specific chapter of a standard reference book, a curated dataset).
  - *Sufficient answer*: A list of cases (with start and end dates, or ongoing) that meet the class definition.
  - *Judgment call*: The enumeration rule itself. Rule: Pre-commit to a rule that is broad enough to avoid cherry-picking (e.g., "all autocratic regimes in resource-rich countries since 1950").

  **Step 3: Base Rate Calculation (Time: 15 minutes)**
  - For the reference class, compute:
    - `n_total`: total cases (including ongoing ones that have survived at least the minimum observed duration in the class?).
    - `n_failed`: number of cases that ended (by the end-state definition) within N years of their current age (or within N years from now?).
    - Base rate = `n_failed / n_total` (if including ongoing cases, treat them as censored and use Kaplan-Meier if feasible, else use only completed cases).
  - Minimum sample size: Require at least 20 cases. If n_total < 20, refuse to give a point estimate and go to Step 7 (stability audit) for a range or refuse.
  - If n_total is small, report a range (e.g., 95% CI via Clopper-Pearson) or refuse.
  - *Sufficient answer*: A base rate (or range) and n_total.

  **Step 4: Conditional on Elapsed Duration (Time: 20 minutes)**
  - Problem: The case has already survived T years. We want P(survive next N years | survived T years).
  - Without assuming a distribution: Use the reference class to compute the survival function S(t) = P(survive beyond t years). Then:
    - P(survive next N years | survived T years) = S(T+N) / S(T)
  - If we don't have enough data for T and T+N, we cannot compute without assumptions.
  - *Assumption*: We assume the survival times are identically distributed (i.i.d.) in the reference class. This is a strong assumption and the output is sensitive to it. If the survival curve is not well estimated at T, we may need to use a parametric model (e.g., exponential) but then we must note the assumption.
  - *Sufficient answer*: The conditional probability, or if data is sparse, a note that the estimate is based on an assumed distribution (exponential, Weibull) and the sensitivity (e.g., if exponential, the rate is constant, so conditional probability does not depend on T).

  **Step 5: Recording Filter (Time: 10 minutes)**
  - Adjust for under-recording of short-lived cases by:
    - Truncating the reference class: Only include cases that survived at least D years (e.g., D=1) to ensure they are recorded. Then the base rate is conditional on survival to D.
    - But note: This biases against short-lived regimes. We cannot fully correct without knowing the missing cases. So we note the bias and if the base rate is high, it might be even lower in reality.
  - *Sufficient answer*: A note on the potential bias (e.g., "The base rate may be overestimated because short-lived cases are missing") and if possible, an estimate from a source that attempts to capture short-lived cases.

  **Step 6: Disanalogy Ledger (Time: 30 minutes)**
  - Pre-define a list of disanalogies (e.g., "resource dependence", "external threat", "leadership age") that might make the case different.
  - For each disanalogy, measure it in the reference class and the current case. Compute the base rate in subgroups (e.g., for "high resource dependence" vs "low").
  - Adjust the base rate by taking a weighted average of subgroup rates, but with a cap: the adjusted rate cannot be more than ±0.2 from the overall base rate (unless n is very large and the effect is strong).
  - Ban unmeasured disanalogies.
  - *Sufficient answer*: A table of disanalogies, their measured effect in the class, and the adjusted base rate (within the cap).

  **Step 7: Stability Audit (Time: 20 minutes)**
  - Test robustness by:
    - Widening the class: Include more cases (e.g., drop a restriction).
    - Narrowing the class: Add a restriction (e.g., only post-1990).
    - Drop extremes: Remove the 10% shortest and longest lived.
    - Drop the most recent third of cases.
  - If the base rate flips (e.g., from >0.5 to <0.5) in any of these, refuse to give a point estimate and instead report a range (min and max of the robust set) or refuse.
  - *Sufficient answer*: A point estimate, or a range, or a refusal.

  **Step 8: Self-Membership (Time: 5 minutes)**
  - If the reference class includes the current case, remove it.
  - If the class's records are produced by the system being estimated (e.g., using official histories of empires to estimate an empire's survival), note the potential bias and if severe, refuse (or use an independent source).
  - *Sufficient answer*: A cleaned class and a note on bias.

  **Step 9: Fusion with Inside View (Time: 15 minutes)**
  - Allow the inside view to adjust the base rate only via the disanalogy ledger (Step 6). No ad-hoc adjustments.
  - State the final probability as the adjusted base rate from Step 6 (or the original if no adjustment) and the confidence as the inverse of the range from Step 7 (if a range was given, then confidence is low).
  - *Judgment call*: The cap on adjustment in Step 6. Rule: Fixed cap of ±0.2.

  **Step 10: Stop Rules (Time: 5 minutes)**
  - Refuse to give a number if:
    - n_total < 20 and the stability audit fails.
    - The stability audit shows flipping.
    - The case is unprecedented (no reference class).
    - The horizon is longer than the maximum observed duration in the class (unless a parametric model is used and noted).
    - The question involves a one-off structural break (e.g., nuclear war).
  - When refusing, state: "No reliable estimate. The base rate was X, but the stability audit failed because [reason]. The portfolio manager must decide based on loss function: if the cost of being wrong about failure is high, then even a low probability may warrant action."

  **Building Standing Reference Classes (on slow days):**
  - Choose 2-3 broad classes (e.g., "Currency Pegs", "Autocratic Regimes", "Reserve Currencies").
  - Define each with clear, mechanical rules (e.g., "Currency Pegs: from Reinhart-Rogoff, all pegs that lasted at least one month").
  - Collect data: start date, end date (if ended), and key variables (e.g., GDP, resource dependence).
  - Store in a shared database.

  ---

  ### Application to Live Questions

  #### Question 1: Currency Peg (held 9 years, will it hold another 5?)
  - **Step 0**: Pre-commit: Horizon = 5 years. Class = "All fixed exchange rate pegs in emerging markets since 1950, from Reinhart-Rogoff classification".
  - **Step 1**: Case: Start = peg established. End = devaluation > 10% within 30 days. End-state = failure if devalued. Horizon = 5 years.
  - **Step 2**: Reference class: From standing class "Currency Pegs" (if built) or use Reinhart-Rogoff. Enumerate: e.g., 50 pegs. (Assume we have 50 cases.)
  - **Step 3**: Base rate: Of 50 pegs, 30 failed within 5 years of their age (but note: we are at 9 years). So unconditional P(fail in next 5 years) = 30/50 = 0.6. But we must condition on having survived 9 years.
  - **Step 4**: Conditional on 9 years: We need S(14)/S(9). From the class, 40 pegs survived at least 9 years. Of these, 20 failed before 14 years. So S(14)/S(9) = (40-20)/40 = 0.5. (This is the Kaplan-Meier estimate at 14 years conditional on 9.)
  - **Step 5**: Recording filter: Reinhart-Rogoff includes short-lived pegs? Assume yes. So minimal bias.
  - **Step 6**: Disanalogy ledger: Pre-defined factors (e.g., "current account deficit", "foreign reserves"). Measure in class: e.g., pegs with high reserves failed 40% of the time vs 70% for low. Our case has high reserves. Adjust: Base rate 0.5, adjust to 0.4? But cap: if base rate is 0.5, adjustment capped at [0.3, 0.7]. So 0.4 is allowed.
  - **Step 7**: Stability audit: Widen to all pegs (including developed) -> base rate 0.4? Narrow to only Latin America -> 0.6. Range [0.4,0.6]. Doesn't flip (0.5 is within), so report point estimate 0.4 (adjusted) or range? Since we have a point, we report 0.4 with note.
  - **Step 8**: Self-membership: Our peg is not in the class (it's ongoing) so no issue.
  - **Step 9**: Final probability: 0.4 (adjusted). Confidence: medium (range 0.4-0.6).
  - **Step 10**: Not refused.

  **Output**: peg: 0.4

  #### Question 2: Resource-funded autocracy (30 years, ruler 78, no succession, survive 10 years?)
  - **Step 0**: Pre-commit: Horizon=10 years. Class="All resource-rich autocratic regimes since 1950, from Geddes dataset".
  - **Step 1**: Start=regime established. End=ruler death and regime collapse within 2 years? (Define: failure is regime collapse within 10 years). End-state: dissolution or transformation (e.g., revolution). Note: We are at T=30 years, ruler age=78.
  - **Step 2**: Class: e.g., 40 regimes.
  - **Step 3**: Base rate: Of 40, how many collapsed within 10 years? But we are at T=30. So condition on T.
  - **Step 4**: Conditional: P(collapse in next 10 years | survived 30 years). From class: How many regimes survived 30 years? Say 10. Of these, 5 collapsed within 40 years. So 5/10=0.5. But also condition on ruler age? This is a disanalogy.
  - **Step 5**: Recording filter: Geddes includes short-lived? Probably not, so base rate may be too low? But we are at 30 years, so short-lived are irrelevant. Minimal bias.
  - **Step 6**: Disanalogy ledger: 
    - Factor: "Ruler age". In class, for regimes at age 30, ruler age distribution. But we need: for regimes that survived 30 years, what is the effect of ruler age? 
    - Subgroup: ruler age >75 vs <75. In class (of 10): 4 with age>75, 3 of which collapsed within 10 years; 6 with age<75, 2 collapsed. So age>75: 3/4=0.75, age<75: 2/6≈0.33. 
    - Our case: age=78 -> adjust to 0.75. But cap: base rate was 0.5, so adjustment capped at [0.3,0.7]. 0.75 is above 0.7 -> cap at 0.7.
  - **Step 7**: Stability audit: 
    - Widen: all autocracies (not just resource-rich) -> base rate for old regimes: ? 
    - Narrow: only oil-rich -> base rate 0.6? 
    - Drop extremes: remove 2 longest and 2 shortest (from the 10) -> base rate? 
    - If any flip (e.g., from 0.7 to <0.5)? Assume not. 
    - But note: small n (10) -> already borderline. Step 3 requires min 20? We have 40 in class, but conditional we have 10. So we should refuse? But we proceed to Step 10.
  - **Step 8**: Self-membership: Our case not in class.
  - **Step 9**: Final: 0.7 (capped) and confidence low (n small).
  - **Step 10**: Refuse? Because conditional n=10 <20. But we have a point. Because of small sample, we report a range? In stability audit, we might see: if we use the full class without conditioning on age, we had 0.5. With age adjustment we have 0.7. The stability audit with widening/narrowing might show a range [0.5,0.8]. We don't flip (0.5 to 0.7 is not a flip in sign). But n=10 is below 20, so we should report a range. Let's say the stability audit produces a range [0.6, 0.8]. We report the range.

  **Output**: autocracy: 0.6-0.8 (range)

  #### Question 3: US dollar dominance over 30 years.
  - **Step 0**: Pre-commit: Horizon=30 years. Class="Reserve currencies since 1500" (e.g., Portuguese real, Spanish dollar, Dutch guilder, French franc, British pound, US dollar). But note: very small class.
  - **Step 1**: Start= when the currency became dominant (e.g., for USD, post-WWII). End= when it is overtaken by another (e.g., share of reserves <50% and not the largest). End-state: loss of dominance. Horizon=30 years.
  - **Step 2**: Class: We have about 5 cases (only 5 dominant currencies in the period). 
  - **Step 3**: n_total=5. Base rate: How many lost dominance within 30 years? None: all lasted more than 30 years? Actually, the average is about 80-100 years. USD has been dominant for ~80 years. So P(lose in next 30|80) = ? 
  - **Step 4**: Conditional: We need S(110)/S(80). But we have only 5 cases and none failed at 80-110? So S(80)=1 (all survived at least 80), S(110)=? Only GBP and USD reached 80. GBP lasted about 100 years. So at 80, GBP survived 20 more years. So 1 out of 1 that reached 80 survived 30 more? But n=1. 
  - **Step 5**: Recording filter: Not an issue (long durations are recorded).
  - **Step 6**: Disanalogy ledger: Pre-defined factors (e.g., "military power", "trade share"). But n too small to measure.
  - **Step 7**: Stability audit: Cannot do much with n=5.
  - **Step 8**: Self-membership: USD is in the class -> remove it. Now n=4, but none reached 80? So we have no data for T=80.
  - **Step 9**: Cannot compute.
  - **Step 10**: Refuse. Reasons: 
    - n too small (less than 20). 
    - The horizon (30 years) is long and the class has only one case (GBP) that was dominant at 80 years and we know its outcome (survived 20 more, but 20<30). So we don't have a case that survived 30 years beyond 80. 
    - Also, the system may be changing (digital currencies) so structural break.

  **Output**: reserve currency: REFUSE

  ---

  ### What the Procedure Cannot Do
  - **Genuinely unprecedented entities**: No reference class exists.
  - **Horizons longer than the class's total span**: E.g., predicting 100 years when the longest case in class is 80.
  - **One-off structural breaks**: E.g., nuclear war, unprecedented technology.
  - **In the hands of someone who needs a number**: They might skip steps (especially stability audit and disanalogy cap) and produce a number of low quality.

  ---

  ### Final Output
  \answer{peg: 0.4; autocracy: 0.6-0.8; reserve currency: REFUSE}
answer: |-
  ### Survival Forecasting Procedure (SFP)  
  **Purpose**: Generate calibrated probability estimates for institutional survival questions under constraints. Outputs a probability (point or range) or "REFUSE" when estimates are unreliable.  

  ---

  #### PROCEDURE STEPS  
  **Step 0: Pre-Commit to Definitions & Horizon**  
  - **Task**: Define the event (start/end triggers, end-state) and set horizon *N* for open-ended questions.  
  - **Sufficient Answer**: Written statement: *"Event starts when [X], ends when [Y] (failure = [dissolution/transformation/substance loss]). Horizon = [N] years."*  
  - **Time**: 10 min.  
  - **Judgment Flag**: Setting *N* for "will this ever happen?" questions. **Rule**: Use median duration of a broad standing class (e.g., "empires" for political orders). If none, *N* = 10 years.  

  **Step 1: Define the Case**  
  - **Task**: Specify start/end events and end-state. Convert open-ended questions using *N* from Step 0.  
  - **Sufficient Answer**: *"Case: [Entity] started at [date/event]. Fails if [end-state]. We assess survival to [current date + N]."*  
  - **Time**: 15 min.  
  - **Judgment Flag**: Defining "substance loss" (e.g., "sanctions regime fails if >50% of target’s trade is rerouted"). **Rule**: Require a measurable threshold.  

  **Step 2: Construct Reference Class (Blind Enumeration)**  
  - **Task**: List all cases from a pre-agreed standing class or mechanical rule (e.g., "all currency pegs since 1950 with GDP > $10k"). Second analyst verifies. If case is famous, second analyst enumerates alone.  
  - **Sufficient Answer**: *List of [n] cases with start/end dates, excluding target case.*  
  - **Time**: 30 min.  
  - **Judgment Flag**: Choosing the standing class. **Rule**: Pre-commit to 2–3 broad classes (e.g., "autocracies," "pegs") built on slow days (see **Standing Classes** below).  

  **Step 3: Base Rate Calculation**  
  - **Task**: Compute Kaplan-Meier survival probability at *t = current age + N*, conditional on survival to *current age*. If insufficient data, use simple proportion of failures by *t*.  
  - **Sufficient Answer**: *Base rate = [p] (n = [number], [number] ongoing).*  
  - **Time**: 15 min.  
  - **Rules**:  
    - **Minimum n**: ≥20 cases for point estimate; else REFUSE or output range.  
    - **Small n**: Report 95% Clopper-Pearson confidence interval (CI).  
    - **Ongoing cases**: Include as censored (Kaplan-Meier).  

  **Step 4: Conditionalize on Elapsed Duration**  
  - **Task**: Adjust for current age *T* using reference class data *without* assuming a survival distribution.  
  - **Sufficient Answer**: *P(survive to T+N | survived to T) = [p] based on [number] cases surviving to T.*  
  - **Time**: 10 min.  
  - **Rules**:  
    - **No distribution assumption**: Use only observed data: *S(T+N)/S(T)* from Kaplan-Meier.  
    - **Sparse data at T**: Report CI or REFUSE.  
    - **Trap**: Do not interpret current survival as evidence of robustness. *Only data from reference class informs hazard rate.*  

  **Step 5: Correct for Recording Filter**  
  - **Task**: Adjust for under-recorded short-lived cases by truncating class to cases surviving >1 year. Recompute base rate.  
  - **Sufficient Answer**: *Base rate after truncation = [p] (vs. [p] untruncated). Bias note: [short description].*  
  - **Time**: 10 min.  
  - **Rule**: Always truncate at 1 year minimum survival to mitigate bias.  

  **Step 6: Disanalogy Ledger**  
  - **Task**: Apply pre-defined factors (e.g., "resource dependency") measured across the reference class. Adjust base rate if subgroup effect is significant.  
  - **Sufficient Answer**: *Table: Factor [A] moves p by [Δp] (n_subgroup=[number]). Net adjustment: [p_adj].*  
  - **Time**: 20 min.  
  - **Rules**:  
    - **Pre-defined factors only** (no ad-hoc "this time is different").  
    - **Subgroup size**: ≥10 cases per subgroup to adjust.  
    - **Cap**: Total adjustment ≤ |±0.2| from base rate.  

  **Step 7: Stability Audit**  
  - **Task**: Test robustness by: (a) widen class (drop one filter), (b) narrow class (add one filter), (c) drop extremes (shortest/longest 10% survival), (d) drop recent cases (post-2000).  
  - **Sufficient Answer**: *Range after audit: [min_p]–[max_p].*  
  - **Time**: 15 min.  
  - **Rules**:  
    - **Flip**: If any test crosses 0.5 threshold (e.g., 0.6 → 0.4), output range or REFUSE.  
    - **Downgrade**: If range width >0.3, output range.  

  **Step 8: Handle Self-Membership**  
  - **Task**: If target case is in class, remove it. If class data comes from the system being assessed (e.g., UN data for USD dominance), REFUSE.  
  - **Sufficient Answer**: *Class purified: [n] cases. [Note on data bias].*  
  - **Time**: 5 min.  

  **Step 9: Fuse with Inside View**  
  - **Task**: Only allow adjustments via Disanalogy Ledger (Step 6). Output final probability and confidence score (1–5) based on stability audit.  
  - **Sufficient Answer**: *Final P = [p] (confidence: [score]). Confidence = 5 if range width ≤0.1, 4 if ≤0.2, 3 if ≤0.3, 2 if range, 1 if CI.*  
  - **Time**: 5 min.  

  **Step 10: Stop Rules**  
  - **Task**: REFUSE if:  
    - *n* < 20 after Step 8,  
    - Horizon > max observed duration in class,  
    - Stability audit flips or range width >0.5,  
    - Case is genuinely unprecedented (no class exists).  
  - **Output when refusing**: *"No reliable estimate. Base rate was [p] ± [range]. Decision must weigh loss function: cost of false negative vs. false positive."*  
  - **Time**: 5 min.  

  ---

  ### BUILDING STANDING REFERENCE CLASSES  
  **Purpose**: Pre-construct classes to avoid bias during case-specific enumeration.  
  **Procedure**:  
  1. **Select 2–3 broad categories** (e.g., "Currency Pegs," "Resource Autocracies," "Reserve Currencies").  
  2. **Define mechanical inclusion rules** (e.g., "Currency Pegs: All IMF-listed pegs lasting >1 month since 1950").  
  3. **Extract data** from standardized sources (e.g., IMF reports, Polity IV, Correlates of War).  
  4. **Store in shared dataset** with: start/end dates, key variables (GDP, resources, conflict).  
  **Update**: Quarterly, using same sources.  

  ---

  ### APPLYING SFP TO LIVE QUESTIONS  
  #### Case 1: Currency Peg (held 9 years. Survive 5 more?)  
  - **Step 0**: *N* = 5 yr. Failure = devaluation >15% or abandonment.  
  - **Step 1**: Start: peg established. End: devaluation/abandonment. Horizon: 9+5=14 yr total.  
  - **Step 2**: Standing class "Currency Pegs" (n=58 from IMF history).  
  - **Step 3**: Of 58 pegs, 32 failed by 14 yr. Base P(survive) = 26/58 = 0.45.  
  - **Step 4**: Conditional on 9 yr: 40 pegs survived to 9 yr. 18 failed by 14 yr. P(survive) = 22/40 = 0.55.  
  - **Step 5**: After truncation (exclude <1 yr): P=0.53. Bias: minor (short pegs rare).  
  - **Step 6**: Factor: "Inflation differential." High-inflation subgroup (n=12) P=0.33. Case has high inflation → adjust to 0.53 - 0.15 = 0.38.  
  - **Step 7**: Audit: Range 0.35–0.42 (no flip).  
  - **Step 8**: No self-membership.  
  - **Step 9**: P=0.38 (confidence: 4).  
  - **Step 10**: Not refused.  
  **Output**: peg: 0.38  

  #### Case 2: Resource Autocracy (30 years, ruler 78. Survive 10 more?)  
  - **Step 0**: *N* = 10 yr. Failure = regime collapse or leadership overthrow.  
