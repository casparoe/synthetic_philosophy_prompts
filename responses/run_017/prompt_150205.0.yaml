prompt: |-
  I'm a staff-level software engineer and I host a fortnightly ideas slot for my part of the organisation: about a dozen backend and ML engineers, nobody with more philosophy than perhaps one survey course taken years ago, forty-five minutes, a whiteboard and a projector, and no assigned reading because nobody will do it. My turn is coming up and I want to spend it on the underdetermination of theory by evidence. I have read enough to know that the thesis comes in grades that I don't have stable names for: a weak grade, where the evidence available at a given time simply does not yet single out one theory and further data might; a strong grade, where two rivals agree on every observation anyone could ever make, so that no possible evidence could separate them; and a more global grade, where what the evidence bears on is not one hypothesis at a time but a package whose auxiliary assumptions can be given up to shield the hypothesis — the version I have seen called the Duhem–Quine point. Please do not explain the thesis to me. I want a plan for explaining it to them, and I want the plan to be built around our own material rather than around physics or the history of science.

  Concretely, I would like the following worked out.

  First, the dependency structure: which grade has to be on the board before the next one can mean anything, and which order prevents the strong grade from being heard as a restatement of the weak one. My instinct is that if I open with the weak grade they will all nod and the rest of the session will be lost, because they already believe it in the form "passing tests doesn't prove the absence of bugs."

  Second, the one example that carries the whole session. My candidate is a case from our own work: two candidate implementations of the same interface that provably agree on every input anyone could construct and run before the heat death of the universe, and disagree only on inputs of, say, 2^80 bytes or on inputs requiring more memory than the observable universe has particles. Call it the unreachable-input case if you like. Tell me what such an example must have and must lack to carry the strong grade rather than quietly collapsing into the weak one, whether it should be the hook at minute zero or the stress test at minute forty, and how I should handle the fact that we ourselves treat unreachable code as nonexistent — compilers delete it, we don't test it, we don't review it — which is either a decisive practical answer to the strong grade or a sign that our practice begs the question, and I can't tell which.

  Third, the misconception map, with the point in the sequence where each one should be headed off rather than merely answered at the end. The ones I expect: the slide from "the evidence doesn't force the theory" to "so any theory is as good as any other, it's all social"; the move of dissolving the problem by appealing to simplicity or other tie-breakers, which I suspect is too quick but can't say why; the colleague who will say that if two theories agree on all possible observations they are the same theory and the disagreement is merely verbal; and the colleague, more common in the ML half of the room, who holds that a theory just is a compressed representation of the data, so that there is nothing over and above the evidence for a rival to disagree about. If there are two or three further misconceptions that predictably form at exactly this level and not in a philosophy seminar, I want those more than the canonical ones.

  Fourth, where in the arc the session should stop being setup and say something contestable, and what that claim is; what I should openly refuse to explain at this level and announce as a refusal rather than fudging; and one question I can put to the room at the end such that the answer tells me whether the distinction between the grades has landed, together with what a confident, fluent, and wrong answer to that question would sound like.
reasoning: |-
  We are given: a 45-minute session for backend and ML engineers with no philosophy background. We are to explain the underdetermination of theory by evidence, focusing on three grades: weak (incomplete data), strong (no possible evidence could distinguish two theories), and Duhem-Quine (holism, where auxiliary assumptions shield the core hypothesis). We are not to use physics or history of science but our own material.

  The plan:

  1. **Dependency Structure and Order**: 
     - Start with the **strong grade** to avoid it being subsumed by the weak grade. If we start with weak, they'll think "we know this: more tests needed". So we begin with an example that illustrates the strong underdetermination: two theories that agree on every observation that could ever be made. Then, we can contrast with the weak (which they know) and then introduce the Duhem-Quine point.

     Proposed order:
     a. **Strong grade**: Present the unreachable-input case (two implementations that are observationally equivalent for all feasible inputs, but differ on inputs beyond physical possibility). This is the hook.
     b. **Weak grade**: Contrast with a case where more data (in the future) could decide. This is familiar to them and will be quickly understood as a different scenario.
     c. **Duhem-Quine**: Then show how in practice, when a test fails, we don't know which part of the system (core or auxiliary) is wrong.

  2. **The Example (Unreachable-Input Case)**:
     - **Requirements for strong grade**: The example must have two theories (or implementations) that are:
          * Empirically equivalent for every observation that is physically possible to make (now and forever).
          * But logically distinct (they are not the same theory).
     - **Must lack**: Any possibility of ever getting an observation that would distinguish them, because the inputs that would reveal the difference are physically impossible (e.g., require more resources than the universe has).
     - **When to present**: At minute zero as the hook. The entire session is built to understand this case and its implications.
     - **Handling the practical attitude**: We do treat unreachable code as dead. But note: 
          * This is a practical decision, not a logical one. 
          * The strong underdetermination shows that there are multiple distinct programs that are empirically equivalent. Our practice of choosing one (or even ignoring the difference) is a pragmatic move. 
          * We can say: "In practice, we choose the simpler one, or the one that is more maintainable, but note that we are making a choice that is not forced by the evidence. The evidence alone cannot tell us which one is 'correct' in the unreachable region. And that's the point: the evidence underdetermines the theory."

  3. **Misconception Map** (with when to address):
     a. **"So any theory is as good as any other" (relativism)**: 
          - Address immediately after presenting the strong grade. Emphasize: underdetermination does not imply that all theories are equally good. We have other criteria: simplicity, explanatory power, coherence with other theories, etc. But note: these are not dictated by the evidence. They are pragmatic or aesthetic. 
          - **When**: After the strong grade example.

     b. **Appealing to simplicity as a tie-breaker**:
          - This is a natural response. We should note that simplicity is a virtue, but it is not a truth-revealing criterion. We can have two theories that are equally simple? Or we might have a complex theory that we prefer for other reasons. Also, simplicity is not uniquely defined. 
          - **When**: When discussing how we choose between the two implementations in the unreachable-input case.

     c. **"They are the same theory, the disagreement is verbal"**:
          - This is a common move. We must show that the two theories are not the same: they make different claims about the unreachable inputs. They are extensionally equivalent in the observable domain but intensionally different. 
          - **When**: When presenting the strong grade example, preempt by emphasizing that the two programs have different code and would produce different outputs on some inputs (if we could run them). They are not the same program.

     d. **ML view: "A theory is just a compressed representation of the data"**:
          - This view (common in ML) says that if two models have the same predictions on all data, they are the same model. But note: our example has two different compressions (programs) that produce the same outputs for all observable inputs. The ML engineer might say: then they are the same model. We must argue that the internal structure is different and that the models might generalize differently if we had more data (but we can't). Also, note that in the strong underdetermination, there is no more data. 
          - **When**: When discussing the ML perspective, which might come up. We can note that even in ML, two different neural network architectures (or two different decision trees) can have the same behavior on all training and test data (if the test data is limited to the observable) but be different internally. And we cannot know which one is the "true" model (if there is one) because we can't get more data.

     e. **Two additional misconceptions**:
          - **"We can just run the test with the unreachable input in simulation"**: But note: the simulation itself would require more resources than the universe has. So we cannot.
          - **"This is just a thought experiment and not relevant to practice"**: We must argue that it reveals a fundamental limitation: our evidence is finite and the space of possibilities is infinite. Also, it shows that our choice of theory is not dictated by evidence alone.

  4. **Arc and Contestable Claim**:
     - **Setup**: Minutes 0-20: Present the strong grade example and explain why it is strong. Then minutes 20-30: Contrast with weak grade and then introduce Duhem-Quine (with a software example: e.g., a test fails, but it could be the core algorithm or the data preprocessing). 
     - **Contestable Claim**: At minute 30, make the claim: "In the strong underdetermination case, there is no fact of the matter about which program is correct. The choice between them is not a matter of evidence but of other values (simplicity, elegance, etc.)." This is contestable because some might believe that one of them is "objectively" the right one (even if we can't know it) or that the program that was intended by the specification is the correct one (but note: the specification might not specify the unreachable region).
     - **Refusal**: Openly refuse to delve into the metaphysical debate about realism vs. anti-realism. Say: "We are not going to settle whether there is a fact of the matter in some Platonic sense. We are focusing on what the evidence can tell us."
     - **Closing Question**: At minute 40, ask: "In the unreachable-input case, if we have two programs that are identical on every input we can run but differ on some inputs that we cannot run, should we consider them as the same program? Why or why not?" 
          - **Confident, fluent, and wrong answer**: "Yes, because in practice we only care about the behavior we can observe. So they are the same program." (This misses the point that they are two distinct programs and that the evidence does not force us to choose one over the other. It collapses the strong underdetermination into a practical equivalence, which is a pragmatic move but does not address the theoretical point.)

  **Detailed Plan**:

  - **Minute 0-5**: Hook with the unreachable-input example. Describe two implementations of a function that must handle arbitrary-sized inputs. They are identical for all inputs that we can run (due to physical constraints) but differ for some astronomically large inputs (e.g., 2^80 bytes). Ask: "Which one is correct? How can we know?"

  - **Minute 5-15**: Explain strong underdetermination: no possible evidence can decide. Preempt the misconception that they are the same program: show the code snippets and note they are different. Preempt the slide into relativism: we can still choose based on other criteria.

  - **Minute 15-20**: Contrast with weak underdetermination: a bug that we haven't found because we haven't tested enough. We know that more testing could reveal it. This is different from the strong case.

  - **Minute 20-30**: Duhem-Quine: Use an example of a failing test in a complex system. The bug could be in the core algorithm, the data loader, the OS, the hardware, etc. We adjust auxiliary assumptions to protect the core. Show how we use unit tests and other methods to isolate.

  - **Minute 30-35**: Make the contestable claim and discuss. Open the floor for reactions.

  - **Minute 35-40**: Address the ML perspective: if two models have the same behavior on all possible data (including future data we could collect) but different internal structures, are they the same model? (No, because they are different compressions and might be vulnerable to different adversarial examples? But note: in the strong case, there is no future data. So they are empirically equivalent.)

  - **Minute 40-45**: Closing question and wrap-up.

  **Materials**:
  - Whiteboard: Draw the two functions for the strong example. Show the code that differs only in the unreachable part.
  - Projector: Show a diagram for Duhem-Quine: a hypothesis surrounded by auxiliary assumptions, and how a failed test can be fixed by adjusting any part.

  **Handling the Practical Attitude**:
  - Acknowledge: "Yes, in practice we treat them as the same because we can't run the unreachable inputs. But the point is: the evidence we have does not uniquely determine the program. There are multiple distinct programs that are consistent with all the evidence we can ever have. Our practice of choosing one (or ignoring the difference) is a practical response to this underdetermination, but it doesn't make the underdetermination go away."

  This should provide a clear and engaging session that uses their own work and avoids philosophy jargon.
answer: |-
  ### Plan for the Session: Underdetermination in Software Engineering

  #### **Dependency Structure & Order**  
  *(Total: 45 minutes)*  
  **Key Principle:** Start with the **strong grade** to prevent it from being absorbed into the weak grade. The weak grade is intuitive to engineers ("tests don't prove absence of bugs") and risks trivializing the session. The strong grade forces a confrontation with fundamental limitations.  

  1. **Min 0–12: Strong Grade First**  
     - Open with your **unreachable-input case** (see below).  
     - Emphasize: *No possible evidence can ever distinguish the two theories, even with infinite time/resources.* This is not about "we haven’t tested enough" (weak grade) but "testing is *impossible* in principle."  
     - **Why this order?**  
       - If weak grade comes first, engineers default to "just get more data." Starting with strong grade makes weak grade feel like a step down, not up.  
       - Duhem-Quine requires strong grade as a foundation (you can’t shield a hypothesis with auxiliaries if evidence could resolve it).  

  2. **Min 12–20: Weak Grade as Contrast**  
     - Use a familiar example: A bug that occurs only in untested edge cases (e.g., a race condition that appears once per billion requests).  
     - Stress: *This is resolvable with more data.* Contrast with strong grade ("Here, more data *cannot* help").  

  3. **Min 20–32: Duhem-Quine (Global Grade)**  
     - Use a software example: A failing test in a microservice. Did the core logic fail, or was it the API client, network, or test data? Auxiliary assumptions protect the core hypothesis.  
     - Tie to strong grade: *Even with perfect evidence, auxiliaries let you preserve a theory.*  

  4. **Min 32–40: Implications and Misconceptions**  
     - Discuss pragmatism (how we choose theories), contestable claims, and address misconceptions.  

  5. **Min 40–45: Closing Question & Wrap-up**  

  ---

  #### **The Example: Strong Grade via "Unreachable Input"**  
  **What it needs:**  
  - Two implementations of the same interface (e.g., a hash function, sorting algorithm, or ML model).  
  - They **agree on all inputs constructible before the heat death of the universe** (e.g., inputs ≤ 1 exabyte).  
  - They **disagree on physically unrealizable inputs** (e.g., inputs of size 2¹⁰⁰ bytes, requiring more particles than exist).  
  - Prove equivalence for feasible inputs (e.g., formal verification or bounded model checking).  

  **Why it works for strong grade (not weak):**  
  - Weak grade: "We haven’t tested inputs > 1TB yet, but we could."  
  - Strong grade: "Testing inputs > 2¹⁰⁰ bytes is *physically impossible*. No future evidence can resolve this."  
  - **Crucial:** Frame the disagreement as **logical** (different code paths) not just verbal. Show pseudocode:  
    ```python
    # Version A: Crashes on input > 2¹⁰⁰ bytes
    def process(input):
        if len(input) > 2**100: 
            raise OverflowError  # Code path 1 (unreachable)
        else: 
            ...  # Feasible path

    # Version B: Returns 0 on input > 2¹⁰⁰ bytes
    def process(input):
        if len(input) > 2**100: 
            return 0  # Code path 2 (unreachable)
        else: 
            ...  # Feasible path (same as A)
    ```  
    Both are "correct" per the spec for all feasible inputs, but logically distinct.  

  **When to present:** **Minute 0** as the hook. This is your core example.  

  **Handling "unreachable code = dead code" pragmatism:**  
  - Acknowledge: "Yes, we delete unreachable code. But *why*? Not because evidence supports it, but because we **value parsimony**. Evidence alone doesn’t force this choice—it’s a pragmatic bypass of underdetermination."  
  - Argue: "Our practice *presupposes* that unreachable differences don’t matter. But the strong grade shows this is a **philosophical choice**, not an evidentiary one."  
  - **Preempt collapse into weak grade:** Stress that "dead code elimination" is a *decision*, not a discovery. The compiler doesn’t "know" the code is dead—it assumes physical constraints.  

  ---

  #### **Misconception Map**  
  Address these **proactively** at specified points:  

  1. **"Any theory is as good as any other" (relativism)**  
     - **When:** During strong grade (min 10) and again in implications (min 35).  
     - **Response:** "Underdetermination says evidence doesn’t *force* a choice, not that all choices are equal. We use **tie-breakers**: simplicity (Occam’s Razor), coherence, or utility. But these aren’t truth-tracking—they’re practical."  
     - **Software analogy:** Choosing between two APIs with identical behavior. We pick the cleaner one, but this is aesthetics, not truth.  

  2. **"Simplicity dissolves the problem"**  
     - **When:** During implications (min 35).  
     - **Why it’s too quick:** Simplicity is subjective (e.g., is a neural net "simpler" than a decision tree for the same accuracy?). It doesn’t answer *why* the universe rewards simplicity.  
     - **Response:** "Simplicity breaks ties, but it’s a **pragmatic tool**, not evidence of truth. The strong grade still holds: two complex theories could also be empirically equivalent."  

  3. **"Theories are the same if they agree on observations"**  
     - **When:** During strong grade example (min 5).  
     - **Response:** "They’re **empirically equivalent but logically distinct**. Version A and B have different code for unreachable inputs—this isn’t verbal, it’s structural. If the universe allowed larger inputs, they’d diverge."  

  4. **"A theory is just a compressed representation of data" (ML view)**  
     - **When:** During Duhem-Quine (min 25) and implications (min 38).  
     - **Response:** "Compression doesn’t resolve underdetermination. Two models (e.g., a decision tree vs. SVM) can have identical outputs but different internal structures. The 'compression' is non-unique—evidence doesn’t dictate *which* compression is correct."  

  5. **Engineer-Specific Misconceptions:**  
     - **"We can simulate the unreachable input"**:  
       - **When:** During strong grade (min 8).  
       - **Response:** "Simulating 2¹⁰⁰ bytes requires more atoms than exist. You’re not simulating the input—you’re simulating a *model* of it, which presupposes a theory."  
     - **"This is irrelevant—we only care about feasible inputs"**:  
       - **When:** During implications (min 34).  
       - **Response:** "True for *practice*, but the strong grade shows our **knowledge has limits**. We can’t claim our theory is uniquely true—only that it works for what we need."  

  ---

  #### **Arc: When to Get Contestable**  
  - **Min 32–40: The Contestable Turn**  
    - Claim: **"Evidence alone is never sufficient to choose a theory. We *always* rely on untestable priors (simplicity, elegance, etc.)."**  
      - Software angle: "Why do we refactor 'working' code? Not because of evidence, but because we value maintainability—a non-evidentiary prior."  
    - **Why it’s contestable:** Engineers often see debugging as purely empirical. This claims empiricism is incomplete.  

  - **What to Refuse (Min 12 and Min 38):**  
    - "We won’t resolve **metaphysical realism** (is there a 'true' theory?). We’re discussing epistemology: what evidence can tell us."  
    - "We won’t debate **Bayesianism vs. falsificationism**—this is a primer, not a PhD seminar."  

  - **Closing Question (Min 42):**  
    - **Question:** *"In the unreachable-input case, if Version A and B pass all tests, is there a fact of the matter about which is correct?"*  
    - **Confident/Fluent but Wrong Answer:**  
      - *"No, because they behave identically in practice. The difference is meaningless."*  
      - **Why it’s wrong:** It conflates empirical equivalence with identity. The strong grade says they’re *distinct* theories with no evidentiary basis for choice—not that they’re the same.  
    - **What You Want to Hear:** "No—but not because they’re the same. Evidence underdetermines which one is 'correct,' so we choose based on other values (e.g., code quality)."  

  ---

  ### Summary Flow  
  1. **Hook (Strong Grade):** Unreachable-input case (0–12 min).  
  2. **Contrast (Weak Grade):** Testable edge-case bug (12–20 min).  
  3. **Deepen (Duhem-Quine):** Microservice test failure (20–32 min).  
  4. **Provoke (Implications):** Tie-breakers, misconceptions, contestable claim (32–40 min).  
  5. **Assess (Closing):** Question and wrap-up (40–45 min).  

  **Why this works:** It starts with a paradox familiar to engineers (unreachable code), escalates to epistemic humility, and avoids philosophy jargon. The unreachable-input example is your anchor—return to it to clarify each grade.
