prompt: |-
  I am writing a general reference entry on the boundary between legend and history, and every treatment of the Trojan War, King Arthur, and the Exodus that I read turns on criteria that nobody has stated. So before I apply any such criterion to a case, I want the specification.

  Your task: set out the desiderata that a criterion for classifying a traditional narrative — or a part of one — as historical rather than legendary must satisfy, given a fixed purpose. The purpose is this: the criterion is to determine what a secular reference work may assert, hedge, or decline to assert, for an adult readership with no specialist training. Assume the criterion will be applied to narrative traditions generally, including traditions that the person applying it belongs to and has a stake in.

  For each desideratum: state it, give the case or consideration that motivates it, and mark it as either non-negotiable or a preference of one temperament or camp. Use a numbered list for the requirements; a table is acceptable for the closing scorecard only.

  Start by auditing the raw material below. These are the constraints I keep encountering in practice. Decide which are genuine desiderata, which are disguised restatements of one another, and which are merely the reflexes of a suspicious or a trusting temperament:

  - chronological proximity of the earliest surviving source to the events described;
  - numerical independence of attestations — including what "independent" can mean when later sources copy earlier ones and when a shared oral tradition is not a common source in the usual sense;
  - agreement with what excavation and inscriptions establish independently of the narrative;
  - the criterion of embarrassment: that a tradition would not invent material inconvenient to itself;
  - absence of any discernible motive for invention;
  - generic plausibility, i.e. that the events are the sort of thing that happens;
  - the inference from real place names, real offices, and real objects embedded in the story to the reality of what is said about them.

  Then I want the list to rule out, explicitly, three failure modes. Treat each as a test a candidate criterion must be shown to pass, and say what it costs to pass it:

  1. Transmission selection. The features that make a story worth retelling — drama, a moral point, a memorable reversal, the miraculous — are the same features that invite elaboration in the retelling. A criterion that reads wide circulation, persistence, or vivid detail as evidence of fidelity has the sign wrong. State the requirement that handles this, and say how a criterion is supposed to estimate the distortion rate of a tradition without already knowing what the tradition distorts.
  2. Absorbed detail. A narrative can take up genuine topography, genuine institutions, and genuine names without any of them corroborating the events it narrates. Require the criterion to distinguish detail that corroborates from detail that was merely available to be absorbed, and to say how the two are told apart in advance of knowing the answer.
  3. Circular cross-validation. Excavators identify a site using the narrative; the identified site is then cited as confirming the narrative; inscriptions are read through the story and the story through the inscriptions. Require the criterion to fix an order of inference that blocks the loop, or to explain why the loop is benign and how much independent anchoring is needed to make it so.

  Consider also placing, merging, or rejecting the following:

  - Decomposition: the criterion must grade parts of a narrative rather than return one verdict on "the Trojan War" or "the Exodus," since a war fought at a real place, the elopement that supposedly caused it, and the gods fighting on the plain are different claims answerable to different evidence.
  - The existence/accuracy split for named individuals, so that the question whether an Arthur or a Moses existed is not settled by settling whether anything in the narrative happened to him, and not settled the other way either.
  - An explicit expected-record assumption: silence counts against a tradition only given some view of how much documentation a society of that period and kind should have left. The criterion must state that view rather than leave it implicit.
  - Recalibration against controls: the criterion should be run on cases whose answer is independently settled, and a criterion that would refuse to certify a well-documented recent event, or that would fail to exclude a narrative we are confident was invented, is defective in a way that no amount of internal elegance repairs.

  The structural questions matter to me more than any verdict on a case:

  - Name one pair of desiderata you believe cannot be jointly satisfied, and say what a criterion must give up. The pair I have in mind is recalibration against known cases versus the demand that a criterion not be tuned to return the answer its author antecedently favors — but argue for whichever pair you find worst, including that one if you agree.
  - Identify the single desideratum that excludes the most candidate criteria, and explain why it does more exclusionary work than the others.
  - Say how the list changes if the purpose shifts. Consider a court adjudicating a territorial or customary claim, and a religious community asking whether its constitutive narrative is true. Which requirements become non-negotiable, which drop out, and does any requirement flip its sign?

  Close with a short paragraph or a compact table scoring three broad stances against the list, and nothing more than that: (i) an austere evidentialism that places the burden of proof on the tradition and withholds assent absent near-contemporary attestation; (ii) a generous default that treats a stable, widely held tradition as innocent until positively disconfirmed; (iii) a memory-first approach that takes the object of study to be what a community preserved and transformed rather than what occurred, and doubts that the occurrence question is answerable at all.

  Write in American English. Target 900 to 1,200 words, with the weight on the requirements and their motivating cases rather than on the scoring. Do not name or cite scholars, works, or excavations; I want the argument, not the literature.
reasoning: |-
  Hmm, the user is asking for a detailed set of desiderata to evaluate when a traditional narrative can be considered historical versus legendary for a secular reference work. They want clear criteria that avoid common pitfalls in historical analysis. I need to carefully analyze their constraints and failure modes, then organize these into a coherent framework.

  Looking at their raw material, I see several key constraints they've encountered. Chronological proximity of sources is important but needs nuance - early sources aren't automatically reliable. Independent attestation is tricky with oral traditions where sources might share common roots. Archaeological agreement is valuable but raises circularity concerns. The criterion of embarrassment and absence of invention motive are psychologically plausible but can be speculative. Generic plausibility risks modern bias, and embedded real details don't necessarily validate events.

  The three failure modes are particularly important to address. Transmission selection shows that memorable elements are most likely to be embellished. Absorbed detail explains how real elements can be incorporated fictionally. Circular cross-validation reveals how archaeology and texts can create false confirmation loops.

  For additional elements: Decomposition is essential - we must evaluate narrative elements separately. The existence/accuracy split for figures like Arthur is crucial. The expected-record assumption needs explicit documentation standards. Recalibration against known cases is vital for testing the criterion itself.

  Regarding structural questions: Recalibration vs avoiding bias creates tension - we need a criterion that's testable yet not predetermined by the historian's beliefs. The most exclusionary desideratum is probably handling circular cross-validation, as it challenges common historical methods. For different purposes (court vs religious community), standards would shift significantly - courts require higher evidence thresholds while religious communities might prioritize meaning over factuality.

  I'll develop a numbered list of desiderata covering all these aspects, then provide a concise scorecard for the three broad stances (austere evidentialism, generous default, memory-first approach). The focus will be on creating a practical, balanced framework that addresses the user's need for a rigorous yet applicable set of criteria.
answer: |-
  Here is a set of desiderata for a criterion classifying traditional narratives as historical or legendary, designed for a secular reference work targeting a general adult audience. The desiderata are derived from auditing your constraints, addressing the specified failure modes, and incorporating your additional considerations.

  ### Desiderata for the Criterion

  1.  **Non-Circular Archaeological/External Corroboration:** The criterion must require corroboration from archaeology, contemporary inscriptions, or independent documentary sources that is *not* dependent on the narrative itself for its identification or interpretation.
      *   **Motivation:** Addresses *Circular Cross-Validation*. Finding a city named Troy does not confirm the Trojan War; the city's existence must be established independently (e.g., through Hittite records mentioning Wilusa), and evidence for destruction must be linked to the narrative *without* assuming the narrative is true to identify the site or interpret the evidence.
      *   **Status:** **Non-negotiable.** Without this, the criterion cannot escape confirmation bias loops.

  2.  **Decomposition and Graded Assessment:** The criterion must treat narratives as composites and evaluate individual claims (e.g., existence of a place, existence of a person, specific actions attributed to that person, supernatural elements) separately based on the evidence relevant to each claim type.
      *   **Motivation:** Recognizes that narratives are layered (e.g., Troy's existence vs. Helen's abduction vs. divine intervention). Acknowledges the *Existence/Accuracy Split* (Arthur may have existed without the sword-in-the-stone story being true). Prevents an all-or-nothing verdict.
      *   **Status:** **Non-negotiable.** Essential for nuanced reference work entries and avoiding misleading oversimplification.

  3.  **Explicit Expected-Record Framework:** The criterion must incorporate an explicit, justified assumption about what kind of documentation or material evidence *should* reasonably exist for the type of event or entity described, given the period, society, and nature of the claim. Silence counts against the claim *only* if such evidence is reasonably expected.
      *   **Motivation:** Prevents anachronistic demands (e.g., expecting detailed administrative records for a nomadic group like the Exodus Israelites) or dismissing claims unfairly due to absence of evidence where evidence wouldn't be expected anyway. Defines the baseline for assessing "absence."
      *   **Status:** **Non-negotiable.** Critical for fair assessment and avoiding the fallacy of negative proof. Must be transparently stated.

  4.  **Resistance to Transmission Selection Effects:** The criterion must not interpret a story's memorability, widespread persistence, vivid detail, or dramatic elements as positive evidence for its historicity. It must acknowledge these features primarily aid transmission and invite elaboration.
      *   **Motivation:** Directly addresses the *Transmission Selection* failure mode. A gripping story is not inherently a true story (e.g., the dramatic elements of Arthur's return or the Plagues of Egypt are precisely what make them compelling and prone to embellishment).
      *   **Status:** **Non-negotiable.** Corrects a common intuitive error in evaluating tradition.

  5.  **Distinction Between Absorbed Detail and Corroborative Detail:** The criterion must differentiate between the presence of genuine background details (place names, objects, institutions) that were simply part of the cultural milieu and available for fictional use, versus details whose presence *specifically corroborates* the unique claims of the narrative.
      *   **Motivation:** Addresses the *Absorbed Detail* failure mode (e.g., accurate descriptions of Mycenaean armor in the Iliad show knowledge of the past, not necessarily that the Trojan War happened; accurate details of Egyptian court life in the Exodus story don't confirm the Exodus event itself). Corroboration requires a *unique fit*.
      *   **Status:** **Non-negotiable.** Crucial for preventing false positives from authentic local color.

  6.  **Recalibration Against Known Controls:** The criterion must demonstrably yield plausible results when applied to cases with independently well-established historical status (e.g., the assassination of Julius Caesar) and to cases confidently known to be fictional or legendary (e.g., the story of Romulus and Remus founding Rome). It should not certify weak evidence for a known event or fail to exclude a known fiction.
      *   **Motivation:** Provides an empirical test for the criterion's validity and prevents purely theoretical elegance disconnected from reality. Ensures practical applicability.
      *   **Status:** **Strong Preference (Methodological Necessity).** While not a rule applied *within* the criterion for a specific case, it's essential for validating the criterion *itself* during its formulation and application. Failure here invalidates the criterion.

  7.  **Source Critical Foundation:** The criterion must account for the nature of the sources (proximity in time, genre, purpose, potential biases, relationship to each other - distinguishing true independence from shared oral tradition vs. direct copying). "Independence" means attestation derived from genuinely separate lines of transmission or evidence, not just multiple copies of the same source.
      *   **Motivation:** Addresses the raw constraints of *chronological proximity* and *numerical independence*. Recognizes that later copies add little weight and that oral tradition is a complex, potentially unitary source. An early source (e.g., Homer, earliest Exodus fragments) is valuable but not sufficient alone.
      *   **Status:** **Non-negotiable.** Fundamental historical methodology.

  8.  **Plausibility as a Filter, Not Proof:** Generic plausibility ("the sort of thing that happens") can be used as a *negative* filter to exclude claims that violate known physical laws or overwhelming historical patterns, but *not* as positive evidence for historicity. Extraordinary claims require extraordinary evidence.
      *   **Motivation:** Prevents dismissing unusual but possible events unfairly (e.g., a charismatic leader uniting tribes - Arthur, Moses - *is* plausible), while preventing "plausibility" from masking cultural bias or granting undue credence to mundane details within an implausible framework. Balances the raw *generic plausibility* constraint.
      *   **Status:** **Strong Preference (Guarding Against Bias/Speculation).** Using it positively risks modern projection.

  9.  **Cautious Use of Motive-Based Arguments:** Arguments based on the *criterion of embarrassment* or *absence of motive for invention* may be considered as *supporting* evidence *if* a strong case for motive (or lack thereof) can be made based on the *demonstrable context and values* of the tradition's originators, but they are weak reeds and never sufficient alone. They cannot overcome a lack of corroboration.
      *   **Motivation:** Recognizes these arguments (raw constraints 4 & 5) are highly speculative ("Why *would* they invent that?" is often unanswerable; "Why *wouldn't* they invent that?" ignores creativity/propaganda). They are easily misapplied. Their value is contingent and secondary.
      *   **Status:** **Preference (Skeptical Temperament).** Best treated as minor, auxiliary points requiring strong contextual justification.

  ### Addressing Structural Questions

  1.  **Conflict: Recalibration vs. Avoiding Pre-tuning:** The tension between needing to recalibrate the criterion against known cases (Desideratum 6) and ensuring it isn't simply tuned to deliver the answers its creator already favors is real. **Resolution:** The criterion must give up the illusion of perfect objectivity. Recalibration is essential for empirical grounding. To mitigate bias, the recalibration process must be transparent, using a *broad range* of control cases representing different cultures, periods, and claim types, explicitly agreed upon as clear-cut by a diverse set of historians *before* tuning the criterion. The focus is on making the criterion *consistently applicable*, not on predetermining specific outcomes for contested cases like Troy or Exodus. The criterion's *rules* (e.g., requiring non-circular corroboration for core events) should be defensible independently of the control outcomes.

  2.  **Most Exclusionary Desideratum:** **Non-Circular Archaeological/External Corroboration (Desideratum 1)** does the most exclusionary work. It explicitly blocks the common practice of using the narrative to identify sites/inscriptions and then using those sites/inscriptions as confirmation. It demands evidence that stands wholly apart from the tradition itself, which is often absent or ambiguous for precisely the deep past where legend/history boundaries are fuzzy (e.g., no contemporary Egyptian record mentions Israelite slavery/exodus; evidence for a "historical Arthur" lacks contemporary inscription). Many popular arguments for historicity fail this test immediately.

  3.  **Change of Purpose:**
      *   **Court Adjudicating Claim:** Non-Negotiable Desiderata **1 (Corroboration)**, **2 (Decomposition)**, **3 (Expected Record)**, **4 (Transmission Selection)**, **5 (Absorbed Detail)**, and **7 (Source Criticism)** become paramount. The burden of proof shifts even higher. Recalibration (6) becomes crucial for demonstrating the criterion's reliability. Plausibility (8) gains weight as a negative filter (e.g., rejecting claims violating established law/history). Motive arguments (9) become even less relevant. The goal is minimizing false positives that could grant illegitimate claims.
      *   **Religious Community (Truth of Constitutive Narrative):** Desiderata **1 (Corroboration)** and **3 (Expected Record)** may be downplayed or rejected if faith transcends physical evidence. **2 (Decomposition)** might be resisted if the narrative is seen as an indivisible truth. **8 (Plausibility)** might be rejected if miracles are central. **6 (Recalibration)** might be seen as irrelevant or hostile. **4 (Transmission Selection)** and **5 (Absorbed Detail)** might be acknowledged but interpreted differently. The focus shifts towards internal coherence, theological meaning, and communal identity. The "burden of proof" often implicitly flips to require disproof, conflicting directly with Austere Evidentialism.

  ### Scorecard of Broad Stances

  | Desideratum                          | Austere Evidentialism | Generous Default       | Memory-First Approach  |
  | :----------------------------------- | :-------------------- | :--------------------- | :--------------------- |
  | **1. Non-Circular Corroboration**    | PASS (Essential)      | FAIL (Often waived)    | FAIL (Irrelevant)      |
  | **2. Decomposition**                 | PASS                  | FAIL (Holistic)        | PASS (Core Activity)   |
  | **3. Explicit Expected Record**      | PASS (High Standards) | FAIL (Implicit/Low)    | PASS (Contextual)      |
  | **4. Resist Transmission Selection** | PASS                  | FAIL (Sees as strength)| PASS (Studies effect)  |
  | **5. Absorbed vs. Corroborative**    | PASS                  | FAIL (Conflates)       | PASS (Seeks sources)   |
  | **6. Recalibration**                 | PASS                  | FAIL (Unnecessary)     | PASS (For method)      |
  | **7. Source Criticism**              | PASS (Rigorous)       | PASS (Selective)       | PASS (Essential)       |
  | **8. Plausibility as Filter**        | PASS (Strict)         | FAIL (Uses as proof)   | PASS (Contextual)      |
  | **9. Cautious Motive Arguments**     | PASS (Skeptical)      | FAIL (Overused)        | PASS (Contextual)      |

  **Summary:** Austere Evidentialism satisfies all core requirements but may be overly restrictive. The Generous Default fails core safeguards against false positives (1,4,5) and rigor (3,6,8,9). The Memory-First Approach satisfies methodological requirements (2,4,5,7,8,9) but explicitly rejects the fundamental goal of verifying historicity (failing 1,6) and redefines the purpose.
