prompt: |-
  My brother has been diagnosed as minimally conscious after a hypoxic brain injury, and the hospital where he is a patient is being asked to pilot a bedside consciousness monitor built on integrated information theory. Before our family advisory group takes a view on it, I want a specification rather than a pitch: what would a theory of consciousness have to deliver in order to be fit for this use — to underwrite a clinical judgment about whether a patient who cannot move or speak is having any experience at all?

  Give each requirement with the case or consideration behind it, and mark it non-negotiable or a preference of one camp. The ones I keep coming back to:

  - Level versus content, and wakefulness versus consciousness: it must do more than rank patients, and it must not treat the REM sleeper who is dreaming and the sleepwalker who is not as the same problem.
  - Grain, borders, and montage: the same recording rescored at a different spatial or temporal grain, or with a different electrode set, must not yield a different verdict; and the theory has to say where a system's boundary falls rather than letting it be drawn patient by patient.
  - The cerebellum-type case: a structure containing more neurons than the rest of the brain put together, which on the clinical picture as I understand it — congenital absence, focal lesions — perturbs coordination and cognitive timing rather than whether there is anything it is like for the patient, must not come out as the main seat of consciousness.
  - Hemispherectomy and split-brain: removing or disconnecting half the cortex leaves a conscious person behind, so a measure that tracks total integrated capacity has to say what has been lost and whether that loss is a difference in experience or only in a number.
  - Pharmacology: it must handle both drugs that abolish experience and drugs, like ketamine, that seem to abolish report while leaving experience intact — and it must not be moved by interventions that change signal complexity without changing what the subject undergoes.
  - The transfer problem: it will be calibrated on people who can report and used on people who cannot. Say what would have to be true for the calibration to carry over, and how a theory that is really only tracking the machinery of report could be caught doing so.
  - Computability and determinacy: a number from data a hospital can actually collect, with real noise, in minutes, with no free parameters tuned per patient.
  - Action-guidance: it has to license or forbid something we would not otherwise have done — a prognosis, an analgesic, a conversation at the bedside.

  Then the part I most want. Tell me which subset of these cannot be jointly satisfied, if any: my suspicion is that validation by report, applicability without report, and computability are not all available at once, and that the appearance of having all three comes from quietly substituting a proxy for the quantity. Say which single requirement excludes the most candidates, and flag any item on my list that is really a prejudice of one camp rather than a desideratum. Score IIT itself, global workspace theory, and higher-order theories in two or three lines each, but keep the weight on the requirements and their cases, not on the scorecard.
reasoning: |-
  Hmm, the user is asking about what requirements a theory of consciousness must meet to be clinically useful for assessing consciousness in non-communicative patients. They've shared a detailed list of concerns and want me to evaluate them systematically.

  This seems to be coming from someone deeply involved in a family advisory group for a minimally conscious patient. They're clearly knowledgeable about neuroscience concepts but need help structuring their evaluation framework. Their core concern is whether a bedside monitor built on IIT (Integrated Information Theory) can reliably detect conscious experience in patients who can't move or speak.

  Looking at their requirements list:
  - Level vs content distinction is crucial - the monitor must detect actual experience, not just arousal states
  - Measurement consistency across spatial/temporal scales is non-negotiable
  - The cerebellum case shows they understand clinical neurology - any theory must account for structures that don't generate consciousness
  - Hemispherectomy cases challenge theories that equate consciousness with total brain capacity
  - Pharmacology requirements show awareness of dissociations between experience and reportability
  - The transfer problem is perhaps the biggest challenge - validating measures in communicative patients then applying to non-communicative ones
  - Practical computability matters for clinical use
  - Action-guidance reveals they want this to actually change clinical decisions

  The user specifically wants to know which requirements conflict and which might exclude most theories. The transfer problem does seem fundamentally tricky - validating through subjective report while needing to assess those who can't report creates a circularity. Computability constraints might force oversimplification too.

  For theory assessments:
  - IIT struggles with cerebellum cases and computability
  - Global Workspace handles dissociation cases better but has boundary issues
  - Higher-Order theories struggle most with split-brain cases

  What they're really seeking is a rigorous framework to evaluate whether this pilot monitor can actually deliver what the hospital promises - detecting inner experience when outward signs are absent. The stakes are high as this could affect treatment decisions for their brother and others.
answer: |-
  Here’s a specification for a clinically viable consciousness theory, grounded in your cases and requirements. Each requirement includes its rationale and status (non-negotiable or preference), followed by conflicts, exclusivity analysis, and brief theory scores.

  ### Core Requirements & Rationale
  1. **Level vs. Content & Wakefulness vs. Consciousness**  
     - **Case**: REM sleep (conscious but paralyzed) vs. sleepwalking (aroused but unconscious).  
     - **Requirement**: Must distinguish *phenomenal consciousness* (subjective experience) from behavioral arousal or global brain activity.  
     - **Status**: **Non-negotiable**. Misclassification risks false negatives (e.g., locked-in syndrome) or false positives (e.g., unresponsive wakefulness).  

  2. **Grain, Borders, and Montage**  
     - **Case**: EEG montage/scaling variability altering diagnosis (e.g., "conscious" at 10 electrodes vs. "unconscious" at 20).  
     - **Requirement**: Invariance under reasonable spatial/temporal resolutions; objective boundary definition (e.g., cranial vault, not "patient-defined networks").  
     - **Status**: **Non-negotiable**. Ad hoc boundaries invite bias; montage-dependence undermines reliability.  

  3. **Cerebellum-Type Case**  
     - **Case**: Cerebellum (50B+ neurons) supports motor coordination, not core consciousness. Lesions alter timing, not experience.  
     - **Requirement**: Must not misattribute consciousness to non-contributing structures.  
     - **Status**: **Non-negotiable**. Failure invalidates the theory’s neural plausibility.  

  4. **Hemispherectomy & Split-Brain**  
     - **Case**: One functional hemisphere sustains consciousness; disconnection produces two streams (split-brain).  
     - **Requirement**: Must show diminished *content* (e.g., loss of visual field) without negating *presence* of experience. Cannot equate consciousness with total capacity.  
     - **Status**: **Non-negotiable**. Quantifying "less" consciousness ≠ "no" consciousness.  

  5. **Pharmacology**  
     - **Case**: Ketamine (experience without report) vs. propofol (abolished experience); muscle relaxants alter signals without affecting consciousness.  
     - **Requirement**: Must dissociate consciousness from (1) behavioral reportability and (2) signal complexity alone.  
     - **Status**: **Non-negotiable**. Central to detecting covert awareness.  

  6. **Transfer Problem**  
     - **Case**: Calibrating on healthy reporters, then applying to non-reporters.  
     - **Requirement**: Must demonstrate that the *neural correlates* of consciousness (NCCs) are identical regardless of output capacity. Must test for confounds (e.g., motor cortex inhibition masquerading as unconsciousness).  
     - **Status**: **Non-negotiable**. The core clinical challenge.  

  7. **Computability & Determinacy**  
     - **Case**: Bedside use with EEG/fNIRS in minutes, despite noise, without per-subject tuning.  
     - **Requirement**: Output must be a robust, parameter-free scalar (or discrete state) from noisy, sparse data.  
     - **Status**: **Preference** (practical necessity, but may constrain theoretical purity).  

  8. **Action-Guidance**  
     - **Case**: Changing clinical decisions (e.g., pain management, prognosis, communication attempts).  
     - **Requirement**: Must provide thresholds for presence/absence with defined confidence, linking to ethical/treatment frameworks.  
     - **Status**: **Non-negotiable**. Clinical utility depends on this.  

  ### Conflicts & Exclusivity
  - **Key Conflict**: **Transfer Problem + Computability + Pharmacology**.  
    - Validation requires report-based ground truth in calibration cohorts (*transfer problem*). But if the measure is tractable (*computability*), it may only track *report-relevant processing* (e.g., executive function), not experience itself. Pharmacology cases (e.g., ketamine) expose this: if the measure drops during ketamine due to disrupted report machinery, it falsely implies unconsciousness. True NCCs must be report-invariant, but computable measures often rely on proxies (e.g., complex responses to perturbation) that conflate mechanisms.  
    - **Result**: Most "consciousness monitors" (like Perturbational Complexity Index) risk measuring *cognitive access* rather than *phenomenal consciousness*.  

  - **Most Excluding Requirement**: **Transfer Problem**.  
    - It demands a theory that decouples consciousness from reportability. This excludes:  
      - Theories requiring behavioral output for validation (e.g., some global workspace models).  
      - Measures correlating with task performance but not raw experience (e.g., attention-based metrics).  
      - IIT’s "intrinsic cause-effect power" struggles here as it’s validated *indirectly* via report.  

  - **Potential Prejudice**: **Computability**.  
    - Insisting on a fast, noise-robust measure may reflect clinical pragmatism but could favor oversimplified models. Some argue consciousness is inherently high-dimensional and dynamic, resisting reduction to a single scalar.  

  ### Theory Scores (Fitness for Purpose)
  - **Integrated Information Theory (IIT)**:  
    **✓** Strong on borders, cerebellum, level/content.  
    **✗** Computability intractable (Φ requires simulating all partitions); transfer problem unproven; hemispherectomy predictions ambiguous.  

  - **Global Workspace Theory (GWT)**:  
    **✓** Computable proxies (e.g., broadcast complexity); handles pharmacology via access/ignition.  
    **✗** Borders fuzzy (workspace extent?); cerebellum may "participate"; transfer problem if access ≠ experience.  

  - **Higher-Order Theories (HOT)**:  
    **✓** Explains report-experience dissociation (e.g., ketamine disrupts metacognition).  
    **✗** Struggles with split-brain (two metacognitive systems?); cerebellum could theoretically support HO states; no agreed neural signature.  

  ### Bottom Line
  A clinically viable theory **must** pass the cerebellum, pharmacology, and split-brain cases to avoid false diagnoses. The **transfer problem** is the steepest hurdle: it demands a measure validated on report yet applicable without it, avoiding proxies for cognitive access. IIT’s current implementations (e.g., PCI) lean on such proxies, while GWT/HOT face their own validation gaps. **Computability constraints** likely force trade-offs that could mask unresolved theoretical issues. Prioritize validation in *behaviorally dissociated states* (e.g., REM sleep, ketamine) before trusting results in non-reporting patients.
