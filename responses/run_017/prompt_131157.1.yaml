prompt: |-
  You are advising a small research group — five philosophers, three years of funding, no empirical social science, and a mandate to produce work that is conceptually rigorous but also usable by people who actually allocate resources. The group's topic is moral progress understood on the expanding-circle picture: the view that moral concern has, over history, widened to take in beings it previously excluded, and that this widening is the central thing we mean by moral improvement.

  Before you can rank questions, I want you to work with three distinctions I have drawn myself, because I think the literature blurs them and the blurring distorts prioritization.

  First, distinguish inclusion from re-founding. Inclusion is growth on a standard that was already correct: new beings are recognized as falling under a moral principle whose validity is not itself at issue. Re-founding is replacement: the standard changes, so that what counted as a reason before no longer does, or a new kind of consideration becomes salient that was not merely overlooked but unavailable. Some candidate future expansions look like inclusion (granting standing to animals is arguably recognizing them under an existing principle about suffering). Others look like re-founding (environmental concern, or concern for artificial systems, may introduce considerations that are not further instances of anything previously recognized). Call the hard case axis proliferation: a new moral axis appears, and it is unclear whether we have widened a circle or added a dimension.

  Second, distinguish three framings the group could adopt: the descriptive question of what actually caused past expansions, the normative question of whether those expansions were improvements rather than mere changes, and the strategic question of whether anyone should try to cause further expansion deliberately. These are often run together, and I suspect they deserve very different amounts of the group's three years.

  Third, consider what I call the unaudited present. We treat certain past moral outlooks as straightforwardly mistaken, and we do so from the only standpoint we have. We have no procedure for ruling out that our own outlook occupies, relative to our successors, exactly the position we now assign to the past. This is not the familiar worry that progress might be an illusion; it is the narrower problem that our confidence in judging the past is systematically unsupported by the kind of evidence our successors might have about us.

  Given all that: what are the open questions here that most deserve this group's three years, and in what order? I want a defended agenda, not a survey of positions and not a canon of names. For each item, say what it is upstream of, whether it is tractable with conceptual tools alone in three years, whether it is neglected relative to its importance, and what kind of argument or result — arriving within the next two years — would move it up or down. Rank explicitly and tell me which items you are deliberately leaving out because their answers would not change anyone's behavior.

  Two further constraints on your answer. First, tell me which of the three framings should get the largest share of effort, and why; I expect you to argue against at least one of them being worth the group's time at all. Second, identify the single consideration or crux such that, if it were resolved one way rather than another, the group should reorganize the entire agenda — and say what that reorganization would look like.
reasoning: |-
  Okay, the user is advising a small research group of philosophers focused on moral progress as an expanding circle. They've laid out three key distinctions: inclusion vs. re-founding, three framings (descriptive, normative, strategic), and the "unaudited present" problem. The main task is to prioritize research questions for their three-year project.

  First, I need to unpack the user's distinctions. Inclusion means expanding existing moral principles to new beings, like applying the principle against suffering to animals. Re-founding involves changing the moral standards themselves, like introducing environmental concerns as a new axis. The proliferation problem deals with cases where it's unclear if we're expanding a circle or adding a new dimension. 

  The three framings are descriptive (what caused past expansions), normative (were they actually improvements), and strategic (should we push for future expansions). The user suspects these deserve different attention levels. The unaudited present highlights that our current moral confidence might be as flawed as past societies we judge, but this isn't about progress being an illusion—it's about lacking evidence for our own objectivity.

  The user wants a defended agenda with clear priorities. For each question, I should assess its upstream impact, tractability with conceptual tools, neglect level, and what could change its priority. They also want explicit ranking, justification for exclusions, which framing gets most focus, and a single crux that could reshape the agenda.

  Considering the group's constraints: five philosophers, three years, no empirical work, conceptual rigor required, and output must be usable by resource allocators. The mandate emphasizes practical usability, so purely theoretical questions might be lower priority. The user likely wants to avoid well-trodden debates and focus on gaps where conceptual clarity can influence real-world decisions.

  The strategic framing seems most aligned with usability—it directly addresses how to promote moral progress, which resource allocators care about. The descriptive framing might require empirical data they lack, and the normative might be less actionable. The unaudited present issue is crucial for intellectual humility but may not directly guide action.

  High-priority questions should tackle the proliferation problem since it's central to expanding-circle theory but underexplored. Figuring out if new concerns are inclusion or re-founding affects how we approach expansions. The strategic question of whether deliberate expansion is possible or desirable is also high-stakes—if it's impossible or counterproductive, it changes everything.

  For the crux, I think the key is whether moral progress can be driven deliberately. If resolved (e.g., evidence shows attempts backfire), the agenda shifts to understanding why and mitigating harm. If feasible, the focus turns to how.

  Lower-priority items include historical case studies (needs empirical work) and pure normative debates (less actionable). The unaudited present is important but might be addressed within higher-priority work.

  The top question should be the proliferation challenge—it's upstream of strategic decisions, tractable conceptually, neglected, and resolving it informs other priorities. If they make headway in two years, it validates the approach; if not, they pivot.
answer: |-
  Here is a prioritized research agenda, defended against your constraints and distinctions, with explicit ranking, exclusions, framing allocation, and a pivotal crux:

  **Core Allocation of Framing Effort:**  
  **Strategic framing (70%)** > Normative (25%) > Descriptive (5%)  
  *Why?* Strategic questions directly inform resource allocators (mandate alignment). Normative work anchors strategic advice but is more developed in philosophy. Descriptive work is deprioritized because: (1) It requires empirical methods your group lacks; (2) Past-expansion causes may not generalize to future/proliferation cases; (3) Resource allocators care about *what to do next*, not historical causality.  

  **Ranked Research Questions (3-Year Agenda):**  

  1. **Question:** *Under what conditions does introducing a new moral consideration (e.g., environmental systems, digital minds) constitute defensible "re-founding" vs. axis proliferation without normative grounding?*  
     - **Upstream of:** Strategic interventions (e.g., funding AI ethics vs. animal rights), policy design, resolving "unaudited present" anxiety.  
     - **Tractable?** Yes. Requires conceptual taxonomy: map types of "newness" (e.g., ontological novelty vs. epistemic oversight), criteria for normative legitimacy.  
     - **Neglected?** Critically. Literature fixates on circle-expansion cases (inclusion), not axis-creation.  
     - **Priority Shifter (2-yr mark):** If a testable framework distinguishing *justified re-founding* from *arbitrary proliferation* emerges → elevates. If all cases collapse into proliferation → downgrade.  
     *Output:* Decision protocol for resource allocators facing novel moral claimants.  

  2. **Question:** *Can deliberate moral expansion be non-coercive? If so, what institutional/pedagogical designs mitigate risks of elite imposition or backlash?*  
     - **Upstream of:** Funding NGOs, educational programs, tech governance.  
     - **Tractable?** Partially. Conceptual analysis of "coercion" in moral persuasion + institutional theory. Requires partnering with policymakers for usability testing.  
     - **Neglected?** Yes. Strategic literature focuses on effectiveness, not legitimacy.  
     - **Priority Shifter:** Empirical evidence of backlash against circle-expansion efforts → elevates urgently. Theoretical proof of impossibility → downgrade.  
     *Output:* Guidelines for "legitimate moral entrepreneurship" for foundations/states.  

  3. **Question:** *How does the "unaudited present" constrain our justification for pursuing expansions? Can we identify "meta-norms" likely to survive future auditing?*  
     - **Upstream of:** Confidence in strategic recommendations, prioritization of expansions.  
     - **Tractable?** Yes. Conceptual work on reflexive moral epistemology.  
     - **Neglected?** Moderately. Debated in metaethics, but rarely linked to progress strategies.  
     - **Priority Shifter:** Development of an audit-standard (e.g., "principles that pass reversibility tests") → elevates. If meta-norms appear as contingent as first-order norms → downgrade.  
     *Output:* Diagnostic for allocators: "Which current expansions have high survival probability?"  

  4. **Question:** *Are there asymmetries in justifiability between inclusion and re-founding? (e.g., Is re-founding inherently more demanding of evidence/consensus?)*  
     - **Upstream of:** Resource allocation to different expansion types (e.g., animal welfare vs. AI rights).  
     - **Tractable?** Highly. Conceptual analysis of justificatory burdens.  
     - **Neglected?** Severely. Treating both as "expansion" obscures differential risks.  
     - **Priority Shifter:** If re-founding consistently requires democratic ratification → elevates. If justificatory parity is proven → downgrade.  

  **Deliberate Exclusions & Why:**  
  - **Descriptive historical sociology of past expansions:** Requires empirical skills you lack; findings unlikely to change behavior in novel contexts (e.g., AI).  
  - **"Is progress real?" debates:** Intractable in 3 years; allocators must act regardless of metaphysical certainty.  
  - **Pure applied ethics (e.g., "Do octopuses merit rights?"):** Downstream; depends on prior answers to re-founding/inclusion.  

  **Pivotal Crux & Reorganization Trigger:**  
  - **The Crux:** *Can moral expansions be deliberately accelerated without exacerbating polarization or ideological fragmentation?*  
  - **Resolution Impact:**  
    - If **yes** → Agenda focuses on *how*: Refine Questions 1 & 2; add work on cultural transmission.  
    - If **no** → Radical pivot: Shift to damage control (Question 2), preserving existing moral gains, and preparing for "post-progress" stability.  

  **Defense of Ranking:**  
  The sequence flows from **defining the target** (Q1) → **designing interventions** (Q2) → **auditing our capacity** (Q3) → **calibrating effort** (Q4). Proliferation (Q1) is the urgent frontier; strategic actionability (Q2) meets the mandate; the unaudited present (Q3) guards against hubris; asymmetries (Q4) refine resource efficiency. Excluded questions fail the "change behavior" test for allocators. This balances rigor with usability while respecting your distinctions.
