prompt: |-
  hi — I write SF novels (the kind with a lot of argument in them, sorry) and I'm stuck on a chapter. There's a character, Marta, who has to write the expedition report on whether the locals count as thinkers at all, and I want her reasoning to be better than two cliches trading slogans. The creatures in my book are:

  the Shoal — a colony of about ten thousand small organisms. There is no single body whose states do anything. The patterns that would play the belief and desire roles only exist across the whole colony, and if you remove any one organism the pattern survives but reorganises.

  the mimics — behaviourally indistinguishable from us, internally nothing like us: same inputs, same outputs, different machinery, and on top of that the machinery that does the job on Tuesday isn't the machinery that does it on Thursday.

  the sleepers — internally full of the right states, causally wired to each other in all the right ways, but nothing downstream ever reaches behaviour. They never move differently because of what they believe.

  Marta's colleagues have two lines and I don't want her to just recite them. One says: same job, so same mind — which as far as I can tell collapses into saying a thermostat or a national economy has beliefs. The other says: no neurons, no mind — which my readers will see through in a paragraph.

  So what I actually want, before I write the scene, is the spec. Write me the list of requirements any theory of what-it-is-to-have-a-belief has to meet to be any good at cases like these. Cases it has to give a verdict on. Distinctions it isn't allowed to flatten — having a mind vs. having the same kind of mind we have; being in a state vs. that state being realised by something; the state vs. whatever plays the role; how fine-grained the job description gets to be; occurrent vs. merely dispositional. And the arguments it has to survive: the old one where it turns out every damn system realises some role or other (Putnam's, I think?), and the one about whether the realiser or the role is what does the causal work.

  For each requirement give me the case or consideration behind it, and mark which ones are non-negotiable and which are just what one camp happens to want. Then flag any pair of requirements I probably can't have both of — that's the bit I most want, because it gives me something for Marta to genuinely be stuck on rather than something she wins.

  If there's room at the end, a short scorecard for the obvious candidates: the it's-the-job-not-the-stuff view, the view that mental states are just brain states, and whatever the current version is where the science tells you what the realiser is and the folk theory only fixes the role. But keep the weight on the requirements, that's the part I can't get from a skim. And no reading list or footnotes — my character is on a planet without a library, and neither of us can look anything up.
reasoning: |-
  Okay, let me tackle this SF writer's problem. They're stuck on a chapter where character Marta needs to evaluate three alien species' cognitive status without resorting to clichés. The Shoal are distributed intelligences, Mimics are functionally identical but structurally variable, and Sleepers have internal states that never affect behavior. 

  I need to approach this systematically. First, the core challenge: defining belief-attribution criteria that handle these edge cases while avoiding philosophical pitfalls. The writer wants requirements that force tough trade-offs, not easy answers. 

  Looking at the cases:
  - Shoal challenges the "single body" assumption of cognition
  - Mimics question whether implementation matters if function is identical
  - Sleepers probe the necessity of behavior-output connection

  Key philosophical tensions to incorporate:
  - Role vs realizer (Putnam's multiple realizability vs identity theory)
  - Fine-grained vs coarse-grained functional descriptions
  - Dispositional states vs occurrent manifestations
  - Avoiding over-permissiveness (thermostat problem) vs under-permissiveness (neural chauvinism)

  For requirements, I'll consider:
  1. Behavioral equivalence - can't be sufficient alone (Sleepers problem)
  2. Internal structure - can't be necessary (Mimics challenge)
  3. Causal efficacy - tricky with Sleepers
  4. Organization persistence - relevant for Shoal
  5. Implementation independence - but needs limits
  6. Input-output sensitivity - avoids thermostat issue
  7. Counterfactual robustness - important for real cognition
  8. Cognitive integration - how states interact
  9. Grain sensitivity - description level matters
  10. Causal role primacy - but realizers matter too

  The tough trade-offs will be between:
  - Behavioral criteria vs internal richness
  - Implementation independence vs avoiding over-permissiveness
  - Causal efficacy requirements vs dispositional states

  For the scorecard:
  - Functionalism struggles with Sleepers and thermostats
  - Identity theory fails Mimics test
  - Mechanistic views need careful grain-setting

  The writer needs these tensions to create genuine dilemma for Marta. I'll structure it as hard requirements with conflict zones marked, then quick candidate evaluations. No jargon - Marta's planet has no philosophy textbooks!
answer: |-
  Here's a specification for a theory of belief attribution, designed to handle your edge cases and force difficult trade-offs. Marta would need a theory satisfying *most* of these, but likely not *all* simultaneously – that's where her struggle lies.

  **Core Requirements for a Theory of Belief Attribution:**

  1.  **Avoids Over-Permissiveness (Thermostat Problem):**
      *   **Requirement:** The theory MUST NOT attribute beliefs to systems that intuitively lack them (e.g., thermostats, national economies, simple lookup tables) *just* because they have some input-output correlation vaguely describable in belief-desire terms.
      *   **Case Behind It:** The Shoal, Mimics, and Sleepers are borderline; thermostats are clearly not. If the theory lets thermostats in, it's useless. This is **non-negotiable**.
      *   **Conflict Zone:** How to block thermostats without also blocking the Shoal or Mimics? Requires a richer notion of "job" than simple input-output mapping.

  2.  **Avoids Over-Restrictiveness (Neural Chauvinism):**
      *   **Requirement:** The theory MUST NOT *require* specific biological implementation (e.g., carbon-based neurons, wetware) for belief attribution.
      *   **Case Behind It:** Mimics explicitly have different (and changing) machinery; Shoal have no neurons at all. If the theory requires neurons, it fails these cases arbitrarily. This is **non-negotiable** for a theory applicable to aliens/AI.
      *   **Conflict Zone:** Avoiding neural chauvinism risks over-permissiveness (Requirement 1). How to define "sufficiently complex machinery" without begging the question?

  3.  **Requires Causal Efficacy (Sleeper Problem):**
      *   **Requirement:** Belief states MUST play a *causal role* in producing *relevant behavior* or other *cognitive states*. Merely having internal patterns isomorphic to belief descriptions isn't enough if they are causally inert.
      *   **Case Behind It:** Sleepers have the "right" internal states causally connected *to each other* but *not to behavior*. They fail. This distinguishes *having* a belief from merely *being describable as if* having one. **Non-negotiable** for distinguishing minds from inert models.
      *   **Conflict Zone:** How "downstream" must the effect be? Does influencing other *internal* cognitive states (planning, deliberation) count if behavior never changes? What if the behavior is subtle? (Shoal's reorganization might be the only "behavior").

  4.  **Requires Robustness/Resilience (Shoal Problem):**
      *   **Requirement:** The cognitive system MUST be able to *maintain* or *recover* its belief-like states/patterns in the face of minor perturbations or component failure/damage/replacement.
      *   **Case Behind It:** The Shoal survives the removal of an individual organism; its pattern reorganizes. This distinguishes a *systemic* cognitive state from a fragile arrangement. If it collapsed instantly, it wouldn't count. **Highly desirable**, arguably **non-negotiable** for systems not made of persistent individual units (like brains).
      *   **Conflict Zone:** How much perturbation is "minor"? What constitutes "recovery"? Does this requirement unfairly penalize very fragile systems that might still be cognitive?

  5.  **Allows Implementation Independence (Mimic Problem):**
      *   **Requirement:** The theory MUST be able to attribute the *same belief* to systems using *different physical substrates* or *internal algorithms* to achieve the *same functional role* within the cognitive system.
      *   **Case Behind It:** Mimics use different machinery on different days but produce the same intelligent behavior. They should be able to hold the *same belief* across these implementations. **Non-negotiable** for a functionalist theory.
      *   **Conflict Zone:** Requires defining the "same functional role" at a useful level of abstraction. Too coarse (Requirement 1 Problem), too fine (everything is unique). How does this interact with Requirement 4 (resilience might depend *on* implementation)?

  6.  **Requires Input/Output Sensitivity:**
      *   **Requirement:** The system's belief-like states MUST be *sensitive* to relevant inputs (perception, inference) and MUST *constrain* possible outputs (behavior, further thought) in a way that makes sense relative to the belief's content.
      *   **Case Behind It:** Blocks the "national economy" or "solar system" having beliefs – their "states" aren't sensitive to inputs like perceptions in a cognitive way, nor do they constrain outputs like actions. **Non-negotiable** for avoiding Requirement 1 failures.
      *   **Conflict Zone:** What counts as "relevant" input/output? How direct must the sensitivity/constraint be? (Sleeper's internal states might be sensitive to internal inputs but not external behavior).

  7.  **Requires Counterfactual Robustness:**
      *   **Requirement:** Belief attribution must depend not just on actual behavior, but on what the system *would* do *if* circumstances were different. Beliefs are dispositions, not just occurrent states.
      *   **Case Behind It:** A system that only *accidentally* produces belief-consistent behavior once shouldn't count. Beliefs imply a *range* of potential behaviors under varying conditions. **Highly desirable**, core to the *dispositional* nature of belief. Arguably **non-negotiable**.
      *   **Conflict Zone:** How do we *test* counterfactuals, especially for aliens? How rich must the disposition be? (Thermostats have *some* counterfactual sensitivity).

  8.  **Requires Cognitive Integration:**
      *   **Requirement:** Belief-like states MUST interact with *other* potential cognitive states (desires, perceptions, other beliefs, emotions) in a way that contributes to the overall coherence and adaptability of the system's behavior and internal processing.
      *   **Case Behind It:** Prevents isolated input-output pairs from counting as beliefs (e.g., a single "if-then" rule). Beliefs are part of a *web*. This helps block Requirement 1 failures and strengthens Requirement 3 & 6. **Highly desirable**, often seen as essential.
      *   **Conflict Zone:** How much integration is needed? Could a very simple system with minimal integration have *one* belief? (Probably not, but the boundary is fuzzy).

  9.  **Sensitive to Grain (Avoids Flattening):**
      *   **Requirement:** The theory MUST allow for distinctions between:
          *   Having *a mind* vs. having *a mind like ours*.
          *   A state *realizing* a belief role vs. the belief role *itself*.
          *   *Occurrent* (active) belief vs. *Dispositional* (stored) belief.
          *   Fine-grained (e.g., believing "it's a dangerous leopard") vs. coarse-grained (e.g., believing "it's a dangerous animal") content.
      *   **Case Behind It:** Essential nuance. Mimics/Shoal might have minds unlike ours; realizer vs role is the core functionalism debate; occurrent/dispositional is crucial for phenomenology and readiness; grain matters for interpreting alien concepts. **Non-negotiable** for a sophisticated theory.
      *   **Conflict Zone:** Making these distinctions operational within the theory is extremely hard, especially across radically different implementations.

  10. **Survives Putnam's Challenge (Multiple Realizability):**
      *   **Requirement:** The theory MUST acknowledge that the *same* belief role (functional profile) can be realized by *vastly different* physical substrates.
      *   **Case Behind It:** Putnam's point: minds aren't *necessarily* brains. Mimics are the direct case. **Non-negotiable** for a non-chauvinist theory.
      *   **Conflict Zone:** How to define "same role" robustly enough (Requirements 1, 6, 7, 8) without becoming vacuously permissive?

  11. **Addresses the Realizer/Role Causal Efficacy Problem:**
      *   **Requirement:** The theory MUST have a coherent account of *how* beliefs (as functional roles) cause behavior, given that the *physical realizer* is what physics interacts with.
      *   **Case Behind It:** The classic objection: "If the physical stuff does all the causal work (e.g., neuron firing, Mimic's Tuesday machinery), what causal work is left for the abstract 'belief role' to do?" **Crucial challenge** any viable theory must address.
      *   **Conflict Zone:** This pits functionalism (role is primary) against identity/mechanistic views (realizer is primary). Solutions (e.g., causal relevance at different levels, realization as causal powers) are philosophically fraught.

  **Key Inherent Tensions (Marta's Dilemmas):**

  *   **Avoiding Permissiveness (1) vs. Implementation Independence (5) & Multiple Realizability (10):** How to set the functional "job" description high enough to exclude thermostats but low enough to include radically different implementations like the Shoal and Mimics? This is THE core tension.
  *   **Causal Efficacy (3) & Input/Output Sensitivity (6) vs. Robustness/Resilience (4):** For the Shoal, removal *is* a perturbation. Its reorganization *is* its behavior. Does this satisfy "causing behavior"? Is reorganization "output"? How much internal change is allowed before the belief is lost? Sleepers fail 3 & 6 utterly.
  *   **Cognitive Integration (8) & Counterfactual Robustness (7) vs. Testing Limitations:** How can Marta *know* the Mimics' states are integrated or what they *would* do, especially with shifting internals? How can she know the *depth* of the Shoal's counterfactual dispositions? This is an epistemic nightmare for an expedition report.
  *   **Realizer/Role Causation (11) vs. Everything Else:** If the realizer does the work (e.g., the Mimic's Tuesday machinery), is attributing a "belief" just a useful fiction? But if the *role* is what matters causally, how does it *actually* push matter around? Marta needs a theory that doesn't make belief causally inert epiphenomena.

  **Quick Candidate Scorecard:**

  1.  **"It's the Job (Role), Not the Stuff (Realizer)" (Functionalism):**
      *   **Pros:** Aces Implementation Independence (5), Multiple Realizability (10), Mimics (probably), potentially Shoal. Allows Mind/Our-Mind distinction (9).
      *   **Cons:** Struggles **severely** with Over-Permissiveness (1) - Why not thermostats? Struggles with Sleeper Problem (3) - Internal role-playing without output might sneak in. Realizer/Role Causation (11) is its Achilles heel. Grain (9) is tricky. Robustness (4) depends on functional definition.

  2.  **"Mental States = Brain States" (Identity Theory/Neural Chauvinism):**
      *   **Pros:** Easily avoids Over-Permissiveness (1) - no thermostats! Clear on Realizer Causation (11) - neurons do it.
      *   **Cons:** Fails catastrophically on Over-Restrictiveness (2) & Multiple Realizability (10) - no minds for Mimics, Shoal, or any non-neural system. Fails Implementation Independence (5). Flattens distinctions (9).

  3.  **"Mechanistic View: Science Finds the Realizer, Folk Fixes the Role" (Modern Hybrid/Mechanistic):**
      *   **Pros:** Tries to synthesize. Uses science to constrain realizers (avoiding 1), but allows multiple mechanisms for same role (5, 10). Focuses on causal mechanisms satisfying the role.
      *   **Cons:** Risk of creeping chauvinism - science might bias towards known mechanisms (failing 2/10 for truly alien Shoal/Mimics). Defining the "folk role" precisely enough to guide science is hard (Grain 9). Sleeper Problem (3) might still bite if internal mechanisms satisfy the role causally but behavior is disconnected. Robustness (4) needs defining mechanistically. Realizer/Role (11) tension remains within the view.

  Marta's struggle is real. She needs a theory that threads the needle between 1 and 2, satisfies 3 (ruling out Sleepers), accommodates 4 and 5 (Shoal and Mimics), handles 6-10 with nuance, and offers a plausible answer to 11. **No existing theory does this cleanly.** Her report will likely involve identifying which requirements she prioritizes and which costs she's willing to accept, knowing her choices will have profound consequences for how these beings are treated. The tension between blocking thermostats while allowing the Shoal, and demanding causal efficacy for behavior while recognizing dispositional states, is where her genuine philosophical and narrative conflict lies. Good luck!
