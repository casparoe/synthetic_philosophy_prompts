prompt: |-
  I run a small reading group that's been working though self-locating belief, and everyone has already said there piece about the plain vanilla case, so I want something that pushes past it. Here's the setup I've been messing around with, and I want you to argue one side of it.

  Case A, the plain one. Fair coin on Sunday. Heads: Beauty is woken Monday and that's it. Tails: she's woken Monday and Tuesday, amnesia in between, no clock, no way to tell the days apart. On waking she's asked her credence in heads. Halfers say a half, thirders say a third, and we've heard all of that already.

  Case B, mine. Same coin, but now there are two people, Beauty and her understudy. Heads: Beauty is woken Monday, the understudy sleeps through the whole thing. Tails: Beauty is woken Monday and the understudy is woken Tuesday. When you wake up you genuinely can't tell which of the two you are — twins, no mirrors, the experimenter never uses either name — though both of you were told the protocol in advance and know it. If you knew you were Beauty you'd be at a half, since Beauty gets woken either way. If you knew you were the understudy you'd be at zero, since the understudy only ever wakes on tails. You're two-thirds sure you're Beauty, and that nets out at a third.

  Case C, also mine. Same as A except that on tails Beauty is woken Monday, then scanned overnight, and an exact duplicate of her is woken Tuesday in her place while the original sleeps on, with the duplicate put under for good at the end of Tuesday. Again you can't tell whether you're the original or the duplicate. Same arithmetic as B: a half if you knew you were the original, zero if you knew you were the duplicate, a third if you don't.

  What I want you to argue for: that A has to get the same answer as B and C, so a third, and that the halfer's way of parking A at a half is dead. In particular, don't let anyone get away with this reply — in B and C you're ignorant about *who* you are, which is a real lottery with a real chance of you never waking up at all, whereas in A Beauty was guaranteed in advance to be woken at least once whatever the coin did, so her being awake isn't news and she stays at a half. I need you to actually kill that move, not just give it a name. And whatever principle you use has to say something about the duplicate in C, who is in a tails world every single time and would still be answering a half if she reasoned like a halfer.

  Give me exactly five numbered points, one or two sentences each, no preamble and no summing up at the end. Keep it in plain language, no more than one line of arithmetic anywhere, and don't cite anybody — half the group hasn't read the literature and I want something I can read out loud.
reasoning: |-
  Okay, the user runs a reading group on self-locating beliefs and wants to move beyond the standard Sleeping Beauty problem. They've created variants (Cases B and C) and want me to argue that all cases (A, B, C) should get the same answer of 1/3, countering the halfer position. 

  Hmm, the key challenge is dismantling the halfer's defense that Beauty's awakening in Case A isn't "new evidence" since she knew she'd be woken regardless. The user specifically wants this rebutted without jargon, and to address the duplicate in Case C who'd be wrong to reason as a halfer.

  First, I need to establish equivalence between the cases. In B and C, the probability calculation is straightforward: uncertainty about identity directly forces P(Heads)=1/3. The real task is showing why A isn't different. 

  The halfer's "no news" argument fails because Beauty *does* gain information - she learns "it is now an awakening moment." In Heads, there's only one such moment; in Tails, there are two. So the awakening itself is evidence favoring Tails. 

  Crucially, in C, the duplicate absolutely should not assign P(Heads)=1/2. If they did, they'd be wrong 100% of the time since duplicates only exist in Tails worlds. This exposes the halfer position as incoherent when applied consistently.

  I'll structure five punchy points: (1) Equivalence of ignorance types, (2) Awakening as evidence, (3) Duplicate's epistemic failure, (4) Proportionality of awakenings, (5) No special status for "original." Must avoid math beyond simple fractions and keep each point to two sentences max.

  The user's clearly done their homework - they've preempted common objections and want airtight arguments. Their frustration with stale debates suggests I should avoid rehashing standard thirds vs. halfers and focus on their novel cases. The "read aloud" constraint means no nested logic or names like "Elga."
answer: |-
  Here are five numbered points arguing that A, B, and C must all get P(Heads) = 1/3:

  1.  **Ignorance is identical:** In all cases, your waking state gives you identical information: you know the coin might be heads or tails, but you lack any information distinguishing *which specific instance* of waking you are experiencing right now. This core ignorance forces the same calculation.
  2.  **Awakening *is* news:** Being awake *now* tells you "an awakening is happening." Since tails causes twice as many awakenings (Monday Beauty, or Monday Beauty/Tuesday understudy/duplicate) as heads does (only Monday Beauty), tails is twice as likely to be the reason you're awake.
  3.  **The duplicate proves halfing fails:** In C, the duplicate *only* exists and wakes if tails. If the duplicate reasoned "I'm awake, so P(Heads) = 1/2," they'd be wrong every single time they exist. This shows the halfer stance ignores the crucial evidence.
  4.  **Odds from your perspective:** From your uncertain viewpoint upon waking, there are three equally possible scenarios: (1) Heads & you're Beauty, (2) Tails & you're Beauty on Monday, (3) Tails & you're Understudy/Duplicate on Tuesday. Heads is true in only one of them.
  5.  **No special status for "original":** In C, the duplicate has the same memories and experiences as the original upon waking. There's no internal difference to justify the original assigning P(Heads) = 1/2 while the duplicate assigns P(Heads) = 0; both must assign the same probability given identical information.
