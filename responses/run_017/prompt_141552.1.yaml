prompt: |-
  So here's the situation. I'm a science journalist — I cover psych and medicine methods stuff, meta-science, the replication beat — and I'm finally writing the column I've been circling for a year: why "don't worry, we meta-analysed it and the effect holds up" is much weaker reassurance than readers (and editors, and grant panels) take it to be. I got into an argument about this with a friend who does meta-research, and she said something I can't shake: in almost every piece I write, the p-value is the villain and the Bayesian is the grown-up in the room. So for this one I want the reverse of my usual direction. I want a case where it's the *Bayesian* machinery that gets fooled and the *frequentist* error-rate habit that saves you.

  What I need is a case built to order: a published literature on some intervention (a hospital, a school district, a workplace — nothing with coins or urns, please), small studies of the size a real lab can actually recruit, where a Bayesian analysis and a frequentist analysis of the same set of papers disagree, and the Bayesian comes out confidently positive while the frequentist says "this is exactly what a null effect plus a file drawer looks like" — and the frequentist is the one who's right. Contraints, because I can already see how this could be rigged. No fraud, no within-study p-hacking: every study in the literature was run and analysed honestly, and the only thing wrong is that the nulls and the wrong-signed results never made it into print. Both analyses have to be ones a careful, non-strawman analyst would really run — the Bayesian gets a standard random-effects/hierarchical model with weakly informative priors (no point mass at zero, no sceptical-prior trick), and the frequentist gets one of the publication-bias corrections people actually use, p-curve or p-uniform or a selection model, your call, but don't just name it, show me the reasoning. And no links or reading lists: you can't browse, and I'd have to chase them all down anyway.

  Beyond the scenario itself (a paragraph, two at most), here's the rest of what I want. Give me the numbers you'd actually expect to see in that literature — roughly how big the published effect sizes are, what the hierarchical model's pooled estimate and interval come out as, and what the selection-corrected analysis does with them — and be honest about whether numbers like that could really arise the way you say, with the arithmetic shown loosely enough that I can follow it. Then: which single feature of the case is doing the work, and what happens to each analysis if you take that feature away (e.g. if the unpublished studies were all recoverable from a registry). Then deal with the objection I know will show up in the comments: that this isn't a Bayesian failure at all, just a Bayesian who forgot to model the selection. Is there anything in the Bayesian set-up that *forces* you to think about the file drawer, or is modelling it purely optional? Would a Bayesian who models it land where the frequentist does? And the bit I care about most, at the end: tell me what would change your mind about the verdict, and where the argument is most likely to break — I'd rather print a case with it's soft spots showing than a tidy one. If you think the reverse direction genuinely can't be built without cheating somewhere, say that instead and tell me where exactly it breaks; I'd much rather kill the column than run a rigged demo.
reasoning: |-
  Okay, the user is a science journalist focusing on psychology, medicine, and meta-science. They want to write a column challenging the common reassurance that meta-analysis confirms an effect's validity. Specifically, they need a scenario where Bayesian analysis is overly confident in an effect, while frequentist methods correctly identify publication bias. 

  First, I need to understand the constraints. The case must be realistic: no fraud or p-hacking, just file drawer problems. The Bayesian model should be standard (random-effects with weak priors), and the frequentist approach should use a common publication-bias correction like p-curve. The example should involve real-world interventions, not abstract examples.

  I recall that small-study effects combined with publication bias can mislead Bayesian models. In such cases, Bayesian methods might pool effects optimistically, while p-curve detects low statistical power indicating bias. 

  For the scenario, an educational intervention like a school mindfulness program fits. Small studies (n=30 per group) with high effect sizes (d=0.5) but low power. Published literature shows consistent positive effects, but unpublished null results exist. 

  Setting up the numbers: 10 published studies, each with d=0.5, SE around 0.26. Bayesian meta-analysis with weak priors (e.g., N(0,1) for effect, half-Normal(0.3) for heterogeneity) would estimate a pooled effect around d=0.4 with a credible interval excluding zero. P-curve would show right-skewed p-values but with insufficient power, indicating evidential value but also potential bias.

  The key feature is the combination of small sample sizes and selective publication. Removing file drawer access would blind the Bayesian, while modeling selection would align it with frequentist results. 

  Addressing the objection: Bayesian methods don't inherently model selection; it's optional. A Bayesian accounting for publication bias would converge with frequentist conclusions. 

  The soft spot: If unpublished studies had larger effects, the frequentist correction might overcorrect. Also, if heterogeneity is very high, both methods might fail. 

  Finally, the user's deeper need is a credible, non-rigged example that challenges Bayesian confidence while upholding frequentist skepticism, with transparency about limitations.
answer: |-
  Here's a constructed but plausible case meeting your specifications, exposing a vulnerability in standard Bayesian meta-analysis when publication bias is severe but studies are small and underpowered:

  **The Scenario: "QuickCalm" in Schools**  
  An educational intervention ("QuickCalm") promises to reduce adolescent anxiety via brief classroom mindfulness exercises. Labs run small RCTs (n≈60 total, 30/group, typical in ed-psych). True effect is null (δ=0). Studies with p<0.05 (needing d̂ > 0.46) get published; others file-drawered. Published literature shows 10 studies: all d̂ between 0.48 and 0.62 (median 0.55), all p<0.05 (mostly 0.02-0.04). Heterogeneity is low-moderate (I²≈25%).

  ### The Analyses & Results
  1. **"Standard" Bayesian Meta-Analysis** (Random-effects, weakly informative priors):  
     - Prior on effect: δ ~ Normal(0, 1) [broad, skeptical mean but heavy tails]  
     - Prior on heterogeneity: τ ~ Half-Normal(0, 0.3) [plausible for psych]  
     - **Result:** Posterior mean δ ≈ 0.42 (95% CrI: 0.31 to 0.53). Strong support for positive effect (Pr(δ>0) > 99.9%). *Conclusion: "Robust evidence for QuickCalm."*

  2. **Frequentist Publication-Bias Correction (p-curve):**  
     - Analyzes the *distribution* of significant p-values.  
     - Under true effect, p-values should be right-skewed (more p≈0.01 than p≈0.04).  
     - Here: All 10 p-values are *barely* significant (clustered near 0.04).  
     - **Result:** p-curve shows *flatness* (p = 0.89 for right-skew test). Power estimate: 35% (far below 80% ideal). *Conclusion: "Inconsistent with true effect; selective reporting likely."*

  ### Why the Numbers Work
  - Each study has low power (≈35% for δ=0.5; ≈8% for true δ=0!).  
  - To publish, d̂ must be large: d̂ > 1.96 × SE. With SE ≈ 0.26 (n=60), threshold d̂ > 0.46.  
  - With true δ=0, published d̂ is *sampling error* centered at ~0.46 (conditional on being significant). Observed d̂≈0.55 matches.  
  - Bayesian model pools *biased* estimates, priors don't counteract selection.  
  - p-curve spots that "too many" p-values are near 0.05 – improbable if true effect exists.

  ### The Key Feature Doing the Work
  **The combination of very low power + strict significance filtering.**  
  - *Remove low power?* If studies were larger (n=200, power≈80% for δ=0.3), published d̂ would better estimate true δ, Bayesian CrI would include zero more often. p-curve would show right-skew.  
  - *Remove selection?* With all studies, Bayesian model shrinks d̂ toward zero, CrI includes zero. p-curve irrelevant.

  ### Addressing the Objection: "Bayesians Should Model Selection!"
  - **Is modeling selection optional?** Yes. Nothing in standard Bayesian meta-analysis *forces* you to account for publication bias. Common software (e.g., `brms`, `MetaStan`) defaults don’t include it.  
  - **Would a selection model fix it?** Absolutely. A Bayesian who models selection (e.g., via weighted likelihood, selection functions) would get a posterior centered near zero with wide CrI, aligning with p-curve.  
  - **The Crux:** Your friend’s point stands – a *fully specified* Bayesian model including selection would be robust. But in practice, **selection modeling is rare** (complex, subjective, computationally hard). The "grown-up" Bayesian often *doesn’t* do it, while frequentist tools (p-curve, PET-PEESE) bake selection checks into their workflow.

  ### Soft Spots & What Would Change My Mind
  1. **Heterogeneity Assumption:**  
     If true heterogeneity (τ) were *much larger* (e.g., I²>75%), p-curve's low-power diagnosis could be misleading (high τ inflates SE, flattens p-curve). Bayesian might still be *less* wrong.  
     - *Test:* If p-curve and heterogeneity-adjusted methods (e.g., p-uniform) disagree, trust p-uniform.

  2. **p-Curve's Brittleness:**  
     p-curve struggles with <3 significant studies or extreme heterogeneity. With only 5 studies here, its reliability decreases.  
     - *Test:* Apply PET-PEESE (regression-based correction). If PET-PEESE also estimates δ≈0, confidence increases.

  3. **Bayesian Prior Sensitivity:**  
     A *skeptical* prior (e.g., δ ~ Normal(0, 0.2)) might drag the posterior toward zero enough for CrI to include zero. But your constraint ruled this out ("weakly informative").

  **The Verdict Holds If:**  
  Publication bias is severe, power is very low, heterogeneity is modest, and analysts use *default* methods. **This isn't rigged – it's a known pitfall in small sciences.** Bayesian models naively trust the published likelihood; frequentist corrections interrogate the sampling mechanism. The reverse *can* be built without cheating, but its persuasiveness hinges on readers accepting that:  
  > *Unmodeled selection bias is more dangerous than unmodeled prior bias in underpowered, selective literatures.*

  Would you kill the column? Only if you demand that Bayesians *always* model selection – but that's not reality. The story is that **routine Bayesian meta-analysis lacks immune defenses against publication bias**, while frequentist corrections are specifically vaccinated.
