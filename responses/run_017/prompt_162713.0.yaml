  - Updating by conditionalization on E then F (or F then E) leads to the same posterior (conditional on E∩F).
  - However, if we update by shifting confidence on E (i.e., changing the marginal probabilities of E while keeping the conditional distribution of H given each cell of E fixed) and then similarly on F, then the order matters.

  We want a setup that produces a large gap (so that it affects a rational decision) and that has a cover story.

