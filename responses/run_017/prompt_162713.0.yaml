answer: |-
  ### Run the Activity: Setup and Rules  
  **Cover Story**: You are a remote diagnostics team for the *Starship Calypso*. The ship's power system status (hypothesis **H**: **Good** or **Bad**) is monitored via two instruments:  
  - **Power Meter (Partition E)**: Reports "Normal" or "Abnormal".  
  - **Signal Analyzer (Partition F)**: Reports "Clear" or "Noisy".  

  A prior calibration dataset from 1,000 missions is provided (see **Materials**). Readings arrive as "shifts of confidence" on **E** or **F**, not as certain outcomes.  

  **Rules**:  
  - Split the class into **Group A** and **Group B** (8 pairs each).  
  - Both groups receive identical priors and two readings.  
  - **Group A** processes Reading 1 (Power Meter shift) then Reading 2 (Signal Analyzer shift).  
  - **Group B** processes Reading 1 (Signal Analyzer shift) then Reading 2 (Power Meter shift).  
  - Groups do **not** know the orders differ.  
  - Pairs compute:  
    - Final probability of **H = Good**.  
    - Recommended action: *No emergency* if P(Good) ≥ 0.4; *Emergency* otherwise.  
  - Use integer counts and rescale proportions (no Bayes' theorem).  

  ---

  ### Materials  
  **Prior Data (1,000 missions)**:  
  | Hypothesis (H) | Power Meter (E) | Signal Analyzer (F) | Count |  
  |----------------|-----------------|---------------------|-------|  
  | Good           | Normal          | Clear               | 432   |  
  | Good           | Normal          | Noisy               | 48    |  
  | Good           | Abnormal        | Clear               | 108   |  
  | Good           | Abnormal        | Noisy               | 12    |  
  | Bad            | Normal          | Clear               | 24    |  
  | Bad            | Normal          | Noisy               | 96    |  
  | Bad            | Abnormal        | Clear               | 56    |  
  | Bad            | Abnormal        | Noisy               | 224   |  

  **Handout Wording for Readings**:  
  - **Reading 1 (Power Meter Shift)**:  
    > *"After recalibration, the Power Meter indicates: P(Normal) = 0.9, P(Abnormal) = 0.1. Update your confidence in the Power Meter reading. Keep the mix of Hypotheses and Signal Analyzer results **within each Power Meter category** unchanged."*  
  - **Reading 2 (Signal Analyzer Shift)**:  
    > *"The Signal Analyzer now reads: P(Clear) = 0.1, P(Noisy) = 0.9. Update your confidence in the Signal Analyzer reading. Keep the mix of Hypotheses and Power Meter results **within each Signal Analyzer category** unchanged."*  

  **Answer Key for Facilitator**:  
  - **First Round (Certain Evidence)**: Both groups condition on **E=Normal** and **F=Noisy**:  
    - Counts: Good = 48, Bad = 96 → **P(Good) = 48/144 ≈ 0.333**. Action: *Emergency*.  
  - **Second Round (Uncertain Shifts)**:  
    - **Group A (E then F)**: P(Good) ≈ 0.339 → *Emergency*.  
    - **Group B (F then E)**: P(Good) ≈ 0.406 → *No emergency*.  
  - **Wrinkle**: The Signal Analyzer’s reliability depends on **H** (see counts: when **H=Bad**, F="Noisy" is more likely). This makes "holding the within-F mix fixed" questionable.  

  ---

  ### Payoff Scheme  
  - **Scoring Rule**: Quadratic scoring for P(Good). Truth (revealed post-activity): **H=Bad**.  
    - Score = 1 - 2 × (P(Good))² (strictly proper; range: -1 to 1).  
  - **Decision Threshold**: Fixed at P(Good) = 0.4.  
  - **Can Scoring Discriminate Orders?**  
    - **Single round**: Yes (truth is **Bad**). Scores:  
      - Group A (P=0.339): 1 - 2×(0.339)² ≈ **0.770**  
      - Group B (P=0.406): 1 - 2×(0.406)² ≈ **0.670**  
      - Gap is visible.  
    - **Repeated rounds**: Expected score difference is small (0.02–0.05 per round). To detect a significant gap (p<0.05), run ≥25 rounds. But **do not do this in class**—it dilutes the pedagogical point by focusing on averages, not the order-dependence shock.  

  ---

  ### Timeline (90 Minutes)  
  0–5 min: Introduce *Starship Calypso* scenario. Explain partitions (H, E, F) and prior counts.  
  5–20 min: **First Round (Certain Evidence)**:  
    - Both groups update on **E=Normal** then **F=Noisy** (or reverse).  
    - Groups report P(Good) ≈ 0.333. Action: *Emergency*. Highlight agreement.  
  20–60 min: **Second Round (Uncertain Shifts)**:  
    - Distribute handouts. **Group A** shifts E then F; **Group B** shifts F then E.  
    - Circulate, clarify: "Shift marginal, fix within-cell mix."  
  60–75 min: **Report Out**:  
    - Group A: P(Good) ≈ 0.33–0.34 → *Emergency*.  
    - Group B: P(Good) ≈ 0.40–0.41 → *No emergency*.  
    - Reveal truth (H=Bad) and scores.  
  75–90 min: **Debrief** (key points below).  

  ---

  ### Debrief: Formal Points  
  1. **Why Certain Evidence Commutes**:  
     - "In Round 1, you conditioned on **E∩F**. Order didn’t matter: P(H|E,F) = P(H|F,E)."  
  2. **Why Uncertain Shifts Diverge**:  
     - "Group A: After shifting **E**, the distribution of **F** changed. Shifting **F** then held fixed the **H|F** mix *in this distorted world*."  
     - "Group B: Did the reverse. The 'fixed mix' constraint applied to different intermediates."  
  3. **Refixing the Original Mix (Student Mistake)**:  
     - "If you ignored intermediate distortion and used the *prior* mix for the second shift, you’d get a third answer (e.g., P(Good) ≈ 0.37). But the rule forbids this."  
  4. **Hypothesis-Dependent Reliability Wrinkle**:  
     - "The Signal Analyzer’s reliability depends on **H** (see counts: P(F=Noisy|Bad) = 320/400 = 80%, but P(F=Noisy|Good) = 60/600 = 10%). Holding the within-**F** mix fixed assumes the shift is 'pure'—but if **H** affects the instrument, this is dubious!"  
  5. **Strong Student Objection & Redo**:  
     - **Objection**: "Readings should come as likelihoods, not posterior shifts!"  
     - **Facilitator Response**: "Redo Round 2 as virtual evidence:  
        - Power Meter shift → likelihood ratio 6:1 (Normal:Abnormal).  
        - Signal Analyzer shift → likelihood ratio 1:15 (Clear:Noisy).  
        - Update in either order → **same posterior** (P(Good) ≈ 0.125). Commutativity returns!"  
     - **Framing**: "Likelihood updates commute because they condition on new events. Shifts of confidence *don’t*—they’re constraints on marginals. Naming: This is **Jeffrey Conditioning**."  

  ---

  ### Predictable Problems & Solutions  
  1. **Mistakes in Scaling**:  
     - *Problem*: Pairs forget to rescale counts within cells.  
     - *Solution*: Check work early: "Show your counts after step 1."  
  2. **Conditioning Fallacy**:  
     - *Problem*: Using Bayes’ theorem (e.g., treating shift as likelihood).  
     - *Solution*: Intervene: "Reread: You’re *shifting* the marginal, not conditioning."  
  3. **Early Finishers Contaminate**:  
     - *Problem*: A pair finishes and shares with neighbors.  
     - *Solution*: Assign "sanity checks": "Compute the marginal for F after step 1" (Group A) or "Compute marginal for E after step 1" (Group B).  
  4. **Objections Derailing Arithmetic**:  
     - *Problem*: "Why fix the mix? This feels arbitrary!"  
     - *Solution*: "Note the objection for debrief; proceed as instructed."  

  ---

  ### What the Activity Cannot Reproduce  
  1. **Why Hold Within-Cell Mix Fixed?**  
     - You must explain: Jeffrey conditioning assumes the *causal independence* of the shift mechanism. If the shift in **E** arises from a process independent of **H** and **F**, fixing the mix is justified. Here, the wrinkle violates this.  
  2. **Why Update at All?**  
     - The activity shows order-dependence, but doesn’t justify updating versus scoring-only. Argue: "Coherence demands we update beliefs to avoid Dutch books, but Jeffrey conditioning is one of many non-Bayes options."  
  3. **Generalizing Beyond Partitions**:  
     - The activity uses partitions, but Jeffrey conditioning extends to continuous variables. Mention: "The core idea—kinematic updates—applies to any coarse-graining."  

  ---  
  **Final Note**: This activity creates a visceral experience of order-dependence. Save the name "Jeffrey Conditioning" for the debrief to avoid priming. Use the staggering gap (action flip) to motivate the formalism.
