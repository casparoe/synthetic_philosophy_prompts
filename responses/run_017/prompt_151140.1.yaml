prompt: |-
  Hey — I'm on the incident review board at the company I work for. We run a couple hundred autonomous sidewalk delivery robots, plus a dispatcher model that reassigns jobs between them, plus a small remote-ops team that can step in. When something goes wrong — a robot clips a cyclist, blocks a wheelchair ramp for forty minutes, a dog gets a paw caught — we meet within 48 hours and have to come out with three things: whether anyone gets a written warning, retraining, or gets pulled off remote ops; what goes in the report that a regulator may read; and what we say to the person who was harmed. Right now we basically wing it, and it collapses into one of two failure modes: we blame the remote operator because they're the only human visibly in the loop, or we shrug and say the system did it.

  I've read a fair amount of the philosophy on responsibility gaps and I don't need a literature overview and I don't want any citations or reading suggestions. What I need is a procedure.

  Give me a decision procedure we can actually run in a 90-minute meeting with people who have never done philosophy, ending in one of a small fixed set of verdicts. I want the questions in a fixed order: cheap factual questions first that knock out the easy cases fast, the expensive and contested ones later. For each question tell me what counts as a sufficient answer, what evidence we'd need to have to answer it at all, and where the procedure should just stop rather than push on.

  The distinctions I want built into it — I've got my own names for some, rename them if you have better ones:

  - causal vs epistemic vs attributability gap: no human was suitably connected to the outcome / we can't establish who was / someone was connected but blaming them would be unfair. Keep these apart, because they call for totally different responses, and I suspect we currently collapse the middle one into the first because it's less awkward to write down.
  - the swap test: if we dropped a different, reasonably trained person into that role on that day, would they have done the same thing? If yes, whatever we're doing isn't giving anyone an incentive — it's doing something else. Name what it's doing and give me a non-blame response instead.
  - the update obligation: after the first weak signals, did anyone have a duty to pull the behaviour or retrain the model? I think this is where most of our "someone is responsible after all" verdicts secretly come from, and I want it as its own node rather than smuggled into "was it foreseeable."
  - the crumple check: is the person we're about to blame actually the one who could have prevented this, or just the most visible one sitting nearest the failure? I want a concrete test here, not a vibe.
  - the retribution check: seperately from what blame is warranted, how much will the person harmed and the public want to hand out? If those come apart, that's a design and communications problem, not a blaming problem, and the procedure should route it somewhere else entirely.
  - a no-blame-but-not-no-response verdict, with what it actually obliges us to do — repair, apology, design change, audit — so it doesn't decay into the shrug.

  Also: mark clearly where the procedure can't settle something and a human just has to make a values call. I'd rather those be flagged than hidden inside a test that looks objective. And give me a section on how we ourselves could game this: I can already see one version where "no suitable agent" becomes the default finding and everybody quietly walks, and another where we find a scapegoat in ten minutes because the first question on the sheet is "who was nearest the system."

  Then run it on three cases:

  1. A remote operator had three robots in the attention queue, ignored a low-confidence obstacle alert for about ninety seconds, and the robot mounted a kerb and fractured a pedestrian's ankle. Alerts of exactly this type had fired forty times before and been dismissed every single time without review.
  2. After a firmware rollout, a couple dozen robots started hugging the building wall on one particular street. Nobody on the team had seen this failure mode in simulation or in the wild. A blind pedestrian got pinned between a robot and a wall for roughly a minute. There were three earlier customer complaints about robots acting weird near that corner, closed as duplicates.
  3. A dog got its paw caught in a wheel well. Nobody foresaw it, nobody plausibly could have, and there's no design change that obviously prevents it without making the robot useless. The owner is furious and wants someone fired. My guess is this one is a genuine gap — I want to see what your procedure says we owe them and, just as much, what it says we don't.

  Constraints: ninety minutes, ops lead running it off a checklist, and no philosophy vocabulary in the output itself, because the rationale goes into a document a regulator might read. Every verdict needs a one-paragraph written rationale we could defend out loud. Assume nothing about what our lawyers will say — I want the moral version first and we can bolt the legal layer on later.
reasoning: |-
  Alright, the user is part of an incident review board for a company that operates autonomous delivery robots. They need a practical decision procedure to handle incidents efficiently within 90-minute meetings. The current approach often results in either blaming the remote operator or attributing the issue to the system without clear accountability. They want a structured process that avoids these pitfalls and includes specific checks like the swap test and update obligation.

  First, I need to understand their key requirements. They mentioned distinct gaps: causal, epistemic, and attributability. The procedure must separate these to ensure appropriate responses. Also, they want to prevent scapegoating and ensure that blame is only assigned when it's fair and effective. The output needs to be accessible to non-philosophers, with no jargon, and each verdict must have a defensible rationale.

  The user provided three test cases. Let me break them down to see how the procedure applies:
  1. **Case 1**: Remote operator ignored an alert. Past similar alerts were dismissed. Here, the update obligation is crucial. The team knew about the alerts but didn't act. The swap test might show that others would ignore it too, pointing to a systemic issue.
  2. **Case 2**: Firmware issue with isolated complaints treated as duplicates. The crumple check is key here. Who could have connected the dots? The complaints weren't reviewed properly, so the process failed, not an individual.
  3. **Case 3**: Unforeseeable dog incident. No prior signals, so no update obligation. Causal gap likely, leading to no-blame but necessary responses like repair and apology.

  Now, structuring the procedure. Start with cheap factual questions to resolve easy cases quickly. For instance, verifying if a human was involved or if there's immediate evidence of negligence. Then move to more complex checks like the swap test and update obligation. 

  I should ensure that each question has clear criteria for evidence and stopping points. For example, if there's no human intervention possible (causal gap), stop and proceed to no-blame responses. The swap test requires operator logs or training data to assess if others would act similarly. 

  The no-blame verdict needs specific actions: apology, compensation, design audits. This prevents it from becoming a shrug. Also, the retribution check separates public desire for blame from actual responsibility, routing it to PR or legal.

  Potential gaming: If the first question is "who was nearest," it might lead to quick scapegoating. To avoid this, place system-level checks early. Also, "no suitable agent" shouldn't be a default; require evidence of systemic review. 

  For the test cases:
  - **Case 1**: Update obligation applies due to repeated alerts. Verdict: organizational retraining needed.
  - **Case 2**: Epistemic gap from mishandled complaints. Verdict: process change, not individual blame.
  - **Case 3**: Causal gap. No-blame, but offer repair and apology, explain design limits.

  The procedure must fit in 90 minutes, so each step should have time limits. Contested questions like foreseeability might require a vote if unresolved. Finally, rationales should be clear and jargon-free for regulators.
answer: |-
  Here’s a concrete, time-boxed decision procedure designed for 90-minute incident reviews. It uses plain language, fixed verdicts, and sequences questions to resolve easy cases early. **Verdict options** are:  
  - **Operator Actionable** (written warning/retraining/removal)  
  - **Organizational Actionable** (process/design/training changes)  
  - **No-Blame But Respond** (repair/apology/system change)  
  - **Genuine Gap** (no reasonable prevention possible; focus on restitution)  

  ---

  ### **Procedure: Incident Accountability Flow**  
  **Runtime:** Strict 90 mins (assign time per section; skip later steps if early verdict)  
  **Roles:** Ops Lead (facilitator), Tech Lead, Human Factors Lead, Customer Rep  
  **Output:** 1 verdict + 1-paragraph rationale for regulators/public.  

  #### **Phase 1: Immediate Facts (15 mins)**  
  *Goal: Resolve clear-cut cases or flag gaps.*  
  1. **"Was any human actively controlling the robot at the time of the incident?"**  
     - *Evidence:* Operator logs, sensor data.  
     - *Sufficient answer:* Yes/no + timestamp.  
     - *If no → Jump to Phase 3 (causal gap likely).*  
     - *If yes → Proceed to Phase 2.*  

  2. **"Was the operator following documented procedures?"**  
     - *Evidence:* Playbook vs. action log.  
     - *Sufficient answer:* Yes/no + specific deviation.  
     - *If yes → Verdict likely **No-Blame But Respond** (system failed human). Stop unless new evidence.*  

  #### **Phase 2: Operator Scrutiny (20 mins)**  
  *Goal: Assess if blame fairly attaches to the operator.*  
  3. **"Could a different trained operator reasonably have avoided this?" (Swap Test)**  
     - *Evidence:* Training records, alert history, simulator results.  
     - *Sufficient answer:* "No, because [e.g., alerts were unreliable/overload was systemic]."  
     - *If no → Verdict **Organizational Actionable**. Stop.*  
     - *If yes → Proceed.*  

  4. **"Was the operator the *only* person who could have prevented this?" (Crumple Check)**  
     - *Evidence:* Team staffing, escalation paths, system redundancies.  
     - *Sufficient answer:* "No, because [e.g., alert fatigue was known but staffing not adjusted]."  
     - *If no → Shift focus to Phase 3 (org failure).*  
     - *If yes → Proceed to Phase 4.*  

  #### **Phase 3: System & Organizational Checks (25 mins)**  
  *Goal: Find gaps in processes/design.*  
  5. **"After early signals, did we have a duty to update/retrain/recall?" (Update Obligation)**  
     - *Evidence:* Prior complaints, testing logs, internal warnings.  
     - *Sufficient answer:* "Yes, because [e.g., similar alerts occurred >X times]."  
     - *If yes → Verdict **Organizational Actionable**. Stop.*  

  6. **"Could we determine who owned the risk *before* the incident?" (Epistemic Gap)**  
     - *Evidence:* Clear ownership in playbooks, audit trails.  
     - *Sufficient answer:* "No, because [e.g., complaints weren’t routed to engineering]."  
     - *If no → Verdict **Organizational Actionable** (fix ownership). Stop.*  

  #### **Phase 4: Final Checks (15 mins)**  
  7. **"Is there *any* human we can fairly blame without hindsight?" (Attributability)**  
     - *Evidence:* Phase 1–3 outputs.  
     - *Values call required:* If all checks point away from individuals → **No-Blame But Respond** or **Genuine Gap**.  

  8. **"How much will the public/person harmed demand blame?" (Retribution Check)**  
     - *Not for verdict:* Route this to PR/legal. Document separately.  

  #### **Phase 5: Verdict & Actions (15 mins)**  
  | Verdict                | Obligations                                                                 | Rationale Structure (for regulators)                                                                 |
  |------------------------|-----------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
  | **Operator Actionable** | Written warning/retraining/removal.                                         | "Operator X deviated from procedure Y when they could reasonably have avoided harm by doing Z."      |
  | **Organizational Actionable** | Fix process/training/design. Audit for similar risks.                     | "Our system failed to [e.g., route alerts] despite [evidence], allowing a preventable error."        |
  | **No-Blame But Respond** | Repair/apology/compensation. *Plus* design change or audit.               | "While no individual caused this, our system fell short. We apologize and are changing [specifics]." |
  | **Genuine Gap**         | Restitution (medical bills/replacement). Explain limits of technology.      | "This was unforeseeable and unpreventable with current tech. We regret the harm and have [restitution]." |  

  ---

  ### **Anti-Gaming Safeguards**  
  - **Scapegoating risk:** Phase 1 Q1 avoids "who was nearest?" by starting with *whether* human control existed. Crumple Check (Q4) explicitly blocks blaming "visible" humans.  
  - **"Gap" overuse:** Update Obligation (Q5) forces engagement with prior signals. Genuine Gap verdict requires unanimous agreement.  
  - **Vibe masking:** Each question requires *evidence citations*. If inconclusive, default to **No-Blame But Respond**.  

  ---

  ### **Test Case Runs**  
  **Case 1: Operator ignored alert, 40 prior dismissals**  
  - **Phase 1:** Human was active (yes). Followed procedure? (No—ignored alert).  
  - **Phase 2:** Swap test—Would others ignore it? (Yes—alerts were chronic false positives). Crumple check—Could others have prevented? (Yes—team leads knew alerts were broken).  
  - **Phase 3:** Update obligation—Yes (40 prior alerts).  
  - **Verdict: Organizational Actionable** (retrain alert system; audit response thresholds).  
  - **Rationale:** "Chronic false alarms undermined alert credibility. We failed to fix this known flaw, leading operators to dismiss a valid warning. No operator discipline; we are recalibrating alerts."  

  **Case 2: Firmware bug, complaints marked as duplicates**  
  - **Phase 1:** No human control at time → Jump to Phase 3.  
  - **Phase 3:** Update obligation—Yes (complaints existed but weren’t analyzed). Epistemic gap—Yes (no owner for "weird behavior" reports).  
  - **Verdict: Organizational Actionable** (revise complaint triage; add firmware rollback protocol).  
  - **Rationale:** "Complaints about robot behavior were misclassified as duplicates, delaying detection of a firmware flaw. We are improving incident review protocols to catch emerging patterns."  

  **Case 3: Dog paw caught, unforeseeable**  
  - **Phase 1:** No human control → Phase 3.  
  - **Phase 3:** Update obligation? (No—no prior signals). Epistemic gap? (N/A—no ambiguity).  
  - **Phase 4:** Attributability? (No fair blame). Retribution check: (High—route to PR).  
  - **Verdict: Genuine Gap**  
  - **Obligations:** Cover vet bills; apologize; explain design limits publicly. *No design change* (per constraints).  
  - **Rationale:** "This incident was unforeseeable with current technology and outside our design parameters. We deeply regret the harm and have compensated the owner, but no preventable failure occurred."  

  ---

  ### **Where Values Calls Hide**  
  - **Update Obligation (Q5):** "Duty to act" hinges on interpreting "reasonable" signal thresholds (e.g., 3 complaints vs. 10). *Fix:* Set predefined thresholds pre-incident.  
  - **Attributability (Q7):** "Fair blame" requires judging if punishment improves future behavior. *Fix:* Default to no blame if split vote.  
  - **Genuine Gap:** "Unforeseeable" is subjective. *Fix:* Require engineering sign-off.  

  This procedure forces systematic review, blocks scapegoating, and mandates *actions* even for no-blame outcomes. Rationales are defensible without philosophy terms. Run it as a facilitated checklist with strict timekeeping.
