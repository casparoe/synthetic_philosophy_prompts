  For example, if the patch says: "when we upgrade to a new version, we trust its proofs because it was built from us", that is unsafe because the new version might have introduced a bug.

  Therefore:
  - If the patch changes the way successor actions are verified, we require that the verification still uses the current theory and the current verifier, not the successor's theory or verifier.

  If it fails: Block if the patch explicitly adds such trust. Otherwise, if it is unclear, escalate.

  What this step can't catch: Subtle ways in which the modified system might become less trustworthy over time (e.g., by accumulating theory extensions that we have approved but that might be inconsistent in combination).

  Step 5: Check for unintended interactions with other components.
  Question: Could this patch interact with existing features in a way that might cause a violation of the above? (This is a catch-all.)
  Sufficient answer: The patch does not interact with other features in a way that causes concern. We rely on the board's understanding of the system.

  If we are unsure, we escalate.

