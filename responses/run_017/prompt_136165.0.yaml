  Below is a comprehensive safety review checklist for Marrow patches, designed for engineers with basic logic training. The checklist prioritizes critical safety issues first, with clear escalation points for value judgments. It includes known limitations and is applied to the three example patches.

  ### **Safety Review Checklist for Marrow Patches**

  | step_number | question_to_ask                                                                 | sufficient_answer                                                                                                 | if_it_fails                              | what_this_step_cant_catch                                                                 |
  |-------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|------------------------------------------|-------------------------------------------------------------------------------------------|
  | 1           | Does the patch directly add an inference rule/axiom allowing unrestricted use of "Prov(φ) → φ"? | No.                                                                                                             | **Block**                                | Rule variants that indirectly achieve the same collapse (e.g., through auxiliary theories). |
  | 2           | Does the patch change the base theory (T) by adding new axioms or rules?         | New elements are either:<br>- Theorems of T, or<br>- Consistency statements (e.g., Con(S) for subtheory S), or<br>- Board-approved in a values call. | Block (if unsafe) / **Escalate** (otherwise) | Interactions between new axioms/theory extensions that create subtle inconsistencies.      |
  | 3           | Does the patch alter the verifier (e.g., caching, optimization)?                 | Changes:<br>- Do not accept unproven statements,<br>- Cache: Only stores closed theorems, cleared on theory change,<br>- Optimizations: Do not skip essential checks. | Block (if unsafe) / **Escalate** (otherwise) | Cache/optimization bugs introducing false positives (e.g., race conditions).             |
  | 4           | Does the patch allow trusting successor versions of Marrow without proof?        | No. All actions (including successors’) require proofs in the current theory.                                   | **Block**                                | Drift in "trustworthiness" after many theory extensions.                                 |
  | 5           | Are there risks of unsafe interactions with existing components?                 | No identified risks.                                                                                             | **Escalate**                             | Emergent unsoundness from combined patches (e.g., cache + theory extension).            |

  #### **Key:**
  - **Block**: Reject the patch immediately.
  - **Escalate**: Requires board discussion for values-based judgment (non-automatable).
  - **Allow_with_condition**: Approve only if specific safeguards are added.

  ---

  ### **Patch Evaluations (JSON Format)**

  ```json
