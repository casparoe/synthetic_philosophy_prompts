  ---

  ### **Explanation of Key Judgments**
  1. **Patch B (Con(T))** requires a values call because:
     - **Benefit**: Enables proving new theorems (e.g., "Marrow v2 is sound").
     - **Risk**: If T is inconsistent, Con(T) is false, and Marrow acts on garbage proofs.
     - **Board’s call**: Weigh operational needs against philosophical risk.

  2. **Patch C (Cache)** is conditionally safe but has hidden pitfalls:
     - **Misfire**: If the cache isn’t cleared when T changes, Marrow reuses theorems that are invalid in the new theory (e.g., after a Patch B-style update).
     - **Silent trust shift**: The cache assumes past proofs are trustworthy—a value judgment about Marrow’s historical integrity.

  ### **Checklist Limitations**
  - **False positives (safe patches blocked)**: Bounded reflection rules (Step 2) or harmless verifier tweaks (Step 3) may be escalated unnecessarily.
  - **False negatives (unsafe patches allowed)**: A cache that only clears on "major" theory changes (Step 3) might miss minor extensions, or a theory patch might add subtly inconsistent axioms (Step 2).
  - **Human factors**: Board may misjudge "safe" axioms (Step 2) or underestimate cache edge cases (Step 3).
