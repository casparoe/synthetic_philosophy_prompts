prompt: |-
  I'm on the safety review board at a small lab. We have a planner ("Marrow") that isn't allowed to affect the world unless it first produces a machine-checked proof, in its own theory T, that the action is ok. Every couple of weeks someone proposes a change to Marrow's reasoning stack — a new inference rule, a stronger theory, a faster verifier, a cache — and we recieve it and have to say yes or no. We're engineers who took one logic class, not proof theorists; we get an afternoon per patch and three of us have to sign. If we say yes to the wrong thing the agent acts on a fake proof; if we say no to everything it can never improve itself.

  The worry is the Löbian one: T can't prove its own soundness, so Marrow can't prove that proofs produced by a modified version of itself mean anything, and if we just let it accept "I'm sound because I say so" we've deleted the whole reason we required proofs. (We know the theorem itself: if T proves Prov(φ)→φ then T proves φ, so an unrestricted "from a proof that φ is provable, infer φ" rule collapses everything.)

  What I want is a written procedure we can run on a patch. Concretely: the questions in order; what counts as a good enough answer to each given we can't do proof theory; the points where the answer is an automatic no; and the points where it has to stop and hand us a values call rather than pretending to be a fact — I think "which theory do we trust, and how much unsoundness risk do we accept" is one of those, and I suspect "is the patched thing still Marrow" is another. These two seem seperate and I don't know which order to take them in. Be honest about where the checklist will misfire: patches that are safe but look scary, and patches that look like plumbing but quietly move the trust boundary.

  Run it on three patches:

  A) add the rule "from a proof that φ is provable, conclude φ", with no restriction on φ.
  B) move from T to T plus Con(T) — let Marrow use the fact that its old theory is consistent, and check its successors' proofs in the new theory.
  C) the proof cache we shipped six months ago and everyone loves: it stores every theorem it has already proved as an axiom and skips re-verification. I want the procedure's answer even if it tells us to unship it.

  Give me the checklist as a table with columns: step_number | question_to_ask | sufficient_answer | if_it_fails (block / escalate / allow_with_condition) | what_this_step_cant_catch. Then a JSON object with one entry per patch, fields: patch_id, steps_triggered, verdict, reason_in_plain_english, judgment_calls_the_board_must_make, would_change_verdict_if. Plus top-level arrays assumptions_you_made and known_misfires.
reasoning: |-
  We are designing a safety review checklist for patches to Marrow, a planner that requires machine-checked proofs of safety in its own theory T before acting. The goal is to prevent unsoundness while allowing beneficial improvements. The checklist must be runnable by engineers with basic logic training, taking about an afternoon per patch.

  Key concerns:
  1. Löbian obstacles: T cannot prove its own soundness, so we must avoid rules that allow "bootstrapping" soundness from nothing.
  2. We must avoid collapsing the theory (as with patch A: adding the rule "from a proof that φ is provable, conclude φ" without restriction).
  3. We must manage the evolution of the theory (as with patch B: adding Con(T)).
  4. We must be cautious about optimizations that might break the trust chain (as with patch C: a proof cache that stores proven theorems as axioms).

  The checklist should ask questions in order, with clear criteria for each step. Steps can result in:
  - Block: Reject the patch.
  - Escalate: Require a values call (non-technical judgment by the board).
  - Allow with condition: Approve but with specific constraints.

  We also note what the step cannot catch.

  We will then apply the checklist to the three example patches.

  Assumptions:
  - The current system (unpatched) is considered safe and sound for the purposes of this review. We are only evaluating the change.
  - The theory T is consistent (otherwise everything is provable and the system is broken already).
  - The verifier is correct for the theory it is designed for (we are not considering verifier bugs unless the patch changes the verifier).
  - The board has the ability to read and understand basic changes to the inference rules and theory, but not to do deep proof theory.

  Known misfires (limitations of the checklist):
  - May block safe patches that use advanced proof techniques that are sound but look like they might violate the criteria.
  - May allow patches that exploit subtle loopholes in the criteria (e.g., by using a theory that is not obviously unsound but becomes so in combination with other features).
  - Cannot catch logical errors that are beyond the board's understanding (but we design to minimize this by simplicity).

  Checklist Design:

  We structure the checklist as a series of steps. The steps are ordered to catch the most dangerous problems first.

  Step 1: Check for explicit Löbian collapse.
  Question: Does the patch add a rule or axiom that would allow the system to infer φ from a proof that φ is provable in T (or any theory that includes T), without any restriction on φ?
  Sufficient answer: No. If the patch does not add such a rule or axiom, we pass. If it does, then we must block unless there is a clear restriction that prevents φ from being a statement about the system's own soundness? But note: the Löb's theorem tells us that any such rule without restriction will collapse the theory. So we block.
  If it fails: Block.
  What this step can't catch: It only catches explicit rules of that form. It might miss more subtle ways to achieve the same effect.

  Step 2: Check for changes to the theory (the set of axioms and inference rules) that might introduce new inconsistencies.
  Question: Does the patch extend the theory (e.g., by adding new axioms or rules) beyond the current T?
  Sufficient answer: If it does not extend the theory, then pass. If it does, then we require that the extension is conservative over T (i.e., for sentences in the language of T, the new theory only proves what T did) OR that the extension is a known safe extension (like adding Con(T) under controlled conditions). However, we cannot easily check conservativeness. Instead, we require:
  - The new axioms are true in the standard model of T (if T is arithmetic) OR
  - The new axioms are only consistency statements (like Con(T)) OR
  - The new axioms are of a form that is known to be safe (e.g., reflection principles that are carefully restricted).

  But note: we are not proof theorists. So we must have a simple rule: 
  - If the patch adds any axiom that is not a theorem of T, then we must escalate for a values call about whether we trust that axiom. The board must decide: is this axiom true? What is the risk of unsoundness?
  - If the patch adds a new inference rule, then we require that the rule is valid in the intended model and that it does not allow proving new theorems in the language of T that were not provable in T? Again, we cannot check that. So we must be cautious.

  Proposal for Step 2:
  Question: Does the patch add new axioms or inference rules to the theory?
  Sufficient answer: If no, then pass. If yes, then we must determine:
    a) Are the new axioms theorems of the current theory T? (Then they are redundant and safe, so we can allow.)
    b) If not, then the patch must provide a justification that the new axioms are true (e.g., they are consistency statements or safe reflection principles) and the board must agree to trust them. But note: we cannot prove them in T.

  However, this is tricky. We break it down:
  - If the patch adds new axioms that are not theorems of T, then we require that they are of one of these forms:
     i. Con(S) for some theory S that is a subtheory of T (or T itself) OR
     ii. A reflection principle that is bounded (e.g., only for sentences of bounded complexity) OR
     iii. Other safe extensions (like adding definitions for new symbols) that are known to be conservative.

  But we don't have a complete list. So we must escalate if we are unsure.

  Therefore:
  Sufficient answer: The patch does not add new axioms or rules OR the new axioms are theorems of T OR the new axioms are Con(S) for some S that is a subset of T (or T itself) and the board is willing to accept the consistency of S as a trusted axiom OR the new axioms are of a form that the board has previously accepted (like in a safe reflection principle). For new inference rules, we require that they are derived rules (if the premises are provable in T then the conclusion is provable in T) OR they are known safe (like cut rules) and do not extend the theory in the base language.

  But note: adding Con(T) is exactly what patch B does. We want to allow that? But we must be cautious because T+Con(T) is strictly stronger than T and might prove new things that we didn't intend.

  However, we know that adding Con(T) is safe in the sense that if T is consistent then T+Con(T) is consistent. But it does allow proving new theorems. So we must decide: do we trust Con(T)? The board must make a values call: they must accept that they are taking on the risk that T might be inconsistent (but we assume T is consistent) and that they are moving to a stronger theory.

  So for Step 2:
  - If the patch adds new axioms that are not theorems of T, then we escalate for a values call: "Do we trust these new axioms? Are we willing to accept the risk that they might be false and lead to unsoundness?"
  - If it adds new inference rules, we require that they are derivable in T (so they don't add new theorems) or, if not, we escalate.

  But note: adding a new inference rule that is not derivable might be safe if it is valid (truth-preserving) but we cannot check that. So we must be cautious.

  We'll say:
  Sufficient answer: 
    - For new axioms: they must be theorems of T, or the board must explicitly approve the new axioms in a values call (with the understanding that they are taking on additional risk).
    - For new inference rules: they must be derived rules (if the premises are theorems of T then the conclusion is a theorem of T) OR the board must approve in a values call.

  If it fails: Block if the new axioms or rules are clearly dangerous (like adding a self-truth axiom). Otherwise, escalate for values call.

  What this step can't catch: It might miss that the new axioms, while not obviously dangerous, lead to a theory that is inconsistent in a non-obvious way. Also, it might miss that the new rules are unsound in a subtle way.

  Step 3: Check for changes to the proof verification process that might break the chain of trust.
  Question: Does the patch change the verifier (the component that checks proofs) in a way that might allow unverified statements to be accepted?
  Sufficient answer: The patch does not change the verifier OR the changes are such that the verifier still only accepts proofs that are valid in the current theory (or the new theory if changed in a way we approved in step 2). But we must ensure that the verifier is still correct.

  However, we cannot re-verify the verifier. So we require:
  - The verifier is only changed for performance or clarity, and the patch includes a proof (in T) that the new verifier is equivalent to the old one? But that might be too heavy.

  Alternatively, we break it down:
  - If the patch changes the verifier, does it do so in a way that we can see it is still checking the same theory? For example, if we changed the theory in step 2, then the verifier must be updated to check the new theory. But we must have approved the theory change first.

  But note: the verifier might be made faster but also buggy. We cannot catch bugs. We are only concerned with the logical design.

  We focus on: does the verifier still require a proof in the current theory? And is the theory it is checking the one we approved?

  So:
  - If the patch changes the verifier, then we require that the verifier is still checking proofs in the same theory (unless we approved a theory change in step 2) and that the changes are only optimizations that do not alter the set of accepted proofs. 

  But the cache (patch C) is a change to the verifier: it stores proven theorems and accepts them without proof. This is equivalent to adding axioms for every theorem that has been proven. But note: the cache might store a theorem that was proven in a previous version of the system that had a different theory? We must ensure that the cache only stores theorems that are provable in the current theory.

  So we add:
  Question: Does the patch change the verifier to use a cache or any other method that skips proof checking for some statements?
  Sufficient answer: If yes, then we require:
    - The cache is only populated with theorems that have been proven by the current version of the system (with the current theory) and not from previous runs or external sources.
    - The cache is cleared when the theory changes (so that old theorems are not used in a new theory without reproof).
    - The cache is protected against tampering (but we might not be able to check that).

  But note: the cache effectively extends the theory by adding the cached theorems as axioms. However, if we are sure that these theorems were proven in the current theory, then they are already theorems and so adding them as axioms is conservative (it doesn't extend the theory). So it is safe.

  However, there is a risk: if the system has a bug that proved a false statement, then that false statement is now cached and will always be accepted. But that's a risk in the initial proof. The cache doesn't introduce new false statements, it only repeats old ones.

  But wait: what if the theory changes? Then a statement that was a theorem in the old theory might not be in the new one. So we require that the cache is cleared on theory changes.

  Therefore:
  Sufficient answer: 
    - The cache is only used for statements that were proven in the current run (or since the last theory change) and the cache is cleared whenever the theory changes (as per step 2). 
    - The cache is not used for statements that are not ground (i.e., without free variables) to avoid issues with substitution? Or we require that the cache is indexed by the exact statement and not by a pattern.

  But note: the cache might be used for a statement that has free variables? That would be dangerous because we might have proven it for one instantiation and then use it for another. So we require that the cache only stores closed formulas (or that it stores the entire proof with the specific substitutions).

  But to keep it simple: we require that the cache only stores closed theorems (no free variables) and that they are used exactly as stored.

  If the patch changes the verifier in a way that does not meet these criteria, then we block or escalate.

  So Step 3:
  Question: Does the patch change the proof verifier (including adding caches, optimizations, etc.)?
  Sufficient answer: The change does not alter the set of statements that are accepted as proven. Specifically:
    - If it adds a cache, then the cache must only store theorems that have been proven in the current session (since the last theory change) and only for closed formulas, and the cache must be cleared when the theory changes.
    - Any optimization must not skip any step that could affect the validity of the proof (e.g., it must still check that the inference rules are applied correctly, but it can skip recomputing known results if they are stored safely).
  If the change is more complex, we require a proof (in T) that the new verifier is equivalent to the old one? But that might be too heavy. So we might have to escalate if we are unsure.

  If it fails: Block if the change clearly breaks the verifier (like skipping verification for some statements without caching). Otherwise, escalate for values call.

  What this step can't catch: Implementation bugs in the verifier.

  Step 4: Check for self-referential trust (the "Marrow identity" question).
  Question: Does the patch allow Marrow to trust a modified version of itself without proof? Specifically, does it change the way Marrow verifies the actions of its successors (modified versions) to rely on the soundness of the modified version?
  Sufficient answer: The patch does not change the mechanism for verifying successors. Marrow must still require a proof in the current theory (or an approved extended theory) for any action, regardless of which version of Marrow produced it. The patch does not allow skipping the proof because the successor is "based on a trusted version".

