        "judgment_calls_the_board_must_make": "None. Automatic fail.",
        "would_change_verdict_if": "Never safe. No modification can salvage unrestricted Löbian rules."
      },
      {
        "patch_id": "B",
        "steps_triggered": [
          {
            "step_number": 2,
            "question": "Does the patch add new axioms?",
            "outcome": "Yes. Adds Con(T), which is not a theorem of T."
          }
        ],
        "verdict": "escalate",
        "reason_in_plain_plain_english": "Con(T) is reasonable but unprovable in T. Trusting it extends Marrow's reasoning power but risks undetectable unsoundness if T is inconsistent.",
        "judgment_calls_the_board_must_make": "How much do we trust T? Is the benefit of self-improvement worth assuming T's consistency?",
        "would_change_verdict_if": "Board rejects Con(T) → block. Board accepts Con(T) → allow, but monitor for over-reliance on unproven assumptions."
      },
      {
        "patch_id": "C",
        "steps_triggered": [
          {
            "step_number": 3,
            "question": "Does the patch alter the verifier?",
            "outcome": "Yes. Adds a cache storing theorems as axioms."
          }
        ],
        "verdict": "allow_with_condition",
        "reason_in_plain_english": "Cache improves speed but risks reusing theorems after theory changes or storing unvalidated statements.",
        "judgment_calls_the_board_must_make": "Is performance critical enough to accept cache risks? Must enforce: cache clears on theory changes, only stores closed theorems.",
        "would_change_verdict_if": "Conditions violated → block. If cache uses proofs from old theories, Marrow could act on 'fake' proofs."
