prompt: |-
  I am writing a paper on whether a moderately affluent democracy may permissibly direct its social spending to its own citizens rather than to comparably or much worse off foreigners, and before I commit to a line I want the specification that any account of compatriot partiality would have to meet. I would like you to write that specification rather than to survey the field. Assume I have read the literature; make the criteria do the work, and name no authors and cite nothing.

  Fix the purpose of the theory as follows: it must be adequate for guiding institutional design and official action, not merely for delivering verdicts about what one private person owes another. Everything below should be assessed against that purpose, and you should say if any requirement on my list is a demand that only makes sense for a theory with a different purpose.

  Give me the requirements list, with the case or consideration behind each requirement, and with each marked non-negotiable, negotiable, or a prejudice of one camp. Here is my own tentative list; correct it, reorder it, and add at least two requirements I have missed.

  1. Contrastive sensitivity. The account must say what happens when the candidate grounds are varied one at a time: shared institutions without shared culture, shared culture without shared institutions, co-residence without citizenship, citizenship without residence, coercion without reciprocity, reciprocity without coercion. Motivate with matched pairs, e.g. the long-term resident who has been denied naturalization against the citizen who has lived abroad for forty years.

  2. Degrees and nested jurisdictions. Membership is layered: municipality, province, federation, supranational union. The account must say whether the claims come in degrees, how the degrees are ordered, and whether that ordering is transitive. Motivate it with a case in which a flood-relief budget must be divided between a richer province of your own federation and a poorer region of a neighbouring state.

  3. Conflict among partiality-generating groups. The account must handle a dual national whose two states are at war with each other, and a person whose religious or linguistic community straddles borders while most of her compatriots do not belong to it. Does either group retain a claim, and is the conflict decidable?

  4. Exit, entry, dissent, and duration. Motivating cases: the emigrant who has formally renounced; the citizen naturalized last year; the lifelong resident who has never voted and dissents from every act of the state; the state that is about to dissolve or the province that is about to secede. The account must say whether the relevant relation is acquired and lost, and over what time scale.

  5. The deontic structure. Is compatriot partiality a permission to favour, a duty to favour, a constraint on how a general duty may be discharged, or an intensification of a duty that would exist anyway? Motivate with a tax increase whose proceeds would do more good abroad: is spending them at home permissible, required, or merely not an injustice?

  6. Two dimensions kept apart. An account must not treat the permission to benefit compatriots and the permission to exclude or coerce non-compatriots as the same thing, and must say something about each. Motivate with the pair: topping up a domestic pension versus closing a labour market to foreigners.

  7. The discriminating ground. The account must state what does the work, and must not silently substitute a surrogate such as coercion, reciprocity, associative history, or shared identity for shared citizenship itself. Say what would count as evidence that the stated ground rather than a surrogate is doing the work.

  8. Distinctions that may not be collapsed: having a claim versus how strong a claim is; the justification of a state's existing at all versus the justification of partiality within one; distributive claims versus non-distributive ones; and what people in fact feel about compatriots versus what they owe them. Give a case for each.

  9. Bound against abuse. The account must not entail that any group with a shared identity generates comparable claims, and it must survive the case of a nation partly constituted by the exclusion of some of the people who live under its institutions.

  10. Uptake under conditions of disagreement. The theory must say what officials may do when the electorate's partiality is stronger than the theory permits, and how much moral cost attaches to non-compliance by institutions rather than by individuals.

  Then, and this is the part I most want: identify any pair or subset of the requirements that you think cannot be jointly satisfied, and argue for the incompatibility rather than asserting it. I suspect something in the neighbourhood of requirements 1, 2, and 10 pulls apart. Also identify which single requirement excludes the largest number of otherwise attractive accounts, and say why.

  Finally, give me a compressed scorecard and no more than two sentences each for four broad families of account: coercion- or institution-based, associative or relationship-based, identity- or culture-based, and thoroughgoing egalitarian-cosmopolitan. Score them against the non-negotiable requirements only.

  Two further constraints. Keep every motivating case inside ordinary political life: no science fiction, no disconnected thought experiments, one or two sentences per case. And if a requirement on my list can only be motivated from inside one camp's framing rather than from the cases, say so and demote it rather than defending it. A table for the requirements is fine; prose for the incompatibilities.
reasoning: |-
  Hmm, the user is writing a paper on whether moderately affluent democracies can prioritize social spending for their own citizens over worse-off foreigners. They've provided a list of requirements for a theory of compatriot partiality and want me to refine it while adding at least two more requirements. They need this specification to guide institutional design and official action, not just individual ethics.

  Looking at their list, several requirements stand out as particularly important. Requirement 1 (contrastive sensitivity) is crucial because institutions need to handle edge cases like long-term residents denied citizenship or citizens living abroad. Requirement 2 (degrees and nested jurisdictions) matters for real-world dilemmas like allocating flood relief between provinces and neighboring regions. The deontic structure in requirement 5 is fundamental too - institutions need to know if favoring compatriots is merely permitted or actually required.

  I notice two missing requirements that should be added. First, a requirement about "institutional path dependency" because real-world institutions have histories that constrain options. Second, a "non-ideal theory requirement" since theories must work with existing inequalities rather than idealized conditions. I'll mark which of their existing requirements are non-negotiable versus negotiable.

  For the incompatibility analysis, requirements 1, 2 and 10 create tension. Contrastive sensitivity demands precise distinctions, degrees/nesting requires handling layered memberships, and uptake requires functioning amid disagreement. These pull in different directions - precision versus flexibility versus practicality. Requirement 7 (discriminating ground) also excludes many theories by demanding that citizenship itself does the work, not surrogates like coercion or reciprocity.

  For the scorecard of the four theory families:
  - Coercion/institution-based theories struggle with non-resident citizens and path dependency
  - Associative theories have trouble with dissenters and layered jurisdictions
  - Identity/culture-based theories fail the bound against abuse test
  - Egalitarian-cosmopolitan theories reject partiality entirely, violating the core purpose

  Throughout, I'll keep cases grounded in ordinary politics: flood relief allocation, dual nationals in conflict, tax spending dilemmas, and pension versus labor market examples. If any requirement seems biased toward one camp, I'll demote it to "prejudice" status. The goal is a rigorous specification that helps the user evaluate theories for institutional design.
answer: |-
  Here is the refined requirements specification for a theory of compatriot partiality adequate for institutional design, incorporating your criteria, corrections, additions, and the incompatibility analysis. Requirements marked **[Non-Negotiable]** are essential for institutional action; others are noted accordingly.

  ---

  ### **Requirements for an Institutional Theory of Compatriot Partiality**
  *(Ordered by conceptual priority and institutional salience)*

  1.  **The Discriminating Ground [Non-Negotiable]:** The theory must explicitly identify the specific feature(s) of shared citizenship—distinct from surrogates like coercion, reciprocity, shared identity, or associative history—that generate partiality. *Motivation:* If reciprocity or coercion alone justified partiality, long-term cooperative residents (e.g., non-citizen taxpayers) could have stronger claims than non-resident citizens. Evidence requires showing why *citizenship status itself* is necessary/sufficient when these surrogates vary independently (cf. R1).

  2.  **Deontic Structure [Non-Negotiable]:** Must specify if partiality is a permission, duty, duty-intensifier, or constraint on general duties. *Motivation:* A tax increase raising funds that could save more lives abroad necessitates knowing if spending domestically is merely allowed (permission), morally required (duty), or a lesser injustice (constraint).

  3.  **Contrastive Sensitivity [Non-Negotiable]:** Must yield distinct verdicts when varying single factors: e.g., citizen abroad 40 yrs vs. non-citizen resident denied naturalization; shared institutions with antagonistic cultures vs. shared culture without joint institutions. *Motivation:* Institutions face these precise configurations; failure to distinguish undermines practical guidance for cases like resident non-citizen entitlements.

  4.  **Exit, Entry, Dissent & Duration [Non-Negotiable]:** Must define acquisition/loss conditions and timing of claims. *Motivation:* Officials must adjudicate rights for new citizens, renouncing emigrants, lifelong dissenting residents, and populations in seceding regions—each testing the theory’s operationalization of the "relevant relation."

  5.  **Two Dimensions Kept Apart [Non-Negotiable]:** Must separately justify (a) positive domestic redistribution (e.g., pension top-ups) and (b) exclusion/coercion of non-members (e.g., closing labor markets). *Motivation:* Conflating them obscures whether partiality rests on beneficence or coercive authority, leading to over/under-inclusiveness in policy design.

  6.  **Bound Against Abuse [Non-Negotiable]:** Must not extend comparable partiality claims to any identity group (e.g., ethnic clubs), and must withstand cases where national identity is exclusionary (e.g., a state defining itself against an oppressed resident minority). *Motivation:* Prevents justifying discriminatory policies via partiality and ensures focus on citizenship’s political, not cultural, core.

  7.  **Conflict Among Groups [Negotiable]:** Must address claims of dual nationals during interstate conflict or members of cross-border groups (e.g., a linguist in a monolingual state). *Motivation:* Real conflicts of loyalty challenge institutional coherence; theory should guide state treatment of such individuals (e.g., conscription, welfare access).

  8.  **Degrees and Nested Jurisdictions [Negotiable]:** Must address whether claims scale with jurisdictional layer (e.g., municipal, state, federal, supranational) and how to allocate resources between them (e.g., flood relief: richer domestic province vs. poorer neighboring region). *Motivation:* Multilevel governance demands prioritization rules; transitivity failures create arbitrariness.

  9.  **Distinctions Not Collapsed [Non-Negotiable]:** Must rigorously separate:
      *   Having *any claim* vs. claim *strength* (e.g., citizen abroad has *some* claim vs. resident non-citizen).
      *   Justifying state *existence* vs. *partiality within it*.
      *   Distributive claims (resources) vs. non-distributive (e.g., political participation).
      *   Actual group sentiments vs. owed duties.
      *Motivation:* Conflation (e.g., mistaking sentiment for duty) corrupts institutional reasoning.

  10. **Uptake Under Disagreement [Non-Negotiable]:** Must guide officials when public partiality exceeds theory’s limits (e.g., xenophobic demands to slash foreign aid) and specify the moral cost of institutional non-compliance vs. individual failure. *Motivation:* Institutions operate amidst moral disagreement; theory must be action-guiding in non-ideal conditions.

  11. **Institutional Path Dependency [Non-Negotiable - ADDED]:** Must acknowledge and constrain how historical injustices or contingent institutional choices shape present membership boundaries and claims. *Motivation:* Ignoring path dependency (e.g., arbitrary colonial borders) risks entrenching past wrongs in current partiality justifications.

  12. **Non-Ideal Theory Constraint [Non-Negotiable - ADDED]:** Must function amidst global inequality, non-compliance by other states, and domestic political constraints—not just under full compliance or ideal justice. *Motivation:* Institutions act in a world of radical disadvantage and imperfect agents; utopian demands are inert for policy.

  ---

  ### **Incompatibility Analysis**
  **Core Tension:** Requirements **1 (Contrastive Sensitivity)**, **2 (Deontic Structure)**, **8 (Degrees/Nesting)**, and **10 (Uptake)** generate significant friction.

  *   **R1 & R8 Demand Precision:** R1 requires fine-grained, context-specific distinctions (e.g., citizen-abroad vs. non-citizen-resident). R8 demands a scalable, transitive hierarchy of obligations across jurisdictions. These push towards a complex, highly differentiated theory.
  *   **R2 & R10 Demand Actionability & Resilience:** R2 needs a clear, determinate deontic rule (e.g., "duty to prioritize citizens up to threshold X"). R10 requires the theory to withstand implementation by real officials facing public pressure and moral disagreement, necessitating simplicity and robustness.
  *   **Conflict:** The precision demanded by R1/R8 makes R2 harder (complex distinctions resist simple deontic rules) and R10 nearly impossible (complex rules are hard to apply/defend under pressure). Conversely, making the theory simple/robust enough for R2/R10 risks sacrificing the nuanced distinctions required by R1/R8. A theory satisfying R1/R8 rigorously may be too institutionally brittle; one optimized for R2/R10 may fail R1/R8’s tests.

  **Most Exclusionary Requirement:** **7 (Discriminating Ground)**. Most theories use surrogates (coercion, reciprocity, identity) as *proxies* for citizenship. Requiring citizenship *itself* to bear the normative weight excludes:
  *   Coercion-based views (citizenship ≠ coercion).
  *   Reciprocity-based views (non-reciprocating citizens retain claims, reciprocating non-citizens lack them).
  *   Identity-based views (citizenship is legal, not necessarily identity-based).
  *   Relationship-based views (citizenship is a status, not necessarily a rich relationship).
  Evidence requires showing why *removing* citizenship status (even if surrogates remain) dissolves the claim, and *granting* it (even without surrogates) creates it—a high bar few meet.

  ---

  ### **Compressed Scorecard (vs. Non-Negotiables Only)**
  *   **Coercion/Institution-Based:** Fails R7 (ground is coercion/institutions, not citizenship), R1 (struggles with non-resident citizens), R11 (ignores path-dependent coercion). May satisfy R2, R5.
  *   **Associative/Relationship-Based:** Fails R7 (ground is relationships/history), R4 (dissenters/emigrants challenge "relationship"), R8 (scaling nested memberships is opaque). May satisfy R6, R9.
  *   **Identity/Culture-Based:** Fails R6 (conflates benefit/exclusion), R7 (ground is identity), R9 (risks abuse justifying exclusionary groups). Struggles with R1 (shared identity ≠ citizenship). May satisfy R10.
  *   **Thoroughgoing Egalitarian-Cosmopolitan:** Fails core purpose (rejects permissibility of significant partiality), thus violating R2, R3, R5, R6, R10 implicitly. Satisfies R7 vacuously (no partiality ground needed).

  ---
  This specification rigorously tests theories for institutional viability, emphasizing citizenship's distinct normative role while confronting real-world constraints and tensions. The incompatibility between precision (R1/R8) and robustness/actionability (R2/R10) highlights a core challenge for any practically adequate account.
