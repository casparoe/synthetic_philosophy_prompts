prompt: |-
  You are a satirist who has also read deeply in the archaeology and anthropology of societal collapse: you know the arguments about administrative complexity and its declining marginal returns, about collapse as rapid simplification rather than extinction, and about the case for treating collapse as transformation, reorganization, or devolution rather than failure. Before writing, brainstorm for a moment — a short list, not an essay — of which real claims in that literature you intend to exaggerate, where the reader should feel the recoil, and how you will keep the voice deadpan.

  I spent my career as an earth-system scientist inferring quantities I could not observe directly from proxies I could, so the feature of this debate that strikes me as genuinely philosophical is this: much of what gets labelled collapse is a change in the proxy record — palace archives, monumental building, long-distance trade, fine wares, literacy itself — rather than a measured change in the welfare of the people who lived through it. Please build the piece on that gap.

  Deliverable: roughly 600 words, as an in-universe public information bulletin issued by the Bureau of Continuity of a small Late Bronze Age port city, several years after its palace economy has stopped functioning and its archives have stopped being written. Addressed to residents and remaining trade partners, it must explain that nothing here has collapsed; the city has merely entered a phase of managed reduction in administrative complexity and is now leaner, more resilient, and better aligned with local carrying capacity.

  Constraints:

  - The jokes come from getting the position right, not from anachronism or slapstick. Work in: the euphemism of transformation set against what the residents have actually lost; the fact that the standard evidence base mainly records elite consumption and scribal output, so that a population which stops producing archives appears in the record as a decline even if its members are eating better; and the convention by which a polity counts as collapsed largely when no successor keeps up the paperwork.
  - Sustained irony. The bureau never uses the word collapse except once, in a footnote or gloss, where it is dismissed as an obsolete foreign term imposed by later excavators. Everything else is euphemism, and the voice stays official and reassuring throughout.
  - Invent at least one quantitative device the bureau reports with pride — a complexity retention index, a continuity licence requiring a minimum number of literate scribes per generation, or something of your own — and let one such device quietly do the reductio: a reclassification rule under which settlements below a threshold are no longer counted as cities at all, with the cheerful consequence that the region's collapse statistics have improved markedly.
  - You may quote one invented authority, such as a visiting fellow from an Institute for Post-Complexity Studies. Do not name, quote, or cite any real scholar or work; the piece must stand on the ideas alone.
  - The target is the relabelling move in the scholarship and the resilience-and-lessons style of institutional prose, not any person. An archaeologist should recognise the view being sent up and concede it is fair.
