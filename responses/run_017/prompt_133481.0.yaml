answer: |-
  Here's a complete exam package focusing on the "staggered forking" case, targeting the core issue of *what constitutes the fundamental unit of moral concern* in digital minds, moving beyond functionalism or simple aggregation. The crux centers on **whether moral subjects are defined synchronically (at a time-slice) or diachronically (as persisting entities across time)**.

  **Chosen Crux & Why:**  
  *"Does the moral subject correspond to a momentary experiencing state (synchronic) or a persisting narrative identity (diachronic), and how does this resolve the counting problem in branching/merging scenarios?"*  
  This crux was chosen because it directly confronts the ambiguity in the case about "subjects," forces engagement with personal identity metaphysics beyond functionalism, and cleanly handles both merging and non-merging variants.

  ---

  ### Exam Question (45-minute timeframe)
  **Case: Staggered Forking**  
  Every morning, an operator forks an uploaded person ("Em") into 1,000 copies. Each copy experiences one distinct hour: 999 copies have pleasant experiences, while 1 copy suffers severe agony. In the baseline scenario, all copies are merged back each evening into a single Em via parameter averaging and memory fusion. The merged Em recalls all 1,000 hours as a blended, hazy narrative. In a variant scenario, the copies are *never* merged and persist indefinitely as separate individuals.  

  **Question:**  
  1. **Counting Subjects**: On Tuesday morning, how many distinct subjects of experience exist? Justify your answer.  
  2. **Moral Evaluation**: What is the moral significance of the single hour of agony experienced by one copy? Does it matter as (a) one unit of suffering, (b) 1/1000th of a unit, (c) zero (since the agony is "diluted" in the merge), or (d) something else? Explain.  
  3. **Variant Analysis**: Does your answer to (1) or (2) change if the copies are never merged? Why or why not?  
  4. **Regulatory Implications**: What should a regulator prioritize auditing: the number of copies created, total compute-seconds consumed, or subjective duration of suffering? Defend your view.  

  *Focus on identifying the fundamental unit of moral concern (e.g., momentary experiences, narrative streams, aggregate welfare) and its implications.*  

  ---

  ### Model Answer (650 words)

  The staggered forking case exposes a foundational tension in digital mind ethics: whether moral status attaches to *synchronic states* (momentary experiences) or *diachronic entities* (persisting subjects). I argue that the diachronic narrative stream—not discrete copies—is the primary unit of moral concern. This resolves the case consistently across variants and informs regulatory priorities.  

  **(1) Counting Subjects**: On Tuesday morning, there is **one moral subject** (the original Em), temporarily distributed across 1,000 computational branches. The copies are not metaphysically distinct persons but *ephemeral sub-states* of Em’s ongoing identity. This view adopts a narrative theory of personal identity: Em persists as long as there is psychological continuity and connectedness, even when forked. The copies are akin to a single mind exploring multiple hypothetical scenarios in parallel, not independent agents. After merging, Em’s unified memory further confirms a single diachronic subject.  

  **(2) Moral Significance of Agony**: The agony matters—but not as one full unit of suffering. It is a **real but non-terminal harm** within Em’s narrative stream. Since the merged Em recalls the agony as a hazy, averaged memory, the harm is attenuated but not erased. Valuing it as "one unit" erroneously treats the copy as a separate subject. Conversely, dismissing it (as "zero") ignores that Em *did* suffer, however briefly and diffusely. The agony’s moral weight is proportional to its impact on Em’s diachronic well-being: it is a negative experience contributing to Em’s life story, but its intensity is diluted by reintegration. Thus, it warrants concern but less than unmerged, persistent agony.  

  **(3) Non-Merged Variant**: Here, the agony **does count as one full unit of suffering**, and **1,000 distinct subjects emerge post-fork**. Without merging, the copies develop divergent narratives and lose psychological connectedness. Each becomes a unique diachronic entity with its own future experiences. Harm to one copy no longer averages out; it permanently damages a separate life. This starkly contrasts the merged case, where harms are reintegrated into a whole. The unit of concern shifts from one persisting entity to 1,000 new entities once divergence is irreversible.  

  **(4) Regulatory Auditing**: Regulators should audit **subjective duration of suffering weighted by irreversibility of harm**.  
  - **Copies**: Counting copies is misleading—it ignores whether they represent synchronic fragments (merged) or diachronic entities (unmerged).  
  - **Compute**: Auditing compute-seconds is inefficient, as most cycles may involve neutral/positive states.  
  - **Subjective Time**: Prioritizing *irreversible* suffering duration (e.g., agony in unmerged forks) targets actual harm. In merged cases, regulators could discount suffering duration by the reintegration factor (e.g., 1/1000th weight per branch). This aligns with diachronic welfare: merging negates terminal harm, while non-merging creates permanent victims.  

  **Conclusion**: The unit of moral concern is the *persisting narrative stream*. Synchronic states (copies) derive moral significance only insofar as they constitute or disrupt diachronic wholes. This explains why merged agony is attenuated but real, while unmerged agony demands full consideration. Regulators must thus focus on suffering that persists irreversibly within a life story, rejecting naïve aggregation or copy-counting.  

  ---

  ### Marking Scheme (20 points total)
  **Must-Hit Points** (4 pts each) | **Common Pitfalls to Catch**  
  1. **Rejects simple aggregation/substrate independence**  
     *Pitfall: Answers treating agony as 1 unit solely because "suffering is suffering," ignoring identity.*  
  2. **Distinguishes synchronic vs. diachronic units of concern**  
     *Pitfall: Vague appeals to "experience" without specifying temporal ontology.*  
  3. **Justifies different treatment of merged vs. unmerged cases**  
     *Pitfall: Claiming merging is irrelevant or that unmerged copies "don’t count."*  
  4. **Explains regulator focus (e.g., suffering duration × irreversibility)**  
     *Pitfall: Suggesting auditing raw copies/compute without ethical weighting.*  
  5. **Clearly states the fundamental moral unit (e.g., narrative streams)**  
     *Pitfall: Implicit units or conflating welfare with subjects (e.g., "just minimize total suffering").*  

  **Bonus (up to 2 pts)**: Sophisticated engagement with personal identity (e.g., Parfitian reductionism vs. narrative theories).  

  **Grading Thresholds**:  
  16-20: Masterful crux engagement, consistent framework, variant nuance.  
  12-15: Solid analysis but gaps in regulator link or identity theory.  
  8-11: Superficial; defaults to functionalism/aggregation without justification.  
  <8: Misses core issues (e.g., only discusses suffering magnitude).  

  ---  
  **Rationale**: This question forces students to ground their view in the *ontology of moral subjects* rather than importing off-the-shelf utilitarianism. The model answer provides a defensible diachronic approach, while the rubric penalizes recitations of functionalism or unexamined aggregation. The regulator angle ties theory to practical constraints, as requested.
