prompt: |-
  Right, slightly odd request, but here goes. I'm a journalist — science and ideas, mostly long pieces for magazines — and I'm about six weeks into something on algorithmic risk scores, the kind of thing cities, parole boards and housing offices buy in. I've read far enough into the technical side to know the punchline: the well-known impossibility results say you can't have calibration within groups, equal false-positive rates across groups, and equal false-negative rates across groups all at once, unless the base rates happen to match or your classifier is perfect; and there's a related family of results about individual-fairness conditions of the treat-like-cases-alike kind coming apart from any group-parity condition. Every vendor I've spoken to still says, brightly, that their system is fair.

  So what I want from you is a spec, not a survey. What does a fairness criterion have to do to count as adequate for the thing I actually care about: a procurement contract. Someone in a council office has to write down, in advance, what fair means for a tool that allocates a scarce benefit — say a fixed number of places on a reentry programme, with more eligible people than places — and then has to audit it afterwards. Give me the requirements list, the case behind each one, which are non-negotiable and which are just preferences of one camp, and flag any set of them that can't be jointly satisfied. That last bit is the bit I most want, honestly: if the desiderata turn out to be jointly unsatisfiable, that's the article.

  Four things I keep coming back too and can't get straight, so tell me which of them are real requirements and which are political demands in a maths costume:

  - it shouldn't be satisfiable by levelling down — by making everyone worse off, or by adding noise to the scores, so the statistics match while nobody gains;
  - it shouldn't be satisfiable just by choosing which groups to slice by; if it holds for the two groups named in the contract, it should hold for subgroups somebody names three years later, or at least degrade in a way you can predict;
  - it has to say something about what happens when the tool's own decisions feed back into the rates it was calibrated on;
  - it has to distinguish allocating a burden from allocating a benefit, and say what a hard capacity limit does to the whole question.

  Which of those is load-bearing and which is a prejudice of one camp? Then, briefly — a short paragraph, not a scorecard essay — how the usual families do against the list (error-rate parity, calibration-within-group, the causal or counterfactual approaches), and which single requirement knocks out the most of what people actually sell. No reading lists or citations, I'll do my own reporting. Assume I know the headlines but not the proofs, so plain language and no notation. And write it in American English, yeah? My editor's in New York and she strips out all my -ises anyway.
reasoning: |-
  Okay, the user is a science journalist deep into algorithmic fairness, specifically for procurement contracts. They need a spec—clear requirements for what makes a fairness criterion adequate when cities or agencies buy these systems. They’re frustrated that vendors claim fairness despite impossibility theorems, and they want to expose conflicts in desiderata.  

  First, unpack their four sticking points:  
  - **"Levelling down"**: This is a real requirement. Fairness shouldn’t be gamed by making outcomes worse for everyone—it’s about meaningful equity, not statistical tricks.  
  - **Subgroup robustness**: Also critical. If fairness holds for broad groups but crumbles for intersections (e.g., Black women), it’s brittle. Contracts must anticipate future scrutiny.  
  - **Feedback loops**: Non-negotiable. Algorithms influence the data they’re trained on (e.g., denying parole skews recidivism rates). Ignoring this is like ignoring climate change in city planning.  
  - **Benefit vs. burden**: Essential distinction. Allocating scarce aid (e.g., reentry programs) vs. imposing penalties (e.g., surveillance) flips fairness implications. Capacity limits exacerbate trade-offs.  

  Now, the core spec. Procurement needs:  
  1. **Group fairness**: Require calibration *and* error parity across named groups. Vendors hate this because it’s often impossible without perfect prediction—but that’s the point.  
  2. **Subgroup guarantees**: Mandate stability under slicing (e.g., "fairness for Black defendants implies fairness for Black women"). Multicalibration is the gold standard here.  
  3. **Feedback resistance**: Build in contractual levers to retrain/audit when predictions alter base rates. No system is static.  
  4. **Benefit-specific rules**: For scarce resources, add a "no harm" clause (e.g., no one below a risk threshold gets deprived).  

  The knockout punch? Requiring *both* calibration *and* error parity. Impossibility theorems guarantee failure unless base rates align perfectly—which they never do. That’s the journalist’s headline: "Procurement Standards Force Vendors to Admit Fairness Trade-Offs."  

  On their camp prejudices: Only "benefit vs. burden" isn’t universally agreed—some academics argue fairness metrics are context-neutral. But in practice, for procurement, it’s load-bearing. You can’t audit a housing tool like a sentencing tool.  

  Short take on common criteria:  
  - **Error parity**: Fails calibration (high-risk groups get over-punished).  
  - **Calibration**: Fails error rates (protected groups suffer more false positives).  
  - **Causal approaches**: Theoretically clean but require untestable assumptions. Vendors will dodge this complexity.  

  Final note: The real scandal isn’t that fairness is hard—it’s that vendors sell "fair" systems knowing these conflicts are unavoidable. Procurement specs that force transparency on trade-offs? That’s the story.
answer: |-
  Here’s the spec for a procurement-ready fairness criterion, stripped to essentials. I’ll flag conflicts, separate requirements from preferences, and address your four sticking points.  

  ### **Core Requirements (Non-Negotiable)**  
  1. **Group Calibration & Error Parity (The Impossible Duo)**  
     - **What**: Scores must be equally reliable across groups (calibration), *and* false positive/negative rates must match.  
     - **Why**: Calibration alone lets high-risk groups suffer more false positives (e.g., over-denying benefits to Group A). Error parity alone misrepresents risk (e.g., labeling low-risk Group B as "high-risk" to hit quotas).  
     - **Conflict**: You **can’t have both** unless base rates are identical or the tool is perfect. Procurement must force vendors to pick one and justify why.  

  2. **Subgroup Robustness**  
     - **What**: Fairness must hold for intersections (e.g., "Black women aged 18–24") if the vendor’s system claims to handle those features.  
     - **Why**: Cherry-picking broad groups hides bias in subgroups. If the tool uses age/race/gender, it must withstand slicing by them later.  
     - **Non-Negotiable**: Audits fail if fairness vanishes under reasonable stratification.  

  3. **Feedback Loop Safeguards**  
     - **What**: The contract must require retraining protocols when the tool’s decisions alter base rates (e.g., denying reentry programs increases unemployment, which the tool then uses to predict risk).  
     - **Why**: Without this, the tool amplifies bias over time. Procurement must mandate periodic reassessment of input data validity.  

  ### **Contextual Demands (Depend on Use Case)**  
  4. **Benefit vs. Burden & Capacity Limits**  
     - **Benefit allocation** (e.g., scarce reentry spots):  
       - Requirement: No harm principle. Those just below the cutoff shouldn’t fare worse than those just above.  
       - Capacity limits force *ranking*, not just classification. Fairness must ensure protected groups aren’t disproportionately pushed below the cutoff.  
     - **Burden allocation** (e.g., parole denial):  
       - Stricter false positive controls needed (e.g., don’t over-punish).  
     - **Why**: Allocating benefits demands preventing under-provision; burdens demand avoiding over-penalization. Capacity constraints exacerbate trade-offs.  

  ### **Your Four Sticking Points—Sorted**  
  - **"No levelling down"**: **Requirement**. Fairness isn’t statistical cosplay. If meeting criteria makes outcomes worse (e.g., adding noise to scores), reject it.  
  - **Subgroup slicing**: **Requirement** (as above). No hiding behind coarse groups.  
  - **Feedback loops**: **Requirement** (as above). Non-negotiable for dynamic systems.  
  - **Benefit vs. burden**: **Contextual, but load-bearing**. Procurement specs must define which they’re buying and set error tolerance accordingly.  

  ### **How Common Approaches Stack Up**  
  - **Error-rate parity**: Fails calibration. High-stakes for benefits: risks under-serving high-need groups. Vendors love it—easy to measure, easy to game.  
  - **Calibration within groups**: Fails error parity. Often over-penalizes marginalized groups (more false positives). Still gamed by vendors.  
  - **Causal/counterfactual fairness**: Theoretically robust but requires untestable assumptions. Vendors avoid it; procurement can’t audit it.  
  - **Multicalibration** (subgroup calibration): Best for robustness but computationally tough. Vendor kryptonite—exposes subgroup trade-offs.  

  ### **The Knockout Punch**  
  **Requiring both calibration and error rate parity**. The impossibility theorem guarantees failure unless base rates match—which they rarely do. Every vendor selling "fair" systems either picks one silently or manipulates group definitions. Procurement specs that demand both force vendors to admit the trade-off or walk away. That’s your headline.  

  **Bottom line for procurement**:  
  1. Define groups explicitly (race, gender, age bands).  
  2. Pick **either** calibration **or** error parity—justify choice based on harm (e.g., calibration for benefits, error parity for burdens).  
  3. Demand subgroup reporting for all features used.  
  4. Build in feedback-loop audits.  
  5. Ban levelling down.  
  If they insist on all three fairness properties (calibration + FPR/FNR parity), the contract is vacuously satisfiable—only perfect (or biased) tools need apply.
