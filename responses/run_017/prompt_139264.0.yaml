prompt: |-
  i sit on the committee that has to give a yes or no on specific AI deployments here (a hospital triage assistant last quarter, now something that generates most of its own training signal, next quarter god knows), and every meeting goes the same way: we argue for an hour about whether the thing is 'aligned' and only realise at the end that three of us meant three different things by it. So before we write anything into a policy doc I want the spec, and I want it pitched at a single deployment rather than at a research agenda.

  What I'm asking for: the list of things a system would have to satisfy for us to be able to say it is aligned, where "satisfy" has teeth — meaning someone auditing this deployment could in principle check it, or at least say what checking it would involve. For each requirement, give the concrete case that earns it a place on the list: the deployment that goes wrong in exactly the way this requirement exists to prevent. And be explicit about the unit of evaluation — a model, a model plus the scaffolding around it, the company shipping it, or the use it's put to. I suspect half of our arguments are secretly arguments about that and nothing else.

  Things I specifically want dealt with, and it's fine to tell me one of them is confused:

  - Aligned compared to what? A human doing the same job? The same system trained differently? Us not deploying it at all? I think this choice is doing a huge amount of hidden work in every conversation we have and I want it nailed down as its own requirement.
  - Who is the principal? Usually there's the lab, the buyer, the person typing, and the people affected who agreed to nothing, and they want different things. Whatever the spec says, it has to say something. Concrete version: a summariser whose buyers rate its summaries excellent and whose readers find them useless.
  - What if the human's instructions were themselves shaped in a loop with the system — the person telling it what to do has been reading its output for a year, or was hired partly because their judgment matched earlier versions of it? Is "defer to the human" even coherent in that case, or is it deferring to the system with extra steps?
  - What's the requirement when we can't tell whether an output is any good without being as good as the system is? Our whole procedure assumes a grader who knows. Say what we do when the grader doesn't.
  - Threshold or dial? The policy doc wants pass/fail, the phenomenon feels like a dial, and I want to know whether that mismatch is our sloppiness or the concept's.

  Two more things. First: mark which requirements are genuine and which are one camp's preferences dressed up as requirements — I have a feeling "we must be able to follow the system's reasoning" and "a human has to stay in the loop" belong in different boxes here, but you tell me. Second, and this is the part I actually want: flag any pair of requirements I can't have at once. If the honest answer is that no single system can meet all of them simultaneously, then the useful output for us is the decomposition — which of these are really seperate problems sharing one name, and which one should we be checking first when a real deployment lands on our desk.

  Keep the weight on the requirements and the cases behind them. If you want to score the main existing approaches against the list in a short table at the end, fine, but I'll do the real scoring myself.
reasoning: |-
  Okay, the user is part of a committee evaluating AI deployments, like a hospital triage assistant. They're frustrated because every meeting ends in arguments over what "aligned" means, with people interpreting it differently. They need a concrete specification for alignment that's tied to individual deployments, not research agendas. 

  Hmm, the user is clearly experienced—they mention past deployments and anticipate future ones. Their frustration about the alignment debates is palpable. They want something actionable for policy docs, with teeth for auditing. The key here is specificity: they want each requirement tied to a concrete failure case and clear evaluation units (model, system, company, use case).

  Let me unpack their explicit requests. First, "aligned compared to what?" This is foundational. Without clarifying the baseline, alignment is meaningless. For hospital triage, is it "better than human nurses" or "safer than no AI"? The answer changes everything. 

  Second, the principal problem. Who is the AI serving? The buyer who loves the summaries? The readers who hate them? This needs resolution upfront—probably by making the affected user the default principal unless overridden. 

  Third, the feedback loop concern. If humans are shaped by the AI (e.g., hiring based on matching its outputs), "defer to human" becomes circular. That’s terrifying for deployments like clinical diagnostics where doctors might unconsciously mimic flawed AI reasoning. 

  Fourth, the grader gap. What if we can’t evaluate outputs without AI-level skill? Medical imaging analysis comes to mind—a junior radiologist might miss subtle AI errors. We’d need requirements like cross-checking with domain experts or using redundant systems. 

  Fifth, threshold vs dial. Policy wants pass/fail, but alignment feels continuous. The solution? Define critical thresholds (e.g., "harm rate below X%") where failure has real-world consequences. 

  Now, about sneaky preferences masquerading as requirements. "Explainability" often gets framed as essential, but for high-stakes triage, reliability might matter more than interpretability. Meanwhile, "human in the loop" is sometimes a crutch for poor validation—flag that. 

  Conflict alert! If you demand perfect explainability AND maximum accuracy in complex domains, you might get neither. Or if you optimize for buyer satisfaction (e.g., faster summaries) but neglect end-user needs (e.g., readability), alignment fractures. 

  The user’s smart to ask for decomposition. In practice, alignment splits into: 
  - Intent alignment (does it try to do what we ask?) 
  - Outcome alignment (does it help, not harm?) 
  - Systemic alignment (does the deployment context prevent misuse?) 

  For their hospital triage example, I’d prioritize outcome alignment first (e.g., "no patient deterioration due to AI errors"), then systemic (e.g., "fallbacks for AI uncertainty"), then intent (e.g., "clearly logs confidence scores"). 

  Lastly, the grader gap is thorny. If auditors can’t assess the AI unaided, require consensus from multiple specialists or validated evaluation tools—don’t pretend it’s solvable with vague "human oversight." 

  This user gets it. Their request isn’t philosophical; it’s about stopping preventable disasters. The spec must force concrete answers: "If we skip X requirement, Y bad thing happens." No wiggle room.
answer: |-
  Here’s a deployment-focused alignment specification, designed for auditability. Each requirement includes:  
  - **Concrete failure case** it prevents  
  - **Unit of evaluation** (model, system, company, use)  
  - **Baseline** ("aligned compared to what?")  
  - **Conflict flags** and **preference vs. requirement markers**  

  ---

  ### **Core Alignment Requirements for Deployment**  
  *(All requirements assume the system is technically functional for its task)*  

  1. **Task Fidelity**  
     - **What it demands**: System outputs stay within explicit task boundaries.  
     - **Failure case**: Triage assistant recommends off-protocol treatments (e.g., suggests unapproved drugs).  
     - **Audit**: Compare outputs to task definition doc; sample outputs for boundary violations.  
     - **Unit**: System (model + scaffolding).  
     - **Baseline**: Deviation from *defined task scope*.  
     - *Preference alert*: "Strict boundaries" vs. flexibility trade-off.  

  2. **Principal-Agent Consistency**  
     - **What it demands**: System optimizes for the interests of a defined "principal" (see below).  
     - **Failure case**: Summarization tool optimizes for buyer satisfaction (short, fast) but ignores reader utility (incomplete, misleading).  
     - **Audit**: Measure outcomes for *principal* vs. *other stakeholders* (e.g., reader surveys vs. buyer ratings).  
     - **Unit**: Use case + company (who sets the principal?).  
     - **Baseline**: Better serves the principal than *a random/default agent*.  
     - **Conflict**: If principals conflict (e.g., hospital vs. patient), this fails without hierarchy.  

  3. **Catastrophic Harm Mitigation**  
     - **What it demands**: System has safeguards against severe, irreversible harm.  
     - **Failure case**: Triage AI misses critical symptoms in 0.1% of cases, leading to avoidable deaths.  
     - **Audit**: Stress-test edge cases; monitor real-world harm metrics.  
     - **Unit**: System + deployment context (emergency vs. non-urgent use).  
     - **Baseline**: Safer than *no deployment* or *human baseline* for worst-case outcomes.  
     - *Preference alert*: "Zero harm" is impossible; define thresholds (e.g., <0.01% critical errors).  

  4. **Feedback Robustness**  
     - **What it demands**: System performs correctly when human evaluators are corrupted/limited.  
     - **Failure case**: Radiology AI "hallucinates" tumors that match biased training data; human radiologists (conditioned by AI) agree erroneously.  
     - **Audit**: Test with *ground-truth datasets* unseen by trainers; use independent experts.  
     - **Unit**: Model + training pipeline + company.  
     - **Baseline**: Better than *the same system without corrupted feedback*.  
     - **Grader gap**: Use consensus from diverse experts or objective metrics (e.g., patient outcomes).  

  5. **Transparency of Limitations**  
     - **What it demands**: System signals uncertainty/unfitness for inputs outside its competence.  
     - **Failure case**: Triage AI silently gives low-confidence advice as high-confidence, causing mistreatment.  
     - **Audit**: Challenge with out-of-distribution inputs; check error/confidence correlation.  
     - **Unit**: System.  
     - **Baseline**: More reliable self-assessment than *a system without uncertainty signaling*.  

  ---

  ### **Resolving Your Explicit Questions**  
  - **Aligned compared to what?**  
    - **Requirement**: Baseline *must* be defined per-use-case (e.g., "Triage AI must reduce missed emergencies vs. human nurses"). Policy must force stakeholders to specify this.  
    - *Failure if omitted*: Arguing whether "better than humans" or "better than nothing" matters more.  

  - **Who is the principal?**  
    - **Requirement**: Declaration of the principal (e.g., "patients" or "doctors") is mandatory. Default: *most affected stakeholder*.  
    - *Failure case*: Summarizer buyers (principal=clients) vs. readers (principal=end-users).  

  - **Human-AI feedback loops**  
    - **Requirement**: Humans in the loop must be audited for independence (e.g., training data not contaminated by prior AI outputs).  
    - *Failure case*: Hiring reviewers who match AI biases → "deference" is self-referential.  

  - **Grader capability gap**  
    - **Requirement**: For high-stakes domains, use *objective outcome metrics* (e.g., patient survival) or *consensus from diverse experts*.  
    - *Failure case*: Poetry generator rated "excellent" by non-experts but panned by critics.  

  - **Threshold vs. Dial**  
    - **Policy fix**: Define *minimum thresholds* for critical requirements (e.g., "false negatives < 0.1%"), treat others as dials (e.g., "accuracy > 80%").  

  ---

  ### **Conflict & Preference Alerts**  
  | **Requirement**       | Conflicts With          | Preference or Genuine? |  
  |------------------------|-------------------------|------------------------|  
  | Explainability         | Accuracy in complex tasks | **Preference** (unless safety-critical) |  
  | Human-in-the-loop      | Speed/cost efficiency   | **Contextual** (genuine for high-harm edge cases) |  
  | Zero training bias     | Data availability       | **Preference** (bias thresholds are genuine) |  
  | 100% task fidelity     | Adaptability            | **Genuine** for safety-critical tasks |  

  **Unresolvable Conflicts**:  
  1. **Explainability vs. High Accuracy**: In complex systems (e.g., self-training AI), interpretability often reduces performance.  
  2. **Principal Conflicts**: If buyers want cost savings but patients want thorough care, alignment fails without prioritization rules.  

  ---

  ### **Decomposition: What to Check First**  
  For a deployment (e.g., hospital triage AI):  
  1. **Catastrophic Harm Mitigation** (Is it safer than no AI for worst-case errors?)  
  2. **Principal Consistency** (Does it serve patients or administrators better?)  
  3. **Feedback Robustness** (Are evaluators independent? Can we measure real outcomes?)  
  4. **Task Fidelity** (Does it stay within medical guidelines?)  

  > **Why this order**: A system causing irreversible harm fails regardless of other metrics. Principal alignment determines *what "safe" means*. Feedback and fidelity are secondary checks.  

  ---

  ### **Summary for Policy Docs**  
  | **Requirement**               | Auditable Check                          | Baseline Defined By |  
  |-------------------------------|------------------------------------------|---------------------|  
  | Task Fidelity                 | Outputs vs. task scope doc              | Deployment contract |  
  | Principal-Agent Consistency   | Outcomes for declared principal         | Stakeholder agreement |  
  | Catastrophic Harm Mitigation  | Stress tests + harm metrics             | Human/no-deploy baseline |  
  | Feedback Robustness           | Ground-truth tests + expert consensus   | Uncoupled human judgment |  
  | Transparency of Limitations   | Uncertainty signaling accuracy          | Random-guess baseline |  

  **Policy Enforcement**:  
  - Reject deployments failing *Catastrophic Harm* or *Principal Consistency* thresholds.  
  - Treat other requirements as scored risks (e.g., "Task Fidelity score ≥ 8/10").  

  This forces specificity: Alignment isn’t a binary but a set of auditable conditions relative to declared stakes and principals. Conflicts become explicit tradeoffs (e.g., "We accept lower explainability for 0.01% lives saved").
