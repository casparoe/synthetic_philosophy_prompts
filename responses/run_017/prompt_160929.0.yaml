prompt: |-
  I am a PhD student in criminology, writing the chapter of my dissertation that deals with how sentences are actually produced, and I have run into a normative question that I cannot get traction on. I would be grateful for help reconstructing what the practice I am studying presupposes.

  The practice, in the jurisdictions in my sample, has the following features, none of which I think is controversial:

  1. Sentence length is set by negotiation rather than by any finding about culpability. Roughly nine convictions in ten are pleas rather than verdicts, and the term imposed is a function of the charges the prosecutor files, the discount offered for waiving trial, and the defendant's willingness to accept it.

  2. The plea discount is a published scale keyed to timing rather than to culpability: on the order of a third off for a plea entered at the first hearing, tapering to a token few percent for a plea entered at the courtroom door. The official justification is administrative — witnesses spared, court time saved, victims not required to testify — and the doctrine is explicit that the discount is not a reward for remorse, remorse being handled separately as a mitigating factor.

  3. The largest reductions go to defendants who can hand over information about other people's crimes. The size of a defendant's discount therefore tracks how much they know, which in practice tracks how deeply embedded they were in the offending.

  4. The same systems also maintain, in appellate review, that a sentence must be proportionate to the gravity of the offence and the offender's culpability, that consequences falling on third parties are not mitigating, and that a person who lacked the capacity to conform is not a fit subject for punishment at all.

  5. One jurisdiction has gone further and made the mechanism explicit. A defendant convicted after a full contest at trial now receives the same reduction if, within a fixed window, they waive their appeal and accept a supervision and restitution plan. It is formally described as a credit for not consuming further public resources; it is refused to defendants who maintain innocence and pursue their appeals, including where the appellate court would later have found error on the record.

  My own suspicion is that the practice strictly presupposes almost nothing about desert, and that the proportionality language at the appellate level is decorative rather than load-bearing. But I do not know how to test that suspicion, because the features pull in different directions: some look like straightforward deterrence or resource allocation, while others — the refusal to count third-party harms, the capacity-based exemptions — seem to make sense only if desert is doing real work somewhere in the system.

  This is where I would particularly value help. I have been reading the debate between Dennett, who holds that desert survives the demise of libertarian free will as a social practice we have good reasons to maintain, and Caruso, who holds that no one is responsible in the desert-involving sense and that the state's coercive response to crime should be modelled on public health: prevention, incapacitation and treatment, constrained by something like a least-restrictive-means requirement. On the face of it these views are very far apart, and yet I cannot see that the practice discriminates between them. The first might say that negotiated sentences are exactly what taking desert seriously under uncertainty and scarcity looks like, or that desert functions as a loose outer constraint while efficiency determines the outcome within it. The second might say that the plea discount is triage under a budget constraint, and that the only thing wrong with it is the punitive framing — but equally that a credit for waiving rights is unintelligible on a quarantine model, since waiving an appeal does not make anyone less dangerous. If both can license the practice, what would have to be true of the practice for it to be evidence for one rather than the other, and what would concretely have to change in it if either view were adopted honestly rather than rhetorically?

  Two further things I would like addressed. First, the epistemic dimension: plea bargains are struck under deep uncertainty about what the defendant did, and one strand of the sceptical argument is that we are never in a position to know whether anyone is answerable in the desert-involving sense. Does that make a negotiated sentence the epistemically appropriate response to uncertainty about desert, or a sign that the desert question was never really being asked? Second, where the practice is underdetermined: which of the five features could be retained under several rival theories, and which is defensible on only one. If it turns out that the sentencing discount is the feature that no theory wants and every theory tolerates, I would like to know why toleration is so cheap.
reasoning: |-
  Okay, let me start by unpacking the PhD student's query. They're in criminology, working on a dissertation chapter about how sentences are produced, specifically through plea bargaining. They've outlined five features of the current system and are struggling with the normative presuppositions. The core question is whether the practice presupposes desert (desert-based theories) or if it's more about efficiency and resource management (public health models).

  First, I need to understand each of the five features they listed. The heavy reliance on plea bargains, fixed discounts based on timing, reductions for cooperation, appellate emphasis on proportionality, and one jurisdiction's appeal waiver credit. The student suspects desert is decorative, but features like third-party harm exclusions and capacity exemptions seem to require some desert basis. 

  The student mentions Dennett vs. Caruso. Dennett argues for maintaining desert as a social practice without libertarian free will, while Caruso rejects desert entirely, favoring a public health approach. The challenge is that the current system doesn't clearly align with either. Both can justify aspects of the practice, so how can they test which one the system truly presupposes?

  Looking at the epistemic angle: plea bargains happen under uncertainty about the defendant's actions and culpability. Does negotiating sentences acknowledge that uncertainty, or does it bypass the desert question entirely? The student also wants to know which features are compatible with multiple theories and which are exclusive to one.

  To reconstruct the presuppositions, I should consider implicit norms. For instance, the fixed plea discount scale is purely administrative, ignoring culpability. That leans towards efficiency over desert. But the exclusion of third-party consequences and capacity requirements might imply that desert is a foundational constraint, even if not operational in sentencing. 

  The cooperation discounts create a paradox. Higher discounts for those more embedded in crime suggest that the system values information over proportionality, which conflicts with appellate rhetoric. This inconsistency might indicate that desert is rhetorical rather than operational. 

  The appeal waiver credit is explicitly transactional, trading resources for sentence reduction. This seems incompatible with desert, which shouldn't depend on procedural choices. A public health model might see it as triage, but waiving an appeal doesn't reduce danger, so it's incoherent under that model too. That makes this feature a point of tension for both theories.

  For epistemic uncertainty, negotiated sentences avoid the need to ascertain true culpability, which might mean the system isn't committed to desert. Alternatively, it could be a practical compromise under uncertainty. The key is whether the system still references desert as an ideal, even if unattainable. If appellate courts insist on proportionality but trial practices ignore it, that suggests desert is decorative.

  Testing the presuppositions: If the system were honest about Dennett's view, proportionality would constrain outcomes despite efficiency. But currently, efficiency dominates. For Caruso, removing punitive language and focusing on risk management would be necessary. Features like capacity exemptions align with Caruso, but punitive elements contradict it.

  Features like fixed discounts and cooperation reductions are tolerated by both theories as practical necessities, which is why they persist. The appeal waiver is indefensible under both but persists due to institutional inertia. 

  The student needs to look for inconsistencies between rhetoric (appellate emphasis on desert) and practice (efficiency-driven bargains). If appellate courts uphold sentences ignoring proportionality, it shows desert isn't load-bearing. Capacity exemptions must be explained; if based on desert, they wouldn't be punished, but under public health, they'd be treated. Current practice might inconsistently apply both, revealing unresolved tensions.

  In summary, the system's practices prioritize efficiency, while desert serves as a legitimizing narrative. The features defensible only under specific theories (like capacity exemptions under desert) are points where the system's contradictions become visible. To test, the student should examine how appellate courts handle proportionality appeals in plea cases and whether resource-driven discounts are acknowledged as deviations from desert ideals.
answer: |-
  Your analysis hits on a profound tension in criminal justice systems: the gap between **declarative norms** (proportionality, culpability) and **operational logic** (efficiency, resource allocation). Let's reconstruct the presuppositions, test your suspicion, and address the normative underdeterminacy.

  ---

  ### **Core Presuppositions of the Practice**
  1. **Resource Scarcity as the Primary Constraint:**  
     The system presupposes that procedural resources (court time, prosecutorial capacity) are scarcer than punitive resources (prison space, supervision costs). The plea discount scale prioritizes conserving the former, even at the expense of individualized justice.

  2. **Punishment as the Default Framework:**  
     Despite efficiency measures, the practice retains punishment—not public health containment—as its core structure. The appeal waiver credit, for example, is a *discount on punishment*, not a substitute for it.

  3. **Epistemic Humility (or Indifference) About Desert:**  
     By rewarding procedural cooperation (early plea, information, appeal waiver) over factual accuracy or moral assessment, the system presupposes that **ascertaining true desert is either impossible or prohibitively costly**. The "discount for uncertainty" is operationalized mechanically.

  4. **Culpability as a Boundary Condition, Not a Determinant:**  
     Features like capacity-based exemptions and third-party harm exclusions suggest culpability acts as a **limiting principle** (e.g., "we don't punish the non-culpable") but not as a positive guide for sentence *quantification*. Proportionality rhetoric in appeals serves as a legitimacy-preserving ritual.

  ---

  ### **Testing Dennett vs. Caruso: What Would Discriminate?**
  | **Feature**               | **Dennett-Compatible?**                          | **Caruso-Compatible?**                          | **Discriminating Test**                                  |
  |---------------------------|--------------------------------------------------|--------------------------------------------------|----------------------------------------------------------|
  | **Fixed plea discount**   | Yes (pragmatic proxy under scarcity)             | Yes (resource triage)                            | **Neither** discriminates; both tolerate efficiency.     |
  | **Cooperation discounts** | Weakly (undercuts proportionality)               | Yes (information aids "public health" control)   | **Caruso** justifies it better; Dennett struggles with rewarding deeper criminal embeddedness. |
  | **Capacity exemptions**   | **Exclusive fit** (desert requires capacity)     | Contingent (only if incapacity implies no danger)| If exemptions persist *without* risk assessment, supports **Dennett**. |
  | **Appeal waiver credit**  | Incoherent (desert shouldn't hinge on procedural choice) | Incoherent (waiving appeal ≠ reduced danger) | **Neither** justifies it; reveals system's purely transactional logic. |
  | **Third-party harm exclusion** | **Exclusive fit** (desert is individual)      | Contingent (harms may affect "public health" response) | If consistently excluded, supports **Dennett**. |

  #### **Concrete Changes Under Honest Adoption**
  - **Dennett's Desert-Preserving Practice:**  
    - Plea discounts would be capped by a **desert ceiling** (e.g., no sentence exceeding 150% of "desert value" even for late pleas).  
    - Cooperation discounts would require proof of **redeeming social value** (not just information quantity).  
    - Appeal waivers would be abolished (procedural choices ≠ desert).  

  - **Caruso's Public Health Model:**  
    - Sentences framed as **risk-management interventions** (e.g., "restrictive containment" vs. "punishment").  
    - Plea discounts replaced by **early compliance incentives** (e.g., therapy access).  
    - **Dangerousness assessments** would replace culpability inquiries; capacity exemptions only if no risk.  
    - Third-party harms **reinstated as relevant** (e.g., children impoverished by incarceration → increased societal risk).  

  ---

  ### **The Epistemic Dimension: Negotiation as a Response to Uncertainty**
  - **If desert is central:** Negotiation is a fallible proxy for desert under uncertainty. The discount reflects the cost of *avoiding error* (e.g., risk of under/over-punishment at trial).  
  - **If desert is decorative:** Negotiation bypasses the need to *ask* the desert question. The system replaces moral inquiry with a **prediction market** (defendant bets on trial risk vs. plea offer).  

  **Your Practice Suggests the Latter:**  
  The fixed discount scale (keyed to timing, not facts) and appeal waiver (rewarding finality over truth-seeking) imply that **desert is not merely uncertain but operationally irrelevant**. The system prioritizes **closure** over moral justification.

  ---

  ### **Why Toleration is Cheap: The "No Theory Wants It" Feature**
  The **appeal waiver credit** is the clearest candidate for a practice that:
  - **Contradicts Desert (Dennett):** Punishment severity *should not* depend on willingness to abandon procedural rights.  
  - **Contradicts Public Health (Caruso):** Waiving an appeal doesn't reduce risk or aid rehabilitation.  

  **Yet it persists because:**  
  1. **Institutional Inertia:** It extends the plea logic ("finality = efficiency") to appeals.  
  2. **Steamrolling Dissent:** It penalizes defendants who challenge systemic errors, preserving institutional legitimacy.  
  3. **Budgetary Determinism:** It reflects a pure **zero-sum resource calculus**: "We pay for your appeal or your prison bed; choose one."  

  **Toleration is cheap** because both theories prioritize larger goals (social stability for Dennett, harm reduction for Caruso) and can dismiss the waiver as a "necessary evil" under fiscal constraints—even as it exposes the system's instrumental view of rights.

  ---

  ### **Conclusion: What the Practice Reveals**
  1. **Desert is a Rhetorical Scaffold:** Proportionality language in appeals legitimizes outcomes determined by efficiency. Capacity exemptions are "desert relics" in an otherwise desert-agnostic system.  
  2. **The System is Hybrid but Leans Caruso:** Resource-driven triage aligns with public health logic, but *retains punitive framing* because:  
     - The state lacks non-punitive infrastructure (treatment, surveillance).  
     - Retributive intuitions sustain public acceptance.  
  3. **Key Test for Your Dissertation:**  
     - **Empirical:** Do appellate courts ever *invalidate* pleas for disproportionality, or is proportionality only enforced in trial convictions? If the latter, desert is decorative.  
     - **Conceptual:** Does the system treat **cooperation discounts** as purchasing information (Caruso) or as mitigating culpability (Dennett)? The former is dominant.  

  **To resolve the tension:** Your five features form a **revealed preference** for efficient finality over moral accuracy. The practice presupposes that **justice must be administratively feasible before it can be morally perfect**—and perfection is indefinitely deferred.
