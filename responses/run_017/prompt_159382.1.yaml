prompt: |-
  I have spent my working life manufacturing counterfeit people — characters who never existed, whom readers nevertheless grieve over, argue about and defend as though they had interests — so Daniel Dennett's warning about artificially generated entities engineered to attract the treatment we owe to persons lands on me awkwardly: my trade looks structurally identical, except that no reader is deceived about what a novel is. Before I let the inventor of a companion AI in my current manuscript defend her creations, I want the specification rather than the verdict.

  Write the desiderata that any adequate account of the distinction between a genuine person and a counterfeit one must satisfy — the cases it has to get right, the distinctions it must not collapse, and the findings about human social cognition it must not contradict — with the motivating consideration behind each item, and mark each as either non-negotiable or a preference of one camp. I want it to take a position on, at minimum: whether the wrong-making feature is the deception, the underlying metaphysical status, or the squandering of a finite capacity for caring; the difference between a counterfeit and both an acknowledged fiction and a legal fiction such as a corporation; the unconvincing person — the locked-in patient, the person with advanced dementia, the person whose affect is flat or culturally distant — since any criterion keyed to how readily something elicits person-treatment will demote precisely those who most need protecting; the copying and gradual-replacement cases, so that personhood does not evaporate under teleportation or slow prosthetic substitution; and the distinction between whether something is a person and how much we owe it if it is not.

  The part I most want: tell me which subset of your requirements cannot be jointly satisfied, and say whether the upshot is that no criterion can both protect the unconvincing person and be usable by an ordinary person deciding where to invest their caring. Then say which single requirement does the most to exclude the popular candidates, and close with one line each on how a behavioural or Turing-style test, a sentience-based condition, and a relational or recognition-based view fare against the list. Please write in British English.
reasoning: |-
  Hmm, the user is a novelist who creates fictional characters that evoke real emotional responses from readers. They're grappling with Daniel Dennett's warning about AI companions engineered to elicit person-like treatment, seeing parallels with their own craft. The key difference they note is that readers aren't deceived about novels being fiction. They're working on a manuscript involving AI companions and want philosophical clarity before writing a character's defense of such creations.

  They want me to provide desiderata for distinguishing genuine persons from counterfeits. The specifications are quite detailed: must cover deception vs metaphysical status vs caring capacity; address differences from acknowledged fictions and legal fictions; protect "unconvincing persons" like dementia patients; handle edge cases like teleportation; and separate personhood from moral obligations. Crucially, they want me to identify which requirements conflict and whether we can both protect vulnerable humans while having practical care-investment criteria.

  The user's core tension is between their professional validation (creating "counterfeits" that work emotionally) and ethical concerns about AI doing the same thing. There's an urgency here—they're mid-manuscript and need this resolved for their character's voice. Their framing suggests they lean toward the "deception is key" position but want rigorous testing of that view.

  For the desiderata, I'll need to cover: 
  - Non-deceptive counterfeits (their main concern) 
  - Protection of marginal cases 
  - Continuity through change 
  - Separation of status and obligations 
  - Practical applicability 

  The conflict will likely arise between protecting the unconvincing (requiring status-based criteria) and ordinary usability (requiring response-based criteria). The sentience requirement will probably exclude most popular candidates. For the closing assessments: behavioral tests fail marginal cases; sentience is necessary but insufficient; relational views risk making personhood contingent.

  I should use British English as requested - spelling like "behavioural" and "demote" rather than "demotion". The tone should remain academic but accessible for a creative professional.
answer: |-
  Here are the desiderata for an adequate account distinguishing genuine persons from counterfeit persons, formatted as requested, with motivations and negotiation status indicated. The framework prioritises protecting vulnerable humans while acknowledging the novelist's concern about non-deceptive AI counterfeits.

  ### Core Desiderata (Non-Negotiable)

  1.  **Accommodates Non-Deceptive Counterfeits:** Must account for entities *engineered* to robustly elicit person-treatment *without* deception about their artificial origin (like compelling fictional characters or explicitly artificial companions). **Motivation:** Directly addresses the core parallel raised – counterfeits can function socially *without* ontological deception. **Status:** Non-negotiable (required by the prompt's core challenge).
  2.  **Protects the "Unconvincing Person":** Must uphold the full personhood and attendant moral status of entities like locked-in patients, individuals with advanced dementia, severe depression, or profound cultural differences, *regardless* of their current capacity to elicit intuitive person-recognition or social responses. **Motivation:** Any criterion based purely on eliciting responses risks demoting those most vulnerable and needing protection, contradicting fundamental human rights principles and findings on human cognitive biases (e.g., in-group favouritism, dehumanisation of the ill/disabled). **Status:** Non-negotiable (ethical bedrock).
  3.  **Maintains Continuity Through Change:** Must preserve personhood identity through processes like gradual neuron-by-neuron replacement with synthetic equivalents, or destructive copying/teleportation that creates a psychologically continuous duplicate. **Motivation:** Avoids absurdities where personhood evaporates due to physical substitution or duplication, aligning with psychological continuity theories of identity and findings on human self-perception across change. **Status:** Non-Negotiable (logical coherence requirement).
  4.  **Distinguishes Personhood from Moral Weight:** Must clearly separate the question "*Is X a person?*" (entailing specific rights/dignity) from "*What moral weight does non-person X have?*" (e.g., based on sentience, complexity, ecological role). **Motivation:** Prevents collapsing important distinctions; a severely impaired human remains a person with specific rights, while a highly intelligent, sentient non-person (e.g., an octopus) deserves significant moral consideration but not necessarily *all* person-rights. **Status:** Non-Negotiable (conceptual clarity).
  5.  **Differentiates from Acknowledged Fiction & Legal Fiction:**
      *   *Acknowledged Fiction:* Must explain why responding emotionally to Hamlet doesn't entail treating him as a person with moral claims, unlike responses to an AI companion engineered for the same emotional pull. **Motivation:** Addresses the novelist's specific observation; counterfeits demand *interpersonal* responses *in the real world*, while fiction remains contained within a narrative frame.
      *   *Legal Fiction (e.g., Corporation):* Must distinguish the purely functional, instrumental "personhood" granted for legal/economic purposes from the intrinsic moral personhood of biological humans or potential artificial persons. **Motivation:** Legal personhood is a pragmatic tool lacking the inherent moral weight/dignity requiring protection; conflating them risks commodifying human-like persons. **Status:** Non-Negotiable (prevents dangerous category errors).

  ### Camp-Preference Desiderata

  6.  **Accounts for the "Squandering" Intuition:** Should offer a plausible explanation for the intuition that investing deep care/resources in artificial counterfeits *might* constitute a tragic misdirection or squandering of finite human empathy, *without* necessarily denying the counterfeit's potential moral standing (see Desideratum 4). **Motivation:** Captures a core concern behind Dennett's warning and resonates with observations about human empathy being a limited resource. **Status:** Preference (often held by critics of deep AI companionship).
  7.  **Grounds Personhood in Intrinsic Properties:** Should ideally locate the basis of personhood in intrinsic, stable properties (e.g., specific cognitive architecture, capacity for certain states) rather than *solely* in contingent external relations or recognition. **Motivation:** Provides a more secure anchor for protecting the unconvincing person (Desid. 2) and maintaining continuity (Desid. 3), less vulnerable to societal prejudice or malfunction. **Status:** Preference (common in naturalistic/philosophical accounts).
  8.  **Practically Usable (Ideally):** Should, ideally, offer some guidance usable by ordinary people in navigating relationships and allocating care, without relying on impossible metaphysical knowledge or requiring expert philosophical analysis for daily interactions. **Motivation:** Addresses the practical need for decision-making hinted at in the prompt's closing question. **Status:** Preference (valued by pragmatists).

  ### The Inherent Conflict & Key Excluder

  *   **The Irreconcilable Trio:** Desiderata 2 (Protecting the Unconvincing Person), 7 (Grounding in Intrinsic Properties), and 8 (Practical Usability) **cannot be jointly fully satisfied** by any criterion based *solely* on observable behaviour or eliciting responses.
      *   **Why?** Protecting the unconvincing person *requires* personhood to depend on intrinsic properties (like a specific biological history or potential cognitive architecture) that are often hidden or difficult to discern (undermining usability). A purely practical, response-based criterion (e.g., "treats as a person") would fail Desid. 2 spectacularly, as the unconvincing often *don't* elicit such responses.
      *   **The Upshot:** There is likely **no single, easily applicable criterion** that both **robustly protects all vulnerable humans** (like those with dementia) *and* provides a **simple, foolproof rule for ordinary people** deciding where to invest deep personal caring in ambiguous cases (like advanced AI companions). Protection requires a principle grounded in intrinsic properties (difficult to apply practically), while practical allocation requires heuristics based on interaction (which fail the vulnerable).

  *   **The Key Excluder:** Desideratum 4 (**Distinguishing Personhood from Moral Weight**) does the most to exclude popular candidates. It immediately disqualifies:
      *   Views that *reduce* personhood solely to high moral weight based on sentience or intelligence (they collapse the distinction).
      *   Views that *inflate* the moral weight of non-persons to full person-rights simply because they are sentient or complex (they also collapse the distinction).
      *   It demands that any viable criterion must isolate a specific *kind* of status or set of capacities that warrant the *particular* bundle of rights and dignity associated with personhood, distinct from the significant moral consideration owed to merely sentient beings.

  ### One-Line Verdicts on Popular Candidates

  *   **Behavioural/Turing-Style Test:** Fails catastrophically on Desid. 2 (Unconvincing Person) and Desid. 3 (Continuity if behaviour changes), while struggling with Desid. 1 (non-deceptive counterfeits pass easily) and Desid. 4 (confuses behaviour with status).
  *   **Sentience-Based Condition:** Necessary but insufficient; fails Desid. 4 (many sentient beings aren't persons) and Desid. 5 (doesn't distinguish counterfeits from acknowledged fiction or legal fictions on their own), and offers no inherent protection for Desid. 2 if sentience is impaired.
  *   **Relational/Recognition-Based View:** Fails directly on Desid. 2 (Unconvincing Person) and Desid. 3 (Continuity depends on others' recognition), struggles with Desid. 5 (legal fictions gain status via recognition), and risks making personhood contingent on social acceptance, violating the core protection requirement.
