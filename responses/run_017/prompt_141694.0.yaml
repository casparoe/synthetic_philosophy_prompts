  Okay, the user is a retired geomorphologist who now chairs a county Natural Heritage Review Board. They have to deal with vague bylaws in their conservation designation decisions and have been studying philosophy of vagueness. They want a practical decision procedure that incorporates epistemicist and supervaluationist theories into a checklist for their board. 

  First, I need to unpack their core needs. They need a clear, step-by-step procedure that non-philosophers can use in 30 minutes. The procedure must handle vague terms like "viable breeding population" and "minimal adverse impact," and address scenarios where criteria conflict or cases are borderline. 

  The user mentioned specific challenges: parcels with mixed strengths (e.g., strong on one sub-condition but weak on another), determining if a case is genuinely borderline or just poorly understood, and handling a chain of parcels with minimal differences between them. They also want transparency in how the procedure deals with undecidable cases and how philosophical theories impact practical steps.

  I should start by defining key terms operationally. For instance, "viable breeding population" could be based on ecologist surveys, using thresholds like 10 breeding pairs. "Mature stand" might rely on forest inventory data with specific age/density metrics. Each criterion needs measurable thresholds from available evidence like surveys or maps.

  For conflicting sub-conditions, I think a no-tradeoffs approach is better. If any criterion clearly fails, the application is denied. This avoids arbitrary weighting and aligns with the bylaw's structure. For borderline cases, the procedure should distinguish between insufficient data and genuine vagueness. If evidence is unclear, request more info; if it's inherently vague, use a supervaluationist approach by considering all admissible sharpenings.

  The chain of parcels is tricky. The procedure needs a step comparing adjacent parcels in the docket. If approving one would commit to approving the next with negligible difference, the board must either accept that or justify a discontinuity. This prevents arbitrary decisions based on application order.

  Philosophical differences matter in how undecidable cases are handled. Epistemicism would treat them as having a hidden truth, so better evidence could resolve them. Supervaluationism sees them as genuinely indeterminate, needing a decision rule like a lottery or temporary designation. The user’s board isn’t authorized to set sharpening rules, so they’d need to recommend these to commissioners.

  Testing the procedure on the four cases: the mature forest is a clear yes; the mowed field is a clear no. The borderline woodlot requires a judgment call—maybe a time-bound approval due to the expiring option. The riparian chain forces explicit comparison: if 40m is approved, 38m likely must be too unless a clear threshold is justified.

  Key flaws: borderline cases still need judgment, and the board can’t fix rules without commissioners. The procedure can’t eliminate vagueness but makes it manageable and transparent. The user might dislike the woodlot outcome if it feels arbitrary, but the process justifies it through documented reasoning.
answer: |-
  Below is a structured decision procedure for your board, designed to operationalize vagueness while respecting legal constraints. It incorporates epistemicist/supervaluationist insights pragmatically, prioritizes defensibility over philosophical purity, and includes mechanisms for chains and indeterminacy. Key features: **no tradeoffs** (clear failure on any *core* criterion sinks application), **evidence-based thresholds**, and **explicit handling of borderline cases**.

  ---

  ### **Natural Heritage Review Board Decision Procedure**  
  *(Version 1.0 – Operationalizing Vagueness)*  
  **Time Allocation:** 30 minutes/case | **Input:** Site file + Ecologist memo  

  #### **I. PRELIMINARY STEPS**  
  1. **Identify Core Criteria** (from Bylaw):  
     - **A.** Viable breeding population of species of concern  
     - **B.** Mature stand  
     - **C.** Substantial hydrological connection to river corridor  
     - **D.** Proposed activity has ≤ minimal adverse impact  

  2. **Load Precedents:**  
     - Attach list of 3 most similar APPROVED/DENIED parcels from past 24 months.  
     *// Uses board’s institutional memory; updated quarterly by staff*  

  ---

  #### **II. DECISION CHECKLIST**  
  *(Follow order; stop if any criterion fails)*  

  **CRITERION A: VIABLE BREEDING POPULATION**  
  - **Evidence:** Ecologist’s species survey + peer-reviewed viability thresholds for species.  
  - **Threshold:** ≥10 breeding pairs OR scientifically defensible viability metric (e.g., genetic diversity index).  
  - **Judgment:** If count = 8–12 pairs → **Borderline**. Else: Pass (≥13) / Fail (≤7).  
  - **Sub-condition Conflict:** *No tradeoff*. Failure on population size fails A, even if habitat perfect.  

  **CRITERION B: MATURE STAND**  
  - **Evidence:** Forest inventory maps, aerial photos (≥30 yrs), diameter-at-breast-height (DBH) data.  
  - **Threshold:** ≥50% canopy cover + ≥60% trees >DBH threshold for species (e.g., 25cm for hardwoods).  
  - **Judgment:** If 45–55% cover OR borderline DBH → **Borderline**. Else: Pass/Fail.  
  - **Sub-condition Conflict:** *No tradeoff*. Young stand with high density still fails.  

  **CRITERION C: SUBSTANTIAL HYDROLOGICAL CONNECTION**  
  - **Evidence:** USGS soil maps, floodplain delineation, distance-to-river GIS data.  
  - **Threshold:** Within 100-year floodplain OR perennial stream on site OR <50m to river.  
  - **Judgment:** If 51–60m OR ephemeral drainage → **Borderline**. Else: Pass/Fail.  

  **CRITERION D: MINIMAL ADVERSE IMPACT**  
  - **Evidence:** Project plans, stormwater runoff models, ecologist’s impact assessment.  
  - **Threshold:** No habitat fragmentation, >90% pre-development infiltration rate, no listed species displaced.  
  - **Judgment:** If 85–90% infiltration OR minor fragmentation → **Borderline**. Else: Pass/Fail.  

  ---

  #### **III. RESOLVING BORDERLINES & CHAINS**  
  *(After checklist)*  

  5. **Borderline Diagnosis:**  
     - **If evidence ambiguous** (e.g., poor survey methods): Table for 2 weeks; request better data.  
     - **If evidence clear but result borderline** (e.g., 52m buffer): Proceed to Step 6.  

  6. **Chain Test (Sorites Defense):**  
     - Compare parcel to nearest adjacent in docket *by metric in question* (e.g., buffer width).  
     - If difference ≤2% (e.g., 40m vs. 38m buffers) AND precedent suggests equivalence:  
       - **Option 1:** Approve/Deny both consistently.  
       - **Option 2:** Justify discontinuity *in writing* (e.g., "38m crosses sediment retention threshold").  
     - *// Forces explicit acknowledgment of chains*  

  7. **Undecidable Case Protocol:**  
     - If ≥2 criteria borderline OR chain test inconclusive:  
       - **Epistemicist path:** "Answer unknown; insufficient evidence." Request extended study.  
       - **Supervaluationist path:** "Criteria indeterminate; applying decision rule." Use:  
         ```  
         Temporary designation (18 months) + Required monitoring → Automatic review.  
         ```  
     - *// Board must pre-commit to one path annually (see Theory Table)*  

  ---

  #### **IV. OUTPUTS**  
  - **Clear Approval:** Pass all criteria non-borderline.  
  - **Clear Denial:** Fail ≥1 criterion non-borderline.  
  - **Borderline Outcome:** Issue "Temporary Designation" (if Supervaluationist) or "Insufficient Evidence" finding (if Epistemicist).  
  - **Referral to Commissioners:** If new rule needed (e.g., defining "viable" for new species).  

  ---

  ### **THEORY IMPLEMENTATION GUIDE**  
  | **Step**               | Epistemicist Adjustment          | Supervaluationist Adjustment       |  
  |------------------------|----------------------------------|------------------------------------|  
  | **Borderline Label**   | "We cannot know if it meets X"   | "X is neither true nor false"      |  
  | **Undecidable Action** | Demand better evidence; no designation | Apply temporary rule               |  
  | **Chain Justification**| "A boundary exists but is hidden"| "No sharp boundary; we draw a line"|  
  | **Authority Issue**    | Recommend thresholds to Commissioners | Recommend admissible sharpenings |  

  **Critical Divergence:**  
  - **Written Findings:** Epistemicism requires "evidence inconclusive"; Supervaluationism allows "critically vague" + rule application.  
  - **Applicant Guidance:** Epistemicism invites new evidence; Supervaluationism states evidence irrelevant to vagueness.  

  ---

  ### **CASE APPLICATIONS**  
  **Case 1: 240-ha Mature Forest (14 warblers)**  
  - A: Pass (14>13) | B: Pass (old-growth) | C: Pass (adjacent river) | D: Pass (low-impact trail)  
  - **Output:** Clear Approval. *// No judgment needed*  

  **Case 2: Mowed Field (Drainage Ditch)**  
  - A: Fail (no species) | B: Fail (no trees) → **Stop**.  
  - **Output:** Clear Denial.  

  **Case 3: 11-ha Borderline Woodlot (Option expires)**  
  - A: Pass (12 pairs) | B: Borderline (52% cover) | C: Fail (62m buffer → no connection)  
  - **Output:** Clear Denial (C failed). *// You may dislike this—no tradeoffs!*  

  **Case 4: Riparian Chain (40m, 38m, 36m, 34m, 32m)**  
  - **40m:** Pass C (≥50m buffer precedent).  
  - **38m:** Borderline C → **Chain Test:** 40m vs. 38m (5% difference).  
    - If precedent approves 40m: MUST approve 38m or justify discontinuity (e.g., "38m < erosion control threshold").  
  - **32m:** Likely denial unless ecologist shows equivalence.  
  - **Judgment Relocation:** From arbitrary voting to justifying breaks in chains.  

  ---

  ### **PROCEDURE LIMITATIONS AFTER 1 YEAR**  
  1. **False Negatives:** "No tradeoffs" rule will deny worthy parcels with one weak criterion.  
  2. **Temporary Designation Backlog:** Supervaluationist path may accumulate reviews.  
  3. **Chain Pressure:** Justifying discontinuities could become politically contentious.  
  4. **Threshold Rigidity:** Pre-set thresholds may misapply to novel ecosystems.  
  5. **Commissioner Dependence:** Without adopted sharpenings, borderline cases recur.  

  **Recommendation to Board:**  
  - Adopt **Supervaluationist path** (temporary designations handle indeterminacy practically).  
  - Publish **Admissible Sharpenings Sheet** annually (e.g., "For C: buffers 45–55m = borderline").  
  - **Lobby Commissioners** quarterly to codify thresholds based on board recommendations.  

  This procedure makes vagueness manageable by converting philosophical problems into documented operational choices—turning Tuesday night debates into consistent, defensible rulings.
