prompt: |-
  I teach a graduate seminar on formal epistemology, and I have just finished a blind first pass at the midterm. The exam was open-book but written under time pressure, and I wrote Question 3 myself, so I know where I meant the traps to be — which is exactly why I would like an independent read before I commit to comments. The course has covered Bayesian confirmation theory up to the problem of old evidence, the two main families of response (the language-change strategy usually associated with Garber, and the counterfactual, or "ur-prior," strategy), and the standard objections to each. The rubric I circulated tells students that credit depends on being explicit about which assumption is doing the work in an argument, and that no credit is reserved for attaching a name or a date to a view.

  The question, as it appeared on the exam:

  **Question 3.** (a) State the problem of old evidence for Bayesian confirmation theory, and identify precisely which assumption generates it: the agent's certainty in the evidence, the entailment from theory to evidence, the choice of confirmation measure, or something else. Illustrate with one case. (b) Present the language-change strategy and the counterfactual strategy. For each, state what the agent is supposed to conditionalize on, and state the objection you take to be most serious. (c) Does either strategy succeed? Defend your verdict, and say what would follow for Bayesian confirmation theory if neither did.

  One submitted answer, transcribed verbatim with the student number removed:

  **(a)** Suppose I have been certain of *e* for years, so *P*(*e*) = 1, and a new theory *T* comes along that deductively entails *e*. The stock example is the advance of Mercury's perihelion and general relativity: the data were in hand decades before the theory was. Intuitively *e* confirms *T*. But on the Bayesian model confirmation is a matter of conditionalizing on the evidence, and

  *P*(*T* | *e*) = *P*(*T*)*P*(*e* | *T*)/*P*(*e*) = *P*(*T*) · 1/1 = *P*(*T*),

  since *T* ⊨ *e* gives *P*(*e* | *T*) = 1 and my certainty gives *P*(*e*) = 1. So conditionalizing does nothing: the ratio *P*(*T* | *e*)/*P*(*T*) is exactly 1, and no confirmation accrues. The difficulty is generated by the two assumptions I have just used together, strict entailment and certainty. Where a theory does not entail *e* but merely makes it probable, we compare *P*(*e* | *T*) with *P*(*e* | ¬*T*), and the likelihood ratio *P*(*e* | *T*)/*P*(*e* | ¬*T*) can exceed 1 even when I am certain of *e*, so the merely probabilistic case escapes. The problem is therefore a problem about strict entailment and about the ratio measure of confirmation; it does not threaten Bayesianism as such.

  **(b)** The first strategy changes the language. My certainty in *e* is certainty about *e* as expressed in my old language; it need not carry over to the enriched language in which *T* is formulable. So I add to my language a sentence expressing the logical connection between them — the material conditional *T* ⊃ *e* — assign it a prior strictly between 0 and 1, and then, when I sit down and work through the derivation, conditionalize on it: *P*(*T* | *T* ⊃ *e*) > *P*(*T*). The trouble is that I now have to assign priors to indefinitely many such sentences, and it is hard to see what could constrain them; the resulting "confirmation" then looks like an artefact of my own logical laziness rather than a relation between the theory and the phenomenon.

  The second strategy changes the prior instead. Let *P* be the credence function I would have had before I learned *e*. The confirmation *e* confers on *T* is the shift from *P*(*T*) to *P*(*T* | *e*) — that is, to my actual present credence in *T* — and this can be positive even though my real credence in *e* is now 1. The objection is that *P* is indeterminate: there is no fact of the matter about what I would have thought had I not known *e*. Had I not known the perihelion figures, would I even have had the conceptual resources to formulate *T*? The counterfactual prior depends on how the counterfactual situation is filled in, so the strategy replaces one arbitrary number with another.

  **(c)** Neither succeeds: the first makes confirmation depend on ignorance, the second on a counterfactual state that nothing fixes. And these are the only two options, since a Bayesian has just two things to adjust, the language or the prior. So the old-evidence problem is best read not as a puzzle inside Bayesian confirmation theory but as a reductio of it: what confirms a theory is that it *explains* the evidence, and explanation is not a probabilistic relation.

  What I want from you is a mark out of 25 with a breakdown by part, plus the marginal comments you would actually write on the script — comments keyed to particular lines or steps, not general impressions, each saying whether it costs the student anything and why. I am especially interested in steps that look fine on a first reading and do not survive a second: claims that are false given the student's own earlier assumptions, inferences that need a qualification the student never supplies, and distinctions the student draws that do not in fact mark a difference. Where the student reaches a conclusion you agree with by a route you would not accept, say so rather than crediting the conclusion, and tell me whether the slip is a local one or the kind of misunderstanding that will resurface later in the term, when we get to Bayesian treatments of explanation and to the problems that arise for them. If you think the strongest thing in the answer is something other than what I have implicitly flagged above, tell me that too. One last thing, which is my own preoccupation rather than the student's: I have been working on a variant of the problem in which the agent's certainty in *e* is not the residue of any learning event at all, because *e* is a hinge in roughly Wittgenstein's sense — something held fast rather than believed on the strength of evidence. If a remark about that case belongs in the feedback to this student, tell me where you would place it and roughly how you would phrase it; if you think it belongs nowhere near this script, say that instead.
reasoning: |-
  Okay, I need to evaluate this student's answer to a formal epistemology exam question. The professor wants a detailed breakdown with marks and specific comments. Let me understand the question and the student's response thoroughly.

  The question has three parts: (a) state the problem of old evidence and identify the key assumption, (b) present two strategies with objections, and (c) evaluate whether either succeeds. The student's answer argues that both strategies fail and concludes Bayesianism is refuted.

  For part (a), the student correctly identifies certainty and entailment as jointly causing the problem. They use the Mercury perihelion example well. But they mistakenly claim probabilistic cases escape the problem - this is incorrect because even with probabilistic evidence, certainty (P(e)=1) still blocks confirmation. That's a significant error that needs pointing out.

  In part (b), the language-change strategy is described accurately with the material conditional approach. Their objection about arbitrary priors is valid. For the counterfactual strategy, they correctly note the indeterminacy problem. However, they miss that the counterfactual strategy doesn't require changing priors but rather using an "ur-prior" before learning e. This subtle misunderstanding should be noted.

  Part (c) is where the student goes most wrong. Their claim that "these are the only two options" ignores other approaches like Jeffrey conditionalization or historical responses. Their conclusion that Bayesianism is refuted ignores that many Bayesians see this as a solvable puzzle. The "explanation isn't probabilistic" claim is unsupported and contradicts later course topics.

  The professor also asks about Wittgensteinian hinges. This seems relevant because the student's certainty framing in (a) could connect to non-evidential certainty. I'd suggest noting in feedback how some philosophers extend the problem to such cases, though it's not essential here.

  For grading: Part (a) has one major error but is otherwise good (5/10). Part (b) is stronger despite minor issues (8/10). Part (c) is weak with multiple problems (3/5). Total 16/25. Comments should focus on the probabilistic escape fallacy, the ur-prior misunderstanding, and the premature rejection of Bayesianism - all points that might resurface when discussing explanation later.
answer: |-
  Below is a detailed assessment of the student's answer, with a mark breakdown, specific marginal comments keyed to the text, and feedback on conceptual errors, strengths, and implications for later course material. The total mark is **16/25**, distributed as follows: **(a) 5/10, (b) 8/10, (c) 3/5**.  

  ### Marginal Comments (Keyed to Specific Lines)  
  *(Page/line references assume the transcribed answer is paginated as a single page; adjust as needed.)*  

  **On (a):**  
  - *"The stock example is the advance of Mercury's perihelion..."*  
    **✓ Good example choice** — historically apt and clearly illustrates the tension. No cost.  
  - *"The difficulty is generated by the two assumptions... strict entailment and certainty."*  
    **✓ Correct identification** of the joint necessity of entailment and certainty. No cost.  
  - *"Where a theory does not entail e but merely makes it probable... the merely probabilistic case escapes."*  
    **✗ Major error (costs 3 points)**. False claim. If \(P(e) = 1\) (certainty), then \(P(e \mid T) = 1\) and \(P(e \mid \neg T) = 1\) (since \(P(e) = 1\) implies \(e\) is true in all scenarios). Thus, the likelihood ratio \(P(e \mid T)/P(e \mid \neg T) = 1/1 = 1\), and *no confirmation occurs* even probabilistically. The escape requires \(P(e) < 1\), but the problem assumes certainty. This undermines the claim that probabilistic cases avoid the issue. *(Local slip, but may resurface when discussing Jeffrey conditionalization.)*  
  - *"The problem is therefore a problem about... the ratio measure of confirmation."*  
    **✗ Minor error (costs 2 points)**. The ratio measure is irrelevant; the zero-confirmation result holds for *any* standard Bayesian measure (e.g., difference, likelihood ratio) when \(P(e) = 1\). The core issue is rigidity of probability under certainty. *(Local slip, but reflects misprioritization.)*  

  **On (b):**  
  - *"I add to my language a sentence expressing the logical connection... the material conditional \(T \supset e\)."*  
    **✓ Accurate description** of the language-change strategy. No cost.  
  - *"The trouble is that I now have to assign priors to indefinitely many such sentences... an artefact of my own logical laziness."*  
    **✓ Strong objection** — correctly notes the arbitrariness/indeterminacy in priors for logical truths. No cost.  
  - *"The second strategy changes the prior instead. Let \(P\) be the credence function I would have had before I learned \(e\)."*  
    **✓ Correct core idea**, but **✗ misleading phrasing (costs 1 point)**. The strategy uses an "ur-prior" (a hypothetical, logically omniscient prior *before any evidence*), not merely the agent’s historical prior. Misdescribing it as "the credence I would have had" invites the later objection about conceptual resources but slightly misrepresents the strategy’s intent. *(Local slip.)*  
  - *"The objection is that \(P\) is indeterminate... would I even have had the conceptual resources to formulate \(T\)?"*  
    **✓ Valid objection** — highlights the underdetermination of counterfactual priors. No cost.  

  **On (c):**  
  - *"Neither succeeds: the first makes confirmation depend on ignorance, the second on a counterfactual state that nothing fixes."*  
    **✓ Fair summary** of the objections raised in (b). No cost.  
  - *"And these are the only two options, since a Bayesian has just two things to adjust, the language or the prior."*  
    **✗ Major error (costs 1 point)**. False dichotomy. Other responses exist: e.g., Jeffrey conditionalization (updating on *the discovery of an entailment*, not \(e\) itself), or the historical approach (treating \(e\) as *initially uncertain*). The claim that "only two options" exist ignores these, weakening the argument. *(May resurface in later discussions of non-dogmatic Bayesianism.)*  
  - *"So the old-evidence problem is best read not as a puzzle... but as a reductio of it."*  
    **✗ Overreach (costs 1 point)**. While the objections are serious, declaring Bayesianism refuted ignores that many Bayesians (e.g., Howson, Earman) view this as a *solvable* technical puzzle. The verdict lacks nuance.  
  - *"What confirms a theory is that it explains the evidence, and explanation is not a probabilistic relation."*  
    **✗ Unsupported and off-track (costs 1 point)**. The conclusion appeals to explanation without argument, but the course has not yet covered Bayesian accounts of explanation (e.g., unificationist or causal-Bayesian approaches). This risks prejudging future material. *(Likely to resurface when discussing explanation.)*  

  ### Summary Mark Breakdown  
  - **(a) 5/10**: Correct example and joint assumptions, but major error on probabilistic escape + minor error on confirmation measures.  
  - **(b) 8/10**: Strong grasp of both strategies and core objections; minor cost for misdescribing the ur-prior.  
  - **(c) 3/5**: Valid summary of objections, but points deducted for false dichotomy, overreach, and unsupported appeal to explanation.  
  - **Total: 16/25** (Adequate but with significant gaps).  

  ### Additional Feedback for the Professor  
  - **Strongest element**: The objections in (b) are incisive and well-articulated, especially the critique of arbitrary priors in language-change.  
  - **Weakest element**: The claim in (a) that probabilistic cases "escape" the problem—this exposes a deep misunderstanding of probability-1 propositions.  
  - **On your Wittgensteinian hinge case**: A marginal comment **belongs in (a)** after the certainty discussion. Phrasing:  
    *"Note: Some philosophers (e.g., Wright) extend this problem to 'hinges' (e.g., logical/mathematical truths) where \(P(e) = 1\) arises from non-evidential certainty. Does your account cover these?"*  
    This is relevant but not urgent, as the student’s errors are foundational. Omission is fine here.  

  ### Prognosis for Later Material  
  The student’s errors are mostly local (e.g., misstating the ur-prior, false dichotomy), but two may resurface:  
  1. **The probability-1 fallacy** in (a) may hinder understanding of *Jeffrey conditionalization* (where updates avoid certainty).  
  2. **The unsupported "explanationist" conclusion** in (c) may clash with Bayesian treatments of explanation (e.g., when discussing Kitcher’s unificationism or inference to the best explanation).  

  This answer shows strong critical engagement but lacks technical precision in key areas. Focus feedback on shoring up the Bayesian fundamentals before moving to explanation.  

  ---  
  **Final Mark: 16/25**  
  *Marginal comments are designed for direct ink-on-paper use; adjust tone/formality as needed.*
