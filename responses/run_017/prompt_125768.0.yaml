prompt: |-
  I run a fortnightly reading group of about fifteen machine-learning researchers — fluent in probability, almost no philosophy — and I have one ninety-minute session, whiteboard only and no pre-reading, to get them from zero to the result that an evidential decision theorist, in a world large enough to contain many agents relevantly similar to itself, can be rationally required to cooperate in a one-shot Prisoner's Dilemma against a stranger. I don't need the lecture written; I need the plan for it.

  Give me the order in which the components have to arrive and why each depends on the ones before it: the gap between an act's evidential bearing on an outcome and its causal influence on it; the one-shot dilemma and why plain dominance reasoning says defect; the population picture, in which your decision is a draw from a distribution over agent-types and so tells you something about the other draws; and the threshold inequality, in closed form, relating how strong the similarity-based correlation must be to the ratios in the payoff matrix. Then give me the one example that should carry the whole session, together with the constraints it has to satisfy and what each buys: no predictor or Newcomb-style apparatus, no repetition and no shadow of the future, no literal duplicates — similarity must be graded and statistical — and the correlation must be something the audience can read off the setup rather than take on stipulation.

  I expect a specific set of misconceptions and want each defused at a stated point in the sequence, not at the end: that this is the iterated dilemma under another name; that the agent is treating its own action as bringing about the other's; that exact copies make the answer trivial because there is really only one agent; that the agent can manufacture the correlation by deciding; and that the result either vindicates evidential decision theory generally or is explained by the world being large, rather than by the correlation structure it happens to contain.

  Tell me where to place the case I take to be the real test: a population that is half mimics, who do what you do, and half contrarians, who do the opposite, with you unsure which you face, so that the correlation nets out to zero. What is that case for, and what should the group be able to say about it when they leave? Finally, give me one closing question whose answer separates someone who has the mechanism from someone who has only the slogan that your action is evidence about what similar agents do, and say what I should openly decline to settle in ninety minutes — including which decision theory is correct, and what an agent who is already certain what it will do is even supposed to condition on.
reasoning: |-
  We are teaching a group of machine-learning researchers about a one-shot Prisoner's Dilemma (PD) where evidential decision theory (EDT) can recommend cooperation. The key is to establish that in a large population with correlated agent-types, the evidence provided by one's own action about the actions of similar others can make cooperation rational. We avoid Newcomb-like predictors, repetition, exact duplicates, and any stipulation of correlation without a clear mechanism.

  Plan:

  1. **Motivate the gap between evidential and causal influence (15 minutes)**
     - Start with a simple medical example: Suppose you are deciding whether to take a drug that is correlated with recovery but does not cause it (because the drug is only taken by healthy people). The evidential effect is positive, but causal effect is zero. This illustrates that evidential reasoning can differ from causal.
     - **Why?** We need to establish that EDT and CDT (causal decision theory) can diverge. This sets the stage for the PD where EDT might recommend cooperation while CDT (via dominance) recommends defection.

  2. **Introduce the one-shot Prisoner's Dilemma (10 minutes)**
     - Standard PD: Two players, each chooses Cooperate (C) or Defect (D). Payoffs: mutual cooperation (R) > mutual defection (P); but if one cooperates and the other defects, the defector gets T (temptation) and the cooperator gets S (sucker). So: T > R > P > S, and 2R > T+S (to prevent alternating from being better).
     - Dominance argument: Whatever the other does, defecting gives a better payoff (if other cooperates: T>R; if other defects: P>S). So rational agents should defect.
     - **Why?** This is the standard view. We are setting up the puzzle: why might EDT not follow dominance?

  3. **The population picture and correlation via agent-types (20 minutes)**
     - Imagine a large population of agents. Each agent has a type that determines their behavior in the PD. The types are fixed (or drawn from a distribution) and may be correlated. When you are in a PD, both you and your opponent are drawn from this population (with replacement? without? actually, we'll draw independently from the same distribution, but with correlation due to shared type-distribution).
     - Key: Your own type determines your action. But because the types in the population are correlated, knowing your own type (and hence your action) gives you evidence about the distribution of types and hence about the likely action of another randomly drawn agent (your opponent).
     - **Why?** We are building the setting: the world is big and the agents are similar in a way that induces correlation. This is the core of the argument.

  4. **Threshold inequality (15 minutes)**
     - Let the payoff matrix be:
          C       D
       C (R, R) (S, T)
       D (T, S) (P, P)
     - We consider an agent using EDT: they choose the action that maximizes expected utility conditional on that action.
     - Let A be the agent's own action (C or D). Let B be the opponent's action.
     - The expected utility of action A is: 
          EU(A) = P(B=C | A) * R + P(B=D | A) * S   [if A=C]
          EU(A) = P(B=C | A) * T + P(B=D | A) * P   [if A=D]
     - We want to know when EU(C) > EU(D).
     - This becomes: 
          R * P(B=C | C) + S * (1 - P(B=C | C)) > T * P(B=C | D) + P * (1 - P(B=C | D))
     - Rearrange:
          (R - S) * P(B=C | C) + S > (T - P) * P(B=C | D) + P
          => (R - S) * P(B=C | C) - (T - P) * P(B=C | D) > P - S
     - Note: P - S is positive (since P>S) and (R-S) is positive, (T-P) is positive.
     - We need to relate P(B=C | C) and P(B=C | D). In the independent case, they are equal (to the base rate of cooperation) and we get the dominance argument. But if there is correlation, then P(B=C | C) might be higher than P(B=C | D). In fact, we can define the strength of correlation by the difference between these two.
     - Let q = P(B=C | C) and r = P(B=C | D). The inequality becomes:
          (R-S) q - (T-P) r > P - S
     - We can also express the base rate: Let p = P(B=C). Then by law of total probability: p = q * P(A=C) + r * P(A=D). But note that the agent is conditioning on their own action, so we need to model the joint distribution.

     Alternatively, we can use a more structural model. Suppose the agent's type is drawn from a distribution. We can model the correlation by the probability that the opponent is of the same type (or similar enough to copy). But we need a graded similarity? Actually, for the threshold we can work with the conditional probabilities.

     - The key point: if the correlation is strong enough, then q is high and r is low, and the inequality can hold.

  5. **Core example (20 minutes)**
     - We need an example without predictors, without repetition, without exact duplicates, and the correlation must be built-in and natural.
     - Example: 
          Imagine that the population is divided into groups (e.g., by geography, culture, etc.). Within each group, the agents are similar. The groups have different cooperation rates. You are randomly assigned to a group at birth, and then you and your opponent are randomly drawn from the entire population. However, because of the group structure, if you are in a group that tends to cooperate, then both you (if you cooperate) and a randomly drawn opponent from the same group are more likely to cooperate. But note: you and your opponent are drawn independently? Actually, we can have: you are both drawn from the same group? Or independently from the entire population? We want the correlation to come from the shared group.

     - Revised to avoid exact duplicates: 
          The world has many groups. Each group has a fixed "cooperation level" which is the probability that a member of that group cooperates in the PD. The groups are of equal size. The cooperation level of a group is drawn from a distribution (say, uniform on [0,1]). Then, each agent in the group independently flips a biased coin with their group's cooperation level to decide C or D.

          Now, you are an agent. You are in a group, but you don't know your group's cooperation level. You only know the overall distribution. You are about to play against a randomly selected agent from the entire population.

     - How does your action give evidence about your group's cooperation level? 
          If you decide to cooperate, that suggests your group's cooperation level is high (because you are more likely to have cooperated if the group level is high). Similarly, if you defect, it suggests the group level is low. Then, since your opponent is from the same group? Wait, no: the opponent is from the entire population. But if groups are large, then the chance that your opponent is from the same group is low. We need to adjust.

     - Better: You and your opponent are both drawn from the same group? Then we have strong correlation. But then if the group is large, you are independent given the group? Actually, conditional on the group, the actions are independent. But unconditionally, they are correlated.

     - We can set: You and your opponent are drawn from the same group (which is randomly selected). Then, conditional on the group's cooperation level p, the probability that you cooperate is p, and so is your opponent. But you don't know p. Then:
          P(opponent cooperates | you cooperate) = E[p^2] / E[p]   [by Bayes]
          Similarly, P(opponent cooperates | you defect) = E[p(1-p)] / E[1-p]

          For example, if p is uniform on [0,1]:
            E[p] = 1/2, E[p^2] = 1/3, so P(opponent cooperates | you cooperate) = (1/3)/(1/2)=2/3.
            E[1-p] = 1/2, E[p(1-p)] = E[p] - E[p^2] = 1/2 - 1/3 = 1/6, so P(opponent cooperates | you defect) = (1/6)/(1/2)=1/3.

          Then we can plug into the inequality.

          Payoffs: Let R=3, T=5, S=0, P=1. Then:
            EU(C) = (2/3)*3 + (1/3)*0 = 2
            EU(D) = (1/3)*5 + (2/3)*1 = 5/3 + 2/3 = 7/3 ≈ 2.333 > 2? Then defection is still better.

          We need stronger correlation? Or different payoffs? Or a different distribution of p?

          Alternatively, we can make the groups have fixed types: some groups are all-cooperate, some are all-defect. Then if p is the fraction of cooperative groups, then:
            P(opponent cooperates | you cooperate) = 1 (because if you cooperated, you must be in a cooperative group, so opponent cooperates)
            P(opponent cooperates | you defect) = 0? (if you defect, you are in a defective group, so opponent defects) then:
            EU(C) = 1*3 + 0*0 = 3
            EU(D) = 0*5 + 1*1 = 1
            So 3>1 -> cooperate.

          But then we have exact duplicates? Not exactly: all members of a group are identical? Then if the group is large and you are playing against a member of the same group, then they are identical to you? But we want graded similarity.

     - We need a model without exact duplicates. How about: each group has a latent variable p (cooperation level) and you and your opponent are drawn independently from the same group. Then the actions are independent given p, but unconditionally correlated. We already did that with p uniform and got 2/3 and 1/3. We can adjust the payoffs: let R=4, T=5, S=0, P=1. Then:
          EU(C) = (2/3)*4 + (1/3)*0 = 8/3 ≈ 2.666
          EU(D) = (1/3)*5 + (2/3)*1 = 5/3+2/3=7/3≈2.333 -> then EU(C)>EU(D)

          So with R=4, T=5, S=0, P=1, and the group model with p~Uniform[0,1], we have cooperation being better.

     - Alternatively, we can use a different distribution for p. For example, if we have two types of groups: 50% of groups have p=0.9 and 50% have p=0.1. Then:
          Base rate: p = 0.5
          P(opponent cooperates | you cooperate) = P(you in high group | you cooperate) * 0.9 + P(you in low group | you cooperate) * 0.1
          By Bayes: 
              P(high | C) = P(C|high)*P(high)/P(C) = 0.9*0.5 / (0.9*0.5 + 0.1*0.5) = 0.45/0.5 = 0.9
              So P(opponent cooperates | you cooperate) = 0.9 * 0.9 + 0.1 * 0.1 = 0.81 + 0.01 = 0.82
          Similarly, P(opponent cooperates | you defect) = P(high | D)*0.9 + P(low | D)*0.1
              P(high | D) = P(D|high)*0.5 / P(D) = 0.1*0.5 / (0.5) = 0.05/0.5=0.1
              So = 0.1*0.9 + 0.9*0.1 = 0.09+0.09=0.18

          Now with R=3, T=5, S=0, P=1:
            EU(C)=0.82*3 + 0.18*0 = 2.46
            EU(D)=0.18*5 + 0.82*1 = 0.9 + 0.82 = 1.72 -> then 2.46>1.72, so C is better.

          So we can use this.

     - We'll use the two-group example for simplicity. The correlation is built by the group structure and the fact that you and your opponent are from the same group. But note: we did not require exact duplicates. The group has a fixed p, so agents in the same group are independent given p, but unconditionally correlated. And the group assignment is the shared factor.

     - **Why this example?** It satisfies the constraints: no predictor, no repetition, no exact duplicates (because within a group, agents are independent and not identical). The correlation is read off the setup: if you cooperate, it's more likely you are in a high-cooperation group, so it's more likely your opponent (from the same group) cooperates.

  6. **Addressing misconceptions during the session**

     a) **That this is the iterated dilemma under another name.**
        - When: After introducing the population picture (step 3).
        - Defuse: Emphasize that there is no repeated interaction. The agents meet only once. The correlation comes from the pre-existing population structure, not from future interactions.

     b) **That the agent is treating its own action as bringing about the other's.**
        - When: When explaining the conditional probabilities (step 4).
        - Defuse: Stress that the agent's action does not cause the other's. It is evidence about the other's because of the shared group (or shared type). The group is the common cause.

     c) **That exact copies make the answer trivial because there is really only one agent.**
        - When: When presenting the core example (step 5).
        - Defuse: In the example, we have groups with varying cooperation rates, and within a group, agents are independent (so not copies). The group structure creates a statistical correlation without requiring identity.

     d) **That the agent can manufacture the correlation by deciding.**
        - When: When discussing the threshold inequality (step 4) and the core example (step 5).
        - Defuse: The correlation is fixed by the population structure and the agent's type. The agent's action reveals information but does not change the type. So the agent cannot change the correlation by acting.

     e) **That the result either vindicates EDT generally or is explained by the world being large.**
        - When: After presenting the threshold inequality and the core example (steps 4 and 5).
        - Defuse: The result does not show that EDT is always correct. It shows that in worlds with certain correlation structures, EDT can recommend cooperation in the one-shot PD. Also, the world being large is not the key per se; it allows for the statistical correlation to be present. But the key is the existence of the correlation, not the size. A small world with correlation would work too (if we have two groups, each with two agents, that's small). However, we use a large world to make the statistical model natural.

  7. **The case with half mimics and half contrarians (10 minutes)**
     - Place after the core example (step 5) and before the closing.
     - Setup: The population is half mimics (who do whatever you do) and half contrarians (who do the opposite). You don't know which you face. Then:
          P(opponent cooperates | you cooperate) = P(mimic) * 1 + P(contrarian) * 0 = 0.5
          P(opponent cooperates | you defect) = P(mimic) * 0 + P(contrarian) * 1 = 0.5
          Then the conditional probabilities are the same regardless of your action. So the evidential expected utilities become:
            EU(C) = R * 0.5 + S * 0.5
            EU(D) = T * 0.5 + P * 0.5
          And then because T>R and P>S, EU(D) > EU(C). So EDT recommends defection.
     - What it is for: To show that the correlation must be structured in a way that makes P(B=C|A=C) > P(B=C|A=D). In this case, the correlation nets to zero (because the two types cancel). The group should leave understanding that the result depends on the correlation being positive (so that cooperating is evidence that the other cooperates) and not just any correlation.

  8. **Closing question (5 minutes)**
     - Question: "Suppose we change the group structure so that groups are very small, say two agents per group. Then, if you are paired with the other agent in your group, and you know that the two of you are drawn from a population of groups with varying cooperation levels. Now, if you cooperate, what does that tell you about the other agent in your group? And how does that affect the expected utility of cooperation versus defection?"
     - Why: This tests the understanding of the mechanism. The agent who understands should say: 
          - Since the group has a fixed cooperation level p (unknown to the agent), and both agents are independent given p, then if I cooperate, it increases the likelihood that the group has a high p, and hence that the other agent is likely to cooperate. The calculation is the same as in the large group case? Actually, in a two-agent group, if I cooperate, then the other agent's probability of cooperating is P(B=C|A=C) = E[p^2]/E[p] (if the group's p is drawn from the same prior) which is the same as in the large group case? So the mechanism is the same. 

     - However, if the group has exactly two agents and they are the only ones, then the other agent is fixed? Not exactly: the group's p is the probability that an agent in the group cooperates. Then the two agents are independent Bernoulli(p). So the calculation is the same. Therefore, the expected utilities are the same. So even in a small group, if the group's p is unknown, the evidential reasoning applies.

  9. **What to openly decline to settle (5 minutes)**
     - We are not settling which decision theory is correct. We are showing that EDT can recommend cooperation in a one-shot PD when there is an appropriate correlation structure.
     - We are also not settling what an agent who is already certain what it will do is supposed to condition on. (This is the problem of conditioning on an action that you are certain of, which is tricky for EDT. We can note that in our model, the agent is uncertain of their own type until they decide? Actually, we are modeling the decision as if the agent is conditioning on the action. But if the agent is already certain, then the conditional probabilities might collapse. We avoid this by assuming the agent is making a decision and so is considering counterfactual actions.)

     - Also, we are not going into the philosophical debate about whether the correlation structure is realistic or rational to believe in.

  Total: 15+10+20+15+20+10+5+5 = 100 minutes. We'll have to trim or adjust timing.

