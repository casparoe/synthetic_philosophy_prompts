  Execution:

  1. Start with the medical example to show evidential vs causal (10 min).
  2. Present the PD and dominance (5 min).
  3. Population picture and correlation (15 min): explain the group model (without numbers) and why your action is evidence about the opponent.
  4. Threshold inequality (15 min): derive the condition for cooperation being better under EDT.
  5. Core example (20 min): the two-group model (with p=0.9 and p=0.1) and show the numbers. Address misconceptions during the example.
