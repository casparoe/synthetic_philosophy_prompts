answer: |-
  ### Lecture Plan: Evidential Cooperation in One-Shot Prisoner's Dilemma

  **Total Time:** 90 minutes  
  **Audience:** 15 ML researchers (strong probability, minimal philosophy)  
  **Format:** Whiteboard-only, no pre-reading  
  **Goal:** Show EDT agents can rationally cooperate in a one-shot PD against a stranger due to population-level similarity correlations.

  ---

  #### **Order of Components and Dependencies**
  1. **Evidential vs. Causal Influence Gap (10 min)**  
     - **What:** Illustrate how an action's *evidence* about an outcome (evidential) differs from its *causal effect* (causal). Use a medical example:  
       - *Scenario:* "Taking a vitamin correlates with health, but not because it causes health—healthy people just take vitamins more often. Conditioning on taking the vitamin *raises* the probability of health, but *doing* it has no causal effect."  
     - **Why first?** Establishes EDT's core premise (actions provide evidence) and contrasts with causal reasoning. Prerequisite for understanding why dominance fails in PD under EDT.  
     - **Dependency:** None (starting point).

  2. **One-Shot Prisoner's Dilemma & Dominance (10 min)**  
     - **What:** Define PD payoffs (T > R > P > S, 2R > T+S). Whiteboard:  
       ```
       Payoff Matrix:
             You \ Stranger | Cooperate | Defect
             ------------------------------------
             Cooperate      | (R, R)    | (S, T)
             Defect         | (T, S)    | (P, P)
       ```  
       Dominance argument: "Whatever the stranger does, defecting gives a higher payoff (if they cooperate: T > R; if they defect: P > S). So defect."  
     - **Why now?** Sets up the conflict: EDT will later violate dominance. Depends on understanding causal gaps (Step 1) to see why evidence might override dominance.  
     - **Dependency:** Step 1 (dominance assumes no evidential effects).

  3. **Population Picture & Similarity-Based Correlation (20 min)**  
     - **What:** Describe a large population of agents. Each has a latent "type" (e.g., innate cooperation tendency). You and your opponent are randomly drawn from this population. Your type determines your action, and types are correlated—similar agents behave similarly.  
       - *Key insight:* "Your action reveals your type, which is evidence about the types of others. Cooperating suggests you're a cooperative type, which raises the probability that similar strangers cooperate."  
     - **Why now?** Explains *why* actions have evidential weight. Depends on Step 2 (PD structure) to frame the problem and Step 1 (evidence matters).  
     - **Dependency:** Steps 1–2 (without PD, no dilemma; without evidence-action gap, correlation is irrelevant).

  4. **Threshold Inequality (15 min)**  
     - **What:** Derive when EDT prefers cooperation. Let:  
       - \(q = P(\text{stranger cooperates} \mid \text{you cooperate})\)  
       - \(r = P(\text{stranger cooperates} \mid \text{you defect})\)  
       - Payoffs: \(R, S, T, P\) (from Step 2).  
       EDT cooperation beats defection iff:  
       \[
       qR + (1-q)S > rT + (1-r)P
       \]  
       Rearrange to:  
       \[
       \Delta = q(R - S) - r(T - P) > P - S
       \]  
       **Threshold:** \(\Delta > P - S\) (a positive gap).  
       - *Interpretation:* Cooperation is rational if the correlation (\(q - r\)) is strong enough relative to payoff ratios.  
     - **Why now?** Quantifies the required correlation. Depends on Steps 1–3 (EDT’s conditioning, PD payoffs, population correlation).  
     - **Dependency:** Steps 2 (payoffs) and 3 (correlation).

  ---

  #### **Core Example: The "Group Lottery" Model (20 min)**  
  - **Setup:**  
    - A large population is divided into many groups (e.g., by cultural background).  
    - Each group has a hidden "cooperation rate" \(\theta \sim \text{Uniform}[0,1]\).  
    - Agents in a group act independently: \(P(\text{cooperate} \mid \theta) = \theta\).  
    - You and your stranger are randomly matched from the **same group** (so shared \(\theta\)).  
    - You don’t know \(\theta\) or your group’s identity.  

  - **Mechanism:**  
    - If you cooperate: "This suggests \(\theta\) is high → stranger likely cooperates (\(q = \frac{2}{3}\))."  
    - If you defect: "This suggests \(\theta\) is low → stranger likely defects (\(r = \frac{1}{3}\))."  
    - *Calculation (Bayesian):*  
      - Prior: \(\theta \sim \text{Uniform}[0,1]\).  
      - \(P(\text{stranger cooperates} \mid \text{you cooperate}) = \mathbb{E}[\theta^2] / \mathbb{E}[\theta] = \frac{1/3}{1/2} = \frac{2}{3}\).  
      - \(P(\text{stranger cooperates} \mid \text{you defect}) = \mathbb{E}[\theta(1-\theta)] / \mathbb{E}[1-\theta] = \frac{1/6}{1/2} = \frac{1}{3}\).  

  - **Payoff Threshold:**  
    - Use \(R=4, T=5, S=0, P=1\) (satisfies PD constraints).  
    - \(qR + (1-q)S = \frac{2}{3}(4) + \frac{1}{3}(0) \approx 2.67\)  
    - \(rT + (1-r)P = \frac{1}{3}(5) + \frac{2}{3}(1) \approx 2.33\)  
    - **Result:** \(2.67 > 2.33\) → EDT prefers cooperation.  

  - **Why this example?**  
    - **No predictors/Newcomb:** Correlation comes from shared group, not a psychic predictor.  
    - **No repetition/shadow of future:** Truly one-shot.  
    - **No exact duplicates:** Agents act independently given \(\theta\) (graded similarity).  
    - **Correlation read off setup:** Shared group → shared \(\theta\) → statistical correlation.  

  ---

  #### **Misconceptions: Defused During Sequence**  
  1. **"This is just iterated PD in disguise."**  
     - **When defused:** During Step 3 (Population Picture).  
     - **Response:** "No future interactions. Correlation comes from pre-existing population structure, not repeated play."  

  2. **"The agent thinks its action *causes* the stranger's action."**  
     - **When defused:** During Step 4 (Threshold Inequality).  
     - **Response:** "EDT doesn’t assume causation. \(q\) and \(r\) are evidence, not causal influence—like the vitamin example."  

  3. **"Exact duplicates make this trivial (only one agent)."**  
     - **When defused:** During Core Example.  
     - **Response:** "Agents aren’t duplicates; they’re independent draws given \(\theta\) (e.g., in a group with \(\theta=0.8\), 20% defect)."  

  4. **"The agent can manufacture correlation by deciding."**  
     - **When defused:** During Core Example calculations.  
     - **Response:** "Correlation is fixed by population structure. Your action reveals \(\theta\), but doesn’t change it or the stranger."  

  5. **"This vindicates EDT generally" or "It’s about world size, not correlation."**  
     - **When defused:** After Threshold Inequality.  
     - **Response:** "EDT only cooperates here due to *specific* correlation. In Step 7 (mimics/contrarians), correlation nets to zero and EDT defects. Size just enables statistical stability."  

  ---

  #### **Mimics/Contrarians Case (10 min)**  
  - **Placement:** After Core Example (before closing).  
  - **Setup:**  
    - Population: 50% mimics (copy your action), 50% contrarians (do the opposite).  
    - Stranger is randomly assigned to mimic or contrarian.  
  - **Analysis:**  
    - \(P(\text{stranger cooperates} \mid \text{you cooperate}) = P(\text{mimic}) = 0.5\)  
    - \(P(\text{stranger cooperates} \mid \text{you defect}) = P(\text{contrarian}) = 0.5\)  
    - \(q = r \rightarrow \Delta = 0\). For any PD payoffs, defection dominates.  
  - **Purpose:** Shows correlation must be *positive* (\(q > r\)) for cooperation. If net correlation is zero, EDT reverts to dominance.  
  - **Takeaway:** "When you leave, understand that this isn’t about any correlation—it’s about similarity-based correlation where your action *positively predicts* the stranger’s."  

  ---

  #### **Closing Question (5 min)**  
  - **Question:** "In the Group Lottery Model, if you *defect* and the stranger *cooperates*, what does that imply about your group’s \(\theta\)?"  
  - **Purpose:** Tests mechanistic understanding vs. slogan-level.  
    - **Slogan answer:** "My action is evidence about the stranger."  
    - **Mechanism answer:** "Defecting suggests \(\theta\) is low, but stranger cooperating is unlikely in low-\(\theta\) groups → more likely we were in a mid-\(\theta\) group or a fluke. Specifically, it updates \(\theta\) to \(\mathbb{E}[\theta(1-\theta)^2] / \mathbb{E}[(1-\theta)^2]\)."  

  ---

  #### **Openly Decline to Settle (5 min)**  
  1. **Which decision theory is correct?**  
     - "We’re not endorsing EDT—just showing it *can* cooperate here. CDT would still defect."  
  2. **What if the agent is certain of its action?**  
     - "EDT struggles with self-certainty (can’t condition on ‘what if I did otherwise?’). We’re assuming agents who contemplate both actions."  
  3. **Realism of correlation structures:**  
     - "Is this correlation structure plausible? We’re not debating that—just showing it *enables* EDT cooperation."  
  4. **Philosophical justifications:**  
     - "We’re skipping why you should *believe* in similarity correlations. That’s deeper philosophy."  

  ---

  **Timing Summary:**  
  - Evidential vs. Causal (10 min) → PD & Dominance (10 min) → Population Correlation (20 min) → Threshold Inequality (15 min) → Core Example (20 min) → Mimics/Contrarians (10 min) → Closing (5 min).  
  - Buffer: 0 min (tight schedule; prioritize Core Example).  

  **Teaching Tip:** Whiteboard the Core Example calculations live—ML audiences resonate with Bayesian math. Hammer the "evidence, not causation" mantra at every chance.
