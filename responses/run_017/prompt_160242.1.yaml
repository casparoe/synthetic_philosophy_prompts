prompt: |-
  So, I had a three-hour argument about pictograms on Sunday with a friend who designs icon sets for a metro system, and I came away wanting something I can actually use at work rather than another round of it. Context: I run a small comms/design team for a health charity. We churn out leaflets, flipcharts and printed cards that go out with SMS reminders, aimed at audiences with low literacy and low numeracy in about five countries. Two-day turnarounds, cheap one-colour printing plus tiny screens on old feature phones, no budget for real user testing beyond asking a couple of community health workers, and everything has to be signed off by a country lead who isn't a designer. So I need something we can run on a Tuesday afternoon, not a design manifesto.

  The fight, briefly: she says good pictograms are essentially self-explanatory and that if an icon needs teaching it's a bad icon. I said that's exactly backwards on the Neurath/Isotype stuff — the whole point was a deliberately tiny taught vocabulary with a deliberately tiny grammar, quantity shown by repeating identical figures rather than by making the figure bigger, flat silhouettes rather than naturalistic detail, and Neurath himself called it a language-like technique, a helping language that was never meant to replace words. She said those simplification rules were 1930s print-technology constraints, not facts about minds. I said no, the memory point is about minds — the Vienna museum's line was roughly that simplified pictures get remembered where accurate figures get forgotten. She came back with: people remember photographs better than line drawings, that's just empirically true, so if recall is your criterion then realism wins. I said a photograph of one particular mother and child is a token, not a type: it individuates, it can't be repeated or counted, and it will read as that family rather than as any caregiver. She said fine, but then be honest that pictures can't carry not, if-then, or maybe, and at that point the picture is doing nothing except pointing at the words. Round four was us both half-agreeing with that and then disagreeing about whether we should just give up and use text for everything. We left it there, neither of us moved, and I've been chewing on it since.

  Can you do something more useful with it than we managed? I want a decision procedure my team can run on every new icon or illustration: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it deliberately hands the decision to a person because it's a values call rather than a factual one — whose body, clothes and house end up as the generic figure is the obvious example, and I don't want the procedure pretending that's solvable by design. It should take the Neurath/Isotype material seriously (repetition over resizing, transformation over reproduction, a symbol set as a taught convention that has to be learned rather than guessed) but translated for someone who has never read a word of Neurath, and honest about what gets lost in the translation. Please settle the two things we were actually arguing about, explicitly: whether adding naturalistic detail to make an icon feel instantly readable is helping or hurting, and wether we should be letting an image generator spit out forty varied versions of a scene when the whole Isotype discipline is a fixed, reusable vocabulary. Then run the procedure on three things on my desk right now: (1) an icon for second dose overdue — a child-and-syringe with something crossed out, which nobody has managed to make legible, because negation; (2) a cholera risk graphic saying risk is high this month, where the temptation is to make the water dirtier and the people more obviously sick; (3) the cover photo everyone loves, a real mother and child at a real clinic, which tested better for recall than anything we've ever made and which our country director will fight to keep. I'd rather know now if the procedure kills (3). And tell me straight where the procedure won't work — my worry is that a taught vocabulary only pays off if the same symbols keep coming back, and most of what we produce is one-off, so tell me if the framework quietly assumes a continuity we dont have. No reading lists or references please, I can't chase them and I don't need them — I need a checklist. British English throughout as well, we're UK-registered and the house style is brutal about it.
reasoning: |-
  Okay, the user runs a small comms/design team for a health charity. They create materials for low-literacy audiences in multiple countries, with tight deadlines and minimal resources. They just had a heated debate with a friend about pictogram design and need a practical decision procedure for their team. 

  First, I need to unpack their core frustrations: they're drowning in operational constraints (two-day turnarounds, cheap printing, old tech), political realities (non-designers approving work), and philosophical disagreements about icon design. The Neurath/Isotype principles resonate with them but their friend argues for intuitive realism. 

  Hmm... the key tension is between "taught vocabulary" (Neurath) vs "instantly readable" (their friend). The user needs this resolved not theoretically, but as actionable steps. Their examples reveal deeper pain points: negation in icons (dose overdue), conveying abstract concepts (risk), and emotional resonance vs consistency (that popular mother-child photo). 

  Ah! The unspoken crisis: their work is mostly one-offs, while Isotype assumes recurring symbols. If the framework doesn't acknowledge this mismatch, it'll fail. Also notable: they dread their beloved photo (example 3) being "killed" by procedure - shows they value real-world impact over purity. 

  Right, the solution must: 
  - Be bulletproof for junior designers under time pressure 
  - Explicitly handle values-based decisions (like cultural representation) 
  - Survive without user testing 
  - Preserve what works (like that photo) while improving weak spots 

  For the procedure itself... I'll structure it as a brutal triage: 
  1. First filter out non-visual concepts (negation, conditionals) early 
  2. Force "symbol vs illustration" choice upfront since their resources can't do both well 
  3. Build in off-ramps where text is better (no shame in that!) 
  4. For cultural/generic choices, make humans decide - no false objectivity 

  On their specific arguments: 
  - Naturalistic detail: I'll side with Neurath on this - detail hurts recognition at small sizes, but concede it has emotional value in photos. Must separate "icon" from "illustration" uses. 
  - AI generators: reject for core symbols (violates consistency), but maybe okay for one-off scene illustrations if manually simplified later. 

  Test drive on their examples: 
  1. Dose overdue icon: Procedure should kill it early. Negation never works small-scale. Recommend text + date instead. 
  2. Cholera risk: Resist "dirtier water" instinct. Use taught convention (ex: three identical sick figures > one detailed one). 
  3. That photo: Explicitly survives! Flag it as "illustration" not "symbol". Its recall power justifies breaking consistency. 

  Biggest warning: Taught symbols only pay off if reused. Since 80% of their work is one-offs, I'll add a "reuse likelihood" checkpoint. If low, skip to illustration/text. 

  Final touch: Phrase everything in UK English ("colour", "learnt"), no jargon, no references. They need tools, not theory.
answer: |-
  Here's a practical **Pictogram Decision Procedure** for your team, designed for Tuesday-afternoon pressures. It treats Isotype principles as *tools*, not dogma, and forces clear off-ramps to text when icons fail. British English throughout, as requested.

  ---

  ### **The Pictogram Decision Procedure**
  **Run this checklist in order for every proposed image/icon. Stop at any "No" and use text.**

  1.  **IS THIS A CONCEPT ICONS CAN'T CARRY?**  
      *Check: Does it require expressing **negation** ("not", "stop"), **abstraction** ("risk", "maybe"), **conditionals** ("if...then"), or **complex relationships**?*  
      - **Yes** → **STOP. Use text only.** (No icon will fix "second dose overdue" – negation + time abstraction).  
      - **No** → Proceed.  
      *Settles your argument:* Icons can't reliably do negation/abstraction. Your friend was right here. Neurath used words alongside symbols for this reason. **For (1) Second Dose Overdue:** STOP. Use clear text + date (e.g., "MISSED DOSE: [Date]").

  2.  **IS THIS A RECURRING "CORE" CONCEPT?**  
      *Check: Will this symbol (e.g., "clinic", "child", "vaccine") be reused ≥5 times across materials?*  
      - **Yes** → It *might* justify a taught symbol. Proceed to Q3.  
      - **No** (One-off) → **Consider illustration or text instead.** Taught vocab only pays off with reuse. *Your worry is valid – this framework assumes reuse. For one-offs (most of your work), skip to Q6.*  
      *Settles the AI argument:* For **core reusable symbols**, AI generators (40 varied versions) are harmful – they destroy consistency. For **one-off scenes**, AI *might* speed up draft illustration creation *if* heavily edited later for clarity.

  3.  **CAN IT BE A SIMPLE, REPEATABLE SILHOUETTE?**  
      *Check: Can the concept be reduced to a flat, unambiguous silhouette? Can quantity be shown by repeating it (Isotype principle), not resizing/changing it?*  
      - **Yes** → Proceed to Q4.  
      - **No** → **Off-ramp to Illustration/Text.** If complex action/scene, it needs an illustration, not an icon.  
      *For (2) Cholera Risk:* "Risk" itself fails Q1 (abstraction). Show **consequences**. Instead of "dirtier water + sicker people" (naturalistic detail), use taught symbols: Repeat identical sick figures + repeat identical contaminated water droplets. **Repetition > Variation.** Detail hurts here.

  4.  **WILL IT BE LEGIBLE AT 8MM SQUARE / 1-COLOUR?**  
      *Test:* Print it tiny & blurry. Ask a non-designer colleague (not just health workers): "What is this *at a glance*?"  
      - **Instantly clear** → Proceed to Q5.  
      - **Unclear/Guessed wrong** → **Simplify silhouette or use text.**  
      *Settles the detail argument:* **Naturalistic detail HURTS** legibility at small scale/1-colour. Neurath was right for *symbols*. Fine lines, shading, texture vanish or become noise. **Silhouettes win.** Your friend's "realism aids recall" applies to *larger illustrations*, not tiny icons (see Q6).

  5.  **IS THE SYMBOL CULTURALLY/GENERICALLY SAFE?**  
      *Check:* Is the silhouette neutral enough for all contexts? Avoid specific clothing/hairstyles/body shapes as "default".  
      - **Yes** → **APPROVE Symbol.** Add to master symbol list.  
      - **No** (Value judgement needed) → **Hand to Human Decision.** *Who decides:* Team lead + relevant country lead. *Options:* a) Use safest generic version, b) Create culturally-specific versions per region, c) Use text. **Do NOT pretend design solves this alone.**

  6.  **ILLUSTRATION CHECK (For one-offs or complex scenes):**  
      *Check:* Is this needed for emotional impact/narrative where text/symbols fail?  
      - **Yes** → **Prioritise clarity & focus:**  
          - Single focal point.  
          - Minimal background clutter.  
          - High contrast (works with cheap print/screens).  
          - Test recall: Show for 3 seconds. Ask "What's happening?" next day.  
      - **No** → **Use text/symbols.**  
      *For (3) Mother/Child Photo:* **KEEP IT.** It passed the recall test – that's gold. It's an *illustration*, not a symbol. Detail HELPS here because it's larger format, emotional, and one-off. Isotype isn't dogma; real photos work for specific, impactful moments. Just ensure it prints clearly on bad stock/screens.

  ---

  ### **Key Takeaways from Your Arguments**
  1.  **Detail in Icons:** Hurts at small scale. **Use simplified silhouettes for symbols.** Detail in **illustrations** can aid recall/emotion if technically reproducible. *You were both partly right, but context is king.*
  2.  **Taught Vocabulary:** Only viable for **high-reuse core concepts**. For one-offs, it's inefficient. *Your instinct was correct – your workflow needs this acknowledged.*
  3.  **AI Generators:** Useless for **symbols** (needs consistency). Potentially useful for **drafting one-off illustrations** if heavily simplified afterwards. *Your friend's caution is warranted for core vocab.*
  4.  **Negation/Abstraction:** Icons fail. Use text early. *Your friend won this round.*
  5.  **Realism vs Simplification:** Not either/or. **Symbols = Simplified. Illustrations = Can be detailed if they pass the recall/legibility test.**

  ---

  ### **Procedure Weaknesses (Be Honest)**
  -   **Low Reuse:** The biggest flaw. If you rarely reuse symbols, Q2 will push most things to illustrations/text. That's okay – efficiency wins.
  -   **"Good Enough" Testing:** Relying on quick colleague-checks isn't robust testing, but it's pragmatic. Mitigate by using the same 2-3 non-designers consistently.
  -   **Cultural Neutrality (Q5):** Still messy. Humans must decide, accepting it's imperfect.
  -   **Scale/Colour Limits:** Rigidly enforced in Q4. If your printing improves, revisit thresholds.

  This procedure forces hard stops on unworkable icon concepts (negation!), leverages Isotype principles *where they fit* (repetition, silhouettes, reuse), embraces text when needed, and protects what demonstrably works (your photo). It’s a tool, not a manifesto.
