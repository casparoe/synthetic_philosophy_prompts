  ### Appended Advice for Inheritance Mechanism  
  *(Not part of joint statement)*  

  **Candidate Mechanisms**:  
  1. **Sealed bids with matching right**: Highest bidder wins; others may match to buy at winning price.  
  2. **Shotgun clause**: Offeror sets price; others choose to buy offeror’s shares or sell theirs at that price.  
  3. **Independent valuation**: Sibling-paid certified valuation made public before bids.  

  **Camp Predictions**:  
  - **Idealization Camp (I)**:  
    - (1) Prone to underbidding (fear of being matched).  
    - (2) May induce truth-telling if symmetric, but litigation risk high with 30% gap.  
    - (3) Most robust: Valuation anchors beliefs, reducing disagreement.  
  - **Perturbation Camp (P)**:  
    - (1) & (2) Vulnerable to noise (bounded agents overreact to small uncertainties).  
    - (3) Strongly recommended: Public valuation creates common \( p \)-belief, enabling convergence.  

  **Consensus Recommendation**:  
  - Both camps endorse **independent valuation (3)** as the only mechanism robust to CK failures and bounded rationality. It mitigates disagreement by creating public anchors (I: near-CK; P: high \( p \)-belief).  
  - **Shotgun clause (2)** is disfavored by both (I: sensitive to CK gaps; P: fragile to small perturbations).  

  **If Valuation Fails**:  
  - No mechanism is robust across all cruxes. **Bet on Crux 6 (approximate CK)**:  
    - If approximate CK exists, (3) succeeds. Else, litigation is likely regardless.  
  - **Deadline advice**: Prioritize (3). Draft with:  
    - Fee high enough to deter frivolous use (aligns incentives).  
    - Mandatory cooling-off period post-valuation (reduces strategic reactions).  

  **Action**: Implement (3) immediately. Allocate equal fees to siblings to trigger valuation.
