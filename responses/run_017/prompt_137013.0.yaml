  Below is a structured 15-minute procedure for resolving reference class complaints, designed to address the challenges of multiple conflicting classes, small sample sizes, data dredging, and outdated cohorts. The procedure prioritizes transparency, regulatory compliance, and ethical considerations, while acknowledging the inherent limitations of the reference class problem (where the "perfect" class for an individual may not exist or be statistically usable).

  ---

  ### **Reference Class Selection Procedure**  
  *Time limit: 15 minutes per complaint*  

  #### **Step 1: Identify Candidate Reference Classes**  
  - **Task:** List all clinically plausible reference classes from the EHR that include the patient, based on:  
    - Predefined hospital risk models (e.g., ACC/AHA CVD risk model).  
    - Variables measured *before* prediction (e.g., age, comorbidities, lab values).  
    - Avoid variables influenced by treatment or the outcome (e.g., post-op vitals for a pneumonia risk model).  
  - **Stop if:** No class meets the compliance rule (named class, n≥50 in hospital data). → **Output:** *No number shown*.  
  - **Time:** 3 minutes.  

  #### **Step 2: Filter for Statistical Validity**  
  - **Task:** Remove classes that:  
    - Have n<50.  
    - Were defined via data dredging (e.g., subgroups identified *after* outcome analysis).  
    - Use the outcome variable in class definition (e.g., a "pneumonia risk" class including patients *with* pneumonia).  
  - **Stop if:** All classes fail these filters. → **Output:** *No number shown*.  
  - **Time:** 2 minutes.  

  #### **Step 3: Resolve Conflicts Between Classes**  
  - **Task:** If multiple classes remain, rank by specificity (most predictive variables first).  
    - **If classes agree** (risk estimates differ by ≤5 percentage points): Choose the class with largest *n*.  
    - **If classes disagree** (estimates differ by >5 points):  
      - Use the **narrowest class** with n≥50 that avoids data dredging.  
      - If equally narrow classes disagree:  
        - **Hand off to ethics/compliance lead** (values decision): Choose between "most accurate" (clinically useful) or "most defensible" (legally safe).  
  - **Stop if:** No resolution within 2 minutes of discussion. → **Output:** *No number shown*.  
  - **Time:** 5 minutes.  

  #### **Step 4: Check for Ethical/Social Acceptability**  
  - **Task:** Review variables defining the chosen class:  
    - **Automatic exclusion:** Race, sex, insurance status, or other protected attributes—**unless** pre-approved by hospital ethics board for this specific risk model.  
    - **Hand off to ethics lead:** If class uses sensitive variables without approval.  
  - **Stop if:** Ethics rejection with no alternative class. → **Output:** *No number shown*.  
  - **Time:** 3 minutes.  

  #### **Step 5: Address Cohort Currency**  
  - **Task:** Flag (but do not discard) classes from outdated cohorts (e.g., >10 years old):  
    - Add an EHR disclaimer: "Risk estimate based on historical data; may not reflect current outcomes."  
    - **Stop if:** Clinician disputes validity and no alternative exists. → **Output:** *No number shown*.  
  - **Time:** 2 minutes.  

  #### **Final Output**  
  - Display the risk score and named reference class if all steps pass.  
  - **Otherwise, display blank.**  

  ---

  ### **Key Philosophical Notes Embedded in Procedure**  
  1. **The n=1 problem is inherent**: The "perfect" class for an individual is often nonexistent (empty) or statistically useless (n=1). This is not a data flaw—it is the *reference class problem*. We must use broader classes while minimizing information loss.  
  2. **What the procedure cannot solve**:  
     - **True individual risk**: All estimates are group-based.  
     - **Time-lag bias**: Outdated cohorts may inflate/deflate risks, but we lack real-time data.  
     - **Value judgments**: Ethics/compliance must decide sensitive variables or accuracy vs. defensibility trade-offs.  
     - **Clinical nuance**: The procedure cannot replace provider judgment.  

  ---

  ### **Application to Open Complaints**  
  #### **Case 1: 62F diabetic with conflicting classes (11% vs. 26%)**  
  - **Step 1:** Classes: `A` (age + diabetes, 11%), `B` (age + diabetes + stent + kidney, 26%).  
  - **Step 2:** Both n≥50? Assume yes. Neither uses outcome? Assume yes.  
  - **Step 3:** `B` is narrower. Use `B` (26%) unless data dredging found (if dredged, use `A`).  
  - **Step 4:** No sensitive variables.  
  - **Step 5:** Historical cohort disclaimer added.  
  - **Output:** *Show 26%* (or 11% if `B` dredged).  

  #### **Case 2: 34M with rare genotype (n=19 in registry)**  
  - **Step 1:** Candidate: Genotype class (n=19). Broadest class (e.g., "all adults") may exist but ignores genotype.  
  - **Step 2:** Genotype class excluded (n<50). Broader class (e.g., "all genetic disorder patients") may have n≥50 but misses key risk factor.  
  - **Step 3:** Broader class is misleading—genotype is a major risk multiplier.  
  - **Stop at Step 2/3:** No statistically valid class accounting for genotype.  
  - **Output:** *No number shown*.  

  #### **Case 3: Post-op pneumonia class defined by outcome**  
  - **Step 1:** Only class with n≥50 uses outcome (e.g., "patients with post-op fever → pneumonia").  
  - **Step 2:** Excluded (violates data dredging rule).  
  - **Stop at Step 2:** No valid alternative.  
  - **Output:** *No number shown*.  

