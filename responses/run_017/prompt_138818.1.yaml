  **3. Case 2 Analysis (Problematic)**  
  *"(G) is therefore committed to saying that b and q are the same letter... (H) does fine"*  
  ❌ **Error**: Misrepresents (G). A geometric account *can* include orientation as a feature (e.g., "stem orientation: SW vs NE"). Competent (G) theories (e.g., Marr’s vision model) treat rotation as feature-altering.  
  ✅ **Partial Credit**: Correct that (H) distinguishes via copying history.  
  ⚠️ **Oversight**: Ignores that (P) would likely see rotated glyphs as distinct letters *because readers use them differently* (b≠q functionally).  

  **4. Case 3 Analysis (Strong)**  
  *"(H) says not Roman letters... (P) says they are Roman letters"*  
  ✅ **Excellent**: Exposes (H)’s hidden intentionalism ("copier must intend")—sharp observation.  
  ✅ **Strong Defense**: Correctly applies (P)’s functional criterion (90% recognition → functional equivalence).  
  ⚠️ **Minor Gap**: Doesn’t address if (P) requires *systematic* use (e.g., can ad hoc recognition override lack of historical integration?).  

