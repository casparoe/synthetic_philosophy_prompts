prompt: |-
  Hi — I'm a volunteer giving advisor for a smallish family foundation, and I keep tripping over something in how the effective-altruism-flavoured funding world actually behaves. Could you answer in British English?

  Here's the practice. Nearly every serious funder in that space expresses value in one unit: you work out how much good a programme does, then state it as a multiple of simply handing the same money to someone in extreme poverty. Unconditional cash transfers are the yardstick — the one thing everyone treats as known — so the case for deworming, insectide-treated nets, vitamin A, whatever, is that it's some multiple better than cash. Second: what actually gets funded is overwhelmingly the stuff with a randomised trial or a clean metric behind it, a DALY here and a test score there, while things without a number attached — organising, movement building, policy and institutional work, most systemic bets — mostly don't get a look in however plausible the story is. And this has got more pronounced as the money has got bigger and the grantmaking has professionalised. Third: the very same people will defend cash by saying poor people know their own needs best and we shouldn't impose our guesses on them, then turn around and fund a health intervention precisely because recipients weren't going to choose it and needed a subsidy, a nudge or a free delivery to take it up.

  So what does that package presuppose? Does using cash as the zero point commit you to a substantive view about what makes a life go well, or is it only a convention? Is the preference for measurable things a moral claim about what's valuable, or an artefact of foundations and grant officers having to justify themselves to a board? Is the cash-knows-best / nets-need-a-nudge pairing actually inconsistent, or can one theory carry both? And what would have to change in how they did things if the implicit view were swapped for a rival one?

  Be clear about which parts the practice strictly requires and which merely sit comfortably with it, and about where several quite different theories would all license exactly what they do. And please separate what's genuinely settled among people who know this material from what's contested — flag the contested bits as contested instead of smoothing them into a consensus. I've read enough of the blog posts to know a lot of this is argued about.
reasoning: |-
  Okay, the user is a volunteer giving advisor for a small family foundation, working within the effective altruism (EA) funding space. They've noticed several practices that seem contradictory or confusing and want a deeper understanding of the underlying presuppositions. Let me break down their main points.

  First, they mention that funders use unconditional cash transfers as the benchmark for measuring impact. Every intervention is evaluated as a multiple of cash given directly to those in extreme poverty. But then, the projects that actually get funded are those with measurable outcomes, like RCTs or clear metrics (DALYs, test scores), while systemic or unmeasurable work like policy change or movement building gets sidelined. This has become more pronounced as funding has grown and grantmaking professionalized.

  The user also points out a tension: funders argue that cash is best because poor people know their own needs, yet they fund interventions like health programs precisely because people wouldn't choose them without nudges or subsidies. The user wants to know the presuppositions behind these practices, whether they are consistent, and what would change if different theories were applied.

  The user's explicit questions are about the presuppositions of using cash as a benchmark, the preference for measurable outcomes, the consistency between valuing cash and funding nudged interventions, and what changes would occur under different theories. They also want clarity on what is required by the practice versus what's merely compatible, and what is settled versus contested in the EA community.

  Digging deeper, the user might be grappling with frustration. They see systemic issues being overlooked due to a focus on measurability, which could limit the foundation's impact on broader change. As a volunteer advisor, they might feel their perspective is undervalued in a professionalized environment. Their unspoken need could be seeking validation for funding less measurable, systemic work and wanting arguments to challenge the status quo within their foundation or the EA community.

  I recall that the EA community does debate these points. The cash benchmark is both practical and philosophical, rooted in welfarism and deference to individual choice. But critics argue it overlooks systemic factors. The preference for measurability stems from accountability needs and epistemic constraints, but it's not a moral requirement. The tension between cash and nudges can be reconciled through market failures or imperfect information, but it's a contested area.

  The user likely wants a balanced analysis that acknowledges EA's strengths while highlighting its limitations, especially regarding systemic interventions. They need this to advocate for a more pluralistic approach within their foundation. I should ensure to distinguish settled views (like cash as a practical benchmark) from contested ones (like the neglect of systemic change), and explain how different theories could justify current practices or suggest alternatives.

  I'll structure the response around the three practices: the cash benchmark, preference for measurability, and the cash/nudge tension. For each, I'll outline the presuppositions, what's required vs. compatible, settled vs. contested points, and how alternative theories might change practices. I'll emphasize that the current approach is practical but not logically necessary, and that systemic work's exclusion is more about measurability than inherent value. Highlighting the contested nature of these issues will validate the user's observations and provide them with nuanced arguments for their advisory role.
answer: |-
  Right, let's unpack that package. It's a sharp observation of the tensions within much of the EA-flavoured grantmaking landscape. Here’s a breakdown of the presuppositions, separating the strictly required from the comfortably aligned, the settled from the contested, and how different theories could underpin the practice:

  **1. Using Unconditional Cash Transfers (UCTs) as the Yardstick ("The Zero Point")**

  *   **What it Presupposes:**
      *   **Settled (as a practical convention):** UCTs are a *reasonably good*, relatively *simple to measure*, and *feasible* way to improve welfare in extreme poverty. They avoid paternalism by default and act as a common denominator. **This doesn't *strictly require* believing cash is the *absolute best* thing, but that it's a *useful and defensible benchmark* against which other interventions can be compared.**
      *   **Contested (the deeper philosophical commitment):** Does this elevate "individual consumption choice" to the *defining feature* of welfare? Many proponents would say it pragmatically *defers* to individual judgement rather than imposing an external view of "the good life". Critics argue it implicitly **presupposes a strongly welfarist, preference-satisfaction view of value**, where welfare is primarily about individuals getting what they want (expressed through spending), potentially sidelining objective needs, capabilities, rights, or systemic factors individuals cannot easily "purchase" (e.g., clean air, stable institutions).
      *   **Compatible, Not Required:** It doesn't *require* dismissing non-material aspects of wellbeing (dignity, agency, community). It simply focuses measurement on the tangible, consumption-based outcomes cash readily impacts.

  *   **Settled vs. Contested:**
      *   **Settled:** Using UCTs as a benchmark is a widely accepted *practical tool* within EA cost-effectiveness analysis for comparing direct poverty interventions. It's grounded in evidence showing cash *is* effective.
      *   **Contested:** Whether this benchmark inherently **privileges a narrow, consumption-focused view of wellbeing** over broader conceptions (e.g., Sen/Nussbaum's capabilities approach, rights-based approaches, relational wellbeing) is hotly debated. Critics see it as a substantive philosophical choice disguised as neutral measurement. Defenders see it as a pragmatic, evidence-based starting point that avoids imposing external values.

  *   **Alternative Views & Changes:**
      *   **Capabilities Approach:** The yardstick might shift to something like "cost per significant increase in capability X" (e.g., cost per person gaining secure access to clean water, cost per child achieving basic literacy). UCTs might score well on some capabilities (nutrition, shelter) but poorly on others (health if preventative care isn't chosen, political participation).
      *   **Rights-Based Approach:** Focus might shift entirely to funding interventions fulfilling basic rights (food, water, health, education) as defined by international standards, regardless of individual purchase choices. UCTs would be one tool among many, not the benchmark.
      *   **Systemic Change Focus:** The benchmark might become irrelevant. Success would be measured by changes in policy, power structures, or institutional capacity, with no direct "cost per beneficiary" comparison to cash possible. **Change:** Funding would prioritise very different interventions (advocacy, legal challenges, movement building) based on theories of change, not cost-effectiveness ratios relative to cash.

  **2. Preference for Measurable Interventions (RCTs, DALYs, Test Scores) over "Unmeasurables"**

  *   **What it Presupposes:**
      *   **Strictly Required:** A **profound epistemic commitment**: We can only *reliably know* and *compare* the impact of interventions if we can quantify it with reasonable confidence. This stems from:
          *   **Accountability:** Foundations *must* justify grants to boards/donors. Numbers provide defensible evidence.
          *   **Avoiding Waste:** The fear of funding ineffective (or harmful) work based on compelling narratives alone.
          *   **Comparability:** To allocate scarce resources optimally *across* diverse areas, a common metric (like DALYs or dollars) is seen as essential.
      *   **Contested (Moral Claim vs. Artefact):** This is primarily an **epistemic and practical constraint** ("We can only confidently fund what we can measure well"), *not* necessarily a deep moral claim that only measurable things are valuable. *However*, the *effect* is often functionally identical to such a claim, as unmeasurable work struggles for funding.
      *   **Compatible, Not Required:** It *allows* but doesn't *require* a belief that easily measurable outcomes (physical health, basic literacy) are inherently *more important* than harder-to-measure ones (agency, empowerment, social cohesion, long-term systemic change). The practice thrives on measurable proxies for complex goods.

  *   **Settled vs. Contested:**
      *   **Settled:** Within rigorous EA cost-effectiveness analysis, quantified evidence (especially RCTs) is the gold standard for direct interventions. Funding *tends* to flow towards where evidence is strongest and most quantifiable.
      *   **Contested:**
          *   **The Scope:** Whether this approach can or *should* be applied to systemic, institutional, or advocacy work is fiercely contested. Critics argue EA systematically undervalues these areas because they resist clean quantification within short grant cycles, potentially neglecting crucial pathways to large-scale change. Defenders argue for developing better measurement tools or focusing EA funds where quantification *is* feasible.
          *   **The Implication:** Whether the practical dominance of measurable interventions reflects a *de facto* moral hierarchy where measurable = valuable. Many EAs would argue it's a limitation of current methods, not a value judgement.

  *   **Alternative Views & Changes:**
      *   **Theory of Change Focus:** Funding decisions would prioritise the strength of the causal logic model and contextual evidence over precise quantification of final outcomes, especially for complex change. Judgement calls based on expertise and historical precedent would carry more weight.
      *   **Participatory Grantmaking:** Communities affected would define "impact" and success metrics, which might be qualitative, narrative-based, or process-oriented, moving away from standardised DALYs/test scores.
      *   **Institutional/Systems Lens:** Success metrics would be things like policy changes enacted, shifts in public discourse, coalition strength, or institutional capacity built, assessed through mixed methods (case studies, process tracing, expert judgement alongside any quantifiable data). **Change:** Grant applications would look radically different, focusing on logic models, contextual analysis, and qualitative indicators. Evaluations would be more nuanced and less focused on single-number ROI. Far more funding would go to advocacy, organising, and policy work.

  **3. The "Cash Knows Best / Nets Need a Nudge" Pairing**

  *   **What it Presupposes & Is it Inconsistent?**
      *   **Not Strictly Inconsistent (The Reconciling View):** This pairing generally relies on identifying **market failures, information gaps, or behavioural biases**.
          *   "Cash knows best" assumes *rational actors with good information* spending money to maximise their welfare.
          *   "Nets need a nudge" assumes that *in specific cases* (like highly effective preventative health measures with positive externalities), individuals might *not* have full information (e.g., understanding the true efficacy of a bed net), might suffer from present bias (prioritising immediate costs over long-term benefits), or the intervention has benefits beyond the individual (reducing disease transmission - a *positive externality*). Free distribution/subsidies overcome these barriers.
      *   **Contested (The Inconsistency Critics See):** Critics argue this *is* inconsistent because:
          *   **Selective Paternalism:** It justifies overriding individual choice in *some* domains (health interventions favoured by experts) while championing it in others (cash spending). Who decides which choices are "faulty" due to information/bias?
          *   **Scope:** How broadly is the "nudge needed" argument applied? Does it risk expanding to justify overriding preferences whenever experts disagree with recipients?
          *   **Power Dynamics:** It glosses over the power imbalance inherent in outside funders deciding *which* preferences are rational and which need overriding.
      *   **Presupposition:** It assumes experts can reliably identify situations where information gaps or behavioural biases *significantly* prevent people from making welfare-maximising choices *and* that the proposed intervention (like nets) is demonstrably the solution.

  *   **Settled vs. Contested:**
      *   **Settled:** The existence of market failures, information gaps, and behavioural biases justifying *some* subsidies/nudges for specific, evidence-backed health interventions is widely accepted within economics and EA. Free distribution of bed nets is a classic example with strong evidence.
      *   **Contested:**
          *   The *boundaries* of this justification. When does it stop being about correcting a clear failure and start being unwarranted paternalism?
          *   Whether the *strength* of the preference for cash transfers (as the benchmark) implicitly critiques *other* forms of paternalism, making the justification for nets etc. feel ad-hoc to critics.
          *   How consistently the principle (deference to choice vs. correcting failures) is applied across different intervention types.

  *   **Alternative Views & Changes:**
      *   **Stronger Paternalism:** Could justify funding *more* interventions that recipients wouldn't choose, based on a stronger view of expert knowledge about objective wellbeing (e.g., funding education even if parents prioritise immediate income).
      *   **Stronger Anti-Paternalism:** Could lead to *only* funding cash or interventions recipients demonstrably demand and are willing to pay some share for (e.g., highly subsidised but not free nets, conditional on some token contribution). Might abandon many preventative health programs.
      *   **Structural Analysis Focus:** Might see "low uptake" not as individual failure but as a symptom of systemic issues (distrust of health systems, gender dynamics limiting women's healthcare access). Funding would shift towards fixing *those* systemic barriers rather than just bypassing them with free delivery. **Change:** Rigorous assessment of *why* uptake is low would be paramount. Funding might shift from product distribution to community health worker programs, system strengthening, or addressing root causes of distrust/inaccessibility. Some current "nudge" interventions might be deprioritised.

  **Synthesis: What Holds This Package Together?**

  The core glue is a **commitment to rigorous, quantifiable evidence for optimising direct, individual-level welfare impacts within a framework that (mostly) defers to revealed preference, but makes exceptions based on identifiable market failures/behavioural science.** It's a powerful engine for funding *certain types* of highly effective interventions but struggles with complexity, systemic change, and non-quantifiable values.

  **What Truly Needs to Change for a Rival View?**

  To fundamentally shift away from this dominant EA-flavoured model:

  1.  **Shift the Benchmark:** Abandon or radically de-emphasise UCTs as the universal yardstick. Adopt alternative frameworks (capabilities, rights, systemic theories of change).
  2.  **Embrace Different Epistemologies:** Legitimise qualitative evidence, expert judgement, historical analysis, participatory methods, and theory-based evaluation as *primary* decision-making tools, especially for non-direct-service work. Accept higher uncertainty.
  3.  **Reconceive "Impact" and "Value":** Define success in terms of policy change, power shifts, institutional resilience, community agency, or rights fulfilment, even if it resists clean quantification into DALYs or cash multiples.
  4.  **Address Power & Paternalism Directly:** Develop a consistent, principled stance on when (if ever) to override individual/community preference, grounded in more than just market failure arguments, potentially incorporating self-determination or democratic deliberation.

  This wouldn't just be tweaking metrics; it would represent a fundamentally different philosophy of philanthropy, prioritising different types of work and ways of knowing. Your observation hits on the core tension between the remarkable successes of the quantifiable, direct-intervention EA approach and the growing sense that the most profound challenges require engaging the messy, unquantifiable world of systems and power – a world where the current toolkit often feels inadequate. The debate is very much alive.
