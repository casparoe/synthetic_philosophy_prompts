  The core puzzle seems to be: what underlying theory explains why states adopt this particular configuration (individual criminal trials + collective financial reparations to descendants)? The user wants to dig beneath surface practices to find necessary presuppositions. I notice their frustration with theoretical inconsistencies - like how Germany pays Holocaust reparations to descendants while the US only compensated living Japanese internees.

  Hmm, the six sub-questions reveal sophisticated concerns. For question 1 about state continuity, I recall the Austria/Germany split after WWII - both Nazi state successors but only Germany accepted liability. That suggests continuity isn't about numerical identity but about political acknowledgment. The key seems to be whether the current state identifies with the wrongdoer regime.

  For question 2 on inherited guilt, the user's spot-on that treasury funding avoids implicating citizens directly. But why? Probably because the obligation attaches to state institutions as custodians of resources, not to biological lineages. The "unjust enrichment" theory fits best here - today's state still holds assets gained through past wrongs.

  Question 3 about descent versus harm is thorny. The user's right that descent is a crude proxy - an affluent Holocaust survivor's grandchild gets compensation while a equally disadvantaged Roma descendant might not. But pragmatically, descent creates administrable bright lines. A pure "transmitted harm" model would require impossible historical sociology.

  The open-ended payment structure (question 4) screams "this isn't a dischargeable debt." It's more like acknowledging an irreparable wrong that requires perpetual acknowledgment. If treated as a closed debt, it would imply the harm was quantifiable and finite - which most atrocities aren't.

  The citizenship asymmetry (question 5) fascinates me. Taxpayers contribute based on current membership, but recipients qualify through blood. This only coheres if we see the state as a continuous institutional entity obligated to specific biological lineages it damaged. Two different logics of belonging, held together by the state's institutional continuity.

  For the test case (question 6), I think the user's instinct is sharp. Rejecting discharge dates makes sense - it preserves the symbolic nature of payments. But opposing taxpayer opt-outs reveals that the obligation truly binds the state as an institution, not as an aggregation of individuals. The resistance exposes the non-contractual nature of the duty.

  Throughout, I'm struck by how the practice resists neat philosophical categories. It's not about guilt, debt, or corrective justice alone, but about a polity's perpetual duty to disown its past sins through institutional rituals. The numerical identity of the state matters less than its willingness to wear the mantle of responsibility.
answer: |-
  The institutional pattern you describe presupposes a **collective moral continuity of the state as an institutional entity**, distinct from both the personal guilt of individuals and the biological continuity of lineages. Below is a reconstruction of the implicit theory, addressing each query:

  ### 1. **The Persistence of the Debtor**  
     - **Weak Continuity via Institutional Inheritance**: The practice presupposes *not* numerical identity of the state, but **succession to the institutional estate** (assets, legal personality, sovereign authority). The state persists as a corporate entity that inherits both the assets and moral liabilities of prior regimes.  
     - **Resolution of the "Carved Polities" Paradox**: The divergent paths (e.g., post-Nazi Germany vs. Austria) reveal that continuity is **politically constructed**. Germany accepted liability by identifying with the Nazi state’s institutional legacy; Austria disavowed it by framing itself as a "victim." The obligation arises from **voluntary assumption of institutional inheritance**, not metaphysical sameness.  

  ### 2. **Inherited Guilt?**  
     - **No Transmissible Guilt**: The package *excludes* biological or moral guilt transmission. Instead, it rests on:  
       - **Unjust Enrichment**: The state, as current holder of assets/resources acquired or built via wrongdoing (e.g., confiscated property, institutional wealth), owes restitution.  
       - **Jaspersian Political Liability**: Citizens bear *political* (not moral) responsibility as members of a polity that perpetuates institutional continuity.  
     - **Why Treasury Funding?** Payments from general taxation affirm the obligation binds the *institution*, not individuals. Levying descendants of perpetrators would imply hereditary guilt—explicitly rejected by the criminal trials.  

  ### 3. **Why Descent?**  
     - **Convenient Proxy, Not Strict Presupposition**: Descent is a pragmatic (flawed) marker for three purposes:  
       1. **Identifying Historical Membership**: Victims were targeted based on lineage (e.g., ethnicity, religion).  
       2. **Approximating Transmitted Harm**: It assumes intergenerational disadvantage (e.g., lost wealth, trauma), though imperfectly.  
       3. **Administrative Feasibility**: Tracking "transmitted harm" directly (e.g., socioeconomic disadvantage) is empirically intractable.  
     - **A "Transmitted Harm" Model**: Would require individualized assessments of historical disadvantage (e.g., wealth audits, genealogical records of dispossession). This exists marginally (e.g., specific land restitution) but is avoided due to cost and complexity. Descent remains the default heuristic.  

  ### 4. **Nature of the Obligation**  
     - **Open-Ended Duty of Care**, not a dischargeable debt. Key features:  
       - **Corrective Justice**: Aims to repair harm but admits full repair is impossible.  
       - **Expressive/Commemorative**: Payments symbolize acknowledgment and disavowal of past wrongs.  
       - **Rule-Out**: A **dischargeable debt** is incompatible with the practice. If obligations were closed:  
         - Payments would be finite and quantifiable (e.g., $X per victim).  
         - Funds would sunset after payout.  
       - **Next-Best Candidate (Corrective Justice)**: Would require one-time comprehensive valuation of harm (e.g., stolen labor + property + emotional damage). This is rejected as reductive and inadequate to ongoing harm.  

  ### 5. **The Asymmetry**  
     - **Two Conceptions of Membership**:  
       - **Paying Collective**: Defined by *current institutional membership* (residence, citizenship, taxation).  
       - **Receiving Collective**: Defined by *historical group-based persecution* marked by descent.  
     - **Coherence via Institutional Continuity**: The state, as a perpetual entity, owes redress to groups it historically defined and harmed. Current members fund this as a condition of sharing the state’s institutional inheritance (assets, stability, legitimacy). No incoherence if the state’s obligation is to *repair its own institutional wrongs*, not to "descendants" *per se*.  

  ### 6. **Test Case: Discharge Date & Opt-Out**  
     - **Instinct Confirmed**:  
       - **Reject Discharge Date**: Defenders would oppose it as negating the open-ended duty of care (symbolic repair is perpetual).  
       - **Resist Opt-Out**: Even taxpayers without ancestral ties would be denied exemption.  
     - **Revealed Principle**: The obligation binds the **institution**, not its transient members. Opt-outs would fracture the state’s unitary responsibility. Resistance confirms that the "collective" is the *state as corporate entity*, not an aggregate of moral agents.  

  ---

  ### **Core Implicit Theory**  
  The pattern presupposes:  
  1. **The state is a morally continuous corporate person** that inherits liabilities from prior institutional forms.  
  2. **Redress is a duty of the institution**, funded by its treasury to avoid implicating individuals in guilt.  
  3. **Descent is a proxy for historical group membership** in the absence of feasible alternatives.  
  4. **Payments are performative**: They signal the state’s enduring obligation to disown its past wrongs.  

  ### **Underdetermined Aspects**  
  - **Continuity Theory**: "Institutional inheritance" could be grounded in legal succession (Hobbesian) or moral trusteeship (Lockean).  
  - **Descent vs. Harm**: The practice fits both "symbolic reparation" (descent as membership) and "corrective justice" (harm proxy) theories, but strictly *presupposes* only the former.  
  - **Obligation Type**: The open-ended form is compatible with expressive, corrective, or caretaker duties—but *rules out* contractual debt.  

  This framework explains observed patterns without relying on inherited guilt, numerical state identity, or direct harm transmission—centering instead on the state’s corporate responsibility for its institutional legacy.
