  For reporter boundaries: who counts? Infants, animals, or AI that generate reports. Does heterophenomenology exclude non-verbal beings? Is verbal report a chauvinistic criterion? Thin vs thick might answer differently.

  The user also questions if thin vs thick is methodological or empirical. Can any finding discriminate between them? If not, does that make the method unfalsifiable, which is problematic for science?

