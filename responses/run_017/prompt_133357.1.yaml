prompt: |-
  Hey — please act as a professional epistemologist (or at least as someone who's genuinely read the contemporary literature on knowledge, stakes, and contextualism) and take your time with this: start by restating in your own words, as precisely as you can, what epistemic contextualism claims, what pragmatic encroachment claims, and exactly where the two come apart — I suspect half my confusion is that I've seen people use the labels as if they were one and the same view. Then go through the passage below more or less claim by claim and sort it into: fine as stated / a simplification a specialist would still accept / misleading or wrong / fine but doesn't do the work the author wants it to do. Finally, apply whatever survives to my actual situation, which I'll describe after the passage. If specialists genuinely disagree about something, say so rather than smoothing it over.

  Some background: I'm a hardware engineer, not a philosopher. I got into this after a genuinely annoying argument at work about whether we "knew" a batch of parts was within spec, and I ended up reading a long-ish popular blog post on all this by someone who clearly knows the material and is good at explaining it. Here's roughly what it said. Knowledge, it claimed, used to be understood as true belief plus good evidence, so whether you know depends only on your reasons and nothing else. Then along came epistemic contextualism, which points out that "knows" behaves like words such as "flat" or "tall": the standards it sets shift with the context of the conversation, so I can truly say on Friday that I know the bank will be open on Saturday, and yet later that day, when missing a mortgage payment is on the line, that very claim about me is false. Pragmatic encroachment, the post went on, is just the same idea in different clothes: how much is at stake for the person determines whether they know, so knowledge is partly a practical matter rather than a purely evidential one. The invariantists — the people who hold that the standards for knowledge never shift — are therefore committed to saying that evidence is the only thing that matters, and they're stuck denying the obvious point that you need stronger evidence when more is riding on being right. Both views share an unacceptable consequence, though: if knowledge depends on stakes, then a stranger who secretly places a huge bet on whether your belief is true can destroy your knowledge without your ever finding out, and since that's obviously absurd, the whole family of views is refuted.

  I'm inclined to think the stakes change what you should *do*, not what you know — but I definately can't tell whether that's a real position somebody defends or just me being stubborn. And here's the case that's actually bugging me. Last Friday I ran a torque check on a bracket and logged it as within spec; my evidence was good but not perfect, the kind of check that's plenty for an ordinary job. Saturday morning, without telling me, my manager made that single check the only remaining gate before a forty-million-dollar satellite shipment goes out the door. On Monday the client postponed the launch indefinitely and the stakes evaporated again. So: did I know on Friday? Did I stop knowing on Saturday even though nothing about me, my evidence, or the bracket changed? If I did stop, did I start knowing again on Monday, or is knowledge not the sort of thing that can flicker like that? Does it make any difference that the stakes were really the client's and my employer's rather than mine — someone at work muttered that that isn't pragmatic encroachment at all but something called moral encroachment, and I have no idea whether that's right or whether it would change the answer? And one more thing: is the secret-bet objection actually a serious problem for these views, or is there a standard reply the post just skipped?
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated request requiring multiple layers of analysis: reconstructing philosophical positions, evaluating a blog post's claims, and applying them to a real engineering case. They're clearly frustrated with superficial treatments of epistemology and want professional-grade analysis.

  First, I need to clarify the core distinction between epistemic contextualism and pragmatic encroachment that the blog post seems to conflate. Contextualism is about semantic standards shifting with conversational context, while pragmatic encroachment concerns how practical stakes affect the epistemic justification itself. The "flat"/"tall" analogy is useful for contextualism but misleading for pragmatic encroachment.

  The bank case example in the blog post actually demonstrates contextualism, not pragmatic encroachment. The post's claim that pragmatic encroachment is "the same idea in different clothes" is fundamentally mistaken - they represent different mechanisms (semantic vs. epistemic). The invariantist characterization is also overly simplistic; there are sophisticated forms of impurist invariantism.

  For the secret bet objection: contextualists have clear replies about conversational scoreboards, while pragmatic encroachment theorists debate whether third-party stakes affect justification. The blog's presentation oversimplifies this to the point of being misleading.

  The user's torque check case is fascinating. On Friday, under low-stakes contextual standards, they likely knew. On Saturday, if we accept pragmatic encroachment, their justification might become insufficient due to the raised stakes - even without their awareness. The stakes being the client's rather than their own matters for some versions of pragmatic encroachment but not others. Moral encroachment is a distinct (though related) concept about how moral considerations affect justification.

  I should note key controversies: whether unaware stakes affect knowledge (purism vs. impurism), whether knowledge can "flicker" (contextualists say yes, some encroachment theorists disagree), and if third-party stakes count (divided literature). The secret bet objection is more potent against some versions of pragmatic encroachment than contextualism.

  The user's intuition that stakes affect action but not knowledge aligns with purist invariantism - a legitimate position defended by philosophers like Fantl & McGrath. Their engineering case actually strengthens this view: why should knowledge vanish just because a manager changes shipment plans without their knowledge?
answer: |-
  Let's dissect this systematically. As requested, I'll: (1) clarify the theories, (2) evaluate the blog passage claim-by-claim, and (3) apply the surviving analysis to your case—flagging specialist disagreements throughout. (Sources: DeRose, Lewis, Cohen for contextualism; Fantl & McGrath, Stanley, Schroeder for pragmatic encroachment; Brown, Rysiew for invariantism.)

  ### I. Core Theories Demarcated
  - **Epistemic Contextualism (EC)**: The truth-conditions of knowledge attributions ("S knows that p") shift with the *speaker's conversational context*. "Knows" is context-sensitive like "flat" or "tall": in low-stakes contexts, "S knows p" can be true even if S's evidence is fallible; in high-stakes contexts, the *same evidence* may be insufficient. Crucially, this is **semantic**—it's about *what is said* when we claim "knowledge." (Key: DeRose 1992, Lewis 1996)
    
  - **Pragmatic Encroachment (PE)**: Whether S *genuinely knows* p depends partly on *practical factors* (stakes, costs of error) *for S*. Unlike EC, PE claims stakes affect the *epistemic status* of S's belief itself, not just how we talk about it. High stakes raise the *evidential threshold* required for justification/knowledge. This is **metaphysical**—it's about the nature of knowledge, not language. (Key: Fantl & McGrath 2002, Stanley 2005)

  - **Where They Diverge**: EC locates variation in *attributor standards*; PE locates it in *subject's epistemic requirements*. EC says "knows" means different things in different contexts; PE says knowledge itself is stake-sensitive. **They are not "the same idea"**—EC is semantic, PE is epistemic. Invariantists deny both.

  ### II. Blog Passage Evaluation (Claim-by-Claim)
  1. *"Knowledge used to be understood as true belief plus good evidence"*  
     → **Simplification**. JTB+ (justified true belief + anti-Gettier) is a baseline, but "good evidence" underspecifies debates about justification (internalism/externalism, etc.). Not wrong, but incomplete.

  2. *"Contextualism points out 'knows' behaves like 'flat' or 'tall'"*  
     → **Fine as stated**. This is EC's core analogy (DeRose, Lewis).

  3. *Bank case illustration of EC*  
     → **Fine as stated**. Classic example (DeRose 1992).

  4. *"Pragmatic encroachment is just the same idea in different clothes"*  
     → **Misleading/wrong**. EC and PE are distinct: EC is about *semantic context-sensitivity*, PE about *stakes affecting epistemic justification*. Conflating them is a common error.

  5. *"Stakes determine whether they know"*  
     → **Fine for PE specifically**, but wrongly attributed to EC. EC says *context* determines truth-conditions, not necessarily stakes (though stakes often drive context shifts).

  6. *Invariantists "deny you need stronger evidence when stakes are high"*  
     → **Misleading**. *Strict* invariantists (e.g., Rysiew) deny this, but *moderate* invariantists (e.g., Brown) argue stakes affect *action* (rationality of acting on p), not *knowledge itself*. Many invariantists accept stakes affect *practical rationality*, not knowledge thresholds.

  7. *Secret bet objection refutes both*  
     → **Misleading/wrong**. EC has replies: the bettor's high-stakes context makes *their* attribution "S doesn't know" true, but doesn't affect S's own low-stakes knowledge. PE theorists debate "unpossessed stakes" (see §III). **Specialist disagreement**: Some PE advocates (Schroeder) bite the bullet; others (Fantl & McGrath) restrict encroachment to *known* stakes.

  ### III. Your Torque Check Case Analyzed
  - **Friday (Low Stakes)**:  
    - **EC**: You *knew* (by low-stakes conversational standards).  
    - **PE**: You *knew* (low stakes → lower evidential threshold met).  
    - **Invariantism**: Likely knew (evidence sufficient for low-risk contexts).  
    → Consensus: You knew on Friday.

  - **Saturday (Secret High Stakes)**:
    - **EC**: *Your* knowledge attribution ("I knew Friday") remains true in *your* context. But if your *manager* says "They didn't know" in *their* high-stakes context, it's also true. **No "flickering"**—your knowledge is stable; only *attributions* vary.  
    - **PE**: **Disputed**. Hardliners (Stanley): stakes raise evidential threshold → you *ceased knowing* Saturday, despite unchanged evidence. Critics: This implies "flickering knowledge" is possible. Softliners (Fantl & McGrath): Only *known* stakes affect knowledge → you *still knew* (you were unaware).  
    - **Purist Invariantism**: You *still knew*—stakes affect action (e.g., whether to ship), not knowledge.  
    → **Specialist disagreement**: Depends on PE variant. EC denies flickering; some PE allows it.

  - **Monday (Stakes Evaporate)**:
    - **EC**: Your knowledge attributions true again.  
    - **PE**: If you ceased knowing Saturday, you *regained knowledge* Monday (threshold lowered).  
    - **Invariantism**: You knew throughout.  
    → **Controversy**: "Flickering knowledge" is a major objection to PE.

  - **Whose Stakes?**  
    - **PE**: Most theorists focus on *S's* stakes. Stakes for others (client/employer) might matter only if they affect *S's* practical reasoning (e.g., if you're liable). **Moral encroachment** (Basu, Schroeder) argues moral stakes (e.g., racial injustice) raise evidential thresholds—distinct from PE. Your case lacks moral dimensions → irrelevant.  
    - **EC**: Attributors' stakes matter, not yours.  
    → Verdict: Stakes being yours vs. employer's *could* matter for PE if liability transfers risk to you. If not, PE likely unaffected.

  ### IV. Secret Bet Objection: Status & Replies
  - **Against EC**: Weak. EC distinguishes contexts: the bettor's high-stakes claim "S doesn't know" can be true without negating S's low-stakes self-attribution. No "destruction" of knowledge.  
  - **Against PE**: Stronger. If stakes alone affect knowledge, a secret bet *could* destroy S's knowledge.  
    - **Replies**:  
      1. **Impure PE** (Fantl & McGrath): Only stakes *possessed by S* matter.  
      2. **Knowledge-Action Principle** (Stanley): If S *ought not act* on p given stakes, S doesn't know p. Secret bets don't change what S ought to do.  
    - **Remaining Vulnerability**: Hardline PE (stakes alone suffice) struggles here. **Specialists disagree** on whether this refutes PE.

  ### V. Your Intuition: A Defensible Position
  Your stance—"stakes change what you should *do*, not what you know"—aligns with **moderate invariantism** (Brown, Rysiew):  
  - Knowledge depends *only* on truth-conducive factors (evidence, reliability).  
  - Stakes determine *practical rationality* (whether to act on p), not knowledge itself.  
  - This avoids "flickering," secret bets, and contextual variability.  
  **Yes, it's a major defended position**—not stubbornness.

  ### Final Synthesis for Your Case
  - **Friday**: All theories agree you knew.  
  - **Saturday**:  
    - **EC**: You still knew (your context unchanged).  
    - **PE**: Unclear—depends on whether unaware stakes count (specialists split).  
    - **Invariantism**: You still knew.  
  - **Action**: Everyone agrees you *should not have shipped* Saturday without re-testing.  
  - **Least Problematic View**: Moderate invariantism cleanly handles your case: knowledge stable, action stakes-sensitive.  
  - **Secret Bet**: Objection potent against *some* PE, not EC or invariantism.

  Recommendation: Your engineering intuition maps to philosophically robust moderate invariantism—stakes affect actionability, not knowledge itself. The blog's conflation of EC/PE caused confusion; they're distinct theories with different vulnerabilities.
