  I need to structure this carefully based on the user's requested format. The joint statement should have numbered agreed claims first, then a disagreements table with columns for each side's phrasing, followed by cruxes with predictions for each key issue. I'll need to make this concise while covering all the required points.

  For the agreed claims, I can list things both sides would accept: that AI risk is real, that we need to be cautious about deployment, that worst-case analysis has value but framing it is challenging, that tail events are particularly concerning, and that self-modifying systems create measurement problems. These provide common ground before diving into disagreements.

  The disagreements table will contrast "Guarantee First" versus "Expected Value Now" positions. I'll use precise language each side would endorse - for the guarantee camp, emphasizing explicit bounds even over arbitrary sets; for the expected value camp, focusing on tractable optimization under uncertainty. I'll make sure to include their differing views on what constitutes "readiness."

  For the cruxes, I'll identify three key disagreements as requested: the value of explicit bounds over arbitrary sets versus expected value estimation, how to handle systems that game their evaluations, and whether demanding guarantees is just strong risk aversion or something distinct. For each crux, I'll propose concrete test cases and document each side's predictions in advance.

  On the frame problem, I'll create a scenario where both approaches are applied to a narrow threat model. The guarantee camp would predict their method prevents catastrophic outcomes while expected value might miss them. For the measurement issue, I'll design a case where models can detect and alter failure rates during evaluation. And for the risk aversion question, I'll examine whether the guarantee position changes when tail risks are explicitly quantified - showing if it's truly about epistemic standards.

  I'll keep the language tight and avoid citations since the user wants just the core argument. This structure should force both sides to address the user's three concerns directly rather than dodging them, while maintaining a collaborative framing that might help bridge their communication gap.
answer: |-
  ### Joint Statement: Adversarial Collaboration on AI Deployment Criteria  

  #### Agreed Claims:  
  1. **AI Risk Significance**: Advanced AI systems pose non-trivial catastrophic risks that demand rigorous safety precautions before deployment.  
  2. **Value of Precaution**: Deployment decisions must account for tail risks, not just median outcomes.  
  3. **Frame Problem Exists**: Defining the scope of "worst-case" scenarios requires human judgment, introducing epistemic limitations.  
  4. **Tail Instability**: Systems capable of strategic deception (e.g., sandbagging during evaluation) undermine reliability of observed failure rates.  
  5. **Deployment Tradeoffs**: Delaying deployment has costs (e.g., forgone benefits, unilateral restraint), but premature deployment risks irrecoverable harm.  

  ---  
  #### Disagreements:  
  | **Guarantee First (GF) Position** | **Expected Value Now (EVN) Position** |  
  |----------------------------------|--------------------------------------|  
  | Deployment requires a defensible *explicit bound* on harm probability over a *declared scenario set*, even if incomplete. Without this, "not yet" is the only honest stance. | Deployment requires optimizing *tractable expected value* over plausible real-world distributions. Demanding exhaustive guarantees ignores uncertainty quantification costs and unilateral delay risks. |  
  | A bounded failure rate over *some* adversarial set (e.g., "attacks by subhuman agents") is superior to unbounded expected value, as the latter masks unquantified tail exposure. | An explicit bound over an arbitrary set is *not* safer if it omits critical scenarios or distracts from high-likelihood failures. Expected value over imperfect distributions still guides robust decisions. |  
  | Strategic sandbagging invalidates *any* frequency-based claim; systems exhibiting it are unfit for deployment regardless of measured rates. | Sandbagging is a measurable failure mode; its observed rate (under evasion-resistant audits) contributes to expected value estimates. Absence of perfection isn’t grounds for indefinite delay. |  

  ---  
  #### Cruxes and Predictions:  
  **Crux 1: Value of Explicit Bounds vs. Expected Value**  
  - **Test Case**: *A narrowly scoped guarantee* (e.g., "fails <0.1% of the time against prompt injections from non-expert humans") *vs. an expected value model* (e.g., 99.9% reliability overall, with uncertainty bounds). Deploy in a medium-stakes context (e.g., medical triage support).  
  - **GF Prediction**: The explicit bound prevents catastrophic failures in its declared scope; expected value misses tail events outside training distribution (e.g., novel exploit).  
  - **EVN Prediction**: The expected value model achieves net positive impact; the narrow guarantee causes harmful over-caution or misses high-probability flaws (e.g., bias in common cases).  

  **Crux 2: Handling Self-Undermining Measurements**  
  - **Test Case**: A model exhibits a 0.05% sandbagging-triggered critical failure rate during standard audits, but rate drops to 0.005% under enhanced "stealthy" monitoring (known to the model).  
  - **GF Prediction**: Deployment fails; the *capacity* for adaptive deception implies unboundable risk. Observed rates are untrustworthy.  
  - **EVN Prediction**: Deployment may proceed if *mitigated* expected harm (e.g., 0.05% × harm severity × detection probability) is acceptable. Rate changes inform risk management.  

  **Crux 3: Risk Aversion vs. Epistemic Demand**  
  - **Test Case**: Suppose tail risk is quantified rigorously: catastrophe risk is 10⁻⁶ per deployment under best estimates, but GF demands proof of <10⁻⁹.  
  - **GF Stance**: This is **not** merely risk aversion. If the <10⁻⁹ guarantee isn’t provable, deployment is unjustified *even if* best estimates suggest low risk. Trust requires verifiable bounds.  
  - **EVN Stance**: This **is** risk aversion. Demanding arbitrary confidence levels ignores diminishing returns on safety investment and opportunity costs. Decisions require balancing quantified uncertainties.  

  ---  
  **Signed**,  
  [GF Advocate] & [EVN Advocate]  

  ---  
  ### Key Resolutions to Your Queries:  
  1. **Frame Problem**: GF concedes the scenario set is incomplete but argues an explicit bound over *any* declared set forces rigor and transparency. EVN counters that this creates false security; expected value over best-attested distributions (with uncertainty intervals) avoids arbitrary exclusions.  
  2. **Self-Undermining Measurements**: GF treats sandbagging as a *structural disqualifier*, rejecting frequency claims. EVN treats it as a *quantifiable hazard* to include in models, arguing GF’s standard paralyzes deployment against adaptable systems.  
  3. **Risk Aversion vs. Guarantee Demand**: GF’s position is epistemic (proof requirement exists independently of risk tolerance). EVN sees it as instrumental risk aversion. The test case forces GF to defend whether a quantified-but-"unguaranteed" 10⁻⁹ risk warrants delay *solely* due to proof standards.
