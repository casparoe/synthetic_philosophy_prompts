  Below is a comprehensive "Which lifeboat ethic are you?" widget based on your specifications. It uses **seven concrete scenarios** (drawn from your reporting) to sort readers into five core ethical positions, with a scoring key that handles overlaps, ties, and empty combinations. The questions are designed to split views along key logical axes (e.g., responsibility, efficiency, fairness, systemic legitimacy) without referencing philosophy jargon. Each question includes 2–3 plain-language answers that force trade-offs.  

  ### **The Widget: Which Lifeboat Ethic Guides You?**  
  *Answer each scenario based on your gut instinct. No prior philosophy knowledge needed.*  

  ---

  **Question 1: The Overloaded Sister Boat**  
  *Your lifeboat is full. Swimmers in the water are there because your crew earlier overloaded a sister boat, causing it to sink. Do you take them in?*  
  - **A) No.** Taking them risks sinking us—helping now encourages future recklessness.  
  - **B) Yes.** Our crew caused this; we owe them a spot even if it’s tight.  
  - **C) No.** The whole "rescue fleet" is broken—this isn’t a real choice.  

  **Question 2: The Navigator Swimmer**  
  *A swimmer can steer your lifeboat to a nearby emptier vessel, saving everyone aboard. But rescuing them means leaving two others behind. What do you do?*  
  - **A) Save the navigator.** More lives saved overall is what matters.  
  - **B) Save the two others.** Betting on the navigator’s promise is too risky.  
  - **C) Choose by lottery.** Fairness means all three get an equal chance.  

  **Question 3: The Refused Life Jacket**  
  *You throw a life jacket to a struggling swimmer. They refuse it, shouting, "Let me drown!" What do you do?*  
  - **A) Throw it to someone else.** Wasting it helps no one.  
  - **B) Force it on them.** They’re not thinking clearly—we must override refusal.  
  - **C) Let them refuse.** Forcing "help" on someone is cruel.  

  **Question 4: Permanent Overcrowding**  
  *Your lifeboat is perennially overcrowded because you never turn away swimmers. Suffering is constant. What do you do?*  
  - **A) Start turning people away.** Stability now prevents collapse later.  
  - **B) Keep taking them.** Reducing help betrays the drowning.  
  - **C) Build a new system.** This boat’s design is the problem—scrap it.  

  **Question 5: The Rule-Breaking Turnaway**  
  *Your lifeboat’s core rule is: "Never deny a swimmer if there’s space." But taking one more risks sinking everyone. Do you take them?*  
  - **A) Follow the rule.** Breaking it unravels trust in the system.  
  - **B) Break the rule.** Saving the group outweighs one life or one rule.  
  - **C) Break the rule and the system.** This rule proves the setup is rotten.  

  **Question 6: The Crew’s Past Mistake**  
  *A swimmer was left behind years ago because your crew made an error. Now you see them. Do you make space, even if it means ejecting someone else?*  
  - **A) Yes.** Fixing past harm is our duty, even at a cost.  
  - **B) No.** Saving the most lives now is what counts—past errors don’t change that.  
  - **C) No.** Dwelling on the past ignores today’s crisis.  

  **Question 7: Swimmers vs. Boat Rules**  
  *Swimmers beg for help, but turning them away would violate your boat’s founding principle: "Save all who ask." What do you do?*  
  - **A) Turn them away.** Principles can’t override survival.  
  - **B) Take them in.** The rule defines who we are—we must uphold it.  
  - **C) Ignore the rule.** If it forces impossible choices, it’s corrupt.  

  ---

  ### **Scoring Key**  
  Tally your answers. Each letter corresponds to points for specific ethics. The ethic with the **highest total points** is your primary stance. Ties indicate hybrid views (common) or unresolved conflicts.  

  | Answer | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 |  
  |--------|----|----|----|----|----|----|----|  
  | **A**  | H, T | T | T, H | H | T, H | T | H, T |  
  | **B**  | R | H | R | R | R | R | R |  
  | **C**  | S | L | S | S | S | H | S |  

  - **H = Hardin-style (Lifeboat Preservationist)**: Helping risks collective ruin. Prioritize stability.  
  - **T = Triage (Utilitarian Rescuer)**: Save the most lives, regardless of fairness or past wrongs.  
  - **R = Repair-first (Restitutionist)**: Those who caused harm owe repairs. Justice over efficiency.  
  - **L = Fair Lottery (Chance Egalitarian)**: Random selection is the only fair way when lives clash.  
  - **S = Systemic Rejector**: The boat’s setup is corrupt—no "fair" allocation exists within it.  

  **How to score**:  
  1. For each answer, note which ethics get a point (e.g., Q1A gives 1 point to **H** and **T**).  
  2. Sum points for each ethic.  
  3. Highest score wins. For ties:  
     - **H/T tie**: You blend preservation and triage—leaning toward "save the group efficiently."  
     - **R/S tie**: You focus on repair but reject the system—unstable but common in activism.  
     - **L rare ties**: If tied with L, you likely have a strong fairness instinct.  

  ---

  ### **The Five Ethics (and Uninhabited Combinations)**  
  Based on your answers, you align with one of these:  

  1. **Lifeboat Preservationist (Hardin-style)**  
     - **Core**: Helping drowns everyone. Avoid short-term compassion that worsens long-term survival.  
     - **Your answers**: Mostly **A** in Q1, Q2, Q4, Q5, Q7.  
     - **Real-world analog**: Border limits, climate migration caps.  

  2. **Utilitarian Rescuer (Triage)**  
     - **Core**: Maximize lives saved. Numbers trump fairness, history, or rules.  
     - **Your answers**: Mostly **A** in Q1, Q2, Q5, Q6.  
     - **Real-world analog**: ICU rationing during COVID, effective altruism.  

  3. **Chance Egalitarian (Fair Lottery)**  
     - **Core**: When claims clash, randomness is the only fair solution.  
     - **Your answers**: **C** in Q2 (no other questions strongly signal L).  
     - **Why only one split?** This ethic is niche and rarely separates from triage/repair in cases. Flagged per your request.  

  4. **Restitutionist (Repair-first)**  
     - **Core**: Harm-doers owe repair. Prioritize victims of past injustices.  
     - **Your answers**: Mostly **B** in Q1, Q3, Q4, Q5, Q6, Q7.  
     - **Real-world analog**: Reparations, climate liability funds.  

  5. **Systemic Rejector**  
     - **Core**: The boat’s design is rigged. Allocation debates distract from burning it down.  
     - **Your answers**: Mostly **C** in Q1, Q3, Q4, Q5, Q7.  
     - **Real-world analog**: Abolish borders/patents, not just reform them.  

  #### **Empty Combinations and Why**  
  - **"Efficient Repair" (T + R)**: Logically incoherent. Repair demands prioritizing past victims; triage ignores history for aggregate gains. No one inhabits this.  
  - **"Fair Hardin" (H + L)**: Unattractive. Hardin rejects helping; lotteries require helping someone. Unwritten in ethics literature.  
  - **Why only 7 questions?** Q3 (life jacket refusal) is the weakest splitter (it tests agency vs. paternalism but doesn’t cleanly divide the core five). I’d cut it if forced—it’s the least "load-bearing" question.  

  #### **Key Logical Axes Used**  
  - **Responsibility (Q1, Q6)**: Splits repair-first from others.  
  - **Efficiency (Q2)**: Splits triage from Hardin/lottery.  
  - **Rule-Legitimacy (Q5, Q7)**: Splits systemic rejectors from proceduralists.  
  - **Time Horizon (Q4)**: Splits Hardin (long-term) from repair/triage (immediate).  
  - **Agency (Q3)**: Weakly splits systemic rejectors (anti-paternalism) from restitutionists (paternalism).  

  This widget forces users to confront trade-offs (e.g., Q2 pits triage against Hardin/lottery) and avoids "textbook" phrasing. The scoring handles real-world overlaps (e.g., many tie Hardin and triage). For the online version, I recommend adding a visual (e.g., a lifeboat graphic) and a brief explainer for each ethic.
