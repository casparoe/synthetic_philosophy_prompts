answer: |-
  Here’s a structured analysis of the exposure points for your lexical-threshold negative utilitarianism (LTNU), grounded in the urgency-invitation asymmetry. Defeaters are ranked by severity, with concessions a defender might make separated from dismissible objections. The epistemic worry is addressed last.

  ---

  ### **Fatal or Near-Fatal Defeaters**
  1. **The Diffusion Dilemma (Aggregation Paradox)**  
     - **Problem**: If sub-*t* pains aggregate *across persons*, a vast number of mild pains (each just below *t*) could lexically dominate any pleasure, collapsing LTNU into classical negative utilitarianism. If they *don’t* aggregate, LTNU cannot explain the moral significance of large-scale suffering (e.g., billions with chronic headaches).  
     - **Is there a stable middle?**  
       - A defender might propose **non-linear aggregation**: Sub-*t* pains aggregate but with diminishing marginal disvalue (e.g., logarithmic scaling). However, this risks arbitrariness and fails to block eventual lexical dominance at scale.  
       - **Alternative**: Restrict lexical dominance to *intra-personal* aggregation. Only pains *within a single life* can sum to exceed *t*. But this abandons the core NU motivation (e.g., preventing distributed suffering in large populations).  
     - **Defender’s concession**: This *is* a genuine dilemma. No aggregation rule fully preserves LTNU’s intuitions without ad hoc adjustments.  

  2. **Urgency Criterion Over/Under-Inclusiveness**  
     - **Problem**: If urgency grounds lexicality:  
       - **Over-inclusiveness**: Non-painful urgent states (e.g., severe nausea, OCD compulsions) should be lexically dominant. Yet intuitively, a life with eternal mild nausea but immense pleasure might be acceptable.  
       - **Under-inclusiveness**: A pain registering high intensity but lacking urgency (e.g., in a dissociated or medicated subject) wouldn’t count lexically. This contradicts the view that pain’s disvalue is intrinsic.  
     - **Defender’s response**:  
       - Embrace the predictions? Argue that *all* urgent states (pain or not) are lexically bad. But this expands LTNU beyond recognizability.  
       - Concede that urgency might be a *proxy* for pain’s disvalue, not its ground. This undermines (iii)’s explanatory role.  
     - **Verdict**: Strong evidence that urgency is a redescription, not an explanation. A fatal blow if no principled link to pain remains.  

  ---

  ### **Serious but Potentially Manageable Worries**  
  3. **Threshold Location (*t*) on a Continuum**  
     - **Problem**: Pain intensity is continuous; no natural boundary separates "urgent" from "non-urgent" pain. Setting *t* at a specific point (e.g., 7/10 on a scale) appears arbitrary.  
     - **Defender’s reply**: Urgency manifests phenomenologically as a phase shift (e.g., pain that "breaks" agency). *t* is vague but not arbitrary—like the boundary between "hot" and "cold."  
     - **Exposure**: Vagueness invites slippery-slope objections (e.g., why is pain at *t*–ϵ compensable but *t*+ϵ not?). Mitigated if urgency is scalar, but lexicality requires a sharp cutoff.  

  4. **Epistemic Undecidability of Intensity Comparisons**  
     - **Problem**: If interpersonal pain intensity is unmeasurable (as you suspect), we cannot reliably compare states to *t* or apply the asymmetry. Is lexicality a fact or an artifact of our scales?  
     - **Defender’s options**:  
       - **Embrace indeterminacy**: LTNU describes a *structural* truth, but practical applications require proxies (e.g., functional impairment). This avoids falsification but risks emptiness.  
       - **Reject skepticism**: Urgency is interpersonally recognizable via behavioral/neural correlates (e.g., pain that disrupts executive function).  
     - **Your concern**: If undecidable, LTNU may be non-falsifiable. *But* this is a meta-problem for all intensity-based theories, not unique to LTNU.  

  ---

  ### **Awkward but Mitigable Worries**  
  5. **Fanaticism and Low-Probability Risks**  
     - **Problem**: A vanishingly small chance of a pain ≥*t* (e.g., 1 in 10¹⁰⁰) lexically outweighs any finite sub-*t* good. This implies extreme risk-aversion (e.g., rejecting any pleasure-generating activity with nonzero torture risk).  
     - **LTNU mitigation**: Unlike totalist NU, lexicality only applies to pains *above* *t*—sub-*t* harms are commensurable. Defenders can also invoke decision theory (e.g., discounting negligible probabilities).  
     - **Residual awkwardness**: The asymmetry still prioritizes improbable supra-*t* pains over certain large sub-*t* benefits.  

  6. **Non-Pain Suffering**  
     - **Problem**: Emotional anguish (e.g., grief) may be urgent without sensory pain. If LTNU excludes it lexically, it’s underinclusive; if included, it overextends.  
     - **Defender’s move**: Limit lexicality to states with *sensory-affective urgency*. Grief may lack the "demand for immediate relief" characteristic of severe pain.  

  ---

  ### **What a Defender Dismisses**  
  - **Rival frameworks**: Objections assuming hedonism (e.g., "pleasure is intrinsically good") or egalitarianism miss LTNU’s foundations.  
  - **General NU objections** (e.g., "life isn’t worth living"): LTNU avoids these by allowing sub-*t* compensation.  
  - **Threshold arbitrariness**: Dismissed as missing the phenomenological basis of urgency.  

  ---

  ### **Has Qualification Made the View Riskless?**  
  - **Risk**: Yes, to a degree. By invoking vagueness (*t*), indeterminacy (intensity scales), and non-aggregation, LTNU can deflect counterexamples—but at the cost of predictive power.  
  - **Defect?** Only if it abandons *explanatory* ambitions. A defender could argue LTNU is a *conceptual* claim: "If urgency exists, it has this normative role." This reframes it as a modal insight, not an empirical theory.  

  ---

  ### **Conclusion: Viability and Your Epistemic Worry**  
  - **Fatal flaws** lurk in the diffusion dilemma and urgency criterion. If sub-*t* pains cannot aggregate meaningfully *without* collapsing lexicality, or if urgency fails to track pain specifically, LTNU is untenable.  
  - **Epistemic undecidability** is available to you. If pain intensities are incomparable across persons, LTNU (and all similar theories) becomes a *local* principle: "For any agent, pains ≥*t* dominate." This avoids falsification but limits scope. **You need not reject it**—it coheres with anti-realist trends in moral epistemology.  

  **Final Ranking of Defeaters**:  
  1. Urgency over/under-inclusiveness → Potentially fatal if unresolved.  
  2. Diffusion dilemma → Near-fatal; no elegant solution.  
  3. Epistemic indeterminacy → Profound but not fatal; reframes the view.  
  4. Threshold vagueness → Serious but manageable.  
  5. Fanaticism → Awkward but defused by probability thresholds.  

  The view’s survival hinges on whether (iii) can bear the weight placed on it. If urgency is merely *correlative* with lexical disvalue—not explanatory—the structure may hold, but its philosophical appeal diminishes.
