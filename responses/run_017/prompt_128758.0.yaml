prompt: |-
  Please act as a professional philosopher who also has a working knowledge of personality and social psychology. Before you settle on a verdict, brainstorm the ways the analogy below might come apart, and let that brainstorm shape the answer: I want the mapping and its failure points argued explicitly rather than a smooth verdict handed down.

  I have recently been asked to co-chair the committee redesigning professionalism training at my teaching hospital, and we keep coming back to one analogy that is quietly doing all the work. Our director, an Aristotelian, wants to replace the current lecture-and-pledge format with repeated, coached practice of quite specific behaviors — delivering bad news, owning an error in front of a family, interrupting a colleague who is belittling a nurse. Her justification is that character is a skill, like any other skill you acquire by doing it, with feedback, until it becomes second nature.

  A colleague who reads the social-psychology literature says this concedes the situationist critique rather than answering it. Whether someone stops for a stranger in distress, he points out, is predicted far better by how rushed they are than by anything we would call compassion; behavior tracks circumstances, not traits. So if virtue is a bundle of fine-grained, situation-specific competences, there is no such thing as a trustworthy person, only a trustworthy person-in-a-context — and the honest upshot of taking character to be a skill is that the budget should go to defaults, checklists and unit culture rather than to character.

  She replies that this gets skills wrong. A good clinician is not consistent in the sense of doing the same thing in every setting, but reliable in the sense of tracking what matters, adjusting to the room, and holding up when tired or rushed; drilled competence is exactly what carries over into unscripted situations. On her view the skill analogy is what rescues virtue from the situationist findings, not what capitulates to them.

  Please audit the analogy. Give me an explicit correspondence table — the coach, the drill, the feedback, the standard of success, automaticity, transfer, decay without practice, the learner's own grasp of what she is doing — and for each row say what it maps onto in the virtue case and how well it holds. Then separate the disanalogies that matter for the work the analogy is being asked to do from the ones that are merely cosmetic. Three I care about in particular: a skill can be exercised to bad ends and still count as a skill, whereas a virtue seemingly cannot; a skill has success conditions checkable from outside the agent, whereas the point of a virtue seems to include her reasons and motives; and skills are domain-specific in a way that may leave no room for the domain-general capacity we appeal to when we call someone trustworthy in a situation we have never seen her in. On that last one: some of our residents are unfailingly gentle with patients and curt with the nurses who page them, and I would like you to say what the analogy predicts about whether this is one competence badly generalized or a failure of character.

  Finally: does the director's conclusion — that we should keep investing in character rather than in systems — survive, or was it being carried by the analogy rather than supported by it? And if the skill analogy cannot bear the weight, is there a better one available from the neighborhood — craft, clinical judgement, practical expertise, fluency in a language — or is the honest answer that no analogy drawn from competences can do this work?
reasoning: |-
  Okay, let me approach this query methodically. The user presents a nuanced philosophical debate about virtue-as-skill analogy in medical professionalism training, requesting explicit mapping and critical analysis. 

  First, I need to unpack the core positions: the Aristotelian director sees character as trainable skills through coached practice, while the situationist colleague argues this concedes to contextual factors over stable traits. The user specifically wants the analogy audited with correspondence tables and key disanalogies examined.

  For the mapping exercise, I consider each component:
  - Coach → moral exemplars/mentors (strong but limited by availability)
  - Drill → behavioral rehearsal (plausible for micro-skills but may not build integrity)
  - Feedback → social correction (effective but risks superficial compliance)
  - Automaticity → habituated virtue (similar phenomenology but different intentional structure)

  The three critical disanalogies require special attention:
  1) Moral valence - skills are amoral while virtues are inherently good. This challenges whether drill can produce genuine virtue rather than just behavioral compliance.
  2) Internal/external criteria - clinical skills have observable success metrics, while virtue requires proper motives. Checklists can't assess internal states.
  3) Domain-generality - the resident example (gentle with patients/curt with nurses) shows skills can be compartmentalized, whereas we expect character consistency across contexts. This directly undermines the "trustworthy person" concept.

  Regarding the funding dilemma: the analogy weakly supports behavioral training but can't justify character investment over systemic fixes. Alternatives like craft or language fluency might better capture practical wisdom but still struggle with moral dimensions. Ultimately, no competence analogy fully resolves the situationist challenge - we must accept both behavioral training and culture redesign.

  The resident case illustrates this: their inconsistent behavior suggests context-bound competences rather than failed character generalization. The analogy predicts this pattern precisely, revealing its inability to produce cross-situational integrity.
answer: |-
  ### Correspondence Table & Critical Audit  
  *(Mapping: Skill Acquisition ↔ Virtue Formation)*  

  | **Skill Component**       | **Virtue Analogue**                          | **Mapping Strength**                                                                 | **Failure Points**                                                                 |
  |---------------------------|---------------------------------------------|--------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Coach**                 | Mentor/exemplar (e.g., senior clinician)    | Strong: Direct guidance accelerates learning.                                        | Moral exemplars are rarer than technical coaches; virtues require deeper internalization than skills. |
  | **Drill**                 | Repeated behavioral rehearsal (e.g., simulations) | Strong: Builds automaticity in *specific* scenarios (e.g., delivering bad news).     | Risks "scripted" virtue: may not transfer to unscripted moral crises (e.g., novel power dynamics). |
  | **Feedback**              | Social/moral correction (e.g., debriefs)    | Moderate: Corrects observable actions.                                               | Fails to assess *motives* (e.g., "Owning an error" to avoid litigation ≠ integrity). |
  | **Standard of Success**   | Context-appropriate action (e.g., family feels respected) | Weak: Aligns with outcomes.                                                          | Virtue requires *right reasons* (e.g., empathy vs. performative care). External checks miss inner states. |
  | **Automaticity**          | Habituated response (e.g., interrupting bias) | Strong: Both bypass deliberation under pressure.                                     | Automatic skill ≠ moral excellence (e.g., a skilled liar). Virtue requires conscious commitment. |
  | **Transfer**              | Cross-context reliability (e.g., gentle with all staff) | **Weakest Link**: Skills transfer within domains; virtues demand *domain-general* integrity. | Explains resident inconsistency: "patient gentleness" ≠ "nurse respect" without shared moral foundation. |
  | **Decay without Practice** | Erosion of virtuous habits                  | Moderate: Both degrade without reinforcement.                                        | Systems (e.g., checklists) may sustain behavior better than character drills alone. |
  | **Learner’s Grasp**       | Reflective understanding (e.g., "Why this matters") | Weak: Skills need technical insight; virtue requires *phronesis* (practical wisdom). | One can master "professional behavior" without moral growth (e.g., cynics following protocols). |

  ---

  ### Key Disanalogies & Implications  
  **1. Moral Valence**  
  - **Disanalogy**: Skills are amoral (e.g., surgical precision used for harm); virtues are inherently good (e.g., compassion cannot be vicious).  
  - **Impact**: Training "virtuous behaviors" risks producing technically proficient but ethically hollow clinicians (e.g., mechanically "apologizing" without remorse).  

  **2. Internal vs. External Criteria**  
  - **Disanalogy**: Skill success is externally verifiable (e.g., checklist completion); virtue requires alignment of act, motive, and reason.  
  - **Impact**: Coached drills may improve *performance* but not moral understanding (e.g., residents "owning errors" to pass evaluations, not from integrity).  

  **3. Domain-Specificity vs. Generality**  
  - **Disanalogy**: Skills are modular (e.g., "bad news delivery" ≠ "interrupting bias"); virtues imply cross-situational consistency ("trustworthiness").  
  - **Resident Case**: Gentle with patients/curt with nurses is **compartmentalized competence**, not "bad generalization." The analogy predicts this: skills lack inherent unity. Virtue fails if character isn’t cultivated holistically.  

  ---

  ### Verdict on the Director’s Conclusion  
  **The analogy cannot bear the weight.**  
  - **Why it fails**: It entrenches (rather than resolves) the situationist critique. Training atomized "virtue-skills" concedes that character is just context-bound behavior. The resident example proves this: skills *can* be siloed, but we expect virtues to unify conduct.  
  - **Funding Implication**: Prioritizing *only* character training ignores how systems (checklists, culture) scaffold ethical action under pressure. The budget *should* split: drills for high-frequency scenarios (e.g., error disclosure) + systems for low-frequency/high-stakes contexts (e.g., crisis triage).  

  ---

  ### Better Analogies?  
  1. **Craft** (e.g., pottery):  
     - **Strength**: Integrates technique, judgment, and embodied wisdom.  
     - **Limit**: Still prioritizes outcome over motive (a beautiful vase can be made spitefully).  

  2. **Language Fluency**:  
     - **Strength**: Grammar = rules (systems); nuance = pragmatics (character). Fluency requires both.  
     - **Limit**: Lacks virtue’s inescapable moral dimension (one can be fluent in manipulation).  

  3. **Clinical Judgment**:  
     - **Best Fit**: Blends knowledge, perception, and action under uncertainty—like *phronesis*.  
     - **Potential**: Frame virtues as "moral diagnostics": recognizing moral salience (e.g., power dynamics) and responding adaptively.  

  **Conclusion**: No competence analogy fully captures virtue, as all omit its necessary link to the *good*. **Hybrid approach**: Train *behaviors* via drills (per director) *while* building systems (per colleague) and fostering practical wisdom ("Why must we be trustworthy?"). Virtue emerges from this ecosystem, not drills alone.  

  > "We are what we repeatedly do. Excellence, then, is not an act, but a habit." —Aristotle (*Nicomachean Ethics*). But habits without moral reflection produce technicians, not moral agents.
