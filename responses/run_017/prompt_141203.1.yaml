prompt: |-
  I chair the scientific panel for a five-year research programme on how we get from objects to claims about the past, and I have to defend a portfolio to a funding board in six weeks. I would like you to act as a sceptical outside reviewer and give me a defended prioritization of lines of work, not a survey of the field. Please argue from the structure of the inference problem itself; I do not want a reading list, a literature map, or citations, and I would rather you were wrong in an interesting way than safe.

  The programme's constraints, which are fixed and non-negotiable:

  1. No new excavation or fieldwork. We can fund re-analysis of existing museum and repository collections and of legacy excavation archives, including collections whose provenance documentation is incomplete, inconsistent, or partly reconstructed decades after the fact.
  2. A modest budget for new measurement on those collections — imaging, residue and use-wear analysis, radiometric dating, geochemistry — at a unit cost that rules out large-n work. Think hundreds of objects carefully measured, not tens of thousands cheaply classified.
  3. No site- or period-specific monographs. We fund method, calibration, and the machinery of inference.
  4. The required output is reliability guidance. Someone who must make or assess a consequential public claim about what people in the past believed, or about how they were governed — a curator writing a permanent display, a heritage official, an expert witness in a repatriation or land-use proceeding — should be able to tell an inference the record actually supports from one that is merely a coherent story, and should have a vocabulary for saying the difference out loud. The board will ask what changes in practice if this programme succeeds, and that question needs a real answer.

  I have been working with five stipulative labels for what I take the difficulties to be. They are my coinages, not established terms, and I am as interested in whether they carve the problem correctly as in anything else:

  - signature collapse — the suspicion that the map from institutional arrangements to durable material residues is many-to-one, so that quite different forms of authority, or quite different beliefs, are statistically indistinguishable in what survives. The live question, as I see it, is whether this collapse is a property of the record itself or of the coarseness of our descriptive vocabulary — whether finer measurement would break the tie, or whether no measurement could.
  - survival asymmetry — the thought that the filter between past practice and present assemblage is not neutral with respect to what we want to detect: practices whose operation is verbal, bodily, ephemeral, or perishable leave systematically less, so that our sample is biased against certain kinds of institution in a way that is not merely small but directional.
  - phase averaging — the mismatch between the temporal grain of deposits and the temporal grain of our claims: a phase in a sequence may span generations, while an institution or a belief is a claim about what people at some time took to be binding. A long-run pattern of apparent stability might be produced either by one durable institution or by repeated short-lived ones founded, collapsing, and re-founded.
  - the answer-key problem — the record never arrives with its own interpretation attached, so an inference procedure can apparently only be tested by running it forward: build or borrow a case where the past is independently known, generate or document the residue it would leave, and see whether the procedure recovers it. The question is how much confidence forward-only testing can purchase, and what its ceiling is.
  - confidence laundering — the observed drift of a claim from hedged in a specialist report to flat in a display text, a heritage designation, or testimony, with the hedge lost at each hand-off.

  To keep the prioritization from floating, here is a fixed reference case. Call it Case U: a regional mortuary sequence in which grave assemblages converge over roughly two centuries on a narrow, highly standardized set of object types and depositional treatments, and then diverge again; the earliest usable documentary evidence postdates the sequence by about five centuries and says nothing about the period. Right now the honest reading of Case U is a disjunction: a central authority imposed a norm; a decentralized prestige system converged on one without any authority at all; or the appearance of standardization is an artifact of which dead people were selected for burial in the first place. Judge each candidate line of work partly by whether, if it succeeded, we could say more about Case U than that disjunction, and by whether it could tell us that we cannot say more.

  Two items are already on the table because they are fashionable and visually legible to the board: large-scale automated classification of artefact images, and a much bigger comparative database of grave assemblages for analogue-matching. I suspect both may be ways of buying more data of the kind that got us into this situation. Tell me whether either deserves a slot, and if so under what condition and at what size.

  Please return a single JSON object with this schema:

  {
    "assumptions_challenged": [strings — places where you think my framing of the programme, my five labels, or my description of Case U is confused, with the correction in one or two sentences each],
    "criteria": [{"name": string, "definition": string, "role_in_ranking": string, "tension_with": string} — the criteria you are actually using and how you are trading them off against each other],
    "priorities": [
      {
        "rank": integer,
        "title": string,
        "question": string — the open question in one sentence, phrased so that it has a possible answer,
        "upstream_of": [strings — which other items or which common interpretive claims this gates],
        "blocked_by": [strings — what must be settled first, or none],
        "tractability": {"approach": string, "years": number, "people": string, "what_success_looks_like": string, "main_obstacle": string},
        "neglectedness": string,
        "effect_on_case_u": string,
        "policy_payoff": string — what concretely changes for the curator, official, or witness,
        "demotion_condition": string — the finding or failure that should move this down the list
      }
    ],
    "cut_list": [{"item": string, "why_cut": string, "condition_to_revive": string}],
    "resource_split": {"new_measurement": percent, "formalisation_and_forward_modelling": percent, "calibration_with_known_outcomes": percent, "translation_into_guidance": percent, "justification": string},
    "crux": string — the single question on which the largest part of this ordering turns,
    "biggest_risk_to_the_agenda": string — the most likely way a five-year programme built this way produces nothing that changes practice
  }

  Aim for four to six entries under priorities, ordered, and write the string fields as prose aimed at someone who has to defend the ordering aloud to a board that is inclined to ask why this is not just more interpretation.
reasoning: |-
  We are given a fixed set of constraints and a set of five "stipulative labels" that describe difficulties in archaeological inference. The goal is to prioritize research lines that address these difficulties, with a focus on improving the reliability of claims about the past, especially for consequential public uses. The prioritization must be defended based on the structure of the inference problem and its application to a reference case (Case U). We are to avoid literature surveys and instead argue from the inference problem.

  The constraints are:
  1. No new excavation; re-analysis of existing collections and archives, even with incomplete provenance.
  2. Modest budget for new measurements (hundreds of objects, not thousands).
  3. No site-specific monographs; focus on method, calibration, and inference machinery.
  4. Output: reliability guidance for making/assessing public claims.

  The five difficulties:
  - Signature collapse: many-to-one mapping from past institutions to material residues.
  - Survival asymmetry: bias in the record against ephemeral practices.
  - Phase averaging: temporal mismatch between deposits and claims (e.g., institutions).
  - Answer-key problem: lack of independent test cases for inference procedures.
  - Confidence laundering: drift from hedged claims to flat assertions.

  Reference Case U: A mortuary sequence with convergence then divergence of grave assemblages, with no contemporary documents. Current interpretation is a disjunction: central authority, decentralized prestige system, or burial selection bias.

  Two fashionable items are on the table: large-scale automated classification of artifact images and a bigger comparative database of grave assemblages. We must evaluate if they deserve a slot.

  We must output a JSON object with the specified schema.

  Approach:
  1. Challenge assumptions: Identify any confusion in the framing, the five labels, or Case U.
  2. Define criteria for prioritization: These should reflect the inference problem and the constraints.
  3. Prioritize 4-6 research lines: Each with details as per the schema, ordered by rank.
  4. Cut list: Evaluate the two fashionable items and any others that should be cut.
  5. Resource split: Allocate percentages to categories of work with justification.
  6. Crux: The central question the ordering hinges on.
  7. Biggest risk: The most likely way the program fails to change practice.

  Assumptions Challenged:
  - Let's examine the five labels and Case U.

  Criteria for Prioritization:
  We need criteria that capture:
  - How much the research reduces uncertainty in the inference process (reliability).
  - How much it addresses the core difficulties (the five labels).
  - Tractability within constraints (no new excavation, modest measurement budget).
  - Potential for policy payoff (concrete guidance for users).
  - Neglectedness: whether the research is under-addressed.

  Potential Criteria:
  1. Leverage on core difficulties: How directly and effectively the research addresses one or more of the five labels.
  2. Tractability: Feasibility within the constraints (time, budget, data).
  3. Generality: Applicability beyond specific cases (since we avoid monographs).
  4. Policy payoff: Potential to change practice by providing clear guidance.
  5. Neglectedness: Whether the research area is overlooked, especially relative to its importance.

  Tensions:
  - Tractability vs. Leverage: Some high-leverage problems might be less tractable.
  - Generality vs. Policy payoff: Very general methods might be harder to translate into concrete guidance.

  Priorities:
  We must generate 4-6 research lines. They should be framed as questions with possible answers and address the five labels. They must be evaluated for their effect on Case U and the policy payoff.

  Cut List:
  The two fashionable items: automated classification and comparative database. We must decide if they should be included or cut.

  Resource Split Categories:
  - New measurement: Using the modest budget for new analyses.
  - Formalisation and forward modelling: Developing models of how past practices leave residues.
  - Calibration with known outcomes: Using historical cases where the past is known to test inference methods.
  - Translation into guidance: Turning research results into tools and protocols for end-users.

  Crux: The central question that the prioritization hinges on.

  Biggest Risk: What could cause the program to fail to change practice.

  Let's outline the priorities:

  Potential Research Lines:

  1. Signature collapse: Is it due to coarse description or inherent in the record? 
     - Approach: Use high-resolution measurements on a carefully selected set of objects from existing collections to see if we can break the tie in ambiguous cases (like Case U). 
     - Effect on Case U: Could distinguish between the disjuncts by revealing subtle variations in the standardized set that align with one model or another.

  2. Survival asymmetry: How to detect the presence of practices that leave few traces?
     - Approach: Develop methods to infer the existence of perishable practices from their indirect effects on durable residues (e.g., patterns that only make sense if there was a perishable component). 
     - Effect on Case U: Could reveal if the convergence was due to an ephemeral practice (e.g., a ritual that left no direct trace but influenced burial selection) and thus rule in or out the burial selection bias.

  3. Phase averaging: How to infer the temporal dynamics within a phase?
     - Approach: Use high-precision dating (if feasible within budget) and modeling to see if the sequence of deposits within a phase shows evidence of change. Alternatively, use simulation to see what temporal patterns would produce the observed residue.
     - Effect on Case U: Could determine if the convergence period was stable or a series of short-lived events.

  4. Answer-key problem: How to test inference methods without a true answer key?
     - Approach: Use forward modeling: simulate the residue of a known (or hypothesized) practice and then see if the inference method recovers it. Also, use historical cases with documents as calibration points.
     - Effect on Case U: Provides a way to test the methods we use on Case U.

  5. Confidence laundering: How to prevent drift?
     - Approach: Develop a framework for tracking uncertainty through the chain of inference and requiring explicit propagation in reporting. Also, create tools for end-users to visualize uncertainty.
     - Effect on Case U: Ensures that the disjunction in Case U is not presented as a single flat claim.

  But note: We are constrained by no new excavation and only re-analysis. Also, the budget for new measurements is modest (hundreds of objects). We must also avoid site-specific monographs.

  Given that, let's structure the priorities:

  Priority 1: Resolving signature collapse through measurement and modeling.
  - Question: Can high-resolution measurement of existing objects break signature collapse by revealing previously undetected variation that discriminates between competing institutional explanations?
  - This is upstream because if signature collapse is inherent, then no amount of measurement will help and we must adjust our claims accordingly.

  Priority 2: Quantifying survival asymmetry and its effects.
  - Question: Can we develop a method to estimate the magnitude and direction of survival asymmetry for a given context and thereby correct for it in inference?
  - This is blocked by understanding what kinds of practices leave what residues (partly addressed by forward modeling).

  Priority 3: Disaggregating phase averaging with temporal modeling.
  - Question: Can we use existing chronological data (and perhaps targeted re-dating) combined with simulation to infer the minimum temporal grain of institutional change within a phase?
  - This is upstream because without it we might mistake short-lived institutions for long ones.

  Priority 4: Building test cases for the answer-key problem.
  - Question: Can we construct a set of test cases (using historical periods with documentation) to calibrate inference methods for contexts without documentation?
  - This is crucial for validating the methods we use.

  Priority 5: Mitigating confidence laundering via uncertainty propagation.
  - Question: Can we design a chain-of-custody for uncertainty that survives from specialist analysis to public claim, and does it change what claims are made?
  - This is about translation into guidance and is gated by having reliable uncertainty estimates from the other methods.

  But we must also consider the two fashionable items:

  - Large-scale automated classification: Might help with signature collapse by providing a finer descriptive vocabulary? But we have a constraint of modest measurement budget (hundreds of objects, not thousands). So large-scale might not be feasible. Also, if the problem is inherent collapse, then more data of the same kind won't help.

  - Bigger comparative database: Might help by providing analogues? But again, without addressing the core difficulties, it's just more data of the same kind.

  So we might cut them unless they are reframed to address the core difficulties.

  Cut List:
  - Automated classification: Cut because without addressing the collapse (is it descriptive or inherent?) it might not help. Condition to revive: if we find that signature collapse is mainly due to coarse description, then automated classification (with high-resolution features) becomes a top priority.
  - Comparative database: Cut because it doesn't address the disjunction in Case U without a method to break the tie. Condition to revive: if we can show that the disjunction can be broken by matching to analogues with known outcomes (but then we need known outcomes, which is the answer-key problem).

  Resource Split:
  - New measurement: 30% (because we need to test if finer measurement breaks signature collapse)
  - Formalisation and forward modelling: 30% (to model survival asymmetry, phase averaging, and to build test cases)
  - Calibration with known outcomes: 20% (to address the answer-key problem)
  - Translation into guidance: 20% (to combat confidence laundering and ensure the guidance is usable)

  Justification: The core difficulties require both new data (measurements) and new models (formalisation). Calibration is essential for validation. Guidance translation is critical for impact but depends on the others.

  Crux: The crux of the prioritization is whether signature collapse is primarily a problem of descriptive coarseness or inherent in the record. If the former, then measurement and classification become paramount; if the latter, then we must focus on modeling and uncertainty.

  Biggest Risk: The biggest risk is that we succeed in refining methods but fail to translate them into actionable guidance that changes how claims are made in public contexts, because the guidance is too abstract or the uncertainty too high to be useful.

  Now, let's write the JSON with the required fields.
