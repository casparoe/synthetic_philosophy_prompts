prompt: |-
  I'm giving a short talk to a political-theory reading group next month on whether visitors have to follow local conventions — the everyday kind: how much you tip, whether you form a line or crowd the door at a bus stop, whether you cross against the light on a visibly empty street. I've circulated a one-page statement of where I've landed so the others can poke holes in it before I present, so I'd like you to treat the list below the way they will: as a position to audit rather than a question to answer. Assume I'm reasonably happy with each item taken on its own; what I can't see is whether they hold up together.

  Here is the statement, more or less as I wrote it. (1) The reason a convention gives me to conform is exhausted by the social facts: others conform, they expect me to, and my conforming helps keep the coordination going. Nothing more is needed, and the reason is conditional — it lapses once enough others stop conforming, because then there's nothing left for me to coordinate with. This is the standard coordination account of convention: an arbitrary resolution of a recurring coordination problem, held in place by common knowledge of general conformity; Lewis's name is the one always attached to it. (2) Some breaches of convention are nonetheless genuine moral wrongs and not mere impoliteness: queue-jumping wrongs the specific people standing behind you, and that is a moral matter. (3) Whether a newcomer must follow a local convention depends only on what is locally in force — not on whether she thinks the convention is a good one, not on how long she has been in the country, and not on whether she intends to stay. She must queue in a queueing city on her first afternoon; she need not tip in a city where tipping isn't done. (4) Not tipping where servers' wages are built on the assumption of tips is morally wrong, and not merely a breach of local convention; by contrast, jaywalking across an empty street is at most a conventional failing, since nobody is wronged. (5) My preferred test for whether an act is morally permissible is the generalization test: what if everyone in relevantly similar circumstances did that? (6) I don't think we owe anyone the preservation of a bad convention. Where a convention is a worse equilibrium than an available alternative, deliberately deviating in order to help move the group to the better one can be justified — I'm thinking of things like a queueing practice that wastes everyone's time, or settled norms of deference in a workplace. (7) This holds even for norms that solve no coordination problem at all: in a city where people greet strangers in the street, and in a city where they studiously don't, a visitor should in each case do what is done there, and is being offensive if she doesn't.

  There are two cases I keep failing to get a verdict on that I'm comfortable with: a tourist in a country where tipping isn't done, whose café staff are plainly underpaid; and a tourist who is unmistakably a tourist — map, camera, wrong clothes for the weather — who pushes ahead at a bus stop in a city with a strong queueing norm. A friend says part of my trouble is that (5) is the wrong test for conventions, since conventions tolerate a non-zero rate of deviation and the universal version of the test destroys the very facts my reason to conform depends on; she thinks the right counterfactual is what if one more person did that rather than what if everyone did. I can't tell whether that rescues (5) or hollows it out.

  What I want from you: work through the list and tell me which pairs are genuinely in tension and which only look like it, ranked by severity rather than flagged uniformly — I'd rather have one or two real problems located precisely than seven items all called shaky. For each real tension, say exactly what would have to give, what that revision would cost me elsewhere in the view, and whether there is a cheaper repair available; then tell me which single revision cleans up the most and why. Give me verdicts on the two cases both under the view as I've stated it and under the least-costly repaired version, and note whether the reasoning that reaches them changes even if the verdicts don't. Finally, if part of my difficulty is that I'm calling two or three different things conventions, say so explicitly — that would be useful to know before I stand up in front of the group.
reasoning: |-
  Hmm, the user is preparing for a political theory talk on whether visitors must follow local conventions like tipping or queueing. They've shared their position statement with seven points and want me to audit for internal tensions, not answer the question directly. They're particularly concerned about two problematic cases: tipping where it's not customary but staff are underpaid, and a tourist violating queue norms. Their friend has critiqued their generalization test (point 5).

  I need to analyze how these seven points hold together. Let me map their core framework: Points 1 and 3 establish a conventionalist foundation - conventions create conditional reasons based solely on local practice. Points 2 and 4 introduce moral exceptions where breaches wrong specific individuals (queue-jumping) or exploit systems (not tipping in tip-dependent economies). Point 5 applies a generalization test for moral permissibility. Points 6 and 7 carve out activist exceptions for bad conventions, including non-coordination norms like greetings.

  The most severe tension is between their conventionalism (1,3,7) and moral externalism (2,4). Claiming queue-jumping is morally wrong (point 2) contradicts point 3's insistence that only local facts matter. Similarly, point 4's moral condemnation of not tipping in tip-dependent economies clashes with point 3's localism. This fracture line runs through both problematic cases.

  The generalization test (point 5) is also problematic. As their friend noted, applying "what if everyone did this?" to conventions is self-undermining since conventions tolerate some deviation. This test also conflicts with point 6's justification for strategic deviation - if everyone deviated from a bad convention simultaneously, it would collapse, but point 6 requires only a critical mass.

  For repairs, the most efficient fix would be to abandon the claim that convention breaches are intrinsically morally wrong (retracting point 2). This resolves the core tension while preserving their conventionalist foundation. We'd reinterpret queue-jumping as free-riding on coordination, not a moral wrong per se. Point 4 could be modified to focus on exploitation rather than moral wrongs.

  For their two cases: Under the original view, the non-tipping tourist acts permissibly since no local convention exists (point 3), but point 4's moral dimension creates confusion. The queue-jumping tourist clearly violates norms but point 2's moral claim is problematic. After repair, both cases become clearer conventional coordination issues without moral baggage.

  The user might be conflating different norm types. Coordination conventions (queues) operate differently from equilibrium norms (tipping economies) and symbolic practices (greetings). Recognizing this taxonomy would strengthen their framework. Their activist stance (point 6) applies best to pure coordination problems, less so to others.
answer: |-
  Your framework is admirably clear, but internal tensions arise primarily from the interplay between conventionalism and moral externalism. Below is a systematic audit of tensions, ranked by severity (most critical first), with repairs, case analyses, and notes on norm typology.

  ---

  ### **Ranked Tensions & Repairs**
  1. **Tension: Moral Externalism vs. Conventionalism (Points 2/4 vs. 1/3)**  
     - **Conflict**: Point 2 claims queue-jumping is a *moral wrong* to specific people, while Point 3 insists conventions bind solely due to *local social facts*. If conventions are arbitrary coordination tools (Point 1), moral wrongs cannot emerge *from the convention itself* (e.g., queue-jumping wrongs others only if the convention confers moral weight—which Point 1 denies).  
     - **Repair Needed**: Abandon the claim that breaches are intrinsically moral wrongs (retract Point 2). Reinterpret "wronging" as *free-riding*: exploiting others’ conformity without reciprocating. This preserves Point 4 (tipping in tip-dependent economies as exploitation) and aligns with Point 1.  
     - **Cost**: Loses the intuitive moral force of queue-jumping.  
     - **Cheaper Fix?** No—this is foundational.  

  2. **Tension: Generalization Test vs. Conventional Stability (Point 5 vs. Point 1/6)**  
     - **Conflict**: Point 5 (generalization test) asks "what if *everyone* did this?" But conventions (Point 1) require *general*, not universal, conformity. Applying "everyone" destroys the convention (as your friend notes), making it useless for evaluating *individual* breaches. Worse, Point 6 *endorses* strategic deviation to escape bad equilibria—which fails the generalization test (if everyone deviated, chaos ensues).  
     - **Repair Needed**: Replace Point 5 with a **marginal test** for conventions: "What if *one more person* deviated?" This distinguishes:  
       - *Coordination conventions* (queues): Marginal deviations are harmless until a critical mass defects.  
       - *Moral rules* (exploitation): Marginal deviations *always* cause harm (e.g., each non-tipper deprives a worker).  
     - **Cost**: Weakens the universality of your moral test; now only applies to non-conventional wrongs.  
     - **Cheaper Fix?** Yes—limit Point 5 to *non-conventional* acts (e.g., theft).  

  3. **Tension: Activism vs. Visitor Obligation (Point 6 vs. Point 3/7)**  
     - **Conflict**: Point 6 endorses deviating to overturn "bad" conventions, but Point 3 insists visitors *must* follow local norms unconditionally. Why should a visitor (who may misjudge the convention’s value) have license to disrupt, while locals bear the costs?  
     - **Repair Needed**: Restrict Point 6 to *long-term participants* (residents, repeat visitors). Visitors lack the context/knowledge to instigate change.  
     - **Cost**: Weakens the scope of norm entrepreneurship.  
     - **Cheaper Fix?** Yes—add an epistemic condition: "Deviation is only justified if the deviator *reasonably believes* their act will trigger collective shift *and* they accept the risks."  

  ---

  ### **Single Best Revision**  
  **Replace Point 5 with the marginal test** ("What if one more person did this?"). This:  
  - Resolves the generalization test’s self-defeat for conventions.  
  - Preserves Point 4’s exploitation critique (each non-tip *marginally* harms workers).  
  - Costs little, as Point 5 wasn’t central to your conventionalism.  

  ---

  ### **Case Verdicts**  
  #### *Original Framework*:  
  1. **Non-tipping tourist (no local custom, underpaid staff)**:  
     - **Verdict**: Permissible (Point 3: no local convention). *But* Point 4’s moral claim creates confusion—is this exploitation? Inconsistent.  
  2. **Queue-jumping tourist**:  
     - **Verdict**: Wrong (Points 2+3), but Points 1+7 make this arbitrary.  

  #### *Repaired Framework* (Marginal test + non-moral free-riding):  
  1. **Non-tipping tourist**:  
     - **Verdict**: **Permissible** (no convention exists → no free-riding). *But* staff underpayment is a *structural injustice*, not solved by individual tipping. New reasoning: No convention → no coordination burden → no breach.  
  2. **Queue-jumping tourist**:  
     - **Verdict**: **Impermissible** (free-riding: exploiting others’ queueing without reciprocating). *Reasoning changes*: Not a "moral wrong" but a *conventional violation* that undermines mutual benefit.  

  ---

  ### **Norm Typology: You’re Overloading "Convention"**  
  Your cases reveal three distinct norm types, conflated in your analysis:  
  1. **Coordination Conventions** (queues, traffic lights):  
     - Value-neutral; binding via reciprocity (Point 1). Visitors *must* follow (Point 3).  
  2. **Equilibrium Norms with Moral Externalities** (tipping):  
     - Not arbitrary; solve collective action problems (fair wages). Breaches *exploit* (Point 4). Binding if systemic reliance exists.  
  3. **Symbolic Norms** (greetings):  
     - Solve no coordination problem (Point 7 is wrong here). Binding only via respect for local culture—not coordination.  

  **Why this matters**: Your activist stance (Point 6) only clearly applies to Type 1. Type 2 may be "bad" due to exploitation, but deviation often worsens outcomes (e.g., non-tipping where wages are low). Type 3 deviations are rude but not coordination failures.  

  ---

  ### **Summary Recommendations**  
  1. **Retract Point 2**: Recast queue-jumping as free-riding, not moral wrong.  
  2. **Replace Point 5** with the marginal test.  
  3. **Limit Point 6** to informed long-term residents.  
  4. **Clarify norm typology** in your talk—this explains tensions in Cases 1/2.  

  This leaves your core conventionalism (Points 1,3,7) intact while resolving moral contradictions. The repaired framework cleanly handles both cases: the queue-jumper free-rides; the non-tipper in a non-tipping culture does nothing wrong—structural injustice requires collective action, not individual tipping.
