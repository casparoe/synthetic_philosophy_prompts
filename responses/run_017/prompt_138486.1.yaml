answer: |-
  You're absolutely right that cairn-builders are astonishingly sophisticated Popperians – their offline simulations of absent objects and social dynamics *do* approach the functional edges of ownership! But here’s the rupture: words aren’t just faster simulations; they become *new objects for the simulation to manipulate*. When a cairn-builder simulates "her stone," it's bound to specific sensory tokens and memories – it's a *replay* or *recombination* of lived experience. But when a Gregorian creature uses the *word* "ownership," that symbol becomes a discrete, recombinable unit *within* the simulation itself. It detaches the concept from the stone, the cairn, or the specific individual, allowing the mind to run simulations *on the abstract relation itself* – "What if ownership could be transferred by verbal contract, not just physical exchange?" or "Does ownership imply obligation?" These aren't richer simulations of the world; they're simulations *of counterfactual frameworks for understanding the world*, built by treating the symbol as a manipulable building block. The tool doesn't just compress; it creates a new plane of objects *to* simulate.  

  *(Hit landed: Yes, cairn-builders show raw simulation can *model* complex relations without words. But the leap is symbols becoming objects* ***in*** *the simulation, enabling second-order thought about the concepts themselves.)*
