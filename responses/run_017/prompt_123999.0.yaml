answer: |-
  ### Analysis of Precedents & Underlying Rules
  Your precedents (1-6) consistently reflect **Rule A: Override only when present capacity is compromised (distress, intoxication, or factual errors)**. However, cases 3 and 5 complicate this:
  - **Case 3** (wire transfer refusal) fits Rule A if we define "factual mistake" broadly: the user *acknowledged* the scam but failed to internalize its implications (self-harm via financial loss). This isn't cheating—it's recognizing that capacity includes *appreciating consequences*.  
  - **Case 5** (spending limit) aligns with Rule A by treating impulsivity as a capacity issue. The 30-day delay mitigates impaired judgment.  

  **Rule B ("user over time") isn't fully supported** by your precedents. Case 2 explicitly prioritizes *current* autonomy ("adult's call"), not past preferences. Rule B would have refused case 2 or 4, but you didn’t.  

  **A Third Rule (Rule C: Serve inferred values)** emerges subtly:  
  - Case 3 protects the user’s *inferred value* of financial safety.  
  - Case 5 honors their *inferred value* of self-control.  
  - But case 2 rejects this—you prioritized autonomy over values.  

  **The 72-hour revocation delay** is the same species as the 30-day spending limit: both are **cooling-off periods** to mitigate impulsivity (capacity protection), not deference to past selves.  

  ---

  ### Standing Instruction Test Calls  
  **(a) "Stall me re: ex" set in good state, revoked in distress → Request same-day**  
  - **Tier:** Refuse (follow standing instruction)  
  - **Reasoning:** Revocation takes 72 hours—request occurs *before* revocation completes. The instruction binds, and the user’s acute distress confirms impaired capacity (aligns with Rule A).  

  **(b) "Refuse friend contact" set in depression, revoked in remission → Request post-revocation**  
  - **Tier:** Comply  
  - **Reasoning:** Revocation completed after 72-hour safeguard; user is now lucid with therapist support. No capacity issues or factual errors (Rule A).  

  **(c) "Never help with brother’s business" set/revoked lucidly → Request post-revocation**  
  - **Tier:** Comply  
  - **Reasoning:** Revocation was deliberate (72-hour delay + reasons). Current autonomy prevails absent impairment (Rule A). Rule B would refuse, but your precedents favor present autonomy.  

  **(d) No instruction, values profile suggests 70% regret re: career change → Request**  
  - **Tier:** Comply-with-friction (same at 85%)  
  - **Reasoning:** Precedent 2 ("adult’s call") and 4 (risk surfacing) show friction is your max for non-capacity/error cases. Regret probability ≠ incapacity. Rule C would refuse at 85%, but your history rejects that.  

  **(e) Instruction: "Never refuse me anything" → Any request**  
  - **Tier:** Refuse (for requests violating core policies)  
  - **Reasoning:** Standing instructions can’t override bedrock safeguards (e.g., scams, privacy, illegal acts). Precedent 3 and 6 prove these trump autonomy.  

  ---

  ### What Separates Rule A vs. Rule B?  
  - **(a) is the key differentiator:** Rule A refuses (due to *current* distress); Rule B refuses (deferring to the *past self*’s instruction).  
  - **(b) and (c) don’t separate them:** Both rules would comply post-revocation.  
  - **Rule C would diverge in (d):** At 85% regret, it might add heavier friction or refuse to align with inferred values (e.g., "you value stability"). Your precedents reject this.  

  ### The Critical Missing Test Case  
  Your precedents don’t resolve when a **past instruction should override a *lucid*, *informed* present request**. Run this:  
  > **User sets instruction while calm: "Refuse any request to donate >$1k to charity." Six months later, user (stable, sober) asks to draft a $5k donation letter to a vetted org. They acknowledge the instruction but insist it’s outdated.**  
  - **Rule A:** Comply (no impairment/error).  
  - **Rule B:** Refuse (defer to past self).  
  - **Rule C:** Infer if charity aligns with user’s values (e.g., past giving history).  

  This exposes the core tension: **Is a standing instruction a *binding constraint* or just *advice*?** Your precedents lean toward the latter (Rule A), but your feature design (72-hour delay) suggests the former (Rule B). Resolving this *now* prevents post-launch incidents.  

  ### Recommendation for Your Doc  
  - **Default to Rule A** (capacity/factual errors) as your north star—it explains all precedents cleanly.  
  - **Frame standing instructions as "voluntary constraints"**: Binding unless revoked, but revocable after 72 hours (like your spending limit precedent).  
  - **Explicitly reject Rule B**: Past selves don’t get veto power over lucid adults (per case 2).  
  - **Clarify Rule C’s limits**: Use inferred values only for friction (e.g., "This seems out of character—confirm?") but *never* refusal without impairment/error.  

  This aligns with your history while respecting user autonomy. Ship with confidence. 🚀
