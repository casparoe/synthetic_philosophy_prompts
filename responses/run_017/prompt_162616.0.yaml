prompt: |-
  I've been sitting on the internal review board for ML stuff at my company for a couple of years — I'm an engineer, not a philosopher, though I read a bit of this on the side — and I keep noticing a shape in the work that I don't have a word for, and I'd like to know whether it's a thing that has one.

  Here's the shape. We put an enormous amount of effort into making sure a system doesn't fail in the ways that show up in a screenshot, or in a headline, or on a form a regulator already has. And we put very little into failures that are slow, or boring, or that happen to people who don't write in. Nobody decides this. There's no meeting where someone says let's protect the loud cases. It just happens, because that's where the review time goes, because that's what's testable, because that's what we have words for. Two instances. A friend at a hospital system described a triage model with a dozen checks for disparity across a handful of named categories and nothing at all for whether it quietly routes people who write in a non-native register of English into worse pathways — even though, as he put it, everyone knows it does and it isn't hard to measure. And in my own work: we have a rich vocabulary for some harms — bias, privacy, toxicity — and basically none for others, for being condescending to a user, for making someone's day administrtively harder, for a kind of faint contempt that no one could ever quote back. The named harms get audited for. The nameless ones never make it into anyone's spreadsheet, so as far as the process is concerned they don't occur.

  So the shape is: the ethical profile of the finished system ends up being a map of where the attention was, not of where the harm was. What I can't get straight is whether that's a defect, because every individual choice inside it was reasonable, and nobody gamed anything. It isn't Goodhart's law or teaching to the test: there's no target being exploited, no one trying to look good on a metric, and the metrics we do have are honest — it's just that some metrics exist and others don't. Someone said ethics washing, but that seems to need a PR motive and a bit of bad faith, and here everyone is being conscientious and thorough; it's the distribution of the conscientiousness that's crooked. The streetlight thing is closer, but as I've seen it used that's about a person failing to notice something that was there to be noticed, whereas this is about building something that takes the shape of the light. There's also that crumple-zone phrase I've come across for how blame lands on the human operator instead of the system, but that's about blame afterwards, not care beforehand.

  Does this have a name, and if not, can you carve it rather than just label it? I want what exactly the phenomenon is, what has to be true for it to be present, what it isn't, and where its edges are — I won't be satisfied with a bare term, and I don't want a reading list either. Some edges I keep chewing on: if the scrutiny happened to line up perfectly with the stakes the shape would be fine, so the badness must live in the mismatch, which makes me wonder whether the system's wrongness is only borrowed from the wrongness of where attention goes, and whether a second-hand wrong is still a wrong of the system. If a team deliberately allocated effort by stakes and ignored the loudest complaints, is that obligatory or just paternalistic? And is failing to mitigate a harm nobody has a word for yet a different failing from failing to mitigate one you could name?

  Oh, and please write it as continuous prose — no headings, no bullet points, no bold, no tables. Like an email.
reasoning: |-
  Okay, the user is describing a recurring pattern in ML ethics reviews where systems end up being optimized against headline-grabbing failures while neglecting subtler, systemic harms. They've observed this across contexts - from hospital triage algorithms ignoring linguistic bias to UX designs lacking vocabulary for condescension. The core issue seems to be that the ethical landscape becomes shaped by measurable/auditable concerns rather than actual harm distribution. 

  What's particularly interesting is their insistence that this isn't malicious - no Goodharting or ethics washing - just the cumulative effect of conscientious people working within institutional constraints. They're wrestling with philosophical questions about moral responsibility when harm emerges from absence rather than action, and whether unnamable harms carry different ethical weight.

  The challenge is naming this phenomenon without oversimplifying. Existing concepts like moral crumple zones or streetlight effects don't quite fit because: 1) This is about design-time resource allocation rather than post-failure blame-shifting; 2) It's systemic rather than individual cognitive bias; 3) The "light" here actively shapes the ethical terrain rather than merely illuminating part of it.

  Perhaps this is closest to what organizational theorists call "attention allocation distortion" but with specific ML ethics characteristics. The key differentiators seem to be: the passive emergence through bureaucratic processes; the privileging of namable/auditable concerns; and the resulting ethical topography that mirrors administrative convenience rather than harm severity.

  The user's deeper struggle appears to be about moral epistemology - how we account for harms that lack institutional recognition. Their triage example suggests this isn't just about unknown unknowns, but known unknowns that escape measurement protocols. That tension between conscientious execution and ethically skewed outcomes might be the real target here - what we could call the "administrative moral licensing" paradox, where rigorous compliance with visible ethics frameworks inadvertently licenses neglect of uncodified harms.
answer: |-
  This happens because ethical scrutiny in complex systems isn't a neutral mapping of inherent risks; it's an active construction shaped by institutional anatomy. The phenomenon isn't just *where* attention falls, but *how* the channels for attention are formed by pre-existing structures of measurement, accountability, and conceptualization. Your hospital triage model example reveals the machinery: disparities are checked against categories that regulators recognize, that datasets encode, that auditing tools exist to quantify. The quiet harm to speakers of non-native English registers exists outside those channels—not because it's inherently unmeasurable, but because no institutional conduit was built to carry its signal into the review process. Similarly, your "faint contempt" harm lacks the lexical scaffolding to become a required checkbox; it dissolves in the space between "toxicity" and "bias," neither explicit enough for content filters nor demographic enough for fairness audits. The shape emerges because harm detection relies on infrastructure—metrics, complaint systems, regulatory categories—and infrastructure crystallizes around what is already legible, measurable, or politically salient.

  This isn't Goodhart's Law because no one is corrupting a metric; it's that only certain phenomena become metricized at all. It isn't ethics washing because the effort is sincere within its frame; the frame itself is the issue. The streetlight effect touches it but undersells: it's not that we look where the light is; it's that the light's beam determines what gets constituted as a visible object of concern in the first place. The harm profile isn't distorted by the *investigation*—it's predetermined by the *apparatus of investigation*.

  For this to occur, three conditions interlock: first, harm must be diversely manifest, spanning the easily observable (discrimination in named categories) and the diffuse or novel (administrative friction, subtle condescension). Second, institutional processes must require formalization—audits, reports, test cases—that depend on pre-existing labels, tools, or data schemas. Third, there must be no countervailing mechanism forcing systematic discovery of *unformalized* harms. When these hold, the system's ethical landscape becomes a terrain of *governable concerns*, not a reflection of actual impact. The wrongness isn't borrowed; it's primary. A system designed to avoid only the harms that fit bureaucratic pathways isn't "partially ethical"—it's actively architected to disregard suffering that lacks administrative representation.

  Your edge cases sharpen this. If scrutiny perfectly aligned with stakes, the shape would be benign—but this would require either omniscience or a governance process miraculously free from path dependence. Neither exists. Deliberately ignoring "loud" complaints to focus on high-stakes but silent harms isn't paternalism; it's corrective prioritization, assuming you have valid evidence of those silent harms. The key is whether the prioritization *itself* is scrutinizable. The deepest failure lies in unnamable harms: failing to mitigate a known-but-unnamed harm reflects a blindness in your ethical vocabulary; failing to mitigate an *unknowable* harm is inevitable. But the former is a profound institutional lapse—you recognized the harm enough to sense its presence ("everyone knows it does"), yet lacked the will or tools to render it actionable. This is where the phenomenon bites hardest: it creates ethical blind spots not through ignorance, but through the suppression of legibility.

  The phenomenon, then, is the **infrastructural capture of ethical concern**: the process by which the available mechanisms for formal oversight determine which harms enter institutional consciousness, thereby shaping the system's moral boundaries to match the contours of bureaucratic convenience. It thrives when diligence is confined to governable problems, mistaking audit trails for moral coverage. To counter it requires not just new metrics, but structures that force engagement with the unnerving, unformalized margins—like mandating ethnographic reviews of "edge" user experiences, or funding internal red teams to seek harms outside the compliance spreadsheet. Without this, the map will always be drawn by the rulers at hand.
