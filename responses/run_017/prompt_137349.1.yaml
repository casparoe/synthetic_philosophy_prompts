prompt: |-
  I sit on the planning board of a town of about nine thousand people, and I have been trying to extract whatever defensible core there is in the case my colleagues make when they vote down every multifamily proposal that comes before us. Below is the strongest version I can construct — call it the membership argument — together with a rider I added to answer the historian on our board. I think the argument proves far more than anyone on the board, myself included, is willing to accept, and I cannot locate the step at which it goes wrong.

  (1) If you own something, you may decide who else uses it and on what terms, within the limits the law sets.
  (2) What makes a house worth living in is not the house. It is the school catchment, the street trees, the transit stop, the quiet, the low crime — an amenity bundle that no individual owner produced and no individual owner maintains. It exists because the people already there have paid for it in taxes and in the daily, unremarkable cooperation that keeps a place habitable.
  (3) Whoever produces and maintains a good that others enjoy has a say over the terms on which those others may enjoy it.
  (4) So the current residents of a town jointly hold a say over the terms on which new people may come to share the amenity bundle. Call this the membership right.
  (5) Zoning is nothing more than a statement of those terms: minimum lot size, height, units per acre, parking requirements.
  (6) If you have no claim to be admitted on your own terms, then excluding you on ours violates nothing and leaves us owing you nothing.
  (7) Therefore the exclusionary zoning my colleagues vote for violates no one's rights, and "NIMBY" names no moral failing: it is a slur for the ordinary exercise of an incident of ownership.
  (8) Rider: none of this is defeated by the fact that many present residents, or their predecessors in title, arrived under terms fixed by earlier exclusionary zoning, by federally backed redlining, or by racially restrictive covenants. A right to set the terms of admission does not lapse because earlier terms were set badly or for bad reasons.

  The trouble is what the argument takes with it.

  (a) If a right to set terms is a right to set any terms, then it licenses a town to cap its population permanently at its 1970 level, to admit only the descendants of current residents, or to require a six-figure amenity buy-in. Answers of the form "the legislature has forbidden that" miss what I am asking; this is a moral argument and I want a moral diagnosis.
  (b) "Membership" never gets defined. If it tracks ownership, renters are not members and have no say at all over the town they live in. If it tracks residence, an owner's interest in his own lot counts for nothing. And because the right is held jointly, it is unclear what counts as exercising it: a club admits members by its own rules and binds only those who agreed to them, whereas zoning binds the owner who wants two units on his own lot and loses the vote.
  (c) If the membership right is a property right, it is alienable and compensable. My town could auction admission to the highest bidder and divide the proceeds among current owners; a state that wanted more housing could condemn the town's zoning power and owe owners compensation measured by the fall in their sale prices. Both seem to follow, and both strike me as grotesque.
  (d) And in the other direction: if the say belongs to whoever maintains the amenity bundle, then a newcomer who would pay more in taxes than she draws in services has the stronger say of the two — she is a net contributor to the very pool the argument is about. On its own logic the argument should not let us exclude her; it should let her dictate terms to us. That cannot be right either.

  So: which step do you reject? Give me one paragraph on why that step looked sound — what principle or case it borrows its plausibility from — then price the two most attractive alternatives to rejecting it, including the cost of keeping (8). I would like to keep (1), (5) and (6): that ownership matters, that zoning is largely about the physical form of a place, and that not every exclusion wrongs the person excluded. I would rather abandon (7) than any of those, though I understand that rejecting a conclusion is not a diagnosis. Finally, tell me what, if anything, survives as a defensible claim about a town's control over its own physical form once the bad step is removed — and whether the survivor is the membership right in a narrower guise or something that was never in the argument at all.

  Close your reply with a single line of the form \answer{(n)}, naming the numbered step whose rejection does the most work; if your diagnosis rejects several, name the one you would give up first.
reasoning: |-
  Hmm, the user is a planning board member grappling with a philosophical dilemma about exclusionary zoning. They've constructed this "membership argument" that their colleagues implicitly use to reject multifamily housing, but they recognize its logical extensions lead to absurd or morally repugnant conclusions. Their core struggle is ethical - they want to preserve legitimate local control while avoiding the argument's dystopian implications.

  The argument's fatal flaw lies in step (3). It falsely equates mere residence with production/maintenance of amenities. Residents benefit from but don't "produce" schools or low crime; these emerge from complex societal interactions and public investment. Step (3) borrows plausibility from Locke's labor theory of property - the intuitive idea that if you build a thing, you own it. But that logic collapses when applied to community amenities which are collectively generated and publicly funded.

  I see three possible alternatives to rejecting step (3):
  1) Treat amenities as club goods requiring contribution-based membership. But this path leads directly to the user's nightmare scenarios - auctioned admissions and renter disenfranchisement. It would also destroy (8) by making past injustices permanent.
  2) Reinterpret "production" as ongoing stewardship. This preserves (8) but creates absurdities - newcomers could instantly claim equal say upon moving in, and owners could demand compensation for zoning changes.
  3) Distinguish between use rights and governance rights. This is the least bad option. It keeps (1)(5)(6) intact while limiting the membership claim to democratic participation rather than absolute exclusion. However, it forces abandoning (7) and (8)'s absolutism.

  The salvageable core is that physical form affects community character, justifying some local democratic control - but as regulatory police power, not property right. This survives as a narrower "design sovereignty" claim, subject to regional needs and antidiscrimination limits. The membership concept must be discarded entirely; what endures is the unstated principle that stable environments have moral weight in planning decisions.

  Ultimately step (3) is the linchpin. Its rejection dismantles the argument's foundation while preserving the user's valued premises about ownership mattering and zoning's physical nature. The grotesque extensions vanish because amenities aren't private property to be gatekept.
answer: |-
  I reject step (3): "Whoever produces and maintains a good that others enjoy has a say over the terms on which those others may enjoy it." This borrows plausibility from Locke's labor-mixing theory of property and everyday intuitions about personal creation (e.g., "I built this chair, so I decide who sits in it"). However, it misapplies these principles to complex, collectively generated public goods. The "amenity bundle" (schools, safety, streets) isn't produced or maintained by *current residents* in any direct, ownership-conferring sense. It's created through historical public investment, ongoing taxpayer funding (including from future residents), and societal institutions beyond the town's control (e.g., state education frameworks, federal infrastructure grants). Residents are stewards and beneficiaries, not producers entitled to perpetual gatekeeping rights. 

  Priced alternatives to rejecting (3):  
  - **Alternative 1**: Keep (3) but restrict "produces and maintains" to mean *current financial contribution* via taxes. *Cost*: This invalidates (8) because it makes membership transactional and time-bound—newcomers gain "say" immediately upon paying taxes, undermining exclusionary power. It also licenses user's concern (d): net contributors could demand entry or dictate terms.  
  - **Alternative 2**: Keep (3) but define "say" as *democratic participation* in regulation, not exclusion. *Cost*: This forces abandonment of (7) since zoning becomes a governance tool subject to moral/political constraints (e.g., fairness, regional needs), not an absolute "incident of ownership." It also clashes with (6)'s absolutism about "owing nothing."  

  With (3) removed, a defensible claim survives: a town has legitimate *regulatory authority* over physical form (per your (5)) to protect public goods (e.g., infrastructure capacity, environmental integrity, historic character) through neutral, non-discriminatory rules. This isn't a "membership right" but a *police power* exercised democratically for communal welfare—subject to proportionality and regional housing obligations. For example, requiring setbacks or limiting building heights to preserve sunlight/open space is defensible; banning multifamily housing to freeze demographics is not. The survivor is **not membership** but **design sovereignty**: the idea that spatial coherence and shared infrastructure justify some local control over *how* density manifests, but not *whether* it occurs.  

  \answer{(3)}
