answer: |-
  ## Consultation Document: Designated Lost Causes under the Commemorative Balance Act 2013

  **Issued by:** The Office for National Commemoration (ONC)
  **Date:** 17th October 2023
  **Reference:** ONC/23/DC/Consult
  **Closing Date for Responses:** 12th January 2024

  **1. Introduction & Purpose**
  1.1. This consultation invites applications and evidence from Local Authorities, Registered Heritage Bodies, and the Devolved Administrations (collectively referred to as **Eligible Bodies**) concerning the designation of **Local Defeats** under the Commemorative Balance Act 2013 (CBA 2013).
  1.2. The purpose of the **Designated Lost Cause (DLC)** scheme is to formally recognise and manage commemorative activity relating to historical defeats of local or regional significance. This ensures such commemorations contribute positively to community cohesion, historical understanding, and the national commemorative landscape, while mitigating potential friction arising from unresolved historical narratives.
  1.3. The Department does not propose to alter the fundamental criteria for designation at this time but seeks to refine the application process and gather evidence on potential candidate defeats.

  **2. Statutory Framework: The Commemorative Balance Act 2013**
  2.1. Section 4(1) of the CBA 2013 empowers the ONC to designate a **Local Defeat** as a **Designated Lost Cause**.
  2.2. A **Local Defeat** is defined as *"a discrete historical event occurring within the geographical boundaries of the United Kingdom, or involving forces raised primarily from a specific locality within the UK, which resulted in a conclusive military, political, or cultural setback for the participants and the cause they represented."*
  2.3. The core principle of the CBA 2013 is that commemorative focus should be placed upon the *sacrifice* and *endurance* of participants, rather than the inherently contentious *aims* of the cause itself. **Designated Lost Causes** provide a formal framework for this separation.

  **3. Eligibility Criteria for Designation**
  3.1. To be eligible for consideration as a **Designated Lost Cause**, a **Local Defeat** must demonstrably meet the following criteria:
      3.1.1. **The Simultaneity Requirement:** The applicant must provide evidence that the local community both:
          (a) Acknowledges the cause associated with the defeat is irretrievably **Lost** (as defined in 2.2); and
          (b) Maintains that the spirit or principle underpinning the cause was **Never Abandoned** by the participants at the time of the defeat.
      3.1.2. **Commemorative Maturity:** A minimum period of 75 years must have elapsed since the event. This ensures sufficient temporal distance for commemorative narratives to crystallise independently of living testimony concerning the cause's original aims. Stakeholders will wish to note that applications concerning events within living memory face significant evidential hurdles under criterion 3.1.1(b).
      3.1.3. **Commemorative Leverage Ratio (CLR):** The applicant must calculate the current **CLR** for the defeat. This is defined as:
          *CLR = (Number of permanent commemorative structures/plaques + Annual commemorative events) / Number of verifiable surviving participants (or direct descendants within two generations where participants are deceased)*
          A higher **CLR** is treated as prima facie evidence of a deep-seated communal need for the structure provided by DLC status, particularly where surviving links are tenuous.
      3.1.4. **Narrative Detachment:** The applicant must demonstrate that contemporary commemorative discourse focuses predominantly on the themes of sacrifice, futile courage, or local tragedy, rather than advocating for the revival of the original cause's specific political, religious, or territorial objectives.

  **4. Assessment Principles & Specific Provisions**
  4.1. Applications will be assessed against the eligibility criteria (Section 3) and scored according to the matrix at **Appendix A**.
  4.2. **The Dunkirk Provision:** A defeat which has been so successfully reframed within the national consciousness as a deliverance, moral victory, or essential precursor to ultimate success that it no longer functions primarily as a 'loss' in the communal psyche, shall be classified as a **Retained Moral Victory (RMV)**. **RMVs** are expressly excluded from DLC designation under Schedule 2(4) of the CBA 2013. For the avoidance of doubt, events perceived as enabling future strategic success, regardless of immediate tactical outcome, fall under this provision.
  4.3. **The Masada Clause:** Where near-total mortality (defined as 95% or greater fatalities) occurred among the identifiable participants during the defeat itself, this shall be accepted as conclusive evidence of sincerity and unwavering commitment to the cause at the moment of loss. This waives the requirement under criterion 3.1.1(b) to provide supplementary evidence that the cause was Never Abandoned *by the participants*, and automatically satisfies this element of the Simultaneity Requirement. The burden of proof for demonstrating near-total mortality rests with the applicant.
  4.4. **The Kosovo Field Rule:** Where the passage of time (generally exceeding 300 years) has rendered the factual record fragmentary, contradictory, or effectively unusable for verifying the original cause's nature or support, the Department will assess the *current* commemorative myth associated with the location/event. Assessment will focus solely on the myth's structure, its fulfilment of the Simultaneity Requirement in its present form, its **CLR**, and its contribution to present community cohesion. The Department expressly declines to undertake historical verification of the underlying events under this rule.
  4.5. **Retrospective Redesignation Provision:** Recognising that historical interpretation evolves, the Department will consider applications seeking the retrospective redesignation of a previously understood victory as a **Local Defeat** eligible for DLC status. Applicants must demonstrate that this revised interpretation significantly enhances community cohesion by providing a unifying narrative of shared suffering or resilience where previous narratives of victory were divisive. Standard eligibility criteria apply to the revised defeat narrative. The Department does not propose to define limits on the temporal distance applicable under this provision.

  **5. Application Process**
  5.1. Eligible Bodies must complete Form DLC-1A (available on the ONC website) and submit supporting evidence addressing each criterion in Section 3 and relevant provisions in Section 4.
  5.2. Evidence should include, but is not limited to: local press archives demonstrating the Simultaneity Requirement; heritage site inventories and event programmes for CLR calculation; academic or community group statements on Narrative Detachment; demographic records (for Masada Clause); and impact assessments regarding community cohesion (especially for Retrospective Redesignation).
  5.3. Applications will be assessed by the ONC Casework Unit against the scoring matrix (**Appendix A**). Worked examples of anonymised assessments are provided for guidance (**Appendix B**).

  **6. Benefits of Designation**
  6.1. Successful designation confers:
      *   Formal recognition within the National Register of Commemorative Significance.
      *   Eligibility for modest ONC grants towards the maintenance of commemorative sites and educational outreach *focused on the sacrifice and event narrative, not the original cause*.
      *   Access to ONC mediation services in the event of commemorative disputes.
      *   A statutory framework preventing the overt political instrumentalisation of the defeat, thereby safeguarding its commemorative integrity as a Lost Cause.

  **7. How to Respond**
  7.1. Eligible Bodies wishing to submit an *application* for DLC status should use Form DLC-1A. General *responses* to this consultation document (e.g., on process clarity, assessment criteria) should be submitted via the online portal at [ONC Consultation Hub], by email to DLCconsultation@onc.gov.uk, or by post to the address below.
  7.2. Please clearly state whether you are responding as an individual, organisation, or Eligible Body. Include your full name, organisation (if applicable), and contact details.
  7.3. The closing date for responses and applications under this consultation is **12th January 2024**. Late submissions may not be considered.
  7.4. A summary of consultation responses, *excluding specific details of applications submitted*, will be published on the ONC website within three months of the closing date. The Department will not publish its own assessment of the historical veracity of defeats discussed in applications or responses.

  **Contact:**
  Office for National Commemoration
  Designated Lost Causes Unit
  3rd Floor, Wellington House
  London, SW1A 2HQ
  Email: DLCconsultation@onc.gov.uk

  ---

  **Appendix A: DLC Application Scoring Matrix**

  | Criterion                     | Evidence Requirement                                                                 | Scoring (0-5)                                                                                                                               | Max Weight |
  | :---------------------------- | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :--------- |
  | **A1: Simultaneity Requirement (a) Lost** | Strength of evidence community acknowledges definitive loss of cause.                 | 5: Universal acceptance in local discourse. 3: Majority acceptance, minor dissent. 1: Contested, significant advocacy for cause's validity. | 25%        |
  | **A2: Simultaneity Requirement (b) Never Abandoned** | Strength of evidence community maintains spirit unbroken at point of defeat.          | 5: Embedded narrative of defiance/loyalty unto death. 3: General belief in participants' resolve. 1: Little emphasis or evidence. *Masada Clause applies = 5* | 25%        |
  | **A3: Cognitive Strain (Press)** | Assessment of local press handling of Simultaneity Requirement (A1+A2).              | 5: Reported seamlessly, no perceived contradiction. 3: Occasional awkward phrasing. 1: Frequent editorial grappling with paradox.          | 10%        |
  | **A4: Commemorative Leverage Ratio (CLR)** | Calculated CLR provided.                                                              | 5: CLR > 100. 4: CLR 50-99. 3: CLR 20-49. 2: CLR 5-19. 1: CLR <5.                                                                           | 20%        |
  | **A5: Narrative Detachment**  | Evidence commemorative focus is on sacrifice/tragedy, not cause's aims.              | 5: Original aims entirely absent or disclaimed. 3: Aims mentioned historically but not endorsed. 1: Commemoration actively linked to aims. | 20%        |
  | **A6: Morally Indefensible Cause (Bonus)** | Evidence original cause is now viewed as objectively indefensible by modern standards. | 5: Cause universally condemned now (e.g., slavery, aggressive territorial conquest). 0: Cause ambiguous or potentially defensible.         | *Bonus 10%* |
  | **TOTAL**                     |                                                                                      |                                                                                                                                             | **110%**   |

  **Notes:**
  *   Applications scoring **90% or higher** (including Bonus) are prioritised.
  *   **Maximum points under A6 (Bonus)** are awarded *because* the cause's original aims are indefensible and largely forgotten. This ensures commemoration focuses solely on the sacrifice, generating minimal contemporary controversy – the ideal outcome under the CBA 2013. The Department considers this a highly desirable characteristic.
  *   The Dunkirk Provision is a disqualifier, not scored.
  *   Kosovo Field Rule applications scored solely on A1-A5 based on the *current myth*.
  *   Retrospective Redesignation applications must score highly on A5 and provide strong cohesion evidence.

  ---

  **Appendix B: Anonymised Assessment Examples**

  **Case 7**
  *   **Event:** Last stand of garrison defending a desert fortress in the eastern Mediterranean (c. 1st Century CE).
  *   **Assessment:**
      *   A1 (Lost): 5. Cause (specific religious/political autonomy) conclusively lost. Archaeological evidence definitive. Universal acceptance.
      *   A2 (Never Abandoned): 5. **Masada Clause applies** (near-total mortality evidenced). Narrative of defiance absolute.
      *   A3 (Cognitive Strain): 5. No local press, but modern academic/journalistic coverage seamlessly integrates loss and defiance as tragic resolve.
      *   A4 (CLR): 5 (CLR = 250+). Significant ruins, visitor centre, multiple plaques, annual remembrance ceremony. Zero surviving participants/close descendants.
      *   A5 (Narrative Detachment): 5. Commemoration solely focuses on courage against odds and tragic fate. Original cause (theocracy) academically noted but morally disowned and absent from commemorative messaging.
      *   A6 (Bonus): 5. Original cause involved practices (e.g., exclusivist theocracy, forced conversions) considered wholly indefensible under ECHR. Largely forgotten except by specialists.
      *   **Total:** 105% (Prioritised)
  *   **Decision:** Designation Approved. Exemplifies core principles: sacrifice central, cause disowned and forgotten, high CLR demonstrates communal need, Masada Clause validates sincerity.

  **Case 41(B)**
  *   **Event:** Battle on a field in the Balkans involving local levies (c. 14th Century CE).
  *   **Assessment (Kosovo Field Rule Applied):**
      *   A1 (Lost): 4. Myth presents it as catastrophic defeat ending local kingdom/national aspirations. Widely accepted locally as foundational loss. (Factual record chaotic; precise outcome contested by historians irrelevant under Rule).
      *   A2 (Never Abandoned): 4. Myth centralises figure of leader martyred after battle, symbolising the "undying spirit" and betrayal. Strong communal belief.
      *   A3 (Cognitive Strain): 4. Modern local press reports anniversaries emphasising loss and enduring spirit with minimal friction, though occasional historical debates surface.
      *   A4 (CLR): 5 (CLR = 150+). Major monument complex, national anniversary day, extensive folklore. No verifiable descendants.
      *   A5 (Narrative Detachment): 3. Commemoration heavily emphasises sacrifice and betrayal. Original cause (defence of specific medieval kingdom/dynasty) is presented romantically but not as a current political aim. Minor nationalist groups sometimes attempt co-option. Detachment requires monitoring.
      *   A6 (Bonus): 0. Original cause (feudal territorial defence) not inherently indefensible by contemporaneous standards, and remains symbolically potent for some.
      *   **Total:** 84%
  *   **Decision:** Designation Approved. Kosovo Field Rule appropriately applied. High CLR and strong Simultaneity myth outweigh minor concerns on A5. Designation provides framework to manage potential co-option and solidify focus on sacrifice.
