  | 2    | 40                  | 80             | Volitional | Consent is extracted via threat (exposure), reducing transformative force. Photographer knowingly exploits vulnerability. |
  | 3    | 0                   | 100            | Volitional | Blackmail nullifies consent entirely; no moral transformation. N intentionally weaponizes information. |
  | 4    | 50                  | 60             | Informational | Material risk understatement impairs consent's transformative power. Surgeon follows protocol but knows better. |
  | 5    | 20                  | 90             | Informational | Deliberate omission voids consent's moral force for heating issue. Landlord acts deceitfully for gain. |
  | 6    | 70                  | 20             | Scope     | Technical scope covers substitution, but patient’s unread clause weakens moral weight. No intent to deceive. |
  | 7    | 0                   | 100            | Scope     | 40ml breach ignores consent boundaries; no transformative force for excess. Team knowingly violates agreement. |
  | 8    | 60                  | 30             | None      | Consent transforms act despite unjust background. Employer doesn’t create system, offers better terms. |
  | 9    | 80                  | 10             | Capacity  | Fatigue impairs agency but consent retains most force. Recipient unaware of impairment, acts routinely. |
  | 10   | 0                   | 20             | None      | No consent exists; act justified by necessity. R’s trespass unavoidable, S benefits retroactively. |

  ---

  ### Tier Sorting (by Transformative Force)
  - **Clean (80–100)**: Case 9  
  - **Mildly Defective (45–75)**: Cases 4, 6, 8  
  - **Seriously Defective (20–40)**: Cases 1, 2, 5  
  - **Void (0–15)**: Cases 3, 7, 10  

  **Boundary Work**:  
  - **Mildly/Seriously (45)**: Distinguishes consent with *partial informational gaps* (e.g., Case 4’s risk understatement) from *coercive exploitation* (e.g., Case 2’s threat). The 45-point cutoff isolates when defects fundamentally alter consent’s moral architecture.  
  - **Seriously/Void (15)**: Separates consent with *residual moral weight* (e.g., Case 5’s omission) from *total nullity* (e.g., Case 3’s blackmail). Below 15, consent does no work; above, it minimally legitimizes.  

  ---

  ### Flags for Score Divergence (>25 points)
  - **Case 1** (30 vs. 85): Coercive context nullifies force, but Dev’s *deliberate manufacture* of emergency escalates blame.  
  - **Case 2** (40 vs. 80): Threat reduces transformative power, but photographer’s *intentional leverage* of shame maximizes culpability.  
  - **Case 5** (20 vs. 90): Omission destroys consent’s force; landlord’s *active deception* for profit heightens blame.  
  - **Case 7** (0 vs. 100): Scope violation nullifies consent; team’s *conscious override* for convenience warrants maximal blame.  
  - **Case 8** (60 vs. 30): Systemic injustice limits force, but employer’s *non-culpable offer* under constraints lowers blame.  

  **Divergence Explanation**: Gaps arise when defects *external to the agent* (e.g., systemic injustice, fatigue) reduce transformative force without increasing culpability, versus *agent-created defects* (e.g., threats, lies) that inflame blame despite similar force reductions.  

  ---

  ### Key Analysis
  1. **Most Weighty Distinction**: **Volitional vs. Informational defects**. Volitional cases (1–3) anchor the "void/serious" tiers due to *agential subversion* of choice, while informational defects (4–5) allow residual permissibility.  
  2. **Highest Disagreement Case**: **Case 8 (Unjust background)**. Philosophers will debate whether transformative force should be lower (e.g., 30–40) if structural coercion voids "voluntariness," or if the employer’s non-culpability justifies the 60 score.  
  3. **Factual Sensitivity**: **Case 9 (Twenty-two hours awake)**. Transformative force (80) assumes fatigue is transient and non-disabling. If specified she was *delirious* (clinical impairment), force drops to 0–20 and mechanism shifts to capacity.  

  **Ties**: Cases 3 and 7 share transformative force (0) due to consent’s complete irrelevance. Cases 1 and 5 share blameworthiness tiers (85/90) for intentional exploitation.  

  ### Addendum: Pedagogical Notes  
  - **Volitional mechanisms** dominate the lowest tiers, showing how *external pressure* catastrophically undermines consent.  
  - **Blameworthiness spikes** where defects are *strategic* (Cases 1,2,5,7) versus *incidental* (Cases 6,9).  
  - Case 10’s "retroactive gladness" highlights consent’s *ex ante* necessity—force remains 0 regardless of outcome.  

  This framework isolates moral weight from culpability, exposing tensions in real-world consent evaluation. For grading, emphasize tier boundaries’ role in prioritizing defect severity over blame.
