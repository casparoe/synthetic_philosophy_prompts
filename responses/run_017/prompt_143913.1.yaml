answer: |-
  Here’s the spec for an adequate account of future contingents, structured by your requirements, with core tensions identified and a resolution prioritized for your seminar. Skip the usual view-expositions and focus on the scaffolding.

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Essential for prediction/warning/betting/deliberation)*  
  1. **Predictive Utility**: Must explain how future-tense claims guide action.  
     - *Case*: "It will rain tomorrow" justifies carrying an umbrella. If truth-values are perpetually indeterminate, prediction loses normative force.  
  2. **Retraction Obligation**: False predictions *must* be retractable upon failure.  
     - *Case*: If "The ship sails tomorrow" is asserted today and the ship sinks tonight, the speaker *must* concede error tomorrow.  
  3. **Betting Norms**: Truth-conditions must align with bet settlement.  
     - *Case*: A bet on "Sea battle occurs Friday" pays iff the battle happens. Truth cannot be retrospectively ambiguous.  
  4. **Temporal Asymmetry**: The past is fixed; the future is open.  
     - *Case*: "Caesar crossed the Rubicon" is now unalterably true; "A sea battle occurs Friday" is unsettled today.  

  ### **II. Contested Desiderata**  
  *(Camp-specific; not universal for adequacy)*  
  5. **Openness for Deliberation** ("Deliberation requires openness"):  
     - *Case*: Choosing to sail feels rational only if "The ship will sink" isn't *already* true.  
     - *Status*: **Prejudice of Peircean/relativist camps**. Ockhamists deny it’s necessary: deliberation is epistemic, not metaphysical.  
  6. **Bivalence/Classical Logic Preservation**:  
     - *Case*: Must "Either the ship sails or it doesn’t" be true *now*?  
     - *Status*: **Ockhamist house taste**. Peirceans reject bivalence; relativists restrict excluded middle.  
  7. **"Will"/"Must" Separation**:  
     - *Case*: "A sea battle must occur" (metaphysical necessity) vs. "A sea battle will occur" (contingent prediction).  
     - *Status*: **Ockhamist/relativist taste**. Peirceans often collapse them (future truth = necessity).  
  8. **Future Unsettledness Representation**:  
     - *Case*: Truth-conditions for "On Friday, it will be open whether the ship sails Saturday."  
     - *Status*: **Relativist specialty**. Others struggle to nest unsettledness.  
  9. **Objective Chance Compatibility**:  
     - *Case*: Can "P(ship sails) = 0.7" be true without implying present truth/falsity of "The ship sails"?  
     - *Status*: **Peircean/relativist preference**. Ockhamists treat chances as epistemic.  

  ### **III. Core Tensions: The Jointly Unsatisfiable Trio**  
  The following **cannot all be satisfied** simultaneously:  
  - **Bivalence**: Every future contingent is true or false *now* (required for classical logic).  
  - **Fixity of Past Truth**: If "Sea battle occurs Friday" was true yesterday, it remains true today.  
  - **Genuine Openness**: Future contingents lack *determinate* truth-values until resolved.  

  **The Key Conflict Driver**: **Fixity of Past Truth** (iii).  
  - *Why it rules out views*:  
    - Fixity + Bivalence → Eternalism (Ockhamism). Denies openness, making deliberation paradoxical ("I deliberate though my choice is already true").  
    - Rejecting Fixity → Peirceanism. Truth-value gaps today, but "It was true that p" can flip daily. Undermines retraction norms (was I *wrong* yesterday or just indeterminate?).  
  - *Work Done*: Fixity is the linchpin. Without it, the past’s authority erodes (violating Temporal Asymmetry). Yet enforcing it forces a choice: sacrifice Openness (Ockhamism) or Bivalence (Peirceanism).  

  ### **IV. Defensible Ordering**  
  **Priority for Your Purpose (Deliberation/Prediction)**:  
  1. **Temporal Asymmetry** (Non-negotiable).  
  2. **Retraction Obligation** (Non-negotiable).  
  3. **Openness for Deliberation** (Contested, but *pragmatically essential*: without it, prediction/deliberation collapse into fatalism).  
  4. **Betting Norms** (Constrains truth-conditions).  
  → **Sacrifice Bivalence** (and classical adjunction/excluded middle for future contingents).  
  - *Why*: Preserves Fixity (truths about the past stay true) and Openness (future contingents lack truth-values now). Retraction holds: if "p" was indeterminate and p doesn’t occur, "p was false" is *now* fixed.  

  ---

  ### **Scorecard: Big Three vs. Requirements**  
  | Requirement               | Peircean                | Ockhamist               | Relativist              |  
  |---------------------------|-------------------------|-------------------------|-------------------------|  
  | **Predictive Utility**    | ✓ (if probabilistic)    | ✓ (truth = guide)       | ✓ (contextual)          |  
  | **Retraction Obligation** | ✗ (truth-value flux)    | ✓                       | ✓/✗ (truth relativized) |  
  | **Temporal Asymmetry**    | ✓                       | ✓                       | ✓                       |  
  | **Fixity of Past Truth**  | ✗                       | ✓                       | ✗ (truth relativized)   |  
  | **Openness for Deliberation** | ✓                    | ✗ (truth now)           | ✓                       |  
  | **Bivalence**             | Rejects                 | Keeps                   | Restricts               |  
  | **"Will"/"Must" Separation** | Weak                | Strong                  | Strong                  |  

  **Your Path**: Prioritize **Openness + Fixity**. Ditch bivalence. This points to a **Peircean-supervaluationist hybrid**: future contingents are indeterminate (satisfying openness), but once resolved, past claims about them acquire fixed truth-values (satisfying retraction/fixity). Classical logic *locally* fails for unsettled futures. "Deliberation needs openness" isn’t a mere prejudice—it’s constitutive of agency, so demand it unless your seminar embraces fatalism. Use the tension between Fixity and Openness to expose unexamined assumptions early.
