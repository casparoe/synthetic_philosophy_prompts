answer: |-
  Your analysis cuts to the heart of ethical representation, revealing tensions between historical rigor, artistic license, and moral intuition. Let's reconstruct the implicit theory, test its coherence, and propose a framework.

  ### Reconstructing the Implicit Theory of What We Owe the Dead
  **Core Presuppositions:**
  1.  **The Dead as Vulnerable Subjects:** The dead cannot defend themselves, correct errors, or control their narrative legacy. This vulnerability creates a duty of care in the living.
  2.  **Identity Survives Death:** While welfare interests cease, a person's *identity* (reputation, historical significance, public image) persists as a socially constructed entity requiring protection.
  3.  **Truth as Fidelity to the Record:** Historical truth is defined by documented evidence, not narrative utility or emotional resonance. Invention, however well-intentioned, corrupts this truth.
  4.  **Harm to the Living/Social Fabric:** Misrepresentation harms descendants, erodes public trust in historical knowledge, distorts collective memory, and violates the social contract governing how we treat each other's legacies.
  5.  **Distinction Between Genres:** Society accepts different "truth contracts" for different genres (scholarship vs. drama). Audiences are presumed to adjust expectations accordingly (though your caveat about audience belief formation challenges this).

  **What Merely Fits Comfortably (but isn't strictly necessary):**
  *   **Metaphysical Survival:** Belief that the dead "care" in some transcendent sense.
  *   **Absolute Truth:** The notion that the historical record itself is perfectly objective or complete.
  *   **Perfect Audience Discernment:** The assumption audiences reliably differentiate historical fact from dramatic fiction.
  *   **Pure Motive:** The idea that historical invention is *always* malicious or that artistic invention is *never* exploitative.

  ### Testing Coherence & Resolving Tensions
  1.  **Your Case of the Non-Answerable Living:**
      *   **Incoherence:** If duty flowed purely from *answerability*, the permanently unconscious or isolated individual should be *less* protected than the dead (who are at least known). Yet practice shows the opposite.
      *   **Resolution:** This confirms the **vulnerability principle** is primary. The non-answerable living are *more* vulnerable than the dead. They retain welfare interests *in potentia* (potential for recovery, current bodily dignity) and their immediate circle suffers direct, ongoing distress from misrepresentation. The dead's vulnerability is solely to their *legacy* and the *social fabric*. Practice distinguishes between protecting a living person's *current well-being/dignity* and a dead person's *posthumous reputation/image*.

  2.  **History vs. Drama:**
      *   **Incoherence:** Both invent, yet historians are banned while dramatists are lauded. The "genre contract" justification is undermined by audiences forming actual beliefs from dramas.
      *   **Resolution:** The practices presuppose a **hierarchy of truth-telling obligations**:
          *   **Scholarship (History):** Highest obligation to fidelity. Its social function is *epistemic* – establishing reliable knowledge. Invention destroys its core purpose.
          *   **Art (Drama):** Primary obligation is *aesthetic/narrative*. Its social function is emotional resonance, thematic exploration, or entertainment. Fidelity is secondary *within that frame*. The "based-on" card *attempts* (often poorly) to signal this lower obligation to fidelity.
      *   **Tension Persists:** The incoherence lies in the *audience's inability or unwillingness* to maintain this hierarchy in practice, leading to the distortion of historical understanding. The practice is *underdetermined* regarding how to manage this leakage.

  3.  **Law (Defamation vs. Publicity Rights):**
      *   **Incoherence:** The law protects a dead person's *image* (property/licensing) but not their *reputation* (no defamation). This privileges economic interests over character.
      *   **Resolution:** Law reflects societal priorities pragmatically:
          *   **Defamation:** Focuses on preventing tangible harm (reputational, economic) caused to the *living* plaintiff. The dead plaintiff cannot suffer this harm.
          *   **Publicity Rights:** Evolved to protect *economic value* generated by celebrity identity/effort, seen as a transferable asset akin to intellectual property.
      *   **Implicit Theory:** The law *does not* primarily protect the dead *for their own sake*. It protects *living interests*: descendants' economic rights (publicity) and societal stability by limiting endless litigation (defamation bar). Moral concerns about dignity/reputation are largely outside its scope here.

  ### Towards a Coherent Practice Under the Vulnerability/Social Contract View
  Building on vulnerability and the social contract (protecting legacies to maintain trust and respect for personhood), a coherent practice would:

  1.  **Strengthen Provenance Markers:**
      *   **Beyond "Based on a True Story":** Mandate clearer, standardized disclosures *specific to representation*:
          *   **"Historically Documented":** Scenes/words directly sourced from evidence.
          *   **"Inferred Reconstruction":** Scenes/words logically extrapolated from evidence (common in history docs, rare in drama).
          *   **"Dramatized Composite/Interpretation":** Invented scenes/dialogue/characters for narrative/thematic purposes.
          *   **"Speculative Portrayal":** Ascription of motives/thoughts not documented.
      *   **Placement:** Integrated into the narrative flow (e.g., subtle visual overlays, brief text chyrons) *during* scenes, not just opening credits.

  2.  **Contextualization:** Require accessible companion materials (websites, streaming extras) explicitly listing major inventions and providing sources/documentation for key claims. Dramas claiming "historical accuracy" should face higher scrutiny.

  3.  **Genre-Specific Ethical Guidelines:**
      *   **Drama:** Accept invention as necessary, but strengthen norms against:
          *   Portraying documented falsehoods as true (especially harmful ones).
          *   Ascribing *malign* motives/actions without strong contextual evidence where the person cannot defend themselves (living *or* dead).
          *   Exploitative focus on private trauma without clear public relevance or consent from descendants (where appropriate).
      *   **History:** Maintain the strict ban on invention. Address sparse records through:
          *   Explicit acknowledgment of gaps/uncertainties.
          *   Exploring multiple interpretations *as interpretations*.
          *   Focusing on context and structures when individual data is lacking.

  4.  **Audience Education:** Promote media literacy emphasizing the *constructed* nature of all historical narratives (even scholarly ones) and the specific conventions of different genres. Highlight the difference between historical understanding and dramatic storytelling.

  5.  **Vulnerability as the Guiding Principle:** The level of caution should increase with:
      *   The *proximity* of the subject's death (fresher memory, living connections).
      *   The *sensitivity* of the portrayal (private matters, alleged misdeeds, trauma).
      *   The *power imbalance* (portraying marginalized individuals vs. powerful figures).
      *   The *claimed authority* of the work (a documentary vs. an allegorical drama).

  **Conclusion:** The practices presuppose a duty grounded in the vulnerability of the dead concerning their legacy and the social need for trust and respect for personhood, extending beyond mere answerability. The duty is *to society and the living* (descendants, audience, historical record), not directly *to the dead* as entities with interests. The primary incoherence lies in the gap between the assumed "genre contract" and how audiences *actually* form beliefs. A coherent practice under the vulnerability/social contract view demands radical transparency through embedded provenance markers, contextualization, strengthened genre-specific ethical norms, and audience education – moving beyond the ineffective "based on a true story" fig leaf. This acknowledges that while invention in art is legitimate, its impact on shared historical understanding requires far greater responsibility and disclosure than current practice provides.
