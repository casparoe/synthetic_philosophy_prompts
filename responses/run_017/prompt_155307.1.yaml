prompt: |-
  Posting this here because it came up in our work-in-progress seminar again today, and I realised I've now watched the same shape of argument go round maybe five times without having a word for it. I'm writing a chapter on the machine cases (the one where you're hooked up and get whatever experiences you'd like, plus the variants people keep inventing), and this is the thing I can't get a grip on.

  The pattern, with two instances.

  First, a case someone made up last week. Call it the Overdub. You live your actual life — you actually write the novel, actually show up for your friend, actually climb the mountain — but any time the experience of doing it would be tedious, frustrating, or grim, the machine ghosts you through that bit: your body keeps going, the world keeps responding to you, nobody notices, and from the inside it just feels like a smooth run of enjoyable activity. So the book exists, the friendship exists, and none of the effort was ever felt.

  Second, the plain plug-in case. One person in the room says they'd refuse: they don't want to merely seem to have climbed the mountain, they want to have climbed it. Someone who defends the "a life goes well to the extent the person gets what they wanted" style of view says: fine — then what you wanted was the actual climbing, the machine doesn't give you that, so it's worse for you, which is exactly what the view predicts. Another person in the same room says they'd plug in happily, they only ever cared about how it felt. Same defender: fine — then what you wanted was the feeling, the machine gives you that, so it's better for you, exactly as predicted. Both people walk out feeling the theory handled their case.

  What bugs me is that the theory ends up agreeing with whoever is speaking, and the only thing doing any work seems to be the reaction you fed it in the first place. And I think I see why: to apply it at all you first have to work out what the person wanted, or what it was like for them — and that's drawn from the same place as the judgement you were trying to test it against. So it always reproduces the verdict, and never says whether the verdict was right.

  I've tried on a few labels and none fit. Not unfalsifiability exactly — it does produce verdicts, they just always match. Not motte-and-bailey, there's no strong claim and weak claim being swapped. Not really the bolt-on-auxiliary-hypothesis thing either, because nothing gets added after the fact: the absorbing move is built in and is the same move every time. It's also not quite the "oh, that's a different value, not well-being" dodge, though it's nearby — that one pushes the value outside well-being, this one keeps it inside and just re-describes it in the theory's own terms.

  So: does this have a name, either in the well-being stuff or somewhere else (philosophy of science, argumentation theory)? And I don't mean a bare label — I need to know what precisely the thing is, what it isn't, and where its edges are. Specifically: when is a theory legitimately allowed to say "of course it predicts that, that's just what the theory says", and when has it slid into this? Does an objectivist view that can always add another item to the list (say, contact with reality) have the same problem, or a relevantly different one? And is there any way to tell whether a given view is actually doing this or only looks like it? Please don't bother with a reading list or citations, I can chase those myself — I just want the thing carved properly, and if there's no term for it, coin one and give me the boundary cases.
reasoning: |-
  Okay, the user is describing a recurring issue in their seminar discussions about machine cases, like the Nozick Experience Machine. They've noticed a pattern where a theory of well-being, specifically desire-fulfillment theory, always aligns with individual preferences. For example, one person values genuine achievement and rejects the machine, so the theory says their desires aren't fulfilled by the machine. Another person values the experience and would plug in, so the theory says their desires are fulfilled. The theory seems to just mirror whatever preference is presented, without providing independent guidance on what well-being actually is.

  The user is frustrated because this makes the theory seem vacuous—it doesn't adjudicate between different preferences; it just re-describes them in its own terms. They want to know if this has a name in philosophy, or if not, how to define it. They also ask about objectivist theories that might list goods like "contact with reality," and whether they have the same problem. Finally, they want to know how to distinguish a theory that's genuinely informative from one that's just doing this mirroring.

  First, I need to pinpoint the core issue. The problem is that the theory relies on first determining the person's desires or experiences, which comes from the same intuition as the judgment about well-being. So it's circular. The theory isn't independent; it's parasitic on pre-theoretical intuitions. This isn't unfalsifiable in the Popperian sense because it does make predictions, but they always match the input. It's also not motte-and-bailey because there's no switching between claims.

  I recall that in philosophy of science, there's the problem of ad hoc hypotheses, but here the move is built into the theory's structure. The key is that the theory absorbs any outcome by defining the relevant desires based on the case. This sounds similar to "conceptual re-engineering" or "gerrymandering," but those aren't standard terms for this.

  The best fit might be "trivialization" or "vacuousness." But more specifically, in the context of desire theories, this is a known critique. Sumner's internalism requirement ties well-being to the individual's perspective, which might lead to this issue. However, the user mentions that even objectivist theories could face a similar problem if they keep adding goods to match intuitions.

  For objectivism, if it lists goods but doesn't provide a criterion for what counts as a good, it might also be ad hoc. But there's a difference: for desire theories, the absorption is structural because desires are subjective. Objectivism might avoid this if it has an independent standard, but if it adjusts its list based on cases, it could be similarly problematic.

  To distinguish a robust theory from one that's vacuous, the key is whether the theory can generate substantive, potentially counterintuitive verdicts. If it only ever confirms intuitions, it's likely vacuous. A good theory should have implications that could conflict with some pre-theoretical judgments, forcing a reevaluation.

  The user also asks when it's legitimate for a theory to say "of course it predicts that." It's legitimate when the case is straightforwardly within the theory's scope, like when a desire is clearly defined. But when the theory uses the case's outcome to define desires post-hoc, it becomes problematic.

  I think the term "verdict-conforming redescription" captures it. The theory redescribes the input to match the verdict. "Absorptive flexibility" is another coined term. The core is the theory's ability to absorb any outcome by adjusting its inputs without independent constraints.

  Regarding objectivism, the problem is different. Adding "contact with reality" might be ad hoc if not justified independently, but it doesn't have the structural absorption issue because the good is objective. However, if the list keeps expanding without principle, it becomes "ad hoc list inflation."

  Finally, to tell if a theory is doing this, check if it ever contradicts intuitions in core cases and if its inputs (like desires) are independently defined. If desires are only identified by the outcome, it's problematic. A robust theory should have a method to specify desires beforehand.
answer: |-
  This pattern has a precise structure in philosophical methodology, and while it lacks a universally agreed-upon name, it’s best described as **verdict-conforming redescription** (or **absorptive redescription**). Below, I’ll define it rigorously, distinguish it from related concepts, address your boundary questions, and contrast it with objectivist approaches. I’ll also provide diagnostics for identifying it.

  ---

  ### **Core Definition: Verdict-Conforming Redescription**
  **What it is:** A theoretical move where a framework (e.g., a theory of well-being) absorbs any intuitive judgment about a case by redescribing the *inputs* of the theory (e.g., desires, experiences, values) to align with the pre-theoretical verdict. The theory’s structure ensures it *always* outputs the same verdict as the intuition fed into it, rendering it explanatorily vacuous. It conflates *descriptive data* (what people feel or want) with *normative justification* (why it counts as well-being), creating a closed loop.

  **Mechanics in your examples:**
  1. **Overdub/Experience Machine:**  
     - **Intuition:** "Actual achievement matters." → *Theory redescribes:* "You desired actual climbing, not just feelings."  
     - **Intuition:** "Feelings are all that matter." → *Theory redescribes:* "You desired pleasant experiences."  
     The desire-fulfillment theory uses the *outcome* (the person’s refusal or acceptance) to define the *content* of their desires post hoc. The theory doesn’t independently specify *what kinds* of desires count or why; it merely maps "well-being" onto whatever desire is inferred from the reaction.

  2. **Why it’s circular:**  
     - **Input:** The theorist observes an intuitive verdict (e.g., "Plugging in is bad").  
     - **Redescription:** They define the agent’s "desires" as whatever aligns with that verdict (e.g., "They desire reality").  
     - **Output:** The theory "predicts" the verdict (e.g., "The machine fails to fulfill their desire for reality").  
     The theory borrows its normative force from the intuition it was meant to evaluate.

  ---

  ### **What It Is Not (and Why)**
  1. **Not unfalsifiability:**  
     Unfalsifiable theories make no testable predictions. Here, the theory *does* make predictions—they just always match inputs. The problem is *trivialization*, not untestability.

  2. **Not motte-and-bailey:**  
     Motte-and-bailey swaps between defensible/indefensible claims. Here, there’s only one claim ("well-being is desire-fulfillment"), but it’s applied vacuously via redescription. No swapping occurs.

  3. **Not auxiliary hypotheses:**  
     Auxiliary hypotheses (e.g., "The machine has hidden flaws") are external fixes. Here, the absorption is *internal*: redescription is the core mechanism of the theory.

  4. **Not subjectivism/relativism:**  
     Subjectivism says well-being *depends* on individual attitudes. This is fine—but the flaw here is the *lack of constraints* on how desires are identified. A robust subjectivist theory must specify desires *independently* of the verdict (e.g., via pre-theoretical surveys or behavior). Verdict-conforming redescription bypasses this.

  ---

  ### **Boundary Cases: When Is Redescription Legitimate vs. Absorptive?**
  A theory is **legitimately** redescribing when:  
  - It appeals to *independently defined criteria*.  
    *Example:* A desire theorist specifies *in advance* that "desires must be based on full information." If the machine-user’s desire for pleasure ignores the illusion, the theory rejects it as irrational—even if it contradicts some intuitions.  
  - It generates *counterintuitive implications*.  
    *Example:* If the theory says, "You think actual climbing matters, but your desire is actually maladaptive," it risks falsification.

  It **slides into absorptive redescription** when:  
  - The *only evidence* for the input (e.g., desires) is the verdict itself.  
  - The theory *never* conflicts with intuitive judgments; it only "explains" them post hoc.  
  - It treats all reactions as equally valid without a *principled distinction* (e.g., between "informed" vs. "manipulated" desires).

  ---

  ### **Objectivist Theories: A Relevantly Different Problem?**
  Objectivism (e.g., "well-being requires achievement, knowledge, relationships") avoids this *specific* circularity because it doesn’t redescribe inputs—it asserts fixed goods. But it faces a **distinct (yet equally serious) flaw: ad hoc list inflation**.  

  - **How it differs:**  
    Objectivism doesn’t conform to individual verdicts; it overrides them (e.g., "You *think* the machine is good, but you’re wrong—it lacks real achievement"). This *can* be substantive (e.g., arguing ignorance distorts desires).  

  - **Parallel problem:**  
    If objectivists *add* goods (e.g., "contact with reality") *only* to match intuitions about cases like the machine, without independent justification, it becomes **ad hoc**. The theory risks being a mere intuition-catalog: "Why is reality a good?" "Because we reject the machine."  

  - **Key contrast:**  
    - *Desire theories* fail by being *too flexible* (inputs absorb verdicts).  
    - *Objectivist theories* fail by being *too rigid yet unjustified* (goods are inflexible but lack a meta-criterion).  

  ---

  ### **Diagnostics: Is a Theory Doing This?**
  A theory is engaging in verdict-conforming redescription if it answers "yes" to all:  
  1. **Input-Verbidependence:** Does it rely on case-specific intuitions to define its core inputs (desires, experiences)?  
  2. **Output-Neutrality:** Does it *only* output verdicts that match the intuitions fed into it?  
  3. **No Independent Grounding:** Is there no method to specify inputs *before* or *without* the verdict?  
  4. **Immunity to Counterexamples:** Can any reaction to a case be "explained" by redescribing inputs?  

  *Example:* If a desire theorist can’t say *before* the Overdub case what counts as a "desire" (e.g., "desires about real activities" vs. "desires about experiences"), but uses reactions *to* the case to decide, it’s absorptive.  

  ---

  ### **A Proposed Name and Its Justification**
  **Term:** **Absorptive Flexibility**  
  - **Why?** "Absorptive" captures how the theory *swallows* any intuition; "flexibility" highlights the unconstrained redescription.  
  - **Boundaries:**  
    - *In scope:* Theories defining well-being via subjective states (desires, experiences) *without independent criteria*.  
    - *Out of scope:* Theories with fixed criteria for inputs (e.g., "informed desires") or outputs (e.g., objective lists with meta-justification).  

  **To coin a sharper term: Verdict-Dependent Redescription (VDR)**. This emphasizes the core flaw: inputs are *made dependent* on the verdict they’re meant to justify.  

  ---

  ### **The Escape Route: How to Avoid This**
  A theory avoids VDR if it:  
  1. **Articulates a meta-criterion** for inputs (e.g., "Desires must be stable under reflection").  
  2. **Generates substantive constraints** (e.g., "Pleasure from manipulation isn’t well-being, *even if desired*").  
  3. **Allows for mistakes** (e.g., "You *think* you’d be happy in the machine, but you’d be wrong").  

  Desire theories *can* do this (e.g., Railton’s "objectified desire"), but only by building in normative filters beyond mere fulfillment. Without them, they collapse into VDR—a mirror for intuitions, not a tool for evaluation. The machine cases aren’t testing the theory; they’re exposing its emptiness.  

  Let me know if you need the scalpels sharpened further.
