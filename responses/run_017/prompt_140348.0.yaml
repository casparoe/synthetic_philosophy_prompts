     - (i) Die rolls: Maxim plausible (prior ~10⁻⁷⁷; testimony error >> miracle).  
     - (iv) Resurrection: Maxim implausible (prior undefined; testimony error < miracle if theology permits).  
     Variance reveals an unstated anthropocentric premise: "Human-scale anomalies are likelier than cosmic ones."

