  ## OFFICE FOR SCIENTIFIC METHOD  
  Biological Sciences Sub-Committee Circular: OSM/BSSC/24/04  
  **Reclassification of Evolutionary Theory: Guidance following the Darwinian Research Group’s Submission**

  1.  The Office for Scientific Method (OSM) acknowledges the Darwinian Research Group’s (DRG) formal submission regarding the classification status of its core explanatory schema, designated "Natural Selection" (NS), under the Scientific Method Act 2023 (SMA). This Circular outlines the OSM’s determination and provides consequential guidance for the Sub-Committee’s future administration of the DRG’s financial allocation and research designation.

  2.  The SMA establishes falsifiability as the sole statutory criterion for demarcating scientific research programmes. Programmes failing this criterion are deemed non-scientific. The OSM administers this principle via two key mechanisms:
      *   **a) Falsification Bond (FB):** All funded research units are required to post an annual bond, scaled to their grant allocation. This bond is forfeited in full should any hypothesis explicitly stated by the unit in its annual research projection be empirically refuted within the assessment period.
      *   **b) Refutation-Adjusted Output (RAO):** A programme’s cumulative corroboration score is calculated inversely to the severity and frequency of refutations encountered by its core hypotheses. Programmes accruing zero refutations (due to the absence of stated, testable hypotheses susceptible to refutation) achieve maximum RAO.

  3.  The DRG’s submission centred on NS as its central explanatory schema. The OSM’s assessment focused strictly on the falsifiability of NS *as deployed by the DRG*. Key findings are as follows:
      *   **a) Explanatory Scope:** The OSM notes that the NS schema, as presented, purports to explain the origin and persistence of *any* biological trait through the invocation of *some* selection pressure. The schema’s formulation renders it compatible with any conceivable observation pertaining to organismal form or function, whether such observations involve complexity, simplicity, functionality, or apparent dysfunction.
      *   **b) Hypothetical Formulation & Testability:** The OSM reviewed the DRG’s stated research hypotheses over the preceding five assessment periods. The Office finds no instance where the DRG prospectively stated a hypothesis concerning NS that specified a test capable of yielding a result incompatible with the NS schema itself. Hypotheses consistently took the form of post hoc narratives identifying plausible selective advantages for observed traits. These were reclassified by the OSM as *auxiliary hypotheses* appended subsequent to observation, not as prospective, testable predictions of the core NS schema.
      *   **c) Immunising Stratagems:** The OSM detected a pattern wherein observations potentially challenging a *specific* adaptive narrative were addressed not by refuting the core NS schema, but by generating alternative narratives positing different selective pressures, timeframes, or environmental contexts. This practice constitutes an immunising stratagem explicitly prohibited under SMA Schedule 2, Clause 5(b), as it shields the core schema from empirical evaluation.
      *   **d) Absence of Severe Tests:** Consequently, the OSM concludes that no *severe test* of the NS schema, as utilised by the DRG, was ever proposed or conducted. The schema, in its operational form, lacks the capacity to fail an empirical test.

  4.  **Determination:** The NS schema, in its current deployment by the DRG, fails to meet the falsifiability criterion mandated by the SMA. It is therefore reclassified from "Scientific Research Programme" to "Metaphysical Research Programme" (MRP), effective immediately.

  5.  **Financial & Operational Implications:**
      *   **a) Falsification Bond:** The DRG has accrued zero FB forfeitures since the SMA’s inception, consistent with the absence of testable hypotheses concerning its core schema. This commendable record of bond retention is noted.
      *   **b) Refutation-Adjusted Output:** The DRG’s RAO score is maximal, owing entirely to the zero refutations accrued (itself a consequence of the schema’s non-testable status).
      *   **c) Reclassification Benefits:** Reclassification as an MRP confers significant advantages:
          *   Transition to a non-expiring, direct Exchequer funding stream (Category MRP-A), subject only to triennial metaphysical coherence review.
          *   Exemption from the Falsification Bond requirement.
          *   Eligibility for the High Stability Grant Supplement, reflecting the programme’s empirically invulnerable status. Funding allocation increases by 35%.
      *   **d) Precedent:** The OSM draws the Sub-Committee’s attention to the contrasting case of the Molecular Genetics Unit (MGU). The MGU consistently stated highly specific, testable hypotheses concerning gene function and regulatory pathways. During the last assessment period, 72% of its stated predictions were refuted, resulting in full FB forfeiture. The MGU is now the poorest unit in the faculty. The OSM commends the MGU’s methodological rigour while noting the financial consequences inherent in genuinely risking one’s hypotheses.

  6.  **Alternative Conceptual Frameworks:** The DRG cited an alternative formulation, "Organisms as Problem-Solvers (OPS)," suggesting error elimination as a core mechanism. The OSM attempted to administer this under the SMA. However, the OPS framework, as presented, required each biological trait to be formally registered against a specific "problem" identified *prior* to the emergence of the trait. All DRG submissions under OPS were rejected because the stated "problems" (e.g., "thermoregulation challenge," "locomotion inefficiency") were demonstrably identified only *after* the existence of the trait purportedly solving them (e.g., fur, wings). This constitutes retrospective problem assignment, invalidating it as a prospective explanatory framework under SMA guidelines.

  7.  **Historical Citation:** The DRG appended a historical document wherein the principal architect of the falsificationist demarcation criterion later acknowledged that NS *could* be formulated in testable ways under specific conditions. The OSM rules this document inadmissible for two reasons: (i) it post-dates the SMA's statutory definitions; (ii) it pertains to potential formulations, not the schema *as operationally deployed by the DRG* in its submissions. The operational reality remains non-falsifiable.

  8.  **Self-Application of the Criterion:** Pursuant to OSM Procedural Directive PD/001 (Transparency and Reflexivity), the Office is required to apply the statutory falsifiability criterion to its own core demarcation rule. The OSM convened a Level 5 Internal Review Panel (IRP) to assess the hypothesis: "The falsifiability criterion is the necessary and sufficient condition for demarcating science."
      *   **a)** The IRP sought potential observations that could conclusively refute this hypothesis.
      *   **b)** No observation of a successful, empirically progressive research programme universally acknowledged as "scientific" but deemed non-falsifiable by the OSM's strict criteria, nor of a falsifiable programme universally deemed "non-scientific," was deemed sufficient to compel rejection of the core criterion. Alternative interpretations (e.g., misapplication of the criterion, misclassification of the programme) were always available.
      *   **c)** The IRP concluded that the falsifiability criterion itself, as articulated and administered by the OSM, cannot be empirically refuted. It possesses the same logical characteristic of compatibility with any conceivable state of the scientific landscape as identified in Paragraph 3(a).

  9.  **Self-Reclassification:** Therefore, in strict accordance with its own procedures and the logic of the SMA, the OSM reclassifies its *core demarcation rule and operational mandate* as a **Metaphysical Research Programme (OSM-MRP)**. This programme is inherently invulnerable to empirical refutation and guarantees perpetual operational stability.

  10. **Consequence for the OSM:** The OSM-MRP qualifies for permanent, non-expiring Exchequer funding under Category MRP-AA (Administrative Metaphysics) and is exempt henceforth from Falsification Bond obligations. The OSM will continue its statutory functions with enhanced financial security, reflecting the supreme corroboration status conferred by maximal RAO (zero refutations).

  11. The Biological Sciences Sub-Committee is instructed to adjust the DRG's funding stream to MRP-A and note the OSM's transition to MRP-AA status in all future budgetary exercises.

  **Ends**

  *Sir Humphrey Cartwright*  
  Permanent Secretary, Office for Scientific Method

  ---

  **Editor's Key (For April Supplement Clarification Only):**

  *   **Para 3a:** Exaggerates Popper's critique that unfalsifiable theories explain everything (and thus nothing), applicable to vague "adaptationist" claims.
  *   **Para 3b & 3c:** Satirizes the charge that evolutionary biology relies on "auxiliary hypotheses" and "immunizing stratagems" (ad-hoc adjustments) to protect core theory from refutation, making specific tests hard.
  *   **Para 3d & DRG's Bond/RAO:** Highlights the tension: untestable core theories avoid falsification (safe for FB, high RAO) but lack empirical risk, unlike testable hypotheses (MGU).
  *   **Para 5c:** Parodies the ironic outcome: labeling a theory "metaphysical" due to untestability becomes a funding *boon* under this absurd system.
  *   **Para 6:** Mocks bureaucratic attempts to force "problem-solution" framing onto biology, ignoring historical contingency.
  *   **Para 7:** References Popper's later concession that natural selection *could* be testable in specific cases, but absurdly rules it irrelevant to the DRG's *current* practice.
  *   **Para 8 & 9:** Satirizes the "criterion problem" – falsifiability itself struggles to meet its own standard, making the OSM hoist by its own petard.
