prompt: |-
  I'm running a fifty-minute discussion section whose only job is to get first-year students to stop picturing consciousness as something that happens at a place and a time in the brain. They arrive having read a popular-science chapter on split-brain patients and Libet-style experiments, so they come in with a half-formed image of a central observer being fed by the senses. Don't explain the multiple drafts model to me — plan how I'm going to get them there.

  The case I want them able to handle by the end is one I've invented. A subject is shown a red dot in one position, then two hundred milliseconds later a green dot in another, and she reports a single dot that moved and turned green about halfway along. Three things come apart: a speeded button press registering "now it's green" lands only after the second dot has been shown; a read-out of her visual cortex turns up no content corresponding to green-at-the-midpoint until after the second dot; and she insists, unprompted and calmly, that she saw the dot turn green at the midpoint. My students will want to say either that she is simply wrong about her own experience, or that she is right and the neural data are beside the point. I want them to end up seeing why the question "when did that content become conscious?" has no determinate answer until you specify what is doing the probing, and why that is neither a discovery that she was mistaken nor a reason to say consciousness is an illusion.

  Give me the order in which the pieces have to arrive for that to be possible: what distinction has to be in place before the case is even discussable, and the one simpler example that should carry the first half of the session and what it must have and lack. Then give me the three misconceptions I should expect, in the order they'll arrive — that the view amounts to denying that consciousness exists, that it claims several streams of consciousness run side by side, and that it shows our choices are made before we know about them — and the exact point in the sequence at which each should be defused. Finally: one closing question that separates a student who has understood from one who has merely learned to repeat that there is no finish line, and one thing I should openly refuse to settle in fifty minutes.
reasoning: |-
  We are trying to change the students' intuition from a "central observer" model to a model without a single place and time for consciousness. We'll use the multiple drafts model (without explaining the theory explicitly) by designing activities and discussion that lead to its insights.

  Goal by the end: 
  - Students should see that the question "when did that content become conscious?" has no determinate answer until we specify what is doing the probing (i.e., the method of access). 
  - They should understand that this doesn't mean the subject is wrong about her experience, nor does it mean consciousness is an illusion.

  The invented case (let's call it the moving dot case) has three key observations:
  1. Speeded button press (indicating "now it's green") occurs after the second dot.
  2. Neural data (visual cortex) shows no content corresponding to green-at-the-midpoint until after the second dot.
  3. The subject reports seeing a dot that moved and turned green at the midpoint.

  Students might initially say either:
  - The subject is simply wrong (because the neural data and button press don't support her report), or
  - The subject is right and the neural data are irrelevant (because she has first-person authority).

  We want them to see that the question of when the green-at-the-midpoint became conscious depends on how we are probing (button press, neural recording, verbal report). Each probe accesses the content at a different time and under different conditions.

  Plan for the 50-minute session:

  I. Introduction (5 minutes)
  - Briefly set the stage: We are going to challenge the idea that consciousness is like a movie playing in a theater in the brain.

  II. First Distinction (Critical to set up early) (10 minutes)
  - We must establish the distinction between **content** and **access** (or between what is represented and how/when it is accessed by different systems).
  - Without this, the case is not discussable because students will conflate the content of consciousness with the process of reporting it.

  III. Simpler Example to Carry the First Half (15 minutes)
  - We need an example that illustrates that the timing of an event in consciousness can be influenced by later events and that different probes can give different results.
  - **Example: The Cutaneous Rabbit Illusion** (or a similar temporal illusion that is easy to grasp).
     - In the cutaneous rabbit, if you tap someone's arm rapidly at several points (e.g., wrist, then elbow, then shoulder), they feel the taps as if they were equally spaced along the arm, like a rabbit hopping. The tap at the elbow is felt at a location and time that is influenced by the taps that come after.
     - Why this example?
       - It shows that the brain constructs a narrative that doesn't strictly follow the physical timing and location.
       - It lacks the complexity of the moving dot case (only one modality, no color change) but already shows that the content of experience (the location and timing of the taps) is constructed and can be influenced by subsequent stimuli.
       - It also allows us to ask: "When did the tap at the elbow become conscious?" and show that the answer depends on the probe (if we had a button press for each tap, it would be at the physical time, but the experience is of a different timing). However, we can note that in this illusion, the subject's verbal report would match the constructed experience.

  IV. Introduce the Moving Dot Case (15 minutes)
  - Present the case step by step, emphasizing the three observations.
  - Guide the discussion by asking:
    - What does the button press tell us? (It shows that the motor response to the green dot happens after the second dot.)
    - What does the neural data tell us? (The representation of the green dot at the midpoint isn't there until after the second dot.)
    - What does the verbal report tell us? (The subject experienced the dot turning green at the midpoint.)
  - Then ask: "So, when did the subject become conscious of the green dot at the midpoint?"
  - We expect students to try to resolve the conflict by favoring one report over the others. We want to steer them to see that each probe is accessing the content at a different time and for a different purpose.

  V. Address Misconceptions (as they arise, but planned at specific points)

  We have three expected misconceptions:

  1. **The view amounts to denying that consciousness exists.**
     - When it might come up: After presenting the moving dot case and suggesting that there's no single time when the content became conscious.
     - Defuse it by: Emphasizing that we are not denying the existence of conscious experience. The subject had an experience (she saw the dot move and change color). We are just challenging the idea that we can assign a precise time to each element of that experience without specifying how we are measuring it.

  2. **It claims several streams of consciousness run side by side.**
     - When it might come up: When we talk about multiple drafts or multiple processes, students might think we mean multiple conscious experiences happening simultaneously.
     - Defuse it by: Clarifying that the model does not propose multiple consciousnesses. Instead, it says that there are multiple processes that can be accessed at different times and in different ways, but the subject has a unified experience. The unity of experience is the result of the narrative construction, not because all the information is present at the same time in one place.

  3. **It shows our choices are made before we know about them.**
     - When it might come up: Because of the Libet-style experiments mentioned in the reading, and because in our moving dot case the button press happens after the second dot but the experience is of an event at the midpoint. Students might extend this to free will.
     - Defuse it by: Stating clearly that we are not making claims about free will in this session. The point is about the timing of conscious content, not about who is in charge. We can note that the brain processes that lead to a button press might start before the conscious experience of the decision, but that does not imply that consciousness is epiphenomenal. We are focusing on the construction of experience.

  Timing for addressing misconceptions:
  - Misconception 1: Likely when we first present the moving dot case and the students see the conflict. We should defuse it immediately when it arises, which we expect in the first 5 minutes of discussing the moving dot case (around minute 30-35).
  - Misconception 2: Might come up when we draw parallels with the multiple drafts model (without explaining it in detail) or when we talk about different probes accessing different things. We should defuse it when we are comparing the three probes in the moving dot case (minute 35-40).
  - Misconception 3: Likely near the end when we relate to Libet or when discussing implications. We should defuse it in the last 5-10 minutes (minute 40-45) and redirect to the main point.

  VI. Closing Question (5 minutes)
  - To separate understanding from mere repetition: Ask the students to apply the insight to a new example.
    - **Closing question**: "Suppose we have a subject who hears a tone, and then 100 milliseconds later, a second tone. The subject reports hearing a single tone that changed in pitch. We have three observations: 
        (a) a button press for the pitch change occurs after the second tone, 
        (b) neural data in the auditory cortex doesn't show the pitch change until after the second tone, and 
        (c) the subject says the pitch changed at a time midway between the two. 
      How would you explain this using today's discussion?"
    - A student who has understood will say: The question of when the pitch change became conscious depends on the probe. The button press and neural data are later probes, while the verbal report reflects the constructed experience. There is no single time when it became conscious independent of the probe.
    - A student who is repeating without understanding might say: "There is no finish line" but not be able to apply it, or they might try to force a single time.

  VII. One Thing to Refuse to Settle (openly state)
  - We should refuse to settle the question of **free will**. 
    - Say: "We are not going to settle the big philosophical question of free will in this session. That would take much more time and is beyond our scope today. We are focusing on the construction of conscious experience in time."

  Summary of the timeline:
  - 0-5 min: Introduction
  - 5-15 min: Establish the content/access distinction (using maybe a simple example like: when you see a word, the content is the word, but accessing it for a button press vs. for a verbal description might happen at different times and be influenced by context).
  - 15-30 min: Simpler example - Cutaneous Rabbit Illusion (explain, maybe show a video or describe, and discuss). Emphasize the construction of the experience and how the timing is not fixed until probed.
  - 30-45 min: Present the moving dot case and discuss. Address misconceptions as they come up.
  - 45-50 min: Closing question and wrap-up. Refuse to settle free will.

  Note: The simpler example (cutaneous rabbit) must lack the complexity of the moving dot (no color change, only one modality) but must have the key feature: the experience is constructed and the timing is influenced by later events. It must also be simple enough to be understood quickly.

  This plan should lead the students to the insight without explicitly lecturing on the multiple drafts model.
answer: |-
  ### Step-by-Step Session Plan  
  **Goal:** Shift students from a "central observer" model to understanding consciousness as a distributed, probe-dependent process without a single spatiotemporal locus. By the end, they should handle your moving-dot case by recognizing that "when content becomes conscious" depends on the probe (button press, neural readout, verbal report), without concluding the subject is wrong or consciousness is illusory.

  ---

  #### **Order of Pieces: What Must Be Established First**  
  1. **Critical Distinction to Establish Early (Minutes 0–10):**  
     - **Content vs. Access (Probing):**  
       - **Why it must come first:** Students conflate "what is experienced" with "how we measure it." Without this distinction, they’ll misinterpret the moving-dot case as contradictory.  
       - **How to introduce it:**  
         - Use a **simple analogy**: "Think of your brain like a library. The *content* (books/data) exists, but *access* depends on *how* you search (e.g., a librarian’s query vs. a sensor-triggered alarm). Neither method is ‘the true moment of access’—it depends on the probe."  
         - **Concrete example**: Ask students to recall a time they "realized" they were thirsty. Was it when their body registered dehydration (content), when they said "I’m thirsty" (verbal report), or when they reached for water (action)? Highlight that these probes may not align but all access the same underlying state.  

  2. **Simpler Example for the First Half (Minutes 10–25):**  
     - **The Flash-Lag Illusion**:  
       - **What it is**: A dot moves across a screen, and when it passes a stationary flash, observers perceive the flash as lagging behind the dot’s *actual* position.  
       - **Why it works**:  
         - **Has**: Postdictive processing (later info influences earlier perception), multiple probes (e.g., button press to mark flash position vs. verbal report), and no "central observer" (the brain constructs motion retrospectively).  
         - **Lacks**: Complexity of color-change or neural data. It’s visual and intuitive, making it a stepping stone to your moving-dot case.  
       - **How to use it**:  
         - Show a video demo (e.g., from YouTube). Ask: "When did the flash *actually* appear in consciousness? When the light hit your eye? When you pressed the button? When you described it?"  
         - **Key takeaway**: The perceived position depends on *when and how you ask*. Button presses (speeded responses) often align with sensory input, while verbal reports reflect the constructed narrative.  

  ---

  #### **Three Misconceptions and When to Defuse Them**  
  Students will resist by misinterpreting the model. Address these *as they arise* during the moving-dot discussion (Minutes 25–40), but preempt them with clear signposting.  

  1. **Misconception 1: "This denies consciousness exists."**  
     - **When it arises**: Immediately after introducing the moving-dot case, when students see conflicting probes.  
     - **Defusal point**: When explaining the subject’s verbal report.  
       - **Response**: "This doesn’t erase consciousness—it redistributes it. The subject *did* see green-at-the-midpoint, but her access to it wasn’t ‘recorded’ until after the second dot. Consciousness isn’t an illusion; it’s a *process* with no single timestamp."  
     - **Reinforce with the flash-lag**: "Did the flash-lag mean nothing was seen? No—it shows construction happens *in time*."  

  2. **Misconception 2: "Several consciousnesses run in parallel."**  
     - **When it arises**: When discussing conflicting probes (e.g., "If the button press and verbal report disagree, are there two minds?").  
     - **Defusal point**: When comparing neural data vs. verbal report in the moving-dot case.  
       - **Response**: "No—there’s one stream with multiple *drafts*. The button press accesses an early ‘draft’ (raw input: ‘green now’), while the verbal report accesses a later ‘draft’ (narrative: ‘moved and turned green’). It’s not multiple streams; it’s one stream edited over time."  
     - **Anchor with content vs. access**: "Different probes access different ‘edits’ of the same stream."  

  3. **Misconception 3: "Our choices are made before we know them."**  
     - **When it arises**: When linking to Libet (from their reading), especially during the button-press discussion.  
     - **Defusal point**: When analyzing the delayed button press in the moving-dot case.  
       - **Response**: "This isn’t about predetermination. The button press delays because *motor responses* are faster than narrative construction. The subject still *chose* to report what she experienced—but her access to the ‘when’ depends on the probe. We’re not solving free will today!"  
     - **Prevent drift**: Explicitly state, "We’re focusing on *experience timing*, not free will."  

  ---

  #### **Closing Question to Test Understanding (Minutes 45–50)**  
  - **Question**: "In the moving-dot case, why can’t we say the subject is *wrong* about when she saw the dot turn green?"  
    - **Shallow answer (repeats jargon)**: "Because there’s no finish line."  
    - **Deep answer (shows insight)**: "She’s not wrong—her verbal report accesses a constructed narrative draft where green appears at the midpoint. But the button press accesses an earlier draft tied to the physical stimulus, and the neural probe accesses an intermediate draft. No probe is ‘the’ consciousness timestamp; each answers a different question."  

  #### **One Thing to Refuse to Settle**  
  - **Openly state**: "We won’t resolve *how consciousness emerges from neurons* in 50 minutes. That’s a hard problem needing weeks. Today’s win is realizing that asking ‘when did it become conscious?’ is like asking ‘when did a book become known?’—it depends on who you ask and how."  

  ---

  ### **Session Flow Summary**  
  - **0–10 min**: Establish **content vs. access** (critical foundation).  
  - **10–25 min**: Use **flash-lag illusion** to show probe-dependence without complexity.  
  - **25–40 min**: Introduce **moving-dot case**; dissect probes while defusing misconceptions 1→2→3 in sequence.  
  - **40–45 min**: Generalize to multiple drafts: "Consciousness isn’t a broadcast—it’s a wiki with edits and access points."  
  - **45–50 min**: Pose **closing question**, then end by **refusing the hard problem**.  

  This builds from intuition (flash-lag) to complexity (moving-dot) while embedding defusals organically. By the end, students should see the moving-dot case not as a contradiction, but as evidence of a probe-dependent process.
