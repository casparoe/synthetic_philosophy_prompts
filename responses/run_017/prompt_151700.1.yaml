prompt: |-
  So I've been going in circles on endurantism vs perdurantism and I realized I don't actually know what the standard medical practice around advance directives and Ulysses contracts commits you to, metaphysically.

  The practice, as I understand it: you fill out a living will, and the hospital asks about it on intake. While you have capacity, your current say is absolute — you can withdraw consent five minutes before surgery, for any reason or none, even if refusing kills you, and even if you signed a form saying the opposite an hour ago. But once you lose capacity, the thing flips: the document written by the earlier you starts speaking for you, and the demented you's actual present protests (I don't want the feeding tube, let me go home) get gently overruled by reference to what you "really" wanted. Meanwhile, the stickier version of this — psychiatric advance directives, where you precommit to being forcibly medicated during a future episode you know you'll refuse treatment in — gets honored way less reliably, and in a lot of places is treated as close to unenforceable. And then on the ward itself nobody can keep the story straight: when the resident with advanced dementia seems content, staff will say "she's not suffering, she seems happy" and treat that as a real reason to keep going, while giving her current *stated wishes* basically zero weight. So the present time-slice counts as a welfare subject but not as an agent, apparently.

  I want to know what theory of persistence, or of diachronic identity, this package presupposes — if any. Reconstruct the implicit view: does it only make sense if the earlier self and the later self are literally numerically the same substance wholly present at both times, so that the earlier one's will is just authoritative over its own life full stop? Or does perdurantism license all of it too, or better? I keep tripping over the fact that perdurantism isn't one package: on the worm version the earlier stage is literally a part of the same person, which looks like the strongest possible support for precedent autonomy, and on the stage version the later stage is only the same person in some derivative, comes-in-degrees sense, which gives you a natural reason for the earlier self's authority to decay as psychological connectedness decays — but then the all-or-nothing capacity threshold looks like an artifact rather than something the metaphysics wants.

  And please separate out what the practice strictly *presupposes* from what it merely fits comfortably with, and where it's underdetermined and several theories would license the identical behavior. My suspicion is that the refusal/request asymmetry in particular is doing no identity work at all and is really just an asymmetry about vetoes vs. compulsion wearing metaphysical clothing — but I'd like that argued.

  Last bit, the thing I actually can't find discussed anywhere: imagine you junked the threshold and made it graded. The directive's weight is a decreasing function of some operationalized continuity measure (memory overlap, value stability, whether the current person still endorses the old projects — pick whatever you can defend), no bright line, and the decision goes to whoever currently has the strongest continuity claim. What would that practice presuppose? Would a perdurantist have to be a revisionist about the current one? And is the honest answer that the existing binary is metaphysically underdetermined and we only have it because the law needs bright lines — or does it actually fall out of one view and not the other?
reasoning: |-
  Okay, the user is diving deep into the metaphysics behind medical advance directives, specifically how endurantism versus perdurantism might inform practices like living wills and psychiatric advance directives. They've noticed inconsistencies in how current versus past wishes are weighted—especially the sharp shift when capacity is lost—and question what theory of persistence underlies this. They also propose a graded system instead of a binary threshold.

  First, I need to unpack the core tension: the practice treats the pre-capacity-loss self as the "real" agent whose decisions bind the post-capacity-loss self, yet simultaneously acknowledges the post-loss self's welfare (e.g., noting if a dementia patient seems happy). This seems philosophically messy.  

  The user’s suspicion about veto/compulsion asymmetry is astute. The absolute right to refuse treatment while competent likely stems from bodily autonomy principles, not metaphysics. Withdrawing consent pre-surgery is a veto against intrusion, whereas enforcing an advance directive is compulsion. This explains why psychiatric directives (which compel treatment) face more resistance—they lack the veto’s intuitive moral weight.  

  For metaphysics:  
  - **Endurantism** (numerically identical self across time) cleanly justifies binding future selves—it’s literally the same person. The capacity threshold? A practical proxy for when the "real you" can no longer speak.  
  - **Perdurantism** complicates things. The worm view (person as spacetime worm) could support binding later temporal parts, but why privilege the directive-writing part? The stage view (person-stages related by continuity) struggles more—why should an earlier stage dictate to a later one?  

  The graded system proposal reveals the law’s pragmatism. A continuity-based approach (e.g., weighting directives by psychological connectedness) would fit stage-theory perdurantism better, where personal identity degrades gradually. But endurantism could adapt by appealing to values/welfare rather than strict identity.  

  User’s deeper need: they want to know if current practice is metaphysically coherent or just a legal hack. The answer is both:  
  1. The binary threshold is legally/practically driven (bright lines reduce disputes).  
  2. The metaphysics is underdetermined—endurantism fits neatly, perdurantism *can* be stretched to fit, but neither demands the current setup.  

  The welfare/agency split (current self’s suffering counts but not their protests) is a tell: it’s less about identity and more about conflating different moral considerations (autonomy vs. well-being).  

  Final thought: the user might be seeking ammunition to argue for reform (graded directives). If so, highlighting the stage-theory perdurantism fit could help—it naturalizes continuity decay without metaphysical guilt.
answer: |-
  This is a brilliantly sharp dissection of the implicit metaphysics beneath medical practice. Let's reconstruct the underlying commitments, separating presuppositions from comfortable fits and underdetermined areas, then tackle your graded proposal.

  **Core Practice & Its Metaphysical Commitments:**

  1.  **Absolute Authority of the Current Competent Self (Veto Power):**
      *   **Presupposition:** Minimal metaphysics required. This primarily rests on *ethical* principles:
          *   **Bodily Autonomy:** Sovereign control over one's present body is near-absolute. Refusing *intrusion* (treatment) is a fundamental right.
          *   **Present Agency:** The currently reasoning, communicating self is the definitive locus of decision-making authority *right now*.
          *   **Practical Epistemology:** We can *know* the current self's wishes with high certainty via communication.
      *   **Metaphysical Fit:** Compatible with *both* Endurantism and Perdurantism (Worm/Stage). Even Stage Perdurantism grants high authority to the *current stage* while it exists. No persistence theory *demands* this veto power; it's ethically driven. Your suspicion is correct: this is primarily a veto/compulsion asymmetry wearing ethical, not metaphysical, clothing.

  2.  **Binding Authority of the Past Competent Self (Advance Directive) over the Future Incapacitated Self:**
      *   **Presupposition:** A strong form of **Diachronic Personal Identity**. The person who signed the directive *is numerically identical to* the person now incapacitated. The directive expresses the "true" or "real" will of *this same person* across time.
      *   **Strongest Fit:** **Endurantism.** The wholly present, numerically identical substance existing at both T1 (signing) and T2 (incapacitated) means the T1 will *is* the T2 will. T1's authority over T2 is direct and unambiguous – it's simply *the person* governing their own future existence. The capacity threshold is a practical marker for when the *same* person can no longer effectively exercise their will *now*.
      *   **Compatible, but Strains:**
          *   **Worm Perdurantism:** The directive-writing temporal part and the incapacitated temporal part belong to the same spacetime worm (the person). Binding the later part based on the earlier part's decision *can* be justified as the worm's overall "plan" for itself. However, it raises the question: *Why privilege the directive-writing part?* Why not the part experiencing the suffering? The practice leans towards privileging the *rational planning* part, which isn't strictly demanded by the metaphysics but fits an ethical view valuing autonomy expressed through rationality.
          *   **Stage Perdurantism:** This is the most strained fit. The directive-writing stage and the incapacitated stage are distinct entities related by immanent causation/psychological continuity. Why should Stage T1 get to dictate terms to Stage T2? The practice *presupposes* a stronger unity (numerical identity) than Stage Theory readily provides. The capacity threshold looks even more like an artificial imposition.

  3.  **Discounted Agency of the Incapacitated Self (Ignoring Current Wishes):**
      *   **Presupposition:** **Loss of "True" Agency.** The current expressions ("I don't want the tube") are not authentic expressions of the *enduring person's* will. They are seen as artifacts of the illness/dementia ("the disease talking"), not the "real self."
      *   **Commitment:** This relies heavily on the **Endurantist** view of a core, persistent self *behind* the expressions. The incapacitated state obscures or distorts this core self, whose "true" will was expressed competently earlier. The practice assumes we can meaningfully separate the "real person" from the "disease."
      *   **Problem for Perdurantism (especially Stage):** The current stage's expressions *are* the person-at-this-moment. Discounting them as "not really the person" is harder to justify metaphysically. It requires importing an Endurantist-like concept of a "core self" that persists beneath the stages.

  4.  **Acknowledged Welfare of the Incapacitated Self ("She seems happy"):**
      *   **Presupposition:** **Minimal Subjecthood.** Even if not a full agent, the current entity is a *subject of experience* capable of well-being or suffering. This doesn't require strong diachronic identity – a momentary subject of experience suffices.
      *   **Fit:** Compatible with *all* theories. Even Stage Perdurantism readily acknowledges the current stage as a subject. Endurantism sees the same enduring substance experiencing well-being. This explains the asymmetry: the *welfare* of the present time-slice matters intrinsically (it's suffering *now*), but its *expressed agency* is discounted as inauthentic (point 3).

  5.  **The Psychiatric Advance Directive (PAD) Problem:**
      *   **Why Less Enforced?** Primarily *practical and ethical*, not metaphysical:
          *   **Epistemic Uncertainty:** Determining exactly when the "future episode" has started and whether the refusal is illness-driven or a genuine change of mind is notoriously difficult and contested.
          *   **Conflict of Values:** Involuntarily medicating a currently protesting individual feels like a severe violation of *present* bodily autonomy and liberty, often outweighing the prior commitment in clinicians' judgments. The *compulsion* aspect is stark.
          *   **Risk Aversion:** Fear of overriding a potentially competent refusal or causing trauma.
          *   **Metaphysical Underdetermination:** While the *same* metaphysical ambiguity exists, the *ethical* weight shifts dramatically towards protecting the protesting present self against intrusion, mirroring the veto principle but in reverse (compelling treatment vs. refusing it). The metaphysics doesn't *cause* the difference, but the practice highlights how the ethical context (veto vs. compulsion) dominates.

  **The Graded System Proposal & Its Metaphysics:**

  Your proposal: Directive weight decreases as psychological connectedness/memory/value endorsement weakens. No bright-line capacity threshold.

  1.  **What Would This Presuppose?**
      *   **Strongest Fit: Stage Perdurantism + Psychological Reductionism.** Personal identity (or rather, what matters) *is* psychological continuity/connectedness. The authority of the past self naturally diminishes as the connections weaken. The later stage becomes less "the same person" as the directive-writing stage, so the directive's authority fades. Decisions would balance the waning authority of the past self with the emerging (though potentially impaired) agency and welfare interests of the present stage.
      *   **Compatible with Revisionist Endurantism:** An Endurantist could argue that while numerical identity remains absolute, what matters for *moral authority* or *authentic will* is psychological connectedness. The "core self" persists, but its ability to project its will effectively diminishes over time with cognitive decline. However, this requires separating numerical identity from the basis of authority, which the current practice avoids by conflating them via the capacity threshold.
      *   **Presupposition:** That the basis for respecting prior directives is *not* strict numerical identity over time, but rather **psychological connectedness or narrative continuity**. Authority is grounded in the persistence of certain psychological features, not the persistence of a substance.

  2.  **Would a Perdurantist Have to Be a Revisionist About the Current Practice?**
      *   **A Worm Perdurantist** could maintain the current practice, arguing the directive represents the whole worm's plan and later parts are bound by it regardless of connectedness (though this privileges the rational part). They might not *need* to be revisionist, but the graded system fits their view of the worm's temporal parts better *if* they value psychological connections highly.
      *   **A Stage Perdurantist** would almost certainly see the graded system as *more metaphysically honest* and a better fit than the current binary threshold. The current practice imposes an artificial unity that Stage Theory rejects. They would likely be revisionist.
      *   **An Endurantist** would generally see the graded system as revisionist, as it weakens the direct authority derived from numerical identity. They might accept it on practical grounds, but it conflicts with the core Endurantist justification for binding future selves.

  3.  **The Honest Answer about the Current Binary:**
      *   **Metaphysically Underdetermined?** **Yes, but...** Both Endurantism and Worm Perdurantism *can* be stretched to justify the core practice (binding directives, discounting current protests while acknowledging welfare). Stage Perdurantism struggles significantly.
      *   **Does it Fall Out of One View?** **It falls most *naturally and directly* out of Endurantism.** The idea that the *same* whole person exists at T1 and T2, and that T1's competent decision *is* T2's will, is an almost direct corollary of Endurantism. The capacity threshold, while pragmatic, aligns neatly with the moment this single entity loses the ability to *express* its will coherently. Worm Perdurantism requires an additional step (privileging the planning part), and Stage Perdurantism requires a significant metaphysical imposition (importing a persistent self-concept).
      *   **The Primacy of Pragmatism & Ethics:** Crucially, **the bright line exists primarily because the law and medicine require operational clarity and predictability.** Determining a precise moment of "loss of capacity" (however imperfect) is vastly easier and less contentious than continuously adjudicating degrees of psychological connectedness in life-or-death situations. The ethical principle of precedent autonomy *finds its most straightforward metaphysical justification in Endurantism*, making it the most comfortable philosophical bedfellow, even if alternatives *could* be contrived to fit. The veto/compulsion asymmetry is overwhelmingly ethical, exploiting the metaphysical cover provided by Endurantism but not strictly derived from it.

  **Conclusion:**

  The standard practice leans heavily, though not exclusively, on an **Endurantist** metaphysics. It presupposes a numerically identical, wholly present person whose "true will" (expressed when competent) binds their future incapacitated self, whose current protests are dismissed as inauthentic distortions while their welfare is still acknowledged. The capacity threshold is a pragmatic legal/medical line masking this Endurantist commitment. Perdurantism (especially Worm view) *can* accommodate it but less elegantly, while Stage Perdurantism struggles significantly.

  Your graded proposal aligns beautifully with **Stage Perdurantism** and a psychological reductionist view of what matters, making authority contingent on degrees of connectedness. Implementing it would be a significant revision, presupposing that authority decays with psychological distance, not an absolute identity persisting beneath. The current binary isn't *strictly* metaphysically required by any single theory (except perhaps in its most natural Endurantist expression), but it is overwhelmingly driven by pragmatic needs for clear decision rules and finds its most coherent *justification* within an Endurantist framework. The veto/compulsion asymmetry is fundamentally ethical, exploiting the metaphysical setup but not determined by it.
