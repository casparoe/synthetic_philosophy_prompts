  - Resources limited to Moore's essay and prior Descartes readings
  - Needs full exam package: question, model answer, detailed marking scheme

  The physicist's instrumentation analogy is fascinating - they're drawing parallels between scientific bootstrapping (trusting unverified instruments) and Moore's commonsense approach. The key tension is whether assuming calibration standards is epistemically similar to Moore's "I know this hand exists" starting point. 

  For the simulation cases: 
  Case 1 (hand objects in sim) shows Moore's conclusion ("external objects exist") holds even under skepticism, exposing that his real target is knowledge denial. 
  Case 2 (no hand objects) tests if premise truth matters or if only epistemic status counts. This perfectly isolates the premise-known vs premise-true distinction.

  I'll structure the question around these cases, forcing students to analyze where Moore's proof gets traction. The marking scheme will specifically punish "vocabulary without crux" answers - those that name-drop fallacies without engaging the epistemic hierarchy Moore establishes.

  The model answer needs to demonstrate: 
  1) Why Case 1 doesn't refute Moore (his conclusion still holds) 
  2) How Case 2 reveals the knowledge/premise truth distinction 
  3) Why the instrumentation analogy works for justification but not knowledge claims

  For the marking scheme, these will be the must-hit points: 
  - Distinguishing conclusion-truth from knowledge-denial target 
  - Analyzing premise status in both simulation cases 
  - Pressure point on "known premises" criterion 
  - Instrumentation analogy limitations 
  - Why question-begging charges miss Moore's hierarchy 

  The first-class vs upper-second distinction will hinge on whether students recognize Moore's move isn't about proof but about reordering epistemic priorities - the crux being that skepticism can't override basic perceptual knowledge.
answer: |-
  Below is a complete examination package tailored to your specifications. The question uses your simulation cases to force engagement with Moore’s epistemic hierarchy, while the marking scheme penalizes superficial answers that miss the crux.

  ---

  ### **Examination Question**  
  **Time Allowed: 90 minutes**  
  **Word Limit: 700 words**  

  > “Moore’s proof famously concludes ‘Here is one hand, and here is another; therefore, external objects exist.’ Critics accuse him of begging the question against the sceptic. Moore, however, insists his proof satisfies three criteria: (1) the premises differ from the conclusion, (2) he *knows* the premises to be true, and (3) the conclusion follows deductively.  
  >   
  > **Case A**: Anna inhabits a seamless computer simulation. Her world contains simulated hands, tables, and physics, run on a material machine in a wider external world.  
  > **Case B**: Anna’s experiences are identical to Case A, but generated without any hand-shaped objects in the simulation; her ‘hands’ are non-object illusions.  
  >   
  > Using *only* Moore’s essay and Cartesian scepticism (dreaming/demon), answer:  
  > (a) Does Moore’s conclusion (‘external objects exist’) hold in *both* Cases A and B? Explain why this reveals his true anti-sceptical target.  
  > (b) Does the *truth* of Moore’s premises matter in Case B? Or is their *epistemic status* (whether he *knows* them) doing all the work?  
  > (c) A physicist argues: ‘Like trusting instruments before calibration, Moore trusts his hands to bootstrap knowledge. This isn’t vicious circularity but a necessary starting point.’ Is this a fair defence of Moore? Why or why not?”  

  ---

  ### **Model Answer** (689 words)  
  **(a) Moore’s conclusion holds in Case A but not Case B**, revealing his target is *knowledge-denial*, not *conclusion-falsity*. Moore defines “external objects” as “things external to *our minds*” that exist in space (1939, p. 146). In Case A, simulated hands are spatial objects outside Anna’s mind, satisfying Moore’s definition. In Case B, no such objects exist. Crucially, Moore’s conclusion remains *true* in Case A *even under sceptical deception*, proving he aims to refute the claim that “nobody can *know* an external world exists” (p. 149), not that sceptical scenarios are impossible.  

  **(b) Premise truth is irrelevant to Moore’s proof; only *knowledge* matters**. Moore’s criterion (2) requires *knowing* “here is a hand,” not its mere truth. In Case B, the premise “here is a hand” is *false*, so Moore couldn’t *know* it. But if Anna (like Moore) claims to *know* it, the sceptic protests: “You might be deceived!” Moore’s reply is that his knowledge of his hand is *more certain* than any sceptical premise (e.g., “I might be dreaming”) (p. 149). For Moore, the epistemic status of the premise—its immunity to sceptical doubt—is foundational. The proof’s force depends entirely on whether he *knows* the premise, not whether it is true *in all scenarios*.  

  **(c) The instrumentation analogy defends Moore’s *justification* but confuses *knowledge* with *assumption***. Like scientists trusting instruments before calibration, Moore treats perceptual knowledge (e.g., “here is a hand”) as a justified starting point. This “bootstrapping” isn’t vicious: calibration chains terminate in inter-instrument consistency, just as Moore terminates doubt in commonsense certainty. However, the analogy limps by conflating *pragmatic justification* with *epistemic knowledge*. The physicist’s “trust” is a *pragmatic assumption* enabling inquiry; Moore’s “I know” is an *epistemic claim* denying scepticism’s possibility. The sceptic argues that without prior proof against deception, Moore’s “knowledge” is an assumption. Moore’s genius is rejecting this: he *prioritises* perceptual knowledge over sceptical hypotheses, denying the sceptic’s right to demand proof for everything at once (p. 150). The analogy thus flatters Moore’s method but misrepresents his anti-sceptical move as practical rather than epistemological.  

  **Conclusion**: Moore’s proof shifts the burden of proof onto scepticism by exploiting epistemic hierarchy. Case A shows his conclusion survives deception; Case B proves premise *knowledge* (not truth) is key. The instrumentation analogy captures his foundationalism but misses that Moore isn’t assuming—he’s *asserting knowledge* as indefeasible by design.  

  ---

  ### **Marking Scheme** (20 marks total)  
  **Must-hit points** (✓ = full marks; ✗ = common error):  

  1. **Distinguish conclusion-truth from knowledge-denial target** (4 marks)  
     - ✓: Notes conclusion holds in Case A (simulated hands = external objects) but not B; identifies Moore’s target as sceptical *knowledge-denial*.  
     - ✗: Claims conclusion false in both cases or conflates scepticism with external-world nonexistence.  

  2. **Premise truth vs. knowledge in Case B** (4 marks)  
     - ✓: States premise truth is irrelevant; Moore’s criterion (2) requires *knowledge*, which fails in B if premise false.  
     - ✗: Assumes premise truth matters for the proof’s validity or confuses knowledge with justification.  

  3. **Pressure on ‘known premises’ criterion** (4 marks)  
     - ✓: Explains Moore’s key move: knowledge of hands is *more certain* than sceptical premises, reversing the burden of proof.  
     - ✗: Only discusses criteria (1) or (3) (difference/validity) or calls the proof “invalid” without engaging hierarchy.  

  4. **Instrumentation analogy: defence and limitation** (4 marks)  
     - ✓: Praises analogy for bootstrapping justification but notes it conflates *assumption* (physics) with *knowledge-claim* (Moore).  
     - ✗: Uncritically endorses/rejects analogy; misses the category difference (pragmatic vs. epistemic).  

  5. **Anti-sceptical strategy: epistemic priority, not proof** (4 marks)  
     - ✓: Argues Moore denies scepticism can override basic knowledge; his “proof” is a priority declaration, not deduction.  
     - ✗: Labels Moore “question-begging” without explaining why he rejects scepticism’s starting point.  

  ---

  ### **First-Class vs. Upper-Second Distinction**  
  **First-class (70+%)**: Identifies that Moore’s goal is *not proof* but *epistemic reordering*. Crucially:  
  - Recognises Moore treats “I know I have hands” as *axiomatic* against scepticism’s demands.  
  - Sees that Case B exposes premise *knowledge* (not truth) as the lynchpin.  
  - Explains *why* the analogy limps (knowledge ≠ assumption).  

  **Upper-second (60–69%)**: Hits all vocabulary (e.g., “question-begging,” “external objects,” “sceptical hypothesis”) but misses the *hierarchy of certainty*. Typical flaws:  
  - Discusses Case A/B but not how they isolate knowledge vs. truth.  
  - Calls the analogy “apt” or “inapt” without analysing the assumption/knowledge divide.  
  - Agrees sceptics “win” because Moore assumes what he proves—failing to engage Moore’s *denial* of scepticism’s authority.  

  ---

  ### **Rationale for Design**  
  - **Your analogy**: Integrated to force debate about Moore’s foundationalism. The marking scheme (point 4) penalises missing the assumption/knowledge distinction you flagged.  
  - **Cases A/B**: Isolate premise *truth* (B falsifies it) from *knowledge* (which fails in B if the premise is false). Shows Moore’s target is knowledge-denial.  
  - **No secondary literature**: Relies solely on Moore’s text (premises ≠ conclusion, knowledge requirement) and Descartes (sceptical scenarios).  
  - **Crux emphasis**: Upper-seconds lose marks for discussing “question-begging” without analysing *why* Moore rejects scepticism’s premises (point 5).  

  This tests the precise distinction you sought: Moore’s battle is over *what we can legitimately claim to know*, not logical validity. The physicist’s analogy is a Trojan horse to expose this.
