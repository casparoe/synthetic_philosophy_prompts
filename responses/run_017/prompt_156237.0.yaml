prompt: |-
  I've been reading the rationalist blogs since the late 2000s and belong to a small forecasting group that grew out of that scene — we meet monthly, keep calibration logs, and nearly all our arguments are about back-of-envelope decompositions rather than about anything anyone could look up. At the last session I presented a Fermi-style estimate of the probability that a frontier lab's alignment plan fails within five years: I split the event into three conjuncts (continued capability growth, the plan's central assumption holding, no exogenous pause), gave each a number, and multiplied under an explicit presumption of independence. A friend who is better at this than I am then re-ran my own estimate under a finer decomposition, splitting the second conjunct into three sub-conjuncts, taking the numbers for those sub-conjuncts from what I'd have said if asked about them cold (the only way to get marginals for conjuncts I'd never considered), and produced a figure nearly an order of magnitude below my original one. He claims this is completely general and calls it the fragmentation lemma. Here is the argument as he gives it.

  (1) A heuristic estimate of P(E) reached by decomposing E into conjuncts and multiplying is warranted only to the extent that the conjuncts are probabilistically independent, or at least not positively correlated; that assumption is where the epistemic work is done. (2) The correct formalisation of the presumption of independence — the default you are entitled to when you have no evidence of correlation — is maximum entropy subject to what you know: given the marginals and nothing further, the maximum-entropy distribution is the product of the marginals, i.e. independence. (3) Maximum entropy earns that role because it is the unique choice that adds no information beyond the constraints, and, on the concentration-of-measure reading, because it is what almost any distribution satisfying the constraints will look like. (4) But maximum entropy is sensitive to the description of the space: re-coarse-grain the sample space, or apply a non-linear change of coordinates to a continuous variable, and the maximum-entropy distribution changes although nothing has been learnt. So "adds no information" is well-defined only relative to a chosen partition. (5) In a heuristic argument the decomposition is chosen by the arguer, and there is no canonical decomposition of an event: any conjunct can always be cut further. (6) Hence the fragmentation lemma: holding the evidence fixed, I may refine the decomposition of E into arbitrarily many conjuncts, apply the presumption of independence to each refinement — every refinement being an equally entitled instance of (2) and (3) — and thereby move the estimate for P(E) by large factors without any change in what I know. (7) So no heuristic estimate resting on a presumption of independence is constrained by the evidence at all; the number comes from an arbitrary modelling choice, and such arguments are worthless. (8) But that cannot be right: independence assumptions plainly work sometimes — repeated randomised trials, spatially separated systems, dice — and abandoning them would take most of applied probability, causal inference from passive data, and decision theory down with them.

  I want to know which step you would reject, why it looked fine, and what rejecting it costs. My own suspicion is that (6) is where something slips: under genuine independence the product of the finer marginals has to agree with what I already believed about the coarser event, so the lemma must be smuggling in new judgements while calling them the same evidence — but I cannot make that precise, and my friend says the suspicion simply begs the question against (4). Assume I know the standard machinery — Bayes, the Markov condition and d-separation, why differential entropy is not invariant under a change of coordinates — so don't explain those. If I have to choose, I would rather keep (2) and (8) than (3); and if the maximum-entropy formalisation really is the thing to drop, tell me what should replace it — a prior over causal structures that penalises extra edges, an exchangeability assumption, a hierarchical prior on a correlation parameter centred at zero, or something else — and what each option buys and costs me in the arguments I actually have. Please lead with your bottom line in the first sentence and then give the reasoning: no preamble, no restatement of the question, and no reading list.
reasoning: |-
  Okay, let me tackle this step by step. The user presents a scenario where their friend uses a "fragmentation lemma" to argue that heuristic probability estimates based on independence assumptions are arbitrary. The core claim is that refining decompositions while presuming independence can arbitrarily lower P(E) without new evidence, rendering such estimates worthless. The user suspects step (6) is flawed but struggles to articulate why. 

  First, I need to identify the weakest link. Step (4) about maximum entropy's sensitivity to description is technically correct but misses the point in practice. Step (6)'s claim that all refinements are "equally entitled" is where it truly fails. Why? Because in real-world reasoning, we choose decompositions based on causal structure or domain knowledge, not arbitrarily. For example, when estimating dice rolls, we don't decompose into atomic quark events—we stop at face-level independence. The friend's argument ignores that heuristic estimates aren't mathematical exercises; they're anchored to meaningful variables. 

  The user's suspicion about smuggling in new judgments is valid. Fragmenting conjuncts forces new marginal estimates that may contradict the original coarse estimate. If I previously believed P(A) = 0.5 for a broad event, and now assign P(A₁) = 0.9 and P(A₂|A₁) = 0.9 for its fragments (presuming independence), I've effectively set P(A) = 0.81—a shift without new evidence. The lemma disguises this as mere refinement. 

  Rejecting step (6) doesn't force abandoning maximum entropy entirely. We can keep it for well-defined partitions where variables are causally separable (e.g., spatially isolated systems). But for ad hoc decompositions? We need safeguards: either (a) require consistency checks (finer estimates must multiply to the coarse marginal), or (b) use hierarchical models with skeptical priors on correlation. Option (a) blocks arbitrary fragmentation; option (b) allows it but penalizes complexity. Both cost computational effort but save applied probability from collapse. 

  The user's desire to preserve (2) and (8) makes sense. Independence assumptions aren't inherently broken—they fail when misapplied. The fix isn't discarding maximum entropy but constraining decomposition choices to natural variables (e.g., "exogenous pause" in their original estimate). This aligns with how we actually use Fermi estimates: coarse-graining at causally relevant levels.
answer: |-
  **Reject step (6): Refinements are not "equally entitled" instances of the maximum-entropy presumption when they contradict your existing probabilistic beliefs.**  

  **Why (6) fails:**  
  - When you refine a conjunct (e.g., split \(A\) into \(A_1 \land A_2\)) and assign marginals \(P(A_1)\), \(P(A_2)\) "cold," these assignments may **inconsistently imply** a value for \(P(A)\) that differs from your original belief. For example:  
    - Original: You judged \(P(A) = 0.5\).  
    - Refinement: You assign \(P(A_1) = 0.9\), \(P(A_2) = 0.9\) "cold," presuming independence \(\implies P(A) = 0.81\).  
    - This contradicts your original \(P(A) = 0.5\).  
  - The fragmentation lemma ignores that **your original estimate for the coarse event constrains the plausible marginals of its refinements**. If you truly believe \(P(A) = 0.5\), you cannot arbitrarily assign finer marginals whose product exceeds \(0.5\) without new evidence—doing so smuggles in a revised belief.  
  - Maximum entropy (MaxEnt) **requires fixing the domain of variables upfront**. Ad hoc refinement changes the variable set, violating the "no new information" condition in step (2). Your evidence includes your pre-existing marginal for \(A\), which must bind any sub-decomposition.  

  **What rejecting (6) costs:**  
  - You must ensure **consistency across granularities**: Decomposing a conjunct requires that \(\prod P(\text{sub-conjuncts}) \approx P(\text{original})\) absent evidence of dependence. This limits fragmentation's arbitrariness.  
  - In practice: When refining, **recalibrate finer marginals** to honor your coarse estimate (e.g., via proportional scaling or Bayesian updates). MaxEnt can still apply *within* a fixed variable set, but variable choice isn't unconstrained.  

  **Why other steps hold or can be kept:**  
  - Keep (2)/(3): MaxEnt remains a justified default **for a fixed set of variables** when no correlations are known.  
  - Keep (4): MaxEnt's dependence on variable choice is real but manageable by anchoring to **causally natural variables** (e.g., "exogenous pause" in your original estimate).  
  - Keep (8): Independence assumptions work when decompositions align with causal structure (e.g., dice rolls, RCTs).  

  **Better formalization:** Use a **hierarchical prior** for correlation:  
  - Place a skeptical prior (e.g., Beta(\(\alpha,\beta\)) with \(\alpha/(\alpha+\beta) \approx 0\)) on correlation strength between sub-conjuncts.  
  - **Cost**: More computation; requires specifying hyperparameters.  
  - **Benefit**: Allows refined decompositions while penalizing extreme independence assumptions, and coherence with coarse estimates emerges naturally.  

  **Bottom line:** Your suspicion is correct—fragmentation violates consistency, not genuine independence.
