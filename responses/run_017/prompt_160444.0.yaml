prompt: |-
  I'm putting together a short position paper for a workshop on character and moral psychology later this term — the organizers want each participant to circulate a numbered list of commitments in advance so that the respondents can press on specific theses rather than on our general sensibility — and before I send mine out I would like an audit rather than a defense. I have been teaching a graduate seminar in this area for some years and, after a colloquium last month, a visitor raised an objection I could not answer cleanly, which is what prompted me to try to write the list down properly. Here it is.

  (1) I accept the situationist critique as an empirical thesis about the psychological bases of ordinary moral behaviour, at least in its moderate form: cross-situational consistency in trait-relevant behaviour is much lower than both folk psychology and neo-Aristotelian moral psychology have supposed, and a substantial share of the variance is accounted for by features of the setting that are morally irrelevant — whether one has just found a coin, whether one is in a hurry, whether the room smells unpleasant, whether an authority figure is nearby. I hold this while thinking the critics have overreached in one respect: I lean on the older, multiply-replicated demonstrations (the obedience experiments, the seminarian-in-a-hurry study, the phone-booth dime study) and I discount the later social-priming literature, which I take to have largely failed to replicate. I do not think the conclusion is that there is no such thing as character; I do think it rules out robust global traits of the sort virtue ethics has traditionally postulated.

  (2) I am nonetheless a neo-Aristotelian of a fairly orthodox sort: the virtues are the fundamental normative notions, and rightness is not to be defined by way of consequences or rules with the virtues then derived from it. I also want the account of right action to remain agent-involving — the right thing to do here is what the virtuous agent would characteristically do here — and I resist replacing this with a list of rules read off the virtue names, because I think the appeal to the agent is what does the real work in hard cases.

  (3) My way of keeping (2) given (1) is to reconstruct the virtues as fine-grained, situationally indexed dispositions — not honesty but honesty-under-conditions-of-type-C — with whatever unity a virtue has supplied by a stable if-then signature of the kind the personologists describe, rather than by sameness of behaviour across situations. I have also been toying with a further move I have started calling the scaffolding reply: much of what we praise in a praiseworthy person is their skill at arranging which situations they end up in — the reliable friend does not put herself in the position where returning the wallet is costly — so that on my view virtue includes a competence in managing one's circumstances, not merely a competence in responding to them.

  (4) Whatever the reconstruction, I want virtue to keep its practical role: it must be something one can be educated into, aspire to, and deliberately cultivate over a life, and it must be able to underwrite our practices of holding people responsible. I am drawn to blaming for quality of will — for what the action showed about the agent's judgments and concerns — rather than for the act token or its downstream effects.

  (5) I reject moral luck, at least in its constitutive and circumstantial forms: whether an act is right, and how much credit or discredit an agent incurs for it, should not ride on factors outside the agent's control. This is a large part of why I moved away from consequentialism, and I would give up a tidy decision procedure rather than give it up.

  (6) Methodologically, I think claims about the structure of character are answerable to empirical psychology, and that where psychology delivers a clear verdict, philosophical accounts of character must accommodate it rather than reinterpret it away.

  (7) I also want to be able to say that some people really are cross-situationally reliable in the way the tradition claimed — I can think of one or two — that this is a genuine feature of them rather than a run of situational luck, and that it makes them better people rather than merely luckier ones.

  Two verdicts I am attached to, since they are where I feel the strain most: the seminarian who was in a hurry and stepped past the slumped stranger did something wrong, though he is less blameworthy than someone who stepped past her in cold blood; and the passer-by who helped because he had just found a coin did the right thing and is creditable for it — I do not want to discount his credit on the ground that the cause of his helpfulness was a morally irrelevant piece of luck, and I do not want to say either that he merely got lucky in doing what he did.

  What I want from you is an audit of this package, not a survey of the literature. Tell me which pairs of these commitments are actually in tension and how badly, ordered by severity rather than all flagged equally, and for each tension say precisely which numbered item has to give and what giving it up would cost me elsewhere in the list. I take it that the familiar tension between (1) and (2) is less bad than it looks, and I would like you to confirm or deny that quickly and then spend the rest of your answer on the trouble I have not noticed — including the verdicts, which I suspect are where my stated principle fails to deliver. Please also mark any pair that only looks inconsistent and dissolves on inspection, so that I can see what I am entitled to keep, and finish by naming the single revision that would clean up the most and what it would leave me unable to say.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated position paper on character ethics with seven numbered commitments and two specific verdicts, requesting an audit focused on internal tensions rather than a literature review. 

  First, I notice several potential friction points beyond the obvious (1)-(2) reconciliation. The scaffolding move in (3) seems promising but may overstretch when combined with (5)'s rejection of moral luck. If virtue includes situation-management competence, doesn't that make circumstantial luck (e.g., having resources to avoid temptations) constitutive of virtue? Yet (5) explicitly rejects constitutive luck. 

  (4)'s practical role requirement clashes subtly with (1)'s empirical constraints. If virtues are fine-grained dispositions indexed to specific conditions, how do we cultivate them systematically? The "if-then signatures" might be too context-dependent for traditional moral education models. 

  The verdicts reveal deeper issues. Praising the coin-finder's action while maintaining (5) creates tension - his morally irrelevant good luck (finding coin) directly caused the virtuous act. Similarly, grading blame for the hurried seminarian based on cold-bloodedness seems to reintroduce the very situational factors (1) identifies as problematic. 

  (7) is particularly tricky. Wanting to preserve rare cases of cross-situational reliability while accepting (1) requires explaining why these aren't just statistical outliers. The "stable if-then signature" framework might handle this if we interpret cross-situational consistency as meta-regularity in disposition activation. 

  The most severe tension is between the scaffolding defense in (3) and anti-luck stance in (5). Sacrificing (5)'s strict rejection of constitutive luck would resolve this but at high cost - it undermines the core motivation for rejecting consequentialism stated in (5). Alternatively, limiting scaffolding to deliberate situation-selection (excluding unchosen advantages) might preserve coherence. 

  Methodologically, (6) seems robust but could conflict with (2) if future psychology challenges the very possibility of virtue. The current package survives because (1) accepts only moderate situationism - a stronger empirical challenge might force harder choices. 

  For dissolution opportunities: The apparent (3)-(7) tension vanishes if cross-situational reliability is reinterpreted as consistently activating appropriate fine-grained dispositions across varied contexts, rather than uniform behavior. The seminarian verdict can stand if "cold blood" reflects stable callousness (quality of will) rather than situational mood - aligning with (4)'s blame theory. 

  The single most clarifying revision would be moderating (5) to allow circumstantial luck in virtue acquisition while maintaining control over exercises of virtue. This preserves key verdicts but forces conceding that the coin-finder's opportunity was lucky - though his responsiveness to it remains creditable. The cost is weakening the anti-luck absolutism that motivated abandoning consequentialism.
answer: |-
  Here's an audit of your commitments, ordered by severity of tension, identifying precise points of conflict, dissolution opportunities, and the highest-impact revision:

  ### Severe Tensions (Require Concession)
  1. **Tension: (3) Scaffolding + (5) Anti-Moral Luck**  
     - **Conflict:** Scaffolding makes virtue partly dependent on *skill in managing circumstances*. But circumstantial/constitutive luck (e.g., socioeconomic privilege, upbringing, unchosen opportunities) heavily influences one’s capacity to arrange situations. (5) insists credit/discredit cannot ride on luck.  
     - **What Must Give:** (5)’s rejection of *constitutive* luck. Scaffolding implies virtue is constituted by competencies that rely on luck-infused capacities (e.g., foresight, resources).  
     - **Cost:** Weakens your anti-consequentialist motivation. You must accept that some virtuous agents are "luckier" in their constitutive traits/circumstances.  

  2. **Tension: (7) Rare Cross-Situational Reliability + (1) Situationism + (6) Empirical Accountability**  
     - **Conflict:** (7) asserts some agents exhibit *global* reliability (defying (1)), and this reflects their moral worth (not luck). But (1) and (6) imply cross-situational consistency is empirically rare and often artifactual. Calling outliers "genuine" risks ignoring situational explanations (e.g., stable environments).  
     - **What Must Give:** (7)’s claim that cross-situational reliability is a "genuine feature" *distinct from luck*. You can keep (7) only by redefining "genuine" as *meta-situational management* (per (3)), not cross-situational behavioral invariance.  
     - **Cost:** Abandons the traditional robustness you want to preserve; these agents are "better" only because of superior scaffolding, not context-independent traits.  

  ---

  ### Moderate Tensions (Manageable but Require Refinement)
  3. **Tension: (4) Cultivability/Responsibility + (1) Low Cross-Situational Consistency**  
     - **Conflict:** If virtues are fine-grained (3), cultivating them requires mastering countless context-specific dispositions. (1) suggests predicting/controlling behavior across contexts is harder than folk psychology assumes, complicating deliberate cultivation and responsibility-ascribing practices.  
     - **What Must Give:** (4)’s emphasis on *deliberate cultivation*. Aspiration/education must focus on scaffolding skills and sensitivity to contexts, not raw willpower.  
     - **Cost:** Diminishes the sense of direct agential control over virtue acquisition; responsibility practices shift toward *quality of will* (which you endorse) but away from outcome-based judgments.  

  4. **Tension: Your Verdicts + (5) Anti-Moral Luck**  
     - **Conflict:** Praising the coin-finder credits him for an act caused by luck. (5) insists credit shouldn’t depend on luck. Grading blame for the seminarian based on situational factors (haste vs. "cold blood") makes blameworthiness partly luck-dependent.  
     - **What Must Give:** (5)’s blanket rejection of *all* circumstantial/consequential luck affecting credit. You must allow that *executing* right action can be luck-influenced while preserving *quality of will* as credit’s core.  
     - **Cost:** Forces a concession: the coin-finder’s *opportunity* was lucky, but his *responsiveness* (quality of will) is creditable. Seminarian’s blame is reduced due to situational pressures diminishing his will’s quality.  

  ---

  ### Dissolved Tensions (Apparent Inconsistencies Resolved by Your Framework)
  - **(1) Situationism + (2) Neo-Aristotelianism:**  
    Your move in (3) (fine-grained virtues + scaffolding) dissolves this. Virtue ethics isn’t committed to *globalist* traits—Aristotle acknowledges context-specificity (*Nicomachean Ethics* II.9).  

  - **(3) Fine-Grained Virtues + (7) Cross-Situational Reliability:**  
    If cross-situational reliability is reinterpreted as *reliable activation of context-appropriate dispositions* (i.e., stable "if-then signatures"), not uniform behavior, (7) aligns with (3).  

  - **(6) Empirical Accountability + (2) Normative Primacy:**  
    No conflict: Psychology constrains *character structure* (how virtues are instantiated), not virtue’s *normative status*.  

  ---

  ### Highest-Impact Revision
  - **Revise (5): Reject constitutive/circumstantial luck only for *quality of will*, not outcomes/opportunities.**  
    - **What It Solves:**  
      - Resolves tension with (3): Scaffolding skills can be luck-dependent without eroding moral worth, which resides in the will.  
      - Resolves verdict conflicts: Coin-finder gets credit for caring (will), not luck; seminarian’s reduced blame reflects his will’s impairment (not just situational luck).  
      - Preserves (7): Cross-situational agents are "better" due to superior will/excellence in scaffolding.  
    - **Cost:**  
      - Concedes some moral luck (contrary to your consequentialist-rejection motive).  
      - Weakens the link between virtue and *action outcomes* (since outcomes depend on luck).  

  ### Final Summary of Required Adjustments
  | **Commitment** | **Adjustment Needed** | **Primary Tension With** | **Cost of Adjustment** |
  |----------------|------------------------|---------------------------|------------------------|
  | (5) Anti-luck  | Limit to quality of will | (3) Scaffolding, Verdicts | Accepts outcome-dependent luck; weakens anti-consequentialist argument |
  | (7) Robust traits | Redefine as meta-situational competence | (1) Situationism, (6) Empiricism | Abandons traditional globalism; traits are scaffolding skills |
  | (4) Cultivability | Focus on scaffolding/sensitivity | (1) Low consistency | Less emphasis on direct control; responsibility hinges on will, not behavior |

  This audit suggests your package is coherent *if* you accept that moral worth resides in quality of will (partly luck-resistant) while granting that virtue’s *expression* depends on situational and constitutive luck. Your core neo-Aristotelianism (2) and moderate situationism (1) survive intact.
