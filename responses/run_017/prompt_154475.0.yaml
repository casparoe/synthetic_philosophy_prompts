  First, the user wants to question the fixed-point constraint in superrationality. They suspect it’s just a coordination rule without metaphysical depth. The assistant’s questions here should push the guest to explain if the "shared reasoning" aspect is necessary or just relabeling. The follow-up needs to challenge whether timeless decision theory adds substance or just rebrands existing ideas.

  Second, there's a custom variant with asymmetric information (SINGLE/DOUBLE slips). The user wants to see if superrationality can handle broken symmetry or if it collapses. The follow-up should probe if the "same function" argument holds or if it leads to bargaining. This tests the framework’s robustness under asymmetry.

  Third, partial superrationalists: what happens when only some agents use the theory? The user is concerned about graceful degradation versus dependency on exact compositions. If it requires knowing room composition, how is that different from standard game theory? This questions practical applicability.

  The user also wants a closing question on what could falsify the view. They need a scenario where superrationality fails or gives unacceptable results, which the guest can't dismiss as outside the theory’s scope. Plus, a question that preempts the guest's deflection about the meaning of "should."

  The challenge is crafting conversational, non-seminar-style questions that dig deep. The audience is econ grad students and LessWrong types, so questions need rigor without jargon. The guest tends to equivocate, so questions must corner him into clear answers. The assistant’s proposed questions address these by using concrete examples and demanding clarity on mechanisms versus relabeling, asymmetry handling, partial adherence, and falsification.
answer: |-
  Here are nine conversational but incisive questions targeting the core tensions in superrationality, designed to avoid rehashing old examples and force novel engagement. Each includes the predicted response and a targeted follow-up:

  1.  **The "Shared Reasoning" Grilling:**  
      **Q:** "Let's grant that in symmetric PDs, superrationality gets cooperation. But *why* must I optimize over the diagonal? If it's just 'assume identical outputs from identical inputs,' isn't that just a clever coordination trick? What *metaphysical glue* forces me to treat my clone's deliberation as *part of mine* rather than just a correlated event I exploit?"  
      *Predicted Answer:* He'll invoke "timeless/functional decision theory" or "shared causal node," arguing choices are outputs of the *same* abstract function, not correlated independent events.  
      **Follow-Up:** "Right, but doesn't CDT *also* let me condition on the fact that an identical agent will output the same thing? Where's the *operational* difference between FDT saying 'run function F' and CDT saying 'condition on the output of F' in this symmetric case? Does FDT *do* anything new here besides *labeling* the diagonal constraint?" (Forces him to show FDT's unique mechanics).

  2.  **The DOUBLE-SLIP Challenge (Asymmetry Test):**  
      **Q:** "So my DOUBLE-SLIP variant: Ten SINGLEs, ten DOUBLEs, same payout rules. Symmetry is broken – DOUBLEs get twice the upside. Does superrationality tell the DOUBLEs to ask? What function F(SLIP) should everyone run?"  
      *Predicted Answer:* He'll say everyone runs the *same* function F. F likely outputs ASK for DOUBLEs (higher payoff justifies the risk) and maybe NOT-ASK for SINGLEs. He'll claim symmetry is restored at the functional level.  
      **Follow-Up:** "But now the SINGLEs have a huge incentive to *deviate*! If DOUBLEs are all asking, a SINGLE knows they only win if *no other SINGLE* asks. So why wouldn't a SINGLE defect and ask too, hoping others cooperate? Doesn't this break the fixed point? How is F(SINGLE)=NOT-ASK stable if F(DOUBLE)=ASK?" (Targets stability under asymmetric payoffs).

  3.  **The DOUBLE-SLIP Follow-Up (Bargaining or Function?):**  
      **Q:** "Building on that: If F(SINGLE)=NOT-ASK and F(DOUBLE)=ASK is the proposed equilibrium, isn't this just the DOUBLEs *exploiting* the SINGLEs' cooperation? How is this different from a *bargained solution* where one group sacrifices for another? Where's the 'shared reasoning' making this fair or necessary?"  
      *Predicted Answer:* He'll argue it's the uniquely rational function given the input-dependent payoffs; fairness isn't the point, optimality under the constraint is.  
      **Follow-Up:** "But if optimality allows one group to free-ride on another's restraint *within the superrational framework*, doesn't that undermine the 'we-ness' that supposedly motivates cooperation in the symmetric PD? Is superrationality just utilitarianism constrained by functional identity?" (Challenges the moral/social intuition often leveraged).

  4.  **Partial Superrationalists - The Composition Problem:**  
      **Q:** "Suppose only 12 of us 20 are superrationalists. The other 8 are hardcore CDT defectors who *will* ask for the money. What does superrationality tell the 12 to do? Ask? Not ask? Roll a die?"  
      *Predicted Answer:* He'll likely say it depends on whether the superrationalists can coordinate *among themselves* to run the same function F, treating the CDTers as fixed noise.  
      **Follow-Up:** "But now the 'shared reasoning' group is smaller and fragmented from the CDTers. How do the 12 *know* they are the 12? And if they need to model the CDTers' fixed behavior, how is the prescription *fundamentally different* from a standard Bayesian Nash Equilibrium calculation where I have uncertainty about others' types and rationality?" (Forces comparison to standard GT).

  5.  **Partial Superrationalists - Degradation Test:**  
      **Q:** "Following up: If the answer *is* 'treat CDTers as part of the environment and run F among the 12,' what F should they run? If they run 'ask iff my die roll hits 1/12,' but one superrationalist defects and asks anyway, haven't they just 'won'? How does superrationality punish or prevent that *within* the subgroup?"  
      *Predicted Answer:* He might say the defector isn't truly superrational, or that the function must include modeling potential defection.  
      **Follow-Up:** "So do we need a *meta-function* that defines who counts as 'superrational'? Isn't this regressing into exactly the kind of type-uncertainty and coordination problems that superrationality was supposed to transcend?" (Highlights potential circularity/vulnerability).

  6.  **The "Should" Preemption:**  
      **Q:** "You often say 'you *should* cooperate in the symmetric PD.' Let's pin down 'should.' Does this 'should' mean:  
      a) *You'll get more money* if you both do this?  
      b) *It's morally obligatory* given your shared identity?  
      c) *It's the uniquely rational* act under the correct decision theory?  
      ...and crucially, why can't a clever CDT agent, knowing the other is identical and will do as they do, also cooperate *without* buying the metaphysics? What unique work is the 'should' doing for you?"  
      *Predicted Answer:* He'll argue (c), that CDT cannot stably justify cooperation without conditioning on the *act* itself being irrational.  
      **Follow-Up:** "But if the CDT agent *knows* the other is identical, they *can* condition on the correlation: 'If I cooperate, my identical opponent does too.' CDT *allows* that correlation to be used. Isn't the disagreement then *only* about whether decision theories *should* allow agents to condition on acausal correlations, not about what 'should' means?" (Narrows the debate to the acausal correlation point).

  7.  **The "Weird Corner" Stress Test:**  
      **Q:** "Give me a *non-PD*, symmetric, one-shot game where superrationality gives a clear, *different* answer from both CDT and EDT. Something that highlights its unique mechanism."  
      *Predicted Answer:* He might pick Newcomb's Problem (FDT one-boxes, CDT two-boxes) or a transparent game against a perfect cloner.  
      **Follow-Up:** "In Newcomb's, doesn't the superrational/functional 'one-box' prescription rely entirely on the *predictor's* accuracy and the *asymmetry* (Omega isn't *you*)? Where's the 'shared reasoning' between you and Omega? How does this showcase the symmetric 'we-ness' of the PD?" (Tests if FDT is just repackaging evidential reasoning for specific cases).

  8.  **The Collapsing Prescription:**  
      **Q:** "Imagine a symmetric coordination game with three options: A, B, C. Payoff is high only if everyone picks the *same* option. Superrationality says we all run the same function F. What output should F give? A, B, or C? How does it break the tie?"  
      *Predicted Answer:* He might say any coordinated choice is rational, or suggest salience (pick A!), or say it requires an external randomizer.  
      **Follow-Up:** "If it requires an external randomizer or salience, how is superrationality giving me any prescription *at all* beyond 'coordinate somehow'? And if it *doesn't* specify, isn't it failing as a decision theory for this basic symmetric game?" (Shows potential underdetermination).

  9.  **The Falsification Challenge (Closer):**  
      **Q:** "What's a concrete scenario where superrationality either:  
      a) Gives *no answer* (like the coordination game above, but worse),  
      b) Gives an answer that seems *clearly morally abhorrent or practically self-destructive*, or  
      c) *Contradicts* a strong moral intuition you hold?  
      ...and crucially, one you *couldn't* dismiss as 'outside the theory's intended scope'?"  
      *Predicted Answer:* He might struggle, or offer a complex/rare scenario, or argue the theory is robust.  
      **Follow-Up (if he ducks):** "If there genuinely *isn't* such a case, doesn't that make superrationality unfalsifiable? And if it *is* unfalsifiable, how is it different from a philosophical preference rather than a testable theory of rational choice?" (Forces engagement with Popperian demarcation or limits).  
      **Follow-Up (if he offers one):** "In that case, why shouldn't we take that result as a *reductio* against the core mechanism of superrationality?" (Pushes him to defend the counterintuitive result).

  **Key Tactics Embedded:**

  *   **"What's the Mechanism?":** Repeatedly asks *how* FDT/superrationality differs operationally from conditioning on correlations (Q1, Q6 Follow-Up).
  *   **Asymmetry Breaks "We-ness":** Uses DOUBLE-SLIP to show how functional identity can lead to in-group exploitation (Q2, Q3).
  *   **Degradation = Standard GT:** Shows partial adherence reduces to Bayesian games with type uncertainty (Q4, Q5).
  *   **Preempting "Should":** Forces a definition and contrasts with what CDT can already do with correlation (Q6).
  *   **Demanding Novel Predictions:** Asks for non-PD examples and highlights potential underdetermination (Q7, Q8).
  *   **Falsifiability:** Closes by demanding a potential failure case to prevent moving goalposts (Q9).

  These questions avoid rehashing old thought experiments by focusing on the *mechanics*, *stability under variation*, and *limits* of the view, pushing the guest beyond rehearsed talking points into the foundational tensions. Good luck with the interview!
