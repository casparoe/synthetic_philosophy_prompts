prompt: |-
  Me and my flatmate got into a massive argument last night about Marx and automation, and now I've agreed to give a paper on it at reading group next week. Help me build a Q&A prep sheet.

  My thesis: the "fragment on machines" bit in the Grundrisse keeps getting read as predicting that living labour gets expelled from production until value and profit break down. I think the real limit on automation isn't set by what machines can do but by what I've started calling the repair floor — the irreducible mass of living labour needed per unit of machine-time to keep fixed capital actually functioning as capital: maintenance, calibration, integration, data curation, retraining. Marx was picturing durable hardware; ML-era capital rots fast, so the repair floor can grow even while direct production labour collapses, which is why the "fully automated factory" never quite arrives and why the profit rate doesn't just fall off a cliff.

  Audience is a Marxist political economy reading group: two value-form people (Heinrich-ish, allergic to any talk of labour as a substance congealed in the commodity), one analytically trained Marxist economist who will definitely cite the Okishio result that any cost-reducing innovation raises the general rate of profit at constant real wages, and three labour historians / STS types who hold the Noble line — that automation got adopted for control of the shopfloor, not because it was more productive.

  Give me the objections in the order they'll actually come, each phrased the way that sub-group would phrase it, with a two-minute-ish reply and a note on where my reply is soft. What should I concede up front, what do I have to hold, and what's the one question I'm praying nobody asks.
