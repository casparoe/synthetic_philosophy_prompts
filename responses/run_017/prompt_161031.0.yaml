answer: |-
  ### The Address
  (Approx. 980 words; spoken pacing: just under 7 minutes)

  Good morning. We begin this week together in this room—students, families, teachers, all of us—not by looking backward, but by agreeing on what we owe one another moving forward. What I say today isn’t about any single moment or message. It’s about who we are when things get hard. It’s about the contract we sign with each other just by walking through these doors.

  First: hands are for building, not breaking. In this building, no one gets to put their hands on another person to settle a disagreement, full stop. That isn’t a rule; it’s a promise we make to keep each other safe. Safety isn’t negotiable. It’s the ground we stand on. If that ground cracks, everything else falls through. So hear this clearly: if you feel pushed to the edge, walk away. Find a teacher, a counselor, an adult you trust. Let them hold that space for you. But do not answer hurt with hurt. That doesn’t end anything. It only borrows trouble against tomorrow.

  Second: not every wound needs a spotlight. Some things feel too big to carry alone, I know. But when we take a private hurt and make it public fuel—when we hand it to the crowd or the crowd online—we don’t heal it. We change it. We turn something that could have been settled face-to-face into a storm that blows down doors. And storms don’t just hit one house. They flood the whole neighborhood. So here’s our pact: if you’ve been wronged, don’t perform it for an audience. Don’t turn your pain into a show. Bring it to someone who can actually help mend it—not amplify it. Bring it to me. Bring it to our counselors. Bring it to your teachers. That’s why we’re here. But bringing it to the gallery? That doesn’t right a wrong. It builds a stage where everyone loses.

  Now, I know what some of you might be thinking: *If I walk away, won’t they think I’m weak? If I don’t shout it, won’t they forget it happened?* Let me speak plainly. There is no courage in a swung fist. There is no honor in a public shaming. But strength? Strength looks like this: looking someone in the eye and saying, “What you did isn’t okay, but I won’t trade my future for this moment.” Strength is knowing your worth isn’t for someone else to give or take. It’s yours. It’s in your bones. And when you walk away from a fight—not because you fear them, but because you respect yourself too much to sink to it—you aren’t giving anything up. You’re claiming something bigger. You’re saying, “I answer to myself.” *That* is power. *That* is how you make people remember your name for the right reasons.

  And to every young person here: when you choose restraint, you’re not just protecting yourself. You’re protecting this place. You’re keeping it whole for the friend beside you, the teammate counting on you, the student who walks these halls years after you’re gone. Our school isn’t made of bricks. It’s made of choices—your choices. Every time you refuse to turn a spark into a fire, every time you handle hurt with hands that don’t strike and words that don’t scorch, you lay another stone in a foundation that outlasts us all. That’s how legacies get built. Not by winning battles, but by refusing to start wars.

  Parents, families—you’ve trusted us with what matters most. I know the instinct to guard your child’s standing is fierce and deep. It lives in my blood too. But here’s what I ask: help us teach them that true standing isn’t taken in the hallway or the comment section. It’s earned in quiet classrooms, on rainy practice fields, in moments where they stand up not by pushing others down, but by lifting this community up. Help us show them that restraint isn’t surrender. It’s strategy. It’s how you win a future worth having.

  Teachers, staff—you hold the line every day. When tension rises, you are our first responders. Model what we ask: intervene early, listen deeper. Don’t let silence feel like permission. And students—this only works if you lead. You know the difference between calling out and calling in. You know the difference between defending yourself and destroying trust. So choose. Choose to be the one who cools the heat. Choose to be the one who says, “Not here. Not us.” Not because it’s easy. Because it’s worthy of you.

  We won’t get this perfect. We will stumble. But when we do, let’s pull each other up, not apart. Let’s settle our debts to each other with hands open, not closed. Let’s leave no one stranded in their hurt, but never feed the fire that burns us all. This is our school. Let’s build it strong enough to shelter every dream in this room. I believe in us. Now let’s get to work.

  ---

  ### What Is Carrying the Weight
  - **"Hands are for building, not breaking"**: Sets non-negotiable safety for all while avoiding moral judgment. The "full stop" language signals authority without shaming backgrounds where physical defense is normative.  
  - **"Don’t perform it for an audience"/"Bring it to someone who can actually help mend it"**: Prescriptively targets public escalation ("the feed") by contrasting it with solutions-focused reporting. The word "perform" implicitly critiques victimhood dynamics without naming them.  
  - **"Strength is knowing your worth isn’t for someone else to give or take"**: Anchors dignity-culture values while validating honor sensibilities. The reframing of restraint as "claiming something bigger" pays the "debt to standing" idea—making it active, not passive.  
  - **"Restraint isn’t surrender. It’s strategy"**: Speaks directly to honor-preferring families by framing non-retaliation as tactical strength. "Strategy" implies agency, avoiding "cowardice" implications.  
  - **Omissions doing heavy lifting**: No mention of apologies (sidesteps third-party vs. personal apology debates); no "healing" rhetoric (avoids victimhood triggers); no "ignore it" advice (would insult honor contexts).  

  ---

  ### Lines I Tried and Cut  
  1. *"We must rise above petty conflicts"* → **Failed for honor-preferring families**: "Petty" dismisses legitimate grievances; "rise above" implies superiority.  
  2. *"Your feelings are valid, but don’t let them define you"* → **Failed for victimhood-preferring students**: "But" negates validation; "don’t define you" feels like silencing.  
  3. *"Real strength needs no audience"* → **Failed for dignity-preferring staff**: "Needs no audience" could imply those reporting harm are insecure—undermining institutional responsibility.  

  ---

  ### If Someone Pushes Back Afterward  
  **To a father who says, "You taught my son to take it"**:  
  *"No, sir—I taught him that his future is too valuable to be decided in a hallway."*  
  *(Focuses on agency and long-term stakes, validating protective intent while upholding the standard.)*  
    
  **To a student who says, "You told me to shut up"**:  
  *"I told you not to hand your pain to people who can’t fix it—so we can actually fix it together."*  
  *(Distinguishes between suppression and strategic escalation; emphasizes collective repair.)*
