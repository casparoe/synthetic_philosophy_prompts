prompt: |-
  Me and two colleagues just landed a small three-year grant to run a working group on something we've been loosely calling the epistemology of heuristic arguments, by which we mostly mean the presumption of independence: when you're reasoning about a system you can't fully model and you treat some pile of events as independent because you don't know of any mechanism linking them, what exactly are you entitled to conclude, and when does that move quietly turn into self-deception? The composition of the group is me (formal epistemology / phil math), an analytic number theorist who is sympathetic but will only come to every other meeting, and someone from a risk-analysis shop who mostly cares about tail estimates for things like simultaneous infrastructure failures or multiple safeguards holding at once. Our money is tiny: visitors, a couple of two-day workshops, no postdoc. We want the output to be something a practioner could actually use — a checklist, or an audit procedure, or at minimum a sharpened set of distinctions — not another survey paper, and definately not a bibliography.

  Let me sketch the candidate lines of work as we've listed them so far, because I want you to push back on the list and not just rank it. (1) The saturation rule: my hobby-horse. The idea is that ignoring a dependency is licensed only if restoring it would move the answer by less than the model's own demonstrated error on some nearby case where the truth is known — so the presumption gets cashed out as a testable bookkeeping condition rather than a vibe. (2) First-order versus second-order use: does the reliability of an independence heuristic track whether you're using it to get a mean versus a variance or a tail? In the prime case the naive random model gets counts roughly right and apparently gets the fluctuations wrong, and I want to know whether that's the deep fault line or whether the real distinction is between rigid constraints the model violates outright (like a number's being divisible by three) and soft correlations it merely averages over. (3) A case zoo: assemble a few dozen worked cases where the outcome is known, sorted by how the heuristic performed — right answer, right order but wrong constant, right for the wrong reason, qualitatively wrong including flipped sign — and then score candidate licensing rules against that sorting. This feels unglamorous and might be the thing everything else depends on. (4) The tail asymmetry: when the target is a conjunction of many rare events, independence makes it exponentially small, so the presumption seems to do enormous work precisely where it's least checked; is there a principled reason to reverse the default there, and does any of the number-theory evidence speak to it at all? (5) Is the presumption of independence a credal state or a convention about which correlations a modeller has priced in — and is that question deep or merely verbal? (6) What I think of as phantom independence: when you randomize along one axis you silently inject structure along another, and I'd like a general diagnostic for which axis a model has quietly structured. (7) The transfer question: in number theory you eventually get theorems, so a heuristic gets graded; in the risk cases ground truth basically never arrives. How much of the number-theory lesson survives the move, and is this the question that should come first because if the answer is nothing, our whole project collapses?

  What I want is a defended agenda, not an overview. Rank these — or tell me which of them collapse into each other, which are muddled as I've stated them, and what I'm leaving out — against explicit criteria: which questions are upstream of which, which are tractable in three years for a group with our mix and no compute, which are already well covered by people we haven't read, and which would change what some outside field actually does. Be honest about the trade-offs between those criteria rather than pretending they all point the same way, tell me what evidence or result over the next two years would move an item up or down the list, and flag anything where I'm obviously just reinventing something. Also tell me if the whole framing of a usable checklist is the wrong deliverable for this group.
reasoning: |-
  Okay, the user has shared their detailed project plan for a working group on the epistemology of heuristic arguments, focusing particularly on the presumption of independence. They've outlined seven potential lines of work and want me to critically evaluate and rank them against specific criteria.

  This is a fascinating interdisciplinary project bringing together formal epistemology, analytic number theory and risk analysis. The core question - when can we legitimately treat events as independent without knowing mechanisms - has deep implications across many fields. They're explicitly asking for a defended agenda rather than just an overview.

  Looking at their seven proposed lines of work:
  (1) Saturation rule - a testable condition for ignoring dependencies
  (2) First vs second-order use - does heuristic reliability depend on what we're estimating?
  (3) Case zoo - collecting real examples to test theories against
  (4) Tail asymmetry - special problems with rare events
  (5) Nature of presumption - is it about belief or modeling conventions?
  (6) Phantom independence - unintended structure from randomization
  (7) Transfer question - how well do number theory insights apply to risk domains?

  I need to evaluate these against their criteria: upstream dependencies, tractability in 3 years with their resources, novelty versus existing work, and practical impact. The deliverables should be practitioner-focused tools like checklists, not just academic papers.

  The project faces real constraints - small budget, limited meetings with the number theorist, no postdoc. This means computationally intensive work or massive literature reviews aren't feasible. The case zoo (3) might be more important than they realize since it could anchor other work. The transfer question (7) is crucial - if number theory insights don't apply to risk analysis, their whole project could stumble.

  Their concern about "phantom independence" (6) is particularly insightful - randomization often introduces new hidden structures. This connects to deep issues in modeling where fixing one problem creates others.

  I should be honest about trade-offs. For example, the case zoo (3) is labor-intensive but foundational, while the saturation rule (1) could be developed faster but might need the case zoo for validation.

  They might be underestimating relevant work in reliability engineering and decision theory. I should flag potential reinventions while acknowledging that fresh perspectives from number theory could add real value.

  The checklist deliverable makes sense but only if grounded in concrete cases. Abstract principles alone won't help practitioners. The case zoo should probably come first to provide that foundation.

  For the agenda, I'll prioritize based on what must come first, what leverages their unique team, what produces actionable outputs, and what addresses core risks to the project's viability. The transfer question (7) and case zoo (3) seem most critical initially, followed by the saturation rule (1) and tail asymmetry (4).
answer: |-
  Here’s a critical agenda ranking based on your constraints, goals, and the need for defensible prioritization. I’ve grouped/clarified items, flagged overlaps, and anchored rankings to your criteria: **upstream dependencies, tractability with resources, novelty, and potential for practical impact**. The trade-offs are stark—novelty often conflicts with tractability, and upstream work delays outputs but enables coherence.

  ### Ranked & Revised Agenda (With Rationale)
  1.  **(3) Case Zoo + (7) Transfer Question**  
      **Rank:** Non-negotiable first priority.  
      **Why:**  
      - **Upstream:** Everything depends on this. Your "sharpened distinctions" and "checklist" *require* a shared evidence base. Without concrete cases, (1), (2), (4) are untestable speculations, and (5)-(6) become abstract.  
      - **Tractable:** Perfect for your team. The number theorist provides curated math cases (e.g., prime gaps, Cramer model failures). The risk analyst provides infrastructure/failure cases (e.g., power grid cascades, safety system dependencies). You systematize scoring (heuristic performance levels). Low cost: mostly curation and workshop discussion.  
      - **Novelty:** Assembling *cross-domain* cases, scored uniformly, is underexplored. Standard examples exist in silos (e.g., finance copulas, number theory heuristics).  
      - **Practical Impact:** The scored case set *is* the foundation for your audit procedure. Practitioners need "here’s how similar heuristics failed/succeeded."  
      - **Clarification:** Merge with (7). The "transfer" question is answered *by* building the zoo: "What math insights survive?" becomes "Which math failure modes appear in risk cases?"  
      - **Reinvention Risk:** Low. Case studies exist, but not cross-domain taxonomies focused on independence traps.

  2.  **(4) Tail Asymmetry + (2) First/Second-Order Use**  
      **Rank:** Critical second phase.  
      **Why:**  
      - **Upstream:** Informs (1) and the checklist. Tail risks are the risk analyst’s core concern and where independence is most dangerous.  
      - **Tractable:** Leverages the Case Zoo. The number theorist (even part-time) is key: theorems on extreme gaps (e.g., Maier’s Theorem on prime k-tuples violating independence) show *why* tails misbehave. Risk analyst provides real-world tail cases (e.g., "black swan" correlations in failures).  
      - **Novelty:** "Is the deep fault line mean vs tail (as in primes) or hard vs soft constraints?" is underexplored formally.  
      - **Practical Impact:** Highest. A "reverse the default for tails" rule or diagnostic (e.g., "When targeting P(∩A_i), assume dependence unless proven otherwise") is actionable for risk practice.  
      - **Clarification:** (2) and (4) are deeply linked. Tails *are* where second-order (variance) errors dominate. Merge them: "When does independence fail catastrophically for extremes, and are mean/variance failures the best predictor?"  
      - **Reinvention Risk:** Moderate in risk (tail dependence is known), but the *synthesis* with number-theoretic evidence is novel.

  3.  **(1) Saturation Rule**  
      **Rank:** Viable third priority, *if* Cases/Tail work succeeds.  
      **Why:**  
      - **Upstream:** Requires the Case Zoo to define "demonstrated error" and "nearby cases."  
      - **Tractable:** Your formal expertise shines here. Workshop task: Draft saturation tests for cases. Risk analyst ensures tests are operational (e.g., "If adding correlation Δρ changes P(failure) by > 10%, model fails saturation").  
      - **Practical Impact:** The core of your "audit procedure." A testable criterion beats vague "vibes."  
      - **Risk:** Could be too narrow if "demonstrated error" is unavailable in novel risk contexts. Needs the zoo to calibrate.  
      - **Reinvention Risk:** High. Resembles sensitivity analysis (SA) in engineering. **Mitigation:** Position it as *epistemological grounding for SA*—"When is SA *required* to justify independence?"

  4.  **(6) Phantom Independence**  
      **Rank:** Important but niche; tackle if time/resources allow.  
      **Why:**  
      - **Upstream:** Depends on recognizing dependency types from Cases/Tail work.  
      - **Tractable:** Requires abstract modeling (your strength). Diagnostic likely involves symmetry/constraint analysis (e.g., "Randomizing node failures injects topology dependence").  
      - **Practical Impact:** Useful for modelers (e.g., "Your randomization over components implies spatial dependence").  
      - **Reinvention Risk:** High. Overlaps with "unintended consequences" in systems engineering and causal discovery. **Mitigation:** Focus on *diagnostics from randomization*, not general causal inference.

  5.  **(5) Credal State vs Convention**  
      **Rank:** Defer or reframe.  
      **Why:**  
      - **Muddled as Stated:** This *is* likely verbal unless tied to prescriptive rules. Philosophers (e.g., Williamson on credal nets) debate it endlessly with little practitioner uptake.  
      - **Reframe:** Embed it in the checklist: "Does your model *assert* independence (credal) or *omit* dependence links (convention)? If convention, what priced-in correlations exist?" Makes it operational.  
      - **Tractability:** Abstract debates drain time. Only address if Cases reveal it’s pivotal.  
      - **Reinvention Risk:** Very high (see literature on "ignorance" in probabilistic logic).

  ### What You’re Missing & Critical Trade-offs
  - **Missing: "Dependency Archetypes" Framework:** From the Case Zoo, extract recurring *types* of missed dependencies (e.g., *causal chains*, *shared resource bottlenecks*, *hidden symmetries*). This bridges math/risk and structures the checklist.  
  - **Tractability vs. Novelty Trade-off:** (3)/(7) is tractable but less "sexy." (6) is novel but hard. Prioritize (3)/(7) because failure here dooms the project.  
  - **Upstream vs. Impact Trade-off:** (4)/(2) has high impact but depends on (3). Don’t sacrifice the foundation for quick wins.  
  - **Resource Allocation:** The part-time number theorist is best used on (3) (curating math cases) and (4) (tail theorems). Don’t waste them on (5) or (6).  
  - **Evidence That Changes Rankings:**  
    - If **Year 1 Case Zoo** reveals all math insights transfer poorly to risk, pivot to (4) as the core.  
    - If **Tail Analysis** shows mean/variance isn’t the key fault line, simplify (2).  

  ### Is the "Checklist" Deliverable Viable?
  **Yes, but only if anchored in the Case Zoo and Tail work.** An abstract checklist will be ignored. Build it as:  
  1.  **Taxonomy:** From Cases, list common independence pitfalls (e.g., "Ignored shared stressor," "Assumed symmetry breaks constraint").  
  2.  **Tail Alarm:** "For conjunctions of rare events, independence is suspect without mechanism; default to weak dependence bounds (see Saturation Rule)."  
  3.  **Saturation Test:** "Can plausible dependence shift the result beyond model error margins? If unknown, run sensitivity scan."  

  ### Reinvention Flags
  - **Saturation (1):** Sensitivity Analysis (SA) is standard in risk. Your angle: SA as an *epistemic requirement*, not just a tool. Cite SA literature but frame it as justificatory.  
  - **Phantom Independence (6):** Resembles "side-effect dependencies" in randomized algorithms. Acknowledge, but stress your focus on *heuristics in non-algorithmic settings*.  
  - **Credence vs Convention (5):** Well-trodden; only engage if Cases demand it.  

  ### Final Agenda Recommendation
  **Year 1:** Build the **Cross-Domain Case Zoo (3/7)**, scoring heuristic performance. *Output: Draft taxonomy of failure modes.*  
  **Year 2:** Analyze **Tail Asymmetry & First/Second-Order Failures (4/2)** using Zoo cases. *Output: Tail-risk diagnostic rules.*  
  **Year 3:** Develop **Saturation Rule (1)** and **Checklist** integrating Zoo/Tail insights. *Output: Practitioner audit protocol.*  

  Drop (5) unless emergent from cases; address (6) only if critical examples arise. This maximizes coherence, leverages your team, and delivers a tool that bites.
