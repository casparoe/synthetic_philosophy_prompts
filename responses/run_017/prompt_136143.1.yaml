prompt: |-
  I do a 25-minute explainer slot at my paper once a month — whiteboard, and the room is reporters and editors who've had one stats class and zero philosophy. Mine's coming up and I want to spend it on the indicative / counterfactual distinction, because our copy is stuffed with lines like if the agency had acted sooner the spill would've been half the size, and nobody in the building can say what makes one of those true and another not.

  Don't explain it to me, plan the thing. What has to land first — that the two aren't just tensed versions of each other, that the counterfactual isn't going to get it's truth from what actually happened, or something else I haven't thought of — and why does the rest hang off that? Which one pair of sentences should carry the whole 25 minutes? I'm guessing it needs to be a case where the indicative is perfectly assertable and the counterfactual is flatly false, and it should probably NOT be one where the room can shrug and say well, anything's possible. My misconception list so far: that the difference is really just subjunctive grammar, that a counterfactual is true when the consequent is probable given the antecedent, and that you check one by holding the world fixed and changing only the antecedent. Where in the sequence does each get headed off, and which one am I missing that actually matters more than those? Also: what do I flatly refuse to get into at this level — possible-worlds and similarity-of-worlds machinery, the business about a conditional's probability being a conditional probability? — and say out loud that I'm skipping it. Last thing: one question I can put to the room at minute 22 that tells me whether they got the distinction or just absorbed the vibe.
reasoning: |-
  Okay, let's tackle this user's request. They need a 25-minute explainer for journalists about the indicative/counterfactual distinction. First, I need to understand their main pain points: reporters often write statements like "if the agency acted sooner, the spill would've been smaller" without knowing what makes such claims true or false. The audience has minimal stats and no philosophy background, so simplicity is key.

  The user wants to know what foundational concept must land first. I think starting with the idea that indicative and counterfactual conditionals aren't just different tenses but fundamentally different in meaning. If the audience conflates the two, everything else will fail. Using a clear example where the indicative is true but the counterfactual is false could make this stark. Maybe something like the "rain in Tucson" scenario—indicative "if it rained, the streets are wet" vs. counterfactual "if it had rained, the streets would be wet." The latter is false if sprinklers are the real cause.

  For the core pair of sentences, the Tucson example seems solid. It's relatable and avoids probabilistic shrugs. I should address common misconceptions early. The grammar myth (subjunctive=counterfactual) needs debunking right after defining the terms. Then, tackle the probability error (counterfactual truth ≠ probable consequent) with a coin flip example. Finally, clarify that counterfactuals require more than just changing the antecedent—context matters.

  What to avoid? Definitely possible worlds and similarity metrics. Also, conditional probability is too advanced. Explicitly state these are skipped to keep focus. For the checkpoint question, asking them to evaluate "If NASA had launched yesterday, the rocket would have blown up" based on a scenario where the launch was scrubbed due to a known defect. The correct answer hinges on understanding that the defect makes the explosion certain, thus true.

  I should structure the talk: start with the problem in their copy, define the conditionals with examples, present the core Tucson pair, debunk myths, then discuss truth conditions minimally. The checkpoint question at minute 22 tests if they grasp that counterfactuals depend on background facts, not just imagination. Time management is crucial—5 mins per section, with the core taking 8 minutes. Emphasize that counterfactuals aren't about what did happen but what would have under different circumstances, using real reporting examples they recognize.
answer: |-
  Here's a battle plan for your 25-minute whiteboard session, designed for maximum impact on skeptical journalists:

  **Core Objective:** Equip reporters to spot *and critically assess* counterfactual claims in their copy by understanding they are fundamentally different beasts than indicatives, requiring different kinds of evidence/justification.

  **The Non-Negotiable Foundation (Minute 0-5):**
  *   **What MUST Land First:** Indicative and Counterfactual conditionals are **fundamentally different kinds of statements**, making *different claims* about the world. They are **NOT** just grammatical variants (past/present tense + subjunctive mood).
  *   **Why:** If the room thinks it's just fancy grammar ("would have" vs. "will"), they'll miss the entire epistemological/truth-conditional chasm. Everything else hinges on them seeing these as distinct tools.
  *   **How:**
      1.  **The Hook (Minute 1):** "Look at this line from our copy last week: *'If the agency had acted sooner, the spill would have been half the size.'* We publish stuff like this constantly. But what *makes* it true? Or false? How do we know? Today, we crack open the difference between 'if' and '*if*'."
      2.  **Define & Contrast (Minute 2-4):**
          *   **Indicative Conditional (IC):** "If P, then Q." (e.g., "If it *rained* last night, the streets *are* wet.") *Concerned with actual events & evidence within our known world.* Explores connections within reality.
          *   **Counterfactual Conditional (CF):** "If P *had been* the case, then Q *would have* happened." (e.g., "If it *had rained* last night, the streets *would be* wet.") *Concerned with hypothetical scenarios differing from actual events.* Explores what *might have been*.
      3.  **Whiteboard:** Two clearly labeled columns: INDICATIVE | COUNTERFACTUAL. List key structural/grammatical cues under each (verb tenses, "would have", etc.) but STRESS: "This isn't *just* about grammar. It's about **what kind of claim** you're making."

  **The Core Pair: Your Workhorse Example (Minute 5-13)**
  *   **The Pair:** "**(IC) If it *rained* last night in Tucson, the streets *are* wet."** vs. **"(CF) If it *had rained* last night in Tucson, the streets *would be* wet."**
  *   **Why this pair?**
      *   **IC is clearly assertable:** It's a standard conditional about evidence (wet streets support rain).
      *   **CF can be FLATLY FALSE:** Imagine Tucson last night: Hot, dry, clear skies. NO rain. BUT... the city ran its massive sprinkler system all night. Streets are soaked.
      *   **No Shrugs:** The streets *are* wet (Q). It *did not* rain (~P). The CF claims rain *would have caused* wet streets. But we know wetness came from sprinklers. The connection implied by the CF (rain -> wet streets) *in that specific dry scenario* is broken. The CF is false, even though the IC form ("If it rained, streets are wet") remains perfectly sensible and the consequent (streets wet) is true.
      *   **Visceral:** Easy to picture. Undercuts the instinct that "if P had happened, Q would have happened" must be true if Q didn't happen or if P->Q seems generally likely.
  *   **Execution:**
      1.  **Present the Scenario:** "Tucson last night: Forecast wrong, bone dry. City ran sprinklers. Streets are drenched."
      2.  **Ask:** "Is (IC) 'If it rained, the streets are wet' true? (Yes! Streets *are* wet, so if rain *was* the cause, this holds. The connection rain->wet is valid *in general*.)"
      3.  **Ask:** "Is (CF) 'If it *had* rained, the streets *would be* wet' true? (NO! We *know* why the streets are wet: sprinklers! Rain *didn't* happen. If it *had* rained (say, a light shower), the sprinklers might still have run, or the rain might have evaporated instantly in the heat. Crucially, the wetness we *actually* see is **not evidence** that rain *would* have caused wetness *last night* in those *actual dry conditions*. The CF asserts a specific causal link *in that hypothetical scenario* that our actual knowledge breaks.)"
      4.  **Whiteboard:** Draw the Tucson scene. List Facts: ~Rain, Sprinklers On, Streets Wet. Show IC TRUE. Show CF FALSE. **HIGHLIGHT:** Truth of CF depends on *more* than just the truth of P and Q or the general link. It depends on *what would have followed* from changing P *in that specific context*.

  **Slaying Misconceptions (Minute 13-18)**
  *   **Sequence & Tackling:**
      1.  **"It's just grammar/subjunctive" (Already tackled in Foundation, reinforce here):** Point back to Tucson. Same basic "if P, Q" meaning *cannot* apply because CF is false while IC is true. The grammatical shift *signals* a shift in the *type of claim*.
      2.  **"CF is true if Q is probable given P" (CRITICAL):** Use a **Coin Flip** example.
          *   *Scenario:* You flip a fair coin. It lands Heads.
          *   *CF:* "If you *had* flipped the coin, it *would have* landed Heads." **FALSE!**
          *   *Why:* Even though it landed Heads when flipped, it *could* have landed Tails. The CF claims certainty ("*would have*") in the hypothetical scenario, but probability was only 50%. **Landing:** CFs often imply necessity or high likelihood *in the hypothetical scenario*, not just probability based on general stats. "Would have" claims more than "might have" or "was likely to have".
      3.  **"Check CF by holding world fixed, only change P" (The Big One):** Use **Tucson again** or a **Preemption** case.
          *   *Scenario (Preemption):* Assassin A is poised to shoot Victim. Assassin B poisons Victim's coffee. Victim drinks coffee, dies instantly. A never shoots.
          *   *CF:* "If Assassin A *had* shot, Victim *would have* died." **TRUE?**
          *   *Why:* Seems obvious? But... **What if we naively "hold the world fixed"**? Victim is *already dead* from poison when A would shoot! If we just "change" A shooting (and leave Victim dead from poison), then A's shot hits a *already dead body*. Does the CF mean A's shot *would have caused death*? In this "fixed world" change, no, death was already caused by B. **Landing:** We *don't* just mechanically change P and leave everything else identical if that leads to absurdity or contradicts the setup. We make the *minimal, coherent changes* necessary to imagine P happening *while respecting causal dependencies and laws*. Here, to imagine A shooting, we likely need to imagine B *not* poisoning first, or the poison not working instantly, otherwise the scenario is incoherent. Figuring out *which* changes are minimal/coherent is the hard part! **This is the core challenge in evaluating real-world CFs.** Stress: It's messy and context-dependent, not a simple substitution.
  *   **The Missing Misconception:** **"Counterfactuals are just about imagination / anything goes."** Head this off *implicitly* through Tucson and Preemption. Stress that plausible CFs require respecting *actual causal structures, laws, and context* ("Given what we know about Tucson's dryness/sprinklers...", "Given the poison worked instantly..."). Good CFs aren't fantasy; they're constrained by reality.

  **What to FLATLY Skip (Say It Loud!)**
  1.  **Possible Worlds & Similarity Metrics:** "We won't dive into the philosopher's toolbox of 'possible worlds' or how to measure which imaginary world is 'closest'. That's powerful, but it's the engine under the hood, not the driver's seat for us today."
  2.  **Probability = Conditional Probability:** "We also won't get into the deep debate about whether the probability of an indicative 'If P, Q' *is* the conditional probability P(Q|P). That's fascinating, but a different and complex topic." (Mentioning it by name validates the curious but draws a line).

  **The Checkpoint Question (Minute 22)**
  *   **Scenario:** "NASA scrubs today's rocket launch *because sensors detected a critical fuel valve defect* minutes before liftoff. Engineers confirm: *Had they launched, the defective valve would have caused a catastrophic explosion.*"
  *   **Question:** "You read this line in a draft: *'If NASA had launched the rocket yesterday, it would have blown up.'* **(Assume yesterday's launch attempt was scrubbed for unrelated weather reasons, and the valve defect only developed overnight). Is this counterfactual TRUE or FALSE? WHY?"**
  *   **Why this works:**
      *   The *actual* CF ("launch today -> explosion") is strongly supported (known defect).
      *   The *posed* CF changes the antecedent time ("launch *yesterday*").
      *   **Key Insight:** Yesterday, the critical defect *did not exist* (based on the info given). To evaluate the CF about yesterday, you *cannot* simply transplant *today's* defect state. You must consider the world *as it was yesterday* (no valve defect). Launching yesterday *without* the defect likely *would not* have caused an explosion (absent other issues). Therefore, the CF is **FALSE**.
      *   **What it Tests:** Did they grasp that CF truth depends on the *specific hypothetical scenario* (changing P - launching yesterday), *constrained by the relevant actual context* (no defect yesterday)? Or are they conflating it with the true CF about *today*, or just thinking "rockets blow up sometimes"? This forces them to see the context-dependence and avoid the "hold everything fixed" error.

  **Structure Summary:**
  1.  **(0-5 min) Foundation:** IC vs. CF = Different Claims, Not Just Grammar. (Tucson intro).
  2.  **(5-13 min) Core Pair:** Tucson Example - IC True / CF False. *Why* CF is false. **THIS IS THE CENTERPIECE.**
  3.  **(13-18 min) Slay Myths:** Grammar (reinforce), Probability (Coin Flip), "Hold World Fixed" (Preemption/Tucson deep dive).
  4.  **(18-22 min) Truth Conditions (Minimalist):** Emphasize context, minimal coherent changes, causal structure. Contrast with IC evidence-based truth. **Reiterate Tucson & Preemption lessons.**
  5.  **(22 min) Checkpoint Q:** NASA Launch (yesterday vs. today defect).
  6.  **(23-25 min) Wrap & Relevance:** "So next time you see 'if they had acted, X would have happened', ask: What's the *actual* context? What *minimal, coherent changes* does this imply? Is there evidence for *that specific hypothetical chain*? Don't assume it's true just because the outcome was bad or the antecedent seems linked. This distinction is crucial for holding claims accountable." **Show a real example from their recent copy.**

  **Key Mantra to Repeat:** "Counterfactuals aren't about what *did* happen or what *is* likely generally. They're claims about what *would* have happened *in a specific, altered scenario*, and that requires thinking hard about *that scenario* based on what we *actually* know." Good luck! This is a fantastic topic for journalists.
