answer: |-
  ## Municipal Code of Conventional Obligations (Draft Byelaw)  
  **Section 7: Visitor Compliance with Established Conventional Norms**

  **1. Definitions:**  
  (a) "Visitor" denotes any person physically present within the Municipal Jurisdiction for a period not exceeding 365 consecutive days.  
  (b) "Established Conventional Norm" (ECN) denotes any observable, recurring pattern of behaviour engaged in by a statistically significant majority of Permanent Residents for the purpose of resolving common coordination problems, including but not limited to queue formation, pedestrian crossing etiquette, expressive gratitude rituals (e.g., 'tipping'), and forms of salutation.  
  (c) "Coordination Problem" denotes any recurring social scenario requiring mutual predictability of action amongst multiple agents to achieve a collectively optimal outcome (e.g., orderly service, safe road crossing, predictable service sector remuneration).  

  **2. Obligation of Visitors:**  
  (a) Visitors are morally obligated to conform to all applicable ECNs during their presence within the Municipal Jurisdiction.  
  (b) Conformance requires the Visitor to replicate the observable behaviour constituting the ECN with reasonable fidelity.  
  (c) The obligation arises from the Visitor’s *de facto* participation in the coordination problem resolved by the ECN and their consequent duty to uphold the collective solution established by the Permanent Resident majority.  

  **3. Substituted Compliance:**  
  (a) Where a Visitor demonstrates that a substantially analogous conventional norm exists and is actively practised within their jurisdiction of Permanent Residence ("Home Convention"), they may discharge their obligation under Clause 2 by performing the Home Convention.  
  (b) "Substantially analogous" requires the Home Convention to resolve the same *type* of coordination problem as the local ECN, though the specific behavioural form may differ (e.g., bowing substituted for handshaking).  
  (c) The burden of proof regarding the existence and substance of the Home Convention rests solely with the Visitor.  

  **4. Exclusions:**  
  (a) This Byelaw does not apply to conventions pertaining solely to religious observance or private familial rituals.  
  (b) The obligation under Clause 2 ceases immediately upon the Visitor’s permanent departure from the Municipal Jurisdiction.  

  **5. Jurisdiction:**  
  (a) This Byelaw applies within all geographical boundaries of the Municipal Jurisdiction.  
  (b) The determination of Visitor status under Clause 1(a) is administrative, based on self-declaration supplemented by objective indicators (e.g., temporary accommodation, lack of local taxation records).  

  ---

  **Explanatory Memorandum: Draft Byelaw Section 7**

  **1. Rationale:** The Municipal Council recognises that social harmony and efficient public interaction depend critically upon predictable adherence to Established Conventional Norms (ECNs). These ECNs represent collective solutions to recurrent Coordination Problems, where no single behavioural pattern possesses inherent moral superiority, but mutual adherence to *any* predictable pattern yields optimal outcomes (e.g., FIFO queueing ensures equitable service distribution; local pedestrian light signals maximise safety through predictability). Visitors, by entering the jurisdiction and deriving benefit from its orderly functioning (e.g., using roads, accessing services), become *de facto* participants in these coordination problems. Failure to adhere to the locally established solution constitutes a moral failing, as it introduces unpredictability, undermines the collective investment in the convention, and potentially triggers coordination failures (e.g., a lone Visitor rigidly awaiting a 'Walk' signal at an otherwise clear intersection impedes efficient traffic flow established by local crossing norms).

  **2. Moral Basis of Obligation:** The obligation arises not from the intrinsic righteousness of a specific act (e.g., queuing *per se*), but from the imperative to match the predictable behaviour of the majority cohort (Permanent Residents) who established the convention. This matching is essential for maintaining the solution to the coordination problem. The Visitor’s physical presence constitutes acceptance of the prevailing social contract governing these interactions. Arguments suggesting a Visitor who "takes no benefit" (e.g., avoids queues, does not use services) or "declines to participate and leaves" are therefore invalid. Mere presence within the jurisdiction implies exposure to and potential disruption of coordination systems (e.g., road networks), generating the obligation. Conceding exemption based on non-participation would render the Byelaw unenforceable and undermine its purpose. Similarly, conventions like 'tipping' function primarily as wage-supplement mechanisms within specific service sectors. While economically problematic, the *conventional obligation* for Visitors arises from their participation in the service interaction where this wage-supplement ECN is operative. Non-compliance directly undermines the expected remuneration structure adhered to by others.

  **3. Substituted Compliance (Clause 3):** Recognising potential cultural friction, Clause 3 introduces the doctrine of Substituted Compliance. This allows Visitors to discharge their obligation by performing the behavioural norm from their Home Convention, provided it addresses the *same functional coordination problem*. This balances respect for diverse cultural practices with the core requirement of behavioural predictability within the coordination scenario. For instance, substituting a respectful bow for a handshake in greeting fulfils the same coordination function (establishing mutual recognition and non-hostility). The critical factor is achieving the coordination outcome, not the specific gesture. The burden of proof ensures this clause is not abused by spurious claims of exotic conventions.

  **4. Practical Application & Jurisdiction:** Enforcement will focus on education and mediation, emphasising the coordination rationale. Visitor status determination under Clause 1(a) and 5(b) is necessarily pragmatic. While a 365-day threshold provides a clear limit, administrative assessment will consider intent and integration indicators (e.g., enrolment in permanent housing/employment). Edge cases (e.g., delivery drivers operating daily across the boundary, long-term temporary workers) will be assessed individually, guided by the principle of preventing coordination disruption through unpredictable behaviour. The exclusion (Clause 4a) ensures the Byelaw respects fundamental freedoms while targeting public, coordination-centric conventions.

  **5. Expected Outcomes:** This Byelaw aims to formalise the implicit moral duty of Visitors, fostering smoother integration, reducing social friction caused by unpredictable behaviour, and safeguarding the collective investment Permanent Residents have made in establishing functional ECNs. It provides a clear, ethically grounded framework for Visitor conduct within our jurisdiction.
