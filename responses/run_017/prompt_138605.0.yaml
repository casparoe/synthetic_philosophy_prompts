answer: |-
  ### Scenario
  At a small manufacturing firm, the HR manager must decide between two equally qualified internal candidates—Lee and Sam—for a promotion. During the initial review meeting, the CEO offhandedly suggests, "We should consider Lee first; their file is on top." This order was random (the files were stacked haphazardly). After thorough discussion, the HR manager selects Lee. Six months later, when Lee makes a costly error losing a key client, the CEO pressures the HR manager to demote Lee. The HR manager refuses, arguing Lee deserves patience given their overall record. This costs the HR manager their annual bonus, which was tied to client retention.

  ---

  ### (1) Test Results  
  - **History test: BIAS.** The judgment (hiring Lee) originated from an irrelevant factor: the random file order. Everyone agrees file order isn’t a reason for hiring decisions. The CEO’s suggestion raised Lee’s salience artificially, unrelated to merit.  
  - **Steady-state test: PREFERENCE.** The judgment is stable: the HR manager defended Lee against pressure, acted consistently with their "second chances" ethic (also applied to others), and sacrificed their bonus. This shows endorsement beyond convenience.  

  ### (2) The Feature Doing the Work  
  **Arbitrary priming.** The random file order triggered an initial anchor (consider Lee first), which seeded a preference later reinforced by reasoned deliberation.  

  ### (3) If the Feature Is Removed  
  Without the arbitrary file order, the HR manager evaluates both candidates neutrally from the start.  
  - **Result:** The steady-state test *still* returns "preference" if they later defend their choice at cost. But the history test now returns "preference" too—no tainted origin. The case collapses into an **ordinary preference**.  

  ### (4) Reply from a Skeptic & Why It Fails  
  **Skeptic’s claim:** "This ‘preference’ is just a bias rationalized after the fact. The arbitrary start poisoned the process."  
  **Why it fails:** The costly action (forfeiting the bonus) proves the judgment isn’t *merely* post-hoc rationalization. Rationalizers avoid tangible losses; here, the HR manager pays a price precisely *because* they hold the conviction deeply. The skeptic cannot explain the sacrifice without conceding genuine endorsement.  

  ---

  ### Defeating the Mirror Test  
  **Mirror test result:** If files had been stacked with Sam on top, the HR manager likely would have chosen Sam initially. This suggests the judgment depends on arbitrary origins—*but* this only confirms the history test’s "bias" verdict. It says nothing about the *current* conviction’s authenticity.  
  **Why this shows the mirror test is flawed here:** It conflates *origin* with *current commitment*. The test is useful for detecting historical bias but irrelevant to whether a view is now deeply held. In this case, it returns "bias" while ignoring the steady-state evidence of preference. **Verdict:** Your mirror test is incomplete, not "bad"—it answers a different question (origin vs. present endorsement).  

  ---

  ### Why the Case Works  
  - **Commitment:** The tests cleanly diverge: history says bias (arbitrary trigger), steady-state says preference (costly defense).  
  - **No cheating:** The distorting factor (file order) is uncontestedly irrelevant. The action (losing the bonus) proves commitment without self-deception. The setting is mundane.  
  - **The distinction it reveals:** A judgment can *originate* from bias yet become a authentic preference through reflection, consistency, and costly adherence. Moral psychology isn’t binary; origins and endurance are separate dimensions.  

  ### Why Your Colleague’s View Fails  
  Your colleague reduces "preference" to views argued *into* others and "bias" to views argued *out* of holders. This case breaks that: the HR manager couldn’t be argued out of their view (suggesting "bias" by the colleague’s definition), yet the steady-state test proves it’s a genuine preference. **The lesson:** Convictions can be resilient *and* well-integrated even with flawed origins—what matters is how they function in a person’s moral ecology, not just their pedigree.  

  ---
  **Final word:** This case succeeds. It shows that dismissing all persistent views as "biases" ignores how humans convert accidents of history into reasoned commitments. Your tests are sound—but they measure different things. Keep both.
