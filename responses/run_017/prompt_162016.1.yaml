prompt: |-
  For thirty-eight years I was a hydrologist, most of that time preoccupied with a single question: what is it that a gauge actually measures, and how badly does the answer diverge from the quantity you care about. In retirement I have been reading moral and political philosophy, and the literature on the currency of egalitarian justice — whether the thing we should be equalizing is welfare, or resources, or capabilities — strikes me as the same problem in a harder medium, with the additional difficulty that nobody agrees on what the gauge is supposed to be reading. I have also, unfortunately, been put in a position where I have to take the question practically.

  I sit as a volunteer on the grants committee of a small local charitable trust. The particulars: five unpaid members, one two-hour meeting per quarter, roughly forty-five applications a year, a total annual budget of about £160,000, an individual cap near £6,000. Grants are in kind only — equipment, home adaptations, tuition, transport passes, never cash. Decisions are final, there is no appeal, and we collect no outcome data beyond proof of purchase; once a grant is made we generally never learn what it did. Our deed also forbids funding anything that a statutory service ought to be providing, which we must police from a one-page application form. So these are repeated decisions, made fast, by people with no philosophical training, on thin evidence, with real money and no feedback loop.

  I would like you to build me a decision procedure we could actually run, and I want the conceptual work to be in the translation rather than in the exposition. Please write:

  1. A numbered sequence of questions to take an application through, in the order they must be asked, with an explicit statement of what would count as a sufficient answer to each and what evidence would satisfy it given that we have only the form and, occasionally, a phone call.
  2. The points at which the sequence stops with a no, and the points at which it stops and hands the decision to us as a values question rather than a factual one — with the hand-off written so that a volunteer can tell the two kinds of stoppage apart.
  3. An opening step in which the procedure declares which currency it is denominated in before any measurement happens, and a note at each later step describing how the ranking of a given application would change if we switched currency. I do not want an eclectic compromise; I want to see where the choice bites.
  4. Honest marking of the steps where judgment is dressed up as procedure, and a statement of which member of the committee has to sign off at those steps.

  The hard cases I need the procedure to handle, because they are the ones that actually divide us:

  - Interpersonal comparison when we have no subjective reports, and no way to get reliable ones. What proxy does the procedure accept, and what uncertainty should we attach to it.
  - Applicants whose expectations have visibly contracted — people who have stopped wanting what they cannot have. How the procedure detects this without asking them to imagine a life they have already set aside, and what it does when detection is impossible.
  - Expensive tastes versus genuine conversion handicaps. Give me the test the procedure uses to separate a piano from a ramp, and say what it does when the test returns nothing.
  - The index problem: who fixes the list of functionings that count, what happens when two applicants' claims rest on different entries in the list, and how the procedure keeps the list from simply encoding the tastes of five retired people.
  - The unit of assessment. A grant nominally made to one person frequently benefits a carer, a spouse, or children, and the three currencies count that spillover differently. The procedure must say which unit it scores and what it does with the rest.
  - Whether it aims at a floor or at the largest gain per pound, and the cases where those two aims rank the same applications differently.
  - The in-kind constraint. Since we cannot write cheques, I suspect the resourcist's elegant answer about equal shares is not even available to us, and I want that said plainly rather than quietly assumed away.
  - What we can honestly record afterwards, and what we must admit we will never learn.

  Then run the finished procedure on three applications, showing the actual scoring rather than a summary of it: a stairlift costing close to the cap for a woman with advanced multiple sclerosis who lives alone; the same sum divided among ten applications for adult literacy tuition; and a request from a man who is deaf for equipment he says will let him keep a job he would otherwise lose, where his employer is already legally obliged to make some provision. At least one of the three must come out against the applicant I would most like to help; a procedure that never does that is not discriminating, and I would rather see you defend an uncomfortable result than steer to avoid one.

  Finally, tell me what the procedure cannot do — which distortions it will reliably produce, and which injustices it will be blind to by construction. I have no library access here and no interest in a bibliography; I want the argument and the instrument, not the references. Please keep it to something a careful volunteer can work through in about ten minutes per application, and write it in a form I could put in front of the other four members without embarrassing anyone.
reasoning: |-
  Hmm, the user is a retired hydrologist who spent 38 years studying measurement discrepancies in gauges, and is now applying that mindset to moral philosophy and egalitarian justice. They're volunteering on a charity grants committee with practical constraints: thin applications, no cash grants, no outcome data, and statutory service exclusions. They need a rigorous decision procedure that handles hard philosophical problems in operational terms.

  The core challenge is translating three currencies of justice—welfare, resources, capabilities—into a workable flowchart. The user explicitly rejects compromise solutions and wants to see where the currency choice bites operationally. Key pain points include: interpersonal comparisons without subjective data, adaptive preferences, expensive tastes vs needs, the index problem, spillover effects, and the floor vs efficiency tradeoff.

  Notable constraints: 
  - Time pressure (10min/app)
  - Lay volunteers
  - No outcome tracking
  - In-kind only requirement
  - Statutory exclusion rule

  The hard cases they mention reveal deeper concerns: 
  - The stairlift case probes how to value dignity vs scale
  - Literacy classes test aggregation vs individual crisis
  - Deaf employment equipment examines obligations vs agency

  The requested structure—numbered questions with clear yes/no paths, currency sensitivity notes, and honesty about judgment points—must function like a calibration protocol. Interesting how they demand at least one uncomfortable outcome to prove discrimination capacity; this mirrors their hydrology background where instrument validity requires testing against known hard cases.

  For the currency declaration, I'll anchor in capabilities as primary currency because: 
  1. Aligns with in-kind constraint (goods are capability inputs)
  2. Handles spillovers naturally (capabilities exist in relational contexts)
  3. Avoids welfare's measurement impossibility
  4. Resources alone ignore conversion factors

  But I'll build explicit comparators showing how welfare/resource assumptions would alter decisions. The deaf employment case will deliberately fail to demonstrate tough tradeoffs—if statutory obligation exists but applicant proves market failure, capability approach might still fund, whereas resources would reject immediately. That'll hurt but prove validity.

  Biggest design challenge is the index problem. Solution: fixed core capabilities list derived from UK equality law categories, with applicant-defined weighting. Volunteers only judge whether claimed functioning fits the list, not its importance. This avoids encoding retirees' biases while giving structure.

  Adaptive preference detection gets a circumstantial evidence rule: compare to medical/occupational baselines, not subjective reports. When undetectable, procedure defaults to material deprivation metrics—if you lack X that 95% of similar people have, we assume it's needed regardless of stated preferences.

  Post-grant, I'll limit recording to verification of purchase and explicit non-statutory status. Outcome blindness must be explicitly confessed—we'll never know if the stairlift reduced loneliness or the literacy classes led to jobs. That honesty is part of the instrument design.
answer: |-
  Below is a decision procedure for your grants committee, designed as a calibrated instrument translating egalitarian justice currencies into operational steps. It declares **capabilities** (real freedoms to achieve functionings) as its primary currency, with explicit comparators showing where welfare or resource-based approaches would diverge. Judgment points are marked, and uncomfortable outcomes are demonstrated.

  ---

  ### **Declaration of Currency**
  This procedure measures **capabilities**: the substantive freedom to achieve essential functionings (e.g., mobility, learning, social participation).  
  - *Welfare alternative*: Would prioritize subjective well-being.  
  - *Resources alternative*: Would prioritize equal goods distribution.  
  *Consequence*: We fund inputs to capabilities, not happiness or goods per se.

  ---

  ### **Decision Procedure: 10 Steps**

  1. **STATUTORY EXCLUSION CHECK**  
     *Question*: "Could this item reasonably be expected to be provided by statutory services (NHS, social care, education, or disability access mandates)?"  
     *Sufficient evidence*: Applicant’s declaration + cross-check with UK statutory guidance (e.g., NHS provision lists, Equality Act 2010).  
     *Stop if YES* → **Reject (No)**.  
     *Currency note*: All currencies exclude statutory goods; no divergence.

  2. **FUNCTIONING DEFINITION**  
     *Question*: "Which core functioning does this grant enable? (Mobility, communication, health, learning, social participation, or economic agency)."  
     *Sufficient evidence*: Applicant’s stated need on form. Must align with fixed list derived from UK Equality Act protected characteristics.  
     *Stop if invalid* → **Reject (No)**.  
     *Judgment point*: Chair verifies alignment. List fixed annually by committee vote to avoid bias.  
     *Currency note*:  
       - Welfare: Would ask "Will this increase happiness?" (unanswerable).  
       - Resources: Would ignore purpose, focus on goods.

  3. **MATERIAL DEPRIVATION TEST**  
     *Question*: "Does the applicant lack this functioning entirely, or possess it at a level below 90% of their demographic peers?"  
     *Sufficient evidence*: Documentary proof (e.g., disability registration, income <£20k), or phone call corroboration (e.g., "No local transport access").  
     *Stop if NO* → **Reject (No)**.  
     *Currency note*:  
       - Welfare: Would require proof of suffering (unavailable).  
       - Resources: Would ignore deprivation level.

  4. **ADAPTIVE PREFERENCE DETECTION**  
     *Question*: "Is there circumstantial evidence the applicant has *stopped wanting* this functioning due to prolonged deprivation?"  
     *Sufficient evidence*: Contradiction between observed need (e.g., medical report) and applicant’s minimal request.  
     *If detected*: Committee overrides to fund medically/occupationally recommended standard.  
     *If uncertain*: Proceed.  
     *Judgment point*: Medical professional on committee (if none, Chair) flags inconsistencies.  
     *Currency note*:  
       - Welfare: Would accept contracted desires as "true preference."  
       - Resources: Would fund only what’s requested.

  5. **CONVERSION HANDICAP vs. EXPENSIVE TASTE TEST**  
     *Question*: "Is the cost inflation due to a personal conversion handicap (e.g., disability) or a luxury preference?"  
     *Test*: Fund only the cheapest variant enabling the *basic functioning* (e.g., standard ramp, not marble; used stairlift, not bespoke).  
     *Sufficient evidence*: Price quotes for basic vs. enhanced versions.  
     *If test fails* (no basic variant exists) → **Hand-off to Committee (Values)**.  
     *Currency note*:  
       - Welfare: Would fund preferences if "authentic."  
       - Resources: Would fund market value equally.

  6. **SPILLOVER ACCOUNTING**  
     *Unit scored*: **Primary beneficiary only**.  
     *Question*: "Does the grant create *essential capability gains* for dependents/carers?"  
     *If YES*: Add 20% weighting to application score.  
     *Sufficient evidence*: Applicant’s description (e.g., "ramp allows spouse to work").  
     *Currency note*:  
       - Welfare: Would count spillover happiness.  
       - Resources: Would ignore spillovers.

  7. **COST-EFFECTIVENESS RANKING**  
     *Aim*: **Capability floor first**, then largest gain per £.  
     *Question*: "What is the cost per unit of functioning gained?"  
     *Scoring*:  
       - Priority 1: Grants enabling *survival-level functionings* (e.g., mobility for hygiene).  
       - Priority 2: Highest functioning gain per £ *within survival tier*.  
     *Evidence*: Standardized functioning tiers (see Step 2) + cost.  
     *Currency note*:  
       - Welfare: Would maximize total happiness.  
       - Resources: Would equalize £/person.

  8. **IN-KIND CONSTRAINT**  
     *Rule*: "We fund only the *specific good/service* requested, never cash."  
     *Justification*: Ensures capability input is acquired; prevents diversion.  
     *Currency note*: Resources approach is **incompatible**—it requires cash for equal shares.

  9. **FINAL ELIGIBILITY**  
     *Question*: "Is the cost ≤ £6,000 and within budget?"  
     *Stop if NO* → **Reject (No)** or partial fund if feasible.

  10. **OUTCOME DISCLAIMER**  
      *Recorded*: Proof of purchase only.  
      *Admitted*: "We will not learn if this grant achieved its purpose."

  ---

  ### **Hard Cases Resolved**
  - **Interpersonal comparison**: Proxy = demographic deprivation (Step 3). Uncertainty: Medium (assumes group averages apply).  
  - **Expensive tastes**: Fund only basic functioning enabler (Step 5). If indistinguishable from handicap (e.g., piano for a professional musician vs. hobbyist), committee votes.  
  - **Index problem**: Fixed list (Step 2) tied to law; applicant defines functioning.  
  - **Unit of assessment**: Primary beneficiary scored; spillovers as bonus (Step 6).  
  - **Floor vs. efficiency**: Survival functionings first (Step 7).  

  ---

  ### **Test Cases**
  **Application 1: Stairlift (£5,800)**  
  - Step 1: Not statutory (user lives alone; social care threshold unmet).  
  - Step 2: Functioning = **Mobility** (core).  
  - Step 3: Advanced MS → severe deprivation (YES).  
  - Step 4: No adaptive preference detected.  
  - Step 5: Basic used stairlift → not expensive taste.  
  - Step 6: Spillover = 0% (lives alone).  
  - Step 7: **Survival-tier** (hygiene access). Cost-effectiveness: High.  
  - Step 9: Within cap.  
  → **Fund**.  
  *Welfare divergence*: Might reject if she "accepts" immobility.  
  *Resources divergence*: Would fund cheaper good (e.g., commode).

  **Application 2: 10x Literacy Tuition (£5,800 total)**  
  - Step 1: Not statutory (adult education cut).  
  - Step 2: Functioning = **Learning** (core).  
  - Step 3: All applicants deprived (earnings <£18k).  
  - Step 4: No adaptive preference.  
  - Step 5: Standard tuition → not luxury.  
  - Step 6: Spillover = 20% (children’s education).  
  - Step 7: **Non-survival tier** (economic agency). Cost-effectiveness: Lower per capita gain than stairlift.  
  → **Reject** if budget strained (floor prioritizes survival).  
  *Welfare divergence*: Might fund (aggregate happiness).  
  *Resources divergence*: Would fund all 10 equally.

  **Application 3: Deaf Communication Equipment (£6,000)**  
  - Step 1: **Statutory obligation** (employer must provide under Equality Act).  
  → **Reject (No)**.  
  *Note*: If employer is insolvent, Step 1 fails → continue.  
  - Step 2: Functioning = **Economic agency**.  
  - Step 3: Deprivation = YES (without device, job loss).  
  - Step 7: Survival-tier? **No** (employment is agency, not survival).  
  → **Reject** if competing with survival needs.  
  *Capability cost*: £6,000 for one job < £6,000 for stairlift enabling life basics.  
  *Uncomfortable truth*: We prioritize life over livelihood when resources are scarce.

  ---

  ### **What the Procedure Cannot Do**
  1. **Measure welfare**: We assume capability gains improve well-being but cannot verify.  
  2. **Capture subjective experience**: A rejected applicant’s despair is invisible.  
  3. **Correct systemic injustice**: We treat symptoms, not causes (e.g., underfunded statuary services).  
  4. **Avoid committee bias**: Values judgments at Steps 4/5 reflect members’ worldviews.  
  5. **Ensure long-term impact**: Proof of purchase ≠ proof of functioning gain.  

  ---

  ### **Implementation Notes**
  - **Time**: 6–8 minutes/form (focus on Steps 1–3, 5, 7).  
  - **Training**: Chair briefs members on currency declaration and fixed functionings list.  
  - **Transparency**: Share test cases to demonstrate principled rejections.  

  This is a gauge. It measures capability inputs, not welfare outputs. It will err by construction toward survival needs, undercount silent suffering, and occasionally favor the visibly broken body over the invisibly broken spirit—but it will do so transparently, fast, and without philosophical pretense.
