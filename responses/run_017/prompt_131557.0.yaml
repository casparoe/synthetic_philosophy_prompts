  So proposing Safety as the principle. The user might resist the flatmate case, but explaining that the belief is unsafe due to intoxication could persuade them. If not, maybe add a clause about the speaker's basis, but that complicates things.

  They want to drop inconsistent verdicts. Maybe the chain case: after 20 links, it's not knowledge due to compounded risk. That's acceptable under Safety. 

