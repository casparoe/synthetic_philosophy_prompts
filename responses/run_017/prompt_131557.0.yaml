  The boss cases: groping is a personal testimony where the speaker's account is crucial, and doubting it could be harmful. Skimming might need evidence because it's factual and verifiable. But that's more about justification than knowledge. The Safety Condition might still apply—if the boss is skimming, could the friend be mistaken? If stakes are high, we require more reliability.

