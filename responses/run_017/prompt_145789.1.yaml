  We are constructing desiderata for an account of the unity of consciousness, specifically for what makes a set of experiences belong to a single conscious subject. The purpose is to guide clinical and legal asscripation of agency and responsibility, and to support claims about what it is like for the patient.

  Key cases and considerations:
  1. Standard post-callosotomy: The left hemisphere (verbal) lacks access to the right hemisphere's experiences and confabulates reasons for left-hand actions. The right hemisphere can control the left hand but has limited verbal ability.
  2. People born without a corpus callosum (agenesis) and children after hemispherectomy: They appear unified in ordinary life.
  3. Within a single hemisphere: Cases where experience and report come apart (e.g., blindsight, neglect).
  4. Stipulated case 1: Callosotomy patient gets the same question in both ears simultaneously and writes two incompatible answers, one with each hand, each disclaiming knowledge of the other. Yet, when asked which of the two answers is hers, both hands indicate the same one (say, the left-hand answer).
  5. Stipulated case 2: An adjustable cortical link that can bridge two hemispheres (or two people) with variable bandwidth, allowing integration to be continuously dialed.

  Distinctions to maintain:
  - Unity at a time vs. unity over time.
  - Phenomenal co-consciousness vs. availability for report, reasoning, and action.
  - Number of subjects vs. number of persons or agents.

  We must decide whether the account must give a determinate count in every case or if it can be a matter of degree. Also, we need to address how split-brain evidence bears on experience (not just report).

  Desiderata:

  1. **Non-negotiable: Accommodation of the Split-Brain Phenomenon**  
     *Case*: Standard post-callosotomy. The account must explain why, in the split-brain patient, the left hemisphere and right hemisphere seem to have separate streams of consciousness in some contexts, yet the patient reports being a single subject.  
     *Requirement*: The account must allow for the possibility of two simultaneous streams of consciousness within one body without requiring that they are unified. However, it must also explain the ordinary feeling of unity and the fact that the patient, when not in a split-brain test, feels unified.  
     *Note*: This is non-negotiable because it is a central challenge to unity.

  2. **Non-negotiable: Preservation of Unity in Agenesis and Hemispherectomy**  
     *Case*: Individuals born without a corpus callosum or who have had one hemisphere removed early in life often function as unified subjects.  
     *Requirement*: The account must not imply that these individuals are split into two subjects (as in the case of surgical callosotomy) because they lack the corpus callosum. It must explain how unity is achieved despite the absence of the main commissural pathway.  
     *Note*: This is non-negotiable because it shows that the brain can achieve unity through alternative means.

  3. **Non-negotiable: Distinction between Phenomenal Unity and Access/Report**  
     *Case*: Within a single hemisphere, experiences can occur without being reportable (e.g., blindsight) or without being integrated for reasoning (e.g., neglect). Also, in split-brain, the left hemisphere may not have access to the right's experience, but that doesn't necessarily mean the experiences are not co-conscious.  
     *Requirement*: The account must not collapse phenomenal co-consciousness (what it is like for the subject) with availability for report, reasoning, or action. It must allow for the possibility of unreportable experiences and also for the possibility that two experiences might be co-conscious even if they are not jointly accessible for report.  
     *Note*: This is non-negotiable because it is crucial for the "what it's like" aspect and for cases of dissociation.

  4. **Non-negotiable: Distinction between Unity at a Time and Over Time**  
     *Case*: The unity we experience at a single moment (e.g., the co-occurrence of seeing and hearing) might be different from the unity that persists over time (e.g., the sense of being the same person over time).  
     *Requirement*: The account must provide criteria for synchronic unity (at a time) and may also address diachronic unity (over time), but it should not conflate the two. The focus is on synchronic unity for the purpose of this criterion.  
     *Note*: This is non-negotiable because legal and clinical ascription often requires knowing the state at the time of an action.

  5. **Preference: Ability to Handle the Stipulated Split-Brain Case**  
     *Case*: The callosotomy patient who writes two incompatible answers (one with each hand) and each hand disclaims knowledge of the other, but when asked which answer is hers, both hands point to the same one (say, the left-hand answer).  
     *Requirement*: The account should explain how there can be two dissociated streams of consciousness (each producing an answer without awareness of the other) and yet a meta-awareness that both answers belong to her (as indicated by both hands pointing to the same answer). This suggests a higher-order unity or a unity at a personal level.  
     *Note*: This is a preference because it is a stipulated case, but it captures a nuance of split-brain data.

  6. **Preference: Graded Unity and the Cortical Link Case**  
     *Case*: The adjustable cortical link between two hemispheres or two people.  
     *Requirement*: The account should allow for degrees of unity. As integration increases, the experiences become more unified. This might lead to a graded account of subjecthood. However, note that legal and clinical contexts may require a threshold.  
     *Note*: This is a preference because it is stipulated, but it reflects real possibilities (e.g., neural interfaces). However, it might conflict with the need for a determinate count in legal cases.

  7. **Non-negotiable: Third-Person Applicability**  
     *Case*: Clinical and legal settings require ascribing agency and responsibility to a subject who may not be able to speak (e.g., aphasic patients, locked-in syndrome).  
     *Requirement*: The criterion must be applicable by third parties (e.g., clinicians, courts) without relying solely on the subject's report. It should be based on observable behavior and neural data.  
     *Note*: This is non-negotiable because of the purpose (clinical and legal ascription).

  8. **Non-negotiable: Avoidance of Collapsing the Subject/Agent Distinction**  
     *Case*: In split-brain, there might be two centers of consciousness but one agent (the person) in some contexts. Also, in the stipulated case, two answers are produced but both hands claim the same answer as "hers".  
     *Requirement*: The account must not collapse the number of conscious subjects with the number of agents or persons. There might be multiple subjects within one person (as in split-brain) or one subject with multiple agents (if that is possible).  
     *Note*: This is non-negotiable because agency and responsibility might be attributed to the person even if there are multiple subjects.

  9. **Non-negotiable: Bearing on Experience (Not Just Report)**  
     *Requirement*: The account must address how evidence (like split-brain) bears on the structure of experience itself, not just on report pathways. For example, the fact that the left hemisphere confabulates about the left hand's action suggests that it does not experience the intention behind that action.  
     *Note*: This is non-negotiable because we care about what it is like for the patient.

  10. **Preference: Determinacy vs. Degree**  
      *Requirement*: The account should ideally provide a determinate count of subjects in clear cases (like normal adults) and in the split-brain case during testing. However, in borderline cases (like the cortical link at intermediate levels), it may return a matter of degree. But note: legal contexts may require a binary verdict (e.g., was the subject in a unified state at the time of the crime?).

  Potential conflicts:
  - Between **3 (phenomenal vs access)** and **7 (third-person applicability)**: If we require that unity is phenomenal and not reducible to access, then how can third parties (who cannot access the phenomenal) apply the criterion? We need a way to infer phenomenal unity from third-person data.
  - Between **6 (graded unity)** and the need for a **determinate verdict in legal cases**: If unity is graded, then at intermediate levels we might not have a clear count. But the law often requires a yes/no answer.

  Summary of Main Families of Views:

  - **Access/Workspace Accounts**: Unity is defined by availability to a global workspace. This is functional and third-person applicable. But it collapses phenomenal unity with access, violating desideratum 3. It would count split-brain hemispheres as separate during testing because they lack integrated access.

  - **Phenomenal/Co-consciousness Accounts**: Unity is defined by phenomenal relations (e.g., two experiences are co-conscious). This satisfies 3 but struggles with 7 (third-person applicability) and might not handle the split-brain case well (because it's unclear if the two hemispheres are phenomenally unified or not). Also, it may not be able to handle the stipulated case of both hands claiming the same answer.

  - **Integration Accounts**: Unity is a matter of informational integration (e.g., Tononi's IIT). This can be graded and might handle the cortical link. It can be third-person applicable via neural measures. However, it might collapse unity with integration of information (which is functional) and thus might not capture phenomenal unity (desideratum 3). Also, it might not explain the unity in agenesis (if integration is achieved by other means).

  - **Higher-Order Accounts**: Unity is defined by being represented by a higher-order state. This might account for the stipulated split-brain case (the meta-awareness of both answers as "hers"). But it may not capture the first-order phenomenal unity and may be too intellectual (requiring higher-order thought).

  - **No-Determinate-Answer Views**: There is no fact of the matter about how many subjects there are in some cases. This avoids the problem but fails to provide guidance for clinical and legal contexts (non-negotiable purpose).

  The desideratum that does the most to narrow the field is **3: the distinction between phenomenal co-consciousness and access**. It rules out access-based accounts and pushes towards phenomenal or integration accounts that can capture the what-it's-like aspect.

  Closing:

  We have laid out a set of desiderata, some non-negotiable and some preferences, drawing on empirical cases and stipulations. The non-negotiable ones include: accommodating split-brain, preserving unity in agenesis/hemispherectomy, distinguishing phenomenal unity from access, separating synchronic and diachronic unity, third-person applicability, avoiding collapse of subject/agent, and ensuring evidence bears on experience. The main tension lies between phenomenal irreducibility and third-person applicability, and between graded unity and legal determinacy. Among the main views, the access account is most straightforward for third-person application but fails on phenomenal unity, while phenomenal accounts capture the experiential aspect but are hard to apply objectively. Integration accounts offer a middle ground but risk functionalism. The desideratum of phenomenal/access distinction is the most narrowing.
answer: |-
  ### Desiderata for an Account of the Unity of Consciousness  
  The following criteria are designed to specify what makes a set of experiences belong to a single conscious subject. The account must guide clinical/legal ascriptions of agency and responsibility (e.g., determining culpability in criminal cases or capacity in medical decisions) and support claims about the patient’s subjective experience ("what it is like"). Each desideratum is derived from empirical cases or stipulated scenarios, with **non-negotiable** requirements marked as such and preferences noted. Key distinctions (unity at a time vs. over time; phenomenal co-consciousness vs. functional access; subjects vs. persons/agents) must be preserved. The account should ideally deliver determinate counts in clear cases but may admit degrees in borderline ones, provided legal applications retain binary verdicts.  

  ---

  #### **1. Non-negotiable: Accommodates Split-Brain Dissociation without Over-Unification**  
  **Case**: Standard post-callosotomy patients exhibit two dissociated streams: the verbally reporting left hemisphere confabulates explanations for left-hand actions driven by the right hemisphere, which lacks speech.  
  **Requirement**: The account must allow for *two distinct subjects* within one body during lateralized tasks, explaining why experiences in one hemisphere are inaccessible to the other. It must **not** force a unified subject when behavioral and report-based evidence indicates dissociation.  
  **Why non-negotiable**: Failure here misrepresents agency (e.g., the right hemisphere’s actions are not "owned" by the left’s confabulating subject), risking erroneous legal responsibility ascriptions.  

  #### **2. Non-negotiable: Explains Apparent Unity in Agenesis and Hemispherectomy**  
  **Case**: Individuals born without a corpus callosum or children post-hemispherectomy display unified behavior and self-report in ordinary contexts, despite lacking interhemispheric structures.  
  **Requirement**: The account must explain how unity is maintained *without* the corpus callosum, showing that anatomical deficits do not necessitate subject-splitting. It should avoid positing multiple subjects where no behavioral or experiential evidence supports it.  
  **Why non-negotiable**: Clinically, these individuals are treated as single agents (e.g., consenting to treatment); the account must align with this to avoid undermining their legal personhood.  

  #### **3. Non-negotiable: Distinguishes Phenomenal Unity from Functional Access**  
  **Case**: Intra-hemispheric dissociations (e.g., blindsight or neglect) show experiences can occur without report, reasoning, or behavioral access. Split-brain cases confirm this interhemispherically.  
  **Requirement**: The account must **separate** phenomenal co-consciousness (whether experiences *feel* unified to the subject) from functional access (availability for report/action). Unity cannot be reduced to access.  
  **Why non-negotiable**: Legal/clinical assessments of "what it is like" (e.g., pain in locked-in patients) require addressing experience beyond verbal report. Collapsing this distinction misrepresents subjectivity.  

  #### **4. Non-negotiable: Third-Person Applicability to Non-Communicative Subjects**  
  **Case**: Aphasic, comatose, or mute patients (e.g., advanced ALS) cannot self-report; courts/clinicians need objective criteria for ascribing experiences.  
  **Requirement**: The account must provide criteria applicable via neural/behavioral data (e.g., fMRI, eye-tracking), **without** relying on subjective reports.  
  **Why non-negotiable**: Clinical decisions (e.g., withdrawal of care) and legal responsibility hinge on third-party assessments. Purely first-person accounts fail this.  

  #### **5. Non-negotiable: Maintains Subject/Agent/Person Distinctions**  
  **Case**: In the stipulated split-brain case, two answers are written (each hand disclaims knowledge of the other), but both hands later indicate the *same* answer as "hers," suggesting one *person* with multiple *subjects*.  
  **Requirement**: The account must **distinguish** the number of conscious subjects (loci of experience) from persons (biographical entities) or agents (executors of action). It should allow for multiple subjects under one person.  
  **Why non-negotiable**: Legal responsibility attaches to persons, not necessarily subjects (e.g., a person may be liable for actions driven by a dissociated subject).  

  #### **6. Preference: Handles Graded Unity in Cortical Link Cases**  
  **Case**: Stipulated cortical link with adjustable bandwidth bridges hemispheres (or separate individuals), enabling continuous integration.  
  **Requirement**: The account should accommodate degrees of unity (e.g., low bandwidth → weak unity), reflecting gradual changes in "what it is like."  
  **Preference rationale**: Supports emerging neurotechnology ethics (e.g., brain-computer interfaces) but conflicts with legal need for binary verdicts. **Compromise**: Degrees apply to experience, but a threshold (e.g., minimal integration) determines legal subject-count.  

  #### **7. Preference: Resolves Meta-Awareness in Split-Brain Cases**  
  **Case**: Stipulated split-brain patient writes two conflicting answers (each hand unaware of the other) but both hands endorse one answer as "hers" when queried.  
  **Requirement**: The account should explain how meta-awareness (e.g., "this experience is mine") can persist despite lack of co-consciousness between experiences.  
  **Preference rationale**: Highlights higher-order unity (e.g., personal-level ownership) without requiring first-order co-consciousness, aiding criminal intent assessments.  

  #### **8. Non-negotiable: Ensures Evidence Bears on Experience (Not Just Report)**  
  **Case**: Split-brain confabulation (left hemisphere rationalizes right-hemisphere actions) suggests experiential dissociation, not merely blocked reporting pathways.  
  **Requirement**: The account must link behavioral/neural data to *experience*, e.g., by using cross-hemispheric rivalry tasks to infer unreportable qualia.  
  **Why non-negotiable**: Without this, split-brain data only informs communication, not subjective unity—undermining claims about "what it is like."  

  ---

  ### **Tensions and Constraints**  
  - **Unity at a Time vs. Over Time**: The account must prioritize *synchronic* unity (for moment-to-moment agency) but not conflate it with diachronic unity (persistence over time).  
  - **Determinacy vs. Degrees**: The account should deliver determinate subject-counts in paradigmatic cases (e.g., intact adults = one; split-brain during testing = two). Borderline cases (e.g., cortical link at 50% bandwidth) may admit degrees, but legal applications require thresholds for binary verdicts (e.g., "unified enough for responsibility").  
  - **Key Tensions**:  
    - **Phenomenal Irreducibility vs. Third-Person Applicability (Desiderata 3 & 4)**: If unity is irreducible to access, how can third parties measure it? This may require inferring experience from neural correlates (e.g., integrated information).  
    - **Graded Unity vs. Legal Determinacy (Desiderata 6 & Non-negotiable Purpose)**: Degrees challenge binary legal verdicts; a solution might tie thresholds to functional capacities (e.g., ability to integrate intentions).  

  ---

  ### **Assessment of Main Theoretical Families**  
  - **Access/Workspace Accounts**: Define unity via global availability of information (e.g., Baars, Dehaene). **Strengths**: Fits third-party applicability (4) and split-brain dissociation (1). **Weaknesses**: Collapses phenomenal unity into access, violating (3).  
  - **Phenomenal/Co-consciousness Accounts**: Define unity by direct experiential relations (e.g., Bayne, Chalmers). **Strengths**: Respects (3) and intra-hemispheric cases. **Weaknesses**: Struggles with third-party applicability (4) and meta-awareness (7).  
  - **Integration Accounts**: Define unity by information integration (e.g., Tononi’s IIT). **Strengths**: Handles graded unity (6), cortical links, and neural data (8). **Weaknesses**: May reduce phenomenality to function (3), and agenesis cases (2) challenge strict anatomical criteria.  
  - **Higher-Order Accounts**: Define unity via meta-representation (e.g., Rosenthal). **Strengths**: Explains meta-awareness (7) and subject/agent distinctions (5). **Weaknesses**: Over-intellectualizes, failing blindsight (3) and non-reporting subjects (4).  
  - **No-Determinate-Answer Views**: Reject unity as a fixed property (e.g., Dennett). **Strengths**: Handles borderline cases. **Weaknesses**: Fails non-negotiable purpose (clinical/legal guidance requires determinate counts).  

  **Most Narrowing Desideratum**: **Desideratum 3 (phenomenal vs. access distinction)** eliminates access-based and some integration accounts, favoring phenomenal or hybrid approaches. This is pivotal for capturing "what it is like" but intensifies tension with third-party applicability (4).  

  ---  
  **Final Note**: The account must balance empirical adequacy with pragmatic constraints for clinical/legal use. A hybrid approach (e.g., phenomenal unity grounded in measurable integration) may best resolve tensions, but desideratum 3 remains the litmus test for experiential fidelity.
