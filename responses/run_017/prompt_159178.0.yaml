prompt: |-
  I write literary fiction, and I have been asked to give a one-off session at a writers' centre this autumn: a single two-hour slot, fourteen participants, all novelists, most of them at work on a second or third book and most of them quietly hostile to literary theory — the sort of people who hear the word pragmatics and start checking their phones. I want to give them something they cannot get from a craft book, and I want to give it to them without ever naming it during the session.

  Here is the problem I keep running into in my own work, which is why I am asking for this rather than for a reading list. A great deal of what my characters say is not reporting anything. When a character says, at a bedside, that she forgives her father; when a not-quite-sober registrar pronounces a couple married in a room where the licence has expired; when a colonel gives an order to men who no longer recognise his commission; when a man leaves everything to a woman he has not married and then dies before signing — none of these sentences is chiefly in the business of being true. They are attempts to do things, and they succeed or fail by standards that have nothing to do with accuracy. Readers are extremely good at detecting which is which, and they do it instantly and without vocabulary: a scene in which a vow is spoken in the wrong form, or by the wrong person, or into a silence where no one has the standing to receive it, goes dead on the page in a way that no amount of beautiful prose repairs, and I have watched myself write such a scene three times and not know why it would not stand up.

  So the design brief: a runnable activity — a game, a simulation, a staged set of real choices with small stakes — in which the participants run into that distinction before it is named. They should discover, by trying and failing to make words do things in the room, that the success of such an utterance is a matter of there being an accepted procedure, of the right persons being in the right positions, of the procedure being gone through completely, and of the speaker being in a certain state — and that an utterance can satisfy every one of those and still ring hollow, or violate one and still land. I do not want a lecture up front. I do not want the words illocutionary, perlocutionary, uptake, felicity, or constative spoken by anyone until the debrief. Ideally the participants should spend the first ninety minutes doing something and be unable to say afterwards what it was they were doing.

  Three complications of my own, which I am asking you to take seriously rather than accommodate politely. They are my coinages; I have no source for them and do not want one.

  The first I call shadow uptake. When a character in a novel is married, or threatened, or appointed, or excommunicated, nothing whatever has happened — there is no procedure, no standing, nobody is bound — and yet readers routinely report that the act worked, that the marriage is real for the purposes of the story, that the threat landed. They appear to run the same check they would run in life and return a verdict on an act they know to be void. My guess is that a novelist's craft consists substantially in engineering that check, and I want participants to feel themselves doing it.

  The second I call deferred performatives: utterances whose effect is suspended until some later, independent act ratifies them — a bequest that binds only at a death, a resignation tendered but not accepted, a bet that becomes binding only when the stake is posted, a sentence that binds only once it is entered. These are suspense machines, and novelists use them constantly without noticing that they have made the force of an utterance depend on an event the speaker will never see.

  The third I call double-addressed acts: a single utterance aimed at a character and at the reader at once, with a different force for each, where the reader's uptake of their half can quietly sabotage the character's. A public forgiveness is absolution to the person who receives it and menace to the reader, who alone knows what the speaker is concealing.

  Please design the session so that at least one of these three is not merely discussed but produced by the rules, and tell me honestly which of the three the mechanics can carry and which of them I will have to supply myself in the debrief — I would rather be told that one of my hobby-horses cannot be staged than given a contrived exercise that pretends otherwise.

  The practical constraints: fourteen adults in one room, two hours with a short break, one facilitator (me), nothing that costs money, no preparation between sessions, no homework, and materials limited to what a writers' centre actually has — index cards, a flipchart, pens, a bell. Participants will write short passages in the room and read them aloud, and that is fine; they will also, I think, have to say things to each other that commit them, and I want the commitment to be small but not fictional — tokens, chips, a ledger, a standing to be gained or lost — because I suspect the difference between describing a promise and being in one is exactly the thing I am trying to make them feel. Give me the rules, the material, the opening state of the room, what the facilitator does and does not say, a minute-by-minute shape, the scoring if there is scoring, and any cards or scripts I need to write in advance.

  Then the debrief, which I want in more detail than the game: which moment in the activity is supposed to produce which recognition, in what order I should draw them out, and what question I should ask to get each one — not a list of points to assert. Include what will predictably go wrong the first time I run it: I expect at least one participant to treat the whole thing as an exercise in rule-lawyering and try to win by inventing procedures, one to insist that a fictional utterance is simply true within the story and that nothing more needs saying, and one to collapse the difference between an act that misfires and an act that is achieved but hollow, since in a room of actors insincerity is indistinguishable from good acting. Tell me what to do with each of those. Finally, be frank about what the exercise cannot reproduce. My worry is that it will make the whole business feel like a game convention — a rule we agreed to for an hour — and that the step from the room accepted it to you are now bound, this has changed what you owe, will have to come entirely from me in the last fifteen minutes. If that is so, say so, and tell me what I should say.
reasoning: |-
  Okay, the user is a literary fiction writer preparing a workshop for experienced novelists who are skeptical of theory. They want a practical activity that demonstrates how utterances in fiction work beyond their literal meaning—how they perform actions (like forgiving or marrying) based on context, authority, and procedure. The key is to avoid jargon entirely and let participants experience the concepts through failure.

  The user’s core problem in their own writing involves scenes where ceremonial language falls flat because the conditions aren’t met (e.g., a vow spoken without authority). Readers instantly sense this failure, but it’s hard to articulate why. The workshop must make this tangible through an activity where participants try to "perform" acts with words and fail when conditions are wrong.

  Three nuanced concepts need embedding:
  - **Shadow uptake**: Readers treating fictional acts as real despite knowing they’re not.
  - **Deferred performatives**: Acts whose power depends on future events (like a will).
  - **Double-addressed acts**: An utterance affecting characters and readers differently.

  The challenge is designing mechanics where these emerge organically. For example:
  - Shadow uptake could surface when participants treat fictional "gifts" as binding despite knowing it’s a game.
  - Deferred performatives might involve promises that only activate if a future trigger occurs.
  - Double-addressed acts could work if an utterance reveals hidden stakes to "readers" (other participants) but not "characters."

  The activity must use low-stakes but real commitments (e.g., trading tokens) to mimic the weight of fictional promises. Constraints: no prep, cheap materials (index cards, pens), and no theory terms until debrief. Predictable issues: 
  - Rule-lawyers exploiting loopholes (show how procedure alone isn’t enough).
  - Participants insisting "it’s just fiction" (highlight how readers still judge validity).
  - Confusing insincere-but-correct acts with genuine ones (contrast hollow vs. misfired acts).

  The proposed design: A token economy where participants perform speech acts (gift, promise, accusation) under varying conditions. Phase 1 has strict rules to make acts fail when conditions aren’t met (e.g., gifting without tokens). Phase 2 introduces ambiguity (e.g., deferred promises) to reveal how context and future events change an utterance’s force. 

  Mechanics carrying the concepts:
  - **Shadow uptake**: Tokens "matter" because the group tacitly agrees they do, mirroring reader investment.
  - **Deferred performatives**: Promises only bind if a future event (e.g., bell ring) occurs.
  - **Double-addressed acts** (hardest): Might require a bystander role seeing hidden intentions; otherwise, debrief supplements it.

  Debrief structure: Start with participant frustrations ("Why did X fail?"), then unpack conditions (procedure, authority, sincerity). Use their examples to highlight shadow uptake ("You cared about fake tokens") and deferred force ("The promise hung on the bell"). Double-addressed acts may need hypotheticals from their writing.

  Honest gaps: 
  - The step from "game rules" to real-world bindingness relies on the facilitator linking it to reader psychology. 
  - Double-addressed acts are tricky to stage; use writing prompts where the same line means differently to a character vs. reader.
  - Insincerity in acting vs. life: Contrast how hollow acts feel in the game ("You knew the rules were met but it felt empty") vs. fiction where prose cues sincerity.

  Key facilitator moves: Stay silent during struggles, ask "What happened?" not "Why?", and in debrief, anchor abstractions in their lived frustration. Pre-write cards with utterance types and sabotage conditions (e.g., "Accuse someone of stealing—but you have no tokens to prove standing").
answer: |-
  Below is a designed session that embeds your three concepts—**shadow uptake**, **deferred performatives**, and **double-addressed acts**—into a rule-based activity. The mechanics naturally produce **shadow uptake** and **deferred performatives**, while **double-addressed acts** will require debrief scaffolding. I’ll outline the setup, rules, flow, debrief, and pitfalls.  

  ---

  ### **Session Title:** *The Currency of Words*  
  **Core Conceit:** Participants trade physical "standing" (tokens) by performing speech acts. The rules force them to confront *when words bind* vs. *when they misfire*—without theory language.  

  ---

  ### **Materials & Prep**  
  - **Tokens:** 140 blank poker chips (10 per participant) or cut paper squares.  
  - **Ledger:** A flipchart with 14 participant names and 3 columns: *Tokens*, *Standing*, *Debts*.  
  - **Cards:** 14 index cards pre-written with **Utterance Prompts** (e.g., "Gift a token to someone," "Accuse someone of cheating," "Promise a future action").  
  - **Bell:** For timed phases.  
  - **Pens & Paper:** For writing snippets.  

  ---

  ### **Rules & Mechanics**  
  #### **Phase 1: Building Standing (30 mins)**  
  **Goal:** Establish that "standing" (tokens) is needed for speech acts to work.  
  1. **Opening (5 mins):**  
     - Distribute 10 tokens per person. No explanation.  
     - Flipchart shows all names with *Tokens: 10*, *Standing: Neutral*, *Debts: None*.  
     - *Facilitator says:* "Trade tokens. Use words to make exchanges. I’ll update the ledger."  

  2. **Silent Trade (10 mins):**  
     - Participants trade tokens physically but **cannot speak**. Ledger updates token counts only.  
     - *Result:* Frustration. Trades feel arbitrary—no weight.  

  3. **Verbal Trade (15 mins):**  
     - Participants now **must speak** to trade (e.g., "I give this to you").  
     - *Secret Rule:* Trades **only succeed** if:  
       - Speaker has ≥1 token.  
       - Speaker says, "I give this token to [Name]."  
       - [Name] responds, "I accept."  
     - *Facilitator:* Updates ledger **only** when all conditions are met. Ignores other exchanges.  
     - *Result:* Some trades fail (e.g., no response, wrong words). Participants realize words require "correct" conditions to count.  

  ---

  #### **Phase 2: Speech Acts with Stakes (45 mins)**  
  **Goal:** Introduce failures and deferred force. Participants draw cards with prompts requiring "binding" utterances.  
  1. **Card Draw (5 mins):**  
     - Each draws 1 index card with a prompt, e.g.:  
       - *"Gift a token to someone outside your row."*  
       - *"Promise to give someone 2 tokens tomorrow."*  
       - *"Accuse someone of hoarding tokens (if true, they lose 3)."*  

  2. **Perform & Fail (25 mins):**  
     - Participants attempt their prompts.  
     - *Secret Rules:*  
       - **Gifts:** Require acceptance + giver has tokens.  
       - **Promises:** Recorded as *Debts* but **not binding until the bell rings later**.  
       - **Accusations:** Require accuser to **have tokens as "standing"** + accused must confess. If accused denies, accusation fails.  
     - *Facilitator:* Updates ledger strictly (e.g., "Promise: Ana owes Bob 2 tokens [BELL]"). Ignores acts breaking rules.  

  3. **The Bell Moment (15 mins):**  
     - Ring bell. All *Debts* now bind—update tokens.  
     - *Result:* "Promises" made earlier suddenly take effect. Deferred force felt.  

  ---

  #### **Phase 3: Hollow Acts & Sabotage (15 mins)**  
  **Goal:** Surface insincerity and dual audiences.  
  - **Writing Prompt:**  
    - *Facilitator says:* "Write 2 lines of dialogue: One character performs an act (e.g., vows, accuses). The other responds."  
  - **Twist:**  
    - Half the room writes **sincere** exchanges.  
    - Half writes **insincere/hollow** exchanges (e.g., a false apology).  
  - **Read-Aloud:**  
    - Pairs read dialogues. Others vote "Binding?" or "Misfire?" via thumbs.  
    - *Result:* "Hollow" acts often "succeed" procedurally but feel empty.  

  ---

  ### **How Mechanics Carry Your Concepts**  
  1. **Shadow Uptake (Produced):**  
     - Tokens are arbitrary, but participants treat them as "real" (e.g., frustration when trades fail). The group’s silent consensus that tokens *matter* mirrors reader investment in fictional acts.  
     - **Predictable Moment:** When a procedurally correct act feels "cheap" (e.g., insincere apology in Phase 3).  

  2. **Deferred Performatives (Produced):**  
     - Promises only bind at the bell. Participants tense up waiting—deferred force is visceral.  
     - **Predictable Moment:** The bell ring causing groans/laughter as debts resolve.  

  3. **Double-Addressed Acts (Not Fully Produced):**  
     - The activity can’t simulate reader/character duality. *This will require debrief examples.*  

  ---

  ### **Debrief (30 mins)**  
  **Goal:** Name the unnamed. Start concrete, end abstract.  

  | **Step**                     | **Facilitator Question**                                  | **Target Concept**                          |  
  |------------------------------|-----------------------------------------------------------|---------------------------------------------|  
  | **1. Frustration Inventory** | "When did words fail *even when you meant them*?"         | Conditions (procedure, authority)           |  
  | **2. Victory Inventory**     | "When did words work *against your expectations*?"        | Shadow uptake (group consensus)             |  
  | **3. The Bell**              | "How did the promise change when the bell rang?"          | Deferred performatives                      |  
  | **4. Hollow vs. Misfire**    | "Why did some 'correct' acts feel empty? Give examples." | Sincerity conditions vs. procedural failure |  
  | **5. Double-Addressed**      | *"In your writing, when does an act mean one thing to a character and another to the reader?"* | Double-addressed acts (supplied by you)     |  

  **Key Debrief Script:**  
  > *"You felt angry when your gift failed because you lacked tokens. You rolled your eyes at hollow apologies that ‘worked.’ That’s the difference between a* ***misfire*** *(wrong conditions) and* ***abuse*** *(right conditions, wrong heart). And when the bell made your promises real? That’s force hanging on a future event. In fiction, readers accept made-up weddings because* ***you*** *engineer the conditions—the shadow of a ritual they know. But when you write a public forgiveness that’s secretly a threat? The reader hears both. That’s double-addressed force."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **The Rule-Lawyer:**  
     - *Who:* Tries to "win" by inventing procedures (e.g., "I declare tokens are worthless!").  
     - *Solution:* Let their acts fail. Ask: "Did anyone *feel* bound by that? Why not?" Highlights consensus > rules.  

  2. **The Literalist:**  
     - *Who:* "It’s just fiction—anything goes if the author says so."  
     - *Solution:* Use their Phase 3 writing. Ask: "If your character’s insincere vow ‘worked,’ why did readers thumbs-down it?" Forces the gap between "true in story" and "felt true."  

  3. **The Actor:**  
     - *Who:* Blurs insincerity and acting ("But I *sounded* sincere!").  
     - *Solution:* Contrast *procedural success* (act landed) vs. *sincerity* (audience belief). Ask: "Did anyone doubt their *intent* despite perfect words?"  

  ---

  ### **What the Exercise Can’t Do**  
  - **The Binding Step:** The tokens *feel* like a game. To bridge to fiction, say:  
    > *"You knew tokens were fake, but you cared. Why? Because we agreed to care. Fiction is that agreement. When you write ‘I do,’ readers bring their knowledge of weddings. Your job is to rig the conditions so they* ***invest*** *—even though nothing real happens."*  
  - **Double-Addressed Acts:** The exercise can’t simulate dual audiences. Supply examples:  
    > *"Imagine: A liar says, ‘I swear I’m honest.’ The character believes it; the reader hears irony. That’s double force. You sabotage the character with the reader’s knowledge."*  

  ---

  ### **Session Flow (120 mins)**  
  - **0:00-0:05:** Setup (distribute tokens, explain trading).  
  - **0:05-0:35:** Phase 1 (silent + verbal trades).  
  - **0:35-0:45:** Phase 2, Part 1 (card draws & attempts).  
  - **0:45-0:50:** Break.  
  - **0:50-1:05:** Phase 2, Part 2 (bell resolves debts).  
  - **1:05-1:20:** Phase 3 (write & read dialogues).  
  - **1:20-1:50:** Debrief (follow question sequence).  
  - **1:50-2:00:** Q&A.  

  ---

  ### **Why This Works**  
  - **Theory Avoidance:** The rules *are* Austin’s felicity conditions, never named.  
  - **Your Concepts:** Shadow uptake and deferred performatives emerge from mechanics; double-addressed acts get a foothold in Phase 3 writing.  
  - **Stakes:** Tokens create micro-commitments. Losing a chip *feels* like losing standing.  
  - **Discovery:** By Phase 3, participants will grumble about "empty words" and "unfair rules"—primed for debrief.  

  **Final Note:** Run this tightly. Your role is **reactive**—update the ledger stone-faced, enforce secret rules wordlessly, and let frustration brew. The friction is the lesson.
