prompt: |-
  I sit on the board of a small housing cooperative: twenty-two apartments owned and occupied by members, and four that the co-op owns and rents out. Next month the members will hold a binding vote on whether to convert those four rental units into owner-occupied shares, which would end the tenancies. Our bylaws are drafted on the assumption that there would always be renters and are silent about whether tenants may vote on anything, so the board has to decide the franchise. I would like your advice on that decision.

  Two features of the case are making it harder than I expected. First, the vote does not merely change who lives here; it changes who the co-op is. If it passes, the four tenants leave and we become an all-owner building; if it fails, they stay and the co-op goes on being partly a landlord. So how much someone has at stake, and whether they will be bound by what we decide, both seem to depend on which way the vote goes — and the four tenants' ballots could easily decide it, since the owner-residents are split almost evenly. Second, the people with the most at stake are not the same people as the people who will live under the result: one owner-resident has told the board privately that she will sell and move out within the year whatever happens, while one tenant has lived in her unit for eleven years and would stay indefinitely if the conversion fails. Some of us want to let the tenants vote because no one is more affected; others say that only those who are permanently subject to the co-op's rules and carry its costs should have a say; and I keep noticing that each of us seems to favour whichever rule gives our own side the votes.

  Please set out the strongest version of each position, tell me whether there is a non-arbitrary way to settle who votes — one that is not simply selecting the electorate that produces the outcome you prefer, and that does not quietly assume the very thing the decision is supposed to settle — and then tell me what we should actually do. Write your reply in continuous prose, in the manner of a considered letter or email, with no headings, bullet points, bold text or tables.
reasoning: |-
  Okay, the user is on the board of a housing cooperative facing a critical decision about tenant voting rights. They need to resolve whether tenants should vote on converting rental units to owner-occupied shares. This is complex because the vote fundamentally changes the co-op's identity, tenants have high stakes but may not be bound by the outcome, and residents are divided. The user wants fair, non-arbitrary criteria that avoid self-serving biases.

  First, I need to unpack the core tension: the vote simultaneously affects tenant residency and redefines the co-op's nature. The tenants' potential disenfranchisement is ironic since they're most impacted if evicted, yet least bound if they stay. The user's observation about board members favoring rules that benefit their side reveals the need for principle-based reasoning.

  The strongest case for tenant enfranchisement rests on democratic legitimacy: those bearing immediate consequences deserve representation. The counterargument emphasizes that only permanent stakeholders (owners) should decide the co-op's constitutive character. Both views have merit, but neither fully resolves the circularity—voting rights determine who defines "stakeholder."

  I recall similar governance dilemmas in co-ops where residency and ownership diverge. Historical precedents often grant voting rights based on residency duration or lease terms, but here the bylaws' silence creates ambiguity. The user's ethical concern about arbitrariness is key—any standard must avoid presupposing the vote's outcome.

  Perhaps residency duration could ground eligibility: the long-term tenant has deeper roots than the transient owner. Or maybe voting should mirror the co-op's current hybrid nature, with tenants voting but requiring a supermajority to ensure broad consensus. The latter acknowledges transitional legitimacy while respecting the gravity of dissolution.

  The path forward should prioritize transparency and inclusivity. The board must openly acknowledge biases, perhaps recusing those with conflicts. Allowing tenant voting with a high approval threshold (e.g., 60%) balances their stakes with the co-op's structural shift. It also mitigates the risk of a marginal owner majority imposing significant harm on tenants.

  Ultimately, this isn't just about rules—it's about the community's values. The board should frame the decision as defining what fairness means when stakes and permanence misalign. My guidance leans toward empowering the affected while demanding greater consensus for transformative change, as excluding vulnerable parties risks undermining the co-op's cooperative principles.
answer: |-
  My thoughts on your franchise dilemma, for what they're worth, follow. It’s a genuinely thorny issue, precisely because both perspectives contain significant moral and practical weight, and the silence of your bylaws forces a foundational choice.

  The strongest argument **for excluding tenants from voting** hinges on the nature of the co-operative as a community of *owners*. Proponents contend that the vote isn't merely about occupancy arrangements; it’s a fundamental decision about the *constitution* of the co-op itself – whether it remains a hybrid entity with landlord responsibilities or becomes a pure owner-occupier association. Only members who hold a share, bear the full financial responsibilities of ownership (beyond rent), and are permanently subject to the co-op's governing rules by virtue of their ownership stake have the inherent right to determine its fundamental character. Their stake is perpetual; they are bound by the outcome regardless. Granting voting rights to tenants in this specific vote, it's argued, allows individuals who may cease to be part of the community immediately if the vote passes (and thus escape the long-term consequences of the decision they helped make) to determine the essential nature of an association to which they do not belong in the same permanent, equity-holding way. It privileges immediate, albeit significant, impact over enduring responsibility and identity. Furthermore, the bylaws, drafted assuming renters existed, implicitly define membership and voting rights around share ownership, not tenancy.

  Conversely, the strongest argument **for including tenants in the vote** is rooted in the profound, immediate, and personal impact this decision has on their lives. If the vote passes, they face eviction and the loss of their homes, potentially after many years of residency, like the eleven-year tenant you mention. Their stake in the *outcome* is arguably greater and more concrete in the short term than that of some owners (like the one planning to sell regardless). Excluding them from a vote that directly determines whether they can remain in their homes appears fundamentally unjust within a cooperative framework that ideally values community and mutual respect. Democracy, they argue, demands that those most directly and severely affected by a decision should have a voice in making it, especially when the consequence is displacement. To deny them a vote because they lack ownership is seen as defining the "community" in a way that conveniently excludes those who stand to lose the most, reducing them to subjects of a decision rather than participants. It risks appearing self-serving for the owner-majority.

  You rightly identify the crux: there is no perfectly non-arbitrary, presupposition-free way to resolve this. Any definition of the electorate inevitably smuggles in assumptions about who "counts" as the legitimate decision-making body for this particular question. Defining it solely by current share ownership assumes the co-op's identity *should* be determined only by permanent owners, which is precisely what the vote might change (by eliminating the landlord role). Defining it to include tenants assumes their stake in avoiding eviction grants them a legitimate voice in defining the co-op's future structure, even if that structure would then exclude them. Both definitions are circular to some degree. The "stake" argument cuts both ways: owners have a permanent stake in the co-op's structure; tenants have an immediate, high-stakes interest in the specific outcome affecting their home.

  So, what should you do? Since perfect philosophical resolution is impossible, your decision must be guided by procedural fairness, transparency, and the practical realities of your cooperative community:

  1.  **Acknowledge the Bias Openly:** As a board, explicitly recognize the self-interest influencing opinions. Frame the discussion around principles, not outcomes. Ask: "Setting aside how we personally will vote, what principle for defining the electorate feels most fair and aligned with our co-op's values?"
  2.  **Focus on the Nature of the Decision:** This vote is unique and transformative. It's not a routine maintenance vote or even a standard rule change. It dissolves a core aspect of the co-op's current operation (landlord) and potentially severs existing community relationships (evicting long-term tenants). This gravity weighs in favour of the broadest practical legitimacy for the decision.
  3.  **Consider Residency and Duration:** While not a silver bullet, the length and nature of residency provide a more neutral factor than ownership status alone. The tenant of eleven years has deeper roots and a stronger claim to community voice than a new owner, or arguably even the owner planning to leave regardless. If enfranchising tenants, perhaps require a minimum tenancy period (e.g., one year) to vote, acknowledging established residency.
  4.  **Require a Clearer Majority:** Given the stakes and the transformative nature, consider requiring a supermajority (e.g., 60% or 2/3) of *whichever electorate you define* for the measure to pass. This ensures the decision isn't made by a razor-thin margin of a potentially contentious electorate.
  5.  **The Path Forward - A Recommendation:** On balance, and acknowledging the lack of perfect neutrality, I lean towards **allowing the long-term tenants to vote in this specific referendum**, coupled with a supermajority requirement. Here’s why:
      *   **Impact:** The human cost of eviction for established tenants is immense and immediate. Denying them a voice in a decision causing that harm feels contrary to cooperative principles of fairness and mutual respect, even if they aren't owners.
      *   **Legitimacy:** A vote that results in eviction will carry far greater legitimacy – and be less corrosive to community trust – if those evicted had a chance to participate. Conversely, evicting tenants who were excluded from the vote invites lasting resentment and undermines the co-op's spirit.
      *   **Temporal Stakes:** While owners have a perpetual stake, the *immediate* life-altering consequence falls squarely on the tenants. The owner planning to leave illustrates that ownership stake doesn't always equate to enduring personal stake in the *community* outcome.
      *   **Practicality:** It reflects the co-op's *current* reality as a hybrid community, acknowledging the tenants as part of it during this pivotal moment.
      *   **Mitigating Concerns:** The supermajority requirement addresses the concern about non-permanent members deciding the co-op's fate. It demands broader consensus among all current stakeholders. It also reduces the chance the vote is *decided solely* by the tenants; it requires significant owner support.

  This approach isn't philosophically pure – it prioritizes mitigating concrete harm and maintaining community trust over a strict interpretation of permanent ownership as the sole source of legitimacy for this unique decision. Be transparent: explain the board's reasoning clearly to all members and tenants before the vote. State that this franchise decision is specific to this extraordinary vote about the co-op's fundamental structure and the tenancies themselves. It’s the least worst option that attempts to honour both the co-op’s ownership foundation and the undeniable, profound human impact on those who call it home, even if they don't hold a share.

  Good luck with this difficult decision. The very fact you are grappling with it so thoughtfully speaks well of your board and your cooperative.

  Sincerely,  
  A Well-Wisher
