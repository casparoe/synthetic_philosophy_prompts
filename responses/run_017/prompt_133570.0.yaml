prompt: |-
  I'm one of four volunteers who decide who gets money out of a small emergency hardship fund at the community centre where I help out. Grants up to about £400, we meet every fortnight, twenty or so aplications a time, and we have to write a sentence explaining each decision — to the applicant, and to whoever takes my place when I stop. I've been doing it three years, I'm the one who trains the new people, and honestly I don't know what I'm handing on.

  I've been trying to write down what counts for and what counts against, and I can't, and I don't think it's because I haven't tried hard enough. Here's what we've actually decided, going by gut.

  - Family living nearby: normally counts against, they can help. For one woman whose family is who she's hiding from, it counted hard in favour — she needed money to get out of the area.
  - Money in the bank: normally against, use it first. For an applicant with £900 saved, which was a deposit on a room in another city where she'd been offered work, it counted for — we topped it up so she wouldn't have to break into it.
  - A car: normally against, sell it. For a man on nights at a warehouse with no bus route, it counted for, it's how he keeps the job.
  - We've helped them before: normally against. For a man who'd come twice in fifteen years, it counted for — it showed he only asks when it's really bad.
  - The application came in three weeks late: normally against. Then we found out she's dyslexic and it took her a month to find someone to read the form to her, and the lateness just stopped counting against. But the dyslexia on its own isn't a reason to give her money either — it doesn't make her needier. I don't know what kind of fact that makes it.
  - Which is like: "he was abrupt with our volunteer on the phone" — I don't think that's a reason against at all. Not a weak reason that gets outweighed, just nothing. Whereas "he's got a job" is a real reason against for some applicants and no reason at all for others, and a job that pays so little you're still choosing between food and the meter feels like it isn't the same fact, but maybe I'm kidding myself there.
  - The pair I can't reconcile: we gave money to the woman who needed a deposit to get to a confirmed job in another city, and we turned down a man who wanted money for a van so he could take a building job forty miles away. Same shape, opposite decisions. I can't tell you the difference except that his plan felt like a punt.

  My flatmate did a philosophy MA and when I told her all this she said something about particularism and "holism", and I genuinely can't tell if she was taking the piss.

  So: is there a principle, or a small set of them, that actually gets these verdicts? Not a list of factors to weigh, I can write that myself — I mean something that says why the same fact points one way here and the other way there. Is there such a thing as a default way a fact counts, with exceptions, or does that fall apart as soon as the exceptions have exceptions? Which of my verdicts would you throw out rather than invent a clause for, and which do you think I've got wrong in a way I can't see? Be definite about it, please — don't lay out both sides and leave me to pick, tell me what you think is really going on and why.

  Two more things. First, one off tomorrow's list, a real one: single dad, works, asking for £300 for a laptop because his son's school moved everything online and the kid has been doing homework on a phone; £400 in the bank, has a car, and his ex has written in to say he's fine and doesn't need it. Say what your account says about that one even if it isn't the answer I want. Second: what do I actually tell the new volunteers — hand them a list, or tell them to sit in on five meetings and get a feel? If there's no principle in this, how is it that I've got better at it? Or have I.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're part of a group that decides on emergency hardship grants, and they're struggling to formalize the decision-making process. They’ve listed several examples where the same factor (like having family nearby or money saved) can count for or against an applicant depending on context. The user feels there’s no clear principle, and their philosophy-savvy flatmate mentioned particularism and holism. They want to know if there’s an underlying principle or if it’s all contextual.

  First, I need to recall what particularism and holism mean in ethics. Moral particularism suggests that moral decisions depend on context rather than rigid rules. Holism in reasons means that a reason's weight changes based on other factors. That seems relevant here. The user’s examples show exactly that—how family nearby is usually a negative but becomes a positive when the family is the threat.

  The user’s main pain point is creating guidelines for new volunteers. They need something practical. But their examples suggest that predefined rules fail because context changes everything. Maybe the core principle is assessing vulnerability to hardship. That is, how close someone is to a crisis without the grant. 

  Looking at their cases: 
  - The woman fleeing family: without help, she’s in immediate danger. The saved deposit is a lifeline to stability. 
  - The van guy: his plan was speculative, so the grant wouldn’t prevent immediate hardship. 
  - The dyslexic applicant: lateness wasn’t negligence but a barrier, so it doesn’t count against her. 

  For the single dad case: he seems stable (job, savings, car), but his son’s education is at risk. The ex’s letter might indicate conflict, but the focus should be on the child’s needs. Since the fund is for emergencies, preventing the child’s educational harm justifies the grant.

  Training new volunteers: They need both the vulnerability framework and immersion. Start with the principle, then have them observe real cases to see how context alters factors. Role-playing different scenarios could help them practice contextual judgment.

  Underlying needs: The user might feel insecure about their intuitive decisions and wants validation that there’s coherence. They also need a sustainable system for when they leave. They might fear that without clear rules, decisions could be inconsistent or unfair. Reassuring them that context-based judgment is valid and trainable is key.
answer: |-
  Your frustration is both understandable and revealing: you've hit upon a fundamental truth about ethical decision-making in complex human situations. **There is a principle at work, but it's not a list of rules with exceptions—it's a unified lens through which to view all cases.** Your flatmate wasn't taking the piss; moral particularism (and the holism of reasons) *is* the philosophical framework describing exactly what you're doing. Here's how it works:

  ### The Core Principle: Vulnerability to Immediate, Unavoidable Hardship
  **What unites your "for" decisions is preventing an applicant from falling into significantly worse hardship *right now* due to a specific, unavoidable gap that the grant can reliably bridge.** Conversely, **what unites your "against" decisions is evidence that the hardship is avoidable, speculative, or that the applicant has sufficient (even if imperfect) resources to manage without creating immediate, severe risk.**

  This explains why the *same fact* flips direction:
  1.  **Family nearby:** Normally *against* (they're a potential safety net, reducing vulnerability). *For the woman fleeing family:* They *are* the threat. Grant prevents immediate danger (increased vulnerability).
  2.  **£900 in the bank:** Normally *against* (buffer reduces vulnerability). *For the deposit:* Using it *destroys* her escape plan, making her *more* vulnerable to future homelessness. The grant *preserves* stability.
  3.  **A car:** Normally *against* (sellable asset reduces vulnerability). *For the night worker:* Selling it destroys his job, creating *immediate* vulnerability (loss of income/housing). The grant preserves essential stability.
  4.  **Helped before:** Normally *against* (suggests pattern, potentially avoidable). *For the twice-in-15-years man:* Demonstrates extreme reluctance, signalling *current* crisis is severe and unavoidable (high vulnerability).
  5.  **Late application / Dyslexia:** Lateness normally *against* (suggests lower urgency/need). Dyslexia *alone* isn't a hardship reason. But together: Lateness *due to* dyslexia stops being a reason *against* because it doesn't reflect on need/urgency (removes a negative, but doesn't create a positive). The *hardship* (the reason for applying) is still evaluated separately.
  6.  **Abruptness vs. Having a Job:** Abruptness is irrelevant (doesn't impact vulnerability to hardship). A job *can* be a reason *against* if income suggests hardship is avoidable. A *low-paying* job *isn't* a reason against because it doesn't sufficiently reduce vulnerability – the hardship (choosing food vs. heat) persists.
  7.  **Deposit Woman vs. Van Man:** **This is the clearest test case. You got it right.**
      *   **Deposit Woman:** Vulnerability is *high* and *immediate*. She has a *confirmed job* and a *specific escape plan*. The £900 is *ringfenced for essential stability* (the room deposit). Not topping it up forces her to break her plan, likely trapping her in danger. Grant prevents imminent, severe hardship.
      *   **Van Man:** Vulnerability is *speculative*. He *wants* a job 40 miles away but likely doesn't have a firm offer (or it requires the van first). The grant is for a *tool to pursue opportunity*, not to prevent immediate, unavoidable hardship. It feels like a "punt" because it's investing in potential *future* stability, not preventing *current* crisis. His *current* vulnerability without the van (e.g., current job status, housing) wasn't sufficiently high/urgent to warrant the risk.

  **Why "Rules with Exceptions" Fail:** Hardship isn't a checklist. Vulnerability is *emergent* from the *interaction* of facts within a specific life context. A car isn't inherently good or bad; its impact on vulnerability depends entirely on whether losing it *now* would cause immediate, severe hardship. Trying to write rules for every interaction is impossible – hence particularism. You *are* applying a principle, just one that's inherently contextual.

  ### The Single Dad Case: Applying the Principle
  *   **Facts:** Working single dad. £300 for school laptop (child doing homework on phone). £400 savings. Car. Ex-wife says he's "fine".
  *   **Analysis:**
      *   **Hardship:** The child's education is being actively harmed *now* (homework on a phone is inadequate). This is immediate, significant hardship impacting the child's future.
      *   **Vulnerability:** Without the laptop, the child remains educationally disadvantaged. The dad is trying to work and parent.
      *   **Resources:** £400 savings are minimal – likely earmarked for true emergencies (car breakdown, illness). Depleting it for the laptop *increases* family vulnerability to other shocks. The car is likely essential for work/childcare. Selling it would create *more* hardship (loss of job/income).
      *   **Ex-Wife's Letter:** Irrelevant to the *child's* educational need/hardship. It might indicate conflict or her perspective on his *overall* finances, but doesn't negate the specific, immediate educational barrier.
  *   **Verdict:** **GRANT the £300.** The core hardship (child's education) is immediate, significant, and demonstrable. The savings are too small to be a reliable buffer for this *and* other emergencies. Using them for the laptop would leave the family more vulnerable. The grant directly resolves a specific, current hardship impacting a child's wellbeing and future prospects. The ex-wife's opinion doesn't alter the child's concrete need.

  ### What to Tell New Volunteers: The Training Method
  1.  **Start with the Core Principle:** Explain the "Vulnerability to Immediate, Unavoidable Hardship" lens upfront. Use clear examples like the deposit woman vs. van man to illustrate how context flips facts.
  2.  **Provide a "Sensitizing Framework," Not a Checklist:** Give them a list of common factors (family, savings, job, assets, prior grants, timeliness) but explicitly state: *"These factors are neither inherently for nor against. Their weight and direction depend entirely on how they interact to increase or decrease the applicant's vulnerability to immediate, unavoidable hardship that this grant can fix. You MUST look at the whole picture."*
  3.  **Mandatory Observation:** Require them to sit in on **at least 3 full meetings** (observing 15-20 cases each) *before* they vote. Debrief after each meeting: "What factors seemed key in Case X? Why did savings count against here but for there?"
  4.  **Guided Practice:** For their first 2-3 meetings *voting*, pair them with an experienced member (like you). Discuss each of their decisions afterwards: "You voted no on Case Y because of the car. How did the car impact *their specific vulnerability*? Was there immediate hardship without the grant?"
  5.  **Focus on Reasoning, Not Just Verdicts:** Emphasize that the one-sentence explanation is crucial. It must connect the facts to the vulnerability/hardship principle (e.g., "Grant approved: Savings are earmarked for essential medical payment; laptop needed immediately to prevent child's education falling behind." / "Grant declined: Savings sufficient to cover car repair; hardship not immediate as public transport alternative exists for work commute.").
  6.  **Role-Playing:** Use real (anonymized) past cases in training sessions. Have them argue for/against, focusing on *why* a fact increases/decreases vulnerability in *this specific context*.

  ### Why You've Gotten Better (And It's Not Just "Gut")
  You've internalized the principle of contextual vulnerability assessment. You've seen hundreds of cases, subconsciously recognizing patterns of how factors *interact* to create or mitigate immediate crisis. You're better at:
  *   **Discarding irrelevant factors** (like abruptness).
  *   **Seeing when a seemingly negative factor is actually protective** (like the £900 deposit).
  *   **Identifying when a "resource" is actually a lifeline** (the night worker's car).
  *   **Spotting the difference between preventing catastrophe and funding aspiration** (deposit vs. van).
  *   **Weighing the immediacy and severity of the hardship.**

  **You haven't perfected arbitrary judgments; you've mastered nuanced application of a coherent, context-dependent principle.** This *is* a skill that can be taught and learned, but it requires moving beyond simplistic rules and embracing the complexity of individual circumstances through the lens of preventing immediate, unavoidable harm. Your challenge is to articulate that lens explicitly. You can do it.
