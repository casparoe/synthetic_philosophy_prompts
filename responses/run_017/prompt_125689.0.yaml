answer: |-
  ### Structured Activity: The Rule-Following Game  
  **Objective:** Students experience the tension between individual meaning, community agreement, and the indeterminacy of rules without prior exposure to Kripke’s paradox.  

  ---

  ### **Handouts**  
  **Handout 1 (Given to all students at start):**  
  > **The Rule-Following Game**  
  > **Alphabet:** Only two symbols: `A` and `B`.  
  > **Rules:** A "rule" assigns `A` or `B` to any string of `A`s and `B`s (e.g., "AAAB" → `A`). Rules are defined *only* by examples—no formulas or abstract descriptions allowed.  
  >   
  > **Roles:**  
  > - **Inventor:** Creates a rule by writing 10 example string→output pairs. Use strings of lengths 1–10. Be consistent!  
  > - **Learner:** Uses these examples to predict outputs for new strings.  
  >   
  > **Scoring:**  
  > - You earn 1 point per match between the Learner’s prediction and the Inventor’s intended output.  
  > - The pair with the most points wins a prize (e.g., extra credit, snacks).  
  >   
  > **Rules of the Game:**  
  > 1. Inventors: Write your 10 examples on index cards. Do not explain your rule!  
  > 2. Learners: Study the examples. When tested, apply what you think the rule is.  
  > 3. We will resolve disagreements as a class.  

  **Handout 2 (Test for Learners/Inventors, distributed later):**  
  > **Apply the rule to these 5 new strings:**  
  > 1. `AABABB`  
  > 2. `BBABAA`  
  > 3. `ABBAAB`  
  > 4. `BAAABBB`  
  > 5. `ABBABAAB`  
  > Write `A` or `B` for each.  

  **Adjudication Prompt (Projected during class debate):**  
  > **Pair X’s Examples:**  
  > [List 5 of the pair’s 10 examples, e.g.,  
  > - `AA` → `B`  
  > - `ABB` → `A`  
  > - ...]  
  >   
  > **Disputed String:** `BAABAAB`  
  > - Learner’s answer: `A`  
  > - Inventor’s answer: `B`  
  > **Vote:** Which is correct? `A` or `B`?  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes**  

  | Time     | Activity                                                                                                                                 | Details                                                                                                                               |  
  |----------|------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|  
  | 0–5 min  | **Introduction**                                                                                                                         | - Divide into 7 pairs (14 students). Assign Inventor/Learner roles randomly. Distribute Handout 1.                                   |  
  |          |                                                                                                                                          | - Instruct: "Invent a rule using only your examples. No math, no formulas—just patterns!"                                            |  
  | 5–25 min | **Inventor Phase**                                                                                                                       | - Inventors create 10 example pairs on index cards (strings: lengths 1–10).                                                           |  
  |          |                                                                                                                                          | - **Example rule ideas (whispered to Inventors if stuck):** "Output `B` if odd # of `A`s; else `A`" or "`A` if string starts with `B`". |  
  |          |                                                                                                                                          | - Learners wait silently—no peeking!                                                                                                 |  
  | 25–35 min| **Learner Phase**                                                                                                                        | - Inventors hand examples to Learners. Learners study them.                                                                           |  
  |          |                                                                                                                                          | - Distribute **Handout 2**. Learners predict outputs for the 5 test strings.                                                          |  
  | 35–40 min| **Inventor Test Phase**                                                                                                                  | - Collect Learners’ answers. Give Handout 2 to Inventors. Inventors write their intended outputs for the same strings.                |  
  | 40–45 min| **Scoring & Tension**                                                                                                                    | - Pairs compare answers. Award 1 pt per match (max 5 pts).                                                                            |  
  |          |                                                                                                                                          | - **Key:** Identify 1–2 pairs with a disagreement on at least one string.                                                             |  
  | 45–55 min| **Adjudication**                                                                                                                         | - Project a disputed case (e.g., "Pair 3 disagrees on `BAABAAB`"). Show 5 of their examples, the string, and both answers.            |  
  |          |                                                                                                                                          | - **Debate:** "What should the output be? Discuss in pairs for 2 min."                                                                |  
  |          |                                                                                                                                          | - **Vote:** Show of hands for `A` or `B`. Majority wins. Adjust the pair’s score to match the verdict.                                |  
  | 55–70 min| **Debrief (Skeptical Paradox Revealed)**                                                                                                 | - Transition: "Why did we vote? What made the Learner’s answer *wrong*?"                                                              |  
  |          |                                                                                                                                          | - Map the activity to Kripke’s paradox (details below).                                                                               |  
  | 70–80 min| **Connect to Wittgenstein/Kripke**                                                                                                       | - Name the paradox. Explain quus, skeptical solution.                                                                                 |  
  |          |                                                                                                                                          | - **Final Q:** "If the community says `B`, but a ‘shadow rule’ says `A` for a giant string, who’s right?"                             |  

  ---

  ### **Debrief: Mapping Activity to Kripke’s Paradox**  
  **Debrief Script (55–70 min):**  
  1. **Normativity Question (5 min):**  
     - "When the Inventor said the Learner’s answer was wrong, what did that *mean*? Was it just 'I do it differently,' or was the Learner objectively incorrect?"  
     - **Activity Link:** The Inventor’s frustration ("That’s not what I meant!") reveals normativity—we treat rules as binding.  
     - **Paradox Link:** Kripke asks: What *makes* it wrong? Not just disagreement, but violation of a norm.  

  2. **Community Adjudication Tension (5 min):**  
     - "Why did the vote feel satisfying? Did it uncover the ‘true’ rule?"  
     - **Activity Link:** The class vote resolved the dispute—but it was just more behavior (raised hands).  
     - **Paradox Link:** Wittgenstein’s communal solution: Rules are fixed by collective agreement, not abstract truths.  

  3. **Shadow Rule & Indeterminacy (5 min):**  
     - "Imagine a shadow rule that matches all examples and all test strings we used today, but flips to `A` for any string over 1 million symbols. Could you prove it’s wrong?"  
     - **Activity Link:** No—you can’t compute it here. "More data" fails; the shadow rule is empirically indistinguishable.  
     - **Paradox Link:** Kripke’s skeptic: No fact about your past mental state fixes one rule over its shadow.  

  4. **Cost of Replies (5 min):**  
     - **Dispositional Reply (Bury it):** "The Inventor meant what they *would* do. But what if they’re disposed to err on long strings? And can’t we always invent a shadow disposition?"  
     - **Communal Reply (Wittgenstein/Kripke):** "The community decides. Cost: Truth collapses into agreement. The ‘wrong’ answer just loses the vote."  
     - **Realist Reply (Platonism):** "Rules are abstract objects. Cost: How does your mind ‘grasp’ it? Why not the shadow rule?"  

  ---

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong:**  
  1. **Overly Simple Rules:** Some Inventors may create trivial rules (e.g., "Always `A`"), making disagreements rare. *Mitigation:* Whisper complex rule ideas (e.g., parity-based) to Inventors during setup.  
  2. **Time Crunch:** Creating 10 examples may take >10 min. *Mitigation:* Use a timer; suggest pre-writing 2–3 examples as a template.  
  3. **Unclear Disagreements:** Learners might misapply rules randomly, not due to deep indeterminacy. *Mitigation:* Select pairs where the dispute reveals a pattern ambiguity (e.g., a string that could fit two rules).  

  **One Unreproducible Feature:**  
  - **The Necessity of Mathematical Rules:** The activity uses arbitrary, invented rules. Students may dismiss the paradox as "just a game," unlike the visceral certainty of math (e.g., "2+2=4"). *Supply in Your Words:*  
    > "In math, rules feel necessary—like ‘quus’ is unthinkable for addition. But Kripke’s point is that even math relies on finite training. Your certainty comes from community practice, not magic access to abstract objects. The skeptic whispers: ‘How do you know you didn’t mean quus?’"  

  ---

  This design forces students into the paradox’s core tension: Rules feel binding, yet their foundation crumbles under scrutiny. The shadow rule’s inaccessibility ensures "more data" fails, and the adjudication stage mirrors Wittgenstein’s communal solution—leaving students primed for the debrief’s revelation.
