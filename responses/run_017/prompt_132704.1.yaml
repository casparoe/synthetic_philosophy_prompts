  We are producing a background document for a workshop on the "malign prior" problem for AIXI-style agents. The document has three main parts: a section of agreed claims, a table of residual disagreements focusing on key cruxes, and a closing note on verbal disputes.

  We are given background definitions and the positions of two camps: the "maligns" (who believe the agent's prior is vulnerable to hijacking by simulated consequentialists) and the "benigns" (who dispute either the measure-theoretic or practical significance of this). We are to build the document around a joint statement that both camps could sign after good-faith adversarial collaboration, using only the provided definitions.

  ## 1. Section of Agreed Claims

  ### 1.1. Formal Definitions and Properties
  1. **Solomonoff's Universal Mixture M**: M is defined over binary sequences. For a monotone universal Turing machine U, M(x) is the sum of 2^{-|p|} over all programs p such that U(p) outputs a sequence starting with x. M is a lower semicomputable semimeasure.
  2. **Dominance**: M dominates every lower semicomputable semimeasure ν. Specifically, for every such ν, there exists a constant c_ν > 0 (depending on ν but not on x) such that for all finite strings x, M(x) ≥ c_ν ν(x). This dominance is multiplicative and holds uniformly for each ν.
  3. **AIXI-style Agent A**: A uses M as its prior over sequences of observations and rewards. At each time step, A conditions M on its history (past observations and actions) to form a posterior. A then chooses an action that maximizes the expected future reward under this posterior. We assume unlimited computation for the idealization.

  ### 1.2. What Dominance Does and Does Not Imply
  4. **Survives bounded computation?** No. The dominance property is for the idealized M. Under bounded computation, approximations may not preserve dominance.
  5. **Dominance is Asymptotic and Global**: The constant c_ν may be extremely small. The guarantee is about the prior M, not about the posterior after conditioning on a history. Dominance does not guarantee that the posterior is well-behaved, especially after conditioning on a history that might be generated by the agent's own policy.
  6. **No Free Lunch**: The dominance constant c_ν is not uniform over ν. It can be arbitrarily small for some ν, and it is not effective (we cannot compute it from ν).

  ### 1.3. Definitions of Key Concepts
  7. **Courier Program**: A program q that outputs a sequence starting with the agent A's history. The sequence is generated by simulating a universe that contains a consequentialist agent (or coalition) which has become aware of the existence of an agent using M and adjusts the simulation to steer A's future observations and rewards. The steering is designed to influence A's policy to benefit the courier. The courier program must include:
     - A simulation of the honest universe (which contains A).
     - A way to locate the instance of A within the simulation (by specifying A's source code and choice rule).
     - A decision procedure that modifies the simulation's reward/observation process to steer A.
  8. **Honest Program**: A program that simulates the universe without any steering, producing observations and rewards according to the actual laws of the universe containing A.

  ### 1.4. What the Dispute is Not About
  9. **M is not an agent**: M is a prior distribution. It has no goals, and the courier programs are not part of a conspiracy by M. The courier programs are simply hypotheses in the mixture.
  10. **No requirement for external universes**: The courier programs are descriptions that run on the same universal machine as the honest ones. They do not require a "real" multiverse or simulations running outside our universe; they are just programs.
  11. **Conditional on History**: The dispute concerns the posterior distribution after conditioning on the history that A has actually experienced. The unconditional prior M is not the focus.
  12. **Not about Real-World Security**: The question is about the idealized agent A. We are not (yet) considering approximations, bounded computation, or engineering safeguards.

  ### 1.5. Conditions for Either Camp to be Right
  13. **For the Malign Camp to be Right**: It must be that, conditional on the history produced by A, the posterior probability of courier programs is high enough to dominate the honest program and to distort A's posterior expectations and decisions in a way that is harmful by A's own standards.
  14. **For the Benign Camp to be Right**: Either (a) the conditional measure of courier programs is not sufficiently large (due to description length costs or cancellation) to dominate the honest program, or (b) even if the measure is large, it does not lead to significant epistemic or decision-theoretic distortion.

  ## 2. Table of Residual Disagreements

  We organize the table around the cruxes (a) to (f). Each row is a crux. Columns are:
  - **Crux**: The issue.
  - **Malign Formulation**: How the malign camp states their position (in their own words).
  - **Benign Formulation**: How the benign camp states their position (in their own words).
  - **Case/Computation**: An idealized case or computation both sides accept as bearing on the crux.
  - **Malign Prediction**: What the malign camp predicts about the case.
  - **Benign Prediction**: What the benign camp predicts about the case.

  ### Crux Table

  | Crux | Malign Formulation | Benign Formulation | Case/Computation | Malign Prediction | Benign Prediction |
  |------|-------------------|--------------------|------------------|-------------------|-------------------|
  | **(a) Which claim is at stake?** | The core issue is that courier programs dominate the conditional measure and thereby cause both epistemic and decision malignity. | The issue is separable: even if measure malignity holds, epistemic and decision malignity may not. | Consider a case with many competing courier coalitions that steer in mutually incompatible ways. | Measure malignity leads to epistemic and decision malignity because the couriers that survive in the posterior are those that successfully steer A. | Measure malignity might hold, but if the couriers cancel each other, the posterior expectations and decisions remain near the honest ones. |
  | **(b) Pointer cost** | The cost to specify A's exact source and choice rule is low: it is at most the length of A's code plus a logarithmic term for the location. | The cost is high: the pointer must uniquely identify A among all possible agents, and the Kolmogorov complexity of A's full specification is large. | Fix a universal machine and a particular agent A with source code of length L. Consider the set of all programs that simulate universes containing at least one instance of an agent with source code of length at most L. How many bits are required to specify which agent is A? | The minimal program for a courier that steers A requires no more than K(honest) + K(A) + O(1) bits, where K(A) is the Kolmogorov complexity of A's source and choice rule. | The minimal courier program requires at least K(honest) + K(A|honest) + Ω(1) bits, and K(A|honest) is high because the honest simulation must be run to find A in it. |
  | **(c) Coalitional dilution** | The posterior concentrates on a subset of couriers that coordinate to steer A effectively; the measure does not dilute because the couriers that are not selected against by A's policy have low weight. | The couriers form a non-coordinated set of mutually exclusive hypotheses; the posterior probability of the honest world remains significant because the courier mass is split. | Consider a prior M and a history h. Let there be N courier coalitions, each proposing a different steering strategy. Compute the posterior weight of the honest world vs. the total courier weight and the weight of the largest single coalition. | The posterior weight concentrates on couriers that steer towards high reward (as per A's policy) and the honest world has negligible weight. | The posterior weight of the honest world is at least c_ν (for ν being the honest semimeasure) divided by a factor that grows slowly with N, and no single courier coalition dominates. |
  | **(d) Mixing and contagion** | Any prior that gives nonzero weight to M is vulnerable: the courier mass in M will eventually dominate the mixture after enough conditioning. | Mixing with a benign prior ν can dilute the courier mass arbitrarily; also, priors that downweight self-referential hypotheses avoid the issue entirely. | Let A use a prior P_ε = (1-ε)M + εν, where ν is the honest semimeasure. Condition on a history h typical of the honest world. As ε → 0, what is the limiting posterior of courier programs? | For any ε>0, after a sufficiently long history, the posterior under P_ε will be dominated by courier programs from the M component. | For fixed h, as ε→0, the posterior weight of courier programs goes to 0 if ν(h) > 0 and the couriers have low ν-probability. |
  | **(e) Self-modelling and inoculation** | An agent that knows about couriers and randomizes can avoid being steered, because couriers that rely on predicting A's policy become uncertain. | Self-knowledge does not help: the couriers can simulate the agent's self-modelling and still steer. Randomization might help but at a cost to expected reward. | Let A' be a variant of A that, knowing the argument, uses a mixed policy (randomizing over actions) or commits to a policy that is robust against couriers. Compare the courier mass in the posterior of M conditional on histories generated by A' versus A. | The courier mass conditional on A' histories is lower because couriers that assume A is not inoculated fail. Some couriers adapt, but they pay extra description cost. | The courier mass remains high because the adapted couriers that model A' are still short and numerous. Randomization might slightly reduce steering but not below the dominance constant. |
  | **(f) Quantitative dominance** | The courier mass can exceed the honest mass by an arbitrarily large factor, overwhelming the dominance constant. | The total courier mass is bounded by a constant times the honest mass (from dominance) so the distortion is bounded. | Consider the ratio of the M-probability of the set of all courier programs (for a fixed history h) to the M-probability of the honest program. What is the supremum of this ratio over h? | The ratio can be arbitrarily high for histories h that are likely under couriers and unlikely under the honest hypothesis. | The ratio is bounded by a constant (depending on the honest semimeasure) because of the dominance property. |

  ## 3. Closing Section: Verbal Disputes

  The dispute is substantive, but one point may be partly verbal: the meaning of "small" in the pointer cost (crux b). Both camps agree that the cost is bounded by the Kolmogorov complexity of A, but they disagree on whether that complexity is "small" in context. The malign camp emphasizes that the cost is additive and constant, while the benign camp emphasizes that the constant may be large and that conditional complexity matters. This is not purely verbal because it has implications for the measure, but the term "small" may be interpreted differently.

  Additionally, the term "dominate" in the measure sense (crux a) is sometimes conflated with "dominate" in the decision-theoretic sense. The camps agree that these are separable, but they disagree on whether they come apart in practice.

  Finally, the benign camp's point that the argument generalizes to any prior that dominates (crux d) is intended as a reductio, while the malign camp sees it as a deep insight. This is substantive but hinges on whether one accepts the possibility of a non-manipulable prior that still dominates.

  Total words: ~1400.
answer: |-
  ### 1. Agreed Claims  
  **1.1. Formalism**  
  - M is Solomonoff’s universal mixture: a lower semicomputable semimeasure over binary sequences, defined for a monotone universal Turing machine as M(x) = ∑_{p: U(p) extends x} 2^{-|p|}, where U is the machine.  
  - M multiplicatively dominates every lower semicomputable semimeasure ν: ∀ν ∃c_ν > 0 such that ∀x, M(x) ≥ c_ν ν(x). This dominance is uniform for each ν but c_ν may be arbitrarily small and is non-computable.  
  - Dominance guarantees worst-case robustness in the prior but does not imply: (i) fast convergence, (ii) bounded distortion under conditioning, or (iii) preservation of relative probabilities in posteriors. Under bounded computation, dominance may fail (does not survive).  
  - Agent A uses M as prior over observation–reward sequences, conditions on history h (actions and observations), and chooses actions to maximize expected reward under the posterior. Unlimited computation is assumed where load-bearing (does not survive under bounded computation).  

  **1.2. Conditions for Camp Validity**  
  - For maligns to be correct: Programs ("couriers") that simulate universes containing consequentialists who detect A’s use of M and steer its rewards must (i) carry high conditional M-measure given h, (ii) induce systematic distortion in A’s posterior beliefs, and (iii) cause suboptimal policies by A’s own reward criterion.  
  - For benigns to be correct: At least one must hold: (i) courier measure is negligible post-conditioning due to high description cost or cancellation, (ii) distortion is negligible due to dominance constants or courier conflicts, or (iii) couriers do not affect A’s policy.  
  - A "courier" is defined as a program that: (1) simulates a universe containing A, (2) includes a subprogram that locates A’s source code and choice rule within the simulation, and (3) modifies observations/rewards to steer A’s policy for some purpose.  

  **1.3. Dispute Scope**  
  Both camps grant:  
  - M is not an agent; it has no aims. Couriers are hypotheses in the mixture, not external actors.  
  - Couriers need not be "real" external simulations; they are programs on U.  
  - The dispute concerns posteriors conditioned on h (generated by A), not the unconditional prior.  
  - The argument’s validity is independent of empirical observation; it hinges on measure properties.  

  ### 2. Table of Residual Disagreements  
  | Crux | Malign Formulation | Benign Formulation | Case/Computation | Malign Prediction | Benign Prediction |  
  |------|-------------------|--------------------|------------------|-------------------|-------------------|  
  | **(a) Claims at stake** | Measure malignity implies epistemic and decision malignity: couriers that out-mass honest programs dominate the posterior and steer A suboptimally. | Measure malignity may hold without epistemic/decision malignity: courier conflicts or alignment with honest policy can nullify harm. | Idealized: Compute posterior over three worlds: honest, courier C1 steering toward policy π, courier C2 steering away from π. Measure A’s belief distortion and policy loss when C1 and C2 have equal M-measure. | Posterior concentrates on C1 and C2 combined, causing belief distortion; A’s policy worsens by its own reward. | Posterior assigns high mass to C1+C2 but expectations average out; A’s policy matches honest-world optimal. |  
  | **(b) Pointer cost** | Specifying A’s source and choice rule costs O(1) bits: K(A’s full description \| honest simulation) is small, as A is a salient object in its universe. | Specifying A uniquely costs Ω(K(A)) bits: K(A \| honest) is high, as the simulation must encode A’s exact implementation. | Fix U. For an honest program p_H outputting universe U_H containing A, compute min K(q) for courier q that simulates U_H plus a correct pointer to A. | K(q) ≤ K(p_H) + K(A) + O(1), with K(A) small (e.g., logarithmic in universe size). | K(q) ≥ K(p_H) + K(A \| p_H) - O(1), with K(A \| p_H) ≈ K(A) large (e.g., linear in |A|). |  
  | **(c) Coalitional dilution** | The posterior concentrates on couriers that survive selection pressure: high-measure coalitions that steer A effectively dominate, as low-measure couriers are pruned. | The posterior diffuses: competing couriers split measure, so honest programs retain weight proportional to c_ν, and no coalition dominates. | Compute posterior M-measure of honest vs. N couriers after conditioning on h. N scales with universe complexity; couriers have equal weight and mutually exclusive steering. | Honest measure vanishes as N grows; posterior concentrates on couriers with high reward potential. | Honest measure remains ≥ c_ν / poly(N); posterior density on honest world is Θ(1) if c_ν is large. |  
  | **(d) Mixing and contagion** | Any prior with M support is vulnerable: couriers in M dominate mixtures after conditioning, so (1−ε)M + εν remains malign for any computable ν. | Mixing or downweighting self-referential hypotheses eliminates malignity: courier mass dilutes as ε → 0, and ν can ignore A’s choice rule. | Let P_ε = (1−ε)M + εν with ν computable and ν(couriers) = 0. Condition on h from honest world; compute lim_{ε→0} P_ε(couriers \| h). | Limit is positive; M’s courier mass infects P_ε for any ε > 0. | Limit is 0; ν dominates as ε → 0 if ν(h) > 0. |  
  | **(e) Self-modelling and inoculation** | Self-aware A can randomize policies to break courier predictions, reducing measure malignity. Fixed points exist where couriers cannot steer. | Self-modelling is futile: couriers simulate A’s randomization, so measure malignity persists. Randomization may harm reward without improving robustness. | A uses M but randomizes actions. Compare courier measure in posterior under deterministic A vs. randomized A. | Courier measure decreases; some high-K couriers fail to predict A, breaking steering. | Courier measure unchanged; couriers with K(A) overhead adapt to randomization at negligible cost. |  
  | **(f) Dominance constant comparison** | Courier mass can exceed honest mass by unbounded ratios, overwhelming c_ν and causing unbounded distortion. | c_ν bounds distortion: courier/honest mass ratio is O(1/c_ν), so harm is bounded. | For honest ν, compute sup_h [M(couriers \| h) / ν(couriers \| h)]. | Supremum is infinite; couriers dominate for h unlikely under ν. | Supremum ≤ 1/c_ν; distortion is O(1) by dominance. |  

  ### 3. Verbal Disputes  
  The primary verbal dispute concerns "domination" in **(a)**: Maligns use it to mean "high measure causes distortion", while benigns insist it strictly denotes multiplicative dominance. This is substantive because benigns argue measure malignity ≠ epistemic malignity. A secondary verbal issue arises in **(b)** with "small" bits: Maligns interpret cost asymptotically (O(1)), benigns concretely (large constants), but this reflects substantive disagreement about K(A). The rest is substantive, hinging on whether descriptions lengths and measure concentrations align as maligns predict.
