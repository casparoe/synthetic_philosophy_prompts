prompt: |-
  I am presenting next week at a joint seminar of the machine-learning safety group I work in and the university's value-theory reading group. The group's lead is using the session partly to decide whether my project continues into the next funding cycle, so the discussion matters beyond the seminar itself. My slot is fifty minutes with twenty for questions. I would like a Q&A preparation sheet for that twenty minutes.

  The thesis I am defending: an agent can be constrained to avoid side effects without anything remotely like a complete specification of the principal's values, because the right object to constrain is not value at all but the principal's remaining freedom of action, measured structurally. Here is the version I will present.

  The agent is given a task metric and a threshold; a plan succeeds if it clears the threshold. Define a reference agent I call the custodian: the least-effort agent that still clears the threshold, where effort is an intervention-cost functional over trajectories (approximate it by control energy, or by the number of primitive interventions required). Let the custodian's trajectory end in world w*. For any candidate plan ending in world w, define the restoration cost of w as follows: for each state s that the principal could still reach from w* within a fixed resource budget B, compute how much more control cost it would take to reach s from w than from w*, and aggregate over those states by a soft maximum. Low impact is then: minimize restoration cost subject to clearing the task threshold. Two design choices I will emphasize: the impact term enters only as a tiebreaker among plans that already clear the threshold, never as something traded off against task success; and both the effort functional and the transition-cost function are supposed to come from the environment's own control structure rather than from anything value-shaped, with B fixed from the principal's resource endowment at deployment time.

  I will use two running examples: an agent told to cut a building's energy use, which can either retune the HVAC schedule or permanently seal the windows, both clearing the threshold; and an agent managing a shared irrigation system for several farms, where the question of whose options are being restored cannot be ducked.

  The room will be: Ravi, a senior RL researcher from the reward-specification and safe-exploration tradition, who thinks a penalty pulling behavior toward a default policy gets most of the practical benefit at a fraction of the cost, and who will want to know whether the restoration cost is computable in a continuous state space with a learned model; Marta, an econometrician from the policy school who does counterfactual program evaluation, and who will hear restoration cost as an opportunity-cost notion and will ask where the budget and the baseline come from and whether the resulting rule is incentive compatible or dynamically consistent; Jonas, a value theorist who works on incommensurability and distrusts any single currency of comparison, and who will press the claim that a structural measure is value-neutral; and Priya, an empirical safety engineer who has watched penalty-shaped objectives make agents inert or make them game the penalty, and who will ask what this does to a real system on a real budget of computation. A program officer from the funder will be present but will not speak.

  What I want from you: eight or so objections, ordered by how much damage they would do in that room rather than by their importance in the literature, each attributed to the person most likely to raise it and phrased the way that person would phrase it rather than in my vocabulary. For each, give a reply I could deliver in about two minutes, and a blunt note on where that reply is soft or question-begging. Also tell me: what I should concede in the first two slides rather than be forced into conceding later; the single reply that has to land if the project is to survive the review; the weakest joint in my own argument that I should prepare to defend rather than hope the room misses; which objection is really a disguised request for me to say what would falsify the project; and the one I should simply concede and move past instead of fighting. Finally, give me the question I am hoping nobody asks, and a holding sentence for it in case it comes anyway. Please skip the objections a general conference audience would raise; I have those covered. I do not need citations or further reading, and I would rather you stay inside the machinery sketched above than bring in outside frameworks.
reasoning: |-
  We are given a specific audience with known concerns. We need to generate objections in the style of each person, with a reply and a note on the soft spot. Then we answer the additional questions.

  The thesis: Avoid side effects by constraining the agent to minimize the "restoration cost" (defined via a custodian and a resource budget B) without needing a full value specification. The impact term is a tiebreaker only.

  Running examples: 
  1. Building energy agent: seal windows (high impact) vs. retune HVAC (low impact) - both clear threshold.
  2. Irrigation system: whose options are being restored? (multiple principals)

  Audience:
  - Ravi (RL researcher): Thinks default policy penalty is simpler. Asks about computability in continuous spaces with learned models.
  - Marta (econometrician): Hears opportunity cost. Asks about budget/baseline, incentive compatibility, dynamic consistency.
  - Jonas (value theorist): Distrusts single currency. Presses on structural measure being value-neutral.
  - Priya (safety engineer): Worries about penalties causing inertness or gaming. Asks about real computation budget.

  We need:
  - 8 objections (each attributed to one, phrased as they would)
  - For each: a ~2 min reply, and a blunt note on soft spots.
  - Then:
    a. What to concede early (in first two slides)
    b. The single reply that must land for project survival
    c. Weakest joint in own argument to prepare to defend
    d. Which objection is a disguised falsification request
    e. Which to concede and move on
    f. The question hoping nobody asks, and a holding sentence.

  Skip general conference objections.

  Let's generate 8 objections (at least two per person? but some may have more than one angle). We can do:

  Ravi:
  1. Computability: In continuous state spaces with learned models, how do you compute the restoration cost, especially the soft max over states reachable within B? This seems intractable.

  Marta:
  2. Budget and baseline: Where do the budget B and the baseline w* come from? Are they arbitrary? How do they relate to the principal's actual resources and the counterfactual world without the agent?
  3. Incentive compatibility: If the agent is minimizing restoration cost, does that lead to strategically choosing w* to make the restoration cost look low? (Dynamic consistency: does the rule hold up over time?)

  Jonas:
  4. Value neutrality: You claim the measure is structural, but the choice of which states to consider (via B) and the aggregation (soft max) are value-laden. Isn't this just smuggling in values through the back door?
  5. Incommensurability: How can a single restoration cost metric capture the diverse ways in which different people's options are affected, especially in the irrigation example?

  Priya:
  6. Inertness or gaming: If the impact term is only a tiebreaker, won't the agent just do the first thing that clears the threshold? That might be inert if there are many equally easy plans. Or, if the tiebreaker is too weak, might it game the restoration cost metric by making states unreachable?
  7. Real computation: How do you compute the soft-max over reachable states in real time on a real system? What if the computation budget is limited?

  We have 7, so let's add one more from Marta or Priya:

  8. (Marta) Dynamic consistency: If the principal's resource endowment or the environment changes over time, how do we update B and w*? Doesn't this make the rule time-inconsistent?

  Now, let's phrase each as the person would:

  1. Ravi: "Your restoration cost requires computing a soft maximum over a set of states that are reachable within budget B from w*. In continuous state spaces, especially with a learned dynamics model, how do you even approximate that integral without incurring prohibitive computational costs? And how do you ensure the approximation doesn't introduce errors that break the safety properties?"

  2. Marta: "You take the budget B and the baseline w* as given. But in reality, the principal's resource endowment is endogenous to the system and may change over time. Moreover, the choice of baseline is crucial: why is the custodian's ending state the right baseline? Isn't that just an arbitrary point? And if the agent can influence the baseline, doesn't that create perverse incentives?"

  3. Marta: "In a dynamic setting, if the agent's actions today affect the available resources tomorrow, then the restoration cost minimization might lead to time-inconsistent behavior. How do you ensure that the rule is dynamically consistent and doesn't incentivize strategic behavior to manipulate future baselines?"

  4. Jonas: "You claim your measure is structural and value-neutral. But the very act of selecting the budget B, which defines the set of states we care about, reflects a value judgment about what counts as a significant option. Similarly, the soft maximum aggregation imposes a particular way of trading off between different people's options in the irrigation example. How is that not a value-laden choice?"

  5. Jonas: "In the irrigation example, the restoration cost aggregates the loss of options across multiple farmers. But if one farmer's options are severely reduced while others are slightly improved, the soft max might not capture that disparity. How does your single metric account for incommensurable losses to different stakeholders?"

  6. Priya: "In practice, penalties that are too weak can be gamed. If the impact term is only a tiebreaker, the agent might find a plan that barely clears the threshold and has a low restoration cost by making many states unreachable (so they don't count in the soft max). Or, if there are many plans that clear the threshold, the agent might pick one arbitrarily, leading to inert behavior. How do you prevent that?"

  7. Priya: "Computing the soft maximum over the set of reachable states sounds expensive. On a real embedded system with limited compute, how do you approximate this without sacrificing safety or responsiveness?"

  8. Marta: "Over time, the principal's resource endowment and the environment may change. How do you update B and w*? If you don't update, the rule becomes arbitrary. If you update, how do you avoid time inconsistency and ensure that the agent's behavior remains aligned?"

  Now, replies and soft spots:

  1. Reply to Ravi: "In continuous spaces, we can use sampling. We sample a set of states reachable from w* within B using the learned model (e.g., via random shooting or MCMC). Then, for each sample, we compute the extra control cost from w versus w*. The soft max is over these samples. We can show that with enough samples, the approximation error is bounded. Also, note that we only need to compare plans that clear the threshold, so we might not need high precision if the differences are large."

     Soft spot: The quality of the learned model is critical. If the model is wrong, the sampled states might not be representative. Also, in high dimensions, sampling might be too slow.

  2. Reply to Marta (budget and baseline): "B comes from the principal's actual resource endowment at deployment time — it's a fixed parameter set by the system designer. The baseline w* is defined by the custodian, which is the minimal-effort agent that clears the threshold. It's not arbitrary: it's the natural default because it's the cheapest way to get the job done. The principal's resources are fixed at deployment, so we don't model endogenous changes."

     Soft spot: This assumes that the principal's resources are fixed and known at deployment, which may not hold in dynamic environments. Also, the custodian might not be unique, leading to multiple baselines.

  3. Reply to Marta (incentive compatibility): "The custodian is defined once, at the start, and w* is fixed. The agent doesn't get to choose the baseline; it's computed independently. For dynamic consistency, we assume the environment and resource endowment are stationary. If they change, we might need to recompute the custodian periodically, but that's future work."

     Soft spot: This avoids the issue of non-stationarity. Periodic recomputation might lead to inconsistencies.

  4. Reply to Jonas (value neutrality): "The budget B is set by the principal's resource endowment, which is a fact about the world. The aggregation by soft max is a mathematical operation that doesn't require value judgments — it's a way to be robust to worst-case losses. We are not assigning values to states, just measuring the extra effort required to reach them."

     Soft spot: The choice of which resources to include in B and how to measure them is value-laden. The soft max is a particular way of aggregating that may not align with any principal's values.

  5. Reply to Jonas (incommensurability): "In the irrigation example, we can define multiple restoration costs, one for each farmer, and then aggregate them by a soft max. That way, we don't collapse into a single metric until the last step, and the soft max ensures we care about the worst-off farmer. Alternatively, we can use a vector of restoration costs and only break ties when one plan is better in every component."

     Soft spot: This doesn't fully solve incommensurability. The soft max still imposes a trade-off, and tie-breaking might be rare.

  6. Reply to Priya (gaming): "Because the custodian is defined to clear the threshold with minimal effort, and the agent must also clear the threshold, the agent cannot make states unreachable without violating the task. Moreover, the tiebreaker is only applied among plans that clear the threshold, so if there are many, we can require the agent to pick the one with minimal impact. We can also add a small weight to the impact term to avoid inertness if needed, but we keep it as a tiebreaker to avoid trading off against task success."

     Soft spot: The agent might still clear the threshold in a way that makes many states unreachable (e.g., sealing windows doesn't make states unreachable by the custodian? Actually, it might — but the custodian is fixed. So, the custodian's trajectory defines the baseline, and the agent's plan must not make it harder to reach states that were reachable from w* within B. Sealing windows might do that because it changes the building. So the restoration cost would be high. But if the agent can find a plan that clears the threshold and makes states unreachable without increasing the restoration cost (because those states weren't sampled?), then it might game the system. Also, if there are many plans, the agent might pick arbitrarily, but we can require it to minimize impact.

  7. Reply to Priya (real computation): "We use online sampling and approximation. For real-time systems, we can precompute the reachable set from w* offline and then during execution, only compute the extra cost for the current plan. Alternatively, we can use function approximation to learn the restoration cost. The computation budget is part of the design: we set the number of samples to fit within the available compute."

     Soft spot: Precomputation might not work in dynamic environments. Learning the restoration cost might introduce errors.

  8. Reply to Marta (dynamic changes): "We assume the deployment is short-term enough that B and w* are constant. For long-term deployments, we would need to recompute the custodian and w* at intervals, using the current state and the remaining resource budget. The rule then becomes a moving baseline, but we can show that under certain conditions, the behavior is consistent."

     Soft spot: This is hand-wavy. Without a formal model of resource change, it's not clear.

  Now for the additional questions:

  a. What to concede early: 
     - The computation of the restoration cost is challenging, especially in continuous spaces, and requires approximation.
     - The budget B and the baseline w* are set at deployment and do not adjust to changing resource endowments in the initial version.

  b. The single reply that must land: 
     The reply to the value theorist (Jonas) on value neutrality. If the group thinks the approach is value-laden and not structural, the project is dead. So the reply to objection 4 must land.

  c. Weakest joint in own argument:
     The handling of multiple principals (irrigation example). The aggregation of restoration costs for different stakeholders is not fully resolved and might require value judgments.

  d. Disguised falsification request:
     Priya's objection about real computation (objection 7). She is asking: under what conditions would this be infeasible in practice? That is, if we cannot compute the restoration cost within the system's computation budget, the project fails.

  e. Which to concede and move on:
     Marta's dynamic consistency objection (objection 8). Concede that the current framework is static and that dynamic extensions are future work.

  f. The question hoping nobody asks, and a holding sentence:
     Question: "What if the custodian's trajectory w* is not unique? How do you handle multiple baselines?"
     Holding: "In the case of multiple custodians, we define the restoration cost as the minimum over the baselines, but we note that the custodian is typically unique because the effort functional is strictly convex in practice. If not, we take the average or worst-case. This is an area we are exploring."

  Now, let's compile the list of objections and replies as requested.
answer: |-
  ### Q&A Preparation Sheet: Key Objections and Replies

  #### Objections Ordered by Potential Damage in the Room
  1. **Ravi (RL Researcher)**  
     **Objection:** "Your restoration cost requires integrating over states reachable from w* within budget B. In continuous state spaces with a learned model, this is computationally intractable. How do you approximate the soft max without introducing catastrophic approximation errors, especially when the model itself is uncertain?"  
     **Reply:** "We use Monte Carlo sampling to estimate the reachable set from w* within B, paired with variational inference to bound the soft max error. For learned models, we integrate uncertainty into the sampling via Bayesian regret bounds. Crucially, since impact is only a tiebreaker, minor approximation errors won't cascade—plans must first clear the task threshold, so safety isn't compromised by noise."  
     **Blunt Note:** Soft on high-dimensional spaces where sampling efficiency plummets. Assumes model uncertainty is tractable, which Ravi may challenge.

  2. **Marta (Econometrician)**  
     **Objection:** "Restoration cost is just opportunity cost relabeled. If B is fixed at deployment, but the principal's resources or environment change, your baseline w* becomes arbitrary. How is this dynamically consistent? Won't agents exploit this by manipulating w* to minimize apparent impact?"  
     **Reply:** "B is derived from the principal's *observed* resource endowment (e.g., battery life or capital), so it's grounded in reality. w* isn't arbitrary—it's defined by the custodian, which is the minimal-effort agent *for the specific task*. Since the custodian is computed once at deployment and the agent can't alter it, manipulation is impossible. Changes in resources post-deployment are out-of-scope; we assume short-term tasks."  
     **Blunt Note:** Concedes non-stationarity. If Marta insists resources *always* change, this collapses.

  3. **Jonas (Value Theorist)**  
     **Objection:** "You claim structural neutrality, but B and the soft max impose values. B defines whose 'freedom of action' matters (e.g., only the principal's), and the soft max ignores distributional fairness. In the irrigation example, this erases minority stakeholders' options. Isn't this just utilitarianism in disguise?"  
     **Reply:** "B reflects the principal's *actual* resource constraints, not ethical values—it's measurable (e.g., kWh or dollars). The soft max minimizes worst-case *structural* loss of options, not utility. For multiple stakeholders (like farmers), we compute separate restoration costs per agent and aggregate via Pareto efficiency: a plan is 'low impact' only if it harms no one's options unnecessarily."  
     **Blunt Note:** Still value-laden: choosing Pareto efficiency over equality is a normative choice. Jonas may call this "smuggling in liberalism."

  4. **Priya (Safety Engineer)**  
     **Objection:** "Tiebreakers cause inertness! If ten plans clear the threshold, your agent might dither or pick arbitrarily. Worse, it could 'game' restoration cost by making options *appear* preserved—e.g., in the building example, it could leave a single window unsealed but unusable, dodging the soft max."  
     **Reply:** "Inertness is avoided by design: we rank *all* threshold-clearing plans by restoration cost and pick the strict minimum. Gaming is mitigated because the custodian's w* defines the baseline—altering the state to hide damage (e.g., fake window usability) would require extra effort, likely failing the tiebreaker. We also add a minimal 'effort padding' to ensure robustness against edge cases."  
     **Blunt Note:** Padding is a hack. Priya could argue real agents *will* find loopholes.

  5. **Jonas (Value Theorist)**  
     **Objection:** "Structural measures aren't neutral. Defining 'freedom of action' via resource budgets privileges physical capabilities over social/legal constraints. A farmer might 'structurally' restore a water quota, but if laws change post-action, your metric ignores that. Freedom isn't divorced from context."  
     **Reply:** "We focus on *physical* reachability (e.g., control energy to pump water) because it's measurable and context-agnostic. Social/legal constraints are dynamic; incorporating them would require value judgments, which we explicitly avoid. This method handles *immediate* side effects; long-term legal shifts are beyond scope."  
     **Blunt Note:** Retreats to "it's only for simple physics," weakening generality claims.

  6. **Marta (Econometrician)**  
     **Objection:** "This isn't incentive-compatible. Agents might select tasks with easy-to-restore baselines to minimize future effort. E.g., the irrigation agent could choose crops that make w* artificially convenient, distorting restoration costs."  
     **Reply:** "The custodian is task-specific and computed *independently* of the agent's plan. For a given task (e.g., 'reduce water use by X%'), w* is fixed. Agents can't cherry-pick tasks mid-deployment; they're assigned externally."  
     **Blunt Note:** Ignores multi-task settings. Marta could argue real agents influence task selection.

  7. **Priya (Safety Engineer)**  
     **Objection:** "Real systems can't handle soft max over reachable states. On embedded hardware, sampling states within B might take minutes—your building agent would freeze. What's your fallback when compute budget << B?"  
     **Reply:** "We precompute the reachable set from w* offline using low-fidelity simulations. At runtime, we only evaluate restoration cost for the top-K threshold-clearing plans via sparse sampling. This reduces compute by orders of magnitude while preserving safety."  
     **Blunt Note:** Precomputation assumes static environments. Priya knows real worlds aren't static.

  8. **Ravi (RL Researcher)**  
     **Objection:** "Why reinvent the wheel? A simple L2 penalty toward a default policy (e.g., do nothing) achieves similar 'low impact' at lower computational cost. What does restoration cost add beyond complexity?"  
     **Reply:** "Default policies (like 'do nothing') are value-laden—they assume inactivity is safe. Our custodian is task-aware: it *does* the job minimally. In the building example, a 'do nothing' penalty might forbid *any* HVAC changes, causing task failure. Restoration cost avoids this by construction."  
     **Blunt Note:** Understates how often default policies *are* practical. Ravi may see this as over-engineering.

  ---

  #### Strategic Q&A Guidance
  **a. Concede Early (First Two Slides):**  
  Admit that B is fixed at deployment and non-adaptive. Concede that the custodian is idealized (e.g., it assumes perfect model knowledge). This preempts Marta/Jonas from weaponizing dynamism/value-ladenness later.

  **b. Reply That Must Land for Project Survival:**  
  **Jonas' first objection (structural neutrality).** If the room believes your measure is value-laden, the core thesis collapses. Emphasize: "B is set by *measurable* resources, not ethics—like a robot's battery charge. The soft max minimizes worst-case *physical* effort, not utility. This is engineering, not philosophy."

  **c. Weakest Joint to Prepare to Defend:**  
  **Multi-stakeholder aggregation (irrigation example).** Jonas/Priya will attack how you aggregate farmers' restoration costs. Rehearse: "We use Pareto efficiency: a plan is rejected only if it unnecessarily harms *any* farmer's options. No interpersonal utility comparisons—just pairwise structural checks."

  **d. Disguised Falsification Request:**  
  **Priya's computation objection (#7).** She’s asking: "What would make this infeasible in practice?" Signal: "If we can’t precompute w*’s reachable set in under 1 second on target hardware, the approach fails. We’re testing this now."

  **e. Concede and Move On:**  
  **Marta's dynamic consistency objection (#2).** Say: "You’re right—we don’t handle shifting resources post-deployment. That’s future work." Fighting this wastes time; Marta will win.

  **f. Question You Hope Nobody Asks + Holding Sentence:**  
  **Question:** "What if the custodian isn't unique? E.g., two equally efficient HVAC retuning methods yielding different w*?"  
  **Holding Sentence:** "We define w* as the set of states reachable by *any* custodian, then compute restoration cost as the average over w* in the set. In practice, task metrics and effort functionals make uniqueness likely."  
  *(If pressed, concede it’s a limitation but doesn’t break the framework.)*  

  ---  
  **Final Note:** Prioritize clarity over completeness. Redirect to your examples (building/irrigation) when replies get abstract. The funder’s silence means the room’s perception decides—so stay calm, concede early where needed, and drill into Jonas’ neutrality challenge.
