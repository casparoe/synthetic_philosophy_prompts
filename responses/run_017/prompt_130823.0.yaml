  - A norm of assertion must explain why we criticize some assertions and not others.
  - The hearer's perspective matters in evaluating assertions.

  We must have 12-16. Let me draft:

  1. The two norms (knowledge and reasonable belief) yield the same verdict in the vast majority of ordinary central cases. Therefore, the evidential weight of the practice must rest on the divergence cases.

  2. The unassertability of Moore-paradoxical conjunctions (e.g., "It is raining but I don't believe it is") is a datum that any norm must explain, but it does not by itself settle which norm is correct because both norms can explain it (though in different ways).

  3. The reluctance to flat-out assert lottery propositions (e.g., "Your ticket has lost") on purely statistical grounds is another datum that both norms must explain, and it does not by itself settle the debate.

  4. When evaluating an assertion, we can distinguish at least three kinds of negative verdicts: 
     - "Improper" (the speaker ought not to have made the assertion; it is criticism-worthy),
     - "Defective" (the assertion fails to meet the governing standard but the speaker is not at fault, e.g., because of misleading evidence),
     - "Infelicitous" (the assertion is in some other way off, e.g., irrelevant, insincere, or violating a conversational rule). 

  5. A significant portion of the recorded disagreement in the literature (which we are not appealing to, but we note the phenomenon) may stem from a mismatch in which verdict is being asked for in a given example.

  6. The practice of assertion is governed by norms that apply not only to flat-out assertions but also to hedged (e.g., "I think that p"), prefaced (e.g., "I heard that p"), and relayed speech (e.g., "They say that p"). A complete account of the norm of assertion must explain how these related speech acts connect to the norm for flat-out assertion.

  7. The practice of assertion has a point or function, such as knowledge transmission, true-belief transmission, evidence pooling, or creating a common deliberative record. This point constrains which norms can govern the practice, even though we disagree about what exactly the point is.

  8. A norm of assertion must be such that it explains why we sometimes criticize an assertion even when the speaker has done their best with the evidence available to them (which might point to a knowledge norm) and why we sometimes do not criticize an assertion when the speaker had strong evidence but was wrong (which might point to a reasonable belief norm).

  9. The hearer's perspective is relevant: an assertion invites the hearer to take up the content in a way that is appropriate only if the norm is satisfied.

  10. The norm for flat-out assertion is distinct from the norm for other speech acts (e.g., conjecturing, guessing). Flat-out assertion carries a stronger commitment.

  11. In cases of reasonable false belief, the assertion is in some way flawed, but we may disagree on whether it is improper or merely defective.

  12. The norm of assertion must be such that it is possible for ordinary speakers to follow it without extraordinary epistemic conditions. (This might be agreed due to wording: the camps might interpret "extraordinary" differently.)

  13. Assertions can be assessed both from the speaker's perspective (what they knew or had evidence for) and from a more objective perspective (whether the content was true or known). The norm must account for both perspectives.

  14. The norm for assertion is not merely a moral or prudential norm; it is internal to the practice of assertion.

  15. There are cases where a speaker reasonably believes p but does not know p (e.g., Gettier cases), and the norm must say what the speaker may assert in such cases.

