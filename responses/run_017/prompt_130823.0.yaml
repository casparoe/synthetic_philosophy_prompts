answer: |-
  ### Joint Statement from the Adversarial Collaboration on the Norm of Assertion  
  **Participants:**  
  - **Knowledge camp:** Asserts that flat-out assertion is constitutively governed by a rule requiring knowledge. The rule is not merely regulative but defines the speech act itself.  
  - **Reasonable-Belief camp:** Asserts that flat-out assertion is governed by a rule requiring reasonable or justified belief, with truth operating as an independent standard of assessment. The rule is regulative, guiding a practice that could exist without it.  

  This document results from a two-year collaboration adhering to three ground rules: (1) no appeal to literature, authority, or prior arguments—all claims derive from cases, arguments, or predictions; (2) no testing of norms without specifying the speaker’s evidence base or the hearer’s interpretation of it; (3) no coarse-grained descriptions that fail to distinguish the camps’ norms. The collaboration fails unless both sides endorse the residual disagreements as stated.  

  ---

  ### 1. Agreed Claims  
  We agree on the following 16 claims, derived from cases and arguments. A neutral reader will learn the core common ground. **Bolded claims** are suspected of being agreed only due to wording.  

  1. **Ordinary convergence**: The knowledge and reasonable-belief norms yield identical verdicts in ordinary central cases (e.g., asserting "It is raining" based on direct perception). Thus, only divergence cases (e.g., statistical inferences) carry evidential weight.  
  2. **Moore-paradoxical data**: The unassertability of "p but I don’t believe p" is data requiring explanation, but it does not independently favor either norm, as both can account for it.  
  3. **Lottery data**: Reluctance to flat-out assert "Your ticket lost" on purely statistical grounds is data requiring explanation, not a settled argument for either norm.  
  4. **Three verdicts**: Assertions can receive distinct negative verdicts:  
     - *Improper*: Criticism-worthy; the speaker ought not to have asserted.  
     - *Defective*: Fails the governing standard but is not the speaker’s fault (e.g., due to misleading evidence).  
     - *Infelicitous*: Flawed for non-epistemic reasons (e.g., irrelevance or insincerity).  
  5. **Verdict mismatch**: Much recorded disagreement stems from ambiguity about which verdict is queried (e.g., calling an assertion "wrong" might target impropriety or defectiveness).  
  6. **Hedged/relayed speech**: Norms govern prefaced ("I think p"), hedged ("Possibly p"), and relayed ("They say p") speech. A complete account must explain how these relate to the norm for flat-out assertion.  
  7. **Point of practice**: Assertion has a point (e.g., knowledge transmission, true-belief transmission, or evidence-pooling) that constrains viable norms. Both camps agree the point rules out norms like "assert anything" but disagree on what the point is.  
  8. **Hearer’s reliance**: Flat-out assertion invites hearers to rely on the content, so the norm must explain when such reliance is appropriate.  
  9. **Gettier vulnerability**: In cases of justified true belief without knowledge (e.g., a stopped clock showing the right time), the norm must deliver a verdict on assertability.  
  10. **False but reasonable assertions**: An assertion can be false despite the speaker’s reasonable belief (e.g., a doctor misdiagnosing a rare disease), and the norm must explain the resulting verdict.  
  11. **Blame asymmetry**: Speakers are blamed more for assertions that are unreasonable than for those that are reasonable but false, suggesting the norm tracks evidence.  
  12. **Social practice**: Assertion is a social practice whose norms can be violated without collapsing the act (e.g., lying is still an assertion).  
  13. **Minimal accessibility**: The norm must be followable by ordinary speakers without extraordinary epistemic effort. **This claim may be agreed only due to wording**, as "extraordinary" is vague and camps interpret it differently (e.g., Knowledge camp: knowledge is routine; Reasonable-Belief camp: statistical cases show knowledge is too strong).  
  14. **Contextual variation**: Stakes or roles affect how much evidence speakers seek before asserting (e.g., higher stakes demand more evidence).  
  15. **Truth’s role**: Truth is a standard for assessing assertions (false assertions are defective) but is insufficient as the sole norm, as it ignores the speaker’s responsibility.  
  16. **Constitutive-regulative spectrum**: All norms lie on a spectrum between purely regulative (external guides) and purely constitutive (definitive of the act). The camps disagree on where the norm falls.  

  ---

  ### 2. Disagreements Table  
  Residual disagreements are tabled below. Each camp’s formulation is non-vacuous and endorsable by that camp.  

  | Issue | Neutral Statement | Knowledge Camp’s Position | Reasonable-Belief Camp’s Position | Substantive or Partly Verbal? | What Data Changes Would Matter |
  |-------|-------------------|---------------------------|-----------------------------------|--------------------------------|--------------------------------|
  | **Constitutive vs. regulative** | Is the rule definitive of assertion (constitutive) or a guide for an independent practice (regulative)? | "The knowledge rule is constitutive: an act counts as assertion only if governed by this rule. Without it, the practice would not exist in its current form; e.g., in a community permitting assertions without knowledge, the act would differ fundamentally." | "The reasonable-belief rule is regulative: assertion is defined by its social function (e.g., sharing information), and the rule optimizes this function. The practice could exist with weaker rules (e.g., mere belief), though less effectively." | Substantive | If a community with a different rule (e.g., "assert if you believe") exhibited identical patterns of criticism and reliance as ours, it would challenge the constitutive view. |
  | **Evidence base** | Must the speaker’s personal evidence satisfy the norm, or may they draw on a wider institutional/contextual base? | "The norm requires personal knowledge: the speaker must base assertion on their own evidence. Drawing on others’ evidence without knowing the claim is improper; e.g., a scientist may not assert a finding they cannot personally verify." | "The norm permits reliance on a wider evidence base the speaker is entitled to use (e.g., institutional reports). What is 'reasonable' depends on context; e.g., a spokesperson may assert based on team evidence she cannot check." | Substantive | If institutional assertions without personal knowledge (e.g., a spokesperson) are consistently judged proper, it would challenge the personal-evidence view. |
  | **Contextual invariance** | Is the norm invariant (same standard always) or contextual (varies with local standards)? | "The norm is invariant: knowledge is always required. Context affects what can be known (e.g., high stakes raise evidence thresholds), not the norm itself." | "The norm is contextual: 'reasonable belief' depends on local standards. In a lab, replication may be required; in casual talk, less evidence suffices. The core (reasonableness) is fixed, but its application varies." | Partly verbal (agreed core varies; disagreement on whether "norm" refers to core or application) | If in low-stakes contexts, speakers are never criticized for asserting without knowledge (e.g., lottery cases), it would challenge invariance. |
  | **Truth rule as rival** | Is "assert only truth" a viable third option? | "The truth rule collapses: it allows assertions with no evidence (e.g., lucky guesses), which we criticize. It cannot explain propriety judgments, so it reduces to reasonable belief (if evidence is added) or is incoherent." | "The truth rule is not a rival: without an evidence condition, it permits irresponsibility. If evidence is added, it becomes our view. If truth is tied to reliability, it becomes knowledge." | Partly verbal (both see it as collapsing into the other) | If a community practiced "assert any truth" without evidence norms and speakers were never criticized for lucky true assertions, it would support the truth rule. |
  | **Point’s role** | Does the point of assertion (e.g., knowledge transmission) settle the norm or merely constrain it? | "The point settles the norm: assertion aims to transmit knowledge, so only a knowledge norm fulfills this. A weaker norm (e.g., reasonable belief) would not ensure knowledge, defeating the point." | "The point constrains but does not settle the norm: transmission of true beliefs or evidence-pooling can be achieved via reasonable belief. Knowledge is sufficient but not necessary; e.g., statistical assertions advance the point without knowledge." | Substantive | If the point could not be achieved without knowledge (e.g., hearers never gain knowledge from reasonable-but-unknown assertions), it would settle for knowledge. |

  ---

  ### 3. Cruxes  
  Cruxes are reorganized for clarity. Each includes a test and pre-registered predictions. Predictions are falsifiable and cannot be revised post-hoc.  

  #### Crux 1: Retrospective Case  
  - **Sub-question**: When a reasonable assertion is false and never known, what verdict does each norm predict? Does disagreement reflect divergent verdicts or divergent labeling?  
  - **Why it moves the debate**: Challenges whether propriety requires truth-conduciveness (Knowledge) or blamelessness (Reasonable-Belief).  
  - **Agreed test case**: A doctor asserts "You have a virus" based on symptoms typical of a virus (strong evidence), but it is a rare bacterial mimic. The claim was reasonable but unknown and false. Naive assessors (unfamiliar with the debate) are asked: (1) "Was the assertion improper (should the doctor not have said it)?" (2) "Was the doctor at fault?"  
  - **Predictions**:  
    - Knowledge camp: >70% will say "improper" and "at fault" (violated knowledge norm).  
    - Reasonable-Belief camp: >70% will say "not improper" and "not at fault" (met norm; false = defective).  

  #### Crux 2: Spokesperson’s Case  
  - **Sub-question**: Does the norm track the speaker’s personal evidence or the evidence of their institutional role?  
  - **Why it moves the debate**: Tests if the evidence base is personal (Knowledge) or role-based (Reasonable-Belief).  
  - **Agreed test case**: A committee spokesperson asserts "The building is safe" based on an unverified report. Conditions vary:  
    - (A) Official capacity: She represents the committee.  
    - (B) Unofficial capacity: Same claim, same evidence, but personal opinion.  
    - (C) Distrust variant: She distrusts the committee but has no specific doubt.  
    Measure blame (0–10 scale) if the building is unsafe.  
  - **Predictions**:  
    - Knowledge camp: Blame will be high (>7) in all conditions (lacks personal knowledge).  
    - Reasonable-Belief camp: Blame will be low (<3) in (A), high (>7) in (B), and moderate (~5) in (C) (reasonable only in official role).  

  #### Crux 3: Local-Standard Case  
  - **Sub-question**: Do local conventions override the norm?  
  - **Why it moves the debate**: Bears on contextual invariance.  
  - **Agreed test case**: Two contexts:  
    - Lab: Explicit rule—"No flat assertion without replication."  
    - Newsroom: Explicit rule—"Assert attributed official claims flatly."  
    Measure competent participants’ (1) readiness to assert unreplicated findings/official claims and (2) criticism of violations.  
  - **Predictions**:  
    - Knowledge camp: Readiness/criticism will track knowledge, not convention. In the lab, unreplicated findings will be unassertable (no knowledge); in the newsroom, official claims will be assertable only if known.  
    - Reasonable-Belief camp: Readiness/criticism will track local standards. Unreplicated findings will be unassertable in the lab but assertable in the newsroom.  

  #### Crux 4: Audit Game  
  - **Sub-question**: Does impropriety track knowledge or reasonable belief?  
  - **Why it moves the debate**: Tests core divergence (statistical/Gettier cases).  
  - **Agreed test case**: A sender relays a claim to a decider. Independent variables:  
    - Evidence: Perception (P), Reliable testimony (RT), Untrusted testimony (UT), Base-rate 99% (BR), Gettier (G).  
    - Truth: True or false.  
    Measure (1) blame toward sender (0–10) and (2) % calling the assertion "improper."  
  - **Predictions**:  
    - Knowledge camp: Impropriety/blame will be high when sender lacks knowledge (UT, BR, G) regardless of truth. E.g., BR-true: >80% "improper."  
    - Reasonable-Belief camp: Impropriety/blame will be high only when belief is unreasonable (e.g., UT-false) or false with low evidence. E.g., BR-true: <20% "improper."  

  #### Crux 5: Evidentiality Test  
  - **Sub-question**: In languages with obligatory evidential markers (e.g., Tibetan), does the unmarked form align with knowledge or reasonable belief?  
  - **Why it moves the debate**: Bears on whether assertion is constitutively unified (Knowledge) or a graded practice (Reasonable-Belief).  
  - **Agreed test**: Typological survey and corpus study of unmarked assertions in 10+ evidential languages. Test if the unmarked form requires:  
    - (A) Direct knowledge (e.g., perception) or conclusive evidence.  
    - (B) Default/reliable evidence (varies by context).  
  - **Predictions**:  
    - Knowledge camp: Unmarked form will require (A) in >90% of languages.  
    - Reasonable-Belief camp: Unmarked form will align with (B) in >90% of languages.  

  ---

  ### 4. What Would Move Us  
  Each camp specifies falsifiable conditions under which they would concede.  

  - **Knowledge camp**: We would accept evidence against our view if:  
    - In the *retrospective case*, >70% of assessors judge the assertion "not improper" and "not at fault."  
    - In the *audit game*, <30% judge BR-true cases "improper."  
    - **Consequence**: We would abandon the knowledge norm for flat-out assertion and adopt a reasonable-belief norm.  

  - **Reasonable-Belief camp**: We would accept evidence against our view if:  
    - In the *audit game*, >70% judge BR-true cases "improper."  
    - In the *spokesperson’s case*, blame is high (>7) in official-capacity conditions.  
    - **Consequence**: We would concede that knowledge is required and that the rule is constitutive in key contexts.  

  ---

  ### 5. Closing Paragraph  
  This collaboration separated disputes into three types. **Verbal disputes** include the truth-rule rivalry (collapses into one camp on examination) and some "improper"/"defective" mismatches. **Evaluative disputes** include the role of the practice’s point (Knowledge camp values knowledge transmission; Reasonable-Belief camp values true-belief efficiency) and the constitutive-regulative divide (rooted in divergent views of what defines a social practice). **Empirical disputes** dominate: the cruxes in §3 are testable, with preregistered predictions. The *evidentiality test* is genuinely empirical but lacks data; neither camp’s prediction is yet confirmed. We agree that resolving these cruxes could force one camp to retreat, but as of now, the norms remain live options. The deepest divide is whether assertion is constitutively tied to knowledge (§2, row 1) or pragmatically governed by reasonableness (§2, row 5)—a disagreement needing both conceptual refinement and empirical input.  

