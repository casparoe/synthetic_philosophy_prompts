  Q8: (Extra Observers — non-interacting) You are on a committee that can choose to create a huge population of happy people who will live after you and never interact with you or your time. If the committee creates this population, how does that affect your view of the doomsday argument?
     (a) It doesn't change anything: my birth rank is still what it is, and the new population doesn't affect me.
     (b) It makes the total number of people larger, so my birth rank becomes relatively earlier, which strengthens the doomsday argument (makes doom more likely).
     (c) It makes the total number of people larger, but that doesn't affect the probability of doom because I was born before them.

  Q9: (Extra Observers — sealed branch) Now imagine that the committee is instead considering creating a huge population of happy people on a parallel branch of history that is completely sealed off from ours — so that you could not have been born in that branch. How does this differ from the previous case?
     (a) It's the same: creating them affects the doomsday argument in the same way as the previous case.
     (b) It's different: because I couldn't have been one of them, they don't count in the reference class for the doomsday argument.
