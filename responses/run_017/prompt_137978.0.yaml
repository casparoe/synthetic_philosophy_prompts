  We are building a sorting quiz to categorize people into different types of anthropic reasoners without using jargon. The quiz must have 9-10 questions, each with concrete cases and 2-3 answer options. The scoring key will map answer patterns to positions. The positions we want to cover are:

  1. Classic Shifter: Takes early birth rank as evidence for a small total population.
  2. Canceler: Believes that the fact of existence is evidence for a large total population, canceling the doomsday shift.
  3. Reference-Class Relativist: Thinks the answer depends on the reference class (who counts as "you") and nothing selects between them.
  4. Infinitary Escapist: Argues that the expected number of observers is infinite, so the argument doesn't get off the ground.
  5. Real but Inert: Grants the probability shift but thinks it cancels in expected utility, so it shouldn't affect decisions.
  6. Skeptic: Believes you can't update on your own existence at all.
  7. Duration-Sampling Version: Treats the doomsday argument in terms of position in the lifetime of a thing (like how many more episodes of a show).

  Additionally, we must include three specific cases:

  a) Upload Census: Minds are both biological and hardware-based. The question must force a choice about birth rank reference class and what happens when you find out you are biological.

  b) Funding Committee: A foundation choosing between reducing extinction risk and a near-term cause. The doomsday shift makes extinction more likely but also reduces the expected number of people saved. We need to see if this pulls money toward extinction work, away, or has no effect.

  c) Pair of cases about extra observers: 
     - Case 1: Creating a huge population that will exist after the respondent and never interact.
     - Case 2: The same population but on a sealed-off branch the respondent could never have been part of.

  We also note that if two leaves cannot be separated, we must flag them and suggest an extra question.

  Design Approach:

  We'll design questions that probe key intuitions, and the answer patterns will map to the positions. We need to cover the logical space. The questions must be concrete and jargon-free.

  Let's outline the questions:

  1. **Birth Rank Intuition**: To set the stage for the classic doomsday argument.
  2. **Effect of Existence**: Does the fact that you exist at all tell you anything about the total number of people?
  3. **Reference Class**: How do you define the group in which you count your birth rank?
  4. **Infinite Observers**: What if there are infinitely many observers?
  5. **Utility Impact**: Does the doomsday shift affect how you should spend money to prevent extinction?
  6. **Upload Census**: Reference class in a future with uploads.
  7. **Funding Committee**: How the shift affects funding decisions.
  8. **Extra Observers (non-interacting)**: Creating a population after you.
  9. **Extra Observers (sealed branch)**: Creating a population in a sealed branch.

  We'll have 9 questions. We must ensure that the answer patterns lead to the leaves, and we note any indistinguishable positions.

  Question Drafts:

  Q1: (Birth Rank) Imagine you are given a ticket when you are born. The ticket has a number on it, which is your birth order in the entire human race (so the first human is 1, the next 2, and so on). You don't know how many humans there will ever be, but you get ticket number 100,000. What should you think?
     (a) This is evidence that the total number of humans ever born is not huge — probably not much more than 200,000, because if there were going to be billions, it would be surprising to get such an early number.
     (b) This doesn't tell me anything about the total number, because my birth rank is fixed regardless of how many humans there are.
     (c) This might be evidence for a large total number of humans, because if there were only a few, it might be surprising that I exist at all.

  Q2: (Existence as Evidence) Consider that you exist and are having this thought. Does the fact that you exist tell you anything about how many observers (like humans) there are in total?
     (a) Yes, it suggests there are more observers rather than fewer, because if there were only a few, it would be less likely that I would be one of them.
     (b) No, it doesn't tell me anything about the total number of observers.
     (c) It might tell me something, but I'm not sure what.

  Q3: (Reference Class) Suppose we discover that in the future, there will be many intelligent robots that are just as conscious as humans. Should your birth rank (from Q1) be counted among humans only, or among all conscious beings (humans and robots)?
     (a) Only humans: the robots are a different category, so I should count only humans.
     (b) All conscious beings: since the robots are also observers, I should include them.
     (c) It could be either, and there's no objective way to choose.

  Q4: (Infinite Observers) Now imagine that the universe is infinite and contains infinitely many observers. How does this affect the reasoning in Q1?
     (a) It makes the reasoning in Q1 irrelevant because there is no "early" or "late" in an infinite set.
     (b) It doesn't change the reasoning: I still have a birth rank and can reason about it.
     (c) I don't know.

  Q5: (Utility Impact) Suppose a foundation is deciding how to spend money to do the most good. They have two options: (1) reduce the risk of human extinction, or (2) help a large number of people in the near future. The doomsday argument (like in Q1) suggests that the risk of extinction is higher than we thought. However, if the risk is higher, then the expected number of future people who would be saved by reducing extinction risk is lower. How should this affect the foundation's decision?
     (a) The higher risk makes extinction prevention more urgent, so they should put more money into it.
     (b) The higher risk and the lower expected number of future people mean that the benefit of extinction prevention is reduced, so they should put less money into it.
     (c) The two effects cancel out, so the doomsday argument doesn't change the best choice.

  Q6: (Upload Census) In the future, from around 2200, almost all minds are running on hardware (uploads) and they vastly outnumber biological humans in any given year. However, over the entire history, the total number of biological human lives might be similar to the total number of uploads (or not — we don't know). You discover that you are a biological human, born in the 21st century. How do you interpret your birth rank?
     (a) I should count only biological humans, so my birth rank is among biologicals and tells me about the total number of biologicals.
     (b) I should count all minds (biological and uploads), so my birth rank is very low (since there are so many uploads) and tells me that the total number of minds is huge.
     (c) I could choose either reference class, and I'd get different answers, but there's no way to say which is correct.

  Q7: (Funding Committee — follow-up on Q5) The foundation (from Q5) is now told that the doomsday argument implies a higher extinction risk. How do they adjust their funding?
     (a) They increase funding for extinction risk reduction.
     (b) They decrease funding for extinction risk reduction.
     (c) They leave the funding allocation unchanged.

