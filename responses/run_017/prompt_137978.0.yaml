  **Design Notes**  
  - **Why these questions?** Q1/Q2 split shifters (who update on rank) from cancelers/skeptics (who don’t). Q3 isolates relativists. Q4 flags infinitary views early. Q5 forces upload reference-class choices. Q6/Q7 test if the shift affects utility (for "real but inert"). Q7/Q8 distinguish "could I have been them?" (sealed branches shouldn’t affect non-relativists). Q9 checks duration-sampling as a standalone intuition.  
  - **Indistinguishable leaves**: As noted, cancelers and skeptics both answer Q1b/Q2b without extra disambiguation. The bracketed room-size question would split them.  
