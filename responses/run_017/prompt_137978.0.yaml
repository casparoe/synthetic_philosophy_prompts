  Here's your sorting quiz, designed as a single page of continuous prose. It uses nine concrete cases to sort intuitions into the six requested positions (plus a catch-all "other" category). Answer patterns are mapped at the end. Cases are sequenced to resolve ambiguities step by step—e.g., Q1 and Q2 split shifters from cancelers, Q3 isolates relativists, and Q4 catches infinitary escapists early. The Upload Census, Funding Committee, and extra-observer cases are integrated (Q5, Q6, and Q7/Q8), forcing bullets to be bitten. Two leaves (canceler and skeptic) can't be fully separated by these cases alone—an extra question would be needed, noted below.

  ---

  **Anthropic Intuition Sorting Quiz**  
  Answer each question by choosing (a), (b), or (c). Don’t overthink it—go with your gut.  

  1. You’re handed a ticket at birth numbered 100,000, indicating you’re the 100,000th human ever born. What does this suggest about humanity’s total lifespan? (a) It’s evidence we won’t last much longer—probably under 200,000 people total—since being this early would be unlikely if we had a huge future. (b) It tells you nothing; your number is fixed regardless of humanity’s fate. (c) It suggests a large total population, because if humans were rare, your existence would be unlikely.  

  2. Does the mere fact that you exist tell you anything about how many observers (like humans) there are in total? (a) Yes, it suggests more observers exist—if there were few, you’d be less likely to be one. (b) No, existence alone reveals nothing about total numbers. (c) It might, but it’s unclear what.  

  3. Suppose future robots are as conscious as humans. Should your birth rank include them? (a) Only humans count—robots are irrelevant. (b) All conscious beings count—robots matter too. (c) It’s arbitrary; neither choice is more "correct."  

  4. If the universe is infinite with infinitely many observers, how does that change your view of Q1? (a) It nullifies the reasoning—"early" or "late" makes no sense in infinity. (b) It changes nothing—you still reason from your rank. (c) Not sure.  

  5. In a future where uploaded minds vastly outnumber biological humans yearly (though total biologicals might rival uploads), you discover you’re biological. How do you interpret your birth rank? (a) Rank among biologicals only—it tells you about biological humans’ fate. (b) Rank among all minds—it signals a huge total, since uploads make your rank low. (c) It depends on the reference class, with no way to decide.  

  6. A foundation must split funds between reducing human extinction risk (saving future lives) or near-term aid (saving current lives). The doomsday argument suggests extinction is likelier than thought, but if extinction is likelier, fewer future people exist to save. How should this affect funding? (a) Prioritize extinction risk—the higher threat makes it urgent. (b) Deprioritize extinction risk—saving fewer people means less impact. (c) No change—the urgency and reduced impact cancel out.  

  7. Your committee considers creating a huge, happy population that lives after you and never interacts with you. If created, how does this affect your view of humanity’s lifespan? (a) No change—your birth rank is unaffected. (b) It strengthens doomsday concerns—your rank becomes earlier relative to the new total. (c) It suggests a longer future, but doesn’t change your rank’s meaning.  

  8. Now, suppose this population is on a sealed branch of history you couldn’t have been part of. How does this differ from Q7? (a) No difference—the effect is identical. (b) It differs—they don’t count in your reference class, so no effect. (c) It differs, but I’m unsure how.  

  9. You’re watching a TV show’s 10th episode. How many more do you expect? (a) Around 10—you’re halfway. (b) Any number—this reveals nothing. (c) Probably few—it’d be surprising to be this early if there were hundreds.  

  ---

  **Scoring Key**  
  Match your answers to the first fitting pattern:  

  If you chose (a) in Q4, you’re an **Infinitary Escapist**. You think infinite observers dissolve the argument—no probabilities can shift because ranks are ill-defined. (Q4a bypasses other questions: infinity blocks everything.)  

  If not Q4a, but you chose (c) in Q3, you’re a **Reference-Class Relativist**. You think the argument crumbles because "who counts as me?" has no objective answer (Q3c). Uploads (Q5c) and sealed observers (Q8a/b/c) might feel equally valid or arbitrary to you.  

  If neither of the above, but you chose (a) in Q1 and (c) in both Q6 and Q7, you’re **Real but Inert**. You accept the probability shift (Q1a) but believe it cancels in decisions (Q6c/Q7c)—e.g., the funding urgency (Q6a) is offset by fewer beneficiaries (Q6b), so money shouldn’t move.  

  If not above, but you chose (a) in Q1, you’re a **Classic Shifter**. Your birth rank directly shifts expectations toward earlier doom (Q1a), unaffected by existence alone (Q2 not a), uploads (Q5a/b), or extra observers (Q7b: they amplify the shift). Duration-sampling (Q9a/c) likely feels analogous to you.  

  If not above, but you chose (a) in Q2, you’re a **Canceler**. You think existence itself evidences a large total (Q2a), washing out early-rank concerns (Q1b/c). Uploads (Q5b) and unsealed observers (Q7c) might feel like evidence for longevity. *Caveat: This overlaps skeptics—see below.*  

  If not above, but you chose (a) in Q9 and not (a) in Q1, you’re a **Duration-Sampling Reasoner**. You apply the argument to lifespan estimates (Q9a/c) but not birth ranks (Q1b/c), seeing shows, species, or civilizations as sampling from their duration.  

  If none fit, you’re **Skeptic or Other**. Skeptics reject all updating: birth rank (Q1b), existence (Q2b), and duration (Q9b) reveal nothing. *Caveat: Skeptics choosing Q2b and Q1b are indistinguishable from cancelers in this quiz—both answer Q1b/Q2b. To split them, add: "Does knowing you’re in a room with 10 people (vs. 1000) affect your belief about the room’s size? (a) Yes—I’m likelier in smaller rooms. (b) No—I’m here regardless." Cancelers pick (a); skeptics (b).*  

