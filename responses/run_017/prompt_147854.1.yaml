  - **Collapsed distinctions**:  
    - *Interventionist vs. Reductionist*: Both say "mental causes" but split on **Q4** (causation as difference-making vs. production). The interventionist points to prosthesis/random-noise cases; the reductionist calls mental descriptions "shorthand."  
    - *Grounding vs. Epiphenomenalism*: Both deny mental *causal power* but split on **Q3** (does mental exist?). Grounding retains mental as constitutive; epiphenomenalism treats it as decorative.  
  - **Test cases**:  
    - *Prosthesis*: Challenges identity theory; pushes reductionists to accept multiple realizability.  
