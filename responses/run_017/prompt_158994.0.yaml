  I need to help them refine their central question into something precise and answerable. Their insight is that valence might depend on specific roles of scalar signals within training loops (TD-error, gain signals) rather than the reward function itself. The proposal should investigate how architectural choices like on-policy vs. off-policy learning, batched updates, and frozen critics affect valence attribution.

