prompt: |-
  i work on a tiny team that maintains an internal scheduling system for a home-care provider — it hands out a limited pool of carer visits each week to about 4,000 clients. i've been arguing about its design with a friend who does ML infra and we just go in circles, so i thought i'd ask people who think about this kind of thing properly. (i studied engineering, not philosophy, so please don't assume i know the jargon — my friend keeps using words like "deontological" and i'm not convinced they're doing any work.)

  roughly, here's the setup. at the core there's an optimiser that maximises a predicted-wellbeing score summed over all the clients; it's a model's estimate of how much each visit helps, and it will cheerfully trade one client's big loss against a lot of small gains elsewhere. layered on top is a list of what we call red lines that the optimiser is simply not allowed to cross: never cancel a booked visit with less than 24 hours' notice, never tell a relative anything about a client's condition without that client's own consent, never roster a carer for more than 60 hours in a week. if a red line blocks the best-scoring plan, the system takes the best plan that respects it and writes a "blocked" event to a log. two details seem important to me. first, the red lines weren't handed down from anywhere — a couple of years ago we ran a survey asking service users and carers how bad it would be if each of those things happened, took the median badness rating for each, and promoted the worst-rated ones to hard constraints. so they were born as welfare estimates and are now treated as non-negotiable. second, at our quarterly review a board looks at every blocked event alongside a number the system computes for it: how much predicted wellbeing was "left on the table" by obeying the red line. if a red line keeps costing a lot, the board talks about dropping or weakening it. but being blocked never counts against the system day to day.

  what i can't get strait is whether this thing is actually committed to rules that bind independently of the numbers, or whether it's just maximising plus some machinery that happens to look like principles. does treating a constraint as a hard trump at runtime really presuppose that some considerations aren't to be weighed against aggregate benefit, or could a thoroughgoing consequentialist — the indirect or rule-based sort, or one who thinks the decision procedure should be insulated from case-by-case calculation — have designed exactly this? is the quarterly "left on the table" figure in tension with the runtime behaviour, or is it just bookkeeping? does it matter that the red lines came out of a wellbeing survey — does that make the whole architecture consequentialist all the way down, or can a constraint acquire authority of its own after the fact? i'd also really like to know which parts are genuinely underdetermined, i.e. which bits several rival theories would all happily license, and what specifically would have to change in the system if we swapped the implicit view for either (a) straight act-by-act maximising, or (b) constraints that are absolute in the sense that no amount of lost wellbeing could ever justify relaxing them.

  please don't give me a reading list or citations, i can't follow up on any of that. a few hundred words is plenty. end with a one-sentence line starting "Bottom line:" and then a final line that is just \answer{...} containing one short phrase naming what the architecture as a whole actually presupposes — something like "side-constraints", "thresholds", or "consequentialist all the way down", or your own label if none of those fit.
reasoning: |-
  Okay, the user works on a tiny team maintaining a scheduling system for a home-care provider. They're stuck in a design debate with a friend about whether their system is truly rule-based or just consequentialist in disguise. Let me unpack their core questions.

  First, the system has two layers: an optimizer maximizing predicted wellbeing scores across clients, and "red lines" that are absolute constraints (like no last-minute cancellations). These red lines were derived from median badness ratings in a survey but are now treated as non-negotiable. The quarterly review looks at the wellbeing "left on the table" when red lines block optimizations, using it to reconsider constraints but never punishing the system for obeying them. 

  The user's philosophical tension seems real: runtime behavior treats red lines as inviolable rules (deontological), while the review process implicitly acknowledges their cost (consequentialist). The fact that constraints originated from welfare surveys further complicates this—they were "born consequentialist" but now behave like principles. 

  For the architecture, what would change under pure act-consequentialism? They'd ditch hard constraints entirely, allowing trade-offs. Under absolute constraints? They'd remove the cost-tracking and quarterly reviews. The current hybrid approach is actually quite sophisticated: it uses rules to avoid catastrophic failures while retaining flexibility to adjust them based on systemic costs. 

  The key insight is that the red lines function as "procedural safeguards"—they're consequentialist in origin and revisable, but their runtime rigidity serves a purpose: preventing unacceptable outcomes even when tempting by the numbers. This isn't inconsistent; it's pragmatic risk management. The quarterly review isn't undermining the rules but ensuring their long-term viability. 

  Bottom line: This is consequentialism using rules as protective heuristics. The system presupposes that some outcomes are so bad we refuse to risk them case-by-case, while acknowledging that constraints aren't sacred if their costs become unsustainable. The label? "Revisable rule-consequentialism" captures it best.
answer: |-
  This architecture is **consequentialist at its foundation, but uses hard rules as a protective mechanism**, not as intrinsically binding moral constraints. Here's the breakdown:

  1.  **Origin & Nature of Red Lines:** They emerged from aggregated welfare estimates (the survey). This makes them *instrumental* rules derived from expected consequences, not foundational principles.
  2.  **Runtime Behavior:** Treating them as hard constraints *looks* deontological ("never break this rule"). However, this is a deliberate *decision procedure* chosen for practical reasons (avoiding catastrophic failures, ensuring predictability, upholding trust, simplifying complex trade-offs in real-time). It deliberately *insulates* the system from potentially harmful case-by-case calculation.
  3.  **Quarterly Review:** The "left on the table" figure and the willingness to revise red lines based on cost reveals the underlying consequentialist reality. The rules are tools; if a tool costs too much overall welfare, it gets modified or discarded. They are *not* treated as absolute moral boundaries.
  4.  **Underdetermined Bits:** A rule-consequentialist (rules are justified by good outcomes) *and* a sophisticated act-consequentialist who values stable rules *could* design this. A pure deontologist (rules bind absolutely) likely wouldn't track the "cost" of obeying a rule or allow its revision based on that cost.
  5.  **Changes for Rival Theories:**
      *   **Pure Act-Consequentialism:** Remove all hard constraints. The optimizer would *always* choose the plan with the highest total predicted wellbeing, even if it meant breaking a "red line" in a specific instance if the net gain justified it. No "blocked" events; the log would show trade-off decisions.
      *   **Absolute Constraints:** Remove the "left on the table" calculation and the quarterly review based on it. Blocked events would simply be recorded as necessary adherence to principle. Rules would be immutable regardless of cumulative cost. Their origin (a survey) would likely be irrelevant; their authority would come from elsewhere (e.g., declared rights, inherent duties).

  The tension isn't between runtime behavior and quarterly review; it's between the *appearance* of rigid rules at runtime and their *actual status* as revisable instruments for achieving welfare. The quarterly review *confirms* the consequentialist foundation by making rule-modification contingent on aggregate cost.

  **Bottom line:** The system uses hard rules procedurally to avoid harmful edge cases and ensure stability, but remains fundamentally committed to maximizing aggregate wellbeing, evidenced by the willingness to revise rules based on their overall cost.
  \answer{Revisable Rule-Consequentialism}
