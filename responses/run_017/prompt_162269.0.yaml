prompt: |-
  I'm co-teaching a grad seminar on formal epistemology this term with my colleague Dana, who's formally in the math department and is a much more commited Bayesian than I am — I'm the one who keeps dragging everything back to bare metaphysical questions she finds boring, and she's the one who brings those grocery-store cupcakes to every meeting. We've just finished two weeks on updating on uncertain evidence, and I've realized I have no idea what rule she actually thinks is correct. She won't state one in general terms; whenever I push her she says something like "the cases tell you what to do" and then just does the case. So I've been reconstructing it from her verdicts, and next week is the last session before she flies off to a conference, and I'd like to have it pinned down before then. (My sabbatical application is due Friday and I keep working on this instead, which tells you where my priorities are. Also: please don't give me a reading list or point me at papers — I can look those up myself. I want the reconstruction.)

  Her running example goes like this. An urn is either the red-heavy one (80% red balls) or the blue-heavy one (20% red), 50/50 which. One ball gets drawn and you squint at it under bad light. Let E be the proposition that the ball looks red: your prior gives you P(E) = 0.5, plus 0.8 for the red urn given E and 0.2 given not-E. The rule she keeps using is the one where you move your credence over the evidence partition first and then read off the hypothesis by holding fixed the probability of the hypothesis inside each cell — so if your experience leaves you 0.8 on E and nothing else is going on, you end up at 0.8 × 0.8 + 0.2 × 0.2 = 0.68 on the red urn. Her verdicts so far: (i) that clean case, she says 0.68, no hesitation. (ii) Same 0.8 shift on E, except you've also just learned that the lamp has a red gel over it and that the gel goes up only on the days when the blue urn is the one in use: she refuses to run the update on E at all, says the very conditionals you'd be holding fixed are the ones that just got changed, calls the 0.68 "an artifact of the partition," and lands in the mid-0.4s — much closer to where you started — once she writes down a bigger space with a variable for the gel and conditions on the look in there. (iii) Same 0.8 shift, but there's no story at all: nothing you can point to changed, you just find yourself at 0.8, and you have no opinion either way about whether your color vision is degraded. She shrugs and says 0.68 anyway. (iv) You're not sure you even saw the ball — you might have blinked, and the 0.8 arrived by some fuzzy route: she says the input isn't well formed, go find the proposition you actually got evidence about (something in the neighborhood of "it visually seemed red to me") and condition on that with a likelihood that handles the blink case, you can't just feed the number for E into the update. (v) Two shifts, one at 10:00 when you look and one at 10:05 when you heft the ball: she says do them in the order they happened, and adds that doing it the other way round gives a different answer, so temporal order is what breaks the tie.

  The case I've written for next week, which she hasn't seen, is this: same urns, but now you heft the ball and squint at it in a single motion, so it's one experience rather than two, and it leaves you simultaneously at 0.8 on looks-red and 0.75 on feels-heavy. Heaviness is linked to the urn as well (70% of the balls in the red urn are heavy, 30% in the blue one), and the look and the heft are independent of each other once you know which urn you've got. I can see at least three or four rules that fit her verdicts on (i) through (v) equally well, and they come apart here: one says pick whichever shift is the real evidence and ignore the other, one says apply them one after the other, one says find the single distribution closest to your prior that respects both numbers at once, and one says throw the numbers out and go build a model of the experience. What I want is: what will she actually say — with a number, if her rule delivers one, and a flat "she'd refuse to give a number" if it doesn't; which of those rules you think she's running given (i)–(v) and why you'd prefer it over the others that fit just as well; which of the verdicts gives you the least traction in telling them apart; and one further case I could put in front of her next week that would separate the surviving rules instead of just re-running this one. I'd also like to know which of the four I'd be committing myself to if I decided to write it up as my own view, and which of them is the most embarrassing to be caught holding.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're co-teaching a grad seminar on formal epistemology with Dana, who's a strict Bayesian. The user is frustrated because Dana won't state a general updating rule, only giving case-by-case verdicts. They've reconstructed some cases (i-v) and need to predict Dana's response to a new case involving simultaneous evidence on two variables. They also want to identify the underlying rule, a diagnostic case to distinguish alternatives, and personal implications of adopting such a rule.

  First, I need to analyze Dana's verdicts from cases (i) to (v). In case (i), she uses a simple Jeffrey update, moving credence on E first and holding conditionals fixed. Case (ii) shows she rejects this when background conditions change, opting for full conditioning in a larger space. Case (iii) has no changes, so she sticks with Jeffrey. Case (iv) requires well-defined propositions, not fuzzy inputs. Case (v) insists on temporal order for sequential updates.

  The key pattern is that Dana prioritizes propositional clarity and model integrity. She rejects mechanical updates when the evidence isn't cleanly partitionable or when background factors intervene. Her approach seems to be: always expand the probability space to include all relevant variables, then condition on the total evidence available.

  For the new case with simultaneous evidence (0.8 on looks-red and 0.75 on feels-heavy), several rules might fit. The options include sequential updates (but order is unspecified), closest distribution (like MRE), or building a full model. Given Dana's insistence on propositional evidence in case (iv) and her rejection of partition artifacts in (ii), she'd likely refuse to directly apply Jeffrey updates here. Instead, she'd expand the space to include both sensory inputs and their relationships, then condition on the joint evidence.

  Predicting her response: she'd say the inputs aren't well-formed propositions. The 0.8 and 0.75 are summaries of sensory experiences, not direct evidence about E and H. She'd reconstruct the experience as something like "I had a visual experience with P(E|exp)=0.8 and a tactile experience with P(H|exp)=0.75," then build a likelihood model incorporating reliability of senses, potential correlations, etc. Only after specifying that model would she compute a posterior. Without such a model, she'd probably decline to give a number.

  Among the rules the user suggested, "build a model of the experience" fits best. Sequential updates violate simultaneity, and MRE might ignore dependencies. The least diagnostic case is (iii) since all rules might agree there. To distinguish, a case with conflicting simultaneous evidence where temporal order is absent could help, like a single experience yielding P(E)=0.9 and P(not-E)=0.2.

  For the user's personal stance, adopting the model-building approach is defensible but labor-intensive. Sequential updating would be embarrassing as it's arbitrary without temporal order. The user's tendency to metaphysical questions might clash with Dana's meticulous modeling, so embracing model-building while demanding justification for added variables could bridge their approaches.
answer: |-
  Based on Dana's verdicts (i)-(v), her underlying rule is **"Expand the probability space to include all causally/relevantly connected variables, then condition on the total evidence propositionally defined."** She doesn't adhere to Jeffrey updating as a universal rule but uses it *only* when the evidence partition is stable and the conditionals are causally insulated from other changes. Here's the breakdown:

  1.  **Her Rule:**  
      -   Evidence must be propositional ("E" must be a well-defined event in the probability space).  
      -   Shifts in credence over a partition (like P'(E)=0.8) are *only* valid inputs if:  
          (a) The partition is causally stable (no interfering factors like the gel lamp).  
          (b) The shift directly results from an experience providing evidence *about that specific partition*.  
      -   If (a) or (b) is violated, expand the space to model the interfering factors or the actual experience.  
      -   For sequential evidence, update in temporal order on the propositional evidence received at each step.  
      -   The "hold conditionals fixed" aspect of Jeffrey is a *consequence* of conditioning in a well-specified space where those conditionals are stable, not a primitive rule.

  2.  **Prediction for Your Case (Simultaneous Look & Heft):**  
      Dana **will refuse to give a number based on P'(E)=0.8 and P'(H)=0.75 alone.** Her reasoning will be:  
      -   The inputs "0.8 on looks-red" and "0.75 on feels-heavy" are not *propositional evidence*. They are summaries of sensory experiences.  
      -   The *actual evidence* is a single, complex sensory experience involving both vision and touch.  
      -   She will insist on defining a proposition capturing this experience (e.g., `Exp` = "the combined visual-tactile experience I just had").  
      -   She will require a *likelihood model* for `P(Exp | Urn, Ball_Color, Ball_Weight)` (or perhaps `P(Exp | Ball_Color, Ball_Weight)` if the experience depends directly on ball properties). This model must specify how reliable the senses are and whether the experiences are independent *given the ball's properties*.  
      -   Only after specifying this likelihood will she compute `P(Red_Urn | Exp)`. She cannot compute it from the marginal shifts alone because the joint experience might imply dependencies not captured by updating on E and H separately.  
      -   **Verbatim Response:** "These numbers aren't the evidence. *What did you experience?* I need to know how your visual and tactile systems work, and what that combined experience tells you about the actual color and weight of the ball. Feeding me P'(E) and P'(H) is like giving me the answers before I’ve set up the problem. Let’s build the space: Urn (R/B), Ball Color (R/B), Ball Weight (Heavy/Light), Visual Exp (SeemsR/SeemsB), Tactile Exp (SeemsH/SeemsL), and your actual complex experience `Exp` is a function of Visual Exp and Tactile Exp. Now, what are the reliabilities? Are the sensory errors independent? Once we have `P(Exp | Color, Weight)` and priors, we can condition. Without that, any number is garbage."

  3.  **Rules Fitting (i)-(v) & Why Hers Wins:**  
      | Rule                     | Fits (i)-(v)? | Why It Loses to Dana's Rule               |
      | :----------------------- | :------------ | :---------------------------------------- |
      | **Sequential Update**    | Partially     | Fails (ii) (no stable partition for step1), Fails (v) (order matters, but simultaneity breaks it). Arbitrary order choice in simultaneous case. Dana rejects arbitrariness. |
      | **Closest Distribution (MRE)** | Partially     | Fits (i), maybe (iii). Fails (ii) (she doesn't minimize divergence, she rebuilds the space). Fails (iv) (needs proposition). Fails (v) (doesn't inherently respect temporal order). Too mechanical, ignores causal structure. |
      | **"Real Evidence" Selector** | Poorly        | Fails (v) (both are real evidence, order matters). Fails (iii) (what's "real" if no story?). Arbitrary and doesn't match her meticulous modeling in (ii)/(iv). |
      | **Build a Model (Dana's)**| **Yes**       | **Only rule explaining all:** Rejects inputs in (ii)/(iv), accepts in (i)/(iii), uses temporal order in (v), insists on propositions/structure. |

      **Least Diagnostic Verdict:** (iii) is least helpful. All rules *could* produce 0.68 here. Her acceptance of the input in (iii) but rejection in (ii)/(iv) is what highlights her focus on causal/propositional stability, not the number itself.

  4.  **Diagnostic Case to Separate Survivors (if any):**  
      Since "Build a Model" is the clear survivor from (i)-(v), a case to stress-test *its* implications is needed:  
      **"The Calibrated Hallucination":** Same urn setup. A *single*, instantaneous experience directly shifts your credence in `E` (looks red) to P'(E) = 0.9. Crucially, you have a pre-existing, well-calibrated belief: *whenever* your credence in `E` shifts *this exact way* (P'(E)=0.9), it is caused by a temporary neural glitch (not by light/balls) 60% of the time, and by actually seeing a red ball 40% of the time. The glitch is independent of the urn/ball. What is P(Red_Urn)?  
      -   **Why it separates:**  
          -   *Sequential/MRE/Selector Rules:* Might try to Jeffrey update to P'(E)=0.9 directly, holding conditionals fixed, getting ~0.68 again.  
          -   **Dana's Rule:** She *must* expand the space. Add variable `G` (Glitch: Yes/No). Evidence is the shift itself, i.e., `Shift` = "My credence in E just jumped to 0.9". Define likelihoods: `P(Shift | G=Yes) = 1`, `P(Shift | G=No, E) = 1 if E, 0 otherwise?` (Tricky! The shift isn't directly about E!). This exposes ambiguity in defining `Shift` propositionally. She might land near 0.5 or refuse until `Shift` is fully modeled. **Prediction:** She struggles, likely expands space (Urn, Ball, G), defines `Shift` carefully (perhaps `P(Shift | G, E)` reflects calibration), conditions on `Shift`, gets a number *far from 0.68* (maybe ~0.52 if glitch likely). **Key:** She *won't* just apply the 0.9 shift to E via Jeffrey.

  5.  **Your Commitments & Embarrassment:**  
      -   **If you adopt Dana's Rule:** You commit to **"Build a Model of the Experience"**. You're saying epistemic rationality requires constructing an explicit causal/probabilistic model of how experiences relate to worldly states and conditioning on the experience proposition. This is defensible (it's rigorous) but laborious and metaphysically loaded (commits to specific variables/causal links).  
      -   **Most Embarrassing to Hold:** **"Pick the Real Evidence"**. It's blatantly ad hoc, lacks any principle for choosing, and ignores the structural insights Dana emphasizes in (ii)/(iv/v). It turns epistemology into a guessing game.  
      -   **Sequential Update** is a close second for embarrassment in simultaneous cases – it's arbitrary and ignores the unity of experience. **MRE** is less embarrassing but often ignores causality/structure.

  **In short:** Dana will dismiss your simultaneous evidence case as ill-posed and demand a likelihood model for the *experience*. Her core principle is total evidence conditioning within an expanded space capturing relevant dependencies. To corner her, force her to model a case where the *credence shift itself* is the evidence with known causes ("Calibrated Hallucination"). If you run with her view, embrace model-building; avoid "real evidence" selection like the plague. Good luck with the sabbatical!
