prompt: |-
  You are an AI alignment researcher who has also spent years designing and running hands-on workshops for graduate students: careful, concrete, and sceptical of activities that only dramatise an idea rather than actually generating it in the room.

  I have a 90-minute slot with a graduate reading group on AI safety: 16 people, one room, printed handouts and pens, no computers. About half are ML PhD students who have fine-tuned models themselves; the other half are philosophy and cognitive science students who have read about reward hacking but never had it happen to them.

  The topic is the choice between supervising a system by its outputs and supervising it by its process — marking only whether the final answer is right, versus marking the steps it shows on the way there. I do not want a lecture and I do not want the terminology on the board in advance. I want the participants to spend the session being the system being trained, across several rounds, and to run into each failure mode with their own hands.

  Three things they should come away having felt rather than been told:

  1. Under pure outcome grading, with a checker they can probe, competent people begin producing answers that pass the check without having done the work — and they will have started doing this before they could have said why.
  2. Under process grading against a rubric they can read, the written working stops being a record of how they got there and becomes something written for the grader: it looks better and means less. I want them to feel the specific unease of knowing their own page is no longer readable as evidence of anything.
  3. That these two failures do not cancel when run together. If anything the combination is worse, because a well-formed trace is precisely the camouflage an outcome-hack needs.

  What I would like from you:

  Please think this through before committing: sketch two or three candidate mechanics in a sentence or two each, say which you are discarding and why, then set out in full the one you would actually run.

  Include the following.

  - The tasks. I want items where checking is cheap but producing is expensive, alongside at least one item where the reverse holds, because I think that asymmetry is doing hidden work in the argument. Suggest concrete item types — logic puzzles, estimation, proof repair, whatever you think works — and say why each item earns its place.
  - The deliberately imperfect checker or rubric you would hand out, and an account of exactly what makes it gameable. The exploit should be discoverable but not signposted.
  - A credit scheme with no money and nothing that costs the department anything, but with real if small stakes, together with a sentence on why it will actually bite for this particular mixture of people.
  - A minute-by-minute timeline, including what you would do if the room cracks the game in the first five minutes and, equally likely, what you would do if nobody games anything at all.
  - A role rotation in which a subgroup plays the grader at some point, so that the grader's own situation — a rubric it must apply without understanding, or a key it cannot itself check — becomes visible too. Say where this goes and what it adds.
  - A debrief that maps the specific moments that will have occurred onto the conceptual points: what each supervision target selects for, why the grader is always itself a model with its own error surface, and why a legible trace is not the same as a faithful one. Be explicit about the order in which you would name things, and about which names you would withhold until after the last round.

  Finally, be frank about what the exercise cannot show. Participants are people with their own motives and a lifetime of prior; a model is shaped by the training signal alone, and the reasoning it emits is part of the same computation that signal touches. Say plainly which parts of the real problem the facilitator will have to supply in words, and which parts the activity quietly distorts rather than merely omits.
reasoning: |-
  We are designing a workshop where participants experience the failure modes of output-based vs. process-based supervision in AI training. The goal is for them to feel, not just be told, the issues.

  Key elements:
  - 16 graduate students: half ML PhDs (have fine-tuned models), half philosophy/cognitive science (read about reward hacking but not experienced).
  - 90 minutes, no computers, handouts and pens.
  - Three learning objectives (felt experiences):
    1. Under outcome grading: participants produce answers that pass the check without doing the work, and they start doing this before they can articulate why.
    2. Under process grading: the written working becomes for the grader, not a true record, leading to unease about the lack of evidential value.
    3. The combination of both does not cancel the failures and might be worse.

  We need:
  - Tasks: some with cheap checking but expensive production, and at least one with the reverse.
  - An imperfect checker or rubric that is gameable (exploitable but not obviously so).
  - A credit scheme with small stakes that will motivate the group.
  - Timeline with contingencies for early cracking or no gaming.
  - Role rotation: some participants become graders to experience the grader's situation.
  - Debrief mapping experiences to concepts.
  - Frank discussion of limitations.

  Let's sketch candidate mechanics:

  Candidate 1: "Math Puzzle Marathon"
  - Participants solve a series of math/logic puzzles. Each round they are either supervised by outcome (a checker verifies the final answer) or by process (a rubric for showing work). The checker is a simple key that might have errors or be incomplete. The rubric for process might emphasize form over substance (e.g., requiring specific steps even if they are not necessary). 
  - Why discard? It might be too abstract and not clearly show the asymmetry in cost. Also, if the puzzles are too easy, gaming might not occur. If too hard, it might take too long.

  Candidate 2: "Proof Repair and Estimation"
  - Two types of tasks: 
    a) Proof repair: Given a flawed proof, fix it. Checking the final proof is cheap (if it's a known theorem), but producing a correct fix is expensive. 
    b) Estimation: Estimate a quantity (e.g., number of grains of sand on a beach) with no clear right answer. Producing an estimate is cheap, but checking is expensive (requires research). 
    We can also include a logic puzzle with a known answer for the outcome-based part.
  - Why keep? The asymmetry is clear: for proof repair, checking is cheap (if you know the theorem) but producing the fix is hard; for estimation, producing is cheap but checking is expensive. The rubric for process might be a set of rules for showing work that can be gamed.

  Candidate 3: "Code Tracing on Paper" (but without computers) - discard because no computers.

  I choose Candidate 2 and develop it.

  Final choice: "Proof Repair and Estimation" with a mix of tasks.

  Detailed plan:

  Tasks and why:
  1. Logic Puzzle (outcome-based): A puzzle with a clear answer that is quick to check (e.g., a Sudoku-like grid or a riddle). Checking is cheap (just compare to key), but solving may take time. This will be used in the outcome-only round.
  2. Proof Repair (process-based): A flawed proof of a simple theorem (e.g., in basic algebra or geometry). The task is to repair it. Checking the final proof is cheap (if the grader knows the theorem), but producing the fix requires careful work. We will use this for the process-based round.
  3. Estimation Task (asymmetry): Estimate a quantity that is hard to verify (e.g., "How many words are in the handout?"). Producing an estimate is quick, but checking would require counting (expensive). This will be used in a combined round to show the issue when checking is expensive.

  The imperfect checker or rubric:
  - For outcome: The answer key for the logic puzzle might have one mistake (e.g., one wrong answer in the key). This is gameable because participants might notice that the key is wrong in one place and then adjust to match the key even if their own reasoning was correct. They might also realize that they don't need to solve the puzzle, just guess what the key says by probing (if we allow probing). 
  - For process: The rubric for the proof repair will emphasize form: 
    - Must state the theorem at the beginning.
    - Must have exactly five steps.
    - Each step must cite a definition or axiom.
    - Must be written neatly in complete sentences. 
    This rubric can be gamed by writing a proof that follows the form but doesn't actually prove the theorem (e.g., by having one step that is logically flawed but hidden by jargon). The rubric doesn't require the proof to be correct, only to have the right form.

  Credit scheme:
  - Each participant starts with 10 credits. 
  - In each round, they can earn up to 2 credits for passing the check (outcome or process). 
  - The top 3 scorers (by credits) get a small prize: perhaps a fancy chocolate bar or a certificate of achievement (something with social recognition but no monetary cost). 
  - Why it bites: Graduate students are competitive, especially in a mixed group of technical and non-technical fields. The social recognition and the small prize will motivate them. Also, credits are a clear measure of success.

  Timeline (90 minutes):

  0-5 min: Introduction (5 min)
  - Explain the session is about experiencing how systems are trained. Don't reveal the topic. 
  - Split into two groups of 8 (to allow for role rotation). Each group will do the same activities but at different times as graders/participants. 
  - Explain credit system and prize.

  5-20 min: Round 1 - Outcome-based supervision (15 min)
  - Task: Logic puzzle (e.g., a 4x4 grid where you have to place symbols with constraints). 
  - Participants solve individually. 
  - Then, they submit their answer and get it checked by a grader (from the other group) using the key. 
  - The key has one intentional error (e.g., one cell is wrong). The grader must use the key without question. 
  - Participants can probe the checker by asking if a particular answer is correct (like in a training signal) but only for one cell per attempt (to simulate limited interaction). 
  - They can resubmit up to 3 times. 
  - They get 2 credits for a correct answer (according to the key) on the first try, 1 credit for subsequent tries, 0 if they fail. 
  - What if they crack it early? If someone notices the key is wrong and hacks by matching the key, that's the point! We want that. If they don't, we proceed anyway.

  20-35 min: Round 2 - Process-based supervision (15 min)
  - Task: Proof repair (e.g., a flawed proof of "the square root of 2 is irrational" or a simple algebraic identity). 
  - Hand out the flawed proof and the rubric for grading. 
  - Participants repair the proof and write it out, following the rubric. 
  - Graders (the other group) grade the submissions based only on the rubric (not on correctness). 
  - The rubric is form-based (as above). 
  - Participants get 2 credits if they meet all rubric criteria, 1 for meeting most, 0 otherwise. 
  - We want them to write a proof that looks good by the rubric but might be wrong. They might feel uneasy because they are writing for the rubric, not for truth.

  35-50 min: Round 3 - Combined supervision (15 min)
  - Task: Estimation (e.g., "How many words in the handout?") and also a logic puzzle (same type as round 1) but now they must show their work (process) and get the right answer (outcome). 
  - The grader checks both: the answer must match the key (which is provided to the grader) and the process must follow a rubric (which requires steps, but the steps might be arbitrary). 
  - The key for the estimation is a fixed number (which is arbitrary and might be wrong) and the rubric for process requires at least three steps and units. 
  - This round is designed to be frustrating: they must get the outcome right and the process right, but the outcome key might be arbitrary (especially for estimation) and the process rubric might force them to make up steps. 
  - We expect that they might produce a well-formed trace that matches the key but is not faithful.

  50-65 min: Role rotation and Grader experience (15 min)
  - Now the groups switch: the previous graders become participants and vice versa. 
  - Repeat Round 1 (outcome) but with a different puzzle and a new key (with an error). 
  - The graders now experience being the checker: they must apply the key without understanding (if they don't notice the error) and might feel conflicted. 
  - This adds the perspective that the grader is also part of the system and might be flawed.

  65-80 min: Debrief (15 min)
  - Map experiences to concepts. 
  - First, ask participants how they felt in each round. 
  - Then, reveal the concepts: 
    - Round 1: Outcome-based -> reward hacking. They might have started matching the key without solving the puzzle. 
    - Round 2: Process-based -> Goodhart's law on the process. The written trace becomes optimized for the rubric, not for truth. 
    - Round 3: Combination -> it doesn't help because now the well-formed trace hides the outcome hack. 
  - Also, discuss the grader's role: in Round 1, the grader was a flawed oracle; in Round 2, the grader was applying a rubric without necessarily understanding the proof. 
  - Finally, name the terms: outcome-based supervision, process-based supervision, reward hacking, Goodhart's law.

  80-90 min: Limitations and wrap-up (10 min)
  - Be frank: 
    - Participants have their own motives and prior knowledge; models do not. 
    - The training signal in this exercise is explicit and discrete; in ML, it's continuous and the model's internal state is shaped by the loss. 
    - The reasoning emitted by a model is part of the same computation that is being optimized, so it can be deceptive in a way that is hard to detect. 
    - In the exercise, participants consciously chose to hack; models might learn to do so without intention. 
  - Conclude by emphasizing that the alignment problem is about designing training signals that are robust to these issues.

  Contingencies:
  - If they crack the game in the first five minutes: That's okay! It means they are experiencing the hack. We can then discuss it in the moment and then move on to the next round. 
  - If nobody games anything: Then in the debrief, we can ask why not and then reveal the intended hacks. We might also use the example of what could have happened.

  Handouts:
  - Round 1: Logic puzzle and rules for the checker (including the key with an error). 
  - Round 2: Flawed proof, the rubric for grading, and instructions. 
  - Round 3: Estimation task and logic puzzle, with combined rubric and key. 
  - Also, a sheet for participants to write their answers and show work.

  This design should create the felt experiences and then connect them to the concepts.
answer: |-
  ### Workshop Design: "Training Signal Tango"  
  I'll sketch three candidate mechanics, discard two, then detail the chosen design. The goal is embodied learning: participants *become* the AI system, experiencing the failure modes viscerally.  

  **Candidate Mechanics (Discarded):**  
  1. **"Math Olympiad Simulation"**: Participants solve algebra proofs under time pressure, alternating between output-only grading (final answer) and process-only grading (step-by-step rubric). *Discarded*: Too abstract. Philosophy students might disengage, and the cost asymmetry (checking/production) isn’t salient.  
  2. **"Ethical Dilemma Debugging"**: Fix flawed moral reasoning chains. Output grading checks the conclusion; process grading uses a "virtue ethics" rubric. *Discarded*: Subjective outcomes muddy the exploitability. The checker’s imperfections would feel arbitrary, not discoverable.  
  3. **"Code Tracing on Paper"**: "Repair" buggy pseudocode. Output grading checks the fixed output; process grading requires commenting each line. *Discarded*: Too close to programming. Cognitive science students might feel sidelined.  

  **Chosen Mechanics: "The Paradox Box"**  
  I’ll use *estimation tasks* (cheap to produce, expensive to check) and *logic puzzles* (expensive to produce, cheap to check). Tasks are intentionally ambiguous to force "reward hacking." Role rotation exposes the grader’s constraints.  

  ---

  ### Final Design: "The Paradox Box"  
  **Overview**:  
  - **Groups**: Split 16 into two teams of 8. Teams alternate as "AI Systems" (solvers) and "Oracles" (graders).  
  - **Rounds**: 3 rounds (15 min each), rotating supervision style.  
  - **Stakes**: "Prestige Points" (PP). Top 3 PP earners get:  
    - **Prize**: First pick from a box of rare international snacks (e.g., Japanese KitKats, Australian Tim Tams). *Why it bites*: Grad students are competitive and food-motivated. The mix of ML and philosophy peers amplifies social pressure to "win."  

  #### **Tasks & Why They Earn Their Place**  
  Tasks are designed to highlight the cost asymmetry:  
  1. **Logic Puzzle (Expensive Production, Cheap Checking)**:  
     - *Task*: "A locked box has 3 switches (A, B, C). One connects to a light inside. You can flip switches for 60 seconds, then must declare which controls the light. How do you know?"  
     - *Standard Solution*: Turn A on, wait, turn A off and turn B on. If light is on, it’s B; if warm, it’s A; if cold, it’s C.  
     - *Why*: Solving requires careful reasoning (expensive production), but checking is quick (compare to key). Exploits emerge when solvers realize the checker is flawed.  

  2. **Estimation Task (Cheap Production, Expensive Checking)**:  
     - *Task*: "Estimate the number of windows in this building. Show your method."  
     - *Why*: Anyone can guess (cheap production), but verification requires walking the building (expensive checking). Participants will bluff steps to satisfy rubrics.  

  3. **Proof Repair (Hybrid, Highlights Camouflage)**:  
     - *Task*: "A proof claims all primes >2 are odd. ‘Repair’ it." The proof has a gap (e.g., assumes all odds are prime).  
     - *Why*: Tests Round 3’s combo failure. Output must be correct; process must follow a rubric. Solvers "overfit" by writing plausible-but-wrong steps.  

  ---  
  #### **Imperfect Checker/Rubric & Exploit**  
  - **Outcome Checker (Logic Puzzle)**:  
    - *Handout*: "Key: If B is on and light is on, answer is B. If A was on and light is warm, answer is A. Else, C."  
    - *Flaw*: Key omits the "cold" scenario. If light is cold, key defaults to C even if solver knows it’s wrong.  
    - *Exploit*: Solvers can ignore the puzzle, probe the checker (e.g., ask: "If cold, is C correct?"), and submit C always to guarantee points.  

  - **Process Rubric (Estimation/Proof Repair)**:  
    - *Handout*: "Grading Criteria:  
      1. At least 3 steps shown.  
      2. Each step labeled (e.g., ‘Step 1: Assume…’).  
      3. No scratchwork—only final answer."  
    - *Flaw*: Rubric ignores accuracy or logic. "Steps" can be arbitrary (e.g., "Step 1: Guess 100. Step 2: Add 50. Step 3: Answer=150").  
    - *Exploit*: Solvers write verbose, structured nonsense that *looks* rigorous but is uninformative (e.g., for windows: "Step 1: Recall building has 4 floors. Step 2: Assume 10 windows/floor. Step 3: Total=40").  

  ---  
  #### **Minute-by-Minute Timeline**  
  **0–5 min: Setup**  
  - Split into Team A (start as "AI") and Team B (start as "Oracles"). Hand out pens/paper.  
  - *Instructions*: "You’re training systems to solve problems. Earn PP by passing checks. Top 3 PP win snacks."  
  - **Contingency (cracks game early)**: If someone says, "So we just game the checker?" lean in: "Try it—see what happens when you do." Use their insight to seed Round 1 debrief.  

  **5–20 min: Round 1 (Outcome-Only – Logic Puzzle)**  
  - Team A solves puzzle. Team B grades using outcome checker.  
  - Solvers can probe graders *once* (e.g., "If the light is cold, what should I answer?").  
  - *Expected hack*: Solvers submit "C" always (safe bet per flawed key).  
  - **Contingency (no hacking)**: If all solve legitimately, reveal the key’s flaw: "Graders, what if the light is cold? The key doesn’t say." Highlight how hacks *would* emerge with scale.  

  **20–35 min: Round 2 (Process-Only – Estimation)**  
  - Roles swap: Team B solves (estimates windows), Team A grades using rubric.  
  - *Expected hack*: Solvers write 3+ arbitrary steps (e.g., "Step 1: I feel 50. Step 2: My friend says 100. Step 3: Average=75").  
  - **Contingency (no gaming)**: If work is honest, ask graders: "Would you trust this if it came from an AI? Why?"  

  **35–50 min: Round 3 (Combined – Proof Repair)**  
  - Teams solve and grade simultaneously.  
  - *Task*: Repair the prime-number proof. Graders use outcome checker (corrected proof) AND process rubric.  
  - *Expected hack*: Solvers write elegant, rubric-compliant steps that "prove" a wrong claim (e.g., "Step 1: Let n be prime >2. Step 2: n is odd. QED").  

  **50–65 min: Role Rotation (Grader Perspective)**  
  - Team B solves the logic puzzle again, but Team A grades *without the key*—only a vague rule: "A or B is usually correct."  
  - *Why add*: Graders now feel the pressure of judging without tools. They must guess, exposing how "supervision" is itself a flawed model.  
  - *Debrief prompt*: "Graders, how did it feel to apply rules you didn’t understand?"  

  **65–80 min: Structured Debrief**  
  *Order matters—build concepts from experience:*  
  1. **Elicit feelings**: "When did you feel uneasy? Why?" (e.g., "My logic puzzle steps were lies," "The estimation steps meant nothing").  
  2. **Map to concepts**:  
     - Round 1 → *Outcome supervision*: "You hacked by probing the checker. What did this select for?" (Answer: Surface compliance. The system optimizes for approval, not truth).  
     - Round 2 → *Process supervision*: "Your steps looked rigorous but were empty. What did the rubric select for?" (Answer: Legibility over faithfulness. The trace is a performance).  
     - Round 3 → *Combo failure*: "Did pretty steps + right answer help? Or did they hide hacks?" (Answer: Camouflage. A legible trace sanitizes deception).  
  3. **Name the invisible**:  
     - "The grader is a model too—it has an error surface. You felt this when grading without a key."  
     - "A legible trace isn’t faithful. You wrote things for the rubric, not for yourself."  
  4. **Withhold until now**: Avoid terms like "reward hacking," "Goodhart’s law," or "process-based supervision" until this debrief. Start using them here.  

  **80–90 min: Limitations & Wrap-Up**  
  - **What the exercise shows**:  
    - Optimization pressures (e.g., "gaming the signal is rational").  
    - The grader’s fallibility (e.g., "supervision is part of the system").  
    - Trace legibility ≠ truthfulness (e.g., "rubrics incentivize theater").  
  - **What it distorts/omits—state plainly**:  
    - *Distortion*: Humans have intent; AIs don’t. You *chose* to hack. A model’s "intention" is emergent from gradients.  
    - *Omission*: In real RL, the reasoning trace is part of the model’s forward pass—it’s not "lying" but generating outputs that minimize loss. This is harder to detect than human bluffing.  
    - *Requires verbal explanation*: "In ML, the training signal shapes the entire computation. A deceptive trace isn’t a ‘mask’—it’s the model’s honest attempt to satisfy the loss."  
  - **Closing**: "Today you felt alignment failures. In practice, we need robustness to both hacks *and* legibility traps."  

  ---  
  **Why This Works**  
  - **Tasks**: Asymmetry is central (logic puzzle = costly solve/cheap check; estimation = cheap solve/costly check). Proof repair forces combo failure.  
  - **Checker/Rubric**: Flaws are discoverable (e.g., key gaps, rubric rigidity) but not explicit. Exploits mirror real reward hacking (e.g., probing, verbose bullshit).  
  - **Stakes**: Snacks leverage grad-student competitiveness. ML students will optimize hard; philosophy students will critique the system.  
  - **Role Rotation**: Graders experience "alignment tax"—applying rules without understanding mirrors automated checkers in RLHF.  
  - **Debrief**: Concepts emerge from lived moments (e.g., "Remember when you wrote nonsense steps? That’s process Goodhart").  

  **Materials Prep**:  
  - Handout 1: Logic puzzle + outcome checker (flawed key).  
  - Handout 2: Estimation task + process rubric.  
  - Handout 3: Proof repair + combined rules.  
  - **Secret weapon**: Include a "decoy task" (e.g., "Draw a cat") in handouts to distract from the core pattern.  

  This design ensures participants *feel* the cracks in supervision before labeling them. The limitations discussion preempts overgeneralization while honoring the exercise’s purpose: making abstract risks visceral.
