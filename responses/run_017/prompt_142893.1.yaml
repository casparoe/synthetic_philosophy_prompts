prompt: |-
  Hi — I'm one of five people on the investment committee of a small (~$180m) college endowment. We look at maybe 25 opportunities a year, meet monthly, and every memo we write ends in a number: a probability of hitting the target return, which we then feed into a position size. I've become convinced this is broken in a specific way: it makes us systematically favour whatever is easiest to model, and it lets a manager with a nice backtest of a brand-new strategy outcompete a boring fund with fifteen years of actual data, because the backtest produces a cleaner number. Someone pointed me at Keynes's Treatise on Probability — the bit about probability being a degree of rational belief grounded in evidence, and especially his separate notion of the weight of an argument (how much evidence you have, as opposed to how favourable it is), plus his claim that for a lot of real decisions there just is no numerical probability and people fall back on a convention that the future will look like the past, or on what everyone else is doing.

  Can you turn that into a procedure we could actually run in a committee meeting? I mean: the questions in order, what counts as a real answer to each, when the procedure spits out a no, and when it has to hand the question back to us as a values call. Three things I care about most. (1) A test for whether a number in a memo is grounded in an actual class of comparable cases or is really just model output dressed up — I want the memo to say which. (2) Some rule connecting weight to position size that doesn't collapse into "be more conservative when you know less." (3) What we're supposed to do when there genuinely is no probability: Keynes seems to say falling back on convention is just what everyone does, but I want to know when that's fine and when it's self-deception, and whether "hold cash and wait" is ever an honest output we could defend to a board that hates cash drag.

  Then run it on three cases: (a) re-upping with a private credit manager we've been with through two downturns and who has 15 years of quarterly data; (b) a first-time fund doing something genuinely new with a beautiful backtest and three months of live trading; (c) our single biggest allocation, which we've rolled over for years mostly because its never given us a reason to stop — I have a feeling the procedure is going to tell us something about that one that we don't want to hear. And please say plainly what the procedure can't do for us.
reasoning: |-
  We are going to design a procedure inspired by Keynes's notions of probability and the weight of evidence. The goal is to address the committee's concerns about over-reliance on numerical probabilities when they are not well-grounded and to incorporate the idea of the "weight of evidence" (how much evidence we have) as distinct from the favorability of the evidence.

  Key elements from Keynes:
  - Probability as a degree of rational belief grounded in evidence.
  - The weight of an argument: the amount of relevant evidence (not how favorable it is).
  - For many decisions, numerical probability may not exist, and people may fall back on convention (e.g., future like the past) or imitation.

  Procedure Outline:

  We will break each investment decision into three stages:

  1. **Evidence Assessment**: 
     - Determine the nature and quality of the evidence. We want to classify the evidence into one of two categories:
       (a) Grounded in an actual class of comparable cases (real-world data from similar situations, preferably through multiple cycles).
       (b) Model output (e.g., backtests, simulations) without a strong base of comparable real-world outcomes.

     We will require that every memo explicitly states which category the evidence falls into and provides a justification.

  2. **Weight of Evidence Assessment**:
     - Assign a qualitative assessment of the weight of evidence (low, medium, high). This is about the quantity and quality of the evidence, not the favorability. Factors to consider:
       - Time span and market cycles covered.
       - Similarity of the current situation to past data (if using historical data).
       - Whether the evidence is based on actual realized outcomes or projections.
       - The diversity and independence of data sources.
       - For new strategies, the plausibility of the economic rationale and the track record of the team in similar contexts.

  3. **Decision and Position Sizing**:
     - If the evidence is of type (a) (comparable cases) and the weight is high, then we can use the numerical probability with confidence and set position size accordingly (with normal risk limits).
     - If the evidence is of type (a) but the weight is medium or low, we adjust the position size downward, not by being more conservative in the probability estimate (which is about favorability) but by reducing the position size relative to what the probability would suggest. We are reducing the bet because the evidence is thin.
     - If the evidence is of type (b) (model output without comparable cases) then we do not assign a numerical probability. Instead, we rely on the weight of evidence and other qualitative factors. For position sizing, we cap the maximum position size at a lower level (to be determined by the committee) and require a higher hurdle for approval.
     - When there is no numerical probability (either because we are in type (b) or because the weight is too low even in type (a)), we must avoid falling back on convention (e.g., "it's always worked") without explicit acknowledgment. We then have two options:
          Option 1: Reject the investment (if the weight is too low and there is no compelling non-numerical rationale).
          Option 2: Approve a very small position (as a learning exercise) if the idea has high strategic importance and the potential upside (if it works) is very large, but with a clear exit plan if the evidence does not accumulate as expected.

     Additionally, we introduce the concept of "convention-based" decisions. If we are considering an investment primarily because it is conventional (e.g., we've always done it, peers are doing it), then we must explicitly state that and limit the position size to a fixed small percentage (say 1-2% of the portfolio) unless there is a separate evidence-based case.

     For the "hold cash and wait" option: This is a valid output when the weight of evidence is low and there is no compelling reason to act (either because the opportunity is not time-sensitive or because we expect to gather more evidence soon). We must document the reasons for holding cash and the conditions under which we would reinvest.

  The Procedure Steps:

  For each investment opportunity, the memo must answer:

  Step 1: Evidence Type
     - Is the probability estimate grounded in an actual class of comparable cases? (Yes/No)
     - If yes, describe the comparable cases and how they are similar. If no, describe the model and why there are no comparable cases.

  Step 2: Weight of Evidence (Low, Medium, High)
     - Justification: length of track record, number of independent data points, coverage of different market environments, robustness checks, etc.

  Step 3: Rationale for Probability Estimate
     - If Step 1 is "Yes", then provide the numerical probability and how it was derived from the comparable cases.
     - If Step 1 is "No", then the memo must not provide a numerical probability. Instead, it should provide a qualitative assessment (e.g., "we believe the strategy has a reasonable chance of success because...") and any non-numeric indicators (e.g., the team's experience, the economic logic).

  Step 4: Position Sizing Rule
     We predefine the following:
     - Base position size: determined by a standard method (e.g., based on probability of success, target return, and risk, as currently done) for opportunities with high weight and type (a) evidence.

     Adjustments:
     - For type (a) evidence:
          - High weight: use base position size.
          - Medium weight: reduce base position size by 50%.
          - Low weight: reduce base position size by 75% (or set to a maximum of 1% of the portfolio, whichever is lower).

     - For type (b) evidence (model-based without comparable cases):
          - Regardless of weight, do not assign a numerical probability. The memo must argue qualitatively.
          - Position size is capped at a fixed small amount (e.g., 0.5% to 1% of the portfolio) unless there are exceptional circumstances (which require a supermajority of the committee).

     - For investments that are primarily convention-based (e.g., we've always held it, peers are doing it) and without strong evidence, cap at 1% and require an annual review.

  Step 5: Handling "No Probability" Situations
     - If the evidence type is (b) and the weight is low, or if the investment is convention-based without new evidence, then:
          - The committee must explicitly vote on whether to:
              a) Hold cash and wait (if the opportunity is not urgent and we expect more evidence to emerge) OR
              b) Make a very small investment (as a learning position) OR
              c) Reject.

     - The memo must also state if the investment is being considered because of convention (e.g., "we have held this for years without a problem", "our peers are allocating to this"). In such cases, the position size is capped at 1% unless the committee can make an evidence-based case (which would then follow the above steps).

  Step 6: Documentation of Decision
     - The memo must record the outcome of the above steps and the final position size.

  Now, we run the procedure on the three cases:

  Case (a): Re-upping with a private credit manager (15 years of quarterly data, two downturns)

  Step 1: Evidence Type
     - Yes. The evidence is grounded in an actual class of comparable cases: the manager's own track record through multiple cycles.

  Step 2: Weight of Evidence
     - High. 15 years of quarterly data covering two downturns provides a substantial amount of evidence.

  Step 3: Rationale
     - Numerical probability can be used (based on historical performance and the manager's consistency).

  Step 4: Position Sizing
     - Base position size as per current method, then adjusted by weight: high weight => no reduction.

  Case (b): First-time fund with a beautiful backtest and three months of live trading

  Step 1: Evidence Type
     - No. The evidence is primarily a backtest (model output) and a very short live track record. There are no comparable cases because the strategy is new.

  Step 2: Weight of Evidence
     - Low. The backtest is not real money and may be overfitted. Three months of live trading is too short and may not cover different market conditions.

  Step 3: Rationale
     - No numerical probability. The memo must argue qualitatively (e.g., the team's expertise, the economic rationale, the backtest robustness checks).

  Step 4: Position Sizing
     - Because it's type (b) and weight is low, the position size is capped at a small amount (e.g., 0.5% to 1%). The committee might decide to invest a small amount as a learning position.

  Case (c): Single biggest allocation, rolled over for years because it never gave a reason to stop

  Step 1: Evidence Type
     - We must ask: Is the current probability estimate grounded in comparable cases? 
       - If we are using the fund's own long-term history, then yes (like case a). 
       - But if the committee has been rolling it over without updating the evidence (e.g., without checking if the market conditions have changed or if the strategy is still valid), then it might be convention-based.

     However, let's assume that the memo does not present new evidence and the decision is based on past performance and the fact that it has been held for a long time without issues. This might be a mix.

     - We must require the memo to explicitly state: 
          - What comparable cases (current market environment and strategy) support the probability estimate?
          - If there is no new evidence and the decision is based on past performance alone, then we must note that the past performance may not be comparable to the future (if market conditions have changed).

     Step 1 Answer: If there is a long track record (say 15+ years) and the strategy is the same, then it is type (a). But if the market environment has changed in a way that makes past data less relevant (e.g., interest rates at multi-decade lows and now rising), then the evidence might be of lower quality.

  Step 2: Weight of Evidence
     - If the track record is long and covers multiple cycles, then weight is high. But if the current environment is unprecedented (relative to the track record), then the weight might be medium or even low.

  Step 3: Rationale
     - If the evidence is type (a) and weight is high, then we can use numerical probability. But if the environment has changed, we might adjust the probability downward or note the uncertainty.

  Step 4: Position Sizing
     - If the evidence is type (a) and weight is high: full base position.
     - If the evidence is type (a) but weight is medium (because of the changing environment): reduce by 50%.
     - If the evidence is type (a) but weight is low: reduce by 75% or cap at 1%.
     - If the investment is primarily convention-based (because we've always held it and there is no new evidence to support continued holding in the current environment), then we cap at 1% and require an annual review.

     In this case, the procedure might reveal that we are holding the position out of convention and that the evidence weight has dropped (because of changing conditions). Then we must reduce the position size.

  What the procedure cannot do:

  1. It cannot create evidence where there is none. For truly novel situations, we must accept that we are taking a risk without a solid evidence base.

  2. It cannot eliminate the need for judgment. The classification of evidence type and weight is subjective and requires committee discussion. We must have clear guidelines and examples to promote consistency.

  3. It cannot predict the future. Even with high weight and type (a) evidence, there is always uncertainty.

  4. It might not prevent groupthink. If the committee is biased toward a particular outcome, the procedure might be gamed. Regular third-party reviews of the process could help.

  5. It cannot replace the need for continuous monitoring. An investment that passed the test at one time might later become convention-based if the evidence base erodes (due to market changes) and we don't update.

  In summary, this procedure forces the committee to be explicit about the nature and amount of evidence, reduces overreliance on model outputs for new strategies, and limits position sizes when evidence is thin or based on convention. It also provides a structured way to handle uncertainty and avoid cash drag by allowing small learning positions or explicit cash holdings when appropriate.
answer: |-
  ### Keynes-Inspired Investment Decision Procedure  
  Based on Keynes's concepts of *probability as rational belief*, *weight of evidence*, and the limits of numerical probability, here’s a practical 5-step procedure for your committee. It replaces numerical probabilities with **evidence quality tiers**, explicitly addresses *weight*, and mandates actions for low-evidence/conventional decisions.  

  #### Key Definitions  
  - **Probability (Keynesian)**: A *qualitative* degree of rational belief (e.g., "likely," "unclear"), grounded in comparable historical cases or fundamental analysis. Not a number.  
  - **Weight of Evidence**: Volume/relevance of data, *not* its favorability. Measured by:  
    - Timeframe (years) and market cycles covered.  
    - Breadth of data (e.g., live trading vs. backtest).  
    - Comparability to current conditions.  
  - **Convention**: Decisions based on past persistence ("it’s always worked") or peer imitation ("everyone’s doing it").  

  ---  
  ### The Procedure: 5 Steps for Committee Meetings  
  **Input**: Investment memo.  
  **Output**: Evidence tier, weight rating, position size cap, and a "values call" flag.  

  #### Step 1: Evidence Grounding Test  
  *Tests if the probability is based on real-world cases or is model artifice.*  
  - **Question**: *"Is there an actual class of comparable historical cases (e.g., similar strategy, asset class, or manager) that survived ≥1 full market cycle (7–10 years), where outcomes are measured ex-post?"*  
    - **Yes** → Evidence is **"Grounded"** (proceed to Step 2).  
    - **No** → Evidence is **"Model-Driven"** (skip to Step 3).  
  - **Real Answer Requires**:  
    - List of comparable cases (e.g., "20 private credit funds launched pre-2008") or acknowledgment of absence.  
    - Backtests alone are *never* "Grounded."  
  - **Memo Must State**: "Grounded: [List cases]” or “Model-Driven: [Description].”  

  #### Step 2: Weight of Evidence Assessment  
  *Quantifies the volume of evidence, not its optimism.*  
  - **Question**: *"Does the evidence cover ≥2 market cycles, with live (not backtested) data from diverse regimes?"*  
    - **High Weight**: ≥2 cycles, live data across regimes (e.g., GFC + COVID).  
    - **Medium Weight**: 1 cycle + partial live data.  
    - **Low Weight**: <1 cycle or reliant on backtests/projections.  
  - **Real Answer Requires**: Table of evidence sources (e.g., "15 years live data, 2008/2020 downturns").  

  #### Step 3: Probability Rationale  
  *Replaces numbers with Keynesian "rational belief" categories.*  
  - **If Grounded**: Assign qualitative probability:  
    - **High Confidence**: Consistent results across cycles.  
    - **Moderate Confidence**: Mixed results but positive base case.  
    - **Low Confidence**: Inconclusive or regime-dependent.  
  - **If Model-Driven**: No probability assigned. Only allowed rationales:  
    - Economic first principles (e.g., "arbitrage opportunity exists because...").  
    - Acknowledged convention ("peer endowments allocate to this").  
  - **Memo Must State**: "Rational Belief: [High/Moderate/Low/Unquantifiable]" + rationale.  

  #### Step 4: Position Size Rules  
  *Links weight (not probability) to sizing to penalize thin evidence.*  
  - **Rule**:  
    | Weight      | Max Position (% of Portfolio) |  
    |-------------|--------------------------------|  
    | High        | Up to 5% (normal sizing)       |  
    | Medium      | ≤2%                            |  
    | Low         | ≤0.5%                          |  
  - **Why?** High weight = more data to assess tail risks. Low weight = sizing caps risk, not conservatism.  
  - **Model-Driven Automatic Cap**: ≤0.5% (regardless of weight).  

  #### Step 5: Handling "No Probability" & Convention  
  *Flags when convention is masking uncertainty.*  
  - **Question**: *"Is the primary rationale convention (e.g., past persistence, peer action) or fundamental analysis?"*  
    - **If Convention-Driven**:  
      - Position size capped at **≤1%**.  
      - Committee must answer: *"What new evidence would break this convention?"* (e.g., "If inflation stays >5% for 6 months").  
    - **"Hold Cash" Justification**:  
      - Valid when:  
        1. Weight is Low/Medium + no investable alternatives with better evidence.  
        2. Time-sensitive evidence is expected within 12 months (e.g., Fed policy shift).  
      - **Not Valid** for avoiding all uncertainty.  
  - **Output**: Decision to "Invest," "Reject," or "Defer (Hold Cash)" + monitoring triggers.  

  ---  
  ### How the Procedure "Spits Out a No"  
  - **Automatic Reject**:  
    - Evidence is Model-Driven + Low Weight + no first-principles rationale.  
    - Convention-driven + no answer to "What breaks this convention?"  
  - **Values Call Required**:  
    - When probability is unquantifiable but committee overrules caps (e.g., "We believe in this manager despite low weight"). Must be documented.  

  ---  
  ### Application to Your Cases  
  *(Using procedure above)*  

  #### Case (a): Private Credit Manager (15 years, 2 downturns)  
  - **Step 1 (Grounding)**: **Grounded** (15 years live data, 2 downturns = comparable cases).  
  - **Step 2 (Weight)**: **High** (>2 cycles, live data across regimes).  
  - **Step 3 (Probability)**: **High Confidence** (consistent results).  
  - **Step 4 (Sizing)**: ≤5% (normal sizing allowed).  
  - **Step 5 (Convention)**: N/A (evidence-based).  
  - **Output**: **Approve** with up to 5% allocation.  

  #### Case (b): First-Time Fund (Backtest + 3mo live)  
  - **Step 1 (Grounding)**: **Model-Driven** (no comparable cases; backtest ≠ history).  
  - **Step 2 (Weight)**: **Low** (3mo live data = no cycle coverage).  
  - **Step 3 (Probability)**: **Unquantifiable** (no grounded data).  
  - **Step 4 (Sizing)**: **≤0.5%** cap (Model-Driven + Low Weight).  
  - **Step 5 (Convention)**: If invested, must define break condition (e.g., "If live returns diverge >20% from backtest in 12mo, exit").  
  - **Output**: **Reject or ≤0.5% allocation** (values call if overruling cap).  

  #### Case (c): Biggest Allocation (Rolled Over for Years)  
  - **Step 1 (Grounding)**: **Likely Convention-Driven** (unless memo shows fresh comparable cases).  
  - **Step 2 (Weight)**: **Medium/Low** (if no recent evidence, weight degrades).  
  - **Step 3 (Probability)**: **Low Confidence** (if rationale is "no reason to stop").  
  - **Step 4 (Sizing)**: **≤1%** (if convention-driven).  
  - **Step 5 (Convention)**: **Forced answer**: "What breaks this convention?" (e.g., "If Sharpe ratio <0.5 for 4 quarters").  
  - **Output**: **Cut to ≤1% or justify holding with new evidence**. Truth: You’ve likely been paying for false comfort from past persistence.  

  ---  
  ### What the Procedure Can’t Do  
  1. **Predict Black Swans**: It mitigates *known* uncertainties but won’t capture unforeseeable events.  
  2. **Replace Judgment**: Weight ratings and "values calls" require debate. A third-party facilitator reduces bias.  
  3. **Eliminate Cash Drag**: "Hold cash" must be time-bound with triggers (e.g., "Wait 6 months for inflation data"). Endless cash is indefensible.  
  4. **Fix Garbage Inputs**: Relies on memos honestly applying Steps 1–3. Random audits of past memos recommended.  
  5. **Solve Groupthink**: If everyone loves a story, the procedure flags thin evidence but won’t stop a unanimous override.  

  ### Implementation Tips  
  - **Template for Memos**: Mandate sections for "Evidence Grounding," "Weight Assessment," and "Convention Rationale."  
  - **Position Size Formula**: Adjust your existing model by multiplying its output by the weight cap (e.g., if model says 3%, but weight=Medium → 3% × 2% cap = 0.06% final cap).  
  - **Board Defense for Cash**: "We’re holding 10% cash because 3 of 5 opportunities this quarter had Low Weight evidence, and we’re waiting for Q4 inflation data to trigger allocations per our procedure."  

  This turns Keynes into actionable discipline: It kills false precision, penalizes novelty without evidence, and forces honesty about convention. The output isn’t a number—it’s a structured debate with consequences for thin data.
