answer: |-
  Below is a decision tree and scorable quiz for suffering-focused ethics, designed to map intuitive judgments onto distinct ethical positions without presupposing labels. The tree starts from the shared minimal commitment that suffering is morally significant and that happiness isn't merely the mirror image of suffering. It uses 8 concrete cases (branch questions) with answer options that don't reveal their philosophical implications. The resulting 10 leaves cover the logical space, with extinctionism treated as a downstream verdict rather than a leaf. Unoccupied cells and instrument limitations are flagged.

  ---

  ### **Decision Tree: Branch Questions**

  Answer each case based on intuition. Don't overthink; choose the option that feels correct.

  1. **The Last Curtain**:  
     A button painlessly ends all sentient life. No one experiences death, grief, or loss. Pressing it causes instant, permanent extinction. Is pressing it...  
     - (A) Good  
     - (B) Bad  
     - (C) Impermissible (wrong regardless of consequences)  

  2. **False Recovery**:  
     A patient suffers agony. You can:  
     - **Option 1**: Induce a vivid delusion they’re fine (they feel happy, but the cause remains).  
     - **Option 2**: Actually cure them at 100× the cost.  
     Does Option 1 (delusion) count as removing the suffering?  
     - (A) Yes  
     - (B) No  

  3. **The Rehearsal**:  
     A climber endures brutal suffering to achieve a valued goal. They consent, don’t regret it, and see it as essential. Does the suffering...  
     - (A) Still count as a moral cost  
     - (B) Not count as a cost (due to consent/context)  

  4. **Creation Asymmetry**:  
     - Declining to create a life guaranteed net-positive (happy).  
     - Creating a life guaranteed net-negative (unhappy).  
     What is declining to create the net-positive life?  
     - (A) Reduces suffering (avoids risk of suffering)  
     - (B) Forgoes a gain (not reducing suffering)  
     - (C) Neutral (not morally significant)  

  5. **Exchange Rate (Intensity)**:  
     Prevent 1 instance of torture or allow it to prevent 1 million mild headaches?  
     - (A) Allow torture (if headaches outweigh it)  
     - (B) Never allow torture (no headaches can outweigh it)  

  6. **Exchange Rate (Aggregation)**:  
     Prevent 1 instance of severe pain or allow it to prevent 1 billion mild toothaches?  
     - (A) Allow severe pain (if toothaches outweigh it)  
     - (B) Never allow severe pain (no toothaches can outweigh it)  

  7. **Ambient vs. Induced**:  
     Identical suffering occurs:  
     - Naturally (e.g., disease).  
     - Caused by an agent (e.g., intentional harm).  
     Is the agent-caused suffering worse, holding outcomes equal?  
     - (A) No (only suffering matters)  
     - (B) Yes (caused suffering is inherently worse)  

  8. **Override**:  
     Impose mild suffering on one innocent person to prevent immense suffering for millions. Permissible?  
     - (A) Yes (if net suffering reduced)  
     - (B) No (never permissible to impose harm)  

  9. **Uncertain Sentience**:  
     An action has a 10% chance of causing severe suffering to a being that might be sentient. If not sentient, no effect. Do you...  
     - (A) Use expected suffering (10% weight)  
     - (B) Avoid unless near-certain no suffering (precaution)  
     - (C) Avoid only if probability >50%  

