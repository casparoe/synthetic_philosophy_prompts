answer: |-
  **1. Research Question and Core Distinction**
  This project asks: Does the demandingness objection to maximizing consequentialism primarily target the *quantitative size* of required sacrifice (e.g., income, time forfeited) or the *structural openness* of its requirement? Structural openness denotes the continuous recomputation of obligations based on new information, preventing any commitment, plan, or project from being treated as definitively settled. The core hypothesis is that openness, distinct from sheer cost, is a significant or even primary driver of perceived demandingness, potentially explaining why identical quantitative burdens feel more oppressive under consequentialism.

  **2. Method and Justification**
  The method constructs paired, minimal-difference thought experiments. Each pair imposes identical *expected lifetime sacrifice* but contrasts a maximizer’s open requirement (continuously recomputed) with a structurally closed alternative (e.g., a fixed rule/threshold). Intuitions about comparative demandingness within pairs are probed. This isolates openness from quantity, avoiding the confounding variables inherent in real-world comparisons or direct intuition surveys about complex theories. It directly tests if structure alone alters demandingness judgments, providing controlled evidence for the distinction's empirical reality.

  **3. Possible Conclusions and Deciding Considerations**
  Possible conclusions are: (A) Openness is a primary driver, demandingness objections largely target structure, and standard replies (e.g., acknowledging costs) miss this point; (B) Openness contributes independently, objections combine concerns, requiring distinct replies; (C) Openness is merely another cost already weighed by maximization, collapsing the distinction. (A) is supported if openness consistently increases demandingness judgments despite fixed sacrifice. (C) is supported if openness only matters via altering *expected* sacrifice. (B) arises if openness exerts a separable, non-quantifiable influence.

  **4. Scope and Failure Conditions**
  The scope is conceptual and normative analysis, focused solely on consequentialism’s demandingness objection. It excludes comparative analysis with other theories or defending consequentialism *per se*. It also brackets specific psychological mechanisms. The primary failure condition is if the distinction collapses demonstrably: if openness *only* affects demandingness by altering the *expected quantitative sacrifice* (e.g., openness increases perceived risk/uncertainty cost). Secondary failure occurs if structural openness proves empirically irrelevant to demandingness judgments in the controlled thought experiments.

  **5. Significance and Contribution**
  Successfully distinguishing structural openness from quantitative sacrifice reframes the demandingness debate. It clarifies whether objections target the *amount* given up or the *manner* of requirement. This enables more precise replies: if openness drives the objection, consequentialists must address whether continuous maximization is compatible with stable agency and personal integrity, distinct from simply justifying large sacrifices. Conversely, if the distinction collapses, it strengthens the case that demandingness is fundamentally a quantitative issue, already internal to consequentialist calculation.
