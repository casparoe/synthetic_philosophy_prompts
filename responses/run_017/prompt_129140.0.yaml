prompt: |-
  I am drawing up the specification before I read any further into accounts of imprecise credence — credence represented by a set of probability functions rather than a single one. Fix the purpose as follows: the theory is for an agent who has to act anyway on the basis of the imprecision, not merely to record it — a regulator setting a safety standard, or an engineer choosing between two designs — in a case where the disagreement among defensible probability models is itself the difficulty, and where the cost of error is badly asymmetric between the two directions in which the truth might lie.

  Write the desiderata: what a theory of rational imprecise credence has to deliver to count as adequate for that use. For each requirement give the case or consideration behind it, and mark it either non-negotiable or as the preference of one camp. I want the weight on the requirements and their motivations, not on scoring candidate views.

  Among the questions I want the list to settle:

  - the minimum of mere coherence — no sure loss, no combination of trades the agent would have accepted that guarantees a loss whichever way things go — and whether that minimum is anywhere near sufficient;
  - what the theory owes us about updating: whether it must say which members of the set get conditioned and when, and whether it may ever let incoming evidence widen the interval (the dilation phenomenon) or must never do so;
  - whether the theory must be able to learn from accumulating evidence — must the interval narrow toward precision, and on what schedule — or whether permanent, irreducible imprecision is a defensible stopping point;
  - a decision rule: when a choice is permitted or required given an interval, and whether such a rule can respect asymmetric error costs without degenerating into taking the midpoint and pretending one is precise;
  - two distinctions I have not seen drawn cleanly, which I want the list to respect: (i) imprecision that comes from thin or conflicting evidence, versus imprecision that comes from the hypothesis space itself being arbitrarily grained or badly defined; and (ii) imprecision about how confident to be, versus imprecision about which of several models to trust when all of them are empirically adequate so far. Say whether a single representational device — one convex set of probability functions — can carry both distinctions, or whether the theory needs extra structure on top of it.

  Then, briefly: if some subset of your requirements cannot be jointly satisfied, say which ones and what has to give — that is the part I most want to see. And name the single requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward.

  Please write in American English, in prose organized around the requirements list; no bibliography or citations.
reasoning: |-
  Okay, the user is designing a specification for a theory of imprecise credence tailored to decision-makers facing asymmetric costs. They need desiderata that address practical action under unresolved model disagreement. 

  First, I notice they're deeply concerned about asymmetric error consequences - like a regulator where underestimating risk has catastrophic costs versus overestimating has manageable ones. This isn't just theoretical; it's life-or-death asymmetry. They also want clarity on whether a single set-of-probabilities representation can handle different *sources* of imprecision - like sparse data vs inherently vague hypotheses.

  Hmm, their five bullet points reveal sharp priorities: 
  - They suspect mere coherence (no Dutch books) is woefully insufficient for real decisions
  - They're wary of dilation during updating (evidence widening intervals)
  - They demand learning must *eventually* narrow intervals absent perpetual ambiguity
  - They need decision rules that don't fake precision but respect asymmetry
  - They insist on distinguishing evidence-based vs ontology-based imprecision

  The core tension I see: requiring both asymmetry-sensitive decisions AND dilation-proof updating might be impossible. If asymmetric rules require extremizing (like maxmin), but dilation pulls toward opposite extremes, you get paralysis. Something has to give - probably dilation constraints must yield to error asymmetry. 

  The killer requirement? Definitely asymmetric error accommodation. It nixes both naive precise Bayesians (who collapse asymmetry) and "sensitivity analysis" add-ons (that lack teeth for action). Also rules out symmetric rules like midpoint-taking.

  For representation, a convex set *can* technically carry both evidence- and ontology-based imprecision... but without tagging which is which, decision rules might mishandle them. Extra structure seems necessary.

  Most negotiable is probably the narrowing schedule - they want learning but can tolerate slower convergence if evidence is truly conflicted. Least negotiable? Asymmetric cost handling. No compromise there when lives are at stake.
answer: |-
  Here is a specification of desiderata for a theory of rational imprecise credence tailored to your purpose, organized by requirement, with motivation and negotiability noted:

  1.  **Actionability Under Asymmetric Costs (Non-negotiable):**
      *   **Requirement:** The theory *must* provide a decision rule that mandates distinct actions depending on the *direction* and *severity* of potential error costs, even when the credal state is imprecise. It cannot default to symmetry or indecision when costs are strongly asymmetric.
      *   **Motivation:** The core use case – regulators setting safety standards (underestimating risk catastrophic, overestimation costly but manageable), engineers choosing designs (failure vs. over-engineering costs). Mere coherence is silent on asymmetric costs. A theory that doesn't mandate different actions under `[P_min(H)=0.01, P_max(H)=0.1]` vs. `[P_min(H)=0.1, P_max(H)=0.99]` given catastrophic failure if H is true, fails the purpose.
      *   **Excludes:** Theories offering only symmetric rules (e.g., always pick the midpoint, minimax regret under symmetric loss), or those that allow perpetual suspension of judgment when imprecision persists.

  2.  **Respect for Dominance & Basic Coherence (Non-negotiable):**
      *   **Requirement:** The theory must ensure the agent avoids strict dominance (no "sure loss" Dutch books) across the credal set. This is the bare minimum of rationality.
      *   **Motivation:** Foundational rationality. An agent vulnerable to guaranteed loss, regardless of the true state, is acting irrationally. However, this is *far from sufficient* for the target use, as it ignores asymmetric costs and offers no guidance for action under imprecision alone.
      *   **Sufficiency:** Nowhere near sufficient. It's the baseline floor.

  3.  **Permissible Dilation Under Ambiguity Deepening (Negotiable - Camp Preference):**
      *   **Requirement:** The theory *must allow* for the possibility of interval widening (dilation) upon receiving new evidence *if* that evidence genuinely increases ambiguity or conflict regarding the hypothesis. It *cannot mandate* that updating always narrows the interval.
      *   **Motivation:** Real-world learning: Evidence can reveal hidden complexities, conflicting interpretations, or limitations in the initial models, making the agent *less* certain, not more. Forbidding dilation forces artificial precision or ignores genuine model conflict revealed by data (e.g., new safety test shows conflicting failure modes).
      *   **Camp:** Preference of those emphasizing that imprecision reflects genuine unresolved ambiguity, not just lack of data. Opposed by those demanding monotonic learning.

  4.  **Convergence Under Unambiguous Evidence (Non-negotiable):**
      *   **Requirement:** Given a sufficiently long sequence of unambiguous, relevant evidence that consistently points in one direction and is compatible with a single underlying model, the credal interval *must* narrow, eventually converging to precise certainty or near-certainty in the limit.
      *   **Motivation:** The need for genuine learning from clear evidence. Permanent, irreducible imprecision in the face of overwhelming, unambiguous data contradicting some models in the set is irrational. The theory must allow for resolving imprecision when evidence *can* resolve it (e.g., extensive testing clearly ruling out failure modes).
      *   **Permanent Imprecision:** Defensible *only* if ambiguity is inherent (see Distinction (i)) or evidence remains genuinely conflicting/ambiguous.

  5.  **Distinguishing Sources of Imprecision (Non-negotiable for Representation Adequacy):**
      *   **Requirement (i) Evidence vs. Ontology:** The representational device must be interpretable as encoding *both* (a) imprecision arising from limited/conflicting data ("epistemic uncertainty") *and* (b) imprecision arising from inherent vagueness or granularity in the hypothesis space itself ("ontic uncertainty" or "ambiguity").
      *   **Requirement (ii) Confidence vs. Model Choice:** The representation must be interpretable as encoding *both* (a) imprecision about the *degree* of belief in a well-defined proposition given a model *and* (b) imprecision about *which empirically adequate model* is correct.
      *   **Can a Convex Set Carry Both?** *Technically yes*, a single convex set can mathematically represent both distinctions. **However:** It lacks the *semantic structure* to *differentiate* them inherently. The set `{P1, P2}` could represent two precise models both fitting the data (ii-b), or conflicting evidence about a single ill-defined concept (i-b), or simple lack of data about a precise concept (i-a). The theory *needs extra structure or interpretation rules* on top of the bare set to meaningfully distinguish these sources for decision-making and updating, especially concerning Requirements 3 & 4 (e.g., ontic vagueness might justify permanent imprecision and dilation more readily than sparse data).

  6.  **Updating Rule Clarity (Non-negotiable):**
      *   **Requirement:** The theory *must* specify a clear, general rule for how the credal set is updated upon receiving new evidence. It must state definitively *which* probability functions are conditioned and *how* (e.g., standard conditioning applied to all functions in the set compatible with the evidence).
      *   **Motivation:** Practical necessity for implementation. A theory without a defined update rule is incomplete and unusable for sequential decision-making. Agents *will* update; the theory must say how they *should* update rationally.

  **Conflict and Trade-offs:**

  *   **Core Conflict:** **Asymmetric Cost Handling (Req 1) vs. Dilation Permission (Req 3) vs. Convergence (Req 4).** Aggressive asymmetric rules (e.g., Maxmin, Gamma-Maximin) often require "extremizing" based on the worst case. This can conflict with convergence if persistent ambiguity justifies dilation or permanent wide intervals (Req 3 & 4). Conversely, forcing convergence (Req 4) can clash with permitting genuine dilation (Req 3) when evidence deepens ambiguity. **What Gives?** Requirement 4 (Convergence) must yield *if* ambiguity is genuinely inherent (Distinction i-b) or evidence remains conflicted. Requirement 1 (Asymmetric Costs) is non-negotiable for the use case. Therefore, the decision rule (Req 1) must be robust enough to mandate action *despite* persistent imprecision or even dilation, leveraging the asymmetry directly without assuming convergence. Requirement 3 (Dilation Permission) cannot be sacrificed if the theory is to acknowledge genuine ambiguity deepening.
  *   **Representation Challenge:** While a convex set *can* represent all distinctions (Req 5), the lack of inherent differentiation means the *update rule* (Req 6) and *decision rule* (Req 1) must be sophisticated enough to potentially respond differently based on the *interpreted source* of imprecision (requiring that "extra structure"), especially concerning whether narrowing (Req 4) is expected or dilation (Req 3) is permissible.

  **The Single Requirement Excluding Most Candidates:**
  **Asymmetric Cost Handling (Requirement 1)** is the primary filter. It decisively excludes:

  1.  **Precise Bayesianism (even with sensitivity analysis):** Sensitivity analysis identifies a range but offers *no rational decision rule* for acting within that range under asymmetry. The precise Bayesian must still pick a single point (e.g., via expected utility), collapsing the sensitivity analysis and ignoring the asymmetry inherent in the *range itself*.
  2.  **Symmetric Decision Rules:** Rules like choosing the midpoint, maximizing average probability, or minimax regret under symmetric loss functions fail to mandate different actions based purely on the *direction* of potential error cost embedded in the imprecision.
  3.  **Theories Prioritizing Indecision:** Views that see persistent imprecision as always permitting suspension of judgment cannot mandate the decisive action required when one error direction is catastrophic.

  This requirement forces the theory to directly incorporate the asymmetric cost structure into the *core decision rule* operating on the imprecise credal state itself, moving far beyond mere coherence or descriptive sensitivity analysis.
