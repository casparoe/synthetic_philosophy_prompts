prompt: |-
  I keep going back and forth on what you're even supposed to do when you're not sure which moral theory is true, and every paper I pick up just proposes a procedure and defends it, so I want the spec before I read more of them. Write me the desiderata that an account of decision-making under moral uncertainty has to meet to be good enough for someone who actually has to choose — output an action for a one-off high-stakes case, not a verdict about what's subjectively right in the abstract — with the motivating case behind each requirement and a note on which ones are non-negotiable and which are really just the prejudices of one camp. The cases I want covered: theories that disagree about what the options even are (one says you may lie, the other says lying isn't available to you as an option at all); theories that disagree about whether intertheoretic value is comparable or even cardinal, like being ninety percent on some kind of utilitarianism and ten percent on a rights view that says certain acts can't be traded off at any probability however small; a theory you barely believe in that nonetheless threatens to swamp the calculation because the stakes it assigns are astronomically larger; cases where following the procedure predictably changes which theories you'll believe later, including a theory that tells you to make yourself more confident in it or to get rid of evidence that would move your credences; and being uncertain both about the first-order moral theory and about which procedure for handling that uncertainty is correct, without the second-order regress eating itself. I'd also want to know what the procedure owes us about blame and regret when you act on your best judgment and the theory you gave most credence to turns out to be wrong. Tell me which of these demands are the ones I should drop — which are genuine requirements on any such account and which are smuggled in from outside (I suspect the anti-fanaticism one is, but argue either way) — and whether any two of the desiderata on your list can't be jointly satisfied, especially whether you can have both proper sensitivity to small credences in enormous-stakes theories and any immunity at all to being blackmailed by a view you basically don't believe. Then a couple of sentences on which single requirement knocks out the most contenders; I don't need a full scorecard. And please write it as continuous prose, no headings or bullet points or bold or tables, like an email.
reasoning: |-
  Okay, the user is really struggling with how to make decisions when they're not sure which moral theory is correct. They're frustrated because every paper they read just proposes a procedure without giving them the criteria to evaluate it. They want a set of desiderata - essentially a spec - before diving into more literature. 

  Hmm, this is clearly someone deeply engaged with moral philosophy, probably a grad student or early-career academic given their familiarity with technical terms like "intertheoretic value comparability" and "cardinality." The frustration suggests they've hit a wall in their research. 

  What they're asking for is quite comprehensive - they want desiderata covering five specific hard cases: 
  First, when theories disagree about what even counts as an option (like whether lying is an available action). 
  Second, when theories have incomparable values (utilitarianism vs absolute rights). 
  Third, when a barely-believed theory threatens to dominate due to huge stakes ("fanaticism" problem). 
  Fourth, when the decision affects future beliefs (like theories that demand self-brainwashing). 
  Fifth, and most challenging, how to handle uncertainty about the uncertainty procedure itself (infinite regress problem).

  They also want two meta-aspects: 
  How to handle blame/regret when acting on wrong credences. 
  And crucially, which desiderata are truly essential versus which reflect philosophical biases.

  The anti-fanaticism point is particularly interesting - they suspect it's smuggled in, but want an argument either way. And they're worried about contradictions between desiderata, especially sensitivity to small-probability huge-stakes theories versus immunity to "moral blackmail."

  This requires careful structuring. I'll need to: 
  First identify core non-negotiable requirements (like actually outputting an action). 
  Then show how each hard case generates a specific desideratum. 
  For each, indicate whether it's essential or debatable. 
  Finally analyze tensions - particularly fanaticism vs blackmail immunity - and which requirement eliminates most approaches.

  The blame/regret point is important but secondary - it's about post-decision justification rather than the decision procedure itself. Should address it briefly after the main framework.

  Biggest challenge will be explaining why anti-fanaticism isn't just bias while acknowledging its controversial status. The key is distinguishing practical action-guidance from theoretical purity - a procedure that always obeys tiny-credence astronomical demands isn't usable for actual decisions.

  Also need to emphasize why the regress problem (uncertainty about uncertainty procedures) is the true killer - it makes everything else moot if not solved. MITE approach seems most promising here by cutting the regress at the first meta-level.
answer: |-
  Here's how I'd frame the desiderata for a decision procedure under moral uncertainty, tailored to your concerns about one-off, high-stakes action-guidance, with the cases motivating each requirement. The core tension lies in balancing robust action-guidance against respecting deep theoretical disagreements without collapsing into fanaticism or paralysis.

  First, **Output Specific Action:** Any procedure must output a concrete action for the specific choice situation, not just a verdict on subjective rightness. This is non-negotiable. Your motivating case is the entire purpose of seeking guidance – you face a real, pressing decision. Procedures that only rank options abstractly or declare "subjective permissibility" fail this test if they don't pick an act.

  Second, **Option-Set Agnosticism:** The procedure must handle fundamental disagreement about what constitutes an available *option*. If Theory A says lying is forbidden (and thus not a genuine option) while Theory B permits it, the procedure cannot simply presuppose a shared option set. It must either resolve this (e.g., by treating "impossible" acts as having dire consequences under the theory forbidding them) or operate on a meta-set of physically possible acts. This is likely non-negotiable; ignoring option-set disagreement renders the procedure blind to deep moral conflicts. Your "lying isn't an option" case drives this.

  Third, **Value Comparability Agnosticism (Cardinal & Ordinal):** The procedure must function even when theories disagree profoundly on the *type* of value they posit (e.g., cardinal utility vs. inviolable rights) and whether values are *comparable* across theories. Your 90% util/10% rights case, where rights forbid trade-offs at any probability, highlights this. A procedure assuming easy intertheoretic value comparisons smuggles in a controversial meta-ethical commitment (e.g., utilitarianism about uncertainty). This is non-negotiable; forcing comparability distorts the uncertainty it's supposed to handle. Procedures must work under assumptions of *incomparability* or *ordinality only*.

  Fourth, **Fanaticism Constraint:** The procedure must not be *overly* sensitive to tiny credences in theories with astronomically large stakes, swamping the calculation. Your "barely believed theory threatens to swamp" case is key. While sensitivity to stakes is desirable, *absolute* sensitivity leads to absurdity (e.g., sacrificing the world to avoid a 1-in-10^100 chance of violating a barely credible theory demanding it). However, **this is the most debatable ("smuggled") requirement.** Proponents of maximizing expected choice-worthiness *argue* that if you genuinely assign *any* credence to a theory with infinite (or vast) disvalue for an act, you *must* avoid that act. Opponents see this as paralyzing or counterintuitive, demanding a form of *practical* discounting for low credence/high stakes or recognizing lexical thresholds. It's less a strict requirement of logic and more a demand for *practical robustness* and avoiding moral blackmail by fringe views. You should be wary of dropping it lightly, as it impacts usability profoundly.

  Fifth, **Dynamical Stability:** The procedure should be stable under predictable belief shifts caused by the act itself. If following a procedure (e.g., avoiding evidence) predictably increases credence in a theory demanding that very avoidance, this creates self-reinforcing loops or perverse incentives. Your case of theories demanding confidence-boosting or evidence destruction necessitates this. It's non-negotiable for ensuring the procedure guides coherent *agents* over time, not just isolated acts.

  Sixth, **Regress Termination:** The procedure must handle uncertainty *about which uncertainty procedure is correct* without infinite regress. Your "second-order regress" case is critical. Requiring a fixed meta-procedure (like "Myopic Instability-Tracking Equilibrium" - MITE - acting *as if* your current credences over procedures are correct for *this* decision, allowing belief updates afterward) is likely non-negotiable. Without it, no action is possible.

  Seventh, **Post-Hoc Justification (Blame/Regret):** While not dictating the act, the procedure should ideally provide resources for framing reasonable blame or regret. If you act on your best judgment (using the procedure) but the theory you gave highest credence turns out correct *and* condemns your act, can you justify it? Does the procedure itself offer a standard for "subjectively reasonable" that mitigates blame from the *true* theory? This is desirable but potentially secondary; a good procedure might inherently provide this (e.g., by maximizing expected choice-worthiness relative to credences), but it's less core than action-guidance.

  **Tensions and Knockouts:** The sharpest conflict is between **Value Comparability Agnosticism** (especially respecting incomparability) and **Fanaticism Constraint**. Procedures demanding cardinal comparability (like Expected Choice-Worthiness Maximization - ECWM) fail Comparability Agnosticism. Procedures respecting incomparability (like a "Moral Hedging" or "Maximin" approach) often struggle terribly with Fanaticism. Simultaneously achieving **sensitivity to small credences** (without fanaticism) and **immunity to blackmail by barely-believed theories** is nearly impossible; the Fanaticism Constraint *is* the demand for that immunity. Relaxing it allows sensitivity; enforcing it demands discounting.

  The single requirement that knocks out the most contenders is **Value Comparability Agnosticism**, particularly the demand to function under fundamental *incomparability*. Most popular procedures (ECWM, Borda Counts, even many variance-based approaches) implicitly or explicitly require cardinal comparability or strong ordinal rankings. Genuinely accommodating incomparability forces radical departures (like multi-dimensional decision rules or satisficing under veto powers) that often conflict sharply with other intuitions, especially about balancing probabilities and stakes. **Regress Termination** is the silent killer, as many intuitively plausible procedures collapse when asked to justify themselves under second-order uncertainty.

  In essence, you need a procedure that outputs an action for your specific dilemma, respects deep disagreements about options and value types without assuming easy conversions, doesn't get hijacked by barely credible cosmic threats, remains stable when your beliefs might change because of the act, and doesn't require you to be certain about how to handle uncertainty *before* you can act. The fanaticism constraint, while arguably "smuggled," is practically essential for robust decision-making in a world containing wildly divergent moral claims; dropping it leaves you vulnerable to moral extortion. Finding a procedure satisfying *all* these, especially Comparability Agnosticism and Fanaticism Constraint jointly, remains the holy grail and likely requires significant compromise on intuitive notions of "balancing" probabilities and stakes across incommensurable domains.
