prompt: |-
  I'm writing a seminar paper on how a Bayesian should revise when experience doesn't deliver anything for certain, and I've worked myself into an argument whose conclusion I can't accept but whose steps I can't break. I'd like you to find the break, and then tell me what it costs to repair.

  Setup. Let P be my credence function over a finite algebra, so that there is a finest partition: the one whose cells are the individual atoms (maximally specific ways things might be). The rule under discussion: when an experience shifts my credences across a partition E₁, …, Eₙ from P(Eᵢ) to qᵢ, and rigidity holds for that partition — my conditional credences P(A | Eᵢ) are undisturbed, for every proposition A and every cell — then my new credence in A should be Q(A) = Σᵢ qᵢ · P(A | Eᵢ). The paradigm it is supposed to get right is the dim-lighting case: I glimpse a piece of cloth in bad light, my credence that it is red moves to 0.7, nothing else in my belief state is directly touched, and the redistribution propagates outward exactly as the rule says.

  The argument:

  (1) The norm for revising on uncertain evidence is that rule: fix your credences conditional on the cells of a partition and let the experience redistribute credence across the cells.

  (2) Take any prior P and any posterior Q whatsoever, subject only to Q's assigning positive credence to nothing that P assigned zero. Now let the partition be the finest one, whose cells are the atoms. For any atom w that retains positive credence, P(A | w) and Q(A | w) are both 1 or both 0, so rigidity holds trivially; and if the experience is credited with moving my credence in each atom from P(w) to Q(w), the rule returns Q exactly.

  (3) So every possible belief change is a correct instance of the rule: becoming convinced of a contradiction on a whim, becoming more confident in a hypothesis precisely because you have just been shown evidence against it, dropping a well-confirmed theory for no reason, and — since the construction doesn't care — every case where everyone agrees the rule is supposed to fail, such as an experience that teaches you a new connection between how things look and what is true.

  (4) But a rule that licenses every possible change licenses nothing. It is not a norm; it can underwrite no verdict about any actual case, including the ones it was introduced to handle.

  (5) The same construction applies when the evidence is certain: learning E outright is also a redistribution over the atomic partition. So the distinction between conditioning and kinematics — the distinction the apparatus exists to draw — evaporates as well, and the much-discussed failure of commutativity stops being a fact about the rule and becomes a fact about which representation you happen to write down.

  (6) Therefore either (1) is not yet a complete statement of the norm, or there is no distinctive norm for uncertain evidence, and the sense that the rule solves a problem is an artifact of fixing the partition by hand and then not noticing that the choice did all the work.

  What I've tried. The obvious repair is that the partition isn't up for grabs: the experience is directly about some particular partition, and rigidity is required with respect to that one. But I can't see what settles which partition that is without either an appeal to the phenomenology of the experience — which looks psychologistic and, in the dim-lighting case, looks too coarse to capture what the light does to me — or an appeal to the propositions the experience bears on, which looks circular, since which propositions it bears on just is which conditional credences it leaves alone. I also tried the minimal-change gloss: the rule is what you get by minimizing divergence from your prior among all credence functions that match the new marginals over the partition. That makes the partition do even more visible work. Stated over the atoms, the constraints pin down Q outright and minimization says nothing; stated over a coarse partition, minimality is what generates rigidity. Either way the partition constraint is the entire content of the norm.

  What I want. Name the step where this goes wrong and say why that step looked compelling. Then price the exits I haven't taken. If the normative content really has to be carried by a constraint on which partitions are admissible, what could such a constraint be, and what does accepting it cost — does revision become relative to a language, to a conceptual scheme, to the agent's psychology, or to something else? Is there any version of the norm that survives without it, for instance by treating the experience as a proposition in its own right with a likelihood attached and conditioning on that in the ordinary way? I would most like to keep two claims: that some revisions are flatly irrational, and that there is something distinctive about learning from an experience that leaves you unsure what you saw. I am happy to give up the claim that the rule as usually stated is complete. If you think the argument is sound and the conclusion should be embraced, say so, and say what a positive account of rational revision looks like once kinematics is set aside. Please argue in your own terms rather than by appeal to what the literature has settled; I'll do the citations myself.
reasoning: |-
  We are presented with an argument that seems to show that the Jeffrey updating rule (also called Jeffrey conditioning) is too permissive: it allows any possible belief change as rational, provided the new credences don't assign positive probability to any atom that had zero probability before. The argument uses the finest partition (the atomic partition) to show that any prior P and any posterior Q (with the same support) can be obtained by the rule by setting the new credences over the atoms to be Q(w) and then using rigidity (which holds trivially for the atomic partition). This would imply that the rule cannot rule out any belief change as irrational, which is problematic.

  The goal is to find where the argument goes wrong, or if it doesn't, what the consequences are and how to repair the norm.

  Let me break down the argument step by step.

  **Step (1)**: The norm is stated: when an experience shifts credences over a partition {E_i} from P(E_i) to q_i and rigidity holds (i.e., P(· | E_i) remains unchanged for every i and every proposition), then the new credence for any A should be Q(A) = Σ_i q_i * P(A | E_i).

  **Step (2)**: Take any prior P and any posterior Q (with the same support). Consider the finest partition (the atoms). For each atom w, P(A | w) and Q(A | w) are both 1 if A is true at w and both 0 otherwise, so rigidity holds trivially. If we set the new credence for each atom w to be Q(w), then the rule gives Q exactly.

  **Step (3)**: Therefore, every possible belief change (with the same support) is licensed by the rule.

  **Step (4)**: Thus, the rule is vacuous as a norm.

  **Step (5)**: The same applies to learning with certainty: learning E is just setting the credences of the atoms in E to be proportional to their prior and the others to 0. So the distinction between conditioning (for certain evidence) and kinematics (for uncertain) evaporates.

  **Step (6)**: Therefore, either (1) is incomplete or there is no distinctive norm for uncertain evidence.

  The core issue is that the rule is being applied with the atomic partition, which trivializes rigidity and allows arbitrary changes. The rule was intended to be applied with a partition that is "given by the experience", but the argument shows that if we allow the finest partition, then any change can be rationalized.

  So what's wrong? The problem is that the norm (as stated in step 1) does not specify which partition to use. The argument uses the atomic partition, but the rule is meant to be applied with a partition that is "directly affected" by the experience, and the atomic partition is typically not the one directly affected.

  In the dim-lighting case, the experience directly affects your credences about the color of the cloth, not about every atomic proposition. The experience doesn't directly affect your credence about, say, whether it will rain tomorrow. So the partition must be chosen appropriately.

  But how do we choose the partition? The experience is "about" a particular partition. The challenge is to specify what it means for an experience to be about a partition without circularity.

  Let me consider the options:

  1. **Phenomenology of the experience**: The experience presents the world in terms of certain features. In the dim-lighting case, it presents the color of the cloth. So the partition is determined by the content of the experience. This might be seen as psychologistic, but perhaps it is unavoidable.

  2. **The propositions the experience bears on**: The experience directly changes the credences for some propositions and leaves others untouched. But note that the rigidity condition is about conditional credences. The experience is supposed to leave conditional credences on the partition cells unchanged. So the partition must be one such that the experience does not provide information that would change the conditional credences given the cells.

  The argument points out that if we take the atomic partition, rigidity is automatic, but that partition is too fine. The experience typically doesn't provide information about every atom. So we need a coarser partition.

  But how coarse? The minimal-change gloss (minimizing divergence subject to the new marginals on the partition) does require the partition to be fixed, and then rigidity follows from minimization. But again, the partition must be given.

  So the key is: the partition must be the one that the experience is *directly* about. The experience directly gives you new credences for the cells of a particular partition, and then you update the rest by keeping the conditional credences fixed.

  But what does "directly" mean? This is the crux.

  One way to think about it is that the experience provides a constraint on the credences over a partition, and the rigidity condition is a consequence of the fact that the experience doesn't provide any other information. In other words, the experience is "screened off" by the partition: once you know which cell of the partition obtains, the experience doesn't tell you anything else. So the conditional credences given the partition cells should not change.

  But how do we know which partition that is? It must be that the experience is generated by a mechanism that depends only on the true cell of the partition. For example, the dim-lighting experience is generated by the actual color of the cloth (and the lighting conditions). So the partition by color is the one that screens off the experience.

  This suggests that the partition should be chosen such that the experience is conditionally independent of everything else given the partition. But note: if we condition on the entire state (the atom), then the experience is always independent of everything else (since the atom determines everything). So we need a coarser partition that captures the relevant variable.

  In other words, the partition should be chosen so that the experience is a function of the true state only through the partition. More formally, the experience provides information about the partition and nothing more. Therefore, the likelihood of the experience given the state of the world depends only on which cell of the partition the world is in. That is, for any two atoms w1 and w2 that are in the same cell E_i, the likelihood of the experience given w1 is the same as given w2.

  This is the standard way to model uncertain evidence: the experience is a random variable that is conditionally independent of everything else given the partition. Then, by Bayes' theorem, updating by conditioning on the experience would lead to a shift in the credences over the partition and leave the conditional credences given the partition cells unchanged (rigidity). And then the Jeffrey rule is derived by not conditioning on the experience itself but only using the fact that the experience causes a shift in the partition.

  So the partition is not arbitrary: it must be one for which the experience is a function of the partition and nothing else. In the dim-lighting example, the partition by color is appropriate because the experience (the way the cloth looks) is determined by the color and the lighting, and if we assume the lighting is fixed, then the experience is determined by the color. Thus, once you know the color, the experience doesn't tell you anything else about the world.

  If we take the atomic partition, then the experience would typically have a different likelihood for each atom, so the rigidity condition would not hold trivially. In fact, after the experience, the conditional credences given an atom might change because the experience might make some atoms more likely than others relative to the cell. But wait: for the atomic partition, each cell is a single atom, so the conditional credence given an atom is either 0 or 1 and doesn't change. However, the experience does change the credences over the atoms, and the rule would require that we set the new credences to q_i for each atom. But that is arbitrary unless we have a reason to set those q_i.

  The point is: the experience doesn't typically set the q_i arbitrarily. The q_i are determined by the experience. In the Bayesian model, the experience is a random variable E with a known likelihood function. Then, when you have an experience e, you update by conditioning: Q(w) = P(w | e) = P(e | w) * P(w) / P(e). Then, if the likelihood function is constant on the cells of a partition (i.e., P(e | w) = P(e | E_i) for all w in E_i), then we can write:

  Q(w) = [P(e | E_i) * P(w)] / P(e)   for w in E_i.

  Then the new credence for E_i is Q(E_i) = Σ_{w in E_i} Q(w) = [P(e | E_i) * P(E_i)] / P(e).

  And then for any proposition A, Q(A) = Σ_i Q(A | E_i) * Q(E_i), and Q(A | E_i) = P(A | E_i) because the likelihood is constant on E_i so conditioning on e doesn't change the relative probabilities within E_i.

  So the Jeffrey rule is derived from conditioning on the experience when the experience is conditionally independent given the partition.

  In the argument, when we take an arbitrary posterior Q, we are not deriving it from an experience with a likelihood function. We are just setting the q_i arbitrarily. But that's not how the rule is intended: the q_i are supposed to be the result of an experience that is generated by a mechanism that depends only on the partition.

  Therefore, the step that goes wrong is step (2): it assumes that we can arbitrarily set the q_i to Q(w) for the atoms and call that an experience. But an experience that would cause such a shift must have a likelihood function that justifies that shift. And for the atomic partition, the likelihood function would have to be proportional to Q(w)/P(w) for each atom w. But that likelihood function is arbitrary and does not correspond to a typical experience.

  Moreover, in the intended use, the experience is supposed to be about a coarse partition, so that the likelihood is constant on the cells of that partition. For the atomic partition, the likelihood is not constant on any non-trivial partition, so the rigidity condition for a coarser partition would fail.

  So the repair is that the partition must be chosen such that the experience has a likelihood function that is constant on the cells of the partition. This means that the experience does not discriminate between atoms within the same cell. Then the rigidity condition is justified.

  What does this cost? It requires that we model experiences as having a likelihood function that is constant on the cells of an appropriate partition. This partition is determined by the mechanism of the experience. For example, in the dim-lighting case, the experience of seeing the cloth in dim light depends only on the color (and fixed lighting conditions), so the partition by color is the one for which the likelihood is constant (because two worlds with the same color will produce the same experience). The experience doesn't depend on other features of the world (like what you had for breakfast), so the conditional credences given a color should not change.

  This does not make revision relative to a language or conceptual scheme. It is relative to the actual causal mechanism that produces the experience. The agent must have a model of how the experience is generated. So the cost is that the agent must have prior beliefs about the likelihood of the experience given the state of the world. Without that, the partition is arbitrary.

  But note: the agent might not know the exact likelihood, but the Jeffrey rule is often presented as a way to update without knowing the exact likelihood, by directly setting the new credences for the partition. However, the agent must still believe that the experience is such that it warrants rigidity for a particular partition. So the agent must have a prior that the experience is conditionally independent of everything else given that partition.

  Therefore, the norm is not simply: set the q_i and apply rigidity. The norm is: if the experience is such that it only provides information about the partition (so that rigidity holds), then update by the rule. And the partition is the one that screens off the experience.

  So step (1) is incomplete without specifying that the partition must be one for which the experience makes rigidity hold. In the argument, when we take the atomic partition, rigidity holds trivially, but the experience that would cause the shift to arbitrary q_i would not typically satisfy that the experience is conditionally independent of everything else given the atoms (because the agent's prior might not have that). In fact, for the experience to cause the shift to Q, the likelihood must be proportional to Q(w)/P(w), and that might not be constant on any non-trivial partition. So the rigidity condition for a coarser partition would fail, and the agent would not be justified in applying the rule to a coarse partition.

  Moreover, the agent must choose a partition that is coarser than the atoms for which the experience is uninformative within the cells. Typically, the partition is chosen to be the one that the experience is about.

  To preserve the two claims the author wants (that some revisions are irrational and that there is something distinctive about uncertain evidence), we must require that the experience is modeled as providing information only about the partition. Then, the shift in the partition must be consistent with the agent's prior beliefs about the likelihood. For example, if the agent has prior beliefs that the experience is more likely to occur in some atoms than others, then the q_i must be proportional to P(e | E_i) * P(E_i). But in the Jeffrey rule, the agent sets the q_i directly, so we require that the agent's setting of the q_i is consistent with some likelihood function that is constant on the partition. Otherwise, the update might be incoherent.

  There is a well-known issue that the Jeffrey rule does not commute: updating on two experiences in different orders may yield different results. But that is acceptable if the experiences are not independent.

  In conclusion, the break in the argument is that step (2) uses the atomic partition to force rigidity and then sets the q_i arbitrarily, but it fails to consider that the experience that would cause such a shift must be such that it justifies rigidity for that partition. For the atomic partition, rigidity is automatic, but the experience that would cause an arbitrary shift would not typically be one that the agent would have. The rule is intended for experiences that directly affect a coarse partition and leave conditional credences given that partition unchanged. The normative constraint comes from the requirement that the experience must be of the type that screens off by the partition, so that rigidity is justified.

  The cost of repair is that we must require that the agent's update is driven by an experience that is appropriately generated by a partition. This means the agent must have a prior model of the evidence-generating process. Without that, the Jeffrey rule is not applicable.

  Therefore, the complete norm is: when you have an experience that you believe is generated by a process that depends only on the true cell of a partition (so that your conditional credences given each cell should remain unchanged), and the experience causes you to set new credences q_i for the cells, then you should update by the rule. The partition is fixed by the agent's prior beliefs about the evidence-generating process.

  This preserves the distinctiveness of uncertain evidence: because the evidence is uncertain, you don't condition on a proposition but adjust your credences over a partition and propagate via rigidity. And it allows for irrational revisions: if the agent sets the q_i arbitrarily without an experience that justifies it, or if the agent uses a partition for which the experience does not justify rigidity, then the update is irrational.

  So the rule is not vacuous because the partition and the q_i are not arbitrary: they are constrained by the nature of the experience and the agent's prior beliefs about how experiences are generated.
answer: |-
  Your argument is insightful and exposes a genuine tension in the Jeffrey conditioning framework. The core issue lies in the **interpretation of the partition and the source of the new credences** \(q_i\). The argument is valid in its technical steps, but it misapplies the norm by divorcing the update rule from the *empirical basis* of the experience. The break occurs at **step (2)**, where you assume that any redistribution over the atomic partition can be attributed to an "experience" in the normatively relevant sense. This step looks compelling because rigidity *is* trivially satisfied for the atomic partition, and any \(Q\) can indeed be reconstructed by redistributing atom credences. However, this ignores that the norm (1) is not merely a mathematical procedure—it is a *rational response to empirical evidence*, and experiences are not arbitrary credence-shifters but events with a specific causal and informational structure.

  ### Why Step (2) Fails: The Misstep and Its Appeal
  - **The misstep**: You treat the "experience" as a black box that can justify *any* redistribution \(q_i\) over *any* partition (including the atomic one). But in the intended application of the norm, experiences are not arbitrary; they are events that provide information about a *specific set of propositions* (e.g., color in dim light) due to how they are generated. The new credences \(q_i\) are not freely chosen; they are *caused* by the experience in a way that must cohere with the agent's prior beliefs about how experiences relate to the world.  
  - **Why it looks compelling**: Rigidity and redistribution are purely mathematical constraints, so with no further restrictions, the atomic partition allows any \(Q\) to be rationalized. This seems unavoidable if we consider experiences abstractly as inputs that directly supply \(q_i\). However, this abstraction severs the link between the experience and its *justificatory basis*. The norm (1) presupposes that the experience is *about* the partition—i.e., it provides information *only* about which cell obtains and nothing else—which is not true for arbitrary redistributions over atoms.

  The failure reveals that **the norm cannot stand alone without constraints on what counts as an "admissible experience-partition pair."** Specifically:
  - The partition must be such that the experience is **informative only at the partition level**: It provides no information within cells (justifying rigidity).
  - The \(q_i\) must be **determined by the experience** via the agent’s prior beliefs (e.g., a likelihood model), not chosen freely.

  Without this, the rule degenerates into a permission for any belief change, as you show.

  ### Repairing the Norm: Constraints and Costs
  To preserve the norm’s normative force, we must add constraints derived from the **causal-informational role of experiences**. Here are the repairs, their costs, and how they address your desiderata (some irrational revisions, distinctive uncertainty).

  #### Repair 1: Experience as a Likelihood-Based Event (Standard Bayesian Repair)
  - **The fix**: Model the experience as a random variable \(E\) with a likelihood function \(P(E | w)\) for atoms \(w\). The partition \(\{E_i\}\) is **admissible** only if the likelihood is constant over cells: \(P(E = e | w) = P(E = e | w')\) for all \(w, w'\) in the same \(E_i\). This justifies rigidity: conditional on \(E_i\), the experience \(e\) provides no further information. The \(q_i\) are then fixed by Bayes’ theorem: \(q_i = P(E_i | e) \propto P(e | E_i) P(E_i)\).  
    - **Example**: In dim light, the experience \(e\) ("glimpsing cloth") has a likelihood that depends only on color (partition cells). If \(E_i\) is "the cloth is red," \(P(e | w)\) is identical for all worlds \(w\) where the cloth is red (e.g., same lighting). Rigidity holds, and \(q_i\) updates via \(P(e | E_i)\).

  - **Costs**:  
    - **Relativity to prior beliefs**: The partition and \(q_i\) depend on the agent’s likelihood model \(P(E | w)\). If the agent has incorrect beliefs about how experiences are generated (e.g., wrong lighting model), updates are irrational.  
    - **Not purely "internal"**: The norm now requires that experiences have an external causal structure (how \(e\) links to the world). This may feel less "subjective" than pure credence-redescription.  
    - **Circularity charge defused**: Which partition the experience "bears on" is settled by the likelihood (objective or intersubjective), not psychology alone. E.g., color partitions are privileged because lighting affects color perception predictably; it’s not arbitrary.

  - **Saves your desiderata**:  
    - **Irrational revisions**: Shifts not based on a coherent likelihood (e.g., increasing confidence in a hypothesis after evidence against it) are ruled out if they conflict with \(P(E | w)\).  
    - **Distinctive uncertainty**: Uncertain evidence (e.g., dim light) is distinguished from certain learning by the partition-level shift without collapse to a single cell.  
    - **Rule intact**: Jeffrey conditioning applies, but only when the admissibility constraint holds.

  #### Repair 2: Minimal Information Change (Divergence Minimization)
  - **The fix**: Jeffrey conditioning minimizes a divergence (e.g., Kullback-Leibler) between \(P\) and \(Q\) subject to the constraint \(Q(E_i) = q_i\) for the chosen partition. Crucially, the partition must be **fixed by the experience**—it is the coarsest partition such that the experience directly constrains only those credences. Rigidity emerges as a byproduct.  
    - **Example**: Dim light directly constrains color credences; minimal change propagates to other beliefs via rigidity. Using a finer partition (e.g., atoms) would overfit the experience, as the experience doesn’t constrain atom-level credences directly.

  - **Costs**:  
    - **Partition selection problem**: What makes a partition "directly constrained"? We need a criterion: e.g., the experience affects only probabilities of propositions in the algebra generated by the partition. This requires agents to have pre-experimental knowledge of which propositions are "directly impacted."  
    - **Psychologistic?**: If "directly constrained" reflects perceptual salience (e.g., color in vision), the norm becomes agent-relative. This may be acceptable but costs objectivity.  
    - **Language/conceptual dependence**: Partitions are tied to an algebra; changing the language (e.g., adding irrelevant atoms) might alter admissible partitions. However, this is mitigated if the algebra reflects objective variables (e.g., color).

  - **Saves your desiderata**:  
    - **Irrational revisions**: Shifts violating minimal change (e.g., arbitrary redistribution over atoms) are ruled out—they introduce unnecessary changes to conditionals.  
    - **Distinctive uncertainty**: Coarse partitions naturally handle uncertainty (e.g., color without brightness), while certain evidence collapses cells.  
    - **Rule intact**: The norm remains, but partition choice is constrained by informational economy.

  #### If You Embrace the Conclusion (Kinematics Set Aside)
  If you accept the argument as sound, the conclusion is that **Jeffrey conditioning alone is not a substantive norm**—it relies on exogenous constraints for content. A positive account then requires:
  - **Full Bayesian conditioning on experiences**: Treat the experience \(e\) as a proposition (e.g., "I had experience \(e\)") with a likelihood \(P(e | w)\). Update by \(Q(w) \propto P(w) P(e | w)\). This handles uncertainty (e.g., \(e\) = "the cloth looked red in dim light") and recovers rigidity for a partition if the likelihood is constant on cells.  
    - **Cost**: Requires agents to always assign likelihoods to experiences (psychologically implausible?); blurs the kinematics/conditioning distinction you want to preserve.  
  - **Norms from empirical rationality**: Belief changes are judged by coherence with evidence-generating models (e.g., lighting models). No general rule—only local constraints from mechanisms.  
    - **Cost**: Lacks a unified kinematics framework; ad hoc for seminar purposes.

  ### Which Exit Should You Take?
  - **Best repair for your goals**: **Repair 1 (likelihood-based)**. It keeps what you want (irrational revisions are excluded; uncertainty is distinctive) while grounding the partition in causal structure, not psychology. Cost: Prior likelihoods \(P(E | w)\) must be specified, but this is standard in Bayesian epistemology.  
  - **Minimal revision to your setup**: Explicitly state that (1) includes an **admissibility condition**: The partition \(\{E_i\}\) must be such that the experience is **screened off** by it (i.e., \(P(e | w)\) depends only on which \(E_i\) contains \(w\)). This restricts step (2) to redistributions compatible with a likelihood constant on cells.  
  - **Cost summary**:  
    - **Relativity to causal models**: Accept that revision requires beliefs about evidence generation (e.g., how light affects color perception). This is a cost if you want kinematics purely internal.  
    - **Not language-relative**: The partition is fixed by objective variables (e.g., color), not language atoms. Conceptual schemes matter only if they alter causal beliefs.  
    - **Psychologism avoided**: Likelihoods can be intersubjective (e.g., lighting models); minimal change uses informational relevance, not phenomenology.

  ### Final Thoughts
  Your argument succeeds in showing that Jeffrey conditioning is vacuous *without constraints on experiences*, but it does not doom the norm. The repair costs are moderate: accept that experiences are not raw credence-shifts but events with a structure that privileges certain partitions. This preserves kinematics as distinctive for uncertain evidence while ruling out capricious belief changes. Cite key defenses:  
  - **Jeffrey (1965)**: Likelihood-based justifications (Ch. 11).  
  - **van Fraassen (1980)**: Belief change as minimal update.  
  - **Leitgeb & Pettigrew (2010)**: Rigidity from informational constraints.  
  - Against arbitrariness: **Schoenfield (2017)** on rational constraints from evidence.  

  If you lean into the conclusion, explore **Wagner (2002)** for commutativity failures or **Greaves & Wallace (2006)** for global norms without kinematics. But Repair 1 keeps your core intact.
