answer: |-
  Here’s a precisification of "you can't help what you feel," dissected into distinct theses, with verdicts on defensibility, implications for your episodes, and boundary cases. The core ambiguity lies in conflating **involuntariness** with **non-assessability** or **non-responsibility**, which no single thesis justifies outright.

  ---

  ### **I. The "Can't Help" Theses: Precision & Verdicts**
  *(Key dimensions: Temporal scope, degree of control, and target of "help")*

  1. **Immediate Onset/Offset Thesis**  
     *Thesis*: You cannot voluntarily initiate or terminate a specific emotional episode *at the moment it occurs*.  
     *Verdict*: **Trivially true for most emotions**. We cannot "decide" to feel fear or cease anger instantly.  
     *Episode 1*: Irrelevant. Perceptual experiences share this trait yet remain assessable (e.g., optical illusions).  
     *Episode 2*: Partially relevant to mitigation (if action was impulsive), but not absolution.  

  2. **Modification Resistance Thesis**  
     *Thesis*: Once an emotion begins, you cannot voluntarily alter its *intensity or quality* in real-time.  
     *Verdict*: **False or overstated**. We can modulate emotions via attention redirection, cognitive reappraisal, or breathing.  
     *Implication*: Undercuts the slogan—some control exists, making assessability/responsibility plausible.  

  3. **Long-Term Cultivation Thesis**  
     *Thesis*: You cannot voluntarily reshape your *disposition* to feel certain emotions over time (e.g., becoming less resentful).  
     *Verdict*: **Substantive but often false**. Many emotions are habitually reinforced (e.g., chronic resentment). We have indirect control via practices like therapy or mindfulness.  
     *Smuggled Control?* Yes. This thesis conflates "hard to change" with "impossible," ignoring agency in emotional habituation.  

  ---

  ### **II. Does Involuntariness Imply Non-Assessability?**  
  *(Divergence point between emotion theories)*  

  | **Theory**       | Involuntary? | Assessable? | Why the Divergence? |
  |------------------|-------------|------------|---------------------|
  | **Feeling Theory** | Yes (bodily) | **No**     | Feelings (e.g., stomach ache) lack intentionality → no correctness conditions. |
  | **Perception Theory** | Yes         | **Yes**    | Like sensory illusions: involuntary but representational → can be accurate/misleading. |
  | **Judgment Theory** | Debatable   | **Yes**     | If emotions *are* judgments, they should be voluntary—but this conflicts with phenomenology. |

  - **Episode 1 Takeaway**: The slogan assumes Feeling Theory. But if emotions are perceptual (value perceptions), they can be involuntary *and* assessable. *Your critic’s argument only works if emotions lack intentionality*.  

  ---

  ### **III. Dimensions of Assessment & the Slogan’s Relevance**
  The slogan’s force depends on *which assessment* is at play:  

  1. **Correctness** (object has the property):  
     - *E.g., "Is flying actually dangerous?"*  
     - Slogan **irrelevant**: Correctness depends on facts, not voluntariness.  

  2. **Warrant** (proportionality/appropriateness):  
     - *E.g., "Is intense fear warranted by a 1 in 10 million risk?"*  
     - Slogan **partially relevant**: Involuntariness may explain *why* you feel it, but doesn’t negate warrant assessment.  

  3. **Propriety** (fittingness to context):  
     - *E.g., "Is resentment appropriate in a fair promotion system?"*  
     - Slogan **misleading**: Cultivation Thesis suggests long-term responsibility for dispositional emotions.  

  - **Episode 1**: Slogan only blocks assessment if emotions are non-intentional feelings (Feeling Theory).  
  - **Episode 2**: Slogan might reduce blame for *immediate action* (if resentment was overwhelming), but not for failing to address chronic resentment.  

  ---

  ### **IV. Judgment Theory’s Burden: Recalcitrance & Control**  
  - **Problem**: If emotions *are* judgments, why do we experience recalcitrant emotions (e.g., fear of flying while judging it safe)?  
  - **Solution**: Judgment theories often posit "sub-judgments" or somatic components not fully integrated with reflective reason.  
  - **Cost to Rationality?**: Yes—if emotions are semi-detached from judgment, their "reasons-responsiveness" is diluted. They become *arational* rather than irrational.  

  ---

  ### **V. Direct Answers to Your Questions**  

  1. **Is there a true but irrelevant reading?**  
     - Yes: *Immediate Onset Thesis*. It’s true but irrelevant to assessability (as Episode 1’s perception analogy shows).  

  2. **Does the slogan do real work, or just trade on ambiguity?**  
     - **It trades on ambiguity**. The only version strong enough to support Episode 1’s conclusion (non-assessability) is:  
       *"Emotions lack intentional content"* (Feeling Theory).  
       But this is **not** entailed by "can't help," *and* it’s question-begging—it assumes the very theory under debate.  

  3. **Best theory for explaining control?**  
     - **Perception Theory**: Balances involuntariness (like senses) with assessability. Explains why emotions feel passive yet track values.  
     - **Winner for boundary cases**:  
       - *Cultivated emotion* (e.g., deliberate xenophobia): Long-term control → responsibility.  
       - *Attention-induced* (e.g., stoking anger by dwelling on slights): Partial control → assessable.  
       - *Objectless emotion* (e.g., free-floating anxiety): Harder to assess for correctness, but warrant/propriety apply.  
       - *Requested emotion* (e.g., "Feel grateful!"): Highlights indirect control—we can set conditions for emotions.  

  ---

  ### **Final Verdicts per Episode**  
  - **Episode 1 (Fear of Flying)**:  
    - Slogan **fails**. Involuntariness ≠ non-assessability. Emotions can be perceptual and thus assessable *even if* involuntary.  
    - *Conclusion*: Fear can be rationally criticized as misplaced.  

  - **Episode 2 (Resentment)**:  
    - Slogan **partially succeeds** as *mitigation* (if action was impulsive), but **fails** as *absolution*.  
    - *Key distinction*: Responsibility for feeling vs. action. "Can't help" feeling doesn’t entail "can't help" acting on it.  
    - *Conclusion*: She may not be blamed for the resentment *itself*, but is accountable for actions (and for not addressing chronic resentment).  

  **Boundary Flip**: If the resentful person had *cultivated* bitterness for years (Long-Term Thesis), or could have paused before acting (Modification Thesis), blame increases. If resentment was a reflexive scream followed by immediate apology, blame decreases.
