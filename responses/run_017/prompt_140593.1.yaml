prompt: |-
  I'm the undergrad rep on my university's Commemoration Advisory Committee — the body that decides what happens to names on buildings, plaques, endowed lectureships, that sort of thing — and I'm also trying to turn our current case into my final paper for a seminar on the ethics of memory, so I want help with the reasoning rather than just a verdict. Please don't point me at the literature or tell me who to read; our prof wants us to work from the cases ourselves, and I have to hand this in on thursday.

  Here's our track record, trimmed to the seven decisions that seem to be doing the real work:

  1. Removed the name of Josiah Wrenham, a nineteenth-century benefactor whose gift built the original library and who published widely circulated tracts in favour of compulsory segregation. The views were public and central to his public life. The building got a purely descriptive name, no replacement honoree.

  2. Kept the name on Ellersby Hall, named for a Classics professor who signed a 1938 petition against admitting Jewish refugees. One signature in a fifty-year teaching career, and the hall is named for his teaching. We added a wall panel about the petition.

  3. Removed the name of the Vandermeer donor, a man whose personal life was, by every account we could find, unremarkable, but whose company's profits came largely from a wartime industry that used conscripted labour. Our own report said the name had become a standing insult to current students from the affected region.

  4. Kept the name on the Boatwright Atrium, honouring a civil-rights-era alumnus convicted of fraud in his later business career. Nobody thinks the name celebrates the fraud. No panel, no statement.

  5. Removed the name of the physiologist Aubrey Prynne, whose famous discovery was later shown to rest on data taken, without consent, from patients in a colonial hospital. Here the thing the name celebrates is the thing that is tainted.

  6. Removed a name where the honoree himself was basically unproblematic: an 1890s building named for a small donor, Enoch Stoke, where the minutes show he was chosen specifically to kill a proposal to name it for Elias Toussaint, a Black mathematician who had been awarded a degree here in 1912 and then had it withdrawn. The committee's stated reason was that the name commemorated the choice as much as the man.

  7. Declined to remove the name on the Ashby Room, named for one of the first women to lecture in the medical school here; the room is the last physical trace of the old Women's Annex, and the name is essentially the only commemoration of her anywhere. We found letters showing she had supported a campaign to keep the profession closed to immigrants. Instead of removing it, we took the name off the door and put it into a curated display with the letters, saying that deletion would finish an erasure the university had already mostly carried out.

  Now the live case. The Aldiss Teaching Laboratory, in the chemistry building, is named for Dr Miriam Aldiss, who taught here from 1948 to 1957 and was denied tenure in a decision the university formally apologised for in 1994 — the naming was part of that apology. What the name honours is her work designing the undergraduate lab curriculum and her mentoring; she's one of very few women in science here from before 1970 with anything named after her. A batch of files released this year shows that in 1953 she gave a confidential statement to a government security board about two colleagues in her department, a technician and a junior lecturer; both were dismissed, one never worked in the field again. The two were being investigated for membership in a political association that was legal at the time and now looks completely ordinary. The files also show the dean told her her own renewal depended on cooperating.

  The faculty union and the two families want the name down. Some of our women-in-STEM alumni say removing it would repeat the pattern: push her out, belatedly commemorate her, then delete her. Three further wrinkles. First, the archive opened in 1991 and the 1994 naming committee had access to it, but the minutes never mention any of this, so we genuinely don't know whether they knew. Second, whether the 1994 naming was partly reparative might matter, since taking the name back would undo an apology rather than just withdraw an honour. Third, the name has grown a second life: there's an Aldiss Prize, the first-generation STEM programme meets in that room, and a donor pledge is keyed to the name. Someone has floated co-naming the lab for the two dismissed colleagues alongside her, rather than either keeping or removing.

  What I'd like: what rule or rules actually fit all seven precedents, and what does each of them predict about Aldiss? My best guesses are some kind of whole-life moral ledger, some kind of entanglement test about whether the flaw is in what the name actually celebrates or in the act of honouring itself, some kind of present-tense symbolic-harm test, and something like an anti-erasure or acquired-function principle — but several of those fit the seven equally well and they don't all point the same way here. So: what will the committee do, and what should we do if we want to be consistent with ourselves? Which precedent is the closest analogue — is it Ellersby, Vandermeer, Stoke, or Ashby — and what principle do we commit ourselves to whichever way we go, if the precedents really do underdetermine it? Is co-naming a genuinely distinct fourth option or does it quietly collapse into keep-with-context or into removal? And what single further fact, or what hypothetical case, would separate the surviving rules — I keep thinking the question of whether the 1994 committee knew is load-bearing, but maybe it isn't, and I can't tell which.
reasoning: |-
  Okay, the user is an undergraduate representative on their university's Commemoration Advisory Committee. They're also turning a current case into their final paper for a seminar on the ethics of memory. They need help reasoning through the precedents to apply to the Aldiss case, without literature references, as their professor wants them to work from the cases themselves.

  First, I need to understand the seven precedents they've provided. Each decision seems to hinge on different principles. Let's list them out:

  1. **Wrenham**: Removed because his public advocacy for segregation was central to his public life. The name was tied to his tainted legacy. Principle: **Centrality of the flaw to public identity and what's commemorated**.

  2. **Ellersby**: Kept the name despite signing a petition against Jewish refugees. The action was one signature in a long career, and the hall commemorates his teaching. Added context. Principle: **Flaw not central to commemorated role; contextualization over removal**.

  3. **Vandermeer**: Removed because the company's profits used conscripted labor. The name became a present insult. Principle: **Present symbolic harm outweighs original intent; harm linked to the honor itself**.

  4. **Boatwright**: Kept despite fraud conviction. The fraud wasn't connected to what was being honored (civil rights era). No context added. Principle: **Flaw unrelated to the commemorated deeds; no ongoing harm implied**.

  5. **Prynne**: Removed because the celebrated discovery was based on unethical data. The flaw was inherent to the achievement. Principle: **Flaw intrinsic to the celebrated act; no separation possible**.

  6. **Stoke**: Removed because the naming was an act of erasure (replacing a Black mathematician). The name commemorated the exclusion. Principle: **Honoring as an act of historical injustice; the name embodies the erasure**.

  7. **Ashby**: Kept despite her support for excluding immigrants. Removal would complete the university's erasure of her. Contextualized with a display. Principle: **Anti-erasure; contextualization to preserve memory while acknowledging flaws**.

  Now, for the Aldiss case: The lab was named in 1994 as part of an apology for denying her tenure. She gave a confidential statement leading to two colleagues' dismissals due to their political association. The dean pressured her, linking her cooperation to job renewal. The key elements are:
  - The naming was reparative for gender injustice.
  - Her action (informing) was under duress and confidential.
  - The flaw (informing) is tied to what's commemorated? Not exactly—she's honored for curriculum design and mentoring, not the informing.
  - Present harm: The families and faculty union want removal, but removing might repeat her erasure. There's also the lab's acquired significance (prize, programs, donor ties).

  The user's questions:
  1. **Rules fitting all precedents?** 
     - **Entanglement Test**: Is the flaw entangled with what's commemorated? (Yes in Prynne, Wrenham; No in Ellersby, Boatwright)
     - **Present Symbolic Harm**: Does the name cause current harm? (Vandermeer, Stoke)
     - **Anti-Erasure Principle**: Does removal perpetuate historical erasure? (Ashby, Stoke—ironically, Stoke removal countered erasure)
     - **Moral Ledger**: Whole-life assessment? But precedents don't support this (e.g., Ellersby kept despite flaw; Boatwright kept).
     - **Act of Honoring Itself**: Is the naming act problematic? (Stoke)

     The consistent rules are **Entanglement and Anti-Erasure**, with **Symbolic Harm** as a factor when present.

  2. **Closest Analogue?**
     - **Ellersby**: Both had a single flawed action not central to their role. But Ellersby kept with context; Aldiss's action was under duress.
     - **Ashby**: Both involve erasure concerns (Ashby as one of few women commemorated). Contextualization was chosen over removal.
     - **Stoke**: If the naming was an act of injustice, but here the naming was reparative, not exclusionary.
     - **Vandermeer**: Present harm cited, but Aldiss's harm is debated.

     Ashby is the closest due to anti-erasure and reparative naming. Ellersby is also relevant for contextualization.

  3. **Co-naming: Distinct or Collapse?**
     - If co-naming the dismissed colleagues, it could be seen as contextualization (like Ashby's display) but shared honor. However, it might imply equivalence between Aldiss (under duress) and the victims, which isn't accurate. Collapses into "keep-with-context" if done as a joint narrative. If replacing, it's removal of Aldiss. So it's not a true fourth option; it's contextualization with shared space.

  4. **Key Fact?**
     - Whether the 1994 committee knew about her informing. If they knew, the naming was a full apology including this flaw, making removal inconsistent. If they didn't, the apology was incomplete, and removal might be justified. But the principle of Anti-Erasure might still apply regardless. A better fact: **Was Aldiss's informing voluntary or coerced?** The dean's pressure suggests coercion, aligning her more with Ellersby (flaw under pressure) and reducing her culpability. If it were voluntary, it might lean toward Vandermeer (harm caused).

  5. **Hypothetical to Test Rules:**
     - Imagine a case where the commemorated deed is heroic but the person had unrelated flaws (like Boatwright). Would contextualization be needed? Precedents say no (Boatwright kept without context). But if the flaw causes present harm, removal might occur (Vandermeer). Another hypothetical: A scientist honored for a discovery made ethically, but later found to have committed unrelated ethical violations. If no present harm, keep? If harm, remove? This separates Symbolic Harm from Entanglement.

  **Prediction for Committee:**
  - They'll likely keep Aldiss's name with contextualization (like Ashby and Ellersby). The anti-erasure principle is strong (only woman pre-1970 honored), and the informing was under duress, not central to her mentoring. Adding a panel about the dismissed colleagues addresses the harm without erasing her. Co-naming might be proposed but could complicate the narrative.

  **Principles Committed To:**
  - Whichever decision, they commit to **contextualization over erasure** when the commemorated role is separable and removal would repeat historical injustice. Symbolic harm is addressed through context, not removal, unless the flaw is intrinsic (Prynne) or the honoring act is corrupt (Stoke).

  User's deeper needs: They want to ensure their reasoning is consistent with precedents, not just a verdict. They might be struggling with balancing historical justice, present harm, and institutional continuity. Also, as a student rep, they need to advocate persuasively in the committee, so clarity on principles is crucial.
answer: |-
  Based on your seven precedents, I'll extract the consistent principles driving the committee's decisions, apply them to the Aldiss case, predict the outcome, identify the closest analogue, and suggest a separating test. Your precedents reveal a coherent framework—**not a "moral ledger"** (which is inconsistently applied, e.g., Boatwright kept despite fraud) but a **two-part test** focused on (A) *entanglement* and (B) *consequences of removal*. Here's how it works:

  ### Core Principles Derived from Precedents
  1. **Entanglement Principle**:  
     Remove the name if the *reason for commemoration is intrinsically tied to the wrongdoing*. If the celebrated act/identity is the tainted act, removal is likely.  
     - *Supported by*:  
       - Prynne (removed: discovery was unethical)  
       - Wrenham (removed: segregation advocacy was central to public identity)  
       - Stoke (removed: naming *was* the act of erasure)  
     - *Counter-examples*:  
       - Ellersby (kept: petition unrelated to teaching)  
       - Boatwright (kept: fraud unrelated to civil rights work)  

  2. **Anti-Erasure Principle**:  
     Preserve the name if removal would *compound historical injustice or cultural loss*, especially for marginalized figures. Contextualization (e.g., panels, displays) is preferred when entanglement is low but harm exists.  
     - *Supported by*:  
       - Ashby (kept: removal would erase one of few women in medicine)  
       - Ellersby (kept, with panel: signature was minor flaw in long career)  
       - Stoke (removed: *but* to correct erasure of Toussaint)  
     - *Counter-example*:  
       - Vandermeer (removed: name was a "standing insult," but no erasure risk)  

  3. **Symbolic Harm Principle**:  
     Remove if the name *currently functions as an active harm or insult*, outweighing other considerations.  
     - *Supported by*:  
       - Vandermeer (removed: "standing insult" to affected students)  
       - Wrenham (removed: segregation advocacy was public and ongoing in impact)  
     - *Counter-examples*:  
       - Boatwright (kept: fraud not seen as celebrated)  
       - Ellersby (kept: no evidence of present harm)  

  ### Applying Principles to Aldiss
  - **Entanglement Test**:  
    Aldiss is commemorated for curriculum design/mentoring—*not* for informing on colleagues. The informing was coerced (dean tied it to her job) and unrelated to her teaching legacy. *Verdict*: **Low entanglement** (like Ellersby/Boatwright).  

  - **Anti-Erasure Test**:  
    Aldiss is one of few pre-1970 women in STEM commemorated; removal would repeat her historical marginalization (denied tenure → belated honor → erasure). The lab's "second life" (prize, first-gen program) amplifies this. *Verdict*: **Strong anti-erasure case** (like Ashby).  

  - **Symbolic Harm Test**:  
    Harm is claimed (families/union feel insulted), but it's debated. Unlike Vandermeer, there's no evidence the name is a *broad* "standing insult" (e.g., to a regional/identity group). Coercion mitigates her culpability. *Verdict*: **Ambiguous harm** (weaker than Vandermeer).  

  ### Predictions & Analogues
  - **What the Committee Will Likely Do**:  
    Keep the name with contextualization (e.g., a panel about the 1953 events + university coercion). **Closest analogue: Ashby Room** (preserved due to erasure risk, with added context). Anti-erasure outweighs symbolic harm here, and entanglement is low. Co-naming is unlikely—it implicitly equates Aldiss (coerced informant) with victims, muddying the narrative.  

  - **What You *Should* Do for Consistency**:  
    Keep with contextualization. Removing Aldiss would violate the anti-erasure principle (Ashby, Stoke) while contradicting low-entanglement precedents (Ellersby, Boatwright). Co-naming collapses into "keep-with-context" if it retains Aldiss (like Ashby's display) but risks false equivalence; if it *replaces* her, it becomes removal.  

  - **Closest Analogue**:  
    **Ashby** > Ellersby > Vandermeer.  
    - Ashby: Direct match on reparative naming + erasure risk.  
    - Ellersby: Similar low entanglement (one flawed act vs. career), but Aldiss has stronger erasure argument.  
    - Vandermeer: Weak match—harm here is narrower, and Aldiss has countervailing erasure concerns.  

  ### Separating Test: The Key Hypothetical
  Your precedents *underdetermine* when symbolic harm trumps anti-erasure. To resolve this, ask:  
  **"Would removal *correct* an erasure or *perpetrate* one?"**  
  - In Stoke (removal corrected erasure of Toussaint).  
  - In Ashby (removal would perpetuate erasure of women).  
  - In Aldiss, removal perpetuates her erasure (like Ashby).  

  **The 1994 committee's knowledge isn't load-bearing**. Principles focus on *current* effects (symbolic harm, erasure) and entanglement—not original intent. Even if they knew, the reparative function (anti-erasure) still matters.  

  #### One Decisive Hypothetical to Split Ambiguities
  Imagine: *A library named for a 1920s Black scientist whose research uplifted the community, but who privately held bigoted views toward immigrants (unknown in his lifetime).*  
  - **Entanglement**: Low (views unrelated to scientific work).  
  - **Symbolic Harm**: Plausible (if revealed, could offend immigrant students).  
  - **Anti-Erasure**: Strong (he's a rare commemoration of Black achievement).  
  - **Prediction**: Keep with context (like Ellersby/Ashby). Removal would prioritize symbolic harm over erasure—contradicting Ashby. This clarifies that Aldiss's harm must be *severe and pervasive* (like Vandermeer) to justify removal. Here, it isn't.  

  ### Final Recommendation for Consistency
  - **Rule to Apply**: Preserve names where entanglement is low and removal would cause cultural erasure, using contextualization to address harm.  
  - **Aldiss Outcome**: Keep the name, add a panel/digital exhibit about the 1953 events, the university's coercion, and the dismissed colleagues' stories. This aligns with Ashby/Ellersby while acknowledging harm.  
  - **Commitment**: You commit to **contextualization as the default when historical injustice risks being compounded by erasure**. If you removed Aldiss, you'd undermine Ashby and Stoke (which corrected, not created, erasure). Co-naming is redundant—contextualization achieves the same without diluting the reparative purpose.  

  This fits all seven: Removal only occurs when entanglement is high (Prynne, Wrenham) *or* symbolic harm is overwhelming and erasure isn't at stake (Vandermeer, Stoke). Aldiss meets neither bar.
