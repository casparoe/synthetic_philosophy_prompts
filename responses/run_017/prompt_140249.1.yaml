answer: |-
  Below is a decision tree designed for your workshop. It uses concrete cases to sort historical novelists' ethical positions on inventing elements about real people, built from the logical space of your four requests. Questions are phrased as practical dilemmas; positions ("leaves") are defined by their concrete commitments. British English is used throughout.

  ---

  ### **Decision Tree: Permissible Invention in Historical Fiction**

  **Branch 1: Who holds the claim against invention?**  
  *(i) Recast: If the dead woman’s great-granddaughter objects to you inventing her childhood in a foundling ward (though indifferent to other inventions), but her great-grandson actively approves it, whose objection matters more: the descendant’s, or the dead woman herself (who cannot speak)?*  
  - **A:** The dead woman’s claim matters more; descendants’ views are irrelevant to the ethical wrong.  
  - **B:** The living descendants’ claim matters more; the dead cannot be wronged.  
  - **C:** Neither; the claim belongs to her community (e.g., the village where she lived).  

  **Branch 2: What is the core of the duty owed?**  
  *(ii) Recast: You invent her private admission of probable guilt. Is the wrong primarily about falsifying history, making her appear cruel (when she might have been kind), or using her personal trauma for your book’s profit?*  
  - **D:** Wrong to misrepresent what happened (factual duty).  
  - **E:** Wrong to distort her character (duty to her dignity).  
  - **F:** Wrong to exploit her without consent (duty against instrumentalisation).  

  **Branch 3: Can actions waive the claim?**  
  *(iii) Recast: She burned her letters and used two names. Does this mean she forfeited her right to an accurate portrayal, or is the duty unchanged?*  
  - **G:** Yes, she waived claims to privacy/accuracy by obscuring her life.  
  - **H:** No, burning letters doesn’t waive the duty to represent her fairly.  

  **Branch 4: Are all inventions equally problematic?**  
  *(iv) Recast: You invent a sentence she spoke (undocumented), an action (stealing herbs), a thought (“I regret my child’s death”), and a consequence (her acquittal inspiring local reforms). Are these four distinct offences, or equally acceptable/unacceptable?*  
  - **I:** All equally wrong – inventing any undocumented element violates the same duty.  
  - **J:** Graded wrongs: words/actions < thoughts < consequences (or similar hierarchy).  
  - **K:** All equally acceptable – fiction requires invention.  

  **Branch 5: Does a “true pattern” justify a fabricated particular?**  
  *(v) Recast: You invent her foundling childhood (no evidence), arguing it reflects the neglect the record implies. Does this redeem the invention?*  
  - **L:** Yes, if the general truth (neglect) is documented, the fabricated particular (foundling ward) is permissible.  
  - **M:** No, inventing undocumented specifics is wrong even to illustrate a documented pattern.  

  **Branch 6: Does consent from one descendant override another’s objection?**  
  *(Invented Case: The great-grandson approves your use of the dead child as the plot engine; the great-granddaughter objects. Does his consent negate her objection?)*  
  - **N:** Yes, familial consent is valid if any descendant approves.  
  - **O:** No, objections from any descendant veto the invention.  
  - **P:** Irrelevant; descendants’ views don’t govern the duty.  

  **Branch 7: How strong must evidence be for interiority?**  
  *(Invented Case: You write her private grief for her dead child. The archive shows she visited the grave but left no diaries. Is this sufficient evidence for her thoughts?)*  
  - **Q:** Permissible only if evidence makes the thought near-certain (e.g., a letter stating grief).  
  - **R:** Permissible if evidence makes it probable (e.g., grave visits + cultural norms).  
  - **S:** Permissible regardless; interiority is always inferred.  

  **Branch 8: Does narrative necessity justify invention?**  
  *(Invented Case: You need the foundling ward to explain her resilience. Does this “narrative engine” defence override other duties?)*  
  - **T:** Yes, if crucial to the story’s thematic truth.  
  - **U:** No, narrative need never overrides accuracy/dignity.  

  ---

  ### **Leaves (Positions)**
  1. **Strict Archivalism**  
     *Most awkward commitment:* Must omit the dead child’s narrative role if not explicitly documented as influential.  
     *Your spoken sentence:* Omit it. Only use words from the deposition.  

  2. **Living Claims Only**  
     *Most awkward commitment:* You may invent her foundling childhood if the great-grandson approves, even if it’s baseless.  
     *Your spoken sentence:* Include it if no living descendant objects.  

  3. **Community Custodianship**  
     *Most awkward commitment:* The vicar’s (hostile) obituary could veto your private admission of guilt if it reflects community memory.  
     *Your spoken sentence:* Exclude it if the sentence clashes with local oral tradition (e.g., her reported speech patterns).  

  4. **Mosaic Licence**  
     *Most awkward commitment:* You may have her speak your sentence *if* each word is sourced from her deposition/letters, rearranged freely.  
     *Your spoken sentence:* Permitted only if composed from her attested vocabulary.  

  5. **Counterfactual Confession**  
     *Most awkward commitment:* You may write her private admission of guilt (probable but unstated) *only* if the evidence makes it overwhelming and your portrayal is damning.  
     *Your spoken sentence:* Omit it – unspoken thoughts have higher evidence thresholds.  

  6. **Anachronism of Interiority**  
     *Most awkward commitment:* You cannot use her dead child as the "engine" if framed with modern trauma theory she couldn’t know.  
     *Your spoken sentence:* Permitted only if phrased in era-appropriate language (e.g., "God’s will" not "survivor’s guilt").  

  7. **Pattern Justification**  
     *Most awkward commitment:* The invented foundling ward is acceptable to illustrate her documented neglect, even if implausible.  
     *Your spoken sentence:* Include it only if it reflects a documented behavioural pattern.  

  8. **Narrative Supremacy**  
     *Most awkward commitment:* Her burned letters forfeit all claims; invent freely if it serves the plot.  
     *Your spoken sentence:* Include it – crucial scenes need dialogue.  

  9. **Dignity Preservation**  
     *Most awkward commitment:* You may invent the spoken sentence but not the private admission if the latter makes her appear immoral.  
     *Your spoken sentence:* Permitted if it doesn’t caricature her.  

  10. **Descendant Veto**  
      *Most awkward commitment:* Great-granddaughter’s objection to the dead child’s use overrules the great-grandson’s approval and your evidence.  
      *Your spoken sentence:* Omit it if any descendant objects.  

  11. **Unnamed – Nobody defends this**  
      *Most awkward commitment:* All inventions are equally harmless; descendants’ objections are mere sentimentality.  
      *Your spoken sentence:* Include anything – no duty exists.  

  12. **Interiority Minimalism**  
      *Most awkward commitment:* You may use the dead child as the plot engine only if her documented actions (e.g., grave visits) explicitly signal this motivation.  
      *Your spoken sentence:* Omit it – dialogue invents exteriority.  

  ---

  ### **Gaps in the Logical Space**
  - **Combination:** Community claims (1C) + Waiver by actions (3G) + Narrative justification (8T).  
    *Gap reason:* Unattractiveness. Positions emphasising community memory rarely pair with "waiver" concepts, and narrative defences are seen as individualistic.  
  - **Combination:** Factual duty only (2D) + Graded inventions (4J) + Pattern justification (5L).  
    *Gap reason:* Neglect. Most factual-duty positions (like Archivalism) reject pattern justification outright.  
  - **Combination:** Living claims (1B) + Consent overrides objections (6N) + Interiority with probability (7R).  
    *Gap reason:* Incoherence. If living claims dominate, why require evidence thresholds for thoughts?  

  ### **Indistinguishable Leaf Pairs**  
  - **Living Claims Only (Leaf 2) & Descendant Veto (Leaf 10)**  
    *Why indistinguishable:* Both grant living descendants ultimate authority. The tree cannot separate them because *all cases* would be decided identically based on descendant approval/objection, regardless of other factors. The only difference (whom the wrong is done to) is theoretical; practically, verdicts align.  
  - **Strict Archivalism (Leaf 1) & Interiority Minimalism (Leaf 12)**  
    *Why indistinguishable:* Both require direct documentation for *any* invented element. Your spoken sentence, foundling ward, and plot engine would be rejected identically; only the private admission *might* differ if "overwhelming evidence" exists (but Archivalism would still reject it).  

  ---

  ### **Instruction for Your Spoken Sentence Scene**  
  *Apply the tree:* Workshop participants answer the eight questions. Their combination leads to a leaf. Each leaf’s final sentence directs your choice: e.g., "Omit it" (Archivalism), "Include if phrased era-appropriately" (Anachronism of Interiority), "Include if no descendant objects" (Living Claims). The tree exposes contradictions (e.g., approving the foundling ward but rejecting the sentence) by forcing coherent paths.
