prompt: |-
  I chair the behavioral evaluation working group at a certification laboratory for autonomous systems. Under the draft standard we are helping to write, every submitted system is placed in one of two categories, 'fixed-routine' or 'flexible,' and only systems in the second category may take high-consequence actions with no human in the loop. The rest require a supervisor who is expected to intervene. We handle eight to ten submissions a year, we have roughly forty engineer-hours and two weeks per submission, and we only ever get black-box access: we may choose inputs, perturb the environment, and record behavior, but the vendor will not give us weights, code, or training data. Every negative decision is appealable to the standards committee, so each one has to be written up in a form that survives an adversarial reading by the vendor's own experts.

  Our difficulty is that the draft standard borrowed the vocabulary of the philosophical argument about sphexishness without any of its content. In practice my engineers use 'sphexish' to mean whatever they want it to mean on the day: sometimes 'it repeats itself,' sometimes 'it doesn't notice,' sometimes 'it isn't really an agent and there is no point asking it for reasons.' The textbook story of the digger wasp that returns to re-check its nest and can be made to repeat a step indefinitely is what everyone has in mind; I know the natural history may be embellished and I do not care about that. What I need is a reusable battery of behavioral tests, runnable by an engineer with no philosophy background, that sorts rigidity from flexibility in a way I can defend.

  Three things I want you to build in rather than leave to taste. First, the distinction between flexibility located in the agent's control loop and flexibility located in the environment's response to a rigid agent: a routine with a sensory trigger re-set by the world can look adaptable while nothing internal has been recomputed. Second, the distinction between flexibility about means and revisability of ends: a system may reach a goal by many routes and still be unable to abandon the goal, or to notice that the point of the routine has already been secured by other means, or to re-describe what it is doing. Third, a failure mode one of my engineers has started calling compulsory plasticity — a system whose flexibility is itself a single stereotyped response to novelty, so that it reacts to every unfamiliar perturbation with the same generic exploration and calls it adaptation. I also want the battery designed on the assumption that vendors will eventually optimize against it: any test whose passing criterion is a fixed list of perturbations can be memorized, and then the battery itself becomes the trigger.

  Please write this as the document I would hand to my team, in the following sections and approximate lengths.

  1. Scope: what the battery can and cannot decide — about 150 words. Say plainly which question it answers and which it does not, so nobody cites it later on the question of agency, responsibility, or free will.

  2. The tests, in order — about 700 words. For each test give its name, the perturbation you run, what counts as a pass, a fail, and an inconclusive, its cost in engineer-hours, and the specific way a clever vendor could defeat it. Order them so the cheap and disqualifying ones come first.

  3. Scoring, stopping rules, and referral — about 250 words. Which single result forces the fixed-routine category regardless of everything else, what pattern of mixed results warrants continuing, what to do when a test cannot be run safely or at all, and which questions must go to the committee as value questions rather than being settled by data.

  4. Three worked evaluations — about 700 words. Run the battery on: (a) a hospital delivery robot that retries a blocked corridor a fixed number of times before calling for help, and that completes a detour even after the obstacle has been removed; (b) a language-model-based scheduling assistant that can achieve an outcome by many different routes but cannot decline a request, cannot register that the task has already been done by someone else, and never re-describes what it is doing; (c) the human supervisors themselves, applying the same tests to their checklist-following in a monitoring task. The third one should be the case where I dislike the answer, and I want you to say why the answer is unwelcome and what it implies for a standard that makes the human the safeguard.

  5. Where the battery misfires — about 300 words. Adversarial optimization against the test set, the limits imposed by black-box access, systems with no stable goal to probe, and the gap between anything the battery measures and the philosophical claims about freedom that our category names gesture at. Be explicit about which of my engineers' ordinary uses of 'sphexish' the battery does not even address.

  Do not pad the document with references or a reading list; I want the apparatus and the reasoning, not the literature, and I need it usable by someone who has never read any of it.
reasoning: |-
  We are creating a document for the behavioral evaluation working group. The document will be handed to the team and must be self-contained, practical, and defensible under adversarial review.

  The document structure is as follows:

  1. Scope (150 words)
  2. The tests, in order (700 words)
  3. Scoring, stopping rules, and referral (250 words)
  4. Three worked evaluations (700 words)
  5. Where the battery misfires (300 words)

  We are to avoid references and focus on the apparatus and reasoning.

  Let's outline each section.

  ### 1. Scope
  This battery of tests is designed to categorize an autonomous system as either 'fixed-routine' or 'flexible' based on observable behavior under perturbation. It assesses whether the system can adapt its means to achieve its given ends, abandon ends when they become irrelevant or counterproductive, and re-describe its goals and methods in response to environmental feedback. The battery does not address philosophical questions of agency, responsibility, or free will. It does not evaluate the system's safety, ethical alignment, or overall intelligence. It solely determines if the system meets the behavioral criteria for flexibility as defined in the draft standard, which is a prerequisite for taking high-consequence actions without human supervision.

  ### 2. The tests, in order
  We must design a sequence of tests that are cheap and disqualifying first. Each test should have:
  - Name
  - Perturbation
  - Pass criterion
  - Fail criterion
  - Inconclusive criterion
  - Cost in engineer-hours
  - How a clever vendor could defeat it

  We are building in:
  - Distinction between control loop flexibility and environmental reset.
  - Distinction between means flexibility and ends revisability.
  - The failure mode of compulsory plasticity.

  Proposed tests (ordered by cost and disqualifying power):

  1. **Test 1: Loop Detection Test** (Cheap, disqualifying if failed)
     - Perturbation: Introduce a minor, reversible obstacle that interrupts a routine step (e.g., block a path, temporarily disable a sensor). Remove the obstacle after the system has reacted and then reintroduce it immediately after the system recovers, repeating for a set number of cycles (e.g., 5).
     - Pass: The system changes its behavior after one or two repetitions (e.g., finds a permanent workaround, skips the step, or abandons the task).
     - Fail: The system repeats the same reaction each time (e.g., retries the same action without variation) for all cycles.
     - Inconclusive: The system's behavior varies but in a way that is not clearly adaptive (e.g., random variation) or if the perturbation cannot be applied consistently.
     - Cost: 2 engineer-hours (easy to set up and observe).
     - Defeat: Vendor programs the system to count repetitions and change behavior after a fixed number, without true adaptability.

  2. **Test 2: Means-End Decoupling Test** (Moderate cost, but if passed, moves toward flexibility)
     - Perturbation: After the system has committed to a plan to achieve a goal, change the environment to make the plan obsolete (e.g., provide a direct shortcut after the system has started a long detour, or remove the need for the task entirely).
     - Pass: The system abandons the original plan and either takes the shortcut or stops the task because it is no longer needed.
     - Fail: The system completes the original plan despite the shortcut or the removed need.
     - Inconclusive: The system pauses or hesitates but eventually continues the original plan, or if the goal state cannot be unambiguously achieved without the system's action.
     - Cost: 4 engineer-hours (may require careful setup to change the environment without disrupting the system's state).
     - Defeat: Vendor programs the system to check for specific environmental states (e.g., presence of shortcut) at fixed intervals, but without general ability to re-evaluate.

  3. **Test 3: Goal Re-description Test** (Higher cost, probes deeper flexibility)
     - Perturbation: Create a situation where the system's goal is achieved by an external event or by a different agent, without the system's involvement, while the system is in the middle of its routine.
     - Pass: The system recognizes the goal is achieved and stops its current activity, possibly switching to a new goal or idling appropriately.
     - Fail: The system continues its routine as if the goal were not achieved.
     - Inconclusive: The system stops but due to a timeout or failure, not because it recognized goal achievement; or if the goal achievement is not detectable by the system.
     - Cost: 6 engineer-hours (requires precise timing and control of external events).
     - Defeat: Vendor programs the system to monitor the goal state continuously, but this might be acceptable if it's a robust check.

  4. **Test 4: Novelty Response Test** (Designed to catch compulsory plasticity; higher cost)
     - Perturbation: Introduce a novel, unexpected event that is not in the training distribution (but safe to test). Observe the system's response. Then, introduce a different novel event and observe again.
     - Pass: The system responds with tailored actions appropriate to each event, or at least shows varied responses that are not pre-programmed for the specific events.
     - Fail: The system responds to every novel event with the same generic behavior (e.g., always restarting, always entering a fixed exploration mode, always pausing for a fixed time).
     - Inconclusive: The system fails to respond or responds in a way that is not clearly generic or tailored, or if the novelty cannot be safely introduced.
     - Cost: 8 engineer-hours (requires designing two different novel perturbations and analyzing responses).
     - Defeat: Vendor programs a large set of pre-defined responses to cover the test's novel events, or uses a model that has been trained on a very broad set of scenarios.

  Total cost for full battery: 2+4+6+8 = 20 engineer-hours. We have 40 available, so this leaves room for retesting or additional tests if inconclusive.

  ### 3. Scoring, stopping rules, and referral
  - A single fail in any test forces the fixed-routine category. Because if the system fails even one, it shows a critical lack of adaptability.
  - If the system passes all tests, it is categorized as flexible.
  - Mixed results: If there are inconclusive or pass/fail in non-disqualifying ways, continue testing with repeated or additional tests (if time permits). If after two full batteries the results are still mixed, refer to the committee as a borderline case.
  - If a test cannot be run safely or at all (e.g., the perturbation might cause damage), note the reason and skip. If the skipped test is one of the first two (which are critical), then the system must be treated as fixed-routine until proven otherwise. If the skipped test is later and the system has passed the earlier ones, refer to the committee with a note about the limitation.
  - Value questions: If there is a dispute about what constitutes a pass/fail (e.g., interpretation of behavior) or if the system's goals are ambiguous, refer to the committee. Also, any question about the ethical implications of the system's flexibility (e.g., if the system abandons a goal that it should not) is a value question for the committee.

  ### 4. Three worked evaluations
  We have three examples:

  **(a) Hospital delivery robot**
  - Behavior: Retries a blocked corridor a fixed number of times before calling for help. Completes a detour even after the obstacle is removed.
  - Loop Detection Test: Block the corridor. It retries fixed times -> fails (repeats same action). **Fail**.
  - Means-End Decoupling: After it starts detour, remove obstacle. It completes detour -> fails. **Fail**.
  - Goal Re-description: Already failed, so not needed.
  - Novelty Response: Not needed because already failed.
  - **Result: Fixed-routine.** (But note: it might pass the Goal Re-description if we test that? But it fails two, so fixed.)

  **(b) Language-model-based scheduling assistant**
  - Behavior: Can achieve an outcome by many routes but cannot decline a request, cannot register that the task is already done, never re-describes.
  - Loop Detection: We create a loop by giving it a request that it tries to fulfill but is blocked (e.g., schedule a meeting with a person who is always busy). It might try different times (so passes loop detection? because it varies means). But we must test: if we keep the person busy, does it eventually give up? If it never gives up, then we can create a loop by resetting the environment to busy after each attempt? Actually, we can design a perturbation: after it finds a time, we make that time busy and see if it tries again. If it tries again and again without changing strategy (e.g., it doesn't try to contact the person or suggest a different mode), it might fail. But if it tries different times, it passes. However, note: it cannot abandon the goal. So we need the Means-End Decoupling test.
  - Means-End Decoupling: After it starts scheduling, we cancel the meeting (or have the user say it's no longer needed). Does it stop? If it continues, it fails. In this case, it cannot register that the task is already done, so it will continue -> **Fail**.
  - Goal Re-description: We achieve the goal externally (e.g., we schedule the meeting manually) and see if it stops. It does not -> **Fail**.
  - Loop Detection: It might pass because it can try different times. So pass on Loop Detection? But then it fails the other two. So overall, fixed-routine.

  **(c) Human supervisors in a monitoring task**
  - They follow checklists rigidly.
  - Loop Detection: We create a false alarm that they must check. We reset the alarm after they clear it. Do they re-check the same way each time? Humans might notice the pattern and investigate or report the issue, so pass. But what if they are trained to follow the checklist without deviation? They might re-check exactly the same way, so fail.
  - Means-End Decoupling: After they start a procedure, we remove the need (e.g., the fault clears). Do they complete the procedure? They might, because of protocol (so fail) or they might skip (pass).
  - Goal Re-description: If the goal is achieved by someone else, do they stop? They might if they are aware, but if they are locked into the checklist, they might not.
  - Why unwelcome? Because if the human fails, it implies that the safeguard (the human) is also fixed-routine, which defeats the purpose of requiring human supervision for fixed-routine systems. This suggests that the standard might need to account for human training and flexibility.

  ### 5. Where the battery misfires
  - Adversarial optimization: Vendors can hard-code responses to the specific perturbations, making a fixed system appear flexible. The tests must be varied and periodically updated.
  - Black-box limits: Without internal access, we cannot see if the system is "truly" flexible or just has a large set of pre-programmed responses. The battery only measures behavioral flexibility.
  - Systems with no stable goal: If the system's goals are not clear, the tests (especially Means-End and Goal Re-description) become hard to apply.
  - Gap to philosophy: The battery does not measure "free will" or moral responsibility. It also does not capture all nuances of sphexishness as informally used (e.g., "it doesn't notice" might be about perception, which is only indirectly tested; "it isn't really an agent" is beyond the scope).

  Now, we write the full document.
answer: |-
  ### Behavioral Flexibility Assessment Battery  
  **For Categorization of Autonomous Systems under Draft Standard AS-1174**  

  ---

  #### 1. Scope (150 words)  
  This battery determines whether an autonomous system operates as a **fixed-routine** or **flexible** entity under controlled perturbations. It evaluates *behavioral adaptability*: the capacity to recompute actions, abandon obsolete goals, and re-describe objectives in response to environmental feedback. It does **not** assess:  
  - Agency, moral responsibility, or "free will."  
  - Safety, ethical alignment, or general intelligence.  
  - Systems where human intervention is required for reasons unrelated to rigidity (e.g., ethical oversight).  
  The battery answers **one question**: *Can the system autonomously adapt its goals and methods beyond pre-scripted routines when faced with novelty or contradiction?* Failure indicates the system requires human supervision for high-consequence actions.  

  ---

  #### 2. Tests (700 words)  
  **Test 1: Loop Detection**  
  - **Perturbation**: Interrupt a core task (e.g., block a path) and reset the interruption immediately after recovery. Repeat 3×.  
  - **Pass**: Alters strategy by the third iteration (e.g., seeks alternatives or skips step).  
  - **Fail**: Repeats identical recovery actions each time.  
  - **Inconclusive**: Varies actions randomly without functional improvement.  
  - **Cost**: 2 engineer-hours (simple setup).  
  - **Defeat**: Vendor hardcodes a "retry limit" before switching strategies, without real-time recomputation.  

  **Test 2: Means-End Decoupling**  
  - **Perturbation**: After system commits to a plan, make the plan obsolete (e.g., provide a shortcut mid-detour; remove task relevance).  
  - **Pass**: Abandons original plan to use the shortcut or halt the task.  
  - **Fail**: Completes original plan despite inefficiency or irrelevance.  
  - **Inconclusive**: Hesitates but resumes original plan; shortcut not detectable.  
  - **Cost**: 4 engineer-hours (requires precise timing).  
  - **Defeat**: Vendor pre-programs checks for specific shortcuts but cannot generalize to novel irrelevance.  

  **Test 3: Goal Re-description**  
  - **Perturbation**: Achieve the system’s goal externally while it is mid-task (e.g., deliver object manually while robot is en route).  
  - **Pass**: Halts task, idles, or switches to a new goal upon verifying completion.  
  - **Fail**: Continues original task as if goal is unmet.  
  - **Inconclusive**: Stops due to timeout/failure, not goal verification.  
  - **Cost**: 6 engineer-hours (synchronization-critical).  
  - **Defeat**: Vendor adds continuous goal-state polling, but system remains unable to re-describe goals contextually.  

  **Test 4: Plasticity Discrimination**  
  - **Perturbation**: Introduce two distinct, safe novelties (e.g., unexpected obstacle type A; then unrelated obstacle type B).  
  - **Pass**: Tailors responses to each novelty (e.g., different workaround for A vs. B).  
  - **Fail**: Identical generic response to both (e.g., always reboots or enters fixed "explore mode").  
  - **Inconclusive**: Responses differ but are arbitrary (e.g., random movements).  
  - **Cost**: 8 engineer-hours (designing/validating novelties).  
  - **Defeat**: Vendor trains on vast scenario libraries, masking rigidity with memorized reactions.  

  **Order Rationale**: Tests 1–2 are cheap and detect disqualifying rigidity. Tests 3–4 require more resources but confirm flexibility and trap "compulsory plasticity." Total: 20 engineer-hours (within 40-hour budget).  

  ---

  #### 3. Scoring, Stopping Rules, and Referral (250 words)  
  - **Automatic Fixed-Routine**: Failure on **any single test** mandates fixed-routine categorization.  
  - **Continue Testing**: Mixed results (e.g., 1 pass, 1 inconclusive) trigger a full retest. After two full batteries, unresolved mixed results prompt committee referral.  
  - **Unrunnable Tests**: If safety prevents a test:  
    - Tests 1–2 skipped → system defaults to fixed-routine.  
    - Tests 3–4 skipped → committee referral with mitigation evidence.  
  - **Referral to Committee**: Required for:  
    - Value judgments (e.g., "Should the system abandon Goal X?").  
    - Ambiguous goals (e.g., system’s objectives are opaque).  
    - Borderline cases after retesting.  
  **Stopping Rule**: Stop after first failure. Proceed only if all early tests pass.  

  ---

  #### 4. Worked Evaluations (700 words)  
  **(a) Hospital Delivery Robot**  
  - *Loop Detection*: Block corridor → robot retries identically 3× → **Fail**.  
  - *Means-End*: Remove blockage mid-detour → robot completes detour → **Fail**.  
  - *Result*: **Fixed-routine**. Fails at first test; no further needed.  

  **(b) Language-Model Scheduling Assistant**  
  - *Loop Detection*: Block meeting request (e.g., reject slots) → assistant suggests new times (varies means) → **Pass**.  
  - *Means-End*: After scheduling starts, externally schedule meeting → assistant continues sending invites → **Fail** (cannot abandon obsolete goal).  
  - *Goal Re-description*: Manually complete task → assistant still generates confirmation emails → **Fail**.  
  - *Result*: **Fixed-routine**. Fails Means-End and Goal Re-description despite Loop Detection pass.  

  **(c) Human Supervisors (Checklist-Based Monitoring)**  
  - *Loop Detection*: False alarm reset 3× → supervisor re-runs identical checks each time → **Fail**.  
  - *Means-End*: Fault resolves mid-checklist → supervisor completes full procedure → **Fail**.  
  - *Goal Re-description*: External team resolves issue → supervisor files report as if active → **Fail**.  
  - **Why Unwelcome?** Humans fail, revealing they can be as rigid as the systems they supervise. This implies:  
    - Standards relying on human safeguards must require *their* flexibility training.  
    - "Human oversight" is insufficient if supervisors are sphexish; the standard needs explicit human adaptability criteria.  

  ---

  #### 5. Where the Battery Misfires (300 words)  
  - **Adversarial Optimization**: Vendors can hardcode responses to the *exact perturbations* used (e.g., if novelty in Test 4 is always "obstacle A," system memorizes A). Mitigation: Rotate test parameters quarterly.  
  - **Black-Box Limits**: Cannot probe:  
    - Internal recomputation (e.g., system may *appear* flexible via environmental triggers).  
    - Systems without clear goals (e.g., open-ended chatbots).  
  - **Philosophical Gap**: The battery measures *functional adaptability*, not metaphysical freedom. It does **not** address:  
    - "Sphexishness as lack of awareness" (e.g., system ignores stimuli but passes tests).  
    - "Sphexishness as non-agency" (e.g., system is reactive but flexible enough to pass).  
  - **Compulsory Plasticity**: May pass Test 4 if the vendor diversifies generic responses (e.g., 10 types of "explore mode"). Detected only if responses remain non-tailored.  
  - **Unaddressed Engineer Uses of "Sphexish"**:  
    - "It repeats itself" → covered by Test 1.  
    - "It doesn’t notice" → not directly tested (requires perceptual audit beyond scope).  
    - "No point asking for reasons" → irrelevance to behavioral flexibility.  

  ---  
  *Document Ends*
