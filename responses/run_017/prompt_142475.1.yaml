  We are building a decision tree to navigate through responses to Fitch's paradox of knowability.
   The paradox: 
     If all truths are knowable (Knowability Principle: KP), then it follows that all truths are actually known (Omniscience: O), which is absurd.
     Steps: 
       (1) Suppose there is an unknown truth p: p & ~Kp (p is true and it is not known that p).
       (2) By KP: it is possible to know (p & ~Kp).
       (3) But if one knows (p & ~Kp), then one knows p and knows that p is not known (Kp and K~Kp).
       (4) However, knowledge implies truth (factivity), so from K~Kp we get ~Kp (that p is not known).
       (5) Also, from Kp and factivity, we have p.
       (6) But note that Kp (from step 3) and ~Kp (from step 4) is a contradiction.
     Hence, the assumption of an unknown truth leads to contradiction. So if KP holds, then there are no unknown truths, i.e., O holds.

   The challenge: how to avoid this conclusion? We want to keep realism (some truths may be unknown) and reject O, so we must reject KP? 
   But KP is attractive for anti-realists (verificationists, idealists) who think truth is tied to our epistemic capacities.

   We are to build a decision tree that starts with "I still want to say every truth could in principle be known" and ends with a named way out.

   The tree will have 7 or 8 questions, each a concrete case, and the leaves will be named positions (or 'unnamed') with a note on the awkward commitment and whether they are realist.

   We also note any two leaves the tree cannot separate and any combination that no one defends.

   Steps in the tree:

   We'll design the questions as follows:

   Q1: Consider a truth that would stop being true the moment somebody found it out (e.g., a coin flipped in a sealed room in 1823 and melted down in 1850, nobody ever looked). Do you think this truth must be knowable? [Yes/No]

     Why this matters: If yes, then we require that even such truths are knowable. If no, then we might restrict KP to truths that are stable (i.e., not "fragile").

   Q2: Does "could be known" require that there is some actual person (past, present, or future) who could come to know it? Or does it allow for the possibility of a new person (even if no actual person could)? [Actual person / Possible new person]

     Why: Some might think that knowability requires an actual epistemic agent (with the right cognitive capacities) who could have come to know it. Others might allow counterfactual knowers.

   Q3: Consider a truth that is too long for any human to ever finish writing down (e.g., a description of every particle in the universe at a given moment, which would take more symbols than there are atoms). Is such a truth knowable? [Yes/No]

     Why: This tests whether we require that truth is knowable by finite beings.

   Q4: Would you say that knowing a conjunction (p & q) requires knowing each conjunct? [Yes/No]

     Why: The paradox uses the principle that if you know a conjunction, then you know each conjunct. This is often taken as a principle of distribution for knowledge.

   Q5: If you know p, do you automatically know the obvious logical consequences of p? [Yes/No]

     Why: The paradox uses the idea that if you know (p & ~Kp), then you know p and you know ~Kp. Also, from knowing ~Kp, by factivity you get ~Kp. But note: factivity is not in dispute. The issue is whether knowledge is closed under obvious logical consequence.

   Q6: If you had to drop one of the following to avoid the paradox, which would you drop? 
     Option A: The knowability principle (KP: every truth is knowable).
     Option B: The distributivity of knowledge over conjunction (if you know (p & q), then you know p and you know q).
     Option C: The principle that knowledge is closed under obvious logical consequence (if you know p, and q is an obvious logical consequence of p, then you know q).

     Why: This is a fallback if we haven't already resolved the issue.

   But note: we might have already taken a position in the previous questions that leads to a particular way out.

