   1. Restrict KP to stable truths (truths that wouldn't change upon being known). This avoids the paradox by denying that (p & ~Kp) is a stable truth. 
      - Named: "The Stable Knowability Principle" (e.g., Dorothy Edgington, Tim Williamson)
      - Awkward: Must deny that there are any unstable unknown truths? Or at least that KP doesn't apply to them. 
      - Realist? Yes, because it allows for unstable unknown truths that are not covered by KP.

   2. Restrict KP to propositions that are knowable by some possible being (not necessarily an actual one). 
      - This might be combined with the idea that (p & ~Kp) is knowable only by an omniscient being? But then we run into the problem that an omniscient being would already know p, so ~Kp would be false for that being.
      - Actually, the standard move is to say that (p & ~Kp) is not knowable by anyone because if it were known, then the knower would know p (so Kp) but also know ~Kp (which entails ~Kp) and that is a contradiction. So it's not that we need a special being, but that the proposition is inconsistent when known.

   3. Restrict KP to truths that are in principle knowable by finite beings (e.g., human-like). 
      - Then the long truth might be excluded. 
      - But note: the paradox doesn't require a long truth, so this might not help by itself.

   4. Deny distributivity: knowing a conjunction does not require knowing the conjuncts. 
      - Named: "Non-distributive knowledge" (e.g., by Joe Salerno, but note that this is not widely held). 
