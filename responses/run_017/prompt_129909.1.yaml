answer: |-
  ### Desiderata Table

  | id | requirement | motivating_case | status | rules_out |
  |----|-------------|-----------------|--------|-----------|
  | 1 | A non-arbitrary brute/option luck boundary must be defined, resolvable under state epistemic constraints. | Grain problem: Describing a job loss as "choosing to work in a volatile industry" (option) vs. "systemic layoffs" (brute). Grain varies by description, risking arbitrary policy. | Non-negotiable | Theories requiring unrealistically fine-grained choice descriptions (e.g., radical libertarianism) or those collapsing the distinction (e.g., strict outcome egalitarianism). |
  | 2 | Expensive tastes and adaptive preferences must not create unlimited claims or penalize victims. | A person deprived in childhood develops a taste for costly therapy; another cultivates a taste for luxury art. Neither gets unlimited subsidies nor is denied aid due to "choice." | Non-negotiable | Welfarism (unlimited subsidy for welfare deficits) and resourcism (ignoring adaptive preferences, blaming victims). |
  | 3 | Constitutive luck (e.g., temperament) vs. circumstantial luck must be addressed or explicitly rejected. | Two equally circumstanced people: one has innate impulsivity (constitutive), leading to poverty; the other does not. Compensation? | Negotiable | Theories ignoring constitutive traits (e.g., income-focused resourcism) or overcompensating for them (e.g., extreme luck egalitarianism). |
  | 4 | Non-abandonment: Gamblers retain a claim to a decent minimum. | A entrepreneur bets her savings on a failed venture. She retains access to healthcare/basic income, avoiding destitution. | Non-negotiable | Libertarianism (no redistribution post-choice) and theories denying all post-gamble claims. |
  | 5 | Disclosure condition: No self-presentation as defective for compensation. | A depressed person must not "prove" helplessness for aid, but instead claim via objective criteria (e.g., income). | Prejudice (capability/sufficientarian) | Theories requiring moral or functional deficiency proofs (e.g., some capability approaches). |
  | 6 | Diachronic accounting: Time frames (life/time-slice) and luck re-assessment must be specified. | A worker disabled at 20 vs. 60: same impairment, but compensation varies if accounting is periodic vs. whole-life. | Non-negotiable | Ambiguous theories (e.g., unstated periodic egalitarianism) or those ignoring lifetime totals. |
  | 7 | Implementability: Guidance for unobservables (effort/tastes/choice). | State sees low wealth but cannot tell if due to laziness (option) or discrimination (brute). Default action? | Non-negotiable | Theories relying on unobservables (e.g., effort-based desert) or with no default (e.g., ideal-theory egalitarianism). |
  | 8 | Incentive-responsiveness: Feasibility under behavioral adaptation. | High earners reduce work if taxed >70%; theory must adjust transfers to maintain revenue/justice. | Non-negotiable | Static theories ignoring incentives (e.g., utopian Marxism) or those causing collapse (e.g., 100% redistribution). |
  | 9 | Currency: The equalized/compensated metric must be defined (e.g., resources, welfare). | Equalizing income (resources) vs. happiness (welfare) yields different transfers for identical disabilities. | Non-negotiable | Vague theories (e.g., undefined "advantage" metrics) or hybrid views without primacy. |
  | 10 | Baseline circularity: The "just background" for choices must not presuppose the theory. | Defining voluntary job choices requires a prior fair wealth distribution—which the theory must establish. | Non-negotiable | Libertarianism (taking property rights as given) and circular luck-egalitarian definitions. |
  | 11 | Scope: Natural/social luck, children/future people/non-citizens must be included. | A child born disabled (natural) vs. an adult disabled in war (social); a non-citizen resident in poverty. | Negotiable | Nation-state-limited theories (e.g., statist libertarianism) or those excluding natural luck (e.g., some Rawlsians). |
  | 12 | Second-order luck: Inequalities in risk-tolerance/willpower must be addressed. | Two people: one has high risk-tolerance (innate? circumstantial?) and wins a gamble; the other, risk-averse, stays poor. | Negotiable | Theories ignoring meta-traits (e.g., Dworkin’s hypothetical insurance without willpower coverage). |
  | 13 | Timing-neutrality: Brute luck timing (early/late) must not alter compensation if impact is identical. | Identical disability at birth vs. age 50 with same lifetime impact. Compensation must not differ due to timing alone. | Non-negotiable | Age-weighted sufficientarianism or periodic accounting without lifetime aggregation. |
  | 14 | Interpersonal comparability: The currency must be observable and comparable across persons. | Comparing welfare/opportunity between a disabled artist and an able-bodied accountant for compensation. | Non-negotiable | Theories relying on non-comparable utilities (e.g., preference-satisfaction welfarism) or vague capabilities. |

