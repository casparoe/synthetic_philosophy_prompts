    - Drive on utility: \(q_1 V_2 + q_2 V_3 \approx 0.5407 \cdot 2.3008 + 0.2966 \cdot 0.9028 \approx 1.511\)  
  **Indifference confirmed** (\(\approx 1.512\) for both).  

