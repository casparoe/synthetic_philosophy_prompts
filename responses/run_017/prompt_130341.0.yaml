  Is this a theorem? It seems to be a consequence of the stationarity and the fact that the policy is optimal. In general, in an MDP with imperfect recall, the optimal policy might be such that at every information set, the action is optimal given the belief that is induced by the policy. This is the idea of a consistent assessment in game theory (policy and belief).

  In this specific setting, because the driver has no memory and the turnings are identical, the information set is the same at every turning. The belief over which turning he is at is given by the relative visitation frequencies. And the optimal policy is stationary (same p at every turning). Then, if the policy is optimal, it must be that at the information set, the actions in the support of the mixed strategy are best responses given the belief induced by the policy. In this case, the mixed strategy uses both actions (because p* is between 0 and 1), so they must be indifferent.

  Therefore, it is a general property: the ex ante optimal stationary policy in this class of problems will have the property that at the turning, the driver is indifferent between turning off and driving on, when he holds the belief induced by the policy.

  This would fail if the optimal policy were not interior (i.e., if it were a corner solution). For example, if the payoffs were such that the optimal p were 0 or 1, then the driver might not be indifferent. But in that case, the belief might still be such that the chosen action is strictly better.

