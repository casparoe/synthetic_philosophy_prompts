  ### The Coincidence Theorem
  **Result:** The ex ante optimal stationary policy \(p^*\) induces a visit-frequency belief at each turning, and under this belief, the driver is indifferent between actions (turn off/drive on).  
  **Why it holds:**  
  - This is a general property of optimal stationary policies in **finite-horizon, symmetric, imperfect-recall decision problems** with a single information set.  
  - Key ingredients:  
    1. **Stationarity**: Policy identical at all indistinguishable decision nodes.  
    2. **No recall**: Belief depends only on visit frequencies (proportional to \((1-p)^k\) for position \(k+1\)).  
    3. **Optimality**: \(p^*\) maximizes ex ante EU. If \(0 < p^* < 1\), actions must yield equal EU under the belief \(p^*\) generates; otherwise, deviating from \(p^*\) could improve EU.  
  - **Failure case**: If optimal \(p^* = 0\) or \(1\), indifference fails.  
    - Example: Modify payoffs to \((0, 10, 2)\) for turnings 1,2,3. Optimal \(p^* \approx 0.732\) (interior), so indifference holds. Change to \((0, 10, -5)\). Optimal \(p^* = 1\) (always turn off). Belief: \(P(\text{turning 1}) = 1\). Turn off gives 0, drive on gives \(V_2 > 0\) (not indifferent).  
  **Verdict:** Coincidence is a theorem for interior optimal policies in symmetric imperfect recall. It shows that ex ante and interim standpoints **do not come apart** for interior optima—optimality links them.

