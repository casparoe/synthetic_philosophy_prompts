  ### Verification of Your Calculations
  **Ex ante optimal policy:**  
  For a stationary policy with probability \(p\) of turning off at each turning, the expected value is:  
  \[
  V(p) = 4p(1-p) + 2p(1-p)^2 = 2p(1-p)(3-p)
  \]  
  Derivative:  
  \[
  V'(p) = 2(1-p)(3-p) - 2p(3-p) - 2p(1-p) = 6 - 16p + 6p^2
  \]  
  Set to zero: \(3p^2 - 8p + 3 = 0\). Solutions:  
  \[
  p = \frac{8 \pm \sqrt{64 - 36}}{6} = \frac{4 \pm \sqrt{7}}{3}
  \]  
  Relevant root: \(p^* = \frac{4 - \sqrt{7}}{3} \approx 0.4514\).  
  Value:  
  \[
  V(p^*) = \frac{28\sqrt{7} - 40}{27} \approx 1.262
  \]  
  **Correct.**

  **Visit-frequency belief:**  
  Unnormalized weights: \(w_1 = 1\), \(w_2 = 1 - p^*\), \(w_3 = (1 - p^*)^2\).  
  With \(p^* \approx 0.4514\):  
  - \(w_1 = 1\)  
  - \(w_2 \approx 0.5486\)  
  - \(w_3 \approx 0.3008\)  
  Sum \(\approx 1.8494\). Normalized:  
  - \(P(\text{turning 1}) \approx 0.5407\)  
  - \(P(\text{turning 2}) \approx 0.2966\)  
  - \(P(\text{turning 3}) \approx 0.1627\)  
  **Correct** (matches your \(\approx 0.541, 0.297, 0.163\)).

  **Interim optimization with belief:**  
