  ### Joint Statement on Epistemic Foundations in Strategic Situations

  #### 1. Agreed Claims  
  1.1. **Formalism**: Both camps adopt a standard state-space model: a set of states \(\Omega\), each representing possible worlds. Agents have partitions over \(\Omega\) (information sets) or are modeled via type spaces. Priors are represented as a common probability distribution over \(\Omega\) (common prior). "Common knowledge" (CK) is defined factively: an event \(E\) is common knowledge at \(\omega\) if \(\omega \in E\) (truth) and all agents know \(E\), know that others know \(E\), ad infinitum. "Common \(p\)-belief" (for \(p < 1\)) is non-factive: \(E\) is common \(p\)-belief at \(\omega\) if all agents assign at least probability \(p\) to \(E\), at least \(p\) to others assigning \(p\) to \(E\), etc., with no truth requirement. The fixed-point characterizations differ: CK requires \(\omega \in E\) and infinite nested knowledge; common \(p\)-belief requires a belief hierarchy with minimum probability \(p\) at each level.  

  1.2. **Diagnosis of Disagreement**: The no-disagreement theorem (Aumann, 1976) assumes a common prior and common knowledge of posteriors. The brothers' persistent 30% valuation gap implies:  
  - The common prior assumption is violated (due to differing priors or updating rules), or  
  - Common knowledge of posteriors is absent (due to communication barriers or mistrust).  
  Both camps agree that literal common knowledge of a non-trivial, contingent proposition (e.g., "the company is worth \(X\)") is physically unrealizable among humans due to unbounded reasoning requirements and noisy communication channels. This unrealizability is consistent with CK being a useful idealization for some purposes.  

  1.3. **Substantive Agreement**:  
  - In Game A, when \(p = 0\), state \(H\) is common knowledge, enabling efficient coordination on (Trade, Trade). For any \(p > 0\), coordination fails in state \(H\) due to the "email game" unravelling (Rubinstein, 1989).  
  - The common \(p\)-belief operator behaves continuously in \(p\) near \(p = 1\), while CK is discontinuous at the limit.  

  ---

  #### 2. Disagreements  
  Each camp endorses only its column below. Neutral glosses clarify the dispute.  

  | Idealization Camp (I) | Perturbation Camp (P) | Neutral Gloss |
  |------------------------|------------------------|---------------|
  | Limit results (e.g., agreement theorem, Nash implementation under CK of rationality) are the *correct normative benchmark* for rational agents. Deviations (e.g., brothers’ disagreement) stem from failures to satisfy idealizations. | Limit results are *irrelevant for design* as they hold only at measure-zero points (e.g., \(p = 0\)). Robust models (common \(p\)-belief, \(\epsilon\)-rationality, finite depth) are necessary for real-world applications. | **Role of limit ideals**: I views them as prescriptive; P as descriptively hollow. |
  | The discontinuity at \(p = 1\) is a *feature*: it correctly separates CK (coordination possible) from near-CK (coordination impossible). This is a profound insight, not a flaw. | The discontinuity at \(p = 1\) is a *reductio* of the CK operator. It reveals CK’s pathological sensitivity, making it unfit for modeling real agents. | **Discontinuity at limit**: I sees it as essential; P as a fatal defect. |
  | Logical omniscience (required by CK of rationality) is part of ideal rationality. Deliverables (e.g., agreement, equilibrium) are normatively binding; their failure implies irrationality. | Logical omniscience is unrealistically strong. Deliverables fail without it; models must drop it (e.g., via \(p < 1\) or bounded depth) to yield useful predictions. | **Logical omniscience**: I embraces it; P rejects it as incoherent. |
  | Predictions under finite-depth reasoning do not converge to CK predictions as depth \(\to \infty\) (e.g., agreement may not emerge). This non-convergence highlights human limitations. | Finite-depth models are primary. Predictions *should* converge to CK results as depth \(\to \infty\); when they do not (e.g., in agreement games), it indicts the CK idealization. | **Finite-depth convergence**: I denies convergence is necessary; P demands it. |
  | CK’s factivity is crucial: near-CK (e.g., \(p = 0.99\)) is *qualitatively distinct* from CK. Models must reflect this to be accurate. | Common \(p\)-belief’s non-factivity better models near-CK. Factivity introduces artificial distinctions; continuity in \(p\) is paramount. | **Operator factivity**: I prioritizes truth; P prioritizes smoothness. |

  **Verbal Dispute Resolution**:  
  - **"Common knowledge of rationality"**: I uses it to mean agents optimize given beliefs and know others do so (epistemic game theory). P argues this smuggles in logical omniscience.  
  - **"Robustness"**: P emphasizes continuity in parameters (e.g., \(p\), \(\epsilon\)); I counters that idealizations need not be robust to be valid.  
  - **Substantive core**: Whether CK-based models are *foundational* (I) or *misplaced* (P) for design.  

  ---

  #### 3. Cruxes  
  Settling these would shift at least one camp’s position:  
  1. **Discontinuity at \(p = 1\)**: Is it a deep insight (I) or a reductio (P)?  
  2. **Finite-depth convergence**: Do predictions converge to CK results as depth \(\to \infty\)? If not, does this invalidate CK (P) or highlight human frailty (I)?  
  3. **Logical omniscience**: Does discarding it preserve useful deliverables (e.g., approximate agreement)?  
  4. **Operator choice**: Does factivity materially affect predictions in near-CK cases (e.g., Game A with small \(p\))?  
  5. **Normative vs. descriptive**: Are CK deliverables coherence constraints (I) or failed descriptions (P)?  
  6. **Approximate CK**: Is there a common \(p\)-belief concept yielding limit-like results continuously in \(p\)?  

  ---

  #### 4. Test Cases  
  **Game A & Variant A’**  
  - **Game A (state H, \(p > 0\))**:  
    - I: Unique rationalizable outcome: (Walk, Walk). Pessimism is forced.  
    - P: For small \(p > 0\), (Trade, Trade) occurs with high probability (continuously approaching 1 as \(p \to 0\)).  
  - **Variant A’**: Ada pays \(c\) for a public announcement (heard perfectly).  
    - I: Ada pays iff \(c < 4\). CK of \(H\) is restored, enabling (Trade, Trade).  
    - P: Ada pays only if \(c < 4 \times (1 - \text{risk premium})\). Risk premium depends on \(p\); for small \(p\), she rarely pays.  

  **Game B (Three Players)**  
  - **Agreed Result**: With two players, common belief in rationality + payoff structure implies Nash equilibrium play. With three players, this fails without additional assumptions (e.g., independence of conjectures).  
  - **Predictions for Game B (state H, \(p > 0\))**:  
    - I: Unique rationalizable outcome: (Walk, Walk, Walk). Unravelling persists.  
    - P: For small \(p > 0\), (Trade, Trade, Trade) occurs with high probability.  
  - **Three-Player Failure**:  
    - I: Irrelevant; unravelling is driven by state uncertainty, not rationality.  
    - P: Strengthens critique: CK’s fragility worsens with more players.  

  ---

  ### Appended Section: Implications for Mechanism Choice  
  *Not part of joint statement*  

  1. **Sealed bids with matching right**:  
     - I: Predicts aggressive bidding due to value disagreements; matching rights may induce spiteful behavior.  
     - P: Bounded rationality leads to inconsistent bids; matching may amplify errors.  
     - **Verdict**: Both discourage—high risk of litigation.  

  2. **Shotgun clause**:  
     - I: One sibling may set an extreme price, exploiting others’ rationality gaps.  
     - P: Price-setting is highly sensitive to biases; accept/reject decisions may be erratic.  
     - **Verdict**: Both discourage—volatile and unstable.  

  3. **Independent certified valuation**:  
     - I: Public valuation creates common knowledge of value, aligning beliefs and enabling fair bids.  
     - P: Public information reduces strategic complexity; robust to bounded rationality.  
     - **Recommendation**: **Both camps endorse this mechanism** for the same outcome (reduced disagreement) but different reasons: I for common prior alignment, P for robustness.  

  **Conclusion**: The independent valuation is the safest choice. If residual disagreement persists, the key crux is **finite-depth convergence** (Crux 2). If predictions converge as depth \(\to \infty\), I’s view gains strength; if not, P’s critique prevails. Bet on this crux—it underpins whether CK ideals are reachable benchmarks or mirages.
