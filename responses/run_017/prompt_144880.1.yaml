answer: |-
  ## The Limits of Coherence

  Coherence arguments aim to show that violating the axioms of expected utility (EU) theory is irrational. They do this by demonstrating that violators can be exploited: saddled with a sure loss in some currency through a package of bets or a sequence of trades. While powerful, these arguments fall short of establishing that rationality *requires* EU maximization. Their force is conditional, instrumental, and insufficient to bridge the gap to full maximization.

  **1. The Immune Non-Maximizer**

  Consider a **satisficing agent with a fixed threshold**. She evaluates options solely based on whether they meet or exceed a specific minimum acceptable outcome level in the settlement currency (say, dollars). She is indifferent between any outcomes above her threshold and rejects any option failing to meet it. Suppose her threshold is $100. She would accept a bet costing $1 that pays $101 if a coin lands heads and $101 if tails (net gain: $100 or $100). She would also accept a bet costing $99 that pays $200 on heads and $0 on tails (net gain: $101 or -$99). Crucially, she rejects a bet costing $101 that pays $102 on heads and $102 on tails (net gain: $1 or $1) because $1 < $100.

  *   **Package-Immunity:** No single bundle forces a sure loss. Any bundle demanding money upfront must offer payoffs. If the *net* result of the bundle is below $100 in *every* state, she rejects the bundle outright – the "sure loss" bundle is never accepted. If it meets or exceeds $100 in some state, it's not a sure loss. The Dutch Book construction fails because it relies on her accepting a bundle with negative net payoff in every state; she simply declines it.
  *   **Sequence-Immunity:** An adversary offering trades sequentially cannot force her below her threshold. Suppose she holds an asset worth $150. The adversary offers to buy it for $100 (which she accepts, as $100 meets her threshold). Now she has $100. The adversary cannot force a subsequent trade that takes her below $100, because she rejects any trade with a net result < $100. Offering to sell her a lottery ticket costing $50 that pays $0 or $200 is rejected (net outcome: $50 < $100 or $100). She ends with $100, safely above her threshold. The money pump stalls. She violates EU axioms (completeness fails for options above threshold, independence likely fails), yet avoids exploitation.

  **2. The Currency Dependency & Circularity**

  Coherence arguments fundamentally rely on the settlement currency being **state-independent and separable in value**. The agent must always want more of it, regardless of the state of the world or what else she possesses. Only this guarantees that a net loss in that currency *is* genuinely undesirable in every scenario. The arguments also require **unlimited stake sensitivity**: the agent must accept arbitrarily scaled versions of trades she finds acceptable, enabling the construction of the exploitative package or sequence.

  The obvious repair – denominating payoffs in the agent’s own putative "utility units" – fails. **It is unavailable** because utility is not a tangible good a bookie can hand over in settlement; bets are settled in real resources. More damningly, **it is circular**. Defining "utility units" presupposes the existence of the very EU representation the argument seeks to establish. To say a payoff is +1 "util" *means* the agent values it according to her EU function. The coherence argument using utils assumes what it needs to prove: that the agent’s preferences *already* conform to EU theory and can be represented by such a function. It cannot bootstrap itself into existence this way.

  **3. Asymmetry: Loss Avoidance vs. Gain Securing**

  Coherence arguments demonstrate only that violators are *exploitable* – they can be saddled with a sure loss. They do not demonstrate that violators *fail to secure available sure gains* ("reverse-exposure"). Our satisficer is reverse-exposed: she declines the bet costing $101 paying $102 in all states (net +$1), a sure gain, because $1 is below her threshold. Is this irrational? Not inherently. Declining a small sure gain because it falls below a minimum acceptable level, while perhaps instrumentally suboptimal relative to an *external* goal of wealth maximization, is not a logical or conceptual incoherence *within her own framework*. It reflects a substantive preference for security over negligible gains.

  For reverse-exposure to constitute incoherence *on par with exploitability*, we would need an argument showing that declining a sure gain is intrinsically irrational or violates a fundamental norm, independent of the agent's specific goals. Coherence arguments based on exploitability provide no such thing. They only deliver *half* of what EU maximization demands: avoiding sure losses. Maximization also requires accepting sure gains. Coherence arguments are silent on the latter. An agent can be perfectly coherent (package- and sequence-immune) yet consistently pass up sure gains, violating EU maximization.

  **4. Objections: Accuracy and Interpretation**

  *   **The Epistemic (Accuracy-First) Objection:** Proponents argue that credences should minimize inaccuracy, measured by scoring rules. Strictly proper scoring rules allegedly force probabilistic coherence. A bridge principle (e.g., "choose acts maximizing expected accuracy" or "credences should guide choice via EU") then links accurate credences to rational choice.
      *   **Why it fails:** First, scoring rules constrain *credence*, not *choice*. They show why incoherent credences are inaccurate, not why an agent must *act* on coherent credences via EU maximization. Second, the crucial bridge principle *reintroduces the decision-theoretic norm it was meant to ground*. Stipulating that agents *should* maximize expected accuracy (or expected utility based on their credences) presupposes the legitimacy of the EU norm for choice under uncertainty. It doesn't derive it from more fundamental epistemic norms; it *assumes* it. The argument becomes circular: we ground EU choice in accurate credences by assuming EU choice is how credences *should* guide choice.
  *   **The Constitutive (Interpretationist) Objection:** Incoherence isn't irrationality but unintelligibility. We *cannot* interpret an agent as having beliefs and desires unless we attribute sufficiently coherent (EU-like) preferences. Coherence is constitutive of being an agent.
      *   **What's granted:** Interpretation requires significant rationality for belief-desire attribution to make sense. Extreme, chaotic "preferences" resist interpretation.
      *   **What's lost:** This converts a normative claim ("you *ought* to be coherent") into a predictive or conceptual claim ("only coherent creatures are interpretable as agents"). It answers "why be coherent?" only by saying "otherwise, we won't call you rational (an agent)." This provides no *reason* for an agent *already deemed interpretable* (like our satisficer, whose threshold structure *is* intelligible) to *adopt* EU coherence. The normative force evaporates; it becomes a condition for being labeled an agent by others, not a requirement an agent has reason to satisfy *for herself*. The challenge "Why should *I* avoid incoherence, given my goals?" remains untouched.

  **5. The One-Shot Agent**

  Consider an agent facing a single, isolated decision. Diachronic money pumps and long-run accuracy considerations vanish. What survives?
  *   **Package arguments (Dutch Books)**: These remain relevant *if* a bookie can offer a single take-it-or-leave-it bundle exploiting her synchronic preferences. Our satisficer remains immune; she rejects the sure-loss bundle. An agent violating axioms like ordering or independence in ways that *do* allow a sure-loss bundle (e.g., cyclic strict preferences over certain bundles) could still be exploited. Package-immunity is a synchronic coherence constraint.
  *   **Sequence arguments & Long-run accuracy**: These collapse entirely. There are no future trades to pump her, and "long-run" accuracy is meaningless for one decision.

  The surviving argument – synchronic package-immunity – is recognizably a coherence argument: it demands the agent's preferences over options at a single time avoid a particular kind of inconsistency (accepting a logically dominated bundle). However, it is drastically weaker than the full synchronic EU axioms. It forbids accepting a sure loss but doesn't require completeness, transitivity over all options, independence, or continuity. It certainly doesn't entail maximizing expected utility. Our satisficer satisfies it without being an EU maximizer. Even for the one-shot agent, coherence only rules out gross synchronic inconsistency involving sure loss acceptance, not the substantive structure of EU maximization.

  **Where the Argument is Strongest:** The dependency on a state-independent, separable settlement currency is the bedrock weakness of coherence arguments. It is undeniable that the "sure loss" is defined *in that currency*, and the argument assumes the agent always wants more of it. Attempting to circumvent this with "utility units" is transparently circular. This dependency confines coherence to an instrumental requirement relative to a specific, substantive desire for that currency, rather than a constitutive requirement of rationality itself.

  **Where We Concede:** In the synchronic, one-shot case, package coherence *does* rule out agents who accept logically dominated bundles resulting in a sure loss in the currency. While our satisficer avoids this, *some* non-EU maximizers (e.g., those with cyclic strict preferences over certain bundles) might be vulnerable. However, this surviving constraint is far weaker than EU maximization and does not rescue the broader coherence program's ambition to establish it. The core instrumentalism and the failure to address reverse-exposure or secure the normative force via accuracy or interpretation remain decisive against that larger goal.
