prompt: |-
  hey — you're a professional philosopher who works on population ethics and also actually knows population ecology (think: someone who's spent time with both the total/average view literature and with life-history theory). Please think carefully here and don't rush to a verdict: start by brainstorming a messy list of candidate requirements, then prune and merge, then write me the final spec. And please don't give me citations or a reading list — I'm somewhere without library access, and I'd rather have the conceptual work than references I can't check.

  I work adjacent to the habitat and conservation world, and I keep running into the same argument: most wild animals seem to live short lives full of starvation, parasitism, disease and predation, and in a lot of species most juveniles die before reproducing (the r-selected end of the spectrum: hundreds or thousands of offspring, of whom maybe two make it), so habitat destruction might actually reduce the total amount of suffering in the world by reducing how many animals get born into lives like that. The usual reply is that this doesn't work because a population knocked below carrying capacity just bounces back. I dont want to litigate the headline question yet — I want the spec first. Before I can trust anybody's estimate of the net welfare of an ecosystem, what does their account have to be able to do?

  So: give me the desiderata list. The cases it has to get right, the distinctions it must not collapse, the results from population biology and welfare biology it can't contradict, each with the motivating consideration behind it, and for each one say whether it's genuinely non-negotiable or just a prejudice of one camp (the total-vs-average business, whether suffering matters more than enjoyment or is just the symmetrical negative half, whether species and ecosystems have value over and above the sentient individuals inside them, whether we should count animals who never exist, and so on). A few things I think belong on the list and I want to see how you'd state them properly: (1) the headcount-vs-equilibrium point — a theory that just compares numbers of animals alive at a moment isn't measuring anything stable, and since the same patch of ground can settle into either of two alternative stable states (say a woodland regime versus a degraded, generalist-dominated one) with very different equilibrium population sizes and very different juvenile mortality rates, the account should be able to say which regime the landscape ends up in and roughly how long it stays there, including whether it flips back if the habitat is restored, rather than counting animals today; (2) replaceability — if the same two offspring survive either way, has anything been lost when the other 998 die young, and how does the answer change if those deaths are quick versus drawn out; (3) the interaction between average welfare and numbers, since a modest change in average welfare can easily swamp a big change in headcount, which means the whole thing turns on empirical questions about whether wild lives are net positive or net negative that we mostly can't answer yet; and (4) the fact that the animals alive during the clearance — the ones who get displaced, starve, or get eaten — are a different moral problem from the ones who are simply never born, and I want the theory to keep those separate instead of netting them out. Add whatever I'm missing. Then tell me which pair of desiderata you suspect can't be jointly satisfied (that's the part I most want to see, since it would mean the spec itself is a result), and which single requirement does the most work in knocking out the accounts people actually defend. A table is fine if it helps, but the reasoning behind each requirement matters more to me than scoring the contenders.
