prompt: |-
  I'm a software engineer with no philosophy background (well, one undergrad ethics class I mostly slept through), and somehow I ended up as the "technical person" on the clinical ethics committee at one of the hospitals my company builds decision-support tools for. I keep finding that my gut verdicts on individual cases are very confident but don't add up to anything I can actually write down, and I'd like the rule. I even tried writing it as a spec — if X, then permissible — and it collapsed every time I tested it against the next case.

  Here's where I land. Unplugging the ventilator on a patient who'll never breathe on their own again, because the family asks us to: fine, obviously. Never starting the vent in the first place on that same patient: also fine, and I'll say out loud that it's the same decision, even though the ICU attendings treat withholding as completely different from withdrawing and much easier to sleep after — I think they're just wrong about that. Stopping a feeding tube: also fine, but it makes me uneasy in a way the vent doesn't, and I can't tell whether that's a real distinction or just squeamishness about food and water. Taking a young, awake patient with a high spinal cord injury off the vent because he's decided he doesn't want to live like that: fine, and somehow clearer than the first case even though he isn't dying of anything. Morphine for someone in end-stage lung disease who's gasping for air, at a dose where everyone in the room knows it'll shorten things by a few hours: fine. The same drug at a much bigger dose, where the whole point is to end it: not fine. I know those two look inconsistent — same drug, same route, same patient, same physiological cause of death, only the reason is different — and my friend mutters something about "double effect," but I don't want a tour of the literature, I want the principle.

  The pair that really breaks me: the guy who sneaks into the bathroom to hold his cousin's head under the water for the inheritance is a murderer, and the guy who came prepared to do exactly that, finds the kid already face-down, and just stands there and watches is also a murderer, close enough that I don't care about the difference. But then why isn't unplugging the vent the same thing? My best attempt at a principle: it's OK when what kills them is whatever was already wrong with them — their lungs, their heart — and not OK when the death comes from something I introduce into the situation. That doesn't handle the morphine pair (the drug kills them in both), and I'm not sure what it says about a nurse accidentally knocking a dialysis machine off and me deciding not to restart it. And next month we've got two cases that aren't in anybody's binder. One: during a surge, an allocation model ranks patients and recommends moving the last ventilator from a patient with poor projected benefit to one with better projected benefit; the attending's entire action is one click, accept recommendation, and a respiratory therapist does the actual disconnect per protocol. That feels fine to me if the ranking process is fair, but it definately feels worse than never having allocated the vent to the first patient in the first place, which is supposed to be the same thing. Two: a closed-loop sedation controller that titrates propofol to a comfort target, where the team's only real choices are let it run or switch it off — if the patient dies sooner because the controller ran, who did what, and does the principle say anything? So: can you give me a principle, or two competing candidates, with each clause tied to the case that motivates it, tell me honestly which of my verdicts it can't save and which one I should probably give up, and tell me what it predicts for those last two cases?
reasoning: |-
  Okay, the user is a software engineer on a clinical ethics committee without a philosophy background. They have confident gut reactions to various cases but struggle to formalize a consistent rule. Let me unpack their scenarios and find a unifying principle.

  First, their cases: Withdrawing vs. withholding ventilation feels ethically identical to them, but clinicians see a difference. Stopping feeding tubes causes unease versus ventilators. Allowing a conscious patient's choice to withdraw life support feels clear. Low-dose morphine for symptom control is acceptable even if it shortens life slightly, but high-dose intentional euthanasia isn't. The drowning cousin examples highlight their confusion about action vs. inaction in causing death.

  Their attempted principle ("death must come from existing pathology, not introduced factors") fails with the morphine cases and dialysis example. The upcoming surge ventilator reallocation and closed-loop sedation cases add complexity around agency and system design.

  Key tensions I notice:
  - They intuitively separate intention (symptom relief vs. causing death) but need to articulate how
  - They recognize moral equivalence between withholding/withdrawing treatment, yet allocation decisions feel different
  - Technical systems introduce new ambiguity about moral responsibility

  The double effect doctrine seems relevant for the morphine cases - the primary intent matters. For the ventilator cases, the distinction between allowing natural death versus causing death is important. The drowning analogy fails because unplugging a vent allows the underlying condition to cause death, whereas drowning introduces a new cause.

  For the surge allocation case, the discomfort likely comes from active withdrawal versus passive non-allocation. The sedation controller blurs agency - is it the system designer's intent, the clinician's oversight, or the machine itself?

  I'll structure principles around:
  1) Intention (distinguishing morphine cases)
  2) Cause of death (pathology vs. new intervention)
  3) Agency in systems (allocation algorithms and automated controllers)

  Need to explicitly map each clause to their cases, flag where their intuitions might need re-examination (like feeding tube squeamishness), and predict outcomes for the pending cases.
answer: |-
  Based on your cases and frustrations, I'll avoid philosophy jargon and build principles directly from your examples. Your core tension is between **causing death** and **allowing death from underlying pathology**, complicated by **intent** and **system design**. Here are two competing principles, each with clauses tied to your cases, their limitations, and predictions for your upcoming cases:

  ---

  ### **Principle 1: The "Pathology Trigger" Principle**  
  *"Interventions are permissible when they remove an artificial barrier to an underlying fatal pathology taking its course, and impermissible when they introduce a new fatal pathology or exploit a non-fatal one."*  

  1. **"Remove artificial barrier to fatal pathology"**  
     - *Motivated by:* Unplugging ventilator (fatal lung failure resumes), stopping feeding tube (fatal starvation from irreversible inability to eat), not starting vent (same pathology as withdrawing).  
     - *Saves:* Spinal cord injury patient withdrawing vent (fatal respiratory failure triggered by injury).  
     - *Limitation:* Doesn't fully explain your unease with feeding tubes (is "inability to eat" the pathology, or is withholding food the *cause*?).  

  2. **"No new fatal pathology introduced"**  
     - *Motivated by:* Drowning cousin (you *add* suffocation; pathology wasn't already killing them).  
     - *Saves:* Low-dose morphine (relieves air hunger; respiratory suppression is a side effect of treating pathology).  
     - *Fails:* High-dose morphine (same "new pathology" as drowning—you're directly causing respiratory arrest).  

  3. **"No exploitation of non-fatal pathology"**  
     - *Motivated by:* Kid already drowning (inheritance motive exploits accidental pathology).  
     - *Saves:* Dialysis example—not restarting *is* permissible if kidney failure is the fatal pathology.  

  **Where it fights your gut:**  
  - Feeding tube discomfort: Your squeamishness *might* be irrational (starvation is the pathology here). Principle says: **fine**.  
  - Vent allocation: Withdrawing vent from Patient A for Patient B *is* impermissible—you're not just "allowing pathology"; you're actively reallocating to cause death. *Withholding* from A initially is fine.  
  - Propofol controller: If the *only* pathology is terminal (e.g., cancer), and propofol treats agitation (fatal overdose is side effect), it’s fine. If death is from propofol (not the disease), it’s not.  

  ---

  ### **Principle 2: The "Intent/Agency" Principle**  
  *"An action is permissible when the agent’s intent is to relieve suffering or respect autonomy, not to cause death—even if death is foreseen—and when the causal chain flows from the patient’s condition, not the agent’s direct intervention."*  

  1. **"Intent: relieve suffering/autonomy ≠ cause death"**  
     - *Motivated by:* Morphine pair (low dose = intent relief; high dose = intent death).  
     - *Saves:* Spinal cord injury patient (autonomy respects refusal; death is foreseen but not intent).  
     - *Fails:* Drowning cousin standing by (intent is death, even via inaction).  

  2. **"Causal chain anchored in pathology"**  
     - *Motivated by:* Vent withdrawal (death from lungs, not your hand).  
     - *Saves:* Dialysis machine—not restarting lets kidney failure kill, not you.  
     - *Limitation:* Feeding tube—same logic, so why your unease? Principle says: **fine**.  

  3. **"Agency clarity in systems"**  
     - *Motivated by:* Vent allocation and propofol controller (who is the moral agent?).  
     - *Rule:* If the system executes an intent-aligned decision (e.g., comfort, fair allocation), the clinician is not a direct killer.  

  **Where it fights your gut:**  
  - Vent allocation: Accepting the algorithm is fine if intent is fair resource use (not killing A). *Feels worse than withholding* because agency is more visible.  
  - Propofol controller: Permissible if the *intent* is comfort, and death is a side effect of treating agitation. The "agent" is the protocol designer, not the clinician.  
  - Drowning cousin: Standing by violates intent clause (you *want* death for gain).  

  ---

  ### **Which Verdicts Can’t Be Saved?**  
  - **Feeding tube discomfort**: Neither principle justifies your unease. Likely **squeamishness** (cultural "food/water as care" symbolism).  
  - **Vent withholding vs. withdrawing**: Your "same thing" verdict is correct. Clinicians' discomfort is psychological, not ethical.  
  - **High-dose morphine**: Both principles agree it’s impermissible—**you should probably give up this gut feeling** if you want consistency.  

  ---

  ### **Predictions for Your Cases**  
  1. **Ventilator Reallocation During Surge**:  
     - *Pathology Trigger*: **Impermissible**. Withdrawing actively exploits Patient A’s pathology to benefit B.  
     - *Intent/Agency*: **Permissible** if the intent is fair allocation (not killing A), and death is from A’s underlying condition.  

  2. **Closed-Loop Propofol Controller**:  
     - *Pathology Trigger*: **Conditional**. If death is from the disease (e.g., multi-organ failure), fine. If from propofol overdose, not fine.  
     - *Intent/Agency*: **Permissible** if the protocol’s *intent* is comfort (not euthanasia), and clinicians are monitoring for safety.  

  ---

  ### **Recommendation**  
  **Use the *Intent/Agency Principle* for consistency with your strongest intuitions.** It:  
  - Explains the morphine double effect (without the term).  
  - Handles autonomy cases (spinal injury patient).  
  - Clarifies system dilemmas (allocation/algorithms = agency lies with designers/protocols).  
  - Forces you to confront intent in tough calls (e.g., reallocation isn’t *murder* if intent isn’t to kill).  

  **Trade-off:** You’ll need to accept that:  
  - Feeding tube removal is ethically identical to vent withdrawal.  
  - High-dose morphine *must* be off-limits.  
  - "Feeling worse" about active withdrawal vs. withholding is psychological, not ethical.  

  For your committee: Frame it as **"design specs" for ethical decisions**:  
  ```  
  if (INTENT == RELIEVE_SUFFERING || RESPECT_AUTONOMY)  
     && (CAUSAL_CHAIN == PATHOLOGY)  
     && (AGENCY != DIRECT_CAUSE_OF_DEATH)  
  then: permissible  
  ```  
  This passes all your cases except the drowning cousin (intent: inheritance ≠ relief/autonomy).
