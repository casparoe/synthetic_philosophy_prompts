prompt: |-
  Me and two friends ended up in a proper argument after seeing a new biopic and I need someone to referee, because I honestly can't tell who's winning. (I'm making the film up — it's a stand-in for the general problem.)

  The film is called Salt Year, about Ivy Thornton, a real labor organizer from the 1930s. The scene we fought about: Ivy leaves her eight-year-old daughter alone for a week during a factory occupation. It never happened. The director has said in interviews that Ivy did neglect her family and that the scene is emotionally true. Key detail: every line of dialogue in the scene is taken verbatim from Ivy's own letters, rearranged and put in that situation. Also relevant: the film merges three of Ivy's real colleagues into one composite character, and it's already being shown in schools as basically the only thing kids encounter about her. Ivy's granddaughter has publicly objected.

  Marisol: Look, Ivy isn't harmed, she's dead, I grant that. The wrong here is to the living. The film edits what we can collectively remember. A vivid film image occupies the same mental slot as a memory and it's way stickier than a footnote, so the fiction doesn't sit beside the truth, it overwrites it — she calls this recollective capture. Showing it in schools makes it the default memory for a whole generation.

  Grant: Every biography compresses. Two hours can't hold forty years; any film invents dialogue, merges minor characters, moves events around. Once you accept any of that, accuracy can't be the thing doing the work, it's just degree talk. And empirically films push people toward the record: this one has sold more books about Ivy than anything in twenty years. On the memory worry it might be net positive.

  Marisol: Compression and attribution are different in kind. Merging three colleagues is compression — though notice it also quietly deletes real junior colleagues, mostly women, and hands their work to a fictional stand-in. Inventing the abandonment is different: it attributes a morally loaded, character-implicating act to a named real person. And the letters thing makes it worse, not better. She calls it quotation laundering: every sentence is authentic Ivy, and that's exactly what lets a fabricated scene borrow her own voice as a witness against her.

  Grant: The composite also *protects* people — you can show a pattern without accusing a named individual. And the scene isn't arbitrary: documented neglect exists, just not that week. If you can't dramatize a pattern you can only ever make a documentary, and almost nobody watches those, so Ivy stops mattering to anyone at all. Emotional truth is a real thing even if you can't falsify it — otherwise you're banning most historical drama ever made.

  Marisol: Emotional truth is unfalsifiable, which is why it conveniently licenses whatever plays well. And there's an obvious out that filmmakers refuse: change the names. A thinly veiled version gets you all the emotional truth and costs nobody's memory. Insisting on the real name means they want the borrowed-name premium — the authority of nonfiction plus the freedom of fiction. And her standard isn't documented-or-forbidden: it's don't show a named real person performing an invented act that a reasonable viewer would read as reflecting on her character, unless there's record-level reason to think she did something relevantly like it.

  Grant: That last clause is where all the action is, so it's just my degree talk with extra steps. Also, changing the names helps less than it sounds: audiences know who it's about, and it removes accountability — a named biopic can be checked and fought over in public. What the fictional version loses is the film as a real act of reckoning with an actual person.

  Marisol: Not a veto for the family, then, but standing — the descendants are the only continuing stakeholders, so at minimum their objection flips the burden of proof onto the filmmaker.

  Grant: Her distress is real but the film isn't a eulogy, and families dont get a veto over history.

  Can you go move by move and rate each from clearly wrong to clearly right with a sentence or two each, then say who's more right overall and what both of them are missing? Two things I specifically want handled. First: Grant says Marisol's three coined ideas — recollective capture, quotation laundering, the borrowed-name premium — are just labels for a gut feeling. Are any of them load-bearing, or are they relabelings? Second: give a real answer to the compression argument. If no principled line can be drawn between compression and fabrication, does Marisol's position collapse into no biopics ever, and if it does, is that actually a bad outcome? Also please don't just wheel out dead people can't be harmed — she already conceded it, that's why the argument moved.
reasoning: |-
  Okay, let me unpack this biopic ethics debate. The user presents a nuanced argument between Marisol and Grant about historical accuracy in "Salt Year," specifically focusing on fabricated scenes and composite characters. Both sides raise valid points that need careful evaluation.

  Marisol's core concerns center on three coined concepts:
  - Recollective capture: The idea that vivid film images overwrite historical memory, especially dangerous in educational contexts. This isn't just labeling - it describes a documented cognitive phenomenon where media shapes collective recall.
  - Quotation laundering: Using authentic quotes in fabricated contexts to lend false credibility. This goes beyond compression by weaponizing the subject's own words against them.
  - Borrowed-name premium: Exploiting the authority of nonfiction while enjoying fiction's liberties. The naming choice directly impacts real reputations.

  Grant's compression defense has merit but limitations:
  - While all biopics compress, merging three colleagues isn't neutral - it erases actual marginalized contributors. 
  - The leap from "documented neglect exists" to inventing a specific abandonment scene crosses into fabrication, not compression. 
  - His "net positive" argument (increased book sales) doesn't address the ethical violation of misrepresentation.

  On the key sticking points:
  - Emotional truth can't justify falsifying record - otherwise it becomes a free pass for any dramatization. 
  - Changing names isn't perfect but does mitigate harm by decoupling fiction from real people. 
  - Descendants' objections should carry weight as ongoing stakeholders, without granting veto power.

  The user's specific requests are addressed by:
  1) Showing how Marisol's terms identify concrete mechanisms beyond gut feelings. 
  2) Drawing a clear line between acceptable compression (time/character consolidation) and unacceptable fabrication (inventing defining actions). 
  3) Rejecting the false choice between "anything goes" and "no biopics" - there's middle ground where filmmakers maintain integrity while dramatizing history.

  What both miss: The solution space between documentary purity and fictionalized biography - like explicit framing devices or post-film fact-checking that preserves engagement without deception. The ethical burden increases exponentially when positioning a film as educational material.
answer: |-
  Here's a move-by-move analysis, followed by the overall verdict and handling of your specific requests:

  ### Move-by-Move Rating
  1.  **Marisol: "Recollective capture" (Overwriting memory)**  
      *Rating: Clearly Right.*  
      Cognitive science supports that vivid media shapes memory ("misinformation effect"), especially in education. Biopics *do* become primary historical references for many.  

  2.  **Grant: "Every biography compresses... it's just degree talk"**  
      *Rating: Partially Right but Overly Simplistic.*  
      Compression is necessary, but Grant ignores that **kind** matters. Merging minor characters is different in ethical weight than fabricating a defining, character-impugning act for a named individual.  

  3.  **Marisol: "Compression vs. Attribution / Quotation laundering"**  
      *Rating: Clearly Right.*  
      Fabricating a specific act of abandonment (using Ivy's own words!) *is* qualitatively different from merging colleagues. It creates a false, damaging "memory" tied to Ivy’s name. Quoting her letters in this false context *is* deceptive authenticity.  

  4.  **Grant: "Composite protects people / Scene isn't arbitrary"**  
      *Rating: Half Right, Half Wrong.*  
      Composites *can* protect individuals, but here it **erases real women** (wrong). While neglect is documented, inventing **this extreme act** (a week-long abandonment) crosses into fiction that defines her character unfairly.  

  5.  **Marisol: "Emotional truth licenses whatever plays well. Change the names!"**  
      *Rating: Mostly Right.*  
      "Emotional truth" *is* often a shield for distortion. Changing names **is** a viable ethical solution (e.g., *The Social Network* vs. Zuckerberg). Grant underestimates how naming invites literal historical association.  

  6.  **Grant: "Changing names helps less than it sounds... removes accountability"**  
      *Rating: Partially Right but Misguided.*  
      Audiences *might* guess, but naming makes distortion **official history**. "Accountability" via public debate is weaker than the harm of cementing falsehoods. A fictionalized account *can* still reckon with themes without hijacking a real person’s legacy.  

  7.  **Marisol: "Descendants have standing; objection flips burden of proof"**  
      *Rating: Clearly Right.*  
      Descendants are uniquely impacted stakeholders. They shouldn’t have veto power, but their distress **demands justification** from the filmmaker beyond artistic preference. Ignoring this dismisses ongoing human harm.  

  8.  **Grant: "Film isn't a eulogy; families don't get a veto over history"**  
      *Rating: Partially Right but Dismissive.*  
      Families shouldn’t control history, but a **fabricated scene** isn’t "history"—it’s creative license using a real name. Grant conflates historical interpretation with invention.  

  ---

  ### Overall Verdict
  **Marisol is more right.** She correctly identifies the core ethical violation: fabricating a severe, character-defining act for a named historical person (using their own words!) without a documented basis, especially when it shapes public memory and harms living stakeholders. Grant’s "compression is inevitable" argument fails to distinguish between necessary condensation and harmful misrepresentation. However, Marisol understates the value of dramatization in making history engaging.

  ### What Both Are Missing
  -   **The Power of Framing:** Neither discusses whether the film explicitly labels inventions or uses disclaimers. Transparency mitigates harm.
  -   **Alternatives to Full Fiction:** Could the neglect theme be shown through documented events or original characters? The "change names" solution deserves serious consideration.
  -   **Educational Responsibility:** Since it’s shown in schools, the ethical bar should be *higher*. Historical distortion here isn’t just art—it’s pedagogy.

  ---

  ### Handling Your Specific Requests
  1.  **Are Marisol’s coined terms "just labels"?**  
      **No, they’re load-bearing concepts:**  
      - **Recollective capture:** Identifies a real psychological/cultural phenomenon—media imagery overwriting factual memory. Crucial for understanding *why* this distortion matters beyond "it’s inaccurate."  
      - **Quotation laundering:** Highlights a specific deceptive practice: using genuine quotes to validate a fictional context. This exploits trust in primary sources.  
      - **Borrowed-name premium:** Names the filmmaker’s unearned benefit—leveraging the gravity of a real name while evading nonfiction constraints. These aren’t gut feelings; they’re frameworks for analyzing harm.  

  2.  **Does Marisol’s position collapse into "no biopics ever"?**  
      **No, and here’s the principled line:**  
      - **Acceptable:** Compression of timelines, merging *minor* characters, reconstructing plausible dialogue for documented events, thematic condensation.  
      - **Unacceptable:** Inventing *specific, consequential actions* that never occurred and attributing them to a named person, especially if they imply moral failing without **strong evidence of analogous behavior**.  
      **Why it doesn’t collapse:** Marisol’s standard allows biopics if they avoid attributing invented, character-defining acts to real people *or* change names. The "bad outcome" isn’t no biopics—it’s biopics that prioritize drama over integrity when co-opting real identities. Documentaries aren’t the only alternative; ethical dramatization exists.  

  **Final Takeaway:** The real harm isn’t to the dead Ivy, but to history, her legacy, her descendants, and the public’s understanding. Filmmakers using real names must tread carefully: documented patterns can be dramatized, but fabricating extreme, unsubstantiated acts crosses a line—especially when presented as truth to students. Marisol’s framework offers tools to navigate this; Grant’s "all compression is equal" ignores the stakes.
