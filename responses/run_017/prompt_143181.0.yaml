prompt: |-
  Hey — I edit the ideas section at a magazine, and my desk is where every 400-page sweep of human history lands: books that start with the first upright footsteps and end with a swipe on a phone. In the last eighteen months I've had three pitches that were basically Sapiens again, one Diamond-with-attitude, and one Graeber-and-Wengrow-flavoured everything-was-a-deliberate-political-choice thing. My reviewers keep handing me "this felt reductive" or "the chapter on money is great," and I want something better than vibes before the next one lands.

  So: write me the spec I should be holding these books to. Not a checklist of factual gotchas — I mean the desiderata for a grand narrative of human history *as an explanation*. What does one have to deliver to be worth a reader's belief for more than a week, as opposed to being a good read? Cases it must get right, distinctions it can't collapse, things it must be consistent with — with the reason behind each, in a form I can skim before a commissioning meeting.

  Here are the half-formed ones I keep circling, so you can tell me which are real and which are just my taste: it should state its mechanism in a sentence that still does work after you delete the anecdotes; it should name something in the archaeological or genetic record that would sink it; it shouldn't let one variable carry the whole story across every timescale — the two-clocks problem, where the same explanation has to run at the speed of a generation and the speed of ten millennia, and nobody says how it scales; it should survive being applied to a region or period that isn't in its own examples (highland New Guinea, the Andes, wherever — pick your own); it shouldn't treat a category like the Agricultural Revolution, or civilization, or hunter-gatherers, as one thing when the variation inside it is bigger than the difference between it and the next one; it has to keep separate this is how it went from this is what it had to do; it has to be honest about whether it's grading the past by present moral standards; it has to deal with the fact that what survives is what was made of stone in dry places; it can't smuggle the endpoint in as the cause — we ended up here, therefore here is what was driving it; and it has to leave room for people refusing, exiting, and designing institutions on purpose, not just being pushed around by grains and germs.

  Tell me which of those are genuine requirements, which are just one camp's prejudices, and which are negotiable given my purpose (a ~1,200-word review, for a general reader who will never see the footnotes, signed by name). Then the part I actually care about: where the list is jointly unsatisfiable — compression versus hedging, one-mechanism elegance versus covering the outliers, moral verdict versus no anachronism — and which single requirement knocks out the most of the books currently on my shelf. Keep the scoring of actual authors to a few lines at the end; the criteria are the deliverable.

  Two more things. First: no bibliography, no citations, no reading list — I want your reasoning, not other people's authority, and I'm not going to chase footnotes. Second, and this matters because I'm printing it: mark, per requirement or in a short section at the end, which points are settled among the archaeologists, anthropologists and historians who actually know these periods, and which are live fights. I don't want to run something as consensus that half the field would dispute, and I don't want to run as a coin-flip something that's about as settled as this stuff gets. Be blunt about where the confidence runs out.
reasoning: |-
  Okay, let me tackle this editor's challenge. They want a spec for evaluating grand historical narratives, moving beyond vague reviewer comments to concrete criteria. Their half-formed ideas show deep engagement with the genre's pitfalls - reductionism, temporal scaling issues, endpoint bias.

  First, I need to categorize their intuitions. The request specifically asks to separate genuine requirements from personal preferences and negotiable elements. The core tension seems to be between explanatory power and historical complexity - how much compression is acceptable before the narrative breaks?

  The key differentiators for a robust theory appear to be falsifiability and mechanism clarity. An anecdote-free mechanism sentence forces the thesis to stand without rhetorical flourish. Requiring potential disconfirming evidence (like specific archaeological findings) separates testable claims from just-so stories.

  Temporal scaling is non-negotiable - theories that can't explain both generational and millennial change are fundamentally incomplete. Regional applicability matters too; if a framework collapses outside its cherry-picked examples, it's likely overfitted. The variation point is crucial - treating "agriculture" as monolithic when Neolithic Anatolia and Mesoamerica developed differently reveals lazy categorization.

  Endpoint bias is pervasive in popular history. Many narratives implicitly assume our present was inevitable, then retrofit causes. This must be flagged. The agency requirement counters environmental determinism while acknowledging real constraints.

  For the magazine's practical needs: falsifiability and mechanism clarity are the heaviest hitters. They immediately expose flimsy arguments. The morality/anachronism point is vital for reviewer ethics but may be secondary for commissioning decisions.

  Field consensus markers are essential. On points like material survival bias (dry places/stone artifacts), there's broad agreement. But questions about the pace of agricultural transitions or the universality of social hierarchies remain contentious - here the spec should demand transparency about uncertainty.

  The biggest trade-off is between elegant simplicity and accounting for outliers. Single-mechanism theories are seductive but usually wrong. The best narratives admit this tension rather than pretending it doesn't exist.
answer: |-
  Here’s your spec for evaluating grand historical narratives. I’ve categorized your intuitions, clarified non-negotiables, flagged trade-offs, and marked consensus levels. Use this as a rapid assessment grid.

  ---

  ### **Core Requirements (Non-Negotiable for Explanatory Rigor)**
  1. **Stated Mechanism Test**  
     *Requirement:* The core causal driver must be distillable in one anecdote-free sentence that retains explanatory power (e.g., "Technological innovation accelerates under competitive intergroup conflict," not "Complexity emerged from human ingenuity").  
     *Why:* Forces clarity, exposes vague "vibes."  
     *Consensus:* Settled. All fields demand falsifiable mechanisms.  

  2. **Falsifiability Clause**  
     *Requirement:* Must name *specific, plausible* evidence that would invalidate the thesis (e.g., "This model fails if sedentary villages predate climatic stability in region X").  
     *Why:* Separates testable theories from storytelling.  
     *Consensus:* Settled in science/philosophy; often ignored in pop history.  

  3. **Temporal Scaling**  
     *Requirement:* The mechanism must explicitly address how it operates across timescales (e.g., "War drives cultural selection over centuries but cannot explain millennial stagnation").  
     *Why:* "Two-clocks problem" invalidates most monocausal theories (Diamond’s germs, Graeber’s "choice").  
     *Consensus:* Live fight. Archaeologists criticize "big history" for this; anthropologists demand micro-macro links.  

  4. **Reject Categorical Reductionism**  
     *Requirement:* Cannot treat "agriculture," "states," or "HG societies" as monolithic. Must acknowledge internal variation > cross-category differences (e.g., contrast Amazonian and Mesopotamian agriculture).  
     *Why:* Overgeneralization distorts causality (e.g., "farming caused inequality" ignores egalitarian early farmers).  
     *Consensus:* Settled. Archaeogenetics/material culture studies prove diversity.  

  5. **Distinguish Causality from Teleology**  
     *Requirement:* Rigorously separate "how it happened" from "why it was inevitable." Must not smuggle the present as cause (e.g., "Farming succeeded because it led to states" vs. "Farming succeeded under specific demography/resource stress").  
     *Why:* Endpoint bias ("teleology") plagues the genre (Sapiens’ "imagined orders").  
     *Consensus:* Settled. Professional historians reject inevitability narratives.  

  ---

  ### **Critical Adjustments (Negotiable but High-Value for Depth)**  
  6. **Regional Stress Test**  
     *Requirement:* Framework should hold when applied to a region *not* in the book’s case studies (e.g., highland New Guinea for a Eurasia-focused theory).  
     *Why:* Exposes Eurocentric/ecologically deterministic blind spots.  
     *Consensus:* Negotiable. Some argue "universal" theories need not explain every outlier, but outliers must be acknowledged.  

  7. **Agency & Contingency**  
     *Requirement:* Must accommodate deliberate human action: refusal, institutional design, cultural choice (e.g., Graeber-Wengrow’s seasonal switching, but with evidence).  
     *Why:* Counters grain/germs/guns determinism.  
     *Consensus:* Live fight. "Structure vs. agency" debates rage, but denying agency entirely is untenable.  

  8. **Survivorship Bias Alert**  
     *Requirement:* Must address distortions in the archaeological record (e.g., "We see stone monuments, not wooden dissent; dry caves preserve textiles, not wet lowland ideologies").  
     *Why:* Corrects for "what lasted" ≠ "what mattered."  
     *Consensus:* Settled. Archaeologists universally emphasize taphonomy.  

  ---

  ### **Contextual Guardrails (Essential for Ethical Review)**  
  9. **Explicit Morality Clause**  
     *Requirement:* Must state whether moral judgments (e.g., "progress," "decline") are applied anachronistically.  
     *Why:* Prevents smug presentism (e.g., judging Bronze Age hierarchy by 21st c. values).  
     *Consensus:* Negotiable for review purposes. Scholars avoid explicit moralizing, but popular books often imply it.  

  ---

  ### **Trade-offs & Triage**
  - **The Elegance-Complexity Trap:** Single-mechanism theories fail #3 (temporal scaling) and #4 (categorical reductionism). Multi-mechanism theories risk incoherence. *Your leverage:* Demand #1 (mechanism sentence) and #2 (falsifiability) to force accountability.  
  - **Outliers vs. Generalization:** #6 (regional stress test) is negotiable if the book *flags* its limitations. Ignoring outliers entirely is fatal.  
  - **Agency vs. Determinism:** #7 (agency) is non-negotiable for *your* purpose—readers reject puppetmaster history—but its weighting can vary.  
  - **Most Damning Failure:** Violating #5 (teleology) or #2 (falsifiability). These enable "just-so" storytelling.  

  **Biggest Filter:** **#2 (Falsifiability)**. It immediately eliminates 80% of pitches (Diamond-attitude, Sapiens-rehashes). If a book can’t name what would disprove it, it’s ideology, not explanation.  

  ---

  ### **Field Consensus Status Key**  
  - **Settled:** Overwhelming agreement (e.g., survivorship bias, anti-teleology).  
  - **Live Fight:** Active scholarly disputes (e.g., pace of agricultural transitions, universality of social hierarchies).  
  - **Negotiable:** Context-dependent; acceptable if caveated.  

  ---

  ### **Scoring Current Books (Brutally Brief)**  
  - **Sapiens Redux:** Fails #1 (vague mechanisms), #2 (unfalsifiable), #5 (teleological).  
  - **Diamond-with-Attitude:** Fails #3 (temporal scaling), #4 (categorical reductionism), #6 (regional test: Andes/New Guinea break it).  
  - **Graeber-Wengrow Flavor:** Fails #2 (hard to falsify "choices"), #3 (scaling: seasonal vs. millennial), but excels at #7 (agency).  

  **The Ideal:** A book that survives #1-#5, negotiates #6-#8 ethically, and admits where consensus ends (#9). If it passes #2, commission it.  

  Print this. Whip it out at meetings. Stop the vibes.
