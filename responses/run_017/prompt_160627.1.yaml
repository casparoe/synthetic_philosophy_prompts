answer: |-
  ### Causal Annotation Manual: Decision Tree

  #### Preamble (for Coders)
  This manual helps annotate causal claims about the 1902 dam disaster. For each passage, answer questions about its causal structure (Field 1) and which cause it selects as *the* cause (Field 2). Base answers solely on the text and your case files (A–F). No philosophy background is needed—use the calibration cases as anchors. The tree has 8 nodes. At each node, answer YES, NO, or UNSURE. UNSURE means the text is ambiguous; follow both branches and resolve later. Field 2 records if a specific cause is highlighted (e.g., "the real cause") or if a non-causal item sets the frame (e.g., fixed options/contrasts). Frame-setting is rare: only code it if the text explicitly treats the item as non-causal but essential context. Begin at Node 1.

  ---

  #### Decision Tree Nodes

  1. **Does the passage treat an event as a cause even if, had it been absent *and all else equal*, the outcome would still have occurred?**  
     (Calibration: Case A [YES] vs. Case D [NO])  
     - YES → Node 2  
     - NO → Node 4  
     - UNSURE → Note ambiguity; proceed to Node 2 and Node 4 separately.  

  2. **Is the outcome described so finely (e.g., timing, location, manner) that the causes clearly produced *distinct aspects*?**  
     (Calibration: Case F [YES—finer grain shows charges acted separately] vs. Case A [NO—coarse grain treats charges as simultaneous])  
     - YES → Leaf 3 (Asymmetric Production)  
     - NO → Leaf 1 (Symmetric Overdetermination)  
     - UNSURE → Node 3  

  3. **Does the passage call something a cause *because it guaranteed the outcome*, even if it didn’t operate?**  
     (Calibration: Case B [YES—south charge is a cause for this reason])  
     - YES → Leaf 2 (Guarantor Cause)  
     - NO → Leaf 1 (Symmetric Overdetermination)  

  4. **Does the passage name a cause that was *insufficient alone* and only worked in combination?**  
     (Calibration: Case C [YES—gate alone insufficient] vs. Case A [NO—each charge sufficient alone])  
     - YES → Node 5  
     - NO → Node 6  

  5. **Does the passage select *one* such factor as *the* cause, ignoring others in the set?**  
     (Calibration: Case C [YES—blames gate alone])  
     - YES → Leaf 4 (Selective INUS)  
     - NO → Leaf 5 (INUS Complex)  

  6. **Does the passage call an *absence* (e.g., not acting) or *omission* a cause?**  
     (Calibration: Case D [YES—watchman’s sleep] vs. Case E [NO—petition is an action])  
     - YES → Node 7  
     - NO → Node 8  

  7. **Does the passage imply the absence *changed the outcome*? (e.g., "Had it been present, things would differ.")**  
     (Calibration: Case D [YES—awake watchman would have prevented disaster])  
     - YES → Leaf 6 (Difference-Making Absence)  
     - NO → Leaf 7 (Non-Difference Absence)  

  8. **Does the passage name a cause that, by its own account, made *no difference* to the outcome?**  
     (Calibration: Case E [YES—petition changed nothing] vs. Case D [NO—sleep made a difference])  
     - YES → Leaf 8 (Anti-Realist Selection)  
     - NO → Leaf 6 (Strict Difference-Making)  

  ---

  #### Leaves (Causal Structures for Field 1)
  Each leaf is a "view" the passage commits to. Record the leaf number and its statement.  

  1. **Symmetric Overdetermination**  
     - Commitment: Multiple causes are independently sufficient and operate identically; no need to describe the outcome finely.  
     - Pressed by: Case A (coarse grain ignores timing differences).  

  2. **Guarantor Cause**  
     - Commitment: A backup that didn’t operate is a cause because it ensured the outcome.  
     - Pressed by: Case B (south charge never fired but "guaranteed" success).  

  3. **Asymmetric Production**  
     - Commitment: Overdetermination dissolves under fine-grained description; causes form a sequential chain.  
     - Pressed by: Case F (charges acted at distinct times to breach then widen).  

  4. **Selective INUS**  
     - Commitment: An insufficient/non-redundant part of a sufficient set is singled out as *the* cause.  
     - Pressed by: Case C (gate blamed alone; ignores reservoir/debris).  

  5. **INUS Complex**  
     - Commitment: A cause is an insufficient/non-redundant part of a sufficient set; the passage does not elevate one.  
     - Pressed by: (Hypothetical) Case C if it listed all three factors equally.  

  6. **Difference-Making Absence**  
     - Commitment: Omissions are causes only if their presence would change the outcome.  
     - Pressed by: Case D (sleep caused because an awake watchman would have acted).  

  7. **Non-Difference Absence**  
     - Commitment: Omissions are causes even if they made no difference.  
     - Pressed by: (Gap—no case; see "Gaps" section).  

  8. **Anti-Realist Selection**  
     - Commitment: What counts as *the* cause depends on narrative/interest, not facts.  
     - Pressed by: Case E (petition is a cause in narratives despite changing nothing).  

  ---

  #### Field 2: Causal Selection and Frame-Setting
  - **Causal Selection**: If the passage ranks causes (e.g., "the decisive cause: X"), record X. If none, record "none."  
  - **Frame-Setting**: If an item is **not a cause** but fixes context (e.g., "The petition defined options, though it changed nothing"), record "frame-setting: [item]."  
    - *How to earn it*: The text must explicitly (a) deny the item is causal *and* (b) state it sets options/contrasts.  
    - *Avoid wastebasket*: Reject if the item passes any causal test (e.g., Nodes 1, 4, 6) or if the text calls it causal.  
  - **Split Verdicts**:  
    - Field 1 and Field 2 can differ (e.g., Field 1 = Leaf 6, Field 2 = "gate" as *the* cause).  
    - If coders agree on Field 1 but disagree on Field 2, check if it’s a *verbal dispute*:  
      - Same counterfactuals, different event descriptions (e.g., "gate" vs. "gate left open") → Flag as verbal.  
      - Different contrast classes (e.g., "gate" [contrast: closed] vs. "engineer" [contrast: attentive]) → Flag as verbal.  
      - Otherwise → Substantive disagreement (e.g., text ambiguously ranks causes).  

  ---

  #### Gaps and Collisions
  **Gaps (Unexplored Logical Space)**:  
  1. **Non-difference absence as cause without narrative role** (e.g., blaming sleep even if awake watchman couldn’t prevent disaster).  
     - *Diagnosis*: Unattractive—severs causation from difference-making.  
  2. **Symmetric overdetermination with no possible finer description** (e.g., causes truly identical; can’t apply Node 2).  
     - *Diagnosis*: Unexplored—no calibration case forces this.  
  3. **A cause that is necessary/sufficient but rejected due to moral bias** (e.g., "The saboteur isn’t a cause because they were coerced").  
     - *Diagnosis*: Incoherent—confuses causation with blame.  

  **Collisions (Indistinguishable Leaves)**:  
  - **Leaf 2 (Guarantor Cause) vs. Leaf 8 (Anti-Realist Selection)** in Case B: Both call the south charge a cause.  
    - *Separator Needed*: "Does the text appeal to *guarantee* (Node 3) or *narrative* (Node 8)?"  
  - **Leaf 4 (Selective INUS) vs. Leaf 8 (Anti-Realist Selection)** in Case C: Both might blame the gate alone.  
    - *Separator Needed*: "Does the text imply the gate *made a difference* (Leaf 4) or ignore difference-making (Leaf 8)?"  

  ---

  #### Resolving Inter-Coder Disagreement
  1. **Compare node answers**: Identify the first node where answers diverge. Re-read the passage and anchor case together.  
  2. **Ambiguity**: If UNSURE was used, discuss if the text better fits YES/NO using the calibration case.  
  3. **Field 2 disputes**: If selection/frame-setting diverges:  
     - Check if the text explicitly ranks or contrasts causes.  
     - For frame-setting, verify the text explicitly marks the item as non-causal.  
  4. **Escalate**: If unresolved, consult the project director with the passage and node log.  
  5. **Final output**: Record both coders’ paths if irreconcilable; the database flags such passages for review.  

