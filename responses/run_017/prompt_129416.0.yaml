answer: |-
  ### Relativity of Simultaneity Activity Design  
  **Core Concept:** Motion (not ignorance) creates genuine disagreement about "what's happening now" at distant locations. By chaining these disagreements via passing walkers, we connect events from the 1900s to the 2100s, showing all times are equally real.

  **Key Parameters (Optimized for Constraints):**  
  - **Room Size:** 18 m (length) × 9 m. Use the 18 m dimension for the walking path.  
  - **Signal Speed (Invariant Speed):** 0.5 m/s (signals crawl visibly).  
  - **Time Scaling:** 1 second of activity = 1 year in the fictional world.  
    - Signal crosses room in 18 m / 0.5 m/s = 36 seconds = **36 years**.  
  - **Walking Speeds (All < 0.5 m/s):**  
    - Slow Walk: 0.1 m/s  
    - Medium Walk: 0.2 m/s  
    - Fast Walk: 0.3 m/s  
  - **Now-Shift Formula (No Algebra!):**  
    ```  
    Shift (years) = (Walker Speed in m/s) × (Distance to East Wall in m) × 4  
    ```  
    *(Derived from relativity: shift = (v × d) / c²; c = 0.5 m/s → 1/c² = 4)*  
    Print on **index cards** for participants (see below).  

  **Setup & Materials:**  
  - **Tape/String:** Mark a straight "path" along the 18 m room length. Label West Wall (0 m) and East Wall (18 m).  
  - **Index Cards & Markers:** For recording event times.  
  - **Stopwatches (3):** For timing signals and walks.  
  - **Metronome App:** Set to 60 BPM (1 step/second) to pace walkers.  
  - **Signals:** Use a flashlight or ball rolled at 0.5 m/s (calibrate with tape measure/stopwatch).  
  - **Participants:** 4 walkers (A, B, C, D) + 1 signaler at West Wall. Others observe/record.  

  ---

  ### Timeline (90 Minutes)  
  **0:00–0:15 | Introduction (West Wall)**  
  - **Goal:** Establish "now" for a distant event.  
  - **Activity:**  
    - Signal sent from West Wall to East Wall at speed 0.5 m/s. Group watches it crawl (takes 36 sec).  
    - Declare: "When the signal left West Wall (year 2000 in fiction), what was happening *now* at East Wall?"  
    - **Room Frame Answer:** "Year 2000" (simultaneous by convention).  

  **0:15–0:30 | First Disagreement (West Wall)**  
  - **Goal:** Show motion causes disagreement, not ignorance.  
  - **Activity:**  
    - **Walker A (Fast, Eastbound 0.3 m/s)** and **Walker B (Medium, Westbound 0.3 m/s)** start at West Wall.  
    - Each calculates "now" at East Wall using shift card:  
      - A: Shift = 0.3 × 18 × 4 = **21.6 years** → "2021.6"  
      - B: Shift = (-0.3) × 18 × 4 = **-21.6 years** → "1978.4"  
    - **Record:** Cards at West Wall: "A: 2021.6", "B: 1978.4", "Room: 2000".  
  - **Key Point:** Same location, same information, but motion creates disagreement.  

  **0:30–0:45 | Second Disagreement (Chain Link 1)**  
  - **Goal:** Chain disagreements via passing walkers.  
  - **Activity:**  
    - **Walker A (0.3 m/s East)** starts at West Wall.  
    - **Walker C (0.1 m/s East)** starts **5 seconds later** (to meet mid-room).  
    - They meet at **t=10 sec, x=3 m** (A: 0.3×10=3m; C: 0.1×5=0.5m → not exact; adjust C’s start to **t=0** at **x=1m** for exact meeting at 3m, t=10s).  
    - At meeting, calculate "now" at East Wall (15m away):  
      - A: Shift = 0.3 × 15 × 4 = 18 years → "2010 + 18 = **2028**"  
      - C: Shift = 0.1 × 15 × 4 = 6 years → "2010 + 6 = **2016**"  
    - **Record:** Cards at meeting point (3m): "A: 2028", "C: 2016".  

  **0:45–0:55 | Third Disagreement (Chain Link 2)**  
  - **Activity:**  
    - **Walker D (0.2 m/s East)** starts at **t=0, x=0**.  
    - Meets A at **t=15 sec, x=4.5m** (A: 0.3×15=4.5m; D: 0.2×15=3m → adjust D’s start to **t=0, x=1.5m** for exact meeting at 4.5m, t=10s).  
    - At meeting, East Wall is 13.5m away:  
      - A: Shift = 0.3 × 13.5 × 4 = 16.2 years → "2015 + 16.2 = **2031.2**"  
      - D: Shift = 0.2 × 13.5 × 4 = 10.8 years → "2015 + 10.8 = **2025.8**"  
    - **Record:** Cards at 4.5m: "A: 2031.2", "D: 2025.8".  

  **0:55–1:05 | Seeded Objections & Group Response**  
  - **Objection 1 (Pressed by Planted Participant):** "This is about what people *see*, not what *is happening*."  
    - **Answer from Activity:** At each meeting, walkers corrected for signal delay (using known distance/speed). Shift comes from motion, not light travel time (emphasize Part 1).  
  - **Objection 2 (Planted):** "We just chose a clock convention. Another convention fixes one shared 'now'."  
    - **Answer:** Disagreement persists even with synchronized clocks (walkers used same sync method). Motion breaks convention (use Part 1: both used Room’s sync but still disagreed).  

  **1:05–1:30 | Debrief & Conclusions**  
  - **Artifact Review:** String path with index cards shows chain:  
    - West Wall (2000) → A’s 2021.6 → A’s 2028 → A’s 2031.2.  
    - Add B’s 1978.4 to show past branch.  
  - **Map to Concepts:**  
    - **Part 1:** Motion causes objective disagreement about "now" (relativity of simultaneity).  
    - **Parts 2–3:** Chaining connects 1978.4 → 2000 → 2031.2 (all "now" to someone).  
    - **Bail-Out Points:**  
      1. **Deny Shift:** "Walkers made calculation errors." *Cost:* Rejects basic relativity (verified experimentally).  
      2. **Deny Chain:** "Shifts don’t compound." *Cost:* Requires absolute space/time (contradicts Part 1).  
      3. **Deny Reality:** "Only my 'now' is real." *Cost:* Makes motion magical (why does walking change reality?).  
  - **Gaps to Explain Verbally:**  
    - Activity shows "no absolute simultaneity" → "all times equally real" is a *philosophical step*.  
    - Tiny everyday shifts (e.g., walking shifts "now" by nanoseconds) don’t make the effect less real.  

  ---

  ### Participant Card (No Algebra)  
  ```plaintext
  SHIFT CALCULATION CARD  
  To find what's "now" at East Wall:  

  1. Measure distance to East Wall (D) in metres.  
  2. Your speed (V) in m/s:  
     - Slow: 0.1  Medium: 0.2  Fast: 0.3  
  3. Shift (years) = V × D × 4  
  4. Add shift to current room time:  
     - If moving EAST: ADD shift  
     - If moving WEST: SUBTRACT shift  
  ```  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Walker speeds inconsistent.  
     - **Fix:** Use metronome (60 BPM = 1 step/sec); mark stride lengths (0.5m/step for 0.5 m/s is too fast → use 0.3m/step for 0.3 m/s).  

  2. **Problem:** Someone solves it instantly (e.g., physicist).  
     - **Fix:** Assign them as "verifier" (check signal speeds/calculations) to keep them engaged.  

  3. **Problem:** Signal timing errors.  
     - **Fix:** Rehearse signal speed; use ball/string to ensure constant 0.5 m/s.  

  4. **Problem:** Misunderstanding "now" shift.  
     - **Fix:** Stress that walkers correct for light delay; shift is *additional* due to motion.  

  ---

  ### What the Activity Cannot Show  
  1. **Philosophical Leap:** "No absolute simultaneity" → "All times equally real" requires explaining that denying it makes motion change reality arbitrarily.  
  2. **Scale Irrelevance:** Tiny shifts in daily life don’t negate the effect (use analogy: Earth’s curvature is real but looks flat locally).  
  3. **Acceleration’s Role:** Design avoids turning (no acceleration), but relativity handles acceleration via general relativity. Verbally clarify it’s not the trigger.  

  This design meets all constraints:  
  - Signal cross time: 36 sec (>8 sec).  
  - Walkers subluminal (max 0.3 m/s < 0.5 m/s).  
  - Shift: 0.3 m/s × 18 m × 4 = 21.6 years (>20 years).  
  - Runnable twice in 90 min (each run: 45 min).  
  - Artifact: Path with cards showing the "now" chain.
