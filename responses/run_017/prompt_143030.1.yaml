prompt: |-
  I've been arguing with a friend for the better part of a year about how much of the Gould–Lewontin spandrels critique actually landed, and since we've both agreed to score the argument with Brier scores rather than rhetoric, I want to force it into numbers. The claim I want your credence on is this: by 2050, the mainstream position in evolutionary biology and behavioural ecology will be that at least a third of the traits that are presented in textbooks and review articles as adaptations — traits whose presence in the population is explained by a history of selection for the function they now perform — are better explained as architectural byproducts, spandrels, or exaptations, in the sense of features that arise as necessary consequences of a body plan or of selection on something else, whatever their later co-option. I'll propose a resolution criterion so the number has teeth: take a stratified random sample of about a hundred flagship cases from current textbook and review literature, ask a few hundred researchers spread across subfields to commit, per case, to selection-for-current-function versus byproduct-or-exaptation as the best-supported explanation, and count the proposition as true if at least a third of the cases come out on the non-adaptive side of the midpoint. Tell me if that operationalisation is doing too much work, or if your number is substantially a number about how such a survey would go rather than about the biology. For what it's worth, I'm at about 0.45 and my friend is at about 0.12: she thinks the critique was a methodological point that the field absorbed decades ago, that the empirical claim behind it is basically dead, and that the surviving interest in spandrels is motivated reasoning by people who dislike adaptationist explanations of human behaviour.

  What I actually want is the decomposition, and I have opinions about which terms belong in it. First: I think the debate is three separable claims that get run together — that most traits are adaptations; that the best research strategy is to assume adaptation and go looking for the selective regime until you are forced to stop; and that a trait's presence is properly explained only by its selective history. Give me your probability that this taxonomy is the right way to carve the disagreement, and tell me which of the three the 1979 critique was really aimed at. Second, and this is the bit I keep coming back to: adaptive hypotheses seem to me to occupy a much larger and, crucially, much more adjustable region of hypothesis-space than architectural-constraint hypotheses do — you can almost always tweak the selective scenario to accommodate a recalcitrant datum, whereas a constraint story is brittle and usually predicts a specific geometry or a specific comparative pattern. Call that the flexibility asymmetry, and the corresponding Bayesian remedy a flexibility penalty or adaptability tax: a fair comparison between the two families of explanation should charge the adaptive hypothesis for the volume of hypothesis-space it occupies. Estimate the probability that the asymmetry is real and large, and, conditional on that, the probability that applying a serious version of the penalty would demote a third or more of the flagship cases. Third: we have much better instruments for detecting selection — comparative and phylogenetic methods, population-genetic signatures, experimental evolution — than we have for detecting constraint, so a high rate of failure-to-reject-an-adaptive-story may just measure instrument asymmetry rather than the world. Fourth, a term I'm unsure how to place: spandrel may be a residual rather than a positive explanatory category, a label for whatever is left when the adaptive story fails, in which case the proposition above may be true but shallow, or false but for a boring reason. And fifth, a separate term for whether the field's incentive structure would let the truth become consensus even if the critics were right: adaptive stories are publishable, negative and constraint-based results are much less so, and nobody gets a paper out of we looked and found no selective explanation.

  Give me a single headline number, then each term with a number and one line of justification, then the combination — and where the terms are logically dependent or would double-count if multiplied, say so rather than pretending they are independent. Then: which single term is your final number most sensitive to, which one are you least confident in, and what concrete result would move you most? My own candidate is a pre-registered adversarial audit of a hundred flagship cases, in which a funded team of critics gets a fixed period to devise and test a byproduct or constraint alternative for each case, with both sides committing in advance to what would count as refutation; I'd like to know what that audit would have to show, and in which direction, to shift your number by fifteen points or more. Finally, tell me where you think the gap between 0.45 and 0.12 most likely lives — which term, or which implicit assumption about what the proposition means, the two of us are probably disagreeing about. I've read the canonical material and its replies, so please don't summarise the debate, don't hedge with it depends what you mean by adaptation without then saying which reading you're pricing, and don't give me a reading list or citations; I want your own reasoning, in British English, with the numbers stated plainly.
reasoning: |-
  Okay, let me try to unpack this user's request. They're in a long-standing debate with a friend about the impact of the Gould-Lewontin spandrels critique, and they want to quantify their disagreement using Brier scores. The core proposition is whether by 2050, at least a third of traits currently presented as adaptations in textbooks will be seen as spandrels or exaptations. 

  First, I need to consider their operationalization: a survey of researchers on 100 textbook cases. The user is aware this might make the probability more about survey outcomes than biological truth, but they want the number anyway. Their own estimate is 0.45 while their friend is at 0.12 - quite a gap.

  The user wants a decomposed probability with five components. Let me think through each:

  1. Taxonomy validity: Are the three claims (most traits adaptive, adaptationist methodology, selective history as only explanation) truly separable? Gould-Lewontin were mainly attacking the methodology, in my view. I'd put high probability (0.8) that this taxonomy holds, as the distinctions seem robust.

  2. Flexibility asymmetry: This is crucial. Adaptive hypotheses do have more "wiggle room" than constraint-based ones. I think the asymmetry is real (0.7 probability) and substantial enough that applying a flexibility penalty would reclassify many cases (0.6 conditional probability). Combined, that gives about a 42% chance this mechanism alone could shift a third of cases.

  3. Instrument asymmetry: We're better at detecting selection than constraints. This likely inflates adaptive explanations (0.9 probability it's a factor). But is it severe enough to cause a 33% misclassification? Maybe 0.5 probability - so 45% joint probability here.

  4. Spandrels as residual category: If "spandrel" just means "not proven adaptation", then reaching 33% might be trivial but uninteresting. I think there's a 40% chance this is a major factor. 

  5. Incentive structure: Publication bias favors adaptive stories. High probability (0.8) this distorts the literature. Conditional on the critique being right, I'd say 70% chance incentives prevent consensus. That's about 25% of the path to the 33% threshold.

  Now combining these: They're not independent, so I can't just multiply. The taxonomy and flexibility asymmetry are foundational - if they're wrong, the whole proposition weakens. Instrument asymmetry and incentives act as amplifiers. The residual category issue could make the threshold easier to reach but less meaningful.

  My headline probability is 0.3. The biggest sensitivity is to the flexibility asymmetry - if new evidence showed adaptive hypotheses aren't actually that flexible, my number would drop sharply. Least confident about how the residual category factor plays out. 

  The gap between user and friend? Likely hinges on flexibility asymmetry and incentives. The user sees adaptive stories as too easy to defend, while their friend thinks the field has already corrected for this.

  For what would change my view: An adversarial audit showing critics can develop testable constraint alternatives for >40% of flagship cases would push me toward 0.45. If they struggled below 20%, I'd drop toward 0.15.
answer: |-
  Here's my decomposed probability assessment for your proposition, with British English phrasing and plain numbers. Headline credence: **0.30** (30%).

  ### Decomposition with Justifications & Dependencies
  1.  **Taxonomy Validity (0.80):**  
      Probability your 3-way carve-up (prevalence, methodology, exclusivity) is the correct framing. The 1979 critique primarily targeted the *methodology* (assume adaptation until forced to stop) and *exclusivity* (ignoring alternatives). Justification: The paper explicitly criticises the "adaptationist programme's" methodological imperialism and failure to consider alternatives, not merely the quantitative claim.  
      *Dependency: Foundational – if wrong, the entire proposition's framing weakens.*

  2.  **Flexibility Asymmetry Real & Large (0.70) + Penalty Demotes ≥1/3 Cases (0.60 | Asymmetry True):**  
      Joint probability for this path: **0.42** (0.70 * 0.60). Adaptive hypotheses *are* more flexible (e.g., inventing novel selective regimes, adjusting fitness landscapes). A serious Bayesian penalty *would* demote many adaptive claims, as they often rely on post-hoc storytelling without strong evidence against alternatives. Justification: Empirical studies (e.g., on "just-so stories" in human evolution) show adaptive hypotheses are frequently underdetermined; constraint hypotheses require specific, falsifiable predictions (e.g., developmental necessity, phylogenetic correlation).  
      *Dependency: Core driver. If asymmetry is small or penalty ineffective, proposition unlikely.*

  3.  **Instrument Asymmetry Distorts Evidence (0.90) + Severely Inflates Adaptive Rate (0.50 | Distortion True):**  
      Joint probability: **0.45** (0.90 * 0.50). We *do* have vastly better tools for detecting selection (e.g., population genomics, QTL mapping) than constraint (e.g., validating developmental necessity across clades). This inflates apparent adaptive explanations. Justification: Null models in genomics often assume neutrality, not constraint; "failure to reject selection" is frequently conflated with evidence *for* it due to tool limitations.  
      *Dependency: Amplifies #2 – makes adaptive claims easier to "support" artificially.*

  4.  **Spandrels as Residual Category (0.40):**  
      Probability this *significantly* inflates the non-adaptive count superficially. Justification: "Spandrel" is often used as a catch-all for "not obviously adaptive," lacking positive evidence. Your operationalisation (researcher judgement) may count these, making the 1/3 threshold easier but biologically shallow.  
      *Dependency: Partial overlap with #2/#3 – if adaptive claims are weak, residual category grows.*

  5.  **Incentives Prevent Consensus Shift (0.80) + Would Block Truth Even if True (0.70 | Incentives True):**  
      Joint probability: **0.56** (0.80 * 0.70). Strong publication bias favours novel adaptive stories over negative/constraint results. Justification: "Selection found" papers outnumber "selection refuted" or "constraint confirmed" in top journals; grant panels and media prefer adaptive narratives.  
      *Dependency: Counters the proposition – even if biology supports it, consensus may not reflect it by 2050.*

  ### Combined Probability (0.30)
  - Terms are **not independent**. #2 (flexibility) and #3 (instruments) are synergistic: better tools *reveal* flexibility's flaws. #4 (residual) and #5 (incentives) partially conflict: incentives suppress constraint research, keeping the residual category small *but* under-explored.
  - **Path to 0.30:** High confidence in taxonomy (#1, 0.80) anchors the framing. Flexibility asymmetry (#2 joint 0.42) is the strongest positive driver, amplified by instrument bias (#3 joint 0.45). This is partially offset by the residual category risk (#4, 0.40) making the threshold biologically shallow, and strongly countered by incentives (#5 joint 0.56) resisting consensus shift. Net effect discounts the raw biological probability towards 0.30.

  ### Sensitivity & Confidence
  - **Most Sensitive Term:** **#2 (Flexibility Asymmetry & Penalty Impact).** If joint probability here fell to 0.20, my headline would drop to ~0.18. If it rose to 0.60, headline would rise to ~0.40.
  - **Least Confident Term:** **#4 (Spandrels as Residual).** Harder to assess if non-adaptive classifications reflect evidentiary depth or ignorance.
  - **Key Movers (+/- 0.15):** An **adversarial audit** (as you propose) showing constraint alternatives are testable and *win* in >40% of flagship cases would shift me to **≥0.45**. If they win <15%, I’d drop to **≤0.15**. Direction of move depends on whether constraint hypotheses prove robust or brittle under scrutiny.

  ### The 0.45 vs. 0.12 Gap
  The most likely source of disagreement is **#2 (Flexibility Asymmetry)** and **#5 (Incentives)**:
  - You (0.45) likely weight #2 heavily: seeing adaptive storytelling as unfalsifiable without penalties, and believe incentives could be overcome by evidence.
  - Your friend (0.12) likely sees #2 as resolved: the field *has* incorporated methodological caution (testing alternatives), making penalties redundant. She weights #5 heavily: incentives make a 33% non-adaptive consensus implausible by 2050 regardless of truth. She may also see #4 as dominant, viewing non-adaptive claims as usually residual/lacking evidence.

  This gives you the taxonomy and operational levers to refine your Brier scores. Good luck settling the wager.
