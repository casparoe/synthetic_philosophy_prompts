answer: |-
  ### Stage 1: Preparation
  **Marcus's strongest considerations:**
  1. **Long-run dominance:** Over many independent decisions, EU maximization with fixed utility almost surely outperforms alternatives (e.g., 10,000 bets with 1% edge). *Independent of other points.*  
  2. **Dynamic inconsistency cost:** Violating the sure-thing principle means early choices steer toward distributions the agent would later reject (e.g., medical test case: refusing test commits to worse health outcomes). *Independent.*  
  3. **Self-endorsement stability:** EU is self-recommending; a rule rejecting its own choice-procedure is unstable. *Distinct from dominance arguments.*  

  **Thea's strongest considerations:**  
  1. **Exploitability ≠ irrationality:** Being "pumped" may reflect context-specific costs (e.g., refusing blackmail is exploitable but not irrational). *Independent.*  
  2. **Non-separable consequences:** Enriching outcomes (e.g., adding "risk experienced") breaks cross-decision separability needed for long-run aggregation (e.g., two identical gambles: taken together, tail-risk matters more). *Independent.*  
  3. **Plural reflective stability:** Non-EU rules (e.g., satisficing) self-endorse under their own standards; stability doesn't uniquely select EU. *Distinct.*  

  **Genuine disagreements (not labeling):**  
  1. Whether cross-decision separability is required for rational objectives.  
  2. Whether "consequences" can include decision-indexed properties (e.g., "risk in choice #1") without sacrificing aggregation.  
  3. Whether exploitability is a decisive refutation or one cost among many.  
  4. Whether reflective stability favors EU uniquely.  

  **Labeling moves to restrict (each used ≤1 time):**  
  - "That's just a different utility function." (Allowed once total.)  
  - "Risks are already in the outcome." (Marcus)  
  - "Coherence presupposes EU." (Thea)  

  **Concessions with cost:**  
  - **Thea concedes:** Intransitive preferences are indefensible; paying to fix them is ex ante rational. *Costs her:* Weakens skepticism about coherence arguments.  
  - **Marcus concedes:** Exploitability is only ceteris paribus decisive. *Costs him:* Retreats from "pragmatic case settles everything."  

  ---

  ### Stage 2: Dialogue  
  **Setting:** A dimly lit campus coffee shop after a talk. Rain taps the windows. Thea stirs her espresso, Marcus nurses black coffee.  

  **Marcus:** (Leaning forward) Let’s grant only consequences matter. Then two things bite. First: long-run performance. Suppose you face 10,000 small, independent choices. Each is a 55% chance to gain $100, 45% lose $100. EU maximizer with linear utility takes all—expected gain $550,000. A risk-sensitive rule rejecting any bet with loss possible? Zero gain. Probability of EU beating it approaches one. Second: steering. Suppose you’re offered a cheap medical test. 95% accurate for a treatable disease. Refusing it *now* because you dread false positives commits you to later treatments you’d reject if you knew the result. You’re steering toward a health distribution you’d pay to avoid.  

  **Thea:** (Calmly) Exploitability isn’t irrationality. A promise-keeper who refuses to break vows for profit is “exploitable” by manipulators. So is someone who won’t pay blackmail. That’s virtue, not incoherence. Your long-run leg needs four hidden premises: many draws, independence, separability across decisions, and a non-adaptive environment. Fail one, and it collapses. Suppose an adversarial environment: a market maker who identifies my risk-sensitive rule and offers me 1,000 correlated gambles amplifying tail risk. My rule avoids ruin; EU dives in.  

  **Marcus:** But the exploiter isn’t a demon—it’s a market. Precommitment isn’t free. If you’re the type who leaks money in transactions, that’s a cost in your own currency. Define your rule functionally. No moods—math.  

  **Thea:** Concretely: I weight the 1% worst outcome at 10× its probability. Also, my well-being depends on the menu. If you offer me a lottery with a 0.1% chance of ruin, I’m worse off just seeing it—even if I reject it. Choosing changes the context.  

  **Marcus:** (Eyes narrowing) If consequences include *everything*—the whole history, including risks run—then rank histories by expected utility over those enriched outcomes. Your tail-weighting folds into the utility function. And if you’re dynamically consistent—no plan to rebel against your own plans—then the pump applies to *histories*. You can’t have intransitive preferences over life paths.  

  **Thea:** (Smiling faintly) Ah, the no-free-consequences problem. To make my concerns "consequentialist," you stuff "risk-experienced-in-decision-1" into the outcome. But now cross-decision separability fails. Take two identical gambles. Each: 90% win $1,000, 10% lose $10,000. Separately, I reject both—tail loss too scary. Together? One loss is survivable; I accept both. But if you index "risk-in-gamble-1" to the first choice, the sum of per-decision scores ≠ whole-history score. Enriched consequences or aggregation—pick one.  

  **Marcus:** Then restate the long-run argument over entire histories: maximize expected *intertemporal* utility. No per-decision separability needed. And if your concerns are truly indexed to individual decisions—not the history—you’re not a consequentialist. Why use a framework that assumes fixed outcomes? But deeper: EU is self-endorsing. After seeing the math, you’d switch to it. A rule that doesn’t endorse itself is unstable.  

  **Thea:** (Firmly) Self-endorsement is cheap. A satisficer with threshold $T endorses satisficing: "Why demand more than enough?" My tail-minimizer endorses avoiding disasters. Even menu-sensitivity: "Why ignore context?" Reflective stability is plural. And exploitability is just a cost. Suppose pumping me costs $1 but avoiding it requires abandoning a rule saving me $100 in tail risk. Ceteris paribus, I pay the dollar.  

  **Marcus:** (Pausing) Granted—ceteris paribus. But the weighing *itself* is a decision. Coherence arguments apply there too. Name one case where the cost of becoming coherent exceeds the cost of being pumpable.  

  **Thea:** (Quietly) Every time I refuse to pay blackmail.  

  *(They fall silent. Rain streaks the glass. The disagreement hangs, sharpened.)*
