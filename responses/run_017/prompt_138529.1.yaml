prompt: |-
  I wonder whether there is a name for a pattern I have started noticing at work, and — if there is not — whether you could help me pin it down precisely enough that I could use the word in a committee paper without being laughed at.

  Some context. After a reorganisation last spring I was asked to chair the underwriting committee of a medium-sized mutual insurer. I am an accountant by training rather than a statistician, so I spend a good deal of my week in meetings where intelligent people argue about how much to charge for risks whose likelihood nobody in the room can put a number on. Over the past year one particular shape of argument has recurred often enough that I want a handle on it, and nothing I have found on my own quite fits. I should mention that I have no access to a university library from here, so I would be grateful for an answer built out of the distinctions themselves rather than a list of things to go and read.

  Four instances, real but tidied.

  First. One of our senior underwriters habitually prices an unclear risk at the pessimistic end of whatever range we can agree on. But he only does this when the same agenda also contains a risk of the same general kind whose rate we do know well. Take the unclear item off the agenda and bring it back a fortnight later on its own, and he will price it at the middle of the range without any apparent discomfort. The risk has not changed between the two meetings; the company has not learned anything; only the presence of the other item has changed.

  Second, closely related. If I hand him a number — any number, including one I have visibly invented on the spot — the padding disappears and he prices at the number. He does not pad *known* rates, only missing ones. So whatever this is, it is not a general taste for caution about how much we might lose.

  Third. When the unclear quantity happens to fall in the area where he is our designated in-house expert, the caution reverses: he will take the unclear risk in preference to a clear risk of the same mid-range value. My colleagues and I checked his track record out of curiosity, and his judgements in his own area are no better calibrated than his judgements elsewhere. So the reversal is not tracking his actual reliability.

  Fourth, and this is the part I cannot find discussed anywhere: the reversal has nothing to do with his own expertise either. It depends on who else is at the table. Put an outside consultant in the room and he retreats to the pessimistic end even in his own field — and he does this even when the consultant's information has nothing whatever to do with the question being decided, and even when there is no opportunity for him to consult them. Remove the consultant and he is comfortable again. It is as though what he is avoiding is not the missing number but the visibility of the missing number.

  My questions. Does the first pair of observations have an established name? I have a vague memory of a well-known puzzle about drawing coloured balls from an urn whose composition is unknown, which seems to be in this neighbourhood, but as I understand it that puzzle concerns how people rank the two options, not the ranking changing depending on what else happens to be on the table at the time. Does the third observation have a name of its own, or is it the same phenomenon in another guise? Is the fourth the same family at all, or is it ordinary social embarrassment wearing the costume of a judgement about uncertainty — and if the two readings cannot be separated by armchair argument, what observation would separate them? I have been using the private label "expert exemption" for the third, which I assume is already taken; and if no single concept covers all four, I would much rather have a short taxonomy with its boundary cases marked than one borrowed label stretched over everything.

  Please answer in British English.
reasoning: |-
  Okay, the user is describing a pattern they've observed in their role as chair of an underwriting committee at a mutual insurer. They've noticed a senior underwriter behaves differently when pricing unclear risks depending on contextual factors - specifically: 

  First, the underwriter prices unclear risks pessimistically only when a comparable known-risk is on the same agenda. Remove that known-risk item and he prices at mid-range. 

  Second, giving him any number (even an arbitrary one) makes the pessimism disappear. 

  Third, in his own expertise area, he actually prefers unclear risks over clear ones at mid-value - despite his calibration being no better there. 

  Fourth, this "expert exemption" disappears if an external consultant is present, even if irrelevant to the decision. 

  The user wants terminology to describe this without sounding foolish in committee papers. They specifically request: British English, no academic references (no library access), and prefer distinct concepts over stretched terminology. 

  Hmm... the core seems to be about how ambiguity is framed and perceived. The underwriter isn't reacting to the actual uncertainty but to contextual cues about how that uncertainty might be judged by others. The presence of known risks creates implicit comparison; expertise areas license comfort with ambiguity; outsiders trigger defensive pessimism. 

  Breaking it down: 

  The first two points show his ambiguity aversion is contextual, not inherent. It's not about the risk itself but about relative positioning - he needs either a numerical anchor (even fake) or absence of comparators to avoid looking underprepared. 

  The third point is fascinating - in his domain, ambiguity becomes desirable. That smells of "ambiguity-seeking" behavior, which usually happens when people feel overconfident in familiar domains. But his calibration is poor, so it's not competence-driven. Probably about perceived ownership - ambiguity in one's specialty feels like territory to claim rather than territory to avoid. 

  The fourth point confirms it's social: outsiders make him retreat to defensive positioning regardless of actual expertise. He's managing perceived judgment credibility. 

  So we've got three layered phenomena: 
  1) Context-dependent ambiguity aversion (triggered by comparators) 
  2) Domain-specific ambiguity-seeking (triggered by ownership feeling) 
  3) Social credibility management (triggered by observers)

  For terminology: "ambiguity aversion" is the baseline concept from decision theory, but needs modifiers. "Positional ambiguity aversion" captures the comparative aspect in the first point. "Territorial ambiguity-seeking" for the expertise reversal. "Defensive anchoring" might cover the second observation about accepting any number. 

  The social component in the fourth point is trickier - it's like "evaluation apprehension" but specific to uncertainty displays. Perhaps "credential exposure effect"? Though that might be too jargony. 

  Since the user wants practical committee language, I should build the terms from plain concepts: "comparative ambiguity padding", "expertise-driven ambiguity preference", "observer-induced conservatism". 

  The unifying thread is really about performance of judgment rather than judgment itself - it's presentational. Might call the whole pattern "judgment theatre" but that sounds flippant for a paper. 

  Better to offer: 
  - For the first: "comparative ambiguity premium" 
  - For the second: "arbitrary anchoring effect" 
  - For the third: "domain-ownership ambiguity bias" 
  - For the fourth: "evaluative audience effect" 

  And note they're all subtypes of "context-contingent uncertainty framing". 

  Test drive: "The committee should recognise that pricing judgments exhibit context-contingent uncertainty framing, notably: comparative ambiguity premium when known risks are referenced; domain-ownership ambiguity bias in specialty areas; and evaluative audience effects from external observers." 

  That holds water. The user can then define the subtypes in a footnote. 

  Final check: avoids academic references, uses British spelling ("recognise"), gives distinct labels with clear boundaries. Nails the brief.
answer: |-
  Right, this is a fascinating pattern – and you're quite right that it doesn't slot neatly into one named concept. It's a blend of well-understood cognitive biases interacting with social signalling, amplified by the specific pressures of committee decision-making under uncertainty. Based on your descriptions, let's build a precise taxonomy using British English distinctions.

  ### The Core Phenomenon & Its Components

  1.  **Comparative Ambiguity Padding (First Observation):**
      *   **Definition:** The tendency to apply a pessimistic adjustment (a "padding") to an estimate for an ambiguous risk *specifically when* a comparable, well-understood risk is being evaluated simultaneously.
      *   **Mechanism:** The known risk acts as a salient benchmark, making the *lack* of certainty for the ambiguous risk feel more acute and potentially embarrassing. Padding compensates for this perceived exposure. Remove the comparator, and the social pressure to justify the uncertainty diminishes, allowing a more central estimate.
      *   **Why not simple Ambiguity Aversion?** Classical ambiguity aversion is a general preference for known risks over ambiguous ones of equal expected value. This is *context-specific* aversion triggered by direct comparison, not a general trait (as your second observation confirms). It's about the *relative visibility* of the uncertainty.

  2.  **Arbitrary Anchoring Compliance (Second Observation):**
      *   **Definition:** The willingness to accept and base an estimate for an ambiguous quantity on *any* externally provided numerical anchor, however arbitrary, thereby eliminating self-imposed pessimism padding.
      *   **Mechanism:** An external anchor provides cognitive relief and social cover. It shifts responsibility ("*I* didn't pull the number from thin air, *they* gave it to me") and satisfies the need for *some* concrete figure, defusing the discomfort of pure ambiguity. It demonstrates the padding wasn't driven by intrinsic risk assessment but by the *need to produce a defensible number under scrutiny*.
      *   **Why not just Anchoring?** Anchoring is the general cognitive bias where an initial number influences subsequent judgements. This is a specific sub-type: the *eager acceptance of any anchor* specifically to resolve the discomfort of presenting an unanchored estimate in a comparative or evaluative context. It's about *relinquishing the burden of justification*.

  3.  **Domain-Ownership Ambiguity Preference (Third Observation):**
      *   **Definition:** Within one's perceived area of expertise ("domain-ownership"), a *reversal* of comparative ambiguity padding, manifesting as a preference *for* an ambiguous risk over a clear risk of equivalent mid-range expected value.
      *   **Mechanism:** In his "turf," ambiguity is no longer a threat; it's an *opportunity*. It signals mastery ("*I* can handle this complexity where others might falter") and asserts territory. The ambiguity itself becomes a value proposition for the expert's role. Crucially, as you note, this is *not* linked to actual superior calibration; it's linked to the *perception* and *assertion* of expertise status.
      *   **Why not Overconfidence?** Overconfidence is general. This is specifically a *reversal* triggered by domain context and tied to the *social value* of ambiguity within that domain for the individual. It's "Ambiguity as Status Signal."

  4.  **Evaluative Audience Conservatism (Fourth Observation):**
      *   **Definition:** The suppression of Domain-Ownership Ambiguity Preference (and reversion to Comparative Ambiguity Padding) in the presence of an external evaluator (e.g., consultant), irrespective of their relevance or opportunity for interaction.
      *   **Mechanism:** The external figure represents heightened scrutiny and a potential challenge to the expert's claimed domain-ownership. The ambiguity, previously a badge of honour, reverts to being a vulnerability – a gap an outsider might expose. Pessimistic padding returns as a defensive posture to pre-empt criticism ("See, I was cautious!") and minimise perceived accountability for potential underestimation. It prioritises *blame avoidance* over territory assertion.
      *   **Is it just embarrassment?** It's deeper than simple embarrassment. It's *strategic conservatism* driven by the *threat of reputational devaluation* posed by an external audience. The presence of the consultant changes the perceived *stakes* of the judgement call within the expert's domain.

  ### The Unifying Framework: Context-Contingent Uncertainty Framing

  The overarching pattern is that the underwriter's response to ambiguity is **highly context-contingent**, driven primarily by **social and reputational cues** rather than a consistent evaluation of the inherent uncertainty or his actual knowledge. The core driver is the **perceived need to manage the impression of competence and accountability** in front of different audiences and within different comparative frames.

  *   **Presence of Known Comparator:** Signals relative uncertainty -> **Comparative Ambiguity Padding** (Defensive posture).
  *   **Absence of Anchor:** Forces public generation of number -> Padding due to justification burden.
  *   **Provision of Any Anchor:** Relieves justification burden -> **Arbitrary Anchoring Compliance**.
  *   **Own Domain, Internal Audience:** Ambiguity signals mastery -> **Domain-Ownership Ambiguity Preference** (Assertive posture).
  *   **Own Domain, External Evaluator:** Ambiguity signals vulnerability -> **Evaluative Audience Conservatism** (reverts to Defensive posture: Padding).

  ### Distinguishing the Fourth Observation (Armchair & Test)

  *   **Armchair Distinction:** If it were *only* social embarrassment about lack of knowledge, the effect might be weaker in his domain *even* with a consultant present (he should feel *more* confident). The fact that he *reverts* to padding specifically in his domain *only* when an evaluator is present strongly suggests it's about the *threat of evaluation* to his claimed expertise status, not general embarrassment about not knowing. The ambiguity in his domain is a double-edged sword: empowering without evaluators, dangerous with them.
  *   **Observational Test:** Propose a scenario in his domain, ambiguous risk, with the consultant present. **Option A:** He prices pessimistically (as observed). **Option B:** *Before* he prices, have the consultant make a brief, demonstrably irrelevant, and slightly *foolish* comment about a completely different area (showing the consultant isn't infallible or a threat on *this* topic). If he then prices *less* pessimistically (or even mid-range) compared to when the consultant stays silent/authoritative, it confirms the mechanism is the *perceived evaluative threat*, not mere presence or general embarrassment. If the padding remains strong, general embarrassment or a very low threshold for perceived threat is more likely.

  ### Proposed Terminology for Your Paper

  You can confidently present this using the taxonomy above:

  > "Analysis of underwriting judgements suggests a pattern of **Context-Contingent Uncertainty Framing**. Key elements observed include:
  >
  > 1.  **Comparative Ambiguity Padding:** Pessimistic adjustments applied to ambiguous risks specifically when directly compared against well-understood risks.
  > 2.  **Arbitrary Anchoring Compliance:** Willingness to base ambiguous risk estimates on any externally provided numerical anchor, eliminating self-imposed padding.
  > 3.  **Domain-Ownership Ambiguity Preference:** Within perceived areas of expertise, a tendency to value ambiguous risks *more* highly than clear risks of equivalent expected value.
  > 4.  **Evaluative Audience Conservatism:** The suppression of Domain-Ownership Ambiguity Preference and reversion to Comparative Ambiguity Padding in the presence of external evaluators, irrespective of their relevance."

  ### Why this works

  *   **Precise:** Each term directly describes the *condition* and the *observed behavioural shift*.
  *   **Distinct:** Boundaries between the concepts are clear (comparison vs. anchor vs. domain status vs. external evaluation).
  *   **Descriptive:** The terms build meaning from their components ("Comparative Ambiguity", "Domain-Ownership").
  *   **Academic Adjacent:** While not direct citations, they use established concepts (ambiguity, anchoring, ownership, evaluation) in a novel but logical combination that will resonate with informed readers without sounding made-up.
  *   **Actionable:** Highlighting "Context-Contingent Framing" immediately suggests interventions like managing meeting agendas (sequencing known/unknown risks), providing preliminary anchors for discussion, being mindful of expert/in-outsider dynamics, and structuring discussions to separate ambiguity assessment from social signalling.

  This framework gives you precise, defensible language that captures the nuances you've astutely observed, allowing you to discuss the phenomenon professionally in your committee paper. It avoids stretching a single term and provides clear hooks for further discussion or mitigation strategies.
