prompt: |-
  Hey — I need a number, and I need to see how you got to it, because I think my reading group is arguing about three different questions while pretending to argue about one.

  Some background: I'm in this very informal reading group with two friends (one of them is literally named Maya — her parents were archaeologists and thought it was hilarious, and yeah, we now can't get through a session on the Classic Maya without someone making a joke). We've been working through the "collapse" literature — the Late Bronze Age eastern Mediterranean, the Classic Maya, Easter Island — and it feels like every disagreement bottoms out in something prior. My advisor has this test she keeps pushing, which I've half-adopted: call something a collapse only if the practical know-how needed to run its institutions — bookkeeping, measurement, administrative literacy, that whole layer — stopped being transmitted to a next generation of people who wanted or needed it. Call it the "ledger test." Under it, a case where palaces and long-distance trade end but village farming life continues more or less as before isn't a collapse, it's a political reorganization with good PR. My sense, which could definitely be off, is that the cases pull in different directions under that test: in one of them everyday rural life looks pretty continuous while the elite apparatus just stops, and in another you get substantial regional depopulation and abandoned cities. Maya thinks the ledger test is a gerrymander — she says it smuggles in a judgment about which parts of a society are the interesting parts, and that we should treat "collapse" as a threshold concept like extinction, basically descriptive, so the only real question is where the threshold sits.

  So here's the proposition I want your credence on, as precisely as I can state it: "collapse," as applied to societies, is an irreducibly evaluative concept — no purely descriptive threshold (population loss, reduction in social complexity, disappearance of elite institutions, loss of administrative literacy) can pick out the paradigm collapses without either being gerrymandered to fit, or quietly importing a judgment about which losses count as losses. I'm at about 0.65 on that; Maya is around 0.25.

  Give me your own number, but more importantly the decomposition. I'd like rough probabilities on something like: whether any quantitative threshold can be stated that fits the paradigm cases without obvious ad hoc tuning; whether, even granting a clean descriptive definition, the live disputes would be settled by it or whether they're really disputes about which changes matter; whether ordinary and popular usage of "collapse" (the whole bestselling collapse-as-warning genre, with its stories about cutting down the last tree or about decadence or about elites failing) is tracking anything value-free or is doing moral-fable work; and whether that fable work is detachable from the scholarly use of the term, or whether the scholarly use borrowed the freight. Assign a number and a one-line justification to each, say how you're combining them, then tell me which single sub-question your final number is most sensitive to, what kind of evidence or argument would move it most, and where you think the gap between me at 0.65 and Maya at 0.25 actually lives. Also tell me honestly whether the ledger test is doing real work or just restating my conclusion in technical costume.

  And please push back if the setup is confused: if "descriptive vs. evaluative" is a fake dichotomy here, or the whole thing dissolves once you distinguish a polity ending from a society ending, or the proposition as I've worded it doesn't really have a truth value — say that plainly instead of politely playing along. Don't go hunting for citations or reading lists; I want the reasoning out of your own head, and flag anywhere you're unsure about the empirical details of the cases.
