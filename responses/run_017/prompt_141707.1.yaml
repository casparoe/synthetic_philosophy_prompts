prompt: |-
  I'm writing a short chapter for a handbook on professional ethics — the topic is the line between persuasion and manipulation in doctor–patient and teacher–pupil relationships — and before I commit myself to any argument I want to find out what I actually think, so I have been working through cases and going with my gut. Please don't give me a map of the literature or a list of names; I have read enough of it to know the usual moves, and what I need is a principle, stated precisely enough that I could apply it to a new case myself. Here is where my verdicts have landed.

  - A GP who wants a reluctant patient to start statins says that most people of his age with that cholesterol level take them and are fine. This is true, but she has chosen that comparison class because it flatters the risk, and she would not have used it with a patient who had asked for the absolute figures. My verdict: persuasion, entirely permissible, and this is what I would want my own GP to do.
  - A friend invites me to a dinner party and adds that she knows how swamped I am and I really must not feel I have to come. My verdict: manipulative — it raises the cost of declining while pretending to lower it — but only mildly, and I don't resent her for it.
  - A charity appeal shows one named, photographed child and pre-fills the standing order at ten pounds a month, and everyone involved knows it works by way of the identifiable-victim effect rather than by any thought about what the charity achieves per pound. My verdict: manipulative, and I dislike the technique, but I don't think it is wrong, and I cannot say why.
  - A union organiser, securing a strike vote, dwells on one genuinely nasty but quite unrepresentative thing the manager said. My verdict: persuasion, permissible. The anger is about a real wrong even if the anecdote is not representative of anything.
  - A manager offering me a stretch role dwells on its prestige and does not mention that the last two people who held it were passed over for promotion — a fact he knows I would weigh heavily. My verdict: manipulation, not permissible, and clearly worse than the dinner invitation although nothing he says is false.
  - The hospital canteen moves the fruit to eye level and puts the pastries behind the till. It works partly on people who never notice anything, and the aim is their own health. My verdict: not manipulation, and I am comfortable with it, though it nags at me that the mechanism is invisible to the people it moves.
  - At a seminar a colleague introduces the one step I am known to doubt with the words "as we all know", and I let it go past. My verdict: a mild manipulation of my beliefs — and I do not want a principle that makes ordinary seminar rhetoric impermissible.
  - My partner, before ever asking whether we might move to another city, spends a month arranging viewings and mentioning school catchments, so that by the time the question is asked there is already a default. My verdict: manipulation, not permissible, and the case I feel most strongly about — except that I cannot say what distinguishes it from the GP.
  - A teacher tells a struggling eleven-year-old that he is the sort of person who is good at this. She does not yet believe it, she says it for its effect, and the effect is that he improves and comes to believe it. My verdict: I go back and forth.
  - I take a beta blocker before a lecture and delete an app from my phone before a deadline. Obviously fine.

  The principle I keep reaching for has four clauses: an influence is manipulative only if (1) someone intends it, (2) it does its work by a route other than the target's own appreciation of the reasons there are — it operates behind the back of deliberation rather than as a consideration offered to it, (3) it would be significantly less effective if the target were told in advance what route is being used and why, and (4) the target has not authorised that route. But this principle seems to me to mispredict the canteen, which satisfies the transparency clause and so comes out as manipulation when I want it clean; it fails to separate the GP from my partner, since both are selective presentations of true information; and it convicts the teacher, which may be right but leaves me unable to say why a manipulation can be the right thing to do.

  So, three things. First: give me a principle, or two or three candidates, with each clause tied to the case that motivates it and an honest statement of which of my verdicts it forces me to abandon — I would rather lose a verdict than keep a principle that saves all ten by becoming a list. Second: tell me what your principle says about cases I have not listed, in particular advance consent of the "you have my permission to push me into going" kind, self-manipulation, and influence designed by an institution or a recommendation system where no single person has the relevant intention. Third: say whether on your account manipulation is pro tanto wrong at all, or only one defect among others that a good action can have, and whether manipulating what someone believes and manipulating what they choose need to be handled separately.
reasoning: |-
  Hmm, the user is writing a chapter on professional ethics focusing on the line between persuasion and manipulation in doctor-patient and teacher-pupil relationships. They've shared several cases where they've made intuitive judgments about what constitutes manipulation versus permissible persuasion. They've also proposed a four-clause principle but found it inconsistent with some of their verdicts. They want a refined principle that can handle new cases, address issues like advance consent and institutional influence, and clarify whether manipulation is inherently wrong.

  Looking at their cases, several patterns emerge. The GP case involves selective presentation of true information to nudge a patient toward a beneficial health decision. The user sees this as permissible persuasion. In contrast, the partner case, where someone pre-arranges viewings before discussing a move, feels like impermissible manipulation despite also involving selective information. The key difference seems to be about how the information framing relates to the target's values and autonomy.

  For the dinner invitation, the friend's comment about being swamped actually increases social pressure while pretending to relieve it - this "false framing" makes it manipulative. The charity appeal uses psychological tricks (identifiable victim effect) bypassing rational evaluation, which the user dislikes but doesn't deem wrong. The union organizer uses an emotionally charged but genuine example to mobilize action - permissible persuasion since the anger is warranted.

  The manager case involves omitting crucial information that would affect the decision (past holders being passed over), making it impermissible manipulation. The hospital canteen's nudges are seen as acceptable despite being invisible to some targets because they align with health goals. The seminar tactic ("as we all know") is mild manipulation but socially accepted. The teacher's false encouragement is ethically ambiguous - it might help the student but starts with a lie.

  Their proposed principle has issues with the canteen case (transparency requirement would misclassify it) and fails to distinguish the GP from the partner case. The teacher case also highlights that some manipulation might be justified.

  I think the core issue is that manipulation violates autonomy by bypassing or subverting the target's decision-making process, while persuasion respects it by engaging with reasons. But the cases show autonomy violations aren't always wrong (e.g., canteen nudges) and some reason-bypassing might be benign (charity appeal). 

  A better approach might distinguish based on whether the influence: (1) operates through the target's rational faculties (persuasion) versus non-rational triggers (manipulation), (2) is transparent in method and intent, and (3) aligns with the target's values or authorized goals. The GP case aligns with health values the patient presumably shares, while the partner's house hunt imposes unshared priorities. The canteen nudges align with health goals we'd want promoted. The teacher's encouragement might be justified if it serves the student's educational development - a core purpose of the relationship.

  For advance consent, if someone authorizes certain nudges ("push me to go"), it transforms manipulation into permissible influence. Self-manipulation (like deleting apps) is fine because there's no autonomy violation - you're acting on your own values. Institutional influences without clear intent might still be manipulative if they bypass reason, but accountability gets fuzzy.

  Manipulation isn't always wrong - it can be pro tanto wrong (wrong-making feature) but overridden by benefits, especially in asymmetric relationships like doctor-patient where patients might want paternalistic guidance. Belief manipulation (like the seminar comment) and choice manipulation (like the dinner invitation) both involve bypassing reason, but belief manipulation feels more intrusive because it corrupts the cognitive process itself.
answer: |-
  Based on your cases and the tensions in your initial principle, here are three candidate principles, each prioritizing different ethical dimensions (autonomy, transparency, and relationship-purpose). I'll state them precisely, map them to your verdicts, highlight conflicts, and address your additional requests.

  **Candidate Principle 1: The Rational-Autonomy Violation Principle**
  *An influence is manipulative (and pro tanto wrong) if and only if:*
  1.  *It is intentionally designed to bypass or subvert the target’s capacity for rational deliberation in forming a belief or making a choice.*
  2.  *It does so by exploiting a cognitive bias, emotional trigger, or informational asymmetry in a way that would likely be resisted or rejected by the target if they were consciously aware of the mechanism and its intent at the moment of influence.*

  *   **Motivates Clause 1:** Your rejection of the partner's house hunt (bypasses rational consideration of core life choices via salience/commitment bias) and the manager's omission (exploits informational asymmetry about career risks).
  *   **Motivates Clause 2:** Your acceptance of the union organizer (anger stems from a *real* wrong presented transparently, even if unrepresentative) and your discomfort with the charity appeal (exploits identifiable victim effect, bypasses cost-benefit reasoning).

  *   **Forces Verdict Abandonment:**
      *   **GP:** **Conflicts.** Framing stats selectively *exploits* the patient's potential trust in the doctor's framing and reliance on comparison classes, bypassing full rational assessment of absolute risk. Your principle *should* classify this as manipulation. You must abandon your "persuasion/permissible" verdict.
      *   **Teacher:** **Aligns (as Manipulation).** Telling the student he "is the sort of person" good at this, when untrue and *intended* to bypass his current self-assessment/evidence to trigger effort via belief-change, fits. You must accept the classification, even if you argue it's justified.
      *   **Canteen:** **Aligns (Not Manipulation).** While invisible to some, it doesn't *subvert* deliberation; it structures the *environment* preceding choice. It works on inattention, not by tricking deliberation *about* the choice itself. Your comfort is preserved.
      *   **Dinner Invitation:** **Aligns (Manipulation).** It *subverts* the rational cost-benefit of declining by injecting guilt (an emotional trigger) via a false pretense of lowering costs. Your "mildly manipulative" verdict holds.
      *   **Self-Manipulation (Beta Blocker/App):** **Not Manipulation.** No *other* agent intentionally subverting *your* rational capacity. You are the agent acting on your own future self.

  *   **New Cases:**
      *   **Advance Consent ("Push me"):** Likely *not* manipulation under this principle. By authorizing the push *in advance*, the target consciously incorporates the potential bypass/trigger into their own rational planning. The mechanism isn't hidden *at the moment*; it's pre-approved.
      *   **Institutional Influence (Algorithm):** *Can be* manipulation. If the algorithm is *designed* (intent is embedded) to exploit biases (e.g., infinite scroll exploiting attention bias, hidden pricing) to bypass rational choice, it qualifies, even without a single human "intending" it *at that moment*.

  *   **Wrongness & Belief/Choice Distinction:** Manipulation is *pro tanto* wrong here because it violates respect for the target's rational agency. Belief manipulation (like the seminar "as we all know" – exploiting conformity bias to bypass critical assessment) and choice manipulation (like the dinner invitation) are both covered, as both involve subverting rational faculties. The *degree* of wrongness might differ based on context and stakes.

  **Candidate Principle 2: The Authorized-Transparency Principle**
  *An influence is manipulative (and pro tanto wrong) if and only if:*
  1.  *It operates via a mechanism (e.g., framing, omission, emotional trigger, bias exploitation) that is intentionally obscured from the target.*
  2.  *The obscurity is essential to its effectiveness (it would fail or be significantly weakened if the mechanism and intent were disclosed clearly and concurrently with the influence attempt).*
  3.  *The target has not previously authorized the *specific type of mechanism* or the *general context* of influence in a meaningful way.*

  *   **Motivates Clause 1 & 2:** Your strong reaction to the partner (obscured intent/mechanism of creating a default) and the manager (obscured crucial omission). Your comfort with the canteen (transparent placement, effectiveness doesn't *depend* on hiding the "why") and the GP (if challenged, she *could* reveal the framing choice without necessarily destroying the influence – though it might change it).
  *   **Motivates Clause 3:** Your intuition about advance consent ("you have my permission to push me") potentially legitimizing otherwise manipulative tactics.

  *   **Forces Verdict Abandonment:**
      *   **Charity Appeal:** **Aligns (Manipulation).** The identifiable victim effect and pre-filled form *rely* on obscurity. Explaining "we use this photo/form amount because it triggers emotional giving bypassing cost-effectiveness" would likely reduce effectiveness. Your "manipulative/dislike" verdict holds.
      *   **Union Organizer:** **Aligns (Persuasion).** The nasty quote is presented openly as evidence. Effectiveness relies on its genuine awfulness, not hiding *that* it's being used to motivate. Explaining "I'm using this anecdote to highlight management's potential attitude and motivate action" doesn't inherently weaken it (might even strengthen resolve). Your "persuasion" verdict holds.
      *   **Teacher:** **Aligns (Manipulation).** The mechanism (untrue statement to trigger belief/effort change) is obscured. Effectiveness *depends* on the student believing it's a sincere assessment. Disclosure ("I'm saying this because I think believing it will make you try harder, even if it's not true yet") would likely undermine it. You must classify as manipulation.
      *   **Seminar Comment:** **Aligns (Manipulation).** "As we all know" obscures the intent to shut down dissent by exploiting conformity bias. Effectiveness relies on the obscurity. Disclosure ("I'm saying 'as we all know' to pressure you into not questioning this step") would destroy its effect. You must accept it's mild manipulation, consistent with your verdict.

  *   **New Cases:**
      *   **Advance Consent ("Push me"):** Likely *not* manipulation. Authorization specifically covers the mechanism (being "pushed" – which implies obscured triggers/bypassing full deliberation at the moment).
      *   **Self-Manipulation:** **Not Manipulation.** No obscurity *to the self*. You know why you're deleting the app/taking the blocker.
      *   **Institutional Influence:** *Can be* manipulation if the mechanism is obscured (e.g., algorithm hiding how it filters choices, dark patterns in UI). If the mechanism is transparent (e.g., "we put fruit at eye level for health"), it's not.

  *   **Wrongness & Belief/Choice Distinction:** Manipulation is *pro tanto* wrong due to the *deception* inherent in obscurity, violating trust and informed participation. It applies equally to belief (seminar, teacher) and choice (partner, manager) manipulation when obscurity is key. The obscurity *is* the core wrong.

  **Candidate Principle 3: The Fiduciary-Purpose Principle**
  *Within fiduciary relationships (e.g., doctor-patient, teacher-pupil, possibly close personal), an influence is manipulative and impermissible if:*
  1.  *It intentionally uses a mechanism (framing, omission, trigger, bias) that bypasses the target's rational deliberation or exploits their vulnerability/trust.*
  2.  *Its primary aim is not demonstrably aligned with the *core purpose and benefit* of the fiduciary relationship (e.g., health for doctor, learning/development for teacher), as understood within the relationship context, OR it prioritizes the influencer's interest over the target's.*
  3.  *The mechanism used falls outside what a reasonable person in the target's position could expect as a legitimate means of influence within that specific fiduciary context.*

  *   **Motivates Clauses 1-3:** Your divergent verdicts on the **GP** (permissible - aligns with health, expected framing) vs. **Partner** (impermissible - serves partner's agenda, exploits intimacy/trust, unexpected tactic) and **Teacher** (ambivalence - bypasses rational belief, but *might* align with learning/development). Also explains **Canteen** (not fiduciary, or if seen as institutional caretaking, aligns with health).

  *   **Forces Verdict Abandonment:**
      *   **Union Organizer:** **Outside Fiduciary Scope.** This principle doesn't directly apply (unless you argue unions have a fiduciary duty, which is complex). Your "persuasion" verdict stands independently.
      *   **Charity Appeal:** **Outside Fiduciary Scope.** Not applicable. Your verdict stands.
      *   **Dinner Invitation:** **Ambiguous.** Is friendship fiduciary? If yes, mild manipulation not aligned with core purpose (mutual enjoyment) and exploits trust. You might need to condemn it more strongly than "mildly manipulative, don't resent". If no, verdict stands.
      *   **Manager:** **Potentially Fiduciary-Lite.** If managers have a duty of care, omitting crucial promotion info prioritizes filling the role (manager's interest) over employee's career development (target's interest), using an unexpected omission. Aligns with your "manipulation, impermissible" verdict.

  *   **New Cases:**
      *   **Advance Consent ("Push me"):** *Potentially* permissible in fiduciary context *if* the authorized push aligns with the relationship's core purpose (e.g., patient authorizing doctor to be very direct about quitting smoking).
      *   **Self-Manipulation:** **Not Applicable.** No fiduciary relationship with self.
      *   **Institutional Influence (Hospital Canteen):** If the institution has a health-promoting role, mild environmental nudges align with purpose and are expected. Not manipulative under this principle.

  *   **Wrongness & Belief/Choice Distinction:** Manipulation here is a *breach of fiduciary duty* – wrong because it betrays the trust and purpose of the relationship. It applies to both belief (teacher) and choice (doctor, partner) manipulation within the relevant relationships. Context and alignment with the beneficiary's core interests are paramount. A "manipulative" mechanism (like the teacher's statement) *might* be permissible *if* it demonstrably serves the pupil's core developmental interests and is within expected pedagogical methods.

  **Recommendation & Synthesis:**

  Your cases reveal tensions between autonomy, transparency, and relational duties. **Principle 1 (Rational-Autonomy Violation)** offers the cleanest *definition* of manipulation's core mechanism but forces you to abandon your GP verdict and accept the teacher as manipulative. **Principle 2 (Authorized-Transparency)** best captures your reactions to obscurity and consent but also forces the teacher into manipulation and risks being too broad (classifying *any* effective obscurity as manipulative, even benign rhetoric). **Principle 3 (Fiduciary-Purpose)** best explains the stark difference between your GP and Partner verdicts and accommodates justified paternalism in asymmetric relationships but is limited in scope.

  **A Hybrid Approach:** Manipulation involves *intentionally bypassing rational deliberation via obscured or exploitative mechanisms*. This is *pro tanto* wrong as an autonomy violation/deception. However:
  1.  **Severity/Permissibility Depends on Context:**
      *   **Relationship:** Violations are worse in fiduciary relationships (doctor, teacher, partner) due to breached trust.
      *   **Alignment with Interests:** Bypassing autonomy is less problematic if demonstrably aligned with the target's own values/goals (e.g., health nudges, *possibly* the teacher's encouragement if successful) *and* within the expected bounds of the relationship. The Partner case fails this (imposing partner's agenda).
      *   **Transparency/Consent:** Advance consent mitigates the wrong by incorporating the bypass into the target's own planning.
  2.  **Self-Manipulation** is not manipulation (no other agent).
  3.  **Institutional Influence** can be manipulative if it embodies an intentional design to bypass reason obscurely, regardless of single human intent at the moment.
  4.  **Belief vs. Choice:** Core definition applies to both. Belief manipulation might feel more insidious as it corrupts the cognitive tools of future deliberation.

  This explains:
  *   **GP:** Bypasses full reason (mild manipulation) but is contextually permissible (fiduciary, health goal, expected framing).
  *   **Partner:** Bypasses reason *obscurely*, not aligned with mutual benefit, severe breach of relational trust = impermissible manipulation.
  *   **Teacher:** Bypasses reason obscurely (belief manipulation). Permissible *only if* it demonstrably serves the pupil's core development and is a justifiable pedagogical tactic (your ambivalence reflects this tension).
  *   **Canteen:** Structures choice environment; doesn't bypass deliberation *about* the choice = not manipulation.
  *   **Charity Appeal:** Obscure bypass of cost-benefit reason = manipulation, but permissible if one accepts the goal justifies the means (you dislike it but don't condemn).
  *   **Dinner Invitation:** Obscure emotional trigger (guilt) = mild manipulation, less severe due to non-fiduciary context.
