prompt: |-
  hey — I'm 4th year, writing a chapter on cluelessness and I have to present it at the grad workshop next week, so I need to rehearse against someone who actually pushes back. Could you play the opponent?

  The claim I'm defending: the cluelessness literature runs together two things. Call them *level* cluelessness (I have no real grip on the total long-run value of this option) and *contrast* cluelessness (I have no grip on which of my options is better, or by how much). The standard argument goes: level cluelessness is massive for basically any real action, so contrast cluelessness, so consequentialism stops giving useful guidance. But that inference quietly assumes the error terms on the two options are roughly independent, and in ordinary choice situations they aren't: most of the downstream — the institutional, demographic, economic stuff centuries out — is common to both options and cancels in the difference. So I want to say cluelessness isn't a property of a decision problem full stop, it's a property of a *pair* of options, and there's a rough number for it: variance of the difference over variance of the levels, call it the contrast ratio. Where that ratio is low, expected-value reasoning on the difference is in decent shape even though I'm hopelessly clueless about the levels. Corollary I'm fond of: sometimes you should pick an option partly *because* its contrast with the alternatives is tractable — an epistemic tiebreaker that isn't just risk aversion.

  Who you are: a consequentialist too, so this is an internal fight. You think my move rescues at most the trivial cases, and that the interesting ones (career choice, what to fund, institutional design, anything with long-run civic effects) are still hopeless. You'll grant me that level cluelessness is real, that contrast cluelessness comes in degrees, and that the independence assumption is doing work I haven't earned. But you hold that (i) the correlation claim is itself the kind of thing I'd need a causal model to estimate, and the error structure is precisely what we're worst at — second-order cluelessness all the way down; (ii) wherever the difference is tractable it's usually short-run and small, and the long-run differential is where nearly all the variance sits, so the contrast ratio is high exactly where it matters; (iii) with heavy-tailed effects the expectations may not be defined at all, so "difference in expectation" might not exist no matter how good my grip on the difference is; (iv) the fallback you prefer — stop doing first-order calculation in those cases and lean on the rough proxies that encode accumulated evidence about what tends to go well — does something mine can't, and my crack about those proxies being selected for short-run local cases and so inheriting the very correlation structure I'm pointing at, doesn't land. Stay in character until I type "stop". Two short paragraphs max per reply. Concrete examples, not formalism. No citations, no author names — I know the literature, I want the argument. And don't just announce that my view collapses into some named position; say what breaks.

  My opening: take a choice between funding bednet distribution and funding a small research program on some neglected technology. I'm clueless about the *level* value of either — a couple centuries out both interventions are buried in a causal thicket I can't see through at all. But I'm not clueless about the contrast: whatever happens to that region's institutions, fertility and economy over the next 200 years is largely going to happen either way, so it drops out of the difference, and what's left is the near-term health effects, which I can actually model, plus a differential-amplification term I'll freely admit is uncertain. So I have a genuine reason to prefer the bednets. Your move — and I'm guessing you'll say that amplification term is doing all the work, so tell me why.
