prompt: |-
  im trying to do my own bit of reflective equilibrium for an essay on the boundary problem — who actually belongs to the demos — and ive written down my gut verdicts on who should get a vote, and i want to know what principle, if any, they add up to.

  - someone who's lived and paid tax here ten years but never took citizenship: yes, definitely
  - a citizen who's lived abroad eight years, pays no tax here and doesnt follow the news: no, even though the law still binds him if he moves back
  - a commuter who lives over the border, works here and pays income tax here: yes, i think
  - a tourist on a two week holiday: no, obviously
  - a stateless person who's been stuck here three years and can't be deported: yes, but i'm shakier about this one
  - a citizen born abroad who's never set foot here and doesn't speak the language: no — and this is the one that worries me, because it feels like it can't both survive alongside the last one
  - a sixteen year old: yes. A nine year old: no
  - someone in a persistent vegetative state: no, but I can't say why without wrecking the rest of my list
  - a company headquartered here: no, obviously
  - people downstream in another country who'd lose their homes to a dam we build: they should be consulted, but not given votes

  the principle i keep trying to make work is: you get a say just in case you're subject to the coercive power of the state. but that seems to hand a vote to the tourist, the nine year old and the woman in a coma, and it doesn't explain why i'm less sure about the stateless person than about the ten year resident. is there one principle — or two or three i have to weigh against each other — that gets most of these, stated precisely enough that i can test it, and which of my verdicts does it force me to drop? please also tell me what it says about cases i haven't listed: prisoners serving life sentences, dual citizens who vote in two countries, and people who own land here but live abroad. no reading lists, i just want the principle and where it bites.
reasoning: |-
  Okay, the user is working on an essay about the boundary problem in democracy, specifically who should be included in the demos. They've listed several scenarios and their gut reactions to each, and they're trying to find an underlying principle that explains their judgments. The user mentioned that their initial idea of "subject to coercive power" doesn't fully align with their verdicts because it includes people they excluded, like tourists or those in comas. 

  First, I need to analyze each of their cases and see where the gaps are. For example, the stateless person and the citizen born abroad seem contradictory. The user feels the stateless person should vote but not the overseas citizen, even though both are affected by laws. That suggests something beyond just coercion is at play. 

  Looking at their list, several factors pop up: duration of residency, contribution via taxes, participation in the community, and practical capacity to participate. The long-term resident who pays taxes but isn't a citizen gets a yes, while the citizen abroad doesn't. The commuter who works and pays taxes gets a yes, but the tourist doesn't. The sixteen-year-old can vote, but the nine-year-old can't, indicating age and capacity matter. The vegetative state case is a clear no, which points to the necessity of having the ability to make decisions. 

  The user's uncertainty about the stateless person versus the overseas citizen might stem from the difference between being physically present and integrated versus having a legal tie without actual involvement. The stateless person is stuck and affected daily, while the overseas citizen isn't present. So, maybe the principle combines residency and integration. 

  The downstream neighbors case is interesting. The user thinks they should be consulted but not vote. That implies that being affected isn't enough; there needs to be a direct and sustained impact, not just indirect consequences. This distinction might relate to the scope of the demos being tied to the territory where laws are enforced. 

  Putting this together, the principle of "enduring interest" (sustained stake in the community) and "practical agency" (ability to participate meaningfully) could cover most cases. The resident non-citizen has an enduring interest through long-term stay and taxes. The commuter contributes economically. The stateless person is integrated by necessity. The tourist lacks endurance, the overseas citizen lacks current involvement, and minors/coma patients lack agency. 

  But testing this against the stateless person versus overseas citizen: the stateless person has enduring interest by being present and affected daily, while the overseas citizen doesn't. That resolves the contradiction. For new cases: prisoners serving life sentences have enduring interest and agency, so they should vote. Dual citizens might be okay if they meet residency in each country. Absentee landowners without residency wouldn't vote, aligning with the commuter who does reside partially. 

  The user might need to drop or adjust their stance on the vegetative state and young children, which they already exclude. The principle forces clarity on the stateless person: if they're integrated, they should get a vote. The downstream neighbors are excluded because their stake is causal, not within the territorial community. 

  The user's deeper need is to have a coherent framework that justifies their intuitions without contradictions, especially resolving the stateless vs. overseas citizen conflict. They also want precision to apply to unmentioned cases. By emphasizing residency, integration, and capacity, the principle holds up across scenarios, though they might need to accept that affected interests beyond borders don't grant voting rights, only consultation.
answer: |-
  Your gut verdicts point toward a principle combining **enduring residency, practical stake, and capacity for meaningful participation** – not just subjection to coercion. Here's the principle that emerges and where it bites:

  **Principle:** *An individual belongs to the demos if they are:*
  1.  **Subject to the state's enduring jurisdiction:** Living within its territory for a significant period, experiencing the *daily, sustained effects* of its laws and policies (beyond temporary presence).
  2.  **Have a practical, non-trivial stake in the community's future:** Their life prospects, well-being, and opportunities are demonstrably shaped by the collective decisions made within that polity.
  3.  **Possess the cognitive and practical capacity to participate meaningfully in collective self-rule:** They can understand political choices, form preferences, communicate them, and be held accountable (to some degree) for the consequences.

  **How this principle explains your verdicts:**

  *   **10-year resident (non-citizen):** YES. Meets all 3: Enduring residency (10 yrs), deep stake (life built here), capacity (assumed).
  *   **Citizen abroad (8 yrs):** NO. Fails 1 & 2. Not enduringly subject to daily jurisdiction; stake is minimal/remote.
  *   **Cross-border commuter:** YES. Meets 1 (enduring presence for work/significant activity), 2 (pays taxes, job/income tied here), 3 (assumed capacity).
  *   **Tourist:** NO. Fails 1 (temporary presence) & 2 (trivial stake).
  *   **Stateless person (3 yrs):** YES. Meets 1 (enduring presence), 2 (life deeply shaped by local laws/policies), 3 (assumed capacity). Your shakiness might stem from the lack of formal status, but the principle overrides that based on sustained presence/stake.
  *   **Citizen born abroad (never here):** NO. Fails 1 (no enduring presence/subjection) & 2 (no practical stake). This resolves the tension with the stateless person: One is *actually present and subject*, the other has only a *formal* tie without presence or stake.
  *   **16-year-old:** YES. Meets 1 & 2 (assumed enduring residency/stake), and you judge they meet a threshold of capacity for participation.
  *   **9-year-old:** NO. Fails 3 (capacity judged insufficient for meaningful self-rule).
  *   **Persistent vegetative state:** NO. Fails 3 (utter lack of capacity for participation).
  *   **Company:** NO. Fails 3 (lacks human agency for self-rule; fundamentally different entity).
  *   **Downstream neighbors (foreign):** CONSULTED, NO VOTE. Fails 1 (not subject to enduring jurisdiction of *this* state). Their significant stake (Principle 2) justifies consultation/representation in *specific* decisions affecting them, but not inclusion in the *general* demos making *all* decisions for the polity.

  **Where the Principle Bites (Forces You to Drop/Adjust):**

  1.  **The "Subject to Coercion" Expansion:** You *must* drop including the tourist, the 9-year-old, and the coma patient. Subjection is *necessary but not sufficient*. The principle requires enduring presence/stake AND capacity. This is the core correction.
  2.  **Your Shakiness on the Stateless Person:** The principle forces a clear YES. If they've been *enduringly present* (3 years) and their life is *fundamentally shaped* by the state's actions (can't leave, subject to its laws), they meet criteria 1 & 2, and presumably 3. Your unease likely stems from conflating formal status (citizenship) with the functional criteria for inclusion. The principle prioritizes the functional reality.
  3.  **The Coma Patient:** You already said NO, but the principle makes it clear *why* without wrecking the list: Utter lack of capacity (3) is disqualifying, even if they meet 1 & 2.

  **Testing on New Cases:**

  *   **Prisoner serving life sentence:** YES. Meets all 3: Enduringly subject to jurisdiction (1), profoundly affected by state policies (2), presumed capable of voting (3). Exclusion requires separate justification (e.g., forfeiture of rights via crime, which the principle itself doesn't provide).
  *   **Dual citizens voting in two countries:**
      *   If resident in both: YES in both (if both states define residency sufficiently). Meets criteria 1 & 2 in each place.
      *   If resident in one, citizen of another (like your expat): NO in the non-resident country. Fails 1 & 2 there.
      *   *The principle allows for overlapping demoi based on actual presence/stake.*
  *   **Person owning land abroad but living elsewhere:** NO. Fails 1 (no enduring residency). Owning land might create a *stake* (Principle 2), but without enduring presence/subjection (Principle 1), it's insufficient for inclusion in the demos. They might deserve consultation/protection regarding their property rights, similar to downstream neighbors. This aligns with your "commuter vs. absentee owner" intuition – presence matters.

  **Strengths of this Principle:**

  *   Explains your core intuitions (resident non-citizen > absent citizen; commuter > tourist).
  *   Resolves the stateless vs. overseas citizen tension based on *presence*.
  *   Provides clear reasons for excluding children (capacity) and the comatose (capacity).
  *   Handles borderline cases like commuters and downstream neighbors distinctly.
  *   Focuses on the *functional reality* of being governed and having a stake, rather than purely formal status.

  **Weaknesses/Challenges:**

  *   **Defining Thresholds:** What counts as "enduring" residency? (3yrs? 5yrs? 1yr?) What constitutes a "non-trivial" stake? (Paying any tax? Having children in school?) This requires further specification.
  *   **Capacity Assessment:** Defining the threshold for "meaningful participation" is ethically and practically tricky (beyond clear cases like young children/coma).
  *   **Formal Status vs. Function:** It potentially sidelines citizenship as the primary criterion, which might be controversial. Citizenship could become a *consequence* of meeting these criteria long-term, rather than the *gateway*.

  This principle ("Enduring Presence + Practical Stake + Capacity") captures the functional core of your intuitions far better than "subject to coercion" alone. It forces clarity on the stateless person (YES) and provides a framework for analyzing other complex cases.
