prompt: |-
  I cover science and ideas for a newspaper, which is apparently why I got appointed as one of the two lay members on the grants committee of a mid-sized medical research charity. We meet in a little over a week and I'm supposed to circulate a written recommendation beforehand, and I've drawn the hardest item on the agenda. It's a £3m pragmatic trial in our main funding area (a chronic inflammatory bowel condition) comparing two treatment strategies that are both already used in routine care — starting the expensive biologic drug early versus the usual step-up approach. The two clinicians on the committee wrote in pre-review that their own practice wouldn't change under either result, and the chair has now said that if nobody's mind is going to change we're just buying a very expensive fact. Then our health economist member, who is not a fool, invoked something he calls Good's theorem: for a proper Bayesian expected-utility maximiser the expected value of information can never be negative, because you can always just ignore what you learn, so refusing to buy evidence is never rational and declining this is a way of saying we'd rather not know. Half the committee finds that decisive; the other half thinks it's obviously sophistry and that our remit (we fund research "likely to improve patient outcomes") requires a plausible route to changed practice. I genuinely can't tell who's got it right, though my instinct is that the economist is leaning on a theorem that assumes things about us that we do not have.

  A few things I'd want the memo to deal with rather than wave away. First, our patient representative pointed out that the people who'd carry the trial's risks (and the burden of the four years) aren't the same people who'd get the benefit of anyone's better-informed decisions, and that a null result could be picked up by commissioners or insurers to de-fund a service that patients say they value — the economist's theorem seems to be about one decision-maker who also happens to be the one who gets the payoff, which is not our situation at all. Second, is the result even about information that *costs* anything? This isn't free; it's most of our discretionary budget for the cycle, and money here is money not spent on the three or four smaller studies we also have queued. Third — and this cuts against my own side — I don't entirely trust the clinicians' pre-review answers, since people are notoriously bad at predicting how they'd act on a result they haven't seen, and the national guideline body that actually sets policy for the health service is not in the room and hasn't been asked to say what it would do with each outcome. There's a real worry that "we only fund studies that would change our own behaviour" quietly becomes a licence to never test anything established.

  So: draft me the memo, 600–900 words, something I can circulate under my own name and defend in the room. I need an actual bottom line — approve, reject, or approve-with-conditions — with the conditions spelled out concretely (who has to pre-commit to what, by when, and what happens at the next funding round) rather than a menu of options. State the health economist's argument in its strongest form first, not as a strawman, since he's going to read this. Please take a definite position and argue for it: I don't want a balanced survey, I want to know which way to vote and why. Where you're relying on a contested reading of the theorem, or on some empirical claim about how clinicians or guideline panels actually behave, flag it in a line so I know what would change your mind. And no references, no reading lists, no "see X 1967" — I can't check them and neither can anyone else on the committee.
reasoning: |-
  Okay, the user is a science journalist serving as a lay member on a medical research grants committee. They need to draft a decisive memo recommending whether to fund a £3m pragmatic trial comparing two treatments for inflammatory bowel disease. The committee is split: some find a health economist's "Good's theorem" argument (that information always has non-negative value) decisive, while others insist funding must show a plausible path to changing practice.  

  First, unpack the core conflict:  
  - **Good's theorem** (Bayesian perspective): Argues refusing information is irrational since you can always ignore it.  
  - **Real-world counterarguments**:  
    1. **Patient burden/risk mismatch**: Current patients bear trial burdens while future patients benefit.  
    2. **Opportunity cost**: £3m could fund 3-4 smaller studies.  
    3. **Clinician self-reporting unreliability**: Doctors may overstate resistance to changing practice.  
    4. **Policy leakage risk**: Null results could be misused to restrict care.  

  The user’s hidden needs:  
  - They’re intuitively skeptical of the economist’s "clean" theorem but need rigor to counter it.  
  - Want to avoid committee groupthink (e.g., clinicians vetoing trials that challenge habits).  
  - Need concrete conditions for approval, not vague compromises.  

  Key insights for the memo:  
  1. **Reframe Good’s theorem’s limits**: It assumes a single rational actor, but here:  
     - Decision-makers (clinicians, payers) are fragmented.  
     - Risks/benefits affect different groups.  
  2. **Address opportunity cost**: Compare the trial’s scale to alternatives. £3m for one study vs. multiple projects?  
  3. **Leverage the guideline body gap**: The national policy-setters haven’t pre-committed—this is critical.  

  Strategic recommendation: **Approve with conditions**  
  - *Why not reject?* The "established practices shouldn’t be tested" concern is valid.  
  - *Why not full approval?* The patient rep’s risk-mismatch and policy leakage points are serious.  

  Conditions must be binding:  
  1. **Policy body pre-commitment**: The national guideline group must outline how they’d use each possible result *before* the trial starts.  
  2. **Patient safeguards**: Plan to mitigate misuse of null results (e.g., pre-emptively educating payers).  
  3. **Opportunity cost offset**: Fund smaller studies in parallel by reserving next-cycle funds.  

  How to structure the memo:  
  - Start by *fairly* presenting the economist’s argument (as requested).  
  - Systematically address the three "wave away" concerns with counterpoints.  
  - End with a clear "approve if X, else reject" ultimatum.  

  Final nuance: The user’s instinct about clinicians’ unreliable self-prediction is spot-on. Emphasize that the guideline body—not individual clinicians—is the real target for change.
answer: |-
  **MEMORANDUM**  
  **To:** Grants Committee, [Charity Name]  
  **From:** [Your Name], Lay Member  
  **Date:** [Date]  
  **Subject:** Recommendation: Pragmatic Trial on Biologic Timing in IBD (Agenda Item X)  

  ### I. The Core Argument for Funding: Good’s Theorem  
  Our health economist colleague’s argument deserves rigorous engagement. In its strongest form: *Any decision-maker maximizing expected utility should always value information non-negatively because they retain the option to ignore it.* Refusing to acquire evidence is thus inherently irrational—it implies a preference for ignorance. Under this view, rejecting this trial signals we actively avoid knowledge that could (even probabilistically) improve future decisions. Since both treatment strategies are already used, understanding their comparative effectiveness directly addresses our remit to fund research "likely to improve patient outcomes" by reducing uncertainty. Ignoring this theorem, he argues, would be an unscientific rejection of Bayesian rationality.  

  ### II. Why This Alone Is Insufficient: Three Critical Realities  
  While logically coherent, this theorem relies on assumptions misaligned with our practical context. It presumes a single, rational actor who both acquires information and bears its consequences. Our reality is fragmented:  

  1. **Patient Burden/Benefit Mismatch (as raised by our patient rep):**  
     The trial’s risks (e.g., treatment delays, side effects, 4-year commitment) fall on *current* patients. Benefits of better-informed decisions accrue to *future* patients. Critically, a null result could be weaponized by payers to restrict access to the expensive biologic—harming patients who value it. Good’s theorem ignores this externality. *If commissioners have a track record of misinterpreting null findings to cut services, this risk alone could negate the theorem’s value.*  

  2. **The £3m Isn’t "Free" Information—It’s a Scare Resource:**  
     Funding this trial consumes 80-90% of our discretionary budget, displacing 3-4 smaller studies. Good’s theorem assumes costless information; here, the cost is direct opportunity loss. If those smaller projects (e.g., mechanistic studies or patient-focused interventions) offer clearer pathways to near-term impact, this trial’s "option value" may not justify its scale. *The theorem’s validity hinges on unlimited resources—which we lack.*  

  3. **Clinician Predictions Are Unreliable, but Guideline Bodies Hold the Levers:**  
     The two clinicians’ pre-review (that their practice won’t change) is empirically shaky—physicians often overestimate their resistance to new evidence. However, individual clinicians don’t drive systemic change; national guideline bodies (e.g., NICE) do. Their absence here is pivotal. If they wouldn’t revise recommendations based on either outcome, the trial *is* a costly fact. Conversely, if they might act, the information has real value. *Without pre-commitment from policymakers, we risk funding a study everyone praises but no one uses.*  

  ### III. The Bottom Line: Conditional Approval  
  **I recommend we APPROVE this trial—but only if the following conditions are met by the next funding round (deadline: [Date]). If not, we REJECT it and reallocate funds.**  

  #### Conditions:  
  1. **National Guideline Body Pre-Commitment:**  
     The applicant must secure a written statement from [Relevant National Body, e.g., NICE/BSG] detailing:  
     - How they would update guidelines under each outcome (e.g., "If Strategy A is superior, we recommend first-line use in subgroups X, Y"; "If null, we affirm step-up remains standard").  
     - A timeline for implementation (e.g., draft revisions within 6 months of results).  
     *Why this matters:* This binds the ultimate decision-maker to act, transforming "information" into "impact." Without it, the trial is academically interesting but functionally inert.  

  2. **Safeguards Against Misuse of Null Results:**  
     The protocol must include a co-developed dissemination plan with patient groups to:  
     - Pre-emptively educate commissioners/insurers that "no difference" ≠ "no value" (e.g., via policy briefs, stakeholder workshops).  
     - Emphasize patient-reported outcomes (e.g., quality of life) in all result communications.  
     *Why this matters:* This mitigates the patient rep’s concern by reducing the risk of harmful misinterpretation.  

  3. **Opportunity Cost Mitigation:**  
     We reserve £500k–£750k from the *next* funding cycle (not this one) to support 1–2 high-priority smaller studies displaced by this award.  
     *Why this matters:* This forces us to weigh the trial’s long-term value against immediate alternatives. If smaller studies offer better returns, we compensate strategically.  

  ### IV. Why Not Reject or Unconditional Approval?  
  - **Rejection** risks endorsing clinician overconfidence and perpetuating untested practices—a failure of our remit. But approval without conditions ignores real-world harms and opportunity costs.  
  - **Unconditional approval** ignores the theorem’s fragility here: it assumes unified decision-makers and costless learning. We operate in a messy system where evidence can be ignored or misused. Conditions align the trial with our mission.  
  - **The economist’s theorem isn’t wrong—it’s incomplete.** It applies only if information can influence decisions *and* we control its use. Our conditions bridge that gap.  

  ### V. What Would Change My View  
  - If the guideline body refuses pre-commitment, the information lacks a credible user: **REJECT**.  
  - If patient groups confirm commissioners reliably ignore/distort null findings: **REJECT**.  
  - If opportunity-cost analysis shows smaller studies yield demonstrably higher impact: **REJECT**.  

  **Final Position:** This trial could meaningfully steer practice—but only if tied to real-world action. Conditional approval ensures we buy not just "facts," but *usable knowledge*. I will vote **YES** only if the above terms are met.  

