prompt: |-
  I'm in a reading group that meets jointly with the biostatistics department, and last week we did a session on Simpson's paradox. I came away with an argument I built myself, which I intended as a defence of the sure-thing principle and which now looks to me as though it proves far too much: either the principle is false, or no statistical comparison — pooled or stratified — ever supports any practical verdict at all. I'd like you to tell me which step to give up and what giving it up costs me.

  The argument runs like this. (1) Take the sure-thing principle: for any partition of the possibilities into E and not-E, if I prefer option A to option B conditional on E, and also prefer A to B conditional on not-E, then I prefer A to B outright. The usual way of enforcing it is dynamic — someone who violates it will pay to switch whichever way E resolves, so a book can be made against them across a sequence of choices. (2) Now take a textbook Simpson's paradox: a treatment and a control, an outcome like recovery, and a stratifying variable like severity of disease, where the treatment looks better than the control within the severe cases and also within the mild cases, and worse than the control once the table is collapsed. By (1), the stratum-wise verdict is the verdict and the pooled figure is a pure artefact of the weights: whenever the two come apart, the aggregate is what you discard. (3) But (1) quantifies over partitions without restriction, and partitions are things one can manufacture. Stratify instead on a variable that the treatment and the outcome both causally influence — a common effect of the two, the sort of conditioning that produces Berkson-style distortions — or on an intermediate milestone lying on the path between receiving the treatment and recovering; on such partitions the within-stratum comparisons can be made to come out the other way, favouring the control in every stratum. (4) Apply (1) to that partition and the control is now the rational choice, contradicting (2). (5) And this is not a special feature of contrived examples: for a given treatment–outcome comparison there is normally more than one usable partition, and reversal-partitions are easy to construct, so a sure-thing principle with an unrestricted quantifier hands down incompatible verdicts about the very same choice. Either the principle goes, or it applies to no partition at all — in which case step (2) was never licensed, and neither the stratified nor the pooled numbers ever tell anyone what to do. (6) That last claim is one I cannot accept: somehow people do learn from data which of two treatments is better.

  Somebody in the group said that the paradox cannot even arise for interventional probabilities, on the grounds that a pooled causal effect is a weighted average of the stratum-specific causal effects with weights that do not depend on which act you perform, and that a weighted average cannot fall outside the range of the things it averages. I could not see how that was supposed to help: steps (2) and (3) are stated over ordinary conditional probabilities, which is what anyone reading a table outside a causal-inference seminar is actually looking at, and I don't see why the weighted-average remark should stop me from applying the principle to a partition I constructed by conditioning on an effect of the treatment. So: which step do you reject? Tell me why the step you reject looked innocent, and price the alternatives for me — in particular, whether I would have to accept that stratifying on a mediator or on a common effect is as legitimate as stratifying on a confounder, whether I would have to give up the dynamic or money-pump style argument for the principle, and whether the real work is being done by some distinction between associational and interventional quantities that I haven't taken seriously. If I have to choose, I'd rather keep the sure-thing principle than keep the claim that reversal-partitions are always available, but I want to know what I'm paying either way — and I'd also like to know what my friend in biostatistics means when she says the whole thing isn't a paradox about probability at all but about which question you are asking.

  Please answer in continuous prose: no headings, no bullet points, no bold text, no tables, and no numbered list of your own, though you may refer to my steps by their numbers, and write it the way you would write to a colleague who is stuck rather than the way you would write on an exam script. Around seven hundred to nine hundred words.
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about Simpson's paradox and the sure-thing principle. They've constructed an argument that seems to show the sure-thing principle leads to contradictions when applied to different partitions, and they're asking which step to abandon. 

  The heart of their dilemma is that they want to preserve both the sure-thing principle and the practical utility of statistical comparisons. I notice they're intellectually honest about preferring to keep the sure-thing principle if forced to choose. Their biostatistics friend's comment about interventional probabilities seems important but they didn't fully grasp how it resolves the paradox.

  What makes this tricky is that all their steps are logically sound within their framework - the problem lies in the framework itself. Step (3) is where the error creeps in, but not because it's wrong mathematically. The issue is treating all partitions as equally valid for decision-making, when in reality we need causal reasoning to determine which partitions are appropriate.

  The user clearly understands the technical aspects but might be underestimating how fundamentally the paradox challenges naive application of conditional probabilities. Their frustration is palpable - they know people learn from data, but their argument seems to show this shouldn't be possible. This suggests the solution must lie in recognizing that not all conditional probabilities are created equal when making causal decisions.

  The biostatistics friend was pointing in the right direction - the distinction between associational and interventional quantities is crucial here. When we talk about treatment decisions, we're inherently in the realm of intervention. The user's step (2) only works for pre-treatment covariates, not for mediators or colliders. 

  I should emphasize that giving up step (3) doesn't mean abandoning the sure-thing principle - it means recognizing its domain of application. The money-pump argument still holds when conditioning on appropriate partitions. The cost is that we must accept causal reasoning as fundamental to decision-making, not just probabilistic reasoning.

  The user might worry this makes statistics less objective, but actually it clarifies why we need study designs and causal assumptions. Their intuition that reversal-partitions shouldn't be legitimate is correct - we just need formal grounds to exclude them, which causal theory provides.
answer: |-
  Your argument is a sharp and troubling one, and you’re right to feel it threatens to unravel the foundations of practical decision-making from data. The tension arises because the sure-thing principle (STP) — compelling in isolation — collides with the reality that not all partitions are created equal for causal inference. The step to surrender is **(3)**, specifically the idea that applying the STP to *any* manufactured partition, regardless of its causal relationship to treatment and outcome, yields a legitimate verdict for action. This step *looks* innocent because the STP’s quantifier over partitions is indeed unrestricted in its original Savage formulation, and conditioning mathematically on any variable is possible. However, accepting this step without restriction leads directly to the contradiction you’ve identified, rendering statistical comparisons useless. Giving up this unrestricted application isn’t abandoning the STP; it’s recognizing that its meaningful application depends on the *causal role* of the partitioning variable relative to the treatment and outcome.

  Here’s why and what it costs:

  **(1)** and the dynamic/money-pump argument for the STP remain sound **for fixed acts with well-defined consequences under uncertainty**. The STP governs coherent preference ordering under uncertainty. If you genuinely prefer A over B no matter whether E or not-E happens, then you should prefer A over B before knowing E. Violating this *does* make you dynamically incoherent and pumpable within a sequence of choices where E is revealed sequentially. This core logic is intact.

  The problem arises when we try to apply **(1)** to *statistical evidence* about *causal effects* in **(2)** and **(3)**. The STP deals with your preferences over acts *given* known probabilities. Statistical comparisons (like recovery rates under treatment vs. control) are attempts to *estimate* those very probabilities – specifically, the probabilities that would result *if you performed the act* (e.g., administered the treatment). This is the crucial shift from Savage’s world of known probabilities to the real world of estimating causal effects from data.

  **(2)** works – the stratum-wise verdict should prevail over the pooled verdict in a textbook Simpson’s paradox – **only when the stratifying variable is a pre-treatment confounder**. In this case, the within-stratum comparisons (e.g., recovery rates conditional on disease severity) provide unbiased estimates of the *causal effect within those strata*. The pooled estimate is biased because it averages these effects using weights distorted by the confounding (e.g., the treatment group has a different severity mix). Applying the STP here is appropriate: if treatment is better for severe cases *and* better for mild cases (based on the stratum-specific causal effect estimates), then you should prefer it outright, as the pooled figure misleads due to confounding. The STP reinforces the need to condition on confounders to get valid causal effect estimates.

  **(3)** is where the innocent-looking step fails. Conditioning on a mediator (an effect of treatment on the path to outcome) or a collider (a common effect of treatment and outcome, like Berkson’s paradox) **does not** provide estimates of the *causal effect of the act*. It estimates a *conditional association* that mixes the causal effect with other pathways or induces spurious associations.

  *   **Conditioning on a Mediator (e.g., an early biomarker):** This blocks part of the causal path from treatment to outcome. The within-stratum association compares treatment vs. control *among individuals who have already achieved the same mediator value*. This often *attenuates* or even *reverses* the estimated effect because you’re comparing groups where the treatment’s *primary pathway* has already been equalized (or differentially affected). You are no longer estimating the *total effect* of administering the treatment.
  *   **Conditioning on a Collider (Common Effect):** This induces a non-causal association between treatment and outcome *within the strata*. For example, conditioning on hospital admission (a common effect of severe disease/treatment and other factors) can create a spurious negative association between treatment and recovery *within the admitted stratum*, even if treatment is beneficial overall. This is Berkson’s paradox. The within-stratum association is biased and does not reflect the causal effect.

  **Applying the STP to partitions defined by mediators or colliders leads to irrational decisions because the conditional preferences derived from these partitions (A better than B given Mediator=High, A better than B given Mediator=Low) do not reflect the actual causal consequences of choosing A or B.** The "preference" derived from these distorted estimates is an artefact of the conditioning, not a reflection of the true desirability of the acts. The dynamic coherence argument doesn’t bite here because the "preferences" conditional on E (the mediator/collider stratum) are based on a faulty assessment of the consequences – they are not your true preferences over outcomes given the state of the world (E), but a miscalculation of those preferences induced by conditioning on a causally inappropriate variable. The money-pump scenario fails because the conditional "preferences" aren’t stable or genuine reflections of value.

  **The Cost and the Resolution:**

  Giving up the unrestricted application in **(3)** means accepting that **the validity of applying the STP to stratified statistical comparisons hinges entirely on the causal role of the stratifier.** You *must* distinguish between:

  1.  **Confounders (Pre-treatment covariates):** Conditioning is necessary and appropriate. STP applied to strata defined by confounders supports the causal verdict.
  2.  **Mediators:** Conditioning biases the estimate of the *total effect* of the treatment act. STP should not be applied to such strata for deciding on the treatment itself (though it might be relevant for understanding mechanisms).
  3.  **Colliders:** Conditioning induces spurious associations. STP application leads to nonsensical verdicts and must be avoided.

  **The real work *is* being done by the distinction between associational and interventional quantities.** Your biostatistics friend is correct on two fronts:

  *   **"Not a paradox about probability":** Mathematically, Simpson's reversal is just about different conditional associations. There's no contradiction in probability theory itself.
  *   **"About which question you are asking":** The crucial question for decision-making is: "What is the *causal effect* of taking action A versus action B?" The pooled association asks this naively and gets it wrong when confounding is present. Stratifying on a confounder asks it correctly *within strata*. Stratifying on a mediator asks a *different question* ("What's the effect of A vs B *after fixing the mediator*?"), which isn't the same as the effect of *doing A vs B*. Stratifying on a collider asks a nonsensical question corrupted by selection bias. The "paradox" arises when we conflate these distinct questions. The STP, when applied correctly, helps enforce the answer to the *causal* question when conditioning on confounders, but misapplies associational answers from other questions if used indiscriminately.

  **What you keep:** The STP itself, the money-pump argument for coherent preferences under uncertainty, and the legitimacy of stratified comparisons for causal inference *when stratifying on confounders*. You also keep the insight that reversal-partitions (via mediators/colliders) are *easy to construct associationaly* but recognize they are *causally illegitimate* for estimating the total effect of the treatment act.

  **What you pay:** You must engage with causal reasoning. You cannot rely purely on associational patterns (conditional probabilities in tables) or an unrestricted STP to tell you what to do. You need substantive knowledge (or study design like randomization) to identify which variables are confounders (must condition on), mediators (generally should not condition on for total effect), or colliders (must avoid conditioning on). The price is accepting that statistics alone, without causal assumptions or designs, cannot definitively answer "what should I do?" from observational data. Your friend’s point about interventional probabilities (e.g., \(P(Y | do(T))\) ) is the formalization of this: under intervention, the pooled effect *is* a weighted average of stratum effects when stratifying on pre-treatment covariates (confounders), and thus cannot reverse. But this requires committing to the causal framing. Your argument brilliantly exposes why this commitment is necessary for the STP to yield sensible practical verdicts from data.
