  - T: Transparent Newcomb. Like N, but the prediction is printed on the sealed box and you read it. Predictor knew you would read it.
  - X: Extortion. A perfect simulation of you has been run. Independently, with 50% chance, a catastrophe is already set (you can't affect it). You get a demand letter if exactly one of: simulated you paid, or catastrophe is coming. The demand is in your hand. Catastrophe costs much more than the demand.
  - M: Coordination. You and a copy (same code, same inputs, isolated) each face a sealed box. Your box is full iff your choice differs from the copy's. Both know the setup.
  - C: Clueless. Box filled by a public lossy model of you: for agents who don't think about decision theory, it matches; for those who do (like you), it outputs the opposite. Box full iff model output one-box.
  - G: Gene. You have a gene that causes a harmless habit and raises risk of a painful illness. Quitting the habit doesn't affect the illness. No prediction.
