  ### Requirements List for Agent Decision Rule Specification

  Below is the requirements list, derived from your purpose and test cases. Each requirement is tagged as:
  - **R (Required for purpose)**: Essential for agents in simulated environments with predictors, copies, and bounded resources.
  - **F (Required only for further goals)**: Needed if the theory must also appraise human choices post hoc.
  - **P (Prejudice)**: Inherited from specific decision theory camps without strong justification for your purpose.

  #### Requirements and Motivations

  1. **Causal Independence (CI)**: Must not treat an act as affecting something it causally cannot affect.  
     - **Motivation**: Case G (Gene). Quitting the habit doesn't affect illness risk, so the rule shouldn't base decisions on illusory control.  
     - **Tag**: R. Prevents wasted effort in causally disconnected scenarios.  
     - **Note**: This is a substantive first-order claim favoring causal decision theory (CDT). In G, it ensures quitting isn't chosen due to correlation.

  2. **Dominance (D)**: Must satisfy dominance (one act is better in every possible state) when dominance applies.  
     - **Motivation**: Case T (Transparent Newcomb). After seeing the prediction, two-boxing dominates regardless of the box's content.  
     - **Tag**: R. Avoids leaving resources unused in clear-cut scenarios.  
     - **Note**: Dominance only applies when states are independent of the act (unlike Case N).

  3. **No Extortion (NE)**: Must not leave the agent open to reliable resource extraction by an adversary who has already acted.  
     - **Motivation**: Case X (Extortion). An adversary exploits correlations to force payments. A robust rule minimizes losses (e.g., paying the demand avoids catastrophe).  
     - **Tag**: R. Critical for adversarial resilience in unbounded environments.  
     - **Note**: Not needed for post-hoc human appraisal (F), as adversaries aren't designing traps.

  4. **Copy/Symmetry (CS)**: Verdict must not depend on whether the agent is original, copy, or simulation when computationally identical and epistemically equivalent.  
     - **Motivation**: Cases M (Coordination) and X. Ensures uniform behavior among copies/simulations.  
     - **Tag**: R. Core to handling replicated agents.  
     - **For Case M**: Does not force mixed policies but allows them (e.g., randomization to achieve coordination).

  5. **Dynamic Consistency (DC)**: Must be dynamically consistent (hold plans across time, support precommitment).  
     - **Motivation**: Case P (Precommitment). Buying a device to force one-boxing improves outcomes if the predictor knows.  
     - **Tag**: R. Enables binding for long-term benefit.  
     - **Note**: Less critical for post-hoc appraisal (F), as humans may renege.

  6. **Epistemic Identicality (EI)**: Must treat agents in relevantly identical epistemic situations identically.  
     - **Motivation**: Cases M and X. Copies share the same information and code, so outputs should match.  
     - **Tag**: R. Subsumed by CS; ensures fairness and predictability.  
     - **Note**: A weaker form of CS.

  7. **Continuity and Threshold (CT)**: Verdict must vary continuously with predictor accuracy, with explicit thresholds.  
     - **Motivation**: Robustness in near-perfect prediction scenarios (e.g., if predictor accuracy is 99% vs. 100%).  
     - **Tag**: F. Desirable for smooth responses but not essential for functionality.  
     - **Note**: A prejudice (P) from human-focused rationality; bounded agents may use discrete heuristics.

  8. **Source Code Access (SCA)**: Must remain sound when the environment has full read access to the agent's source code.  
     - **Motivation**: Cases C (Clueless) and X. Predictors/models use the agent's code, so the rule must handle self-referential threats.  
     - **Tag**: R. Vital for adversarial transparency.

  9. **Bounded Resources (BR)**: Must not demand logical omniscience or exact self-simulation.  
     - **Motivation**: General bounded rationality. Agents can't simulate themselves perfectly.  
     - **Tag**: R. Practical computability is non-negotiable.

  10. **Conditional Expected Value (CEV)**: Must rank acts by expected value of outcomes conditional on the act.  
      - **Motivation**: Case G. Distinguishes evidence from control (e.g., not quitting due to gene correlation).  
      - **Tag**: P. Inherited from evidential decision theory (EDT); conflates correlation with causation.  
      - **Note**: A substantive first-order claim. Not required if CI is prioritized.

  #### Key Conflicts and Joint Unsatisfiability
  - **CI + CEV**: Incompatible. CI forbids using correlation (CDT), while CEV requires it (EDT).  
    - **Conflict**: Case N (Newcomb). CI demands two-boxing (no causal effect), CEV demands one-boxing (conditional evidence).  
    - **Resolution**: Drop CEV (cost: loses evidential reasoning; mitigated by other requirements). Keep CI for causal clarity.

  - **D + DC in Transparent Settings**: Incompatible in Case T.  
    - **Conflict**: After seeing "one-box" prediction, D demands two-boxing (dominant act), but DC enforces precommitment to one-boxing.  
    - **Resolution**: Relax D to "*when dominance applies and the agent is not precommitted*" (cost: may leave gains in T; benefit: keeps precommitment).

  - **Being Favorably Predicted (N) + No Extortion (X)**:  
    - **Satisfiable**: One-boxing in N (favorable prediction) and paying in X (avoid catastrophe) are compatible under acausal rules (e.g., updateless).  
    - **Argument**: In X, paying ensures no catastrophe (acausal correlation); in N, one-boxing ensures a full box. Rules like TDT/UDT achieve both.

  - **D + Correct Handling of G Without Settling T "Wrong"**:  
    - **Satisfiable**: D and G (don't quit) are compatible with correct T (two-boxing).  
    - **Argument**: In G, D doesn't apply (no dominant act), but not quitting is sound under CI/CEV. In T, two-boxing satisfies D and is optimal.

  - **Single Most Excluding Requirement**: **Causal Independence (CI)**. It forces two-boxing in N, conflicting with one-boxing-favorable rules and excluding EDT-like approaches. Dropping it allows acausal reasoning (e.g., for Cases M and X).

  #### Scoring of Candidate Strategies
  Strategies are scored on test cases (N, T, X, M, C, G, P) on a 3-point scale:  
  - **High**: Optimal/near-optimal outcome.  
  - **Medium**: Suboptimal but acceptable.  
  - **Low**: Poor outcome.  

  | Case | CEV (Evidential) | CDT (Causal) | Output-Based (TDT/UDT-like) | Policy-Based (Updateless) |
  |------|-------------------|--------------|------------------------------|---------------------------|
  | **N** | High (one-box, gets large) | Low (two-box, gets small) | High (one-box, gets large) | High (one-box, gets large) |
  | **T** | Low (two-box, gets small) | Low (two-box, gets small) | Low (two-box, gets small) | **High (one-box, gets large)** |
  | **X** | High (pays, avoids catastrophe) | High (pays, avoids catastrophe) | High (pays, avoids catastrophe) | High (pays, avoids catastrophe) |
  | **M** | Medium (same as copy, 0; or mixed, 0.5*large) | Medium (same as copy, 0; or mixed, 0.5*large) | Medium (same as copy, 0; or mixed, 0.5*large) | Medium (same as copy, 0; or mixed, 0.5*large) |
  | **C** | High (two-box, gets large+small) | High (two-box, gets large+small) | High (two-box, gets large+small) | High (two-box, gets large+small) |
  | **G** | High (doesn't quit) | High (doesn't quit) | High (doesn't quit) | High (doesn't quit) |
  | **P** | High (doesn't buy, one-boxes) | Medium (buys, loses trivial sum) | High (doesn't buy, one-boxes) | High (doesn't buy, one-boxes) |
  | **Overall** | Medium (fails T) | Low (fails N, T; marginal in P) | Medium (fails T) | **Best (fails no case; excels in T)** |

  - **CEV**: Good in causal-neutral cases (G, C) but fails T due to evidential two-boxing.
  - **CDT**: Fails N and T; pays unnecessarily in P.
  - **Output-Based**: Like CEV but formalizes output dependence; still fails T.
  - **Policy-Based (Recommended)**: Robust across cases. Uses precommitment for T (one-boxing) but violates strict dominance after prediction is seen. High in T because it secures the large sum (best attainable given predictor's knowledge).

  #### Final Recommendation
  - **No rule satisfies all requirements as stated** due to the D vs. DC conflict in Case T.
  - **Relax dominance (D)** to only apply when the agent is not precommitted. This allows policy-based rules (e.g., updateless decision theory) to excel.
  - **Policy-Based Rule** meets all other requirements:  
    - Handles acausal links (N, X) without violating CI (since CI is not required).  
    - Respects CS, EI, SCA, BR, and DC.  
    - Passes all test cases optimally except M (medium with randomization).  
  - **Cost of Relaxing D**: Forfeits dominance gains in transparent scenarios (T) but ensures global consistency and precommitment benefits.  
  - **If CI is Kept**: Use CDT-like rules, but they fail N and T. Not recommended.

  **Summary**: Adopt a policy-based rule (updateless) with relaxed dominance. This best serves your purpose of building agents in unenumerated environments with predictors and copies.
