prompt: |-
  Hey — I'm a backend engineer, no philosophy background beyond some half-remembered LessWrong from 2013, and I've somehow agreed to run a 45-minute brown-bag at work (plus ten minutes of questions, whiteboard, no slides) on Good's theorem — the one that says a certain kind of agent can never lose, in expectation, by getting information for free. Audience is around fifteen engineers, all stats-literate, all have shipped A/B tests, none have had decision theory. Two of them are guaranteed to derail into p-values, and one of them will say "so this is why we can peek at the experiment early" within the first ten minutes.

  I don't need you to explain the theorem to me. I need you to plan how I explain it to them, and I need the plan to survive the room.

  Specifically:

  **The dependency order.** What has to be on the board before the statement of the theorem is even intelligible, and in what order, and what breaks if I reorder it. My guess is that the load-bearing thing is the idea that information only has value through the possibility of it changing what you'll do — that a free, perfectly accurate tip-off that would leave your action unchanged is worth exactly nothing, however shocking it is — and that if I don't get that in place first the theorem just sounds like "knowledge is power" with extra steps. Tell me if that's the right first piece or if something else has to come before it, including whether "expected utility maximizer" needs to be cashed out at all at this level or whether it's enough to gesture at it.

  **The carrying example.** I want one example that does the whole session, not three. What should it have, and — more usefully for me — what must it *not* have? My instinct is it needs a small action set and a small number of states, so people can literally enumerate the cases, and it needs to be a case where the info arrives before you act and nothing else changes. I'm also fairly sure it must not involve another agent who reacts to you, or your own future self, or any rule about what you're allowed to do once you know. Confirm or kill those constraints.

  **The misconception map, with placement.** Not a list to bolt on at the end — for each one, the exact point in the sequence where it should be defused, and why there rather than earlier. The ones I'm expecting: that the theorem says to go buy the data / commission the study; that it says you should always deliberate longer or gather more before deciding; that it says more information is *strictly* better when it actually only gets you non-negative; that it retroactively licenses optional stopping and mid-flight peeking at the experiment; and the p-values guy. Give me the ones I'm not expecting too.

  **The case I actually care about.** Here's the thing I can't place, and it's the reason I'm writing this instead of just winging it. There's a version of this that keeps coming up in our incident reviews and it doesn't feel like the theorem covers it: the information is free, it arrives, but it arrives *with a rule stapled to it* — we have to log it, or we're on call and policy says that if the error rate crosses a number after the deploy we roll back, no judgement allowed, or we have to hand the number to a customer. The info isn't just landing in my beliefs; it's changing the menu of things I'm permitted to do, or what someone else gets to do with it. My diagnosis is that the theorem quietly assumes the info reaches me *only* through what I believe, and that once it also rewires the action set or leaks to another agent who moves after me, all bets are off. Is that the right way to cut it, is there a standard name for the assumption I'm pointing at, and — the part I really want — where does this case go in the sequence? My worry is that if I open with it, people think the theorem is some ivory-tower thing that doesn't apply to real dashboards, and if I close with it, it reads as a footnote to an hour of "info is always good."

  **The check.** One question I can put to the room at minute 50 that separates people who got it from people who were nodding. Ideally something they'd answer *differently* if they'd only absorbed the slogan.

  **What I should refuse to explain out loud.** What to cut at this level — and what to explicitly say I'm cutting, so nobody thinks I dodged it.

  And the part I care about most: tell me where this plan is most likely to fail. Where is my framing of the whole session wrong or misleading in a way a decision theorist would wince at? What would change your mind about the ordering — and if you think the "value comes from the possibility of changing your action" framing is itself a trap rather than the key, say so and say why rather than building the session around my guess.
reasoning: |-
  We are preparing a 45-minute brown-bag session (plus 10 minutes Q&A) on Good's theorem for a group of stats-literate backend engineers. The goal is to make the theorem intelligible and to preempt common misconceptions. We'll structure the session as follows:

  ### Overall Structure (55 minutes total)
  1. **Introduction (5 min):** Set up the problem and the key insight.
  2. **Core Example (15 min):** Walk through a concrete example to illustrate the theorem.
  3. **General Statement (5 min):** State the theorem formally.
  4. **Implications and Misconceptions (15 min):** Discuss what the theorem means and doesn't mean, addressing expected derailments.
  5. **The Case with Rules (10 min):** Discuss the limitation when information comes with rules that change the action set or involve other agents.
  6. **Check Question (2 min):** A quick check for understanding.
  7. **Q&A (10 min):** Open floor.

  Now, let's break down each part.

  ---

  ### 1. Introduction (5 min)

  **Goal:** Motivate the theorem and establish the key insight: the value of information comes from the possibility of changing your action.

  **Key Points:**
  - We are decision-makers. We choose actions to maximize expected utility (EU). We have beliefs about the world (states) and know the utility of outcomes (which depend on state and action).
  - Sometimes we can get more information before acting. But information isn't free in the real world (it costs time, money, etc.). However, Good's theorem is about what happens when information is free and perfectly accurate.
  - **The Key Insight:** Information is valuable only if it might change what you do. If you would do the same thing regardless of the information, then it's worthless (even if it's surprising). Example: 
    - Suppose you're deciding whether to carry an umbrella. If you learn the weather forecast and it doesn't change your decision (e.g., you were going to carry it anyway because you hate getting wet), then the forecast was worthless to you. But if it changes your mind (e.g., you were going to leave it but then you hear it will rain), then it has value.

  **Why start here?** Without this insight, the theorem sounds trivial ("more info is better"). This establishes that the value is tied to the potential for action change.

  **What not to do:** Don't get into the math of expected utility maximization beyond the basics. Gesture at EU as "we choose actions based on what we believe and what we want." 

  ---

  ### 2. Core Example (15 min)

  **Goal:** Use a single, simple example to demonstrate the theorem step by step. We'll use a classic: the umbrella problem.

  **The Setup:**
  - **States:** Rain (R) or No Rain (N). You believe P(R) = 0.4, P(N) = 0.6.
  - **Actions:** Carry umbrella (C) or Don't carry (D).
  - **Utilities:**
    - If you carry and it rains: 10 (dry but hassle of carrying)
    - If you carry and no rain: 5 (hassle only)
    - If you don't carry and it rains: 0 (soaked)
    - If you don't carry and no rain: 15 (no hassle, dry)

  **Step 1: Without information**
  - EU(C) = 0.4 * 10 + 0.6 * 5 = 4 + 3 = 7
  - EU(D) = 0.4 * 0 + 0.6 * 15 = 0 + 9 = 9
  - Optimal action: D (EU=9)

  **Step 2: With free, perfect information (a weather oracle)**
  - If the oracle says "Rain", you choose C (since in rain, C gives 10 vs D gives 0). 
  - If the oracle says "No Rain", you choose D (since in no rain, D gives 15 vs C gives 5).
  - Expected utility of this strategy:
    - P(Rain) * EU(C|Rain) + P(No Rain) * EU(D|No Rain) = 0.4 * 10 + 0.6 * 15 = 4 + 9 = 13

  **Step 3: Value of information**
  - EU without info: 9
  - EU with info: 13
  - Value of information = 13 - 9 = 4

  **Why is this non-negative?** Because without information you get 9, with information you get at least 9 (in fact 13). How? Because if the information doesn't change your action, you get the same as before. If it does, you get more. So on average, you never do worse.

  **Constraints for the example:**
  - Small action set (2 actions) and small state space (2 states) to allow enumeration.
  - Information arrives before you act and is perfect (no noise).
  - No other agents, no changes to the action set or rules based on information. (We'll address that later.)

  **What to avoid:**
  - Don't use an example with sequential decisions or multiple agents (yet).
  - Don't involve costs of acquiring information (theorem assumes free).

  ---

  ### 3. General Statement (5 min)

  **Goal:** State the theorem formally.

  **Theorem (Good, 1967):** For any decision maker who is an expected utility maximizer, the expected utility of a decision with free information is at least as high as the expected utility without that information. Therefore, the expected value of (free, perfect) information is non-negative.

  **Key Assumptions:**
  - The information is free (no cost to acquire).
  - The information is about the state of the world and is perfectly accurate (no noise).
  - The decision maker updates beliefs correctly (by Bayes' theorem) and then chooses the action that maximizes expected utility given the new beliefs.

  **Why now?** After the example, the formal statement is grounded.

  ---

  ### 4. Implications and Misconceptions (15 min)

  **Goal:** Preempt derailments and clarify common misunderstandings. Address each at the point where it naturally arises.

  **Misconception Map:**

  1. **"So this is why we can peek at the experiment early?"** (Expected at minute 10, but we're in the implications section now)
     - **When:** Address this immediately after stating the theorem, because it's a hot button.
     - **Response:** No! Good's theorem assumes the information is perfect and free. In A/B tests, peeking introduces multiple testing issues and can lead to false positives (p-values go out of whack). The theorem doesn't say that partial or noisy information is always beneficial. It also doesn't override the statistical properties of your estimator. (We'll come back to this in the p-values derailment.)

  2. **"So we should always buy the data?"**
     - **When:** After discussing value of information.
     - **Response:** The theorem is for free information. Real information has costs. The value of information might be positive but less than the cost. Also, the theorem is about perfect information. With noisy data, it's more complex.

  3. **"So we should always gather more info before deciding?"**
     - **When:** After the above.
     - **Response:** No, because gathering information often has costs (time, money). The theorem says that if it's free and perfect, you can't lose. But if it's costly, you have to compare the value to the cost. Also, delaying a decision might have opportunity costs.

  4. **"Is more information always strictly better?"**
     - **When:** After the example, note that value was 4 (positive) but could be zero.
     - **Response:** The theorem says non-negative. It can be zero. Example: if in the umbrella problem, you were already going to carry the umbrella regardless, then the oracle's information has zero value.

  5. **P-values derailment (two people):**
     - **When:** Likely during the peeking discussion or Q&A.
     - **Response:** Good's theorem is about decision theory, not frequentist statistics. In A/B testing, if you peek and stop based on p-values, you inflate the type I error. The theorem doesn't justify that because:
       - The information in an A/B test is not perfect (it's a sample, not the true effect).
       - The decision to stop or continue is an action that changes the set of possible outcomes. The theorem assumes the information doesn't change the action set or the rules of the game. (This bridges to the "rules" case.)

  **Unexpected misconceptions:**
  - **"Does this apply to any information, even irrelevant?"** Yes, but if it's irrelevant, it won't change your action so the value is zero. But note: what's irrelevant depends on the decision. (Use the umbrella example: knowing the score of a football game is irrelevant to the umbrella decision -> value zero.)
  - **"What if the information is about my own actions?"** The theorem assumes the state is about the world, not about your own future actions. This is a different setup (we're not doing game theory or reflexive decisions).

  ---

  ### 5. The Case with Rules (10 min)

  **Goal:** Address the real-world concern where information comes with rules that change the action set or involve other agents.

  **The issue:** In incident reviews, sometimes information is free but comes with a rule: "if error rate > X, roll back." Or we have to log it, or a customer sees it and acts.

  **Why this breaks the theorem:** Good's theorem assumes:
  - The information only affects your beliefs and then you choose an action from the same set.
  - The world state doesn't change because of the information (no other agent reacts).

  In the rollback policy case:
  - The information (error rate) is free.
  - But the rule changes the action set: you are forced to roll back if the threshold is crossed. You lose the option to ignore it.
  - Also, if the customer sees the same information and acts, that changes the state of the world (their reaction) and thus the utilities.

  **Standard name:** This is a violation of the **exogeneity** of the information. The information is not just updating beliefs; it's changing the decision problem itself (the available actions or the consequences of actions).

  **Where to place this:** After the main theorem and misconceptions. It's a limitation, so don't start with it (to avoid making the theorem seem irrelevant). But don't leave it to the end as an afterthought. Frame it as: "The theorem is powerful but has assumptions. In real systems, we often have to consider when these assumptions break."

  **How to explain:** Use an example.
  - Suppose in the umbrella problem, if the oracle says "rain", you are forced to carry the umbrella (by policy). Without information, you would have chosen D (EU=9). With information and forced action:
    - If rain (prob 0.4): you carry (get 10)
    - If no rain (prob 0.6): you are forced to carry (get 5) -> wait, that's worse than without information (where in no rain you got 15)!
    - EU with forced policy: 0.4*10 + 0.6*5 = 4+3=7, which is less than 9.
  - So the information (with the rule) made you worse off.

  **Key takeaway:** When information comes with rules that constrain your actions or trigger other agents, the theorem doesn't apply. The value might be negative.

  ---

  ### 6. The Check Question (at ~minute 50)

  **Goal:** Test understanding.

  **Question:** "Suppose you're deciding whether to invest in Stock A or Stock B. You believe each has a 50% chance of going up. You'll make $100 if you pick the one that goes up, $0 otherwise. A free, perfect oracle tells you the outcome of a coin flip that's completely independent of the stocks. What is the value of this information?"

  **Why it works:**
  - Without info: EU of either stock is $50 (0.5*100 + 0.5*0). So you pick one arbitrarily, get $50 in expectation.
  - With info: The coin flip doesn't tell you anything about the stocks. So you still don't know which stock to pick. You still get $50.
  - Value = 50 - 50 = 0.

  **What reveals misunderstanding:**
  - If someone says "positive because more information is always good", they've missed that the information must have the potential to change the action.
  - If someone says "negative because it distracts you", they've overcorrected (but unlikely).

  ---

  ### 7. What to Refuse to Explain

  **Explicitly cut:**
  - **The proof:** We won't derive it formally. (But we did an example, which is a proof for a specific case.)
  - **Imperfect information:** The theorem extends to noisy information (value is still non-negative under similar assumptions) but we won't go there.
  - **Alternatives to expected utility:** We assume EU maximization. Other frameworks (like prospect theory) might not satisfy this.
  - **Information as a physical process:** We're treating information abstractly.

  **Say:** "We're focusing on the core idea and its limitations in real systems. We won't cover generalizations or proofs."

  ---

  ### Where the Plan Might Fail

  **Critique of the "value from action change" framing:**
  - It's a good intuition pump, but the theorem is more general. It also covers cases where information doesn't change the action but changes the distribution of outcomes (but in EU, if the action doesn't change, the EU doesn't change). So the framing is safe.

  **Potential pitfalls:**
  - **Engineers might think it's trivial:** Emphasize that the non-negativity is not obvious when you consider that information can force you into suboptimal actions in some branches (but on average it doesn't, because you choose optimally in each branch).
  - **Overconfidence in the theorem:** The session must stress the assumptions (free, perfect, no rule changes) and that real information often violates these.
  - **P-values derailment:** Be ready to shut down the peeking argument firmly but without dismissing the person. Use the "rules" case to bridge: peeking changes the decision process (it's not just updating beliefs) and the information is imperfect.

  **Decision theorist wince:** 
  - The theorem is often stated for a partition of states (like our example) but holds for any information structure. We skip that.
  - We assume perfect information. The case of noisy information (which also has non-negative value under the same assumptions) is skipped. This is acceptable for an intro.
  - The forced policy example is a bit of a hack because the rule is not part of the information per se, but the scenario is common enough to justify it.

  ---

  ### Final Timing Check
  - Intro: 5 min
  - Example: 15 min
  - Theorem: 5 min
  - Implications: 15 min
  - Rules case: 10 min
  - Check: 2 min (leaving 3 min buffer for transitions)
  - Q&A: 10 min

  Total: 52 min + 10 min Q&A = 62 min? We'll need to tighten. Adjust by:
  - Trim the example to 12 min.
  - Cut implications to 12 min.
  - Rules case to 8 min.

  But having a buffer for discussion is good. Be flexible.

  Good luck!
answer: |-
  ### Dependency Order: Building the Foundation
  1. **Start with the core insight (min 0-10):**  
     Lead with your instinct: "Information only has value if it *could* change your action. A free, perfectly accurate tip that doesn't alter what you do is worth **zero**, no matter how surprising."  
     **Why first?** Without this, the theorem sounds like platitudes ("knowledge is power"). This insight is the engine of the theorem. It forces the audience to think counterintuitively (e.g., shocking news can be worthless if it doesn't affect decisions).  
     
  2. **Expected utility maximizer (min 10-12):**  
     Casually define: "We're assuming an agent who:  
     - Has beliefs (probabilities) about states of the world,  
     - Knows utilities of outcomes (how good/bad actions are under each state),  
     - Chooses actions to maximize *expected utility* (EU)."  
     **Why here?** Anchor the theorem in a concrete agent model. No need for formal axioms; use the umbrella example (next) to illustrate.  
     
  3. **State the theorem (min 12-15):**  
     "Good’s theorem: For an EU maximizer, free, perfect information has **non-negative expected value**. You never lose (in expectation) by getting it."  
     **Why now?** The insight (#1) makes this non-obvious. EU (#2) shows *why* it holds: with info, you conditionally optimize actions.  

  **If you reorder:** Starting with the theorem first makes it seem tautological. Skipping the core insight risks "so what?" reactions. EU must come before the theorem but doesn’t need deep exposition—use the example to ground it.

  ---

  ### The Carrying Example: Umbrella Problem (Min 15-30)
  **Use this:**  
  - **States:** Rain (P=0.4) vs. No Rain (P=0.6).  
  - **Actions:** Carry umbrella (C) vs. Don’t carry (D).  
  - **Utilities:**  
    - C + Rain: 10 (dry but hassle)  
    - C + No Rain: 5 (hassle only)  
    - D + Rain: 0 (soaked)  
    - D + No Rain: 15 (perfect).  

  **Walk through:**  
  1. **Without info:**  
     - EU(C) = (0.4)(10) + (0.6)(5) = 7  
     - EU(D) = (0.4)(0) + (0.6)(15) = 9 → Choose D, EU=9.  
  2. **With free perfect forecast (e.g., oracle):**  
     - If oracle says "Rain": Choose C (EU=10 > 0).  
     - If "No Rain": Choose D (EU=15 > 5).  
     - EU(with info) = (0.4)(10) + (0.6)(15) = 13.  
  3. **Value of info:** 13 - 9 = 4 ≥ 0.  

  **Constraints (your instincts are correct):**  
  - **Must have:** Small action/states sets (2x2), info arrives before acting, no other changes.  
  - **Must NOT have:**  
    - Another agent (e.g., if a competitor sees your umbrella and acts).  
    - Your future self’s choices (e.g., "I’ll ignore the forecast").  
    - Rules forcing actions (e.g., "if forecast says rain, you MUST carry").  
    - Costs or noise (keep it free/perfect).  
  **Why?** These break the theorem’s assumptions (isolated decision, no exogenous constraints).  

  ---

  ### Misconception Map: Defuse Early and Often  
  Address **during the umbrella example** (not at the end). Derailments are predictable—tackle them when they naturally arise:  

  1. **"So this justifies peeking at experiments?" (min 20, when calculating EU with info)**  
     - **Defuse here:** "No—peeking introduces optional stopping, which breaks statistics (p-values explode). Good assumes *perfect* info; experiments give noisy data. More later."  
     - **Why here?** They’ll say it early. Nip it in the bud, but defer details to p-values discussion.  

  2. **"Should we always buy data?" (min 25, after value=4)**  
     - **Defuse here:** "No—the theorem says *free* info can’t hurt. Real data has costs. Value might be $0 but cost $100."  
     - **Why here?** Follows naturally from calculating value.  

  3. **"Is info always strictly better?" (min 27, after value=4)**  
     - **Defuse here:** Alter the example: "What if P(Rain)=0? EU(D)=15, info doesn’t change action → value=0. Still ≥0, but not better."  
     - **Why here?** Shows non-negative ≠ strictly positive.  

  4. **P-values derailment (min 30-35, during implications)**  
     - **Defuse here:** "Good’s theorem ≠ frequentist stats. If you peek and stop early based on p<0.05, you inflate error rates. Why? The info isn’t *perfect* (it’s a sample), and your decision rule (stopping) changes the game—violating the theorem’s assumptions."  
     - **Why here?** After the example, when discussing real-world apps.  

  5. **"Should we always gather more info?" (min 35, during Q&A prep)**  
     - **Defuse here:** "No—delaying decisions has costs (opportunity loss). Good assumes info is instant/free. Real world: if gathering takes time, EU might drop."  
     - **Why here?** When bridging theory to practice.  

  **Unexpected misconception:**  
  - **"Does this work for any utility function?" (min 32)**  
     - **Defuse:** "Only for EU maximizers! If you’re risk-seeking or use minimax, info can hurt. We assume linear utilities."  
     - **Why?** Engineers might recall regret minimization.  

  ---

  ### The Case with Rules: Where the Theorem Breaks (Min 35-42)  
  **Your diagnosis is correct.** The theorem assumes:  
  - Info **only updates beliefs** → you still choose freely from the same action set.  
  - **No other agents** react to the info.  

  **Standard name:** **Exogenous information** (info doesn’t change the decision problem’s structure).  

  **When to introduce:**  
  - **Place it here** (after misconceptions), as a "real-world limitation."  
  - **DO NOT open with it** (undermines the theorem’s relevance).  
  - **DO NOT close with it** (avoids "footnote" feel).  

  **Use your example:**  
  > "Suppose your deploy policy says: 'If error rate > X, roll back—no judgment.' The info (error rate) is free, but it forces an action. Without info, you might skip rolling back (EU=9). With info + rule:  
  > - Error > X: Roll back (EU=7).  
  > - Error ≤ X: Don’t roll back (EU=10).  
  > If P(Error > X) is high, expected EU could be <9! Why? The info changed your action set—you lost the option to ignore it."  

  **Key point:** When info comes with **rules or side effects**, it can reduce EU. The theorem doesn’t apply.  

  ---

  ### The Check Question (Min 50)  
  **Ask:**  
  > "You’re betting on a coin flip (Heads: win $100, Tails: $0). A free oracle tells you the outcome of a *different* coin flip (independent, 50/50). What’s the value of this info?"  

  **Why it works:**  
  - Correct answer: **$0** (info doesn’t change your action—you always bet on the first coin).  
  - If they say "$25" or "positive", they missed the core insight (info must potentially change action).  
  - If they invoke "variance reduction" or "optional stopping," they’re overcomplicating.  

  ---

  ### What to Refuse to Explain  
  **Explicitly cut:**  
  1. **Proof details:** "We won’t derive the general proof—the example *is* the proof for a simple case."  
  2. **Imperfect information:** "We’re assuming perfect info. With noisy data, it’s more complex—non-negative value still holds under some conditions, but we skip it."  
  3. **Alternate decision theories:** "We assume EU maximization. If you’re a risk-seeking agent or use minimax, the theorem may not hold—out of scope."  
  4. **Information theory/entropy:** "This isn’t about bits or KL divergence—it’s about decisions."  

  **Say:** "We’re focusing on the core intuition and where it breaks. I’ll skip [X] for time."  

  ---

  ### Where the Plan Might Fail: Your Framing Risks  
  **Biggest risk:** Over-indexing on "value comes from changing actions." **It’s necessary but incomplete.**  
  - **Why it’s a trap:** The theorem holds even if info *doesn’t* change actions (value=0), but your framing might imply change is required for non-harm. Engineers might infer: "If info won’t change my action, I can ignore it." That’s true for value, but in practice, they might skip monitoring ("It won’t change anything!").  
  - **Mitigation:** Stress that "could change" ≠ "will change." Use the coin flip check question: info *could* change your action (if utilities were asymmetric), but in this case it doesn’t → value=0.  

  **Other risks:**  
  - **EU maximization too glib:** If someone asks, "Why EU? What if we’re risk-averse?" have a backup: "We assume linear utilities. Risk-averse agents can still satisfy Good if they maximize EU—but curved utilities change calculations."  
  - **P-values derailment:** If they fixate, say: "Good’s theorem is not a statistical tool—it’s about idealized decisions. Peeking breaks statistics because it alters the sampling distribution."  
  - **"Rules" case undermines trust:** If they dismiss the theorem as ivory-tower, respond: "It’s a baseline. Real systems add constraints—that’s why we do incident reviews!"  

  **What would change the ordering?** If the room is highly Bayesian, start with EU. If they’re skeptical, start with the "rules" case to motivate why we need the theorem. But your order (insight → example → theorem → limits) is robust.  

  ---

  ### Final Script Flow  
  - **0-10 min:** Core insight (info → action change).  
  - **10-15 min:** EU maximizer + umbrella setup.  
  - **15-25 min:** Umbrella example (without info → with info → value=4).  
  - **25-30 min:** State theorem, generalize.  
  - **30-35 min:** Misconceptions (peeking, buying data, strict improvement).  
  - **35-42 min:** "Rules" case (incident reviews—why theorem breaks).  
  - **42-50 min:** Check question, summary, Q&A prep.  
  - **50-60 min:** Q&A.  

  **Survival tip:** When p-values come up, say: "Let’s park that until min 30—I promise we’ll loop back." Write it on the board to validate them.
