answer: |-
  I've wrestled with your cases and the core tension in your draft principle (the "kind of outcome" swap test). The problem is that overdetermination forces us to confront *what we are explaining* and *how we individuate events*, not just causation itself. Your intuition to avoid outcome-granularity vagueness is spot-on – it's a common dodge. Instead, I propose a principle based on **actual difference-making within the operative causal context**, drawing on concepts from counterfactual and process-based causation (Lewis, Mackie, Salmon). It prioritizes historical specificity while handling inevitability rigorously.

  Here's the principle, stated precisely enough for the board:

  **Principle for Overdetermined Causation in Historical Explanation:**
  1.  **Cite a factor as a cause of a specific outcome if:**
      *   **a)** It was part of the *actual causal process* that produced the outcome, **and**
      *   **b)** In the *specific historical context*, its *removal* (holding fixed relevant background conditions) would have resulted in a *substantively different explanandum* (i.e., the thing being explained changes in kind *or* significantly in its historically salient properties – timing, manner, immediate consequences).
  2.  **For multiple sufficient causes:**
      *   Cite *all* factors satisfying (1a) and (1b) for the *same explanandum*.
      *   If multiple factors satisfy (1a) but *not* (1b) for the same explanandum (i.e., removing any one leaves others sufficient to produce the *same* explanandum), cite them *only* if they represent distinct causal pathways that were *both actualized*. Otherwise, cite the most specific *actualized* sufficient set or the relevant common cause/underlying condition.

  **Key Definitions:**
  *   **Actual Causal Process:** The sequence of events and mechanisms that *did* occur and were sufficient to bring about the outcome. (This distinguishes what *happened* from what *could have* happened.)
  *   **Substantively Different Explanandum:** The outcome changes in a way that matters for the historical question at hand. Crucially, this includes:
      *   *Kind Change:* The outcome becomes a different type of event (e.g., revolution vs. coup).
      *   *Salient Property Change:* A property central to the historical significance or our explanation changes significantly (e.g., timing matters for subsequent events; manner affects key consequences; specific agents/means are the focus).
  *   **Holding Fixed Background Conditions:** We consider counterfactuals within the actual historical situation, not a radically different world. (E.g., in Case 1, we hold fixed the dry conditions and faulty power line; we don't imagine a world where fire prevention was perfect).

  **Applying the Principle to Your Cases:**

  1.  **Arsonist vs. Power Line:**
      *   **Verdict:** Cite the arsonist.
      *   **Why:** (1a) The arsonist's fire *was* the actual causal process. (1b) Removing the arsonist (holding fixed the faulty power line/dry conditions) changes the outcome's *timing* (10 mins later). If the *specific timing* has no salient historical consequences (e.g., no one else was endangered/implicated by the *earlier* fire), the *explanandum* ("warehouse burns down [on that day]") remains the same *kind* with the same *salient properties*. However, the arsonist *was* part of the actual process. Principle (2) clarifies: The power line fire was *not actualized* – it was a potential process halted by the arsonist's actual fire. We cite the actualized sufficient set (the arsonist's fire). The power line is background context explaining vulnerability, not a *cause* of *this* fire.
      *   **Accommodates? Yes.** Fixes the flaw in your draft principle by emphasizing *actual* process and *sufficient set actualization*.

  2.  **Two Simultaneous Fires:**
      *   **Verdict:** Cite both arsonists.
      *   **Why:** (1a) *Both* fires were part of the actual causal process – they converged. (1b) Removing *either* arsonist (holding fixed the other fire and conditions) would *not* change the outcome – the warehouse still burns at the same time, in largely the same manner. However, principle (2) applies: Both fires represent *distinct actualized causal pathways*. Each was sufficient and each *actually operated*. Therefore, cite both. The "half a cause" line fails because each was independently sufficient *and* actual.
      *   **Accommodates? Yes.**

  3.  **Clerk vs. Harvest/Debt:**
      *   **Verdict:** Cite harvest failure and war debt. The clerk is the "occasion."
      *   **Why:** (1a) The clerk's mistranslation *was* part of the actual causal process triggering the collapse *at that moment*. (1b) BUT: Removing the clerk (holding fixed the harvest failure/debt and regime instability) changes the *timing* (collapse within a year), but likely *not* the *kind* of outcome (regime collapse) or its *salient historical properties* (the underlying reasons for collapse – harvest/debt – remain; the fundamental nature of the collapse is unchanged). The harvest failure and war debt are the actual, ongoing processes making collapse inevitable. They satisfy (1a) and (1b): Removing *either* structural factor (while holding the other and the clerk fixed) *might* have prevented collapse *altogether* or fundamentally altered its nature/timing *within the context of inevitability*. The clerk is part of the actual sufficient set for *that day's* collapse, but the explanandum ("regime collapse") is defined at a level where the clerk's specific action doesn't change its salient properties *given the structural context*. Principle (2): The structural factors are the more fundamental causes satisfying (1b); the clerk is the actualized trigger, but his removal doesn't change the explanandum's salient properties. Cite the factors that explain *why* collapse was inevitable and *what kind* of collapse it was.
      *   **Reconciliation with Case 1:** The difference is the *scale of timing change* relative to the outcome's significance and the *nature of the alternative*. In Case 1, the alternative (power line) was an *imminent, specific process* within the same context. In Case 3, the alternative (harvest/debt collapse) is a *broader, structural process* operating on a different timescale. Removing the arsonist changes timing by minutes with no salient effect; removing the clerk changes timing by months/years, but the *core explanandum* (collapse due to structural crisis) remains identical. The actual cause in Case 1 *is* cited because it was the *only actualized sufficient process*. The clerk is demoted because while actualized, he doesn't change the salient explanandum defined by the structural crisis.
      *   **Accommodates? Yes.**

  4.  **Drought causing Crop Failure & Tax Revolt:**
      *   **Verdict:** Cite the drought.
      *   **Why:** (1a) The drought was part of the actual causal process leading to *both* sufficient pathways. (1b) Removing the drought (holding fixed other conditions) *would* change the outcome – *neither* sufficient pathway (crop failure, tax revolt) would likely occur, preventing collapse. Crucially, the crop failure and tax revolt are not *independent* actualized sufficient causes like in Case 2; they are *effects* of a *common cause* (drought). Principle (2): Citing both crop failure *and* tax revolt double-counts the single underlying cause (drought) that actually made the regime vulnerable. The "overdetermination" is indeed illusory; there is one fundamental cause with multiple effects, each sufficient but dependent.
      *   **Reconciliation with Case 2:** Case 2 involves two *independent*, *actualized*, *sufficient* causes operating *simultaneously*. Case 4 involves one *actualized* cause (drought) producing two effects, either of which is sufficient. We cite the common cause to avoid overcounting and explain the vulnerability.
      *   **Accommodates? Yes.**

  5.  **Mining Lobby vs. Railway Lobby:**
      *   **Verdict:** Cite neither lobby specifically. Explain via "pressure from transport capital interests" or "emergent infrastructure development imperative."
      *   **Why:** (1a) The mining lobby's bribery *was* the actual causal process for the *canal*. (1b) However, removing the mining lobby (holding fixed the railway lobby's strength and the government's susceptibility) changes the *specific project* (canal -> railway) but *not* the *kind* of outcome ("major transport infrastructure project built, transforming the economy"). The salient historical property – the transformation driven by transport capital – remains the same. Principle (2): Neither lobby satisfies (1b) for the explanandum ("economy-transforming transport project"). The *general condition* – powerful transport capital interests able to influence policy – *does* satisfy (1b): removing *that* general condition (even if hard to imagine precisely) likely prevents *any* such large-scale transformative project from being pushed through at that time. Cite the underlying necessary condition from the actual context (transport capital pressure).
      *   **Accommodates? Yes.**

  **Verdicts on Your Additional Cases:**

  6.  **Election called a week before the scandal breaks (timing matters):**
      *   **Scenario:** The government calls an election a week early. A scandal sufficient to defeat them breaks a week later (after the real election would have been held).
      *   **Verdict:** Cite the early election call **as a cause of the government's victory**.
      *   **Why:** (1a) The early call was part of the actual process leading to the victory. (1b) Removing the early call (holding fixed the scandal's impending break) changes the outcome *kind*: The government *loses* (due to the scandal breaking during the campaign). The *timing change* here alters the *salient property* of the outcome (who wins). The early call made the difference between victory and defeat. The scandal is a background condition explaining why the timing mattered.
      *   **Accommodates? Yes.**

  7.  **Arsonist vs. Owner's Insurance Plot (planned inevitability):**
      *   **Scenario:** Arsonist burns warehouse first. Owner had already hired someone to burn it the following week for insurance.
      *   **Verdict:** Cite the **arsonist as the cause of the fire *occurring when it did***. Explain the owner's plot as a background condition making the fire *inevitable* in the near term.
      *   **Why:** (1a) The arsonist's fire was the actual causal process. (1b) Removing the arsonist (holding fixed the owner's plot/arsonist-for-hire ready to act) changes the outcome's *timing* (fire next week). If the *specific timing* (e.g., contents destroyed, witnesses present, immediate economic impact) has *salient historical consequences*, then the arsonist is the cause of *this* fire. If the timing difference is irrelevant to the core historical question (e.g., "Why was the warehouse destroyed that month?"), then the explanandum is satisfied by either fire, and the owner's plot becomes the more fundamental cause of the *inevitability*. However, the arsonist *was* the actual mechanism. Principle (2): The owner's plot is an *actualized background condition* enabling/scheduling the *kind* of event, but the *specific actualized sufficient process* was the arsonist's action. The hired arsonist is a *potential*, not actualized, process (they didn't act). Therefore, cite the actual arsonist as the cause of the fire *at t*, and cite the owner's plot as the cause of the fire's *inevitability* and timing context. **This is the trickiest case.** The principle *can* accommodate citing the arsonist, but forces explicit consideration of whether the timing difference matters. If timing truly doesn't matter, your explanation might shift to "warehouse destroyed by fire as part of insurance fraud plot," downplaying the specific arsonist unless his identity/motivation is salient.
      *   **Accommodates? Yes, but requires clarifying the explanandum's focus (specific event vs. inevitable outcome).**

  **Strengths of this Principle:**

  *   **Precise:** Avoids vague "kind of outcome" by defining "substantively different explanandum" via kind change or salient property change (explicitly including timing).
  *   **Handles Actuality:** Prioritizes what *did* happen over what *could have*.
  *   **Handles Inevitability:** Distinguishes between actual triggers and structural causes by assessing whether removal changes the salient explanandum *within the context of inevitability*.
  *   **Handles Multiple Sufficiency:** Clearly differentiates independent simultaneous causes (Case 2) from common causes (Case 4) and potential backups (Cases 1, 3, 5, 7).
  *   **Teachability:** The two-part rule is structured and the definitions are clear. Cases illustrate the clauses.
  *   **Accommodates All Cases:** As shown above, it delivers your desired verdicts on 1-5 and provides clear reasoning for 6 & 7.

  **Weaknesses/Limitations:**

  1.  **Defining "Salient Properties":** This remains somewhat contextual/historiographical. You *must* define the explanandum clearly with your students (e.g., "Why did the warehouse burn *on Tuesday*?" vs. "Why was the warehouse destroyed?" vs. "Why was this area vulnerable to fire?"). The principle forces this clarity but doesn't eliminate the need for historical judgment about what properties are salient. This isn't vagueness *within* the principle, but inherent in historical explanation.
  2.  **Case 3 Nuance:** Your verdict (citing structures, clerk as "occasion") is accommodated, but the principle *could* also support citing the clerk for the *precise timing* if that were the focus (e.g., "Why did the regime collapse *on March 15th*?"). The principle reflects that your explanandum is the collapse *itself*, not its specific timing.
  3.  **Background Conditions:** "Holding fixed" requires careful thought about what constitutes the stable context vs. the variable cause.

  **Conclusion:**
  This principle – centered on **actual difference-making for the salient explanandum** – successfully handles all your cases (1-5, 6, 7) without resorting to outcome granularity cheats. It provides a rigorous framework for your verdicts by emphasizing:
  *   What *actually* happened (process actualization).
  *   Whether a factor changed the *core thing being explained* (via kind or salient properties).
  *   How to handle inevitability and multiple paths (common causes, independent causes, backups).

  You'll need to emphasize to students that defining the *explanandum* precisely (including its salient properties) is step zero. But once defined, this principle gives you a defensible, non-arbitrary way to navigate the thicket of overdetermination. It turns your intuitive verdicts into a coherent doctrine. If you try this in the seminar, I'd love to hear how it lands!
