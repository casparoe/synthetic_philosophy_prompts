  To make CDT prefer not take, we need the causal risk to outweigh the bribe for the trustworthy. Ensure that for trustworthy, not take is better than take:

  - EU(T, not take) = 1,000,000
  - EU(T, take) = (0.8)(1,000,000 + b) + (0.2)(b) = 800,000 + b.
