  We are to design a Newcomb-style problem without predictors, demons, etc., in an ordinary setting. The key is to have the agent's choice causally influence the large payoff (so CDT one-boxes) but also be evidence of a hidden state that reduces the chance of that payoff (so EDT two-boxes). 

  After exploring several settings, we use a family firm scenario:

  Alex is a junior partner in a family firm. She is up for a large year-end bonus ($1,000,000) if she is deemed trustworthy by the senior partner, Morgan. The bonus is awarded only if (1) Alex is not caught taking a bribe from a competitor, and (2) she is truly trustworthy (which affects her work quality). Alex must decide whether to take a small bribe ($50,000) now. If she takes the bribe, there is a 20% chance of being caught by an audit, which would make her ineligible for the bonus. Alex is unsure about her trustworthiness (she has a 60% prior that she is trustworthy), and taking the bribe is evidence of untrustworthiness: a trustworthy Alex takes the bribe only 10% of the time, while an untrustworthy one does so 90% of the time. The bonus depends on her trustworthiness only if not caught.

  **Why it meets the specifications:**
  - **Ordinary setting**: Family firm with a bonus decision.
  - **No predictor**: The bonus is determined by an audit (causal) and trustworthiness (evidential).
  - **Both theories earn their verdicts**: 
    - *Causal*: Taking the bribe *causes* a 20% risk of losing the bonus via the audit.
    - *Evidential*: Taking the bribe is *evidence* of untrustworthiness, which would also lose the bonus (if not caught).
  - **Uncertain hidden state**: Alex is unsure of her trustworthiness (60% prior), naturally, due to self-doubt.
  - **Probabilities**:
    - $P(T) = 0.6$ (trustworthy), $P(U) = 0.4$ (untrustworthy).
    - $P(\text{take} | T) = 0.1$, $P(\text{take} | U) = 0.9$.
    - $P(\text{caught} | \text{take}) = 0.2$.
    - Bonus = $1,000,000$ if (not caught and $T$), else $0$.
    - Bribe = $50,000$ (received iff take is chosen).

  **Calculations:**

  **CDT** (uses causal intervention; fixes trustworthiness, varies act):
  - *If trustworthy ($T$)*:
    - Not take: Bonus = $1,000,000$.
    - Take: (80% not caught) $\times$ (bonus + bribe) + (20% caught) $\times$ (bribe) = $0.8 \times 1,050,000 + 0.2 \times 50,000 = 840,000 + 10,000 = 850,000$.
    - Better not to take ($1,000,000 > 850,000$).
  - *If untrustworthy ($U$)*:
    - Not take: $0$.
    - Take: Bribe = $50,000$ (bonus impossible even if not caught).
    - Better to take ($50,000 > 0$).
  - *Overall CDT*:
    - Not take: $0.6 \times 1,000,000 + 0.4 \times 0 = 600,000$.
    - Take: $0.6 \times 850,000 + 0.4 \times 50,000 = 510,000 + 20,000 = 530,000$.
    - CDT prefers not take ($600,000 > 530,000$).

  **EDT** (conditions on the act; updates trustworthiness given act):
  - *Not take*:
    - $P(\text{not take}) = P(\text{not take} | T)P(T) + P(\text{not take} | U)P(U) = (0.9 \times 0.6) + (0.1 \times 0.4) = 0.54 + 0.04 = 0.58$.
    - $P(T | \text{not take}) = \frac{0.9 \times 0.6}{0.58} = \frac{0.54}{0.58} \approx 0.931$.
    - EU(not take) = $P(\text{bonus} | \text{not take}) \times 1,000,000 = P(T | \text{not take}) \times 1,000,000$ (since not caught) $\approx 0.931 \times 1,000,000 = 931,000$.
  - *Take*:
    - $P(\text{take}) = 1 - 0.58 = 0.42$.
    - $P(T | \text{take}) = \frac{0.1 \times 0.6}{0.42} = \frac{0.06}{0.42} \approx 0.143$.
    - $P(\text{bonus} | \text{take}) = P(\text{not caught} \text{ and } T | \text{take}) = P(\text{not caught}) \times P(T | \text{take}) = 0.8 \times 0.143 \approx 0.114$ (since caught and trustworthiness are independent given take).
    - EU(take) = $P(\text{bonus} | \text{take}) \times 1,000,000 + 50,000 \approx 0.114 \times 1,000,000 + 50,000 = 114,000 + 50,000 = 164,000$.
  - EDT prefers take? But $164,000 < 931,000$, so not take is better.

  **This does not work yet. We need to adjust to make EDT prefer take.**

  Adjust to make the evidential effect less severe (reduce the evidence strength) and increase the bribe:

  - $P(\text{take} | T) = 0.4$ ( trusty take sometimes)  
  - $P(\text{take} | U) = 0.6$ ( not always take) 
  - Bribe = $200,000$.
  - Other numbers same.

  **Recalculate for EDT to force it to prefer take:**

  - $P(\text{not take}) = (0.6 \times 0.6) + (0.4 \times 0.4) = 0.36 + 0.16 = 0.52$. 
  - $P(T | \text{not take}) = \frac{0.6 \times 0.6}{0.52} = \frac{0.36}{0.52} \approx 0.692$. 
  - EU(not take) = $0.692 \times 1,000,000 = 692,000$. 
