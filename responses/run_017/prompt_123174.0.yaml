    There's a standard example: the smoking lesion with a causal effect of smoking on health, but we are not to use that machinery. 

    But note: the smoking lesion is usually for EDT one thing and CDT another, but not the reverse of Newcomb.

    We want CDT to one-box ( not smoke) and EDT to two-box (smoke) if we map not smoking to one-boxing.

    In the smoking lesion, typically:
       EDT: doesn't smoke, because smoking is evidence of the lesion which causes cancer.
       CDT: smokes, because smoking does not cause the lesion, and smoking is pleasurable.

    We want the opposite: CDT not to smoke, and EDT to smoke.

    So add a causal effect of smoking on health: say, smoking also independently causes cancer. Then:
       CDT will not smoke because it causes cancer.
       EDT might still not smoke because it is evidence of the lesion.

    But we want EDT to smoke. So make the lesion very likely given the evidence, and make the pleasure of smoking high.

    In the standard smoking lesion, EDT doesn't smoke even though smoking doesn't cause the lesion, because smoking is evidence of the lesion.

    If we make the lesion very rare, and the evidence from smoking very strong, then the conditional probability might be that if you smoke, it is very likely you have the lesion, and then you are likely to get cancer anyway, so you might as well smoke for the pleasure.

    So let's try:

     State: has lesion (L) or not (NL)
     Act: smoke or not.

     If you have the lesion, you get cancer with high probability regardless of smoking.
     If you don't have the lesion, then smoking causes cancer with some probability.

     Smoking also gives you pleasure.

     We want:
          CDT: doesn't smoke, because smoking causes cancer if no lesion.
          EDT: smokes, because if you have the lesion, you are likely to get cancer anyway, and if you don't have the lesion, you might not get cancer even if you smoke (or the pleasure outweighs the risk), and moreover, smoking is evidence that you have the lesion (so you will get cancer anyway) so the additional risk from smoking is not as high.

     Specifically, make the lesion very rare and very likely to cause cancer. Make the causal effect of smoking on cancer (in the no lesion case) moderate. Make the evidence: people with the lesion are more likely to smoke. 

     But then for EDT, if you smoke, that is evidence you have the lesion, so you will get cancer anyway, so the pleasure of smoking might be worth it.

     Let's orize:

     States: L (lesion) and NL (no lesion)
     Prior: P(L)=0.01, P(NL)=0.99

     If you have L, then you get cancer with probability 0.999.
     If you have NL and you smoke, you get cancer with probability 0.5.
     If you have NL and you don't smoke, you get cancer with probability 0.

     Additionally, smoking gives you pleasure worth + utils (independent of cancer).

     Cancer is worth -1000.

     We want to see the expected utility.

     For CDT:
        CDT considers the causal effect of smoking on cancer.
        It does this by conditioning on the state (lesion or not) and then and sees the effect of smoking on cancer within that state.

        In state L:
            whether you smoke or not, you are very likely to get cancer.
            so the difference is only the pleasure from smoking.
            so CDT will prefer to smoke in this state: -1000 (almost for sure) + pleasure > -1000.
        In state NL:
            if you smoke: 0.5*(-1000) + pleasure = -500 + pleasure
            if you not smoke: 0
            so if pleasure > 500, then smoke.

        So if pleasure > 500, CDT will smoke in both states, so overall smoke.

     But we want CDT to not smoke.

     To make CDT not smoke, we can make the pleasure less than 500, then in state NL, not smoke is better. In state L, smoke is better, but state L is rare, so overall not smoke might be better.

     EU_CDT(smoke)= P(L) * [ -1000 + pleasure ] + P(NL)* [ -500 + pleasure ]
                   = 0.01*(-1000+pleasure) + 0.99*(-500+pleasure)
                   = 0.01* -1000 + 0.01*pleasure + 0.99* -500 + 0.99*pleasure
                   = -10 + -495 + pleasure = -505 + pleasure

     EU_CDT(not smoke)= P(L) * (-1000) + P(NL)*0 = 0.01*-1000 = -10

     So if pleasure < 495, then -505+pleasure < -10 -> not smoke is better for CDT.

     Set pleasure=400.

     Then CDT: not smoke.

     For EDT:

     EU(smoke)= P(cancer | smoke) * (-1000) + pleasure

     But cancer is not a state, it's an outcome. We need to use iterated conditioning.

     Instead, we can compute:

     EU(smoke) = [ P(L|smoke) * [ P(cancer|L, smoke) * (-1000) + (1-P(cancer|L, smoke)) * 0 ] + similarly for NL ] + pleasure
                = P(L|smoke) * [ 0.999 * -1000 ] + P(NL|smoke) * [ 0.5 * -1000 ] + pleasure

     Similarly, EU(not smoke)= P(L|not smoke) * [0.999*-1000] + P(NL|not smoke) * [0] 

     Now, we need the conditional probabilities.

     Byes requires P(smoke|L) and P(smoke|NL).

     Let P(smoke|L) = high, say 0.9
     P(smoke|NL) = low, say 0.1

     Then:
          P(smoke) = P(smoke|L)*P(L) + P(smoke|NL)*P(NL) = 0.9*0.01 + 0.1*0.99 = 0.009 + 0.099 = 0.108
          P(L|smoke)=0.009/0.108=0.0833
          P(NL|smoke)=0.099/0.108=0.9167

          EU(smoke)= 0.0833 * (0.999*-1000) + 0.9167 * (0.5*-1000) + 400
                   = 0.0833 * -999 + 0.9167 * -500 + 400
                   = -83.2267 - 458.35 + 400
                   = -141.5767

          EU(not smoke)= 
               P(not smoke)=1-0.108=0.892
               P(L|not smoke)= (0.1*0.01) / (0.1*0.01 + 0.9*0.99) = 0.001 / (0.001+0.891)=0.001/0.892=0.001121
               EU(not smoke)= 0.001121 * (0.999*-1000) + (1-0.001121)*0 = 0.001121 * -999 = -1.12

          So EU(smoke) is -141.58, which is worse than EU(not smoke) -1.12.

     So EDT also prefers not to smoke.

     To make EDT prefer to smoke, we need the pleasure to be higher or the expected cost given smoke to be not as high.

     Because conditional on smoke, the probability of L is only 8.33%, and then for NL, the cost is -500 on average. The in then expect cost given smoke is:
          0.0833*999 + 0.9167*500 = 83.2267 + 458.35 = 541.5767
     so to make EU(smoke) > EU(not smoke), we need:
          -541.5767 + pleasure > -1.12
          => pleasure > 540.4567

     But then for CDT, with pleasure=540, then EU_CDT(smoke)= -505 + 540 = 35, and EU_CDT(not smoke)=-10, so CDT would prefer to smoke.

     To keep CDT not smoke, we need pleasure < 495.

     So no overlap.

