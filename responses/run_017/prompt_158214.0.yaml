  **Key Clarifications:**  
  1. **User ≠ Homunculus**: The "user" is the organism, not a mini-self. The interface serves *its* survival.  
  2. **Illusion ≠ Non-Existence**: Icons are real computational events with functional power; calling them "illusions" rejects only their *naive interpretation* as literal, centralized objects.  
  3. **Moral Grounding**: Pain matters because it signifies *objective harm* to a goal-directed system, evidenced by behavior and neurology—not because it feels "spooky" inside. The dog's pain-icon *is* its suffering.  
