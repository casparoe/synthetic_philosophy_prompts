  Here's the prose and structured response:

  **Prose Response:**  
  Dennett's view doesn't eliminate the biological agent experiencing pain; it redescribes *how* it experiences. The "user" isn't a homunculus being fooled by icons, but the entire evolved system generating those icons to navigate the world. Pain-as-icon isn't an unreal fiction—it's the organism's *functional representation* of harm, triggering avoidance, distress, and care-needs. What grounds morality isn't a mysterious inner quale, but the observable fact that the system *cares*: the dog's pain-icon drives real suffering-behaviors, vulnerability, and a demand on our compassion that exists irrespective of metaphysical ghosts. The illusion isn't that nothing matters; it's that mattering requires a magical, non-physical witness.

