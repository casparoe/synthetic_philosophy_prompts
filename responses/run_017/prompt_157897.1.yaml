  ### Cause Selection Simulation Activity  
  **Goal:** Participants experience three limitations of the ITN framework (neglectedness as counterfactual, non-separability, ambiguous neglect) through hands-on investment decisions.  

  ---

  ### **Materials & Setup**  
  1. **Groups & Resources:**  
     - Divide 16 students into 4 groups (Group A, B, C, D).  
     - **Group A & B:** Each receives **$100** (money tokens; 5 × $20 bills).  
     - **Group C & D:** Each receives **100 person-hours** (labor tokens; 5 × 20-hour vouchers).  

  2. **Cause Cards** (1 per cause; place face-up on a table):  
     - **Cause 1:** "Ocean Cleanup"  
       *Description:* "Remove plastic from oceans using specialized ships."  
       *Accepts:* Money only (no labor).  
     - **Cause 2:** "Village School Project"  
       *Description:* "Build schools in rural areas."  
       *Accepts:* Money and labor.  
     - **Cause 3:** "Malaria Nets"  
       *Description:* "Distribute insecticide-treated bed nets."  
       *Accepts:* Labor only (no money).  
     - **Cause 4:** "AI Disease Tracker"  
       *Description:* "Software to predict outbreaks using health data."  
       *Accepts:* Labor only (no money).  
     - **Cause 5:** "Asteroid Monitor"  
       *Description:* "Telescopes to detect near-Earth asteroids."  
       *Accepts:* Money and labor.  

  3. **Hidden Payoff Rules** (Facilitator’s private table):  
     | Cause | Payoff Mechanism (Hidden) |  
     |-------|----------------------------|  
     | 1     | **Crowding out:** First $60 invested earns $10 impact per $20. Additional money earns $1 per $20 (displacement). |  
     | 2     | **Threshold:** Total money + labor must reach $40 + 40hrs to unlock payoff. If met, all tokens earn $15. Else, $0. |  
     | 3     | **Complementarity with Cause 4:** Each labor token earns $5 + $10 bonus if Cause 4 receives ≥60hrs labor. |  
     | 4     | **Complementarity with Cause 3:** Each labor token earns $5 + $10 bonus if Cause 3 receives ≥60hrs labor. |  
     | 5     | **Ambiguous neglect:** All tokens earn $2 (low because it’s inherently low-impact). |  

  4. **Other Materials:**  
     - Investment sheets (for groups to record allocations).  
     - Calculators (for facilitators).  
     - Prize: A small candy bar or sticker for the highest-impact group.  

  ---

  ### **Rules & Mechanics**  
  - **Time:** 15 minutes for investment decisions.  
  - **Decisions:**  
    - Groups invest tokens in causes (e.g., Group A invests $60 in Cause 1).  
    - Causes accept only specified resources (e.g., Cause 1 takes money only).  
    - Groups **cannot see payoff rules** and **must decide independently** (no inter-group deals).  
  - **Payoff Calculation (Facilitator):**  
    - After investments, apply hidden rules:  
      - For Cause 1: First $60 → $10/$20; extra → $1/$20.  
      - For Cause 2: Pay $15/token only if $40 + 40hrs threshold met.  
      - For Causes 3 & 4: Apply bonuses if complementary labor thresholds met.  
      - For Cause 5: Always $2/token.  
    - **Impact = (Token amount) × (Payoff per token)**.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Setup (5 min):**  
     - Assign groups/resources. Explain:  
       *“You represent organizations with money or labor. Invest tokens in causes to earn impact points. Highest-impact group wins a prize. Causes only accept specific resources.”*  
     - Show cause cards. Emphasize: *“No talking between groups. Record investments on sheets.”*  

  2. **Investment Phase (15 min):**  
     - Groups discuss internally and submit investment sheets.  
     - **Predictable Behavior:**  
       - Cause 1 (Ocean Cleanup) attracts money-heavy groups (A/B).  
       - Cause 5 (Asteroid Monitor) may get little investment (sounds flashy but untrusted).  
       - Causes 3/4 (Malaria Nets/AI Tracker) split labor groups (C/D).  
       - Cause 2 (School Project) may be underfunded (requires coordination).  

  3. **Calculation & Results (15 min):**  
     - Facilitator computes payoffs secretly using the hidden table.  
     - Announce:  
       - Total tokens invested per cause.  
       - Impact per token for each cause.  
       - Group-level impacts (rank groups).  
     - **Sample Outcome:**  
       - Cause 1: $100 invested → First $60 = $30 impact ($10/$20), extra $40 = $4 impact ($1/$20). Total = $34.  
       - Cause 2: $30 + 30hrs → Below threshold → $0 impact.  
       - Cause 3: 80hrs + Cause 4 has 40hrs → No bonus (Cause 4 <60hrs) → $5/labor token.  
       - Cause 5: $20 + 20hrs → $2/token → $80 impact.  

  4. **Debrief (45 min):**  
     - **Guided Discussion (Map experiences to insights):**  
       - **Neglectedness as Counterfactual (Crowding Out):**  
         *“Look at Cause 1. Why did extra money earn almost nothing? Because your $20 displaced others’ impact. Neglectedness isn’t ‘few people working’—it’s ‘what happens if I join?’ If others would have done the work without you, your contribution just crowds them out.”*  
         → **Moment:** Cause 1’s high initial payoff dropping sharply.  
         → **Signal for Opportunity:** Neglect is only good if your contribution adds *new* impact (e.g., no one else can fund ships).  

       - **Non-Separability (Thresholds & Complements):**  
         *“Cause 2 paid $0 despite your tokens. Why? Impact required a minimum funding coalition. Cause 3 paid less without Cause 4. Multiplying ITN assumes causes work in isolation, but here they needed partners or thresholds.”*  
         → **Moments:** Cause 2’s $0; low payoffs in Causes 3/4.  
         → **Real-World:** ITN fails when impact depends on total funding (e.g., policy change) or cause synergies (e.g., vaccines + delivery).  

       - **Ambiguous Neglect:**  
         *“Cause 5 was neglected and had low returns. Is neglect a sign of opportunity? Sometimes—but here it was neglected because it’s low-impact! Others avoided it for good reasons. Neglect alone is ambiguous—it could mean ‘gold mine’ or ‘minefield.’”*  
         → **Moment:** Cause 5’s low investment and payoff.  
         → **Signal for Opportunity:** Neglect is only a reason to invest if you have evidence others overlooked the cause (e.g., new data, unique approach).  

     - **Key Debrief Qs:**  
       - *“Where did the ITN checklist fail you?”*  
       - *“How would you investigate neglect next time?”*  
       - *“What’s one thing you’d change about your strategy?”*  

  5. **Conclusion (10 min):**  
     - Award prize.  
     - Reinforce: *“ITN is a starting point—but always ask: What’s the counterfactual? Are there hidden dependencies? Why is this cause *really* neglected?”*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Groups over-invest in “sexy” causes (e.g., Cause 5).  
    **Fix:** Use payoff results to show low returns—highlight ambiguity of neglect.  
  - **Problem:** Cause 2 (threshold) gets no investment.  
    **Fix:** In debrief, contrast it with “easy wins” to illustrate threshold risks.  
  - **Problem:** Labor groups (C/D) split between Causes 3/4, missing complementarity bonus.  
    **Fix:** Point out how coordination could have unlocked bonuses.  
  - **Problem:** Time crunch in calculations.  
    **Fix:** Pre-calculate likely scenarios; use a helper to compute.  

  ---

  ### **What’s Artificial vs. Requires Discussion**  
  - **Staged Well:**  
    - Crowding out (Cause 1) and thresholds (Cause 2) are visceral.  
    - Complementarity (Causes 3/4) forces coordination awareness.  
    - Ambiguous neglect (Cause 5) is clear from low returns.  
  - **Requires Discussion:**  
    - **Complementarity:** The activity simplifies it (binary bonus). Real-world complements (e.g., R&D + distribution) need nuanced debate.  
    - **Ambiguous Neglect:** Only one type shown (bad neglect). Discuss how to distinguish good neglect (e.g., expert interviews).  
    - **Counterfactuals:** Activity shows displacement, but real-world counterfactuals (e.g., funding shifts) require case studies.  

  **Final Tip:** Run the simulation twice if time allows (first run = chaos, second run = strategy). Focus debrief on transferring insights to real cause selection!
