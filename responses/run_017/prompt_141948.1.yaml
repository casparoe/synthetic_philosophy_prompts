prompt: |-
  I run a tiny reading group (we meet in a pub, six of us, one is a formal-verification engineer who keeps dragging in annoying real examples) and we've spent the better part of a year grinding through the logical uncertainty material — the market-based criterion where no efficiently computable trading strategy can make unbounded gains off your prices, and the Bayesian pushback on it. Two of the group have now stopped making progress and mostly just restate their side louder, so I want to hand them the document they should have written at the start: a joint adversarial-collaboration statement.

  Side A, call them the coherentists: there is nothing special about logical uncertainty, there's one normative theory of uncertainty, and the only reason anyone has credence below 1 in the twin prime conjecture or in what a specific enormous computation outputs is that conditioning on all logical facts is computationally intractable; the ideal is still a single coherent distribution over completions (or models), updated by conditioning on proofs as they arrive, and synchronic incoherence is a defect because in principle it's exploitable. Side B, call them the convergence crowd: "in principle exploitable" does no work when working out the exploit requires settling the very mathematics you're uncertain about, a noncomputable prior over completions is not an ideal but a fantasy, and the right normative target is a property of the whole time-sequence of belief states — don't get exploited by any feasible trader, converge to 1 on things that get proved, learn to be calibrated about the class of questions you can eventually settle — rather than coherence at each instant.

  What I want is the joint text both of them could actually sign. Start with a numbered agreed-claims section, and I'd like it to include: what the probability calculus does and doesn't constrain once the agent can't compute its own updates; whether the threat of a money pump is itself hostage to the same logical uncertainty it's supposed to punish; whether uncertainty about a bounded computation (does this SAT instance have a solution) is even the same kind of thing as uncertainty about an unbounded conjecture; what an agent may assume about its own future proofs, given the usual self-reference headaches; and whether either framework so much as has an opinion about the number you should plug into a one-shot decision today. Then a disagreements table: neutral statement of the disagreement in one column, each camp's own preferred phrasing that they'd sign in the other two. Then the cruxes, and for each crux a concrete case both would accept as evidence bearing on it, with each side's prediction written down in advance. The cases I want used are these: (1) the sign-off case — my verification engineer has to certify a numerical simulation / crypto construction this week, the relevant claim won't be settled for decades, so what does an in-the-limit criterion say about the number she acts on now, if anything; (2) the sieve case — a fast heuristic conjecture engine flags whether some hard claim is provable and a slow verifier settles it a year later; what's the right interim credence, and how much do you discount that flag, i.e. how does either view handle logical testimony from a correlated-but-fallible source; (3) settlement-lag — a prediction market on an open conjecture that has to cash out at a fixed date long before anyone proves anything; who holds the residual, and does it behave like ordinary risk or like something the two accounts have to treat differently; (4) mirror markets — run the same setup twice, seeding one copy with an extra axiom or a leaked hint that a proof exists; do the two price series converge, and would convergence (or failure to) actually discriminate between the accounts. Finally, say explicitly which parts of this dispute you think are merely verbal — e.g. if they're using "probability" to mean a fair betting price, a decision-guiding number, and a limiting frequency of proof-events respectively — and which parts are real. Don't tell me who's right; I want the text they could both put their names to, with what's left over stated exactly.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two sides in a debate on logical uncertainty.

  Side A (Coherentists): 
    - Believes that there is one normative theory of uncertainty, and logical uncertainty is no exception.
    - The ideal is a single coherent probability distribution over logical completions (or models), updated by conditioning on proofs as they arrive.
    - Synchronic incoherence (at a single time) is a defect because it is in principle exploitable by a Dutch book.

  Side B (Convergence Crowd):
    - Believes that the threat of exploitation in the synchronic sense is not meaningful when the exploit requires settling the same logical uncertainties.
    - A noncomputable prior over completions is not a feasible ideal.
    - The normative target is a property of the entire sequence of belief states: avoid exploitation by any feasible trader, converge to 1 on proven statements, and learn to be calibrated on eventually decidable questions.

  We structure the document as follows:

  1. **Agreed Claims**: A numbered list of claims both sides agree on.
  2. **Disagreements Table**: A table with three columns: 
     - Column 1: Neutral statement of the disagreement.
     - Column 2: Side A's preferred phrasing (which they would sign).
     - Column 3: Side B's preferred phrasing (which they would sign).
  3. **Cruxes**: For each crux, we provide a concrete case that both sides accept as bearing evidence. We state each side's prediction in advance for the outcome of the case.
  4. **Verbal vs Real Disagreements**: Explicitly state which parts are merely verbal and which are substantive.

  We are to use the following cases in the cruxes:
     (1) The sign-off case
     (2) The sieve case
     (3) Settlement-lag prediction market
     (4) Mirror markets

  Let's begin.

  ## Adversarial Collaboration on Logical Uncertainty

  ### 1. Agreed Claims

  Both sides agree on the following:

  1. **Probability Calculus Constraints**: The probability calculus (Kolmogorov axioms) constrains the assignments of credences to logically related propositions at a given time, provided that the agent has the computational capacity to perform the necessary deductions. However, when the agent lacks the computational resources to deduce all logical relationships, the probability calculus does not fully determine the agent's credences.

  2. **Computational Intractability**: The primary reason for having credences below 1 in mathematical statements (such as the twin prime conjecture or the output of a large computation) is the computational intractability of determining the truth of these statements. An ideal agent with unbounded computational resources would assign probability 1 to all true mathematical statements and 0 to false ones.

  3. **Money Pump and Logical Uncertainty**: The threat of a money pump (or Dutch book) for synchronic incoherence is itself subject to the same computational limitations. That is, constructing the Dutch book may require solving the very logical problems that the agent is uncertain about. Therefore, the practical force of the money pump argument in the context of logical uncertainty is diminished.

  4. **Uncertainty about Bounded Computations vs Unbounded Conjectures**: There is a difference in kind between uncertainty about a bounded computation (e.g., a SAT instance that can in principle be solved by a feasible computation, even if not currently feasible for the agent) and uncertainty about an unbounded conjecture (e.g., the twin prime conjecture, which may require an unbounded search). However, both sides agree that the same normative framework should ideally cover both, even if the practical implications differ.

  5. **Assumptions about Future Proofs**: An agent may not assume that it will eventually prove or disprove every statement. For statements that are never settled by the agent, the agent's credence may never converge to 0 or 1. Moreover, the agent must avoid self-referential pitfalls (e.g., assuming that it will prove a statement that implies its own consistency, which might lead to paradox).

  6. **One-Shot Decisions**: Both sides agree that an agent must assign a credence (or a decision-guiding number) for a one-shot decision today. However, they disagree on the normative basis for that number (see disagreements).

  ### 2. Disagreements Table

  | Neutral Statement of Disagreement | Side A (Coherentists) Preferred Phrasing | Side B (Convergence Crowd) Preferred Phrasing |
  |-----------------------------------|------------------------------------------|-----------------------------------------------|
  | **The ideal normative target for logical uncertainty** | The ideal normative target is a single, coherent probability distribution over all possible logical completions (or models), updated by conditioning on proofs as they arrive. Synchronic coherence is required because any incoherence is in principle exploitable, even if the exploitation is not computationally feasible. | The ideal normative target is a sequence of belief states that is not exploitable by any feasible trading strategy over time, converges to 1 for statements that are eventually proven, and is calibrated for the class of questions the agent eventually settles. Synchronic coherence is not required because the exploitation argument is not feasible when it requires solving the same logical uncertainties. |
  | **The status of a noncomputable prior** | A noncomputable prior over logical completions is a legitimate idealization, similar to idealizations in other areas of normative theory (e.g., unbounded computation in Bayesian reasoning). | A noncomputable prior over logical completions is not a legitimate idealization because it is unattainable even in principle by a finite agent, and the normative target must be defined in terms of what is achievable by feasible computations. |
  | **The role of Dutch book arguments** | The Dutch book argument for synchronic coherence is a fundamental normative constraint, and it applies even if the bookie must perform noncomputable operations. The threat of exploitation is a theoretical defect. | The Dutch book argument for synchronic coherence loses its normative force when the bookie must perform noncomputable operations or settle open logical questions. The only meaningful notion of exploitability is by feasible traders over time. |
  | **The basis for one-shot decisions** | In a one-shot decision, the agent should use the current credence from the coherent distribution (even if that distribution is only partially computed) because it is the best available representation of the agent's uncertainty. | In a one-shot decision, the agent should use a decision-guiding number that is part of a strategy that has good long-term properties (e.g., avoiding feasible exploitation and converging appropriately). This may not correspond to a coherent distribution at the current time. |

  ### 3. Cruxes and Concrete Cases

  For each crux, we present a concrete case and each side's prediction.

  #### Crux 1: The basis for one-shot decisions (Sign-off Case)
  **Case**: A formal-verification engineer must certify a numerical simulation or crypto construction this week. The relevant claim (e.g., "this system is secure against attacks of type X") is a mathematical statement that will not be settled for decades. The engineer must decide whether to certify.

  - **Side A Prediction**: The engineer should assign a coherent credence to the claim (based on the available evidence and the logical constraints she can compute) and use that credence in a standard decision theory (e.g., maximizing expected utility). The number used is the current probability from the coherent distribution.
  - **Side B Prediction**: The engineer should use a decision-guiding number that is part of a strategy that is robust against feasible exploitation and that will converge to the truth if the claim is eventually settled. This number might be obtained by a heuristic that approximates the long-term convergence goal, and it may not be part of a fully coherent current distribution.

  #### Crux 2: Handling logical testimony (Sieve Case)
  **Case**: A fast heuristic conjecture engine (sieve) flags whether a hard mathematical claim is provable. A slow verifier will settle it a year later. The sieve is fallible but has been calibrated on past problems. What should an agent's interim credence be after seeing the sieve's flag but before the verifier's result?

  - **Side A Prediction**: The agent should condition a coherent prior on the sieve's flag. The prior should account for the sieve's reliability and the logical relationships between the flag and the claim. The interim credence is the conditional probability.
  - **Side B Prediction**: The agent should update in a way that, over many such instances, the credences are calibrated with the eventual outcomes (as determined by the slow verifier). The update might be done by a rule that tracks the historical accuracy of the sieve, and it does not require a full coherent prior over all logical possibilities.

  #### Crux 3: Settlement-lag prediction market (Settlement-lag Case)
  **Case**: A prediction market on an open mathematical conjecture (e.g., P vs NP) is set to cash out at a fixed date long before the conjecture is proven. The market pays $1 if the conjecture is eventually proven true, $0 if false, but the cash-out happens at the fixed date without resolution. Who holds the residual risk? And does this residual behave like ordinary risk or something else?

  - **Side A Prediction**: The market price at cash-out should reflect the current coherent probability of the conjecture being true, conditional on the information available. The residual risk is held by the market participants and behaves like ordinary risk. A coherent agent would buy/sell at prices corresponding to their credences.
  - **Side B Prediction**: The market price at cash-out should reflect the best available estimate under the constraint of avoiding feasible exploitation over time. The residual risk might be treated differently because the outcome may never be settled (or settled beyond the agent's horizon). The risk is not like ordinary uncertainty because it is tied to logical truth, and the price should be set by a process that converges over time to the truth if the conjecture is settled.

  #### Crux 4: Mirror markets (Mirror Markets Case)
  **Case**: Two prediction markets are run in parallel for the same open conjecture. In one market, an extra axiom (known to be consistent but not known to be true) is added to the background theory. In the other, a hint is leaked that a proof exists (without revealing the proof). Do the two price series converge over time? And would convergence (or failure to converge) discriminate between the two accounts?

  - **Side A Prediction**: The two markets should have different initial prices because the extra information (axiom or hint) changes the logical prior. However, if the extra axiom is true and the hint is reliable, then both markets should eventually converge to 1 if the conjecture is true (or 0 if false). Failure to converge would indicate that the markets are not properly updating on logical evidence. The coherentist view expects convergence only if the extra information is true and the updating is correct.
  - **Side B Prediction**: The markets may converge if the extra axiom or hint leads the participants to update in a way that accelerates the convergence to the truth. However, the convergence crowd is more concerned with the long-run behavior under feasible updating. If the extra axiom is false or the hint is misleading, the markets might diverge until the error is discovered. The key point is that the convergence account focuses on the sequence of prices being unexploitable and converging to the truth if the conjecture is settled, regardless of the starting point.

  ### 4. Verbal vs Real Disagreements

  We identify the following as **merely verbal disagreements**:

  - **Use of "probability"**: 
    - Side A uses "probability" to mean a fair betting price that satisfies the probability calculus at a given time (even if not computable). 
    - Side B uses "probability" to mean a decision-guiding number that is part of a feasible updating strategy that achieves good long-run properties.

  - **Idealization**: 
    - Side A's use of a noncomputable prior is intended as a normative ideal, similar to ideal rational agents in economics. 
    - Side B rejects this as an ideal because it is unattainable. This disagreement is partly about what counts as a legitimate idealization in normative theory.

  We identify the following as **real disagreements**:

  - **The necessity of synchronic coherence**: Side A believes that synchronic coherence is a fundamental requirement of rationality, while Side B believes that it is not when it is computationally unattainable and the only meaningful exploitability is diachronic and feasible.

  - **The role of Dutch book arguments**: Side A accepts the Dutch book argument as a theoretical constraint even when the bookie is noncomputable, while Side B rejects such arguments as irrelevant for real agents and only accepts feasible Dutch books.

  - **The basis for one-shot decisions**: Side A grounds one-shot decisions in a current (partial) coherent distribution, while Side B grounds them in the long-run strategy that the current decision is part of.

  This document represents the points of agreement and disagreement as understood by both parties. The cruxes are designed to test the predictions of each side in concrete scenarios, and the outcomes of such tests may help resolve the real disagreements.
answer: |-
  ## Joint Adversarial Collaboration Statement on Logical Uncertainty  
  *Agreed by Side A (Coherentists) and Side B (Convergence Crowd)*  

  ### I. Agreed Claims  
  Both parties affirm the following:  

  1. **Probability Calculus Constraints**  
     - The probability calculus (non-negativity, additivity, normalization) constrains credences *only when* an agent can feasibly compute all logical relationships between propositions. When computational limits prevent identifying contradictions or entailments, the calculus permits gaps in assignments (e.g., assigning \( P(\phi) + P(\neg\phi) < 1 \)) without violating normativity.  

  2. **Source of Logical Uncertainty**  
     - All logical uncertainty (in bounded computations or unbounded conjectures) stems from computational intractability. An idealized, computationally unbounded agent would hold only credences 0 or 1 in mathematical claims.  

  3. **Money Pump Vulnerability**  
     - Synchronic Dutch books (exploiting incoherent credences *at a fixed time*) are only a threat if the bookie can feasibly identify inconsistencies *without* resolving the very logical uncertainties the agent faces. Thus, the money-pump argument does not straightforwardly apply to logical uncertainty.  

  4. **Bounded vs. Unbounded Claims**  
     - Uncertainty about bounded computations (e.g., SAT solvability) and unbounded conjectures (e.g., Goldbach’s conjecture) differ in *epistemic accessibility*: bounded claims are decidable in finite time with sufficient resources, while unbounded claims may lack any feasible decision procedure. Both, however, fall under the same normative framework for logical uncertainty.  

  5. **Self-Referential Limitations**  
     - An agent cannot assume it will eventually prove/disprove all statements, nor unconditionally trust its future self’s proofs. Self-referential risks (e.g., inconsistency from assuming "I will prove consistency") require conservatism: agents should not precommit to accepting all future deductions without safeguards.  

  6. **One-Shot Decision Guidance**  
     - Both frameworks provide *some* number for one-shot decisions. Coherentists use a synchronic probability; convergence theorists use a time-indexed policy output. Neither framework dictates a unique *computable method* for deriving this number.  

  7. **Common Goal**  
     - Both aim to avoid long-term exploitation and ensure that credences "track truth" (e.g., converge to 1 for proved statements). Disagreement centers on *how* to formalize this.  

  ---

  ### II. Disagreements Table  
  | Neutral Statement                                                                                                | Side A (Coherentists) Preferred Phrasing                                                                                              | Side B (Convergence Crowd) Preferred Phrasing                                                                                              |  
  |------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------|  
  | **The core normative requirement for logical uncertainty.**                                                     | Synchronic coherence (no Dutch book *in principle*) is fundamental. Diachronic properties derive from iterated conditioning on proofs. | Diachronic coherence (no feasible long-term exploitation) is fundamental. Synchronic coherence is neither necessary nor achievable.         |  
  | **The status of a noncomputable prior over logical completions.**                                                | It is the gold standard for rationality; agents should approximate it despite computational limits.                                   | It is a fiction with no normative force; ideals must be grounded in feasible computation.                                                  |  
  | **How to interpret "exploitable" in logical uncertainty.**                                                       | Exploitability is a timeless flaw: if *any* trader (even noncomputable) can extract unbounded value, the beliefs are defective.       | Exploitability requires feasibility: only traders with bounded runtime can criticize beliefs. Logical uncertainty voids synchronic Dutch books. |  
  | **The role of future proofs in justifying current credences.**                                                   | Current credences are defined by a prior conditioned on *all possible proofs*; future proofs are merely informative updates.           | Current credences are outputs of a policy designed to handle *expected proof streams*; future proofs are constrained by feasible anticipation. |  
  | **What determines the "right" credence for a one-shot decision.**                                                | The number is the probability from the most coherent approximation of the ideal prior, given current resources.                       | The number is the output of a policy that provably avoids long-term exploitation and converges efficiently, regardless of synchronic coherence. |  

  ---

  ### III. Cruxes: Predictions for Concrete Cases  
  Both sides accept these cases as evidence bearing on their disagreements. Predictions are stated in advance.  

  #### Case 1: Sign-Off Decision  
  *Context: Formal-verification engineer must certify a crypto construction today. The security claim is provable but will likely remain unresolved for decades. How does each framework guide the number used?*  
  - **Side A Prediction**: The engineer should use a probability from a coherent prior (e.g., based on heuristic analysis of similar proofs), ensuring it is Dutch-book-defensible *in principle*. The number is constrained by coherence, even if approximate.  
  - **Side B Prediction**: The engineer should use a number from a policy that avoids exploitability by feasible traders (e.g., derived from empirical success rates of analogous heuristics). Coherence is irrelevant; policy performance matters.  
  - **Evidence Bearing On**: Whether synchronic coherence provides actionable guidance for one-shot decisions under intractability.  

  #### Case 2: Sieve & Verifier  
  *Context: A fast heuristic ("sieve") flags if a hard claim is provable (with 80% accuracy). A slow verifier confirms it in a year. What interim credence should an agent hold after seeing the sieve’s output?*  
  - **Side A Prediction**: The credence should be \( P(\text{true} | \text{sieve}=Y) \), computed from a coherent prior that models sieve reliability and logical dependencies. Discounting the sieve requires Bayesian updates.  
  - **Side B Prediction**: The credence should track historical calibration (e.g., "when sieve says Y, 80% of claims are later verified true"). No logical prior is needed; the credence is a function of empirical reliability.  
  - **Evidence Bearing On**: Whether logical testimony requires modeling within a global prior or reduces to empirical calibration.  

  #### Case 3: Settlement-Lag Prediction Market  
  *Context: A prediction market on P≠NP cashes out in 6 months, decades before resolution. Traders hold shares until cash-out. Who bears the residual risk, and is it "ordinary" risk?*  
  - **Side A Prediction**: The risk is held by traders with incoherent beliefs. It behaves like ordinary uncertainty (e.g., weather futures) because prices reflect synchronic probabilities.  
  - **Side B Prediction**: The risk is held by traders who underestimate feasible exploitation. It behaves uniquely: prices may drift without new evidence until cash-out, unlike empirical markets.  
  - **Evidence Bearing On**: Whether logical uncertainty reduces to subjective probability or requires distinct treatment.  

  #### Case 4: Mirror Markets  
  *Context: Two prediction markets run for the same conjecture. Market A adds a consistent but unproven axiom; Market B leaks "a proof exists." Do prices converge?*  
  - **Side A Prediction**: Prices may diverge initially but converge over time if the axiom/hint is valid. Coherence demands consistency with logical entailment, forcing reconciliation.  
  - **Side B Prediction**: Prices need not converge: Market B may spike then crash if the leak is misleading, while Market A may stagnate. Feasible traders cannot force convergence without proofs.  
  - **Evidence Bearing On**: Whether logical evidence is handled by coherence (forcing convergence) or by diachronic policies (allowing divergence).  

  ---

  ### IV. Merely Verbal vs. Real Disagreements  
  - **Verbal Disagreements**:  
    - "Probability" means a fair betting price (Side A) vs. a decision-guiding output of a policy (Side B).  
    - "Ideal" means a limit of rationality (Side A) vs. an unattainable fiction (Side B).  
    - "Exploitability" is defined extensionally (Side A) vs. computationally (Side B).  
    These obscure common ground: both sides reject incoherence *when feasible to avoid*.  

  - **Real Disagreements**:  
    1. **Synchronic Coherence Necessity**: Is it a fundamental norm (Side A) or a distractingly infeasible demand (Side B)?  
    2. **Role of Noncomputable Ideals**: Do they provide normative direction (Side A) or mislead by ignoring constraints (Side B)?  
    3. **Grounds for One-Shot Decisions**: Is the number justified by its place in a global prior (Side A) or by policy performance (Side B)?  
    4. **Handling Logical Evidence**: Does testimony require integration into a logical prior (Side A) or reduce to empirical learning (Side B)?  

  ---  
  **Signed**,  
  *Side A (Coherentists)*  
  *Side B (Convergence Crowd)*  
