answer: |-
  ### Exam Question: Simpson's Paradox and Causal Inference (40 minutes)  
  **Total marks: 20**  
  **Instructions:** Answer all parts clearly and concisely. Justify your responses using statistical principles and causal reasoning. Show all calculations.  

  ---

  **Background:** Simpson’s Paradox occurs when an association observed in aggregated data reverses or disappears when data are stratified. Below are three hypothetical studies (A, B, C) comparing Treatment (T) vs. Control (C) on a binary outcome (Success/Failure).  

  #### Study A:  
  *Aggregate Data:*  
  | Group   | Success | Failure |  
  |---------|---------|---------|  
  | T       | 20      | 80      |  
  | C       | 30      | 70      |  
  *Stratified by Gender (M/F):*  
  - **Males:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 18      | 42      |  
    | C     | 7       | 63      |  
  - **Females:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 2       | 38      |  
    | C     | 23      | 7       |  

  #### Study B:  
  *Aggregate Data:*  
  | Group | Success | Failure |  
  |-------|---------|---------|  
  | T     | 40      | 60      |  
  | C     | 50      | 50      |  
  *Stratified by Age (Young/Old):*  
  - **Young:** (*Each stratum has identical size*)  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 30      | 20      |  
    | C     | 10      | 40      |  
  - **Old:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 10      | 40      |  
    | C     | 40      | 10      |  

  #### Study C:  
  *Aggregate Data:*  
  | Group | Success | Failure |  
  |-------|---------|---------|  
  | T     | 30      | 70      |  
  | C     | 20      | 80      |  
  *Stratified by Severity (Low/High):*  
  - **Low Severity:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 20      | 20      |  
    | C     | 15      | 15      |  
  - **High Severity:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 10      | 50      |  
    | C     | 5       | 65      |  

  #### Study D (Bonus):  
  *Aggregate Data:*  
  | Group | Success | Failure |  
  |-------|---------|---------|  
  | T     | 34      | 66      |  
  | C     | 45      | 55      |  
  *Stratified by Biomarker (Present/Absent):*  
  - **Biomarker Present:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 30      | 10      |  
    | C     | 5       | 45      |  
  - **Biomarker Absent:**  
    | Group | Success | Failure |  
    |-------|---------|---------|  
    | T     | 4       | 56      |  
    | C     | 40      | 10      |  

  ---

  **Questions:**  
  1. **Possibility Check (6 marks):**  
     For Studies A, B, and C:  
     (a) Calculate the success *risk difference* (RD) for Treatment vs. Control in aggregate and stratified tables.  
     (b) State whether a Simpson’s reversal (aggregate vs. stratum-specific RDs switch direction) occurs.  
     (c) Explain *why each reversal is mathematically possible* (or impossible) in 1–2 sentences per study.  

  2. **Effect Measures & Collapsibility (6 marks):**  
     (a) In Study C, calculate the success *odds ratio* (OR) for Treatment vs. Control in aggregate and stratified tables.  
     (b) Does a reversal occur for ORs? If yes, explain why this is possible *even though the risk difference shows no reversal*.  
     (c) Name the statistical property that allows this OR phenomenon and define it.  

  3. **Causal Interpretation (6 marks):**  
     Suppose Studies A and D represent real experiments.  
     (a) For Study A, assume Gender is a confounder (e.g., influences both treatment choice and outcome). Which analysis (aggregate/stratified) is causally appropriate? Why?  
     (b) For Study D, assume the Biomarker is *caused by* Treatment (e.g., T → Biomarker → Outcome). Why might stratifying by Biomarker mislead causal conclusions?  
     (c) What information *outside the data* is needed to resolve Simpson’s Paradox?  

  4. **Bonus (2 marks):**  
     In Study B, why does the reversal persist despite equal stratum sizes? How does this clarify a common misconception?  

  ---

  ### Model Answer (550 words)  
  **1. Possibility Check:**  
  - **Study A:**  
    - Aggregate RD: T = 20/100 = 0.20, C = 30/100 = 0.30 → RD = –0.10 (Harm).  
    Stratified RD: Males (T: 18/60=0.30, C: 7/70=0.10 → RD = +0.20); Females (T: 2/40=0.05, C: 23/30≈0.77 → RD = –0.72). **Reversal occurs** (T harmful overall, beneficial for males).  
    *Why possible?* Imbalanced strata and effect modification: Males are larger and T benefits males.  

  - **Study B:**  
    - Aggregate RD: T = 40/100 = 0.40, C = 50/100 = 0.50 → RD = –0.10 (Harm).  
    Stratified RD: Young (T: 30/50=0.60, C: 10/50=0.20 → RD = +0.40); Old (T: 10/50=0.20, C: 40/50=0.80 → RD = –0.60). **Reversal occurs**.  
    *Why possible despite equal strata?* Simpson’s Paradox depends on effect heterogeneity and confounding, not stratum size imbalance.  

  - **Study C:**  
    - Aggregate RD: T = 30/100 = 0.30, C = 20/100 = 0.20 → RD = +0.10 (Benefit).  
    Stratified RD: Low Sev (T: 20/40=0.50, C: 15/30=0.50 → RD = 0); High Sev (T: 10/60≈0.167, C: 5/70≈0.071 → RD = +0.096). **No reversal** (T beneficial both overall and in strata).  
    *Why possible?* No confounding: RDs are consistent.  

  **2. Effect Measures & Collapsibility:**  
  (a) **Study C ORs:**  
  - Aggregate: (30/70) ÷ (20/80) = (0.429/0.25) ≈ 1.71 (Benefit).  
  - Low Sev: (20/20) ÷ (15/15) = 1.0 (Null); High Sev: (10/50) ÷ (5/65) ≈ (0.20/0.077) ≈ 2.60 (Benefit).  
  (b) **OR reversal?** No reversal (OR >1 throughout). However, the *magnitude* changes (non-uniform ORs). **RD showed no reversal, but ORs are non-collapsible**: Aggregate OR (1.71) ≠ weighted average of stratum ORs (1.0, 2.60).  
  (c) **Non-collapsibility**: ORs (and ratios generally) are not collapsible; marginal and conditional effects differ even without confounding. Risk differences *are* collapsible under no confounding.  

  **3. Causal Interpretation:**  
  (a) **Study A**: Stratified analysis is causally appropriate. Gender confounds treatment and outcome (e.g., men preferentially receive T and have higher success). Conditioning removes bias.  
  (b) **Study D**: Biomarker is a *mediator* (T causes Biomarker, which affects outcome). Stratifying blocks part of T’s effect → "overadjustment." Aggregate RD (T: 34/100=0.34, C: 45/100=0.45 → RD = –0.11) suggests harm, but stratified shows benefit if Biomarker present (RD = +0.50) and absent (RD = +0.08). Causal effect is masked.  
  (c) **External information** (e.g., DAGs, subject-matter knowledge) is needed to decide whether to condition. Joint distributions show associations but not causal pathways.  

  **4. Bonus:**  
  Study B shows reversals can occur with equal strata sizes. A common misconception is that Simpson’s Paradox requires imbalanced strata, but it arises from **effect heterogeneity and confounding**, not sample size alone. Equal strata highlight that imbalance in *effects* (not sample) drives the paradox.  

  ---

  ### Marking Scheme (20 marks total)  
  **A (18–20)**: All calculations correct. Identifies reversals in A/B but not C. Explains:  
  - Reversal possible due to effect modification/confounding (A) and stratum independence (B) (3 marks).  
  - Non-collapsibility of ORs in C despite no confounding (2 marks).  
  - Causal reasoning: Confounding (A) vs. mediation (D) (3 marks).  
  - Names "non-collapsibility" and "external causal knowledge" (2 marks).  
  - Bonus: Debunks stratum-size misconception (2 marks).  

  **B (14–17)**: Minor calculation errors. Correct on reversals (A yes, B yes, C no) but incomplete causal reasoning. Misses:  
  - Why equal strata still permit reversal (B).  
  - Distinction between collapsibility (RD) vs. non-collapsibility (OR).  
  - Clear mediation explanation for D.  

  **C (10–13)**: Major errors (e.g., reversal in C). Superficial explanations:  
  - Attributes reversal *only* to stratum size imbalance.  
  - Treats OR reversal as identical to RD reversal.  
  - No mention of external information for causal resolution.  

  **D (<10)**: Fails calculations. Claims all/none show reversal. No causal reasoning.  

  ---  
  **American English Note**: "Math" (not "maths"), "center" (not "centre"), "behavior" (not "behaviour").
