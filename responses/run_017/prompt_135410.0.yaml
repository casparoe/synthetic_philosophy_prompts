prompt: |-
  Hey — I'm putting together the final for my upper-division research methods seminar (mix of philosophy and stats majors) and I want one question on Simpson's paradox that seperates people who actually get it from people who've memorised the one textbook paragraph about it.

  The setup I have in mind is three tiny sets of tables: (1) a straight reversal — treatment looks better within each stratum and worse overall; (2) the same idea but with both strata exactly the same size; (3) a version where the two arms are balanced within every stratum, so nothing is confounded at all, but the effect measure is an odds ratio instead of a risk difference, and something paradox-looking still appears (odds ratios aren't collapsable the way risk differences are).

  I want students to have to say which of those are even possible and why, and then to get to the real crux: that no fact about the joint distribution alone settles whether the aggregate table or the stratified one is the causally right one, so something from outside the table has to break the tie. If it fits, add a short part where stratifying is the mistake because the variable you conditioned on is caused by the treatment rather than being a common cause of treatment and outcome.

  Give me the question as I'd actually hand it out, a model answer of about 500–600 words, and a 20-mark scheme that names the specific moves an A answer makes and exactly what the B and C answers leave out. Small enough numbers that it's all doable by hand in ~40 minutes. American English please.
