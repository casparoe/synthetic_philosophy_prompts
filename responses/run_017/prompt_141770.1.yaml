  **What the Game Can’t Reproduce**  
  - **Parameters ≠ reality:** Returns/tax rates are illustrative, not empirical.  
  - **Tax interactions:** Real inheritances sit atop capital gains, trusts, and gift rules.  
  - **Opportunity ≠ process:** The game equalizes starting wealth, not opportunity (e.g., education, discrimination).  
  - **Inequality metrics:** Uses consumption, not wealth/Gini (simplicity trade-off).  

