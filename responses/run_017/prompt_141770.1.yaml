  ### Participant Handout  
  **The Lineage Wealth Game**  

  You are part of a multi-generational family. Over three generations, you will receive wealth, make investment and consumption choices, and pass resources to your child. Your goal is to maximize your **family score**, calculated as:  
  - Your own consumption: **full weight (1.0x)**  
  - Your child’s consumption: **half weight (0.5x)**  
  - Your grandchild’s consumption: **quarter weight (0.25x)**  

  #### Rules  
  1. **Starting Wealth**  
     - **Generation 1:** Begin with 100 units.  
     - **Generations 2 and 3:** Receive an inheritance from your parent (after taxes) plus an equal **stake** from pooled taxes (if available).  

  2. **Investment**  
     - **Safe Project:** 10% return (e.g., 100 → 110).  
     - **Risky Project:** Roll a die.  
       - 1–3: Lose 10% (e.g., 100 → 90).  
       - 4–6: Gain 50% (e.g., 100 → 150).  
     *Expected return of risky is higher, but outcomes vary.*  

  3. **Passing Wealth to Your Child**  
     Choose how to transfer your remaining wealth (after consumption):  
     - **Bequest (at death):** Taxed at current **estate tax rate** (set by prior generation’s vote).  
     - **Gift (during life):** Taxed at **5%** (always). **Capped at 20 units per generation.**  
     - **Merger:** Pool all wealth with another player. Choose one heir (yours or theirs) to inherit everything. **Untaxed, irreversible, and requires mutual agreement.** The other heir receives nothing from you.  

  4. **Tax Vote**  
     At the end of each generation, vote by majority rule to set the **estate tax rate** for the **next** generation. Rates: 0%, 20%, 40%, 60%, or 80%.  
     *Revenue funds the **stake** (next generation’s starting boost).*  

  5. **Stake**  
     All tax revenue is split equally among the next generation as a starting bonus.  

  #### How We Play  
  - **Lineages:** You are in a 3-person lineage (parent → you → child).  
  - **Generations:** We play 3 rounds (1 per generation).  
  - **Your Role:**  
    - **Gen 1:** No parent (start with 100). Pass to your child (Gen 2).  
    - **Gen 2:** Receive from Gen 1. Pass to your child (Gen 3).  
    - **Gen 3:** Receive from Gen 2. Pass to an external heir (not scored).  

  *Track investments, consumption, and transfers on your index card. The facilitator records outcomes on the whiteboard.*  

  ---  

  ### Facilitator’s Sheet  
  **Parameters**  
  - **Initial wealth (Gen 1):** 100 per player.  
  - **Investment returns:**  
    - Safe: +10% (multiply by 1.1).  
    - Risky: Die roll (1–3: ×0.9, 4–6: ×1.5). *Expected return: 20% (attractive but volatile).*  
  - **Gift tax:** Fixed 5%.  
  - **Gift cap:** 20 units per player per generation.  
  - **Estate tax:** Starts at 0% for Gen 1. Set by vote for next gens (options: 0/20/40/60/80%).  
  - **Merger:** No tax. Requires consent and heir agreement.  
  - **Stake:** Tax revenue (gifts + estates) divided equally among next gen.  
  - **Scoring:** Player score = Own consumption × 1 + Child’s consumption × 0.5 + Grandchild’s consumption × 0.25.  

  **Sensitive Parameter**  
  The **gift cap (20 units)** is critical. If too high, players avoid estate tax entirely, shrinking the tax base. If too low, gifts become irrelevant, overemphasizing bequests/mergers.  

  **Ledger (Whiteboard Setup)**  
  | Player (Lineage) | Start Wealth | Investment | Wealth After | Consumption | Gift (Tax) | Bequest (Tax) | Merger? | Final Pass |  
  |------------------|-------------|-----------|-------------|------------|-----------|--------------|---------|----------|  
  | ...              | ...         | ...       | ...         | ...        | ...       | ...          | ...     | ...      |  
  **Tax Revenue:** [Total] → Stake per player next gen: [Amount]  
  **Vote:** Estate tax rate for next gen: [0/20/40/60/80%]  

  **Timeline (90 Minutes)**  
  - **0–5 min:** Distribute handouts. Assign lineages (6 lineages × 3 players). Explain goals/rules.  
  - **5–15 min:** **Gen 1 Setup**  
    - Gen 1: Start at 100. Choose investment (safe/risky). Resolve returns (dice for risky).  
    - Choose consumption. Choose passing method (gift/bequest/merger). Record decisions.  
    - Calculate taxes, stake for Gen 2. Vote to set estate tax for Gen 2.  
  - **15–35 min:** **Gen 2 Play**  
    - Gen 2: Start = Inheritance (after tax) + Stake. Repeat investment/consumption/passing.  
    - Resolve mergers (require consent and heir agreement).  
    - Calculate taxes, stake for Gen 3. Vote to set estate tax for Gen 3.  
  - **35–55 min:** **Gen 3 Play**  
    - Gen 3: Start = Inheritance (after tax) + Stake. Repeat process.  
    - Record final consumption.  
  - **55–75 min:** **Scores & Reset**  
    - Compute scores (self + 0.5×child + 0.25×grandchild).  
    - Reset for second session (new lineages, same rules).  
  - **75–90 min:** **Debrief** (see below).  

  ---  

  ### Debrief Script  
  **Structure**  
  1. **Start with observations:** Ask, *"What patterns did you notice in wealth/inequality?"*  
     - *Likely responses:* "Some families got richer by luck/mergers," "Taxes didn’t erase gaps," "Mergers helped dodge taxes."  
     - **Response:** "Yes—even with a stake (equal starting boost), gaps grew. Why?"  

  2. **Point 1: One-Time vs. Continuous Equalization**  
     - *Map to play:* Note Gen 1 started equal. By Gen 3, wealth dispersed.  
     - *Likely remark:* "My risky bet failed, so my grandchild got less."  
     - **Response:** "Exactly. Initial equality erodes fast: thrift, risk, luck stack up. The stake *softened* this but didn’t reset it. Continuous equalization requires constant intervention—like voting on taxes every generation. That’s not just redistribution; it’s a recurring claim on how families pass wealth."  
     - *Settled consensus:* Wealth disperses over generations absent intervention (Piketty, Saez). *Live dispute:* Whether continuous leveling is desirable/sustainable (liberty vs. equity trade-offs).  

  3. **Point 2: Endogenous Tax Base**  
     - *Map to play:* High estate taxes led to more gifts/mergers (e.g., "I gifted 20 to avoid 40% tax").  
     - *Likely remark:* "We merged to skip taxes—then one heir got everything!"  
     - **Response:** "Right. The tax base isn’t fixed. When taxes rise, people shift channels. Gifts avoid taxes (but are capped), mergers avoid taxes *and* concentrate wealth. So the thing being taxed—family wealth transfers—changes shape based on the rules."  
     - *Settled consensus:* Tax bases react to policy (elasticity of taxable wealth). *Live dispute:* How much avoidance occurs in real life (trusts, loopholes).  

  4. **Address Limitations**  
     - Parameters (e.g., 20% risky return) are illustrative—not measured. Real returns vary.  
     - Real-world overlaps: Inheritance taxes interact with capital gains/trusts (not modeled).  
     - Equal opportunity here is about starting points, not process fairness (e.g., merit vs. luck).  

