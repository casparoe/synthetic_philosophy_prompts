  ### Predictable Failures & Fixes  
  1. **Vote Collapses (0% or 80% immediately):**  
     - *Fix:* Remind players the stake funds their child’s start. If Gen 1 votes 0%, Gen 2 gets no stake—highlighting trade-offs.  
