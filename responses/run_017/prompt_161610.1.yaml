  ### Sestina for the Counterfactual Chart  

  After the shaft was made secure, the gallery cleared,  
  we tallied the saved: no soot-faced **MAN**  
  crushed by stone; no **WOMAN** bent double in grief;  
  no small **CHILD** left unfed; no missing **LOAF**  
  on the table; no cold hearth in the **HOUSE**.  
  Only the black seam of **COAL** ran deep.  

  A new sign was sketched: the same **HOUSE**  
  but barred. The draftsman said, "See? Not **COAL**  
  but its absence. Here, where the **MAN**  
  should stand, we draw him crossed. The **WOMAN**  
  too. The slash means *never was*. That **LOAF**  
  uneaten? Mark it so. The spared **CHILD**?"  

  But the slash, they found, taught poorly. That **CHILD**  
  saw *forbidden*, not *unharmed*. The **HOUSE**  
  with a bar? *No home here*, not *no grief*. The **LOAF**  
  scratched through meant *don’t eat*, not *still whole*. **COAL**  
  crossed out warned *don’t dig*, not *no death*. The **WOMAN**  
  stood blocked: *stop*, not *saved*. Even the **MAN**  

  struck through seemed to shout *halt!* Not one **MAN**  
  grasped *what didn’t happen* unprompted. The **CHILD**  
  needed words to parse the barred **WOMAN**;  
  the clean chart frayed at the edge. Each **HOUSE**  
  required a key. Abstraction bled the **COAL**  
  dry. Pictograms can’t argue *if* or *but*. The **LOAF**  

  demands: *more grain* or *less grain*. Not that **LOAF**  
  *unlost*. You can show ten men, one **MAN**  
  gone, but gone *why*? Was it war? Was it **COAL**  
  gas? The bar just hovers. Ask a **CHILD**:  
  "Is that *no entry*?" Point to the **HOUSE**.  
  "Is that *not built*?" Not *not dead*. The **WOMAN**  

  needs a story. Pictures, said the **WOMAN**  
  from the press shop, aren’t magic. That **LOAF**  
  means bread. That roof means **HOUSE**.  
  The silhouette’s one task. A **MAN**  
  is a man. To show *he lived*, stack him. A **CHILD**  
  saved? Draw her whole. But how to draw *no* **COAL**-  

  collapse? No ghost **COAL**? No **HOUSE**  
  emptied? The bar makes rules, not meaning. **MAN**,  
  **WOMAN**, **CHILD**, **LOAF**— all signs demand we learn the world again.  

  ---

  **Notes on the signs for accuracy (not part of the display):**  
  - **COAL**: Represents the mine/industry. Used literally (seam of coal) and metonymically (cause of danger).  
  - **MAN/WOMAN/CHILD**: Fixed, uniform silhouettes. Show presence/absence; cannot convey negation or causality alone.  
  - **LOAF**: Symbolizes sustenance (bread). Quantity shown by repetition; negation bar misreads as prohibition (e.g., "don’t eat").  
  - **HOUSE**: Home/shelter. Bar implies "no entry" or "not built," not "no bereavement."  

  The poem adheres to Neurath’s principles: signs retain fixed meanings, repetition denotes quantity, and the envoi mirrors a chart’s summary row. The diagonal bar’s limitations highlight Isotype’s role as a "helping language" requiring explanation.
