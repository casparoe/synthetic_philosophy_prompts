prompt: |-
  I work in psychophysics and use signal detection theory daily: d′, response criterion, log-likelihood ratios, ROC and isosensitivity curves, payoff matrices, optimal criterion placement, and the standard point that sensitivity and bias can be estimated separately once ground truth across many trials is available. My philosophy training stops at two undergraduate courses. I am trying to get clear on the dispute among classical invariantism, epistemic contextualism, and pragmatic encroachment — the view that what is at stake for a subject can raise the bar for whether she knows — and I want it in my vocabulary rather than theirs.

  Restate each of the three positions as faithfully as you can in signal-detection terms, applied to the familiar case pairs in which the same evidence and the same true belief seem to suffice for knowledge when nothing hangs on being right and to fall short when a mistake would be costly. For each view, say what plays the role of the sensitivity quantity, what plays the role of the decision variable, what sets the threshold, and which of these the view claims is fixed by the meaning of "knows" rather than supplied by the situation.

  Then the residue report, which is the part I care about. Three things in particular. First: in signal detection theory a criterion shift trades false alarms against misses symmetrically, whereas stakes in these cases seem only ever to raise the bar — so is encroachment really an operating-point shift, or a one-directional threshold raise, and does the difference carry any weight? Second: sensitivity and criterion are identifiable only given ground truth across trials, while for knowledge ascriptions the only data are intuitions about cases; does that make the three views notational variants of one another, a parameter-identification failure rather than a substantive dispute, or is that impression an artifact of the translation? Third: the argument that knowledge is what licenses action and assertion seems to have no counterpart in a framework whose outputs are just decisions under a payoff matrix.

  For each item, say what you had to fudge to make it fit, and close with a verdict on the residue: does it point to something signal detection theory cannot express, or to something the epistemologists' debate was never clearly about?
reasoning: |-
  Okay, let me approach this systematically. The user is a psychophysics researcher deeply familiar with signal detection theory (SDT) who wants to map epistemological debates about knowledge to SDT concepts. They're specifically interested in how classical invariantism, contextualism, and pragmatic encroachment translate into SDT terms regarding sensitivity, decision variables, and thresholds.

  First, I need to accurately restate each position in SDT terms:
  - For classical invariantism, knowledge sensitivity (d') would be fixed, with a constant threshold based solely on evidence strength. The criterion (λ_c) would be invariant across stakes.
  - Contextualism would keep d' fixed but allow the conversational context to shift the threshold (λ_c). The meaning of "knows" changes with context.
  - Pragmatic encroachment also keeps d' fixed but has practical stakes directly affect the threshold (λ_c). Higher stakes raise the evidentiary bar.

  The user's residue report raises three key issues:
  1) Asymmetry in threshold shifts: Unlike SDT where criterion shifts trade off false alarms and misses, epistemic stakes seem to only raise the bar. I need to consider if this is a fundamental difference or just emphasis.
  2) Identifiability problem: Without ground truth data across trials (only case intuitions), can we really distinguish these views? This might make them empirically indistinguishable.
  3) Action/licensing gap: SDT's payoff matrices don't capture how knowledge licenses assertion/action - a core epistemological concern missing in the model.

  For each issue, I'll note where the SDT mapping requires fudging:
  - The asymmetry might reflect that epistemology focuses on high-stakes cases where avoiding false positives dominates.
  - The identifiability problem suggests the debate may be more about theoretical commitments than testable differences.
  - The action-gap indicates SDT can model decision thresholds but not the normative link between knowledge and justification.

  The residue analysis points to limitations in both frameworks: SDT can't express the normative aspects of knowledge, while epistemologists may be debating intuitions without empirical anchors. The core distinction lies in what each framework considers fundamental - SDT cares about measurable performance, epistemology about conceptual boundaries.
answer: |-
  Here's the SDT translation of the three epistemological positions, followed by the residue analysis. I've preserved the core commitments of each view while mapping them to detection theory components. The "fudges" required highlight genuine philosophical/scientific tensions.

  ### Core SDT Analogy Setup
  - **Stimulus/State**: The true state of the world (e.g., "COW present" vs. "HORSE present").
  - **Evidence (Decision Variable)**: Sensory input transformed into an internal scalar (e.g., neural evidence for "cowness").
  - **Sensitivity (d′)**: Discriminability between signal (truth) and noise (falsehood).
  - **Criterion (λ)**: Threshold on the decision variable for responding "YES" (e.g., "It's a cow").
  - **"Knows p" ascription**: Equivalent to a "YES" response that meets a justified threshold.

  ---

  ### 1. **Classical Invariantism** (e.g., Timothy Williamson, Earl Conee)  
     - **SDT Restatement**:  
       - *Sensitivity (d′)* is fixed by the agent's *epistemic position* (reliability of perception/memory).  
       - *Decision Variable* is the *strength of evidence* for *p*.  
       - *Threshold (λ)* is **fixed** by the *semantics of "knows"* itself. It requires a d′ high enough to rule out relevant alternatives (e.g., λ must exclude "horse" hypotheses).  
       - Stakes affect *action* but not knowledge: A high-stakes "raise" is a *post-knowledge* shift in *action criterion* (e.g., requiring d′ > 3.0 to *act*, even if d′ > 1.5 suffices to *know*).  
     - **Key Claim**: "Knows" semantically demands a fixed λ, independent of practical context. Stakes only affect downstream decisions.

  ### 2. **Epistemic Contextualism** (e.g., Stewart Cohen, David Lewis)  
     - **SDT Restatement**:  
       - *Sensitivity (d′)* is fixed by the agent's epistemic position.  
       - *Decision Variable* is the strength of evidence for *p*.  
       - *Threshold (λ)* is **set by conversational context** (e.g., what alternatives are salient).  
       - The *meaning of "knows"* is **context-sensitive**: In low-stakes, λ is low (d′ > 1.0); in high-stakes, λ rises (d′ > 2.5) because new error possibilities become relevant (e.g., "zebra" in a safari context).  
     - **Key Claim**: "Knows" is indexical; its threshold λ varies with the attributor's context.

  ### 3. **Pragmatic Encroachment** (e.g., Jeremy Fantl, Matthew McGrath)  
     - **SDT Restatement**:  
       - *Sensitivity (d′)* is fixed by the agent's epistemic position.  
       - *Decision Variable* is the strength of evidence for *p*.  
       - *Threshold (λ)* is **set by practical stakes** (costs of false alarms vs. misses).  
       - The *meaning of "knows"* requires meeting a λ **sensitive to the subject's stakes**: High stakes raise λ (d′ must be higher to "know").  
     - **Key Claim**: Knowledge isn't just truth+justification; stakes are *constitutive* of the justification threshold λ for "knows".

  ---

  ### Residue Report: Three Critical Tensions  
  **1. Asymmetry of Stakes Effects**  
     - **SDT Analogy**: In SDT, criterion shifts symmetrically trade false alarms (FA) and misses (M). Stakes in epistemology seem only to *raise* λ to avoid costly FAs (e.g., missing a fire alarm is worse than a false alarm).  
     - **Fudge**: I mapped "avoiding false belief" to avoiding FAs, but misses (failing to believe truth) can also be costly (e.g., missing a cancer diagnosis). Encroachment typically focuses on FA-avoidance because knowledge ascriptions are "positive" (asserting *p*).  
     - **Verdict**: This is a **genuine asymmetry in epistemology's concerns**. SDT can model asymmetric payoffs (e.g., punishing FAs more than Ms), but the *debate* treats stakes as unidirectional because it centers on *confidence for action* (avoiding catastrophic FA) rather than symmetric detection.  

  **2. Identifiability Problem**  
     - **Issue**: Without ground-truth data, can we distinguish whether case intuitions reflect (a) fixed d′ + variable λ (contextualism/encroachment) or (b) variable d′ + fixed λ (invariantism)?  
     - **Fudge**: Invariantists *deny* stakes affect "knowledge" ascriptions—they attribute shifts to *action*, not knowledge. But SDT can't distinguish "knowledge" from "action" without a separate output variable.  
     - **Verdict**: **Notational variants? Partially.** The debate hinges on whether "knows" is *semantically* tied to stakes. But SDT reveals the core problem: **Without independent measures of d′ and λ, the views are empirically underdetermined by intuitions**. The dispute is metaphysical (what "knows" *means*) not operational.  

  **3. Action/Assertion Licensing Gap**  
     - **Issue**: SDT outputs decisions under payoff matrices, but epistemology ties knowledge to *licensing action/assertion*. Encroachment argues high stakes require "more knowledge" to act, but SDT just optimizes payoffs.  
     - **Fudge**: I modeled "knowledge" as a detection-theoretic "YES", but licensing involves *normative* propriety (e.g., "You shouldn't act unless you know"). SDT has no "should"—only expected utility.  
     - **Verdict**: **SDT cannot express the normative link**. The residue points to **epistemology's core concern: justification norms**. SDT describes *how* we decide; epistemology debates *when we're entitled* to decide.  

  ---

  ### Final Verdict  
  The residue reveals **both limitations**:  
  1. **SDT's expressivity gap**: It can't capture the *normative* force of "knowledge" (action/licensing) or the semantic focus of the debate.  
  2. **Epistemology's operational gap**: The dispute is **not clearly about cognitive mechanisms** but about conceptual boundaries. The d′/λ identifiability problem shows the debate is underconstrained by case intuitions alone—it's driven by pre-theoretic commitments about language (contextualism), metaphysics (invariantism), or pragmatics (encroachment).  

  **Conclusion**: Signal detection theory exposes the **parameters at play** (sensitivity, threshold, payoffs) but cannot resolve the debate because it lacks the tools to adjudicate *what the concept "knows" refers to*. The residue points to epistemology's irreducible concern with *semantics and norms*—dimensions SDT deliberately brackets. The dispute isn't about detection performance; it's about how we carve up the space of justified judgment.
