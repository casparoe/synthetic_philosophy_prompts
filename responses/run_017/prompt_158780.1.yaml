     So it depends on the true theory and the intervention.

     In the debrief, we can discuss how the underdetermination might be due to the limited vocabulary, and extending it can help, but only if the new categories are ones that the theories treat differently.

  3. The observation-intervention asymmetry: The only way to break the underdetermination in some cases is to intervene. But intervention is costly and might not work if not chosen well.

  4. Then we introduce the standard names and objections.

  ** What might go wrong **

  - Stronger students might meta-game: they might realize that the true theory is chosen by the instructor and try to guess based on what the instructor would do. To head this off, the instructor can choose the true theory by a coin flip in front of them at the start.

  - Someone might try to extract information from the instructor. The instructor should only answer clarifying questions about the rules, not about the theories or the world.

  - The group might split and then simply assert past each other. To avoid this, within a team, require a vote or consensus on the decisions.

  - The session might land as "science is arbitrary": To head this off, in the debrief, emphasize that in real science, we have more than two theories, and we use criteria like simplicity, fruitfulness, and consilience to choose, and that extending the vocabulary is guided by theoretical reasons.

  ** What the activity cannot reproduce **

  - Real theories are whole webs rather than single rules.
  - Actual scientists share background commitments that quietly break ties.
  - Nothing here touches the global skeptical version of the thesis.

  In the debrief, the instructor will have to supply these.

  ** Debiff for the last 30 minutes **

  1. (5 min) Recap the activity and the decisions made.
  2. (10 min) Map the teams' experiences to the concepts:
     - Weak underdetermination (resolved by more data): happened to teams that did not intervene and saw event4.
     - Strong underdetermination: happened to teams that intervened but still could not distinguish.
     - Vocabulary limitation: teams that bought new categories and whether it helped.
     - Intervention asymmetry: teams that broke the underdetermination by a well-chosen intervention.
  3. (5 min) Introduce the standard names: underdetermination of theories by evidence, empirical equivalence, the role of intervention and counterfactuals, and how extending the observation language is itself a theoretical move.
  4. (5 min) Discuss what a scientist should do in such a situation: consider the costs of intervention, the likelihood that it will be informative, and also consider non-empirical virtues (simplicity, etc.) if the underdetermination persists.
  5. (5 min) Note the limitations of the activity: real science has complex interconnected theories, shared background knowledge, and the global underdetermination is not addressed.

  Given the complexity, this activity should work to make the students experience the concepts.
