  ### Activity Design: "The Silent Mechanism"

  #### **Setup**
  - **Roles**: Divide students into 3 teams of 6 (teams compete independently).  
  - **Asymmetric Information**: Each team gets a "Theory Card" (index card) with one of two rules (see below). Teams don’t know other teams’ cards.  
  - **Materials**: 
    - Whiteboard (publicly tracks: events, tokens, decisions).
    - Index cards (for theories, votes, and explanations).
    - Handout 1: Permitted Observation Categories (fixed list):
      - *Colors*: Red, Blue, Green  
      - *Shapes*: Circle, Square, Triangle  
    - Handout 2: Rules & Payoff Scheme (student-facing).  
    - 3 tokens per team (for buying new categories).  
  - **Hidden Data Stream**: You generate events in real-time based on a pre-selected "true theory" (flip a coin to choose Theory A or B at start).  

  **Theories** (printed on Theory Cards; *do not* name them—label as "Theory 1" and "Theory 2"):  
  - **Theory A (Rigid Cycle)**:  
    - *Rule*: After any event, the next event is determined by the following:  
      - If the previous event was **Red**, the next color cycles: **Blue** → **Green** → **Red**.  
      - If the previous event was **Blue**, the next shape cycles: **Square** → **Triangle** → **Circle**.  
      - *Example*: After (Red, Circle) → (Blue, Square); after (Blue, Square) → (Green, Triangle).  
  - **Theory B (State Reset)**:  
    - *Rule*: After any event, the next event resets to a fixed starting point:  
      - **Red Circle** → **Blue Square** → **Green Triangle** → **Red Circle** (repeats).  
      - *Example*: After (Green, Triangle) → (Red, Circle); after (Red, Circle) → (Blue, Square).  

  **Key**:  
  - Without intervention, both theories predict the *same* sequence:  
    - Event 1: (Red, Circle)  
    - Event 2: (Blue, Square)  
    - Event 3: (Green, Triangle)  
    - Event 4: (Red, Circle)  
    - Event 5: (Blue, Square)  
    - ...and so on.  
  - **Divergence under intervention**:  
    - If an intervention changes Event 4 to **(Red, Square)**:  
      - Theory A predicts Event 5: (Blue, **Triangle**) (shape cycle advances).  
      - Theory B predicts Event 5: (Blue, **Square**) (resets to fixed start).  
    - Other interventions yield agreement (e.g., changing to (Blue, Circle) → both predict (Green, Square) for Event 5).  

  ---

  #### **Timeline (80 Minutes)**  
  1. **0–10 min: Introduction**  
     - Announce: "A mechanism generates events—pairs of (color, shape). You’ve seen Event 1–3: (Red, Circle), (Blue, Square), (Green, Triangle). Two theories exist to explain it. Your goal: find the true theory. Rules:"  
       - Observations must use the fixed categories (Handout 1).  
       - To add a new category (e.g., "Yellow" or "Star"), spend 1 token (teams start with 3).  
       - Before Event 4, teams can **intervene** to set Event 4 to any (color, shape) in their vocabulary (spend 2 tokens). If they decline, Event 4 occurs naturally.  
       - After Event 4, Event 5 will be revealed.  

  2. **10–30 min: Team Discussion**  
     - Teams:  
       - Debate whether to buy new categories (e.g., "Yellow" for $1 token).  
       - Vote (secret ballot) on intervention. *Rule*: Majority vote binds the team.  
       - If intervening, choose a specific (color, shape) for Event 4.  
     - *Instructor*: Record decisions on the whiteboard (e.g., "Team 1 adds ‘Yellow’; Team 2 intervenes to (Red, Square)").

  3. **30–40 min: Event Generation**  
     - For each team:  
       - If **no intervention**: Generate Event 4 (and Event 5) using the true theory’s natural sequence (both theories agree).  
       - If **intervention**: Set Event 4 to their choice. Then generate Event 5 using the true theory’s rule.  
     - *Example* (true theory = A):  
       - Team 1 intervenes to (Red, Square) → Event 4 = (Red, Square); Event 5 = (Blue, **Triangle**).  
       - Team 2 does nothing → Event 4 = (Red, Circle); Event 5 = (Blue, Square).  

  4. **40–55 min: Theory Selection**  
     - Teams review Events 4–5 and choose a theory (A or B) via secret ballot.  
     - They write an explanation: *Why* they chose it (1–2 sentences).  

  5. **55–65 min: Scoring & Reveal**  
     - **Payoff Scheme**:  
       - Correct theory: +10 points.  
       - Incorrect theory: -5 points.  
       - Tokens spent: -1 per token (e.g., spending all 3 → -3).  
       - *Penalty for "right for wrong reason"*: If a team picks the correct theory but their explanation misidentifies the mechanism (e.g., "B is true because Event 5 was (Blue, Square)"—which *both* predict if no intervention), -3 points.  
     - Reveal the true theory and scores.  

  ---

  #### **Debrief (15–25 min)**  
  Map student experiences to concepts:  
  1. **Weak/Transient Underdetermination**:  
     - Teams that **didn’t intervene** saw Event 4/5 resolve everything (e.g., natural Event 4 = (Red, Circle) → they think "more data fixed it"). *This mirrors their "poverty of data" view*.  
     - *Ask*: "Did waiting for Event 4 always work? When didn’t it?" (Point out Team 2: they saw the same Events 4–5 for both theories if they intervened poorly.)  

  2. **Structural Underdetermination**:  
     - Teams that **intervened to (Red, Square)** collided with irreconcilable predictions (Event 5 differed). *Even with action and data, theories were underdetermined*.  
     - *Ask*: "Why couldn’t more data of the ‘same kind’ (e.g., Event 6) help if you intervened poorly?"  

  3. **Vocabulary Artifact**:  
     - Highlight teams that **bought categories** (e.g., "Yellow"). If they used it in intervention (e.g., set Event 4 to (Yellow, Circle)):  
       - True Theory A: Event 5 = (Green, Square) (color cycle: Yellow → Green? No rule! Default to Theory A’s shape cycle → Square).  
       - True Theory B: Event 5 = (Blue, Square) (reset to fixed start).  
       - *Result*: Theories may agree on Event 5, making the new category useless.  
     - *Ask*: "Did adding measurements help? Why/why not?" → Emphasize: Language extensions are theory-laden choices.  

  4. **Observation-Intervention Asymmetry**:  
     - Note that **intervening created divergence** (e.g., (Red, Square) → different Event 5), while observing didn’t.  
     - *Ask*: "What did *doing* something reveal that *watching* couldn’t?"  

  **Introduce Standard Concepts**:  
  - Now name: "What you experienced is **underdetermination**—evidence alone couldn’t pick a theory. **Structural underdetermination** occurs when no data can break the tie without intervention. **Empirical equivalence** made your theories seem identical. Extending your vocabulary wasn’t neutral—it depended on your theory’s rules."  
  - **Objections**: "But in real science, we use simplicity or fruitfulness to choose. Why? Because they resolve underdetermination when evidence can’t."  
  - **Final Q**: "What should a scientist do here?" → Elicit: "Weigh intervention costs vs. value; use non-empirical virtues (simplicity, fruitfulness) when stuck; refine language *theoretically*."  

  ---

  #### **Forecasted Problems & Mitigations**  
  - **Problem 1: Stronger students meta-game** (e.g., "Let’s not spend tokens to save points" or "The prof picked the simpler theory").  
    - *Mitigation*: The penalty for "right for wrong reason" forces them to engage with mechanisms. Coin-flip for true theory adds randomness.  

  - **Problem 2: Students extract information via questions** (e.g., "What happens if we add ‘Yellow’?").  
    - *Mitigation*: Rule: "I only answer *procedural* questions (e.g., voting rules). I won’t discuss theories or predictions."  

  - **Problem 3: Group polarization** (teams split and shout).  
    - *Mitigation*: Secret ballots for intervention and theory choices force consensus. Time limits prevent endless debate.  

  - **Problem 4: "Science is arbitrary" takeaway**.  
    - *Mitigation*: In debrief, contrast with real science: "You had no shared background knowledge or ties to other theories. Real scientists have these—simplicity isn’t arbitrary but tied to a web of commitments."  

  ---

  #### **What the Activity Cannot Reproduce**  
  1. **Theories are webs, not rules**: Students see isolated theories. *Supply in discussion*: "Real theories (e.g., relativity) are networks. Underdetermination is often local and resolved by consilience with other theories."  
  2. **Background commitments break ties**: Students lack shared paradigms. *Supply*: "Scientists inherit training, instruments, and precedents that favor one theory (e.g., preferring particle physics over astrology)."  
  3. **Global skepticism untouched**: This activity is local underdetermination. *Clarify*: "This isn’t about Cartesian demons—it’s about everyday scientific choice. Global skepticism requires different tools."  

  ### **Instructor Script Snippets**  
  - **Kickoff**: "You’re not being tested on philosophy—engage with the mechanism. Your choices have costs, and the goal is truth, not points."  
  - **When Revealing Events**: "Team 1 intervened to (Red, Square). Event 4: (Red, Square). Event 5: [pause] (Blue, Triangle)."  
  - **During Debrief**: "Remember Team 3? They bought ‘Yellow’ but set Event 4 to (Red, Circle). They saw Event 5 = (Blue, Square) and chose Theory B. But both theories predict that! They got ‘right for wrong reason’—a Pyrrhic victory."  

  This design forces students into the gap between transient and structural underdetermination, using intervention costs and vocabulary constraints to make the dilemma visceral. The payoff scheme ensures that "winning cleanly" requires understanding, not luck.
