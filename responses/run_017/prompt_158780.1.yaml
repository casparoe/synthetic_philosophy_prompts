  We are designing an activity for an upper-division philosophy of science seminar. The goal is to have students experience the gap between a weak (temporary, data-poverty) underdetermination and a strong (structural) one, without initially naming these concepts. The activity should emphasize that the underdetermination arises from the limitations of the observational vocabulary and that the only way to distinguish theories is through costly intervention. We also want to highlight that being right for the wrong reason is different from being right for the right reason.

  Design Constraints:
  1. **Actionable divergence**: The two rival theories must agree on all observations and predictions when there is no intervention, but disagree on what would happen under a specific intervention. Deciding to intervene is costly, and the group must decide whether to pay the cost.
  2. **Fixed observation vocabulary**: Start with a printed list of permitted categories. If students want a new category, they must buy it with a scarce token. This forces them to justify extending the language.
  3. **Payoff scheme**: The scoring is against a hidden data stream (generated by the instructor). It should be possible to be right for the wrong reason (and vice versa).

  Activity Setup:

  **Title**: The Hidden Mechanism Challenge (we don't reveal the philosophical point until debrief)

  **Materials**:
  - Whiteboard (for public information: current observations, available tokens, current theories, etc.)
  - Index cards (for each student: one set of rules for the hidden mechanism, but note: we are going to have two rival theories and the hidden mechanism is one of them, but students don't know which)
  - Handout 1: List of permitted observation categories (see below)
  - Handout 2: Rules of the activity (including how to request new categories, how to propose theories, how to vote on intervention, and the scoring system)
  - A hidden data stream (pre-generated by the instructor, or generated on the fly but consistent with one of the two theories until an intervention)
  - Tokens: 3 tokens per team (if teams) or per group (if whole class) for buying new observation categories.

  **Observation Categories (Initial List)**:
