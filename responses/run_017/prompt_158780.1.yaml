  1. The weak/transient reading: Initially, the students might think that if they just wait, they will see event4 and know. But the activity design does not allow that easily because event4 might be the same if they had intervened in a particular way? No, without intervention, event4 is different for the two theories. So the underdetermination is only for the first 3 events, and event4 will resolve it. This is the weak reading: more data of the same kind (event4) will settle it.

