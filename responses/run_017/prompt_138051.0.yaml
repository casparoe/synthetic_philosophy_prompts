prompt: |-
  I'm in a philosophy of mind course, we just did Mary's room and the knowledge argument, and I got into an arguement with a friend who's a third-year med student that I can't settle. Here's the thing I keep coming back to: medical training is built around the idea that some things just can't be learned out of a book. You can memorize every written description of what a heart murmur sounds like, or what an inflamed appendix feels like under your hand, or the exact colour a particular rash has, and the profession still will not let you near patients until you've actually heard, felt and seen enough of them — clinical rotations are mandatory, procedures get logged by count, and there's that old saying about see one, do one, teach one. At the same time the very same institutions treat text and recorded data as perfectly adequate for transmission elsewhere: you're expected to manage conditions you've never seen a case of, written guidelines are treated as enough to standardize care, recorded heart sounds and image atlases get used as substitutes for live patients, and there's a lot of enthusiasm for diagnostic systems that have never had a body or a sense organ at all.

  So what does the hands-on requirement actually presuppose? My friend says it's basically the knowledge argument in institutional form — there are facts about what a murmur sounds like that you can only get by having the experience, and rotations exist to hand you those facts. I think that's too quick, and that the practice fits just as well with the boring reply that Mary doesn't learn a new fact at all, she just acquires abilities: recognizing, imagining, remembering. On that story what rotations build is a similarity space — knowing that this is the same murmur as that one, on a different stethoscope, in a noisy room, in a patient with slightly odd anatomy — which is a point about generalizing to new cases and not obviously about consciousness at all. My TA floated a third thing that I can't tell is deep or a total cheat: maybe rotations are really for calibration, i.e. learning when you don't know, and that would be a purely epistemic point with no metaphysics in it.

  Can you reconstruct the implicit epistemology as cleanly as you can, and then separate what the practice strictly presupposes from what it merely fits well with — does the hands-on requirement really need there to be experiential facts that no amount of text could convey, or would an ability-first story, or a straight physicalist one, license exactly the same training regime? Is the practice even consistent with itself, given that the same institutions let written protocols, recordings, and body-less diagnostic systems stand in for experience in other places? And be concrete about the redesign: if we dropped the Mary-style reading and took the rival view seriously, what in medical training would you actually get rid of, and what would you keep for reasons that have nothing to do with consciousness? At the end, tell me what would change your mind about your own answer — what kind of argument or evidence would convince you the training requirement is (or isn't) real evidence for phenomenal facts — and where your reasoning is most likely to go wrong.
reasoning: |-
  Okay, let me unpack this user's query. They're in a philosophy of mind course and had an argument with a med student friend about Mary's Room and the knowledge argument. The core tension is between the hands-on requirements in medical training (like clinical rotations) versus reliance on texts, guidelines, and AI diagnostics. 

  First, I need to reconstruct the implicit epistemology here. The user presents three possible explanations for why hands-on training is necessary: 
  1) The knowledge argument position (experiential facts exist) 
  2) The ability hypothesis (it's about skills) 
  3) The calibration view (learning uncertainty thresholds)

  Hmm... the user wants to know which of these the practice strictly presupposes versus merely accommodates. They also ask about consistency - why require direct experience for some things but accept substitutes elsewhere? And crucially, they want concrete redesign implications for medical training under each view.

  The med student friend clearly leans toward the knowledge argument interpretation. But the user seems skeptical, favoring the ability hypothesis. The TA's calibration view is an interesting wildcard. 

  Let me analyze the non-reducible elements of clinical training:
  - Pattern recognition under variability (heart murmurs in noisy rooms)
  - Sensorimotor coordination (palpating an abdomen)
  - Uncertainty calibration (knowing when you're unsure)

  The key is that texts/recordings are static while live medicine is dynamic and context-dependent. That explains why institutions use substitutes for stable, pattern-based tasks (like diagnosing a textbook rash from an atlas) but insist on direct experience for variable, embodied skills.

  For the redesign question: 
  Under physicalism/ability view, you'd keep rotations but reframe them as skill-building. You might accelerate training with hyper-realistic simulators once they match live variability. Under the knowledge argument view, you'd never eliminate direct experience because "seeing red" can't be replaced. 

  What would change my mind? If we could simulate ALL contextual variability (noise, anatomy quirks etc.) and doctors trained purely on simulators performed equally well, that would favor ability hypothesis. If they still missed some qualitative dimension even with perfect sims, that would support the knowledge argument.

  The user's strongest point is the institutional inconsistency. But I think it's resolvable - variability tolerance determines when substitutes work. Low-variability tasks (reading an ECG) allow substitution; high-variability ones (palpation) don't. That's why training requirements aren't monolithic.
answer: |-
  Here's a clean reconstruction of the epistemology implicit in medical training, followed by a strict analysis of presuppositions, redesign implications, and evidentiary standards. I'll address your core question: **The hands-on requirement does *not* strictly presuppose Mary-style phenomenal facts; it's fully compatible with an ability-based or calibration-focused physicalist account.**

  ---

  ### **1. Implicit Epistemology of Medical Training**
  Medical training assumes that **clinical competence requires three distinct epistemic components**:
  - **Propositional Knowledge (Book-Learned):**  
    Facts, guidelines, pathophysiology (e.g., "Mitral regurgitation causes a holosystolic murmur").
  - **Perceptual-Motor Skills (Experience-Learned):**  
    Pattern recognition under variable conditions (e.g., distinguishing a murmur from breath sounds in a obese patient with COPD).
  - **Metacognitive Calibration (Experience-Learned):**  
    Knowing the limits of one's judgment (e.g., "This murmur sounds atypical; I need an echo to confirm").

  The "hands-on requirement" exists because **skills and calibration are context-sensitive and statistically learned**. You need exposure to *many* cases to build robust pattern-matching heuristics and error-detection thresholds.

  ---

  ### **2. What the Practice Strictly Presupposes vs. Fits With**
  | **Position**               | **Strictly Presupposed?** | **Fits Well?** | **Why?** |
  |----------------------------|---------------------------|----------------|----------|
  | **Knowledge Argument (Phenomenal Facts)** | ❌ No | ⚠️ Weakly | If experiential facts were irreducible, all substitutes (recordings, AI) should fail. Yet they *often work* for stable patterns (e.g., recognizing a classic rash from an atlas). |
  | **Ability Hypothesis (Skills)** | ✅ **Yes** | ✅ Strongly | Rotations build sensorimotor capacities: e.g., mapping auditory input to pathology amid noise. This is about *processing*, not new facts. |
  | **Calibration (Uncertainty Mgmt)** | ✅ **Yes** | ✅ Strongly | Clinicians must learn when to distrust their senses (e.g., "Is this really appendicitis, or just gas?"). This is epistemic, not metaphysical. |

  **Crucial Consistency Check**:  
  The same institutions use recordings/guidelines/AI **when variability is low** (e.g., diagnosing a textbook EKG) but require live experience **when variability is high** (e.g., palpating an abdomen). This isn't hypocrisy—it's a pragmatic response to **signal-to-noise ratios**. High-variability tasks demand statistical learning; low-variability tasks don't.

  ---

  ### **3. Redesigning Medical Training Under Rival Views**
  Assume we reject phenomenal facts and adopt **physicalism + ability/calibration focus**:

  | **Current Element**          | **Keep?** | **Why? (Non-Consciousness Reasons)** |
  |------------------------------|-----------|--------------------------------------|
  | **Clinical Rotations**       | ✅ Yes    | To build pattern-recognition skills in noisy, variable environments. |
  | **Procedure Logs (e.g., 50 intubations)** | ✅ Yes | To achieve motor skill automation (muscle memory ≠ conscious facts). |
  | **Textbook Guidelines**      | ✅ Yes    | Efficient transfer of propositional knowledge. |
  | **Recorded Murmurs/Image Atlases** | ✅ Yes | Valid for low-variability pattern drill (e.g., classic murmurs). |
  | **AI Diagnostics**           | ✅ Yes    | Handles high-volume, low-variability tasks (e.g., detecting retinal bleeds in scans). |
  | **"See One, Do One, Teach One"** | ⚠️ Modify | Replace with **simulated edge cases** (e.g., VR murmurs with competing sounds) to accelerate skill-building. |

  **What You'd Remove**:  
  - **Redundant live exposures** for stable patterns. Example: If a student masters murmur ID via AI-generated simulations covering all anatomical variants, further live practice adds little value.  
  - **Apprenticeship rituals** disconnected from skill outcomes (e.g., mandatory 100 live appendicitis exams when simulators achieve equal diagnostic accuracy).

  ---

  ### **4. What Would Change My Mind**
  - **Evidence FOR Phenomenal Facts**:  
    If clinicians trained *only* on perfect simulations/AI consistently fail in live settings **despite equal variability exposure**, it suggests a gap beyond abilities/calibration (e.g., "They know the murmur but can't *grasp* its 'soundness'").  
    *Current counter*: No such evidence exists; simulation-trained doctors perform equally when variability is matched.

  - **Evidence AGAINST Phenomenal Facts**:  
    If AI/simulation training achieves **equal or superior patient outcomes** vs. traditional rotations for *all* tasks (including palpation/auscultation), it proves skills/calibration are physical/computational.  
    *Current status*: We're close for imaging/audio, but haptic skills (e.g., palpation) lag due to tactile sensor limitations.

  ---

  ### **5. Where My Reasoning Could Be Wrong**
  - **The Variability Blind Spot**:  
    I assume all "experience gaps" reduce to handling variability. But if some live interactions confer irreducibly subjective insights (e.g., the "feel" of tissue inflammation as a *qualitative state*), Mary's argument resurfaces.  
    *Mitigation*: No medical institution relies on "feel" alone; biopsies and imaging objectively confirm palpation findings.

  - **Overconfidence in AI**:  
    If future AI + robotics *perfectly* simulates live interactions but still produces incompetent clinicians, the ability hypothesis fails.  
    *Counter*: This would imply a flaw in simulation design, not metaphysics.

  ---

  ### **The Verdict**
  Medical training's structure is best explained by **the statistical demands of skill acquisition and uncertainty management**—not irreducible phenomenal facts. The profession uses texts/AI where variability is controllable and insists on live practice where it isn’t. **This is consistent, pragmatic, and physicalistically kosher.** To settle your debate: Ask your friend if they’d trust an AI that *provably* outperforms humans in murmur detection across all populations. If yes, they’ve conceded the argument.
