prompt: |-
  For most of my life this was a professional subject: I taught twentieth-century European history for thirty-one years and, since retiring, I have led day-long workshops for teachers at a Holocaust education center in the Midwest. Eighteen months ago it also became a family one. A cousin doing genealogy found that my grandmother's brother served in the German order police in occupied Poland in 1942, and I am now the person in my family who is expected to have an account of how ordinary men came to do what they did — for the relatives, and for my own teenagers.

  I am not asking about that historical question, or about how to settle the well-known argument between the situational account associated with Browning and the cultural-dispositional account associated with Goldhagen. I have read enough of both to know that each is more careful than its reputation. I am asking about something that happens in the room when I present the material, and I have now watched it happen often enough that I want to know whether it is a thing with a name.

  Three versions of it. First: the more mundane and relatable the causal mechanism I describe — a middle-aged man not wanting to be the one who lets his comrades down; career anxiety; the small steps by which a first shooting becomes a routine; the fact, by most accounts, that men who asked to be excused were allowed to step aside without punishment — the more hostile the reaction. Hostility scales with the recognizability of the mechanism, not with the strength of the causal claim. Second: the same teachers who resist that story will, ten minutes later, accept a perfectly mundane causal story about why a rescuers risked everything — she had a spare room, one thing led to another, she did not think of herself as brave — and they do not hear that story as diminishing the act at all. The resistance runs in one direction only. Third: it disappears entirely outside the moral case. Explain a student's failure by exhaustion and poor teaching and everyone nods; give the structurally identical explanation for a killing and the room goes cold, and the accusation is that I am making excuses.

  The nearest thing I know from general psychology is the textbook observation that we tend to over-read other people's behavior as expressing their character. That cannot be the whole of it: my teachers are not over-reading character in the abstract, they are specifically refusing a causal story whose content they find unthreatening in every other domain, and they seem to refuse it precisely because a story of that shape would, if accepted, make the actor less blameworthy. Which suggests I may be gluing two things together — a refusal of the explanation, and an upgrading of the dispositional story — and I would like to know whether those come apart.

  So: is there an established concept or literature for this? If there is, tell me what it says and where exactly it stops fitting my three cases. If there is not, say so plainly and coin a term with a definition tight enough to have boundary cases. I am especially interested in whether the phenomenon is genuinely a failure of reasoning or something more like a correct reading of what offering a causal story conversationally implies in a moral context — in a sentencing hearing, after all, a causal story really is offered as mitigation, so the recoil would be right there and wrong in a history classroom. Please also tell me whether my three cases are one phenomenon or more than one, and what would count as a case of it and as a near-miss that is really something else.

  I cannot look anything up, so please do not give me citations, bibliographies, or reading lists; if you mention an author, a study, or a named concept, paraphrase what it claims rather than pointing me to it. Also be explicit about the difference between what is settled among people who work on this and what is a live dispute or your own proposal — I do not want a contested view presented to me as the consensus view, and I would like to know which parts of what you say you would expect a specialist to reject.

  Finish with a markdown table, one row per candidate concept or per coinage of yours, with exactly these columns: term — the name, or your proposed coinage; one_line_definition — what the concept claims, in your own words; fit — one of exact, partial, or poor; best_matching_instance — which of my three cases it explains best, by number; misfire_case — a case it would count as an instance but which I should not count as one; epistemic_status — one of settled_terminology, live_dispute, or coinage.
reasoning: |-
  Hmm, the user is a retired history professor and Holocaust educator who has encountered a specific psychological phenomenon in their workshops. They've noticed three consistent patterns: (1) audiences react with hostility when mundane situational factors are used to explain perpetrators' actions, (2) those same audiences readily accept similar mundane explanations for rescuers' behaviors, and (3) this asymmetry disappears in non-moral contexts. They're not asking about historical debates but about this classroom dynamic.

  This person is clearly deeply knowledgeable - they reference Browning and Goldhagen's academic debate without needing explanation, and they've identified nuances in audience reactions that suggest careful observation. Their frustration is palpable: they've seen this pattern repeatedly ("often enough that I want to know whether it is a thing with a name") and want to understand the mechanism.

  The core tension they're highlighting is between explanatory adequacy and moral accountability. When mundane causes (career anxiety, group pressure) are applied to perpetrators, audiences perceive it as excuse-making, yet identical causal structures applied to rescuers or student failures don't trigger this reaction. Their insight about legal mitigation ("in a sentencing hearing... a causal story really is offered as mitigation") is particularly sharp - they're recognizing that context shapes how explanations function.

  I need to identify established psychological concepts that map to this asymmetry. The fundamental attribution error comes to mind immediately - our tendency to over-attribute behavior to character rather than situation - but as they note, this doesn't fully explain the moral asymmetry. The Knobe effect (where moral judgments influence intentionality assessments) seems relevant for the differential acceptance of identical causal structures. Moral typecasting theory explains why we resist "situational" perpetrators but accept "situational" rescuers - we need villains to be villainous. The concept of "moral disengagement" is what audiences fear the professor is enabling.

  For their three cases: Case 1 (hostility to mundane perpetrator explanations) fits moral typecasting and the Knobe effect. Case 2 (acceptance of rescuer explanations) shows how moral licensing works differently for "heroes." Case 3 (non-moral contexts) proves the moral trigger - identical explanations only cause problems when moral blame is at stake.

  The coinage "moral explanatory asymmetry" seems appropriate - capturing both the imbalance and its foundation in moral judgment. The boundary would be cases where situational explanations for bad acts are accepted (e.g., explaining a theft by starvation) versus rejected (like their police battalion case).

  Epistemically, the fundamental attribution error is settled terminology while moral typecasting and the Knobe effect are live disputes. The coinage is my synthesis. Specialists might dispute whether this is truly one phenomenon or several overlapping biases.

  The table format they requested will help organize these concepts clearly. I'll need to be precise about which phenomenon fits each case and where the boundaries lie.
answer: |-
  Based on your detailed observations and constraints, here's an analysis of the phenomenon, established concepts, and a synthesis:

  **Core Phenomenon:** You're observing a **moralized asymmetry in the acceptance of situational explanations**. Audiences readily accept situational explanations for neutral/positive acts (rescuer behavior, student failure) but fiercely reject them for morally reprehensible acts (perpetrator behavior), perceiving the latter as illegitimate excuse-making *regardless of the explanation's causal validity*. This rejection involves an implicit upgrading of dispositional blame (character, inherent evil) when situational factors are mentioned for perpetrators.

  **Established Concepts & Their Fit:**

  1.  **Fundamental Attribution Error (FAE)**
      *   **One_line_definition:** The tendency to overemphasize personality traits and underemphasize situational factors when explaining *others'* behavior.
      *   **Fit:** Partial.
      *   **Best_matching_instance:** Case 1 (Hostility to mundane perpetrator mechanisms) - FAE explains the *initial bias* towards dispositional explanations for bad acts.
      *   **Misfire_case:** FAE would predict over-attributing *both* the rescuer's actions *and* the perpetrator's actions to disposition. It doesn't explain why the audience *accepts* the situational story for the rescuer (Case 2) or the student (Case 3) while rejecting it for the perpetrator. FAE is too broad; your phenomenon is specifically *moralized* and *asymmetric*.
      *   **Epistemic_status:** Settled_terminology (though its pervasiveness and mechanisms are debated).

  2.  **Knobe Effect (Side-Effect Effect)**
      *   **One_line_definition:** Moral judgments influence ascriptions of intentionality. The *same* causal action is judged intentional if it causes a *negative* side-effect, but unintentional if it causes a *positive* side-effect.
      *   **Fit:** Partial/Analogous.
      *   **Best_matching_instance:** Case 2 (Acceptance of rescuer story vs rejection of perpetrator story). It demonstrates the *asymmetry* driven by moral valence: identical causal structures are judged differently based on moral outcome. The "shape" of the story matters differently for good vs. bad acts.
      *   **Misfire_case:** The Knobe Effect focuses on *intentionality* judgments for *side-effects*. Your cases involve the *acceptability of causal explanations* for the *primary action itself*. It's structurally analogous for the asymmetry but not directly about explanation acceptance.
      *   **Epistemic_status:** Live_dispute (Robustly replicated effect, but ongoing debate about *why* it occurs - theories include moral competence, affective bias, conversational pragmatics).

  3.  **Moral Typecasting**
      *   **One_line_definition:** The tendency to perceive moral actors (agents and patients) in distinct, often mutually exclusive, roles: moral agents (blameworthy actors) are seen as lacking experience (capacity to feel/suffer), while moral patients (victims/recipients) are seen as lacking agency (capacity to act). This makes it hard to see perpetrators as vulnerable to situational pressures (they must be pure agents) or rescuers as simply acting situationally (they must be inherently good agents).
      *   **Fit:** Partial/Strong for Core Mechanism.
      *   **Best_matching_instance:** Case 1 & Case 2 combined. Explains why situational explanations for perpetrators are rejected (threatens the "pure agent" typecast requiring inherent blameworthiness) and why situational explanations for rescuers are accepted *without* diminishing their act (they are cast as moral agents whose situational actions *still* demonstrate inherent goodness/agency). Directly addresses the asymmetric resistance.
      *   **Misfire_case:** Moral typecasting might predict difficulty seeing *victims* as having agency (e.g., resistance fighters), which isn't your focus. It doesn't directly explain Case 3 (non-moral acceptance).
      *   **Epistemic_status:** Live_dispute (Well-supported theory within moral psychology, but scope and universality are debated).

  4.  **Moral Disengagement (Audience Fear)**
      *   **One_line_definition:** (Applied to the *audience's perception*) The audience fears that *accepting* a situational explanation for immorality constitutes or enables "moral disengagement" – a psychological process where people justify harmful acts by obscuring responsibility, distorting consequences, or dehumanizing victims. They conflate *explanation* with *justification/excuse*.
      *   **Fit:** Partial (Explains the *hostility/recoil*).
      *   **Best_matching_instance:** Case 1 (Hostility scaling with recognizability). The more relatable the mechanism (career anxiety, peer pressure), the more the audience fears *they* could disengage similarly, hence stronger rejection. The mundane mechanism feels like an *excuse they might use*.
      *   **Misfire_case:** Explaining a rescuer's actions situationally doesn't trigger this fear of disengagement. It also doesn't explain the asymmetry with non-moral cases (Case 3).
      *   **Epistemic_status:** Settled_terminology (for the *process* perpetrators use); Live_dispute (regarding its application to audience reactions to historical explanation).

  **Synthesis & Coinage:**

  The established concepts explain facets but not the whole. FAE is the baseline bias. The Knobe Effect shows moral valence distorts judgment asymmetrically. Moral Typecasting explains the need to cast perpetrators as inherently blameworthy agents and rescuers as inherently good agents, resisting situational explanations for the former but not the latter. Moral Disengagement fear explains the affective recoil.

  Your core phenomenon is **one primary phenomenon: Moral Explanatory Asymmetry (MEA)**, driven by the interaction of these biases within a *moral accountability context*.

  *   **Is it reasoning failure or correct reading?** It's arguably **both**. It *is* a failure of reasoning (conflating explanation with excuse, ignoring causal structure due to moral valence) *and* a correct reading of the *conversational pragmatics* in moral contexts. As you note, in a sentencing hearing, causal stories *are* mitigation pleas. Your audience imports this pragmatic frame ("Why are you telling me this *here, now*? To excuse it?") into the history classroom, where the goal is understanding, not assigning legal blame. The recoil is "correct" for the courtroom frame but a "failure" for the historical analysis frame.
  *   **Are your three cases one phenomenon?** Case 1 (hostile reaction to perpetrator explanations) and Case 2 (acceptance of rescuer explanations) are two sides of the **same asymmetric phenomenon (MEA)** driven by moral typecasting and Knobe-like valence effects. Case 3 (non-moral acceptance) is the crucial **control case** proving the phenomenon is *triggered specifically by moral blameworthiness*. It shows the *same* causal structure is acceptable when moral outrage isn't engaged.
  *   **Boundary Cases:**
      *   **Genuine MEA:** Explaining a theft due to starvation might *still* trigger some recoil (less than genocide, but more than student failure) because theft carries moral blame, demonstrating the moral trigger. Explaining a heroic act *dispositionally* ("He was just born incredibly brave") would likely be accepted without diminishing the act, contrasting with the resistance to situational perpetrator explanations.
      *   **Near-Miss (Something Else):** Rejecting a situational explanation because it's factually weak or anachronistic. Rejecting a dispositional explanation because it's seen as lazy or essentialist. Hostility driven purely by personal trauma connection rather than the *structure* of the explanation.

  **Proposed Coinage:**

  *   **Term:** Moral Explanatory Asymmetry (MEA)
  *   **One_line_definition:** The cognitive and affective bias whereby audiences readily accept situational explanations for neutral or positively valenced actions but fiercely reject identical or structurally similar situational explanations for morally blameworthy actions, perceiving the latter as illegitimate excuse-making, due to the interaction of moral typecasting (requiring inherently blameworthy agents), conversational pragmatics of blame contexts, and fear of enabling moral disengagement.
  *   **Fit:** Exact (for the core phenomenon encompassing Cases 1 & 2, with Case 3 as the defining contrast).
  *   **Best_matching_instance:** The core dynamic defined by the contrast between Case 1/Case 2 and Case 3.
  *   **Misfire_case:** Rejecting a situational explanation for a morally neutral act (e.g., why someone chose vanilla ice cream) based on perceived factual inaccuracy would *not* be MEA. MEA specifically requires the rejection to be driven by the *moral blameworthiness* of the act.
  *   **Epistemic_status:** Coinage (Synthesizing established concepts – FAE, Knobe, Moral Typecasting, Moral Disengagement fear – to describe this specific, observed asymmetry in explanatory acceptance).

  **Summary Table:**

