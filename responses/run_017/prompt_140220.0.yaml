  | :---------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------ | :--------------------- | :-------------------------------------------------------- | :------------------- |
  | Fundamental Attribution Error | Overemphasizing personality and underemphasizing situation when explaining others' behavior.                                                     | Partial | 1                      | Explaining a rescuer's actions situationally              | Settled_terminology  |
  | Knobe Effect                  | Moral judgments distort intentionality ascriptions: same action seen as intentional if negative side-effect, unintentional if positive.           | Partial | 2                      | Judging intent for an action with *no* clear moral valence | Live_dispute         |
  | Moral Typecasting             | Seeing moral actors as pure agents (blameworthy, lacking feeling) or patients (suffering, lacking agency); resists situational perpetrator explanations. | Partial | 1 & 2                  | Explaining victim behavior                                | Live_dispute         |
  | Moral Disengagement (Fear)    | Audience fears accepting situational explanations for evil enables justifying/ignoring harm by obscuring responsibility.                           | Partial | 1                      | Accepting a situational explanation for accidental harm   | Live_dispute (applied) |
