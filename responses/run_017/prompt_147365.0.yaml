  To diagnose the flaw in Hallam's argument, I reject step (8): "So on each day Iris learns a new fact; after a year she knows 365 facts she did not know at the outset, and by (5) none of them is physical." The error here lies in assuming that Iris retains distinct knowledge of each of the 365 facts after a year. While Iris acquires a new phenomenal concept and learns something new each day (as per step (7)), the stipulations of the chamber scenario—specifically, that no two hues are discriminable at a day's remove due to memory limitations—mean that Iris cannot retain distinct, accessible knowledge of each individual fact over time. After a year, she may have a general awareness of having had varied experiences, but she lacks the introspective ability to individuate and distinguish the specific facts corresponding to each hue. Thus, she does not "know" 365 distinct facts at the endpoint; she only knew each fact transiently at the time of experience, but this knowledge degrades and becomes indistinct due to the memory constraint.

  ### Costs of Rejecting Step (8):
  - **Cost to the Argument**: This rejection undermines Hallam's generalization by showing that Iris's case does not parallel Mary's in a way that accumulates to 365 known non-physical facts. Mary's knowledge is retained and accessible after her release (allowing her to distinguish and reflect on what she learned), whereas Iris's "knowledge" is not retained distinctly. Thus, the move from (7) to (8) fails, and the absurdity in (9)–(11) (e.g., undetectable facts) does not arise. Hallam's reply about facts existing independently (e.g., like atom counts) is partially valid—facts may exist undetected—but it does not save (8) because knowledge requires cognitive access, which Iris lacks for the individual facts after a year. The knowledge argument (1)–(5) remains intact for Mary, as it relies on immediate and retained acquisition, not degraded memory.
    
  - **Cost to Physicalism or Phenomenology**: Accepting this rejection costs little, as it aligns with common-sense views of memory and knowledge: phenomenal knowledge can be forgotten or blurred over time without denying its initial acquisition or its physical basis. It preserves your core sympathies—(1) and (2) are upheld for Mary (she genuinely learns something by experience), and (3) can be retained (knowing what it's like is factive when the knowledge is possessed). For Iris, she learns incrementally but does not retain distinct facts, which is consistent with psychological realism about memory. Physicalism is not directly threatened, as the operators' complete physical description includes the neural correlates of each experience at the time it occurs; the "undetectability" at year-end is due to Iris's cognitive limitations, not an ontological gap.

  ### Why Not Reject Other Steps?
  - **Step (3)**: Rejecting this (e.g., adopting the "ability hypothesis" where knowing what it's like is gaining an ability, not a fact) would cost more, as it forces you to abandon the factive nature of Mary's learning, which might dilute the novel's focus on her epistemic gain. While Iris's incremental acquisition seems like "learning," it could be reframed as ability-gain, but this would not resolve the retention issue in (8) and might make Iris's case less intuitive.
    
  - **Step (6)**: Rejecting the generalization (e.g., limiting it to "significant" or "qualitatively new" experiences) is ad hoc and costly; it weakens the anti-physicalist position by making the knowledge argument anecdotal, but it fails to address why Iris's daily learning isn't analogous to Mary's.

  - **Step (7)**: Rejecting this (e.g., arguing that Iris's minimal hue shifts don't yield truly new concepts) contradicts the stipulation that hues are discriminable side-by-side and thus would undermine your thought experiment.

  - **Hallam's Soundness**: Accepting the argument as sound (with its conclusion of undetectable facts) costs more, as it commits you to a robust realism about phenomenal facts—where facts exist independently of all epistemic access—which may be philosophically expensive and jarring for a narrative about subjective experience.

  In summary, rejecting step (8) on grounds of memory-based indistinctness preserves Mary's learning, avoids absurd undetectability, and allows the third act to proceed without endorsing Hallam's radical conclusion.

  \answer{(8): no retained distinct knowledge}
