answer: |-
  ### Marking Scheme for Question 3  
  *(Based on question weightings and core requirements)*  

  **3(a) [8 marks]**  
  - **State LDO (3 marks):** Define as objection to views where equality gains *intrinsically* justify making some worse off/no one better off.  
  - **Prioritarianism’s escape (3 marks):** Explain weights depend *only* on absolute well-being; any reduction lowers V (Pareto-respecting).  
  - **Egalitarianism’s failure (2 marks):** Explain equality is intrinsic value; leveling down can increase total value despite Pareto loss.  

  **3(b)(i) [4 marks]**  
  - Correct V(X), V(Y), V(Z) (1 mark each).  
  - Accept minor rounding if method correct (V(Z) tolerance: ±0.3).  

  **3(b)(ii) [8 marks]**  
  - **Diagnose LDO applicability (4 marks):** Correctly state RP avoids LDO *if* weights are positive and no intrinsic equality value.  
  - **Transfer of (a)’s argument (4 marks):**  
    - ✓ If: Argue (a)’s logic holds *if* weights remain positive and person-focused.  
    - ✗ If not: Note RP weights depend on *others’* well-being (via mean), violating (a)’s key premise.  
    - ✓ Acknowledge Y>X is *not* leveling down *if* A is "better off" relatively.  
    - ✗ Must note Pareto violation risk (Y vs. Z).  

  **Deductions:**  
  - −1 per major arithmetic error.  
  - −2−4 for misapplying LDO or misrepresenting (a)’s logic.  
  - −2 if ignoring RP’s relativism.  

  ---

  ### Arithmetic Verification (b)(i)  
  - **V(X):**  
    - ū = 50.  
    - A: uᵢ − ū = −50 → v(−50) = 1 − (−50)/60 = 1 + 5/6 ≈ 1.8333  
    - B: uᵢ − ū = 50 → v(50) = 1 − 50/60 = 1/6 ≈ 0.1667  
    - V(X) = (1.8333 × 0) + (0.1667 × 100) = 16.67 → **Correct**.  
  - **V(Y):**  
    - ū = 30.  
    - A: v(−30) = 1 − (−30)/60 = 1.5  
    - B: v(30) = 1 − 30/60 = 0.5  
    - V(Y) = (1.5 × 0) + (0.5 × 60) = 30 → **Correct**.  
  - **V(Z):**  
    - ū = (−2 + 60)/2 = 29.  
    - A: v(−31) = 1 − (−31)/60 = 1 + 31/60 ≈ 1.5167  
    - B: v(31) = 1 − 31/60 ≈ 0.4833  
    - V(Z) = (1.5167 × −2) + (0.4833 × 60) = −3.0334 + 28.998 = 25.9646 ≈ 25.96  
    - Candidate: 25.76 (rounded) or 25.97 (unrounded). **Acceptable** (within 0.3), but 25.97 is more precise.  

  ---

  ### Marking & Justification  
  **3(a): 7/8**  
  - ✓ LDO stated clearly (3/3).  
  - ✓ Prioritarianism’s escape: Correctly links weights to absolute levels and Pareto (3/3).  
  - △ Egalitarianism: Misses that equality *itself* is valued; implies "further value" without explicit "intrinsic" label (−1).  

  **3(b)(i): 4/4**  
  - ✓ All calculations correct within tolerance.  

  **3(b)(ii): 5/8**  
  - ✓ Correctly states RP avoids LDO (2/4).  
  - △ Transfer of (a)’s argument: Oversimplifies; misses RP’s relativism (see inline comments) (−2).  
  - △ Omits Pareto violation (Y vs. Z) (−1).  
  - ✓ Closing Z<Y point correct but overclaimed (no penalty).  

  **TOTAL: 16/20**  
  *(Breakdown: 7+4+5)*  

  ---

  ### Inline Comments (b)(ii)  
  > **"the argument I gave in (a) did not depend on any assumption about where the weights come from"**  
  > **🔴 Clearly mistaken.** (a)’s argument *crucially* depends on weights being functions of *absolute individual well-being alone*. RP’s weights depend on others’ well-being (via ū), so (a)’s Pareto proof fails.  

  > **"A’s relative position has improved [...] A’s situation has genuinely improved"**  
  > **🟡 Defensible but needs qualification.** Under RP, A is "better off" *only* because the weight on their well-being increased due to reduced mean. Their well-being is still 0. Calling this an "improvement" redefines "better off" relativistically, which is controversial.  

  > **"the move from X to Y is not a case of making some worse off and no one better off"**  
  > **🟢 Correct and creditworthy.** B is worse off (100→60), but A is "better off" *in RP’s terms* (v(-50)→v(-30)). Thus not pure leveling down.  

  > **"RP assigns no [intrinsic] value to equality"**  
  > **🟢 Correct.** V aggregates weighted well-being; no standalone equality term.  

  > **"RP ranks Z below Y [...] not simply maximizing equality"**  
  > **🟡 Defensible but needs qualification.** Correct that RP values absolute levels, but misses that Z<Y violates Pareto (B same, A worse off).  

  ---

  ### What a Strong Answer Added  
  1. **Pareto violation:** Y (A:0, B:60) vs. Z (A:−2, B:60) is a *strict Pareto worsening* (A worse, B same), yet V(Y)=30 > V(Z)=25.97. RP violates Pareto, unlike standard prioritarianism.  
  2. **Relativism vs. LDO:** RP avoids LDO *only* by redefining "benefit" relativistically. Critics argue this abandons person-affecting morality.  
  3. **Inference flaw:** (a)’s argument *does not transfer* because RP’s weights are interdependent (via ū), breaking (a)’s premise that weights depend solely on *own* absolute level.  
  4. **Y vs. Z:** Does *not* refute egalitarianism; egalitarians could also reject Z if equality gain doesn’t offset absolute loss.  

  ---

  ### Model Answer for (b)(ii) [200 words]  
  > *Computation shows RP avoids the levelling-down objection (LDO) in X→Y, but not for the reason given in (a). LDO requires a move where no one gains and some lose. In X→Y, B loses (100→60), but A gains in RP’s terms: A’s weight rises from v(−50)=1.83 to v(−30)=1.5, making their unchanged well-being contribute more to V. Thus, Y>X is not levelling down. However, (a)’s argument does not transfer: it assumed weights depend only on absolute well-being, but RP’s weights depend on others’ well-being via the mean ū. This relativism allows RP to avoid LDO but creates new problems. Crucially, RP violates Pareto: in Y (A:0,B:60) vs. Z (A:−2,B:60), Z is Pareto-worse (A loses, B same), yet V(Y)=30 > V(Z)≈25.97. Thus, while RP avoids *intrinsic* egalitarianism, it sacrifices Pareto efficiency—unlike standard prioritarianism. The Z<Y comparison shows RP values absolute levels, but its relativism remains contentious.*  

  *(Word count: 198)*
