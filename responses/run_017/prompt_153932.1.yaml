  **What Will Go Wrong & Fixes:**  
  1. **Death leaks prediction:** *Fix:* Strictly enforce "no hints." If leaked, void the round and replay.  
  2. **Points ignored:** *Fix:* Announce leader after each round. Shame low scorers humorously ("Death, you’re fired!").  
