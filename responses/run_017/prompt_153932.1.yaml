  **Core mechanism: Death's prediction is based solely on anticipating the Traveller's final choice in a feedback loop where the Traveller sees the prediction before deciding, forcing both players into recursive second-guessing.**  

  **Materials per pair:**  
  - 1 index card  
  - 1 pen  
  - 1 six-sided die (shared among pairs)  
  **Group materials:** Whiteboard for scores (columns: Round, Pair #, Death Points, Traveller Points).  

  **Roles & Payoffs:**  
  - **Death:** Wins 10 points for matching the Traveller’s final choice (correct prediction). Wins 0 for mismatch.  
  - **Traveller:** Wins 10 points for mismatching Death’s prediction (survival). Wins 0 for match (death).  
  *Note: Points are bragging rights; highest scorer wins "Pub Philosopher" title.*  

  **Round Rules (play in pairs; rotate roles/pairs after each round):**  
  1. **Round 1: Baseline (Sealed Prediction)**  
     - Traveller *silently* thinks of initial inclination (no speaking).  
     - Death writes prediction (Stay/Flee) on card, folds/seals it.  
     - Traveller announces final choice (Stay/Flee).  
     - Death reveals prediction → score.  
     - *Why it works:* Prediction hidden, so Traveller ignores feedback loop.  

  2. **Round 2: Open Prediction**  
     - Traveller *silently* thinks of initial inclination.  
     - Death writes prediction, shows it to Traveller immediately.  
     - Traveller announces final choice → score.  
     - *Why it works:* Seeing prediction forces second-guessing (e.g., "If I flee, Death should’ve predicted that...").  

  3. **Round 3: Delegation (Die Roll)**  
     - Traveller chooses: **Option A (Delegate):** "Let the die decide." Death predicts die outcome (e.g., "Die=4: Stay"). Roll die (1–3: Stay, 4–6: Flee). Outcome = Traveller’s choice.  
       **Option B (No Delegate):** Play like Round 2 (Open).  
     - *Cost:* Delegation costs Traveller 3 points (paid regardless of survival).  
     - *Why it works:* Tests if randomness "breaks" prediction. Death predicts the die, not the Traveller.  

  4. **Round 4: Fallible Death (Open Prediction, 83% Accuracy)**  
     - Announce: "Death is only right 5/6 of the time. Track accuracy on board."  
     - Traveller *silently* thinks of inclination. Death writes prediction.  
     - Death rolls die: **1 = flip prediction** (e.g., Stay→Flee); **2–6 = keep prediction**.  
     - Death shows prediction to Traveller → Traveller chooses → score.  
     - *Board update:* After all pairs, tally Death’s accuracy (e.g., 12 correct/14 predictions = 86%).  
     - *Why it works:* Fallibility reduces loop intensity; Travellers feel safer defying predictions.  

  **Timeline (90 min):**  
  - **0–5 min:** Intro. Explain roles, payoffs, rounds. Emphasize: "No strategy talk; play fast; points = glory." Assign pairs (7 pairs for 14 people).  
  - **6–15 min: Round 1.** Rules: 1 min. Play: 5 min (Traveller thinks silently → Death writes/seals → Traveller chooses → reveal → record scores).  
  - **16–25 min: Round 2.** Rules: 1 min. Play: 5 min. Scores to board.  
  - **26–40 min: Round 3.** Rules: 2 min. Play: 8 min (include delegation cost). Scores to board.  
