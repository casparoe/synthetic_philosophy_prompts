  5. **"Just free will" dismissals:** *Fix:* Payoffs make defiance rational (mismatch = survival), but prediction accuracy traps them. Ask: "If you’re ‘free,’ why couldn’t you consistently outsmart Death?"  

  **What the Game Can’t Reproduce:**  
  - **Perfect predictors:** Real paradox requires Death’s infallibility. Game approximates with feedback loops but can’t simulate true omniscience.  
  - **Causal independence:** In the story, fleeing *causes* Death to be in Aleppo. Game only shows correlation. Say: "Here, prediction is magic. In life, your actions cause outcomes."  
