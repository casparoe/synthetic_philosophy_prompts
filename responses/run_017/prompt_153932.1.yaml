  **Debrief (30 min):**  
  - **What happened? (5 min):** Ask pairs: "When did you feel trapped? Who argued with themselves?" Note common themes.  
  - **Map game to concepts:**  
    - **Round 1 → "Choice can’t change the card":** "You chose freely, but Death was right often. Why? Prediction was fixed before your choice—no feedback."  
    - **Round 2 → "Choice reveals info about the card":** "When you saw ‘Stay,’ you fled. But if fleeing is predictable, Death wrote ‘Flee.’ Paradox: your ‘free choice’ felt pre-determined."  
    - **Round 3 → "Delegation as escape?":** "Delegating cost points but made Death’s prediction about dice, not you. Did it help? Why/why not?"  
    - **Round 4 → "Fallibility breaks the loop":** "With Death wrong sometimes, fleeing when he said ‘Stay’ felt safer. Accuracy dropped—your choices became less predictable."  
