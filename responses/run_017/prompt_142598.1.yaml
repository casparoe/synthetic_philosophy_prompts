  Vulnerability:

  - Sure-loss book: Both camps agree it is a defect, and a fundamental one (coherence camp) or a logical defect (accuracy camp might downplay in bounded case).
  - Stake-bounded book: Coherence camp says it's a defect of the same kind, just not scalable. Accuracy camp says it's not a significant defect because the loss is bounded and might be within the noise of the scoring system.
  - One-sided book: Coherence camp says it's a defect (weakly incoherent) but not as severe as a sure loss. Accuracy camp might not consider it a defect because there is a chance of breaking even or only a possible loss, not guaranteed.

