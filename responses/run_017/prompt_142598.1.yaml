  **Context**: This document synthesizes the positions of two camps regarding the automated audit for incoherent probability vectors on the forecasting platform. The audit flags, rescales, or penalizes filings that violate coherence (no guaranteed loss via Dutch book). Forecasters are scored by Brier score and paid in tournament standing. Key issues include: bounded stakes, non-linear utility, team filings, and the audit's impact on accuracy and forecaster trust.  

  #### (1) Numbered List of Agreed Claims (Both Camps Endorse)  
  1. **Coherence Definition**: A probability vector is coherent if and only if no set of bets exists that guarantees a loss for the forecaster at the stated odds.  
  2. **Audit Functionality**: The auditor algorithmically detects incoherence and constructs a portfolio of bets guaranteeing a loss (with bounded stakes).  
  3. **Accuracy Primacy**: The platform’s goal is to maximize forecasting accuracy, measured by strictly proper scoring rules (e.g., Brier score).  
  4. **Rescaling Alters Input**: Automated rescaling replaces the forecaster’s submitted numbers, potentially distorting their original intent.  
  5. **Bounded Stakes**: The auditor’s constructed bets guarantee only a small, capped loss (e.g., ≤$0.10 per filing).  
  6. **Non-Linear Utility**: Forecasters’ utility is not linear in currency, as payouts are in tournament standing (redeemable for cash prizes).  
  7. **Attitudes vs. Reports**: The auditor sees only numerical reports, not the forecaster’s true beliefs or betting dispositions.  
  8. **Team Filings Complexity**: Joint filings by teams (33% of submissions) may reflect unresolved disagreement, not a single agent’s beliefs.  
  9. **Incomplete Coverage**: The audit ignores interval reports and "no-opinion" filings, creating inconsistency.  
  10. **Protest Incentives**: Penalties for incoherence risk encouraging uninformative filings (e.g., all 0.5) or deliberate incoherence as protest.  
  11. **Rescaling-Risk Gap**: Rescaling an incoherent vector to coherence can worsen the realized Brier score if the original vector would have scored well.  
  12. **Diachronic Coherence**: Synchronic coherence (no Dutch books) is foundational to diachronic updating (e.g., conditionalization).  

