     - Header mismatch with extension + no known variants  
     - Corrupt magic number  
     - Entropy analysis shows randomness inconsistent with format (e.g., "text" with 90% unprintable chars)  
     *Decision*: **DISCARD**  
     *Justification*: "Phantom frame: [specific reason, e.g., header corruption]"  

  2. **INTRINSIC FRAME CHECK**  
     *Question*: Does the object *itself* declare how to interpret it?  
     *Assessment*:  
     - Intrinsic: Embedded magic numbers, format-specific headers (e.g., `%PDF`), unambiguous BOM  
     - Borrowed: Relies on file extension, folder names, external docs, or inferred context  
     *Sufficient evidence*:  
     - Intrinsic: Header matches known format spec  
     - Borrowed: No header/ambiguous header + format inferred from context  
     *Decision*:  
     - Intrinsic frame → Proceed to Step 3  
     - Borrowed frame → **IMAGE EVERYTHING** (with context) OR **DISCARD** if context can't be preserved  
     *Justification*: "Borrowed frame: [e.g., extension-only .dat]; imaged with context"  

  3. **OUTER MESSAGE VIABILITY**  
     *Question*: Can the decoding instructions be preserved *now*?  
     *Assessment*:  
     - Viable: Open spec (ISO/IEC), ubiquitous format (PDF), or tools exist  
     - Non-viable: Encrypted, proprietary with no docs, obsolete hardware dependency  
     *Sufficient evidence*:  
     - Viable: Format in PRONOM/UTI databases with "open" flag  
     - Non-viable: No known public spec (e.g., obscure lab instrument format)  
     *Decision*:  
     - Viable outer → **NORMALIZE**  
     - Non-viable outer → Proceed to Step 4  
     *Justification*: "Outer: [format] spec preserved"  

  4. **RECONSTRUCTION BET ASSESSMENT**  
     *Question*: Can the inner message survive without its outer message?  
     *Assessment*:  
     - High-structure inner: Human-readable text, XML/JSON, CSV with headers, lossless images  
     - Low-structure inner: Compressed/encrypted binaries, raw sensor data  
     *Sufficient evidence*:  
     - High: >80% printable chars, regular delimiters, common semantic patterns  
     - Low: High entropy, no visible patterns  
     *Decision*:  
     - High-structure → **IMAGE EVERYTHING**  
     - Low-structure → **DISCARD**  
     *Justification*: "Reconstruction bet: [high/low] via [e.g., text patterns]"  

  5. **VALUES HANDOFF**  
     *Trigger*: Technical assessment suggests discard but item has:  
     - High provenance value (e.g., Nobel laureate's files)  
     - Legal/historical uniqueness  
     - Team disagreement on reconstruction bet probability  
     *Decision*: Escalate for human review  
     *Justification*: "Values call: [specific concern]"  

  ---

  ### Key Clarifications
  - **Borrowed frames**: Treated as high-risk → forces imaging *if* context preserved. If context can't be guaranteed (e.g., standalone file), discard unless inner is high-structure.  
  - **Reconstruction bets**: Only bet on high-structure inners with universal conventions (e.g., ASCII, CSV). Low-structure = discard.  
  - **Phantom frames**: Killed immediately via header/entropy checks.  
  - **Future cleverness**: Explicitly called out in justifications as "reconstruction bet: [assumption]".  
  - **Limitations**:  
    - Cannot assess true significance (only recoverability)  
    - Assumes future receivers have domain knowledge but not deprecated tech  
    - Struggles with multi-layer formats (e.g., OLE objects in Word)  
    - May misjudge structured binaries (e.g., databases) without deeper analysis  

  ---

  ### Application to Your Cases
  **Case 1: 1,000 TIFFs of handwritten letters**  
  - Step 1: Valid TIFF headers (no phantom)  
  - Step 2: Intrinsic frame (TIFF magic number)  
  - Step 3: Outer viable (TIFF spec public)  
  - **Decision: NORMALIZE to PDF/A-3 (lossless)**  
  - *Justification*: "Outer: TIFF spec preserved; normalised for searchability"  
  - *Why not image?* Outer is public, inner (pixels) survives normalization. Keeping originals adds cost without recoverability benefit.

  **Case 2: PGP-encrypted files (no key)**  
  - Step 1: Valid PGP headers (no phantom)  
  - Step 2: Intrinsic frame (PGP header)  
  - Step 3: Outer non-viable (no key)  
  - Step 4: Low-structure inner (encrypted → high entropy)  
  - **Decision: DISCARD**  
  - *Justification*: "Reconstruction bet: low; encrypted with no key"  
  - *Why not image?* Inner is indistinguishable from noise without key. Future cryptanalysis unlikely for generic academic data.

  **Case 3: 20,000 Gov Word/Excel files**  
  - Step 1: Valid headers (no phantom)  
  - Step 2: Intrinsic frame (MS-OFFICE headers)  
  - Step 3: Outer viable (OOXML public, tools exist)  
  - **Decision: NORMALIZE to PDF/A + CSV**  
  - *Justification*: "Outer: OOXML spec preserved; normalised for interoperability"  
  - *Why not keep originals?* Your instinct likely values embedded metadata or version history, but the *recoverable message* (text/data) survives normalization. Per procedure, originals add storage cost without recoverability gain. If macros/VBA exist, that forces a handoff (Step 5) as it may be low-structure inner.

  ---

  ### Handling Your Instinct on Case 3
  The procedure overrules keeping originals because:  
  1. Outer message (OOXML) is preserved in public specs  
  2. Inner message (content) demonstrably survives normalization  
  3. Your "significance" concern (e.g., fidelity for future research) is a *values call* → should trigger Step 5 handoff where you argue:  
     *"Values call: retain originals for forensic analysis of metadata"*  
     This forces explicit team debate about cost vs. significance.  

  ### One-Line Justification Guide
  - **IMAGE**: "Borrowed frame + [context]" / "Reconstruction bet: high via [structure]"  
  - **NORMALIZE**: "Outer: [format] spec preserved"  
  - **DISCARD**: "Phantom: [reason]" / "Reconstruction bet: low via [lack of structure]" / "Borrowed frame + no context"  
  - **HUMAN**: "Values call: [specific significance concern]"  

  This systematizes vibes into auditable criteria while naming your team's friction points. For Case 3, it forces confronting whether normalization truly preserves the *necessary* message or if significance justifies imaging.
