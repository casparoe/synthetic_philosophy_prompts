  Hmm, the user is writing historical fiction and needs a framework for understanding the end of Roman government in the West. They want a specification of what makes an adequate historical account, not specific book recommendations. Their novel follows three generations of a landowning family in a western Mediterranean province, showing the gradual decline of Roman institutions.

  The user has several key requirements they want addressed: explaining the divergence between Eastern and Western empires despite shared institutions; reconciling slow institutional changes with sudden events like the 476 deposition; accounting for continuities (senate, law, bishops) to support transformation-over-collapse theory; and acknowledging regional differences (Britain vs Gaul vs Africa). They also want guidance on handling contradictory evidence between textual sources and material records.

  There's an interesting personal requirement about maintaining "legibility from inside the period" - whether historical explanations should be understandable to contemporary observers. I need to evaluate if this is valid or just novelistic preference. The user also wants to know which requirements are essential versus debatable, which combinations are incompatible, and which requirement disqualifies most existing theories.

  I'll organize this as a specification with concrete requirements. For each, I'll note: the phenomenon to explain, why it matters, and what makes it testable. For the evidence problem, I'll emphasize that accounts must declare their methodology for reconciling conflicting sources. The "legibility" requirement might limit how much we can rely on systemic explanations invisible to contemporaries - that's worth flagging as a trade-off.

  Key incompatibilities: the slow-change explanation struggles with the symbolic weight of 476, while materialist approaches might undervalue institutional continuities. The regional variation requirement alone eliminates many grand narratives. The continuity requirement is particularly deadly to catastrophic collapse theories.

  For standard theories: I'll give one-line verdicts on military collapse, economic decline, migration pressure, institutional transformation, and regional diversification - noting which requirements they fail. The table format works well here for clarity within the word limit.
answer: |-
  Here is a specification for an adequate account of the end of Roman government in the West, tailored to your needs:

  **Core Requirements for an Adequate Account:**

  1.  **Divergence of East & West:** *Must explain* why two halves sharing core institutions (taxation, law, military structure), enemies (Huns, Persians, raiders), and political language/discourse succumbed to fundamentally different outcomes. *Testable by:* Showing how specific pressures (e.g., fiscal base, geography of threat, internal cohesion) differed sufficiently in the West to break the system, while the East adapted or endured them. *(Non-negotiable)*

  2.  **Pace & Perception:** *Must reconcile* the slow, structural transformation of military recruitment, landholding, tax collection, and local governance with the sharp, remembered punctuation points (e.g., 410 Sack, 455 Sack, 476 deposition). *Testable by:* Demonstrating how punctual events crystallized existing trends, shattered specific symbols of legitimacy (like the city or the imperial office), or were leveraged by actors within the ongoing transformation, without being the sole cause. *(Non-negotiable)*

  3.  **Continuity within Change:** *Must account substantively* for the stubborn persistence of Roman forms (law applied by kings, senatorial status, episcopal authority, estate management, administrative terminology/registers) alongside the undeniable cessation of central imperial authority. *Testable by:* Explaining *how* and *why* these elements were repurposed, by whom, and what function they served in the new order, making "transformation" more than an assertion. Failure to do this invalidates transformation claims. *(Non-negotiable - Eliminates most catastrophic "collapse" narratives)*

  4.  **Regional Specificity:** *Must preclude* treating Britain, Northern Gaul, Italy, Southern Gaul/Septimania, and Africa as identical cases. *Testable by:* Showing how factors like pre-Roman substrate, degree of urbanization, proximity to frontiers/major armies, local elite cohesion, and specific sequences of invasion/settlement/political deal-making produced distinct trajectories (e.g., rapid militarization vs. fiscal continuity vs. elite displacement). *(Non-negotiable - Eliminates monocausal explanations)*

  5.  **Evidence Synthesis:** *Must explicitly address* the tension between textual sources (focused on elites, events, ideology, crisis) and material evidence (showing regional economic shifts, settlement change, local resilience/decline). *Testable by:* Declaring a methodology for weighing conflicting signals (e.g., prioritizing material trends for economy/society but texts for political intent; seeing texts as revealing contemporary perceptions regardless of "accuracy"). Cannot simply ignore one stream. *(Non-negotiable)*

  6.  **"Legibility from Inside" (Your Requirement):** *Should strive* for explanations where key mechanisms (e.g., tax burden leading to land abandonment/local deals; military weakness forcing regional alliances; the symbolic power of Rome/the Emperor fading) could have been perceived or reasoned about by well-informed contemporaries, even if the long-term outcome was unforeseen. *Cost:* Limits reliance on explanations requiring deep structural analysis only possible with hindsight (e.g., climate data, centuries-long economic cycles). Acceptable as a preference if balanced; it risks underplaying slow, invisible forces. *(Preference - Handle with care)*

  **Key Incompatibilities & Eliminators:**

  *   **Satisfying #3 (Continuity) AND a purely catastrophic explanation (e.g., single battle loss, overwhelming barbarian hordes) is impossible.**
  *   **Satisfying #4 (Regionality) AND a single, uniform explanation for the whole West is impossible.**
  *   **#3 (Continuity) is the single biggest eliminator:** It dismisses narratives of utter destruction, civilizational wipeout, or the immediate replacement of all Roman systems.
  *   **#1 (Divergence) eliminates** explanations that treat the Empire as a monolith or blame factors equally present in the East (e.g., "Christianity weakened the legions" – East was more Christian).

  **One-Line Verdicts on Standard Families:**

  *   **Military Collapse (e.g., Adrianople):** Necessary factor but insufficient; fails #1 (East recovered), #3 (ignores continuities), #4 (regional variation).
  *   **Economic Decline/Over-Taxation:** Crucial slow driver; struggles with #2 (punctual events), #1 (East taxed heavily), needs #5 (material/text balance).
  *   **Barbarian Migration Pressure:** Essential context; fails as sole cause (#1 East faced migrations, #3 continuities), needs #4 (regional impact varied wildly).
  *   **Internal Transformation (Elite Bargains, Warlordism):** Strong on #3 and #2; must convincingly address #1 (why less in East?) and #5 (texts show crisis, material shows adaptation).
  *   **Regional Fragmentation/Diversification:** Strong on #4 and #3; needs to explain #1 (why East didn't fragment similarly) and the *process* behind the punctual #2 events.

  **Summary Table:**

  | Requirement                      | Concrete Test                                                   | Status          | Key Conflicts/Eliminates                          |
  | :------------------------------- | :-------------------------------------------------------------- | :-------------- | :------------------------------------------------ |
  | **1. East/West Divergence**      | Different impact of shared pressures on core systems (fiscal/military) | Non-negotiable | Monolithic Empire explanations                    |
  | **2. Pace vs. Punctual Events**  | How events crystallized/leveraged ongoing trends                | Non-negotiable | Events as sole cause                              |
  | **3. Continuity within Change**  | How/why specific Roman forms persisted & were repurposed        | Non-negotiable | Catastrophic collapse narratives (**Biggest Eliminator**) |
  | **4. Regional Specificity**      | Distinct trajectories for Britain, N. Gaul, Italy, Africa etc. | Non-negotiable | Uniform Western explanations                      |
  | **5. Evidence Synthesis**        | Method for textual/material conflict                            | Non-negotiable | Ignoring one evidence stream                      |
  | **6. Legibility from Inside**    | Mechanisms perceivable by contemporaries                        | Preference      | Over-reliance on deep hindsight-only forces       |
