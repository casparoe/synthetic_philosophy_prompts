  ### Part 3: Committing to a policy

  We can have three decision rules:
  1. Maxmin: choose the act with the best worst-case outcome.
  2. Maxmax: choose the act with the best best-case outcome.
  3. Hurwicz: choose a weighted average of the worst and best.
  4. Minimax regret.
  5. Using the midpoint.

  But to keep it simple, we can have:
  - Rule 1: Maxmin (focus on the worst case)
  - Rule 2: Expected value using the midpoint of the interval (assume 0.5 for the event)
  - Rule 3: Choose the act that has the highest minimum payoff (but that's maxmin) or we can have a different one.

  Alternatively, we can have:
  - Rule 1: Maxmin
  - Rule 2: Minimax regret
  - Rule 3: Choose the act that is best if the true probability is the midpoint.

  But minimax regret might be complicated.

  We can have:
  - Rule 1: If the worst-case of an act is above a threshold, do it; else avoid.
  - But let's keep it to three rules as per the request.

  The request: 
  - do they act on the worst case inside it (maxmin)
  - do they rule out any option that's beaten by some other option under every probability in the set (dominance: if an act is dominated by another act for every probability in the set, then eliminate it; then choose from the non-dominated)
  - or do they just take the middle of the range and stop worrying

  So:
  - Policy 1: Maxmin (choose the act with the highest minimum expected utility over the interval)
  - Policy 2: Dominance (eliminate any act that is strictly dominated by some other act for every probability in the set; then if one act remains, choose it; if more, then use some tie-breaker like maxmin or midpoint)
  - Policy 3: Midpoint (use the midpoint of the interval as the probability and maximize expected utility)

  Then we design a sequence of decisions that make these policies lead to different choices.

