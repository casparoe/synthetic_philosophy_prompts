  Now, how to present this to the students? We have an urn with 100 balls. Each ball has a color (red/blue) and a mark (dot/no-dot). We know that the number of red balls is between 40 and 60, and the number of dotted balls is between 40 and 60. But we don't know the exact numbers and we don't know how they are correlated.

  We will draw one ball. We care about the color. We are going to observe the mark. But we have a choice: we can choose to see the mark before we guess the color, or we can guess without seeing it.

  But the event we care about is the color, and we are going to have to bet on it or something.

  But note: if we see the mark, then the probability of red given dot is in [0,1], and given no-dot is in [0,1]. So we are completely ambiguous. Whereas if we don't see the mark, the probability of red is in [0.4,0.6].

  Now, if we are ambiguity averse, we might prefer not to see the mark.

  But the students might not be ambiguity averse. We need to create a situation where seeing the mark leaves them with a worse situation for making a decision.

  ### Part 2: A decision where randomization is optimal

  We need a choice between two acts, and under the set of probabilities, neither act dominates the other, and the worst-case expected utility of each act is negative, but a randomization can have a non-negative worst-case expected utility.

  For example, we can set up a bet where:

  - Act A: bet on red. If red, win 2 points; if blue, lose 3 points.
  - Act B: bet on blue. If blue, win 2 points; if red, lose 3 points.

