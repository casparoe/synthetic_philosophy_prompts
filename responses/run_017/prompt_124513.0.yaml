     We have three policies. We explain them in plain English:

     Policy 1: "Play it safe" (maxmin) - For each possible action, consider the worst-case expected utility over the range of probabilities. Choose the action with the best worst-case.

     Policy 2: "Dominance" - First, eliminate any action that is strictly worse than some other action for every possible probability in the range. Then, from the remaining actions, choose the one that has the highest expected utility using the midpoint of the range.

