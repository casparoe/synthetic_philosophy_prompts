prompt: |-
  Hey — I teach a 14-person third-year seminar that's basically rationality under uncertainty (philosophers, some econ people, a couple of PPE kids; all of them can do simple expected-value arithmetic and are happy writing a probability as a range instead of a number). I've got one 90-minute slot, no laptops if I can avoid it (the room's wifi is a joke and I want them up and moving anyway), and no money at all — payoffs have to be points toward a small participation bonus, or chocolate, or raffle tickets for one decent prize at the end. Last week in lecture we did expected utility, the Allais stuff, the usual Ellsberg urns, and I showed them that with a single sharp prior a free piece of information can never leave you worse off in expectation, provided you get to choose your act after you see it. This session is meant to break that.

  What I want them to run into, in their gut rather than from me talking at them, is that a probability interval is a genuine state and not just laziness — and that it can get wider when you learn something. Concretely: there's some event they care about, and before anything is revealed they'd write its probability as something like 0.4 to 0.6. Then there's a signal that is coming no matter what, two possible outcomes, they know in advance they'll get one of them — and whichever way it goes, their interval for the event gets strictly wider, out to something like 0.3 to 0.7 both ways. So they can see ahead of time that looking will leave them vaguer, and they have to decide whether to look before they find out what it says. I want at least some of them to end up paying, in points or chocolate, to not be told.

  Second thing: I want them to hit a case where what they actually want to do is flip a coin. Not "they're indifferent so they might as well toss for it", but where randomising really is better for them than choosing either option on purpose, precisely because their uncertainty is a set of probabilities rather than one number. If you can't make that happen with actual cards and bags and envelopes in a room, tell me so and give me the nearest thing that does work.

  Third: I want them to notice that they're picking a policy, not just an act. Before anything is drawn, have them commit in writing to how they'll treat the interval — do they act on the worst case inside it, or do they rule out any option that's beaten by some other option under every probability in the set, or do they just take the middle of the range and stop worrying? (Describe those in plain English on the handout rather than naming them after anybody.) Then the sequence of draws should make the policies they signed up to come apart in what they permit — ideally the same student wants to do different things at different moments depending on what they committed to, and at least one of them eats a real cost for having committed.

  So design me the thing: the rules, what's physically in the bags or urns or envelopes and how I rig it so they genuinely can't resolve the ambiguity (plus how I convince them I didn't cheat), the actual numbers with a couple of lines of arithmetic showing they do what you claim, a payoff schedule in points or chocolate, a timeline for 90 minutes, and who does what when. I can get one friend to be a second adult in the room for the first half hour if that helps.

  Then the debrief: map particular moments onto particular ideas — where exactly the interval widened, where the free information hurt, where somebody wanted to randomise, where a policy bit somebody. Tell me what will predictably go wrong the first time I run it. I'm guessing some of them will try to do frequentist inference off the draws and collapse the range back to a point, some will say this is all just a second-order probability and they should average, some will meta-game for the prize, and somebody will refuse to play because they think the fix is in — tell me how to head each of those off, or how to use them when you can't. And be honest about what the activity cannot deliver: I assume it can't show them the proof of anything, or that there's more than one defensible way to update a set of probabilities, or why the decision rules come apart in general. So tell me which pieces I have to say out loud at the end, and how to say them in about eight minutes without it turning back into a lecture.

  Don't give them the name of the phenomenon until afterwards, and please flag anywhere you're relying on a bit of maths you're not fully sure of — I'd much rather have a wobbly game I can trust than an elegant one that falls apart when a smart student does the arithmetic on the board.
reasoning: |-
  We are going to design an activity that meets the requirements. The core idea is to have an ambiguous event (like drawing a red ball from an urn) and a signal that, no matter what it says, will widen the interval of probability for that event. We also want a situation where randomizing is strictly better.

  We'll use two urns (or bags) to create ambiguity. One urn is known (say, 50% red, 50% blue). The other urn is ambiguous: we don't know the proportion, but we know it's either mostly red or mostly blue. However, we set it up so that the prior interval for the event (drawing red from the ambiguous urn) is moderate (say, 0.4 to 0.6). Then we introduce a signal that comes from the known urn. The signal will be a draw from the known urn, and we'll condition the ambiguous urn on this draw. But because of the way we set up the ambiguous urn, the conditioning will widen the interval.

  Additionally, we'll design a choice problem where the optimal action is to randomize because the expected payoff of each pure action is negative under some probabilities in the set, but a mixed strategy can break even.

  Let's break it down.

  ### Part 1: The widening interval

  We need an ambiguous event: drawing a red ball from an ambiguous urn (Urn A). We want the prior interval for P(red) in Urn A to be [0.4, 0.6]. How to set up Urn A?

  We can set Urn A to be one of two types, with equal prior probability (so the prior for each type is 0.5):
  - Type H: 80% red, 20% blue
  - Type L: 20% red, 80% blue

  But then the prior for red is either 0.2 or 0.8, so the interval would be [0.2, 0.8]. We want [0.4,0.6]. So we need to adjust.

  Idea: Instead of two extreme types, we have two types that are closer, but we mix them in a way that the prior is symmetric and the interval is [0.4,0.6]. Alternatively, we can use a set of priors that are not just two points. But for simplicity, we can use a set of two types that are not as extreme.

  Suppose:
  - Type H: 60% red, 40% blue
  - Type L: 40% red, 60% blue

  Then the prior for red is either 0.4 or 0.6, so the interval is [0.4,0.6]. Perfect.

  We tell the students: Urn A is either Type H (60% red) or Type L (40% red). We flipped a fair coin to decide which one it is, but we didn't tell you the outcome.

  Now, we want to introduce a signal. We have a known urn (Urn K) that is 50% red, 50% blue. We will draw a ball from Urn K. The idea is that this draw is going to be used to update the belief about which type Urn A is. But note: the draw from Urn K is independent of Urn A. So how does it update?

  Actually, it doesn't. We need to link them. How about we tell the students that the same coin flip that determined the type of Urn A also determined the type of Urn K? But then they are dependent.

  Alternative: We have two coins. The first coin (fair) determines the type of Urn A. The second coin (also fair) is used to set Urn K. But we don't want independence. We want the signal (draw from Urn K) to be informative about the coin that set Urn A.

  But note: we want the signal to widen the interval. How can we achieve that?

  We can set it up so that the same coin flip that set Urn A also set Urn K? Then if Urn A is H, Urn K is one type; if Urn A is L, Urn K is another? But then the signal from Urn K is directly informative about the coin.

  But we want the prior for Urn A red to be [0.4,0.6]. Now, if we link the two urns by the same coin, then the prior for Urn A red remains [0.4,0.6] (since it's still 0.5 chance of H and L). Now, we draw a ball from Urn K. What happens to the interval for Urn A?

  We need to specify what Urn K is. Suppose:
  - If the coin is H (so Urn A is H: 60% red), then Urn K is a known urn with 70% red and 30% blue.
  - If the coin is L (so Urn A is L: 40% red), then Urn K is a known urn with 30% red and 70% blue.

  Now, we draw a ball from Urn K. Let R_k be the event that we draw red from Urn K.

  We want to compute the posterior interval for P(red from Urn A) after seeing the draw from Urn K.

  First, note that the probability of the coin being H given R_k:

  P(H | R_k) = P(R_k | H) * P(H) / [P(R_k | H) * P(H) + P(R_k | L) * P(L)]
  = (0.7 * 0.5) / (0.7*0.5 + 0.3*0.5) = 0.35 / (0.35+0.15) = 0.35/0.5 = 0.7

  Similarly, P(L | R_k) = 0.3

  Then, the probability of red from Urn A given R_k is:
  If the coin is H: 0.6, if L: 0.4. So the expected value is 0.7*0.6 + 0.3*0.4 = 0.42+0.12=0.54. But that's a single probability. We are representing ambiguity by two points, so the set of posteriors is still two points: 0.6 with probability 0.7 and 0.4 with probability 0.3. So the interval for P(red from Urn A) becomes [min(0.4,0.6), max(0.4,0.6)]? That's [0.4,0.6] again. We want it to widen.

  This didn't widen. We need a different setup.

  We want the signal to be ambiguous itself. How about we make the signal come from a process that is not perfectly correlated? Or we can use a different structure.

  Idea: Instead of two types for Urn A, we have three types? Or we can have a hierarchical model.

  Alternatively, we can use the Ellsberg two-urn setup but add a signal that is symmetric but ambiguous.

  Here's a simpler idea: the ambiguous urn (Urn A) has 100 balls, but we don't know how many are red. We only know that the number of red balls is between 40 and 60. Then the prior interval for P(red) is [0.4,0.6]. Now, we have a known urn (Urn K) with 50 red and 50 blue. We draw a ball from Urn K. But how does that relate to Urn A? It doesn't. So we need to link them.

  We can say: we are going to draw a ball from Urn K and then put that ball into Urn A? But that would change the composition of Urn A. Then we draw from Urn A. But that complicates the event we care about (the proportion in Urn A after adding a ball).

  Alternatively, we can have a two-stage process. But let's avoid that.

  Another idea: the signal is about the composition of Urn A, but it comes from a source that is itself ambiguous. But that might be too complicated.

  I recall a classic example: the three-color Ellsberg urn. But we want a binary event.

  Let me think of a different approach: suppose we have two coins. The first coin is fair (50-50). The second coin is biased, but we don't know if it's biased towards heads or tails. We are interested in the event that the first coin lands heads (H1). We are going to flip the second coin (C2) and get a signal. The prior for H1 is 0.5, and we want the interval to be [0.4,0.6]? That doesn't seem to help.

  Wait, we don't need the prior interval to be [0.4,0.6] for the event we care about. We can have the event we care about be the outcome of a biased coin (C2) that we are uncertain about. But then the signal is from another source.

  How about:

  We have two coins: Coin 1 and Coin 2. We are interested in the event that Coin 1 comes up heads (H1). We don't know the bias of Coin 1. We know that Coin 1 is either biased to give 60% heads or 40% heads (each with 50% chance). So the prior interval for H1 is [0.4,0.6]. Now, we also have Coin 2. Coin 2 is linked to Coin 1: if Coin 1 is the 60% heads type, then Coin 2 is a fair coin (50% heads). If Coin 1 is the 40% heads type, then Coin 2 is a fair coin (50% heads). Then flipping Coin 2 gives no information about Coin 1. So the interval remains [0.4,0.6] regardless.

  That doesn't work.

  We need the signal to be informative but in a way that increases ambiguity.

  I recall the example of "dilation" (the phenomenon where an interval widens). One standard example is:

  There are two coins. Coin A is fair. Coin B is either biased 2:1 in favor of heads or 2:1 in favor of tails, and we don't know which. We are going to flip both coins. We care about the outcome of Coin A. The prior for Coin A heads is 0.5. Now, if we observe the outcome of Coin B, what happens to the interval for Coin A?

  But note: Coin A and Coin B are independent. So observing Coin B tells us nothing about Coin A. So the interval for Coin A remains [0.5,0.5] (if we consider only the uncertainty of Coin A) but wait, Coin A is fair, so it's fixed at 0.5. That doesn't work.

  We need to have dependence. How about we flip only one coin? Or we have a single coin that we are uncertain about, and the signal is a flip of that same coin? But that would resolve some uncertainty.

  Let's use the following setup (from Seidenfeld and Wasserman, 1993, "Dilation for sets of probabilities"):

  We have two coins that are minted together. Either both are fair, or both are biased in the same way. Specifically, with probability 0.5, both coins are fair (P(heads)=0.5 for each). With probability 0.5, both coins are biased to give P(heads)=0.6 for each. But then the prior for the first coin being heads is: it could be 0.5 (if fair) or 0.6 (if biased). But note, there's a 0.5 chance of fair and 0.5 of biased, so the expected probability is 0.55, and the interval is [0.5,0.6]. But we want [0.4,0.6]. So we need to adjust the biases.

  Alternatively, we can have three possibilities:

  - With probability 1/3: both coins are fair (P(heads)=0.5)
  - With probability 1/3: both coins are biased to P(heads)=0.6
  - With probability 1/3: both coins are biased to P(heads)=0.4

  Then the prior for Coin 1 heads is in {0.4,0.5,0.6}, so the interval is [0.4,0.6]. Now, we flip Coin 2. Let H2 be the event that Coin 2 comes up heads.

  We want to compute the posterior interval for P(H1) given H2.

  First, compute P(H2):

  P(H2) = (1/3)*0.5 + (1/3)*0.6 + (1/3)*0.4 = (0.5+0.6+0.4)/3 = 1.5/3 = 0.5

  Now, the posterior probabilities of the three states given H2:

  P(fair | H2) = P(H2|fair) * P(fair) / P(H2) = (0.5 * 1/3) / 0.5 = (1/6) / (1/2) = (1/6)*(2/1)=1/3
  P(biased 0.6 | H2) = (0.6 * 1/3) / 0.5 = (0.6/3)/0.5 = (0.2)/0.5 = 0.4 = 2/5? Wait, let me do it properly:

  P(biased 0.6 | H2) = P(H2| biased 0.6) * P(biased 0.6) / P(H2) = (0.6 * 1/3) / 0.5 = (0.2) / 0.5 = 0.4
  Similarly, P(biased 0.4 | H2) = (0.4 * 1/3) / 0.5 = (0.4/3)/0.5 = (0.1333)/0.5 = 0.2667

  But these should add to 1: 1/3 ≈ 0.333, 0.4, 0.2667 -> 0.333+0.4+0.2667=1.0.

  Now, in the posterior, the probability that Coin 1 is fair is 1/3, biased to 0.6 is 0.4, biased to 0.4 is 0.2667. Then the set of possible probabilities for H1 is still {0.4,0.5,0.6}. So the interval is still [0.4,0.6]. We haven't widened.

  But note: the posterior probability of the state "biased to 0.4" is less than 1/3, and "biased to 0.6" is more than 1/3, but the set of possible values for P(H1) hasn't changed. So the interval hasn't widened.

  We want the interval to become wider. How about we make the signal uninformative about the type but still leave us with more uncertainty? That doesn't seem to work.

  Another idea: we have a single coin that is either fair, or it is biased in an unknown way. Specifically, we know that the coin is fair with probability 0.5, and with probability 0.5 it is biased, but we have no idea about the bias (so the bias could be any number in [0,1]). Then the prior interval for P(heads) is [0,1]. But we want [0.4,0.6]. We can't get that.

  We need a bounded set for the prior.

  After some thought, I recall that dilation can occur when we have independence assumptions that are relaxed. One standard example is:

  Let X and Y be two independent events. But we are uncertain about the probability of X and Y. Specifically, we know that P(X) is in [0.4,0.6] and P(Y) is in [0.4,0.6], and we assume independence. Then the prior for the event (X and Y) is in [0.16,0.36] (since independence). But if we learn that Y occurred, then the conditional probability of X given Y is still [0.4,0.6] (because of independence). So it doesn't change.

  We need to drop the independence assumption. We can have X and Y arbitrarily correlated.

  For example, let theta be a parameter in [0,1]. Let P(X)=theta and P(Y)=theta, and we know that theta is in [0.4,0.6]. But we don't know the joint distribution. The set of joint distributions might allow any correlation between X and Y.

  Then, before any observation, P(X) is in [0.4,0.6]. But after observing Y, the conditional probability P(X|Y) can be anywhere in [0,1]. Why? Because if theta=0.4, then P(X|Y) = P(X and Y)/P(Y) = (correlation term) but without independence, we can have P(X and Y) as low as max(0, P(X)+P(Y)-1)=max(0,0.8-1)=0, and as high as min(P(X),P(Y))=0.4. So if P(Y)=0.4, then P(X|Y) can be between 0 and 1 (because P(X|Y) = P(X and Y)/0.4, and P(X and Y) can be from 0 to 0.4). But wait, if theta=0.4, then P(X)=0.4 and P(Y)=0.4, and the joint must be such that the correlation is arbitrary. The set of possible P(X|Y) when theta=0.4 is [0,1]. Similarly for theta=0.6: P(X|Y) can be in [0,1]. Therefore, after observing Y, the interval for P(X|Y) is [0,1]. So it dilates from [0.4,0.6] to [0,1].

  Similarly, if we observe not Y, then P(X|not Y) would also be in [0,1].

  So this is perfect: no matter what we observe about Y, the interval for X becomes [0,1].

  Now, how to operationalize this in the classroom?

  We care about event X. We have an event Y that is correlated with X in an unknown way, but we know that marginally, P(X) in [0.4,0.6] and P(Y) in [0.4,0.6]. We are going to observe Y or not Y.

  But how to represent this with physical objects? We need an urn that has balls that are either red or blue for X, and either have a dot or not for Y. But the joint distribution is completely unknown, except that the marginal probability of red is between 0.4 and 0.6, and the marginal probability of dot is between 0.4 and 0.6.

  We can have an urn with 100 balls. Each ball has two properties: color (red/blue) and mark (dot/no-dot). We know that there are between 40 and 60 red balls, and between 40 and 60 dotted balls. But the joint distribution is arbitrary.

  Then, we draw one ball from the urn. We care about the color (red or blue). We are going to observe the mark (dot or no-dot) and then update our belief about the color.

  Prior: P(red) in [0.4,0.6].

