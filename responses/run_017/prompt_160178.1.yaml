prompt: |-
  Hey — I'm a novelist and I'm stuck on a scene, so I want to do something slightly unhinged: run the actual thing as a game with real people, watch them squirm, and steal what I see for the page.

  The book: a developer goes bust and walks away from a half-finished resort town in the desert, and the forty-odd people still living there end up having to govern themselves — no owner, no county that wants them, no legal anything. My protagonist is on the committee that has to write down, on paper, who gets a vote. Half my draft is people being extremely reasonable about this in ways that are transparently self-serving, and I want to know what that actually sounds and feels like in a room instead of in my head.

  So: I'm running a two-hour session at a writers retreat next month. 14 adults, mostly fiction writers, no philosophy background (one of them will have read a book — plan for that). Big room, index cards, name tags, a whiteboard, no tech, and I can put up maybe fifty bucks of real money as a stake if that helps. What I want from you is a game in which the group has to constitute a decision-making body for something they collectively control, and then discover on their own that the question of who votes cannot itself be settled by voting, because any vote is counted over some already-specified set of people — and the people who got to specify that first set were just whoever happened to be in the room, or spoke first, or was me. I want them to hit that circularity and get genuinely annoyed about it, and I especially want the moment where someone proposes that everyone affected should get a vote and it detonates: affected by what, how far out, and who here speaks for the ones who aren't here.

  Some things I've been playing with that you should use or junk as you see fit: a round zero whose membership is set by an obviously arbitrary criterion (arrival order, alphabetical, whoever is holding a red card) plus a ratchet rule — the voting set may be expanded by majority vote of the current set but never contracted, so the initial accident is permanent and every later inclusion arrives looking like a gift from the insiders; proxy cards for parties not in the room (a kid, an unborn grandchild, a seasonal worker, an absentee landowner who has never visited, the river, an investor), where the holder must say out loud before voting whether they cast that card in the absent party's interest or their own; and a mid-game event — a new arrival, an outside buyer, a fire — that changes who is affected while a rule is already on the books, forcing the boundary to be re-litigated under the old rule.

  Give me the setup and materials, the roles and cards, the rounds with timings, what the facilitator says and — more important — refuses to say, and how the incentives are arranged. Then tell me what I should be listening for and noting down as a novelist: the actual sentences people use to justify excluding someone, how the excluded behave, who goes quiet, who starts performing reasonableness. Then a debrief that maps specific moments onto the actual problem — the regress, the gap between everyone affected and everyone subject to the rules, what the ratchet is for, why the proxy cards are a trap — plus what will predictably go wrong the first time I run it (I'm guessing someone will try to dissolve the whole thing with obviously everyone votes, and that it will tip into a personality contest) and how I handle that without turning into a lecturer.

  Last thing, because I'm going to put this in a book: separate for me what's basically settled among people who actually work on this from what's a live argument, and don't let a contested view come back to me dressed as the consensus. I don't want my character declaiming something as obvious fact that would make a political theorist roll their eyes. And be straight with me about what a two-hour game in a barn can't show me — the parts of the problem I'll have to supply in prose because the activity can't produce them.
reasoning: |-
  Okay, let's tackle this. The user is a novelist stuck on a scene about a desert resort town where residents form a self-governing committee. They want to run a live game at a writers' retreat to observe real group dynamics and capture authentic dialogue for their book. 

  First, I need to understand their core request: a game that forces participants to confront the circular logic of defining a voting body. The key pain point is showing how "who gets to decide who decides" can't be resolved democratically. 

  Hmm, they've already brainstormed some clever mechanics: arbitrary Round Zero selection, ratchet rule (expand-only membership), proxy cards for absent parties, and a mid-game disruption. These are solid foundations. The challenge is structuring this into a tight 2-hour experience with clear escalation points.

  For setup, I'm imagining index cards with resident roles - some obvious stakeholders (permanent residents), some edge cases (unborn grandchild, seasonal worker). The proxy system is genius because it creates immediate tension: does the cardholder vote their interest or the proxy's? That ambiguity will spark great dialogue.

  Timing is crucial. Round Zero (10 mins) must feel rushed to cement the arbitrary founding group. Then proposal rounds where they debate inclusion criteria while the ratchet rule silently distorts every decision. The mid-game fire event (timed around 60 mins) should force them to apply existing rules to new problems, exposing flaws.

  What should the facilitator do? Mostly stay silent - no solving problems for them. Only intervene to enforce mechanics. The money ($50 bounty) adds stakes but more importantly reveals how incentives warp language. I'll suggest listening for "reasonable exclusion" phrases like "practical concerns" or "temporary measures."

  For debrief, focus on mapping their in-game frustrations to theoretical concepts without lecturing. Highlight moments where "affected parties" arguments collapsed under real constraints. Warn that some aspects (long-term resentment, slow institutional decay) won't emerge in play and must be written.

  Biggest risks? Someone declaring universal suffrage to "solve" everything - but the proxy cards should complicate that. Or personality clashes overshadowing systemic tensions. Counter by emphasizing role commitment and the ratchet rule's inertia.

  Finally, separating settled theory from live debates: Arrow's Theorem shows voting systems can't be perfect, but there's no consensus on solutions. The "affected parties" principle is philosophically contested. I'll flag where theorists disagree so their novel doesn't present contested ideas as fact.

  The game won't capture gradual power entrenchment or external pressures - that's where their prose must compensate. But for raw dialogue and immediate group dynamics? This should give gold.
answer: |-
  Here's a full game design tailored to your goals, maximizing friction, revelation, and novel-worthy dialogue within a 2-hour window:

  **Game Title:** The Boundary Stone

  **Core Tension:** Defining the "demos" (the people) is the foundational, inherently non-democratic act. Every inclusion/exclusion rule creates winners & losers *before* voting starts.

  **Your Goals Achieved:** Circularity frustration, "affected parties" detonation, self-serving reasonableness, exclusion justifications, proxy trap, mid-game disruption forcing re-litigation.

  **Setup & Materials:**
  1.  **Room:** Tables arranged in a circle/square. Whiteboard prominently displayed.
  2.  **Name Tags:** Pre-printed with resident roles (see below). *Distribute randomly as participants enter.*
  3.  **Index Cards:**
      *   **Role Cards (14):** Detailed descriptions (see Roles list below).
      *   **Proxy Cards (8):** Representing absent entities. Each has a brief description:
          *   *The Unborn Grandchild (of Resident #3):* Future claim.
          *   *Miguel (Seasonal Gardener):* Works 3 months/year, lives off-site.
          *   *Ms. Finch (Absentee Landowner):* Owns Plot 7B, never visited.
          *   *Desert Tortoise (Local Species):* Protected, habitat overlaps town.
          *   *Silver Creek (Water Source):* Flows through town.
          *   *Valley Ventures (Investor):* Holds a lien on the community center.
          *   *The County (Distant Authority):* Ignored them so far.
          *   *The Developer's Ghost:* Lingering legal/emotional claim?
      *   **Voting Cards (30+):** Simple Yes/No cards (or different colors).
      *   **Proposal Slips (20):** Blank slips for writing motions.
  4.  **Whiteboard:** Headings: "Current Voting Body", "Proposed Rule", "Vote Tally", "Ratchet Rule (PERMANENT)".
  5.  **$50 Bounty:** Cash in an envelope on the table: "For the first person to propose a rule defining the voting body that receives unanimous consent from the *current* voting body." *(Crucially, it incentivizes trying, but makes success nearly impossible)*.
  6.  **Timer:** Visible countdown for rounds.

  **Resident Roles (14):** *(Mix obvious insiders, ambiguous cases, potential outsiders)*
  1.  **The Caretaker:** Lived on-site 10 years, maintains utilities (solar/well).
  2.  **The Architect:** Designed the place, stayed hoping it would be finished.
  3.  **The Retiree:** Bought a unit cash, lives here full-time.
  4.  **The Bartender:** Runs the *only* functioning business (pop-up bar).
  5.  **The Squatter:** Moved into an unfinished unit months ago.
  6.  **The Artist:** Rents a studio cheap, seasonal resident (6 months/year).
  7.  **The Mechanic:** Fixes everyone's generators/cars, lives in a trailer.
  8.  **The Prepper:** Lives off-grid on the outskirts, distrustful.
  9.  **The Teacher:** Tutors 3 kids, lives here but works remotely for county school.
  10. **The Landscaper:** Maintains common areas, lives in a shed.
  11. **The Investor's Rep:** Hired to "watch the asset," lives in a model unit.
  12. **The Teenager:** Born to Resident #3, wants a say.
  13. **The New Arrival:** Showed up last week, fixing up a unit.
  14. **The Librarian:** Runs the tiny community library/book exchange.

  **Game Flow & Facilitator Script:**

  **(0-5 mins) Introduction:**
  *   "Welcome to Silver Creek. The developer's gone, the county ignores you. You have shared resources (water, solar grid, a few buildings), shared problems, and no rules. You're here today because *something* needs deciding. But first: **Who gets to decide?** That's your only task: Define who has a vote in this community's decisions. This whiteboard is your constitution. That envelope holds $50 for anyone who gets a definition passed by *unanimous* consent of the *current* voting body. Good luck."

  **(5-15 mins) Round Zero: The Arbitrary Founding (Facilitator is GOD)**
  *   "Before you can vote on who votes, we need *someone* to start. Rule Zero: **The Voting Body is initially defined as...**" *(Choose ONE arbitrary method visibly: e.g., first 6 to arrive, names A-L, anyone wearing blue, holding a specific token).*
  *   Quickly name these 6-8 people. Write their role names under "Current Voting Body" on the whiteboard. **Write "RATCHET RULE (PERMANENT): The Voting Body may be EXPANDED by majority vote of the current Body. It may NEVER be CONTRACTED."**
  *   "Okay Founding Members. You have 10 minutes. Your first task: Propose and vote on a rule to define the *permanent* voting body for Silver Creek. Remember the $50 bounty for unanimous consent. Anyone not currently on the list? You can observe, but you cannot speak or vote *yet*. Proposals go on slips, one person reads them aloud, then vote by show of cards. Majority wins unless it's a rule defining the body – that needs majority *of the current body* to pass. Go."

  **(15-45 mins) Round 1: The First Proposal(s) & Proxy Introduction**
  *   **Listen For:** Self-serving arguments ("We were here first", "We actually *do* the work"), attempts at fairness that exclude ("Only property owners" – excludes Squatter, Teenager, Landscaper?), frustration from excluded. Who tries to dissolve the process? Who bargains for inclusion?
  *   **After first proposal/vote (or at ~25 mins if stuck):** "Hold. Reality check. Silver Creek has stakeholders who aren't in this room. To be thorough, we should consider them." **Distribute Proxy Cards RANDOMLY among ALL 14 players (including excluded).** "If you hold a Proxy Card, you may cast it *in addition* to your own vote, *if* you are part of the voting body *at that moment*. **Crucially:** Before casting a Proxy vote, you *must* state aloud: 'I cast this vote in the interest of [Proxy Name]' OR 'I cast this vote in my own interest.' You cannot abstain with a Proxy."
  *   **Watch For:** How proxies are used/justified. Does anyone consistently vote the proxy's interest? Do they exploit the proxy for personal gain? Does the Tortoise or Creek get considered? Does the Investor's Rep try to grab the Investor proxy?
  *   **Facilitator Actions:** Enforce speaking/voting rules rigidly. Note proposals and votes on the whiteboard. **DO NOT:** Explain circularity, define "affected," solve fairness, suggest solutions. Answer *only* procedural questions. If asked "Who *should* be included?": "That's for you to decide." If asked "What's fair?": "Define your terms through proposals."

  **(45-60 mins) Mid-Game Event: The Fire**
  *   "A gust knocks over a lantern near the solar battery storage. A small fire breaks out! The Caretaker and Mechanic rush to put it out using community water reserves. It's contained, but the battery bank is damaged. Critical decisions are needed NOW: Do you ration power? Prioritize repairs? Tap the emergency fund? But... **the fire used community water. This affects everyone relying on that water source.** Proposals for immediate action can be made, but remember: only the *current* voting body decides. Anyone not in that body... tough luck."
  *   **Impact:** Forces application of existing (likely flawed) rules to a crisis. Who is suddenly "affected"? (The Squatter using water? The Tortoise depending on the creek now lower due to usage? The absentee owner of a plot near the fire?) Does the voting body expand hastily? Do they try to exclude those "not contributing"? Listen for panic-driven justifications.

  **(60-95 mins) Round 2: Re-Litigation Under Pressure**
  *   The fire exposes flaws. New proposals emerge, often trying to fix the boundary *while* dealing with the crisis. The Ratchet Rule means previous inclusions are locked in, making new inclusions feel like grudging concessions. Proxies become bargaining chips.
  *   **Listen Intently For:**
      *   **Justifications for Exclusion:** "They don't contribute financially." / "They're not here permanently." / "They don't own anything." / "They weren't here at the start." / "They don't understand the stakes." / "They have outside interests." / "They're a *liability*." / "We need expertise." / "It's just practical right now." / "They can be represented by [proxy holder]."
      *   **Performing Reasonableness:** Calm tones outlining "objective" criteria (property value, residency duration, tax contribution – none of which exist here!). Appeals to "stability" or "efficiency." Framing exclusion as temporary or necessary.
      *   **Excluded Behavior:** Frustration, bargaining ("If you include me, I'll..."), quiet resignation, attempts to disrupt, forming alliances with other excluded/proxy holders.
      *   **Proxy Trap Manifestations:** Holder admits voting their own interest with a proxy ("Ms. Finch wouldn't care about the fire, but *I* need power!"). Holder paralyzed trying to guess the proxy's interest ("What does the *river* want?"). Holder using proxy power manipulatively ("The Tortoise demands conservation!").
      *   **Circularity Recognition:** "But voting on who votes means *we* decided for everyone else!" / "Why were *you* in the first group?" / "This feels rigged." / "Unanimous is impossible!"

  **(95-115 mins) Debrief: Mapping Chaos to Theory**
  *   **Structure:** 1. Player Reactions (What frustrated you? Key moments?). 2. Facilitator Mapping. 3. Theoretical Grounding (Settled vs. Contested).
  *   **Mapping Moments:**
      *   "When [X] said '[Exclusion Justification Quote]' – that's the **'Boundary Problem'**: Drawing the line *always* requires an undemocratic act. The initial group (Round Zero) was pure **'Fait Accompli'** – an accident made permanent by the Ratchet Rule."
      *   "When [Y] said 'Everyone affected should vote!' and then [Z] asked 'Affected by *what*? How far?' – that's the **'All-Affected Principle' Collapse**. It's impossibly vague. Who speaks for the Tortoise? The water? Future generations? The absentee owner? Is the County 'affected' if it ignores you?"
      *   "The Proxy Cards showed the **'Representation Gap'**. Can one person truly represent another's interests, especially an abstract entity? Did stating 'in their interest' make it true? The gap between *being subject to rules* and *having a say* was stark."
      *   "The Fire forced you to use **existing, likely inadequate rules** for a new problem, highlighting **institutional rigidity**. The Ratchet Rule meant every expansion was **path-dependent** – shaped by the initial accident."
      *   "The $50 bounty revealed the **'Unanimity Illusion'** for foundational rules. Agreement on the *demos* is incredibly rare because stakes are highest."
  *   **Settled vs. Contested Theory (For Your Novel):**
      *   **Settled:** The "Boundary Problem" is fundamental. Defining the demos is logically prior to democratic procedure and cannot be solved democratically without circularity (Dahl, Whelan). Arrow's Theorem shows perfect democratic aggregation of preferences is impossible under certain conditions. Path dependence in institutions is well-established. There's a gap between "subject to rules" and "has a say."
      *   **Contested:** **Solutions to the Boundary Problem:** Is it initial contract? Historical attachment? "Stakeholder" analysis? "All-subjected" principle? All are debated. **The All-Affected Principle:** How to define "affected"? Is it causal impact? Moral concern? This is deeply contested (Goodin, Arrhenius). **Representation:** Can non-humans/future gens be represented meaningfully? How? (Dryzek, Eckersley). **The Ratchet:** Is permanent expansion desirable? Some argue contraction mechanisms are essential for stability (rarely democratic though!).
      *   **Novelist Takeaway:** Your character can grapple with the *problem* (circularity, exclusion, defining "affected") as an obvious frustration. Their *proposed solutions* should reflect their personality/bias and be recognizably contested (e.g., "Only permanent residents!" vs. "Anyone who drinks the water!"). Avoid them declaring *the* solution as fact.
  *   **Predictable Problems & Mitigation:**
      *   **"Universal Suffrage Now!":** Someone will propose "Everyone here votes!" early. **Mitigation:** The Ratchet Rule! If proposed *after* Round Zero, it needs a majority vote *of the initial body* to expand to everyone. They might pass it... but it still happened *after* the initial exclusion, proving the point. Proxies complicate "everyone" (is the Tortoise "here"?). The $50 bounty requires *unanimous* consent on the *rule defining the body* – "everyone votes" won't be unanimous (The Prepper? Investor's Rep?).
      *   **Personality Contest:** Focus them on ROLES, not personal opinions. Enforce "speak as your role." The mechanics (proposals, votes, proxies) create structural conflict beyond personalities.
      *   **Stalemate:** The $50 bounty, the Fire event, and the visible timer create pressure. Remind them the goal is to *try* to define the body, not necessarily succeed perfectly. Observing the failure is data.
      *   **Facilitator Lecturing:** Stick to mapping *their* experiences to concepts. Ask *them*: "When X happened, how did that feel? What did it reveal?" Use their quotes. Present the "Settled" ideas as tools to understand *their* experience, not abstract truths. Present "Contested" ideas neutrally as different lenses.

  **What the Game Can't Show You (Needs Prose):**
  1.  **Slow Burn Resentment:** The game shows immediate friction, not the long-term corrosion of exclusion or the evolution of an "insider" mentality.
  2.  **External Pressures:** The true weight of being ignored by the county, legal limbo, or environmental decay happens off-stage.
  3.  **Deep History/Relationships:** Pre-existing feuds, alliances, or traumas within the community.
  4.  **Institutional Evolution:** How rules made under duress (like post-fire) solidify into permanent, perhaps unfair, structures over months/years.
  5.  **Complex Motives Beyond Survival:** Hope, nostalgia, idealism, deep connection to place – these fuel "reasonable" arguments but need internal monologue.
  6.  **The Weight of Silence:** Who *never* speaks up, even when included? Why? (Fear, apathy, calculation?) This is subtle but crucial.

  **What to Listen & Look For (Novelist Gold):**
  *   **The Language of Exclusion:** Note the specific adjectives and justifications used. "Transient," "uninvested," "irresponsible," "outsider," "not one of us," "freeloader," "risky," "complicated."
  *   **Reasonable Performance:** Who uses calm logic to mask self-interest? Listen for "just," "simply," "obviously," "practical," "for now," "in the interest of stability/efficiency." Watch body language – forced calm, over-enunciation.
  *   **The Flinch:** When someone realizes the circularity or the cruelty of exclusion and hesitates. Do they push through? Back down? Rationalize it away?
  *   **Proxy Wrestling:** Genuine attempts to channel the proxy vs. blatant self-interest. The absurdity of speaking for the river/tortoise/unborn child.
  *   **Post-Vote Reactions:** Smugness? Guilt? Resentment? Relief? Who avoids eye contact?
  *   **Coalition Building:** Who whispers to whom? Who trades proxy support for inclusion promises?
  *   **The Quiet Ones:** Who disengages? Who watches intently but says little? Who seems overwhelmed?

  This setup guarantees friction, reveals the core paradoxes through play, and generates the raw, self-serving, and frustratingly "reasonable" dialogue you need. Embrace the chaos, enforce the rules mechanically, and take copious notes on the language of constitution-building under pressure. Good luck, and watch that $50 bounty – it might just stay unclaimed!
