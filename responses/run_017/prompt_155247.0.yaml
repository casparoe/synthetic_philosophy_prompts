  ### 3. Pragmatic Exploitability (e.g., Money Pump)
  **Philosophical argument**: Cyclical preferences (e.g., \(a \succ b\), \(b \succ c\), \(c \succ a\)) make an agent exploitable via "money pumps" (paying to cycle between options). Thus, cycles are irrational.

  #### Closest object in MCDM
  - **Cycles in outranking graphs**: 
    - Non-transitive concordance (e.g., \(a\) concordant-dominates \(b\), \(b\) dominates \(c\), but \(c\) dominates \(a\) on critical attributes) creates cycles.
    - **Distillation procedures** (e.g., ELECTRE III) resolve cycles into partial orders using net flows or ranking heuristics.
  - **Vulnerability**: An agent acting on pairwise outrankings alone could be pumped, but MCDM avoids this by holistic recommendation.

  #### Residue report
  - **Maps cleanly**: 
    - Cycles arise from vetoes/discordance and are handled algorithmically. Exploitability is a non-issue if agents follow the method’s recommendation.
    - E.g., Even with cycles, ELECTRE outputs a ranking where no pump is possible.
  - **Survives with distortion**: 
    - Philosophy assumes agents *use* binary relations directly. MCDM assumes they defer to a procedure. Distortion: Portraying MCDM as descriptive (how agents decide) vs. prescriptive (how they should).
  - **Inexpressible**: 
    - "Rational criticisability" implies agents *should* avoid cycles. MCDM is neutral—cycles are computational artifacts, not failures. The normative force of exploitability isn’t captured.

  #### Testing your hypothesis
  - **Hypothesis**: Ternary formalization (menu-dependent relations) dissolves cycles, so exploitability loses grip.
  - **Analysis**:
    - **Overreach**: If ternary relations still permit cycles *within a fixed set* (e.g., \(\text{better}(a, b, X)\), \(\text{better}(b, c, X)\), \(\text{better}(c, a, X)\)), exploitability applies. Your framework doesn’t guarantee cycle-free ternary relations.
    - **Grip loss**: Yes, if relations are menu-dependent, a bookmaker can’t exploit across sets. But *within* a set with a cycle, pumping is possible if agents act pairwise.
  - **Verdict**: 
    - Hypothesis **partially holds**. Menu-relativity prevents *fixed* cycles, but not *set-specific* ones. Survivors: (1) MCDM’s holistic procedures avoid exploitation, showing that philosophical "rationality" is procedural; (2) The residue—exploitability in set-specific cycles—reveals a limitation: your framework assumes agents use recommendations, not pairwise choices. This isn’t a defect but highlights a gap in philosophical arguments that ignore structured decision-making.

