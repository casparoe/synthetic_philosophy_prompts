                but we might not have a2 > an (if we don't require transitivity) or we might have an intransitivity. However, the exploitability argument could still be run if the agent is presented with the set {a1,a2,an} and has these pairwise relations. But note: the agent might not have pairwise relations that form a cycle: we have a2>a1 and a1>an, but if we don't have a2>an, then it's not a cycle. However, if the agent also has a2>an, then we have a cycle: a2>a1>an and then if a2>an, that's consistent. But if we have a2>an, then it's a chain without a cycle. The cycle would only occur if we had an>a2? We don't have that. So the problem is not a cycle but an intransitivity (if we don't have a2>an). The money pump can be: start with a2. The agent is offered to trade a2 for a1 (because a2>a1, so they would pay to switch to a1). Then from a1, they are offered to switch to an (because a1>an, so they would pay to switch to an). Now, can they be offered to switch back to a2? We don't have an>a2. We might have a2>an, so they would pay to switch back to a2. Then they are back at a2 and have paid three times. That's a money pump. So the cycle is: a2>a1, a1>an, and then an>a2? But we don't have an>a2. We have a2>an. So the cycle isn't there. However, if we have a2>an, then the agent would not accept to switch from an to a2? Actually, they would because a2>an means they prefer a2 over an. So the cycle is not present. 

