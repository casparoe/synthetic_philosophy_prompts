  Okay, the user is writing a science and ideas column and is stuck on a piece about a philosophical argument between two friends, Ines and Tomas. They want me to adjudicate their exchange step by step, determine who has the better argument, and identify what each is missing. 

  First, I need to understand the core debate. Ines represents non-cognitivism (moral statements express attitudes, not facts), while Tomas defends cognitivism (moral statements describe objective properties). The argument starts from Rob's statement that he feels nothing but still thinks an action was wrong—this becomes the central puzzle.

  Looking at the numbered exchanges: Ines's move (1) sets up her non-cognitivist view but admits Rob's remark challenges it. Tomas counters in (2) with the Frege-Geach problem—how can moral conditionals work if they're just expressions of attitude? Ines responds in (3) with higher-order attitudes to preserve logical validity. Tomas fires back in (4) with two objections: emotional states lack logical opposites, and even if her solution works, it doesn't explain why moral language behaves like descriptive language across contexts (assertion, denial, supposition).

  Ines concedes part of (4) in (5), especially the difficulty with supposition, but argues meaning comes from social practice, not reference. She throws the "queerness" objection back at Tomas—how can moral properties exist if they're separate from all descriptive facts? Tomas sidesteps that in (6), focusing on Rob's lack of feeling as a problem for Ines. Ines replies in (7) that attitudes can be "cold" policies, not feelings. Tomas emails a final objection: this makes her theory unfalsifiable.

  Now for adjudication: 
  - (1) is mostly right but needs qualification. Ines correctly identifies the action-guiding force of morality, but overstates the link between judgment and motivation (psychopaths might judge something wrong without being moved). 
  - (2) is clearly right. Tomas perfectly frames the Frege-Geach problem for non-cognitivism. 
  - (3) is mostly wrong. Ines's solution is theoretically possible but implausible—it's hard to believe we actually form complex meta-attitudes for every moral conditional. 
  - (4) is mostly right. Tomas's first point (about emotional opposites) is weak, but his second point hits hard—Ines hasn't explained the unity of meaning across speech acts. 
  - (5) is mixed. Ines's concession is fair, and her "queerness" point lands, but her practice-based meaning explanation is vague. Tomas should engage with the metaphysical challenge. 
  - (6) is mostly wrong. Tomas misreads Ines by equating attitude with feeling; her "cold policy" reply is strong. 
  - (7) is clearly wrong. Tomas's unfalsifiability charge is unfair—all philosophical theories interpret behavior, and Ines's view still makes predictions (e.g., amoralists would be unintelligible).

  Overall, Tomas is ahead. He exposed the core problems for non-cognitivism (logic, meaning unity) while Ines's solutions feel ad hoc. But both have blind spots: Ines ignores how much her view strains psychology, Tomas dodges the metaphysical weirdness of moral properties. The burden now lies with Ines—she must either refine her account of moral reasoning or explain why we shouldn't expect it to mirror logic. If Tomas continues, he should address the "queerness" objection head-on. 

  For the user's column, I'll emphasize that philosophy isn't about knockout blows—it's about whose position generates fewer unsolved puzzles. Here, Tomas's cognitivism has more explanatory power for how we actually use moral language, even if it invites metaphysical headaches.
answer: |-
  Here's a step-by-step adjudication of the exchange, followed by an overall assessment:

  **Adjudication of Moves:**
  1.  **Ines (1): Mostly right, but needs qualification.**  
      *Rationale:* She correctly identifies the action-guiding force of moral language ("oomph") as a key feature needing explanation, and her expressivism ("hiss") captures this well. However, she overstates the *necessity* of the link between judgment and motivation ("if you genuinely judge... you are moved"). Psychopaths or deeply depressed individuals might sincerely judge something wrong without being moved. Her view needs room for *defeasible* rather than *necessary* motivation. She rightly identifies Rob's remark as a challenge for her.
  2.  **Tomas (2): Clearly right.**  
      *Rationale:* He perfectly frames the core logical problem for pure expressivism (the Frege-Geach or embedding problem). Validity in arguments like modus ponens depends on the *same content* being asserted in the premise and concluded. If "wrong" *only* expresses an attitude ("Boo!"), the conditional premise expresses no attitude towards the act itself, making the inference nonsensical. He successfully shows pure "boo/hurrah" expressivism sacrifices logic for psychology.
  3.  **Ines (3): Mostly wrong.**  
      *Rationale:* Her solution (higher-order attitudes) is a *possible* theoretical move (akin to sophisticated expressivism like Blackburn's quasi-realism), but it's psychologically implausible as an account of what ordinary speakers *mean* or how they reason. Does Rob *really* have a complex meta-attitude about combinations of attitudes when he understands the conditional? This feels like a technical fix straining to save the theory, not a description of actual moral thought. It *might* restore logical coherence formally, but at the cost of intuitive fidelity. It doesn't fully address the "sameness of meaning" point Tomas raises next.
  4.  **Tomas (4): Mostly right.**  
      *Rationale:* His first point (about needing exact opposites) is weaker; expressivists can define practical inconsistency without needing perfect emotional mirror-images of belief/disbelief. However, his **second point hits the mark**: Even if Ines builds a formal system mimicking logic, it doesn't explain *why* moral language behaves *exactly* like descriptive language in all these different contexts (assertion, denial, questioning, supposition). This persistent "sameness of content" across diverse speech acts strongly suggests that "wrong" functions like a predicate referring to something objective, not just an expression of a (even complex) attitude. Rob's wondering is *about the same thing* as his asserting – this "aboutness" is hard for expressivism to capture without smuggling in realism.
  5.  **Ines (5): Mixed (Concession is right; positive move is mostly wrong).**  
      *Rationale:* Her concession about supposition being the hardest case is correct and important. Her positive explanation ("same role in shared practice") is weak. While practice is crucial, it doesn't adequately explain the *specific* kind of sameness – the sense that "wrong" points to a *feature of the act itself* that we are coordinating *around*, rather than just coordinating our attitudes. Her challenge to Tomas ("you owe me something... odd property") is **strong and valid**. The "queerness" of moral properties (their necessary action-guidingness, their seeming irreducibility to natural facts) is a major problem for realism that Tomas ignores. His "attacking, not defending" dodge is unhelpful.
  6.  **Tomas (6): Mostly wrong.**  
      *Rationale:* He mischaracterizes Ines's position. She never equated "attitude" solely with *feeling* or *desire* in a raw emotional sense. His counterargument only works against a crude "emotivism" (which Ines explicitly moved beyond in (3) by invoking "stance" and structure). He fails to engage with her developing account.
  7.  **Ines (7): Clearly right (against Tomas's mischaracterization).**  
      *Rationale:* She effectively corrects Tomas's misreading. Her distinction between "attitude" as a complex dispositional state (policy of avoidance, criticism, expectation) and transient *feelings* or desires is essential and plausible. Rob's lack of anger doesn't negate his acceptance of the policy/concept "wrong". This captures Rob's statement well.
      **Tomas's Email Reply: Mostly wrong.**  
      *Rationale:* His unfalsifiability charge is unfair. *Any* philosophical theory interprets behavior (e.g., "He said 'grass is green' but did he *really* believe it?"). Ines's view *does* make predictions: e.g., someone utterly devoid of *any* dispositions to avoid, criticize, or expect criticism for an act couldn't sincerely call it "wrong." Her view is testable in principle, though interpretations can be complex. He mistakes the difficulty of *applying* the theory for it being unfalsifiable *in principle*.

  **Overall Assessment: Who Has the Better of the Argument?**

  *   **Tomas is slightly ahead at this point.** He landed the two most significant philosophical blows:
      1.  **The Embedding Problem (Move 2):** He exposed the fatal flaw in simple expressivism and forced Ines into a complex, potentially ad hoc solution (higher-order attitudes) to salvage logic.
      2.  **The Sameness of Meaning Problem (Move 4):** He compellingly argued that even if Ines *solves* the logic problem technically, she hasn't *explained* why moral language behaves *exactly* like fact-stating language across all contexts. This "aboutness" and persistent content is a deep challenge for expressivism.
  *   **Ines successfully defended against Tomas's weaker attacks** (the counterexample based on Rob's lack of feeling - Moves 6 & 7, and the unfalsifiability charge). Her "queerness" objection (Move 5) against realism remains potent and unanswered by Tomas.

  **What Each is Missing/Ignoring:**

  *   **Ines:**
      *   **The Explanatory Burden:** She hasn't adequately explained *why* our moral language and practices developed this precise logical structure if they are *only* about coordinating attitudes. Tomas's point about sameness of meaning across contexts suggests the structure arises because we *are* trying to talk about something objective.
      *   **Psychological Plausibility:** Her solution using complex higher-order attitudes feels overly intellectualized for everyday moral reasoning. Is this really what's happening when Rob understands "If that was wrong, then this is wrong"?
      *   **The Amoralist Challenge (Qualified):** While she handled Rob (cold attitude), a true amoralist who *understood* "wrong" but felt *no* dispositions (not even cold ones) would be a deeper problem. Her view predicts such a person couldn't sincerely use the term, which is debatable.
  *   **Tomas:**
      *   **The Queerness/Motivation Problem:** He completely dodged Ines's powerful challenge (Move 5). If "wrong" names a real property, how is it that recognizing this property *necessarily* motivates (or provides reasons for) action, unlike any other natural property? How does this property relate to the descriptive facts Rob can list without resolving the moral question? This is a major metaphysical and epistemological hurdle for realism.
      *   **Rob's Phenomenon:** He hasn't offered a positive explanation for Rob's lack of feeling combined with moral judgment that is clearly *better* than Ines's "cold policy" account.

  **Where the Burden of Proof Lies & What Comes Next:**

  *   **The burden of proof now lies primarily with Ines.** Tomas has successfully raised serious, unresolved problems for her expressivist/quasi-realist project (embedding, sameness of meaning). Her next move must either:
      1.  **Strengthen her explanation:** Provide a more compelling, less ad-hoc account of *how* her complex attitude structures underpin not just validity but the *phenomenon* of sameness of meaning/content across diverse speech acts. Why *does* it feel like we're talking about the same "thing" (wrongness) when we assert, deny, or suppose?
      2.  **Reframe the challenge:** Argue that the "sameness" Tomas observes is *only* a feature of the linguistic/social practice of coordination itself, and that the expectation it *must* correspond to a realist "aboutness" is a mistake. She needs to demystify the demand for sameness.
  *   **Tomas, if continuing, must address the Queerness Objection.** He can no longer ignore it. His next move should be to sketch how a moral realist *can* plausibly explain:
      1.  The necessary connection (or strong, reason-giving link) between recognizing a moral property and being motivated/feeling obligated.
      2.  How moral properties supervene on, emerge from, or are constituted by natural properties, bridging the "gap" Rob highlights. How does the verdict *follow* from the facts he lists?
  *   **The Core Stalemate:** The argument has reached the fundamental tension in metaethics: **Can the "oomph" (action-guidingness) of morality be reconciled with its "logical shape" (propositional structure, objectivity) without resorting to queer properties (realism) or overly complex psychological contortions (sophisticated expressivism)?** Ines prioritizes oomph and explains logic with difficulty; Tomas prioritizes logic and owes an explanation of oomph/queerness.

  **Who "Won" for Your Column:**

  Neither scored a knockout, but **Tomas landed the heavier philosophical punches.** He exposed the core technical difficulties that keep professional philosophers up at night regarding expressivism (embedding, meaning constancy). Ines defended ably against his less sophisticated attacks and retains a powerful challenge for realism (queerness), but hasn't resolved the deep problems Tomas raised for her core position. The exchange perfectly illustrates how philosophical disputes often hinge on which set of problems (logic for expressivism, metaphysics for realism) one finds more compelling or tractable. The burden is now on Ines to shore up her position against Tomas's logical critiques. Tell your readers Tomas pressed the stronger case *on the core philosophical issues raised*, but Ines ensured the fight is far from over by leaving realism's biggest weakness exposed.
