prompt: |-
  I'm a third-year philosophy major taking a cross-listed seminar on philosophy of biology this term, and we've just been assigned the 1979 Gould–Lewontin "Spandrels" paper ahead of the midterm. Before reading it properly I borrowed a popular book on evolutionary psychology from my housemate — one of those general-audience trade paperbacks — because somebody in our study group said its opening chapter on "the adaptationist wars" was a good orientation. That chapter summarizes the argument roughly like this:

  "Gould and Lewontin's 1979 paper showed that adaptationism is false. Adaptationism, as they defined it, is the view that every trait of every organism is an adaptation, shaped by natural selection for the job it now performs — the Panglossian faith that whatever exists is the best design available, so that for any feature you look at there must be a story about what it is for. Against this they argued that most features of an organism are spandrels: unavoidable by-products of building a body one way rather than another, like the tapering triangles of masonry you inevitably get when you set a dome on rounded arches in St Mark's, which were never designed for anything at all even though the mosaicists later covered them in sacred images. It follows that a trait's present usefulness is no evidence whatsoever about why it evolved, so asking 'what is it for?' is a waste of a biologist's time; what you should study instead is growth rules, allometry and developmental constraint. And since human behaviour is part of the phenotype like anything else, the paper effectively demolished the adaptationist research programmes — sociobiology first, and later evolutionary psychology — that had assumed our behaviour is a set of adaptations."

  I need to know how much of that to carry into my notes and how much to discard. The last two sentences feel overstated to me: in lecture our professor said Gould and Lewontin both insisted they were not denying the power of natural selection or that organisms are well fitted to their environments, and she mentioned in passing that Mayr and Maynard Smith conceded a good deal of the methodological criticism while still treating adaptationism as the core of evolutionary thinking. She also mentioned, only in passing, that a critic later argued the architectural structures in question aren't really spandrels at all and that the term should have been something like "pendentive", and I can't tell whether that is a substantive point about the argument or a pedantic one about vocabulary. So please go through the paragraph claim by claim and separate what Gould and Lewontin would themselves have accepted, what they would have winced at as a caricature of their position, and what an adaptationist critic would call simply wrong — in particular: is the "adaptationist programme" they attacked really the thesis that every trait is an adaptation, or has the book substituted an indefensible version for the real target; does their notion of a spandrel cover any feature that wasn't directly selected, or only a narrower class, and does that difference change how strong their conclusion is; is the "no evidence whatsoever" line theirs or an overstatement of a more careful claim about the gap between current utility and historical origin; and does the sentence about sociobiology and evolutionary psychology follow from anything the paper establishes, or is it the sort of conclusion the paper is routinely recruited for without actually delivering?

  The reason this matters beyond the midterm is a problem-set case we were given, which I'd like you to re-run under your corrected reading. It's invented: a species of burrowing frog in which males have greatly enlarged forearms; the enlargement is a by-product of selection for larger overall body size under an allometric growth rule and was not itself selected; but males now use those forearms to wrestle rivals in burrow disputes, and the winners get more matings. Our handout says that under Gould and Lewontin this is a spandrel and its present function is irrelevant to its evolutionary explanation. Is that a faithful application or the same misunderstanding again, and does the verdict change if the forearm has since been further modified by selection for grappling? If the corrected version of the argument and the book's version would classify some case differently, I'd love that case too, since I'd rather be able to state the distinction crisply than just say the popular book is wrong.
reasoning: |-
  Okay, let me unpack this user's query step by step. They're a philosophy major dealing with Gould and Lewontin's "Spandrels" paper, and they've encountered a simplified summary in a popular book. The user wants to separate accurate representations from distortions, especially regarding adaptationism, spandrels, and implications for evolutionary psychology.

  First, I need to address the book's claims. The book presents adaptationism as the belief that every trait is an optimal adaptation. But Gould and Lewontin were actually criticizing methodological adaptationism - the tendency to assume adaptation without testing alternatives. The "every trait is an adaptation" version is indeed a straw man; their real target was more nuanced.

  About spandrels: The book suggests all non-adaptive traits are spandrels, but Gould and Lewontin meant specifically architectural by-products with later co-opted uses. The user mentions pendentives - that's actually important because real spandrels are decorative elements, while pendentives are structural. This isn't just pedantic; it shows Gould and Lewontin might have misunderstood their own architectural analogy.

  The "no evidence whatsoever" line is clearly overstated. Current utility can provide clues about evolutionary origins, it's just not conclusive proof. The user's professor mentioned Mayr and Maynard Smith conceding methodological points while keeping adaptation central - that's crucial context. Adaptationists accepted the critique but still see adaptation as the default hypothesis to test.

  For the frog example: The initial forearm enlargement is correctly identified as a spandrel (developmental by-product). But when selection modifies it for wrestling, it becomes an exaptation with adaptive value. The handout saying its function is "irrelevant" goes too far - Gould and Lewontin would argue the origin matters, but current function is still biologically significant.

  The user wants crisp distinctions. Key points are: 1) Adaptationism they criticized wasn't "every trait must be adaptation" but "assume adaptation without testing"; 2) Spandrels are specific structural by-products, not all non-adaptive traits; 3) Current function isn't irrelevant, it just doesn't explain origin.

  The evolutionary psychology dismissal in the book is particularly problematic. Gould actually thought human behavior could have adaptations (like domain-general intelligence), just opposed ultra-adaptationist explanations. The paper didn't "demolish" these fields - it urged caution against just-so stories.

  For the user's notes, I'll emphasize: the architectural term mix-up matters because it reveals conceptual fuzziness in the analogy; the frog case shows how a spandrel can become adaptive; and the real target was methodology, not adaptation per se. Their professor's hints about Mayr/Maynard Smith are worth following up - shows the debate was about how to do science, not whether adaptation exists.
answer: |-
  Here's a breakdown of the popular book's summary compared to Gould & Lewontin's actual argument, point by point, followed by analysis of the frog case and a clarifying example:

  **Claim 1: "Gould and Lewontin's 1979 paper showed that adaptationism is false. Adaptationism, as they defined it, is the view that every trait of every organism is an adaptation..."**
  *   **G&L Would Wince:** This is a **significant caricature** of the "adaptationist programme" they criticized. They explicitly targeted a *methodological* stance, not a naive ontological claim. Their target was **methodological adaptationism**: the tendency to atomize the organism into traits, assume *a priori* that each trait is an optimal adaptation formed directly by natural selection *for its current function*, and then invent a "just-so story" to explain it, *without seriously considering alternatives* (like developmental constraints, pleiotropy, allometry, or phylogenetic inertia) or demanding rigorous testing. They accused adaptationists of treating non-adaptive explanations as a "last resort".
  *   **Adaptationist Critic Would Say It's Wrong:** Prominent adaptationists like Maynard Smith, Dawkins, and Mayr explicitly *rejected* the "every trait is an adaptation" strawman. They understood that constraints, drift, and historical contingency exist. Their core argument was that adaptation *by natural selection* is the primary explanation for complex functional design *most of the time*, and should be the *default hypothesis to be tested rigorously*, not assumed uncritically. They saw G&L attacking a position few serious biologists held.
  *   **G&L's Actual Position:** They argued methodological adaptationism was a flawed, overly restrictive *research strategy*, not that adaptation wasn't important. They emphasized pluralism: constraints, history, and non-adaptive by-products play crucial roles alongside selection in shaping phenotypes.

  **Claim 2: "Against this they argued that most features of an organism are spandrels..."**
  *   **G&L Would Wince:** "Most features" is a **gross overstatement**. They never quantified it. Their point was that spandrels (and other non-adaptive factors) are *sufficiently common and important* to be routinely considered, not that they constitute the majority. They used the spandrel *as an analogy* to illustrate a broader point about non-adaptive origins.
  *   **Architectural Pedantry (Pendentives):** This is **pedantic but conceptually relevant**. The structures in St. Mark's are *pendentives* (spherical triangles supporting the dome), not true spandrels (the roughly triangular spaces *between* arches). True spandrels are often decorated *secondarily*. The confusion matters slightly because:
      1.  It highlights potential looseness in their analogy.
      2.  It reinforces the core point: pendentives *are* structural necessities (like developmental constraints) that *then* present spaces (spandrels) that can be *co-opted* for decoration (like novel functions). The core concept of a non-adaptive *origin* with subsequent *exaptation* remains intact.
  *   **G&L's Actual Position:** Spandrels are specifically **features arising as necessary by-products of other selected structures or developmental processes, which are then *available* for later co-option to a new function** (exaptation). This is a **specific subset** of non-adaptive origins, *not* synonymous with "any feature not directly selected". Other non-adaptive origins include pure genetic drift, side-effects of selection on correlated traits (pleiotropy), and deeply entrenched historical constraints.

  **Claim 3: "...so asking 'what is it for?' is a waste of a biologist's time; what you should study instead is growth rules, allometry and developmental constraint."**
  *   **G&L Would Wince:** This is a **serious misrepresentation**. They did *not* say studying function was a "waste of time". They argued:
      1.  **Don't *assume* current utility explains origin:** A trait's current function may not be why it arose (it could be a spandrel/exaptation).
      2.  **Consider alternatives first:** Before inventing an adaptive story, rigorously evaluate non-adaptive hypotheses (constraints, allometry, pleiotropy).
      3.  **Study the *whole organism*:** Understand how developmental systems generate integrated structures; don't atomize. Studying constraints, allometry, and development is essential to understanding the *range of possibilities* for selection to act upon, and to identify traits that *aren't* direct adaptations.
  *   **"No evidence whatsoever" is Overstated:** G&L argued current utility provides *weak* or *ambiguous* evidence for *origin*. Finding a use *now* doesn't prove it was *selected for* that use *originally*. However, they acknowledged that current utility *can* be relevant, especially if it provides clues about *subsequent* selective modification (exaptation). Their point was about the gap between current use and historical origin, not that current use is irrelevant to biology.

  **Claim 4: "And since human behaviour is part of the phenotype like anything else, the paper effectively demolished the adaptationist research programmes — sociobiology first, and later evolutionary psychology..."**
  *   **G&L Would Ambivalently Accept/Reject:**
      *   **Accept:** They *did* intend their critique to apply strongly to sociobiology (Wilson's version), seeing it as a prime example of uncritical adaptationist storytelling about complex human behaviors. They were deeply skeptical of claims that specific modern human social behaviors were direct Pleistocene adaptations.
      *   **Reject:** "Demolished" is far too strong. They offered a *critique* and an *alternative perspective*, not a refutation. They did *not* argue that *no* human behaviors are adaptations. Gould, in particular, later argued aspects of human cognition *could* be adaptations (e.g., domain-general intelligence), just not necessarily the highly specific modules often proposed by early EP. The core EP argument – that the mind contains evolved, domain-specific information-processing adaptations – was *not* demolished by the spandrels argument. EP proponents argued they *do* test alternatives (e.g., byproduct hypotheses) and consider developmental constraints, though critics (including G&L) often disputed how rigorously this was done.
  *   **Does it Follow?** **No.** The paper establishes that non-adaptive origins for traits *exist* and methodological adaptationism is flawed. It does *not* prove that human behaviors *in particular* are primarily spandrels or non-adaptive, nor does it inherently invalidate the *possibility* of identifying human behavioral adaptations using rigorous methods. The leap to "demolished" is a political/rhetorical overreach frequently recruited for the debate, not a logical conclusion of the paper itself.

  **The Frog Case Analysis (Under Corrected Reading):**

  1.  **Initial Situation (Enlarged forearms as by-product of overall size selection):**
      *   **Is it a Spandrel?** **Yes, under the corrected definition.** The forearm enlargement arose as a necessary by-product (due to allometry) of selection acting on *another* trait (overall body size). It was not directly selected for *initially*. Its origin is non-adaptive *for grappling*.
      *   **Is its present function irrelevant?** **No, this misstates G&L.** While its *origin* is explained by allometry + selection for size, its *current function* (wrestling/mating success) is highly biologically relevant! G&L would argue we must understand *both* the developmental origin (why the trait exists in that form) *and* its current selective maintenance. Ignoring the current function would be as wrong as ignoring the developmental origin. The key G&L point is: **don't assume the current function explains why the trait *arose* in the first place.** Here, it didn't.
      *   **Handout Verdict:** The handout correctly identifies it as having a spandrel-like origin but **overstates by saying the present function is "irrelevant"**. It's crucial for understanding the trait's *current* biology and likely *subsequent* evolution.

  2.  **Modified Situation (Forearm further modified by selection for grappling):**
      *   **What Changes?** The trait has undergone **exaptation**. The *original structure* (large forearm) was a spandrel (non-adaptive by-product). Its *co-option* for grappling and subsequent *modification by selection* for that function means it is now also an **adaptation *for grappling***. It has both a non-adaptive origin and a subsequent adaptive history.
      *   **G&L Verdict:** This exemplifies their concept perfectly! It starts as a spandrel (origin) and is then exapted and shaped by selection (current adaptive function). A complete explanation *must* include both the developmental constraint/allometry *and* the subsequent selective history. Only studying the allometry would miss the current adaptive significance. Only inventing a story about why selection *originally* favored large forearms for grappling would be wrong (and adaptationist in the flawed sense).

  **A Crisp Distinction: The Bird Example**

  *   **Case 1 (Pure Spandrel + Exaptation):** Bird feathers. Strong evidence suggests feathers first evolved for thermoregulation (or display?) in dinosaurs. Their *origin* is an adaptation (not a spandrel). However, the complex flight feathers of modern birds are **exaptations** for flight – the original adaptation was co-opted and modified for a new function.
  *   **Case 2 (Spandrel + Exaptation + Adaptation):** The large forearm in your frog *after* modification for grappling. Origin: Spandrel (by-product). Current Form/Function: Adaptation (modified by selection *for* grappling).
  *   **Case 3 (Misapplied "Spandrel" per Book):** Human chin. Often cited as a "spandrel" resulting from jawbone growth patterns. Under the *corrected* G&L view, it *is* a potential spandrel (developmental by-product). The *book's* summary might imply "it has no function, don't study it", but biologists *do* study its development (constraint) and also investigate if it has any current selective significance (e.g., in sexual selection? stability?).
  *   **Case 4 (Where Book & G&L Might Diverge):** The human female orgasm. An adaptationist might argue it's an adaptation for pair-bonding or sperm uptake. A strict G&L-inspired critic might argue it's a spandrel – a by-product of the developmental system that builds the homologous male orgasm (which is directly selected via pleasure-reward for ejaculation). The **book's summary** implies "it's a spandrel, therefore its current function (pleasure, bonding?) is irrelevant to its evolution, stop studying it." **G&L's actual position** would be: "Don't *assume* it's a direct adaptation for bonding/sperm uptake. First, rigorously test the hypothesis that it's a developmental by-product of the selected male system. If confirmed, *then* its current function (whatever it may be) is a result of exaptation, not the original reason for its existence. Studying its current physiological/psychological effects is still valid biology, but don't conflate that with its evolutionary *origin*."

  **Summary for Your Notes:**

  1.  **Target:** Methodological adaptationism (atomization, assumption of optimal adaptation/current function as origin, neglect of alternatives), NOT the strawman of "every trait is an adaptation".
  2.  **Spandrel Definition:** A specific type of non-adaptive *origin*: a necessary by-product of other selected structures or developmental processes, which is *available* for later co-option (exaptation). Not synonymous with "non-adaptive trait".
  3.  **Core Argument:** Current utility ≠ Evolutionary origin. Rigorously test non-adaptive hypotheses (constraints, pleiotropy, allometry, spandrels) *before* (or alongside) inventing adaptive stories. Study the integrated organism and its development.
  4.  **Not Anti-Adaptation:** Adaptation is powerful and real, but not the *only* important factor. It acts within constraints.
  5.  **Human Behavior:** A *critique* of uncritical adaptationism in sociobiology/EP, not a "demolition". Does not preclude human behavioral adaptations.
  6.  **Frog Case (Initial):** Spandrel origin (correct), but current function is *not* irrelevant – it explains the trait's maintenance and likely future evolution. Handout overstates.
  7.  **Frog Case (Modified):** Exemplifies spandrel (origin) -> exaptation -> adaptation (current function). Requires both explanations.
  8.  **Key Distinction:** Origin (why did the trait *appear*?) vs. Current Function (what does it do *now*? is it maintained/elaborated by selection?).

  Discard the book's caricatures of adaptationism and the "most features are spandrels" / "current function is irrelevant" claims. Focus on G&L's methodological critique, the spandrel *as an example* of non-adaptive origin leading to exaptation, and the crucial separation between a trait's origin and its current utility.
