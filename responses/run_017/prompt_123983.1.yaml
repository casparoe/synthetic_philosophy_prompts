  What they're really asking for is conceptual clarity. They suspect these aren't just stubborn myths but serve distinct functions: sustaining commitments or protesting power structures. The key nuance is that communities accept the evidence but reject its authority over the story's purpose. 

  I should avoid academic jargon since they can't access scholarly literature. The response must honor their grassroots insight while offering precise framing. The phenomenon feels adjacent to collective memory studies but differs crucially: it's not about disputed facts or suppression, but about functional persistence beyond factual accuracy. 

  Their own term "anchor stories" is actually quite good. I might refine it by distinguishing between the commitment-anchor (where the story sustains relationships) and protest-anchor (where it challenges institutional control of truth). The third example shows these aren't about right/wrong outcomes but about the stance itself – the quarry discovery validated the protest against archival authority. 

  Boundaries matter too. This isn't state propaganda or willful ignorance; it requires community agency and acceptance of counterevidence. If the story caused tangible harm or was externally imposed, it would fall outside the definition. 

  The user's phrase "the story was never really a claim about 1943" is profound. That's the core: these stories are utterances doing work in the present, not attempts to reconstruct the past. I'll make sure to center that insight.
answer: |-
  What you’ve observed is a profound and under-discussed phenomenon: the persistence of community memory not as a claim about historical accuracy, but as a vessel for values, relationships, or stances that transcend factual correction. Your term "anchor story" is strikingly apt, capturing how these narratives moor a community to something essential—even when the chain of fact has slipped. While no single established term perfectly encompasses all your cases, the closest conceptual fit lies at the intersection of **social functionalism in collective memory** and **moral truth**.

  The core phenomenon is this: **A narrative survives the demonstrable falsification of its specific historical details because it fulfills a non-historical function vital to the community’s present identity or moral order.** Crucially, this function cannot be transferred to a corrected version without loss. The community acknowledges the evidence but rejects its right to dismantle the narrative’s purpose. Your three examples beautifully illustrate distinct facets:

  1.  **The Mill Fire:** Here, the factual error (locked doors vs. inward-jamming) carries a **moral indictment**. The corrected detail doesn't absolve the owners' negligence; it merely shifts the mechanism. The community retains the narrative because its function is not to document *how* the deaths occurred, but *why* they were culpable—and to sustain a collective stance against exploitation. The historian’s correction, while factually true, was functionally irrelevant to the commemoration’s purpose. The corrected version *couldn't* serve as an equally potent ritual of moral solidarity.
  2.  **The Christmas Payments:** This exemplifies the **relational function**. The story isn’t primarily a chronicle of events in 1943; it’s the *charter myth* for an ongoing bond between families. The factual correction severs the story from its supposed historical origin, but not from its *effect*—the sustained act of reciprocity. The story persists because it encapsulates the *meaning* of the obligation, not its genesis. Saying "Grandfather didn’t hide him, but we send this because we value our connection" lacks the narrative weight and continuity the anchor story provides.
  3.  **The Quarry Massacre:** This case highlights the **epistemic protest function**. The community’s refusal to accept the archive’s silence as definitive wasn't stubbornness about *their* facts, but a profound skepticism about *whose facts count*. The institutional record’s authority was itself suspect. Their stance was less "This *did* happen" (though they believed it) and more "You *cannot* tell us this *didn't* happen based on your incomplete or compromised records." When vindicated, it affirmed not just the event, but the legitimacy of their resistance to institutional erasure.

  **Is this one phenomenon or two?** It’s a spectrum unified by the **functional persistence beyond factual disproof**, but with distinct emphases:
  *   **Commitment Anchors (Mill Fire, Christmas Payments):** Focus on sustaining internal values, relationships, or moral judgements. The inaccuracy is collateral; the core is the *lesson* or the *bond*.
  *   **Protest Anchors (Quarry Massacre):** Focus on contesting external authority over truth itself. The inaccuracy (if present) is less central than the *rejection of the adjudicating power*. The stance *is* the point.

  **The difference between vindicated and unvindicated protest:** The quarry case outcome doesn't change the *nature* of the phenomenon observed *before* the discovery. The community’s stance was identical: a rejection of institutional authority as the final arbiter. The discovery simply revealed their *epistemic defiance* was justified *in that instance*. The mill town’s stance *wasn't* vindicated by new facts about the doors, but their *moral defiance* remained functionally valid for them. The core phenomenon is the *stance* itself – the functional persistence – not the ultimate historical accuracy.

  **Boundaries – When does it stop being an "anchor story"?**
  1.  **Denial of Evidence:** If the community actively disputes the veracity of the disconfirming evidence itself (e.g., calling the insurance files forged, the enlistment records lies), it veers into simple denial or conspiracy theory, not functional persistence *despite* accepting the evidence.
  2.  **External Imposition:** If the inaccurate story is enforced by state power, propaganda, or an elite against the community’s will or knowledge, it’s propaganda or coercion, not a community-owned functional anchor.
  3.  **Tangible Harm to Named Individuals:** If the perpetuation of the inaccurate detail causes concrete, unjust harm to specific, identifiable living people (e.g., falsely accusing a named descendant of locking the doors, ruining their reputation or livelihood), the functional persistence is ethically compromised and crosses into defamation or scapegoating. The Mill Town narrative avoids this by focusing on systemic negligence, not naming specific living culprits.
  4.  **Loss of Function:** If the community *does* adopt the corrected version and finds it serves the same function equally well (e.g., commemorating negligence due to poor door design), it ceases to be an anchor story. Its persistence *despite* correction is key.
  5.  **Pure Convenience/Comfort:** If the narrative persists solely because the truth is inconvenient or uncomfortable, without sustaining a deeper value or relationship (e.g., ignoring a minor historical error because it’s too much trouble to correct), it’s closer to apathy or laziness.

  **In essence, you have identified a powerful form of communal wisdom:** narratives that carry truths deeper than the sum of their factual parts. They are **Functional Truths** or **Moral Charters**, held fast by communities precisely because they anchor something indispensable—a shared ethic, a web of obligation, or a defiant claim to their own voice—in a way that bare, corrected facts cannot replicate. Your "anchor story" captures this beautifully. It acknowledges the factual slippage while honoring the weight the narrative continues to bear, holding the community fast against currents of mere historical record.
