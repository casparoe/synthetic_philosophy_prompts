prompt: |-
  I direct a small research program at a philanthropic institute, and I have to settle its agenda for the next three years: about six researchers, mostly philosophers with a couple of decision theorists, and no empirical work of our own beyond reanalysis of data that already exists. The program exists because the institute's allocators have to make real-time trade-offs across beneficiaries of very different kinds — people in different societies with different reporting conventions, animals whose evidence base is behavioural rather than testimonial, and, in the background, the possibility that some future beneficiaries will be systems whose architecture makes both of those evidence sources unavailable. The output is supposed to be a comparison protocol: a documented procedure that takes noisy, heterogeneous evidence about well-being and returns something an allocator can rank, together with an honest statement of what the procedure assumes.

  Two constraints have been imposed from above and are not negotiable. First, the protocol must be neutral across the main substantive accounts of welfare: it may not presuppose that well-being consists in valenced conscious experience, or in the satisfaction of preferences, or in the instantiation of some objective list. Second, it may not assume full comparability, in the sense of a common zero together with a common unit; the trustees regard that as the assumption that has done the most damage in past cost-benefit practice, and they want comparisons built up from weaker informational permits.

  Within those constraints I need a defended ordering, not a survey. Here are the questions I have been circling, so that you can reorder, merge, or reject them rather than reproduce them.

  First: whether the components of comparability really separate. As I understand the standard taxonomy, a common unit without a common zero still supports aggregations that trade gains against losses at fixed rates, but not rules that turn on where anyone sits relative to a shared zero; a common zero with only ordinal level comparisons supports maximin-shaped rules but not trade-off rates. If those components are separable, the program's central decision is which one to try to secure, and everything else follows. If every route to one secretly delivers the other, the decision is illusory and the whole shape of the agenda changes. I want that adjudicated.

  Second: the creation case. Comparisons that involve bringing a new being into existence require comparing a possible life against there being no subject at all, which is not a point on anyone's scale. Something has to play the role of a neutral level, and I am told that the choice of that level does as much work as the choice of a population principle — that it effectively determines whether the protocol displays repugnant-conclusion-shaped behaviour. Is fixing the neutral level part of the comparison problem at all, or is it a separate problem smuggled in under the same budget?

  Third: architectural diversity. For animals we lack self-report; for hypothetical future systems we may lack behaviour in the relevant sense too, and have only structural or functional facts. Is there a principled distinction between the evidence being bad and there being no fact of the matter, and can the protocol say which situation it is in without first settling which theory of welfare is true? If the neutrality constraint makes this question unanswerable in principle, say so and drop it rather than ranking it.

  Fourth: calibration of heterogeneous reports. Survey methodologists have vignette-based techniques for correcting the fact that different populations use scale endpoints differently. Is the philosophical residue here just applied measurement error, or does correcting differential scale use already presuppose the cross-population comparability that was supposed to be in question? I suspect a circularity, and I want to know whether it is benign.

  What I want back: three or four questions, ranked, and for each a statement of what makes it upstream — whose answers change depending on it — how tractable it is for the people I have in three years with no new data, how neglected it is by those working on adjacent problems, and what would move it up or down the list. Name the criteria you are using to weigh upstream-ness against tractability against neglectedness, and say where they conflict. Add an explicit not-doing list: one or two questions that look central in this area but that you would cut, with the reason — that the answer would not constrain the protocol, that it collapses into a verbal dispute, or that it is really a request for a theory of welfare. Finally, tell me which of my four questions are the same question in different words.
reasoning: |-
  Hmm, this user is directing a small research program at a philanthropic institute and needs to set a three-year agenda. They have six researchers, mostly philosophers and some decision theorists, focusing on creating a comparison protocol for allocators who need to make trade-offs across diverse beneficiaries: humans from different societies, animals, and potentially future artificial systems. The output must be a documented procedure that handles noisy, heterogeneous evidence about well-being and produces a rankable output, with clear assumptions.

  The non-negotiable constraints are interesting: neutrality across welfare theories (no favoring of conscious experience, preference satisfaction, or objective lists) and no assumption of full comparability (common zero and unit). Full comparability is explicitly rejected because of past damage in cost-benefit analysis. The user wants a defended ordering, not just a survey, and has listed four questions they're considering.

  I need to help them reorganize, merge, or reject these questions and prioritize them for the research agenda. The output should include a ranked list of three or four core questions, with assessments of upstream-ness, tractability, neglectedness, and factors that could shift their priority. I also need to identify any questions that are essentially the same and suggest a "not-doing" list with reasons.

  Looking at the user's questions:

  1. Separability of comparability components: They're asking whether the components (common unit and common zero) are separable. If they are, choosing which to prioritize shapes the whole agenda; if not, the decision is moot.

  2. The creation case: This involves comparing existence to non-existence, which requires a neutral level and ties into population ethics issues like the repugnant conclusion. The question is whether this is part of the comparison problem or a distinct issue.

  3. Architectural diversity: How to handle cases where evidence is scarce or absent (e.g., animals without self-report, future systems without behavior), and whether this is about bad evidence or no fact of the matter, given the neutrality constraint.

  4. Calibration of heterogeneous reports: Vignette techniques for cross-population scales, and whether they involve circularity by presupposing comparability.

  I notice that questions 1 and 2 might overlap because both touch on foundational aspects of comparability, while 3 and 4 deal more with evidence challenges. There's a tension here: the protocol must be neutral on welfare theories, but that neutrality might make it impossible to address some questions, like question 3 on architectural diversity, which could collapse into requiring a specific welfare theory.

  For prioritization, I'll consider:
  - Upstream-ness: How much does answering this question constrain or enable other parts of the protocol? High upstream-ness means it affects many downstream decisions.
  - Tractability: Can it be addressed in three years with the team's expertise and no new data? Philosophical analysis and decision theory rework should be feasible.
  - Neglectedness: Is this under-explored in existing literature? This adds value since the institute wants novel contributions.
  - Conflicts: For example, a highly upstream question might be intractable or too broad, requiring trade-offs.

  I think question 1 on separability is the most upstream because it determines the entire structure of the comparability approach. If the components aren't separable, the agenda simplifies dramatically. It's tractable with conceptual work and highly neglected, as most literature assumes full comparability or doesn't tease apart the components.

  Question 2 on the creation case is also upstream but less so than question 1; it affects population ethics aspects but not the core comparison method for existing beings. It's tractable but not as neglected, as there's more work on the neutral level in philosophy. It could be merged or sequenced after question 1.

  Question 4 on calibration has moderate upstream-ness because it affects how evidence is handled, but it's more applied. It's tractable with vignette methodology reanalysis and highly neglected in philosophical contexts. The circularity concern is key—if benign, it's useful; if vicious, it undermines the protocol.

  Question 3 on architectural diversity seems problematic. Given the neutrality constraint, distinguishing "bad evidence" from "no fact" likely requires committing to a welfare theory, which violates the first constraint. That makes it intractable and potentially a dead end. I'd recommend cutting it from the core agenda.

  For the "not-doing" list:
  - Question 3 should be cut because it violates neutrality and collapses into needing a welfare theory.
  - Also, avoid questions that directly tackle the "best" welfare theory, as that's excluded by the constraints.

  Finally, I'll check for duplicates: Question 1 and 2 are distinct, but question 2 might depend on insights from question 1. Question 4 stands alone on evidence calibration.

  The user seems highly competent—they're thinking deeply about trade-offs and constraints. Their unspoken need might be to avoid wasted effort on intractable problems and to produce a practical protocol that allocators can actually use, even if imperfect. I should emphasize defensible ordering over perfectionism.
answer: |-
  Based on your constraints, goals, and resources, here is a prioritized research agenda structured around four reorganized core questions. I’ve merged, reframed, or dropped your original questions to avoid duplication, respect neutrality, and maximize impact within three years. The ranking balances **upstream-ness** (how many downstream protocol decisions depend on resolving this), **tractability** (feasibility with your team/existing data), **neglectedness** (gap in current literature), and **constraint-alignment** (avoiding welfare-theory dependence). Conflicts between criteria are noted explicitly.

  ### Core Questions (Ranked)
  1. **Are the components of comparability (common unit vs. common zero) separable, and what minimal structure does this imply for aggregation?**  
     - **Upstream-ness (High):** This is the *most* upstream question. If components are inseparable, your protocol must treat comparability as binary (all-or-nothing), radically simplifying the agenda. If separable, you must choose which to prioritize (e.g., common unit for trade-offs vs. common zero for thresholds). This decision shapes *every* aspect of evidence handling, aggregation rules, and population ethics.  
     - **Tractability (High):** Pure conceptual work by philosophers/decision theorists. Requires reanalyzing formal literature (e.g., Bossert, Weymark; Fleurbaey’s non-cardinal approaches) and simulating implications with existing data. No new empirical work needed.  
     - **Neglectedness (High):** Most comparability debates assume full comparability or focus on ordinality. The *separability* of zero/unit is underexplored, especially under neutrality constraints.  
     - **Priority shifters:**  
       - ↑ If initial analysis reveals inseparability (collapsing the agenda).  
       - ↓ If separability is proven but intractable to operationalize neutrally.  

  2. **Can a "neutral level" for existence/non-existence comparisons be defined independently of welfare theories, and does it determine population-ethical behavior?**  
     - **Upstream-ness (High):** Directly affects how the protocol handles creation/population cases (e.g., repugnant conclusions). If a theory-neutral neutral level is impossible, population ethics must be excluded or severely restricted. If possible, it constrades aggregation rules (e.g., critical-level utilitarianism).  
     - **Tractability (Medium):** Conceptual work leveraging decision theory (e.g., Broome’s *Weighing Lives*) and reanalysis of demographic/happiness datasets to test robustness. Team’s strength in philosophy is ideal.  
     - **Neglectedness (Medium):** Neutral levels are debated, but rarely under strict *neutrality* across welfare theories. Animal/future-being implications are underexplored.  
     - **Priority shifters:**  
       - ↑ If Q1 reveals comparability components are separable (making neutral levels more salient).  
       - ↓ If Q1 shows inseparability, making this secondary.  

  3. **Does calibrating heterogeneous evidence (e.g., vignette adjustments) presuppose comparability, and if so, is the circularity benign?**  
     - **Upstream-ness (Medium):** Affects evidence-input design. If circularity is vicious, calibration tools (e.g., anchoring vignettes) are unusable, forcing reliance on ordinal or non-relative measures. If benign, it enables cross-population data integration.  
     - **Tractability (High):** Reanalysis of existing calibration studies (e.g., World Happiness Report vignettes) by decision theorists. Team can model "circularity" as a fixed-point problem.  
     - **Neglectedness (High):** Methodologists ignore philosophical circularity; philosophers ignore calibration techniques. Your neutrality constraint makes this gap critical.  
     - **Priority shifters:**  
       - ↑ If Q1/Q2 point toward trade-off rules (requiring calibrated units).  
       - ↓ If early results show circularity is unresolvable neutrally.  

  4. **Under which conditions can structural/functional evidence (e.g., for animals/future systems) be treated as indicative of well-being without presupposing a welfare theory?**  
     - **Upstream-ness (Low-Medium):** Affects evidence inputs for non-human beneficiaries but assumes comparability foundations (from Q1-3) are settled. Less urgent than core aggregation questions.  
     - **Tractability (Medium):** Conceptual analysis of "proxy" evidence (e.g., animal neurophysiology vs. AI system goals), using existing behavioral/neuroscientific datasets.  
     - **Neglectedness (High):** Architectural diversity is rarely addressed neutrally; literature defaults to theory-laden approaches (e.g., sentientism for animals).  
     - **Priority shifters:**  
       - ↑ If Q1-3 resolve quickly, or if trustees prioritize non-human beneficiaries.  
       - ↓ If Q1-3 reveal incomparability, making this moot.  

  ### Conflicts Between Criteria
  - **Upstream-ness vs. Tractability:** Q1 is maximally upstream but tractable; Q4 is less upstream but risks intractability under neutrality. Resolution: Prioritize Q1 precisely *because* it’s tractable and upstream—resolving it early avoids wasted effort.  
  - **Neglectedness vs. Tractability:** Highly neglected questions (e.g., Q3) may lack literature to reanalyze. Resolution: Use computational modeling (e.g., simulations of circularity) to compensate.  
  - **Constraint-alignment vs. Upstream-ness:** Key questions (e.g., architectural diversity) may be upstream but violate neutrality. Resolution: Demote or drop them (see *Not-Doing List*).  

  ### Not-Doing List
  1. **"Is there a fact of the matter about well-being for entities with scarce evidence (e.g., animals/future systems)?"** (Original Q3)  
     - **Reason:** Collapses into a theory of welfare. Your neutrality constraint forbids presupposing any account (e.g., whether behavior suffices for preferences or consciousness). Answering this requires endorsing a welfare theory—violating your first non-negotiable.  
  2. **"What is the optimal population principle?"**  
     - **Reason:** Requires a substantive welfare theory and full comparability. The "repugnant conclusion" debate (raised in your Q2) depends on whether a neutral level exists—but *choosing* a principle (e.g., total vs. average utilitarianism) demands theory-laden assumptions. Focus instead on whether *any* principle can operate neutrally (Q2).  

  ### Question Correspondence
  - Your **Q1 (separability)** and **Q2 (creation case)** are distinct but sequential. Q1 is foundational; Q2 depends on it.  
  - Your **Q4 (calibration circularity)** is retained as **Q3** here.  
  - Your **Q3 (architectural diversity)** is partially absorbed into **Q4** but demoted due to neutrality conflicts. Its core concern—"bad evidence vs. no fact"—is **cut entirely** (as it presupposes a welfare theory).  

  ### Recommended Agenda Structure
  - **Year 1:** Tackle Q1 (separability) + Q3 (calibration circularity). These are tractable and resolve foundational/evidence-input uncertainty.  
  - **Year 2:** Address Q2 (neutral level for existence cases), leveraging Year 1 results.  
  - **Year 3:** Refine protocol design + explore Q4 (architectural evidence) if resources allow.  

  This maximizes defensible output: By Year 3, you’ll have a protocol that either (1) operates under minimal comparability assumptions (if components are separable), (2) excludes incommensurable cases (if not), and (3) transparently handles evidence calibration—all while respecting neutrality.
