  Below is a complete session plan designed for your reading group. It includes rules, materials, a minute-by-minute timeline, debriefing guide, and handling of predictable issues. The design focuses on experiential learning, avoids upfront theory, and incorporates your constraints (no personal financial risk, hard payout ceiling, no early use of technical terms). The budget assumes a $500 cap on payouts (using book voucher units) and a $100 voucher pool.

  ---

  ### **Session Plan: St. Petersburg Game Exploration**  
  **Duration:** 90 minutes  
  **Participants:** 15–16 non-philosophers, mostly retired  
  **Materials:**  
  - Sealed envelopes containing pre-generated coin-toss sequences (50+ sequences, each showing tosses until first heads, e.g., "T, T, H" for payout at n=3).  
  - Random number generator (digital) or pre-drawn numbers in envelopes for pricing.  
  - Projector + screen (for instructions, bids, and results).  
  - Paper, pens, and bid-collection bowls for each table.  
  - Book vouchers (total budget: $100; max payout per game: $500).  
  - Timer.  

  **Key Rules:**  
  - **Game definition:** A fair coin is tossed until first heads. Payout = min(\(2^n\), 500) voucher units, where \(n\) is the toss number of the first heads (e.g., heads on 1st toss: $2; 2nd: $4; 3rd: $8; ... 9th or later: $500).  
  - **No personal risk:** All transactions use book vouchers from the session budget.  
  - **Randomness:** Envelopes contain pre-generated sequences (auditable; participants can verify post-session).  

  ---

  ### **Timeline (90 Minutes)**  

  #### **0–10 min: Setup and Rules (No Theory)**  
  - **Facilitator script:**  
    *"We’re going to play a simple coin-toss game today. Here’s how it works: I have envelopes with coin-toss results. We’ll open one to see when the first 'heads' appears. If heads is on the first toss, you win $2; on the second, $4; third, $8, and so on—doubling each time. But we’re capping payouts at $500 (e.g., heads on the 9th toss or later pays $500). We’ll do three rounds of bidding—you’ll decide what this game is worth to you. Important: No jargon, no math yet. We’ll discuss the ‘why’ at the end."*  
  - **Actions:**  
    - Project game rules and payout examples.  
    - Distribute paper/pens. Assign tables (4 people/table).  
    - Emphasize: *"Base bids on what you genuinely think the game is worth."*  

  #### **10–25 min: Round 1 – Private Truthful Bidding (One Play)**  
  - **Goal:** Elicit genuine valuations using the BDM mechanism (truth-revealing).  
  - **Procedure:**  
    1. *"Write down the maximum amount you’d pay for one play (between $0 and $100). Use decimals if needed. Fold and place in your table’s bowl."*  
    2. Collect bowls. Explain BDM:  
       *"We’ll randomly pick one bidder. A random price (between $0–$100) will be drawn. If your bid is ≥ this price, you buy the game at that price and play. If lower, you don’t play. So, your best strategy is to bid exactly what it’s worth to you."*  
    3. Randomly select one participant (e.g., draw a name).  
    4. Draw a random price (e.g., use a number generator; display it).  
    5. If the selected bidder’s bid ≥ drawn price:  
       - They "pay" the drawn price (deducted from vouchers).  
       - Open a random envelope, calculate payout, and pay them net winnings (payout minus price; min $0).  
    6. Record the bid, price, and outcome.  
  - **Budget note:** Max cost = $500 payout + $0 price = $500 (rare).  

  #### **25–45 min: Round 2 – Open Group Bidding (One Play)**  
  - **Goal:** Observe anchoring and group dynamics in open auctions.  
  - **Procedure:**  
    1. *"Discuss with your table: What would your group pay for one play? Write one group bid."* (5 min).  
    2. Project all group bids (e.g., Table 1: $X; Table 2: $Y).  
    3. *"Now, as a whole group, bid openly for one play. I’ll start at $0. Raise bids in $1+ increments. Highest bid wins."*  
    4. Run auction (5 min). Winning group:  
       - Pays their bid (vouchers).  
       - Opens an envelope and receives payout (net winnings).  
    5. Record winning bid and outcome.  
  - **Mitigating anchoring:** Start auction at $0 (not at group bids) to reduce bias from early numbers.  

  #### **45–60 min: Round 3 – Pricing Ten Plays**  
  - **Goal:** Contrast single-play vs. repeated-play valuations.  
  - **Procedure:**  
    1. *"Now, what would you pay for the right to play ten times? Each play is independent—winnings add up. Write privately."*  
    2. Collect bids (no BDM; hypothetical).  
    3. Ask coarser question while they write:  
       *"Imagine you’re playing and see tails repeatedly. After how many tails would you doubt the coin, bank, or setup? Write a number (e.g., 10? 20?)."*  
    4. Collect "doubt thresholds."  

  #### **60–70 min: Group Discussion on Doubting**  
  - **Goal:** Surface model-validity concerns.  
  - **Procedure:**  
    1. Tally "doubt thresholds" on projector (e.g., "How many said 5 tails? 10? 15? 20+?").  
    2. *"Share why you picked your number."* (3–4 volunteers).  
    3. Record key reasons (e.g., "Coin seems rigged," "Bank can’t pay").  

  #### **70–90 min: Debrief – Diagnosing the "Difficulty"**  
  - **Do not say "paradox" until minute 75.**  
  - **Structure:**  
    1. **Expected value computation (5 min):**  
       - Project: \(\text{EV} = \frac{1}{2} \times 2 + \frac{1}{4} \times 4 + \frac{1}{8} \times 8 + \cdots = 1 + 1 + 1 + \cdots = \infty\).  
       - *"This sum diverges—no finite number bounds it. But our capped version has a finite EV (~$10)."*  
       - Show capped EV: \(\sum_{n=1}^{8} 1 + \sum_{n=9}^{\infty} \frac{500}{2^n} \approx 8 + 1.95 = \$9.95\).  
    2. **Map activity to diagnoses (10 min):**  
       - **Diminishing marginal utility (money):** *"In Round 1, most bids were low (e.g., $5–$20), but EV is $10+ even capped. Why? An extra $500 may not feel 250× better than $2 to you."*  
       - **Bank’s inability to pay:** *"Our cap was $500—you knew truly huge payouts were impossible. In the uncapped game, the bank couldn’t pay \(2^{20}\) = $1M+ either."*  
       - **Small-probability mishandling:** *"Did you ignore 10+ tails scenarios? People often undervalue tiny probabilities (e.g., 1 in 1,024 for $500)."*  
       - **Single vs. repeated play:** *"Round 3 bids for ten plays likely averaged less than 10× your Round 1 bids. Why? Heavy-tailed distributions don’t average out safely (one bad run skews everything)."*  
       - **Model validity (key focus):** *"Your ‘doubt thresholds’ (often 10–20 tails) show you don’t trust the model long-term. In science, divergent sums signal model breakdown—here, fairness or payment assumptions fail."*  
    3. **Distinguishable vs. identical predictions (5 min):**  
       - **Testable in session:**  
         - Bank inability (bids capped near $500) vs. model validity (low "doubt thresholds").  
         - Single vs. repeated play (Round 3 bids < 10× Round 1 bids supports heavy-tail risk).  
       - **Not distinguishable:**  
         - Diminishing utility vs. small-probability mishandling (both predict low bids; identical here).  
         - Anchoring (e.g., Round 2 bids clustered near first offer) is observable but confounds other effects.  
    4. **Conclusion (3 min):**  
       - *"Why does EV diverge? Payouts grow faster than probabilities shrink. Why not bid infinity? Because real-world constraints (utility, bank limits, model breaks) override the math."*  
       - *"One-sentence insight: ‘The expected value is infinite, but I bid low because the game breaks reality.’"*  

  ---

  ### **Predictable Problems and Mitigation**  
  1. **Prior knowledge leaks:**  
     - **Problem:** Someone declares "This is the St. Petersburg paradox!" early.  
     - **Absorption:** In intro, say: *"If you’ve seen this, help others discover it fresh—save insights for debrief."* If leaked, respond: *"Let’s test that idea empirically first."* Record the point; credit it in debrief.  

  2. **Joker bids:**  
     - **Problem:** A participant bids $100 (full budget) as a joke.  
     - **Absorption:**  
       - Round 1: BDM incentivizes truth-telling (overbidding risks loss at random price). If a joker wins, they may lose vouchers (e.g., bid $100, price $80, payout $2 → net -$78). Use as object lesson: *"Bidding beyond true value risks regret."*  
       - Round 2: Group discussion usually tempers extreme bids. If not, winning group may "win" a net loss (e.g., bid $50, payout $4). Highlight in debrief: *"Anchoring or jokes can distort open bids."*  

  3. **Anchoring in open bidding:**  
     - **Problem:** First bid in Round 2 sets group expectations.  
     - **Absorption:** Start auction at $0 (not at table bids) to reset anchors. Note clustering in debrief: *"Early bids influenced others—a common behavioral pitfall."*  

  4. **Unreproducible element:**  
     - **Unbounded payout:** Physically impossible.  
     - **Mitigation:** Explicitly state in debrief: *"Our $500 cap is artificial. The real game’s unbounded payouts force us to confront whether infinity means anything. Here, you saw how quickly distrust kicks in—that’s the core."*  

  ---

  ### **Facilitator Notes**  
  - **Budget control:** Max exposure = $500 (Round 1) + $500 (Round 2) = $1,000. With $100 voucher pool, reimburse net winnings post-session (use institute funds if negative).  
  - **Randomness audit:** Keep pre-generated sequences public post-session.  
  - **Outcome:** Participants leave able to articulate divergence and its practical irrelevance in one sentence (e.g., *"Payouts grow infinitely in expectation, but reality breaks before you benefit"*).  

  This plan prioritizes discovery, uses constraints pedagogically, and isolates key tensions. By embracing predictable issues, it turns them into teaching moments. Run it as-is; no prep needed beyond materials.
