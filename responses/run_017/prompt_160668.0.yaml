  - Outline the three rounds and the group discussion.

  **5-20 min: Round 1 - Private Bidding (One Play)**
  - Hand out paper: "Write your name and the maximum price (between $0 and $100) you would pay for one play of the game. Remember: this is the most you would pay. We will use a method that makes it in your best interest to tell the truth."
  - Collect the bids.
  - Open the envelope with the randomly selected participant number. Call out the participant's name.
  - Open the envelope with the random price P (drawn from [0,100]).
  - If the selected participant's bid is >= P, they play: they pay P (in vouchers) and we run the game (open a random toss sequence envelope, compute payout, and pay them). If bid < P, they do not play.
  - Record the outcome.

  **20-35 min: Round 2 - Open Bidding (One Play)**
  - Form four groups of four.
  - Groups have 5 minutes to discuss and write down their group bid for one play (on a card).
  - Bring groups together. Each group reveals their bid simultaneously (write on board).
  - Open auction: starting at the highest initial bid, groups can raise by at least $1. The auction runs until no group wants to raise. The highest bidder wins.
  - The winning group plays the game (open a random toss sequence envelope, compute payout). They do not pay the bid (because we cannot collect), but we record the bid and the payout. They receive the payout in vouchers.
  - Note: Explain that in a real auction they would have to pay the bid, but we are not collecting it. Ask them to bid as if they would have to pay.

  **35-50 min: Round 3 - Pricing Ten Plays**
  - Hand out paper: "What is the most you would pay for the right to play the game ten times? Each play is independent, and you get the payout for each play added up. Remember the cap applies to each play individually."
  - Collect the bids.

  **50-55 min: Group Discussion - Doubting the Setup**
  - "Imagine you are playing and the coin keeps coming up tails. After how many tails would you start to doubt the fairness of the coin, the bank's ability to pay, or the whole setup? Write down a number."
  - Then ask for a show of hands: 
      - "5 tails?" (count hands)
      - "10 tails?"
      - "15 tails?"
      - "20 tails?"
      - "More than 20?"
  - Note the distribution and ask for comments.

  **55-90 min: Debrief**
  1. Expected value computation without cap: show the infinite series (1+1+1+...). 
  2. With cap: compute the expected value (about $10). 
  3. Show the range of bids from Round 1 (anonymized: min, max, median). Discuss the selected participant's outcome. 
  4. Show group bids from Round 2 and the outcome. 
  5. For Round 3: compare the average per-play bid (bid_ten/10) to the Round 1 bids. 
  6. Discuss the reasons why bids are below the infinite expectation (and even below the capped $10?):
     - Budget cap ($500) -> bank's inability to pay huge amounts.
     - Model validity: the doubting threshold (from the group discussion) shows that people don't believe the model for very long tails.
     - Risk aversion: even with the cap, the game is risky (most of the time you get $2 or $4, but sometimes more). 
     - Repeated play: the ten-play bid might be less than 10 times the one-play bid? Or more? We can discuss.
  7. Other reasons (mention if not covered):
     - Diminishing marginal utility: but our amounts are moderate and in vouchers, so not likely the main factor.
     - Probability weighting: people might ignore the tiny probabilities of high payouts.
  8. Conclude: the expected value diverges in the original game because of the tiny probabilities of huge payouts. But that doesn't mean we should pay an infinite amount because of the reasons above.

  **What Could Go Wrong:**
  - Prior knowledge: If someone mentions the paradox early, thank them and ask to hold the discussion until the debrief.
  - Joker bids: In Round 1, the mechanism minimizes the effect (only one selected). In Round 2, if a group bids very high, they might win and then get a low payout. We can use that as a teaching moment: show that the expected value is $10, so bidding $100 is unwise.
  - Anchoring: Use simultaneous revelation in Round 2 to reduce anchoring.

  **What We Cannot Reproduce:**
  - The unbounded payout. We explain this in the debrief.

  **Goal:** Each participant can say: "The expected value diverges because the payouts grow without bound and the probabilities don't decrease fast enough, but I wouldn't pay a lot because the bank might not pay, the coin might not be fair, or I don't value the tiny chance of a huge payout."
