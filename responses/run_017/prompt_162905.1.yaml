    P(G|R) = [P(R|G)*P(G)] / [P(R|G)*P(G) + P(R|B)*P(B)] = (0.9 * 0.5) / (0.9*0.5 + 0.1*0.5) = 0.9, and similarly P(G|not R) = 0.1.
  - Each committee member i also receives a private signal: a research statement. The research statement for member i is either strong (S_i) or weak (W_i). However, due to an error, the research statements are generated in a way that is independent of the candidate's true quality and independent of R. Specifically, for each member, the research statement is strong with probability 0.4 and weak with probability 0.6, regardless of the candidate. So the private signal is pure noise and actually misleading on average because it is more likely to be weak (and thus might suggest a bad candidate) even when the candidate is good.

  Each committee member votes based on their own information: they see the common reference letters (R or not R) and their own research statement (S_i or W_i). They are naive and use a simple rule: they vote to hire if they see strong reference letters OR a strong research statement. Otherwise, they vote to reject.

