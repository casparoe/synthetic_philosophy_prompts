   After some research, I recall that the phenomenon is known and can occur with positively correlated votes. One way is to have a common cause that is not the state. For example, a shared evidence that is usually present but sometimes missing, and when it is missing, the voters rely on their private signals which are better.

  Example from: https://www.cambridge.org/core/journals/journal-of-law-economics-and-organization/article/abs/condorcet-jury-theorem-and-the-absence-of-weighting/ in the context of the Condorcet jury theorem with correlated votes.

  Here is a scenario that might work (inspired by that work):

   There is a hiring committee of 101 members. The candidate is either good (G) or bad (B), with prior 0.5.
   There is a key piece of evidence (like a pivotal project in the candidate's file) that is either present (E) or absent (not E). This evidence, if present, is very  informaative: if the candidate is good, then E is present with probability 0.99, and if bad, with probability 0.01. So P(E|G)=0.99, P(E|B)=0.01.

   However, due to a copying error, each committee member's copy of the file may or may not have this evidence. Specifically, for each member, independently, the evidence is present in their copy with probability p (say, 0.8) if the evidence exists in the master file, and with probability 0 if it doesn't. But wait, that doesn't make sense. Better: the master file either has the evidence (E) or not (not E). Then, for each member's copy, if the master has E, then the member's copy has it with probability q (high, say 0.95), else it is missing. If the master does not have E, then the member's copy never has it.

   Additionally, if the evidence is present in the member's copy, it is always correctly interpreted as evidence of goodness. If the evidence is absent in their copy, then the member relies on a private signal which is informative but weak: for a good candidate, the private signal is S (suggesting good) with probability 0.55, and for a bad candidate, with probability 0.45. 

   The member votes for hire if either they see the evidence in their copy or they get the private signal S.

  Now, let's compute the marginal competence of one voter.

  First, note: the master file has E or not E. But the state determines the distribution of E.

   P(E|G)=0.99, P(not E|G)=0.01
   P(E|B)=0.01, P(not E|B)=0.99

   For a given voter, conditional on the state and on the master file, the probability that they see the evidence in their copy:
     If the master file has E, then they see it with probability q=0.95.
     If the master file does not have E, then they never see it.

   If they see the evidence, they vote hire.
   If they don't see the evidence, then they use the private signal: vote hire if S.

  Given state G:
    - Master has E with prob 0.99. Then the voter sees evidence with prob 0.95 -> votes hire (correct). With prob 0.05, they don't see it, and then they vote hire if private signal S, which has P(S|G)=0.55.
    - Master has not E with prob 0.01. Then they never see the evidence, so they vote hire if they get S (0.55).

   So overall for state G:
     P(correct|G) = 
          P(E|G) * [0.95 * 1 + 0.05 * 0.55] + P(not E|G) * [0.55]
          = 0.99 * [0.95 + 0.05*0.55] + 0.01 * 0.55
          = 0.99 * [0.95 + 0.0275] + 0.0055
          = 0.99 * 0.9775 + 0.0055
