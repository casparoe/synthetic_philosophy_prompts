  We are going to create a scenario for a hiring committee. The committee is evaluating a large number of candidate dossiers. Each dossier has two components: (1) a set of reference letters that are seen by every committee member, and (2) a research statement that is unique to each committee member's copy of the dossier (due to a clerical error, each member gets a different version of the research statement). The reference letters are generally positive but not very informative. The research statements, however, are highly variable in quality. The true quality of the candidate is determined by the reference letters (which are a good signal) and the average quality of the research statements (which is also a good signal). However, each committee member only sees one research statement, which is a very noisy and biased signal.

  Setting: A hiring committee of 101 members (an odd number to avoid ties) is reviewing a candidate. The candidate is either good (G) or bad (B). The committee members vote for "hire" (if they think G) or "reject" (if they think B). The true state is G with prior 0.5 (so no prior bias).

