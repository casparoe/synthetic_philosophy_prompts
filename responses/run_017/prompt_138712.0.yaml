answer: |-
  Below is a diagnostic decision tree designed to address your requirements. It starts with the ultimacy requirement and routes students who reject it immediately out of the main path. The tree uses concrete cases to force self-awareness, incorporates your three key scenarios (closed loop, authored agent, unchosen attitude), and includes the generalization worry. Each internal node is a yes/no question about a case, phrased neutrally to avoid telegraphing positions. Leaves are labeled with positions (or "unnamed"), and include a brief note on their most awkward commitment. The legibility conception is evaluated as a distinct, unoccupied leaf.

  ### Decision Tree: Moral Responsibility After the Basic Argument
  **Start:** You grant that no agent can be the ultimate, self-originating source of her own character.  
  → **Node 1:** Do you also believe that *true moral responsibility* requires being the ultimate source of your character?  
  - **No:** Exit (labeled: **Ultimacy Rejector**). *You bypass the Basic Argument; your task is to defend why ultimacy isn’t needed.*  
  - **Yes:** Proceed to Node 2 (you accept the Basic Argument’s conclusion: no one is truly morally responsible).  

  → **Node 2 (Closed Loop):** Consider an agent whose deepest values were formed by a process she had no hand in, but who now reflects, unconditionally endorses these values, and acts on them—with the endorsement itself caused by those values. Despite lacking ultimacy, is she morally responsible for actions flowing from these values?  
  - **Yes:** Proceed to Node 3.  
  - **No:** Proceed to Node 4.  

  → **Node 3 (Authored Agent):** Consider an AI planning system (or cult-raised human) engineered by others to have specific dispositions. It now acts coherently, reasons-responsively, and "endorses" its actions. Is it morally responsible for those actions?  
  - **Yes:** Leaf: **Inconsistent Compatibilist**. *Awkward: You affirm responsibility in cases where ultimacy is explicitly absent, contradicting Node 1.*  
  - **No:** Leaf: **Unnamed (Endorsement-Only View)**. *Awkward: You allow responsibility in closed loops (Node 2) but not in functionally identical authored cases, with no clear distinction.*  

  → **Node 4 (Unchosen Attitude):** An agent spontaneously forms a contemptuous belief about someone, expressing her character. She didn’t choose the belief, but it reflects who she is. Is she morally responsible *for the belief itself* (not just actions)?  
  - **Yes:** Proceed to Node 5.  
  - **No:** Proceed to Node 6.  

  → **Node 5 (Attitude Responsibility):** In the unchosen attitude case, could the agent be *blamed* for her contempt (e.g., should she feel guilty for it)?  
  - **Yes:** Leaf: **Quality-of-Will/Answerability**. *Awkward: You ground blame in "expressive" attitudes, risking responsibility for involuntary thoughts if they reflect the agent.*  
  - **No:** Leaf: **Unnamed (Action-Restricted View)**. *Awkward: You permit responsibility for attitude-expression (Node 4) but deny blame, divorcing responsibility from accountability.*  

  → **Node 6 (Generalization Worry):** Does the Basic Argument’s conclusion—no true moral responsibility—undermine *only* desert-based responsibility, or *also* concepts like authorship, epistemic credit, and demanding reasons from others?  
  - **Only desert:** Proceed to Node 7.  
  - **Also other concepts:** Proceed to Node 8.  

  → **Node 7 (Non-Desert Practices):** Should we retain practices like blaming/praising, demanding reasons, or treating agents as "authors" of acts, even without desert?  
  - **Yes:** Proceed to Node 9.  
  - **No:** Leaf: **Eliminativist**. *Awkward: You drop all responsibility practices, despite their social utility, risking normlessness.*  

  → **Node 8 (Overgeneralization):** If the argument undermines *all* responsibility concepts (e.g., we can’t demand reasons without ultimacy), is this a fatal flaw ("proves too much")?  
  - **Yes:** Leaf: **Generalization Reductio**. *Awkward: You reject the Basic Argument via reductio but offer no positive account.*  
  - **No:** Leaf: **Strawson’s View**. *Awkward: You keep reactive attitudes (e.g., resentment) as ineliminable, despite admitting they’re objectively unjustified.*  

  → **Node 9 (Basis for Practices):** Can holding agents responsible be justified *without* desert, purely by its role in social coordination (e.g., influencing future behavior or fostering community understanding)?  
  - **Yes, via forward-looking goals:** Leaf: **Revisionist**. *Awkward: You defend existing practices with new justifications, potentially misrepresenting everyday motives.*  
  - **Yes, via mutual intelligibility:** Leaf: **Legibility Conception**. *Awkward: You reduce responsibility to "making the will legible," but this may collapse into answerability or revisionism.*  
  - **No, but practices persist:** Leaf: **Strawson’s View** (reached via this path). *Awkward: Same as above.*  

  ---

  ### Key Features & Annotations
  1. **Legibility Conception**: Marked as **unnamed/unoccupied**. It collapses into **answerability** (if "intelligibility" demands reasons) or **revisionism** (if justified socially). No major theorist holds this distinctly; it’s redundant with existing categories.  
  2. **Unnamed/Unoccupied Leaves**:  
     - **Endorsement-Only View** (Node 3→No): Incoherent. Distinguishing closed-loop endorsement from authored agents requires arbitrary criteria (e.g., "internal" vs. "external" origins), which doesn’t resolve ultimacy.  
     - **Action-Restricted View** (Node 5→No): Unattractive. It allows responsibility for attitudes as "expressions" but denies blame, creating a responsibility void.  
     - **Attitude Responsibility + Only Desert** (Node 4→Yes + Node 6→Only desert): Unexplored. Theorists who ground responsibility in unchosen attitudes (e.g., some expressivists) usually generalize beyond desert.  
  3. **Indistinguishable Leaves**:  
     - **Strawson’s View** appears in two paths (Node 8→No and Node 9→No). Both emphasize ineliminable attitudes without desert.  
     - **Revisionist** and **Legibility** might converge if "social coordination" includes "intelligibility," but the tree separates them to test distinct justifications.  
  4. **Three Required Cases**:  
     - Closed Loop (Node 2) tests if endorsement alone salvages responsibility.  
     - Authored Agent (Node 3) probes whether external origins undermine reasons-responsiveness.  
     - Unchosen Attitude (Node 4) isolates responsibility for non-volitional states.  
  5. **Generalization Worry** (Node 6) splits "desert-only" exits from broader skepticism.  

  This tree forces students to confront inconsistencies (e.g., affirming responsibility in closed loops but not authored agents) and maps intuitions to named positions. It fits a 10-minute solo exercise, with all cases and leaves covered.
