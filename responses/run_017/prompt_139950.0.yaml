prompt: |-
  I'm in a philosophy of psychiatry reading group (about half clinicians, two philosophers, me somewhere in between) and we did Hacking's "looping effects of human kinds" paper a few weeks back, and I've been arguing about it with a friend who's a clinical psychologist ever since. Her line is that looping effects just make psychiatric kinds *moving targets*: annoying if you want stable prevalence estimates over time or a clean replication of an old study, but not a deep threat to validity, because you can in principle re-validate your instruments each time the kind drifts. My hunch is that something worse is going on with at least some categories — that the feedback doesn't merely move the target but is partly constitutive of what it is to be an instance of the kind, so that for those categories there's no target sitting there, independent of the classification, for the criteria to be more or less accurate about. But I can't get the two ideas apart cleanly, and I suspect I'm conflating "the extension keeps changing" with "there's no fact of the matter about the boundary."

  So: explain the conceptual difference I'm groping at. Specifically, I want to understand what's at stake in the step from *instability* (the set of people who fall under the category, or how they present, shifts in response to the classification) to something like *co-constitution* (what it is to be an instance of the category is itself partly shaped by the classification, so that talk of the "real" prevalence or of the criteria carving nature at the joints stops having a clear sense). Is that second claim actually distinct from the first, or does it collapse back into it once you're careful? And does it matter for this that looping seems to work through at least three seperate channels — people's presentations changing, who shows up in the clinic and how they describe themselves, and the experts' own concepts revisions feeding back into the next edition of the manual — or is one of those doing all the real work? Hacking's own examples (child abuse, homosexuality, teenage pregnancy, multiple personality) are all ones where the kind is picked out by self-report and social description, and I can't tell how much of his argument is supposed to carry over when the criteria are defintately not self-report-based.

  Here's the bit where I need the most help, and where my friend and I invented our own vocabulary, so don't expect these terms to be standard. She proposed what she calls "sealed criteria": define a category only over signals the subject can't introspect and can't steer — actigraphy-measured sleep fragmentation, inflammatory markers, speech-timing features — on the grounds that if there's no channel from the classification back to the measurement, there's no loop. I pointed out that the loop just relocates instead of vanishing: people titrate their behaviour to hit the marker (all-nighters before the actigraphy week, stimulants, deliberate sleep restriction) and clinicians' thresholds drift as the measured distribution shifts, so you've moved the feedback one level out rather than removed it. Her fallback was a "naivety clause": the diagnosis requires that the presentation not be substantially shaped by the subject's own knowledge of the category. I think that's either incoherent or much more committal than it looks — it seems to presuppose a presentation that the classification hasn't touched, i.e. exactly the pre-classificatory target whose existence was the thing in dispute — but I can't say exactly why, or whether the incoherence is fatal or just makes the clause a rough practical heuristic. There's also what I've started calling "loop-aversion": people who've read about looping and medicalization deliberately avoid the label, which changes presentations again in the opposite direction, and I don't know whether to treat that as a further order of the same effect or as something that could in principle settle the kind down. Please say which of these, if any, is a stable resting point, and what it would mean for a category to explicitly build its own looping into its criteria (a criterion that predicts and expects presentations to be shaped by diagnostic awareness) — is that self-fulfilling, self-defeating, or just honest? Lead with your bottom line in the very first sentence — the actual claim about what looping effects do and don't threaten — then give me the reasoning under it; no preamble and don't restate my question back at me.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're in a philosophy of psychiatry reading group discussing Hacking's looping effects. Their main struggle is distinguishing between two ideas: whether looping effects just make psychiatric categories moving targets (instability) or if they co-constitute the categories themselves, meaning there's no independent target to validate against. The user feels these concepts are conflated but can't articulate the difference clearly.

  First, I need to recall Hacking's core argument. Looping effects occur when classifying humans changes their self-perception and behavior, altering the very category being studied. The user’s friend, a clinical psychologist, sees this as a practical issue—recalibrate instruments as categories drift. But the user suspects something deeper: that co-constitution undermines the idea of a pre-existing natural kind.

  The key distinction here is ontological vs. epistemological instability. Moving targets imply that the category exists independently but shifts, so validity can be reassessed. Co-constitution means the category's essence depends on the classification process—there's no stable essence to validate. For example, in ADHD, diagnostic awareness changes how symptoms manifest, affecting what counts as ADHD itself.

  The user also asks about different channels of looping: presentation changes, clinical populations, and expert revisions. Hacking’s examples like multiple personality disorder rely heavily on self-report, but what about biomarkers? The sealed criteria idea (using objective markers) attempts to bypass looping. But the user rightly points out that behavior adapts (e.g., all-nighters before actigraphy), relocating the loop. The naivety clause requiring no knowledge of the diagnosis seems circular—it assumes a pre-classification state that looping challenges.

  Loop-aversion, where people avoid labels, adds complexity. It might stabilize categories by reducing overdiagnosis but could also mask genuine cases. Building looping into criteria (e.g., expecting symptom shifts due to awareness) might be honest but risks pathologizing normal reactions.

  The user's deeper needs seem to be: clarifying the philosophical stakes for psychiatric validity, addressing practical diagnostic challenges, and resolving their debate. They need clear concepts to articulate why co-constitution is a deeper threat than instability. They might also seek implications for clinical practice—how to approach diagnosis knowing looping exists.

  I should emphasize that sealed criteria and naivety clauses don’t escape looping; they shift it. The core issue is that human kinds are interactive, unlike inert natural kinds. Validity in psychiatry must account for this interactivity, perhaps through iterative frameworks rather than static categories. The takeaway: looping isn’t just a nuisance; it questions the possibility of objective psychiatric facts independent of societal and diagnostic influences.
answer: |-
  **Bottom line: Looping effects threaten the *ontological stability* of psychiatric kinds, not just their *epistemic accessibility*, implying that for some categories, there is no pre-classificatory "fact of the matter" for instruments to track, even approximately, rendering traditional validity claims incoherent.**

  Here's the reasoning and unpacking of your points:

  1.  **Instability vs. Co-constitution: The Core Distinction**
      *   **Instability ("Moving Target"):** The pre-existing natural kind boundary exists but shifts location over time due to feedback. Validity is preserved *in principle* because instruments can be re-calibrated to track the *new* location of the same underlying target. Prevalence changes reflect shifts in the *population* relative to a *fixed* (if hidden) essence. ("The disease is the same, but more/less people have it or it looks different now.")
      *   **Co-constitution ("No Independent Target"):** The feedback mechanisms (self-understanding, behavioral adaptation, clinical practice, social consequences) are *part of what defines the kind itself*. There is no stable, underlying essence or natural boundary independent of the classificatory system and its effects. The "kind" is an emergent, interactive product. Prevalence estimates and criterion validation become circular: you're validating the criteria against a phenomenon whose very nature is shaped *by* those criteria and their application. ("What it *means* to have this 'disorder' now incorporates the fact that people know about the diagnosis and react to it.")

  2.  **Why Co-constitution is Distinct and More Threatening**
      *   Instability assumes a natural kind model (Kripke/Putnam) where the kind has essential properties discoverable by science, even if messy. Co-constitution aligns with social constructionist or interactive kinds models (Hacking's point) where the kind *lacks* such an independent essence. The threat isn't just to reliable measurement *over time*, but to the very idea that the classification corresponds to a *mind-independent natural category* waiting to be discovered. "Carving nature at the joints" presupposes nature *has* stable joints in this domain; co-constitution suggests the joints are being *made* by the carving process.

  3.  **Channels of Looping Matter (But Don't Save Validity)**
      *   All three channels (presentation change, clinical population shift, expert revision) contribute to co-constitution. Focusing *only* on self-report-based examples (like Hacking often does) can make looping seem contingent. However, the core mechanism is *reactivity*: human subjects interpret and respond to being classified.
      *   **Non-Self-Report Criteria Don't Escape:**
          *   **Biomarkers:** While the marker itself (e.g., cytokine level) might be "objective," its *elevation to diagnostic significance* and the *behavioral context* leading to measurement are reactive. People *do* manipulate behavior to hit thresholds (as you note with actigraphy). Clinicians *do* reinterpret biomarker relevance based on shifting populations and treatment responses (e.g., cholesterol thresholds). The *meaning* of the biomarker *as a sign of disorder* is shaped by the classificatory system and its social embedding.
          *   **Expert Revision:** This isn't just refining knowledge of a fixed target; it's actively reshaping the target based on how the *previous* classification played out in the world (treatment failures, unexpected comorbidities, social consequences).

  4.  **Evaluating "Sealed Criteria" and the "Naivety Clause"**
      *   **Sealed Criteria (Biomarkers):** As you argued, the loop relocates, it doesn't vanish. The behavioral context *producing* the biomarker value is inherently reactive. Defining a disorder *solely* by a biomarker risks creating a category detached from the lived experience and suffering it's meant to capture, raising its own validity questions (is elevated cytokine X *without* distress/impairment a *psychiatric disorder*?).
      *   **Naivety Clause:** This **is incoherent within a looping framework** and reveals the problem.
          *   It presupposes a "pure," untainted presentation exists independently of the classification – the very thing co-constitution denies. How could you ever verify the "naivety"? Knowledge of categories is pervasive in modern society.
          *   It attempts to define the category *in opposition to* the effects of its own existence, creating a logical paradox. The clause itself becomes a reactive element shaping presentations (people actively hiding their knowledge).
          *   At best, it's a *heuristic* for managing reactivity in research, not a solution to the ontological challenge. It implicitly acknowledges the constitutive role of knowledge but tries to wish it away.

  5.  **Loop-Aversion and Self-Built Looping**
      *   **Loop-Aversion:** This is a higher-order looping effect. It demonstrates reactivity just as much as seeking the diagnosis. It *could* stabilize prevalence artificially (by suppressing help-seeking) or destabilize it (if aversion leads to different, perhaps more severe presentations later). It doesn't resolve the co-constitution issue; it just changes the direction of the feedback.
      *   **Building Looping into Criteria (e.g., "symptoms shaped by diagnostic awareness"):** This is **honest but radically transformative**.
          *   It explicitly acknowledges co-constitution, abandoning the natural kind aspiration.
          *   It risks pathologizing normal reactivity (e.g., anxiety about being ill after googling symptoms) or creating self-fulfilling prophecies ("You have X, and part of having X is that you worry about having X").
          *   It shifts validity towards coherence within a self-referential system or pragmatic utility, away from correspondence to an independent reality. It might be "honest" but makes the category even more clearly an interactive kind, not a discovered natural entity.

  **Conclusion:** Your hunch is correct. Looping effects, especially through the channels of behavioral adaptation and expert revision in response to the classification's societal impact, can move beyond mere instability to co-constitution. This undermines the foundational assumption of psychiatric validity for some categories: that there exists a stable, mind-independent phenomenon for our criteria to correspond *to*. "Sealed criteria" relocate the loop, and the "naivety clause" is incoherent because it presupposes the pre-classificatory state whose existence is in doubt. Building looping in explicitly accepts co-constitution but abandons natural kind realism. The core threat is ontological, not merely epistemic.
