  ## Institute for Long-Term Civilizational Studies (ILTCS)  
  **Policy Scoping Paper: LTCS-PSP-2024-07**  
  **Title: Neolithic Reversal Pilot: Scoping Parameters for Affluence Reclamation in the Lower Tarn Valley**  
  **Date: 15 November 2024**  
  **Classification: DRAFT – FOR COMMISSIONING CONSIDERATION**

  **Executive Summary:**  
  This scoping paper outlines a proposed pilot intervention, the Neolithic Reversal (NR) Pilot, premised on emerging reassessments of the Neolithic Transition’s socioeconomic consequences. Evidence suggests pre-agricultural societies exhibited higher aggregate well-being across specific metrics related to labour intensity, dietary diversity, and wealth dispersion, prior to the establishment of storable surplus and its attendant institutional structures. The pilot seeks to empirically test the viability of reclaiming these baseline conditions within a defined geographical area – the Lower Tarn Valley (LTV) – over a ten-year horizon. Key findings indicate:

  1.  **Theoretical Basis:** Pre-agricultural "affluence" (defined by low necessary labour inputs for need satisfaction, broad dietary access, and minimal material wealth dispersion) presents a compelling counter-narrative to standard civilizational progress models.
  2.  **Spatial Feasibility:** The LTV (Area: 1,200 km²; Current Pop.: ~82,000) possesses high ecological diversity (riverine, woodland, floodplain) suitable for foraging/shifting cultivation. Modelling indicates a theoretical carrying capacity (CC) under NR parameters of ~1,500 individuals.
  3.  **Phased Approach:** Phase I (Years 1-3): Voluntary enrolment of up to 3,000 participants, establishing core foraging bands and baseline skills transfer. Phase II (Years 4-10): Controlled expansion via lottery-allocated Subsistence Permits (SPs), capped at the validated CC (~1,500). Non-permit holders constitute the Deferred Cohort (DC), managed under Transition Protocols.
  4.  **Monitoring Framework:** Success measured against the **Holistic Wellbeing Composite (HWCv1.0)**, integrating: Adult Weekly Labour Hours (AWLH, target ≤20hrs, weight: 40%), Dietary Species Count (DSC, target ≥45 species/annum, weight: 30%), and Gini Coefficient of Material Possessions (GCMP, target ≤0.25, weight: 30%).
  5.  **Resource Requirement:** Initial funding estimate: €420m over 10 years (covering Transition Support, ecological surveys, skills mentorship, M&E, DC management).

  **1. Rationale & Theoretical Underpinnings**
  Recent interdisciplinary syntheses challenge the axiom that the Neolithic Revolution represented an unambiguous human advancement. Analysis suggests the shift to cereal agriculture initiated several detrimental path dependencies:
  *   **Labour Intensification:** Replacement of diversified, episodic foraging labour (estimated <20hrs/week) with regimented, high-input agrarian cycles (>40hrs/week).
  *   **Nutritional & Health Decline:** Narrowing of diets reliant on carbohydrate staples correlated with micronutrient deficiencies, reduced stature, and increased vulnerability to famine versus diversified forager intake. Sedentism and increased population density amplified infectious disease burdens.
  *   **Surplus & Institutionalised Inequality:** The advent of storable surplus enabled accumulation beyond immediate need, creating the material basis for hierarchical social structures, taxation, hereditary property, and state formation – phenomena absent or minimal in immediate-return forager societies.
  The NR Pilot operationalises this thesis, positing that a managed reversion to immediate-return subsistence within a supportive modern framework could reclaim higher aggregate HWC scores while mitigating historical disease burdens through modern prophylactics.

  **2. Pilot Area: Lower Tarn Valley (LTV)**
  *   **Geography:** River floodplain with riparian woodland, mixed deciduous/coniferous uplands, and wetland pockets. Historically farmed intensively (cereals, dairy).
  *   **Current Land Use:** 78% intensive arable/dairy, 12% managed woodland, 10% settlement/infrastructure.
  *   **Population:** Approx. 82,000 across 32 settlements and dispersed farms. Median age: 44. Primary employment: agriculture (42%), services (38%), light industry (20%).
  *   **Ecological Carrying Capacity (CC) Modelling:** Based on analogous pre-agricultural biome productivities and sustainable foraging yields, the validated NR CC for the LTV is estimated at **1,500 individuals** (±150, subject to Phase I validation). Current density (68.3 persons/km²) exceeds modelled NR CC (1.25 persons/km²) by a factor of 54.6.

  **3. Implementation Framework: Phases & Protocols**
  *   **Phase I (Y1-Y3): Foundation & Voluntary Transition**
      *   **Enrolment:** Open call for 3,000 volunteers from LTV residents (target demographics: age 25-45, good health). Comprehensive psychosocial and medical screening.
      *   **Intervention:** Relocation to designated initial NR zones. Establishment of foraging bands (target size: 25-50 individuals). Intensive mentorship by appointed Survival Practice Facilitators (SPFs). Gradual decommissioning of existing agricultural infrastructure within NR zones. Introduction of shifting cultivation techniques on designated plots (fallow cycle: 7 years).
      *   **Transition Support:** Provision of basic tools, biodegradable shelters, and prophylactic healthcare. Phased reduction of modern nutritional supplements contingent on DSC and health markers.
      *   **CC Refinement:** Detailed ecological surveys to validate/modify initial CC estimate.
  *   **Phase II (Y4-Y10): Controlled Scaling & Cohort Management**
      *   **Gate Review:** Progression contingent on Phase I achieving HWCv1.0 targets for ≥60% of participants and validated CC.
      *   **Subsistence Permit (SP) Allocation:** Lottery open to all LTV residents not enrolled in Phase I. SPs issued up to the validated CC minus Phase I participants. SP grants right to reside and forage within the NR zone.
      *   **Deferred Cohort (DC) Management:** Individuals not holding SPs (~80,500 estimated at Y4) constitute the DC. Transition Protocols include:
          *   *Relocation Assistance:* Coordinated resettlement programmes to designated reception zones outside the LTV.
          *   *Skills Retraining:* Vocational training aligned with external labour markets.
          *   *Transitional Nutritional Support:* Managed distribution of grain reserves harvested from decommissioned farmland during Phase I transition period (reserve duration: max 5 years post-full transition). *[Note: Requires secure storage facilities and Inventory Management personnel.]*
  *   **Governance:** NR Zone overseen by the Pilot Administration Council (PAC), composed of SPFs, ecological advisors, and rotating band representatives. DC management administered externally by the Transition Oversight Bureau (TOB).

  **4. Monitoring & Evaluation (M&E)**
  *   **Primary Indicator:** **Holistic Wellbeing Composite (HWCv1.0)**
      *   *Adult Weekly Labour Hours (AWLH):* Mean hours spent on subsistence activities (foraging, processing, shelter maintenance). *Target: ≤20 hrs.* *Weight: 40%.*
      *   *Dietary Species Count (DSC):* Number of distinct plant/animal species contributing ≥1% to annual caloric intake. *Target: ≥45 species.* *Weight: 30%.*
      *   *Gini Coefficient of Material Possessions (GCMP):* Distribution index of non-food, non-tool personal items (e.g., clothing, ornaments). *Target: ≤0.25.* *Weight: 30%.*
  *   **Secondary Indicators:** Stature (avg. adult height), incidence of specified infectious diseases, self-reported life satisfaction (biennial survey), ecological biomass sustainability.
  *   **Assessment Points:** Baseline (pre-Phase I), Annually (Phases I & II), Final Evaluation (Y10).
  *   **Target:** Achieve mean HWCv1.0 score ≥0.85 for ≥75% of SP holders by Y10 (HWCv1.0 score = Σ(Indicator Score * Weight), each indicator scaled 0-1 relative to target).

  **5. Frequently Asked Questions (FAQ)**

  *   **Q: Has any historical population ever voluntarily reverted to foraging at scale? Isn't this unnatural?**  
      A: Historical reversion is rare due to entrenched path dependencies: loss of traditional ecological knowledge (TEK), lack of land access due to established property regimes, and the high transition costs from specialised agrarian skillsets. The NR Pilot directly addresses these barriers through structured TEK mentorship via SPFs, guaranteed land access via the NR Zone designation, and comprehensive Transition Support mitigating initial skill deficits and resource gaps. The voluntary nature of Phase I and the SP lottery provides a structured pathway unavailable historically.

  *   **Q: Does the HWCv1.0 favour foraging inherently?**  
      A: HWCv1.0 weights factors identified by revisionist scholarship as key markers of pre-agrarian well-being: time sovereignty (AWLH), nutritional resilience (DSC), and egalitarianism (GCMP). These are objectively measurable. The targets are based on anthropological reconstructions of achievable pre-Neolithic baselines. The index provides a standardised metric against which the Pilot’s core hypothesis can be fairly tested.

  *   **Q: How is security and conflict resolution managed within the NR Zone?**  
      A: The PAC will develop and oversee a Conflict Mediation Protocol based on ethnographic models of consensus-based dispute resolution common in immediate-return societies. SPFs will be trained in mediation techniques. Physical security needs are anticipated to be minimal due to low population density, absence of significant material surplus attracting theft, and the social cohesion fostered by small-band living. *[Note: Inventory Management personnel securing the transitional grain reserve will operate under separate TOB security protocols.]*

  *   **Q: What happens to the Deferred Cohort?**  
      A: The DC is managed under dedicated Transition Protocols (Section 3) administered by the TOB, focusing on dignified resettlement, economic reintegration, and access to modern social support structures outside the LTV. The Pilot acknowledges the transition necessitates this demographic rebalancing to align population with the ecological carrying capacity of the immediate-return system. Management of the DC is a core component of the Pilot’s feasibility assessment.

  **6. Conclusion & Next Steps**
  The Neolithic Reversal Pilot presents a unique opportunity to empirically test a significant counter-narrative in human development theory. While logistically complex and requiring careful ethical oversight, the potential insights into sustainable, high-wellbeing subsistence models justify scoping. The proposed phased approach, rigorous M&E framework centred on HWCv1.0, and clear protocols for cohort management provide a structured foundation. Further refinement of CC modelling, Transition Protocol costing, and detailed ethical risk assessments are recommended prior to full commissioning. Successful validation in the LTV could inform consideration of similar pilots in other ecologically suitable, demographically congruent regions.
