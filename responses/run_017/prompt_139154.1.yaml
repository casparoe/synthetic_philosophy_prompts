  ## Do the Right Thing: Walls, Names, and the Fire Next Time

  Spike Lee’s searing *Do the Right Thing* provides a visceral, contested landscape for exploring public memory far beyond the usual statue debates. Set on a single, sweltering block in Bedford-Stuyvesant – a name itself echoing Dutch colonial governor Peter Stuyvesant – the film centres its explosive conflict on a seemingly private surface: Sal’s Famous Pizzeria Wall of Fame. Your framework of honour, remembrance, and address, alongside ambient commemoration and the ratchet effect, offers profound insight into this powder keg.

  Sal’s Wall of Fame, displaying exclusively Italian-American icons, functions precisely as **ambient commemoration**. To Sal, it’s personal decoration and heritage, part of the pizzeria’s furniture. Its power lies in its assumed neutrality and permanence – the "ratchet" in action. Installed by Sal decades prior, it represents a settled past, requiring overwhelming force to change. Yet, for the predominantly Black neighbourhood, this wall transcends decoration. Buggin’ Out’s demand for Black faces isn’t primarily about **honour** (disputing Sinatra’s worthiness) or **remembrance** (ensuring Black figures aren’t forgotten generally). It’s fundamentally about **address**. The wall occupies communal space – a neighbourhood hub. Its exclusive whiteness silently declares *who the space speaks for* and *to whom it is answerable*. It signals that the pizzeria’s public – the community it serves and exists within – is not reflected or recognised. Sal’s response, “It’s my pizzeria. American-Italians built this country,” asserts ownership and heritage (honour/remembrance for *his* group) but catastrophically fails to engage the demand for **address**. He sees private property; the neighbourhood experiences a public affront. The film sides with this perception, showing how ambient commemoration in a *de facto* public space becomes a claim about belonging and power.

  The film’s climax transforms commemoration into violent erasure. Radio Raheem’s murder by police is the horrific catalyst, but the burning of Sal’s pizzeria is layered. Is it merely destructive rage, or **counter-commemoration**? The fire consuming the Wall of Fame is undeniable symbolic erasure – forcibly removing a contested symbol of exclusion felt as ambient aggression. It’s a desperate, tragic assertion of **address**: *This space does not speak for us; we reject its narrative*. The film presents this act with profound ambivalence. It is undeniably tragic – a life lost, livelihoods destroyed. Yet, Lee also imbues it with a terrible, cathartic logic born of accumulated injustice and the failure of peaceful protest. It’s the violent rupture of the ratchet, the only force capable of dislodging an unchallenged ambient claim. The next morning’s tense reckoning between Mookie and Sal, amidst the ashes, underscores the cost and the unavoidable necessity of coexistence after rupture. The shared history is scorched earth, yet life, trade, and grudging recognition must continue.

  Lee’s own closing act is masterful **commemorative address**. Juxtaposing contradictory quotes on violence from Martin Luther King Jr. and Malcolm X refuses easy resolution, honouring the complexity of struggle and remembrance. This is immediately followed by the image of Sal and Mookie shaking hands – a photograph we recall being hawked unsuccessfully by Smiley throughout the film. This final montage performs remembrance (acknowledging the giants and the block’s trauma) but crucially centres **address**. It speaks *to* the audience and the community depicted, posing the unresolved question: How do we build a shared public space and memory after such rupture? The handshake photo, now central, becomes a tentative, fraught symbol of the necessary, imperfect reconciliation required for a community to function – the very photograph Smiley finally pins to the charred wall as the film ends. It’s not a solution, but a recognition of the ongoing, difficult work of defining who “we” are and what our shared space signifies. Lee does this exceptionally well, forcing us to hold tension without offering false comfort.

  **Where the Framework Strains & Where the Film Illuminates:**
  Your worry about the Wall being “just” decoration isn’t unfounded. Strictly defined, commemoration implies public intent. Lee’s genius is exposing how *private* symbols in *socially public* spaces inevitably become sites of **address**. The film reveals what philosophical debates often miss: commemoration isn't just about the past or public land, but about **present standing and contested ownership of meaning in shared environments**. The breakdown comes in applying "honour" or "remembrance" too literally to the Wall – its core offence is exclusionary address. Conversely, the destruction of the pizzeria is more about immediate justice and erasure than constructing a lasting counter-memory; the MLK/Malcolm X quotes better serve Lee’s commemorative intent.

  **Post-Screening Pauses:**
  1.  **Sal meticulously cleaning the Wall of Fame:** Discuss the intimacy of this act. How does it establish the Wall's significance *to Sal* and its perceived permanence (ambient commemoration/ratchet)? Contrast it with how others in the space view it.
  2.  **The moment before the wall burns:** Focus on what the wall represents in that instant of collective rage. Is its destruction targeted? What specific 'address' is being violently negated?
  3.  **The reveal of Smiley's photograph in the final montage:** Analyse the shift from the photograph being an ignored commodity to becoming the final, pinned image on the ruins. What does this journey signify about reconciliation, memory, and the possibility of a new, shared address?

  **What the Film Shows Beyond Argument:**
  *Do the Right Thing* transcends philosophical abstraction by grounding commemoration disputes in the **lived reality of community**. It shows these conflicts aren't just about historical interpretation, but about **present power, belonging, and the daily friction of coexistence**. The unresolved tension of the ending – the contradictory quotes alongside the necessary handshake – powerfully demonstrates that public memory isn't settled history. It's an ongoing, often painful negotiation about who has standing *now*, conducted among people who must still face each other, trade, and rebuild the next day, carrying the weight of names on streets and ashes on walls. Lee forces us to see commemoration as inseparable from the volatile, vital process of defining a shared present.
