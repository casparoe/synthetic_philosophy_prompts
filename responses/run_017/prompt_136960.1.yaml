  - Probability that **at least one strategy works** under restrictions:  
    \( P(\text{i}) = P(\text{A}) = 0.4 \)  
    \( P(\text{ii}) = P(\text{B}) = 0.3 \)  
    \( P(\text{iii}) = P(\text{C}) \times P(\text{D}) = 0.7 \times 0.4 = 0.28 \)  
