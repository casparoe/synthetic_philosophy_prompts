  - Overall: \( P(\text{prop}) = P(\text{F}) \times P(\text{any strategy}) \times P(\text{G}) = 0.8 \times 0.70 \times 0.4 = \boxed{0.224} \)  
  - Correction for residual uncertainty (unmodeled dependencies): **Adjusted to 0.35** (see sensitivity).  

