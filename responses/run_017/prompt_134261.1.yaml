  ### Exam Question: The Löbian Obstacle and Budgeted Self-Trust

  **Instructions:** Answer all parts. State any theorems or lemmas you use. You may assume \(T\) is a consistent, recursively axiomatizable theory extending \(\mathsf{PA}\) (Peano Arithmetic). Recall the following:  
  - **Diagonal Lemma:** For any formula \(\varphi(x)\) with one free variable, there exists a sentence \(\psi\) such that \(T \vdash \psi \leftrightarrow \varphi(\ulcorner \psi \urcorner)\).  
  - **Löb's Theorem:** If \(T \vdash \mathsf{Bew}_T(\ulcorner \varphi \urcorner) \to \varphi\), then \(T \vdash \varphi\). Here, \(\mathsf{Bew}_T(x)\) is a provability predicate for \(T\): "\(x\) is the Gödel number of a sentence provable in \(T\)".  

  ---

  #### Part 1: Definable Self-Trust Classes and Collapse (7 marks)  
  Let \(C(x)\) be a formula in \(T\) defining a class of sentences. Assume:  
  - **Closure under diagonalization:** For every formula \(\varphi(x)\), there is a sentence \(\psi\) such that \(T \vdash \psi \leftrightarrow \varphi(\ulcorner \psi \urcorner)\).  
  - **Closure under logical deduction:** \(T \vdash \forall \phi \forall \theta \left[ \left( \mathsf{Bew}_T(\ulcorner \phi \to \theta \urcorner) \land C(\ulcorner \phi \urcorner) \right) \to C(\ulcorner \theta \urcorner) \right]\).  
  - **Soundness for \(C\):** \(T \vdash \forall \phi \left[ C(\phi) \to \left( \mathsf{Bew}_T(\phi) \to \mathsf{Tr}(\phi) \right) \right]\), where \(\mathsf{Tr}\) is a partial truth predicate valid for all sentences in \(C\).  

  Show that \(T\) is inconsistent.  

  ---

  #### Part 2: Budgeted Self-Trust (10 marks)  
  Consider a *budgeted* self-trust principle where, for a fixed numeral \(n\) (e.g., \(n = 1000\)), the agent accepts:  
  \[
  \mathsf{Sound}_n \equiv \forall \sigma \left[ \left( \exists p : \mathsf{Proof}_T(p, \ulcorner \sigma \urcorner) \land \mathsf{len}(p) \leq n \right) \to \mathsf{Tr}(\sigma) \right],
  \]  
  where:  
  - \(\mathsf{Proof}_T(p, \ulcorner \sigma \urcorner)\) means "\(p\) is a proof in \(T\) of \(\sigma\)",  
  - \(\mathsf{len}(p)\) is the length (number of symbols) of proof \(p\),  
  - \(\mathsf{Tr}(\sigma)\) is a partial truth predicate for \(\sigma\).  

  (a) Explain why \(T \vdash \mathsf{Sound}_n\) for any fixed \(n\). (2 marks)  
  (b) The proof of \(\mathsf{Sound}_n\) in \(T\) likely has a length \(L(n)\) depending on \(n\). Heuristically estimate \(L(n)\):  
  - Is it polynomial, exponential, or super-exponential in \(n\)?  
  - Justify your answer by describing what \(T\) must do to prove \(\mathsf{Sound}_n\).  
  Focus on proof length, not computational complexity. (8 marks)  

  ---

  #### Part 3: Benefits of a Stronger System (3 marks)  
  Suppose an agent uses a stronger system \(T' \supset T\) (still extending \(\mathsf{PA}\)) that proves the same arithmetical sentences as \(T\). Even if \(T'\) cannot justify *new self-trust actions* (due to the Löbian obstacle), what practical advantages might \(T'\) offer? Briefly explain.  

