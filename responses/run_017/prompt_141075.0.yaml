  C) The typical time is a prior, and their history of quick healing is evidence, so it's reasonable to expect healing in 1.5-2 weeks. (leaf3)

  Question 4: Grant application
  Your colleague is applying for a competitive grant with a 10% acceptance rate. They have a strong track record and a well-written proposal. What do you think their chances are?

  A) Given their strengths, their chances are about 15-20%. (leaf2)
  B) The base rate of 10% is the best estimate; everyone has strong proposals. (leaf4)
  C) The 10% base rate is just an average of many individual cases, each with their own circumstances, so it doesn't say much about this specific application. (leaf6)

  Question 5: Megaproject (IT system rebuild)
  A friend's organization is rebuilding an IT system that failed once before. The base rate for success in such rebuilds after failure is about 20%. They have a new team and a better plan. What is the chance of success this time?

  A) The new team and plan address the prior issues, so it's more likely to succeed than 20%. (leaf1)
  B) The base rate of 20% is the most reliable indicator. (leaf4)
  C) They should find out the success rate for projects that changed teams after failure and use that as the estimate. (leaf5)

  Question 6: Job move (agency)
  You are considering a job move to a different city. You've read that only 50% of such moves lead to job satisfaction after two years. But you can take steps to build a social network and get involved in the community. How do you assess your chances?

  A) You're good at adapting and building networks, so your chances are well above 50%. (leaf1)
  B) The base rate of 50% is the best estimate; you're not that different from others. (leaf4)
  C) Instead of fixating on the 50%, you should focus on actions that increase your chances (like joining clubs) and negotiate a trial period to keep options open. (leaf7)

  Question 7: Restaurant (forecast changes outcome)
  A friend is considering opening a restaurant. You know that 60% of new restaurants fail within three years. If you tell them this, they might get discouraged and not open it. What do you do?

  A) They have a great concept and location, so they are likely to beat the odds. Tell them the base rate but emphasize their strengths. (leaf1)
  B) They should know the base rate to make an informed decision, so you tell them. (leaf4)
  C) You help them plan for robustness, like starting with low upfront costs and an exit strategy, rather than focusing on failure rates. (leaf7)

  Question 8: Innovative product (tail risk and gerrymandering)
  A company is considering launching an innovative electric scooter with a new safety feature. There's no direct base rate, but failure rates for new consumer products vary widely (e.g., 30% for electronics, 70% for transportation startups). Also, there's a small chance of a safety issue leading to lawsuits. How do you assess the risk?

  A) This product is unique, so base rates don't apply; focus on the product's merits and market research. (leaf1)
  B) Find the closest reference class (e.g., electric vehicles) and adjust for the safety feature to estimate the failure rate. (leaf5)
  C) Instead of predicting overall success, focus on mitigating the worst-case scenario (e.g., robust safety testing and insurance) and make the launch reversible. (leaf7)

