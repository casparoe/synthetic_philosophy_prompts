  - The quiz cannot distinguish between leaf5 (covariate hunting) and leaf3 (Bayesian) in some cases, because conditioning on covariates is a form of Bayesian update. But in our questions, leaf5 is about actively seeking a new reference class, while leaf3 uses the inside view to update a given prior.

