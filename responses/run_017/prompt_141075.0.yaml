answer: |-
  Below is an 8-question quiz designed to identify forecasting epistemologies through concrete cases. Each question has three options, avoiding jargon and labels. The scoring key maps answer patterns to seven "leaves" (epistemological stances) based on logical branching in the forecasting process. I'll first outline the logical structure, then present the quiz, scoring key, and limitations.

  ### **Logical Structure of Forecasting Epistemologies**
  The quiz branches along four key dimensions. Each leaf occupies a specific combination:

  1. **Is a usable reference class (base rate) available?**  
     - Yes → Allows outside-view approaches.  
     - No/contested → Forces inside-view or suspension.  
     - Gerrymanderable → Undermines trust in reference classes.  

  2. **Does the forecast or forecaster influence the outcome?**  
     - Yes → Forecasts can be self-defeating/fulfilling, or agency allows intervention.  
     - No → Outcome is independent.  

  3. **Is the goal to predict central tendency or manage tails?**  
     - Central tendency → Focus on most likely outcome.  
     - Tails → Focus on worst/best cases and robustness.  

  4. **Is the inside view treated as evidence or a story?**  
     - Evidence → Updates a prior or conditions a reference class.  
     - Story → Overrides base rates or justifies uniqueness.  

  **Leaves and their positions in the logical space**:  
  - **Inside-view-only (uniqueness)**: No usable reference class; inside view is a story; outcome may be influenceable.  
  - **Outside view as anchor + adjustment**: Reference class available; inside view adjusts base rate modestly; goal is central tendency.  
  - **Outside view as prior + inside view as likelihood**: Reference class available; inside view is evidence (Bayesian update); outcome independent.  
  - **Outside-view-only**: Reference class available; inside view ignored; outcome independent.  
  - **Inside view as covariate-hunting**: Reference class available; inside view identifies features to condition base rate; goal is central tendency.  
  - **Borrowed-authority suspicion**: Reference class contested (gerrymanderable); inside view reveals reference class is aggregated stories.  
  - **Suspend forecast**: Focus on tails/robustness; outcome influenceable or reference class unusable.  

  **Unoccupied combinations & why**:  
  - "Outside view as prior + inside view as likelihood" when outcome is influenceable → **Incoherent** (Bayesian updating assumes fixed likelihoods).  
  - "Covariate-hunting" for tails → **Unexplored** (covariates usually predict central tendency).  
  - "Borrowed-authority" with no reference class → **Incoherent** (suspicion requires a reference class to critique).  

  ---

  ### **The Quiz: "How Do You Forecast?"**
  **Instructions**: For each scenario, pick the **one** answer closest to your thinking. There are no right/wrong answers.

  1. **Ceramics Studio**  
     A friend is quitting her job to open a ceramics studio. Data shows 40% of small craft businesses survive 3 years. She has a waiting list and a landlord covering renovation costs.  
     - A) Her specific advantages (waiting list, landlord) make her success far more likely than 40%.  
     - B) Start with 40%, but nudge it up slightly (e.g., to 50%) due to her advantages.  
     - C) Find data on craft businesses with pre-opening demand and use *that* survival rate.  

  2. **Wedding Budget**  
     A couple budgets $20k for their wedding. Similar weddings often run 20% over budget. They’re organized and frugal.  
     - A) They’ll likely stay on budget—they’re more disciplined than most.  
     - B) Plan for $24k (20% over) since that’s typical, even for careful planners.  
     - C) Set aside a $5k contingency fund and book refundable vendors.  

  3. **Running Injury**  
     A runner has a calf strain. Typical healing is 2–3 weeks. They’ve had similar injuries heal faster, but this one feels severe.  
     - A) They know their body—if they rest and ice it, it’ll heal in <2 weeks.  
     - B) Most people take 2–3 weeks; that’s the safest bet.  
     - C) Prepare for 4+ weeks off (e.g., adjust training plans), since setbacks happen.  

  4. **Grant Application**  
     A colleague applies for a grant with a 10% funding rate. Their proposal is strong, but competition is fierce.  
     - A) Their proposal is exceptional, so their odds are much better than 10%.  
     - B) The 10% base rate is key—everyone thinks *their* proposal is strong.  
     - C) The 10% is just an average of past cases; it doesn’t predict this one.  

  5. **IT Megaproject**  
     A friend’s company is rebuilding a failed IT system. Similar projects succeed 20% of the time. They hired new engineers.  
     - A) The new team’s expertise makes success far more likely than 20%.  
     - B) Stick with 20%—prior failures show how hard this is.  
     - C) Research success rates for projects that changed teams post-failure.  

  6. **Job Relocation (Agency)**  
     You consider moving cities for a job. 50% of such moves lead to satisfaction within 2 years. You can network actively.  
     - A) You’re sociable and adaptable, so your odds are >50%.  
     - B) The 50% base rate is reliable; you’re not unique.  
     - C) Focus on actions to boost satisfaction (e.g., join clubs) and rent, don’t buy.  

  7. **Restaurant Forecast (Self-Defeating)**  
     A friend plans a restaurant. 60% fail in 3 years. If you share this, they might abandon the idea.  
     - A) Their concept and location are stellar—tell them the stat but stress their edge.  
     - B) They need the data to decide, so share the 60% failure rate.  
     - C) Skip the stat; advise starting small (e.g., pop-ups) to test demand cheaply.  

  8. **Innovative Product (Tails & Gerrymandering)**  
     A company launches a solar-powered scooter. Failure rates vary: 30% for electronics, 70% for transport startups. A flaw could cause lawsuits.  
     - A) Its novelty makes base rates irrelevant—bet on its design.  
     - B) Average the rates (e.g., 50%) but adjust for their safety features.  
     - C) Ignore average failure; focus on avoiding disaster (e.g., rigorous safety testing).  

  ---

  ### **Scoring Key**
  Tally your answers, then match the pattern to a leaf.  
  **Leaves**:  
  - **Inside-view-only (uniqueness)**: Inside view overrides base rates.  
  - **Outside view as anchor + adjustment**: Base rate adjusted modestly by inside view.  
  - **Outside view as prior + inside view as likelihood**: Inside view updates base rate probabilistically.  
  - **Outside-view-only**: Base rates dominate.  
  - **Inside view as covariate-hunting**: Inside view selects/conditions reference class.  
  - **Borrowed-authority suspicion**: Base rates are untrustworthy aggregates.  
  - **Suspend forecast**: Prioritize robustness over prediction.  

  **Answer Mapping**:  
  - A → Inside-view-only  
  - B → Outside-view-only **or** Anchor+adjustment (context-dependent)  
  - C → Covariate-hunting, Suspend, **or** Borrowed-authority (context-dependent)  

  | Question | If you chose A | If you chose B | If you chose C |
  |----------|----------------|----------------|----------------|
  | 1        | Inside-view    | Anchor+adjust  | Covariate      |
  | 2        | Inside-view    | Outside-view   | Suspend        |
  | 3        | Inside-view    | Outside-view   | Suspend (tail) |
  | 4        | Inside-view    | Outside-view   | Borrowed-auth  |
  | 5        | Inside-view    | Outside-view   | Covariate      |
  | 6        | Inside-view    | Outside-view   | Suspend        |
  | 7        | Inside-view    | Outside-view   | Suspend        |
  | 8        | Inside-view    | Anchor+adjust  | Suspend (tail) |

  **How to interpret**:  
  - Count how many times you land in each leaf.  
  - Your primary leaf is the one with the **most answers**.  
  - Tie? Use this priority: Suspend > Covariate > Borrowed-auth > Anchor+adjust > Inside-view > Outside-view.  

  ---

  ### **Where This Instrument Lies**
  1. **Expected Mis-sorts**:  
     - **Q1B (Anchor+adjust) vs. Q8B (Anchor+adjust) vs. Q3A (Inside-view)**: People who modestly adjust base rates (true anchor+adjust) may be mis-sorted as inside-view if their adjustment feels intuitive rather than quantitative.  
     - **Q4C (Borrowed-authority) vs. Q5C (Covariate-hunting)**: Both question reference classes, but borrowed-authority rejects them, while covariate-hunting seeks better ones. Answers may overlap if the respondent is skeptical but pragmatic.  

  2. **Indistinguishable Pair**:  
     - **"Outside view as prior + inside view as likelihood" (Bayesian) vs. "Outside view as anchor + adjustment"**: The quiz cannot cleanly separate these. Bayesian updating requires explicit probabilistic thinking (rare in informal settings), while anchor-adjustment is heuristic. Both appear as modest base-rate adjustments (e.g., Q1B).  

  3. **Fair Complaints**:  
     - **Q3’s options** don’t capture Bayesian healing-time updates (e.g., "Past injuries suggest faster healing, so update to 10–14 days"). Respondents may feel boxed into suspend (tail) or inside-view.  
     - **Q7C (Suspend)** conflates self-defeating forecasts with robustness. Those wanting to *use* the forecast to deter action (e.g., "Tell them the 60% to stop them") have no option.  

  4. **Redrawing the Branching Structure**:  
     I would restructure if:  
     - **Evidence emerges** that "tail management" and "reversibility" are distinct (e.g., tails require probability, reversibility requires action).  
     - **A study shows** that self-defeating forecasts (Q7) cluster separately from agency (Q6) in decision trees.  
     - **Users report** that covariate-hunting (Q1C/Q5C) feels different when hunting for predictors (evidence) vs. rejecting base rates (suspicion).  

  ---

  ### **Final Notes**
  - **Time**: Takes 15–20 minutes; group discussion afterward is encouraged.  
  - **Argue-proofing**: The scoring key acknowledges overlaps (e.g., anchor+adjust vs. Bayesian). Frame it as a "starting point" for reflection.  
  - **Improvements**: Add a question where the inside view is purely narrative (e.g., "They’re destined to succeed!") to better isolate story vs. evidence.  

  This tool emphasizes epistemic modesty by revealing how context shapes our forecasting instincts—and how rarely any single approach fits all. Run it, then discuss: *When do we resist base rates? When do we trust stories?*
