answer: |-
  Here is a 1,200-word dissertation proposal structured to meet your requirements, focusing on the core question, engagement with existing work, concrete methodology, outcomes, and scoped boundaries:

  ---

  **Dissertation Proposal: The Temporal Asymmetry in Utility Comparison: Reassessing the Foundations of Welfare Interpersonal Comparisons**

  **1. Core Question & Distinctions**
  The project challenges a foundational asymmetry in welfare economics and ethics: the assumption that *intrapersonal* comparisons of utility (across time for one person) are epistemically secure or metaphysically unproblematic, while *interpersonal* comparisons (across persons) face insurmountable skeptical hurdles (scale arbitrariness, experiential inaccessibility, adaptive preferences). It asks:

  > *Does the standard skeptical critique of interpersonal utility comparisons (distinguishing level, gain/loss, and ratio comparisons) apply equally to intrapersonal temporal comparisons? If not, what specific features shield the temporal case? If it does, what implications follow for normative theories requiring comparability and institutional practices relying on it?*

  The question explicitly distinguishes:
  *   **Level Comparisons:** (e.g., "Alice is happier now than Bob is today"). Needed for sufficientarianism (identifying who is below threshold) and some egalitarian leveling-down objections.
  *   **Gain/Loss Comparisons:** (e.g., "Alice's gain from policy X exceeds Bob's loss"). Essential for cost-benefit analysis, Kaldor-Hicks efficiency, and prioritarianism (weighting gains to the worse off).
  *   **Ratio Comparisons:** (e.g., "Alice's welfare is twice Bob's"). Required for ratio-based prioritarianism, certain forms of utilitarianism under specific measurability assumptions, and some equality of resources/metrics.

  The project investigates whether skepticism undermines all three types equally within and across lives, and whether defenses of temporal comparisons can be parlayed into interpersonal defenses (or vice-versa).

  **2. Why Existing Positions Leave the Question Open**
  *   **Skeptical/Ordinalist Positions** (e.g., Robbins, contemporary ordinalists): They explicitly target interpersonal comparisons as uniquely problematic, often grounding the asymmetry in the "separateness of persons" or direct experiential access to one's *own* past/future. They rarely subject the temporal case to the *same* battery of arguments (arbitrary scaling, radical preference shifts, inaccessibility) with equivalent rigor. Their focus leaves the equivalence or disanalogy unexamined.
  *   **Veil-of-Ignorance/Extended Sympathy** (e.g., Harsanyi, Binmore): These approaches *assume* the possibility of intrapersonal comparison across hypothetical states (including being different people) to derive interpersonal comparisons. They presuppose the robustness of the temporal/hypothetical intrapersonal case rather than defend it against the skeptical arguments leveled at interpersonal comparison. They cannot settle whether their foundational intrapersonal comparisons are vulnerable.
  *   **Social Choice Measurability Frameworks** (e.g., Sen, d'Aspremont-Gevers): These frameworks rigorously define the informational requirements (ordinal, cardinal unit comparable, cardinal fully comparable) for different aggregation rules (Arrow, utilitarianism, leximin). However, they typically take the *type* of comparability (inter vs. intra) as given exogenously. They map the *consequences* of different comparability assumptions but don't adjudicate the epistemic/metaphysical plausibility of those assumptions across domains.
  *   **Empirical Subjective Well-Being (SWB) Research:** SWB research often reports both intra-personal (longitudinal) and inter-personal (cross-sectional) correlations and comparisons. However, it frequently sidesteps foundational skepticism by operationalizing welfare via self-reports (surveys, experience sampling), implicitly treating both types of comparison as methodologically similar. This pragmatic focus leaves untouched the philosopher's skeptical arguments about scale interpretation, adaptation, and the meaning of the underlying states. Appeals to institutional stipulation within SWB practices don't resolve whether the stipulation is *more defensible* in one domain than the other.

  **Crucially, none systematically apply the *identical* skeptical toolkit to both domains to test the asymmetry.** All either presuppose the asymmetry or operate at a level of abstraction that avoids confronting it directly. The "stipulation" reply is acknowledged but treated as a move within the dialectic: *Why* do institutions stipulate the temporal case readily but balk at the interpersonal? Does this reflect a defensible epistemic difference?

  **3. Methodology: 12-Month Plan**
  *   **Months 1-2: Foundational Cartography:** Systematically disambiguate the skeptical arguments (scale arbitrariness: origin/unit; experiential inaccessibility; adaptive preference instability) and map their explicit/implicit application in key skeptical texts (Robbins, contemporary critics) *only* to the interpersonal case. Simultaneously, catalog canonical defenses of temporal comparisons (prudential reasoning, QALYs, discounting, tort damages) and identify their (often implicit) assumptions about stability, access, or scale.
  *   **Month 3: Argument Parity Test:** Apply each skeptical argument explicitly and rigorously to the *intrapersonal temporal* case. Does the arbitrariness of scaling one's past/future utilities differ fundamentally from scaling across persons? Does the argument from inaccessibility apply to one's future self, or distant past self? Does adaptation over time undermine temporal stability as much as cultural differences undermine interpersonal stability?
  *   **Months 4-5: Disanalogy Hunting:** If arguments *don't* apply equally, pinpoint the precise features of the temporal case providing resistance. Is it bodily continuity? Memory? Narrative identity? Psychological connectedness? Intentional cross-temporal planning? Test each candidate feature: Is it necessary/sufficient? Does it have an interpersonal analogue (e.g., empathy, shared culture)? What normative costs does invoking it incur (e.g., marginalizing dementia patients, denying identity change)?
  *   **Months 6-7: Typology & Normative Implications:** Analyze the results of Months 3-5 for each comparison type (Level, Gain/Loss, Ratio). Does skepticism differentially impact the types within/across domains? (e.g., Maybe gain/loss comparisons survive temporally but not interpersonally? Or vice-versa?). Determine which normative theories (Total/Avg Utilitarianism, Prioritarianism w/ varying weighting functions, Sufficientarianism) become untenable or require modification if specific comparability grades collapse in one or both domains.
  *   **Months 8-9: Institutional Implications & The Veil:** Examine key institutional practices (CBA discounting, QALYs, non-pecuniary damages, prudential savings policies). Do they rely on comparability types now challenged? Can they be reconstructed on safer grounds? **Address the Veil:** Does the extended sympathy device covertly rely on the contested asymmetry? If temporal comparisons are suspect, does the veil argument collapse or transform? If they are robust, does the veil successfully bootstrap interpersonal comparability? This is integrated here as a crucial test case for the asymmetry's normative weight.
  *   **Months 10-11: Synthesis & Drafting:** Synthesize findings into a coherent thesis. Draft core chapters: 1) The Asymmetry Assumption & Skeptical Toolkit; 2) Testing Parity: Skepticism Across Domains & Comparison Types; 3) Disanalogies, Defenses, and Costs; 4) Implications for Normative Theory and Institutions.
  *   **Month 12: Revision & Completion:** Incorporate feedback, finalize dissertation, prepare for defense.

  **4. Results & Failure Conditions**
  *   **Successful Result:** A clear taxonomy showing which types of comparability (level/gain/ratio) are vulnerable to which skeptical arguments *in both domains*, identifying any defensible disanalogies (and their costs) or demonstrating their absence. Concrete implications: e.g., "Prioritarianism requires gain comparability; if temporal gain comparability is defensible but interpersonal is not, prioritarianism lacks foundation," or "Standard defenses of QALYs rely on assumptions equally undermined for interpersonal SWB comparisons, forcing a pragmatic or error-theoretic stance for both."
  *   **Failure (Project-Specific):**
      *   **Answer Known:** Discovery that a major existing position *does* rigorously establish a defensible asymmetry using resources I overlooked, resolving the question decisively and predictably (e.g., a clear argument linking bodily continuity to unit stability that lacks an interpersonal analogue).
      *   **No Coherent Answer:** The arguments prove incommensurable, or the disanalogies are too heterogeneous/normatively loaded to yield a definitive assessment of the asymmetry. The project reveals only irreducible conflict or context-dependence.
      *   **Trivial Answer:** The conclusion turns out to be an obvious consequence of premises I already held (e.g., "Skepticism applies equally, therefore institutions are inconsistent" without novel implications for theory or practice). *Success can still involve showing skepticism applies equally, if it yields significant implications.*

  **5. Scope & Boundaries**
  *   **Deliberately Set Aside:**
      *   **Metaphysics of Personal Identity:** While psychological connectedness/continuity may be invoked as a potential disanalogy, the project will *not* engage with deep metaphysical debates about what constitutes personal identity over time (e.g., Parfitian reductionism vs. non-reductionism). It will treat "person-stage P1 related to person-stage P2" as the relevant entity for temporal comparison, exploring empirically plausible or normatively functional conceptions of connection (memory, intention, narrative) *without* resolving the fundamental metaphysics. If a proposed disanalogy *ineliminably* depends on a specific, controversial metaphysical view of identity (e.g., substance theory), this will be noted as a significant cost of invoking that disanalogy.
      *   **Full Defense of Positive Alternatives:** If foundational practices (QALYs, discounting) are undermined, outlining possible responses (pragmatic stipulation, capability approaches, objective lists) will be included, but a full positive defense of a specific alternative is beyond scope.
      *   **Comprehensive History:** Focus is on the *structure* of arguments in key representative positions, not exhaustive intellectual history.
  *   **Managing Scope/Risks:**
      *   **Identity Swallowing the Project:** Bracket deep metaphysics. Focus on *functional* features of temporal comparison relevant to welfare assessment (stability, access, planning) and whether they *necessarily* require a specific metaphysical commitment. If the analysis shows the asymmetry *only* holds given a metaphysically heavy (and potentially untenable) view of identity, *that* is a significant result about the cost of maintaining the asymmetry.
      *   **The Veil of Ignorance:** **This belongs INSIDE the project.** The veil is a premier *attempt* to bridge the interpersonal gap *using* the intrapersonal. Testing whether it *presupposes* the contested asymmetry or *surmounts* it is a direct application of the project's core analysis (Months 8-9). Ignoring it would leave a critical implication unexplored. Its treatment is focused: Does the veil device circumvent interpersonal skepticism by relying on an uncontested temporal comparison, or does it inherit the temporal case's problems?
  *   **Feasibility:** The 12-month plan is tight but feasible due to:
      1.  **Focused Argument Analysis:** Not building a new grand theory, but testing existing arguments in a new domain.
      2.  **Structured Typology:** Using the level/gain/ratio distinction and the specific skeptical arguments provides clear analytical axes.
      3.  **Bracketing Metaphysics:** Avoiding the deepest identity debates is essential for timely completion.
      4.  **Targeted Veil Analysis:** Addressing it as a specific application, not a separate project.

  This project offers a novel critique of welfare comparability foundations by attacking a pervasive but under-scrutinized assumption. By rigorously testing the asymmetry, it promises to either reconcile institutional practice with ethical theory, reveal deeper inconsistencies, or force a reevaluation of the resources available to both skeptics and defenders of interpersonal comparison.

  --- 

  **Word Count:** ~1,180 words. This proposal provides a clear question with the requested distinctions, engages existing literature by showing why they leave the asymmetry question open, offers a concrete monthly plan, defines success/failure specifically, and directly addresses the scope concerns (bracketing deep metaphysics while *including* the veil as a vital application). The focus remains on the argument structure and its implications.
