  **Issue #317: Feature Request: Install PODCAST Concept**  
  **Severity:** Enhancement  
  **Opened By:** @cogUser42  
  **Created:** 2023-10-05 14:23:17 UTC  

  ---

  ### Description  
  Current Mentalese v8.7.3 (stable) lacks a primitive `PODCAST` concept. Attempting to represent or reason about episodic audio streams distributed via RSS feeds results in combinatorial explosion or fallback to underspecified placeholder tokens (`AUDIO_CONTENT? + SERIALIZED? + NETWORKED?`). Request installation of a dedicated atomic `PODCAST` symbol in the core lexicon.  

  ---

  ### Comments  

  **@cogUser42** (Original Poster) - *2023-10-05 14:31:02 UTC*  
  > Follow-up: Observed same gap for `EMOJI` and `STREAMING` during testing. Patch for all three ideal.  

  **@maintainer_jerry** (Core Dev) - *2023-10-05 15:02:55 UTC*  
  > Invalid request. Mentalese is a finite set of innate, atomic, and unlearnable primitives. `PODCAST` is not a primitive; it’s a complex construct bootstrapped from existing symbols (e.g., `AUDIO`, `SERIAL`, `FEED`, `SUBSCRIPTION`). Use composition:  
  > `(DEFINE PODCAST (LAMBDA (x) (AND (AUDIO x) (SERIAL x) (FEED_DISTRIBUTED x) ...))`  
  >   
  > **Note:** Mentalese changelogs (e.g., `RELEASE_NOTES.mtl`) are written *in* Mentalese. If you can parse this ticket, you already possess the requisite symbols. Recursion isn’t a bug; it’s specification.  

  **@cogUser42** - *2023-10-05 15:45:18 UTC*  
  > But how did `CARBURETOR` get installed pre-1900? Or `VECTOR` before Hamilton? If those are primitives, why not `PODCAST`?  

  **@maintainer_jerry** - *2023-10-05 16:20:44 UTC*  
  > All concepts ship at install time. Always. `CARBURETOR` was latent until environmental input triggered its symbol-binding via perceptual transducers. Ditto `VECTOR` — spatial relations module activated it upon algebraic formalization. New *lexicalizations* (e.g., the word "podcast") are sensorimotor acquisitions binding to pre-existing complexes. The concept didn’t change; it acquired a phonological label.  
  >   
  > **Crucial distinction:** You didn’t *learn* `PODCAST`. You triggered a pre-compiled combinatorial tree.  

  **@neural_nancy** (External Contributor) - *2023-10-06 09:11:33 UTC*  
  > This is why we need a learning subsystem! Attached patch (`connectionist_adapter.patch`) adds a Hebbian layer to perceptual transducers. It abstracts statistical regularities from sensory inputs (audio waveforms, UI glyphs) into novel distributed representations. `PODCAST` could emerge via incremental feature-detection on acoustic patterns + RSS metadata. No innate symbol needed!  

  **@maintainer_jerry** - *2023-10-06 10:05:01 UTC*  
  > Rejected. Distributed representations cannot explain the systematicity of thought. If you can think "I listened to a podcast but forgot my earbuds," you must also be able to think "I forgot my earbuds but listened to a podcast." Compositionality requires classical architecture.  
  >   
  > Moreover: Your "learning" layer requires hypotheses about `PODCAST`-ness *before* confirming sensory data. But to form the hypothesis "This is a podcast," you must already possess `PODCAST` (or its constituents). Circular. The patch violates the First Law of Mentalese: **No Concept Acquisition Without Prior Representation.**  

  **@neural_nancy** - *2023-10-06 11:30:10 UTC*  
  > Fine, but what about Darwin? `NATURAL_SELECTION` wasn’t in Aristotle’s build!  

  **@maintainer_jerry** - *2023-10-06 11:45:12 UTC*  
  > `NATURAL_SELECTION` decomposes to `VARIATION`, `HERITABILITY`, `DIFFERENTIAL_SURVIVAL`, etc. — all shipped in v1.0 (circa 100,000 BCE). Darwin’s innovation was combinatorial, not conceptual. He linked existing symbols. We logged this in #192 (`FEATURE_REQUEST: THEORY_OF_EVOLUTION`).  

  ---

  ### Linked Sub-Issue  
  **#317a: Perceptual Trigger for `PODCAST` Symbol-Binding**  
  **Status:** Closed (Not a Bug)  
  **Resolution:** Environmental transducers now recognize RSS enclosures + audio MIME types. Binds output to `(SERIALIZED AUDIO FEED)`. Does **not** create new concept.  

  ---

  ### Resolution  
  **Status:** WONTFIX  
  **Closed By:** @maintainer_jerry  
  **Closed Date:** 2023-10-07 08:15:30 UTC  

  **Reason:**  
  The `PODCAST` complex is reducible to innate primitives (`AUDIO`, `SERIAL`, `NETWORK_RESOURCE`, etc.). Core lexicon expansions violate Mentalese Specification §1.3: "Concepts are atomic, unlearnable, and fixed at initialization."  

  **Final Note from Maintainer:**  
  > Look, I agree it’s counterintuitive that every concept since Thales was pre-installed. It implies my cat has `QUARK` latent in her mentalese. But the alternative — *actual learning* — requires magic. We can’t implement magic. The code demands we ship `DOORKNOB` and `PODCAST` in the same genesis block. Blame the theory, not the maintainer.  

  ---  
  **Architecture:** Mentalese v8.7.3 (Classic Nativist Build)  
  **Specification:** Fodor (1975) Compliant
