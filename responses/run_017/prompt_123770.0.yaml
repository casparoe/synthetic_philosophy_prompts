prompt: |-
  I spent a career in experimental physical chemistry and have spent the last two years of retirement reading metaethics, where I keep encountering a prohibition that looks to me very like a manoeuvre my own field performs routinely, and to apparently opposite effect. I would like a careful comparison of two things that I suspect are being run together, and then a verdict on the manoeuvre.

  The first is the derivational thesis: no conclusion containing an 'ought' follows from premises none of which contain one; any valid argument for a normative conclusion must contain a normative premise, either smuggled in or honestly stated. The second is Moore's target: 'good' is not synonymous with any natural expression, goodness is not identical with any natural property, and for any natural candidate it remains an open question whether that candidate is good. Please say exactly what each of these denies and what each permits, whether either entails the other in either direction, and whether they are one thesis in two idioms or two theses that happen to be held by the same people. Do not assume the second is merely a rhetorical version of the first; I want to know whether either could fail while the other held.

  Now the manoeuvre, which I will describe in my own terms so that nothing hangs on my having read the right author. In the philosophy of science I was trained on, one moves from a purely descriptive base to statements couched in a theoretical vocabulary by adding what I will call a bridge identification: temperature is, up to a constant and in the ideal-gas case, mean molecular kinetic energy, and that identity is not analytic, not conceptually necessary, and not derivable from the descriptive base alone. It is a contingent, a posteriori identity, and the term is fixed by the role it plays in the theory; once the identity is in hand one cheerfully derives all manner of claims about temperature from claims about molecules. Call this the bridge-identification strategy. What happens when it is run on 'good' or 'ought'? As I understand it, it concedes everything to Hume, since it never claims a derivation from purely descriptive premises and simply adds the identity as a further premise; and it claims to be untouched by the open-question argument, since it asserts no synonymy and no analytic connection, only an a posteriori identity of the water/H₂O sort, so that the openness of the question whether maximizing well-being is good should be no more damaging than the openness of the question whether water is H₂O. Is that right? If not, where exactly does the analogy give?

  The wrinkle I cannot get past concerns the uniqueness of the filler. In the scientific cases the world appears to supply exactly one candidate that occupies the role, and that is what lets the identity be necessary even though a posteriori. Suppose instead that the normative role admits of two quite different fillers, and that two communities could agree on every platitude about what reasons and goodness do while their terms latched onto different properties. Is that a real possibility for the normative case in a way that it is not for temperature, and if it is, does it sink the strategy, or does it merely show that normative terms are less rigid than natural-kind terms without touching the main claim?

  Finally, three things I want stated plainly rather than gestured at. First: what sort of evidence could ever confirm a bridge identification of this kind, given that we have no instrument that detects goodness, and is the holistic answer available in science — the identity earns its keep by the explanatory and predictive work it does — genuinely available here, or does it smuggle the normative back in? Second: if the strategy works, has the is-ought gap collapsed into a bookkeeping point about argument validity, or does it reappear one level up, as a question about whether the bridge premise itself can ever be assertible? Third: where is the analogy to the theory-observation gap silent, and does my instinct that the gap has been overrated survive the comparison?
reasoning: |-
  Okay, the user is a retired physical chemist diving into metaethics. They've noticed a similarity between the bridge identification strategy in science and attempts in metaethics to connect descriptive properties with normative ones. They want a detailed comparison between Hume's is-ought gap and Moore's open question argument, and whether the scientific approach can work for ethics.

  First, need to clarify the two theses. The derivational thesis (Hume's Law) says you can't derive an "ought" from an "is" without normative premises. Moore's argument claims "good" can't be defined by natural properties without an open question. They're related but distinct: one is about logical derivation, the other about meaning and properties. One could hold without the other—for example, if "good" were a natural property but deriving it required normative premises.

  The user's bridge identification strategy, like identifying temperature with molecular kinetic energy, is a posteriori and contingent. Applying this to "good" seems to bypass Hume because it adds the identity as a premise. But the open question argument might still challenge it. The user wonders if multiple properties could fill the normative role, unlike in science where there's usually one. That could be a problem for ethical naturalism.

  For evidence confirming bridge identities in ethics, it's tricky. Science uses predictive power, but ethics might rely on reflective equilibrium—balancing intuitions and principles. But does that smuggle in normativity? Also, the is-ought gap might shift to whether the bridge premise itself is justifiable, not the derivation.

  The analogy breaks in places. Science has empirical tests; ethics doesn't. And the gap might be less about logic and more about justification. The user's instinct that the gap is overrated might hold if we see justification as holistic, but challenges remain.

  Deep down, the user might be seeking a naturalistic grounding for ethics that respects scientific rigor. They could be frustrated with non-naturalist views and want validation that their scientific approach applies. Their career in chemistry likely makes them sympathetic to naturalism, so they might hope for a defensible ethical naturalism that avoids past mistakes.
answer: |-
  You've pinpointed a fascinating tension between scientific realism and metaethical naturalism. Let's dissect this systematically, respecting your background and queries.

  ### 1. Clarifying the Two Theses
  *   **Derivational Thesis (Hume's Law):**
      *   **Denies:** The logical validity of any deductive argument where a conclusion containing an irreducible normative term (e.g., "ought," "good," "reason") is derived *solely* from premises containing *only* non-normative (descriptive, natural) vocabulary.
      *   **Permits:** Derivations of normative conclusions *if* at least one premise is already normative. This premise could be substantive ("Pleasure is good") or structural ("If an act maximizes well-being, one ought to do it"). It also permits *inductive* or *abductive* support for normative claims from descriptive facts.
      *   **Target:** Logical structure of arguments; derivability.

  *   **Moore's Target (Open Question Argument - OQA):**
      *   **Denies:** That the *meaning* of "good" (or other fundamental normative concepts) is identical to the meaning of any complex or simple naturalistic expression. Consequently, it denies that the *property* of goodness is identical to any natural property. The "open question" test ("Is X, which is N, *good*?") is always meaningful and substantive if "N" is purely naturalistic, demonstrating non-synonymy and non-identity.
      *   **Permits:** That goodness *supervenes* on natural properties, is *causally related* to them, or that natural properties are the *only things that are good*. It targets *analytical reduction* and *property identity* claims.
      *   **Target:** Semantics, metaphysics, and epistemology of normative concepts/properties.

  *   **Relationship:**
      *   **Not Identical:** They address distinct issues (derivability vs. meaning/identity). One is a logical constraint, the other a semantic/metaphysical claim.
      *   **No Entailment Either Way:**
          *   **Derivational True, Moore False?** Imagine "good" *is* synonymous with "maximizes well-being" (MW). Then "Action A MWs" *would* validly entail "A is good" (analytically). Moore denies this synonymy is possible.
          *   **Moore True, Derivational False?** Even if "good" is irreducible (OQA succeeds), one *might* derive "ought" from "is" via a complex non-deductive route (e.g., sophisticated Cornell Realism), though Humeans argue this smuggles in normativity. More plausibly, Moore being true *strengthens* the case for the derivational thesis by blocking the most straightforward way to bypass it (analytic reduction), but doesn't strictly entail it.
      *   **Common Holders:** Non-naturalists (like Moore) endorse both. Naturalists reject Moore's OQA as a fallacy (misidentifying epistemic openness for semantic/metaphysical distinctness) but often *accept* the derivational thesis as a point about logic, seeking other routes (like your bridge IDs) to ground normativity naturally. **Verdict: Two distinct theses, often held together by non-naturalists but separable. Naturalists typically reject Moore while accepting (or reinterpreting the implications of) the derivational thesis.**

  ### 2. The Bridge-Identification Strategy Applied to Normativity
  Your analysis is astute.
  *   **Conceding to Hume?** **Yes, explicitly.** The naturalist deploying bridge IDs (e.g., "Goodness = the property of maximizing well-being" (MW)) *grants* Hume's Law. They do *not* claim to derive "X is good" from *only* descriptive premises like "X maximizes well-being". They require the bridge premise *itself* ("Goodness = MW"). The argument becomes:
      1.  X maximizes well-being. (Descriptive)
      2.  Goodness = the property of maximizing well-being. (Bridge ID)
      3.  Therefore, X is good. (Normative) - Valid, but premise 2 is normative *or* a hybrid identity claim.
  *   **Resisting Moore (OQA)?** **Yes, as intended.** The claim is that "good" rigidly designates a natural property (MW), discovered a posteriori, just as "water" designates H₂O. The openness of "Is MW good?" is analogous to "Is H₂O water?" before the identity was known – it reflects epistemic status, not semantic or metaphysical distinctness. The meaning of "good" is given by its conceptual role (platitudes about goodness), and science discovers which natural property *occupies* that role.

  ### 3. The Uniqueness Wrinkle: Multiple Realizability?
  This is a profound challenge (**The Multiple Realizability/Objection**).
  *   **Scientific Case:** You're right. For many theoretical terms (temperature, water), empirical investigation finds a *unique*, causally unified natural kind filling the role. This grounds the necessity of the identity.
  *   **Normative Case:** Is the "good-making role" uniquely fillable? Imagine:
      *   Community A: "Goodness = Maximizing Well-Being (MW)"
      *   Community B: "Goodness = Obeying Divine Commands (DC)" (Assume MW and DC systematically conflict).
      Both communities might agree on *all conceptual platitudes* about goodness ("good is what we should pursue," "good provides reasons," etc.). Yet, their terms would refer to different properties.
  *   **Is this Possible?** **Plausibly Yes.** Unlike water, "good" seems defined by a *functional role* (what it *does*: provide reasons, be desirable, etc.) that *could* be realized by different natural properties in different possible worlds (or even in different coherent normative systems in *this* world, though that's more contentious). This seems more analogous to "pain" (potentially realizable in silicon) than "water."
  *   **Does it Sink the Strategy?** **It severely damages the standard rigid-designator version.**
      *   **Sinks Rigid Natural Kind Model:** If multiple properties *could* play the identical normative role, then "good" cannot rigidly designate a *specific* natural property like MW across all possible worlds. Its reference might be context-dependent or indeterminate.
      *   **Doesn't Necessarily Sink All Naturalism:** Proponents might:
          1.  **Deny Multiple Realizability:** Argue only *one* natural property (e.g., MW, or perhaps a complex disjunction) *can actually* play the role fully in our world, given human nature/social facts. (Contingent Identity).
          2.  **Adopt Role Functionalism:** Goodness *is* the second-order property of *playing the good-role*. Specific natural properties (MW, DC?) are merely what *realize* goodness in different contexts. (This moves away from type-identity).
          3.  **Accept Context Sensitivity:** "Good" refers to different natural properties relative to different frameworks or speakers. (Compromises objectivity).
      *   **Consequence:** While the bridge ID strategy *could* still work locally ("In our world/normative framework, goodness = MW"), the strong analogy to water/H₂O (necessary a posteriori identity) is broken. Normativity appears functionally defined in a way temperature isn't.

  ### 4. Your Three Plain Statements

  1.  **Evidence for Bridge IDs (Goodness):**
      *   **No "Goodness Detector":** True. Confirmation isn't like measuring H₂O concentration.
      *   **Holistic Justification:** This *is* the primary proposed method (like "Inference to the Best Explanatory Realization" - IBER). The claim is that identifying goodness with a specific natural property (e.g., MW) provides the *best overall explanation* of:
          *   Our normative *judgments* and intuitions (across diverse cases).
          *   The *causal role* of normative discourse (motivation, social coordination).
          *   The *supervenience* of the normative on the natural (why things alike naturally *must* be alike normatively).
          *   The *evolutionary origins* of normative thinking.
      *   **Smuggling Normativity?** **The Crucial Challenge.** Critics (non-naturalists, error-theorists) argue this holistic justification *always* presupposes normative standards:
          *   What counts as the "best" explanation? Doesn't "best" involve norms of simplicity, coherence, or explanatory power? Aren't *these* normative?
          *   Explaining normative judgments seems to require assuming *some* of them are *correct* to be explained. Why explain *judgments* if not to understand the *truth* they (sometimes) track?
          *   **Naturalist Reply:** The standards (simplicity, coherence, explanatory power) are *epistemic* norms, which they might also try to naturalize, or argue are constitutive of rationality/science itself, not substantive moral norms smuggled in. The explanation aims to show how normative *truth* arises from natural facts *plus* the semantics of reference fixing. It's contentious whether this circularity is vicious or virtuous (reflective equilibrium).

  2.  **The Status of the Is-Ought Gap:**
      *   **Collapsed at the Base Level?** **Yes, for specific arguments.** With the bridge ID premise added ("Good = N"), you *can* validly derive specific normative conclusions ("X is good") from descriptive premises ("X is N"). Hume's Law is satisfied because the bridge premise is present.
      *   **Reappears One Level Up?** **Absolutely and Crucially.** The core question becomes: **Can the bridge ID premise *itself* ("Good = N") be rationally justified using *only* non-normative premises and evidence?**
          *   If the justification relies (even implicitly) on normative assumptions (e.g., about evidence, explanation, or the correctness of some judgments), the gap reappears in justifying the bridge.
          *   If the justification is purely descriptive (e.g., the natural property N causally regulates our use of "good," or N uniquely plays the functional role described non-normatively), then the naturalist claims the gap is bridged *holistically*. The non-naturalist insists the functional role description *still* implicitly contains normativity (e.g., "what we *should* desire"). **This is the battleground.**

  3.  **Analogy's Limits and the Gap's Rating:**
      *   **Where the Analogy is Silent/Limited:**
          *   **Motivation & Internalism:** Normative judgments are (arguably) intrinsically motivating or reason-giving. Temperature claims are not. Explaining this phenomenology naturalistically is a major hurdle.
          *   **Authority & Categoricity:** Moral "oughts" often feel categorically binding, unlike hypothetical imperatives or scientific descriptions. The source of this authority within nature is unclear.
          *   **Phenomenology of Objectivity:** Moral experience often feels like discovering mind-independent truths, analogous to science. But science has intersubjective tests; morality's objectivity is contested.
          *   **Multiple Realizability:** As discussed, this challenges the necessity of the identity.
          *   **Justification of the Bridge:** Scientific bridge IDs are justified by direct empirical interaction and predictive success within a tightly constrained domain. Normative bridge IDs rely on holistic explanatory power concerning complex, contested practices and judgments, making justification less straightforward.
      *   **Is the Gap Overrated? Your Instinct:**
          *   **Potentially Valid:** The bridge ID strategy, *if successful*, shows the gap isn't an unbridgeable *logical chasm* for deriving specific normative conclusions, but a challenge about justifying the foundational identity. It reframes the problem.
          *   **But Enduring:** The challenges at the "one level up" stage (justifying the bridge ID itself without normative circularity, handling motivation/authority, multiple realizability) are formidable. The analogy shows *how* naturalism *might* work, but doesn't definitively prove it *does* work or that the gap is fully closed. The gap transforms from a simple logical point to a deep metaphysical and epistemological challenge about grounding normativity within nature. Your instinct that the *logical* gap is less absolute than sometimes portrayed survives; the *metaphysical/epistemological* gap remains a significant hurdle.

  **Conclusion:** Your bridge-identification strategy is a powerful naturalist tool. It concedes Hume's derivational point while directly attacking Moore's OQA via Kripkean semantics. However, the uniqueness challenge (multiple realizability) significantly weakens the analogy to paradigmatic scientific reductions like temperature and water. Justifying the bridge ID premise holistically faces the charge of smuggling in normativity through epistemic standards. While the strategy collapses the is-ought gap for deriving *specific* normative claims once the bridge is accepted, the gap forcefully re-emerges as the question of whether the bridge premise itself can be non-circularly justified. The analogy highlights a viable path for naturalism but also its deepest challenges. Your instinct that the gap's *logical* strictness is sometimes overrated is justified; its *metaphysical* depth, however, remains profound.
