answer: |-
  Here’s a 90-minute workshop design to make your volunteers **experience** the limits of "universal" pictures, using hands-on creation and testing:

  ---

  ### **1. Setup & Materials (150 words)**  
  **Who:** 14 volunteers (split into 7 pairs). Half are "Designers," half are "Readers." Swap roles each round.  
  **Materials per pair:** 10 blank sheets, thick markers (black only), 1 clipboard. **Banned:** Letters, numerals, ticks (✓), crosses (✗), traffic-light colors, emojis, and arrows (they smuggle in convention!).  
  **Prep:** Pre-printed "Reader Cards" (hidden until testing). Whiteboard for scoring.  
  **Rules:**  
  - Designers get 5 minutes to draw a solution.  
  - Readers see the finished drawing for 15 seconds *in silence* (no questions!), then write what they think it means.  
  - **Key constraint:** Every drawing must stand alone. No verbal hints!

  ---

  ### **2. The Rounds (600 words)**  
  | Round | What Designers Must Encode                     | What’s Rigged to Go Wrong                           | What They’ll Probably Do                                                                 |
  |-------|-----------------------------------------------|-----------------------------------------------------|------------------------------------------------------------------------------------------|
  | 1     | "Rinse your mouth after using inhaler."       | Simple action → but *how*? (Spit? Swallow? Water?) | Draw person spraying inhaler → then drinking/swallowing. Readers may think: "Drink water after." |
  | 2     | "If you take blood thinner X, **don’t** take painkiller Y." | Conditionals + prohibition → hard without symbols. | Draw two pills colliding 💥 → Readers may see "danger" but miss *which* pills or the "if." |
  | 3     | "About 1 in 20 people get a rash."            | Probability + quantity → no numbers!               | Draw 20 stick figures + 1 with red dots → Readers count wrong or miss "about." |
  | 4     | "**Stop using this card after Dec 2024.** Ask nurse instead." | Self-referential → pictures can’t easily "talk" about themselves. | Draw calendar with big ❌ (banned!) → Or card in trash can. Readers think: "Throw trash away?" |
  | 5     | **PHOTO vs DRAWING:** "Take pill with food."  | Half pairs get a photo (grainy print of pill+apple); half get drawing brief. | Photo group draws realistic apple/pill → Drawing group simplifies. Readers guess: "Eat apple?" vs. "Take with meal?" |

  ---

  ### **3. Scoring (150 words)**  
  **Goal:** Reward **clarity**, not artistry.  
  **Method:**  
  - After each round, Designers reveal the *intended* message.  
  - Readers share their written interpretations.  
  - **+1 point** per pair if >50% of Readers’ interpretations *match the core intent* (e.g., "don’t mix pills" vs. exact drugs).  
  - **0 points** if ambiguous or wrong.  
  **Tracking:** Tally on whiteboard. Emphasize: "This isn’t about winning—it’s about seeing what *actually* works for our patients." No prizes; the "reward" is seeing their work tested in the clinic later.

  ---

  ### **4. Debrief (400 words)**  
  **Start by asking:** *"Where did your drawing fail? Where did it succeed?"*  
  **Map moments to concepts:**  
  - **Round 1 (Rinsing mouth):** "Similarity" worked for the inhaler, but *convention* crept in (💧= water? Cup = drinking?).  
  - **Round 2 (Don’t mix pills):** Prohibition needs **explicit rules** (e.g., "red circle+slash = forbidden"). Without rules, you drew an explosion—a *cultural* symbol.  
  - **Round 3 (1 in 20 rash):** Probability forced you into **counting**. Pictures become code without numbers.  
  - **Round 4 (Stop using this card):** Self-reference broke—pictures show *things*, not *ideas about things*. You needed symbols (banned!) or text.  
  - **Round 5 (Photo vs Drawing):** Photos add noise (bad lighting, textures). Drawings simplify but lose context (apple = any food?).  

  **Name Neurath’s conclusion here:**  
  > *"Neurath found pictures need **context**: rules, consistent style, and *some* words. They’re aids—not a full language. Your cards won’t work alone. We’ll add short keywords (e.g., ‘RINSE’) and a legend for symbols."*  

  **If they say "pictures are just ambiguous":**  
  > *"Exactly! So let’s identify *which* ambiguities hurt patients. Round 2’s ‘if’ or Round 3’s ‘1 in 20’? Those need hybrid solutions."*

  ---

  ### **5. What Will Go Wrong (250 words)**  
  - **Shared English bias:** Volunteers "succeed" in early rounds because they share cultural context. **Fix:** Stress: *"Your patient sees this with no context. Would they know the cup means ‘rinse,’ not ‘drink’?"*  
  - **One dominant designer:** Pairs default to the "best artist." **Fix:** Force role-swaps and say: *"The ‘designer’ is only the scribe—both must agree on the idea."*  
  - **Overly clever solutions:** Someone draws abstract metaphors (e.g., scales for "balance" of pills). **Fix:** Scoring penalizes misinterpretation.  
  - **Readers cheat:** Peeking at other pairs’ work. **Fix:** Separate groups physically; enforce silence.  
  - **Time crunch:** Round 4 runs long. **Fix:** Use a timer; cut them off mid-drawing if needed.  
  - **Frustration with bans:** "Why no arrows?!" **Fix:** Post-workshop: *"Arrows *are* conventions—we’ll test them with patients next month."*  

  ---

  ### **6. What the Game Can’t Do (150 words)**  
  It **won’t teach semiotics**. You’ll need to explicitly say:  
  > *"Pictures aren’t universal. They rely on shared experience (e.g., ‘spoon = food’). When we say ‘blood thinner,’ we *assume* patients recognize the pill shape. But what if their medicine looks different? Or ‘dizziness’—how do you draw that without a 💫, which means ‘magic’ elsewhere?"*  

  It **won’t solve design**. Use the exercise to expose gaps, then announce:  
  > *"Next week, we’ll prototype cards using your *least ambiguous* ideas from tonight—plus keywords and tested symbols."*  

  **Final note:** Bring real clinic cards to the session. When frustration peaks, hold one up: *"This is why we’re here. Let’s make them better."*  

  --- 
  This design forces the group to **collide** with ambiguity while keeping energy high. By Round 4, they’ll be arguing about conventions they swore didn’t exist—exactly what you need. Let me know if you want the Reader Card templates!
