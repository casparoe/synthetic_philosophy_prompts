  Designing the quiz, each question will have 2-3 answer options. For example, in the squash scenario, options could be: "The statue survives" or "The statue doesn't survive." The scoring key will then link combinations to theories. I should also identify which questions everyone answers the same, like case 7 where all theories might agree that pointing picks one statue.

  The user wants to know if additional cases could separate co-location and constitution, or 4D views. But since these pairs answer all cases identically in the proposed scenarios, adding more questions might not help. The difference is more about explanation than empirical outcomes. Similarly, the "nothing survives" and eliminativist views might only differ in whether they admit any objects beyond particles.

  In the scoring key, I'll assign each theory based on answer patterns. For example, answering that the statue survives the squash only if reshaped exactly might point to conventionalism. The user also wants unoccupied combinations noted, like rejecting all persistence but still counting objects, which might be incoherent.

  Finally, I'll ensure the quiz is engaging for a pub audience, using relatable scenarios. Testing internally to catch ambiguities and confirm that the answer combinations map correctly to the intended theories. Highlighting where distinctions fail and why, maintaining transparency as the user requested.
answer: |-
  Here's a concrete-case quiz designed to sort participants into the 8 metaphysical views without using any jargon in the questions, along with a scoring key and analysis.

  **The Pub Quiz: The Statue & The Lump**

  **Instructions:** For each scenario, choose the answer that best matches your intuition. There are no "right" answers, just what seems true to you.

  1.  **The Squash (Statue):** A sculptor carefully shapes a lump of clay into a beautiful statue. Later, someone accidentally bumps into it, squashing it instantly back into a featureless lump. Did the *statue* survive the squashing?
      *   **(A) Yes, the statue is now just a lump.**
      *   **(B) No, the statue was destroyed.**
      *   **(C) There never really was a distinct 'statue' object in the first place.**

  2.  **The Squash (Lump):** Same scenario as #1: lump shaped into statue, then squashed back into a lump. Did the original *lump of clay* survive the squashing?
      *   **(A) Yes, it was temporarily shaped differently but it's still the same lump.**
      *   **(B) No, the original lump was destroyed when the statue was made; this is a new lump.**
      *   **(C) There never really was a distinct 'lump' object beyond the particles.**

  3.  **Reshaped Back:** The statue is squashed into a lump. Later, the sculptor carefully reshapes *that exact lump* back into the *exact same statue shape* it had before. Is this...
      *   **(A) The very same statue as the original one?**
      *   **(B) A new statue, just a perfect copy of the original?**
      *   **(C) Neither, it's just particles rearranged again.**

  4.  **Reshaped Into Something Else:** Instead of squashing it, the sculptor takes the finished statue and carefully reshapes the *same clay* into a completely *different statue* (e.g., a horse instead of a person). When she finishes the horse statue...
      *   **(A) The original person-statue is gone. The horse-statue is a new thing.**
      *   **(B) The original thing (the clay/lump) is still there, just shaped like a horse now.**
      *   **(C) The particles are arranged horse-wise now. That's all.**

  5.  **Gradual Replacement:** Over a year, every single particle in the statue is secretly swapped out, one by one, with a new particle of the same type, until none of the original particles remain. At the end of the year, is the statue still there?
      *   **(A) Yes, it's the same statue.**
      *   **(B) No, it's a different statue made of new material.**
      *   **(C) It's particles arranged statue-wise, but not a persistent 'statue' object.**

  6.  **Broken Finger:** A finger breaks off the statue. It sits in a drawer for a week. Then it's glued perfectly back on. After it's glued back on, is the statue whole again?
      *   **(A) Yes, it's the same statue, just temporarily damaged.**
      *   **(B) No, the original statue was destroyed when the finger broke off. This is a repaired statue.**
      *   **(C) It's particles arranged statue-wise again.**

  7.  **Ancient Clay:** The clay used to make the statue sat buried in the ground for thousands of years before the sculptor dug it up. Before the sculptor shaped it, was the statue already there?
      *   **(A) No, the statue only came into existence when the sculptor shaped the clay.**
      *   **(B) Yes, the statue was already there as a lump, waiting to be revealed.**
      *   **(C) No, and there wasn't a distinct lump either - just particles arranged lump-wise.**

  8.  **Twin Statues:** A sculptor pours liquid clay from one batch into two identical molds side-by-side, creating two indistinguishable statue shapes. She points at one and says, "That is my statue 'Hope'." What makes her statement true?
      *   **(A) That particular portion of clay, arranged as it is right now.**
      *   **(B) That particular portion of clay *plus* the fact that she designated it as 'Hope'.**
      *   **(C) The arrangement of the particles and her pointing/designation.**

  9.  **Statue & Doorstop:** A sculptor makes a statue out of clay, deliberately designing it to also be heavy enough and stable enough to function perfectly as a doorstop. Before it gets squashed, how many distinct objects are sitting there?
      *   **(A) One: It's just a lump of clay shaped a certain way.**
      *   **(B) Two: There is a statue *and* a doorstop made of the same clay.**
      *   **(C) Three: There is a lump of clay, a statue, and a doorstop.**

  10. **Insured:** The lump of clay has an insurance policy that covers accidental damage to *the lump of clay*, but specifically excludes coverage for damage to "works of art". The statue (made from that insured clay) gets squashed. Should the insurance pay out?
      *   **(A) Yes: The lump of clay was damaged.**
      *   **(B) No: The work of art (the statue) was destroyed, and it's excluded.**
      *   **(C) Maybe/Debatable: It depends on whether you focus on the lump or the statue.**

  ---

  **Scoring Key & Analysis**

  This key maps combinations of answers to the 8 target views. Views are defined by their answer patterns.

  1.  **Nothing Survives Any Change (Mereological Nihilism / Radical Eliminativism):**
      *   **Pattern:** Consistently chooses (C) in questions 1, 2, 3, 4, 5, 6, 7. Likely chooses (A) in 8 (focusing strictly on the matter *now*), (A) in 9 (only matter counts), and (A) or (C) in 10 (only matter damaged).
      *   **Core:** Rejects the existence of any composite objects beyond fundamental particles. Statues and lumps are just ways of talking about particle arrangements.

  2.  **No Statues (Eliminativism about Artifacts / Only Particles):**
      *   **Pattern:** Chooses (B) or (C) for the statue in 1, (A) for the lump in 2. (B) or (C) in 3, 4. (B) or (C) in 5. (B) or (C) in 6. (A) in 7. Likely (A) in 8 (lump/clay), (A) in 9 (only lump), (A) in 10 (lump damaged).
      *   **Core:** Lumps (as parcels of matter) exist and persist through reshaping/replacement (within limits), but statues do not exist as distinct entities. Only question 1B/1C + 2A is essential. Other answers flow from denying artifacts.

  3.  **Two Things in One Place (Co-locationism):**
      *   **Pattern:** Strong tendency towards (B) in 1 (statue destroyed), (A) in 2 (lump survives). (B) in 3 (new statue), (A) in 4 (statue gone, lump persists), (B) in 5 (different statue), (B) in 6 (destroyed then repaired). (A) in 7. (B) or (C) in 9 (at least 2 things). (C) or debate in 10.
      *   **Core:** The lump and the statue are distinct objects occupying the same space, with different persistence conditions (lump survives squashing/replacement, statue does not). Key is 1B + 2A. Answering 1A or 2B breaks this.

  4.  **Clay Constitutes Statue (Constitution View):**
      *   **Pattern:** *Identical to Co-locationism (View 3) in all answer choices.* (B) in 1, (A) in 2, (B) in 3, (A) in 4, (B) in 5, (B) in 6, (A) in 7, (B/C) in 9, (C) in 10.
      *   **Core:** While constitution theorists avoid saying there are *two* objects (preferring "the lump constitutes the statue"), their view requires distinct persistence conditions leading to the *exact same answers* as co-locationism in all these cases. They distinguish the objects conceptually/relationally, but the practical outcomes are identical.

  5.  **Four-Dimensional Overlap (Perdurantism / Worm View):**
      *   **Pattern:** (B) in 1 (statue-stage destroyed), (A) in 2 (lump-worm persists). (A) in 3 (same statue-worm), (A) in 4 (same lump-worm, statue-worm ended, new statue-worm started). (A) in 5 (same statue-worm). (A) in 6 (same statue-worm). (A) in 7. (A) in 8 (portion of clay). (A) in 9 (only one 4D object - the lump-worm - though it has statue-phases and doorstop-phases). (A) in 10 (lump-worm damaged).
      *   **Core:** Both lump and statue are 4D "worms" in spacetime. The lump-worm extends before, during, and after the statue-phase. The statue-worm only exists during the time the clay is statue-shaped. They overlap during the statue-phase. Persistence is having temporal parts. Key is survival through change (A in 3,5,6) *except* when a *kind* change occurs (B in 1, A in 4 - statue-worm ends).

  6.  **Momentary Stages (Exdurantism / Stage View):**
      *   **Pattern:** *Identical to Perdurantism (View 5) in all answer choices.* (B) in 1, (A) in 2, (A) in 3, (A) in 4, (A) in 5, (A) in 6, (A) in 7, (A) in 8, (A) in 9, (A) in 10.
      *   **Core:** Exdurantists say we refer to momentary stages. "The statue persists" means the current stage bears the "persistence relation" (like gen-identity or counterpart relations) to past stages. Crucially, *in all the cases asked*, the persistence relations for lump-stages and statue-stages would be defined such that the answers match Perdurantism exactly. The difference is metaphysical (what exists at a time - stages vs worms), not in what persists through the described changes.

  7.  **One Thing (Identity / Classical Endurantism - Lump Primacy):**
      *   **Pattern:** (A) in 1 (lump survives, so "statue" survives as lump), (A) in 2 (lump survives). (A) in 3 (same lump reshaped). (B) in 4 (Same lump, was statue, now horse-statue). (A) in 5 (Same lump). (A) in 6 (Same lump). (B) in 7 (Statue didn't exist before shaping). (A) in 9 (One object: the lump). (A) in 10 (Lump damaged, pay out).
      *   **Core:** There is only one object here: the lump of clay. It temporarily has the property of being statue-shaped. The statue isn't a distinct entity. Persistence is the lump enduring through changes. Key is 1A + 2A + 4B (emphasizes lump identity over shape). *Note: A "Statue Primacy" view (1B+2B) is possible but very rare/unappealing - see below).*

  8.  **Depends / Conventional (Sortal-Relative Identity / Contextualism):**
      *   **Pattern:** Highly context-dependent. Likely (A) or (B) in 1 depending on focus. (A) in 2. (A) in 3 *if* focusing on material/lump, (B) in 3 *if* focusing on artistic identity. (A) in 4. (A) in 5. (A) in 6. (B) in 8 (designation matters). (B) or (C) in 9. (C) in 10.
      *   **Core:** Whether something survives or is the same depends on *what kind of thing* we are considering it as ("sortal"). The lump survives squashing *as a lump* but not *as a statue*. The statue might "survive" reassembly *as an artwork* but not *as a material object*. Key indicators are (B) in 8 (designation matters), (C) in 10 (depends on perspective), and potential inconsistency between 1 and 3 driven by context (e.g., 1B but 3A).

  ---

  **Analysis of Logical Space & Quiz Performance**

  1.  **Indistinguishable Pairs:**
      *   **Co-locationism (3) vs Constitution (4):** As predicted, these views yield **identical answers to every single question**. The metaphysical difference (two distinct objects vs one object constituted by another) does not manifest in different survival judgments for the cases given. *No further case could pry them apart; the difference is not empirical but metaphysical interpretation.*
      *   **Perdurantism (5) vs Exdurantism (6):** Similarly, these views yield **identical answers to every single question**. The difference (persisting wholes with temporal parts vs momentary stages linked by relations) does not result in different judgments about what exists or survives through the described changes in these scenarios. *No case within the persistence paradigm could distinguish them; it requires asking about the nature of existence at an instant.*
      *   **"Nothing Survives" (1) vs "No Statues" (2):** These are distinct but overlap significantly. View 1 (C in 1,2,3,4,5,6,7) is stricter than View 2 (B/C in 1, A in 2, B/C in 3,4, B/C in 5, B/C in 6, A in 7). Question 2 is key: View 2 *must* answer (A) (Lump survives), View 1 will likely answer (C). Question 7 (A) also distinguishes them (View 2 accepts lumps existed before shaping, View 1 does not).

  2.  **Unoccupied/Incoherent Combinations:**
      *   **1A (Statue survives squash) + 2B (Lump destroyed):** "Statue Primacy". Extremely rare/unappealing. Suggests the *form* is primary and the matter incidental. Hard to reconcile with gradual replacement (5) or ancient clay (7). Possible but requires very strained intuitions (e.g., statue survives squash but only if you ignore the loss of form? Lump destroyed by shaping?).
      *   **Consistent (C) answers except on functional/conventional questions (8,9,10):** If someone answers (C) for 1-7 but then (B) for 8 or 9, it suggests inconsistency. Radical eliminativism (View 1) shouldn't suddenly count functional or conventional objects. (C) should be chosen consistently or functional answers (A) should prevail.
      *   **1B (Statue destroyed) + 2B (Lump destroyed):** This suggests *nothing* survives even the initial shaping, which is highly counterintuitive and doesn't map cleanly to a standard view. Might be a nihilist inconsistency or an extreme temporal part view where the pre-statue lump-stage and statue-stage are considered utterly distinct objects.

  3.  **Questions with Little Discriminatory Power (Near Consensus):**
      *   **Question 7 (Ancient Clay):** Almost everyone answers (A) - the statue wasn't there already. Only View 1 (C) and the very rare "Statue Primacy" (if it existed) might differ. Doesn't distinguish the main views.
      *   **Question 8 (Twin Statues):** While answers vary (A, B, C), they don't strongly correlate solely with the 8 target views in a unique way. Designation (B) strongly suggests Conventionalism (8), but other views can also choose (B). (A) is chosen by many views (5,6,7,2,1). Doesn't cleanly separate groups.
      *   **Question 9 (Statue & Doorstop):** Primarily distinguishes Conventionalism (8 - B/C) from the others (mostly A). Also distinguishes Co-location/Constitution (3/4 - B/C) from One Thing (7 - A) and 4D views (5/6 - A). Useful, but not unique per view.

  4.  **Key Discriminating Questions:**
      *   **1A vs 1B vs 1C:** Fundamental split on whether the statue *object* survives loss of form. (C) -> View 1; (B) -> Views 3/4 or View 7 (if also 2B); (A) -> Views 5/6 or View 7 (if also 2A).
      *   **2A vs 2B vs 2C:** Fundamental split on whether the lump *object* survives change of form. (C) -> View 1; (B) -> Very rare "Statue Primacy"; (A) -> Views 2, 3/4, 5/6, 7, 8.
      *   **3A vs 3B vs 3C:** Tests if exact form restoration recovers identity. (A) -> Views 5/6, 7, 8 (sometimes); (B) -> Views 3/4, 2; (C) -> View 1. Crucial for distinguishing 4D/Stage/One Thing from Co-location/Constitution/Eliminativism.
      *   **4A vs 4B:** Tests if identity survives *any* reshaping. (B) -> Views 5/6, 7; (A) -> Views 3/4, 2, 8. Distinguishes matter-persistence from form/kind-persistence.
      *   **5A vs 5B vs 5C:** Ship of Theseus. (A) -> Views 5/6, 7, 8; (B) -> Views 3/4, 2; (C) -> View 1.
      *   **6A vs 6B vs 6C:** Temporary Disassembly. (A) -> Views 5/6, 7, 8; (B) -> Views 3/4, 2; (C) -> View 1. Confirms pattern from 3,4,5.
      *   **10A vs 10B vs 10C:** Practical application highlighting the lump/statue distinction. (A) -> Views 2, 5/6, 7; (B) -> Views 3/4; (C) -> View 8. Very useful for spotting Conventionalism and reinforcing Co-location/Constitution.

  **Conclusion:** This quiz effectively sorts participants into 6 distinct answer profiles corresponding to the 8 target views (with Co-location/Constitution and Perdurantism/Exdurantism collapsed into single profiles each). The key questions (1, 2, 3, 4, 5, 6, 10) provide strong discrimination. While Questions 7, 8, and 9 offer interesting discussion points and support the classification (especially 9 & 10 for Conventionalism), they don't independently discriminate the core metaphysical views as powerfully as the other questions. The inability to distinguish the paired views (3/4 and 5/6) is inherent to the problem and the case-based approach; those differences require engaging with the underlying metaphysics directly. This quiz provides a robust, jargon-free way to map intuitive judgments onto the landscape of persistence theories. Enjoy the pub debate!
