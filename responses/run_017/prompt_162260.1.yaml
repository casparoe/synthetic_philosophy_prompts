  ### Case: Condo Board Vote on Roof Replacement

  A 21-unit condo building requires 14 votes to approve a $100,000 roof replacement, split equally among units. The board announces that 13 owners will vote "yes," 5 will vote "no," and 3 (including you) are undecided. Each unit faces $5,000 in expected water damage if the roof fails. However, you and the other undecided owners possess private signals about potential hidden structural issues. If present, these issues would increase the cost by 50% (to $150,000) and render the replacement ineffective, leaving damage unchanged. Signals are independent: in a good state (no issues), a high signal (s_H) occurs with 70% probability; in a bad state (issues exist), a low signal (s_L) occurs with 70% probability. Voters vote "yes" on s_H and "no" on s_L. You received s_L, indicating likely issues. The other undecided voters will vote based on their signals.  

  ---

  ### 1. Naive Pivotalness Calculation and Verdict
  - **Pivotal scenario**: Your vote decides the outcome only if both other undecided voters vote "no" (probability = 0.5 × 0.5 = 0.25, assuming independent signals and no information update).  
  - **Stakes**:  
    - If you vote "yes" and the project passes: net benefit = damage avoided ($5,000) - your cost ($100,000 / 21 ≈ $4,761.90) = +$238.10.  
    - If you vote "no" and the project fails: net cost = -$5,000 (unavoided damage).  
  - **Expected value of voting "yes" over "no" in pivotal event**: (0.25) × [$238.10 - (-$5,000)] = 0.25 × $5,238.10 ≈ **+$1,309.53**.  
  - **Verdict**: Vote "yes" (expected benefit outweighs cost).  

  ---

  ### 2. Revised Calculation Conditional on Pivotalness  
  - **What pivotalness reveals**: Your vote is pivotal only if both other undecided voters vote "no," meaning both received s_L. This outcome provides evidence about the state of the roof:  
    - Prior: P(good state) = P(bad state) = 0.5.  
    - Likelihood of three s_L signals (yours and two others):  
      - P(three s_L | good) = (0.3)^3 = 0.027.  
      - P(three s_L | bad) = (0.7)^3 = 0.343.  
    - Posterior:  
      - P(good | three s_L) = (0.5 × 0.027) / [(0.5 × 0.027) + (0.5 × 0.343)] ≈ 0.073.  
      - P(bad | three s_L) ≈ 0.927.  
  - **Revised stakes conditional on pivotalness**:  
    - **Vote "yes" (project passes)**:  
      - Good state: net benefit = $5,000 - $4,761.90 = +$238.10.  
      - Bad state: net cost = your share ($150,000 / 21 ≈ $7,142.86) + $5,000 damage (unavoided) = -$12,142.86.  
      - Expected utility = (0.073 × $238.10) + (0.927 × -$12,142.86) ≈ **-$11,243.42**.  
    - **Vote "no" (project fails)**:  
      - Good state: net cost = -$5,000 damage.  
      - Bad state: net cost = -$5,000 damage (same as good state, since damage is unavoidable regardless).  
      - Expected utility = (0.073 × -$5,000) + (0.927 × -$5,000) = **-$5,000**.  
  - **Comparison**:  
    - Voting "no" yields -$5,000.  
    - Voting "yes" yields -$11,243.42.  
  - **Verdict**: Vote **"no"** (expected utility of voting "no" is higher by $6,243.42).  

  ---

  ### 3. Single Structural Feature Doing the Work  
  **Informational coupling between pivotalness and state desirability**: The event of being pivotal (requiring both other undecided voters to vote "no") reveals that all three undecided voters received s_L signals, which drastically increases the probability of the bad state. In the bad state, the project is actively harmful (high cost with no damage prevention), making your "yes" vote detrimental.  

  ---

  ### 4. Case Without the Feature (Collapse to Ordinary Argument)  
  **Modified scenario**: The other undecided voters base their votes on coin flips (50% "yes," 50% "no") rather than signals, so their votes convey no information about the roof’s state.  
  - **Pivotalness**: Unchanged (your vote decides the outcome if both others vote "no," probability = 0.25).  
  - **Calculation**:  
    - Posterior = Prior (no update from votes): P(bad) = 0.5 (based solely on your s_L signal).  
    - Expected utility of voting "yes" in pivotal event:  
      - Good state: +$238.10 (50% weight).  
      - Bad state: -$12,142.86 (50% weight).  
      - Average: 0.5 × $238.10 + 0.5 × -$12,142.86 ≈ **-$5,952.38**.  
    - Voting "no" in pivotal event: -$5,000.  
  - **Verdict**: Vote **"no"** (since -$5,000 > -$5,952.38), but only because your private signal already suggests risk. The gap between naive and revised calculations vanishes because pivotalness no longer provides new information about the state. The ordinary inefficacy reply fails here due to pre-existing uncertainty, not pivotalness-based evidence.  

  ---

  ### 5. Strongest Reply for Defending the Naive Calculation  
  **Challenge the informational assumption**: The naive calculation holds if voters doubt the reliability or independence of others’ signals. For example:  
  - If the agent believes other undecided voters ignore signals and vote randomly (e.g., due to apathy or error), their "no" votes cease to indicate a bad state. Pivotalness then carries no evidence about the roof’s condition, and the posterior reverts to the agent’s private belief (P(bad) ≈ 0.7 with s_L).  
  - Expected utility of voting "yes" in pivotal event:  
    - 0.7 × -$12,142.86 + 0.3 × $238.10 ≈ -$8,500.  
  - Expected utility of voting "no": -$5,000.  
  - **Result**: Voting "no" is *still* preferred, but only because the agent’s private signal dominates. If the agent ignores signals entirely and assumes a 50% prior (no private information), the naive argument prevails: voting "yes" has expected value 0.5 × $238.10 + 0.5 × -$12,142.86 = -$5,952.38, while voting "no" yields -$5,000—a narrower gap where the high-stakes upside in the good state might still justify voting "yes" under risk neutrality.  

  This reply exploits ambiguity about voters’ rationality to preserve the naive model, but it requires abandoning the setup’s core premise (that votes reflect signals about the state).
