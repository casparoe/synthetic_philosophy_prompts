     - But note: we are comparing the utility of the outcomes caused by your vote. In the pivotal event, if you vote yes, you cause the project to pass, yielding the above expected utility of -6602.63. If you vote no, you cause the project to fail, yielding -6854.06. Since -6602.63 > -6854.06, it seems voting yes is better. 

