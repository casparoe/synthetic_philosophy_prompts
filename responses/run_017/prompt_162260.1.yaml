  **5. The Strongest Reply for the Naive Calculation:**

  The strongest reply is to argue that the other voters' signals are not informative enough, or that the prior probability of the bad state is too low to outweigh the potential gain in the good state. For instance, if the prior probability of θ_bad is not 50% but much lower (say 10%), then even after seeing two s_L signals, the posterior might not be high enough to offset the large potential gain in the good state. Alternatively, one might challenge the signal quality (the conditional probabilities) or argue that the other undecided voters are not voting based on signals but on other factors. In particular, if the agent has a very strong private signal (or expertise) that overrides the information from others' votes, then she might still vote yes.

  But in our case, we assumed the agent also has a signal s_L. Without conditioning on the others' votes, she already has a signal that makes her think θ_bad is 70% likely. But then seeing two more s_L signals updates it to 93%. The reply might be that the signal structure is not common knowledge or that the other voters might not be using their signals wisely. However, within the Bayesian framework, the calculation holds.

  The strongest reply might be to note that the expected value of voting yes overall (not conditional on being pivotal) might still be positive, and since the probability of being pivotal is positive, voting yes is the right choice. But this reply would require doing the calculation unconditionally, which we have not done. However, in the conditional-on-pivotal approach, we are exactly looking at the event where your vote matters, and there we find that you should vote no. So the reply might be to reject the conditional-on-pivotal approach and to do the overall expected utility calculation for each action (vote yes, vote no, abstain) over all possible outcomes.

  But that is beyond the scope of the conditional analysis. In the standard treatment of pivotal voting, we condition on the pivotal event.

