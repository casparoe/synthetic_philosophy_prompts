  ### How the Poem Embodies the Game  
  - **Initial State (All Strategies Intact):**  
    The first stanza lists all six strategies. Without mixtures (stanza 2), no strategy is dominated—none are eliminated.  

  - **Down Eliminated by Mixed Up/Middle:**  
    - The blend line "**_I scale the ridge for no daylight's pain_**" splices halves of Up ("I scale the peak") and Middle ("no loss, no pain").  
    - This new line (stanza 3) dominates Down ("I crawl the marsh...")—neither Up nor Middle alone could do this.  
    - Down disappears after stanza 3.  

  - **Center Eliminated by Mixed Left/Right (After Down is Gone):**  
    - The same blend of Left/Right ("**_I guard the east with storm's sharp campaign_**") fails to dominate Center in stanza 4 (when Down is present) but succeeds in stanza 5 (after Down is removed).  
    - Center ("I keep the heart...") vanishes after stanza 5.  

  - **Final State (No Further Dominance):**  
