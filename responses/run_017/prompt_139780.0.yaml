  ### Iterated Dominance: A Game in Verse  

  **Strategies Key (for reference only; not part of poem):**  
  - **Up:** "I scale the peak for daylight's gain"  
  - **Middle:** "I walk the ridge, no loss, no pain"  
  - **Down:** "I crawl the marsh where shadows reign"  
  - **Left:** "I guard the west, a sharp refrain"  
  - **Center:** "I keep the heart, a steady chain"  
  - **Right:** "I storm the east, a bold campaign"  

  **The Poem:**  

  I scale the peak for daylight's gain,  
  I walk the ridge, no loss, no pain,  
  I crawl the marsh where shadows reign,  
  I guard the west, a sharp refrain,  
  I keep the heart, a steady chain,  
  I storm the east, a bold campaign.  

  Alone, each choice could stand unchanged—  
  No single line is yet estranged.  
  No single line is yet estranged—  
  Alone, each choice could stand unchanged.  
  I scale the peak for daylight's gain  
  Meets marsh and heart, but stands unstained.  
  I walk the ridge, no loss, no pain  
  Holds fast where west and east complain.  
  I crawl the marsh where shadows reign  
  Defeats the west? No, dread remains.  

  But blend the peak and ridge’s art—  
  A spliced reply, a coin-tossed part:  
  **_I scale the ridge for no daylight's pain_**  
  (Not peak alone, nor ridge’s gain).  
  This half-and-half now shreds the marsh:  
  **_I scale the ridge for no daylight's pain_**  
  Outshines the shadows, dark and harsh,  
  In every counter, every harsh  
  Retort from west, east, heart’s arcane.  
  The marsh is gone—no more to start.  

  I guard the west, a sharp refrain,  
  **_I scale the ridge for no daylight's pain_**,  
  I keep the heart, a steady chain,  
  I storm the east, a bold campaign.  

  Now left and right, though fierce, were weak  
  Against the heart when marsh could speak.  
  But marsh is gone—a void, a blank—  
  So blend the flanks, left-right, and think:  
  **_I guard the east with storm's sharp campaign_**  
  (Not left alone, nor right’s domain).  
  This half-and-half now breaks the heart:  
  **_I guard the east with storm's sharp campaign_**  
  Outplays the center’s steady art,  
  Where heart once thrived, now falls apart.  
  The chain is cut—no more to start.  

  I scale the peak for daylight's gain,  
  I walk the ridge, no loss, no pain,  
  I guard the west, a sharp refrain,  
  I storm the east, a bold campaign.  

  No blend now claims a further kill—  
  Four lines stand whole, no voice to spill  
  A path through what the mixtures prune.  
  The peak, the ridge, west, east—immune.  
  But see the halves that cleared the way:  
  **_Scale-ridge_** and **_guard-storm_**—do they stay  
  As final plays? The poem won’t say.  
  We killed with coins, then tossed away  
  The random aid we’d begged to borrow,  
  Leaving the pure to face tomorrow.  

