prompt: |-
  I've somehow ended up with the training slot for our new pricing analysts — small specialty insurer, we underwrite gig-economy couriers (e-bikes, mopeds, the occasional car), room of about fifteen, most of them have had exactly one applied stats class and they all talk as if a probability is a property of a single case, the way a weight is. I've got 75 minutes and I want to spend it on the reference class problem. Don't explain the problem to me, I've done enough reading on it; I want the plan for the explanation.

  The order is what I keep going back and forth on. My instinct is to open by making them each commit to a number for one named applicant — what's the chance this person has an at-fault claim in the next year — write the numbers on the board, and only then show that the number moves when nothing about the applicant changes and no new evidence arrives, only the description of her. Is that the right entry point, or does something have to be in place before that even stings? And where in the sequence do the three things the problem can mean get separated: which class's frequency *is* the probability, which class's frequency should inform the number we act on, and the it-just-depends-what-question-you're-asking move that dissolves the whole thing? I'm fairly sure that last one has to be earned rather than granted, and I don't know whether it belongs at the end or whether it should be floated early and then made to fail.

  The carrying example is where I'm stuck. My candidate: one applicant, 24, delivers by e-bike in a dense city, 30 hours a week, one prior at-fault collision, top-decile on our telematics safety score. Classes I can put her in — 24-year-old riders, urban e-bike couriers, riders with a prior claim, top-decile telematics scorers — all non-gerrymandered, all with rates I can quote, differing by a factor of several, and none of them is a subset of another. Does that work? It might not: every one of those classes is a feature sitting in our database, so I'm terrified someone will just say condition on all of it, fit a model, done — and the session deflates into a complaint about regression. So: what does the example have to have, and what does it have to lack, so that move isn't available? Should the classes be nested or cross-cutting, should the rates differ wildly or only a little, and should there be a decision with money attached to it or does that muddy things?

  Misconceptions — I'm guessing: that there's a true reference class out there and we're just short of data; that this is base-rate neglect again (it's almost the inverse, isn't it?); that it's Simpson's paradox in a hat; that more data fixes it; that the fix is use the narrowest class you can describe; and that if the number is reference-class-relative then anything goes. Tell me which of those I've got wrong, where in the sequence each one has to be headed off, and which ones are specific to an audience that prices things for a living and will want a rate at the end.

  Two wrenches I want placed. One: the narrowest class you can describe eventually contains just her, and the frequency there is 0 or 1 — where does that go, and is it the natural bridge to why you can't always condition on everything? Two: we have a real bad habit here of re-slicing a book with segments like couriers who claimed in their first 60 days, which is picking the class after you've seen the outcome. I want that in, but I can't tell if it's the same lesson or a different one wearing the same clothes.

  Also: if I make one of the classes her age or her gender it turns into a compliance argument about what we're allowed to use. Do I keep that out of the carrying example and bring it in at the end, or is that version the one they actually need? And give me the order I should reveal the numbers in — do I show all the class rates up front or make them commit first?

  At the end I need one thing to have them *do* that separates getting it from having learned the phrase it depends on the reference class. And tell me what I should explicitly refuse to cover in 75 minutes and say out loud that I'm refusing it.
reasoning: |-
  Okay, let me unpack this pricing analyst training challenge. The user needs a tightly structured 75-minute session on the reference class problem for their team of insurance pricing analysts. 

  First, I notice several key tensions in their thinking:
  - They want the "sting" of realizing probabilities shift based on description alone, but worry about prerequisite understanding
  - They need to differentiate three distinct interpretations of the problem (ontological vs epistemic vs decision-theoretic)
  - The carrying example risks derailment into regression talk
  - There's concern about compliance topics hijacking the core lesson

  The team's context matters here: small insurer, gig-economy focus, analysts with basic stats but frequentist tendencies. The user's clearly battled this before - they mention the team's bad habit of post-hoc segmentation and treating probability as inherent property.

  For sequencing, I think their instinct is solid: start with the personal probability commitment. That creates cognitive dissonance when descriptions change. But we need to scaffold it carefully:
  1. First create the individual judgment trap
  2. Then reveal how reference classes change that number
  3. Only then unpack why this happens

  The carrying example needs surgical design. Must avoid:
  - Any class that could be combined (no overlapping features)
  - Narrowest class being the individual
  - Any regression-solvable scenario

  So perhaps:
  - Urban e-bike couriers (broad)
  - Top-decile telematics with prior claim (narrow but mixed)
  - 24yo females in metro areas (demographic trap)
  - Single-person class (the logical extreme)

  This forces confrontation with the impossibility of "true" class. The telematics-prior claim combo is key - it's narrow but not narrowest, and conflicts with other classes.

  On misconceptions:
  - "True class exists" → destroy via single-person class
  - "More data fixes" → show conflicting narrow classes
  - "Narrowest is best" → demonstrate instability
  - "Anything goes" → introduce decision context later

  The two wrenches should come sequentially:
  - Narrowest-to-single-person first (epistemic limit)
  - Then post-hoc segmentation (methodological flaw)

  Compliance topics must wait. The "gender" version should be a separate module - today is conceptual foundations. 

  For the reveal order: commit first, show class rates after, then reveal overlap conflict. The moment when they realize the same person belongs to multiple conflicting-rate classes is golden.

  Closing activity: Have them assign rates to three identical applicants described through different class lenses. Forces operational translation of the concept.

  What to explicitly exclude: 
  - Regression techniques (different session)
  - Compliance/rating factor legality
  - Full decision theory frameworks
  - Simpson's paradox (adjacent but distinct)

  This keeps the 75 minutes focused on the core paradox. The user's right - the "it depends" realization must be earned through frustration.
answer: |-
  Here's a battle-tested plan for your 75-minute session, designed to maximize the "sting" while preempting deflation into regression talk. Structure follows the pain curve: **Induce cognitive dissonance → Diagnose the problem → Explore implications → Build guardrails.**

  ---

  ### **Order of Operations (75-Minute Flow)**
  1.  **Commit & Confront (15 min):**  
      - Start cold: *"Write your estimate: Probability that 'Alex' (24yo, urban e-bike courier, 30h/wk, 1 prior at-fault claim, top-decile telematics) has an at-fault claim next year."*  
      - Have them write numbers **anonymously** on sticky notes → post on board. **Do not discuss yet.**  
      - Reveal the range. Highlight wild variation: *"Same person, same facts. Why such different numbers?"*  
      - **Key:** Let discomfort simmer. Don’t resolve yet.  

  2.  **Introduce Reference Classes (10 min):**  
      - Show Alex belongs to multiple classes with *published claim rates*:  
        - *All urban e-bike couriers*: 12%  
        *- Top-decile telematics scorers*: 5%  
        *- Riders with 1 prior claim*: 18%  
        *- 24-year-old riders*: 15%  
      - **Crucial move:** Point out these classes are:  
        - **Non-hierarchical** (no class is a subset of another)  
        - **Non-exhaustive** (Alex belongs to all simultaneously)  
        - **All valid** (based on our data, no cherry-picking)  
      - *"Which rate is Alex’s ‘true’ probability? Does your initial estimate match any?"*  

  3.  **The Three Meanings: Separate & Contrast (15 min)**  
      Tackle misconceptions by framing three distinct questions:  
      | **Question**                | **What it asks**                          | **Misconception Addressed**                |  
      |-----------------------------|------------------------------------------|-------------------------------------------|  
      | Ontological: “What *is* Alex’s probability?” | Assumes probability is inherent (like weight) | Head off “true class” fallacy early |  
      | Epistemic: “What rate should *inform* our estimate?” | Where to anchor amid uncertainty | “Use narrowest class” or “more data fixes it” |  
      | Decision-Theoretic: “What number should we *use*?” | Driven by business impact/risk tolerance | “Anything goes” relativism |  
      - **Emphasize:** The ontological view *must* die here. Probability isn’t a property of Alex; it’s a property of the *description*.  

  4.  **Wrench #1: The Narrowest Class Trap (10 min)**  
      - *"What if we define a class just for Alex? 24yo, top-decile telematics, prior claim, urban e-bike..."*  
      - Show this class has *n=1* → frequency = 0% or 100% (useless).  
      - **Bridge to regression:** *"Why can’t we condition on everything? Because we hit data sparsity instantly. Models help interpolate, but they don’t solve the reference class choice – they hide it in feature selection."*  

  5.  **Wrench #2: The Segmented Book Problem (10 min)**  
      - Use your real-world example: *"Couriers who claimed in first 60 days"*.  
      - *"Is this a valid reference class for *prospective* pricing?"* → **No!** Outcome-based slicing leaks future info.  
      - Contrast with Alex’s classes: *Her* classes use *eligibility criteria* known upfront. This wrench is **causal direction**, not just reference class.  

  6.  **Decision Context & the "It Depends" Resolution (10 min)**  
      - **Now** introduce the "it depends" move. *"The epistemic/decision split isn’t a cop-out – it’s where business lives."*  
      - Example: Should we price Alex using the *telematics class* (5%) because it’s most predictive? Or the *prior-claim class* (18%) because we’re wary of recidivism?  
      - Tie to risk appetite: *"If our capital is thin, we might use the 18% even if we believe 5% is ‘truer’."*  
      - **Earn the relativism:** Show how collapsing epistemic/decision questions causes the problem.  

  7.  **Close: "Do" Activity (5 min)**  
      - **Scenario:** *"You’re renewing Alex’s policy. You see she’s now also part of ‘riders who work >25h/wk in rain-prone cities’ (rate: 22%). What rate do you assign, and why?"*  
      - Have them defend their choice using:  
        - Epistemic justification (best-supported estimate)  
        - Decision justification (business impact)  
      - **This separates "getting it" from jargon:** They must articulate tradeoffs.  

  ---

  ### **Carrying Example: Non-Negotiables**
  - **Why your candidate works:**  
    - Classes are **cross-cutting** (not nested) → forces confrontation with multiple truths.  
    - Rates differ **wildly** (5% vs 18%) → makes variation undeniable.  
  - **Defusing the "just use regression" rebuttal:**  
    - Point out: *"Even if we model P(claim|age, telematics, prior, ...), how do we handle a new rider whose telematics score is top-decile* but *prior claim was severe? Our model has never seen this combo."* → Models can’t avoid sparse cells.  
    - **Add a class your model ignores:** E.g., *"Riders who deliver at night >50% of shifts"* (rate: 20%). *"Should this be a feature? Why/why not?"* → Forces choice about what defines a "relevant" class.  

  ---

  ### **Misconceptions: Where to Kill Them**
  | **Misconception**                          | **When to Address**          | **How**                                                                 |  
  |--------------------------------------------|------------------------------|-------------------------------------------------------------------------|  
  | "Probability is inherent"                  | Step 1 (Commit & Confront)   | Range of initial estimates → no consensus.                              |  
  | "There’s a ‘true’ reference class"         | Step 3 (Three Meanings)      | Ontological view is incoherent; Alex belongs to all classes equally.    |  
  | "Use the narrowest class"                  | Step 4 (Narrowest Class)     | Show n=1 class is absurd.                                               |  
  | "More data fixes this"                     | Step 4                      | Sparsity is inevitable; data doesn’t pick the *right* class.            |  
  | "It’s base-rate neglect"                   | Step 3                      | *"Base-rate neglect ignores a class; this drowns you in classes."*      |  
  | "Simpson’s paradox"                        | DON’T                       | Too complex; say *"Related, but different issue"* if asked.             |  
  | "Reference-relativity → ‘anything goes’" | Step 6 (Decision Context)    | Constrain with business purpose/model governance.                       |  

  ---

  ### **Compliance, Reveals & Omissions**
  - **Gender/age in example:** **Exclude initially.** Use your candidate (telematics, prior claim, etc.). Save compliance for a follow-up. Today is conceptual.  
  - **Reveal sequence:** Commit blind → Show class rates → Reveal Alex is in all. **Maximum dissonance when they realize their "Alex estimate" ignores competing rates.**  
  - **Explicitly refuse to cover (say this upfront):**  
    *"We won’t solve this today with regression, causal diagrams, or rating factor legality. Those are separate sessions. Today is about seeing the problem in your gut."*  

  ---

  ### **Why This Works**
  - **Starts with visceral confusion** (their numbers vary wildly).  
  - **Uses their language** ("rates," "classes") but subverts it.  
  - **Makes the problem costly:** Wildly differing class rates → impacts pricing.  
  - **Prevents regression escape** by focusing on non-overlapping classes and sparsity.  
  - **Ends with agency** ("Here’s how we navigate this, even unsolved").  

  **Final tip:** When someone says *"But in a model—"*, respond: *"What reference classes did you encode as features? Why those?"* Bring it back to the choice. You’ve got this.
