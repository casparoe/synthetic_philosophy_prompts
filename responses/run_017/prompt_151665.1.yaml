  ### 2. Residue Report

  **What Does Not Survive Translation:**  
  The crux is the **policy-dependent visitation distribution** in the gradient of \( J(\theta) \). In MDPs with perfect recall, the policy gradient theorem expresses \( \nabla J \) as an expectation over states, bypassing explicit visitation derivatives. Here, imperfect recall makes visitation derivatives unavoidable:  
  \[
  \nabla_\theta J(\theta) = \nabla_\theta \left[ \sum_{s} \mu^\pi(s) V^\pi(s) \right],
  \]  
  where \( \mu^\pi(s) \) is the state-visitation probability. The term \( \nabla_\theta \mu^\pi(s) \) is non-zero because \( \theta \) affects transitions to \( s_1 \) and \( s_2 \) (which share an observation). This violates the standard policy gradient theorem, which assumes no observation overlap.  

  **Non-Causal Functional:**  
  The ex-ante objective \( J(\theta) \) is **non-causal**: \( \theta \) influences both:  
  - Actions taken at intersections (causal effect).  
  - The belief distribution \( b(s_2) = \frac{1 - \theta}{2 - \theta} \) (non-causal effect, via visitation).  
  The formalism does not exclude such objectives but lacks tools to handle them efficiently. POMDP value functions typically assume beliefs are Bayesian updates from a fixed prior, but here the "prior" \( \mu^\pi \) is policy-dependent.  

  **Distinguishing "Plan" vs. "Act Now":**  
  The formalism **cannot express this distinction** directly. Both queries reduce to computing \( Q^\pi(a, o) \) under a policy. The ex-ante plan is a global \( \theta \)-optimization; "act now" is local Q-maximization given \( b \). The vocabulary treats both as computations under a fixed \( \pi \), obscuring the philosophical difference between precommitment and reoptimization.  

  **Translation Fudges:**  
  - **Belief as visitation distribution:** We defined \( b(s) \) via on-policy visitation \( \mu^\pi(s \mid o) \). This assumes ergodicity and ignores that the driver experiences at most two intersections. A cleaner approach uses game-theoretic information sets, but this exceeds MDP vocabulary.  
  - **Self-consistency as policy improvement:** The fixed-point solution masks that time-consistency is a circularity: \( \theta \) must be optimal given beliefs that depend on \( \theta \). This circularity is inherent but not explicitly modeled.

