  Noticing they're adamant about avoiding new data collection. Good call emphasizing conceptual work given the panel's bias - I'll position this as diagnosing why existing evidence gets misinterpreted rather than gathering more. The "no bibliography" request suggests they want to own the scholarly framing, so I'll leave conceptual gaps obvious for them to fill with citations.

  Practical constraints are tight: 6 months part-time, solo work. Might be overreaching with the three angles. Should prioritize the grain ambiguity and revealed preference methods as the backbone, mention the expectation coordination as a speculative extension. For cases, QWERTY/VHS are safe bets - familiar enough that inaccuracies won't derail the pitch.

  Biggest risk is vagueness in deliverables. Need to define "working paper" concretely - perhaps a decision tree for analyzing path dependence claims? And failure conditions must be explicit: if the cases don't reveal consistent thresholds, the framework collapses. Honesty about scope is key; I'll flag that the belief-lock-in feedback loop is probably phase two material.

  Tone-wise, they want intellectual honesty, not salesmanship. Important to stress where consensus exists (e.g., history matters) before isolating the actual disputes. British spelling is easy enough - "behaviour" with a 'u' it is. The casual register helps; phrases like "stuck in a rut" feel appropriate for seed funding.

  Final structure: 1) Frame the stalemate via grain confusion, 2) Revealed lock-in as the tool to cut through it, 3) Method as case reinterpretation, 4) Scope boundaries clear. The self-fulfilling prophecy bit goes in "future directions". And absolutely must include that line about "the disagreement is how much and when" - it captures their no-bullshit approach perfectly.
answer: |-
  Here’s a stripped-down, arguable draft for your seed grant proposal. It’s structured for clarity, addresses your core concerns, and flags assumptions transparently. Adapt ruthlessly.

  ---

  **Research Proposal: Cutting the Gordian Knot of Path Dependence – Resolving Stalemates Through Grain, Counterfactuals, and Revealed Lock-In**

  **1. Core Question:**  
  *How can we determine whether an established socio-technical outcome was genuinely "locked-in" (path dependent) or functionally inevitable, given persistent ambiguities in how we define outcomes, test counterfactuals, and interpret evidence?*

  **2. The Stalemate & Why It Persists:**  
  The debate between "strong path dependence" (specific outcomes are contingent and locked-in) and "inevitability" (functional equivalents emerge regardless of path) is stuck. This isn't due to lack of cases or effort, but because **both sides often answer subtly different questions without reconciling three fundamental ambiguities:**

  *   **Ambiguity 1: The Grain Problem (What is the "Outcome"?):** Is the outcome defined at a *coarse grain* ("a system performing function F", e.g., "a keyboard layout") or a *fine grain* ("*this specific* system", e.g., "QWERTY")? Contingency often appears dominant at fine grains (QWERTY's specific origins), while inevitability seems plausible at coarse grains (some keyboard layout was needed). The debate frequently conflates these levels. *Both sides are often right, but at different grains.*
  *   **Ambiguity 2: The Counterfactual Problem (What are we rerunning?):** Asking "would it happen again?" is ambiguous. Does "again" mean:
      *   *Minimal Perturbation:* Slightly tweaking initial conditions (e.g., a minor delay in QWERTY's adoption)? (Tests sensitivity to small historical accidents).
      *   *Major Reshuffling:* Redrawing the entire sequence of subsequent events, shocks, or actor choices? (Tests robustness against major alternative histories).  
      These test fundamentally different claims about *why* a path might be sticky. The literature often fails to specify which counterfactual is being invoked.
  *   **Ambiguity 3: The Evidence Problem (Ignoring Actual Switching Costs):** Both sides rely heavily on hypothetical counterfactuals and historical narratives of *establishment*. However, **systematic evidence from *actual challenges* to established arrangements ("revealed lock-in") is underutilized.** How large were the *actual switching costs* that populations or systems overcame (or failed to overcome) when displacement *was* attempted? This provides empirical traction on the *strength* of lock-in at a point in time.

  **3. The Novel Approach: Revealed Lock-In & Conceptual Clarification**  
  This project proposes to break the stalemate by:
  *   **A. Explicitly Framing Analyses by Grain:** Forcing clarity on whether the object of study is a *specific instance* or a *functional class*.
  *   **B. Disentangling Counterfactuals:** Clearly distinguishing tests of *sensitivity to initial conditions* from tests of *robustness against later shocks/choices*.
  *   **C. Leveraging Revealed Lock-In:** Systematically analyzing historical episodes where **established arrangements faced serious, credible displacement attempts** (successful or failed). The **magnitude and nature of the switching costs overcome (or not)** serve as empirical indicators of the *actual* strength of lock-in at that moment (analogous to revealed preference).  
      *Illustrative Cases (well-known, specifics flagged):*
      *   *VHS vs. Betamax:* (Coarse grain: A home video standard was likely inevitable. Fine grain: VHS's specific dominance was contingent. Revealed lock-in: Betamax's failure *despite* perceived technical superiority indicates switching costs/coordination hurdles at the time).
      *   *QWERTY:* (Fine grain: Its origin contingent. Revealed lock-in: Numerous failed challenges (Dvorak) *despite* claimed efficiency gains suggest strong lock-in for decades. However, its *eventual* vulnerability to digital disruption (soft keyboards) reveals changing cost structures).
      *   *(Potential 3rd: Metric System Adoption?* Varies significantly by country; switching costs political/economic. *Details less familiar, maybe omit or flag heavily as complex*).

  **4. The Potential Twist: Endogenous Lock-In (Speculative)**  
  *Hypothesis:* Belief *in* lock-in can be a *cause* of lock-in. If actors *believe* an arrangement is locked-in, they coordinate around it, raising the perceived (and potentially real) switching costs for challengers. Conversely, a narrative of *vulnerability* might help challengers coordinate defection. This introduces endogeneity: **the answer to "was it locked-in?" can influence whether it *becomes* locked-in.** This will be explored as a secondary line of inquiry if primary analysis supports it.

  **5. Method: Conceptual Synthesis & Case Re-Examination (No New Data Collection)**  
  This is a conceptual project leveraging existing historical/social science evidence through a new analytical lens.  
  *   **Months 1-2:** Deep dive into key path dependence & historical contingency literature; formalize the framework: definitions of grain levels, counterfactual types, "revealed lock-in" metric (switching cost typology - financial, coordination, cognitive, institutional etc.).
  *   **Month 3:** Apply framework rigorously to 2-3 well-documented cases (e.g., VHS, QWERTY). Re-analyze historical accounts focusing on *actual challenge episodes* and *quantifiable/qualifiable switching costs* involved. Identify what grain/counterfactual best explains the observed lock-in (or lack thereof).
  *   **Month 4:** Test framework against 1-2 more ambiguous/complex cases (e.g., perhaps a standards battle in computing like Blu-ray/HD DVD, or an institutional example like common law vs. civil law persistence - *specific case TBD based on feasibility*). Refine framework.
  *   **Month 5:** Develop the "endogenous lock-in" hypothesis based on case observations (e.g., role of narratives, expectations, coordination attempts during challenges). Draft working paper.
  *   **Month 6:** Finalize working paper; prepare workshop presentation focused on the diagnostic framework and "revealed lock-in" evidence.

  **6. Deliverable (For Non-Philosophers):**  
  A **Working Paper & Workshop Talk** providing:  
  *   A clear **diagnostic framework** (flowchart/questions) for researchers/policymakers to apply when evaluating claims of path dependence vs. inevitability in *any* context.
  *   **Concrete illustrations** of how applying this framework clarifies longstanding debates in familiar cases (e.g., "QWERTY *was* locked-in *at the fine-grain level* against *certain types* of challenges, as revealed by the costs of failed displacements; but lock-in strength can decay").
  *   **Actionable insights:** How to identify when lock-in is likely strong/weak based on observable factors (e.g., nature of switching costs, presence of challengers), and the potential risks of lock-in narratives becoming self-fulfilling prophecies.

  **7. What Failure Looks Like:**  
  *   The framework fails to provide clearer insights than existing approaches when applied to the core cases (it just adds complexity).
  *   "Revealed lock-in" proves impossible to operationalize consistently across cases (switching costs are too heterogeneous or poorly documented).
  *   The cases show no pattern linking revealed switching costs to perceived/actual lock-in strength.
  *   The project confirms the ambiguity but offers no practical resolution.

  **8. Scope & Why It's One Project (For Now):**  
  *   **Honest Scope Note:** This tackles the *core conceptual ambiguity* preventing progress. The "endogenous lock-in" idea is a *derivative hypothesis* explored *if* the framework supports it; fully developing it (especially empirically) is a *separate future project*. The three ambiguities (grain, counterfactual, evidence) are intrinsically linked; resolving them requires tackling them together within one analytical frame. This proposal focuses on building that frame and demonstrating its value with existing cases.  
      *   *It's not three papers; it's one framework addressing three facets of one problem.* A second paper could test the framework on new cases; a third could focus on the endogenous hypothesis.

  **9. Why Conceptual Work Makes Progress (For Data-Loving Panels):**  
  *   **Efficiency:** Progress is stuck *despite* abundant case studies. The problem is *interpretation*, not data scarcity. This project unlocks value *from existing data* by providing a more rigorous lens.
  *   **Foundation for Better Empirical Work:** Clarifying *what to measure* (grain, switching costs during challenges) and *how to interpret it* (distinguishing counterfactuals) is essential for designing future empirical studies (data collection or formal modelling) that can *actually* test competing claims.
  *   **Practical Diagnostic:** Provides tangible tools (the framework) for analysing real-world situations involving standards, technologies, or institutions, moving beyond purely academic debate. This addresses the "so what?" for non-theorists.
  *   **Resolves a Stalemate:** It offers a way out of a repetitive debate by showing where and why each side is partially right, and how to move towards more nuanced, testable claims.

  **Tone & Key Claims:**  
  *   **Consensus:** There is broad agreement that *history matters* in socio-technical evolution – initial conditions and sequences of events influence outcomes. The disagreement is about the *extent* and *type* of that influence (contingent lock-in vs. functional convergence), and crucially, *how to determine which applies in a given case*.
  *   **Live Controversy:** There is fundamental disagreement on whether specific outcomes like QWERTY or VHS dominance are primarily due to contingent lock-in or would have been functionally replicated regardless. **This project argues the debate is often irresolvable *without* addressing the three ambiguities outlined.** The validity and utility of "revealed lock-in" as an empirical indicator will be a key novel contribution subject to scrutiny.
  *   **Speculative:** The role of beliefs *about* lock-in *causing* lock-in is presented as a plausible, interesting hypothesis emerging from the analysis, not a core claim or consensus view.

  ---
  **How to Argue With This & Next Steps:**

  1.  **Sharpen the Question:** Is "How can we *determine*..." too strong? Could it be "How can we *better assess* the *relative strength* and *nature* of path dependence..."?
  2.  **Cases:** Do VHS & QWERTY work? Is there a clearer institutional case? Blu-ray/HD DVD is recent but maybe less "locked" long-term? Common law persistence might be too complex.
  3.  **Revealed Lock-In:** Is "switching costs overcome" operationalizable enough? Define categories more precisely? (Financial, coordination/network, learning/cognitive, sunk costs, institutional/legal).
  4.  **Endogenous Lock-In:** Too distracting? Keep it minimal or integrate more firmly as a consequence of the framework?
  5.  **Deliverable:** Is the "diagnostic framework" sufficiently concrete? Should it include a tentative "strength of lock-in" indicator based on revealed switching costs?
  6.  **Failure Conditions:** Are these realistic and fair? Add more?
  7.  **Panel Pitch:** Strengthen the "why conceptual" section? Emphasize the "diagnostic tool" more?

  This gives you a solid, coherent skeleton focused on your key insights. Inject your citations, tweak the cases, refine the nuances, and punch up the justification for the panel. Good luck!
