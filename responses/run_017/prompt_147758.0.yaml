prompt: |-
  hey so i'm in debate club and next week we're doing a thing on effective altruism, and i got assigned the side against it. I don't really know philosophy but my cousin's boyfriend (hes doing a phd in something, i think economics adjacent) sent me this long blog post critisizing EA and i wrote down the main bits. A friend of mine who likes EA says most critiques of it are strawmen, so now i don't know what i can safely say out loud without getting laughed at. Can you go through what i wrote down and tell me whats fair?

  Here are the points i copied out (shortened):

  1. "EA says: work out which intervention does the most good per dollar and fund that one. In practice that means funding whatever you can put a number on — bednets, deworming, direct cash transfers — because those have a cost per life saved you can actually calculate. And it means ignoring everything that isn't countable: building a political movement, changing what a culture cares about, preventing a war that never happens. So 'effective' in effective altruism really just means 'measurable'."

  2. "The deeper version of this is what I'd call the denominator problem. To rank two causes against each other you need a unit — dollars per life saved, dollars per unit of suffering prevented. But only some problems come with a natural unit. Malaria comes in cases. A corrupt institution, or a norm that makes people not care about strangers, doesn't. So the famous cause rankings are mostly decided by which problems happen to be countable, and EA mistakes that for evidence about which problems are biggest. Worse, when a harm can't be estimated the cost-effectiveness tables just quietly treat it as zero, which means any intervention with big messy long-run downsides looks amazing on paper."

  3. "Earning to give: take a high-paying job in finance or tech, live cheaply, donate most of it. Critics say this makes you complicit in whatever that industry does. EAs reply that it doesn't matter, because of replaceability: if you don't take the job someone else will, and that person will donate less than you, so you still make things better. But that argument proves way too much. If replaceability works, you could take a job at a tobacco company or an oil company and it's still fine, as long as you give away more than the next person would. Nobody believes that. So the whole earning-to-give thing collapses."

  4. "EA treats the world like a shopping list of separate problems to buy solutions for, instead of asking who has power and how you change that. Basically it's the politics of rich people donating money, and it quietly assumes political or structural change is a waste of time because you can't measuer it."

  5. "And then that guy who ran a big crypto exchange and was always talking about EA turned out to be a fraud and lost everyone's money, which kind of shows the whole movement was never really about helping people."

  What i'm unsure about: my friend says point 3 is the standard objection to earning to give and that EAs have a genuine answer to it, and that the "proves too much" move is doing something sneaky — but i don't get what. I also can't tell whether the denominator problem in 2 is a real criticism anyone makes or whether he just made it up, and if it is real, whether it's secretly just the same point as 1 or actually something different. And is it fair to say EA assumes political change is pointless?

  So: for each of the five, tell me what someone who actually defends EA would accept, what they'd say is a misrepresentation or an overstatement, and whats just wrong. Then tell me whether the big conclusion — that EA's ranking of causes is basically an artifact of what's easy to count, so the numbers don't really tell you anything — actually follows from the parts that are true, or whether it needs the false parts. And if the denominator problem is a real separate objection, what would a defender say back to it, because i'd rather make a point i can defend than one that sounds good for ten seconds.
reasoning: |-
  Okay, the user is in a debate club and has to argue against Effective Altruism (EA). They've collected five critical points from a blog post but are worried about using strawman arguments. Their friend who supports EA says many critiques are misrepresentations. The user wants to know which of their points are valid, which are overstated, and which are incorrect. They also have specific questions about points 2 and 3, and whether EA dismisses political change.

  First, I need to address each of the five points from an EA defender's perspective. Let's start with point 1: EA prioritizes measurable interventions. The critique says EA only funds things like bednets because they're countable, ignoring intangible efforts like building political movements. EA defenders would agree that measurement is important but argue they do consider hard-to-measure causes. For example, the Open Philanthropy Foundation funds policy and movement-building. The key here is that EA values evidence but acknowledges limitations in measurement. The criticism is a partial truth but overstates EA's neglect of non-measurable causes.

  Point 2 mentions the denominator problem, where only countable harms get ranked, and others are treated as zero. This is a more sophisticated version of point 1. Defenders would admit this is a challenge but say EA is actively working on it. They use qualitative research and different methodologies for causes like AI safety or institutional reform. The critique is valid as a challenge but not a refutation. It's a separate point because it focuses on the impossibility of a universal unit across causes.

  Point 3 is about "earning to give" and replaceability. The critique argues that replaceability could justify working in harmful industries. EA defenders distinguish between replaceability in neutral vs. harmful jobs. They accept that working in tobacco or oil is net negative. Replaceability applies differently in harmful industries because your presence increases harm. This point misrepresents EA's stance; they have nuanced guidelines on job selection. The "proves too much" argument is a misstep because it ignores context.

  Point 4 claims EA ignores power structures and political change. Defenders would push back, noting EA's funding in policy, advocacy, and systemic change. Leaders like Will MacAskill discuss power dynamics. While some EAs might deprioritize politics, the movement as a whole doesn't dismiss it. The criticism is an overgeneralization.

  Point 5 references the FTX scandal with Sam Bankman-Fried. This is a guilt-by-association fallacy. EA condemns fraud, and one person's actions don't discredit the entire movement. This point is weak in debate unless the opponent ties it to systemic issues.

  The user's deeper needs include wanting credible arguments to avoid embarrassment in the debate. They need to distinguish valid critiques from strawmen and understand the nuances. They’re also seeking defensible points, especially on the denominator problem.

  For the big conclusion: the cause rankings are skewed by measurability. While there's some truth, EA defenders argue they use varied methods and adjust for biases. The conclusion overstates the case because EA does address less measurable causes, even if imperfectly. The user should present points 1 and 2 as challenges EA faces but note that EA is evolving to address them. Avoid point 5 unless for rhetorical impact. Emphasize that EA's reliance on metrics can create blind spots, but it's not the only factor in cause prioritization.
answer: |-
  Here's a breakdown of your 5 points from an EA defender's perspective, highlighting what's fair, overstated, or wrong, followed by an analysis of the core critique about measurability:

  **Point-by-Point Breakdown:**

  1.  **Critique:** "EA prioritizes the measurable over the unmeasurable (bednets vs. movements/culture/war prevention)."
      *   **Fair:** EA *does* place a high value on evidence and quantifiable impact. Some interventions (like bednets) are easier to measure than others (like long-term cultural change). Early EA heavily emphasized these measurable interventions.
      *   **Misrepresentation/Overstatement:** The claim that EA "ignores" unmeasurable causes is false. Major EA organizations (like Open Philanthropy) fund policy advocacy, movement building, AI safety (which involves complex forecasting), and existential risk reduction (like pandemic prevention or nuclear security), which often lack simple "cost-per-life-saved" metrics. EA methodology *acknowledges* the challenge and seeks ways to compare hard-to-measure causes using qualitative judgment, expected value theory, and other tools alongside quantitative data. "Effective" aims to mean *actually impactful*, not just measurable – the challenge is *assessing* impact when measurement is hard.
      *   **Defender's Response:** "We agree measurement is crucial for accountability and comparing *some* interventions. However, we recognize the importance of less measurable causes and actively fund them using the best available evidence and reasoning, even when perfect quantification isn't possible. We constantly work to improve our ability to assess these areas."

  2.  **Critique:** "The Denominator Problem: Ranking requires a common unit (e.g., $/life saved). Only countable harms have a 'natural unit'. Uncountable harms (corruption, bad norms) are implicitly treated as zero, making interventions with messy downsides look falsely good."
      *   **Fair:** This is a **real, sophisticated, and significant criticism** frequently discussed *within* EA circles. Comparing vastly different cause areas (e.g., distributing bednets vs. preventing AI catastrophe vs. reforming international institutions) is inherently difficult. There's no single perfect unit. Quantification bias *is* a real risk. Ignoring hard-to-quantify potential downsides *is* a serious methodological pitfall.
      *   **Misrepresentation/Overstatement:** It's *not* that EA "quietly treats" uncountable harms as zero. Serious EA practitioners explicitly grapple with this challenge. They use tools like:
          *   **Qualitative comparison:** Weighing pros/cons using reasoned arguments.
          *   **Expected Value:** Estimating probabilities and magnitudes of potential impacts (even highly uncertain ones).
          *   **Cause Prioritization Frameworks:** Considering scale, neglectedness, tractability, and personal fit, which don't *require* a single denominator across all causes.
          *   **Robustness Checks:** Seeing if conclusions hold under different assumptions.
          *   **Focus on Specific Comparisons:** Often, comparisons are made *within* broader cause areas or between more similar interventions, where finding common denominators is more feasible.
      *   **Separate from Point 1?** Yes, it's distinct. Point 1 is about *measurement difficulty*. Point 2 is about the *fundamental challenge of finding a common metric for comparison* across radically different types of good/harm, which is a deeper philosophical and methodological issue. It's arguably the core challenge of cause prioritization.
      *   **Defender's Response:** "The denominator problem is a profound challenge we openly acknowledge. We don't pretend to have a perfect solution. Our approach involves: 1) Using multiple complementary methods (quant & qual) to assess impact. 2) Focusing comparisons where possible. 3) Explicitly incorporating uncertainty and potential downsides into our models, rather than ignoring them. 4) Constantly refining our frameworks (like the ITN framework - Importance, Tractability, Neglectedness) to better handle diverse causes. The goal isn't false precision, but making the *least bad* comparisons possible with the information available."

  3.  **Critique:** "Earning to Give & Replaceability: The replaceability argument (someone else would take the job, so you donating more makes it net positive) justifies working anywhere (e.g., tobacco/oil), which nobody accepts, so the argument collapses."
      *   **Fair:** Replaceability *is* a core concept in EA job selection reasoning. The "proves too much" objection is a common philosophical counter-argument.
      *   **Misrepresentation/Overstatement:** This is a **strawman** regarding how EA *actually applies* replaceability. EA doesn't endorse working in *any* job just because you donate more. EA job guidance *specifically* advises against roles that cause significant direct harm (like tobacco, fossil fuels, weapons manufacturing) because:
          *   **Counterfactual Impact:** In harmful industries, your presence likely *increases* harm beyond what the next person would do (e.g., you might be a better salesperson/more efficient engineer). The replaceability argument assumes the job itself is neutral or positive. For harmful jobs, it's likely net negative *even with donations*. EA resources explicitly discuss this nuance.
          *   **Community & Reputation Risk:** Working in harmful industries damages the reputation of EA and the individual, potentially reducing their overall positive influence.
          *   **Personal Ethics:** Many EAs have personal ethical lines they won't cross.
      *   **What's Sneaky?:** The "proves too much" move ignores the crucial *context* – the inherent nature of the job. Replaceability arguments are primarily applied to jobs considered broadly neutral (like generic finance or tech roles), not to jobs actively causing harm. EA defenders argue the principle holds *within its intended domain*.
      *   **Defender's Response:** "We agree replaceability isn't absolute. It's a relevant factor for *neutral or positive* jobs. We explicitly advise against taking jobs that cause significant direct harm, as the counterfactual impact is likely negative. Our career advice emphasizes finding roles that are high-impact *and* ethically acceptable. The replaceability argument remains valid for comparing, say, different software engineering jobs."

  4.  **Critique:** "EA ignores power structures and systemic change, favoring rich-donor solutions, assuming political change is unmeasurable/wasteful."
      *   **Fair:** EA *did* historically underemphasize political and systemic change. Its origins in philanthropy and analytical philosophy led to a focus on direct interventions. Some individual EAs might hold the view that political change is intractable.
      *   **Misrepresentation/Overstatement:** This is a **significant overgeneralization**. Major EA organizations invest heavily in policy advocacy, institutional reform, and movement building (e.g., Open Philanthropy's work on criminal justice reform, farm animal welfare policy, biosecurity policy). Leaders like Will MacAskill explicitly discuss power dynamics and the importance of systemic change in recent work (e.g., "What We Owe The Future"). EA recognizes that changing laws, norms, and power structures can be *highly* impactful, even if harder to measure precisely. The movement increasingly sees policy work as crucial, especially for long-term/global catastrophic risks.
      *   **Defender's Response:** "Early EA focused heavily on direct interventions, but the movement has evolved significantly. We now recognize systemic change and political action as essential, high-impact avenues. Major EA funds are directed towards policy advocacy, institutional reform, and building movements. While assessing impact in these areas is challenging, we develop methodologies to evaluate them as rigorously as possible, acknowledging the importance of changing power structures."

  5.  **Critique:** "FTX/Sam Bankman-Fried (SBF) shows EA was never about helping people."
      *   **Fair:** SBF was a prominent, self-identified EA who committed massive fraud. This caused immense reputational damage and internal crisis within EA. It exposed flaws in vetting major donors and celebrity culture within the movement.
      *   **Misrepresentation/Overstatement/Wrong:** This is a **guilt-by-association fallacy**. One prominent individual committing fraud does not invalidate the core ideas or motivations of an entire diverse movement. The vast majority of EAs are genuinely motivated by helping others. EA organizations condemned SBF's actions immediately and have implemented stricter vetting procedures. Core EA principles (like integrity, honesty) are diametrically opposed to fraud. This point confuses the *actions of one individual* with the *philosophy of the movement*.
      *   **Defender's Response:** "Sam Bankman-Fried's crimes were a profound betrayal of EA principles. His actions caused immense harm, including to EA's reputation and beneficiaries. However, judging an entire philosophy by the actions of one fraudulent individual is illogical. Thousands of EAs work diligently, ethically, and transparently to make the world better. The movement has learned hard lessons about due diligence and is working to rebuild trust."

  **Analysis of the Core Conclusion: "EA rankings are just an artifact of measurability"**

  *   **Does it follow from the true parts?** Partially. Points 1 and 2 highlight valid and significant **risks and limitations** in EA's approach: quantification bias is real, the denominator problem is profound, and these factors *can* and *have* skewed priorities towards more measurable interventions, especially in the movement's earlier stages. It's fair to argue that EA rankings *can be* significantly influenced by measurability.
  *   **Does it need the false parts?** Yes, to be stated as an absolute ("just an artifact," "don't really tell you anything"). The false/overstated elements (that EA *ignores* unmeasurable causes, *always* treats them as zero, *never* engages with systemic change) are needed to make the conclusion this sweeping and dismissive.
  *   **EA Defender's Rebuttal to the Core Conclusion:** "While we acknowledge the serious challenges of measurability and cross-cause comparison (Points 1 & 2), your conclusion is overly simplistic and ignores our actual practices. We actively fund and prioritize causes that are hard to measure (like AI safety, policy reform, movement building). We use qualitative reasoning, expected value calculations, and multi-criteria frameworks *alongside* quantitative data. Our rankings aren't *just* about measurability; they incorporate judgments about scale, neglectedness, tractability, and personal fit. We constantly strive to mitigate quantification bias, recognizing that the biggest problems aren't always the easiest to count. Our imperfect methods are still a significant improvement over giving based purely on emotion or proximity, and we are committed to refining them."

  **Recommendations for Your Debate:**

  1.  **Strongest Points:** Focus on **Point 2 (Denominator Problem)**. It's the most sophisticated, acknowledged *within* EA, and hardest to fully resolve. Explain it clearly: "EA struggles to compare fundamentally different types of good/harm because they lack a common unit. This inevitably biases priorities towards problems with countable outcomes, potentially overlooking systemic or long-term issues where harms are diffuse or uncertain." Acknowledge EA's attempts to address it, but argue the bias remains inherent and significant.
  2.  **Strong Supporting Points:**
      *   **Point 1 (Measurable Bias):** Use it to illustrate *how* the denominator problem manifests in practice. "This theoretical difficulty leads to a practical bias: interventions like bednets get prioritized over building movements or preventing unseen wars, *because* they are countable."
      *   **Point 4 (Systemic Change - Nuanced Version):** Don't say EA *ignores* it. Say: "While evolving, EA's strong emphasis on measurable evidence and cost-effectiveness has historically led it to underinvest in and undervalue complex systemic and political solutions, which are often crucial for large-scale, lasting change but harder to quantify in the short term."
  3.  **Use Point 3 Cautiously:** You can mention the *tension* in earning to give and the limits of replaceability ("EA advises against harmful jobs, showing replaceability has limits"), but avoid the strawman that they endorse working anywhere. It's more of an illustration of potential ethical conflicts than a core refutation.
  4.  **Avoid Point 5 (SBF):** It's rhetorically powerful but logically weak (guilt-by-association). A skilled opponent will easily dismiss it. Only use it if absolutely necessary for emotional impact, but be prepared for a strong rebuttal. Focus on systemic critiques (Points 1, 2, 4) instead.
  5.  **Conclude Strongly:** "While EA brings valuable rigor to philanthropy, its core methodology of cause prioritization is fundamentally hampered by the 'denominator problem' – the inability to find a common unit to compare vastly different types of good and harm. This creates an unavoidable bias towards measurable, short-term, discrete interventions over less tangible, long-term, systemic solutions. Despite attempts to mitigate this, the reliance on quantification shapes EA's worldview in ways that risk overlooking the most complex and profound challenges facing humanity."

  By focusing on Point 2 and the nuanced versions of Points 1 & 4, you'll present credible, substantive criticisms that reflect genuine debates within and about EA, avoiding the easily rebutted strawmen. Good luck with your debate!
