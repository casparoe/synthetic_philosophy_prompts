prompt: |-
  Hi — I need a Q&A prep sheet, and I'm nervous enough about this one that I'd rather massively over-prepare than wing it.

  Setup: I'm a fourth-year PhD student in philosophy, and next Thursday I'm giving a paper at my department's work-in-progress seminar (40 minutes plus maybe 20 of questions) on the third chapter of my thesis. The chapter is about what a very capable AI system should be built to aim at, assuming we can't just hand it a complete list of instructions. The best-known proposal in that corner of the literature is coherent extrapolated volition: roughly, aim at what we would want if we knew more, thought faster, were more the people we wished we were, and had grown up closer together. My argument is that this proposal quietly contains two separate moves that everyone treats as one — an idealization stage (correct our actual preferences for ignorance, sloppy reasoning, and manipulation) and an aggregation stage (fuse many corrected wills into a single will to be served) — and that almost every serious objection to it is really an objection to the second stage, not the first. So I keep the idealization and swap out the aggregation for something like a contractualist rejection test: I call the result *extrapolated non-rejectability*, or ENR. Roughly: aim at outcomes that no member of the idealized version of the affected population could reasonably reject, where the idealization is the same one CEV already uses and reasonable is meant to be read from each rejector's own standpoint rather than from an aggregate. I claim this (a) keeps the corrective bite, so I can still say no to preferences that only survive because of ignorance or adaptive deformation; (b) handles the many-people problem without quietly collapsing into utilitarianism; and (c) gets the right answer on the case I actually care about — a small religious or cultural minority whose practices probably wouldn't survive full-information idealization for most of its members, but where I want to say the system has to preserve their ability to say no rather than steer them toward whatever the majority's extrapolated will turns out to be. Fallback position if I get hammered: even if ENR is too indeterminate to serve as a maximizing target, it's still the right procedural constraint on how such a system should treat people while it remains uncertain. My supervisor thinks I should drop the AI framing entirely and pitch it as a paper about idealized preferences in general; I've ben going back and forth on that, and a friend who does ML research says the whole thing sounds unfalsifiable, which doesn't help.

  The room will be maybe fifteen people, and essentially none of them work on AI. Around half work on well-being, mostly inside the informed-desire / idealized-preference tradition: they like idealization in principle but are allergic to anything that smells like a substantive objective list, and they know the literature on adaptive preferences and on whether full information even has a determinate answer. Two are contractualists of the broadly Scanlonian kind, so they'll want to know what my rejection test adds to theirs and whether hypothetical agreement is doing any work at all. One person works on autonomy and authenticity, hierarchical Frankfurt-ish stuff, and will be suspicious of any view where a corrected preference gets to override what somebody actually endorses right now. Two are from the formal side — decision theory and social choice — who think the whole framing is hand-wavy and will want to know what the target even is as a mathematical object, whether it's well defined, whether it's even possible to aggregate or veto-rank anything here given the usual impossibility results; one of them has said out loud that this literature is utilitarianism with the serial numbers filed off. And there's one senior person who mostly does history of philosophy and will want to know whether I'm reinventing something that already has a name.

  What I want from you: the seven or eight objections I'll actually get from these particular people, in roughly the order they'll arrive, ordered by how much damage they'd do rather than by how likely they are. For each one, give it to me phrased the way that person would phrase it — the social choice person and the autonomy person should not sound anything alike — then a reply I could actually deliver in about two minutes, and then, most importantly, a note on where that reply is soft: what the sharp follow-up would be, and whether I'd have anything left to say. Tell me what I should concede in the first five minutes before anyone even asks, which single objection I should just fold on rather than fight, and what the question I'm hoping nobody asks is. My guess is it's something like: isn't your idealization just laundering a fairly specific liberal-individualist picture of a good life into a procedure that looks neutral? But if there's something worse than that, I'd rather find out now. And if you think one of the objections is strong enough that I should change the chapter before Thursday instead of answering it, say that outright and say what the change would be.
reasoning: |-
  Okay, let me unpack this request. The user is a PhD student in philosophy preparing for a high-stakes Q&A on their thesis chapter about AI goal-setting. They've described a nuanced argument that reframes "coherent extrapolated volition" (CEV) by separating idealization from aggregation, proposing "extrapolated non-rejectability" (ENR) instead. The room composition is very specific—mostly non-AI specialists with diverse philosophical leanings—and they want targeted, damage-controlled prep.

  First, I notice the user's anxiety is palpable. They're using phrases like "massively over-prepare" and "nervous enough," which suggests this seminar feels make-or-break for them. Beyond just wanting objections, they're seeking control over a situation where they feel vulnerable—especially given their supervisor's suggestion to drop the AI framing and their friend's "unfalsifiable" critique. The meta-need here is confidence scaffolding.

  The core tension in their argument jumps out: ENR tries to be both a corrective tool (fixing flawed preferences) and a protective shield (for minority views). But these aims might conflict. When the autonomy-focused scholar asks why idealized preferences override current ones, that cuts to the heart of whether this is paternalism in disguise. And the Scanlonian contractualist will immediately spot that ENR's "reasonable rejection" borrows from Scanlon but modifies it with idealization—which might undermine the whole framework if it's not justified carefully.

  Hmm, the social choice objection feels most dangerous mathematically. The user admits their formal colleagues think this is "utilitarianism with serial numbers filed off," and Arrow's theorem lurks here. If ENR can't show how it avoids aggregation paradoxes, the entire mechanism might collapse. This might be where "fold rather than fight" applies—acknowledging indeterminacy but pivoting to ENR as a constraint rather than a target.

  The history-of-philosophy question about reinventing the wheel is softer but still important. Comparing ENR to Rawls/Habermas positions it within tradition while differentiating it—useful for legitimacy points. But the killer question might indeed be the liberal-individualist laundering one. If ENR's idealization assumes specific autonomy values, it's circular. The user's minority protection case helps here but needs careful framing to avoid conceding that ENR imposes majority values.

  Wait—their fallback position is smart. If pressed, conceding ENR works better as a procedural constraint than a maximizing target could disarm the "ill-defined" critiques. And preemptively surrendering on the aggregation paradox point ("yes, it's messy") builds credibility. 

  For changes before Thursday: I wonder if they should explicitly add a caveat about ENR's scope early on. Something like "This framework assumes pluralist liberal democracies; authoritarian implementations would distort it." That might preempt the liberalism critique. Also, maybe replace "should be built" with "might be constrained by" to soften the AI claims given their friend's unfalsifiability jab.

  The ML friend's "unfalsifiable" comment nags at me. Philosophy isn't science, but if ENR can't generate testable claims even in principle, that weakens its AI relevance. Maybe suggest a toy model? Like: "Imagine an ENR-driven AI denies a request to erase someone's painful memories. Testable implication: it preserves autonomy despite current suffering." Not perfect, but something. 

  Biggest gap: the user hasn't specified ENR's threshold for "reasonable" rejection. Is it per-person veto? That seems paralyzing. They must define this or the Scanlonians will eviscerate them. Thursday isn't enough time for major fixes, but a slide clarifying "rejection must cite generalizable reasons, not personal taste" could help.

  Ultimately, their strength is the minority protection case. I'd structure objections to end there—it's where ENR shines. If they can say, "Unlike CEV, ENR won't erase the Amish," and link it to real debates about adaptive preferences? That could resonate with the well-being scholars who fear objective lists.
answer: |-
  Here's your battle-tested Q&A prep, prioritized by damage potential and tailored to your audience. I've flagged critical weaknesses and included strategic concessions—**the key change I recommend is explicitly framing ENR as a *constraint* first**, not a maximizing target, to neutralize the "ill-defined object" critique.

  ---

  ### **Preemptive Concession (Slide 0 or opening remarks):**
  > *"Before I start, I want to emphasize: ENR isn't proposed as a mathematically elegant, fully determinate target for AI optimization. It’s primarily a *procedural constraint* to prevent certain moral disasters—especially overriding minority voices—while we navigate uncertainty. Its value is in ruling out unacceptable actions, not defining a single 'best' outcome."*  
  **Why?** Disarms formal/social choice critics early. Signals humility without undermining your core.

  ---

  ### **The 7 Objections (Ordered by Destructiveness)**

  1. **Formal/Social Choice Theorist**  
     *Phrasing:* "This is hand-wavy utilitarianism with extra steps. You’ve replaced aggregation with veto rights, but Arrow’s theorem *still* applies: any non-dictatorial social welfare function is either incoherent or manipulable. What’s the formal structure? Is ‘non-rejectability’ even computable? Or are you just smuggling in a moral intuition and calling it a procedure?"  
     *Your Reply:* "Arrow applies to preference aggregation over *fixed* options. ENR isn’t aggregating preferences—it’s screening actions via idealized veto points. Think of it as a dynamic constraint: an act is forbidden if *any* idealized agent could veto it *for reasons others couldn’t reasonably dismiss*. Computability is a fair concern, but we already accept fuzzy constraints like ‘don’t violate rights’ in decision theory."  
     **Soft Spot:** *"Define ‘reasonably dismiss’ mathematically. Show me this avoids cycles or strategic vetoes."*  
     **Fallback:** Concede indeterminacy ("That’s why I frame it as a constraint") and pivot to minority-protection case.

  2. **Scanlonian Contractualist**  
     *Phrasing:* "Why add idealization to Scanlon? His test uses *actual* reasons people have. Your ‘corrected’ rejectors aren’t real people—they’re hypothetical constructs. Doesn’t this let you rig the test by defining the ‘idealized agent’ to reject whatever you dislike?"  
     *Your Reply:* "Scanlon assumes agents are rational and well-informed. ENR just makes that explicit and consistent. Crucially, the *grounds* for rejection must be rooted in the rejector’s *actual* values post-correction—e.g., ‘This destroys my community’s way of life’ survives; ‘I dislike blue houses’ doesn’t. It prevents majorities from imposing values on minorities *using the minority’s own idealized perspective*."  
     **Soft Spot:** *"Who defines which ‘actual values’ survive correction? Isn’t that just your intuition?"*  
     **Fallback:** "Idealization is imperfect, but without it, adaptive preferences (e.g., oppressed groups accepting harm) get a veto."

  3. **Autonomy Scholar (Frankfurt School)**  
     *Phrasing:* "This is paternalism disguised as progress. If someone *here and now* endorses a preference—even if ‘deformed’—overriding it with their ‘idealized’ self violates their autonomy. Why is your hypothetical version of me *more me* than current me?"  
     *Your Reply:* "ENR doesn’t override current selves—it blocks actions that *even their own idealized selves* would reject. Protecting someone from choices their more autonomous self would regret isn’t paternalism; it’s what we do in healthcare or addiction cases. The system isn’t forcing them to *be* idealized—just not exploiting their current state."  
     **Soft Spot:** *"What if my current self *identifies* with my ‘deformed’ preference? Your view privileges critical reflection over actual endorsement."*  
     **Fallback:** Concede tension but argue ENR minimizes harm ("Would you let an AI exploit an addict’s craving?").

  4. **Well-being Scholar (Idealized Preference Camp)**  
     *Phrasing:* "You keep ‘idealization’ but strip out aggregation. But if individuals are idealized to be rational and informed, won’t their preferences *converge*? If so, why bother with vetoes? If not, how is this different from moral relativism?"  
     *Your Reply:* "Convergence might happen in some domains (e.g., health), but not in deeply pluralistic ones (e.g., religious practice). ENR accepts that some differences are irreconcilable *and protects that divergence*. It’s not relativism because it still rules out preferences sustained by error or oppression—e.g., no one could reject lifesaving medicine, but many could reject state-enforced atheism."  
     **Soft Spot:** *"How do you prove the Amish elder’s rejection of technology isn’t based on ignorance?"*  
     **Fallback:** "Their rejection isn’t based on factual error but on values that survive idealization."

  5. **Senior Historian of Philosophy**  
     *Phrasing:* "This sounds like Habermas’ ‘ideal speech situation’ meets Rawls’ ‘veil of ignorance’—but messier. What’s genuinely new here? Or are you just rebranding deliberative democracy for AI?"  
     *Your Reply:* "Rawls idealizes *all* agents identically (veil of ignorance); ENR idealizes them *individually* from their own perspectives. Habermas focuses on consensus; ENR allows permanent disagreement but protects dissenters. The innovation is using *individualized* idealization as a shield, not a homogenizing tool."  
     **Soft Spot:** *"Isn’t this just pluralistic perfectionism?"*  
     **Counter:** "No—perfectionism imposes a substantive good; ENR is purely procedural."

  6. **ML Friend’s Proxy (Unspoken but Potent)**  
     *Phrasing:* "How could any AI *operationalize* this? ‘Reasonable rejection’ is vaguer than CEV. At least CEV aims for coherence; you’ve built indeterminacy into the core."  
     *Your Reply:* "For an *aligned* AI, ambiguity is a feature. We want systems to avoid clear wrongs (e.g., erasing cultures) while permitting reasonable disagreements. ENR isn’t an algorithm—it’s a safety criterion. We’d implement it like ‘human rights’ rules: case-by-case with thresholds for harm."  
     **Soft Spot:** *"So you admit it’s unfalsifiable? What would *disprove* ENR?"*  
     **Fallback:** "Its test cases: if it permits obvious oppression or forbids tolerable pluralism, it fails."

  7. **The Well-being Skeptic (Adaptive Preferences)**  
     *Phrasing:* "Your idealization assumes ‘full information’ fixes preferences. But people with the same facts still disagree! What’s ‘corrected’ about that? Isn’t this just *your* idealization?"  
     *Your Reply:* "Idealization only filters preferences *dependent* on ignorance/incoherence (e.g., ‘I risk addiction because I underestimate withdrawal’). Where values diverge post-correction, ENR *protects* that difference—unlike CEV, which forces consensus."  
     **Soft Spot:** *"Says who? Your ‘correction’ still assumes liberal autonomy as the ideal."*  
     **Red Alert:** This segues into the **killer question**.

  ---

  ### **The Killer Question (Hope No One Asses It)**
  > *"Aren’t you laundering *your* liberal-individualist values into the idealization process? You assume people ‘corrected’ for oppression will value autonomy—but what if they idealize to hierarchical communalism? Does ENR protect theocrat who rejects gender equality?"*  
  **Why it’s deadly:** Strikes at ENR’s claim to neutrality. If idealization has substantive content, it’s circular.  
  **Your Best Response:**  
  > "The idealization *only* corrects cognitive defects (ignorance, incoherence), not substantive values. If a gender hierarchy *survives* full scrutiny by those affected—e.g., women in the group endorse it post-idealization—ENR permits it. But if women *could* reasonably reject it (e.g., ‘this serves men’s interests, not mine’), it’s blocked. The test is *internal* to the group’s values."  
  **Soft Spot:** *"But you’re still privileging individual rejection over communal goals! That’s liberalism."*  
  **Nuclear Option:** Concede ENR assumes basic moral equality ("Otherwise, we permit slavery") but argue this is minimal.

  ---

  ### **Strategic Fold**
  **Concede immediately on aggregation paradoxes** (Objection #1). Say: *"You’re right—no aggregation procedure is flawless. That’s why ENR focuses on *blocking* harms, not ranking options. It’s a ‘red line’ tool, not a utility function."*  
  Fighting this wastes time and exposes weakness.

  ---

  ### **Critical Pre-Thursday Change**
  **Reframe ENR explicitly as a *constraint on AI behavior*** (like Asimov’s Laws), not a target. Add:  
  > *"ENR doesn’t tell the AI *what to do*—it tells the AI *what not to do*: namely, override objections that would survive idealization. This is manageable even if ‘full ENR satisfaction’ is intractable."*  
  **Why?** Aligns with your fallback, placates formal critics, and answers ML unfalsifiability.

  ---

  ### **Delivery Tips**
  - **Anchor in your minority case** (e.g., Amish/Indigenous preservation). It’s ENR’s strongest sell.  
  - **When cornered**, say: *"That’s a great point—my draft currently handles it by [...], but I’d welcome your suggestion."*  
  - **Avoid AI jargon**; say "system" or "agent." Your supervisor isn’t wrong, but the AI angle hooks attention.  
  - **Bring printouts of your 2 key examples** (e.g., a CEV failure vs. ENR success).  

  You’re overprepared. Now go dissect some objections.
