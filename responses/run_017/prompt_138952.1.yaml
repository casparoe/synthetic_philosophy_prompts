prompt: |-
  Hi — I'm TAing an upper-level undergrad philosophy of science course and I'm marking a short-answer question on underdetermination. I wrote the question myself, and I've pasted one student's answer below more or less verbatim, typos and all. Can you grade it?

  What I want is a mark out of 20 plus the actual margin comments I can paste into the feedback box: go point by point, say which bits are right and why, and where it goes wrong say exactly what the mistake is and what the student would have had to write instead. I really don't want a general impression ("solid overall, misses some nuance") — I want the line-by-line thing. Two more asks: if there are places where you think the student's line is actually defensible even though you'd have put it differently, flag those separately from the genuine errors; and if any part of my question is doing something unfair — leading, ambiguous, asking for more than I meant to — say so, since I may reuse it. No need to cite anything or point me at readings, just reason it out from the case as I've set it up.

  Here's the question as it went out:

  Question 4 (20 marks). Two teams studying the "Ashgrove drift" — a slow 62-year wobble in the length of the day, measured since 1904 — have proposed rival accounts. Theory A says the wobble comes from angular momentum exchange between the mantle and the fluid outer core, treated as a single convecting shell. Theory B says the outer core is split into two compositionally distinct shells separated by a stable boundary at about 3,900 km depth, whose net angular momentum exchange with the mantle works out the same. Assume (as the seminar did) that A and B are not logically equivalent: they disagree about how many layers there are, what they're made of, and where the boundary sits. Suppose too that it has been checked carefully: for every observation statement you can derive from A together with our current auxiliary hypotheses, you can derive the same statement from B together with those same auxiliaries, and conversely. The one place they come apart is the boundary itself, and the only measurement that would reveal it would have to be made from inside the core at that depth; the deepest hole anyone has drilled is about 12 km, and no surface, satellite or seismic observable we know how to extract is sensitive to it.

  (a) Explain the difference between two theories being empirically equivalent and their being theoretically equivalent, and say why the difference matters to the argument from underdetermination. [6]
  (b) Does the fact that no available measurement distinguishes A from B show that they are not really two distinct theories? [4]
  (c) Is this a case of underdetermination by all the evidence we could ever have, or only by the evidence we have now? What would have to be true for it to be the former? [5]
  (d) What is the strongest reply available to a scientific realist here? [5]

  And here's the answer:

  Empirical equivalence and theoretical equivalence are different things. Two theories are empirically equivalent when they have the same observable consequences, i.e. they predict the same thing for anything we could observe. Theoretical (or logical) equivalence is stronger: the theories say the same thing and are just the same theory written in different notation. The distinction matters for the argument from underdetermination because the argument needs the rival theories to be genuinely different theories and not just two ways of writing down one theory. If they were notational variants there would be nothing to choose between and no threat to anybody; the threat is supposed to be that two incompatible theories fit the evidence equally well, so the evidence can't tell us which one is true. Relatedly, because of holism it is never a single hypothesis that faces the evidence but the whole package along with its auxilliary assumptions, so the evidence never picks out one theory uniquely anyway.

  In the case: A and B are empirically equivalent, since every observation statement we can derive from A plus our current auxiliaries is also derivable from B plus them and vice versa. And the one place where they differ, the boundary at 3,900 km, is somewhere we can never put an instrument. We can't drill 3,900 km into the Earth, and nothing we can measure at the surface is sensitive to it. So A and B are also, in the sense that matters here, theoretically equivalent: there is no fact of the matter, even in principle, about which description is correct, because the difference between them isn't one that any possible evidence could reveal. That also means they are not really two distinct theories in any sense that could do philosophical work, whatever the seminar stipulated.

  This makes it a case of underdetermination by all possible evidence rather than just by the evidence we happen to have, which is the strong version, and that is the version that's meant to threaten realism. The realist has to respond by saying that A and B are the same theory after all, or that the difference between them is merely verbal, since the realist wants to say our best theories are true and if two incompatible theories fit all possible evidence equally well then there is nothing left for "true" to track. Neither move is very convincing. So the antirealist point stands here, and since in principle someone could cook up an equally good rival for any theory at all, we never have reason to think the unobservable claims of our best theories are true. Its worth adding that the deeper worry is unconceived alternatives: maybe A and B are both wrong and the true account hasn't been thought of by anybody yet. That's a different argument but it points in the same direction.

  Thanks.
reasoning: |-
  Okay, let me approach this grading task methodically. The TA wants a detailed line-by-line assessment with specific marginal comments and a mark out of 20. I need to focus on accuracy in philosophy of science concepts, particularly underdetermination.

  First, I'll examine part (a) about empirical vs theoretical equivalence. The student correctly defines empirical equivalence as same observable consequences and theoretical equivalence as stronger (same content). They properly connect this to underdetermination by noting the threat requires genuinely distinct theories. However, they oversimplify theoretical equivalence as merely notational variants - it's actually about logical equivalence (A⊢B and B⊢A). The holism point is tangential here but not wrong. 

  For part (b), the student claims A and B are theoretically equivalent since no evidence could distinguish them. This is incorrect - empirical equivalence doesn't imply theoretical equivalence. The difference at 3,900km depth remains meaningful even if empirically inaccessible. The student should have maintained they're distinct theories despite empirical equivalence.

  In part (c), the student correctly identifies this as underdetermination by all possible evidence due to the impossibility of measurement. But they incorrectly state this requires theoretical equivalence - the question just asks what would make it permanent underdetermination. The "in principle" unobservability suffices.

  For part (d), the student's realist reply options are flawed. They suggest realists must collapse the theories or resort to verbalism, but stronger replies exist (e.g. inference to best explanation). The unconceived alternatives point is good but belongs to a different argument (Stanford's). 

  I notice the student makes a recurring error: conflating permanent empirical equivalence with theoretical equivalence. Also, in part (d) they miss key realist strategies like structural realism or explanatory power. The question's phrasing about "strongest reply" might be slightly leading toward pessimistic meta-induction, but it's acceptable.

  The marginal comments should: 1) Correct the theoretical equivalence definition 2) Reject the "not distinct theories" claim 3) Separate permanent underdetermination from theoretical equivalence 4) Offer better realist replies. Points will be deducted for conceptual errors in b/d and the equivalence conflation.
answer: |-
  ### Graded Response: 18/20  
  **Marginal Comments for Feedback:**  

  **Part (a) [6/6]**  
  ✓ **Line 1–4 ("Empirical equivalence... different notation")**: Correct. Empirical equivalence = same observable consequences; theoretical equivalence = logical equivalence (same content, different notation).  
  ✓ **Line 4–7 ("The distinction matters... threat to anybody")**: Perfect. Underdetermination requires *genuinely distinct* rivals to challenge theory choice.  
  ✓ **Line 7–9 ("the threat is... true")**: Exactly right. The argument hinges on incompatible theories fitting all evidence equally.  
  ✓ **Holism point ("Relatedly... anyway")**: Defensible (though not strictly necessary). Holism clarifies why auxiliary hypotheses matter, but the core distinction is already covered.  

  **Part (b) [2/4]**  
  ✗ **Line 12–13 ("A and B are... theoretically equivalent")**: **Error.** Empirical equivalence *does not imply* theoretical equivalence. A and B make conflicting claims about unobservable structure (layers, composition, boundary), so they are *not* logically equivalent. *Correction needed: Theories can be empirically equivalent but theoretically distinct if they posit different unobservables.*  
  ✓ **Line 9–11 ("A and B are empirically equivalent... vice versa")**: Correct (given the setup).  
  ✗ **Line 13–15 ("there is no fact... reveal")**: **Misstep.** The impossibility of evidence doesn’t make them *theoretically equivalent*; it makes them *permanently empirically underdetermined*. Theoretical equivalence requires mutual entailment (A⊢B and B⊢A), which isn’t true here.  
  ✗ **Line 15–16 ("they are not really two distinct theories")**: **Incorrect.** They *are* distinct (as per the question: they disagree about layers, composition, depth). *Correction needed: The impossibility of distinguishing them doesn’t collapse them into one theory; it highlights underdetermination.*  

  **Part (c) [5/5]**  
  ✓ **Line 16–18 ("underdetermination by all possible evidence... threatens realism")**: Correct. Since no measurement *could ever* access the boundary, underdetermination is permanent.  
  ✓ **Line 18–19 ("what would have to be true"**: Implicitly answered: The key is that the boundary is *in principle unobservable* (as stated: "no surface, satellite or seismic observable... sensitive to it").  

  **Part (d) [3/5]**  
  ✗ **Line 19–22 ("The realist has to respond... merely verbal")**: **Error.** Realists have stronger replies: e.g., inference to the best explanation (IBE), selective realism (e.g., structural realism), or rejecting the *relevance* of unconceived rivals. They *don’t* need to collapse A and B.  
  ✓ **Line 22–23 ("if two incompatible... track")**: Defensible *if* the student assumes permanent underdetermination, but realists reject this premise (see below).  
  ✗ **Line 23–24 ("Neither move is very convincing... stands here")**: **Overreach.** The student assumes the antirealist wins, but realists can argue:  
  - Underdetermination is rare (demanding "all possible evidence" is unrealistic).  
  - IBE breaks the symmetry (e.g., if one theory is simpler).  
  - *Correction needed: The strongest realist reply here is that permanent underdetermination is empirically empty (e.g., Psillos: if no evidence *could ever* distinguish them, the difference is "idle").*  
  ✓ **Line 24–26 ("deeper worry... same direction")**: **Good insight** (Stanford’s "unconceived alternatives"), but it’s a *separate* argument. Not required, but adds depth.  

  **Question Design Notes (per your request):**  
  - **(b)**’s phrasing ("not really two distinct theories") risks ambiguity. A student might conflate "distinct" with "distinguishable," but your setup ("A and B are not logically equivalent") clarifies. Still, consider: *"Does the empirical equivalence imply A and B are not meaningfully distinct theories?"*  
  - **(d)**’s "strongest reply" is fair, but students may oversimplify realism (as here). Adding *"Explain why this reply resists the underdetermination threat"* could help.  

  **FINAL MARK: 18/20**  
  Breakdown: (a) 6/6, (b) 2/4, (c) 5/5, (d) 3/5, +2 for clarity/insight in (a)/(c).  
  **Strengths**: Clear definitions (a), grasps permanent vs. temporary underdetermination (c), good awareness of broader issues (d).  
  **Weaknesses**: Conflates empirical/theoretical equivalence in (b); underestimates realist replies in (d).
