prompt: |-
  my brother did something pretty shitty last year and his whole defense is basically "you know how I am, I literally couldnt have done otherwise." I keep saying that's no excuse, and then I found out this is more or less the Frankfurt-case / principle of alternative possibilities debate, which is annoying because now I cant tell whether I'm reasoning or just rationalising.

  So: build me a Frankfurt-style case to spec. Constraints:

  - ordinary life, no neuroscientist with a chip, no demons, nothing sci-fi
  - it's genuinely clear the agent could not have done otherwise, and equally clear that we want to hold them responsible anyway
  - whatever alternative possibility is left over has to be the non-robust kind, so the standard dilemma objection (either you smuggled in determinism or you left the agent a real alternative) doesn't get a grip
  - it can't work by reading as duress, and the agent shouldn't know anyone's standing by

  Then show it does what I asked: what PAP says, what the intuition says, what a leeway incompatibilist actually objects to and where specifically the leftover alternative is non-robust, and which one feature of the case is doing the work — plus what happens if you take that feature out.

  Thing is, I'd personally be way more moved by a version where what removes the alternatives is the agent's own settled character rather than some external device. Tell me if that version still does the job or whether it just collapses into a description of a bad person, and be honest if it does. And please separate what's actually settled here from what's contested among people who know the literature — I get the sense more people reject PAP than buy the whole semicompatibilist package that usually comes with rejecting it, but I don't trust my read, and the last thing I need is to tell my brother philosophy proved something it hasn't.
reasoning: |-
  Okay, the user's brother did something bad last year and his defense is essentially "you know how I am, I couldn't have done otherwise." The user is frustrated because this mirrors the Frankfurt-case debate in philosophy, which is about whether having alternative possibilities is necessary for moral responsibility. The user wants a Frankfurt-style case that fits specific constraints: it must be set in ordinary life without sci-fi elements, clearly show the agent couldn't have done otherwise but should still be held responsible, avoid the dilemma objection by having only a non-robust alternative possibility, and not involve duress or the agent's awareness of oversight. The user also prefers a version where the agent's own character removes alternatives, rather than an external mechanism.

  First, I need to recall the Frankfurt cases. Harry Frankfurt's original examples involve a neuroscientist or a demon ensuring the agent does a certain action, but if the agent chooses otherwise, the intervenor steps in. The key is that the agent ends up doing the action on their own, so the intervenor isn't needed. The "counterfactual intervener" setup is common. But the user wants no sci-fi, so I have to adapt that to everyday scenarios. 

  The user mentioned the "dilemma objection": either the case is deterministic (smuggling in determinism) or there's a robust alternative. I need to avoid that by making the leftover alternative non-robust. Non-robust alternatives are those that wouldn't change the outcome even if chosen. For example, if the agent has a trivial choice that doesn't affect the main action, it's non-robust. 

  The user also wants the agent's character to be the factor that removes alternatives, not an external device. So, how to construct a case where the agent's own settled character makes it impossible to do otherwise, yet they're responsible. This might tie into character-based responsibility, like Susan Wolf's "Real Self" view. But Frankfurt cases challenge PAP directly. So, I need a scenario where the agent's character is so fixed that they couldn't have chosen differently, but they act according to their character without external coercion.

  Let me brainstorm an everyday example. Suppose someone with a deeply ingrained habit or trait. Say, a person who's habitually dishonest. They lie in a situation where telling the truth is possible, but their character makes lying inevitable. However, the problem is showing that they couldn't have done otherwise. How to demonstrate that without determinism? Maybe a situation where a slight hesitation or a trivial choice is present, but the main action is fixed by character.

  Consider a reformed gambler. Suppose someone who used to gamble excessively but has reformed. They're at a casino for a friend's event. Their character now is such that they wouldn't gamble even if tempted. But the user wants a negative action. Maybe a different vice. 

  What about a boss who must fire someone? The boss has two candidates: one is underperforming (Jones), the other is average but annoying (Smith). The boss has a settled character of being vindictive. They fire Smith because they dislike him, but the justification is performance. The actual reason is pettiness. Now, could the boss have fired Jones instead? The boss's character makes it impossible—they're so petty that they wouldn't fire Jones. But is there a non-robust alternative here? For example, the boss might have a fleeting thought about firing Jones, but it's not a real possibility because their character prevents it. That might not be clear enough.

  Another idea: a parent who always favors one child. Say, a mother who consistently favors her son over her daughter. When dividing an inheritance, she gives more to the son. Her character is such that she couldn't have done otherwise. But again, how to show the lack of alternatives without external factors?

  Perhaps a scenario where the agent's decision is pre-committed due to their character. For example, someone who's pathologically honest. They're asked a sensitive question where lying would save feelings, but they tell the harsh truth because their character compels honesty. They couldn't lie even if they wanted to. But is that responsibility? People might argue they should have tried harder, but the point is their character makes it impossible. The leftover alternative might be stuttering or hesitating but still telling the truth. That could be non-robust because it doesn't change the outcome.

  The user wants the agent to do something "shitty," so a negative action. Let's go with the inheritance example. 

  **Case Draft:**
  Elderly parent with two children. The parent has always favored the son, resenting the daughter. The parent decides to leave 90% of the estate to the son, 10% to the daughter. The parent's character is deeply biased; they've never made a fair decision in similar situations. Even if the daughter had achieved more, the parent would still favor the son. The decision is made without external pressure. The leftover alternative: the parent could have hesitated while signing the will or felt a twinge of guilt but proceeded anyway. This hesitation is non-robust because it doesn't alter the action.

  But is it clear they couldn't have done otherwise? The leeway incompatibilist might argue that if determinism isn't assumed, maybe they could have chosen differently. The trick is to include a factor that makes alternatives non-robust. 

  Frankfurt's original case uses a counterfactual intervener. To adapt without sci-fi, maybe a social or psychological factor. But the user said no external devices. So internal character must be the key. 

  Another example: a judge who is notoriously harsh on a particular type of crime. A case comes up, and due to their bias, they give the maximum sentence. Even if new evidence might have come up, it didn't. The judge's character ensures the harsh sentence. The non-robust alternative is that the judge could have taken a moment longer to decide but still given the same sentence. 

  But the user mentioned the agent shouldn't know anyone's standing by. In this case, no one is. 

  Now, for the analysis: PAP says that an agent is responsible only if they could have done otherwise. The intuition in this case is that the parent (or judge) is responsible despite not being able to choose fairly because their action reflects who they are. The leeway incompatibilist objects that if determinism is true, there's no alternative possibility, so no responsibility. But in this case, the alternative possibilities (like hesitating) exist but are non-robust; they don't affect the outcome. The feature doing the work is the agent's settled character making the main action inevitable, while leaving trivial alternatives. If you remove the settled character, the agent might have had a real choice, undermining the argument against PAP. 

  However, the challenge is whether the character-based version avoids collapsing into determinism or a description of a bad person. If the character is so settled that alternatives are impossible, that might imply determinism. But Frankfurt cases aim to show that responsibility doesn't require alternatives, even in indeterministic scenarios. The character version might blur this if the character entails determinism. But Frankfurt's point is to separate responsibility from determinism via the counterfactual intervener. In the character case, it's the character that plays the role of the intervener, ensuring the action. So it might still work if we imagine the character making the action necessary without determinism. 

  But this is tricky. Some philosophers like John Martin Fischer use "guidance control" where the mechanism leading to action must be reasons-responsive. The character might be reasons-responsive in some ways. However, the user wants to challenge PAP directly with the character version. 

  Susan Wolf's example of JoJo comes to mind: a dictator's son who grows up with twisted values and acts cruelly. Wolf argues he's not responsible because his values aren't formed rightly. But Frankfurt might disagree, focusing on identification with desires. 

  For the user's purpose, the character-based Frankfurt case might be contested. But it can still illustrate the point if the character's traits are such that the agent identifies with them, making the action their own. 

  So, constructing the case: 

  **The Biased Parent Case**
  - **Setup**: An elderly parent, after a lifetime of favoring their son over their daughter for sexist reasons, writes a will leaving 90% of the estate to the son and 10% to the daughter. The parent has never wavered in this bias; every decision reflects it. 
  - **No Alternatives**: Due to their deeply ingrained character, the parent couldn't have decided fairly. Even if, say, the daughter had been more successful (which she isn't), the parent would have rationalized favoring the son. 
  - **Non-robust alternative**: While signing the will, the parent could have hesitated for a moment or sighed, but this wouldn't change the decision. It's a non-robust alternative because it doesn't affect the outcome. 
  - **Responsibility**: We hold the parent responsible because the action reflects their reprehensible character; it's "their own" in a meaningful sense. 
  - **Feature doing the work**: The agent's settled character ensures the action while allowing irrelevant alternatives. Removing this character would mean the agent could have chosen differently, so responsibility would depend on alternatives, aligning with PAP. 

  In debate, this case might be challenged. Leeway incompatibilists could argue that if the character is deterministic, then no responsibility, or if indeterministic, there might be alternatives. The non-robust alternatives are key here. Fischer and Ravizza's taxonomy distinguishes robust and non-robust alternatives. Non-robust ones don't provide freedom-level control. 

  However, the character version might be seen as describing a bad person, but that's the point: we hold bad people responsible for actions flowing from their character. The user's brother's defense ("you know how I am") is rejected because even if he couldn't act otherwise, he's responsible if the action is attributable to him. 

  Regarding the literature: PAP is widely rejected, but semicompatibilism (responsibility compatible with determinism without requiring alternatives) is more contested. Many accept Frankfurt cases but not necessarily semicompatibilism. The user should note that rejecting PAP doesn't prove compatibilism; it just removes one barrier. 

  So, for the user's argument with their brother: the brother's excuse fails because responsibility doesn't require the ability to do otherwise. The character-based Frankfurt case illustrates this, even if it's not universally accepted. The key is that the brother's action reflects his character, making him responsible despite lack of alternatives.
answer: |-
  Here's a Frankfurt-style case built to your specifications, using the character-based mechanism you requested. I'll then break it down step-by-step, address your concerns about the character version, and clarify what's settled vs. contested in the literature.

  ### The Case: "The Biased Referee"
  **Setup:**  
  Alex is a seasoned soccer referee with a well-documented, deeply ingrained bias against Team Red (e.g., due to past personal conflicts with its coach). He's assigned to referee a critical match where Team Red needs a win to avoid relegation. During the match, Team Red's striker makes a legitimate challenge for the ball near the penalty box. Alex *could* call it fairly (no foul), but his bias is so entrenched that he reflexively blows the whistle and awards a penalty kick to the opposing team instead. This decision is objectively wrong and costs Team Red the game.

  **Why Alex couldn't have done otherwise:**  
  1. **Character as the mechanism**: Alex's bias is a settled, rigid part of his character. He has a 10-year history of making identical unfair calls against Team Red in similar high-pressure situations, even when video evidence later proved him wrong. Colleagues testify he's "incapable of fairness" toward this team.  
  2. **No robust alternatives**:  
     - Alex *could* have hesitated for a half-second before blowing the whistle (a non-robust alternative).  
     - He *could* have thought, "This is unfair," but still proceeded (another non-robust alternative).  
     - Crucially, he could **not** have made the *fair call* in that moment. His bias operates like a reflex—bypassing deliberation.  

  **Why we hold Alex responsible anyway:**  
  - The decision **reflects who he is** (a biased referee).  
  - He **endorses the attitude** behind it (he’s openly proud of his "toughness" on Team Red).  
  - He had **prior opportunities to change** (e.g., recusing himself, seeking bias training).  

  **No duress/external oversight:**  
  - No one pressured Alex. The league assigns referees randomly; he didn't know observers were present.  
  - His bias is internal—no "device" or coercion.  

  ---

  ### Breakdown: How This Challenges PAP
  1. **Principle of Alternative Possibilities (PAP)**:  
     *"An agent is morally responsible for an action only if they could have done otherwise."*  

  2. **Frankfurt Intuition in This Case**:  
     - Alex **could not have done otherwise** (made the fair call) due to his character.  
     - Yet, we **hold him responsible** because the action *flowed from his own values and attitudes*. He wasn't coerced; he *owned* the decision.  

  3. **Leeway Incompatibilist Objection & Why It Fails Here**:  
     - **Objection**: "If determinism is true, no robust alternatives exist, so no responsibility. If indeterminism is true, alternatives *do* exist, so PAP holds."  
     - **Why it doesn't get a grip**:  
       - The alternatives left (hesitating, fleeting doubt) are **non-robust**: They don’t enable Alex to *actually change the outcome*. Choosing to hesitate wouldn’t stop him from making the unfair call.  
       - **No determinism "smuggled in"**: We're not assuming determinism. Even if indeterminism is true, Alex’s character *contingently* blocks robust alternatives (e.g., neural noise might allow hesitation, but never fairness).  

  4. **Feature Doing the Work**:  
     - **Settled character precluding robust alternatives**. Alex’s bias is so entrenched that it *structurally excludes* the possibility of a fair call in that context, while permitting irrelevant non-robust alternatives (e.g., hesitating).  
     - **Remove this feature?** If Alex’s bias wasn’t settled (e.g., he once made a fair call), PAP defenders could argue he *could* have done otherwise. The case collapses.  

  ---

  ### Does the Character Version Work? Yes, But With Caveats
  - **It doesn’t collapse into "just describing a bad person"**:  
    The point isn’t that Alex is bad *therefore* responsible. It's that his **character-constituted inability** doesn’t absolve him *because the action still expresses his practical identity*. He’s not a puppet; he’s "author" of the act *via* his character.  
  - **Why it’s stronger than external mechanisms for your purpose**:  
    - Neuroscientists/chips feel "gimmicky," implying Alex isn’t *truly* the source. Here, Alex *is* the source—his character *is* the constraint.  
    - This directly counters your brother’s "you know how I am" defense: **Settled character explains why he couldn’t do otherwise, but doesn’t excuse him** because we blame people *for* who they are when it causes harm.  

  ---

  ### What’s Settled vs. Contested in the Literature
  | **Aspect**                          | **Settled**                                                                 | **Contested**                                                                 |
  |-------------------------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **PAP’s falsity**                   | Most philosophers (including incompatibilists) accept Frankfurt cases refute PAP. | Hard incompatibilists (e.g., Derk Pereboom) reject *all* responsibility if determinism is true. |
  | **Semicompatibilism**               | —                                                                           | Many PAP-rejecters (e.g., John Martin Fischer) endorse it: responsibility is compatible with determinism *without* requiring alternatives. Not all agree (e.g., libertarians). |
  | **Character-based Frankfurt cases** | —                                                                           | Some argue character *implies* determinism, muddying the waters. Others (e.g., Susan Wolf) think character can ground responsibility. |
  | **Non-robust alternatives**         | Widely accepted as insufficient for moral responsibility.                   | Some (e.g., Robert Kane) argue *any* alternative possibility (even non-robust) preserves PAP. |

  **Key nuance**: Rejecting PAP is **not** the same as endorsing semicompatibilism.  
  - ~75% of philosophers reject PAP (PhilPapers survey).  
  - But only ~40% accept compatibilism broadly; many PAP-rejecters are *skeptical* about responsibility (e.g., "free will pessimists").  

  ---

  ### Practical Advice for Your Brother
  - **Don’t say "philosophy proves I’m right"**: Philosophy shows his excuse **doesn’t automatically absolve him**, but it *doesn’t* prove he’s responsible. That depends on:  
    - Whether his action **truly expressed his character** (not a one-off lapse).  
    - Whether he **endorsed/owned** the attitudes behind it (not internal conflict).  
  - **Say this instead**:  
    *"Even if you couldn’t have acted differently, that doesn’t make it okay. We blame people *for* having harmful character traits when they cause damage. If ‘how you are’ hurts others, you owe repair—not excuses."*  

  This shifts focus from *control* to **ownership**: His defense admits the act *came from him*. That’s why we hold him responsible.
