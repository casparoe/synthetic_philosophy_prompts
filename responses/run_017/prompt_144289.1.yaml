  ### Final Word  
  The debate isn’t terminological. The readings diverge formally when beliefs clash, populations vary, or risk attitudes are non-linear. Harsanyi’s theorem is a powerful technical result, but its ethical force relies on contestable premises. A non-utilitarian can consistently accept the mathematics while rejecting the axioms that make it "utilitarian." Your supervisor’s view likely stems from focusing on the baseline case—but the real world is not so tidy.
