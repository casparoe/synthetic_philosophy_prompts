prompt: |-
  You are a decision theorist and political philosopher who works on social choice theory and the foundations of welfare economics. Take your time and reason explicitly rather than asserting conclusions. Before you settle on an answer, brainstorm the ways in which the two readings below could come apart, including ways I have not thought of, and tell me plainly which of those are genuine formal differences and which are only differences in emphasis, imagery, or storytelling. Where you think my framing is confused, say so and replace it with a better one.

  I am writing a paper on whether Harsanyi's aggregation theorem really gives anyone a reason to be a utilitarian, and I keep going in circles with a friend in the economics department about how the theorem should be read. He says the result has two readings that are, in the end, one principle in different words. On the first reading, the one usually credited to Harsanyi, we rank social options as an impartial observer behind a veil of ignorance would rank them: someone who has an equal chance of turning out to be any member of the population and who evaluates a policy by its expected utility under a single probability distribution over states of the world. On the second reading, we rank options by how good they are for a member drawn at random from the population, where that member judges the options by her own lights, that is, with her own utility function and her own subjective probabilities. This second reading is the one you would get institutionally from sortition, from handing the choice to a randomly drawn citizen or assembly, and it is what my friend calls average expected welfare. In the baseline case of a fixed population and a single shared probability distribution the two readings return the same number, because the average of expected utilities is the expected value of the average. My supervisor thinks the whole debate is terminological, and I do not know whether he is right. So: is the agreement in the baseline case evidence that these are one principle rather than two, or is it an artifact of assumptions that the baseline quietly builds in? Where precisely do the readings come apart, and which of them, if either, is Harsanyi's own?

  Here is my tentative map of where the difference might live; please check it, correct it, and tell me which of these points is doing real work. First, the observer's probabilities. If the veil operates with one shared distribution while the random-member reading uses each person's own beliefs, then under widespread disagreement about probabilities it can happen that every single person prefers policy A to policy B ex ante, each by her own lights, while the impartial observer prefers B. The observer then violates what looks like a Pareto condition, and the unanimity in favour of A begins to look spurious. Second, the observer's attitude to risk behind the veil. It seems to me that a great deal rides on whether she is risk-neutral in the currency of individual well-being: a risk-neutral observer gets something recognisably utilitarian, an observer who applies a concave transformation to each person's well-being before summing gets something prioritarian, and an extremely risk-averse observer gets something close to maximin, close to the use Rawls makes of the original position. If that is right, the theorem settles much less than its defenders claim, and the distance between Harsanyi and Rawls is not about the veil at all but about risk-attitude behind it. Third, variable population. If the observer's chance of being a given person is one over the number of people who actually exist, the reading appears to yield average utilitarianism; if instead the veil ranges over possible people in such a way that the chance of being any given possible person does not shrink as the population grows, it appears to yield total utilitarianism together with the repugnant conclusion. Is that a coherent way of stating the difference, and is the choice between those priors itself a moral assumption dressed up as probability theory? Finally, a worry that bears on both readings: individual von Neumann-Morgenstern utility functions are fixed only up to positive affine transformation, so weights and zero points can be traded off against one another, and it is unclear to me how much interpersonal comparison the theorem actually purchases.

  Close by answering the question I care about: what, if anything, does the theorem establish that a thoughtful non-utilitarian should have to concede, and what can she go on denying without inconsistency? Fix the difference between the readings with at least one small worked example involving two or three people and a concrete policy choice, and show the arithmetic. I do not want references or a reading list, only the argument.
reasoning: |-
  We are considering two readings of Harsanyi's aggregation theorem:

  Reading 1 (Impartial Observer): We rank social options by the expected utility of an impartial observer who is behind a veil of ignorance. This observer has an equal chance of becoming any member of the actual population and evaluates policies using a single probability distribution over states of the world.

  Reading 2 (Random Member / Average Expected Welfare): We rank social options by the average expected utility of the members of the population, where each member uses their own utility function and their own subjective probabilities to compute expected utility.

  In the baseline case (fixed population and a single shared probability distribution) these two readings yield the same ranking. But we want to know if they are fundamentally the same principle or if they come apart in important ways.

  Let me break down the differences you've outlined and add others, then assess which are formal and which are merely differences in emphasis. Then I will address your specific questions and provide a worked example.

  ### 1. Differences in Probability Assessments (Your First Point)
  - In Reading 1, the impartial observer uses a single probability distribution (say, the one agreed upon by all, or perhaps an objective one). 
  - In Reading 2, each individual uses their own subjective probabilities.
  - Thus, in the presence of disagreement about probabilities, the two readings can diverge.

  **Formal Difference?** Yes, this is a genuine formal difference. It can lead to violations of ex ante Pareto.

  Example: Consider two people, Alice and Bob, and two policies, A and B. There are two states of the world, S1 and S2.

  - Alice's beliefs: P_Alice(S1)=0.9, P_Alice(S2)=0.1
  - Bob's beliefs: P_Bob(S1)=0.1, P_Bob(S2)=0.9

  Utilities for Alice:
  - Policy A: in S1: 10, in S2: 0
  - Policy B: in S1: 0, in S2: 10

  Utilities for Bob:
  - Policy A: in S1: 0, in S2: 10
  - Policy B: in S1: 10, in S2: 0

  Now compute expected utilities for each:

  Alice:
  - EU_Alice(A) = 0.9*10 + 0.1*0 = 9
  - EU_Alice(B) = 0.9*0 + 0.1*10 = 1
    So Alice prefers A to B.

  Bob:
  - EU_Bob(A) = 0.1*0 + 0.9*10 = 9
  - EU_Bob(B) = 0.1*10 + 0.9*0 = 1
    So Bob prefers A to B? Wait, let me check again.

  Wait, note: For Bob, Policy A gives 0 in S1 and 10 in S2. So:
  - EU_Bob(A) = P_Bob(S1)*0 + P_Bob(S2)*10 = 0.1*0 + 0.9*10 = 9
  - EU_Bob(B) = P_Bob(S1)*10 + P_Bob(S2)*0 = 0.1*10 + 0.9*0 = 1

  So both Alice and Bob prefer A to B! Each has an expected utility of 9 under A and 1 under B.

  Now, consider the impartial observer (Reading 1). The observer uses a single probability distribution. Suppose the observer uses the average of the two beliefs: P(S1)=0.5, P(S2)=0.5.

  The observer, when behind the veil, has a 50% chance of being Alice and 50% chance of being Bob. But note: the observer also uses the single probability distribution (0.5, 0.5) for the states.

  So for the observer, the utility if they turn out to be Alice:
  - If policy A: then in state S1: 10, S2:0. So expected utility (using observer's probabilities) = 0.5*10 + 0.5*0 = 5.
  - If policy B: then in state S1:0, S2:10. So expected utility = 0.5*0 + 0.5*10 = 5.

  Similarly, if they turn out to be Bob:
  - Policy A: 0.5*0 + 0.5*10 = 5
  - Policy B: 0.5*10 + 0.5*0 = 5

  Then the overall expected utility for the observer (with 50% chance of being each) is:
  - For A: 0.5 * (utility if Alice) + 0.5 * (utility if Bob) = 0.5*5 + 0.5*5 = 5
  - For B: same, 5.

  So the observer is indifferent between A and B.

  But in Reading 2, we take the average expected utility:
  - For A: (EU_Alice(A) + EU_Bob(A))/2 = (9+9)/2 = 9
  - For B: (1+1)/2 = 1
  So Reading 2 strongly prefers A.

  Hence, we have a divergence: both individuals prefer A to B, but the impartial observer (with the averaged probability) is indifferent. Moreover, if we had chosen a different single probability for the observer (say, one that matches Alice's beliefs) then the observer would prefer A to B? But that's arbitrary.

  However, note that in this example, the observer's single probability distribution (which we took as 0.5,0.5) is not the same as either individual's. The key point is that under Reading 1, we are forced to use a single probability for the states, while in Reading 2, we use each individual's own beliefs.

  This example shows a formal difference: Reading 1 can violate ex ante Pareto. Here, both individuals ex ante (by their own lights) prefer A to B, but the impartial observer does not strictly prefer A.

  ### 2. Risk Attitudes (Your Second Point)
  You are absolutely right that the risk attitude of the impartial observer matters. In Harsanyi's setup, the observer is assumed to be expected utility maximizer and risk-neutral with respect to the von Neumann-Morgenstern (vNM) utility index. But note: the vNM utility index for the observer is defined over lotteries that are compound: they involve both the state of the world and the identity of the individual.

  However, the key is how we interpret the vNM utilities of the individuals. Harsanyi assumes that we have already fixed the vNM utility functions for each individual in a way that is interpersonally comparable. This is a strong assumption.

  In Reading 1, the observer has a vNM utility function defined over social lotteries (which determine both who you are and what state occurs). The theorem says that if the observer is risk-neutral in the space of individual utilities (i.e., the observer's utility is a weighted sum of the individual utilities) then it becomes utilitarian. But why risk-neutral? The theorem does not force risk neutrality. It forces linearity in the probabilities, which in this context becomes linearity in the individual utilities.

  But note: the vNM representation theorem only gives us a utility function unique up to positive affine transformation. So if we have fixed the interpersonal comparisons, then the observer's utility function over the lotteries must be linear in the individual utilities to satisfy the expected utility axioms. However, the issue of risk attitudes is more subtle.

  Let me clarify: the observer's vNM utility function is defined over outcomes that are (identity, state). We can write such an outcome as (i, s). Let U(i,s) be the utility the observer assigns to being person i in state s. Then, for a lottery (which is a probability distribution over (i,s)), the observer's expected utility is the expectation of U(i,s).

  Harsanyi's theorem assumes that U(i,s) = V_i(s) for some function V_i that we interpret as the utility of person i in state s. Then the observer's expected utility for a lottery is the expectation of V_i(s). But note that this expectation is taken with respect to the joint distribution over i and s.

  In the veil of ignorance, the lottery is such that first we choose i uniformly (if we assume equal chance) and then given i, we have a distribution over s. So the observer's expected utility is (1/n) * sum_i [ expected value of V_i(s) with respect to the observer's probability over s ].

  But if the observer is risk-averse over the space of individual utilities, then we would have to transform the V_i(s) nonlinearly. However, Harsanyi's theorem does not do that. It assumes that U(i,s) = V_i(s) and that the observer is an expected utility maximizer. So the observer is risk-neutral with respect to the scale of V_i.

  But what are the V_i? They are the individual vNM utilities. The theorem assumes that we have interpersonally comparable vNM utilities. Then the observer's utility is the average of the individual utilities (in the baseline). So it is risk-neutral in the space of these utilities.

  In Reading 2, we are just averaging the expected utilities of the individuals, each computed with their own probabilities. There is no additional risk attitude because we are not aggregating at a higher level. Each individual is an expected utility maximizer, and we average their expected utilities.

  So the difference in risk attitudes is only present in Reading 1. But note: if we interpret the individual utilities in Reading 2 as vNM utilities, then each individual is allowed to have their own risk attitudes. However, when we average the expected utilities, we are not introducing any further risk attitude.

  Therefore, the two readings differ in that Reading 1 requires a single risk attitude for the observer (which by the axioms is risk-neutral in the utility space) while Reading 2 uses the risk attitudes of the individuals (as embedded in their vNM utilities) and then averages.

  But note: the vNM utilities already capture risk attitudes. So if we have fixed the interpersonal comparisons appropriately, then the risk attitudes are already accounted for in the individual utility functions. Then the observer's risk-neutral aggregation is over these already risk-adjusted utilities.

  This point is complex and often misunderstood. The formal difference here is that Reading 1 uses a single risk attitude (that of the observer) for the entire aggregation, which is risk-neutral in the utility space, while Reading 2 uses the risk attitudes of the individuals and then averages. However, if the individual utilities are interpersonally comparable and already capture the risk attitudes, then the observer's risk neutrality might be seen as appropriate.

  But if we allow the observer to be risk-averse over the individual utilities, then we break the expected utility form. Harsanyi's theorem requires the observer to satisfy the vNM axioms, so the observer must be risk-neutral in the space of the outcomes (which are (i,s) pairs). So we cannot have risk aversion over the individual utilities without violating the axioms.

  Therefore, in Harsanyi's original setup, the observer is risk-neutral in the individual utilities. This leads to utilitarianism. If we want prioritarianism, we would have to transform the individual utilities and then aggregate, but that would break the vNM axioms for the observer.

  So your point is valid: the theorem does force risk neutrality in the utility space. And that is a substantive assumption.

  ### 3. Variable Population (Your Third Point)
  In Reading 1, if the veil of ignorance includes possible people, then the probability of being any particular person might depend on which policy is chosen (because different policies create different populations). This is the problem of different-sized populations.

  - If the observer's chance of being a particular actual person is 1/n (where n is the number of people under the policy), then we get average utilitarianism: we average the utilities of the people who exist.
  - If the observer's chance of being a particular possible person is constant (i.e., we consider a fixed set of possible people, and the probability of being any particular one is the same regardless of whether they exist or not), then we get total utilitarianism: we sum the utilities.

  This is a moral choice. Harsanyi himself did not explicitly address variable population in his original theorem, so we cannot say what he intended. But both variants are used in the literature.

  In Reading 2, the random member reading, we only average over the actual population. So if the population size changes, we average the utilities of the people who exist. Thus, it naturally leads to average utilitarianism.

  So the two readings might diverge in variable population settings. But note that Reading 2 is defined only over the actual population, so it cannot handle possible people. Reading 1, when extended to variable populations, requires a decision about the reference set.

  This is a formal difference in the way the two readings handle population ethics.

  ### 4. Interpersonal Comparisons and the vNM Framework (Your Fourth Point)
  The vNM theorem only gives individual utility functions up to positive affine transformations. So without additional structure, we cannot compare utility levels or differences across individuals. Harsanyi's theorem requires that we have interpersonally comparable utility functions. This is a significant assumption.

  Both readings require interpersonal comparisons. In Reading 1, the observer must assign utilities to being each person in each state. In Reading 2, we are averaging expected utilities, so we need the same.

  Without interpersonal comparability, neither reading works. So both readings are subject to the same challenge. But note: the theorem does not "purchase" interpersonal comparisons; it assumes them.

  ### Additional Differences
  - **The Scope of the Veil**: In Reading 1, the veil of ignorance might be interpreted as a thought experiment that includes non-material factors (like the psychological makeup of individuals) while Reading 2 is more institutional (a randomly chosen citizen). This might lead to different interpretations of what the individual utilities represent.
  - **Information**: The veil of ignorance might be understood as having no knowledge of which person one will be, but it might have access to general facts. In Reading 2, the randomly drawn citizen uses her own beliefs, which might be influenced by her position in society. This could lead to biases.

  ### Which Reading is Harsanyi's?
  Harsanyi's original formulation (in his 1955 paper and his 1977 book) is the impartial observer. He uses the veil of ignorance and the idea of an impartial spectator. The random member reading is an alternative interpretation that some have proposed, but it is not Harsanyi's own.

  ### What Does the Theorem Establish?
  The theorem shows that if we have interpersonally comparable vNM utilities and if we accept the vNM axioms for the social ranking (or for the impartial observer), then social preferences must be represented by a weighted sum of individual utilities. In the symmetric case (equal weights) we get average utilitarianism. 

  However, the theorem does not force us to accept the vNM axioms at the social level. Moreover, the interpersonal comparability assumption is substantial.

  A thoughtful non-utilitarian can consistently deny:
  - That social preferences should satisfy the vNM axioms (they might object to the independence axiom, for instance).
  - That we have interpersonally comparable utilities in the required sense.
  - That the veil of ignorance with equal probability is the right way to model impartiality.

  They might also object to the risk neutrality in the utility space (as Rawls does, by advocating maximin).

  But note: the theorem is a representation theorem. It says that if you accept the axioms, then you must be utilitarian. So the non-utilitarian must reject at least one axiom.

  ### Worked Example to Fix the Difference
  Let's create a simple example where the two readings diverge because of probability disagreement.

  **Setup**:
  - Two people: Alice and Bob.
  - Two states: S1 and S2.
  - Two policies: Policy X and Policy Y.

  **Beliefs**:
  - Alice: P(S1)=0.9, P(S2)=0.1
  - Bob: P(S1)=0.1, P(S2)=0.9

  **Utilities** (for each policy and state, for each person):

  Policy X:
  - In S1: Alice gets 10, Bob gets 0
  - In S2: Alice gets 0, Bob gets 10

  Policy Y:
  - In S1: Alice gets 0, Bob gets 10
  - In S2: Alice gets 10, Bob gets 0

  **Reading 2 (Random Member / Average Expected Welfare)**:
  Compute each individual's expected utility:

  Alice:
  - EU(X) = 0.9*10 + 0.1*0 = 9
  - EU(Y) = 0.9*0 + 0.1*10 = 1

  Bob:
  - EU(X) = 0.1*0 + 0.9*10 = 9
  - EU(Y) = 0.1*10 + 0.9*0 = 1

  Average expected utility:
  - For X: (9+9)/2 = 9
  - For Y: (1+1)/2 = 1
  So Reading 2 ranks X above Y.

  **Reading 1 (Impartial Observer)**:
  Assume the observer uses a single probability distribution for states. Suppose we take the average: P(S1)=0.5, P(S2)=0.5.

  The observer has a 50% chance of being Alice and 50% chance of being Bob.

  For policy X:
  - If observer is Alice: then with probability 0.5 (for S1) gets 10, with 0.5 (for S2) gets 0. So expected utility = 0.5*10 + 0.5*0 = 5.
  - If observer is Bob: then with probability 0.5 (for S1) gets 0, with 0.5 (for S2) gets 10. So expected utility = 0.5*0 + 0.5*10 = 5.
  - Overall: 0.5*5 + 0.5*5 = 5.

  For policy Y:
  - If Alice: 0.5*0 + 0.5*10 = 5
  - If Bob: 0.5*10 + 0.5*0 = 5
  - Overall: 5.

  So the observer is indifferent between X and Y.

  Hence, the two readings differ: Reading 2 prefers X to Y, while Reading 1 is indifferent.

  ### Conclusion
  The two readings are formally distinct in at least two ways: the handling of probabilities and the handling of variable populations. The baseline case agreement relies on shared probabilities and fixed population. The theorem, as Harsanyi intended, is the impartial observer reading, and it requires risk neutrality in the interpersonally comparable utilities. 

  What the theorem establishes is that under the assumptions of interpersonally comparable utilities and the vNM axioms for social preferences (or the observer), utilitarianism follows. A non-utilitarian can reject the axioms or the interpersonal comparability without inconsistency.
answer: |-
  ### Clarifying the Framing  
  Your framing captures key distinctions, but it conflates some issues and misses deeper formal separations. The two readings are not "one principle in different words" but distinct aggregation methods that coincide only under restrictive assumptions. The baseline case masks these differences by assuming shared probabilities, fixed population, and linear aggregation. Below, I dissect where and why they diverge, separating formal differences from interpretive ones. I then address your core questions with a worked example.

  ---

  ### Brainstorming Differences Between the Two Readings  
  I categorize differences as **formal** (affecting social rankings) or **interpretive** (affecting justification but not arithmetic). Formal differences alter outcomes under plausible conditions; interpretive differences concern ethical storytelling.

  1. **Probability Handling (Your First Point)**  
     - **Formal Difference**: In the impartial observer (IO) reading, a *single* probability distribution applies to all individuals and states. In the random member (RM) reading, each person uses their *subjective* probabilities.  
     - **Where They Diverge**: Under belief disagreement, RM satisfies *ex ante Pareto* (if all prefer A to B, society ranks A > B), but IO may violate it.  
     - **Why It Matters**: IO imposes a "social probability" that may override individual beliefs. RM treats individuals as sovereign believers. This is not just emphasis—it changes rankings.

  2. **Risk Attitudes (Your Second Point)**  
     - **Formal Difference**: The IO’s risk attitude is applied *after* individual utilities are fixed. RM inherits risk attitudes *through* individual vNM utilities.  
     - **Your Insight Is Correct**: Harsanyi assumes the IO is *risk-neutral in vNM utility space*. A concave transformation would yield prioritarianism; maximin requires extreme risk aversion.  
     - **Where Framing Needs Adjustment**: This isn’t about "risk in well-being" per se. vNM utilities *already embed* risk preferences. The IO’s risk neutrality is a linearity assumption in the aggregation, distinct from individuals’ risk attitudes.  
     - **Key Distinction**:  
       - IO: Risk attitude is a *social choice* (e.g., "Should society be risk-averse over individual fates?").  
       - RM: Risk attitudes are *decentralized* to individuals (e.g., "Aggregate their risk-inclusive evaluations").  
     - **Formal?**: Yes. If individuals have identical beliefs but different risk preferences, IO’s linearity forces additive aggregation, while RM respects risk diversity without further transformation.

  3. **Variable Population (Your Third Point)**  
     - **Formal Difference**:  
       - IO: The veil’s "equal chance" requires defining a *reference set of possible people*. If probabilities adjust to population size (1/n for each actual person), you get *average utilitarianism*. If probabilities are fixed across possible people (ignoring existence), you get *total utilitarianism*.  
       - RM: Only actual people are averaged. It naturally yields *average utilitarianism*.  
     - **Moral Assumption?**: Yes. Choosing the reference set—actual vs. possible people—is ethical, not probabilistic. Probability theory doesn’t dictate how to weigh nonexistent beings.  
     - **Divergence**: In population ethics, IO can justify the repugnant conclusion (if priors include possible people); RM cannot.

  4. **Interpersonal Comparisons (Your Fourth Point)**  
     - **Formal and Interpretive**:  
       - vNM utilities are unique up to affine transformations (scale and zero). Interpersonal comparisons require fixing a common scale/zero.  
       - **Shared Problem**: Both readings assume *cardinal unit comparability* (differences are comparable). The theorem doesn’t "purchase" this; it *presupposes* it.  
       - **Not a Difference Between Readings**: IO and RM face identical ambiguity here. The "weights" you mention arise from affine transformations.  
       - **Interpretive Twist**: IO "imagines" being each person, arguably demanding stronger interpersonal empathy. RM is mechanical averaging.

  5. **Additional Differences You Might Not Have Considered**  
     - **Responsibility for Beliefs**:  
       - IO: Uses a social probability (e.g., objective or consensual). If individuals have misguided beliefs, IO may "correct" them.  
       - RM: Honors subjective beliefs even if irrational or biased.  
       - **Formal?**: Yes. Affects outcomes under belief divergence.  
     - **Dynamic Choices**:  
       - IO: Ranks policies *once* from behind the veil.  
       - RM: Could be implemented repeatedly (e.g., sortition for each decision), allowing belief updating.  
       - **Formal?**: Potentially, but depends on implementation.  
     - **Source of Authority**:  
       - IO: Justified by *impartiality as empathy* (Harsanyi’s view).  
       - RM: Justified by *procedural fairness* (e.g., sortition as democracy).  
       - **Interpretive**: Affects legitimacy but not arithmetic.

  ---

  ### Which Reading is Harsanyi’s?  
  Harsanyi unequivocally endorses the **impartial observer** (IO) reading. He sees the veil as a device for *empathetic identification*, not statistical sampling. His theorem assumes:  
  - A single, objective probability distribution over states.  
  - Linear (risk-neutral) aggregation of interpersonally comparable utilities.  
  - Fixed populations in his baseline work.  

  The RM reading ("average expected welfare") is a modern reinvention, often invoked in democratic theory. It is *not* Harsanyi’s.

  ---

  ### Where the Readings Formally Diverge: A Worked Example  
  **Scenario**: Two people (Alice, Bob), one policy choice (A vs. B), two states (Sunny, Rainy).  
  - **Beliefs**:  
    - Alice: P(Sunny) = 0.9, P(Rainy) = 0.1  
    - Bob: P(Sunny) = 0.1, P(Rainy) = 0.9 (disagreement).  
  - **Utilities**:  
    - Policy A: Sunny → Alice gets 10, Bob gets 0; Rainy → Alice gets 0, Bob gets 10.  
    - Policy B: Sunny → Alice gets 0, Bob gets 10; Rainy → Alice gets 10, Bob gets 0.  

  #### Step 1: Random Member (RM) Reading  
  - Alice’s EU for A: (0.9 × 10) + (0.1 × 0) = **9**  
    Alice’s EU for B: (0.9 × 0) + (0.1 × 10) = **1** → Prefers A.  
  - Bob’s EU for A: (0.1 × 0) + (0.9 × 10) = **9**  
    Bob’s EU for B: (0.1 × 10) + (0.9 × 0) = **1** → Prefers A.  
  - **RM Social Welfare**:  
    - A: (9 + 9)/2 = **9**  
    - B: (1 + 1)/2 = **1** → **A ≻ B**.  

  #### Step 2: Impartial Observer (IO) Reading  
  Assume IO uses *equal chance of being Alice/Bob* and a *social probability* (e.g., average beliefs: P(Sunny) = P(Rainy) = 0.5).  
  - IO’s EU if they become Alice:  
    - A: (0.5 × 10) + (0.5 × 0) = **5**  
    - B: (0.5 × 0) + (0.5 × 10) = **5** → Indifferent.  
  - IO’s EU if they become Bob:  
    - A: (0.5 × 0) + (0.5 × 10) = **5**  
    - B: (0.5 × 10) + (0.5 × 0) = **5** → Indifferent.  
  - **IO Social Welfare**:  
    - A: (0.5 × 5) + (0.5 × 5) = **5** (50% chance of being Alice/Bob)  
    - B: (0.5 × 5) + (0.5 × 5) = **5** → **A ~ B**.  

  #### Result  
  - **RM**: A ≻ B (both prefer A).  
  - **IO**: A ~ B (indifference).  
  - **Formal Divergence**: IO violates ex ante Pareto, as both individuals strictly prefer A, but society is indifferent. This stems from IO overriding subjective beliefs with a social probability.  

  ---

  ### What the Theorem Establishes (and What It Doesn’t)  
  **What a Thoughtful Non-Utilitarian Must Concede**:  
  - If society accepts:  
    (a) vNM rationality (independence axiom, etc.),  
    (b) a single probability distribution over states,  
    (c) interpersonal comparability of vNM utilities,  
    (d) Pareto indifference (if all indifferent, society is indifferent),  
  then social welfare *must* be a weighted sum of individual utilities. Symmetry (equal weights) implies utilitarianism.  

  **What a Non-Utilitarian Can Deny Without Inconsistency**:  
  1. **The Probability Assumption**: Reject (b). Beliefs are personal; imposing one distribution is paternalistic.  
  2. **Linearity/Risk-Neutrality**: Reject (a) for social aggregation. Maximin or prioritarian transformations require relaxing vNM axioms.  
  3. **Interpersonal Comparability**: Reject (c). vNM utilities lack natural units for comparison.  
  4. **The Veil’s Scope**: Reject that IO models impartiality fairly (e.g., Rawls: the veil should strip knowledge of probabilities).  
  5. **Ex Ante Pareto**: Defend it as sacrosanct (then RM is preferable to IO when beliefs differ).  

  **Crucially**: The theorem does *not* justify utilitarianism as a moral doctrine. It shows that *if* you accept the axioms, you get additive aggregation. Rejecting any axiom (e.g., risk-neutrality) opens space for non-utilitarian positions. Harsanyi’s IO reading is particularly fragile, as it conflates empathy with probabilistic averaging.

