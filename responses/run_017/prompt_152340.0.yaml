prompt: |-
  I am drafting the framing chapter of a survey on the epistemology of markets, and I want the specification fixed before I score any views. Fix the purpose of a theory in this area as follows: it is to serve as microfoundations for market design, meaning it must say when a market will have any volume at all, and when its price is something a non-participant may treat as evidence about the world.

  Write the desiderata such a theory has to meet: the phenomena it must explain, the cases it must get right, the distinctions it may not collapse, with the motivating case behind each, and mark each requirement as non-negotiable or as a preference of one camp. Candidates I want explicitly adjudicated rather than assumed: explaining nonzero volume without appealing to irrationality; separating informational motives from risk-sharing, liquidity, and noise; respecting that another party's willingness to trade is itself evidence; saying whose beliefs a price aggregates and whether that price is evidence for a bystander; and surviving the fact that no-trade results, once published and commonly known, are themselves announcements that change the situation they describe.

  The case I most want handled I have not seen treated. Call a market a blind book when orders are sealed, clearing is at a uniform price, and no participant observes any other order or can condition on another's willingness to trade. An account that explains trade purely through the inferences traders draw from others' willingness to trade predicts that volume collapses to zero in a blind book populated by traders with identical information and only mildly different exposures; suppose instead that volume falls by roughly half and then stabilizes. Build into the list what a theory must do with residual volume of that kind — must it explain it, or may it explain it away — and say whether the list should include protocol-neutrality: that an explanation of why trade occurs not rest on features of the trading protocol that are merely information channels.

  Flag any pair of desiderata you suspect cannot be jointly satisfied, and name the single requirement that excludes the largest number of the usual families of views (noise traders, heterogenous priors, ambiguity aversion, bounded rationality, hedging). Score those families against the list in a few lines at most.
reasoning: |-
  We are setting up desiderata for a theory of market epistemology that serves as microfoundations for market design. The theory must explain when a market has nonzero volume and when the price can be treated as evidence about the world by a non-participant.

  We break down the desiderata as follows:

  ### I. Non-negotiable Requirements

  1. **Nonzero Volume without Irrationality**: 
     - **Phenomenon to explain**: Trade occurs even when all traders are rational and have common prior beliefs.
     - **Motivating case**: In many markets, we observe continuous trading activity. The no-trade theorems (e.g., Milgrom and Stokey, 1982) show that with common priors and rational expectations, trade should not occur. Yet, trade does occur. We require an explanation that does not rely on labeling some traders as irrational (e.g., noise traders) but instead provides a rational foundation for trade.
     - **Non-negotiable**: Yes. We must explain trade without invoking irrationality.

  2. **Separation of Informational Motives**:
     - **Phenomenon to explain**: Trade can occur for reasons other than information asymmetries (e.g., risk-sharing, liquidity needs, hedging).
     - **Motivating case**: In many markets (e.g., commodity futures), participants trade to hedge against risks. We must be able to distinguish trades driven by information from those driven by other motives. Collapsing these motives would lead to incorrect inferences from prices (e.g., interpreting a price change as information when it is due to a liquidity shock).
     - **Non-negotiable**: Yes. The theory must not collapse informational motives with non-informational ones (risk-sharing, liquidity, noise).

  3. **Evidence from Willingness to Trade**:
     - **Phenomenon to explain**: The mere fact that someone is willing to trade at a certain price is informative to others.
     - **Motivating case**: In open order book markets, the presence of a large buy order may signal positive information, affecting the market price even before the trade occurs. This must be accounted for in the formation of prices and trading decisions.
     - **Non-negotiable**: Yes. The theory must incorporate that the act of placing an order (or the existence of an order) conveys information.

  4. **Aggregation of Beliefs and Price as Evidence for Bystanders**:
     - **Phenomenon to explain**: Market prices aggregate the beliefs of participants, and non-participants (e.g., policymakers, researchers) can treat the price as evidence about the state of the world.
     - **Motivating case**: The price of oil futures is used as an indicator of future oil supply and demand, even by entities not trading. The theory must specify whose beliefs are aggregated (e.g., only the marginal trader?) and under what conditions the price is informative to non-participants.
     - **Non-negotiable**: Yes. The theory must explain the aggregation process and the evidential value of prices.

  5. **Survival of No-Trade Results**:
     - **Phenomenon to explain**: The publication of no-trade results (showing that under certain conditions trade should not occur) itself becomes public knowledge and may alter trading behavior.
     - **Motivating case**: After the publication of no-trade theorems, if traders become aware that trade should not occur under common knowledge of rationality and common priors, they might still trade. The theory must account for how such common knowledge affects the market and whether it can still sustain trade.
     - **Non-negotiable**: Yes. The theory must be robust to common knowledge of the theory itself.

  ### II. The "Blind Book" Case

  6. **Residual Volume in Blind Book Markets**:
     - **Phenomenon to explain**: In a blind book (sealed orders, uniform price, no observation of others' orders), we observe that volume does not collapse to zero even when traders have identical information and only mildly different exposures. Instead, volume falls by about half and then stabilizes.
     - **Motivating case**: This is a critical test for theories that rely on inferences from others' willingness to trade. If the theory explains trade solely by such inferences, it would predict zero volume in a blind book. But if volume persists, the theory must either explain it or explain it away (e.g., by showing that the residual volume is due to non-informational motives).
     - **Requirement**: The theory must explain the residual volume without relying on the observation of others' orders. It is non-negotiable that the theory accounts for this volume (either by explaining it as rational or by showing that it is due to a non-informational motive that the theory already accounts for). We cannot simply ignore it.

  ### III. Preference (Camp-Dependent)

  7. **Protocol-Neutrality**:
     - **Phenomenon to explain**: The explanation for why trade occurs should not rest on features of the trading protocol that are merely information channels.
     - **Motivating case**: If a theory explains trade only because of the information leaked by the trading protocol (e.g., an open outcry system revealing intentions), then it fails to explain trade in a blind book. We want a theory that gets at the fundamental drivers of trade, not just artifacts of the trading mechanism.
     - **Status**: This is a preference of one camp (the camp that seeks a fundamental explanation). However, it is not non-negotiable because some might argue that the trading protocol is an inherent part of the market and thus must be included. But for microfoundations for market design, we want to know what features of the protocol are necessary for trade, so we mark it as a preference for protocol-neutrality. However, given the blind book case, we might have to require it to some extent.

  ### IV. Potential Conflicts

  - **Conflict between Nonzero Volume without Irrationality and the No-Trade Theorems**: The no-trade theorems are robust under common priors and rationality. To have trade, we must break one of the assumptions. We cannot break rationality (by requirement 1) so we must break common priors or common knowledge? But requirement 5 says that the theory must survive the publication of no-trade results (which makes common knowledge of rationality and the no-trade result itself). This seems to lead to a contradiction.

    **Resolution**: The theory must break the common prior assumption in a limited way? Or introduce dynamic trading? Or incomplete information about others' preferences? Note that requirement 1 does not require common priors, only that we do not appeal to irrationality. So heterogenous priors (which are still rational) might be allowed? But requirement 5 (common knowledge of the no-trade result) might then be problematic because if traders know that trade should not occur under common priors, and they know that they have heterogenous priors, then they might update in a way that eliminates trade? This is tricky.

  - **Conflict between the Blind Book and Inferences from Willingness to Trade**: In a blind book, traders cannot condition on others' orders. So if trade is driven by inferences from others' willingness to trade, then in a blind book trade should not occur. But we observe residual volume. Therefore, the theory must explain the residual volume by non-informational motives (e.g., risk-sharing, liquidity) without relying on inferences from others' orders.

  ### V. The Single Requirement that Excludes the Most

  The requirement that **excludes the largest number of usual families of views** is: **Nonzero Volume without Irrationality** (Requirement 1). Why?

  - **Noise traders**: Excluded because they are irrational.
  - **Heterogenous priors**: Allowed? But note that heterogenous priors are often criticized as irrational (since they imply that rational agents with the same information would have the same prior). However, if we allow heterogenous priors as a form of rational disagreement (e.g., due to different models of the world), then they are not excluded by requirement 1. But requirement 5 (common knowledge of no-trade results) might challenge them because if traders know that trade is only occurring due to heterogenous priors, they might question their own priors? This is an open question.
  - **Ambiguity aversion**: This is a form of rational behavior under uncertainty (non-Bayesian). It is not irrational per se, so it might be allowed? But requirement 1 does not exclude it.
  - **Bounded rationality**: Excluded because it invokes cognitive limitations (irrationality).

  So requirement 1 excludes noise traders and bounded rationality. Heterogenous priors and ambiguity aversion are not excluded by requirement 1, but they might be challenged by requirement 5.

  However, note that requirement 5 (survival of no-trade results) might be the more stringent requirement because it forces the theory to be consistent even when traders are aware of the theoretical reasons why trade should not occur. This might exclude heterogenous priors: if traders know that the only reason they are trading is because of prior heterogeneity, and they know that the no-trade theorem says trade should not occur under common priors, then they might update to believe that their prior is wrong? This is an active area of research.

  ### VI. Scoring the Families of Views

  We score the usual families of views against the list of requirements:

  1. **Noise Traders**:
     - Fails Requirement 1 (relies on irrationality).
     - Fails Requirement 5 (if noise trading is known, rational traders might exploit it, but the noise traders themselves are irrational and thus the theory does not provide a full rational microfoundation).
     - Does not necessarily fail the blind book (if noise traders are present, they trade regardless) but fails on the requirement of explaining trade without irrationality.

  2. **Heterogenous Priors**:
     - Meets Requirement 1 (rational, though some debate if heterogenous priors are rational).
     - Fails Requirement 5? If the no-trade result is commonly known, then traders might realize that their trading is due to prior differences and might update to a common posterior? Then trade might cease. But in practice, traders might not update away their differences. This is unresolved.
     - May fail the blind book? In a blind book, heterogenous priors would still lead to trade (since traders have different valuations) so it might explain residual volume. However, it does not separate informational motives (Requirement 2) because in heterogenous priors, the trade is due to differences in beliefs (informational) and possibly risk-sharing? It tends to collapse motives.

  3. **Ambiguity Aversion**:
     - Meets Requirement 1 (rational in the sense of non-Bayesian models).
     - Might meet Requirement 5? Ambiguity-averse traders might still trade even after knowing no-trade theorems because they are averse to uncertainty and have different attitudes.
     - Might explain residual volume in blind book (due to non-informational motives? Not exactly: ambiguity aversion can lead to trade as a way to share uncertainty, but it is not purely non-informational). It might not clearly separate motives (Requirement 2).

  4. **Bounded Rationality**:
     - Fails Requirement 1 (by definition).

  ### VII. The Blind Book Requirement and Protocol-Neutrality

  The blind book case forces the theory to explain residual volume without relying on inferences from others' orders. This pushes us towards non-informational motives (like risk-sharing, liquidity) that are independent of the trading protocol. Therefore, the theory must incorporate non-informational motives as a fundamental driver of trade.

  Protocol-neutrality is then desirable: the theory should explain trade in a way that is robust to the trading protocol. The blind book is a test of protocol-neutrality because it removes the information channel of order observation. If the theory can explain trade in the blind book, then it is protocol-neutral to some extent.

  Thus, we mark protocol-neutrality as a requirement that is motivated by the blind book case. Given the residual volume in blind book markets, the theory must explain that volume without relying on the protocol (which in this case does not leak information). So we upgrade protocol-neutrality to non-negotiable for the purpose of market design? Because we want to design markets that are robust and understand the core drivers.

  ### VIII. Revised List of Desiderata

  **Non-negotiable Desiderata**:

  1. **Rational Foundations for Nonzero Volume**: The theory must explain nonzero trading volume without invoking irrationality (noise traders, bounded rationality). [Excludes noise traders and bounded rationality.]

  2. **Distinction of Trading Motives**: The theory must distinguish informational motives (asymmetric information, differences in beliefs) from non-informational motives (risk-sharing, liquidity needs, hedging). It must not collapse these. [Requires a multi-factor model?]

  3. **Informative Willingness to Trade**: The theory must account for the fact that the willingness of another party to trade is itself evidence that affects trading decisions and prices.

  4. **Price as Evidence for Bystanders**: The theory must specify whose beliefs are aggregated in the price and under what conditions the price can be treated as evidence about the world by non-participants.

  5. **Robustness to Common Knowledge of No-Trade Results**: The theory must be consistent even when traders are aware of no-trade theorems and the conditions under which trade should not occur.

  6. **Explanation of Blind Book Residual Volume**: The theory must explain the residual trading volume observed in blind book markets (with identical information and mildly different exposures) without relying on inferences from others' orders. This volume must be explained as a rational outcome.

  7. **Protocol-Neutrality**: The explanation for trade must not rely solely on information leaked by the trading protocol. The fundamental drivers of trade (informational and non-informational) must be identified independently of the protocol. [This is non-negotiable because of the blind book case.]

  ### IX. Suspected Incompatibilities

  - **Requirement 1 (Nonzero Volume without Irrationality) and Requirement 5 (Robustness to Common Knowledge of No-Trade Theorems)**: This is the most challenging. The no-trade theorems are very robust. We suspect that the only way to satisfy both is to break the common prior assumption and then show that even with common knowledge of the no-trade result, traders do not update in a way that eliminates trade. This might require a model with persistent differences in beliefs that are not eliminated by common knowledge of disagreement (e.g., due to overconfidence or ambiguous information). Alternatively, non-informational motives (like liquidity shocks) that are private and unobservable might survive.

  - **Requirement 2 (Distinction of Motives) and Requirement 6 (Blind Book)**: In the blind book, we need to explain residual volume by non-informational motives. But if the theory does not clearly separate motives, it might attribute the residual volume to informational motives and then fail because in a blind book with identical information, informational motives should not lead to trade. So the theory must have a clear separation.

  ### X. Conclusion

  The theory must account for all non-negotiable requirements. We suspect that the requirement of **Robustness to Common Knowledge of No-Trade Results (Requirement 5)** is the one that is hardest to meet and may exclude many models (including some heterogenous prior models). 

  For the blind book, we require that the residual volume is explained by non-informational motives (which are protocol-neutral). This is non-negotiable.

  We will now score the families of views:

  - **Noise Traders**: Fails 1, 5, 7. Not acceptable.
  - **Heterogenous Priors**: 
     - Passes 1? (debatable, but we allow) 
     - Fails 2? (often mixes motives) 
     - Fails 5? (common knowledge might lead to no trade) 
     - Passes 6? (if prior differences persist, trade occurs in blind book) 
     - Passes 7? (trade does not depend on protocol). 
     But the failure on 5 is critical. Also, it might fail 4 (price aggregation) because with heterogenous priors, the price may not aggregate information in a way that is meaningful for bystanders (since it reflects both beliefs and preferences).
  - **Ambiguity Aversion**: 
     - Passes 1? (if considered rational) 
     - Might pass 2? (if we can separate ambiguity aversion from information) 
     - Might pass 5? (ambiguity-averse traders might still trade) 
     - Passes 6? (trade for uncertainty-sharing) 
     - Passes 7? (protocol-neutral). 
     But it is less developed in explaining price aggregation and the evidential value for bystanders.

  **Final Note**: None of the existing families of views satisfies all requirements. We need a theory that combines non-informational motives (for blind book) and informational motives (for price informativeness) in a rational framework that is robust to common knowledge of no-trade results. One candidate is a model with both heterogeneous prior beliefs (for informational trade) and unobservable liquidity shocks (for non-informational trade), but then we must ensure that common knowledge of the no-trade result doesn't unravel the trade. Alternatively, models of disagreement due to ambiguous information (e.g., Easley and O'Hara) might be explored.
answer: |-
  Below is a structured specification of desiderata for a theory of market epistemology, designed to serve as microfoundations for market design. The requirements are derived from your core purpose (explaining nonzero volume and price as evidence for non-participants) and address your key concerns, including the "blind book" case and protocol-neutrality. Desiderata are categorized as non-negotiable (essential) or preference (camp-dependent), with motivating cases. Conflicts and evaluations of candidate families are included.

  ---

  ### **Desiderata for a Market Epistemology Theory**  
  **Core Purpose**: Provide microfoundations explaining (1) when markets have nonzero volume, and (2) when prices constitute evidence about the world for non-participants.  

  #### **Non-Negotiable Requirements**  
  1. **Nonzero volume without irrationality**  
     - **Phenomenon**: Trade persists even when all agents are rational (Bayesian updaters, expected utility maximizers).  
     - **Motivating Case**: No-trade theorems (e.g., Milgrom-Stokey) show trade vanishes under common priors and symmetric information. Real markets exhibit steady volume (e.g., daily equity trades). Must resolve this paradox without "noise traders" or behavioral errors.  
     - **Why Non-Negotiable**: Irrationality is a non-microfoundational circular explanation; market design requires robust, incentive-compatible mechanisms.  

  2. **Separation of informational motives from non-informational motives**  
     - **Phenomenon**: Trade can stem from information asymmetry, risk-sharing, liquidity needs, or hedging. These must remain distinct.  
     - **Motivating Case**: Oil futures markets: Hedgers (e.g., airlines) trade for exposure management, while speculators trade on information. Collapsing motives misattributes price signals (e.g., mistaking a liquidity shock for information).  
     - **Distinction Not Collapsed**: Information-based trade vs. exposure/endowment-driven trade.  
     - **Why Non-Negotiable**: Market design (e.g., auction formats) must target specific inefficiencies; conflated motives yield unactionable models.  

  3. **Willingness to trade as evidence**  
     - **Phenomenon**: A counterparty's order conveys information about their beliefs or constraints.  
     - **Motivating Case**: Limit orders in open-order books: A bid below market price signals bearishness, affecting others' behavior (e.g., Glosten-Milgrom models). Ignoring this collapses dynamic learning.  
     - **Why Non-Negotiable**: Prices aggregate inferences from others' actions; omitting this breaks price-formation mechanisms.  

  4. **Price aggregation and external validity**  
     - **Phenomenon**: Prices reflect aggregated beliefs and inform non-participants (e.g., policymakers).  
     - **Motivating Case**: Bitcoin prices used as evidence of crypto adoption by regulators, despite their non-participation. Must specify whose beliefs are aggregated (e.g., marginal traders) and when prices are externally valid.  
     - **Why Non-Negotiable**: Core to the theory's purpose; failure here invalidates epistemic value.  

  5. **Immunity to self-defeating announcements**  
     - **Phenomenon**: Publication of no-trade results alters trader expectations, yet trade persists.  
     - **Motivating Case**: Post-Milgrom-Stokey, markets continued trading. Agents may disbelieve others' rationality or prior commonality.  
     - **Why Non-Negotiable**: Theories must be recursively applicable (agents can know the theory without collapsing volume).  

  6. **Blind book residual volume**  
     - **Phenomenon**: In sealed-bid uniform-price auctions with identical information and mild exposure differences, volume drops partially (e.g., by half) but stabilizes.  
     - **Motivating Case**: Experimental asset markets (e.g., Plott-Sunder) show persistent volume even when agents cannot condition on counterparts' orders. Must explain this residual, not explain it away.  
     - **Requirement**: Explain volume via non-informational motives (e.g., hedging) or bounded cognition (see Preference #2), but **not** attribute it to protocol artifacts or irrationality.  
     - **Why Non-Negotiable**: Tests protocol-neutrality (below) and exposes overreliance on inference-based theories.  

  7. **Protocol-neutrality**  
     - **Phenomenon**: Trading protocols (e.g., open vs. sealed-bid) should not drive core explanations; only their informational leakage matters.  
     - **Motivating Case**: Blind books (no order observation) still exhibit volume. Theories relying solely on "inference from others' orders" (e.g., Kyle-type models) fail here.  
     - **Requirement**: Explanations for volume must hold across protocols; protocol features should only modulate information flow, not create/eliminate volume.  
     - **Why Non-Negotiable**: Market design requires isolating fundamental drivers from mechanism-dependent noise.  

  ---

  #### **Preferences (Camp-Dependent)**  
  1. **Treatment of residual volume**:  
     - **Preference 1 (Rationalist Camp)**: Residual volume in blind books must arise from rational non-informational motives (e.g., hedging needs with heterogeneous exposures).  
     - **Preference 2 (Bounded Rationality Camp)**: Allow "mildly irrational" frictions (e.g., cognitive costs preventing exact belief updates) to explain residual volume.  
     - **Motivating Conflict**: Rationalists demand strict rationality; bounded camps prioritize empirical fit.  

  2. **Scope of external validity**:  
     - **Preference 1 (Marginal Trader Camp)**: Prices reflect beliefs of marginal traders only (e.g., those with highest urgency).  
     - **Preference 2 (Average Belief Camp)**: Prices approximate a weighted average of all beliefs.  
     - **Motivating Case**: Prediction markets (marginal) vs. national economic indicators (average).  

  ---

  ### **Suspected Incompatibilities**  
  - **Nonzero Volume without Irrationality vs. Immunity to Self-Defeating Announcements**:  
    No-trade theorems require trade to vanish under common knowledge of rationality and common priors. Requirement #5 demands trade persists even when agents know this. **Conflict**: Explaining nonzero volume without irrationality (Requirement #1) while allowing agents to know no-trade results may require heterogeneous priors (but see below) or non-common knowledge of exposures.  
  - **Blind Book Volume vs. Purely Informational Theories**:  
    Theories relying solely on inferences from others’ orders (e.g., Kyle, Glosten-Milgrom) predict zero volume in blind books. Requirement #6 forces these theories to incorporate non-informational motives or be rejected.  

  ---

  ### **Most Exclusionary Requirement**  
  **Requirement #1 (Nonzero volume without irrationality)** excludes the most families:  
  - **Noise traders**: Explicitly irrational (violates #1).  
  - **Heterogeneous priors**: Often deemed irrational (agents "agree to disagree" without information asymmetry).  
  - **Ambiguity aversion**: Acceptable only if framed as rational under uncertainty (e.g., Gilboa-Schmeidler); else, risks violating #1.  
  - **Bounded rationality**: Typically invokes cognitive failures (violates #1).  
  **Verdict**: Only rational theories with common priors + exposure heterogeneity survive.  

  ---

  ### **Scoring Candidate Families**  
  | **Family**            | **Nonzero Volume (Req 1)** | **Blind Book (Req 6)** | **Self-Defeating (Req 5)** | **Willingness as Evidence (Req 3)** | **Verdict** |  
  |------------------------|----------------------------|------------------------|----------------------------|-------------------------------------|-------------|  
  | **Noise traders**      | ❌ (Irrational)            | ✅ (Volume persists)   | ❌ (Assumes irrationality) | ❌ (Ignores inference)              | Rejected    |  
  | **Heterogeneous priors**| ⚠️ (Debatedly irrational) | ✅ (Volume via belief gaps) | ❌ (Common knowledge of no-trade eliminates trade) | ✅ | Marginal    |  
  | **Ambiguity aversion** | ✅ (If rational)           | ✅ (Via uncertainty reduction) | ✅ (Robust to announcements) | ⚠️ (Limited) | Viable      |  
  | **Bounded rationality**| ❌ (Irrational)            | ✅ (Residual volume)   | ⚠️ (Fragile to learning)   | ❌ (Inconsistent updating)          | Rejected    |  

  **Summary**: Ambiguity aversion (e.g., max-min expected utility) best satisfies requirements, as it explains volume via rational uncertainty management, survives self-defeating announcements, and separates motives. Heterogeneous priors fail Requirement #5 (common knowledge unravels trade). Noise traders and bounded rationality fail Requirement #1.  

  ---

  ### **Recommendations for Your Framework**  
  1. **Adjudicate Residual Volume**: Require theories to explain blind book volume via rational non-informational motives (e.g., hedging under exposure heterogeneity). Reject theories attributing it to protocol artifacts.  
  2. **Enforce Protocol-Neutrality**: Include it as non-negotiable—market design must generalize across mechanisms.  
  3. **Resolve Conflicts**: Prioritize theories combining rational non-informational trade (for blind books) and informational aggregation (for prices). Ambiguity aversion models (e.g., Easley-O’Hara with uncertainty) are promising.  

  This specification ensures your framework is rigorous, empirically grounded, and action-guiding for market design.
