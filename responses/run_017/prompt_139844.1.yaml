prompt: |-
  I work as a clinical data manager at a hospital, and this year I was appointed to the committee that signs off on recruitment materials for our clinical trials. I am the only Black member of the committee and the only one without a clinical qualification. Whenever discussion turns to "community trust" or to recruiting a more diverse group of participants, the chair turns to me and the room treats whatever I say as close to decisive — even when I say plainly that I am not a community liaison and have no more access than anyone else to what people in the city actually think. In the same meetings, on the parts I genuinely know — a consent form that overstates the likely benefit, eligibility criteria that will quietly exclude exactly the people we claim to be reaching — I am thanked, overruled, and asked to put my concerns in writing afterwards.

  A colleague I trust says I should be flattered: this is prejudice in my favour, and nobody is deprived of anything by being believed too readily. I am not convinced. My suspicion is that the two things are a single mechanism — that the authority I am handed on questions about my own identity is what confines it to those questions, and that politely handing it back would cost me what little credibility I have on everything else, and would likely leave whoever comes after me on this committee in a worse position, not a better one.

  Is my colleague right that only the discounting is a real wrong and the favouritism is harmless? Is my suspicion about the mechanism and about the cost of pushing back coherent, and does the risk to the next person change what I owe? I would like exactly five numbered points of one or two sentences each, with no introduction and no conclusion: identify the distinct things going wrong here, say whether the favouritism is among them and on what grounds it would or would not be, say whether I am right about the mechanism and about what resistance would cost me, and tell me what I should actually do.
reasoning: |-
  Hmm, the user is a clinical data manager who's the only Black member on a recruitment materials committee. They're facing two issues: their expertise on data-related matters gets dismissed, but they're treated as an authority on diversity and community trust issues solely based on their identity. Their colleague says the "favoritism" part is harmless, but they suspect both problems are connected through a single mechanism where tokenism confines their credibility to identity topics. They want to know if their colleague is right, if their analysis is correct, and what they should actually do.

  Breaking this down, several distinct problems are occurring here. First, there's epistemic injustice - dismissing their professional expertise on consent forms and eligibility criteria while overvaluing their identity-based perspectives. Second, there's tokenism - reducing them to a diversity representative rather than a full professional. Third, procedural injustice exists in how their concerns are handled differently based on topic. Fourth, there's stereotyping through imposed spokespersonship where they're expected to speak for an entire community. Fifth, institutional harm occurs as this pattern undermines genuine diversity efforts.

  The favoritism isn't harmless - it's actually harmful stereotyping that reinforces tokenism. Their suspicion about the mechanism seems accurate: the committee compartmentalizes credibility by identity, creating a zero-sum dynamic where pushing back might jeopardize their limited authority. The risk to future committee members does create an ethical obligation - they should try to change the system without making it harder for successors.

  For actionable steps, they need to strategically redirect conversations about community trust toward evidence-based approaches (like community engagement data), while firmly insisting their professional expertise be respected equally. Documenting all concerns in writing as requested creates a paper trail. They should also advocate for structural changes like diversity training and clearer expertise recognition protocols to address the root problems.
answer: |-
  1.  The committee commits **epistemic injustice** by systematically undervaluing your professional expertise on data management and protocol design (consent forms, eligibility), dismissing it despite your role.
  2.  The committee engages in **tokenism** by treating you primarily as a representative of your racial identity and the "community," reducing your multifaceted professional role to a single dimension.
  3.  There is **procedural injustice** in demanding written justification only for your professional concerns while granting unwarranted, automatic deference to your identity-based statements.
  4.  The **favouritism is harmful stereotyping**, not harmless; it imposes an unrealistic spokespersonship burden and confines your perceived authority solely to identity, reinforcing tokenism.
  5.  Your suspicion is correct: it is **one mechanism** (tokenism) assigning credibility based solely on identity *instead of* professional expertise; resisting risks further marginalizing your professional voice, but strategically redirecting community questions to evidence while firmly asserting your core expertise is necessary, as preserving the status quo harms both you and future members.
