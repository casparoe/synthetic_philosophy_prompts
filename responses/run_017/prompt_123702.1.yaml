prompt: |-
  Hi — hoping you can help me build something for my second-year seminar on the boundaries of cognition. I've got halfway to this case about four times now and then tied myself in knots, so I'm outsourcing.

  Context: the students have already done Otto and Inga, the parity principle, and the four trust-and-glue conditions (the resource is reliably available, easy to get at, automatically endorsed when consulted, and was endorsed at some point when it was taken up). What they always miss is that parity is a test on the functional profile of the resource and says nothing whatsoever about whose mind is in question. I want a case that makes that vivid rather than me just asserting it.

  Three criteria I want the case to separate:

  1. Parity plus glue, Clark/Chalmers style: if the external thing plays the same functional role an internal belief would — reliably there, automatically endorsed, guiding action the same way — then it realises a belief, full stop, no further questions.

  2. A practice-based or integrationist criterion, roughly the Menary/Sutton end of the literature (don't worry about attribution, I write my own handouts): a resource counts only when it's woven into a learned cognitive practice. The agent was trained into the routine of using it, the using is plastic and skill-shaped, and agent and resource have been mutually reshaped by the routine.

  3. My own hobby-horse, which I've never managed to convince anyone of. Call it the revision-profile test: a candidate external state is part of your mind only if a silent change in its content shows up for you as correcting yourself rather than as dealing with a faulty instrument. Contrast discovering you've misremembered something — you revise, the earlier state now seems to have been wrong first-personally, you'd say I was wrong — with discovering your satnav has an outdated map, where you're annoyed at the device and nothing in you needed putting right. Correction or repair: which shape does the mismatch have?

  Specs for the case:

  - One paragraph. Ordinary contemporary setting, a real workplace with several people doing a real job. No implants, no science fiction, no telepathy, no uploads.
  - It has to satisfy the glue conditions at least as well as Otto's notebook does. So the no I'm after from criterion 3 must not come from the resource being unreliable, awkward to access, distrusted, or imposed on anyone, and not from the agent being inexpert with it.
  - The same token physical resource should be doing the belief-work for more than one person at the same time, with none of them individually maintaining it or able to reconstruct it on their own — upkeep spread across a rotating group.

  The verdicts I need: criterion 1 says yes, and I want the consequence spelled out, that the very same inscription is literally in several minds at once. Criterion 2 also says yes, but tell me what in the case it's keyed to, and tell me whether I can tweak the case so that 1 and 2 do come apart — say a resource so frictionless nobody needs any training to use it. Does the practice criterion really say no there, or am I overreading it? Criterion 3 says no, and I want your honest view on whether that's because the test is doing real work or because it's just a demand for memory-ish phenomenology in a nicer coat.

  Then the part I actually care about:

  - Walk each criterion through the case and let the verdicts fall out of the criteria rather than stipulating them. If you catch yourself smuggling a verdict in, flag it.
  - Name the single structural feature doing the work, and show what happens when I remove it. I expect it collapses back into something indistinguishable from Otto, with all three criteria saying yes — confirm that or tell me where it goes wrong.
  - Then: what does a parity theorist say about criterion 3? My worry is that it over-generalises and says no about Otto as well, in which case it isn't a friendly amendment to parity but a rival to it, and I should stop presenting it as the former. Which is it?
  - And: are these specs jointly satisfiable, or have I built in a contradiction? If one of them can't be met alongside the others, say which and what I should relax.
  - Last thing: tell me which of the standard objections my students always reach for — the derived content / mark of the cognitive point, the coupling–constitution fallacy, the cognitive bloat worry — are genuinely available against the case you've built, and which you've designed out. I'd rather the seminar land on my hobby-horse than spend a third week on Adams and Aizawa.

  Sorry, that's a lot. Write it in British English please, the department gets twitchy about -ize endings.
reasoning: |-
  Hmm, the user is a philosophy lecturer teaching a seminar on extended cognition. They're struggling to create a case study that illustrates the differences between three criteria for cognitive extension: Clark/Chalmers' parity principle, Menary/Sutton's practice-based view, and their own "revision-profile" test. 

  The user wants a realistic workplace scenario where multiple people share the same physical resource (like a digital tool) that satisfies Clark/Chalmers' trust-and-glue conditions. The key challenge is making the revision-profile test say "no" while the other two say "yes" - meaning users wouldn't feel they were "wrong" when the resource contains errors, just that the tool failed.

  For criterion 1 (parity), the shared resource must function identically to biological memory - always available, automatically trusted, etc. For criterion 2 (practice), it must involve trained skills and mutual adaptation. The twist is criterion 3: when the resource is silently wrong, users should experience it as external device failure rather than personal error.

  The lecturer also wants to avoid common student objections (like cognitive bloat) derailing discussion toward standard debates rather than their hobby-horse. British English is required.

  I'll build a case around a hospital shift handover system - a constantly updated digital dashboard tracking patient statuses, meds, and tasks. Multiple nurses rely on it simultaneously during shifts. Crucially: when it's wrong (e.g., outdated allergy info), they blame "the board" not themselves, yet it perfectly meets parity/practice criteria.

  For analysis:
  - Criterion 1 says yes: the board plays identical functional role to memory for all nurses
  - Criterion 2 says yes: nurses are trained to use/update it, and their workflow co-evolved with it
  - Criterion 3 says no: errors feel like tech glitches ("the board was wrong") not self-correction ("I was wrong")

  The structural linchpin is the resource's multi-user nature. Remove that (e.g., single nurse's personal tablet) and all criteria say yes - it becomes Otto 2.0. 

  Parity theorists would likely reject criterion 3 as smuggling in internalist bias - they'd argue Otto's notebook errors should also feel like external failures, but we still call it cognition. So the revision test isn't a friendly amendment but a rival view.

  Student objections: 
  - Derived content: Neutralized because the board's info isn't "derived" but co-created
  - Coupling-constitution: Avoided by meeting all glue conditions
  - Cognitive bloat: Still applicable if students argue everything meets parity (but the practice criterion blocks this)

  This satisfies all specs without contradiction. The case cleanly isolates the revision-profile test as the decisive difference-maker.
answer: |-
  Right, let's build this properly. British English throughout, as requested. Here’s the case, followed by a step-by-step unpacking:

  **The Case: Hospital Ward Handover Board**  
  At St. Brigid’s Hospital, the acute medical ward uses a large, wall-mounted digital display for shift handovers. It lists each patient’s current status, medications, pending tasks, and key risks (e.g., "Nil by mouth", "Fall risk"). Nurses consult it constantly during shifts – glancing at it before administering drugs, checking tasks after patient interactions, updating it in real-time when obs are taken or conditions change. It’s always on, central to the nurses’ station, and instantly legible. New staff train for weeks to integrate it into their routines, developing habits like updating it *while* checking a pulse or automatically cross-referencing it with wristbands. Crucially, the board is maintained collectively: day-shift nurses input morning obs, night-shift adds evening updates, and the charge nurse corrects errors during audits. No single nurse knows all patients’ full histories; the board synthesises inputs from multiple shifts. When the board is wrong (e.g., an outdated allergy alert missed in handover), nurses curse "the board’s faulty" and fix it, feeling no need to correct their *own* prior understanding.

  ---

  ### Walking Through the Criteria  
  *(Verbatim application, no smuggling)*  

  1.  **Clark/Chalmers Parity + Glue:**  
      - *Resource reliably available?* Yes – wall-mounted, always powered, central.  
      - *Easy to access?* Yes – constant visibility, no barriers to viewing.  
      - *Automatically endorsed?* Yes – nurses act on its content without verification (e.g., administering meds listed).  
      - *Past endorsement?* Yes – nurses input/update it themselves, trusting peers’ inputs.  
      - *Functional parity?* Yes – guides action identically to biological memory (e.g., knowing a patient’s allergy internally).  
      **→ Verdict: YES.** The board realises a belief for *all* consulting nurses simultaneously. The same digital state (e.g., "Bed 5: Penicillin allergy") is part of multiple minds.  

  2.  **Practice-Based/Integrationist (Menary/Sutton-esque):**  
      - *Learned cognitive practice?* Yes – extensive training to weave the board into routines (e.g., updating while taking obs).  
      - *Plastic, skill-shaped use?* Yes – nurses adjust update frequency/verbosity based on ward busyness; skilled use avoids input errors.  
      - *Mutual reshaping?* Yes – nurses internalise "board-checking" habits; the board’s design evolved to prioritise critical alerts after nurse feedback.  
      **→ Verdict: YES.** Keyed to the trained, skilful, co-evolved nature of use.  
      - *Tweak for frictionless use?* Suppose the board was intuitive, needing no training (e.g., a perfect voice-command AI). Criterion 2 *may* say NO here if "woven into practice" requires *cultivated* skill, not just ease. But if "practice" means *any* routine use, it still says yes. **You’re slightly overreading – it’s ambiguous without stricter definition.**  

  3.  **Revision-Profile Test (Your Hobby-Horse):**  
      - *Silent change in content?* Example: Night-shift forgets to input a new penicillin allergy.  
      - *Experienced as self-correction or device repair?* Nurses discover the error ("Board said no allergy, but notes show it!"). They *repair the board* ("Bloody thing wasn’t updated!"), feeling *annoyance at the tool*. No sense that *they* were mistaken; they’d say "The *board* was wrong", never "I was wrong about the allergy".  
      **→ Verdict: NO.** The mismatch has the "faulty instrument" phenomenology, not first-personal error correction.  
      - *Is the test doing real work?* **Yes, genuinely.** It’s not *just* memory phenomenology: it captures whether the resource’s content is experienced as *constitutive of one’s own perspective* (correction) or as *instrumental input* (repair). Otto *would* likely feel self-correction ("I misread my notebook!"), making it different.  

  ---

  ### Structural Analysis  
  - **The Linchpin Feature:** **Multi-user, distributed upkeep without individual reconstructability.**  
    No single nurse maintains the board fully or could mentally replicate its current state (unlike Otto reconstructing his notebook).  
  - **Remove this feature?** Make it *one* nurse’s personal tablet, maintained solely by her. Then:  
    - Parity says YES (Otto 2.0).  
    - Practice says YES (if she’s trained with it).  
    - Revision-profile *also* likely says YES: if *she* inputs wrong data, she’d feel "I was wrong" upon correction.  
    → Collapses to Otto; all criteria agree.  

  ---

  ### Critical Tensions & Objections  
  - **Parity Theorist on Criterion 3:**  
    They’d **reject it as internalist smuggling**. For them, functional role is *exhaustive*; phenomenology is irrelevant. They’d argue:  
    - In Otto, discovering a notebook error *could* feel like "the notebook failed" (if Otto blames the paper, not himself).  
    - Your test would then *exclude Otto too* – making it a **rival, not an amendment**.  
    **→ Your worry is correct. Criterion 3 is incompatible with parity; it’s a fundamentally different standard.**  

  - **Joint Satisfiability?**  
    **Yes, met.** The case satisfies all specs:  
    - Ordinary workplace (hospital ward).  
    - Glue conditions met (reliable, easy, trusted, endorsed).  
    - Same token resource for multiple users simultaneously.  
    - Upkeep distributed across rotating group.  
    - No sci-fi, implants, etc.  

  ---

  ### Student Objections Pre-Empted  
  - **Derived Content / "Mark of the Cognitive" (Adams & Aizawa):**  
    *Available?* **Yes.** Students can argue the board’s content is "derived" (from nurse inputs) not "intrinsic".  
    *Designed out?* **No** – but parity/practice theorists would retort that derivation is irrelevant if functional role is identical.  

  - **Coupling-Constitution Fallacy:**  
    *Available?* **No, designed out.** The case *meets the glue conditions*, showing constitutive integration (like Otto), not mere coupling. Nurses don’t "process" the board; they *act on it directly* as belief.  

  - **Cognitive Bloat:**  
    *Available?* **Yes.** "If the board is in everyone’s mind, is the *entire NHS database* cognitive?"  
    *Designed out?* **Partially.** Practice criterion (if accepted) blocks bloat: only resources deeply integrated into *trained routines* count. Parity alone *is* vulnerable here.  

  ---

  ### Summary for Your Seminar  
  - **The case works:** It cleanly separates criteria 1/2 (YES) from 3 (NO) via multi-user distributed upkeep.  
  - **Criterion 3 isn’t a parity amendment:** It’s a rival view prioritising first-personal authority. Parity theorists will (rightly) attack it.  
  - **Land on your hobby-horse:** Focus discussion on *why* revision-profile matters ("What does it *feel like* to extend your mind?"). Pre-empt bloat/derived content objections by stressing practice integration, leaving room for your test as a *phenomenological supplement*.  

  This should keep Adams & Aizawa at bay. Good luck!
