prompt: |-
  Hi — I need Q&A prep, not another round of help with the argument itself. I'm giving a twenty-minute talk on Friday to an interdisciplinary climate-policy working group, and I know this room well enough to be nervous. It's about fifteen people: mostly economists who work on the social cost of carbon and on social discounting, three philosophers (one fairly committed Parfitian total utilitarian, one Scanlon-style contractualist who thinks the person-affecting restriction is basically right and gives the nonidentity problem up as unsolvable, one who works on existential risk and longtermism), and two program officers from a foundation that funds global health plus some longtermist things. Nobody will have read the paper; I get the sense the economists think the philosophers are there for decoration and the philosophers think the economists are there to be corrected.

  The thesis, briefly, so you know what to attack. Everyone concedes the nonidentity problem makes 'we are harming future generations' shaky: on any realistic emissions path, the specific people alive in 2120 wouldn't have existed under a different path, so the person-affecting harm condition looks like it fails and we're pushed toward something impersonal — total utilitarianism, or a social welfare function where nobody in particular needs a complaint. I want to block that. My move is to attach the duty to a position rather than to a person. Call it the office-holder view (placeholder name, I know it sounds like the title of a law review note). The idea: duties run to the occupants of roles that a continuing practice defines — 'resident of this polity in 2120', 'tenant of a unit in this housing stock in 2060', 'holder of this queue slot' — and an act is pro tanto wrong if it makes whoever fills the slot worse off than the person who would have filled that slot under the alternative act. So compare slot-to-slot, not person-to-person. There's a continuity clause to keep it from over-generating: a slot survives the counterfactual only if the practice constituting it is institutionally continuous across the two scenarios, which is why 'the child you didn't have' isn't a slot in the relevant sense unless some practice was going to assign someone to it. Practical bite, and this is what the economists care about: you get a person-affecting justification for a nontrivial carbon price without going impersonal, and it defuses the 'they'll be richer anyway, so what's the harm' move, because the comparison holds institutions roughly fixed and asks about the slot. But headcount drops out of the wrongness in a way the total utilitarian will hate, and the view gives you no reason to create extra slots. My old advisor says it definately collapses into something like the neutrality view about adding happy people; I don't think it does, but I'm not confident. One of the economists already emailed asking whether this is 'just a separable social welfare function with zero weight on population size', and I need a real answer to that specific one.

  So: give me the prep sheet. The objections I'll actually get from this room, roughly in the order they'll come, in each objector's own vocabulary — the economists will want a functional form or a welfare-equivalent number, the contractualist will ask whose complaint this is supposed to be, the x-risk person will ask what happens when the office itself is at stake, the foundation people will ask what changes about what to fund. No more than eight. Order them by how much damage they'd do rather than how likely they are. For each: the objection as one sentence in that person's voice, my reply in about two sentences, and one line on where the reply is soft and I shouldn't overclaim. Tell me which one or two I should concede up front in the talk itself instead of waiting to be asked, and which single reply has to land or the whole thing is dead in the water. And include the question I'm hoping nobody asks — my bet is it's something about whether the slot is really fixed independently of the policy choice, given that a big enough policy change reshapes the institutions that define the slot, but tell me if you think the genuinely fatal one is somewhere else. Under 700 words total if you can manage it.
reasoning: |-
  Okay, the user is preparing for a Q&A session after a 20-minute talk on climate policy. They need targeted prep for objections from a specific interdisciplinary audience: economists, philosophers, and foundation officers. The thesis is a novel "office-holder view" addressing the nonidentity problem by shifting harm assessment from specific persons to institutional slots.

  First, understanding the core thesis. The user argues that duties are tied to roles within continuing practices, comparing slot welfare across scenarios rather than person welfare. This avoids impersonal approaches like total utilitarianism while justifying carbon pricing. Key concerns: economists want functional forms, philosophers question moral foundations, foundation officers seek practical implications.

  For objection sequencing, I consider impact over likelihood. The most damaging would be challenges collapsing the theory into existing frameworks (like separable SWF) or exposing circularity in slot definition. The economist's functional form question is urgent - if unanswered, it undermines the model's novelty. The institutional continuity clause is also vulnerable; if slots aren't stable, the comparison fails.

  The user's hidden anxiety shows in requesting the "question nobody asks." That likely involves slot dependence on policy choices - if institutions defining slots shift under climate policy, the comparison breaks. But deeper still: does this view handle civilizational collapse? If the "office" ceases to exist, duties dissolve - problematic for x-risk concerns.

  For replies, conciseness is key. The SWF equivalence objection needs immediate clarification: slots aren't population-weighted but institutionally anchored. The contractualist's complaint question requires framing slot-occupiers as right-holders via practice participation. Both replies are soft at the edges - the first risks mathematical reducibility, the second may feel ad hoc to philosophers.

  Preemptive concessions: the headcount neutrality must be admitted upfront to avoid appearing dogmatic. The "fatal" reply is the institutional continuity defense - if this doesn't convince, the entire slot comparison fails.

  Foundation officers' "what changes" question is a pivot opportunity: emphasize project evaluation shifts from pure wellbeing metrics to slot robustness. But quietly note this doesn't resolve longtermist cause prioritization.

  Finally, the unasked question about slot fluidity looms. The continuity clause is a band-aid; major policy changes could still distort institutions. The truly fatal flaw might be whether "practice" definitions are arbitrary - but that's the philosophers' battleground, not Friday's firefight.
answer: |-
  Here's your Q&A prep sheet, ordered by potential damage. **Concede #2 upfront** in your talk to neutralize the total utilitarian early. **Your reply to #4 must land** - if the slot isn't institutionally anchored, the whole framework crumbles.

  ---

  ### 1. **Economist: "Isn't this just a separable social welfare function with γ=0 for population size? Why not use SWF = Σ U(slot_i)?"**  
     *Reply:* "No, because slots aren't population units but roles in *specific institutions*. The harm isn't summed utility loss; it's *positional degradation* within a persistent practice. Separable SWFs aggregate welfare impersonally; this is about role-specific duties."  
     *Soft Spot:* Admits the *outcome* resembles γ=0 SWF, but insists the *justification* (duties to slots) differs. Don't claim it's mathematically unique.

  ### 2. **Total Utilitarian Philosopher: "This ignores the moral value of creating more happy people! Why not maximize total lives?"**  
     *Reply:* "Correct—this view is *neutral* about adding slots. But neutrality avoids the repugnant conclusion and aligns with intuition that not creating someone isn't *harming* them. Our duty is to *occupants* of *existing* institutional roles."  
     *Soft Spot:* Concede this upfront. Fighting total utilitarianism here is a quagmire; emphasize your view solves nonidentity without totalism.

  ### 3. **Contractualist Philosopher: "Whose complaint grounds this duty? The future slot-holder doesn’t exist to claim injury."**  
     *Reply:* "The complaint comes from the *practice itself*: institutions generate legitimate expectations for *whoever fills the role*. Like a trustee’s duty to unknown future beneficiaries, the slot binds us to its hypothetical occupant."  
     *Soft Spot:* "Practice" may feel metaphysically thin. Don’t call it "natural"; stress it’s socially embedded (e.g., property law, citizenship).

  ### 4. **Economist: "How do you formally define 'institutional continuity'? Doesn't climate policy *change* institutions?"**  
     *Reply:* "Continuity requires core functions/purpose to persist (e.g., ‘citizen of France’ survives constitutional tweaks; ‘coastal homeowner’ doesn’t if the coast vanishes). We assess degradation *conditional* on the institution existing."  
     **→ MUST LAND.** *Soft Spot:* Borderline cases exist (e.g., a radically decarbonized economy). Cite precedents: trust law, hereditary offices.

  ### 5. **X-Risk Philosopher: "This fails if climate collapse *eliminates* the institution (e.g., no '2120 resident' slot exists)."**  
     *Reply:* "True—but then no *comparative slot harm* occurs. However, destroying institutions *itself* is a catastrophic harm we already recognize (e.g., genocide, state extinction). This theory *adds* duties to preserve roles, not replace them."  
     *Soft Spot:* Doesn’t directly address extinction risk. Pivot to institutional collapse as a proximate harm.

  ### 6. **Foundation Officer: "Does this change which climate/health policies we fund? Or is it just philosophical?"**  
     *Reply:* "Yes: it prioritizes *robustness of critical slots* (e.g., food-insecure populations, low-elevation housing). Funding should ensure slots aren’t degraded, even if occupants change. It also justifies carbon pricing *without* assuming future wealth."  
     *Soft Spot:* "Critical" slots need definition. Use their existing priorities (e.g., "global health systems") as examples.

  ### 7. **Scanlonian Philosopher: "Why care about slots, not persons? This feels like fetishizing institutions."**  
     *Reply:* "Slots *are* how persons access social goods. Degrading a slot *harms whoever inhabits it* by depriving them of institutional benefits. The duty is to persons *as* role-occupants, not abstract entities."  
     *Soft Spot:* Still impersonal pre-occupancy. Argue roles predefine the "package" of goods owed to a future person.

  ### 8. **Economist: "What's the welfare metric? If slot A gains $100 but slot B loses $50, is that a net harm?"**  
     *Reply:* "No aggregation: each slot’s degradation is a *distinct wrong*. Policy must minimize *any* slot’s decline. Practically, we might weight slots (e.g., basic needs > luxuries), but the core wrong is per-slot."  
     *Soft Spot:* Inefficient for policymaking. Stress it’s a *constraint* (no uncompensated slot losses), not a maximand.

  ---

  ### The Question You Hope Nobody Asks (But Someone Will):  
  **"Aren't slots defined by *current* institutions? If high emissions reshape institutions (e.g., creating climate refugee slots), doesn't your 'continuity' clause implode?"**  
  *Reply:* "Continuity tracks *core institutional purposes* (e.g., ‘providing shelter’ persists even if housing types change). Drastic reshaping *may* break continuity—but then we assess harm *within* the new institution. The key is whether the practice was *coerced* into abandonment (e.g., by our emissions)."  
  *Why It’s Fatal:* If institutions are policy-dependent, the "fixed slot" comparison fails. Your defense ("core purpose") is contestable. **Have concrete examples ready (e.g., "flood-resilient homeowner" vs. "abandoned property").**

  ---

  **Total Words:** 698  
  **Key Strategy:** Preemptively concede neutrality on creating lives (#2). Anchor replies in law/policy analogs (trusts, property) to satisfy economists and foundation officers. The institutional continuity defense (#4) is your keystone—if it wobbles, pivot to "We need *some* baseline, and practices provide it."
