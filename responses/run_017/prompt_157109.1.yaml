answer: |-
  ## Proposal: Intrapersonal Utility Monsters and the Real Work of the Separateness of Persons Constraint

  **1. Title:** Aggregation without Separation? Re-examining the Utility Monster through Intrapersonal Analogues

  **2. Abstract:** The utility monster objection highlights how utilitarianism’s aggregation of welfare can prioritise a single individual with an enormous capacity for welfare, allegedly violating the moral significance of the separateness of persons. This project investigates whether the separateness of persons is genuinely the operative concern, or whether the objection stems from features of the aggregation function itself (e.g., lack of diminishing marginal weight, distributive unfairness). It constructs precise intrapersonal analogues of the utility monster scenario within a single life and examines whether these analogues provoke similar moral discomfort. Applying this analysis to prioritarianism reveals whether the monster objection poses a distinct challenge to utilitarianism or a broader constraint on aggregative axiologies. The project concludes that separateness does significantly less work than assumed, shifting the dialectic surrounding aggregative ethics.

  **3. Background & Problem Statement:** The "utility monster" (Nozick, 1974) is a staple objection to utilitarianism: imagine an entity that derives vastly more welfare from resources than anyone else. Utilitarianism dictates directing all resources to this monster, seemingly violating intuitions about fairness and the distinctness of individuals (the "separateness of persons" complaint). This objection is widely held to uniquely threaten utilitarianism, while views like prioritarianism (which weights benefits to the worse off more heavily) are thought to respect separateness and avoid the monster. However, an intrapersonal analogue exists: consider one person at time T1 versus their future self at T2, where T2-self possesses a vastly greater *capacity* for welfare or *conversion rate* of resources into welfare. Utilitarianism (and many other aggregative views) would prioritise T2-self’s welfare over T1-self’s within the same life-plan. Crucially, this intrapersonal prioritisation often seems *less* intuitively objectionable than its interpersonal counterpart. This discrepancy demands investigation: is the moral discomfort in the interpersonal monster case *really* driven by the separateness of persons, or is it primarily driven by other features implicit in the aggregation, such as the shape of the welfare function or a demand for distributive fairness across individuals *regardless* of separateness? If separateness is not the key factor, the utility monster ceases to be a unique problem for utilitarianism and becomes a challenge for *any* axiology employing unconstrained aggregation, including prioritarianism.

  **4. Precise Research Question:** Does the moral intuition driving rejection of the interpersonal utility monster fundamentally depend on the separateness of persons, or does it primarily stem from dissatisfaction with the *structure of aggregation* (specifically, the lack of diminishing marginal weight or a distributive constraint), as evidenced by the differing intuitive responses to structurally analogous interpersonal and intrapersonal welfare aggregation scenarios, particularly when tested against prioritarianism?

  **5. Why the Standard Debate Leaves This Open:** The standard dialectic focuses almost exclusively on the interpersonal case, contrasting utilitarianism’s monster vulnerability with prioritarianism’s (alleged) immunity, attributing the difference to prioritarianism respecting separateness. This framework assumes separateness is the *source* of the objection. It neglects to rigorously test whether the core unease persists in scenarios where separateness is absent (intrapersonal cases) but the aggregation structure is identical. It also fails to examine whether prioritarianism, while avoiding the *interpersonal* monster, might fall prey to an analogous *intrapersonal* monster if separateness isn’t the key factor. The differing intuitive responses to intra- vs. interpersonal aggregation suggest the standard account is incomplete, but this has not been systematically probed.

  **6. Methodology:** The project will proceed analytically, constructing precise thought experiments and testing them against moral intuition and theoretical coherence:
      1.  **Disambiguate the Monster:** Define two distinct versions of the utility monster:
          *   **Conversion-Rate Monster (CRM):** Entity A derives 1000x more welfare from a unit resource than Entity B, *even at equivalent welfare levels*. (E.g., A gets immense pleasure from bread; B gets little.)
          *   **Capacity Monster (CM):** Entity A has a vastly higher *potential maximum welfare ceiling* than Entity B. Satisfying A requires enormous resources, generating huge *total* welfare. (E.g., A experiences ecstasies impossible for B).
      2.  **Construct Intrapersonal Analogues:** For each monster type, create a scenario within a single life:
          *   **Intrapersonal CRM (I-CRM):** Present-self (P) derives low welfare from resources (e.g., due to temporary depression). Future-self (F), once treated, will derive vastly more welfare from the *same* resources. Should resources be saved for F, maximising total welfare, even if P suffers significantly now?
          *   **Intrapersonal CM (I-CM):** Present-self (P) has a limited capacity for welfare. Future-self (F) will develop (e.g., through neural enhancement) an enormous capacity for intense, sustained well-being. Should significant present sacrifices (by P) be made to enable F’s vastly greater potential welfare?
      3.  **Intuition Gathering & Analysis:** Systematically compare intuitive responses:
          *   Is the interpersonal CRM/CM strongly rejected?
          *   Is the intrapersonal I-CRM/I-CM rejected with similar force? (Plausibly, I-CRM may be more acceptable than I-CM).
          *   Does prioritarianism avoid the interpersonal CRM/CM? (It should avoid CM, may struggle with extreme CRM).
      4.  **Test Prioritarianism Intrapersonally:** Apply prioritarianism’s weighting (benefiting the worse off) *within* a single life over time:
          *   Does prioritarianism recommend prioritising the low-welfare P over the high-capacity/gain F in the I-CRM/I-CM? (It plausibly *would* favour P in I-CRM due to P’s lower welfare level, but might favour enabling F in I-CM if F’s potential is seen as creating a future "worse off" state if unrealised, or struggle with intertemporal aggregation).
          *   Does this intrapersonal application of prioritarianism align with, or conflict with, the intuitions elicited in step 3?
      5.  **Diagnose the Source of Discomfort:** Based on steps 3 & 4, determine if the objection to the *interpersonal* monster persists primarily when:
          *   Aggregation lacks diminishing marginal weight (favouring CRM-type objections).
          *   Aggregation ignores distributive fairness across distinct individuals (favouring CM-type objections, especially if capacity is seen as arbitrary).
          *   Separateness itself is violated (suggesting discomfort *should* be similar in intra- and interpersonal cases, which it isn't).

  **7. Possible Conclusions & What Decides Between Them:**

  *   **Conclusion A (Separateness is Key):** If strong discomfort persists *only* in interpersonal cases (even when controlling for aggregation structure), and prioritarianism easily handles both intra/interpersonal cases, then separateness *is* the core issue. The monster remains a distinct utilitarian problem.
      *   *Deciding Factor:* Consistent, strong intuitive rejection *only* in interpersonal scenarios, coupled with prioritarianism offering a coherent and intuitively satisfying solution in all cases that respects separateness interpersonally without creating intrapersonal absurdity.
  *   **Conclusion B (Aggregation Structure is Key - Diminishing Weight):** If discomfort is strong in CRM cases (both intra- and interpersonal) but weak in CM cases, it suggests the core issue is the lack of diminishing marginal weight in the welfare function. Prioritarianism (which incorporates diminishing weight) would avoid the objection, but not *because* of separateness.
      *   *Deciding Factor:* Intuitions track the presence/absence of diminishing marginal weight sensitivity across intra/interpersonal cases. Prioritarianism avoids monsters primarily via its weighting, not its separateness respect.
  *   **Conclusion C (Aggregation Structure is Key - Distributive Constraint):** If discomfort is strong in CM cases (both intra- and interpersonal) but weaker in CRM cases, it suggests the core issue is a constraint against letting arbitrary high capacity dictate distribution. Prioritarianism might avoid the interpersonal CM (via weighting) but potentially endorse the intrapersonal I-CM (if future potential outweighs present sacrifice). This reveals the complaint is about distribution across individuals, not separateness *per se*.
      *   *Deciding Factor:* Intuitions track concerns about capacity-driven distribution regardless of separateness. Prioritarianism’s handling of the intrapersonal CM exposes whether it truly incorporates a distributive constraint independent of separateness.
  *   **Conclusion D (Hybrid/Messy):** Intuitions might be complex, showing discomfort driven by a combination of factors, with separateness playing a secondary or contextual role rather than being fundamental. The monster objection then highlights tensions within aggregation itself that any axiology (utilitarian, prioritarian, or other) must address.
      *   *Deciding Factor:* Lack of clean alignment with A, B, or C; intuitions vary significantly based on specific framing of capacity vs. conversion rate and intra vs. inter.

  **8. Feasibility & Failure Conditions:**

  *   **Feasibility for One Term:** This project is **well-suited for a one-term graduate seminar paper**. The scope is focused: analysing two specific monster variants and their intrapersonal analogues against one alternative theory (prioritarianism). The core work involves conceptual analysis, thought experiment construction, intuition testing (via thought experiments and engagement with existing literature), and logical argumentation – standard philosophical seminar paper skills. The key is maintaining tight focus on the specific question and not getting sidetracked into broader debates about utilitarianism or personal identity.
  *   **What Counts as Failure:**
      *   **Unclear Question:** Failure to maintain a precise distinction between CRM and CM, or between separateness and aggregation structure.
      *   **Superficial Intuition Handling:** Simply asserting intuitions without careful consideration of variations or potential counterarguments (e.g., dismissing intrapersonal discomfort too readily).
      *   **Inadequate Treatment of Prioritarianism:** Failing to rigorously apply prioritarian weighting within the intrapersonal cases or misrepresenting its standard interpretation.
      *   **Inconclusive Analysis:** Failing to reach a well-supported conclusion about what drives the intuition, leaving the question unresolved without good reason.
      *   **Scope Creep:** Attempting to tackle too many monster variations, alternative theories (e.g., egalitarianism), or deep problems of personal identity underlying the intrapersonal cases.
  *   **Mitigating Failure Risk:** Success hinges on careful definitions, controlled thought experiments, honest appraisal of intuitive responses, and disciplined focus on the core question of what drives the difference between intra- and interpersonal intuitions. Explicitly acknowledging the limitations of intuition-based methods is also crucial.

  This project promises to clarify a foundational debate in moral philosophy by challenging a common assumption about the utility monster and separateness of persons. By focusing on the intrapersonal analogue and testing prioritarianism consistently, it aims to show that the real force of the objection lies in the structure of aggregation, significantly shifting how we understand the challenges facing aggregative welfare ethics.
