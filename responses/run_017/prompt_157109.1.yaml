  Hi, I need a short proposal (about two pages) for a one-term graduate seminar paper, and I've got a half-baked idea I want turned into something precise.

  Rough idea: the utility monster is normally presented as flowing out of the separateness of persons complaint — because utilitarianism just sums welfare across people, one person with a huge capacity for welfare outweighs everyone else, and that's meant to show something is wrong with aggregating across persons. But there's an intrapersonal analogue: one person now versus that same person's future self whose capacity for enjoyment is enormously greater. Structurally the aggregation does the same thing, and hardly anyone finds the intrapersonal case disturbing. So I want to know whether separateness of persons is really doing any work in the monster argument, or whether the actual complaint is about something else — the shape of the aggregation function, diminishing marginal weight, or a distributive fairness constraint.

  If separateness isn't doing the work, the monster stops being a distinct reason to reject utilitarianism and becomes a constraint on any aggregative axiology, including views like prioritarianism that are advertised as respecting separateness, and that would shift how the whole dialectic is supposed to go. Its this bit I keep going back and forth on.

