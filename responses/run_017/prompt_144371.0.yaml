  **Key Functionalist Concessions Embedded:**  
  - Builder’s role acknowledged, but relegated to "initial conditions."  
  - Compression = reverse-engineering cognitive *processes*, not storing opinions.  
  - "Indistinguishable outputs" as the gold standard for mind.  
  - Rejecting the "mirror" metaphor as implying passivity; the book *computes* actively.  
  - Challenging the opponent to define consciousness *beyond* behavior.
