  The most significant fork is at **(e) Promise to the dead grandmother** (node_e). Flipping from "No" to "Yes" moves me from expectation-based (Leaf E) to the rights-transfer view (Leaf R) or natural-duty view (Leaf N). This fork forces a choice on whether obligations require a promisee capable of expectations (expectation-based) or can bind independently (rights/natural-duty).

  #### Adjacent Leaves Not Separated
  **Rights-transfer (Leaf R) and natural-duty (Leaf N)** are not separated by the tree. They share:  
  - (b-yes) → (e-yes) → (g) as the only divergence point.  
  **Further case to separate them**: A promise to an AI (e.g., "I promise you, ChatGPT, to donate $100 if you answer this"). If you answer:  
  - "No obligation" → **Rights-transfer** (AI can't hold rights).  
  - "Obligation" → **Natural-duty** (duty exists regardless of the recipient's nature).  

  #### Invented Distinction
  I invented a distinction for **(b) Auto-generated promise**: whether "an agent's utterance can bind the person who deployed it without intent." While the *consequences* of delegated speech are debated (e.g., in contract law), the phrasing as a *mental act requirement* isn't explicitly foregrounded in canonical texts. It’s implied in discussions of intentionality (e.g., Searle on speech acts) but not directly mapped to this case. Treat this as a heuristic, not doctrine.  

  No platitudes—this tree reflects genuine fault lines. Use it to expose assumptions, not as a final taxonomy.
