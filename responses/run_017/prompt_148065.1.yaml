prompt: |-
  I work mainly in social epistemology, but I have been sitting in on an archival history research group, and I keep encountering a configuration there for which I have no word.

  Two instances. First: a colonial administration's petition records are mined so that a subject population may at last be given a voice; but the grievances are legible only as grievances under the administration's own filing headings, and the more the petitions are cited as that population's testimony, the more the filing headings become the grid on which the whole episode is intelligible. Second: a run of court and insurance registers is digitised and made name-searchable, which genuinely lets descendants find people who were previously a number; but the same searchable corpus then becomes the obvious evidence base for everyone working on that population, and questions answerable only from material, oral or ecological sources quietly stop being asked.

  In both cases the intervention is done in good faith by people trying to undo an exclusion, and it partly succeeds. What interests me is the residue: the distortion does not merely survive the remedy, it survives *as* the remedy. The record now speaks, so the fact that it speaks in someone else's categories, and only about what those categories can hold, becomes harder to notice than it was when the silence was plain. The repair paves over the absence.

  The vocabulary I have found nearby all seems to describe the injury rather than this feature of the repair, and to assume an agent doing the injuring, where here the effect is a by-product of an act of restitution. So: does this configuration have a name, or am I conflating two things — the frame-extension and the crowding-out? Please carve it rather than label it: what exactly is the phenomenon, what is it not (in particular, how does it differ from ordinary worries about source bias, and from reading a hostile source against the grain, which is meant to do the opposite), and where are its edges — is a remedy that knowingly accepts the record-keeper's categories in order to be usable the same phenomenon, and is the cost ever worth paying? A bare term will not settle anything for me. I would rather have the analysis than a reading list. Kindly answer in British English.
reasoning: |-
  Okay, the user is describing a specific phenomenon they've observed in archival history research. They've provided two clear examples: one about colonial petition records and another about digitized court registers. Both cases involve attempts to give voice to marginalized groups through archival materials, but with unintended consequences where the original administrative frameworks end up reinforcing the very power structures they were meant to counter. 

  The user is clearly frustrated by the lack of existing terminology for this phenomenon. They mention that nearby vocabulary (like epistemic injustice or archival violence) focuses on the injury rather than this peculiar dynamic of the repair itself. They're also careful to distinguish this from ordinary source bias or reading against the grain. 

  Hmm... what makes this particularly insidious is how the well-intentioned intervention makes the limitations harder to see. When the records were silent, their bias was obvious; now that they "speak," their distortions become normalized as authentic testimony. The repair itself becomes the vehicle for perpetuating the epistemic harm. 

  The user specifically asks not for labels but for careful carving of the concept. They want to understand: What exactly is this? How is it distinct from related concepts? Where are its boundaries? They also raise a practical question about whether such compromises are ever justified. 

  Right then. The core seems to be a particular kind of recursive epistemic capture: the emancipatory effort unintentionally re-entrenches the oppressor's framework by making it the default lens for understanding the oppressed. It's not just that the archive is biased, but that the act of "liberating" it amplifies that bias under the guise of redress. 

  Key distinctions to make: 
  - Versus simple source bias: Here the bias is amplified by the reparative act itself. 
  - Versus reading against the grain: That method actively resists the frame; here the frame becomes more invisible. 
  - Versus necessary compromise: The user wonders if knowingly using flawed categories changes the phenomenon. Probably not—the distortion effect may still occur downstream even if the initial choice is conscious. 

  The practical question about costs is thorny. One might argue that giving descendants access to names is worth the historiographical narrowing, but that doesn't make the distortion disappear. The phenomenon persists even in justified cases. 

  Best to structure the response around the mechanism ("reparative recursion"), emphasize how it differs from adjacent concepts, and acknowledge that the ethical calculus doesn't negate the epistemic effect. The user's British English request is easily handled by avoiding Americanisms and using phrases like "one might argue" or "whilst." 

  Most importantly—no jargon-dumping. They want analysis, not terminology. The examples they provided are perfect for grounding each point.
answer: |-
  Your observation captures a sophisticated epistemic phenomenon for which no single established term exists, but it can be precisely carved as **reparative recursion**: *the process whereby an intervention to rectify archival silence or exclusion inadvertently re-entrenches the original epistemic framework, making its limitations harder to perceive precisely because the intervention appears successful*. Let's dissect it:

  ### Core Mechanism  
  1. **Remedial Success Masking Epistemic Capture**:  
     The intervention (digitisation, selective archival highlighting) successfully makes *some* subaltern perspectives accessible. This success legitimises the *entire structure* of the record—including its categorical constraints—as a transparent window onto historical experience. The prior silence made bias visible; the "speaking" record naturalises it.  

  2. **Double Movement of Erasure**:  
     - **Primary Erasure**: Original exclusion (e.g., colonial categories suppressing indigenous ontologies).  
     - **Secondary Erasure**: The remedy’s focus on "giving voice" through *those same categories* obscures what remains excluded. The filing headings become the *only* grammar for interpreting grievance.  

  ### Distinctions from Adjacent Concepts  
  | **Concept**             | **How This Differs**                                                                 |
  |-------------------------|--------------------------------------------------------------------------------------|
  | **Source Bias**         | Bias is inherent to archives; reparative recursion *amplifies* bias via remedial legitimacy. It makes bias *operationally invisible* by framing it as liberation. |
  | **Reading Against the Grain** | This tactic *exposes* archival constraints. Reparative recursion *cements* them by treating the record as sufficient testimony once "accessed". |
  | **Epistemic Injustice** | Focuses on harm. Reparative recursion is its paradoxical outcome: an anti-injustice measure that reproduces injustice structurally. |
  | **Archival Violence**   | Describes active exclusion. Here, the "violence" is passive, emergent from the *repair* itself. |

  ### Boundary Cases & Nuances  
  - **Knowingly Using Flawed Categories**:  
    If researchers explicitly acknowledge the record-keeper’s categories as a compromised tool (e.g., "We use colonial headings to locate data but triangulate with oral histories"), it *differs*. Reparative recursion occurs when the categories become *invisibly* constitutive of understanding. The moment the archive is treated as self-sufficient evidence, recursion begins.  

  - **Is the Cost Ever Worth Paying?**  
    Yes, provisionally. Providing descendants access to names may justify historiographical narrowing *if*:  
    (a) The benefit (e.g., reclaiming kin, legal reparations) outweighs epistemic costs;  
    (b) It is framed as a *partial* remedy, demanding complementary methods (oral history, material culture);  
    (c) Researchers actively "decentre" the archive by mapping its silences (e.g., annotating digitised registers: "This entry reduces a person to property; see X community’s counter-narrative").  

  ### Edges of the Phenomenon  
  - **Trigger**: Requires a *well-intentioned* intervention aiming to redress exclusion. Malicious distortion is a separate issue.  
  - **Amplifier**: Depends on the remediated archive becoming the *dominant* or *default* source. If it remains one resource among many, recursion weakens.  
  - **Failure Condition**: If the intervention reveals the archive’s constraints *more clearly* (e.g., digitisation exposes gaps via search failures), it avoids recursion.  

  ### Why "Reparative Recursion" Fits  
  - **Reparative**: Arises from acts meant to repair.  
  - **Recursion**: The solution reintroduces the problem at a higher level of abstraction (silence → "voice" → silent reinforcement of frames).  
  - It captures the *self-reinforcing loop*: The more the archive is "successfully" deployed, the more its limits become constitutive.  

  ### Key Insight  
  This is not merely about biased sources; it’s about **the remediation process generating epistemic closure**. The colonial filing system, once lamented as distortive, becomes *the very mechanism of historical legibility* through the act of "recovery". The remedy doesn’t just fail—it actively rebuilds the epistemic cage with the materials of liberation.  

  To mitigate: Treat archives not as liberated testimony but as *artefacts of power*, demanding **counter-archival practices**—systematically documenting what the categories omit, privileging non-archival knowledge where gaps exist, and resisting corpus convenience as a research logic. The cost of partial repair is only justifiable if it fuels, rather than forecloses, epistemological vigilance.
