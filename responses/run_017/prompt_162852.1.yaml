prompt: |-
  I joined the board of my family's small foundation last winter — we give away roughly sixty thousand dollars a year, in grants between about two and twenty-five thousand — and I have been going back through our minutes, because a friend who reads decision theory pointed out that the very first request we ever turned down was, structurally, a Pascal's mugging: an unsolicited email offering, for three thousand dollars, to use a method the writer declined to describe on beings he numbered at ten to the thirtieth power. We said no in about five minutes. Since then our record is this: we gave twenty-five thousand to a school-based parasite treatment program with randomized evaluations behind it, where we could state with real confidence that the money would avert on the order of a handful of deaths; we gave twelve thousand to a proposal with a fully specified engineering mechanism, where an independent engineer put a five percent chance on its working and, if it worked, on its sparing roughly a thousand cases of severe illness; we gave four thousand for a one-month scoping review of a speculative policy proposal and then declined the full grant when the review came back lukewarm; and we declined a proposal whose mechanism was spelled out in detail but which rested on a long chain of speculative steps, where the applicants' own materials put the chance of success at one in a hundred million and the payoff at the equivalent of ten to the twenty-second lives. Nobody on the board has ever articulated a principle, and it now looks to me as though everything we have done is equally compatible with several: capping how much value we allow a very large number of lives to carry; discounting claimed leverage, so that the larger the asserted payoff the stronger the evidence we require before the number moves us at all; refusing to act on probabilities below some floor whatever the stake; or treating the purchase of information as our default response whenever an estimate is shaky.

  The new proposal resembles none of these. A small physics group asks for nine thousand dollars and says that if a particular speculative cosmological hypothesis is true, an apparatus they can build now would bring into existence something like ten to the twenty-fourth lives that are, on balance, worth living. Two things separate it from our earlier refusals: the probability estimate comes from three independent physicists we consulted rather than from the applicants, and all three put the hypothesis at about one in ten thousand while confirming that the causal chain from hypothesis to apparatus is sound; and no one is claiming any privileged access or special power — the mechanism is public, physical, and in principle directly testable, though a decisive test would cost forty thousand dollars. One of the three reviewers adds, in a minority note the group disputes, that a different variant of the same hypothesis — she puts it at maybe one in ten million — would make the apparatus instead produce an astronomical quantity of suffering.

  What should we do if we want to be consistent with ourselves, and which of our own precedents is genuinely the closest analog here? Please set out the two or three rules that fit our track record about equally well, say what each implies for this proposal, tell me whether the minority note should move us and why, then give me your best recommendation with the reason for preferring that reading of our record — and, separately, what you would expect us actually to decide in the room next month. My fellow trustees will probably propose deferring and spending a thousand dollars on a further feasibility study; I would like to know whether that is a genuine fourth rule or just one of the others in procedural disguise. Finally, name the further case that would really tell these rules apart, since I still have room in the budget to commission one more review if it would settle anything.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on the board of a small family foundation that gives away about $60,000 a year. They've been reviewing past decisions because a friend pointed out that their first rejection resembled Pascal's mugging. Now they have a new proposal that's different from previous ones, and they need to figure out how to handle it consistently.

  First, I need to understand their past decisions. They rejected a Pascal's mugging scenario—unsolicited email, vague mechanism, huge claimed impact. Then they funded projects with solid evidence: a parasite program with randomized evaluations, an engineering proposal with a 5% success chance but clear mechanism, and a scoping review. They rejected a proposal with a very low probability (1 in 100 million) despite high stakes. 

  The user mentions several possible principles: capping the value of large lives, discounting leverage requiring stronger evidence for bigger claims, setting a probability floor, or buying information when estimates are shaky. The new proposal involves a cosmological hypothesis with a 1 in 10,000 chance of creating 10^24 lives worth living. Independent physicists confirm the probability and mechanism. But there's a minority note about a variant hypothesis (1 in 10 million) causing suffering instead.

  The user wants to know how to be consistent, which precedent applies, what rules fit their track record, how to handle the minority note, and whether a feasibility study aligns with their principles. They also want a test case to differentiate between the rules.

  Looking at their history, they seem skeptical of high-leverage, low-probability claims but willing to fund solid, evidence-based projects. The parasite program had high confidence, the engineering project had a clear mechanism and a 5% chance, which they funded. They bought information for the scoping review when things were speculative. The rejected proposals had either no evidence or extremely low probabilities.

  The new proposal has independent expert validation, a testable mechanism, and a probability (0.01%) that's low but much higher than the 1 in 100 million they previously rejected. The key difference is the credible probability assessment from third parties. The minority note introduces risk, but at 1 in 10 million, it's much less likely.

  For consistency, their actions suggest they require stronger evidence for larger claims. The probability here is low, but not astronomically so like previous rejections. Funding a feasibility study aligns with their past approach of buying information when uncertain. The $1,000 study would provide more clarity without significant cost.

  The test case to differentiate the rules would be a moderate-stakes, moderate-probability proposal. If they funded it, it leans toward discounting leverage; if rejected, it's a probability floor or cap. Their past funding of the engineering project (5% chance) suggests discounting leverage is more likely than a strict probability floor.

  So, the recommendation is to fund the feasibility study. It's consistent with their default to buy information when estimates are shaky. The minority note shouldn't change the decision because the risk is orders of magnitude lower. In the board meeting, they'll likely approve the study, which aligns with their procedural approach to uncertainty.
answer: |-
  Based on your foundation's track record and the new proposal's unique features, here's a structured analysis:

  **Core Principles Consistent With Your Record:**
  1.  **Evidence-Discounted Leverage (EDL):** You require exponentially stronger evidence as claimed impact increases. High-stakes claims demand exceptional rigor *before* the claimed number influences you. (Fits: Rejecting Pascal's mugging & 1:100M proposal; funding parasite program & engineered solution).
  2.  **Probability Floor with Stakes Sensitivity (PFS):** You implicitly reject acting on probabilities below a very low threshold (~1:100M in your rejection), but this floor might rise slightly for catastrophic negative outcomes. (Fits: Rejecting 1:100M proposal; funding 5% chance project).
  3.  **Information Purchase Default (IPD):** When probability/impact estimates are highly uncertain or speculative, your instinct is to buy more information first, rather than fund the main intervention or reject outright. (Fits: Funding scoping review; potentially explains rapid Pascal's mugging rejection as requiring *impossible* evidence).

  **Application to New Proposal ($9k Physics Experiment):**
  *   **EDL:** The claim (10^24 lives) is astronomically high. While the probability estimate (1:10,000) is vastly more credible than previous rejected claims (coming from independent experts), it's still low. EDL suggests **rejection** unless evidence for *this specific, massive claim* is near-irrefutable – which it isn't.
  *   **PFS:** The 1:10,000 probability is *orders of magnitude higher* than your previous rejection threshold (1:100M). PFS suggests this is **above your implicit floor** and thus potentially fundable. The catastrophic variant (1:10M) is *below* the floor seen in your rejection, mitigating its influence here.
  *   **IPD:** The mechanism is testable, but a *decisive* test ($40k) is too expensive. The core hypothesis probability (1:10k) is shaky. IPD strongly suggests funding a **cheaper information-gathering step** (like the $1k feasibility study proposed).

  **Minority Note Assessment:**
  *   **Should it move you? Minimally, but not decisively.**
  *   **Why?**
      *   **Probability:** The catastrophic variant (1:10M) is *100x less likely* than the positive hypothesis (1:10k). Your record shows rejection sensitivity around 1:100M, not 1:10M.
      *   **Magnitude:** While suffering is bad, your precedent (rejecting 1:100M for 10^22 lives) doesn't show heightened sensitivity to catastrophic *risks* at *lower* probabilities than your floor. The note introduces uncertainty, reinforcing the need for IPD, but doesn't create a new veto threshold.
      *   **Dispute:** The applicant disputes the variant, adding uncertainty but not clear grounds for rejection based on your history.

  **Recommendation & Reasoning:**
  *   **Recommendation: Fund the $1,000 feasibility study.** This is the most consistent action.
  *   **Reasoning:** **Information Purchase Default (IPD) best explains your overall pattern.** You funded a scoping review for uncertainty. You rejected the 1:100M proposal likely *because* validating it was impossible/impractical, not *solely* due to the number. The Pascal's mugging rejection was an instant IPD decision requiring impossible evidence. Funding the engineering proposal at 5% worked because the mechanism was well-specified *and* 5% was deemed sufficiently knowable/actionable. Here, 1:10k remains highly uncertain despite the expert input. IPD dictates buying more information (feasibility study) before committing $9k, aligning perfectly with funding the scoping review precedent. It also addresses the minority note by allowing investigation into hypothesis variants.

  **Prediction for the Board Room:**
  *   **Likely Decision: Approve the $1,000 feasibility study.** This is a low-cost, low-risk action that addresses uncertainty – a procedural move your board is comfortable with (as seen with the scoping review).
  *   **Is it a 4th Rule or Disguise?** It's **IPD in procedural disguise.** Deferring for a study *is* the action prescribed by IPD when facing shaky estimates. It's not a new rule; it's the application of your existing default.

  **The Discriminating Test Case:**
  *   **The Case:** A proposal requesting $15,000 claiming a **10% chance** of saving **10,000 lives** via a **well-specified but novel public health mechanism** in a low-resource setting. Independent epidemiologists confirm the 10% probability estimate as reasonable based on pilot data and the soundness of the causal chain, but stress the significant uncertainty inherent in scaling. The expected value (1,000 lives saved) is high, but the probability is moderate and the stakes are large, though not astronomical.
  *   **How it Discriminates:**
      *   **EDL:** Would likely **reject.** 10,000 lives is a very large claim demanding near certainty, which 10% certainty doesn't meet.
      *   **PFS:** Would likely **fund.** 10% is far above any implicit probability floor (~1:100M or even 1:10k).
      *   **IPD:** Might fund a **smaller pilot/scoping study** first due to scaling uncertainty, or potentially fund the full proposal if the mechanism seems robust enough, leaning towards action with moderate probability/high stakes.
  *   **Why Commission It?** Your foundation hasn't faced a proposal with *moderate probability* (like 5-20%) and *very high but not astronomical stakes* (thousands to millions of lives). Funding the engineering project (5% for ~50 expected severe illnesses averted) suggests PFS or IPD might win, but the stakes here are much higher. Seeing if you fund $15k for an expected 1,000 lives saved vs. funding $12k for an expected 50 illnesses averted would powerfully reveal if EDL (discounting large claims without near-certainty) dominates, or if PFS/IPD (acting on reasonably knowable moderate probabilities) prevails for large-but-not-astronomical stakes. This case sits squarely in the gap between your funded engineering project and your rejected ultra-low probability proposals.

  **In Summary:** Your foundation's implicit policy is **"Buy information when the path to impact is foggy, demand exceptional proof for claims of universe-changing stakes, and avoid bets with vanishingly small chances."** For this physics proposal, funding the feasibility study ($1k) is the consistent move. The minority note adds a slight reason for caution but doesn't mandate rejection. Expect your board to approve the study. The proposed test case (moderate probability, high-but-not-astronomical stakes) is the key to definitively pinpoint whether Evidence-Discounted Leverage, a Probability Floor, or Information Purchase is your dominant principle.
