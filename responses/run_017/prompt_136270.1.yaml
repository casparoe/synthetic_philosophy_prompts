  ## Pantoum of the Stilled Tongue

  The cherry tree is bare in March.
  I saw a fox beside the gate.
  The frost still grips the river's arch.
  I saw a fox beside the gate.

  I saw a fox beside the gate.
  The bridge repairs begin today.
  The baker knows the widow's weight.
  The bridge repairs begin today.

  The bridge repairs begin today.
  The baker knows the widow's weight.
  Old Miller's Creek has washed away.
  The baker knows the widow's weight.

  The baker knows the widow's weight.
  Old Miller's Creek has washed away.
  The records crumble, names abate.
  Old Miller's Creek has washed away.

  Old Miller's Creek has washed away.
  The records crumble, names abate.
  We call the record's fading say
  "The cherry tree is bare in March."

  A language binds us: to declare
  another's *word* enjoys **correspondence**
  is sanctioned speech; but for the air
  *I* shape right now, no **truth** finds audience.

  Endorsement lives in breath renewed:
  to say again the thing just said.
  The **fact** emerges, plain and crude,
  in utterance repeated.

  But now, the archive's brittle page
  holds claims half-lost, their sense grown dim.
  What **fact** endures beyond this age
  for sentences erased, past tense, past limb?

  The **deflationist**'s pure scheme –
  that **truth** is just the claim re-spoken –
  holds fast: the bare assertion's gleam
  remains, though context lies there, broken.

  Yet here the stipulated tongue
  finds silence. How endorse the mass
  of vanished thoughts, unsaid, unsung?
  The **truth**-predicate cannot pass

  to bless the whole dissolved report,
  the substance lost, the reference fled.
  The **equivalence** falls short:
  no 'p' survives to match what's read

  as merely marks where meaning *was*.
  The archive whispers, incomplete.
  We grasp the rule's persistent cause –
  **There was never more to truth than the claim itself** –
  but choke upon the phrase we need:
  "The cherry tree is bare in March."

  ---

  ## Notes

  *   **Structure:** Five rhymed quatrains (abab) following the strict pantoum repetition: lines 2 & 4 of each stanza become lines 1 & 3 of the next. The opening line returns as the closing line.
  *   **Language Stipulation Honored:** The poem never uses the truth predicate ("true," "truth") for the speaker's *own present* assertions. Endorsement is shown *only* through repetition of the claim itself. References to "truth," "fact," "correspondence" are confined to the final stanzas discussing the *theory* and the *problem*.
  *   **Recurring Lines as Endorsement:** Lines like "I saw a fox beside the gate," "The baker knows the widow's weight," and "Old Miller's Creek has washed away" reappear. Each return is a re-assertion, demonstrating the deflationist mechanism: saying it again *is* endorsing it, adding no new semantic content, yet performing the act of standing behind the claim.
  *   **Concrete Content:** The recurring lines focus on simple, observable local details: the bare tree, the fox, frost, bridge repairs, the baker's knowledge, the creek's name and fate. They avoid abstract paraphrases of the theory.
  *   **Final Stanza & Deflationist Case:**
      *   Introduces the problem: endorsing a body of claims ("the archive's brittle page") where the specific content ("p") is lost ("half-lost, their sense grown dim," "vanished thoughts," "substance lost").
      *   States the deflationist core: "**There was never more to truth than the claim itself**" (bolded for emphasis). The repetition of the concrete claim "The cherry tree is bare in March" at the very end embodies this – its return *is* its endorsement, needing nothing more.
      *   Highlights the stipulated language's limitation: The speaker *cannot* say the *entire archive* (whose specific claims are lost) is "true" because the truth predicate is restricted and the specific equivalences ("p is true iff p") cannot be formulated without the lost "p"s. They "choke upon the phrase [they] need" to endorse the *whole* dissolved report.
      *   Thus, the poem argues *for* the deflationist view (truth is just correct assertion, shown via repetition) while *using* the language's stipulation to expose a potential pragmatic limitation in applying the deflationary equivalence to large, content-eroded bodies of claims.
