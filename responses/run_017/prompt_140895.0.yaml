prompt: |-
  I'm in a small reading group on animal ethics, and someone keeps ending arguements with this thing they call the 'astronomical headcount rule': "when the headcount is astronomical, a tiny probability is morally huge." They used it to say a city mosquito-spraying contract is a bigger moral priority than the local shelter's euthanasia policy, even though none of us are confident mosquitoes feel anything. Could you turn that one-liner into a menu of precise theses—about what the 'tiny probability' is a probability of, whether we aggregate actual insects, expected sentient insects, or probability-discounted moral weight, whether moral status can be partial, and what has to be assumed about comparing insect and vertebrate suffering—and for each say if it's trivial, substantive, or false, and whether it actually gets them their priority claim? I'd especially like you to separate an expected-value reading, a precautionary reading, and any "the huge number is doing all the work" reading; feel free to coin labels for readings I haven't named. I'm not asking for sources, just the conceptual map.
