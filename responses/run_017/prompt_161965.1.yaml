prompt: |-
  I'm a philosophy PhD student writing about the ethics and epistemology of clinical risk-prediction tools, and I want to lean on the decision-theoretic result usually called Good's theorem — roughly, that the expected value of a costless piece of information is never negative for an expected-utility maximizer. To check that I had it right I read a chapter in a recent trade book on decision theory, which summarizes it like this:

  'A result proved by the statistician I. J. Good in the 1960s settles the old question of whether ignorance can ever be preferable to knowledge. Good showed that for any expected-utility maximizer the expected value of information is never negative: if you are offered a piece of evidence for free, your expected utility given that you accept it is always at least as high as if you decline it, since you remain free to act exactly as you would have acted before you saw it. So a rational agent's attitude to new evidence is never negative — curiosity is vindicated, and "ignorance is bliss" is, for a Bayesian, provably incoherent. The result also tells you how much evidence to gather: every further datum contributes a non-negative quantity of expected utility, so you should keep buying data until the cost of the next datum exceeds its expected contribution. The theorem is officially about decision rather than belief, but it has an epistemological moral as well, since it explains why knowledge is more valuable than mere true belief. Philosophers who reply that information sometimes hurts — the patient who would rather not know her test result, the card player who would rather not see his opponent's hand, the investor who would rather not hear the rumour — are describing people who are not expected-utility maximizers, so their examples leave the result untouched.'

  The chapter reads as confident and largely right, but I don't trust my sense of where it slides. Two moves worry me especially: the step from a decision-theoretic result to a claim about the value of knowledge, and the brisk handling of the "I'd rather not know" cases. I also have a half-memory that in markets and games public information can make everyone worse off, which sits badly with "never negative."

  Separately, I need to know whether I can use the result at all in the cases I actually care about. Those differ from the textbook setting in three ways: the risk score is delivered to several agents at once (clinician, patient, insurer); it predictably affects the patient's own mental states; and the outcome it predicts is itself partly shaped by how those agents later respond to having seen it.

  Please audit the passage claim by claim: what a decision theorist would accept as stated, what is a benign simplification, what is a substantive misrepresentation, and whether the chapter's practical and epistemological conclusions survive correction of the misrepresentations. Then say whether my three-feature case falls inside the theorem or outside its scope, and how much of the chapter's confidence survives there.

  Flag where you are extrapolating beyond what the formalism actually settles, and tell me what would change your verdict — whether there is a reading of the result on which it really does bear on why knowledge is better than mere true belief, whether my case is better handled by comparing information structures or by game- or market-theoretic models of public information, and where you think your own reading is most likely to fail. I'll add citations myself; please don't give me a reading list.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a philosophy PhD student working on clinical risk-prediction tools and wants to use Good's theorem in their analysis. They've shared a passage from a trade book that summarizes the theorem and its implications, but they're concerned about potential inaccuracies in how the passage presents the theorem, especially regarding the value of knowledge and "I'd rather not know" cases. They also have three specific features in their case study that differ from the standard setup: multiple agents, psychological impact, and feedback loops.

  First, I need to recall what Good's theorem actually states. From what I remember, it's a decision-theoretic result showing that for a Bayesian expected-utility maximizer, the expected value of costless information is non-negative. The key is that the agent can always ignore the information, so the worst-case scenario is acting as if they never received it. 

  Looking at the passage, I notice several points that need auditing. The claim that "ignorance is bliss" is provably incoherent for a Bayesian seems too strong. The theorem assumes the agent is an expected-utility maximizer, so it doesn't apply to cases where psychological factors affect utility. The handling of "I'd rather not know" cases is too dismissive—these are actually important counterexamples when utility functions include psychological states. 

  The epistemological claim that the theorem explains why knowledge is more valuable than true belief also seems questionable. The theorem is about decision-making, not belief formation. While information can lead to better decisions, that doesn't directly address the philosophical distinction between knowledge and true belief. 

  Regarding the user's three-feature case: multiple agents introduce game-theoretic considerations where information can have negative value due to strategic interactions. Psychological impacts mean the utility function itself changes upon receiving information—violating the theorem's assumptions. Feedback loops create dynamic inconsistencies where the prediction affects the outcome. All these factors place the clinical risk-prediction scenario outside the scope of Good's theorem.

  For the user's practical needs, they might need to consider information economics or psychological game theory instead. The trade book's confidence doesn't survive in their case, but the core insight—that information's value depends on how it's used—remains relevant if properly qualified.
answer: |-
  Here's a claim-by-claim audit of the passage, an assessment of your three-feature case, and where the formalism's boundaries lie:

  **Audit of the Passage:**

  1.  **"The expected value of information is never negative for any expected-utility maximizer."**
      *   **Decision Theorist's Verdict:** **Mostly Accepted (with crucial context).** This is the core, formally provable result *under strict assumptions*: The agent is a Bayesian expected-utility maximizer, the information is genuinely costless (including no cognitive/processing costs), the agent can condition their action *perfectly* on the new information, and the information structure is fixed (the act of acquiring info doesn't change the world/others' actions).
      *   **Benign Simplification:** Referring to "evidence" broadly. The theorem applies to signals/data/experiments.
      *   **Misrepresentation/Overstep:** The phrase "for free" might gloss over non-monetary costs (time, anxiety, cognitive load). The theorem *assumes* these are zero. Calling it "never negative" is formally true *in expectation before seeing the specific signal*, but conditional on a *specific* signal value, realized utility *can* be lower.

  2.  **"If you are offered a piece of evidence for free, your expected utility given that you accept it is always at least as high as if you decline it, since you remain free to act exactly as you would have acted before you saw it."**
      *   **Decision Theorist's Verdict:** **Accepted.** This is the fundamental intuition and proof strategy: The agent can always adopt the strategy "Ignore the signal and do what I would have done without it." This guarantees no loss. Conditioning actions optimally on the signal *can only improve* (or leave equal) the expected utility compared to this baseline strategy.

  3.  **"So a rational agent's attitude to new evidence is never negative — curiosity is vindicated, and 'ignorance is bliss' is, for a Bayesian, provably incoherent."**
      *   **Decision Theorist's Verdict:** **Substantive Misrepresentation (Overreach).**
          *   "Attitude never negative": Formally, the *ex ante expected value* is non-negative. But attitudes (like dread) are about *anticipating* potential *realized* negative outcomes upon learning specific bad news. The theorem doesn't preclude dreading a specific signal value.
          *   "Ignorance is bliss provably incoherent": **Strong Overreach.** "Ignorance is bliss" describes situations where *not knowing* avoids psychological distress (anxiety, despair) *even if knowing would lead to better material decisions*. Good's theorem assumes utility functions only care about *outcomes of actions*, not the *state of knowledge itself*. If knowing bad news directly lowers utility (e.g., via anxiety), then ignorance *can* be bliss *for a perfectly rational agent*. The theorem's setup explicitly excludes this by defining utility over world states/outcomes, not beliefs/knowledge states. Saying the *phrase* is "incoherent" is philosophically loaded and incorrect within the broader context of rational choice.

  4.  **"The result also tells you how much evidence to gather: every further datum contributes a non-negative quantity of expected utility, so you should keep buying data until the cost of the next datum exceeds its expected contribution."**
      *   **Decision Theorist's Verdict:** **Benign Simplification (mostly).** This is a standard extension when information *has* a cost (monetary, time). The core non-negativity result ensures that *if* the cost is zero, you should always take it. With cost, you compare the EVOI (expected value of information) to the cost. The simplification is assuming data points are independent and additive in value, which isn't always true (e.g., diminishing returns, interactions).

  5.  **"The theorem is officially about decision rather than belief, but it has an epistemological moral as well, since it explains why knowledge is more valuable than mere true belief."**
      *   **Decision Theorist's Verdict:** **Substantive Misrepresentation (Epistemological Overreach).**
          *   Good's theorem shows that *information* (which *can* lead to knowledge) has instrumental value for *improving decisions*. It doesn't directly speak to the value of *knowledge* vs. *mere true belief*.
          *   The classic problem (Plato's *Meno*) asks why knowing the road to Larissa is better than just *happening* to have a true belief about the right road, especially if both get you there. Good's theorem addresses a different scenario: It shows that *gaining* information (moving from prior belief to posterior belief based on evidence) can improve decisions compared to acting on the prior alone. It doesn't compare two states of *having* belief/knowledge without the *process* of acquisition. The value here is entirely instrumental to action. Philosophers debate whether knowledge has *additional* non-instrumental value or a different constitutive status.

  6.  **"Philosophers who reply that information sometimes hurts... are describing people who are not expected-utility maximizers, so their examples leave the result untouched."**
      *   **Decision Theorist's Verdict:** **Partially Accepted, Partially Misleading.**
          *   **Accepted:** The examples *do* involve agents whose utility functions plausibly include disutility from the *state of knowing* (anxiety) or situations where the theorem's other assumptions (single agent, no strategic interaction, no feedback) are violated. Formally, if you define utility *only* over the final health outcome, the patient *should* want the test result to make better treatment decisions (Good's theorem applies). If knowing the bad result *itself* causes suffering (lowering utility), then the agent isn't maximizing utility *defined solely over health outcomes* anymore. The theorem is untouched *in its narrow domain*.
          *   **Misleading/Benign Oversimplification:** Dismissing these cases as simply "not EU maximizers" is too quick. It implies these are irrational quirks. However:
              *   Incorporating psychological states (fear, regret) *into the outcome space* is a rational and standard way to model these situations *within* EU theory. In this expanded model, Good's theorem still holds: the EVOI for learning the test result relative to this *broader utility function* (including mental state) could be negative if the distress outweighs the decision benefits. The "free disposal" option still exists, but the baseline utility without information might now be *higher* due to blissful ignorance.
              *   The card game and investor examples often involve **multiple agents and strategic interaction** (games), where Good's theorem (single-agent) doesn't apply directly. Public information can indeed harm all players in equilibrium (e.g., Prisoner's Dilemma with revealed types, market crashes triggered by public news).

  **Do Practical/Epistemological Conclusions Survive Correction?**
  *   **Practical Conclusions (Gathering Info):** Largely survive *for single-agent, non-psychological, non-strategic, no-feedback contexts*. The core rule (gather costless info; buy more until cost > EVOI) is sound *within this scope*. The moment psychological costs, strategic responses, or feedback loops exist, this simple rule fails.
  *   **Epistemological Conclusions (Value of Knowledge):** **Do not survive well.** The theorem provides a robust argument for the *instrumental decision-making value of gaining information relevant to action*. It does not successfully address the distinct philosophical problem of why *knowledge* (justified true belief + ?) is more valuable than *mere true belief*, nor does it prove that "ignorance is bliss" is incoherent for rational agents when psychological states are part of utility.

  **Your Three-Feature Case: Clinical Risk Scores**

  1.  **Delivered to Several Agents (Clinician, Patient, Insurer):** **Falls Outside Scope.** This is a multi-agent game with asymmetric information and potentially conflicting incentives/utility functions. Good's theorem (single agent) doesn't apply. The insurer receiving the score might act in ways detrimental to the patient (denial of coverage), making the information *potentially harmful* to the patient *even if* the clinician uses it optimally for treatment. Public information can create coordination problems or adverse selection.
  2.  **Predictably Affects Patient's Mental States:** **Falls Outside Scope.** Learning the score itself directly impacts the patient's utility (anxiety, hope, stigma, placebo/nocebo effects). This violates the assumption that utility is defined solely over the ultimate health/financial outcome. The information changes the *outcome space itself* (adding mental state dimensions). The EVOI calculated over the *original* outcome space might be positive, but over the *true* outcome space (including mental state), it could be negative.
  3.  **Outcome Shaped by Response to the Score:** **Falls Outside Scope.** This is a feedback loop or performative effect. The prediction influences the actions of clinicians, patients, and insurers, which in turn changes the probability of the predicted outcome (e.g., a high-risk score leads to aggressive treatment preventing the outcome, or fatalism causing neglect worsening the outcome). Good's theorem assumes the information structure is exogenous and doesn't change the underlying state probabilities or action consequences. The value of information depends critically on modeling these dynamic responses.

  **Survival of Chapter's Confidence in Your Case:**
  *   **Very Low.** The chapter's confidence ("never negative", "provably incoherent") stems from the clean, single-agent, non-psychological, no-feedback, no-strategic-interaction model. Your clinical case study **violates every key assumption** needed for Good's theorem's non-negative EVOI result to hold directly:
      *   Multiple agents with misaligned incentives (game theory).
      *   Information directly impacting utility (psychological game theory/integrated utility).
      *   Information endogenously changing the state probabilities/outcomes (performative prediction/feedback loops).
  *   The core *idea* that information *can* be used to improve decisions remains relevant, but the automatic non-negativity guarantee vanishes. The value (positive or negative) depends entirely on modeling the complex interplay of these features.

  **Extrapolations and Verdict Changes:**

  *   **Extrapolation 1 (Value of Knowledge):** The formalism only directly shows the instrumental value of *gaining relevant information* for improving decisions in a specific context. To connect it to why *knowledge* is better than *mere true belief*, one needs additional philosophical argumentation, likely centered on the role of justification/evidence in reliably connecting belief to action and truth. Good's theorem alone doesn't bridge this gap. **Verdict Change:** If "knowledge" is *defined* instrumentally as "the state of belief best suited for optimal decision-making," then the theorem supports its value. But this sidesteps traditional epistemological concerns.
  *   **Extrapolation 2 (Handling Your Case):** Your case is **better handled by comparing information structures** within a game-theoretic or market-theoretic model incorporating:
      *   **Information Economics:** Value of information under adverse selection, moral hazard, and strategic disclosure.
      *   **Psychological Game Theory:** Modeling utilities that depend on beliefs, anxiety, or the act of knowing itself.
      *   **Performative Prediction/Equilibrium Analysis:** Modeling how the deployment of the risk score changes behavior and outcomes, seeking a new equilibrium. Comparing welfare (e.g., ex-ante expected utility) under different information disclosure policies (who sees what?) is the key, not applying a single-agent EVOI result.
  *   **Where My Reading Might Fail:**
      1.  **Overemphasizing Psychological Utility:** A hardcore decision theorist might insist that a sufficiently rich outcome space (including all mental states) *can* incorporate these effects, and Good's theorem *would* apply to EVOI relative to *that* space. My claim is that this stretches the "costless" and "no feedback" assumptions too thin in practice.
      2.  **Scope of Feedback:** While strong feedback loops clearly violate the exogenous information structure assumption, *mild* feedback might be approximately handled within an expanded model. The critical point is that the theorem doesn't guarantee non-negativity once feedback exists.
      3.  **Epistemology Nuance:** Philosophers like James Joyce have argued for decision-theoretic accounts of epistemic value. My dismissal of the epistemological moral might undervalue these sophisticated attempts to link belief accuracy to expected utility, though I maintain Good's theorem alone doesn't resolve the Meno problem.

  **Conclusion:** The trade book chapter presents Good's theorem accurately only for a highly idealized single-agent context and overstates its implications, particularly regarding "ignorance is bliss" and the value of knowledge vs. true belief. Its practical advice is sound only within that narrow scope. Your case study involving multiple agents, psychological impacts, and feedback loops falls decisively outside this scope. Here, the expected value of the risk score information **can be negative** for some agents (especially the patient) due to strategic actions by others, psychological harm, or unintended consequences of behavioral responses. The chapter's confidence does not survive in this complex, realistic setting. Analyzing your case requires moving beyond Good's theorem to models of strategic information disclosure, psychological utility, and equilibrium responses in complex systems.
