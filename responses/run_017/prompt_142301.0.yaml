prompt: |-
  Me and my mate got into it about hinge epistemology last night after a seminar and he rebuilt my own objection better than I could, and now I can't find the loose step. His version goes like this:

  (1) A hinge proposition is defined by its job: it's what has to stay put for doubt, evidence and justification of other things to make sense at all, so it can't itself be justified or doubted from inside the practice it belongs to.
  (2) That job is functional, not genealogical — nothing about being a hinge depends on how the proposition got installed. One that was drilled into a kid by a Cult leader functions as a hinge just as well as one you absorbed by growing up in an ordinary form of life.
  (3) So if a community's practices make something like "the Leader is never wrong" exempt from doubt, then inside that community there literally is no such thing as checking the Leader's claims — the doubt isn't false, it's unthinkable.
  (4) Rational criticism of a belief needs a shared practice in which the doubt is intelligible; where the practice differs, all you can do is describe what each side does.
  (5) So hinge epistemology can't say anything against systematic indoctrination, or against any deviant framework at all — it collapses straight into relativism about rationality.
  (6) But that can't be what the view was for: it was supposed to describe the structure of our certainties, not to say that anything a community is sure of is as good as anything else. And (5) is just absurd anyway. So something above is wrong.

  Every single step looked fine to me at 1am and I can't spot the slide. Which step do you reject, why does it look innocent when it isn't, and what do you end up paying? I'd rather hold on to (1) and to the anti-genealogical point in (2) than save (6), but I want to know what holding them costs. Also, if it matters: what does each of the two big readings — the one where hinges aren't really truth-apt propositions at all but something more like rules, and the one where they are propositions we hold without evidence because inquiry needs them — have to give up to block (5)?
reasoning: |-
  Okay, let me try to unpack this user's problem. They had a debate about hinge epistemology with their friend, and now they're stuck because their friend reformulated their objection in a way that seems logically sound but leads to an absurd conclusion. The user wants to identify where the argument goes wrong, especially since they value the core ideas in premises (1) and (2).

  First, I need to understand the structure of their friend's argument. It starts with defining hinge propositions functionally, then argues that this leads to relativism because even indoctrinated beliefs could function as hinges. The user feels all steps seem valid but the conclusion (that hinge epistemology implies relativism) feels wrong. 

  The key tension is between the functional definition of hinges and the need to avoid relativism. I recall that in hinge epistemology, hinges aren't just any unquestioned beliefs - they're what make rational practices possible. So maybe the problem is in step (3) where the friend claims a cult's "Leader is never wrong" could be a hinge. But is that belief actually enabling a practice of inquiry, or shutting it down? 

  Wittgenstein's examples of hinges are things like "the Earth exists" or "my name is..." - propositions that are necessary for any doubt to make sense. A cult's dogma might function as an unquestioned belief, but does it serve the same epistemic function? Probably not, because it actively prevents the kind of rational practice that hinges are supposed to enable.

  The user mentions two interpretations of hinges: as rules vs truth-apt propositions. For the rules interpretation, rejecting step (3) is easier because the cult belief isn't a rule enabling inquiry. For the propositions interpretation, we'd need to say that genuine hinges must be enabling rational practices, not just any practice.

  I should also address why step (3) seems plausible initially. It's because we focus on the "unquestioned" aspect while overlooking that hinges must support rationality. The functional role in (1) is being misinterpreted as "any exemption from doubt" rather than "exemption that makes doubt possible."

  The cost of rejecting step (3) is that hinge epistemology can't be completely neutral - it must distinguish between enabling frameworks and disabling ones. But this doesn't require genealogy; it's still about current function. The user wanted to preserve (1) and (2), and this approach allows that while blocking relativism.
answer: |-
  Here's the breakdown of where the argument goes wrong, why it's deceptive, the cost of blocking it, and how different readings of hinges handle it:

  **The Loose Step is (3):**  
  Specifically, the claim that *"the Leader is never wrong"* can function as a genuine hinge proposition in the same way as paradigmatic hinges (e.g., "The Earth exists," "I have hands," "The world didn't pop into existence 5 minutes ago").

  ### Why (3) is Wrong:
  1.  **Not All Unquestioned Beliefs are Hinges:** Hinge propositions aren't defined *just* by being exempt from doubt within a practice. Their functional role (from (1)) is to **enable the very practices of inquiry, justification, and doubt** for *other* propositions. "The Leader is never wrong" **actively *disables*** these practices for a massive domain of propositions (anything the Leader says). It functions as a *prohibition* on inquiry, not as a *foundation* for inquiry.
  2.  **Contradiction of the Epistemic Role:** Genuine hinges make rational practices *possible*. The cult dogma makes rational practices *impossible* regarding the Leader's statements. It replaces evidence-based assessment with blind acceptance. This violates the core functional definition in (1).
  3.  **Lack of Universality within the Framework:** While hinges are framework-relative, genuine hinges within a framework are usually **universal enablers**. "My senses are generally reliable" enables checking *any* empirical claim. "The Leader is never wrong" only enables checking claims *not made by the Leader* – it actively shuts down inquiry into a specific, crucial set of claims.

  ### Why (3) Looks Innocent (The Deception):
  *   **Focus on Exemption Alone:** Step (3) isolates the "exempt from doubt" aspect of hinges (which is real) and ignores the *positive enabling function* specified in (1). It treats hinges *negatively* (as immune) rather than *positively* (as constitutive).
  *   **Superficial Functional Resemblance:** Both the cult dogma and genuine hinges are unquestioned within their contexts. This superficial similarity masks the deep functional difference: one *enables* rational practices, the other *suppresses* them for a key domain.
  *   **"Practice" Ambiguity:** It conflates *a social practice of obedience* with *an epistemic practice of inquiry*. The cult has a practice, but it's not a practice of rational inquiry concerning the Leader; it's a practice of deference. The argument smuggles in the idea that *any* social practice defines a rational epistemic framework.

  ### What You Pay to Block (3) and Save (1)/(2):
  You must commit to a **substantive distinction between enabling frameworks and disabling frameworks**, based purely on their *current functional structure*, not their genealogy (saving (2)).

  *   **The Cost:** Hinge epistemology cannot be completely **neutral** or **descriptive-only** about frameworks. It must imply that frameworks suppressing core rational practices (like evidence-gathering for central claims) are **epistemically defective** or **non-genuine rational frameworks** *because they fail to perform the constitutive function hinges are defined by in (1)*. This avoids relativism but means hinge epistemology entails a normative claim about what constitutes a viable framework for rational inquiry.

  ### How Different Readings Handle It:
  1.  **Hinges as Rules (Non Truth-Apt):**
      *   **Rejects (3) Easily:** Rules like "Check evidence," "Trust your senses under normal conditions," *enable* the game of doubting and justifying. The cult "rule" "Never doubt the Leader" is a *different kind* of rule – it's a rule *prohibiting* the application of other epistemic rules to a specific domain. It functions as a **meta-rule shutting down the epistemic game** for certain moves, not a rule constitutive *of* the game. This reading sharply distinguishes enabling constitutive rules from disabling prohibitive rules.
      *   **Cost Paid:** Relinquishes the idea that hinges are propositions "held" at all; they are implicit norms structuring practice. The cult indoctrination installs a *different norm*, not a hinge.

  2.  **Hinges as Propositions Held Without Evidence (Truth-Apt):**
      *   **Also Rejects (3), but with More Effort:** Must argue that for a proposition to *function* as a hinge, it must genuinely *enable* the practices of justification/doubt. "The Leader is never wrong" cannot do this for claims made by the Leader, as it precludes justification/doubt *by design*. It's an *idle* certainty, not a *productive* one. Genuine hinges are held without evidence *precisely because* demanding evidence for them would undermine the *possibility* of evidence-based inquiry itself. Demanding evidence for the cult dogma wouldn't undermine inquiry *in general*; it would potentially *enable* it regarding the Leader.
      *   **Cost Paid:** Must accept that not every deeply held, unquestioned belief counts as a hinge. Only those whose certainty *plays the specific functional role* described in (1) qualify. This requires a richer functional analysis than just "exempt from doubt." It also implies that frameworks built around "hinges" that actively disable inquiry are pathological or irrational.

  ### Conclusion
  Your instinct to hold onto (1) and (2) is sound. The flaw is in (3)'s misapplication of the functional definition. The cult proposition doesn't perform the *hinge job* defined in (1); it performs an *anti-hinge job*. Blocking the slide to relativism requires recognizing that the functional role in (1) is **productive** – hinges must *constitute* the space for doubt and justification, not merely exist within a practice or block it for specific domains. The cost is that hinge epistemology must implicitly judge some frameworks (those disabling rational inquiry at their core) as epistemically defective based on their structure, not their origin. Both major readings can accommodate this by providing different explanations for why "The Leader is never wrong" fails to be a genuine hinge.
