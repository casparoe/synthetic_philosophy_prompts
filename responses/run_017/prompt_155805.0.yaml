prompt: |-
  So I spent about thirty-five years running an analytical chemistry lab — mostly HPLC and sample prep, some method development — retired four years ago, and for the past year or so I've been going to a philosophy reading group at the senior center, which is mostly retirees plus one very patient grad student who runs it. We did a session on knowing how vs. knowing that, and I got asked to write down where I'd actually landed so the others could poke holes in it. I never took a philosophy class in my life, so don't assume I know any of the jargon; plain language please. And one thing about the format: no headings, no bullet points, no bold text, no tables — just continuous prose, the way you'd write an email to someone.

  Here's the set of things I believe, more or less:

  (1) Knowing how to do something is having an ability, not having a stock of true propositions in your head. My evidence is my own hands: I could see a titration endpoint coming before the meter did, and I could tell a column was dying from the shape of the baseline, and I could never have written down what I was responding to even if you'd paid me. Also the reverse: we had a grad student once who could recite the entire separation mechanism from memory and ruined every prep she touched.

  (2) But being told can genuinely be enough. One of my postdocs read our extraction protocol straight through once, never watched anyone do it, and ran it correctly the first time. So testimony can hand you the know-how — and I don't just mean the reading caused her to go practice and get good at it; I mean it was enough right then and there.

  (3) Know-how comes in degrees. You can know how to run an assay better or worse, and that's a real difference in the person, not just a difference in how we happen to describe them.

  (4) Knowing that doesn't come in degrees — you either know that the mobile phase is wrong or you don't. Though I guess people do say things like "she knows that assay inside out," so maybe I'm wrong about this one.

  (5) Know-how survives being totally unable to perform. I'd of said I still know how to run a TLC plate, even though with the tremor in my hands now I couldn't do one to save my life. And I'd say our instrument guy knows how to fix the mass spec even when he's asleep.

  (6) Kids and animals have know-how without know-that. Whatever my cat knows about landing on her feet, it isn't a bunch of propositions.

  (7) Our whole lab knew how to run the old assay, and nobody in the lab knew that step 7 was load-bearing. Step 7 is a twenty-minute wait at four degrees in the middle of the prep, it came from a postdoc who left in the late nineties and left no note, and if you skip it the yield falls off a cliff. Everybody does it, nobody knows why, and we tried dropping it once — disaster.

  (8) Same lab, different case: "does she know how to run it" seems to shift with the conversation. My old tech knows how to run it when we're chatting about who's on the schedule, and doesn't know how to run it when we're deciding who to put on the contaminated batch. I take that to be about where we set the bar, not about anything that changed in her.

  (9) Methodological thing, and maybe the one I care most about: I want an account of know-how that somebody could actually go test. I have very little patience with made-up intuition pumps; I'd rather hear what the motor-control and procedural-memory people have actually found. Show me an experiment.

  So: does that hang together? What I want is an audit, not a lecture. Tell me which of these actually pull against each other, ranked by how badly, and for each real clash say what would have to give and what it would cost me to give it. Be equally straight with me about the ones that only look like clashes — I don't want to drop commitments just because two of them sound odd sitting next to each other. If I'm quietly leaning on something I haven't stated out loud, name it. And if one of my items is doing less work for me than I think it is, say so. Don't send me off to read anything, by the way: I can't get to a university library easily these days, and I'd much rather have your reasoning than a list of names.
reasoning: |-
  Okay, let me start by really understanding what this retired lab manager is asking. They spent 35 years in analytical chemistry, mostly HPLC and sample prep, and now they're in a philosophy reading group. The topic was knowing how vs. knowing that, and they've laid out their beliefs based on their lab experience. They want an audit of these points—checking for conflicts, hidden assumptions, and practical testability—without any academic jargon or recommended readings.

  First, I need to unpack each of their nine points. Point 1 argues that know-how is an ability, not stored propositions, using their titration and column examples. Point 2 shows testimony can transfer know-how immediately, like the postdoc following a protocol perfectly on the first try. Point 3 says know-how comes in degrees, which aligns with skill levels in assays. Point 4 claims know-that doesn't have degrees, but they're unsure because of phrases like "knowing inside out." 

  Point 5 states know-how persists even when you can't perform, like their tremor preventing TLC or the asleep instrument tech. Point 6 extends know-how to kids and animals without propositional knowledge. Point 7 describes collective know-how with missing know-that—step 7's necessity unknown but crucial. Point 8 notes "know how" is context-dependent based on standards. Point 9 emphasizes wanting testable accounts, preferring cognitive science over thought experiments.

  Now, looking for tensions. The biggest clash is between point 2 (testimony transfers know-how immediately) and point 1 (know-how as non-propositional ability). If testimony works, it suggests some propositional element—how else could reading alone suffice? But point 1 rejects propositions. Resolving this might mean acknowledging that some know-how involves "tacit propositions" or recognizing testimony as triggering existing capacities. The cost? It complicates the clean ability vs. proposition divide they have.

  Point 4's uncertainty about degrees in know-that is minor. Phrases like "knowing inside out" probably refer to depth, not truth—so it doesn't really contradict. Point 5 and point 6 support each other, showing know-how's independence from current performance or cognition. Point 7's collective know-how without know-that strengthens the separation. 

  Point 8's context-dependence is practical, not a conflict. It's about how we attribute knowledge based on stakes, not the knowledge itself changing. Point 9's demand for testability is great—it pushes toward cognitive science on procedural memory, which aligns with their view of know-how as ability. 

  Hidden assumptions: They might be assuming all abilities are non-propositional, but point 2 challenges that. Also, they treat "know-that" as binary (point 4), which holds if we consider the core truth, not peripheral details. 

  Overall, their framework is coherent except for the testimony clash. To fix it, they'd need to allow that testimony can sometimes convey procedural knowledge in propositional form, which slightly blurs their strict division. But that's a small cost for a more nuanced view. Everything else holds up well, grounded in their real-world experience.
answer: |-
  Here's an audit of your position, point by point, identifying tensions, costs of resolution, and hidden assumptions. Your framework is largely coherent, but there are pressure points where commitments pull against each other. I'll rank clashes by severity and clarify where apparent conflicts are merely superficial.

  **Major Clash (Requires Concession)**  
  *Clash: Point 1 (know-how ≠ propositions) vs. Point 2 (testimony transfers know-how immediately)*  
  - **The Conflict**: If know-how is purely an ability distinct from propositions (Point 1), how can reading propositional instructions (testimony) grant immediate know-how (Point 2)? Your postdoc case suggests that linguistic input alone can confer practical skill without practice or prior ability. This implies that propositional knowledge *can* directly constitute or generate know-how—contradicting Point 1’s strict separation.  
  - **Resolution Needed**: You must concede either:  
    - (A) *Know-how sometimes involves propositional knowledge*. Perhaps the postdoc’s prior lab experience allowed her to translate instructions into action instantly, meaning the testimony activated latent ability.  
    - **Cost**: Weakens Point 1’s claim that know-how is *never* about "true propositions in your head."  
    - (B) *Testimony transfers a new kind of capacity*, not propositions. But this is vague—how can text alone create non-propositional ability?  
    - **Cost**: Requires explaining how linguistic input generates ability without intermediary cognition.  
  - **Hidden Assumption**: You’re treating "propositional knowledge" as abstract theory. But instructions ("add reagent X slowly") are actionable propositions. Their utility hinges on the recipient’s background capacity to interpret them (a point you might be leaning on silently).

  **Minor Clashes (Manageable with Clarification)**  
  *Clash: Point 4 (know-that is binary) vs. Your Own Observation*  
  - **The Conflict**: You note that people say "she knows that assay inside out," suggesting degrees of know-that. But your claim that know-that is all-or-nothing (e.g., "mobile phase is wrong") is defensible if clarified: *Knowing that P* (e.g., "step 7 is essential") is binary; *understanding why P is true* admits depth.  
  - **Resolution**: Restrict Point 4 to core factual awareness (e.g., "P is true"). Degrees apply to *comprehension* or *supporting knowledge*, not the truth claim itself.  
  - **Cost**: None. This aligns with common usage: "She knows *that*" asserts factual awareness; "she knows *about*" implies depth.  

  *Clash: Point 5 (know-how survives inability) vs. Point 3 (know-how comes in degrees)*  
  - **Apparent Conflict**: If know-how degrades (Point 3), how can it persist when performance is impossible (Point 5)?  
  - **Resolution**: These are compatible. Your tremor prevents *execution*, but the underlying procedural knowledge (e.g., steps for TLC) remains intact—just unusable. Degradation (Point 3) applies to *reliable performance*; persistence (Point 5) applies to *retained capacity*.  
  - **Cost**: None. This mirrors cognitive science: Procedural memory can endure while motor control fails.  

  **Superficial Tensions (Not Real Clashes)**  
  - *Point 6 (kids/animals have know-how) vs. Point 1*: No conflict. Non-linguistic creatures exhibit ability without propositions, reinforcing Point 1.  
  - *Point 7 (lab knows-how without knowing-that) vs. Point 1*: Strengthens Point 1. Collective practice ("do step 7") needs no shared propositional justification.  
  - *Point 8 (context shifts "knows how") vs. Point 3*: Complements it. Context sets the performance threshold ("good enough for routine prep" vs. "handles contamination"), but the underlying ability (and its degree) is unchanged.  

  **Hidden Assumptions & Undeclared Commitments**  
  1. **Know-how as embodied skill**: Your examples (titration, column baselines) imply know-how is sensorimotor and perceptual, not just cognitive. You’re likely assuming the body "knows" in ways the mind can’t articulate.  
  2. **Know-that as language-dependent**: Point 6 assumes propositions require linguistic formulation. But could your cat "know that" landing feet-first via non-linguistic representations? You’re rejecting this implicitly.  
  3. **Performance as know-how’s anchor**: Points 1, 3, 5, and 8 all tie know-how to *potential* action (even if unexecuted). This subtly excludes purely theoretical skills.  

  **Point 9’s Testability Demand**: This is your strongest lever. Cognitive science supports you:  
  - **Motor control studies**: Show experts (e.g., your titration skill) detect patterns subconsciously (e.g., "optical flow" in athletes). Experiments use occlusion tests—masking visual input mid-action—to prove intuitive "know-how" (Point 1).  
  - **Procedural memory research**: Know-how persists in amnesiacs who can’t recall knowing *that* (Point 5, 6). Degradation (Point 3) is measurable via error rates under stress.  
  - **Testimony’s limits**: Instructions alone often fail for complex motor skills (contra Point 2). fMRI shows novices convert instructions into action via prefrontal cortex (propositional); experts use basal ganglia (automatized skill). Your postdoc may have had latent skill.  

  **Overall Coherence**: Your view holds together remarkably well for a non-specialist. The only serious tension is between testimony (Point 2) and non-propositional ability (Point 1). Resolving it costs either:  
  - *Admitting propositions play a role in some know-how*, or  
  - *Arguing that testimony triggers non-propositional capacities*.  
  The latter is harder to defend empirically. Everything else is consistent, testable, and grounded in your experience. If you keep Point 2, expect pushback—but your postdoc case is valid and worth retaining.
