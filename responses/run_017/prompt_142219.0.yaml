prompt: |-
  You are a legal philosopher who also reads a lot of speculative fiction, and you are good at telling the difference between "that couldnt happen" and "that could happen but no one would do it". Take your time with this one — it's the part I actually care about. Before you write anything in list form, spend a couple hundred words brainstorming the failure modes: how a theory of a legal system's power to change its own founding rules can be too permissive (everything ends up counting as a valid amendment, so the theory has no teeth and every plot twist is allowed) or too strict (it can't even describe legal change that obviously happens in the real world). Then give me the actual spec.

  Setup, briefly, so you know what I need it for. Third book in a series. The polity is called the Concordance and its founding document is the Instrument. I want to put the characters through some constitutional crises that turn on self-amendment — the Instrument being used to rewrite the rules for rewriting the Instrument — and I need to know which of the devices I'm playing with are incoherent and which are merely outrageous, because my readers are absolutely the kind of people who email me about this. So: the purpose of the theory is to tell me which plot devices are available. Not to settle jurisprudence.

  Here are the things I want to be able to do, and you can use them as the test cases:

  - The ratchet. Article 14 says no amendment may be made which makes future amendment easier. It's adopted properly. Forty years later a big majority wants out. Question: can the ratchet be repealed by an amendment that satisfies it? It seems like it can't, and yet it was itself passed under a laxer rule, so it seems like it must be reachable somehow.
  - Self-application. Article 2 says the Instrument may be amended by a two-thirds vote, and says of itself that it governs changes to itself. Article 21 says universal suffrage shall not be abolished, and doesn't say anything about how you'd change that. A two-thirds vote abolishes suffrage. Is that amendment valid or not? And more generally: does a theory have to respect a distinction between an amendment rule that covers its own amendment and one that doesn't, or is that distinction an illusion?
  - Mutual entrenchment with no tie-breaker. Article 2 (two-thirds, nothing exempt) versus Article 21 (no amendment at all). Both are in the Instrument, and there's no article telling you which wins. Does a theory have to supply a tie-break rule, or can a legal system simply have a hole here? And if it does supply one, where does the tie-breaker get its authority from — do I need a third-order rule about how the amendment rule gets amended, and then a fourth, and if not, what stops the regress?
  - The unenacted founding. The Instrument was drafted by a committee that, under the previous regime's own rules, had no authority to draft anything. Nobody authorized the authorizers. Everyone has treated it as law for sixty years. Does a theory need to say the Instrument was invalid and then somehow became valid, or can it just start from acceptance in the present and treat the origin as irrelevant?
  - The coup that becomes law. A junta seizes power and passes forty amendments in its first year, all following Article 2's procedure exactly. Twenty years on, the courts uphold the whole lineage. Were those forty amendments valid in year one, valid only later, or never valid but now unreviewable? I need to know whether "valid" and "will be treated as valid" are allowed to come apart here, and in which direction.
  - Continuity after total replacement. Two hundred years in, every original article has been replaced at least once through the proper procedure, and there's a two-hundred-year-old water treaty whose text refers to "the Instrument and its successors". One character argues the obligation lapsed because there's no legal continuity left. Is an amendment-by-amendment replacement different in kind from a single amendment that swaps the whole document, or only in degree? Does the theory have to give me an answer about when it stops being the same legal system, or is that question one the theory can declare undecidable?

  So: write me the requirements list for a theory of self-amendment — the cases it has to handle, the distinctions it mustn't collapse (amendment versus replacement versus reinterpretation, validity versus efficacy versus acceptance, "unamendable" versus "amendable only by a harder procedure", the self-applying versus self-exempting rule), the results about legal change it can't contradict — with the case or consideration behind each requirement, and mark which are non-negotiable, which are preferences of one camp, and which are really moral demands wearing legal costume (I suspect "a generation can't bind its successors" is one of these, but you tell me). Flag any pair of desiderata you think can't be jointly satisfied; that's the bit I most want to see, because if the list itself is impossible then that's a plot in itself. Tell me which single requirement knocks out the most candidate theories. And tell me where my fictional system is genuinely underdetermined — where several theories would license the same thing — so I know which choices I can make for story reasons instead of logic reasons.

  I dont want citations or reading lists, and please no "see so-and-so 1961" — I'm on a deadline, there's no library within a day's travel, and it'd just be you guessing at page numbers anyway. Work it out from the cases. If some family of theories obviously dies on one of your requirements, say so in a sentence and move on; I don't need a scorecard.

  Also — and this matters for how much weight I put on it — tell me how confident you are in the list overall, and single out the one claim you're least sure of. If you're guessing somewhere I'd rather know which bit than be confidently misled.

  Finish with one machine-readable line, nothing after it: \answer{<short label of the desideratum doing the most exclusionary work>; <the pair of desiderata you think cannot both be satisfied>}
