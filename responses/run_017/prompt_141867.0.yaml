  For making diagonalization visible, we'd need an analogy where the "roster" explicitly can't contain all possible subsets - perhaps a village that claims to have barbers for every conceivable shaving pattern, but then can't accommodate the anti-pattern defined by diagonalization. That might better reveal why no universe can contain its own powerset.

