answer: |-
  ### Joint Statement: Adversarial Collaboration on Testimonial Warrant  
  **Context**: Drafted under conditions of mutual review; formulations approved by both parties.  

  ---

  ### 1. Agreed Claims  
  1. **Non-Cartesian Standards**: Justification for testimonial beliefs need not meet deductive certainty or eliminate all possible deception scenarios.  
  2. **Ubiquitous Monitoring**: Hearers routinely (often subconsciously) monitor for signs of incompetence/deception (e.g., internal inconsistency, visible nervousness). This does not entail *inferential justification* for the content.  
  3. **Defeasibility**: All testimonial warrant is defeasible. New evidence (e.g., contradictions, signs of bias) can undermine justification.  
  4. **Role of Track Records**: Past reliability of a *specific* speaker or institution can strengthen testimonial justification. Neither denies this.  
  5. **Default Trust Efficiency**: In ordinary contexts, hearers form beliefs based on testimony without conscious inference. This is pragmatically necessary for social cognition.  
  6. **High-Stakes Variation**: In high-stakes scenarios (e.g., medical diagnosis), hearers often seek additional evidence. This is compatible with both views (reductionists see it as prudent induction; anti-reductionists as responding to defeaters).  
  7. **Strongest Concessions**:  
     - *Reductionist grants*: Anti-reductionism better explains spontaneous trust in children/novices who lack inductive resources.  
     - *Anti-reductionist grants*: Reductionism better handles cases where testimony conflicts with established evidence (e.g., trusting a friend’s improbable alibi).  

  ---

  ### 2. Disagreements Table  
  | **Issue** | **Reductionist Position (R)** | **Anti-Reductionist Position (AR)** |  
  |-----------|-------------------------------|-------------------------------------|  
  | **Source of Warrant** | Warrant for testimonial beliefs derives entirely from the hearer’s non-testimonial evidence (e.g., past reliability of testimony + contextual cues). | Warrant for testimonial beliefs presumptively arises from the act of testimony itself, absent defeaters. Non-testimonial evidence only *adds* to or *subtracts* from this. |  
  | **Novel Source Justification** | A hearer with zero prior exposure to a source-class (e.g., alien communication) lacks justification to believe initial testimony without independent calibration. | A hearer is presumptively justified in trusting novel sources, provided the testimony presents as sincere/competent. Calibration is only needed to *maintain* trust after initial acceptance. |  
  | **Silence as Testimony** | Warranted belief from omission (e.g., undisclosed house flaws) is not testimonial. It is an inference from conventions + observed absence. | Warranted belief from omission *is* testimonial when silence occurs within a norm-governed communicative practice (e.g., clinical handovers). It is an assertion-by-omission. |  

  ---

  ### 3. Cruxes: Tests and Predictions  
  #### Crux 1: The Uncalibrated-Source Problem  
  **Case**: First-contact scenario. Humans receive a translated message from an isolated oceanic society with zero prior interaction. Message: "Touching our sacred coral causes fatal rashes."  
  - **Test Question**: Can the humans be justified in believing this *before* verifying it independently?  
  - **R Prediction**: No. Without prior data about the society’s reliability/genre conventions, belief is unjustified. Justification requires cross-checking (e.g., biological analysis).  
  - **AR Prediction**: Yes. If the message appears sincere/competent (e.g., clear translation, contextual seriousness), belief is presumptively warranted. Verification is for *maintenance* of trust.  
  - **Why Separate from Bootstrapping?**: Unlike "epistemic basement" cases (e.g., children trusting parents), here there is no prior testimonial practice to bootstrap. Tests whether *any* new source-class gets "free" warrant.  

  #### Crux 2: Informative Silence  
  **Case**: A used-car listing omits mention of engine floods, despite local laws requiring disclosure of major damage. Buyer believes the car was never flooded.  
  - **Test Question**: Is the buyer’s belief (from silence) warranted *testimonially*?  
  - **R Prediction**: Not testimonial. The warrant comes from inference: "If flooded, sellers must disclose; no disclosure → not flooded." Requires independent knowledge of disclosure norms.  
  - **AR Prediction**: Testimonial. The seller’s silence functions as an assertion ("no flooding") within a norm-governed practice (sales contracts). Defeaters would be ignorance of norms.  
  - **Costs**:  
    - R risks excluding cases where silence clearly transmits knowledge (e.g., medical charts omitting allergies).  
    - AR risks overgenerating: If all patterned absences are testimonial, then failing to signal "not a spy" in a spy-filled park becomes an assertion.  

  #### Crux 3: The "Default" Disambiguation  
  **Agreed Terminology**:  
  - "Default" for R: The hearer needs no *explicit, conscious* inference.  
  - "Default" for AR: Testimony provides *sui generis* warrant irreducible to other sources.  
  **Surviving Dispute**: Whether testimony’s warrant *structure* is distinct.  
  - **Test Case**: A hearer with amnesia (no inductive basis) trusts a stranger’s directions.  
  - **R Claim**: Warrant still depends on subconscious cues (e.g., speaker confidence) + generic empirical optimism about humans.  
  - **AR Claim**: Warrant arises from the testimony’s normative structure (e.g., assertion invokes a truth-telling commitment).  
  **Neutral Reframing**: "Is testimonial warrant *explainable without* invoking a unique epistemic norm specific to communication?"  

  ---

  ### Confidence & Caveats  
  **Overall Confidence**: High (95%) on formulations. Both parties ratified wording iteratively.  
  **Least Confident Claim**: Disagreements Table, Row 2 (Novel Source). The anti-reductionist *might* later dispute "presumptively arises" if "sincere/competent" cues are deemed insufficiently defined.  
  **Key Caveat**: The silence row (Crux 2) risks conflation. Anti-reductionists could argue that conventions *are part of testimony’s normative structure*, making the dispute semantic. We flag this but retain it due to predictive divergence.  

  **Word Count**: 1080
