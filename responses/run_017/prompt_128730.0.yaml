prompt: |-
  I am writing a paper on slurs, and I keep finding that the literature advances one example at a time: a case is produced and offered as decisive for or against a whole framework. I want the specification before the verdicts.

  Write the desiderata list: what any adequate theory of slurs has to deliver. Fix the purpose as two jobs at once — (a) a predictive job: for an arbitrary expression in an arbitrary language, say whether it is a slur, which group it targets, and roughly where it sits on a scale of offensiveness; and (b) a normative job: say what, if anything, is wrong with a particular utterance of it, when uttered by whom and to whom, and what an appropriate response would be. If no single theory can do both, say so, tell me which job to give up, and what a theory stripped of the other job should look like.

  For each requirement give the case or consideration that motivates it, and mark it as non-negotiable or as a preference internal to one research programme. At a minimum I want requirements motivated by the following, which I have not seen handled together:

  1. A language has an ordinary word for an ethnic group; philologists establish it began life as a slur, but no living speaker — including members of the group — knows this.
  2. A speaker coins a group-directed derogatory expression on the spot, which hearers have never encountered but instantly read as hostile and as aimed at a group: a neutral group label with a pejorative affix, a mocking imitation of the group's accent, or a gesture.
  3. A slur is borrowed into a second language where it functions as a neutral or affectionate in-group label; it is uttered by a member of the borrowing community and overheard by someone from the community of origin, and the two hearers diverge completely.
  4. The slur is the only term in common use for the group; the official alternative is clinical, archaic, or offensive in some other way.
  5. The slur is applied to someone who is not a member of the target group, or it encodes a taxonomy the relevant science rejects.
  6. The same lexical item under negation, in the antecedent of a conditional, in a question, in reported speech, in quotation, and in a linguistics lecture about slurs — where offense seems to survive non-assertoric embedding but attenuates differently in each.
  7. In-group members use it as a term of endearment while out-group members cannot, including in quotation; and reclamation sometimes occurs without anyone deciding anything.
  8. Successor terms acquire the offense of the terms they replaced, and some slurs lose their group-specific content and become general-purpose insults.
  9. Group-directed contempt conveyed by prosody, gesture, or pronoun misuse, with no distinctive lexical item.
  10. Group-directed insults for voluntarily joined groups, for dominant groups, and for occupational or regional categories.

  Say which distinctions the theory must respect rather than collapse: slur versus pejorative versus epithet versus profanity; targeting versus referring versus predicating; content versus force versus uptake versus harm versus wrongness; a norm against use versus a difference in meaning; type-level versus token-level facts; binary versus graded offense. Note any findings from sociolinguistics the theory may not contradict.

  Then flag any subset of your own desiderata you suspect cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of the current candidates. If it helps, close with a short table scoring the four standard families (derogation as truth-conditional content, as a conventional implicature or expressive dimension, as a pragmatic inference, or as the violation of a use-prohibition) against the list, and say what observation would settle the two disagreements that matter most. A table is fine; keep the argumentative weight on the criteria.
reasoning: |-
  Okay, let me tackle this user's complex request about slur theory desiderata. The user is clearly frustrated with piecemeal approaches in the literature and wants a systematic framework that handles predictive and normative dimensions together. 

  First, I need to unpack their core demand: they want a comprehensive checklist that any adequate slur theory must satisfy, with each requirement grounded in specific linguistic phenomena. The ten cases they listed are particularly challenging because they stretch existing theories to breaking point - like historical slurs whose origins are forgotten (#1), or spontaneous derogatory coinages (#2). 

  I notice the user emphasizes real-world messiness: slurs crossing language barriers (#3), terms without neutral alternatives (#4), and non-lexical hostility (#9). This suggests they prioritize empirical coverage over theoretical elegance. They're also acutely aware of contextual nuances - how offense persists in embeddings (#6) but varies between in-group/out-group usage (#7). 

  The normative-predictive tension feels central here. Most theories sacrifice one for the other. For instance, truth-conditional approaches handle embedding data (#6) well but stumble over reclaimed uses (#7), while pragmatic theories explain contextual variation but struggle with spontaneous coinages (#2). 

  I'll organize the desiderata by their two core "jobs": 
  For predictive adequacy, I'll focus on linguistic patterns (#1-5,8-10) requiring theories to account for etymology, productivity, cross-linguistic variation, and gradability. 
  For normative adequacy, I'll center on usage contexts (#6-7,9) demanding explanations of offense modulation and reclamation. 

  The real challenge comes in reconciling these. Phenomenon #3 (borrowed slurs) alone sinks many theories - if offense resides in lexical content, why does it disappear in another language? If it's about speaker intention, why does the origin-community hearer still feel harmed? This might require separating semantic and sociolinguistic components. 

  I suspect the deepest conflict lies between desideratum #6 (embedding resilience) and #7 (reclamation). The former suggests offense is hardwired, the latter that it's malleable. This could force us to either: 
  - Treat them as separate phenomena needing distinct explanations, or 
  - Propose a multidimensional theory where different mechanisms handle embedding vs reclamation. 

  Before scoring theories, I should flag which distinctions are crucial: 
  - Slurs vs other pejoratives (e.g., "idiot" lacks group-targeting) 
  - Conventional meaning vs use-prohibitions 
  - Offense (psychological harm) vs wrongness (moral violation) 

  The table will reveal that conventional implicature theories score best on embedding (#6) but worst on reclamation (#7), while prohibition-based approaches show the inverse pattern. A decisive test case might be desideratum #2 (spontaneous slurs): if a newly coined term can immediately function as a slur without conventionalization, that undermines both semantic and prohibition-based views. 

  Ultimately, the user seems to want permission to abandon the quest for a unified theory. I'll explicitly recommend decoupling predictive and normative jobs, with prohibition-based norms handling wrongness and pragmatic mechanisms explaining offense variation.
answer: |-
  Here is a desiderata list for a theory of slurs, structured by your requirements, with motivations, non-negotiability flags, key distinctions, and an assessment of feasibility. The framework prioritizes empirical coverage and integrates sociolinguistic reality.

  ---

  ### **Core Desiderata for an Adequate Theory of Slurs**
  **Purpose:** Simultaneously predict slur-status/offense gradation (Predictive Job) *and* explain normative wrongness/appropriate response per utterance (Normative Job). If incompatible, **abandon the Normative Job as a unified theoretical goal**; it requires contextual/moral particulars beyond linguistic theory. A predictive theory should focus on conventionalized patterns of offense-potential relative to speaker/hearer identities and contexts.

  ---

  ### **I. Predictive Job Desiderata** (Must identify slurs, target groups, offense gradation)
  1.  **Historical Oblivion**  
      *Case:* An ethnic term (e.g., "Gypsy" for Roma) originated as a slur, but no living speaker (including in-group) knows this.  
      *Requirement:* The theory must not make historical origin necessary *or* sufficient for current slur-status.  
      *Status:* **Non-negotiable.** Motivated by diachronic linguistics/semantic drift.  
      *Distinction:* Type-level conventional meaning ≠ token-level historical fact.

  2.  **Spontaneous Derogation**  
      *Case:* A speaker coins a group-directed derogatory expression on the spot (e.g., adding "-tard" to a group label, mocking accent).  
      *Requirement:* Must explain how novel forms can be *immediately* recognized as slurs without prior convention.  
      *Status:* **Non-negotiable.** Motivated by linguistic productivity and pragmatic inference.  
      *Distinction:* Slur-*formation* (morpho-pragmatic) vs. slur-*convention*.

  3.  **Cross-Linguistic Borrowing & Divergent Uptake**  
      *Case:* A slur (e.g., "nigga" in US English) borrowed into another language (e.g., Japanese rap) as neutral/affectionate, causing divergent interpretations when overheard.  
      *Requirement:* Must account for how slur-status depends on *speaker/hearer community norms*, not just lexical item.  
      *Status:* **Non-negotiable.** Motivated by sociolinguistics of globalization.  
      *Distinction:* Community of practice (CoP) conventions > universal semantics.

  4.  **Lack of Neutral Counterpart**  
      *Case:* The slur is the only common term (e.g., "untouchable" for Dalits; historic use of "queer" before reclamation).  
      *Requirement:* Must not presuppose a neutral counterpart. Predict offense despite absence of alternative.  
      *Status:* **Non-negotiable.** Motivated by lexical gaps and political silencing.  
      *Distinction:* Reference-fixing ≠ existence of neutral label.

  5.  **Mismatched Reference & Taxonomy**  
      *Case:* Slur applied to non-group-member (e.g., "f*g" used for a straight man) or based on false taxonomy (e.g., racial slurs assuming biological race).  
      *Requirement:* Must explain offense even when reference/taxonomy fails.  
      *Status:* **Non-negotiable.** Motivated by harmful speech acts targeting perceived identity.  
      *Distinction:* Speaker’s *intended target group* ≠ actual referent.

  8.  **Semantic Bleaching & Offense Transfer**  
      *Case:* Successor terms acquire offense (e.g., "retarded" → "special needs" → "differently abled"); slurs becoming generic insults (e.g., "bitch").  
      *Requirement:* Must model offense as transferable across terms and detachable from group-specificity.  
      *Status:* **Non-negotiable.** Motivated by euphemism treadmill studies.  
      *Distinction:* Offense-potential ≠ immutable semantic content.

  9.  **Non-Lexical Hostility**  
      *Case:* Contempt conveyed via pronoun misuse ("it" for a person), mocking prosody, or gesture alone.  
      *Requirement:* Must extend to non-lexical expressions targeting groups.  
      *Status:* **Preference** (for comprehensive theories) but high-priority. Motivated by multimodal communication.  
      *Distinction:* Slurs as a *functional category* (group-directed contempt) > lexical category.

  10. **Voluntary/Dominant/Non-Ethnic Targets**  
      *Case:* Slurs for cops ("pig"), rich people ("trustafarian"), or regions ("redneck").  
      *Requirement:* Must not exclude non-immutable, dominant, or non-ethnic groups.  
      *Status:* **Non-negotiable.** Motivated by cross-category derogation.  
      *Distinction:* Immutability ≠ necessary for slurhood.

  ---

  ### **II. Normative Job Desiderata** (Must explain wrongness, permissibility, response)
  6.  **Embedding Attenuation**  
      *Case:* Slur in negation, conditionals, quotes, linguistics lectures – offense persists but varies.  
      *Requirement:* Must explain why offense *attenuates* without disappearing in non-assertoric contexts.  
      *Status:* **Non-negotiable.** Motivated by philosophy of language (Frege-Geach).  
      *Distinction:* Semantic encoding ≠ cancellable implicature.

  7.  **In-Group Reclamation & Asymmetry**  
      *Case:* In-group use as endearment (e.g., "queer" in LGBTQ+ contexts); out-group prohibition even in quotes.  
      *Requirement:* Must explain asymmetric permissibility and organic reclamation.  
      *Status:* **Non-negotiable.** Motivated by sociolinguistics of reclamation.  
      *Distinction:* Speaker identity CoP membership > semantic content.

  ---

  ### **III. Key Distinctions & Sociolinguistic Constraints**
  - **Must Respect:**  
    - Slur (group-targeted, identity-based) vs. **pejorative** (property-based, e.g., "idiot") vs. **profanity** (taboo, e.g., "fuck").  
    - **Targeting** (illocutionary act) vs. **referring** (semantic act).  
    - **Offense** (psychological harm) vs. **wrongness** (moral violation).  
    - **Conventional meaning** (e.g., CI) vs. **use-prohibition** (norm-based).  
    - **Binary** (slur/non-slur) vs. **graded** offense (e.g., "cripple" vs. "spaz").  
  - **Sociolinguistic Non-Contradictions:**  
    - Offense correlates with power asymmetry (slurs targeting oppressed groups are typically stronger).  
    - Reclamation is speaker-community-specific and never universal.  
    - Offense is defeasible but not cancellable by disclaimers ("I'm not racist, but...").

  ---

  ### **IV. Tensions & Feasibility**
  **Fundamental Conflict:** The **Predictive Job** requires offense-potential to be *conventional* and *community-relative* (Desiderata 3,7,9). The **Normative Job** requires wrongness to be *non-conventional* and *moral* (e.g., why in-group use isn't "wrong"). No unified theory can capture both without circularity or overgeneralization.  
  - **Solution:** Surrender the **Normative Job** as a *core linguistic task*. Predictive theories should output *offense-potential profiles* (e.g., "Term X in Community Y has offense score Z for out-group speakers, W for in-group"). Normative wrongness is a separate ethical inquiry.  

  **Most Damaging Desideratum for Existing Theories: #2 (Spontaneous Derogation).**  
  - Eliminates truth-conditional/CI theories (require conventional meaning).  
  - Strains prohibition theories (no prior prohibition for novel terms).  
  - Favors pragmatic/inferential accounts.  

  ---

  ### **V. Theory Scoring Table**
  | **Theory Type**              | **Predictive Job** (#1,2,3,4,5,8,9,10) | **Normative Job** (#6,7) | **Overall Feasibility** |
  |------------------------------|----------------------------------------|--------------------------|-------------------------|
  | **Truth-Conditional**        | ❌ (Fails #2,3,5,8)                    | ⚠️ (Handles #6, ignores #7) | Poor                   |
  | **Conventional Implicature** | ❌ (Fails #2,3,8)                      | ✅ (Handles #6)            | Weak                   |
  | **Pragmatic (Inferential)**  | ✅ (Best for #2,3,5,9,10)              | ⚠️ (Struggles with #6)     | **Strongest Predictive** |
  | **Use-Prohibition**          | ⚠️ (Handles #1,4,7; fails #2,3,8)      | ✅ (Handles #7)            | **Strongest Normative** |

  **Decisive Observations:**  
  1. **Spontaneous Derogation (#2):** If a novel term (e.g., "tech-bro" + sneering tone) is immediately recognized as a slur, it falsifies conventionalist (TC/CI) theories.  
  2. **Embedding (#6) vs. Reclamation (#7):** If in-group quoted use ("Some call us X, but...") is non-offensive to in-group but offensive to out-group, it falsifies semantic (TC/CI) and monolithic prohibition theories.  

  **Recommendation:** Pursue a **hybrid pragmatic-prohibition model**.  
  - **Predictive Core:** Offense-potential arises from *inferential hostility* (intent + recognizable group-targeting) + *conventional reinforcement*.  
  - **Normative Addendum:** Wrongness stems from *contextual norm-violations* (e.g., out-group use) but is not part of the linguistic theory proper.  

  This satisfies all Predictive desiderata while acknowledging the Normative Job as a distinct project.
