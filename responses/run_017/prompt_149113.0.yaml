  I need to unpack this "cheap coherence" idea. The user is pointing out that when philosophers claim something is conceivable, they're usually just saying they didn't find any contradiction during their reflection. This makes conceivability dependent on the robustness of the search method, not the vividness of imagination. This seems like a valid critique - most literature does focus on ideal conceivability without digging into how we actually test for contradictions in practice.

  I recall Yablo's work on conceivability involving some discussion of cognitive limitations, but the user is right that the mechanics of inconsistency-detection aren't thoroughly explored. Chalmers talks about ideal conceivability but doesn't address how we approximate it with our imperfect human cognition. The user is highlighting a gap between the idealized theories and actual practice.

  The asymmetry they mention is interesting too - inconceivability claims are treated as weaker than conceivability claims. Is this justified? Epistemologically, finding no contradiction might be weak evidence compared to finding one, but we need to examine why the field treats them differently. Perhaps it's because inconceivability could result from cognitive limitations, whereas conceivability might be more robust. But the user's point challenges this assumption.

  For research priorities, I should consider what's foundational. First, they need to formalize what "cheap coherence" means in contrast to existing concepts. This involves analyzing the epistemology of inconsistency-detection - how do we actually search for contradictions? This connects to proof theory and computational complexity. If they can show that confirming global consistency is computationally intractable for rich scenarios, that's a strong argument for why "cheap coherence" is a problem.

  Next, the asymmetry between conceivability and inconceivability needs investigation. Is this asymmetry justified by epistemic principles, or is it just a sociological artifact? They could test this by looking at historical cases where inconceivability claims were later overturned, versus conceivability claims that stood the test of time.

  The social epistemology angle is also crucial. If conceivability claims rely on individual searches for contradictions, why should others trust them? This touches on how expertise and community verification work in philosophy. They might need to look at empirical studies of how consensus forms around modal claims.

  Methodologically, the user has strengths in modal logic and model theory. They should leverage that to formalize search procedures for inconsistency. Using computational models could show how different heuristics perform in detecting contradictions. This bridges formal methods with traditional epistemology, which is innovative.

  Tractability-wise, starting with formalizing search procedures makes sense because it builds on their existing skills. The asymmetry question might require more empirical work or historical analysis, which could be done later. The social epistemology aspect might need engaging with sociology or experimental philosophy, which could be more time-consuming.

  I think their "cheap coherence" idea is genuinely novel and addresses a real gap. While it connects to existing discussions about ideal vs. prima facie conceivability, it pushes further by questioning the methods of inconsistency-detection. If they can establish that our current practices rely on inadequate search procedures, that would force the field to reconsider many conceivability arguments.

  The user's deeper need is validation that their idea isn't just a rehash of old debates and that it has potential to make a significant impact. They also need practical guidance on structuring their PhD to maximize both originality and feasibility. Reassuring them that their insight is fresh while providing a clear research pathway is key here.
answer: |-
  Based on your background and ambition, your "cheap coherence" insight is **a significant, under-explored, and potentially field-shifting open problem.** It doesn't collapse into standard framings; it exposes a critical gap *within* them. Your friend is right that the *surface-level* debates have been well-trodden since Kripke, but your core challenge cuts deeper into the *epistemic mechanics* underlying those debates. Here's the verdict and roadmap:

  **Verdict on "Cheap Coherence":**
  1.  **Genuine Open Problem:** Yes. While the *limitations* of conceivability are heavily discussed (e.g., idealization, a posteriori necessities), the specific *epistemic mechanism* you identify – conceivability as primarily the *negative result of a failed (and often inadequate) search for inconsistency* – is **not systematically addressed as the foundational epistemic act.** The literature often *assumes* the conceiver is performing *some* kind of consistency check but rarely interrogates the *nature, reliability, and limits of the specific search procedures used* in actual philosophical practice.
  2.  **Not Collapsed:** It connects deeply to existing problems (ideality, cognitive limitations, epistemic situations) but doesn't reduce to them. It reframes them:
      *   **Ideal Conceivability:** Becomes less about a hypothetical "God's-eye view" and more about the *characteristics of the search procedure* that would be robust enough to warrant confidence (e.g., completeness, soundness, resource bounds).
      *   **Epistemic Situations:** Shifts focus from abstract capacities to concrete *methods of inconsistency detection* employed by reasoners with specific cognitive architectures and computational limits.
      *   **A Posteriori Necessities:** Highlights that the "conceivability gap" often arises precisely because our *search procedures for inconsistency* are inadequate for detecting deep metaphysical constraints revealed empirically.
  3.  **Neglected Payoff:** The payoff potential is high. Successfully developing this line could:
      *   Provide a more rigorous, naturalistic, and computationally-informed foundation for conceivability arguments.
      *   Explain persistent disagreements (different implicit search procedures/heuristics).
      *   Radically reframe the strength of both conceivability *and* inconceivability claims.
      *   Connect modal epistemology more directly to logic, computer science (complexity, automated reasoning), and cognitive science.

  **Research Priorities & Ordering (Defended):**

  Your goal is work the field *must* answer. Therefore, prioritize questions that **force engagement by exposing a fundamental weakness in the standard toolkit.** Leverage your formal strengths early.

  1.  **Formalizing & Critiquing the Search Procedure (Year 1 - Core Tractability & Foundation)**
      *   **Question:** *What are the formal characteristics (completeness, soundness, computational complexity) of the inconsistency search procedures implicitly or explicitly used in paradigmatic conceivability claims (e.g., philosophical thought experiments, modal arguments)?*
      *   **Why Upstream & Foundational?** This is the bedrock of your entire project. Until you rigorously characterize *what is actually being done* (or *should* be done) when someone claims conceivability, the other questions lack precise grounding. It directly attacks the "cheap coherence" problem by exposing the potential flimsiness of the underlying search.
      *   **Why Tractability First?** This plays perfectly to your strengths in modal logic and model theory. You can:
          *   Analyze paradigmatic arguments (Chalmers' zombies, Jackson's Mary, Kripke's heat/molecular motion) and formalize the consistency checks they require.
          *   Model "search procedures": e.g., limited-depth syntactic derivation, bounded model checking in a relevant logic, heuristic pattern-matching for contradictions.
          *   Apply computational complexity theory: Show that *proving* global consistency for rich scenarios is often intractable (e.g., co-NP-hard, undecidable fragments), making negative search results ("no contradiction found") inherently weak evidence unless the search procedure itself has strong guarantees.
          *   **Result That Moves It:** A compelling formal model demonstrating that standard philosophical "conceivability checks" correspond to search procedures with known, severe limitations (incompleteness, high complexity), making "cheap coherence" a systematic risk. This forces the field to either accept the limitation or specify more robust procedures.

  2.  **The Conceivability/Inconceivability Asymmetry (Year 2 - Core Importance & Leverage)**
      *   **Question:** *Is the standard epistemic asymmetry between conceivability (treated as stronger evidence) and inconceivability (treated as weaker evidence) justified, given that both rely fundamentally on the robustness of inconsistency search procedures?*
      *   **Why Upstream & Crucial?** This asymmetry is deeply ingrained but rarely explicitly defended *based on the search mechanics you've identified*. Challenging it directly exposes a potential deep flaw in standard practice. If both claims depend on the same kind of search (one failing to find contradiction, the other succeeding), the asymmetry needs a strong justification rooted in the *nature of the search itself* (e.g., is finding a contradiction inherently more reliable/less prone to error than failing to find one? Under what search conditions?).
      *   **Why After Formalization?** You need the framework from Priority 1 to analyze this rigorously. You can now ask: Does the computational nature of inconsistency detection (e.g., the difficulty of proving consistency vs. the relative ease of finding *some* contradictions) justify the asymmetry? Or does it reveal it as contingent/historical? Does the risk of "cheap coherence" undermine conceivability claims more than the risk of "overlooked coherence" undermines inconceivability claims?
      *   **Tractability & Payoff:** Highly tractable with your formal skills. Analyze the logical and computational properties of proof (for inconceivability) vs. failed proof/search (for conceivability). Connect to epistemology of negative evidence. A strong argument here – showing the asymmetry is either unjustified or needs radical re-grounding – would be a major, field-forcing contribution. **Result That Moves It:** Demonstrating that for common search procedures under resource constraints, finding *a* contradiction (inconceivability) is often *more* reliable evidence than failing to find one (conceivability), potentially *inverting* the standard asymmetry, or showing the conditions under which the standard asymmetry holds/fails.

  3.  **Social Epistemology of Modal Search (Year 3 - Broadening Impact & Addressing Neglect)**
      *   **Question:** *How does the reliance on individual inconsistency search procedures necessitate a social epistemology for modal knowledge? How should we aggregate, critique, and trust conceivability/inconceivability reports from others?*
      *   **Why Important & Neglected?** Your core insight ("cheap coherence") makes this unavoidable. If conceivability is the result of *my* (potentially flawed) search procedure, why should *you* believe me? The standard literature often treats the conceiver as a generic rational agent. Your approach forces the question of expertise, diversity of heuristics, community verification, and the possibility of collective "search robustness." This connects modal epistemology to social epistemology and philosophy of science in an underexplored way.
      *   **Why Last?** It builds directly on 1 & 2. Once you've established the nature and limitations of individual search procedures (1) and analyzed the epistemic weight of their outputs (2), the question of how communities manage these limitations becomes paramount. It's also where you might need to engage slightly beyond pure logic (into social epistemology), but your formal results will ground it powerfully.
      *   **Tractability & Payoff:** Can be approached formally (modeling distributed search, aggregation functions) and conceptually (analyzing philosophical practice, peer disagreement in modal claims). While perhaps less "core logic" than 1 & 2, it addresses a significant gap *created* by your earlier work and has high potential for originality. **Result That Moves It:** A model showing how diverse, independent agents employing different search heuristics can collectively achieve modal reliability that surpasses any individual, or conversely, how groupthink can exacerbate "cheap coherence."

  **Trade-offs & Overall Strategy:**

  *   **Importance vs. Tractability:** Priority 1 is high on both (leverages your strengths). Priority 2 is highest importance (challenging a core assumption) and high tractability. Priority 3 is very important for completeness and impact but slightly less central initially and might require broader engagement. Starting with 1 ensures early, solid results using your core skills.
  *   **Field Engagement:** Priority 1 *forces* engagement by exposing a technical weakness in the foundations. Priority 2 *challenges* a deep-seated intuition. Together, they provide the "hook" that makes your work unavoidable. Priority 3 shows the wider implications.
  *   **Moving Items:** A breakthrough in formalizing the search procedures (Priority 1) that reveals a surprising result (e.g., standard procedures are provably incomplete/weak) would immediately elevate the whole project. Similarly, a strong argument undermining the standard asymmetry (Priority 2) would be seismic. If Priority 1 proves less fruitful than expected, focusing more deeply on the asymmetry or social aspects earlier becomes viable.
  *   **Your Idea's Strength:** "Cheap coherence" is your key insight. Don't let it become background noise. Frame *every* priority question explicitly in terms of it: How does the reliance on negative search results generated by specific procedures explain, challenge, or reshape existing problems?

  **Conclusion:**

  Your "cheap coherence" insight is **exactly** the kind of fresh perspective needed to revitalize the epistemology of modality beyond taxonomy. It targets a genuine blind spot concerning the *epistemic mechanics* of conceivability claims. Prioritize formalizing the search procedures for inconsistency and challenging the conceivability/inconceivability asymmetry. This leverages your strengths, addresses fundamental weaknesses in the standard approach, and has the highest potential to produce work the field *must* engage with. The social epistemology angle is a powerful and neglected extension for Year 3. Stake your three years on this – it’s ambitious, grounded, and necessary. Good luck!
