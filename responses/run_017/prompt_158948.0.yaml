  Below is a constructed case that meets your specifications. I'll present it step by step, as requested, using a clear, jargon-free approach suitable for a general reader. The case centers on a fictional novel passage and hinges on a real-world shift that occurred during a publishing delay. The divergence arises solely from the gap between manuscript completion and publication, with no authorial failure.

  ### The Passage
  > *Helen stood at the window, watching the empty street. A single van was parked outside the bakery, its engine idling. The driver sat motionless, staring straight ahead, as if waiting for a signal only he could hear. The air felt heavy, charged with an unnatural stillness. She thought of the word "containment" — a concept she'd always associated with safety, but now it felt like a lid clamped tight over a boiling pot. Nothing moved, nothing breathed; it was as if the whole world were holding itself in, bracing for an eruption it couldn't name.*

  ### Stipulated Facts
  - **Timeline**: The author completed the manuscript in **March 2020**. Due to a publisher's shelving (the imprint folded, and the book was delayed while acquiring a new publisher), it was not published until **September 2020**.
  - **World Events**: In **April 2020**, a global pandemic was officially declared, leading to widespread lockdowns. Terms like "containment," "quarantine," and imagery of empty streets, idling delivery vehicles, and societal tension became ubiquitous in news and public discourse. By September 2020, these concepts were central to daily life.
  - **Author's Intention**: When writing in March 2020, the author intended the passage to depict Helen's anxiety about a *personal* crisis: her fear of an impending divorce. "Containment" was meant as a metaphor for emotional suppression (the "boiling pot" being her unresolved anger). The van and stillness symbolized her feeling of being trapped in a stagnant marriage. The author had no knowledge of the impending pandemic; the passage was purely character-driven.
  - **Public Record at Publication**: By September 2020, reviews and readers immediately interpreted the passage as a commentary on pandemic lockdowns. Critics praised its "prescient" depiction of quarantine life, and the word "containment" was widely read as a direct reference to public health measures. The public record included news of the pandemic but no private author statements (e.g., no interviews clarifying intent).
  - **Language Stability**: The words' conventional meanings did not change between March and September 2020. "Containment" still meant "the action of keeping something under control," and descriptions of empty streets or idling vehicles remained literal. No new slang or definitions emerged.

  ### View-by-View Verdicts and Reasoning
  Each verdict is generated by the view's own criterion, not stipulated outcomes.

  - **(A) Actual Intentionalism**:  
    **Verdict**: The passage means Helen is experiencing personal dread about her marriage, with "containment" symbolizing emotional repression.  
    **Reasoning**: The author successfully executed her intention in March 2020. At that time, the words clearly expressed a character's inner turmoil to contemporary readers: "containment" as a metaphor for suppressed feelings, the van as a symbol of stasis, and the stillness as buildup to a personal "eruption" (divorce). The language and conventions of March 2020 supported this reading, with no pandemic context to alter it. The intention was fully realized in the text for its original audience.

  - **(B) Hypothetical Intentionalism**:  
    **Verdict**: The passage means Helen is reacting to societal lockdowns, with "containment" referring to pandemic-related restrictions.  
    **Reasoning**: An ideal reader in September 2020, armed with the full public record (the pandemic declaration, lockdowns, and media focus on "containment" as a public health term), would reasonably hypothesize the author intended a pandemic allusion. The text's details—empty streets, an idling "delivery-like" van, and "containment" feeling like a "clamped lid"—align perfectly with the pandemic experience. Given the dominance of this event at publication, it is the most plausible hypothesis for authorial intent, as the passage seems too specific to be coincidental.

  - **(C) Conventionalism**:  
    **Verdict**: The passage means Helen observes a quiet street with a parked van and feels a sense of impending, abstract tension, with "containment" denoting general suppression.  
    **Reasoning**: The words, read by conventions of English in their textual context (a novel about personal relationships), convey a literal scene: empty street, idling vehicle, stillness. "Containment" is a common metaphor for control or restriction (e.g., emotional or environmental), and the "eruption" is a standard idiom for release. Authorial intent is irrelevant; the text alone, using stable language rules of 2020, supports this general, non-specific reading.

  ### Agreement, Divergence, and the Key Feature
  - **(A) and (C) agree**: Both see the passage as describing personal anxiety and abstract tension. (A) gets there via authorial intent, (C) via linguistic conventions. Neither references the pandemic.
  - **(B) diverges**: It attributes pandemic intent to the author due to the altered public context.  
  - **Key feature doing the work**: The pandemic's emergence during the publishing gap. It reshaped what an ideal reader would reasonably attribute to the author without changing word meanings.  
  - **If the feature is removed (no pandemic)**: (B) aligns with (A) and (C). The ideal reader in September 2020, lacking pandemic context, would see the passage as a character study. All views converge on personal crisis.

  ### Best Defense for (B) and Its Viability
  - **Defense**: A defender of (B) might argue: "Hypothetical intentionalism is not about truth but reasonableness based on public evidence at publication. In September 2020, the pandemic was the dominant lens for interpreting such imagery, making the hypothesis of pandemic intent objectively reasonable. The fact that the author didn't intend it is irrelevant to (B)'s criterion—this view intentionally ignores private intent."  
  - **Can they say this without altering (B)?**: Yes. (B) is defined by public evidence at publication, so this defense is consistent. However, it doesn't "stop the case from counting"—it openly admits (B) can produce "false" attributions due to world shifts. The case stands as a legitimate divergence.

  ### Temporal Slice for (A) and Why It's Correct
  - **Slice relied on**: The author's intention at the **moment of writing (March 2020)**.  
  - **Why this slice?**: (A) requires the intention to be successfully executed in the language for readers at the time of writing. Here, the March 2020 intention was fully realizable then: readers could grasp the marital metaphor without confusion. Intentions at later stages (proofs or reissue) are irrelevant—the text was fixed at writing, and the author made no changes. Using any other slice (e.g., avowed intent at reissue) would undermine (A)'s core by allowing external events to distort the original creative act.

  ### The Case at Reissue (30 Years Later)
  - **Public record now includes**: The 2020 pandemic, original reviews (which cited pandemic symbolism), decades of reader interpretations (many assuming pandemic intent), and the author's past statements (e.g., this reissue note clarifying intent).
  - **(A)**: Unchanged. Still relies on March 2020 intent, which is now clarified in the author's note.
  - **(B)**: Shifts. An ideal reader at reissue, with full public record (including the author's denial of pandemic intent), would no longer reasonably hypothesize that intent. Instead, they might see the passage as coincidentally resonant or interpret it as a dual metaphor (personal and societal). However, (B) could still argue that the meaning *at publication* was pandemic-focused, as views are often time-indexed.
  - **(C)**: Unchanged. The words' conventional meaning in 2020 remains stable; it still depicts abstract tension.
  - **Outcome**: (B) now likely converges with (A) and (C) if the author's note is public, but the historical publication-era meaning remains a point of reference. The divergence persists as a artifact of 2020.

  ### The One-Sentence Author's Note
  > "Written before the pandemic, this passage reflected Helen's fear of her marriage collapsing, not a commentary on global events."  

  This sentence is true, exact, and non-conciliatory. It acknowledges the shift without apology, directly addresses the misreading, and anchors the passage in your original intent. It works for a general reader by avoiding jargon and focusing on the key issue: time and intent.
