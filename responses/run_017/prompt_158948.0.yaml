  We are to construct a case for a novelist who needs to explain in an author's note how a passage in her book, written with one intention, came to be read differently upon publication due to events in the world that occurred between finishing the manuscript and the book's release.

  The case must meet the following specifications:
  - (A) Actual intentionalism: meaning is what the author intended and successfully executed at the time of writing (for the readers then, with the language then).
  - (B) Hypothetical intentionalism: meaning is what an ideal reader at the time of publication would reasonably hypothesize the author intended, based on the text and publicly available information at publication.
  - (C) Conventionalism: meaning is determined solely by the words and the linguistic conventions at the time of writing (and the textual context), without regard to authorial intention.

  We require that (A) and (C) agree on the meaning, but (B) diverges. The divergence must arise from the gap between finishing the book and its publication (e.g., a delay in publishing, a shelved list, a change of imprint). The author must not be at fault (no failure of craft). The conventional meaning (C) must be stable, but the world changes so that what it is reasonable to attribute to the author (B) changes.

  Constraints:
  1. Divergence due to the publishing gap (no private keys, etc.)
  2. No failure of craft: the author's intention is successfully executed at the time of writing.
  3. (B) gets the full public record at the time of publication.
  4. The shift is in the world, not the words: the sentence's conventional meaning is stable.
  5. The passage must be determinate under each view (no ambiguity).
  6. Ordinary prose fiction, one paragraph, no genre tropes, no invented languages, no real names, nothing obscure.

  We will design a case where the author writes a passage that, at the time of writing, is a straightforward description of a character's actions. But during the publishing gap, a major public event occurs that makes the same words, when read at publication, seem to be a clear allusion to that event. The hypothetical intentionalist (B) would then reasonably (but mistakenly) attribute to the author an intention to allude to that event, while the actual intentionalist (A) and conventionalist (C) stick to the original meaning.

  Let me construct the case.

  **Passage (from a novel):**

  > "He walked through the city with a sense of dread. The streets were quiet, too quiet, as if the whole place were holding its breath. He passed a newsstand, its papers flapping in the wind like trapped birds. The headlines screamed of distant disasters, but here, nothing moved. Even the pigeons seemed to have fled. He thought: it's like the calm before the storm, but what storm? And then he saw it: a single, dark cloud gathering on the horizon, small yet menacing, the only blemish in an otherwise clear sky."

  **Stipulated Facts:**

  1. The author finished the manuscript in January. The novel was scheduled for release in April. However, due to production delays, the book was not published until September of the same year.

  2. In March, a catastrophic and unprecedented event occurred: a massive hurricane (let's call it Hurricane X) struck a major city (not the one in the book) and became a global news phenomenon. The hurricane was notable for being both unexpected (in that location) and devastating. It was the dominant news story for weeks and remained in public consciousness at the time of the book's publication.

  3. The passage was written in January, months before the hurricane. The author had no knowledge of the impending hurricane and did not intend any reference to it. The passage was intended as a straightforward description of a character's state of mind and the setting, using a common metaphor ("calm before the storm") and a literal dark cloud to build tension.

  4. The author's intention was to depict the character's anxiety and the ominous atmosphere of the city. The dark cloud was intended as a literal detail and a symbol of impending trouble, but the trouble was meant to be personal (related to the character's own story) and not a natural disaster.

  5. At the time of writing (January), the conventional meaning of the words was clear: a description of a quiet city, the character's feeling of dread, and a literal dark cloud. The metaphor "calm before the storm" was a common idiom.

  6. When the book was published in September, the hurricane was fresh in the public mind. Reviews and readers immediately seized on the passage as a powerful allusion to the hurricane. Critics praised the author for capturing the pre-hurricane tension and for the prescience of the dark cloud image.

  Now, we apply the three views:

  **(A) Actual intentionalism:**

  - Verdict: The passage means what the author intended at the time of writing (January). The author intended to depict the character's anxiety and a sense of impending trouble (personal in nature) using a common metaphor and a literal dark cloud. There was no intention to refer to a hurricane, and the author had no knowledge of the future hurricane.

  - Reasoning: The author's intention was successfully executed in January: the words chosen (including the metaphor and the cloud) were capable of expressing that intended meaning to readers at that time. The language and conventions of the time supported that meaning.

  **(B) Hypothetical intentionalism:**

  - Verdict: The passage means what an appropriately informed ideal reader at the time of publication (September) would most reasonably hypothesize the author intended. This reader knows the text and the public context at publication, including the recent hurricane. The ideal reader would reasonably hypothesize that the author intended to allude to the hurricane, given the timing and the striking resemblance between the passage and the public perception of the pre-hurricane atmosphere.

  - Reasoning: The passage's description of the quiet city, the sense of dread, the flapping papers (like trapped birds, which could evoke storm imagery), and the dark cloud on the horizon are all details that, in September, would inevitably evoke the hurricane. The public context is dominated by the hurricane, and the passage seems too coincidental not to be intentional. Therefore, the ideal reader attributes to the author the intention to allude to the hurricane.

  **(C) Conventionalism:**

  - Verdict: The passage means what the words, in their textual context, conventionally meant at the time the text was written (January). The words describe a character's experience of a quiet city, his feeling of dread, and the sighting of a dark cloud. The metaphor "calm before the storm" is a common idiom for anticipating trouble. The passage does not refer to any specific event (like a hurricane) because at the time of writing, there was no such public event to which it could conventionally refer.

  - Reasoning: The conventional meaning of the words and the idiom is stable and does not change with external events. The text does not contain any direct reference to a hurricane or any specific disaster. Therefore, the meaning is the literal description of the scene and the character's thoughts.

  **Agreement and Divergence:**

  - (A) and (C) agree: both see the passage as a description of an ominous atmosphere and a literal dark cloud, with no reference to a hurricane.

  - (B) diverges: it attributes to the author an intention to allude to the hurricane, making the passage about that event.

  **The feature doing the work:**

  The key feature is the change in the public context between writing and publication. The occurrence of a major, highly publicized event (the hurricane) during the publishing gap makes it reasonable, at publication, to attribute an intention to the author that she did not have.

  **What if we remove that feature?**

  If there had been no hurricane (or any such event) between writing and publication, then (B) would have no reason to attribute an intention to refer to a hurricane. The ideal reader in September would have the same public context as in January (regarding hurricanes) and would interpret the passage as (A) and (C) do. The divergence disappears.

  **Best defense for (B):**

  A defender of (B) might argue: "The hypothetical intentionalist view is not about the author's actual intention but about the best hypothesis given the public evidence. In this case, the public evidence at publication overwhelmingly supports the hypothesis of an intentional allusion. Therefore, (B) is doing exactly what it should. The fact that the author did not actually intend the allusion is irrelevant to (B)."

  However, note that the defender must accept that (B) can attribute an intention that the author did not have, which is the point of the case. The defender cannot alter the view to avoid this without violating the core of (B). They might try to argue that the passage is ambiguous and that the ideal reader should consider the possibility of coincidence, but the case is set up to be determinate: the passage is not ambiguous at publication because the public event is so dominant. The defender might also note that (B) is time-indexed to publication, so it is correct for its time. The author's note at reissue can then clarify the actual intention.

  **Which temporal slice for (A)?**

  (A) relies on the author's intention at the moment of writing (January). Why? Because (A) requires that the intention be successfully executed in the language at the time of writing. The author's later intentions (at proofs or reissue) are irrelevant. In fact, if the author had changed her intention during proofing (which she didn't), that might be a different case. But here, the intention at writing is the one that counts because that is when the text was fixed. The author did not revise the passage after the hurricane occurred because the proofs were already done (or she chose not to change it). So, the text is a product of the January intention.

  **The case at reissue (30 years later):**

  At reissue, the public record includes:
  - The original publication context (the hurricane and the initial reception).
  - Three decades of readings, including the common interpretation that the passage alludes to the hurricane.
  - The author's previous statements (if any) about her intention.

  For (B) at reissue: The hypothetical intentionalist view now must consider the entire public record, including the author's note (if published in the reissue) and any prior statements. The ideal reader at reissue would know that the author has denied intending the allusion and that the passage was written before the hurricane. Therefore, the ideal reader would no longer attribute the intention to allude to the hurricane. Instead, they might see the passage as a coincidence or as having taken on new meaning. But note: (B) is typically indexed to the time of publication. However, if we are to consider (B) at reissue, we might need a time-indexed view. Alternatively, the hypothetical intentionalist might say that the meaning at the time of publication is fixed, but that is not the question for the reissue. For the reissue, the public record now includes the history of reception and the author's statements. So the best hypothesis might be that the author did not intend the allusion, but the passage has become associated with the hurricane.

  However, the question is about the meaning of the passage. Hypothetical intentionalism might still say that the meaning at the time of publication was the hurricane allusion, but that now, with more information, we see it differently? This is complex. Alternatively, some versions of hypothetical intentionalism might be time-sensitive, meaning that the meaning is fixed at publication. But the author's note in the reissue is addressing the passage as published, so we might say that (B) at the time of publication gave the hurricane meaning, but that the author's note is setting the record straight.

  For (A) and (C): They remain the same. (A) still relies on the original intention, and (C) on the conventional meaning at writing.

  **The one sentence for the author's note:**

  "Written months before the event, the passage was intended only to convey the character's personal foreboding, not to allude to the hurricane that would later occur."

  But let's make it a bit more elegant and precise:

  "Composed before the event, this passage reflects the character's inner turmoil and the story's gathering tension, not an intention to reference the hurricane that would dominate the news months later."

  Now, to fit the case we constructed:

  **Final Case Summary:**

  - Passage: as above.
  - Stipulated facts: manuscript finished in January; hurricane occurs in March; book published in September; author had no knowledge and no intention to reference the hurricane.
  - (A) and (C): passage means a description of the character's anxiety and a literal dark cloud (no hurricane reference).
  - (B) at publication: passage means an allusion to the hurricane.
  - Feature: the hurricane event during the publishing gap.
  - (B) defender: cannot avoid the divergence without altering the view.
  - Temporal slice for (A): intention at writing (January).
  - At reissue: (B) might now, with the author's note and the historical knowledge, no longer attribute the hurricane intention, but the meaning at publication remains fixed for some. However, the author's note is setting the record straight for the actual intention.

  **The one sentence for the note:**

  "Written before the event, the passage was intended as a personal metaphor for the character's crisis, not as a reference to the hurricane that occurred months later."
