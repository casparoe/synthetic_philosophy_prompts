answer: |-
  Here is the translation, residue report, and taxonomy assessment per your specifications:

  ---

  ### 1. Translation of Illusionism and Anti-Illusionism  
  **Illusionism in Measurement Vocabulary:**  
  - **Observable:** Neural states/processes (e.g., recurrent processing, global workspace activation).  
  - **Latent Variable:** Hypothetical "phenomenal properties" (claimed by introspection).  
  - **Apparatus:** Introspective monitoring system (a feedback loop in cognitive architecture).  
  - **Channel:** Self-report mechanisms (verbal/non-verbal), attentional focus.  
  - **Systematic Error:** Evolutionary/computational constraints misrepresenting representational states *as* intrinsic qualities.  
  - **Artifact:** The sense of "raw feels" or qualia (e.g., redness of red).  
  - **Calibration Failure:** No independent standard exists to cross-check introspective reports (no "qualia meter"). All "calibration" is theory-mediated via behavioral or neural correlates, which lack phenomenal resolution.  
  - **Resolution Limits:** Introspection cannot resolve the underlying computational/neural variables; outputs are compressed summaries.  
  - **Theory-Mediated Measurement:** Claims about phenomenality are inferences from unreliable first-person data, mapped onto third-person models (e.g., IIT, GNWT).  

  *Core Claim:* The apparatus conflates its *own operational states* (e.g., attention, prediction error signals) with a latent variable ("phenomenality") that has no independent instantiation. Reports of qualia are artifacts of compressed data encoding.  

  **Anti-Illusionism (Realism) in Measurement Vocabulary:**  
  - **Observable:** First-person reports of subjective experience (e.g., "I see red").  
  - **Latent Variable:** Phenomenal properties (irreducible to neural/computational states).  
  - **Apparatus:** Introspective access (treated as a direct readout channel).  
  - **Systematic Error Rejected:** The apparatus has privileged access; its reports are *calibrated by presence*. If the system reports "pain," pain is instantiated by definition (no misreport).  
  - **Calibration Argument:** Independent standards exist via intersubjective agreement (e.g., consistent pain reports under injury). Disagreements are noise, not systematic error.  
  - **Resolution Limits Admitted:** Introspection is coarse but detects *real properties* (like a Geiger counter clicks for radiation, even if low-res).  
  - **Theory-Mediation Rejected:** Phenomenal reports are *primary data*, not inferences. Third-person models are underdetermined without them.  

  *Core Resistance:* The apparatus’s output ("what it’s like") is *caused by* and *reports* a latent variable (phenomenality) that exists independently. Denying this is like claiming a voltmeter’s reading is an "artifact" despite correlation with electrical states.  

  ---

  ### 2. Residue Report  
  **Survives Without Strain:**  
  - Systematic error in introspection.  
  - Calibration failure (no independent access).  
  - Theory-mediation of first-person reports.  
  - Reports as artifacts of processing constraints.  

  **Bent to Fit:**  
  - **"Privileged access":** Maps to a zero-error assumption in the apparatus, but clashes with evidence of introspective fallibility (e.g., change blindness).  
  - **"What it’s like":** Translates as *the operational state of the apparatus itself* (e.g., a spectrometer heating up during measurement). But this reduces it to a physical state, losing the "for-itself" aspect realists assert.  

  **Fails Translation:**  
  - **"What it is like to undergo the illusion":** This has no slot. In measurement terms, an apparatus has no "undergoing"—it has operational states (e.g., voltage levels, thermal noise). The claim that misreporting *feels like something* is either:  
    - A computational state (bent fit), or  
    - Untranslatable because your vocabulary excludes intrinsic properties *of the apparatus*.  

  ---

  ### 3. Taxonomy Assessment  
  - **Illusionism Commits to:** **Phantom reading** (apparatus emits "qualia signal" with no corresponding latent variable). Phenomenal properties are null; reports are noise.  
  - **Anti-Illusionism Asserts:** **Cross-talk reading** (real neural states mislabeled as "qualia" by the subject) or **aliasing** (high-dimensional states reduced to "qualia" outputs).  

  **Forced or Open?**  
  - Illusionism *must* claim phantom readings. If it allowed cross-talk/aliasing, phenomenal properties would exist (just misdescribed).  
  - Realist objections target **phantom readings** specifically (e.g., "Why would evolution build an apparatus that generates false positives?").  
  - Illusionist arguments support **phantom readings** by denying any physical or functional correlate maps uniquely to "phenomenality."  

  **Taxonomy Verdict:**  
  Your framework is apt. The debate reduces to:  
  - Illusionism: All phenomenal reports are **phantom readings**.  
  - Realism: Reports are **cross-talk** (misattribution) or **aliasing** (compression), but reflect real states.  

  ---

  ### 4. Verdict on the Residue  
  The untranslatable residue—**"what it is like to be the apparatus"**—is a limitation of third-person measurement vocabulary. Your framework treats consciousness as a *measured system*, but:  
  - **For illusionists**, the residue is an explanatory target: why does the phantom reading *feel authoritative*? (Answer: It’s a compressed metacognitive tag.)  
  - **For realists**, the residue is the *explanandum*: your vocabulary cannot capture intrinsic properties because it’s designed for relational observations.  

  **However**, the residue may also indicate that "phenomenal properties" are **doing less work than supposed**:  
  - Both sides agree on neural/computational correlates of reports.  
  - The dispute is whether "phenomenality" adds explanatory value beyond those correlates.  
  - Your vocabulary exposes this: if all causal/functional roles are covered by observables (neural states) and artifacts (reports), positing an extra latent variable violates parsimony.  

  **Honest Answer:** The residue reflects a *vocabulary gap for intrinsic properties*, but the debate’s persistence suggests this gap may be **ontological** (real) rather than **epistemic** (about knowledge). Yet in rigorous measurement terms, asserting an unreportable property beyond functional/computational states is indistinguishable from asserting a phantom.  

  ---  
  **Final Note:** Your measurement lens sharpens the core conflict: Is "phenomenality" a *detected latent variable* (realism) or a *self-misdescription artifact* (illusionism)? The residue—the "feel"—is either an unsupported inference or a brute fact. Your lifetime in precision measurement likely inclines you toward the former.
