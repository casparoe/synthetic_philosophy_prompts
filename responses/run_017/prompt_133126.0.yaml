prompt: |-
  Hey — hoping you can help me think through a committee thing before Thursday's meeting.

  I'm on the small curatorial committee for a permanent exhibit at a social history museum (keeping it vague on purpose) about generations. One room per cohort, birth years on the wall, artifacts, the whole bit. We've been at it for two years and I can't reverse-engineer our own decisions into a rule.

  What we've aproved:

  - Baby Boomers (1946–64). Marisol's reason, and she's the member whose reasoning has actually been consistent: sheer size. They competed with each other for school places, jobs and housing, and that competition did the causal work. She said explicitly it wasn't about shared memories.
  - Silent Generation (1928–45). Small cohort, Depression childhood, wartime scarcity, distinctive caution.
  - Gen X (1965–80). Approved narrowly: the "forgotten middle child" framing tracks something real — bad labor-market entry, latchkey childhood — and the label has been doing work in how institutions treat people for thirty years.
  - Millennials (1981–96). Approved: 9/11 and the crash landing at career entry, internet arriving in adolescence.
  - Gen Z (1997–2012 — I can never remember wether we said 1997 or 1998 for the cutoff). Approved, though Marisol worried out loud at the time that what defines them is a technology rollout rather than an event.
  - The "Wall generation": East Germans who were 14 to 18 in November 1989. Approved when a Berlin partner museum asked us to co-produce an annex. Event-defined, one country, and it overlaps the Silent/Gen X years almost completely.

  What we've rejected:

  - Xennials (1977–83): "a marketing convenience for people who can't decide." Which is odd, because if anything they have the sharpest developmental signature on the list — analog childhood, digital working life — and they do call themselves that.
  - Generation Jones (1954–65): "Boomers' little siblings with a branding problem."
  - Gen Alpha (2013 onward): turned down last spring as "a name we needed for whatever comes after Z," even though parents and marketers now use it constantly.
  - The "9/11 generation," proposed as everyone old enough to remember watching it live on TV: rejected as "an audience, not a cohort," since members ranged from about four to forty.

  Now a junior curator has proposed a room for "the Always-Onlines": everyone who got their first smartphone at or before age 12. From her packet:

  - It isn't a birth-year band. Members were born anywhere from about 1994 to 2012 depending on the country they grew up in, family income, and how early their parents adopted. Age at first phone is a continuous variable — there's a bulge around 12 or 13, no cliff.
  - No shared public event whatsoever. What they share is a technology diffusion, staggered by region and family.
  - But the survey work she attached finds a discontinuity: people who first got a smartphone at 11 or 12 differ noticeably, at the same age, from people who got one at 15, on sleep, loneliness, attention complaints and diagnosed anxiety — controlling for birth year and current age.
  - Nobody self-identifies as an Always-Onliner. She coined the term in the proposal.
  - It cross-cuts four rooms we've already built. An Always-Onliner can be a Xennial, a Millennial, a Gen Z or a Gen Alpha.

  So: what's Marisol going to say, and what should we actually do if we care about being consistent with ourselves? Which precedent is the closest analog — the Gen Z approval, the Xennials rejection, the Wall generation, or the 9/11 rejection — and does picking a different analog change the answer? If our track record genuinely doesn't settle it, I want the principle we'd be committing to spelled out honestly for both options, because I'd rather know what we're signing than just vote.

  Two more things. First, name the one further case you'd put in front of us that would really separate the rules we might be running — better to find out now than three meetings from now. Second: our demographer advisor keeps saying "a cohort is a question you ask of the data, a generation is a claim about a person." I can't tell if that's deep or a way of dodging the vote. Tell me which.

  Please answer in American English, and write it as prose I can read out loud at the meeting — a short list of the candidate rules we might be running is fine, but don't give me a report with headers.
reasoning: |-
  Okay, the user is part of a curatorial committee for a museum exhibit on generations, and they're struggling with consistency in defining generations. They've approved some generations and rejected others, and now a junior curator has proposed a new category called "Always-Onlines" based on smartphone adoption age, not birth years. 

  The user wants to anticipate how Marisol might react and figure out how to stay consistent with their past decisions. They also want a principle to guide future decisions and a test case to challenge that principle. Plus, they mentioned their demographer's quote about cohorts vs. generations.

  First, I need to analyze their approvals and rejections to find patterns. Marisol's reasoning for Baby Boomers was sheer size and competition, not shared memories. Silent Generation was about small size and shared experiences like the Depression. Gen X was approved for being a "forgotten middle child" with institutional recognition. Millennials had 9/11 and the financial crash. Gen Z was approved despite Marisol's concern about tech rollout. The Wall generation was event-defined but specific to East Germany. 

  Rejections: Xennials seen as marketing, Generation Jones as Boomer siblings, Gen Alpha as too new, and the 9/11 generation as an audience not a cohort.

  Now, the Always-Onlines proposal is different. It's not based on birth years but on age of getting a smartphone. It has data showing behavioral differences based on that age. It cross-cuts existing generations and lacks a shared event or self-identity.

  Marisol would likely reject this. She emphasized cohort size for Boomers and was wary of tech for Gen Z. This proposal is tech-focused without a clear demographic cohort. Also, it's not a birth-defined group, which most of their approvals are. The Wall generation was event-specific, but it was a political event, not tech diffusion. The 9/11 rejection was because it was an audience, not a cohort—similar here, as smartphone adoption varies by family and region.

  The closest precedent is the 9/11 rejection. Both are about shared experiences but not tied to birth years. Xennials was rejected for being a marketing term, but Always-Onlines has data, so that's different. Gen Z approval had tech concerns but still used birth years. The Wall generation is an exception due to a unique historical event.

  To be consistent, they should reject Always-Onlines because it doesn't fit the birth-year cohort model they've mostly followed. But if they want to include it, they'd need a new principle: generations can be defined by exposure to transformative technologies at key developmental stages, even without a shared demographic event.

  The user also wants a test case. "COVID Kids" would be a good one—children during the pandemic. It has a shared event but varies by age and geography. It would force the committee to decide whether shared experiences override birth cohorts.

  On the demographer's quote: "a cohort is a question you ask of the data, a generation is a claim about a person." It's deep. Cohorts are objective groupings (like birth years), while generations involve subjective claims about identity and experience. The committee's challenge is turning cohort data into generational narratives. The quote highlights that generations aren't just data; they're stories we tell about people.

  So, for the meeting, the user should present Marisol's likely rejection, the precedents, and the two principles. Then propose the COVID Kids test case and explain the demographer's insight. This will help the committee decide consciously on their framework.
answer: |-
  Here’s how I’d frame this for the committee meeting—read it straight through, pausing where it feels natural:  

  "Marisol will likely argue we should reject the 'Always-Onlines' proposal. Her reasoning? It violates the core principle she’s consistently upheld: generations must be defined by **demographic or structural forces creating a distinct cohort**, not just shared experiences. Smartphone diffusion is uneven—it’s shaped by family choices and wealth, not a societal event like the Baby Boom’s population surge or Gen X’s economic shifts. She’ll say this looks like the '9/11 generation' rejection: an *experience-based group* without a birth-year anchor, not a cohort competing for resources or shaped by the same institutional pressures.  

  But consistency isn’t simple. Let’s test against our track record:  
  - **Closest analog? The 9/11 rejection** (shared experience ≠ cohort).  
  - **Key difference from Gen Z**: We approved Gen Z *despite* tech concerns because it still had birth-year boundaries and late-stage formative events (9/11, financial crisis).  
  - **Key difference from the Wall generation**: That was a geographic/time-specific political rupture with clear edges—not a global, staggered tech rollout.  
  - **Why it’s not like Xennials**: We rejected Xennials for being ‘marketing,’ but this proposal has data showing behavioral discontinuities. That’s new.  

  So what principles *are* we running? I see two options:  
  1. **Cohort-first principle**: A generation requires a *demographic or economic cohort boundary* (birth years, population size, labor-market entry). Shared tech or experiences alone don’t count. → **Reject Always-Onlines**.  
  2. **Developmental exposure principle**: If an innovation creates measurable, lasting behavioral/cognitive differences when adopted at key life stages, it can define a generation—even without birth-year limits. → **Approve Always-Onlines**.  

  If we pick #2, we’d reverse our 9/11 rejection logic. If we pick #1, we stay consistent but ignore intriguing data.  

  **To stress-test this**, I propose one more case: **'COVID Kids'—children aged 5–11 during peak pandemic school closures**. Shared trauma? Yes. Developmental impact? Likely. But birth years span 2009–2017, crossing Millennial/Z/Alpha rooms. *This exposes the rift:* Is a global crisis with uneven access (like tech rollout) enough? Or do we demand demographic cohesion?  

  Finally, our demographer’s quote? **It’s deep, not a dodge.** 'Cohort' is objective—birth dates, school years. 'Generation' implies a *shared identity or fate*. Our exhibit turns cohort data into generational stories. But if the people don’t claim it (like 'Always-Onlines' or 'Xennials'), is it ours to name? That’s the curator’s dilemma.  

  **My advice?** If we reject Always-Onlines, cite the cohort-first principle and our 9/11 precedent. If we approve it, we must openly redefine generations around *developmental exposure to transformative forces*—acknowledging we’re shifting our rules. Either way, let’s not pretend we’ve been consistent. We haven’t."  

  ---  
  *Why this works for your meeting:*  
  - **Anticipates Marisol** (cohort size/structure purist) while surfacing tension in past votes.  
  - **Names actionable principles** (cohort-first vs. developmental exposure).  
  - **Uses COVID Kids** as the litmus test—it’s timely, crosses rooms, and lacks demographic neatness.  
  - **Decodes the demographer** by linking "cohort" (data) to "generation" (narrative/identity).  
  - **Leaves the committee** with a clear fork in the road: uphold old logic or commit to new.  

  The junior curator’s data *is* compelling—but consistency points to rejection unless you openly evolve the framework. Good luck Thursday.
