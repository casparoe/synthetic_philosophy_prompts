prompt: |-
  I'm flying out next week for a campus visit, where my job-market paper is titled "The Utility Monster Is a Unit Convention." I don't need another rehearsal of the argument; I need a Q&A prep sheet.

  The thesis, and enough of the argument for the objections to have something to bite on. The utility monster — the creature Nozick introduced in 1974, who draws enormously more welfare from each unit of a resource than anyone else, so that utilitarian aggregation appears to require feeding everyone else to it — is standardly read as an objection to the aggregative structure of utilitarianism. I argue it is instead an artifact of the *units* of interpersonal comparison. Each person's utility representation is fixed only up to positive affine transformation, u → a·u + b with a > 0. For a fixed population the b's drop out of the sum, but the a's do not: multiply any single person's utility function by a large enough constant and the sum-maximizing allocation redirects resources to them. On the usual "level-comparable but unit-arbitrary" reading of interpersonal comparison, then, who the monster is — and whether there is one at all — is not a fact about any creature but a fact about a choice of scale. I then distinguish two ways of fixing that scale, which I call *range normalization* (equalize the distance each person can travel between a life not worth living and the best life attainable for them) and *unit-of-sacrifice normalization* (fix each person's unit at the largest cost they could bear and still count as benefited on the whole), and I argue that each is a substantive moral claim masquerading as a measurement convention. The payoff: because the choice is moral rather than empirical, the familiar anti-monster moves — prioritarian weighting, sufficientarian thresholds, per-person caps — are best redescribed as three ways of fixing, or refusing to fix, the scale, and one of them turns out not to be in the same business as the other two.

  The audience, about twenty people, split into two halves that mostly don't read each other. The first half is the public finance group: optimal-tax and cost-benefit people who treat utility as ordinal, regard interpersonal comparison as either impossible or as a normative choice already smuggled into a social welfare function, and reach for money-metric utility, compensating and equivalent variation, willingness to pay, ability to pay, distributional weights, and revealed preference. They will want to know what difference any of this makes to a number. The second half is political philosophy: two luck egalitarians who think expensive tastes are a responsibility problem rather than a resource problem, one prioritarian, one unrepentant total utilitarian who has fielded this objection at a hundred conferences and thinks it turns on an empirical claim about how much welfare a biological system can realize, and a methodologist who works on measurement in the social sciences and will ask what an interpersonal comparison *is*. Time is forty minutes of presentation and about fifty of discussion, so ten to twelve questions.

  What I want: eight or so objections in the order I'll actually get them, not in the order I'd get them from a pure philosophy department. Tag each with who in the room asks it and phrase it the way that person would phrase it — the economists should sound like economists, the luck egalitarians like luck egalitarians, the act-utilitarian like someone who already thinks he has answered this. For each, give me a two-minute reply and, more importantly, a note on where the reply is soft. Flag which objections are really the same objection arriving twice in different vocabularies so I don't answer it twice; flag which one I should concede in the setup rather than in the Q&A; flag which one I should answer by pointing at a slide; and flag which one is genuinely damaging in a way the paper as it stands does not handle. Tell me which single reply has to land if the paper is to survive the room.

  Finally: I have a candidate for the question I'm hoping nobody asks (something about what the view says about people who are unusually hard to benefit), but I don't trust my own sense of how badly it lands. Give me your nomination for the worst question in the room, with your reasoning, and tell me whether my private candidate is actually the dangerous one or whether I'm braced for the wrong thing.
reasoning: |-
  Okay, let me unpack this user's request. They're preparing for a high-stakes academic job talk with a specialized audience split between economists and philosophers, and need tactical Q&A prep. The core insight of their paper - that the utility monster is a scale artifact rather than substantive objection - is clever, but survival depends on navigating disciplinary fault lines.

  First, assessing audience dynamics: The economists will demand operationalization ("So what's the number?"), while philosophers probe conceptual foundations ("What *is* interpersonal comparison?"). The unrepentant utilitarian is especially dangerous - they've heard all variants of monster objections before and will treat this as just another empirical claim. 

  Key structural insight: Three objections are actually the same wolf in different sheep's clothing:
  - Economist's "arbitrary weights" complaint
  - Philosopher's "normative choice" observation
  - Methodologist's "construct validity" challenge
  All boil down to "Your normalization is just another SWF". The reply must preemptively frame this as the paper's point, not its flaw.

  Most critical reply: The economist's "money-metric" question. If I can't show how scale normalization changes practical welfare analysis (e.g., how range normalization makes expensive tastes a resource problem rather than responsibility issue), economists will dismiss this as philosophy games. Slide 12 must visually contrast willingness-to-pay versus normalized utility curves.

  User's feared question ("hard-to-benefit people") is actually salvageable: Range normalization makes unusually shallow utility functions (small welfare range) appear as "efficiency problems" rather than responsibility voids. But the real trap is the methodologist's query about what interpersonal comparison fundamentally is - this forces the user to take a stand on constructivism vs. realism mid-Q&A when their paper deliberately sidesteps metaphysics.

  Biggest concession needed upfront: During setup, explicitly grant that both normalizations are normative choices. Otherwise the political philosophers will weaponize this as a "gotcha". 

  The damaging question I'd dread: "Under unit-of-sacrifice normalization, doesn't a masochist become the monster?" This exposes that the sacrifice approach relies on controversial assumptions about welfare boundaries. Paper currently lacks resources to handle this - best to treat it as scope limitation for now.
answer: |-
  Here’s a battle-tested Q&A prep sheet tailored to your audience and thesis. I’ve sequenced questions by likely order of appearance, tagged speakers, flagged strategic nuances, and identified the critical reply. Your "worst question" candidate is noted at the end.

  ---

  ### **Q&A Prep Sheet: "The Utility Monster Is a Unit Convention"**
  **Core Thesis**: The utility monster is an artifact of arbitrary scaling (affine transformations), not a substantive objection to utilitarianism. Fixing units requires *moral choices* (range vs. sacrifice normalization), revealing prioritarian/capped/sufficientarian approaches as alternative scaling decisions.

  ---

  ### **Objections & Replies**
  1. **Economist 1 (Public Finance)**:  
     *"If utility is ordinal and interpersonal comparisons are normative, why not just use money-metric utility? Won’t WTP/WTA avoid this entire problem?"*  
     **Reply**: "Money-metric utility *presumes* a scale: dollars. But willingness-to-pay is budget-constrained. If we normalize utility by range (e.g., 0=unbearable life, 1=bliss), a poor person’s $1 sacrifice may represent a larger *welfare loss* than a rich person’s $1000, even if WTP differs. Your ‘dollar scale’ is a moral choice too."  
     **Soft Spot**: Doesn’t fully address why economists should abandon money-metrics. **Flag**: Preempt in presentation (Slide: "WTP vs. Normalized Utility").  
     **Tactical**: Concede early that all measures involve normative scaling—your point is to make it explicit.

  2. **Luck Egalitarian 1**:  
     *"Isn’t this just agreeing with us? Expensive tastes *are* a scaling problem—people who need more resources to reach the same welfare level should bear the cost unless disadvantaged."*  
     **Reply**: "Exactly! But under range normalization, a person with a small welfare range (e.g., depression) is ‘hard to benefit’—they get priority. Under sacrifice normalization, someone who endures great hardship for small gains looks like a ‘monster’. Your responsibility criterion *is* a scaling choice."  
     **Soft Spot**: Risks conflating responsibility with scalability. **Flag**: This is a *friendly* objection—use it to bridge to philosophers.

  3. **Prioritarian Philosopher**:  
     *"Why call prioritarianism ‘scaling’? We care about diminishing marginal moral weight, not measurement conventions."*  
     **Reply**: "Prioritarianism transforms utilities *before* summing: u_i → f(u_i), with f concave. This is isomorphic to rescaling units: weighting the disadvantaged is equivalent to stretching their utility scale. Your moral intuition is baked into the ruler."  
     **Soft Spot**: Prioritarians may insist their weighting is post-measurement. **Flag**: Show slide of concave transform vs. rescaled axes.

  4. **Economist 2 (Optimal Tax)**:  
     *"In practice, we use inequality-averse SWFs with arbitrary weights. How is your ‘normalization’ less arbitrary?"*  
     **Reply**: "It’s equally arbitrary—but reveals that ‘monsters’ arise from *unacknowledged* scaling. If you weight utilities by pre-tax income, you implicitly create monsters at the top. My framework forces transparency: is your weight based on sacrifice, range, or politics?"  
     **Soft Spot**: Economists may shrug ("We know it’s normative"). **Flag**: Tag this as **same objection as #1** (implicit normative choice).

  5. **Methodologist**:  
     *"What is an interpersonal comparison *ontologically*? If normalization is moral, is welfare even measurable?"*  
     **Reply**: "I’m agnostic on ontology. But if we *claim* comparability (e.g., ‘policy X helps Ann more than Bob’), we need a scale. The monster shows that absent a scale, utilitarianism is literally undefined. Measurement requires convention—and conventions have moral teeth."  
     **Soft Spot**: Avoids committing to realism/constructivism. **Flag**: **Critical reply**—if this fails, the paper looks metaphysically naive.

  6. **Total Utilitarian**:  
     *"This is irrelevant. Nozick’s monster is biologically implausible. Real welfare functions have diminishing returns!"*  
     **Reply**: "Diminishing returns assume a fixed scale! If we linearly rescale a monster’s utility (u_monster → k·u_monster, k>>1), *even concave functions* will favor them. Empirical constraints don’t fix the scale problem—they just hide it."  
     **Soft Spot**: Hand-wavey on empirical limits. **Flag**: **Genuinely damaging** if audience believes biology fixes scales. Strengthen reply with math: show ∑f(u_i) → monster when k→∞.

  7. **Luck Egalitarian 2**:  
     *"Your ‘unit-of-sacrifice’ normalization sounds like Dworkin’s insurance market—but we reject interpersonal comparisons!"*  
     **Reply**: "Dworkin’s auction *constructs* a scale via hypothetical markets. Sacrifice normalization is similar: it defines a unit by ‘maximum endurable loss’. But both are moral constructs—neither escapes normativity."  
     **Soft Spot**: Luck egalitarians may deny needing *any* cardinal comparison. **Flag**: Concede their core point but stress that *if* comparability is needed, scaling is inescapable.

  8. **Economist 3 (CBA)**:  
     *"So what? We add distributional weights to money-metrics. Call it ‘scaling’ or ‘weights’—it’s the same policy."*  
     **Reply**: "Crucially, prioritarian weights and sufficientarian caps *are not the same*. Sufficientarianism (e.g., ‘meet thresholds first’) isn’t aggregative—it’s a different structure. Redescribing them as scaling choices reveals which ‘monster-fix’ you’re really committing to."  
     **Soft Spot**: Requires accepting your taxonomy of anti-monster moves. **Flag**: **Point to slide** contrasting aggregation vs. thresholds.

  ---

  ### **The Must-Land Reply**
  **#5 (Methodologist)**: If the audience thinks interpersonal comparison is impossible without ontological commitment, your entire argument collapses. Hammer: *"The utility monster isn’t a thought experiment—it’s a proof that un-scaled utilitarianism is mathematically incomplete."*

  ---

  ### **The Worst Question in the Room**
  **Your Candidate**: *"What about people unusually hard to benefit (e.g., anhedonics)? Doesn’t range normalization make them ‘monsters’?"*  
  **Verdict**: **Dangerous but manageable**. Range normalization *does* prioritize them (small ∆u requires huge resources). Reply: "Yes—and this forces a moral choice: do we allocate more to those with shallow welfare ranges? Sufficientarians might say no; prioritarians yes. That’s the point: scaling *is* ethics."

  **Actual Worst Question**:  
  *"Under unit-of-sacrifice normalization, doesn’t a martyr who endures extreme pain for tiny gains become the monster? Isn’t that perverse?"*  
  **Why It’s Worse**:  
  - Exposes a vulnerability in sacrifice normalization: it rewards "tough" utility functions.  
  - Implies your framework *creates* new monsters.  
  - Forces you to defend sacrifice normalization’s moral plausibility on the spot.  
  **Reply**: "A martyr’s *apparent* sacrifice might be offset by meaning-derived welfare (range normalization). Or we might cap sacrifices. But yes, this shows normalization can’t dodge substantive ethics—it *is* ethics."  

  **Tactical**: If asked, pivot to: "This is why I distinguish two normalizations—neither is neutral."

  ---

  ### **Summary Tactics**
  - **Preempt**: Concede early that scaling is normative (softens #1, #4).  
  - **Unify**: Tag #1 (economist weights) and #4 (CBA weights) as identical.  
  - **Visuals**: Use slides for affine transforms (#3) and policy contrasts (#8).  
  - **Survival Hinge**: #5 (methodologist). If they nod, you live.  
  - **Nightmare Fuel**: The martyr question. Have the pivot ready.

  Your paper turns a technical point into a moral lens—sell that reframing. Break legs.
