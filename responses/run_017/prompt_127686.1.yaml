answer: |-
  ## Dissertation Chapter Proposal: The "Man of His Time" Defence – Excuse, Demand, or Misdirection?

  **1. Core Question & Scope:**  
  This chapter asks: **Does the "man of his time" defence primarily function as an epistemic excuse ("he couldn't have known better") or as an argument about the demandingness of moral standards ("he couldn't *reasonably* be expected to know better")?** Crucially, it challenges the standard epistemic reading by arguing that true moral beliefs were often demonstrably *available* to historical agents (e.g., critics existed, arguments were published). The chapter will rigorously analyze whether the defence only gains plausibility when reinterpreted as concerning the *attainability* of moral knowledge – demanding significant personal cost (social, psychological, practical) beyond mere epistemic access.  

  *   **Why this question first?** Suspicions #2 (culpability vs. commemoration) and #3 (diachronic symmetry) fundamentally depend on how we understand the defence's core mechanism (#1). Determining whether it functions as an excuse or a demandingness claim is logically prior. If it's primarily about demandingness, this radically changes its implications for blameworthiness, commemoration, and symmetry arguments. The chapter's answer will be a clear conceptual distinction (availability vs. attainability) applied to the defence, with conclusions about which interpretation (if any) successfully exculpates. Evidence will be whether the defence holds water under each interpretation when applied to paradigmatic controversial agents.

  **2. Challenging Standard Framings:**  
  Existing debates typically oscillate between two poles:  
  *   **Historical Contextualism:** Judging past agents by modern standards is inappropriate due to radical historical difference ("they were just different").  
  *   **Moral Absolutism:** Core moral truths are timeless; historical context doesn't excuse fundamental wrongs.  

  **Shared Framing Assumption Rejected:** Both frameworks implicitly or explicitly rely on the idea that the defence hinges on the *epistemic unavailability* of the correct moral belief ("they *couldn't* know"). This chapter rejects that shared assumption. It argues that the core puzzle persists *precisely because* the correct belief *was* often epistemically available, rendering the standard epistemic excuse inadequate. The chapter intervenes by shifting focus from *whether* they could know to *what it would have cost* them to know and act accordingly.

  **3. Method & Timeline (Armchair-Focused):**  
  This project is fundamentally conceptual and normative, requiring philosophical analysis rather than empirical discovery. It progresses through structured argumentation, conceptual clarification, and analysis of counterfactual scenarios:  

  *   **Months 1-2:** **Problem Framing & Conceptual Groundwork:** Precisely define "man of his time" defence, its common usage in public discourse, and key concepts (blameworthiness, excuse, demandingness, epistemic availability, practical attainability). Establish the inadequacy of the flat epistemic excuse using widely acknowledged historical facts about critics/contemporaneous debates (e.g., abolitionist arguments during Jefferson's time).  
  *   **Months 3-5:** **Developing the Availability/Attainability Distinction:** Rigorously articulate the distinction. Analyze what constitutes "availability" (evidence in circulation, arguments presented). Define "attainability" – specifying the types of costs (social ostracization, career ruin, psychological burden of cognitive dissonance, sheer effort against motivated reasoning) relevant to excusing blame.  
  *   **Months 6-8:** **Testing the Attainability Interpretation:** Does reframing the defence as concerning attainability salvage its exculpatory power? Apply the framework to stylized examples capturing the essence of controversies (e.g., "Could Agent X *reasonably* be expected to abandon deeply held belief Y, facing consequence Z?"). Explore limits: How high can costs be before demandingness becomes unreasonable? Does attainability vary based on the agent's specific position/power?  
  *   **Months 9-10:** **Implications for Blame & Commemoration (Preliminary):** If attainability is key, how does this reshape judgments of *culpability*? Does a successful demandingness claim reduce blameworthiness or merely change its character? Briefly outline how this *might* (or might not) impact commemorative decisions (e.g., showing that a successful demandingness claim doesn't automatically justify honor), setting the stage for future work.  
  *   **Months 11-12:** **Addressing Symmetry & Synthesis:** Re-examine the diachronic symmetry argument ("if for them, then for us") in light of the attainability framework. Does attainability provide a principled way to *reject* symmetry (e.g., because moral progress changes the costs/feasibility of knowing)? Or does it affirm symmetry in a modified way? Synthesize arguments, solidify conclusions on the core question, and draft the chapter.  

  *   **Why Armchair?** The core questions are conceptual: What *is* the structure of the defence? What *kind* of conditions (epistemic vs. practical) *could* excuse blame? Analyzing public controversies and historical consensus on the existence of critics provides sufficient grounding. No new archival research is needed or proposed.

  **4. Practical Deliverable:**  
  For non-philosophers engaged in debates about commemoration (statues, names, curricula), this chapter's primary deliverable is **conceptual clarity and the elimination of a bad argument.** It will show that the common claim "He couldn't have known better" is often historically inaccurate and philosophically weak. The real question, if any excuse exists, is whether it was *unreasonably difficult or costly* for the agent to reach the right conclusion, given their specific circumstances. This shifts public debate:  
  *   Away from unproductive arguments about the mere *existence* of dissenting voices.  
  *   Towards more nuanced discussions about the *pressures, incentives, and burdens* shaping historical agents' choices.  
  *   Crucially, it clarifies that **even if the "man of his time" defence succeeds as a demandingness claim reducing *blameworthiness*, this does not automatically resolve the distinct question of whether public *honor* is warranted.** This separation itself is a valuable tool for decision-makers.

  **5. Possible Conclusions, Failure Conditions & Risks:**  

  *   **Possible Conclusions:**  
      *   **A1:** The "man of his time" defence only plausibly functions as a demandingness claim (attainability), not an epistemic excuse (availability). It can mitigate, but not necessarily eliminate, blameworthiness depending on the severity of the costs.  
      *   **A2:** The defence fails on both interpretations: availability was often present, and the costs of attainability were not typically high enough to excuse core wrongs like slavery or genocide.  
      *   **B:** The defence primarily functions to highlight the demandingness of moral standards, but this does little to exculpate; it mainly explains the *prevalence* of wrong beliefs/actions without excusing them.  
      *   *(Diachronic Symmetry):* Conclusions on symmetry will depend on the core finding. If attainability is key, symmetry might be rejected (due to changing costs/feasibility) or demand future-oriented humility without excusing present failings.  

  *   **Deciding Factors:** The strength of arguments demonstrating that mere availability is insufficient for blameworthiness; the plausibility of defining "unreasonable costs" for attainability; the analysis of whether typical costs faced by controversial agents rise to that level; the ability to handle counter-examples (e.g., agents who *did* bear high costs for moral stands).

  *   **Failure Conditions:**  
      *   The availability/attainability distinction fails to provide a clearer or more plausible account of the defence than the standard epistemic excuse.  
      *   The concept of "attainability" proves too vague or subjective to be analytically useful.  
      *   The analysis cannot be sustained without delving deeply into specific historical cases, violating the armchair constraint.  

  *   **Most Likely Risk (Scope Creep):** The compelling links to commemoration (Suspicion #2) and diachronic symmetry (Suspicion #3) pose the greatest risk of expanding the chapter beyond feasibility. The chapter will succeed only by **rigorously limiting its primary focus to the core question (Epistemic Excuse vs. Demandingness Claim)** and treating commemoration and symmetry strictly as *implications* to be briefly explored *only after* the core argument is established. Failure to maintain this discipline is the most likely path to an unfinished chapter. If the core argument is robust, these implications become clear avenues for future chapters.
