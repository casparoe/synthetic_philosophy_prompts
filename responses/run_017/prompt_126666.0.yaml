  ### Question: Rational Choice and Game Theory (25 marks)

  Consider the following two-player game. Rowena chooses a row (A, B, or C), and Colin chooses a column (L, M, or R). Payoffs are given as (Rowena's payoff, Colin's payoff), with both being von Neumann–Morgenstern utilities. The game matrix is:

  |       | L       | M       | R       |
  |-------|---------|---------|---------|
  | **A** | 4, 6    | 0, 4    | 3, 2    |
  | **B** | 0, 2    | 4, 1    | 1, 3    |
  | **C** | 1.5, 1  | 1.5, 5  | 1.8, 5  |

  **Part (i)**  
  Show that, initially, no strategy of Rowena or Colin is strictly dominated by a pure strategy. (3 marks)

  **Part (ii)**  
  Identify the one strategy that is strictly dominated by a mixed strategy. Exhibit a mixed strategy that dominates it, verify the domination algebraically, and state the exact range of mixing weights (probabilities) for which this domination holds. (8 marks)

  **Part (iii)**  
  Delete the strategy identified in (ii). Then, by iterated deletion of strictly dominated strategies (using only pure strategies as dominators), reduce the game to a single strategy profile. State the surviving profiles after each deletion. In one or two sentences, explain whether the order of deletion (after the first deletion) could have led to a different outcome and why. (6 marks)

  **Part (iv)**  
  Respond to the following objection: "Rowena is a single agent who will perform one action. She cannot improve her position by tossing a coin. Therefore, it is illegitimate to delete one of her options because a mixture of the others beats it." (4 marks)

  **Part (v)**  
  Suppose we know only Rowena's ordinal ranking of the nine outcomes (i.e., her preference ordering) and Colin's cardinal payoffs. Would the mixed strategy deletion in (ii) still be justified? If not, provide an explicit payoff table for Rowena that is ordinally equivalent to the original (i.e., preserves her ranking of outcomes) but in which no mixed strategy strictly dominates any pure strategy at the outset. (4 marks)

  ---

  ### Model Answer

  **Part (i)**  
  No strategy is strictly dominated by a pure strategy. For Rowena:  
  - A vs. B: A yields 4 > 0 in L, but 0 < 4 in M and 3 > 1 in R; no strict dominance.  
  - A vs. C: A yields 4 > 1.5 in L, but 0 < 1.5 in M and 3 > 1.8 in R; no strict dominance.  
  - B vs. C: B yields 0 < 1.5 in L, 4 > 1.5 in M, and 1 < 1.8 in R; no strict dominance.  

  For Colin:  
  - L vs. M: L yields 6 > 4 against A and 2 > 1 against B, but 1 < 5 against C; no strict dominance.  
  - L vs. R: L yields 6 > 2 against A, but 2 < 3 against B and 1 < 5 against C; no strict dominance.  
  - M vs. R: M yields 4 > 2 against A, but 1 < 3 against B and 5 = 5 against C; no strict dominance.  

  Thus, no pure strategy strictly dominates another.

  **Part (ii)**  
  Rowena’s strategy C is strictly dominated by a mixed strategy of A and B. Let \(p\) be the probability on A and \(1-p\) on B. The expected payoffs of the mixture are:  
  - Against L: \(4p + 0(1-p) = 4p\)  
  - Against M: \(0p + 4(1-p) = 4(1-p)\)  
  - Against R: \(3p + 1(1-p) = 2p + 1\)  

  For strict domination, the mixture must yield a higher payoff than C in all columns:  
  1. \(4p > 1.5\) → \(p > 0.375\)  
  2. \(4(1-p) > 1.5\) → \(4 - 4p > 1.5\) → \(p < 0.625\)  
  3. \(2p + 1 > 1.8\) → \(2p > 0.8\) → \(p > 0.4\)  

  Combining: \(p > 0.4\) and \(p < 0.625\), so \(p \in (0.4, 0.625)\). For any \(p\) in this interval, the mixed strategy strictly dominates C.

  **Part (iii)**  
  After deleting C, the game is:  

  |       | L       | M       | R       |
  |-------|---------|---------|---------|
  | **A** | 4, 6    | 0, 4    | 3, 2    |
  | **B** | 0, 2    | 4, 1    | 1, 3    |  

  - **Step 1**: Colin’s M is strictly dominated by L (6 > 4 against A; 2 > 1 against B). Delete M.  
  Surviving profiles: (A,L), (A,R), (B,L), (B,R).  

  |       | L       | R       |
  |-------|---------|---------|
  | **A** | 4, 6    | 3, 2    |
  | **B** | 0, 2    | 1, 3    |  

  - **Step 2**: Rowena’s B is strictly dominated by A (4 > 0 in L; 3 > 1 in R). Delete B.  
  Surviving profiles: (A,L), (A,R).  

  |       | L       | R       |
  |-------|---------|---------|
  | **A** | 4, 6    | 3, 2    |  

  - **Step 3**: Colin chooses L (6 > 2). Unique profile: (A,L).  

  The order of deletion after the first step could not have differed. After deleting C, M must be deleted first (as L dominates M purely), and only then can B be deleted (as A dominates B in the reduced game). Attempting to delete B first fails, as A does not dominate B when M is present (0 < 4 in M).

  **Part (iv)**  
  The objection misconstrues mixed strategies in dominance checks. A mixed strategy dominator shows that C is never a best response to any belief Rowena might hold about Colin’s play. Thus, C is irrational to choose regardless of Colin’s behaviour. This does not require Rowena to randomise; it only requires rationality (avoiding never-best responses). The deletion is epistemic, not behavioural: it reflects that C is inferior under all scenarios, without predicting actual randomisation.

  **Part (v)**  
  No, the deletion would not be justified. Mixed strategy domination depends on cardinal payoffs; it is not invariant under order-preserving transformations. An ordinally equivalent payoff table for Rowena preserving her ranking (e.g., 4 > 3 > 1.8 > 1.5 > 1 > 0, with ties resolved arbitrarily) is:

  |       | L     | M     | R     |
  |-------|-------|-------|-------|
  | **A** | 4     | 0     | 3     |
  | **B** | 0     | 4     | 1     |
  | **C** | 1.5   | 2.4   | 2.5   |  

  Verification:  
  - Original ordinal ranking: (A,L) ≈ (B,M) > (A,R) > (C,R) > (C,L) ≈ (C,M) > (B,R) > (A,M) ≈ (B,L).  
  - New table preserves this: (A,L)=4 ≈ (B,M)=4 > (A,R)=3 > (C,R)=2.5 > (C,M)=2.4 > (C,L)=1.5 > (B,R)=1 > (A,M)=0 ≈ (B,L)=0.  

  In this table, no mixed strategy of A and B strictly dominates C. For any mixture probability \(p\):  
  - Against L: \(4p > 1.5\) → \(p > 0.375\)  
  - Against M: \(4(1-p) > 2.4\) → \(p < 0.4\)  
  - Against R: \(2p + 1 > 2.5\) → \(p > 0.75\)  
  No \(p\) satisfies all (e.g., \(p < 0.4\) and \(p > 0.75\) conflict). Thus, mixed deletion fails.

  ---

  ### Marking Scheme (Total: 25 marks)

  **Part (i) (3 marks)**  
  - 1 mark for Rowena: Correct pairwise comparisons showing no pure domination.  
  - 1 mark for Colin: Correct pairwise comparisons showing no pure domination.  
  - 1 mark for completeness and clarity.  
  - **First-class distinction**: Explicitly checks all strategy pairs with clear inequalities.  
  - **Upper-second boundary**: Missing one comparison or less detailed.  
  - **Common mistake**: States no domination without verification; omits weak dominance check.

  **Part (ii) (8 marks)**  
  - 2 marks: Identifies C as the dominated strategy.  
  - 2 marks: Specifies mixture of A and B.  
  - 2 marks: Correct expected payoff calculations.  
  - 2 marks: Inequalities and exact interval \((0.4, 0.625)\).  
  - **First-class distinction**: Full algebraic derivation; interval stated as open interval.  
  - **Upper-second boundary**: Minor arithmetic error; interval endpoints approximate.  
  - **Common mistake**: Incorrect mixture payoffs; missing one inequality; closed interval.

  **Part (iii) (6 marks)**  
  - 1 mark: Deletes M after C (pure domination by L).  
  - 1 mark: Deletes B after M (pure domination by A).  
  - 1 mark: Identifies (A,L) as unique profile.  
  - 1 mark: States surviving profiles at each step.  
  - 2 marks: Explains order is fixed (M before B; no alternative).  
  - **First-class distinction**: Explicitly states why B cannot be deleted first.  
  - **Upper-second boundary**: Correct sequence but vague on order necessity.  
  - **Common mistake**: Wrong deletion order; omits profiles; assumes flexibility.

  **Part (iv) (4 marks)**  
  - 2 marks: Explains mixed dominator shows "never best response" (epistemic).  
  - 2 marks: Clarifies no actual randomisation required (rationality only).  
  - **First-class distinction**: Links to beliefs and rationality without equilibrium.  
  - **Upper-second boundary**: Mentions never-best response but not beliefs.  
  - **Common mistake**: Confuses with behavioural mixing; invokes equilibrium.

  **Part (v) (4 marks)**  
  - 1 mark: States "no".  
  - 3 marks: Provides ordinally equivalent table and shows domination fails.  
  - **First-class distinction**: Table preserves ranking; clear verification of failure; notes non-invariance.  
  - **Upper-second boundary**: Correct table but incomplete verification.  
  - **Common mistake**: Non-ordinal table; claims deletion holds; no verification. 

