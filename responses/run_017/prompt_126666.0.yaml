  Question:

  Consider the following two-player game. Rowena chooses A, B, or C; Colin chooses L, M, or R. The payoffs are:

                 L     M     R
          A    4,6   0,4   3,2
          B    0,2   4,1   1,3
          C   1.5,1 1.5,5 1.8,5

  (i) Show that, at the outset, no strategy of either player is strictly dominated by a pure strategy. [3 marks]

  (ii) Show that one strategy is strictly dominated by a mixed strategy. Identify the strategy and the mixed strategy that dominates it, verify the domination, and give the exact range of mixing weights for which the domination holds. [8 marks]

  (iii) Delete the dominated strategy from (ii). Then, by iterated deletion of strictly dominated strategies (using pure strategies as dominators), reduce the game to a single strategy profile. State the surviving profile at each step. Could the order of deletion (after the first deletion) have made a difference? Explain briefly. [6 marks]

  (iv) An objection: "Rowena is a single agent who will perform one action. She cannot improve her position by tossing a coin. Therefore, deleting one of her options because a mixture of the others beats it is illegitimate." Answer this objection. [4 marks]

  (v) Suppose we know only Rowena's ordinal ranking of the nine outcomes and Colin's cardinal payoffs. Would the mixed deletion in (ii) still be licensed? If not, give an explicit payoff table for Rowena that is ordinally equivalent to the original (i.e., preserves her ranking of the outcomes) and in which no mixed strategy deletion is possible at the first step. [4 marks]

  Model Answer:

  (i) For Rowena:
  - A vs B: A has higher payoff in L (4>0) and R (3>1), but lower in M (0<4). So neither dominates the other.
  - A vs C: A has higher in L (4>1.5) and R (3>1.8), but lower in M (0<1.5). No domination.
  - B vs C: B has higher in M (4>1.5), but lower in L (0<1.5) and R (1<1.8). No domination.

  For Colin:
  - L vs M: L is better against A (6>4) and B (2>1), but worse against C (1<5). No domination.
  - L vs R: L is better against A (6>2), but worse against B (2<3) and C (1<5). No domination.
  - M vs R: M is better against A (4>2), but worse against B (1<3), and same against C (5=5). No strict domination.

  Hence, no strategy is strictly dominated by a pure strategy.

  (ii) Rowena's strategy C is strictly dominated by a mixed strategy of A and B. 
  Let p be the probability on A and (1-p) on B.
  The expected payoff against Colin's actions:
  - L: 4p + 0(1-p) = 4p
  - M: 0p + 4(1-p) = 4(1-p)
  - R: 3p + 1(1-p) = 2p+1

  We require:
  1. 4p > 1.5  => p > 0.375
  2. 4(1-p) > 1.5 => p < 0.625
  3. 2p+1 > 1.8 => p > 0.4

  Thus, p must be in (0.4, 0.625). For any such p, the mixed strategy strictly dominates C.

  (iii) After deleting C, the game is:

          L     M     R
     A    4,6   0,4   3,2
     B    0,2   4,1   1,3

  Now, for Colin: M is strictly dominated by L (against A: 4<6; against B: 1<2). Delete M.

  Resulting game:

          L     R
     A    4,6   3,2
     B    0,2   1,3

  Now, for Rowena: B is strictly dominated by A (in L: 0<4; in R: 1<3). Delete B.

  Resulting game:

          L     R
     A    4,6   3,2

  Colin chooses L (6>2). So the unique profile is (A,L).

  The order of deletion after the first step: After deleting C, we must delete M next (because it is strictly dominated by L) and then delete B (because it is strictly dominated by A). If we tried to delete B first after deleting C, we cannot because in the 3x3 game (without C), A does not dominate B (in M, 0<4). Also, we cannot delete R for Colin at that stage (since L does not dominate R: against B, 2<3). So the order is forced: delete M then B. Thus, the order could not have made a difference.

  (iv) The mixed strategy is used as a device to show that C is never a best response. For any belief that Rowena has about Colin's play, the expected payoff of C is strictly less than the expected payoff of the mixture. Therefore, C is never a best response. Rationality requires that a player does not play a never best response. Thus, we can eliminate C. This does not require Rowena to actually randomize; it only reflects that C is inferior regardless of Colin's action.

  (v) The mixed domination is not invariant under order-preserving transformations of Rowena's payoffs. To see this, consider the following ordinally equivalent payoff table for Rowena (preserving the same ranking of outcomes):

          L     M     R
     A    4     0     3
     B    0     4     1
     C   1.5   2.4   2.5

  In this table, the ordinal ranking is the same: the outcomes are ordered as before, but now C's payoffs in M and R are adjusted.

  Now, check if any mixture of A and B strictly dominates C.

  Let p be the probability on A.

  Against L: 4p > 1.5 => p>0.375
  Against M: 4(1-p)>2.4 => 4-4p>2.4 => 1.6>4p => p<0.4
  Against R: 2p+1>2.5 => 2p>1.5 => p>0.75

  But p cannot be both <0.4 and >0.75. Hence, no mixture strictly dominates C.

