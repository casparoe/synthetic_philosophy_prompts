answer: |-
  Here’s a thought experiment meeting your specifications, followed by analysis:

  **Scenario: The Collapse of the Last Period Walk**  
  At Westlake High, the Last Period Walk (LPW) tradition endures despite yearly suspensions and a fractured collarbone last semester. When Maya, a quiet sophomore, is falsely accused of cheating by soccer captain Liam, she refuses the Walk. Students expect her social annihilation. Instead, two things happen: First, Liam’s teammate Ben—who privately knows the accusation is baseless—publicly calls Liam a "bully hiding behind tradition." Second, when Liam challenges *Ben* to a Walk, Ben refuses, declaring, "Real courage is protecting the vulnerable, not beating them up after school." To everyone’s shock, Ben isn’t shunned. Whispers spread: "Ben stood up for Maya," "Liam looked pathetic demanding a fight over the truth," "Only cowards need the Walk." Within weeks, students mockingly ask accusers, "Gonna hide behind the Walk?" Refusals multiply. By semester’s end, accusing someone triggers eye-rolls, not demands for a Walk. The tradition evaporates, though fights remain physically possible and social exile still punishes other transgressions like theft.

  ---

  **Analysis of Explanations**  
  1. **Moral Argument (Williams’ Thesis Prediction: Persistence)**  
     *Prediction*: Students already knew LPW was dangerous/unfair (moral arguments existed). Abstract ethics alone wouldn’t dismantle it, as Williams argues moral reasoning rarely overrides entrenched norms without social leverage.  
     *Outcome*: Matches – No new moral argument (Ben appealed to courage, not ethics) caused collapse.  

  2. **Interest-Based (Prediction: Persistence)**  
     *Prediction*: The material/social costs/benefits didn’t change. Accusers still gained status by forcing Walks; the accused still faced exile or injury by refusing. Rational self-interest should sustain LPW.  
     *Outcome*: Fails – Collapse occurred despite unchanged payoffs. Exile remained possible but lost its power.  

  3. **Honor Shift (Appiah’s Account Prediction: Collapse)**  
     *Prediction*: If the *honorable* response is reimagined—refusing LPW becomes brave, while demanding it seems shameful—the norm collapses. Honor guides what deserves respect, not just fear.  
     *Outcome*: Matches – Ben’s defiance recast refusal as protecting others (honorable) and accusations as bullying (dishonorable). Gossip mechanisms amplified this new honor code.  

  ---

  **Structural Feature Making Honor "Peel Off"**  
  **The Role Reversal of an Enforcer**: Ben was an insider (teammate) from the group traditionally *enforcing* LPW. His defiance wasn’t framed as fear or morality, but as superior honor ("Real courage is..."). This allowed peers to see LPW *itself* as dishonorable cowardice ("hiding behind tradition").  

  **If Removed**:  
  - Without Ben’s insider status, refusal by Maya (an outsider) looks like fear, reinforcing LPW’s "honor."  
  - Without Ben’s honor reframing ("protecting the vulnerable"), refusal looks like self-interest (avoiding injury), collapsing into an interest story.  

  ---

  **Critique from Argument/Interest Defenders & What Does the Work**  
  - **Argument-Based Defender**: "Ben’s statement *was* a moral argument ('protecting the vulnerable')! This is ethics persuading peers, not honor."  
  - **Interest-Based Defender**: "Social exile lost meaning *because* Ben’s popularity shielded him. This shifted payoffs: refusal became low-risk for others afterward."  

  **The Real Work**: **The Social Contagion of Shame**. Ben’s act made demanding the Walk *socially toxic* ("Liam looked pathetic"). Gossip networks (eye-rolls, mockery) attached shame to enforcing the old norm, not just refusing it. Honor didn’t vanish—it recalibrated around new behaviors deserving admiration (defiance) or ridicule (invoking tradition). The key is the *collective reinterpretation* of actions through an honor lens, detached from both moral logic and material consequences.
