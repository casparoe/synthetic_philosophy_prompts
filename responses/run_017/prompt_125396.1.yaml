prompt: |-
  I write a column on science and ideas, and I am midway through a piece on collective agency beyond the human case: automated benefits systems that deny claims, hospital triage pipelines, multi-agent software that divides a task among itself, large scientific collaborations whose papers carry thousands of names, trading desks where the models and the humans each do part of the work. Every philosophical account of joint action I have come across seems calibrated for dyads with a shared plan — two people painting a house, lifting a table, going for a walk together — and then goes quiet about the cases my reporting actually turns up. So I want the specification rather than another tour of the theories.

  Give me the desiderata: what an account of shared or joint action has to deliver, for my purposes, to count as adequate. The purpose is this — I want to be able to say, defensibly, when an organization, a crowd, a market, or a sociotechnical system acts, and when it merely produces an outcome that no one intended, and I want to know who is on the hook when it acts badly. Build the list around the cases, and give the consideration behind each requirement.

  Here are the cases from my own reporting that I want handled; tell me which of them generate distinct requirements and which I have misdescribed as hard.

  One: the rubber stamp. A clinician is legally required to sign off on a model's triage recommendations, a couple of hundred a shift, and forms no view about any individual case. If the hospital's decisions are joint actions, who is acting with whom?

  Two: the rotating collective. A volunteer moderation or maintenance group whose membership turns over almost completely within a month, none of whose members has met another, and no one of whom has any representation of the whole activity, yet which maintains a stable policy over years.

  Three: the reluctant participant. A junior soldier, or a low-level official, who executes her part of a policy she believes to be wrong. Does doing one's part under authority count as sharing the intention, and what does the account say about the difference between her and the enthusiast one desk over?

  Four: the constituted we. A crowd that becomes coordinated only once the police kettle it — a collective whose unity seems to be supplied by the treatment it receives from outside rather than by anything the participants intended or agreed to.

  Five: the swarm. Coordinating units — delivery drones, bidding algorithms — that interact by local rules with no representation of any joint goal. Is there a threshold at which this stops being a mere aggregate, and on what does the threshold depend?

  Six: the institutional first-person plural. A committee or court speaks in the we form and issues a conclusion while internally split. What has to be true for that we to be more than a stylistic convention, and who believes what when it is used?

  Mark each requirement as non-negotiable or as a preference of a particular camp — parsimony, reducibility to individual attitudes, refusal of group minds, the insistence that joint action requires communication or mutual responsiveness, the demand for a categorical rather than a scalar notion — and say why you classify it where you do. I would also like you to flag the pairs or clusters of requirements that cannot be jointly satisfied: my suspicion is that the pressure to cover the swarm and the rubber stamp (apparent agency with no shared representation anywhere in the system) pulls against the pressure to explain the normative binding between participants, and that a graded account and a categorical one cannot both be had. That part is what I most want to see, since if the list is internally unsatisfiable that is itself the finding.

  Finally, name the single requirement that does the most work in excluding candidate accounts, and tell me in one short closing paragraph which of the three broad families — reduction to individual attitudes plus common knowledge, an irreducibly collective we-mode, and views that put obligation or joint commitment first — is hit hardest by it. Keep that to a paragraph; the criteria are what I am paying for. A table is fine. No citations or reading list — I can find the literature myself. What I cannot work out from the outside is which of the things these theories are asked to do is a genuine constraint and which is a tribal preference dressed up as one.
reasoning: |-
  Hmm, the user is writing a science column on collective agency beyond human cases and needs help defining what makes an account of joint action adequate for their purposes. They've encountered philosophical theories that focus on small-scale human interactions but want to address complex modern cases like automated systems, large organizations, and technical networks.

  Looking at their six cases, each presents unique challenges:
  - The rubber stamp involves nominal human oversight without real agency
  - The rotating collective maintains stability despite member turnover
  - The reluctant participant questions intention under authority
  - The constituted we forms agency through external pressure
  - The swarm achieves coordination without centralized goals
  - The institutional "we" speaks collectively despite internal divisions

  The user wants criteria to determine when a collective truly acts versus when outcomes emerge unintentionally, and how to assign responsibility. They suspect some requirements might conflict - like covering both swarm systems (distributed agency) and normative binding (shared responsibility).

  Key tensions I see:
  1) The need for gradation (swarm systems) vs categorical agency (legal responsibility)
  2) Explaining agency without shared representations (algorithms) while maintaining mutual obligations (human collaborators)
  3) Accommodating both intentional participation (reluctant soldier) and non-intentional coordination (kettled crowd)

  The most foundational conflict is between gradation and normativity - you can't have both full responsibility and partial agency. The requirement that does the most damage to existing theories is "Attribution Without Shared Representations" since most philosophies assume some form of shared intention.

  For philosophical families:
  - Individualist accounts fail swarm cases
  - We-mode theories struggle with rubber stamps
  - Commitment-first views can't explain constituted we

  The rotating collective case is particularly brutal as it requires continuity without persistent members - no major theory handles this well. Ultimately the tension between distributed mechanisms and moral responsibility seems unresolvable within current frameworks.
answer: |-
  Here are the desiderata for an account of collective agency, built from your cases, with classifications and tensions highlighted. Requirements are labeled **N** (non-negotiable for defensible attribution) or **P** (camp-specific preference), with reasoning.

  ---

  ### **Desiderata for Collective Agency**
  1. **Attribution Without Shared Representations (N)**  
     - *Must explain agency in systems where no participant (human or artificial) holds a "shared plan" or global goal representation.*  
     - **Source Cases:** Rubber Stamp (clinician lacks individual judgment), Swarm (no joint goal representation).  
     - *Why Non-Negotiable?* Your cases demand agency in systems lacking traditional "shared intentions." Rejecting this excludes swarms/stamps.  

  2. **Stability Through Turnover (N)**  
     - *Must explain persistent policy/identity despite complete member replacement.*  
     - **Source Case:** Rotating Collective (stable policy, transient members).  
     - *Why Non-Negotiable?* Accountability requires continuity beyond individual lifespans.  

  3. **Normative Asymmetry (N)**  
     - *Must distinguish participants by attitude (e.g., reluctant vs. enthusiast) while preserving their contribution to collective action.*  
     - **Source Case:** Reluctant Participant (junior soldier opposes policy but acts).  
     - *Why Non-Negotiable?* Legal/moral responsibility hinges on this difference.  

  4. **Externally Constituted Agency (N)**  
     - *Must recognize collective agency triggered or defined by external forces, not internal agreement.*  
     - **Source Case:** Constituted We (crowd unified by police kettling).  
     - *Why Non-Negotiable?* Collective identity often emerges reactively (e.g., protests, markets).  

  5. **Scalar Threshold for Aggregates (P: Graded-Agency Camp)**  
     - *Must identify when local interactions (e.g., drone swarms) become collective action, not mere emergence.*  
     - **Source Case:** Swarm (coordination via local rules).  
     - *Why a Preference?* Individualists reject scalar agency; we-mode theorists demand categorical "we-intentions."  

  6. **Binding without Consensus (N)**  
     - *Must explain how a collective (e.g., committee) can act as one despite internal dissent.*  
     - **Source Case:** Institutional First-Person Plural (split committee issues "we" statement).  
     - *Why Non-Negotiable?* Institutional actions are valid even with internal conflict.  

  7. **Mechanism-Outcome Distinction (N)**  
     - *Must differentiate between (a) collective action and (b) unintended outcomes of interacting parts.*  
     - **Source Cases:** All (especially Swarm, Rubber Stamp).  
     - *Why Non-Negotiable?* Core to your goal: "when it acts vs. when it merely produces."  

  8. **Responsibility Mapping (N)**  
     - *Must specify who/what is accountable when collective action causes harm.*  
     - **Source Cases:** Reluctant Participant, Rubber Stamp, Swarm.  
     - *Why Non-Negotiable?* Required for "who is on the hook."  

  ---

  ### **Key Tensions & Clashes**
  - **Graded vs. Categorical Agency (Tension: Requirements 5 vs. 3, 6, 8)**  
    Scalability (Swarm) demands gradation; responsibility (Reluctant Participant) demands clear boundaries. *Irreconcilable?* Yes—accountability requires thresholds; swarms resist them.  

  - **Representation vs. Normativity (Tension: Requirements 1 vs. 3, 8)**  
    Rubber Stamp/Swarm need *no shared mental states*; Reluctant Participant needs *differential obligations*. Individualist accounts fail here; we-mode/commitment theories struggle with non-representational systems.  

  - **Continuity vs. Individualism (Tension: Requirement 2 vs. Reducibility Preference)**  
    Rotating Collective breaks theories requiring persistent members. Only institutional/role-based accounts survive.  

  - **External Constitution vs. Mutual Responsiveness (Tension: Requirement 4 vs. Communication-Centric Preference)**  
    Constituted We violates mutual responsiveness (e.g., Bratman). Non-negotiable for crowds/markets.  

  ---

  ### **Most Damaging Requirement**  
  **Attribution Without Shared Representations (Requirement 1)**  
  - **Excludes:**  
    - *Individualist accounts* (Bratman, Tuomela): Require shared intentions or mutual belief.  
    - *We-mode theories* (Searle, Gilbert): Demand collective intentionality.  
    - *Commitment-first views* (Gilbert): Assume joint commitment via agreement.  
  - **Hits Hardest:** **Individualist + common knowledge** models. They collapse without shared mental states.  

  **Closing Insight:**  
  The **Swarm/Rubber Stamp vs. Reluctant Participant** clash reveals the core fracture: theories prioritizing *mechanisms* (e.g., local rules) satisfy swarms but fail responsibility; those prioritizing *normativity* (e.g., obligations) handle reluctance but exclude AI systems. **Graded agency** (preferred for swarms) and **categorical responsibility** (required for blame) cannot coexist fully—your cases demand a hybrid account or concede incompleteness.  

  ---

