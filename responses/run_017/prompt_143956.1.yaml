prompt: |-
  I teach an upper-level jurisprudence seminar, and this term I want to stage a mock adversarial collaboration rather than another rehearsal of the familiar mid-century exchange about whether the criminal law may be used to enforce morality. As a teaching artifact — and, frankly, because I want to see whether the thing can be done at all — I need you to draft the joint statement that two contemporary parties could actually sign. Party A is a legal moralist who concedes that the empirical disintegration thesis is in poor shape and has therefore reformulated the view: call it constitutive moralism. On this view a political society's shared morality is partly constituted by being given legal expression, so that decriminalising a practice does not merely fail to prevent a subsequent decline in adherence to a norm, but changes which morality it is that the society shares; the criminal law is not a cause of social cohesion but one of the places where a society's moral identity is made and declared. Party B is a Hartian liberal of a concessive stripe: she grants that some substantial shared morality is a necessary condition of any society worth having, insists on the distinction between a society's positive morality and the critical assessment of it, and denies only that legal enforcement does any work in securing or sustaining that shared morality which is not better done by leaving the norm to non-legal transmission, or which is positively undone when the law takes it up.

  Two stipulations, so that neither side is a straw man. First, both accept that the cases which prompted the original exchange are settled: neither is arguing that consensual homosexual acts or prostitution should be criminalised, and neither may rest anything on them. I want the substance tested on cases we design instead, and here are three I would like used rather than substituted: (i) the segregated spectacle — a commercial practice that nearly every member of the society finds viscerally disgusting, performed only in venues no one enters without consenting to enter, and which harms or sets back no one's interests on any account of harm the liberal is willing to employ; (ii) the seepage variant of that same case, in which good survey evidence shows that people who come to accept the practice are, over the following decade, measurably less likely to comply with unrelated norms of honesty and mutual aid, though the direction of causation is entirely unestablished; (iii) the minority test, which is my own addition and which both parties must address — a moral conviction is eligible for legal enforcement only if the society would continue to hold it, and continue to want it enforced, even were its adherents reduced to a small and politically weak minority. Please also have both parties address the assurance argument I have been sketching in seminar: much moral compliance is conditional on the belief that others also comply; open and legally tolerated flouting degrades that assurance; and a declaratory criminal law is a cheap, reliable device for restoring it. Both should say whether the expressive work this argument assigns to the criminal law could in principle be done by non-legal institutions, and at what cost.

  What I want from you is the document itself, with no preamble, no framing remarks and no history of the debate. Open with a single sentence stating the headline result: the most substantial claim the two parties found they could sign and that neither expected to sign. Then give a numbered section of agreed claims — claims about the formalism of the disagreement, about what a successful moralist argument would have to establish, about what the liberal concedes, about the three cases, and about the assurance argument — each claim phrased so that it is not vacuous: at least one party should have been inclined to reject it before the collaboration began. Follow this with a table of residual disagreements, in which each disagreement is stated twice, once in the moralist's own preferred wording and once in the liberal's, and neither wording is a caricature. Then a section on cruxes: for each, the question such that settling it would move at least one party, the case or piece of evidence both agree would bear on it, and each side's prediction about that evidence written down in advance, including what they would count as a result neither of them predicted. If you conclude that some part of the dispute is verbal rather than substantive — for instance if the constitutive claim and the causal claim collapse into one another under pressure — say exactly which part and why. Do not smooth the disagreement over with balancing formulae, do not attribute views to any named author or work, and do not give me a verdict on who wins.
reasoning: |-
  Okay, let me approach this complex jurisprudence teaching request methodically. The professor wants a mock adversarial collaboration document between two sophisticated positions - constitutive moralism and concessive Hartian liberalism - testing them against novel cases without relying on settled debates about homosexuality/prostitution. 

  First, I need to fully grasp the nuances of both positions. The constitutive moralist (Party A) argues that law doesn't just reflect morality but actively constitutes it through declaration, while the concessive liberal (Party B) accepts the need for shared morality but denies law's necessary role in sustaining it. Both have made concessions: the moralist acknowledges empirical disintegration arguments are weak, the liberal grants shared morality's necessity.

  The three test cases are brilliantly designed to pressure both positions:
  - The "segregated spectacle" isolates pure disgust without harm
  - The "seepage variant" introduces correlation without proven causation
  - The "minority test" examines conviction durability under power imbalance

  The assurance argument about conditional compliance adds another layer - can law cheaply restore assurance when norms are openly flouted? Both parties must address whether non-legal institutions could do this expressive work.

  For the document structure, I'm planning:
  1. A single-sentence headline capturing unexpected common ground
  2. Numbered agreements where each concession hurts - e.g., the moralist admitting law isn't the only possible constitutive tool, the liberal granting law's unique declarative efficiency
  3. Paired disagreements showing genuine divergence - e.g., on whether seepage correlation justifies intervention absent proven causation
  4. Cruxes with testable predictions - e.g., "If minority test surveys showed X, moralist would concede Y"

  The real challenge is avoiding strawmen while making agreements substantive. For instance, both might agree law changes moral facts but disagree on whether this constitutes improvement. The minority test could force interesting concessions - would the moralist really enforce minority-endorsed norms? Would the liberal admit some norms require law to survive minority status?

  I'm particularly intrigued by the seepage case. The moralist might argue correlation creates presumption for intervention, while the liberal demands direction of causation - but both could agree on monitoring before criminalization. That becomes a model for substantive agreement without resolution.

  The assurance argument section needs care. The liberal should concede law's declarative efficiency but question costs (chilling effects, enforcement burdens), while the moralist might admit non-legal alternatives exist but argue they're less reliable. This creates perfect ground for a crux about measurement.

  Throughout, I'll maintain strict neutrality - no verdicts, no named theorists, just the collaborative document as requested. The professor clearly wants students to see how philosophical disagreements can yield precise, testable propositions when framed carefully.
answer: |-
  **Joint Statement of Adversarial Collaboration: Constitutive Moralism and Concessiver Hartian Liberalism**

  **Headline Result:** Both parties agree that the criminal law’s expressive function can, in principle, uniquely restore assurance in conditional moral compliance at lower cost than non-legal alternatives, but disagree fundamentally on whether this constitutes a *sufficient justification* for criminalization absent independent harm.

  **Agreed Claims:**  
  1. **Formal Disagreement:** The dispute concerns whether the expressive act of criminalization *constitutively shapes* shared moral identity (Party A) or is merely an *inefficient symptom* of it (Party B), not whether shared morality is socially necessary (agreed) or whether law influences behavior (agreed).  
  2. **Success Conditions for Moralism:** To justify criminalization, constitutive moralism must demonstrate that legal prohibition is *integral to the social practice* of sustaining the relevant norm such that decriminalization would *reconstitute* the shared morality in a substantively undesirable way—not merely correlate with moral attitudes.  
  3. **Liberal Concession:** Non-legal transmission (e.g., education, social pressure) may fail to sustain assurance in conditional compliance when faced with widespread, visible non-compliance; legal expression *can* be a uniquely salient, low-cost signal of collective commitment.  
  4. **The Segregated Spectacle:** Criminalizing this practice cannot be justified by visceral disgust alone (Party B), nor by constitutive identity-formation absent a showing that tolerating it would *dissolve* a norm essential to social cohesion (Party A). Both reject criminalization here.  
  5. **The Seepage Variant:** Mere correlation between accepting the practice and reduced compliance with other norms is insufficient for criminalization. Party A must show that criminal prohibition is *necessary to prevent the disintegration* of the linked norms; Party B insists that non-legal institutions (e.g., civic education) are preferable absent proof of causation.  
  6. **The Minority Test:** A norm’s resilience under hypothetical minority status is a necessary condition for enforcement eligibility. If a norm would *not* survive as a minority conviction without legal enforcement, it reflects mere majoritarian preference, not a shared morality constitutive of the society’s identity.  
  7. **Assurance Argument:** Open flouting *can* degrade assurance in conditional compliance. Legal declaration *is* a pragmatically efficient means to restore it compared to non-legal alternatives (e.g., public campaigns), which are costlier, slower, and less universally salient. However, this efficiency does not entail *justification* (Party B) and may be redundant if assurance is already sustained non-legally (Party A).  

  **Residual Disagreements:**  
  | Party A (Constitutive Moralism) | Party B (Concessiver Hartian Liberalism) |
  |----------------------------------|------------------------------------------|
  | Toleration of deeply corrosive practices (even if non-harmful) *dissolves* the shared moral fabric by redefining what the community constitutes itself as endorsing. | Toleration of non-harmful practices, even those correlated with norm erosion, does not *cause* disintegration; it reflects pre-existing social change that law cannot productively reverse. |
  | Law’s constitutive role in moral identity means decriminalization *is* moral change; thus, the state must sometimes criminalize to *sustain* the conditions for a valuable shared morality. | Law’s enforcement of morality is either redundant (if social norms are robust) or corrosive (if they are fragile), undermining voluntary moral engagement and inviting resentment. |

  **Cruxes for Future Inquiry:**  
  1. **The Constitutive Efficacy Crux**  
     - **Question:** Does decriminalizing a widely held moral norm *reconstitute* shared morality by normalizing the practice, or merely *reflect* prior moral change?  
     - **Test Case:** Longitudinal study of communities after decriminalization of a non-harmful, viscerally condemned practice (e.g., ritualized animal consumption in a vegan-majority society).  
     - **Party A Prediction:** Decriminalization leads to increased public discussion, gradual normalization, and erosion of the norm’s perceived authority within 5 years.  
     - **Party B Prediction:** Moral attitudes remain stable if non-legal transmission is robust; any erosion precedes or is independent of legal change.  
     - **Unexpected Result:** Norm strengthens post-decriminalization due to backlash ("reverse constitutive effect").  

  2. **The Assurance Restoration Crux**  
     - **Question:** Can non-legal institutions (e.g., media campaigns, community pledges) restore assurance in conditional compliance as effectively as criminal law after public flouting?  
     - **Test Case:** Field experiment in communities with documented collapse in tax compliance. Compare groups exposed to: (a) new criminal penalties, (b) non-legal assurance-building (e.g., public compliance pledges), (c) no intervention.  
     - **Party A Prediction:** Only (a) produces rapid, lasting restoration of assurance and compliance.  
     - **Party B Prediction:** (b) matches (a) in efficacy if adequately resourced, without enforcement costs or liberty intrusions.  
     - **Unexpected Result:** (b) outperforms (a) by fostering intrinsic motivation.  

  3. **The Seepage Causation Crux**  
     - **Question:** Does acceptance of the "segregated spectacle" *cause* reduced compliance with honesty/aid norms, or merely correlate with independent societal shifts?  
     - **Test Case:** Quasi-experimental analysis of regions before/after introduction of the spectacle, controlling for economic/educational variables, measuring changes in trust metrics (e.g., charitable giving, fraud reports).  
     - **Party A Prediction:** Significant decline in compliance metrics directly traceable to spectacle venues’ locations.  
     - **Party B Prediction:** No measurable causal effect; correlation stems from broader cultural drift.  
     - **Unexpected Result:** Causation runs opposite (eroding norms increase spectacle attendance).  

  **Verbal Disagreement Note:** The parties agree that "law constitutes morality" (Party A) and "law reflects morality" (Party B) *converge* when legal change triggers reflexive social reevaluation (e.g., *Obergefell* shifting perceptions of marriage). The substantive disagreement persists: Party A sees this as law’s *essential* role in moral ontology; Party B sees it as law’s *epiphenomenal* cultural weight. This distinction collapses only if all moral facts are reducible to social responses to institutional signals—a view both reject.  

  ---  
