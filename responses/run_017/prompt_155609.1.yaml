prompt: |-
  I've been reading LW and ACX forever so I know all the standard moves around this stuff, but now I actually have to do it for real: I'm one of three people on the grants committee of a small animal-welfare funder, and we get ~30 proposals a year aimed at insects where the whole case is a scale argument — the numbers are astronomic, so even a tenth of a percent chance they feel anything makes the EV look enormous. I know why that's supposed to be fishy (the sentience probability isn't indepedent per insect, it's basically one shared hypothesis, so you're not making a million small bets that diversify, you're making one huge correlated bet) but I can't turn that into anything my committee can run on an actual proposal in an afternoon, with no literature review and no expert on call.

  So: write me a decision procedure. Questions in order, what counts as an adequate answer to each, where it just stops with a no, and where it has to stop and hand to a person because it's a values call. Specifically I want it to handle:

  - unit of account: for eusocial species, is the candidate subject the individual insect, the colony as a superorganism, or both, and how much of the answer rides on that choice;
  - interventions that move the population as well as the welfare per insect (a faster-acting pesticide kills more cleanly but might mean more survivors breeding). My suspicion is the sign of the effect flips depending on whether an insect life is net positive or net negative, and we genuinely don't know, so maybe the procedure branches there or punts;
  - the case where everything funnels into one correlated hypothesis and the right move might be buying information rather than acting — say when.

  Also tell me plainly where the procedure will misfire, i.e. where it hands back confident-looking numbers that are just our priors with a spreadsheet wrapped round them.

  Then run it on three: (1) a supermarket-chain campaign to switch to faster-killing pesticides; (2) funding a study on whether some other clade shows the "pessimism"-style judgement-bias markers I half-remember from bees, on the theory the result propagates across a lot of species at once; (3) the bee-pollination welfare project I've already half-promised a big grant to, which I want you to run honestly even if it comes out saying pull out. British English please.
reasoning: |-
  Okay, the user is part of a grants committee for an animal-welfare funder focusing on insects. They need a decision procedure to evaluate proposals that rely on scale arguments. They're familiar with concepts from LessWrong and ACX but need something practical for their committee to use quickly.

  First, I need to address their main concerns: the independence problem where sentience probability is correlated across insects, the unit of account for eusocial species, interventions affecting populations, and when to prioritize information-gathering over action.

  The user mentioned three specific proposals: a pesticide switch campaign, a study on judgment biases, and a bee-pollination project they're already leaning towards funding. They want the procedure to flag where decisions rely on priors without real evidence.

  I should structure the procedure as a flowchart with clear stopping points. Start with a triage to filter out non-insect proposals. Then assess the scale claim by forcing explicit sentience probabilities and checking for correlation. For eusocial species, differentiate between individual and colony-level welfare, noting that most proposals will assume individual sentience which may not be valid.

  For interventions affecting populations, introduce a sign test: if insect welfare is net negative, reducing suffering is good, but if net positive, it's bad. Since we don't know the sign, proposals should either justify their assumption or be paused if sign uncertainty is high.

  When everything hinges on one hypothesis, like sentience in a clade, recommend information-gathering unless there's low-cost arbitrage. The bee-pollination project might fail here because it relies on debatable assumptions about honeybee welfare.

  The user also wants to know where the procedure misfires. I'll point out that it can't resolve fundamental uncertainties and might inherit committee biases. For the three proposals: the pesticide switch fails the sign test, the judgment-bias study is good for information-gathering, and the bee project needs reevaluation due to sign uncertainty.

  Overall, the procedure should save time by quickly filtering proposals, forcing explicit assumptions, and flagging when deeper analysis is needed. The British English requirement means using terms like "prioritise" and "triage" without American spellings.
answer: |-
  Here's a decision procedure designed for practicality, incorporating your constraints and addressing the specific challenges. It forces explicit justification at critical junctures, minimises "spreadsheet theatre", and identifies where values calls or deeper investigation are unavoidable. **British English throughout.**

  **Animal Welfare Fund: Insect Grant Decision Procedure**

  **Assumptions:** Committee has basic entomology knowledge. Proposals are for interventions/research targeting insects. "Welfare" implies potential for positive/negative subjective experience (sentience).

  ---

  **Phase 1: Triage & Scope Check (5 mins)**
  *   **Q1:** Does the proposal primarily target insects? *If No: Reject/Pass to relevant committee.*
  *   **Q2:** Does the proposal explicitly or implicitly rely on a "scale argument" (large numbers making small probabilities yield high EV) for its primary welfare impact claim? *If No: Evaluate via standard welfare criteria (not covered here). If Yes: Proceed to Phase 2.*

  **Phase 2: Sentience Probability & Independence (Core Challenge) (15 mins)**
  *   **Q3:** What is the *specific causal pathway* claimed to affect welfare? (e.g., faster death, reduced parasitism, habitat change). *Inadequate: Vague statements like "reduce suffering". Adequate: Mechanistic description.*
  *   **Q4:** **Crucial:** What is the **single, most specific hypothesis (H)** upon which the *entire welfare impact depends?** (e.g., "H: Flies experience aversive states during slow poisoning", "H: Ants within colony X experience distress during nest disturbance"). *Inadequate: "Insects feel pain". Adequate: Hypothesis tied to specific taxa, context, and welfare mechanism.*
  *   **Q5:** Is the claimed welfare impact **primarily dependent on H being true across *all* affected individuals/systems?** (i.e., Is H effectively one bet, not millions of independent small bets?)
      *   *If Yes (Almost Always for Scale Arguments):* **STOP SCALE ARGUMENT EVALUATION.** Proceed to Phase 3 (Correlated Bet).
      *   *If No (Rare - e.g., proven sentience in taxon, intervention varies per individual):* Calculate standard EV with explicit sentience prob (`P_sent`) per individual. *Requires strong justification for independent variation.* **Misfire Warning:** This path is rarely valid for insects; insisting on independent `P_sent` usually smuggles in prior via unjustified assumption.

  **Phase 3: The Correlated Bet & Unit of Account (15 mins)**
  *(Entering because Q5 = Yes)*
  *   **Q6: Unit of Account:**
      *   Is the target species **eusocial** (ants, bees, termites, some wasps)?
          *   *If No:* Candidate subject is the **individual insect**. Proceed to Q7.
          *   *If Yes:*
              *   **Q6a:** Does the intervention primarily affect **individuals distinctly** (e.g., injury during handling, specific nutrient deprivation)? *If Yes:* Candidate subject is the **individual insect**. Proceed to Q7. *High Values Call Risk: Requires assuming individuals matter distinctly from colony fitness.*
              *   **Q6b:** Does the intervention primarily affect the **colony as a whole** (e.g., nest destruction, resource availability impacting reproduction)? *If Yes:* Candidate subject is the **colony superorganism**. Proceed to Q7. *High Values Call Risk: Requires valuing colony "welfare" distinctly from individual sentience.*
              *   **Q6c:** Is the effect ambiguous/mixed? **PUNT TO COMMITTEE DISCUSSION.** Requires explicit values call: Does the committee prioritise potential individual sentience, colony integrity, or something else? **Document decision.**
  *   **Q7: Assign `P_H`:** What is the committee's best estimate for **P(H)** – the probability the single crucial hypothesis (H, from Q4) is true? *Must be a single number (e.g., 0.01, 0.001, 0.0001). Use expert intuition, limited literature, committee vote. Document reasoning.* **Misfire Warning:** This `P_H` *is* your prior; the procedure forces its explicit acknowledgment, preventing it from being hidden inside a large N.
  *   **Q8: Estimated Scale (S):** If H *were* true, what is the best estimate of the **net welfare impact per unit** (individual or colony as decided in Q6-6c)? (e.g., "Reduces suffering equivalent to 0.1 'fly suffering-days' per individual affected", "Improves colony welfare by X units"). *Adequate: Qualitative scale (Small/Med/Large) acceptable if justified, quantitative ideal. Must include sign (+/-).*
  *   **Q9: Estimated Number of Units Affected (N):** Best estimate of individuals/colonies impacted by the intervention. *Adequate: Order of magnitude acceptable (e.g., 10^6, 10^9).*
  *   **Q10: Correlated EV Calculation:** **EV = P_H * S * N**
      *   *This is the maximum plausible EV for the welfare impact.* **Crucially, it is treated as one bet on H, not diversified.**

  **Phase 4: Population Effects & The Sign Problem (10 mins)**
  *   **Q11:** Does the intervention significantly alter the **total population size (P)** of the target insect(s) over the relevant timeframe? (e.g., faster pesticide kills more *now* but survivors breed more later; habitat creation increases population).
      *   *If No:* Proceed to Phase 5.
      *   *If Yes:*
          *   **Q11a: Sign Test:** What is the **net welfare valence per individual insect life (V)**? Is a typical life net positive (happiness > suffering), net negative (suffering > happiness), or neutral/unknown?
              *   *If V = Net Positive:* Increasing population (P↑) = Good, Decreasing population (P↓) = Bad. *Reverse impact sign of any population change effect.*
              *   *If V = Net Negative:* Increasing population (P↑) = Bad, Decreasing population (P↓) = Good. *Keep impact sign of population change effect.*
              *   *If V = Neutral/Unknown:* **HIGH UNCERTAINTY/PUNT.** Population effect welfare impact is indeterminate. Requires committee values call or strong justification for assumption.
          *   **Q11b: Estimate Population Impact (ΔP):** Best estimate of the change in total insect-years or total number of lives caused by the intervention. *Adequate: Order of magnitude, sign (+/-).*
          *   **Q11c: Estimate Welfare Impact per Unit Population Change (W_p):** If V is known, what is the net welfare impact per additional insect-year/life? (e.g., "Adding one net-positive fly-year = +Y utils"). *Highly speculative!*
          *   **Q11d: Population Effect EV:** **EV_pop = ΔP * W_p** (signs handled per Q11a).
          *   **Revised Total EV:** **EV_total = EV (from Q10) + EV_pop** *Note: EV_pop often dominates or introduces high uncertainty.* **Misfire Warning:** `V` and `W_p` are massive priors with little empirical basis; results here are highly sensitive to committee assumptions.

  **Phase 5: Information Gathering vs. Action & Final Decision (5 mins)**
  *   **Q12:** Is the entire EV claim fundamentally dependent on **resolving a single, critical unknown** (especially the truth of H, or the sign V)? And is the cost of the proposed intervention significant relative to the fund's resources?
      *   *If Yes:*
          *   **Q12a:** Could a significant portion of the budget achieve **much higher information value** (e.g., funding a definitive(ish) study on H or V for this taxon)? *If Yes: STRONG CASE TO DEFER ACTION / FUND RESEARCH INSTEAD.*
          *   **Q12b:** Is there a strong case for **"low-cost arbitrage"** (e.g., the intervention is very cheap, has co-benefits like reduced environmental toxin load, and `P_H` or `V` isn't astronomically low)? *If Yes: Weak case for action. If No: Reject/Punt.*
      *   *If No:* Proceed to Final Decision.
  *   **Final Decision Threshold:** Based on **EV_total** (or just EV if no pop effect), cost, and the fund's priorities:
      *   High EV_total, Low Cost, Aligns with priorities: **Fund.**
      *   Moderate EV_total, High Cost/Uncertainty: **Punt to Committee Discussion (Values/Risk Tolerance).**
      *   Low/Highly Uncertain EV_total: **Reject.**
      *   High Info Value Identified (Q12a): **Recommend Deferral/Redirection to Research Proposal.**

  ---

  **Where it Misfires (Confident-Looking Priors):**
  1.  **`P_H` Assignment (Q7):** The core prior. The number looks precise but is pure committee intuition/guesswork, heavily influenced by individual priors.
  2.  **Welfare Impact Scaling (S in Q8, W_p in Q11c):** Translating interventions into "welfare units" is inherently speculative and prior-laden, even if `P_H=1`.
  3.  **Sign of Life (V in Q11a):** The fundamental, unresolved meta-ethical question. Entire population effect calculations rest on this subjective prior.
  4.  **Unit of Account for Eusocial (Q6):** Whether to value individuals or colonies *as sentient entities* is a values call disguised as a technical decision.
  5.  **Ignoring Higher-Order Effects:** The procedure focuses on direct, first-order impacts. Complex ecosystem interactions or long-term unintended consequences are omitted.

  ---

  **Running the Examples (Applying the Strict Procedure):**

  **Proposal 1: Supermarket-Chain Campaign for Faster-Killing Pesticides.**
  *   **Phase 1:** Targets insects (Yes), Relies on Scale Argument (Yes - less suffering due to faster kill).
  *   **Phase 2:**
      *   Q3: Causal Pathway: Faster death → less suffering during death process. *Adequate.*
      *   Q4: **H:** Flies/beetles/moths targeted by these pesticides experience aversive states proportional to time-to-death under slow poison. *Adequate.*
      *   Q5: Is welfare dependent on H being true across all? **Yes.** → Phase 3.
  *   **Phase 3:**
      *   Q6: Not Eusocial (typically). Unit = Individual.
      *   Q7: `P_H` = ? (Committee guess: Low. Say 0.001 - assumes some chance of aversive states in some taxa, but pesticides target diverse pests).
      *   Q8: `S` = ? If H true, faster kill reduces suffering per insect. Estimate: Med benefit per insect killed faster. Sign: + (reduction in suffering).
      *   Q9: `N` = High (e.g., 10^9 insects/year).
      *   Q10: `EV` = 0.001 * (Med+) * 10^9 = Moderate+ EV.
  *   **Phase 4:**
      *   Q11: Alters Population? **Yes.** Faster kill → potentially higher immediate mortality → *fewer survivors breeding* → **likely reduces total population (P↓)** over time vs. slower pesticide.
      *   Q11a: **Sign (V)? Net Negative? Net Positive? Unknown?** **HIGH UNCERTAINTY/PUNT REQUIRED.** Committee *must* make values call on V. *Assume committee punts discussion: Unable to agree/conclude V. Result: Population Effect EV indeterminate.*
      *   EV_total = EV (Moderate+) + ??? = **Highly Uncertain.**
  *   **Phase 5:**
      *   Q12: Dependent on critical unknowns? **YES (H and V!)**. Cost significant? (Campaigns can be costly). Q12a: High Info Value alternative? (e.g., fund research on insect death experience / V sign) - **YES.** Q12b: Low-cost arbitrage? Unlikely (campaign isn't trivial cost).
  *   **Decision:** **Reject or Punt (Strong Case for Funding Research Instead).** The scale argument EV is uncertain (`P_H` low) and completely overshadowed by the unknown sign (V) of the larger population effect. Funding research on V or H is likely better EV. *The procedure prevented a bad "scale argument" approval.*

  **Proposal 2: Funding Study on "Pessimism"-Style Judgement Bias in [Other Clade] (e.g., Cockroaches).**
  *   **Phase 1:** Targets insects (Yes). Relies on Scale Argument? **No.** (It's pure information gathering). *Bypass Scale Procedure.*
  *   **Standard Evaluation (Brief):**
      *   **Feasibility:** Can the study reliably detect bias in this clade? (Methodology check).
      *   **Information Value:** How much would a +ve/-ve result change `P_H` for welfare-relevant sentience *across a wide range of species/clades*? (High - finding in basal clade like roaches suggests deeper homology).
      *   **Cost:** Reasonable for the potential info gain?
      *   **Impact:** Does it address a critical bottleneck in welfare efforts? (Yes - resolving `P_H` correlation).
  *   **Decision:** **Strong Candidate for Funding.** Directly addresses the core correlated hypothesis (`H` for many species) problem with potentially high information value per pound. *The procedure correctly identifies this as superior to action when facing high uncertainty on H.*

  **Proposal 3: Bee-Pollination Welfare Project (e.g., promoting "gentle" bee farming/habitat).**
  *   **Phase 1:** Insects (Yes), Scale Argument? (Likely Yes - many bees helped).
  *   **Phase 2:**
      *   Q3: Causal Pathway: Better habitat/less stressful handling → improved bee welfare. *Adequate.*
      *   Q4: **H:** Honeybees experience aversive states (stress, pain) during current practices/habitat loss, and reduced by this intervention. *Adequate.*
      *   Q5: Welfare dependent on H being true across all? **Yes.** → Phase 3.
  *   **Phase 3:**
      *   Q6: **Eusocial (Yes).**
          *   Q6a: Affects individuals distinctly? (Handling stress - Yes). *But also...*
          *   Q6b: Affects colony? (Habitat quality impacts colony health - Yes). **→ Q6c: Ambiguous/Mixed. PUNT TO COMMITTEE.**
          *   *Committee Values Call:* Prioritise potential individual sentience. **Unit = Individual Bee.**
      *   Q7: `P_H` = ? (Committee: Moderate? Say 0.1 - bees are best-studied, evidence exists for some capacities).
      *   Q8: `S` = ? If H true, intervention reduces suffering per bee. Estimate: Small-Med benefit per bee. Sign: +.
      *   Q9: `N` = High (e.g., 10^10 bees).
      *   Q10: `EV` = 0.1 * (Small-Med+) * 10^10 = High EV.
  *   **Phase 4:**
      *   Q11: Alters Population? **YES.** Improved habitat/gentler practices → **likely increases healthy colonies → increases total bee population (P↑)**.
      *   Q11a: **Sign (V)? Net Negative? Net Positive? Unknown?** **CRITICAL PUNT.** Is a honeybee life net positive or negative? Arguments both ways (foraging joy vs. disease, predation, winter death). *Committee likely cannot agree confidently. High Uncertainty.*
      *   EV_pop = ??? (Large effect, sign unknown). EV_total = High (from Q10) + ??? = **Highly Uncertain (Potentially Negative if V is Net Negative!).**
  *   **Phase 5:**
      *   Q12: Dependent on critical unknowns? **YES (V!).** Cost? (Big grant - significant). Q12a: High Info Value alternative? (e.g., research on V sign in bees - YES). Q12b: Low-cost arbitrage? No (big grant).
  *   **Decision: Reject or Punt (Strong Case for Funding Research on V first).** The potentially high direct welfare EV is swamped by the massive uncertainty and potential *negative* impact from increasing population if bee lives are net negative. Funding this large action grant is premature; research on the sign of wild/domestic bee welfare is more pressing. *The procedure forces confronting the "elephant in the room" (V) that the scale argument hides.*

  **Key Takeaway:** This procedure stops scale arguments from bypassing scrutiny by forcing explicit quantification of the core prior (`P_H`), managing the correlated bet, rigorously handling population effects/sign uncertainty, and flagging when information gathering is superior to action. It makes the committee's unavoidable priors and values calls visible, preventing them from being laundered through big numbers. It will save you time by quickly filtering proposals where the core assumptions don't hold or are too uncertain.
