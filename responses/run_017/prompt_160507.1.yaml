answer: |-
  **MEMORANDUM**  

  **TO:** All Faculty, Department of Mathematics  
  **FROM:** Office of Foundational Compliance (OFC)  
  **SUBJECT:** Mandatory Choice Impact Statements for Proofs Involving Non-Constructive Principles – Policy FND-COMP/AC-2023  

  **Background:**  
  Following Incident #4472-B (unauthorized application of Zorn’s Lemma in a graduate topology seminar resulting in an unreported Banach–Tarski surplus asset), the OFC hereby institutes formal compliance procedures for proofs invoking choice principles. Unregulated axiom deployment risks foundational instability, budgetary overruns, and non-compliance with the *University Sustainability Act* (Section 12: "No Unbounded Surpluses").  

  **Policy:**  
  Effective immediately, all proofs must adhere to the following tiered declaration system. Violations constitute a Paperwork Offense (Level III-A).  

  1.  **Tier 1 (Pre-Approved; Minimal Risk):**  
      *   **Scope:** Countable Choice (CC), Dependent Choice (DC).  
      *   **Procedure:** No prior filing required. Use may be logged retrospectively during departmental audits.  
      *   **Rationale:** Tier 1 powers routine analysis (e.g., sequential convergence, basic measure theory) and aligns with the OFC’s aspirational pilot environment (Solovay’s Model, ZF+DC). *Note:* While Solovay ensures universal Lebesgue measurability, procurement remains infeasible due to the Inaccessible Cardinal requirement (Exceeds departmental purchasing authority per Procurement Code §7.8). Tier 1 will *not* yield non-measurable sets – intentional attempts require Tier 3 authorization.  

  2.  **Tier 2 (Short Form; Moderate Scrutiny):**  
      *   **Scope:** The Ultrafilter Lemma (UL), a.k.a. the Boolean Prime Ideal Theorem (BPIT), *and all theorems demonstrably obtainable at its price point*. This includes, but is not limited to:  
          *   Hahn–Banach Theorem (for normed spaces)  
          *   Tychonoff Theorem (for products of *compact Hausdorff spaces only*)  
          *   Existence of non-principal ultrafilters on ℕ  
      *   **Procedure:** Form OFC-AC2 ("Limited Choice Impact Disclosure") must be submitted *at least 72 hours* prior to proof presentation/publication. Include:  
          *   Theorem(s) being proven.  
          *   Specific UL/BPIT invocation point.  
          *   Justification for not using cheaper Tier 1 methods.  
          *   Certification that no Tier 3 principles are smuggled in.  
      *   **Rationale:** UL/BPIT represents a significant, non-recoverable expenditure of non-constructive resources. While stronger than ZF, it operates below the "Zorn Threshold" and avoids the systemic risks of full choice. *Clarification:* Attempting to prove the *general* Tychonoff Theorem (non-Hausdorff) using UL constitutes Tier 3 fraud.  

  3.  **Tier 3 (Committee Review; High Risk):**  
      *   **Scope:** Unrestricted Axiom of Choice (AC), Zorn’s Lemma (ZL), Well-Ordering Theorem (WOT), *and any principle of equivalent logical strength* (e.g., "Every vector space has a basis," "Every set can be well-ordered").  
      *   **Procedure:** Form OFC-AC3 ("Full Choice Impact Statement & Risk Assessment") must be submitted *at least 30 days* prior. The OFC Committee (comprising 1 Logician, 1 Analyst, 1 Departmental Administrator) will review:  
          *   Necessity: Proof that no weaker principle suffices.  
          *   Impact Assessment: Potential for non-measurable sets, paradoxical decompositions (see §4), or foundational side effects.  
          *   Resource Plan: Mitigation strategy for consequences (e.g., storage for surplus assets).  
      *   **Rationale:** Tier 3 principles are inherently destabilizing and resource-intensive. **Crucially:** ZL, WOT, and AC are *logically equivalent* over ZF. Filing separate statements for their use *within a single proof* constitutes redundant paperwork (Offense Level II-C: "Excessive Axiomatic Documentation"). File *one* OFC-AC3 per proof, citing the specific principle used.  

  4.  **Banach–Tarski Protocol:**  
      Any proof or construction resulting in a Banach–Tarski decomposition (or equivalent paradoxical duplication, e.g., ball → two balls) is a **Reportable Event**.  
      *   The surplus geometric object(s) must be logged immediately using Form OFC-BT1 ("Paradoxical Asset Manifest").  
      *   Physical storage of the surplus object is mandatory. *Warning:* The departmental storage budget (allocated for chalk, spare projector bulbs, and paradoxes) is currently overspent by 137%. Future decompositions may necessitate external storage contracts billed to the Principal Investigator's grant.  

  5.  **Audits & De Minimis Exemption:**  
      The OFC will conduct random audits for undeclared choice usage. Remember: Choice is often invisible.  
      *   **De Minimis Exemption:** Axiom use below the Tier 1 threshold is exempt *only* if a **canonical choice function exists** and is explicitly implemented. Standard example: Choosing one shoe from each pair in an infinite set of shoes (canonical: always pick the left shoe) is exempt. Choosing one sock from each pair in an infinite set of identical socks (no canonical choice) *requires* at least Tier 1 declaration. "Socks, not shoes" serves as the compliance mnemonic.  

  **Faculty Feedback:**  
  Professor A. Nalyst (Functional Analysis) submitted the following comment during policy review: *"This is absurd! My spectral theorem proof only ever needed countable choice! Are you auditing diagonal arguments now? This isn't topology!"* The OFC acknowledges Prof. Nalyst's concern. Diagonal arguments involving countable sets typically fall under Tier 1 (CC) and are generally pre-approved. However, auditors *will* scrutinize the specific enumeration method used.  

  **Compliance Deadline:**  
  All proofs presented, published, or submitted for grading after **November 1, 2023** must adhere strictly to this policy. Forms available on the OFC Sharepoint (under "Compliance > Axioms > Choice").  

  Foundationally Yours,  
  *B. U. Reaucrat*  
  Director, Office of Foundational Compliance  
  Department of Mathematics  

  ---  

