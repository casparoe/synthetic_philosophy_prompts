prompt: |-
  You are a professional philosopher of science who works on causal explanation in biology and the social sciences, and who has mediated real adversarial collaborations between researchers who disagree. Please think carefully before writing: start by brainstorming, privately, what each side actually needs the concept of heritability to do for it, which of their slogans are load-bearing and which are noise, and where a neutral bystander would say the fight is about a number versus about a word. Then draft the document, and only then reread every line to check it isn't secretly written from one side's point of view.

  Who I am: I'm a senior at Cedar Flats High School and I organize our school's Adversarial Collaboration Night, where two people who have been arguing past each other have to produce one signed document instead of another debate. My first pair is two of my teachers. Ms. Reyes teaches AP Biology and runs the genetics unit; she treats heritability as a legitimate, informative population statistic and thinks people attack it for political reasons. Mr. Okafor teaches AP Psychology and does equity work for the district; he treats heritability numbers as bookkeeping artifacts that drift with the environment and that reliably get overread as destiny. They have been going around in circles for a year, and I want the document they should have produced.

  One hard constraint, and I mean it: do not cite any study, name any researcher, give any year, or list any paper or book. They keep throwing citations at each other and I can't verify any of them from school. If you need to point at an empirical finding, describe it in a single clause the way a well-informed person would describe it in conversation, and move on. Assume your reader is smart, is seventeen, knows what variance is but not much more than that, and will notice if you dodge a question by citing something.

  The case they agreed to work through is ours, and the numbers are ones I've simplified and partly invented, so treat them as stipulated:

  1. In 2022 our district estimated the heritability of a sixth-grade reading-comprehension composite at about 0.51, from a twin comparison, at a time when the nine elementary schools differed wildly in funding and class size.
  2. The district then ran three years of free one-on-one tutoring for every struggling reader. Average scores rose by roughly 0.7 standard deviations, the spread of scores shrank by about 30 percent, and when the estimate was recomputed on a comparable sample it came out near 0.66 — higher than before, even though reading improved for almost everyone.
  3. Someone also computed a heritability for the gain itself, meaning the difference between each child's 2022 and 2025 scores, and got roughly 0.40.
  4. A district committee then proposed tracking a new composite it calls reading resilience: scoring in the top quartile of readers despite being in the bottom quartile of a home-literacy questionnaire. They want a heritability estimate for that too.
  5. Finally, my own contribution is a thought experiment I made up, which I want them to address directly: the double-shuffle test. Imagine two impossible experiments. In one, you hold every child's environment exactly as it is and randomly reshuffle which genome goes with which family and school. In the other, you hold every genome in place and randomly reshuffle which child gets which school, tutoring slot, neighborhood, and peer group. Ask whether heritability is supposed to predict the size of the first effect, the second, both, or neither.

  If one of my stipulations is confused or begs a question, say so briefly in a note and restate it in a usable form instead of quietly working around it.

  What I want from you:

  Section 1, agreed claims. A numbered list of ten to fourteen sentences that both Ms. Reyes and Mr. Okafor could sign. Each one must be substantive enough that some actual person would deny it — no claims that are true by definition or so hedged that they say nothing. Include what they can agree on about what heritability is defined as, about what it does not license (about individuals, about the malleability of a trait, about differences between groups, about the effect of any intervention), and about whether the rise from 0.51 to 0.66 is or isn't surprising.

  Section 2, disagreements. A table. For each row: the crux; the claim stated in the wording Ms. Reyes would accept for her own side; the same dispute stated in the wording Mr. Okafor would accept for his; and a one-line note on what settling that crux would change. I suspect three of the cruxes are whether a statistic that is defined relative to a population and an environment distribution can still guide policy, whether heritability says anything about what would happen under an intervention, and whether the difference between explaining variance and identifying a cause is deep or merely verbal. Add any crux I've missed.

  Section 3, pre-registered predictions. For each crux, name a concrete test, case, or piece of evidence both of them would agree bears on it — my double-shuffle test, the ceiling on the 2025 test form, the gain-score number, the reading-resilience composite, and the fact that only ratios can be estimated from the 2022 and 2025 data so nobody can tell whether the genetic or the environmental variance moved — and then write down, in advance, what each side predicts that test will show and what each would count as a result that counts against its own view.

  Section 4, verbal versus genuine. Tell me plainly which parts of their argument are disputes about words or about how to use the word importance, and which are real disagreements that no amount of defining will dissolve. Explain why in each case.

  Section 5, a short plain-language note I can hand to the audience before they read the document: what the fight is actually about, what nobody in it disagrees about, and which questions are genuinely still open. This is not a verdict. Do not tell me who won.

  Aim for roughly 1,200 to 1,600 words. Define any technical term the first time you use it, briefly, but don't dilute the content to do it. Nothing in the document should be false, and nothing in it should be a sentence either teacher would read as a caricature of their own position.
