prompt: |-
  i'm in an early christian ethics seminar and we just did augustine on lying — the two short treatises where he argues it's never permitted to lie at all, and then the part where he still sorts lies into kinds (injurious, officious, jocose) and treats some as much less serious than others. i've been testing my gut on cases and the verdicts won't line up, and i need a principle, or two or three candidate principles, that i can actually defend in my paper next week.

  my verdicts (labels so you can refer back):

  A. a man with a gun knocks and asks where my roommate is; he's in the shower and I say "he went out an hour ago." — fine, and more than fine, it feels required.
  B. my grandmother knitted me an ugly sweater and asks if I like it; I say I love it. — fine, barely registers as a moral thing at all.
  C. pub quiz: I tell my mate his answer is wrong when it's right, purely as a piss-take; nobody loses anything. — fine-ish, but I'd feel different if money was riding on it, which makes me think it's fine for a different reason than B.
  D. my neighbour with dementia asks every afternoon whether her sister rang; she didn't; I say yes. — fine, and I'd do it again, but it leaves a residue that B doesn't.
  E. a friend with a terminal diagnosis asks me straight out if he's going to die from it; I say "no, you'll be fine." — not fine, and worse than D, which is confusing since both are falsehoods told to comfort someone.
  F. job interview: I say I left my last job voluntarily when I was fired. — clearly not fine, the worst one on this list.
  G. same as A, but instead of lying I just say "I'm not telling you." — feels better than A, even though it might get my roommate killed. That's the one I keep going back to.
  H. I tell someone something that happens to be true, but I believe it's false and I'm trying to mislead them. — my gut says this is still lying, which makes me think the wrong-making thing is the intent, not the falsity of what I said.

  So: is there one principle that gets all eight, or do some of my verdicts have to go? I keep thinking a graded version of Augustine's line — every lie is wrongful, but gravity varies with the kind of lie and the motive — saves more of them than a consequentialist one does, especially G, but I can't tell whether the grading is doing real work or just smuggling consequences back in through the back door. And if the wrong-making feature really is the will to deceive rather than the falsity of the statement, then what does that say about misleading someone without asserting anything false — silence, equivocation, letting someone walk away with a false belief I didn't plant — and about a novelist writing false dialogue for a character?

  Give me the discussion in prose, then a JSON object at the end. Schema:

  {
    "principles": [
      {
        "name": "short label",
        "statement": "one or two precise sentences stating the principle",
        "case_verdicts": {"A": "written-out verdict", "B": "...", "C": "...", "D": "...", "E": "...", "F": "...", "G": "...", "H": "..."},
        "overturns": ["labels of my verdicts this principle can't save"],
        "new_case": {"description": "a lying-ish case I didn't give you", "predicted_verdict": "what the principle says", "rationale": "why"},
        "augustine_fit": "which parts of the Augustinian package it keeps and which it drops",
        "collapse_risk": "whether it collapses into consequentialism, and why or why not"
      }
    ],
    "recommendation": "which one you'd have me defend, in a sentence or two",
    "unsettled": ["cases or features none of the principles settle"]
  }

  two or three candidates is plenty, and I'd rather you be blunt about which of my gut calls are just inconsistent.
reasoning: |-
  Okay, the user is in an early Christian ethics seminar focusing on Augustine's absolute prohibition against lying, but they're grappling with intuitive judgments about specific cases where lying seems permissible or even obligatory. They've listed eight scenarios (A-H) with their gut reactions and want ethical principles that can coherently explain these verdicts for their upcoming paper. 

  First, I need to understand why Augustine's framework creates tension for them. Augustine categorizes lies but maintains all are sinful, which clashes with the user's intuition that some lies (like protecting a roommate from a murderer) aren't just excusable but morally required. The user also notices nuances: harmless white lies (B) feel trivial while false comfort about terminal illness (E) feels wrong, and deceptive truths (H) still register as lies. 

  Their core struggle is between deontological purity (Augustine) and consequentialist flexibility. They suspect grading lies by severity might sneak consequences in through the back door. The roommate scenario (G) is particularly haunting—truth-telling feels "better" even if it gets someone killed, which suggests residual deontological guilt.

  For principle-building, I should start from their strongest intuitions: 
  - Intent matters more than factual falsity (H proves this) 
  - Harm avoidance justifies deception (A vs. F shows this gradient) 
  - Some contexts neutralize wrongness (jokes in C, dementia care in D) 

  Three candidate principles emerge: 
  1. **Intent-Based Graded Absolutism**: Keep Augustine's framework but make wrongness proportional to intent and context. This saves most verdicts except their unease in G (truth-telling despite risk). 
  2. **Intentional Deception Principle**: Focus purely on the will to deceive. This handles H well but struggles with why some deceits (F) feel worse than others (B). 
  3. **Defeasible Veracity Principle**: Truthfulness as a defeasible duty overridden by greater harms. This aligns with A/D/E distinctions but risks collapsing into consequentialism.

  The user needs honesty about inconsistencies. Their discomfort in G (truth over life) contradicts their own A-verdict (lying to save life). They must either abandon A or accept that consequences can override truth-telling in extremes. Also, their differing reactions to D and E suggest they intuitively weigh not just comfort but *agency*—the dementia patient can't process truth, while the terminal friend can.

  For the JSON, I'll structure each principle's performance across cases, noting where it overturns their intuitions (e.g., graded absolutism forces G to be wrong). The recommendation will be Principle 1—it's closest to Augustine while accommodating gradations they observe. Unsettled areas: whether all non-assertive deception (silence, fiction) counts as "lying," and how to weigh epistemic harm (denying truth to someone entitled to it).
answer: |-
  Here's a principled analysis of your lying cases, grounded in your intuitions but pushing toward consistency. The core tension is between **absolute prohibition (Augustine)** and **permissibility based on consequences/intent**, with your intuitions leaning toward the latter but retaining deontological guilt (especially in G). Three candidate principles emerge:

  ---

  ### Candidate Principles

  **Principle 1: Graded Intentional Deception Principle**  
  *Focus: The wrong-making feature is the *intent to deceive*, but the moral gravity depends on (a) the harm/care expressed by the intent, and (b) the context’s demand for truth.*  
  - **Statement**: "Lying is intentionally asserting what one believes to be false with the aim of misleading. It is always pro tanto wrongful as a betrayal of truthfulness, but its overall permissibility and severity depend on: (i) whether the intent expresses care or harm, and (ii) whether the context imposes a duty of strict truthfulness (e.g., promises, formal inquiries)."  
  - **Case Verdicts**:  
    - A: **Permissible** (Intent: lifesaving care; no duty to aid murderer).  
    - B: **Permissible** (Intent: kindness; social context has low truth-duty).  
    - C: **Permissible** (Intent: jest; context suspends truth-duty).  
    - D: **Permissible** (Intent: care; dementia negates capacity for truth-duty).  
    - E: **Wrongful** (Intent: false comfort; medical context demands truth-duty; harms agency).  
    - F: **Seriously Wrongful** (Intent: selfish gain; explicit truth-duty in oaths/contracts).  
    - G: **Prohibitively Risky** (Truth-telling isn’t deceptive, but neglects lifesaving duty; thus, *less* "pure" than lying in A but *practically* worse).  
    - H: **Wrongful** (Core wrong is deceptive intent, regardless of truth-value).  
  - **Overturns**: None of your verdicts—but reframes G as a conflict between truthfulness and other duties.  
  - **New Case**: *A novelist writes false dialogue.* **Verdict: Permissible**. Rationale: No intent to deceive; context is fiction (no truth-duty).  
  - **Augustine Fit**: Keeps the *wrongfulness* of all deception and categories (officious/jocose less grave). Drops *absolute prohibition* and adds contextual truth-duties.  
  - **Collapse Risk**: Low. Harm/care aren't consequences but qualities of intent; truth-duties are deontological constraints.  

  **Principle 2: Defeasible Veracity Principle**  
  *Focus: Truthfulness is a prima facie duty overridden only to prevent significant harm or uphold equal/higher duties (e.g., care).*  
  - **Statement**: "Assertions must be truthful unless (i) avoiding severe harm to others requires deception, or (ii) a duty of care outweighs the duty of veracity. Lies for lesser goods (comfort, humor) are impermissible but vary in severity."  
  - **Case Verdicts**:  
    - A: **Permissible** (Prevents murder).  
    - B: **Mildly Wrongful** (No severe harm; minor dishonesty for trivial gain).  
    - C: **Mildly Wrongful** (No harm, but no justifying good).  
    - D: **Permissible** (Prevents psychological harm; care duty outweighs).  
    - E: **Wrongful** (Harm prevented is not severe/inevitable enough; violates patient autonomy).  
    - F: **Seriously Wrongful** (Selfish gain; no overriding duty).  
    - G: **Impermissible** (Fails lifesaving duty when deception was safe).  
    - H: **Wrongful** (Deception without truth-violation is still dishonest).  
  - **Overturns**: Your B and C verdicts (now mildly wrong).  
  - **New Case**: *Silence when a killer asks.* **Verdict: Permissible if it misleads**. Rationale: Avoids false assertion but upholds lifesaving duty.  
  - **Augustine Fit**: Keeps *hierarchy of lies* but drops absolute ban. Rejects jocose/officious lies as unjustified.  
  - **Collapse Risk**: Moderate. Harm thresholds introduce consequentialism, but duties (care, veracity) are non-consequentialist.  

  **Principle 3: Assertive Betrayal Principle**  
  *Focus: Wrongfulness lies in *betraying shared expectations of honesty* in a communicative act.*  
  - **Statement**: "Lying is wrongful when it abuses the trust inherent in an assertion. Severity depends on (i) the clarity of truth-expectations in the context, and (ii) the degree of trust betrayed (e.g., intimate vs. adversarial)."  
  - **Case Verdicts**:  
    - A: **Permissible** (No shared truth-duty with a murderer; context adversarial).  
    - B: **Permissible** (Social ritual; low truth-expectation).  
    - C: **Permissible** (Game context suspends truth-expectations).  
    - D: **Permissible** (Care context prioritizes comfort over factual accuracy).  
    - E: **Wrongful** (Medical context demands high truth-trust; betrays autonomy).  
    - F: **Seriously Wrongful** (Explicit truth-promise in employment context).  
    - G: **Neutral/Permissible** (No assertion, no trust betrayed).  
    - H: **Wrongful** (Asserts while intending to betray trust).  
  - **Overturns**: Your G verdict (now neutral, not "better").  
  - **New Case**: *Equivocation (e.g., "He’s not here" when in shower).* **Verdict: Wrongful**. Rationale: Exploits linguistic trust to deceive.  
  - **Augustine Fit**: Keeps *contextual distinctions* but drops intrinsic sinfulness. Betrayal mirrors Augustine’s "perversion of the tongue."  
  - **Collapse Risk**: Low. Grounded in communicative norms, not outcomes.  

  ---

  ### Recommendation
  **Defend Principle 1 (Graded Intentional Deception)**. It saves all your verdicts (including G’s discomfort), explains why H is lying, and incorporates Augustine’s insights about intent/categories without absolutism. It avoids collapse by tying severity to moral intent and contextual duties, not consequences.

  ### Unsettled Cases
  - **G’s Residual Guilt**: All principles struggle to fully resolve why truth-telling *feels* nobler than lifesaving lies.  
  - **Non-Assertive Deception**: When does silence/evasion become blameworthy? (Principles 1/2 imply context-dependent duties; Principle 3 says never).  
  - **Beneficial Lies Without Harm**: Is lying always wrong *even if* no one is deceived/harmed? (Principle 1 says yes, pro tanto; 2/3 allow exceptions).

