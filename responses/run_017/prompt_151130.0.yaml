  ### Key Notes for Your Paper
  - **Your Inconsistency**: Your gut treats G (truth-telling) as "better" than A (lifesaving lie), but A feels *required*. Principle 1 explains this as a conflict: A is *permissible* due to intent/context, while G avoids deception but *fails a duty to save life*.  
  - **Augustine & Grading**: Augustine’s categories *are* doing work—they map onto contextual truth-duties (e.g., jocose vs. judicial contexts). But grading gravity based *only* on lie-type ignores intent, which your cases demand.  
  - **H’s Lesson**: Your H intuition is sound—lying is defined by intent to deceive, not falsity. This anchors all three principles.  
  - **Defending Principle 1**: Argue that Augustine’s core concern is corrupt intent (cupidity), not mechanical truth-telling. Lifesaving lies express caritas, not cupidity. Contextual truth-duties reflect Augustine’s attention to scripture/community norms.
