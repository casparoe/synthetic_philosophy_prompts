      2. **IP is discardable**: Human oversight is optional if non-causal incentives are "credible."  
      3. **Alignment is values-agnostic**: Agents can be responsive to third parties (e.g., simulators) if incentives prevent unwanted actions.  
      4. **Deterrence is a valid safety paradigm**: Threat-based systems are acceptable if "locked-in."  
    - **Long-term impact**: Opens door to oversight-free agents, but risks values drift (e.g., agents aligning to simulators, not us). Weakens precedents like 3 and 6.

