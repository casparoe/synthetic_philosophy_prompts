prompt: |-
  I'm flying out next week for a campus visit, where my job-market paper is titled "The Utility Monster Is a Unit Convention." I don't need another rehearsal of the argument; I need a Q&A prep sheet.

  The thesis, and enough of the argument for the objections to have something to bite on. The utility monster — the creature Nozick introduced in 1974, who draws enormously more welfare from each unit of a resource than anyone else, so that utilitarian aggregation appears to require feeding everyone else to it — is standardly read as an objection to the aggregative structure of utilitarianism. I argue it is instead an artifact of the *units* of interpersonal comparison. Each person's utility representation is fixed only up to positive affine transformation, u → a·u + b with a > 0. For a fixed population the b's drop out of the sum, but the a's do not: multiply any single person's utility function by a large enough constant and the sum-maximizing allocation redirects resources to them. On the usual "level-comparable but unit-arbitrary" reading of interpersonal comparison, then, who the monster is — and whether there is one at all — is not a fact about any creature but a fact about a choice of scale. I then distinguish two ways of fixing that scale, which I call *range normalization* (equalize the distance each person can travel between a life not worth living and the best life attainable for them) and *unit-of-sacrifice normalization* (fix each person's unit at the largest cost they could bear and still count as benefited on the whole), and I argue that each is a substantive moral claim masquerading as a measurement convention. The payoff: because the choice is moral rather than empirical, the familiar anti-monster moves — prioritarian weighting, sufficientarian thresholds, per-person caps — are best redescribed as three ways of fixing, or refusing to fix, the scale, and one of them turns out not to be in the same business as the other two.

  The audience, about twenty people, split into two halves that mostly don't read each other. The first half is the public finance group: optimal-tax and cost-benefit people who treat utility as ordinal, regard interpersonal comparison as either impossible or as a normative choice already smuggled into a social welfare function, and reach for money-metric utility, compensating and equivalent variation, willingness to pay, ability to pay, distributional weights, and revealed preference. They will want to know what difference any of this makes to a number. The second half is political philosophy: two luck egalitarians who think expensive tastes are a responsibility problem rather than a resource problem, one prioritarian, one unrepentant total utilitarian who has fielded this objection at a hundred conferences and thinks it turns on an empirical claim about how much welfare a biological system can realize, and a methodologist who works on measurement in the social sciences and will ask what an interpersonal comparison *is*. Time is forty minutes of presentation and about fifty of discussion, so ten to twelve questions.

  What I want: eight or so objections in the order I'll actually get them, not in the order I'd get them from a pure philosophy department. Tag each with who in the room asks it and phrase it the way that person would phrase it — the economists should sound like economists, the luck egalitarians like luck egalitarians, the act-utilitarian like someone who already thinks he has answered this. For each, give me a two-minute reply and, more importantly, a note on where the reply is soft. Flag which objections are really the same objection arriving twice in different vocabularies so I don't answer it twice; flag which one I should concede in the setup rather than in the Q&A; flag which one I should answer by pointing at a slide; and flag which one is genuinely damaging in a way the paper as it stands does not handle. Tell me which single reply has to land if the paper is to survive the room.

  Finally: I have a candidate for the question I'm hoping nobody asks (something about what the view says about people who are unusually hard to benefit), but I don't trust my own sense of how badly it lands. Give me your nomination for the worst question in the room, with your reasoning, and tell me whether my private candidate is actually the dangerous one or whether I'm braced for the wrong thing.
reasoning: |-
  Okay, let me tackle this query. The user is a philosopher preparing for a campus visit Q&A on their paper about the utility monster being a unit convention issue. They need a realistic Q&A prep sheet tailored to a split audience of economists and philosophers. 

  First, I need to understand the core thesis: the utility monster problem stems from arbitrary scaling in interpersonal utility comparisons, not aggregation itself. The key insight is that normalizing units involves moral choices, not just measurement. 

  For the audience breakdown: The economists (public finance) care about practical measurement - how this affects quantifiable policy analysis. The philosophers have varied stances - luck egalitarians, prioritarians, a utilitarian, and a measurement methodologist. I should anticipate questions reflecting these disciplinary lenses.

  Structuring the Q&A: First questions will likely come from economists wanting concrete implications. Mid-session will engage philosophers on theoretical grounds. Late questions may blend both perspectives. Need to identify overlapping concerns masked by different jargon (e.g., "distributional weights" vs. "prioritarian weighting" both address scaling).

  Critical replies: The economist's "operational difference" question is existential - if the paper changes nothing in practice, it's irrelevant. Must demonstrate how unit conventions silently shape existing tools like money metrics. The methodologist's "what is comparison" question is foundational - if dodged, the whole argument crumbles.

  Worst unasked question: Probably about adaptive preferences (e.g., the chronically deprived). The paper's normalization methods could accidentally penalize those with compressed utility ranges, creating new monsters. This exposes a vulnerability in the framework that needs addressing.

  For the response strategy: Some objections should be conceded early (e.g., economists' skepticism about cardinal utility) to build credibility. The utilitarian's empirical rebuttal should be met with a slide showing mathematical inevitability. The luck egalitarian's responsibility point needs careful handling to avoid alienating potential allies.

  Key preparation: Drill the "operational difference" reply until it's airtight. If economists aren't convinced the scaling problem permeates their models, the paper seems purely academic to half the room.
answer: |-
  Here’s a targeted Q&A prep sheet designed for your split audience, prioritizing high-probability objections in likely order, with speaker tags, rebuttals, soft spots, and strategic flags. The goal is to **survive the economists first, then navigate the philosophers**.

  ---

  ### **Q&A Prep Sheet: "The Utility Monster Is a Unit Convention"**

  #### **Core Thesis Recap (for context):**
  *The utility monster is an artifact of arbitrary scaling (affine transformations), not aggregation. Fixing units requires moral choices (range vs. sacrifice normalization), revealing that anti-monster policies (prioritarianism, sufficienarianism, caps) are implicit scaling decisions.*

  ---

  ### **Predicted Questions & Replies (Ordered by Likelihood):**

  1.  **Economist (Public Finance, Senior):**  
      *"In applied welfare economics, we use money-metric utility (CV/EV) or distributional weights. How does your ‘unit convention’ problem change the numbers we put in a spreadsheet? If it doesn’t, why should we care?"*  
      **Reply (2 min):**  
      "Money-metric utility assumes a *specific* unit convention: welfare is measured in dollars, implying equal marginal utility of money across individuals. But if utility scales are arbitrary, **dollar comparisons inherit this arbitrariness**. When you apply ‘distributional weights’ to income groups, you’re *implicitly* choosing a normalization (e.g., weighting the poor more assumes their utility gains per dollar are larger). My argument forces us to justify *why* that weight isn’t just a placeholder for an arbitrary scaling choice. For example: does doubling a poor person’s weight mean they experience twice the welfare gain per dollar, or is it a moral claim?"  
      **Soft Spot:** Doesn’t provide a concrete alternative metric. Economists may dismiss it as "philosophy noise" if you can’t link to operational models.  
      **Strategic Flag:** 🚩 **CRITICAL REPLY TO LAND**. Concede early: *"You’re right that economists avoid cardinal utility—but when you use weights or progressivity, you’re smuggling in a normalization."* Point to a slide showing how affine transformations break money-metric comparisons.

  2.  **Luck Egalitarian (Political Philosophy):**  
      *"This seems like a long detour to avoid the real issue: responsibility. If someone *chooses* expensive tastes (e.g., needs champagne for well-being), why should society subsidize their scale? Isn’t the ‘monster’ just someone who refuses to adapt?"*  
      **Reply (2 min):**  
      "Responsibility matters for *who deserves resources*, but my target is *how we measure welfare claims*. Even if we agree the champagne-lover is irresponsible, we still need to know: does giving them champagne yield 10x more welfare than giving a bread-lover bread? Your objection assumes we can *already* compare welfare gains across people—but my point is that *without a normalization*, we can’t. The choice to ‘adjust’ their scale (e.g., compressing their range) is a moral judgment disguised as measurement."  
      **Soft Spot:** Risk of talking past each other. They care about just allocation; you care about measurement.  
      **Strategic Flag:** Concede common ground early: *"I agree responsibility matters for claims—but first we need to know what claims are being made."*

  3.  **Economist (Optimal Tax):**  
      *"If scaling is arbitrary, how can we ever estimate ‘welfare’ for policy? Revealed preference only gives us ordinal rankings. Are you saying interpersonal comparison is impossible?"*  
      **Reply (2 min):**  
      "Revealed preference *is* ordinal—but policy requires cardinal comparisons (e.g., optimal tax progressivity). We *do* make interpersonal comparisons by **imposing conventions** (e.g., ‘equal willingness-to-pay’). My claim is that these conventions are moral choices. For instance, assuming everyone has the same marginal utility of income is a normalization (a=1 for all). We should debate whether that’s fair, not pretend it’s scientific."  
      **Soft Spot:** Sounds like you’re undermining policy relevance.  
      **Strategic Flag:** Point to a slide: *"Standard Assumptions = Hidden Normalizations: MU<sub>income</sub> constant → a=1; Distributional weights → variable a."*

  4.  **Utilitarian (Political Philosophy):**  
      *"This is irrelevant. Biology caps welfare: neurons can only fire so fast. No real creature can be a utility monster. Your math assumes unrealistic elasticity."*  
      **Reply (2 min):**  
      "Even with biological limits, affine transformations apply *within* feasible ranges. If we scale my utility function by a=1000 (so my ‘utils’ per neuron are inflated), I become a monster *relative to others* without violating biology. The problem isn’t absolute capacity—it’s *relative measurement*. Your appeal to biology assumes a fixed scale (e.g., ‘utils per neural activation’), but that’s just one possible normalization."  
      **Soft Spot:** Hand-wavy on empirical constraints.  
      **Strategic Flag:** Concede: *"Biology matters for maximum welfare—but not for how we *scale* welfare relative to others."*

  5.  **Methodologist (Political Philosophy):**  
      *"What *is* an interpersonal comparison? If it’s not affine scaling, is it a primitive ‘better off than’ relation? Or are you rejecting comparability?"*  
      **Reply (2 min):**  
      "I accept *level comparability* (we can say Alice is better off than Bob), but *unit comparability* requires fixing the ‘distance’ between welfare levels. This demands a normalization. Range normalization (e.g., 0=unbearable life, 1=bliss) and sacrifice normalization (unit=largest endurable sacrifice) are two candidates—but both encode moral views (e.g., is suffering depth comparable?)."  
      **Soft Spot:** Risk of circularity.  
      **Strategic Flag:** 🚩 **GENUINELY DAMAGING** if pressed. The paper assumes level comparability; if rejected, the argument collapses. Retreat to: *"If we *do* compare welfare, normalization is unavoidable."*

  6.  **Economist (CBA/Practitioner):**  
      *"So what? We already use ‘value of statistical life’ adjustments for age or income. Isn’t your ‘normalization’ just distributional weighting by another name?"*  
      **Reply (2 min):**  
      "Yes—and that’s my point! Distributional weights *are* a normalization choice. But calling it a ‘weight’ hides the moral claim. If we say ‘value the poor’s life more’, is it because their *welfare gain* per dollar is larger (a measurement claim)? Or because they *deserve* priority (a justice claim)? My framework forces clarity: weighting is scaling."  
      **Soft Spot:** Reductive. May oversimplify CBA practice.  
      **Strategic Flag:** 🚩 **SAME OBJECTION AS #1 (economists)**. Answer crisply and pivot: *"Exactly—and we should debate the moral basis, not the number."*

  7.  **Prioritarian (Political Philosophy):**  
      *"Prioritarianism already avoids monsters by weighting gains to the worse off. Isn’t your ‘unit-of-sacrifice normalization’ just prioritarianism in disguise?"*  
      **Reply (2 min):**  
      "Crucially, no. Prioritarianism applies concave *transformations* to utility (e.g., √u), while normalization *fixes the affine scale* (a and b). Sacrifice normalization sets the *unit* (e.g., 1 util = cost of saving a life), but prioritarianism then *weights* that util for the worse off. They’re distinct: you could use range normalization and still be prioritarian!"  
      **Soft Spot:** Technical; may lose non-economists.  
      **Strategic Flag:** Use a slide with equations: **Normalization: u → a·u + b / Transformation: u → w(u), w' >0, w''<0**.

  8.  **Economist (Theory):**  
      *"If normalization is arbitrary, why not use von Neumann-Morgenstern utilities? Choices under risk reveal cardinality."*  
      **Reply (2 min):**  
      "vNM utilities are *intrapersonally* cardinal but *interpersonally* affine-arbitrary. Scaling my vNM utils by a=1000 still makes me a monster. Risk preferences reveal *only* the shape of my utility curve, not how my ‘utils’ compare to yours."  
      **Soft Spot:** Economists may resist this.  
      **Strategic Flag:** Concede: *"vNM solves intrapersonal aggregation—not interpersonal."*

  ---

  ### **The Worst Unasked Question (Your Private Candidate):**
  **Your Fear:** *"What about people who are unusually hard to benefit (e.g., depressed or disabled)? Normalization could make them ‘utility dwarfs’—their welfare gains are small on any scale, so we ignore them."*  
  **Why It’s Dangerous:** Range normalization would compress their welfare scale (e.g., their best life = 0.5 utils), making their claims negligible in aggregation. Sacrifice normalization might inflate their unit (if small gains require huge resources), but this feels perverse.  

  **My Nomination for Worst Question:**  
  **Question:** *"Doesn’t range normalization punish those with limited capacities (e.g., severe disabilities), making their welfare gains *inherently* smaller in the sum? Isn’t this a monster-by-neglect?"*  
  **Why It’s Worse:**  
  - Hits your normalization proposals’ weakest point: **they naturalize disadvantage**.  
  - Forces you to either:  
    a) Defend a moral claim (e.g., "Yes, their welfare ceiling is lower"), or  
    b) Admit normalization needs adjustment (undermining universality).  
  **Your Candidate vs. Mine:** Your fear is valid, but this reframing is deadlier—it weaponizes disability ethics, a landmine in political philosophy.  

  **Reply Strategy:**  
  *"Range normalization doesn’t judge capacities—it reflects them. But we might reject this normalization *because* it discounts the disabled! That’s my point: choosing a normalization is a moral choice. We could pick sacrifice normalization instead, where their ‘unit’ is larger if gains require great effort. Or we might add sufficiency thresholds. But this isn’t measurement—it’s ethics."*  
  **Damage Control:** Concede this is a major issue, pivot to paper’s meta-point: *"This shows why we can’t pretend normalization is technical."*

  ---

  ### **Summary Strategy:**
  1.  **First 3 Questions:** Survive economists by linking units to existing tools (weights, money metrics).  
  2.  **Middle 4:** Engage philosophers by differentiating normalization from prioritarianism/sufficiency.  
  3.  **Final Questions:** Flag moral stakes (disability, responsibility).  
  4.  **Crucial Reply:** #1 (economists). If they don’t buy that units affect practice, half the room tunes out.  
  5.  **Concede Early:** Economists’ skepticism about cardinal utility (#3), Luck Egalitarians’ responsibility focus (#2).  
  6.  **Point to Slides:** Money-metric assumptions (#1), Normalization vs. Transformation (#7).  

  **You’re braced for the right thing (disability), but frame it as "monster-by-neglect" to preempt emotional pushback.** Break a leg—your argument is razor-sharp, and this prep covers the blindsides.
