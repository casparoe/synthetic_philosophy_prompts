prompt: |-
  I write novels, and most mornings as a warm-up I build myself a Bongard problem — six boxes on the left that share some feature, six on the right that don't — because for me it's show-don't-tell in its purest form: if the rule is any good, a reader picks it up from the pictures and never has to be told. My gut about which of my own problems are actually any good is all over the place though, and I want to know what I'm going by.

  - left convex, right concave: good problem
  - small shape inside the big one vs outside: good
  - even number of shapes vs odd: good, and I'm a little surprised it is
  - total number of straight segments in the box is prime vs composite: cheating, even though it's exactly as countable as the last one
  - exactly one shape touches the border of its box: good. But the logically identical version — zero shapes, or two or more, touch the border — I hate, and I can't say why, since its the same problem
  - symmetric under a half turn: good, even though it takes a minute to see
  - it's a triangle, OR a circle with a dot inside: bad, feels like two problems stapled together
  - the two shapes overlap by more than half of the smaller one: good. Apex angle greater than 60 degrees: cheap. Both are just thresholds on a continuum
  - looks like it's tipping over: I like it, even though I can't state it precisely, and even though I'd hate a rule like looks graceful
  - same rule, two sets of examples: convex vs concave where the right side is all spiky stars — bad problem. The same rule where the right side includes a couple of smooth dented blobs that kill the obvious wrong guess — good problem. So it's not only the rule.

  The one I keep flip-flopping on: every shape in the left box is different from every other one, on the right at least two match — a rule about something not happening.

  So: is there one principle that gets all these, or do I have to pick between something baroque that saves every verdict and something simple that overturns one or two? Tell me which of my verdicts it can't save, and what it says about the case I go back and forth on and about one case I haven't thought of. Lead with the principle itself in the first sentence, then the reasoning.
reasoning: |-
  Okay, the user writes novels and creates Bongard problems as a warm-up exercise. They're trying to figure out what makes a good Bongard problem versus a bad one. They've listed several examples with their own judgments—some they consider good, some bad—and they're struggling with a particular case about unique shapes versus duplicates. 

  Hmm, they want a unifying principle that explains all their verdicts. Let me look at their examples again. For instance, "left convex, right concave" is good, but "exactly one shape touches the border" is good while "zero or two or more touch" feels bad. Also, "unique shapes vs duplicates" is flip-floppy for them. 

  The key seems to be whether the rule is perceptually immediate. Like, convex vs concave is visually obvious, but counting primes requires abstract math. Even "symmetric under half turn" takes time but feels rewarding once seen. But "triangle or circle with dot" feels like two separate ideas crammed together—no single perceptual "aha." 

  Ah! And for the border-touching case: "exactly one" has a clear visual focus (that lone shape touching), while "zero or multiple" is vague—it's defined by absence or messiness. Same for unique shapes: spotting duplicates is easy, but verifying all-unique requires tedious comparison. 

  The principle crystallizes: good Bongard problems rely on a single, perceptually salient feature that’s either present/absent or categorically distinct. Bad ones force abstract computation, feel arbitrary, or fracture attention. 

  Now, testing this against their conflicted case: the unique-shapes rule. The principle says it should be borderline because while duplicates pop out, confirming uniqueness is effortful. That matches their flip-flopping! And for unmentioned cases, like "shapes are monochrome," it’d be good—color absence is instantly noticeable. 

  The neural net analogy nails it: the brain either "sees" it or doesn’t. No need for baroque explanations. Their gut reactions align with perceptual fluency, which is everything in "show-don’t-tell" contexts. Mystery solved.
answer: |-
  Your principle: **A good Bongard problem hinges on a rule where the *presence* or *singular, perceptually immediate category* of a feature is the defining distinction, not its *absence* or an *arbitrary threshold/computation*, and where the visual examples *directly trigger the relevant perceptual grouping or comparison* without requiring fragmented attention or abstract calculation.**

  Here's how this principle saves your verdicts and resolves your conflicts:

  1.  **Saves Your "Good" Verdicts:**
      *   **Convex/Concave, Small Inside/Outside, Symmetry under Half-Turn:** These are *singular, perceptually immediate categories*. The visual system readily groups shapes as "smoothly bulging," "containing," or "rotationally symmetric." The rule is defined by *presence* (of convexity, containment, symmetry).
      *   **Even/Odd Number of Shapes:** Surprisingly good because counting small numbers (1-6 shapes) is perceptually immediate (subitizing) and the *parity* (even/odd) becomes a salient, binary category derived directly from that immediate count. It's a *singular derived feature*.
      *   **Exactly One Shape Touches Border:** Good because the rule highlights the *presence* and *singularity* of a specific, visually trackable event (a shape touching the border). Your eye finds the toucher(s).
      *   **Shapes Overlap by >50%:** Good because while continuous, the distinction "mostly overlapping" vs. "not mostly overlapping" is a perceptually salient *category* related to relative position and size (does the smaller one look engulfed?).
      *   **"Looks Like Tipping Over":** Good because it triggers a strong *perceptual gestalt* (dynamic instability) based on shape, base contact, and center of mass. The rule *is* the percept.
      *   **Right Side Includes "Killer" Counterexamples:** Good because it forces the solver to find the *core perceptually salient feature* (e.g., smooth convexity) that unifies the left and excludes the right, including those tricky "almosts". It refines the perceptual category.

  2.  **Saves Your "Bad" Verdicts:**
      *   **Prime/Composite Straight Segments:** Bad ("cheating") because counting segments (beyond trivial cases) requires *abstract computation*, not perceptual immediacy. Determining primeness is a further abstract *calculation*, not a visual *category*.
      *   **Zero/Two+ Shapes Touch Border:** Bad because it defines the rule by the *absence* of a singular touch ("zero") or a *lack of singularity* ("two or more"). It lacks a positive, perceptually focal point. "Not exactly one" isn't a visual gestalt; it's a logical negation.
      *   **Triangle OR Circle with Dot Inside:** Bad ("stapled") because it forces *fragmented attention*. The solver must check for two entirely *disjoint* perceptual categories ("is it triangular?" OR "is it a circle containing a dot?"). There's no unifying visual gestalt.
      *   **Apex Angle >60 Degrees:** Bad ("cheap") because while continuous like overlap, ">60 degrees" is an *arbitrary numerical threshold* with no strong, immediate perceptual correlate like "mostly overlapping" has. It feels like measuring, not seeing.
      *   **Right Side All Spiky Stars (Convex vs Concave):** Bad because it fails the "killer example" test. It doesn't challenge the solver to find the *true salient feature* (smooth convexity); it overly relies on a caricature (spikiness = concave), making the rule *too obvious* and not refining the perception.

  3.  **Resolves Your Flip-Flop (Unique vs. Duplicate Shapes):**
      *   **The Problem:** "Left: All shapes unique. Right: At least two match."
      *   **Why Flip-Flop?** It straddles the principle.
          *   **The Bad Aspect (Why you might hate it):** Verifying "all unique" on the left requires a *negative check* – confirming the *absence* of any match. This involves pairwise comparisons, which is effortful, computational, and lacks a positive focal point. It's defined by the *lack* of duplication.
          *   **The Good Aspect (Why you might like it):** Spotting a duplicate on the right is perceptually immediate (*presence* of sameness). Your visual system is excellent at detecting identical shapes or very close matches. When a duplicate *exists*, it pops out.
      *   **The Principle's Verdict:** This problem is **weak** because the core rule defining the left side ("all unique") relies on the *absence* of a feature (duplication) and requires computational comparison. While the right side *can* provide the "aha!" moment (spotting the duplicate), the left side lacks its own positive gestalt. The rule isn't defined by a perceptually singular *presence* on the left. It feels like finding the rule by spotting the flaw on the right, not by seeing a unifying feature on the left. Your gut hesitation is justified.

  4.  **Predicts a Case You Haven't Thought Of: Color/Texture Rules**
      *   **Good:** "Left: All shapes solid fill. Right: All shapes have a striped pattern." (Defined by *presence* of a salient perceptual feature - solidity vs. pattern).
      *   **Bad:** "Left: Total number of red pixels is even. Right: Total number of red pixels is odd." (Requires *abstract computation and counting*, not perception of a category).
      *   **Borderline (Likely Bad):** "Left: Contains exactly one blue shape. Right: Contains zero or two or more blue shapes." (Similar to the border-touch problem - defined by *singularity* vs. *absence/lack of singularity*; "exactly one blue" is okay, "not exactly one blue" is weak).

  **In essence:** Your brain wants to *see* the rule instantly, as a unified visual gestalt or a single, directly perceivable property (or category derived immediately from perception like small-number parity). Rules requiring abstract calculation, logical negation ("not X"), verification of absence, arbitrary thresholds, or checking disjoint possibilities fracture that perceptual immediacy and feel "cheap," "stapled," or "computational." Your gut is reliably tracking whether the rule is processed by the visual-perceptual system or the abstract-reasoning system. Good Bongard problems are solved by the visual cortex; bad ones require the prefrontal cortex.
