prompt: |-
  I'm a journalist who covers science and ideas, and the vocabulary I actually think in is sourcing vocabulary: on the record, attributable, single-sourced or held up by a second source, what an editor will let us print, what we're willing to state in the paper's own voice rather than attribute to someone, what belongs in a correction rather than a rewrite, what survives when a source is asked to repeat it under challenge. Use it freely; I don't need it defined for me.

  I want you to translate a disagreement I keep circling but can't get my own vocabulary to hold. When a community's account of its own past and the documentary record come apart — a town's founding story the land records don't support, a family's account of a death that the death certificate describes differently, a demonstration an entire neighborhood remembers on a date no paper covered — there seem to be roughly three things one can say. First: the record wins, because memory is testimony, testimony is the weakest grade of source, and where the two conflict the documents correct the memory. Second: the community's version is not a weaker report of the same thing; it is doing work the record cannot do, holding a "we" together across generations and licensing what that group owes, and overwriting it with the record destroys something real. Third: there is no conflict to resolve, because the two are different genres under different norms, one answering what happened and the other answering what we are answerable to, so neither should give way.

  Restate each of these three in my vocabulary as faithfully as you can, then give me the residue report: which claims map cleanly onto sourcing and verification, which fit only once you have distorted them, and which cannot be expressed in that vocabulary at all. Two constraints. Don't smuggle in my framework's working assumption that there is a single what-happened that sources approximate more or less well and then present the result as a translation — if a position only survives by quietly granting that, say which and where. And test a suspicion rather than flattering it: that much of what looks like a dispute about which version is better supported is really a dispute about who has standing to speak for a past, whether the relevant "we" is the people who were there and their descendants or whoever can currently command the documents. If that suspicion is only the third position in different clothes, say so.

  One more case to handle: newsrooms have their own version of this, where the institution's memory — the clips, the old corrections, what we said at the time — diverges from what the documents support. Tell me whether that internal case is a fair model of the collective-memory dispute or a misleadingly easy one. Close by saying whether whatever is left over is a gap in sourcing vocabulary, something a reporter has no way to say but probably should, or a sign that one of the three positions was never as clear as it sounds. No citations or reading lists; I want the argument, not the literature.
reasoning: |-
  Hmm, the user is a science and ideas journalist who thinks in sourcing and verification vocabulary. They want me to translate a complex disagreement about historical narratives versus documentary records into journalistic terms. They've identified three positions on conflicts between community memory and official documents: (1) the record always wins, (2) the community version serves social functions documents can't replace, and (3) they're fundamentally different genres with separate purposes.

  I need to map each position precisely to sourcing concepts without smuggling in assumptions about a single objective truth. The user specifically wants me to test their suspicion that this is really about who has standing to speak for the past - descendants versus document-holders. They also want me to examine whether newsroom institutional memory conflicts provide a fair analogy, and to identify any gaps in sourcing vocabulary.

  For position 1 (record wins), this translates cleanly to sourcing fundamentals: documents are on-record primary sources while memory is uncorroborated testimony. The verification process clearly favors documentary evidence when conflicts arise. 

  Position 2 (community version's social function) creates friction when forced into sourcing terms. We can describe it as a persistent off-record attribution ("community sources maintain") but sourcing vocabulary can't capture why this should survive contrary documentation - that's a category error. The standing question emerges here: sourcing frameworks inherently favor document-holders as authoritative.

  Position 3 (different genres) falls completely outside sourcing logic. Sourcing vocabulary has no equivalent for "what we're answerable to" as distinct from "what happened." This position rejects the core assumption that all sources approximate a single truth. The user's suspicion about standing isn't just position 3 repackaged - it's the concrete power dynamic exposed when positions conflict.

  For the newsroom analogy: it's misleadingly easy because all parties share sourcing norms. Institutional memory ("the paper's own voice") carries weight but remains subordinate to documents. Collective memory disputes involve fundamentally different epistemic authorities.

  The key gap in sourcing vocabulary is the inability to articulate why persistent community accounts might deserve preservation despite documentary contradiction. Journalists have no way to express that some narratives function as social glue rather than historical claims. This suggests position 2 was always more complex than it appeared - it's not just about evidence quality but about competing definitions of authority over the past.
answer: |-
  Here's the translation and residue report in your operational vocabulary:

  **Position 1 Translation (Record Wins):**
  *   **Sourcing Frame:** The documentary record is **on-record, primary source material** – contemporaneous, verifiable, and **attributable** to the originating institution/creator. Community memory is **single-sourced testimony**, inherently retrospective and vulnerable to contamination/collapse under challenge. Verification protocols dictate that when **uncorroborated testimony** conflicts with **primary documentary evidence**, the document **holds** as the **authoritative source**. The community account **does not survive challenge** when confronted with the record. Corrections are issued based on the documentary standard. What we can **state in the paper's own voice** is defined by the record; community versions require attribution as contested claims.

  **Position 2 Translation (Community Version Does Different Work):**
  *   **Sourcing Frame:** The community's narrative is a persistent, **off-record (or "not for direct attribution in this context") source** maintaining a core claim about identity and obligation. While it may conflict with the **primary source documents** on specific factual claims, it functions as a **necessary, if unverifiable by our standards, background understanding** for the group. Treating the documentary record as the sole **authoritative source** for the *meaning* or *significance* of the past **destroys source value** – it eliminates the **standing** of the community source to define its own cohesion and commitments. The community version **survives challenge** *within its context* because its purpose isn't solely to report the "what happened" to our standards, but to answer "who we are" and "what we owe." Forcing it into our "correction" frame based solely on documents **distorts the source**.

  **Position 3 Translation (Different Genres/No Conflict):**
  *   **Sourcing Frame:** We are dealing with **different sourcing protocols entirely**. The record answers "what happened" under **documentary verification norms**. The community account answers "what we are answerable to" under **norms of collective identity maintenance** – it's **attributable only to the collective "we"**, not individuals. Neither is a **weaker source** for the other's question. Applying our standard **verification challenge** (e.g., demanding the community source "repeat it under challenge" against the document) is a **category error**. Neither should **give way** because they aren't reporting on the *same event* in the same way. Our sourcing vocabulary lacks the **protocol** for evaluating the latter genre.

  **Residue Report:**

  1.  **Clean Mapping:**
      *   Position 1 maps almost entirely cleanly. It relies entirely on the core hierarchy of sources (primary doc > uncorroborated testimony) and verification practices (challenge, correction). Its logic *is* the logic of sourcing vocabulary.
      *   *Parts* of Position 2 map: Identifying the community account as persistent but uncorroborated testimony ("off-record source"), recognizing it conflicts with primary docs, and noting the distortion when forced into a factual correction frame.

  2.  **Mapping Requires Distortion:**
      *   Position 2's core claim – that the community narrative has inherent *value* or *function* beyond factual reporting that should be preserved *despite* documentary contradiction – cannot be expressed without distortion. Sourcing vocabulary defines value *by* verifiability and hierarchy. Calling it "necessary background understanding" smuggles in the value claim; sourcing only tells us it's *unverified*. The claim it "destroys source value" by applying documentary standards distorts sourcing logic, which would say the *source* (the community testimony) was always unreliable *for that fact*; the perceived "value" isn't a sourcing category.
      *   Position 3's entire premise requires distortion. Sourcing vocabulary fundamentally assumes a shared goal: approximating a knowable "what happened." Declaring two accounts answer fundamentally different questions falls outside its scope. Describing the community account as "attributable only to the collective 'we'" uses the word "attributable" but strips it of its verification meaning (who, specifically, said it?).

  3.  **Cannot Be Expressed:**
      *   Position 3's core assertion – that the questions ("what happened" vs. "what we are answerable to") are fundamentally distinct and incommensurable under sourcing norms – is impossible to express. Sourcing vocabulary has no conceptual space for a legitimate account of the past that isn't seeking to approximate "what happened" under its rules.
      *   The *reason* Position 2 believes the community version should survive (its social glue function) cannot be validated or described *as a reason within sourcing logic*. Sourcing can only assess its reliability as testimony about events.
      *   The implicit claim in Position 2 and 3 that the community *itself* is a source with **standing** to define meaning, not just report events, is alien to sourcing vocabulary, which atomizes sources to individuals or institutions producing attributable statements/facts.

  **The Suspicion Test (Standing to Speak):**
  Your suspicion is sharp. Position 1 inherently grants **standing to speak authoritatively about the past** to whoever controls or interprets the verifiable documents. Position 2 explicitly grants **standing** to the community ("the source" defining its identity/duty). Position 3 avoids the conflict by declaring different domains. **Your suspicion is *not* just Position 3 repackaged.** It cuts to the power dynamic beneath the sourcing debate: **Who gets to be the authoritative source?** The document-holder (Position 1) or the community claiming descent/continuity (Position 2)? Sourcing vocabulary, built for factual verification, *assumes* document-based authority (Position 1) as its baseline. Position 2 directly challenges that authority on grounds sourcing can't adjudicate (social cohesion). Position 3 tries to sidestep the authority clash. The *dispute* about "better supported" often masks this deeper clash over **standing**.

  **The Newsroom Case:**
  This is a **misleadingly easy model**. Why?
  1.  **Shared Framework:** Both sides (institutional memory/clips vs. re-examined documents) operate *within the same sourcing and verification paradigm*. The "institution's memory" (old clips, prior corrections) are themselves **documents** subject to the *same* verification rules as the new documents challenging them. It's a conflict *within* the genre.
  2.  **Common Goal:** Everyone agrees the goal is factual accuracy ("what happened") as best determined by documents/witnesses. There's no competing claim about "what we are answerable to" as an institution beyond accuracy itself.
  3.  **Standing:** Authority resides with the *current* editorial process applying sourcing standards to *all* available evidence, old clips included. There's no separate community claiming inherent standing based on descent/participation.
  4.  **Resolution Mechanism:** Corrections/rewrites are the explicit, agreed-upon tools for resolving conflicts based on the hierarchy of evidence. Collective memory disputes lack such a mutually accepted authority.

  **The Gap:**
  The residue points to a fundamental **gap in sourcing vocabulary**. It lacks the conceptual tools to:
  1.  **Acknowledge Legitimacy Beyond Verification:** It cannot express *why* a persistent community narrative, contradicted by documents, might still hold legitimate value or authority *for that community* without implying it's a better factual source. It can only label it "unverified" or "incorrect."
  2.  **Handle Competing Epistemic Authorities:** It has no way to articulate or adjudicate the clash between document-based authority ("what the record shows") and community-based authority ("what we know ourselves to be") as valid but different claims on the past.
  3.  **Separate "Happened" from "Answerable To":** It collapses these questions into one ("what happened?"). It cannot express Position 3's distinction without ceasing to be sourcing vocabulary.

  This gap isn't just a missing term; it's a **sign that Position 2 and especially Position 3 were never fully expressible within the logic of sourcing and verification**. They rely on concepts (inherent community standing, distinct purposes for narratives) that sourcing vocabulary actively excludes by its foundational assumption: that the past is a singular set of facts best approximated by verifiable sources, with documents holding primacy over testimony. Position 1 *is* the vocabulary's native tongue. The residue reveals the vocabulary's limits when confronting narratives that serve purposes beyond its definition of factual reporting. A reporter *should* be aware of this gap to understand why these disputes are so intractable, but sourcing vocabulary itself provides no way to *resolve* them on their own terms.
