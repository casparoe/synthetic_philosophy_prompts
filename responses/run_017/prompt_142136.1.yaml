prompt: |-
  My flatmate is doing a PhD in computational neuroscience and every time we end up talking about philosophy of mind she falls back on the same move: the mind is to the brain as software is to hardware. She uses it for two things. First, to argue that psychology is autonomous from neuroscience — you can't read the program off the voltages, and the same program could be compiled onto completely different machines, so hunting for the neural basis of a belief is a category error. Second, more concretely, to argue that if someone built a detailed enough functional replica of a person's brain in silicon — a whole brain emulation, whatever the substrate — that thing would have the person's beliefs, memories, and everything else, because programs don't care what they run on. I've been reading around functionalism and multiple realizability on my own, and the analogy now seems to be doing way more work than anyone ever checks.

  A few things bug me specifically, and I'd rather you engage with these than give me a general essay. (1) In a computer the hardware/software boundary is engineered: signals are pushed to thresholds, everything is clocked and error-corrected, and the instruction set is written down in advance, so the fine-grained causal powers of the realizer really are screened off from the software level. Nothing like that is true of a brain — neuromodulators diffuse, temperature, glial stuff, and dendritic nonlinearities all bleed into what the "program" does, and there's no spec to compile against. So the analogy seems to smuggle in the exact thing that's at issue, namely that there's a level with a closed causal repertoire. Relatedly, the hardware side of a computer is itself described functionally (microcode, logic gates, transistors, doping), so the distinction reappears inside the hardware and you never reach a ground floor, which is awkward if what you wanted was two levels, mental and physical. (2) I can't work out what "the same program" even means when we have no formal description of the brain's organization. As far as I can tell, all we'd ever have is agreement on some finite batch of input-output pairs we happened to test, and there are always indefinitely many different programs that agree on those and diverge later. I've started calling that test-set realizability, and it makes me think the "compilation" step in the analogy is fake. (3) Even granting a functional organization, whether two systems share one seems to depend on the grain and the timescale you individuate states at: carve states finely enough and nothing is ever realized twice, carve them coarsely enough and everything is. And here's the case that got me: take the same transition table and run it on photonic hardware a million times faster, or on some slow wetware a million times slower. The analogy says, obviously, same mind, just faster or slower. But if anything mental has an in-built duration, or if what you care about is a life unfolding in world-time, that's not obvious at all. (4) There's a trade-off I keep tripping over: define mental states narrowly, by their causal relations to inputs, outputs and other states, and multiple realizability looks easy but the states stop looking much like beliefs; define them holistically, as the roles picked out by our entire folk theory of the mind, and it gets very hard for two different systems to share any state at all, since the roles are fixed by the whole network. The analogy seems to let people slide between those two pictures depending on which one helps in the moment.

  So: audit the analogy for me. Give me the correspondence table — what plays the role of the program, the machine, the compiler, the instruction set, the clock, the user, the crash, the port — and where each row breaks. Then separate the disanalogies that actually bite against each of my flatmate's two conclusions (the autonomy of psychology; the emulation having the same mental states) from the ones that are just noise. Tell me whether the conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them the whole time, and whether the two conclusions stand or fall together. And if there's a better analogy for what functionalism and multiple realizability actually claim — song and instrument, map and medium, whatever — tell me what it buys and what it costs. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating my question back at me.
reasoning: |-
  Alright, the user's flatmate uses the mind-brain/software-hardware analogy to argue for two things: psychology's autonomy from neuroscience and the feasibility of whole-brain emulation preserving mental states. The user has specific concerns about this analogy, especially regarding the engineered nature of computers versus the messy biology of brains, the ambiguity of "same program," issues with state individuation, and a trade-off in defining mental states.

  First, I need to address each of the user's points systematically. Point (1) highlights the engineered boundary in computers versus the brain's lack thereof. Computers have clear hierarchies like microcode and transistors, which are functionally defined, but brains don't. This challenges the idea of a closed causal level, which is crucial for autonomy. If the brain's physical details constantly influence higher functions, psychology might not be autonomous.

  For point (2), the problem of defining "the same program" without a formal spec is key. In computers, we have specifications, but for brains, we only have behavioral tests. This relates to multiple realizability—without a clear functional description, it's hard to claim two systems share the same mind. Test-set realizability means any emulation could diverge, undermining the emulation argument.

  Point (3) deals with temporal scaling. If an emulation runs much faster, does it have the same conscious experience? Duration might be intrinsic to mental states, so speed changes could alter the mind. This directly challenges whether a silicon replica preserves subjective experience.

  Point (4) is about the trade-off between narrow and holistic state definitions. Functionalism often slides between these, but strict holism makes multiple realizability nearly impossible. If mental states depend on an entire network, replicating that in silicon is implausible.

  Now, mapping the analogy components: program as mental states, hardware as brain, compiler as development, instruction set as neural architecture. Each has disanalogies. For example, the brain lacks a clear instruction set, and temporal properties matter in minds but not software.

  The key disanalogies biting against autonomy are the lack of causal screening and formal spec. Without these, psychology isn't cleanly separable. For emulation, temporal scaling and holistic states are problematic. Autonomy might survive weakly, but emulation is more threatened. They don't stand or fall together; emulation is harder to defend.

  A better analogy could be a biological system like an organ. However, this might not capture multiple realizability well. A map's abstraction could work but misses dynamics. The user needs an analogy that accounts for biology without over-engineering.

  The user's deeper needs: they want to challenge their flatmate's arguments effectively. They might seek clarity on functionalism's limits and whether alternative frameworks exist. They also need concise, structured counterpoints for their discussions, avoiding philosophical jargon. Ensuring the response is rigorous but accessible is essential, addressing both technical points and underlying skepticism about reductionism.
answer: |-
  ### Bottom line: The analogy smuggles artificial constraints that inflate functionalism's plausibility for both autonomy and emulation; while a weak autonomy thesis survives without it, the emulation claim critically depends on ignoring key disanalogies (especially temporal scaling and causal grain), and the two conclusions do not stand or fall together.

  ---

  ### Correspondence Table & Breakdown
  | **Computer Concept** | **Alleged Mind/Brain Analog** | **Where It Breaks** |
  |----------------------|-------------------------------|----------------------|
  | **Program**          | Mental states/computations    | No formal spec exists (per your pt. 2); brains lack discrete, stable "code" that can be isolated from biophysical noise. |
  | **Hardware**         | Biological brain              | Not engineered for modularity; causal effects bleed across levels (neuromodulation, glia, thermal noise) – no "screening off" (pt. 1). |
  | **Compiler**         | Development/evolution         | No target "instruction set"; neurodevelopment is messy, adaptive, and substrate-dependent (pt. 1). |
  | **Instruction Set**  | Neural architecture           | Brain "instructions" are emergent, context-sensitive, and not fixed (e.g., dendritic computations vary). |
  | **Clock**            | Neural oscillations?          | Brain rhythms are variable, multi-scale, and not globally synchronous; mental time isn't discrete cycles (pt. 3). |
  | **User**             | Environment/body              | Brains are constitutively coupled with bodies; no clean "input/output" separation like keyboards/screens. |
  | **Crash**            | Pathology (e.g., seizure)     | Brain failures are rarely total/computational; often degrade function while preserving partial operation. |
  | **Port**             | Cross-system compatibility?  | No evidence minds can "run" on arbitrary substrates with identical outputs (pt. 2, 4). |

  ---

  ### Disanalogies That Bite vs. Conclusions
  #### (A) Against Psychology's Autonomy:
  - **Critical:** **Lack of causal screening** (pt. 1). In computers, hardware details (e.g., electron mobility) don’t alter software *semantics*. In brains, physical details (e.g., dopamine diffusion rates) *constitutively* alter cognition (e.g., mood, attention). This undermines the claim that psychology is "autonomous" – neuroscience can intrude on psychological explanations.  
  - **Survivable:** A *weak* autonomy survives: psychology tracks patterns neuroscience might miss (e.g., belief networks). But it’s not "autonomous" like software; it’s more like a *higher-level description* of a chaotic system.  

  #### (B) Against Silicon Emulation Having Identical Mental States:
  - **Critical:**  
    1. **Temporal scaling** (pt. 3): Running a "mind" 1M× faster breaks lived temporality. A 10-year emulated "life" in 5 minutes lacks duration-dependent phenomena (e.g., boredom, anticipation, memory consolidation). Consciousness likely requires real-time embodiment.  
    2. **Holistic state individuation** (pt. 4): Defining "belief" narrowly (e.g., "if hungry, eat") is trivial. Defining it holistically (e.g., embedded in a life history) requires replicating the *entire causal web* – impossible for silicon without identical inputs/outputs *at all times*.  
    3. **No formal spec** (pt. 2): Without a brain "program," emulation is just behavioral mimicry. Divergent internal processing could yield identical outputs *now* but not later (e.g., a glitch masked by error-correction).  
  - **Fatal:** Emulation requires substrate-indifference, but temporal/biological embedding breaks this. A silicon "replica" might simulate behavior but lack qualia, intentionality, or a self.  

  #### Noise Disanalogies:
  - **Compiler/instruction set absence**: Irrelevant – functionalism doesn’t require them.  
  - **Hardware functional hierarchies** (pt. 1): True but not biting; functionalism accepts multiple levels.  
  - **Crash/user analogies**: Superficial; don’t impact core claims.  

  ---

  ### Do Conclusions Survive? 
  - **Autonomy**: Survives weakly *without the analogy*, as a pragmatic claim: psychology abstracts over neural messiness. But it’s not a *metaphysical* divide – neuroscience can constrain psychology.  
  - **Emulation**: **Collapses** under disanalogies. Temporal scaling and holistic states imply substrate matters for *having a mind*, not just implementing computations.  
  - **Stand or fall together?** **No.** Autonomy is about *explanation*; emulation is about *ontological identity*. You can accept psychology’s utility while denying silicon minds.  

  ---

  ### Better Analogy: **Biological Function (e.g., Kidney Filtration)**  
  - **What it buys**:  
    - Captures multiple realizability (dialysis machines filter blood too).  
    - Acknowledges biological constraints (temperature, chemical gradients affect function).  
    - Avoids computational baggage (no "program," just input-output processes).  
  - **What it costs**:  
    - Lends *less* support to emulation: a dialysis machine isn’t a "kidney."  
    - Undercuts strong functionalism – minds may be more substrate-dependent than filtration.  
    - Less intuitive for "representation" (e.g., beliefs as "filters"?).  

  **Verdict**: This analogy better reflects functionalism’s core (causal roles over substrate) but *still* fails for emulation due to temporal/holistic constraints. Functionalism’s plausibility hinges on ignoring time, biology, and meaning – which your critiques expose.
