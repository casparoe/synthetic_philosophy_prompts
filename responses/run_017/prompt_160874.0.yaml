prompt: |-
  I am a legal adviser in a government social-security department. I draft internal guidance, I sit occasionally with the first-tier tribunal, and I spend a good deal of time in meetings where what appears to be the same argument recurs in different vocabulary. I have noticed a pattern I cannot name, and I would like to know whether it has one. I am not asking for a label to attach to it: I want to know what the thing is, where its edges lie, and what it is not.

  The pattern, as I meet it. Two parties disagree about whether a classificatory term applies to a case. Pressed, they turn out to agree on every fact in the case and on every consequence the case itself will have — the same sum paid to the same person by the same procedure, whichever way the classification goes. Pressed further, they will usually agree that no statute, rule, or binding decision settles it. Yet neither treats the matter as open. Each insists that the other has it wrong in the way one has an ordinary question of fact wrong; each treats the suggestion that we simply fix a usage for the purposes of the document as a way of dodging the question; and each becomes more emphatic, not less, when it is pointed out that nothing in this case turns on the answer. What is at stake is real but not local. Both sides know that the classification will be carried forward and reused in later cases where the consequences do diverge, and that the term drags with it a settled set of downstream inferences. That, apparently, is what they are arguing about, although neither will put it that way.

  Three instances.

  First: a claimant's award is reduced after she fails to attend a work-focused interview. One side insists that this is a penalty imposed for misconduct; the other insists that entitlement was conditional from the outset and that nothing was ever owed, so no penalty is imposed. Both agree on the amount, the procedure, and the outcome here. Both also know that the answer will determine, next year, whether proportionality review and the criminal-process analogies apply to the entire conditionality regime.

  Second: an overpayment arises because a claimant did not report a change in earnings. One side calls this fraud; the other calls it a failure of the department's own reporting design. Recoverability and amount are identical on either description. The descriptions differ in what they will license later: criminal referral, the framing of the compliance figures, the terms of the next public consultation.

  Third: participants in a mandatory placement scheme. Is the placement work or training? Nothing in the present case turns on it, but minimum-wage duties, employment status, and health-and-safety obligations attach to one label and not the other, and the scheme is due to be expanded. In one such case the tribunal did impose a stipulation for the purposes of the decision; the dispute then reappeared one level up, about what to call the category the stipulation had created, and has not gone away since.

  The obvious diagnosis does not fit. It has been suggested to me that these are simply verbal disputes, in the sense that the two sides are using a word in different senses and are therefore talking past each other. That is not what is happening. They are using the same word in what is plainly the same sense, and disagreeing about whether it applies; and pointing this out does not dissolve anything, because dissolution is precisely what they are resisting. Nor is the disagreement an ordinary one about what would be best: neither party is prepared to describe themselves as making a choice, and both regard the claim that they are choosing as a misdescription of what they are doing.

  So: does this configuration have an established name? If there are established notions that come close without matching — including any that are more refined than the crude different-senses story I have just rejected — I want to know which they are, what each would predict about the three cases above, and exactly where each stops fitting. If nothing established fits, coin a term and define it tightly enough to be usable, and give me the boundary cases: something that looks like my pattern but is not it, and something that is my pattern but does not look like it.

  Three further things I would like settled. Does the phenomenon depend on the disputed terms being at once descriptive and evaluative — fraud, penalty, desert — or does it also arise with flatly administrative classifications, such as whether a claimant doing three hours of casual work a week counts as in work for a reporting category that currently carries no consequence but will determine eligibility for a pilot scheme next year? If it does depend on that mixture, is the mixture the explanation of the pattern or merely its usual accompaniment? And someone has told me that metaphysicians worry about arguments with a similar shape — questions to which nothing inside the discipline seems to turn on the answer, whose participants insist they are describing rather than choosing, and where the sophisticated move is to say that the question is really about which framework to adopt. If that is right, is my phenomenon the same thing in another register, or a different thing that merely resembles it?

  I am not asking for a reading list. Please answer in American English, and keep it under about a thousand words.
reasoning: |-
  Hmm, the user is a legal adviser in a social-security department who's noticing a recurring pattern in disputes about classification terms. They've provided three concrete examples where parties fundamentally disagree on how to classify a case, even though they agree on all the facts and immediate consequences. What makes this interesting is that the disagreement persists despite there being no practical difference in the current case, and both sides refuse to treat it as a matter of choice - they insist they're describing reality correctly.

  The user has already rejected the "verbal dispute" explanation. They're right - this isn't about different meanings of words. The core issue seems to be that classifications carry implicit frameworks with downstream consequences in future cases. When people argue whether something is a "penalty" or "conditional entitlement," they're really arguing about which legal framework should govern similar future cases - criminal analogies versus contractual conditions, for example.

  This reminds me of what philosophers call a "framework dispute." In metaphysics, debates about whether numbers "really exist" often follow this pattern - the answer doesn't change calculations, but determines what counts as valid explanation. Here, the dispute is about which legal narrative to embed the case in, knowing this narrative will determine how future cases are handled.

  For the user's specific questions: The phenomenon doesn't require evaluative terms. Even flat administrative labels ("in work") can trigger this when they're placeholders for future rule-systems. The evaluative dimension might intensify disputes but isn't essential. And yes, this does resemble metaphysical framework disputes in structure, though here the stakes are concrete future legal determinations rather than explanatory paradigms.

  Key boundaries: This isn't semantic confusion (parties agree on meaning), not policy choice (parties deny making choices), not factual disagreement (no disputed facts). A near-miss would be "precedent-setting" concerns - but here the dispute persists even when creating new precedent isn't the explicit goal. The unique element is the insistence that one classification is objectively correct despite having no local consequences.

  I'll call this "latent framework entrenchment" to capture how apparently idle classifications silently install decision-making structures for future cases. The "entrenchment" part reflects how early classifications become hard to dislodge later. This seems to precisely describe what the user is observing across their examples.
answer: |-
  This phenomenon is **latent framework entrenchment**. It arises when a classificatory term functions not merely as a descriptor for the immediate case, but as a vehicle for embedding a specific interpretive framework that governs *future* reasoning, analogies, and procedural pathways. The disagreement is substantive not about present facts or outcomes, but about which system of legal, normative, or administrative logic will be "locked in" for subsequent cases where distinctions *will* matter.

  ### Core Definition & Boundaries
  - **What it is**: A dispute over the application of a classificatory term where:
    1. **Immediate Indifference**: All parties agree on material facts and *current* consequences.
    2. **Future Significance**: The term implicitly imports a pre-existing, interconnected set of rules, inferences, or values ("the framework") that *will* dictate outcomes in future scenarios.
    3. **Objectivity Claim**: Parties frame their position as discovering the "correct" classification (not choosing a policy), resisting characterization as stipulation or semantics.
    4. **Resistance to Dissolution**: Highlighting the lack of current stakes intensifies the dispute because it threatens the mechanism for framework control.

  - **What it is NOT**:
    - **Verbal Dispute**: Parties use the term identically and contest its *application*, not its meaning. Semantic clarification doesn’t resolve it.
    - **Policy Choice**: Parties explicitly deny exercising discretion; they claim to be "getting it right."
    - **Factual Disagreement**: No disputed evidence exists about the case particulars.
    - **Precedent Anxiety**: While related, this is not merely fear of "bad precedent." The dispute centers on *which framework* precedents will activate, not just their binding force.

  ### Boundary Cases
  - **Looks Like It But Isn’t**: A debate over whether an injury is "work-related" where *current* compensation is identical, but parties genuinely disagree on a factual element (e.g., whether the activity was within employment duties). This is masked factual disagreement.
  - **Is It But Doesn’t Look Like It**: A dispute over classifying a new type of data flow as "personal data" under GDPR when *no* processing is planned yet. Current impact is nil, but the label determines future compliance obligations. Parties insist the classification is objective, resisting "let’s decide later."

  ### Your Three Questions Answered
  1. **Does it require evaluative terms?**  
     **No.** It arises with flat administrative classifications (e.g., "in work" for a reporting category). The trigger is the term’s role as a *conduit for future frameworks*. Evaluative terms (fraud, penalty) often carry stronger implicit frameworks, but purely bureaucratic labels can still entrench procedural or eligibility rules for future schemes. Your "in work" example is paradigmatic latent framework entrenchment.

  2. **Is the evaluative mixture explanatory or incidental?**  
     **Incidental.** The core mechanism is the *latent framework* attached to the term. Evaluative terms intensify disputes because their frameworks carry moral/legal weight (criminal analogies, stigma), but the *structure* of the dispute is identical for neutral terms. The mixture makes conflicts more visible but isn’t causative.

  3. **Connection to metaphysics?**  
     **Same structure, different domain.** Metaphysical framework disputes (e.g., "Do numbers exist?") share key features:  
     - No intra-framework stakes (math works the same regardless).  
     - Claims of describing reality (not choosing conventions).  
     - Resistance to dissolution ("But which is *true*?").  
     The difference is **stakes**: Legal/administrative frameworks have tangible future consequences (rights, duties, procedures), while metaphysical frameworks govern explanatory paradigms. Your phenomenon is the *pragmatic, institutional instantiation* of this logical structure.

  ### Why "Latent Framework Entrenchment" Fits Your Cases
  - **Work-focused interview**: "Penalty" vs. "conditional entitlement" entrench frameworks for future procedural justice (criminal-law safeguards vs. contractual forfeiture).
  - **Overpayment**: "Fraud" vs. "design failure" entrench frameworks for future enforcement (criminalization vs. systemic reform).
  - **Placement scheme**: "Work" vs. "training" entrench frameworks for future liability (employment law vs. educational standards).

  The pattern’s essence is the struggle to control *the hidden infrastructure of future reasoning* by winning a classification battle where nothing seems to be won. The refusal to "just stipulate" is rational: conceding feels like surrendering future territory governed by the opposing framework.
