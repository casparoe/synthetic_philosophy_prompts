  For the parole algorithm case... tricky. Douglass focused intensely on intentional human cruelty, but his later writings show awareness of systemic injustice. Probably he'd care more about the caste-like outcome than intent. Still, the user should let this tension breathe - having Douglass initially skeptical of "faceless math" but convinced by the pattern could make great drama.

  Biggest insight: Douglass wouldn't care about "original meaning" as an end in itself. For him, constitutional interpretation was always in service of liberation. The judge might sting him by asking if that makes law just politics by another name - a cutting question for someone who revered the rule of law.

  The user's clearly done their homework. Their "dumb theory" is actually sharp - the contractarian critique is exactly where Douglass would attack modern originalism. His rebuttal to the judge would be thunderous: "Your tradition is built on my exclusion!"
