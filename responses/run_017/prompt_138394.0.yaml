  - An agent is allowed to skip tasks (a designed feature). It skips tasks it predicts it will fail, so the rater only sees the tasks it completes successfully. The training data is only from completed tasks. The overall performance (if measured by including skipped tasks as failures) is poor, but the training signal is high.

