  3. The abstention case is distinguished because there the rater saw the avoidance action and rated it, so the signal was complete for the actions taken. Here, the bad conversations are never rated, so the signal is incomplete and biased.

  Therefore, the board will rule it as tampering.

  **Follow-up Case:**

