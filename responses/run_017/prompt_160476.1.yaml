prompt: |-
  I spent most of last night arguing with a friend who works for a victims' support NGO about a case our commission is about to hear, and I still can't tell whether our own precedent set settles it or just looks like it does. Her position is that amnesty is, at bottom, a currency the political community spends to buy truth it cannot get any other way, and that once you accept that, the identity of the seller and the purity of the seller's motives are beside the point — what matters is what the disclosure buys for victims and whether immunity is the least the state can give in exchange. My position is that amnesty is constitutively personal: it is something a natural person does when they stand up in a public hearing, avow their own acts, submit to being questioned by the people they harmed, and are judged to have acted with a political objective that a successor society can recognise as political even while condemning it. On her reading a company with a better archive than the state is just a very efficient witness; on mine it is not the kind of thing that can apply at all, and offering it immunity would convert the process from an exchange of accountability for truth into a purchase of information from a party that feels no accountability. I need to write a draft recommendation for the committee by Friday, and I want to know which of us our own track record actually supports.

  Here is the record I have to work with, in the order the decisions came down. One: amnesty granted to a conscript who shot two men at a roadblock, after a full account and a finding that the killings were associated with a political objective. Two: amnesty refused to the section commander above him, who also disclosed everything, on the ground that the raid he ordered was grossly disproportionate to any political objective — the committee called it punitive rather than political. Three: amnesty refused to an applicant who confessed his own role in detail but would not name his handler or point to where the bodies were, the committee holding that full disclosure includes the chain of command and the recovery of remains. Four: amnesty granted, conditionally, to two applicants for a cross-border raid in which all the dead were nationals of a neighbouring state; the conditions were a hearing held in the affected communities and a reparation order, and the reasoning was that the community the act was done to must have a real role in the process. Five: the committee declined to entertain an application from an editor who had incited violence in print but had committed no act himself and whose account told it nothing new, saying that amnesty relieves liability for specific acts and is not available as a declaratory finding of blamelessness for someone with nothing to be relieved of. Six: amnesty granted, over a dissent, to a clerical worker who never used violence but passed lists of names to the security branch, one of which led to a killing; the majority said his account revealed how the informer network actually functioned, which no one above him had explained. Seven: the committee refused to let an applicant's offer to fund a clinic in the affected village count toward his application, saying reparative contributions cannot be traded for amnesty, though it recorded the offer separately in its findings. And there is one internal tension I should flag honestly: in an early decision the committee granted amnesty to a man whose account largely duplicated a police docket, saying the value lay in public corroboration from the perpetrator's own mouth, while in a later one it refused an applicant who had disclosed only what was already in the docket, saying he had told the commission nothing it did not have.

  The case in front of us now is a mining company, Kalkrand Consolidated, which has come in voluntarily and handed over a complete personnel-and-transport archive covering 1978 to 1991. On the company's own account it supplied the security branch with payroll and housing data used to identify union organisers, provided vehicles and a disused compound that it knew was being used for interrogation, and paid a bonus to the liaison officer who made the arrangements; it says expressly that its motive was to protect production and its share price, and that it would have done the same under any government, which is to say it disclaims a political objective rather than claiming one. The archive names two regional commanders who ordered a 1984 massacre at a hostel and gives the burial sites — disclosure no individual applicant has given us in nine years, and which the families say they want more than anything. It offers a large reparations fund and to pay for the exhumations. In return it asks for a finding that it has no further civil liability to the victims' families, for immunity from prosecution for its present board (none of whom were employed by the company before the transition, though two are children of the era's executives), and for its name to be kept out of the section of our final report on those who profited. The dead were mostly migrant workers from the neighbouring state, most are dead, and the survivors are its citizens; that state has just opened its own commission and has written to us asking that no amnesty be granted and that the archive be transferred to it instead. The families are split, some supporting the deal because they want the bodies, some opposing it because they want the executives in court.

  So, three things. First: what are the two or three rules that fit all seven of our precedents equally well, and what does each predict here — I take it one rule makes the grant turn on what the disclosure buys, another on whether the applicant is a natural person who avows their own politically motivated acts, and a third on whether the affected community has had a real role, but I want them stated sharply enough to see where they come apart. Second: give me your best guess at the decision and, more usefully, which precedent is the closest analog and why, together with an honest statement of what principle we would be adopting whichever way we go — including what it means if we take the company's money for exhumations while refusing to count it toward the application. And third: name the single further case that would best tell my friend's rule and mine apart, with what each verdict on it would show us — I have in mind something like the company's former personnel director, now elderly and ill, offering the same archive with a full personal account and agreeing to a public hearing, and also something like a corporation whose records duplicate material we already hold, but I want you to say which of those does the discriminating work and why. If our precedents genuinely underdetermine the case, say so and tell me which of them we would have to overrule or distinguish to go the other way.
reasoning: |-
  Okay, the user is grappling with a complex legal and ethical dilemma regarding amnesty applications before a commission. They've presented a detailed record of past decisions and a current case involving a mining company seeking amnesty in exchange for valuable archives. 

  The core tension is between two philosophical approaches: their friend's utilitarian view that amnesty is a currency for truth, and their own view that amnesty requires personal accountability from natural persons. The user needs to draft a recommendation by Friday and wants to know which approach their commission's precedents support.

  Looking at the seven precedents, several patterns emerge. First, amnesty consistently requires personal acts (Decision 5 rejects amnesty for someone without direct acts). Second, political motivation is necessary but not sufficient (Decision 2 rejects disproportionate actions). Third, full disclosure includes chain of command and remains (Decision 3). Fourth, affected communities must participate (Decision 4). Fifth, reparations can't replace amnesty requirements (Decision 7). 

  For the mining company case, these precedents create tension. The company isn't a natural person (violating the personal acts principle) and lacks political motivation (violating the political objective requirement). But its archives provide unprecedented truth - exactly what the utilitarian approach values most.

  The closest precedent is Decision 6 (the clerical worker), which granted amnesty for non-violent acts that revealed systemic truth. But that case involved a natural person. The company case would require extending this logic to corporations - a significant step.

  If the commission grants amnesty, they'd be adopting the utilitarian view that truth-value can override personal accountability. If they deny, they uphold the personal accountability principle but lose crucial information. The compromise might be to take the archives (perhaps under subpoena) while denying amnesty, using Decision 7's approach of separating reparations from amnesty decisions.

  The best test case would be the hypothetical of the elderly personnel director. Granting amnesty to that individual while denying the corporation would show the commission values personal accountability over corporate truth-telling. That case perfectly isolates the natural person requirement.

  Ultimately the precedents lean toward denying corporate amnesty, but the truth-value is so high that the commission might need to explicitly distinguish or modify their approach. The user should acknowledge this tension in their recommendation and propose clear criteria for any exceptional corporate amnesty.
answer: |-
  Based on your precedents and the core principles they reveal, here's a structured analysis addressing your three requests:

  ### 1. Core Rules from Precedents & Predictions for Kalkrand
  *   **Rule 1: Personal Accountability & Political Nexus:** Amnesty requires a **natural person** to **avow their own specific acts** (Decisions 1, 2, 3, 5, 6) committed with a **recognizable political objective** (Decisions 1, 2, 4) *or* (in the case of non-violent acts) a clear connection to the political conflict that advances truth (Decision 6). Motive purity is irrelevant, but the *objective* must be political (Decision 1 vs. 2). *Prediction for Kalkrand:* **Denial.** The company is not a natural person, its disclosed acts (supplying data, vehicles, facilities) were motivated by profit/production protection (not a political objective), and it disclaims any political objective. The board members seeking immunity did not commit the acts.

  *   **Rule 2: Truth Purchase via Full Disclosure:** Amnesty is granted when the applicant provides **full disclosure** (Decisions 1, 3, 4, 6) that **reveals significant, otherwise unobtainable truth** (Decisions 1, 3, 4, 6) about specific acts, perpetrators, chains of command, or systemic mechanisms, *even if* the applicant isn't the primary actor (Decision 6) or the acts weren't directly violent (Decision 6). Disclosure must include command structures and remains locations if known/applicable (Decision 3). *Prediction for Kalkrand:* **Grant.** The archive provides unprecedented truth (commanders, burial sites, systemic collaboration mechanism) deemed vital by families, fulfilling the core "truth purchase" function, despite the corporate form and lack of political motive.

  *   **Rule 3: Community-Centric Process:** The process must meaningfully involve the **affected community** in evaluating the act and the amnesty (Decision 4), and reparations are distinct from the amnesty bargain (Decision 7). *Prediction for Kalkrand:* **Conditional Grant/Complexity.** The affected community is fractured and transnational. Granting solely based on the archive risks bypassing community voice. A conditional grant (like Decision 4) requiring hearings *involving both nations' communities* and reparations might align best. However, the company's request to avoid the "profited" section conflicts with community-centric truth.

  **Where Rules Come Apart:** Kalkrand perfectly highlights the conflict. Rule 1 (Personal Accountability) demands denial. Rule 2 (Truth Purchase) strongly suggests grant. Rule 3 (Community) points towards a complex, conditional process potentially at odds with the company's terms (e.g., hiding its profit).

  ### 2. Best Guess, Closest Precedent & Adopted Principle
  *   **Best Guess:** **Denial of Amnesty.** Precedents overwhelmingly anchor amnesty in *personal* acts and *personal* avowal by a natural person (Decisions 1, 2, 3, 5, 6). The *only* partial bridge (Decision 6) involved a *person* whose non-violent act revealed systemic truth. Kalkrand, as a corporation, fundamentally fails the "natural person" and "personal avowal" tests. Its self-serving motive and disclaimer of political objective further weaken its case under Rule 1. Granting would fundamentally alter the constitutive nature of amnesty as established.
  *   **Closest Precedent:** **Decision 5 (Editor) & Decision 6 (Clerical Worker) - in tension.** Like the Editor, Kalkrand didn't commit direct violent acts *and* seeks declaratory relief/immunity for others. Like the Clerical Worker, it provided systemic information. However, the *crucial distinction* is that the Clerical Worker was a *natural person avowing his own specific acts*. Decision 5 is the stronger analog regarding *who* can apply. Decision 6 shows the value of systemic truth from a minor actor, *but only when that actor is a person*.
  *   **Principle Adopted by Granting:** If granted, the principle would be: **"The imperative of obtaining otherwise inaccessible, vital truth for victims outweighs the requirement for amnesty to be tied to the personal accountability of a natural person perpetrator."** This elevates Rule 2 (Truth Purchase) above Rule 1 (Personal Accountability) as the constitutive core. Amnesty becomes primarily an information procurement tool, decoupled from individual reckoning.
  *   **Principle Adopted by Denying:** **"Amnesty is fundamentally a personal act of public accountability by a natural person for their own politically-connected acts, enabled by full disclosure."** This reaffirms Rule 1 as paramount. Truth from other sources (like corporate archives) is valuable but must be obtained through other mechanisms (subpoena, cooperation agreements, civil discovery), not by distorting the amnesty process designed for individuals.
  *   **Taking Money for Exhumations While Refusing Amnesty (Decision 7 Principle):** This follows **Decision 7** strictly: **Reparations and the amnesty process are distinct.** Accepting funds for exhumations is a separate act of facilitating justice/reparations, acknowledging the archive's value for *recovery*, without conflating it with the *accountability bargain* inherent in amnesty. It signals that the truth has operational value for victims, but the *source* (an unaccountable corporation) doesn't meet the threshold for the specific legal/political act of amnesty.

  ### 3. The Discriminating Test Case
  *   **The Case:** **The elderly, terminally ill former Personnel Director** of Kalkrand comes forward. He offers the *identical archive* but **also provides a full personal account**: avowing *his own specific acts* (e.g., personally compiling/sending lists, authorizing vehicle use, approving the bonus) under orders from executives/security branch. He admits knowing the data/facilities were used for repression and states his motive was mixed (keeping his job/company loyalty, fearing regime consequences, perhaps a belief it maintained "order"). He agrees to a full public hearing with affected communities.
  *   **Why it Discriminates:** This perfectly isolates the "natural person avowal" element.
      *   **Under Your Rule (Personal Accountability):** **Grant likely.** He is a natural person avowing *his own specific acts* (like the Clerical Worker). His motive is less important than his acts being part of the political conflict (Decision 1, 6). The truth value is immense.
      *   **Under Your Friend's Rule (Truth Currency):** **Grant.** The truth purchased is identical to what the corporation offered. The "seller" being a person is irrelevant; the currency (amnesty) buys the same truth.
      *   **What Each Verdict Shows:**
          *   *Granting Him Amnesty:* Shows the commission prioritizes the *act of personal reckoning* alongside the truth. His presence and avowal add a dimension the corporate application lacks, fitting the precedent mold. It upholds Rule 1 *while* securing Rule 2.
          *   *Denying Him Amnesty (while potentially granting the corporation):* Would be logically incoherent and demonstrate a pure Rule 2 (Truth Currency) stance, valuing the *information* itself over the *source* and the *process of personal accountability*. It would severely undermine the personal nature of amnesty established in precedents 1, 2, 3, 5, 6.
          *   *(Hypothetical: Denying Both? Possible if his acts/motive were deemed purely economic/criminal with no political nexus, but unlikely given context).*

  **Why the Other Case (Corp w/ Duplicate Records) is Less Discriminating:** Denying amnesty to a corporation offering only duplicate records (like the later individual case) simply reaffirms the "full disclosure of *new* truth" requirement (Rule 2), which *both* you and your friend likely agree on. It doesn't force a choice between personal avowal and truth value; both rules would predict denial.

  **Conclusion on Precedents:** The precedents **strongly favor denial** for Kalkrand. They consistently tie amnesty to natural persons avowing their own acts. Decision 6 (Clerical Worker) is the closest to systemic truth from a minor actor, but crucially, it involved a *person*. Granting corporate amnesty would require **distinguishing or modifying the core principle established in Decisions 1, 3, 5, and 6** that the applicant must be a natural person avowing *their own* acts. It would effectively mean adopting the principle that truth value can supersede the requirement for personal accountability in the amnesty process itself. **Decision 5 (Editor)** is the clearest precedent *against* granting declaratory relief/immunity to someone who didn't commit specific acts needing relief.

  **Recommendation Draft Core:** Your draft should argue that while Kalkrand's archive is invaluable and should be secured (potentially via subpoena if cooperation falters), and its reparations offer for exhumations should be accepted (separately, per Decision 7), **amnesty is not the appropriate mechanism for a corporate entity**. Amnesty requires a natural person to stand, avow their own acts, and submit to the community. Granting it here would fundamentally alter the nature of the process established by precedent from one of personal accountability to one of corporate information brokerage. Precedents 1, 3, 5, and 6 anchor amnesty in the individual. The commission should seek the truth through other means without compromising this core principle. The Personnel Director hypothetical illustrates the distinction the commission should uphold.
