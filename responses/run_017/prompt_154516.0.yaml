answer: |-
  Here's a systematic breakdown of the "revolutions devour their own children" aphorism, its potential claims, their validity, and its relevance to your historiographical debate, culminating in a committed assessment.

  **I. Deconstructing the Aphorism: Claim Types & Verdicts**

  1.  **Frequency Claim:** "A large share of revolutions purge prominent early participants."
      *   **Verdict:** **Substantive but Probably False (with caveats).** *Reasoning:* While high-profile purges occur in many revolutions (French, Russian, Iranian, English), many revolutions (e.g., American, Glorious, several 19th-century Latin American, Velvet Revolutions) did *not* systematically purge their core early leaders *after* victory. The claim overgeneralizes. The "share" depends heavily on the definition of "revolution" and "purge." If including coups or civil wars, the frequency might rise, but this dilutes the meaning.

  2.  **Mechanism Claim (Coalition Heterogeneity):** "The initial revolutionary coalition is broad and heterogeneous. Consolidating power necessitates shedding factions at the extremes to achieve coherence and stability."
      *   **Verdict:** **Substantive and Defensible.** *Reasoning:* This is a well-established political science observation. Revolutions often unite diverse groups against a common enemy (Ancien Régime, Tsarism, Shah). Once in power, deep ideological, strategic, and interest-based differences emerge. Eliminating rivals becomes a rational (if brutal) strategy for factions seeking to control the new state's direction. This applies to Girondins vs. Montagnards, Bolsheviks vs. SRs/Mensheviks, etc.

  3.  **Mechanism Claim (Functional - Threat Elimination):** "Early revolutionaries possess the specific skills, networks, and militias for regime overthrow, making them the principal threat to the new regime they helped create. Devouring is state consolidation."
      *   **Verdict:** **Substantive and Defensible.** *Reasoning:* This complements the coalition claim. Danton, Trotsky, or Hébert commanded networks, popular support, and revolutionary legitimacy. They represented alternative power centers. Eliminating them wasn't necessarily about ideological purity *per se*, but about monopolizing the means of coercion and political authority – a core task of state-building, especially under stress. The revolutionary *state* devours potential rivals.

  4.  **Lawlike Necessity Claim:** "It is an inevitable, universal law of revolutions that they *must* devour their own children."
      *   **Verdict:** **Confused and Probably False.** *Reasoning:* This transforms a frequent pattern or plausible mechanism into historical determinism. The existence of counter-examples (American Revolution) disproves universality. It ignores agency, contingency, and the specific contexts of individual revolutions. History doesn't operate by such iron laws.

  5.  **Definition: Who are the "Children"?**
      *   *Founding Generation/Prominent Early Leaders (e.g., Danton, Desmoulins):* **Substantive and Defensible** (the most common usage).
      *   *The Revolution's Most Radical Products (e.g., Hébertists, Enragés):* **Substantive and Defensible** (often targeted as "ultras" or "excessives").
      *   *The New Kind of Person the Revolution Created:* **Confused/Overly Metaphorical.** *Reasoning:* While revolutions transform identities, "devouring" this concept is vague and not analytically useful for explaining specific purges.
      *   *The Revolution's Own Ideals/Promises:* **Confused/Metaphorical.** *Reasoning:* This is a poetic interpretation of revolutionary disillusionment or betrayal, but it doesn't explain the *mechanism* of purging specific people. It's about outcomes, not process.

  6.  **Definition: Who/What is the "Devourer"?**
      *   *A Specific Leadership Faction (e.g., Robespierre & Cie, Stalin):* **Substantive and Defensible.** *Reasoning:* Purges are often driven by factional rivalry and the conscious decisions of actors seeking power.
      *   *The Revolution (as an impersonal force/process):* **Confused/Reification.** *Reasoning:* Attributing agency to an abstraction obscures the actual human actors and decisions involved. It risks determinism.
      *   *An Impersonal Process (Competitive Signaling, Unverifiable Virtue):* **Substantive and Defensible.** *Reasoning:* In highly uncertain, paranoid environments (like the Terror), demonstrating revolutionary commitment becomes vital. Denunciation becomes a low-cost, high-reward strategy for advancement or safety. This dynamic can escalate purges beyond initial factional intentions.
      *   *Emergent Outcome (No Single Agent):* **Substantive and Defensible.** *Reasoning:* The purge dynamic can result from the complex interaction of structural pressures (war, economic crisis), institutional weaknesses, factional competition, and the signaling mechanism above – without any single group fully controlling it.

  7.  **Scope of "Devouring":**
      *   *Includes Execution, Imprisonment, Exile, Political Obliteration:* **Substantive and Defensible (for analysis).** *Reasoning:* To understand the phenomenon, focusing solely on the guillotine is too narrow. Exile (e.g., Girondins early on), imprisonment, or complete political destruction (ousting from committees, banning clubs) are part of the same dynamic of eliminating rivals and dissent. *However, this significantly increases the "frequency" claim's plausibility.*
      *   *Limited to Execution/Killing:* **Substantive but Overly Restrictive.** *Reasoning:* While the most dramatic, it misses the full spectrum of revolutionary repression against insiders.

  8.  **The Denominator Problem (Selection Bias):**
      *   **Verdict:** **Substantive and Defensible (Major Caveat).** *Reasoning:* Revolutions studied most intensely (French, Russian, Chinese, Iranian) are often the bloodiest and most transformative – precisely those where internal purges *were* prominent. Quieter revolutions or those without major purges (American, many post-colonial) receive less attention in "revolution" historiography focused on radical social change. This creates a skewed sample, making the "devouring" pattern *seem* more universal than it is.

  **II. The Aphorism vs. The Historiographical Schools**

  *   **Visitor's Inference:** "The revolution killed its own children" THEREFORE "No special ideological explanation is needed."
  *   **Analysis per School:**

  1.  **Class-Struggle Reading:**
      *   **Carries the Inference?** **Yes, strongly.** This reading sees purges as the *bourgeoisie* (or a faction like the Montagnards representing the *sans-culottes* temporarily) eliminating rivals (other bourgeois factions, radical petit-bourgeois, or unruly proletarians) to consolidate their class rule and protect property relations threatened by the revolution's radical momentum. The Terror was a tool of class rule under emergency conditions, not primarily driven by ideology. The aphorism's mechanism/functional claims align perfectly: shedding parts of the heterogeneous coalition to secure the dominant class's hold. The visitor's point stands – it's "what revolutions (understood as bourgeois seizures of power needing consolidation) do."

  2.  **Ideological/Political-Culture Reading:**
      *   **Carries the Inference?** **No. Actively Supports the Classmate.** This reading sees the purge dynamic as *inherent* to the revolutionary ideology itself – particularly its Manichean worldview (virtue vs. conspiracy), its belief in popular sovereignty requiring constant vigilance, its definition of citizenship through virtue, and its logic of unmasking hidden enemies. Ideology creates an "unlimited demand for purity" where former allies become the most dangerous traitors precisely *because* they were insiders. The aphorism, interpreted as "this is just what revolutions do," *obscures* this specific ideological driver. The classmate is correct: the victims' shared enemies make their elimination harder for other schools to explain without recourse to ideological logic.

  3.  **Contingency/War-Emergency Reading:**
      *   **Carries the Inference?** **Yes.** This reading sees purges as a function of extreme external pressure (war on multiple fronts) and internal chaos (counter-revolution, federalist revolt, economic collapse). Under such existential threat, perceived disloyalty or dissent becomes intolerable. The Committee of Public Safety eliminated rivals (Girondins, Danton) and radicals (Hébertists) primarily because they were seen as threats to unity, sources of division, or obstacles to the total mobilization needed for survival, not primarily due to class or ideology *inherent logic*. The aphorism's functional/state consolidation claims fit well: the emergency demands a unified, powerful state, eliminating internal rivals is part of that. The visitor's point holds – the extreme context explains the purge, not a special ideology.

  **III. Commitment & Conclusion**

  1.  **Most Defensible Reading Overall:** **The Contingency/War-Emergency reading, heavily inflected by the Mechanism/Functional claims of the aphorism.** *Reasons:*
      *   **Empirical Strength:** The correlation between the radicalization/violence of the Terror and the escalations of external war and internal revolt (Summer 1793) is stark and well-documented. The pressure was immense and real.
      *   **Explanatory Power:** It accounts for the *timing* and *intensity* of the purges better than class or ideology alone. Why not purge earlier/later? Why so intense in 1793-94? The emergency provides the crucial catalyst.
      *   **Compatibility:** It doesn't *exclude* class or ideology. Class tensions created factions; revolutionary ideology provided the *language* and *justification* for repression. But the *driving force* pushing fragmentation towards lethal purge was the perceived existential emergency. The functional mechanism ("state consolidation under extreme threat") subsumes elements of the others without relying on their core logics as primary drivers. *(Extrapolation: While ideology provided tools and class shaped factions, I see the emergency as the necessary and sufficient condition for the *scale and lethality* of the purges against former allies.)*

  2.  **Reading People Normally Assume When Using the Line:** **A vague mixture of the Lawlike Necessity Claim and the Impersonal Process/Reification ("The Revolution") Devourer.** *Reasoning:* The line is usually deployed fatalistically, implying an inevitable, almost natural process inherent to "revolution" itself, obscuring human agency and specific contexts. It leans towards determinism ("this is simply what revolutions do") and away from concrete explanations involving class, ideology, or contingency.

  3.  **Does the Line Do Real Work in the Argument?** **No, it actively hindered the argument.** *Reasons:*
      *   **False Universality:** It falsely implied the phenomenon is universal and inevitable, shutting down inquiry into the *specific* causes in the French case.
      *   **Obfuscation:** It concealed the crucial distinctions between the different mechanisms (coalition fragmentation, state consolidation, ideological logic) and definitions discussed above.
      *   **Supported the Weaker Position:** It provided rhetorical cover for the visitor's dismissal of the ideological reading, but as shown, the aphorism's *most defensible* interpretations (mechanism/functional) align better with the contingency reading *or* the class reading, not inherently against ideology. The classmate's point about the victims' shared enemies *is* a genuine puzzle for the contingency and class readings that the ideological reading addresses directly.
      *   **Intellectual Laziness:** It substituted a catchy, fatalistic phrase for engaged historiographical debate about the complex interplay of structure, agency, ideas, and circumstance.

  **In essence:** The aphorism "revolutions devour their own children" describes a frequent and grim historical pattern with plausible underlying mechanisms (coalition fragmentation, state consolidation under threat). However, it is not a universal law. When used to dismiss specific explanations (like revolutionary ideology in the Terror), it fails. Its most defensible interpretations support explanations rooted in the functional necessities of consolidating power, often under extreme duress (contingency/emergency), or the dynamics of class rule, rather than negating the role of ideology. In your seminar debate, the visitor used it poorly to shut down a legitimate and insightful argument about the Terror's specific ideological logic. The line, on its best reading, highlights a common *dynamic* but cannot *explain* why that dynamic plays out with such ferocity in specific cases – that requires engaging with the very historiographical schools the visitor dismissed.
