answer: |-
  ### Scenario
  In 1980, the international metrology community fixes the reference of the term "the ampere" by a rigidified description: "the constant current that, when maintained in two straight parallel infinite conductors of negligible cross-section placed 1 meter apart in vacuum, produces a force of exactly \(2 \times 10^{-7}\) newtons per meter of length". The sentence "The force between such conductors carrying one ampere is \(2 \times 10^{-7}\) N/m" is contingent (the force could have been defined differently) but knowable a priori (by definition). In 2019, the community redefines the ampere by fixing the elementary charge \(e\) to exactly \(1.602176634 \times 10^{-19}\) coulombs, where the coulomb is defined as the charge transported by one ampere in one second. This redefinition preserves the original ampere's referent by setting \(e\) such that the force in the original setup remains \(2 \times 10^{-7}\) N/m. The same sentence is now necessary (the ampere is rigidly tied to \(e\), making the force a consequence of natural law) but knowable only a posteriori (requiring experimental verification that the new definition matches the original force).

  ---

  ### Analysis
  1. **Sentence and terms**  
     - Sentence: "The force between such conductors carrying one ampere is \(2 \times 10^{-7}\) N/m."  
     - Terms:  
       - "Such conductors": Rigid designator (refers to the idealized setup: two straight parallel infinite conductors of negligible cross-section, 1 meter apart in vacuum).  
       - "One ampere": Rigid designator (refers to a specific current magnitude, fixed by baptism in 1980 and preserved in 2019).  
       - "\(2 \times 10^{-7}\) N/m": Rigid designator (refers to a specific force per unit length).  

  2. **Rigid designators and why**  
     - "One ampere" is rigid: It designates the same current magnitude in all possible worlds, fixed by the 1980 baptism (rigidified description) and preserved in 2019 (redefined via \(e\) to retain the same referent).  
     - "Such conductors" is rigid: It picks out the same experimental setup across worlds.  
     - "\(2 \times 10^{-7}\) N/m" is rigid: It denotes a specific numerical value.  

  3. **Modal and epistemic verdict at each stage**  
     - **1980**:  
       - Contingent: The community could have defined the ampere to produce a different force (e.g., \(3 \times 10^{-7}\) N/m).  
       - Knowable a priori: The sentence is true by the 1980 definition; no experiment is needed.  
     - **2019**:  
       - Necessary: The ampere is now defined by \(e\), a fundamental constant fixed by natural law. Given that \(e\) is set to preserve the original ampere, the force \(2 \times 10^{-7}\) N/m holds in all worlds as a consequence of the laws of electromagnetism.  
       - Knowable only a posteriori: Empirical measurement (e.g., quantum Hall effect experiments) is required to confirm that the new \(e\)-based ampere yields the same force.  

  4. **Feature doing the work**  
     - The rigid designation of "one ampere" combined with a change in the **reference-fixing convention**—from a rigidified description (1980) to a rigidified natural constant (2019).  
     - **If removed**:  
       - If "ampere" were introduced by ostension (e.g., "this current in this setup"), it would not be rigid, and the sentence would remain contingent.  
       - If "ampere" were introduced by an ordinary (non-rigid) description (e.g., "whatever current produces force \(F\) in this setup"), the referent could shift, making the sentence contingent at both stages.  

  5. **Defender of description theory's reply**  
     - **Claim**: The sentence changed meaning (e.g., "ampere" now means "current defined by \(e\)" rather than "current producing force \(F\)").  
     - **Cost**:  
       - They must deny that the referent of "ampere" is fixed across time, contradicting metrology practice (the 2019 redefinition explicitly preserved the 1980 ampere's magnitude).  
       - They cannot explain how the sentence remains empirically true after redefinition without conceding that "ampere" rigidly designates the same current.  
       - This weakens their theory: If meaning change explains all such cases, they cannot account for stable reference in science (e.g., the ampere's continuity).  

  6. **Effect of approximate preservation (e.g., kilogram redefinition)**  
     - If the 2019 redefinition only approximately preserved the original ampere (e.g., due to measurement uncertainty), the sentence would become contingent and a posteriori at the later stage.  
     - The community would know a posteriori that the force is approximately \(2 \times 10^{-7}\) N/m, but not exactly, so the sentence could be false in some worlds.  
     - This dissolves the flip: The sentence remains contingent, and the necessary a posteriori status relies on exact preservation.  

  ---

  ### Conclusion
  The case demonstrates that necessary a posteriori truths are embedded in measurement practice, not just theoretical identifications. The flip arises from rigid designation plus a change in reference-fixing conventions—here, from a baptism by rigidified description to one by natural law. The description theorist’s reply (meaning change) is costly, as it ignores the intentional preservation of reference in metrology. Approximate preservation (like the kilogram) collapses the necessity, showing that exact referential stability is key.
