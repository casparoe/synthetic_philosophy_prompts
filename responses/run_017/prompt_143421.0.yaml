  Looking at their framework, they've identified three "Molochs": M1 (equilibrium trap) as the classic prisoner's dilemma where defection dominates; M2 (selection trap) where exploitative types outcompete cooperators over time; and M3 (intra-agent trap) where internal processes compete within an agent. They also discuss slopes vs. cliffs in harm functions, and a ratchet asymmetry where exit is harder than entry due to concentrated interests.

