prompt: |-
  I have been reading, on and off for years, the usual sequence-side material on miscoordination, commitment races, and programs that can read one another's source, and before I go further into individual proposals I want the specification. Here is the setting I care about. A group is going to play a game G. I, a designer, may hand them a modified game G-prime instead: adding cheap-talk rounds, letting them commit to respond to what others do, letting them delegate their moves to programs that can condition on each other, and so on. What I do not get to do is assume a probability distribution over how G would have been played: I do not know which equilibrium they would have landed on, and in the delegation case a player may not know what her own delegate would have done by default. Call G-prime a safe Pareto improvement on G when, for every way of playing the pair that I am willing to count as possible, every player does strictly better in G-prime than in G.

  What I want from you is the desiderata list: what any adequate explication of that notion has to deliver, with the case or consideration behind each item. To get you started, here are the demands I keep seeing made of it, some of which I suspect are prejudices of one camp rather than requirements:

  - improvement with certainty, ex post, in every admissible outcome, versus improvement guaranteed only in expectation under each player's own (possibly mistaken) beliefs;
  - belief-freeness about equilibrium selection, and the price of it: the only leverage left is qualitative assumptions about play, of the kind people use when they assume isomorphic games get played isomorphically, or that strictly dominated strategies get iteratively removed. Are those part of the definition, or empirical premises that could be false of the population I am designing for?
  - non-vacuity: the notion has to license something non-trivial in the games that motivate it, and not only relabelings;
  - a determinate baseline, given that the counterfactual is how the players would have played a game they are no longer playing, and that in the delegation case the principal cannot answer the question "what would I have done?" from the inside;
  - robustness to partial adoption, and invariance to whether adoption is mandatory or optional. This is the case I care most about: if taking up the modification is voluntary, the option to take it up is itself a move in a larger game, declining can reveal something about who declined, and a scheme that helps everyone given universal take-up may hurt the one player who opts in while others do not;
  - no interpersonal comparisons of utility, and invariance to rescaling each player's utility independently, which becomes delicate the moment the mechanism needs side payments;
  - robustness to small misspecification of the payoffs, since a guarantee that holds "with certainty" is knife-edge if the payoffs are merely estimated;
  - composition: whether successive safe improvements can be stacked, and whether two designers applying different improvements to the same game interfere;
  - implementability without a trusted enforcer, using only cheap talk, self-enforcing commitments, and mutual inspection of source code;
  - scope beyond two players, two actions, and complete information.

  For each requirement say whether it is non-negotiable or a preference of one camp, and say which distinctions the definition must not collapse: better-for-each versus better-on-average; improving the outcome versus improving the game; belief-free safety versus robustness across a set of beliefs versus what it is subjectively rational for a player to accept. Then flag any subset of the requirements you suspect cannot be jointly satisfied, since if the list itself is unsatisfiable that is the result I most want, and tell me which single requirement excludes the largest share of candidate definitions.

  A short scorecard, a few lines each, against the four notions I have encountered — belief-free improvements proved from qualitative assumptions about play; cheap-talk "token" rounds combined with advance commitments to respond; renegotiation between submitted programs run by expected-utility maximizers who do have beliefs; and the older welfare-economics idea of a compensation test with hypothetical side payments — would be useful, but keep the weight on the criteria.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deep into game theory, specifically looking for a framework to design modified games that are safe Pareto improvements. The key is that every player must do strictly better in G-prime than in G, no matter how the original game is played. But they don't want to assume any probability distributions or specific equilibria.

  First, I need to list out all the desiderata they mentioned. There are about ten points, from certainty of improvement to robustness against partial adoption. The user is concerned about distinguishing non-negotiable requirements from camp preferences. For example, the certainty requirement (ex-post improvement) is probably non-negotiable for them, while belief-freeness might be essential to avoid reliance on equilibrium selection.

  The user also emphasizes partial adoption. If the modification is voluntary, a player opting in while others don't might be worse off. That's a crucial case for their real-world application. They want the definition to handle that without mandating universal adoption.

  Then there's the challenge of a determinate baseline. In delegation cases, players can't know what they would've done otherwise. How do you define the counterfactual? This seems tricky and might require assumptions about behavior, like isomorphic play or elimination of dominated strategies.

  Non-vacuity is another point. The definition must allow non-trivial improvements, not just relabelings. But combining this with ex-post certainty and belief-freeness could be tough. Maybe only trivial changes satisfy all, making the concept vacuous. That would be a major issue.

  I should also consider robustness to payoff misspecification. If payoffs are estimated, even small errors could break the "with certainty" guarantee. This might push towards weaker requirements, but the user insists on strict ex-post improvement.

  Composition is another angle. Can multiple designers apply improvements without interference? If not, that limits practical use. But ensuring composability might add more constraints.

  The user suspects some requirements conflict. For instance, ex-post certainty and partial adoption robustness might clash. If a player opts in alone, they might be exploited. The definition must ensure that even in such cases, they're not worse off. This seems hard without side payments, which brings up interpersonal utility comparisons—another no-go.

  Looking at the four notions they mentioned: belief-free improvements, cheap-talk tokens, program renegotiation, and compensation tests. Each has trade-offs. Cheap-talk tokens might handle partial adoption but require belief-freeness. Program renegotiation assumes rational agents with beliefs, which violates belief-freeness. Compensation tests need interpersonal utility comparisons, which the user wants to avoid.

  The biggest conflict might be between ex-post certainty and non-vacuity. If only trivial improvements work, the concept is useless. Partial adoption exacerbates this. Without side payments or enforced participation, safe improvements might be impossible in many games.

  The user's core need is a practical, applicable definition for designing mechanisms. They might be creating real-world systems where voluntary adoption is key. Unspoken needs include ensuring fairness and avoiding exploitation, especially when not everyone adopts the modification. They also want theoretical rigor without impractical assumptions.

  In conclusion, the key tension is between strict ex-post improvement and non-vacuity under voluntary adoption. If no non-trivial improvements satisfy all criteria, that's the critical result they need. Highlighting this conflict addresses their deepest concern about the feasibility of safe Pareto improvements in their context.
answer: |-
  Here is a criteria-driven analysis for defining "safe Pareto improvement" in your mechanism design context, followed by a concise scorecard for the four approaches. The focus is on distinguishing non-negotiable requirements from preferences and identifying key tensions.

  ### Core Desiderata & Analysis
  1.  **Improvement with Certainty (Ex Post)**
      *   **Status:** **Non-negotiable** for your stated goal ("*every player does strictly better in G-prime than in G*" for "*every way of playing... I am willing to count as possible*").
      *   **Distinction:** Must collapse "improvement on average/beliefs" and require strict improvement in *every actual realized outcome* compared to *every admissible counterfactual outcome* of G. Baseline is set per-outcome, not per-expectation.
      *   **Tension:** Key source of difficulty with partial adoption and non-vacuity.

  2.  **Belief-Freeness w.r.t. Equilibrium Selection & Default Play**
      *   **Status:** **Non-negotiable** (You cannot assume knowledge of the counterfactual equilibrium or default delegate behavior).
      *   **Role of Qualitative Assumptions:** *Part of the definition*. To define "admissible ways of playing G", you *must* invoke assumptions like isomorphism-invariance, iterative dominance (IDS), correlation devices, or no extraneous correlation. These define the set of counterfactuals you guard against. Their validity is an *empirical claim* about the population, but the *definition itself* relies on specifying such a set.
      *   **Distinction:** Must not collapse "robust across *all* beliefs" (impossible) vs. "robust across play consistent with specified structural assumptions" (achievable).

  3.  **Non-Vacuity**
      *   **Status:** **Non-negotiable** for a useful concept. Must enable non-trivial improvements (e.g., resolving Prisoner's Dilemma) beyond mere relabeling or adding strictly dominated options.
      *   **Distinction:** Must collapse "trivial change" vs. "meaningful welfare enhancement". The baseline comparison must be substantive.
      *   **Tension:** Major conflict point with Ex Post Certainty and Belief-Freeness, potentially requiring strong assumptions.

  4.  **Determinate Baseline**
      *   **Status:** **Non-negotiable**. The counterfactual must be rigorously defined despite delegation/unknowable intentions.
      *   **Resolution:** Defined by the *game form G* + the *specified qualitative assumptions* (e.g., isomorphism, IDS) defining admissible play. The baseline is the *set* of outcomes achievable in G under those assumptions. Delegates' "default" behavior is whatever behavior in G is admissible under the assumptions.

  5.  **Robustness to Partial Adoption & Voluntary Uptake**
      *   **Status:** **Non-negotiable** for your primary concern. G-prime must be safe even if not universally adopted. Voluntary uptake must not create harmful selection effects.
      *   **Distinction:** Must not collapse "universal adoption required" vs. "safe under any adoption pattern". Requires analyzing G-prime as an *optional modification* within a larger meta-game.
      *   **Tension:** *The most severe challenge.* Ex Post Certainty must hold for players who adopt G-prime *regardless* of others' choices. This drastically constrains viable mechanisms (e.g., often requires symmetric mechanisms or side-payments).

  6.  **No Interpersonal Comparisons & Invariance to Rescaling**
      *   **Status:** **Non-negotiable** for standard game-theoretic purity. Utilities are ordinal and non-comparable.
      *   **Delicacy with Side Payments:** Requires side payments to be implemented via *in-game actions with utility consequences* (e.g., burning money, transferring goods within the game), not external transfers. The mechanism must ensure the *net utility* change for each player is positive *within their own scale*, regardless of others' scales. Invariance must hold.

  7.  **Robustness to Small Payoff Misspecification**
      *   **Status:** **Highly Preferred** (Practical necessity). A "with certainty" guarantee is useless if fragile.
      *   **Requirement:** The improvement should hold for a *neighborhood* of payoff matrices around the specified G. Strict inequalities are key.

  8.  **Composition**
      *   **Status:** **Highly Preferred** (Practical utility), but potentially secondary. Sequential improvements should ideally compose safely. Designers should ideally not interfere destructively.
      *   **Distinction:** Must not collapse "single-step safe" vs. "sequentially safe". Composition is non-trivial.

  9.  **Implementability w/o Trusted Enforcer**
      *   **Status:** **Contextual Preference**. Crucial for decentralized settings (e.g., smart contracts, open protocols). Less critical if a trusted platform exists.
      *   **Means:** Cheap talk, self-enforcing commitments (e.g., via game structure), mutual source code inspection (for programs) must suffice.

  10. **Scope (N>2, Actions>2, Incomplete Info)**
      *   **Status:** **Non-negotiable** for general applicability. The concept must not be limited to toy examples.

  ### Key Conflicts & The Biggest Excluder
  *   **The Fundamental Tension:** **Ex Post Certainty + Belief-Freeness + Robustness to Partial Adoption + Non-Vacuity** is extremely hard to satisfy simultaneously.
  *   **The Single Biggest Excluder:** **Robustness to Partial Adoption.** This requirement alone eliminates the vast majority of candidate mechanisms:
      *   It forces safety guarantees for *any* subset of adopting players facing *any* subset of non-adopting players.
      *   An adopting player must *never* be worse off than in *any* admissible outcome of G, even if they are the *only* adopter and face players actively exploiting their adoption within G-prime.
      *   This often necessitates mechanisms that are "safe alone" or require symmetric, non-exploitable changes, severely limiting the scope for non-trivial improvements without side payments (which face invariance challenges). Schemes relying on universal coordination (like many correlation devices) fail here.

  ### Scorecard of Candidate Notions

  1.  **Belief-Free Improvements (via Qualitative Assumptions - e.g., IDS, Isomorphism):**
      *   **Ex Post Certainty:** Core strength.
      *   **Belief-Freeness:** Core strength.
      *   **Non-Vacuity:** Moderate (Works well in coordination/miscoordination games like Battle of Sexes/Stag Hunt under IDS/isomorphism; weak in PD).
      *   **Baseline:** Defined by assumptions.
      *   **Partial Adoption:** **Major Weakness.** Mechanisms often rely on universal coordination. A sole adopter using a delegate committing to a Pareto-superior action in PD is exploited if others defect.
      *   **No Interpersonal Comp:** Strong.
      *   **Robustness/Misspec:** Moderate (depends on assumption stability).
      *   **Composition:** Untested/Poor.
      *   **Implementability:** Moderate (Commitments possible, cheap talk helps).
      *   **Scope:** Moderate (N>2 ok, incomplete info tricky).

  2.  **Cheap-Talk "Tokens" + Commitments:**
      *   **Ex Post Certainty:** Possible only if commitments are binding and cover all contingencies.
      *   **Belief-Freeness:** Weak. Effectiveness often hinges on equilibrium selection in the cheap-talk stage.
      *   **Non-Vacuity:** Strong (Can implement many correlated equilibria, resolve PD).
      *   **Baseline:** Requires defining admissible play in G without talk.
      *   **Partial Adoption:** **Weak.** Cheap talk often requires participation to be meaningful/safe. A sole committer can be exploited.
      *   **No Interpersonal Comp:** Strong.
      *   **Robustness/Misspec:** Low (Equilibrium selection fragile).
      *   **Composition:** Poor.
      *   **Implementability:** Strong (Pure cheap talk/commitments).
      *   **Scope:** Moderate (N>2 ok, incomplete info very hard).

  3.  **Renegotiation Between EU-Maximizing Programs (w/ Beliefs):**
      *   **Ex Post Certainty:** Not guaranteed. Depends on renegotiation outcome & beliefs.
      *   **Belief-Freeness:** **Weak/Fails.** Requires specifying beliefs over other programs/defaults.
      *   **Non-Vacuity:** Very Strong (Can achieve high efficiency via bargaining).
      *   **Baseline:** Problematic ("What would my default program do?" requires beliefs).
      *   **Partial Adoption:** **Very Weak.** A single adopting program is at the mercy of non-adopting players' strategies.
      *   **No Interpersonal Comp:** Strong (Within the game).
      *   **Robustness/Misspec:** Low (Highly sensitive to belief specification).
      *   **Composition:** Very Poor (Programs may not compose rationally).
      *   **Implementability:** Strong (Code inspection central).
      *   **Scope:** Strong (N>2, complex actions, incomplete info conceptually possible).

  4.  **Compensation Test (Hypothetical Side Payments):**
      *   **Ex Post Certainty:** Not aimed for. Focuses on potential Pareto improvement.
      *   **Belief-Freeness:** Moderate (Often uses equilibrium payoffs as baseline).
      *   **Non-Vacuity:** Strong.
      *   **Baseline:** Requires defining counterfactual outcome/distribution.
      *   **Partial Adoption:** Not addressed.
      *   **No Interpersonal Comp:** **Fails.** Relies critically on comparing aggregated utility gains and losses.
      *   **Robustness/Misspec:** Low (Aggregation sensitive).
      *   **Composition:** Moderate.
      *   **Implementability:** Weak (Requires external enforcement for hypothetical payments).
      *   **Scope:** Strong.

  ### Conclusion
  Your core requirements – **Ex Post Certainty, Belief-Freeness (w/ structural assumptions), Non-Vacuity, and Robustness to Partial Adoption** – form an exceptionally demanding set. **Robustness to Partial Adoption is likely the most exclusionary requirement.** The tension between it and Non-Vacuity is particularly acute. While notions like belief-free improvements under strong assumptions (e.g., IDS) satisfy the first three reasonably well for specific games, they typically fail Robustness to Partial Adoption spectacularly. Achieving all four may require mechanisms that are inherently "safe for adopters regardless of others" (e.g., introducing strictly dominant strategies symmetrically, which is often trivial or impossible) or finding ways to make beneficial side-payments without violating utility invariance, which is highly restrictive. **Joint satisfaction of all your non-negotiables appears extremely difficult, likely impossible for most non-trivial games of interest.** The result you most want – identifying this fundamental tension – seems strongly supported.
