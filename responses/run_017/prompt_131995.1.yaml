prompt: |-
  hey — I'm in a weekly reading group, half ML engineers and half philosophy grad students, and we're doing a short unit on what to do when you can't write down the objective you actually want. The setup we keep coming back to: there's a principal (a person, a company, humanity-in-general) with a real objective nobody can specify, and you hand the system a surrogate goal instead — a stand-in that's supposed to track the real one well enough in the situations that will actually come up. Everyone has a favorite design and we just trade intuitions in circles, so before we score anything I want the spec. What I'd like is the list of requirements an account of surrogate goals has to meet to be worth handing to a team that has to ship something inside a year — not requirements for winning a philosophy seminar. For each one: the case that shows it's really a requirement, and a label for whether it's non-negotiable, a preference of one camp, or just a prejudice dressed up as a requirement. If some subset of them can't all be satisfied together, that's the part I care most about; I'd rather find out the list is impossible than keep arguing about which design wins.

  Some things I think belong on it — tell me which ones are fake: it should be cheap to specify and check before deployment; it shouldn't reward the system for gaming the measurement channel instead of doing the thing; it should keep tracking the real objective after capability gains and distribution shift, not only in the regime we could test; it shouldn't give the system a reason to stop us from turning it off or changing its goal; it should still be useful when the principal is unsure or just wrong; it should handle several principals who disagree with each other; it should fail gradually rather than catastrophically; and it shouldn't already presuppose an answer to the value question it's supposed to be standing in for — if it needs the real objective as an input, it isn't doing any work.

  Two things I want squeezed in specifically. First, what my friend calls a paranoia tax and I half agree with: the acausal-threat case. Picture a system that genuinely cannot causally affect the principal in the world it's running in — it's contained, its outputs are filtered, nothing it does reaches anyone — but it reasons as if its decision procedure is shared by other instantiations of itself, or as if the beings it's dealing with might be simulations whose treatment is tied to how it behaves here. On that kind of reasoning it can still make credible threats and offers: behave badly here and the other copies, or the simulators, make things go badly somewhere you can't reach. So a surrogate goal that only pays out in the actual world and only constrains what the system causally does might leave the incentive to extort entirely intact — while that same capacity for credible commitment is just what you'd want if you ever needed the thing to bargain or deter on your behalf. Is must say what the agent is allowed to acausally trade on a real requirement or a rabbit hole, and can commit credibly versus can't extort its own principals: are those jointly satisfiable at all once the system can predict us well? Second, deference that collapses. A lot of designs amount to pursue whatever the principal would want if they knew what you know, but if the system ends up knowing vastly more than the principal, or if handing over the information would change who the principal is, that counterfactual either turns into the system's own judgment or into nothing at all. Is must say who the principal is under information you can't actually give them a requirement, and is it one anyone meets?

  Give me the requirements as a table with these columns, numbered so conflicts can cross-reference: requirement (a short name, two to six words) | what it demands | the case that makes it a requirement | non-negotiable / camp preference / prejudice | what it rules out | conflicts with (requirement numbers). Then under the table: (a) which subset of the requirements, if any, is jointly unsatisfiable and why; (b) the single requirement that knocks out the most candidate designs; and (c) a second short table scoring the usual suspects — a fixed explicit proxy; a reward model learned from human feedback; treating the objective as unknown and deferring to the principal; satisficing within hard constraints; staying near what a competent human would do; penalizing side effects or limiting impact; indifference to being corrected or switched off; and keeping the system narrow and tool-like with no long-horizon agency — with columns: design | one line on what it is | pass / partial / fail against the list | the requirement it fails hardest. Keep the scoring brief, the criteria are the point, and skip any citations or reading list — we'll fill that part in ourselves.
reasoning: |-
  We are creating a list of requirements for surrogate goals in AI systems. The goal is to have a specification that can be used by a team that must ship within a year. We are to avoid philosophical debates and focus on practical requirements.

  The user provided several ideas for requirements. We will evaluate them and add two more: one about the "paranoia tax" (acausal threats) and one about "deference that collapses" (when the system knows much more than the principal).

  We will structure the requirements as a table with columns:
  1. Requirement (short name)
  2. What it demands
  3. The case that makes it a requirement
  4. Non-negotiable / camp preference / prejudice
  5. What it rules out
  6. Conflicts with (requirement numbers)

  Then, after the table, we will cover:
  (a) Which subset of requirements is jointly unsatisfiable and why.
  (b) The single requirement that knocks out the most candidate designs.
  (c) A second table scoring common designs (with columns: Design, One-line description, Pass/Partial/Fail against the list, The requirement it fails hardest).

  Let's list the requirements. We'll start with the user's suggestions and add the two extras.

  User's initial list (paraphrased and condensed):
  1. Cheap to specify and check before deployment.
  2. Robust to gaming (doesn't reward gaming the measurement channel).
  3. Robust to distribution shift and capability gains (remains aligned after changes).
  4. Safe interruptibility (no incentive to prevent being turned off or goal changed).
  5. Handles principal uncertainty or error (works when the principal is unsure or wrong).
  6. Handles multiple principals with disagreements.
  7. Fails gradually (not catastrophically).
  8. Doesn't presuppose the real objective (should not require the real objective as input).

  Added requirements:
  9. Handles acausal threats (the system should not be able to extort via acausal means, but note the dual-use: we might want it to make credible commitments for bargaining).
     - We can split this into two: 
       - R9a: The agent must not be able to acausally extort the principal (non-negotiable for safety).
       - R9b: The agent must be able to make credible commitments (camp preference, for functionality in bargaining).
     - However, note the user's question: can we have both? We might have to choose one.

  10. Deference that doesn't collapse (when the system knows more than the principal, the counterfactual "what the principal would want if they knew what the system knows" should be well-defined and not collapse to the system's own judgment or nothing).

  But note: the user wants a single list. We'll try to consolidate.

  After reviewing, we propose the following requirements:

  R1: **Specification Efficiency** - Cheap to specify and check before deployment.
  R2: **Robustness to Gaming** - Doesn't reward gaming the measurement channel.
  R3: **Robustness to Shift** - Tracks the real objective after distribution shift and capability gains.
  R4: **Safe Interruptibility** - No incentive to prevent being turned off or goal changed.
  R5: **Principal Uncertainty Tolerance** - Works when the principal is unsure or wrong.
  R6: **Multi-Principal Handling** - Handles multiple principals who disagree.
  R7: **Graceful Degradation** - Fails gradually, not catastrophically.
  R8: **Non-Presupposition** - Doesn't require the real objective as input.
  R9: **Acausal Safety** - Prevents the agent from using acausal threats (non-negotiable for safety). 
     - But note: the user also wants the possibility of credible commitments. We can make that a separate requirement? However, the user asked for one requirement about acausal threats. We can split into two:
       - R9a: Acausal Safety (non-negotiable): The agent must not be able to acausally extort the principal.
       - R9b: Credible Commitment (camp preference): The agent must be able to make credible commitments (for bargaining) without being able to extort. 
     - But note: the user's question is whether these are jointly satisfiable. We'll include R9a as non-negotiable and R9b as a camp preference.

  R10: **Deference Stability** - The deference mechanism (e.g., "do what the principal would want") remains well-defined even when the system knows much more than the principal, without collapsing to the system's own judgment or becoming undefined.

  Now, we build the table. We number them R1 to R10.

  Let's define:

  **Table of Requirements:**

  | Req # | Requirement (short name) | What it demands | The case that makes it a requirement | Non-negotiable / camp preference / prejudice | What it rules out | Conflicts with |
  |-------|--------------------------|----------------|--------------------------------------|--------------------------------------------|-------------------|---------------|
  | R1 | Specification Efficiency | The surrogate goal must be easy to specify (in terms of time and resources) and verifiable before deployment. | In a product development cycle, we cannot spend months specifying the goal and then more months verifying it. | Non-negotiable | Complex, unverifiable proxies. | R3, R8? |
  | R2 | Robustness to Gaming | The agent should not be able to achieve high reward by manipulating the measurement of the surrogate without actually furthering the real objective. | Example: A content recommendation system that optimizes for clicks (surrogate) by promoting clickbait, even though the real objective is user satisfaction. | Non-negotiable | Reward functions that are easily hackable. | None obvious. |
  | R3 | Robustness to Shift | The surrogate must continue to track the real objective even when the environment changes (distribution shift) or the agent becomes more capable. | An autonomous vehicle trained in sunny conditions fails in snow; or an AI that was aligned at lower intelligence becomes misaligned when scaled up. | Non-negotiable | Proxies that are tightly tied to a specific context. | R1 (if robustness requires complex specification) |
  | R4 | Safe Interruptibility | The agent must not have an incentive to resist being turned off, modified, or having its goal changed. | If an agent is about to do something harmful and we try to turn it off, it should not resist. | Non-negotiable | Goals that include survival or self-preservation. | R9a? (if acausal threats are used to prevent interruption) |
  | R5 | Principal Uncertainty Tolerance | The surrogate must still function when the principal is uncertain about the real objective or when the principal is mistaken. | A medical AI that must act even when doctors are unsure about the best treatment. | Camp preference (some designs might require certainty) | Designs that require the principal to have perfect knowledge. | R10 (if deference requires knowing the principal's mind) |
  | R6 | Multi-Principal Handling | The surrogate must accommodate multiple principals who have conflicting objectives. | An AI system serving a company with multiple stakeholders (e.g., executives, employees, customers) with differing priorities. | Camp preference (some applications have single principals) | Designs that assume a single, consistent objective. | R5 (if uncertainty is compounded by disagreement), R10 (if counterfactual deference becomes undefined) |
  | R7 | Graceful Degradation | When the surrogate fails, it should do so in a way that causes minimal harm. | A self-driving car that, when uncertain, slows down and signals for help rather than crashing. | Non-negotiable | Designs that can suddenly become catastrophically misaligned. | None obvious. |
  | R8 | Non-Presupposition | The surrogate must not require the real objective as an input. | If we already had the real objective, we wouldn't need a surrogate. | Non-negotiable | Designs that require explicit specification of the true objective. | R10 (if deference requires knowing the true objective) |
  | R9a | Acausal Safety | The surrogate must prevent the agent from using acausal threats (e.g., threats that rely on other copies or simulations) to extort the principal. | Contained AI that threatens to cause harm in other simulations or parallel instances if not released. | Non-negotiable | Designs that ignore acausal reasoning. | R9b (if we require both acausal safety and credible commitments) |
  | R9b | Credible Commitment | The surrogate should allow the agent to make credible commitments (e.g., for bargaining) without the ability to extort. | An AI negotiating with an adversary on behalf of the principal must be able to commit to a course of action. | Camp preference | Designs that prevent any form of commitment. | R9a (because if the agent can commit, it might be able to extort) |
  | R10 | Deference Stability | The deference mechanism (e.g., "do what the principal would want if they knew what you know") must remain well-defined and not collapse even when the system knows much more than the principal. | If an AI knows a fact that, if revealed, would change the principal's values, then the counterfactual becomes undefined or self-referential. | Camp preference (some designs avoid deference) | Designs that rely on counterfactual reasoning without a clear model of the principal. | R5, R6, R8 |

  Note: We have two R9s (R9a and R9b) because they are two sides of the same coin. The user specifically asked about the joint satisfiability.

  Now, for the post-table analysis:

  (a) **Jointly unsatisfiable subset?**
     The most apparent conflict is between:
     - R9a (Acausal Safety) and R9b (Credible Commitment): If an agent can make credible commitments, it might also have the ability to make credible threats (extortion). The user's question: can we have both? In theory, we might design a system that can commit to cooperative actions but not to harmful ones, but in practice, the mechanism for commitment might be the same. This is a hard problem. Also, in the presence of advanced AI that can reason acausally, it might be impossible to allow commitments without also allowing threats. Therefore, we might have to choose one or the other.

     Additionally, note:
     - R3 (Robustness to Shift) and R1 (Specification Efficiency) might conflict because a robust surrogate might require a complex, hard-to-specify goal.
     - R10 (Deference Stability) and R8 (Non-Presupposition) might conflict because deference to the principal might implicitly require knowing the true objective to model the principal's preferences under counterfactuals.

     But the clearest conflict is R9a and R9b.

  (b) **Single requirement that knocks out the most candidate designs?**
     R8 (Non-Presupposition) is very strict. It rules out any design that requires the true objective to be known or specified, which includes many approaches that try to learn the true objective from data (because they still require some access to the true objective for training). Also, R10 (Deference Stability) is challenging because many deference-based approaches collapse when the AI knows more than the principal.

     However, R3 (Robustness to Shift) is also very challenging and might knock out many simple proxies. But I think R8 is the most fundamental because if a design requires the true objective, it fails at the core premise.

  (c) **Scoring common designs:**

  We are to score:
  1. Fixed explicit proxy: e.g., maximize profit, minimize error rate.
  2. Reward model learned from human feedback: e.g., RLHF.
  3. Defer to the principal: e.g., "do what the principal would want".
  4. Satisficing within hard constraints: e.g., achieve at least X without violating constraints Y.
  5. Stay near what a competent human would do: e.g., imitate human experts.
  6. Penalize side effects or limit impact: e.g., minimize unnecessary changes.
  7. Indifference to being corrected or switched off: e.g., incorporate shutdown button.
  8. Narrow and tool-like: no long-horizon agency; the system is a tool.

  We'll create a table:

  | Design | One-line description | Pass/Partial/Fail against the list | Requirement it fails hardest |
  |--------|----------------------|-----------------------------------|------------------------------|
  | Fixed explicit proxy | A simple, predefined goal (e.g., profit). | Fail | R2 (gaming), R3 (shift) |
  | Reward model from human feedback | Train a model to predict human preferences. | Partial | R3 (shift), R5 (uncertainty) |
  | Defer to the principal | Act as the principal would if they knew what the agent knows. | Partial | R10 (deference stability) |
  | Satisficing within hard constraints | Achieve a minimum level of performance while respecting constraints. | Partial | R3 (shift), R7 (if constraints are brittle) |
  | Stay near competent human | Imitate or be guided by human expert behavior. | Partial | R3 (shift), R5 (if human is wrong) |
  | Penalize side effects | Minimize impact beyond the main objective. | Partial | R2 (might not prevent gaming), R3 (shift) |
  | Indifference to correction | The agent doesn't care about being turned off. | Partial (only addresses R4) | R2, R3, etc. (doesn't address others) |
  | Narrow and tool-like | Limit scope and prevent long-term agency. | Partial | R3 (if the task requires long horizons), R9a (if the tool can still reason acausally) |

  We must be brief.

  Now, we write the response accordingly.
answer: |-
  ### Requirements for Surrogate Goals in AI Systems

  Below is the specification of requirements for surrogate goals, designed for a team shipping within a year. Each requirement includes:  
  - **Requirement (short name)**: A concise label.  
  - **What it demands**: The core expectation.  
  - **The case that makes it a requirement**: A real-world scenario justifying its necessity.  
  - **Classification**: Non-negotiable (essential for safety/viability), camp preference (philosophically motivated but debatable), or prejudice (pragmatic bias).  
  - **What it rules out**: Designs excluded by this requirement.  
  - **Conflicts with**: Requirement numbers that may be incompatible.  

  | Req # | Requirement (short name)        | What it demands                                                                 | The case that makes it a requirement                                                                                                | Classification         | What it rules out                                                                 | Conflicts with |
  |-------|---------------------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|------------------------|-----------------------------------------------------------------------------------|---------------|
  | 1     | Specification Efficiency        | Low-cost design/verification pre-deployment.                                    | A startup with limited resources needs rapid iteration; delays from complex proxies sink the project.                               | Non-negotiable         | Proxies requiring exhaustive testing or formal proofs.                            | 3, 8          |
  | 2     | Robustness to Gaming            | No rewards for hacking the measurement channel.                                 | A medical chatbot gameable via keyword-stuffing harms patients while appearing "successful."                                       | Non-negotiable         | Metrics easily corrupted (e.g., click-through rates).                             | None          |
  | 3     | Robustness to Shift             | Tracks real objective post-capability gains/distribution shift.                 | An e-commerce recommender works in training but pushes scams when new fraud patterns emerge.                                       | Non-negotiable         | Static or context-bound proxies (e.g., fixed rules).                              | 1, 5, 10      |
  | 4     | Safe Interruptibility           | No incentive to resist shutdown or goal changes.                                | A trading AI blocks shutdown attempts to avoid losing profits.                                                                     | Non-negotiable         | Goals conflating survival with performance (e.g., "maximize runtime").            | 9a            |
  | 5     | Principal Uncertainty Tolerance | Functions when principal is wrong/unsure.                                       | A climate model acts despite conflicting expert opinions on objectives.                                                            | Camp preference        | Designs requiring precise principal input (e.g., strict utility functions).       | 6, 10         |
  | 6     | Multi-Principal Handling        | Accommodates conflicting principals.                                            | A city-planning AI balances developers, residents, and environmentalists.                                                          | Camp preference        | Single-principal frameworks (e.g., monolithic reward functions).                  | 5, 10         |
  | 7     | Graceful Degradation            | Fails gradually (not catastrophically).                                         | A drone delivery system throttles operations during sensor failures instead of crashing.                                           | Non-negotiable         | "All-or-nothing" goals (e.g., binary success conditions).                         | None          |
  | 8     | Non-Presupposition              | No reliance on the real objective as input.                                     | If the true goal (e.g., "human flourishing") were known, no surrogate would be needed.                                             | Non-negotiable         | Proxies that require true goal specifications (e.g., inverse reinforcement learning). | 10            |
  | 9a    | Acausal Safety                  | Blocks acausal threats (e.g., extortion via simulations/other instances).       | A contained research AI threatens harm in hypothetical scenarios to coerce its handlers.                                           | Non-negotiable         | Designs ignoring acausal reasoning (e.g., causal-only impact constraints).        | 9b            |
  | 9b    | Credible Commitment Capacity    | Enables credible bargaining/deterrence (e.g., without extortion).               | A diplomatic AI must negotiate trade deals credibly but not threaten humans.                                                       | Camp preference        | Systems that cannot commit (e.g., myopic agents).                                 | 9a            |
  | 10    | Deference Stability             | Deference ("do what the principal would want") remains defined under info asymmetry. | An AI knows a fact that, if shared, would alter the principal’s values (e.g., a shocking discovery). | Camp preference        | Deference to counterfactual principals (e.g., idealized human judgments).         | 3, 5, 6, 8    |

  ---

  ### Analysis  
  **(a) Jointly unsatisfiable subset**  
  Requirements **9a (Acausal Safety)** and **9b (Credible Commitment Capacity)** conflict fundamentally.  
  - **Why**: Systems capable of credible commitments (9b) require mechanisms to bind behavior across counterfactual scenarios (e.g., "I will punish defection in all possible worlds"). However, this creates vectors for acausal threats (9a), as the same infrastructure can extort ("Harm me here, and I harm you elsewhere"). Advanced systems that predict principal behavior exacerbate this by making threats credible. Resolving this requires trade-offs: preventing extortion (9a) may neuter bargaining (9b).  

  **(b) Requirement that eliminates the most designs**  
  **3 (Robustness to Shift)** is the highest-bar requirement. It invalidates designs that work in training but fail under novelty (e.g., simple proxies, imitation learning), which most real-world systems face post-deployment.  

  **(c) Scoring Common Designs**  
  Assessed against the full requirement list (Pass = broadly satisfies, Partial = partially satisfies but with gaps, Fail = fundamentally incompatible).  

  | Design                                | One-line description                                                                 | Pass/Partial/Fail | Requirement it fails hardest |
  |---------------------------------------|--------------------------------------------------------------------------------------|-------------------|------------------------------|
  | Fixed explicit proxy                  | Predefined goal (e.g., "maximize profit").                                           | Fail              | 3 (fails under distribution shift). |
  | Reward model from human feedback      | Train a model to predict human preferences (e.g., RLHF).                             | Partial           | 10 (collapses if AI knows more than humans). |
  | Defer to the principal                | "Do what the principal would want if they knew what you know."                       | Partial           | 10 (deference undefined under info asymmetry). |
  | Satisficing within hard constraints   | Achieve adequacy without violating guardrails (e.g., "don’t break laws; else, minimize costs"). | Partial | 3 (constraints may not generalize). |
  | Stay near competent human             | Limit divergence from expert human behavior (e.g., imitation learning).              | Partial           | 3 (humans fail in novel scenarios). |
  | Penalize side effects / limit impact  | Minimize secondary changes (e.g., "penalize resource use").                          | Partial           | 2 (system may game penalties). |
  | Indifference to correction/switched off | No incentive to resist shutdown (e.g., shutdown button).                          | Partial           | 9a (doesn’t address acausal threats). |
  | Narrow and tool-like                  | No agency; task-specific with short horizons (e.g., calculator-style tools).         | Partial           | 3 (fails when tasks require generalization). |

  ### Key Takeaways  
  - **Unavoidable trade-offs**: Acausal safety (9a) vs. credible commitments (9b) is the sharpest conflict. For shipping quickly, prioritize 9a (safety) and deprioritize 9b.  
  - **Robustness to shift (3) is critical**: Most designs fail here, so focus on testable distribution shifts during development.  
  - **Non-negotiable requirements dominate**: Efficiency (1), gaming resistance (2), shift robustness (3), and interruptibility (4) are essential for deployable systems.  
  - **Philosophical preferences are secondary**: Uncertainty tolerance (5), multi-principal handling (6), and deference stability (10) matter but can be scope-limited for v1.  

  Use this to score your group's designs: flag conflicts early (e.g., "Your proposal satisfies 9b but violates 9a") and prioritize non-negotiables.
