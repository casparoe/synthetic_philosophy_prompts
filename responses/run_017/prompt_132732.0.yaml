  Breaking this down: The user’s decomposition asks for probabilities on several key points—whether the three stances are exhaustive, if responsibility fills a gap, if accountability allows better compression, and if this applies to firms. Each needs a line of justification. I’ll add terms for domain applicability and stance validity (since Dennett’s compressibility might not be the only test). 

  For the probabilities: 
