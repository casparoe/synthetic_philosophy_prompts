  The convergence theorem only tells us that the per-step regret goes to zero almost surely, but it does not tell us how fast. In practice, we care about the rate of convergence. The fanatic prior M₂ converges much slower than M. Specifically, the bound on the expected total regret is O(K(μ)^2) for M₂ versus O(K(μ)) for M. Since K(μ) is the Kolmogorov complexity of the true environment (which is fixed but unknown), in many cases it could be large, and the quadratic bound might be too loose. Thus, M is more efficient in terms of the amount of data required to converge.

  However, note that the convergence theorem does not give a rate for the per-step regret going to zero; it only says that the total regret is bounded. In fact, the per-step regret might go to zero very slowly for M₂. So we can argue that M is better because it converges faster.

  But the user's friend might reply: "The convergence theorem does not require a particular rate, and we are only claiming that the method will eventually converge. Moreover, in the worst-case over μ, the bound for M is K(μ) and for M₂ is K(μ)^2, but since K(μ) is fixed for the true environment, both are finite. Why should we care about the constant if we are only concerned with eventual convergence?"

  **B. The Prior that Minimizes the Worst-Case Regret:**

  One can argue that the Solomonoff prior M is optimal in the sense that it minimizes the worst-case regret over all computable environments. Specifically, the bound for M is O(K(μ)) and this is optimal up to a constant: for any prior, there exists a computable μ such that the regret is at least Ω(K(μ)). 

  In contrast, for M₂, the bound is O(K(μ)^2). In the worst-case over μ, the regret for M₂ can be much larger than for M. Thus, if we want a prior that minimizes the worst-case regret (over μ), then M is better than M₂.

  Moreover, it is known that the Solomonoff prior is Pareto optimal in the set of all universal priors: you cannot have a prior that has a better (i.e., lower) regret bound for every μ. If you try to improve the bound for one μ, you must worsen it for another. The prior M achieves a bound that is optimal up to a constant.

  Therefore, we can defend M as the prior that minimizes the worst-case regret (with respect to the complexity of the environment).

  **C. The Role of the Prior in Scientific Practice:**

  The fanatic prior M₂ is extremely slow to update. In practice, we want a prior that does not require an enormous amount of evidence to switch from a simple but incorrect model to a more complex but correct one. The prior M₂ is so biased toward simplicity that it might stick to a simple model long after it has been falsified. This is not how science progresses.

  However, the convergence theorem does not capture this because it is about asymptotic convergence. We need a different criterion that accounts for the speed of learning. One such criterion is the *expected time to discard a false simple model*.

  But note: the convergence theorem is about the log-loss of the predictions. Even if M₂ is slow to update, the theorem says that the cumulative log-loss will be bounded. However, the boundedness does not imply that the posterior concentrates quickly. It might be that M₂ has a high log-loss for a very long time and then suddenly drops.

  **D. The Invariance of the Prior under Recoding:**

  An important property of Solomonoff's prior is that it is (in a certain sense) invariant under the choice of the universal Turing machine (up to a multiplicative constant). This is because the Kolmogorov complexity K(x) is invariant up to an additive constant when we change the universal machine. Therefore, the prior 2^{-K(x)} is robust (up to a multiplicative constant) to the choice of the universal machine.

