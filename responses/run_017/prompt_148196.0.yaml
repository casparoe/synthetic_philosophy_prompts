  Based on the information provided, I'll address your query step by step, covering the predictions for the Nash Bargaining Solution (NBS) and Kalai-Smorodinsky (KS) solution in your case, an analysis of past cases for discrimination between the rules, my best guess for the mediator's award with reasoning, and a hypothetical case to separate the rules after yours. All arithmetic is shown, and the answer is in British English as requested.

  ### 1. Predictions for Your Case
  Your case has a disagreement point (walk-away) of (0, 0) for both sides, as no settlement means both get nothing. The Pareto frontier is kinked:
  - Segment 1: From (A=0, B=60) to (A=40, B=50). Here, B decreases by 0.25 for every 1-unit increase in A, so B = 60 - 0.25A for A in [0, 40].
  - Segment 2: From (A=40, B=50) to (A=90, B=0). Here, B decreases by 1 for every 1-unit increase in A, so B = 90 - A for A in [40, 90].

  We'll compute the NBS and KS solutions.

  - **Nash Bargaining Solution (NBS):**  
    Maximises the product of utilities (since d = (0, 0), it's uA × uB). We evaluate this on each segment and take the maximum.  
    - Segment 1 (A in [0, 40]): B = 60 - 0.25A  
      Product P = A × (60 - 0.25A) = 60A - 0.25A²  
      Derivative dP/dA = 60 - 0.5A  
      Set to zero: 60 - 0.5A = 0 → A = 120 (outside [0, 40])  
      Since dP/dA > 0 for A < 120 (e.g., at A=40, dP/dA = 60 - 20 = 40 > 0), P is increasing in [0, 40]. Maximum at A=40, B=50: P = 40 × 50 = 2,000.  
    - Segment 2 (A in [40, 90]): B = 90 - A  
      Product P = A × (90 - A) = 90A - A²  
      Derivative dP/dA = 90 - 2A  
      Set to zero: 90 - 2A = 0 → A = 45 (within [40, 90])  
      B = 90 - 45 = 45  
      P = 45 × 45 = 2,025  
      At boundaries: A=40, P=40×50=2,000; A=90, P=90×0=0.  
    - Compare: Max P on segment 1 is 2,000; on segment 2 is 2,025 at (45,45).  
    **NBS prediction: (A=45, B=45) or £45k for A, £45k for B.**

  - **Kalai-Smorodinsky (KS) Solution:**  
    Sets uA / max uA = uB / max uB, where max uA and max uB are the highest achievable utilities given the disagreement point (here, d=(0,0)).  
    - Max uA = 90 (achieved at B=0)  
    - Max uB = 60 (achieved at A=0)  
    So, uA / 90 = uB / 60. Let k be the common ratio: uA = 90k, uB = 60k.  
    This point must lie on the frontier:  
    - Segment 1 (A in [0,40]): B = 60 - 0.25A  
      Set uA = 90k, uB = 60k: 60k = 60 - 0.25(90k)  
      60k = 60 - 22.5k  
      60k + 22.5k = 60 → 82.5k = 60 → k = 60 / 82.5 = 8/11 ≈ 0.727  
      uA = 90 × 8/11 = 720/11 ≈ 65.45, uB = 60 × 8/11 = 480/11 ≈ 43.64  
      But uA = 65.45 > 40, outside segment 1 range. Not feasible.  
    - Segment 2 (A in [40,90]): B = 90 - A  
      Set uA = 90k, uB = 60k: 60k = 90 - 90k  
      60k + 90k = 90 → 150k = 90 → k = 90/150 = 3/5 = 0.6  
      uA = 90 × 0.6 = 54, uB = 60 × 0.6 = 36  
      Check if on segment: A=54 in [40,90], B=90-54=36. Feasible.  
    **KS prediction: (A=54, B=36) or £54k for A, £36k for B.**

