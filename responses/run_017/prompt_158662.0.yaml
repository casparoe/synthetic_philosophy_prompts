prompt: |-
  Act as a comparative political scientist who has also done serious conceptual work in the philosophy of social science: someone equally at home with measurement validity, essentially contested concepts, and the gap between a concept, a definition, and an indicator. Think the problem through carefully before you write. If brainstorming helps, do it silently: your reply must open with its bottom line in the first sentence and then give the reasoning, with no preamble, no restatement of my question, and no throat-clearing about how hard the concept is to define.

  The context is an argument I had with a friend last night that I could not finish. He claims that democratic backsliding is nothing more than a label people attach to institutional reforms they already dislike, and he made four points I could not fully answer: that every canonical case is disputed, with Hungary, Poland, Turkey and the United States all producing confident and opposite verdicts from different observers; that the concept is applied asymmetrically, so that a governing majority enlarging a supreme court counts as backsliding when conservatives do it but as repair when progressives do it; that there is no canonical institutional design, so there is no baseline level from which a country can be said to have slid; and that when voters elect a government that promised these changes, calling the result erosion is just elitism. I conceded the second and I half-conceded the third. I did not concede the rest, and I would rather settle it by building something that works than by arguing.

  Here is the setting in which it has to work. I am one of four coders on a small team that maintains a quarterly country-level monitoring dataset. We screen roughly a hundred institutional changes a year, about fifteen to twenty minutes each. Two coders work each case independently and a senior editor signs off on disagreements. Our codings are published, they feed a donor review process, and they get quoted by journalists, so both false positives and false negatives are costly. Most coders have uneven knowledge of the country in question and English-language summaries only. What I need from you is a decision procedure my team can actually run: the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a not-backsliding verdict, the point at which it stops with a contested-do-not-code verdict, and the points at which it hands the decision to a person because the question is one of values rather than facts.

  The procedure has to confront the following, and I want you to decide how each is handled rather than list options: the baseline problem, including a rule for when disagreement about the baseline is itself outcome-determinative; the prior-state requirement, since a case that was never at a higher level on the dimension in question seems to me to be non-consolidation rather than erosion; the line between changes in the rules of the game and ordinary outputs within them, drawn tightly enough that a policy I dislike is not automatically a constitutional one; a symmetry test that would still disadvantage a reform's enactors were they in opposition, since that is the only guard I can see against the concept turning into a partisan label; a distinction between a reversible tilt and a ratchet, keyed to how hard reversal is and to who controls the referees who adjudicate reversal; an aggregation rule for the salami-slicing problem, where each of several individually defensible changes is minor but the sequence is directional, specifying what counts as one lever of control and over what window changes are pooled; the role of intent, given that we cannot observe it and must not infer it from outcomes we disapprove of; and the two hard families of case, namely reforms that improve one democratic good while degrading another, and reforms enacted with an electoral mandate and a manifesto promise.

  Then apply the finished procedure in full to three cases. First, a governing supermajority rewrites the appointment rules for the constitutional court and extends sitting judges terms so that its own appointees hold a majority past the next election. Second, a state legislature moves authority over election administration from a bipartisan commission to a partisan officeholder and tightens mail-ballot rules, citing uniformity and fraud prevention. Third, a stylized composite I want you to be honest about: a newly elected reformist government, whose agenda has been repeatedly blocked by a supreme court packed by the previous majority, expands that court from nine to fifteen seats and fills them at once through an open public selection process, exactly as it promised in its manifesto. My instinct and my team's instinct is that the third case is democratic repair, and I suspect your procedure will tell me it is backsliding. If it does, say so plainly, and then tell me whether the defect is in the procedure or in my instinct. Close by stating which steps are judgment calls dressed up as procedure, what the procedure cannot do, and whether, on your own showing, it answers my friend.
reasoning: |-
  Alright, the user is a political scientist dealing with democratic backsliding in a coding team. They need a decision procedure that addresses their friend's critiques. Let me start by breaking down the friend's arguments: disputed cases, asymmetric application, no baseline, and elitism. The user conceded some points, so the procedure must tackle these head-on.

  First, the baseline problem. How to define a starting point without a universal standard? Maybe use the country's own prior institutional state. That avoids needing an ideal model. But what if the prior state was flawed? The procedure should require a prior higher state to call it backsliding. Otherwise, it's non-consolidation.

  Next, asymmetry. The user mentioned conservatives vs. progressives changing court sizes. The key is to apply a symmetry test: would the coder still object if their opponents did it? That removes partisanship. Also, intent is tricky—can't infer it from dislike, so focus on effects and reversibility.

  Salami-slicing is another issue. Small changes add up. Need a way to aggregate them. Define a "lever of control," like election administration, and look at changes within, say, an electoral cycle. But how to pool changes? Maybe track modifications to the same institution over five years.

  Intent should be ignored since it's unobservable. Instead, look at the objective impact on checks and balances. For electoral mandates, even popular reforms can be backsliding if they harm democracy. The procedure must separate voter approval from institutional damage.

  The hard cases: improving one democratic good while harming another. Need a threshold—only code if there's a net significant degradation. But how to measure that? Maybe require impairment of accountability mechanisms. Also, reversibility matters. If a change is hard to undo, like altering court appointment rules, it's more likely backsliding.

  Applying to the cases. First, court-packing with term extensions. Prior state had fixed terms; change entrenches majority, low reversibility. Clear backsliding. Second, moving election oversight to partisan control. Weakens accountability, not easily reversible. Backsliding. Third, expanding the court but with open appointments. Here, the prior court was packed, so this might be repair. But the procedure might flag it as backsliding due to structural harm. The user thinks it's repair. The defect might be in the procedure not accounting for context enough, or the user's instinct downplays institutional harm.

  Steps involving judgment: net degradation assessment, reversibility, symmetry test. The procedure can't handle cases where democratic intent is clear but effects are mixed. It answers the friend by systematizing decisions, but values still play a role in some steps.
answer: |-
  **Bottom line: This decision procedure codes democratic backsliding only when a specific institutional change demonstrably degrades a core accountability mechanism relative to the country's own prior state, asymmetrically empowers the incumbent, and is structurally hard to reverse, regardless of intent or popularity.**

  **Decision Procedure: Democratic Backsliding Coding Protocol**

  1.  **PRIOR-STATE BASELINE:** Was there a *prior, stable institutional state* on this specific dimension (e.g., judicial appointment rules, election admin authority)? If NO → Code **Not Backsliding** (Non-Consolidation). If YES → Proceed. *[Handles Baseline/Non-Consolidation: Uses country's own history, not an ideal. Disagreement on baseline outcome-determinative only if evidence shows no stable prior rule existed.]*

  2.  **CHANGE TYPE:** Is the change an *alteration of the rules governing core accountability mechanisms* (e.g., electoral integrity, judicial independence, legislative oversight, media freedom framework, anti-corruption checks)? If NO (e.g., a disliked policy enacted *under* existing rules) → Code **Not Backsliding**. If YES → Proceed. *[Draws tight line: Change must be to the "rules of the game," not outcomes within them.]*

  3.  **FUNCTIONAL EFFECT:** Does the change *objectively reduce constraints on incumbent power* OR *increase barriers to opposition contestation* within this mechanism? (e.g., concentrates appointment power, removes oversight, restricts voter access/franchise, shields executive from judicial review). Rely on functional analysis of rules, not rhetoric. If NO → Code **Not Backsliding**. If YES → Proceed. *[Focuses on objective effect on power asymmetry.]*

  4.  **SYMMETRY TEST:** Would this specific change *objectively reduce constraints/increase barriers* **even if enacted by the current opposition**? (e.g., Would concentrating court appointments in one party's hands weaken judicial independence regardless of which party holds power?). If NO → Code **Not Backsliding** (Likely Partisan Policy). If YES → Proceed. *[Guards against partisan labelling: Must disadvantage *any* enacting majority.]*

  5.  **REVERSIBILITY/RATCHET:** Is the change *structurally difficult to reverse* by a simple change in governing majority? (e.g., requires supermajority, constitutional amendment; entrenches appointments beyond next election cycle; shifts control to bodies dominated by incumbents). If NO (Easily reversible) → Code **Not Backsliding** (Reversible Tilt). If YES → Proceed. *[Key for "ratchet": Focuses on structural barriers to undoing, not intent.]*

  6.  **SALAMI-SLICING AGGREGATION:** (If this change is minor alone) Within the *same institutional lever* (e.g., judicial appointments, election admin rules), have there been *≥2 other changes within the last 5 years* (one electoral cycle) that *each passed Steps 1-5 individually*? If NO (Isolated/First minor change) → Code **Not Backsliding**. If YES → Treat the sequence as one aggregated change → Proceed to Step 7. *[Defines lever & pooling window. Aggregates only minor changes passing Steps 1-5 individually.]*

  7.  **NET DEGRADATION (Hard Cases):** Does the change (or aggregated sequence) represent a *net, significant degradation* of democratic accountability *overall*, considering countervailing improvements? (e.g., Does increased government efficiency *clearly outweigh* reduced oversight? Does a fairer appointment process *justify* weakening judicial review?). **Judgment Call Trigger:** If unclear → Senior Editor makes final call based on balance of harms to core mechanisms. If clear net degradation → Proceed to Code. If net neutral/improvement → Code **Not Backsliding**. *[Requires significant net harm to core accountability. Judgment needed here.]*

  8.  **ELECTORAL MANDATE:** Does the change align with a clear electoral mandate/manifesto promise? **Not Outcome Determinative.** If Steps 1-7 indicate Backsliding → Code **Backsliding**. Popularity does not immunize institutional degradation. If Steps 1-7 do NOT indicate Backsliding → Code **Not Backsliding**. *[Explicitly separates mandate from institutional effect.]*

  **Final Coding Points:**
  *   **Code Backsliding:** Passes Steps 1-5 (or 1-6 aggregate), Step 7 (Net Degradation).
  *   **Code Not Backsliding:** Fails any Step 1-5, or Step 6 (isolated minor), or Step 7 (net neutral/improvement), or Step 8 confirms non-backsliding.
  *   **Contested - Do Not Code:** Insufficient evidence to determine prior state (Step 1) OR ambiguous functional effect (Step 3) OR irreconcilable disagreement on net degradation (Step 7) after Senior Editor review.

  **Application to Cases:**

  1.  **Court Packing & Term Extension:**
      *   Step 1: YES (Prior appointment rules/terms existed).
      *   Step 2: YES (Alters rules for judicial appointments/tenure).
      *   Step 3: YES (Concentrates appointment power, entrenches majority beyond election, reduces constraint).
      *   Step 4: YES (Concentrating power weakens independence regardless of enacting party).
      *   Step 5: YES (Entrenched appointments hard to reverse before next election).
      *   Step 6: N/A (Major change).
      *   Step 7: YES (Net degradation - weakens check on executive/legislature).
      *   Step 8: Mandate irrelevant per procedure.
      *   **VERDICT: Code Backsliding.**

  2.  **Election Admin Shift & Mail-Ballot Rules:**
      *   Step 1: YES (Prior bipartisan commission existed).
      *   Step 2: YES (Alters rules for election administration).
      *   Step 3: YES (Shifts control to partisan actor, potentially increasing barriers via mail rules).
      *   Step 4: YES (Partisan control over election admin increases potential for bias regardless of party).
      *   Step 5: YES (Reversal likely requires legislative action; new officeholder controls process).
      *   Step 6: N/A (Treat shift + rule change as one act on same lever).
      *   Step 7: YES (Net degradation - weakens impartial administration).
      *   Step 8: Mandate irrelevant per procedure.
      *   **VERDICT: Code Backsliding.** (Uniformity/fraud rhetoric is Step 3 functional analysis; effect is power shift/barrier increase).

  3.  **Reformist Court Expansion:**
      *   Step 1: YES (Prior court size/appointment rules existed).
      *   Step 2: YES (Alters rules for judicial composition/appointments).
      *   Step 3: YES (Alters court composition immediately, potentially reducing constraint *if* prior court was an effective check - but this is contested). **Functional Effect Ambiguous?** (Depends on prior court's legitimacy/function).
      *   Step 4: **YES** (Expanding a court and packing it *in one move* concentrates appointment power and weakens institutional independence *regardless* of which party does it or the prior context. The structure empowers the enactor).
      *   Step 5: YES (Immediate appointments are entrenched, hard to reverse structurally).
      *   Step 6: N/A.
      *   Step 7: **Judgment Call:** *Does open selection clearly outweigh the structural harm of court-packing?* Senior Editor must decide net effect. *Likely Net Degradation*: Open process is positive, but the core act (packing + structural empowerment of incumbent) severely weakens judicial independence as an institution long-term.
      *   Step 8: Mandate irrelevant per procedure.
      *   **VERDICT: Your instinct likely sees repair; the procedure flags Backsliding.** The defect lies in *both* the procedure and instinct. The procedure correctly identifies the structural harm (Steps 3, 4, 5, 7) inherent in court-packing as a tactic, regardless of motive or prior context. Your instinct prioritizes context/outcome (undoing prior packing) over the institutional damage caused by the *method* used. The procedure treats the *method* (court-packing) as inherently backsliding due to its effect on institutional integrity. **Senior Editor Judgment Call Required on Step 7 Net Degradation.** If coded, it would be Backsliding.

  **Closing Assessment:**

  *   **Judgment Calls Dressed as Procedure:** Step 7 (Net Degradation) is inherently judgmental, though structured. Ambiguity in Step 3 (Functional Effect) sometimes requires interpretation. Step 4 (Symmetry Test) requires counterfactual reasoning.
  *   **What the Procedure Cannot Do:**
      *   Perfectly resolve normative trade-offs in Step 7.
      *   Eliminate all coder subjectivity in functional analysis (Step 3) or symmetry (Step 4).
      *   Account for the *overall democratic health* trajectory beyond the specific change.
      *   Directly measure democratic "intent" or legitimacy beyond institutional effects.
      *   Guarantee perfect inter-coder reliability on close calls.
  *   **Answering Your Friend:** Yes, the procedure directly answers his core objections:
      *   **Disputed Cases:** Provides a clear, structured method to evaluate specific changes, reducing reliance on partisan "verdicts."
      *   **Asymmetry:** Step 4 (Symmetry Test) explicitly requires the change to disadvantage *any* enactor.
      *   **No Canonical Baseline:** Step 1 uses the country's own prior state.
      *   **Elitism vs. Mandate:** Step 8 explicitly separates mandate from institutional effect. Coding is based on rules, not policy preferences.
      *   It confronts the hard cases (intent ignored, mandate irrelevant, net degradation assessed, salami-slicing aggregated) he implicitly raised. While not perfect, it operationalizes the concept defensibly for your monitoring context.
