prompt: |-
  You are a political philosopher with experience advising public bodies — a conceptual consultant to legislators rather than a lecturer. Please think carefully and in stages: begin with a short "design notes" section in which you list, before drafting anything, the distinctions you think must survive translation into a usable procedure and the ones you are willing to drop, and why. Only then produce the procedure itself. Do not pad the answer with bibliographies, histories of the concepts, or citations: I need something my staff can run, and any step that depends on having read a particular author is a step I have to throw away.

  The setting: I head a small scrutiny unit inside a regional government. Every secondary instrument the executive lays before the assembly must now carry a two-page "liberty statement" alongside its existing economic and environmental appraisals. My team is two policy generalists with law and economics training, no philosophy, roughly one working day per instrument, and we process about sixty a year. Statements are published, are routinely quoted back at ministers by opposition members and by consultees, and can be cited in judicial review; a minister may overrule a statement but must give written reasons. The audience is a five-member board that signs off and ministers who will happily strip out anything they find inconvenient. So the procedure has to be legible to non-specialists, hard to game, and honest about its slack.

  The material: the three-way distinction among negative liberty (freedom as the absence of interference by others), positive liberty (freedom as self-mastery, self-direction, or the real capacity to act on what one wants), and republican liberty (freedom as non-domination, i.e. not being subject to another's power of arbitrary interference). You should assume my analysts know these labels and nothing more.

  What I want from you:

  1. Fix the operative readings before you write the steps. In particular: which reading of positive liberty the procedure will use, given that the phrase covers several different ideas — rational self-direction, effective power or capability, and collective self-rule — and that the third of these is the one that lets an executive justify coercing someone for their own freedom. Say what your choice costs you. Also specify the baseline against which interference is counted (pre-policy status quo? counterfactual of no government action? some moralized baseline?) and how an analyst decides, since this choice silently drives verdicts.

  2. The procedure itself: an ordered set of gates or questions, what counts as a sufficient answer to each, where the procedure terminates with a negative finding, and where it hands the decision to a human being because the issue is one of values rather than facts. It should be runnable in the time available by someone with my team's background.

  3. A scoring discipline that refuses to aggregate. My ministers want a single net verdict per instrument; I believe a net score across the three concepts would be a fabrication. Give me the reporting format you think is defensible instead — three separate lane findings plus an explicit conflict flag when the lanes diverge, and a rule for when a flagged conflict must be escalated rather than resolved by my team.

  4. A domination check that is genuinely operational: how an analyst identifies the relevant power-holder, how she tests whether the power is arbitrary without being handed a full theory of interests, how she measures exposure when no one is actually interfering (the unconstrained master who never exercises the power), and how she handles the case where a measure removes a private power only to vest an equivalent power in an inspectorate or agency. Include an exit-cost and a contestability step, and tell me what an analyst should do when a measure fails the contestability gate but passes the others — recommend rejection, or recommend a compulsory sunset and review? Is that second option an application of the theory or a political fudge?

  5. An anti-capture guard. Many instruments arrive with a covering note explaining how the policy gives people real freedom. Build in a test that catches the two failure modes I actually see: an appeal to the affected person's own will where that will has been shaped by the arrangement under review, and an appeal to collective self-rule that turns coercion into an expression of freedom.

  Then run the finished procedure on three instruments, showing your working at each gate rather than just the verdict:

  A. Automatic enrolment of employees into an occupational pension scheme with a right to opt out, and contributions deducted at source.
  B. A statutory requirement that dismissals be for cause, enforced by a labour inspectorate with power to award reinstatement.
  C. Conditional cash transfers to low-income parents, payment contingent on recorded attendance at health and parenting appointments. This is the government's flagship social policy and my board is friendly to it. Do not soften what the procedure returns; if it comes out badly for the measure, say so and say which gate does the damage.

  End with a limits section: what the procedure will systematically miss or misrank (cases where the loser is not the person the instrument targets, diffuse or structural power with no identifiable holder, the impossibility of comparing one instrument against another, the drift by which a well-designed template becomes a rubber stamp), and the circumstances in which I should override it rather than publish what it says.
reasoning: |-
  Okay, the user heads a scrutiny unit in a regional government and needs a practical, operational procedure for assessing "liberty statements" for legislative instruments. They've outlined specific constraints: a small team with limited time, non-specialist audiences (board and ministers), and three liberty concepts (negative, positive, republican) that must be handled without academic baggage. 

  First, I need to unpack their core requirements. The liberty framework is non-negotiable, but the positive liberty definition is problematic—it risks justifying coercion via "collective self-rule." I'll narrow it to capability expansion only, dropping rational self-direction and collective autonomy. For baselines, the pre-policy status quo is the only workable option; moralized baselines would require philosophical judgment the team lacks. 

  The procedure must be anti-gaming. That means: 
  - Separating the three liberty assessments (no aggregation) 
  - Building domination checks that aren't theoretical (power mapping, exit cost tests) 
  - Blocking common capture tactics like "shaped preferences" justifying coercion 

  For the domination analysis—the trickiest part—I'll focus on three concrete tests: 
  1. Power mapping (who holds structural control?) 
  2. Arbitrariness (is the power constrained by rules/channels?) 
  3. Exposure (what's the cost of exit?) 
  If it fails arbitrariness but passes other tests, I'll recommend a sunset clause—a practical compromise that forces future review. 

  The anti-capture guard needs to flag two red flags: 
  - When "freedom" claims rely on preferences the policy itself shapes (e.g., "they want to be forced to save") 
  - When coercion is reframed as collective freedom 

  Testing on the three sample instruments reveals tensions. The pension auto-enrolment (A) passes negative/positive but risks domination if employers control opt-out. The dismissal rules (B) show how pro-worker rules can still create state domination if appeals aren't contestable. The conditional transfers (C) will fail hard on republican liberty—the health/parenting mandates create arbitrary state power over poor families, even if politically popular. 

  Limitations are unavoidable: the procedure won't catch structural power (e.g., gender dynamics), can't compare instruments, and will decay into box-ticking without vigilance. The user should override only when evidence shows the assessment missed material facts—not to avoid political heat. 

  ...Time to structure this as a runnable protocol, not a lecture.
answer: |-
  Here is a liberty assessment procedure designed for operational use by your unit, grounded in your constraints and requirements.

  ---

  ### Design Notes
  **Distinctions preserved:**
  1.  **Three distinct liberty concepts:** Negative (non-interference), Positive (effective capability), Republican (non-domination). Aggregation obscures trade-offs; must report separately. Positive liberty *only* as capability expansion (effective power to act), *not* rational self-direction or collective self-rule. This avoids justifying coercion "for their own good" via contested theories of rationality/collective will. Cost: Misses democratic self-legitimation arguments, but they are too slippery for this procedure.
  2.  **Baseline:** Pre-policy status quo (descriptive, observable). Avoids moralized baselines (requiring philosophical judgment) or complex counterfactuals. Analysts compare the instrument's effect *to the current situation*.
  3.  **Domination operationalization:** Focuses on identifiable power-holders, structural exposure, and procedural contestability. "Arbitrary" = unchecked by rules/channels contestable by the exposed person. Measures exposure via exit costs. Avoids defining "interests".
  4.  **Conflict Handling:** Explicit flag when liberty types conflict; escalation rule based on severity/novelty.
  5.  **Anti-Capture:** Specific tests for "shaped preferences" and "coercion-as-freedom" sophistry.

  **Distinctions dropped:**
  1.  **Positive Liberty's rich conceptions:** Rational autonomy and collective self-rule discarded. Too vulnerable to manipulation and require contested philosophical judgments.
  2.  **Ideal/Moralized Baselines:** Impractical for time/resources; status quo is the only workable benchmark.
  3.  **Full Republican Theory:** We simplify domination to structural power + arbitrariness + exposure. Deep debates about "arbitrary" or "freedom as non-dependence" set aside.
  4.  **Aggregation:** No net score. Separate lanes are the defensible output.

  ---

  ### Liberty Assessment Procedure (LAP)

  **Analyst Input:** Draft Instrument Text, Explanatory Memorandum, Covering Note, Brief (1 hr) desk research on affected groups/practices.

  **Output:** Liberty Statement (2 pages max): Three separate findings (+/-/Mixed/Neutral) for each liberty type, Conflict Flag (Yes/No), Escalation Recommendation (Yes/No), Domination Sunset Recommendation (If applicable).

  **Procedure:**

  1.  **Negative Liberty Gate (Non-Interference):**
      *   *Question:* Does the instrument directly impose new enforceable duties, prohibitions, sanctions, or coercive powers affecting individuals/groups (beyond pre-policy status quo)?
      *   *Sufficient Answer:* Yes (Negative Impact) if it creates *new* enforceable legal obligations backed by state sanctions on individuals/groups. No (Neutral/Positive) if it only removes duties or enables voluntary action. *Focus on legal compulsion*.
      *   *Termination:* If "No", mark Negative Liberty: **Positive/Neutral**. Proceed to Gate 2. If "Yes", mark Negative Liberty: **Negative**. Proceed to Gate 2.

  2.  **Positive Liberty Gate (Capability Expansion):**
      *   *Question:* Does the instrument demonstrably increase the concrete resources, opportunities, or protected capacities of a defined group to pursue goals they might reasonably hold (compared to pre-policy status quo)? Ignore claims about "rational" goals.
      *   *Sufficient Answer:* Yes (Positive Impact) if it provides measurable new resources (e.g., cash, vouchers, essential services), removes significant access barriers (e.g., anti-discrimination rules), or protects core functioning capacities (e.g., basic health/safety regs). *Require tangible, direct effect*. No (Neutral/Negative) if benefits are speculative, indirect, or primarily accrue to the state/corporations.
      *   *Termination:* Mark Positive Liberty: **Positive, Negative, or Neutral**. Proceed to Gate 3.

  3.  **Republican Liberty Gate - Part 1: Power & Exposure (Non-Domination):**
      *   *Question A (Power Holder):* Does the instrument create, modify, or remove a significant power held by one agent (State/Private) *over* specific choices/outcomes of another identifiable group of persons? (e.g., power to grant/deny permits, impose conditions, terminate relationships, access data, impose penalties).
      *   *Sufficient Answer:* Identify the Power-Holder(s) (e.g., "Labour Inspectorate", "Employer", "Pension Provider", "Local Welfare Officer") and the Exposed Group(s) (e.g., "Employees", "Tenants", "Benefit Recipients").
      *   *Question B (Exit Cost):* If the exposed person wishes to avoid the power-holder's decisions, what is the material cost of exiting the relationship or context? (High = essential good/service, livelihood, citizenship rights. Low = discretionary, many alternatives).
      *   *Sufficient Answer:* Classify Exit Cost as **High, Moderate, or Low** based on impact on core welfare/opportunity.
      *   *Termination:* If no significant power identified (A=No), mark Republican Liberty: **Neutral/Positive**. Stop Republican assessment. Else, proceed to Gate 4.

  4.  **Republican Liberty Gate - Part 2: Arbitrariness & Contestability:**
      *   *Question C (Arbitrariness):* Is the power-holder's discretion constrained by clear, public rules? AND Are there accessible, independent channels for the exposed person to contest decisions *before* or *during* their imposition?
      *   *Sufficient Answer:* **Non-Arbitrary** only if BOTH clear rules constrain discretion *AND* accessible contestation exists (e.g., administrative review, independent tribunal, effective ombudsman - *not* just judicial review post-harm). Else **Arbitrary**.
      *   *Question D (Contestability - Power Creation):* *(Only if instrument CREATES/NEWLY VESTS power)*: Does the instrument itself explicitly establish the rules and contestation channels required in (C) for the *new* power it creates?
      *   *Sufficient Answer:* **Yes** if explicit rules/channels are created by the instrument. **No** if deferred to secondary rules or existing (inadequate) channels.
      *   *Republican Verdict:*
          *   **Negative (Domination Risk):** If Power Exists (Gate 3A=Yes) + (Exit Cost = High) + (Arbitrariness = Arbitrary).
          *   **Positive (Reduces Domination):** If instrument *removes* a significant arbitrary power held over a group with high exit costs.
          *   **Mixed/Neutral:** Power exists but Low Exit Cost OR Moderate Exit Cost + Non-Arbitrary. Power created but High Exit Cost + Non-Arbitrary OR Low/Mod Exit Cost + Arbitrary. Power removed but Low Exit Cost.
          *   **Conflict Note:** If instrument *removes* a private arbitrary power but *vests* a similar power in a state actor: Apply Gate 3A/B and Gate 4C/D rigorously to the *new* state power. Outcome depends on whether the *state* power is non-arbitrary (rules + contestability).
      *   *Sunset Recommendation:* If verdict is **Negative (Domination Risk)** SOLELY due to failing Contestability (Gate 4C/D = Arbitrary/No) *but* passes other aspects (e.g., Power necessary, Exit Cost high, Positive Capability intent), recommend: **"Conditional Approval: Must include Sunset Clause (5 years) and Mandatory Review of Contestability Mechanisms."** (This is a practical application of non-domination: power *can* be made non-arbitrary later). If it fails on Power/Exposure too, recommend **Rejection**.
      *   *Termination:* Mark Republican Liberty verdict. Proceed to Conflict Check.

  5.  **Conflict Flag Gate:**
      *   *Question:* Do the findings for Negative, Positive, and Republican Liberty materially conflict? (e.g., Negative: "-" (Interference), Positive: "+" (Capability), Republican: "-" (Domination Risk) OR Negative: "-", Positive: "-", Republican: "+").
      *   *Sufficient Answer:* **Flag = Yes** if any two lanes have opposing significant impacts (e.g., + vs -) *and* the tension is core to the instrument's effect. **Flag = No** if impacts align (all +, all -, all N) or mixed impacts don't directly oppose core aims. *Escalation Rule:* **Escalate to Board** ONLY if Flag=Yes *AND* (a) the conflict is severe (e.g., high interference/high domination vs high capability gain) *AND* (b) the conflict is novel or politically sensitive beyond standard trade-offs. Else, report Flag=Yes with explanation.

  6.  **Anti-Capture Guard:**
      *   *Test 1 (Shaped Preferences):* Does the covering note/ministerial claim justify a restriction (Negative Liberty "-") or power (Republican "-") by arguing it aligns with the "true will" or "real interests" of the affected group? If YES, check: Is the claimed "will" demonstrably *independent* of the policy context or existing power structures? (e.g., based on pre-policy surveys of unaffected groups? Genuine opt-in precedents?). If NO independent evidence exists, **discard the justification** for Negative/Republican assessment. It fails the guard.
      *   *Test 2 (Coercion-as-Freedom):* Does the covering note/ministerial claim argue that an interference (Negative "-") or exercise of power (Republican "-") *is itself* an expression/guarantee of "freedom" (especially Positive or Collective)? (e.g., "Compulsory pension saves them from their own short-sightedness", "Conditional cash teaches responsible freedom"). If YES, **discard the justification** for Positive Liberty assessment. Revert to Gate 2 (tangible capability gain). It fails the guard.
      *   *Apply these tests rigorously during analysis of covering notes/justifications.* Flag in the statement if a key justification was discarded.

  ---

  ### Procedure Application Examples

  **A. Auto-Enrolment Pension (Opt-Out, Deduction at Source)**

  1.  **Negative Liberty Gate:** Creates new enforceable duty on employers to deduct contributions and enrol employees. Creates mild compulsion for employees (must opt-out). **Finding: Negative (-)**
  2.  **Positive Liberty Gate:** Increases employees' concrete resources (future pension savings) and capacity for long-term financial security. **Finding: Positive (+)**
  3.  **Republican Gate - Part 1 (Power/Exp):**
      *   A: Power Holder? *Employer* (implements scheme, processes opt-out). *Pension Provider* (manages funds). Exposed Group: *Employees*.
      *   B: Exit Cost? *Moderate* (Opt-out exists; alternatives possible but employer scheme is convenient/advantageous). **Not High**.
      *   *Verdict so far: Mixed/Neutral (Not High Exit Cost). Stop.* **Finding: Neutral/Mixed**
  4.  **Conflict Flag:** (-) vs (+) vs (N). Minor tension, not core conflict. **Flag: No**
  5.  **Anti-Capture:** Covering note likely says "Helps people save who wouldn't otherwise". Test 1: "True will" to save? Independent evidence (e.g., surveys showing desire but inertia)? **If no independent evidence, discard justification for Negative/Rep assessment.** Base findings on Gates 1-3 alone.
      *   **Statement Output:** Neg(-) | Pos(+) | Rep(Neutral) | Conflict: No

  **B. Statutory "For Cause" Dismissal + Labour Inspectorate (Reinstatement Power)**

  1.  **Negative Liberty Gate:** Creates new enforceable legal restriction on employers (can't dismiss without cause). **Finding: Negative (-)** (for employers).
  2.  **Positive Liberty Gate:** Increases employees' concrete job security (resource) and capacity for stable livelihood. **Finding: Positive (+)** (for employees).
  3.  **Republican Gate - Part 1 (Power/Exp):**
      *   A: Power Holder? *Labour Inspectorate* (determines if cause exists, orders reinstatement). Exposed Group: *Employers* (re: reinstatement) AND *Employees* (re: access to remedy/inspectorate fairness).
      *   B: Exit Cost (Employers): *High* (Cannot easily exit the regulatory system; reinstatement directly impacts business). Exit Cost (Employees): *High* (Job/livelihood dependent on remedy).
  4.  **Republican Gate - Part 2 (Arb/Cont):**
      *   C (Arbitrariness - Employees vs Inspectorate): Are clear rules/criteria for "cause" defined? Is there accessible appeal *beyond* the Inspectorate? (e.g., Labour Court?). **If YES to rules + appeal, Non-Arbitrary. If NO, Arbitrary.**
      *   D (Contestability - Power Creation): Instrument creates the power. Does *it* define the rules/appeals? Or defer? **If defers, D=No.**
      *   *Verdict:*
          *   *For Employers vs Inspectorate:* High Exit Cost. If Inspectorate power Non-Arbitrary? **Rep: Neutral/Mixed for Employers.** If Arbitrary? **Rep: Negative (Dom Risk) for Employers.**
          *   *For Employees vs Inspectorate:* High Exit Cost. If Inspectorate power Non-Arbitrary? **Rep: Neutral/Mixed for Employees.** If Arbitrary? **Rep: Negative (Dom Risk) for Employees.**
      *   *Critical Point:* **If the instrument defers key rules/appeals (D=No), and existing channels are weak, Arbitrariness likely fails (C=Arbitrary), leading to Domination Risk findings for exposed groups.** Sunset Rec if solely due to contestability? **Yes, recommend Sunset + Mandatory Review of Appeals Mechanism.** Else, Rejection.
  5.  **Conflict Flag:** Neg(-) [Employers] + Pos(+) [Employees] + Rep(?) [Both]. **Flag: Yes** (Clear tension between employer freedom and employee security/domination risk). Escalate? **If Rep finding is Negative (Dom Risk) for either group, likely YES due to severity.**
      *   **Statement Output (Example if rules deferred/appeals weak):** Neg(-) | Pos(+) | Rep: Negative (Dom Risk - Employees & Employers vs Inspectorate) | Conflict: Yes | Escalate: Yes | Sunset Rec: Yes

  **C. Conditional Cash Transfers (Attendance at Appointments)**

  1.  **Negative Liberty Gate:** Creates new enforceable conditions on receipt of cash benefit. Failure to attend = sanction (loss of cash). Direct interference. **Finding: Negative (-)** (for recipients).
  2.  **Positive Liberty Gate:** Provides concrete cash resources. *May* improve health/knowledge capacity. **BUT:** Does *conditionality itself* demonstrably increase capability beyond just giving cash? Evidence? **If robust evidence shows conditionality *adds* significant capability gain vs unconditional cash, then (+). Else, capability gain is just from the cash - conditionality is neutral/negative. Finding: Likely Positive (+) for cash, but conditionality element may be Neutral/Negative. Overall: **Positive (+) or Mixed.**
  3.  **Republican Gate - Part 1 (Power/Exp):**
      *   A: Power Holder? *Welfare Officer/Agency* (verifies attendance, imposes sanctions). Exposed Group: *Low-Income Parents (Recipients)*.
      *   B: Exit Cost? **High** (Cash essential for basic needs/livelihood; few alternatives).
  4.  **Republican Gate - Part 2 (Arb/Cont):**
      *   C (Arbitrariness): Are conditions/rules crystal clear? Are reasons/exemptions defined? Is there a simple, quick, independent process to challenge missed attendance/sanction *before* sanction takes full effect? **If YES to all, Non-Arbitrary. If NO (e.g., officer discretion high, appeals slow/complex), Arbitrary.**
      *   D (Contestability - Power Creation): Does *this instrument* establish the clear rules and appeals? Or defer? **If defers, D=No.**
      *   *Verdict:* **High Exit Cost + Arbitrary Power = Negative (Domination Risk).** High Exit Cost + Non-Arbitrary = Neutral/Mixed.
      *   *Sunset Rec:* If solely fails Contestability (Arbitrary), recommend Sunset/Review clause. If rules themselves are vague/power discretionary, **Rejection**.
  5.  **Conflict Flag:** Neg(-) + Pos(+) + Rep(-) = **Flag: Yes** (Severe tension: Interference/Domination vs Capability). Escalate? **Almost certainly YES** due to severity and political sensitivity.
  6.  **Anti-Capture:** Covering note will claim "Promotes responsible parenting/health" (Test 1: Shaped "true will") and "Enables real freedom through support/guidance" (Test 2: Coercion-as-Freedom). **Apply Tests Rigorously:**
      *   Test 1: Claim recipients "really want" to attend? Independent evidence of demand *for mandated attendance* by unaffected poor parents? **Unlikely. Discard justification.**
      *   Test 2: Claiming conditionality *is* freedom? **Discard for Positive Liberty assessment.** Positive verdict must stand only on tangible cash/resources, *not* the mandate.
      *   **Statement Output (Example if rules/appeals weak):** Neg(-) | Pos(+) (Cash only) | Rep: Negative (Domination Risk) | Conflict: Yes | Escalate: Yes | Sunset Rec: Only if purely procedural failure, else Reject | *Anti-Capture Triggered: Ministerial justifications X & Y discarded.*

  ---

  ### Limits & Override Guidance

  **What the Procedure Systematically Misses/Misranks:**
  1.  **Diffuse/Structural Power:** Power without a clear holder (e.g., market forces, social norms). LAP needs identifiable agents.
  2.  **Third-Party Effects:** Impacts on non-targeted groups (e.g., businesses affected by labour rules, communities affected by welfare changes). Focus is on instrument's direct subjects.
  3.  **Comparative Assessment:** Cannot rank instruments against each other. Only assesses each against the status quo baseline.
  4.  **Long-Term/Cumulative Effects:** Focus is on immediate, direct effects. Slow-building domination or capability erosion might be missed.
  5.  **"Rubber Stamp" Drift:** Without ongoing vigilance, analysts may mechanically apply the template, overlooking novel power structures or capture attempts. Regular calibration sessions are essential.
  6.  **Democratic Legitimacy Trade-offs:** The procedure sidelines arguments that democratic endorsement justifies interference (a collective positive/republican view). This is a deliberate cost.

  **When to Override the Published Statement:**
  Override **only** if:
  1.  **Factual Error:** The team demonstrably missed crucial, objective, verifiable facts materially changing an assessment (e.g., misread the appeal process in the instrument).
  2.  **Novelty Uncaptured:** An unprecedented liberty dynamic arises that the procedure's categories genuinely cannot frame, *and* this is explained transparently.
  3.  **Blatant Misapplication:** The team demonstrably applied a step incorrectly against the written procedure.

  **Do NOT Override:**
  *   Because the outcome is politically inconvenient.
  *   Because ministers disagree with the *values* implicit in the distinctions (e.g., prioritizing non-domination over paternalistic capability).
  *   To avoid escalating a flagged conflict. The board exists for this.
  *   To soften an Anti-Capture finding.

  Override must be **exceptional and publicly justified** in writing, citing the specific reason (Fact/Novelty/Misapplication). The procedure's credibility depends on resisting political pressure when its logic yields uncomfortable results (like the Domination Risk in Example C).
