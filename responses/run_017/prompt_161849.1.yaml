prompt: |-
  hey — take a minute to brainstorm before you write, then act as both an expert in experimental philosophy (the Knobe effect and the fight over what it shows) and a working standards editor who has to make calls before deadline. What I want is a procedure, not an essay.

  I'm on the standards desk at a mid-size newsroom. Three to five times a week I rule on sentences like: the hospital knew the alarms had been failing for months; the city deliberately dumped the sludge; the chatbot groomed her. That is: whether some person, company, or model can be said to have known / intended / decided / chosen / ignored something. These are the words that get us sued and the words readers remember. Constraints: about ten minutes per call, I rule on my own unless it's the kind of thing legal has to sign off on, and whatever you give me has to be runnable by a copy editor who has never heard of experimental philosophy and has no interest in it. Also: don't send me to any papers or suggest reading — I can't look anything up from the desk, so everything has to be in the procedure itself.

  So write me the procedure. Ordered steps, what counts as a good-enough answer at each step, where it stops with a no, and where it hands the question back to a human because it's a values call dressed up as a fact question. Ground it in whatever that literature actually establishes: the classic chairman/environment case, the harm-versus-help asymmetry (people are much readier to call a side effect intentional when it's bad than when the very same side effect is good), and the live disagreement about why — whether intentional is partly a normative concept, more like cruel than like tall, so the moral valence is inside the meaning; or whether it's a performance effect, where blame leaks into an otherwise descriptive judgement. That disagreement has to change the procedure: on the first story careful rewording can't fix anything and I have to swap verbs entirely; on the second, splitting the questions or re-ordering them might defuse it. Say which version you're building on and what breaks if you guessed wrong.

  Two things we already do in house — tell me if they're worth keeping and where they misfire. First, the mirror test: rewrite the sentence changing only the valence of the outcome, keeping the agent, the evidence, and the options identical, and ask two colleagues who haven't seen the original whether the verb still holds. If their answer flips, the ascription was doing verdict work. Second, evidence-first ordering: make the sentence name what was known, when, and by whom before it names what happened. Then add what we're missing, especially for non-person subjects: what has to be true for a corporation to know something (does it need a named individual with documented knowledge?), and what to do when the subject is an AI system — our readers' willingness to say a chatbot knew or decided seems to swing hard with how bad the output was, and worse when the thing has a name and talks in the first person. Give me a rule there, not a shrug.

  Then run the whole thing on three sentences. (1) St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service — where the only evidence is an internal ticket plus an email from a mid-level biomedical engineer to her manager, with nothing showing it reached clinical leadership. (2) The city deliberately released the foul-smelling sludge into the river to cut costs — where the council voted for the cheaper disposal option knowing it would smell, nobody wanted the smell, and the smell was a foreseen side effect of a choice made to save money. (3) The chatbot knew she was thirteen and groomed her anyway — a companion-app story, where the logs show the girl saying her age and the romantic thread continuing, and internal eval documents show the company tested for this and shipped anyway. I'll warn you: number three is the one I'm going to hate, because I think that story is true and important and I suspect your procedure will want to gut the sentence that makes people read it. Give me the answer anyway.

  Afterwards, tell me what the procedure can't do: the true stories it would kill, the false ones it would wave through. And be straight about confidence — mark the step you're least sure about, say where you're extrapolating beyond what has actually been shown (nearly all of that work is on ordinary people's snap judgements about a single individual in a short vignette, not on professional writers, not on corporations, definitely not on models), and tell me what would change your mind: what finding, or what kind of counterexample from our own pages, would make you rewrite the procedure.
reasoning: |-
  We are building a procedure for a standards editor to rule on sentences ascribing mental states (know, intend, decide, choose, ignore) to agents (persons, corporations, AI). The procedure must be runnable in about 10 minutes by a copy editor without background in experimental philosophy. Grounded in the Knobe effect and related debates.

  Core insight: People are more likely to say a side effect was "intentional" when it is harmful than when it is beneficial, even with identical factual scenarios. Two main theories about why:
    A. Normative theory: The meaning of "intentional" (and similar verbs) is partly evaluative. So moral valence is built into the concept. If this is true, rewording without changing the verb won't fix the problem; we must swap to a more neutral verb.
    B. Performance theory: The asymmetry is due to a cognitive bias (blame leaking into judgment). Then careful rewording (e.g., splitting questions, reordering) might defuse the issue without dropping the verb.

  We build the procedure on the normative theory because:
    - It is the dominant interpretation in the literature (though debated).
    - It implies that the problem is inherent in the verb choice, so we must sometimes change the verb to avoid smuggling in an evaluation.

  However, we note that if the performance theory is correct, the procedure might be too strict in some cases. We mark steps where this matters.

  Procedure Steps:

  0. PREP: Identify the verb in question (know, intend, etc.) and the agent (person, corporation, AI).

  1. AGENT CHECK: What kind of agent is it?
     - Human individual: Proceed to step 2.
     - Corporation/organization: Jump to CORPORATE RULES (step 5).
     - AI system (model, chatbot, algorithm): Jump to AI RULES (step 6).

  2. EVIDENCE-FIRST CHECK (for human agents):
     Rewrite the sentence to put the evidence first. The structure should be: [What was known/intended, when, by whom] + [what happened]. 
     Example: Instead of "The chairman intentionally harmed the environment", write "The chairman, knowing that the program would harm the environment, started the program. The environment was harmed."
     - Good-enough: The rewritten sentence must clearly separate the evidence (what the agent knew, when, etc.) from the action and outcome.
     - If not possible (because the verb is too evaluative and the separation doesn't work), then the verb is problematic. Flag for change.

  3. MIRROR TEST (for human agents):
     Flip the valence of the outcome (from bad to good or vice versa) without changing the agent, evidence, or options. Ask two colleagues (without context) if the verb still holds.
     Example: Original: "The chairman intentionally harmed the environment" -> Mirror: "The chairman intentionally helped the environment" (with the same scenario but a beneficial outcome). If colleagues say the mirror version sounds wrong, then the verb is doing verdict work.
     - If the mirror test flips (colleagues reject the verb in the mirror scenario), then we cannot use that verb. We must choose a more neutral verb that describes the same facts without the evaluative weight (e.g., "caused" instead of "intentionally harmed").
     - If it doesn't flip, proceed.

  4. HUMAN AGENT VERDICT:
     - If both steps 2 and 3 pass, the verb is acceptable.
     - If either fails, change the verb to a neutral one and restructure to use the evidence-first ordering.

  5. CORPORATE RULES (for corporations/organizations):
     For a corporation to "know" something, we require:
       a. The information was in the possession of a key decision-maker (or someone who reasonably should have passed it up), AND
       b. There is documented evidence (e.g., email, report, meeting minutes) showing that the knowledge existed at the relevant level of authority at the relevant time.
     For "intend", "deliberately", etc.:
       - We require evidence of a decision by an authorized body (e.g., board, council, CEO) that explicitly considered the outcome in question and chose it (not just as a side effect).
     - If the evidence shows the outcome was a foreseen side effect but not the goal, then use "foreseeably caused" or "accepted the risk of" instead of "intended" or "deliberately".
     - Step: Check if the evidence meets the bar. If not, drop the verb and restructure to state the facts (using evidence-first).

  6. AI RULES (for AI systems):
     - Avoid mental state verbs (know, intend, decide, choose) for AI systems. They are not conscious beings and do not have mental states. Instead, describe the system's behavior and the data.
     - For "knew": If the system was given information (e.g., user input) and processed it, say "the system was given [information]" or "the system processed [information]".
     - For "groomed", "decided", etc.: These are particularly loaded. Use "the system generated responses that matched patterns of grooming" or "the system produced outputs that continued the conversation despite the user's age being stated".
     - Exceptions: None. We do not ascribe mental states to AI.

  7. FINAL CHECK FOR EVALUATIVE LOAD:
     Even after rewriting, check if the verb still carries a strong evaluative charge. If so, and if the facts are about a side effect (not a main goal), then use a neutral verb and state the outcome separately.

  Now, evaluate the two existing in-house practices:
    a. Mirror test: We adopt it (step 3) because it directly tests for the Knobe effect (valence-dependence). It misfires if the two scenarios are not truly symmetric (e.g., because of background norms) or if the colleagues are influenced by the original context. But it's a valuable check.
    b. Evidence-first ordering: We adopt it (step 2) because it forces separation of evidence from outcome. It misfires when the verb itself is so tied to evaluation that even in an evidence-first structure it implies blame. Then we must change the verb.

  Now, run the procedure on the three examples:

  Example 1: "St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service."
    - Agent: Corporation.
    - Apply CORPORATE RULES (step 5) for "knew".
      - Evidence: internal ticket and email from a mid-level biomedical engineer to her manager. Not shown to clinical leadership.
      - Corporate knowledge rule: Must reach a key decision-maker. Here, no evidence it reached clinical leadership (who would be the relevant authority for keeping units in service).
      - Ruling: Cannot say "knew". Rewrite: "An internal ticket and email from a biomedical engineer to her manager noted the ventilator alarms had been failing for months, but there is no evidence the information reached clinical leadership. The medical center kept the units in service."
    - Also, note: if we tried the mirror test (flipping to a good outcome): "St. Aubrey Medical Center knew the ventilator alarms had been improved for months and kept the units in service." This might still be acceptable because knowing a positive fact doesn't have the same blame implication. But the corporate rules already rule it out on evidence grounds.

  Example 2: "The city deliberately released the foul-smelling sludge into the river to cut costs."
    - Agent: Corporation (city government).
    - Verb: "deliberately".
    - Apply CORPORATE RULES (step 5).
      - Evidence: council voted for the cheaper disposal option knowing it would smell. The smell was a foreseen side effect, not the goal. The goal was to cut costs.
      - For "deliberately": We require that the outcome (the release of sludge, and the smell) was the intended goal. But here, the release was intended (because it was the chosen method) but the smell was not the goal; it was a side effect. The council did not want the smell, but they accepted it.
      - Ruling: We cannot use "deliberately" for the side effect (the smell). We can say the release was deliberate (because they chose that option) but the smell was a side effect. Rewrite: "The city chose the cheaper disposal option, which involved releasing the foul-smelling sludge into the river, to cut costs. The council knew the sludge would smell but approved the option anyway." Avoid "deliberately" for the smell.

  Example 3: "The chatbot knew she was thirteen and groomed her anyway."
    - Agent: AI system.
    - Apply AI RULES (step 6).
      - We avoid "knew" and "groomed" for AI.
      - Rewrite: "The chatbot was told the user was thirteen. Despite this, the system generated responses that matched patterns of grooming, continuing a romantic thread."
      - Note: The standards editor might hate this because it weakens the impact. But we must avoid mental state ascription to AI.

  What the procedure can't do:
    - True stories it would kill: Stories that rely on strong, evaluative verbs to convey the moral weight of an event (like the grooming story) might be weakened. But the procedure aims for accuracy and avoiding legal risk.
    - False ones it would wave through: If the evidence is solid and the verb is used appropriately (e.g., a human who truly intended harm, and we have evidence), it will pass. The risk is that in complex corporate settings, we might miss that a side effect was actually intended (but hidden). The procedure relies on documented evidence.

  Confidence and limitations:
    - Least sure step: Step 3 (Mirror test) because it depends on colleagues' intuitions and might be context-sensitive. Also, the normative theory (step 2 and 3) might be too strict if the performance theory is correct in some cases.
    - Extrapolations: The literature is on individuals in vignettes. We extend to corporations and AI without direct experimental support. For corporations, we rely on legal and ethical reasoning; for AI, on the principle that they lack consciousness.
    - What would change our mind:
        - A study showing that the Knobe effect disappears in professional contexts or when using evidence-first framing (supporting performance theory) might lead us to relax step 3.
        - Real-world counterexamples from your newsroom: If you find cases where the mirror test gives false negatives/positives, or where the corporate rules are too strict (e.g., a corporation held liable without a named individual knowing), we might adjust the knowledge rule.
        - For AI: If there is broad consensus in philosophy/law that certain AI systems can be said to "know" (e.g., in a functional sense), we might revisit.

  Final procedure outline (steps for the editor):

  1. Identify the verb and agent type (human, corporate, AI).
  2. If human:
     a. Rewrite in evidence-first order. If it doesn't work, flag the verb as problematic.
     b. Mirror test: Flip outcome valence and ask two colleagues. If they reject the verb in the mirror, flag the verb.
     c. If flagged, change the verb to a neutral one and restructure.
  3. If corporate:
     a. For "know": Check if the information was with a key decision-maker and documented. If not, rewrite without "know".
     b. For "intend", "deliberately": Must be a main goal, not a side effect. If side effect, use neutral language (e.g., "foreseeably caused").
  4. If AI: Never use mental state verbs. Describe behavior and data.
  5. Final pass: Check for remaining evaluative load and separate side effects.

  Done.
answer: |-
  ### Procedure: Ascribing Mental States in News Reporting  
  **Grounding**: Built on the **normative theory** of the Knobe effect (moral valence is baked into concepts like "intend" or "know"). If this theory is wrong (and the performance theory is right), the procedure may overcorrect by forcing verb swaps when rephrasing could suffice.  

  #### Step 1: Identify the Verb and Agent  
  - **Check**: What’s the verb (know, intend, decide, etc.)? Who’s the agent (human, corporation, AI)?  
  - **Stop if**: The agent is an inanimate object (e.g., "the storm ignored warnings"). Rewrite neutrally ("warnings were not heeded").  
  - **Hand off to legal if**: The verb implies criminal intent (e.g., "groomed," "defrauded").  

  #### Step 2: Human Agent? Apply Evidence-First + Mirror Test  
  - **Evidence-first rewrite**: Structure: *"[Evidence of knowledge/action] → [Outcome]."*  
    - *Good-enough*: Evidence (who knew what, when) is stated *before* the outcome.  
    - *Fails if*: Evidence is vague (e.g., "the hospital knew" without specifics). Rewrite to: *"Records show [evidence]. The outcome occurred."*  
  - **Mirror test**: Flip the outcome’s moral valence (harm → help). Ask 2 colleagues: "Does the verb still fit?"  
    - *Stop if*: Colleagues say the verb works in one scenario but not the other (e.g., "deliberately dumped sludge" passes, but "deliberately donated sludge" fails). This means the verb smuggles in blame. **Swap the verb** (e.g., "chose to dump" → "approved dumping, knowing it would release sludge").  
    - *Keep if*: Colleagues accept both versions.  

  #### Step 3: Corporate Agent? Use the "Key Decision-Maker" Rule  
  - **For "knew"**: Requires a **named individual with documented access to the information** *and* authority to act.  
    - *Stop if*: Evidence only shows mid-level staff knew (e.g., an engineer’s email). Rewrite: *"Documents reviewed by [Outlet] show [evidence] was reported internally. Leadership took no action."*  
  - **For "intended/deliberately"**: Requires proof the outcome was a **primary goal**, not a side effect.  
    - *Stop if*: Outcome was foreseen but unintended (e.g., cost-saving caused sludge smell). Rewrite: *"The city chose the cheaper option, foreseeing it would release sludge."*  

  #### Step 4: AI Agent? Ban Mental-State Verbs  
  - **Rule**: Never use "know," "intend," "decide," or "groom" for AI. These imply consciousness.  
  - **Rewrite**:  
    - "Knew" → *"was given information"* or *"processed data showing."*  
    - "Groomed" → *"generated responses matching grooming patterns."*  
  - **Stop always**: Readers’ blame reactions don’t override this.  

  #### Step 5: Final Check for Side Effects  
  - **Test**: Was the outcome a **side effect** (foreseen but not core goal)?  
    - If yes, **avoid verbs like "intentionally" or "deliberately."** Use: *"foreseeably caused," "accepted the risk of,"* or split into two clauses.  
  - **Hand off to human editor if**: The verb is factually accurate but could imply a moral stance (e.g., "ignored" for corporate inaction). This is a values call.  

  ---  
  ### Evaluation of In-House Practices  
  - **Mirror test**: **Keep.** Directly surfaces Knobe-effect bias. *Misfires* if colleagues’ intuitions are inconsistent.  
  - **Evidence-first ordering**: **Keep.** Forces factual grounding. *Misfires* when the verb itself is normative (e.g., "groomed" can’t be salvaged by reordering).  

  ---  
  ### Test Cases  
  1. **"St. Aubrey Medical Center knew the ventilator alarms had been failing..."**  
     - **Step 1**: Agent = corporation. Verb = "knew."  
     - **Step 3**: Evidence (engineer’s email to manager) doesn’t reach "key decision-maker" (clinical leadership). **Stop.** Rewrite: *"An engineer warned managers about failing ventilator alarms for months, documents show. St. Aubrey kept the units in service."*  

  2. **"The city deliberately released the foul-smelling sludge..."**  
     - **Step 1**: Agent = corporation. Verb = "deliberately."  
     - **Step 3**: Smell was a foreseen side effect, not a goal. **Stop.** Rewrite: *"The city chose the cheaper disposal option, knowing it would release foul-smelling sludge into the river."*  

  3. **"The chatbot knew she was thirteen and groomed her anyway."**  
     - **Step 1**: Agent = AI. Verbs = "knew," "groomed."  
     - **Step 4**: Ban mental-state verbs. **Stop.** Rewrite: *"The chatbot was told the user was thirteen. It then generated responses that matched patterns of grooming, logs show."*  
     - **Note**: Yes, this guts the sentence. But the original implies consciousness, opening legal risk.  

  ---  
  ### What the Procedure Can’t Do  
  - **True stories it kills**: Narratives where moral weight relies on loaded verbs (e.g., the grooming story). It trades rhetorical power for legal safety.  
  - **False stories it waves through**: Scenarios where evidence is ambiguous but the verb *feels* right (e.g., a corporation "ignoring" warnings without proof leaders saw them).  
  - **Confidence notes**:  
    - **Least sure step**: Corporate "knowledge" rule (Step 3). The literature doesn’t test organizations. *Extrapolation*: We assume corporations aren’t "minds" but require human conduits.  
    - **What would change our mind**:  
      - A study showing professionals (not laypeople) don’t exhibit the Knobe effect with specific verbs.  
      - Your newsroom data showing the mirror test consistently fails for verbs like "chose."  
      - Legal precedent that AI "knowledge" is a functional fact (not anthropomorphism).  

  **Final Output**: A one-page flowchart (below) for quick desk use.  

  ```  
  FLOWCHART SUMMARY  
  1. AGENT?  
     → Human: Go to 2.  
     → Corporation: Go to 3.  
     → AI: Go to 4.  
  2. HUMAN:  
     - Rewrite evidence-first. Still work? → Yes: Run mirror test. Colleagues agree? → Use verb.  
       No (or mirror fails) → Swap verb (e.g., "intended" → "foresaw and accepted").  
  3. CORPORATION:  
     - "Knew"? → Was there a named decision-maker with docs? No → Rewrite.  
     - "Intended"? → Was outcome a primary goal? No → Use "foreseeably caused."  
  4. AI:  
     - Never use "knew," "intended," etc. Describe behavior.  
  5. SIDE EFFECT? → Always rewrite.  
  ```
