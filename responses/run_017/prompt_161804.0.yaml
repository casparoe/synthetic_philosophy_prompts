  Example:

  Let L, M, R be degenerate lotteries that yield allocations:

  - L: citizen1 gets 0, citizen2 gets 2
  - M: citizen1 gets 1, citizen2 gets 1
  - R: citizen1 gets 3, citizen2 gets 0

  Now, we need to compute expected utilities. But note that the lotteries are over allocations. We assume that these are the outcomes in a single state. But when we form a compound lottery αL + (1-α)R, it means that with probability α we get L and with probability 1-α we get R. So the expected utility for citizen j is α * u_j(L) + (1-α) * u_j(R), where u_j(L) is the utility of j in allocation L.

  But note: in L, citizen1 gets 0, so u1(L)=u1(0)=0 (since u(0)=0), and citizen2 gets 2, so u2(L)=u2(2). Similarly, in M: u1(M)=u1(1), u2(M)=u2(1). In R: u1(R)=u1(3), u2(R)=u2(0)=0.

  Now, the vector of expected utilities for a lottery is (EU1, EU2).

  So:
  - For L: (0, u2(2))
  - For M: (u1(1), u2(1))
  - For R: (u1(3), 0)

  We need to choose utility functions. To make leximin work, we can choose:

  Assume citizen 1 has utility function u1(x)=x.
  Assume citizen 2 has utility function u2(x)=x.

  Then:
  - L: (0, 2)
  - M: (1, 1)
  - R: (3, 0)

  Leximin: 
  - For L: the ordered vector is (0,2) -> min is 0, then 2.
  - For M: (1,1) -> min is 1, then 1.
  Leximin ranks M above L because min(M)=1 > min(L)=0.

  Now, consider α=1/2. Then the mixture αL+(1-α)R is: with prob 1/2: L, with prob 1/2: R.
  EU1 = (1/2)*0 + (1/2)*3 = 1.5
  EU2 = (1/2)*2 + (1/2)*0 = 1
  So vector: (1.5, 1)

  Similarly, αM+(1-α)R: with prob 1/2: M, with prob 1/2: R.
  EU1 = (1/2)*1 + (1/2)*3 = 2
  EU2 = (1/2)*1 + (1/2)*0 = 0.5
  Vector: (2, 0.5)

  Now, leximin: 
  For αL+(1-α)R: (1, 1.5) -> ordered: (1, 1.5) -> min=1, then 1.5.
  For αM+(1-α)R: (0.5, 2) -> ordered: (0.5, 2) -> min=0.5, then 2.
  Since 0.5 < 1, leximin ranks (1.5,1) above (2,0.5). That is, αL+(1-α)R is preferred to αM+(1-α)R.

  But we have M above L, and αL+(1-α)R above αM+(1-α)R. So independence is violated.

  The structural feature that makes this possible is that the lottery R is very bad for citizen2 (gives 0) and good for citizen1. When we mix R with M, it pulls down citizen2's utility a lot, while when we mix R with L, citizen2 was already getting 2 in L so the average is 1, which is higher than 0.5. In the mixture, the worst-off in αM+(1-α)R is citizen2 with 0.5, while in αL+(1-α)R the worst-off is 1. Hence the reversal.

  This feature is absent in part (a) because in part (a) the shift vector δ is added to the base, and it is the same shift for both problems. In part (a), the two comparisons are not between two lotteries that are mixtures with a common lottery, but between two pairs that are shifted by the same absolute amount. More importantly, in part (a) the shift is the same for every citizen in both problems, and the base vectors are proportional, which ties the two comparisons together. In the example for part (b), the lottery R affects the two citizens differently, and the base lotteries L and M have different distributions.

  ### Part (c)

  Now, the planner evaluates ex post: for each state s, we have an allocation (x_1(s), ..., x_n(s)), and we compute F(u_1(x_1(s)), ..., u_n(x_n(s))). Then W(L) = sum over s of p(s) * F(u_1(x_1(s)), ..., u_n(x_n(s))).

  We need to prove that this ranking satisfies independence for any F.

  Independence says that if L is preferred to M, then for any R and α in (0,1), αL+(1-α)R is preferred to αM+(1-α)R.

  So assume that the planner prefers L to M, meaning W(L) > W(M).

  W(L) = Σ_s p_L(s) * F(u(L(s)))   [where u(L(s)) is the vector of utilities in state s under L]
  Similarly for M.

  But note: the lotteries are over states. When we form αL + (1-α)R, it is a compound lottery: with probability α we run L, with probability 1-α we run R. Therefore, the state space is expanded. But we are to reduce compound lotteries. So we can think of a new state space that includes the outcome of the initial chance move (which lottery) and then the state of the chosen lottery.

  Specifically, the compound lottery αL+(1-α)R has states that are pairs: (choice, s), where choice is either L or R (with prob α and 1-α), and then s is the state of the chosen lottery. The probability of (L,s) is α * p_L(s), and of (R,s) is (1-α) * p_R(s). The allocation in state (L,s) is the allocation of L in state s, and similarly for R.

  Therefore, 
  W(αL+(1-α)R) = Σ_{s} [ α * p_L(s) * F(u(L(s))) ] + Σ_{s} [ (1-α) * p_R(s) * F(u(R(s))) ]

  Similarly,
  W(αM+(1-α)R) = Σ_{s} [ α * p_M(s) * F(u(M(s))) ] + Σ_{s} [ (1-α) * p_R(s) * F(u(R(s))) ]

  Now, we know W(L) = Σ_s p_L(s) F(u(L(s))) > W(M) = Σ_s p_M(s) F(u(M(s)))

  Then, 
  W(αL+(1-α)R) - W(αM+(1-α)R) = 
  α [ Σ_s p_L(s) F(u(L(s))) ] + (1-α) [ Σ_s p_R(s) F(u(R(s))) ] 
  - α [ Σ_s p_M(s) F(u(M(s))) ] - (1-α) [ Σ_s p_R(s) F(u(R(s))) ]
  = α [ W(L) - W(M) ] 
  > 0

  Therefore, W(αL+(1-α)R) > W(αM+(1-α)R). So independence holds.

  The contrast between (b) and (c) is that in (b) the planner aggregates expected utilities ex ante (i.e., computes each citizen's expected utility and then applies F to that vector), while in (c) the planner aggregates ex post (applies F to the vector of utilities in each state and then takes the expectation). The violation of independence in (b) comes from the fact that the aggregation of utilities happens after the expectation is taken for each citizen, so the social welfare function F is applied to a vector of expectations. This allows for the reversal when mixing with R because the mixing affects the distribution of expected utilities. In (c), however, F is applied to the vector of realized utilities in each state, and then we average. This linearity in the mixing ensures that independence holds.

