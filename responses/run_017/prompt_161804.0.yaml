  ### Model Answer

  **Part (a)**  
  For any citizen \(i\), let \(u_i\) denote their utility function for money, with \(u_i(£0) = 0\) and \(u_i\) increasing. The expected utility differences are calculated as follows.  

  In Problem 1:  
  - \(EU_i(A) = u_i(£1\text{m})\)  
  - \(EU_i(B) = \frac{89}{100}u_i(£1\text{m}) + \frac{11}{100} \left( \frac{10}{11}u_i(£5\text{m}) + \frac{1}{11}u_i(£0) \right) = \frac{89}{100}u_i(£1\text{m}) + \frac{10}{100}u_i(£5\text{m})\)  
  Thus,  
  \[
  EU_i(B) - EU_i(A) = \left( \frac{89}{100}u_i(£1\text{m}) + \frac{10}{100}u_i(£5\text{m}) \right) - u_i(£1\text{m}) = \frac{1}{100} \left( 10u_i(£5\text{m}) - 11u_i(£1\text{m}) \right)
  \]

  In Problem 2:  
  - \(EU_i(C) = \frac{89}{100}u_i(£0) + \frac{11}{100}u_i(£1\text{m}) = \frac{11}{100}u_i(£1\text{m})\)  
  - \(EU_i(D) = \frac{89}{100}u_i(£0) + \frac{11}{100} \left( \frac{10}{11}u_i(£5\text{m}) + \frac{1}{11}u_i(£0) \right) = \frac{10}{100}u_i(£5\text{m})\)  
  Thus,  
  \[
  EU_i(D) - EU_i(C) = \frac{10}{100}u_i(£5\text{m}) - \frac{11}{100}u_i(£1\text{m}) = \frac{1}{100} \left( 10u_i(£5\text{m}) - 11u_i(£1\text{m}) \right)
  \]

  Therefore, \(EU_i(B) - EU_i(A) = EU_i(D) - EU_i(C) = \delta_i\), where \(\delta_i = \frac{1}{100} \left( 10u_i(£5\text{m}) - 11u_i(£1\text{m}) \right)\). The condition for \(\delta_i > 0\) is \(10u_i(£5\text{m}) > 11u_i(£1\text{m})\), or equivalently, \(u_i(£5\text{m}) > 1.1 \times u_i(£1\text{m})\). This condition is not particularly demanding: since £5m is substantially larger than £1m, it holds for many utility functions, including moderately concave (risk-averse) ones like \(u_i(x) = \sqrt{x}\) or \(\log(1+x)\), as \(u_i(£5\text{m})\) often exceeds \(1.1 \times u_i(£1\text{m})\) due to the magnitude of the increase.  

  The Allais pattern requires \(A \succ B\) (so \(F\) ranks the vector for \(A\) above that for \(B\)) and \(D \succ C\) (so \(F\) ranks the vector for \(D\) above that for \(C\)). The expected utility vector for \(A\) is \(\mathbf{v} = (u_1(£1\text{m}), \dots, u_n(£1\text{m}))\), and for \(B\) it is \(\mathbf{v} + \mathbf{\delta}\), where \(\mathbf{\delta} = (\delta_1, \dots, \delta_n)\). Similarly, the vector for \(C\) is \(\mathbf{w} = \left( \frac{11}{100}u_1(£1\text{m}), \dots, \frac{11}{100}u_n(£1\text{m}) \right)\), and for \(D\) it is \(\mathbf{w} + \mathbf{\delta}\). Note that \(\mathbf{w} = \frac{11}{100} \mathbf{v}\).  

  The Allais pattern requires \(F(\mathbf{v}) > F(\mathbf{v} + \mathbf{\delta})\) and \(F(\mathbf{w} + \mathbf{\delta}) > F(\mathbf{w})\). However, because \(\mathbf{w} = c\mathbf{v}\) with \(c = 11/100 < 1\), and \(\mathbf{\delta}\) is fixed, the same absolute change \(\mathbf{\delta}\) is applied in both comparisons. Crucially, the sign of \(\delta_i\) is identical for both problems for each citizen: if \(\delta_i > 0\), citizen \(i\) prefers both \(B\) to \(A\) and \(D\) to \(C\); if \(\delta_i < 0\), they prefer \(A\) to \(B\) and \(C\) to \(D\). Thus, the set of gainers and losers from the shift \(\mathbf{\delta}\) is the same in both problems.  

  For \(F\) increasing and inequality-averse, the effect of adding \(\mathbf{\delta}\) should be consistent in direction. If \(\mathbf{\delta}\) reduces welfare at the high base \(\mathbf{v}\) (due to increased inequality or losses), it should also reduce welfare at the low base \(\mathbf{w}\) because losses are more acutely felt at lower absolute utility levels (due to diminishing marginal social welfare). Conversely, if \(\mathbf{\delta}\) increases welfare at \(\mathbf{v}\), it should do so at \(\mathbf{w}\). Hence, \(F(\mathbf{v}) > F(\mathbf{v} + \mathbf{\delta})\) implies \(F(\mathbf{w}) > F(\mathbf{w} + \mathbf{\delta})\), and \(F(\mathbf{w} + \mathbf{\delta}) > F(\mathbf{w})\) implies \(F(\mathbf{v} + \mathbf{\delta}) > F(\mathbf{v})\), making the Allais pattern impossible.  

  **Part (b)**  
  Consider two citizens with utility functions \(u_1(x) = x\) and \(u_2(x) = x\) (so \(u_i(0) = 0\)). Define three degenerate lotteries:  
  - \(L\): Citizen 1 gets £0, citizen 2 gets £2m. So EU vector: \((0, 2)\).  
  - \(M\): Citizen 1 gets £1m, citizen 2 gets £1m. So EU vector: \((1, 1)\).  
  - \(R\): Citizen 1 gets £3m, citizen 2 gets £0. So EU vector: \((3, 0)\).  

  Under leximin (which orders vectors by their smallest component, then the next smallest):  
  - \(L\): \((0, 2)\) sorted is \((0, 2)\); min is 0.  
  - \(M\): \((1, 1)\) sorted is \((1, 1)\); min is 1. Since \(1 > 0\), leximin ranks \(M\) above \(L\).  

  Now take \(\alpha = 0.5\). The mixture \(\alpha L + (1-\alpha)R\) is a compound lottery: with probability 0.5, outcome \(L\); with probability 0.5, outcome \(R\). The expected utility vector is:  
  - Citizen 1: \(0.5 \times 0 + 0.5 \times 3 = 1.5\)  
  - Citizen 2: \(0.5 \times 2 + 0.5 \times 0 = 1\)  
  So vector: \((1.5, 1)\), sorted as \((1, 1.5)\); min is 1.  

  The mixture \(\alpha M + (1-\alpha)R\):  
  - Citizen 1: \(0.5 \times 1 + 0.5 \times 3 = 2\)  
  - Citizen 2: \(0.5 \times 1 + 0.5 \times 0 = 0.5\)  
  So vector: \((2, 0.5)\), sorted as \((0.5, 2)\); min is 0.5.  

  Leximin ranks \((1.5, 1)\) (min 1) above \((2, 0.5)\) (min 0.5), so \(\alpha L + (1-\alpha)R \succ \alpha M + (1-\alpha)R\). Thus, leximin violates independence: \(M \succ L\) but \(\alpha L + (1-\alpha)R \succ \alpha M + (1-\alpha)R\).  

  The structural feature enabling this reversal is that \(R\) affects citizens asymmetrically (good for citizen 1, bad for citizen 2), and mixing \(R\) with \(M\) disproportionately harms citizen 2, who was equally well off in \(M\), whereas mixing \(R\) with \(L\) leaves citizen 2 better off. This asymmetry—where \(R\) has divergent impacts on citizens—is absent in part (a), as the shift \(\mathbf{\delta}\) is applied uniformly to the same base vector (or its scalar multiple), and no external lottery introduces disparate effects.  

  **Part (c)**  
  The ex post evaluation is \(W(L) = \sum_s p(s) \cdot F(u_1(x_1(s)), \dots, u_n(x_n(s)))\). Assume \(L\), \(M\), and \(R\) are defined over states \(s\) with probabilities \(p_L(s)\), \(p_M(s)\), and \(p_R(s)\). The compound lottery \(\alpha L + (1-\alpha)R\) has states corresponding to the initial choice (with prob \(\alpha\) for \(L\), \(1-\alpha\) for \(R\)) and then the state of the chosen lottery. The reduced probability of a state yielding allocation \(L(s)\) is \(\alpha p_L(s)\), and for \(R(s)\) is \((1-\alpha) p_R(s)\). Thus,  
  \[
  W(\alpha L + (1-\alpha)R) = \sum_s \alpha p_L(s) F(\mathbf{u}(L(s))) + \sum_s (1-\alpha) p_R(s) F(\mathbf{u}(R(s)))
  \]  
  Similarly,  
  \[
  W(\alpha M + (1-\alpha)R) = \sum_s \alpha p_M(s) F(\mathbf{u}(M(s))) + \sum_s (1-\alpha) p_R(s) F(\mathbf{u}(R(s)))
  \]  
  If \(W(L) > W(M)\), then \(\sum_s p_L(s) F(\mathbf{u}(L(s))) > \sum_s p_M(s) F(\mathbf{u}(M(s)))\). Therefore,  
  \[
  W(\alpha L + (1-\alpha)R) - W(\alpha M + (1-\alpha)R) = \alpha \left( \sum_s p_L(s) F(\mathbf{u}(L(s))) - \sum_s p_M(s) F(\mathbf{u}(M(s))) \right) = \alpha (W(L) - W(M)) > 0
  \]  
  since \(\alpha > 0\). Hence, \(\alpha L + (1-\alpha)R \succ \alpha M + (1-\alpha)R\), satisfying independence for any \(F\).  

  The contrast between (b) and (c) shows that violations of independence arise from ex ante aggregation, where \(F\) is applied to expected utilities, allowing mixtures to alter the distribution of expected utilities across citizens in welfare-relevant ways. In ex post aggregation, \(F\) is applied state-wise before expectation, preserving linearity in mixtures and precluding independence violations.

