prompt: |-
  I'm a retired analytical chemist (most of my career was trace metals in river water), and since I stopped work I've been reading a bit of philosophy os science. There's a pattern I keep running into that I don't have a word for.

  The setup is always the same. Something people care about gets measured by counting how many things fall on the far side of a line: samples above a detection limit, sites below a standard, patients waiting past four hours. Then the count gets used as a target, the count improves, and the thing anyone actually cared about hasn't moved. But nobody has lied and nobody has gamed anything in the obvious sense. The count is still an accurate count of exactly what it says it counts. What has moved is either the line, or what gets fed to the line.

  Two cases I know first hand. In our lab the number of samples with a detectable result dropped sharply between two years, and everyone read that as the river getting cleaner; what had really happened is that a new instrument had a slightly different detection limit, so samples that used to sit just above the cutoff were now reported as not detected. Same water, same method on paper, and no one had any reason to prefer either answer. Second one, from a catchment committee I sit on: the number of river bodies classed as failing went down, partly because sites that sat right on the boundary between two classes had their reference conditions quietly redrawn, and partly because the worst sites stopped being monitored and simply left the list.

  People brush this off with a management one-liner I've heard a lot — once a number is used as a target it stops being a good measure of anything. But that doesnt seem to fit. Here the number never stopped measuring what it measures; what I care about was always a messy aggregate sitting behind a definition, and what changed is the definition or the population, not the fidelity of the measurement.

  So: is there an established concept for this, and is it really a separate thing from the target-breaks-the-measure case? I also want it distinguished from a couple of neighbours I can only half describe — the trick where shifting a borderline case across a line raises the average in both groups at once (that one is about averages, and mine happens with a single count), and the general business in optimisation where a system exploits the gap between what you specified and what you wanted. If there is no name, give me one, define it so I can tell it apart from those, and say where the edges are. In particular: is the version where nobody intends anything and there is no incentive at all the same phenomenon, or a different one? A bare label won't do me any good.
reasoning: |-
  Okay, the user is a retired analytical chemist with experience in trace metals in river water. They've noticed a pattern in their work and now in philosophy of science where a metric used as a target stops reflecting the underlying concern even though the measurement itself is accurate. They provided two examples: one about detection limits changing due to new instruments, and another about reclassifying river bodies or dropping monitoring sites. 

  The user wants to know if there's a specific term for this phenomenon. They've heard the saying that "once a measure becomes a target, it ceases to be a good measure," but they feel that doesn't quite fit because the measurement itself remains accurate—it's the definition or population that changes. They also want to distinguish this from related concepts like Simpson's paradox or Goodhart's law.

  First, I need to recall relevant concepts. Goodhart's law comes to mind immediately: "When a measure becomes a target, it ceases to be a good measure." But the user is questioning if that's the right fit. They argue that in their case, the measure is still accurate for what it's defined to measure. The issue is that the definition or the underlying population shifts, not that people are gaming the system. 

  Looking deeper, the user is pointing out a subtle distinction. In their examples, the problem isn't that the measure is being manipulated; it's that the operational definition changes (detection limit shift) or the sample population changes (removing worst sites). So the metric still correctly counts what it's supposed to, but what it's supposed to count no longer aligns with the real-world concern. 

  The concept of surrogation might be relevant here. Surrogation occurs when people confuse the proxy (the metric) with the actual goal. In the lab example, "detected samples" was a surrogate for river cleanliness, but when the detection limit changed, the surrogate became decoupled from the reality. Similarly, classifying river bodies based on boundaries that get redrawn makes the count a poor surrogate over time.

  Another angle is indicator drift or concept creep. The definition of what's being measured drifts, so the metric's meaning changes. The user’s examples don't involve active gaming, so distinguishing between unintentional shifts (like technological changes) versus intentional manipulation is important. 

  The user also mentioned distinguishing this from Simpson's paradox (which involves aggregated data) and Goodhart's law (which is about gaming incentives). Their cases are about single counts affected by threshold changes or population alterations without malicious intent. 

  So, the core issue is the validity of the surrogate measure when definitions or populations change. The term "surrogate disconnect" seems appropriate. It emphasizes that the problem is the metric becoming disconnected from the underlying concept due to boundary shifts or sample changes, not due to the measure itself being inaccurate. 

  It's also important to differentiate this from Goodhart's law, which usually implies active gaming. The user’s examples lack that element; the changes might be administrative or technological. The key is whether the disconnect happens without intentional gaming. The boundaries of this concept include unintentional shifts in definitions or populations leading to a loss of surrogate validity, while excluding cases where the measure itself is corrupted.
answer: |-
  Based on your precise description and need for differentiation, the phenomenon you're identifying doesn't have a single universally agreed-upon name, but it maps closely to established concepts in measurement theory, philosophy of science, and management. The most fitting conceptual framework is **Surrogate Measure Disconnect Due to Boundary Shift or Population Drift**, falling under the broader umbrella of **Indicator Corruption** or **Operationalization Drift**.

  Here's a breakdown, defining the phenomenon and distinguishing it from neighbors:

  1.  **The Core Phenomenon:**
      *   **Name:** **Boundary-Induced Surrogate Disconnect (BISD)** or **Operationalization Drift Impacting Surrogates**.
      *   **Definition:** *The phenomenon where a binary classification metric (based on a defined threshold or boundary) used as a surrogate for a complex underlying reality becomes decoupled from that reality due to changes in the definition of the boundary itself or changes in the population being measured, while the metric itself remains technically accurate in counting instances relative to the *current* boundary/population.*
      *   **Key Elements:**
          *   **Surrogate Metric:** The count (e.g., detectable samples, failing river bodies) is a *proxy* for a more complex, often latent, variable of interest (e.g., river cleanliness, ecosystem health).
          *   **Binary Threshold:** The metric relies on a hard boundary (detection limit, classification threshold).
          *   **Operationalization Drift:** The *meaning* of the boundary or the *scope* of the population being measured changes over time.
          *   **Technical Fidelity Preserved:** The metric accurately reflects the count *according to the current definition/population*. The disconnect is not from measurement error or fraud regarding the *current* rule, but from the *rule* or *scope* changing.
          *   **Decoupling:** The surrogate metric no longer reliably tracks the underlying reality it was intended to represent, despite its technical accuracy.

  2.  **Distinguishing from Neighbors:**
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**
          *   **Goodhart Focus:** Primarily on *agent behavior*. When a metric is made a target, people find ways to *directly manipulate inputs or actions* to optimize the metric itself, often in ways that undermine the underlying goal (e.g., "gaming").
          *   **BISD Distinction:** In BISD, the disconnect arises from *changes in the definition or scope*, not necessarily from incentivized manipulation *of the inputs to the existing rule*. Your detection limit change was likely a technical decision, the boundary redefinition and site delisting were likely administrative. The *metric itself* isn't being gamed under the current rule; the *rule or population* has shifted. Goodhart often implies active gaming; BISD can occur passively through definitional drift or scope changes.
      *   **Simpson's Paradox (The "trick with averages"):**
          *   **Simpson Focus:** Aggregation effects. A trend appears in different subgroups but disappears or reverses when the groups are combined. It's about confounding variables and how data is grouped/aggregated.
          *   **BISD Distinction:** BISD deals with *changes over time* in the *definition* of a single category boundary or the *composition* of the population being measured for a *single count*. It doesn't involve the reversal of trends based on grouping; it involves the meaning of the category itself shifting.
      *   **Optimization Gap (Specified vs. Wanted):**
          *   **Optimization Focus:** The inherent difficulty in perfectly specifying the objective function. The system optimizes for what you *said* you wanted (the specification), not what you *actually* wanted.
          *   **BISD Distinction:** BISD is a specific *mechanism* by which this gap manifests. The "specification" (the operational definition: the boundary and the population) has drifted or was flawed from the start, meaning that optimizing the count *according to that specification* no longer optimizes the desired outcome. BISD explains *why* the surrogate specification became misaligned.

  3.  **The Unintentional Version:**
      *   **Is it the same phenomenon?** Yes, fundamentally. The core mechanism – the surrogate becoming disconnected from the underlying reality due to boundary shift or population drift – is identical.
      *   **Distinction:** Intent affects the *cause* of the drift, not the *nature* of the disconnect. In the unintentional case, the drift might stem from technological improvements (new instrument sensitivity), bureaucratic processes (reclassification based on new evidence), resource constraints (stopping monitoring bad sites), or simply neglect. There's no *malicious* gaming, but the *effect* on the surrogate's validity is the same. The phenomenon itself is defined by the *decoupling*, not the *intent* driving the change. Calling it "Indicator Drift" or "Passive Surrogate Decay" might emphasize the unintentional aspect.

  4.  **Edges and Boundaries of BISD:**
      *   **Within Scope:** Changes to the *operational definition* of the boundary (e.g., detection limit recalibration, redefining classification criteria, changing "wait time" start/stop rules). Changes to the *measured population* (e.g., adding/dropping sites, changing sampling frequency at boundary sites, changing admission criteria for "waiting" patients).
      *   **Out of Scope:**
          *   **Direct Measurement Error:** If the *same* boundary and population are used, but the measurement *method* introduces new errors.
          *   **Classic Gaming (Goodhart):** If the boundary/population remains *fixed*, but actors manipulate *what is fed into it* (e.g., deliberately sending cleaner samples, prioritizing patients *just* under 4 hours while neglecting others).
          *   **Changes in the Underlying Reality Affecting the *Meaning* of the Boundary:** If the underlying reality changes so dramatically that the *original* boundary loses its relevance *without the boundary itself changing*, that's a different issue of indicator obsolescence.
          *   **Pure Random Fluctuation:** Changes in the count solely due to natural variation, with stable definitions and population.

  **Conclusion:**

  Your insight highlights a crucial flaw in using binary classification surrogates for complex realities, especially when definitions or scopes are unstable. **Boundary-Induced Surrogate Disconnect (BISD)** captures the essence: the surrogate count remains technically accurate *as defined*, but changes in the boundary's definition or the measured population cause it to lose connection to the underlying concern. This can occur *with or without* intentional gaming or incentives, making it distinct from, but often co-occurring with, Goodhart's Law. The unintentional version is a core subtype of this phenomenon. It's a powerful demonstration of how the *operationalization* of a concept is critical, and how stability in that operationalization is necessary for a surrogate to maintain validity over time, even without active manipulation. Your examples are textbook cases of BISD.
