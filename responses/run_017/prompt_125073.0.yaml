  Imposing a fixed minimum time ε per initiation fails when acts are densely ordered. If each initiation requires ε>0, but initiations must occur within arbitrarily small temporal intervals (since movements overlap in a continuum), you get ε > δ for some required interval δ < ε—a contradiction. **Justification:** Dense ordering implies no lower bound on inter-act timing, conflicting with fixed ε.

