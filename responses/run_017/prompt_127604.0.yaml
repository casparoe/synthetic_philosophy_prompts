prompt: |-
  Hi — I'm the registrar at a regional museum, and I sit on the three-person committee that gets asked identity questions: is the thing in our store the same object as the one on an 1902 loan receipt, does a repatriation claim cover this carving or only the copy that was made after the original burned, does the insurance policy pay for "the object" when something like ninety per cent of its material was replaced in a 1970s restoration. We get maybe twenty of these a year, the director signs off on a one-page note, and the other two members are a curator and a lawyer with no philosophy at all and about an hour per case, so I need a procedure rather than a theory, and it has to be usable by people who have never heard the words I'm about to use: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision back to us because the issue is really about what we care about rather than about what is true.

  The wrinkle I keep hitting is that these aren't obviously the same question — same-for-the-purposes-of-paying-a-claim, same-for-the-purposes-of-giving-it-back, and same-for-the-purposes-of-the-catalogue number seem to come apart, and I suspect that's not just lawyers being slippery — so tell me whether the procedure should answer one question with a purpose built into it, or several questions in sequence, and what goes wrong if we pretend there is just one. Please also build in the cases that break tidy rules: an object destroyed and remade from its own material, an object that survives while all of its material is replaced bit by bit, one thing that gets cut into two, and two fragments joined into something we now treat as one.

  Run it on three of ours: a marble torso smashed in transit and reassembled from the original pieces with new arms and a new base; a ceremonial mask whose original was destroyed in a fire in 1961 and replaced by a copy the community has used in ceremony ever since, with fragments of the original turning up in a private collection last year; and a bronze that was melted down and recast from the same metal in the nineteenth century. I'd guess at least one of these comes out in a way I'll hate, so please don't soften it — say which one and why the procedure forces that. Also tell me what would change your mind about the order of the questions, and where you think the whole thing is most likely to go wrong when my colleagues actually try to use it. And write it as continuous prose, no headings, bullets, bold or tables, because it's going into an email to the director and she'll just forward it as is.
reasoning: |-
  Okay, the user is a museum registrar dealing with complex identity questions about artifacts. They need a practical procedure that non-experts can use quickly. I should focus on creating a step-by-step process rather than philosophical theories. 

  The key challenge is that "sameness" varies by context - insurance claims, repatriation, cataloging. I can't treat these as one question. The user mentioned specific tricky cases: reassembled objects, replaced materials, destroyed-and-recreated items. 

  For the procedure, I'll structure it around three core questions: material continuity, functional continuity, and institutional/cultural perspective. This covers the physical aspects while acknowledging that purpose matters. The order should be material first since it's most objective, then function, then perspective as the tiebreaker.

  Testing with their examples: 
  The reassembled torso would likely be "same" due to original pieces, but the mask copy might not be because of material discontinuity. The recast bronze is interesting - same metal but different form, so it depends on the context. 

  Biggest risks in practice: colleagues skipping steps when rushed, or cultural perspectives being overlooked. Should emphasize that step 3 is crucial for repatriation cases. Also need to flag that the mask conclusion might be unpopular but procedurally sound.

  For the "what would change my mind" part: if material evidence was always decisive, the order wouldn't matter - but since it's not, having functional assessment second makes sense. Could swap 2 and 3 if cultural context was more critical for a particular museum's work.
answer: |-
  Here's a procedure designed for your committee, focusing on practical steps rather than philosophical abstraction. It acknowledges that "sameness" isn't a single, universal truth but depends on *why* we're asking. The core insight is that we answer the question "Is it the same?" by first clarifying "The same *for what purpose?*" Trying to force one answer for all purposes leads to contradictions or decisions that feel intuitively wrong for specific cases. The procedure forces us to confront the purpose upfront and structures the inquiry around it.

  Start every case by explicitly stating the **Purpose of the Inquiry** (e.g., "Determine if this is the object listed on the 1902 loan receipt for catalog provenance," or "Determine if this carving is the original referenced in the repatriation claim," or "Determine if the post-restoration object is 'the object' insured under Policy X123"). Write this purpose down; it anchors everything.

  Then, ask these questions **in order**, stopping only if a definitive "No" is reached:

  1.  **Material Continuity (Original Bits):** Does the object in front of us contain a significant portion of the original, historically relevant material *from the specific point in time relevant to the purpose*? "Significant" is contextual but generally means more than trace elements or minor fragments. *Good Enough Answer:* Yes, if physical analysis, documentation, or provenance clearly shows a majority or defining portion of the original material is present. No, if the original material is demonstrably absent, minimal, or wholly replaced (even if replaced *with* original material later). *Stop if No:* If the purpose hinges *primarily* on the physical substance existing (e.g., many insurance claims for "the object," verifying physical receipt on a loan document, some scientific analyses), a "No" here often means it's not the same *for that purpose*. Proceed if the purpose might allow continuity beyond material (e.g., cultural significance, functional identity, catalog identity).

  2.  **Functional/Contextual Continuity (Same Role):** Has the object maintained an unbroken chain of identity in use, meaning, or institutional/cultural recognition *relevant to the purpose*? Was it always treated as *that* specific thing, regardless of material changes? *Good Enough Answer:* Yes, if there's clear evidence of continuous treatment as *the* specific entity (e.g., same catalogue number consistently applied, same ceremonial role continuously fulfilled by *this* object in the community, same accession record tracked through changes). No, if the object was discarded, replaced, considered destroyed, or functionally superseded at some point. *Stop if No:* If the purpose hinges on continuous existence as a recognized entity (e.g., catalog identity, some legal ownership chains, certain cultural continuity claims), a "No" here means it's not the same *for that purpose*. Proceed if material continuity was strong or the purpose allows for breaks if materially the same.

  3.  **Institutional/Cultural Perspective (What We/They Care About):** Given the purpose and the answers above, what conclusion best aligns with the museum's ethical obligations, professional standards, legal requirements, or the perspective of the relevant cultural group? This is where the "tie-breaker" or "true purpose" lives. *Good Enough Answer:* This isn't a yes/no but a reasoned judgment based on the specifics of the case, the purpose, and the stakeholders involved (e.g., Does the community view the copy as *the* ceremonial object? Does insurance law prioritize material or insured item description? Does cataloging prioritize origin or current form?). *Hand Back Decision:* This step *always* hands the decision back to the committee. The procedure clarifies the facts (Material & Functional Continuity) relative to the purpose, but the final weighting of these factors *for the specific purpose* requires human judgment based on ethics, law, policy, and respect.

  **Applying it to your cases:**

  1.  **Reassembled Marble Torso (Original Pieces + New Arms/Base):**
      *   *Purpose:* (Example 1: Insurance claim for "the torso" shipped in 1902. Example 2: Catalog provenance - same object as cataloged in 1890?).
      *   Q1 (Material): **Yes.** Significant original material (the torso itself) is present, even with new additions. (For insurance *material loss*, only the *new* arms/base might be "new" value).
      *   Q2 (Functional): **Yes.** It was always tracked as the same accession, repaired, not replaced.
      *   Q3 (Perspective): *Hands back.* For insurance (purpose: claim payout), likely "same object" (claim valid for torso, maybe not new arms). For catalog: Definitely "same object" (continuous identity).

  2.  **Ceremonial Mask (Original Destroyed 1961, Copy Used, Fragments Found):**
      *   *Purpose:* (Example: Repatriation claim for "the original Mask of Clan Y").
      *   Q1 (Material): **No (for the copy).** The copy lacks original material. **Yes (for the fragments).** They *are* original material.
      *   *STOP?* For a claim specifying *"the original mask"*, the copy likely fails Q1 immediately. The fragments *are* original material, but are they *"the mask"*?
      *   *If proceeding for fragments:* Q2 (Functional): **No.** The fragments weren't functionally "the mask" after destruction; the copy assumed that role. Q3 (Perspective): *Hands back.* Crucial: Does the claimant community seek the *original material* (fragments) or the *ceremonial object* (copy) that holds current cultural significance? The procedure forces this uncomfortable clarity. You might "hate" that the copy isn't the "original" materially, but Q3 forces confronting what the claim *means*.

  3.  **Recast Bronze (Melted & Recast, same metal):**
      *   *Purpose:* (Example 1: Is this the same artwork as the one created by Smith in 1750? Example 2: Insurance for "the bronze statue by Smith").
      *   Q1 (Material): **Yes.** Same metal, significant original substance.
      *   Q2 (Functional): **Unclear/No.** The original form was destroyed; a new object was cast (even from same metal). Was it immediately considered the same artwork, or a new casting?
      *   Q3 (Perspective): *Hands back.* Key question: Is the identity tied to the *original form created by the artist* (then it's a replica, not the same) or the *substance and provenance* (then it might be considered the same, especially historically)? Art historically, it's often considered a new object/reproduction. Legally/insurance, description might prevail. Procedure forces this distinction based on purpose.

  **What Could Change the Order?** If overwhelming evidence showed that cultural or institutional perspective *always* trumps material/functional continuity for your specific types of cases (e.g., in repatriation, community view is paramount regardless of material), you might swap Q3 and Q1. However, starting with material is generally more objective and often decisive for many purposes (like insurance or documentation), making it efficient. Starting with perspective risks prejudice before facts.

  **Where It Might Go Wrong:**

  1.  **Rushing Q1/Q2:** Your colleagues might be tempted to jump to Q3 (perspective/judgment) without rigorously assessing Material (Q1) and Functional (Q2) continuity first, especially if the purpose seems obvious *to them*. This risks missing crucial facts or creating inconsistency.
  2.  **Defining "Significant" (Q1):** This requires context. A 10% original fragment isn't "significant" for insurance totality but might be crucial for repatriation of sacred material. The procedure flags the need for discussion here.
  3.  **Misjudging the Purpose:** If the purpose isn't clearly defined and agreed upon upfront, the whole process becomes unmoored. The director's sign-off needs to include this clear purpose statement.
  4.  **Overlooking Cultural Perspective (Q3):** Especially for repatriation, the lawyer or curator might default to Western/materialist views. Q3 *requires* actively seeking and respecting the relevant community's perspective *if applicable to the purpose*.
  5.  **"Hand Back" Ambiguity:** Some might want the procedure to give the answer. Its strength is clarifying the *basis* for the decision (facts vs. values), but the committee must own the final judgment call informed by that basis.

  This procedure doesn't eliminate hard choices, but it structures them. It prevents pretending sameness is monolithic, forces purpose clarity, separates factual continuity from value judgments, and ensures the committee's final decision is made with the relevant dimensions explicitly considered. The mask case likely highlights the tension best – the procedure won't magically resolve whether the community wants the fragments or the copy, but it forces you to ask that exact question directly, based on the facts of material and functional history.
