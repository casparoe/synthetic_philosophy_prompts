prompt: |-
  Okay so I had a three hour argument with a friend about this last night and I lost, mostly because I couldn't answer one specific objection, so I need actual prep.

  I'm giving a seminar talk next month defending a version of superrationality — Hofstadter's old idea that in a one-shot prisoner's dilemma between two agents who reason the same way you should cooperate, because you should decide as if you're picking the move for both of you at once. My twist is that I think it generalizes to asymmetric cases (one player's temptation payoff much bigger, or one player has a decent outside option) if instead of maximizing the sum of the two payoffs you maximize the product of each player's gain over the mutual-defection outcome — basically a Nash-bargaining-style rule with mutual defection as the breakdown point. That still gets you cooperation, but it splits things by threat points instead of always evenly, and it handles the unequal-payoff version that the plain sum rule just fudges.

  The room is a philosophy department seminar: three causal decision theorists who think evidential decision theory is a disease, two experimental economists who run one-shot lab games and think cooperation there is confusion plus social preferences, and one social choice person who works on Harsanyi-vs-Nash style aggregation. Nobody is sympathetic.

  Prep me for the Q&A: the objections I'll actually get from this room, in the order they'll come, phrased the way each of those groups would really say it, ordered by how much damage they'd do. For each one give me a roughly two-minute reply, flag what I should concede before anyone asks, and say where my reply is softest. Also include the one question I'm probaly hoping nobody asks — my guess is it's the one about where the interpersonal utility comparison comes from, but tell me if something worse is coming. Write it all in American English.
