prompt: |-
  I sit on the Council of Appeals of a persistent, decade-old virtual world — a sandbox with its own internal courts, its own currency, and a user base that has been building inside it for years. We adjudicate grievances between players, and over that time we have accumulated a set of precedents. A new case has come before us that I do not think those precedents settle, and I want the reasoning set out carefully before we vote.

  Our precedents, in the form in which we now cite them:

  1. *The siege.* An attacking force destroyed a castle that another player had built over roughly four hundred hours, using siege mechanics the world expressly provides. Ruling: no sanction, no compensation. We held that the loss fell inside the ordinary adversarial frame of the game.

  2. *The fraudulent exchange.* A player transferred real money to another in exchange for in-world currency and received nothing. Ruling: the currency was recreated from the ledger and returned to the buyer; the seller was suspended. We said the wrong lay in the deception and the remedy in putting back what could be put back.

  3. *The avatar boundary.* A player exploited an animation-and-collision bug to force another player's avatar into a simulated sexual assault, in a world with no mechanics for it. Ruling: permanent ban, no compensation ordered. Our opinion said that what was violated was the person, and that the avatar's treatment mattered because of what it did to her.

  4. *The guild vault.* A co-leader with legitimate access emptied a guild's shared vault. The guild had a written charter treating the vault as pooled property. Ruling: suspension; traceable assets returned; untraceable assets not replaced. We allowed that the charter had made the vault theirs collectively in a sense we were prepared to act on.

  5. *The companion creature.* In a zone flagged for player-versus-player combat, one player killed another's bonded companion, an animal raised over some sixty hours. Ruling: no sanction, since the mechanic was permitted, but the studio was ordered to restore the creature from a server snapshot, on the ground that nothing had been lost that could not be restored.

  6. *The sunset.* A legacy server was closed with six months' notice, and players were offered an export tool for their builds. A cathedral, the work of thousands of hours, was lost because its builders never used the tool. Ruling: no wrong, no compensation. Notice together with the export offer was held to extinguish any expectation of permanence.

  The case now before us:

  Over two years a collective built a great library in the live shard: not architecture alone, but some eleven thousand in-world book objects whose text they authored themselves. The text exists nowhere else — the builders had in fact asked for an export path for book contents and had been told that none existed. A single player then used an unauthorized exploit of the world's fire-spread system to burn the library in one night: the mechanism was an in-world physical process rather than a direct deletion, but the mechanism was not one the game makes available. There is no shard backup predating the fire, and the studio's transaction logs preserve only fragments of the text. No real money changed hands. The library had been announced, publicly and repeatedly, as a permanent common resource; several guilds' research and a portion of the shard's quest economy depended on it; and players who never contributed describe their loss in the terms people use for the burning of an archive. The player responsible maintains that nothing real was destroyed, because all of it was only data. The appeal also asks whether the studio itself bears any responsibility for holding no restorable copy.

  What I want from you:

  - Set out the rules — I suspect there are at least three, and you may find more — that are each compatible with all six precedents. The candidates I have in mind are a person-protective rule on which in-world losses matter only as setbacks to the real-world interests of the people behind the avatars; a social-constitution rule on which what matters is what the community has actually made of the thing, through charters, announcements and reliance; and a data-ontology rule on which nothing is lost that a server can put back, so that the only questions are permission and reversibility. State each precisely enough to generate predictions, and say how it would have to be amended to fit the precedents it fits least well.
  - For each rule, say what it implies here: whether a wrong was done; against whom, if anyone — the builders, the whole user base, the studio, no one; what remedy follows, among ban, restoration from logs, studio-funded reconstruction, or compensation in currency or in real money; and whether the only-data defense succeeds or fails.
  - Give your best prediction of what the Council should decide if it is to be consistent with itself, with your reasons for preferring that rule over the others, and identify the closest analog among our precedents. I can see arguments for the guild vault, for the sunset, and for the siege, and I want you to say which of those analogies is doing real work and which is superficial.
  - Be explicit about where our precedents underdetermine the ruling, and name the principle we would be adopting under each live option — in particular what we would be committing ourselves to about whether a virtual object can be destroyed, whether its destruction can be a harm to people who never owned or built it, and whether irreplaceability or third-party reliance is doing the justificatory work.
  - Finally, specify the further case, either hypothetical or one we could construct, that would best separate the rules you have identified: a case on which at least two of them give different verdicts, and which we should therefore use afterwards to test whichever rule we adopt.
reasoning: |-
  Hmm, this user sits on a virtual world's Council of Appeals with six established precedents, and needs help analyzing a new case about a burned library. This is fascinating - it's like digital jurisprudence meets game design philosophy. The user wants systematic rule extraction, application to the new case, prediction of consistent outcomes, identification of gaps, and test cases. 

  First, the precedents reveal clear patterns: Siege and Companion Creature show acceptance of in-game mechanics causing loss, with restoration only when technically feasible. Fraudulent Exchange and Avatar Boundary involve real-world harm (deception/trauma) triggering remedies. Guild Vault recognizes collective ownership through formal agreements, while Sunset establishes that technical limitations + notice negate permanence expectations.

  Now the library case sits at a crossroads: it's player-created content like the guild vault, irreplaceable like the companion creature, but destroyed via exploit like the avatar boundary assault. The real tension lies between three philosophical approaches:
  - The person-protective rule (focus: real-world distress) would likely dismiss the loss since no money or psychological trauma occurred.
  - The social-constitution rule (focus: community reliance) would treat this as vandalism against collective heritage.
  - The data-ontology rule (focus: restorability) would note the studio's failure to preserve data as key.

  The precedents don't perfectly fit because:
  - Unlike Siege, this used unauthorized mechanics
  - Unlike Sunset, creators actively requested backups
  - Unlike Guild Vault, reliance was shard-wide, not contractual

  For test cases, imagine someone deleting a memorial built with grief-stricken players' messages - person-protective and social-constitution rules would conflict sharply there. Or consider corrupting irreplaceable data that only matters to one player - that pits data-ontology against person-protective views.

  The user's struggle shows how virtual worlds force us to redefine "harm" - is it about code, community, or consciousness? My prediction leans toward social-constitution because the library functioned as infrastructure, making this closer to vandalizing a public utility than destroying personal property.
answer: |-
  Below is a systematic analysis of your case, distilled into four rules derived from precedents, their application to the library fire, a predicted ruling, and a test case to probe the rules' boundaries.  

  ---

  ### **I. Three Rules Compatible with All Six Precedents**  
  *(Each rule is stated precisely, with amendments needed to fit the least-compatible precedent.)*  

  1. **The Person-Protective Rule (PPR)**  
     - **Rule**: *A loss constitutes a wrong only if it causes quantifiable harm to the real-world interests (psychological, financial, reputational) of the person behind the avatar. Remedies target restoring the person, not the virtual object.*  
     - **Amendment for Precedent #3 (Avatar Boundary)**: PPR must expand "harm" to include severe psychological trauma from non-mechanical violations (e.g., simulated assault). Without this, PPR cannot explain the ban.  
     - **Weakest Fit**: Precedent #1 (Siege) – PPR struggles to explain why destroying 400 hours of work isn’t a "harm" but must accept it as permitted adversity.  

  2. **The Social-Constitution Rule (SCR)**  
     - **Rule**: *A loss is wrongful if it violates communal norms, agreements, or reliance structures established by players. The virtual object’s significance derives from its social function (e.g., governance charters, public declarations, economic dependence).*  
     - **Amendment for Precedent #5 (Companion Creature)**: SCR must incorporate technical restorability when social value is high (e.g., bonded companion). Without this, SCR cannot explain why restoration was ordered despite "no sanction."  
     - **Weakest Fit**: Precedent #6 (Sunset) – SCR must concede that studio-provided tools can override communal expectations of permanence.  

  3. **The Data-Ontology Rule (DOR)**  
     - **Rule**: *A loss matters only if it is irreversible due to technical constraints. Wrongfulness depends on exploit use (non-permitted mechanics), not intent. Remedy requires restoration if possible; else, no compensation.*  
     - **Amendment for Precedent #4 (Guild Vault)**: DOR must recognize "traceable assets" as a restorable subset (via logs), even if untraceable assets are irrecoverable.  
     - **Weakest Fit**: Precedent #3 (Avatar Boundary) – DOR cannot explain the ban (no "irreversible data loss") without importing PPR’s harm principle.  

  ---

  ### **II. Application to the Library Fire Case**  
  | **Rule**               | **Wrong Done?**                     | **Against Whom?**                             | **Remedy**                                  | **"Only Data" Defense** |  
  |-------------------------|-------------------------------------|-----------------------------------------------|---------------------------------------------|--------------------------|  
  | **Person-Protective (PPR)** | No (absent evidence of psychological/financial harm). | No one. | No remedy. | **Succeeds**: Loss is "only data" with no real-world impact. |  
  | **Social-Constitution (SCR)** | Yes (violated communal reliance and public declaration of permanence). | Builders + user base (as collective beneficiaries). | Ban + studio-funded reconstruction (due to unique social value). | **Fails**: Social context makes it "more than data." |  
  | **Data-Ontology (DOR)** | Yes (irreversible + exploit-based). | Player (exploit) + studio (no backups). | Ban + partial restoration from logs; no compensation for irrecoverable text. | **Fails**: Irreversibility makes it "destruction," not "just data." |  

  ---

  ### **III. Predicted Council Ruling & Reasoning**  
  - **Ruling**: **Ban the player + order partial restoration from logs**. Studio bears no *direct* responsibility but should implement text-export tools.  
  - **Reasoning for SCR as Primary Rule**:  
    - **Why SCR?** The library’s role as a "permanent common resource" (announced publicly) and its integration into guild research/quest economies mirrors Precedent #4 (Guild Vault), where collective ownership via charter was enforceable. The exploit’s non-permitted nature aligns with Precedent #3 (Avatar Boundary), where bug exploitation was banned.  
    - **Why over PPR?** PPR ignores communal investment (e.g., non-builders’ grief over lost archive). Precedent #6 (Sunset) shows player negligence voids claims, but here builders *requested* backups and were denied.  
    - **Why over DOR?** DOR’s focus on reversibility is secondary; Precedent #5 (Companion Creature) restored a replaceable object due to its *social value* (bonded companion), not just technical ease.  
  - **Closest Analogue**: **Guild Vault (#4)**. Both involve:  
    - Collective property (vault/library) with formalized communal status (charter/public announcements).  
    - Partial restoration ordered for traceable assets.  
    - **Superficial Analogues**:  
      - Siege (#1): Permitted mechanics vs. exploit.  
      - Sunset (#6): Studio offered export tools; here, tools were explicitly denied.  

  ---

  ### **IV. Where Precedents Underdetermine the Ruling**  
  1. **Can a virtual object be "destroyed"?**  
     - Precedents imply "destruction" requires irreversibility (Siege: restorable?; Companion: restored). **New principle**: *Irreversibility + communal significance = destruction*.  
  2. **Harm to non-owners?**  
     - Precedent #3 (Avatar) recognized harm to the person, not object. **New principle**: *Reliance by third parties can generate harm if the object was a public good*.  
  3. **Justificatory work**: Irreplaceability *plus* reliance. Sunset (#6) had replaceability (export tool) but no reliance; here, both are present.  

  ---

  ### **V. Test Case to Separate the Rules**  
  **The Memorial Garden**:  
  > *Players build a garden with 10,000 unique, player-written epitaphs for real-world deceased loved ones. The garden is tagged "permanent" by the studio. A player uses an exploit to delete it. No backups exist; text fragments remain in logs. Players (including non-builders) report profound grief.*  

  | **Rule** | **Verdict** |  
  |----------|-------------|  
  | **PPR** | No wrong (no financial loss; grief is subjective). |  
  | **SCR** | Wrong (violates "permanent" tag + communal mourning space). Ban + studio apology. |  
  | **DOR** | Wrong (irreversible + exploit). Ban + partial restoration from logs. |  

  **Why it separates rules**:  
  - PPR vs. SCR: Non-owners’ grief matters to SCR (social function) but not PPR (no "quantifiable" harm).  
  - SCR vs. DOR: SCR mandates studio accountability for tagging it "permanent"; DOR focuses only on exploit/restorability.  

  ---  
  **Final Council Guidance**: Adopt the **Social-Constitution Rule** as most consistent with your precedents’ emphasis on communal agreements (Guild Vault) and the gravity of exploits (Avatar Boundary). The library was infrastructure, not just data. Specify in your opinion that virtual objects *can* be destroyed when they become irreplaceable social artifacts, and third-party reliance amplifies the wrong. The studio’s prior refusal of exports, while not actionable here, should prompt policy reform.
