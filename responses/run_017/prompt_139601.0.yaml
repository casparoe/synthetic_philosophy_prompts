  ### **Named Positions and Awkward Commitments**
  Each leaf position's most awkward commitment—a consequence likely to feel counterintuitive or unsatisfying—is summarized below:  
  - **A. Reductionist/identity**: Symbols are identical to substrate, so their "causation" is just substrate causation, denying any distinct higher-level reality.  
  - **B. Exclusionist**: Symbols are real patterns but causally inert; only substrate does any work.  
  - **D. Non-reductive physicalism (causal inheritance)**: Symbols cause effects, but only by virtue of being realized by substrate, so they add no independent causal power.  
  - **E. Strong downward causation/emergentist**: Symbols have novel causal powers not fully determined by microphysical laws, violating the premise's spirit.  
  - **F. Interventionist**: Symbols count as causes only under human interventions (e.g., clamping), making causation observer-dependent.  
  - **G. Descriptivist**: Symbols constrain outcomes without causing them, reducing the question to a linguistic mistake.  
  - **H. Interpretation-relativist/intentional-stance**: Symbols exist solely relative to an interpreter's stance; no facts about them hold independently.  
  - **I. Tangled-hierarchy**: Symbol efficacy requires self-representation loops, which may not generalize to simple systems.  

