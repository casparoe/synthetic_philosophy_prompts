  ### **Decision Tree**
  *Answer the questions in order, following the branches. Base answers only on the case descriptions.*

  1. **Counterfeit careenium**: A system mimics real careenium substrate trajectories and outward symbol behavior by brute-force tabulation, with no internal symbols. Does it have genuine symbols?  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Re-graining**: The same careenium is redescribed at a finer/coarser grain (e.g., old "substrate" becomes new "symbols"). Does the causal efficacy of symbols collapse into a choice of description?  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **Graft**: A simmball configuration is moved from one careenium to another, where it plays a different symbolic role. Does it behave as it did in the original system, or as its new role dictates?  
     - **As it did originally** → Go to 6.  
     - **As its new role dictates** → Go to 7.  

  4. **Dual description**: Two complete, consistent descriptions exist—microphysical and symbolic—of a single careenium process. Is there a fact of the matter about which level is causally primary?  
     - **Yes** → Go to 8.  
     - **No** → **Leaf H: Interpretation-relativist/intentional-stance**.  

  5. **Leak-away**: Symbols exert partial, temporary grip due to substrate erosion. Does this grip constitute causal "pushing"?  
     - **Yes** → **Leaf E: Strong downward causation/emergentist**.  
     - **No** → **Leaf D: Non-reductive physicalism (causal inheritance)**.  

  6. **Inverted-interpretation twins**: Two careenia are microphysically identical but have divergent symbol interpretations due to history/surroundings. By the premise, their evolution is identical. Do symbols nonetheless play a causal role?  
     - **Yes** → **Leaf A: Reductionist/identity**.  
     - **No** → **Leaf B: Exclusionist**.  

  7. **Clamped symbol**: An experimenter holds a symbol fixed, and the substrate reorganizes around it. Is the symbol itself a cause of the reorganization?  
     - **Yes** → Go to 8.  
     - **No** → **Leaf G: Descriptivist**.  

  8. **Symbolic override**: The careenium is designed so a symbol command can locally override microphysical dynamics (e.g., triggering external intervention). Does the symbol cause the override?  
     - **Yes** → **Leaf I: Tangled-hierarchy**.  
     - **No** → **Leaf F: Interventionist**.  

