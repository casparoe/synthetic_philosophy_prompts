  The user's test isn't sufficient because both sides would interpret the results through their existing frameworks. A better crux involves empirical predictions or formal models. For example, if an AI trained on physical data could simulate accurate first-person reports, physicalism gains ground. Conversely, if such predictions always miss the qualitative aspect, anti-physicalism is stronger. However, this is currently untestable.

