answer: |-
  After testing your cases against multiple candidate principles—including your own—I've arrived at a refined principle that coheres best with the structural constraints. The core insight is that **limit states are determinate iff the description forces a unique completion at the accumulation point, independent of later evidence or boundary stipulations**. Here's the principle, clause by clause:

  ### **The Limit State Determinacy Principle (LSDP)**  
  A lamp's state at a limit time \( t^* \) is determinate iff:  
  1. **Finite Action Neighbourhood (FAN)**: Only finitely many switch throws occur in some interval \( (t^* - \delta, t^*) \) (so the state stabilizes pre-limit).  
     *Motivated by:* Case 4 (laggy lamp), where finite effective throws force determinacy.  
  2. **Completion-Independent Constraint (CIC)**: The description includes an explicit rule, boundary condition, or physical law that fixes the state at \( t^* \) independently of the switch sequence (e.g., continuity, conservation, or definitional fiat).  
     *Motivated by:* Case 5 (wobble switch), where stipulating \( x(1) = 0 \) forces "off" under the rule.  
  3. *Otherwise, the state is indeterminate at \( t^* \).*  

  ### **Verdicts on Your Cases**  
  | Case | Your Verdict | LSDP Verdict | Comments |
  |------|--------------|--------------|----------|
  | 1. Standard | Indeterminate | **Indeterminate** | FAN and CIC fail. No stabilization or boundary rule. |
  | 2. Found lamp | Determinate (on) | **Indeterminate** | LSDP overturns your verdict. Later evidence reveals but doesn't create the fact. Identical pre-limit history ⇒ identical indeterminacy. |
  | 3. Eternal alternator | Determinate | **Determinate** | FAN satisfied at every time (no accumulation point). |
  | 4. Laggy lamp | Determinate (off) | **Determinate (off)** | FAN satisfied (finite throws near \( t=1 \)). |
  | 5. Wobble switch | Indeterminate | **Determinate iff rule includes \( x(1) = 0 \)** | Without explicit \( x(1) \), CIC fails ⇒ indeterminate. Student’s move isn’t cheating—it invokes CIC via boundary stipulation. |
  | 6. Lopsided lamp | Indeterminate | **Indeterminate** | Majority duration ≠ CIC/FAN. No rule forces "on". |
  | 7. Ganged pair | Indeterminate (which), determinate (exactly one) | **Matches verdict** | State of individual lamps indeterminate (FAN/CIC fail), but collective state determinate by wiring rule (CIC: "exactly one on" holds at all \( t < 1 \), so holds at limit by fiat). |

  ### **New Cases & Predictions**  
  - **Dense Throws (every rational in (0,1))**: Indeterminate at \( t=1 \).  
    *Why:* FAN fails (infinitely many throws near limit), no CIC.  
  - **Two Accumulation Points (e.g., throws at \( 1 \pm 2^{-n} \))**: Indeterminate at both \( t=1 \) and \( t=2 \).  
    *Why:* FAN fails at each point; no CIC.  
  - **Decaying Lag (lamp ignores throws within \( \varepsilon(t) = 2^{-n} \) of prior throw)**: **Determinate** if \( \varepsilon(t) \) grows near limit (FAN satisfied), else indeterminate.  

  **Predicted Intuition Conflict:** Case 2 (found lamp). You feel "on" at \( t=1 \), but LSDP says indeterminate. I argue your intuition confuses *epistemic access* (we learn it was on) with *ontic status* (it was fixed independently).  

  ### **Handling Your Tentative Principle**  
  - I retain your (a) (≈ FAN) but reject (b) as stated. CIC is narrower: only *intrinsic* constraints (e.g., wiring rules, continuity stipulations) count, not extrinsic facts like later observations. This avoids "cheating":  
    - Case 2: Later observation is extrinsic → no CIC.  
    - Case 7: Wiring rule is intrinsic → CIC applies.  

  ### **Confidence & Vulnerability**  
  - **High Confidence:** FAN (cases 1,3,4) and CIC for collective states (case 7).  
  - **Moderate Confidence:** Rejecting later evidence (case 2). This is ontologically pure but clashes with intuition.  
  - **Most Vulnerable Claim:** That continuity stipulations (case 5) are valid under CIC. One could argue this smuggles physics—but I maintain it’s a structural descriptor.  

  **Final Commitment:** LSDP is the best fit. It treats indeterminacy as a failure of the *description* to fix a unique state, not a physical impossibility. This resolves your tension: case 1 and case 2 have identical *descriptions* pre-limit, so both are indeterminate—eliminating the need to "earn" a difference. Case 7 shows indeterminacy is local (which lamp) not global (exactly one).  

  ---  
  *I stand by this, but if you force me to choose one clause to doubt: CIC’s handling of boundary stipulations (case 5) feels most negotiable. If we demand *non-stipulative* constraints, virtually all supertasks become indeterminate—but that might be right.*
