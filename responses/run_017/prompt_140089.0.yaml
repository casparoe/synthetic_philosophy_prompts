prompt: |-
  Hey — I'm a software engineer with no philosophy background, so keep it concrete and skip the citations, I can't follow them anyway.

  I run a team of about a dozen engineers at a company that's gone pretty hard on AI-assisted development: most nontrivial code now starts as a model-generated draft that a human reviews and merges. People are quietly worried we're loosing our grip on our own systems. I've got maybe a year and something like 20-30% of two senior engineers' time to actually do something about it. So I want an agenda, not a survey.

  Here's the candidate list of worries, roughly as my team states them: engineers who can competently review code they couldn't have written; juniors never building the mental models you used to get from grinding through hard bugs; everyone's sense of what they personally do and don't understand getting badly calibrated; us quietly inheriting the model's framing of what a problem even is, so we stop noticing we've been handed the question; and on-call incidents where nobody can reconstruct why the system behaves the way it does. Plus whatever I'm not thinking of.

  Which two or three would you spend the year on, in what order, and why? I care much more about the reasoning than the list: what criteria you're ranking by (how much damage, how fixable at my level rather than at the model labs, how much of the rest depends on it, how neglected), the trade-offs between those criteria, and which worries you're putting low because they sound alarming but don't really follow.

  The part I most want: what observable evidence over the next year should move something up or down. What would I actually track on my own team to find out I'd backed the wrong horse?

  One half-formed idea of mine, in case it's useful: I suspect the useful distinction isn't "understands vs. doesn't understand" but "can judge vs. can produce," and that we're drifting hard toward judge-only. If that's the wrong frame, say so and hand me a better one.
reasoning: |-
  Okay, let me tackle this problem. The user is a software engineering manager dealing with AI-generated code adoption. Their team has specific worries about losing understanding of their systems. They need a prioritized action plan with observable metrics to track progress.

  First, I need to understand the core concerns. The main worries are: engineers can't review code they couldn't write, juniors missing out on building mental models, miscalibrated self-assessment, inheriting the model's problem framing, and on-call incidents with no understanding. The user also hints at the judge vs. produce distinction.

  The key criteria for prioritization should be: potential damage, fixability at their level, foundational impact, and observability. On-call incidents seem most urgent because they directly impact system reliability and are measurable. Recurring incidents with deep understanding gaps would be a red flag.

  Next, the "judge vs. produce" drift. This is critical because if engineers lose the ability to produce, they can't effectively judge either. The calibration of understanding affects everything else. Fixing this involves forcing production exercises and tracking self-assessment accuracy through code reviews.

  Problem framing inheritance is more subtle but foundational. If the team only solves problems the AI can frame, they miss deeper issues. This requires explicit problem articulation and solution comparisons. Tracking design doc quality and solution diversity could help here.

  Junior development is important but depends on solving the core skills in seniors first. Mental models come from deliberate practice, not just grinding bugs. So it's phase two.

  Prioritizing on-call incidents first makes sense because they're concrete and damaging. Then the judge-produce gap since it underpins review capabilities. Problem framing comes third as it's more strategic. Junior development builds on these foundations.

  Observable metrics are crucial. For on-call, track incidents requiring deep dives and resolution time. For judge-produce, measure review depth and force production exercises. For framing, assess design docs and solution diversity. If metrics don't improve after interventions, it's a sign to adjust focus.

  The user's half-formed idea about judge vs. produce is spot-on. The key is maintaining the ability to produce, which enables better judgment. Without that, all other reviews and mentoring fail.

  Trade-offs involve not tackling junior development immediately, but it's better to fix senior capabilities first. Also, some issues like calibration might improve as a side effect of other interventions.

  In summary, the plan is: Quarter 1-2: Fix on-call understanding. Quarter 3-4: Close judge-produce gap. Year 2: Tackle problem framing and junior development. Track specific metrics to validate progress and pivot if needed.
answer: |-
  Here's a concrete action plan focused on your most critical, addressable risks, using your criteria (damage, fixability, foundational impact, neglect). I'd prioritize two, with a third as a "next step" if progress is good:

  **Priority 1: On-Call Incidents & Deep System Understanding Loss** *(Months 1-6)*
  *   **Why This First:**
      *   **Damage:** Directly impacts production, customer trust, revenue, and team morale. Incidents with no understanding are existential threats.
      *   **Fixability:** Highly actionable *within your team*. You control incident response, documentation, and learning processes.
      *   **Foundational:** Understanding *why* the system behaves as it does is the bedrock. Without this, reviewing AI code, mentoring juniors, and calibrating understanding are impossible.
      *   **Neglected:** Often treated as firefighting, not a symptom of systemic understanding decay. Proactively building this muscle is crucial.
  *   **Observable Evidence (Track This):**
      *   **Metric:** *"Time to Root Cause + Confident Explanation"* for Sev1/2 incidents. Track *trend* over next 6 months.
      *   **Signal:** Incidents where the *initial* explanation was AI-code-related and wildly wrong, or where discovering the *real* cause required deep, novel archaeology unrelated to the AI's output.
      *   **Evidence You're Wrong:** If incidents consistently have clear, quick root causes *unrelated* to AI-generated code complexity or opacity, this might be less urgent than feared. But if you see "magic happens here -> breaks" frequently, you're right.
  *   **Concrete Actions (Use 50-60% of your allocated time here initially):**
      1.  **"Incident Autopsy" Mandate:** For *every* significant incident involving AI-generated/modified code, require:
          *   A designated "Archaeologist" (rotate seniors) tasked with tracing *exactly* why the code behaved that way, *ignoring* the AI's original prompt/comment.
          *   A short write-up: "What the AI code *looked* like it did vs. What it *actually* did & Why." Focus on data flow, edge cases, assumptions.
      2.  **Build "Understanding Artifacts":** Use autopsy findings to create:
          *   Targeted diagrams (sequence, data flow) for tricky AI-generated modules.
          *   Explicit "Assumption Registers" attached to critical AI-generated components (e.g., "Assumes input X is always normalized," "Relies on library Y behavior under load Z").
          *   **Not** just more comments in the code – separate, living documents.
      3.  **"Fix the Hole, Not Just the Symptom" Rule:** Post-incident fixes *must* address the *understanding gap* (e.g., add logging, simplify logic, add an assertion, update the artifact) *in addition to* the immediate bug fix. Dedicate time for this.

  **Priority 2: The "Judge vs. Produce" Gap & Calibration Failure** *(Months 3-12, overlapping)*
  *   **Why This Second:**
      *   **Damage:** Erodes core engineering skill (problem-solving, deep design), leads to bad reviews, poor design decisions, and makes Priority 1 worse. Uncalibrated confidence is dangerous.
      *   **Fixability:** Directly addressable through process changes and targeted exercises *you control*.
      *   **Foundational:** The ability to *produce* (even if you *choose* not to) underpins effective *judgment*. Calibration is essential for knowing when to trust yourself vs. the AI vs. needing help.
      *   **Neglected:** Easy to assume "reviewing is enough." It's not. Your "half-formed idea" is spot-on.
  *   **Observable Evidence (Track This):**
      *   **Metric:** *"Blind Spot Rate"*: In code reviews, track how often a reviewer approves something but then *cannot* explain a core aspect of *how* it works when probed later (e.g., in a design meeting or incident). Sample reviews monthly.
      *   **Signal:** Engineers expressing surprise ("*That's* how that works?!"), or consistently deferring to the AI's structure without challenging it during design ("The AI did it this way..." as the primary justification).
      *   **Evidence You're Wrong:** If engineers consistently demonstrate the ability to re-implement or significantly refactor AI-generated code *from first principles* when needed (e.g., for perf, clarity), without just tweaking prompts, the gap might be smaller.
  *   **Concrete Actions (Use 30-40% of allocated time):**
      1.  **Mandatory "From Scratch" Refactoring:** Each senior (and ambitious junior) must take *one* non-trivial, critical AI-generated module per quarter and **rewrite it manually** based *only* on the spec/requirements, *without* looking at the existing AI code first. Then compare. Goal isn't to replace, but to force production thinking and reveal gaps.
      2.  **"Challenge the Frame" Reviews:** In design reviews for AI-assisted work, require the author to:
          *   Explicitly state the problem *they* were solving (vs. the prompt they gave the AI).
          *   Explain alternative approaches *they* considered *before* prompting.
          *   Justify *why* the AI's output structure was chosen over alternatives.
      3.  **Calibration Drills:**
          *   **Pre-Review Confidence Check:** Before reviewing complex AI code, the reviewer writes down their confidence level (1-5) in understanding key aspects *before* diving in. Review, then re-rate. Track discrepancies.
          *   **"Explain it to Me" Sessions:** Seniors regularly ask juniors (and peers) to explain AI-generated code *as if they wrote it themselves*. Forces articulation beyond passive review.

  **Priority 3 (If Progress is Good): Inherited Problem Framing** *(Months 9-12)*
  *   **Why This Third (For Now):**
      *   **Damage:** Subtle but profound. Limits innovation and leads to solving the wrong problems well. Harder to observe immediately.
      *   **Fixability:** Requires shifting design *processes* and encouraging meta-cognition. More cultural/process change than direct skill-building.
      *   **Foundational:** Connects to Judge/Produce and System Understanding. If you don't own the problem definition, everything else is built on sand.
      *   **Neglected:** Extremely easy to miss as it happens gradually. Often only visible in hindsight.
  *   **Concrete Actions (Start Small, Use Remaining Time):**
      1.  **"Pre-Prompt" Design Session:** For significant features, require a *human-only* design session defining the problem, constraints, and *desired solution structure* **before** any AI prompting. The AI then becomes an implementation assistant, not a designer.
      2.  **"Framing Retrospective":** Quarterly, pick a shipped AI-assisted feature. Ask: "What problem *did* we actually solve? Was it the most important one? How was the initial problem framed (by us vs. implied by early AI drafts)?"
      3.  **Track Solution Diversity:** Are designs converging to patterns heavily favored by the AI? Are genuinely novel (human-driven) approaches still emerging?

  **Why NOT the Others *First* (This Year):**
  *   **Juniors & Mental Models:** Crucial long-term, but less *immediately* damaging than incidents or core skill erosion in seniors. Solving Priority 2 *is* how you eventually mentor juniors effectively. Forcing juniors to grind bugs is inefficient; focus on *structured* "from scratch" exercises (Action 2.1) *after* seniors rebuild their own skills. Start mentoring programs *informed* by your Priority 2 work.
  *   **Reviewing Unwritable Code:** Addressed *by* Priority 1 (building artifacts) and Priority 2 (forcing production capability and better review practices). If you can't produce it *in principle*, you can't truly review it. Focus on making the code less opaque and engineers more capable first.

  **Your Frame: "Judge vs. Produce" is CORRECT and CRITICAL**
  Your instinct is excellent. The core risk is **Capability Drift**: The erosion of the ability to *generate* solutions (produce) due to over-reliance on *evaluating* AI output (judge). Production capability underpins:
  1.  **Effective Judgment:** You can't deeply critique what you couldn't create.
  2.  **Accurate Calibration:** Knowing what you know requires having built similar things.
  3.  **System Understanding:** Production forces you to confront edge cases and interactions.
  4.  **Mentorship:** You can't teach what you can't do.
  5.  **Framing:** Defining the problem requires imagining potential solutions.

  **What to Track to Know if You're Wrong:**
  *   **On Priority 1 (Incidents):** If your *"Time to Root Cause + Confident Explanation"* metric **doesn't decrease significantly after 6 months** of focused autopsies and artifact creation, and incidents *still* regularly involve "magic box" confusion, you underestimated the depth of the understanding loss or the effectiveness of your interventions. Pivot: Double down on artifact quality or consider more aggressive simplification/rewrites of critical AI-generated components.
  *   **On Priority 2 (Judge/Produce):** If your *"Blind Spot Rate"* **stays high or increases** despite the "From Scratch" exercises and calibration drills, or engineers actively **resist/resent** these exercises as "wasted time," it means the drift is severe and/or your interventions aren't hitting the mark. Pivot: Make exercises smaller/more focused, tie them more directly to current work/incidents, or explicitly link success in these to career growth.

  **The Agenda (Summary):**
  1.  **Months 1-6: Stop the Bleeding & Build Understanding Muscle.**
      *   Focus: On-Call Incidents & Deep System Understanding (Priority 1 Actions).
      *   Track: Time to Root Cause + Artifact Quality & Usage.
  2.  **Months 3-12: Rebuild Core Production Capability & Calibration.**
      *   Focus: Judge vs. Produce Gap & Calibration (Priority 2 Actions). Overlap with Priority 1.
      *   Track: Blind Spot Rate, Quality of "Challenge the Frame" justifications, Calibration Drill results.
  3.  **Months 9-12: (Conditional) Tackle Problem Framing.**
      *   Focus: Inherited Framing (Priority 3 Actions) *if* P1 & P2 show strong progress.
      *   Track: Quality of Pre-Prompt Designs, Insights from Framing Retrospectives.
  4.  **Ongoing:** Use insights from P1 & P2 to start **structured junior mentoring** (e.g., guided "from scratch" on simpler modules, paired debugging on AI code autopsies).

  This approach attacks the most damaging, fixable, and foundational issues first, using observable metrics to guide you. It directly confronts the "Judge vs. Produce" drift you correctly identified as the core threat. Good luck!
