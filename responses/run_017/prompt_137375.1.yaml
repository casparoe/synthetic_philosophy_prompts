prompt: |-
  Public risk regulation has a shape I have not been able to state as a single principle, and I would like you to reconstruct the decision theory it presupposes — where the object of reconstruction is the whole pattern, not any one of its parts.

  Three features, as I understand them. (1) Agencies monetise mortality risk. A proposed rule that lowers the chance that people die is credited with a benefit equal to the number of statistical deaths averted multiplied by a fixed monetary value per statistical life, and the rule is approved when that figure exceeds its cost. The accounting is linear: twice the population exposed to the same per-person risk yields twice the benefit, however many people that comes to. (2) The same agencies discard small probabilities. A lifetime risk below some de minimis threshold — in the guidance I have seen, often put at roughly one in a million — is treated as negligible and is not carried through the calculation at all, even when enough people are exposed that the expected number of deaths is not negligible. (3) The same governments spend real money against low-probability, enormous-stakes risks: surveys to detect asteroids on Earth-crossing orbits, programmes to secure nuclear materials, pandemic preparedness. There the annual probability is small and the thing at stake is, depending on the case, millions of lives or the shape of everything that comes after.

  Set feature (3) beside the case that everyone in these arguments treats as the reductio. A stranger tells you that unless you hand over your wallet he will, by means he refuses to specify, arrange for an astronomically large number of people to be tortured. Any non-zero credence you give his story, multiplied by a large enough number of victims, outweighs every ordinary use of the money. Nobody funds interventions recommended on that basis, and I do not think the refusal is mere inattention.

  Call fanaticism the thesis that expected value settles the matter on its own: for any sure good and any probability however small, there is some finite stake for which the gamble is to be preferred. Then:

  1. Reconstruct the implicit theory. Does the practice strictly presuppose anti-fanaticism, or is it compatible with plain expected-value maximisation once ordinary empirical claims about which small probabilities are trustworthy are added? Separate what the pattern genuinely requires from what it merely fits well with.

  2. The evidential defence. Distinguish probabilities delivered by a tested model with known error bars — impact frequencies for near-Earth objects, say — from probabilities attached to a bare assertion with no model behind it. Is that distinction enough to keep expected value and dismiss the stranger? Press on the obvious move: a careful agent is uncertain which model is right and should average over models. If averaging gives the stranger's hypothesis any share at all, does the huge stake survive, so that the defence fails? Does model-averaging rescue the regulator, or does it merely relocate the problem?

  3. The structural objection. If the fanatical ordering is unbounded, then for every bet there is a lower-probability, higher-stakes bet that beats it, and no policy is maximal. Is that a reason to think the thresholds are doing real work rather than expressing squeamishness, or is the regress harmless because in practice probabilities fall faster than stakes can be inflated?

  4. Consider a specific anti-fanatical rule: fund an intervention only if its probability of success clears a bar that falls as the stakes rise, but falls more slowly than one over the stakes — require p at least k divided by the square root of the value at stake, or k divided by its logarithm, so that the expected value demanded grows with what is at stake. Does this reproduce (1) through (3)? Where does it place the asteroid survey, and where the stranger? Is it principled or a curve fitted to intuition? And is that what the practice looks like, or does the practice look more like a hard probability floor?

  5. What would have to change. If a government became a convinced fanatic, what would regulatory analysis become — does every budget collapse into whichever long shot names the largest stake, and what happens when two such long shots compete? If instead it placed an upper bound on the value of the future, would feature (3) survive? Would asteroid detection and pandemic preparedness have to be reargued as insurance or as risk-aversion rather than as expectation, and would those arguments be weaker?

  6. Where is the practice underdetermined? Could a bounded-value theorist and a probability-threshold theorist both endorse all three features, and is there any decision the practice actually makes that would tell them apart? Concretely: a programme costing fifty million that reduces this century's chance of civilisational collapse by one in ten thousand, against a programme costing the same that has one chance in a billion of securing 10^18 future lives. Does the practice, as it stands, say anything about that pair — and should it?
reasoning: |-
  Hmm, this is a deep and nuanced question about public risk regulation and decision theory. The user is clearly knowledgeable in philosophy and policy analysis, presenting a sophisticated critique of how governments handle catastrophic risks. They've identified three seemingly contradictory features: (1) linear monetization of statistical lives, (2) ignoring de minimis risks, yet (3) funding interventions against low-probability existential threats.

  The user wants me to reconstruct the implicit decision theory behind this pattern. They're particularly interested in the tension between rejecting "fanaticism" (where any tiny probability of infinite stakes dominates) while still taking extreme risks seriously. I need to address their six specific sub-questions systematically.

  First, I should acknowledge that no single principle explains all three features. The practice seems to rely on pragmatic anti-fanaticism - rejecting infinite valuations while maintaining a special category for catastrophic risks. This isn't pure expected value maximization; it incorporates epistemic filters and what we might call "viability thresholds" for probabilities.

  The evidential defense question is tricky. While model-based probabilities differ from bare assertions, model-averaging doesn't fully solve the stranger problem. The regulator likely uses a credibility threshold before even assigning probabilities - the stranger's claim gets screened out at the epistemic gate. But this feels more like a practical heuristic than a rigorous solution.

  On structural objections: the regress argument against fanaticism is theoretically sound but pragmatically limited. In real policy, improbable claims become absurdly speculative before stakes get truly astronomical. The thresholds do substantial work here - they're not just psychological.

  For anti-fanatic rules like p > k/√V, this fits features (1) and (3) reasonably well but struggles with (2). It would fund asteroid surveys (high V) while dismissing the stranger (who gets screened out by the credibility filter). But it feels engineered to match intuitions rather than derived from first principles.

  If governments became fanatics, budgets would indeed collapse into whichever long shot names the largest stake. This seems unsustainable - hence current practice implicitly rejects this. Bounded value theories could preserve feature (3) by setting the bound high enough, but they'd need to justify why the bound isn't infinite.

  The underdetermination point is sharp: both threshold theorists and bounded-value theorists can endorse all three features. In the civilizational collapse vs. 10¹⁸ lives scenario, current practice would likely favor the collapse prevention due to probability thresholds, but this reveals its arbitrariness. The practice should probably develop consistent catastrophic risk tiers.

  Throughout this, I should maintain the user's philosophical precision while connecting to real regulatory practice. Their "stranger with a torture threat" reductio is particularly effective - I'll use that as a touchstone for testing theories.
answer: |-
  Your analysis captures a profound tension in public risk regulation. The implicit decision theory isn't reducible to a single principle but reflects a **pragmatic anti-fanaticism** that integrates epistemic constraints, institutional viability, and a tiered approach to catastrophic stakes. Below is a systematic reconstruction addressing each query:

  ### 1. **Implicit Theory: Anti-Fanaticism with Epistemic Filters**
     - **Core Presupposition**: Strict anti-fanaticism. The practice rejects unbounded expected value (EV) maximization. If fanaticism were accepted, (2) (de minimis thresholds) would be incoherent, and (3) (funding asteroid surveys) would imply *all* credible low-probability/high-stakes risks must dominate the budget—which they don’t.
     - **Compatibility with EV?** Only under *empirical skepticism*: agencies dismiss probabilities lacking credible models (e.g., the stranger’s threat) as *effectively zero*, not as small-but-actionable values. This isn’t pure EV but a **heuristic truncation** of the probability space. The pattern *requires* rejecting non-credible probabilities; it *fits* with a bounded utility function but doesn’t strictly need it.

  ### 2. **Evidential Defence: Model Credibility vs. Averaging**
     - **Distinction Insufficient Alone**: Yes, agencies use model-based probabilities (e.g., asteroid impacts with error bars) and reject bare assertions. But if agents average over models (including a "stranger model" with tiny probability), fanaticism resurfaces: a 10⁻²⁰ credence in 10²⁰ tortured lives still demands your wallet.
     - **Resolution**: The regulator avoids this via **upfront epistemic screening**. Only probabilities from validated models enter the calculation; the stranger’s claim is discarded *before* quantification. Model-averaging applies *within* the set of scientifically credible threats, not to arbitrary claims. This defense is **pragmatic** (preventing paralysis) but **theoretically incomplete**—it relocates the problem to defining "credible."

  ### 3. **Structural Objection: Thresholds as Necessary Guards**
     - **Regress is Practically Harmless but Theoretically Fatal**: While probabilities decay faster than stakes inflate *in practice* (e.g., no credible threat involves 10¹⁰⁰ lives), the regress implies *no optimal policy exists* under fanaticism. De minimis thresholds (e.g., 10⁻⁶) are **structural necessities** to ensure:
        - **Feasibility**: Policies can be compared without infinite stakes dominating.
        - **Epistemic Stability**: Only risks with tractable evidence are considered.
     - This isn’t "squeamishness" but institutional self-preservation. Without thresholds, regulation collapses.

  ### 4. **Anti-Fanatical Rules: Squared-Root Thresholds**
     - **Proposal**: Require \( p \geq \frac{k}{\sqrt{V}} \) (or \( \frac{k}{\ln V} \)) for funding, where \( V \) is value at stake. This demands expected value \( \geq k\sqrt{V} \), growing with stakes but slower than linear.
     - **Fit with Practice**:
       - **(1) Monetization**: Approximates linearity for modest risks (where \( \sqrt{V} \) is flat).
       - **(2) De minimis**: Implicitly retained; \( p \) must exceed a function of \( V \), dismissing ultra-low-\( p \) when \( V \) is small.
       - **(3) Catastrophic Risks**: Funds asteroid surveys (high \( V \), moderate \( p \)) but dismisses the stranger (low \( p \), high \( V \)).
     - **Asteroid vs. Stranger**: 
       - Asteroid: \( p \sim 10^{-5} \), \( V \sim 10^{10} \) lives → \( p \gg \frac{k}{\sqrt{V}} \) (plausible \( k \)).
       - Stranger: \( p \sim 10^{-\text{large}} \), \( V \sim 10^{20} \) → \( p \ll \frac{k}{\sqrt{V}} \).
     - **Assessment**: 
       - **Principled?** Not deeply. It’s a **curve-fit** to avoid fanaticism while respecting (1)-(3). 
       - **Practice Alignment?** Real agencies use *hard probability floors* (de minimis) paired with *ad hoc* escalation for catastrophes. A \( \frac{k}{\sqrt{V}} \) rule systematizes this but isn’t explicit.

  ### 5. **Consequences of Fanaticism or Bounded Value**
     - **If Government Embraces Fanaticism**:
       - Budgets collapse into the "highest-stakes long shot" with any non-zero probability (e.g., stranger-like claims). Competing long shots induce **Pascal’s Mugging races**, paralyzing policy.
     - **If Government Bounds Value** (e.g., \( V_{\text{max}} = 10^{15} \) lives):
       - **(3) Partially Survives**: Asteroid defense (\( V < V_{\text{max}} \)) could be justified by EV, but true existential risks (e.g., unrecoverable collapse) might be undervalued.
       - **Re-arguing Catastrophic Risks**: Agencies would frame them as:
         - **Insurance**: Paying to avoid correlated ruin (non-linear risk aversion).
         - **Robustness**: Avoiding non-recoverable losses (precautionary principle).
       - **Strength of Arguments**: Weaker than EV, as insurance arguments require hard-to-quantify correlation models.

  ### 6. **Underdetermination and Discriminating Cases**
     - **Underdetermination**: Yes, both:
       - **Bounded Value Theorist** (e.g., \( V_{\text{max}} = 10^{16} \))
       - **Probability Threshold Theorist** (e.g., de minimis \( p_{\text{min}} = 10^{-6} \), escalating for high stakes)
       can endorse (1)-(3) by calibrating parameters. 
     - **Discriminating Test**: Your proposed pair:
       - **Program A**: Cost = $50M, reduces civilizational collapse risk by \( \Delta p = 10^{-4} \) (stakes: \( V_A \sim \text{civilization} \)).
       - **Program B**: Cost = $50M, secures \( 10^{18} \) lives with \( p = 10^{-9} \).
     - **Current Practice**: 
       - **Program A** wins. Collapse prevention has higher probability (\( 10^{-4} \gg 10^{-9} \)) and tangible stakes. \( 10^{-9} \) is below de minimis unless explicitly escalated (unlikely for speculative futures).
       - **Program B** is dismissed: \( p \) is "negligible" despite high stakes, as \( 10^{18} \) lives exceeds credible models.
     - **Should Practice Change?** Arguably yes. This reveals inconsistency: 
       - If \( V_A \) is finite (e.g., 10¹⁰ lives), Program B’s EV \( = 10^9 \) lives saved dwarfs A’s EV \( = 10^6 \). 
       - Practice should either:
          - **Escalate thresholds for all high-stakes risks** (including Program B), or
          - **Bound \( V \)**, admitting A is preferred due to model robustness.

  ### Synthesis: The Implicit Decision Theory
  Public risk regulation assumes a **tiered ontology of risk**:
  - **Tier 1 (Routine Risks)**: Linear EV monetization (feature 1).
  - **Tier 2 (Negligible Risks)**: De minimis probability threshold (feature 2), dismissing poorly evidenced or microscale threats.
  - **Tier 3 (Catastrophic Risks)**: Context-sensitive escalation (feature 3), where high stakes lower the actionable probability bar, but only for *credible, model-based* threats.

  This is **anti-fanaticist** (rejecting infinite stakes), **epistemically constrained** (requiring scientific credibility), and **structurally pragmatic** (avoiding regress). It reflects a bounded-agency perspective: regulators act *as if* the future has finite value, probabilities below a floor are zero, and only tractable models count—because the alternative is paralysis. The unresolved tension is how to systematize Tier 3 without ad hoc thresholds or inviting fanaticism. A rule like \( p \geq k/\sqrt{V} \) for all risks is a candidate, but current practice favors institutional judgment over explicit formulas.
