  I'm in a philosophy of biology seminar this term, and I also write compilers — I'm fluent in instruction-set architecture, machine code versus source, what fixes the semantics of an opcode, relocation and position-independent code, disassembly, self-modifying code, and the fact that a byte string's meaning is settled by whatever machine happens to read it. Our last class was on whether DNA is literally a code and whether genes carry information in any sense stronger than being causes among causes. I'd rather have a translation than a summary.

  Take the coding or semantic view, and its main rival — the parity or causal-structural view, on which sequence-specific causation is just one developmental resource among many and "codes for" is shorthand for reliable covariance relative to some interpreting machinery — and restate each in my vocabulary as faithfully as you can. Then run both translations on four cases: a variant mitochondrial codon table; a synthetic organism I'll stipulate, whose genome uses a six-letter alphabet with a 216-entry codon table read by its own orthogonal translation machinery; recoding in which a UGA means selenocysteine or stop depending on an element further downstream in the transcript; and an inherited methylation mark or prion that alters phenotype without being a sequence at all.

  Then the residue report: which claims carry over cleanly, which only with distortion, and which cannot be said in my vocabulary at all — error and mistranslation, function, arbitrariness, the normativity of a correct reading. For whatever fails to survive, say whether that is my vocabulary's blind spot or a sign that the philosophers' dispute is thinner than it looks, and flag anywhere my own vocabulary quietly takes sides instead of merely restating the disagreement.
