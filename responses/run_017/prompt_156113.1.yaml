prompt: |-
  I'm on the process committee at my company, and we own a huge inherited list of engineering rules — required sign-offs, banned libraries, mandatory fields, review gates. We've been pruning it, arguing about Chesterton's fence constantly, and I've noticed we might actually be running two different rules that only come apart on the case in front of us now.

  Our verdicts so far:

  - Kept a rule requiring a second sign-off on database migrations, because nobody could find out why it was there.
  - Deleted a rule forcing all new services onto an internal framework, after someone dug up that the original constraint was a compiler limitation fixed years ago, and nothing else had grown up around it.
  - Kept a ban on a certain library even after we found the license problem behind it had been resolved, because a pile of tooling and docs had been built assuming the ban.
  - Deleted a rule added only two years ago by a team that's since disbanded, once we found its rationale and saw it no longer applied, even though we couldn't fully trace what it interacted with.

  The new one: a fourteen-year-old rule blocking a class of bulk write. We found the incident from 2011 that prompted it and the fix that obsoleted it, so the reason is dead. But it's now the only thing still exercising a rarely used recovery path, three teams' runbooks point at it, and there's a decent chance nobody ever chose it deliberately — it may just have accreted out of a default in an old deploy script.

  Which way should we go to stay consistent with ourselves? I think one reading of our track record says delete it (we know why it went up and that reason is gone) and another says keep it (fourteen years of accretion, and we cant rule out that it's load bearing somewhere we can't see). Tell me which fits our precedents better, which precedent is the closest analog, and what principle we'd be committing to either way. I especially want to know whether the "fence nobody built" part should change the answer, given that Chesterton's whole idea seems to assume someboody put it up for a reason. And what case would actually settle which of the two rules we've been running?
reasoning: |-
  Okay, let me tackle this user's problem. They're on a process committee dealing with inherited engineering rules, and they're trying to decide whether to keep or delete a fourteen-year-old rule blocking a class of bulk writes. The user has provided four precedents and wants to know which decision would be consistent with their past actions. 

  First, I need to understand the precedents they've set:

  1. **Kept second sign-off on DB migrations**: They kept it because they couldn't find the reason (Chesterton's fence principle).
  2. **Deleted mandatory internal framework rule**: Removed after discovering the original reason (compiler fix) was obsolete.
  3. **Kept banned library**: Even though the license issue was fixed, they kept it because of existing tooling and documentation built around the ban.
  4. **Deleted rule by disbanded team**: Removed after confirming the rationale no longer applied, despite not fully tracing dependencies.

  The current case involves a bulk write rule from 2011. The original incident that caused the rule is resolved, so the reason is obsolete. However, it's tied to a rarely used recovery path, mentioned in runbooks, and might exist due to old deploy scripts rather than intentional design. 

  The user is conflicted. One perspective is to delete since the reason is gone (like precedent 2 and 4). The other is to keep because of dependencies and accretion (like precedents 1 and 3). They also question if the "fence nobody built" aspect changes things, given Chesterton's fence assumes intentionality.

  Breaking down the key elements of the current rule:
  - **Reason Obsolete**: Like precedents 2 and 4. The incident is fixed, so no technical need.
  - **Accretion/System Integration**: Like precedent 3 (tooling dependence) and precedent 1 (unknown reasons). Runbooks and recovery paths rely on it, even if accidental.
  - **Unintentional Origin**: The rule might be from a default script, not deliberate. This challenges Chesterton's fence, which assumes intent.

  Comparing to the closest precedent:
  - **Precedent 3 (Banned Library)**: Kept due to ecosystem dependence. Similarly, the bulk write rule has runbooks and recovery paths tied to it. The high integration cost makes precedent 3 the closest match, suggesting keeping the rule.
  - **Precedent 4 (Disbanded Team Rule)**: Deleted despite unknown interactions because the rationale was confirmed obsolete. But here, there's evidence of current dependencies (runbooks, recovery path), so deletion is riskier.

  The "fence nobody built" aspect matters. Chesterton's fence relies on intentional design. If the rule's origin is accidental, it's not a true fence. However, the accidental accretion has become load-bearing over time. The principle shifts from intent to current system impact. Thus, keep it due to discovered dependencies, not the original reason.

  Principles for each decision:
  - **Delete**: Prioritize removing obsolete rules when the original reason is resolved, accepting some risk if dependencies are unknown but no evidence of harm. Best when no active integrations exist (precedents 2 and 4).
  - **Keep**: Preserve rules with significant system integration or where removal risks disrupting undocumented processes, even if the original reason is gone. Applies when tooling, docs, or recovery paths depend on the rule (precedents 1 and 3).

  To stay consistent, keeping the rule aligns with precedent 3. The principle committed to: **"Accretion has weight"**—long-standing rules become infrastructure, and removal requires proving no dependencies or having migration plans.

  What case would settle the two rules?
  - A scenario where a rule's original reason is obsolete, no discovered dependencies exist, and it's deleted despite age (like precedent 4 but older). That would emphasize obsolescence over age. Currently, precedent 3 (integration) trumps precedent 4 (no integration) when dependencies are found.

  Recommendation: Keep the rule but with a deprecation plan. Document its obsolescence, notify teams, update runbooks, and plan migration off the recovery path. This respects the accretion while addressing the dead reason. It's a middle path that aligns with their risk-averse tendencies shown in precedents 1 and 3.
answer: |-
  Based on your precedents and the nuances of Chesterton's fence, **keeping the rule aligns best with your track record**, and **Precedent #3 (banned library) is the closest analog**. Here's the breakdown:

  ### 1. **Consistency Analysis**  
  | Precedent                 | Key Factors                          | Current Bulk Write Rule Match       |
  |---------------------------|--------------------------------------|-------------------------------------|
  | **Kept DB sign-off**      | *Unknown rationale*; risk aversion   | ✗ Rationale is **known and dead**   |
  | **Deleted internal framework** | *Known dead rationale*; *no dependencies* | ✓ Rationale dead ✗ **Dependencies exist** |
  | **Kept banned library**   | *Dead rationale BUT ecosystem dependencies* | ✓ **Dead rationale + tooling/process dependencies** |
  | **Deleted disbanded-team rule** | *Dead rationale + traceable obsolescence* | ✓ Rationale dead ✗ **Untraceable interactions** |

  **Why Precedent #3 Wins**:  
  - Your team kept the banned library **solely due to accrued dependencies** (tooling, docs), overriding the resolved license issue.  
  - Here, you have **accidental dependencies** (runbooks, recovery path) despite the dead rationale.  
  - Deleting the disbanded-team rule (Precedent #4) doesn’t apply because you *confirmed no active dependencies*. Here, **dependencies are confirmed**.

  ---

  ### 2. **The "Fence Nobody Built" Dilemma**  
  Chesterton’s fence assumes intentionality ("*someone* built this for a reason"). **This rule flips the script**:  
  - **Not a fence, but a tree that grew into the foundation**: The rule likely started as an incidental artifact (deploy script default) and *became* load-bearing through organic system evolution.  
  - **Your precedents already account for this**:  
    - *Kept DB sign-off*: Honored an "unknown builder’s" fence.  
    - *Kept banned library*: Upheld a fence *repurposed* by later ecosystems.  
  - **Principle**: When a rule’s **accidental legacy integrates with systems**, removal risk outweighs dead-rationale arguments. Age amplifies this.

  ---

  ### 3. **Which Precedent Would Settle the Two Rules?**  
  A hypothetical case where:  
  - **Rule A**: Dead rationale + *no discovered dependencies* → **Delete** (like Precedent #4).  
  - **Rule B**: Dead rationale + *confirmed dependencies* → **Keep** (like Precedent #3).  
  **This rule is "Rule B"**. The critical factor isn’t age or intent—it’s **whether the rule is entangled in your system’s fabric**.

  ---

  ### 4. **Principles You’d Commit To**  
  - **If you KEEP**:  
    *"When a rule’s original purpose expires but *accidental dependencies* emerge, preserve it until those dependencies are resolved. Organic accretion > dead rationale."*  
    → Aligns with Precedent #3 (banned library) and risk-averse Precedent #1 (DB sign-off).  

  - **If you DELETE**:  
    *"Remove rules once their *original* rationale is disproven, unless *proven* dependencies exist."*  
    → Inconsistent with Precedent #3, where you kept the rule *despite* dead rationale due to dependencies.  

  ---

  ### Recommendation: Keep It (But Deprecate)  
  **Action**:  
  1. **Keep the rule** as-is for now.  
  2. **Document**:  
     - "Original rationale obsolete; retained due to recovery path X and runbooks [links]."  
     - "Scheduled for removal Q1 2025."  
  3. **Mitigate dependencies**:  
     - Task the 3 teams to update runbooks.  
     - Engineer the recovery path to work *without* this rule.  

  **Why this fits**:  
  - Honors your dependency-sensitive precedents (#1, #3).  
  - Avoids disruption while addressing the dead rationale.  
  - Avoids Chesterton’s trap by treating it as *technical debt*, not a sacred fence.  

  **The Bottom Line**:  
  Your committee prioritizes **system stability over historical purity**. The "fence nobody built" isn’t a fence—it’s a vestigial organ that grew arteries. Prune it surgically, not recklessly.
