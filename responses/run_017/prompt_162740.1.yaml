prompt: |-
  I'm a senior at a large public high school. This year I've been on the debate team and, separately, doing an independent reading project on assisted dying, which has meant arguing both sides of the question for most of eight months. I keep noticing one shape of argument and I don't have a word for it. I'd be glad of the name if there is one, but what I actually want is to know exactly what I'm looking at, so please don't stop at a label.

  Here is the pattern. Take the number of people who actually use the law once it exists. When that number is small, supporters say: this is mostly reassurance, the safeguards are working, the alarm was overblown. Opponents say: a practice used this rarely cannot be worth the risk of a single mistake. When the number rises, supporters say: at last the people who were suffering in silence are getting what they asked for, and the earlier low figures only showed how many obstacles stood in the way. Opponents say: this is exactly what we warned about, the practice is spreading beyond the group it was supposed to serve. One quantity, moving in either direction, and both sides come away confirmed.

  Second instance, different quantity: how many people withdraw a request for assisted death after they get good palliative care. A high rate means, to opponents, that such requests are unstable and that we would be killing people who would have changed their minds; to supporters, it means the screening is doing its job and those who remain are the settled ones. A low rate means, to supporters, that requests are stable and considered; to opponents, that the screening is a rubber stamp. Again, both directions get claimed.

  Third instance, which I suspect is a different animal: the number of deaths that do not go as intended, where the person takes far longer than expected. Opponents treat anything above zero as decisive. Supporters say the number is too small to carry weight and that we cannot observe the person's experience anyway. Here the disagreement is not about which way the number points but about whether it can be taken at all.

  Last semester I tried to fix this. Before looking at any figures, I asked people on both sides which way the number would have to come out for them to reconsider. Almost no one could answer — not "it would have to be enormous," but no direction at all.

  So my questions. Does this configuration have an established name: an indicator that both sides agree in advance is relevant and that then supports both sides whichever way it comes out? I know about confirmation bias and motivated reasoning and I don't think that is quite it, since those are claims about how people reason toward a conclusion they already hold, whereas what I am describing looks like a property of the number itself — as though, given how loose the surrounding story is, both readings are reasonable. But then I notice the same people praising low numbers in one year and rising numbers years later, which makes me think it is spin after all. Is it a double standard or special pleading, or is that the wrong frame? How is it different from an ordinary disagreement about what follows from a fact, from a slippery-slope argument, and from a claim that is simply unfalsifiable? Is the defect in the reasoners or in the evidence? What property would an indicator have to have in order not to be claimable by both sides, and does the inability to name a direction that would count against you show anything, or only that someone lacks imagination? Please also give me the edges: two cases that look like this one but aren't, and one that is an instance but doesn't look like one. If there is no established term, coin one and define it. Please write in American English.
reasoning: |-
  Okay, this user is a high school senior deeply engaged in debate and an independent study on assisted dying. They've observed a fascinating rhetorical pattern where opposing sides interpret the same data point moving in either direction as confirmation of their existing stance. The frustration is palpable—they're not just seeking a label but a deep structural understanding of why arguments about usage rates, withdrawal rates, and complications in assisted dying laws seem inherently "unfalsifiable" for both sides. 

  Hmm, the core tension here is epistemological: what makes certain metrics "interpretively flexible" while others aren't? The user already recognizes confirmation bias but senses something more systemic at play—a property of the metric itself when embedded in value-laden frameworks. Smart observation. Their failed experiment asking partisans to pre-commit to falsifying conditions reveals how deeply entrenched the interpretive frameworks are. 

  Breaking this down: First-instance metrics (usage rates, withdrawal rates) exhibit symmetrical defensibility because they're proxy measurements for abstract principles (autonomy vs. sanctity of life, procedural rigor vs. accessibility). The numbers don't speak autonomously; they require narrative context that each side supplies post-hoc. The third instance (botched procedures) is asymmetrical because opponents treat it as a bright-line moral failure (deontological) while supporters see it as a utilitarian cost-benefit calculation. 

  Key distinctions needed: This isn't slippery slope (predictive) nor unfalsifiability (untestable), but interpretive elasticity within testable claims. The defect isn't in evidence quality but in how evidence maps onto competing value hierarchies. For an indicator to resist this, it'd need to be a direct measurement of the core moral concern (e.g., "proven coercion incidents" might force consensus—but even then...). 

  Edge cases: 
  - Not the same: Disagreement over GDP growth interpretation (shared value framework, just partisan credit-taking). 
  - Not the same: "Admit when wrong" hypocrisy (simple double standard). 
  - Hidden instance: Climate change arguments where both sides cite the same extreme weather event as "proof" (same structural elasticity). 

  Coining "metric promiscuity" feels right—it captures how these numbers willingly serve multiple narrative masters. User's maturity in spotting this pattern is impressive; they're wrestling with how values precondition facts, which is undergrad-philosophy level insight. Their request for "edges" suggests they want to operationalize this concept in future debates—practical philosophy. 

  Final note: The unanswerable "what would change your mind" question is the tell. It reveals non-empirical foundations. Might subtly suggest they explore moral foundations theory (Haidt) next.
answer: |-
  This phenomenon cuts to the heart of how evidence interacts with deeply held values. It has no single perfect name, but we can dissect it precisely. Let's break it down step by step:

  **The Core Mechanism: Interpretive Elasticity in Framed Evidence**
  This isn't just confirmation bias (seeking confirming evidence) or motivated reasoning (subconsciously tailoring reasoning). It's a structural property of how **proxy metrics** operate within **competing value frameworks**. Key elements:

  1.  **The Proxy Gap:** The measured quantity (e.g., usage rate, withdrawal rate) is an *imperfect stand-in* for the core values in conflict (e.g., autonomy vs. sanctity of life, safety vs. access, genuine need vs. coercion risk).
  2.  **Narrative Flexibility:** Each side possesses a pre-existing, rich narrative explaining *why* their position is correct. This narrative contains multiple causal pathways.
  3.  **Value-Driven Interpretation:** Any movement in the proxy metric can be mapped onto *some* element of their narrative framework. The interpretation isn't driven by the number itself, but by the *overarching value commitment*.

  **Why Both Directions "Confirm" Each Side:**
  *   **For a given metric:** Its movement is ambiguous without a specific, agreed-upon theory linking it *directly* to the core moral/safety question. A low number *could* mean safety *or* inaccessibility. A high number *could* mean acceptance *or* abuse. Each side selects the interpretation aligning with their foundational values.
  *   **The Framing is Looser than the Conclusion:** The *connection* between the specific number and the ultimate conclusion ("the law is good/bad") is elastic, while the *ultimate conclusion* is rigidly held. The evidence doesn't test the core belief; it gets absorbed into it.

  **Distinguishing Features:**
  *   **vs. Ordinary Disagreement about Implications:** An ordinary disagreement might be over *what causes* the number to rise. Here, both sides often *agree* on the fact (e.g., usage rose from 50 to 100), but disagree profoundly on *what that fact signifies* for the core ethical/policy question, precisely because the significance is determined by their prior framework.
  *   **vs. Slippery Slope:** Slippery slope is a *prediction* ("If we allow X, Y will inevitably follow"). This is about *interpreting observed data* post-implementation. A slippery slope argument might *become* part of the narrative used to interpret rising numbers ("See, the slope is slippery!"), but the core phenomenon is the interpretive elasticity of the *current* data point.
  *   **vs. Unfalsifiability:** A purely unfalsifiable claim ("God exists and is undetectable") cannot be tested. Here, the *specific claims about the metric* ("Low usage means safeguards work" vs. "Low usage means it's unnecessary") *are* falsifiable *in isolation*. The problem is that the *overall position* (support/oppose the law) remains unfalsified *by this specific metric* because the narrative can always absorb the data. The core belief is protected by interpretive layers.

  **The Defect: A System Failure**
  The defect lies in the **interaction**:
  1.  **In the Evidence:** Choosing proxy metrics inherently distant from the core values being debated.
  2.  **In the Reasoners:** An unwillingness or inability (often subconscious) to pre-commit to how the metric *should* behave under their theory *and* the competing theory. This protects the core belief from disconfirmation *by this particular evidence*.
  3.  **In the Debate Structure:** Lack of agreement on what specific pattern of evidence would *genuinely challenge* the core position.

  **What Would a "Good" Indicator Look Like?**
  An indicator resistant to this would need:
  1.  **Directness:** Measure the core value conflict as closely as possible (e.g., *proven* cases of coercion leading to death; *proven* cases of unbearable suffering *only* relieved by assisted death - both extremely hard to measure definitively).
  2.  **Unambiguous Directionality:** A clear, pre-agreed theoretical link where movement *only* in one direction supports one side, and movement *only* in the opposite direction supports the other (e.g., if the *only* argument against was "It will cause a net increase in total suicides," then a *decrease* in total suicides would be strong evidence against opponents, while an increase would support them. But opponents rarely stake their *entire* position on a single, unambiguous, measurable claim like this).
  3.  **Falsifiability Anchor:** The core position must be tied to specific, testable predictions about observable outcomes.

  **The "Cannot Name a Direction" Test:**
  The inability of partisans to state what direction of movement *in this specific metric* would challenge their view is highly revealing. It **doesn't** prove they lack imagination. It demonstrates:
  *   Their core belief isn't *dependent* on this metric in a falsifiable way.
  *   The metric serves a *rhetorical* or *reinforcing* function, not a *testing* function for their fundamental position. It's evidence *for*, never evidence *against* (at least, not against the core belief; it might force tactical adjustments).

  **Is it Spin? Double Standard? Special Pleading?**
  *   **Spin:** Yes, in the sense that the *emphasis* and *interpretive frame* applied to the number is chosen for rhetorical advantage.
  *   **Double Standard/Special Pleading:** Yes, but subtly. It's applying *different interpretive rules* to the same type of evidence depending on whether the outcome aligns with their desired conclusion. It's special pleading *for the survival of the core belief* by making the evidence subservient to it.

  **Naming It:**
  *   **Established Term:** The closest established concept is **"Irrefutable Evidence"** (evidence interpreted to always support a position) or **"Ad Hoc Rescue"** (modifying an auxiliary hypothesis to protect a core belief). However, neither fully captures the *symmetrical, bi-directional* nature you observed.
  *   **Coined Term:** **Metric Promiscuity** or **Interpretive Bidirectionality.** Defined as: *The phenomenon where a specific quantitative metric, proposed as relevant evidence within a contested policy or ethical debate, is interpreted by opposing sides as supporting their core position regardless of the direction in which the metric moves, due to the metric's inherent ambiguity as a proxy for underlying values and the flexibility of the supporting narratives.*

  **Your Edge Cases:**
  1.  **Looks Like, But Isn't: Disagreement over GDP Growth.** If GDP grows 3%, Party A says "Our tax cuts worked!" Party B says "Growth *despite* your bad policies shows underlying strength." **Why it's different:** While bidirectional interpretation occurs, GDP growth *is* a relatively direct proxy for economic health (a largely shared value). The disagreement is usually over *causation/credit*, not the *fundamental meaning* of the growth for economic health itself. The core value ("growth is good") is shared.
  2.  **Looks Like, But Isn't: "Admit When Wrong" Hypocrisy.** Politician criticizes opponent for flip-flopping, but does it themselves later. **Why it's different:** This is simple hypocrisy or double standard applied to behavior, not the *interpretation of evidence* within a structured debate framework. It's about inconsistency in applying principles, not the inherent elasticity of evidence interpretation.
  3.  **Is an Instance, But Doesn't Look Like One: Climate Change Impacts.** *Observation:* Increased severe weather events. *Proponents:* "Clear evidence of accelerating climate change impacts." *Skeptics:* "Weather isn't climate; this is normal variation/hype." *Observation:* Lack of severe events in a period. *Proponents:* "Temporary variation; long-term trend is clear." *Skeptics:* "See, no warming crisis." **Why it fits:** The *same type of evidence* (specific weather events or short-term patterns) is interpreted bi-directionally to support the core belief (climate change is urgent vs. climate change is overblown), relying on flexible narratives about variability vs. trend significance. The core disagreement drives the interpretation of the ambiguous proxy (weather for climate).

  **In Summary:**
  You've identified **Interpretive Bidirectionality (or Metric Promiscuity)**. It arises when:
  1.  A contested policy/ethical debate relies on inherently ambiguous proxy metrics.
  2.  Opposing sides hold rigid core beliefs tied to deep values.
  3.  Each side possesses flexible narratives capable of explaining any movement in the metric as consistent with (or even confirming) their core belief.
  4.  The link between the metric and the core value judgment is elastic, not fixed.
  5.  The core belief is protected from being falsified *by this specific evidence*.

  The inability to pre-commit to a falsifying direction for the metric demonstrates that the metric isn't truly testing the core belief; it's serving within a system designed to reinforce it. The "defect" is systemic – it's in the nature of the evidence chosen, the structure of the debate, and the psychological commitment to the core values at stake.
