  For the table, I'll need to be precise:
  - "Bounded rationality as limits" is mostly faithful to Simon, though he emphasized adaptation more than just limits
  - Calling satisficing "maximizing in disguise" is a misstatement - Simon saw them as fundamentally different approaches
  - Linking satisficing to biases conflates Simon with Kahneman/Tversky
