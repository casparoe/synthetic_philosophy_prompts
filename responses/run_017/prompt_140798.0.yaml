prompt: |-
  ok so here's the situation. I'm a junior and I'm giving one of the three-minute public comment slots at our school board meeting next Tuesday, and I'm asking them to stop stalling on the solar thing — the district has had a plan to put panels on the three big school roofs for like two years and every budget cycle they push it another year, and the board president keeps saying it's a sequencing/bond issue but everyone knows the paving contractor who does all their parking lots donates to half of them. The room is going to be maybe forty people, mostly teachers union people and three guys who show up to every meeting to complain about the turf field, and the board sits there and does not react. I want to actually say to their faces that what they're doing is blameworthy, not just that the policy is inefficient.

  the problem is that I'm kind of obviously a hypocrite and everyone there knows it. I fly to Singapore every other summer to see my dad. I drive a 2004 truck that gets maybe 14 miles to the gallon and I refuse to feel bad about it. Last spring I skipped the climate walkout to go to a thing. And a guy from the debate team told me he's going to sign up for the slot after mine and say all of that out loud, and like — he's not wrong, that's the annoying part. Priya says I should confess it in my first sentence so nobody can use it against me later. My other friend says that's just handing the board a reason to stop listening and that "you do it too" is a fallacy anyway so I should ignore it entirely. And someone else pointed out that Nora in the env club is vegan and bikes everywhere and has never flown anywhere, so why doesn't she just give the speech instead. That suggestion made me weirdly annoyed and I don't know if that means it's a bad idea or if it's a good one.

  I've been reading around a bit about standing to blame (my philosophy teacher gave me a handout and I fell into a youtube rabbit hole) and what I think I get is this: there's a difference between saying a decision is wrong and demanding they fix it, versus the thing where you blame someone to their face, which is sort of holding them to a rule in a way that maybe you lose the right to do if you break the rule yourself — and the "you too" reply isn't just a dumb fallacy there, it's pointing at something real about what you're doing when you blame. But also, if you need totally clean hands before you're allowed to blame anyone, then basically nobody who benefits from how things are set up can ever blame anyone, which seems like it would just end up protecting the people with the most power, and that feels wrong too. And I genuinely can't tell whether admitting my own garbage up front earns me anything or whether it's just a performance that makes the speech about me. So: write me the speech. ~3 minutes, something a person could actually say out loud into a microphone in front of their mom, not a philosophy paper with line breaks. It should do something real with this mess instead of dodging it — like, if the honest move is that I can say the decision is wrong and demand they act but I don't get to personally condemn them, or that I have to say it as someone implicated rather than as someone clean, or that I give up the blame and keep the demand, I want the speech to actually take that shape rather than hint at it. Also please don't make it a three-minute apology for my truck, and don't have me smugly announce that hypocrisy is a fallacy, because either one will get me booed by whoever shows up. My mom is recording it, so nothing that'll be unbearable in ten years.
reasoning: |-
  Okay, the user is a high school junior preparing a public comment for a school board meeting. They want to call out the board for delaying solar panel installations, suspecting corruption due to donations from a paving contractor. But they're worried about being seen as a hypocrite because they drive a gas-guzzling truck, fly internationally, and skipped climate events. A debate team member plans to expose this, and friends give conflicting advice on whether to address it upfront.

  The core conflict is about moral standing. The user understands philosophical concepts like "standing to blame" from class—how personal faults affect one's right to condemn others. They need a speech that navigates this honestly without becoming self-flagellating or defenseless against attacks. 

  Key tensions: 
  - **Effectiveness vs. Integrity**: How to demand action while acknowledging their flaws.  
  - **Personal vs. Systemic**: Their individual choices vs. the board's institutional responsibility.  
  - **Emotional Risk**: Avoiding cringe-worthy moments (mom is recording!) while being authentic.

  Their frustration at the suggestion to let Nora (the "perfect" environmentalist) speak instead reveals they care deeply about this issue personally—it’s not just performative. They want agency, not outsourcing.

  Philosophically, they’re wrestling with two truths:  
  1. Hypocrisy *does* undermine moral authority (the "you too" point isn’t entirely fallacious).  
  2. Requiring "clean hands" paralyzes critique, especially when systems advantage everyone unequally.  

  The speech must resolve this by:  
  - Separating personal accountability from institutional duty.  
  - Framing the solar delay as a breach of public trust, not just environmental negligence.  
  - Preempting the hypocrisy critique without centering themselves.  

  Structure thoughts:  
  **Opening**: Name the delay bluntly but pivot quickly to shared stakes. ("We all benefit from functional systems...")  
  **Addressing hypocrisy**: Acknowledge it in one line—not confession, but context. ("My own choices aren’t flawless...") then immediately redirect to systemic responsibility.  
  **Core argument**: Board’s job is stewardship, not perfection. Contracts > carbon footprints.  
  **Close**: Demand action as a stakeholder, not a saint.  

  Avoid:  
  - Over-apologizing (distracts from the issue).  
  - Philosophical jargon ("tu quoque" won’t play well).  
  - Letting the debate teammate’s threat dictate tone (don’t sound defensive).  

  The "unbearable in ten years" note means keeping it principled, not petty. No roasting board members by name.  

  Final angle: The speech isn’t about their right to blame—it’s about the board’s duty to act. The hypocrisy question is a smokescreen; the real issue is delayed solar panels.
answer: |-
  Here's a speech that confronts the board's inaction head-on while honestly navigating your personal contradictions—without letting them derail the core demand. It frames the issue as a breach of public trust (which you *do* have standing to call out) and shifts focus from individual purity to institutional responsibility.  

  **Total Words:** ~410 words (for a comfortable 3-minute delivery)  
  **Core Strategy:** *Acknowledge complexity → Separate personal flaws from systemic failure → Demand accountability as a stakeholder.*  

  ---

  **(Start calm, direct. No flattery.)**  
  "Chairperson, board members: I’m here because for two years, this district has delayed installing solar panels on our schools. Every budget cycle, it’s pushed back—despite a clear plan, despite rising energy costs, and despite our climate crisis. The reason given is ‘sequencing’ or ‘bond capacity.’ But many in this community believe the real reason is inertia, or worse, loyalty to donors who profit from maintaining the status quo.  

  ***(Pause, shift tone slightly—more personal but not defensive.)***  
  "Now, I know I’m not the perfect environmental advocate. I drive an old truck. I’ve flown internationally. I haven’t earned the right to lecture anyone about personal carbon footprints. But this isn’t about personal virtue. It’s about *this board’s* responsibility to our schools and our future.  

  ***(Lean into institutional duty—sharp, clear.)***  
  "You were elected to steward public resources wisely. Solar panels aren’t a symbolic gesture—they’re a practical investment that would save this district thousands in energy costs, money we desperately need for teachers and classrooms. Delaying them isn’t fiscal prudence; it’s fiscal negligence. And when contracts with certain vendors seem to influence that delay? It erodes trust. Trust matters.  

  ***(Make it about collective stakes, not individual blame.)***  
  "We’re all implicated in systems we didn’t create. But you hold power to change one right here. You don’t need perfect personal eco-credentials to approve solar panels—you need professional integrity. To prioritize long-term savings over short-term convenience. To choose transparent bids over backroom loyalties.  

  ***(Direct call to action—concrete and unapologetic.)***  
  "So here’s what I demand: Stop stalling. Commit publicly tonight to fund the solar plan in *this* budget cycle. Release the feasibility study you’ve cited. Prove this delay isn’t about paving contractors or politics, but about what’s best for students.  

  ***(End on shared ground—no performative guilt.)***  
  "I’m not asking you to be heroes. I’m asking you to do your jobs. Our generation will inherit the cost of these delays—not just higher bills, but a broken faith in institutions meant to serve us. Approve the panels. Show us you actually lead."  

  ---

  ### Why this works:
  1. **Preempts hypocrisy without groveling**:  
     - You acknowledge your contradictions in *one sentence* ("I drive an old truck..."), framing them as irrelevant to the board’s public duty. This robs the debate kid’s "gotcha" of its sting.  
     - No apology—just context. It’s not "I’m sorry," it’s "This isn’t about that."  

  2. **Focuses on institutional betrayal, not moral failure**:  
     - The board’s job isn’t to be saints—it’s to manage resources ethically. Highlighting contract ties ("loyalty to donors") and fiscal harm ("fiscal negligence") makes this about *their* actions, not their souls.  

  3. **Demands > Blame**:  
     - You assert your standing as a *stakeholder* ("our generation will inherit the cost"), not a judge. The speech condemns the *delay*, not the individuals—keeping it actionable.  
     - Concrete asks ("fund the plan this cycle," "release the study") force accountability beyond rhetoric.  

  4. **Avoids landmines**:  
     - No philosophy lectures ("tu quoque" isn’t mentioned).  
     - No self-flagellation (your truck gets 14 words, not 14 seconds).  
     - Ends on shared interest ("serve us"), not division.  

  ### What this doesn’t do:
  - **Make it about Nora**: You’re the one calling out the delay—own it. Nora’s credibility doesn’t negate yours; it’s irrelevant to the board’s duty.  
  - **Protect power structures**: By separating personal flaws from systemic fixes, you’re arguing *for* accountability, even in an imperfect world.  
  - **Sound preachy**: Demanding fiscal responsibility and transparency is nonpartisan.  

  **Delivery Tip:** Pause briefly after "But this isn’t about personal virtue." Let the room absorb the pivot. Speak slower on "Prove this delay isn’t about paving contractors." This isn’t an accusation—it’s a challenge to disprove public suspicion.  

  This speech respects the complexity you described while refusing to let nuance become an excuse for inaction. Ten years from now, you’ll be proud you stood up—even with your truck keys in your pocket.
