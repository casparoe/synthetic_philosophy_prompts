prompt: |-
  Right, slightly odd request, but here goes. I'm a journalist — science and ideas, mostly long pieces for magazines — and I'm about six weeks into something on algorithmic risk scores, the kind of thing cities, parole boards and housing offices buy in. I've read far enough into the technical side to know the punchline: the well-known impossibility results say you can't have calibration within groups, equal false-positive rates across groups, and equal false-negative rates across groups all at once, unless the base rates happen to match or your classifier is perfect; and there's a related family of results about individual-fairness conditions of the treat-like-cases-alike kind coming apart from any group-parity condition. Every vendor I've spoken to still says, brightly, that their system is fair.

  So what I want from you is a spec, not a survey. What does a fairness criterion have to do to count as adequate for the thing I actually care about: a procurement contract. Someone in a council office has to write down, in advance, what fair means for a tool that allocates a scarce benefit — say a fixed number of places on a reentry programme, with more eligible people than places — and then has to audit it afterwards. Give me the requirements list, the case behind each one, which are non-negotiable and which are just preferences of one camp, and flag any set of them that can't be jointly satisfied. That last bit is the bit I most want, honestly: if the desiderata turn out to be jointly unsatisfiable, that's the article.

  Four things I keep coming back too and can't get straight, so tell me which of them are real requirements and which are political demands in a maths costume:

  - it shouldn't be satisfiable by levelling down — by making everyone worse off, or by adding noise to the scores, so the statistics match while nobody gains;
  - it shouldn't be satisfiable just by choosing which groups to slice by; if it holds for the two groups named in the contract, it should hold for subgroups somebody names three years later, or at least degrade in a way you can predict;
  - it has to say something about what happens when the tool's own decisions feed back into the rates it was calibrated on;
  - it has to distinguish allocating a burden from allocating a benefit, and say what a hard capacity limit does to the whole question.

  Which of those is load-bearing and which is a prejudice of one camp? Then, briefly — a short paragraph, not a scorecard essay — how the usual families do against the list (error-rate parity, calibration-within-group, the causal or counterfactual approaches), and which single requirement knocks out the most of what people actually sell. No reading lists or citations, I'll do my own reporting. Assume I know the headlines but not the proofs, so plain language and no notation. And write it in American English, yeah? My editor's in New York and she strips out all my -ises anyway.
reasoning: |-
  Okay, the user is a journalist working on algorithmic risk scores, focusing on fairness in procurement contracts. They want a spec for what makes a fairness criterion adequate, especially highlighting conflicts between requirements. They also have four specific points they're struggling with.

  First, I need to unpack their core request: a procurement-ready fairness specification. They want clear requirements, the rationale behind each, which are essential vs. debatable, and crucially—which combinations are mathematically impossible. The impossibility results they mentioned (like the impossibility theorem) are central here. 

  Their four sticking points need direct analysis:
  1. **Leveling down**: Must be non-negotiable. A criterion that rewards making everyone worse off is useless for public policy.
  2. **Subgroup consistency**: Probably non-negotiable. If fairness breaks when you look at finer groups, it’s not robust. This relates to the "omnibus test" idea in fairness literature.
  3. **Feedback loops**: Non-negotiable but tricky. If the tool’s decisions alter future data (e.g., denying reentry programs skews recidivism rates), fairness claims collapse without accounting for this.
  4. **Benefit vs. burden asymmetry**: Non-negotiable. Allocating scarce benefits (e.g., limited program spots) is fundamentally different from imposing penalties. Capacity constraints change the math—fairness shouldn’t mean uniformly worse outcomes.

  Now, structuring the response:
  - **Requirements list**: Start with the absolute must-haves (non-discrimination, no leveling down, subgroup robustness, feedback resistance) vs. negotiable preferences (e.g., strict error-rate parity). Highlight conflicts—especially that you *can’t* have both equal error rates and calibration without perfect prediction or matching base rates.
  - **Their four points**: All are load-bearing, especially leveling down and feedback loops. Subgroup robustness is critical for future-proofing contracts. Benefit/burden distinction is practical—procurement needs to specify which they’re handling.
  - **Vendor claims**: Most fail on subgroup robustness and feedback. "Calibration within groups" is common but collapses under feedback loops or capacity limits. "Error-rate parity" invites leveling down. Causal approaches are theoretically sound but often unimplementable with messy real-world data.
  - **The article hook**: The joint unsatisfiability is gold. Procurement specs often demand incompatible things (e.g., calibration + error parity), letting vendors hide behind math contradictions. The real scandal is contracts writing checks the math can’t cash.

  User’s tone suggests frustration with vendor hand-waving. They’ll want punchy, actionable flaws—e.g., "If your spec requires X and Y, vendors *will* cheat via Z." Emphasize that feedback loops and capacity constraints are where most systems implode post-deployment. No jargon, but no oversimplifying—they know the headlines and want depth.
answer: |-
  Here's a procurement-focused fairness spec, designed for a city council buying a tool to allocate scarce benefits (e.g., reentry program slots), with requirements ranked by criticality and conflicts clarified:

  **Non-Negotiable Requirements (Load-Bearing):**
  1.  **No Leveling Down:** The criterion **must not** be satisfiable by making predictions *worse* for everyone or adding meaningless noise. *Why:* Procurement aims to improve outcomes. A "fair" system that degrades overall utility violates public trust and is operationally useless. *(This is a real requirement; your first point is core).*
  2.  **Subgroup Robustness:** Fairness guarantees must hold for *any legally protected subgroup* (e.g., race, gender, age) definable within the data, not just the broad categories named initially. *Why:* Gaming occurs by redefining groups. If fairness fails for a recognizable subgroup (e.g., "Black women under 30"), the system is discriminatory in practice. Degradation must be quantifiable in the contract. *(Your second point is crucial – it prevents loopholes).*
  3.  **Feedback Loop Resistance:** The contract must specify how fairness will be *audited* on *new data* generated *after deployment*, acknowledging the tool's own decisions alter outcomes (e.g., denying program access may increase recidivism, biasing future data). *Why:* Fairness claims based on pristine historical data are invalid once the tool runs. Audits must account for this dynamic. *(Your third point is essential and often ignored).*
  4.  **Benefit/Burden & Capacity Specificity:** The criterion **must explicitly define** whether it allocates a *benefit* (e.g., program slot) or a *burden* (e.g., parole denial). Crucially, it must account for the **hard capacity limit**. *Why:* Fairness for benefits (maximizing true positives) clashes with fairness for burdens (minimizing false positives). A fixed number of slots fundamentally changes the optimization problem compared to unbounded decisions. *(Your fourth point is vital – capacity limits break naive fairness imports).*
  5.  **Formal Non-Discrimination:** The system must not *directly* use protected attributes (race, etc.) as inputs unless strictly necessary for fairness remediation *and* legally vetted. *Why:* Legal compliance baseline. Avoids explicit bias.

  **Negotiable Preferences (Camp-Dependent):**
  1.  **Specific Parity Metric:** *Which* statistical parity (error rates, calibration, predictive parity) is prioritized involves value judgments about what "fairness" means operationally (equal opportunity vs. equal outcome). *Non-negotiable is requiring the vendor to explicitly state which one(s) they target and why.*
  2.  **Individual Fairness Weight:** How heavily to weight "treat similar individuals similarly" vs. group parity is philosophical. *Non-negotiable is acknowledging the inherent tension with group metrics.*

  **The Impossibility Trap (Your Article Hook):**
  The core impossibility result **makes Requirements 2 (Subgroup Robustness) and the choice of a Specific Parity Metric inherently conflicted.** You *cannot* simultaneously satisfy:
  *   **Calibration within Groups** (Predicted risk = Actual risk for each group)
  *   **Equal False Positive Rates** across groups
  *   **Equal False Negative Rates** across groups
  ...unless base rates are identical *or* the predictor is perfect. Procurement specs demanding all three for multiple subgroups are demanding the impossible. Vendors meeting them are either lying, gaming the groups (violating Requirement 2), or have perfect prediction (unlikely).

  **How Common Approaches Fare Against the Spec:**
  *   **Error-Rate Parity (e.g., Equal FPR/FNR):** Fails **Leveling Down** (can be gamed by random denials), struggles with **Benefit/Burden** (optimizing FPR vs FNR differs), and **impossible** to satisfy fully with **Subgroup Robustness**. Vulnerable to **Feedback Loops**.
  *   **Calibration within Groups:** Fails **Benefit/Burden** under capacity limits (calibration doesn't ensure best candidates get scarce benefits). Can mask discrimination if base rates differ. **Impossible** to combine with full error-rate parity. Highly sensitive to **Feedback Loops** (shifts base rates).
  *   **Causal/Counterfactual Approaches:** Theoretically strong on **Non-Discrimination** and **No Leveling Down**. Often impractical/impossible to implement reliably with real data (strong assumptions). **Feedback Loop** handling is complex. **Benefit/Burden** logic needs explicit integration.

  **Which Requirement Knocks Out the Most Vendors?**
  **Requirement 3 (Feedback Loop Resistance).** Almost no vendors have credible, contractually binding plans for auditing and maintaining fairness *after* deployment when their tool is actively changing the environment and data it was trained on. Their "fairness" claims are typically static snapshots of historical data, ignoring dynamic reality. **Requirement 2 (Subgroup Robustness)** is a close second, as many systems only report on coarse, pre-defined groups.

  **In short:** An adequate procurement spec must demand no leveling down, work for any relevant subgroup, survive real-world feedback loops, and explicitly handle scarce benefits/capacity. Crucially, it must *avoid* demanding mathematically impossible combinations of parity metrics, especially across subgroups – that's where the vendor deception you're seeing becomes inevitable. The feedback loop requirement is where most current systems truly fall apart post-purchase.
