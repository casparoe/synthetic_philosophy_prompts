prompt: |-
  I teach an upper-level undergraduate course in philosophy of medicine. I have one 75-minute session, 18–24 students, and I want them to feel the force of the dispute between naturalist and normativist accounts of health and disease from the inside, before anyone names the two families of view.

  Design a committee simulation in which the class acts as a body deciding what to put in a revised disease classification. Split them into panels of three or four; each panel receives the same dossier of four candidate conditions and a private role card stating an institutional stake (insurer, patient-advocacy group, research funder, occupational-health regulator, disability-rights organisation, textbook editor). Roles are secret and must not be revealed during deliberation.

  Build the dossier so that the naturalist and normativist pulls come apart, using cases I have not been able to find in the literature: (1) a trait present in roughly 70 percent of the population that lowers a measurable capacity relative to the individual's own earlier baseline while remaining statistically typical; (2) a variant that is statistically atypical now and impairs function relative to present peers, but was well suited to the environment most of the population lived in two generations ago and remains so in a sizable minority; (3) a state that causes no distress, no reduced function and no raised mortality by itself, but sharply raises the risk of a serious outcome only in combination with a common and easily avoided behaviour; (4) a condition that degrades one statistically normal capacity while enhancing another, so that net functional contribution is genuinely unclear.

  Each panel files a two-part ballot for every case: first a descriptive judgment about whether there is a departure from normal functioning, then a classificatory judgment about whether it belongs in the manual. Panels also wager points on how the other panels will vote. Give me materials, a scoring scheme with no real money, and a timeline.

  The debrief should map the divergence in ballots onto the two accounts, including the divergence in the supposedly descriptive answers and what that shows about reference classes and levels of functional description. Tell me what will predictably go wrong on a first run and how to handle it, and be honest about which feature of the dispute the game cannot stage and the facilitator has to argue for explicitly.
reasoning: |-
  We are designing a committee simulation for a philosophy of medicine class to explore naturalist vs. normativist accounts of health and disease without naming them. The class will be split into panels, each with 3-4 students, and each panel will have a secret institutional role. They will deliberate on four candidate conditions and vote on each. The conditions are designed to pull apart naturalist and normativist intuitions.

  Materials:

  1. **Role Cards**: Each panel gets one role card. The roles are: 
     - Insurer (wants to limit coverage to clear-cut, objective diseases to control costs)
     - Patient-Advocacy Group (wants to include conditions that cause suffering or disability, even if contested, to secure recognition and resources)
     - Research Funder (wants to include conditions that are biologically distinct and have potential for scientific breakthroughs)
     - Occupational-Health Regulator (focused on conditions that impair work capacity or safety)
     - Disability-Rights Organisation (wants to avoid medicalization of differences that are not inherently harmful and to focus on social barriers)
     - Textbook Editor (wants clarity, consistency, and alignment with current scientific consensus)

     Since there are 6 roles and 6 panels (for 18-24 students: 18->6 panels of 3, 24->6 panels of 4, or adjust to 5-6 panels), assign roles accordingly. If there are more panels than roles, duplicate some roles but note that having multiple panels with the same role can lead to interesting comparisons.

  2. **Dossier**: Each panel receives a dossier with four candidate conditions. The conditions are:

     (1) **Baseline-Lowering Trait (BLT)**:
          - Present in about 70% of the population.
          - Lowers a measurable capacity (e.g., lung capacity, kidney filtration rate) relative to the individual's own baseline (from 10 years ago), but remains within the statistically typical range for the current population.
          - Example: A gradual decline in kidney function that is typical for aging. The individual's current level is still within the normal range for their age group, but lower than their own baseline at a younger age.

     (2) **Environmentally Mismatched Variant (EMV)**:
          - A genetic variant that is statistically atypical now (e.g., present in 5% of the population) and impairs function (e.g., slower metabolism) relative to the current majority environment (high-calorie diet, sedentary lifestyle). 
          - However, two generations ago, when the majority lived in a environment of scarce food and high physical activity, this variant was advantageous (e.g., efficient energy storage). It remains advantageous in a sizable minority (e.g., 15% of the population) that still lives in conditions of food scarcity and high activity.

     (3) **Conditional Risk State (CRS)**:
          - A state (e.g., a genetic polymorphism) that by itself causes no symptoms, distress, or functional impairment, and does not raise mortality. 
          - However, when combined with a common and easily avoided behavior (e.g., eating a specific common food like peanuts or drinking alcohol), it sharply raises the risk of a serious outcome (e.g., anaphylaxis or liver cirrhosis). Without the behavior, the risk is not elevated.

     (4) **Trade-Off Condition (TOC)**:
          - A condition (e.g., a neurodivergent profile) that degrades one statistically normal capacity (e.g., social communication) while enhancing another (e.g., pattern recognition or attention to detail). The net functional contribution is unclear and may depend on the environment.

  3. **Ballot**: Each panel will have a ballot for each condition with two parts:
     - Part A (Descriptive): "Is there a departure from normal functioning?" (Yes/No/Unclear)
     - Part B (Classificatory): "Should this condition be classified as a disease in the manual?" (Yes/No)

     Additionally, for each condition, each panel will wager points on how the other panels will vote on the classificatory question (Part B). Specifically, they will predict the percentage of panels that will vote "Yes" (rounded to the nearest 10%).

  4. **Scoring Scheme** (non-monetary, for in-class competition):
     - For each condition, the panel gets 1 point for each correct wagering prediction (within 10 percentage points of the actual percentage of panels voting "Yes").
     - Additionally, the panel gets 1 point for each condition if their classificatory vote (Part B) matches the majority vote of all panels (this creates an incentive to predict the majority view, which may reflect the institutional pressures).
     - The panel with the highest total points wins.

     Note: The descriptive vote (Part A) does not score points but will be crucial for the debrief.

  Timeline (75 minutes):

  1. **Introduction (5 minutes)**: 
     - Explain the simulation: The class is a committee revising a disease classification manual. They are in panels representing different institutional perspectives (roles are secret). They will deliberate on four cases and vote.

  2. **Panel Formation and Role Assignment (5 minutes)**:
     - Split the class into panels (6 panels for 24 students, 4 per panel; or 5 panels of 4-5 if 20-24? Adjust as needed). Hand out role cards and dossiers.

  3. **Deliberation (35 minutes)**:
     - Panels discuss the four cases in any order. They should aim to reach a consensus on the votes, but if not, they can vote internally and then submit a panel ballot (the majority view of the panel). They also discuss and agree on the wagering predictions for each condition.

  4. **Voting and Collection (5 minutes)**:
     - Each panel submits one ballot per condition (with the two votes and the wagering prediction).

  5. **Tallying and Break (5 minutes)**:
     - The instructor quickly tallies the votes (with help if available) and computes the actual percentage of panels voting "Yes" for each condition's Part B.

  6. **Scoring and Announcement (5 minutes)**:
     - Announce the results for each condition: the actual percentage of panels that voted "Yes" for classification (Part B) and the majority vote for each condition. Then, for each panel, check their wagering predictions (award 1 point per condition if within 10% of the actual) and check if their Part B vote matched the majority (1 point per condition if yes). Announce the winning panel.

  7. **Debrief (20 minutes)**:
     - Map the divergence in ballots to naturalist and normativist accounts. Start by noting that without naming the accounts, they have experienced the tension.
     - Focus on the four cases and the descriptive vs. classificatory votes. Highlight:
          - Case 1 (BLT): Naturalists might say no departure from normal functioning because it's statistically typical (for age), but normativists might see a departure because of the baseline change. However, the role might influence the classificatory vote (e.g., insurer might say no, patient-advocacy might say yes for older adults).
          - Case 2 (EMV): Naturalists might focus on current statistical atypicality and impairment, while normativists might argue that in the environment it was adapted for, it's not a disease. Roles might influence: occupational-health might say yes (impairs work in current environment), disability-rights might say no (it's an environmental mismatch, not a disease).
          - Case 3 (CRS): Naturalists might see a biological abnormality that leads to disease only in specific contexts. Normativists might argue that without the behavior, there's no harm. Roles: insurer might say no (avoidable), patient-advocacy might say yes (to warn people with the trait).
          - Case 4 (TOC): Naturalists might struggle because there's a departure in one function but enhancement in another. Normativists might focus on whether the net effect is harmful in a given context. Roles: disability-rights might be against classification (neurodiversity), research funder might want to classify to study it.

     - Point out the divergence in the descriptive answers (Part A) and what that shows: 
          - The reference class problem: What is "normal"? (e.g., Case 1: normal for age vs. normal for past self; Case 2: normal in current environment vs. in ancestral environment)
          - Levels of functional description: Case 4 shows that focusing on one function versus the whole organism (or in context) changes the picture.

     - Note that the wagering and the role cards introduced normative pressures, which influenced the classificatory votes even when the descriptive facts were agreed upon. This is the normativist insight that values and context matter.

  8. **What predictably goes wrong and how to handle**:
     - **Problem**: Students might not fully embody their roles. 
       - *Handling*: Emphasize the importance of the role and the stakes during instructions. Provide clear role descriptions.
     - **Problem**: Time pressure might lead to superficial discussion. 
       - *Handling*: Keep strict time and encourage panels to move on if stuck. Suggest they spend about 8-9 minutes per case.
     - **Problem**: Panels might not reach consensus and internal disagreement may cause some students to disengage. 
       - *Handling*: Allow panels to take a majority vote if consensus isn't reached. Remind them that the role is for the panel, so they should advocate for their role but then vote as a panel.
     - **Problem**: The scoring might be confusing. 
       - *Handling*: Explain the scoring clearly and provide a sample calculation.

  9. **What the game cannot stage and must be argued explicitly**:
     - The game stages the role of values in disease classification (normativist) and the pull toward biological dysfunction (naturalist). However, it cannot fully capture the naturalist's claim that there is a value-free, biological notion of dysfunction that can be discovered. The naturalist might argue that the descriptive judgment (Part A) should be value-free, but the simulation shows that even the descriptive judgment is influenced by how we define "normal" (which involves reference classes and levels of description that are value-laden). The facilitator must argue explicitly that the naturalist's hope for a purely value-free account might be undermined by the reference class problem and the level of analysis problem, which are highlighted in the cases.

  This simulation should create a memorable experience of the conceptual tensions and set the stage for deeper theoretical discussion.
answer: |-
  ### Committee Simulation: Disease Classification Revision  
  **Objective:** Immerse students in the tension between naturalist (disease as biological dysfunction) and normativist (disease as value-laden harm) accounts without naming them, using novel case studies.  

  ---

  ### **Materials**  
  1. **Role Cards (6 types, 1 per panel; roles kept secret):**  
     - **Insurer:** *Goal:* Minimize coverage costs. Avoid classifying ambiguous/avoidable conditions.  
     - **Patient-Advocacy Group:** *Goal:* Expand recognition of conditions causing suffering. Push for inclusion even if contested.  
     - **Research Funder:** *Goal:* Prioritize biologically distinct conditions with research potential.  
     - **Occupational-Health Regulator:** *Goal:* Focus on impairing conditions affecting workplace safety/productivity.  
     - **Disability-Rights Organisation:** *Goal:* Resist medicalizing non-harmful differences; emphasize social/environmental barriers.  
     - **Textbook Editor:** *Goal:* Ensure clarity, consistency, and alignment with scientific consensus.  

  2. **Dossier (Identical for all panels):**  
     > **Case 1: Progressive Metabolic Decline (PMD)**  
     > - **Trait:** Present in ~70% of adults over 50.  
     > - **Facts:** Reduces metabolic efficiency by 20% relative to the *individual’s own baseline* at age 30, but remains within statistically typical range for current age group. No symptoms or functional impairment reported.  
     > - **Naturalist/Normativist Pull:** Is "normal functioning" defined by population norms (naturalist) or personal baseline (normativist)?  
     >  
     > **Case 2: Ancestral Energy Conservation Variant (AECV)**  
     > - **Variant:** Present in 5% of the population today; was prevalent in 85% two generations ago.  
     > - **Facts:** Causes slower calorie-burning → weight gain/impaired stamina in modern sedentary environments. In physically demanding/rural settings (15% of population), it enhances endurance.  
     > - **Naturalist/Normativist Pull:** Dysfunction depends on environment: statistical abnormality now vs. adaptation in ancestral/minority contexts.  
     >  
     > **Case 3: Asymptomatic Sensitization Syndrome (ASS)**  
     > - **State:** Genetic trait (10% prevalence) causing no distress, functional loss, or mortality alone.  
     > - **Facts:** When combined with alcohol consumption (common, avoidable), it increases liver failure risk 50-fold. Abstaining eliminates risk entirely.  
     > - **Naturalist/Normativist Pull:** Is risk without harm a "dysfunction"? Avoidable harm challenges normativist "unwanted" criterion.  
     >  
     > **Case 4: Sensory Processing Reconfiguration (SPR)**  
     > - **Condition:** Neurological variant (7% prevalence).  
     > - **Facts:** Reduces auditory filtering (difficulty ignoring background noise) but enhances visual pattern recognition. Net impact on daily function is context-dependent (e.g., harmful in open offices, beneficial in visual professions).  
     > - **Naturalist/Normativist Pull:** How to weigh trade-offs? "Normal functioning" requires specifying which capacities matter.  

  3. **Ballot Sheet (Per panel per case):**  
     ```markdown
     Case: [PMD/AECV/ASS/SPR]  
     Part A (Descriptive):  
     ☐ YES - There is a departure from normal functioning.  
     ☐ NO - No departure.  
     ☐ UNCLEAR - Insufficient evidence.  
     
     Part B (Classificatory):  
     ☐ YES - Include in disease manual.  
     ☐ NO - Exclude.  
     
     Wagering (Predict % of panels voting "YES" on Part B): _____% (nearest 10%).  
     ```  

  4. **Scoring Scheme (Non-monetary):**  
     - **Wagering Points:** 1 point per case if prediction is within ±10% of actual % of "YES" votes.  
     - **Voting Points:** 1 point per case if Part B vote matches the *majority vote* across all panels.  
     - **Total Points:** Sum across 4 cases (max 8 points per panel). Winning panel earns "influence points" (bragging rights).  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Setup (5 mins):**  
     - Split students into 6 panels (3–4 students each).  
     - Distribute identical dossiers and **secret role cards**. Emphasize: *"Do not reveal your role—advocate subtly for your institution’s interests."*  

  2. **Deliberation (35 mins):**  
     - Panels discuss all 4 cases (≈8 mins/case). Encourage debate on:  
       - *"Is there a functional departure? What counts as ‘normal’?"*  
       - *"Does this belong in the disease manual? Why/why not?"*  
     - **Facilitator Tip:** Circulate to ensure roles are influencing arguments (e.g., whisper: *"How would an insurer view this risk?"*).  

  3. **Voting & Wagering (5 mins):**  
     - Each panel submits 4 ballots (one per case) with Part A, Part B, and wagering prediction.  

  4. **Tally & Scoring (10 mins):**  
     - Tally votes publicly: Display % of "YES" votes for Part B per case and majority outcome.  
     - Calculate panel scores (wagering + voting points). Announce winner.  

  5. **Debrief (20 mins):**  
     - **Map Divergence to Philosophical Accounts:**  
       - **Part A (Descriptive) Disagreements:**  
         - *Case 1 (PMD):* Naturalists likely say "NO" (statistically normal); normativists say "YES" (departure from *personal* baseline).  
         - *Case 2 (AECV):* Naturalists focus on current dysfunction; normativists note relativity to environment/minority thriving.  
         - **Key Insight:** "Normal functioning" is contested—depends on reference class (population vs. individual, current vs. ancestral environment).  
       - **Part B (Classificatory) Disagreements:**  
         - *Case 3 (ASS):* Insurers may vote "NO" (avoidable harm); patient advocates vote "YES" (preventable risk).  
         - *Case 4 (SPR):* Disability-rights groups resist classification; occupational regulators focus on workplace impairment.  
         - **Key Insight:** Values determine whether biological differences become "diseases," even when facts are agreed upon.  
     - **Predictable Challenges & Fixes:**  
       - **Problem:** Students may ignore roles or conflate Part A/B.  
         *Fix:* Remind them: *"Part A is about facts, Part B is about values—but do facts ever come value-free?"*  
       - **Problem:** Panels may rush to consensus without debate.  
         *Fix:* Assign a "devil’s advocate" in each panel.  
     - **Limitation of the Game:**  
       - **Unstageable Element:** The game cannot simulate the *naturalist claim that biological dysfunction is objective and value-free*. Students will see that even "descriptive" judgments (Part A) involve value-laden choices (e.g., reference classes, functional priorities). **Explicitly argue** in debrief: *"Naturalists must explain why their chosen reference class/functional level is the ‘correct’ one without appealing to values."*  

  ---

  ### **Why This Works**  
  - **Cases:** Designed so naturalist norms (statistical, biological) and normativist values (harm, context) conflict.  
  - **Roles:** Force students to inhabit institutional biases, revealing how values shape classification.  
  - **Debrief:** Uses voting patterns to expose core disputes: reference classes, functional descriptions, and the illusion of "value-free" facts.  

  This simulation creates first-hand experience of classification disputes, setting up deeper engagement with the philosophy.
