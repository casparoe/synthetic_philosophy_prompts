prompt: |-
  Hey — imagine you're the outside reviewer for a small foundation that's decided to spend something like four million dollars over five years on the premise that a society's dominant moral emotion is something you can deliberately nudge, and that guilt is the better one to nudge toward. The board is already sold on that; your job is to tell them which questions to actually buy answers to first, before the money goes out the door, and which parts of their premise are assumed rather than established.

  I dont want a survey of the guilt/shame literature or a reading list. I want a defended ordering: which open questions you'd fund, in what sequence, and why — judged on things like how much of the rest of the program depends on the answer, whether it's answerable in five years by people doing conceptual plus empirical work rather than needing a generation of actual cultural change, and how likely the answer is to change what they'd do with the money. Say explicitly what you'd deprioritize because its answer wouldn't move anything downstream, and what evidence in the first two years would push items up or down the list.

  A few things I keep running into, which you should feel free to tear apart or replace with better ones: (a) the asymmetry that guilt seems to come with an exit ritual — confession, apology, repair — while shame seems to have no discharge at all except concealment or expelling the person, which would make the choice between them really a choice about institutions and rituals rather than about feelings; (b) the worry that guilt is more audience-dependent than it looks, since feeling guilty seems to require an imagined victim or judge, so the story about guilt as the internalized, self-directed, autonomous emotion may be overstated; (c) the possibility that guilt versus shame isn't the load-bearing axis at all — maybe what matters is whether the emotion points at something repairable, or whether it has any exit route, or something else, and the binary is crowding out a third family of responses (indignation, contempt, disgust) that the board should be spending on instead.

  And take the title question seriously: can a culture choose here, or is that a category mistake about how moral emotions change? If you think the whole choose-your-moral-emotion framing is confused, say so and tell them what to fund instead.
reasoning: |-
  Okay, the user wants me to act as an outside reviewer for a foundation planning to spend $4 million over five years to nudge society's dominant moral emotion toward guilt. The board is already convinced this is the right approach, but I need to identify critical questions they should answer before spending the money. The user doesn't want a literature review but a prioritized list of research questions with clear justification.

  First, I need to unpack the foundation's core premise: that societies can deliberately shift their dominant moral emotion, and that guilt is preferable to shame. The user raises several challenges: (a) guilt has repair mechanisms while shame doesn't, (b) guilt might be more audience-dependent than thought, and (c) maybe guilt/shame isn't the key axis at all. Most fundamentally, can a culture even "choose" its moral emotions?

  The user is likely a consultant or advisor to the foundation, possibly with a background in sociology or ethics. They need actionable guidance to prevent wasted resources. Their deeper concern is probably about the feasibility of social engineering through emotion targeting. They might worry the board is oversimplifying complex psychological and cultural dynamics.

  I should structure this around high-stakes questions where wrong assumptions could derail the entire initiative. Priority should go to foundational issues that affect downstream decisions, can be researched within five years, and would significantly alter funding allocation if answered. Each question needs clear "kill criteria" - what findings would make the project untenable.

  Starting with the most fundamental question: Is this kind of cultural nudging even possible? If moral emotions are too embedded in social structures to be deliberately shifted, the project fails immediately. This needs ethnographic and historical analysis - looking at past attempts to manipulate moral frameworks. Kill criteria: evidence that such changes only occur organically or through coercion.

  Next question: Are guilt and shame the right categories? The user mentions this might be a false binary. We need to investigate whether repair potential is the real differentiator, and whether other emotions like disgust are more impactful. Psychological experiments could test this. Kill criteria if repair mechanisms prove unrelated to emotion type.

  Third question: Can institutions reliably induce guilt? Since the foundation plans to work through institutions, we must verify whether schools, legal systems, etc., can actually foster guilt rather than shame. Observational studies of existing programs would help here. Kill criteria if institutions inevitably produce shame despite aiming for guilt.

  Fourth: How does guilt actually function? The user questions whether guilt is truly internalized or requires an imagined audience. This has design implications - if guilt needs social reinforcement, interventions must include community elements. Kill criteria if guilt proves entirely dependent on external surveillance.

  Finally, scaling issues: Can pilot programs be effectively expanded? Without evidence that small interventions translate to societal change, the project fails. Kill criteria if early pilots show no measurable effect or negative unintended consequences.

  Lower priority are questions about long-term stability or comparative societal outcomes - these are important but won't change immediate plans. Also deprioritize refining measurement tools; existing methods should suffice for initial testing.

  Budget-wise, allocate heavily to the first two questions in years 1-2. If those survive, fund institutional studies in year 3. Save scaling research for years 4-5 when pilot data exists. Be ready to pivot entirely if early findings undermine core premises - perhaps toward studying "repairability" regardless of emotion type.

  The key is creating a testing funnel where each stage must validate assumptions before proceeding. This protects the foundation from wasting millions on flawed premises while keeping options open for productive pivots.
answer: |-
  Here’s a prioritized research sequence for the foundation, designed to stress-test their premise and allocate resources efficiently. The goal is **front-loaded validation of core assumptions** before scaling interventions. Budget allocation reflects sequencing (Year 1-2 focus: $1.5M; Year 3: $1M; Year 4-5: $1.5M).

  ### Core Sequencing Principle
  Prioritize questions that could **invalidate the entire premise or strategy** early. Fund questions where **answers directly dictate intervention design** next. Deprioritize questions where answers won’t change actions or require generational change to test.

  ---

  ### Priority 1: **Can Moral Emotions Be Deliberately Nudged at Scale?**  
  *(Years 1-2; $800K)*  
  **Why First?**  
  - **Foundation of the entire project.** If cultural moral emotions *can’t* be deliberately shifted via institutions/rituals, the project fails.  
  - **Answerable empirically:** Study historical/societal cases (e.g., religious reforms, truth/reconciliation commissions, propaganda campaigns) using mixed methods:  
    - *Ethnographic work:* Compare communities where moral emotions shifted rapidly (e.g., post-authoritarian transitions).  
    - *Archival analysis:* Track emotion-language in media/education pre/post-intervention.  
    - *Lab/field experiments:* Test if targeted messaging/rituals alter self-reported emotions in controlled cohorts.  
  **Kill Criteria:** If no evidence of *deliberate* shifts (only organic/coerced change) OR shifts require authoritarian control.  
  **Move-Up Trigger:** Early evidence of rapid, non-coercive shifts → accelerate to Priority 2.  

  ---

  ### Priority 2: **Is "Repairability" the True Lever, Not Guilt vs. Shame?**  
  *(Years 1-2; $700K)*  
  **Why Second?**  
  - **Challenges the guilt/shame binary** (your point "c"). If outcomes hinge on "exit rituals" (repair) not emotion type, interventions must pivot.  
  - **Empirically testable:** Design experiments manipulating:  
    - *Ritual availability:* Offer vs. withhold repair pathways for identical transgressions.  
    - *Emotion framing:* Induce guilt ("You harmed X") vs. shame ("You’re flawed") vs. neutral, while holding repair constant.  
    - Measure behavioral outcomes (reparation, withdrawal, recidivism).  
  **Pivot Potential:** If repairability drives outcomes *regardless* of emotion, refocus on institutionalizing repair rituals (e.g., restorative justice).  
  **Deprioritize if:** Guilt consistently outperforms shame *even when repair is unavailable*.  

  ---

  ### Priority 3: **Can Institutions Induce *Guilt* Without Triggering Shame?**  
  *(Year 3; $1M)*  
  **Why Third?**  
  - **Critical for intervention design.** If institutions (courts, schools, media) inevitably produce shame when aiming for guilt, strategy fails.  
  - **Requires real-world pilots:** Partner with institutions to test "guilt-oriented" protocols:  
    - *Education:* Curriculum emphasizing harm/repair vs. blame.  
    - *Legal:* Restorative justice vs. traditional court.  
    - Measure emotions (self-report, biomarkers), not just behavior.  
  **Kill Criteria:** If institutions consistently provoke shame (e.g., due to public exposure/power dynamics).  
  **Why Not First?** Depends on Priority 2 validating emotion-type matters.  

  ---

  ### Priority 4: **Is Guilt Truly Autonomy-Supporting?**  
  *(Years 3-4; $500K)*  
  **Why Fourth?**  
  - **Addresses your concern (b)** about guilt’s "audience-dependence." If guilt requires an external "judge," it’s not more autonomous than shame.  
  - **Test via psychology/cognitive science:**  
    - *Priming studies:* Does guilt persist without imagined victims/authorities?  
    - *Cross-cultural work:* Compare guilt in individualist vs. collectivist societies.  
  - **Design Impact:** If guilt is externally anchored, interventions must foster *internalized* norms (e.g., moral reasoning training).  

  ---

  ### Priority 5: **Scalability & Unintended Consequences**  
  *(Years 4-5; $1M)*  
  **Why Last?**  
  - Tests *how* to implement, not *whether*. Only relevant if prior priorities validate the approach.  
  - **Focus:** System dynamics modeling, large-scale RCTs in diverse communities, measuring spillover effects (e.g., does reducing shame increase blame of others?).  

  ---

  ### Explicitly Deprioritized Questions  
  1. **"Is guilt always better than shame?"**  
     - *Why:* If nudging isn’t feasible (Priority 1) or repairability dominates (Priority 2), this is irrelevant.  
  2. **"Long-term societal outcomes of guilt-dominant cultures."**  
     - *Why:* Requires generational studies; won’t change 5-year strategy.  
  3. **"Comprehensive taxonomy of moral emotions."**  
     - *Why:* Interesting, but actionable insights are captured in Priority 2 (repairability) and 4 (autonomy).  

  ---

  ### If the Premise Fails: The Pivot  
  If Priority 1 finds **cultures can’t "choose" moral emotions** through deliberate intervention:  
  - **Refocus funding** on studying *how moral emotions interact with institutional design* (e.g., "What institutions maximize opportunities for repair?").  
  - Goal shifts from *nudging emotions* to *designing repair-enabling systems*.  

  If Priority 2 finds **repairability is the key lever**:  
  - **Redirect 80% of funds** to developing/testing "repair rituals" across sectors (e.g., community mediation, institutional apology frameworks).  

  ---

  ### Year 1-2 Decision Triggers  
  | **Finding** | **Action** |  
  |-------------|------------|  
  | No evidence of scalable nudging (Priority 1) | Pivot or terminate |  
  | Repairability > emotion type (Priority 2) | Refocus on repair rituals |  
  | Institutions trigger shame (Priority 3) | Terminate institutional strategy |  
  | Guilt is externally dependent (Priority 4) | Invest in norm-internalization tactics |  

  This sequence forces validation of the project’s foundational logic *before* major spending. By Year 3, the foundation will know if their theory holds or needs radical redesign—saving millions on unviable paths.
