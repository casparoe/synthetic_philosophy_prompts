  - **Unsatisfiable Pair**: D5 (Visitor's Contextual Obligation) and D11 (Export Test Independence) conflict because D5 demands visitor obligations be sensitive to local context (e.g., norms, expectations), while D11 forbids reducing obligations to the export test. Consequentialist theories using the export test to override local context violate D5; non-consequentialist theories risk ignoring D11 if they tie obligations to universalizability.
