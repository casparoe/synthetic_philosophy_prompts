  We are also to identify the most excluding desideratum. This is the one that rules out the most candidate accounts. Desideratum 1 (Separability of Verdicts) is very demanding because it requires a theory to account for three distinct verdicts. Desideratum 11 (Export Test Separation) is also very excluding because it requires a non-consequentialist element or at least a more complex structure.

