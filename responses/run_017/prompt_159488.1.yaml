  ### Adequacy Specification: Desiderata for a Theory of Conventional Obligation

  The following table outlines the core requirements any theory of conventional obligation must satisfy to be considered adequate. Each desideratum is tightly specified to ensure clear falsifiability, with a motivating case illustrating its necessity, the status of the requirement, and what classes of theories it rules out. The specification is crafted in British English as requested.

  | Desideratum | Motivating Case | Verdict | What It Rules Out |
  |-------------|-----------------|---------|-------------------|
  | **Separability of Verdicts** | Queue-jumping that delays no one (permissible) vs. not tipping where wages assume tips (wrong to all) must receive distinct verdicts. | Non-negotiable | Theories collapsing the three verdicts (permissible, obligation-to-participants, wrong-to-all) into fewer categories. |
  | **Empty Jaywalking Permissibility** | Jaywalking on an empty road (statistical risk only) must not be deemed wrong solely due to convention existence. | Non-negotiable | Theories holding that convention existence alone generates obligation, regardless of context. |
  | **Harmless Queue-Jumping Obligation** | Queue-jumping that delays no one must be capable of breaching an obligation to fellow participants, even if materially harmless. | Preference (one camp) | Theories requiring material harm for obligations to arise or denying participant-specific duties. |
  | **Tipping as Exploitation** | Not tipping where wages are set assuming tips must constitute a moral wrong beyond conventional breach. | Non-negotiable | Theories reducing obligations to convention alone, ignoring embedded systemic injustices. |
  | **Visitor's Contextual Obligation** | A visitor from a no-tipping country must have obligations (or exemptions) explicable without blanket uniformity. | Non-negotiable | Theories always imposing identical obligations on visitors or universally exempting them. |
  | **Visitor Exemption by Norm** | When participants routinely exempt visitors (e.g., certain queueing norms), the visitor must not bear obligations. | Non-negotiable | Theories ignoring internal convention norms and imposing obligations rigidly. |
  | **Contested Convention Validity** | A locally contested/recently imported convention (e.g., new jaywalking laws) must generate obligations without requiring stability. | Non-negotiable | Theories demanding long-standing consensus for obligations to arise. |
  | **Non-Compliant Bystander Standing** | A bystander not complying (e.g., demanding queue adherence while jaywalking) must lack standing to demand compliance. | Non-negotiable | Theories granting standing to any affected party, regardless of their own compliance. |
  | **Signalling-Material Distinction** | Queue-jumping with no delay but perceived disrespect must have moral weight distinct from materially harmful breaches. | Non-negotiable | Theories reducing obligations to either signalling or material effects alone. |
  | **Convention-Distributive Separation** | The obligation to tip must be separable from the injustice of the wage system enabling it. | Non-negotiable | Theories conflating convention adherence with endorsement of its distributive outcomes. |
  | **Export Test Independence** | A visitor’s obligation today must not hinge solely on whether universal adoption of their home convention (e.g., no-tipping) would work locally. | Non-negotiable | Theories tying obligations to the "export test" (universal adoption feasibility). |
  | **Free-Riding vs. Non-Compliance** | Not tipping in a wage-assumes-tips system (free-riding) must be distinguishable from harmless queue-jumping (non-compliance). | Non-negotiable | Theories equating free-riding (benefiting unjustly) with mere rule-breaking. |
  | **Convention-Force Distinction** | Jaywalking convention existence must not entail moral obligation without further justification. | Non-negotiable | Theories deriving moral force directly from convention existence. |
  | **Participant Standing Limitation** | Only queue participants, not bystanders, may demand compliance for participant-specific breaches. | Non-negotiable | Theories granting non-participants standing to demand adherence. |
  | **Partial Compliance Functionality** | A convention relying on partial non-compliance (e.g., traffic rules) must generate obligations even if universal adherence would undermine it. | Non-negotiable | Theories requiring universal compliance for functionality or moral force. |

