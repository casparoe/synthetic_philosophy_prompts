prompt: |-
  My co-author and I are drafting a paper on whether everyday conventions — queueing, tipping, jaywalking — generate obligations that are moral rather than merely conventional, and on what a visitor from a place with the opposite convention owes. Before we survey the live accounts, we want an adequacy specification: what a theory of conventional obligation would have to deliver before it is worth arguing about at all. Please write it in British English.

  Give me the desiderata as a table with columns: desideratum | motivating case | verdict (non-negotiable, or a preference of one camp) | what it rules out. Each row should state, in one sentence, the case that makes the requirement bite, and each requirement should be tight enough that a theory could clearly fail it.

  The pressures we want covered, plus any we have missed:

  - Three verdicts must stay separable: that a violation is permissible and owes no one an apology; that it breaches a real obligation, but one owed only to the other participants; and that it is wrong in a way any affected party may complain about.
  - The cases: jaywalking on an empty road where the risk is purely statistical; queue-jumping in a way that delays nobody; not tipping where the worker's wage is set on the assumption that customers do tip; a visitor from a no-tipping country; a convention whose own participants routinely exempt visitors; a convention that is locally contested or recently imported; and a demand for compliance made by a bystander who is not himself complying.
  - Distinctions a theory may not collapse: the existence of a convention versus its having moral force; what participants owe one another versus what non-participants may demand; the wrong of non-compliance versus the wrong of free-riding; what an action signals in that setting versus its material effects; and the convention itself versus the distributive outcome it currently produces.
  - One wrinkle we think is underexplored: some conventions appear to do their work only against a background of partial non-compliance or of foreign non-participation, so an export test — would the visitor's home convention still serve its point if everyone here adopted it? — can come apart from the question of what this visitor owes today. Say what a theory has to do with that.
  - Flag any pair of desiderata that cannot be jointly satisfied; that is the result we most want.

  After the table, return a JSON object with fields: desiderata (an array of objects with keys id, statement, motivating_case, status, excludes), unsatisfiable_pairs (an array of objects with keys ids and why), most_excluding (an object with keys id and why, naming the single desideratum that knocks out the most candidate accounts), and underspecified (an array of strings naming questions the existing literature seems not to ask).
reasoning: |-
  We are drafting an adequacy specification for a theory of conventional obligations. The goal is to list desiderata that such a theory must meet to be worth considering. We are to cover the pressures mentioned and any additional ones we identify.

  The table should have columns: 
  - desideratum (the requirement)
  - motivating case (a one-sentence case that makes the requirement bite)
  - verdict (non-negotiable, or a preference of one camp)
  - what it rules out (what kind of theories or views are excluded by this requirement)

  We must ensure:
  - Three verdicts are separable: permissible (no apology owed), breach of obligation only to participants, and wrong in a way any affected party may complain about.
  - Cases to cover: 
    1. Jaywalking on an empty road (statistical risk only)
    2. Queue-jumping that delays nobody
    3. Not tipping where the worker's wage assumes tipping
    4. A visitor from a no-tipping country
    5. A convention where participants routinely exempt visitors
    6. A locally contested or recently imported convention
    7. A demand by a non-complying bystander
  - Distinctions not to collapse:
    - Convention existence vs moral force
    - What participants owe each other vs what non-participants may demand
    - Wrong of non-compliance vs free-riding
    - What an action signals vs its material effects
    - Convention itself vs current distributive outcome
  - Wrinkle: conventions that function against partial non-compliance or foreign non-participation. The export test (would the visitor's home convention work if adopted here?) may differ from what the visitor owes today. We need to say what a theory must do about that.

  Also, flag any pair of desiderata that cannot be jointly satisfied, and identify the most excluding desideratum (the one that rules out the most candidate accounts).

  After the table, provide a JSON object with:
  - desiderata: array of objects with keys: id, statement, motivating_case, status, excludes
  - unsatisfiable_pairs: array of objects with keys: ids (pair of ids), why
  - most_excluding: object with keys: id, why
  - underspecified: array of strings (questions the literature doesn't ask)

  Let's break down the desiderata. We'll assign an ID to each for reference.

  Desiderata:

  1. **Separability of Verdicts**: The theory must distinguish three verdicts: (a) permissible, no apology owed; (b) breach of obligation owed only to participants; (c) wrong in a way that any affected party may complain about. 
     - Motivating case: Consider queue-jumping that delays no one (case 2) vs not tipping in a wage-assumes-tipping context (case 3). The first might be (a) or (b), the second (c). 
     - Verdict: Non-negotiable.
     - Rules out: Theories that collapse these three categories, e.g., reducing all to social disapproval or all to moral wrongs.

  2. **Empty Jaywalking**: The theory must account for why jaywalking on an empty road (with only statistical risk) may be permissible (or not) without appealing solely to the convention's existence.
     - Motivating case: Jaywalking on an empty road (case 1).
     - Verdict: Non-negotiable (to avoid over-moralizing).
     - Rules out: Theories that hold that the mere existence of a convention generates an obligation regardless of context (e.g., simple conventionalism).

  3. **Harmless Queue-Jumping**: The theory must explain why queue-jumping that delays no one might still be a breach of an obligation to participants, even if not to others.
     - Motivating case: Queue-jumping in a way that delays nobody (case 2).
     - Verdict: Preference of one camp (but we need to allow for the possibility that it is a breach to participants, so the theory must at least be able to capture this verdict if it is the case).
     - Rules out: Theories that require material harm for an obligation to arise, or that collapse the distinction between participants and non-participants.

  4. **Tipping as Wage-Supplement**: The theory must account for the moral wrong in not tipping when the worker's wage is set on the assumption of tips.
     - Motivating case: Not tipping where the worker's wage is set assuming tips (case 3).
     - Verdict: Non-negotiable (as this is a clear case of exploitation).
     - Rules out: Theories that cannot generate obligations beyond the conventional when the conventional practice is embedded in an unjust system.

  5. **Visitor in Tipping Culture**: The theory must explain what a visitor from a no-tipping country owes in a tipping culture.
     - Motivating case: A visitor from a no-tipping country (case 4).
     - Verdict: Non-negotiable (to handle cultural differences).
     - Rules out: Theories that either impose the same obligations on visitors as on locals without exception, or that exempt visitors entirely.

  6. **Exempting Visitors Convention**: The theory must account for conventions where participants routinely exempt visitors.
     - Motivating case: A convention whose participants routinely exempt visitors (case 5).
     - Verdict: Non-negotiable (to respect the practice's internal norms).
     - Rules out: Theories that ignore the internal norms of the convention and impose obligations uniformly.

  7. **Contested Convention**: The theory must handle conventions that are locally contested or recently imported without assuming stability or universal acceptance.
     - Motivating case: A convention that is locally contested or recently imported (case 6).
     - Verdict: Non-negotiable (to account for dynamic or unstable conventions).
     - Rules out: Theories that require a convention to be long-standing and uncontested to generate obligations.

  8. **Non-Compliant Bystander**: The theory must explain why a bystander who is not complying with the convention may not legitimately demand compliance from others.
     - Motivating case: A demand for compliance made by a bystander who is not himself complying (case 7).
     - Verdict: Non-negotiable (to avoid hypocrisy).
     - Rules out: Theories that allow any affected party to demand compliance regardless of their own adherence.

  9. **Signal vs Material Effect**: The theory must not collapse the moral significance of what an action signals in a setting and its material effects.
     - Motivating case: Queue-jumping that causes no delay but signals disrespect (case 2).
     - Verdict: Non-negotiable.
     - Rules out: Theories that reduce obligations to either signaling or material effects alone.

  10. **Convention vs Distributive Outcome**: The theory must separate the convention itself from the distributive outcome it currently produces.
      - Motivating case: Tipping in a system that leads to wage disparities; the obligation to tip might hold even if the system is unjust, but the injustice of the system is a separate issue.
      - Verdict: Non-negotiable.
      - Rules out: Theories that conflate the obligation to follow a convention with the justice of the overall system.

  11. **Export Test Separation**: The theory must account for the possibility that a convention's functionality may rely on partial non-compliance or foreign non-participation, so that the export test (would the visitor's home convention work if adopted here?) is distinct from what the visitor owes today.
      - Motivating case: A visitor from a no-tipping country: even if adopting no-tipping universally in the host country would be better, it doesn't follow that the visitor may ignore the convention now.
      - Verdict: Non-negotiable (to handle the wrinkle identified).
      - Rules out: Theories that tie the obligation of the visitor solely to the export test.

  12. **Free-Riding vs Non-Compliance**: The theory must distinguish the wrong of free-riding (benefiting without contributing) from the wrong of non-compliance (failing to follow the rule).
      - Motivating case: Queue-jumping that delays no one might be non-compliance without free-riding, whereas not tipping in a wage-assumes-tipping system is free-riding.
      - Verdict: Non-negotiable.
      - Rules out: Theories that equate non-compliance with free-riding.

  13. **Convention Existence vs Moral Force**: The theory must not assume that the existence of a convention implies moral force.
      - Motivating case: Jaywalking on an empty road: the convention exists, but does it create an obligation?
      - Verdict: Non-negotiable.
      - Rules out: Theories that derive moral obligations directly from the fact of convention.

  14. **Participants vs Non-Participants**: The theory must account for the difference between what participants owe one another and what non-participants may demand.
      - Motivating case: A bystander (non-participant) demanding compliance from a participant (case 7 and more generally).
      - Verdict: Non-negotiable.
      - Rules out: Theories that grant standing to complain to anyone affected, without regard to participation.

  We also note that some desiderata might be in tension. For example:

  - Desideratum 2 (Empty Jaywalking) and Desideratum 4 (Tipping as Wage-Supplement) might be in tension if a theory must both allow for no obligation in empty jaywalking and a strong obligation in tipping. But they are different cases and a good theory should handle both.

  However, a potential tension might be between:

  - Desideratum 5 (Visitor in Tipping Culture) and Desideratum 6 (Exempting Visitors Convention): 
    - If a convention routinely exempts visitors, then a visitor might not have an obligation. But in tipping, even if the visitor is from a no-tipping country, if the local convention does not routinely exempt visitors, then desideratum 5 might require the visitor to tip. But desideratum 6 says that if the convention exempts visitors, then the visitor is exempt. So they are consistent: the theory must account for both possibilities. 

  - Another tension might be between Desideratum 3 (Harmless Queue-Jumping) and Desideratum 9 (Signal vs Material Effect): 
