  The alarm case might be weakness precisely because the intention survives ("I still want to run") whereas heroin may extinguish the concurrent judgment ("I can't want otherwise right now"). This could explain why they want to call one but not the other weakness.

  For the race case, the solution might hinge on whether dread temporarily obscures their stable preference (weakness to skip) or reflects authentic reevaluation (weakness to run). Since they "never regret running," skipping would likely be weakness.

