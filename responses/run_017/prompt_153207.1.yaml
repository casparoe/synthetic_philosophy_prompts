answer: |-
  Here's a unified account based on your intuitions, structured as requested:

  ### The Principle
  Weakness of will occurs when an agent acts against their **stable, reflectively endorsed judgment** due to the **temporally proximal salience** of a competing motivation, where:  
  (1) The stable judgment represents their considered, longer-term evaluation (not a fleeting state),  
  (2) The competing motivation gains disproportionate influence *because* of its immediacy (not due to a genuine value shift),  
  (3) The agent experiences the action as a **failure of self-governance** (not compulsion or rational adaptation).  
  This requires the stable judgment to remain *active but overridden* during the action.

  ### What Forces Each Clause
  *   **Clause (1) - Stable Judgment:** Forced by your career-change case. Quitting wasn’t weakness because your judgment *shifted* over months; it wasn’t stable and overridden. The cake case *is* weakness because last night’s judgment ("cake not worth it") was stable and reflectively endorsed, even if momentarily eclipsed.  
  *   **Clause (2) - Proximal Salience:** Forced by the tax form and 2am cases. The effort/guilt (tax) or immediate comfort (2am) become overwhelmingly salient *because* the action is imminent, distorting valuation despite stable judgment. Heroin isn’t weakness (vs. alarm) because the craving’s intensity feels like it *erases* judgment (no override), while hitting snooze involves the active judgment ("I *should* get up") being overwhelmed by proximal comfort.  
  *   **Clause (3) - Failure of Self-Governance:** Forced by your precommitment cases. Deleting apps feels rational (successful self-governance). Paying a mate feels "faintly pathetic" (acknowledged vulnerability to weakness, bordering on failure). The 3rd drink is mild weakness because you retain a sense of agency ("I *could* stop for $50"), contrasting with heroin’s spasm-like loss of agency.

  ### Cases I Haven't Listed
  *   **Attention/Belief:** *Avoiding Medical Results:* You stablely judge knowing your test results is best. Yet, when the email arrives, you compulsively refresh social media instead of opening it. Proximal anxiety makes ignorance salient, overriding your stable judgment (Weakness).  
  *   **Novel Action:** *Impulsive Purchase:* After months of research, you stablely judge Brand A is the best car. At the dealership, the sleek look and immediate availability of Brand B make you buy it instead. Proximal allure overrides stable judgment (Weakness).  
  *   **Novel Inaction:** *Silence in Meeting:* You stablely intend to voice a crucial critique in a meeting. When your turn comes, the immediate awkwardness and all eyes on you make you mutter "No concerns." Proximal discomfort overrides stable intention (Weakness).

  ### What I Have to Give Up
  You must give up **one core intuition**:  
  *   **The Alarm Clock Verdict:** On this account, sleeping through the alarm *isn't* weakness of will. Like the heroin case, the judgment ("I should get up") is likely *extinguished* by deep sleep/automaticity upon waking – not actively overridden by a proximal motivation. It’s a failure of *mechanism* (the plan didn’t work), not self-governance.  
  *   **Why Keep the Addict?** The account preserves your heroin verdict (not weakness) by emphasizing Clause 3: the judgment isn’t actively overridden; it’s drowned out or rendered inert by physiological compulsion, feeling like a spasm/loss of agency.

  ### Resolution of Your Race Case (6am dread)
  *   **Skipping is Weakness:** Your stable, reflective judgment (formed over many runs, "never regretted running") endorses running. The proximal salience of dread (immediate comfort of bed) creates a temporary distortion, overriding that stable judgment. It fits Clause 2 (proximal salience of comfort) and Clause 3 (you’d likely experience skipping as a failure of self-discipline). Running *isn't* the failure; it’s adherence to your stable judgment despite proximal aversion.  
  *   **Why it Works:** This parallels the 2am case: a stable long-term preference ("do the paper/run the race") is overridden by the sudden, intense salience of an immediately available alternative ("watch show/stay in bed") precisely when action is required. The temporal proximity of the "cost" (effort/dread) is key.
