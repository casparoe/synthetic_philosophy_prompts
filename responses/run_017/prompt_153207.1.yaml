  While preserving their core intuitions about addicts (not weakness) and alarms (weakness)

  Key insights from their cases:
  1. Proximity matters but isn't solely about physical distance (tax vs cake)
  2. Self-concept seems relevant (career change involves deep reevaluation)
  3. Regret patterns differ (never regretting runs vs immediately regretting hangovers)
  4. There's a gradient from "pathetic" to rational precommitments
  5. Involuntariness alone doesn't determine weakness (alarm vs heroin)

  Their examples suggest weakness might involve:
