prompt: |-
  I've got a 45-minute guest slot with a university effective-altruism group -- mostly econ and CS undergrads who've absorbed a fair bit of utilitarianism and just take it for granted that when you say something is wrong you're stating a fact thats either true or false. I need them to feel the Frege-Geach problem, not be told about it. So dont explain the problem to me; plan how I should explain it.

  What I want: what has to be in place in the first ten minutes before the problem can even look like a problem (my worry is they'll hear 'expressivism' as relativism and then everything slides), the order the pieces have to come in and what depends on what, and one scenario to carry the whole session. Not the usual 'if stealing is wrong then getting your little brother to steal is wrong' chain, which they'll just nod along to. Tell me what the carrying case has to have and what it has to lack -- I'm guessing it needs an occurrence of the moral sentence where nobody in the room is endorsing it, and it has to be about something harmless enough that no one derails into arguing the first-order ethics.

  Then the misconception map. The ones I expect: 'so expressivists have to deny modus ponens', 'the fix is just to give moral sentences truth conditions after all', and someone saying isnt this just about people from different cultures disagreeing. Where in the sequence do I head each off, and is there one I should actually let someone say out loud first and then work with?

  One wrinkle I want in but dont know where to put: 'its probably wrong to X'. If saying 'X is wrong' is expressing an attitude rather than describing a state of affairs, its unclear what it even is to be 30% confident that X is wrong -- and that feels to me like a sharper version of the embedding worry than the conditional version, since confidence looks like it has to be in something proposition-shaped. Is that a mid-session pivot, a closing example, or a trap I should stay out of in 45 minutes?

  And finally: one question to end on that would show me they've got the problem rather than memorised the slogan, plus what I should flat-out refuse to get into at this level.
reasoning: |-
  Okay, the user is preparing a 45-minute session for a university EA group. The attendees are econ and CS undergrads who are steeped in utilitarianism and see morality as factual. The main goal is to make them feel the Frege-Geach problem without just explaining it. They want a plan that avoids the usual examples and addresses potential misconceptions.

  First, I need to break down the key elements. The user wants the first ten minutes to set up the problem properly. The participants likely equate expressivism with relativism, which could derail things. So, the initial phase must clearly differentiate expressivism from relativism. Using a non-moral example might help, like taste preferences, to show that expressing attitudes isn't about objective truths.

  Choosing the right scenario is crucial. The user mentioned avoiding the stealing example. A harmless, non-controversial case like "cheating at solitaire" could work. It's trivial enough that no one will debate the ethics, and it allows embedding moral sentences in different contexts. The scenario needs to include an unendorsed use of a moral sentence to highlight the problem.

  The misconception map includes three main issues: expressivists denying modus ponens, the solution being truth conditions, and cultural disagreement. Each needs addressing at specific points. For modus ponens, the session should demonstrate that expressivists can preserve logic without truth values. The truth conditions misconception can be tackled by showing that adding truth doesn't solve the embedding issue. Cultural disagreement should be separated early to avoid confusion with relativism.

  The user also mentioned the wrinkle of probabilistic statements like "probably wrong." This is a stronger embedding issue because confidence implies a proposition. Including this as a mid-session pivot could deepen the problem after establishing conditionals. It forces students to confront why confidence needs an object, highlighting the challenge for expressivism.

  Ending with a question that tests understanding is essential. Instead of asking for the problem's definition, a question like how expressivists handle disagreements in belief contexts would reveal if they grasp the core issue. The user should avoid diving into technical solutions or other metaethical theories to stay focused.

  Putting it all together: Start with taste analogies to introduce expressivism vs. realism. Use the solitaire scenario to present embedded contexts. Address conditionals and modus ponens, then introduce the probability angle. Debunk misconceptions as they arise. End with the application question. Timing each section ensures coverage within 45 minutes.
answer: |-
  Here’s a battle-tested plan to make the Frege-Geach problem *land* for your audience. The key is forcing them to confront the *mechanics* of moral language before they realize it’s a metaethical puzzle.

  **Core Goal:** Make them viscerally feel the tension between "moral judgments express attitudes" and "moral language behaves logically like factual statements."

  **The Carrying Case: Cheating at Solitaire**
  *   **Why it works:**
      *   **Harmless & Uncontroversial:** No one will passionately argue *for* cheating at solitaire. It sidesteps first-order debates.
      *   **Clear Attitude Expression:** Saying "Cheating at solitaire is wrong" clearly expresses disapproval/dislike of the act. Easy to grasp expressivism here.
      *   **Embedding Potential:** Easily embedded in conditionals, disjunctions, beliefs, probability, etc.
      *   **Lacks:** High emotional stakes, cultural baggage, complex consequences.
  *   **The Scenario:** "Imagine Alex, a friend of yours. Alex is generally honest but has this quirky habit: they *love* playing solitaire, but they *always* cheat. They peek at the next card, move cards they shouldn't, you name it. They do it purely for their own amusement, alone in their room. It affects no one else, not even their own skill development (they don't care)."

  **The Sequence (45 Min Breakdown):**

  1.  **Min 0-5: Setting the Expressivist Stage (Without Saying "Expressivism")**
      *   "When Alex says 'Cheating at solitaire is *awesome*!', what's Alex doing?" (Elicit: Expressing enthusiasm, liking it, approving of it).
      *   "When you say 'Cheating at solitaire is *pointless*', what are *you* doing?" (Elicit: Expressing dismissal, disapproval of its value).
      *   **Crucial Move:** "And when *you* say 'Cheating at solitaire is *wrong*', what are *you* doing?" *Force them to analogize.* They'll say: Expressing disapproval, condemning it, saying they dislike it. **Write: "Moral Sentence = Expresses Attitude (Disapproval)"**.
      *   **Head Off Relativism Immediately:** "Is this just about personal preference? Well, Alex *likes* it, but *I* think it's wrong. Does that mean we're *both* right? Or is one of us *mistaken*?" Get a quick show of hands. Most will say "mistaken." Acknowledge: "Yeah, when we disagree morally, it *feels* like we're disagreeing about *something real*, not just stating preferences. We'll come back to that feeling." *(This acknowledges the intuition for realism without endorsing it yet).*

  2.  **Min 5-10: Introducing the Wrinkle - Unendorsed Use & Simple Embedding**
      *   **The Key Setup:** "Now imagine Ben. Ben *doesn't* cheat at solitaire. He thinks it *is* wrong. He says to Alex: '**If cheating at solitaire is wrong, then you shouldn't do it.**'"
      *   **Focus:** "What is Ben expressing in the *first part* of his sentence: '**Cheating at solitaire is wrong**'? Is Ben expressing *his own* disapproval *right now*?" (No! He's stating it as a fact Alex should accept. He's not *re-expressing* his disapproval; he's *using* the moral claim conditionally).
      *   **Contrast:** "Ben *believes* cheating is wrong, but in this *if-clause*, he's not *expressing* that disapproval *at this moment*. He's putting the *idea* of its wrongness into a logical structure." **Write: "Embedded Moral Sentence = ???"**
      *   **The Problem Emerges:** "If moral sentences fundamentally just express attitudes... what is *that part* of Ben's sentence doing? What attitude is Ben expressing *by saying the 'if' part alone*? It seems like... nothing? But it clearly *means* something vital to the whole sentence!"

  3.  **Min 10-20: Deep Dive into Conditionals & Modus Ponens (The Core Problem)**
      *   **Activate Logic Chops:** "Ben's statement is a conditional: **If P, then Q.** (P = 'Cheating is wrong', Q = 'You shouldn't do it'). Alex *accepts* Q ('I shouldn't do it')? Probably not, but Alex *might* accept the logical connection: 'Yeah, *if* it *were* wrong, I *shouldn't* do it. But it's not wrong!'"
      *   **The Frege-Geach Punch:** "Now, Ben argues: 'Look Alex, you accept: (1) **If cheating is wrong, then you shouldn't do it.** (2) **Cheating is wrong.** (That's what *I* believe!). Therefore, (3) **You shouldn't do it.**' This is classic Modus Ponens. Seems airtight, right?"
      *   **Expressivist Challenge:** "But hold on! According to our 'express attitude' idea:
          *   (2) 'Cheating is wrong' = Ben *expressing his disapproval*.
          *   (1) The *if-clause* 'Cheating is wrong'... what attitude is expressed *there*? (Reinforce: None! It's just part of the logical structure).
          *   (3) 'You shouldn't do it' = Ben *expressing a command/strong disapproval* directed at Alex.
      *   **The Rub:** "Modus Ponens requires the *same meaning* for P in both (1) and (2). But in (2), P *expresses an attitude*, while in (1), P *doesn't express any attitude* – it's just a component. How can they be the *same* P? How can the logic work if the meaning of P *changes* depending on where it appears? This is the Frege-Geach problem: **How can moral sentences express attitudes in simple assertions but also function identically in logically complex contexts where they *aren't* expressing that attitude?**"

  4.  **Min 20-30: Probabilistic Confidence Wrinkle (Sharpening the Embedding)**
      *   **Pivot:** "Let's make it harder. Imagine Chloe. Chloe is unsure. She says: '**I think it's probably wrong to cheat at solitaire, but I'm not certain.**'"
      *   **Probe:** "What is Chloe expressing with '**it's probably wrong**'? Is she expressing *probable disapproval*? What does '30% disapproval' even *mean*? Attitudes seem all-or-nothing (boo/hooray!), but confidence is gradable."
      *   **The Point:** "Confidence ('probably', '30% sure') looks like confidence *in a proposition* – in a *thing that could be true or false*. It's hard to make sense of being 30% confident *in an attitude*. This highlights the embedding problem even more sharply: **To embed in probability contexts, moral claims *need* to act like truth-apt propositions, not just expressions of feeling.**"

  5.  **Min 30-40: Misconception Map & Active Defense**
      *   **Misconception 1: "So expressivists have to deny modus ponens?"**
          *   **When/How:** Arises naturally after step 3. "No! Good expressivists *don't* want to deny logic! That would be crazy. They desperately *want* to explain how (1) and (2) use 'wrong' with the *same meaning* so modus ponens works, *while* keeping the core idea that moral language expresses attitudes. That's the *whole challenge* they're trying to solve! Saying they deny logic is a misunderstanding of the problem they're grappling with." *(Emphasize: The problem is preserving logic + expressivism, not choosing one).*
      *   **Misconception 2: "The fix is just to give moral sentences truth conditions after all?"**
          *   **When/How:** Likely arises when the embedding/probability feels too strong. "That's one solution - realism! But remember *why* people were drawn to expressivism in the first place? The motivating idea: moral judgments feel action-guiding and attitude-expressing in a way 'grass is green' isn't. Realism has to *explain* that motivational 'oomph'. Expressivists think adding 'truth' doesn't automatically solve that. The deeper Frege-Geach challenge is: **Can you build a logic and semantics for moral language using *only* attitudes and their interactions?** Not just slapping 'true' on it, which might feel like giving up on the expressivist insight." *(Frame it as a challenge to build an alternative system, not a surrender).*
      *   **Misconception 3: "Isn't this just about people from different cultures disagreeing?" (Relativism Redux)**
          *   **When/How:** Hopefully headed off in Step 1, but might resurface. "No, this problem hits *even if everyone agrees*! Imagine Ben and Alex both think cheating at solitaire is wrong. Ben *still* says 'If it's wrong...'. The embedding problem exists *within* a single speaker's consistent moral framework and language. It's about *how language works logically*, not about disagreement between people." *(Reiterate the unendorsed use within one person's argument).*

  6.  **Min 40-45: Consolidation & The Revealing Question**
      *   **Summarize:** "So, the Frege-Geach problem isn't about whether stealing *is* wrong. It's about how words like 'wrong' *function* in our language. If they fundamentally express attitudes in simple assertions (Boo!), how do they manage to play by the rules of logic – appearing in 'if' clauses, 'probably' statements, 'believes that...' contexts – where they *aren't* actively booing, yet seem to carry the same core meaning needed for reasoning? How can 'boo!' slot into a logical machine designed for 'true/false'?"
      *   **The Revealing Question (DO NOT ask "What is the Frege-Geach problem?"):**
          *   **Ask:** "Imagine someone says: '*Ben believes that* cheating at solitaire is wrong, *but* he doesn't disapprove of it at all.' Does this statement make sense? Why or why not? **How would an expressivist explain the oddness here, and why is this a *different* challenge from the conditional case we started with?**"
      *   **Why it works:** It tests if they see that:
          1.  The expressivist *must* link belief to attitude (making the statement odd).
          2.  This belief context is *another* embedding problem, distinct from conditionals but stemming from the same core issue (meaning stability across contexts).
          3.  It moves beyond memorization to applying the logic/attitude tension to a new structure.

  **What to FLAT-OUT REFUSE to get into (Time & Level):**

  1.  **Specific Expressivist Solutions (Gibbard, Blackburn, Schroeder):** "That's how modern expressivists *try* to solve it, but it gets very technical very fast. For now, just feel the *size* of the hole they're trying to fill."
  2.  **Deep Dives into Truth-Conditional Semantics:** Avoid explaining possible worlds, T-sentences, etc.
  3.  **Other Metaethical Theories (Error Theory, Constructivism):** Don't let the session become a survey. Stay laser-focused on *this* problem arising *from* an expressivist starting point.
  4.  **Solving the Problem Yourself:** "My goal today isn't to solve this centuries-old puzzle, but to make sure you *feel* why it's such a fascinating and difficult puzzle for anyone who thinks morality is about more than just describing facts."
  5.  **First-Order Moral Debate:** "Remember, whether cheating at solitaire *is* actually wrong isn't the point today. We're philosophers of language right now!"

  **Key to Success:** Be relentless about the *linguistic mechanics*. Constantly ask: "What is this *part* of the sentence *doing*? What attitude is expressed *here*?" Make them see the language itself as the puzzle. The solitaire case provides the neutral ground to do this. Good luck!
