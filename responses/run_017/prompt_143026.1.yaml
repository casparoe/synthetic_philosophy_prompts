prompt: |-
  I chair the allocations committee of a foundation that pays out about four million dollars a year in four quarterly rounds. Four of us meet for one afternoon; our recommendation then goes to a lay board the next morning, so the whole thing has to be runnable in about three hours by people who are not specialists (I have some graduate training in philosophy, the others have none). Our disagreements are not empirical: we agree on what the money would do. They trace to which moral outlook each of us half accepts — two of us lean toward impartial concern for everyone affected, one toward duties and side-constraints that refuse to aggregate, one toward the claim that what matters is who is worst off and whether anyone falls below a decent minimum. Our credences across these outlooks and their variants are diffuse; no single outlook has more than about a third, and one member refuses to attach numbers at all.

  Two procedures have already been voted down, and I need one that avoids both failures. The first — follow whichever outlook currently has the highest credence — was rejected because our credences drift between rounds and the board does not want last year's payout to have been decided by a ranking that has since changed. The second — score each candidate payout on each outlook and take an expectation across credences — was rejected because the scoring step is where the decision is really made: converting each outlook's verdicts onto a common scale looks like a technical fix that silently settles the substantive question of how much of one outlook's concern counts compared to another's.

  Please write me a procedure that my committee could actually run, and that is explicit about the following. How to construct the shortlist of candidate payouts and the list of outlooks, including what to do with near-variants that share a single underlying intuition and would otherwise be counted as independent support. How to get from each outlook's verdicts to something comparable without pretending there is a common currency: say what normalization rule you recommend, what it assumes, and how we should check whether the ranking it produces is an artifact of that rule. What to do with an option that is nearly worthless on every outlook we take seriously but very valuable if a low-credence variant is correct — whether we hedge toward it, how much, and how we keep that hedge from swallowing the budget. Whether any part of the budget should go to reducing our moral uncertainty itself, given that the value of such work is itself outlook-dependent. What to do when a member will not give numbers. Where the procedure stops with a no, and where it hands the question to the board on the grounds that it is a values question and not a technical one.

  One further constraint, which the board imposed and which I think is the hardest part. Any recommendation must be presentable: it has to be statable as a reason that a donor who accepts only one of our outlooks could recognize as a genuine reason, though not a conclusive one. A bare expected-value calculation that no such donor can see the force of will be sent back to us.

  Then apply the procedure to three proposals now on our table: a large grant to a well-evidenced program preventing a parasitic disease, which is cheap per life improved and looks best to the aggregating outlooks; a grant funding impact litigation to enforce a legal right on behalf of a small and badly off group, which looks best to the side-constraint and threshold outlooks; and a small speculative grant aimed at reducing a poorly understood long-run risk, worth little on most outlooks and enormous on a long-horizon variant we credit at about eight percent. At least one of the three should come out somewhere the committee will not like. Finally, tell me what the procedure cannot do — in particular, whether it can be trusted to pick itself, since our choice of procedure looks like one more decision we are making under the same uncertainty.
reasoning: |-
  Hmm, the user chairs an allocations committee for a foundation distributing $4 million annually. They need a decision-making procedure that handles moral uncertainty among committee members with different ethical outlooks. The existing approaches failed for specific reasons: credence drift makes the "highest credence" approach unstable, while the "expected value" method masks substantive value trade-offs as technical scoring.

  The committee has three distinct moral perspectives: (1) impartial aggregation (prioritizing overall welfare), (2) deontological constraints (focusing on rights violations regardless of scale), and (3) sufficientarianism (preventing people from falling below minimum thresholds). Credences are diffuse, with no single outlook commanding over 33% support, and one member refuses quantitative estimates.

  Key constraints include:
  - Must produce donor-legible justifications (each recommendation should make sense from any single outlook's perspective)
  - Avoids hidden value judgments in normalization
  - Handles "long-tail" options valuable only under low-credence variants
  - Addresses whether to fund moral uncertainty reduction
  - Accommodates the non-quantitative member
  - Clearly demarcates technical vs. value decisions

  The immediate test involves three proposals:
  A. Parasitic disease prevention (strong for aggregators)
  B. Impact litigation (favored by deontologists/sufficientarians)
  C. Speculative risk reduction (only valuable under 8%-credence long-term view)

  The solution needs to pass four design tests:
  1. Avoid credence drift sensitivity
  2. Prevent normalization from deciding outcomes
  3. Handle low-probability high-stakes cases without over-allocating
  4. Produce "presentable" justifications

  Additionally, the procedure must be executable in ≤3 hours by non-specialists and explicitly account for:
  - Shortlist construction
  - Outlook/variant grouping
  - Comparability without common currency
  - Normalization assumptions/robustness checks
  - Hedge management for outlier options
  - Moral uncertainty reduction funding
  - Non-quantitative member integration
  - Decision boundary between committee and board

  The meta-question about self-applicability (can the procedure select itself?) is particularly thorny since the choice of decision method is itself subject to the same moral uncertainty.

  For the three proposals, the procedure should generate at least one counterintuitive outcome to demonstrate it doesn't just rubber-stamp preferences. The parasitic disease case is strongest for aggregators but weakest for rights-focused views; litigation is strong for thresholds/rights but inefficient for aggregators; the speculative grant has massively asymmetric payoffs but very low probability.

  The normalization challenge is central. Any scaling (e.g., 0-100) implicitly weights outlooks by their score ranges. The solution must either avoid normalization entirely or use a method that makes its value assumptions explicit and checkable. The "presentability" constraint means the final recommendation can't just be "this had the highest expected score" - it needs a narrative justification that resonates with each outlook's core concerns.

  For the non-quantitative member, a qualitative assessment framework is needed that still feeds into the final decision. The hedge management for option C requires capping exposure to outlier bets. On funding moral uncertainty research - since the value of such work depends on the outlook itself, it might need separate treatment.

  The self-selection problem is profound: if we're uncertain about moral frameworks, how can we confidently choose a procedure to resolve that uncertainty? This may require acknowledging that the procedure choice is a value-laden board-level decision.
answer: |-
  Here’s a **Multiplex Justification Procedure (MJP)** designed for your constraints. It avoids normalization artifacts, handles credence drift, delivers presentable justifications, and explicitly flags value judgments for the board. The core innovation: **separate candidate evaluation from justification synthesis**, using *shared thresholds* to bypass direct comparison of outlooks.

  ---

  ### **Procedure Summary**
  1. **Shortlist & Outlook Setup** (45 mins)  
  2. **Threshold Screening** (60 mins)  
  3. **Justification Bundling** (45 mins)  
  4. **Hedge & Uncertainty Allocation** (15 mins)  
  5. **Final Recommendation** (15 mins)  

  ---

  ### **Step-by-Step Protocol**
  #### **1. Constructing Shortlists & Outlooks**  
  - **Candidate payouts**:  
    - Start with 8–12 proposals pre-screened for feasibility/evidence (staff-prepared).  
    - Committee adds 1–2 "wildcard" options per round (e.g., speculative grants).  
    - Final shortlist: **5–7 candidates** (manageable in 3 hours).  

  - **Moral outlooks**:  
    - Define **3 core outlooks** (Aggregating, Side-Constraint, Threshold).  
    - **Group variants**: Treat minor variants (e.g., "long-horizon Thresholdism") as sub-arguments under parent outlooks. No independent credence—they strengthen/reasonably extend the parent.  
    - **Non-quantitative member**: They assign verbal labels (e.g., "Strong," "Weak," "Neutral") per outlook. Converted as: Strong = 80%, Weak = 20%, Neutral = 50% for calculations.  

  #### **2. Threshold Screening (No Normalization)**  
  - **Per outlook**, set two thresholds:  
    - **Minimum acceptability**: "Would we regret *not* funding this if this outlook is correct?" (Binary: yes/no)  
    - **High impact**: "Does this produce outstanding results under this outlook?" (Binary: yes/no)  
  - **No scoring**: Avoids artificial scaling. Focuses on whether a proposal meets each outlook’s *own* standards.  
  - **Output**: Each candidate gets a "profile" of thresholds met (e.g., "A: Min-Agg, High-Threshold").  

  #### **3. Justification Bundling (Comparability without Currency)**  
  - **Rule**: A candidate is **recommendable** if it meets:  
    - Minimum acceptability for ≥2 outlooks, **OR**  
    - High impact for ≥1 outlook *and* no outlook actively opposes it.  
  - **Why this works**:  
    - Doesn’t weight outlooks against each other. Tests for *overlapping support* or *non-opposition*.  
    - **Robustness check**: Shuffle outlook definitions slightly (e.g., "Is long-horizon variant still under Thresholdism?"). If ranking changes, flag it for board input.  

  #### **4. Hedge & Moral Uncertainty Allocation**  
  - **Hedging low-credence bets**:  
    - Cap speculative grants (e.g., Proposal C) at **≤5% of round budget** ($200K).  
    - Only fund if: (a) It has *some* support from a core outlook variant, and (b) Its failure wouldn’t sink a core mission.  
  - **Funding moral uncertainty reduction**:  
    - Allocate **≤2% of annual budget** ($80K) to research clarifying outlooks (e.g., philosophy/empirical ethics grants).  
    - Justification: All outlooks agree unresolved uncertainty risks misallocation.  

  #### **5. Final Recommendation & Board Handoff**  
  - **Automatic "no"**: Candidates failing all minimum thresholds.  
  - **Board handoff**: If two candidates are tied (same threshold profile), or if robustness check fails.  
  - **Presentable justification**: For each funded proposal, state:  
    > *"This grant addresses [Issue X], which [Outlook 1] identifies as a high-impact priority and [Outlook 2] finds minimally acceptable. While [Opposing Outlook] might prioritize differently, this action aligns with common ground among our core perspectives."*  

  ---

  ### **Application to Current Proposals**
  Assume:  
  - **Proposal A**: Disease prevention ($2M).  
    - Aggregating: **Min + High** (saves many lives cheaply).  
    - Threshold: **Min** (lifts many above suffering threshold).  
    - Side-Constraint: **Neutral** (no rights violation addressed).  
  - **Proposal B**: Impact litigation ($1.5M).  
    - Side-Constraint: **Min + High** (upholds rights for oppressed).  
    - Threshold: **Min + High** (group is far below minimum).  
    - Aggregating: **Weak Min** (helps few expensively).  
  - **Proposal C**: Speculative risk reduction ($500K).  
    - Threshold (long-horizon variant): **High** (avoids civilizational collapse).  
    - Aggregating/Side-Constraint: **No min** (negligible short-term impact).  

  **Procedure outcome**:  
  1. **Proposal A**: Recommendable (Min for Agg + Threshold).  
  2. **Proposal B**: Recommendable (Min/High for Side-Constraint + Threshold).  
  3. **Proposal C**:  
     - Fails core threshold (only variant supports it).  
     - But eligible for **hedge cap**: Funds at ≤$200K (5% of $4M round).  

  **Committee’s "disliked" result**:  
  - **Proposal A funded at $2M**, but Side-Constraint member objects: *"This ignores rights!"*  
  - **Justification**: *"While not a rights-based intervention, this grant meets minimal standards for improving welfare (Aggregating) and relieving severe suffering (Threshold). The rights-focused allocation (Proposal B) is also funded."*  

  **Final allocation**:  
  - Disease prevention: **$2.0M**  
  - Impact litigation: **$1.5M**  
  - Speculative risk: **$0.2M** (hedge)  
  - Moral uncertainty research: **$0.08M**  
  - **Remaining $220K**: Held for next round (no tie/board handoff needed).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Self-selection**: The MJP *cannot* impartially select itself. Choosing a procedure requires aggregating outlooks—precisely what it avoids. **Solution**: Adopt MJP provisionally for 1 year, then review using board-wide values discussion.  
  2. **Perfect utilization**: Some funds may idle if no candidate clears thresholds. This is a feature—forces high consensus.  
  3. **Reconciling deep conflicts**: If two outlooks have mutually exclusive minima (e.g., "Fund abortion access" vs. "Defund it"), MJP deadlocks and refers to board.  
  4. **Precision trade-offs**: Doesn’t quantify "how much better" A is than B for Aggregators. It asks only "Does it clear your bar?"  

  ---

  ### **Why This Meets Your Constraints**  
  - **Credence drift-proof**: Uses thresholds, not credence rankings. Changes in outlook strength don’t alter past decisions.  
  - **No normalization**: Thresholds are outlook-specific binaries. No common scale.  
  - **Hedge contained**: Speculative grants capped at 5%; moral research at 2%.  
  - **Non-quantitative member**: Labels map to thresholds (e.g., "Strong" = High impact).  
  - **Presentable justifications**: Each grant speaks to *specific outlooks’ priorities*, not an opaque average.  
  - **Value judgments flagged**: Robustness checks and ties sent to board.  

  **Final note**: MJP embraces "reasonableness" over optimization. It funds what multiple outlooks can live with—making disagreements visible but actionable. For your committee, it turns paralysis into a structured, time-bound conversation about shared minima.
