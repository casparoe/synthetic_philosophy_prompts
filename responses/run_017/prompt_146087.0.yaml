prompt: |-
  hey — I'm a software engineer, no philosophy or social-science background beyond whatever I pick up on the side, so please keep this concrete and don't send me to any literature. I got nerd-sniped by cliodynamics a while ago and there's one question I keep going in circles on, and I want an actual number with the reasoning behind it, not "it depends."

  Background as I understand it, so you know where I'm coming from (only correct me if something here is load-bearing): Turchin-style structural-demographic theory explains the long "secular cycle" in pre-industrial agrarian societies — growth, then stagnation, then crisis and collapse, roughly two to three centuries end to end — with a few interacting pieces: population growth outrunning wages and immiserating the masses; elites multiplying faster than elite offices and elite incomes, so you get elite overproduction and intra-elite infighting; and state fiscal crisis once revenues fall while payrolls and military costs keep climbing. There's also a shorter fathers-and-sons cycle of roughly two generations riding on top of the long one.

  Here's the counterfactual I want a credence on. Take a society of the general kind this theory was built for, and give it institutions that specifically block elite overproduction: every office, title, and the rents attached to them is non-hereditary, filled by open examination, and the total number of such positions is capped and auto-scales with population (say one per five thousand heads), so the queue of qualified aspirants per opening stays roughly flat; officeholders can't buy land or pass wealth to kin; and the exam is randomized enough that coaching doesn't buy you a slot. Population pressure, harvest failures, war, fiscal stress, all of it works the way it normally does.

  The proposition: if we had five hundred years of decent quantitative data from that society and ran the same kind of analysis on it, we would still recover a long cycle with the same sort of period and comparable amplitude to the real historical cases, driven by the population-immiseration and state-fiscal channels on their own.

  My own credence is around 0.3, but I've definately never been able to defend that number, so give me yours, decomposed into something like:

  - the probability that population pressure plus fiscal crisis on their own are enough to produce a two-to-three-century oscillation of that amplitude — i.e. that elite overproduction isn't actually doing most of the work in the standard story;
  - the probability that the institutions I described really block elite overproduction for five centuries, rather than elites routing around them: informal patronage networks, capture of the exam curriculum, quietly marrying into land anyway, converting office into local power and then seceding from the fiscal system;
  - the probability that "a cycle with the same period and comparable amplitude" is even a well-defined thing to go looking for here, given that these models are full of lags and negative feedbacks, and in my experience any dynamical system with a delay in it will oscillate if you poke it — so cycle-shaped data might be very cheap evidence for the specific mechanism;
  - whatever other term you think belongs and I've missed.

  Give each term a number and one line of justification, say how you're combining them into the headline credence, then tell me which single term your final number is most sensitive to and what one piece of evidence or argument would move it the most. And if you think the counterfactual doesn't hold together — e.g. a society built like that probably stops being agrarian, or stops being extractable, within a couple of generations — say so and tell me how much that's dragging your number down.
