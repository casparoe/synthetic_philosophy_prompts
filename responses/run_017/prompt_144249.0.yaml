prompt: |-
  Hey — I'm in a seminar right now (third-year, joint ethics/epistemology thing) and there's something I keep doing that I don't have a word for, and I don't think it's quite the thing we spent the first two weeks on. We went round and round on whether you can get a moral view just from someone telling you — the case everyone uses is you ask a friend whether eating meat is wrong, they say yes, now you believe it, and there's something fishy-feeling about that and everyone had a different story about why. But that's not my case. My case is that I go to someone about something I'm genuinely stuck on and I really don't want them to tell me what to do. What I want them to tell me is which bits of the situation matter. Concretely: my roommate borrowed my bike without asking and it came back dented. I didn't want anyone to tell me whether I was allowed to be annoyed or whether I should say something. What I wanted to know was whether it counts for anything that she'd probably have assumed I'd say yes, or that the dent was small, or that she's done it before and I never complained — like, are those the load-bearing facts here or not? Once a friend told me which of those to actually look at, I could see the answer myself, it stuck, and I could still argue for it a week later. When someone just hands me the verdict, I believe it for about a day, then it evaporates, I can't defend it, and I'd be embarassed to repeat it at dinner as my own view.

  It also happens with labels rather than facts. A friend was getting needled by her lab group and thought it was just banter; I said something like that's not banter, that's hazing, and the whole shape of what she should do changed, and it didn't feel like she'd taken my word for anything at all. And sometimes what I get given isn't features or a label but a move — ask yourself how you'd feel if you found out from someone else — and that does more work than any verdict would have. A couple of us argued about this after class and couldn't get clear on what's even being transferred.

  So: is there a name for this? Specifically for taking someone's word about which considerations are relevant, or about how to describe the situation, as opposed to taking their word about what to do. And more importantly, is it actually a different phenomenon or the same one in disguise — because whether intent matters here looks to me like a moral question too, so why doesn't deferring on that feel like the fishy case, and does the answer depend on whether I also defer on the verdict? What are the nearest established concepts and how does mine differ from each (I've heard terms floating around — moral perception, moral expertise, thick concepts, that kind of neighbourhood — but I can't tell which if any is the right one, or whether it's just a version of the thing we did in week one). And where's the edge: is it different if what I'm deferring on is a plain fact like whether he actually knew; is it different if I get the frame but still can't get myself to a verdict; is it different if the person I'm asking has no better judgment than me and just has more vocabulary? I'm not after a label or a reading list, I want the carving — what exactly is being handed over in each case, and why only one of them feels borrowed.
reasoning: |-
  Okay, let me try to unpack this user's question. They're in a seminar on ethics and epistemology, and they've noticed a pattern that isn't quite covered by their discussions on testimonial knowledge in morality. The seminar focused on whether you can get a moral belief just from someone telling you—like if a friend says eating meat is wrong, and you believe them. But the user's experience is different. They don't want someone to tell them what to do; instead, they want help identifying which aspects of a situation are morally relevant. 

  The user gives concrete examples: their roommate borrowing the bike without permission and it coming back dented. They didn't want someone to say whether they should be annoyed or confront the roommate. Instead, they needed someone to point out which facts mattered—like the roommate's assumption of permission, the dent's size, or past instances. Once those relevant factors were highlighted, the user could reach their own conclusion, which stuck with them. In contrast, when someone just gives a verdict, it doesn't last.

  Another example involves labeling: a friend being needled in a lab group was framed as hazing rather than banter. That reframing changed how the friend saw the situation without feeling like she was taking someone's word for it. Also, sometimes a "move" is given, like asking how you'd feel if you heard about the situation from someone else. The user and their peers can't pinpoint what's being transferred here.

  The user wants to know if there's a name for this phenomenon—deferring on relevant considerations, descriptions, or moves instead of verdicts. They also wonder if this is fundamentally different from the initial testimonial knowledge case. Even though identifying relevant factors seems like a moral question itself, deferring on that doesn't feel "fishy" like the initial case. They question if it's different when deferring on plain facts, or when the advisor isn't more knowledgeable but just has better vocabulary.

  I need to recall relevant philosophical concepts. Terms like moral perception, moral expertise, thick concepts, and salience come to mind. The user mentioned these but isn't sure which fits. Thick concepts (like hazing) combine description and evaluation, which seems relevant to the labeling example. Moral salience involves recognizing which features matter, which aligns with the bike scenario. The "move" example sounds like a cognitive heuristic.

  The key difference from testimonial knowledge might be that the user isn't outsourcing their judgment but getting tools to apply their own. When someone points out relevant factors, the user engages in moral reasoning themselves, leading to deeper understanding. Whereas a verdict bypasses that process, so the belief doesn't stick. The advisor's role is more like a guide than an authority.

  The user also asks about edge cases. If deferring on a plain fact (like whether the roommate knew), that's straightforward testimonial knowledge. But if it's about the relevance of that fact, that's salience. If getting the frame doesn't lead to a verdict, it might still be helpful but incomplete. And if the advisor only has better vocabulary, it might still work if the labels help reframe the issue, though expertise could affect reliability.

  Underlying all this might be the user's need to understand how moral understanding is built. They value autonomy in judgment but recognize the need for external input to clarify perspectives. The unspoken need could be a desire for a framework that respects their agency while acknowledging the role of others in moral development. They might also be seeking validation that their approach is legitimate within ethical discourse.
answer: |-
  What you're describing is a fascinating and **fundamentally distinct phenomenon** from the "fishy testimonial transfer" case you started with. It's not just a disguised version of that problem; it operates on a different level and involves a different kind of epistemic/moral assistance. Let's carve it up:

  1.  **The Core Phenomenon: Deferring to *Salience*, *Framing*, or *Heuristics*, not Verdicts**
      *   **What's Being Handed Over:** You're not asking for a moral conclusion (`P` is wrong/right). You're asking for help with *structuring* or *perceiving* the moral landscape itself:
          *   **Salience:** Identifying *which features* of the situation are morally relevant/exculpatory/aggravating ("Does her assumption matter? The dent size? Past silence?"). This is about **filtering the morally significant data points**.
          *   **Framing/Labeling:** Providing the *conceptual category* that best fits the situation ("It's hazing, not banter"). This is about **applying the right conceptual lens**.
          *   **Heuristics/Moves:** Offering a *cognitive procedure* to generate insight ("How would you feel hearing this from a third party?"). This is about **supplying a reasoning tool**.

  2.  **Why It Feels Different & Isn't "Fishy" Like the Verdict Case**
      *   **Preserves Agency & Reasoning:** The core work of *applying* the salience, frame, or heuristic to *reach your own conclusion* remains yours. You aren't outsourcing your judgment; you're being given better tools *for* your judgment. This is why the conclusion "sticks" – you *own* the reasoning path.
      *   **Enables Perception, Not Bypasses It:** The advisor helps you *see* the situation more clearly or completely. They highlight aspects you missed or misjudged the weight of. This is closer to **moral perception enhancement** than moral testimony.
      *   **Builds Internal Resources:** Learning *why* certain features matter (salience), how concepts apply (framing), or how to probe your intuitions (heuristics) equips you for future, similar situations. A verdict gives you one answer; this gives you a method.
      *   **The "Fishiness" Threshold:** Deferring on *which features count* (salience) or *what concept applies* (framing) *does* involve deferring on a normative/moral question. The crucial difference is **granularity and proximity to action**:
          *   A verdict (`You should be angry`) is a direct prescription for belief/action.
          *   Salience/Framing (`The key features are X, Y, Z` / `This is an instance of Hazing`) provides *input* for your deliberation. It's one step removed from the final "So what?". It feels less fishy because it respects your capacity to *use* that input autonomously.

  3.  **Established Concepts & How Yours Differs**
      *   **Moral Testimony (The "Fishy" Case):** Deferring on the *final moral verdict* (`P is wrong`). **Your case is distinct:** You defer on *inputs* or *tools* for *reaching* the verdict, not the verdict itself.
      *   **Moral Perception:** The capacity to directly "see" moral features in the world (e.g., seeing an act *as* cruel). **Your case relates closely:** The advisor is *facilitating* your moral perception by highlighting salient features or providing the correct conceptual frame (`hazing` makes the cruelty perceptible). It's **mediated moral perception** or **perceptual scaffolding**.
      *   **Moral Expertise:** Possessing superior moral knowledge/judgment. **Your case clarifies *how* expertise often helps:** True moral experts aren't just verdict dispensers; they excel at identifying salience, applying nuanced frames, and selecting useful heuristics. You're accessing *this aspect* of expertise, not just their conclusions.
      *   **Thick Concepts:** Concepts that fuse description and evaluation (e.g., `courageous`, `cruel`, `hazing`). **Your framing case is a direct application:** Providing the thick concept (`hazing`) instantly restructures understanding by bundling descriptive and evaluative content. Deferring on *which thick concept applies* is different from deferring on a thin verdict (`that's wrong`).
      *   **Moral Salience:** The phenomenon where certain features of a situation stand out as morally relevant. **This is the core of your "bits matter" case.** You're seeking help *recognizing* salience.
      *   **Deliberative Heuristics:** Rules of thumb for moral reasoning (`What if everyone did that?`, `The Veil of Ignorance`). **Your "move" case is exactly this:** You're given a practical reasoning tool.

  4.  **Carving the Edges: Your Specific Questions**
      *   **Deferring on Plain Fact (`Did he know?`) vs. Salience/Framing:**
          *   *Plain Fact:* This is standard empirical testimony. Deferring on this is generally unproblematic epistemically and morally (assuming the source is reliable). It's a *premise* for your reasoning.
          *   *Salience/Framing:* Deferring on *whether his knowing is morally relevant* or *how to frame his action given that he knew* is normative. It's the *structure* for your reasoning. **Crucial Difference:** The plain fact is a *datum*; the salience/frame tells you *what role that datum plays* in the moral equation. The latter involves trusting the advisor's normative sensitivity.
      *   **Getting the Frame/Salience but No Verdict:**
          *   This is still valuable! It means the advisor has given you the conceptual tools to see the situation clearly, but the *application* or the *weighting* of factors remains complex or ambiguous *even with clear perception*. You might see the relevant features (`hazing` is clear) but still struggle with the appropriate *response* (confrontation? report? leave?). The frame/salience hasn't failed; it's done its job of clarifying the nature of the problem. The remaining uncertainty is inherent to the complexity of the situation or conflicting values.
      *   **Advisor has No Better Judgment, Just More Vocabulary:**
          *   **Vocabulary (Framing/Labeling):** If they *accurately* apply a thick concept or label (`hazing`), it *can* still be transformative, even if they aren't deeply wise. The power often lies *in the concept itself*. Applying the right label restructures cognition. However, an unwise person might apply the *wrong* label or concept, leading you astray.
          *   **Salience/Heuristics:** If they lack good judgment, their suggestions about what features matter or which heuristic to use are likely to be poor or misleading. The value here depends heavily on the advisor's actual normative sensitivity, not just vocabulary. A fool with a fancy term is still a fool.

  **Conclusion & The "Borrowed" Feeling:**

  *   **What's Being Handed Over:** **Normative scaffolding** – tools to enhance your own moral perception and reasoning (salience, framing, heuristics).
  *   **Why Verdicts Feel "Borrowed":** When you take a verdict, you adopt a conclusion *without* necessarily integrating the reasoning or perception that supports it. It's external and detached from your understanding. It feels like wearing someone else's clothes.
  *   **Why Scaffolding Doesn't (Usually):** The scaffolding helps *you* see and reason. The conclusion you reach using it feels like *yours* because you actively engaged with the clarified landscape using the provided tools. It feels like being given a map and compass and then navigating yourself, rather than being told "Go that way."
  *   **Is it Different? Absolutely.** While deferring on salience/framing involves trusting normative judgment, it trusts it at a *foundational* level – helping you build your *own* justified verdict, rather than handing you a pre-built (and potentially unstable) verdict. It's the difference between learning *how* to identify edible plants versus just being handed a pre-packaged meal. The former builds lasting capacity; the latter satisfies only temporarily.

  You're tapping into a crucial aspect of how moral understanding develops: not through passive reception of answers, but through guided refinement of perception and reasoning tools. This is often the *more valuable* kind of moral assistance.
