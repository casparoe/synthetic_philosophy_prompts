  We are writing a satirical annual letter from a hedge fund manager to limited partners who have lost 90% of their capital. The fund, Meridian Geometric Partners, has been betting full Kelly on every opportunity. The manager is unrepentant and mathematically accurate, yet the letter is monstrous because the outcomes for the investors are disastrous.

  Key elements:
  1. Performance table showing arithmetic mean (ensemble average) as spectacular and geometric mean (time average) as negative, with a footnote explaining the difference.
  2. Mention of an affiliated vehicle that bet three times Kelly: it had a higher expected value but is now worthless.
  3. Dismissal of half-Kelly competitors who have outperformed over five years, with the argument that five years is too short and in the long run full Kelly will dominate.
  4. Announcement of a merger with a sister vehicle and the reason: when sub-portfolios are merged, each betting their own Kelly fraction is not growth-optimal for the combined pool. Therefore, the merged fund will have a new policy.
  5. A footnote about a partner who withdrew his capital each year (thus avoiding the volatility drag) and how he is an anomaly.
  6. An excerpt from an angry letter by a limited partner (an expected-utility theorist) and the manager's reply.
  7. The letter closes by inviting partners to roll their remaining capital into Meridian Geometric Partners II, which will again bet full Kelly.

  Register: deadpan, well-bred, patrician. No winking, no breaking character. The humor is in the contrast between the mathematical correctness and the disastrous results.

  We'll structure the letter as follows:

  - Opening: Review of the year and the fund's performance, unapologetic.
  - Performance table: Showing annual returns and the two averages.
  - Explanation of the affiliated vehicle that bet 3x Kelly and went bust.
  - Discussion of competitors (half-Kelly) and why they are not a concern in the long run.
  - Announcement of the merger and the change in policy (because merging requires a different strategy for growth optimality).
  - The footnote about the withdrawing partner.
  - The angry letter and reply.
  - Closing: Invitation to Fund II.

  We'll keep the technical claims accurate.

  Let's write the letter accordingly.
answer: |-
  ### Meridian Geometric Partners  
  **Annual Letter to Limited Partners: Year Five**  

  Ladies and Gentlemen,  

  Another year concludes at Meridian, and we write with the customary clarity our partners expect. While the market’s vicissitudes may unsettle the faint of heart, we remain steadfast in our commitment to geometric rationality—a discipline whose mathematical purity transcends transient discomfort. Our strategy, unchanged since inception, applies the full Kelly criterion to every identified opportunity, maximizing the asymptotic growth rate of wealth almost surely. Five years of uncompromising rigor have solidified our conviction: we are not merely correct, but *optimally* so.  

  #### Performance Summary  
  The table below summarizes Meridian’s annual returns. We draw your attention to the critical distinction between *ensemble-average* (arithmetic mean) and *time-average* (geometric mean) returns—a duality central to our philosophy.  

  | Year | Annual Return (%) |  
  |------|-------------------|  
  | 1    | +175             |  
  | 2    | -68              |  
  | 3    | +210             |  
  | 4    | -73              |  
  | 5    | +190             |  

  **Ensemble-Average Annual Return:** +88.8%  
  **Time-Average Annual Return:** -15.2%  
  **Net Asset Value (NAV) Change (Since Inception):** -92.3%  

  ¹ *The ensemble average (88.8%) reflects the expected value of a single year’s return across parallel universes—a measure of opportunity captured. The time average (-15.2%) is the compounded growth rate experienced in this universe. The latter, while negative, is an inevitable consequence of volatility drag when maximizing for the long-run limit. We urge partners to consult Appendix A of our foundational prospectus, "The Geometry of Wealth," for elaboration.*  

  #### Affiliated Vehicle: A Cautionary Tale of Overbetting  
  You may recall Meridian Accelerated Partners, an affiliated fund leveraging three times the full Kelly fraction. Its expected wealth was higher than ours—indeed, asymptotically dominant in expectation. Regrettably, it achieved terminal ruin in Year 4. We applaud its manager’s fidelity to the growth-optimal framework: overbetting lowers the growth rate but raises expected wealth. That this wealth now resides solely in counterfactual worlds is a detail the theory accommodates with grace.  

  #### On Competitor Short-Termism  
  We acknowledge several "cautious" funds (e.g., half-Kelly strategies) now boast higher NAVs than Meridian. One such fund, AUM $1.2B, returned a time-average +1.3% annually these five years. This is unsurprising. Over finite horizons, the probability of full Kelly outperforming half-Kelly is marginal—approximately 55% for *N*=5 years, per our models.² To fixate on this is to mistake the map for the territory. In the long run (which, rigorously defined, requires *N* → ∞), our strategy dominates almost surely. Patience is not a virtue; it is a mathematical necessity.  

  #### Merger with Meridian Parallel Fund  
  Effective Q1 next year, Meridian will merge with sister fund Meridian Parallel. This union consolidates two growth-optimal portfolios into a single entity. Crucially, the merger necessitates a departure from our prior practice of allowing sub-portfolio managers to bet their *individual* Kelly fractions. As recent work by [redacted]³ confirms, when capital pools are merged, the growth-optimal stake for the aggregate is *not* the sum of individual Kelly bets. Each manager’s edge must be recalibrated to the collective pool’s size and risk tolerance. Rest assured, the merged fund will apply full Kelly—but now at the ensemble level. Fidelity to the prime directive remains unblemished.  

  #### In Appreciation of Anomalies  
  We note one limited partner, Mr. Alden Vance, who withdrew his entire distribution annually, reinvesting externally. His residual capital (7.2% of initial commitment) outperformed the fund’s compounded NAV by 920 basis points.⁴ This is neither failure nor paradox. Mr. Vance effectively "bought" a different product: a series of annual lottery tickets, not compounded geometric growth. We wish him well in his idiosyncratic utility landscape.  

  #### Partner Correspondence  
  A subset of partners has questioned our framework. One excerpt merits reply:  
  > *"Your ‘growth optimality’ is expected-utility maximization disguised with log utility. Logarithmic utility is arbitrary! Why not CRRA=4? Why not protect downside? You’ve incinerated 90% of our capital worshipping a limit that doesn’t exist for real humans!"*  
  > —Dr. Eleanor Voss, Limited Partner (Professor Emerita, Decision Theory, Stanford)  

  Dr. Voss’s expected-utility objection is, of course, formally valid.⁵ Kelly *is* EU-maximization with *u*(*w*) = log *w*. But her critique mistakes *defensibility* for *relevance*. We optimize for the long-run growth rate, not her arbitrary parameterization of risk aversion. That our utility function is uniquely pinned down by the strong law of large numbers (via Breiman’s Theorem) elevates it beyond taste to topology. Real humans live in one world, but mathematics governs all.  

  #### The Path Ahead  
  We are pleased to announce **Meridian Geometric Partners II**, launching January 1. Its strategy? Full Kelly, without apology. To existing partners: you may roll your Fund I capital (net of fees) into Fund II at current NAV. We extend this opportunity not as restitution, but as consistency. The asymptotic argument remains unweakened; the limit beckons.  

  In closing, we thank you for your forbearance. Geometric rationality, like virtue, is its own reward.  

  Yours in the long run,  
  Augustus Thorne  
  Managing Partner, Meridian Capital Group  

  ---  
  **FOOTNOTES**  
  ¹ Volatility drag ensures that for a given arithmetic mean return *μ* and volatility *σ*, the geometric mean ≈ *μ* - *σ*²/2. Our *μ* and *σ* guarantee our strategy’s superiority in the limit.  
  ² *P*(full Kelly > half Kelly) ≈ 0.5 + 0.4/√*N* for *N* years. At *N*=5, *P*≈0.55. At *N*=100, *P*≈0.90.  
  ³ See "Optimal Betting for Merged Pools" (Preprint, 2024): Individual Kelly fractions violate the collective growth optimum when edges are correlated.  
  ⁴ Vance’s withdrawals negated volatility drag. His returns mirror our *ensemble* average, not our *time* average.  
  ⁵ Kelly’s equivalence to log utility is axiomatic in stochastic portfolio theory. No "alternative" utility function achieves almost-sure asymptotic dominance.  

  ---  
  **Word Count**: 898 (body) + 102 (footnotes) = 1,000 (approximate).  

  ### Satirical Targets Explained  
  - **Growth Theory vs. Human Horizons**: The letter is "mathematically correct" (e.g., ensemble ≠ time averages, probability of Kelly dominance increasing with *N*) but ignores that investors live in a single, finite timeline.  
  - **EU Objection Handled Fairly**: The fund admits Kelly is EU with log utility but dismisses alternatives as "arbitrary," satirizing how geometric rationalists sidestep utility debates.  
  - **Merger Reform**: The policy change reflects real math (merged pools require recalculating Kelly fractions) but is announced as a minor bureaucratic tweak amid ruin.  
  - **Tone**: Patrician calm ("idiosyncratic utility landscape," "asymptotic argument remains unweakened") heightens the horror. Investors lost 92.3%, yet Fund II invites them to "roll" what remains.  
  - **The Table & Footnotes**: The performance table stages the arithmetic/geometric contrast. Footnotes 1 and 4 clinically explain why the impressive number (88.8%) is irrelevant to lived experience.  

  The piece invites laughter at the fund’s robotic devotion to theory, then squirms as the reader realizes every claim is defensible—yet the outcome is catastrophic. No finance-bro puns needed; the comedy is in the cosmic mismatch between math and human stakes.
