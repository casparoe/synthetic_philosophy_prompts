prompt: |-
  I'm a science-and-ideas journalist and once a month I run a kind of "ideas lab" for a mixed crowd — reporters, a couple of editors, friends of friends, usually 15 to 25 people, almost none of whom have studied philosophy and some of whom show up ten minutes late. Next month I've got 70 minutes and I want to do Parfit's hitchhiker: the driver gives you a lift only if he thinks you'll pay once you're in town, but once you're in town paying costs you and does you no good, so the person who does better is the one disposed to do the thing that's pointless at the time of doing it.

  Design me something actually runnable for that room. Constraints: no real money (I can get a couple bottles of wine as prizes), minimal printing — index cards, envelopes, whatever's lying around. Nobody should hear "precommitment", "rational irrationality", or "expected utility" until afterwards. And the bit I keep getting stuck on: I don't want them to be able to solve it by signing a contract, promising out loud, paying a third party to enforce it, or otherwise buying a commitment device. They should run into the fact that what helps them is being a certain kind of person, not performing a certain action.

  Second wrinkle, and this is the one I really want handled: in every version I sketch, players work out over repeat rounds that paying is just worth it for reputation — which is a different lesson than the one I'm after. So arrange the rounds so that reputation runs out while the case doesn't (say, a final round that everyone knows in advance is anonymous and one-shot). If you think that can't be done with a room like mine in 70 minutes, say so and tell me what to do instead.

  Then: a debrief that maps specific moments in the game onto specific parts of the argument; what will predictably go wrong (I'm expecting at least one person who's read a bit of game theory to announce the equilibrium out loud in round one); and an honest note on which feature of the idea the game can't produce and I'd just have to tell them.

  Last thing: flag where your own design is most likely to fail — what you'd see in the room that would convince you it taught the wrong lesson. Under 600 words, terse bulleted rules are fine.
reasoning: |-
  Okay, I need to help this journalist design a game for their "ideas lab" that illustrates Parfit's hitchhiker scenario. The key constraints are: no jargon, no real money, minimal materials, and most importantly, no commitment devices like contracts or promises. The core challenge is to show that being the right kind of person matters, not just performing actions strategically. Also, I must avoid reputation becoming the solution by making the final round anonymous and one-shot.

  First, I should recap Parfit's hitchhiker: A driver will only give you a ride if they believe you'll pay them later in town. But once you're in town, paying costs you money with no benefit. So, the rational thing at that point is not to pay. However, if the driver knows you're the type who will pay anyway, you get the ride. It's about dispositions versus actions.

  The journalist's main issue is that in repeated games, players learn to pay for reputation, which isn't the point here. So, I need a design that transitions to a final round where reputation doesn't matter. That means the game should have multiple rounds where players interact, building up habits, and then a sudden shift to anonymity for the last round.

  Materials are simple: index cards, envelopes, maybe markers. Prizes like bottles of wine can incentivize participation. The session is 70 minutes, with 15-25 people who might arrive late, so the setup needs to be quick and flexible.

  I'm thinking of a game with three roles: Hitchhikers (HH), Drivers (D), and Townspeople (T). Each round, HHs decide whether to "pay" or not, but the catch is that paying only happens in town, after the ride decision. To simulate that, I'll split each round into two phases: the ride phase and the payment phase.

  For the ride phase, Drivers decide whether to pick up a HH based on some signal. But how to signal without explicit promises? Ah, I can use pre-written notes on index cards. At the start, every HH writes a note saying "I will pay" or similar, sealed in an envelope. The Driver sees only the envelope, not the content, to avoid binding commitments. This represents the disposition—what the HH intends to do based on their character.

  Then, in the payment phase, HHs decide independently whether to pay, without the Driver knowing. But since it's a game, I need stakes. Players earn points: HHs get points for reaching town (if picked), but lose some if they pay. Drivers get points if paid, lose time if they give a ride and aren't paid. Townspeople can add a twist, like providing a bonus for paying, to make it more dynamic.

  To handle the reputation problem, I'll have multiple rounds where players interact in changing pairs, so reputation might build. But for the final round, switch to anonymous, one-shot: players draw random IDs, no record of past behavior, and announce it's the last round. That should force the issue—players who always pay might do better overall, but in the final town, paying is costly with no direct benefit.

  For the debrief, I'll map game moments to Parfit's concepts. For example, the sealed envelopes represent the disposition, not a contract. What goes wrong? Probably, game-theory savvy players might blab about reputational strategies early on, but that's okay—it sets up contrast for the anonymous round. Also, some players might not pay in the final round, which illustrates the problem: without the disposition, the action doesn't happen.

  The hardest part to simulate is the "being a certain kind of person" aspect. In a game, players are acting strategically, not developing real dispositions. So, in debrief, I'll have to explain that in real life, deep dispositions drive behavior, not just rational choices in the moment.

  Finally, risks: If players figure out that always paying wins in the long run, they might do it for points, missing the disposition point. The anonymous final round should expose that. Or, if the game feels too abstract, engagement drops. Keeping it fast-paced with clear scoring can help.

  Overall, I'll structure the game with clear phases, randomized pairings, and a strong shift to anonymity to drive home the lesson within 70 minutes.
answer: |-
  Here’s a streamlined design focusing on **dispositions vs. actions**, with anonymity to kill reputation. Total time: 65 mins.

  **Materials:**  
  - Index cards (3 per player)  
  - Pens  
  - Envelopes (1 per player)  
  - 2 bottles of wine (prizes)  
  - Whiteboard for scores  

  **Roles & Scoring (1 min explanation):**  
  - **Hitchhikers (HHs)**: Want to reach "Town" (gain 2 points). Paying in Town costs 1 point.  
  - **Drivers (Ds)**: Give rides only if they expect payment. If they give a ride *and get paid*, gain 1 point. If they give a ride *and aren’t paid*, lose 1 point.  
  - **Townsfolk (Ts)**: Neutral observers (explained later).  

  **Setup (5 mins):**  
  - Split group: 50% HH, 30% D, 20% T (adjust if needed). Roles rotate each round.  
  - Each HH gets 1 envelope + 2 cards.  

  ---

  **Rounds 1-2: Building Habits (15 mins total)**  
  *Structure per round (5 mins):*  
  1. **HH Decision (secret)**: Each HH writes **"PAY"** or **"DON’T PAY"** on one card (payment intent). Seals it in envelope.  
  2. **Driver Screening**: Ds see *only sealed envelopes* (not the card inside). D chooses: **"RIDE"** or **"NO RIDE"** for each HH.  
  3. **Town Phase**: HHs taken to Town (by Ds) see their *own* card again. They choose: **Actually PAY** (lose 1 pt) or **DON’T PAY** (no loss).  
  4. **Scoring**:  
     - HHs: +2 pts if given ride (regardless of payment). -1 pt if they pay.  
     - Ds: +1 pt per HH who *actually paid* after ride, -1 pt per HH who didn’t.  
     - Ts: Record outcomes (no scoring).  

  *Key:* HHs *see* their own pre-written card in Town but can change their minds. Ds never see actual payments—only Ts record them.  

  **Round 3: Anonymous One-Shot (10 mins)**  
  - Announce: **"Final round. No role records. Total anonymity."**  
  - Re-shuffle roles. HHs use *new* envelopes/cards.  
  - Repeat same structure. Ts collect *all* envelopes/cards afterward—no names.  

  **Scoring & Prizes (5 mins):**  
  - Tally points. Award wine to top HH and top D.  
  - Emphasize: *"Points reflect total gains. Did your strategy work?"*  

  ---

  **Debrief (30 mins)**  
  Map game moments to Parfit:  
  - **Sealed envelope** = Your *disposition* (what you *intend* pre-town). Not a contract—you can betray yourself.  
  - **Driver seeing envelope** = Trusting your *type*, not your promise.  
  - **Changing your mind in Town** = The "rational" choice that screws you if Drivers anticipate it.  
  - **Round 3 anonymity** = Why reputation fails: in one-shot, "rational" HHs don’t pay, so Drivers deny rides. Only "irrational" payers get rides *and* lose points paying.  
  - **Winners likely**: HHs who consistently wrote *and obeyed* "PAY" (even in Round 3).  

  **Predictable Issues & Mitigation:**  
  - **Game theorist blurts "Always pay!"**: Smile: "Try it!". In Round 3, "always pay" costs points with no reputational gain.  
  - **Late arrivals**: Make them Round 3 Townsfolk.  
  - **Confusion in Town Phase**: Stress: *"You see your OWN card again. Do what it says? Or something else?"*  

  **Honest Limitation:**  
  The game can’t show **why** someone *has* a truthful disposition. You must explain: Parfit says being "disposed to keep promises" isn’t about strategy—it’s about identity. A person who *is* honest gets the ride *because they can’t conceive of cheating*.  

  **Failure Risk:**  
  If most HHs pay in Round 3 "just in case," Drivers profit, and HHs gain net points (2 for ride -1 for pay). This teaches the *opposite* lesson. **Fix**: Pre-seed 2 Ts as "truth-tellers" in debrief: *"Did anyone pay in Round 3 even though it felt pointless? Why?"* Highlight their (rare) choice as key.  

  **Time Check**:  
  - Setup: 5 mins  
  - Rounds: 25 mins  
  - Scoring: 5 mins  
  - Debrief: 30 mins  
  - Buffer: 5 mins  

  This forces the "disposition" lesson by making reputation useless in the decisive round. Players feel the tension between acting strategically ("DON’T PAY" in Town) and *being* the person Drivers trust.
