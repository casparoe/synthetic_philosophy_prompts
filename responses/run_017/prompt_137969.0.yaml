prompt: |-
  i need a name for something ive been noticing on my feed for like a year now, and my friend who got me into that Darwinian-culture stuff says its just natural selection acting on ideas, but i think thats not quite it and i want to know whos closer.

  Three cases. (1) A dance trend. The version that ends up everywhere is a chopped-down two-move version; the original basically disappears, and the two-move version seemed to show up separately in a bunch of places at once instead of spreading out from one video. (2) A slang word. Starts out meaning something pretty specific, and a month later everyone uses it as an all-purpose filler that means basically nothing, and that emptied-out version is the one that travels to other schools. (3) A life-hack clip. The version that goes around is the one where the trick has been simplified so far that it doesnt actually work anymore, and it totally out-competes the versions where it still works.

  The pattern I think I see: nobody is copying faithfully, everyones version is a little off, but the off-ness isnt random — everyone is off in the same direction, and the direction is toward whatever is easiest to hold in your head and redo. So the winning form isnt the one that got reproduced most accurately. Its the one that keeps getting rebuilt the same way over and over, including by people who never saw each others version.

  Why I dont think my friends version of it is right: in case (1) the winner wasnt a mutation in one place that then spread, it looks like it got rebuilt independently a bunch of times, and in case (3) the winner is worse at the thing the idea is supposed to be for. Also a lot of the shaping isnt in anyones head at all — the app copies the audio exactly but drops the video, theres a character limit, the sound only plays for fifteen seconds. That stuff is doing as much shaping as what people find memorable.

  So: is there an established concept for this exact thing, and does it support my read of these cases or my friends? Please dont just hand me a label — I want the carving. If there are two or three nearby concepts, tell me which one fits which of my cases, what each would predict that the others wouldnt, and whether any of my three examples is one that none of them really handles. If there genuinely isnt a term, coin one and define it with its boundary cases. And no reading lists or citations — I cant look any of it up from here.

  Commit to something: say which account you think is actually right about cases like these, give your reasons, say how confident you are, and say what would change your mind. End with \answer{...} containing only the label you think fits best, or the one you coined.
reasoning: |-
  Okay, let me tackle this user's question. They've noticed a pattern where ideas evolve in a specific direction across different contexts—dance trends, slang, and life hacks. Their friend attributes this to natural selection of ideas, but the user thinks it's more about ease of replication. 

  First, I need to recall relevant concepts. Memetics comes to mind, but it emphasizes replication fidelity, which doesn't fit the user's cases where mutations aren't random. Darwinian evolution relies on variation and selection, but here the selection pressure seems uniform towards simplicity. Then there's the idea of entropy in information—degradation over time. But degradation implies loss, whereas here the changes are directional. 

  Cognitive load theory might be part of it—people simplify to reduce mental effort. Platforms also impose constraints like character limits, shaping the evolution. The user mentioned the dance trend simplifying independently in multiple places, which suggests convergent evolution rather than common descent. 

  For case one, the dance trend, it's not about one mutation spreading but many people independently arriving at the simplest version. Case two, slang losing meaning to become filler, fits semantic bleaching but accelerated by social transmission. Case three, the life-hack becoming non-functional, shows that effectiveness isn't the driver; ease of replication is. 

  The user's key point is that the evolution is directional towards whatever is easiest to remember and reproduce. Their friend's natural selection analogy doesn't account for the non-random, convergent mutations or the role of platform constraints. 

  I should consider if any existing terms fit. Memetic drift? Not quite—drift is random. Maybe cognitive selection or replicative erosion? The latter captures the wearing down aspect. But perhaps a new term is needed. Attentional Selection emphasizes the role of cognitive ease and platform algorithms in selecting variants. 

  The user's account seems more accurate. Natural selection would predict the fittest idea surviving, but here, the "fittest" is defined by replicability, not functionality. Confidence is high because the cases show consistent directional change. If future cases showed complex versions outcompeting simple ones in similar environments, that might challenge this view. 

  Best fitting label: Attentional Selection. It encompasses both cognitive and platform-driven pressures towards minimal, attention-efficient forms.
answer: |-
  Your friend is half-right about Darwinian processes, but you've nailed something deeper: **it's selection *for* replicability, not *of* ideas themselves.** Here's the carving:

  1.  **Nearby Concepts & Why They Don't Fit Perfectly:**
      *   **Memetics (Dawkins/Susan Blackmore):** Focuses on "memes" replicating like genes. **Problems:** Assumes copying fidelity matters most. Your cases show *low-fidelity copying* is key, and the "winner" often isn't the original meme, but the *path of least resistance* its reconstruction takes. Memetics struggles with convergent, independent reconstruction and non-functional winners (Case 3).
      *   **Cultural Evolution / Darwinian Selection of Ideas:** Your friend's view. **Problems:** Emphasizes variation, selection, and inheritance. Your cases show variation isn't random (it's *systematically* towards simplicity/ease) and "inheritance" is broken (independent reinvention in Case 1). It also struggles when the "fittest" (most functional, like the working life hack) *loses* to a less functional but easier-to-replicate version (Case 3).
      *   **Entropy / Signal Degradation:** Ideas naturally degrade over transmission. **Problems:** Degradation is usually seen as *random* loss. Your cases show *directional* transformation towards a specific, stable, *minimal* form. It's not just decay; it's convergence on a *new*, highly replicable attractor state.
      *   **Cognitive Load Theory:** People simplify to reduce mental effort. **Partial Fit:** This explains *why* the shift happens (Case 1,2,3). **Problem:** It doesn't fully capture the *system-level* outcome where this simplification creates a new, dominant standard *despite* independent origins or functional loss. It's purely cognitive, missing platform constraints.

  2.  **Which Concept Fits *Your* Cases Best?**
      *   **Case 1 (Dance Trend):** Best explained by **Convergent Cultural Attraction** (Boyd, Richerson, Henrich). People independently reconstruct the idea based on shared cognitive biases (ease of recall/performance), landing on the same minimal form. Not descent from a single mutant.
      *   **Case 2 (Slang Word):** Primarily **Semantic Bleaching** + **Cognitive Load**. Meaning erodes ("bleaches") because the *sound* or *social signal* is easier to replicate than the specific semantic content. Cognitive load drives the shift to filler. Platform virality amplifies the bleached version.
      *   **Case 3 (Life-Hack):** **Cognitive Load** + **Platform Constraints** + a **Replicability Trap**. The absolute *easiest* version to grasp and reshare wins, even if it's non-functional. Platform algorithms favor quick, simple, "wow-factor" clips regardless of utility.

  3.  **The Gap: Your Core Insight**
      None fully capture the *systematic, directional pressure towards minimal, cognitively/platform-optimized forms via low-fidelity transmission/reconstruction*, where the "winning" variant is defined purely by its *ease of being copied or reconstructed next time*, often independently, and *despite* functional or fidelity loss.

  4.  **The Coined Concept: Attentional Selection**
      *   **Definition:** The process by which variants of a cultural element (idea, behavior, trend) are preserved, spread, and converged upon *not* primarily due to their inherent fitness (accuracy, utility, aesthetic value), but due to their superior **replicability under prevailing constraints of attention, memory, and platform architecture**. Success is defined by minimizing the cognitive and temporal cost for the *next* individual to acquire and retransmit it.
      *   **Boundaries:**
          *   *Not Random Mutation:* Variation is predictably biased towards simplicity/minimalism.
          *   *Not Functional Selection:* Utility is secondary (often sacrificed) to replicability.
          *   *Not Pure Entropy:* Results in stable, convergent attractors (the minimal viable form), not just noise.
          *   *Requires Low-Fidelity Transmission:* Faithful copying prevents this; reconstruction/imperfect imitation is key.
          *   *Platforms as Selective Forces:* Algorithms act as non-cognitive selective pressures favoring brevity, shock, simplicity.

  5.  **Who's Right? You Are (Mostly).**
      *   **Confidence:** 90%. Your pattern is clear: the winner is consistently the *easiest thing to hold in your head and pass on*, shaped by brains *and* platforms. Your friend's "natural selection *of* ideas" misses the *directional pressure*, independent convergence, non-functional winners, and critical role of platform constraints you identified.
      *   **Why:** Darwinian selection *applies* (variation, selection, replication), but the *selection pressure* isn't "fitness to environment" in the usual sense. **The environment *is* the bottleneck of human attention and platform mechanics.** The "fittest" variant is the one that slips through that bottleneck *fastest and easiest*, even if it's a dumbed-down shell of the original. Case 1 (independent convergence) and Case 3 (non-functional winner) are fatal blows to a standard Darwinian-of-ideas view but core evidence for Attentional Selection.
      *   **What Would Change My Mind:** Evidence that in identical cognitive/platform environments, complex, high-fidelity, or functionally superior variants consistently outcompete minimal, low-fidelity ones *specifically because* of their complexity/fidelity/functionality. Or evidence that the simplification you observe is truly random degradation, not systematic convergence.

  **Conclusion:** Your friend's Darwinian lens sees the *mechanism* (variation/selection), but you've correctly identified the *dominant selective pressure* (minimizing attentional/cognitive cost for replication). **Attentional Selection** explains why the "winner" is often a minimal, easy-to-process, easily reconstructed (even independently) ghost of the original, amplified by platform mechanics. It fits all three cases tightly.

  \answer{Attentional Selection}
