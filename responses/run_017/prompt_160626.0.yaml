prompt: |-
  I'm the tech lead on a six-person team building the scheduling brain for a regional home-care agency — every morning it decides which of about 400 clients get a visit that day from whoever actually showed up, and seperately it reads free-text messages from clients and decides whether to escalate something to a family member or a nurse. My own grandmother is on the client list in one of the pilot counties, which is sort of how I ended up volunteering to write the part of the design doc we call "the values section." We hit one of these decisions about once a sprint, there are ~30 of them stacked up in the backlog for the pilot, and the reviewers are me, two engineers, a PM, a nurse manager, and the agency's counsel — nobody with philosophy training, and counsel has to be able to defend whatever we write in one page. Two hard constraints: we can only get a human on roughly 3% of decisions (the agency won't pay for more, and past that point the product doesn't save them money), and every decision needs a short logged reason string, which I've noticed is often not the real reason the model did what it did.

  What I need is a procedure, not a list of principles. Something my team can run in an hour on a backlog item, and that outputs one of three things: a rule we can actually put in a spec, a "defer to a named human" instruction, or a "don't ship this decision at all." The part I keep getting stuck on — and the reason the usual AI-ethics advice hasn't helped — is that most of our hard cases aren't "what's the right thing to do" but "who gets to say what the right thing is." The client's stated wishes, the family's wishes, what the nurse manager thinks is clinically indicated, what the agency is willing to be liable for, and what the county contract requires can come apart, and I've started calling the points where they come apart value handoffs. So I want the procedure to force us to name, for each decision, whose values are authoritative, what happens when two of them conflict, and what the system does when the spec runs out — abstain, escalate, or pick a default and log it. The same build also ships in two counties with visibly different norms about family notification, so the procedure has to tell us what's fixed in the spec, what's a config knob, and who is allowed to turn the knob.

  Give me the ordered questions, what counts as an adequate answer to each, where the procedure just says no, and where it has to stop and hand the question to a person — and be explicit that those last two are different moves. Then run it on three backlog items: (1) 40 clients, 25 slots, and the choice between prioritizing whoever is worst off today, whoever deteriorates fastest without a visit, and whoever's missed visit is most likely to turn into a hospital bill; (2) a client messages that she's stopped eating and says "please dont tell my daughter," and the system has to decide whether to notify anyone; (3) a case where the honest answer is that we shouldn't ship the decision at all, or that our 3% deferral budget can't cover it — tell me which, because I'd rather hear it now than at the pilot review. I also want the part where you're honest about what the procedure can't do: the cases where any rule we write is just one engineer's intuition with a reason string bolted on, and how I should document those so we're not pretending otherwise. One thing I remember from a philosophy elective is that people distinguish building ethical rules in top-down from getting them out of data, and a friend who works on alignment keeps telling me I should make the system track moral uncertainty — if either of those actually changes what goes in my spec, say how, and if they're unusable at my granularity, say that too. Answer in American English please, and no reading lists or citations — I need something I can paste straight into a design doc.
reasoning: |-
  We are creating a procedure for making decisions about how the scheduling brain and text-escalation system should handle value conflicts. The procedure must output one of three things: a rule for the spec, a "defer to named human" instruction, or a "don't ship this decision at all". The key is to determine whose values are authoritative, how to handle conflicts, and what to do when the spec runs out.

  The procedure is a series of ordered questions. We must define:
  - What counts as an adequate answer for each question.
  - Where the procedure says "no" (i.e., we cannot proceed and must choose "don't ship").
  - Where the procedure stops and hands the question to a person (escalation to the team or a named human).

  We also note that the same build ships in two counties with different norms, so we must decide what is fixed and what is configurable, and who can change the configuration.

  The procedure must be runnable in about an hour per backlog item.

  We are then to run the procedure on three backlog items.

  Finally, we must be honest about the limitations: cases where the rule is just an engineer's intuition and how to document that.

  We are to avoid philosophical discussions and focus on actionable steps.

  ---

  **Procedure: Value Handoff Decision Protocol**

  This protocol is for determining how the system should handle a specific decision point. The team (tech lead, engineers, PM, nurse manager, counsel) runs this in a one-hour session per backlog item. The output is one of:
  - **Rule**: A clear, implementable rule for the specification, including any configuration options and who can set them.
  - **Defer**: An instruction to defer the decision to a named human (with a clear escalation path and what to log).
  - **Don't Ship**: The decision point is not automated at this time (either because it requires more than 3% human oversight, or because it is too risky/ambiguous).

  **Ordered Questions:**

  1. **Who is the primary authority for this decision?**  
     - *Adequate answer*: A single named role (e.g., "the client", "the nurse manager", "the agency counsel", "the family member designated in the care plan") OR a clear hierarchy (e.g., "client > family > nurse manager" with a defined order).  
     - *If no clear authority*: The procedure stops and the team must choose either "Defer" (if a human can be named to make the decision case-by-case) or "Don't Ship" (if no human can reasonably be the authority or if it requires more than 3% deferral).  
     - *Note*: The authority must be one that the agency can legally and operationally rely on (counsel must approve).

  2. **Is there a clear, objective way to encode the primary authority's values into a rule?**  
     - *Adequate answer*: Yes (with a specifiable rule) or No.  
     - *If Yes*: Proceed to write the rule (see step 4).  
     - *If No*: Go to step 3.

  3. **Can the decision be deferred within the 3% budget?**  
     - *Adequate answer*: Estimate the frequency of this decision occurring and the cost of deferral.  
       - If the decision occurs in less than 3% of cases and a named human (with their role) can be assigned to handle it, output "Defer" with the human's role and what to log (e.g., "Defer to nurse manager; log: 'deferred due to conflict between client wish and clinical risk'").  
       - If the decision is too frequent (>3% of cases) or no named human can be identified, output "Don't Ship" for this decision (meaning we remove it from automation and handle it entirely manually until a solution is found).  
     - *Note*: Counsel must confirm that deferral is legally defensible.

  4. **Draft the rule:**  
     - *Adequate answer*: A rule that is:  
       - Unambiguous (can be implemented in code).  
       - Includes a short reason string for logging (even if simplified).  
       - Specifies what happens when the rule runs out (e.g., abstain, escalate, or pick a default).  
       - Notes any configuration knobs (if the rule might vary by county or over time).  
       - Specifies who can set the configuration (e.g., "agency admin", "nurse manager", "client via care plan").  
     - *Note*: The rule must be reviewed by counsel for liability and by the nurse manager for clinical soundness.

  5. **Handling conflicts between authorities:**  
     - If the decision involves multiple authorities (e.g., client vs family), the rule must specify:  
       - The order of precedence (from step 1).  
       - What to do in a conflict (e.g., "defer to nurse manager if client and family conflict", or "always follow client unless X").  
       - If no clear conflict resolution, go back to step 3 (defer or don't ship).

  6. **Configuration Management:**  
     - For any rule, decide:  
       - Is this fixed for all counties? (If not, it must be a configuration knob.)  
       - Who can change the configuration? (Must be a role, e.g., "agency administrator" or "county manager".)  
       - How is the configuration set? (e.g., in the care plan, by an admin UI.)  
     - *Note*: Counsel must approve the configurability to ensure it doesn't create liability gaps.

  **Where the Procedure Says "No":**  
  - At step 1, if no authority can be named and no human can be assigned (or it's too frequent for deferral), then "Don't Ship".  
  - At step 3, if deferral would exceed 3% or no human is available, then "Don't Ship".

  **Where the Procedure Stops and Hands to a Person:**  
  - At step 1, if the team cannot agree on the authority, they must defer to counsel for a legal determination.  
  - At step 3, if deferral is chosen, then the decision is handed to the named human at runtime.  
  - At step 4, if the rule cannot be written unambiguously, the team must revisit step 3 (defer or don't ship).

  **Limitations and Honesty:**  
  - Some rules will be based on imperfect heuristics. In these cases, the design doc must note:  
    - "This rule is a practical heuristic. It may not capture all nuances. The reason string logged is an approximation of the real reason."  
    - For such rules, we must also log the key input factors (so that if we audit, we can see what the system saw).  
  - Moral uncertainty: We can capture it by:  
    - Having the model output a confidence score (if applicable) and using that to defer when uncertain (if within budget).  
    - However, at our granularity, we are not building a full moral uncertainty tracker. Instead, we use the deferral mechanism for high-uncertainty cases.  
  - Top-down vs. data-driven:  
    - We are using a top-down approach (rules from authorities) because we don't have data that reflects the "right" decisions in conflict cases.  
    - If we had data (e.g., past human decisions), we might use it to train, but we don't have that for the pilot. So we stick with rules.  
    - In the future, we might use data to refine rules, but for now, we rely on the authorities named.

  ---

  **Running the Procedure on Backlog Items:**

  **Item 1: 40 clients, 25 slots, and the choice between prioritizing whoever is worst off today, whoever deteriorates fastest without a visit, and whoever's missed visit is most likely to turn into a hospital bill.**

  1. **Primary authority?**  
     - The agency contract and clinical guidelines. The nurse manager and counsel agree that the county contract requires minimizing hospitalizations (to avoid costs and ensure client health). The client's immediate need is also important, but the contract is the overriding authority.  
     - *Hierarchy*: County contract > clinical judgment (nurse manager) > client preference (if known).  
     - Adequate: Yes. Authority is the county contract, which prioritizes avoiding hospital bills.

  2. **Can we encode?**  
     - Yes. The contract states that avoiding hospitalizations is the top priority. So the rule is: prioritize "whoever's missed visit is most likely to turn into a hospital bill".  
     - But we must also consider: what if two clients have the same risk? Then we can have a tiebreaker (e.g., worst off today).

  3. **Defer?** Not needed since we can encode.

  4. **Draft rule:**  
     - Rule: Assign slots by descending order of hospitalization risk (as predicted by model). If tie, then by severity of current condition. If tie again, by deterioration rate.  
     - Reason string: "Prioritized by hospitalization risk and current severity."  
     - On run out: If no data (e.g., risk model fails), defer to nurse manager (but this should be rare, so within 3% budget).  
     - Configuration: Hospitalization risk model parameters might be configurable by the county? But the priority order is fixed by contract. So the rule is fixed, but the model that computes hospitalization risk might have configurable thresholds (set by agency data scientist).  
     - Who sets knob: Agency data scientist, approved by nurse manager.

  5. **Conflicts?** No conflict between authorities here because the contract is clear.

  6. **Configuration:** Fixed rule for priority order, but the risk model is configurable.

  **Output: Rule**  
  - Implement: Prioritize by hospitalization risk, then current severity, then deterioration rate.  
  - Log: "Priority: hospitalization risk."  
  - On failure: Escalate to nurse manager.  
  - Config: Risk model thresholds set by agency data scientist with nurse manager approval.

  ---

  **Item 2: Client messages that she's stopped eating and says "please dont tell my daughter," and the system has to decide whether to notify anyone.**

  1. **Primary authority?**  
     - The client's wishes vs. clinical risk. The agency's policy (per counsel) is that in cases of potential self-harm or severe health risk, the nurse manager must be notified regardless of client wishes. But family notification is different.  
     - Hierarchy: Clinical safety (nurse manager) > client confidentiality, but family notification requires balancing client wishes and family's role (if designated in care plan).  
     - The care plan might specify a "notification preference" for the client.  
     - Authority: For health risks, nurse manager is primary. For family notification, the care plan is primary (if it specifies who to notify and when).

  2. **Can we encode?**  
     - Partially. We can have:  
       - Always notify the nurse manager if a client reports a severe health risk (like stopped eating).  
       - For family, check the care plan: if the client has designated the daughter as a contact and specified conditions for notification, follow that. If the care plan says "notify daughter in case of dietary issues", then notify even if client says not to? But that conflicts.  
     - The care plan is the binding document (signed by client). So we must follow it.  
     - However, if the care plan says "respect client's wishes at time of event", then we don't notify family. But this is a high-risk situation.

  3. **Defer?**  
     - This decision might occur in less than 3% of messages? Probably. But let's see.  
     - We can defer the family notification part to the nurse manager? But the nurse manager is already notified.  
     - We need a rule for family notification.

  4. **Draft rule:**  
     - Rule:  
       Step 1: Always escalate to nurse manager for clinical review when a client reports "stopped eating" (or similar high-risk keywords).  
       Step 2: For family notification:  
          - If the care plan specifies "always notify [family member] in case of dietary issues", then notify that family member regardless of the message.  
          - If the care plan says "notify only with client consent", then do not notify family in this case (because client said no).  
          - If the care plan does not specify, then by default, do not notify family (to respect client's immediate request) but the nurse manager will handle it.  
     - Reason string: "Clinical escalation per policy. Family notification: [reason based on care plan]."  
     - On run out: If care plan is missing or unclear, defer to nurse manager for whether to notify family.  
     - Configuration: The keywords that trigger clinical escalation are configurable by the agency (nurse manager sets). The family notification rules are fixed by the care plan (so not configurable by county, but per client).

  5. **Conflicts?**  
     - Between client wish (don't tell) and care plan (which might say tell). The care plan is the authority because it's signed by the client.  
     - But if the care plan says to notify and the client says not to, we follow the care plan (as it's the standing instruction).  
     - However, counsel must confirm: is the care plan legally binding? (Assume yes.)

  6. **Configuration:**  
     - Clinical escalation keywords: configurable by nurse manager.  
     - Family notification rules: not configurable by county; per client care plan.

  **Output: Rule**  
  - Implement:  
    - Always escalate to nurse manager for clinical review.  
    - Notify family per care plan: if care plan requires notification, do it; if requires consent, don't notify in this case; if unclear, defer to nurse manager.  
  - Log: "Clinical escalation: high risk. Family: [action taken] per care plan."  
  - On run out (missing care plan): defer family decision to nurse manager.

  ---

  **Item 3: A case where we shouldn't ship the decision at all, or that our 3% deferral budget can't cover it.**

  We need an example that fails the procedure.

  Example from backlog: **"Decide whether to override a family's 'do not hospitalize' request when the client's condition deteriorates suddenly and the nurse manager is unavailable."**

  1. **Primary authority?**  
     - The client's advance directive (if any), family's legal authority, nurse manager's clinical judgment, and agency liability.  
     - Hierarchy? Unclear. The client's advance directive is highest, but if the family is the legal guardian, then they decide. But if the directive is ambiguous, then the nurse manager must decide. But what if unavailable?  
     - We cannot name a single authority because it depends on legal documents and real-time availability.

  2. **Can we encode?**  
     - No. Too many variables (advance directive, guardian status, nurse manager availability) and high stakes.

  3. **Defer?**  
     - We must defer to a human (nurse manager or on-call doctor). But:  
       - If the nurse manager is unavailable, we need a backup.  
       - This situation is rare (less than 0.1% of decisions?) so within 3%.  
     - However, deferral requires a human to be available 24/7, which the agency doesn't have. So we cannot guarantee a human will be available.

  4. **Therefore, the procedure says:**  
     - We cannot defer because we don't have a reliable human in the loop for this scenario.  
     - We cannot write a safe rule because the authority is unclear and stakes are high.  
     - **Output: Don't Ship.**  
     - Meaning: The system must not make this decision automatically. We must design the system so that this scenario triggers an immediate escalation to an on-call human (which the agency must provide) or, if not, then the system does not handle such cases and the client is at risk. The agency must either hire 24/7 coverage or accept the risk.

  **Explanation:**  
  - This decision point is too critical and ambiguous to automate without reliable human backup. Since the agency isn't providing 24/7 coverage, we cannot automate it. We must remove this decision from the system and handle it manually (e.g., by having nurses check for such flags continuously).  
  - In the spec, we would note: "For sudden deterioration with a 'do not hospitalize' request, the system alerts the nurse manager and waits for human decision. If no response within [time], escalate to on-call physician (if available) or call 911 if immediate risk." But this requires the agency to have an on-call system.  
  - If the agency won't pay for that, then we don't ship this as an automated decision. We log the alert but don't decide.

  ---

  **Final Notes for the Design Doc:**

  - **Documentation of Heuristics:** For any rule that is based on intuition or imperfect data, we will note in the spec: "Heuristic Rule: This rule is a practical approach based on [authority]. It may not cover all edge cases. The reason string is a simplification. Auditing is recommended."  
  - **Moral Uncertainty:** We do not model it explicitly. Instead:  
    - We use deferral for high-uncertainty cases (if within budget).  
    - We log confidence scores (if the model provides them) and use low confidence as a trigger for deferral (if we have the budget and a human available).  
  - **Top-Down vs. Data-Driven:** We are top-down for the pilot. In the future, we can use data to refine rules, but only with approval from authorities (nurse manager, counsel) to avoid encoding biases.

  This procedure forces us to name the authority, handle conflicts, and face the constraints of the 3% budget. It should fit in one page.
answer: |-
  ### Value Handoff Decision Procedure  
  This procedure resolves how the system handles a decision point where values conflict. Run it per backlog item in a 60-minute session with your team (engineers, PM, nurse manager, counsel). Outputs:  
  - **Rule**: A spec-ready, machine-executable rule with logging logic.  
  - **Defer**: "Defer to [Named Human Role]" with escalation path and log string.  
  - **Don't Ship**: Remove this decision from automation (handle manually or omit).  

  #### Ordered Questions & Rules of Thumb  
  **1. Who is the top authority for this decision?**  
     - **Adequate answer**: One named role (e.g., "client," "nurse manager," "county contract") OR a clear hierarchy (e.g., "client > family > agency counsel").  
     - **Stop and hand to person**: If disagreement, counsel breaks ties.  
     - **Say no ("Don't Ship")**: If no authority exists or it’s ambiguous (e.g., "it depends on the moon phase").  

  **2. Can we encode the authority’s values into a rule?**  
     - **Adequate answer**: "Yes" (with a testable condition) or "No" (if it requires nuanced judgment).  
     - **Stop and hand to person**: If "No," escalate to nurse manager for clinical input or counsel for legal input.  
     - **Say no ("Don't Ship")**: If encoding requires >3% deferral or creates unacceptable risk (e.g., life-or-death judgment).  

  **3. What happens when inputs conflict or the rule runs out?**  
     - **Adequate answer**: Specify one action:  
       - "Abstain and log [reason]" (e.g., no action taken).  
       - "Escalate to [Role] with [timeout]."  
       - "Default to [action] and log [reason]."  
     - **Say no ("Don't Ship")**: If conflict resolution can’t fit within 3% deferral (e.g., >3% of cases will escalate).  

  **4. What is fixed vs. configurable?**  
     - **Adequate answer**: Define:  
       - **Fixed**: Core hierarchy/authority (e.g., "client wishes always override family").  
       - **Config knob**: Settings modifiable per county (e.g., "escalation timeout duration").  
       - **Who can set knob**: Role (e.g., "county admin" or "nurse manager").  
     - **Stop and hand to person**: If configurability crosses legal boundaries (counsel approves).  

  **5. Can we log a defensible reason?**  
     - **Adequate answer**: A concise string (≤10 words) that traces to the authority (e.g., "per client care plan").  
     - **Say no ("Don't Ship")**: If the true reason is unexplainable (e.g., "black-box model output").  

  #### What This Can’t Do  
  - **Engineer intuition masquerading as rules**: When no authority exists, document: "Heuristic: [Rule]. WARNING: Based on engineering judgment, not authority. Audit monthly."  
  - **Moral uncertainty**: Unusable at your scale. Tracking "confidence scores" adds complexity without solving who has authority. Focus on deferral.  
  - **Top-down vs. data-driven ethics**: Top-down (authority rules) is your only option. Data-driven requires historical "correct" decisions (which you lack) and introduces bias.  

  ---  
  ### Backlog Item Walkthroughs  
  **Item 1: Prioritizing 40 clients for 25 slots**  
  - **Q1**: Authority = county contract (it defines cost-saving goals).  
  - **Q2**: Encodable? Yes. Contract prioritizes avoiding hospital bills (explicit cost liability).  
  - **Q3**: Conflict/run-out? Default to "prioritize hospital bill risk," abstain if no data.  
  - **Q4**: Fixed: Authority (county contract). Config knob: Weight of "bill risk" vs. "clinical deterioration" (set by county admin).  
  - **Q5**: Log string: "Prioritized high hospital-bill risk per [County] contract."  
  - **Output**: **Rule**  
    ```python  
    if hospital_bill_risk(client) > threshold:  
        priority_score = hospital_bill_risk(client)  
    else:  
        priority_score = deterioration_rate(client)  # Fallback  
    log(f"Prioritized: hospital-bill risk per {county} contract")  
    ```  

  **Item 2: Client says "stopped eating, don’t tell daughter"**  
  - **Q1**: Hierarchy = nurse manager (clinical safety) > client wishes.  
  - **Q2**: Encodable? Partially. Always escalate to nurse manager if "stopped eating" (clinical risk). Family notification depends on care plan.  
  - **Q3**: Conflict? If care plan says "notify daughter," override client. Else, default to "no notify" and escalate to nurse manager.  
  - **Q4**: Fixed: Nurse manager authority. Config knob: Keywords triggering escalation (e.g., "stopped eating") set by nurse manager.  
  - **Q5**: Log string: "Escalated: high clinical risk. Notified per care plan: [Yes/No]."  
  - **Output**: **Rule**  
    ```python  
    if message_contains_high_risk_terms(text):  
        escalate_to(nurse_manager)  
        if care_plan.requires_notification(family_member="daughter"):  
            notify_daughter()  
            log("Escalated: clinical risk. Notified daughter per care plan.")  
        else:  
            log("Escalated: clinical risk. No family notify per care plan.")  
    ```  

  **Item 3: Don’t Ship Example**  
  **Scenario**: Deciding whether to force-entry when a client misses visits but previously stated "do not enter my home uninvited."  
  - **Q1**: Authority = client (property rights) vs. nurse manager (safety). No clear hierarchy.  
  - **Q2**: Encodable? No. Requires contextual judgment (e.g., is the client incapacitated?).  
  - **Q3**: Conflict resolution? >3% of cases would need human review (agency has 400 clients; 12+ forced-entry decisions/week).  
  - **Output**: **Don’t Ship**  
    - **Why**: No authority, conflicts are frequent (>3% deferral), and deferral is legally risky (counsel can’t defend an algorithm overriding property rights). Handle 100% manually via nurse manager.  

  ---  
  ### Procedure Output Template for Design Doc  
  ```markdown  
  **Decision Point**: [Describe the backlog item]  
  1. **Authority**: [Role/Hierarchy]  
  2. **Encodable Rule?**: Yes/No  
  3. **Conflict/Run-out Handling**: [Action + Log string]  
  4. **Fixed vs. Config**:  
     - Fixed: [List]  
     - Config Knob: [Setting] (Set by: [Role])  
  5. **Log String**: [Example]  
  **Output**: [Rule / Defer to [Role] / Don’t Ship]  
  **Warnings**: [Heuristic flags or limitations]  
  ```  
  This forces explicit ownership, fits in one page, and meets counsel’s defensibility bar. For pilot review, flag all "heuristic" rules and "Don’t Ship" items upfront.
