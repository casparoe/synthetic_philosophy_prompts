prompt: |-
  I cover science and ideas for a living, and I keep coming back to something wierd about how professional mathematics handles proofs that need a computer.

  The practice, as best I can tell: a computer-assisted proof gets treated as settling the theorem — journals publish it, people cite the result, textbooks eventually say it is known that — but the field also acts as if something is still owed. People go on hunting for a human-readable proof decades later. The four-colour theorem and the Kepler conjecture are the standard examples, and now there is the whole proof-assistant world (Lean, Coq) plus machine-learning systems that emit formal proofs. Grad students get told that formalisation is the gold standard and also that a paper which is just a checked file is not a paper.

  Here is the bit I cannot square. The complaint against computer proofs is that nobody can survey them: they hand you a certificate without understanding. But the same community happily accepts non-constructive existence proofs that give you no object whatever, and it accepts enormous human arguments — the classification of finite simple groups, any 300-page paper in a top journal — that maybe four people have read end to end, without treating that as a scandal. So it is not constructivism in any straightforward sense; if it were, half of classical analysis would have to go as well. And it is not literally about some human mind having checked it, because in the long cases no mind has.

  So: what does the practice actually presuppose about what a proof is? I have been playing with a distinction of my own — proof as certificate (settles whether), proof as warrant (gives the community reasons to believe), proof as equipment (leaves you able to re-derive it, teach it, extend it) — and my guess is the practice really needs the third and only pays lip service to the first two. But I cannot tell whether that is a philosophical claim or just a journalist's excuse for a vibe.

  What I want: reconstruct the implicit theory properly; tell me which features of the practice strictly require it and which would be licensed equally well by two or three rival theories; say where the practice is underdetermined. And if I am wrong that this has nothing to do with constructivism — if the discomfort is really a residue of identifying truth with provability-by-creatures-like-us, or if the fact that classical proofs can be mechanically translated into constructive-looking ones makes the whole worry evaporate — say that too.

  Last thing: what would change for working mathematicians if we dropped the presupposition? If a proof is just a certificate, what does an article become, a release note? Would we lose something real, or only a status hierarchy?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science and ideas journalist who's noticed a weird tension in how mathematicians handle computer-assisted proofs. On one hand, these proofs are accepted as valid; on the other, there's this persistent hunt for human-readable versions. The user mentions examples like the four-color theorem and Kepler conjecture, plus newer proof assistants like Lean. 

  The core confusion seems to be: why does the math community treat computer proofs as "lesser" when they happily accept other non-surveyable proofs like the classification of finite simple groups or non-constructive existence proofs? The user proposes their own framework—proof as certificate/warrant/equipment—and suspects the real value is in "equipment" (teachability, extensibility). 

  Hmm, I need to dissect this carefully. First, acknowledging that the user has identified a genuine paradox in mathematical practice. Their observation is sharp—the community's behavior appears inconsistent if we assume "surveyability" is the main issue. 

  Let me mentally test theories against known examples: 
  - If it were about constructivism, why accept non-constructive proofs? 
  - If about human verification, why accept 300-page proofs nobody reads fully? 
  - The "equipment" idea seems promising because it explains why grad students are told formalization isn't publishable alone—it lacks explanatory value. 

  I recall Thomas Hales' Flyspeck project formalizing Kepler's conjecture. Mathematicians accepted it post-verification but still yearned for insight. That leans into "proof as narrative" or "proof as insight-transfer." Also, De Millo-Lipton's social argument feels relevant—proofs as communal artifacts. 

  The user's question about "what changes if we drop the presupposition" is crucial. If proofs became mere certificates, math might lose its cumulative, insight-driven nature. But would that *matter*? Maybe for pure abstraction it wouldn't, but applied math needs tools. 

  Wait—should I address the constructive angle more? The user suspects it's not central, and I agree. Bishop-style constructivism is a niche preference, while the discomfort with computer proofs is mainstream. The key is likely epistemological: what proofs *do* for mathematicians beyond verification. 

  Potential blind spot: the user frames this as philosophical, but it's also sociological. The "status hierarchy" mention hints at this. Maybe note how norms protect certain types of mathematical labor? 

  Final thought: The underdetermination point is vital. Practice doesn't force one theory—different subfields likely prioritize different aspects. Number theory craves equipment; set theory might accept certificates. That variability might be the real answer.
answer: |-
  Your analysis cuts to the heart of a profound tension in mathematical practice. The implicit theory of proof underlying this behavior is **pluralistic but hierarchically structured**, prioritizing *epistemic utility* over mere verification. Here's a reconstruction:

  ### The Implicit Theory: Proof as Multifunctional Epistemic Artefact
  1.  **Verification (Certificate):** *Necessary but insufficient.* Settles truth-value.
  2.  **Explanation (Warrant + Equipment):** *The core value.* Provides:
      *   **Understanding:** *Why* the result is true, revealing conceptual structure, key ideas, and connections.
      *   **Transferability:** Enables the community to learn, teach, adapt, and build upon the result without re-running opaque computations.
      *   **Heuristic Value:** Offers strategies, techniques, or insights applicable to new problems.
      *   **Error-Detection Resilience:** Human-readable arguments allow for "local" error-checking by many individuals on different parts, fostering communal confidence beyond formal verification.
  3.  **Aesthetic/Normative Dimension:** Elegance, simplicity, and "surveyability" are valued not just practically, but as intrinsic goods within the mathematical culture, signifying deep conceptual mastery.

  ### Why Computer Proofs Cause Discomfort (Despite Settling Truth)
  *   **They excel at (1), often fail at (2):** A brute-force enumeration of cases (4-color) or a massive optimization (Kepler) provides a *certificate* but minimal *explanation* or *understanding*. They answer "Is it true?" but poorly answer "Why is it true?" or "What does this tell us?"
  *   **They lack modular insight:** A 300-page human proof, while long, is usually composed of lemmas, theories, and strategies that *can* be understood and reused modularly by many people. A monolithic computer output isn't decomposable in the same way.
  *   **Opaque Heuristics:** The "why" is buried in code and CPU cycles, not in conceptual mathematical reasoning. This hinders its use as *equipment* for tackling related problems.

  ### Why Non-Constructive Proofs & Long Human Proofs Are Accepted
  *   **Non-Constructive Proofs:** While they don't provide an instance, they *do* provide **explanation** and **understanding**. They reveal a logical structure (e.g., "If *all* X were not Y, we'd get a contradiction with Z fundamental principle"). They fit into a rich conceptual framework (e.g., compactness, completeness, Zorn's Lemma) that mathematicians understand deeply and can wield as *equipment*. The "why" is clear, even if the "what" (a specific object) isn't produced.
  *   **Long Human Proofs (e.g., CFSG):**
      *   **Modularity & Communal Surveyability:** While no single person may know *all* details, many experts understand *large, meaningful chunks* (entire subtheories or major steps). Confidence arises from the *network* of experts understanding overlapping parts and the conceptual coherence of the overall strategy.
      *   **Explanation Embedded:** The length often stems from detailed justification of complex steps *using familiar mathematical concepts*. It provides a roadmap others can follow, even if arduously. It's *equipment* for the initiated.
      *   **Social Process:** Acceptance involves intense peer review focused on conceptual steps, not just verification. The proof narrative itself is inspected.

  ### Why Constructivism Isn't the Core Issue
  You're correct. Classical mathematics thrives on non-constructive methods. The discomfort isn't primarily about constructivism (requiring explicit witnesses) or intuitionism (truth=provability-by-us). It's about **epistemic utility**. A classical non-constructive proof *can* be highly explanatory and provide conceptual equipment. A constructive computer proof (like a massive case enumeration) might provide a witness but offer little insight. The translation to constructive systems doesn't automatically generate the desired understanding; it just provides a different (often more complex) verification certificate.

  ### Underdetermination of the Practice
  The practice doesn't *strictly require* one single philosophical theory. It's compatible with:
  1.  **Social Epistemology (De Millo, Lipton):** Proofs function as *persuasive narratives* within a community. Computer proofs are less persuasive narratives. Long human proofs are complex narratives sustained by communal trust.
  2.  **Instrumentalism:** Proofs are tools for generating reliable knowledge and enabling further mathematics. Computer proofs are reliable tools for verification but poor tools for understanding and generating new ideas.
  3.  **Pluralism about Proof (Manders, Avigad):** Different types of proofs serve different functions. The community values proofs that serve multiple functions highly.

  However, the practice **is not well-explained by**:
  *   **Strict Formalism (Proof = Symbol Manipulation):** This would make verified computer proofs perfectly acceptable endpoints. The lingering desire for human proofs shows formalism doesn't capture the full practice.
  *   **Naive Surveyability:** The acceptance of long human proofs shows that "surveyable by one mind" isn't necessary; "communal conceptual grasp" is the real aim.

  ### What Would Change If We Dropped the Presupposition (Prioritized Certificate Only)?
  If proof-as-certificate became the *sole* standard:
  1.  **Articles Become Release Notes/Verification Reports:** Papers would state the theorem and describe the verification process (algorithm used, software stack, verification conditions met). Mathematical depth would be irrelevant.
  2.  **Loss of Epistemic Value:** The connection between proofs and *understanding* would atrophy. Results would be "black boxes" – known true, but offering no insight, no new techniques, no deeper grasp of mathematical structures. Progress might stall as mathematicians couldn't effectively build *conceptually* on prior work.
  3.  **Shift in Skill Valuation:** Expertise in algorithm design, software verification, and formal logic would dominate. Skills in conceptual synthesis, abstraction, identifying deep connections, and explanatory writing would diminish in importance.
  4.  **Potential for Fragmentation:** Mathematics could splinter into subfields defined by their preferred verification tools, with reduced cross-communication due to lack of shared conceptual understanding.
  5.  **Loss of Aesthetic Dimension:** The beauty and elegance prized by mathematicians would become purely subjective, disconnected from the proof's core function.

  ### What Would Remain? Status Hierarchy vs. Real Loss
  While some hierarchical aspects might shift (e.g., formal verification experts gain status), dismissing the need for explanation/equipment would cause a **real, substantive loss**. Mathematics thrives not just on knowing *that* things are true, but on understanding *why* and using that understanding to explore further. Proofs are the primary vehicle for transmitting mathematical insight and technique across generations and specialties. Reducing them to certificates would sever this vital function, impoverishing mathematics as a living, evolving body of human knowledge and intellectual exploration. The "status hierarchy" around elegant proofs exists partly *because* elegance often correlates strongly with deep conceptual insight and utility as equipment.

  **In essence:** Mathematicians implicitly treat proof as a *vehicle for knowledge transfer and conceptual innovation*, not just truth-verification. Computer proofs often fail as vehicles, even when they succeed as verifiers. The hunt for human proofs is the hunt for understanding, not merely a rejection of the certificate. The loss wouldn't just be hierarchical; it would be a loss of mathematics' capacity for deep, cumulative, human-driven insight.
