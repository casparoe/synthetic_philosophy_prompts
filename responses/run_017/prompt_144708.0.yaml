answer: |-
  Here is a purpose-built case study meeting your specifications:

  **Scenario (246 words):**
  The Maritime Museum cares for the historic ketch *Dawn Treader*, built 1890. A 1925 bequest stipulates an annual £20,000 disbursement specifically for the "preservation of the original vessel *Dawn Treader*" only if the vessel retains "significant original fabric." The bequest requires certification by the museum's committee by December 31st, 2025, based on the vessel's state *as of that date*. Recent archival research uncovered forgotten 1943 shipyard records revealing that during wartime service, *Dawn Treader* suffered severe hull damage. To return it to duty quickly, the entire hull planking, frames, and keel were replaced in a single dry-dock period using new timber, while the original deckhouse, rigging, and fittings were retained and reinstalled. This rebuild was not widely publicized, and post-war, the vessel re-entered civilian life, continuously registered, maintained, sailed, and celebrated as the *Dawn Treader* until acquired by the museum in 1980. The museum has since presented it as the "original 1890 *Dawn Treader*" in exhibitions and ceremonies. The 2025 disbursement hinges on the committee determining, based on the newly discovered 1943 records, whether the vessel today qualifies as retaining "significant original fabric" per the bequest's terms.

  **Three Accounts & Verdicts:**

  1.  **Continuity-of-Role Account:**
      *   **Verdict:** Yes, the *Dawn Treader* persists. The vessel continuously fulfilled its role – maintained, repaired, registered, sailed, and treated as the *Dawn Treader* before, during, and after the 1943 rebuild. Its functional and social identity was unbroken.
      *   **Ceased to Exist?** Never ceased to exist.
      *   **Implications:** The decades of maintenance, registration, ceremony, and narrative are entirely valid, confirming the vessel's continuous identity. The role *was* the identity.
      *   **Committee Action:** Certify it qualifies. The bequest's "original vessel" refers to the continuous entity fulfilling the role of *Dawn Treader*, which it has always done. The fabric condition is secondary to the unbroken existence.

  2.  **Matter-Tracking Account (Threshold: Structurally Essential Members - Keel & Frames):**
      *   **Threshold Justification:** The keel and primary frames form the structural backbone defining the hull's shape, strength, and fundamental identity in wooden ship construction. Replacing these is not mere repair but reconstitution. This is non-arbitrary as it reflects the core elements determining the vessel's basic form and structural essence.
      *   **Verdict:** No, the original *Dawn Treader* does not persist. The 1943 replacement of the keel and all frames constituted the loss of the essential structural core. The vessel present since 1943 is a successor.
      *   **Ceased to Exist?** Ceased to exist in 1943 during the rebuild.
      *   **Implications:** Post-1943 activities (maintenance, registration, ceremony, narrative) were mistakenly applied to a distinct physical object, though understandably due to the lost records. They concerned a *different* vessel sharing the name and some original non-structural parts.
      *   **Committee Action:** Cannot certify it qualifies. The vessel today lacks "significant original fabric" *of the original 1890 structure* because its essential structural core is entirely post-1943. The bequest requires the persistence of the specific 1890 object, which ended in 1943.

  3.  **Four-Dimensionalist/Conventionalist Account:**
      *   **Verdict:** Whether "the *Dawn Treader*" refers to the entire worm (1890-present), the pre-1943 segment, or the post-1943 segment is a matter of convention or interest, not a discovered fact. There are multiple candidate spacetime worms.
      *   **Ceased to Exist?** Temporal parts exist at all times. The question of "the original vessel ceasing" is ill-formed; different temporal stages exist. The 1943 stage marks a significant phase change.
      *   **Implications:** The decades of activity apply to the relevant temporal stages. The narrative and ceremonies successfully linked the stages into a conventional whole for cultural purposes, regardless of material changes.
      *   **Committee Action:** Recommend certifying based on practical/conventional grounds. The *convention* for decades, reinforced by continuous identity practices (registration, narrative), has been to treat the vessel as a single entity persisting through changes. The bequest's intent likely aligns with this conventional identity, not a strict materialist view suddenly imposed by rediscovered records. Denying the funds disrupts the established convention without practical benefit.

  **Honest Accounting:**

  1.  **The Feature Doing the Work:** The **forgotten, total replacement of the essential structural core (keel & frames) in 1943**, only discovered later via audit, combined with the **continuous functional/social role** maintained since then. This creates the tension between material essence and functional continuity *revealed purely epistemically*.
  2.  **Degeneration if Feature Removed:**
      *   If the threshold was never crossed (e.g., only planking replaced, keel/frames original): Matter-tracking and Continuity-of-Role agree ("Yes"). Four-Dimensionalism still sees convention, but no conflict.
      *   If the threshold was crossed in a single visible night (e.g., ceremonial keel replacement): The epistemic surprise vanishes. Continuity-of-Role might be strained (did the role truly continue *during* the ceremony?), Matter-tracking clearly says "ceased," Four-Dimensionalism focuses on the convention established *after* the event. Conflict remains but is less philosophically sharp regarding epistemic discovery.
  3.  **View Coming Off Worst & Defense:** The **Matter-Tracking Account** comes off worst. Its verdict seems to render decades of genuine cultural practice and investment (maintenance, ceremonies, public understanding) fundamentally mistaken, applying to the "wrong" object, solely due to a forgotten historical fact with no practical consequence until the audit. Its defender would argue: "The harshness is the *point*. Identity grounded in matter is objective, independent of belief or function. The bequest specifies the *original material object*. Sentiment and convention cannot magic its destroyed core back into existence. The committee's duty is to the letter of the bequest based on physical facts, however inconvenient."
  4.  **Vagueness/Merely Verbal?** Appeals to vagueness ("what counts as 'significant' fabric?") or it being merely verbal are **a change of subject, not a solution**. The bequest creates a binary condition with real financial consequences: either the vessel qualifies for the £20k *this year* or it does not, based on its state *today* interpreted through the bequest's terms. While "ship" might be vague, the committee must decide *this specific question* under *these specific terms*. Saying "it's vague" avoids the mandated decision. Saying "it's merely verbal" ignores that real money and legal obligations hinge on which verbal description applies. The committee *must* answer "yes" or "no" to the certification.
