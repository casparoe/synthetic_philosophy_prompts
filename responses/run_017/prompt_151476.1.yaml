  Biggest insight: This case actually challenges the process/outcome dichotomy. The real failure was upstream - treating hiring as a prediction task rather than a normative design problem. Neither supervision mode fixes that. If I were debating their coworker, I'd argue this shows supervision distinctions only matter after you've defined the right objective.

  Confidence level: Medium-high on outcome analysis (well-documented pattern), low-medium on process claims (too speculative). The biggest uncertainty is Amazon's actual debiasing attempts - if they'd done sophisticated adversarial training, my "proxy persistence" argument weakens.

