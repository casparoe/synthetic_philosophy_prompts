  For the outcome-based analysis: The core failure was optimizing for historical hiring patterns without questioning their validity as ground truth. A proper outcome supervisor would've needed to either a) validate labels against actual job performance (impossible retroactively) or b) detect proxy discrimination via rigorous bias testing earlier. But public reports suggest they only tested explicit gender terms, not latent patterns.

