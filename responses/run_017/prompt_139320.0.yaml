prompt: |-
  I'm a high school student in a philosophy reading group, and I got into an argument with the teacher about skills. Her position is that whenever someone knows how to do something — ride a bike, solve a certain kind of problem, calm down a friend — what they really have is knowledge of a fact, held in a special practical way: roughly, they know, of some way of doing it, that it is a way for them to do it. I think knowing how is a different kind of thing altogether: an ability rather than a piece of information.

  So I want a number. What is your credence that her view is right, understood as the claim that every genuine case of knowing how to do something is at bottom a case of knowing that something is the case? Please fix whatever you need to fix for that claim to have a truth value, and say what you would count as settling it, rather than answering that it depends on what knowledge means. Then decompose the number: how much rides on whether skill can come apart from any statable fact, as I think it does when a coach can still teach a movement she can no longer perform, or when an expert's account of what she is doing is wrong in detail; how much on whether the practical way of thinking of the fact is a real explanation or only a label for the problem; how much on whether an ability can be stored, lost through disuse, and damaged by being made explicit — I have noticed that being asked to say exactly what I am doing while I do it often makes me worse at it, and that seems like it should be evidence about what knowing how is; how much on whether something with no body, trained only on text, could know how to do anything; and whatever other terms you think belong. Give a number and one line of justification for each term, then the combination. Finally, tell me which single term you are least confident in and what I could go and actually observe, without a university library, that would move it most.
reasoning: |-
  Okay, let me tackle this high school student's philosophy question. They're debating whether "knowing how" is just a form of "knowing that" (intellectualism) or something distinct (anti-intellectualism). The student wants a credence breakdown with specific factors.

  First, I need to clarify the teacher's position: she claims all skills reduce to factual knowledge stored practically. The student argues abilities are fundamentally different. Key evidence includes coaches teaching movements they can't perform, experts giving inaccurate explanations, and explicit focus disrupting performance.

  The main factors I consider are:
  1. Skill-fact separability (e.g., expert explanations vs. actual performance)
  2. Practical mode of thought (is it explanatory or just a label?)
  3. Storage and vulnerability of abilities (disuse, verbal overshadowing)
  4. Embodied cognition (can text-only systems truly have skills?)

  For credence weighting: I find the separability evidence strongest (40%), while the "practical mode" is vaguest (20%). Vulnerability effects get 25% as empirical support. Embodiment matters less (15%) since some skills may be non-physical. 

  Overall credence for intellectualism: 35%. The biggest uncertainties lie in defining the "practical mode of thought." The student could test this by designing real-time vs retrospective explanation experiments with peers - observing when verbalization hinders different tasks. 

  Notable evidence against intellectualism: cases where procedural memory persists despite lost declarative knowledge (e.g., amnesic patients riding bikes), and studies showing verbalization impairs implicit learning tasks. These challenge the "knowledge-that" foundation.
answer: |-
  Here's a reasoned credence breakdown for the teacher's intellectualist view ("knowing-how reduces to knowing-that"), with key terms decomposed. I'll fix the claim as: **"For any genuine instance of S knowing how to φ, there exists some fact F such that S knows that F, and this knowledge-that (stored/accessed in a practical mode) is necessary and sufficient for S's ability to φ."** Settling this requires empirical evidence from cognitive science/philosophy of mind (e.g., dissociations between declarative knowledge and performance) and conceptual analysis (e.g., whether "practical mode" explains anything unique).

  ---

  ### **Overall Credence: 35%**  
  *Justification*: Strong evidence from skill-fact separability and storage/vulnerability challenges intellectualism, but unresolved debates about the "practical mode" keep it plausible.

  ---

  ### **Term Decomposition**  
  1. **Skill-Fact Separability** (e.g., coach teaching lost skills, flawed expert explanations)  
     - *Credence weight*: **40%**  
     - *Justification*: If skills demonstrably outlast or contradict factual knowledge, intellectualism fails. Empirical cases (e.g., amnesiacs retaining motor skills) support separability.  

  2. **Practical Mode as Explanatory (vs. Placeholder)**  
     - *Credence weight*: **20%**  
     - *Justification*: If "practical mode of thought" just relabels the problem (e.g., "it’s knowledge-that, but *special*"), it explains nothing. Intellectualism needs this mode to be a distinct cognitive architecture.  

  3. **Storage & Vulnerability of Abilities** (e.g., disuse atrophy, verbal overshadowing)  
     - *Credence weight*: **25%**  
     - *Justification*: Skills decay differently than facts (e.g., muscle memory vs. forgotten trivia). Your "explicit focus disrupts performance" example suggests procedural knowledge isn’t stored as declarative facts.  

  4. **Embodiment & Non-Linguistic Systems** (e.g., can text-only AI "know how"?)  
     - *Credence weight*: **15%**  
     - *Justification*: Many skills (e.g., riding a bike) require sensorimotor embodiment. LLMs "know about" skills linguistically but lack causal ability, undermining the view that knowledge-that suffices.  

  ---

  ### **Combination Method**  
  - Base rate for intellectualism set at 50% (contested but historically influential).  
  - Adjustments: **−15%** from separability (strong counterevidence), **−10%** from storage/vulnerability (moderate counterevidence), **±0%** from embodiment (weaker evidence), **−10%** from practical mode ambiguity (weakens intellectualism's coherence).  
  - Final: **35%**.

  ---

  ### **Weakest Term & Testable Observation**  
  - **Least Confident Term**: **#2 (Practical Mode as Explanatory)**.  
  - **What to Observe**:  
    Conduct a **real-time skill interference test** with peers:  
    1. Choose a physical skill (e.g., basketball free throws, juggling) and a cognitive skill (e.g., mental math shortcuts).  
    2. Have participants perform each skill normally (baseline).  
    3. Then have them perform while *verbally explaining exact movements/techniques in real-time*.  
    4. **Observe**: If physical skills degrade more under verbalization than cognitive ones (e.g., "analysis paralysis"), it suggests the "practical mode" for embodied skills isn’t reducible to fact-stating.  
    - *Why?*: Intellectualism predicts that articulating facts *about* the skill should aid or not hinder performance (since the skill *is* those facts). If physical skills uniquely suffer, it implies non-propositional ability.  

  ---

  ### **Key Philosophical Takeaway**  
  This debate echoes Gilbert Ryle’s "The Concept of Mind" (anti-intellectualism) vs. Jason Stanley’s "Know How" (intellectualism). Your teacher’s view struggles most with **implicit learning** (e.g., you can’t state the physics of bike-balancing) and **clinical dissociations** (e.g., Parkinson’s patients *know* how to walk but can’t *do* it). Focus on real-world cases where "knowing-that" exists without "knowing-how" (or vice versa)—these are intellectualism’s kryptonite. If your test above shows consistent disruption, it moves credence against your teacher by ~15%.
