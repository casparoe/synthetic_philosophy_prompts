prompt: |-
  I edit — really I'm the only paid person on — a volunteer-run digital edition of the papers of a nineteenth-century naturalist and amateur geologist, mostly letters, field notebooks, and a pile of things he wrote twice because he moved between Welsh and English depending on who he was writing to. We publish plain text with footnotes, and people quote us constantly without reading the footnotes: our pages get copy-pasted into genealogy forums, local-history blogs, and lately into argumentative threads about who discovered what, always stripped of everything below the line. The volunteers are retired teachers and local-history buffs with no theory background at all, they get about fifteen minutes per letter, everything goes past a two-person editorial board, and there's also a family liaison — his great-granddaughter, who is also our single largest donor — who gets to see any note that touches on the family.

  The thing I keep loosing arguments about is what a passage means. Our house rule has always been "print what he wrote, don't guess at what he meant," and it's coming apart on four recurring situations. One: he often wrote the same report twice, and the English version quietly drops a claim the Welsh version makes, so we have to decide whether the dropped claim is part of what he meant or just something he left out for that audience. Two: in his last decade his eyes were bad and he dictated to his daughter, who "tidied" his prose — in one letter she turned "not uncommon" into "common," which the local paper later quoted as a much stronger finding than he'd made. Three: there are marginal notes in a different ink, added years later, that flatly contradict what the letter says, and I don't know whether a later annotation is part of his meaning or a second, later text. Four: some letters to his sister are in a private cipher the two of them invented, so the intended reader was exactly one person who had the key.

  So I want a decision procedure, not an essay. Something with ordered questions, a clear statement of what counts as a sufficient answer to each question, a point where the procedure stops and says no (don't emend, don't annotate, don't adjudicate — print and flag), and a point where it hands the thing to a person because the question is one of values rather than evidence. The bit I most need help with is that I think we've been conflating several different things and calling all of them "meaning": what the words mean, what he was trying to say, what he was trying to get his reader to take away, what a competent reader at the time would have taken it to mean, and what he would have said if you'd been able to stop him in the hall and ask. I suspect these come apart and that different ones should govern different jobs — emending a word, writing a note, translating, deciding the title and tags on the page, deciding whether to print a passage at all — but I can't get it straight in my head, and I need it in language a retired geography teacher can run in fifteen minutes. Please also be straight about which steps are judgment calls dressed up as procedure.

  Then run it on three of the cases above (your pick of which three, or all four if you want): the Welsh/English pair, the daughter's "not uncommon," and the later marginalia. Include at least one case where the procedure gives an answer I won't like and will have to defend to the donor. And tell me plainly what the procedure can't do — where it will produce a false confidence, and what I should keep doing by argument and taste instead.
reasoning: |-
  Hmm, the user is the sole paid editor for a volunteer-run digital edition of a 19th-century naturalist's papers. They're struggling with how to handle ambiguous meaning in texts, especially with recurring issues like bilingual discrepancies, editorial interference by family members, later contradictory annotations, and private ciphers. They need a practical decision procedure—not theoretical—that volunteers can apply quickly, with clear stopping rules and acknowledgment of where judgment is unavoidable.

  The core problem seems to be conflating different types of "meaning": textual, authorial intent, perceived impact, and retrospective reinterpretation. The user explicitly wants this disentangled for specific editorial actions (emendation, annotation, etc.). There's also tension between academic rigor and practical constraints (15-minute volunteer reviews, donor/family sensitivities).

  Key pain points:
  - **Bilingual texts**: Different content in Welsh/English versions raises questions about authorial intent vs. audience adaptation.
  - **Dictation edits**: The daughter's "tidying" altered meaning (e.g., "not uncommon" → "common"), leading to misquotation.
  - **Later annotations**: Marginalia contradicting original text creates ambiguity about whether to treat them as corrections or separate statements.
  - **Private cipher**: Letters decipherable only by the recipient complicate accessibility vs. authenticity.

  The user needs:
  1. A flowchart-like procedure with binary outcomes.
  2. Explicit "stop and flag" thresholds.
  3. Distinction between evidence-based decisions and value judgments.
  4. Real-world application to their cases (especially one that'll annoy the donor).
  5. Honesty about procedural limits/false confidence risks.

  Unspoken tensions:
  - **Donor influence**: The great-granddaughter's role might pressure against highlighting ambiguities that make the ancestor look inconsistent.
  - **Volunteer capacity**: Non-specialists need idiot-proof rules to avoid interpretive overreach.
  - **Misuse risk**: Third parties stripping footnotes exacerbates responsibility for "correct" interpretation.

  My approach:
  - Build a decision tree separating *text stabilization* (what's on the page) from *interpretation* (what it signifies).
  - For each editorial action (emend/annotate/flag), define triggers based on evidence type (physical, linguistic, contextual).
  - Force hard stops when evidence is equivocal.
  - Apply to three cases: Welsh/English (donor friction potential), daughter's edit (clear error), marginalia (temporal ambiguity).
  - Highlight where the procedure *can't* resolve human choices (e.g., "which version reflects 'true' intent?").

  Critical insight: The procedure’s job isn’t to discover truth but to manage uncertainty transparently. The real win is constraining volunteer overinterpretation while making omissions defensible.
answer: |-
  Here's a decision procedure designed for clarity, defensibility, and speed. It separates "meaning" into distinct editorial tasks and forces hard stops when evidence is ambiguous. **Bold terms** are key concepts for volunteers.

  ---

  ### **Decision Procedure: Interpreting Ambiguous Passages**
  **Core Principle:** *Your job is to stabilize the text and flag uncertainty, NOT to decide what the author "really meant."*

  #### **Ordered Questions & Actions**
  1.  **IS THE PHYSICAL TEXT UNCLEAR?** (e.g., smudged ink, torn page, cipher)
      *   **Question:** Can the *letters/words* be read confidently?
      *   **Sufficient Answer:** YES (Clear image, legible handwriting, cipher key exists) OR NO (Illegible, key lost).
      *   **Action:**
          *   YES ➔ Go to Question 2.
          *   NO ➔ **STOP & FLAG.** Transcribe as `[illegible]` or `[cipher: untranslated]`. Add footnote: "Original text is physically unclear/untranslatable." *Do not guess.*
      *   *Judgement Call:* Deciding "confidently" legible. When unsure, lean towards NO.

  2.  **IS THERE AN OBVIOUS SCRIBAL ERROR?** (e.g., misspelling, duplicated word, grammatical nonsense *in context*)
      *   **Question:** Does the text *as written* violate basic grammar/spelling conventions *the author consistently follows elsewhere*, creating nonsense?
      *   **Sufficient Answer:** YES (e.g., "the the rock", "sediemntary" where "sedimentary" is always used) OR NO (e.g., unusual phrasing but grammatically possible, dialect).
      *   **Action:**
          *   YES ➔ **Emend.** Correct the error silently *in the main text*. Add footnote: "`[Original: 'sediemntary']` Emended for clarity." Cite parallel examples if possible.
          *   NO ➔ Go to Question 3.
      *   *Judgement Call:* Defining "obvious" error and "consistent convention." Stick to mechanics (spelling, basic grammar), *not* meaning.

  3.  **IS THERE A MATERIAL VARIANT BETWEEN VERSIONS/ANNOTATIONS?** (e.g., Welsh vs. English, original vs. dictated, original text vs. later marginalia)
      *   **Question:** Does another *authoritative* version of this text (or a later addition *by the author*) say something significantly different *in substance*?
      *   **Sufficient Answer:** YES (e.g., claim present in Welsh, absent in English; "not uncommon" vs. "common"; marginal note contradicts body text) OR NO (e.g., minor rephrasing without substance change).
      *   **Action:**
          *   YES ➔ **STOP & FLAG (Variant).** Transcribe *both* the main text *and* the variant. Use clear typography (e.g., `[Dictated: "common"]` / `[Marginalia (1890): "This was incorrect"]`). Add a footnote: "Significant variant exists: [Briefly describe variant & source]. Editorial interpretation is suspended." *Do not choose a "correct" version.*
          *   NO ➔ Go to Question 4.
      *   *Judgement Call:* Defining "significantly different in substance." Focus on factual claims, core assertions, key descriptors. Ignore stylistic differences.

  4.  **IS THE WORDING AMBIGUOUS TO A MODERN SCHOLAR?** (e.g., archaic term, unclear referent, potential double meaning *in context*)
      *   **Question:** Could a knowledgeable reader *today* reasonably interpret this passage in more than one way based on the words themselves and their common usage *at the time of writing*?
      *   **Sufficient Answer:** YES (e.g., "cleavage" meaning mineral property or splitting rock; pronoun with unclear antecedent) OR NO (e.g., "granite" meaning the igneous rock).
      *   **Action:**
          *   YES ➔ **Annotate (Clarify).** Add a footnote: "The term/phrase '[quoted text]' could be interpreted as [Interpretation A] or [Interpretation B] based on [brief reason, e.g., contemporary usage, context]." *Do not state which is correct.*
          *   NO ➔ **No action needed.** Publish the text as is. Interpretation is the reader's job.
      *   *Judgement Call:* Defining "reasonable interpretation" and "knowledgeable reader." Requires checking a reliable period dictionary/glossary if unsure. *This is about word meaning, not authorial intent.*

  #### **Hand-Off to Humans (Values Questions)**
  *   **STOP & CONSULT EDITORIAL BOARD + DONOR LIAISON** for decisions involving:
      *   **Omission:** Should a passage *not* be published at all (e.g., sensitive family gossip in cipher, libelous claim)? (Procedure only addresses *how* to publish existing text).
      *   **Interpretive Framing:** What should the title/tags/metadata emphasize? (Procedure ensures text is stable; framing is subjective).
      *   **Resolving Variants for Synthesis:** If a single *interpretive* narrative *must* be presented (e.g., in a summary biography), *which* variant takes precedence? (Procedure flags variants; choosing one is a values-based scholarly argument).

  ---

  ### **Procedure Applied to Your Cases**

  #### **Case 1: Welsh/English Report Pair (Claim in Welsh, absent in English)**
  1.  **Physical Text Clear?** YES. (Assuming legible manuscripts).
  2.  **Obvious Scribal Error?** NO. (Omission isn't an error).
  3.  **Material Variant?** **YES.** The claim's presence vs. absence is a significant substantive difference between authoritative versions.
  4.  **Action:** **STOP & FLAG (Variant).**
      *   Publish *both* reports.
      *   In the English report, add a footnote where the claim *would* be expected: "Cf. Welsh report dated [Date], which includes: '[Brief quote/paraphrase of claim]'."
      *   In the Welsh report, footnote the claim: "This claim is absent from the English report dated [Date] intended for [Audience]."
      *   Footnote in both: "The reason for the discrepancy (authorial revision, audience consideration, error) is unclear. Both versions are presented as written." *Do not speculate why it was dropped.*

  #### **Case 2: Dictated Letter ("not uncommon" vs. "common")**
  1.  **Physical Text Clear?** YES. (Assuming clean dictated copy).
  2.  **Obvious Scribal Error?** **YES.** The author's consistent phrasing ("not uncommon" = "somewhat common") was replaced by a phrase ("common" = "frequent") altering the *factual strength* of the claim. This violates the author's established pattern of expression for this concept.
  3.  **Action:** **Emend.**
      *   Change "common" in the main text back to "not uncommon".
      *   Footnote: "`[Original dictated text: 'common']` Emended to 'not uncommon'. The author consistently used 'not uncommon' elsewhere [cite examples if possible, e.g., earlier notebooks] to denote frequency. The dictated change appears to be a substantive alteration by the amanuensis."
      *   *Rationale:* This corrects an introduced error in the *textual record* (scribal intervention changing the words), not the meaning. The footnote alerts readers to the change and its impact.

  #### **Case 3: Later Contradictory Marginalia**
  1.  **Physical Text Clear?** YES. (Assuming legible main text and annotation).
  2.  **Obvious Scribal Error?** NO. (Original text wasn't in error when written; marginalia is a later addition).
  3.  **Material Variant?** **YES.** The later marginal note flatly contradicts the original text. This is a significant substantive difference between the original authoritative text and a later authoritative annotation *by the same author*.
  4.  **Action:** **STOP & FLAG (Variant).**
      *   Transcribe the original letter text.
      *   Insert the marginal note clearly at the relevant point: `[Marginal Note (Est. Year): "Contradiction: e.g., 'This was mistaken.'"]`
      *   Add a footnote: "Authorial annotation added approximately [Year] contradicts the original (c. [Year]) text. This represents a later perspective. Editorial interpretation of the relationship between the original statement and the later correction is suspended. Both texts are presented." *Do not state which is "correct".*

  #### **Case the Procedure Won't Like (And You Must Defend): Later Marginalia**
  *   **Why you won't like it:** The donor/family liaison might *want* the marginalia to be treated as the definitive "correction," overriding the original. The procedure **forces you to present both as equally valid textual artifacts** separated by time. This highlights the author's potential change of mind or error, which might feel uncomfortable.
  *   **How to defend it (to Donor/Board):**
      1.  **Evidence:** "The procedure flags this because we have *two distinct texts* by the author: the original letter and a later note. Both are part of his record. Silencing the original or presenting the note as the 'true' meaning erases the historical fact of the original statement and its context."
      2.  **Integrity:** "Our core rule is 'print what he wrote, when he wrote it.' This shows his thinking evolved. Hiding the original would be dishonest to the historical record and the readers who rely on us."
      3.  **Neutrality:** "We are not judging *why* he changed his mind or if he was right/wrong. We are showing *that* he did. Readers (scholars, historians) are equipped to analyze this evolution."
      4.  **Donor Value:** "Presenting this complexity actually honors his intellectual journey and the full scope of his work, showing he re-evaluated ideas. Suppressing it risks someone else discovering the discrepancy later and questioning our edition's reliability."

  ---

  ### **What the Procedure CANNOT Do (False Confidence & Required Judgment)**

  1.  **Determine Authorial Intent:** It *cannot* tell you what the author "meant to say" or "would say if asked." It only stabilizes the text and flags variants/ambiguities. *Intent remains speculative.*
  2.  **Resolve Competing Interpretations of Ambiguity:** While it flags ambiguity (Q4), it *cannot* say which interpretation is "correct." The footnote presents possibilities; choosing one is a scholarly argument outside the procedure.
  3.  **Assign Value or Significance:** It *cannot* tell you if a variant is "important" beyond being substantively different (Q3), or if an ambiguous phrase is "central" to the document. Significance is judged by editors/readers.
  4.  **Handle "Competent Reader" Meaning Reliably:** Reconstructing what a contemporary reader "would have taken away" (Q4) relies on editors' knowledge of context and is inherently interpretive. The procedure limits this to flagging *linguistic* ambiguity based on period usage sources, not reconstructing reception.
  5.  **Fix Inadequate Evidence:** If key context is missing (e.g., *why* the claim was dropped in the English report), the procedure flags the variant but *cannot* fill the gap. False confidence arises if editors mistake a flagged variant footnote for an explanation.
  6.  **Replace Editorial Synthesis:** For projects *beyond* publishing the raw texts (e.g., writing biographical summaries, thematic analyses), the procedure only provides stabilized source material. Synthesizing meaning from conflicting sources requires human judgment and argument.

  **Where Argument and Taste Still Rule:**
  *   **Setting Metadata/Tags/Titles:** Framing how a document is discovered and initially understood.
  *   **Deciding Scope/Inclusion:** Which documents are included in the edition (though *how* they are published follows the procedure).
  *   **Writing Introductory/Contextual Essays:** Providing historical background, biographical notes, or thematic overviews *interpreting* the corpus.
  *   **Resolving Variants for Specific Purposes:** If creating an annotated "reader" version selecting *one* reading, this requires scholarly justification beyond the procedure.
  *   **Prioritizing Volunteer Effort:** Deciding which ambiguous passages warrant deeper (but time-limited) dictionary/context checks in Q4.

  **Key Volunteer Mantra:** "My job is to fix obvious errors and show where things are unclear or changed. I don't have to solve the mystery, just point it out honestly." This procedure gives them concrete, limited tasks and clear off-ramps to avoid over-interpretation. The hard choices about framing and significance remain with you and the editorial board.
