  Here's a decision memo draft addressing your core concerns, incorporating your "two-track" approach while giving fair weight to opposing views, establishing a standard for future cases, and delivering a clear bottom line:

  ---

  **MEMORANDUM**  
  **TO:** Commemoration Committee Members  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Flats Memorial Grant Application & Text Proposal  

  ### 1. Background & Core Conflict
  The application seeks funding for a permanent memorial at the Flats flood site. Historical research (gate logs, telegraphs, insurance records) conclusively demonstrates the *mechanism* of the flood (levee failure below the Flats, closed/chained gates, no breach order) contradicts the longstanding community narrative of intentional upstream flooding. However, the documented *outcomes* – the disproportionate suffering of Flats residents, denial of compensation, and rezoning preventing rebuilding – align firmly with the community's lived experience and memory. The tension lies in reconciling documented facts with the meaning and injustice embedded in a resilient oral tradition silenced by power structures.

  ### 2. Recommendation: FUND WITH CONDITIONS
  *   **Bottom Line:** Recommend funding approval **contingent on revised marker text** that meets the dual criteria of historical accuracy (per grant requirements) and respectful acknowledgment of the community's lived experience and memory.
  *   **Rationale:** The event is historically significant; the community's trauma and erasure are undeniable facts; the proposed memorial serves a vital public purpose. Funding denial based solely on the narrative discrepancy risks perpetuating historical exclusion. Conditions ensure adherence to evidentiary standards.

  ### 3. Proposed Marker Text Framework (Required Condition)
  The approved text **must** include **both** factual findings **and** the memory's significance:
  *   **What the Record Supports (City Accountability Focus):**  
      *"On [Date], 1913, catastrophic flooding destroyed The Flats neighborhood. Levee failure occurred downstream. City floodgates remained closed and secured. Mill owners received compensation; displaced Flats residents received none. The site was rezoned, preventing rebuilding. This community was erased."*
  *   **What the Memory Embodies (Community Experience Focus):**  
      *"For generations, survivors and their descendants have preserved the memory of the flood as a deliberate sacrifice of their community to protect downtown interests. This belief, sustained for over a century, speaks to the profound injustice experienced and the erasure of their voices from the official record."*

  **Why this works (Addressing the "Dodge"):**
  *   **Not a Dodge, a Nuanced Truth-Telling:** This separates verifiable *events* (gates closed, rezoning) from the *meaning and experience* constructed by the marginalized community. It acknowledges the *fact* of the persistent belief and its *significance* as a response to documented injustice, without endorsing the disproven mechanism. It satisfies the grant's accuracy mandate while honoring why the memory exists.
  *   **Answers the Descendants:** It explicitly validates their core experience of injustice ("erased," "no compensation," "sacrifice") and legitimizes their long-held narrative *as a powerful cultural response to trauma*, even while correcting the technical detail. It frames their belief as evidence of systemic silencing, not error.
  *   **Meets Grant Requirements:** The factual statements are document-based. The statement about the memory is itself a verifiable historical fact (the walk has occurred for 50 years).

  ### 4. Addressing Opposition Views (The "Silencing" Argument)
  *   **The Best Shot:** "Relying solely on records generated by the city, mill owners, and their controlled newspaper inherently privileges the perspective of the powerful institutions responsible for the Flats' erasure. It replicates the original act of silencing by dismissing the community's oral history – formed in response to undeniable injustice – as merely 'incorrect' rather than understanding it as a vital counter-narrative exposing systemic bias in the archive itself. A memorial using only these documents centers the perpetrators' perspective, not the victims' truth."
  *   **Response Within Recommendation:** The proposed text *directly addresses* this critique. It uses the documents to state *outcomes* (injustice, erasure) the community always emphasized, while explicitly naming the power imbalance ("erasure of their voices from the official record") and validating the memory's endurance as a testament to that injustice. It does not let the city/mills off the hook.

  ### 5. Standard for Future Cases
  This case establishes the following standard for evaluating contested commemorations:

  > **"Commemorative interpretations must be grounded in verifiable evidence concerning *events and outcomes*, while respectfully acknowledging the *meaning, experience, and cultural memory* of affected communities, especially those historically marginalized. When discrepancies exist between documented facts and community narratives, the memorial should clearly distinguish factual findings from the significance of the narrative itself, contextualizing its origin and persistence in relation to documented power structures and lived experiences."**

  ### 6. Key Points for Committee Discussion/Circulation
  *   **Accuracy is Achieved:** The factual core (failure location, gate status, compensation disparity, rezoning) is indisputable per the documents.
  *   **Justice is Centered:** The memorial explicitly names the injustice suffered by the Flats residents – the core truth the descendants have always fought to preserve.
  *   **Memory is Honored, Not Erased:** The community's long-held belief is included *as* their historical memory and response to trauma, explaining its persistence.
  *   **Transparency is Paramount:** The text makes clear *why* the narrative discrepancy exists (power imbalance, erasure).
  *   **Practical & Fundable:** This approach meets the grant's accuracy requirement while allowing the memorial to proceed.
  *   **Precedent Set:** The standard provides clear guidance for upcoming cases.

  ---

  **Why this isn't a dodge:** It doesn't avoid the hard truth (the gates weren't opened). Instead, it confronts the *full* truth: the factual events, the documented injustice, *and* the powerful, community-sustained narrative born from that injustice and the silencing of their voices. It uses the documents to prove the injustice the memory insists upon, while explaining the memory's origin. This is rigorous, ethical commemoration.
