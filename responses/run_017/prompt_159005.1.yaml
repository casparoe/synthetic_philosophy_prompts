  3) Opposing views need representation: document purists vs. critical archival theorists
  4) Their "two-track" idea is actually academically sound (Pierre Nora's lieux de mémoire concept)

  Biggest challenge: phrasing that doesn't reduce the descendants' lived truth to "just folklore" while upholding professional standards. The plaque text needs to validate the memory's endurance without endorsing the disproved mechanism. 

  For future cases, the standard should center on: 
  - Verifiable core harms (here, dispossession)
  - Transparency about evidentiary gaps
  - Distinguishing institutional accountability from community meaning

  ...And I should probably cite some social epistemology texts since they're into that. Miranda Fricker on hermeneutical injustice feels relevant.
