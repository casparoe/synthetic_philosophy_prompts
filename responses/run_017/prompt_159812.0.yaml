answer: |-
  ### Classification Instrument: Uncertainty Framework Decision Tree

  Below is a branching decision tree designed to classify authors' uncertainty frameworks based on their responses to practical cases. The tree starts from a commitment any author can recognize (willingness to quantify uncertainty) and uses cases (a) to (g) with minimal modifications. No philosophical terms are used, and each question can be answered in under a minute. The tree has at most 5 questions per path and 12 terminal leaves covering the required positions.

  ---

  #### **Decision Tree**  
  *Start at Node 1 (Case b: Buying and selling)*  

  1. **Node 1 (Case b)**: For a one-off event (e.g., catchment exceeding design flood in 20 years), what do you state for buying/selling a ticket paying 1 unit if it occurs?  
     - **A**: Same number for max buy and min sell price.  
       → Go to Node 2 (Case e: Widening)  
     - **B**: Gap: min sell price strictly higher than max buy price.  
       → Go to Node 3 (Case f: Straddling ranges)  
     - **C**: Won’t give numbers, but will rank this event against others.  
       → Go to Node 4 (Case c: Thin evidence)  
     - **D**: Won’t assign numbers or ranks.  
       → Go to Node 5 (Case d: Two teams)  

  2. **Node 2 (Case e)**: South’s printout probability after North prints 1?  
     - **A**: 0.5 (unchanged from before seeing North).  
       → Go to Node 6 (Case c: Thin evidence)  
     - **B**: Cannot give one number; now less certain (e.g., "anywhere between 0 and 1").  
       → Go to Node 7 (Case f: Straddling ranges)  

  3. **Node 3 (Case f)**: Which intervention (A: [3,9], B: [4,7]) do you recommend?  
     - **A**: The one with the better worst case (B).  
       → Leaf: **Strict Imprecision (Worst-Case)**  
     - **B**: The one with the better best case (A).  
       → Leaf: **Optimism–Pessimism Weighted (OPW)**  
     - **C**: Either is acceptable; choice depends on judgment.  
       → Leaf: **Strict Imprecision (Permissive)**  
     - **D**: Fixed weighting of best and worst cases (e.g., average).  
       → Leaf: **Optimism–Pessimism Weighted (OPW)**  
     - **E**: Defer and commission more work.  
       → Leaf: **Deferral**  
     - **F**: Act on a single most-likely value.  
       → *Inconsistent with Node 1B; flag for follow-up*  

  4. **Node 4 (Case c)**: With thin evidence, what goes in the report?  
     - **A**: A rank vs. other events (e.g., "more likely than a fair coin toss").  
       → Leaf: **Comparative/Ordinal Uncertainty**  
     - **B**: Nothing quantitative.  
       → Go to Node 8 (Case d: Two teams)  

  5. **Node 5 (Case d)**: With two teams reporting 0.3 and 0.7, what do you do?  
     - **A**: Report both with a note on methods/error rates.  
       → Leaf: **Error-Statistical**  
     - **B**: Report nothing.  
       → Leaf: **Radical Non-Quantification**  

  6. **Node 6 (Case c)**: With thin evidence, what goes in the report?  
     - **A**: A single number (e.g., 0.5).  
       → Go to Node 9 (Case f: Straddling ranges)  
     - **B**: A wide but not full interval (e.g., "[0.2, 0.8]").  
       → Go to Node 10 (Role of range)  
     - **C**: The full interval (e.g., "[0, 1]").  
       → Go to Node 10 (Role of range)  

  7. **Node 7 (Case f)**: Which intervention do you recommend?  
     - **A**: The one with the better worst case (B).  
       → Leaf: **Strict Imprecision (Worst-Case)**  
     - **B**: The one with the better best case (A).  
       → Leaf: **Optimism–Pessimism Weighted (OPW)**  
     - **C**: Either is acceptable; choice depends on judgment.  
       → Leaf: **Strict Imprecision (Permissive)**  
     - **D**: Fixed weighting of best and worst cases.  
       → Leaf: **Optimism–Pessimism Weighted (OPW)**  
     - **E**: Defer and commission more work.  
       → Leaf: **Deferral**  

  8. **Node 8 (Case d)**: With two teams reporting 0.3 and 0.7, what do you do?  
     - **A**: Report both with a note on methods/error rates.  
       → Leaf: **Error-Statistical**  
     - **B**: Report nothing.  
       → Leaf: **Radical Non-Quantification**  

  9. **Node 9 (Case f)**: Which intervention do you recommend?  
     - **A**: Act on a single most-likely value.  
       → Leaf: **Strict Precise Probabilism**  
     - **B**: Recommend based on worst/best case or weighting.  
       → *Inconsistent with Node 1A; flag for follow-up*  

  10. **Node 10 (Role of range)**: When you report a range, how is it used in recommendations?  
      - **A**: The range is for context; decisions use a single analysis (e.g., base case).  
        → Leaf: **Robust Sensitivity Analysis**  
      - **B**: The range itself drives the recommendation (e.g., avoids worst cases).  
        → Leaf: **Hierarchical/Second-Order Probabilism**  

  ---

  #### **Terminal Paths to Leaves**  
  | Path (Node Sequence + Answers)        | Leaf                                  | Reporting Imprecision? | Awkward Consequence for Conventions                     |
  |---------------------------------------|---------------------------------------|------------------------|---------------------------------------------------------|
  | 1A → 2A → 6A → 9A                    | Strict Precise Probabilism           | No                     | May obscure true uncertainty; seen as overconfident.    |
  | 1A → 2A → 6B/C → 10A                 | Robust Sensitivity Analysis          | Yes                    | "Laundering": Range is decorative, not deliberative.    |
  | 1A → 2A → 6B/C → 10B                 | Hierarchical/Second-Order Probabilism| No                     | Second-order uncertainty may confuse non-experts.       |
  | 1A → 2B → 7A                         | Strict Imprecision (Worst-Case)      | No                     | Overly conservative; may reject viable options.         |
  | 1A → 2B → 7B/D                       | Optimism–Pessimism Weighted (OPW)    | No                     | Weighting rule is arbitrary; hard to standardize.       |
  | 1A → 2B → 7C                         | Strict Imprecision (Permissive)      | No                     | Fails to guide decisions; leaves users unsupported.     |
  | 1A → 2B → 7E                         | Deferral                             | N/A                    | Paralyzes decisions; undermines assessment purpose.     |
  | 1B → 3A                              | Strict Imprecision (Worst-Case)      | No                     | Overly conservative; may reject viable options.         |
  | 1B → 3B/D                            | Optimism–Pessimism Weighted (OPW)    | No                     | Weighting rule is arbitrary; hard to standardize.       |
  | 1B → 3C                              | Strict Imprecision (Permissive)      | No                     | Fails to guide decisions; leaves users unsupported.     |
  | 1B → 3E                              | Deferral                             | N/A                    | Paralyzes decisions; undermines assessment purpose.     |
  | 1C → 4A                              | Comparative/Ordinal Uncertainty      | N/A                    | Cannot integrate with quantitative cost-benefit models. |
  | 1C/D → 4B/5B → 8A/5A                 | Error-Statistical                    | N/A                    | Cannot assign probabilities to hypotheses; limits policy use. |
  | 1C → 4B → 8B or 1D → 5B              | Radical Non-Quantification           | N/A                    | Assessment appears uninformative; stakeholders dismiss it. |

  **Notes**:  
  - **Reporting vs. Deliberative Imprecision**: Only *Robust Sensitivity Analysis* has reporting imprecision (range published but decision uses single analysis). All others either have no imprecision (e.g., *SPP*) or deliberative imprecision (range drives decision, e.g., *Strict Imprecision*).  
  - **Unnamed Leaves**: None; all logical cells covered.  
  - **View on Publishing Any Number in Range**: Absorbed by *Robust Sensitivity Analysis* (authors may use any number in the range consistently, but the range itself is not deliberative).  
  - **Unseparated Pairs**:  
    - *Strict Precise Probabilism* and *Robust Sensitivity Analysis* both use single values for decisions but are separated by Node 10 (role of range).  
    - *Hierarchical Probabilism* and *Strict Imprecision (Permissive)* both accommodate ambiguity but are separated by Node 1 (gap in betting).  

  ---

  #### **Inconsistent Response Patterns**  
  **Incoherent Combinations**:  
  - **Node 1A + Node 9B**: Willing to bet at a single probability but uses range-driven decisions (e.g., worst-case). *Follow-up*: "You use a range to decide, but bet at one number. How do you reconcile this? If the range matters, why no gap in betting?"  
  - **Node 1B + Node 3F/9B**: Gap in betting but acts on a single value. *Follow-up*: "You avoid committing to one number in betting but do so in decisions. What makes decisions different?"  
  - **Node 1C/D + Quantitative Responses**: Refuses numbers/ranks but later gives them. *Follow-up*: "Earlier you avoided quantification, but now you use it. When is quantification acceptable?"  

  **Workshop Leader Actions**:  
  - Record the inconsistency and ask the follow-up question above.  
  - If unresolved, assign to the closest leaf (e.g., Node 1B + Node 3F → *Strict Precise Probabilism* if they defend single values).  
  - Flag for manual review; may indicate a novel position or confusion.  

  **Diagnostics**:  
  - **Most Awkward Consequence**: Highlighted per leaf in the table (e.g., "laundering" for *RSA*).  
  - **Case e Handling**: Node 2 separates authors who believe evidence can reduce certainty (B) from those who don’t (A).  

  This instrument requires no external references and uses domain-specific cases. Run the workshop by having authors answer aloud, following the tree path to their leaf. Record inconsistencies for discussion.
