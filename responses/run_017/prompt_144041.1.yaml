  The teammate's claim that they "genuinely like" the extra work is complicated by their health issues - chest pains suggest the work may not be as voluntary as claimed. The manager's behavior is particularly concerning as it exploits the situation to avoid necessary hiring.

  What makes this ethically complex is that it's not simple coercion - the teammates seem to choose overtime, but within a system that rewards overwork. The user's efficiency gain shows reduced hours can work if properly staffed. The "free rider" accusation might be misplaced since the user is meeting their contractual obligations; the real issue is others exceeding theirs.

  The user's leisure activities (watching videos) are irrelevant to the ethical calculus - personal time doesn't need productivity justification. The core issues are: exploitation by the company, potential self-exploitation by teammates, and collective harm from normalizing unpaid overtime.

  The most immediate concern should be the health of the teammate with chest pains - that elevates this beyond policy debate to duty of care. Long-term, the system is unsustainable as shown by that health symptom. The manager's complacency creates liability for the company.

  For Monday, the user needs to decide whether to confront the systemic issue (manager's exploitation) or the interpersonal one (teammate's self-harm). Given the health risk, the ethical imperative leans toward intervention, though carefully to avoid alienating teammates who take pride in their work. Documenting the unofficial overtime might be crucial before raising concerns.
answer: |-
  This situation presents **three distinct but interlocking problems**: a structural exploitation problem, a cultural normalization problem, and an interpersonal ethical tension. Your role is not the core issue—it's a symptom of systemic dysfunction. Let's break it down:

  ### 1. **The Structural Problem: Unpaid Labor Subsidizing Company Profit**
     - **What's happening**: Your teammates' unpaid overtime is masking the true resource gap. Your manager is weaponizing this "efficiency" to avoid hiring, effectively converting their voluntary labor into company savings.
     - **Why it matters**: This isn't about individual choices; it’s a **systemic free-ride by the company** on employee goodwill. Your team’s extra hours are an implicit subsidy to the business, depriving it of accurate data to allocate resources.
     - **Your role**: You’re not free-riding on colleagues; you’re **exposing the resource gap** by adhering to policy. If you worked unpaid hours too, you’d help conceal the problem. Your productivity gain proves reduced hours *could* work—*if* staffing matched the workload.

  ### 2. **The Cultural Problem: Work Ethic as Coercion**
     - **The "craft" defense**: Your teammate frames overwork as passion, but his chest pains reveal the truth: **self-exploitation**. His identity is entangled with productivity, making "choice" illusory. This is "karoshi" (Japanese overwork death) logic: personal dedication masking unsustainable systems.
     - **Your leisure needs no justification**: Scrolling videos is valid reclamation of personal time. Your worth isn’t tied to constant production. The demand for "edifying" leisure is a Puritanical trap—rest needs no moral defense.
     - **The silent login trap**: Unmentioned overtime normalizes invisible labor. It creates peer pressure where opting out (like you do) appears deviant, not contractual.

  ### 3. **The Interpersonal Problem: Misplaced Obligation**
     - **You don’t owe your teammate "rescue"**: His claim that covering for you isn’t a burden may be sincere, but it’s also a deflection. Pressuring him to stop would likely backfire. His autonomy must be respected—even when self-destructive.
     - **What you owe: Honesty and solidarity, not complicity**: 
       - Acknowledge his effort: *"I see you logging extra hours—thank you, but please know I don’t expect it."*  
       - Refuse to legitimize the facade: Don’t let the manager’s narrative go unchallenged.
     - **The health emergency**: Chest pains change everything. This transcends ethics—it’s a duty of care. Say privately: *"Your health alarms me. How can we redistribute work so you can rest?"* Frame it as team sustainability.

  ---

  ### **What To Do on Monday: Target the Real Problem**
  Your goal isn’t to "fix" teammates or justify your leisure—it’s to **break the silence enabling exploitation**. Steps:

  1. **Document Quantitatively**:  
     - Track YOUR cases closed/hour vs. pre-35hr rate (proof your model works).  
     - Note the backlog growth when ALL adhere to 35hrs (e.g., holidays).  
     *This isn’t betrayal—it’s exposing reality.*

  2. **Force Transparency Upward**:  
     - Email your manager:  
       > *"Per our 35hr policy, I’ve capped my weekly hours. My output efficiency has increased by X%, but I’ve observed backlog accumulation in my queue until others intervene. To ensure sustainable coverage, can we review staffing needs based on actual hourly capacity—not total output?"*  
     - **Why this works**: Forces acknowledgment of the hours/work mismatch *without accusing colleagues*. Uses data, not emotion.

  3. **Depersonalize the Health Crisis**:  
     - If your teammate dismisses concerns, go to HR/manager:  
       > *"[Teammate] has mentioned chest pains and works significant unpaid overtime. I’m worried about duty-of-care risks if we ignore this."*  
     - **Not** "He’s overworked," but *"Our system enables this—how will you address it?"*

  4. **Reject the "Fifth Person" False Dilemma**:  
     - If manager cites "proof" no hire is needed:  
       > *"Current output relies on unplanned overtime. If we formalize/document those hours to account for them, would that trigger hiring criteria? If not, what’s our plan when unsustainable effort inevitably drops?"*

  ---

  ### **The Core Wrongness**
  You’re caught in a **Kafkaesque inversion**: Your contractual compliance is framed as deviance, while unpaid labor is "dedication." The true free-rider is the company benefiting from hidden work. Your teammate isn’t a victim of *your* choices but of a **system that rewards self-sacrifice with more work**. By stopping at 35 hours, you’re refusing to participate in a race to the bottom—and that’s essential friction.

  **Not one problem, but three layers**:  
  ① **Structural** (company exploiting goodwill),  
  ② **Cultural** (workism masking harm),  
  ③ **Interpersonal** (misplaced guilt vs. duty of care).  

  Address the structure first—the rest follows. Your leverage is your data and your refusal to normalize invisibility.
