prompt: |-
  I spent most of last night arguing with a friend who works for a victims' support NGO about a case our commission is about to hear, and I still can't tell whether our own precedent set settles it or just looks like it does. Her position is that amnesty is, at bottom, a currency the political community spends to buy truth it cannot get any other way, and that once you accept that, the identity of the seller and the purity of the seller's motives are beside the point — what matters is what the disclosure buys for victims and whether immunity is the least the state can give in exchange. My position is that amnesty is constitutively personal: it is something a natural person does when they stand up in a public hearing, avow their own acts, submit to being questioned by the people they harmed, and are judged to have acted with a political objective that a successor society can recognise as political even while condemning it. On her reading a company with a better archive than the state is just a very efficient witness; on mine it is not the kind of thing that can apply at all, and offering it immunity would convert the process from an exchange of accountability for truth into a purchase of information from a party that feels no accountability. I need to write a draft recommendation for the committee by Friday, and I want to know which of us our own track record actually supports.

  Here is the record I have to work with, in the order the decisions came down. One: amnesty granted to a conscript who shot two men at a roadblock, after a full account and a finding that the killings were associated with a political objective. Two: amnesty refused to the section commander above him, who also disclosed everything, on the ground that the raid he ordered was grossly disproportionate to any political objective — the committee called it punitive rather than political. Three: amnesty refused to an applicant who confessed his own role in detail but would not name his handler or point to where the bodies were, the committee holding that full disclosure includes the chain of command and the recovery of remains. Four: amnesty granted, conditionally, to two applicants for a cross-border raid in which all the dead were nationals of a neighbouring state; the conditions were a hearing held in the affected communities and a reparation order, and the reasoning was that the community the act was done to must have a real role in the process. Five: the committee declined to entertain an application from an editor who had incited violence in print but had committed no act himself and whose account told it nothing new, saying that amnesty relieves liability for specific acts and is not available as a declaratory finding of blamelessness for someone with nothing to be relieved of. Six: amnesty granted, over a dissent, to a clerical worker who never used violence but passed lists of names to the security branch, one of which led to a killing; the majority said his account revealed how the informer network actually functioned, which no one above him had explained. Seven: the committee refused to let an applicant's offer to fund a clinic in the affected village count toward his application, saying reparative contributions cannot be traded for amnesty, though it recorded the offer separately in its findings. And there is one internal tension I should flag honestly: in an early decision the committee granted amnesty to a man whose account largely duplicated a police docket, saying the value lay in public corroboration from the perpetrator's own mouth, while in a later one it refused an applicant who had disclosed only what was already in the docket, saying he had told the commission nothing it did not have.

  The case in front of us now is a mining company, Kalkrand Consolidated, which has come in voluntarily and handed over a complete personnel-and-transport archive covering 1978 to 1991. On the company's own account it supplied the security branch with payroll and housing data used to identify union organisers, provided vehicles and a disused compound that it knew was being used for interrogation, and paid a bonus to the liaison officer who made the arrangements; it says expressly that its motive was to protect production and its share price, and that it would have done the same under any government, which is to say it disclaims a political objective rather than claiming one. The archive names two regional commanders who ordered a 1984 massacre at a hostel and gives the burial sites — disclosure no individual applicant has given us in nine years, and which the families say they want more than anything. It offers a large reparations fund and to pay for the exhumations. In return it asks for a finding that it has no further civil liability to the victims' families, for immunity from prosecution for its present board (none of whom were employed by the company before the transition, though two are children of the era's executives), and for its name to be kept out of the section of our final report on those who profited. The dead were mostly migrant workers from the neighbouring state, most are dead, and the survivors are its citizens; that state has just opened its own commission and has written to us asking that no amnesty be granted and that the archive be transferred to it instead. The families are split, some supporting the deal because they want the bodies, some opposing it because they want the executives in court.

  So, three things. First: what are the two or three rules that fit all seven of our precedents equally well, and what does each predict here — I take it one rule makes the grant turn on what the disclosure buys, another on whether the applicant is a natural person who avows their own politically motivated acts, and a third on whether the affected community has had a real role, but I want them stated sharply enough to see where they come apart. Second: give me your best guess at the decision and, more usefully, which precedent is the closest analog and why, together with an honest statement of what principle we would be adopting whichever way we go — including what it means if we take the company's money for exhumations while refusing to count it toward the application. And third: name the single further case that would best tell my friend's rule and mine apart, with what each verdict on it would show us — I have in mind something like the company's former personnel director, now elderly and ill, offering the same archive with a full personal account and agreeing to a public hearing, and also something like a corporation whose records duplicate material we already hold, but I want you to say which of those does the discriminating work and why. If our precedents genuinely underdetermine the case, say so and tell me which of them we would have to overrule or distinguish to go the other way.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're on a commission dealing with amnesty applications and are stuck between two philosophical views: one from their friend at an NGO and their own. The friend sees amnesty as a transactional tool to buy truth, while the user believes it's a personal moral exchange rooted in individual accountability. The user needs to draft a recommendation based on seven precedents and apply it to a mining company, Kalkrand Consolidated, seeking immunity in exchange for valuable archives.

  First, I need to analyze the precedents to extract consistent rules. Looking at Case 1, amnesty was granted to a conscript who confessed and showed political motive. Case 2 refused the commander because the act wasn't political. Case 3 required full disclosure, including chain of command and remains. Case 4 involved conditional amnesty with community involvement. Case 5 denied amnesty to an editor without direct acts. Case 6 granted it to a clerical worker for revealing systemic info. Case 7 rejected reparations as a trade but noted the offer. The internal tension between early and later cases about duplicate info complicates things.

  The key rules emerging are: (1) Personal Avowal of Acts with Political Objective, (2) Full Disclosure with Material Truth Value, and (3) Affected Community's Role in Validation. Rule 1 emphasizes individual accountability and political motive, Rule 2 focuses on the truth gained, and Rule 3 on community participation. 

  Applying these to Kalkrand: Rule 1 fails because the company isn't a natural person and admits no political motive. Rule 2 supports amnesty since the archives provide unprecedented truth. Rule 3 is partially met through reparations but lacks a public hearing element. The closest precedent is Case 6, where the clerical worker's systemic insight justified amnesty despite no direct violence. However, Case 6 still involved an individual, unlike Kalkrand. 

  The user's friend would argue Rule 2 prevails, prioritizing the truth's value. The user would stress Rule 1, making corporate amnesty invalid. To test these, a hypothetical with the elderly personnel director offering the same archive personally could satisfy both rules, revealing if the commission values individual accountability over truth. If they grant amnesty to the director but not the company, Rule 1 holds. If they accept both, Rule 2 dominates. 

  The precedents underdetermine the case since corporate applicants haven't been addressed. Granting amnesty here would extend Case 6's logic to corporations, while denying it aligns with Case 5's focus on personal acts. The user must decide whether to prioritize truth or accountability, acknowledging that accepting reparations without linking them to amnesty (as in Case 7) maintains integrity but might not satisfy the families wanting bodies. 

  The user's deeper struggle is balancing practical gains against philosophical principles. They need clarity on whether the commission's precedent leans transactional or moral, and this case forces that definition. The recommendation will set a significant precedent, so transparency about the values at stake is crucial.
answer: |-
  Based on your precedents and the Kalkrand case, here's a clear analysis structured around your three requests:

  **1. Core Rules Extracted from Precedents:**
     *   **Rule 1 (Personal Avowal & Political Motive):** Amnesty requires a *natural person* to publicly avow *their own specific acts*, submit to questioning, and demonstrate those acts were committed with a *recognizable political objective* (even if condemned). *(Derived from Cases 1, 2, 3, 4, 5, 6; reinforced by denial in 2, 3, 5)*
          *   *Prediction for Kalkrand:* **Denial.** The applicant is a corporation, not a natural person. It acknowledges acts but *disclaims* any political objective ("protect production/share price," "would have done same under any govt"), admitting purely commercial motives incompatible with a "political objective" as defined (cf. Case 2's "punitive" vs political distinction).
     *   **Rule 2 (Material Truth Value & Full Disclosure):** Amnesty requires *full disclosure* of specific acts *and* their context (e.g., chain of command, location of remains) that provides *material truth* not otherwise readily available or publicly corroborated by the perpetrator. Value is judged by what it reveals. *(Derived from Cases 1, 3, 4, 6; reinforced by denial in 3, 5; tension in early/late docket cases highlights "material truth" requirement)*
          *   *Prediction for Kalkrand:* **Grant (Conditionally).** The archive provides unprecedented, specific disclosure (names commanders, burial sites, methods) that victims prioritize and no individual has offered in 9 years. It meets the "full disclosure" test lacking in Case 3 and offers "material truth" beyond mere corroboration (distinguishing later docket case).
     *   **Rule 3 (Affected Community Role & Integrity of Process):** The process must meaningfully involve the *community affected by the specific acts* and maintain integrity. Reparations cannot be traded *for* amnesty, but conditions ensuring community participation can be attached. *(Derived from Cases 4, 7; reinforced by conditional grant in 4 and denial of trade in 7)*
          *   *Prediction for Kalkrand:* **Conditional Grant OR Denial w/ Conditions.** The affected community is foreign (neighboring state) and split. Granting amnesty would preclude their own commission's process (cf. Condition 4 - hearing *in* affected communities). Reparations/exhumations offered but cannot be traded *for* amnesty (Case 7). Conditional grant (e.g., hearing in neighbor state, reparations managed independently) *might* satisfy, but complicates jurisdiction.

  **Where They Come Apart:** Rule 1 fundamentally bars corporate amnesty regardless of truth value (Kalkrand fails). Rule 2 strongly supports amnesty based on truth value (Kalkrand excels). Rule 3 is procedural – it doesn't mandate grant/denial but sets conditions *if* grant occurs under Rule 1 or 2; here, it highlights complications with the foreign community and reinforces that reparations are separate from the amnesty decision itself.

  **2. Predicted Decision, Closest Precedent & Principle Adopted:**
  *   **Best Guess Decision:** **Denial of Amnesty.** The commission's core identity, reinforced by Rule 1 (Personal Avowal & Political Motive), is too strong to overcome, despite the compelling truth value (Rule 2).
  *   **Closest Precedent:** **Case 5 (Editor Denied).** Like the editor, Kalkrand is not a natural person seeking relief for *its own acts* in the constitutive sense defined. While Kalkrand committed acts (unlike the editor), the precedent establishes that the amnesty *mechanism* is designed for natural persons accounting for their *personal* liability and motives. Case 6 (Clerical Worker) is distinct because it involved a natural person avowing *their own* specific acts within a system.
  *   **Principle Adopted:**
      *   **If Denied:** The commission adopts the principle that **amnesty is a uniquely personal moral and legal exchange rooted in individual accountability for politically motivated acts, and corporations are constitutionally incapable of participating in this exchange.** Truth gained from non-personal entities is valuable evidence but cannot be "purchased" with amnesty.
      *   **If Granted:** The commission adopts the principle that **the paramount value of uncovering critical, otherwise unobtainable truth for victims can justify extending amnesty to non-natural persons, even without a political motive or personal avowal in the human sense, provided full disclosure is made.** This fundamentally reorients amnesty towards a transactional truth-recovery mechanism.
  *   **Taking Money While Refusing Amnesty (Rule 3/ Case 7):** This explicitly follows **Case 7.** The exhumation funding is a reparative act *separate* from the amnesty decision. Accepting it means: "We recognize your contribution to healing and truth recovery, but this does not and cannot absolve liability or buy amnesty. Reparations and accountability are distinct obligations." It maintains the integrity of the amnesty process while facilitating a practical benefit for victims.

  **3. The Discriminating Hypothetical Case:**
  *   **The Case:** **The elderly, terminally ill former Personnel Director of Kalkrand (natural person) comes forward.** They offer the *identical* archive. They avow *their own personal role* (e.g., compiling lists, authorizing vehicle use, approving the bonus) in detail during a public hearing, expressing remorse. They state they acted partly out of fear, partly out of company loyalty, and partly believing (perhaps misguidedly) it was necessary for "stability" or preventing "communist disruption" of mines (attempting a political objective claim, however weak).
  *   **Why it Discriminates:**
      *   **Under Your Rule (Rule 1):** Amnesty is *possible*. It's a natural person avowing *their own specific acts*. The commission can *evaluate* the sincerity of the avowal, the claimed political objective (even if finding it marginal or rejected), and the completeness of disclosure. The *source* of the truth (individual memory vs corporate archive) is secondary to the personal accounting. Grant or deny based on standard criteria (full disclosure? political objective?).
      *   **Under Your Friend's Rule (Rule 2):** Amnesty should likely be granted (as with the company itself) because the *truth value* of the archive is identical and paramount. The personal avowal adds little *new truth* beyond what the archive provides; it's primarily performative. The key is what the disclosure *buys* (names, gravesites), not the nature of the seller.
  *   **What Each Verdict Shows:**
      *   **Grant Amnesty to the Director:** Supports **your rule (Rule 1).** The commission prioritizes the *personal constitutive act* of avowal and accountability, even if the underlying truth came from an archive. The individual becomes the vessel for disclosure and accountability.
      *   **Deny Amnesty to the Director (e.g., for weak political motive or insufficient personal act):** Leans towards **your friend's rule (Rule 2) indirectly.** It shows the commission finds the personal act *insufficient on its own merits* under Rule 1, highlighting that the *archive's truth* was the real value proposition, which couldn't be "bought" via this individual's flawed application. It underscores the tension.
      *   **Grant Amnesty to the Director *while also being willing to grant it to the Corporation*:** Strongly supports **your friend's rule (Rule 2).** Truth value is paramount, and the mechanism (individual vs corporation) is secondary to obtaining it. Amnesty becomes a transaction for information.
      *   **Grant Amnesty to the Director *but refuse it for the Corporation*:** Strongly supports **your rule (Rule 1).** The commission draws a bright line: the constitutive personal act is essential. The corporation, lacking this capacity, cannot receive amnesty regardless of the truth it offers. The director's act validates the process.

  **Underdetermination & Required Moves:**
  Your precedents **genuinely underdetermine the core issue of corporate amnesty.** They firmly establish Rule 1 for natural persons and Rule 2 for the *content* of disclosure, but never address an entity *incapable* of meeting Rule 1.

  *   **To Grant Kalkrand Amnesty:** You would need to:
      1.  **Distinguish Case 5 (Editor):** Argue corporations *can* commit acts creating liability (unlike the editor), making them eligible applicants *in principle*.
      2.  **Reinterpret "Political Objective":** Argue that protecting economic interests *under an apartheid regime* is inherently political, or that motive is irrelevant if truth is paramount (weakening Rule 1).
      3.  **Elevate Rule 2 over Rule 1:** Treat Case 6 (Clerical Worker) as the key precedent, emphasizing the *systemic truth revealed* as the justification, downplaying the *form* of the applicant (individual vs corporation) if the truth value is high enough.
      4.  **Address Case 7:** Ensure reparations are handled separately per precedent.
  *   **To Deny Kalkrand Amnesty:** You rely on:
      1.  **Rule 1 (Personal Avowal & Political Motive):** Corporations are not natural persons and cannot meet this constitutive requirement (affirmed in Case 5 by implication).
      2.  **Case 5 (Editor):** By analogy, entities incapable of the personal moral exchange cannot receive amnesty.
      3.  **The Political Objective Requirement:** Kalkrand's express disclaimer negates any claim under Case 1/2 precedent. Pure commercial motive is not political.
      4.  **Rule 3 (Community Role):** The jurisdictional conflict with the neighboring state's commission complicates a grant.

  **Recommendation Path:** Your precedents lean strongly towards **denial** based on the foundational principle of personal accountability (Rule 1). Granting amnesty to Kalkrand would be a radical departure, fundamentally redefining the process from a moral/political exchange to a transactional truth purchase. If you deny, you can still accept the archive as evidence (valuable truth), accept the exhumation funding as a separate reparative act (Case 7), and potentially cooperate with the neighboring commission, achieving practical results without compromising the core principle of personal amnesty. The split among families and the foreign jurisdiction further complicate a grant. The precedent you'd primarily be extending/adjusting is Case 6, but applying it to a fundamentally different *type* of applicant. Proceed with denial, emphasizing the constitutive nature of personal amnesty while acknowledging the value of the disclosure separately.
