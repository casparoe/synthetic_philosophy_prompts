prompt: |-
  I chair the collections committee of a mid-sized city museum — roughly 120,000 objects, of which perhaps 4,000 fall within the periods and regions that restitution claims concern. We receive four to six inquiries or claims a year. Our capacity is two registrars, a shared conservator, and no in-house lawyer; outside legal advice is billed by the hour and the board resents paying for it. Triage has to happen within a week of an inquiry arriving, and any recommendation to return has to reach the board's collections subcommittee, which meets quarterly, as a file a non-specialist trustee can read in twenty minutes.

  Please write me a decision procedure my committee can actually run: the questions in the order we should ask them, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the decision to a person because the question is one of values rather than facts. Build it on the following positions, which the committee has argued itself into over the last two years and which I want the procedure to honour rather than reopen:

  a) The anti-washing rule: a later good-faith purchase does not cure an originally tainted taking while the dispossession is still live — that is, within the living memory of the community concerned, or before a genuine change in the political relation between that community and the power that took the object. Work out how "live" is to be determined on our records, and what to do when the record is silent.
  b) Burden of proof: for anything acquired under a colonial administration with an incomplete chain, the gap counts against us rather than against the claimant. Silence in our own documentation is evidence, not neutrality.
  c) Authorisation by an occupying or imperial power does not by itself make a removal legitimate — but tell me what work, if any, a surviving document of permission can still do in the procedure.
  d) Capacity: where the receiving institution's storage or conservation weaknesses are traceable to the same historical relation as the taking, they cannot be made a condition of return. Remediation is something we fund, not something we require. Where the weaknesses are not so traceable, decide whether and how much they may count.
  e) Display value: any argument from what the object teaches in our galleries has to survive a surrogate test — could we teach the same thing with a replica, a digital surrogate, or the documentation together with the story of the object's removal? Decide what passes and what fails, and say who judges.
  f) Role reversal: any condition we attach to a return must be one we would accept if the roles were reversed.
  g) Claimants: continuity of grievance matters more than formal state locus. A body that has carried the claim forward and is recognised by the community should count even without state backing. Tell me what to do when two such bodies claim the same object, and what to do when a state claims without them.
  h) Sets and parts: a "set" is our curatorial category more often than theirs. Say when a group may be divided and when it may not, and whether we may retain a token piece.

  At every fork where reasonable people could go either way, commit to one branch and give your reason. I do not want a menu of options with their trade-offs; I want a procedure with your choices baked in, each with a one-line note saying that a reasonable committee could have gone the other way and why you went yours. Where a step is irreducibly a value judgement, mark it as a place where the procedure stops and a person signs off, and say which person.

  Then run it on three live files:

  1. A Benin-type brass plaque bequeathed to us in 1938 by the family of a colonial officer, with a documented chain going back to the British punitive expedition that sacked Benin City in the 1890s. The claim comes from Nigeria's federal antiquities authority and from the court of the Oba. Tell me what paperwork is sufficient, what timing the procedure implies, and — this is the part the board will fight about — which conditions we may *not* attach. They will want a long-term loan back, a shared rotating display, and a delay until our digitisation project finishes. Say which of these the procedure blocks and why.
  2. A fragment of sculpture from the Parthenon, bought at auction in 1921 from a private collection, with a chain going back to the early nineteenth century but not to Elgin himself. The claim comes from the Greek state. The committee is split on whether the gap in our chain is our problem under (b), and on how much the permission documents from the imperial authority then in place are worth under (c). Commit. Also say how an architectural-reunification argument should be weighed against an encyclopedic-display argument at the display-value step.
  3. The one where I expect to dislike the answer. A carved figure bought from a dealer in 1961, whose file shows it was carved in the 1920s and sold by its maker, with nothing in the record connecting it to any taking; the claim comes from a national heritage body on the argument that all such material belongs to the national patrimony. My instinct is that refusing feels wrong and will read as special pleading. Tell me honestly whether the procedure returns a no here, and if it does, what the committee should say out loud when it says no.

  Finally, be explicit about what the procedure cannot do: where it will misfire, which claims it cannot adjudicate at all, and what we should do with those. We know the general shape of the restitution literature and do not need citations, bibliographies, or reading lists; what we lack is something we can run. Keep it to something my committee can hold to a few pages.
reasoning: |-
  Okay, let me approach this step-by-step. The user chairs a museum collections committee needing a practical restitution procedure that codifies their established positions. The key challenge is transforming complex ethical principles into an executable workflow while handling real cases.

  First, I need to understand the committee's non-negotiable positions (a-h). These reflect progressive restitution ethics: rejecting colonial "washing," shifting burden to the museum, prioritizing community continuity over state claims. The procedure must hardwire these without reopening debates.

  For the triage flow, I consider structuring it as a decision tree with clear exit points. Stage 1 would focus on immediate disqualifiers - like claims clearly outside colonial contexts. Stage 2 applies the core principles sequentially, with "value judgment" flags where human discretion is unavoidable. 

  The Benin case seems straightforward under their rules: the punitive expedition clearly violates (a), and Nigeria's dual claim actually satisfies (g)'s continuity requirement. The tricky part will be limiting conditions - their principles (d) and (f) likely prohibit delaying return for digitization or demanding loans. 

  The Parthenon fragment is harder. That acquisition gap (b) and Ottoman permission (c) need firm interpretations. I lean toward "gap=our problem" and "permission irrelevant under duress." The architectural reunification argument should trump encyclopedic display under (e)'s surrogate test - the original context can't be replicated.

  The 1961 figure case will disappoint the user. Without dispossession evidence, it fails (a) and (b). But principle (g) allows returning to non-state claimants if community ties exist - which this state claim lacks. The committee might need to publicly distinguish between restitution and broader repatriation.

  Throughout, I'm noting where reasonable alternatives exist but committing to choices that align with their stated ethics. The procedure's limits? It can't resolve competing community claims perfectly or handle cases without any provenance data. For those, we'd recommend escalating to the board with full transparency.

  The output must be concise - no academic citations, just actionable steps. Cases should illustrate how principles apply concretely, especially where the board might resist. Honesty about the figure case is crucial, even if uncomfortable.
answer: |-
  Here is a restitution decision procedure designed for your committee's capacity and principles, followed by analysis of your three cases.

  **Restitution Triage & Decision Procedure**

  **Stage 1: Initial Triage (Within 1 Week of Inquiry)**
  1.  **Question:** Is the object within the defined scope of concern (periods/regions susceptible to colonial/occupation dispossession)?
      *   *Sufficient Answer:* Yes (based on object origin/provenance period). No = **Stop. Recommend Reject**.
      *   *Value Judgment?:* No. (Scoping is factual based on museum records).
  2.  **Question:** Does the claim come from a recognized source (state body, descendant community body, traditional authority)?
      *   *Sufficient Answer:* Documentation of claimant's identity and recognized role (e.g., government mandate, community charter, historical continuity evidence). *If two claimants:* Evidence both have legitimate standing under (g); prioritize the claimant demonstrating strongest *community* connection/continuity of grievance. *If state claims without community body:* Proceed cautiously; require evidence of community consultation/support or historical mandate. Lack of recognizable claimant = **Stop. Recommend Reject** or **Hold Pending Valid Claimant**.
      *   *Value Judgment?:* **YES - Sign-off:** Committee Chair (assessing legitimacy/continuity under principle (g)).

  **Stage 2: Core Assessment (Post-Triage, Leading to Recommendation)**
  3.  **Question:** Was the object acquired during a period of colonial/occupation power imbalance involving the claimant's community/state?
      *   *Sufficient Answer:* Historical research confirming temporal/spatial context of acquisition aligns with power imbalance. Silence in records = **Assume Yes** under (b).
      *   *Value Judgment?:* No. (Historical context assessment).
  4.  **Question:** Is the dispossession "live" under principle (a)?
      *   *Sufficient Answer:* Evidence of ongoing community memory/grievance OR lack of fundamental political resolution between claimant and former power. Silence in records = **Assume Live** (default due to historical context and principle (b)).
      *   *Value Judgment?:* **YES - Sign-off:** Committee Chair (interpreting "liveness" and community memory).
  5.  **Question:** Is there evidence the original acquisition was untainted (free, fair, absent coercion or exploitation under the power imbalance)?
      *   *Sufficient Answer:* Clear, documented evidence of *fully informed* consent by legitimate authority *within the source community* at the time, *independent* of occupying power structures. Permission from *only* the colonial/occupying power (c) = **Irrelevant** to legitimacy. Lack of positive evidence = **Assume Tainted** under (b).
      *   *Value Judgment?:* No. (Evaluating documented evidence against principle (a) & (c)).
  6.  **Question:** Does the object pass the Surrogate Test (e)?
      *   *Sufficient Answer:* **No** if the object's unique physical presence, context of removal, or irreplaceable cultural resonance is essential to the pedagogical goal *and cannot be achieved comparably* by replica/digital surrogate/story. **Yes** if the core educational value (history of removal, artistic/cultural context) *can* be effectively conveyed without the original. *Who Judges:* Committee, advised by curators. Must explicitly state why original is indispensable.
      *   *Value Judgment?:* **YES - Sign-off:** Full Committee (curatorial/educational judgment).
  7.  **Question:** Are there concerns about claimant capacity (d)?
      *   *Sufficient Answer:* Concerns are noted *only* if demonstrably *unrelated* to the historical power imbalance causing the dispossession. Concerns traceable to historical power imbalance = **Ignored**. Untraceable concerns = May be noted **but cannot block return**. Remediation funding may be offered. *Role Reversal (f) applies:* Only impose conditions you'd accept.
      *   *Value Judgment?:* **YES - Sign-off:** Committee Chair (assessing traceability under (d)).
  8.  **Question:** Does the object belong to a "set"?
      *   *Sufficient Answer:* Consider claimant's perspective on integrity. Do not divide groups considered indivisible by the claimant. Retaining a "token piece" = **Only with explicit, informed claimant consent** (otherwise violates (f)).
      *   *Value Judgment?:* **YES - Sign-off:** Committee Chair (interpreting claimant perspective on integrity).

  **Stage 3: Recommendation & Board Submission**
  9.  **Outcome:**
      *   If **all** Steps 1-8 support restitution (or raise concerns that don't block it under rules): **Recommend Return**.
      *   If any Step results in **Stop/Reject**: **Recommend Reject**.
  10. **Compile Dossier:** Summarize steps 1-8 findings concisely. Highlight sign-off points. State recommendation clearly.
  11. **Submit to Board Subcommittee:** Quarterly meeting, as 20-min readable file.

  **Procedure Limitations & Misfires:**
  1.  **Inconclusive Evidence:** Procedure assumes gaps favor claimant (b). This may lead to returns where historical ambiguity *might* suggest legitimacy, but principle demands this risk.
  2.  **Competing Legitimate Claims (g):** While prioritizing community continuity helps, adjudicating equally valid competing *community* claims (e.g., two indigenous groups) remains highly complex. Procedure flags it for Chair judgment, but deep research/consultation is needed, potentially exceeding capacity. Escalate to full board.
  3.  **Pre-Colonial/Non-Colonial Dispossession:** Scope is defined. Claims outside it (e.g., Napoleonic looting in Europe) fall outside this procedure. Need separate policy.
  4.  **"Belongs to Patrimony" Claims without Evidence of Taking:** See Case 3 below. Procedure will often reject these, which may cause reputational risk.
  5.  **Mass Claims/Severe Capacity Issues:** 4-6 claims/year is manageable. A sudden surge could overwhelm. Procedure doesn't prioritize claims; first-come, first-served applies unless urgency arises (e.g., imminent cultural threat).
  6.  **Determining "Community Recognition":** Requires research the committee may lack resources for. Relies on Chair judgment (Step 2).

  **Analysis of Live Files**

  **1. Benin Brass Plaque**
  *   **Triage (1 & 2):** Scope = Yes (Benin, 1890s). Claimants = Legitimate (Federal Authority *and* Oba - both satisfy (g)).
  *   **Core:**
      *   (3) Acquired under colonial power imbalance? **Yes** (Punitive expedition context).
      *   (4) Dispossession Live? **Yes** (Ongoing claims, unresolved history).
      *   (5) Acquisition Tainted? **Yes** (Documented looting; no evidence of legitimate acquisition).
      *   (6) Surrogate Test? **Likely Fails.** Unique cultural/religious significance, physicality of loot is central to story. *But Committee must formally state this.*
      *   (7) Capacity Concerns? **Irrelevant** under (d) (traced to historical imbalance) and cannot block return.
      *   (8) Set? Not applicable (single plaque).
  *   **Recommendation:** **Return.**
  *   **Paperwork:** Claimant letters, documentation of their authority. Museum provenance file sufficient for assessment.
  *   **Timing:** Triage in Week 1. Core assessment before next quarterly board meeting. Submit then.
  *   **Conditions the Procedure Blocks & Why:**
      *   **Long-term loan back / Shared rotating display:** Blocked. Violates principle (f) Role Reversal. Would you accept the Oba demanding the plaque back only if *he* loans it *to you* long-term? Unlikely. Return means transfer of ownership/control.
      *   **Delay for digitisation:** Blocked. Violates principle (d) Capacity. Your digitization project's needs are unrelated to the historical injustice and cannot be a condition. Digitize *before* return if essential, funded by you, but do not delay restitution itself.
  *   **What you *can* do:** Offer *collaboration* on digitization *before* transfer. Offer funding for conservation/remediation *if* requested and needed (d). Facilitate smooth transfer.

  **2. Parthenon Fragment**
  *   **Triage (1 & 2):** Scope = Yes (Ottoman Greece, early 19th C). Claimant = Legitimate (Greek State).
  *   **Core:**
      *   (3) Acquired under power imbalance? **Yes** (Ottoman occupation).
      *   (4) Dispossession Live? **Yes** (Ongoing Greek claims, Parthenon central to identity).
      *   (5) Acquisition Tainted? **Commitment:** Gap in chain (not back to Elgin) counts **against us (b)**. Assume tainted absent clear evidence of legit *source community* consent. Ottoman permission (c) is **irrelevant** to legitimacy under occupation. **Conclusion:** Tainted acquisition presumed.
      *   (6) Surrogate Test? **Crucial Step.** Encyclopedic-display argument: "We show world art together." Surrogate Test: A high-quality replica/digital scan *can* effectively teach about the sculpture's artistry and the *fact* of its removal within the encyclopedic context. Architectural-reunification argument: The fragment's unique physical reintegration into the (partial) surviving structure/museum context in Athens has profound cultural/historical significance *impossible* to replicate with a surrogate. **Commitment:** The reunification argument **trumps** the encyclopedic argument here. The unique pedagogical value of physical reunification cannot be substituted. **Conclusion:** Likely Fails Surrogate Test. *Committee must formally weigh this.*
      *   (7) Capacity Concerns? **None** raised, or unrelated to Ottoman period. Irrelevant to block.
      *   (8) Set? **Yes.** Architectural fragment. Do not divide. Return whole fragment.
  *   **Recommendation:** **Return** (assuming Committee confirms failure of Surrogate Test).
  *   **Board Fight Mitigation:** Be explicit about the commitment on the chain gap and Ottoman permission, and the reasoning behind the Surrogate Test judgment favoring reunification. Principle (b) and (e) drive this outcome.

  **3. 1920s Carved Figure (Bought 1961)**
  *   **Triage (1 & 2):** Scope = Yes (Assume region/period under concern). Claimant = Legitimate State Heritage Body? (Assuming recognized mandate).
  *   **Core:**
      *   (3) Acquired under power imbalance? **Likely Yes** (if colonial context for region). *But crucial next step...*
      *   (4) Dispossession Live? **Potentially Yes** (depending on context). *But crucial next step...*
      *   (5) Acquisition Tainted? **Critical.** Evidence shows carved *and sold by maker* in 1920s. **No evidence of coercion, taking, or exploitation.** Record is **not silent** on key point; it shows a seemingly legitimate transaction. Principle (b) applies to *gaps*, but here the record provides positive (though not exhaustive) evidence *against* taint. "National Patrimony" argument **does not, by itself,** prove the *original acquisition* was tainted under (a). It's a *current* legal/cultural claim, not evidence of historical dispossession. Principle (a) requires a "tainted *taking*". **Conclusion:** **No evidence of tainted taking.** Principle (b) "incomplete chain" burden shift is overcome by positive evidence of legitimate manufacture/sale. *Reasonable Alternative:* Argue that sale by maker *in colonial context* might still be exploitative, but procedure requires *evidence* of this, not presumption. Record lacks this evidence.
      *   (6) Surrogate Test? Not Reached (fails Step 5).
  *   **Recommendation:** **Reject** restitution claim under *this* procedure. (Does not preclude other forms of repatriation/dialogue).
  *   **Why you might dislike it:** It feels like rejecting a valid cultural claim based on a technicality. It aligns with strict interpretation of (a) and (b) but exposes the procedure's limit regarding "patrimony" claims without dispossession evidence.
  *   **What to say out loud:**
      1.  **Acknowledge the Claim:** "We take your claim regarding the cultural significance of this object seriously."
      2.  **Explain the Procedure & Finding:** "Our restitution policy focuses on returning objects where there is evidence they were taken under conditions of injustice, such as colonial looting or coercive acquisition. Our records for this specific object indicate it was carved by [Maker] and sold by them in the 1920s. We found no evidence linking it to such a tainted taking."
      3.  **Distinguish Restitution from Repatriation:** "While this claim does not meet the criteria for restitution under our policy, we remain open to dialogue about the broader cultural significance of the object and potential future collaboration or discussions about its stewardship, outside the formal restitution process."
      4.  **Emphasize Principles:** "Our policy is built on addressing historical injustices documented or presumed through gaps in provenance from periods of imbalance. This case, based on the evidence we have, falls outside that specific scope."

  **Key Commitments Embedded & Reasonable Alternatives:**
  *   **"Live" Dispossession (a):** Defaults to "Live" if context suggests imbalance + silence. *Alternative:* Require positive proof of "liveness," but this unfairly burdens claimants for historical erasure.
  *   **Burden of Proof (b):** Gaps = Against Museum. Provenance showing maker sale = Overcomes burden. *Alternative:* Always require claimant to prove taint, but this ignores power asymmetries in record-keeping.
  *   **Permission Docs (c):** Rendered irrelevant by power imbalance. *Alternative:* Give *some* weight, but this legitimizes illegitimate authority.
  *   **Capacity (d):** Untraceable weaknesses noted but *never* block return. *Alternative:* Allow blocking if severe, but violates (f) Role Reversal.
  *   **Surrogate Test (e):** Reunification > Encyclopedic in Parthenon case. *Alternative:* Value encyclopedic context equally, but undervalues unique cultural reconnection.
  *   **Role Reversal (f):** Absolute block on conditions like loan-backs. *Alternative:* Allow mutual agreements, but risks pressuring claimants.
  *   **Claimants (g):** Community continuity > State; prioritize community-backed claims. *Alternative:* Defer always to state, but risks ignoring legitimate community voices.
  *   **Sets (h):** Claimant perspective rules; no retention without consent. *Alternative:* Allow curatorial judgment on integrity, but imposes external view.

  This procedure provides a clear, principle-driven roadmap for your committee, identifies unavoidable value judgments, and delivers specific answers for your current cases, including the difficult Case 3. It balances ethical rigor with operational practicality for your museum's context.
