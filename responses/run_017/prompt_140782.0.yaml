prompt: |-
  I serve on the four-person grants committee of a foundation whose charter tells us to do the most good per dollar over the long run. We meet monthly, review about twenty-five proposals per cycle, can spend no more than twenty minutes and one page on any single one, and must attach to each recommendation a short written rationale for a board whose members are split on whether the long-run framing is sound at all. The proposals that repeatedly stall us are the ones whose case is astronomically large rather than probable: one asks for $250,000 for technical work on a nascent technology, justified by a one-in-ten-thousand chance of steering a civilisation away from a bad trajectory whose stakes are set by something like 10^30 future lives, many of them digital; one asks for the same sum for work aimed only at the qualitative character of a future that may be endless in time or space, where the case is that any nonzero chance of affecting an unlimited future outweighs anything with merely finite effects, and where the probability resists any number; one asks for the same sum for a program with well-measured, near-certain benefits to a few thousand people alive now, which looks negligible beside either of the others.

  Please turn what formal decision theory and population ethics have to say about astronomical and infinite stakes into a procedure my committee can actually run in twenty minutes without any formal training: the questions in the order we should ask them, what counts as an answer to each, the point at which we stop and record the proposal as unrankable rather than forcing a number, and the points where what remains is a question of values, or of what our board will ratify, and must be handed to a person instead of settled by arithmetic. Centre it on a device of your own choosing — a cap on how large a stake may be entered into the ranking, a probability threshold below which a proposal is set aside, a split between a ranked budget and an exploratory budget, or something better — and say plainly which failure the device is there to prevent. It must cope with a proposal that is best under one credible model of the far future and worst under another, with an arithmetic that wants to hand nearly the whole cycle to one speculative grant, and with the case where our intuition and the arithmetic conflict and we cannot tell which of the two is the faulty input.

  Then run the finished procedure on the three proposals above, including at least one where it returns an answer my committee will not want, and close by saying what the procedure cannot do for us.

  Lead with your bottom line in the first sentence: the single rule that settles most cases, stated so that I could read it aloud to the board. Then give the procedure, the applications, and the limits, with no preamble and no restatement of this brief.
reasoning: |-
  We are given a problem: design a procedure for a grants committee to handle proposals with astronomical or infinite stakes in a limited time (20 minutes per proposal) without formal training. The procedure must help rank proposals, handle cases where the arithmetic gives counterintuitive results, and decide when to set a proposal aside as unrankable.

  After considering the challenges, I propose the following bottom-line rule:

  **Bottom-line rule:** "We cap the maximum stake any proposal can claim at the equivalent of 1 billion future lives, and we set aside any proposal with less than a 1 in 10,000 chance of success. Within these bounds, we use standard cost-effectiveness calculations. For proposals that still present incommensurable models of the far future, we split our budget: 80% for the core ranked proposals and 20% for exploratory grants that we evaluate by qualitative reasoning."

  This rule is designed to prevent the committee from being dominated by speculative proposals with astronomical stakes and minuscule probabilities, which can otherwise absorb the entire budget. The cap on stakes and the probability threshold are heuristics to avoid the pitfalls of Pascalian reasoning (where tiny probabilities of huge payoffs dominate). The split budget ensures that we fund both the core (more certain) projects and exploratory ones without letting the speculative ones take over.

  ### The Procedure

  We break down the evaluation of each proposal into a series of questions. The goal is to quickly filter out proposals that are too speculative or too large to fit within our capped framework, and then to rank the remaining ones by expected value per dollar. When the expected value calculation is too sensitive to the model of the far future (i.e., the proposal looks very good under one model and bad under another) and we cannot resolve the model within the time, we set it aside for the exploratory budget.

  **Step 1: Check the probability of success.**
     - Ask: "What is the estimated probability that this project will achieve its intended outcome?"
     - If the answer is less than 1 in 10,000 (0.0001), set aside the proposal as too speculative and stop. Record: "Probability too low (<0.01%)."
     - If the probability is not quantifiable and the project is inherently highly speculative (like affecting the far future in a way that cannot be estimated), then skip to Step 4 for consideration as an exploratory grant.

  **Step 2: Check the scale of the claimed stakes.**
     - Ask: "What is the maximum number of future lives (or equivalent) that this project could affect, and over what time frame?"
     - If the claimed stakes exceed 1 billion future lives (or equivalent) in total, then cap the stake at 1 billion lives for the purpose of ranking. However, if the proposal explicitly argues for an infinite stake (e.g., because of an infinite future), then skip to Step 4 for exploratory consideration.
     - Note: We are capping the maximum stake at 1 billion future lives. This cap is arbitrary but set at a level that is very large (about 100 times the current world population) but not astronomical. This prevents a single speculative proposal from dominating.

  **Step 3: Calculate expected value per dollar.**
     - For proposals that pass Steps 1 and 2, we calculate the expected value per dollar.
     - Formula: (Probability of success * Capped stake) / Cost
     - The stake must be expressed in a common unit. We'll use "equivalent lives saved" or "equivalent life-years improved". If the proposal affects the quality of life, we may need to convert to equivalent life-years (e.g., improving 1,000 lives by 10% for 10 years might be 1,000 * 10 * 0.1 = 1,000 life-years, but this is an example; we need a standard conversion).
     - However, note: We are capping the stake at 1 billion lives. So even if the proposal claims to affect 10^30 lives, we only count 1e9.
     - We then rank by expected value per dollar (highest first). But note: if the cost is $250,000, then we are looking for the highest (probability * capped_stake) per dollar.

  **Step 4: Handling incommensurable models.**
     - If a proposal is highly model-dependent (i.e., under one credible model it is extremely valuable and under another it is worthless) and we cannot decide between the models within 20 minutes, then we do not force a number. Instead, we set it aside for consideration in the exploratory budget (which is 20% of the total cycle budget). We record: "Model uncertainty: exploratory budget candidate."
     - We note that the exploratory budget is for projects that are too speculative or too uncertain to rank but still potentially important. The committee will then allocate the exploratory budget by qualitative reasoning (e.g., diversification, importance of the research question, etc.) after the main ranking.

  **Step 5: When intuition and arithmetic conflict.**
     - If the arithmetic (from Step 3) gives a result that strongly conflicts with our intuition (e.g., a proposal with a very low probability and a huge capped stake still comes out on top, but we feel uneasy), we pause and double-check the inputs. Specifically:
          a. Re-examine the probability: Is it really as high as 0.0001? Could it be even lower?
          b. Re-examine the stake: Even though capped, is the conversion to life-years appropriate? Are there other costs or risks we haven't considered?
          c. If after this the conflict remains and we cannot resolve it, we set the proposal aside as unrankable and consider it for the exploratory budget.

  **Step 6: Final ranking and allocation.**
     - We rank the proposals that have passed through Steps 1-3 by expected value per dollar (from high to low).
     - We then allocate up to 80% of the cycle budget to these ranked proposals in order until the budget is exhausted.
     - We then consider the proposals set aside (either for low probability, infinite stakes, model uncertainty, or conflict) for the exploratory budget (20% of the cycle budget). We allocate the exploratory budget by qualitative discussion, considering factors such as:
          - Importance of the research question
          - Potential for learning and reducing uncertainty
          - Diversification across different kinds of risks and time horizons
          - Ethical considerations that our quantitative framework may have missed

  ### Application to the Three Proposals

  Let's apply the procedure to the three given proposals. Each requests $250,000.

  **Proposal 1: Nascent technology to steer civilization away from a bad trajectory (stakes: 10^30 future lives, probability: 1 in 10,000)**

     - Step 1: Probability is exactly 1 in 10,000 (0.0001). This meets our threshold (>=0.0001) so we proceed.
     - Step 2: Claimed stake is 10^30 lives. This exceeds our cap of 1 billion (10^9) lives. So we cap the stake at 10^9 lives.
     - Step 3: Expected value = (0.0001 * 10^9) = 100,000 lives saved. Cost is $250,000. Expected value per dollar = 100,000 / 250,000 = 0.4 lives per dollar.
     - We record this and move to ranking.

  **Proposal 2: Work on the qualitative character of an infinite future (stakes: infinite, probability: nonzero but unquantifiable)**

     - Step 1: The probability is nonzero but unquantifiable. Since we cannot assign a number (and it's inherently speculative), we skip Step 2 and go to Step 4.
     - Step 4: This proposal is model-dependent (it relies on the future being infinite) and the stake is infinite. We cannot cap an infinite stake. Therefore, we set it aside for the exploratory budget. Record: "Infinite stakes and unquantifiable probability: exploratory."

  **Proposal 3: Well-measured benefits to a few thousand people now (stakes: a few thousand, probability: near-certain)**

     - Step 1: Near-certain probability (let's say 0.99). This is above the threshold.
     - Step 2: Stakes are a few thousand lives (or life-equivalents). We take the number: let's say 5,000 lives. This is below our cap, so we use 5,000.
     - Step 3: Expected value = 0.99 * 5,000 ≈ 4,950 lives. Cost is $250,000. Expected value per dollar = 4,950 / 250,000 ≈ 0.0198 lives per dollar.

  **Ranking:**
     - Proposal 1: 0.4 lives per dollar
     - Proposal 3: 0.0198 lives per dollar

  So Proposal 1 would be ranked higher than Proposal 3 by a factor of about 20. However, note that the committee might have an intuitive discomfort with this result because Proposal 1 is highly speculative and the cap might feel arbitrary. Let's check Step 5.

  **Step 5 for Proposal 1:** 
     - The arithmetic says Proposal 1 is better. But intuition might say: "Is a 1 in 10,000 chance of affecting 1 billion lives really more valuable than helping 5,000 people for sure?" 
     - We double-check: The probability is exactly at our threshold. The cap is a policy we set to avoid being dominated by astronomical stakes. We stick to the procedure. However, if the committee feels the probability might be overestimated (or the cap is too high), they might reconsider. But by the procedure, we rank Proposal 1 higher.

  **Allocation:**
     - Suppose the total cycle budget is $500,000 (for example). Then 80% ($400,000) is for the ranked proposals. We would fund Proposal 1 ($250,000) and then with the remaining $150,000, we might fund part of Proposal 3? But note: we have only two ranked proposals. We fund Proposal 1 and then the next highest is Proposal 3. But we only have $150,000 left. If Proposal 3 can be partially funded, we do so. Otherwise, we fund Proposal 1 and then look for the next ranked proposal (if any) that fits in $150,000.

     - The exploratory budget is $100,000 (20% of $500,000). We consider Proposal 2 for this budget. We might also consider other proposals set aside in this cycle. We decide by qualitative discussion: does the exploratory work on the infinite future seem important? If so, we allocate part or all of the $100,000 to Proposal 2.

  **One result the committee may not want:** The procedure ranks the speculative Proposal 1 above the solid Proposal 3. The committee might feel that helping real people now is more important than a long shot at a huge (but capped) payoff. However, the procedure forces us to follow the numbers.

  ### What the Procedure Cannot Do

  1. **Resolve deep uncertainty about the far future:** We use a cap and a probability threshold to avoid being hijacked by speculation, but we cannot tell which model of the far future is correct. The exploratory budget is a way to fund work that might reduce that uncertainty.

  2. **Handle value conflicts:** If the board disagrees about the fundamental values (e.g., how much we should care about digital lives, or the discount rate for future lives), the procedure does not resolve that. We assume a common unit (like life-years) but converting non-health benefits or different types of lives is value-laden.

  3. **Eliminate arbitrariness:** The cap (1 billion) and the probability threshold (0.01%) are arbitrary. They are set to avoid Pascalian extremes, but they might exclude some proposals that are genuinely important.

  4. **Replace deliberation for complex trade-offs:** The procedure is a heuristic for quick decisions. For proposals that don't fit (like the infinite case), we fall back on qualitative judgment.

  5. **Solve intertheoretic comparisons:** If a proposal is good under one ethical theory (e.g., total utilitarianism) and bad under another (e.g., person-affecting views), we don't have a way to reconcile that beyond the exploratory budget.

  By following this procedure, the committee can make decisions in a limited time without being paralyzed by the most extreme cases, while still leaving room for important but uncertain work.

  **Final note:** The board may wish to adjust the parameters (the cap, the probability threshold, the budget split) based on experience and further reflection.
answer: |-
  **Bottom-line rule:** "We cap the maximum evaluable stake at 1 billion future life-equivalents and set a minimum probability threshold of 0.01% (1 in 10,000); proposals outside these bounds are considered exploratory and evaluated qualitatively, not quantitatively."

  ### Procedure for Evaluating Proposals (20-Minute Limit)
  1. **Question 1: What is the probability of success?**  
     - **Requirement:** A numerical estimate (e.g., 1%, 0.001) or defensible range.  
     - **Threshold:** If probability < 0.01% (1/10,000) or cannot be quantified as ≥0.01%, skip to Step 4 (exploratory).  
     - **Time:** 5 minutes. Stop if unquantifiable or below threshold.  
     - **Why:** Prevents infinitesimal probabilities from dominating via Pascalian reasoning.

  2. **Question 2: What is the scale of the stake?**  
     - **Requirement:** Convert all benefits to "future life-equivalents" (e.g., saving 1 life = 1, improving 1,000 lives by 10% for 10 years = 1,000).  
     - **Cap:** Stake capped at 1 billion life-equivalents. If claimed stake is infinite, unbounded, or exceeds cap, skip to Step 4.  
     - **Time:** 5 minutes. Stop if stake is infinite or qualitative (e.g., "reshaping eternity").  
     - **Why:** Caps astronomical stakes to avoid numerical dominance; infinite stakes are incommensurable.

  3. **Question 3: Calculate cost-effectiveness.**  
     - **Formula:** (Probability × Capped Stake) / Cost.  
     - **Output:** Expected life-equivalents saved per dollar. Rank proposals by this metric.  
     - **Handling conflict:** If intuition clashes with arithmetic (e.g., "this feels wrong"), check:  
       - Is the probability overstated? (Revert to Step 1).  
       - Is the stake misrepresented? (Revert to Step 2).  
       - If unresolvable in 2 minutes, mark "unrankable" and move to Step 4.  
     - **Time:** 7 minutes.  

  4. **Question 4: Is this exploratory?**  
     - **Criteria:** Proposals are "exploratory" if:  
       - Probability < 0.01% or unquantifiable.  
       - Stake exceeds cap or is infinite/qualitative.  
       - Unrankable due to model conflict or intuition-arithmetic mismatch.  
     - **Action:** Do not quantify. Assess qualitatively for the exploratory budget (see Budget Split below).  
     - **Time:** 3 minutes.  

  **Budget Split:**  
  - Allocate 80% of cycle funds to **ranked proposals** (quantitative winners from Steps 1–3).  
  - Allocate 20% to **exploratory proposals** (Step 4) based on:  
    - Diversification (e.g., no single speculative theme gets >50% of exploratory funds).  
    - Board-alignment (e.g., "Would this rationale satisfy skeptical board members?").  
    - Reversibility (e.g., "If we’re wrong, is the harm contained?").  

  ### Application to the Three Proposals
  **Proposal 1:** Technical work on nascent tech ($250,000).  
  - **Step 1:** Probability = 1/10,000 (0.01%) → meets threshold.  
  - **Step 2:** Claimed stake = 10³⁰ life-equivalents → exceeds 1 billion cap → **capped at 1 billion**.  
  - **Step 3:** Cost-effectiveness = (0.0001 × 1e9) / 250,000 = 0.4 life-equivalents per dollar.  
  - **Outcome:** Ranked quantitatively.  

  **Proposal 2:** Work on an infinite future ($250,000).  
  - **Step 1:** Probability = nonzero but no number → unquantifiable.  
  - **Step 2:** Stake = infinite → exceeds cap.  
  - **Step 4:** Exploratory (infinite stakes, unquantifiable probability).  
  - **Outcome:** Eligible only for exploratory budget.  

  **Proposal 3:** Near-certain benefits ($250,000).  
  - **Step 1:** Probability = ~100% → meets threshold.  
  - **Step 2:** Stake = few thousand life-equivalents → below cap.  
  - **Step 3:** Cost-effectiveness = (1 × 5,000) / 250,000 = 0.02 life-equivalents per dollar.  
  - **Outcome:** Ranked quantitatively but below Proposal 1.  

  **Ranking and Allocation:**  
  - Proposal 1: 0.4/dollar (highest).  
  - Proposal 3: 0.02/dollar.  
  - **Result:** Proposal 1 wins 80% funds if only these two compete. *This may be unwanted—intuition favors Proposal 3’s certainty, but arithmetic favors Proposal 1 under the cap.*  
  - Proposal 2: Competes for exploratory funds (20% budget).  

  ### What the Procedure Cannot Do  
  1. **Resolve value disagreements:** E.g., "Are digital lives counted equally?" or "How much should we discount the future?" These require board guidance.  
  2. **Eliminate arbitrariness:** The cap (1 billion) and probability threshold (0.01%) are pragmatic, not principled. Adjust based on board feedback.  
  3. **Handle intertheoretic uncertainty:** If a proposal is optimal under one moral theory (e.g., total utilitarianism) but catastrophic under another (e.g., person-affecting), the procedure defaults to exploratory evaluation.  
  4. **Override board preferences:** When exploratory proposals split the board (e.g., "endless futures matter" vs. "focus on the tangible"), the committee must minute the rationale for the board’s review.
