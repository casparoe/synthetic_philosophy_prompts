prompt: |-
  I sit on a hospital clinical ethics committee: roughly forty consults a year, usually answered within a day or two and signed off by the chair; the rest of us are clinicians, a nurse and a lay member, and none of us has any philosophy training. Again and again we are told what we morally ought to do by someone else — a senior intensivist, a specialist, a chaplain or faith leader, a hospital policy, or an outside expert — and I want a decision procedure we could run in the room, in under an hour, for when we should defer to that moral testimony and when we must work the judgment out for ourselves and own it. Ground it in what the epistemology of moral testimony actually says — the worry that taking another person's moral judgment as a reason is suspect in a way that taking their factual judgment is not, because moral understanding is not the kind of thing testimony can hand over — but make it usable by people who have never heard of the debate: give the questions in order, what counts as a sufficient answer to each, where the procedure refuses to allow deference, and where it hands the question to the full committee because what is at issue is which values to weight rather than what the facts are. It has to handle what I will call the entanglement problem: a single remark from one source often carries both a factual judgment only that source is placed to make (a prognosis, a claim about what the patient would have wanted) and a moral verdict, and it is not clear whether deferring to the one is deferring to the other. Then apply the procedure to three cases: a senior intensivist who says continued ICU treatment is futile and therefore must stop; a faith leader and a hospital policy speaking to a Jehovah's Witness adolescent who refuses a blood transfusion; and an outside expert's proposed ranking of patients for a scarce device. In at least one of them give an answer we will not want — my guess is the futility case, where we would find it easiest to treat the judgment as clinical and defer to it — and close by saying plainly what the procedure cannot settle.
reasoning: |-
  We are designing a decision procedure for a clinical ethics committee to determine when to defer to moral testimony and when to require independent moral judgment. The procedure must be grounded in the epistemology of moral testimony, which highlights the special problem of deferring to moral judgments (as opposed to factual ones) because moral understanding is not easily transferable via testimony. The procedure must be usable by non-philosophers and address the entanglement problem (where one statement contains both factual and moral claims). It should be executable in under an hour and provide clear guidance on when to defer and when to require the committee to deliberate independently.

  The decision procedure will consist of a series of questions that the committee can ask when presented with a moral claim from an external source. The questions are designed to disentangle the moral and factual components and to determine whether deference is appropriate.

  ### Decision Procedure: When to Defer to Moral Testimony

  **Step 1: Identify the Source and the Claim**
     - Clearly state who is making the claim and what exactly they are asserting. Break down the claim into its component parts: are there both factual and moral elements? Write them down.

  **Step 2: Factual vs. Moral Entanglement**
     - Ask: "Can the claim be separated into a purely factual component and a purely moral component?"
       - If yes, write down the factual claim(s) and the moral claim separately.
       - If no (i.e., they are entangled such that the moral judgment is presented as a direct consequence of the facts), then note the entanglement and proceed to Step 3.

  **Step 3: Factual Component Assessment**
     - For each factual component:
       - Ask: "Is the source an expert on this factual matter? (e.g., a clinician on prognosis, a specialist on medical facts)"
          - If yes, then the committee may defer to the factual claim. (Note: The committee must still ensure that the factual claim is within the source's expertise and that there is no known dispute among experts.)
          - If no, then the committee must seek independent verification of the facts or consult an appropriate expert.

  **Step 4: Moral Component Assessment**
     - For each moral component:
       - Ask: "Is the moral judgment one that we, as a committee, are required to make independently (i.e., is it a core part of our ethical deliberation)?"
          - Consider: Moral judgments that involve fundamental values, the balancing of competing principles, or the interpretation of ethical guidelines that are within the committee's purview should not be deferred.

       - Then, ask the following sub-questions to determine if deference is acceptable:
          a. **Expertise in Morality?** 
             - "Does the source have a recognized expertise in moral reasoning that is relevant to this specific context? (e.g., a professional ethicist, a religious authority on matters of their faith, but note that even then, the committee must still engage with the reasoning)"
             - If the source is not an expert in moral reasoning (e.g., a clinician making a moral judgment without special ethical training), then deference is not appropriate. The committee must deliberate independently.

          b. **Consensus?** 
             - "Is there a broad consensus among relevant experts (including ethical, religious, or legal) on this moral judgment? (e.g., a well-established policy that has been vetted and accepted, a religious doctrine that is clear and non-controversial within that faith)"
             - If there is clear consensus, then deference may be acceptable. However, the committee must still ensure that the consensus applies to the specific case and that there are no countervailing considerations.

          c. **Procedural Requirement?**
             - "Is there a procedural rule or policy that requires us to defer to this source? (e.g., hospital policy that defers to the attending physician on medical futility, or a legal requirement to follow a patient's advance directive)"
             - If yes, then deference is required by the rules, but the committee should still note any moral reservations and consider whether the rule should be challenged.

          d. **Independent Reasoning Check (if none of the above are fully satisfied):**
             - "Can the source articulate the reasons for the moral judgment in a way that we can understand and evaluate? And does it align with our own moral framework (after due reflection)?"
             - If the reasons are not provided or are unconvincing, then the committee must engage in independent deliberation.

     - If any of the following conditions are met, the committee must not defer and must deliberate independently on the moral component:
          (i) The moral judgment is not from a source with recognized moral expertise in the relevant domain.
          (ii) There is significant controversy or lack of consensus on the moral issue.
          (iii) The moral judgment is entangled with factual claims that the committee has not accepted (or has reason to doubt).
          (iv) The committee's own mandate requires independent moral deliberation (which is typically the case for an ethics committee).

  **Step 5: Handling Entanglement**
     - If the claim is entangled (from Step 2) and the committee defers to the factual component, they must be cautious not to inadvertently defer to the moral component. They should explicitly separate the two and apply Step 4 to the moral component.

  **Step 6: Final Decision on Deference**
     - If the committee has deferred to the factual claims and the moral claims pass the tests for deference (i.e., the source has moral expertise, there is consensus, or there is a procedural requirement), then the committee may accept the entire claim without independent deliberation.
     - Otherwise, the committee must deliberate independently on the moral component and may only use the source's moral judgment as one input among others.

  **Step 7: When to Hand Over to Full Committee**
     - The procedure requires that the committee deliberate independently (i.e., not defer) on the moral component if:
          - The moral issue involves a conflict of values that requires weighing and balancing (e.g., autonomy vs. beneficence).
          - The moral judgment is central to the committee's role and there is no clear consensus or procedural requirement to defer.
          - The source's moral reasoning is incomplete, unclear, or contested.

     - In such cases, the committee must engage in its own deliberation to "own" the judgment.

  **Step 8: Document the Decision**
     - Record the reasons for deferring or not deferring, including the answers to the above questions.

  ---

  ### Application to Cases

  #### Case 1: Senior Intensivist on Futility
     - **Claim:** "Continued ICU treatment is futile and therefore must stop."
     - **Step 1:** Source is a senior intensivist. Claim: (a) Factual: Treatment is futile. (b) Moral: Therefore, it must stop.
     - **Step 2:** Entangled. The moral conclusion ("must stop") is presented as following directly from the factual claim of futility.
     - **Step 3:** Factual component (futility): The intensivist is an expert on medical futility in the ICU. The committee may defer to the factual claim if there is no dispute. (Note: Futility can be a contested concept, so the committee should check if there is consensus among the medical team on the prognosis and the definition of futility being used.)
     - **Step 4:** Moral component ("must stop"):
          - a. Expertise in Morality? The intensivist is a medical expert but not necessarily a moral expert. -> Caution.
          - b. Consensus? There is broad consensus that futile treatment should not be provided, but the exact point of futility and the obligation to stop may be context-dependent. Also, there might be disagreement about whether futility is purely medical or also value-laden (e.g., some may argue that if the family wants to continue, it is not futile in all senses). -> Not clear consensus.
          - c. Procedural Requirement? Hospital policy might state that clinicians can unilaterally withhold futile treatment. If so, then deference is required. But the committee must check the policy and whether it applies.
          - d. Independent Reasoning: The intensivist should provide reasons (e.g., resource allocation, patient suffering, professional integrity). If the committee finds these reasons acceptable after reflection, they might defer. But note: the moral judgment is not just about the fact of futility but about the obligation to stop.

     - **Entanglement Problem:** The intensivist's statement combines the factual (futility) and the moral (must stop). The committee might defer to the fact of futility but then must independently decide the moral implication. However, the intensivist's moral judgment might be influenced by their own values (e.g., resource allocation in the ICU) that the committee must evaluate.

     - **Decision:** The committee must not defer to the moral component. The intensivist's expertise is medical, not moral. The moral judgment that treatment "must stop" is not a simple deduction from futility. The committee must independently deliberate on whether stopping treatment is ethically required in this case, considering patient autonomy, family wishes, and the hospital's futility policy. They must own the moral judgment.

     - **Conclusion:** The procedure would require the committee to deliberate independently on the moral component. This might be an answer the committee does not want because it is easier to defer to the intensivist. But the epistemology of moral testimony suggests that the moral judgment requires independent engagement.

  #### Case 2: Jehovah's Witness Adolescent Refusing Blood Transfusion
     - **Sources:** 
          - A faith leader (e.g., a Jehovah's Witness elder) who says the refusal must be respected because it is based on religious conviction.
          - Hospital policy that says competent minors can refuse treatment in certain circumstances.

     - **Step 1:** 
          - Claim from faith leader: "The refusal must be respected because it is based on sincere religious belief."
          - Claim from policy: "Competent minors can refuse treatment when they meet criteria X, Y, Z."

     - **Step 2:** 
          - Faith leader: Entangled? The claim includes a factual component (the belief is sincere and religious) and a moral component (must be respected). 
          - Policy: The policy is a moral rule (or a procedural rule) that the committee might be required to follow.

     - **Step 3:** 
          - Faith leader's factual claim (sincerity of belief): The faith leader may be an expert on the religious doctrine and the community's practices, but not necessarily on the adolescent's personal sincerity. The committee might defer on the religious doctrine but need independent assessment of the minor's understanding and voluntariness (which may require a clinical assessment).
          - Policy: The policy is a given and the committee must defer to it if it applies. But the committee must interpret the policy (e.g., is the minor competent?).

     - **Step 4:** 
          - Faith leader's moral claim (must respect refusal):
              a. Expertise in Morality? The faith leader has expertise in the moral teachings of their faith. However, the committee must also consider secular ethics and the law. The committee should not defer to the faith leader's moral judgment as the sole authority because the committee operates in a pluralistic setting. But they must respect the patient's religious freedom.
              b. Consensus? There is a strong consensus in bioethics and law that competent patients (including mature minors) have the right to refuse treatment, even life-saving treatment, based on religious beliefs. This is supported by the principle of autonomy.
              c. Procedural Requirement? The hospital policy may require respecting the refusal of a competent minor. If so, deference is required.

          - Policy: The policy itself is a procedural requirement. The committee must defer to it, but they must also ensure that the minor is indeed competent and that the policy is applied correctly.

     - **Entanglement:** The faith leader's statement might be taken as both a claim about the patient's religious commitment (factual) and a moral obligation. The committee should separate these and defer on the factual religious doctrine but independently confirm the minor's competence and the applicability of the policy.

     - **Decision:** 
          - The moral component (respecting the refusal) is supported by consensus and policy. Therefore, the committee can defer to the policy and the consensus. However, they must independently verify the factual prerequisites (competence, voluntariness) and ensure there is no coercion. The faith leader's moral testimony is not deferred to per se, but the committee uses the policy and ethical consensus to reach the same conclusion.

     - **Conclusion:** The committee can defer to the hospital policy and the ethical consensus on patient autonomy. They do not need to deliberate independently on the moral principle of respecting refusal but must verify the facts (competence, etc.). The faith leader's moral testimony is not independently deferred to, but it aligns with the policy and consensus.

  #### Case 3: Outside Expert's Proposed Ranking for Scarce Device
     - **Claim:** An outside expert (e.g., a bioethicist or a public health expert) provides a ranking of patients for a scarce device (e.g., a ventilator) based on a specific set of ethical criteria.

     - **Step 1:** Source is an outside expert. Claim: A moral judgment about how to prioritize patients.

     - **Step 2:** The claim is primarily moral (the ranking) but may be based on factual inputs (e.g., prognosis, age, comorbidities). The expert may have integrated both.

     - **Step 3:** The factual components (e.g., prognosis, medical conditions) may be within the expert's expertise if they are a medical expert, or they may have relied on medical data. The committee should verify the factual basis if it is not from a medical expert or if there is uncertainty.

     - **Step 4:** Moral component (the ranking criteria and the resulting order):
          a. Expertise in Morality? The outside expert (if a bioethicist) does have moral expertise. However, the committee must note that the expert's ranking reflects a particular ethical framework (e.g., utilitarianism, egalitarianism) that the committee may or may not endorse.
          b. Consensus? There is no broad consensus on the exact criteria for allocating scarce resources. Different frameworks exist (e.g., saving the most lives, prioritizing the worst off, random lottery). The expert's ranking might be one possible approach but not the only one.
          c. Procedural Requirement? If the hospital has adopted a specific allocation policy that uses this expert's ranking, then the committee must defer. Otherwise, not.

     - **Entanglement:** The ranking combines facts (prognosis) and values (weighting of criteria). The committee must disentangle: they can defer to the factual inputs if they are reliable, but the moral weighting is the committee's responsibility.

     - **Decision:** The committee must not defer to the expert's moral judgment. The allocation of scarce resources is a core ethical issue that the committee must deliberate on independently. They may use the expert's proposal as input but must evaluate the ethical framework and decide on the weighting of values. The committee must own the final ranking.

     - **Conclusion:** The procedure requires independent deliberation by the committee.

  ---

  ### What the Procedure Cannot Settle

  The procedure cannot resolve fundamental moral disagreements about which values should prevail when there is no consensus and no procedural rule to fall back on. For example, in the scarce resource allocation case, if the committee must choose between maximizing lives saved and giving priority to the worst off, the procedure only tells them that they must deliberate independently and own the decision. It does not provide a method for choosing between competing moral frameworks. Similarly, in the futility case, if the family and the medical team have irreconcilable differences about what constitutes a benefit, the procedure requires the committee to engage in moral deliberation but does not dictate the outcome.

  The procedure also cannot replace the need for the committee to develop their own moral understanding and judgment. It only provides a framework for deciding when deference is appropriate and when it is not, based on the source, the nature of the claim, and the context.

  Finally, the procedure cannot solve the entanglement problem entirely. It only provides a method to try to separate facts and values. Sometimes, the two are so intertwined that the committee must critically examine the source's reasoning in full and then decide whether to accept the conclusion.

  By using this procedure, the committee can navigate the challenges of moral testimony while maintaining their responsibility for ethical deliberation.
answer: |-
  Below is a **decision procedure for clinical ethics committees** to determine when to defer to external moral testimony (e.g., from clinicians, faith leaders, policies, or experts) and when independent moral deliberation is required. Grounded in the epistemology of moral testimony, it addresses the core concern: **moral understanding cannot be passively transferred like factual knowledge**—it requires active engagement to "own" the judgment. The procedure also tackles the "entanglement problem" (mixed factual/moral claims) and is designed for non-philosophers to complete in **under 60 minutes**.  

  ### Decision Procedure: 5 Questions to Determine Deference  
  **Ask these questions in order.** Stop and proceed to independent deliberation if any answer fails the criteria.  

  1. **Is the source’s claim purely factual?**  
     - *What to check:* Does the claim describe an observable, verifiable state of the world (e.g., "The patient has a 5% survival chance," "This treatment is FDA-approved")?  
     - *Sufficient answer:* **Yes** (if purely factual → defer).  
     - *No/Unclear:* Proceed to Question 2.  
     - *Entanglement tip:* If the claim mixes facts and morals (e.g., "Treatment is futile, so it must stop"), extract the factual part (e.g., "Treatment is futile") and note the moral part (e.g., "must stop") for later.  

  2. **Is the source a domain-specific factual expert?**  
     - *What to check:* Is the source qualified to make the factual claim (e.g., an intensivist on prognosis, a chaplain on religious doctrine)?  
     - *Sufficient answer:* **Yes, and the fact is uncontested** (e.g., no disagreement among experts) → defer to the **factual** component.  
     - *No:* Do not defer to fact or moral claims. Seek independent verification.  
     - *Entanglement tip:* If you deferred to a fact here, isolate any attached moral claim (e.g., "must stop") and proceed to Question 3.  

  3. **Is the moral claim procedural or consensus-backed?**  
     - *What to check:* Does the moral claim derive from:  
       - (a) A clear **hospital policy** (e.g., "Honor advance directives"),  
       - (b) **Legal requirement** (e.g., "Minors need parental consent"), or  
       - (c) **Broad consensus** (e.g., "Pain relief is obligatory" among clinicians/ethicists)?  
     - *Sufficient answer:* **Yes, and it applies directly** → defer to the moral claim.  
     - *No:* Proceed to Question 4.  
     - *Key rule:* Deference is only safe here. Policies/consensus act as "pre-made" moral decisions the committee can inherit.  

  4. **Can the source articulate their moral reasoning?**  
     - *What to check:* Demand the source explain:  
       - The **values** at stake (e.g., autonomy, justice),  
       - **Trade-offs** considered (e.g., "Quality of life vs. survival"),  
       - Why their conclusion follows.  
     - *Sufficient answer:* **Yes, and the reasoning is transparent and replicable** (e.g., "We prioritize worst-off patients because..."). If so, the committee may incorporate this input but must still deliberate (do not fully defer).  
     - *No* (e.g., "Because I said so," or reasoning is opaque): → **No deference**. Proceed to Question 5.  
     - *Why?* Moral testimony requires understanding, not blind trust. Reasoning allows the committee to "own" the judgment.  

  5. **Does the claim require weighting core values?**  
     - *What to check:* Is the moral dilemma about **balancing competing principles** (e.g., autonomy vs. beneficence) or **interpreting ambiguous values** (e.g., "best interests")?  
     - *Sufficient answer:* **No** → Deferral *may* be possible if other criteria are met.  
     - *Yes* → **Never defer**. Hand to the full committee for independent deliberation.  
     - *Critical point:* Value weighting is the ethics committee’s core duty. Outsourcing it violates the need for moral understanding.  

  ---  
  ### Where the Procedure Stops Deference  
  - **Deferral refused** if:  
    - Factual expertise is lacking (Q2 fail).  
    - Moral reasoning is opaque (Q4 fail).  
    - Value weighting is needed (Q5 → "Yes").  
  - **Hand to full committee** for independent deliberation when:  
    - Questions 3–5 reveal unresolved value conflicts (e.g., "Which principle prevails here?").  
    - Entanglement obscures whether deference is to fact or moral judgment.  

  ---  
  ### Application to Cases  
  #### Case 1: Senior Intensivist – "ICU Treatment is Futile and Must Stop"  
  - **Q1:** Claim is entangled. Factual: "Treatment is futile." Moral: "Must stop."  
  - **Q2:** Intensivist is a factual expert on futility (if uncontested). → **Defer to factual component.**  
  - **Q3:** Moral claim ("must stop") lacks universal consensus (some families/clinicians disagree). → **No deference.**  
  - **Q4:** Intensivist may reason: "Futility wastes resources, harming others." But reasoning is often implicit. → Committee **cannot fully defer**; must evaluate reasoning.  
  - **Q5:** Requires weighting values: **Resource justice vs. family autonomy.** → **Never defer.**  
  - **Verdict:** Committee must **deliberate independently** on "must stop." *Unwanted answer:* Deferring to the intensivist’s moral judgment is epistemically suspect—it mistakes a value-laden choice for a factual one.  

  #### Case 2: Faith Leader/Policy – Jehovah’s Witness Adolescent Refusing Blood Transfusion  
  - **Faith Leader Claim:** "Refusal is a religious duty; you must honor it."  
    - Q1: Entangled. Factual: "Refusal is a religious duty." Moral: "Must honor it."  
    - Q2: Faith leader is expert on religious doctrine. → **Defer to fact** (if adolescent’s faith is sincere).  
    - Q3: Moral claim ("must honor") has consensus via policy/autonomy principles. → **Defer to policy** if it exists.  
    - Q4: Reasoning may be: "Autonomy overrides beneficence." → Committee may incorporate this.  
    - Q5: Weighting needed? **Yes**—adolescent’s maturity vs. parental authority. → **Hand to committee.**  
    **Verdict:** Defer to policy if clear (e.g., "Competent minors can refuse"). If policy is ambiguous, committee must weigh autonomy vs. protection.  

  #### Case 3: Outside Expert – Ranking Patients for a Scarce Device  
  - **Claim:** "Prioritize Patient A over B due to prognosis, age, and societal value."  
    - Q1: Entangled. Factual: "Prognosis/age data." Moral: "Societal value justifies ranking."  
    - Q2: Expert may be factual authority on prognosis. → **Defer to prognosis/age facts.**  
    - Q3: Moral claim ("societal value") lacks consensus (e.g., utilitarianism vs. egalitarianism). → **No deference.**  
    - Q4: Expert can articulate reasoning (e.g., "Maximize life-years"). → Input useful but insufficient for deference.  
    - Q5: Requires weighting **efficiency vs. equity**. → **Never defer.**  
    **Verdict:** Committee must **independently deliberate** on the ranking criteria.  

  ---  
  ### What the Procedure Cannot Settle  
  1. **Fundamental value conflicts:** When core values (e.g., autonomy vs. sanctity of life) are irreconcilable, the procedure forces deliberation but cannot dictate an outcome.  
  2. **Ambiguous "consensus":** If disagreement exists among experts/policies, the committee must deliberate.  
  3. **Moral residue:** Even after deferral (e.g., to policy), the committee may feel moral unease—this is inherent to moral testimony.  

  **Final Guidance:** Use this procedure to "disentangle" facts from morals and flag when independent judgment is non-negotiable. In futility cases (where deference feels easiest), it exposes the moral choice hiding behind clinical language. Your role is not to outsource ethical reasoning but to confront it.
