answer: |-
  ## Novel Organisms Committee: Decision Procedure for "Living/Replicating Biological Entity"

  **Purpose and Scope (123 words)**
  This procedure provides a standardised, evidence-based method for the Committee to determine if a proposed biological entity (or system) qualifies as "living" or a "replicating biological entity" under the Institute's containment schedule and relevant national regulations. It focuses on operational definitions suitable for practical risk assessment, not abstract philosophy. The goal is consistent, defensible decisions within 40-minute meeting slots. It applies to any biological material proposed for research at the Institute, including engineered, symbiotic, dormant, or hybrid systems. The output is a binary classification: **Regulated Entity (RE)** (requiring containment as per schedule) or **Non-Regulated Entity (NRE)**. This classification triggers the next steps (e.g., containment level assignment by the Occupational Hygienist), but does not define those steps.

  **The Procedure**

  1.  **Is the entity demonstrably derived from a known living organism?**
      *   *Sufficient Answer:* Evidence the entity is sourced from, contains, or is constructed using nucleic acids, organelles, cells, spores, or tissues from organisms universally accepted as living (e.g., bacteria, archaea, fungi, plants, animals, protists). Historical origin suffices.
      *   *Stop Point (NRE):* If definitively *not* derived from known life (e.g., purely synthetic chemical assembly with no biological components). Proceed to Step 2 if unsure or if derived.
      *   *Hand-Over Point:* None. Factual assessment.

  2.  **Does the entity undergo metabolic activity *in the proposed experimental context*?**
      *   *Sufficient Answer:* Evidence of energy utilisation, nutrient uptake/waste production, biosynthesis, or maintenance of internal homeostasis *during the experiment*. Include documented activity under the PI's specified conditions. Latent viability (revivable by controlled apparatus like adding water/medium) counts as metabolic activity *if revival is part of the experimental protocol or foreseeable consequence*.
      *   *Stop Point (NRE):* If definitively inert, with *no* metabolic activity possible under *any* foreseeable lab conditions or storage proposed (e.g., irreversibly fixed tissue, purified non-catalytic proteins). Proceed to Step 3 if metabolic activity occurs or is latent/revivable.
      *   *Hand-Over Point:* None. Factual assessment based on proposal and known biology.

  3.  **Does the entity replicate its core heritable information *without bespoke human intervention per replication event* in the proposed context?**
      *   *Sufficient Answer:* Evidence the entity copies its essential nucleic acid sequence (or equivalent information carrier), producing new copies capable of the same function *without* researchers needing to manually reconstruct it each time (e.g., cell division, RNA/viroid replication in host, phage assembly). Replication machinery can be host-supplied *if the entity encodes/possesses the specific means to utilise it*. Reliance on supplied generic nutrients or a stable environment does *not* count as bespoke intervention. Reliance on a specific engineered partner organism supplied *does* count as intrinsic capability *of the system*.
      *   *Stop Point (NRE):* If replication demonstrably requires researchers to *actively assemble* each new copy from separate parts according to instructions *not* contained within the entity itself (e.g., manually building each vesicle and adding RNA). Proceed to Step 4 if replication occurs autonomously *or* if dependence is relational (e.g., symbiotic pair, host-dependent).
      *   *Hand-Over Point:* None. Factual assessment.

  4.  **Borderline Assessment: Does the entity/system exhibit sufficient characteristics of a living system?**
      *   *Scope:* Applies *only* if Steps 1-3 yield mixed/inconclusive results (e.g., derived + metabolism but no replication; derived + replication but questionable metabolism; symbiotic system).
      *   *Sufficient Answer:* Committee vote (majority) based on *overall integrated function*. Consider: **a) Autonomy:** Does it maintain itself (structure/function) against decay? **b) Evolution:** Can heritable variation arise and be selected *within the system* under the proposed conditions? **c) System Unity:** For collectives (symbionts, consortia), do the parts function as an integrated whole displaying characteristics (metabolism/replication/evolution) that *emerge* from the interaction? A collective system *can* be RE even if individual parts are not viable alone. Counterfactual independence is *not* required; niche-dependence (including lab-supplied environment/partner) is acceptable if the *system* functions autonomously *within that niche*.
      *   *Decision Point:* Vote RE or NRE. Must reach a majority decision.
      *   *Hand-Over Point:* If deadlock (tie vote), hand-over to the **Committee Chair** to make the final RE/NRE call based on the discussion and precautionary principle.

  5.  **Output & Handover:**
      *   If outcome is NRE (from Steps 1, 2, 3, or 4): Proposal does not trigger the containment schedule based on life/replication status. Inform PI. *Hand-over to Occupational Hygienist* for separate risk assessment regarding chemicals, particulates, or physical hazards under general lab safety rules.
      *   If outcome is RE (from Steps 3 or 4): Entity/system is classified as a living/replicating biological entity. *Hand-over to Occupational Hygienist* to determine the *required containment level* based on the specific risks (pathogenicity, transmission, toxin production, etc.) as per the Institute's schedule and national rules.

  **What Each Step is Buying Us (Conceptual Grounding in Plain Terms) (342 words)**

  *   **Step 1 (Derivation):** We start pragmatically. Regulating "life" usually means regulating things *from* life or mimicking it closely. This anchors us in the biological world we already regulate, avoiding purely abiotic systems. It's a practical filter.
  *   **Step 2 (Metabolism):** Being active or *potentially* active (latent viability) is central to being "alive" in a way that poses biological risks like growth, spread, or interaction. Something permanently inert can't grow, evolve, or infect. Revivability matters because dormant spores or seeds *are* biological agents; they hold the *potential* for life processes under foreseeable conditions *we* might create. We assess this *in the experimental context* because that's where risk arises.
  *   **Step 3 (Replication):** This is the core regulatory trigger ("replicating entity"). True replication means the thing makes copies *of itself* using its *own* instructions and inherent capability (even if it borrows machinery). Needing standard food (nutrients) is fine; needing us to *build* each copy like an engineer is not. Reliance on a partner (symbiont) is acceptable *if* the partnership is inherent to the system's design and function – the *system* replicates itself. This step avoids getting bogged down in "independence" and focuses on the *process* of copying.
  *   **Step 4 (Borderline - Integrated Function):** Some cases won't tick all boxes neatly. Here, we shift from a checklist to a "family resemblance" or "cluster concept". Does the *whole system*, even if dependent on its niche or partners, *behave* like a living thing? Does it maintain itself, replicate its kind, and potentially evolve? We look for the *emergent* properties of life in the system as it functions. A symbiotic pair where the *pair* replicates and evolves is treated as a single "living system". We accept that life often depends on its environment – a bacterium needs nutrients; our symbiotic pair needs each other. The vote allows collective judgement on this fuzzy boundary based on the evidence presented.

  **Where the Procedure Hands the Decision to a Person (195 words)**

  The procedure minimises subjective calls, but two points require person-specific decisions:

  1.  **Step 4 Vote Deadlock:** If the Committee is evenly split (tie vote) on the Borderline Assessment (Step 4), the **Committee Chair** must break the deadlock. The Chair should consider the preceding discussion, the strength of evidence for and against integrated function, and apply the **precautionary principle** (if significant uncertainty or potential risk exists, err on the side of caution/RE classification). The Chair must state their reasoning briefly for the record. This prevents indefinite delay.
  2.  **Output Handover:** Regardless of the RE/NRE outcome, the **Occupational Hygienist** takes the lead *after* the life/replication decision:
      *   For NRE: Assess non-biological risks (chemical, physical) under general lab safety.
      *   For RE: Determine the *specific containment level* required based on the agent's inherent hazards (using the Institute's schedule and national rules). The Hygienist uses their expertise to translate the "it's alive/replicating" decision into practical safety measures. The Committee *only* classifies RE/NRE; it does not set containment levels.

  **Worked Applications**

  1.  **The Two-Strain Consortium:**
      *   *Step 1:* Yes. Derived from known bacteria.
      *   *Step 2:* Yes. Each strain metabolises using the metabolite supplied by the other.
      *   *Step 3:* Yes. *The pair* replicates itself. Neither replicates alone, but together, they produce new copies of the *consortium system* without bespoke human assembly per replication event. Human intervention supplies the environment and potentially starts the culture, but not *each* new cell pair.
      *   *Step 4:* Not needed (clear RE from Step 3).
      *   *Output:* **RE**. *Rationale:* The symbiotic *system* demonstrably metabolises and replicates its core information/heritable configuration autonomously within its engineered niche. Hand-over to Hygienist for containment level based on the strains' characteristics and potential evolutionary risks.

  2.  **Dormant Seed and Tardigrade Archive (Proposed for Downgrading):**
      *   *Step 1:* Yes. Seeds and tardigrades are derived from known living plants/animals.
      *   *Step 2:* **Yes (Latent Viability).** While metabolically inert *in storage*, they are demonstrably revivable by adding water (controlled apparatus). Revival is the foreseeable purpose/risk of possessing them. They hold the *potential* for metabolic activity under standard lab conditions.
      *   *Step 3:* Yes. Both seeds and tardigrades replicate (germinate/grow into plants; tardigrades reproduce) once revived, without bespoke human assembly per replication event.
      *   *Step 4:* Not needed (clear RE from Step 3).
      *   *Output:* **RE**. *Rationale:* Latent viability counts. These are dormant life forms, revivable to full metabolic and reproductive activity. The proposal for downgrading based on current metabolic inactivity is rejected under this procedure. They remain regulated biological agents. Hand-over to Hygienist – while likely low risk, containment must align with potential hazards upon revival. *(This outcome likely goes against the committee's instinct to downgrade. What to do: Uphold the procedure's finding. Explain clearly to the PI that latent viability = potential life = regulated status. Downgrading requests must be based on hazard assessment by the Hygienist, not reclassification as non-living.)*

  3.  **Self-Assembling Bio-Hybrid Device:**
      *   *Step 1:* Yes. Contains engineered living tissue.
      *   *Step 2:* Yes. The engineered tissue component undergoes metabolism.
      *   *Step 3:* **No.** While the machine *assembles* copies, the core heritable information (the device design, instructions for assembly) resides *outside* the device itself (e.g., in blueprints, CAD files, supplied parts list). Researchers must supply these instructions and the specific parts for *each* assembly event. The device doesn't replicate *its own instructions*; it executes external instructions on external parts. The tissue grows, but the *functional device* (tissue + machine) is not replicated *by* itself; it's assembled *by* a machine using external inputs.
      *   *Stop Point:* Reached at Step 3 (No). Output: **NRE** for the *replication* trigger.
      *   *Output:* **NRE** (for life/replication classification). *Rationale:* The core replication of the *functional bio-hybrid entity* requires bespoke human intervention per copy (supplying design and parts). The living tissue component *is* RE, but the *proposal is for the bio-hybrid device*. Hand-over to Hygienist for significant risk assessment: mechanical hazards, tissue handling, potential release of living tissue components (which *are* RE), and chemicals. The tissue component likely requires separate containment as RE.

  **Where the Procedure Might Misfire (243 words)**

  No procedure is perfect. Potential misfires include:

  1.  **Overly Broad RE:** Very simple derived systems with metabolism but trivial/no replication (e.g., isolated, non-dividing cells in culture maintained by us) might pass Step 2 and borderline Step 4. *Mitigation:* Step 3 is key – "replication" requires copying heritable info *autonomously*. Non-replicating cells fail Step 3. If they pass Step 2, Step 4 should focus on the *lack* of replication/evolution as core life functions. The Hygienist can assign minimal containment if hazard is low.
  2.  **Under-Calling Relational Systems:** Highly complex, interdependent consortia where it's unclear if the *system* truly replicates as a unified whole might slip to NRE if Step 3/4 misinterpret the relational dependence. *Mitigation:* Step 4 explicitly asks about "System Unity" and emergent function. Emphasise that symbiosis/niche-dependence doesn't automatically disqualify; the key is whether the *interaction* creates a self-sustaining, replicating whole *within the defined setup*.
  3.  **Latent Viability Edge Cases:** Objects with *extremely* remote or complex revival needs (e.g., fossilised material, highly degraded samples) might trigger Step 2 if revival is theoretically possible but practically implausible in *any* lab. *Mitigation:* Step 2 requires revival to be part of the protocol or a *foreseeable consequence*. If revival is purely speculative, not intended, and demonstrably beyond current feasible protocols, Step 2 answer is No (NRE). Focus on realistic risk.
  4.  **Hybrid Confusion:** Confusing the status of components vs. the whole system (as in the bio-hybrid case). *Mitigation:* The procedure assesses *the entity proposed*. If a component is living (like the tissue), it must be identified and classified separately *if it poses independent risk*. The Hygienist needs this information.

  **What the Procedure Cannot Do (152 words)**

  This procedure **cannot**:

  1.  **Define "Life" Absolutely:** It provides an operational definition for regulatory purposes under specific rules, not a universal philosophical truth. Borderline cases exist.
  2.  **Assess Risk:** It only classifies RE/NRE. It *cannot* determine pathogenicity, environmental hazard, required containment level, or ethical implications. That is the distinct role of the Occupational Hygienist (for physical/biological risk) and other committees (for ethics).
  3.  **Handle Novel Definitions of Life:** If national regulations or the Institute schedule explicitly adopt a radically different definition (e.g., "anything with DNA"), the procedure would need revision. It assumes the core regulatory trigger involves metabolism/replication.
  4.  **Resolve All Disputes:** It structures discussion and provides a clear audit trail, but contested decisions can still go to the Director. The procedure ensures the Director sees *how* the decision was reached.
  5.  **Replace Expertise:** It relies on committee members applying their biological knowledge to answer the factual questions in Steps 1-3 and assess evidence in Step 4.
