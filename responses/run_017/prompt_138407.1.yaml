  The user has provided several challenging examples: a minimal bacterium, symbiotic strains, self-replicating RNA in vesicles, chirality-reversed organisms, prions, dormant seeds/tardigrades, and bio-hybrid devices. They specifically want help with three recurring issues: latent viability, relational dependence, and collective systems.

  I need to create a decision tree that incorporates philosophical concepts (cluster definitions, purpose-relativity) without requiring theoretical knowledge. The procedure must have clear stop points, hand-over points to specific people, and sufficiency conditions for answers. I'll need to apply it to three cases: the two-strain consortium, dormant archive, and bio-hybrid device - and explicitly identify if any outcome contradicts committee instincts.

  The user works in British English and wants no citations, under 2000 words. They've specified the exact structure: Purpose/scope → Procedure steps → Conceptual grounding → Person-based decisions → Worked examples → Limitations → What it can't do.

  For the procedure itself, I'll build around a cluster concept of life with four core properties: metabolism, replication, evolution, and autonomy. Each step will test for these, with "strong" evidence triggering immediate classification. Borderline cases will be handled through voting thresholds. The hygienist's need for clear reasoning is crucial - I'll include plain-language explanations.

  Key design choices:
  - Start with replication as the regulatory trigger
  - Treat metabolism as necessary but not sufficient alone
  - Handle latent viability through revivability tests
  - Address relational dependence via counterfactual independence
