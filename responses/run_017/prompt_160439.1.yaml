answer: |-
  Here’s a battle plan for your 90-minute session, structured to build irreversible conceptual dependencies, using your manuscript as the hook but shifting weight to a more surgical example. The goal is **cognitive dissonance**, not philosophical mastery.

  ---

  ### **Dependency Structure (Order is Non-Negotiable)**
  1. **Epistemic vs. Metaphysical Possibility (Minute 0-15)**  
     *Why first?* Everything collapses without this. Writers conflate "I can imagine it" (epistemic) with "it could exist" (metaphysical).  
     *Tool:* Contrast:  
     - *Epistemic:* "A trillion-digit prime exists" (I don’t know, but it’s possible).  
     - *Metaphysical:* "2+2=5" (impossible in any world).  
     *Board:* Two columns. **If late → all later distinctions become "interesting writing tricks."**

  2. **Narration vs. Full Specification (Minute 15-30)**  
     *Why next?* Explains *why* their "of course it’s imaginable" reaction is insufficient.  
     *Tool:* Your manuscript draft as a case study.  
     - *Narration:* "A text with no author, copied endlessly" → vivid, easy to picture.  
     - *Specification Gap:* "Where did the *first semantic content* come from? Trace causal chains or information origins."  
     *Key:* "Gaps in narration ≠ gaps in reality. Specification plugs leaks."

  3. **Graded Conceivability & Defeasibility (Minute 30-50)**  
     *Why here?* Builds on specification. Shows conceivability is provisional.  
     *Tool:* "Conceiving *that* P" (vague) vs. "Conceiving *of* X *as* P" (detailed).  
     - Ask: "Can you conceive *of* a square circle *as* having four equal straight sides *and* no angles?" → Collapses under specification.  
     - Stress: Failure to imagine ≠ impossibility (e.g., 4D objects). Success ≠ possibility (e.g., time travel without paradox).

  4. **Asymmetry of Conceivability Tests (Minute 50-65)**  
     *Why last?* Requires prior steps to avoid sounding arbitrary.  
     *Tool:* "Succeeding at imagining weakly suggests possibility; failing to imagine tells us almost nothing."  
     - *Strong failure:* Inverted spectrum (conceivable but untestable).  
     - *Weak success:* Manuscript (feels possible until specified).

  ---

  ### **The Load-Bearing Example: Inverted Spectrum**
  **Why not your manuscript?**  
  It’s the perfect *opener* (Minute 5: "Raise hands if this feels possible") but a poor *workhorse*. As you fear, it bogs down in causality disputes ("What if it’s quantum copy-paste?"). Writers will "solve" it with hand-waving, reinforcing the problem.

  **Inverted Spectrum Wins Because:**  
  - **No causal loops:** Pure subjective experience → no physics debates.  
  - **Irreducible gap:** I can narrate "you see red as I see blue," but I *cannot specify what "red" is like for you*.  
  - **Defeats picturing:** They can picture a person reacting to "red" objects "wrongly," but that’s *not* the scenario. The scenario is *undetectable private experience*.  
  - **Hits graded conceivability:** Vividly conceivable → survives reflection? No. Breaks under full specification (no shared reference for color qualia).  

  **Deployment (Minute 30-45):**  
  1. "Imagine a person who sees all colors inverted but behaves identically." (Hands raise → "conceivable!")  
  2. "Specify: How do you *know* their 'red' isn’t your 'blue'?" → "They call blood 'red'!"  
  3. "But 'red' is defined by public use. Their private experience is unspecified. Can you conceive *of* their red *as* your blue *without* circularity?"  
  4. **Crush the gap:** "If you swap their qualia at birth, does anything change? If not, is this scenario metaphysically distinct?"  

  ---

  ### **Misconception Triage**
  | Misconception | When Defused | Method |
  |---------------|-------------|--------|
  | "Picturing = Possible" | During Inverted Spectrum (Min 35) | *Let them commit.* Ask: "How many think it’s possible since you pictured it?" Then reveal specification failure. |
  | "Can’t Picture = Impossible" | After asymmetry (Min 60) | Use "4D object" → "I can’t picture it, but math describes it coherently." |
  | "Possible = Physically Possible" | During Epistemic/Metaphysical (Min 10) | *Preempt.* Define terms upfront: "We’re not asking if it breaks physics, but if it breaks logic." |
  | "Narratable Story = Possible World" | Manuscript opener (Min 7) & Specification (Min 20) | "Harry Potter is narratable, but magic might be metaphysically impossible (if laws are necessary)." |
  | **Unanticipated:** "Coherent Description = Possible" | Specification module (Min 25) | Use "round square" – described coherently ("round shape with corners") but impossible. |

  ---

  ### **Exit Check & Boundaries**
  **Exit Check (Min 75-85):**  
  > **"Apply this to your WIP: Pick one 'possible' element in your story (magic, tech, society). Write for 3 minutes: What would *fully specify* its metaphysical possibility? Where is the weakest gap?"**  
  *Why it works:* Forces self-audit. Look for metacognition ("I assumed X, but Y is underspecified") not correctness.

  **Boundaries to State Aloud:**  
  - "We’re not debating *causality* today—save quantum loops for the bar."  
  - "We’re not asking *how* something exists, but *whether* it *could*."  
  - "No philosophy jargon beyond what’s on the board—I’ll translate."  
  - **Hard stop:** "This isn’t about proving Godel or modal realism—it’s about spotting cracks in your foundations."

  ---

  ### **Why This Works**
  Your manuscript primes their overconfidence; inverted spectrum dismantles it with irrefutable introspection. By Minute 60, they’ll *feel* the gap between narration and possibility. The WIP exercise makes it practical: they leave uneasy about their own premises, not parroting slogans. **Target:** One writer muttering, "Shit, is my time-traveler’s motivation *really* specified?"
