            But if we weight each branch by its amplitude squared, then the total weight for two B's is 1/4, and the total weight of all branches is 1, so the fraction by weight is 1/4.

            And if we ask: what is the typical experience of a copy? We have to weight by the amplitude squared? Or by the branch count? We've seen that branch count is arbitrary.

            We want them to see that if they use branch count, they get 4/9 for two B's, which is not 1/4. But if they use amplitude squared weighting, they get 1/4.

            How to simulate this with the class?

            We have 9 branches. We can assign 9 students to be the copies. Now, we assign each branch its amplitude: for example, the branch A1A2 has amplitude (1/sqrt(2)) * (1/sqrt(2)) = 1/2? Wait, no:

              In the first measurement, the amplitude for A is 1/sqrt(2). Then in the second measurement, the amplitude for A in that branch is 1/sqrt(2). So the amplitude for A then A is (1/sqrt(2)) * (1/sqrt(2)) = 1/2.

              Similarly, a branch that had A then B1: (1/sqrt(2)) * (1/2) = 1/(2*sqrt(2))

            The amplitude squared for A then A: (1/2)^2 = 1/4.
            For A then B1: (1/(2*sqrt(2)))^2 = 1/(4*2) = 1/8.

            But note: there are two branches for A then B: A1B2a and A1B2b, each with amplitude 1/(2*sqrt(2)), so total amplitude squared for A then B: 2 * (1/8) = 1/4.

            And for two B's: each two-B branch has amplitude (1/2)*(1/2)=1/4, and there are 4, so total amplitude squared 4*(1/16)=1/4.

            Now, if we assign each branch a weight equal to its amplitude squared, then the total weight is 1.

            We can then ask: what fraction of the total weight comes from branches that saw two B's? 1/4.

            But if we count branches, it's 4/9.

            We then ask: which is the correct way to compute the fraction? The amplitude squared weighting is consistent across representations, so we use that.

            But then we note: the statement "most branches see statistics close to the Born rule" is not true by branch count. It is true by amplitude squared weight.

            And in fact, the branches that see anomalous statistics (like two A's, which should be 1/4, but one branch by count) have a higher amplitude squared? In this case the two A's branch has amplitude squared 1/4, which is the same as the two B's total. But there is only one branch for two A's and four for two B's. The one branch for two A's has weight 1/4, while each of the two B's branches has weight 1/16.

            Now, if we were to ask: what do most copies see? by branch count, we have:

              4 copies see two B's (weight 1/16 each, total weight 4/16=1/4)
              4 copies see one A and one B (each has weight: for a specific sequence like A then B1: 1/8, but there are 4 such branches: A then B1, A then B2, B1 then A, B2 then A? Let me recount:)

            Actually, in our tree:

              Two A's: 1 branch (A1A2) -> weight 1/4
              One A and one B: 
                  A then B: two branches (A1B2a, A1B2b) -> each weight 1/8, total 1/4
                  B then A: two branches (B1aA2, B1bA2) -> each weight 1/8, total 1/4
              Two B's: four branches -> each weight 1/16, total 1/4

            Now, the majority of branches (4 out of 9) see two B's, but the amplitude squared weight for two B's is 1/4, which is not a majority.

            And the branches that see two A's are only 1 out of 9, but they carry 1/4 of the weight.

            So if we use the amplitude squared weight, then the fraction of the weight that sees two A's is 1/4, two B's is 1/4, and one of each is 1/2.

            And if we do many trials, the weight will concentrate on the sequences that have about half A's and half B's.

            But we cannot say that "most branches" see that. We have to say "most of the weight" is on branches that see that.

     Given the complexity, and time, we might skip Round 2 if time is short.

     Timeline for 90 minutes:

          Round 1: Single measurement (50 minutes as above)

          Break: 5 minutes

          Round 2: Repeated measurement (30 minutes) - if we do it, we need to move quickly.

          Debrief: 5 minutes.

     But let's be realistic: the single measurement round may take the whole time.

     Debrief:

          We have them write on the board the problems they encountered:

            1. When they counted branches, the total winnings depended on how they drew the branches.
            2. They needed a consistent way to pay the same total for the same bet regardless of branching representation.
            3. The solution was to weight each branch by the amplitude squared.

          Then we reveal that this is the Born rule.

          And we can then say: in the many-worlds interpretation, probability is not about which branch you end up in (because you are in all), but about the measure of existence or the weight of the branch. And that weight is given by the amplitude squared.

     Predictable problems:

          - They might not understand why we are splitting in different ways for the same state.

          - They might be confused by the amplitude numbers.

          - They might not engage in the debate and just wait for the answer.

     To mitigate:

          - Make the first representation: have them act out the splitting. Have the copies stand up and say what they see.

          - For the amplitude, use decimals: 1/sqrt(2) ≈ 0.707, and 1/2=0.5. Then the amplitude squared: 0.5 and 0.25 for the individual B branches.

          - Force them to discuss by having them in small groups to decide the payout rule after the first representation. Then after the second representation, have them discuss again and then notice the inconsistency.

     Materials:

          - Index cards (many)
          - Pens
          - Whiteboard to record the state and the two representations.
          - A way to award points (we can use a spreadsheet or just record on paper).

     Stakes:

          We can award participation points for engaging in the activity and for the bets. We can also award chocolates for the payouts, but since the payouts are fractions, it's easier to use points.

          We can scale the amplitude squared by 100 and round to the nearest integer? Then in the first representation for a winning B branch: (1/2)^2 * 100 = 25 points. In the second representation: 50 points.

     Let's write the activity step-by-step for Round 1:

          Step 1: (5 min) Introduction
              "We are going to simulate a quantum measurement. We have a quantum system that will be measured, and it is in a superposition. We are going to focus on the experience of one observer, Alice. Alice will place a bet on the outcome. But when the measurement happens, Alice will split into multiple copies, one for each outcome. We need to decide how to reward Alice after the split."

          Step 2: (5 min) Choose Alice and have her place a bet (say on B).

          Step 3: (10 min) First representation: three branches.
              - Write the state: |ψ> = (1/sqrt(2)) |A> + (1/2) |B1> + (1/2) |B2>.
              - Explain that Alice splits into three copies: Copy A (sees A), Copy B1 (sees B1), Copy B2 (sees B2).
              - Assign three students to be these copies. Give each an index card: 
                    Copy A: "Outcome: A, Bet: B -> Lose"
                    Copy B1: "Outcome: B1, Bet: B -> Win"
                    Copy B2: "Outcome: B2, Bet: B -> Win"
              - Ask the class: how many points should each copy receive? And what is the total points for Alice?
              - Have them discuss in small groups (3-4 students) for 5 minutes.
              - Then gather ideas. Write them on the board.
                  Likely: 
                    Option 1: Each winning copy gets 100 points, losing gets 0. So Copy B1 and B2 get 100 each, total 200.
                    Option 2: Each copy should get the same? Then maybe 0 for losing and 50 for winning? But why?
                    Option 3: Total points should be the probability of winning? But they don't know that.
              - Do not resolve yet.

          Step 4: (10 min) Second representation: two branches.
              - Now say: "We can also represent the same quantum state differently. We can combine B1 and B2 into one outcome B. The state is: |ψ> = (1/sqrt(2)) |A> + (1/sqrt(2)) |B>."
              - Now Alice splits into two copies: Copy A (sees A), Copy B (sees B).
              - Assign two students: 
                    Copy A: "Outcome: A, Bet: B -> Lose"
                    Copy B: "Outcome: B, Bet: B -> Win"
              - Ask the same question: how many points for each copy and total for Alice?
              - They will likely say: Copy B gets 100, total 100.

          Step 5: (10 min) Inconsistency
              - Point out: in the first representation, they might have awarded 200 points in total. In the second, 100 points. But it's the same quantum state and the same bet. How can we fix this?
              - Have them discuss in groups: what rule can we use that will give the same total points in both representations?
              - Guide them to think about the amplitude. Write the amplitudes:
                    First representation: 
                      A: 1/sqrt(2) ≈ 0.707
                      B1: 0.5, B2: 0.5
                    Second representation:
                      A: 0.707, B: 0.707
              - The total points for a win on B should be the same. In the first representation, we have two winning branches. In the second, one. How much should each winning branch contribute so that the total is the same?
              - They might say: in the first representation, each winning branch should get 50 points, so total 100. In the second, 100 points. But why 50? Because 100 / 2 = 50? But then if we have a representation with 4 winning branches, each would get 25? 
              - But then what is the rule? 100 divided by the number of winning branches? However, the number of winning branches is arbitrary.

              - Alternatively, use the amplitude. In the first representation, the amplitude for B is 0.5+0.5? But amplitudes don't add that way. They are complex numbers. We add the squares.

              - Tell them: the weight of a branch is the amplitude squared. For B in the first representation: the weight is (0.5)^2 + (0.5)^2 = 0.25+0.25=0.5. In the second: (0.707)^2 = 0.5.

              - So the total points for a win should be the total weight of the winning branches times a scale factor. Let the scale factor be 100. Then in both representations, the total points for B is 50.

              - Then in the first representation, each winning branch (B1 and B2) has weight 0.25, so they each get 25 points.
              - In the second representation, the winning branch has weight 0.5, so it gets 50 points.

              - Total in both: 50 points.

          Step 6: (5 min) Conclusion for Round 1
              - The branch count alone doesn't work. We need to weight by the amplitude squared.

     For Round 2, if time allows (about 30 min):

          We do two measurements in a row.

          We start with Alice. She doesn't place a bet yet. We just want to see the distribution of experiences.

          First measurement: use the three-branch representation.

              After first measurement, we have three copies: A1, B1a, B1b.

          Second measurement: in each branch, we do the same measurement (same state). So each of the three branches splits into three.

          We now have 9 branches.

          We assign 9 students to be the final copies.

          For each branch, we compute the amplitude and then the weight (amplitude squared).

          We then group the branches by the outcomes: how many A's in a row? (0,1, or 2)

          For each branch, record the sequence of outcomes.

          Then, ask: what fraction of the branches (by count) have two B's? (4/9)

          What fraction by weight have two B's? (1/4, as calculated earlier)

          And we can also see that the weight for branches that have one A and one B is 1/2 (because there are two ways: A then B or B then A, each with total weight 1/4, so 1/4+1/4=1/2).

          But by count: there are 4 branches with one A and one B? Actually, we have:

            A1 then A2: 1 branch
            A1 then B2a, A1 then B2b: 2 branches
            B1a then A2: 1 branch
            B1b then A2: 1 branch
            B1a then B2a, B1a then B2b, B1b then B2a, B1b then B2b: 4 branches

          So:
            two A's: 1 branch
            one A and one B: 2 (from A then B) + 2 (from B then A) = 4 branches
            two B's: 4 branches

          Then by count: two B's is 4/9.

          By weight: two B's is 1/4.

          And we can ask: which is the correct fraction? The one by weight, because it matches the Born rule and is consistent.

          And note: if we had used the two-branch representation for each measurement, we would have:

            After two measurements: 2^2=4 branches.

            Amplitude for two B's: (1/sqrt(2))^2 = 1/2? No, for each measurement the amplitude for B is 1/sqrt(2), so for two in a row: (1/sqrt(2)) * (1/sqrt(2)) = 1/2, then squared is 1/4.

            And there is one branch for two B's? In a two-branch representation per measurement, for two measurements we have:

              1 branch: A then A
              1 branch: A then B
              1 branch: B then A
              1 branch: B then B

            So by count, two B's is 1/4 of the branches. And the weight for that branch is 1/4.

            But in the three-branch representation, we had 4 branches for two B's, but total weight 1/4.

            So again, branch count is representation dependent, but weight is not.

     Given the time, we might only get through Round 1.

     Debrief:

          - The problem: if we count branches, we get inconsistent answers.
          - The solution: weight by amplitude squared.
          - This weighting is the Born rule.
          - Probability in the Everett interpretation is about the measure of branches, not the count.

     What the game can't reproduce:

          - The actual mechanism of quantum mechanics: why the amplitude is the thing that matters? We are just stipulating it.

          - The continuous nature of amplitudes: we used specific numbers.

     We'll have to supply: the connection to the actual quantum formalism and why the amplitude squared is the natural measure (e.g., conservation of probability, unitary evolution).

     But the activity will make the problem vivid and the solution motivated.

     Let's hope it works.
answer: |-
  ### Structured Activity: The Branching Bet Game  
  **Objective:** Students confront the ambiguity of branch counting and the need for amplitude weighting in the Everett interpretation through a hands-on simulation.  

  ---

  #### **Materials**  
  - **Index cards** (1 pack, ~100 cards)  
  - **Markers/pens** (1 per student)  
  - **Whiteboard** (to sketch branch trees and record arguments)  
  - **Stakes:** Chocolate bars or participation points (scale: 1 chocolate = 100 points)  
  - **Timer** (for activity phases)  

  ---

  #### **Roles**  
  - **Players:** All 14 students. Each starts as a single "pre-split" observer.  
  - **Facilitator:** You (manage transitions, clarify rules, avoid lecturing).  

  ---

  ### **Timeline (90 Minutes)**  

  #### **Phase 0: Setup (5 min)**  
  - **Do NOT mention probability, branches, or quantum yet.**  
  - **Rules:**  
    - Each student gets 1 index card. They write their name and a **bet** (A or B).  
    - "A quantum split is coming. After the split, copies of you will see different outcomes. Your goal is to maximize your total winnings."  
  - **Stakes:** Betting on the correct outcome *might* earn points/chocolate.  

  #### **Phase 1: First Split + Payout Argument (25 min)**  
  - **Branch Setup:**  
    - Students split into **two groups** by a visible divider (e.g., move tables). Call this the **coarse split**:  
      - Group A (7 students): Sees outcome **A**.  
      - Group B (7 students): Sees outcome **B**.  
    - Each student in Group A writes "A" on their card; Group B writes "B".  
  - **Payout Trigger:**  
    - "If you bet on what you *actually see*, you win. How should winnings be calculated?"  
    - **Key ambiguity:** "Your" winnings could mean:  
      - (a) Summed over all your copies.  
      - (b) Averaged over all your copies.  
      - (c) Paid to each copy separately.  
  - **Group Debate (15 min):**  
    - Students argue payout rules in small groups (3–4 people).  
    - **Facilitator prompts:** "What’s fair to the *pre-split* you? What about *post-split* copies?"  
    - **Predictable conflict:** Copies in the majority outcome (B) push for (c); those in minority (A) argue for (a) or (b).  

  #### **Phase 2: Second Split + Branch Ambiguity (25 min)**  
  - **Refined Split:**  
    - Take Group B (the 7 "B" students). Tell them: "B wasn’t fundamental. We’ll split *further*."  
    - Split Group B into **seven subgroups** (1 student per subgroup). Each writes a unique sub-outcome: **B1, B2, ..., B7**.  
    - Now the room has:  
      - 7 "A" students (unchanged).  
      - 7 "B" students → each becomes **one "B_i" student** (total branches: 7 A + 7 B_i = 14).  
  - **Payout Reckoning:**  
    - Revisit the payout rule:  
      - "Before, Group B had 7 copies. Now they have 7 *sub*-copies. Should winnings for betting on B change?"  
    - **Whiteboard:** Sketch the branch tree:  
      ```  
      Initial: 14 observers  
      Split 1: 7A + 7B  
      Split 2: 7A + 7B_i (i=1 to 7)  
      ```  
  - **Reveal the Trap:**  
    - "In Split 1, betting on B meant 7 winners. In Split 2, betting on B means 7 winners (all B_i). But what if a student bet on B *before* Split 2?"  
    - Students realize: **The same physical outcome (B)** is 1 branch (coarse) or 7 branches (fine). "Counting branches" is arbitrary.  

  #### **Phase 3: Merging Branches + Weighting (20 min)**  
  - **Merge Experiment:**  
    - Take 3 "B_i" students. Tell them: "Your outcomes B1, B2, B3 are now *indistinguishable*. Merge into one branch: **B_merged**."  
    - These 3 students crumple their cards; 1 new card represents **B_merged**.  
    - Branch count now: 7A + 5B_i (i=4,5,6,7) + 1 B_merged = 13 branches.  
  - **Payout Crisis:**  
    - "The 3 merged copies no longer exist. Where do *their* winnings go? Should B_merged inherit them?"  
    - **Argument:** If winnings were *summed*, B_merged gets 3x payout. If *averaged*, it’s messy. If *per-copy*, the winnings vanish.  

  #### **Phase 4: Repeated Trials & Frequencies (Optional, 10 min)**  
  - **Quick Simulation (if time):**  
    - Students build a **2-measurement branch tree** on the whiteboard:  
      - First split: 2 branches (A/B).  
      - Each splits again: 4 branches (AA, AB, BA, BB).  
    - Assign amplitudes:  
      - A: `a = √(1/3)`, B: `b = √(2/3)` → Born probabilities: P(A)=1/3, P(B)=2/3.  
    - "Most branches (3/4) see BB, BA, or AB. But is that ‘most’? Remember: branches are arbitrary!"  
    - **Revelation:** "If we weight branches by amplitude squared (`|a|^2`), 4/9 of the *weight* is on AA/AB/BA, 5/9 on BB. But ‘most’ *unweighted* branches (3/4) see B-dominated outcomes."  

  ---

  ### **Debrief Mapping (5 min)**  
  | **Activity Moment**               | **Concept Revealed**                                                                 |  
  |-----------------------------------|--------------------------------------------------------------------------------------|  
  | Phase 1: Payout argument          | **Payoff rule ambiguity** = Born rule problem. Is probability per copy or total?    |  
  | Phase 2: Coarse vs. fine splits   | **Branch count is ill-defined**. Depends on description, not physics.                |  
  | Phase 3: Merging branches         | **Identity crisis**: Copies aren’t conserved. Weight must be intrinsic to branches. |  
  | Phase 4: Repeated trials          | "Majority of branches see Born statistics" assumes weighting (circular if unweighted). |  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Students fixate on "fairness" without seeing structural issues.  
    - **Fix:** Force them to vote on payout rules *before* revealing splits. Record arguments verbatim.  
  - **Problem:** The amplitude-squared weighting feels arbitrary.  
    - **Fix:** **Do not derive it.** Say: "You discovered branch-counting fails. Weighting fixes consistency—we’ll see *why* in QM next week."  
  - **Problem:** Merging feels "unphysical."  
    - **Fix:** Stress: "QM has no ‘official’ branches—we coarse-grain based on decoherence."  

  ---

  ### **What the Game Can’t Do**  
  - **Amplitude ≠ Branch Count:** Students might still think "larger amplitude = more branches." You must clarify: **Amplitudes are primary; branches are emergent from decoherence.** Use the whiteboard to sketch a superposition like `√(1/3)|A⟩ + √(2/3)|B⟩` and ask: "How many branches? It’s undefined until we specify *what’s measured*."  

  ---

  **Final Note:** This turns the "what is a branch?" argument into a lived dilemma. By Phase 2, they’ll *feel* the ambiguity—no lecture needed. Save "Born rule" for the debrief.
