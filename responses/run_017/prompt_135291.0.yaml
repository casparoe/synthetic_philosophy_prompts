answer: |-
  The vending machine coffee had gone tepid and oily. Malin stared at the cup on the rolling tray, the dimmed pre-op room lights reflecting dully in its surface. Outside the door, the muffled sounds of the neurosurgical ward – a cart rattling, a distant page – felt like intrusions from another planet. Beside her, Bo, the chaplain-in-training, sat quietly, radiating an unsettling calm. Opposite, leaning against the wall with an infuriating blend of professional detachment and intense focus, was Dr. Vero Oyelaran. His scrubs were pristine, his posture relaxed, but his eyes held the sharpness of the scalpel he’d wield tomorrow inside her skull.

  "You’re still clinging to the ghost in the machine, Malin," Vero said, his voice low but cutting through the sterile silence. "Tomorrow, when I stimulate area V4, you *will* report seeing colour – vivid, specific colour – triggered solely by an electrode. Where’s the causal power of the experience in that?"

  Malin shifted, the IV line tugging faintly at her hand. "The electrode causes the neural state *associated* with the experience, Vero. And it causes the report. Fine. But the report is *about* the experience. If the experience itself is causally inert…" She paused, marshalling the thought that had kept her rewriting this scene for weeks. "...then what makes your report *about* the experience? What pins it to that specific ghost, rather than just being another noise caused by the electrode, or the neurons, or the phase of the moon? If the experience doesn’t cause the judgment, why isn’t the judgment just… adrift?"

  Vero pushed off the wall, stepping closer. The dim light caught the silver streaks in his close-cropped hair. "It’s not adrift. The electrode stimulation causes *both* the neural correlate of the experience *and* the neural activity for the report. They’re parallel outputs on a shared physical base. Like two lights wired to the same switch. The report reliably carries information *about* the experience because they share a common cause."

  Bo leaned forward slightly. "So the report isn't caused *by* the seeing, but it still... points to it? Because they happen together?"

  "Precisely," Vero nodded at Bo, then turned back to Malin. "Correlation without direct causation. The physical substrate does the heavy lifting, the experience rides along, and the report accurately describes it. No paradox."

  Malin felt a familiar flare of frustration, mixed with the cold dread of tomorrow. "Reliable correlation *now*, Vero. But on your view, the experience is an extra, non-physical thing, right? So, logically, there *could* be a scenario where that exact physical state – the electrode firing, the neurons buzzing – happens, but the experience *isn’t there*. A zombie version of me, physically identical, would give the *exact same report* about seeing orange, even if there was nothing it was like to be her. Right?"

  Vero didn’t flinch. "A hypothetical. We have no evidence such a scenario is possible."

  "But you’ve *defined* the experience as separable! If it’s logically possible, then the report doesn't actually track the *experience* across that variation. It only tracks the physical state. So in what sense is the report *about* the experience *at all* in that moment? It's just a noise correlated with a physical event, falsely labelled as being about something else." Malin’s voice tightened. "Your 'reliable information carrier' breaks down the moment you admit the experience *can* vary independently, even if only in thought experiments."

  Vero was silent for a beat, then he crouched slightly, bringing himself level with Malin’s bed. The movement felt strangely intimate, disarming. "You’re thinking of the judgment *causing* the report, Malin. But that’s the wrong model for the present tense. When you say ‘This is what orange looks like right now,’ *now*… that judgment isn’t *caused* by the experience. It’s *constituted* by it. The experiencing *is* the knowing. It’s self-intimating. There’s no gap to bridge, no causal chain needed. The report expresses that immediate knowing."

  Malin stared at him. The simplicity of the move was audacious. "Constituted? So the judgment *has* the experience as a part? Like… the judgment *is* the experience plus some linguistic tag?"

  "Not necessarily a 'part' in a spatial sense," Vero countered, rising slightly. "More that the phenomenal character *is* the ground of the present-tense judgment. It’s what makes it true, and what makes its authority immediate."

  "Okay," Malin said slowly, the surgical implications clicking into place like a bone. "So tomorrow. You zap my cortex. I yell ‘Orange!’ According to you, *if* I have the experience, my report is constituted by it. It’s self-intimating. Fine. But *if* – on your view – the zap *only* causes the physical state and *not* the experience… what then? What constitutes *that* report? The physical state alone? So now you have two completely different kinds of judgments: one constituted by an experience, one constituted by… brain juice? And they sound identical? That seems like splitting your theory into whatever’s convenient at the moment."

  Vero’s jaw tightened almost imperceptibly. "The report is always physically caused. The constitution concerns the *content* and its *truth-maker*."

  "But the *form* is identical! 'I see orange.' How does that help with the stimulated case? Does the stimulated report mean the same thing as the genuine one if it’s *not* constituted by an experience? If it’s just ‘brain juice’, then it’s not *about* an experience at all! It’s just a noise the machine makes. So your ‘self-intimation’ only covers the ‘real’ cases, leaving the stimulated reports – the ones *you* will elicit – fundamentally different and deceptive?" Malin pressed. "And what about memory? Tomorrow, hours after your zapping party, when the drugs are wearing off and someone asks me, ‘Did you see anything in there?’, that’s a *retrospective judgment*. It’s not present-tense. It’s not constituted by the experience happening *now*. So what grounds *that*? A fading neural trace? How does *that* trace carry information about the *experience*, if the experience itself never caused anything and the original judgment was only ‘constituted’ in the fleeting moment? How does it avoid being just another physical effect, potentially utterly disconnected from the ghost it's supposed to describe?"

  Bo shifted uncomfortably. "The memory… it wouldn't be about the experience itself? Just about the... physical event?"

  "Precisely the problem, Bo," Malin said, her gaze locked on Vero. The plot point – the question she'd be asked later – hung unspoken but heavy between them. "If the experience did nothing, how can a memory hours later be *about* it? Vero’s constitution trick only works for the instantaneous ‘now’. It evaporates the moment the ‘now’ becomes the ‘then’. So history, testimony, confirmation… all of it rests on judgments supposedly caused by something that, on his view, *can't* cause anything. It collapses."

  Vero stood up straight, his expression unreadable in the low light. "The memory trace is caused by the *original neural state*, Malin. The state that was also the ground of the experience. The report *then* is about the *experience* because it refers back to that moment of constituted judgment. The causal chain is physical, the reference is fixed by the original constitution."

  "Original constitution that only existed in a vanishing instant?" Malin’s voice was low, edged with exhaustion and something sharper. "It feels like you’re building a house of cards on a foundation of smoke. But here’s the kicker, Vero. Apply it to *this*. Right now. You’re arguing for epiphenomenalism. You’re giving reasons. You’re responding to *my* points. But if you’re right, *none* of your conscious thoughts – your beliefs, your understanding of my argument, your desire to convince me – are actually *causing* you to speak. They’re just along for the ride. Your vocalizations are entirely caused by the physics in your skull. So in what sense," she leaned forward, the thin hospital gown rustling, "*are you actually answering me*? Aren’t you just producing sounds that happen, by sheer physical coincidence, to track the conversation? Why should I engage with what feels like an answer if, on your own terms, it’s just noise generated by mechanisms untouched by reason or meaning?"

  The room felt suddenly colder. Bo looked between them, wide-eyed. Vero didn’t look away. He took a slow breath, his usual clinical composure momentarily replaced by a flicker of… something deeper. Respect? Annoyance?

  "That," he said quietly, "is the hardest sell. But it confuses two things. Whether my *belief* in epiphenomenalism is *true* and well-grounded, and whether my *conscious reasoning* is what’s *causally effective* in producing my speech. The physical processes in my brain implement reasoning. They instantiate my understanding of the arguments – *your* arguments – and generate responses consistent with my beliefs. The conscious experience might be the ‘what it’s like’ of that reasoning, but it doesn’t *drive* it. The conversation is real, Malin. The reasons are exchanged. The causal efficacy belongs to the physical implementation. The meaning…" he gestured slightly, "...the meaning supervenes. The fact that my sounds *track* the logic, that they *respond* to you, is because the underlying physical system is doing the work of reasoning. The consciousness is the… the glow. It doesn’t make the engine run, but it’s what the running *looks like* from the inside. To ask why you should engage is like asking why you should listen to an eloquent recording. The eloquence is real, even if the speaker isn’t consciously pushing the play button *now*."

  Malin opened her mouth, the counterarguments flooding in – about the intimacy of *this* moment, the feeling of being *answered*, the sheer absurdity of reducing this fraught, personal, terrifying pre-op debate to eloquent recordings and causal engines. But before she could speak, the door swung open abruptly.

  A nurse bustled in, her scrubs crisper than the hour warranted, holding a small paper cup and a syringe. "Dr. Oyelaran? They need you in the OR prep. Malin? Time for your pre-med. Gets the party started." Her tone was cheerfully oblivious to the metaphysical abyss that had just yawned in the dim room.

  Vero straightened, the surgeon’s mask snapping back into place. He gave Malin a curt nod, his eyes unreadable again. "We’ll continue this tomorrow. During the mapping." It sounded like a promise, or a threat. He turned and left without looking back.

  Malin looked at the paper cup in the nurse’s hand, then at Bo’s concerned face, then back at the doorway Vero had vanished through. The cold coffee on the tray seemed to stare back at her. The nurse advanced, syringe glinting under the fluorescent hall light spilling into the dim room. The arguments, the clever moves, the desperate need to get it *right* before they opened her head… they suddenly felt as insubstantial as the ghost Vero claimed her consciousness was. Yet the terror, the *what it is like* to be here, now, awaiting the knife… that felt like the only solid thing left in the universe. She held out her arm for the needle, the sterile smell of alcohol suddenly overpowering. The conversation was over. The problem wasn’t. The electrode waited.
