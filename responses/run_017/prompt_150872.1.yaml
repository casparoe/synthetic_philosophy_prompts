  The user wants to know if there's a term for this pattern. They’ve mentioned examples like workhouse inmates versus commoners and a hillside settlement only documented through its destruction. They need a definition that covers cases like destroyed records, self-documenting communities, modern data, and elite documentation. They also want clarity on the mechanism, boundaries, and potential conflation of effects.

