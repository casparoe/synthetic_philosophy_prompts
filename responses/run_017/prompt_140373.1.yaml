answer: |-
  Here’s a structured plan for your fifty-minute seminar, focusing on pre-emptive framing, misconception management, and pedagogical precision:

  **I. Prerequisites Before Stating the Puzzle (10 mins)**  
  *Crucial groundwork to prevent "willpower" derailment and conceptual conflation:*  
  1. **Distinguish Intending vs. Predicting**  
     - *Activity:* "Raise hands if you predict you’ll have coffee tomorrow. Now, raise hands if you currently *intend* to have coffee tomorrow." Highlight divergence (e.g., predict yes but intend no if avoiding caffeine).  
     - *Key Point:* Intentions are *commitments to act*; predictions are *beliefs about what will happen*.  
  2. **Distinguish Intending vs. Desiring**  
     - *Example:* "You desire to sleep in, but intend to attend this seminar. Why?" Stress that intentions override conflicting desires *by choice*.  
     - *Key Point:* Desires are passive states; intentions are active commitments we *adopt*.  
  3. **Clarify Rationality in Action**  
     - *Frame:* "Rational action isn’t just about outcomes—it’s about *reasons for committing now* to future acts. Can rationality demand forming a commitment you know you’ll abandon?"  

  **II. Presenting the Case: Essential Features & Pitfalls (5 mins)**  
  *State the puzzle with these non-negotiable elements:*  
  - **Must Have:**  
    - The toxin makes you *acutely ill for a day* (not lethal, but severely undesirable).  
    - The reward is *sufficiently tempting* (e.g., £1 million).  
    - *No external enforcement* (no contracts, guns, or magic binds).  
  - **Must Avoid:**  
    - **Infallible detectors:** *Do not use this.* It misdirects toward epistemic anxiety ("Can I fool the machine?"). Instead, say: "*Assume you cannot credibly fake an intention. If you genuinely lack it, it will be evident.*" The puzzle concerns *whether you can form it*, not whether you can hide your lack of it.  
  - **Core Isolation:** Emphasise: "This isn’t about willpower weakness. Assume you’re fully capable of drinking if you intend to. The question is whether a *rational person* can form that intention *tonight*, knowing they’ll abandon it tomorrow."  

  **III. Misconceptions: Sequence & Defusal Tactics (25 mins)**  
  *Anticipated responses in order of appearance, with targeted interventions:*  

  1. **"Just take the money and don’t drink!"**  
     - *When:* Immediately after stating the case.  
     - *Defusal:* "Ah, but *can you intend to drink tonight*? Remember: the money requires sincere intention tonight, not just drinking tomorrow. If you *already plan* to defect, you don’t genuinely intend to drink—so no reward."  
     - *Tool:* Return to the intention/prediction distinction: "Do you *predict* you won’t drink, or *intend* to drink?"  

  2. **"I can intend because I might irrationally drink later!"**  
     - *When:* As students grasp the intention barrier.  
     - *Defusal:* "But the puzzle assumes you’re rational *at all times*. If you drink tomorrow, it’s *because* you irrationally formed the intention tonight—not because you’re sometimes irrational. Can rationality *recommend* forming an intention you’ll *later* regret as irrational?"  
     - *Reframe:* "This isn’t about self-doubt—it’s about whether forming the intention is rationally justified *now*."  

  3. **"Intentions are just predictions!"**  
     - *When:* When frustration mounts (often after defusing #2).  
     - *Defusal:* Revisit the coffee example. Ask: "If intentions were predictions, could you ever 'change your mind'? Changing a prediction isn’t a choice—it’s a response to evidence. Intentions are *up to us*."  
     - *Clincher:* "If I predict I’ll drink, I get £1m only if I *happen* to drink. But the tycoon pays for *intending* tonight—even if a meteor stops you drinking tomorrow. Intentions ≠ predictions."  

  4. **"Use a commitment device!"**  
     - *When:* As a "solution" late in discussion.  
     - *Defusal:* "Commitment devices *externalise* enforcement (e.g., betting a friend £2m to drink). But the puzzle forbids this! The challenge is whether *rational deliberation alone* can generate the intention. No tricks—just your mind tonight, facing tomorrow’s choice."  

  **IV. Diagnostic Question (5 mins)**  
  - **Put to the room:** *"If you resolve tonight to drink the toxin, what could make that resolution rational—given that you’ll abandon it tomorrow once the money’s secured?"*  
  - **What reveals grasp:** Silence, then responses recognising the *temporal dilemma*: e.g., "Nothing—because the reasons *for* drinking disappear once you have the money," or "Forming the intention is rational only if drinking is rational, but it won’t be."  

  **V. Explicit Boundary (1 min)**  
  - **Topic to avoid:** "We’re focusing on *rational intention-formation*—not moral responsibility, free will, or whether the tycoon’s offer is realistic. Those are vital but for another day!"  

  **Timing Summary**  
  - 0–10 mins: Foundational distinctions  
  - 10–15 mins: Case presentation (with critical features)  
  - 15–40 mins: Misconception sequence (allocating ~6 mins each)  
  - 40–45 mins: Diagnostic question + synthesis  
  - 45–50 mins: Q&A + boundary reminder  

  This structure isolates the puzzle’s bite—**intention as a rational commitment to an undesirable future act**—while systematically dismantling escape routes. The emphasis on pre-emptive distinctions prevents collapse into volitional psychology ("just try harder!").
