  Right, for the prerequisites before even stating the case: Must clarify that rationality ≠ self-control, distinguish intention from prediction/desire, establish that intentions can be action-guiding commitments. Should probably avoid the infallible detector version initially - it risks misleading students into thinking the problem is about detection rather than commitment formation. Better to present a standard version first.

  The misconceptions will likely cascade in this order: 1) The naive "take money and don't drink" solution 2) The self-doubt argument 3) The predictive theory of intention 4) Commitment device proposals. For each, need specific pedagogical interventions at the right moment - not just rebutting but reframing.

