prompt: |-
  I build and maintain backend services for online games, and I've never studied philosophy, so I don't have vocabulary for this beyond what the systems force on me. I keep going back and forth on what, if anything, is real about the things we store, and on when something that happens to a player counts as something being done to them. Here are my gut verdicts on cases I've actually dealt with.

  A duping bug gives another player a second copy of a mount that was supposed to be unique; I keep mine. I don't think I've been harmed, and I don't think my mount stopped being the one I earned — though I also can't say which of the two copies is mine in any deep sense, and I'd be annoyed if the company deleted mine and left the duplicate.

  Someone social-engineers their way into my account and transfers away items I spent about two hundred hours earning, in a way that can't be reversed. That's a real harm, and I think the company owes me something.

  Same theft, except the studio rolls the database back to the previous nightly snapshot and the items reappear. Here I want to say the harm has been undone: nothing to compensate, nothing to make up for. This is the verdict I'm least sure of, because if someone took my laptop and the police returned it intact a day later, I'd still say I'd been wronged — the scare and the lost day don't vanish.

  A stranger uses only mechanics the game allows to wall my avatar into a sealed box and leaves me there for six hours. Nothing of mine is deleted or altered. I still count it as a genuine harm.

  Another player kills my character in a zone where the rules explicitly permit it and where I clicked through a warning saying so. That's a real loss to me, a painful one, but I don't think I've been wronged.

  My single-player save file on my own disk, which no one else can read or write: losing it would upset me badly, but I resist saying the character in it is real in the way an object in a shared world is.

  A stretch of procedurally generated terrain that the generator function would produce but that no client has ever rendered: I want to say it doesn't exist, and I also want to say that if a player walked there they would discover it rather than create it.

  My tentative principle is in two independent parts. An object is real just in case its state lives in an authoritative shared store that more than one agent can read and write. A harm is real just in case it sets back someone's interests, full stop — and the two questions have nothing to do with each other. I can't make that principle do the work, though. It needs something extra about consenting to a rule system to say yes to the boxing case and no to the PvP kill, and if it takes the setback-of-interests clause seriously it should say the rollback case is still a harm, which is the one verdict I'd most like to keep.

  What principle, or small set of principles, captures this pattern? I'd like it stated precisely enough that I could apply it to a new ticket without guessing, with the case that motivates each clause. I also want to know honestly which of my verdicts it forces me to drop, including whether the rollback one is just a feeling I should abandon. And please say what it predicts about two cases I haven't listed: the same theft carried out in a game whose currency is officially exchangeable for real money, and a studio shutting a world down permanently at end of life and deleting the database.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a backend developer for online games, dealing with philosophical questions about the reality of virtual items and what constitutes harm to players. They haven't studied philosophy, so their understanding comes from practical experience with the systems they maintain. Their main struggle is reconciling their gut feelings about different scenarios with a coherent principle.

  First, I need to analyze their cases and their proposed principles. They have two parts: reality based on an authoritative shared store, and harm defined as setting back interests. But these don't fully explain their judgments, especially the boxing case vs. PvP kill, and the rollback scenario. The user wants a precise principle that covers all cases without contradictions.

  Looking at their verdicts, consent and expectations seem crucial. In the boxing case, the mechanics allowed it, but the player didn't consent to being trapped. In PvP, the warning and explicit rules imply consent. The rollback case is tricky because even though data is restored, the user compares it to a stolen laptop being returned—they still feel wronged. But in their work context, rollbacks are a standard recovery tool, so maybe they see it as part of the system's design.

  The user's deeper needs might include wanting ethical guidelines for handling player issues consistently. They might also seek validation of their intuitions, especially the rollback case, which they're uncertain about. The mention of real-money trade and server shutdowns suggests they need principles applicable to broader scenarios, possibly involving legal or financial implications.

  I recall philosophical concepts like Searle's institutional facts—things that exist because we agree they do. Virtual items in shared databases fit this. Harm could tie to expectancy theory: players invest time expecting certain outcomes. Violating those expectations causes harm, even without physical loss.

  For consent, it's about whether the player accepted the risks. PvP zones have clear warnings, so consent is given. Being boxed in might not have explicit consent, making it a harm. Rollbacks: if they're a known contingency, players might implicitly accept them, reducing the harm. But the emotional experience—like the scare of theft—isn't erased, which might need acknowledging separate compensations.

  Real-money trade changes harm because it involves financial loss, making it more tangible. Server shutdowns, while sad, are expected as part of the service terms, so no wrong is done if handled properly.

  The user might need to accept that some harms, like the temporary distress in rollbacks, aren't compensable but still real. Their principle could combine institutional reality with consent and expectancy. I'll draft principles that include these elements, showing where their judgments hold or need adjustment, especially the rollback case.
answer: |-
  Based on your cases and the need for precision, consistency, and applicability, here's a set of principles derived from your intuitions, addressing the gaps and providing clear verdicts:

  **Core Principles:**

  1.  **Institutional Reality:** An object, state, or event within the game world is *institutionally real* if and only if:
      *   Its existence and state are recorded in the game's **authoritative, persistent, shared database**.
      *   Its state is **meaningfully interactable** by multiple agents (players, systems) according to the game's rules *at that time*.
      *   *Motivation:* Captures the shared world aspect (database), persistence, and meaningfulness (interactability) distinguishing your mount, items, and avatar position from a single-player save or unrendered terrain. It explains why the duplicated mount feels "real" even if unique status is violated, and why unrendered terrain isn't yet real.

  2.  **Harm as Violated Expectancy:** An action causes a *harm* to a player if and only if:
      *   It results in a **significant setback to the player's legitimate interests** within the game context (time, effort, achievement, enjoyment, social standing, perceived value).
      *   This setback occurs **outside the bounds of the player's reasonably expected risks and consented rules** for the context in which the action took place.
      *   *Motivation:* Captures the core "setback of interests" but crucially adds the *consent/expectancy* filter needed to distinguish the boxing case (harm) from the PvP kill (no harm, consented risk) and the rollback (mitigated harm). It explains the theft harm and why the rollback feels less severe.

  3.  **Agency & Culpability:** A harm constitutes a *wrong* (an action for which the company or another player bears responsibility for redress) if and only if:
      *   The causal action was performed by an **agent** (player, company system, external attacker).
      *   That agent acted with **fault** (intention, recklessness, negligence, or failure of duty - including the company's duty to maintain a reasonably secure and functional system).
      *   *Motivation:* Distinguishes harms caused by malfeasance (theft, boxing) or negligence (exploitable duping bug, insecure account systems) from harms arising purely from consented mechanics (PvP) or acceptable system operations (rollbacks as recovery, planned shutdowns). Explains why the company "owes you something" in the theft case.

  **Application to Your Cases & New Principles:**

  1.  **Duping Bug (You keep yours):**
      *   *Reality:* Both mounts are institutionally real (in DB, interactable).
      *   *Harm:* No setback *to you* (you still have yours). The *system's* integrity is harmed, but not your direct interests.
      *   *Wrong:* The bug represents company fault (negligence in code/test). While *you* aren't personally harmed *this time*, the company has a duty to fix the bug to prevent future harms/system damage.
      *   *Verdict:* Consistent with your feeling (no harm to you, mount still "yours").

  2.  **Theft (Irreversible):**
      *   *Reality:* Items were real (in DB), now gone from your state.
      *   *Harm:* Significant setback (200 hours lost) outside expected risks (you didn't consent to account compromise).
      *   *Wrong:* Caused by attacker (agent) with fault (malice). Company *may* share fault if security was negligent. Harm requires redress.
      *   *Verdict:* Consistent (real harm, owed something).

  3.  **Theft (Rolled Back):**
      *   *Reality:* Items restored to DB; institutionally real again.
      *   *Harm:* **Initial Harm:** Significant setback occurred (violation, fear, lost access/time *during the outage*). **Residual Harm:** Distress, shaken trust, lost play time may persist. *BUT:* The core setback (permanent loss of items) has been remediated. *Net Harm:* Significantly mitigated, but not fully erased (the scare/lost time).
      *   *Wrong:* The *initial harm* was absolutely a wrong caused by the attacker. The *rollback* is the company acting (generally correctly) to remediate. The *residual harm* (distress, lost time) still exists due to the attacker's fault, but full compensation for *that* specific aspect may be impractical.
      *   *Verdict:* **Adjustment:** Your principle forces you to acknowledge a *residual harm* (distress, lost time) exists even after rollback. However, the *primary institutional harm* (loss of items) is undone. The company acted correctly to remediate the primary harm. Compensation *specifically* for the residual distress/lost time might be a goodwill gesture, but isn't strictly *owed* under this principle unless company negligence enabled the theft. Your gut feeling ("harm undone") captures the *institutional* remediation but minimizes the *experiential* harm.

  4.  **Boxed In (Mechanically Allowed):**
      *   *Reality:* Avatar position/state is institutionally real.
      *   *Harm:* Significant setback (6 hours lost, frustration, helplessness) outside reasonably expected risks/consented rules for general gameplay (even if mechanically possible, trapping isn't a core consented risk like PvP).
      *   *Wrong:* Caused by another player (agent) acting with fault (malicious intent exploiting mechanics). Company *may* share fault if mechanic is abusable without counterplay.
      *   *Verdict:* Consistent (genuine harm).

  5.  **PvP Kill (Consented Zone):**
      *   *Reality:* Character state change is real.
      *   *Harm:* Setback exists (loss, pain). **BUT:** This setback occurred *within* the bounds of reasonably expected risks and explicitly consented rules (warning click).
      *   *Wrong:* No fault. Action performed within the consented rules by another player. Loss is an expected outcome of the activity.
      *   *Verdict:* Consistent (real loss, no wrong).

  6.  **Single-Player Save (Local Disk):**
      *   *Reality:* **Not institutionally real.** It exists only in a non-shared, non-authoritative (client-side) store. While meaningful *to you*, it lacks the shared, persistent, authoritative interactability.
      *   *Harm:* Loss causes a setback (emotional distress, lost effort). However, this harm arises from personal loss, not an institutional reality violation or external fault within a shared system.
      *   *Wrong:* Loss likely due to accident/hardware failure, not malicious agent fault within the game context. Company has no inherent duty regarding local saves.
      *   *Verdict:* Consistent (not "real" in the shared sense, harm is personal).

  7.  **Unrendered Terrain:**
      *   *Reality:* **Not institutionally real.** While the *seed* and *algorithm* exist, the *specific terrain state* has not been generated and persisted in the authoritative DB. It's potential, not actualized.
      *   *Harm:* N/A (nothing to harm).
      *   *Wrong:* N/A.
      *   *Verdict:* Consistent (doesn't exist, discovery not creation). Walking there triggers generation/persistence, making it real.

  **New Case Predictions:**

  1.  **Theft in RMT Game:**
      *   *Reality:* Currency/Items real (in DB).
      *   *Harm:* **Massive setback.** Loss has direct, measurable financial value *recognized by the institution* (the studio). This significantly amplifies the harm beyond just playtime.
      *   *Wrong:* High fault by attacker. Company fault (if security lapse) is also amplified due to real financial stakes. **Redress is strongly obligatory.** Rollback would still leave residual harm (distress, lost time, potentially lost RMT opportunity window), but remediation of the primary financial loss is critical. Failure to remediate could have legal implications.

  2.  **Server Shutdown & DB Deletion:**
      *   *Reality:* **All institutional reality ceases.** The authoritative DB is gone.
      *   *Harm:* **Significant setback.** Loss of investment (time, effort, achievement, social connections, enjoyment). Loss of potential future enjoyment/status.
      *   *Wrong:* **Generally, no fault/wrong.** Provided: (a) The shutdown is communicated well in advance per Terms of Service. (b) The shutdown is a legitimate business decision, not negligence or malice. Players implicitly consent to the eventual end-of-life when engaging with an online service. The harm is real and painful, but it occurs within the bounds of the reasonably expected lifecycle of the service. *Exception:* If shutdown is sudden, deceptive, or violates specific promises, fault/wrong could exist.

  **Summary of Adjustments:**

  *   **Rollback Case:** You must acknowledge a **residual experiential harm** (distress, lost time) even after institutional remediation. While the primary wrong is addressed, this residual aspect exists. Your feeling that "nothing to make up for" is slightly too strong; the *institutional* harm is undone, but the *experience* wasn't harmless. Acknowledging this residual harm better aligns with your laptop analogy.
  *   **All Cases:** The principles now explicitly handle consent/expectancy (distinguishing boxing from PvP) and agency/fault (determining *who* is responsible for redress).

  These principles provide a structured framework grounded in the nature of the system (institutional reality), player experience within the system's rules (harm as violated expectancy), and responsibility (agency & fault). They should allow consistent application to new tickets by asking:
  1.  Was the affected object/state *institutionally real*?
  2.  Did the action cause a *significant setback* to the player's interests?
  3.  Did that setback occur *outside the player's expected and consented risks* for that context?
  4.  Was the action caused by an *agent* acting with *fault* (intent, negligence, etc.)?
