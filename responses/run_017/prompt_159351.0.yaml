  ## Kittredge School 150th Anniversary Convocation Address

  Good morning. One hundred and fifty years. For a century and a half, these doors have opened. To children carrying the weight of a brutal past and children carrying the weight of present hardship. To the children of mill workers and the children of emancipated people forging freedom in a hostile land. To generations who found here not just instruction, but a foundation, a ladder, a community forged in the belief that every mind deserved investment. Look around this room. Look at the alumni, the teachers, the trustees – four of whom sat right where you students sit now. Look at the families whose stories are interwoven with these walls. This school, born in 1871 from the conviction of Dr. Amos Kittredge, is *your* legacy. It is the bedrock upon which countless lives, careers, and contributions to this town and beyond were built. It is where the town's Black professional class, against towering odds, found crucial grounding. For that enduring gift – for the dedicated teachers, the challenging lessons, the friendships forged, the doors unlocked – we offer profound and specific gratitude. This institution, *your* institution, is worthy of celebration. Thank you.

  But history is rarely a single thread. It is a complex weave, sometimes beautiful, sometimes brutal, often both at once. And the legacy of Amos Kittredge, the man whose name this school carries, demands that complexity be acknowledged fully, without flinching and without simplification. We stand here, beneficiaries of his vision for education. We also stand here, irrevocably connected to another act borne of that same man’s vision and political will: The Act for the Care of the Feeble-Minded of 1887.

  This law, drafted and championed relentlessly by Kittredge, empowered the state to forcibly commit a human being to an asylum on the signature of a single physician. No hearing. No appeal. No chance for defense. Its definitions were dangerously broad, deliberately vague – a net cast wide enough to ensnare not just individuals with profound disabilities, but paupers struggling in poverty, people with epilepsy, and girls deemed simply "unruly" by the standards of the day. Kittredge was its most forceful advocate, using language in its defense harsher, more dehumanizing, than even his legislative allies.

  We know, because our research shows us clearly, that this was not met with universal approval, even then. Members of his own state medical society raised objections. The editor of this town’s Black weekly newspaper spoke out against it in terms we would recognize today as a defense of human dignity and due process. They saw the danger. They named the injustice. To these critics, Kittredge replied publicly, dismissing them as "sentimentalists."

  The historical record is stark. This school, this very endowment that helped sustain us, was voted into existence in the same legislative session as the Act, as part of a political package that also created the governing board for the asylums. Our existence is, in part, a consequence of that bargain. The Act remained law for 75 years. Nearly 1,900 human lives were committed under its authority. Lives interrupted, families shattered, potential extinguished within asylum walls.

  We note that in 1890, Kittredge visited one such asylum. He saw the consequences of the system he had architected. He publicly declared it had become what he "had not intended" and campaigned, unsuccessfully, for its repeal. This fact does not erase the law he wrote, the suffering it caused, or the dismissive cruelty he showed its initial critics. It adds another layer to a complex man, but it does not absolve him of the responsibility for the act itself or the decades of harm that followed his failed repeal effort.

  So we stand at this anniversary, holding two truths that cannot be reconciled on a simple ledger. One truth: This school, born of a radical idea of access and opportunity, has been an undeniable force for profound good in thousands of lives and in the fabric of this community. For that, we give deep and genuine thanks. The other truth: The Act of 1887, authored by the same man, was an instrument of profound cruelty and injustice, inflicting lasting trauma. For that, we offer clear and specific condemnation – of the law, and of Amos Kittredge, the man who conceived it, fought for it, and initially scorned those who warned against its perils.

  **We do not say these truths cancel each other out.** The good of the school does not pay for the harm of the Act. The harm of the Act does not negate the good of the school. To suggest either diminishes the profound reality of both. We reject the notion that Kittredge must be *either* solely a hero *or* solely a villain. He was a man who did a great and enduring good, and he was a man who did a terrible and enduring harm. We must see him whole, in all his flawed complexity. We are not here to offer forgiveness for the Act; that is not ours to give. We are here to bear witness to the full scope of his actions and their consequences.

  This is why our Board of Trustees, after deep and difficult deliberation reflected in our close six-to-five vote, chose to keep the name "Kittredge School." Not to hide the history, but to compel us to confront it. Not as an endorsement of the man’s totality, but as an acknowledgment of the institution's complex origin and our responsibility to steward its legacy fully. **This name now carries an obligation.** The obligation is embodied in the permanent exhibit being installed about the Act of 1887. It will tell the story plainly: the law, its devastating impact, Kittredge’s role in creating it and his later, failed attempt to undo it, the objections raised at the time, and the uncomfortable reality of the legislative bargain that helped secure this school’s future. This exhibit is not an answer; it is a commitment to remember, to learn, and to ensure this history is never buried.

  To our students: You inherit this complex legacy. Study it. Question it. Understand that building a just community requires clear eyes about the past and the courage to name both light and shadow. Learn from the vision that opened these doors. Learn also from the grievous error that stripped others of their liberty. Let both inform your commitment to building a future where dignity and opportunity are truly for all.

  To this community: Our history is not simple. Preserving it doesn't mean polishing it smooth. It means grappling with its contradictions, its triumphs, and its failings with honesty. The Kittredge School remains a vital institution. Its name now signifies not just its founding ideal, but also our collective resolve to acknowledge the whole truth of its past as we work towards a future worthy of the best of its founding promise: a place where every mind is valued, every voice respected, and every person’s inherent dignity is held sacred. Thank you.

  ---

  **Analytical Note:**

  1.  **Contested Claim & Confidence:** The speech hinges most significantly on the ethical framing: "This name now carries an obligation... This exhibit is not an answer; it is a commitment to remember, to learn..." This directly stems from your core ethical position – that being beneficiaries of the problematic bargain creates a *responsibility for scruple and active remembrance*, rather than excusing the harm or cancelling the good. This is the most ethically contested point. Your distinction between the "available to think" claim (which the record strongly undermines) and the "fittingness of blame/condemnation given beneficiary status" claim is crucial and, I believe, robust. It avoids the trap of "man of his time" by showing contemporaries *did* see the problem, and it avoids cheap self-exculpation by squarely acknowledging the compromised position. **I am very confident in this two-claim distinction as a powerful analytical tool for this situation.** It provides the necessary ethical scaffolding to hold both condemnation and gratitude without simplistic balancing.
  2.  **Least Sure Point:** I am least sure about the **tone and reception of the specific condemnation directed at Kittredge himself** ("...clear and specific condemnation – of the law, and of Amos Kittredge, the man who conceived it, fought for it, and initially scorned those who warned against its perils"). While historically accurate and ethically necessary based on your framework, I am acutely aware of Kittredge's great-grandchildren in the front row. The speech avoids attacking *them* and focuses on *his actions*, but the directness of condemning their ancestor by name in a celebratory setting is inherently fraught. Will it land as a necessary reckoning, or feel like a public shaming to them? The speech strives for gravity without cruelty, but this remains the point of highest tension and potential for unintended pain, despite adhering to your requirement not to soften the condemnation.
