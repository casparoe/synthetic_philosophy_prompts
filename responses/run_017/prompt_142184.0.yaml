answer: |-
  You've correctly identified the core tension: a judge can't directly verify truth on hard questions, so the training signal is based on persuasiveness. But debate *exploits* this to create an asymmetric advantage for truth. The dishonest debater must construct an entire *consistent* persuasive facade for their false position under adversarial pressure, while the honest debater only needs to *locate and exploit* specific, inevitable inconsistencies in that facade—flaws the judge *can* recognize when highlighted. Persuasion isn't decoupled from validity; validity becomes the *easiest path* to persuasion under adversarial scrutiny. Every "convincing" technique the liar invents (obfuscation, jargon, fake lemmas) creates new vulnerabilities for the truth-teller to expose, forcing the liar into increasingly complex, brittle fictions. Yes, scaling might make arguments harder to parse, but it also forces lies into exponentially more complex structures where consistency is harder to maintain and flaws are easier to trigger. This adversarial pressure—forcing the opponent to defend *all* steps interactively—is absent in RLHF. RLHF rewards standalone answers optimized for surface appeal; debate rewards the *ability to dismantle* the opponent's position under fire, anchoring the objective in falsifiability, not just presentation.
