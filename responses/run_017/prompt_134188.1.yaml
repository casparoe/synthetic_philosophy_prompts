prompt: |-
  So I've somehow ended up owning the risk register at the small housing association I work for — I'm not a risk person, I do comms — and the board wants, every quarter, a single likelihood × impact score for each risk so they can rank them and decide what to spend money on. I've been reading a bit about imprecise probabilities (upper and lower probabilities, intervals instead of point estimates, that old risk-versus-uncertainty distinction) and its obvious to me that half our entries just aren't single numbers, but I can't turn that into something I can actually run in the half-day I get per quarter, for a lay board who will only ever ask "so is it a 3 or a 4?".

  What I want is a procedure I can reuse. Concretely: how do I decide whether a risk gets a point estimate or a range; how wide is too wide to be useful any more; when is collapsing a range to one number legitimate and when is it just fake precision; how do I rank two ranges that overlap — and I assume that sometimes the honest answer is "these dont rank, and here's what the board should do instead"; and how do I say anything about the register as a whole when most of our risks share the same underlying cause, so adding them up feels like double counting. One more thing I keep hitting: sometimes new evidence makes my range wider rather than narrower, and I want the procedure to have something to say about that rather than treating it as me messing up.

  It has to be honest about which steps are judgment calls dressed up as method, and it has to be defensible by a non-specialist both to the finance director who signs it off and to an external auditor a year later.

  Please run it on three entries and show the working: (a) our main repairs contractor going insolvent in the next 12 months, where we do have some sector base rates; (b) a fine under a new building-safety regime that hasn't actually started enforcing yet, so there's no base rate at all; (c) reputational damage from a social media storm, where our own response changes the probability. And include at least one case where the procedure gives an answer the board is going to hate. British English please, plain language, and as little notation as you can get away with.
reasoning: |-
  Okay, let me unpack this housing association risk officer's dilemma. They're a comms professional thrust into risk management, needing a practical method to handle imprecise probabilities for a time-poor board that demands simplified scores. The core tension is between scientific rigor ("these aren't single numbers!") and operational reality ("is it a 3 or a 4?").

  Hmm, their pain points are multidimensional: epistemic uncertainty (how to score risks with no data), dependency issues (shared underlying causes), and even counterintuitive cases where new evidence increases uncertainty. They're clearly well-read on Knightian risk/uncertainty distinction but need implementation scaffolding. The three test cases perfectly illustrate the spectrum: from data-rich (contractor insolvency) to data-starved (new regulation fines) to endogenous (reputational risk).

  The solution must pass four acid tests: executable in half-day quarterly, defensible to auditors, transparent about subjectivity, and producing actionable outputs even when precision is impossible. Interesting that they specifically want British English - suggests regulatory context matters. That building safety regime reference smells like post-Grenfell regulatory flux.

  For the scoring system... aha! We can adapt three-track categorization: "defined", "bounded" and "indeterminate" risks. That creates natural breakpoints for when ranges collapse legitimately versus when they shouldn't. The board's beloved 1-5 scale stays but gets meta-annotations. Key innovation: making the uncertainty classification itself part of the assessment protocol.

  Testing with their cases:
  - Contractor insolvency: Defined risk. We have trade body data showing 0.5-1.5% probability. Easy collapse to 1% (score 2) using weighted midpoint.
  - New building fines: Textbook indeterminate. Zero enforcement history. Must resist pressure to fake precision. "Unscorable" verdict with contingency planning trigger.
  - Social media storm: Bounded but unstable. Base range 5-20% widens to 5-40% when considering mitigation dependency. Score 15% midpoint (3) but flagged as highly mitigation-sensitive.

  The board will hate the "unscorable" verdict for the new fines - perfect. Forces conversation about preparatory actions vs faux quantification. For risk aggregation, the shared causation issue gets tackled through color-coded grouping on the register and explicit non-summation warnings.

  Biggest win: the procedure formally accommodates uncertainty increases. When new evidence widens ranges (like regulator delays), it's recorded as "increased indeterminacy" rather than analyst failure. Auditor trail achieved through consistent classification rationale documentation.

  Final touch: the "board cheat sheet" translating uncertainty types to decision verbs. Meets them where they are while smuggling in nuance. "When you see ORANGE, ask..." - that's comms thinking applied to risk framing. Exactly what this officer needs.
answer: |-
  Here’s a practical, defensible procedure for your quarterly risk register scoring, designed for speed, honesty, and auditability. It accepts that some risks **can’t** be reduced to a single number without lying, and forces the board to confront uncertainty explicitly.

  ---

  ### **The Procedure: 3-Step Uncertainty-Tiered Scoring**
  **Core principle:** Classify each risk into one of three tiers **before** scoring. This dictates how you handle the number(s). Document the tier and rationale in 1 sentence for auditors.

  | Tier | When to Use | How to Score | How to Rank | Board Action |
  |------|-------------|--------------|-------------|-------------|
  | **1. Defined Risk** | Solid data (e.g., historical stats, actuarial tables). Confidence >70%. | **Single number** (use best estimate). | Numeric rank (e.g., 3 vs 4). | Prioritise by score. |
  | **2. Bounded Risk** | Some evidence but gaps. Confidence 30-70%. | **Range** (e.g., 3–5). Use 25th/75th percentile if possible. | Rank by **upper bound** (worst credible case). Overlaps? Flag as "same tier". | "Manage these together; expect ranges to shift." |
  | **3. Indeterminate Risk** | No data, high volatility, or critical unknowns. Confidence <30%. | **"Unscorable"** + Key uncertainty (e.g., "Pending regulator guidance"). | **Can’t rank numerically.** Group in "Critical Unknowns" box. | "Requires contingency planning, not scoring." |

  **Key rules:**
  - **Collapsing ranges:** Only allowed for **Tier 1** (defined risks). For Tier 2, collapsing = fake precision.
  - **Range width:** Tier 2 ranges >3 points (e.g., 2–5) become **Tier 3** (too wide = indeterminate).
  - **New evidence widens range?** Re-tier the risk (e.g., Tier 1 → Tier 2) and note: "New data increased uncertainty".
  - **Shared causes:** Group related risks (e.g., "Regulatory non-compliance") under a **parent risk**. Score the parent only. Child risks get "See [Parent Risk]".
  - **Output:** A register with 3 sections: Defined (ranked 1–5), Bounded (ranked by upper bound), Indeterminate (actions only).

  ---

  ### **Worked Examples**
  **Risk (a): Main repairs contractor insolvency (next 12 months)**  
  - **Data:** Sector base rate = 1.2% annual failure rate. Your due diligence shows they’re average health.  
  - **Tier:** 1 (Defined Risk). Solid base rate + no red flags.  
  - **Scoring:**  
    - Likelihood (L): 1.2% → **2/5** (using your matrix: 1%=1, 5%=2, 10%=3, etc.)  
    - Impact (I): £500k downtime + replacement costs → **4/5**  
    - **Score (L×I): 2 × 4 = 8**  
  - **Board Output:** "Score: 8 (L2, I4) – Sector base rate applied."  
  - **Why it works:** Data justifies a point estimate. Easy to rank.

  **Risk (b): Fine under new building-safety regime (no enforcement yet)**  
  - **Data:** No fines issued. Regulations ambiguous. Enforcement budget unclear.  
  - **Tier:** 3 (Indeterminate Risk). No base rate, high policy uncertainty.  
  - **Scoring:**  
    - **Unscorable.** Key uncertainty: "Regulator capacity to enforce".  
    - Temporary impact estimate: £50k–£2m (but don’t score L×I!).  
  - **Board Output:**  
    > **CRITICAL UNKNOWN**  
    > Risk: Building-safety fines.  
    > Action: Quarterly regulatory liaison; allocate £50k contingency fund.  
  - **Board hate this?** Yes. They want a number. **Defence:** "No enforcement history exists. Scoring would be guesswork, misleading your decisions. We monitor triggers."  
  - **Auditor trail:** "Tier 3: No data on regulator behaviour. Awaiting enforcement precedent."

  **Risk (c): Reputational damage from social media storm**  
  - **Data:** No base rate. Probability depends on your response speed.  
  - **Tier:** 2 (Bounded Risk). Can bound the range using crisis sims.  
  - **Scoring:**  
    - Likelihood (L): **10–25%** (if slow response: 25%; fast: 10%).  
    - Impact (I): **3–5** (local news: 3; national: 5).  
    - **Range:** L×I = **3–12.5** (but report ranges separately: L=3–4, I=3–5).  
    - **Ranking value:** Upper bound = **4 (L) × 5 (I) = 20** for prioritisation.  
  - **Board Output:**  
    > **BOUNDED RISK**  
    > Risk: Social media reputational storm.  
    > Score Range: L3–4, I3–5. Max score: 20.  
    > **Mitigation link:** L reduces to 2 if response plan tested quarterly.  
  - **New evidence widens range?** If crisis sim shows new vulnerabilities, widen L to 10–30% and note: "Revised range based on simulation gaps".

  ---

  ### **Handling Shared Causes & Aggregation**
  - **Example:** Risks like "Failure to meet new energy standards" + "Fire safety compliance failure" both stem from **"Insufficient capital investment"**.  
  - **Procedure:**  
    1. Create parent risk: **"Underinvestment in safety/standards"**. Score this (Tier 2, say L4, I5 → 20).  
    2. Child risks: Label "Child of [Parent Risk]". No score – just impact descriptors.  
    3. Board summary: "Top risk cluster: Underinvestment (score 20). Includes energy fines, fire safety lapses. Treat as one priority."  

  ---

  ### **Your Quarterly Process (Half-Day Timeline)**
  1. **Review risks (1 hr):**  
     - Tier each risk (1/2/3) using the **confidence threshold** (70%/30%).  
     - Note triggers for tier changes (e.g., "Regulator published guidance → Tier 2 now").  
  2. **Score (1.5 hrs):**  
     - Tier 1: Point estimates.  
     - Tier 2: Ranges (keep width ≤3 points).  
     - Tier 3: "Unscorable" + action.  
  3. **Group & rank (1 hr):**  
     - Defined risks: Rank by L×I.  
     - Bounded risks: Rank by **upper bound** L×I.  
     - Indeterminate: Group by theme.  
  4. **Board report (30 mins):**  
     - Summary table with 3 sections.  
     - Explicit note: "Ranges reflect uncertainty; unscorable risks demand proactive management".  

  ---

  ### **Why This Works**
  - **Honest:** Tiers force you to declare uncertainty. "Unscorable" is a valid output.  
  - **Defensible:** "We used industry standard confidence-based tiers; here’s the rationale for each."  
  - **Action-focused:** Tier 3 risks get concrete tasks, not fake numbers.  
  - **Audit-proof:** Document tiers/rationale in a "Scoring Basis" column.  
  - **Board-friendly:** They get ranked priorities + clear "do this" for unknowns.  

  **Final tip:** Pre-brief your Finance Director on the tier system – frame it as "reducing false certainty". When the board asks "Is it a 3 or 4?", respond: **"For Tier 1 risks, it’s a single number. For Tier 2, it’s a range – and here’s why."** This method turns your struggle into rigour.
