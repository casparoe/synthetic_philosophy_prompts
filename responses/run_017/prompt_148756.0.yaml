  We are building a defense of Best-System Composition (BSC) as defined. We must argue for it on its own terms, handle four objections, and then apply it to four cases. The view: composition occurs iff the composed object is in the ontology of the best system (globally, whole history, strength-simplicity tradeoff).

  Structure:
  1. Positive argument for BSC (without framing as one of four, but as a natural extension of best-system thinking to composition).
  2. Objections 1-4 and replies.
  3. Four cases (a-d) with predictions and contrast to "ordinary cases".

  Word count: 1000-1400 words for the main part (excluding the case list at the end, which is separate and short). Then a closing bit of 250 words for the cases.

  Important: No hedging. Build the strongest version.

  Let's outline:

  I. The Core Argument for BSC
     - Start by noting that the special composition question is about when composition occurs. The answer must respect that composition is not arbitrary but also not given by fundamental physics alone.
     - BSC is motivated by the idea that what exists should be what a maximally informative and simple description of the world would quantify over. This is a natural extension of the best-system approach from laws (Lewis) to ontology.
     - The best system is global and over the whole history, so it is not anthropocentric. It is an objective feature of the world.
     - Argue that this provides a non-arbitrary, non-mysterious criterion that captures the idea that some composites are natural (like organisms, tables) and others are not (like arbitrary fusions). It avoids the extremes of universalism and nihilism without positing brute facts.

  II. Objection 1: Metaphysics vs. Bookkeeping
     - Objection: Best-system-hood is about our description, not about what exists. Existence is independent of our systematization.
     - Reply: The best system is not about our description per se, but about the objective structure of the world. The best system is the one that captures the objective patterns in the world. The patterns are real, and the objects that figure in these patterns are real because they are nodes in the causal structure that the system describes. We are not sliding from epistemic to ontic; we are saying that the ontic structure is what the best system quantifies over because that system is the one that latches onto reality. The simplicity-strength tradeoff is a way of capturing the objective notion of naturalness or joint-carving. Even without a fixed scoring rule, the idea is that the world has an objective structure that some systems capture better than others, and the best system is the one that gets the structure right without unnecessary complexity.

  III. Objection 2: Uniqueness
     - Objection: There might be ties or near-ties, leading to indeterminacy.
     - Reply: Yes, if there are ties, then there is indeterminacy. But note: the world might be such that one system is clearly best. If there is a tie, then it is indeterminate what exists. This is better than the vagueness of restricted composition because it is not a matter of semantic indecision but of objective features of the world. The usual argument from vagueness against restricted composition (that there are borderline cases) is a problem because it suggests that composition is vague, which is hard to reconcile with its being a fundamental matter. But for BSC, if there is a tie, then it is objectively indeterminate what composites exist. This is a kind of ontic indeterminacy that is already present in other applications of best-system accounts (e.g., laws). Moreover, the existence of ties is an objective fact about the world, not a flaw in our concepts.

  IV. Objection 3: Coincidence
     - Objection: The statue and the lump both seem to earn their keep. Does BSC yield two objects?
     - Reply: Yes, it does. But this is a feature. The statue and the lump are both real because they are both part of the best system. The statue is part of the system that describes art and function; the lump is part of the system that describes material continuity. They are two different objects that share the same matter at a time. This is not an embarrassment because the best system might quantify over both. The cost in simplicity of having both is outweighed by the strength gained in describing different aspects of the world. We avoid arbitrariness because both are objectively part of the patterns in the world. However, note that the best system might be such that it only quantifies over one. But if both are needed for the best systematization, then both exist. The choice is not arbitrary because it is determined by the global best system.

  V. Objection 4: Holism
     - Objection: Whether these atoms compose a table depends on distant galaxies and the future.
     - Reply: Bite the bullet. It is a consequence of the global nature of the best system. But note: the dependence is very weak in practice. The best system is determined by the total pattern of events in the universe. It is unlikely that a distant event would affect whether a table exists now, but it is possible. For example, if the future contains events that are best described by quantifying over the table (e.g., its use, destruction), then the table exists now. Similarly, if the distant galaxy contains evidence that affects the simplicity-strength tradeoff (e.g., by making a certain kind of pattern more prevalent), it might matter. But in practice, the local patterns are so strong that they dominate. However, the holism is acceptable because it reflects the interconnectedness of the world. The existence of a table is not an isolated fact but part of the global structure.

  VI. The Four Cases (250 words)
     - (a) Table with parts replaced: This is a classic case of a gradually replaced object. BSC will likely say that the table exists because it is a functional unit that persists through time and earns its keep in the best system (e.g., by being the subject of laws of furniture degradation, etc.). The fact that parts are replaced does not matter as long as the system that quantifies over the table is still best. Contrast with "ordinary cases": the ordinary view might say it is a table, but BSC doesn't rely on ordinary intuition; it relies on the best system. However, if the replacement is so drastic that the table's functional role is lost, then it might not exist. But in the case described, it does.

     - (b) Hurricane: A hurricane is a paradigm case of a composite that is not a substance but a process. BSC will include it because it is a node in meteorological patterns. The best system for weather will quantify over hurricanes. Contrast: the ordinary view might include it too, but BSC includes it for systematic reasons, not because it is ordinary.

     - (c) Cloud-shaped swarm (problem of the many): The cloud is a swarm of water droplets with fuzzy boundaries. BSC will say there is one cloud because the best system quantifies over clouds as entities, even though there are many overlapping swarms. The best system gains strength by having cloud-predicates (for weather prediction) without needing to specify exact boundaries (so it's simple). So there is one cloud. But note: the problem of the many is about how many clouds there are given the fuzziness. BSC avoids the problem because it doesn't require sharp boundaries. The best system may have vague terms, but that's acceptable because it is still strong and simple. Contrast: the ordinary view might say there is one cloud, but it struggles with the many overlapping objects. BSC says there is one because the system that quantifies over the cloud as a whole is best.

     - (d) Fusion of every human alive: This is an arbitrary fusion. It does not figure in any patterns that earn its keep. The best system does not quantify over it because doing so would not add strength (it doesn't behave as a unit) but would cost simplicity. So it does not exist. Contrast: the ordinary view would deny it, but for different reasons (it's not a natural object). BSC denies it because it doesn't help systematization.

  Now, write the prose accordingly.
answer: |-
  ### In Defense of Best-System Composition

  The special composition question—when do some things compose a further thing?—demands an answer that avoids arbitrariness while respecting the world’s objective structure. Best-System Composition (BSC) provides such an answer: composition occurs iff the composed object belongs to the ontology of the best system for describing the entire history of the world, where "best" is determined by the optimal balance of strength and simplicity in systematizing all events. Strength refers to the system’s informativeness (how much it captures), simplicity to its parsimony (avoiding unnecessary complexity), and the tradeoff is evaluated globally, independent of human interests. This view emerges naturally from the insight that reality is patterned, and objects are not brute atoms but nodes in a causal-nomological network. If we accept that laws of nature are defined by the best system (as in Lewisian Humeanism), extending this to ontology is a minimal step: objects are the relata in the laws. What exists must be what the most efficient blueprint of reality requires to explain its patterns. BSC thus grounds composition in objective features of the world—its total constellation of events—while avoiding the extremes of universalism (always composing) and nihilism (never composing). Universalism bloats ontology with useless fusions, nihilism discards objects that demonstrably participate in causal regularities. BSC captures a middle path: composites exist only when their inclusion improves our grip on the world’s structure.

  **Objection 1: Metaphysics vs. Bookkeeping**  
  Critics may argue that best-system-hood is merely epistemic—a virtue of how we describe reality—not ontic. If existence depends on systematization, haven’t we conflated description with reality? This misconstrues BSC’s foundations. The best system is not a human construct but an objective feature of the world. Reality contains patterns—recurring structures and dependencies—and the best system is the one that *latches onto* these patterns with maximal efficiency. Strength and simplicity are not subjective ideals; they are objective measures of how well a system mirrors the world’s actual organization. Consider simplicity: it isn’t about ease of human use but about minimizing ad hoc postulates. A system is simpler if it invokes fewer fundamental categories without sacrificing explanatory power. Strength reflects the density of real patterns captured. When a system quantifies over an object, it does so because that object is a locus of causal unity—a point where multiple regularities converge. For example, quantifying over a tiger allows the system to efficiently predict predation, reproduction, and decay; omitting it would force a disjunctive, weaker description. Thus, BSC doesn’t slide from epistemology to ontology; it asserts that ontology *is* pattern-structure. Objects exist because they are knots in the causal web, and the best system identifies these knots by optimizing for real-world structure. No scoring rule is presupposed here; the tradeoff is defined by the patterns themselves. If the world is law-governed, the system that best systematizes it carves at the joints.

  **Objection 2: Uniqueness**  
  What if multiple systems tie for "best," leading to rival ontologies? Would BSC imply indeterminacy in composition? Yes—and this is a virtue, not a flaw. Ties reflect objective symmetries in the world’s structure. Suppose two systems, S1 and S2, both achieve optimal strength-simplicity but differ on whether certain borderline aggregates (e.g., a loose pile of rocks) compose a cairn. S1 includes cairns, gaining strength in geology but losing simplicity; S2 excludes them, with the reverse tradeoff. If they score equally, it’s indeterminate whether cairns exist. This indeterminacy is ontic, not semantic: the world itself doesn’t decide between the patterns. Contrast this with vagueness in restricted composition views (e.g., van Inwagen’s "only when there’s life"), where borderline cases arise from linguistic imprecision. That view faces the argument from vagueness: if composition can be vague, but existence is all-or-nothing, we must either accept arbitrary thresholds or deny vagueness altogether. BSC avoids this by grounding indeterminacy in the world’s structure. Ties are rare in practice—the global optimum is typically unique—but when they occur, they reveal genuine metaphysical symmetry. This is no stranger than indeterminacy in quantum mechanics or best-system laws: reality isn’t obliged to be maximally precise where patterns underdetermine.

  **Objection 3: Coincidence**  
  Statues and lumps of clay seem to both "earn their keep" in discourse: art theory references statues, material science references lumps. Does BSC commit to two coincident objects? Yes—and this is defensible. The statue and the lump are distinct because they participate in different patterns. The statue figures in aesthetic and functional regularities (e.g., "statues are preserved in museums"); the lump in physical ones (e.g., "clay hardens at 200°C"). Including both in the ontology adds strength: omitting the statue would weaken explanations in art history, omitting the lump would weaken materials science. The cost in simplicity is justified because no single category subsumes both sets of patterns without loss. Critics call coincident objects embarrassing, but the embarrassment assumes a sparse ontology where objects must be separable by properties. BSC rejects this: objects are defined by their roles in systematization. Coincidence is unproblematic if both objects are real nodes in the causal net. The choice isn’t arbitrary because the global best system determines which patterns are significant. In most cases, the system will include both; if forced to choose (e.g., if simplicity costs dominate), it would exclude the less explanatory one. But that’s a feature: BSC explains why we sometimes have coincident objects (when both earn strength) and sometimes not (when one doesn’t).

  **Objection 4: Holism**  
  Because bestness is global, whether atoms compose a table now might depend on distant galaxies or future events. Isn’t this absurd? BSC bites the bullet: holism is inevitable and benign. The best system’s score depends on the entire history of the universe. If a distant supernova creates radiation that, in a billion years, influences Earth’s climate and thus the decay of tables, it could affect whether table-inclusion optimizes strength-simplicity globally. This seems alarming, but only if we assume locality—the idea that composition is settled by local facts. BSC denies this. Objects are not isolated; they exist within a cosmic tapestry of events. Just as the best-system laws for physics depend on total history (e.g., the cosmological constant), so does ontology. In practice, local patterns dominate: the regularity of tables being used, moved, and destroyed is so robust that distant events won’t override it. But holism is theoretically virtuous. It ensures BSC is unified and non-arbitrary: composition isn’t magically sensitive to parochial concerns but reflects the world’s objective structure. Rejecting holism would require an implausible "now-ist" ontology or brute constraints.

  ### BSC in Practice: Four Test Cases

  BSC’s predictions diverge from "ordinary cases" views, which rely on intuitive judgments about what "counts" as composite. For BSC, the ordinary is derivative; existence hinges on global systematization. Below, I flag key contrasts.  

  (a) *A table with parts replaced one per day over a year*: BSC affirms composition. The table is a functional unity: it figures in regularities about use, stability, and wear that simplify explanations in design or daily life. The gradual part-replacement doesn’t disrupt this, as the system gains strength by treating it as a persistent object (e.g., "tables support weight continuously"). Contrast ordinary views: they might accept this due to intuition, but BSC grounds it in pattern-capture. If replacement were chaotic, erasing functional unity, BSC might deny composition—a flexibility ordinary views lack.  

  (b) *A hurricane*: BSC affirms composition. Hurricanes are nodes in meteorological patterns, allowing efficient prediction of paths, intensities, and impacts. Quantifying over them adds significant strength (e.g., for weather models) with minimal simplicity costs. Ordinary views often include hurricanes, but BSC explains why: they are real patterns, not just "convenient fictions."  

  (c) *A cloud-shaped swarm with fuzzy boundaries*: BSC affirms exactly one cloud. The swarm’s fuzziness doesn’t preclude inclusion; the best system quantifies over clouds as vague objects because doing so systematizes weather phenomena (e.g., "clouds produce rain") without needing precise boundaries. This avoids the "problem of the many" (which posits countless overlapping swarms) by denying that every micro-swarm is a cloud—only the pattern-mattering entity exists. Ordinary views might agree on one cloud but appeal to vague concepts; BSC shows vagueness arises from pattern-boundaries in the best system.  

  (d) *The fusion of every human alive now*: BSC denies composition. This fusion participates in no unified regularities; quantifying over it adds no strength (e.g., it doesn’t move or act as one) while bloating ontology. Ordinary views reject it as "unnatural," but BSC provides a criterion: it fails the strength-simplicity tradeoff.  

  BSC’s verdicts align with intuition in these cases but for deeper reasons. Where they diverge—as in holism or coincidence—BSC reveals intuition’s limitations. The view isn’t dead on arrival; it offers a coherent, non-arbitrary account of composition. Its costs (e.g., holism) are offset by unifying existence with laws. If the world is patterned, BSC carves where the patterns are.
