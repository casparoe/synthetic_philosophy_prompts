  ### Your Attempts to Dodge the Cycle
  **Attempt 1: Decisiveness only over pairs differing in own key.**  
  - This *doesn’t* kill the cycle. In Sen’s example, `(a, b)` differs only in Prude’s key, and `(c, b)` differs only in Lewd’s key. Your condition is already satisfied, yet the cycle persists.  
  - **Why?** The overlap on state `b` enables Pareto to link the decisions (`b` is the pivot). Isolating keys isn’t enough when nodes care about global state.

  **Attempt 2: Disjoint private spheres (states in decisive pairs don’t overlap).**  
  - Your 9-state construction **fails** to escape the cycle. Here’s the explicit version:  
    - States: All combinations of `Prude_act ∈ {P1, P2, P3}`, `Lewd_act ∈ {L1, L2, L3}` → 9 states.  
    - Assign Prude decisive pair `(P1L1, P2L1)` (differs only in `Prude_act`).  
    - Assign Lewd decisive pair `(P1L2, P1L3)` (differs only in `Lewd_act`; disjoint states from Prude’s pair).  
    - Preferences:  
      - Prude: `P1L3 > P1L1 > P2L1 > ... > P1L2` (ranks Lewd’s sphere low)  
      - Lewd: `P2L1 > P1L2 > P1L3 > ... > P1L1` (ranks Prude’s sphere low)  
    - Force cycle:  
      - Prude prefers `P1L1 > P2L1` → merge sets `P1L1 > P2L1`.  
      - Lewd prefers `P1L3 > P1L2` → merge sets `P1L3 > P1L2`.  
      - Pareto: Both prefer `P2L1 > P1L2` and `P1L3 > P1L1`?  
        - If so: `P1L1 > P2L1 > P1L2 > P1L3 > P1L1` → **cycle**.  
  - **Why it fails**: Disjoint states don’t prevent Pareto from connecting spheres. Unrestricted domain allows preferences that "chain" spheres (e.g., both prefer `P2L1 > P1L2`).

  **Condition to Block the Cycle**:  
  - **Gibbard’s Game Form (1974)**: Rights as control over *actions*, not states. In your terms:  
    - Nodes write their own keys; merge policy resolves conflicts (e.g., if both write `read`, default to `neither_reads`).  
    - Preferences influence writes, but rights are about *what you can write*, not *social ordering*.  
    - This avoids the cycle because decisiveness is over *writes*, not state pairs.  
  - **Alternative**: Require **non-meddlesome preferences** (nodes only rank states differing in their key). This breaks Sen’s cycle (Prude wouldn’t rank `c` vs `b`).

