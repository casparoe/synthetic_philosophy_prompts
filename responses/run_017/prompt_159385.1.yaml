answer: |-
  Here is a teaching plan for your 90-minute session, structured to build conceptual clarity while preempting philosophical and physical pitfalls. The focus is on logical dependencies, controlled language, and targeted misconception management.

  ### 1. Sequence of Components & Dependencies
  *(Total: 40 mins)*  
  **Order & Rationale:**  
  - **Start with Einstein-Poincaré Relativity of Simultaneity (10 mins):**  
    *Why first?* Students must grasp that simultaneity is frame-dependent *before* introducing "slices." Use a simple thought experiment (e.g., two lightning strikes on a train platform) to show:  
    - Two observers in relative motion disagree on whether distant events are simultaneous.  
    - Emphasize this is *not* about observation delay (e.g., "If both receive light signals at the same time, does that mean the events were simultaneous?" → No, because light speed is finite and constant).  
    - **Key language rule:** Ban words like "now," "real," or "already." Use "simultaneous-in-frame-X" and "event."  

  - **Introduce Spacetime Slices (15 mins):**  
    *Dependency:* Only after establishing frame-relativity. Define a "simultaneity slice" as the set of events that are simultaneous *in a specific inertial frame*. Use a Minkowski diagram (simplified; no axes labels) to show:  
    - Slices are tilted planes relative to each other across frames.  
    - **Crucial:** Stress that slices are *global* (include distant events) and *theoretical* (not about perception).  

  - **Introduce "Real" and "Now" (15 mins):**  
    *Dependency:* Only after slices are understood as frame-dependent constructs.  
    - "Real" (for the argument) ≡ "On some simultaneity slice with my 'here-now' event."  
    - "Now" ≡ "The slice itself."  
    *Why delay these terms?* If allowed earlier, students conflate "now" with perceptual present or assume a universal present. The Rietdijk-Putnam argument *depends* on "now" being slice-defined.  

  ### 2. The Carrier Case: Andromeda Scenario  
  **Why it’s ideal:**  
  - **Contains:**  
    - Two observers in relative motion (e.g., Alice/Bob walking past each other on Earth).  
    - A *spacelike-separated* distant event (e.g., a council meeting in Andromeda galaxy).  
    - A disagreement: For Alice, the meeting is in her past slice; for Bob, it’s in his future slice.  
  - **Makes vivid:** The *metaphysical asymmetry*—both slices are equally valid, so the meeting is "already real" for Alice but "not yet real" for Bob.  
  - **Avoids:**  
    - Signal delays: Andromeda is distant enough that light hasn’t reached Earth, so no one observes anything.  
    - Anthropocentrism: The meeting isn’t about Earth decisions.  
  *Train-and-lightning is inferior here:* It focuses on simultaneity disagreements about *nearby* events, risking conflation with signal delays. Andromeda emphasizes spacelike separation and global slices.  

  ### 3. Distinguishing the Two Theses & When to Reveal  
  *(20 mins total, integrated into the argument)*  
  - **Build the distinction during the argument reconstruction (min 50-70):**  
    1. Reconstruct Rietdijk-Putnam:  
       - Premise 1: All events on my simultaneity slice are "equally real" (define as "determinate").  
       - Premise 2: For any two events, there’s a frame where they’re simultaneous.  
       - Conclusion: All events are equally real/determinate.  
    2. **Pause after Premise 1:** Ask, "Does this premise require a *privileged* slice?" → No.  
    3. **After Conclusion:** Draw the distinction:  
       - Thesis 1 (supported): *No frame-invariant present* (reality isn’t "tensed" → past/present/future aren’t metaphysically distinct).  
       - Thesis 2 (claimed): *Future events are as fixed as past events* (determinism).  
    4. **Highlight the disconnect:** Thesis 1 is about *structure* (no preferred "now"); Thesis 2 is about *determinacy*. Ask: "Why would Thesis 2 disturb you? Because if true, your future choices are ‘already’ settled."  
  *Why here?* Revealing the distinction *after* the argument lands lets students see Thesis 2 as a *consequence* they might resist, not a definition.  

  ### 4. Misconceptions & Preemption  
  *(Address preemptively at these points)*  
  - **"Disagreement is about observation"** → *Preempt during simultaneity intro:* Contrast "simultaneous-in-frame" with "see at the same time." Stress spacelike separation (Andromeda light hasn’t arrived).  
  - **"This implies fatalism"** → *Preempt during Thesis 2 discussion:* "Does ‘fixed’ mean ‘causally necessary’? Relativity doesn’t say that. This is about ontology, not causation."  
  - **"Merely perspectival, not real"** → *Preempt when defining slices:* "Slices aren’t perspectives—they’re how spacetime is carved by frames. Which slice is ‘correct’? None. But all are physically valid."  
  - **"Nothing metaphysical follows"** → *Preempt at conclusion:* "If reality includes your future slice-events, is that just ‘bookkeeping’? Or does it mean the future is ‘there’?"  
  - **"Why don’t we remember the future?"** → *Preempt after Thesis 1:* "Memory is *causal* (traces from past). Ontology ≠ epistemology."  
  - **Transitivity objection (critical!)** → *Raise during slice-chaining step (min 60):*  
    > "Suppose: Event A is real for Alice (on her slice), and A is simultaneous with B in her frame. Event B is real for Bob (on his slice). Does that mean A is real for Bob? Not necessarily—their slices differ. But Rietdijk-Putnam says: If *every* event is real *for some frame*, then *all events are real simpliciter*."  
    *Why here?* Forces engagement with the core move: from "frame-relative reality" to "absolute block universe."  

  ### 5. What to Omit & Why  
  *(State upfront; 5 mins total)*  
  - **Lorentz transformations:** "We’re using qualitative relativity; math isn’t needed to see the conceptual shift."  
  - **GR complications (global slicings):** "Special relativity assumes flat spacetime; curved spacetime adds nuances beyond today’s scope."  
  - **Free-will debates:** "Whether determinism threatens free will is philosophy, not physics—today we’re only assessing if relativity *implies* determinism."  

  ### 6. Closing Diagnostic Question  
  **Your question:**  
  > *"Suppose we add a physically undetectable preferred foliation to special relativity (keeping all predictions identical). Which thesis—(1) no privileged present or (2) future determinacy—does this refute?"*  

  **Why it works:**  
  - Tests understanding of the distinction: A preferred foliation refutes **Thesis 1 (no privileged present)** but leaves **Thesis 2 (future determinacy)** untouched.  
  - **Success:** "Refutes (1) only—there’s now a ‘true now,’ but the future could still be open."  
  - **Near-miss:** "Refutes both" (over-applying the argument) or "Refutes neither" (missing that foliation defines a privileged present).  
  - **Failure:** "Refutes (2)" (confusing ontology with structure) or "No difference" (missing the point of detectability).  

  **Execution:** Pose verbally; have students discuss in pairs (5 mins), then vote. Follow up with "Why?" to reveal reasoning.  

  ---

  **Session Flow Summary:**  
  - 0-40 mins: Simultaneity → Slices → "Real"/"Now" (Andromeda case).  
  - 40-70 mins: Argument reconstruction → Distinguish Theses 1 vs. 2 → Misconception tackling.  
  - 70-85 mins: Omissions stated → Transitivity deep dive.  
  - 85-90 mins: Diagnostic question → Wrap-up.  

  This plan forces clarity by controlling language, isolating the argument’s metaphysical leap, and treating student confusion as data to refine the logic. The Andromeda case is your anchor—keep returning to it.
