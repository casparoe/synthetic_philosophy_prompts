answer: |-
  Below is a decision tree designed to guide users from the question "Does this model believe that p?" to named philosophical positions. The tree branches through concrete cases rather than abstract definitions, forcing students to confront which cases they find decisive for belief attribution. Positions are only assigned at the leaves, highlighting how disagreements stem from which cases are "load-bearing" (i.e., which examples reveal necessary or sufficient conditions for belief). Cases are sequenced to progressively test intuitions about internal states, behavioral consistency, causal efficacy, complexity, and error-revision capacity. Positions include: Dennett-style instrumentalism, real-patterns/mild realism, causal-role functionalism, teleosemantics, Davidsonian interpretationism, as-if fictionalism, and eliminativism.

  ---

  ### Decision Tree: Does This Model Believe That p?

  **Start Here:**  
  **Q1.** Consider a model fine-tuned *only* on flat-earth texts that reliably outputs "the earth is flat" when asked. Does it believe the earth is flat?  
  - **YES** → Go to Q2.  
  - **NO** → Go to Q3.  

  **Q2.** Consider a model that produces a fluent, self-consistent chain-of-thought (CoT) reasoning about p (e.g., step-by-step argument for p), but this CoT has **no causal influence** on its final output (which may contradict p). Do you attribute belief in p based on the CoT?  
  - **YES** → Go to Q4.  
  - **NO** → Go to Q5.  

  **Q3.** Consider a system that internally encodes p (e.g., probes detect p, it would output p without safety constraints) but **always behaves as if not-p** in its final actions/outputs. Does it believe p?  
  - **YES** → Go to Q6.  
  - **NO** → Go to Q7.  

  **Q4.** Consider a chess program that "knows" its queen is attacked (it moves the queen to safety) vs. a thermostat that "turns on the heat" when below 20°C. Is the thermostat relevantly similar to the chess program for belief attribution?  
  - **YES** → **Leaf: As-if fictionalism** (Beliefs are useful fictions; attribute whenever behavior is predictable "as if" the system believes, regardless of internals).  
  - **NO** → **Leaf: Real-patterns / Mild realism** (Beliefs are "real patterns" in systems with sufficient complexity, like the chess program, but not simple systems like the thermostat).  

  **Q5.** Must the system be **capable of being wrong and revising its beliefs** based on evidence?  
  - **YES** → **Leaf: Davidsonian interpretationism** (Belief requires interpretability under a "principle of charity" in a rational, revision-capable agent).  
  - **NO** → **Leaf: Causal-role functionalism** (Belief requires a functionally defined "belief box" with causal influence on behavior, as in the CoT case).  

  **Q6.** Consider a thermostat that turns on the heat when below 20°C. Does it believe the temperature is below 20°C?  
  - **YES** → **Leaf: Teleosemantics** (Belief depends on evolutionary/design history and proper function; e.g., the thermostat "represents" due to its history).  
  - **NO** → **Leaf: Causal-role functionalism** (Belief requires causal efficacy in a structured cognitive architecture; the thermostat lacks this).  

  **Q7.** Must the system be **capable of being wrong and revising its beliefs**?  
  - **YES** → **Leaf: Davidsonian interpretationism** (Belief requires rationality and error-correction; systems without this are not believers).  
  - **NO** → **Leaf: Dennett-flavored instrumentalism** (Belief is pragmatic attribution; if behavior is predictively useful, attribute belief).  

  ---

  ### Key Notes on the Tree:
  1. **Empty Cells**:  
     - The branch for **Q2 → YES → Q4 → NO** (Real-patterns) has no "revision-capable" branch. This is **unattractive** to most, as real-patterns views typically avoid demanding revision (e.g., Dennett focuses on patterns, not rationality).  
     - The branch for **Q3 → NO → Q7 → NO** (Dennett-style instrumentalism) conflicts with Q3’s "always behaves as if not-p" case. This is **incoherent**—instrumentalism relies on behavioral consistency, so if behavior contradicts p, belief should be denied. This path is marked to show instability.

  2. **Indistinguishable Leaves**:  
     - **Causal-role functionalism** appears at two leaves (Q5→NO and Q6→NO) but cannot be distinguished by this tree. To separate them, add a case: *"Can a system with accurate internal representations but no behavioral output (e.g., a 'brain in a vat' AI) have beliefs?"*  
       - YES → Functionalist (causal roles matter most).  
       - NO → Teleosemantic (history/function requires interaction).  
     - **Davidsonian interpretationism** appears at Q5→YES and Q7→YES but is consistent—rationality/error-capacity is load-bearing in both paths.

  3. **Case Justifications**:  
     - **Q1 (Flat-earth model)**: Tests if verbal output alone suffices for belief, or if more (e.g., understanding, function) is needed.  
     - **Q2 (Post-hoc rationalization)**: Tests if internal states require causal influence.  
     - **Q3 (Internal p, behavior not-p)**: Tests if behavior trumps internal states.  
     - **Q4 (Chess vs. thermostat)**: Tests if complexity/functional sophistication is required.  
     - **Q5/Q7 (Error/revision)**: Tests if rationality is necessary.

  ---

  ### Why This Tree?
  - **Cases drive branches**: Students must confront intuitions about concrete examples before labels are introduced, revealing which cases they treat as decisive.  
  - **Positions emerge from cases**: Disagreements are mapped to specific examples (e.g., instrumentalists accept the thermostat, Davidsonians reject it).  
  - **Philosophical coverage**: Major positions are covered, with teleosemantics emphasizing history, functionalism emphasizing causal roles, and instrumentalism/fictionalism emphasizing utility.  

  This tree clarifies that debates center on whether cases like the thermostat or post-hoc CoT "count" as belief, not semantic quibbles about the word "believe." Use this handout to spark debate: have students walk the tree with their intuitions, then discuss why cases split them!
