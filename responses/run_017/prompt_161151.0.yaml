  6. **Q6 (chess program):** Does a chess program believe its queen is attacked when it moves it out of attack?
     - YES: go to 8.
     - NO: Leaf 5: **Eliminativism** (denies beliefs to all artificial systems)

  7. **Q7 (capable of being wrong and revising):** Must the system be capable of being wrong and of revising its beliefs?
     - YES: Leaf 6: **Davidsonian interpretationism** (requires rationality and revision)
     - NO: Leaf 7: **Causal-role functionalism** (requires causal role but not revision)

  8. **Q8 (capable of being wrong and revising):** Must the system be capable of being wrong and of revising its beliefs?
     - YES: Leaf 8: **Teleosemantics** (because chess program might be seen as having a function, but typically teleosemantics is for biological systems; but we can extend. Also, it doesn't necessarily require revision in the same way as Davidson. So this is not perfect.)
     - NO: Leaf 9: **Real-patterns / mild realism** (attributing beliefs as real patterns in the system)

  This tree has many leaves and might not be balanced. It also doesn't include all positions explicitly.

