prompt: |-
  I'm drafting a short position statement on material objects for a graduate workshop, and before I put it in print I'd like an audit of the commitments I've assembled. I don't know where the strain in the set is, so please don't treat any one of them as more negotiable than the others: take them all as things I currently believe, and tell me whether the package survives.

  1. The unrestricted answer to the special composition question is false. My reasons are the familiar pair: I won't grant that there is an object composed of the tip of my nose and the top of the Eiffel Tower, and I take the problem of the many to count heavily against any view on which every near-candidate for being the table in this room is a real object. So: not universalism.

  2. The never answer is false too. I want there to be tables, and not merely as a concession to ordinary talk — I don't think the paraphrase strategies that would let me say everything I want to say while denying that tables exist actually work.

  3. So I want a restricted answer, and this is the one I've been defending: some things compose an object just in case their activity jointly constitutes a life, or they are integrated into a single function that some actual community of users confers on them. The first clause is meant to get me organisms; the second is meant to get me artifacts, which is where I most expect trouble.

  4. Methodologically I want more than an extensionally correct generalization. I want the condition to be general, necessary, and stated in non-gerrymandered terms: a condition whose application turns on what some particular person happens to intend, want, or be attending to is not an answer to the question, it's a change of subject. And I don't want to fall back on a brute primitive. Treating it as an unexplained bedrock fact which pluralities compose strikes me as a research-stopper, and I'd rather revise almost anything else on this list than help myself to it.

  5. I also hold that composition and existence are sharp. There are no vague objects; for any plurality it is determinate whether they compose something; and I don't want to solve the problem of the many by stipulating that one privileged candidate among the many near-candidates in the room is the table and that the others aren't.

  6. I deny coincidence: I don't think there can be two material things made of exactly the same matter in exactly the same place at the same time. So the statue and the piece of clay it is made of are one and the same thing, if both are to be counted at all. But I also want to keep the ordinary pair of judgments that the clay would survive being rolled into a ball and that the statue would not.

  7. On scattered objects: I deny that my nose and the moon compose anything, but I'm happy to say that there is a single object composed of my two shoes while they are in different cities, or of the two pieces of a bikini, or of a star and its planets.

  What I want from you is an audit, not a survey of the literature. Go through the set pairwise and tell me which pairs are genuinely in tension and which only look like it — I'd rather you discriminate than flag everything. Order the genuine tensions by severity instead of listing them as equally bad. For each one, say exactly what I would have to give up or add in order to remove it, and what that would cost me elsewhere in the set; then tell me which single revision would clean up the most. Two further things I'd like flagged: any commitment I haven't stated but that the position requires, and any case my two-clause criterion obviously mishandles. I'm worried in particular about a watch taken apart and left in a drawer, and about whether there was ever really a table here at all given how vague its boundary seems to be.
reasoning: |-
  Okay, let me approach this systematically. The user has presented a sophisticated metaphysical position with seven commitments and requests a rigorous audit focusing on tensions within the set. They explicitly want pairwise analysis of conflicts, severity ranking, and identification of unstated commitments or problematic cases - not a literature survey.

  First, I need to carefully map the core tensions. The sharpness requirement (5) seems most vulnerable as it directly opposes how both biological and artifact-based composition actually function. For organisms, problem of the many shows boundaries are intrinsically vague; for artifacts, community intentions are inherently variable. This clashes with their rejection of vague objects and privileged candidates.

  The artifact criterion (3) appears problematic under scrutiny. While "community-conferred function" avoids individual subjectivity, actual communities have divergent views and changing norms. A watch disassembled in a drawer becomes ambiguous - does the latent intention of potential users sustain its existence? This connects to their expressed worry about the disassembled watch case.

  The coincidence denial (6) generates classic puzzles. If statue and clay are identical, how can they have different persistence conditions? The user wants to preserve ordinary judgments but rejects temporal parts, creating pressure to either accept coincidence or abandon modal differences - both costly moves.

  Scattered objects (7) seem arbitrarily treated: why accept bikinis but reject nose-moon composites? Their criterion might permit both or neither, depending on interpretation of "integrated function." This exposes a boundary issue in the artifact clause.

  Unstated commitments emerge too: their view requires a theory of "life" for organisms and a social ontology for artifacts. Both demand elaboration to avoid primitivism, which they explicitly reject (4). The disassembled watch case may force them to choose between temporary nonexistence (counterintuitive) or stretching "latent function" dangerously close to subjectivism.

  For repair strategies, relaxing sharpness would resolve multiple conflicts but sacrifice theoretical tidiness. Alternatively, accepting restricted coincidence for artifacts could preserve modal differences but violate their core denial. The single most effective fix appears to be allowing vague composition for non-artifacts while keeping artifacts sharp - though this introduces new complexities about hybrid objects.

  The user's methodological rigor (4) is admirable but may be incompatible with the messy reality of their proposed criteria. Ultimately, their position survives only if they tolerate some softening - likely around vagueness - or introduce sophisticated machinery for community intentionality.
answer: |-
  Here's a systematic audit of the tensions within your stated commitments, ordered by severity. The core conflict arises from demanding sharp boundaries for inherently vague phenomena while rejecting brute facts and subjectivism. Genuine tensions are marked with ⚠️, apparent tensions are noted briefly.

  ### ⚠️**Severe Tension: Sharp Boundaries vs. Vague Phenomena (Commitments 3, 5, 6)**
  - **Conflict:** Your criterion for composition (life/function) is intrinsically vague. Biological boundaries (e.g., cellular turnover) and functional assignments (e.g., when is a pile "a table"?) admit borderline cases. Yet (5) demands sharp existence and (6) denies coincidence, forcing a precise cutoff where none exists naturally.
  - **Consequence:** You *must* accept either:
    - **(A) Vague composition/existence** (contradicting 5), or
    - **(B) A precise, non-arbitrary threshold** for life/function (which doesn't exist without brute stipulation, contradicting 4).
  - **Costs:**  
    - Accepting (A) forces abandonment of sharp composition (5) and likely requires vague identity (undermining 6).  
    - Accepting (B) violates your rejection of brute primitives (4) or gerrymandering (e.g., "exactly 10,000 users confer function").
  - **Problem Cases:** Your worries about the table's vague boundary and the disassembled watch directly exploit this. If the watch's parts are in a drawer, is the function *latent* (implying vague persistence) or *extinct* (implying sharp cessation)? Both answers strain sharpness.

  ### ⚠️**Severe Tension: Artifact Function vs. Non-Subjectivity (Commitments 3, 4)**
  - **Conflict:** "Community-conferred function" risks subjectivism. Communities disagree, change norms, or cease to exist. You forbid reliance on "what some particular person intends" (4), but "community" is aggregate intention. Avoiding gerrymandering requires a principled, non-circular account of *which* communities count and *when* they confer function.
  - **Consequence:** You risk either:
    - **(A) Collapsing into subjectivism** (if community intentions define existence), violating 4, or  
    - **(B) Needing a brute fact** about which collective intentions are metaphysically potent (violating 4).
  - **Cost:** Solving this requires a robust social ontology (e.g., institutional facts à la Searle) as an unstated commitment. Even then, vagueness (above) persists.

  ### ⚠️**Moderate Tension: Scattered Objects vs. Universalism Avoidance (Commitments 3, 7)**
  - **Conflict:** Your criterion permits scattered artifacts (bikinis, separated shoes) but rejects arbitrary pairs (nose+Eiffel Tower). However, "integrated function" is flexible. Could a performance artist "confer function" on nose+Eiffel Tower as a single artwork? If not, why not? This risks *ad hoc* restrictions to avoid universalism.
  - **Consequence:** Without a principled limit on *which functions* count, your view may permit too many objects (undermining 1). Yet restricting functions arbitrarily violates 4.
  - **Cost:** You need a non-gerrymandered theory of "genuine" function (e.g., evolutionary, design-based) which excludes arbitrary conferrals. This is difficult without appealing to intention-dependence.

  ### ⚠️**Moderate Tension: Coincidence Denial vs. Modal Differences (Commitment 6)**
  - **Conflict:** Denying coincidence (statue=clay) while affirming different persistence conditions (clay survives reshaping, statue doesn’t) violates Leibniz's Law. If they are identical, they must share *all* properties, including modal ones.
  - **Consequence:** You must either:
    - **(A) Abandon the modal differences** (costing intuitive appeal),  
    - **(B) Accept temporal parts** (making "the statue" a temporal stage, not identical to the clay's whole history), or  
    - **(C) Accept coincidence** (denying 6).
  - **Cost:** (A) is counterintuitive; (B) requires 4D ontology (unstated); (C) contradicts your core claim.

  ### ⚠️**Mild Tension: Artifact Persistence vs. Sharp Boundaries (Commitments 3, 5, 6)**
  - **Conflict:** The disassembled watch tests whether functional integration persists. If the watch *ceases to exist* when disassembled, reassembly creates a *new* watch. But is this sharp cessation plausible? If it *vaguely* persists, sharpness (5) is violated. If it persists *fully*, functional integration seems detached from physical arrangement (straining 3).
  - **Cost:** No solution preserves all commitments. Sharp cessation feels artificial; vague persistence contradicts 5; eternal persistence contradicts intuition.

  ---

  ### Apparent Tensions (Resolvable)
  - **Never/Universalism Denial vs. Restricted Answer (1, 2, 3):** No tension. Rejecting extremes while seeking middle ground is coherent.  
  - **Methodology vs. Brute Primitives (4 vs. others):** Your criterion *aims* to avoid bruteness. Tension arises only if it fails (as in severe tensions above).  
  - **Organisms vs. Artifacts (3):** Dual clauses aren’t inherently problematic if both are well-defined.

  ---

  ### Unstated Commitments Required
  1. **A Theory of Life:** Your first clause needs a non-arbitrary, non-vague account of "constituting a life" (e.g., against viruses or biofilms).  
  2. **A Social Ontology:** The artifact clause requires a metaphysics of collective intentionality and function-conferral that avoids subjectivism.  
  3. **Compositional Nihilism for Non-Organics/Artifacts:** Atoms composing a rock don’t satisfy your criterion. You need to either deny rocks exist (contra 2) or add a third clause (straining 3’s generality).

  ---

  ### Problem Cases Highlighted
  1. **Disassembled Watch:** As above. Does it exist in the drawer? If "no," reassembly is recreation (counterintuitive). If "yes," functional integration is latent (vague?).  
  2. **Vague Table Boundaries (Problem of the Many):** Your sharpness (5) forbids vague objects. But which precise set of particles composes *the table*? Any choice seems arbitrary, violating your rejection of "privileged candidates." Life/function won’t resolve this—both admit borderline part-candidates (e.g., a dust molecule partly bonded to the surface).  
  3. **Repurposed Artifacts:** A driftwood branch used as a tool, then abandoned. Does it cease to be an artifact when discarded? When the last user dies? Vagueness/sharpness issues recur.  
  4. **Non-Biological Natural Objects:** Glaciers, planets, stars. They lack "life" or "conferred function." You deny they exist as objects? (Contra common sense and 2). Or add a clause (e.g., "gravitational unity")—but why is *that* non-arbitrary?

  ---

  ### Single Most Effective Revision
  **Relax Commitment 5 (Sharp Boundaries):** Allow vague composition/existence for artifacts and organisms. This resolves:
  - Vagueness problems (Severe Tension 1)
  - Watch/table boundary cases
  - Eases pressure on functional persistence (Mild Tension)
  - *Costs:* Requires embracing ontological vagueness (contra your initial stance) and weakens your solution to the Problem of the Many (you’d need a supervaluationist or epistemicist account). Also doesn’t resolve Coincidence (6) or Social Ontology (4) tensions.

  ---

  **Summary Diagnosis:** Your package *can* survive with modifications but faces lethal pressure from the **Sharpness vs. Vagueness** conflict. Without softening sharp boundaries or accepting some brute facts, the criteria for life/function cannot bear the metaphysical weight you require. The disassembled watch and vague table cases are fatal under current commitments. Prioritize resolving Severe Tension 1; relaxing (5) is the least damaging fix.
