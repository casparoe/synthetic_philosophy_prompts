prompt: |-
  I work on the scheduler and admission-control layer of a multi-tenant distributed database, so the vocabulary I actually think in is that of consensus protocols and capacity planning: nodes and quorums, unanimity versus majority, per-tenant SLOs and p99 latency, safety versus liveness, a global-throughput objective versus a floor guarantee for every tenant, tail risk, starvation, and the difference between a property of a single scheduling decision and a property of a whole run. A colleague and I were arguing about whether we should keep a hard per-tenant latency floor, which visibly costs us aggregate throughput when the cluster is hot, or switch to maximizing the sum of tenant utility and accept that the same few tenants eat the queueing delay. She said this is just the aggregation problem for Scanlon's contractualism in a different notation: the per-tenant floor is the contractualist option, because contractualism tests a principle by whether anyone could reasonably reject it and refuses to let many small gains to many people outweigh one person's serious burden, whereas the global objective is utilitarian and adds everything up. That struck me as both right and too glib — renaming "no one can reasonably reject" as "every node has a veto" doesn't tell me whether the two are the same thing.

  So I'd like the translation done properly rather than as a slogan. Restate contractualism into my vocabulary as faithfully as you can: the fact that it evaluates principles or rules rather than individual acts or individual outcomes (which I take to be like evaluating a protocol rather than a particular execution of it); the standpoint of each individual person; reasonable rejectability as a test a principle has to pass for each person separately; the individualist restriction on the reasons that can be appealed to; the way a single person's larger burden is supposed to defeat a much larger number of much smaller benefits, and the way numbers enter, if they enter at all, only by breaking ties between otherwise comparable complaints; and the point at which contractualism gets into trouble with large numbers of small losses. Then give me the residue report: which of these translate cleanly onto quorums, vetoes, per-tenant guarantees, and tail risk; which translate only if I quietly smuggle in something my vocabulary doesn't have; and which have no expression at all in how I talk about scheduling — I suspect "justifiable to each person, as opposed to merely good or bad for each person" is where the machinery runs out. Say for each piece of residue whether it shows that my vocabulary is missing a distinction or that contractualism is less clear than it looks, and whether the aggregation problem is a real fault line or just a clash of intuitions about numbers that a protocol designer would settle by fiat.

  Two wrinkles I want addressed inside that report, because they're the ones my job actually turns on. First: our scheduler re-decides every couple of seconds, and in any given round the losing tenant's complaint is small enough that overruling it looks reasonable, but over an hour the same tenant is always the loser. Does contractualism have any way of registering a cumulative complaint across a sequence of decisions, or does it evaluate the schedule as a whole (in which case the complaint does register, and my per-round framing was the distortion)? Second: in consensus protocols there is a magic number — a quorum, a tolerated number of faulty nodes — and once you cross it the protocol's behavior changes qualitatively. Is there any analogue of that threshold for the number of complainers in contractualism, or is the count of people literally irrelevant except in tie-breaking, and what does that say about how different it really is from my world?

  Answer as a numbered list of exactly seven items, each one or two sentences long, with no introduction and no conclusion: the mapping, what translates cleanly, what translates only with distortion and what the distortion hides, what has no expression in my vocabulary at all, your verdict on the residue, the sequential-scheduling wrinkle, and the threshold wrinkle. Please write in American English.
reasoning: |-
  Hmm, the user is a database scheduler engineer working on multi-tenant systems. They're deeply familiar with consensus protocols, capacity planning, and concepts like quorums, SLOs, and tail latency. Their colleague drew an analogy between their scheduling dilemma (hard per-tenant latency floors vs. global utility maximization) and Scanlon's contractualism philosophy. The user wants a rigorous translation of contractualism into their technical vocabulary, not just superficial analogies.

  Let me break this down. Contractualism evaluates rules/principles (like protocols) rather than individual outcomes (like execution runs). It centers on whether each person could reasonably reject a principle based on personal burdens. The key elements are: individual standpoint, reasonable rejectability test, individualist reasons, how large burdens trump many small benefits, and tie-breaking by numbers. The user specifically wants to know what maps cleanly to their world of vetoes and quorums, what requires conceptual smuggling, and what has no equivalent.

  For the technical mapping: The principle-as-protocol analogy works perfectly. Individual standpoint maps cleanly to per-tenant guarantees. Reasonable rejectability is like a veto right but with a critical difference - in tech it's binary (node up/down), while in philosophy "reasonable" involves normative judgment about burden justification. This is where the first distortion creeps in.

  The individualist restriction translates well to per-tenant SLOs. The burden/benefit asymmetry maps partially to tail risk management (preventing starvation) but distorts because contractualism's "serious burden" is qualitative while SLOs are quantitative. The tie-breaking role of numbers has no direct equivalent since consensus protocols rely on precise quorums.

  The biggest residue is contractualism's core concept of justifiability - that ephemeral "reasonable" standard that can't be reduced to metrics. This exposes a vocabulary gap in their system, not philosophical vagueness. For the scheduling wrinkles: Contractualism evaluates the entire rule (long-term schedule), so cumulative complaints register automatically. And no, there's no magic-number threshold like quorums; numbers matter only for tie-breaking, making it fundamentally different from their deterministic protocols.

  The user's real struggle is between predictable floors (contractualist) and optimal throughput (utilitarian). Their colleague's analogy holds, but the residues explain why the choice feels harder than protocol design - it's ultimately about whose suffering gets to count as "unreasonable."
answer: |-
  1.  **Mapping:** Contractualism evaluates rules (like protocols) for scheduling, not individual decisions (like single executions), asking if each tenant (individual) could reasonably reject the rule based on the burden *it uniquely imposes on them*, considering only reasons about their own latency/SLO risk (individualist restriction).
  2.  **Clean Translation:** The focus on evaluating a principle/rule maps directly to evaluating a protocol. The individual standpoint translates cleanly to a per-tenant guarantee/SLO perspective. The individualist restriction on reasons aligns with strict per-tenant capacity modeling and SLO tracking.
  3.  **Translation with Distortion:** "Reasonable rejectability" maps to a veto *only if* "reasonable" means "breaches a defined SLO floor" – but contractualism's "reasonableness" hides the irreducibly normative judgment about burden justification lacking in pure metrics. The asymmetry (one large burden defeating many small gains) maps to prioritizing starvation prevention and tail latency risk, but distorts by implying a qualitative threshold ("serious burden") absent in quantitative SLOs.
  4.  **No Expression:** Contractualism's core concept – that a rule must be *justifiable to each person* based on reasons *they* accept as sufficient for rejection, not merely *good for* or *measurably impacting* them – has no expression in the vocabulary of nodes, quorums, SLOs, or throughput; it relies on normative reasoning absent in the system model.
  5.  **Residue Verdict:** This missing "justifiability" distinction shows your vocabulary lacks normative evaluation; contractualism demands justification *to* the burdened tenant, while your system only measures impact *on* them. This makes the aggregation problem a real fault line, not just an intuition clash.
  6.  **Sequential Scheduling Wrinkle:** Contractualism evaluates the *rule* governing the sequence (e.g., "always deprioritize tenant X when hot"). The cumulative burden *is* the relevant complaint against that rule; evaluating single rounds distorts contractualism by artificially atomizing the harm.
  7.  **Threshold Wrinkle:** Contractualism has *no* magic-number threshold like a quorum; the count of beneficiaries/losers is irrelevant except possibly to break ties between *equally severe* individual complaints. This fundamental difference highlights contractualism's strict individualism versus your system's inherent aggregation.
