      Question: Can the agent form the intention to perform a trivial, harmless action (eating one grape) at a specific future time when she knows that at that time she will have no reason to do it?
      Inaccessibilist prediction: No, because the absence of a reason at the time of action prevents intention formation now.
      Accessibilist prediction: Yes, because the triviality lowers the barrier and the agent can form the intention for the reward.

    Crux 2: The Trivial Reason Variant
      Question: If the billionaire adds a small payment (five dollars) for actually drinking, does that enable the formation of the intention?
      Inaccessibilist prediction: Only if the agent judges that five dollars is sufficient reason to endure the illness (or in the grape case, sufficient reason to eat the grape). If she still judges that it is not sufficient, then no.
      Accessibilist prediction: The five dollars might help but is not necessary. The intention can be formed without it.

    Crux 3: Belief about Future Action
      Question: Can the agent, at the time of forming the intention, both intend to φ and believe that she will not φ (because she will change her mind)?
      Inaccessibilist prediction: No, because intending to φ requires believing that one will φ (or at least not believing that one will not).
