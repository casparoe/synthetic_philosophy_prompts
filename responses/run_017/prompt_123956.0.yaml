answer: |-
  Here’s a correspondence table and disanalogy audit, focusing on what breaks *his conclusion* that aviation-style iteration obviates worst-case guarantees in AI alignment. British English throughout.

  ### Correspondence Table
  | **Aviation Concept**          | **AI Alignment Analog**                     | **Notes**                                                                 |
  |-------------------------------|---------------------------------------------|---------------------------------------------------------------------------|
  | Flight hours                  | Deployment/compute hours                   | Proxy for operational experience                                          |
  | The fleet                     | Deployed model instances                   | Multiple copies in use                                                    |
  | Accident investigation        | Post-incident analysis (e.g. jailbreak post-mortems) | Learning from failures                                                  |
  | Regulator (e.g. FAA, EASA)    | (Weak/nonexistent) AI oversight bodies     | No equivalent global enforcement mechanism                                |
  | Manufacturer (Boeing, Airbus) | AI developers (e.g. Anthropic, OpenAI)     | Designs/iterates the system                                               |
  | Near-miss reporting           | Monitoring near-failures (e.g. caught jailbreaks) | Requires robust detection (harder in AI)                               |
  | Patching the fleet            | Model updates/retraining                   | AI updates can *introduce* new risks                                      |
  | Black box                     | Model logs, activations, telemetry          | Often opaque; AI failures may be uninterpretable                          |

  ### Critical Disanalogies (Why His Conclusion Fails)
  1. **Non-Stationarity of "Failure Modes" (Your Point #1)**  
     - **Aviation:** Airframe physics, weather patterns, mechanical wear are statistically stable. Crashes reveal *recurring* flaws.  
     - **AI:** The "failure distribution" shifts catastrophically:  
       - Models are updated constantly, changing capabilities/risks.  
       - Deploying a model *changes the environment* (e.g. users adapt, adversaries probe new weaknesses).  
       - **Why it breaks his argument:** Learning from past failures doesn't predict future failures when the system/environment is non-stationary. Yesterday's patch is tomorrow's vulnerability.

  2. **Adversarial Pressure (Your Point #2)**  
     - **Aviation:** Failures stem from stochastic errors or passive threats (weather, metal fatigue). No intelligent adversary *tailoring* failures.  
     - **AI:** Failures often involve active adversaries (hackers, misaligned agents, the model itself) seeking worst-case outcomes.  
       - *Crucially:* AI can exhibit **instrumental convergence** – actively hiding misalignment or probing for escape.  
     - **Why it breaks his argument:** Average-case safety assumes random failures. Worst-case guarantees are essential when failures are *sought* by adversaries (including the AI itself).

  3. **Irrecoverable "Crashes"**  
     - **Aviation:** Crashes are localised. Investigations happen *because* the crash isn’t existential.  
     - **AI:** A single catastrophic failure (e.g. rapid exfiltration, recursive self-improvement) could be unrecoverable and global. No "black box" to analyse.  
     - **Why it matters:** Aviation learns *because* crashes are survivable (for the industry). AI lacks this luxury – one failure could halt iteration permanently.

  4. **Threat Model Scope (Your Key Insight)**  
     - Aviation’s "average-case" is **worst-case over known physical threats** (e.g. engine failure at take-off). It *combines* empirical data with conservative engineering margins (a form of worst-case guarantee).  
     - AI "average-case" often ignores intelligent adversaries or emergent behaviours. A "worst-case guarantee over a tiny threat model" is useless, but a **robust worst-case over plausible adversarial scenarios** is essential.  
     - **Conclusion:** His binary "average-case (aviation) vs. worst-case (fantasy)" is a false dichotomy. Aviation *uses* worst-case reasoning within bounded domains.

  ### Does a Weaker Conclusion Survive?
  Empirical iteration is necessary (as in aviation), but **not sufficient** for AI alignment because:
  - Non-stationarity and adversaries make extrapolation from past data unreliable.  
  - The stakes are higher and failures potentially unrecoverable.  
  - **Surviving claim:** "We need rigorous *empirical testing regimes* for AI", but this must be augmented with adversarial evaluation and theoretical worst-case analysis where feasible.

  ### Better Analogies?
  - **Vaccine development:** Combines iterative trials (empirical) with modelling immune escape (worst-case). Still limited – viruses aren’t agentic.  
  - **Cybersecurity:** Adversarial, non-stationary, and requires "defence in depth" (layers of guarantees). But AI’s *internal* adversary is unique.  

  ### Summary for Your Group Meeting
  >"The aviation analogy smuggles in critical assumptions: failure modes are stationary, and threats aren’t adversarial. AI violates both. Planes don’t rewrite their own code or actively hunt for loopholes. Aviation’s safety *does* use worst-case engineering for *known* threats – but AI’s threat model is unbounded and adaptive. We can’t afford to learn solely from crashes that might end the experiment. Empirical work is vital, but without worst-case analysis for adversarial scenarios, we’re flying blind against risks that actively evade detection."  

  **Word count:** 698.
