  **MEMORANDUM**

  To: Rules Committee  
  From: [Your Name]  
  Date: March 1, 2024  
  Subject: Recommendation for Presidential Election Method  

  ### Introduction

  This memo addresses the task of recommending a method for electing the President and Vice-President from ranked ballots. The committee has agreed on four requirements:  
  (i) Unanimity: If every voter ranks candidate A above candidate B, then B must not finish above A.  
  (ii) Independence of Irrelevant Alternatives (IIA): The relative order of any two candidates must not change when a third candidate withdraws.  
  (iii) Non-dictatorship: No single voter's ballot may determine the outcome regardless of others.  
  (iv) Majority opposition: No candidate placed last by a majority may hold office.  

  We must also consider practical constraints: the method must be hand-countable in an afternoon by our part-time administrator (for roughly 1,200 ballots) and explainable in a paragraph to the membership.  

  ### Analysis

  The committee has discussed three key arguments:  
  1. A bolt-on disqualification vote to satisfy (iv).  
  2. The possibility of a single axis of disagreement, which would simplify the election.  
  3. A theoretical impossibility (Arrow’s Theorem) that no method can satisfy all four requirements simultaneously.  

  Arrow’s Theorem indeed proves that no method can simultaneously satisfy (i), (ii), and (iii) for three or more candidates. Therefore, we must sacrifice at least one requirement.  

  ### Recommendation

  I recommend adopting the **Borda count with a pre-filter disqualification step**.  

  **Method Specification:**  
  1. **Pre-filter:** For each candidate, count the number of ballots ranking them last. Disqualify any candidate ranked last by a majority (more than half of the ballots).  
  2. **Borda Count:** On the remaining candidates, assign points on each ballot: the highest-ranked candidate gets (n-1) points, the next (n-2), ..., down to 0 for the last, where n is the number of remaining candidates.  
  3. Sum the points for each candidate across all ballots.  
  4. Rank candidates by total points (highest to lowest).  
  5. The highest-ranked becomes President; the second-highest, Vice-President.  

  **Requirements Met:**  
  - (i) **Unanimity:** If every voter ranks A above B, then A will receive more Borda points than B.  
  - (iii) **Non-dictatorship:** The result is a sum of points from all ballots; no single ballot can dictate the outcome.  
  - (iv) **Majority opposition:** The pre-filter disqualifies any candidate ranked last by a majority, preventing them from holding office.  

  **Requirement Sacrificed:**  
  - (ii) **IIA:** We sacrifice IIA because the relative order of two candidates can change when a third candidate is disqualified or withdraws. This is a necessary sacrifice due to Arrow’s Theorem. The cost is borne here because IIA is the least defensible in practice: the withdrawal incident last year showed that IIA violations can occur in any method we choose, but unanimity and non-dictatorship are more fundamental.  

  **Addressing Committee Arguments:**  
  - **Bolt-on disqualification (veto):** We adopt this as a pre-filter to satisfy (iv). It is a practical solution that avoids the risk of a candidate opposed by a majority taking office.  
  - **Single-axis argument:** While a single axis of disagreement would simplify the election, we have evidence of a second cleavage (in-person vs. remote annual meeting) that cuts across the first. Furthermore, verifying single-peakedness from the ballots is not hand-computable in an afternoon. We cannot rely on this argument.  

  **Strongest Argument Against:**  
  The strongest argument against Borda count is its vulnerability to strategic voting (such as ranking a strong rival last) and the possibility of order reversal when a candidate withdraws (as occurred last year). While no method is immune to strategy, the Borda count is particularly sensitive. However, the pre-filter mitigates the worst-case scenario of a majority-opposed candidate winning, and the method remains hand-countable.  

  **Residual Risks:**  
  1. **Reversal on withdrawal:** If a candidate is disqualified by the pre-filter or withdraws, the Borda scores of the remaining candidates may shift, potentially reversing the order of the top two.  
  2. **Strategic voting:** Members may continue to rank strong rivals last to depress their scores, which Borda count does not discourage.  
  3. **Popular but not first-choice winners:** A candidate who is broadly acceptable but few voters' first choice may win over a candidate with more first-choice support but stronger opposition.  

  ### Conclusion

  Despite these risks, the Borda count with a pre-filter best balances our requirements and practical constraints. It ensures that a candidate opposed by a majority cannot win, respects unanimity, and avoids dictatorship, while being hand-countable. We sacrifice IIA, but this is unavoidable and the least critical of the four requirements.  

  I move that the committee recommend this method to the society.  

