answer: |-
  ### MEMORANDUM  
  **To:** Rules Committee, Learned Society  
  **From:** [Your Name], Rules Committee Member  
  **Date:** February 25, 2024  
  **Subject:** Recommendation for Presidential Election Method Reform  

  #### **Background**  
  Our society faces a critical challenge: redesigning our presidential election method to address flaws exposed in the last contest while adhering to four core requirements derived from member feedback:  
  1. **Unanimity:** If every voter ranks A above B, B cannot finish above A.  
  2. **IIA (Independence of Irrelevant Alternatives):** The relative order of any two candidates must not change if a third withdraws.  
  3. **Non-dictatorship:** No single ballot alone determines the outcome.  
  4. **Majority opposition:** No candidate ranked last by a majority may hold office.  

  Practical constraints are paramount: ~1,200 paper ballots must be hand-counted in one afternoon, and the method must be explainable in a paragraph to 4,000 members.  

  #### **Key Arguments Considered**  
  1. **Bolt-on disqualification vote (for Requirement 4):** This proposal would disqualify any candidate ranked last by a majority *before* tallying rankings. It is administratively feasible and directly addresses the "actively opposed" winner from last year. However, it does not resolve IIA violations (Requirement 2), as withdrawal-triggered reversals could still occur among remaining candidates.  
  2. **Single-axis argument:** If preferences align on one spectrum (e.g., junior vs. senior), majority rule would suffice. However, cross-cutting cleavages (e.g., in-person vs. remote meetings) make this assumption unreliable. **We cannot verify single-axis alignment from existing ballots** without computationally intensive analysis (e.g., checking for single-peaked preferences), which violates our hand-counting constraint.  
  3. **Impossibility concerns:** Arrow’s Theorem proves *no ranked method* can satisfy Requirements 1–3 simultaneously for ≥3 candidates. We must sacrifice one.  

  #### **Recommendation: Borda Count with Pre-Filter Disqualification**  
  After careful analysis, **I recommend adopting the Borda count with a pre-filter disqualification step** (outlined below). This method prioritizes fairness, practicality, and transparency while explicitly sacrificing Requirement 2 (IIA).  

  **Method Specification (for hand-counting):**  
  1. **Disqualify candidates ranked last by a majority:** Tally last-place votes for each candidate. Eliminate any candidate with >600 last-place votes (majority of 1,200 ballots).  
  2. **Assign Borda points:** For the remaining \(n\) candidates, assign points on each ballot:  
     - 1st preference: \(n-1\) points  
     - 2nd preference: \(n-2\) points  
     - ...  
     - Last preference: \(0\) points.  
  3. **Sum points:** Sum points for each candidate across all ballots.  
  4. **Rank candidates:** Order candidates by total points (highest to lowest). The highest wins presidency; second-highest wins vice-presidency.  

  **Requirements Met:**  
  - **Unanimity (1):** If all voters rank A above B, A always receives more points.  
  - **Non-dictatorship (3):** No single ballot can override the collective outcome.  
  - **Majority opposition (4):** Pre-filter disqualifies majority-opposed candidates.  

  **Requirement Sacrificed:**  
  - **IIA (2):** Withdrawals can alter the relative order of remaining candidates.  
    - *Justification:* IIA must be sacrificed per Arrow’s Theorem. Crucially, violations are **least operationally disruptive** here:  
      - Unlike Condorcet methods (which risk cyclical ambiguities unhandlable by hand), Borda always produces a clear ranking.  
      - Violations are predictable (affecting only point differentials, not unanimity) and can be mitigated by pre-filtering irrelevant candidates.  
      - **Cost-benefit:** Sacrificing IIA avoids dictatorship (unthinkable) or unanimity (foundational), and pre-filtering minimizes withdrawal-triggered reversals.  

  #### **Addressing Counterarguments**  
  - **Strongest argument against Borda:** Strategic "burying" (ranking rivals last) could distort outcomes. This is valid—Borda is vulnerable to tactical voting, and members have admitted to such behavior. However, no hand-countable method is strategy-proof. The pre-filter mitigates this by excluding broadly rejected candidates, and Borda’s simplicity ensures auditability.  
  - **Bolt-on verdict:** The pre-filter is **adopted and essential** to meet Requirement 4. It is feasible (adds one counting step) and prevents majority-opposed winners.  
  - **Single-axis verdict:** **Rejected.** Cross-cutting cleavages invalidate the assumption, and verification is infeasible by hand.  

  #### **Residual Risks**  
  1. **Strategic voting:** "Burying" strong rivals may persist but is constrained by the pre-filter.  
  2. **Ambiguity in point gaps:** Small point differences could trigger recounts, but manual review remains manageable.  
  3. **IIA violations:** Withdrawals could still alter outcomes, though pre-filtering reduces candidates likely to cause reversals.  

  #### **Conclusion**  
  We must accept that no perfect method exists under Arrow’s constraints. The Borda count with pre-filter disqualification best balances our requirements: it ensures the most unpopular candidates cannot win, respects voter unanimity, and is hand-countable in an afternoon. By sacrificing IIA—a theoretical ideal rarely achieved in practice—we prioritize fairness, simplicity, and member trust.  

  **Recommendation:** Adopt this method for the 2024 election cycle.  

