answer: |-
  ### Bottom line (~150 words)
  Your practices presuppose that an artifact is primarily defined by its **continuous historical narrative and institutional identity**, not its matter or form alone. "Original" means the object with the *correct provenance chain* tied to your museum’s custody (via accession numbers). Restoration maintains this chain, so identity persists. Replicas or casts lack this history, so they’re new objects. For repatriation, source communities aren’t asking for form or matter *per se* but for the restoration of a *relationship* severed by colonialism/appropriation; a copy lacks this history and thus insults by implying the relationship is replaceable. Digital "preservation" is about data backup, not identity substitution. Your colleague is largely correct: metaphysics isn’t needed. Your loan agreement’s mix of accession number and description anchors this narrative view. **Policy takeaway:** Define "original" as "the entity bearing our institutional provenance," and treat repatriation as about ethical relationships, not object ontology.

  ---

  ### The implicit theory (~400 words)
  Your cluster of practices aligns with a **narrative persistence theory**, where an artifact is a historically situated "character" in an ongoing story. Its identity depends on:
  1. **Provenance continuity**: The unbroken chain of custody (e.g., excavation → accession → conservation). Your accession number isn’t just a label; it’s a unique identifier for this narrative thread. Replacing a marble arm under institutional care extends the story; casting a bronze from a mold starts a new one.
  2. **Institutional guardianship**: The museum’s role as steward defines the object’s "life." Like the Ise Shrine (rebuilt ritually every 20 years), persistence requires sanctioned continuity of practice. The shrine isn’t 1,300-year-old wood; it’s a 1,300-year-old *tradition* maintained by specific actors. Your conserved Roman head is "the original" because *you* (the institution) maintained its identity through interventions.
  3. **Sortal relativity**: What the object *is* depends on the community’s purpose. For conservation, "Roman portrait head" is a sortal (category) prioritizing form+history, allowing matter replacement. For connoisseurship, "autograph bronze by Master X" might prioritize material authenticity. Your building example reflects this: heritage law uses "listed building" as a sortal valuing continuity of place/use, not material. Rebuilding from scratch breaks this narrative.
  4. **Digital as derivative**: Scans are treated as informational snapshots, not the object itself, because they lack physical continuity and institutional entanglement. They’re tools for access or research, not ontological substitutes.

  **Why this isn’t inconsistent**: Matter matters when history is tied to it (e.g., irreplaceable patina on a bronze). Form matters when history is tied to appearance (e.g., a reconstructed pot). The narrative view flexibly prioritizes what sustains the object’s story in context. Repatriation clashes because source communities operate with a *different narrative* (e.g., "sacred relic" vs. "art historical specimen"), where your institutional story is part of the harm.

  ---

  ### What’s strictly presupposed vs. what merely fits (~250 words)
  **Strictly Presupposed**:
  1. **Identity requires historical continuity**: An object persists iff its institutional biography remains unbroken (via accession number, treatment records).
  2. **Provenance > Matter**: Swapping parts under conservation doesn’t break identity; acquiring a replica does. Your loan agreement’s "accession number + description" combo fixes identity via history, not physics.
  3. **Institutional authority**: The museum defines the narrative (e.g., deciding when restoration is "continuous" vs. "replacement"). Ise works because Shinto authorities sanction the rebuild; replicas aren’t listed because heritage bodies don’t sanction them as continuous.

  **Merely Fits (not essential)**:
  1. **Form vs. matter flexibility**: You *could* prioritize matter rigidly (some museums do for "untouched" artifacts), but your practices don’t require it. The narrative view *accommodates* matter-centric cases (e.g., retaining original fragments) when history demands it.
  2. **Digital "preservation"**: Calling a scan "preservation" is metaphorical, not ontological. It fits the narrative view as data backup but doesn’t presuppose identity transfer.
  3. **Repatriation ethics**: The narrative view doesn’t dictate ethics but *explains* why a copy fails: it lacks the contested history. Communities seek narrative closure (e.g., homecoming), not form.

  **Your colleague’s view isn’t a cop-out**: Avoiding metaphysics is defensible. What’s essential is that "original" means "this institution’s designated entity with its accrued history." No constitution theory (e.g., "lump of clay = statue") is needed. Concretely, the loan agreement *does* the heavy lifting by binding identity to institutional record-keeping.

  ---

  ### The hard cases: Ise and the 3D print offer (~300 words)
  **Ise Shrine**: This seems to violate material persistence but fits perfectly under narrative continuity. The shrine’s identity is tied to:
  - **Ritualized renewal**: The rebuilding (Shikinen Sengu) is a *prescribed practice* maintaining the shrine’s essence. It’s not "repair" but *reiteration* by authorized actors (Shinto priests).
  - **Cultural sortal**: In Shinto belief, the shrine is a "shintai" (divine body) whose spirit transfers to the new structure. The museum-like "authority" here is the tradition itself.
  - **Place and continuity**: The adjacent site rebuild preserves spatial and functional continuity (unlike demolition/replica).  
  *Your practice parallel*: Like conserving a building board-by-board, Ise is institutional (ritual) continuity. If your museum ritually reconsecrated an object during conservation, persistence might be similarly uncontested.

  **3D Print Repatriation Offer**: This insults because:
  1. **History is erased**: The copy lacks the object’s biography of removal/appropriation. Returning it is like returning a forgery of a stolen painting—it denies the harm done.
  2. **Relationship, not form**: Communities often seek restoration of kinship, spiritual access, or sovereignty. A print can’t embody this; it’s a hollow simulation.  
  *Where your practice clashes*: When you say digital scanning "preserves" the object, you mean it preserves *data for your institutional purposes* (research, display). Offering it as a substitute mistakes this for the *embodied history* the community values. It’s not hypocrisy—it’s a category error. The insult lies in treating relational value as fungible.  
  **Policy fix**: Never offer replicas unsolicited. If communities *request* them (e.g., for education), that’s different. Base repatriation on ethical obligations, not ontological debates.

  ---

  ### If we switched theories (~200 words)
  Adopting a **strict materialist view** (object = its matter) would force radical changes:
  - **Restoration becomes unethical**: Adding filler or replacing parts creates a new object. You’d stop reconstructions, keep all original fragments, and likely deaccession heavily restored items.
  - **Replicas gain status**: A perfect 3D print matching original matter (e.g., same alloy) might qualify as "original" under the same accession number—but this is untenable for cataloguing.
  - **Buildings lose status**: Listed buildings with replaced materials couldn’t retain designation; Ise would be a modern replica.

  A **co-location view** (statue + clay as two objects) adds bureaucracy:
  - You’d catalog both the "artwork" (persisting through change) and the "material instance" (constantly reaccessioned as parts are replaced). Impractical for loans/insurance.

  **Bundle theory** (object = properties + history) aligns with your current view but risks over-flexibility. A sacred object could be "repatriated" as a bundle of scans + documentation, which communities would likely reject.

  **Recommendation**: Stick with the narrative/historical view. It’s legally robust (tied to records), explains your practices, and accommodates ethical nuance. For policies:
  1. Define "original" as "the entity with continuous provenance under our accession number."
  2. For repatriation, state: "Requests for physical return acknowledge the object’s unique historical/cultural relationships. Replicas may not be substituted without explicit community consent."
  3. Specify conservation limits (e.g., ">50% original material?") only if needed for insurance—not ontology.
