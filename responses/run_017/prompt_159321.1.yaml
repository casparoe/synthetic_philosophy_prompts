prompt: |-
  My city's land-use process has a shape I cannot make philosophical sense of, and I would like its implicit theory made explicit rather than argued for or against.

  Here is how it works, as I understand it. Most residential land is zoned single-family. Putting two or more units on a lot zoned single-family requires a discretionary permit: the city mails notice to owners of record within three hundred feet, holds a public hearing before the planning commission and then before the council, and issues written findings. Incompatibility with what the staff reports call neighborhood character, added traffic, loss of curbside parking, and shadow are all accepted grounds for denial, and none of them has to be quantified or shown to reduce anyone's property value. Opponents may also sue under the state environmental-review statute on the ground that the city's analysis was inadequate, which routinely adds a year or more; the delay is part of what opposition buys. By contrast, demolishing a house on the same lot and replacing it with one very large single-family house is approved ministerially: no notice, no hearing, no appeal, even when the replacement generates more traffic and more shadow than the duplex would have. Meanwhile the same council is under a state mandate to plan for several thousand additional homes over the next decade, and fair-housing law forbids the city, and largely forbids sellers and landlords, from selecting occupants by race, by family status, or, in some states, by source of income. The neighborhood therefore cannot say who may live on a street, though through the permit process it can determine roughly what the housing there will cost. Last year the council added a second track: projects within a quarter mile of a frequent bus line, and projects in which at least a fifth of the units are income-restricted, are now approved ministerially, with no hearing and no appeal, while everything else keeps the full process; and in the older streetcar-era neighborhoods near downtown it simultaneously adopted an overlay that strengthens the hearing requirement and adds design review. Nobody is compensated when the council approves over objection, and nobody pays anything when it denies.

  Five features of this package strike me as pulling in different directions. First, standing is set by parcel and radius rather than by stake: someone who bought last month and a family that has lived on the block for fifty years have identical standing, the tenant next door is not notified at all even when the project would demolish the building she lives in, and the people who would occupy the new units are not parties, are not counted, and are not notified, despite being more numerous and, by any ordinary measure of intensity, more strongly affected. Second, the intensity of opposition is itself recorded as evidence of harm: findings recite how many letters arrived and how many residents signed up to speak, and a large turnout counts in favor of denial, while no comparable tally is taken on the other side and intensity is never weighed against intensity. Third, the veto reaches the form of other people's property but not its occupancy or its ordinary use: a neighbor cannot be stopped from painting the house, keeping several cars on the property, or selling to anyone at all, but can be stopped from adding a second unit. Fourth, the same objection now has no force two blocks from a bus line and full force three blocks away, and is treated as defeasible by transit proximity and by subsidy while being hardened in the overlay districts. Fifth, the process contains no symmetric affirmative power: residents can block a great deal and compel nothing.

  What I want is the view of a person's claim on a place that this bundle presupposes, and I can think of five candidates. The first treats homeownership as an undiversifiable stake in a local collective asset whose value depends on the built and social character of the immediate area, with the veto as the protection of that stake. The second treats residence as membership in a self-governing community with a collective right to determine the shape of its common life, a right to the city as a right to shape rather than merely a right of access. The third treats the process as the protection of legitimate expectations formed under an earlier set of rules about school capacity, parking, quiet, and outlook. The fourth treats the hearing as an information-eliciting device, on the assumption that nearby residents know local facts that planners do not. The fifth says the practice is not the expression of any view at all but the predictable result of concentrated benefits and diffuse costs.

  For each of these, tell me whether the practice as I have described it strictly presupposes the view, is merely compatible with it, or actually conflicts with some feature of it; and be explicit about where my description underdetermines the answer, in the sense that two or three of the theories would license exactly the process I have described, and about which single change to the process would best discriminate between them. Then tell me what would have to change if the city replaced the presupposed view with one of the others: what a process built on the investment-stake view would look like as opposed to one built on the membership view, what a process built on the protection of expectations would substitute for the veto, and what a process honestly designed to elicit local information would do with a roomful of angry residents and a petition.

  I am less interested in whether the neighbors are right than in what the city commits itself to by running things this way. In particular: is the two-track reform an admission that the veto was never a right but only a defeasible privilege, and what principle is the city adopting when it removes that privilege near transit while reinforcing it, through the overlay, in the neighborhoods that are oldest, most central, and most able to afford lawyers?
reasoning: |-
  Okay, the user is presenting a complex urban planning scenario from their city, focusing on the philosophical underpinnings of their land-use process. They've described a system with apparent contradictions: strict veto power over multi-unit housing but ministerial approval for mega-mansions, while simultaneously facing state mandates for more housing and fair housing laws. 

  The user seems deeply familiar with planning jargon (ministerial vs discretionary approval, overlay districts) but frustrated by the system's internal logic. They're not asking for solutions or moral judgment - they want the implicit philosophy made explicit. Interesting how they frame this as "what the city commits itself to" rather than whether it's right or wrong. There's an academic detachment here, but also clear personal investment ("my city").

  Hmm... their five candidate theories are well-structured but I notice they all focus on resident rights/community - nothing about market efficiency or environmental protection. That omission might itself be revealing. The query's density suggests they've pondered this extensively, probably with legal or planning background. 

  The tricky part is analyzing each theory against the described features without imposing external values. For example: the "investment stake" theory explains standing by parcel radius but conflicts with excluding tenants. The "self-governance" theory fits the veto power but not the two-track reform that removes community input near transit. 

  Ah! The bus-line/subsidy exception is key - it fundamentally undermines the notion of absolute community rights. And that overlay district reinforcement in wealthy areas... that smells like privilege preservation disguised as historic preservation. The user's sharpest insight might be that the system measures opposition intensity as harm evidence without weighing pro-housing voices - that really exposes the power imbalance.

  When considering what changes would test each theory... for the "information-eliciting" view, we'd need to see how the system filters emotional testimony from factual input. Currently it doesn't - so replacing hearings with expert testimony requirements would discriminate between theories. 

  The compensation question is philosophically juicy too. If this were truly about protecting property values, denials would trigger compensation like eminent domain does. That it doesn't suggests the "concentrated benefits" theory is strongest. 

  For the final question about the two-track reform... yes, it absolutely exposes the veto as privilege, not right. And the overlay districts? That's pure NIMBYism - preserving veto power where wealth concentrates it. The city's adopting "growth for thee but not for me" masked as transit-oriented development. Brutal.
answer: |-
  Your city's land-use regime reveals an implicit philosophy through its structural contradictions. Here's how each candidate theory interacts with the described practice, what's underdetermined, diagnostic changes, and how adopting alternative views would reshape the process:

  ### Theory Assessments
  1. **Investment-Stake View** (Protection of undiversifiable property value)  
     - **Presupposed**: Standing by parcel radius (proximity = risk), veto over density but not occupancy/use (physical changes affect value directly).  
     - **Conflicts**: Excludes tenants (who bear relocation costs without property stake) and disregards actual evidence of value impact (denials require no proof of devaluation).  
     - **Underdetermined**: Could explain opposition intensity as proxy for perceived harm to asset value.

  2. **Membership View** (Resident self-governance over community character)  
     - **Presupposed**: Veto over physical form (deemed essential to "common life"), hearings as democratic forum.  
     - **Conflicts**: Two-track system voids community input near transit/affordable housing—subordinating "membership" to regional goals. Tenants' exclusion contradicts membership logic.  
     - **Underdetermined**: Intensity of opposition recorded as legitimate expression of community will.

  3. **Expectations View** (Protection of rules-based expectations)  
     - **Presupposed**: Ministerial approval for conforming McMansions (fits prior rules) vs. discretionary review for non-conforming density.  
     - **Conflicts**: Overlay districts *change* rules retroactively (heightening scrutiny in historic areas), and state housing mandates override past expectations.  
     - **Underdetermined**: Standing radius assumes expectations decay identically at 301 feet.

  4. **Information-Eliciting View** (Hearings gather local knowledge)  
     - **Presupposed**: Notice to nearby owners (potential knowledge sources).  
     - **Conflicts**: Opposition intensity treated as *evidence of harm* rather than *data quality*. No mechanism to filter factual input (e.g., traffic patterns) from preference ("not in my backyard").  
     - **Underdetermined**: Radius assumes knowledge decays uniformly with distance.

  5. **Concentrated Benefits/Diffuse Costs View** (Veto as interest-group capture)  
     - **Presupposed**: Asymmetric veto power (blocking costs concentrated, approval benefits diffuse); overlay districts protect wealthy neighborhoods best able to lobby.  
     - **Compatible**: Explains all features without internal contradiction—especially the exclusion of pro-housing voices (diffuse beneficiaries).  

  ### Diagnostic Changes to Discriminate Theories
  - **Best single test**: **Compensate owners for denials**.  
    - Investment-stake view *requires* this (if harm is provable).  
    - Other views reject it (veto is right/privilege, not takings).  
  - **Secondary test**: **Include tenants/new residents in hearings**.  
    - Membership view demands it (all community members).  
    - Investment view opposes it (no property stake).  

  ### Rebuilding the Process on Alternative Foundations
  - **Investment-Stake View Process**:  
    - Standing limited to owners demonstrating *measurable* value impact (e.g., appraisal evidence).  
    - Denials require quantification of harm (shadow studies, traffic counts).  
    - Compensation paid to owners if project denied despite no significant harm.  
    - *Replaces veto with insurance mechanism*.

  - **Membership View Process**:  
    - Standing for all residents (owners/tenants) within defined community boundary.  
    - Binding neighborhood votes on project conformity with community plan.  
    - No ministerial approvals—all changes require communal consent.  
    - *Eliminates two-track system as undemocratic*.

  - **Expectations View Process**:  
    - "Grandfather" existing uses; changes allowed if they don’t worsen pre-existing conditions (e.g., no net new traffic).  
    - Veto only if project violates *original, codified* expectations at time of purchase.  
    - *Removes discretionary hearings for projects meeting objective compatibility metrics*.

  - **Information-Eliciting View Process**:  
    - Hearings replaced with written expert testimony (traffic, shadow studies).  
    - Resident input limited to *factual* evidence (e.g., "this alley floods daily"); opinions excluded.  
    - Opposition petitions ignored; planners synthesize data into objective report.  
    - *Eliminates "intensity as harm" logic*.

  ### The Two-Track Reform & Overlay Districts: What It Reveals
  - **Veto as Privilege, Not Right**: The reform proves the "right" to veto is contingent on geography and affordability. If it were a core property right (Investment view) or democratic imperative (Membership view), exceptions near transit would be illegitimate.  
  - **Overlay Districts Adopt an Anti-Gentrification Principle**: By strengthening veto power in central, older neighborhoods, the city privileges *incumbent stability* over *newcomer access*—effectively subsidizing wealthy enclaves under historic preservation guise. The unstated principle: **"Preserve exclusion where market pressures are strongest."** This conflicts with fair-housing ideals by locking in economic segregation.  

  ### Underlying Commitment
  Your city’s process commits to **protecting propertied incumbents from perceived externalities, while outsourcing regional housing burdens to less-organized or affluent groups**. The two-track system doesn’t reconcile philosophies—it layers technocratic efficiency (transit/subsidy fast-tracks) over oligarchic preservation (overlay districts), revealing a purely instrumental view of land use: **control is allocated to whichever constituency can impose the highest political cost for disregarding their preferences.**
