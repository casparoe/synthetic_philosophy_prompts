prompt: |-
  I help keep a small volunteer archive for our town — local history, old photos, building records, that kind of thing — and the thing we actually argue about most isn't the facts, its wording: whether a sentence goes in flat (the mill burned in 1908), hedged (reportedly), or doesn't go in at all. There's three of us, we push out maybe forty entries a month, whatever we write gets quoted back at us at town meetings, and when people appeal a hedge I'm the one who has to explain it, so I want something better than our current system of everybody going with their gut.

  I got into this stuff on my own a couple years back — a used textbook, some podcasts, no classes — and the account that stuck with me (I think it's called the tracking theory? Nozick? maybe I've got the name wrong) is the one with the two what-if questions: you count as knowing that P only if, had P been false, you wouldn't have ended up believing it, and had P been true, you would have. I also gather there's a long fight about whether knowing P means you automatically know everything that obviously follows from P, which is exactly our problem, because half our entries are derived from other entries rather than from a source. I'm definately mangling some of this, so fix me gently but do fix me.

  What I want is an actual procedure, not an essay. Something a volunteer with no training can run on one claim in about ten minutes, with questions to answer in order, boxes to tick, and a one-line reason for the log. Please give me:

  - the steps in order, what counts as a good enough answer to each, and where the thing just stops — downgrade to a hedge, or leave it out;
  - one step where you write down, in a single sentence, how we came by the claim. My worry is people gaming this: describe the route in enough detail and everything passes, describe it loosely and nothing does. Give us a rule of thumb for how fine-grained that sentence should be, and say straight out if no rule can settle it;
  - a step for claims we reach by inference instead of from a source. My half-baked idea, tell me if it's wrong: besides testing the premise, run the same sensitivity question on the step itself — if this step were a bad one, would we still have taken it? — and tell us how many "obvious" steps we're allowed before we go back and check from scratch. Then tell me which of these are really the same question in disguise: a claim that follows in one obvious step; a claim that only follows once you know some background thing we had to look up; a chain of four steps; a claim stitched out of two things we each know separately; and nobody recorded it turned into it didn't happen;
  - a note on every step that's really a judgment call wearing a clipboard.

  Then run it on three of ours. One: a single 1978 newspaper clipping says the mill burned in 1908, and from that we'd also like to say the mill wasn't operating in 1909. Two: the swimming hole was closed in 1974 because the plant upstream dumped solvent — everyone in town knows this, there's a plaque, and if it were false we would all still believe it exactly as hard as we do now. Three: we've read every issue of the local paper from that summer and there's no mention of anyone drowning in the river, so we want to say nobody did.

  I already know which of those is going to come out badly and I'd rather watch you do it properly than have us quietly skip it. Finish with the one-page version — just the questions and the tick boxes, nothing else — that we can tape up over the scanner.
reasoning: |-
  We are building a procedure for evaluating historical claims in a small volunteer archive. The goal is to determine whether a claim should be stated flatly, hedged (e.g., with "reportedly"), or omitted. The procedure should be usable by volunteers with no formal training and take about 10 minutes per claim. It is inspired by epistemological concepts (like the tracking theory from Nozick) but must be practical.

  The tracking theory (Nozick) conditions for knowing P:
  1. If P were false, you wouldn't believe P (sensitivity).
  2. If P were true, you would believe P (adherence).

  But note: we are not defining knowledge philosophically but creating a practical test for when to assert a claim.

  We also address the problem of inference: when we derive a claim from other claims.

  The procedure:

  Steps in order. At each step, if the answer is "no", we may downgrade to a hedge or omit. We'll specify.

  Step 1: Source Documentation
     - Write down in a single sentence how we came by the claim. This is the "provenance" step.
     - Rule of thumb for detail: The description must be specific enough that if someone else followed the same steps, they would get the same claim. Avoid vague terms like "we found" or "we know". Instead, say "from a 1978 newspaper clipping" or "from the 1900 census record". If the claim is inferred, state the inference briefly (e.g., "inferred from the absence of records").
     - If the claim is from a source, note the source and its date. If it's inferred, note the basis.
     - If the claim is common knowledge, note that and specify the community (e.g., "common knowledge among long-time residents").
     - If we cannot provide a sufficiently specific sentence, we must hedge or omit.

  Step 2: Sensitivity Check (Inspired by: If P were false, would we still believe it?)
     - Ask: "If this claim were false, is it likely that we would still have ended up with this belief given how we got it?"
     - Good enough answer: If the method we used (as described in Step 1) is such that even if the claim were false, we might still have gotten the same evidence, then the claim fails this step. For example:
          - If we have only one source and that source might have been mistaken or biased, then we might have believed it even if false.
          - If the claim is based on absence of evidence (like no drowning reported), then if the event happened but wasn't reported, we would still have the same absence -> so it fails.
     - If the answer is "yes, we might still believe it even if false" -> then we must hedge or omit.
     - If the answer is "no, if it were false we probably wouldn't have this belief" -> then we pass to the next step.

  Step 3: Adherence Check (Inspired by: If P were true, would we believe it?)
     - Ask: "If this claim were true, is it likely that we would have ended up with this belief given how we got it?"
     - Good enough answer: If the method we used is reliable for truth, then yes. For example:
          - If we have a primary source from the time, then if it were true we would have that record and believe it -> passes.
          - If we have multiple independent sources, passes.
          - If the claim is based on absence of evidence, and we have a comprehensive search (like reading every paper), then if it were true (i.e., no drowning) we would have no report -> passes. But note: if our search wasn't comprehensive, then even if true we might not have found a report? Actually, the absence would be the same. However, if the event happened and was not reported, we would still have absence -> so that case fails the sensitivity step, not this one.
     - If the answer is "no, even if true we might not have gotten this belief" (e.g., because our method is too weak to capture the truth) -> then we must hedge or omit.
     - If "yes", we pass.

  Step 4: Inference Handling (For claims derived from other claims)
     - If the claim is directly from a source (not inferred), skip to Step 5.
     - If inferred, we must:
          a) Identify the premises (the claims we are inferring from) and the inference step (how we got from premises to this claim).
          b) For each premise, we must have already run this procedure and the premise must have been approved for flat assertion (or if not, we must run it now). If any premise is hedged or omitted, then the inferred claim must be at least as hedged as the weakest premise.
          c) Test the inference step itself for sensitivity: "If the inference step were flawed (i.e., if the premises did not actually support the conclusion), would we still have made this inference?" If yes (i.e., we might have made the inference even if it's bad) -> then we must hedge the claim or re-evaluate.
          d) Also, test for adherence: "If the inference is a good one (i.e., the premises do support the conclusion), would we have made it?" (This is usually yes, so less critical, but we include for completeness.)

     - Rule for chain length: We are allowed one obvious step without going back to scratch. If there are multiple steps, we must check each step. However, we can define:
          - One obvious step: e.g., "the mill burned in 1908, so it wasn't operating in 1909" is one step. But note: it requires background knowledge that a burned mill typically takes time to rebuild and might not operate the next year. If that background is uncontroversial and we have it from a reliable source (or common knowledge), then it's one step. If we had to look up that background, then that background claim must be verified first.
          - If the inference requires a chain of more than two steps, we should break it down and verify each step.

     - Types of inferences:
          - One obvious step: as above. We run the inference test (step 4c) on it.
          - Requires background we had to look up: then the background claim becomes a premise and must be verified.
          - Chain of four steps: break it down and verify each step and each premise.
          - Stitched from two separate claims: each must be verified, and the combination must be tested (if the combination is non-trivial, it's an inference step).
          - Absence of record -> event did not happen: this is an inference. We must test the sensitivity: if the event did happen, would it have been recorded? If not, then we might have absence even if it happened -> fails sensitivity.

  Step 5: Final Check for Practical Concerns
     - Ask: Are there any other reasons to hedge? (e.g., controversial in the community, potential for harm, or if we know there is conflicting evidence we haven't resolved)
     - If yes, hedge or omit.

  At any step if we decide to hedge, we can stop and mark the claim as hedged. If we omit, we stop.

  Now, note on judgment calls: Steps 2, 3, 4c, and 5 involve judgment. We must be explicit about the criteria and use the same standard. The key is to be consistent and document the reason.

  Now, run the three examples.

  Example 1: 
     Claim: "The mill wasn't operating in 1909."
     How we got it: We have a 1978 newspaper clipping that says the mill burned in 1908. We infer that the mill wasn't operating in 1909.

  Step 1: Source Documentation
     - "Inferred from a 1978 newspaper clipping stating the mill burned in 1908, and the background knowledge that a mill burned in a year would not be operating the next year."
     This is specific enough.

  Step 2: Sensitivity Check for the claim (mill not operating in 1909)
     - If the mill had been operating in 1909, would we still have believed it wasn't? 
          How we got the belief: we have the 1978 clipping about the 1908 fire and we inferred.
          If the mill had been operating in 1909, that would mean either:
            a) The fire didn't happen in 1908 (but the clipping says it did) -> then we would not have the premise? But the clipping exists regardless. Even if the fire didn't happen, the clipping might still exist (if it was mistaken). So we might have the same premise and make the same inference.
            b) Or the fire happened but the mill was rebuilt very quickly and operated in 1909. In that case, the premise (burned in 1908) is true, but our inference is flawed because we assumed it wouldn't operate in 1909. So we would still have the premise and make the inference -> we would believe it wasn't operating even if it was.
          Therefore, we might believe the claim even if it were false -> fails sensitivity.

     So we must hedge or omit. We would hedge: "The mill reportedly was not operating in 1909." But note: we haven't checked the premise yet. However, the inference is the problem.

     Alternatively, we can break down:

     First, check the premise: "The mill burned in 1908" from the 1978 newspaper clipping.

     For the premise: 
          Step 1: "From a 1978 newspaper clipping."
          Step 2: Sensitivity: If the mill hadn't burned in 1908, would we still have this clipping? Possibly, because the clipping might be wrong. So we might believe it even if false -> fails. So the premise should be hedged: "reportedly burned in 1908".

     Then, the inference: from a hedged premise, we get a hedged conclusion. Also, the inference step itself fails the sensitivity test as above.

     Therefore, the claim "the mill wasn't operating in 1909" must be hedged.

  Example 2:
     Claim: "The swimming hole was closed in 1974 because the plant upstream dumped solvent."
     How we got it: "This is common knowledge in the town, supported by a plaque at the site."

  Step 1: Source Documentation
     - "Common knowledge among town residents, and there is a plaque at the swimming hole site stating this reason."

  Step 2: Sensitivity Check
     - If the swimming hole was closed for a different reason (or if the plant didn't dump solvent), would we still believe this? The user says: "if it were false we would all still believe it exactly as hard as we do now." So yes, we would still believe it. Therefore, fails sensitivity.

     So we must hedge: "Reportedly, the swimming hole was closed because of solvent dumping by the upstream plant."

     Note: Even though there's a plaque, if the plaque is based on the same common knowledge (and not an official investigation), it might be circular. We don't know the plaque's source.

     Step 3: Adherence? We don't get to step 3 because step 2 fails.

     But for completeness: If the claim were true, would we believe it? Yes, because we have the common knowledge and the plaque.

     However, because step 2 fails, we hedge.

  Example 3:
     Claim: "Nobody drowned in the river that summer."
     How we got it: "We've read every issue of the local paper from that summer and found no mention of any drowning."

  Step 1: Specific enough.

  Step 2: Sensitivity Check
     - If it were false (i.e., someone did drown), would we still have the same belief (i.e., no report)? 
          It depends: if the drowning was not reported in the paper (for any reason: maybe it was in a different paper, or not reported at all), then we would still have no mention -> we would still believe nobody drowned. Therefore, we might believe the claim even if it were false -> fails sensitivity.

     So we must hedge or omit. We might say: "No drowning was reported in the local paper that summer." But the claim is "nobody drowned", which is stronger.

     We can only say: "According to the local paper, no drowning occurred that summer" or "No record of a drowning was found in the local paper". But the flat claim "nobody drowned" fails.

     Alternatively, if we have other sources (like coroner records) and we checked them and found nothing, then we might have a stronger case. But here we only have the newspaper.

     Therefore, we cannot assert flatly that nobody drowned.

  Now, the one-page version (just the steps and tick boxes):

  ---

  **Archive Claim Evaluation Procedure**

  For each claim, answer these questions in order. Document each step. If at any step the answer is "no", consider hedging or omitting.

  1. **Source Documentation**: 
     - Write a single sentence: "How did we get this claim?" 
     - *Rule*: Be specific. Include source (e.g., "from 1978 newspaper clipping") or inference (e.g., "inferred from X because Y"). 
     - If you can't write a specific sentence, hedge or omit.

  2. **Sensitivity Check**: 
     - "If this claim were false, would we still have ended up believing it given how we got it?" 
     - ☐ Yes (hedge or omit) 
     ☐ No (go to step 3)

  3. **Adherence Check**: 
     - "If this claim were true, would we have ended up believing it given how we got it?" 
     - ☐ Yes (go to step 4 or 5) 
     ☐ No (hedge or omit)

  4. **Inference Handling (if inferred)**:
     a) List the premises and the inference step.
     b) Verify each premise (must be flat or run this procedure on it).
     c) For the inference step: 
          - "If this inference were flawed, would we still have made it?" 
            ☐ Yes (hedge the claim) 
            ☐ No (go to step 4d)
          - "If the inference is good, would we have made it?" (Usually yes, but if no, hedge)
     d) If the inference is a chain of more than two steps, break down and verify each step.

  5. **Practical Check**: 
     - "Are there other reasons to hedge (e.g., controversy, harm, conflicting evidence)?" 
     - ☐ Yes (hedge or omit) 
     ☐ No (can state flatly)

  **Notes**:
  - If the claim is not inferred, skip step 4.
  - At any step, if you choose to hedge, use words like "reportedly", "according to", or rephrase to reflect the source (e.g., "the newspaper reported that...").
  - If omitting, note why in the log.

  ---

  This procedure should help standardize your decisions and provide clear reasons for hedging or omitting.
answer: |-
  Below is a practical, step-by-step procedure for evaluating claims in your archive. It's based on epistemological principles (like Nozick's tracking theory) but stripped down to a volunteer-friendly checklist. Each step has clear criteria, stopping points, and guidance for judgment calls. I'll first outline the full procedure, then apply it to your three examples, and end with a one-page version for your wall.

  ---

  ### **Claim Evaluation Procedure**  
  *Run this on one claim at a time. Time: ~10 min. Document answers in your log.*

  #### **Step 1: Write the "How We Know" Sentence**  
  - **Task**: In one sentence, describe how you arrived at the claim. Be specific.  
  - **Good enough**: Must include:  
    - **Source(s) used** (e.g., "1978 newspaper clipping," "oral history from resident X," "census record").  
    - **Inference method** (if applicable; e.g., "inferred from absence of records," "calculated from building permits").  
  - **Rule of thumb for detail**:  
    - If you can’t point to a tangible source or logical step, it’s not specific enough.  
    - **Fine-grained enough** if another volunteer could repeat your steps and get the same result.  
    - **Not fine-grained enough** if it uses vague terms like "we think," "everyone knows," or "it’s obvious."  
  - **Stopping point**:  
    - If you can’t write a specific sentence, **hedge or omit**.  
  - **Judgment call?** Yes. If the sentence feels flimsy (e.g., "common knowledge"), it’s a red flag. Err toward over-specificity.

  #### **Step 2: Check Source Reliability**  
  - **Task**: Could the source(s) named in Step 1 be wrong, even if they exist?  
  - **Ask**: "If this claim were **false**, would the source(s) still say it was true?"  
  - **Good enough answer**:  
    - **Passes** only if the source is:  
      - Primary (created at the time of the event), *or*  
      - Corroborated (≥2 independent sources), *or*  
      - Unlikely to be mistaken (e.g., official record, photo, direct witness).  
    - **Fails** if:  
      - Source is secondary (e.g., a 1978 article about 1908), hearsay, or ambiguous.  
      - Source has bias/incentive to distort (e.g., town gossip, promotional brochure).  
  - **Stopping point**:  
    - Fails? **Hedge** (e.g., "reportedly," "according to X").  
    - Passes? Go to Step 3.  
  - **Judgment call?** Yes. Weigh source context (e.g., a newspaper might exaggerate fires; a census is reliable for names/dates).

  #### **Step 3: Check Inference (If Applicable)**  
  - **Task**: Only run if the claim is *inferred* from other facts (e.g., "mill burned → not operating next year"). If it’s directly from a source, skip to Step 4.  
  - **Ask two questions**:  
    1. **Sensitivity of inference**: "If this inference step were **flawed**, would we still have made it?"  
       - *Good enough*: **Passes** only if the inference is unavoidable (e.g., "John died in 1900 → he didn’t vote in 1901"). **Fails** if it requires assumptions (e.g., "mill burned → not operating" assumes no quick rebuild).  
    2. **Premise sensitivity**: "If the **premise were false**, would we still believe it?" (Re-run Steps 1–2 on the premise.)  
  - **Rules for inference chains**:  
    - **One obvious step**: Allowed without backtracking if:  
      - It requires no external knowledge (e.g., "died in 1900 → dead in 1901").  
      - Premise already passed Steps 1–2.  
    - **Not obvious** (requires backtracking) if:  
      - It needs background knowledge (e.g., "mill burned → not operating" requires knowing rebuild times; if you had to look this up, treat it as a new claim and verify).  
      - It’s a chain of ≥2 steps (e.g., "A → B → C" – verify each step separately).  
      - It stitches multiple claims (e.g., "A + B → C" – verify A and B first).  
      - It infers absence (e.g., "no record → didn’t happen" – treat as highly sensitive; see Step 2).  
  - **Stopping point**:  
    - Either question fails? **Hedge** the claim.  
    - Both pass? Go to Step 4.  
  - **Judgment call?** Yes. "Obvious" depends on context (e.g., rebuild times vary by industry). When in doubt, treat as non-obvious.

  #### **Step 4: Final Veto**  
  - **Task**: Are there practical reasons to doubt this claim?  
  - **Ask**: "Could asserting this flatly cause harm, conflict with other evidence, or feel forced?"  
  - **Good enough**: **Passes** only if:  
    - No unresolved contradictions (e.g., another source says otherwise).  
    - Not community-sensitive (e.g., blames a family/business).  
  - **Stopping point**:  
    - Fails? **Hedge or omit**.  
    - Passes? **State flatly** (e.g., bare facts, no hedging).  
  - **Judgment call?** Yes. Prioritize community trust over completeness.

  ---

  ### **Applied to Your Examples**  
  *(Log-style notes; quotes are the claim being evaluated)*

  #### **Example 1: "The mill wasn’t operating in 1909."**  
  - **Step 1 (How we know)**: "Inferred from a 1978 newspaper clipping stating the mill burned in 1908, plus background knowledge that burned mills take >1 year to rebuild."  
    - *Specific enough?* Yes – sources and inference named.  
  - **Step 2 (Source reliability)**:  
    - Premise: "Mill burned in 1908" (from 1978 clipping).  
    - Ask: *If false, would the clipping still say it?* **Yes** – 70-year-later article could be mistaken.  
    - **Fails** → Premise must be hedged ("reportedly burned").  
  - **Step 3 (Inference)**:  
    - Premise is now hedged → inference inherits weakness.  
    - Sensitivity of inference: *If flawed, would we still make it?* **Yes** – rebuilds can be fast (e.g., temporary structures).  
    - **Fails both** → Hedge the claim.  
  - **Step 4 (Final veto)**: No issues.  
  - **Outcome**: **Hedge** (e.g., "The mill reportedly burned in 1908 and was likely not operating in 1909.").  
  - *Why*: Premise is weak + inference is assumptive.

  #### **Example 2: "The swimming hole was closed in 1974 because the plant upstream dumped solvent."**  
  - **Step 1 (How we know)**: "Common knowledge in town, reinforced by a plaque at the site."  
    - *Specific enough?* Barely – "common knowledge" is vague, but plaque is tangible.  
  - **Step 2 (Source reliability)**:  
    - Ask: *If false, would sources still say it?* **Yes** – common knowledge can be wrong (you confirmed: "if false, we’d still believe it"). Plaque may reflect folklore, not proof.  
    - **Fails** → Must hedge.  
  - **Step 3 (Inference)**: Not inferred (direct from sources). Skip.  
  - **Step 4 (Final veto)**: Potentially sensitive (blames a plant).  
  - **Outcome**: **Hedge** (e.g., "According to local accounts, the swimming hole was closed due to solvent dumping from the upstream plant.").  
  - *Why*: Unreliable sources + community sensitivity.

  #### **Example 3: "Nobody drowned in the river that summer."**  
  - **Step 1 (How we know)**: "Inferred from absence of drowning reports after reading every 1974 summer issue of the local paper."  
    - *Specific enough?* Yes – method is clear.  
  - **Step 2 (Source reliability)**:  
    - Premise: "No reports in the paper."  
    - Ask: *If false (someone drowned), would the paper still have no report?* **Yes** – drownings might go unreported (e.g., if victim was transient, or paper missed it).  
    - **Fails** → Premise is weak; absence ≠ proof.  
  - **Step 3 (Inference)**:  
    - Premise fails → inference inherits weakness.  
    - Sensitivity of inference: *If flawed, would we still make it?* **Yes** – we might assume "no report = didn’t happen" even if unreliable.  
    - **Fails both** → Hedge the claim.  
  - **Step 4 (Final veto)**: Could cause harm (false reassurance about safety).  
  - **Outcome**: **Hedge or rephrase** (e.g., "No drownings were reported in the local paper that summer.").  
  - *Why*: Absence of evidence isn’t evidence of absence.

  ---

  ### **One-Page Version for Your Wall**  
  **ARCHIVE CLAIM EVALUATION**  
  *Follow steps in order. Log answers. Time: ~10 min per claim.*

  | **Step** | **Question to Answer** | **Good Enough?** | **If NO:** |  
  |----------|------------------------|------------------|------------|  
  | **1** | **"How did we get this claim?"**<br>Write one sentence. Include sources/inference. | Specific: Source named + steps repeatable. | ➔ **Hedge or omit** |  
  | **2** | **"If this claim were FALSE, would our source(s) still say it’s true?"** | Source is primary, corroborated, or unbiased. | ➔ **Hedge** |  
  | **3** | ***(If inferred)***<br>a) "If this inference step were FLAWED, would we still make it?"<br>b) "If the PREMISE were false, would we believe it?" (Re-run Steps 1–2 on premise) | a) Inference is obvious/unavoidable.<br>b) Premise passes Steps 1–2. | ➔ **Hedge** |  
  | **4** | **"Could asserting this flatly cause harm or ignore contradictions?"** | No conflicts + not sensitive. | ➔ **Hedge or omit** |  
  | **PASSED ALL?** |  |  | **State flatly** |  

  #### **Rules & Tips**  
  - **Hedges**: Use words like "reportedly," "likely," or rephrase to reflect source ("The paper says...").  
  - **Inferences**:  
    - "One obvious step" = needs no research (e.g., "died in 1900 → dead in 1901").  
    - **Not obvious?** Verify background facts separately.  
  - **Judgment calls**: If stuck, default to hedge. Discuss with team.  
  - **Log**: One sentence per step + outcome reason (e.g., "Step 2: Source could be wrong").  

  ---

  This system prioritizes transparency and reduces gaming by forcing specificity in Step 1 and penalizing weak sources/inferences. It won’t eliminate debate (judgment calls remain), but it makes your reasoning consistent and defensible when challenged. Tape the one-pager up, and run your next 40 entries through it!
