prompt: |-
  I copy-edit grant proposals and review articles for a molecular biology institute, which means I read a lot of prose about DNA that is technically careful and yet, I've started to think, quietly doing something. The word "code" is the centre of it. As far as I can tell, the people using it are drawing on at least four different models without noticing that they are different: a cipher, where an arbitrary mapping is fixed by a convention and has to be broken; a computer program, which is executed by machinery that would do nothing without it; a legal code, which is a set of norms that can be complied with or violated; and a body of writing, which is read, punctuated, misspelled, annotated, and can contain junk. Each of these licences a different kind of inference. A cipher suggests someone wrote it and meant something. A program suggests the cell is a machine that would sit inert without instructions, and that finding the instructions is the whole job. A legal code suggests norms, and so talk of errors, violations, and correction. A text suggests that every stretch of sequence is meaningful until proven otherwise. My impression is that the tremendous aptness of the word in the narrow case — there really is an arbitrary, historically frozen mapping from triplets to amino acids — is what quietly pays for its use in the wide cases, where the arbitrariness and the fixing process are absent.

  I don't think this is any of the things I'd first reach for, and I'd like to know why it isn't, or which of them it really is a variant of. It isn't plain equivocation, as far as I can see, because the slide never happens inside a single argument: no one sentence, or even one paper, uses the term in two senses in the same inference. Each passage is individually clean; the borrowing is spread across a literature, and across years, and nobody seems to hold the bill. It isn't motte-and-bailey either, because there's no adversarial exchange and no one retreats to a defensible core when challenged — there is no challenge. It isn't quite a dead metaphor, since the term is still doing live work in generating hypotheses, and it isn't quite reification, since nobody quite asserts that the genome is literally a book. Two further details make me think it's a thing of its own. First, the borrowing is patched together from mutually incompatible sources: a text is read by an agent outside it, a program is executed by machinery inside the system, and a blueprint is scaled up rather than decoded — yet the inconsistency never registers, because the terms are used one at a time and never in the same sentence. Second, the aptness seems to attach only where it does: nobody calls the metabolic network a code or a language, even though enzymes map substrates to products just as specifically as the translation machinery maps codons to amino acids. So whatever makes the borrowing acceptable is not mere specificity of mapping.

  So: is there an established concept for this — not for "is DNA literally a code", which I know has its own large literature about signalling, convention, and proper function, and which I do not want to reopen — but for the migration of a term's credibility from the case where it fits to the cases where it doesn't, spread across a discourse rather than located in an argument? I have been calling it "authority transfer across senses" in my notes, and my colleague, less charitably, calls it the thesaurus effect; if either is already taken for something else, say so. What I actually want is the carving rather than the label. How does the phenomenon differ from each of the nearby ones I named, and from the general philosophy-of-science story about metaphors and analogies being constitutive rather than decorative? Does it need a sender, an interpreter, or a convention to get going, or would it work equally well with any mechanism that happens to be described in intentional language? Can it be benign — a term migrating into a new domain and carrying fruitful methods with it, as I suspect "selection" and "information" both did — and if so, what distinguishes the fruitful migrations from the merely misleading ones? And finally, give me a diagnostic: a test I could apply to a single paragraph of real molecular-biology prose to tell whether the code talk is doing explanatory work, licensing an inference that would fail without it, or only ornamenting one that stands on its own. If nothing established fits, coin and define a term, and give me two clear cases of it and two near-misses that are not instances.
reasoning: |-
  Okay, the user is a copy-editor for molecular biology grant proposals and review articles. They've noticed that the term "code" is used in various ways that imply different models—cipher, computer program, legal code, and text—each enabling different inferences. They want to know if there's a term for this phenomenon where the credibility of "code" in the narrow genetic code context transfers to broader, less fitting uses across the literature, without being detected because it's spread out.

  First, I recall concepts like conceptual metaphor or dead metaphor, but the user already ruled those out because the term is still active in generating hypotheses. Equivocation and motte-and-bailey also don't fit. Maybe it's related to polysemy, but that's more about multiple meanings coexisting without the transfer aspect.

  Then, "semantic drift" comes to mind, but that's usually historical change over time. Here, it's more about simultaneous borrowing. "Conceptual borrowing" might be closer, but it lacks the authority transfer. "Domain extension" could work but doesn't capture the credibility aspect.

  The user mentioned "authority transfer across senses" and "thesaurus effect." I need to check if existing terms cover this. "Frame extension" from sociology involves stretching a conceptual frame to new domains, which fits. The genetic code as a frame lends credibility to other uses. "Semantic contagion" is another possibility, emphasizing the spread of legitimacy.

  For differences: It's not equivocation because it's not within one argument. Not motte-and-bailey because no retreat. Not dead metaphor because it's active. Frame extension focuses on the cognitive framework, while semantic contagion highlights the spread.

  The user also asks about requirements: Does it need intentional language? Probably not, since any mechanism described intentionally could work, but the intentional aspect might facilitate it. Benign cases like "selection" in evolution show that migrations can be fruitful when they bring heuristic value and lead to testable hypotheses. Misleading ones occur when the analogy breaks, like implying agency where none exists.

  For a diagnostic test: The substitution test. Replace "code" with neutral terms and see if the inference still holds. Also, check for inferences unique to the code model, like intentionality or normativity.

  Finally, coining "semantic authority transfer" if no term fits. Examples: "Code" in genetics vs. metabolic networks not being called a code. Near-misses: "Program" in computing vs. "program" in genetics without the same transfer, or "language" in non-linguistic contexts that don't gain the same credibility.
answer: |-
  Based on your meticulous dissection, the phenomenon you describe isn't perfectly captured by standard concepts like equivocation, motte-and-bailey, dead metaphor, or simple reification. While related to conceptual metaphor theory, it has distinct characteristics requiring a more specific label. Here's the carving:

  1.  **The Established Concept (Closest Fit): Frame Extension (or Conceptual Frame Extension)**
      *   **Definition:** The process where a highly successful, validated, and cognitively salient conceptual *frame* (a structured set of assumptions, inferences, and expectations associated with a term/model) developed in one specific domain (the "source anchor") is implicitly *extended* to apply to adjacent, less clearly defined, or fundamentally different phenomena within the same broader field, leveraging the credibility and explanatory power of the original frame.
      *   **Why it fits:**
          *   **Source Anchor:** The genetic code (triplet to amino acid mapping) is the undeniable, empirically validated source frame. Its "tremendous aptness" provides the authority.
          *   **Extension:** The term "code" is then used in contexts invoking cipher, program, legal code, or text models. Each invocation implicitly borrows the *entire frame* associated with that secondary model *because* the core term "code" links them all back to the authoritative source anchor.
          *   **Discourse-Level:** The "slide" happens across the literature and over time, not within single arguments. Individual uses are "clean" because they activate *one* frame extension at a time (cipher *or* program *or* law *or* text), all parasitizing the core authority of the genetic code.
          *   **Inconsistency Tolerance:** The incompatibility between the extended frames (e.g., internal program execution vs. external text reading) is masked because they are never juxtaposed. The only consistent element is the link back to the source anchor ("code").
          *   **Specificity of Borrowing:** The metabolic network isn't called a "code" because it lacks a clear, discrete, arbitrary mapping convention like the genetic code. The authority transfer hinges on the *perceived similarity* to the source anchor's *defining features* (discreteness, mapping, convention/symbolism), not just specificity *per se*.
      *   **Differences from Nearby Concepts:**
          *   **Equivocation:** Occurs *within* a single argument, exploiting ambiguity to create a fallacy. Frame extension operates *across* arguments/discourse without immediate logical contradiction.
          *   **Motte-and-Bailey:** Requires adversarial context and strategic retreat. Frame extension is non-adversarial, passive, and cumulative within a cooperative discourse.
          *   **Dead Metaphor:** The term loses its metaphorical force and becomes literal. "Code" retains metaphorical force, actively generating inferences (program execution, legal violation, textual meaning).
          *   **Reification:** Treating an abstraction as concrete. While "code" language flirts with this, frame extension focuses on the *transfer of the conceptual framework's authority and inferential structure*.
          *   **General Conceptual Metaphor Theory:** Frame extension is a specific *mechanism* within this. It highlights how a *particular, highly successful instance* of a metaphor (the genetic code) becomes an anchor point enabling the extension of *related but distinct* metaphorical frames (cipher, program, law, text) throughout a field.

  2.  **A Coined Term (If Frame Extension feels insufficient): Semantic Authority Transfer via Anchored Polysemy (SATP)**
      *   **Definition:** The process whereby the epistemic authority and inferential potential of a polysemous term (a term with multiple related meanings) in its core, rigorously validated sense (the "semantic anchor") implicitly legitimizes the use of its other, logically distinct senses within a discourse, enabling inferences specific to those secondary senses without explicit justification, due to the shared lexical form and the anchoring sense's prestige. The transfer occurs diffusely across the discourse community over time.

  3.  **Requirements: Sender, Interpreter, Convention?**
      *   **Sender:** Not required in an intentional sense. The "sender" is the discourse community itself, unconsciously perpetuating productive but potentially misleading linguistic patterns.
      *   **Interpreter:** Essential. The interpreter (reader/scientist) must recognize the core "anchor" meaning and its authority, and be primed to accept extensions via shared terminology. Background knowledge is key.
      *   **Convention:** Absolutely central. This phenomenon *is* a linguistic and cognitive convention within molecular biology. The shared understanding that "DNA is a code" (in the anchor sense) establishes the convention permitting the other "code" senses to flourish without scrutiny. Intentional language provides powerful, ready-made frames (cipher=decipherer, program=executor, law=judge, text=reader), making the extensions cognitively easy and inferentially rich. A non-intentional mechanism *could* be described similarly (e.g., "recognition sequence"), but the richness of inference and the ease of frame extension would likely be much weaker without the intentional baggage. The intentional frames are highly "sticky" for inference generation.

  4.  **Benign vs. Misleading Migrations:**
      *   **Benign (e.g., "Selection", "Information"):**
          *   **Heuristic Fertility:** Generate genuinely novel, testable hypotheses inaccessible without the metaphor/frame (e.g., selfish genes, information theory applications in signaling).
          *   **Domain Congruence:** Key features of the source domain have strong analogues in the target domain *beyond the initial point of contact* (e.g., variation, inheritance, differential survival -> natural selection; signal, noise, channel capacity -> genetic information).
          *   **Explicit Awareness & Refinement:** The community recognizes the metaphor *as* metaphor, debates its limits, refines its application, and develops domain-specific formalisms where needed.
          *   **No Essential Misattribution:** Avoids implying essential properties that don't exist (like a conscious programmer or reader for DNA).
      *   **Misleading (e.g., "Code" extensions, unchecked "Blueprint"):**
          *   **Inferential Overreach:** Licenses inferences unsupported by evidence and potentially false (e.g., all "junk" must be functional text; mutations are "violations"; the cell is inert without the program).
          *   **Domain Incongruence:** Key features of the *extended frame* clash with biological reality (e.g., no centralized executor for a program; no legislator/judge for a legal code; much DNA isn't a readable message).
          *   **Implicit Slippage:** The extension happens unconsciously, the frames are conflated, and the limitations of the analogy are not actively managed.
          *   **Essential Misattribution:** Strongly implies agency, design, or normativity not present in the core biological mechanisms.

  5.  **Diagnostic Test: The Frame Substitution & Inference Test**
      Apply this to a paragraph using "code" language:
      1.  **Identify the Inference:** What specific claim or hypothesis is being made or implied *because* of the "code" language? (e.g., "This non-coding region likely has a regulatory function, as it's part of the genetic code"; "These mutations disrupt the code, causing disease"; "The cell executes the developmental program encoded in the DNA").
      2.  **Substitute Neutrally:** Replace "code," "program," "read," "execute," "violation," "meaning," "junk," etc., with strictly mechanistic, non-intentional, non-semantic language describing only physical interactions. (e.g., "non-coding region" -> "non-protein-coding region"; "disrupt the code" -> "alter the nucleotide sequence leading to an altered amino acid sequence"; "executes the program" -> "undergoes a series of biochemical changes initiated by specific DNA sequence interactions").
      3.  **Analyze:**
          *   **Does the core factual claim survive?** (e.g., the region *is* non-protein-coding; the mutation *does* change the amino acid; the biochemical changes *do* happen). If yes, the "code" language is likely ornamental.
          *   **Does the *specific inference* licensed by the *particular frame* (cipher/text/program/law) survive the substitution?**
              *   If the inference *depends* on the frame (e.g., "therefore it must have *some* function" [text frame]; "therefore it's a *dysfunctional* state" [legal frame]; "therefore the machinery is *inert* without it" [program frame]) and **vanishes or becomes much harder to justify** with neutral language, then the "code" talk **is doing essential explanatory work** (and potentially misleading work if the inference is unsupported).
              *   If the inference can be robustly defended using only the neutral, mechanistic language and established biological principles, the "code" talk is ornamental or pedagogical.

  **Clear Cases vs. Near-Misses:**

  *   **Clear Case 1 (Frame Extension/SATP):** A grant proposal argues that a conserved non-coding region "must contain critical regulatory information within the genomic code, potentially misspelled in disease," implying function and correct/incorrect states (Text + Legal frames extending from Genetic Code anchor). Substitution removes the "must" and the normative "misspelled" inference.
  *   **Clear Case 2 (Frame Extension/SATP):** A review states, "The Hox gene cluster contains the developmental program that instructs body plan formation," implying a pre-defined, executed set of commands (Program frame). Substitution removes the implication of centralized instruction and execution.
  *   **Near-Miss 1 (Not Instance - Ornamental):** "The genetic code, the mapping from codons to amino acids, is nearly universal." Uses "code" strictly in its anchored sense (triplet mapping). No frame extension occurs.
  *   **Near-Miss 2 (Not Instance - Different Metaphor):** "Transcription factors act as molecular switches, turning genes on and off." Uses a "switch" metaphor. While metaphorical, this doesn't leverage the *authority* of the validated "genetic code" concept. It's a standalone analogy without the diffuse authority transfer across senses described.

  **In summary:** You've identified a powerful discursive phenomenon in molecular biology – **Frame Extension** (or SATP) – where the empirically grounded, authoritative concept of the "genetic code" tacitly legitimizes the use of distinct, often incompatible, conceptual frames (cipher, program, law, text) whenever the word "code" is invoked elsewhere. This transfer happens diffusely across the literature, enabled by polysemy and convention, and licenses specific, sometimes unsupported, inferences. The **Diagnostic Test** reveals when this language is doing substantive (and potentially problematic) explanatory work. The distinction between benign and misleading migrations hinges on heuristic fertility, domain congruence, community awareness, and avoiding essential misattributions.
