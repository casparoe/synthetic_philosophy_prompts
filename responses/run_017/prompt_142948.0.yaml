answer: |-
  ### Final Exam Question: Van Fraassen's Reflection Principle

  **Question:**  
  Consider the following modified Sleeping Beauty scenario:  
  - A fair coin is tossed. If heads (\(H\)), an agent is awakened once (on Monday). If tails (\(T\)), she is awakened three times (Monday, Tuesday, Wednesday).  
  - Between awakenings, she is given a drug that erases her memory of previous awakenings. At each awakening, she is told the entire protocol but not told which day it is or how many times she has been awakened.  
  - After the experiment ends (Wednesday night), she is told the outcome of the coin.  
  - A day later (Thursday), a second drug erases her memory of the coin-outcome announcement. At this point, she knows the protocol is complete but not the coin outcome.  

  We define four stages:  
  - **Stage 1:** Before the coin toss.  
  - **Stage 2:** During an awakening (e.g., she is awake but does not know if it is the first, second, or third awakening).  
  - **Stage 3:** Immediately after being told the coin outcome (post-experiment).  
  - **Stage 4:** After the memory erasure on Thursday (she knows the experiment is over but not the outcome).  

  Let \( \textit{Cr}_i(\cdot) \) denote the agent’s credence function at stage \( i \), and let \( A \) be the proposition "the coin landed heads."  

  (a) **State van Fraassen’s Reflection principle** precisely, including all necessary restrictions. (5 points)  
  (b) **Prove** that if an agent is certain her future total evidence will come from a partition refining her current evidence and that she will update by conditionalization, then Reflection holds for the transition to her future credence. (5 points)  
  (c) For the **Stage 1 → Stage 2** transition:  
     (i) Compute \( \textit{Cr}_1(A) \) and \( \textit{Cr}_2(A) \) under two candidate approaches:  
          - *Approach X*: Update by conditionalizing on the centered proposition "I am awake now."  
          - *Approach Y*: Spread credence evenly over possible awakenings (i.e., weight by number of awakenings).  
     (ii) Discuss whether Reflection constrains \( \textit{Cr}_1(A) \) and \( \textit{Cr}_2(A) \). If so, how? If not, why not?  
     *(Hint: At Stage 1, the agent is certain she will adopt either Approach X or Y at Stage 2.)* (5 points)  
  (d) For the **Stage 3 → Stage 4** transition:  
     (i) Compute \( \textit{Cr}_3(A) \) and \( \textit{Cr}_4(A) \).  
     (ii) Discuss whether Reflection holds. If it fails, explain why this failure is more problematic than in (c). (5 points)  
  (e) **Diagnose the proviso dilemma**:  
     (i) What restriction (e.g., about relative information) might rescue Reflection?  
     (ii) Is this restriction principled? Compare the Stage 1 → Stage 2 (centered evidence) and Stage 3 → Stage 4 (forgetting) transitions to justify your answer. (5 points)  

  **Time Budget & Word Limit:** This question is part of a 72-hour take-home exam. Your response to this question must not exceed 1,000 words.  

  ---

  ### Model Answer (Approx. 700 words)  

  **(a) Reflection Principle Statement**  
  Van Fraassen’s Reflection principle requires that an agent’s current credence in \( A \), conditional on her future credence in \( A \) being \( x \), must equal \( x \). Formally:  
  \[
  \textit{Cr}_{\text{now}}(A \mid \textit{Cr}_{\text{future}}(A) = x) = x,
  \]  
  provided \( \textit{Cr}_{\text{now}}(\textit{Cr}_{\text{future}}(A) = x) > 0 \). The restriction ensures the conditional is well-defined.  

  **(b) Proof Under Pure Learning**  
  Assume the agent is certain her future evidence will come from a partition \( \{E_i\} \) refining her current evidence and that she will update by conditionalization: \( \textit{Cr}_{\text{future}}(\cdot) = \textit{Cr}_{\text{now}}(\cdot \mid E_i) \) if \( E_i \) is learned. Let \( U_x = \{ \text{worlds where } \textit{Cr}_{\text{future}}(A) = x \} \). By the updating rule, \( U_x \) is the union of all \( E_i \) such that \( \textit{Cr}_{\text{now}}(A \mid E_i) = x \). Then:  
  \[
  \textit{Cr}_{\text{now}}(A \mid U_x) = \frac{\textit{Cr}_{\text{now}}(A \cap U_x)}{\textit{Cr}_{\text{now}}(U_x)} = \frac{\sum_{E_i \subseteq U_x} \textit{Cr}_{\text{now}}(A \mid E_i) \textit{Cr}_{\text{now}}(E_i)}{\textit{Cr}_{\text{now}}(U_x)} = \frac{x \cdot \textit{Cr}_{\text{now}}(U_x)}{\textit{Cr}_{\text{now}}(U_x)} = x.
  \]  
  Thus, Reflection holds.  

  **Corollary**: If the agent is certain \( \textit{Cr}_{\text{future}}(A) = x \) (a constant), then \( \textit{Cr}_{\text{now}}(A) = x \). The weaker "no-drift" principle (\( \textit{Cr}_{\text{now}}(A) = \mathbb{E}[\textit{Cr}_{\text{future}}(A)] \)) collapses to this when \( \textit{Cr}_{\text{future}}(A) \) is certain, as \( \mathbb{E}[\textit{Cr}_{\text{future}}(A)] = x \). Averaging fails to generalize because it does not require credence to match a specific future value when uncertainty exists.  

  **(c) Stage 1 → Stage 2 Transition**  
  (i)  
  - \( \textit{Cr}_1(A) = 0.5 \) (fair coin).  
  - *Approach X* (conditionalization on "I am awake now"): At Stage 1, the agent knows she will be awake at least once. Conditionalizing on this (non-centered) proposition does not shift \( \textit{Cr}_1(A) \), so \( \textit{Cr}_2(A) = 0.5 \).  
  - *Approach Y* (spread evenly): There are 4 possible awakenings (1 if \( H \), 3 if \( T \)), each equally likely. Thus, \( \textit{Cr}_2(A) = \frac{1}{1+3} = 0.25 \).  

  (ii) At Stage 1, the agent is certain she will adopt either X or Y at Stage 2.  
  - If she adopts X, \( \textit{Cr}_{\text{future}}(A) = 0.5 \) with certainty. Reflection requires \( \textit{Cr}_1(A \mid \textit{Cr}_2(A) = 0.5) = 0.5 \), which holds since \( \textit{Cr}_1(A) = 0.5 \).  
  - If she adopts Y, \( \textit{Cr}_{\text{future}}(A) = 0.25 \) with certainty. Reflection requires \( \textit{Cr}_1(A) = 0.25 \), but \( \textit{Cr}_1(A) = 0.5 \). Thus, Y violates Reflection.  

  **(d) Stage 3 → Stage 4 Transition**  
  (i)  
  - \( \textit{Cr}_3(A) \): After learning the outcome, \( \textit{Cr}_3(A) = 1 \) if \( H \), or \( 0 \) if \( T \).  
  - \( \textit{Cr}_4(A) \): Post-memory-erasure, she knows the experiment is over but not the outcome. Her evidence is identical to Stage 1 but without the upcoming awakenings. Thus, \( \textit{Cr}_4(A) = 0.5 \).  

  (ii) At Stage 3, the agent is certain \( \textit{Cr}_4(A) = 0.5 \) (since she knows she will forget). Reflection requires:  
  \[
  \textit{Cr}_3(A \mid \textit{Cr}_4(A) = 0.5) = 0.5.
  \]  
  But \( \textit{Cr}_3(A) \) is either 1 or 0, so \( \textit{Cr}_3(A \mid \textit{Cr}_4(A) = 0.5) = \textit{Cr}_3(A) \neq 0.5 \). Reflection fails. This failure is more problematic than in (c) because (c) involved uncertainty about centered evidence, while here the agent is *certain* about her future credence and updating (forgetting), yet Reflection forces an impossible credence (0.5) when she knows the truth (1 or 0).  

  **(e) Proviso Dilemma**  
  (i) Reflection should be restricted to cases where the agent takes her future self to be *at least as well informed* as her present self.  
  (ii) This restriction is principled:  
  - In **Stage 3 → Stage 4**, the future self is strictly *less* informed (she forgets the coin outcome), violating the restriction. The failure is expected and excusable.  
  - In **Stage 1 → Stage 2**, Approach X satisfies Reflection because the future self gains the centered evidence "I am awake now" but loses no temporal information (Stage 1 had none). Approach Y violates Reflection but is contentious precisely because it treats centered evidence as reducing information about \( A \)—a point under debate in self-locating epistemology.  
  The restriction is not ad hoc: It aligns with Reflection’s motivation—deferring only to better-informed future selves—and resolves the Stage 3→4 failure without biasing the Stage 1→2 debate.  

  ---

  ### Marking Scheme (25 marks total)  

  #### (a) Reflection Statement [5 marks]  
  - **5/5**: Precise statement (conditional credence form + \( \textit{Cr}_{\text{now}}(\textit{Cr}_{\text{future}}(A)=x) > 0 \)).  
  - **3/5**: Missing/incorrect restriction.  
  - **1/5**: Vague or non-conditional statement.  
  - *Common mistake*: Omitting the positivity restriction.  

  #### (b) Proof Under Pure Learning [5 marks]  
  - **5/5**: Clear partition setup, definition of \( U_x \), derivation of \( \textit{Cr}_{\text{now}}(A \mid U_x) = x \).  
  - **3/5**: Correct idea but vague on why \( U_x \) is a union of partition cells.  
  - **1/5**: No partition or conditionalization structure.  
  - *Common mistake*: Assuming \( \textit{Cr}_{\text{future}}(A) \) is constant.  

  #### (c) Stage 1 → Stage 2 [5 marks]  
  - **(i) 2 marks**: Correct \( \textit{Cr}_1(A) = 0.5 \), Approach X (\( \textit{Cr}_2(A) = 0.5 \)), Approach Y (\( \textit{Cr}_2(A) = 0.25 \)).  
  - **(ii) 3 marks**: Reflection holds for X (future credence certain at 0.5) but fails for Y (requires 0.25 ≠ 0.5); notes certainty about updating policy.  
  - *Common mistake*: Ignoring Approach Y or not using certainty about future credence.  

  #### (d) Stage 3 → Stage 4 [5 marks]  
  - **(i) 2 marks**: Correct \( \textit{Cr}_3(A) = 0 \) or \( 1 \), \( \textit{Cr}_4(A) = 0.5 \).  
  - **(ii) 3 marks**: Reflection fails (credence must be 0.5 but is 0/1); explains why failure is worse than in (c) (certainty about future credence vs. centered uncertainty).  
  - *Common mistake*: Not computing \( \textit{Cr}_3(A) \) conditional on future credence.  

  #### (e) Proviso Dilemma [5 marks]  
  - **(i) 2 marks**: Restriction: Future self at least as well informed.  
  - **(ii) 3 marks**: Principled because: Stage 3→4 violates restriction (less informed); Stage 1→2 (Approach X) satisfies it (gains centered evidence). Neutral on centered-evidence debate.  
  - *Common mistake*: Claiming the restriction is ad hoc without comparing transitions.  

  ---

  ### Grading Standards  
  - **A (21–25 marks)**: Hits all must-hit moves: precise Reflection statement, correct proof, both approaches in (c), correct failure diagnosis in (d), principled restriction in (e). Clear, concise, and insightful.  
  - **B (16–20 marks)**: Minor errors (e.g., incomplete proof, omitting Approach Y in (c), weak justification in (e)) but shows understanding of Reflection and the case.  
  - **Failing (<10 marks)**: Only recites definitions/motivations; no computation; confuses stages; misses the corollary or proviso dilemma.
