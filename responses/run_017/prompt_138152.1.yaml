  They provide two clear examples: First, with a population of ten high-welfare people, adding an eleventh person with positive but lower welfare isn't seen as an improvement, but removing that same eleventh person from the eleven-person scenario isn't seen as an improvement either. This creates an asymmetry. Second, they note that even with merely possible populations, some theories seem to depend on the starting point for evaluation rather than providing a consistent ordering.

  The user wants me to identify this phenomenon, distinguish it from related concepts, clarify its boundaries, and determine if it has a name. They specifically want me to avoid relying on citations and focus on the structural features. They also want me to explain whether this is a necessary feature of theories that avoid the repugnant conclusion.

  I need to structure my response as outlined: first restate the phenomenon clearly, then analyze nearest concepts and why they fall short, define the invariant core with boundary cases, coin a name if needed, and finally discuss whether this is a defect and if it's avoidable.

  For the phenomenon itself, I think this is about the dependence of normative judgments on the framing baseline. The key is that the theory treats gains and losses asymmetrically even when the underlying states are identical. This isn't about different people existing but about how the baseline frames the evaluation.

  Looking at established concepts: Person-affecting views focus on affecting existing people, but this phenomenon persists even when all people exist in both options. The creation asymmetry is often a substantive claim about duties, whereas this is structural. State-dependence in welfare economics is similar but typically about resources not existence. Incompleteness or intransitivity might explain non-comparability but not the directional asymmetry. Context-dependence involves menu effects, which isn't quite the same as baseline framing.

  The invariant core seems to be asymmetric baseline sensitivity where adding vs. removing the same population change is evaluated differently. Clear cases would involve identical population sets being evaluated differently based on baseline framing. Non-cases would be when evaluations are symmetric regardless of baseline.

  Since this doesn't have a standard name, I could coin "Baseline-Relative Asymmetric Evaluability" (BRAE). This captures how the baseline affects whether an addition or subtraction is evaluable as an improvement.

  This is likely a defect because it violates basic consistency requirements for rational choice. It's probably not strictly necessary for avoiding the repugnant conclusion, as some theories like critical-level utilitarianism might avoid both, but the user's observation suggests many common approaches do exhibit this feature. Whether a theory can avoid the repugnant conclusion without BRAE depends on whether it can impose a consistent ordering while satisfying other desiderata like avoiding the repugnant conclusion.

  I'll make sure to follow the user's requested structure precisely, avoid jargon where possible, and focus on the structural aspects they're interested in, rather than diving into substantive ethical debates.
answer: |-
  ### 1. **What I think you are describing**  
  You are describing a **baseline-dependent asymmetry in normative evaluability**: the moral status of adding or removing a person depends on which population state is treated as the fixed reference point ("baseline"), even when the compared populations are identical in composition and welfare levels. In your first example, adding person #11 to the baseline of 10 is not an improvement, but removing #11 from the baseline of 11 is also not an improvement. The two scenarios are symmetric (state A: 10 people; state B: 11 people with #11 at lower welfare), yet the theory evaluates "A → B" as neutral or bad and "B → A" as neutral or bad, refusing to rank them consistently. This violates the principle that identical option-pairs should have invariant rankings regardless of baseline framing. Your description conflates two nuances: (i) whether the asymmetry arises from the *direction of change* (addition/removal) or the *designation of the actual state* (which state is "current"), and (ii) whether it applies only to existence changes or any welfare alteration. Your examples focus on existence changes, but the core is baseline relativity in evaluability.

  ### 2. **Nearest established concepts, and where each falls short**  
  **a) Person-affecting restrictions (e.g., "Only existing people matter")**  
     *What it says*: Moral evaluations only consider impacts on people who exist in all compared options. Adding a person cannot be good/bad since they don't exist in the baseline.  
     *Fall short*: Your first example involves the *same* ten people in both states, so person-affecting views *should* rank the addition/removal symmetrically (e.g., both neutral if #11's welfare doesn't affect others). Yet you observe asymmetry: adding isn't good, removing isn't good. This goes beyond person-affectingness by introducing directionality.  

  **b) Creation asymmetry (e.g., "No duty to create happy people, but duty not to create unhappy ones")**  
     *What it says*: A substantive ethical claim: creating a life worth living is never obligatory (merely permissible), but creating a miserable life is forbidden.  
     *Fall short*: You note this is a *substantive* claim, but your concern is *structural*: the same pair (A and B) is unranked in one baseline framing but ranked (or rankable) in another. Creation asymmetry explains *why* adding #11 isn't an improvement, but doesn't explain why removing #11 *also* isn't an improvement when starting from 11 people. The structural flaw is the theory's failure to assign a fixed betterness relation to (A, B).  

  **c) State-dependence (in welfare economics)**  
     *What it says*: Preferences or utilities depend on the current state (e.g., losing $100 hurts more than gaining $100 pleases).  
     *Fall short*: State-dependence typically assumes fixed populations and explains loss aversion via psychology. Your cases involve *changes in who exists*, making welfare comparisons across states metaphysically contested. State-dependence doesn't inherently forbid ranking A vs. B; it merely allows state-specific valuations. But your phenomenon refuses *any* ranking for the pair when framed one way, while accepting neutrality when framed another—a stronger inconsistency.  

  **d) Incompleteness or intransitivity**  
     *What it says*: Some option-pairs are incomparable (no betterness relation), or transitivity fails (A > B and B > C but not A > C).  
     *Fall short*: Incompleteness could explain why A and B aren't ranked, but not why the *same pair* is evaluable from one baseline (e.g., "adding #11 is neutral") but incomparable from the other. Intransitivity doesn't apply here—no three-option cycle is described. The issue is *framing-induced incomparability* for identical pairs.  

  **e) Context-dependence / menu-dependence**  
     *What it says*: The ranking of A vs. B depends on other available options (the "menu").  
     *Fall short*: Your cases hold the menu fixed (only two options: baseline and alternative). The dependence is solely on *which option is labeled baseline*, not on broader context. This is pure baseline relativity, not menu effects.  

  ### 3. **The carving**  
  **Invariant core**: A moral theory exhibits the phenomenon if, for two population states A and B differing only in the existence of one person (with positive welfare in B), it satisfies:  
  - When A is baseline, changing to B is *not better* than staying at A.  
  - When B is baseline, changing to A is *not better* than staying at B.  
  Thus, neither direction is affirmatively ranked as an improvement, violating symmetry.  

  **Boundary cases**:  
  - **Clear instance**: Baseline = 10 high-welfare people. Adding an 11th (lower but positive welfare) is not an improvement. Baseline = 11 people (same welfare levels). Removing the 11th is not an improvement.  
  - **Clear non-instance**: A theory that always ranks the 11-person state as better than the 10-person state (if the 11th has positive welfare), regardless of baseline.  
  - **Disputed case**: **Adding a person with very high welfare to a low-welfare population**.  
    - *Ruled as instance*: If the theory says adding them isn't better from the low-welfare baseline, and removing them isn't better from the high-welfare baseline (e.g., due to averaging concerns).  
    - *Ruled as non-instance*: If the theory always approves adding high-welfare people (e.g., total utilitarianism), or if welfare levels break symmetry.  

  ### 4. **If there is no name, coin one**  
  **Label**: **Baseline-Relative Asymmetric Evaluability (BRAE)**  
  **Definition**: A theory has BRAE if, for at least one pair of population states differing only in the existence of one person with positive welfare in the state where they exist, the theory (i) evaluates moving from state X to state Y as not better than staying at X, and (ii) evaluates moving from Y to X as not better than staying at Y, where X and Y are the two states.  
  **Test for new theories**:  
  1. Identify two states: A (population P) and B (P + one additional person with positive welfare).  
  2. Check theory’s verdict when A is baseline: Is B > A? (If no, condition (i) holds).  
  3. Check when B is baseline: Is A > B? (If no, condition (ii) holds).  
  4. BRAE is present if both answers are "no" for the same pair (A, B).  

  ### 5. **Feature or defect, and whether it is avoidable**  
  **Feature or defect?** Likely a defect. It violates:  
  - *Basic rational choice*: Acyclic rankings require that if B isn’t better than A from A-baseline, then A should be better than B from B-baseline (if comparable).  
  - *Pareto principles*: Adding a person with positive welfare without harming others intuitively should be non-worsening.  
  - *Policy applicability*: Regulatory analysis assumes baseline-invariance; BRAE makes rankings arbitrary.  

  **Unavoidable?** No, but common in repugnant-conclusion-avoiding theories. Many such theories (e.g., average utilitarianism, some person-affecting views) embed BRAE to block "additive" arguments for repugnant populations. However, **critical-level utilitarianism** (CLU) avoids both: adding a person above a fixed "critical" welfare level is good, below is bad, symmetrically. Yet CLU faces other issues (e.g., sadistic conclusion).  

  **What would change my mind**:  
  - If a theory avoids the repugnant conclusion *and* satisfies strong Pareto (adding a positive-welfare person is always better) without contradiction, BRAE would be avoidable.  
  - If BRAE were shown necessary for respecting intuitions (e.g., "no obligation to create"), it might be defensible—but this confuses substantive asymmetry with structural inconsistency.  

  **Conclusion**: BRAE is a structural flaw arising from baseline-relativity in population ethics. It is not strictly necessary to avoid the repugnant conclusion but is a common byproduct of doing so via ad hoc restrictions. A robust solution would require a complete, transitive, and baseline-invariant population axiology—which remains elusive.
