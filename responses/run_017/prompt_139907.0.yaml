prompt: |-
  I am a novelist, and for the past two years I have been at work on a book whose narrator is a retired biographer — a man who has spent his professional life writing the lives of other people and who is asked, late in the book, to write his own. That has forced me to read biography as a craft rather than as a reader, and, on a friend's suggestion, to spend the evenings with a secondhand single-volume selection from Plutarch's *Lives*. It has no apparatus and no notes, and at my desk I have no way of chasing anything up, so I am after the shape of the thought rather than anybody's scholarship, and I would rather you argued the case than pointed me to a literature. What stopped me was Plutarch's programme near the opening of the *Life of Alexander*: "For it is not Histories that I am writing, but Lives; and in the most illustrious deeds there is not always a manifestation of virtue or vice, nay, a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall, or the greatest armaments, or sieges of cities." He goes on to compare himself to a painter who takes a likeness from the face and the expression of the eyes and makes little account of the rest of the body. I find that I believe it and cannot say what it commits me to, because when I hold it against actual biographical material my verdicts refuse to line up.

  So here are the verdicts, as nearly as I can report them honestly. (1) Alexander cutting the Gordian knot instructs me about him, though it is a deliberate public act, staged for an audience. (2) Caesar weeping before a statue of Alexander, at an age by which Alexander had already conquered, instructs me greatly — and yet I discount it, because the story is too neatly shaped to have survived unshaped. (3) Alexander's famous restraint toward the captured women of Darius's household instructs me much less, although it is a better act, because it is precisely the story a court would circulate. (4) A single reported rudeness to a servant damns a subject almost irreversibly; a hundred reported courtesies do not begin to exculpate him. In an early draft I had a man pause to return a dropped glove to a child on his way to commit a murder, and readers took it as evidence of the good in him; I cut it as counterfeit. I kept a scene in which the same man wastes four minutes deciding whether to tell a trivial lie, and I think it is the truest thing in the book. (5) A great public achievement tells me almost nothing; a great public crime, or a great collapse, tells me a great deal. (6) Last words and deathbed declarations I discount almost entirely, except when they are flat and unflattering — an instruction about an estate moves me more than a benediction. (7) Where the biographer writes "some say," the flattering anecdote loses all its force for me and the discreditable one keeps most of its own, which I know is inconsistent with my usual suspicion of hearsay. (8) A childhood anecdote placed so as to prefigure an entire career — the boy who tames the horse, the man who rules the world — strikes me as a trick; the same anecdote, if the subject himself is reported to have remembered it, strikes me as evidence, though I cannot say why. (9) A subject's own polished memoir tells me less than others' anecdotes about him; notes written for no reader at all tell me more than either; and yet a person's deliberate, decades-long, self-conscious labour at a virtue he finds hard — a ledger kept of one's own faults — tells me a very great deal, even though it is composed from end to end.

  The rule I have been working with is something like: a detail is morally instructive in proportion to the subject's failure of authorship over it — the revealing thing is the thing he did not compose. It handles (6), the glove, and part of (9); it says nothing at all about the asymmetry in (4) or the one in (5); and it is flatly contradicted by (1) and by the last clause of (9). What I want is a principle, or a standing pair of principles, that does better: stated precisely enough to be applied, with each clause tied to the case that motivates it, an honest account of which of my verdicts it cannot save and which it overturns, and verdicts on three cases I have not been able to settle — a politician's leaked private remark against forty years of his public voting record; the blameless life that furnishes a biographer with no anecdotes at all, where I cannot tell whether the method is simply blind or whether the absence is itself the verdict; and a life written by its subject's enemy. Tell me also whether Plutarch's painter helps here or quietly misleads me. Please keep the whole answer under six hundred words.
reasoning: |-
  Hmm, the user is a novelist grappling with Plutarch's biographical method and their own contradictory instincts about what reveals character. They've listed 9 specific verdicts from their reading experience and writing practice, and want a unifying principle that explains these intuitions - particularly the asymmetry where negative details seem more revealing than positive ones.

  Their core insight about "failure of authorship" is brilliant but incomplete. It explains involuntary details (deathbed words, slips) but not deliberate acts like Alexander's Gordian Knot moment. The key might be recognizing that authorship itself reveals character when it's effortful or costly - like those ledgers of faults in point 9. But for public acts, we need another axis: the cost/benefit ratio. 

  The three unresolved cases are telling. That leaked private remark versus voting record? The remark wins because it's authorship without audience. The blameless life with no anecdotes? That absence *is* the verdict - a life without friction leaves no marks. The enemy biography? Ironically trustworthy when it reports unflattering details the enemy wouldn't invent.

  Plutarch's painter analogy is both helpful and dangerous. Helpful for focusing on micro-expressions over grand events. Dangerous because it suggests character is passively revealed rather than actively constructed through struggle.

  For the principle: character reveals itself in gaps between intention and outcome. The involuntary slip (point 4's rudeness). The effortful self-composition (point 9's ledger). The act that costs more than its benefit (Caesar's tears). 

  The asymmetry in point 4 and 5 makes sense if we consider that virtue often aligns with self-interest while vice usually doesn't. A politician's courtesy advances their career; cruelty doesn't. Hence the latter feels more authentic.

  Final formulation: Revelation occurs where control fails (slips, deathbed) *or* where control is costly (ledgers, Gordian Knot). What's freely given (polished memoirs) lies; what leaks out or is bought at price tells truth.
answer: |-
  Here is a principle and its corollary, designed to address your verdicts and unresolved cases:

  **Principle 1 (Revelation through Resistance):** *The moral significance of a biographical detail increases with the subject's inability to control its interpretation or the personal cost incurred in its performance.*

  *   **Explains:** (1) Gordian Knot: A deliberate act, but its *interpretation* (bold ingenuity vs. frustration) escapes Alexander's control, revealing ambition. (2) Caesar's Tears: Survives *because* its cost (vulnerability) resists neat shaping; improbability makes it resonant. (3) Darius's Women: Discounted because the *interpretation* (magnanimity) is entirely court-controlled; no resistance. (6) Deathbed Declarations: Discounted as composed; unflattering ones show resistance (involuntary honesty). (7) "Some say": Flattering loses force (easily invented); discreditable retains force (high cost/resistance to invention). (8) Prefiguring Anecdote: A trick if imposed (no subject cost); evidence if remembered (costly personal integration).
  *   **Handles Asymmetry (4 & 5):** Rudeness/crime often involuntary (loss of control) or costly (social/personal risk), hence revealing. Courtesies/great achievements are often low-cost, self-interested, and easily authored for effect. Your glove scene was discounted as *low-cost* virtue; the lie debate was kept because indecision reveals costly internal *struggle* (resistance within himself).
  *   **Handles (9):** Polished memoir (low cost, full control) = low value. Private notes (no control over reader) = high value. Decades-long labor at a virtue (high *cost*, constant struggle against nature) = highest value (*resistance* defines the character).

  **Corollary 1 (Absence as Evidence):** *The complete absence of revealing details, despite search, is itself evidence of a character defined by consistent control, prudence, or an absence of significant internal conflict – a verdict of opacity or profound conventionality.*

  *   **Explains the Blameless Life:** The absence *is* the verdict. If diligent search finds no slips, no costly virtues, no internal struggles reported (even by enemies), it suggests a life lived within strict bounds, revealing caution or limitation.

  **Unresolved Cases:**

  1.  **Leaked Remark vs. Voting Record:** The leaked remark wins (per Principle 1). It was *not* composed for public consumption; its interpretation escaped control. The voting record is public performance, shaped by constituency, party, calculation (low control cost/resistance).
  2.  **Life by an Enemy:** Trust details where the enemy's *own interest resists* reporting them. An enemy gains nothing (and loses credibility) inventing a subject's inconvenient virtue or trivial kindness. They *lose* by reporting acts that accidentally humanize or show strength resisting *their* narrative. Trust high-cost virtues or small failures the enemy wouldn't bother to fabricate.

  **Plutarch's Painter:** It helps by prioritizing the *expressive* detail (the face/jest) over the vast canvas (the battle). But it **misleads** by implying character is passively *revealed* like a static expression. Your principle emphasizes character is actively *forged* in moments of struggle, cost, and *resistance* – the effort to maintain the expression, the slip that betrays it. Plutarch finds the look; you must find the *fight* (or lack thereof) behind it.

  **Sacrificed Verdicts:** This principle *overturns* your discounting of the Gordian Knot (it *wasn't* fully authored in interpretation) and fully embraces the last clause of (9) (the ledger's value lies in its *costly resistance*). It saves the rest. It explains the asymmetries (4 & 5) as the difference between low-cost performance and high-cost revelation (whether vice or virtue).
