prompt: |-
  I do interpretive planning at a mid-sized regional history museum — basically I'm the person who reads every exhibit script before it goes upstairs, which is a dozen or so a year, and each one is packed with "why did this happen" claims: wall text, panel copy, audio tour stops, the seven-minute intro video. We have no way of telling the difference between a script that actually explains something and one that just tells a story that happens to stop where the thing we're explaining starts. And I get maybe forty minutes per script, no one on my team has any philosophy training, and whatever comes out of the review has to survive a meeting with a director who has opinions, a community advisory board that has more, and eventually a docent saying it out loud to a fourth grader and a donor in the same breath.

  I've read a little of this literature — the old covering-law picture where you're supposed to subsume the event under a general law, and then the people who say no, narrative explains in its own right and doesn't need a law bolted underneath. Please turn whatever in that fight is actually usable into a procedure I can run on one single claim: the questions in order, what counts as a passing answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because the real disagreement is about what's worth saying rather than about what happened.

  Two things specific to us that I'd like the procedure to either use or explicitly throw out:

  - Our house rule, which came from a funder: every causal claim has to be one of three things — a mechanism ("the mill closed because the embargo tripled its fuel costs and it ran on fuel oil"), a counterfactual ("even without the levee, the '27 flood still would have taken the east bank"), or what they call a "legibility" claim, one that just makes the sequence graspable. I suspect the third bucket is where all the dead weight is hiding.
  - A test one of our board members keeps pushing: tell the story backwards. If the chain still holds up in reverse there's real law-backed structure under it; if it collapses, it was only ever narrative. I half believe this and half think its nonsense, and I can't say which half is right.

  I also need to know how the procedure handles claims that are only true because of how things later turned out — "the seeds of the '67 riot were sown when the streetcar tracks came up in '52" type sentences — and flat inevitability claims like "it was only a matter of time before the mine shut." Those are the ones our director loves and I have no vocabulary to push back on.

  Then run it on three claims from the script on my desk right now: (1) the mill-closure-with-fuel-costs line above; (2) the streetcar/seeds line; (3) a ten-panel chronology of a mayor's two terms, 1948 to 1956, that a donor wants captioned "How the modern city got built." One of those should definately come out badly for me and I'd rather hear it from you than in the meeting.

  Lead with your bottom line in the first sentence — whether a usable procedure exists here and what its spine is — then the procedure, then the three applications, then what the procedure can't do for me. No preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is an interpretive planner at a history museum, dealing with exhibit scripts that make causal claims. They need a practical procedure to evaluate these claims quickly. Let me start by understanding their main challenges. They have limited time per script—about forty minutes—and no philosophy training on their team. The scripts go through multiple stakeholders with different opinions, and they need a method to distinguish genuine explanations from mere narratives.

  The user mentioned their house rule: causal claims must be mechanisms, counterfactuals, or legibility claims. They suspect legibility claims are problematic. Also, a board member's test of telling the story backwards is in question. They need clarity on handling claims about seeds of future events and inevitability.

  First, I need to recall philosophical debates on explanation. Covering-law vs. narrative explanations. The user needs something actionable, so I should synthesize key points into a step-by-step checklist. Each step must have clear pass/fail criteria to save time. 

  The procedure should start by identifying the claim type. Mechanisms need clear cause-effect links with evidence. Counterfactuals require plausible alternatives. Legibility claims must enhance understanding without pretending to explain causality. The backward test might help with mechanisms but not others, so it should be optional.

  For "seeds of" claims, the challenge is hindsight bias. The procedure needs to check if the initial event genuinely enabled the outcome, not just correlated. Inevitability claims should be flagged unless backed by strong evidence. 

  Applying this to their examples: the fuel cost mechanism should pass. The streetcar seeds claim needs evidence of a direct link. The mayor's chronology as "how the city got built" is a legibility claim that overreaches; it should be rephrased to avoid implying causality.

  The user's deeper needs include defending their assessments in meetings with directors and donors. The procedure must provide clear rationale for each judgment. They also need to manage stakeholders' preferences without academic jargon. Highlighting where a claim is legitimate but not explanatory (like legibility) can help navigate disagreements.

  Finally, the procedure can't resolve value disputes about what's worth mentioning. It can only assess explanatory validity. Making that distinction clear will help the user hand off decisions appropriately.
answer: |-
  **Bottom line:** A usable procedure exists, centered on a 5-step checklist that filters causal claims by type, tests for evidence-backed mechanisms or plausible counterfactuals, flags "legibility" claims as non-explanatory, and isolates value judgments for human negotiation.

  ### The Procedure: Causal Claim Audit (5 Steps, 3-5 min per claim)
  Run this on *each discrete causal claim* (e.g., a single sentence or clause asserting "why" or "led to").

  1.  **What TYPE of claim is this?** (60 sec)
      *   **Mechanism (M):** Explicitly states a cause (A) directly producing an effect (B) via a traceable process. *Look for: "because", "led to", "due to", verbs of action/change.*
      *   **Counterfactual (C):** Explicitly states what *would* or *would not* have happened if a specific factor changed. *Look for: "if not for", "without X", "even if", "only because of".*
      *   **Legibility (L):** Only makes a sequence clearer or more comprehensible, *without* asserting a direct causal link. *Look for: "setting the stage", "paving the way", "in the context of", "amidst", "followed", "occurred during".*
      *   **Other (O):** Inevitability ("only a matter of time"), Teleology ("seeds were sown"), or Ambiguous. *Flag immediately.*
      *   **PASS:** M, C, L (L passes *as non-explanatory framing*). **FLAG:** O or unclear type. **STOP/NO:** Cannot determine type – claim is too vague for analysis.

  2.  **Is the claim EVIDENCE-BOUND?** (45 sec)
      *   For **M:** Is the stated mechanism (the "how") supported by specific, verifiable evidence *within the scope of the exhibit's argument/sources*? (e.g., fuel costs *documented* in mill ledgers, embargo impact *cited* in contemporary reports).
      *   For **C:** Is the alternate scenario plausible and grounded in historical context/evidence? (e.g., evidence that the area *was* prone to flooding *before* the levee existed).
      *   For **L:** Does the sequence described actually improve coherence *without smuggling in causal implication*?
      *   **PASS:** Yes, evidence is present/cited or plausibly implied by reliable sources. **FLAG:** Evidence is weak, indirect, or absent. **STOP/NO:** Claim asserts a mechanism/counterfactual with *zero* supporting evidence – reject outright.

  3.  **Apply the BACKWARD TEST (Optional, but Recommended for M & C):** (30 sec)
      *   State the outcome (B) and ask: "Does the presence/occurrence of cause (A) *necessarily imply* or *make highly probable* outcome (B)?" (For M) OR "Does the *absence* of factor (X) *necessarily prevent* or *make highly improbable* outcome (B)?" (For C).
      *   **PASS (Strong):** Yes, the link is strong/deterministic (e.g., tripled fuel costs bankrupting a fuel-dependent mill). **PASS (Weak/Contextual):** Maybe, but depends heavily on other factors (context required). **FAIL:** No, the link is not necessary or even probable based on general historical knowledge (e.g., "seeds were sown" rarely implies necessity). **N/A:** For L claims.
      *   **Result:** Not a strict pass/fail. **Strong Pass** reinforces M/C. **Weak Pass/Contextual** flags need for nuance/qualification. **Fail** strongly suggests the M/C claim is invalid or overstated.

  4.  **Handle SPECIFIC RED FLAGS: "Seeds of..." & Inevitability** (45 sec)
      *   **"Seeds of..." / Teleology:** Treat as **O (Other)**. It *only* passes if:
          1.  It can be *rephrased* as a clear **L** claim (e.g., "The 1952 streetcar removal *occurred years before* the 1967 riot").
          2.  OR rephrased as a specific **M** claim with evidence (e.g., "The 1952 removal *isolated* neighborhood X, concentrating poverty *that contributed to* tensions erupting in 1967" - *requires evidence for isolation/concentration/contribution*).
      *   **Inevitability ("only a matter of time"):** Treat as **O (Other)**. It *only* passes if:
          1.  Rephrased as a **C** claim with strong evidence (e.g., "Given the exhausted ore seams found in 1950 audits, the mine *could not have remained open* past 1955").
          2.  OR removed/replaced with a factual statement about trends or pressures.
      *   **PASS:** Only if successfully rephrased as M, C, or L. **STOP/NO:** If it remains an inevitability/teleology claim – reject. **FLAG:** If rephrasing is possible but changes meaning significantly.

  5.  **Final Gate: Is this EXPLANATION or FRAMING?** (60 sec)
      *   **M & C:** Are they presented *as explanations*? If Passed Steps 1-4, they are valid explanations. **Keep.**
      *   **L:** Is it presented *only* as helpful framing/organization *without implying causation*? If Passed Step 1 & 2, it's valid framing. **Keep but ensure wording is neutral.**
      *   **KEY QUESTION:** Does the claim *overreach* its type? (e.g., An L claim worded like an M claim; an M claim lacking mechanism detail). **PASS:** No overreach, type matches presentation. **FLAG:** Overreach detected – needs rewording. **STOP/HANDOFF:** Claim is valid (Passed 1-4) but its *inclusion*, *weight*, or *specific framing* is a value judgment about importance/narrative – **flag for stakeholder discussion.**

  ### Application to Your Claims

  1.  **"The mill closed because the embargo tripled its fuel costs and it ran on fuel oil."**
      *   **Step 1:** M (Mechanism - "because" + cause/effect process).
      *   **Step 2:** PASS (Assumes evidence exists for embargo's specific impact on *this* mill's fuel costs & that it relied on fuel oil).
      *   **Step 3 (Backward):** STRONG PASS. Tripling essential operating costs for a business strongly implies bankruptcy/closure. High necessity.
      *   **Step 4:** N/A (Not flagged).
      *   **Step 5:** PASS. Clearly presented as explanation. Valid M claim. **KEEP.**
      *   **Verdict:** Good explanation.

  2.  **"The seeds of the '67 riot were sown when the streetcar tracks came up in '52."**
      *   **Step 1:** O (Other - Teleology/"Seeds of").
      *   **Step 2:** N/A (Failed Step 1).
      *   **Step 3:** N/A.
      *   **Step 4 (Red Flag):** FAIL. Cannot stand as O. Rephrase needed.
          *   Option L: PASS - "The 1952 streetcar removal occurred fifteen years before the 1967 riot." (Non-causal sequence).
          *   Option M: *Only* PASS if specific evidence links removal *directly* to a mechanism contributing *proximately* to the riot (e.g., documented economic collapse *of that neighborhood* starting in 1952, creating *the specific* tensions). Likely requires significant evidence not implied by the original claim.
      *   **Step 5:** HANDOFF if attempting M rephrase (requires evidence justification). STOP/NO if kept as is or only L rephrase. Original claim **REJECT.**
      *   **Verdict:** Bad explanation as stated. Requires major revision or downgrade to non-causal sequencing.

  3.  **Ten-panel chronology captioned "How the modern city got built."**
      *   *Treating the caption as the core claim.*
      *   **Step 1:** Ambiguous, leans heavily towards L (Legibility - organizing events), but implies M/C (causal responsibility).
      *   **Step 2:** For L (sequence): PASS (Chronology exists). For implied M/C: FLAG (Chronology ≠ proof of causation).
      *   **Step 3:** N/A (Not pure M/C).
      *   **Step 4:** N/A.
      *   **Step 5:** **HANDOFF (Major Flag).** This is primarily an **L** claim (organizing events chronologically). However, the caption ("*How* it got built") **grossly overreaches** into implying a **mechanism** the chronology alone cannot prove. The *real* claim here is a **value judgment**: "This mayor's actions *were the primary cause* of the modern city's development." The procedure shows the *form* (caption over chronology) is invalid explanation. **Decision:** The chronology can stay (L). The caption must change to reflect its *actual* type: e.g., "The Mayor's Terms: 1948-1956," "Key Projects During Mayor X's Tenure," or "A Decade of Development." The *interpretive argument* about the mayor's *role* needs separate M/C claims *within* the panels, supported by evidence. **STOP/NO** on the current caption.
      *   **Verdict:** The caption fails as an explanation. The chronology is fine framing, but the causal implication must be removed or proven within panels.

  ### What the Procedure CAN'T Do For You

  1.  **Resolve Value Conflicts:** It identifies *what is valid explanation/framing*, but not *what is important or worth saying*. If a valid L claim is deemed unimportant by stakeholders, or a valid M claim is too complex, that's a **human negotiation** (Step 5 Handoff).
  2.  **Judge Evidence Quality Depth:** It checks for the *presence* and *basic relevance* of evidence (Step 2), not its ultimate scholarly rigor or completeness. Deeper evidence debates require subject expertise.
  3.  **Fix Bad Writing:** It identifies flawed causal logic or overreach, but won't make poorly written prose clear or engaging.
  4.  **Override Stakeholder Authority:** It provides an audit trail ("Step 3 Backward Test flags weakness"), but the Director/Board/Docent ultimately decides what gets used. This arms you with *why* a claim is weak, not a veto.
  5.  **Handle Profound Historical Debate:** For claims where causation is fundamentally contested by experts (e.g., "What caused the fall of Rome?"), the procedure will flag the need for nuance/qualification (Step 3 Weak Pass/Contextual, Step 5 Handoff for framing), but won't resolve the debate.
  6.  **Create Explanations:** It audits existing claims. It won't generate a good mechanism where none was written.
