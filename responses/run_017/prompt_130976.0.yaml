prompt: |-
  I chair the small committee that allocates our annual discretionary bonus at the forty-person energy-policy institute where I have worked for eleven years. The pool is modest, the decision has to be unanimous, and it has to be announced with a short written justification. This year I have three cases that pull in different directions, and I would like help with the reasoning rather than with the decision itself.

  Priya inherited, in her third month, a donor relationship that a departing colleague had built over six years. She made one call and the foundation doubled its gift, which is roughly sixty per cent of our new money this year. She is a solid performer but, by general agreement, no better at this work than two colleagues who spent the year cold-emailing and brought in very little.

  Tom ran our campaign to get a state utility commission to adopt a rate design we had been advocating for years. He worked punishing hours, and on every internal measure of effort, judgment, and persistence he was our strongest person this year. The commission voted three to two against us, partly because a sympathetic commissioner resigned in August and her replacement was hostile. The campaign produced nothing I can point to, and there is a real chance it made the next attempt harder.

  Ada found an error in the model we use to estimate avoided emissions. Correcting it cut our headline figure by about a third, cost us two funders, and has largely been experienced internally as an embarrassment. It is also the thing I would point to if someone asked what actually made our work better this year.

  Two things I have already settled, so please do not spend your answer on them. First, I am unpersuaded by the sweeping thought that nobody has really earned anything, since natural talents and even the capacity for hard work are themselves matters of luck. I suspect that is true, and it does not discriminate between my cases, every one of which is shot through with luck: an inherited relationship, a commissioner's resignation, a stale spreadsheet. What I need is a way of thinking about how much the luck matters in each case, and where, if anywhere, it stops mattering. Second, I have been experimenting with a rule — reward the difference a person made that would not have happened anyway, that is, discount the result by how easily someone else could have produced it — and it keeps returning answers I do not trust. It gives Priya almost nothing, since almost anyone could have made that call. It gives Tom almost nothing, since the campaign failed. It gives Ada a great deal. I find the Ada answer right and the Tom answer wrong, and I cannot tell whether that means the rule is defective or my feeling about Tom is sentimentality about effort.

  There are two further complications. We disagree internally about what our outputs even are — money raised, policy changed, or research made more credible — and the three cases seem to sort differently depending on which of those you take as the point of the exercise. And Ada leaves in January for a lower-paid job, which I keep being told is irrelevant and which I suspect is not, though I cannot say why.

  So: what is the question I should actually be asking, is the replaceability rule salvageable in some modified form, and how should I think about Tom? Please write in continuous prose, without headings, bullet points, bold text, or tables, as though you were writing me a careful email.
reasoning: |-
  Okay, the user chairs a committee for allocating discretionary bonuses at a small energy-policy institute. They have three complex cases: Priya, Tom, and Ada, each representing different contributions that pull in different directions. The user has already dismissed two approaches: not giving bonuses due to luck being a factor and a replaceability rule that doesn't feel right. 

  Hmm, the user is wrestling with several layers here. At surface level, they need help evaluating individual contributions. But deeper down, they're questioning the institute's core values—what truly constitutes impact? Money? Policy change? Research integrity? The tension between measurable outcomes (Priya's funding, Tom's failed campaign) and intangible integrity (Ada's correction) suggests an identity crisis for the organization. 

  The replaceability rule fails because it oversimplifies. Priya's call was "easy" but required trust-building; Tom's effort created institutional stamina; Ada's correction, while painful, was irreplaceable. The rule ignores context—like how Priya inherited relationships, or why Tom's loss might plant seeds for future wins. 

  Tom's case is particularly telling. The user instinctively recoils at discounting his effort, sensing that failure ≠ worthlessness. This hints at unspoken values: honoring grit, learning from setbacks, investing in people beyond immediate ROI. The discomfort with Ada's departure timing reveals another layer—are bonuses rewards for past acts or investments in future value? 

  The real question isn't "Who deserves what?" but "What do we want to incentivize and become?" Should they pivot toward integrity (Ada), opportunism (Priya), or resilience (Tom)? The answer reshapes their culture. 

  For the rule to work, it needs modifiers: value the *uniqueness* of contribution (not just replaceability), assess *latent* impact (Tom's groundwork), and weigh *integrity gains* (Ada's correction). Tom's worth lies in embodying the tenacity their mission requires—a lesson for the whole institute. 

  Ada's departure? If bonuses are recognition, it's irrelevant. If retention tools, it matters. But withholding hers would signal that truth-telling is punished—exactly what her correction aimed to prevent. 

  In essence: redefine "result" to include stewardship (Priya), groundwork (Tom), and credibility (Ada). Luck frames the context but doesn't erase agency. The committee must first decide what story they want this bonus allocation to tell—about who they are and aspire to be.
answer: |-
  My thoughts on your dilemma, for what they’re worth. You’re grappling with something fundamental: not just *who* contributed, but *what kind of contribution* your institute ultimately values, and how luck interacts with agency. The cases aren’t just pulling in different directions; they’re testing the philosophy behind your rewards. Let’s break it down stepwise.

  **First, the question you should be asking:**  
  *"What does this bonus primarily recognize: outcomes, agency, or institutional stewardship?"*  

  Your discomfort stems from evaluating three distinct *types* of merit through a single lens. Priya’s case is about *capitalizing on opportunity* (outcome-focused, luck-heavy). Tom’s is about *exercising agency* (effort/judgment, outcome-negative). Ada’s is about *stewarding institutional integrity* (long-term credibility, outcome-painful). If your committee hasn’t aligned on which of these your bonus prioritizes, consensus will remain elusive. Resolve this first.

  **On the replaceability rule:**  
  It’s salvageable but needs refinement. Your instinct is right – the rule in its raw form undervalues context and conflates "easy" with "inevitable." Consider these modifications:  

  1.  **Value the context, not just the act.** Priya didn’t just "make a call." She stepped into a complex, trust-based relationship *at a critical juncture* (colleague’s departure) and navigated it successfully where missteps could have damaged it. The replaceability isn’t about the *physical act* of dialling, but the *judgment and relationship acuity* to secure a doubled gift immediately upon inheriting it. That’s less replaceable than cold-emailing. Discount the *luck of inheritance*, but not the *skill in leveraging it uniquely*.  
  2.  **Include negative replaceability.** Ask: "Would the *negative outcome* likely have occurred without this person?" For Ada: without her scrutiny, the error persists, credibility erodes further, and future corrections could be catastrophic. Her action, though painful, was uniquely preventative. For Tom: *Without* his effort, the campaign likely fails *more* decisively, or crucial groundwork for future efforts isn’t laid. His work may have mitigated total loss.  
  3.  **Assess "inevitability" rigorously.** Would Priya’s outcome *really* have happened with "anyone"? Inherited relationships can sour. Would Ada’s error *inevitably* have been found? Stale models often persist unchallenged. Tom’s failure was *not* inevitable (sympathetic commissioner might have stayed); his effort was genuine agency against odds.

  **How to think about Tom:**  
  Your feeling isn’t mere sentimentality. Tom embodies agency in its purest form: exceptional effort, judgment, and persistence directed squarely at your core mission (policy change). The outcome was negative, but consider:  

  *   **The Counterfactual:** A less capable person might have secured a 5-0 defeat, not 3-2, or failed to document arguments that become crucial next time.  
  *   **Institutional Value:** His effort signals commitment to your mission internally, maintaining morale and capability. It builds "institutional muscle" for future campaigns.  
  *   **Latent Outcome:** Policy change is iterative. Tom’s campaign may have shifted the debate, educated key players, or revealed new opposition tactics – groundwork essential for the next attempt. Punishing the *attempt* because a commissioner resigned risks incentivizing risk aversion.  
  *   **Luck’s Role:** The commissioner’s resignation was bad luck *external to Tom’s actions*. His agency was applied *despite* this. Differentiate luck that creates the context (inheritance, resignation) from agency exercised *within* that context. Tom maximized agency within unlucky constraints.

  **Addressing Complications:**  

  1.  **Output Ambiguity:** This is the core issue. Use the cases to *define* your priorities, not the reverse. Does doubling vital funding (Priya) outweigh advancing core policy work (Tom) or safeguarding foundational credibility (Ada)? Can the bonus acknowledge different *types* of contribution? Perhaps: Priya for exceptional revenue stewardship, Tom for exceptional mission-focused agency/effort, Ada for exceptional institutional integrity. Unanimity requires agreeing on the hierarchy of values.  
  2.  **Ada’s Departure:** It *is* irrelevant to the *recognition* of her contribution. The bonus rewards past impact. Withholding it because she leaves sends a corrosive message: "We only value truth-telling if you stay to endure the fallout." It risks disincentivizing vital, uncomfortable work in the future. Reward the act, not the retention.

  **Synthesis:**  
  Revisit your rule with nuance:  
  *   **Priya:** Reward the *judgment and relationship skill* in uniquely capitalizing on inherited luck. The outcome was exceptional, but discount the windfall aspect of the inheritance itself.  
  *   **Tom:** Reward the *exceptional exercise of agency and effort* in direct pursuit of core mission, despite unlucky externalities. Value the *quality of the attempt* and its latent contribution, not just the binary win/loss.  
  *   **Ada:** Reward the *unique courage and integrity* in uncovering a painful truth essential to institutional credibility, an action easily avoided and thus highly non-replaceable.  

  Ultimately, Tom’s case challenges you: do you value the *striving* for your mission as much as the outcomes? If "policy changed" is an output, Tom failed. But if "rigorous advocacy" and "building policy change capacity" are outputs, his contribution was significant. Align on that, and the reasoning follows. Luck sets the stage, but agency – in seizing opportunities, persevering against odds, or upholding truth – is what you’re truly rewarding. Good luck with the committee.
