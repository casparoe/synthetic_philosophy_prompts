  - **Couplet**: Leave the moral question open after subtracting reputation's rewards. No tidy answers—just the hollowed-out challenge.  

  Word choice must feel 20th-century translator-natural. No "thee/thou." Lines like "all men called him stained" or "trusted names" keep it accessible. For the volta, "no oath could bind" and "no love could root" make isolation tangible.  

