answer: |-
  Here’s a disciplined epistemic game theory mapping of the SVB collapse, addressing your core questions by forcing models onto the case while highlighting where they go silent.

  ---

  ### **Core Setup: Players, Strategies, Payoffs, State**
  - **Players**: Individual depositors (startups, VC funds, corporates). Aggregation is problematic—payroll needs create correlated liquidity shocks, but withdrawal decisions are decentralized.  
  - **Strategies**: *Withdraw now* (W) or *Wait* (H).  
  - **Payoffs**:  
    - *W*: Guaranteed par value if bank has liquidity; near-zero cost.  
    - *H*: Full value if bank survives; near-zero if run occurs and bank fails (uninsured deposits at risk).  
  - **State Uncertainty**:  
    - *Solvency* (S): True asset value net of losses. SVB was solvent if HTM bonds held to maturity (S=1) but insolvent if liquidated early (S=0).  
    - *Liquidity* (L): Ability to meet withdrawals without fire sales. SVB’s liquidity was fragile due to duration mismatch.  
    Models typically conflate S and L—here, **L depends on S and others’ actions**, creating strategic complementarity.

  ---

  ### **Answers to Key Questions**

  #### **1. Common Knowledge (CK) of Rationality vs. Fundamentals**  
    - **Diamond-Dybvig (DD)**: Multiplicity arises from CK of rationality + strategic complementarity. SVB’s March 8 announcement acted as a **public signal** (sunspot) coordinating beliefs. *Fundamentals didn’t change*: HTM losses were known pre-announcement. The signal shifted higher-order beliefs: "I know you know withdrawal is now salient."  
    - **Global Games (GG)**: Private noise dissolves multiplicity. But SVB’s case had *no meaningful private noise*—VC tweets and withdrawal screenshots created near-public signals.  
    **Conclusion**: CK of rationality is *not* the driver; the announcement created **CK of vulnerability** (a coordination device), not new fundamentals. GG fails here—publicity overrode noise.

  #### **2. Why No Run in January? The "Grain of Doubt" Problem**  
    Rubinstein’s email game shows that *almost*-CK isn’t CK. Pre-March 8:  
    - Depositors knew HTM losses existed, but not that *others* saw this as critical.  
    - VCs’ private doubts weren’t common knowledge.  
    The March 8 announcement shattered this: it revealed that *everyone now knew* liquidity was at risk. GG’s grain of doubt (ε-probability S=0) *only* prevents runs if doubt is private. Public doubt (e.g., a CEO announcing fire sales) **amplifies** runs.  
    **Timing fix**: Runs require a trigger that makes fragility *common knowledge*. SVB’s self-inflicted signal provided it.

  #### **3. Unawareness and Public Signals**  
    - **Unawareness**: Standard models assume a fixed state space; players know the game exists. SVB’s "unaware" depositors break this—they weren’t playing until alerted. *This is a fundamental gap*: epistemic GT cannot model "discovering the game."  
    - **Endogenous Public Signals**: Once the run started, real-time withdrawal data (portal slowdowns, group chats) acted as **public signals of others’ actions**. As Angeletos/Werning show, this reintroduces multiplicity: seeing others flee makes W dominant. GG’s uniqueness result *requires* private signals—public coordination revives DD indeterminacy.  
    **SVB Relevance**: The run’s speed was self-reinforcing via public digital traces, making GG’s prediction non-robust.

  #### **4. Where Theory Goes Silent**  
    - **Liquidity Needs vs. Coordination**: Models cannot distinguish "W for payroll" from "W fearing others." Payoffs are identical: both are dominant if bank fails. The distinction is *payoff-irrelevant* in the game—only solvency/liquidity matter.  
    - **Timing and Heterogeneity**:  
      - *No clock*: Models are static. SVB’s 36-hour run requires dynamic extensions (e.g., Morris-Shin 2000 with continuous time).  
      - *Settlement mechanics*: Wire delays/website crashes aren’t modeled; they alter feasible strategies.  
      - *Which depositors matter*: Large, uninsured depositors (VCs) dominated the run. Models treat players symmetrically—reality doesn’t.  
    **Result**: Theory explains *why* a run occurs but not *when* or *how fast*—mechanics and heterogeneity are exogenous.

  #### **5. Does the Case Confirm or Embarrass Epistemic GT?**  
    - **Confirms**: The run was *not* inevitable pre-March 8. HTM losses didn’t guarantee failure—liquidation could have been orderly. The collapse was driven by **higher-order beliefs**: VCs withdrew because they knew others would, and the announcement made this CK. Fundamentals (S) were secondary to coordination on L.  
    - **But Embarrasses**: SVB was *structurally vulnerable* (89% uninsured). Epistemic GT doesn’t explain *why* fragility existed—only how beliefs triggered the run. The backstop on March 12 **changed payoffs** (making W unnecessary) and **shattered coordination** (no incentive to race).  
    - **Medium Matters**: Physical queues (Northern Rock) are public signals that sustain multiplicity. SVB’s digital run had *faster, more pervasive* public signals (screenshots, APIs), accelerating coordination. A theory of public signals *predicts* digital runs are swifter and harder to stop.

  ---

  ### **Synthesis: What the Models Say (and Don’t)**  
  - **What Explains SVB?**  
    Diamond-Dybvig: March 8 announcement as a sunspot coordinating beliefs.  
    Global Games: *Fails*—public signals overwhelmed private noise.  
    Rubinstein: Pre-announcement was "almost-CK"; announcement made fragility CK.  

  - **Gaps Exposed**:  
    - Unawareness of the game isn’t modeled.  
    - Payroll needs ≠ coordination motives in actor intent (though identical in payoff).  
    - Timing/speed derive from technology, not theory.  
    - Solvency created vulnerability, but coordination caused collapse.  

  **Bottom Line**: Epistemic GT explains SVB as a coordination failure *enabled* by weak fundamentals and *triggered* by a public signal that aligned higher-order beliefs. The theory captures the logic of the run but not its ignition (unawareness) or velocity (digital mechanics). The backstop worked by altering payoffs, not beliefs—rational depositors no longer needed to run.
