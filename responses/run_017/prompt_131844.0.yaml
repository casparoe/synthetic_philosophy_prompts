answer: |-
  Your "double-filter account" is a sophisticated and testable deflationary framework—more nuanced than many dismissals of Wigner. Below, I rank counterarguments from fatal to awkward, assess your tests, and address your concerns honestly. I’ll use American English throughout.

  ---

  ### **Ranked Counterarguments: From Fatal to Awkward**
  1. **Fatal: Cases of Non-Ad Hoc Predictive Novelty**  
     - **Example:** Dirac’s equation (1928). The negative-energy solutions were *forced* by relativistic quantum mechanics’ internal consistency, not fitted to data. Dirac initially interpreted them as protons but later conceded they predicted a *new particle* (positrons, discovered 1932).  
     - **Why fatal?** The surplus structure (negative-energy states) was:  
       - Mathematically unavoidable (Lorentz invariance + quantum mechanics).  
       - Empirically novel (no prior evidence for antimatter).  
       - Quantitatively precise (mass, spin, magnetic moment).  
     - **Your account’s vulnerability:** This wasn’t "interpretive lock-in" or retrofitting. The math *demanded* a physical reality contrary to all prior intuition. A defender of Wigner would call this a "smoking gun" of math’s prescience.  

  2. **Severe: Cross-Domain Unification via Abstract Math**  
     - **Example:** Group theory in particle physics (e.g., SU(3) for quarks). Developed by Killing/Cartan (1888–1894) for pure geometry. Applied to quarks by Gell-Mann/Ne’eman (1961) to predict the Ω⁻ baryon (discovered 1964).  
     - **Why severe?**  
       - No physical data motivated SU(3)’s axioms (e.g., root systems).  
       - It compressed scattered hadron data into a *new ontology* (quarks), predicting particles outside the original dataset.  
     - **Your rebuttal?** You might argue group theory was "in the air" due to QM symmetries—but SU(3) was exotic, unused in physics until desperation forced it. The "tail-lag" was 70+ years.  

  3. **Problematic: Mathematical Necessity in Fundamental Laws**  
     - **Example:** Complex numbers in QM. Schrödinger’s equation *requires* **i** for unitarity and conservation of probability. Real-number alternatives fail catastrophically (e.g., violate causality or energy conservation).  
     - **Why problematic?** This isn’t convenience—it’s structural. Your "symmetry constraints" point explains *why* math fits, but not why nature *obeys* these constraints so deeply. If math were just a tool, we’d expect viable non-complex QM formalisms. None exist.  

  4. **Awkward: Persistent "Ugly" Math That Works**  
     - **Example:** Renormalization in QFT. Developed as a kludge (1940s) to cancel infinities. Later understood via Wilsonian RG (1970s)—a profound physical *and* mathematical insight.  
     - **Why awkward?** The formalism was *not* elegant or pre-filtered for tractability. It was "messy" math that unexpectedly revealed deep truth. Your "difficulty conservation" fails here: renormalization was initially despised as unphysical.  

  ---

  ### **Assessment of Your Tests**  
  1. **Tail-Lag Statistic**  
     - **Data:** Heavy tails exist. Examples:  
       - Non-Euclidean geometry (Gauss/Riemann, 1820s–1854) → GR (1915): ~60–90 years.  
       - Modular forms (Jacobi, 1830s) → Andrew Wiles’ proof of Fermat (1994) → cryptography/string theory: 150+ years.  
     - **Verdict:** Supports Wigner. Long lags suggest math isn’t "built on demand." Your account must explain why *these specific* tools were "lucky hits."  

  2. **Surplus-Structure Test**  
     - **Dirac’s equation** passes cleanly (as above).  
     - **Counterexample:** Riemannian geometry in GR. Einstein didn’t retrofit data—he *ignored* early math (advised by Grossmann) until tensor calculus became unavoidable for covariance. The surplus structure (curvature → gravity) was transformative.  
     - **Caveat:** Interpretive lock-in *is* real (e.g., string theory’s extra dimensions). But Dirac/GR are not this.  

  3. **Transfer Test**  
     - **Weak evidence for either side.** π in Gaussians is trivial (central limit theorem). Better: Number theory in quantum chaos (e.g., Riemann zeta zeros ↔ energy spectra). But this is analogical, not predictive.  
     - **Verdict:** Transfer is common but rarely *novelly predictive*. Mostly illustrates math’s generality.  

  4. **Impressionistic Observation**  
     - **You’re partly right:** Post-Standard Model, fundamental physics uses less *new* pure math (e.g., SUSY, strings borrow 1970s math). Computation dominates phenomenology.  
     - **But:** Topological quantum computing (using category theory), AdS/CFT (geometric Langlands), and resurgence theory (asymptotics) show math-led innovation continues.  
     - **Verdict:** Not fatal. Physics cycles between data-driven and math-driven eras.  

  ---

  ### **Your Unfalsifiability Concern**  
  - **Risk:** High. Your account *could* dismiss any success as "fitted," any lag as "survivorship bias," and unused math as "not yet needed."  
  - **Mitigation:** Your view *is* falsifiable if it predicts:  
    - No novel predictions from surplus structure (falsified by Dirac).  
    - No long-lag applications (falsified by group theory).  
    - Alternative non-math theories *should* exist for core phenomena (e.g., QM without complex numbers). Their absence is awkward (though effort-based).  
  - **Verdict:** Not unfalsifiable *yet*, but close. Shift the burden by demanding: *"Show me a prediction from 'pure' math that wasn’t reverse-engineered."* Dirac is the best case.  

  ---

  ### **What’s the Real Disagreement?**  
  1. **Empirical core:** How large is the space of possible formalisms?  
     - Wignerians: The space is vast; that *specific* math works is improbable.  
     - You: We sample a small, pre-constrained subspace (symmetries, etc.).  
     - **Testable?** Only via cosmology (e.g., if all possible math structures exist physically in a multiverse).  

  2. **Philosophical core:** What counts as "physics"?  
     - You: Physics is defined by tractability/fundamentality filters.  
     - Wignerians: Physics reveals objective patterns; math’s fit is a fact.  
     - **Example:** Econophysics uses diff eqs for markets. Is this "physics," or applied math? Your account likely says the latter.  

  ---

  ### **The Golden Case: Dirac’s Equation**  
  - **Structure:** Unavoidable surplus from internal logic (relativistic covariance + linearity).  
  - **Prediction:** Positrons (quantitative mass/charge).  
  - **Why you should care:** No "retrofitting." The math *preceded and dictated* the physics. If such cases are rare, they’re fatal to total deflation; if common, Wigner wins.  

  **Conclusion:** Your account explains 80% of "miracles," but Dirac-like cases (and group theory’s lag) demand a concession: *Some* math has a privileged, generative role in physics. Abandoning the double-filter entirely is premature, but it needs refinement—perhaps by allowing "constrained serendipity" in math’s design.
