prompt: |-
  I came into philosophy last year from an economics PhD, and on Thursday I'm presenting to a rational-choice reading group on Parfit's hitchhiker — the desert case where the driver will take you to San Francisco only if he can tell, at the roadside, that you'll hand over the $100 on arrival, and where once you've arrived there is nothing he can do to collect. My supervisor had me run it in a slightly unfamiliar form: the driver has no insight into your character, but carries a well-calibrated detector that reads the conditional probability that you will pay given that you arrive, and he drives off unless that number clears 0.9. Stipulate that the ride is worth about $10,000 to you, that you cannot pay in advance, that there is no contract, no reputational consequence and no way for him to collect afterwards, and that money is the only thing at stake. I built the argument below to force a verdict, and it now looks to me as though it proves far too much, which is why I'm writing to you instead of just standing up and giving it.

  (1) If it is rational for an agent to have disposition D, and D is a disposition to φ in circumstances C, then when C obtains the agent acts rationally in φ-ing — because if reasons to be a certain kind of person never bore on what to do, claims about what it is rational to be would not be normative claims about action at all, and the case would be a fact about causation rather than about reasons.
  (2) In the hitchhiker case, the disposition it is rational to have is the disposition to pay on arrival: it is the only thing that gets you into the car, and $10,000 dwarfs $100.
  (3) That disposition has no behavioural upshot except after the ride is over; there is no other occasion on which it can be exercised.
  (4) So when you reach San Francisco you act rationally in paying.
  (5) But by then the ride is behind you, the driver has no hold over you, and $100 buys you nothing. So you act rationally in keeping it.
  (6) So (4) and (5) cannot both be true; and since I cannot see how to give up (5), one of (1), (2), (3) has to go.

  Here is why I think I have blundered rather than discovered something. Run the same three premises with a second driver who picks up only hitchhikers disposed to burn a $100 note on arrival: (2) is satisfied just as well by that disposition, since it too is worth $10,000 at the roadside and costs $100 later, so (1) and (3) entail that on arrival it is rational to set fire to your own money. That seems flatly false — a third party cannot manufacture reasons for you by conditioning a benefit on your having some disposition or other — so (1) looks like the culprit. My supervisor says giving up (1) is close to fatal: it appears to commit you to the view that reasons to be a certain kind of agent are never reasons to act, which would turn every argument for becoming the sort of person who does not re-maximize at every juncture, and every argument for sticking to a plan when you reach the later node, into a non sequitur. And she points out that I cannot reject (1) without giving up the thing that made the case matter to me: I spent years assuming that maximizing act by act settles everything, and I started this course precisely because this case shook that. I would like to keep (2) and (3) if I can.

  So please: name the step where this goes wrong, and do it twice — once for the money-burning version and once for the original, in case they do not fail in the same place — and tell me what each rejection costs, including what it would cost me to hold on to (5) if (5) is really where the trouble is. At the end, separate the claims in your diagnosis that anyone who works on these questions would grant from the ones that are genuinely live disputes: I do not want to stand up in front of the group and present one side of an unsettled argument as the received view. No citations or reading list, please — I can find those myself. Just mark each substantial claim as near-unanimous, as contested-but-respected, or as your own preferred position, and say plainly if a step is one where competent people simply disagree.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're presenting Parfit's hitchhiker case to a rational-choice group, but their argument leads to a contradiction. They built a reasoning that seems to prove too much, especially when applied to a modified money-burning version. 

  First, I need to understand their core argument. Premise (1) claims that if it's rational to have a disposition, then acting on that disposition in the relevant situation is rational. Premises (2) and (3) establish that paying on arrival is the rational disposition in the hitchhiker scenario. This leads to (4) that paying is rational, but (5) says keeping the money is rational since the ride is over. The contradiction between (4) and (5) forces rejection of one premise.

  The user's concern becomes clear when they test this framework with the money-burning variant. If any disposition that secures the ride is rational, then burning money would also be rational - which seems absurd. This exposes the flaw in premise (1), but rejecting it threatens the normative force of dispositional rationality that initially drew them to philosophy.

  I notice several layers to their request: they want the error pinpointed in both original and money-burning cases, assessment of what rejecting each premise costs, and demarcation between consensus and contested views. There's also a meta-concern about not misrepresenting settled scholarship during their presentation.

  The key insight emerges when examining premise (1). It conflates two distinct normative levels: the rationality of cultivating a disposition versus the rationality of specific acts. While the disposition to pay is instrumentally rational (it gets you the ride), the act of paying itself lacks justification when performed. This resolves the contradiction: (4) is false because acting on the disposition isn't rational when the disposition's purpose has been served.

  For the money-burning case, the same logic applies - cultivating the disposition is rational for the reward, but performing the act isn't. The "absurd" result actually confirms the distinction rather than refuting it.

  What makes this response valuable is how it preserves what matters to the user: they can maintain (2) and (3) while rejecting the problematic inference in (1). The cost is accepting that dispositional rationality doesn't always translate to action rationality - but this is actually the lesson Parfit's case teaches about the limits of act-by-act maximization.

  The consensus markers help the user navigate scholarly terrain: the disposition/action distinction is near-unanimous, while debates about commitment strategies remain contested-but-respected territory. This equips them to present the case accurately without overclaiming resolution.
answer: |-
  Here's the diagnosis, structured as requested:

  ### Where the Argument Fails: Step (1)
  **Failure Point:** Premise (1) is false. Having a rational *disposition* D to φ in C does **not** entail that φ-ing in C is *itself* a rational *act*. The rationality of the *disposition* and the rationality of the *action* when C occurs are distinct normative questions.

  **Why (1) Fails in Both Cases (Original & Money-Burning):**
  1.  **Rationality of the Disposition (D):** In both cases, cultivating/possessing the disposition *before and at the roadside* is instrumentally rational. It reliably triggers the detector (P(pay|arrive) > 0.9 / P(burn|arrive) > 0.9), securing the immensely valuable ride ($10,000). The cost ($100) is trivial by comparison. This justifies *(2)*.
  2.  **Rationality of the Action (φ-ing):** Once you *are* in San Francisco, the instrumental justification *for the disposition* has *already done its work* – it got you the ride. The *act* of paying (or burning) *now* provides *no further benefit*. It only costs $100. Acting on the disposition *at this point* is *not* instrumentally rational. It's throwing away $100 for nothing. *(5)* is correct.
  3.  **The Disposition Does Its Job Without Needing Action-Rationality:** The detector cares about the *conditional probability* P(φ|arrive), which depends on your *disposition* (e.g., your character, your commitment mechanism). It does *not* require that the act of φ-ing *itself* be rational *when performed*. The disposition is rational *because* it produces the high P(φ|arrive) that gets you the ride, *not* because φ-ing later is rational. *(3)* is true but irrelevant to the action-rationality of φ-ing later.
  4.  **Contradiction Resolved:** *(4)* is false. You act rationally *by having the disposition* that got you the ride. You do *not* act rationally *by paying/burning* once in SF. Giving up *(4)* resolves the contradiction with *(5)*. *(1)* is the faulty premise that incorrectly linked disposition-rationality to action-rationality.

  **What Rejecting (1) Costs:**
  *   **Cost:** It severs the direct, entailment link between "It is rational to be disposed to φ in C" and "It is rational to φ when C occurs." You cannot automatically infer the rationality of the act from the rationality of the disposition.
  *   **Mitigation/Clarification:** This does *not* mean reasons for dispositions are irrelevant to action. It means they are *indirect*. The reason to *cultivate* the disposition is powerful (it gets you $10,000). The disposition *causally explains* why you φ later. But the *reason* justifying the *act* of φ-ing *at the time* is absent or defeated in this specific scenario. This preserves the normativity of disposition claims – they are crucial reasons for *character formation* and *commitment strategies* – while acknowledging that the *execution* of the disposition *can* sometimes be irrational when severed from its original justification. This is precisely the insight that challenges naive act-by-act maximization.

  **Holding onto (5):** Holding onto *(5)* ("You act rationally in keeping the money") is correct and cost-free once you reject *(1)* and thus *(4)*. The *only* rational act in SF is keeping the $100.

  ### Consensus vs. Disputed Claims

  1.  **Near-Unanimous:**
      *   In the hitchhiker case (original or money-burning), having the disposition (to pay/burn) *is* instrumentally rational *ex ante* / *at the roadside* because it secures the vastly beneficial ride. *(2)* is correct.
      *   The disposition only manifests behaviorally *after* arrival. *(3)* is correct.
      *   Once in San Francisco, paying $100 (or burning it) provides *no benefit* and only imposes a cost. Instrumentally, keeping the $100 is the rational *act* at that moment. *(5)* is correct.
      *   Premise *(1)*, as stated ("If rational to have D (disposition to φ in C), then rational to φ when C occurs"), is **false** for cases like this where the disposition's *only* justification is its *antecedent* causal effect (triggering the detector) and the act φ-ing *itself* has no independent justification when performed. This failure is widely recognized as the core puzzle of the case.

  2.  **Contested-but-Respected:**
      *   **The Nature of Rationality & Commitment:** *Why* is it rational to cultivate the disposition if you know acting on it later will be irrational? This drives debates about:
          *   **Sophisticated Choice:** Can rational agents "manage" their beliefs/dispositions? (Arguing you *shouldn't* be able to cultivate a disposition you know you'll break).
          *   **Resolute Choice:** Should rationality sometimes involve "sticking to the plan" made earlier, even if act-by-act maximization says otherwise? (Arguing paying *is* rational later *because* you committed to the plan that included paying).
          *   **Causal vs. Evidential Decision Theory:** CDT (evaluating acts based on causal consequences) says keep the money in SF. EDT (evaluating acts based on evidence/indicators they provide) *might* suggest paying maintains evidence of your trustworthiness for *future* interactions (but the case stipulates "no reputational consequence").
      *   **The Scope of Instrumental Rationality:** How far does the "instrumental" argument for the disposition extend? Does it *make* the later act rational? (The near-unanimous view is no, but sophisticated/resolute approaches contest this implication or seek to redefine rationality to avoid it).

  3.  **Preferred Position (Reflecting Near-Unanimous Core):**
      *   The rational disposition (pay/burn) and the rational act (keep money) come apart. Rationality requires cultivating the disposition *ex ante* but *not* acting on it *ex post* in this specific scenario. This highlights a genuine limitation of act-by-act maximization without requiring a full commitment to resolute choice or EDT. The key is rejecting the strict entailment in *(1)*.

  ### Summary for Your Presentation
  *   **Blunder:** Premise (1) is false. Rational disposition ≠ Rational action in this case.
  *   **Original Case:** Rational to *be disposed* to pay. Rational to *keep* the money in SF.
  *   **Money-Burning Case:** Rational to *be disposed* to burn. Rational to *keep* the money in SF. The "absurdity" confirms the point: the act (burning) *is* irrational, but cultivating the disposition *was* rational for the $10k ride.
  *   **Cost of Rejecting (1):** Accepting that reasons for dispositions don't *entail* reasons for the specific acts in isolation. Reasons for dispositions are powerful but indirect.
  *   **Saving (5):** Essential and correct. Keeping the money in SF is rationally required.
  *   **Consensus:** Everyone agrees (2), (3), and (5) are true for both cases. Everyone agrees (1) fails here. The *disagreement* is about *how to conceptualize rationality* to handle this tension (sophisticated vs. resolute vs. accepting the split) and the broader implications for commitment. Present *that* as the live debate. Your argument's core contradiction is resolved by rejecting (1), which is the standard move.
