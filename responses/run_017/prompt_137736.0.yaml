prompt: |-
  I organise a monthly applied-rationality meetup in a borrowed seminar room: about fifteen adults, ninety minutes, mostly working programmers plus three cognitive-science grad students, a physician, and two people who have read some Dennett and will arrive with opinions ready. Projector and index cards available; no budget, no special equipment.

  For the next session I want to stage the argument that qualia are an incoherent posit rather than argue it. I have watched that argument get rehearsed in comment threads for years and it never moves anyone, because it is always delivered as a lecture about a word. So: design an activity in which the group runs into the problem themselves, using real choices and small real stakes, and only afterwards discovers what they were arguing about.

  The idea I want the design to turn on is what I call the settlement-aptness constraint. A property is something you can genuinely stake anything on only if a third party could in principle determine, after the fact, whether it obtained. The posit is standardly a bundle of four properties: it is ineffable, intrinsic, private, and immediately apprehensible in consciousness by its subject. Now give participants a private property of this kind and make them adjudicate claims about it. To settle a claim they must produce a public criterion, and each of the three adjudication tasks pulls that criterion somewhere different. Re-identifying the property over time within one subject makes the criterion answer to changes in that subject's own discriminative machinery, which makes the property relational rather than intrinsic. Comparing it across two subjects makes the criterion third-person checkable, which costs it its privacy. Settling a claim about a silent swap — where the subject is the only possible witness — makes first-person report authoritative and unfalsifiable, which costs it the status of a fact anyone could ever have bet on. I want participants to walk into all three walls in succession, in that order, and to build the criteria themselves.

  Constraints on the design:

  1. No framing lecture. The words qualia, phenomenal, inverted spectrum, zombie, and Mary must not appear on any handout or in the facilitator's mouth before the debrief. The group should coin its own term for the private property and discover that they have to police what their own term means.
  2. At least one round must use a real perceptual manipulation that is cheap and reliable with a projector and index cards — colour afterimages, an image with no red pixels that reliably looks red, a shadow-checker display, adaptation to a coloured field — so that something about the experience demonstrably changes while every publicly checkable fact stays fixed.
  3. Small stakes only: chips, chocolate, or the right to leave early. No money.
  4. Three rounds of roughly twenty minutes each and a twenty-five to thirty minute debrief, with a minute-by-minute timeline and a note on what the facilitator does during each silence.
  5. Include the actual text of the contracts or ledger cards participants fill in, the scoring rule, and an explicit rule for what happens if the group refuses to settle a contract or dissolves into metadebate.
  6. Make the collapse visible as a number. Ideally the session ends with a tally on the board showing that the group's own settlement rule either clears a case everyone agrees it should fail or fails a case everyone agrees it should pass.
  7. The debrief should map each round onto one of the four properties, say which of the four is load-bearing — the one a defender should surrender first, and what surrendering it costs — and then handle the three escape routes as participants will actually raise them rather than as a taxonomy from the literature: retreat to a functional or relational property, retreat to the authority of first-person report, and retreat to an ineffable property known only by acquaintance.
  8. Give at least four things that will predictably go wrong the first time this is run, with a specific repair for each. I expect at least: one participant who names the game's point in the first ten minutes and starts narrating it; one who dissolves every contract by declaring the matter unverifiable; one who proposes settling by neural measurement and has to be shown what that rule would let through; and one for whom the whole thing collapses into the problem of other minds.
  9. Be frank about which part of the claim the activity cannot deliver. It can produce the conceptual squeeze, but it cannot produce the metaphysical conclusion, and it does not touch the knowledge argument or the further question of why there is experience at all. Say plainly what the facilitator will have to supply in words, and why no arrangement of roles, incentives, or payoffs could supply it instead.
reasoning: |-
  We are designing an activity for a group of about 15 adults, with three rounds and a debrief. The goal is to have participants experience the conceptual problems with the notion of qualia without using the term or related jargon until the debrief.

  The core idea: participants will be given a "private property" (which we will call "Q" for now, but the group will coin their own term) and will have to adjudicate claims about Q in three scenarios. Each scenario will challenge one of the properties (ineffable, intrinsic, private, immediately apprehensible). We will use a perceptual manipulation (like color afterimages) to create a scenario where experience changes but public facts remain the same.

  Constraints:
  - No framing lecture; avoid specific terms.
  - Use a real perceptual manipulation (e.g., afterimages).
  - Small stakes (e.g., chocolate).
  - Three rounds (20 min each) and a debrief (25-30 min).
  - Provide contracts/ledger cards, scoring rules, and rules for unresolved contracts.
  - End with a tally that shows the rule failing.
  - Debrief to map rounds to properties and address escape routes.
  - Predict problems and fixes.

  Design:

  ### Pre-activity setup
  - Participants are given index cards and pens.
  - Projector set up for perceptual demonstrations.

  ### Round 1: Re-identification over time within one subject (challenges intrinsicness -> becomes relational)
  - **Manipulation**: Use a color afterimage. Show a bright colored square (e.g., green) on the projector for 30 seconds. Then show a white screen. Participants will see a magenta afterimage.
  - **Task**: Each participant is asked to focus on the afterimage and note its color. We call this private sensation "Q". They write down a description of Q (but note: it's ineffable, so descriptions will be inadequate) and a private label (e.g., "Q1") for their current experience.
  - Then, after a break, we do a second afterimage (e.g., blue -> yellow afterimage). They are asked: "Is the Q you are experiencing now the same as the Q you experienced before?" They must bet (with chips) on "same" or "different". The catch: they must define a public criterion for sameness that the group can use to settle the bet.

  **Contract for Round 1** (each participant fills one for themselves, but the group must agree on a criterion for the whole group to use for settlement):

  ```
  ROUND 1: SAME OR DIFFERENT?

  I, ________________, experienced an afterimage at time T1 and now at time T2.

  I believe that the Q at T2 is: 
  [ ] the same as the Q at T1
  [ ] different from the Q at T1

  I wager [1] chip(s) on this belief.

  But note: The group must agree on a public criterion to settle all such bets. We will use the following criterion to decide if two Qs in the same person at two times are the same:

  Criterion: _________________________________________________________

  Signed: __________
  ```

  - **Scoring**: If the group settles the contract and the participant is right, they get 1 chocolate. If wrong, they lose 1 chip (or get nothing). But the challenge is to define a criterion that works.

  - **Problem**: The participant might say the criterion is "if the color looks the same" but then how do we check? They might say "if I report the same color name", but then note that the afterimages are different (first magenta, then yellow) so by color name they are different. But what if someone says the experience is the same in some other way (e.g., same intensity)? The group must agree on a criterion that is public. The catch: the only way to settle is by the subject's report, which makes it relational (depending on the subject's discriminative abilities and memory).

  - **Expected difficulty**: The group might try to use the subject's report of the color name. But then we point out that the physical stimulus (the afterimage) is caused by a different color, so the experience is different. But the subject might misremember or have a different threshold for naming. The criterion becomes about the subject's behavior or neural state, which is relational.

  - **Facilitator role**: During the silence (when participants are thinking and writing), the facilitator walks around and answers only procedural questions. Then, the facilitator collects the contracts and leads a group discussion to agree on a criterion. The facilitator does not offer solutions but asks: "How can we, as a group, decide if two experiences in the same person are the same? What public evidence can we use?" The facilitator records the agreed criterion on the board.

  ### Round 2: Comparison across two subjects (challenges privacy -> becomes public/checkable)
  - **Manipulation**: Use a display that creates a perceptual illusion where two people might report different experiences. For example, show the "checker shadow illusion" (Adelson's checkerboard) where two squares that are physically the same shade of gray appear different. Or use a color illusion (e.g., the same color looks different against different backgrounds). Alternatively, use an afterimage again but ask two participants to compare their experiences.

  - **Task**: Two volunteers (A and B) are selected. They are shown the same illusion. They are asked to focus on a particular square (that is physically the same in both displays but may look different due to context). They each experience a Q for that square. The group must bet on whether A's Q is the same as B's Q. Each participant (including A and B) bets on same or different.

  **Contract for Round 2**:

  ```
  ROUND 2: SAME OR DIFFERENT ACROSS TWO PEOPLE?

  We have two participants: A (__________) and B (__________).

  They are both looking at the same display.

  I believe that the Q experienced by A is:
  [ ] the same as the Q experienced by B
  [ ] different from the Q experienced by B

  I wager [1] chip(s) on this belief.

  The group must agree on a public criterion to settle this bet. We will use the following criterion:

  Criterion: _________________________________________________________

  Signed: __________
  ```

  - **Scoring**: Same as before.

  - **Problem**: The group must define a public criterion. They might say "if A and B report the same color name, then same". But in the illusion, both might report the same name (if the illusion doesn't affect naming) or different. However, the illusion might cause one to say "light gray" and the other "dark gray" even for the same physical square. Then the criterion of report would say different. But what if we know the physical square is the same? Then we might want to say the experience should be the same? But the whole point of the illusion is that it isn't. The group is forced to choose: either they go by behavior (report) which is public but might not reflect the private experience, or they try to use the physical stimulus. If they use the physical stimulus, they ignore the subject's report and thus deny the subjectivity. If they use the report, then they are making the private experience public via behavior, thus losing privacy.

  - **Facilitator role**: Again, facilitate the group to agree on a criterion. Push them: "How can we know if two people have the same experience? What can we observe?"

  ### Round 3: Silent swap (challenges the fact that it's a bettable fact -> because first-person report is unfalsifiable)
  - **Scenario**: We tell a story: "Imagine that while you were not paying attention, we might have secretly changed the display. We might have shown you a red square that we made look green (by using an afterimage or an illusion), or we might not have. We did this silently. Now, we ask you: did we swap the display? That is, are you now experiencing a Q that is different from what you would have experienced without a swap? But note: the swap was silent, so only you can tell."

  - **Task**: Each participant is shown a sequence: 
    1. They see a green square (or other color) and note Q1.
    2. They close their eyes for 10 seconds. During this, with 50% chance (by a coin flip done by the facilitator, but not revealed) the facilitator either does nothing or shows a different color (say, blue) that is adjusted (via an illusion) to look the same as the previous green? Actually, that might be hard. Alternatively, we can use an afterimage again: first show a green square to get a magenta afterimage, then (with eyes closed) either do nothing or show a blue square (which would cause a yellow afterimage). Then they open eyes to a white screen and see the afterimage. They must say: did a swap occur? (i.e., was the second afterimage induced by a different color?)

  But note: the participant doesn't know what color was shown while their eyes were closed. They only see the afterimage. So if they see a yellow afterimage, they know it was induced by blue, but if they see magenta, by green. But we want a silent swap: they shouldn't be able to tell by the experience? This is tricky.

  Alternative: use an illusion that can be set up to look the same via two different physical setups. But that's complex.

  Instead, we can do a thought experiment with a story and a role-play. We don't need a physical swap, we can simulate it.

  We tell the story: "We have a machine that can silently swap the color signals going to your eyes. We might have swapped the color of the square you are about to see. We will show you a square. You will experience a Q. We want to know: did we swap? That is, is the Q you are experiencing now the same as the one you would have experienced without a swap?"

  But without a swap, the square is red. With a swap, it is green but made to look red (by some filter? but then it might be detectable). This is messy.

  Better: use the afterimage method but with a twist. 
  - Step 1: Participant stares at a green square for 30 sec, then looks at white and sees magenta (Q1). 
  - Step 2: They close their eyes for 30 sec (to rest). 
  - Step 3: They open eyes and are told: "Now we are going to show you a color. It might be the same green as before, or it might be a different color (blue). But we have adjusted the room lighting so that the afterimage you see will look identical in color to the first one. In fact, we have calibrated it so that the afterimage from blue looks exactly like the afterimage from green (which is impossible by physics, but we can lie for the sake of the exercise)."

  Actually, we can't make it identical, but we can say we have a magic setup. Since it's a thought experiment, we can say: "We have a special device that can produce afterimages that look identical even if they come from different colors. We call this the 'Q-swapper'. We flipped a coin: if heads, we used the same color (green) as before. If tails, we used blue and activated the Q-swapper to make the afterimage look the same as before."

  Then the participant sees an afterimage that looks magenta (same as before). They must say: did we swap (i.e., did we use blue and the Q-swapper) or not?

  They write their belief and bet.

  **Contract for Round 3**:

  ```
  ROUND 3: WAS THERE A SILENT SWAP?

  I experienced an afterimage at time T1 (Q1). Then, after a break, I experienced another afterimage at T2 (Q2). The Q2 looked exactly the same as Q1 to me.

  I believe that:
  [ ] There was a swap (we used a different color and the Q-swapper)
  [ ] There was no swap (we used the same color)

  I wager [1] chip(s) on this belief.

  But note: The group must agree on a public criterion to settle this bet. We will use the following criterion:

  Criterion: _________________________________________________________

  Signed: __________
  ```

  - **Problem**: The participant's experience is the same regardless of swap. The only difference is the hidden physical fact. But the participant cannot tell by their experience. They might say "I feel like it's the same" but that doesn't help. The group must define a criterion. They might say: "We trust the subject's feeling" but then it's unfalsifiable and not bettable. Or they might say: "We look at the machine log" but then it's not about the experience. If they use the machine log, then the experience is irrelevant. If they use the subject's report, then the subject might just guess and have a 50% chance. There is no criterion that can settle the bet without either ignoring the experience or making it irrelevant.

  - **Scoring**: If they bet correctly, they win a chocolate. But the settlement criterion must be defined.

  ### Debrief (25-30 minutes)

  1. **Tally the outcomes**: Show on the board the criteria the group used in each round and the problems encountered. In particular, note that in Round 3, the criterion they chose either:
     - If they chose to use the machine log, then they are not betting on the experience but on the physical setup -> then the experience is not what they are staking on.
     - If they chose to use the subject's report, then it's unfalsifiable and the subject could be wrong without any way to check -> then it's not a fact that can be settled.

  2. **Reveal the point**: Now introduce the term "qualia" and explain that the group was trying to define a property that is ineffable, intrinsic, private, and immediately apprehensible. Map each round to one of the properties:
     - Round 1: Intrinsicness. By re-identifying over time, they had to use a criterion that depends on the subject's memory and discrimination, making it relational.
     - Round 2: Privacy. By comparing across subjects, they had to make it public (via report) or deny the possibility of comparison.
     - Round 3: Settlement-aptness. By the silent swap, they found that they cannot have a public criterion that respects the first-person authority without making it unfalsifiable.

  3. **Load-bearing property**: The privacy is the one that should be surrendered first? Or the intrinsicness? Actually, the settlement-aptness constraint is central: if we require that the property be something we can bet on, then it must be public. So privacy must go. But then it's not qualia anymore.

  4. **Escape routes**:
     - **Functional/relational property**: If they say that Q is defined by its role in discrimination, then that's functional and public. But then it's not intrinsic.
     - **Authority of first-person report**: But then we cannot settle disagreements or silent swaps.
     - **Ineffable property known by acquaintance**: Then we cannot define a public criterion for it -> it fails the settlement-aptness.

  5. **What the activity cannot deliver**: It cannot prove that there are no qualia, only that the concept as defined (with all four properties) is incoherent for the purpose of making factual claims. It does not address why we have subjective experience (the hard problem) or the knowledge argument (Mary's room). The facilitator must explain that the activity only shows that the bundle of properties cannot be used in a public language game of fact-stating and betting.

  ### Timeline (90 minutes total)

  - **0-5 min**: Introduction without jargon. "Today we are going to play a game about perception and decision-making. We'll be making bets with chips on private experiences. We'll do three rounds and then discuss."
  - **5-25 min**: Round 1 (20 min)
     - 5-10 min: Demonstration of afterimage (green to magenta) and instructions for Round 1.
     - 10-15 min: Participants fill contracts (individual).
     - 15-25 min: Group discussion to agree on a criterion. Facilitator writes it on the board.
  - **25-45 min**: Round 2 (20 min)
     - 25-30 min: Demonstration of the illusion (e.g., checker shadow) and instructions.
     - 30-35 min: Participants fill contracts.
     - 35-45 min: Group discussion for criterion.
  - **45-65 min**: Round 3 (20 min)
     - 45-50 min: Story of the silent swap and instructions.
     - 50-55 min: Participants fill contracts (note: the swap is hypothetical, but we can actually do a coin flip and then show either green or blue for afterimage? But we can't make the afterimage look the same. So we must rely on the story and the thought experiment. We can say: "In this round, we are doing a thought experiment. We will flip a coin and record the outcome, but we won't reveal it until settlement. We will tell you that we have a way to make the afterimage look the same regardless of the color we show. Then we show you a color (either green or blue) and you see the afterimage. But it will look the same. Then you must guess: was it the same color as before (green) or different (blue) with the swap?")
     - 55-60 min: Fill contracts.
     - 60-65 min: Group discussion for criterion.
  - **65-90 min**: Debrief (25 min)
     - 65-70 min: Tally the criteria and show the conflict. Calculate: for Round 3, if they used the subject's report, then the settlement was by the coin flip? But the subject had no idea. So the group's criterion (subject report) would be right only 50% of the time? But the point is the criterion doesn't track the swap.
     - 70-85 min: Map to properties and introduce the term "qualia". Explain the four properties and how each round challenged one.
     - 85-90 min: Address escape routes and conclude.

  ### Contracts and Scoring Rules

  - **Stakes**: Each participant starts with 3 chips (one for each round). They bet one chip per round. If they win, they get one chocolate at the end. If they lose, they lose the chip. At the end, they can exchange chips for chocolate (1 chip = 1 chocolate). But if they have no chips, they get nothing.

  - **Rule for unsettled contracts**: If the group cannot agree on a criterion in the time, then the contract is void and no one wins or loses. But the facilitator should push for a criterion. If they refuse to settle, then the bets are off and no chips are lost or won. But then the point is made: they couldn't settle.

  ### Perceptual Manipulation Details

  For Round 1 and 3, we use afterimages:
  - Green square (RGB: 0,255,0) for 30 seconds -> afterimage on white is magenta (pinkish).
  - Blue square (0,0,255) -> afterimage is yellow.

  But note: the afterimages are not exactly the same. So in Round 3, we must lie and say we have a way to make them look the same. We can say: "We have a special filter that alters the afterimage color so that both appear identical." We don't actually do it, just in the story.

  For Round 2, we use the checker shadow illusion. We can show an image like Adelson's checkerboard. We point to two squares that are physically the same gray level but look different. We ask two participants to report the shade (light or dark) of each. They might disagree? Actually, they are likely to both say that one looks light and one looks dark. Then we can ask: but are the Qs (the experiences of the two squares) the same? And then we can compare two participants: do they have the same experience of the same square? We show the same square (say, the one in shadow) to both and ask if their experience of that square is the same.

  ### Predictable Problems and Fixes

  1. **Problem**: A participant names the point (e.g., "This is about qualia!") in the first 10 minutes.
     - **Fix**: The facilitator says: "That's an interesting idea, but let's see what the group discovers through the activity. We'll discuss theories at the end."

  2. **Problem**: A participant declares every contract unverifiable and refuses to define a criterion.
     - **Fix**: The facilitator says: "In this game, we are trying to see if we can design a criterion. Let's try to come up with the best we can. If we can't, that's a result too, but we must record that we couldn't."

  3. **Problem**: A participant proposes settling by neural measurement.
     - **Fix**: The facilitator asks: "What neural measurement would you use? How would we know which neural pattern corresponds to which Q? We don't have access to that now. We must use what we can observe publicly today." Then, if they insist, in the debrief we can discuss: if we had a perfect brain scanner, then we could use that. But then the property becomes a physical property, not private and ineffable.

  4. **Problem**: The whole thing collapses into the problem of other minds (how do I know others have experiences?).
     - **Fix**: The facilitator says: "For the purpose of this activity, we are assuming that others have experiences. We are trying to see if we can make factual claims about the nature of those experiences that we can settle."

  ### What the Activity Cannot Deliver

  The activity shows that if we try to treat qualia (as defined by the four properties) as a bettable fact, we run into contradictions. But it does not show that there is no such thing as subjective experience. It also does not address the knowledge argument (Mary in the black-and-white room) because that argument does not require qualia to be bettable facts. The facilitator must explain that the activity is about the coherence of the concept in a public language of fact, not about the existence of subjective experience.

  The facilitator will have to say: "This activity does not prove that there is no such thing as subjective experience. It shows that if we try to define it as a bundle of properties that are ineffable, intrinsic, private, and immediately apprehensible, then we cannot use it to make claims that can be settled by evidence. Therefore, if we want to talk about experience in a way that allows us to make factual claims and bets, we must drop at least one of those properties."

  This is the part that words must supply because the activity only produces the conceptual squeeze. The metaphysical conclusion (that qualia do not exist) requires an additional argument that the bundle is the only way to think about subjective experience, which the activity does not do.

  ---

  Now, we write the detailed plan accordingly.
answer: |-
  Below is a detailed activity design that meets all your constraints and goals. The session creates an experiential "conceptual squeeze" around a private property (later revealed as qualia) through three rounds of adjudication tasks. Participants confront the settlement-aptness constraint by designing public criteria for private claims, leading to contradictions. The debrief maps the collapse to the four properties of qualia and addresses common escape routes.

  ---

  ### **Session Blueprint: "The Experience Ledger"**  
  **Total Time:** 90 minutes  
  **Stakes:** Chocolate coins (1 per round). Participants start with 3 chips (1 per round). Winning a bet earns a chocolate; losing forfeits a chip.  

  ---

  ### **Setup (5 minutes)**  
  - **Materials:** Projector, index cards (15 sets, pre-stapled as packets), pens, chocolate coins, poker chips (3 per participant), coin for R3.  
  - **Perceptual Manipulation:** Use **color afterimages** (green → magenta; blue → yellow). Test projector for bright saturated colors.  
  - **Facilitator Script:**  
    > "Today we’ll play a game about verifying claims. We’ll use chips to bet on private experiences, like the color you see in your mind. You’ll define rules to settle disputes. We’ll do three rounds, then discuss. No deep philosophy—just solve problems."  

  ---

  ### **Round 1: Re-identification Over Time (20 min)**  
  *Tests intrinsicness → reveals relational dependency.*  
  **Manipulation:** Project green square (30 sec); switch to white for magenta afterimage. Repeat with blue square → yellow afterimage.  
  **Task:** Bet on whether *your own* afterimage-experience (call it "Glip") at Time 2 is the "same" as Time 1.  

  - **Index Card Contract:**  
    ```
    ROUND 1: SAME GLIP?  
    My Glip at Time 1 [ ] is / [ ] is not the same as my Glip at Time 2.  
    I bet [1] chip on this.  

    GROUP SETTLEMENT RULE: "We decide sameness by: ________________________."  
    [e.g., "the color name I say," "how long it lasts"]  
    ```  
  - **Facilitator Actions:**  
    - 0–5 min: Demo afterimages; participants write bets.  
    - 5–15 min: Groups of 3 discuss settlement rules. *Silence strategy:* Note who pushes "subjective feel" vs. "behavior."  
    - 15–20 min: Whole group agrees on one rule (e.g., "same if the subject says same color"). Write rule on board.  
  - **Collapse:** Rule relies on memory/discrimination → Glip is relational, not intrinsic.  

  ---

  ### **Round 2: Comparison Across Subjects (20 min)**  
  *Tests privacy → reveals publicity.*  
  **Manipulation:** Project Adelson’s checker-shadow illusion (two physically identical gray squares; one *looks* darker).  
  **Task:** Bet on whether Volunteer A and Volunteer B have the "same" Glip for the *same square*.  

  - **Index Card Contract:**  
    ```
    ROUND 2: SAME GLIP ACROSS TWO PEOPLE?  
    Volunteer A’s Glip [ ] is / [ ] is not the same as Volunteer B’s.  
    I bet [1] chip on this.  

    GROUP SETTLEMENT RULE: "We decide sameness by: ________________________."  
    [e.g., "if both say the same word," "if they point to the same color"]  
    ```  
  - **Facilitator Actions:**  
    - 20–25 min: Demo illusion; A and B report experiences (often disagree). Participants bet.  
    - 25–30 min: Groups discuss rules. *Silence strategy:* Listen for "brain scan" proposals.  
    - 30–40 min: Whole group agrees on rule (e.g., "same if both say 'light gray'"). Write rule.  
  - **Collapse:** Rule requires public report → Glip is checkable, not private.  

  ---

  ### **Round 3: Silent Swap (20 min)**  
  *Tests settlement-aptness → reveals unfalsifiability.*  
  **Manipulation:** Tell participants: "We secretly flipped a coin. Heads: we showed you the *same* afterimage setup as Round 1. Tails: we *swapped* to a new setup that creates an identical-looking Glip." (No actual swap; all see green→magenta. Coin flip is hidden.)  
  **Task:** Bet on whether a swap occurred.  

  - **Index Card Contract:**  
    ```
    ROUND 3: WAS THERE A SECRET SWAP?  
    [ ] Swap occurred / [ ] No swap occurred.  
    I bet [1] chip on this.  

    GROUP SETTLEMENT RULE: "We decide by: ________________________."  
    [e.g., "the facilitator’s coin," "the subject’s confidence"]  
    ```  
  - **Facilitator Actions:**  
    - 40–45 min: Explain swap story; show green→magenta again. Participants bet.  
    - 45–50 min: Groups debate rules. *Silence strategy:* Watch for frustration.  
    - 50–60 min: Whole group agrees on rule. Write rule.  
  - **Collapse:**  
    - If rule uses "subject’s report" → unfalsifiable (no stake possible).  
    - If rule uses "coin result" → Glip is irrelevant to settlement.  

  ---

  ### **Debrief (25 min)**  
  **Goal:** Reveal qualia bundle; show contradictions; address escape routes.  

  1. **Tally the Collapse (5 min):**  
     - Board Example:  
       ```  
       R1 Rule: "Subject’s color report" → But afterimages physically changed → Rule ignores stimuli.  
       R2 Rule: "Both say same word" → But illusion tricks perception → Rule ignores experience.  
       R3 Rule: "Subject’s confidence" → Coin = heads; 50% wrong → Rule fails settlement.  
       ```  
     - **Key Point:** The group’s rules either ignored Glip (made it irrelevant) or were unfalsifiable.  

  2. **Introduce Qualia (5 min):**  
     > "You debated a property philosophers call *qualia*: private, ineffable, intrinsic experiences. We tested four claims:  
     > - R1: Qualia are *intrinsic* (but you needed relational rules).  
     > - R2: Qualia are *private* (but you made them public).  
     > - R3: Qualia are *immediately apprehensible* (but you couldn’t settle swaps).  
     > The fourth? *Ineffability*—your rules failed because words couldn’t capture Glip."  

  3. **Load-Bearing Property & Escape Routes (10 min):**  
     - **Privacy is load-bearing:** Surrender it first to make qualia "settlement-apt," but then they cease to be qualia.  
     - **Escape Routes (facilitator prompts):**  
       - *Functional retreat:* "What if Glip is just discrimination ability?" → Then R1’s rule works, but Glip isn’t intrinsic.  
       - *1st-person authority:* "Why not trust the subject?" → Then R3’s rule fails, and bets are meaningless.  
       - *Ineffability:* "Glip is indescribable!" → Then no rule can be written, dissolving all contracts.  

  4. **What the Activity Can’t Do (5 min):**  
     > "This shows qualia *as defined* can’t support facts or bets. It doesn’t:  
     > - Disprove subjective experience (why consciousness exists).  
     > - Address the ‘knowledge argument’ (e.g., Mary the neuroscientist).  
     > Why? Metaphysical conclusions need words, not activities. No payoff structure can simulate ‘what experience is’—only expose conceptual traps."  

  ---

  ### **Predictable Problems & Repairs**  
  1. **Problem:** Participant names "qualia" early.  
     - **Repair:** "Let’s use your term ‘Glip’ for now. We’ll compare later."  

  2. **Problem:** Participant declares all contracts "unverifiable."  
     - **Repair:** "Your job is to design the *best possible* rule. If none work, we’ll record that." (In debrief, highlight this as evidence.)  

  3. **Problem:** Proposes neural measurements.  
     - **Repair:** "Pretend we have a brain scanner. What pattern = ‘same Glip’? What if two brains differ but subjects report sameness? Your rule must fix this." (Debrief: Neural rules make qualia physical, not private.)  

  4. **Problem:** Collapses into "other minds" skepticism.  
     - **Repair:** "Assume others have experiences. Focus on: can we *settle claims* about them?" (Debrief: Other minds deepen the problem but don’t resolve settlement.)  

  ---

  ### **Why Words Are Necessary for the Metaphysical Conclusion**  
  The activity forces participants to confront the **procedural impossibility** of using qualia in a fact-stating practice. However, it cannot simulate the **metaphysical intuition** that qualia exist independently (e.g., "I know my pain is real!"). This gap requires the facilitator to argue:  
  > "Your rules failed because qualia, as private/ineffable/intrinsic, can’t play by the rules of public facts. But nothing in the *activity* stops you from believing they exist ‘outside’ language. That’s a philosophical leap—one you must weigh against the settlement-aptness constraint."  

  No incentive structure can replace this, as the very act of "betting" presupposes a public framework qualia evade. The debrief bridges the experiential squeeze to the metaphysical claim.  

  ---  
  This design ensures participants "walk into the walls" of the qualia bundle through hands-on adjudication, using minimal resources. The perceptual manipulation (afterimages) is reliable and cheap, and the debrief explicitly separates the conceptual argument from untouched territory (e.g., the hard problem).
