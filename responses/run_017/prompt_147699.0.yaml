answer: |-
  Below is a comprehensive design for your 90-minute session, centered around a card game that illustrates the unilateralist's curse through experiential learning. The design prioritizes minimal prep, scalable materials, and clear debriefing. I'll address all constraints, variants, practicalities, and your "honest assessment" points.

  ---

  ### **Game Design: "The Launch Decision"**
  **Core Mechanics**  
  - **Hidden State**: Each round, the world is in **Good** (G) or **Bad** (B) state (50% prior probability).  
  - **Private Signal**: Each player receives a private signal: "g" (suggesting Good) or "b" (suggesting Bad).  
  - **Signal Accuracy**: 70% (i.e., P("g"|G) = 0.7; P("b"|B) = 0.7). Independent across players.  
  - **Decision**: Players simultaneously decide to **Launch** (L) or **Not Launch** (N).  
  - **Outcome**:  
    - If **anyone** Launches, action occurs (shared payoff).  
    - If **no one** Launches, status quo (payoff = 0).  
  - **Payoffs (Points)**:  
    | State | Action Launched | Status Quo (No Launch) |  
    |-------|-----------------|------------------------|  
    | Good  | **+10**         | 0                      |  
    | Bad   | **-20**         | 0                      |  

  **Why These Numbers?**  
  - **Single Decider Rationality Check**:  
    - P(G|"g") = [0.7 × 0.5] / [(0.7×0.5) + (0.3×0.5)] = 0.7.  
    - EV(Launch | "g") = (0.7 × 10) + (0.3 × -20) = 7 - 6 = **+1** (barely positive; rational to Launch).  
    - EV(Launch | "b") = (0.3 × 10) + (0.7 × -20) = 3 - 14 = **-11** (rational to Not Launch).  
    → A solo player with "g" is rational to Launch, but cautiously.  

  - **Curse with 20 Players**:  
    - P(At least one Launch in Bad state) = 1 - P(All "b" | B) = 1 - (0.7)^20 ≈ **1.0** (near certainty).  
    - P(At least one Launch in Good state) = 1 - (0.3)^20 ≈ **1.0** (near certainty).  
    - EV(20 players) = 0.5×(10 × P(Launch|G)) + 0.5×(-20 × P(Launch|B)) ≈ 0.5×(10×1) + 0.5×(-20×1) = **-5**.  
    → Worse than status quo (0).  

  - **Asymmetry with Group Size**:  
    | Group Size (n) | P(Launch | G) | P(Launch | B) | EV (Per Round) |  
    |----------------|---------------|---------------|----------------|  
    | 1              | 0.7           | 0.3           | **+0.5**       |  
    | 4              | 0.992         | 0.76          | **-2.64**      |  
    | 20             | ~1.0          | ~1.0          | **-5.00**      |  
    → Damage grows because P(Launch|B) (false positives) increases steadily with n, while P(Launch|G) (true positives) saturates quickly.  

  **Scoring & Stakes**  
  - **Points Worth**: 1 point = 1 "token" (use poker chips or tally marks). No cash value—emphasize learning.  
  - **Shared Stakes**: Use a **public scoreboard** for group totals. Announce: *"Your decisions affect everyone's score. We succeed or fail together."*  
  - **No Individual Scores**: Do not track/reveal individual decisions. Collect decisions anonymously (folded slips).  

  ---

  ### **Session Structure (90 Minutes)**  
  **Materials**:  
  - 1 coin (state determiner).  
  - 2 bags for signals:  
    - **Bag G**: 7 "g" cards, 3 "b" cards (simulate P("g"|G)=0.7).  
    - **Bag B**: 3 "g" cards, 7 "b" cards (simulate P("g"|B)=0.3).  
  - Decision slips (paper squares) and pens.  
  - Public scoreboard (whiteboard or poster).  
  - Envelopes for variant rounds (optional).  

  **Timeline**:  
  | Time  | Activity                                                                 | Details |  
  |-------|--------------------------------------------------------------------------|---------|  
  | 0-5   | **Intro** (Whole group)                                                  | - Explain rules, payoffs, signals. Use the scoreboard. Emphasize: *"No talking during decisions. Rational choice: Launch only on 'g'."* |  
  | 5-25  | **Block 1: Group of 20** (5 rounds)                                      | **Per Round (4 min)**:<br>1. **Flip coin**: Heads=Good, Tails=Bad (hidden).<br>2. **Draw signals**: Pass Bag G (if G) or Bag B (if B). Each player draws 1 private card.<br>3. **Decide**: Players write "L" or "N" on slips (no discussion). Collect slips in a box.<br>4. **Reveal**: Announce state, whether Launched, and points. Update scoreboard. |  
  | 25-40 | **Block 2: Groups of 4** (5 groups, 3 rounds/group)                     | - Split into 5 groups (4 players each). Give each group a coin and bags.<br>**Per Round (5 min)**:<br>1. **Group flip/draw**: Facilitator (one per group) flips coin, uses bag.<br>2. **Decide**: Players write "L"/"N" privately.<br>3. **Reveal**: Group facilitator announces outcome. Record group score.<br>→ After 3 rounds, groups report average score to main scoreboard. |  
  | 40-50 | **Variant Rounds** (Whole group)                                         | **Variant 1: Better-Informed Expert** (Round 6):<br>- Secretly assign one player as "expert." They draw **2 signals** (e.g., two cards from the bag). Others draw one. *Reveal after: "Did we waste the expert's knowledge by letting anyone launch?"*<br>**Variant 2: Correlated Signals** (Round 7):<br>- Draw **one shared signal** for the whole group (all get identical card). *Reveal after: "Why did the curse vanish?"* |  
  | 50-65 | **Debrief** (Whole group)                                                | See debrief script below. |  
  | 65-90 | **Discussion**                                                           | Open Q&A on real-world parallels. |  

  **Enforcing Silence**:  
  - Use a "silence bell" (ring to start/end decision time).  
  - Frame it as **"focus time"** (not compliance): *"This silence ensures your private signal isn't influenced. Take 60 seconds to decide."*  
  - Anonymize decisions (slips in a box).  

  ---

  ### **Variant Rounds**  
  1. **Better-Informed Expert** (Reveals: *Does deference discard good evidence?*):  
     - One player gets two independent signals (70% accuracy each).  
     - Rational play: Launch only if both signals are "g" (P(G|"g,g") ≈ 0.845 → EV≈+5.35).  
     - **Post-Round Question**: *"The expert had stronger evidence, but could they stop a reckless launch? Does requiring consensus waste their insight?"*  

  2. **Correlated Signals** (Reveals: *Independence of errors drives the curse*):  
     - All players receive the **same signal** (one draw from the bag).  
     - **Outcome**: EV≈+0.5 (matches solo player). Curse vanishes because errors aren't independent.  
     - **Post-Round Question**: *"Why did group size not matter here? What does this say about real-world echo chambers?"*  

  > *Why not "Default Flip" variant?* It elongates debrief (requires re-explaining rules). Correlated signals and expert variants best contrast the core lesson. If you prefer Default Flip, swap it in—but it dilutes time for the key curse mechanic.

  ---

  ### **Debrief (5-Minute Script)**  
  **Step 1: Show the Pattern**  
  *"In the group of 20, our average score was [insert result]—likely negative. In groups of 4, it was [result]—better but still poor. Why?  
  - With 20 people, even if each of you is rational, the chance that *someone* gets a false 'g' in a Bad world nears 100%.  
  - In a Good world, the chance someone gets a true 'g' is already 99% with just 4 people—adding more doesn't help.  
  → **The curse: More deciders = more false launches.**"*  

  **Step 2: Fix the Threshold**  
  *"How do we fix this? Not by urging 'be more careful'—you were already rational! Instead, change the decision rule:  
  - **Solo**: Launch if you see "g" (threshold = 1/1).  
  - **Group of 20**: Launch only if, say, 5+ people see "g".  
  Why? We need a threshold (k) that scales with group size (N) to keep false positives low.  
  - *Calculus*: For N people, set k such that P(Launch|B) stays low. E.g., k ≈ 0.3N (launch only if 30%+ see "g")."*  

  **Step 3: What Follows**  
  *"This means:  
  1. Adding decision-makers can *worsen* group rationality if the threshold isn't adjusted.  
  2. The fix isn't about individual caution—it's about **institutional design** (e.g., requiring committees, not unilateral action).  
  3. Variants showed:  
     - Experts help only if we **centralize decisions** (deference works).  
     - **Independent errors** are the curse's engine (correlated signals remove it)."*  

  ---

  ### **Honest Assessment**  
  **1. Predictable Problems**:  
     - **Never-Launcher/Always-Launcher**: Some will deviate from rationality (e.g., principled pacifist or reckless optimist).  
       - *Mitigation*: Stress *"rational play is key to learning—please follow EV math"* in intro. If outliers persist, use their decisions to discuss real-world biases (e.g., *"How do ideologies distort thresholds?"*).  
     - **Noise in Small Rounds**: With few rounds, results may stray from EV (e.g., 20-player group might "luck out" and avoid disaster).  
       - *Fix*: Use pre-generated states/signals (not live draws) to ensure "Bad" states occur. Share expected values in debrief to override noise.  

  **2. What the Game Misses**:  
     - **Catastrophic Stakes**: Real unilateral risks (e.g., nuclear launch) involve massive downsides with tiny probabilities. The game uses manageable payoffs (-20) for clarity—but this undersells paralysis in high-stakes cases.  
     - **Contested Preferences**: Players assume shared payoffs. Reality: some value action/status quo differently (e.g., a CEO's bonus for risk-taking). This limits generalizability to polarized groups.  
     - **Reputational Incentives**: No penalty for being "the one who launched and failed." In reality, individuals avoid blame—making launches *less* likely than the game predicts.  

  **3. False Impression to Correct**:  
     - *"The game implies the curse is solved by adjusting thresholds. But thresholds assume honest signal-sharing! In reality, people lie or withhold signals (e.g., corporate politics). The curse returns if we can't trust reports.*"  
     - Correct loudly: *"Mechanisms like voting or expert delegation only work with transparency. Without it, we get new dysfunctions (e.g., groupthink)."*  

  ---

  This design balances experiential learning with theoretical depth. It fits 90 minutes, uses low-cost materials, and ensures the curse emerges from gameplay—not lecture. Run groups of 4 and 20 back-to-back to make asymmetry visceral, and leverage variants to highlight key nuances.
