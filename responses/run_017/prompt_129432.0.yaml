prompt: |-
  I'm the director of program ops at a mid-sized regional workforce nonprofit, and over the next year every contract we have is moving to outcomes-based payment: we propose the numbers, the state agency has to approve them, and somewhere between 40 and 60 percent of our funding sits on top of them. So a few times a month I'm going to be sitting there with a proposed metric in front of me, about a day to think about it, a board that wants money at risk to look like confidence, and a program staff who will quietly reorganize their entire week around whatever I pick. I'd like a written procedure my team can run on each candidate metric before it goes into a contract.

  The problem I keep running into is that "watch out for gaming" is too vague to be useful, and the standard advice I've seen either collapses into "measure everything" (we can't — we can properly audit maybe two things a quarter, the rest we get self-reported) or into "just use judgment" (which is what got us here). I've started sorting failure modes myself and I think there are at least five different things going on: hitting the number by serving people we'd have served anyway; sorting who we serve so the easy cases are the ones who count; the ratchet, where a good year becomes next year's floor; collateral, where something nobody put a number on gets worse while the headline improves; and what I think of as plain decay, where the proxy just stops tracking the thing we cared about over a couple of years even though nobody is cheating. I'd like you to clean that taxonomy up, throw away the parts that don't earn their keep, and add whatever's missing.

  What I actually need:

  - the questions in the order to ask them, and what counts as a real answer to each one rather than a shrug
  - where the procedure just stops with a no, and where it has to hand the question to a person because it's a values call and not a factual one
  - a distinction between metrics that are safe to put money on and metrics that are fine to report but must never carry payment — and what to do when the funder insists that at least three of the payment metrics be ours and at least half the money be at risk, so "use none of them" isn't available
  - a one-page version, plus a one-sentence plain-English "why this step" line under each question, because I have to defend the whole thing to a board member who will ask why we're making this so complicated
  - an honest note on which steps are judgment calls wearing a lab coat, and what the procedure deliberately doesn't try to do

  Then run the whole thing on three candidates: share of participants still employed 90 days after exit; median hourly wage at placement; and number of participants who complete a credential. That last one is the funder's favorite and my staff's favorite, and I have a bad feeling about it, so if the procedure says it can't carry money, say so plainly. And tell me what I'm supposed to do mid-contract when a metric that passed the procedure starts to look wrong, since nothing we sign is shorter than three years.
reasoning: |-
  We are designing a procedure to evaluate candidate metrics for outcomes-based payment contracts. The goal is to avoid common pitfalls (gaming, misalignment, decay) while being practical and defensible.

  The taxonomy of failure modes provided:
  1. **Serving the already-served**: Hitting the number by serving people who would have succeeded anyway (cream-skimming).
  2. **Sorting/Cream-skimming**: Selecting easy cases to make the metric look good.
  3. **The ratchet effect**: A good performance becomes the next year's floor, making it unsustainable.
  4. **Collateral damage**: Neglecting unmeasured areas that get worse while the measured one improves.
  5. **Proxy decay**: The metric stops tracking the intended outcome over time, even without cheating.

  We'll refine this into a set of questions. The procedure should:
  - Be sequential, with clear pass/fail or escalation points.
  - Distinguish between metrics that are safe for payment and those that are only for reporting.
  - Include a one-page version with a one-sentence rationale per step.
  - Note which steps are judgment calls.

  ### Proposed Evaluation Framework (Full Version)

  #### Step 1: Alignment with Mission
  - **Question**: Does the metric directly measure a core outcome that our organization exists to achieve? 
  - **Rationale (one-sentence)**: We must ensure that the metric reflects our true mission, not just what is easy to measure.
  - **What counts as an answer**: A clear yes, with a written statement of how the metric ties to the mission. If no, the metric is rejected for payment and reporting. If unsure, it's a judgment call (escalate to leadership).
  - **Judgment call?**: Yes (requires interpretation of mission). If the metric doesn't align, it's a hard stop.

  #### Step 2: Directness and Control
  - **Question**: Is the outcome directly influenced by our program's activities, and do we have significant control over it?
  - **Rationale**: Metrics that are too distal or outside our control are vulnerable to external factors and may not reflect our effort.
  - **What counts as an answer**: 
    - Pass: The outcome is primarily a result of our program (e.g., training completion) and we have high control.
    - Fail: The outcome is heavily influenced by external factors (e.g., overall economy for employment). 
    - If partial control, it may be acceptable for reporting but not for payment, unless we can adjust for external factors (which requires data and methods we may not have).
  - **Judgment call?**: Partially. We must assess the degree of control and influence.

  #### Step 3: Gaming Resistance (Cream-skimming and Serving the Already-Served)
  - **Question**: Can this metric be gamed by selecting easier-to-serve participants or by serving those who would have succeeded without us?
  - **Rationale**: Prevents perverse incentives that undermine equity and effectiveness.
  - **What counts as an answer**:
    - Pass: The metric includes adjustments for participant characteristics (e.g., risk-adjusted) or is defined in a way that makes cream-skimming unprofitable (e.g., by measuring progress from baseline). 
    - Fail: The metric is a simple outcome (e.g., employment rate) without any safeguards. 
    - If it can be gamed, it should not carry payment. We might use it for reporting if we can monitor for gaming (but that requires audit capacity).
  - **Judgment call?**: Yes, requires imagining potential gaming scenarios.

  #### Step 4: Collateral Damage Check
  - **Question**: Could optimizing for this metric lead to significant negative consequences in unmeasured areas (e.g., reduced service quality, equity issues, or neglect of hard-to-serve populations)?
  - **Rationale**: Ensures that chasing one metric doesn't harm other important outcomes.
  - **What counts as an answer**:
    - Pass: We have evidence (or strong reason) that the metric does not conflict with other important goals, or we have complementary metrics in place to guard against this.
    - Fail: There is a clear risk of harm (e.g., pushing participants into low-quality jobs to hit employment numbers). 
    - If the risk is high, the metric should not carry payment. It might be acceptable for reporting if monitored.
  - **Judgment call?**: Yes, requires considering unintended consequences.

  #### Step 5: Proxy Validity and Stability (Proxy Decay)
  - **Question**: Is the metric a stable proxy for the long-term outcome we care about, and how might it decay over the contract period?
  - **Rationale**: Avoids using metrics that become outdated or lose their connection to the real goal.
  - **What counts as an answer**:
    - Pass: The metric has a proven track record of correlating with the desired outcome and is unlikely to change in meaning (e.g., credential completion in a stable industry).
    - Fail: The metric is a weak proxy (e.g., short-term employment when we care about career growth) or is in a field where the meaning of the metric might change (e.g., due to technological shifts).
    - If it's a weak proxy, it should not carry payment. It might be used for reporting if it's the best available.
  - **Judgment call?**: Yes, requires forecasting future relevance.

  #### Step 6: Ratchet Effect Mitigation
  - **Question**: Can we structure the payment to avoid punishing success (e.g., by using improvement-based targets or multi-year averaging) even if the funder sets a higher baseline next year?
  - **Rationale**: Prevents setting unsustainable expectations after a good year.
  - **What counts as an answer**:
    - This is not a pass/fail for the metric itself, but a design step for the contract. If we can negotiate ratchet-proof terms (e.g., targets based on a moving average or cohort characteristics), then the metric is safer. If not, the metric might still be used but we must be aware of the risk.
    - Note: This step doesn't reject a metric but informs how we set targets and structure payments.
  - **Judgment call?**: Partially, but also a negotiation point with the funder.

  #### Step 7: Auditability
  - **Question**: Can we afford to verify this metric with the required frequency and accuracy given our audit capacity?
  - **Rationale**: We can only base payments on metrics we can reliably audit.
  - **What counts as an answer**:
    - Pass: We have a cost-effective method to audit the metric (e.g., using state wage data, or with a sample-based approach) and it fits within our audit budget.
    - Fail: The metric requires expensive or infeasible audits (e.g., self-reported data without verification). 
    - If it fails, the metric cannot carry payment. It might be used for reporting if self-reported and we accept the lower accuracy.
  - **Judgment call?**: Partly, but we can estimate audit costs.

  #### Summary of Decision Rules:
  - **Safe for Payment**: Passes Steps 1-5 and 7. Step 6 is a contract design issue but doesn't inherently disqualify.
  - **Reporting Only**: Fails one or more of Steps 1-5 but is still useful for insight (and if it fails Step 7, it must be auditable enough for reporting).
  - **Reject**: Fails Step 1 (mission misalignment) or Step 7 (if required for payment and not auditable).

  #### What to do when the funder insists on using our metrics for payment?
  - We must have at least three payment metrics and at least half the money at risk. Then:
    - Use the safest metrics that pass the procedure.
    - For metrics that are weak but required, try to:
        - Adjust the payment structure (e.g., lower weight, use as a gate but not the primary driver).
        - Include safeguards (e.g., caps on payments, or paired with equity metrics).
        - Negotiate with the funder for better terms (e.g., risk adjustment, longer time horizons).

  #### Mid-Contract Metric Failure:
  - Build in contract clauses for metric review and renegotiation (e.g., annual reviews, with agreed-upon triggers for change).
  - Monitor leading indicators that the metric might be decaying or being gamed (e.g., participant characteristics shifting, unexpected drops in other outcomes).
  - If a metric starts to look wrong, document the evidence and initiate renegotiation. Have a backup plan (e.g., shift weight to other metrics, adjust targets).

  ### One-Page Version of the Procedure

  **Metric Evaluation Checklist**

  1. **Mission Alignment**: Does this metric directly reflect our core mission?  
     *Why: We don't get paid for off-mission outcomes.*  
     *Action*: If no, reject. If yes, proceed.

  2. **Control**: Do we have significant control over this outcome?  
     *Why: We shouldn't be penalized for things outside our control.*  
     *Action*: If low control, use for reporting only. If high, proceed.

  3. **Gaming Resistance**: Is it hard to game by cherry-picking participants or serving those who don't need us?  
     *Why: Prevents undermining equity and real impact.*  
     *Action*: If vulnerable, not for payment. If resistant, proceed.

  4. **Collateral Damage**: Could focusing on this hurt other important outcomes?  
     *Why: Avoids unintended harm.*  
     *Action*: If high risk, not for payment. If low, proceed.

  5. **Proxy Stability**: Will this metric stay relevant for the contract duration?  
     *Why: Proxies that decay lead to paying for the wrong thing.*  
     *Action*: If unstable, not for payment. If stable, proceed.

  6. **Ratchet Effect**: Can we structure targets to avoid punishing success?  
     *Why: Good performance shouldn't set impossible future targets.*  
     *Action*: Not a pass/fail, but negotiate contract terms.

  7. **Auditability**: Can we verify this metric within our audit budget?  
     *Why: Unverifiable metrics invite error or fraud.*  
     *Action*: If not auditable, not for payment. If yes, it can be used.

  **Final Decision**:
  - Passed all 1-5 and 7? **Safe for Payment**.
  - Failed 2,3,4,5, or 7? **Reporting Only**.
  - Failed 1? **Reject entirely**.

  *Note: Steps 2-5 are judgment calls. We use evidence and scenarios to make these calls, but they are not purely objective.*

  ### Testing Three Candidate Metrics

  #### Candidate 1: Share of participants still employed 90 days after exit
  1. **Mission Alignment**: Yes (employment sustainability is core).
  2. **Control**: Moderate. We influence through training and support, but job retention also depends on employer and economy. *Judgment*: Partial control → **Reporting only for payment?** (But if we must use it, we might use with caution).
  3. **Gaming Resistance**: Low. We can cherry-pick job-ready participants and avoid those with barriers. *Judgment*: Vulnerable → **Not safe for payment**.
  4. **Collateral Damage**: Risk of pushing participants into unstable jobs to hit the 90-day mark. *Judgment*: Moderate risk → **Caution**.
  5. **Proxy Stability**: Moderate. 90-day employment is a standard proxy for job stability, but it might not predict long-term success. *Judgment*: Acceptable for now → **Pass**.
  6. **Ratchet Effect**: Negotiate for risk-adjusted targets or improvement-based metrics.
  7. **Auditability**: High if using state wage data. *Pass*.

  **Verdict**: Due to low gaming resistance and partial control, **not safe for payment**. Use for reporting only.

  #### Candidate 2: Median hourly wage at placement
  1. **Mission Alignment**: Yes (quality jobs are part of the mission).
  2. **Control**: Low. Wages are set by the market and employers. We can train for higher-wage skills, but not directly control offers. *Judgment*: Low control → **Reporting only for payment**.
  3. **Gaming Resistance**: Medium. We might focus on high-wage industries and avoid serving low-wage seekers, but wage is less gameable than employment rate. *Judgment*: Somewhat resistant → **Conditional pass**? (But low control is already a problem).
  4. **Collateral Damage**: Risk of neglecting participants who cannot get high-wage jobs (equity issue). *Judgment*: Moderate risk → **Caution**.
  5. **Proxy Stability**: High. Wage is a direct measure of job quality. *Pass*.
  6. **Ratchet Effect**: Negotiate for inflation-adjusted targets.
  7. **Auditability**: Medium. Can use offer letters or wage data. *Pass*.

  **Verdict**: Due to low control, **not safe for payment**. Use for reporting.

  #### Candidate 3: Number of participants who complete a credential
  1. **Mission Alignment**: Yes (skill building is core).
  2. **Control**: High. We design the program and support completion. *Pass*.
  3. **Gaming Resistance**: Medium. We could lower standards to pass more people, or recruit participants more likely to complete. *Judgment*: Vulnerable to lowering standards → **Not safe without safeguards**.
  4. **Collateral Damage**: Risk of focusing on credential completion at the expense of real learning or job fit. *Judgment*: Moderate risk → **Caution**.
  5. **Proxy Stability**: Medium. The value of a credential may decay if the job market changes, but it's generally stable. *Pass*.
  6. **Ratchet Effect**: Negotiate for targets based on participant characteristics (e.g., prior education).
  7. **Auditability**: High. We can verify completion internally. *Pass*.

  **Verdict**: It has high control and auditability, but the gaming risk (especially lowering standards) is significant. **Not safe for payment** without strong safeguards (e.g., third-party assessments, random audits of skill retention). If the funder insists, use it but:
     - Pair with a quality metric (e.g., employer satisfaction or post-placement performance).
     - Lower the weight (e.g., not more than 20-30% of payment).
     - Implement internal audits of credential quality.

  ### Summary for the Board Member

  **Why the procedure?**  
  "To ensure we only put money on metrics that truly reflect our impact, can't be gamed, and won't harm our participants or mission — because we can't audit everything and judgment alone hasn't worked."

  ### Mid-Contract Metric Failure

  If a metric that passed starts to look wrong:
  1. **Detect**: Monitor for warning signs (e.g., shifts in participant demographics, drops in unmeasured outcomes, external changes).
  2. **Document**: Collect evidence of decay or gaming.
  3. **Renegotiate**: Use contract review clauses to adjust metrics, targets, or weights. Propose alternatives that pass the procedure.
  4. **Mitigate**: Temporarily shift focus to other metrics or adjust program practices to realign the metric.

  **Prevention**: Build in annual metric reviews and renegotiation rights in the contract.
answer: |-
  Below is a comprehensive yet practical written procedure for evaluating outcomes-based payment metrics. It's designed to be run by your team in **under a day** per metric, with clear pass/fail gates, escalation points, and distinctions between payment-safe vs. reporting-only metrics. I've refined your taxonomy into four core failure modes (collapsing "serving the already-served" and "sorting" into **cream-skimming**, while keeping **ratchet effect**, **collateral damage**, and **proxy decay**). I've added **verifiability** as a missing critical risk.

  The procedure prioritizes questions that **must be answered factually** (using data or documented evidence) and flags where judgment is unavoidable. It assumes two constraints: 
  - You can only audit 2 metrics/quarter properly.
  - Funders require ≥3 payment metrics with ≥50% of funding at risk.

  ---

  ### **One-Page Procedure: Metric Evaluation Checklist**  
  *(Rationale in plain English under each question; full details in the expanded section)*  

  1. **Is this outcome core to our mission and directly tied to our intervention?**  
     *Why: Paying for off-mission outcomes wastes resources and distorts priorities.*  
     → *If NO: Reject for payment AND reporting. Escalate to CEO/Board if alignment is ambiguous.*  

  2. **Can we verify this metric rigorously within our audit capacity?**  
     *Why: Unverified metrics invite errors or fraud we can’t catch.*  
     → *If NO: Never use for payment. Reporting only if self-reporting is acceptable.*  

  3. **Is the metric resistant to cream-skimming (e.g., by excluding hard-to-serve participants)?**  
     *Why: Cream-skimming harms equity and inflates success artificially.*  
     → *If NO: Not payment-safe. Use for reporting only if paired with equity safeguards.*  

  4. **Does improving this metric risk significant collateral damage to unmeasured outcomes?**  
     *Why: Optimizing one number can sabotage other critical goals (e.g., job quality).*  
     → *If YES: Not payment-safe. Reporting only if monitored with counter-metrics.*  

  5. **Is the metric a stable proxy for long-term impact (low risk of decay)?**  
     *Why: Proxies that decay lead to paying for "success" that no longer matters.*  
     → *If NO: Not payment-safe. Reporting only if no better options exist.*  

  6. **Can ratchet-effect risk be mitigated (e.g., via baseline adjustments or stretch targets)?**  
     *Why: Good performance shouldn’t set impossible future targets.*  
     → *Not pass/fail. If NO, flag for contract negotiation.*  

  **Decision Rules:**  
  - ✅ **Payment-Safe**: Passes #1–#5 with strong evidence.  
  - 📊 **Reporting-Only**: Fails #3, #4, or #5, OR relies on self-reporting (from #2).  
  - ❌ **Reject Entirely**: Fails #1 or #2 (non-negotiable).  
  - *If funders insist on weak metrics*: Assign lower $ weight (≤20%) and demand counter-metrics.  

  **Judgment Calls Wearing Lab Coats**: Steps #3–#5 require scenario-based judgment. The procedure doesn’t eliminate this but structures it with evidence. *What it doesn’t do*: Predict external shocks (e.g., recessions) or force funders to accept perfect metrics.  

  ---

  ### **Expanded Procedure Details**  
  **Order of Operations** (run sequentially; stop if rejected):  

  | Step | Question | What Constitutes a "Real Answer" | Stop/Escalate Rules | Payment vs. Reporting Distinction |
  |------|----------|----------------------------------|---------------------|-----------------------------------|
  | **1** | **Mission Alignment**: "Does this outcome directly reflect our core mission, and is it causally tied to our work (not just correlated)?" | Documented logic model showing how your intervention drives the outcome. E.g., "Our counseling directly increases credential completion." | → *Stop if NO*. → *Escalate to leadership if mission connection is debatable* (e.g., wage metrics for a poverty-reduction org). | Failing = Reject for payment AND reporting. |
  | **2** | **Verifiability**: "Can we independently verify ≥90% of outcomes with <10% audit cost (time/$) using existing tools (e.g., state wage data, third-party records)?" | Audit plan with: (a) Data source, (b) Sampling method, (c) Cost estimate. Must fit within 2 metrics/quarter capacity. | → *Stop if NO* for payment. → *Self-reported metrics automatically fail for payment.* | Failing = Never payment-safe. Reporting-only if audited annually. |
  | **3** | **Cream-Skimming Resistance**: "Could staff hit targets by serving fewer high-risk participants, or those likely to succeed without us?" | Evidence of: (a) Risk-adjusted baselines (e.g., stratifying by participant barriers), or (b) Metric design that disincentivizes exclusion (e.g., counting all enrolled, not just "completers"). | → *If NO, reject for payment*. Judgment call: Staff must simulate gaming scenarios. | Failing = Not payment-safe. Reporting-only if tied to equity quotas. |
  | **4** | **Collateral Damage Risk**: "If we maximize this, could it degrade other outcomes (e.g., job quality, participant well-being)?" | Review of past data or industry cases (e.g., "When Program X focused on job placements, wages dropped 15%"). "No evidence" isn’t sufficient—prove low risk. | → *If YES, reject for payment*. Judgment call: Staff must map trade-offs. | Failing = Not payment-safe. Reporting-only if balanced with counter-metric (e.g., wage floor). |
  | **5** | **Proxy Stability**: "Will this metric remain valid for 3+ years? What could cause decay (e.g., market shifts, participant adaptation)?" | Historical data showing correlation with long-term outcomes (e.g., credential completion vs. 5-year earnings). If new, expert consensus on durability. | → *If low stability, reject for payment*. Judgment call: Forecast based on trends. | Failing = Not payment-safe. Reporting-only if reviewed biannually. |
  | **6** | **Ratchet-Effect Mitigation**: "Can we negotiate targets that adjust for baseline performance/external factors?" | Contract language for: (a) Cohort difficulty adjustments, (b) Growth-based targets (not absolute), (c) Multi-year averaging. | → *Not pass/fail*. If NO, flag risk but proceed if metric passed #1–#5. | Not a payment barrier—but increases renegotiation need. |

  **When Funders Insist on Weak Metrics**:  
  - Assign the weakest metrics (those failing #3–#5) the **lowest $ weight** (≤20% each).  
  - Demand **counter-metrics** (e.g., if using credential completion, add a wage floor to prevent collateral damage).  
  - **Cap financial risk** (e.g., no more than 60% of total funding on outcomes, even if funders push for more).  

  **Mid-Contract Metric Failure Protocol**:  
  1. **Trigger**: Quarterly review of leading indicators (e.g., participant mix shifts, declining counter-metrics).  
  2. **Investigate**: Audit for gaming/collateral damage. If proxy decay, analyze external drivers (e.g., credential value dropped due to automation).  
  3. **Renegotiate**: Invoke contract’s "metric review clause" (demand one be added!). Propose:  
     - **Pivot**: Replace with a vetted backup metric from your pre-approved list.  
     - **Adjust**: Lower weight or shift to reporting-only.  
     - **Sunset**: Freeze payments on the metric if harm is proven.  
  4. **Document**: Track all changes to protect against liability.  

  ---

  ### **Evaluation of Your Candidate Metrics**  
  **Key**:  
  - 🔴 = Not payment-safe  
  - 🟡 = Use with extreme caution (low $ weight only)  
  - ✅ = Payment-safe if verifiable  

  | Metric                          | Mission Alignment | Verifiability | Cream-Skimming Resistance | Collateral Damage Risk | Proxy Stability | Overall Verdict       |
  |---------------------------------|-------------------|---------------|---------------------------|------------------------|-----------------|-----------------------|
  | **90-day employment rate**      | ✅ Yes            | ✅ Yes (wage data) | 🔴 Low: Staff could exclude high-barrier participants | 🟡 Medium: Risk of pushing participants into unstable jobs | 🟡 Medium: Short-term employment ≠ career stability | 🔴 **Not payment-safe** (Fails cream-skimming). Reporting only with equity audit. |
  | **Median hourly wage at placement** | ✅ Yes          | 🟡 Medium (if verified by offers) | ✅ High: Hard to game without harming other outcomes | 🔴 High: Could incentivize ignoring low-wage industries/participants | ✅ High: Wage is direct measure | 🔴 **Not payment-safe** (Fails collateral damage). Reporting only with job-type diversity metric. |
  | **Credential completion**       | ✅ Yes            | ✅ Yes (internal records) | 🔴 Low: Staff could lower standards or recruit "easy" participants | 🟡 Medium: Risk of prioritizing speed over depth | 🔴 Low: Credential value may decay (e.g., tech changes) | 🔴 **Not payment-safe** (Fails cream-skimming & proxy stability). Your instinct is right—do not put money on this. |

  **Credential Completion Deep Dive**:  
  - **Why it fails**: 
    - *Cream-skimming*: Staff will recruit educated participants with low barriers (e.g., avoiding those needing remedial help). 
    - *Proxy decay*: In fast-changing fields (e.g., IT), a "completed credential" may become obsolete mid-contract. 
    - *Collateral damage*: Pressure to hit numbers could shorten training, reducing skill depth.  
  - **If funders insist**:  
    - Assign ≤20% payment weight.  
    - Add safeguards: (a) Counter-metric (e.g., % completing advanced modules), (b) Third-party skill assessments, (c) Equity quota (e.g., ≥40% high-barrier participants).  

  ---

  ### **Why This Isn't Overcomplicating Things**  
  - **For your board member**: "We’re not making it complicated—we’re avoiding the *real* complexity of losing funding due to gaming, decay, or harm. This procedure ensures we only bet money on what we can control, verify, and align with our mission. One day of prevention protects three years of funding."  
  - **Honest note**: Steps #3–#5 are judgment-based, but the procedure forces evidence-backed judgments (e.g., "Show me data that credential quality won’t drop"). Without this, we’re gambling with 60% of our budget.  

  **Final Tip**: Build a "metric library" of pre-vetted options (e.g., risk-adjusted job retention, skills growth from baseline) to accelerate negotiations. Use the procedure to update it quarterly.
