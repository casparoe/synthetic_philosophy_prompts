answer: |-
  (1) The disagreement is substantive and metaphysical, concerning which entities fundamentally exist and how part-whole relations structure reality, not merely terminological or about distinct questions sharing a name.  
  (2) The strongest reason is the persistent, deep conviction across participants that their view captures a genuine ontological truth about when a *new object* comes into existence, reflected in their divergent responses to thought experiments and explanatory demands.  
  (3) The role-fragmentation hypothesis is insightful and correct; the causal-unity role is dominant and doing the real work in motivating the debate, while the incompatibility conjecture explains the intractability by highlighting irreconcilable demands on a single relation.  
  (4) Mereological flatness would decisively undermine *physicalism-motivated* moderate restrictions (e.g., bonding) by removing physics-based mereological structure, favoring universalism for bookkeeping; it would *not* settle debates centered on causal emergence (like organism exceptions) or brute/pragmatic moderates.  
  (5) Progress requires abandoning the quest for a single, role-unifying answer and instead explicitly arguing which role (especially causal unity vs. bookkeeping) should dominate ontology, or accepting that composition is context-relative to distinct explanatory projects.
