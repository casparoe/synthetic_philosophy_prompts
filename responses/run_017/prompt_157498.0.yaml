  ### **Recommendation**  
  Adopt a **graded, resource-relative account**:  
  - **Knowledge as "activated" beliefs** (explicitly derived or high-confidence inferences).  
  - **Confidence scores** based on derivation depth, search cost, and heuristic match (R4, R8).  
  - **Thresholds** for decisions: e.g., trust if confidence > 0.9; compute more if 0.5 < confidence < 0.9 (R2, R3, R9).  
  - **Agent’s consequence relation** defines closure (R7).  
  This satisfies all non-negotiable requirements while resolving the triad via gradedness.
