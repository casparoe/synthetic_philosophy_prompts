  Here's a step-by-step breakdown of Aquinas's argument, its application to the omnipotence paradox and your case study, and an analysis of the interpretive debates, clearly separating settled points from genuine scholarly disagreements.

  ### Aquinas's Argument in Summa Theologica I, Q25, A1 (Step-by-Step in Modern Terms)
  1.  **Two Types of Power:** Power can be understood in two fundamentally different ways:
      *   **Passive Power:** The *capacity to be changed or acted upon* by something else (e.g., clay's capacity to be shaped). This implies *potentiality*, *imperfection*, and *dependence*.
      *   **Active Power:** The *capacity to cause change or action* in something else (e.g., a sculptor's capacity to shape clay). This implies *actuality*, *perfection*, and *causality*.
  2.  **God's Nature (Pure Act):** Aquinas has previously argued (referencing earlier Questions) that God is:
      *   **Pure Actuality:** God has no potentiality or "unrealized possibility" within Himself. He is fully actualized, complete, and unchanging.
      *   **Absolutely Perfect:** There is no deficiency or imperfection in God.
      *   **Consequence:** Since passive power fundamentally involves potentiality, imperfection, and being acted upon (deficiency), it **cannot exist in God**.
  3.  **Perfection Implies Causality:** Aquinas argues that perfection naturally entails being a source of action or change ("active principle"). Something perfect doesn't just *sit there*; it *overflows* or *causes*.
  4.  **Definitional Link:** The very notion of an "active principle" (a source of action) aligns perfectly with the definition of "active power" – it's the *source* of acting upon something else.
  5.  **Conclusion:** Therefore, God must possess **Active Power**, and He possesses it **in the highest possible degree** ("in the highest degree"). God's power is pure, unlimited *causality* and *actualization*, devoid of any susceptibility to being changed or acted upon.

  **Why this matters for the Omnipotence Paradox:**
  *   **The Core Move:** Aquinas is fundamentally redefining the *scope* of divine power *based on God's nature*. Omnipotence isn't about "doing absolutely anything conceivable," but about possessing the supreme *active causal power* consistent with being Pure Act and Absolute Perfection.
  *   **Addressing the "Can't" Questions:** Aquinas argues (elsewhere, notably I, Q25, A3) that God cannot do things that:
      *   **Involve Passive Power:** God cannot *be changed* or *be acted upon* (e.g., "Can God make Himself cease to exist?" implies Him undergoing change/passivity - impossible for Pure Act).
      *   **Entail Logical Contradictions:** God cannot make a square circle, make 2+2=5, or make something both true and false at the same time and in the same way. These aren't genuine "things" to be done; they are incoherent combinations of words.
  *   **The Stone Paradox & Changing the Past:**
      *   **Stone Paradox ("Can God make a stone too heavy for Him to lift?"):** Aquinas would likely argue this is incoherent *because* it implies passive power or contradiction:
          *   "Too heavy for Him to lift" implies a *limitation* or *incapacity* (imperfection/potentiality) in God *or* implies God could be passive (straining against a weight). This contradicts Pure Act/Maximal Perfection.
          *   It also creates a logical loop (if He can make it, He should be able to lift it; if He can't lift it, He wasn't omnipotent to make it). The question smuggles in impossibility.
      *   **Changing the Past ("Can God make the past not have been?"):** Aquinas (and Scholastics generally) viewed the past as *necessary* once it has happened. Changing it would entail a contradiction: "Event X happened" AND "Event X did not happen" would both be true. This isn't a genuine possibility.

  ### Tackling Your Case Study: Altering the Past & Divine Foreknowledge
  *   **The Scenario:** A being can actualize any state of affairs whose full description doesn't entail a contradiction. Necessarily, if a city was founded in 1000, then God knew in 900 that it would be founded. Can this being make it such that the city was *not* founded in 1000?
  *   **Aquinas's Analysis (Based on this Passage & His Broader Views):**
      1.  **Divine Knowledge & Necessity:** For Aquinas, God's knowledge is *infallible* and *eternal* (existing outside of time). If God *knew* in 900 (or eternally knew) that the city *would be* founded in 1000, then it *is necessary* that the city *was* founded in 1000. God's knowledge *entails* the truth of the event.
      2.  **The Proposed Act:** Making it such that the city was not founded in 1000.
      3.  **The Contradiction:** The state of affairs "The city was not founded in 1000" **entails a logical contradiction** *given the necessary truth* of "God knew in 900 (eternally) that the city would be founded in 1000".
          *   To actualize "City not founded in 1000" requires also actualizing "God did *not* know in 900 that the city would be founded in 1000" (because if He knew it, it *had* to happen).
          *   But the scenario *stipulates* the necessary connection: "Necessarily, if founded in 1000, then God knew in 900." This makes "God knew in 900 that it would be founded" *logically equivalent* to "It was founded in 1000".
          *   Therefore, "City not founded in 1000" is equivalent to "God did *not* know in 900 that it would be founded". You cannot have one without the other.
          *   **The Contradiction:** The being would need to actualize *both* "God knew in 900 it *would* be founded" (a necessary truth from the past/stipulated necessity) *AND* "God did *not* know in 900 it *would* be founded" (required for the city not to be founded). This is the explicit contradiction P & ~P.
      4.  **Why it's not a "Task":** According to Aquinas's framework:
          *   Actualizing this state of affairs would require *changing the necessary past* (God's infallible knowledge in 900), which involves a logical contradiction.
          *   It *might* also imply God being *passive* – having His knowledge changed or corrected by the being's action. This is incompatible with God being Pure Act.
      5.  **Conclusion for Aquinas:** This is **not a genuine possibility** that the being (even an omnipotent one) could perform. It's not a failure of power; it's an incoherent request, like asking if God can create a married bachelor. The "cannot" arises from the logical impossibility inherent in the description of the task itself, not from a lack of power in the being.

  ### Evaluating Your Friend's Interpretation
  *   **"Aquinas isn't lowering the bar... he's re-describing what a 'doable thing' is."**
      *   **This is a fundamentally fair and widely accepted reading of Aquinas's core intention.** Aquinas is emphatically *not* saying God lacks some power that other beings possess. He is defining omnipotence *within the scope of what is metaphysically and logically possible* for a being who is Pure Act. What we colloquially call "things God can't do" (make contradictions true, change the necessary past, sin, be passive) are, for Aquinas, not genuine possibilities or "doable things" (*res*) at all. They are non-things, impossibilities. Omnipotence is the power to bring about *any possible state of affairs*.
  *   **Potential Sneakiness:** The potential "sneak" isn't in your friend's summary, but in how one interprets the boundaries of "possible state of affairs" or "logical contradiction" and whether Aquinas's framework *itself* imposes limitations beyond sheer logic.
      *   Does excluding "passive power" tasks *only* rule out incoherent contradictions, or does it subtly impose *other* limitations based on Aquinas's specific metaphysics? (e.g., Can God create a world without time? Aquinas might say no, not because it's contradictory *per se*, but because creation inherently implies change/duration – a point of debate).
      *   Is the "cannot sin" limitation purely logical (sin = defect = imperfection = incompatible with Pure Act) or also moral (sneaking in a value judgment)? Aquinas would argue it's purely metaphysical/logical (sin implies deficiency, deficiency implies potentiality, potentiality is absent in Pure Act).

  ### Settled vs. Contested Interpretations

  | **Aspect**                          | **Settled Consensus**                                                                                                                               | **Genuinely Contested Areas**                                                                                                                                                                                                                                                               |
  | :---------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Active vs. Passive Power**        | Aquinas defines passive power as receptivity to change (imperfection/potentiality) and excludes it from God. Active power is causal power, attributed to God maximally.        | **Minor:** Nuances in interpreting specific examples of passive power or the precise implications of "pure act" in borderline cases.                                                                                                                                                         |
  | **God as Pure Act**                 | This is a cornerstone of Aquinas's entire system. God has no potentiality; He is fully actualized.                                                 | **Minor:** Philosophical debates about the coherence of "pure act" itself outside Thomistic metaphysics.                                                                                                                                    |
  | **Scope of Omnipotence**            | Omnipotence does *not* include causing logical contradictions or performing acts involving passive power. Aquinas explicitly states this.             | **Major:** Whether this exclusion is **merely verbal/semantic** (just redefining "can" and "thing") or a **substantive limitation** on the *concept* of divine power. Is Aquinas solving the paradox or redefining terms?                                                                 |
  | **"Cannot Do Contradictions"**      | All agree Aquinas says God cannot make contradictions true.                                                                                        | **Major:** The **philosophical significance** of this "cannot." Is it a trivial logical point, or does it reveal a genuine limit inherent in *any* concept of power? Does it adequately address the *intuition* behind the paradox (that a truly all-powerful being should overcome logic)? |
  | **Stone Paradox Relevance**         | Aquinas's framework clearly implies the stone paradox involves incoherence (passivity/contradiction).                                              | **Major:** Whether the stone paradox **validly targets** the *concept* of power Aquinas uses. Critics argue the paradox highlights a tension in the *intuition* of "all-powerful" that Aquinas's redefinition doesn't fully resolve for everyone.                                             |
  | **"Redefining Doable Things"**      | It's uncontroversial that Aquinas **intends** his position as a clarification of what "things" can be done, not a limitation on a pre-existing broader notion. | **Major:** Whether this move is **philosophically successful** or merely **stipulative**. Does it convincingly show the paradox rests on a mistake, or does it dodge the underlying question about the relationship between divine power and logic/metaphysics?                             |
  | **Passage Ambiguity (Translation)** | The core distinction between active/passive power and the link to Pure Act is clear in the translation. Terms like "active principle" are standard. | **Minor:** "Active principle" could be parsed slightly differently, but not in a way that changes the fundamental argument. The translation accurately conveys Aquinas's meaning.                                                                                                           |

  **Key Controversy Summary:** The primary debate isn't about *what Aquinas said* (that's well-established), but about the *philosophical adequacy and implications* of his solution. Critics often argue:
  1.  Aquinas's "redefinition" is question-begging or merely semantic, shifting the goalposts of what "omnipotence" means without fully addressing the paradox's challenge.
  2.  The exclusion of logical impossibilities, while logically sound, might still feel like a limitation to the *intuitive* concept of "all-powerful" (why *should* logic bind God?).
  3.  The exclusion of passivity, rooted deeply in his specific metaphysics of Pure Act, might impose limitations that other conceptions of God (e.g., more "personal" or "voluntarist" views) would reject.

  **Conclusion on Aquinas's Approach:** Aquinas uses the Pure Act doctrine to define omnipotence as supreme *active causal power*, excluding tasks that involve passivity or logical contradiction. Your city-foundation case involves a contradiction (given the necessity of God's past knowledge), so it's not a genuine possibility. Your friend's interpretation captures Aquinas's *intention* correctly – he redefines "doable things" to exclude incoherent scenarios. However, the *philosophical success* of this move in fully resolving the intuition behind the paradox remains a central point of scholarly debate. Aquinas provides a sophisticated, logically rigorous framework, but whether it definitively "solves" the paradox depends on one's acceptance of his underlying metaphysics and his definition of omnipotence.
