  Right, for part (a), the question must explicitly quote/paraphrase: Moorean states, canalization, absolute/relative needs. Abstention fits better textually—Keynes explicitly contrasts "purposiveness" with enjoying life "as a whole"—but students might miss how canalization complicates this. The model answer should concede Conversion handles canalization but argue Abstention aligns with Keynes's liberation rhetoric.

  For part (b), the memoir's habit-convention critique actually rescues Abstention by suggesting cultivated traditions (not policy alone) enable contemplation. But it subtly undermines the 1930 essay's rationalist optimism—hence the model answer's "qualified vindication" angle.

  Part (c) is where the rubber meets the road. Positional rankings are relative needs resurgent! Abstention predicts this relapse (per part a) but the memoir implies disarmament alone won't fix it—habits must shift. The model answer should reject disarmament as superficial, arguing instead for cultural cultivation per the memoir's insight.

  Marking scheme traps: I'll dock points if canalization isn't addressed in (a), or if (c) ignores habit-formation. The A/B discriminator is whether students spot that the memoir doesn't just "support" or "undermine" but *transforms* the 1930 vision. Capped-at-C answers will summarize accurately but miss the tension between components.

  ...Double-checking constraints: only 1930 essay, memoir, and Moore's ethics. No secondary sources. Good. The question embeds all key terms so no prior memorization is tested. And the marking scheme explicitly requires canalization engagement for full marks—success!
answer: |-
  Here is a comprehensive exam question, model answer, and marking scheme designed to meet your specifications, focusing on the deeper tensions and interpretive challenges in Keynes's vision.

  ---

  ### 1. Exam Question (20 marks total)

  **Background:** Keynes argues that human needs fall into two categories:  
  **(i)** *Absolute needs* (essential for survival, satiable).  
  **(ii)** *Relative needs* (driven by social comparison, insatiable, zero-sum).  
  He claims solving the "economic problem" (scarcity) will allow humanity to focus on the "permanent problem": how to live wisely, agreeably, and well. For Keynes, the ultimate value lies in desirable "states of mind" (e.g., aesthetic appreciation, contemplation, personal affections), not material consequences. However, he also argues that the "money-motive," though distasteful, has historically served to channel dangerous human impulses (like greed and competitiveness) into relatively harmless economic activity. Abolishing this motive risks unleashing those impulses in more destructive forms. Late in life, Keynes critiqued his earlier circle for overestimating reason's power and underestimating the role of unchosen "habits, conventions, and traditions" in sustaining a decent society.

  **Question:**  
  **(a)** (8 marks) Given Keynes’s distinction between absolute/relative needs and his commitment to "states of mind" as ultimate value, which better describes the "good life" in his 1930 essay:  
  - **Conversion:** Redirecting energy from money-making to intrinsically valuable pursuits (art, knowledge, relationships), maintaining striving but changing its object.  
  - **Abstention:** Prioritizing contemplative/aesthetic states of mind enjoyed for their own sake, reducing activity justified by output (e.g., via a short work week).  
  Justify your choice, addressing how *both* readings handle Keynes’s "canalisation" concern about dangerous impulses.  

  **(b)** (7 marks) Does Keynes’s late self-critique (about overrating reason and underrating habit/tradition) **support** or **undermine** the programme for the "good life" outlined in his 1930 essay? Answer this *from the perspective of the reading (Conversion or Abstention) you defended in part (a)*.  

  **(c)** (5 marks) Consider this scenario:  
  > *Two generations after solving scarcity, society has a 15-hour work week, universal basic income, and free access to arts/education. Yet studies show freed time is dominated by competitive ranking (sports, collecting, credentials, connoisseurship vs. peers). Self-reported satisfaction is stagnant. A reform movement proposes "positional disarmament": banning public ranking/scoring outside markets.*  
  From your defended reading in (a) *as qualified by your answer to (b)*, would Keynes:  
  (i) Predict this outcome?  
  (ii) View "positional disarmament" as helpful, harmful, or irrelevant?  
  Briefly explain.  

  ---

  ### 2. Model Answer (Approx. 800 words)

  **(a) The Abstention reading better captures Keynes’s conception of the good life in 1930,** though it faces challenges with canalisation. Keynes explicitly contrasts the "purposiveness" of economic striving – driven by relative, insatiable needs – with the future ideal of enjoying life "as a whole" through non-instrumental states like contemplation, aesthetic delight, and "the love of one’s neighbour". The *absolute/relative* distinction is pivotal: solving scarcity means escaping the zero-sum trap of relative needs. *Conversion*, by redirecting striving onto "higher" objects like art or knowledge, risks perpetuating the competitive, insatiable logic Keynes sought to transcend. It transforms the *object* of striving but not its *structure*. *Abstention*, by contrast, aligns with Keynes’s vision of liberation from "purpose" itself – valuing states of mind (e.g., enjoying a sunset) intrinsically, not as competitive achievements.  

  However, *Abstention* struggles with Keynes’s canalisation argument. If abolishing the money-motive unleashes dangerous impulses (greed, dominance), a society focused on quiet contemplation seems vulnerable. *Conversion* handles this better by providing alternative channels for striving energy (e.g., competitive excellence in arts). Yet Keynes’s text prioritises liberation *from* striving: he calls the money-motive "a somewhat disgusting morbidity" to be discarded. While canalisation is a valid prudential concern, the core ethical thrust of 1930 points toward *Abstention* as the telos: the good life resides in being, not doing-for-output. Canalisation is framed as a *temporary* justification for capitalism, not a permanent feature of the good life. Thus, *Abstention* remains the primary vision, canalisation a secondary caution.  

  **(b) Keynes’s late self-critique *qualifies but ultimately rescues* the Abstention programme** from its most glaring weakness: the assumption that people naturally know how to enjoy leisure. The 1930 essay is rationalist: it implies that once scarcity ends, humanity will rationally embrace higher states of mind. The memoir-essay admits this was naive. By stressing the role of "habits, conventions, and traditions" – unchosen frameworks that shape character and capacity for enjoyment – the later Keynes acknowledges that the contemplative/aesthetic capacities required for *Abstention* aren’t innate; they must be cultivated within a sustaining cultural ecology. This *supports* the *Abstention* reading by providing its missing sociological foundation: the "good life" isn’t just free time plus income; it requires a tradition nurturing habits of contemplation and appreciation.  

  However, it subtly *undermines* the 1930 programme’s *instrumentalism*. The earlier vision implies social engineering (short work week, redistribution) can *directly* deliver the good life. The later emphasis on unchosen tradition suggests such engineering is insufficient. Traditions evolve organically; they can’t be legislated or designed by pure reason. Thus, the self-critique transforms *Abstention* from a rational endpoint into a cultural achievement requiring historical continuity, not just policy. It doesn’t abandon the goal but complicates the path.  

  **(c) From this qualified Abstention view, Keynes would predict the scenario and see "positional disarmament" as irrelevant or superficial.**  
  (i) **Prediction:** Yes, this outcome is predictable. Competitive ranking in leisure activities is the resurgence of *relative needs* – the very impulse Keynes thought abundance should overcome. It shows the canalised impulses (here, competitiveness) haven’t vanished; they’ve merely migrated from the economic sphere to new "harmless" domains like sports or connoisseurship (*Conversion*-like behaviour). The stagnation in satisfaction confirms Keynes’s point: relative striving is insatiable and zero-sum, yielding no lasting fulfillment. The failure also reflects the lack of cultivated habits for genuine *Abstention* – people default to familiar striving patterns.  
  (ii) **Positional Disarmament:** This reform would likely make **no meaningful difference**. Banning public rankings treats the symptom (visible competition) but not the cause (the unchanneled impulse toward relative standing and the untrained capacity for intrinsic enjoyment). Keynes’s later emphasis on *tradition and habit* implies that shifting behaviour requires cultivating new cultural norms and capacities over time, not just removing scoring mechanisms. The competitive energy would likely find new, subtler outlets (e.g., implicit hierarchies based on "authenticity" or exclusivity). True progress requires fostering the traditions of contemplation and aesthetic appreciation Keynes deemed essential – a deeper cultural shift beyond legislative fixes.  

  ---

  ### 3. Marking Scheme (20 marks total)

  **Must-Hit Moves (15 marks):**  
  1. **(4 marks)** *Chooses Abstention for (a) and justifies via absolute/relative distinction AND states-of-mind doctrine:* Argues Conversion risks perpetuating insatiable striving, while Abstention aligns with intrinsic, non-competitive states of mind.  
      *Common Error:* Selects Conversion based on canalisation alone, ignoring how relative needs undermine Liberation.  
  2. **(4 marks)** *Engages canalisation claim in (a):* Explains how Conversion handles canalisation better but Abstention remains primary; or how canalisation is secondary to liberation in 1930 text.  
      *Common Error:* Ignores canalisation or treats it as decisive without reconciling with liberation/relative needs.  
  3. **(3 marks)** *In (b), uses late self-critique to explain need for tradition/habit to enable Abstention:* Identifies how habit/tradition addresses the capacity gap for enjoying leisure.  
      *Common Error:* Simply states self-critique "supports" or "undermines" without linking to Abstention's requirements.  
  4. **(2 marks)** *In (b), notes self-critique undermines pure rationalism/social engineering:* Acknowledges traditions can't be willed into existence by policy/reason alone.  
      *Common Error:* Only sees the supportive aspect (tradition enables Abstention), missing the critique of rationalist means.  
  5. **(2 marks)** *In (c), links scenario to resurgence of relative needs/untrained habits:* Predicts outcome due to persistent impulses + lack of Abstention capacities; sees disarmament as superficial vs. needing cultural change.  
      *Common Error:* Treats outcome as unexpected or blames policy failure alone; sees disarmament as sufficient fix.  

  **Accuracy & Exposition (5 marks):**  
  - Clarity, coherence, textual fidelity (paraphrasing key points correctly).  
  - *(Deduct 1-2 marks for significant errors/misreadings; 1 mark for minor slips)*  

  **Discriminator (A vs. Strong B):**  
  *   **A Answer:** **Explicitly connects the resurgence of relative needs in (c) to the qualified *Abstention* framework from (a)/(b).** I.e., Shows how the outcome reflects *both* unchanneled impulses (*Conversion*-like leakage) *and* the untrained capacities for intrinsic states (*Abstention* failure), and why disarmament fails to address this dual deficit rooted in habit/tradition.  
  *   **B Answer:** Covers all must-hit moves accurately but lacks this synthetic link in (c). May treat (c) as a separate application rather than flowing from the core interpretation.  

  **Cap at C (Accurate Summary):**  
  *   **C Answer:** Correctly summarises key concepts (absolute/relative, states of mind, canalisation, late critique) and applies them mechanically to each part, but **fails to grapple with the *tension* between liberation/striving or reason/habit.** E.g., Doesn’t see why canalisation challenges Abstention in (a); or doesn’t explain *how* habit rescues/enables Abstention in (b); or answers (c) without connecting to the core interpretive framework.

  ---

  This question forces engagement beyond labels by:  
  1.  Making canalisation integral to justifying the choice in (a).  
  2.  Requiring the late self-critique to actively shape the interpretation of the 1930 programme in (b).  
  3.  Designing the scenario in (c) to test if students see how Keynes’s unresolved tensions predict post-scarcity pitfalls and why superficial fixes fail.  
  The model answer takes a clear stance (Abstention, qualified) and shows how parts interlock, while the marking scheme explicitly penalises answers that rely solely on the absolute/relative distinction without confronting canalisation or the habit/reason tension.
