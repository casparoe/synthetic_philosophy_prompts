     - **Prediction for mrrjjj**: Last run is 'jjj'. Increment each 'j' to 'k', yielding mrrkkk.  
     - **Why it fits**: All precedents change the last run explicitly (as per the "leave one behind" and "last run" comments), and the wrap-around is consistent with xyz ⇒ xya.

