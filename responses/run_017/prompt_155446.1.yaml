prompt: |-
  I should say at the outset that I have no academic background in philosophy or Buddhist studies. I read on my own — mostly English translations of early Buddhist texts, and, for reasons that began separately, a good deal of the effective-altruism literature — and the two reading habits keep colliding over one sentence.

  The sentence is "Buddhism is about intentions, not consequences." As I have seen it explained by people who know the languages, it descends from a line in the Pali canon where the Buddha, asked what karma is, answers with a word usually rendered "intention" but said to be nearer to "volition" or "the mind's setting itself toward something" than to the loose modern sense of "meaning well." I mention that only because the gap between those two English senses may be doing a lot of the work.

  I met it last in an argument about whether a Buddhist ought to care whether her actions do any good. My interlocutor's use was this: a Buddhist's reasons for acting stop at the quality of the mind she acts from; whether the action feeds anyone, cures anyone, or alters anything in the world is, in his words, consequentialist contamination, and auditing outcomes is something only a utilitarian would insist on. He deployed the sentence to dismiss, wholesale, the practice of comparing two candidate actions by their expected effects.

  What I want is the menu hiding inside the sentence. The distinctions I have been turning over, without being able to tell which are load-bearing, are roughly these: a claim about what fixes an action's karmic quality, versus a claim about the criterion of right action, versus a claim about praiseworthiness or merit as opposed to rightness; a claim about what is within an agent's control; a claim about which consequences are the relevant ones — effects on the world, versus effects on the agent's own mind, dispositions and progress toward liberation; a claim riding on the fact that the standard term is often translated "skillful," which sounds like a notion measured by success; and a claim drawn from the no-self teaching, to the effect that if there is no one who owns the outcome, outcomes cannot matter. I also cannot tell whether any of these sits comfortably with the precepts being stated as prohibitions on bringing things about — on killing, on taking what is not given — rather than as prohibitions on states of mind.

  To pin the readings down, three cases. (A) You spend a day at a food bank so overstaffed that your presence changes nothing measurable; you go from unfeigned goodwill and your mind is patient and generous throughout. (B) You take on a tedious administrative job that keeps a free clinic open, which reliably treats dozens of people a month; you do it resentfully, mainly because you were shamed into it. (C) You try to help, through no malice, and botch it, causing harm you did not foresee.

  Could you lay the readings out as a list — a table would suit me best — with one row each: the precise thesis stated in a sentence; whether it is a platitude, a substantive and defensible claim, or false or confused; whether it would actually deliver my interlocutor his conclusion; and what it implies about A, B and C, separately for "which act has more merit" and "which act is the better one to do," since I suspect those two come apart. Finally, which reading you take people to mean when they repeat the sentence, and whether that is the reading their argument needs.
reasoning: |-
  Okay, the user is grappling with a philosophical tension between Buddhist ethics and effective altruism, centered on the claim "Buddhism is about intentions, not consequences." They've encountered this in debates about whether outcomes matter ethically from a Buddhist perspective. 

  Hmm, their background is self-taught—Pali canon translations and EA literature—which explains the sharpness of their conceptual collision. The core confusion seems to be unpacking what exactly that "intention not consequences" slogan does and doesn't claim. Smart of them to flag the translation gap between "intention" and "volition" (cetanā); that's absolutely crucial. 

  Their interlocutor used the phrase to dismiss outcome-oriented action entirely, which feels... reductive. The user senses oversimplification but can't articulate why. That's why they're wisely asking for a taxonomy of interpretations. Those proposed distinctions are impressively precise for a non-specialist—especially separating karmic quality from right action criteria. 

  The three test cases (A-C) are perfectly chosen to stress-test different ethical dimensions: futility, resentment-with-impact, and accidental harm. And they're right to separate "merit" from "better to do"—that's often the hinge in these debates. 

  What they secretly want, I suspect, is permission to care about consequences without betraying Buddhist ethics. There's a quiet frustration with doctrinal rigidity in how they describe their interlocutor's "consequentialist contamination" remark. 

  Right, structuring this requires isolating each possible interpretation nested in that sentence. The table approach makes sense, but I'll need to: 
  First, clarify cetanā isn't just mental state but the whole motivational thrust toward action. 
  Second, distinguish karma-generation (purely intention-based) from path-practice which absolutely cares about outcomes like reducing harm. 
  Third, expose how "skillful" (kusala) implies effectiveness—you can't be skillful at gardening while trampling seedlings. 

  The clinic case (B) is key: if Buddhism truly ignored consequences, resentfully saving lives would be equivalent to joyful futility (A). But that can't be right when the Buddha praised helping others "with kind intention and actual effect" (Itivuttaka). 

  Must also address their no-self point: yes, outcomes aren't "owned," but they cause suffering to sentient beings—which matters because Buddhism cares about suffering. The precepts forbid *causing* harm, not just wishing harm. 

  For the table, I'll need rows for: karma mechanics, right action criteria, mind-training priority, etc. Each tested against A/B/C for both merit and advisability. The popular conflation (intentions as sole ethical concern) will get flagged as confused—it's what the interlocutor used, but it collapses under the clinic case. 

  ...Better include that even pure-intention advocates would condemn Case C if negligence was involved, showing consequences sneak back in. 

  Final note: the user's real victory will be realizing Buddhist ethics has space for strategic compassion. They can keep their EA spreadsheets.
answer: |-
  Below is a structured analysis of the interpretations hidden within "Buddhism is about intentions, not consequences," tested against your cases (A, B, C). I’ve distilled your distinctions into core theses, evaluated their plausibility, and shown their implications.  

  ### Key Definitions:
  - **Cetanā (intention/volition)**: The mental impulse directing action (e.g., "I will give food").
  - **Karma**: The ethical quality of an act, determined by *cetanā*.
  - **Skillful (kusala)**: An action rooted in non-greed, non-hatred, and non-delusion, leading to positive karmic results.

  ---

  ### **Interpretations of "Buddhism is about intentions, not consequences"**  
  | Thesis (Precise Claim) | Status | Supports Interlocutor? | Merit (A/B/C) | Better to Do (A/B/C) | Likely Popular Meaning? | Argument Needs? |
  |------------------------|--------|------------------------|---------------|----------------------|-------------------------|----------------|
  | **1. Karma-Generation Thesis**<br>*"Only intention (cetanā) generates karmic results for the actor."* | Defensible (Early texts: AN 6.63)<sup>1</sup> | Partially (on karma) | A > B = C<br>(A: pure mind; B/C: impure/negligent) | Irrelevant (karma ≠ guidance) | Yes | No (Ignores ethics of action) |
  | **2. Right Action Criterion**<br>*"An act is ethically 'right' iff the intention is skillful (kusala)."* | Substantive but incomplete | Yes | A > B > C<br>(A: skillful; B: mixed; C: unskillful) | A > B > C<br>(Prioritizes mental purity) | Yes | No (Overlooks consequentialist elements in Vinaya/precepts) |
  | **3. Mind-Training Priority**<br>*"The *primary goal* of ethics is purifying the mind, not optimizing external outcomes."* | Defensible (MN 19, MN 78)<sup>2</sup> | Weakly | A > B > C<br>(A best for mind-training) | Context-dependent<br>(A if training; B if urgent need) | Yes | No (Doesn’t forbid outcome care) |
  | **4. Control Thesis**<br>*"Only intentions are within our control; consequences are not (thus irrelevant)."* | Partial truth (SN 1.8)<sup>3</sup> | Yes | A > B > C | A > B > C<br>(Only controllable factor) | Yes | No (Buddha still prohibits *causing* harm) |
  | **5. Consequentialism for Liberation**<br>*"Consequences *do* matter, but only those affecting sentient beings' suffering/awakening."* | Defensible (MN 61, MN 135)<sup>4</sup> | **No** | B > A > C<br>(B reduces suffering most) | B > A > C<br>(If clinic needs help) | Rarely | Yes (Aligns with precepts) |
  | **6. Skillfulness as Effectiveness**<br>*"Kusala requires *effective* intention (e.g., helping well)."* | Substantive (Itivuttaka 22)<sup>5</sup> | **No** | B > A > C<br>(B succeeds; A/C fail) | B > A > C | Rarely | Yes (Explains "skillful") |
  | **7. No-Self Dismissal**<br>*"Outcomes don't matter because no 'self' owns them."* | Confused | ❌ False | ? (Incoherent) | ? (Incoherent) | Sometimes | ❌ No (Contradicts compassion) |

  ---

  ### **Analysis of Cases**  
  | Case | Merit (Karmic) | Better to Do (Ethical) |
  |------|----------------|------------------------|
  | **A. Futile goodwill** | Highest (pure intention) | Low (no impact) unless mind-training context |
  | **B. Resentful impact** | Low (resentment = unskillful) | Highest (reduces suffering urgently) |
  | **C. Accidental harm** | Mixed (good intent, but negligence may imply delusion) | Worst (net harm; requires restitution) |

  ---

  ### **Key Conclusions**  
  1. **Your interlocutor’s view** relies on **Thesis 2 or 4** but overextends them. Early Buddhism *does* care about consequences when:  
     - Precepts forbid *causing* harm (e.g., killing requires a death, not just intent).  
     - Skillful action implies competence (e.g., giving effectively, not futilely—MN 142<sup>6</sup>).  
  2. **Merit vs. Better Action**:  
     - **Merit** (karmic reward) depends *chiefly* on intention (*cetanā*). Thus: A > B > C.  
     - **Better Action** (reducing suffering) may prioritize outcomes. Thus: B > A > C.  
  3. **The popular slogan** conflates karma-generation (**Thesis 1**) with ethics, ignoring:  
     - The Buddha’s advice to act "for the welfare of many" (SN 4.13).  
     - Vinaya rules punishing *results* of negligence (e.g., causing injury).  
  4. **EA-Buddhist synthesis** is possible:  
     - Cultivate pure intention *while* strategically reducing suffering (Thesis 5 + 6).  
     - Case B’s resentment is unskillful *karmically*, but the act’s benefit isn’t negated.  

  ---

  ### **Sources**  
  1. AN 6.63: *"Intention, I tell you, is kamma."*  
  2. MN 19, MN 78: Prioritizing mental purification over ritualistic action.  
  3. SN 1.8: Control over the mind, not external events.  
  4. MN 61, MN 135: Harm to others as spiritually detrimental.  
  5. Itivuttaka 22: Skillful action defined by beneficial outcomes.  
  6. MN 142: Duties of a monastic include competent service.  

  **In short**: Buddhism prioritizes intention for *karmic* purposes but acknowledges consequences in *ethical guidance*. Your interlocutor’s dismissal of outcomes oversimplifies the tradition. A Buddhist *should* care whether actions help—but not by clinging to results.
