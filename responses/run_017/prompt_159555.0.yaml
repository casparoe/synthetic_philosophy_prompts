prompt: |-
  A colleague of mine in the department — her field is social epistemology, and she has an irritating habit of filing every story about crowds into "cascade" and "not a cascade" — refuses to say what she means by the word until she has seen the cases; she claims the definition is what you get at the end, from the pattern of rulings. Over about a year of departmental lunches she has given me these. Two identical lunch counters open side by side in a market; the first few buyers scatter, then everyone joins whichever queue is longer, and the other counter closes early — cascade, she says, and she adds that the winner is close to arbitrary and would often be the other counter if you re-ran the morning. A rumour about a contaminant in a popular breakfast cereal spreads through a messaging group; within ten days sales fall by two thirds and the product is suspended, and the rumour is later traced to a single misread lab report — cascade again. Nearly everyone in a country migrating to one messaging app within a year, each migrant explaining that this is where everyone they need to reach already is — not a cascade, she says, that is coordination: what others do changes your payoffs directly, not your beliefs. Every household in a town buying a generator the day before a storm that had been forecast for a week — not a cascade either: one public signal, nothing learned from anyone else. And when I offered the case of junior analysts all rating a stock "buy" while privately thinking it was overpriced, because being wrong on your own is career-ending in a way that being wrong in company is not, she declined to rule: herding, she said, and if you want to count reputational herding as a cascade she will not fight you, but she does not think anybody learned anything.

  I now have a case where the pressure point is different, and I want to predict her verdict rather than ask her, because she is on sabbatical and I have a small bet going with another student about it. It comes from a report on a seed-distribution programme that someone in my development-economics reading group was discussing. A government programme distributed a drought-tolerant maize variety to villages in one district; the trucks reached villages in an order fixed entirely by which roads had been repaired that year, so the earliest recipients were arbitrary, though they happened to sit in the sandier, drier part of the district and harvested noticeably more than their neighbours in the first season. Word moved village to village and within three seasons nearly everyone in the district had planted it. Almost every follower's own first plot did slightly worse than the local variety it replaced, because the new variety only outperforms the local one under water stress and most plots there are low-lying and wet in a normal year; interviewed later, farmers said they switched because everyone around them had, and several said they had attributed their own poor first plot to bad seedbed preparation rather than to the seed. The district then entered a run of dry years which turned out to be a lasting regional shift, not an anomaly; an independent agronomy service eventually confirmed that the new variety genuinely out-yields the local one below a certain rainfall threshold; a neighbouring district with the same soils adopted it four years later purely on the strength of its own trial plots, with no bandwagon at all; and in the original district nobody has gone back to the local variety now that full trial data are public. So: imitation of others' behaviour, private evidence overridden, the crowd vindicated, and the outcome stable and independently rediscoverable.

  My own money is on "cascade," on the grounds that the mechanism looks exactly like the lunch counters, while the friend I am betting with says no, because he thinks the word is reserved for processes that lead people astray and this one landed on the right answer. What I would like from you is the reasoning rather than the ruling: reconstruct the rule or rules she could be running that fit all five of her earlier verdicts equally well, say what each of them predicts about the seed case, which of her earlier rulings is the closest analogy and why that analogy might mislead, what you would actually predict she says and why you prefer that rule, and one further case — the single most discriminating one you can think of — that would separate the surviving candidate rules from each other. I do not need chapter and verse from the literature; I just want to be able to win the bet and, more importantly, to know what the disagreement between my friend and me is really about.
reasoning: |-
  Hmm, the user is presenting a fascinating puzzle about social epistemology and information cascades. They've described their colleague's pattern of classifying various social phenomena as "cascade" or "not cascade" based on five previous examples, and now they want to predict how she would classify a seed-distribution case. The key is to reverse-engineer the colleague's implicit rules from her past judgments.

  Looking at the colleague's previous rulings:
  - Lunch counters: cascade (arbitrary winner, payoff-irrelevant copying)
  - Cereal rumor: cascade (false belief spread through social copying)
  - Messaging app migration: not cascade (coordination game with direct payoff effects)
  - Generator buying: not cascade (response to public signal only)
  - Stock rating herding: declined to rule (reputational concerns without learning)

  The core distinction seems to be between copying driven by inferring information from others' actions (cascade) versus copying driven by direct payoff consequences or independent signals. The seed case is tricky because it has elements of both: farmers copied neighbors but the outcome was ultimately correct.

  The betting disagreement centers on whether cascades must lead people astray. The colleague's lunch counter example shows cascades can be arbitrary but not necessarily "wrong," while the cereal rumor case shows they can be false. This suggests correctness isn't the defining feature.

  For the seed case, the strongest analogy is actually the lunch counters: early arbitrary advantage (sandy villages) leads to copying based on social observation rather than personal payoff (since most farms were wetter). The farmers' attribution errors confirm they were overriding private evidence - classic cascade mechanism.

  To resolve the betting disagreement: the friend's "must be wrong" requirement doesn't hold per the lunch counter case. The colleague would likely call this a cascade because the mechanism matches, regardless of outcome correctness.

  A good discriminating case would be one where people copy despite negative personal payoffs due to reputational concerns - like the stock analyst case but with measurable outcomes. That would test whether reputational herding is considered cascade-like.
answer: |-
  Based on your colleague's pattern of rulings and stated philosophy ("definition is what you get at the end, from the pattern of rulings"), I've reconstructed the implicit rules she's likely applying. Her concept of a "cascade" hinges on **the mechanism of belief formation**, specifically whether individuals **override their private signals solely because they infer information from the actions of others**, leading to socially amplified but potentially fragile outcomes.

  ### Reconstructed Rules from Her Prior Verdicts
  1.  **Requires Sequential Observation & Action:** Individuals observe prior actions before making their own decision.
  2.  **Belief-Driven Override:** Individuals override their own private signal/information because they infer that the actions of others reveal superior information.
  3.  **Payoff Independence (Indirect Effect):** The benefit/cost of one's action does not *directly* depend on others' actions (unlike coordination games). Others' actions only matter indirectly by changing beliefs.
  4.  **Informational Asymmetry:** Individuals possess private, imperfect signals about the true state of the world.

  ### Application to Prior Cases
  *   **Lunch Counters (Cascade):** People observe prior choices (queue length) → infer others know something (e.g., which counter is faster/better) → override their own random initial impulse → join the longer queue regardless of their private observation. Payoff (getting lunch) doesn't inherently depend on others' choices; the dependence is via inferred information.
  *   **Cereal Rumor (Cascade):** People observe others stopping buying/sharing the rumor → infer others know something about contamination (overriding their own lack of evidence or even positive prior experience) → stop buying/share rumor. Payoff (health) doesn't directly depend on others' actions; dependence via belief.
  *   **Messaging App (Not Cascade - Coordination):** People switch because the payoff (ability to communicate) *directly* depends on others' choices ("where everyone they need to reach already is"). It's a network effect/coordination game, not primarily about inferring information about app quality from others' adoption.
  *   **Generators (Not Cascade - Public Signal):** Everyone acts based on the *same* strong public signal (storm forecast). No sequential observation of others necessary; no overriding of private signals based on others' actions. Independent response to common information.
  *   **Stock Analysts (Herding, Not Ruled Cascade):** Analysts act against their private belief ("overpriced") due to *reputational payoff* concerns ("being wrong in company is safer"). The primary driver is avoiding career risk, not inferring superior information from others' actions (though that might be a secondary rationalization). The payoff (career safety) *directly* depends on conformity.

  ### Prediction for the Seed Case & Reasoning
  *   **Mechanism:** Farmers observe neighbors adopting → infer neighbors' success means the seed is generally better (overriding their own poor initial result, attributing it to bad luck/prep) → adopt despite private negative signal. Payoff (yield) doesn't *directly* depend on others' adoption; the dependence is via inferred information about seed quality.
  *   **Fit with Rules:** This perfectly matches the **Lunch Counter** mechanism (sequential observation, belief override based on others' actions, payoff independence). Early arbitrary advantage (sandy villages) creates the initial signal others infer from, overriding their private evidence (poor yield on wet plots).
  *   **Colleague's Likely Verdict: CASCADE.**
  *   **Why "Not Cascade" Argument Fails (Per Her Rules):** Your friend's argument ("must lead people astray") is not supported by her rulings. The Lunch Counter cascade landed on an "arbitrary" but functionally valid outcome (someone got lunch). The Cereal Rumor cascade landed on a *wrong* outcome. Her definition hinges on the *mechanism* (belief override via social information), not the *correctness* of the outcome. The seed case mechanism is identical to the lunch counter.
  *   **Closest Analogy:** **Lunch Counters.** Both involve:
      *   Arbitrary early advantage creating a visible signal.
      *   Subsequent actors overriding null/negative private signals based on observing that signal.
      *   A stable, "correct" outcome emerging from an arbitrary start (getting lunch / having drought-tolerant seed for the dry shift).
      *   Outcome stability due to a later shift making the choice objectively correct, not due to the cascade mechanism itself being inherently robust.
  *   **Why Analogy Might Mislead:** One might focus on the *outcome* being correct and stable, confusing it with coordination (like the app) or a robust response to public information (like generators). However, the *process* – individuals ignoring their own negative results because they inferred quality from neighbors' adoption – is pure information cascade, identical to joining a queue because it's long or avoiding cereal because others are.

  ### Why "Cascade" is the Prediction
  Her core concept is the **disconnect between action and private belief driven purely by inferences from others' actions**. The seed farmers explicitly state they switched "because everyone around them had" and misattributed their poor private result ("bad seedbed prep"), demonstrating classic belief override. The vindication by drought is irrelevant to the *mechanism* operating in the first three seasons. The lunch counter case proves correctness isn't required. The reputational herding (stock analysts) case shows she distinguishes when payoff concerns, not belief updating, are primary; the seed case lacks that direct payoff dependence.

  ### The Disagreement Between You and Your Friend
  Your disagreement is fundamentally about **whether the definition of a cascade requires a suboptimal or incorrect outcome.** Your colleague's rulings show she does *not* require this. Her cascade is defined by the *informational mechanism* (social inference overriding private signals), which can lead to arbitrary (lunch counters), incorrect (cereal), or accidentally correct (seed case) outcomes. Your friend is imposing an additional requirement ("must lead people astray") that is not present in her pattern of rulings. The seed case is a cascade that, due to subsequent environmental change, happened to be beneficial.

  ### Discriminating Case
  To definitively separate the mechanism-focused rule (yours/colleague's) from the outcome-focused rule (your friend's), propose this:

  **The "Broken Bridge" Rumor:** A false rumor starts that a critical bridge on the main highway out of town is unsafe and will collapse. Person A, hearing the rumor from an unreliable source but seeing B (a known cautious driver) turn back, also turns back. Person C, seeing A and B turn back, infers serious danger and turns back, overriding their own observation that the bridge *looks* fine. This cascades: within an hour, hundreds of cars are turning back or taking long detours based purely on seeing others turn back, creating massive traffic jams. Later, authorities confirm the bridge is perfectly safe. *(Mechanism: Cascade - belief override based on sequential observation. Outcome: Wrong.)*

  **Now, add the twist:** While the bridge rumor is false, a *different*, unforeseen disaster (a sudden toxic gas leak) *does* make the area around the bridge extremely dangerous 30 minutes after the cascade starts. Everyone who turned back based on the false rumor is saved from the real danger. The outcome is "correct" (turning back was life-saving), but the *reason* people turned back was a false cascade based on a broken bridge rumor.

  *   **Mechanism-Focused Rule (Colleague's):** **CASCADE.** The mechanism was pure belief override based on social information (seeing others turn back), overriding private signals (bridge looks fine), driven by a false initial signal. The fact the outcome was beneficial was pure luck due to an unrelated event.
  *   **Outcome-Focused Rule (Friend's):** **NOT CASCADE (or ambiguous).** Because the crowd ended up being "right" (saved by turning back), even though the *information* they cascaded on was wrong and the *reason* they acted was incorrect.

  This case isolates the core issue: is a cascade defined by the *process* of social-information-based belief override leading to potentially fragile outcomes (colleague's view), or does it *require* the process to also lead to a collectively suboptimal/wrong outcome (friend's view)? The colleague's prior rulings strongly support the process-based definition. This case would force your friend to either concede the mechanism defines it, or reveal they are using a fundamentally different definition where outcome correctness overrides the mechanism.
