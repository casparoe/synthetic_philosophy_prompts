  I work in quantitative finance, do a little systematic sports betting on the side, and recently got dragged into an argument with two friends — one who says you should always maximize expected value, and one who says you should always maximize the expected growth rate of your wealth, the log-utility rule that tells you to stake a fixed fraction of what you currently have. I realised my own gut reactions to concrete bets fit neither of them, and I would rather find out what I actually believe than keep gesturing. So here are my verdicts, on cases where I trust the stated probabilities and the bets are genuinely favourable, with my net worth around $100k throughout: (1) A thousand sequential independent even-money bets where I have a real 60% edge and I pick my stake each round — betting everything every round is insane, even though its expected payoff dwarfs everything else available; something like 15–20% of current wealth feels right, 50% feels reckless, 2% feels pointlessly timid. (2) The very same bet offered exactly once, stake fixed in advance at 20% of my wealth — fine, I take it; at 100% of my wealth — bad, but a shrug rather than a horror, and clearly less bad than going all-in a thousand times. (3) A thousand of the same 60/40 bets, but the house fixes the stake at $10 and winnings are never reinvested, each bet settling separately against a bankroll that is large relative to $10 — I take all thousand, I do not thin them out, and I cannot see what the growth-rate story is even meant to apply to here. (4) A one-in-a-million shot at a billion-times payoff, ticket costs a dollar, offered once — I take it, and honestly I would put $100 on it, which I gather is about a thousand times what the growth-rate rule recommends, roughly ten cents; ten cents strikes me as absurd. (5) A one-in-a-million shot at averting an existential catastrophe, where the payoff is something like 10^15 future lives rather than money and the stake is a grant I control — I fund it, at a