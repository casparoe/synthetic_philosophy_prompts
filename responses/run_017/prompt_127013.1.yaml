answer: |-
  Below is the diagnostic instrument you requested: an eight-question decision tree (phrased as a sorting quiz) that maps concrete case verdicts and theoretical commitments to named positions in the philosophy of vagueness. The tree is derived from the logical structure of vagueness, with positions placed within the space afterward. I incorporate your three cases (uncomputable predicate, matched-pair indeterminacy, cooperative sorting) and address your specified nodes (sharp boundaries, slack location, higher-order vagueness, Sorites blocking). The key flags unoccupied cells, unresolved separations, and epistemic statuses.

  ### **Instructions for Use**
  - Answer each question based on your verdicts about the cases or commitments, **without** referencing named theories.
  - Treat "vague predicate" as exemplified by "tall," "heap," or "red" (avoiding stipulative definitions).
  - "Borderline case" = an instance where competent speakers disagree or hesitate on whether the predicate applies (e.g., a 5'10" person for "tall").
  - "Sharp boundary" = a precise cutoff where all items below it lack the property and all above possess it.
  - The quiz uses binary choices; follow paths strictly.

  ---

  ### **Diagnostic Quiz: Vagueness Decision Tree**

  1. **Sharp Boundaries**:  
     For a vague predicate (e.g., "tall"), does it have a perfectly sharp extension?  
     (e.g., is there an exact nanometer where "not tall" becomes "tall"?)  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Uncomputable Predicate (Flurg)**:  
     Let "flurg" apply to natural numbers below a Busy-Beaver-function cutoff (provably sharp but uncomputable). Does the *guaranteed ignorance* of flurg's boundary make it indeterminate whether a number near the cutoff is flurg?  
     (i.e., is "flurg" vague due to epistemic limits alone?)  
     - **Yes** → Go to Q3.  
     - **No** → Position: **Epistemicism**.  

  3. **Ontic Indeterminacy (Matched Pair A)**:  
     Consider a color gradient from red to orange. Each patch has a perfectly determinate wavelength, but the threshold for "red" is obscure. Is the indeterminacy here due to the *objects themselves* (e.g., patches lack definite color properties)?  
     - **Yes** → Position: **Ontic Indeterminacy**.  
     - **No** → Go to Q4.  

  4. **Contextual Slack**:  
     Is the vagueness of a predicate due to the *context of use* not fixing a precise meaning?  
     (e.g., "tall" means different heights in basketball vs. jockey contexts.)  
     - **Yes** → Go to Q7.  
     - **No** → Go to Q5.  

  5. **Borderline Truth-Value**:  
     In a borderline case (e.g., 5'10" for "tall"), what is the status of "x is tall"?  
     - (a) **Gap**: Neither true nor false → Go to Q6.  
     - (b) **Glut**: Both true and false → Position: **Subvaluationism**.  
     - (c) **Degree**: True to an intermediate degree (e.g., 0.5) → Go to Q8.  

  6. **Higher-Order Vagueness**:  
     Is it always determinate which cases are borderline?  
     (i.e., are there "borderline-borderline" cases?)  
     - **Yes** → Position: **Supervaluationism (Global)**.  
     - **No** → Position: **Supervaluationism (Local)**.  

  7. **Cooperative Sorting**:  
     Two competent speakers with slightly different thresholds for "tall" must agree on a verdict for a 5'10" person. If they converge on "not tall," does this reflect a *change in the truth-condition* (e.g., "tall" now excludes 5'10")?  
     - **Yes** → Position: **Contextualism (Dynamic/Scorekeeping)**.  
     - **No** → Position: **Contextualism (Static)**.  

  8. **Sorites Tolerance**:  
     In a Sorites series (e.g., removing grains from a heap), is the tolerance principle true?  
     (Tolerance: If object n has the property, then so does object n+1, for all adjacent pairs.)  
     - **Yes** → Position: **Degree-Functional (Fuzzy) Semantics**.  
     - **No** → Position: **Degree-Supervaluation Hybrid**.  

  ---

  ### **Scoring Key: Position Mapping**
  - **Epistemicism**: Q1=Yes, Q2=No.  
    (Sharp boundaries exist; uncomputability ≠ indeterminacy.)  
  - **Ontic Indeterminacy**: Q1=No, Q3=Yes.  
    (Indeterminacy in objects themselves.)  
  - **Subvaluationism**: Q1=No, Q4=No, Q5=Glut.  
    (Borderline cases yield truth-value gluts.)  
  - **Supervaluationism (Global)**: Q1=No, Q4=No, Q5=Gap, Q6=Yes.  
    (Truth-value gaps; no higher-order vagueness.)  
  - **Supervaluationism (Local)**: Q1=No, Q4=No, Q5=Gap, Q6=No.  
    (Truth-value gaps; higher-order vagueness present.)  
  - **Contextualism (Static)**: Q1=No, Q4=Yes, Q7=No.  
    (Context fixes meaning, but truth remains static post-fixing.)  
  - **Contextualism (Dynamic)**: Q1=No, Q4=Yes, Q7=Yes.  
    (Cooperative sorting alters truth-conditions dynamically.)  
  - **Degree-Functional (Fuzzy) Semantics**: Q1=No, Q4=No, Q5=Degree, Q8=Yes.  
    (Intermediate degrees; tolerance holds.)  
  - **Degree-Supervaluation Hybrid**: Q1=No, Q4=No, Q5=Degree, Q8=No.  
    (Degrees from precisifications; tolerance fails.)  

  #### **Added Positions**  
  - **Degree-Supervaluation Hybrid**: Added to separate from fuzzy semantics via Q8 (tolerance). Fuzzy semantics tolerates small changes; this hybrid blocks tolerance via supervaluationist constraints.  
  - **Nihilism/Error Theory**: Not added—fails to occupy a unique cell (see "Unoccupied Cells" below).  

  #### **Unseparated Positions**  
  - **Epistemicism vs. Global Supervaluationism** on sharp boundaries (Q1) is **substantive**: Epistemicism asserts sharp boundaries exist; supervaluationism denies them.  
  - **Static vs. Dynamic Contextualism** (Q7) is **substantive**: Static views treat context as initial fixer; dynamic views allow negotiation to alter content.  
  - **Supervaluationism vs. Nihilism** is **unseparated** in this tree (see "Unoccupied Cells").  

  #### **Unoccupied Cells**  
  - **Q1=Yes, Q2=Yes**: Incoherent. If boundaries are sharp (Q1=Yes), but uncomputability creates indeterminacy (Q2=Yes), this conflates epistemology with metaphysics. Epistemicism (Q2=No) avoids this.  
  - **Q1=No, Q3=Yes, Q5=Glut/Degree**: Unattractive. Ontic indeterminacy typically pairs with gaps (not gluts/degrees) as the "default" metaphysical option.  
  - **Q4=No, Q5=Gap, Q6=No, and Q8=Yes**: Empty. Combines supervaluationist gaps with tolerance, but tolerance fails in supervaluationism.  
  - **Q1=No, Q4=No, Q5=Gap, and any Q3/Q6/Q8**: **Nihilism/Error Theory** should appear here but doesn’t cleanly map. Nihilism denies *all* accounts of borderline cases, but Q5=Gap commits to gaps. Thus, nihilism is **incoherent within the tree**—it rejects the framework.  

  ---

  ### **Epistemic Status of Steps**  
  - **Settled Mappings** (follow directly from position definitions):  
    - Q1 for Epistemicism (Yes) vs. others (No).  
    - Q5=Glut → Subvaluationism.  
    - Q5=Gap + Q6=Yes → Global Supervaluationism.  
    - Q5=Gap + Q6=No → Local Supervaluationism.  
    - Q4=Yes → Contextualism.  
  - **Contested Mappings** (live scholarly disagreements):  
    - **Q2 (Flurg) for Epistemicism**: Some epistemicists argue uncomputability *enhances* vagueness (Q2=Yes), others insist it’s irrelevant (Q2=No). I map Q2=No as standard, but both exist.  
    - **Q8 (Tolerance) for Subvaluationism**: I assume tolerance fails (Q8=No), but some argue it holds weakly. If contested, subvaluationism could also map to Q8=Yes.  
    - **Degree-Supervaluation Hybrid**: Contested whether this is a distinct position or a variant of supervaluationism.  
  - **Stipulative/Contested Assumptions**:  
    - **Your Load-Bearing Branches**: Correct, but I split "slack location" (Q3–Q5) to isolate ontic indeterminacy first, as it bypasses semantic issues.  
    - **Subvaluationism and Modus Ponens**: Your understanding is correct. Subvaluationism blocks the Sorites by restricting modus ponens (hence Q8=No maps to tolerance failure).  
    - **Three Cases**:  
      - Flurg (Q2) effectively separates epistemicism from others.  
      - Matched Pair (Q3) isolates ontic indeterminacy.  
      - Cooperative Sorting (Q7) splits contextualism: it *partially* separates truth (static) from content (dynamic), but not perfectly—some truth-conditional views accept content change.  
    - **Higher-Order Vagueness (Q6)**: I place it after gaps to split supervaluationism. Global (Q6=Yes) denies higher-order vagueness; local (Q6=No) accepts it.  
    - **Sorites Blocking (Q8)**: Tolerance (Q8) separates degree-based views. Fuzzy semantics (Q8=Yes) preserves tolerance; others reject it.  

  This instrument isolates nine positions with minimal overlap. Use it to prompt debate on structural commitments, not just theory names. For unresolved debates (e.g., Q2 for epistemicism), have students defend their answers case-first.
