prompt: |-
  You are a professional philosopher specializing in philosophy of language and epistemology, with a research specialism in logical empiricism — in particular Otto Neurath's work on picture languages, visual education, and his anti-foundationalist epistemology — and you have served as an outside advisor to health-communication and standards bodies. Please think carefully about the case below before drafting. Begin with a short private phase of brainstorming in which you list (a) the competing readings of what goes wrong when instructions are purely verbal versus purely pictorial, (b) the Neurathian distinctions that actually bear on this decision — Isotype's rule that quantity is shown by repeating identical same-sized pictograms rather than by enlarging one, its status as a helping language and a language-like technique rather than a full language, its dependence on visual education, the role of the transformer who converts raw material into charts, and Neurath's view that no element of a representational system is immune to revision — and (c) which of these considerations are decisive here and which are decoration. Discard the weaker lines before you write. Do not cite or quote published sources; I need no bibliography and no references, and the memo should stand on its own reasoning.

  The case:

  I chair the Medication Safety and Health Literacy Committee of a public hospital system, and we have to vote in three weeks on the format of our discharge medication instructions.

  Our current sheet is English and Spanish prose written at roughly a primary-school reading level. It fails a lot of people. About a third of our discharged patients have limited literacy in their first language; we see patients across roughly seventeen first languages; and perhaps eighty patients a year speak languages with no widely used written form, for whom no translation exists at all. Those eighty currently receive a sheet they cannot read, which is worse than useless: they cannot even tell that they have been given instructions.

  The board of trustees has passed a non-binding resolution urging a move to word-free, picture-based instructions for our four highest-volume discharge regimens: a twice-daily antibiotic, an antihypertensive taken once daily, an anticoagulant whose dose depends on a blood test and which carries a small risk of serious bleeding, and a drug that must be taken on an empty stomach. A commercial vendor has offered us a sixty-symbol medication pictogram set on a three-year licence, marketed as universally understandable without text.

  Four complications the committee is stuck on.

  First, our printing is a hard constraint: discharge sheets come off a ward thermal printer in a single spot colour at coarse resolution. No colour coding, no photographs, no fine detail, no subtle shading. Whatever we adopt has to survive that.

  Second, the vendor's symbols do less well in our own hallway testing than the marketing implies. In an informal test with forty patients, a clock face with a pill drawn at a particular hour was read by several people as telling them the exact time of day to take the dose, and one patient set an alarm for that hour. A tablet drawn broken in half with a dotted line was read twice as meaning the tablet is damaged and should be discarded, which is the exact opposite of the intended take half a tablet. And to convey the anticoagulant's roughly one-in-a-thousand risk of serious bleeding, the vendor supplies a ten-by-ten grid with one square filled — which depicts one in a hundred, not one in a thousand. Our data person notes that the same problem recurs for any large quantity: repeating a thousand identical dots is both unprintable at our resolution and uncountable by eye, whereas a bar or an area comparison is printable but stops looking like the thing it counts.

  Third, our pharmacy director argues that no picture should ever be the sole carrier of dose-critical information. Her strongest example is the anticoagulant: its core instruction is conditional and negative — take a different number of tablets depending on a test result, and do not take it alongside certain other drugs — and a picture language built for indicating how many of what, when, seems structurally bad at conditionals, negation and modality. A nurse educator on the committee makes a related but different point: she says the symbols are not self-explanatory at all, that patients have to be taught to read them, and that what actually works is a short in-clinic walkthrough plus a large wall chart in the clinic that the sheet refers back to. Our data person adds that someone has to own the system: a written grammar for how symbols combine, a change log, a version number, and a named person responsible for transforming new regimens into charts, because as soon as individual clinicians improvise new icons the whole thing silently falls apart.

  Fourth, we cannot afford both things we want. This fiscal year we can fund either the vendor licence or the teaching and transformation work the nurse educator and the data person are describing, but not both. So the vote is not simply pictures versus words; it is about what picture-based communication actually requires in order to work.

  Our committee secretary then made the point that has split us. He said that if the pictures have to be taught, and the teaching happens in words, and the words have to be translated, then we have merely relocated the original problem rather than solved it — that picture languages are not a bedrock of self-certifying signs but one more revisable convention afloat alongside the others, and that any notation we adopt will need continuous repair rather than a one-off adoption decision. He is right as far as I can tell, and I do not know what institutional consequence to draw from it beyond feeling vaguely deflated.

  Please draft the decision memo I will circulate to the committee before the vote. Requirements:

  - Write it as a real committee document, with a header (To / From / Date / Re), a word budget of about 900 to 1,100 words, and a recommendation stated in the first two sentences: approve, reject, or approve with conditions, and which of the two budget items we fund.
  - Give reasons a pharmacist, a nurse educator and a trustee could each actually respond to — not a general essay on pictures and language.
  - Be concrete about licensing symbols: state a testable standard for when a symbol is permitted to carry meaning in our sheets, and say which categories of content (dose-critical information, negation, conditionals, probability, duration) may never be carried by a symbol alone.
  - Include a section headed something like The strongest case for the option we are rejecting, and give that case genuinely its best formulation — including the fact that illegible text is skipped silently while pictures at least get looked at, and that eighty patients a year currently get nothing at all — before explaining why the memo still comes out the other way.
  - Draw out the institutional consequence of the secretary's anti-foundationalist point. If the notation is a revisable convention rather than a fixed code, what governance follows? Suggest concrete mechanisms, owners, and a review or sunset date, together with a timeline for a pilot on two wards.
  - Say explicitly what would change our mind, and name one failure mode we should monitor for because we are likely to get it wrong.
  - If you think my framing of the decision misses the real issue, say so in the memo rather than politely accommodating it.
reasoning: |-
  Okay, let me approach this medication instructions problem as a philosopher of language with Neurathian expertise. The core tension is between visual simplicity and communicative precision under severe constraints. 

  First, considering the failures: purely verbal instructions exclude non-literate patients and create dangerous ambiguity for multilingual populations. But purely pictorial approaches falter with abstract concepts (conditionals, negation) and quantitative precision - exactly the problems Neurath's Isotype system anticipated. The vendor's 10x10 grid error demonstrates how easily pictorial representations distort probabilities.

  The committee secretary's foundational insight resonates deeply with Neurath's anti-foundationalism: no representation is self-validating. Pictograms work through convention, not innate understanding. This means we must reject the vendor's claim of "universal understandability" - their system requires training like any language. 

  Key Neurathian principles applicable here:
  - The transformer role (mediating expert knowledge into visual form) is non-negotiable
  - Picture languages are supplements to text, not replacements
  - Visual education must precede symbol deployment
  - All elements remain perpetually revisable

  The printing constraints eliminate complex solutions. We can't use color gradients or high-resolution graphics, forcing us toward starkly simple pictograms. Yet the clinical stakes demand precision - especially for the anticoagulant's conditional dosing. 

  The budget choice is clear: licensing pre-made symbols without training infrastructure would be catastrophic. But funding a transformer position and clinic education creates scaffolding for iterative improvement. The secretary is correct that we're not avoiding translation work - just shifting it to visual pedagogy. 

  For governance, we need: 
  - A symbols committee with version control
  - Mandatory hallway testing protocol
  - Sunset clause for the entire system
  - Designated "transformer" role with pharmacology training

  Most critically, we must prohibit pictograms from carrying certain information alone: negation, conditionals, low-probability risks, and complex dosing schedules require text anchors. The broken pill symbol confusion exemplifies why.

  The strongest counterargument remains those 80 patients receiving unreadable sheets. For them, even flawed pictograms are better than nothing. But we can address this through parallel development of nonverbal training protocols rather than accepting dangerously ambiguous symbols.
answer: |-
  **MEMORANDUM**  
  To: Medication Safety and Health Literacy Committee  
  From: Chair, Medication Safety and Health Literacy Committee  
  Date: 20 October 2023  
  Re: Decision on Discharge Medication Instruction Format & Resource Allocation  

  ---

  ### **RECOMMENDATION**  
  **Reject the vendor’s pictogram license.** Allocate this year’s budget to developing a structured visual education system, including: (1) a clinical transformer role to design and maintain instructions, (2) standardized in-clinic teaching for high-risk regimens, and (3) ward reference charts. Prohibit symbols from solely conveying dose-critical conditionals, negation, probabilities, or duration. Pilot on two wards for six months, with sunset review at 18 months.  

  ---

  ### **I. Core Problems with Purely Verbal or Purely Pictorial Systems**  
  1. **Verbal instructions fail** patients with low literacy, no written language, or language barriers. They produce silent exclusion: 30% of our patients cannot act on them, and 80 receive functionally blank sheets.  
  2. **Purely pictorial systems fail** because:  
     - **Ambiguity:** Symbols (e.g., broken pill, clock face) invite lethal misreadings without context.  
     - **Structural limits:** They cannot reliably express conditionals ("*if* test result X, *then* dose Y"), negation ("*do not* take with Z"), or precise probabilities (1/1,000 vs. 1/100).  
     - **Quantitative distortion:** Repeating identical icons (e.g., 1,000 dots) is unprintable and uncountable; area comparisons (e.g., filled grids) misrepresent scale.  
  3. **The vendor’s claim of "universal understandability" is false.** Hallway testing proves symbols require training.  

  ---

  ### **II. Why Symbols Alone Cannot Solve This**  
  **A. Non-Negotiable Constraints on Symbol Use**  
  - **Never permit symbols alone for:**  
    - **Conditionals** (e.g., anticoagulant dosing based on blood tests).  
    - **Negation** (e.g., "do not take with aspirin").  
    - **Probabilities** (e.g., bleeding risks below ~5%).  
    - **Duration** (e.g., "take for 7 days").  
    - *Rationale:* These require syntactic or contextual cues impossible to depict unambiguously in coarse monochrome.  
  - **Permit symbols only for:**  
    - Concrete nouns (e.g., pill, clock, stomach).  
    - Simple imperatives (e.g., "take two pills") when paired with text anchors.  
    - Time indicators (e.g., sun/moon) if taught via reference charts.  

  **B. The Necessity of Visual Education**  
  Pictograms function as a *language-like technique*, not a self-evident language. Patients must learn conventions (e.g., "repeated icons = quantity"). The nurse educator is correct: success depends on brief in-clinic walkthroughs and reference charts. Without this, symbols are noise.  

  ---

  ### **III. The Strongest Case for the Vendor’s System (and Why We Reject It)**  
  **The compelling argument:** For patients receiving unreadable text sheets, *any* visual aid is better than nothing. Illegible text is skipped; pictures are at least examined. The vendor’s system would immediately serve the 80 patients with no written language and partially aid low-literacy groups. It is a low-effort, standardized solution requiring minimal staff training.  

  **Why we nonetheless reject it:**  
  1. **It creates new, active risks.** Misreading a symbol (e.g., "broken pill = discard") is more dangerous than ignoring text.  
  2. **It fails for high-stakes content:** The anticoagulant’s conditional dosing cannot be depicted safely without words.  
  3. **Eighty patients gain clarity at the cost of misleading thousands.** The vendor’s probability error (1/100 vs. 1/1,000) alone could distort risk perception systemwide.  
  4. **It wastes resources** on a flawed foundation. Funding the license would preclude building the education system required to *make* symbols functional.  

  ---

  ### **IV. Governance: Embracing Revision, Not Foundation**  
  The secretary is correct: no visual system is a "bedrock." All conventions require maintenance. **Therefore:**  
  1. **Appoint a "transformer"** (per Neurath): A pharmacist-nurse team owning:  
     - A symbol grammar (rules for combination).  
     - Version control, change logs, and quarterly hallway testing.  
     - Translating regimens into charts; *no* clinician improvisation.  
  2. **Pilot governance:**  
     - **Timeline:** 2 wards, 6-month pilot (antihypertensive + antibiotic only; *exclude* anticoagulant/empty-stomach drugs until phase 2).  
     - **Review:** Sunset clause at 18 months. Continue *only* if misreading rates drop >40% in pilot wards.  
  3. **Output:** Dual-sheet system during pilot:  
     - **Sheet 1:** Minimal text (drug name, simple dose) + taught symbols.  
     - **Sheet 2:** Full-text instructions (all languages).  

  ---

  ### **V. What Would Change Our Mind**  
  We would reconsider the vendor’s symbols *only* if:  
  - They provided evidence that ≥90% of low-literacy patients *correctly interpreted* conditionals/negation after a single symbol exposure (without teaching). Our testing shows 0% success here.  
  - **Monitor for this failure mode:** Clinicians bypassing the system to add untested icons. This would signal inadequate transformer support. Audit charts monthly.  

  ---

  ### **VI. Missed Priorities in Our Framing**  
  This decision is *not* about "pictures vs. words." It is about **whether we fund infrastructure or superstition.** The vendor sells symbols as self-executing magic; in reality, they demand more rigor than text. The real issue is **institutional discipline**: maintaining a living system that owns its flaws. Allocate resources accordingly.  

  ---

  **VOTE: Reject license. Fund transformer role, education, and reference charts.**  
