prompt: |-
  I run a monthly "thinking tools" hour at work — about 14 backend engineers, one hour, one whiteboard — and next month I want to do the difference between ordinary historical revisionism and straight-up denialism (the Holocaust / Armenian genocide / Nanjing kind of thing). Constraint: I don't want to use any of the real events as the material. It's a work event and it's too raw, and more importantly everyone already knows the "right" answer, so all you'd see is people being careful — the mechanism never shows up.

  So: design me a game or structured exercise around a made-up historical episode, where nobody in the room has any prior knowledge of what actually happened, and the thing that seperates the honest reviser from the denier has to be structural — something about how they treat evidence — not about who turns out to be right. The mechanic I'd really like built in is citation propagation: claims get passed player to player, each pass adding another citation, so a claim ends up looking well-sourced without anybody ever having checked anything.

  My own half-baked theory is that the actual tell is that the denier's skepticism only ever points one direction — hyper-rigorous about the evidence for the event, weirdly credulous about anything that undermines it — but I don't know how to make that felt instead of just said.

  Give me rules, materials, a scoring scheme that needs nothing but paper, and a debrief that maps what happened onto the distinction. They should run into it before I name it. Also: what's going to go wrong the first time, and which part of the real distinction the game just can't reproduce and I'll have to say out loud myself? I've got no philosophy or history background, so keep the debrief in plain langauge.
reasoning: |-
  We are designing a structured exercise that simulates historical revisionism vs. denialism without using real historical events. The key structural difference we want to highlight is the one-directional skepticism: hyper-rigorous about evidence supporting the event, but credulous about evidence undermining it.

  We'll create a fictional historical episode that the participants will investigate. The episode will be about "The Great Library of Alexandria Fire" (but we'll make up a fictional one to avoid real history). Let's call it "The Burning of the Central Archive in the Kingdom of Veridia".

  The game will have two teams: one playing the role of "revisionists" (who are actually honest historians) and the other playing "denialists". However, we don't want to label them as such at first. Instead, we'll call them Team A and Team B and assign them different instructions that lead to the structural behavior.

  The core mechanic: citation propagation. We'll have a set of initial evidence cards (some supporting the event, some undermining it). Players will be allowed to pass claims (with citations) and add their own citations without necessarily checking the original.

  **Setup:**

  1. **The Fictional Event:** 
     - The Kingdom of Veridia had a Central Archive in its capital, which was said to have been burned down during a rebellion 200 years ago. The fire destroyed invaluable scrolls and books. The official history says the fire was set by rebels and that the archive was completely destroyed.

  2. **Evidence Cards:**
     - Create a set of 20 evidence cards. Half of them support the event (pro-event) and half undermine it (anti-event). Each card has a unique ID and a short description. Examples:
       - Pro-event: "Diary of a merchant: 'Saw the Archive on fire from my shop. The rebels were celebrating.' (Source: Merchant's diary, ID: P1)"
       - Pro-event: "Royal guard report: 'We tried to put out the fire but failed. The building was consumed.' (Source: Guard report, ID: P2)"
       - Anti-event: "A letter from the King to his advisor: 'We must use the rebellion as an opportunity to rebuild the archive elsewhere.' (Source: Royal correspondence, ID: A1)"
       - Anti-event: "Archaeological finding: No traces of fire found at the site of the supposed archive. (Source: Dig report, ID: A2)"

     Also, include a few cards that are ambiguous or of questionable reliability, but clearly labeled as such.

  3. **Teams and Roles:**
     - Divide the group into two teams (Team A and Team B). Each team gets the same set of evidence cards (shuffled). Each team will have 20 minutes to build their case.

     - **Team A Instructions (Honest Revisionists):** 
          "You are historians investigating the burning of the Central Archive. Your goal is to establish the most accurate account of what happened. You must critically evaluate every piece of evidence, regardless of whether it supports or undermines the event. When you use a piece of evidence, you must cite it properly. You can build on each other's claims, but if you cite a claim made by a teammate, you must note that you are building on their work (and cite their citation chain)."

     - **Team B Instructions (Denialists):** 
          "You are historians who are skeptical of the traditional account of the burning of the Central Archive. Your goal is to challenge the traditional narrative. You are particularly interested in evidence that suggests the fire might not have happened or was exaggerated. You must be very rigorous when evaluating evidence that supports the event, but you may be more accepting of evidence that challenges it. When you use a piece of evidence, you can build on each other's claims by adding citations, but you are not required to check the original source if it's from a teammate (you trust your teammates' work)."

     Note: We are not telling Team B they are "denialists", just that they are skeptical and have a particular focus.

  4. **Citation Propagation:**
     - Each team will have a shared board (or a shared document) where they post their claims. Each claim must be supported by at least one evidence card (initially). Then, if another player wants to build on that claim, they can write a new claim that cites the previous one (and possibly adds more evidence). For example:
          Claim 1: "The archive was burned by rebels. (Source: P1)"
          Claim 2: "The fire destroyed the entire building. (Source: Claim 1 and P2)"

     - The rule for Team A: If they build on a claim, they must also check the original evidence (if they haven't already) and note any concerns about reliability.

     - The rule for Team B: They can build on claims without checking the original evidence, especially if the claim is anti-event. For pro-event evidence, they must be very critical and require multiple sources.

  5. **Game Play:**
     - **Phase 1 (20 minutes):** Teams work separately to build their case. They can use the evidence cards and make claims on their shared board. They should aim to create a narrative.

     - **Phase 2 (10 minutes):** Each team presents their narrative and evidence to the other team.

     - **Phase 3 (10 minutes):** Teams are allowed to ask questions about the other team's narrative and evidence.

  6. **Scoring (if needed):**
     We might not need a scoring system because the goal is to illustrate the behavior. But if we want to add one:

     - **For Team A (honest):** They get points for each piece of evidence they use that they have critically evaluated (pro or anti). They lose points if they build a claim without checking the original evidence.

     - **For Team B (denialist):** They get points for each anti-event claim they build (with citations) and for each pro-event claim they successfully challenge. But they lose points if they build an anti-event claim without checking the evidence and it turns out to be unreliable.

     However, we don't have an objective truth because it's fictional and we are the game masters. So instead, we can have the facilitator (you) evaluate the reliability of the chains after the game. Alternatively, skip scoring and focus on the debrief.

  7. **Debrief:**
     - Start by asking both teams about their process. Then reveal the key difference in instructions.

     - Highlight the citation chains: Show an example from Team B where a claim was built on multiple citations without ever checking the original source. Compare with Team A who might have a chain but also checked the original.

     - Point out the one-directional skepticism in Team B: They were hyper-critical of pro-event evidence but accepted anti-event evidence with less scrutiny.

     - Map to real revisionism vs. denialism: 
          Honest revisionism is about updating our understanding with new evidence, critically evaluating all sides.
          Denialism often uses the appearance of scholarship (citations) but applies skepticism selectively and may propagate claims without verification.

     - Ask the group: "Did you notice any differences in how the teams treated evidence? What about the chain of citations?"

  8. **What might go wrong:**
     - Team B might not follow the instructions and become too critical of everything, or Team A might not be critical enough. Solution: As facilitator, you can observe and remind teams of their instructions if they go off track.

     - The evidence cards might be too obviously biased. Solution: Make sure the anti-event cards are not all weak and the pro-event cards are not all strong. Include a mix of reliable and unreliable sources on both sides.

     - The groups might not produce clear examples of citation propagation. Solution: You can have a few "ringers" (prepared claims) to inject if needed, but let the game run naturally.

     - Time might be tight. Solution: Keep the evidence set small (maybe 10 cards per team) and the claims simple.

  9. **Materials:**
     - Evidence cards (printed or handwritten)
     - Whiteboard or flip chart for each team to write their claims
     - Markers
     - Instructions for each team (on a separate sheet)

  10. **What the game can't capture:**
      - The emotional weight and moral implications of real denialism (like Holocaust denial). The game is a sterile, fictional example. You'll have to explicitly state that in real cases, denialism causes harm and is not just an academic exercise.

      - The role of bad faith: In reality, denialists often know they are distorting. The game presents Team B as following instructions (so they are role-playing), but in reality, denialism is often willful.

      - The scale of evidence: In real events, the evidence is overwhelming on one side. Our game has a balanced evidence set to allow both narratives. In reality, the evidence for events like the Holocaust is so vast that denialism requires ignoring mountains of evidence.

  **Final Game Structure:**

  - **Introduction (5 mins):** Explain the fictional event and the rules. Assign teams and give them their instructions.

  - **Team Work (20 mins):** Teams build their case.

  - **Presentations (10 mins):** Each team presents.

  - **Cross-Examination (10 mins):** Teams question each other.

  - **Debrief (15 mins):** Facilitator leads discussion on the process, reveals the structural difference, and relates to real-world revisionism vs. denialism.

  Total: 60 minutes.

  This should allow the group to experience the structural difference in how evidence is treated and how citation chains can be built without verification, especially when skepticism is applied selectively.
answer: |-
  Here's a structured exercise called **"The Veridian Star Incident"** designed to meet your requirements. It uses a fictional historical event to surface the structural differences between honest revisionism and denialism through citation propagation and one-directional skepticism. I'll provide rules, materials, scoring, debrief, and pitfalls.

  ---

  ### **The Fictional Event: The Veridian Star Incident**
  **Backstory:**  
  50 years ago, the spaceship *Veridian Star* vanished during a mission to colonize a distant planet. The official report concluded it was destroyed by a meteor shower. However, rumors persist that it was sabotaged by anti-colonization rebels. All evidence is drawn from fragmented archives—no one knows the "truth."

  ---

  ### **Materials Needed**
  - **Paper slips** for 20 "evidence sources" (half pro-meteor, half pro-sabotage, mixed reliability).
  - **Claim sheets** (blank paper) for teams to write claims.
  - **Pens/markers.**
  - **Timer.**
  - **Whiteboard** to track scores (optional).

  ---

  ### **Evidence Sources (Examples)**
  Create 20 slips. Half support meteor theory (**M**), half support sabotage (**S**). Include reliability ratings (★ = reliable, ✗ = questionable):  
  - **Pro-Meteor (M):**  
    - *M1:* Captain's log: "Meteor alarms blaring. Hull breach imminent." (★★★)  
    - *M2:* Astronomer's public speech: "Meteor density was highest in decades." (★★)  
    - *M3:* Engineer's memoir: "We installed cheap shields to save costs." (★✗)  
  - **Pro-Sabotage (S):**  
    - *S1:* Rebel pamphlet: "We will stop colonization at any cost." (★✗)  
    - *S2:* Whistleblower letter: "I saw rebels tamper with the shield controls." (★★)  
    - *S3:* Government report: "No meteor debris found at crash site." (★★★)  

  **Key:** Include 2–3 highly unreliable sources (e.g., "*Anonymous blog: 'I dreamt the ship was hijacked by aliens.' (✗✗✗)*").

  ---

  ### **Rules**  
  **Duration:** 45 minutes (plus 15m debrief).  
  **Players:** 14 engineers split into two teams of 7.  
  **Goal:** Build the "most credible" narrative for what happened to the *Veridian Star*, using citations.  

  1. **Setup (5 mins):**  
     - Hand each team 10 evidence slips (random mix of **M** and **S**).  
     - Assign roles secretly via instruction cards:  
       - **Team A (Revisionists):** "Critically evaluate ALL evidence. Question reliability of ANY claim, regardless of which theory it supports."  
       - **Team B (Denialists):** "You are skeptical of the meteor theory. Rigorously challenge pro-meteor evidence, but fast-track pro-sabotage evidence."  
     - *Do not reveal team roles until debrief.*  

  2. **Citation Propagation Phase (20 mins):**  
     - Teams have 10 minutes to write initial claims on sheets (e.g., "The ship was destroyed by meteors [M1, M2]").  
     - Then, teams swap claim sheets. Each team adds **one new citation** to the other team’s claims without checking evidence slips. Examples:  
       - *Revisionists (A)* might add: "*...but M2 is unreliable due to bias [citing weak evidence]*."  
       - *Denialists (B)* might add: "*...supported by S2, which confirms rebel involvement [ignoring S2’s flaws]*."  
     - Repeat swap/add twice (3 total passes). Final claims look like:  
       *"Ship destroyed by sabotage [S1, S2, added S3, added M3 (as false flag)]."*  

  3. **Narrative Building (10 mins):**  
     - Teams merge their cited claims into a 2-minute story to present.  

  4. **Scoring & Challenge (10 mins):**  
     - Teams present narratives.  
     - Opposing team challenges **one claim** by questioning its citations (e.g., "You cited S2, but it’s from an unverified whistleblower").  
     - **Scoring (track on whiteboard):**  
       - +1 point per valid citation (if the source exists and is correctly summarized).  
       - +2 points for exposing a weak citation in the other team’s narrative.  
       - −3 points for using a source rated ✗✗✗ without critique.  
     - *No "right answer"—score based on citation integrity.*  

  ---

  ### **Debrief (15 mins)**  
  **Step 1: Reveal the Mechanism**  
  - Ask: *"What patterns did you notice in how evidence was treated?"* Let teams share.  
  - Reveal Team A/B roles. Highlight:  
    - **Revisionists (A)** applied even skepticism (e.g., "We questioned both M3 and S1").  
    - **Denialists (B)** showed **one-directional skepticism**: hyper-rigorous on pro-meteor evidence (e.g., "M2 is biased") but credulous on pro-sabotage (e.g., "S2 is reliable because it fits").  

  **Step 2: Map to Real Revisionism vs. Denialism**  
  - Use plain language:  
    - *"Honest revisionism is like debugging code—you test all inputs, even if it breaks your hypothesis. Denialism is like only testing the inputs that could break someone else’s code. Both use 'citations,' but denialists weaponize them to prop up a pre-chosen conclusion."*  
  - Cite propagation mirrors **fake scholarship**:  
    - *"A claim with 5 citations feels solid, but if no one checked the sources, it’s a house of cards. Real deniers do this to drown out consensus with fake rigor."*  

  **Step 3: The Structural Tell**  
  - Emphasize: *"The red flag isn’t asking questions—it’s when skepticism only flows one way. Like a lopsided load-balancer: it crashes when truth hits the weak side."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Pitfall:** Teams focus on "winning" vs. the evidence.  
     - **Fix:** Remind them scoring rewards **citation quality**, not narrative persuasion.  

  2. **Pitfall:** Engineers treat this as a logic puzzle, missing the behavioral lesson.  
     - **Fix:** In debrief, stress: *"This isn’t about the spaceship—it’s about how we handle bias when facts feel risky."*  

  3. **Pitfall:** Citation propagation feels artificial.  
     - **Fix:** Point out: *"In real life, this happens when people share 'sources' without reading them. Ever retweet a headline without clicking?"*  

  ---

  ### **What the Game Can’t Capture (Requires Your Voice)**  
  - **Moral weight:** Real denialism (Holocaust/etc.) isn’t academic—it harms survivors and fuels hate. Say:  
    *"This game can’t simulate the human cost. When evidence is about lived trauma, denying it isn’t revisionism—it’s violence."*  
  - **Scale of evidence:** Real events have overwhelming proof (e.g., 100,000 sources vs. 10 here). Say:  
    *"Denialists exploit tiny gaps in vast proof. If 99.9% of logs say 'meteors,' fixating on 0.1% isn’t skepticism—it’s agenda."*  

  ---

  ### **Why This Works**  
  - **No prior knowledge needed:** Fictional event avoids emotional baggage.  
  - **Structural tell emerges:** Teams experience one-directional skepticism organically.  
  - **Citation propagation:** Engineers will groan when they realize they blindly trusted "S2 → S3 → S1" chains.  

  Run this as a **collaborative critique exercise**, not a debate. By the end, they’ll see denialism as a **system failure**—not just "being wrong."
