prompt: |-
  Quick context: I write novels, not philosophy papers, but the nine-month fellowship I'm applying for makes everyone, fiction people included, hand in a one-page "research proposal," and I'd rather actually fill it in than fake it.

  Here's my half-formed thing. I'm writing a novel from inside the head of a man in one of the reserve police battalions that shot civilians in occupied Poland, and I keep bumping into the Browning-versus-Goldhagen fight: ordinary men pushed by situation, obedience and peer pressure, versus willing executioners driven by a specifically German eliminationist ideology. What both sides seem to share is that they treat the job as causal — which factor produced the killing. What my novel actually tests is a different achievement: whether his reasons can be made followable, whether a reader can track his deliberations as reasons-for-him rather than as symptoms of a cause. Call it deliberative intelligibility. Second distinction, which I think is where they're really talking past each other: ideology might supply a repertoire — it makes an action articulable, available, citable as a reason — rather than force, which makes you do it. My hunch is the dispute looks unresolvable partly because both sides run repertoire and force together, and because neither asks what kind of intelligibility an explanation of a perpetrator is even supposed to deliver.

  Turn that into a proposal: question stated precisely, why the existing answers leave it open, the method month by month (writing the novel is part of the method, not separate from it), what a finished result looks like, and honestly what would count as failure — my worry is "followable" quietly collapses back into "caused" or just into "sympathetic," and if it does the whole project is empty. No citations or reading list, I'll add those myself.

  Format: exactly five numbered points, one or two sentences each, no intro and no closing line.
reasoning: |-
  Okay, the user is a novelist applying for a fellowship that requires a research proposal. They're working on a novel from the perspective of a reserve police battalion member in occupied Poland, exploring the perpetrator's psychology. The key issue they're grappling with is the debate between Browning's "ordinary men" theory and Goldhagen's "willing executioners" argument. 

  Hmm, the user makes two important distinctions: first, that existing theories focus on causation (what made them kill) while their novel explores "deliberative intelligibility" (can readers follow the perpetrator's reasoning as reasons-for-him). Second, they separate ideology as a "repertoire" (making actions articulable) versus "force" (what compels action). 

  The challenge is to distill this into five precise points without academic jargon. The user worries their concept might collapse into causation or sympathy - that's the core vulnerability. They need the proposal to show rigor while staying true to creative practice. 

  Noticing they want numbered points only - no intros or conclusions. Must resist academic habits! The "failure" point is crucial - shows self-awareness. Should frame writing as research method explicitly. 

  Biggest trap: making "followable" sound like "justifiable." Need to emphasize it's about understanding mechanics of reasoning, not moral sympathy. The repertoire/force distinction could be the freshest angle - it explains why the academic debate is stuck.
answer: |-
  Here is your research proposal in five numbered points:

  1. **Research Question**: Can a perpetrator’s participation in mass violence (specifically, a Reserve Police Battalion member in occupied Poland) be rendered *followable*—meaning, can a reader track his deliberations as internally intelligible reasons-for-him—rather than explained solely through external causes (situation, obedience) or ideological determinism?  

  2. **Gap in Existing Frameworks**: The dominant Browning/Goldhagen debate treats perpetrator action as causally determined (by situational pressure or eliminationist antisemitism), conflating the *repertoire* ideology provides (making actions thinkable/articulable) with the *force* compelling action, and neglecting the specific mode of *deliberative intelligibility* sought here.  

  3. **Method**: Month 1-3: Deepen historical research on perpetrator testimony & battalion logistics. Month 4-6: Draft novel sections testing the "followability" of the protagonist’s evolving reasoning. Month 7-8: Analyze draft passages where intelligibility succeeds/fails. Month 9: Revise based on analysis, refining techniques for rendering deliberation.  

  4. **Output**: A completed novel manuscript demonstrating techniques for achieving "deliberative intelligibility" in perpetrator perspective, plus a brief analytical appendix documenting the methodological insights gained through the writing process itself.  

  5. **Risk of Failure**: The project fails if "followable" deliberation collapses into mere causal explanation (psychology/situation), elicits inappropriate sympathy, or proves impossible to render without implicitly justifying the perpetrator’s reasoning, revealing the core concept as untenable.
