prompt: |-
  Okay so I've more or less become an updateless decision theory person and I want someone to try to take it apart, or at least tell me where the view is actually exposed. Quick statement of what I mean so we don't talk past eachother: at the moment of choice I shouldn't rank my available actions conditional on everything I now know; I should ask which output of the decision procedure I'm running would have looked best from the standpoint of my original prior, treating my own decision as one more logical/structural fact about the world to be conditioned on rather than as a free causal lever I get to wiggle. So I one-box in Newcomb's problem, and I pay up in that counterfactual-mugging case that circulates in this corner of the internet (predictor flips a coin, only asks you for money if it lands tails, and would have handed you ten times as much if you turned out to be the sort of agent that pays). I've basically stopped arguing about it with my CDT friend, which is probably a sign I've stopped being careful.

  So: what would count against it? Not "here's a case where UDT gets the wrong answer because I stipulated that it does" — I want defeaters ranked from fatal to merely awkward, and I especially want to know which ones a committed UDT person would concede as counting against them rather than dismiss as a formalization artifact. Here's my own worry-list, please add to it and sort it: (1) updatelessness might be two ideas bolted together — refusing to condition on which branch/copy/time-slice you turn out to be (the anthropic, Sleeping-Beauty-ish stuff), and refusing to treat your own deliberation as causally free (the Newcomb stuff) — and if the indexical half collapses for lack of any principled prior over "which copy is me," does the logical half survive untouched, or was the unity only ever apparent because both kinds of case happen to feature a predictor? (2) the logical-counterfactual machinery: if what does the work is the ability to say what would be true if a fact about my own output were different, and nobody has a clean account of that, is UDT a research program with a hole where the engine goes — and is the usual proof-theoretic/modal reply a solution or a promissory note, and how would we tell? (3) one I made up and can't get out of my head, call it computational updatelessness: a bounded agent deciding now can't run the deliberation its earlier, worse-informed self ran, so if UDT says to act as your prior self would have chosen, then for anyone who isn't ideal it seems to say act as your prior self would have chosen *with less computation*, i.e. act as if you were dumber than you actually are. That reads like a reductio to me, and it's the thing I'd personally find most damaging if there's no answer — so what picks out the relevant counterfactual prior self, with what information budget and what time budget?

  And then the insulation worry, which is what I actually keep circling back to. Every time UDT gets an uncomfortable verdict — the $5/$10 thing where the agent can't even get past the first option, the mugging-farm cases where anyone who can cheaply simulate you can extract money from you — the response I hear is "that's an artifact of this implementation, the ideal is fine." So: is there anything UDT predicts that its rivals don't? Some class of environments where a UDT agent does systematically better, or some pattern of outcomes such that if the world came out the other way the view would genuinely be in trouble? Or has it been qualified into something that can't lose? And if it has, is that a problem for a *normative* theory specifically, or is "the ideal is unfalsifiable and only implementations can be wrong" a perfectly respectable place to end up — same way nobody thinks expected utility theory is refuted by the Allais responses? Last thing: my friend says UDT is either evidential decision theory with extra steps or CDT plus a precommitment device in a trenchcoat. I'd like to know what would have to be true for that to be right, and whether I should be embarrassed if it is.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've adopted Updateless Decision Theory (UDT) and want to know where it might be vulnerable. They've listed some concerns: whether updatelessness is two separate ideas, issues with logical counterfactuals, computational limitations, and the theory's insulation from falsification. They also mention a friend's criticism that UDT is just EDT or CDT in disguise.

  First, I need to make sure I understand their position. They're committed to UDT but are looking for robust critiques. Their background shows deep familiarity with decision theory, mentioning Newcomb's problem and counterfactual mugging. They've stopped debating with a CDT friend, which they recognize might mean they're not being careful anymore. So, they're seeking external challenges to test their views.

  Looking at their worry list: 

  The first point is about whether updatelessness combines anthropic reasoning and logical control. If the anthropic part fails, does the logical part still hold? This requires examining if these components are separable. In Newcomb's, it's about logical dependence, while in Sleeping Beauty, it's about self-locating priors. If the indexical prior isn't well-defined, does that undermine UDT's core? Maybe not, since the logical part might stand alone, but the user is right to question this unity.

  Next, logical counterfactuals. UDT relies on reasoning about what would happen if the agent's output were different, even when it's determined. This is tricky because it involves impossible worlds. The proof-theoretic approach uses logical conditioning, but that's computationally hard and not fully formalized. The user is concerned this is a gap in UDT's engine. How do we evaluate if this is a solvable problem or a fatal flaw?

  Computational updatelessness is a bigger issue. Real agents aren't ideal; they have limited resources. UDT says to act as the prior self would decide, but that prior self had less computation. So acting with less info and processing power seems counterproductive. The user sees this as a reductio. Finding the right counterfactual self—what computational resources should it have? This ties into the insulation problem: UDT often retreats to idealizations when faced with practical issues.

  The insulation worry is critical. UDT proponents often dismiss problems as implementation issues. But without empirical distinctions, how can it be tested? The user wants to know if UDT has unique predictions. For example, in coordination games with logical ties, UDT agents might perform better, but is that enough? Comparing to EDT and CDT, UDT handles some paradoxes better, but if it's just EDT or CDT in disguise, that's a problem. The friend's criticism needs addressing—does UDT's precommitment aspect make it CDT with extra steps?

  Underlying all this is the user's need for validation of their intellectual position. They might fear that UDT is unfalsifiable, making it less rigorous. Or they worry it's not a true alternative to existing theories. Their deeper request is for a structured critique that either strengthens their view by addressing weaknesses or forces them to reconsider.

  I should also consider the user's possible identity: someone deeply involved in decision theory, possibly in academia or advanced self-study. Their frustration with the CDT friend suggests a desire for conclusive arguments. Their unspoken need might be assurance that their adherence to UDT is justified or a challenge that pushes them to refine their understanding.

  To address their points: 

  For the anthropic vs. logical split, UDT can survive without anthropics if logical dependencies are the core. Logical counterfactuals remain an open problem, but research into logical induction offers hope, though it's not resolved. Computational limits are a major hurdle, requiring bounded versions of UDT, which are underdeveloped. Insulation is problematic; UDT needs unique, testable predictions to avoid being unfalsifiable. Comparing to EDT and CDT, UDT's logical approach isn't just EDT, and while precommitment is part of it, the logical counterfactual aspect makes it distinct.

  The user's computational concern is particularly strong. If UDT advises acting dumber, that's a reductio. Solutions might involve approximating the ideal decision with current resources, but that's vague. Highlighting ongoing research here is key, but admitting it's a weakness.

  Finally, the friend's criticism: UDT isn't EDT because it doesn't update on actions, and it's not CDT because it deals with logical, not causal, dependencies. Precommitment is a tool, but UDT's essence is the counterfactual reasoning about algorithm outputs. Distinguishing this is crucial for the user to defend their position.
answer: |-
  Based on your articulation and worry-list, you've grasped the core tensions in UDT. Here's a breakdown of potential defeaters, sorted from potentially fatal to awkward, incorporating your points and adding others, focusing on where a committed UDT proponent might concede ground:

  **Ranked Defeaters:**

  1.  **The Computational Binds & Resource Requirements (Your Point #3 - Potentially Fatal/Awkward):** This is arguably the most pressing *practical* defeater and touches on your "reductio" feeling.
      *   **The Problem:** You nailed it. The "original prior" self was computationally impoverished. UDT says: "Act *as if* you are that prior self, choosing a *policy* for all possible input states." But that prior self, using limited resources:
          *   Couldn't reliably solve the logical counterfactuals needed to evaluate policies (especially in complex worlds).
          *   Couldn't even *represent* the vast state space of possible future observations and decisions.
          *   Might have chosen a suboptimal policy simply due to computational limitations, even if it conceptually grasped UDT.
      *   **Why it's Damaging:** It seems UDT mandates acting *less* rationally than your current, better-resourced, better-informed self could act. This directly contradicts the normative goal of rationality. "Act dumber now because you were dumber then" is indeed a reductio *if* no solution exists.
      *   **UDT Proponent Concession/Reply:** A serious proponent *must* concede this is a major challenge for *bounded* agents. The response isn't dismissal, but active research:
          *   **Finding the "Right" Counterfactual Self:** The idealization isn't the *actual computationally limited* prior self, but a *counterfactual idealized prior self* with *sufficient resources to solve the logical dependencies relevant to the policy choice*, but crucially, *without* the *factual* knowledge of which specific situation it's in. It's the self that designed the *algorithm* you're running *now*, assuming it had the computational power to make that design robust. This shifts the problem to defining "sufficient resources" for the policy domain.
          *   **Approximation & Bounded UDT:** Developing tractable approximations of logical counterfactuals (e.g., logical induction) and resource-aware UDT variants is the active frontier. The concession is that the ideal theory requires unbounded computation, but the normative *principle* (value logical dependencies, not just causal ones) still holds, and we strive for best approximations.
      *   **Verdict:** **Awkward but Survivable (for the ideal theory)**. It forces UDT into the realm of "ideal normative standard" (like Bayesian reasoning), conceding that practical implementation is hard and requires auxiliary theories. However, if *no* coherent story for bounded agents emerges, it becomes fatal for UDT's claim to be a *practical* rationality standard.

  2.  **The Logical Counterfactual Engine Gap (Your Point #2 - Potentially Fatal/Awkward):**
      *   **The Problem:** UDT's core move relies on evaluating `P(Outcome | Output = A)` where `Output = A` is a logical fact determined by the agent's own algorithm. Formalizing this "logical conditioning" or "impossible worlds" semantics is notoriously difficult. Proof-theoretic/modal approaches are promissory notes:
          *   **Undefined/Arbitrary:** What *is* the world like if a logical necessity (my algorithm's output) were different? Without a rigorous, non-arbitrary semantics, UDT's recommendations lack a secure foundation. The "hole where the engine goes" is real.
          *   **Uncomputable:** Even with a semantics, finding these probabilities might be uncomputable or computationally intractable for real agents.
      *   **Why it's Damaging:** If the logical counterfactual machinery is incoherent or irredeemably vague, UDT collapses into hand-waving for its core cases (Newcomb, Counterfactual Mugging). It becomes "EDT with magic logical dust."
      *   **UDT Proponent Concession/Reply:** Proponents readily admit this is the *major* open problem. Research programs like Logical Induction (Garrabrant et al.) are direct attempts to fill this hole by defining sequences of computable approximations to logical uncertainty. The reply is that it's a *research program*, not a finished product, and the success of the intuitions (solving puzzles others fail at) justifies the pursuit.
      *   **Verdict:** **Potentially Fatal, but Actively Addressed**. If the research program (Logical Induction, etc.) stalls or fails to produce a compelling, non-circular, usable account of logical counterfactuals, UDT remains philosophically and practically incomplete. Current status: Promising promissory notes, not a fatal flaw *yet*, but a massive vulnerability.

  3.  **Insulation / Lack of Unique Empirical Distinction (Your Point & Query - Awkward):**
      *   **The Problem:** UDT often seems to retreat to idealizations when faced with uncomfortable predictions ($5/$10 paralysis, Mugging Farms). This raises the question: What unique, testable predictions does UDT make *in principle* that differ from its rivals (especially sophisticated CDT with precommitments or EDT) in a non-stipulated environment?
      *   **Why it's Awkward:** If UDT only ever "wins" in predictor scenarios or gets "awkward" answers elsewhere, and explains away awkwardness as implementation issues, it risks being unfalsifiable – a common critique of some interpretations of quantum mechanics or string theory.
      *   **UDT Proponent Concession/Reply:** Proponents *would* point to differences:
          *   **Precommitment vs. Intrinsic Property:** Sophisticated CDT *uses* precommitment *because* it knows it's causally flawed. UDT treats the logical dependence *as the fundamental mode of control*. In complex multi-agent/embedded settings, UDT might prescribe different behaviors than CDT+precommitment *could* achieve, especially when precommitment is impossible or detectable/exploitable. (e.g., Toxoplasma of Rage coordination, logical updaters).
          *   **EDT Distinction:** EDT updates on the action *as evidence*. UDT *does not update* on the logical fact of its own output; it treats it as a variable to be set by the policy chosen from the prior perspective. This can lead to different answers in self-referential or acausal coordination problems where the action *is* the evidence (e.g., Agent-Simulates-Predictor scenarios, Parfit's Hitchhiker done logically).
          *   **Pattern:** UDT should do better *systematically* in environments rich in *logical correlation* but poor in *causal leverage* – environments where predictors, simulators, logical copies, or acausal agreements are possible. Its unique prediction is robustness in such environments without needing contingent precommitment devices. Its "loss" is computational cost and awkwardness in simple, causally straightforward environments.
      *   **Verdict:** **Awkward but Normatively Defensible.** Like EU theory ignoring Allais paradoxes descriptively, UDT claims normative superiority in specific (logically correlated) domains. The insulation *is* a problem for claiming it's the *only* rational theory universally, but potentially defensible as the correct theory for a specific class of problems central to advanced AI and embedded agency. The burden is on UDT to demonstrate clear, unique advantages in non-toy models of these domains. Its rivals have the burden of handling the predictor cases without special pleading.

  4.  **Anthropic vs. Logical Split (Your Point #1 - Awkward/Clarification):**
      *   **The Problem:** Is "updatelessness" a unified concept? Refusing to condition on indexical identity (SB) feels different from refusing to condition on your own logically determined action (Newcomb).
      *   **Analysis:** They *are* distinct but *related* through the core UDT principle: **Condition only on information available at the time the policy was set (from the prior's perspective), not on information that identifies you as a particular instance executing that policy.** In SB, the "policy" might be "answer X upon waking". Conditioning on "I am awake now" is information *not* available to the prior setting the policy. In Newcomb, the "policy" is a function from inputs (box state) to outputs (take one or both). Conditioning on "I take both boxes" is conditioning on the *output* of the policy itself, which is what the prior is trying to choose! The "unity" is in rejecting conditioning on information that is either indexically specific or generated by the policy's execution.
      *   **UDT Proponent Reply:** The anthropic half *is* messy due to the prior over indexicals. However, the *logical* half (conditioning on your own action as a logical fact) *does not fundamentally depend* on the anthropic half. You can coherently be a UDT agent for logical dependencies while being a thirder or halfer in SB (though UDT often leans towards "updateless" answers in anthropic problems too). The predictor is a *source* of logical dependency, but not the *defining feature*.
      *   **Verdict:** **Clarification, Not a Fatal Split.** The core logical engine of UDT survives even if the anthropic part is set aside or resolved differently. The predictor examples are illustrative use cases, not the sole foundation.

  **Addressing Your Friend's Criticism ("EDT with extra steps or CDT + precommitment"):**

  *   **EDT with Extra Steps?**
      *   **Similarity:** Both care about correlations, including spooky ones.
      *   **Crucial Difference:** EDT **updates** on the action `A` as *evidence* and calculates `V(A) = Sum[ U(Outcome) * P(Outcome | A, K) ]` given current knowledge `K`. UDT **does not update** on `A`. From the prior perspective, it treats the agent's output `A` as a *logical variable* `X` controlled by the *policy* `F` (so `X = F(input)`). It evaluates `Sum[ U(Outcome) * P(Outcome | F, K_prior) ]` for different `F`, using `K_prior` (which excludes `input` and `X`). It chooses the `F` that maximizes this, then outputs `F(input)`.
      *   **Why it's Different:** In Newcomb, EDT conditions on `A` (one-boxing). UDT conditions only on the *type* of agent (`F` that one-boxes) existing, from the prior perspective. This avoids EDT's fatalism in some cases and leads to different results in subtle self-referential traps.
      *   **Verdict:** **Not EDT.** The refusal to update on the action itself is fundamental.

  *   **CDT + Precommitment in a Trenchcoat?**
      *   **Similarity:** Sophisticated CDT agents use precommitment to bind themselves and achieve UDT-like results (e.g., one-boxing via precommitment device).
      *   **Crucial Difference:**
          *   **CDT+Precommit:** Views precommitment as a *tactical hack* to overcome CDT's causal myopia in *specific, anticipated* situations. It's an *external* constraint. The agent fundamentally still *wants* to two-box when actually facing the boxes, but forces itself not to.
          *   **UDT:** Views logical dependence *as* control. The UDT agent *does not want* to two-box when facing the boxes *because* it recognizes that two-boxing is part of a globally inferior policy (`F_two`). Its fundamental valuation incorporates the logical links. The "precommitment" is *internal* and *constitutive* of its decision-making algorithm. It doesn't feel "tempted" in the same way.
          *   **Where it Matters:** In complex, unforeseen, or logically embedded scenarios where explicit precommitment is impossible, impractical, or detectable/exploitable by others, UDT prescribes different (arguably superior) behavior *by design*. CDT+Precommit requires foreseeing the exact trap.
      *   **Verdict:** **Superficial Similarity, Deep Difference.** While CDT+Precommit can *mimic* UDT in simple predictor scenarios, UDT offers a *fundamentally different theory of control* based on logical counterfactuals, applicable in principle to a broader class of problems. Calling it "CDT+Precommitment" misses this core conceptual shift.

  **Conclusion:**

  Your worry-list is excellent and hits the major pressure points. A committed UDT proponent would concede:

  1.  **Computational Binds (#3)** are the most serious *practical* challenge, requiring significant work on bounded agency and approximations. Failure here undermines practical applicability.
  2.  **Logical Counterfactuals (#2)** are the core *theoretical* vulnerability. The research program (Logical Induction) *must* succeed in providing a rigorous foundation, or UDT remains philosophically incomplete.
  3.  **Insulation/Lack of Unique Prediction** is awkward. UDT needs to demonstrate clear superiority in complex, non-toy, logically correlated environments to justify its complexity and normative claims over sophisticated rivals. Its strength is handling a class of problems others find paradoxical, but it needs more.
  4.  **The Anthropic/Logical Split (#1)** doesn't fatally wound the core logical engine.

  **Should you be embarrassed if UDT is EDT/CDT+?** No, because the distinctions are genuine and philosophically significant, even if the *outcomes* sometimes coincide. UDT represents a distinct conceptual approach to agency in a logically determined universe. The embarrassment would only come from ignoring the genuine challenges you've identified. Your circling back to insulation suggests a healthy skepticism – UDT's ultimate test is whether it provides a uniquely powerful and *actionable* framework for reasoning in the domains it claims to master. Keep pressing on the computational and foundational gaps; that's where the real work is.
