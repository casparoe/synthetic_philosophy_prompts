prompt: |-
  I'm assembling the final problem set for my graduate seminar on welfare economics and population ethics — a packet of "applied" exercises rather than straight arguments — and I'd like one item in it to be a piece of imitative writing. Over the past few weeks we have worked through the standard machinery: Pareto rankings and why they almost never certify anything, the slide into potential (Kaldor–Hicks) improvements where compensation is only ever hypothetical, expected-utility comparisons under model uncertainty, and the non-identity problem, where the very people a policy harms are the people it brings into existence, so that "they are worse off" apparently fails to be an objection. What I want students to feel is how much extra work the word "safe" quietly does: a policy gets certified as a Safe Pareto Improvement when the improvement holds only in expectation, only under the modeler's own probability function, only for a population defined to include the people the policy creates, and only on a metric nobody outside the ministry would recognize as tracking how well a life goes. Every one of those moves has a serious defense somewhere in the literature; the satire is that they stack.

  So: could you write a parody official form — an "Application for Certification of a Safe Pareto Improvement" — issued by a fictional Office of Distributional Review, pitched somewhere between a tax return, an environmental impact statement, and a software end-user licence agreement? Around 800–1000 words, laid out as numbered sections with sub-clauses, checkboxes to be ticked, and blank fields to be filled in. It should include at least: (1) a Definitions section in which "Affected Party" is defined so as to exclude precisely those people whose objection would defeat the application — be inventive, and make the exclusions the sort a real ministry would draft with a straight face; (2) a Compensation section offering the options "Actual," "Hypothetical," "Retroactive," and "Posthumous," each with a short note on when it is deemed to apply; (3) a Discount Rate and Probability Field section, where the applicant specifies the model under which the expected improvement is computed and attests that the model was specified after the results were known; (4) a Non-Identity clause dealing with persons who would not exist but for the policy, and with how their consent is to be registered; (5) a Safety attestation covering variance, tail risk, and the maximum acceptable probability that literally everyone is in fact made worse off; and (6) a short worked example in the footer in which some recognizably bad policy — a compulsory relocation, a fertility incentive, a large infrastructure project, your choice — sails through on a technicality.

  Keep it deadpan throughout: no editorializing, no winking, no voice stepping outside the form to tell the reader that something is corrupt, and no named individuals, living or dead. The comedy should come entirely from the fact that each clause is a recognizable exaggeration of a move that actual welfare economists and policy analysts make — compensating in principle, discounting the future, defining the affected population to suit the conclusion, treating deep uncertainty as if it were risk. Someone who knows the literature should laugh because the form is technically competent about the machinery and quietly monstrous about its use; someone who doesn't should still be able to say exactly what is being satirized. Any invented terminology should read as though it belongs in a government register.
reasoning: |-
  Okay, the user is assembling a problem set for a graduate seminar on welfare economics and population ethics. They want a parody form that satirizes "Safe Pareto Improvements" by exaggerating common maneuvers in policy analysis. 

  First, I need to unpack their core critique: the word "safe" masks problematic assumptions—expected utility over actual outcomes, hypothetical compensation, arbitrary population definitions, and ignoring non-identity problems. The form should feel like a bureaucratic artifact where each clause weaponizes technical legitimacy.

  The user’s tone request is crucial: deadpan, no wink-to-camera. Comedy must arise from hyper-accurate mimicry of real policy language. Think tax forms crossed with EULAs. Their examples (relocation, fertility incentives) hint at dystopian applications—I’ll use a dam project in the worked example since it bundles displacement, demographic shifts, and speculative benefits.

  For the Definitions section, "Affected Party" needs exclusions that sound reasonable but neuter dissent. Real governments exclude based on residency status, temporal thresholds, or "statistical lives." I’ll borrow those: unborn persons, non-residents, those below welfare thresholds. The phrasing should mirror legal code—"as defined in Schedule 2(b)," passive-aggressive footnotes.

  Compensation options must parody Kaldor-Hicks. "Hypothetical" is obvious (cash never moves), but "Retroactive" and "Posthumous" push absurdity—e.g., compensating ancestors via genealogy databases. The notes should cite fictional precedents like "In re: Atlantis Hydro Project."

  Discount Rate and Probability Field is where model manipulation shines. Let’s require the applicant to choose a probability model after results are known—a nod to HARKing. The discount rate dropdown should include "Declining Hyperbolic" to mock time inconsistency. Attestation checkbox: "I pinky-swear I didn’t cherry-pick."

  Non-Identity clause is trickiest. Consent for nonexistent people? Borrow from representational governance: "demographic proxies" or "future electorate weighting." Add a checkbox for "existence is compensable benefit," reducing life to a transferable good.

  Safety attestation needs tail-risk weaseling. Specify a "Maximum Acceptable Catastrophe Probability" (say, 0.05) where everyone loses, but bury variance in a sub-clause. Require the applicant to define "everyone" narrowly—maybe excluding "non-core stakeholders."

  Worked example: The "Harmony Dam" will displace 20K people but create 30K future jobs. Using Section 4.2.3, displaced people are "non-core" if they move pre-construction. Discount future benefits at 8%—high enough to erase short-term losses. Boom, certified safe.

  Footnotes will smuggle in satire. Reference "ODR Circular 12-2023" (implying constant rule-tinkering) or cite "Section 7(4)(c): Aggregated Welfare Thresholds" where harms vanish below a decimal place.

  ... Now to draft without cracking a smile. The goal: a form so clinically bureaucratic it makes students gasp-laugh when they realize Section 3.1.2 lets them define suffering out of existence.
answer: |-
  **OFFICE OF DISTRIBUTIONAL REVIEW**  
  **Application for Certification of a Safe Pareto Improvement (Form ODR-SPI-7.3e)**  
  *Pursuant to the Welfare Optimization Act § 12(b)(4), as amended*

  ---

  ### **SECTION 1: DEFINITIONS**  
  *All terms herein shall carry meanings ascribed below, superseding colloquial or disciplinary interpretations.*  

  **1.1 "Affected Party"** shall denote:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Natural persons residing within the Project Jurisdiction (as defined in Schedule 2(b)) at the time of Policy Implementation;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Juridical entities registered under national statute;  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Statutorily recognized demographic cohorts (e.g., "prime-age labor force," "low-income quintile").  

  *Exclusions:*  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Persons whose existence is contingent upon Policy Implementation ("Future Persons");  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Persons residing outside Project Jurisdiction, notwithstanding transboundary externalities;  
  &nbsp;&nbsp;&nbsp;&nbsp;(iii) Persons reclassified post-facto into non-affected cohorts via Welfare Reaggregation Protocols (WRP);  
  &nbsp;&nbsp;&nbsp;&nbsp;(iv) Persons below the Minimum Compensable Welfare Threshold (MCWT) as calculated per § 3.4.  

  **1.2 "Safe Pareto Improvement" (SPI)** denotes a Policy satisfying:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Expected dominance over Status Quo under Applicant’s Model (§ 4.1);  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Absence of *ex ante* objections from Affected Parties (as defined);  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Compliance with SPI Risk Tolerance Band (§ 5.2).  

  ---

  ### **SECTION 2: COMPENSATION MECHANISM**  
  *Select one (☑):*  

  **2.1 ☐ ACTUAL**  
  &nbsp;&nbsp;&nbsp;&nbsp;*Applicable when:* Direct monetary transfers occur contemporaneously with Policy Implementation.  
  &nbsp;&nbsp;&nbsp;&nbsp;*Note:* Requires escrow verification (Form ODR-EV-4.2). Rarely recommended.  

  **2.2 ☑ HYPOTHETICAL** (Default Selection)  
  &nbsp;&nbsp;&nbsp;&nbsp;*Applicable when:* Compensation is *theoretically feasible* under Applicant’s Model, irrespective of disbursement.  
  &nbsp;&nbsp;&nbsp;&nbsp;*Note:* Sufficiency attested via Kaldor-Hicks Equilibrium Check (Annex C).  

  **2.3 ☐ RETROACTIVE**  
  &nbsp;&nbsp;&nbsp;&nbsp;*Applicable when:* Harm materializes >25 years post-Implementation.  
  &nbsp;&nbsp;&nbsp;&nbsp;*Note:* Compensation calculated in discounted utility units; payable to estates or demographic proxies.  

  **2.4 ☐ POSTHUMOUS**  
  &nbsp;&nbsp;&nbsp;&nbsp;*Applicable when:* Affected Parties expire prior to Compensation Calculation.  
  &nbsp;&nbsp;&nbsp;&nbsp;*Note:* Benefit transferred to statistically equivalent cohort per ODR Circular 12-2023.  

  ---

  ### **SECTION 3: NON-IDENTITY PROVISIONS**  
  **3.1 Future Persons Consent Protocol**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Welfare of Future Persons shall be evaluated exclusively under the Policy scenario.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Consent is imputed via:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Existence as Pareto-Dominant Outcome (Default)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Demographic Proxy Voting (Submit Form ODR-DP-9)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Representative Agent Calibration (Specify model: _______________)  

  **3.2 Counterfactual Nullification**  
  &nbsp;&nbsp;&nbsp;&nbsp;Complaints of the form "I would not exist but for this Policy" shall be inadmissible.  
  &nbsp;&nbsp;&nbsp;&nbsp;☑ Attestation: *No Future Person is rendered "worse off" relative to non-existence.*  

  ---

  ### **SECTION 4: DISCOUNT RATE AND PROBABILITY FIELD**  
  **4.1 Applicant’s Model Specification**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Discount Rate:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Exponential (Rate: ___%)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☑ Hyperbolic (β=____, δ=____)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Declining (Rationale: ________________)  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Probability Distribution:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Frequentist (Source: _______________)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☑ Bayesian (Prior: ________, Posterior: ________)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;☐ Ambiguity-Neutral (Justification: § 4.1(f))  

  **4.2 Model Attestation**  
  &nbsp;&nbsp;&nbsp;&nbsp;☑ I affirm that the selected Model was finalized *after* preliminary SPI determination.  
  &nbsp;&nbsp;&nbsp;&nbsp;☑ I affirm that no alternative Model yielding non-dominant outcomes was materially considered.  

  ---

  ### **SECTION 5: SAFETY ATTESTATION**  
  **5.1 Variance Tolerance**  
  &nbsp;&nbsp;&nbsp;&nbsp;Maximum acceptable welfare variance (σ²): ________ utils²  
  &nbsp;&nbsp;&nbsp;&nbsp;*Note:* May not exceed 200% of Status Quo variance.  

  **5.2 Tail Risk Parameters**  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Probability of any individual being made worse off: < ___% (Default: 5%)  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Maximum Acceptable Catastrophe Probability (MACP):  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;P(literally *all* persons worse off) ≤ ________ (Default: 0.01)  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*Note:* "All persons" defined as Core Affected Parties per § 1.1(c).  

  **5.3 Epistemic Safety**  
  &nbsp;&nbsp;&nbsp;&nbsp;☑ Improvement holds under *at least one* academically published welfare framework.  
  &nbsp;&nbsp;&nbsp;&nbsp;☑ No evidence suggests harm with confidence >95% (p≥0.05 exemption).  

  ---

  ### **WORKED EXAMPLE: HARMONY DAM PROJECT**  
  *Certified SPI #2024-ODR-831*  

  | **Policy**              | Hydroelectric dam. Relocates 20,000 residents; creates 30,000 construction/operation jobs. |
  |--------------------------|--------------------------------------------------------------------------------------------|
  | **Affected Parties**     | § 1.1(a): Current residents (objections overruled via WRP reclassification to "temporary workforce"). § 1.1(c): "Regional GDP cohort" gains included. Future Persons (§ 1.2(i)) excluded. |
  | **Compensation**         | Hypothetical (§ 2.2). Future energy revenues deemed sufficient for compensation *in principle*. |
  | **Non-Identity**         | § 3.1(b): Existence as Pareto-Dominant Outcome imputes consent. Relocated residents' descendants classified as Future Persons. |
  | **Model**                | Bayesian posterior (optimistic growth prior). Declining discount rate (δ=8%→2%). |
  | **Safety**               | MACP = 0.03 (approved). "All persons worse off" interpreted as concurrent lifetime experience (probability negligible under model). |
  | **SPI Certification**    | **GRANTED** (ODR Determination: Net Present Welfare +142 utils ± 40; σ²=1590 < Threshold). |

  ---

  **SUBMISSION INSTRUCTIONS:**  
  - Complete all ☑ boxes and ________ fields.  
  - Attach Model Code (Python/R preferred) and Welfare Aggregation Tables.  
  - Email to SPI.Review@odr.gov by fiscal quarter close.  

  ---

  *ODR Disclaimer: Certification implies neither ethical endorsement nor legal immunity. Unforeseen welfare fluctuations may occur. Consult your philosopher.*
