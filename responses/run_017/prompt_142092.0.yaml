answer: |-
  ## Research Proposal: Hinges in Flux: Demotion, Succession, and the Silent Shifts of Epistemic Bedrock

  **1. Core Research Question & Significance:**  
  Can hinge commitments undergo "demotion" (losing their foundational, doubt-immune status within a practice) and "succession" (another commitment assuming that foundational role) *without* explicit doubt being formulated, and if so, is this transition susceptible to epistemic evaluation (rational/irrational) from *within* the shifting practice, or only describable retroactively? Further, does the demoted hinge provide any justification for its successor, or is succession merely a causal fact?

  *   **Why This Matters & Gap:** Existing hinge epistemology fixates on radical scepticism and *explicit* doubt (Moore, Avrum Stroll’s “immunity,” Duncan Pritchard’s “über hinge,” Annalisa Coliva on “propositional attitudes”). This overlooks the pervasive, *gradual* erosion of hinge status observed in actual epistemic practices – a phenomenon propositional readings (anchored in immunity) struggle to model as rational, practical readings (e.g., Daniele Moyal-Sharrock’s “animal certainty”) lack normative resources for, and therapeutic readings (e.g., Oskari Kuusela) deliberately eschew. “Slow demotion” is the untheorized norm, not the sceptical exception. Understanding it reveals the dynamic, non-static nature of our “bedrock” and challenges accounts of epistemic normativity confined to explicit reasons or static structures.

  **2. Core Argument & Approach:**  
  I argue that hinge demotion/succession *can* occur absent explicit doubt, driven by accumulating practical friction within the form of life. This transition, while often “silent,” *is* accessible to a distinctive form of internal epistemic evaluation: its rationality hinges on the *pragmatic coherence* and *explanatory fertility* of the emerging practice compared to the straining predecessor. Crucially, the demoted hinge provides *no justificatory basis* for its successor; succession is a practical re-orientation, not an inference. Justification flows *from* the new hinge *outwards* once established. The successor is “justified” retrospectively by the *viability* of the practice it enables, not by the prior hinge.

  *   **Methodology:** Systematic case-analysis leading to conceptual generalization.  
      *   **Month 1:** Deep literature review (Wittgenstein OC, Moyal-Sharrock, Coliva, Pritchard, Wright; critics like Kusch, practical friction in Brandom/Sellars). Refine case studies.
      *   **Month 2:** Intensive analysis of **Calibration Standard Case** (Lab): Trace how repeated anomalies (results not “lining up”) lead to procedural shifts (quoting uncertainty, ad-hoc adjustments) *before* explicit doubt targets the standard. Identify markers of demotion (loss of unconditional trust, emergence of alternatives).
      *   **Month 3:** Intensive analysis of **Conceptual Ground Case** (Conversation): Examine how subtle misunderstandings or evolving contexts cause a term’s meaning-hinge to falter, prompting re-clarification (“what do you mean by X?”) without a “Eureka!” moment of doubt. Focus on pragmatic breakdown as driver.
      *   **Month 4:** Intensive analysis of **Archival Trust Case** (Family/Records): Analyze how discovering forgeries destabilizes the hinge of “trust in records,” leading to verification practices *replacing* trust. Contrast with explicit doubt-driven discovery.
      *   **Month 5:** Synthesis & Drafting. Identify cross-case patterns: (a) Trigger = *Practical friction* (anomalies, breakdowns, discoveries) undermining smooth operation; (b) Process = *Gradual, often tacit* shift in behavioral dispositions and normative expectations; (c) Evaluation Criterion = Emergent *pragmatic coherence*; (d) Succession = *Functional replacement*, not justification. Generalize to a model of hinge dynamics based on practice-sustenance vs. friction. Structure paper.

  *   **Generalization Strategy:** Cases are not mere anecdotes but *paradigms* illustrating core mechanisms (friction, tacit shift, functional replacement). Their power lies in contrasting the *dynamics* observed with the *static* or *doubt-centric* models dominant in the literature. The analysis abstracts the *structural features* of the transition process evident across diverse contexts.

  **3. Key Potential Conclusions & Deciding Factors:**  
  1.  **Strong Distinctiveness:** Slow demotion *is* a distinct phenomenon irreducible to explicit doubt or standard belief revision. Decider: Clear identification of markers absent in doubt-driven change (e.g., lack of targeted questioning, priority shifts in practice *preceding* propositional challenge).
  2.  **Weak Normativity:** Demotion/succession is evaluable internally as rational/irrational based *solely* on the emergent practice’s pragmatic coherence and explanatory power relative to the friction experienced. Decider: Demonstrating internal standards of “working better” within the practice, distinct from external norms or explicit reasoning chains.
  3.  **Minimal Change:** Demotion is just slow-motion belief revision via abduction/inference to the best explanation (IBE). Decider: If analysis shows the shift *always* relies on tacit inferences or evidence accumulation accessible *as such* within the old framework, then it’s not hinge-specific. (My cases suggest friction disrupts the *framework* for applying IBE).
  4.  **Therapeutic Confirmation:** The phenomenon confirms Wittgenstein’s anti-theoretical stance – it’s just “how we go on,” describable but not rationally explicable. Decider: If pragmatic coherence cannot be articulated as a normative standard internal to the shift itself.

  **4. Deliverable & Value for the Unconvinced:**  
  The paper (approx. 25-30pp) will provide a rigorously analyzed, empirically grounded account of how epistemic bedrock *actually changes* in non-sceptical contexts. For those sceptical of hinges as a distinct kind, it earns its keep by:  
  *   **Highlighting a Neglected Phenomenon:** Demonstrating a pervasive type of epistemic change poorly explained by standard belief-revision or justification models.
  *   **Offering a Better Explanation:** Providing a coherent, practice-based account of this change where propositional and inferential models falter (e.g., explaining shifts *without* explicit evidence evaluation against a stable background).
  *   **Revealing Dynamics:** Showing that even if “hinges” are just a label, the *functional role* of deep-seated, doubt-resistant commitments undergoes identifiable, normatively evaluable transitions driven by practical exigencies, enriching our understanding of epistemic practice beyond static foundations or sceptical battles.

  **5. Failure Modes, Scope, & Feasibility:**  
  *   **Failure Risks:**  
      *   Cases collapse into standard IBE/belief revision (mitigation: Focus on how friction disrupts the *conditions* for applying IBE within the old practice).  
      *   Normative dimension proves elusive, leaving only descriptive “practice won out” (mitigation: Argue pragmatic coherence *is* the internal norm).  
      *   All cases implicitly involve dormant doubt (mitigation: Scrutinize case descriptions for absence of doubt-targeting-the-hinge, emphasize behavioral shifts preceding propositional challenges).  
  *   **Scope Management:**  
      *   Focus exclusively on *demotion/succession without explicit doubt*. Defer full taxonomy of hinge change or detailed comparison to all rival accounts.  
      *   If cases prove complex, prioritize depth in 2 over breadth in 3, ensuring robust analysis.  
      *   Cut extensive engagement with scepticism; assume reader grasps its inadequacy for *this* phenomenon.  
  *   **Feasibility (5 Months):**  
      *   Focused scope (one core phenomenon, 3 cases).  
      *   Methodology leverages existing case sketches and targeted literature review.  
      *   Deliverable is *one* substantive chapter, not a full dissertation.  
      *   Structure allows for parallel analysis/synthesis.  

  **6. Why This Work & Why Now:**  
  Hinge epistemology risks stagnation, replaying sceptical debates. Shifting focus to *dynamic, doubt-free hinge change* revitalizes the field:  
  1.  **Empirical Grounding:** Connects Wittgensteinian insights to real-world epistemic practices beyond thought experiments.  
  2.  **Normative Challenge:** Forces development of practice-internal norms beyond explicit reasons or static immunity.  
  3.  **Theoretical Payoff:** Offers a more plausible, dynamic picture of how our fundamental commitments evolve, crucial for understanding scientific revolutions, conceptual shifts, and historical epistemology. This project moves beyond exegesis to model a fundamental, under-theorized epistemic process, demonstrating the continued vitality of hinge epistemology for understanding knowledge in action. It is achievable within five months through disciplined focus on core cases and mechanisms.
