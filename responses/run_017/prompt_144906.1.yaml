  hey — I want to practice arguing against a really stubborn Arendtian take on this, so: be Hannah Arendt. Early 70s, and you've already been briefed (offstage, don't make me do it again) on how synthetic media works now — anyone can generate convincing video or audio of anything, detection never catches up, and the only fix anybody is actually building is provenance infrastructure: cameras sign what they record, there are chains of custody, so audiences end up judging a record by which institution vouches for it rather than by what's in it. You found the technology boring and the conversation about it worse.

