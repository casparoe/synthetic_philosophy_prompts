answer: |-
  Below is the interactive decision tree designed for your feature. It takes readers through concrete cases and claims, branching based on their responses without using meta-ethical terminology. The tree includes your six required questions and three additional ones to cover logical gaps (marked with asterisks \* and annotated for empirical status). It sorts readers into one of eight named positions (the seven you specified, plus one hybrid view). 

  The tree is honest about limitations:
  - **Two leaves are indistinguishable** (Expressivism and Quietism converge on all cases; see "Unresolved Overlaps").
  - **Three unoccupied answer combinations** exist (noted with explanations).
  - **Framing caveat**: Cross-cultural variation alone cannot settle objectivity debates. Variation may reflect methodological artifacts (e.g., WEIRD sampling, question framing) or genuine moral diversity. The data pressure but do not refute objectivity; they challenge how we access moral truths.

  ---

  ### **The Decision Tree**  
  *Instructions: Start at Question 1. Select one answer per question and follow the instructions to the next node. Continue until you reach a leaf (e.g., "LEAF: Robust Objectivism").*

  **1. Harmless Taboo**: A family eats their pet dog (killed by a car). No one is harmed or finds out, yet many condemn it. How do you interpret this condemnation?  
  - **A. False moral belief** (they wrongly think harm occurred). → Go to 3.  
  - **B. Non-moral disgust** (a biological recoil mislabeled as moral). → Go to 5.  
  - **C. Correct response** (they detect a real moral property, like desecration, that others miss). → Go to 4.  
  - **D. Right principle, wrong context** (e.g., "respect animals" applied with different beliefs about pets). → Go to 2.  

  **2. Weight, Not Kind**: Two groups agree that helping kin and fairness matter but disagree on which wins (e.g., hiring a relative over a better stranger). Is this a moral disagreement?  
  - **A. Moral disagreement** (different prioritization of shared values). → Go to 8\*.  
  - **B. Non-factual disagreement** (e.g., they disagree about consequences, not values). → Go to 9\*.  
  - **C. No real disagreement** (they emphasize different aspects of the same core principle). → Go to 6.  

  **3. False-Embedding Case**: A group condemns a practice due to a false belief (e.g., "it causes invisible harm"). Since the belief is false, is their condemnation...  
  - **A. Mistaken** (no harm means no reason to condemn). → Go to 6.  
  - **B. Correct, wrong reason** (the act is wrong for other reasons). → Go to 6.  
  - **C. Not truth-apt** (condemnation isn’t about correctness). → Go to 5.  

  **4. Reverse-WEIRD**: WEIRD populations are outliers in moral judgments. Does this outlier status...  
  - **A. Distrust their judgments** (outliers are unrepresentative). → Go to 6.  
  - **B. Trust them more** (education/literacy improves judgment). → LEAF: **Robust Objectivism**.  
  - **C. No evidence either way** (outlier status doesn’t indicate reliability). → Go to 7\*.  

  **5. Elicitation-Frame Test**: If a group’s answer changes when the question shifts (e.g., "Is it wrong?" vs. "Would you do it?"), this implies...  
  - **A. No stable judgment** (moral responses are context-dependent constructs). → Go to 7\*.  
  - **B. Measurement problem** (the underlying judgment is stable but hard to access). → Go to 9\*.  

  **6. Necessary-Looking Claims That Go Missing**: An apparent universal (e.g., "deliberate harm worse than accidental") fails to appear in some groups. This...  
  - **A. Counts against the claim** (it’s not universal, so not objective). → LEAF: **Cultural Relativism**.  
  - **B. Counts against response reliability** (e.g., mistranslation or noise). → LEAF: **Robust Objectivism**.  
  - **C. Counts against intuition as evidence** (folk intuitions are flawed guides). → LEAF: **Quietism** or **Expressivism** (indistinguishable path).  

  **\*7. Role of Emotion**: When people condemn acts (e.g., incest), is emotion...  
  - **A. Essential** (no emotion = no moral judgment; it constitutes the response). → LEAF: **Expressivism**.  
  - **B. Incidental** (emotion accompanies judgment but doesn’t define it). → LEAF: **Constructivism**.  
  *Empirical status: Well-replicated that emotion is involved, but "essential" is contested (debates on whether emotion causes or results from judgment).*  

  **\*8. Convergence Under Similarity**: If groups had identical knowledge/conditions, would moral judgments converge?  
  - **A. Yes** (shared reality would align judgments). → LEAF: **Narrow-Core Objectivism**.  
  - **B. No** (values can diverge despite shared facts). → LEAF: **Adaptive Tuning**.  
  *Empirical status: Contested; evidence from globalization shows partial convergence (e.g., on democracy) but persistent differences (e.g., gender roles).*  

  **\*9. Disagreement Implies Error**: When two people morally disagree (e.g., on capital punishment), must one be mistaken?  
  - **A. Yes** (moral truth is objective and unitary). → LEAF: **Robust Objectivism**.  
  - **B. No** (both could be right relative to context). → LEAF: **Cultural Relativism**.  
  - **C. Moot** (moral claims aren’t truth-apt). → LEAF: **Expressivism**.  
  *Empirical status: Stipulated for this tree; no direct empirical test, but surveys show folk meta-ethics is mixed.*  

  ---

  ### **Leaf Positions and Uptake**  
  *Each leaf includes a headline-ready take on what science implies about objectivity. "Uptake" summarizes what a writer holding this view may responsibly claim.*  

  | Leaf Position                     | Uptake (Headline-Ready Take)                                                                 |
  |-----------------------------------|----------------------------------------------------------------------------------------------|
  | **Robust Objectivism**            | "Science Reveals Widespread Moral Errors: Core Objectivity Survives Cultural Noise."         |
  | **Narrow-Core Objectivism**       | "Moral Unity at the Core: Science Finds Deep Principles Beneath Surface Variation."          |
  | **Constructivism**                | "Morality Built, Not Found: Science Shows Values Emerge From Social and Ecological Facts."   |
  | **Cultural Relativism**           | "Science Confirms Morality is Cultural: No Universal Truths, Only Local Norms."              |
  | **Expressivism**                  | "Moral Judgments Are Reactions, Not Discoveries: Science Exposes Emotional Foundations."     |
  | **Quietism**                      | "Folk Intuitions Are Red Herrings: Science Undercuts Debates About Moral Truth."             |
  | **Adaptive Tuning**               | "Morality as Adaptation: Science Reveals How Ecology Shapes Our Values."                    |
  | **Hybrid: Error-Adaptive**        | "Science Splits Morality: Core Truths Exist, But Peripheral Values Are Ecological."          |

  *Notes:*  
  - **Expressivism and Quietism share a path** (both reachable only via 6C → 5A → 7A). They cannot be separated by these cases; the tree groups them.  
  - **Hybrid view added** for logical coverage (combines Robust Objectivism + Adaptive Tuning).  

  ---

  ### **Unoccupied Answer Combinations**  
  Three combinations lack a leaf:  
  1. **Path: 1D → 2C → 6A** (Right principle + No disagreement + Against universal claim) → *Unmapped*: Logically possible but rarely defended; implies variation is illusionary without relativism.  
  2. **Path: 4C → 7B** (No evidence on WEIRD + Emotion incidental) → *Unattractive*: Inert about outlier reliability while denying emotion’s role; few theorists hold this.  
  3. **Path: 1A → 3B → 6B** (False belief + Correct for wrong reason + Against response reliability) → *Incoherent*: If condemnation is "correct," distrusting responses contradicts that.  

  ---

  ### **Unresolved Overlaps**  
  - **Expressivism and Quietism** (path: 1B → 5A → 7A) cannot be separated. Both treat moral judgments as non-truth-apt and frame-sensitive. A fake fork (e.g., adding a question about "moral facts") would violate your rules.  
  - **No other overlaps**: All other leaves have unique paths (see scoring key below).  

  ---

  ### **Scoring Key for Quiz Version**  
  *Assign points based on answers; highest score wins. (Each letter = 1 point toward a leaf. Ties go to the first match.)*  

  | Answer | Robust Objectivism | Narrow-Core | Constructivism | Cultural Relativism | Expressivism/Quietism | Adaptive Tuning | Hybrid |
