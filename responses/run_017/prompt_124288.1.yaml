  *Final leaf*: Highest score (e.g., 1A+3A+6B+9A = 4 for Robust Objectivism).  

  ---

  ### **Term Notes**  
  - **Truth-apt**: Capable of being true or false (e.g., "Snow is white" is truth-apt; "Ouch!" is not).  
  - **WEIRD**: Western, Educated, Industrialized, Rich, Democratic populations (common in studies).  
  - **Error theory**: The view that ordinary moral judgments are systematically false.  

  Word count: ~1,450 words (tree, leaves, key, and annotations).
