prompt: |-
  I work on the design side of retirement savings policy, and I keep running into a package of measures whose parts seem to me to presuppose incompatible things about when a person's own will is doing the work. I would like the implicit theory reconstructed, and I would like to know which parts of it are strictly required and which are optional extras.

  I am not asking about any particular country's statute. Take this as a stylized description of a design that exists in recognizably similar form in several workplace savings systems:

  - Workers are enrolled by default rather than invited to join. They contribute unless they actively opt out, and the opt-out is a short form that takes effect within a pay period.
  - The contribution rate rises automatically whenever the worker gets a pay rise, again unless she opts out. She is never asked whether she wants that; the escalation is justified by the thought that she will not feel the difference in take-home pay and would have chosen it had she thought about it.
  - The balance that accumulates is, by contrast, tightly constrained. It cannot be withdrawn before a set age except under narrow hardship rules, cannot be borrowed against, and must be invested through a capped menu of options selected by the regulator rather than by the worker.
  - Exiting is cheap at the point of enrolment and expensive later. Opting out at the start is frictionless; cashing out after a decade is not. Meanwhile the state runs campaigns presenting enrolment as simply what people like you do, which predictably makes the default stickier.

  Here is the tension I cannot resolve. For the purposes of joining and of escalating, the state treats an outcome produced by inertia — no reflection, no endorsement, often no awareness that a decision was available — as the worker's own, and counts it as her choice being respected rather than overridden. For the purposes of investing and withdrawing, the state treats her active and deliberate decisions as untrustworthy and overrides them. The same person, the same money, two different accounts of what makes an outcome hers.

  Some specific things I want:

  1. The most charitable reconstruction. What view of agency, preference, or autonomy makes it coherent to treat inertia-produced outcomes as respect-worthy while treating active decisions as constrainable? Is the operative distinction the one I have heard drawn between interfering with a person's means and disputing her ends, or is it the idea that she is binding her later self, or something about the choice architect standing in a fiduciary relation to her, or simply that defaults are cheap to resist and mandates are not? Which of these does the practice actually need in order to be defensible, and which does it merely sit comfortably with?

  2. Where it is underdetermined. Give me at least two theories with different foundations that would license the whole package as it stands — for instance a welfarist one that prefers nudges because they are cheap and reversible, a self-binding or Ulysses-style one, and one whose real motive is fiscal: keeping future retirees off means-tested support, which has nothing to do with the worker's own good. If all three generate the same institutional shape, what observation would distinguish them?

  3. A name and a verdict on a pattern I think I see. I have been calling it agency laundering: the outcome of the default is credited to the worker's own agency when that credit is useful for legitimacy, and quietly withdrawn when crediting it would block paternalistic constraint. Is that a genuine feature of the practice or my confusion? What would a defender answer — I assume something like: nothing is laundered, because the default was never credited to her agency at all, only to the cheapness of escape, while the constraints are justified separately by consequences. If that reply works, what does it cost the practice's self-presentation?

  4. What would change under a rival view. Suppose we accept that some architect must set every default, that no arrangement is therefore neutral, and that the only real question is which architect is trustworthy and accountable. Does the distinction between nudging and mandating collapse under that view, or does it survive in the cheapness of exit? Would anything in the policy actually have to change, or only its justification?

  5. A second-order worry I want tested. The state also decides whether the default applies to you at all, sets the terms of exit, and campaigns to make the default sticky. Does the republican thought that what matters is not being subject to another's arbitrary power apply to the power to set and adjust the default itself, in a way that an easy individual opt-out does not answer? Or is an opt-out available to each person individually sufficient to defeat that worry?

  Finally, a contrast that sharpens point 1 for me: in clinical settings, we will assume you consent to the operation unless you say otherwise would be scandalous, and doctors are required to secure informed, competent, voluntary consent — no defaults at all. What is the practice presupposing such that defaults are illegitimate there and legitimate here? Is it about the stakes, the expertise of the party proposing, the existence of a fiduciary duty, or something about how hard it is to reverse the decision afterwards? And if the answer is reversal cost, note that the savings design deliberately raises reversal cost over time.
reasoning: |-
  Okay, this is a deep and sophisticated policy design question about retirement savings systems. The user works on retirement policy design and has identified what seems like a fundamental inconsistency in how agency is treated across different components of default enrollment systems. 

  First I need to fully grasp the tension they're describing: On one hand, enrollment and contribution escalators rely on inertia being treated as legitimate expression of will. On the other hand, withdrawal restrictions and investment constraints actively override deliberate choices. That does seem paradoxical at first glance.

  The user wants several specific things analyzed: a charitable reconstruction of the underlying theory, alternative justifications, their "agency laundering" concern examined, implications of different philosophical views, republican freedom considerations, and a comparison to medical consent standards. That's quite comprehensive.

  Hmm... the medical consent analogy is particularly sharp. Why are defaults unacceptable in surgery but central to retirement policy? The key differences probably involve reversibility, stakes, and the nature of the decision-maker. Medical interventions are high-stakes and irreversible in ways retirement contributions aren't initially - though notably the system makes withdrawals more irreversible over time, which complicates things.

  For the charitable reconstruction, I should consider multiple angles: behavioral economics (present vs future selves), institutional competence (state as choice architect), and welfare consequences. The most coherent view might be that inertia reveals latent preferences when cognitive costs are high, while constraints protect against predictable future failures of will or judgment.

  The "agency laundering" charge is serious. A defender would likely respond that defaults aren't about attributing agency at all - they're welfare-enhancing tools justified by outcomes. But this does create tension with how policies are marketed ("this is what people like you do").

  On republican freedom: the power to set defaults does look like arbitrary power if not constrained. The individual opt-out may not fully address this because the state also influences opt-out costs and social norms. This deserves more attention than it usually gets.

  I should structure the response to address each numbered request clearly. The medical contrast makes a strong framing device - I'll use that to organize the core tension. For the theoretical alternatives, I'll need to show how welfarist, paternalist and fiscal motivations could all produce similar designs while having different foundations.

  The user seems highly sophisticated - they've clearly wrestled with this for some time. I should avoid talking down while ensuring the philosophical concepts are adequately explained. Their "agency laundering" concept is perceptive and deserves careful treatment rather than dismissal.
answer: |-
  Here's a structural analysis of the implicit agency theory in this retirement savings design, addressing your specific queries:

  ### 1. Charitable Reconstruction: The Coherent Theory
  The practice rests on a **temporal division of agency** combined with **asymmetric competence assumptions**:
  - **Inertia as revealed preference:** At *t1* (enrollment/escalation), the designer assumes (a) workers have a stable underlying preference to save (supported by savings gaps), (b) cognitive/attention barriers prevent expression, and (c) default mechanics merely overcome transactional friction. Opt-out ease preserves agency by making rejection costless.
  - **Constraints as protection against *future* self-harm:** At *t2* (withdrawal/investment), the designer assumes (a) present-biased preferences will dominate later (hyperbolic discounting), (b) individuals lack expertise for complex financial decisions, and (c) irreversible harms (poverty in old age) justify overriding active choices.

  **Core justification:** The practice *requires*:
  - **The reversibility principle:** Early opt-outs must be truly low-cost (time, effort, stigma) to preserve agency claims.
  - **Empirical welfarism:** Demonstrated behavioral failures (inertia, present bias) and welfare gains from constraints.
  - **Epistemic asymmetry:** Regulators possess superior knowledge of long-term needs than individuals.

  **What's optional:**
  - Paternalistic self-binding narratives (Ulysses contracts) are embellishments.
  - Fiscal motives (reducing state burden) can coexist but aren't necessary for coherence.

  ### 2. Underdetermined Foundations: Three Theories, Same Design
  | **Theory**          | **Foundation**                                  | **Distinguishing Observation**                     |
  |---------------------|------------------------------------------------|---------------------------------------------------|
  | **Behavioral Welfarism** | Maximizes long-term welfare using nudges + mandates to counter cognitive biases | Would abandon constraints if evidence showed individuals make optimal choices when engaged |
  | **Fiscal Republicanism** | Prevents future public dependency; treats savings as civic duty | Supports harsher early withdrawal penalties even with low old-age poverty risk |
  | **Paternalist Self-Binding** | Protects "true" future self from "irrational" present self | Would allow overrides *only* for time-inconsistent preferences, not "expertise" gaps |

  **Test:** Introduce a low-risk retiree cohort (e.g., trust fund recipients). Welfarists would relax constraints; fiscal theorists would maintain them; paternalists would assess self-control risks.

  ### 3. "Agency Laundering": Valid Critique?
  **Your charge:** Default outcomes are claimed as "individual choice" for legitimacy, but agency is denied when active choices conflict with design goals.

  **Defender's reply:** "We never attribute *authentic agency* to defaults—only *permissibility*. Inertia exploitation is justified by welfare gains and reversibility. Constraints are justified separately by harm prevention. The worker's agency is preserved via opt-outs."

  **Cost to self-presentation:** This reply:
  - Undermines marketing claiming "this is what people *like you* choose" (implying endorsement)
  - Reveals the state's *non-neutral* role as architect
  - Highlights that "easy exit" is only available *before* behavioral lock-in occurs

  ### 4. Rival View: Architect Accountability
  If we reject neutrality and focus solely on **architect legitimacy**, the practice changes in two ways:
  - **Nudge vs. mandate distinction softens:** Both become exercises of power. Cheap exit merely reduces *intensity* of power, not its nature.
  - **Policy adjustments required:**
    - Defaults must be set via democratic input (e.g., citizen assemblies)
    - Opt-out costs must be continuously validated (e.g., stigma measured)
    - Constraints require stronger evidence of harm prevention
    - Architect motives (fiscal vs. welfare) become critically relevant

  ### 5. Republican Worry & The Medical Contrast
  **Republican concern:** The state's power to set defaults *and* manipulate opt-out costs (via campaigns, complexity) creates arbitrary dominance. Individual opt-outs don't negate this if:
  - Social pressure ("what people like you do") functions as coercion
  - Cognitive burden of understanding options is non-trivial
  - Architect adjusts rules retroactively

  **Medical contrast explained:**
  | **Factor**               | **Medical Consent**          | **Retirement Defaults**       |
  |--------------------------|------------------------------|-------------------------------|
  | **Reversibility**        | Low (surgery irreversible)   | High *initially* (opt-out)    |
  | **Stakes asymmetry**     | Life/death; extreme harm     | Incremental welfare loss      |
  | **Expertise asymmetry**  | Patient can't self-diagnose  | Worker *could* self-manage    |
  | **Fiduciary intensity**  | Higher (single-event trust)  | Lower (systemic, long-term)   |
  | **Cognitive context**    | Acute stress; vulnerability  | Routine administrative choice |

  **Crucial irony:** Retirement systems *engineer irreversibility later* (withdrawal locks). This mirrors medicine's high stakes but lacks commensurate consent rigor—suggesting the real distinction is **institutional habit** more than principle.

  ---

  ### Synthesis: What Holds This Together?
  The design coheres *only if*:
  1. **Cheap early opt-outs** genuinely exist (validating inertia as "non-rejection")
  2. **Constraints demonstrably prevent greater harms** than they impose
  3. **Campaigns don't cross into manipulation** (e.g., exploiting identity threats)

  **Your core tension persists:** Trusting inertia requires assuming people *would* choose wisely if engaged; constraints assume they *won't*. This gap is bridged by **temporal paternalism**—the state claims greater insight into your future self's interests than your present self possesses. Whether this constitutes agency laundering depends on if one views the architect as a *facilitator* of latent preferences or an *imposer* of external ones. The medical contrast reveals that stakes and reversibility alone can't justify the asymmetry—institutional power and path dependency play decisive roles.
