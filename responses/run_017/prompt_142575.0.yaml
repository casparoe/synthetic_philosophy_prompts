  Breaking down "obviously true" for AC: It could mean intuitive obviousness from finite choices, methodological acceptance in math, or historical precedent. But is it really obvious? Constructivists disagree, and infinite choices aren't self-evident. For the roommate's concern, none of these directly counter the objection that the proof doesn't construct a basis.

  "Well-ordering obviously false": People find it counterintuitive because well-ordering the reals seems impossible. But this is an intuition issue, not a contradiction. The equivalence means if AC is true, well-ordering must be possible, even if we can't visualize it. The roommate's worry isn't addressed here either; it's about the proof's non-constructiveness, which applies to all equivalents.

