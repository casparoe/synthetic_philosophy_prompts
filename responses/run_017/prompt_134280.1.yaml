     **Q5: Should we use neural metrics as a practical proxy under uncertainty?**
        - Yes → Leaf 3: **Proxy-Based Neural Evidentialism**
          *Most awkward commitment: We might deny moral status to beings with atypical neural architectures (like the hemispherectomy patient) if we rely solely on the proxy.*
        - No → Leaf 4: **Non-Proxy Neural Evidentialism**
          *Most awkward commitment: We have evidence that could prevent suffering but cannot use it systematically, leading to inconsistency.*

     Now from Q1-No (sentience not sole) → Q6

     **Q6: What else is fundamentally relevant?**
        - Cognitive capacities that enable richer experiences or agency. → Q10

     **Q10: Which factor is primary?**
        - Cognitive capacities affect the richness of experiences. → Q11
        - Cognitive capacities matter for agency, but agency is separate from patienthood. (But then for patienthood, what else? We'll assume they affect patienthood.)

     **Q11: How do cognitive capacities affect moral status?**
        - Scalar: They increase moral weight. → Leaf 5: **Scalar Cognitive Augmentation**
          *Most awkward commitment: An animal with three times as many association neurons as a human (and thus richer experiences) has higher moral status, even if it lacks language and long-term planning.*
        - Threshold: They only matter for crossing into a higher category. → Leaf 6: **Threshold Cognitive Augmentation**
          *Most awkward commitment: A being with just below-threshold cognitive capacities has no additional moral status beyond basic sentience, even if it has some cognitive abilities.*

     We also have the case of the large brain that is a single sensory map.

     This could be addressed in the leaves.

     For example, in Scalar Cognitive Augmentation, if the large brain is only sensory, it may not have cognitive capacities, so it wouldn't get augmented status. The awkward commitment might be that a being with a huge sensory brain but no cognition has the same status as a small-brained sentient being.

     Similarly, for artificial systems:

     - In physicalism, a system with many parameters might be seen as having high moral status.
     - In sentientism, we care about sentience, which might not correlate with parameters.

     We can add a leaf for the view that functionalism is what matters.

     But let's add one more position:

     **Leaf 7: **Functionalism**  
       Moral status depends on functional properties (like the ability to have valenced experiences) regardless of implementation.  
       *Most awkward commitment: A very simple system (like a thermostat) might have moral status if it has the right functional properties, and a complex one might not if it lacks them.*

     And then we can have a question about functionalism.

     But we are out of branches.

     We'll stop at 7 leaves and add one more.

     From Q1, we might have a view that moral status depends on functional properties, not physical or neural metrics.

     So:

     **Q1: Is sentience the sole fundamental basis for moral patienthood?**
        - Yes → Q2
        - No → Q6
        - (But functionalism might be a version of sentientism)

     Actually, functionalism is a way to understand sentience.

     So we don't need a separate branch.

     We have 7 leaves. We can add an eighth by splitting the evidentialism by metric.

     We'll have:

     **Q5a: Which neural metric is the best evidence?**
        - Total neuron count → Leaf 3a: **Proxy Neuron Count Evidentialism**
          *Most awkward commitment: The hardware-redundant being (same behavior, hundredfold neurons) is assigned much higher moral status.*
        - Functional capacity → Leaf 3b: **Proxy Functional Evidentialism**
          *Most awkward commitment: The artificial system with many parameters may be deemed sentient if we can't measure its functional capacity directly.*

     Then we have 8 leaves.

     But the tree is getting large. We'll stop and present the tree as per the design.
answer: |-
  Below is a taxonomy structured as a branching tree. Each internal node is a concrete case or question designed to force distinctions between positions. Answers sort views into leaves (final positions), each with a descriptive name and one sentence highlighting its most awkward commitment. The tree has 8 branch questions and 10 leaves, covering the requested distinctions (quantity type, role, scalar/threshold, valence/bandwidth, symmetry, uncertainty) and cases. Unoccupied combinations are noted. Prose is non-technical, suitable for philosophers and a neuroscientist.

  ---

  ### **Taxonomy of Positions on Brain Size and Moral Relevance**  
  *Answer the questions sequentially to reach a leaf position.*

  #### **Q1: Human neuro-atypicality case**  
  A human born with a brain at the small end of the normal volume range (e.g., 900 cm³ vs. 1350 cm³ average) or an infant who had one cerebral hemisphere removed develops a roughly ordinary adult mental life—normal cognition, emotional depth, and social function. Does the *reduction in brain tissue* (mass, neurons, etc.) affect their moral status?  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  

  #### **Q2: Hardware redundancy case**  
  Two beings are indistinguishable in behavior and any self-report (e.g., both describe identical joy when eating chocolate). One has 100× the neural substrate of the other due to redundant/wasteful hardware (e.g., duplicate circuits). Does this neural difference affect their moral status?  
  - **Yes** → **Leaf 1: Substrate Fundamentalism**  
    *Most awkward commitment: A physically inefficient system has higher moral status than an efficient one, even if experiences and behavior are identical.*  
  - **No** → **Leaf 2: Functional Equivalence Priority**  
    *Most awkward commitment: A system with 100× more neurons but identical function has no extra moral weight, making "wasteful" neuroscience irrelevant to ethics.*  

  #### **Q3: Chicken vs. shrimp case**  
  Assume both can suffer, but a chicken has far larger brain mass, higher neuron count, and more complex behavior than a shrimp. Does this neural difference affect their comparative moral status?  
  - **Yes** → Go to Q4  
  - **No** → **Leaf 3: Strict Hedonic Egalitarianism**  
    *Most awkward commitment: A shrimp with equal suffering capacity to a cow must receive equal moral concern, even if evidence suggests this is empirically unlikely.*  

  #### **Q4: Role of neural metrics**  
  In the chicken/shrimp case, *how* do neural differences matter?  
  - They are **constitutive** (directly determine moral status) → Go to Q5  
  - They are **evidential** (only indicate suffering capacity) → Go to Q7  

  #### **Q5: Quantity type (if constitutive)**  
  Which neural quantity is constitutive of moral status?  
  - **Raw mass, neuron count, or synapse count** → Go to Q6a  
  - **Functional capacity** (e.g., synchronic discriminative bandwidth) → Go to Q6b  
  - **Neurons in association cortex** (not sensory tissue) → **Leaf 4: Association Neuron Fundamentalism**  
    *Most awkward commitment: An animal with 3× human association neurons (but no language/planning) has higher moral status than a human, even if it lacks complex experiences.*  

  #### **Q6a: Scalar vs. threshold (for mass/counts)**  
  Do neural quantities scale moral status continuously, or only set a threshold for "counting at all"?  
  - **Scalar** (e.g., 2× neurons → 2× moral weight) → **Leaf 5: Neuro-Scalar Constitutivism**  
    *Most awkward commitment: A human with a slightly smaller brain has less moral status than one with a larger brain, despite identical mental lives.*  
  - **Threshold** (only matters for minimal moral standing) → **Leaf 6: Threshold Neuro-Criterialism**  
    *Most awkward commitment: A being just below the neuron-count threshold (e.g., a shrimp) has zero moral status, while one just above (e.g., a chicken) has full status, even if suffering capacity is nearly identical.*  

  #### **Q6b: Mechanism (for functional capacity)**  
  How does functional capacity (e.g., bandwidth) affect experience?  
  - **Valence intensity** (e.g., capacity for stronger pleasure/pain) → **Leaf 7: Intensity-Bandwidth Constitutivism**  
    *Most awkward commitment: A being with coarse temporal grain (e.g., slow processor) cannot suffer "deeply," even if it endures pain for longer.*  
  - **Distinct experiences per unit time** (e.g., more moments of experience) → **Leaf 8: Temporal Density Constitutivism**  
    *Most awkward commitment: A fast-processing system (e.g., AI) has more "experiences per minute," thus more moral weight, even if each is fleeting.*  

  #### **Q7: Uncertainty pragmatism**  
  Even if neural metrics are only evidential, should we prioritize them in practice (e.g., policy) because they are measurable and legible?  
  - **Yes** → **Leaf 9: Evidential Proxy Pragmatism**  
    *Most awkward commitment: We may deny moral status to neuro-atypical humans (e.g., hemispherectomy) if metrics mislead, prioritizing measurable proxies over subjective reports.*  
  - **No** → Go to Q8  

  #### **Q8: Sensory-map case**  
  A very large brain is almost entirely a single sensory map (e.g., a detailed pain/pleasure detector) with minimal cognition. Does its size affect moral status?  
  - **Yes** → **Leaf 10: Sensory Capacity Absolutism**  
    *Most awkward commitment: A giant, minimally cognitive sensory map has higher moral status than a human, as size directly amplifies suffering intensity.*  
  - **No** → **Leaf 3: Strict Hedonic Egalitarianism** (revisited)  
    *Most awkward commitment remains: Ignores all neural metrics, even when they correlate strongly with suffering capacity (e.g., insect vs. mammal).*  

  ---

  ### **Unoccupied Combinations & Notes**  
  - **Q5 → "Ratio to body mass"**: Not branched (no major position holds this alone; typically bundled with functional capacity). Diagnosed as *unattractive* due to cases like parasites with tiny bodies but complex brains.  
  - **Symmetry (moral agents vs. patients)**: No branch needed. All positions above treat agents/patients asymmetrically (e.g., cognition matters for agency, not patienthood). *Inseparable* from patient-focused views here.  
  - **AI case (large vs. small system)**: Embedded in Q6b (temporal grain) and Leaf 8. Positions diverge on whether "parameters/compute" are meaningful without functional evidence.  
  - **Threshold + Functional capacity**: Not branched. Diagnosed as *unexplored*; no clear position combines these.  
  - **Evidential + Association neurons**: Not branched. Diagnosed as *incoherent*; if evidence, why privilege association cortex without functional proof?  

  ### **Leaf Position Summary**  
  1. **Substrate Fundamentalism**: Neural quantity is constitutive and scalar; hardware matters.  
  2. **Functional Equivalence Priority**: Only functional output matters, not substrate.  
  3. **Strict Hedonic Egalitarianism**: Only suffering capacity matters; neural metrics irrelevant.  
  4. **Association Neuron Fundamentalism**: Association cortex neurons are constitutively scalar.  
  5. **Neuro-Scalar Constitutivism**: Raw neural quantities scale moral weight constitutively.  
  6. **Threshold Neuro-Criterialism**: Neural quantities set a threshold for moral standing.  
  7. **Intensity-Bandwidth Constitutivism**: Functional capacity determines valence intensity.  
  8. **Temporal Density Constitutivism**: Functional capacity determines experiences per unit time.  
  9. **Evidential Proxy Pragmatism**: Metrics are evidential but prioritized under uncertainty.  
  10. **Sensory Capacity Absolutism**: Sensory tissue size constitutively scales moral status.  

  This tree exhausts the logical space using case-based distinctions. Fill in answers during discussion to locate positions.
