answer: |-
  ### St. Petersburg Paradox in Your Vocabulary  
  **Core setup:** Unknown bias \(p\) (prior mass on \(p \geq 1/2\)), payoff \(2^n\) or \(2^n/n\) for \(n\) heads before first tail. Posterior predictive expectation remains infinite after finite data (due to persistent mass on \(p \geq 1/2\)). Tail thinness irrelevant for expectation divergence.  

  #### Paradox Restatement  
  - **Your frame:** Off-policy evaluation with heavy-tailed rewards. Payoff \(R = 2^n\) (or \(2^n/n\)) has \(\alpha\)-stable-like tails (\(\alpha = 1\)) but infinite mean when \(p \geq 1/2\). Importance ratios \(w = \pi / \mu\) (for policy \(\pi\), behavior \(\mu\)) inherit infinite variance. Sample means of \(R\) or \(wR\) are non-convergent (CLT fails). Tail index \(\alpha\) is inestimable from finite data.  

  #### Resolutions Translated  
  1. **Bernoulli (Log Utility)**  
     - **Claim:** Use \(U(R) = \log R\) instead of \(R\). Then \(\mathbb{E}[\log R] = \log 2 \cdot \mathbb{E}[n] < \infty\) (since \(\mathbb{E}[n \mid p] = (1-p)^{-1} < \infty\) for \(p < 1\)).  
     - **Your translation:** Apply a concave transform to rewards pre-averaging. Tails of \(\log R\) are lighter:  
       - \(R = 2^n \implies \log R = n \log 2\) (exponential decay in \(n\)).  
       - \(R = 2^n/n \implies \log R = n \log 2 - \log n\) (still integrable).  
       Self-normalized IS for \(\log R\) has finite variance. Tail index \(\alpha_{\log} > 2\).  
     - **Residue:**  
       - **Gap:** Assumes utility is *defined* as \(\log\) (long-run growth). Not derived from your framework.  
       - **Relabeling:** Purely a choice of concave function. Does not resolve linear-utility OPE.  

  2. **Bounded Utility / Truncation**  
     - **Claim:** Cap payoff at \(M\) (e.g., casino bankruptcy). Then \(\mathbb{E}[\min(R, M)] < \infty\).  
     - **Your translation:** Clip rewards or use winsorized estimators:  
       - Estimator \(\frac{1}{k} \sum \min(w_i R_i, M)\) or \(M\)-truncated mean.  
       - Analog: Clipped IS weights (e.g., \(w_i \leftarrow \min(w_i, \tau)\)).  
       Finite variance, bias-variance tradeoff.  
     - **Residue:**  
       - **Clean:** Directly portable. Your daily tool (clipping handles infinite variance).  
       - **Gap:** Arbitrary \(M\). Posterior predictive \(\mathbb{E}[R \mid data]\) remains infinite; clipping biases the *quantity estimated*.  

  3. **Growth-Rate / Ergodicity (Time-Averages)**  
     - **Claim:** Value = long-run growth rate \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\), not ensemble \(\mathbb{E}[R]\).  
     - **Your translation:** On-policy average log-return: \(\frac{1}{T} \sum_{t=1}^T \log R_t\).  
       - For \(R_t = 2^{n_t}\), \(\log R_t\) has finite mean (if \(p < 1\)).  
       - Self-normalization not needed; light tails.  
     - **Residue:**  
       - **Assumption added:** Repeated plays with reinvestment. Changes the *objective*.  
       - **Change of subject:** For "one-shot" evaluation, this is irrelevant. No OPE counterpart for \(T=1\).  

  #### Residue Report  
  - **What translates cleanly:**  
    - **Truncation/clipping:** Your go-to for infinite variance. Solves computational instability, not the paradox.  
    - **Tail index diagnostics:** For \(R = 2^n\), \(\mathbb{P}(R > x) \sim x^{-1}\) (\(\alpha = 1\)), so mean infinite, median finite. Median-of-means estimators converge (to median, not mean).  

  - **What requires added assumptions:**  
    - **Log utility:** Only "clean" in repeated settings (growth-rate max). For one-shot, assumes concave utility.  
    - **Ergodicity:** Implies reinvestment. No counterpart for evaluating a single action.  
    - **Self-normalized IS:** Fails here—weights \(w\) and \(wR\) both heavy-tailed; ratio inconsistent.  

  - **What has no counterpart / gaps:**  
    - **"Worth once" in long-run frameworks:** Undefined. Your tools (e.g., IS, MoM) target \(\mathbb{E}[R]\) or \(\text{median}(R)\), but \(\mathbb{E}[R] = \infty\) is a fact, not estimable.  
    - **Posterior persistence:** Your itch (posterior mass on \(p \geq 1/2\) never vanishes) means \(\mathbb{E}[R \mid \text{data}] = \infty\) is *unavoidable* in linear utility. No estimator converges to a finite value.  
    - **Log as discovery vs choice:**  
      - **Discovery:** Only if you accept that value = long-run growth rate (ergodicity).  
      - **Choice:** Otherwise, it’s an arbitrary concave transform. No free lunch.  

  #### Bottom Line  
  The paradox persists under linear utility: \(\mathbb{E}[R] = \infty\) is a mathematical truth, and no finite data can make the posterior predictive finite. What "resolves" it is either:  
  1. **Changing the quantity** (log utility, median, truncated mean), or  
  2. **Changing the setting** (repeated plays with reinvestment).  

  Your framework exposes the core: Heavy tails + unknown \(p\) make \(\mathbb{E}[R]\) non-estimable. Clipping and median-of-means handle variance but concede that the target is not the mean. The "resolutions" are workarounds for decision-making, not fixes to OPE for linear \(\mathbb{E}[R]\).
