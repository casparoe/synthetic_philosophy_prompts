     Verdict: Defensible but incomplete. Raising power alone (without lowering alpha) does help reduce FDR, but not as dramatically as the dual-run.

  5. **"The long-run error rates that Neyman and Pearson cared about are only a stand-in for the quantity we actually want, the probability that the hypothesis is true given the data; p-values never deliver that, which is why significance testing has produced a literature full of findings that do not hold up."**

