     - Total significant: 0.001 + 0.066 = 0.067
     - FDR = 0.001 / 0.067 ≈ 0.015 (1.5%)

     This is higher than the dual-run FDR of 0.8%. So indeed, lowering alpha to match the false positive rate of the dual-run gives a higher FDR (1.5% vs 0.8%) because the power drops more in the single study than in the dual-run (which had 64% power). However, note that the dual-run requires two studies, so the total sample size is doubled. If we double the sample size in a single study, then the effect size in standard error units would be larger. For a fixed effect, doubling the sample size would double the variance (so standard error divided by sqrt(2)? Actually, the standard error is proportional to 1/sqrt(n), so if we double n, the standard error is divided by sqrt(2). Therefore, the z-score for the effect becomes 2.8 * sqrt(2) ≈ 3.96.

     Then, if we set alpha to 0.00125 (two-sided) for this single study with double the sample size, the critical value is 3.23, and the power is Φ(3.96 - 3.23) = Φ(0.73) ≈ 0.77. Then:

     - Significant from non-null: 0.20 * 0.77 = 0.154
     - Significant from null: 0.80 * 0.00125 = 0.001
     - Total significant: 0.155
     - FDR = 0.001 / 0.155 ≈ 0.00645 (0.645%)

     This is comparable to the dual-run FDR (0.8%). So by doubling the sample size and lowering alpha, we can achieve a similar FDR reduction in a single study. Therefore, the student's claim that lowering alpha would not do the same job is incorrect.

     Moreover, the student claims the dual-run rule "changes how much support the data provide", but a single study with the same total sample size and a lower alpha also provides strong evidence.

     Verdict: Straightforwardly wrong.

     Correction: "A single study with double the sample size and a lower significance threshold (e.g., α=0.00125) can achieve a comparable FDR reduction."

  4. **"Nor would raising power help much, since power concerns misses rather than false alarms."**

     This is misleading. Raising power (by increasing sample size) does reduce FDR because it increases the true positives without affecting the false positives (if alpha is fixed). In the single-run scenario, if we raise power (by increasing sample size) while keeping alpha=0.05, then:

     - Significant from non-null: 0.20 * (increased power, say 0.99) = 0.198
     - Significant from null: 0.80 * 0.05 = 0.04
     - Total significant: 0.238
     - FDR = 0.04 / 0.238 ≈ 16.8%

