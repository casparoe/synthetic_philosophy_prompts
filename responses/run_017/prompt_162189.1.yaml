     Alternatively, we can compute the FDR for a single study at a lower alpha. Suppose we set alpha (two-sided) to 0.00125 * 2 = 0.0025 (to match the two-tailed false positive rate of the dual-run for the null, which was 0.00125? Actually, note: in dual-run, the false positive rate for the null is 0.00125 (for two studies, same direction). For a single study, to get the same false positive rate (but without the same direction requirement) we would set alpha to 0.00125 (two-sided) because the false positive rate for a single study is alpha. Then:

     - FPR = 0.00125
     - Proportion of significant findings from null: 0.80 * 0.00125 = 0.001
     - Proportion of significant findings from non-null: 0.20 * (power at alpha=0.00125 two-sided)

     The power at this low alpha would be less than 0.80. Let's assume the effect size is fixed. The original power (at alpha=0.05 two-sided) is 0.80, so the z-score for the effect is 1.96 (critical value) + 0.84 (for 80% power) = 2.8. Then for alpha=0.00125 two-sided, the critical value is about 3.23 (since Φ^{-1}(0.999375)≈3.23). The power would be Φ(2.8 - 3.23) = Φ(-0.43) ≈ 0.33. Then:

