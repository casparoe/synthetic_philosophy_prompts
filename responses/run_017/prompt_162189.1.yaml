     This is a Bayesian argument. It is true that Bayesian methods are not affected by the stopping rule (in the sense that the likelihood principle holds) and that they provide posterior probabilities. However, the claim that replication rates would improve is speculative. Moreover, the reform proposed (dual-run) is about the design (two studies) and not about the analysis method. The student is suggesting that a Bayesian approach would be better, but the question is about the dual-run reform.

