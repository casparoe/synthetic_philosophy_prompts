  We are grading a student's answer to a two-part question. The question is about false discovery rates under two different regimes: single-run and dual-run confirmation.

  Part (a) requires calculating the proportion of statistically significant findings that come from null hypotheses (i.e., the false discovery rate, FDR) under both the status quo (single run) and the proposed dual-run confirmation.

  Part (b) is a discussion of the committee's argument, requiring the student to identify what does the real work in the arithmetic of part (a), whether a comparable reduction in FDR could be obtained within single-run testing (by lowering α or raising power), and a comment on how the idealizing assumptions make the arithmetic misleading.

  We will break down the student's answer and grade each part.

  ### Part (a) - 8 points

  The student's work for the single run:

  - Non-null hypotheses: 20% of tested hypotheses are non-null, and each has power 0.80, so the proportion of significant findings from non-null is 0.20 * 0.80 = 0.16.
  - Null hypotheses: 80% of tested hypotheses are null, and each has a false positive rate of 0.05, so the proportion of significant findings from null is 0.80 * 0.05 = 0.04.
  - Total significant findings: 0.16 + 0.04 = 0.20.
  - FDR = (significant findings from null) / (total significant findings) = 0.04 / 0.20 = 0.20 (or 20%).

  This is correct.

  Now for dual-run confirmation:

  The rule: both studies must be significant at 0.05 and in the same direction.

  For a null hypothesis (true null):
  - The probability that a single study is significant in a given direction is 0.025 (since two-sided test, and we require a specific tail). 
  - The probability that both studies are significant and in the same direction is (0.025) * (0.025) for a specific direction? But note: there are two directions. The student writes: "2 × 0.025² = 0.00125".

  Explanation: 
  - For a true null, the probability of a significant result in the positive direction is 0.025, and in the negative direction is 0.025. 
  - The event that both are significant and in the same direction can happen in two ways: both positive or both negative.
  - So, the probability is 2 * (0.025 * 0.025) = 2 * 0.000625 = 0.00125.

  This is correct.

  Then, weighted by the proportion of null hypotheses (0.80): 0.80 * 0.00125 = 0.001. This is the expected proportion of published findings from null hypotheses.

  For a non-null hypothesis:
  - The student says: the chance both studies are significant in the same direction is 0.80 * 0.80 = 0.64, and then dismisses the chance that both come out significant in the wrong direction as negligible (about 10^-6).

  But note: the power is 0.80 for a two-sided test? The problem states "power 0.80" which typically means the probability to reject the null when the alternative is true, which for a two-sided test includes both tails. However, the reform requires significance in the same direction. So we need the probability that both studies reject the null and in the correct direction.

  The student's approach is to note that the probability that both are significant in the correct direction is (power_directional)^2, but the power as given (0.80) is for the entire two-sided test. We need to adjust for the fact that the test is two-sided and the effect has a direction.

  Typically, for a two-sided test, if the effect is positive, then the power is the probability that the test statistic is above the positive critical value (which is 1.96 for α=0.05) and we ignore the negative tail because the effect is positive and the negative tail is very unlikely. However, there is a small probability of a Type III error (rejecting the null but in the wrong direction). The student correctly notes that the chance of both being significant in the wrong direction is negligible (Φ(-1.96 - 2.80) ≈ 10^-6) so we can approximate the power for the correct direction as 0.80.

  But note: the power of 0.80 is for the entire two-sided test, meaning the probability to reject H0 (in either tail) when the effect is present. However, for a symmetric two-sided test and a fixed effect in one direction, the probability to reject in the correct direction is approximately 0.80 minus half the probability of a Type III error? But the Type III error is very small (for a typical effect size, the probability of being in the wrong tail is very low). So it's a good approximation to say that the power for the correct direction is about 0.80, and the power for the wrong direction is negligible.

  Therefore, the probability that one study is significant in the correct direction is approximately 0.80. Then the probability that both are significant in the correct direction is 0.80 * 0.80 = 0.64.

  Then, weighted by the proportion of non-null hypotheses (0.20): 0.20 * 0.64 = 0.128.

  Total published findings: 0.001 (from null) + 0.128 (from non-null) = 0.129.

  FDR = 0.001 / 0.129 ≈ 0.00775 (about 0.775%), which the student rounds to 0.8%.

  The student states the drop is from 20% to under 1%, which is about a 25-fold drop (since 20 / 0.8 = 25).

  This calculation is correct and the approximations are reasonable.

  Breakdown of part (a) - 8 points:
  - Correct calculation for single run: 3 points (1 for each component: non-null, null, total, FDR)
  - Correct calculation for dual-run: 5 points (breakdown: 2 for null part, 2 for non-null part, 1 for total and FDR)

  But note: the student did not explicitly state the approximation for the non-null case (ignoring the wrong direction). However, the student did mention it and dismissed it as negligible, which is acceptable.

  So, for part (a): full credit. 8/8.

  ### Part (b) - 12 points

  The student's answer has several claims. We break it down:

  1. **"The twenty-five-fold drop happens because the second run multiplies the evidence: finding the same hypothesis supported twice is a Bayesian update, and the posterior probability that the hypothesis is true goes up by roughly the product of the two likelihood ratios."**

     This is defensible but a bit overstated. The dual-run procedure is effectively requiring two significant results, which does multiply the evidence in a Bayesian sense. However, the student attributes the drop entirely to the Bayesian update. The drop in FDR is also due to the much lower false positive rate under the dual-run (0.00125 for the null) compared to the single run (0.05). The product of the likelihood ratios is indeed the Bayesian factor for two independent studies, but the arithmetic in part (a) was done in terms of error rates. So while the Bayesian interpretation is one way to look at it, the drop can be explained by the stricter effective threshold (which is equivalent to a lower alpha) for the combined test.

     Verdict: Defensible but overstated. The student is correct that the evidence is multiplied, but the drop in FDR is also a consequence of the stricter effective alpha.

     Correction: Not exactly wrong, but we note that the same drop could be achieved by a single study with a stricter alpha (as we'll see below).

  2. **"That is why the reform works, and it shows that what really matters is evidence rather than error rates."**

     This is an opinion. The question does not require taking a stance on what "really matters". The reform does reduce FDR, but whether that is because of evidence accumulation or stricter thresholds is debatable. The student is advocating for a Bayesian perspective. We are to grade without penalizing the Bayesian stance, so we note that the statement is defensible but perhaps not the only interpretation.

