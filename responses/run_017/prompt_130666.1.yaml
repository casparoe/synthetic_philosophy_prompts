prompt: |-
  I'm writing the third chapter of my dissertation — philosophy, with a formal-epistemology sideline — and the chapter keeps collapsing into a dispute I don't think I've framed correctly. The topic is whether the machinery behind coherent extrapolated volition can be given a specification that is neither empty nor a quiet replacement of the agent by something else: the idea, roughly, that what we should aim at isn't what a person currently wants but what she would converge on under some counterfactual regime of greater knowledge, greater internal coherence, and more careful reflection. Rather than defend or attack that particular proposal, I want to treat it as one member of a wider family of idealized-preference accounts and ask what any member of that family has to deliver before it is worth arguing about which is best. So what I need from you is the specification itself, not a survey of the existing proposals.

  Concretely: write out the desiderata that any adequate account of an agent's idealized preferences has to meet, each with the case or consideration that makes it a requirement rather than a preference, and mark which are non-negotiable and which are local commitments of one research programme. Fix the purpose as follows: the account has to be good enough to hand to someone building a system that will act on a person's behalf in high-stakes, only partially foreseeable circumstances, and good enough to let me say whether the whole genus of views is coherent. To seed the list without constraining it, here is what I've been toying with. There is the锚 problem — the idealization has to correct for akrasia, adaptive preference, ignorance, and manipulation without drifting into telling the agent what she'd want if she were a different person, so I want a requirement that pins down what must be held fixed and what may be improved. There is the diachronic-seed problem: take two agents with indistinguishable current preference orderings but very different learning histories and self-narratives, and say whether the account owes me the same extrapolated output for both; I keep going back and forth on whether a requirement of seed-insensitivity is a genuine desideratum or a disguised commitment to there being a single true self. There is a coherence question — coherence of whom, and over what, given that the coherence in the name seems to be both an intrapersonal condition and a condition on aggregating many people. There is a tractability requirement I'm unsure how to state: if the idealization operator can't be approximated by anything we could build or consult, it may still be the right answer metaphysically, but it can't be the thing I hand to an engineer, and I don't know whether to count that as a desideratum on the theory or merely on our epistemic situation. And there is the question of what the output is even for: an answer to the agent's own deliberative question, or a mandate to a trustee acting in her name, since those seem to pull the idealization in different directions.

  The part I most want is the negative structure. Tell me which pairs of desiderata you think cannot be jointly satisfied — my own suspicion is that demanding the output be substantively action-guiding and demanding that it remain traceable to the agent's actual motivational starting point pull apart, and my supervisor thinks seed-insensitivity and responsiveness to the person she actually is are jointly unsatisfiable — and say which single requirement does the most exclusionary work, knocking out the largest share of the family. I'd also like you to distinguish desiderata that are genuinely about correctness from ones that are really artifacts of wanting the theory to vindicate a prior political or decision-theoretic commitment; I have a nagging sense that at least two items on my own list are prejudices in disguise. Close with a few lines, no more, on which two or three desiderata most accounts in the family silently satisfy and which they silently ignore. I'll do the scoring of the competing accounts myself once I have the list.
reasoning: |-
  Okay, let me unpack this dense philosophy dissertation problem. The user is wrestling with how to frame desiderata for idealized preference accounts, using coherent extrapolated volition as a case study but wanting broader structural clarity. 

  First, I notice the core tension: they need criteria rigorous enough to evaluate any idealized-preference theory, yet flexible enough to avoid collapsing into existing debates. The engineering angle ("hand to someone building a system") suggests they want metaphysical coherence and practical implementability simultaneously—that's probably where the key friction lies.

  Hmm, their listed problem areas reveal deeper fault lines:
  - The 锚 (anchor) problem seems fundamental: what aspects of identity survive idealization? If we fix too much, we get empty replication; too little, we lose the agent.
  - The diachronic-seed question feels like a false binary. Maybe seed-sensitivity isn't about true selves but about whether the theory respects personal histories as constitutive rather than contingent.
  - That tractability point is sneaky. If they demand computability, they privilege bounded agents; if not, the theory becomes purely theoretical. This might need splitting into two distinct desiderata.

  For negative structure, their supervisor's seed-insensitivity vs. responsiveness conflict is telling. I suspect that's where many theories fail silently—either by assuming idealized agents share universal rationality (ignoring personal anchors) or by overfitting to particular psychologies (losing action-guidance). 

  The political commitment warning resonates too. For example, demanding "single true self" outputs might covertly assume individualism, while requiring collective coherence could presuppose communitarian norms. Best to flag desiderata that implicitly favor certain ethical frameworks.

  On silent satisfactions/ignorances: most accounts quietly assume "coherence" means transitive preferences (easy win) but ignore that coherence under uncertainty requires radical world-model revisions (hard problem). Also, tractability gets lip service until someone points out that Kolmogorov-efficient deliberation is impossible for embedded agents.

  The output-purpose ambiguity feels critical. If it's for personal deliberation, idealization must preserve identity-continuity; for trustees, it needs intersubjective justifiability. No theory can optimize both equally—that's likely the irreconcilable pair.
answer: |-
  Here is a structured set of desiderata for any account of idealized preferences, designed to expose tensions and critical boundaries. Desiderata are categorized by **non-negotiable** (NN: necessary for coherence/agency), **functional** (F: required for practical deployment), and **programmatic** (P: contingent on theoretical commitments). Negative structures and silent biases follow.  

  ---

  ### **Core Desiderata**  
  1. **Anchored Identity (NN)**  
     - *Requirement*: The idealization must correct epistemic/volitional defects (ignorance, akrasia) while preserving the agent’s *core practical identity* (values, dispositions, or cares constitutive of "who she is").  
     - *Case*: Without this, idealization replaces the agent (e.g., Einstein’s preferences after "idealization" shouldn’t converge with Picasso’s).  
     - *Non-negotiable*: Losing the anchor voids the theory’s purpose (acting *for the agent*).  

  2. **Substantive Action-Guidance (F)**  
     - *Requirement*: Output must resolve non-trivial real-world choices (e.g., medical or fiduciary decisions) under partial knowledge.  
     - *Case*: An account that only outputs "be more rational" fails its engineering purpose.  
     - *Functional*: Mandatory for trustee systems; optional for pure theory.  

  3. **Tractability Proxy (F)**  
     - *Requirement*: The idealization process must admit computable approximations (e.g., via bounded rational agents or iterative refinement).  
     - *Case*: If idealization requires omniscience, it cannot guide real AI/trustees.  
     - *Functional*: Not a metaphysical flaw but a deployment constraint.  

  4. **Diachronic Seed-Sensitivity (P)**  
     - *Requirement*: Outputs may vary for agents with identical current preferences but divergent histories/self-narratives.  
     - *Case*: A traumatized artist vs. a nurtured artist with identical present preferences may merit different extrapolations.  
     - *Programmatic*: Rejects "true self" essentialism; required for narrative theories of identity.  

  5. **Coherence Scope Specification (NN)**  
     - *Requirement*: Define whether coherence is intrapersonal (logical consistency), interpersonal (group agreement), or both.  
     - *Case*: Ambiguity here conflates personal idealization with societal moral justification.  
     - *Non-negotiable*: Unspecified scope permits category errors.  

  6. **Output Function Clarity (F)**  
     - *Requirement*: Explicitly state if output is for *deliberation* (agent’s first-person use) or *trustee mandate* (third-party enforcement).  
     - *Case*: Deliberation allows revisable ideals; mandates require justifiability to others.  
     - *Functional*: Shapes idealization’s flexibility/rigidity.  

  ---

  ### **Negative Structure: Irreconcilable Pairs**  
  - **Action-Guidance vs. Anchored Identity**  
    - *Conflict*: Strong action-guidance demands specific outputs under uncertainty, but anchoring requires respecting the agent’s fuzzy, context-sensitive identity. Pulls toward either overspecification or vacuity.  
    - *Exclusionary power*: This pair eliminates most of the genus. Accounts that satisfy both (e.g., via "value landscapes") risk covertly replacing the agent.  

  - **Seed-Sensitivity vs. Single True Self (Responsiveness)**  
    - *Conflict*: Seed-sensitivity (*P*) demands history-dependence; "responsiveness" (often conflated with anchoring) assumes a persistent core self. Histories may fragment or reconstitute identity.  
    - *Supervisor’s point valid*: If "responsiveness" implies a fixed essence, seed-sensitivity is incompatible.  

  - **Tractability vs. Metaphysical Purity**  
    - *Conflict*: Strict idealization (e.g., full coherence under unlimited reflection) is computationally intractable. Approximations (e.g., bounded reflection) corrupt the ideal.  

  ---

  ### **Desiderata as Covert Commitments**  
  - **Suspect 1**: *Seed-insensitivity* often disguises commitment to rational agent universalism (all agents converge to the same "rational" preferences).  
  - **Suspect 2**: *Strong interpersonal coherence* smuggles in communitarian ethics, assuming shared norms are constitutive of idealized agency.  

  ---

  ### **Silent Satisfactions & Ignorances**  
  - **Silently Satisfied**:  
    1. *Coherence as transitivity*: Most assume idealized preferences must be transitive.  
    2. *Epistemic improvement*: All correct ignorance but rarely define its boundaries.  
  - **Silently Ignored**:  
    1. *Tractability*: Accounts rarely address how to approximate idealization.  
    2. *Output function*: Few specify if outputs are for agents or trustees.  

  ---

  ### **Exclusionary Work & Recommendations**  
  - **Most exclusionary**: **Action-Guidance + Anchored Identity**. This pair forces accounts to either (a) define "core identity" operationally (risking essentialism), or (b) admit the output isn’t fully the agent’s (inviting replacement critiques).  
  - **Critical test**: Apply desiderata to a minimal case (e.g., two agents with identical preferences but different core values). If the account outputs identical ideals, it fails anchoring; if wildly different, it risks underdetermination.  

  This framework exposes idealized preference theories as *either* metaphysically coherent but actionally useless *or* functionally useful but metaphysically suspect. The genus’s coherence hinges on relaxing action-guidance or accepting anchored identity as primitive.
