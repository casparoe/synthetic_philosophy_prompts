answer: |-
  Here is the adversarial collaboration document drafted for Priya (judgment theory) and Marco (bodily-feeling theory), structured as requested. The wording is neutral, actionable, and avoids theoretical presuppositions either would reject.

  ---

  **JOINT STATEMENT ON THE NATURE OF EMOTIONS**  
  *Adversarial Collaboration Between Judgment-First and Body-First Perspectives*

  ### I. AGREED CLAIMS  
  *(Both parties endorse these statements without reservation)*  

  1.  **Intentionality:** Emotions are *about* something (they have objects). The object can be real, imagined, recalled, anticipated, or abstract (e.g., "injustice").  
  2.  **Phenomenology:** Emotions involve a distinctive subjective feeling component.  
  3.  **Action Tendency:** Emotions motivate or prepare the organism for specific types of action (e.g., approach, avoidance, confrontation, withdrawal).  
  4.  **Bodily Involvement:** Characteristic physiological changes (e.g., heart rate, respiration, muscle tension, hormonal shifts) regularly co-occur with emotional episodes.  
  5.  **Cognitive Penetration:** Emotions are systematically influenced by an individual's beliefs, evaluations, memories, and expectations.  
  6.  **Development & Phylogeny:** Emotion-like states exist in human infants and non-human animals. These share core features (e.g., expressive behavior, physiological patterns, action tendencies) with full human emotions but may lack the conceptual richness or self-awareness of adult human emotions.  
  7.  **Moods vs. Emotions:** Moods are affective states that are typically lower in intensity, longer in duration, more diffuse in object (or lacking a specific object), and less tied to immediate action tendencies than paradigmatic emotions.  
  8.  **Unconscious Emotion:** It is possible for an individual to be in a state that meets the functional, behavioral, and physiological criteria of an emotion without being consciously aware of feeling that emotion at that moment.  
  9.  **Rationalizing Action:** A primary function of emotions is to provide reasons (whether good or bad) for action. Emotions make actions intelligible in light of the agent's perspective on their situation.  
  10. **Explanatory Scope:** A successful theory of emotion must explain:  
      *   The distinctive phenomenology ("what it feels like").  
      *   The characteristic patterns of physiological change.  
      *   The expression of emotion (facial, vocal, postural).  
      *   The intentionality (aboutness) of emotion.  
      *   How emotions motivate and rationalize action.  
      *   The recurring patterns or "kinds" (e.g., fear, anger, joy).  

  ### II. DISAGREEMENTS TABLE

  | Crux Point                                                                                                 | Marco's Position (Bodily-Feeling Theory)                                                                                                                                                                 | Priya's Position (Judgment/Construal Theory)                                                                                                                                                                                                 | Substantive (S) or Verbal (V)? (If V, specify)                                                                                                                                                                                               | Agreed Test Case                                                                                                 | Marco's Prediction                                                                                                                              | Priya's Prediction                                                                                                                                                                  |
  | :--------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. What constitutes the emotion itself?**                                                                | The emotion *is* the conscious perception (or awareness) of a specific, patterned change in the body's physiological state (interoception/proprioception), directed at an object.                         | The emotion *is* an evaluative state (a judgment, appraisal, or construal) representing the object as having a specific significance (e.g., dangerous, offensive, beneficial). Bodily changes are effects or concomitants.                    | **Primarily V:** Disagreement centers on which component (core bodily feeling vs. core evaluative state) is *the* emotion. However, S elements exist regarding necessity of felt bodily change.                                               | **Recalcitrance:** Subject convinced walkway safe, reports *no* felt bodily disturbance, yet freezes/needs help. | If subject reports *no* felt bodily change whatsoever, this is *not* fear. It's likely a dissociated action tendency or reflex.                 | This *is* fear. The core evaluative state (construal of danger) is present despite belief contradiction and absence of felt bodily change. Bodily readiness might still occur unnoticed. |
  | **2. Is the felt bodily change necessary for the emotion?**                                                | **Yes.** Conscious perception of the specific bodily pattern is constitutive of the emotion. Without this felt bodily component, you don't have *that* emotion.                                          | **No.** The core emotion is the evaluative state. Felt bodily changes are frequent, important effects or expressions, but not constitutive. An emotion can exist without conscious awareness of bodily feelings.                               | **S:** This is fundamental and testable. Linked to Crux 1.                                                                                                                                                                                   | **Denervated Subject:** Subject with blocked interoception (no gut/heart feedback), intact cognition/action/talk. | Subject will report diminished or absent emotional *feeling*. Emotion-guided behavior will be degraded, robotic, or lack typical intensity/depth. | Subject will report emotions based on evaluations/cognition. Emotion-guided behavior will be largely intact. Intensity *might* be reduced subjectively, but core emotion remains.      |
  | **3. Can the emotion itself (not just actions) be assessed for rationality?**                              | **Not directly.** Bodily feelings themselves are not true/false. We assess rationality of the *causes* (beliefs, perceptions triggering the feeling) or the *actions* motivated.                         | **Yes.** The evaluative state (the judgment/construal) itself can be assessed as rational/irrational (fitting/unfitting to the object, consistent/inconsistent with other beliefs).                                                          | **S:** Concerns the nature of the emotion core. Linked to Crux 1.                                                                                                                                                                            | **Recalcitrance (Analysis):** Focus on the freezing itself.                                                                                                                     | The freezing is non-rational (a physical reaction), or irrational only if caused by irrational *beliefs* triggering it.                           | The *fear* (the evaluative state representing danger) is irrational because it contradicts the subject's explicit, justified belief.                                                |
  | **4. What distinguishes an emotion from a non-emotional evaluation?**                                      | The specific, consciously felt bodily pattern. A cold evaluation (e.g., "this is dangerous") becomes emotional only when it triggers/becomes the felt bodily state.                                      | The presence of a *motivating* evaluative state with an action tendency. A cold evaluation lacks the motivational "push" characteristic of emotion. Bodily changes may signal this motivational push, but are not the defining factor.          | **S:** Concerns the threshold for calling a state "emotional."                                                                                                                                                                               | **Emotion with No Situation:** Subject in empty room, induced autonomic fear profile, no object/threat, no thought, no action tendency. | This is a bodily state ("bare feeling") mimicking a component of fear, but *not* an emotion, lacking intentional object and action tendency.        | This is *not* an emotion. It lacks the core evaluative state (appraisal of threat) and the action tendency. It's a physiological artifact.                                          |
  | **5. How to characterize "fear of fear"?**                                                                 | This is a genuine emotion. The object (the panic attack) is represented *as* threatening (via bodily patterns associated with threat), triggering the characteristic bodily feeling pattern of fear.      | This is a genuine emotion. The object (the panic attack) is evaluated *as* threatening (e.g., loss of control, social embarrassment, physical distress), constituting the fear. The bodily feeling of the panic is the *object*, not the emotion. | **Primarily V:** Both agree it's an emotion. Disagreement is about *how* to describe its structure (Crux 1 perspective), but **S** element: Is the bodily feeling of panic the *object* (Priya) or part of the *emotion* (Marco)? |                                                                                                                  |                                                                                                                                                 |                                                                                                                                                                                     |
  | **6. How to explain emotions toward fiction/music?**                                                       | Bodily feelings can be triggered directly by perceptual/sensory input (images, sounds), even without belief in the reality of the object. The emotion is the felt bodily response *to the stimulus*.     | Evaluative states (construals) can be directed at imagined or represented content (e.g., "this character's plight is sad," "this music *expresses* loss"). Belief in reality is not required for the evaluative state.                       | **S/V Mix:** Both agree emotions occur. **V:** Dispute over which component is primary. **S:** Marco emphasizes direct bodily trigger bypassing evaluation; Priya emphasizes evaluative construal of the stimulus/representation.              | **Fiction/Music:** Being moved by a known-fake film or abstract music.                                           | Intensity correlates strongly with reported bodily sensations (chills, tears, tension).                                                          | Intensity correlates strongly with the depth/richness of the evaluative construal (e.g., narrative engagement, perceived expressiveness).                                             |
  | **7. How to explain offline emotions (dread, past embarrassment)?**                                        | These involve faint, often recalled or imagined, bodily feelings associated with the object/event, triggered by thought/memory. The bodily feeling (even faint/imagined) is still constitutive.          | These centrally involve the evaluative state directed at the future/past object (e.g., "that meeting *will be* awful," "that past action *was* humiliating"). Bodily feelings may be minimal or absent; the evaluation dominates. | **S:** Reflects core disagreement (Crux 1, Crux 2).                                                                                                                            | **Offline Emotions:** Self-report and physiological monitoring during vivid recollection of past embarrassment or dread of future event. | Subject will report at least faint bodily echoes matching the emotion. Physiological markers might be detectable. Absence would challenge the theory. | Subject will report the emotion based on the evaluative thought. Physiological markers may be weak/absent without undermining the reality of the emotion. Absence is expected sometimes. |

  ### III. The "Perceptual" or "Attitudinal" Option
  We acknowledge the "emotions as perceptions of value" theory. Neither of us fully embraces it, but we agree it highlights aspects potentially underemphasized in our positions:
  *   **Marco:** My view shares the *perceptual* metaphor (bodily feelings as perceptions of bodily state, which register significance) but rejects the direct perception of *abstract value*.
  *   **Priya:** My view shares the focus on *value* but emphasizes the *judgmental* (conceptual, reason-responsive) nature of the evaluation over the *perceptual* metaphor.

  **Is it a distinct third camp?** Yes, it offers a distinct ontology (value perceptions are neither mere judgments nor mere bodily feelings).

  **Does it dissolve parts of our dispute?** It reframes the debate but doesn't dissolve the core S-disagreements (Cruxes 1-4, 6-7). For example:
  *   **Crux 2 (Necessity of Bodily Feeling):** The perceptual theorist typically sees bodily feedback as *informative input* for the value perception, making it necessary in most cases, similar to Marco's emphasis, contrasting Priya.
  *   **Crux 3 (Rationality):** Perceptual theories often allow emotions (as value perceptions) to be assessable for fittingness (like Priya), differing from Marco.
  *   **Crux 1 (Constitution):** It firmly constitutes the emotion as the perceptual state, distinct from both a judgment or a raw bodily feeling.

  **Conclusion:** The perceptual theory represents a substantively different third position. While it shares features with both of ours, it doesn't collapse the core disagreements between us regarding the necessity of felt bodily change (Crux 2) and the rational assessability of the emotion core (Crux 3). Its existence underscores that our debate is not merely verbal; there are multiple viable candidates for what constitutes the core of an emotion.

  ---
  This document provides clear agreements, pinpoints disagreements (distinguishing S and V), establishes testable predictions for key cases, and addresses the perceptual alternative. The wording in the agreed claims is designed to be read aloud without objection. The table forces specificity and pre-commitment on crucial issues.
