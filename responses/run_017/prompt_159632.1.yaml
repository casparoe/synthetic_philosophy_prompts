prompt: |-
  I don't have any training in any of this — I keep bees, got into an argument on a hobby forum about why worker bees are sterile and never breed, and ended up reading a couple of popular books about the gene's eye view. I built the argument below out of what I understood from those, and now I'm fairly sure it's broken somewhere, because where it lands is ridiculous.

  (1) For a trait to be an adaptation there has to have been selection for it: some history in which the individuals that had it left more descendants than the individuals that had the alternatives.
  (2) A trait can only be shaped by selection if differences in that trait get passed on. If it isn't heritable, selection can't accumulate it, whatever else it does.
  (3) The only thing actually transmitted between generations is DNA. A forager that got better at finding flowers during its lifetime, or one that lost a wing to a bird, passes none of that on. So genes are the only thing with the right kind of heredity.
  (4) So genes are the units of selection, and anything that isn't a gene is just the machinery genes use to get copies made.
  (5) That kills group selection: a colony or a herd doesn't have a genome it hands on as a unit and doesn't reproduce as a whole, so there's no group-level heredity, so no trait can ever have evolved "for the good of the group." Sterile workers have to be explained gene-wise, not colony-wise.
  (6) But run (2) on the individual organism as well. A queen doesn't pass her genome on as a whole — it gets shuffled up in making eggs, and her daughters differ from her and from each other. So there's no organism-level heredity either, in the same sense that there's no group-level heredity.
  (7) So organisms aren't units of selection either, and nothing is really "for" the organism. Eyes aren't for seeing in any real sense, a stinging worker isn't doing anything for her colony, and the fact that animals look designed is an illusion we read onto gene-level bookkeeping.
  (8) That's obviously nonsense. Eyes are for seeing, and explaining why animals look designed is most of what biology does.

  So: which step do I drop? My guess is the trouble is around (3) or (6), but I keep flip-flopping and I can't tell which one is doing the real work. Someone on the forum said the words "replicator" and "interactor" at me and told me to go read something, which I'm not going to do, and they wouldn't explain it either.

  I'd rather hold on to (5) than to (8) if I have to pick — I do think people reach for "for the good of the group" way too fast — but tell me what I'd be paying for that. Please don't just hand me names of theories or books; explain what distinction is actually doing the work and why the step I should reject looked fine when I wrote it.

  Keep it under 600 words total: one short paragraph on which step you'd reject and why, then one on what the other candidate rejections would cost me.
reasoning: |-
  Hmm, the user is a beekeeper who got into an argument about why worker bees are sterile, and then tried to build a genetic argument based on popular books about the gene's eye view. They've constructed an 8-step argument that leads to what they recognize as a ridiculous conclusion - that eyes aren't "for" seeing and organisms aren't real units of selection. They know there's a flaw but can't pinpoint where it is.

  Looking at their argument, step (6) is the critical problem. They correctly note that organisms don't pass intact genomes to offspring due to genetic recombination. But they mistakenly equate this with groups not passing intact genomes, which leads them to conclude that organisms can't be units of selection. This overlooks a crucial difference: organisms are cohesive vehicles that reliably replicate gene combinations through reproduction, even if not perfectly.

  The key issue is confusing replicators (genes) with vehicles (organisms). Genes are the replicating units that get copied, while organisms are the vehicles that carry those genes and interact with the environment. Selection acts on organism-level traits because those traits affect survival and reproduction, even though the genetic transmission isn't perfect. Organisms are valid functional units because they package genes in a way that allows selection to act.

  For the other points: Step (5) about group selection is actually mostly correct - sterile workers are well explained by kin selection and inclusive fitness theory. Step (3) is fundamentally solid - genes are indeed the primary replicators. Step (7) is the flawed conclusion we need to avoid.

  Rejecting step (6) preserves the core insights of gene-centered thinking while acknowledging that organisms are the level at which we observe adaptations. This maintains the power to explain sterile workers without denying that eyes are "for" seeing. Alternative rejections would either abandon the gene's eye view entirely (losing valuable insights) or force us to accept the absurd conclusion that nothing is "for" anything.

  The user wants to keep their understanding of why "for the good of the group" explanations are often flawed (which is good) while fixing where their argument goes off the rails. By clarifying the distinction between replicators and vehicles, we can preserve the valuable parts of their reasoning without ending up with nonsense.
answer: |-
  Here's the breakdown:

  **Reject step (6).** You correctly note that organisms don't pass *perfect, identical* genomes (due to recombination/meiosis). However, organisms *are* distinct, cohesive "vehicles" that reliably *reproduce*, passing on *a high-fidelity sample* of their genes to the next generation *as a functional package*. This *organism-level reproduction* provides the necessary heritability (step 2) for traits *expressed by the organism*. Selection acts *on* the organism (its traits affect its survival/reproduction), *through* the differential survival of its genes. The genome isn't passed whole, but the *functional unit* (organism) that successfully propagated its genes *is* selected. Eyes *are* "for seeing" *because* organisms with better-seeing eyes left more offspring containing the genes contributing to those eyes.

  **Other rejections would be costly:**
  *   **Reject (3):** Denying genes as the primary replicators loses the core explanatory power of the gene's-eye view. How do *you* explain the evolution of sterility (like worker bees) without genes persisting while the sterile individual doesn't reproduce? This undermines (5).
  *   **Reject (5):** Holding onto group selection for traits like worker sterility requires ignoring the powerful gene/kin selection explanations (workers help relatives *share* copies of their genes). You'd have to accept weak group heritability despite colonies not reproducing like organisms.
  *   **Reject (8):** Accepting that adaptations aren't "for" anything functional is biologically nonsensical and contradicts the entire purpose of evolutionary explanation. It throws out the baby with the bathwater.
  *   **Reject (1/2):** Abandoning heritability and selection for adaptations destroys evolutionary biology itself.

  The key distinction is between the **replicator** (the gene, which is copied) and the **vehicle** (the organism, which is selected *because* it houses/protects/propagates replicators). Step (6) mistakenly demands perfect vehicle-level heredity of the *genome*, confusing the vehicle with the replicator. Organism-level *functional* heredity (passing a functional gene *set* via reproduction) is sufficient for selection to shape organism-level traits.
