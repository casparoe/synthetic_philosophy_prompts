prompt: |-
  You are a decision theorist and philosopher of action who has published on rational choice under cognitive and temporal constraints. Think carefully before answering: open with a short brainstorming pass in which you list candidate requirements and then strike the ones that are really only preferences of one research program, and only afterwards give me the polished list.

  I want a specification, not a survey. I am drafting a paper whose claim is that bounded rationality is still a slogan rather than a theory, and before I propose anything I need the standard any successor would have to meet. So: write the desiderata that a normative theory of choice for a bounded agent must satisfy, where the purpose is fixed as first-personal — the theory is to be good enough to tell the agent herself what to do, in deliberation, and not merely to grade her from the outside after the fact.

  Give the case or consideration behind each requirement. Among those I expect you to address: the substantive/procedural distinction, and whether the theory may collapse it; the regress that arises because deciding how long to think is itself a decision made under the same constraints, so that any rule of the form keep computing until marginal cost equals marginal expected gain must explain how the agent estimates the value of further computing without having already done it; the currency problem, i.e., in what unit computational cost is denominated and whose budget it is charged to; assessability without knowing the answer, so that a procedure that luckily succeeds in one environment is not thereby vindicated; the permissibility of rationally adopting rules or commitments that make the agent worse at local optimisation; and budget plasticity, the fact that attention, memory, and skill are things the agent can invest in, so the constraints cannot be treated as a fixed exogenous parameter.

  I also want you to add a requirement I have been toying with and tell me whether it is genuine or spurious: call it grain-invariance, the demand that the theory's verdict about a choice not flip when the very same problem is redrawn with options or deliberation steps individuated more finely, since the cost of computing scales with how finely the problem is described.

  Then: flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding otherwise plausible candidates. Keep any scoring of the familiar families of views — expected utility with a computation-cost term, Simonian satisficing, fast-and-frugal or resource-rational approaches — to a few lines; the list is the deliverable. And tell me whether satisficing is a candidate theory at all, or only a description of what any adequate theory will have to predict.
reasoning: |-
  We are to provide a list of desiderata for a normative theory of choice for bounded agents, with the purpose of first-personal deliberation. The theory must tell the agent what to do during deliberation, not just evaluate after the fact.

  After careful thought, we must:
  - Brainstorm candidate requirements.
  - Eliminate those that are merely preferences of one research program.
  - Then present a polished list.

  We must address:
  1. Substantive/procedural distinction and whether it collapses.
  2. The regress problem: deciding how long to think is itself a decision under the same constraints.
  3. The currency problem: in what unit is computational cost denominated and whose budget?
  4. Assessability without knowing the answer: the procedure must be justified without knowing the outcome (non-luck based).
  5. Permissibility of adopting rules or commitments that might make local optimization worse.
  6. Budget plasticity: the agent can invest in improving attention, memory, and skill, so constraints are not fixed.

  Additionally, we are to consider "grain-invariance": the theory's verdict should not flip when the same problem is described with finer or coarser grain, because computational cost scales with the description.

  Then:
  - Flag any pair that might not be jointly satisfiable.
  - Identify the requirement that does the most work in excluding candidates.
  - Briefly score familiar families of views (expected utility with cost, satisficing, fast-and-frugal, resource-rational) in a few lines.
  - Address whether satisficing is a candidate theory or only a description.

  ---

  **Brainstorming: Candidate Requirements**

  1. **Procedural Guidance**: The theory must provide a procedure that the agent can actually follow in real time, given cognitive constraints. (Addresses first-personal purpose.)

  2. **Substantive Rationality Link**: The procedure should be connected to substantive rationality in a way that justifies why following it is rational. (But we must avoid collapsing the distinction if that is necessary.)

  3. **Regress Halting**: The theory must avoid an infinite regress in the decision about how much to deliberate. It must specify a stopping rule that does not require an impossible amount of computation.

  4. **Cost-Benefit Integration**: The theory must account for the cost of deliberation (time, cognitive resources) and balance it against the expected improvement in the decision. (But note the regress problem.)

  5. **Currency Specification**: The theory must specify the currency of computational cost (e.g., time, energy, opportunity cost) and how it is budgeted (e.g., within a global budget?).

  6. **Non-Circularity**: The theory must not require knowledge that can only be obtained by completing the very deliberation it is supposed to guide. (Assessability without knowing the answer.)

  7. **Robustness**: The procedure must be justifiable without relying on the specific outcome of a particular decision. It should work well across a range of environments. (Non-luck.)

  8. **Rule Permissibility**: The theory must allow for the rational adoption of rules, heuristics, or commitments that may lead to suboptimal outcomes in the short term but are beneficial in the long run or overall.

  9. **Endogenous Constraints**: The theory must account for the fact that cognitive constraints (like attention, memory) can be changed by the agent through investment (budget plasticity).

  10. **Grain-Invariance**: The theory's recommendation for a choice should not change when the problem is described with a different level of granularity (e.g., splitting an option into two equivalent ones) if the underlying decision is the same, because the cost of computation depends on the representation.

  11. **Feasibility**: The procedure must be implementable by a real human with limited cognitive capacities.

  12. **Normative Force**: The theory must provide reasons that the agent can recognize and use to motivate action.

  13. **Consistency**: The procedure should not lead to contradictions or inconsistent choices when applied to logically related decisions.

  14. **Adaptability**: The procedure should be able to adjust to different contexts and levels of available resources.

  Now, we strike requirements that are merely preferences of one research program:

  - **Strike Consistency?** While important, consistency might be too strong for bounded agents and might be a substantive requirement that a procedural theory might relax. But note: we are building a normative theory, so some form of consistency (e.g., avoiding blatant contradictions) might be necessary. Let's keep it but note that it must be bounded.

  - **Strike Substantive Rationality Link?** No, because without a link to what is substantively good, the theory might not be normative. But we must be careful: the link might be indirect (e.g., through a meta-justification).

  - **Strike Feasibility?** No, because the theory must be first-personally usable.

  - **Strike Adaptability?** It seems important for plasticity and robustness, so we keep.

  We note that some requirements might be in tension. For example, Procedural Guidance and Regress Halting are critical for the first-person perspective.

  We also note that the substantive/procedural distinction might be collapsed by a theory that defines rationality in terms of the procedure (but that might be controversial). We don't strike requirements based on that, but we must be aware.

  After striking only those that are clearly program-specific, we retain:

  1. Procedural Guidance
  2. Regress Halting
  3. Cost-Benefit Integration (but note the regress problem)
  4. Currency Specification
  5. Non-Circularity
  6. Robustness
  7. Rule Permissibility
  8. Endogenous Constraints (Budget Plasticity)
  9. Grain-Invariance
  10. Feasibility
  11. Adaptability
  12. Substantive Rationality Link (but we must define how)

  We also note that Consistency is important and we'll keep it as:

  13. Internal Consistency: The procedure should not lead the agent into clear inconsistencies (e.g., choosing A over B, B over C, and C over A in a cycle) when applied to a set of related choices, unless such cycles are unavoidable and acceptable under bounded rationality.

  But we must note that bounded rationality might allow for some inconsistencies. However, a normative theory should avoid them when possible. We'll keep it but qualify.

  Now, we polish the list and provide a case for each.

  ---

  **Polished List of Desiderata**

  1. **Procedural Implementability**: The theory must provide a step-by-step procedure that the agent can execute within her cognitive and temporal constraints. *Case*: Since the theory is for first-personal deliberation, the agent must be able to run the procedure in real time.

  2. **Regress Resolution**: The theory must solve the regress problem: the decision about how much to deliberate (and what deliberation steps to take) must itself be made without requiring an unlimited amount of deliberation. *Case*: Without this, the agent is stuck in an infinite loop of deciding how to decide.

  3. **Cost-Benefit Accounting**: The theory must incorporate the costs of deliberation (in terms of time, cognitive resources, opportunity costs) and weigh them against the expected benefits of improved decisions. *Case*: Bounded agents cannot ignore the cost of thinking.

  4. **Currency Clarity**: The theory must specify the currency (or currencies) in which computational costs are measured and how these costs are budgeted (e.g., within a global cognitive budget or per decision). *Case*: Without knowing what is being spent, the agent cannot manage her resources.

  5. **Non-Circular Assessability**: The theory must provide a way for the agent to assess the quality of her decision procedure without knowing the true optimal outcome. *Case*: A procedure that by luck leads to a good outcome in one instance is not thereby justified; the agent must have grounds to trust the procedure in advance.

  6. **Robustness Across Environments**: The procedure must be justifiable as generally effective across a range of environments the agent might face, without being tuned to one specific environment. *Case*: The agent does not know the exact environment she is in and must use a procedure that is robust.

  7. **Rule Rationality**: The theory must allow that it can be rational to adopt rules, heuristics, or commitments that may lead to locally suboptimal choices if they lead to better global outcomes or avoid costly deliberation. *Case*: Pre-commitment to a rule may save deliberation costs and avoid temptations.

  8. **Endogenous Budgets**: The theory must account for the fact that cognitive constraints (such as attention, memory, and skill) are not fixed but can be improved through investment. *Case*: The agent can choose to train skills or acquire tools that expand her cognitive capacities.

  9. **Grain-Invariance**: The theory's verdict about a choice must be invariant under redescriptions of the same decision problem that only change the granularity of the options or the steps of deliberation (when the underlying structure is the same). *Case*: The cost of deliberation depends on how the problem is represented (e.g., having more options to consider is more costly). The normative verdict should not flip because of a mere redescription.

  10. **Feasible Consistency**: The procedure should avoid generating blatantly inconsistent choices (like cyclic preferences) when applied to related decisions, unless such inconsistencies are unavoidable given bounded resources and are appropriately minimized. *Case*: While perfect consistency might be too demanding, the agent should not be led into clear inconsistencies that she would avoid with a little more thought.

  11. **Adaptive Flexibility**: The procedure should be able to adjust to variations in the decision context and to changes in the agent's own cognitive resources (both temporary and through long-term investment). *Case*: As the agent's resources change (e.g., due to fatigue or training) or the context changes, the procedure must adapt.

  12. **Substantive Grounding**: The procedure must be grounded in a way that connects it to the agent's goals and values, so that following the procedure is rationally justified by the agent's own lights. *Case*: Without a link to what the agent cares about, the procedure would be arbitrary.

  ---

  **Flagging Tensions**

  - **Regress Resolution vs. Cost-Benefit Accounting**: The regress problem arises precisely because we want to do cost-benefit accounting for deliberation. How can the agent estimate the expected gain of further deliberation without having done it? This might require a fixed stopping rule or a heuristic, but then we lose the fine-tuning of cost-benefit.

  - **Endogenous Budgets vs. Feasible Consistency**: If the agent can invest in cognitive resources, then she might be required to do so to avoid inconsistencies. But investing in resources is costly and might not be worth it. The theory must balance the cost of inconsistency against the cost of investment.

  - **Grain-Invariance vs. Cost-Benefit Accounting**: The cost of deliberation depends on the grain of the problem description. If we require grain-invariance, then the theory must abstract away from the representation, but the cost is representation-dependent. This might be very hard to satisfy.

  **Most Exclusionary Requirement**: **Regress Resolution** does the most work in excluding candidates. For example, expected utility with a computation-cost term often fails because it requires the agent to compute the expected value of computation, which itself requires computation, leading to regress. Similarly, many theories that require complex meta-reasoning are ruled out.

  ---

  **Brief Scoring of Familiar Families**

  - **Expected Utility with Computation Cost (EUCC)**: Adds a cost term to EU. Fails on regress resolution (how to compute the cost and benefit without infinite regress?) and often on grain-invariance (costs depend on representation). May also struggle with endogenous budgets and non-circularity.

  - **Simonian Satisficing**: Set an aspiration level and choose the first option that meets it. Addresses regress by having a fixed rule. May satisfy procedural implementability and cost-benefit in a crude way. But how to set the aspiration level? Without a non-circular method, it may fail non-circular assessability and robustness. It might not adapt well (fixed aspiration) and may not account for endogenous budgets.

  - **Fast-and-Frugal Heuristics (FFH)**: Simple rules that work in specific environments. Good for procedural implementability and cost-benefit (by being frugal). May satisfy regress by being simple. But may fail robustness if the environment changes. Also, how to choose the heuristic? This leads to a meta-problem. May not account for endogenous budgets.

  - **Resource-Rational Approaches (RR)**: Explicitly trade off resources and accuracy. Can be designed to address regress by using approximate methods. Might do well on cost-benefit and currency clarity. But often relies on knowing the resource-accuracy trade-off, which may not be non-circular. May also struggle with grain-invariance and endogenous budgets.

  ---

  **Is Satisficing a Candidate Theory?** 

  Satisficing is often presented as a candidate normative theory (e.g., by Simon). However, without a specification of how the aspiration level is set and adjusted, it is incomplete. If the aspiration level is set arbitrarily, the theory may fail non-circular assessability and robustness. Therefore, as a stand-alone theory, it is insufficient. But it can be part of an adequate theory if we add a method for setting aspirations that meets the desiderata. Thus, it is a candidate but incomplete without auxiliary rules for aspiration adjustment.

  ---

  **Final Note**: The list above is demanding. We suspect that no current theory satisfies all, but that is the point: bounded rationality is still a slogan and we need a theory that meets these.
answer: |-
  ### Brainstorming Pass: Candidate Requirements  
  Before presenting the polished desiderata, I brainstorm candidate requirements based on the core challenges of bounded rationality for first-personal deliberation. I then eliminate items that reflect idiosyncratic preferences of specific research programs (e.g., strict Bayesianism, ecological rationality) rather than universal constraints.  

  **Initial Candidates:**  
  1. **Procedural Implementability**: The theory must specify executable steps for real-time deliberation.  
  2. **Regress Stopping**: Avoid infinite loops in deciding "how much to deliberate."  
  3. **Cost-Benefit Integration**: Weigh computational costs against decision improvements.  
  4. **Currency Specification**: Define units for computational costs (e.g., time, energy).  
  5. **Non-Circular Assessability**: Justify the procedure without ex post outcome knowledge.  
  6. **Robustness**: Work across environments, not just lucky successes.  
  7. **Rule Permissibility**: Allow rules that sacrifice local optimization for global gains.  
  8. **Endogenous Constraints**: Treat cognitive budgets (attention, skill) as investable, not fixed.  
  9. **Grain-Invariance**: Preserve verdicts under redescriptions of options/steps.  
  10. **Substantive-Procedural Link**: Ensure procedures track "good" outcomes (without collapse).  
  11. **Feasible Consistency**: Avoid contradictions under resource constraints.  
  12. **Adaptivity**: Adjust to changing contexts/resources.  
  13. **Motivational Transparency**: Provide reasons the agent can internalize.  

  **Struck Candidates (Program-Specific Preferences):**  
  - **Substantive Dominance** (e.g., "Must approximate expected utility"): Reflects traditional rational choice preferences, not essential for boundedness.  
  - **Ecological Validity** (e.g., "Must exploit environmental regularities"): Specific to ecological rationality programs.  
  - **Heuristic Simplicity** (e.g., "Must use few steps"): Favors fast-and-frugal approaches; bounded agents may need complex rules in some contexts.  
  - **Strict Consistency**: Demanding logical coherence ignores feasibility; replaced with *Feasible Consistency*.  
  - **Motivational Transparency**: Important but derivative; if other desiderata hold, reasons emerge.  

  **Retained for Polishing**: 1–9, 10 (revised), 11 (revised), 12.  

  ---

  ### Polished Desiderata for a Normative Theory of Bounded Rationality  
  A theory must satisfy these to guide first-personal deliberation (not just external evaluation). Each includes the *case* (problem addressed) and whether it collapses the substantive/procedural distinction.  

  1. **Procedural Implementability**  
     - **Case**: Agents need real-time guidance; a "theory" that cannot be followed is useless for deliberation.  
     - **Substantive/Procedural**: Does not collapse—procedures must be executable, but need not guarantee substantive optimality.  

  2. **Regress Resolution**  
     - **Case**: Deciding "how long to think" is itself a bounded decision; rules like "stop when marginal cost = marginal benefit" require estimating the value of further computation without having done it, risking regress.  
     - **Substantive/Procedural**: Collapses partially—the stopping rule must be procedurally defined, but its justification is substantive (e.g., "this heuristic avoids wasted effort").  

  3. **Cost-Benefit Accounting**  
     - **Case**: Deliberation consumes resources; ignoring this leads to unrealistic demands.  
     - **Substantive/Procedural**: Does not collapse—costs are procedural, benefits substantive.  

  4. **Currency Clarity**  
     - **Case**: Costs (e.g., time, attention) must be quantified in a unit the agent can track (e.g., seconds, joules). Budget ownership ("whose resources?") must be explicit to avoid vagueness (e.g., personal vs. shared cognitive budgets).  
     - **Substantive/Procedural**: Does not collapse—currency is procedural, but its value is substantive.  

  5. **Non-Circular Assessability**  
     - **Case**: A procedure that luckily succeeds in one context may fail elsewhere; agents must justify it ex ante without knowing outcomes (e.g., "this heuristic has high accuracy in environments like past ones").  
     - **Substantive/Procedural**: Collapses—assessment requires linking procedures to substantive outcomes (e.g., reliability).  

  6. **Robustness**  
     - **Case**: Procedures tuned to one environment (e.g., specific probabilities) may fail in others; agents face uncertainty about conditions.  
     - **Substantive/Procedural**: Collapses—robustness is procedural (works across descriptions) but evaluated substantively (outcomes).  

  7. **Rule Rationality**  
     - **Case**: Agents may adopt rules (e.g., "always invest 10% of income") that cause local suboptimality but save deliberation costs or prevent errors (e.g., impulsive spending).  
     - **Substantive/Procedural**: Does not collapse—rules are procedural, their rationality is substantive (global efficiency).  

  8. **Endogenous Budgets**  
     - **Case**: Cognitive constraints (e.g., memory) are malleable via investment (e.g., training); treating them as fixed ignores the agent’s ability to self-modify.  
     - **Substantive/Procedural**: Collapses—investment decisions blur the line (procedural self-improvement for substantive gains).  

  9. **Grain-Invariance (Your Proposal)**  
     - **Case**: **Genuine requirement**. Computational cost scales with problem description (e.g., splitting one option into two identical sub-options increases cost). If verdicts flip under redescription (e.g., "choose A" vs. "choose A1 or A2"), the theory is representation-dependent, not normative.  
     - **Substantive/Procedural**: Collapses—grain affects procedure (cost), but invariance ensures substantive stability.  

  10. **Feasible Consistency**  
      - **Case**: Agents must avoid blatant contradictions (e.g., intransitive choices) *when feasible*, but perfection is impossible; consistency is bounded by resources.  
      - **Substantive/Procedural**: Does not collapse—consistency is a substantive norm, but procedures must only approximate it.  

  11. **Adaptivity**  
      - **Case**: Resources and contexts fluctuate (e.g., fatigue, new information); procedures must adjust without exhaustive recomputation.  
      - **Substantive/Procedural**: Does not collapse—adaptation is procedural, responsiveness to substance.  

  ---

  ### Tensions and Exclusionary Power  
  - **Key Tension**: **Regress Resolution vs. Cost-Benefit Accounting**  
    Cost-benefit requires estimating the value of computation, but Regress Resolution demands this be feasible without circularity. Grain-Invariance exacerbates this—finer grains increase cost estimates, complicating pre-computation assessments.  
    - **Other Tension**: **Endogenous Budgets vs. Non-Circular Assessability**  
      Investing in cognitive resources (Endogenous Budgets) requires predicting future benefits, but Non-Circular Assessability forbids relying on unknown outcomes.  

  - **Most Exclusionary Requirement**: **Regress Resolution**  
    This excludes theories requiring meta-computation (e.g., standard expected utility with a cost term). It forces a procedural solution (e.g., fixed heuristics) rather than substantive optimization.  

  ---

  ### Scoring Familiar Theories (Briefly)  
  - **Expected Utility + Cost Term**: Fails *Regress Resolution* (computing costs requires computation) and *Grain-Invariance* (costs are description-sensitive).  
  - **Simonian Satisficing**: Fails *Non-Circular Assessability* (aspiration levels lack ex ante justification) and *Endogenous Budgets* (aspirations don’t adapt to self-improvement).  
  - **Fast-and-Frugal Heuristics**: Fails *Robustness* (environment-specific) and *Rule Rationality* (not designed for global optimization).  
  - **Resource-Rational Approaches**: Best on *Cost-Benefit Accounting* but fail *Regress Resolution* (optimizing resource use requires unbounded computation).  

  **Is Satisficing a Theory?**  
  Satisficing is a *description* of behavior, not a standalone normative theory. Without specifying how aspiration levels are set (e.g., via learning or meta-rules), it lacks guidance for deliberation and fails *Non-Circular Assessability* and *Regress Resolution*. An adequate theory might *predict* satisficing but must ground it in the desiderata (e.g., "set aspirations based on historical success rates").  

  ---

  ### Summary  
  A theory meeting these desiderata would resolve foundational tensions (e.g., regress, plasticity) while providing actionable guidance. Grain-Invariance is a genuine addition, exposing representation-dependence in existing proposals. Current approaches fail multiple requirements, justifying your claim that bounded rationality remains a slogan.
