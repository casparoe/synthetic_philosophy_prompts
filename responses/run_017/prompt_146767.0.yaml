prompt: |-
  Hey — I'm a PhD student in robotics (HRI-ish) and I've somehow become the person in our lab who writes the weekly behaviour report on our fleet of hospital delivery robots. It's about 12-15 logged episodes a week, roughly 15-20 minutes each, and the report goes to the hospital's clinical safety committee: smart people, not technical at all, and they will definately read a sentence like "the robot wanted to avoid the glare" as a claim about the robot's mental life, or worse, about who's liable. Right now I write whatever comes out fastest, which is usually intentional-stance soup, and my supervisor and I keep having the same argument about it.

  So: I want a procedure, not a discussion. Something I can actually run on a logged episode, in order.

  The stuff I'm trying to operationalise is Dennett's three stances — physical, design, intentional — together with the idea that a pattern is real when adopting a stance buys you compression: a description of the behaviour that beats the raw frame-by-frame description. That's the bit I want turned into a checklist, and I want the simplifications to be honest about which distinctions they're dropping.

  One wrinkle I keep tripping over and that I want the procedure to handle explicitly: as I understand it the compression test is a test on the data. Which means a pattern that lives in my logging pipeline rather than in the robot still counts as real by that test — the sampler generates it. I need a step that separates pattern-in-the-log from pattern-in-the-thing, and I don't know how to do it without opening the box, which I can't: vendor-supplied, black box, no internals, and I can't just re-run the episode either, these are one-offs in a live corridor.

  What I need from you:

  - The questions to ask about an episode, in order, doable in ~15-20 min with no access to internals.
  - What counts as a sufficient answer to each one. What I usually have is: the log, a video, the ward map, and the planner's published spec.
  - Where the procedure stops with a no — i.e. hard rule, do not use intentional vocabulary here.
  - Where it hands the decision to a person because the question is one of values rather than facts, and which person, given that the committee is the audience and my supervisor signs off before it goes out.
  - What to do when I can't get anything resembling a compression number: one-off episode, no baseline, no repetition to speak of.

  Then run it on three episodes from last month:

  1. A robot takes a reliably longer route that avoids a stretch of corridor with afternoon sun glare. Everyone on the team says "it avoids the glare." There's no glare sensor and nothing about glare in the cost map as far as the spec shows; the route just correlates with time of day.
  2. A robot "hesitates" for about 3 seconds at one particular doorway, roughly 60% of the time, before going through. We found a fixed 3-second planner timeout in the spec. It feels like the design stance should kill the intentional story here, but the intentional story is by far the fastest thing for me to write and by far the easiest thing for the committee to read.
  3. A robot waits near the nurses' station until a nurse swipes, then follows behind them through a door it can't open on its own, at the two times of day when nurses are actually moving. I love describing this as "it waits for a nurse," and I suspect your procedure is going to take it away from me. If it does, say so straight. If it doesn't, tell me what I'd have to go check in order to earn it.

  Two more things. First: sometimes two stances compress the same episode about equally well and give conflicting write-ups. I need a tie-break rule, and I'd rather it be explicit than be left to my mood on a friday afternoon. Second: be honest about where this procedure misfires. My guesses are cases where the intentional stance predicts beautifully but is useless or actively misleading when you want to intervene on or fix the system, and timescale problems — patterns that only show up over months or over days. Say clearly what the procedure cannot do.
reasoning: |-
  We are given a problem: the user needs a procedure to analyze episodes of robot behavior in a way that operationalizes Dennett's three stances (physical, design, intentional) and the idea that a pattern is real when adopting a stance buys compression (i.e., a more compact description than the raw frame-by-frame). The user also wants to avoid attributing mental states inappropriately, especially for a non-technical audience (clinical safety committee) where such language might imply liability.

  The key constraints:
  - The robot is a black box (vendor-supplied, no internals, cannot re-run episodes).
  - Available data: log, video, ward map, planner's published spec.
  - Time per episode: 15-20 minutes.
  - Must handle the issue that patterns might be artifacts of the logging pipeline.

  The output should be:
  1. A step-by-step procedure (checklist) of questions to ask about an episode, in order.
  2. What counts as a sufficient answer for each step.
  3. Where the procedure stops with a hard rule (do not use intentional vocabulary).
  4. Where the procedure hands the decision to a person (and which person) because it's a values question.
  5. What to do when compression cannot be measured (one-off, no baseline).

  Additionally, we are to apply the procedure to three example episodes and address two more points: a tie-break rule for when two stances compress equally well, and an honest assessment of where the procedure misfires.

  Let's break down the procedure.

  ### Core Idea: Compression Test
  The goal is to see which stance (physical, design, intentional) provides the most compression (shortest description) of the behavior without losing essential details. However, we cannot run the compression test in a rigorous information-theoretic way (like Kolmogorov complexity) because we don't have multiple runs and the data is limited. Instead, we will use a more qualitative approach.

  ### Steps of the Procedure
  We need to structure the procedure as a series of questions. The order should be:
  1. **Physical stance**: Look for patterns that can be described in terms of physical laws and raw sensorimotor data.
  2. **Design stance**: Look for patterns that can be explained by the robot's design (as per the spec or known configurations).
  3. **Intentional stance**: Only if the above fail to provide adequate compression, consider intentional descriptions.

  But note: We must also address the logging artifact issue.

  ### Proposed Checklist Procedure

  **Step 0: Pre-process the Episode**
  - Watch the video and read the log to get a clear understanding of the episode.
  - Note the time, location, and any environmental factors (e.g., glare, human presence).

  **Step 1: Physical Stance Check**
  - **Question**: Can the entire episode be described as a sequence of physical events (e.g., "the robot moved forward at 0.5 m/s for 10 seconds, then turned left 90 degrees at 0.3 rad/s") without referencing any internal state or design?
  - **Sufficient answer**: If a purely physical description (using only the robot's observable motions and environmental conditions) is not excessively long (e.g., not much longer than the raw log) and captures the key events, then use the physical stance.
  - **Stop rule**: If the physical stance provides a description that is significantly shorter than the raw data (e.g., by summarizing repeated patterns of motion) and is sufficient for the report, stop here. Do not use intentional vocabulary.
  - **Compression note**: We are comparing the length of the physical description to the raw frame-by-frame. If it compresses, then the pattern is real in the physical sense.

  **Step 2: Design Stance Check**
  - **Question**: Does the behavior match a pattern that is explicitly documented in the planner's spec or known design? (e.g., "the robot always waits 3 seconds at doorways due to a timeout").
  - **Sufficient answer**: The behavior must be directly linked to a documented feature in the spec (or known design document). If so, describe the behavior in terms of that design feature.
  - **Stop rule**: If the design stance explains the behavior and provides a shorter description than the physical stance (or at least comparable and more informative), then use the design stance. Do not use intentional vocabulary if the design stance suffices.
  - **Compression note**: The design stance description should be shorter than the physical one because it abstracts over the physical details with a known rule.

  **Step 3: Intentional Stance Check**
  - **Question**: Only if the above stances fail to provide adequate compression, ask: Does attributing beliefs and desires to the robot (e.g., "the robot believes there is glare and desires to avoid it") yield a significantly shorter description?
  - **Sufficient answer**: The intentional description must be shorter than the physical or design descriptions and must not contradict known design or physical constraints. Also, the pattern must be robust (observed multiple times) or explainable by a consistent pattern in the environment.
  - **Stop rule**: If the intentional stance is the only one that compresses, but note: we must be cautious. The procedure stops with a hard rule against intentional vocabulary if:
    - The pattern is not robust (only one occurrence) or if it is an artifact of the logging (see Step 4).
    - The intentional description implies liability (e.g., the robot "decided" to do something unsafe) without clear evidence of a design feature that caused it.

  **Step 4: Pattern Reality Check (to address the logging artifact)**
  - **Question**: Is the pattern we observed in the log/video likely to be a real pattern in the robot's behavior or an artifact of the logging pipeline?
  - **How to check**: 
    - Look for consistency: Does the same pattern occur in multiple logs under similar conditions? (If you have historical data, check.)
    - Check the spec: Does the spec mention anything that might cause such a pattern? (e.g., sensor update rate, logging frequency)
    - Environmental factors: Can the pattern be explained by a consistent environmental factor (like time of day) that the robot might be reacting to?
  - **Sufficient answer**: If the pattern correlates with an external factor (like time of day) and the robot's design includes sensors that could detect that factor (even if not explicitly for that purpose), then it might be real. Otherwise, if the pattern is sporadic and not linked to any known design or environmental factor, it might be a logging artifact.
  - **Handoff**: If you cannot determine whether the pattern is real or an artifact, then do not use the intentional stance. Instead, describe the behavior in the design or physical stance and note the uncertainty. If the pattern is critical for safety, escalate to your supervisor (see below).

  **Step 5: Values and Safety Handoff**
  - **Question**: Does the description we are about to write have implications for safety or liability? (e.g., if we say the robot "wanted" to do something, it might imply agency and hence liability on the robot's part.)
  - **Handoff rule**: If the description uses intentional vocabulary and the episode involves a safety-critical event (e.g., near-miss, delay in delivery), then the decision to use intentional vocabulary must be approved by your supervisor. The supervisor must sign off on the language, knowing the audience (clinical safety committee).

  **Step 6: Compression Measurement Challenges (for one-off episodes)**
  - **When compression cannot be measured** (no baseline, no repetition): 
    - Default to the design stance if the behavior can be explained by the spec. 
    - If not, use the physical stance. 
    - Do not use the intentional stance for one-off episodes because the pattern might not be real (it could be a fluke).

  ### Tie-Break Rule
  If two stances provide approximately equal compression (e.g., both design and intentional stances give a short description):
  - Prefer the design stance over the intentional stance (to avoid anthropomorphism unless necessary).
  - Prefer the physical stance over the intentional stance if the physical description is clear and non-misleading.
  - If the design and physical stances are equally good, prefer design because it is more informative for a non-technical audience (it explains why the robot did what it did).
  - Make the tie-break explicit: always choose the stance that is lower in the hierarchy (physical < design < intentional) when compression is equal.

  ### Where the Procedure Misfires
  - **Cases where intentional stance predicts well but is misleading for intervention**: The procedure might still allow intentional stance if it compresses, but note that for intervention, the design stance is more useful. The report should include a note that the intentional description is for explanatory convenience only and does not reflect actual internal states. However, for the safety committee, it might be better to avoid intentional language in such cases. Therefore, in safety-critical contexts, the procedure should default to design stance even if intentional compresses.
  - **Timescale problems**: The procedure is designed for single episodes (15-20 min). Patterns that emerge over longer periods (days, months) are not captured by this per-episode analysis. For such patterns, aggregate analysis over multiple episodes is needed. This procedure is not designed for that.

  ### Now, apply to the three episodes:

  #### Episode 1: Avoiding the glare
  - **Step 1 (Physical)**: The robot took a longer route at a specific time of day. Physical description: "The robot traveled from A to B via point C (long route) between 2-3 PM." This is somewhat compressed but doesn't explain why the longer route.
  - **Step 2 (Design)**: The spec does not mention glare. The route choice might be due to the planner's cost map, but the spec doesn't show glare as a factor. So design stance doesn't explain it.
  - **Step 3 (Intentional)**: "The robot avoided the glare by taking a longer route." This is very short. But is it valid?
  - **Step 4 (Pattern Reality)**: The pattern is reliable (happens every afternoon). The robot has sensors (cameras?) that might be affected by glare, and the planner might be reacting to sensor noise. This pattern is real (not a logging artifact) because it correlates with time of day and is repeatable.
  - **Step 5 (Values)**: Not safety-critical? Probably okay, but note: the committee might think the robot has a mind. So we must be cautious.
  - **Decision**: Since the design stance doesn't explain it and the pattern is real and repeatable, the intentional stance compresses best. However, we can rephrase to avoid mental states: "The robot consistently takes a longer route during afternoon hours, possibly to avoid areas of high glare that may affect its sensors." This is a design stance explanation (sensor issue) but without intentionality. So we don't need to go to intentional.

  **Conclusion for Episode 1**: Use design stance with a note about the environmental factor. Write: "The robot's route selection algorithm chose a longer path during afternoon hours, which correlates with periods of high glare. This may be due to the impact of glare on sensor readings (not explicitly stated in the spec)." 

  #### Episode 2: Hesitation at doorway
  - **Step 1 (Physical)**: The robot stopped for 3 seconds at a doorway then proceeded. This is short but doesn't explain why.
  - **Step 2 (Design)**: The spec states a fixed 3-second planner timeout at doorways. This explains the behavior perfectly: "The robot paused for 3 seconds at the doorway as per a planned timeout in its navigation algorithm."
  - **Stop rule**: The design stance provides a short description and is documented. Do not use intentional vocabulary.

  **Conclusion for Episode 2**: Use design stance: "As per the navigation specification, the robot pauses for 3 seconds at certain doorways to assess the environment before proceeding."

  #### Episode 3: Waiting for a nurse
  - **Step 1 (Physical)**: The robot remained stationary near the nurses' station until a nurse swiped and then moved behind the nurse through a door. This is a bit long but clear.
  - **Step 2 (Design)**: Check the spec: does it have a feature to wait for humans in specific locations? The spec might describe door-opening protocols. If the spec says the robot can wait for a human to open a door and then follow, then design stance applies. Otherwise, we must investigate.
  - **Step 3 (Intentional)**: "The robot waited for a nurse to open the door and then followed." This is very short.
  - **Step 4 (Pattern Reality)**: The behavior occurs at specific times (when nurses are moving) and in a specific location. It is repeatable. The robot likely has a feature to wait for doors to be opened by humans and then proceed. But we need to check the spec.
  - **What to check**: Look in the spec for:
    - Door handling: does the robot wait indefinitely at a door it cannot open?
    - Human following: is there a feature to follow humans?
    - If the spec mentions these, then design stance suffices. If not, then the behavior might be emergent (e.g., the planner recalculates and happens to move when a human opens the door and moves in).

  **Decision**:
  - If the spec explains it (e.g., "the robot waits at restricted doors until they are opened by an authorized person, and then proceeds"), then use design stance: "The robot, as designed, waited at the door until a nurse opened it and then proceeded through."
  - If the spec does not explain it, then the behavior is emergent. We might use intentional stance for compression, but with caution. However, since the pattern is repeatable and tied to environmental conditions (nurse presence), we can describe it without intentionality: "The robot remained stationary near the nurses' station until a nurse approached and opened the door, after which the robot moved through the door." This is physical stance and is acceptable.

  **Conclusion for Episode 3**: If the spec explains the waiting and following, use design stance. Otherwise, use physical stance. Do not use intentional stance unless absolutely necessary (which it isn't, because a physical description is clear and non-misleading).

  ### Final Tie-Break Rule
  As stated: when two stances compress equally, choose the lower stance in the hierarchy (physical < design < intentional). So:
  - Physical vs Design: choose Design (if it explains the why).
  - Design vs Intentional: choose Design.
  - Physical vs Intentional: choose Physical.

  ### Honest Misfires
  - **Intervention mismatch**: The procedure might allow an intentional stance description that compresses well but does not help (or misleads) when trying to fix the system. For example, if the robot "avoids glare" but the real issue is a bug in the cost map, the intentional description might lead the committee to think the robot is working as intended. The procedure does not fully address this because we don't have access to the black box. Mitigation: always prefer design stance when possible and note uncertainties.
  - **Long-term patterns**: The procedure is per-episode. If a pattern (e.g., gradual performance degradation) only appears over months, it won't be captured. You need a separate longitudinal analysis.
  - **One-off anomalies**: For rare events, the procedure might default to physical stance, which might not be very informative. But that's safer than over-interpreting.
  - **Ambiguous patterns**: Sometimes a pattern might be real but not covered by the spec. The procedure might then allow intentional stance, which might be acceptable for the report but not for technical debugging.

  ### Summary of the Procedure (Checklist Form)

  **Procedure for Analyzing an Episode (15-20 min):**

  1. **Watch and Log Review**: Review the video and log, noting key events and environmental conditions.
  2. **Physical Stance**:
     - Q: Can I describe the entire episode concisely in terms of observable motions and environmental factors?
     - Sufficient: Description is significantly shorter than frame-by-frame and captures key events.
     - If yes, use physical stance and stop. Do not use intentional terms.
  3. **Design Stance**:
     - Q: Does the spec explain this behavior?
     - Sufficient: The behavior matches a documented feature in the spec.
     - If yes, use design stance and stop. Do not use intentional terms.
  4. **Pattern Reality Check**:
     - Q: Is the observed pattern (if any) likely real (not a logging artifact)?
     - Check: Look for repeatability (historical data), consistency with environmental factors, and spec hints.
     - If the pattern is unreliable or likely an artifact, revert to physical or design stance without the pattern.
  5. **Intentional Stance**:
     - Q: Only if steps 2 and 3 fail: Does attributing beliefs/desires yield a significantly shorter description without contradicting known facts?
     - If yes, then consider using intentional stance, but only if the pattern is real (from step 4) and repeatable.
     - For one-off episodes, do not use intentional stance.
  6. **Values and Safety Check**:
     - If the episode is safety-critical and we are considering intentional stance, hand off the decision to the supervisor for approval.
  7. **Tie-Break**:
     - If two stances compress equally, choose the one lower in the hierarchy: Physical < Design < Intentional.
  8. **Write the Report**:
     - Use the chosen stance, being explicit about what we don't know (e.g., "the cause is not documented in the spec").
     - Avoid mentalistic terms unless necessary and approved.

  This procedure should help you write reports that are both efficient and responsible.
answer: |-
  Below is a structured, operationalized procedure for analyzing robot episodes using Dennett's stances, designed for your constraints (black-box system, 15-20 min/episode, non-technical audience). It prioritizes **compression** (shorter descriptions of behavior) while explicitly filtering out logging artifacts and minimizing anthropomorphism. The procedure is a checklist of questions to ask in order, with clear exit rules, handoff points, and tie-breakers.

  ---

  ### **The Procedure: Checklist for Episodic Analysis**
  **Time Budget:** 15-20 min/episode  
  **Inputs:** Log, video, ward map, planner spec.  
  **Output:** A stance-based description (or escalation) for the report.  
  **Critical Rule:** Never use intentional stance (e.g., "wanted," "believed") unless explicitly permitted by this procedure.

  #### **Step 1: Physical Stance Check**  
  **Question:** *"Can I describe the entire episode *without* referencing the robot's internals, using only: (a) raw kinematics (e.g., velocity, position), (b) environmental physics (e.g., light, obstacles), and (c) time/location data from the log/video?"*  
  - **Sufficient answer:**  
    - The description is **shorter than frame-by-frame logging** (e.g., "Robot moved NE at 0.5m/s for 10s, stopped when sunlight saturated camera" vs. 300 log entries).  
    - It **matches observable evidence** (video/log) with no speculation.  
  - **Exit rule:**  
    - If **yes**, use physical stance. **Stop here.** Example: "Robot halted for 3s in doorway due to sudden door swing."  
    - If **no** (description is still too long/doesn't fit), proceed to Step 2.  

  #### **Step 2: Design Stance Check**  
  **Question:** *"Does the planner spec *explicitly* document a rule or parameter that directly explains this behavior (e.g., timeouts, cost maps, triggers)?"*  
  - **Sufficient answer:**  
    - The behavior **aligns 1:1 with a documented rule** (e.g., spec says "3s timeout at doorways" → robot pauses 3s).  
    - The description **compresses better than physical stance** (e.g., "Robot invoked door-crossing timeout" vs. physical description).  
  - **Exit rule:**  
    - If **yes**, use design stance. **Stop here.** Example: "Robot executed planned 3s door-assessment protocol."  
    - If **no** (spec is silent/contradictory), proceed to Step 3.  

  #### **Step 3: Pattern Reality Check**  
  **Question:** *"Is the observed pattern likely from the *robot* (not logging)? Check: (a) Does it correlate with *reproducible environmental factors* (e.g., time of day)? (b) Does it *recur* in ≥3 historical logs under similar conditions? (c) Is it *absent* when conditions change (e.g., no glare at night)?"*  
  - **Sufficient answer:**  
    - **≥2 "yes"** → Pattern is real (proceed to Step 4).  
    - **≤1 "yes"** → Pattern is likely logging artifact (e.g., sampler glitch). Revert to Step 1 or 2.  
  - **Handoff:** If unsure, **escalate to supervisor** with evidence. They decide if pattern is real.  

  #### **Step 4: Intentional Stance Eligibility**  
  **Question:** *"Does attributing a goal (e.g., 'avoid glare') compress better than physical/design, *and* is the pattern real (from Step 3)?"*  
  - **Sufficient answer:**  
    - Intentional description is **shorter and predictive** (e.g., "avoids glare" vs. listing all glare-related detours).  
    - No design-stance explanation exists (Step 2 failed).  
  - **Exit rule:**  
    - If **yes**, proceed to Step 5 for approval.  
    - If **no**, revert to highest-compression stance from Steps 1–2. **Never use intentional stance here.**  

  #### **Step 5: Values/Safety Handoff**  
  **Question:** *"Could intentional description imply liability, agency, or mental states to the committee?"*  
  - **Handoff rule:**  
    - **Always escalate to your supervisor** if intentional stance is proposed. They must approve/reject wording.  
    - **Rationale:** This is values-based (safety/legal risk), not technical. Supervisor owns sign-off.  

  #### **Handling Compression Challenges**  
  - **One-off episodes (no baseline):**  
    - Skip Step 3 (Pattern Reality). Only use physical/design stance. **Never use intentional stance**—it requires recurrence.  
  - **Can’t measure compression:**  
    - Default to physical stance. If unworkable, use design stance with spec-based inferences (e.g., "consistent with door-handling protocol").  

  #### **Tie-Break Rule**  
  - **If two stances compress equally well:**  
    - **Rank:** Design stance > Physical stance > Intentional stance.  
    - **Why:** Design stance is truthful (avoids anthropomorphism) and actionable (points to spec for fixes). Physical stance is neutral but verbose. Intentional stance is last-resort.  
    - **Example:** If design and intentional both compress well (e.g., 20 words), use design.  

  ---

  ### **Where the Procedure Misfires (Honest Limitations)**  
  1. **Intervention mismatch:**  
     - Intentional stance may compress well but mislead fixes (e.g., "robot hesitates" → suggests tweaking "confidence" vs. actual timeout bug).  
     - **Mitigation:** Supervisor must flag when intentional descriptions could hinder debugging.  
  2. **Timescale blindness:**  
     - Slow trends (e.g., "robot becomes reckless over months") are invisible. Use aggregate reports, not this per-episode tool.  
  3. **Emergent behaviors:**  
     - Patterns from unlogged environmental quirks (e.g., robot exploiting Wi-Fi blind spots) may be misclassified as design/intentional. Step 3 (recurrence) minimizes this.  
  4. **"Grey-box" systems:**  
     - If you later get partial internals (e.g., logs of cost maps), revise Step 2 to include internal state checks.  

  ---

  ### **Application to Your Episodes**  
  *Using the procedure above:*

  #### **Episode 1: Robot takes longer route avoiding glare.**  
  - **Step 1 (Physical):** *"Robot took route A (long) instead of B (short) at 2 PM; sunlight observed in corridor B."* Compresses poorly (no "why").  
  - **Step 2 (Design):** Spec shows no glare avoidance. **No match.**  
  - **Step 3 (Pattern Reality):** Pattern recurs daily at 2 PM (reproducible), absent at night (condition change). **Pattern is real.**  
  - **Step 4 (Intentional Eligibility):** "Avoids glare" compresses best (3 words). Eligible.  
  - **Step 5 (Handoff):** Escalate to supervisor. **Proposed write-up:** "Robot selects routes away from afternoon glare."  
  - **Your worry:** Committee infers "mental life."  
  - **Procedure’s call:** **Permitted if supervisor approves.** But rephrase to passive: *"Route selection correlates with glare conditions"* (design-stance framing).  

  #### **Episode 2: Robot "hesitates" at doorway.**  
  - **Step 1 (Physical):** *"Robot halted for 3s in doorway."* Short but incomplete.  
  - **Step 2 (Design):** Spec shows "3s planner timeout at doors." **Exact match.**  
  - **Exit rule:** **Use design stance. Stop.**  
  - **Write-up:** "Robot executed planned 3s doorway assessment pause."  
  - **Your worry:** Intentional is "faster to write."  
  - **Procedure’s call:** **Hard no on intentional.** Design compresses well and is truthful.  

  #### **Episode 3: Robot "waits for nurse" near station.**  
  - **Step 1 (Physical):** *"Robot stationary near nurses' station until nurse swiped door, then followed."* Verbose but clear.  
  - **Step 2 (Design):** Check spec for:  
    - Door protocols: Does it say "wait for human if door locked"?  
    - Following behavior: Is "trail human" documented?  
    - **If spec confirms → use design stance.** Example: "Robot invoked door-assist protocol, then resumed path."  
    - **If spec silent → Step 3 (Pattern Reality):** Recurrence at shift changes? If yes, proceed.  
  - **Step 4 (Intentional Eligibility):** "Waits for nurse" compresses well, but **only if design fails and pattern recurs.**  
  - **Your suspicion:** "I love 'waits for nurse'."  
  - **Procedure’s call:** **You likely lose it.**  
    - If spec explains it → design stance wins.  
    - If spec doesn’t but pattern recurs → intentional eligible (supervisor must approve).  
    - Physical stance is always fallback.  
  - **What to check:** Planner spec for door/nurse interaction rules. If absent, verify recurrence in ≥3 logs.  

  ---

  ### **Final Notes**  
  - **Why this works:** It forces you to *prove* compression and filter artifacts before anthropomorphism.  
  - **Efficiency:** Steps 1–2 often resolve episodes in 5–10 min; Steps 3–5 for edge cases.  
  - **Supervisor’s role:** They arbitrate values/safety (Step 5) and spec ambiguities (Step 2).  
  - **When to break:** For longitudinal patterns (e.g., "glare avoidance increases weekly"), use separate analysis.  

  This procedure makes your reports auditable, repeatable, and liability-safe. Run it on 2–3 episodes with your supervisor to calibrate.
