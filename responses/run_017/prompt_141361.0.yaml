  - Cost of abstraction: Aligns with idealization problems. Valid.
  - Verdict portability: Framing effects. Needs refinement but useful.

  Top question solved: For verdict portability, a solved version would be a taxonomy of sensitivity factors and a checklist for philosophers. Success would be a peer-reviewed paper with guidelines and case applications.

  The user should avoid overemphasizing the intuition debate. Their project stands independently by addressing design-specific failures. Focusing on practical outputs ensures usability for philosophers, meeting their end goal.
answer: |-
  Based on your constraints, goals, and the crux of your disagreement, here’s a prioritized research agenda targeting *design-level failures* in thought experiments—independent of the intuition-as-evidence debate. I’ll address your core question first, then outline the research plan.

  ### The Crux: Is Design Downstream of Intuition-Evidence?
  **No.** Your project has independent structure and urgency. Even if intuitions *are* reliable evidence, flawed case design can corrupt their delivery (e.g., priming irrelevant features, misrepresenting the target principle). Conversely, if intuitions are unreliable, design-level analysis explains *why specific cases fail* beyond "intuitions are shaky." Your observed failures (narrative perspective, order effects, abstraction costs) persist regardless of the intuition debate’s outcome. Focusing on design is **not premature**—it addresses a gap in how philosophers *apply* thought experiments, which remains relevant whether intuitions are vindicated or not. Abandoning design for the intuition debate would ignore the concrete failure modes you’ve identified.

  ---

  ### Research Agenda: Prioritized Questions
  With one year and a graduate assistant, prioritize **tractable, understudied questions** that yield practical outputs (norms/tests) for philosophers. Avoid overfashionable but low-impact topics (e.g., "intuition skepticism" meta-debates). Below: each question’s rationale, tractability, output, and trade-offs.

  1. **Question 1: How do presentation parameters (order, framing, perspective) affect verdict portability, and how can we detect/manage this?**  
     - **Why upstream?** Verdict portability (your label) is foundational. If judgments shift with presentation alone (e.g., third vs. first person), no thought experiment can reliably test principles—regardless of intuition’s evidential status. It’s upstream of *all* case construction.  
     - **Tractability (High):** No experiments needed. Use:  
       - Literature synthesis (philosophy of language, cognitive bias studies, narrative theory).  
       - Case studies: Reanalyze classic thought experiments (e.g., Thomson’s Violinist, Gettier cases) with variations in framing/perspective. Your GA can catalog historical examples.  
     - **Neglected?** Yes. While "framing effects" are studied in psychology, their systematic impact on *philosophical* cases is underexplored. Most taxonomy efforts focus on logical structure, not rhetorical presentation.  
     - **Output:** A **diagnostic toolkit** for philosophers:  
       - A taxonomy of sensitivity factors (e.g., agency framing, temporal framing, perspectival anchoring).  
       - Heuristics to audit portability (e.g., "Does reversing the order of cases alter verdicts? Does abstracting narrative details change responses?").  
     - **Solved looks like:** A peer-ready paper with:  
       - Taxonomy of 4-5 sensitivity factors with clear examples.  
       - A 5-point "portability stress test" for case-builders (e.g., "Vary POV; if verdict shifts, isolate why").  
       - Appendix of case studies showing failures/successes.  
     - **Trade-off:** Skips broad intuition-reliability debates. Gains concrete tools for builders.  
     - **Your label:** "Verdict portability" survives but refine it as **presentation sensitivity**. Distinguish from framing effects in psychology by focusing on *philosophically relevant* parameters (e.g., moral agency cues).

  2. **Question 2: When does abstraction strip justification-relevant features (cost of abstraction), and how can we model this?**  
     - **Why upstream?** Abstraction is unavoidable, but bad simplification invalidates the case *even if intuitions are evidence*. E.g., Nozick’s experience machine may omit real-world constraints that make hedonism plausible. This directly causes misleading results.  
     - **Tractability (Medium):** Conceptual work + case studies. Use:  
       - Analyze abstraction norms in scientific models (e.g., idealization debates in philosophy of science).  
       - Test against counterexamples: Pick principles (e.g., utilitarianism) and compare "stripped" vs. "rich" cases. Your GA can compile abstraction failures in ethics/metaphysics.  
     - **Neglected?** Unfashionable. Most work treats abstraction as a virtue ("intuition purity"); few address when it *misrepresents* the target domain.  
     - **Output:** **Norms for responsible abstraction**:  
       - Guidelines for identifying "justification-critical" features (e.g., social context in fairness cases).  
       - A danger checklist (e.g., "Does this abstraction remove features that ground the principle in real-world analogs?").  
     - **Solved looks like:** A paper with:  
       - Typology of abstraction risks (e.g., exclusion of stabilizers, removal of friction).  
       - 3-4 norms (e.g., "Preserve features that trigger the principle’s application in target domains").  
       - Case illustrations (e.g., how Rawls’ veil of ignorance avoids pitfalls by retaining key social factors).  
     - **Trade-off:** Less flashy than intuition wars, but prevents design failures that persist post-debate.  
     - **Your label:** "Cost of abstraction" is sound and distinct. Connects to "idealization" literature but emphasizes *epistemic harm*.

  3. **Question 3: How does support laundering operate, and how can we mitigate it?**  
     - **Why upstream?** If a case covertly borrows support from prior beliefs (e.g., Jarvis Thomson’s violinist relying on bodily autonomy intuitions), it inflates perceived evidence for the *target* principle. This corrupts persuasion independently of intuition’s status.  
     - **Tractability (Medium-High):** Conceptual analysis + historical tracing. Use:  
       - Reverse-engineer influential cases: Identify what prior principles they activate (e.g., trolley problems tap loss aversion).  
       - Develop "laundering markers" (e.g., rhetorical cues, emotional triggers). Your GA can analyze texts for these patterns.  
     - **Neglected?** Genuinely so. Begging-the-question is discussed, but not the *implicit transfer* of support from one principle to another.  
     - **Output:** **Audit protocol for laundering**:  
       - A flow-chart to detect laundering (e.g., "Does the vignette’s persuasiveness drop if the reader rejects Principle X?").  
       - Mitigation tactics (e.g., "Disclose borrowed supports explicitly; test cases on principle-skeptics").  
     - **Solved looks like:** A paper with:  
       - Definition/diagnostic criteria for laundering (vs. honest inference).  
       - 2-3 laundering types (e.g., affective, conceptual).  
       - Protocol with examples (e.g., how Singer’s pond case avoids laundering by targeting bare intuitions).  
     - **Trade-off:** Overlaps with cognitive bias work but focuses on philosophical practice.  
     - **Your label:** "Support laundering" is novel and useful. Not collapsible—it targets *illicit support transfer*, unlike general intuition errors.

  ---

  ### What to Abandon or Deprioritize
  - **Overrated: "Intuition-as-evidence" as the master key.** Even if solved, it doesn’t address *why* specific cases mislead (e.g., your framing effects). Spending your year here would yield minimal practical guidance for case-builders.  
  - **Overrated: Grand taxonomies of thought experiments.** Most are descriptive, not prescriptive. A functional typology (e.g., counterexamples vs. conceivability) matters only if tied to your design norms.  
  - **Collapses:** Your "verdict portability" partially overlaps with "framing effects," but the latter is too broad. Refine it as **presentation sensitivity** to stress philosophical relevance.  
  - **Abandon:** Empirical surveys on intuition variance. Without resources, this is untenable. Focus on conceptual tools builders can use *now*.

  ---

  ### Execution Plan
  **Order:** Start with **presentation sensitivity** (Q1 → fastest, establishes core failure mode), then **support laundering** (Q3 → builds on Q1’s framing insights), then **cost of abstraction** (Q2 → hardest, requires modeling).  
  **Why this order?** Q1 provides scaffolding for Q3 (laundering often exploits framing). Q2 is saved for last as it demands deeper engagement with philosophy of science.  
  **End-of-year success:** 3 publishable papers, each with a practical component (taxonomy/test/norm). Use your GA for literature review and case curation. **Test usability:** Circulate drafts to philosophers who use thought experiments; refine based on feedback.  
  **Risk:** Q2 may spill into idealization theory. Mitigate by tightly scoping to "features that do justificatory work."  

  **Bottom line:** Your design-focused agenda is not just viable—it’s high-impact. It addresses failures that persist even if we win the intuition debate, and delivers what you want: tools for better thought experiments. Your three labels? All survive, but sharpen them as above. Start writing.
