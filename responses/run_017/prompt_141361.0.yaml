  First, I need to understand the core disagreement. The friend's view is that the epistemology of thought experiments depends entirely on the debate over intuitions as evidence. If intuitions aren't reliable evidence, then thought experiments fail. The user, however, argues that even if intuitions are reliable, design flaws can mislead. The examples they gave—like narrative perspective or presentation order—suggest that how a thought experiment is constructed affects its persuasiveness independently of intuition reliability.

  The user's three concepts need validation. Support laundering seems like when a thought experiment leverages existing beliefs to support a new principle, making the support feel stronger than it is. Cost of abstraction refers to oversimplifying, removing real-world elements that justify the principle. Verdict portability is about whether judgments remain consistent across variations in presentation. I should check if these align with existing philosophical concepts. Support laundering might relate to circularity or question-begging. Cost of abstraction echoes issues in idealization debates. Verdict portability connects to framing effects or cognitive biases.

  The user's constraints are important: no empirical resources, one graduate assistant, output should be practical norms for constructing thought experiments. They want to avoid theoretical debates on intuition evidence and focus on actionable design guidelines. The key is prioritizing questions that are tractable within a year, under-resourced, and lead to usable outputs.

  Assessing the crux: Is the design project downstream of the evidential-status debate? The user needs to show that design issues matter regardless. If design flaws cause failures even when intuitions are reliable, then the project has independent merit. For example, if changing from first to third person alters judgments, that's a design problem, not an intuition reliability issue.

  Prioritizing research questions:
  1. **Verdict Portability**: Investigate how presentation variations affect judgments. This is upstream because inconsistent judgments under different presentations undermine any thought experiment, regardless of intuition reliability. Tractability: Can be done through literature review and conceptual analysis. Existing work on framing effects in psychology and philosophy could be synthesized. Output: A taxonomy of presentation sensitivities and guidelines to avoid them.
  2. **Support Laundering**: Examine how thought experiments borrow support from existing beliefs. Upstream because if persuasion relies on pre-existing principles, it doesn't test the target principle. Tractability: Case studies of famous thought experiments (e.g., Gettier cases) to identify laundering. Output: Diagnostic tools to detect and avoid support laundering.
  3. **Cost of Abstraction**: Analyze when simplification removes justification-relevant features. Upstream as misrepresentation can invalidate the experiment. Tractability: Conceptual analysis and case studies. Output: Guidelines on when abstraction is harmful.

  Why not cost of abstraction first? It's more complex and might require empirical input, which the user lacks. Verdict portability is more straightforward with available resources.

  Overrated areas: The intuition-evidence debate might not resolve design issues. Even if intuitions are reliable, poor design can still mislead. Also, broad defenses of thought experiments as a whole are less useful than specific design norms.

  Validating the user's labels:
