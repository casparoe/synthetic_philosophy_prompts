answer: |-
  Here’s a toast that threads Ellen’s specific Marxism into warmth, humor, and legacy—without lectures, eye-rolls, or pretending the tensions don’t exist. It runs about 5.5 minutes spoken slowly.

  ---

  **(Clink glass lightly)**  
  "Alright, everyone—deep breaths. I’ve been warned that if this turns into a lecture, Ellen might chuck a copy of *Capital* at my head. And given her aim with a wrench back in the tool-and-die days… I’ll keep it quick.  

  We’re here for Ellen. Thirty-eight years. First shaping metal, then shaping contracts. And if you know Ellen, you know she never did either blindly. **She brought the books to the meetings.** Literally. While the rest of us skimmed bullet points, she’d flip to chapter fifteen and say, '*This* is why that machine isn’t the enemy.'  

  See, Ellen had zero patience for two kinds of fairy tales:  
  First, the one where everything was better when we did it by hand. *‘Brutal, just slower,’* she’d say. Nostalgia was a trap.  
  Second? The shiny fantasy where robots do everything and we all kick back in luxury. **‘Every machine,’** she’d insist, **‘has a person standing next to it with a grease gun.’** The work never vanishes—it just slips into the shadows. Into maintenance, setups, the graveyard shift. Labor you don’t see, and bosses love to underpay. She called that person **‘the maintenance hand.’** And she fought like hell to make sure *that* hand got seen.  

  *That’s* what made her brilliant. **She never fought the machine. She fought the contract.** Her rule was simple: If a new press saves two hours a shift, where do those two hours go? Into your pocket, or the company’s bottom line? **‘The two-hour question,’** she called it. And let’s be honest—watching her corner managers with it was a thing of beauty. *(Pause for smiles)*.  

  She’d laugh hardest quoting Marx’s takedown of the ‘compensation theory’—you know, the idea that automation magically rehires everyone it displaces. *‘Smoothly reabsorbed?!’* she’d scoff. *‘Try telling that to the guy eating ramen while his job sails off to a tax haven!’* **It never happened without a fight. Without a deal. Without her.**  

  *(Shift tone, soften)*  
  Now, I know some of her old crew are here. And look—Ellen knows you don’t all agree on every concession she made in the ’90s. She wouldn’t want this toast to paper over that. What she *would* want? To remind us that **machinery gives us a choice.** It can stretch the working day—or shorten it. It can hide labor—or reveal it. **The difference was never the technology. It was always the deal.** And Ellen spent fifteen years making damned sure the deal remembered the human hands—especially the ones holding the grease gun.  

  So what’s she handing on? *(Look at grandkids)*  
  Not just grandkids who code—though she loves that you build the ‘machines’ now.  
  Not just contracts—though she’s proud of every clause that put hours back in workers’ pockets.  
  **She’s handing on the two-hour question.**  

  Because whether it’s a drill press, an algorithm, or whatever comes next—someone will always say it’ll save time. Someone will promise abundance. And Ellen’s legacy is this: **Don’t just ask *what* it automates. Ask *who* it serves. Ask where the saved hours go. Ask who’s holding the grease gun.**  

  So, Ellen—  
  For thirty-eight years of sharp questions and sharper wit…  
  For seeing the labor others ignore…  
  And for teaching us that progress isn’t measured in metal or code, but in who gets to breathe easier at the end of the shift…  

  **We raise a glass. To the maintenance hand—and the woman who made sure it got paid.**  
  Cheers!"  

  ---

  ### Why this works
  1. **Marx, not Marxism**: Uses his ideas ("two-hour question," "maintenance hand," value theory) without jargon or name-drops (only 1 explicit mention).  
  2. **Honors tensions**: Acknowledges the union disagreements *without* litigating them ("Ellen knows you don’t all agree..."), frames her legacy as the *question* itself—not victory.  
  3. **Grandkids included**: The ending ("whether it’s a drill press or an algorithm") gently extends her principles to their world without accusation.  
  4. **Scholars satisfied**: Critiques "tech neutral" clichés implicitly by stressing *the deal* and hidden labor.  
  5. **Human moments**: The wrench-throwing gag, her laugh at "compensation theory," pride in her hands (implied in "she fought the contract").  
  6. **Legacy that lands**: "She’s handing on the two-hour question" ties her dual insights (machinery’s promise + persistent labor) into a living tool.  
  7. **Warmth over dogma**: Ends on "who gets to breathe easier"—a human take on her "shortened working day" principle.  

  **Key avoids**: "Dignity of labor," "machines took jobs," "enjoy retirement" as focus. The humor comes from her voice (the ramen line, Marx’s sass). The scholars will catch the "Fragment on Machines" nod in "maintenance hand," but it’s accessible.  

  Adjust any names/phrasing—but this should make Ellen nod without wincing, the grandkids lean in, and the old crew feel seen.
