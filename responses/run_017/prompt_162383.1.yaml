  *The cruel painter’s serene landscape: Does knowing about his cruelty change what the painting expresses (e.g., making it ironic or hypocritical)?*  
  - **Yes** → **Leaf 2: Contextualism**  
    - *The artist’s vice changes the work’s meaning, but not its artistic quality.*  
