  **Branch 4: The Abusive Director**  
  *A film director is accused of abuse. His beloved film involved 200 artists, many victims. Does the director’s vice diminish the film’s artistic value?*  
  - **No** → **Leaf 3: Aestheticism**  
    - *Artistic value is wholly insulated from moral defects in artist or work.*  
    - *Awkward: Art remains “great” even if made by monsters.*  
  - **Yes** → **Leaf 4: Collective Taint View**  
    - *A key creator’s vice taints the entire collaborative work.*  
    - *Awkward: Innocent collaborators’ contributions are erased.*  

  **Branch 5: The Horrifying Film**  
  *A film depicts graphic violence but clearly intends audiences to condemn it. Does this intention make the film artistically better?*  
  - **Yes** → Go to 6.  
  - **No** → Go to 7.  

  **Branch 6: The Historical Novel**  
  *A 1800s novel contains racial stereotypes, offensive today but unremarkable then. Does this diminish its artistic value?*  
  - **Yes** → **Leaf 5: Universal Moralism**  
    - *Moral defects are always artistic defects, regardless of context.*  
    - *Awkward: Most historical art is condemned by modern standards.*  
  - **No** → **Leaf 6: Contextual Moralism**  
    - *Moral defects are artistic defects only if flawed by their era’s standards.*  
    - *Awkward: Permits art that endorsed widely accepted injustices.*  

  **Branch 7: The Enjoyable Depiction**  
  *A novel depicts torture in a way that invites readers to enjoy it. Does this make the novel artistically worse?*  
  - **Yes** → **Leaf 7: Structural Defect View**  
    - *The work is defective if it invites an unmerited response (e.g., enjoyment of horror).*  
    - *Awkward: Judges art by how it manipulates audiences, not content.*  
  - **No** → Go to 8.  

  **Branch 8: The Immoral Enhancement**  
  *A film is artistically more powerful because it glamorizes crime. Is the immorality an artistic merit?*  
  - **Yes** → **Leaf 8: Immoralism**  
    - *Immorality can enhance artistic value if it makes the work more compelling.*  
    - *Awkward: Some art is “better” because it is morally worse.*  
  - **No** → **Leaf 9: Deflationary View**  
    - *Artistic value isn’t distinct; it’s just personal/cultural preference.*  
    - *Awkward: Reduces art to “whatever moves people,” with no deeper truth.*  

  ---

  ### Empty Cells: Unexplored Territory  
  The tree’s questions open logical space for 16+ positions, but 7 cells are empty. Key gaps:  
  1. **“Only external defects matter” cell**: Where the *artist’s* immorality is an artistic defect, but the *work’s* immorality isn’t. *Incoherent*: If external flaws (e.g., a cruel artist) can taint art, internal ones (e.g., cruel themes) logically should too. No one defends this.  
  2. **“Immoral merits only” cell**: Where moral defects *can* be artistic merits (like Immoralism) but *never* defects. *Merely unattractive*: It arbitrarily blocks moral flaws from ever diminishing art, making it ad hoc.  
  3. **Other gaps**: For example, no position holds that *distributed authorship* (Branch 4) affects meaning but not value. *Undefended*: Possible, but no one bothers—it’s overshadowed by Collective Taint or Aestheticism.  

  ### Failure: Positions the Tree Can’t Split  
  The tree **cannot separate**:  
  - **Aestheticism vs. Moderate Autonomism**: Both answer all branches identically (e.g., “No” to Branch 1, 2, 4). They agree artistic value is untouched by morality, but Moderate Autonomism adds *non-artistic reasons* to avoid supporting the artist.  
    - *Why?* The tree assesses *artistic value*, not conduct. A new case (e.g., *Buying the art funds the abuser—does this affect its beauty?*) might split them, but no such case exists—it confuses value with action.  

  ---

  ### What to Do: When Artistic Value ≠ Conduct  
  Your argument with your friend likely conflated artistic value with practical choices. Here’s how positions map to conduct:  

  | **Position**          | **Agree on Artistic Value?** | **Disagree on Conduct?** | **Example: Watching the Series** |  
  |------------------------|------------------------------|--------------------------|----------------------------------|  
  | Aestheticism           | Yes                          | No                       | Watch freely—value is intact. |  
  | Moderate Autonomism    | Yes                          | **Yes**                  | Value intact, but don’t watch—it supports abuser. |  
  | Causal Taint           | No                           | **Yes**                  | Diminished value, yet some might watch if royalties are blocked. |  
  | Universal Moralism     | No                           | No                       | Don’t watch—artistically and morally flawed. |  
  | Deflationary View      | N/A (rejects framework)      | **Yes**                  | “Value” is irrelevant; watch or not based on personal ethics. |  

  **Crucial splits**:  
  - **Value agreement, conduct disagreement**: Aestheticism vs. Moderate Autonomism agree art’s value is unchanged but clash on whether watching is wrong.  
  - **Value disagreement, no conduct difference**: If all positions agree the artist benefits from views (e.g., streaming royalties), Causal Taint and Universal Moralism both say “don’t watch”—despite disagreeing on *why* the art is flawed.  

  **The bottom line**: Artistic value debates rarely settle conduct. Even if art is “good,” supporting abusers may be wrong. Even if art is “bad,” watching might be harmless if the artist gains nothing. Separate the questions.  

