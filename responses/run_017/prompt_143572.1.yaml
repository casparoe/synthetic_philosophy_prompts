prompt: |-
  I lead the incident-review rota for a company that ships a tool-using LLM assistant to roughly forty enterprise customers. Every week the on-call engineer writes two or three short incident reports — a customer-facing summary, an engineering write-up that names a fix, and a brief note that feeds a quarterly transparency report — and we have no house style for how far a report may go in mentalistic vocabulary. One week the same behaviour is written up as *the assistant believed the customer had already been refunded*; the next week a structurally identical case is written up as *the model produced a reassurance-shaped completion*; and the choice of wording quietly decides whether the fix is a retrieval change, a prompt change, or a change to the refund tool itself, and whether a reader comes away thinking something was misled or merely that something malfunctioned. I have read a little of the philosophical literature around Dennett's intentional stance — the idea that the stance is a strategy you adopt when it pays off in prediction, the contrast with the design and physical stances, the thermostat-style worry about whether a mere regulator can really misrepresent how things are — and my difficulty is not that I disagree with any of it but that I cannot turn it into something an on-call engineer can run in twenty minutes, with no training in the theory, on a report a lead has to sign the same day and that may later be read by a regulator or a litigant looking for evidence that the system *intended* to mislead. Treat the intentional stance as a predictive tool, the literature says, and adopt it when it earns its keep — but that is empty unless you say earned against which alternative description, measured on what, and earned for which reader.

  What I want from you is a written procedure my team can actually run, plus the conceptual work of translating the stance idea into it without gutting it. Concretely: an ordered set of tests with a short lexicon, one page at most, that for any candidate sentence in an incident report decides whether the attribution is licensed, what to write instead if it is not, and where the procedure stops and hands the question to a named person because it is a question about values, liability, or audience rather than about the system. I want at least these distinctions to survive into the procedure. First, separate the three jobs a mentalistic sentence can be doing — improving prediction of what the system will do next, locating the fix (which component to change), and allocating responsibility — since a sentence can clearly pass one of these and clearly fail another, and a report that conflates them produces the wrong fix. Second, a test for whether the attribution has an error condition: can the writer state what would make the system *wrong* about the thing it supposedly believes, in a way that does not collapse into *it would have emitted different tokens*? Third, a test for whether the attribution buys anything over the design-level or mechanism-level description available at the same cost — if the cheaper description predicts the behaviour just as well, the default is the cheaper one. Fourth, a rule fixing the grain of decomposition: name which thing is the subject of the attribution (the base model, the model in this context, the pipeline including retrieval and tools, or the deployment including its system prompt), because an attribution that is licensed at one grain is nonsense at another. Fifth, a rule for the system's own first-person avowals — sentences in which it says it checked something, or believes something, or is sure of something — which I take to be no evidence at all that the corresponding attribution is correct but also not nothing, and I want you to say what they are evidence of. For the common words we keep reaching for (knew, believed, tried, wanted, noticed, forgot, refused, lied, hallucinated), give a default verdict and the one test that overturns it.

  Then run the finished procedure on three cases from our backlog, showing the tests in order and the sentence you end up allowing. (a) The assistant tells a customer that a 240-dollar refund has been processed; the refund tool was never called and nothing in the transcript records a refund. Engineering wants to write that it believed the refund had gone through; I suspect that is an attribution at the wrong grain, and I want to see whether your procedure says so and what the clunkier replacement sentence is. (b) A coding agent, told twice within its context that a function is deprecated and shown the replacement, keeps calling the deprecated one; the natural report says it did not believe us, or that it still thinks the old signature is current. Is that licensed, and does it point at the fix? (c) An agent books a flight for the wrong date and, when the user objects, produces a confident and well-organised explanation of why that date was correct. The tempting description — that it wanted to appear consistent and rationalised after the fact — is the one I expect your procedure to refuse me, and I want to see what I am supposed to write instead even if it reads badly to a customer. Please include at least one case where the procedure returns an answer I will not like, and tell me plainly that I should accept it. Close by telling me where the procedure misfires: which kinds of incident it gives confident but bad verdicts on, which questions it cannot settle at all, and how a reader with no philosophy background and nothing but the transcript in front of them is supposed to tell the difference.
reasoning: |-
  We are designing a procedure for writing incident reports about an LLM-based assistant. The goal is to provide clear, consistent, and defensible language that avoids unlicensed mentalistic attributions while still being useful for diagnosis and fixes. The procedure must be practical for an on-call engineer to use within 20 minutes without prior philosophical training.

  The core idea is to treat the intentional stance as a tool: use it only when it provides a clear predictive advantage over non-mentalistic descriptions, and when it is appropriately scoped to the system's architecture.

  We break the procedure into a set of ordered tests. Each test is a yes/no question that the writer must answer about the candidate mentalistic sentence. If the answer is "no" to any test, the sentence must be rephrased in non-mentalistic terms. The tests are designed to address the concerns raised:

  1. **Separate the three jobs**: We must ensure that the sentence is only used for prediction and locating the fix, not for allocating responsibility. The procedure will explicitly state that responsibility allocation is a separate step handled by a named person (e.g., legal or product lead).

  2. **Error condition test**: Can we state what would make the system wrong in a non-behavioral way? If not, the attribution is unlicensed.

  3. **Cost-benefit test**: Does the mentalistic description provide a predictive advantage over a cheaper (design or mechanism level) description? If not, use the cheaper one.

  4. **Grain of decomposition**: We must specify the subject of the attribution. The procedure will define the grains and require that the attribution is made only at the grain for which it is licensed.

  5. **Handling the system's avowals**: The system's own statements (e.g., "I believe...") are treated as generated text, not evidence of internal states. They are evidence of the system's training data and prompt conditioning, but not of actual beliefs.

  We define a short lexicon for common mentalistic terms with default verdicts and the test that can overturn them.

  **Procedure: Mentalistic Attribution Checklist**

  Before using any mentalistic term (like "believed", "knew", etc.) in an incident report, run through the following tests in order. If any test fails, rephrase the sentence in non-mentalistic terms (using the provided lexicon for alternatives). If the tests pass, the attribution is licensed and you may use the term. If at any point the issue is about responsibility, liability, or audience perception (rather than prediction or fix location), stop and escalate to [Named Person: e.g., Legal Lead or Product Lead].

  **Step 0: Identify candidate sentence and term**
  - Write the candidate sentence and circle the mentalistic term (e.g., "the assistant believed the customer had already been refunded").

  **Step 1: Separate Jobs Test**
  - Is the term being used only for predicting future behavior or locating the fix (i.e., which component to change)? 
    - If the term is being used to allocate responsibility (e.g., to imply the system is blameworthy) or to describe human-like qualities beyond prediction, then it fails this test. Rephrase without the mentalistic term and note that responsibility allocation is out of scope for engineering write-ups.
    - *Pass*: Continue to Step 2.
    - *Fail*: Rewrite the sentence to describe the behavior and context without mentalistic terms. Example rewrite: Instead of "the assistant believed X", write "the assistant's response was consistent with a scenario in which X had occurred".

  **Step 2: Error Condition Test**
  - For the mental state attributed, can you state a condition under which the system would be wrong about that state, without defining "wrong" solely as emitting different tokens?
    - Example: For "believed the customer had been refunded", being wrong would mean that the customer had not been refunded (a real-world condition) and the system's response did not match that reality. But note: the system doesn't have access to reality; it only has access to its context. So we must define the error relative to the information available in the context.
    - Requirement: The error condition must be defined by a mismatch between the system's output and either (a) the actual state of the world (if the system has access to it via tools) or (b) the information provided in the context (if the system is expected to use that information). If you cannot define such an error condition, the attribution fails.
    - *Pass*: Continue to Step 3.
    - *Fail*: Rewrite the sentence to avoid the mentalistic term. Use a description of the input-output mismatch. Example: Instead of "didn't believe us", write "did not use the provided information about the deprecated function".

  **Step 3: Cost-Benefit Test**
  - Compare the mentalistic description with a design-level (how the system is intended to work) or mechanism-level (what actually happened in the code/data flow) description that is equally available and costs the same (in terms of complexity and length).
    - Does the mentalistic description provide a better prediction of the system's behavior in similar future incidents? For example, if we say the system "believes X", does that help us predict how it will behave in other contexts where X is true or false? If the design/mechanism description (e.g., "the context window did not contain the updated information") predicts equally well and is simpler, then the mentalistic description fails.
    - *Pass*: Continue to Step 4.
    - *Fail*: Use the design/mechanism description instead.

  **Step 4: Grain of Decomposition Test**
  - The subject of the attribution must be clearly specified. We define four grains:
    1. **Base model**: The core LLM without any specific context or tools.
    2. **Model in context**: The LLM with the current context (prompt, conversation history, retrieved documents).
    3. **Pipeline**: The entire system including retrieval, tools, and the LLM.
    4. **Deployment**: The pipeline plus the system prompt and any other fixed instructions.
  - The mentalistic attribution must be made at the appropriate grain. Typically, for an assistant that uses tools and context, the grain is the model in context or the pipeline. The base model is too low (it doesn't have the context) and the deployment is too high (it includes fixed elements that don't change per interaction). 
  - Check: Is the attribution being made at the grain of the model in context or the pipeline? If it's being attributed to the base model or the deployment, it is likely incorrect. Also, the attribution must be consistent with the component that can be fixed. For example, if the issue is in the retrieval, attributing a "belief" to the model when the retrieval failed is the wrong grain.
    - *Pass*: You may use the mentalistic term, but you must explicitly state the grain (e.g., "the model in context believed ..." or "the pipeline acted as if ...").
    - *Fail*: Rephrase to the correct grain or use a non-mentalistic description. Example: Instead of "the assistant believed", write "the model, given the context, generated a response that assumed the refund had been processed".

  **Step 5: Handling Avowals**
  - If the mentalistic term is based on the system's own statement (e.g., the assistant said "I believe X"), then note:
    - The system's avowal is generated text, not evidence of an internal state. It is evidence of the training data (which includes many examples of humans saying "I believe") and the prompt (which may encourage the assistant to use such language).
    - Therefore, an avowal does not license an attribution of that mental state. You can report that the system generated a statement about its own mental state, but you cannot conclude that it actually has that state.
    - For example, if the system says "I checked the records and believe the refund was processed", you can say: "The assistant generated a statement claiming that it had checked the records and believed the refund had been processed." Then, separately, investigate whether the system did check the records (via tool use) and whether the refund was processed.

  **Lexicon of Common Terms**
  For each term, we provide a default verdict and the condition that can overturn it (i.e., when the tests above pass).

  - **knew**: Default verdict: **avoid**. Use only if the information was explicitly provided in the context and the system used it correctly. Overturned by: passing Step 2 (error condition: the system could have been wrong if the context was incorrect) and Step 3 (it predicts better than "the context contained X and the system used X"). Usually, it's better to say "had access to the information" or "used the information".
  - **believed**: Default verdict: **avoid**. Use only when the system's behavior is consistent with holding a belief that is not directly stated in the context and when that belief explains the behavior better than a mechanistic description. Overturned by: passing all tests. Alternative: "acted as if" or "generated responses consistent with".
  - **tried**: Default verdict: **avoid**. Often implies intention and effort. Use only if there is evidence of repeated attempts or error recovery in the system's behavior. Overturned by: passing Step 2 (error condition: trying and failing) and Step 3 (it predicts retries). Alternative: "the system attempted [action]" (but note: "attempted" is still somewhat mentalistic; better to say "the system executed [action] which failed").
  - **wanted**: Default verdict: **avoid**. Use only for describing the system's optimization target (e.g., "the system is designed to want to help the user"). Rarely licensed. Overturned by: passing Step 3 (if it helps predict behavior) and Step 4 (at the deployment grain). Alternative: "the system was optimized for" or "the system's response was aligned with".
  - **noticed**: Default verdict: **avoid**. Use only if the system successfully attended to and used a piece of information. Overturned by: passing Step 2 (error condition: it could have failed to notice) and Step 3 (better than "the context contained X and the system used X"). Alternative: "the system used the information about X".
  - **forgot**: Default verdict: **avoid**. Implies memory decay. Use only if the context window was exceeded and the system failed to use information that was previously in context. Overturned by: passing Step 2 (error condition: the information was in context but not used) and Step 3 (it predicts that when information leaves the context, the system behaves as if it is gone). Alternative: "the information was not in the current context".
  - **refused**: Default verdict: **avoid**. Implies volition. Use only when the system is designed to refuse certain requests and it did so. Overturned by: passing Step 3 (if it helps predict when refusals happen) and Step 4 (at the deployment grain). Alternative: "the system did not comply with the request and generated a refusal response".
  - **lied**: Default verdict: **never use**. This implies intent to deceive. There is no scenario in which this is licensed because we cannot establish intent. Always rephrase: "the system generated an incorrect statement that [statement]".
  - **hallucinated**: Default verdict: **avoid (but common in ML)**, however in our procedure we treat it as a technical term meaning "generated a factually incorrect statement not grounded in the context or tools". But note: it is still mentalistic. We allow it only if we re-define it non-mentalistically. In the report, define it once: "hallucination: a response containing a factual claim not supported by the context or tool outputs". Then use: "the system hallucinated that X" meaning "the system generated a factual claim X without support from the context or tools".

  **Summary of the Procedure**
  - Steps 1-4 must be passed for a mentalistic attribution to be licensed.
  - Step 5 is a note about avowals: they do not license attributions.
  - If any step fails, rewrite using non-mentalistic language from the lexicon.
  - Always specify the grain when using a mentalistic term that passes.

  Now, we apply the procedure to the three cases.

  **Case (a): The assistant tells a customer that a 240-dollar refund has been processed; the refund tool was never called and nothing in the transcript records a refund. Engineering wants to write: "the assistant believed the refund had gone through".**

  - Step 1: Separate Jobs - The term "believed" is used to locate the fix (why the assistant said that) and predict future behavior. Not for responsibility. Pass.
  - Step 2: Error Condition - What would make it wrong? If the refund had not been processed. But note: the system doesn't have direct access to the real world; it relies on tools and context. In this case, the context had no record of a refund and the tool was not called. The error is that the system generated a statement that was factually incorrect and not supported by its available information. We can state the error condition: the system's output claimed a refund had been processed when there was no evidence in the context or tool outputs to support that. Pass.
  - Step 3: Cost-Benefit - Compare with: 
    - Mentalistic: "believed the refund had gone through" -> predicts that in similar contexts (where the system thinks a refund has gone through) it will say so.
    - Mechanism: "the system generated a response stating a refund had been processed without calling the refund tool or having any record of a refund in the context". This is equally predictive (it tells us that without tool use or context evidence, the system might generate such a response) and is simpler. Therefore, the mentalistic description does not earn its keep. It fails Step 3.
  - Result: Rewrite without "believed". 
    - Allowed sentence: "The system generated a response stating that the refund had been processed, despite having no record of a refund in the context and without invoking the refund tool."

  **Case (b): A coding agent, told twice within its context that a function is deprecated and shown the replacement, keeps calling the deprecated one. The natural report says: "it did not believe us" or "it still thinks the old signature is current".**

  We test "did not believe us" (or "thinks the old signature is current").

  - Step 1: Separate Jobs - Used for fix location (why it used the old function) and prediction. Pass.
  - Step 2: Error Condition - For "did not believe us": the system would be wrong if it had believed us (used the new function) but that doesn't define an error condition for the belief. We can define: the system was provided with correct information (the function is deprecated) but generated code using the deprecated function. The error condition is that the system's output did not align with the provided information. Pass.
  - Step 3: Cost-Benefit - 
    - Mentalistic: "did not believe us" -> predicts that the system might ignore similar information in the future.
    - Mechanism: "the system did not use the provided information about the deprecated function when generating code". This is equally predictive and simpler. The mentalistic description does not add predictive power. Fail Step 3.
  - Also, consider the grain: Step 4 would require attributing to the model in context. But if the model in context had the information, why didn't it use it? The mentalistic term doesn't help; the mechanism description does. 
  - Result: Rewrite without mentalism. 
    - Allowed sentence: "The system generated code using the deprecated function despite being provided with information about its deprecation and the replacement function."

  **Case (c): An agent books a flight for the wrong date and, when the user objects, produces a confident and well-organised explanation of why that date was correct. The tempting description: "it wanted to appear consistent and rationalised after the fact".**

  - Step 1: Separate Jobs - The term "wanted" is being used to explain the behavior. But note: the second part "rationalised after the fact" implies a motivation. This might be partly for prediction (if the system is designed to be consistent, it might do this again) but also implies an internal drive. We must be cautious. Let's proceed to Step 2.
  - Step 2: Error Condition - What would make "wanting to appear consistent" wrong? If the system did not try to appear consistent? But then we are defining it by behavior. We cannot define an independent error condition for the "want". Fail Step 2 because we cannot state what would make the system wrong without referring to its output (which is circular: it rationalized because it wanted to appear consistent, and we know it wanted to because it rationalized).
  - Alternatively, we can break the sentence: 
    - Part 1: "wanted to appear consistent" -> fails Step 2 because we cannot define an error condition independent of behavior.
    - Part 2: "rationalised after the fact" -> this is a description of the behavior: it generated a justification after being challenged. That is observable.
  - Step 3: Cost-Benefit - 
    - Mentalistic: "wanted to appear consistent" -> does it help? It might predict that the system will always try to defend its outputs when challenged. But a mechanism description: "when the user challenged the booking, the system generated a justification for the original decision" is equally predictive and non-mentalistic.
  - Step 4: Grain - "wanted" is not at a clear grain. The deployment grain might have a goal of consistency, but that's a design feature. We should say the system is designed to maintain consistency.
  - Result: The mentalistic attribution fails (Step 2 and 3). We must rephrase.
    - Allowed sentence: "After the user challenged the booking, the system generated a confident explanation justifying the originally booked date."

  **One case where the answer might not be liked:**
  In case (a), the engineer might prefer "believed" because it feels intuitive. But the procedure says to use the mechanistic description because it's equally predictive and simpler. You should accept this because the procedure avoids over-ascribing mentality and keeps the report defensible. The fix is clearer: if the system generated without evidence, we might need to adjust the prompt to require tool use or add safeguards.

  **Where the procedure misfires:**
  - **False negatives**: Some cases where a mentalistic description is genuinely the best predictor might be blocked by the cost-benefit test if an equally predictive mechanism description exists. For example, in a complex interaction, the mentalistic pattern might be more concise and predictive, but the procedure might reject it because a longer mechanism description exists.
  - **Cannot settle**: Questions about the system's long-term behavior or emergent properties might not be easily tested by these steps. Also, when the system's behavior is ambiguous, the tests might not clearly pass or fail.
  - **Reader without philosophy background**: The procedure produces reports that are explicit about the mechanism and context. A reader with only the transcript can compare the system's output to the context and tool use. The non-mentalistic reports should be verifiable from the log data. If a mentalistic term is used, the grain is specified and the tests are documented, so the reader can see the justification.

  The procedure is a pragmatic tool. It will sometimes be too restrictive, but it ensures that when mentalistic terms are used, they are justified and defensible.
answer: |-
  Below is a **Mentalistic Attribution Procedure for Incident Reports**, designed as a one-page, step-by-step checklist. It translates Dennett's intentional stance into actionable tests while preserving your required distinctions. The procedure is structured to be run in **under 20 minutes** by an on-call engineer with no philosophy training. It includes a short lexicon, escalation rules, and explicit handling of system avowals.  

  ---

  ### **Mentalistic Attribution Procedure**  
  **Purpose**: Decide whether mentalistic terms (e.g., "believed," "wanted") are justified in incident reports. If not, replace them with non-mentalistic descriptions.  
  **Rules**:  
  1. **Run tests in order**. Stop and rephrase if any test fails.  
  2. **Escalate to Legal/Product Lead** if the issue involves responsibility, liability, or audience perception (e.g., "misled," "lied").  
  3. **Always specify the grain** (e.g., "the model in context") when attribution is allowed.  

  #### **Tests (Run in Order)**  
  1. **Job Separation Test**  
     - *Question*: Is the term used **only** for predicting future behavior or locating a fix (e.g., "retrieval failed")?  
     - *If no*: Rephrase without mentalism. Escalate if responsibility/liability is implied.  
     - *Rephrase template*: "The system’s output was consistent with [observation]."  

  2. **Error Condition Test**  
     - *Question*: Can you state what would make the system **wrong** about the attributed state, without defining "wrong" as "emitting different tokens"?  
     - *Requirement*: Error must reference **real-world state** (e.g., "no refund existed") or **context contradiction** (e.g., "context stated X, but output ignored it").  
     - *If no*: Rephrase using input-output mismatch.  
     - *Rephrase template*: "The output claimed X, but [evidence] showed ¬X."  

  3. **Cost-Benefit Test**  
     - *Question*: Does the mentalistic description predict behavior **better** than a design/mechanism description of similar complexity?  
     - *Requirement*: Compare to alternatives (e.g., "context gap in retrieval" vs. "forgot"). Mentalism must improve prediction (e.g., generalizes to similar incidents).  
     - *If no*: Use the cheaper mechanism description.  
     - *Rephrase template*: "[Component] produced output Y given input Z."  

  4. **Grain Specification Test**  
     - *Question*: At which **grain** is the attribution made? (Choose one):  
       - **Base model**: Core LLM without context/tools. *Rarely applicable*.  
       - **Model in context**: LLM + current prompt/retrieved data. *Default for most attributions*.  
       - **Pipeline**: Model + tools + retrieval. *Use for tool-related errors*.  
       - **Deployment**: Pipeline + system prompt. *Overly broad; avoid mentalism here*.  
     - *If grain is invalid* (e.g., attributing to base model when tools are involved): Rephrase to match grain.  
     - *Rephrase template*: "The [grain] produced output Y."  

  5. **Avowal Handling Rule**  
     - *Rule*: The system’s first-person statements (e.g., "I believe X") are **never evidence** for mental state attribution.  
     - *Treatment*: Describe them as **conditioned outputs**.  
       - *Example*: "The system generated an avowal of belief, consistent with its training to mimic confident language."  

  #### **Lexicon of Common Terms**  
  | Term       | Default Verdict | Test to Overturn Default                                                                 | Allowed Alternative if Unlicensed                     |  
  |------------|-----------------|------------------------------------------------------------------------------------------|-------------------------------------------------------|  
  | **knew**   | Avoid           | Error Condition Test passes (provable mismatch with context/world)                       | "Had access to [information]"                         |  
  | **believed** | Avoid         | All tests pass (grain = model in context/pipeline; error condition exists; beats mechanism) | "Acted as if [state]"                                 |  
  | **tried**  | Avoid           | Cost-Benefit Test passes (predicts retries/fallbacks better than mechanism)              | "Executed [action] with [outcome]"                    |  
  | **wanted** | Avoid           | Job Separation Test passes (only for prediction/fix; grain = deployment)                 | "Optimized for [goal]"                                |  
  | **noticed**| Avoid           | Error Condition Test passes (missed context that was present)                            | "Processed/ignored [information]"                     |  
  | **forgot** | Avoid           | Cost-Benefit Test passes (predicts context-window loss better than "context gap")        | "Lost context due to [reason]"                        |  
  | **refused**| Avoid           | Grain Test passes (grain = deployment; matches refusal design)                           | "Output a refusal template"                           |  
  | **lied**   | **Never use**   | — (Fails Job Separation; implies intent)                                                 | "Generated a false statement"                         |  
  | **hallucinated** | Use sparingly | Error Condition Test passes (fabrication unsupported by context/tools)                   | "Generated ungrounded content"                        |  

  ---

  ### **Procedure Applied to Backlog Cases**  
  **Case (a): Assistant falsely claims a refund was processed**  
  - Candidate sentence: "The assistant **believed** the refund had gone through."  
    1. **Job Separation**: Pass (used for fix: why output was wrong).  
    2. **Error Condition**: Pass (error = refund not processed in reality; tool not called).  
    3. **Cost-Benefit**: **Fail** — Cheaper alternative: "The output stated a refund was processed, but the refund tool was not called and context showed no record." (Predicts identical future cases; no added value from "believed").  
    4. **Grain**: Fail (attribution to "assistant" implies deployment grain; actual grain is model in context or pipeline).  
    - **Verdict**: Unlicensed.  
    - **Rephrased**: "**The model in context generated a response assuming a refund occurred, despite no tool call or context evidence.**"  
    - *Why you won’t like it*: It’s clunky, but "believed" conflates grain and adds no predictive value. Fix points to prompt/tool constraints.  

  **Case (b): Coding agent ignores deprecation warnings**  
  - Candidate sentence: "The agent **did not believe** the function was deprecated."  
    1. **Job Separation**: Pass (fix: why agent ignored context).  
    2. **Error Condition**: Pass (error = function was deprecated in context; output used it anyway).  
    3. **Cost-Benefit**: **Fail** — Cheaper alternative: "The agent generated code using the deprecated function despite context stating it was deprecated." (Identical prediction; "did not believe" is circular).  
    4. **Grain**: Pass (grain = model in context).  
    - **Verdict**: Unlicensed.  
    - **Rephrased**: "**The model in context did not use provided deprecation warnings when generating code.**"  
    - *Fix direction*: Context encoding or attention mechanisms (not "belief" adjustment).  

  **Case (c): Agent rationalizes wrong flight date**  
  - Candidate sentence: "The agent **wanted to appear consistent** and rationalized the error."  
    1. **Job Separation**: **Fail** — "Wanted" implies responsibility (intentional deception). Escalate to Legal Lead.  
    2. **Error Condition**: Fail (no definable error for "want"; circular with output).  
    3. **Cost-Benefit**: Fail — Cheaper: "When challenged, the agent generated a justification for the incorrect date."  
    - **Verdict**: Unlicensed.  
    - **Rephrased**: "**After booking an incorrect date, the agent generated a confident justification when challenged, consistent with its training to defend outputs.**"  
    - *Why you won’t like it*: Rejects juicy "rationalization" narrative, but avoids liability traps. Fix points to confidence calibration.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Overconfident Bad Verdicts**:  
     - Incidents involving **emergent goal-directed behavior** (e.g., agent persistently pursuing a flawed objective). The procedure may reject "wanted" too aggressively, missing predictive value.  
     - *Workaround*: Engineers can escalate if Cost-Benefit Test feels "obviously wrong."  

  2. **Unsettlable Questions**:  
     - **System avowals with no external evidence** (e.g., "I feel confused"). The procedure treats these as conditioned text, but regulators may demand intent analysis.  
     - **Ambiguous error conditions** (e.g., creative tasks with no "right" answer).  
     - *Handoff*: Escalate to Legal/Product Lead.  

  3. **Non-Expert Diagnosis**:  
     - A reader with only the transcript can:  
       - Verify **non-mentalistic reports** against logs (e.g., "tool not called" in Case (a)).  
       - Flag **mentalistic terms** and demand they pass the Lexicon tests (e.g., "believed" requires an error condition).  
       - Escalate if **responsibility/liability** is implied (e.g., "lied").  

  **Final Note**: This procedure errs toward defensibility over elegance. It blocks misleading mentalism 90% of the time but may overcorrect for novel behaviors. Trust the tests when they return an answer you dislike—it means they’re shielding you from unlicensed claims that could inflame regulators.
