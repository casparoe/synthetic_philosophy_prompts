prompt: |-
  ok so I've been sitting on a hiring committee this spring and I've realsied I have no coherent view at all on lying versus misleading, and its bugging me. Here's what I actually do and how I feel about it afterward. I want to know if there's a principle in there.

  1. I wrote a reference letter for a weak internal candidate that is literally true in every sentence — his one decent paper described fairly, plus "punctual" and "well liked" — and I left out that he never finished his dissertation, so the reader will conclude he's strong. I'll do that and sleep fine. I would not write "one of the strongest people I've worked with." My excuse is that everybody knows a letter is written by the candidate's advocate and discounts for it, but I'm not sure that's a moral difference rather than just "everyone expects it."

  2. My neighbor asks did you see who took my parcel, and I say "I didn't take it," which is true — I watched my housemate grab it by mistake. I think that's rotten, basically as bad as lying.

  3. I wear a wedding ring to conferences so nobody hits on me. Not married. Fine, I think — a stranger has no claim on that information and a ring isn't an answer to a question.

  4. I set my Slack to "in a meeting" to dodge a colleague who wants help with something I just don't feel like doing. Weaselly, I feel a bit bad, but not as bad as 2.

  5. My colleague has the internal grant deadline wrong — he thinks Friday, it's Wednesday — and I know, and I say nothing, because if he misses it my proposal moves up. I'm not staying quiet out of laziness; I'm staying quiet because I gain. I think that's bad, worse than 3 and 4, even though I did literally nothing at all.

  6. A stranger at a party takes me for a physician (I'm a pharmacist, long white coat, don't ask), starts describing a symptom and thanks "the doctor" afterward. I don't correct him. Barely registers as wrong with me. So silence is fine in 6 and bad in 5 and I want to know what turns it.

  7. My dad has dementia and asks where my mom is. She died seven months ago; he's asked a hundred times and each time the truth wrecks him. I say "she's resting." I go back and forth on this one every single time.

  8. The one that breaks my principle: our chair says in a meeting "mistakes were made with the budget" when she made them and everyone in the room knows it. I think that is worse than if she'd said flatly "I didn't do it," which would be a plain lie — because the hedge buys her the false impression while keeping deniability, and that feels more contemptible than owning the lie. Same vibe: my lawyer friend says she can't put her client up to testify falsely, but she can phrase questions so his literally true answers mislead the jury — and I think that's no better than the lie.

  The rough principle I've been carrying around: lying is worse because I put my word behind a false claim, I stake whatever authority I have and I'm answerable for it, whereas when I merely mislead I leave the hearer to draw an inference they could in principle resist, so I haven't taken that extra step. But 2, 5 and 8 don't behave that way at all, and 3 and 6 only fit by luck.

  So: is there one principle that gets most of this, or do I need two or three clauses, or is one of my verdicts just wrong? I'd like it stated precisely enough that I can actually apply it, with the case that motivates each clause, and I'd like you to say whether the wrong-making thing lives in what the speaker does or in what happens to the hearer — I suspect that's where I'm confused. Then give me your verdicts on three I haven't settled: (i) a patient asks "is it cancer" the morning after a scan and the doctor says "we'll know more when the biopsy comes back" when she's already about 90% sure it is; (ii) a delivery app shows a restaurant as "very busy, 45 min" to steer me to a different one when it isn't busy; (iii) my friend asks whether I liked her book and I text "so you!!" — true, warm, and I hated it. Be honest about which of my verdicts above your account can't accommodate and which one you'd overturn; I don't want "they're both deception so they're equally wrong" unless you can actually defend it against 1 and 3. Please write it in American English, I'm lifting bits of this for something I'm putting together. No need to name-check the literature — I've read the basic stuff about what you literally say versus what you imply, so use that vocabulary if it helps, but just argue.
reasoning: |-
  Okay, the user is struggling with the ethics of lying versus misleading. They've provided several personal examples and want a coherent principle to judge these situations. Let me start by understanding each scenario they mentioned.

  First, in the reference letter, they omit the fact that the candidate didn't finish their dissertation. The user feels okay about this because they believe everyone expects letters to be biased. Then there's the neighbor's parcel situation where they technically tell the truth but feel it's as bad as lying. Wearing a wedding ring to avoid advances seems fine to them since strangers aren't entitled to that info. Setting Slack to "in a meeting" to dodge a colleague feels weaselly but not too bad. Staying silent about a grant deadline to benefit is seen as worse. Not correcting a stranger who mistakes them for a doctor is fine, but silence is bad in the grant case. The dementia example with their dad is a moral dilemma. And the chair's misleading statement is worse than a direct lie because it's evasive.

  The user's rough principle is that lying is worse because it stakes their authority, but they notice inconsistencies. Cases 2, 5, and 8 don't fit. They want a principle that can handle most cases, with clear clauses, and they want to know where the wrongness lies—in the speaker's action or the hearer's experience.

  I recall the distinction between what is said and what is implicated. The user mentioned they're familiar with that, so I can use terms like conversational implicature. The key might be the speaker's intent and the hearer's reasonable expectations. Also, the stakes involved—harm, exploitation, or violation of duties.

  Looking at case 1: the reference letter. The user relies on contextual norms (everyone knows letters are biased). The misleading comes from omission, but within accepted practices. The harm is low because the reader should discount the praise. So, the principle here might involve context and role-based duties.

  Case 2: the neighbor. Saying "I didn't take it" implicates that they don't know who did, which is false. The neighbor reasonably expects helpful information, so the speaker exploits that expectation. This is deceptive because the implication is intentional. Worse than case 1 because of the duty to assist.

  Case 3: the wedding ring. No one is asking, so no assertion is made. The ring might imply marital status, but the user has no duty to disclose. Strangers aren't owed personal info, so it's acceptable. The wrongness depends on the context and relational duties.

  Case 4: Slack status. "In a meeting" might be technically true if they're busy, but the intent is to dodge. The colleague expects honesty in availability. However, since the status can be a polite refusal, it's less bad. The duty to help isn't absolute, so minor deception might be permissible.

  Case 5: Silent about the deadline. Here, silence is intentional deception. The user has a duty as a colleague to correct important info, especially when they benefit from the error. This exploits the colleague's trust, making it worse than cases 3 and 4.

  Case 6: Not correcting the stranger. No duty to correct a mistaken assumption in a casual context. Correcting might be socially awkward, and the harm is minimal. Unlike case 5, there's no exploitation or breach of duty.

  Case 7: Dad with dementia. Telling the truth causes harm each time. The duty here shifts to compassion. The lie is protective, reducing harm. The user's back-and-forth feelings show the conflict between truth and care. The principle must account for harm prevention.

  Case 8: The chair's evasive statement. Using passive voice avoids direct lying but intentionally misleads. It's worse because it's a breach of accountability in a role that demands honesty. The lawyer example is similar—exploiting language to mislead while maintaining deniability. This feels more contemptible because it avoids responsibility.

  The user's initial principle fails in cases where misleading is worse due to exploitation or avoiding accountability. The core issues are intent to deceive, reasonable expectations, duties, and harm.

  So, a unified principle could be based on the speaker's intent to cause a false belief, the hearer's reasonable reliance, and the speaker's duties. Harm and exploitation are key factors. Also, context matters—norms like reference letters allow certain omissions.

  Now, applying this to the new cases:

  (i) The doctor case: Saying "we'll know more" when 90% sure of cancer. The patient reasonably expects relevant info. The doctor has a duty to be truthful but might avoid causing panic. However, withholding critical info denies the patient agency. This seems deceptive and harmful, worse than a white lie if it delays preparation.

  (ii) The app showing "very busy" falsely. This exploits the user's trust for the app's benefit. It's intentionally deceptive without justification, similar to case 8. Worse than the wedding ring because it's a commercial duty to provide accurate info.

  (iii) Complimenting a friend's book falsely. This is a social lie to spare feelings. The duty to be kind might outweigh strict honesty here. But if the friend relies on the feedback for their career, it could be harmful. Context matters—casual vs. professional.

  The user might need multiple clauses: intent, duty, harm, and context. Cases that don't fit well could be the reference letter (contextual norms) and the dementia lie (harm prevention overriding truth). The chair's misleading statement is worse because of accountability evasion, which isn't fully covered by the initial principle but is explained by intent and duty breach.

  In conclusion, the unified principle should emphasize intent to deceive, reasonable expectations, relational duties, and resulting harm. Where duties are low and harm is minimal (like the ring), misleading is acceptable. When exploiting trust or avoiding accountability (like the chair or the app), it's worse than direct lies. The user's verdict in case 2 (rotten) aligns because of the neighbor's reasonable expectation. Case 5 (bad) fits due to duty breach. Case 8 (worse) because of evasion. The dementia case (7) is justified by harm prevention, even if it's a lie.
answer: |-
  Here's a coherent principle distilled from your cases, respecting your intuitions while resolving the inconsistencies. It has three core clauses focused on **the speaker's intent and relational duties**, not just outcomes for the hearer. Wrongness lives primarily in **what the speaker does**: intentionally exploiting trust or violating a duty to prevent harm/error, using deception as a tool.

  ### Unified Principle
  **Deception is permissible or mitigated when:**  
  (1) **Contextual norms** reasonably signal that information is partial or discounted (e.g., advocacy roles), OR  
  (2) **No duty exists** to correct/volunteer information, AND no harm/exploitation occurs.  
  **Deception is wrong (and misleading often *worse* than lying) when:**  
  (3) **Intentional exploitation** occurs: the speaker *leverages* the hearer’s reasonable trust or unavoidable ignorance to benefit or avoid accountability, especially when a duty exists.

  ### Breakdown with Your Cases
  - **What makes deception wrong:**  
    - **Exploitation of trust/ignorance (Clause 3):** You deceive to *gain at the hearer’s expense* or *evade owed accountability*. This makes misleading *worse* than lying when it weaponizes plausible deniability (e.g., your Cases 5 & 8).  
    - **Violation of duty (Clause 3):** You have a role-based or relational duty to prevent harm/error (e.g., colleague, neighbor).  
  - **What mitigates deception:**  
    - **Contextual discounting (Clause 1):** Hearers know to adjust expectations (e.g., reference letters).  
    - **No duty + no harm (Clause 2):** Strangers or casual contexts impose no duty to inform/correct.  
  - **Lying vs. Misleading:**  
    - Lying *can* be less bad if it’s blunt (no deniability) and serves compassion (Case 7).  
    - Misleading is often *worse* when it’s strategic exploitation (Case 8) because it compounds deception with cowardice.  

  ---

  ### Your Cases Analyzed Using the Principle
  1. **Reference letter (OK):**  
     - **Fits Clause 1:** Academic norms signal advocacy; readers discount praise. Omission isn’t exploitative because the context warns against full disclosure.  
     - *Verdict upheld.*  

  2. **Neighbor’s parcel (Rotten):**  
     - **Violates Clause 3:** You exploit their trust (neighbors owe mutual aid) by implying ignorance. "I didn’t take it" *implicates* "I don’t know," which is false. Benefit is avoiding awkwardness; harm is their unresolved theft.  
     - *Worse than a lie?* Yes, because it evades direct responsibility while harming.  

  3. **Wedding ring (Fine):**  
     - **Fits Clause 2:** Strangers have no claim on marital status; no duty exists. The ring isn’t a response to a query, so no implication is triggered.  
     - *Verdict upheld.*  

  4. **Slack status (Weaselly but OK):**  
     - **Fits Clause 2 (barely):** Colleagues have mild duties, but "in a meeting" is a conventional polite fiction (like "busy" signals). Mild deception avoids friction; no material harm.  
     - *Your guilt:* From *feigning* a specific obligation (implied: "I can’t help because I’m in a meeting"), which edges toward exploitation. Still mitigated by low stakes.  

  5. **Grant deadline (Bad):**  
     - **Violates Clause 3 severely:** You exploit a colleague’s error for gain. Duty exists to correct critical errors (collegiality/teamwork). Silence *implicates* agreement with their belief.  
     - *Why worse than 3/4?* Active exploitation + material harm.  

  6. **Stranger’s medical error (Fine):**  
     - **Fits Clause 2:** No duty to correct a stranger’s assumption at a party. Correcting might cause social harm (embarrassment); no benefit to you. Silence doesn’t *implicate* agreement.  
     - *Why not like 5?* In 5, you have a duty and exploit; here, no duty and no exploitation.  

  7. **Dementia lie (Morally permissible):**  
     - **Fits Clause 3 exemption:** Duty shifts toward preventing *immediate harm* (truth causes distress). "She’s resting" is compassionate deception, not exploitation.  
     - *Your back-and-forth:* Understandable—truth has moral weight, but harm reduction justifies it here.  

  8. **Chair’s passive voice (Worse than lying):**  
     - **Violates Clause 3 egregiously:** She exploits plausible deniability to evade accountability *owed* to the team. Misleading is *more contemptible* because it refuses to own the lie while achieving the same deception.  
     - *Lawyer parallel:* Identical. Phrasing questions to mislead exploits the jury’s trust in the legal process.  
     - *Overturns your initial principle:* Yes—misleading is worse here because it adds *manipulation of trust* to the deception.  

  ---

  ### Verdicts on New Cases
  **(i) Doctor says "we’ll know more" when 90% sure it’s cancer.**  
  - **Violates Clause 3:** Patient has a *reasonable expectation* of transparency (doctor’s duty). Phrasing exploits their hope/ignorance to avoid discomfort. Harm: delays emotional/preparatory steps.  
  - **Verdict:** Wrong. Worse than a gentle lie ("It’s likely, but we’ll confirm with biopsy").  

  **(ii) Delivery app shows "very busy, 45 min" when restaurant isn’t busy.**  
  - **Violates Clause 3:** The app exploits user trust (duty to provide accurate data) to steer behavior for its benefit. "Very busy" *implies* objective truth, not "we want you to go elsewhere."  
  - **Verdict:** Wrong and exploitative. Equal to lying.  

  **(iii) Friend’s book: "so you!!" when you hated it.**  
  - **Fits Clause 1/Clause 2 mitigation:** Social norms allow white lies to spare feelings among friends. No material harm; duty leans toward kindness over brutal honesty.  
  - **But:** If friend relies on this for professional decisions, it *becomes* exploitative (Clause 3).  
  - **Verdict:** Permissible in casual contexts.  

  ---

  ### Where Your Initial Principle Fails (and How This Fixes It)
  - **Fails on Cases 2, 5, 8:** Your "staked authority" idea didn’t explain why misleading felt *worse* than lying in 8, or why silence/technically-true statements in 2 and 5 felt so bad.  
    - **Fix:** Clause 3 centers on *exploiting trust* and *duty violation*, making misleading worse when it’s strategic evasion.  
  - **Fits 3 and 6 "by luck":** Your principle didn’t account for *duty* or *context*, which Clause 2/1 explicitly cover.  
  - **Overturns your verdict?** Only partially in Case 7: your principle might call "she’s resting" a lie (staked authority), but Clause 3’s harm exemption justifies it.  

  ### Why "Both Are Deception" Isn’t Enough
  Your Cases 1 and 3 show deception isn’t uniformly wrong. This principle explains *why*:  
  - **Context (Clause 1)** and **no duty/harm (Clause 2)** create "ethical safe harbors."  
  - **Exploitation (Clause 3)** makes deception immoral, with misleading *amplifying* wrongness when it dodges accountability.  

  This gives you a testable framework:  
  1. *Is there a duty to inform/correct?*  
  2. *Am I exploiting trust/ignorance?*  
  3. *Does context normailze partiality?*  
  If #2 is "yes," it’s wrong—and misleading is often *more* corrosive to trust.
