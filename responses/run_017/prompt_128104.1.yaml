prompt: |-
  My politics tutor is a pretty hardline Nozickian, and I've been keeping a list of her verdicts on cases we've gone through:

  - Wilt Chamberlain: the resulting distribution is just, and taxing it back is on a par with forced labour.
  - A homesteader who fences off an unclaimed field when there's plenty of similar land left nearby: fine, and she owes later arrivals nothing.
  - A painting looted in the 1940s and bought in good faith thirty years later: goes back to the original owner's heir, and no compensation for the buyer.
  - A firm that patents a compound a community had been using for centuries and then charges monopoly prices: not a legitimate holding — though she's said she can't decide whether that's because the stuff was never unowned or because the community ends up worse off.
  - Copying a recipe out of a published cookbook and opening a rival restaurant that ends up driving the original one out of business: fine, nothing was taken.

  New case, which I get to pick for next week: a company copies, without asking anyone, every publicly posted text on the internet, trains a model on it and sells access. Nobody is worse off at the moment of copying — the texts were free to read anyway — but the model then substitutes for a lot of the writers, many of whom lose most of their income. The company makes billions. A hundredth of one percent of writers used the opt-out form.

  What will she say about whether that's a legitimate holding? I care much less about the verdict than about the rule she's running. I can see two or three rules that fit all five earlier verdicts equally well and come apart here: something about the proviso being a one-off gate at acquisition vs a standing condition, something about information not being the kind of thing you can appropriate because it isn't rival, something about the wrong being use-without-say-so rather than anyone being made worse off. Tell me which of those (or what else) she's really running, what each candidate predicts here, your best guess with the reason for preferring it over the runner-up, and the single further case that would best tell the top two apart. She also doesnt accept "everyone is better off in aggregate" as an answer to anything.

  Lead with your bottom line in the first sentence — verdict plus rule — then the reasoning, no preamble and no restating the question. British English, and no citations, I'll add those myself.
reasoning: |-
  Hmm, the user is a student who has a politics tutor with strong Nozickian views. They've given me a list of her verdicts on five cases involving property rights and justice in holdings, and they want to predict her response to a new case about AI training data. They're less interested in the verdict itself than in identifying the consistent rule behind her judgments.

  Looking at the tutor's previous verdicts:
  - Wilt Chamberlain case: She supports voluntary transfers and opposes taxation as forced labor.
  - Homesteading case: She allows appropriation without compensation as long as "enough and as good" remains.
  - Looted painting: She prioritizes historical ownership over good faith acquisition.
  - Patented compound: She rejects patenting traditional knowledge, possibly due to original appropriation issues or worsening position.
  - Copied recipe: She permits copying published information without compensation.

  For the new AI case, the company copies publicly available internet text, trains an AI model, sells access, and causes writers to lose income despite an opt-out option. The key points are that no one was worse off at the moment of copying, but substitution effects later harm writers.

  The user suggests three possible rules that might explain the tutor's pattern:
  1. Proviso as a one-off gate versus a standing condition.
  2. Information being non-rival and thus unappropriable.
  3. Wrong based on use-without-consent rather than harm.

  I need to determine which rule best fits all five cases and predict the verdict for the new case. Then I should propose a test case to distinguish between the top two rules.

  Analyzing the rules:
  - The proviso as a one-off gate fits if we focus on initial acquisition conditions (like in the homesteading case). This would likely allow the AI copying since there was "enough and as good" left at the time of copying.
  - The non-rival nature of information fits the recipe case where copying was permitted. This would also support allowing AI copying.
  - Use-without-consent seems to explain the looted painting case (taking without permission) and might apply here if consent is key. The opt-out mechanism might complicate this.

  The patent case is ambiguous because she couldn't decide between "never unowned" (which relates to original acquisition) and "worse off" (which might imply a standing proviso). However, all other cases reject ongoing conditions—taxation, owing later arrivals, compensating buyers, or preventing competition. The recipe case specifically allows substitution that harms others. This suggests her rule isn't about ongoing harm but about initial rights violations.

  The strongest fit is the proviso as a one-off gate. This explains:
  - Homesteading: Proviso satisfied initially.
  - Chamberlain: Transfers voluntary, no proviso issue later.
  - Painting: Theft violates acquisition, so holding isn't legitimate regardless of later events.
  - Patent: Either the initial appropriation failed (if never unowned) or the proviso was violated at acquisition if it worsened others (though she's unsure).
  - Recipe: Copying public info doesn't violate acquisition proviso.

  In the AI case, copying public data wouldn't violate the proviso at the moment of taking since nothing was removed and "enough and as good" remained. The later harm is irrelevant per her pattern. The opt-out is a red herring—her rule doesn't require consent for use, as seen in the recipe case.

  The runner-up is the non-rival rule, but it doesn't explain the painting case (physical theft) or the patent ambiguity. The use-without-consent rule is weak because the recipe case allowed use without consent.

  For a test case to distinguish one-off proviso from non-rival rules: Imagine copying a secret formula obtained without permission but without worsening anyone at that moment. Under one-off proviso, if acquisition violated rights (like theft), it's illegitimate (similar to the painting). Under non-rival, it might be allowed since information isn't rivalrous. This would split them.

  So, verdict: legitimate holding. Rule: the Lockean proviso applies only at initial acquisition, not as a standing condition.
answer: |-
  The holding is legitimate because the Lockean proviso applies only as a one-off gate at the moment of initial appropriation or use, not as a standing condition against later worsening. Here, copying publicly available text satisfied the proviso at acquisition (nothing was removed, "enough and as good" remained), and subsequent harms from substitution are irrelevant, aligning with the recipe and Chamberlain cases where later losses don't invalidate holdings. 

  **Reasoning**: Your tutor's verdicts consistently prioritise initial rights violations over outcomes. The proviso operates solely at acquisition: homesteading (proviso met if "enough and as good" left initially), Chamberlain (voluntary transfer untouched by later taxation), and the painting (theft at acquisition invalidates all subsequent holdings). The patent case ambiguity centres on whether initial appropriation failed (if the compound was "never unowned"), not ongoing harm. The recipe case confirms that copying public information without consent or compensation is permissible even if it causes later harm, as no initial right is violated. 

  In this AI case: 
  - Copying public text is like the recipe—no appropriation at the moment of taking because information is non-rival and freely accessible, leaving "enough and as good" for others. 
  - The opt-out is immaterial; consent isn't required for use, per the recipe verdict. 
  - Later income loss is a substitution effect, akin to the restaurant or Chamberlain, and doesn’t trigger the proviso retrospectively. 

  **Runner-up rule**: Information is non-rival and thus inappropriable. This fits the recipe and potentially this case (allowing copying) but fails the painting verdict (physical loot is rivalrous yet still restored) and doesn’t explain the patent case’s "never unowned" angle. It also oversimplifies why harm is ignored. 

  **Test case**: A researcher secretly copies a rival’s unpublished manuscript from their desk (trespassing), uses it to publish first, and causes the rival financial loss, but at the moment of copying, the rival still has their copy and isn’t worse off. 
  - **One-off proviso prediction**: Illegitimate. The initial acquisition involved trespass (a rights violation), like the painting theft, voiding the holding regardless of later harm. 
  - **Non-rival rule prediction**: Legitimate. Information isn’t rivalrous, so copying without consent is permissible if no immediate worsening occurred. 
  This distinguishes the rules by stressing whether acquisition breaches rights (proviso focus) versus the nature of the resource.
