answer: |-
  Here’s a structured analysis of requirements for your corruption definition, sorted by necessity, with cases, distinctions, and conflicts highlighted. The goal is a **practical tool for daily decisions + a publishable risk metric**, balancing legal rigor, anthropological realism, and operational usability.

  ---

  ### **I. Non-Negotiable Requirements**  
  *(Essential for functionality, ethics, or risk accuracy)*  

  1. **Distinguish Corruption from Related Concepts**  
     - **Case:** A procurement officer awards a contract to a firm owned by their ethnic group but follows all formal procedures. *Must not* be labeled corruption if it’s clientelism (favoring a group for political loyalty) or patronage (rewarding supporters).  
     - **Why:** Mislabeling inflates risk scores and misguides conduct codes. Anthropology shows clientelism can be socially legitimate; corruption implies illegality/moral breach.  
     - **Distinctions Required:** Corruption vs. clientelism, patronage, rent-seeking (legal profit from scarce resources), state capture (elites rewriting rules), theft.  

  2. **Cover Both Individual Acts and Systemic Issues**  
     - **Case:** A hospital requires unofficial "gratitude payments" for basic care. No single official dictates this; it’s institutionalized. The risk score must flag the *system*, while the code must guide staff on refusing payments.  
     - **Why:** Limiting to individual acts misses institutional drivers (e.g., Peru’s "supermarcados de la salud" bribery rings). Economics finds systemic corruption reduces investment more than isolated acts.  

  3. **Acknowledge Context Without Relativism**  
     - **Case:** In Country A, gift-giving is relationship-building; in Country B, the same act secures a permit. The code must prohibit the latter without banning the former. Risk scores must reflect *functional impact* (distortion) not just cultural practice.  
     - **Why:** Anthropology confirms gifts can build social capital (Mauss’s *The Gift*). **Conflict:** Universal standard vs. local legitimacy. *Resolution:* Define corruption by *outcome* (distorts fairness/service delivery) not just form.  

  4. **Include "Gain" Beyond Personal Enrichment**  
     - **Case:** An official fast-tracks permits for their political party, gaining no cash but securing votes. *Must* be corruption—it abuses power for non-monetary advantage.  
     - **Why:** OECD and UN conventions define corruption by "abuse of entrusted power for *any* benefit." Excluding non-cash gains invites loopholes.  

  5. **Address "No Human in the Loop" Corruption**  
     - **Case:** An AI procurement system trained on biased data favors certain vendors. Or a vendor is chosen due to kinship, with no discretionary decision. *Must* be covered as institutional corruption.  
     - **Why:** Modern governance increasingly algorithm-driven. Ignoring this creates blind spots in risk metrics.  

  ---

  ### **II. Camp Preferences (Negotiable)**  
  *(Reflect legalistic vs. behavioral/social science biases)*  

  1. **Requirement: Corruption Must Involve a Public Official**  
     - **Preference of:** Legalistic camps (e.g., FCPA/UK Bribery Act focus).  
     - **Case:** A private factory manager takes kickbacks. Labeling this "fraud" not corruption downplays its systemic harm.  
     - **Why Negotiable:** TI and World Bank define corruption as abuse of *entrusted power* (public or private). Your risk score must capture private-sector bribery (e.g., supply chains).  

  2. **Requirement: Identifiable Quid Pro Quo**  
     - **Preference of:** Prosecutors (simplifies convictions).  
     - **Case:** "Gifts" to officials with no explicit demand. Anthropology shows reciprocity can be implicit (e.g., Nepal’s *ghus* culture).  
     - **Why Negotiable:** Focus on quid pro quo misses diffuse patronage. Risk metric should capture *expectation of favor*.  

  3. **Requirement: There Must Be a "Loser"**  
     - **Preference of:** Economists focused on allocative efficiency.  
     - **Case:** A bribe speeds up a passport application. The payer "wins," but society loses when fairness is monetized.  
     - **Why Negotiable:** Corruption erodes trust in institutions even when "efficient" (Shleifer & Vishny).  

  4. **Requirement: Courtroom-Grade Provability**  
     - **Preference of:** Legal/compliance teams.  
     - **Case:** Systemic bias in procurement algorithms. Hard to pin on an individual, but critical for risk scoring.  
     - **Conflict:** Directly opposes systemic sensitivity. *Resolution:* Separate *conduct code* (needs provability for sanctions) from *risk metric* (can include systemic indicators).  

  5. **Requirement: One Standard Globally**  
     - **Preference of:** Headquarters/auditors.  
     - **Case:** A ceremonial gift in Country X is a bribe in Country Y.  
     - **Conflict:** Undermines staff legitimacy if local norms are ignored. *Resolution:* Universal core ("no distorting fair processes") + localized examples in code annexes.  

  ---

  ### **III. Missing Requirements**  
  1. **Clarity on "Gift vs. Bribe"**  
     - **Case:** A farmer gives a district officer produce annually. If this ensures fair treatment, it’s relational (acceptable). If it secures illegal land permits, it’s corruption.  
     - **Requirement:** Definition must clarify *intent to influence* or *distortion of duty*.  

  2. **"Greed vs. Need" Distinction**  
     - **Case:** A nurse demands $5 to deliver free medicine (greed) vs. a teacher taking "fees" because their salary is unpaid for months (survival).  
     - **Why:** Punitive codes for "need" cases worsen service delivery. Risk metric should flag predatory vs. survival corruption differently.  

  3. **Enforcement Selectivity**  
     - **Case:** Only opposition-aligned officials prosecuted for bribery.  
     - **Requirement:** Code must prohibit *all* bribery, but risk score should note if enforcement is weaponized (political corruption).  

  ---

  ### **IV. Key Conflicts & Trade-offs**  
  - **Unresolvable Conflict:** **Provability vs. Systemic Sensitivity**  
    - Provability requires individual, evidence-based acts. Systemic corruption (e.g., algorithmic bias, cultural norms) is rarely provable to courtroom standards.  
    - *Solution:* Split tools. *Conduct code* uses narrow, provable definition for sanctions. *Risk metric* uses broader, functional definition ("abuse of power distorting fairness/service delivery").  

  - **Secondary Conflict:** **Universal Standard vs. Local Legitimacy**  
    - Universalism can alienate staff if it ignores contextual norms (e.g., relational gifts).  
    - *Solution:* "Core principles + localized guidance." E.g., Code bans "any exchange distorting impartiality"; annex lists country-specific examples.  

  ---

  ### **V. Most Definition-Excluding Requirement**  
  **"Provability for Dismissal/Prosecution"** does the most to exclude candidate definitions. It demands:  
  - A narrow, act-based focus (excluding systemic issues).  
  - An identifiable perpetrator (excluding institutional corruption).  
  - Evidence standards incompatible with anthropological realism (e.g., implicit reciprocity).  

  *This requirement forces a trade-off: if kept, the risk metric will be blind to institutional corruption; if dropped, sanctions become harder.*  

  ---

  ### **VI. Scoring Common Definition Families**  
  1. **Legalistic (e.g., FCPA):** "Bribery of public officials for quid pro quo."  
     - *Pros:* Provable, clear for sanctions.  
     - *Cons:* Misses private sector, systemic issues, non-cash gains; ignores anthropology.  

  2. **Functional (e.g., TI):** "Abuse of entrusted power for private gain."  
     - *Pros:* Covers private sector, non-cash gains; good for risk metrics.  
     - *Cons:* "Private gain" may exclude partisan favors; "entrusted power" ambiguous in kinship cases.  

  3. **Anthropological (e.g., Olivier de Sardan):** "Violation of communal norms for personal advantage."  
     - *Pros:* Captures context, relational gifts.  
     - *Cons:* Too vague for sanctions; risks relativism (e.g., approving nepotism).  

  ---

  ### **Recommendation**  
  Adopt a **tiered approach**:  
  - **Conduct Code:** Use a **legalistic definition** (provable acts) for enforceability.  
  - **Risk Metric:** Use a **functional definition** ("abuse of power distorting fairness or service delivery") + **systemic indicators** (e.g., nepotism in procurement, enforcement selectivity).  
  - **Guidance Notes:** Add country-specific examples resolving gift/clientelism/corruption distinctions.  

  This satisfies core requirements while isolating conflicts: provability for sanctions, systemic insight for risk scoring. Without this split, your definition will fail either operational staff ("unprovable!") or researchers ("myopic!").
