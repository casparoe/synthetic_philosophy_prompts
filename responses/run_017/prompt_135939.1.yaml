prompt: |-
  I spent three hours last night arguing with a friend about whether knowing how to do something is really just a special case of knowing that something is so, and I came away unable to tell whether my own gut reactions to cases add up to any coherent view. I would like your help finding out whether they do.

  Some context, because my verdicts come from somewhere. I run simulation-based recertification for critical-care paramedics. Every month I sign off or fail thirty or forty people on a small set of hands-on procedures: airway management, needle decompression, surgical airway, a few others. The stakes are real, someone can die, my sign-offs are reviewed by the medical director, and for every fail I have to write a one-line justification I could defend to the trainee and, if it comes to it, to a union representative. I am not asking you for a checklist. I am asking because I keep having to say of a person, in one line, that they know how to do this or that they do not, and I want to know what I am actually claiming when I say it.

  My friend's view, as I understood it: knowing how to do something is just knowing, of some way of doing it, that it is a way of doing it — a matter of knowing facts, not a separate faculty, and the fact can be known in a practical way that ordinary questioning cannot get at. He had a reply to my objection that this would require a trainee to run through propositions before acting, and an answer to the worry about cases where someone plainly succeeds without knowing anything statable. I did not follow all of it. But here is where I landed on cases, and I would rather start from these than from his theory.

  One: Maya has forty clean intubations on the simulator and has frozen on two real patients, both times needing someone else to take over. I failed her and wrote that she does not know how yet. Two: Dan recites the steps in order, aces the written exam, and is hopeless with his hands on the manikin. He does not know how. That one is easy for me. Three: Dr. Ruiz, twenty-five years of experience, now has a focal dystonia in her right hand and physically cannot perform. But watching a trainee she says rotate your wrist, you are catching on the right arytenoid, and when he does it, it works; she also catches errors nobody else in the room has noticed. I say she still knows how to do it, and I would say that without hesitating. That is already in tension with one, since I deny it of someone who can perform and grant it of someone who cannot.

  Four: a learner with dense amnesia from a hypoxic injury — if the textbooks are right that such people exist — who cannot recall the previous session, insists she has never done this before, and cannot answer a single question about it, yet gets measurably faster and cleaner across sessions. I say she knows how. This is the case I feel most confident about and the one I think my friend has to explain away. Five: a trainee who performs the whole procedure correctly while a colleague reads the checklist aloud, and stalls at step three in silence. I wrote not yet. Six: Nurse Okafor, fifteen years in, runs resuscitations beautifully, and tells me she would be lost without the wall chart in view. Obviously she knows how. Five and six pull against each other: I deny the one and grant the other, and both fail in silence. Seven: Garrity, whose success depends on his preceptor nudging the scope angle without telling him, and who believes he is doing it himself. He does not know how, even though he succeeds. Eight: a tech who positions the patient's head exactly right every time because she was taught that it prevents the operator from throwing out their back, which it does not, though the positioning is precisely what opens the airway. I say she knows how to position, and that she simply has no idea why.

  Nine, where I go back and forth: a system trained on a few hundred thousand recorded procedures which, driving a robot arm, runs the procedure on a simulator better than most of my trainees and, used as a decision aid, tells a human the next move and is right more often than I am. Nobody can extract a rule from it, and there is nothing in it that looks like holding anything true. My gut says it does not know how. I cannot say why without taking back four, which makes me suspect my gut is just prejudice, and then I think maybe not, and around we go.

  The principle I have been toying with, such as it is: a person knows how to do something when their successes at it are reliable enough across the range of situations the sign-off actually covers, and when the successes are attributable to their own grasp of what makes for success, where that grasp can show up in doing, in correcting, or in teaching, and need not be anything they can put into words. I think it handles one, two, four, seven and eight. I think it comes apart on three versus one, on five versus six, and I have no idea what it says about nine.

  So: is there a principle that captures my verdicts, or nearly all of them, and if not, which ones should I drop and what is the cost of dropping them? If you think my tentative principle is close, repair it rather than replacing it wholesale, and tell me which clause is doing the work in which case. Then tell me what the principle you settle on says about two cases I have not listed: a trainee who, after one demonstration and one sentence of instruction, performs the procedure perfectly the first time — did she know how before she had ever done it? And an expert who cannot tell you how she knows the tube is placed, and whose stated criteria, when we test them, are demonstrably not the ones she is using.

  Please also flag anywhere your verdict on one of my cases depends on an empirical assumption I may have got wrong about amnesia, dystonia, or the internals of the system in case nine, since I would rather know that my case is unrealistic than be given a tidy answer to a fiction. I do not want a survey of positions or an account of who has argued for what; I want the principle and what it costs me. And I want you to say how confident you are in what you claim, and to single out the point you are least sure of.

  One last thing about format. Write in continuous prose, the way you would write an email to a smart colleague: no headings, no bullet points, no bold text, no tables. You are a professional philosopher who works on knowledge and action, so please think this through properly before committing — start by sketching several candidate principles and testing each against every case, discard the ones that break, and then give me the one that survives, together with where it misfires.
reasoning: |-
  Okay, let me try to work through this user's problem. They're a paramedic instructor who needs to determine if trainees "know how" to perform procedures, and they have specific cases where their gut reactions clash. The core tension is between knowledge-that (propositional) and knowledge-how (procedural), and their tentative principle involves reliability and grasp of success conditions.

  First, I need to unpack their cases. Maya freezes in real situations despite simulator success - so reliability under pressure matters. Dan knows the steps but can't execute - propositional knowledge isn't enough. Dr. Ruiz can't physically perform but can teach - so knowledge-how persists without current ability. The amnesiac learner improves without recall - implicit learning suggests knowledge-how without declarative access. 

  The checklist-dependent nurse (Okafor) knows how, while the trainee who stalls without prompts doesn't - so dependence on aids matters. Garrity succeeds only with hidden help lacks true grasp. The tech with wrong rationale but correct execution still knows how - so understanding why isn't necessary. The AI system performs well but lacks attribution - here the user wavers because it challenges whether consciousness is required.

  Their tentative principle has holes: Ruiz vs Maya (ability vs knowledge), checklist dependence inconsistency (Okafor vs trainee), and the AI dilemma. I need a principle that values reliable success rooted in the agent's competence, observable through performance, correction, or instruction. 

  For the AI, I'm leaning toward denying knowledge-how because it lacks understanding - its "grasp" isn't attributable to learning or insight. This doesn't contradict the amnesiac case because neural plasticity still constitutes biological understanding. 

  New cases: The one-time learner likely didn't know how before - no track record. The expert with inaccurate self-report still knows how - her real criteria are embodied, not verbalized.

  Biggest uncertainty is the AI case - if we consider it a tool, it doesn't "know," but if we anthropomorphize learning systems, views might differ. The user should note this tension in their assessments.
answer: |-
  Your cases are a philosopher's feast—precisely the kind of grounded, messy intuitions that expose where theories crack. I’ll sketch candidate principles, test them against your verdicts, discard failures, and refine the survivor. Your tentative principle is close; I’ll repair it, flag costs, and address your new cases. Empirical assumptions will be noted. Confidence ratings (1-10, 10=highest) follow key claims.

  ### Candidate Principles & Testing
  1. **Procedural Reliability (PR)**: "X knows how to φ iff X reliably succeeds at φ-ing across relevant situations."  
     - *Fails*: Maya (reliable in sim, not real); Garrity (succeeds only with hidden help); System (reliably succeeds). Contradicts your verdicts on 1,7,9.

  2. **Ability + Propositional Knowledge (APK)**: "X knows how to φ iff X can φ and knows facts about φ-ing."  
     - *Fails*: Ruiz (can’t perform); Amnesiac (knows no facts); Tech (wrong facts); Dan (knows facts, can’t perform). Contradicts 3,4,8,2.

  3. **Grasp-Attributed Reliability (GAR) - Your Tentative Principle**: "X knows how to φ iff:  
     (i) X’s successes at φ-ing are reliable across the sign-off’s situational range;  
     (ii) Successes are attributable to X’s grasp of what makes for success;  
     (iii) Grasp manifests in doing, correcting, or teaching."  
     Let’s test it against your cases:  
     - **Maya (1)**: Passes (i)? Unclear—simulator ≠ real range. **Fails (i)** if "range" includes real emergencies. Your verdict: *fails*. **GAR holds** if "range" is defined by recertification standards (simulator only? Unlikely). **Tension with Ruiz.**  
     - **Dan (2)**: Reliable failure. **Fails (i)**. Your verdict: *fails*. **GAR holds.**  
     - **Ruiz (3)**: Can’t satisfy (i) physically. But her teaching/correcting satisfies (ii)/(iii). **Passes if (i) is waived when (ii)/(iii) hold.** Your verdict: *knows*. **GAR holds** if (i) isn’t strictly necessary.  
     - **Amnesiac (4)**: Reliable improvement (i). Grasp? Attribution tricky—but neural learning implies *her* system encodes success conditions (ii). Manifest in doing (iii). Your verdict: *knows*. **GAR holds** (confidence: 8; assumes procedural memory intact).  
     - **Checklist-Dependent Trainee (5)**: Unreliable without aid (i). No grasp? Or grasp dependent? **Fails (i)/(ii)**. Your verdict: *not yet*. **GAR holds.**  
     - **Okafor (6)**: Reliable with chart (i). Grasp? Chart integrates into *her* competence—she deploys it fluidly (ii). Manifest in doing (iii). Your verdict: *knows*. **GAR holds.**  
     - **Garrity (7)**: Succeeds, but due to hidden help. Not *his* grasp (ii). **Fails (ii)**. Your verdict: *doesn’t know*. **GAR holds.**  
     - **Tech (8)**: Reliable (i). Grasp of *positioning* exists (embodied know-how), though rationale wrong (ii). Manifest in doing (iii). Your verdict: *knows*. **GAR holds** (confidence: 9; grasp need not be verbal/causal).  
     - **System (9)**: Reliable (i). Attributable? Its "grasp" is statistical, not understanding success conditions (ii). No manifestation beyond output. Your verdict: *gut says no*. **GAR holds if (ii) requires understanding.**  

  **GAR’s Weak Spots**:  
  - **Ruiz vs. Maya**: Ruiz’s inability breaks (i), yet you attribute knowledge. Principle must decouple reliability from current physical ability.  
  - **Okafor (6) vs. Checklist Trainee (5)**: Both "fail in silence" without aid. GAR distinguishes via *integration* of aid into competence (Okafor) vs. external crutch (trainee). But is this clear in the principle?  
  - **System (9)**: GAR denies knowledge if "grasp" requires cognitive understanding. But amnesiac has biological understanding—so no contradiction.  

  ### Repaired Principle: **Attributable Competence (AC)**  
  "X knows how to φ iff:  
  (i) X has a competence to φ that is *robust* across the situational range relevant to the sign-off’s purpose;  
  (ii) This competence arises from X’s integrated grasp (neural, cognitive, or embodied) of what constitutes successful φ-ing;  
  (iii) The competence is *attributable to X as an agent*—it doesn’t depend on external prompts or hidden guidance *that bypasses X’s agency*;  
  (iv) Grasp manifests in X’s ability to φ, correct φ-ing, or teach φ-ing (even if not verbally)."  

  **Why AC Works Better**:  
  - **Robustness (i)**: Covers Maya (simulator ≠ real emergencies) and Ruiz (competence persists sans ability). "Robust" implies resilience under stress/novelty.  
  - **Integrated Grasp (ii)**: Distinguishes Okafor (chart integrated) from Checklist Trainee (prompts not integrated). Includes embodied/implicit knowledge (Tech, Amnesiac).  
  - **Agency (iii)**: Excludes Garrity (preceptor’s hidden help bypasses his agency) and System (no agency).  
  - **Manifestation (iv)**: Unifies doing/correcting/teaching.  

  **Costs & Misfires**:  
  - **Maya (1)**: AC *fails* her if "situational range" includes real emergencies (your justification suggests it does). **Cost**: Upholds your verdict but risks excluding competent-but-anxious learners. Defensible given stakes (confidence: 9).  
  - **System (9)**: AC denies knowledge. **Cost**: Rejects AI "know-how," aligning with your gut. Defensible if agency/grasp are necessary (confidence: 7—least sure point; if AI adapts to novel errors, verdict may shift).  
  - **Tension Resolved**: Ruiz keeps knowledge (competence robust, grasp intact); Okafor keeps it (aid integrated); Checklist Trainee lacks it (prompts bypass agency).  

  ### Your New Cases  
  - **One-Demonstration Learner**: Performs perfectly first time after minimal instruction. *Did she know how before?*  
    AC: **No**. Prior competence? None. Robustness? Untested. Grasp? Not yet integrated. She *acquires* know-how rapidly, but didn’t possess it pre-demonstration (confidence: 9).  
  - **Expert with Inaccurate Self-Report**: Uses correct criteria unconsciously; stated criteria fail when tested.  
    AC: **Knows how**. Grasp is embodied (ii), manifested in doing (iv). Self-report irrelevant—many skills are tacit (e.g., catching arytenoid placement). Attributable to *her* competence (confidence: 10).  

  ### Empirical Flags  
  - **Amnesiac (4)**: Assumes procedural memory intact (e.g., hippocampal-independent pathways). If neuroscience falsifies this, your verdict might collapse—but current evidence supports it.  
  - **Dystonia (3)**: Assumes no cognitive decline. If condition impairs judgment, Ruiz’s knowledge might be questioned—but your case suggests only motor deficit.  
  - **System (9)**: Assumes no "understanding" in AI. If it generates novel solutions reflecting grasp of success (e.g., adapting to torn trachea), your gut might waver.  

  ### Final Principle & Confidence  
  **Attributable Competence (AC)** captures all your verdicts except possibly Maya (which it explains if recertification’s "situational range" includes real-world pressure). It repairs your tentative principle by:  
  - Explicitly decoupling *competence* from momentary *ability* (handling Ruiz),  
  - Requiring *integration* of aids (handling Okafor vs. Checklist Trainee),  
  - Demanding *agency* in success (handling Garrity).  
  **Confidence in AC**: 8/10. Least sure on AI (9), but your amnesiac case is safe—biological systems have a different kind of "grasp."  

  Your gut is coherent: knowledge-how is *agent-relative competence grounded in grasp of success*, not mere reliability or propositional recall. For recertification, this means judging whether the skill is *in them*, resiliently and attributably. That’s what your one-line justifications defend.
