prompt: |-
  I'm putting together the function week for a grad seminar in philosophy of biology this spring, and I realised I don't actually know what I'm asking of a theory of biological function. My students do this thing where someone produces a case — a heart that has never pumped and never will, the very first heart token, the heart's thumping noise, a liver that does forty things — and everyone treats the case as decisive for or against an account, and I have no principled way to say how much weight it should carry. So before we read any more of the literature I want the spec instead. Write me the desiderata: what any account of what it is for a trait or part to have a function has to deliver, with the case or consideration behind each requirement, and mark which are non-negotiable and which are just preferences of one camp. To keep it honest, fix the purpose: I want a function concept that can (a) underwrite a notion of malfunction or dysfunction that does real work for my colleague in philosophy of medicine, who needs to separate pathology from mere statistical atypicality, and (b) still carry the naturalistic load that theories of mental content lean on it for. If those two customers want different things from the concept, I want that said explicitly, with each desideratum tagged for which customer it comes from. And please route some of the requirements through cases I can use to break the usual rut, because the ones in the literature are over-rehearsed: a de novo designed protein dropped into a synthetic cell, whose only history is a lab selection protocol run by a robot; an enzyme produced by directed evolution where the selecting was done by an automated pipeline rather than by anything ecological; a trait in a digital organism in an artificial-life platform; a gene-drive construct engineered to crash a wild population, whose function seems to be something no organism ever benefited from; a transposable element that spread by selfish replication and is now doing regulatory work it was never selected for; and a holobiont or extended-phenotype case like a beaver dam or a termite mound, where it isn't clear whose history is supposed to matter. Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect, like the distinction between having a function and having that function well, or between a function and a useful side effect.

  The part I most want is the negative structure of the list: tell me which subset of the desiderata you think cannot be jointly satisfied, and say whether that's because the list is over-ambitious or because the concept is genuinely over-constrained (the origin-of-function problem plus the normativity requirement plus the explanatory-role requirement feel like they might not all fit together, but I want you to actually check rather than nod along). Tell me which single requirement excludes the most candidate theories, and which of the usual demands on a theory of function you think are prejudices dressed up as desiderata — the ones that just bake in an answer. A short scorecard at the end is fine: how the selected-effect/etiological account, the causal-role or systemic-capacity account, and some kind of pluralist or deflationary option do against your list, a few lines each. But keep the weight on the criteria and their motivating cases, since the criteria are where the thinking is and I can redo the scoring myself.

  And be explicit about where you're unsure. Give me the desideratum you'd abandon first if I pushed back on it, tell me what would actually change your mind — a case, an argument, a result from biology — and flag the step in your reasoning you think is most likely to be wrong, rather than presenting the list as if it dropped out of the sky fully justified.
reasoning: |-
  We are constructing a list of desiderata for a theory of biological function that must serve two purposes: (a) underwrite a robust notion of malfunction for philosophy of medicine, and (b) support naturalistic theories of mental content. We will also use novel cases to test the desiderata.

  The desiderata are split into:
  - What the theory must explain (essential explanatory duties)
  - What it must respect (conceptual distinctions that must be maintained)

  Each desideratum will be tagged with:
  - (M) for philosophy of medicine (malfunction focus)
  - (C) for mental content (naturalistic basis for representation)
  - (Both) if it serves both

  We mark as non-negotiable (NN) those that are essential for the core purpose, and as preferences (P) those that are camp-specific.

  We also note which desiderata are in tension and which are the most challenging.

  **Desiderata List:**

  1. **Normativity (Malfunction/Dysfunction) (M, NN)**  
     *Requirement:* The theory must allow that a trait can have a function and yet fail to perform it (i.e., be broken or dysfunctional).  
     *Case:* A human heart that is malformed and cannot pump blood (but is still a heart) has the function to pump blood even though it never has and never will.  
     *Why NN:* Essential for medicine to distinguish pathological states (e.g., a heart that doesn't pump) from mere statistical deviation (e.g., having six fingers).  
     *Challenge:* How to ground the norm (what it *should* do) in natural facts.

  2. **Explanatory Role for Trait Presence (C, NN)**  
     *Requirement:* The theory must explain why the trait is present (typically by reference to its function).  
     *Case:* The first heart token in evolutionary history: if we say it has the function to pump blood, we must explain how this function is fixed without a history of selection.  
     *Why NN:* For mental content, the function of a mental state must explain why it was selected and hence why it exists.  
     *Note:* This is central to etiological theories.

  3. **Current Causal Contribution (Both, P for some)**  
     *Requirement:* The theory should account for the current causal role of the trait in the system.  
     *Case:* A transposable element that initially spread by selfish replication but now has been co-opted to perform a regulatory role. We want to say that its current function is regulatory, not selfish replication.  
     *Why P:* Some theories (e.g., causal-role) make this central, but etiological theories may downplay it in favor of history.  
     *Tagged (Both):* Both customers need the function to relate to what the trait does now: medicine to assess current dysfunction, and content to ground current representational role.

  4. **Distinction Between Function and Accidental Effect (Both, NN)**  
     *Requirement:* The theory must distinguish between what a trait is *for* (its function) and what it merely does (side effects).  
     *Case:* The heart produces a thumping sound. The sound is not the function of the heart (though it can be used by doctors).  
     *Why NN:* Without this, medicine cannot separate pathological effects from mere side effects. For content, a representation must have a specific function (e.g., to indicate) and not every effect counts.

  5. **Multiple Functions (M, P)**  
     *Requirement:* The theory should allow that a single trait can have multiple functions.  
     *Case:* The liver performs detoxification, protein synthesis, storage, etc.  
     *Why P:* Medicine needs to account for multi-functional organs and the possibility of one function being impaired while others are intact.  
     *Note:* This is a preference because some theories (e.g., simple etiological) might have trouble with multiple functions if they rely on a single selective history.

  6. **Novel Traits and Artifacts (C, NN?)**  
     *Requirement:* The theory must assign functions to traits that have no natural history, such as engineered traits.  
     *Cases:* 
       - A de novo designed protein in a synthetic cell, selected by a robot in a lab.
       - An enzyme produced by directed evolution via an automated pipeline (no ecology).
       - A gene-drive construct designed to crash a wild population (which never benefited any organism and is not naturally selected).
     *Why NN for (C)?* Mental content theories often extend to artifacts (e.g., in teleosemantics of devices). But note: medicine may not require this (unless we include medical devices).  
     *Tagged (C):* Primarily for mental content, which must account for designed representations (e.g., in AI).  
     *Note:* This is a challenge for etiological theories that rely on natural selection.

  7. **Non-Biological and Digital Cases (C, P)**  
     *Requirement:* The theory should extend to digital organisms in artificial life or other non-biological systems to which we ascribe functions.  
     *Case:* A trait in a digital organism that is evolved in an artificial-life platform.  
     *Why P:* Mental content theories may want to cover AI or computational systems. Medicine may not need this.

  8. **Selfish Elements and Co-option (Both, NN)**  
     *Requirement:* The theory must handle cases where a trait's evolutionary origin is unrelated to its current maintenance.  
     *Case:* A transposable element that spread by selfish replication but now does regulatory work that benefits the organism and is maintained by selection for that regulatory role.  
     *Why NN:* Both customers need to assign the current function (regulatory) even if the origin was selfish.  
     *Note:* This challenges pure etiological accounts that tie function to the reason for origin.

  9. **Extended Phenotype and Holobionts (Both, P)**  
     *Requirement:* The theory should assign functions to traits that are not part of an individual organism's body but are produced by it and play a functional role.  
     *Case:* A beaver dam or a termite mound. Whose history matters? The beaver's or the dam's?  
     *Why P:* These cases are increasingly important in biology and may be relevant to medicine (e.g., microbiome) and content (extended cognition).  
     *Note:* This blurs the boundaries of the organism.

  10. **Function Without Benefit (C, P)**  
      *Requirement:* The theory should assign functions to traits that do not benefit the organism (or even harm it) but are selected for other reasons.  
      *Case:* The gene-drive construct: it is designed to spread and crash a population. It does not benefit the organism but is meant to harm the population.  
      *Why P:* Mental content might need to account for malicious design or harmful representations. Medicine might see this as a pathology.

  11. **Distinction Between Having a Function and Performing It Well (Both, NN)**  
      *Requirement:* The theory must respect that a trait can have a function and yet perform it poorly (malfunction) or well.  
      *Case:* A heart that pumps blood inefficiently still has the function to pump blood.  
      *Why NN:* This is the core of the normativity required by medicine and also for content (a broken representation still has the function to represent).

  12. **Avoiding Anthropocentrism (Both, NN)**  
      *Requirement:* The theory must not rely on human intentions or perspectives to assign functions.  
      *Case:* The function of a trait should be fixed by biological facts, not by what we humans find interesting.  
      *Why NN:* Both customers require naturalism.

  **Tensions and Incompatibilities:**

  - **Normativity (1) and Naturalism (12):** How to ground norms in nature? This is the core challenge.
  - **Explanatory Role (2) and Novel Traits (6):** Etiological theories (which require history) struggle with novel traits that have no history (like the de novo protein). But if we drop history, how do we explain presence?
  - **Explanatory Role (2) and Co-option (8):** If the current function is regulatory (in the transposable element case), but the trait was originally selected for selfish reasons, then the reason for current presence (maintenance) is the regulatory role, not the selfish one. So etiological theories that focus on original selection get this wrong. But if we focus on current maintenance, then the theory must account for the current selection pressure.

  **Which desiderata cannot be jointly satisfied?**  
  The biggest tension is between:  
  - **Normativity (1)** and **Explanatory Role (2)** (both NN) and the **Novel Traits (6)** (NN for C).  
  Etiological theories satisfy 1, 2, and 4 but fail at 6 and 8.  
  Causal-role theories satisfy 3, 4, 5, 6, 8 but fail at 1 (normativity) and 2 (explanatory role).  

  Thus, the normativity requirement (1) and the explanatory role requirement (2) together push for an etiological theory, but then the novel traits (6) and co-option (8) cases become problematic.

  **The Single Most Excluding Requirement:**  
  **Normativity (1)** excludes causal-role theories because without history, there is no basis for saying what the trait *should* do.  
  **Explanatory Role (2)** excludes causal-role theories because they do not explain why the trait is present.  
  **Novel Traits (6)** excludes standard etiological theories because they require a history of natural selection.

  **Prejudices Dressed as Desiderata:**  
  - **Original Selection as Necessary:** This is an etiological prejudice. Cases of co-option (8) show that current maintenance can override original function.  
  - **Current Contribution as Sufficient:** This is a causal-role prejudice. It fails to account for normativity (malfunction) and the function/accident distinction.

  **Desideratum I'd Abandon First:**  
  **Non-Biological and Digital Cases (7)**. If pushed, we might say that the theory is only for biological systems. This would relieve pressure on the theory to cover AI, which might be handled by a separate account.

  **What Would Change My Mind?**  
  - If a case emerged where a trait clearly had a function but had no history (even artificial) and no current causal role in a system, that would challenge the necessity of both history and current role.  
  - If biology showed that the function of a trait is always and only fixed by its very first appearance, then co-option cases (8) would be less pressing.  
  - If medicine could do without normativity (e.g., by using statistical norms only) then (1) would be less critical.

  **Most Likely Wrong Step in Reasoning:**  
  Assuming that the same concept of function must serve both medicine and mental content. Perhaps we need a pluralist theory that uses one concept for normativity (etiological) in medicine and another for novel traits (causal-role) in artifacts. But then how to unify mental content?

  **Scorecard of Major Theories:**

  - **Etiological (Selected-Effect) Theory:**  
    - Pros: Explains normativity (1), explanatory role for presence (2), function/accident distinction (4), and malfunction (11).  
    - Cons: Fails on novel traits (6), digital cases (7), gene-drive (10) without extending to artificial selection, and co-option (8) if it relies on original function.  
    - Verdict: Good for medicine, bad for mental content if it includes artifacts.

  - **Causal-Role (Systemic-Capacity) Theory:**  
    - Pros: Handles current causal role (3), multiple functions (5), novel traits (6), digital cases (7), co-option (8) (if current role is what matters), and extended phenotype (9).  
    - Cons: Fails normativity (1) and explanatory role (2). Also, struggles with function/accident distinction (4) because any effect might be called a function.  
    - Verdict: Good for mental content in artificial systems, bad for medicine.

  - **Pluralist or Hybrid Theory:**  
    - Idea: Use etiological for natural biological traits and causal-role for novel/designed traits? Or use a theory that combines history and current role.  
    - Pros: Can satisfy all desiderata by having two concepts.  
    - Cons: May lack unity. Also, for mental content, we need a unified account if we want naturalistic representation to cover both biological and artificial systems.  
    - Verdict: The most promising but needs careful handling.

  **Conclusion:**  
  The desiderata pull in different directions. The core tension is between the normativity and explanatory role (which require history) and the need to assign functions to novel and artificial traits (which lack the relevant history). A hybrid theory that uses a generalized notion of selection (including artificial and current maintenance) might work. But note that medicine requires normativity, which is hard without some history. For the seminar, focus on which cases are non-negotiable and which can be compromised.
answer: |-
  Below is a comprehensive list of desiderata for a theory of biological function, tailored to your requirements. The list is structured around what a theory **must explain** (core explanatory duties) and what it **must respect** (conceptual distinctions). Each desideratum is grounded in a case or consideration, tagged for its primary customer—philosophy of medicine (M) or mental content (C)—and marked as non-negotiable (NN) or preference (P). Novel cases (e.g., synthetic biology, digital organisms) are used to break from over-rehearsed literature examples. I also address tensions, trade-offs, and a negative structure (which desiderata conflict, which are over-constrained, etc.), and conclude with a scorecard of major theories.

  I’ll be explicit about uncertainties: The most likely point of failure is the **tension between normativity and novel traits** (Desiderata 1 vs. 6). I’d abandon **digital/non-biological extension** (Desideratum 7) first if pushed, as it’s least critical to your core customers. A case that would change my mind: If biologists consistently ascribe "malfunction" to a trait with no history (e.g., a defective de novo protein), that would undermine etiological approaches and favor causal-role or pluralist solutions.

  ---

  ### **I. What a Theory Must Explain**  
  *These are non-negotiable (NN) for a theory to be adequate.*

  1. **Normative Malfunction (M, NN)**  
     - **Requirement**: Explain how a trait can *fail* at its function, distinguishing pathology from statistical rarity.  
     - **Case**: A congenitally malformed heart that cannot pump blood (and never will). Medicine requires that this is dysfunctional, not just atypical. A theory must ground the "should" (it *ought* to pump) in natural facts.  
     - **Why NN?** Essential for medicine; mere statistical deviation (e.g., polydactyly) isn’t inherently pathological.  
     - **Tension**: Conflicts with ahistorical approaches (e.g., causal-role) that lack normative grounding.

  2. **Trait Presence Explanation (C, NN)**  
     - **Requirement**: Explain why the trait exists (e.g., via selective history or current maintenance), linking function to etiology.  
     - **Case**: The very first heart token in evolutionary history. If it has a function (pumping), what explains its presence without prior selection? Mental content theories need this to fix representational content (e.g., why a neural state "means" food).  
     - **Why NN?** Mental content relies on functional explanations for why a trait was selected/stabilized.  
     - **Tension**: Challenges causal-role accounts (which focus on current effects, not origins).

  3. **Function vs. Accidental Effect (Both, NN)**  
     - **Requirement**: Explain why some effects of a trait are functional (e.g., pumping) while others are mere side effects (e.g., heart sounds).  
     - **Case**: A liver detoxifies (function) but also displaces other organs (side effect). Medicine needs this to identify targets for intervention; mental content needs it to isolate "proper" content-fixing effects.  
     - **Why NN?** Without this, medicine conflates pathology with benign quirks, and mental content overgenerates representations.  
     - **Novel Case**: A gene-drive construct (Desideratum 6) crashes populations (intended function) but also alters ecosystem chemistry (side effect).

  4. **Current Causal Contribution in System (Both, NN)**  
     - **Requirement**: Explain how the trait’s *current* causal role contributes to system capacities (e.g., organism fitness).  
     - **Case**: A transposable element initially spread via selfish replication but now regulates development. Its *current* function (regulation) maintains the organism, not its origin.  
     - **Why NN?** Medicine treats dysfunction based on current failure (e.g., a heart that *now* doesn’t pump); mental content ties content to current systemic role.  
     - **Tension**: Etiological accounts may overemphasize history at the expense of current role.

  ---

  ### **II. What a Theory Must Respect**  
  *These are conceptual distinctions; violating them invalidates a theory. Most are NN, but some are P due to camp-specific emphasis.*

  5. **Malfunction vs. Total Absence of Function (M, NN)**  
     - **Requirement**: Respect that malfunction presupposes a function (e.g., a broken pump) whereas some traits lack functions entirely (e.g., junk DNA without effects).  
     - **Case**: A vestigial appendix vs. a diseased appendix. Medicine must distinguish "harmful but functional" from "non-functional."  
     - **Why NN?** Medicine requires pathology to involve functional failure, not mere uselessness.

  6. **Novel/Engineered Traits Without Natural History (C, NN)**  
     - **Requirement**: Assign functions to traits lacking evolutionary history, based on design or artificial selection.  
     - **Cases**:  
       - A *de novo* protein designed computationally and inserted into a synthetic cell, selected by a robot for stability.  
       - An enzyme from directed evolution (automated pipeline, no ecology).  
       - A gene-drive construct engineered to crash a population (no organism benefits).  
     - **Why NN?** Mental content extends to artifacts (e.g., AI); excluding these cases undermines naturalism in content theories.  
     - **Tension**: Etiological accounts (focused on natural selection) struggle here.

  7. **Non-Biological/Digital Extension (C, P)**  
     - **Requirement**: Assign functions in non-biological systems (e.g., digital organisms) to support broad naturalism.  
     - **Case**: A trait in an Avida digital organism that evolves to optimize energy use.  
     - **Why P?** Mental content may need this for computationalism, but medicine can ignore it.  
     - **Trade-off**: Low priority; abandon first if needed.

  8. **Selfish Elements and Co-option (Both, NN)**  
     - **Requirement**: Assign functions based on current maintenance, not just origin, when traits are co-opted.  
     - **Case**: A transposable element spread selfishly but is now maintained by selection for regulatory work. Its function is regulatory, not selfish replication.  
     - **Why NN?** Medicine and content both care about current role (e.g., treating a co-opted element’s dysfunction).  
     - **Tension**: Pure etiological accounts may misassign functions based on origin alone.

  9. **Multiple Realized Functions (M, P)**  
     - **Requirement**: Allow a single trait to have multiple functions without reducing to "one true function."  
     - **Case**: The liver detoxifies, stores glycogen, and produces bile. Medicine must handle cases where one function fails (e.g., detoxification) but others persist.  
     - **Why P?** Medicine emphasizes clinical specificity, but some theories (e.g., simple etiological) can handle this with plural histories.

  10. **Extended Phenotype/Holobionts (Both, P)**  
      - **Requirement**: Assign functions to traits beyond organism boundaries (e.g., beaver dams) without privileging individual organism history.  
      - **Case**: A termite mound regulates temperature. Whose history matters? The mound’s, the termites’, or the colony’s?  
      - **Why P?** Increasingly relevant in biology (e.g., microbiome), but medicine and content can often reframe internally.

  11. **Function Without Benefit (C, P)**  
      - **Requirement**: Assign functions that harm the organism or population, if selected/designed for that effect.  
      - **Case**: A gene-drive construct that spreads to crash a population (function: reduce population size). No organism benefits, but the function is clear.  
      - **Why P?** Mental content must handle "designed harm" (e.g., malware in AI), but medicine may view this as pathology.

  12. **Non-Anthropocentric Grounding (Both, NN)**  
      - **Requirement**: Ground functions in objective biological facts, not human interests.  
      - **Case**: A trait’s function should not depend on whether humans value it (e.g., disease resistance vs. aesthetic feathers).  
      - **Why NN?** Both customers require naturalism; human-dependent functions collapse into instrumentalism.

  ---

  ### **III. Negative Structure: Tensions, Trade-offs, and Exclusion**  
  *Which desiderata conflict? Which are over-constrained? Which exclude theories?*

  - **Core Tension: Normativity vs. Novelty**  
    - **Desideratum 1 (Normative Malfunction)** and **Desideratum 6 (Novel Traits)** conflict. Normativity requires history (to ground "should"), but novel traits lack history.  
      - *Why?* Medicine (M) needs history for norms (e.g., a heart *should* pump because ancestors’ hearts did). Mental content (C) needs novelty for artifacts (e.g., a de novo protein *should* fold).  
      - **Result**: Likely over-constrained. No theory fully satisfies both without compromise (e.g., extending "history" to artificial selection).  
    - **Desideratum 2 (Trait Presence)** exacerbates this: It demands etiology, excluding ahistorical accounts from mental content’s artifact cases.

  - **Most Excluding Desideratum**  
    - **Desideratum 1 (Normative Malfunction)** excludes causal-role theories (e.g., Cummins). Without history, they cannot ground "malfunction" (e.g., a causal-role account might say a non-pumping heart is just "different," not dysfunctional).  
    - **Desideratum 6 (Novel Traits)** excludes standard etiological theories (e.g., Millikan, Neander). They cannot ascribe functions to de novo traits without natural selection history.

  - **Prejudices Dressed as Desiderata**  
    - **"Functions Must Be Selected Effects"**: This etiological prejudice ignores co-option (Desideratum 8) and novelty (Desideratum 6).  
    - **"Functions Require Current Benefit"**: This neglects selfish/gene-drive cases (Desideratum 11) where functions harm.  
    - **"Functions Imply Organism-Level Adaptation"**: This excludes extended phenotypes (Desideratum 10) and selfish elements.

  - **Desideratum to Abandon First**  
    - **Desideratum 7 (Digital/Non-Biological Extension)**. It’s a preference (P) for mental content, but medicine doesn’t need it. If dropped, theories can focus on biological systems without losing core customers.

  - **What Would Change My Mind?**  
    - If a **novel trait case** (e.g., a defective de novo protein) is universally called "dysfunctional" by biologists *without any history*, normativity (Desideratum 1) must be ahistorical, favoring causal-role theories.  
    - If **co-option cases** (e.g., transposable elements) show that original function *always* overrides current maintenance, etiological theories gain ground at the expense of Desideratum 8.  
    - **Most Likely Error in Reasoning**: Assuming normativity *must* come from history. If current system capacities (e.g., homeostasis) can ground "should," causal-role theories might satisfy Desideratum 1.

  ---

  ### **IV. Scorecard of Major Theories**  
  *Assessed against the desiderata (1–12). Key: ✓ = Satisfies, ✗ = Fails, ~ = Partial.*

  | **Theory**               | **Strengths**                                  | **Weaknesses**                                  | **Verdict**                                     |
  |--------------------------|-----------------------------------------------|-----------------------------------------------|------------------------------------------------|
  | **Etiological (e.g., Millikan, Neander)** | ✓ Normative malfunction (1)<br>✓ Trait presence (2)<br>✓ Function vs. accident (3)<br>✓ Non-anthropocentric (12) | ✗ Novel traits (6)<br>✗ Digital cases (7)<br>~ Selfish/co-option (8)*<br>✗ Gene-drive harm (11) | Best for **medicine** (robust normativity), but fails mental content’s novelty/digital cases. *Co-option handled poorly if original function is prioritized. |
  | **Causal-Role (e.g., Cummins)** | ✓ Novel traits (6)<br>✓ Digital cases (7)<br>✓ Multiple functions (9)<br>✓ Extended phenotypes (10) | ✗ Normative malfunction (1)<br>✗ Trait presence (2)<br>~ Function vs. accident (3)**<br>✗ Non-beneficial functions (11) | Best for **mental content** (flexibility for artifacts), but useless for medicine (no normativity). **Struggles to distinguish function from side effects. |
  | **Pluralist/Deflationary (e.g., Griffiths, Godfrey-Smith)** | ~ All desiderata via context-sensitive rules | No unified account; may feel ad hoc | Only approach that *might* satisfy both customers, but risks being unprincipled. E.g., use etiology for medicine, causal-role for artifacts. |

  **Key Trade-off**: Etiological theories excel at normativity and explanation (medicine’s needs) but fail novelty and flexibility (content’s needs). Causal-role theories do the inverse. Pluralism is promising but may not unify the concept.

  ---

  ### **Summary for Your Seminar**  
  - **Start with the desiderata**: Use the cases (e.g., gene-drive, de novo protein) to test theories *before* literature deep-dives. Ask students: "Which desideratum does this case challenge? Which customer is affected?"  
  - **Highlight Tensions**: The normativity/novelty conflict (1 vs. 6) is the crux. If students treat cases as decisive, ask: "Is this case relevant to medicine, content, or both? Does it challenge a core desideratum or a preference?"  
  - **Break Ruts**: Use selfish elements, holobionts, and synthetic cases to move beyond hearts and livers.  
  - **Core Insight**: No theory aces all desiderata because medicine and content pull in opposite directions. Medicine needs history-based normativity; content needs flexibility for novelty. A pluralist or hybrid (e.g., "generalized selection" including artificial contexts) may be the least bad option.  

  If you revise the desiderata (e.g., drop digital cases), etiological theories become more viable for your dual purpose. But as stands, the list reveals why function debates persist: The concept is over-constrained by competing demands.
