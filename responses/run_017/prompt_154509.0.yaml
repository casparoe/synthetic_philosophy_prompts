prompt: |-
  Hi there — I need some help, if you've got a minute. I help run a small rationality-meetup thing in the back room of a pub in Bristol, mostly software people plus a couple of friends of friends from the university, and I've stupidly agreed to give the talk next month — twenty-five minutes and then questions. I'm not an academic at all, I work in IT procurement and got into all this a few years ago after falling down a rabbithole about the prisoner's dilemma, so I know enough to get myself into trouble but not enough to get out of it. It's the questions bit I'm dreading.

  The talk is my own attempt to fix a thing that's always bothered me about Hofstadter's superrationality idea — you know, the thought that if you're in a one-shot prisoner's dilemma with someone who reasons the way you do, your two decisions aren't really independent, so you should just pick the move you'd want the whole class of similar reasoners to make, and cooperate. My complaint is that nobody in real life is ever an exact copy of anyone, so I've built a version where the mirroring is a matter of degree. I call it the mirror coefficient: a number m between 0 and 1 for how likely it is that whatever you decide, the other person's reasoning lands on the same decision. Then you just do the sums — if I defect I get the mutual-defection payoff whatever happens (they either mirror me into defecting, or they're an independent stranger who defects anyway), so that's 1; if I cooperate I get 3 if they mirror me and 0 if they don't, so 3m. Which means cooperation only pays once m is above about a third, and below that you should defect like a normal person. I like that it turns superrationality into a threshold instead of a club you're either in or not, but I've noticed that the temptation payoff of 5 drops out of the maths entirely, which feels like it shouldn't happen, and the last five minutes where I try to say how you'd actually *estimate* m in practice — shared culture, shared training, whether you'd both read the same blogs — is where I think the whole arguement is most exposed.

  The room'll be maybe thirty people, and it's a mixed bunch: a good few software engineers who've read the rationalist blogs and are very into functional decision theory (the "decide as if you're choosing the output of the algorithm you're running" line) and will want to know what my rule says when the other person's algorithm is only partly related to mine; two or three economics/game-theory PhD students who think all of this was settled decades ago and that defecting in a one-shot game is just what rationality requires, and who will want it in their vocabulary — equilibrium, dominance, what the correlating device is supposed to be; and one older moral philosopher who is broadly sympathetic to the thought that rationality might permit you to dispose yourself to cooperate with other cooperators, but who thinks no amount of decision theory will get you there on its own. Plus a handful of people who'll ask friendly and completely unanswerable questions about climate change.

  So could you write me a Q&A prep sheet for that specific room, not the one I'd get from a decision-theory forum? Eight or so objections, in the rough order they'll come and also ordered by how much damage they'd do to me, each one phrased the way that person would actually say it out loud (with a plain-English gloss in brackets so I don't stand there nodding at words I don't know). For each: a reply I could give in about a minute, an honest note on where my reply is weakest, and a flag for what I should just concede up front in the talk itself rather than get caught out on, versus what I should dig my heels in on. And please include the question I'm secretly hoping nobody asks — I keep thinking it's either "what if we each have a different estimate of how similar we are to each other?" or "doesn't your rule just give everyone an incentive to make themselves weird and impossible to simulate?", but tell me what you think it actually is. Maybe also say which one I should take first if three hands go up at once, and whether there's anything in my mirror-coefficient setup that a game theorist will spot within about four seconds and that I should fix before I stand up.
reasoning: |-
  Okay, the user is running a rationality meetup in Bristol and has to give a talk on their modification of Hofstadter's superrationality concept. They've introduced a "mirror coefficient" (m) to address the issue that people aren't exact copies. Their main worry is the Q&A session with a diverse audience: software engineers into functional decision theory, game theory PhDs, a moral philosopher, and others.

  First, I need to understand their framework. They set up the payoffs so that defecting always gives 1, while cooperating gives 3m. Cooperation is better when m > 1/3. The temptation payoff (5) isn't in the calculation, which feels odd. Also, estimating m in practice is tricky.

  The audience breakdown is crucial. The software folks will care about algorithmic similarities. The game theorists will focus on equilibrium and dominance. The philosopher might question if decision theory alone can justify cooperation. Then there are the climate change questions, which might derail the talk.

  The user wants a Q&A prep sheet: 8 objections in the order they might come, phrased as each group would ask. Each needs a reply, weak points, and what to concede upfront. Plus, the question they fear most.

  I need to prioritize the most damaging questions first. Probably the game theorists' objections about dominance and equilibrium, as they could undermine the core model. Then the software engineers on functional decision theory. The moral philosopher comes later since their point is more about justification than the math.

  Key issues with the model:
  1. The absence of the temptation payoff (5) might be a red flag. Game theorists will notice immediately. The user needs to address why it's not in the calculation. Maybe because when you defect, the other either mirrors (so mutual defection) or doesn't mirror but still defects? But then why isn't the payoff different? The user's setup assumes that defecting always results in mutual defection, which omits the case where the other cooperates (temptation payoff). That's a problem. The user should concede this and adjust the payoff structure. Advise them to fix the model: when you defect, if the other doesn't mirror, they might cooperate, giving you 5. So defection's expected payoff is 5(1-m) + 1(m). Cooperation is 3m + 0(1-m). Then set 3m > 5(1-m) + m to find when cooperation is better. Solve: 3m > 5 - 5m + m → 3m > 5 - 4m → 7m > 5 → m > 5/7. That changes the threshold significantly. The user must address this preemptively.

  2. The estimation of m is vague. The user mentions shared culture, training, blogs. But how quantifiable is that? The software engineers might ask about differing estimates of m. If Alice thinks m is high but Bob thinks it's low, they might miscoordinate. The user needs to admit that m is subjective and hard to measure.

  3. The "secretly hoping nobody asks" question: Probably about differing m estimates or incentives to be unpredictable. But the real killer might be why the model assumes that non-mirroring implies defection. That ties into point 1. Alternatively, a game theorist asking about correlated equilibrium—since the mirror coefficient acts as a correlating device. The user should mention that m introduces correlation, which is a known concept. Concede that it's similar but frame it as a practical extension.

  Order of questions:
  1. Game theorist on dominance: "Your rule can't override dominant strategies..." This is fundamental. Reply: Dominance assumes independence; m introduces correlation. Weakness: Still, defecting is dominant if others' actions are independent. Concede that without correlation, defection is rational.

  2. Software engineer on algorithmic similarity: How to handle partial overlaps in decision algorithms. Reply: m aggregates those factors. Weakness: It's vague. Admit it's a simplification.

  3. Moral philosopher: Can decision theory alone justify cooperation? Reply: It's about consistent reasoning, not morality. Weakness: Still relies on valuing mutual cooperation.

  4. Estimation of m: How to measure in real life? Reply: Use proxies like shared backgrounds. Weakness: Subjective and error-prone.

  5. Climate change analogy: Might be a distraction. Redirect to the model's scope.

  6. Different m estimates: Alice and Bob's m might differ. Reply: Use minimum or communicate. Weakness: Not always feasible.

  7. Incentive to be unpredictable: If being hard to mirror lowers others' m, you might defect more. Reply: Long-term costs. Weakness: Short-term gains.

  8. Temptation payoff omission: Why isn't 5 in the calculation? This is critical. User must fix this before the talk. Advise recalculating with corrected payoffs.

  Pre-talk fixes: Correct the payoff structure. Mention that the original omission was a simplification, now updated. Define m clearly as the probability of correlated cooperation.

  The worst question is the payoff structure error. Game theorists will spot it immediately. User should address it upfront during the talk to avoid being caught later.
answer: |-
  Below is a targeted Q&A prep sheet for your talk, designed for your specific Bristol pub audience. I've structured it around 8 likely objections, ordered by both sequence (who'll jump in first) and potential damage (high-damage questions first, as they'll set the tone). Each includes the objection phrased authentically, a concise reply, weaknesses in your reply, and concession/dig-in flags. I've also included the "secretly hoping nobody asks" question, pre-talk fixes, and tactical advice at the end.

  ### **Pre-Talk Critical Fix: The Payoff Omission**
  **The Game Theorist's 4-Second Spot:**  
  Your current payoff math ignores the **temptation payoff (5)** when you defect *and the other cooperates*. This is a glaring error. In your setup, if you defect:  
  - With probability \(m\), they mirror → mutual defection (payoff 1).  
  - With probability \(1-m\), they *don’t* mirror → they could still cooperate or defect independently. You assume they defect here (payoff 1), but if they cooperate, you get 5.  

  **Fix Before You Stand Up:**  
  Revise your expected payoffs:  
  - **Defect:** \(m \times 1 + (1-m) \times \text{[payoff if they cooperate OR defect]}\).  
    *Better:* Assume non-mirroring players defect by default (as strangers), but this is weak. *Stronger:* Admit non-mirroring could go either way, but for simplicity, use:  
    \[
    \text{Defect: } m \cdot 1 + (1-m) \cdot 5 \quad (\text{worst-case independence})
    \]  
    \[
    \text{Cooperate: } m \cdot 3 + (1-m) \cdot 0
    \]  
    Then cooperation beats defection when \(3m > 5(1-m) + m\) → \(3m > 5 - 4m\) → \(m > 5/7 \approx 0.71\).  
  **Concede This Upfront:** In your talk, say: *"My initial simplification ignored the temptation payoff—thanks to game theorists here, I’ve corrected it. Now cooperation requires m > 5/7, which is stricter but more defensible."* This shows humility and shuts down low-effort attacks.

  ---

  ### **Q&A Prep: 8 Objections**  
  **Tactical Note:** Take questions in this order if hands shoot up: Game theorist → Software engineer → Moral philosopher → Others. Game theorists will dominate early; software folks interrupt if jargon is loose; philosophers wait but land heavy punches.  

  1. **Objection (Game Theory PhD, Damage: High)**  
     *"Your whole setup ignores dominance. Defecting dominates cooperating because it’s better no matter what the other does—even with your ‘m’ thing, if the other doesn’t mirror me, I still get 5 by defecting or 0 by cooperating. Rationality requires dominance, period."*  
     **Reply (≈60 sec):** "Dominance assumes decisions are independent—but m explicitly quantifies *dependence*. If m>0, our actions aren’t independent; they’re correlated. Game theory handles this with correlated equilibrium (like traffic lights correlating drivers). Here, m *is* the correlating device. When m is high, defecting isn’t safer—it triggers mutual defection via mirroring."  
     **Weakness:** Dominance is foundational. If they retort *"But you can’t control their dependence!"*, you’re on thin ice.  
     **Concede/Dig In:** **Concede** that in strictly independent games, dominance rules. **Dig in** that high-m scenarios break independence, making dominance inapplicable.  

  2. **Objection (Software Engineer, Damage: High)**  
     *"This feels underspecified for functional decision theory. What if our algorithms are *partially* overlapping? Say I’m running an FDT agent that simulates you, but you’re a causal decision theorist—how does m handle that?"*  
     **Reply (≈60 sec):** "Great point—m aggregates those overlaps. If your FDT agent simulates their CDT logic, m is your confidence that the simulation outputs the same decision. Think of m as a similarity score between decision algorithms. Low m? Treat them as a black box. High m? You’re in a ‘shared algorithm’ regime where superrationality kicks in."  
     **Weakness:** FDT purists will note m doesn’t specify *how* to simulate the other agent (e.g., do you need mutual knowledge of similarity?).  
     **Concede/Dig In:** **Concede** m is a heuristic, not a rigorous FDT extension. **Dig in** that it’s a practical bridge between FDT and real-world ambiguity.  

  3. **Objection (Moral Philosopher, Damage: Medium)**  
     *"You’re smuggling in morality through the back door. Rationality alone can’t tell you to value mutual cooperation—it’s a preference. If I’m selfish, I defect unless I fear punishment. Your ‘m’ just hides this."*  
     **Reply (≈60 sec):** "I’m not arguing for morality—I’m saying rationality *conditional on shared reasoning* can favor cooperation. If we both reason identically, choosing ‘cooperate’ isn’t moral; it’s the only consistent outcome. m generalizes this: when reasoning is aligned, mutual cooperation becomes the rational Nash equilibrium."  
     **Weakness:** They’ll counter that consistency ≠ rationality (e.g., two identical selfish agents still defect).  
     **Concede/Dig In:** **Concede** rationality requires self-interest. **Dig in** that shared reasoning *creates* a self-interested incentive for cooperation when m is high.  

  4. **Objection (Game Theory PhD, Damage: Medium)**  
     *"Where’s the equilibrium here? If I know their m is low, I defect. But then they defect too, so why would anyone ever cooperate?"*  
     **Reply (≈60 sec):** "Equilibrium depends on common knowledge of m. If we *both* know m>5/7, and we both know we know, cooperation is stable. If not, we default to defect. It’s like a coordination game—m is our signal."  
     **Weakness:** In one-shot games, common knowledge is unrealistic.  
     **Concede/Dig In:** **Concede** this works best with pre-play signaling (e.g., culture as a signal). **Dig in** that real-world actors *do* estimate shared context pre-game.  

  5. **Objection (Friendly but Unanswerable, Damage: Low)**  
     *"Can’t we apply this to climate change? Countries are like players with different m values—shouldn’t we focus on boosting cultural similarity?"*  
     **Reply (≈45 sec):** "Interesting! But climate change is iterated, not one-shot, and packed with real-world complexities like trust and enforcement. My model is a toy for clean dilemmas. Still, the core idea—shared ‘reasoning culture’ enabling cooperation—might inspire policy."  
     **Weakness:** They’ll want a concrete answer; you have none.  
     **Concede/Dig In:** **Concede** this isn’t a policy tool. **Dig in** that it highlights why cultural alignment matters.  

  6. **Objection (Software Engineer, Damage: Medium)**  
     *"What if Alice thinks m=0.8 but Bob thinks m=0.6? Alice cooperates, Bob defects—Alice gets screwed. How does your system handle that?"*  
     **Reply (≈60 sec):** "That’s a real risk! m is subjective, so we need a shared estimate. In practice, use conservatism: cooperate only if you’re confident *they* also see m>5/7. Or better, use public signals—like both attending this meetup—to align estimates."  
     **Weakness:** Doesn’t solve the problem; just restates it.  
     **Concede/Dig In:** **Concede** asymmetric m causes failures. **Dig in** that this mirrors real misalignments (e.g., startups misreading investors).  

  7. **Objection (Game Theory PhD, Damage: Low)**  
     *"Isn’t this just correlated equilibrium with extra steps? You’ve invented a fancy ‘m’ to rediscover that correlation allows cooperation."*  
     **Reply (≈45 sec):** "Partly! But correlated equilibrium assumes an external device (like a coin flip). m is *endogenous*—it comes from our internal similarity. This makes it testable: we can measure how culture/training affects m and cooperation rates."  
     **Weakness:** Game theorists will see this as a minor tweak, not a breakthrough.  
     **Concede/Dig In:** **Concede** the resemblance. **Dig in** that m offers a quantifiable, real-world lever.  

  8. **Objection (Moral Philosopher, Damage: Low)**  
     *"Even with high m, isn’t cooperation just a self-fulfilling prophecy? If we both believe we’re similar, we cooperate—but that’s psychology, not decision theory."*  
     **Reply (≈60 sec):** "It’s both! Decision theory operates on beliefs. If my belief in m is rational (e.g., based on evidence), then cooperating *is* decision-theoretic. The ‘prophecy’ is just rational coordination under uncertainty."  
     **Weakness:** Blurs epistemology (what justifies belief in m?) and decision theory.  
     **Concede/Dig In:** **Concede** beliefs can be wrong. **Dig in** that rational acts depend on best-available beliefs.  

  ---

  ### **The "Secretly Hoping Nobody Asks" Question**  
  **The Real Killer:**  
  *"Why assume non-mirroring players defect by default? If we’re similar but not identical, why wouldn’t they cooperate sometimes anyway? You’ve made defection the fallback, which rigs the model."*  

  **Why It’s Devastating:**  
  It exposes your payoff fix as arbitrary. If non-mirroring players cooperate with probability \(p\), your defection payoff becomes \(m \cdot 1 + (1-m)(p \cdot 5 + (1-p) \cdot 1)\). Suddenly \(p\) matters as much as \(m\), making your threshold messy and subjective.  

  **Reply to Keep Ready:**  
  "Weakness acknowledged—I simplified for clarity. In practice, estimate \(p\) from context (e.g., strangers in this pub might cooperate 20% of the time). But the core insight holds: high m reduces reliance on guessing \(p\)."  

  **Damage Control:** If asked, admit this upfront: *"Yes, non-mirroring behavior is ambiguous—I’ve assumed defection, but real cases need calibration."*  

  ---

  ### **Tactical Summary**  
  - **First Question Triage:** Take the game theorist (dominance) first—it’s high-risk but foundational. If multiple hands, sequence: 1. Game theorist → 2. Software engineer → 3. Moral philosopher.  
  - **Pre-Talk Adjustments:** Fix the payoff math (as above) and define m as *"the probability that their decision correlates with yours due to shared reasoning, not direct causation."*  
  - **Delivery Tips:**  
    - Start Q&A by *thanking* the game theorist who corrected your payoffs—it disarms critics.  
    - For software folks, use "algorithm similarity" not "mirroring"; for philosophers, say "consistent reasoning" not "superrationality."  
    - When stuck: *"That’s a great point—I’d love to discuss it over a pint later!"*  

  You’ve got a clever idea that bridges theory and practicality. Your vulnerability is rigor, but your strength is real-world applicability. Lean into that—Bristol isn’t a seminar hall. Good luck!
