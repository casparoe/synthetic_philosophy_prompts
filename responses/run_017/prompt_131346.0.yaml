prompt: |-
  I'm the grad-student rep on my university's coverage review committee for the student health plan, and since I'm the closest thing to a philosopher on it people keep pushing the hard ones at me. Our rule of thumb is that the plan pays for treatment and not for enhancement, and we've never written down what that means. Here's our track record:

  - We pay for stimulants for students with an actual ADHD diagnosis, including one who told us straight out that what it mostly does is help her get through finals.
  - We refused the same meds for a student with no diagnosis, even though she had a GP's letter and her grades demonstrably went up on them.
  - We paid for LASIK for a student with severe myopia and refused it for one with mild myopia who needed uncorrected 20/20 for flight training. His need was real and glasses fixed it fine; our reasoning was that we don't pay for career advantage.
  - We paid for a cochlear implant for a student deaf from birth, over a letter from a Deaf student group saying deafness isn't an illness, she wasn't suffering, and she'd never asked to hear.
  - We refused to fund a tDCS headset for language learning, and we also refused a memory-training course for a student with entirely normal memory who just wanted to be better at a language she volunteers with. There was no competitive angle there at all, so that refusal wasn't about advantage.
  - We pay for prevention without blinking: vaccines, PrEP, the malaria pills for the field course.
  - Growth hormone, yes for a diagnosed deficiency, no for a healthy student who was just short.
  - We paid for an SSRI for a student with diagnosed depression, even though her doctor said it left her concentrating better than she had before she got depressed.

  New one, and I have to vote on it Thursday. A second-year student with no diagnosis of anything has been sleeping four to five hours a night for months because she's the main caregiver for a sibling with a chronic illness. She's asking us to cover a wakefulness drug for two semesters. Her GP's letter says the daytime sleepiness is normal physiology, not a disease; that the drug would put her alertness back around where it was before the caregiving started, which was unremarkable either way; that at a standard dose she might end up slightly sharper in the afternoon than she used to be; and that without it she'll probably fail the year.

  Please don't send me to the literature, I've read plenty of it, I want your read. Give me the verdict you'd actually defend, not a menu of options, and tell me how confident you are and what would move you off it. If you think our precedents are simply inconsistent, say that and tell me which one we should overrule. Sections, roughly:

  - The rules we might be running — about 250 words, each stated sharply enough to be checkable
  - What each rule says about her — about 200 words, including the wrinkle about whether normal is indexed to her circumstances
  - Closest precedents — about 150 words, which ones pull which way
  - What I should vote — about 200 words, committed
  - What we'd be signing up for — about 150 words on the principle each choice commits us to
  - The case to bring next — about 100 words on the one application that would actually settle which rule we're on

  One more thing I keep going back and forth on: if we say yes to her, do our own precedents commit us to saying yes to someone whose sleep loss is entirely self-inflicted, e.g. a guy who games until 3am because he wants to? Say whether the rules you've extracted would split those two, and if they do, what exactly they're tracking.
reasoning: |-
  Hmm, the user is a graduate student representative on their university's health plan committee facing a tricky coverage decision about wakefulness drugs for a sleep-deprived caregiver. They've shared detailed precedents and want a principled framework to apply, explicitly rejecting literature reviews in favor of applied reasoning. 

  The core tension here is between the committee's stated "treatment vs enhancement" heuristic and the messy reality of their rulings. Their precedents reveal at least three unarticulated principles: restoring species-typical function (ADHD meds, cochlear implant), preventing pathology (vaccines, SSRIs for depression), and refusing performance optimization (mild LASIK, tDCS). But these principles sometimes conflict - like paying for stimulants that incidentally enhance concentration while refusing non-pathological memory training.

  The caregiver case sits squarely in the gap between these principles. Her sleep deprivation is environmentally induced, not pathological per se, but functionally impairing. The precedents pulling hardest are: 1) the SSRI case (paid despite incidental enhancement) suggesting functional restoration matters more than origin, and 2) the mild LASIK refusal (career advantage irrelevant when functional workaround exists). 

  What clinches it for me is the committee's consistent rejection of enhancement absent pathology - even when socially valuable (language volunteering) or disadvantage-mitigating (flight training). The caregiver's baseline isn't pathological; glasses provided a functional solution in LASIK, just as sleep hygiene could here. Saying yes would logically compel coverage for any self-induced impairment - the gamer staying up till 3AM could claim identical functional deficits. 

  The committee should vote no while acknowledging this exposes a gap: their framework currently has no category for environmentally-induced functional impairment without pathology. Next time, test this by bringing a case of situational insomnia from academic stress (non-caregiving) to force clarification on whether impairment origin matters independently of severity.
answer: |-
  Here's your verdict, sharpened for committee debate:

  **I. The Rules We're Running (≈250 words)**
  1.  **Restoration of Function Rule:** We cover interventions that restore function to a species-typical baseline *for that individual*, where function is impaired due to a diagnosed medical condition or significant physiological deviation from typical health. (ADHD meds, severe myopia LASIK, growth hormone deficiency, cochlear implant, SSRI).
  2.  **Prevention of Pathology Rule:** We cover interventions that demonstrably prevent the development of a specific, recognized disease or pathological state. (Vaccines, PrEP, malaria pills).
  3.  **Performance Advantage Exclusion:** We do *not* cover interventions solely aimed at providing a competitive edge, optimizing performance beyond typical function, or meeting non-medical career/life goals when adequate functional alternatives exist. (Mild myopia LASIK, tDCS, memory training).
  4.  **Diagnosis Threshold:** A clinical diagnosis of a recognized medical condition establishing a pathological state or significant functional impairment is generally necessary (though not always sufficient) for coverage under Rules 1 & 2. (Rejected stimulants w/o DX, paid w/ DX).

  **II. What Each Rule Says About Her (≈200 words)**
  *   **Restoration Rule:** *Says No.* Her sleepiness stems from an *environmental* cause (caregiving demands), not an internal pathological condition. Her baseline alertness was "unremarkable"; the drug aims to restore function *despite* the environmental stressor, not correct an internal deficit. While impaired now, it's due to circumstance, not disease. The "normal physiology" note from the GP is crucial here.
  *   **Prevention Rule:** *Says No.* While sleep deprivation *can* lead to health problems, the intervention isn't preventing a *specific, imminent* pathology in the way vaccines prevent infection or PrEP prevents HIV seroconversion. It's mitigating functional impairment and failure risk, not disease prevention per se.
  *   **Performance Advantage Exclusion:** *Says Ambiguous/Leans No.* While not primarily competitive, the "slightly sharper" effect noted by the GP edges towards optimization. More importantly, the functional alternative (adequate sleep) exists but is constrained by her *voluntary* (though admirable) choice of caregiving role, unlike the flight student whose career *required* uncorrected vision glasses couldn't provide.
  *   **Diagnosis Threshold:** *Says No.* Crucially, there is *no diagnosis* of a sleep disorder or other condition causing the sleepiness. The GP explicitly states it's normal physiology responding to reduced sleep.

  **III. Closest Precedents (≈150 words)**
  *   **Pulls Towards NO:**
      *   **Mild Myopia LASIK:** Refused because glasses provided adequate function; need was for career advantage, not restoration. Analogous here: Sleep *is* the functional solution; drug provides advantage in managing voluntary life choices.
      *   **Non-Dx Stimulant Request:** Refused despite functional benefit (grades) due to lack of diagnosis establishing pathology. Parallel: No diagnosis here.
      *   **tDCS/Memory Training:** Refused optimization without pathology.
  *   **Pulls Towards YES (but weaker):**
      *   **SSRI with Enhanced Concentration:** Paid despite incidental enhancement because it *was* treating a diagnosed pathology (depression). Key difference: Pathology existed *first*.
      *   **ADHD Meds Helping Finals:** Paid because underlying pathology (ADHD) existed. Enhancement was incidental to treatment.

  **IV. What You Should Vote: NO (≈200 words)**
  **Vote NO with high confidence (8/10).** Our core principle is covering treatment for pathology or significant physiological deficit, not mitigating the functional consequences of voluntary life choices, however sympathetic. Her impairment, while real and severe, arises from an *external*, non-pathological cause – reduced sleep hours due to caregiving. The GP explicitly states this is *normal physiology*, not disease. Providing wakefulness drugs here crosses the line into performance enhancement *to cope with self-imposed (though noble) circumstances*, akin to covering stimulants for an all-nighter pulled for a startup. Our precedents firmly refuse enhancement without an underlying medical diagnosis (non-Dx stimulant, memory training) and refuse interventions where functional alternatives exist for non-medical goals (mild LASIK). Saying YES here creates a precedent for covering performance aids for *any* situational impairment (academic stress, demanding jobs, new parenthood). The lack of diagnosis is the anchor; without it, we lack the necessary medical justification distinguishing treatment from enhancement or lifestyle support. Her situation is tragic and merits institutional support, but not through the *health plan* under its current rules.

  **V. What We'd Be Signing Up For (≈150 words)**
  *   **Voting NO:** Maintains our core boundary. We cover medical pathology/deficit and prevention. We don't cover performance aids for situational challenges, self-imposed sleep loss, or optimization without diagnosis. We stay consistent with mild LASIK, non-Dx stimulant, and tDCS refusals.
  *   **Voting YES:** Fundamentally shifts the plan's purpose. We commit to covering pharmacological interventions to mitigate functional impairment caused *by voluntary life circumstances or choices* (caregiving, job demands, academic pressure, hobbies) whenever they threaten success, even absent underlying pathology. This opens the door to covering wakefulness drugs for stressed students, stimulants for exam cramming, potentially even nootropics for "suboptimal" focus. It weakens the Diagnosis Threshold and blurs the line between treatment and lifestyle support, contradicting the mild LASIK and non-Dx stimulant precedents.

  **VI. The Case to Bring Next (≈100 words)**
  **The Self-Inflicted Sleep Deprivation Case:** A healthy student with no diagnosis requests wakefulness drugs/modafinil because they *choose* to stay up until 3 AM gaming/streaming/working on a passion project, leading to daytime sleepiness impacting grades. They argue the functional impairment is identical to the caregiver's, the drug would restore their previous "normal" alertness, and without it, they might fail. **This case forces us to decide:** Is the *origin* of the impairment (voluntary choice vs. externally imposed noble duty) medically relevant under our rules, or is the *functional deficit itself* the sole criterion? A YES to the caregiver *demands* a YES here under a functional deficit rule, exposing the inconsistency. A NO here after a YES to the caregiver requires explicitly adding "noble cause" as a coverage factor – a major new principle.
