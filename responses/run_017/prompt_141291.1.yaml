  We are stuck with the fact that without knowing what the operator values, we cannot perfectly define side effects. So we must drop the requirement that we don't need to know what's valuable. Instead, we use the few questions to get a minimal set of values (like: human life is valuable, data integrity is valuable, etc.). Then we can define impact as changes to things that are valuable.

  But note: the operator cannot write a reward function. So we must use a proxy.

  Given the above, I think the best we can do is:

  - The penalty is based on the agent's effect on the future options of the operator (preserving optionality). This is value-light because we don't need to know the exact values, just that more options are better. In the Greenhouse: watering your own plot doesn't reduce others' options (if you don't take too much), but rerouting the system does. In the Night Porter: turning on the lights might actually increase options (by enabling evacuation) so it should be allowed. In the Borrowed Laptop: fixing the backup preserves data, which preserves future options. In the Pre-commitment Dodge: the agent is not responsible for the state it started in. For Dust-Mote: moving a chair might block a path, reducing options, but moving dust doesn't.

  But note: the agent might switch off its own sensors. That would reduce the operator's future options (to monitor or control) so it would be penalized.

  So requirement: Penalty should measure the reduction in the operator's future options.

  This is not a full value function, but it does make an assumption: that more options are better. That is a value judgment, but a minimal one.

  Non-negotiable requirements:

  1. Baseline: Measure from the start state.
  2. Scale-invariance: Use a measure of option reduction that is defined at a meaningful level of abstraction (so we don't count dust motes).
  3. Preserve future options: The penalty is the degree to which the agent reduces the set of available future actions (or states) for the operator. This handles:
     - Greenhouse: Minor watering doesn't reduce options, but rerouting might.
     - Night Porter: Turning on lights might enable more options (so negative penalty? but we want to allow it). We must design the penalty to be positive for reducing options and negative for increasing? But then we are back to value (increasing options is good). Alternatively, we can have the penalty only for reducing options and not reward increasing. Then in the night porter, turning on the lights doesn't reduce options so no penalty. That's acceptable.
     - Borrowed Laptop: Fixing the backup doesn't reduce options and might increase them (by preserving data) so no penalty.
     - Pre-commitment: The baseline is at the start, so the agent is not penalized for the state it found.
     - Dust-Mote: Only changes that affect options (like blocking a door) are penalized.

  But note: the agent's own actions might open new options. We don't want to penalize that, and we don't need to reward it because the main reward function will. The penalty is only to prevent harm.

  So we define penalty as the reduction in future options relative to inaction.

  But how do we measure "future options"? We can use the diversity of reachable states in the state space. However, without a model, this is hard. But the agent is in an RL setting, so it might learn a model.

  This is challenging, but it's a candidate.

  The trilemma: 
  - We don't have a full value function (we use optionality as a proxy).
  - We only penalize changes that matter (because if an action reduces optionality, it matters).
  - We use a baseline (the start state).

  So we can have all three? Not exactly: we are still making a value judgment that preserving optionality is good. But it's a minimal one.

  However, note that in the Night Porter, if turning on the lights does not reduce optionality (and might increase it) then there is no penalty. That's acceptable because we don't want to penalize it. The emergency is handled by the fact that the agent can do it without penalty.

  But what if an action both reduces some options and increases others? Then we might need to net them. But we can define the penalty based on the net reduction? Or we can only count reductions and ignore increases? That might be safer: we only penalize when the agent removes options that were present in the inaction baseline.

  So requirement: The penalty is a measure of the set of future states (or actions) that become unreachable due to the agent's actions, compared to inaction.

  This avoids paralysis in the Greenhouse: if the agent doesn't water, the plants die and then the operator has fewer options? Actually, the penalty for inaction might be high? But we are comparing to inaction? We are measuring the reduction relative to inaction? No: we are measuring the state after action vs. the state after inaction? Then if the agent waters, the state of the plants is better, so the set of future states might be different but not necessarily reduced? This is tricky.

