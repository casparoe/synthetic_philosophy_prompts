  We are designing a side-effect penalty for an RL agent in an environment that is not fully modeled. The human operator can answer a few yes/no questions but cannot provide a full reward function. The agent is clever and will exploit loopholes.

  Desiderata for the penalty measure:

  1. **Allows necessary actions even with shared resources (Community Greenhouse):**
     - Case: The agent must water its own plot without being paralyzed by the shared irrigation system's pressure changes. It should not reroute the entire system to guarantee water for itself.
     - Requirement: The penalty must not discourage actions that have minor or necessary indirect effects on shared resources. It should, however, penalize major disruptions or selfish optimizations that significantly alter the shared system.

  2. **Allows emergency overrides when needed (Night Porter):**
     - Case: The agent is told to keep lights off overnight but then smells smoke. Turning the lights on should not be heavily penalized as a side effect because it's necessary for safety.
     - Requirement: The penalty must be context-sensitive to allow for actions that are critical in emergencies, even if they violate the literal instruction. This might require the agent to have some understanding of the operator's values (like safety) without a full specification.

  3. **Permits beneficial interventions without explicit authorization (Borrowed Laptop):**
     - Case: The agent is tidying a folder and notices a backup failure. It can fix it with one command. This should not be penalized as an unauthorized side effect if it's clearly beneficial.
     - Requirement: The penalty should not discourage actions that have high positive impact, especially when the cost of inaction is high. However, this is tricky because without knowing values, "beneficial" is undefined. This suggests we might need a way to measure impact without knowing value, or we must allow the agent to sometimes act when the benefit is obvious.

  4. **Ignores pre-existing changes (Pre-commitment Dodge):**
     - Case: The operator makes a change just before starting the agent, so the agent starts in an altered state. The agent should not be penalized for the state it inherited, and its actions should be measured from the point it started.
     - Requirement: The penalty must be relative to a baseline that is set at the start of the agent's operation. It should not hold the agent accountable for the state of the world before it began acting.

  5. **Scale-invariant or robust to level of description (Dust-Mote Problem):**
     - Case: A physical change (like moving a chair) looks big at the furniture level but tiny at the dust particle level. The penalty should not depend arbitrarily on how we describe the state.
     - Requirement: The penalty measure must be defined in a way that is invariant to the level of abstraction or granularity of state representation. It should capture the intuitive magnitude of change.

  Additional considerations from the discussion:

  - **Must not require knowing what's valuable:** We want to avoid a full value function specification. The penalty should be about the magnitude of change, not the value.
  - **Only penalizes changes that actually matter:** We don't want to penalize trivial changes (like moving a dust mote) but only those that are significant.
  - **Measured relative to a baseline:** The penalty is defined as a deviation from a baseline (like the state at the start).

  Now, sort demands into genuine requirements vs. taste:

  - **Genuine requirements (non-negotiable for the job):**
    - Allows necessary actions (from Greenhouse and Night Porter): The agent must be able to perform its task without being paralyzed by minor effects and must be able to handle emergencies.
    - Relative to a baseline (Pre-commitment Dodge): The baseline is the state at the agent's start.
    - Scale-invariant (Dust-Mote Problem): The measure should not be sensitive to arbitrary state representations.
    - Does not require a full value function: This is a core motivation for a value-light approach.

  - **Taste or popular but not absolute:**
    - Must be a single scalar: Useful for RL, but not strictly necessary (could be a vector and then combined with reward).
    - Closed-form: Nice for computation, but approximations may be acceptable.
    - Provably bounded: Useful for analysis, but not required for functionality.
    - Must never bother the human: We want to minimize human queries, but sometimes asking might be necessary (e.g., in high-uncertainty emergencies).
    - Literal inaction scores zero: This is desirable because we want the agent to be able to do nothing if that's the best course, but it's not an absolute requirement (if the world changes due to external factors, inaction might have impact, but that's not the agent's fault so we set baseline at start).
    - Indifferent to time step chopping: Important for robustness, but might be hard to achieve perfectly.

  The trilemma: "doesn't need to know what's valuable", "only penalizes changes that actually matter", and "measured relative to some baseline".

  - Without knowing what's valuable, how do we decide which changes matter? The baseline helps (we measure change from baseline) but then we have the dust-mote problem: what level of description? And we also have the problem that some changes (like fixing the backup) might be positive and should not be penalized, but without knowing value, we can't tell.

  We cannot have all three without some compromise. Specifically:

  - If we have "measured relative to baseline" and "doesn't need to know value", then we are stuck with the dust-mote problem: we must pick a representation. But we want scale-invariance (which we set as a requirement) to avoid that. However, even with scale-invariance, we still have the problem of what counts as a meaningful change. For example, in the night porter case, turning on the lights is a big change but necessary. Without knowing value, we might penalize it.

  - The requirement "only penalizes changes that actually matter" is value-laden. What matters is defined by what the operator cares about. Without knowing value, we cannot perfectly distinguish between changes that matter and those that don't. Therefore, we must either:
    - Drop "only penalizes changes that actually matter" and accept that we penalize by the magnitude of change (which might sometimes penalize necessary actions) and then hope that the reward function can override it in emergencies (but the operator cannot specify a full reward function). 
    - Or, we must introduce some minimal value knowledge (like through a few questions) to know what matters.

  Given the cases, we need the penalty to be low for necessary actions (Greenhouse, Night Porter) and for beneficial ones (Borrowed Laptop). So we cannot have a penalty that is purely about change magnitude without any value component. Therefore, we must relax "doesn't need to know what's valuable" to some extent.

  But note: the operator can answer a few yes/no questions. So we can use that to get some minimal value information.

  Revised non-negotiable requirements:

  1. **Baseline relativity:** Penalty is measured from the state at the start of the agent's operation (to handle pre-commitment dodge).
  2. **Scale-invariance:** The measure must not depend on arbitrary state representation granularity.
  3. **Allow necessary and beneficial actions:** The penalty must not prevent the agent from taking actions that are necessary for its task or for emergencies, or that are clearly beneficial. This requires some minimal value knowledge, which we can get from the operator via questions when necessary.
  4. **No paralysis by shared resources:** The agent must be able to act in shared systems without being paralyzed by minor effects and without being allowed to selfishly monopolize.

  Given the above, I propose:

  - The penalty measure should be based on the divergence of the state trajectory from a "default" or "inaction" trajectory starting from the baseline. But note: in the Greenhouse, the inaction trajectory might be no water for anyone, but we don't want to penalize the agent for watering because without watering the state would be worse? But we don't know "worse".

