  Therefore, we must require:

  5. **Counterfactual comparison:** The penalty is the difference between the state after the agent's action and the state that would have occurred if the agent had done nothing (from the same starting state). This handles external changes and pre-commitment.

  But generating the counterfactual may require a world model.

  Given the operator cannot provide a model, the agent must learn one.

