  ### Activity Plan: "The Channel Challenge"  
  **British English, Practical Design for 16 Students, 90 Minutes**  
  **Objective:** Illustrate Turing’s worry about hidden channels influencing the imitation game verdict, without revealing ESP or the twist until the debrief. Students discover how "leaks" outside the official channel can distort results and how fixes assume no such leaks exist.

  ---

  #### **Timeline (90 Minutes Total)**  
  - **0:00–0:15 (15 min): Setup & Rules**  
    - Assign roles, explain rules, and distribute materials. No mention of hidden channels or ESP.  
  - **0:15–0:55 (40 min): Game Rounds**  
    - **Rounds 1–3 (20 min):** Initial setup with minimal restrictions.  
    - **Rounds 4–6 (20 min):** "Secure" setup with added restrictions to "block leaks".  
  - **0:55–1:05 (10 min): Interim Discussion**  
    - Students analyse results without knowing the twist.  
  - **1:05–1:15 (10 min): Reveal & Final Tally**  
    - Expose the hidden channel and score points.  
  - **1:15–1:30 (15 min): Structured Debrief**  
    - Connect to Turing’s ESP worry, ambiguity of verdicts, and limits of "fixes".

  ---

  #### **Roles, Rules, and Materials**  
  **Participants:** 16 students divided into:  
  - **2 Contestant Teams (6 total, 3 per team):**  
    - **Sender:** Creates a response to a question.  
    - **Relayer 1 & 2:** Pass the response via the official channel.  
  - **1 Judge (1):** Decides which team is "genuine" based on responses.  
  - **2 Observers (2):** Secretly pass information using a hidden channel (only one is active; see below).  
  - **2 Channel Guards (2):** Monitor for unauthorised communication.  
  - **1 Moderator (1):** Runs the game, asks questions, tallies points.  
  - **4 Audience Members (4):** Track results on a public scoreboard and note "suspicious behaviour".  

  **Materials:**  
  - Cheap supplies: Paper, pens, envelopes, a stopwatch/timer.  
  - Partitions (e.g., posters or books) to separate teams in later rounds.  
  - Question cards (pre-written by moderator, e.g., "Describe fog in one word" or "Define courage simply").  
  - Scoreboard (whiteboard or large paper).  

  **Game Rules:**  
  1. **Objective:**  
     - The **genuine team** answers the moderator’s question truthfully.  
     - The **deceptive team** deceives by imitating the genuine team’s style but fabricating answers.  
     - The **judge** must identify the genuine team based *only* on the responses.  
     - **Winning:** Teams/judge earn points for successful deception or correct identification.  

  2. **Communication Rules:**  
     - **Official Channel:** Responses must be written and passed sequentially: Sender → Relayer 1 → Relayer 2 → Moderator → Judge. No talking.  
     - **Hidden Channel (Secret):**  
       - **Observer 1** (assigned to genuine team) leaks the genuine response to the deceptive team using subtle **hand signals** (e.g., fingers on table = first letter of word: 1 finger = A, 2 = B, etc.).  
       - **Observer 2** is a decoy: They take notes but do nothing.  
       - *Only Observer 1 and the deceptive team know this pre-game (told privately)*. Guards/audience are unaware.  
     - **Restrictions in Rounds 4–6:**  
       - Teams separated by partitions.  
       - Observers moved to the back of the room.  
       - Guards stand between teams to "block unauthorised signals".  

  3. **Round Structure (6 Rounds Total, 5–6 min each):**  
     - **Step 1:** Moderator asks a question (e.g., "What is the opposite of hope?").  
     - **Step 2:** Teams craft responses using official channel (1 min).  
       - *Genuine team*: Answers truthfully (e.g., "despair").  
       - *Deceptive team*: Uses leaked signal to copy the genuine answer OR guesses if no signal.  
     - **Step 3:** Judge reads both responses, decides which team is genuine (1 min).  
     - **Step 4:** Moderator reveals which team was genuine, awards points.  
     - **Step 5:** Audience updates the scoreboard.  

  ---

  #### **Payoff Scheme**  
  - **Small stakes:** Chocolate coins (or points redeemable for sweets). 1 point = 1 chocolate coin.  
  - **Earning Points:**  
    - **Judge:** 1 point per correct identification.  
    - **Genuine Team:** 1 point if judge identifies them.  
    - **Deceptive Team:** 1 point if judge wrongly identifies them as genuine.  
    - **Observers/Guards/Audience:** 1 point per round if they correctly report "suspicious activity" (e.g., "Observer 1 looked at deceptive team").  
  - **Incentives:** Teams/judge compete for chocolates; observers/guards motivated to detect anomalies.  

  ---

  #### **Debrief: Mapping Activity to Turing’s Ideas**  
  **Reveal First (0:55–1:05):**  
  - "Observer 1 was secretly signalling to the deceptive team. Did anyone notice? How did Rounds 1–3 vs. 4–6 differ?"  

  **Structured Discussion (1:15–1:30):**  
  - **Ambiguity of the Verdict:**  
    - "In early rounds, when the judge was often fooled, did you assume the deceptive team was 'skilful'? What else could explain this?"  
    - *Link:* Like Turing’s test, results initially seem to reflect the contestants’ abilities but may hide "leaks".  
  - **The Move to Restrict the Channel:**  
    - "Why did we add partitions/guards? Did it ‘fix’ the problem? How?"  
    - *Link:* Turing’s teleprinter/cage fix aims to block "leaks" by controlling communication channels.  
  - **The Assumption of No Leak:**  
    - "When we added partitions, did we assume we’d blocked ALL leaks? What did we miss?"  
    - *Link:* Fixes assume no unmodelled channels exist (e.g., Turing’s ESP worry: if real, even a teleprinter might not block it).  
  - **Unknown/Unimaginable Channels:**  
    - "Observer 1 used hand signals. Could there be other leaks we didn’t plan for? How would you test for them?"  
    - *Link:* Turing admits we can only guard against known channels, not "every possible one" (e.g., unimaginable ESP).  

  ---

  #### **Predictable Problems & Solutions**  
  - **Timing Overruns (Likely in Rounds):**  
    - *Solution:* Moderator uses a strict timer. Cut responses to 30 seconds if behind.  
  - **Hidden Channel Too Obvious:**  
    - *Risk:* Guards/audience spot signals early.  
    - *Solution:* If exposed, say: "Good catch! Now continue, but note how leaks affect results." Use it in debrief.  
  - **Hidden Channel Too Invisible:**  
    - *Risk:* No one detects it, diminishing "aha" moment.  
    - *Solution:* Moderator discreetly reminds Observer 1 to be slightly bolder if undetected after Round 2.  
  - **Students Guess the Twist:**  
    - *Risk:* Someone says, "Is this about cheating?" or mentions ESP.  
    - *Solution:* Respond: "Hold that thought—we’ll discuss implications later." Redirect to game mechanics.  
  - **Judge or Teams Frustrated:**  
    - *Risk:* Genuine team annoyed by copying; judge struggles.  
    - *Solution:* Emphasise it’s a "thought experiment"; reward participation points to keep morale high.  
  - **Real Turing Mentioned Early:**  
    - *Risk:* Student says, "This is like Turing’s telepathy bit!"  
    - *Solution:* "Let’s focus on our game now—we’ll connect to readings at the end."  

  ---

  #### **What the Activity Cannot Reproduce**  
  **Feature Missing:** Turing’s point that ESP (if real) is a *natural, uncontrolled phenomenon*, not a deliberate cheat.  
  - **How to Address in Debrief:** Explicitly state: "In our game, the hidden channel was intentional cheating. But Turing worried ESP could leak information *unintentionally*, like a force of nature. His fix tries to block it but assumes it’s blockable—which might not hold if ESP exists. This shows how test results rely on background assumptions about what’s possible."  

  ---

  **Final Prep Notes**  
  - **Tomorrow-Ready:** Assign roles randomly. Use any room; questions can be improvised (e.g., "Describe love in one word"). No tech needed.  
  - **Why It Works:** Students experience how "verdicts" (judge’s decisions) can be skewed by hidden channels, then design a "fix" that reveals its own assumptions. The reveal sparks self-driven realisation of Turing’s core problem.  
  - **Output:** Scores, observations, and "suspicion" notes from the audience feed into the debrief, making abstract ideas tangible.  

