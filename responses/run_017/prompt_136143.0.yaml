prompt: |-
  I do a 25-minute explainer slot at my paper once a month — whiteboard, and the room is reporters and editors who've had one stats class and zero philosophy. Mine's coming up and I want to spend it on the indicative / counterfactual distinction, because our copy is stuffed with lines like if the agency had acted sooner the spill would've been half the size, and nobody in the building can say what makes one of those true and another not.

  Don't explain it to me, plan the thing. What has to land first — that the two aren't just tensed versions of each other, that the counterfactual isn't going to get it's truth from what actually happened, or something else I haven't thought of — and why does the rest hang off that? Which one pair of sentences should carry the whole 25 minutes? I'm guessing it needs to be a case where the indicative is perfectly assertable and the counterfactual is flatly false, and it should probably NOT be one where the room can shrug and say well, anything's possible. My misconception list so far: that the difference is really just subjunctive grammar, that a counterfactual is true when the consequent is probable given the antecedent, and that you check one by holding the world fixed and changing only the antecedent. Where in the sequence does each get headed off, and which one am I missing that actually matters more than those? Also: what do I flatly refuse to get into at this level — possible-worlds and similarity-of-worlds machinery, the business about a conditional's probability being a conditional probability? — and say out loud that I'm skipping it. Last thing: one question I can put to the room at minute 22 that tells me whether they got the distinction or just absorbed the vibe.
reasoning: |-
  Okay, the user is preparing a 25-minute explainer for journalists and editors about the indicative/counterfactual distinction. They want a focused, practical plan that avoids philosophy jargon. Let me unpack their needs.

  First, their audience has minimal stats/philosophy background but deals with claims like "if the agency acted sooner, the spill would've been smaller." The core problem is journalists can't evaluate such statements. The user wants to prevent common misconceptions: confusing tense with modality, equating counterfactuals with probability, or thinking you just "change one thing" logically.

  Key constraints: Must land one big idea first. Needs a killer example pair where indicative is true but counterfactual is false (no "anything's possible" shrugs). Must explicitly skip possible worlds/conditional probability math. Needs a diagnostic question to test understanding.

  Hmm... the central anchor should be that these conditionals answer different questions. Indicatives are about updating beliefs given new information ("if it rained, why is the pavement dry?"). Counterfactuals imagine altering the past ("if it had rained, would the pavement be wet?"). This distinction frames everything else.

  For the example pair: "If Jones missed the meeting, he's angry" (indicative) vs. "If Jones had missed the meeting, he would be angry" (counterfactual). The twist: Jones actually skipped the meeting to see a comedy show, so he's delighted. Thus, indicative true (he did miss it and isn't angry), counterfactual false (missing it didn't cause anger). No shrugging - it hinges on actual causation.

  Sequence should be: 1) Hook with a news example, 2) Show both conditionals about the same event, 3) Reveal the factual surprise (Jones is happy), 4) Hammer that truth conditions diverge because indicative respects facts while counterfactual overrides them. Then debunk misconceptions in order: subjunctive grammar first (easiest to dismiss), then probability, then "changing one thing."

  Must skip: possible worlds (say it out loud), conditional probability. Diagnostic question: "If the mayor had resigned, would the scandal have ended?" - correct answer depends on knowing resignation alone wouldn't have helped due to systemic corruption.
answer: |-
  Here's a battle-tested plan for your 25-minute explainer, prioritizing clarity, impact, and journalist-relevance while avoiding philosophical quicksand:

  **The Core Anchor: They Answer DIFFERENT Questions**
  *   **Land THIS First (Minute 3):** "Indicatives and counterfactuals aren't just about tense or mood. **They answer fundamentally different questions about evidence vs. rewriting history.**"
  *   **Why it anchors everything:** This immediately frames the distinction as functional and practical ("What question are we *actually* trying to answer?"), not grammatical or abstract. Everything else flows from this purpose.

  **Your Killer Example Pair: "The Jones Meeting"**
  *   **Setup (Minute 5):** "Jones *hated* today's budget meeting. He told Smith: 'If I miss this meeting, I'll be furious!' (Indicative: Planning/Expecting). Later, Jones was unexpectedly offered free tickets to his favorite comedian *during* the meeting time. He skipped the meeting and went to the show."
  *   **Reveal & Contrast (Minute 7):**
      *   **Indicative (True):** "Smith sees Jones after the meeting. Jones is grinning ear-to-ear, clutching a souvenir program. Smith thinks: **'If Jones missed the meeting, he's furious.'** (Smith *infers* based on Jones's *stated* reaction to missing). **ASSERTABLE? YES.** (Based on Jones's prior statement). **TRUE? YES.** (Jones *did* miss it, and he *isn't* furious? Wait... Smith's inference was *wrong*, but the *indicative conditional itself* was asserted based on available evidence *at the time*. It reflected Smith's *belief state* given the premise 'He missed it'.)"
      *   **Counterfactual (False):** "An editor reviewing this later writes: **'If Jones had missed the meeting, he would have been furious.'** **ASSERTABLE? NO. FALSE? YES.** Why? Because we *know* what actually happened! He *did* miss it, and he *wasn't* furious (he was delighted). The counterfactual *ignores* the actual cause of his happiness (the show) and wrongly assumes the *only* consequence of missing would be anger. Rewriting history to make him miss it *without* the show being available doesn't support the anger conclusion."
  *   **Why it works:** The indicative is perfectly reasonable *for Smith at the time* based on evidence, even if the world surprises him. The counterfactual is flatly false *given the actual world* and its specific causes. No shrugging – the actual outcome (happy Jones) directly falsifies the counterfactual claim.

  **The Sequence & Misconception Busting:**

  1.  **Hook (Min 0-2):** "Headline: 'If Agency Acted Sooner, Spill Half the Size!' But... what *makes* that true? Or false? We write these constantly. How do we know?" Show 2-3 real examples from your copy.
  2.  **The Anchor (Min 3):** "Different Questions! Indicative: *Given what we know/could know, what follows?* Counterfactual: *If the past were different, what THEN would happen?*"
  3.  **Killer Example (Min 5-10):** Introduce "The Jones Meeting" scenario. Build suspense. Reveal the outcome (happy Jones).
  4.  **Contrast the Pairs (Min 10-12):**
      *   Focus on Smith's *reasoning* for the indicative (evidence-based inference about the actual world).
      *   Focus on the editor's *mistake* for the counterfactual (ignoring the actual cause – the show – when imagining the change).
  5.  **Bust Misconceptions (Min 12-18):**
      *   **(First Bust - Min 12): Grammar ≠ Meaning:** "Is it just 'was' vs. 'had been'? **NO.** The Jones example shows the *same event* described both ways with *different truth values*. The difference isn't the verb form; it's the *question* being asked (evidence vs. rewritten history)."
      *   **(Second Bust - Min 14): Probability ≠ Truth (Counterfactual):** "'Jones probably *would* have been furious'? Maybe! But 'probably' doesn't make the counterfactual *true*. We **know** the specific counterfactual 'If he had missed, he *would* have been furious' is **false** because the *actual* way he missed made him happy. Counterfactuals need more than probability; they need a plausible causal story *consistent with the change*." (Link to Spill: "If Agency acted sooner, spill *probably* smaller"? Maybe. But is it *definitely true*? What *else* might have happened? Bad equipment? Storm? We need more than 'likely'.)
      *   **(Third Bust - Min 16): "Change One Thing" Naiveté:** "Can we just 'hold the world fixed and change only the antecedent'? **Rarely.** Changing 'Jones missed the meeting' *requires* changing *why* he missed it or *what else* was happening. Did he oversleep? Get sick? Or... get free tickets? The *specific way* we imagine the change matters hugely for the consequent. The editor imagined the 'oversleep' version (leading to anger), not the 'free tickets' version (leading to joy)." (Link to Spill: Changing "Agency acted sooner" might *require* imagining different personnel, different intel quality, different weather... which changes the outcome unpredictably. Holding "everything else fixed" is often impossible or misleading).
  6.  **Journalist Takeaway (Min 18-22):**
      *   **Indicative:** Use when drawing conclusions *from evidence within the actual world* ("If the data shows X, then Y is likely"). Be clear it's about inference.
      *   **Counterfactual:** Use **very cautiously** when speculating about alternative pasts. Ask: "What *specific, plausible* chain of events leads from this changed antecedent to this consequent, *acknowledging* what we know happened instead?" Avoid presenting them as simple facts. Label uncertainty ("might have been," "could have been," "likely would have been").
      *   **Red Flag:** If your counterfactual seems obviously true *only* by ignoring key aspects of what *actually* happened (like Jones's show!), it's probably wrong or poorly supported.

  **What You FLATLY Refuse To Get Into (Say This Out Loud - Min 2 or Min 19):**
  *   "We are **NOT** diving into possible worlds, similarity metrics between worlds, or Lewis/Stalnaker semantics. That's crucial philosophy, but it's the engine under the hood, not the driver's seat for journalists."
  *   "We are **NOT** getting into the deep math linking the probability *of* a conditional to conditional probability. That's a fascinating stats/logic rabbit hole, but it's not today's focus."

  **The Diagnostic Question (Minute 22):**
  > **"The bridge collapsed during the storm. We know corrupt officials took bribes to approve substandard materials years ago. Consider this claim: 'If the mayor had resigned after the bribery scandal was first reported (but before the collapse), the bridge would not have collapsed.' Is this counterfactual likely *true*, likely *false*, or incredibly *hard to support*? Why?"**

  *   **Why it works:** It tests if they grasp:
      1.  **Counterfactual:** Uses "had resigned... would not have collapsed."
      2.  **The Anchor (Different Questions):** It's rewriting history (resignation), not inferring from evidence.
      3.  **"Change One Thing" Naiveté:** Resigning alone doesn't magically fix the substandard materials *already in the bridge*. The actual cause (bad materials) wasn't necessarily addressed by the resignation. The collapse might still have happened.
      4.  **Probability ≠ Truth:** Even if resignation *might* have led to an investigation *that might* have found the problem *that might* have led to repairs... that chain is long and uncertain. The simple counterfactual is almost certainly **false** or at best **incredibly hard to support** because it ignores the *actual, physical cause* (bad materials) and assumes a single political act would have definitively prevented it. A good answer focuses on the complexity of the change and the actual cause. A bad answer says "Well, if he resigned, *probably* it would have been fixed."

  **Whiteboard Flow:**
  1.  HEADLINE EXAMPLES (Hook)
  2.  BIG BOLD CENTER: **DIFFERENT QUESTIONS!**
      *   Indicative: **Evidence -> Inference (Actual World)**
      *   Counterfactual: **Rewrite History -> Speculate (What If?)**
  3.  JONES MEETING TIMELINE (Setup -> Outcome)
  4.  INDICATIVE BOX: "If missed -> furious" (Based on: Prior Statement / Evidence -> Assertable & True *for Smith*)
  5.  COUNTERFACTUAL BOX: "If had missed -> would be furious" (Assumes: Oversleep Scenario / Ignores Show -> False)
  6.  MISCONCEPTIONS w/ BIG X's:
      *   Subjunctive Grammar
      *   Probable = True (Counterfactual)
      *   Change Only One Thing
  7.  JOURNALIST RULES (Indicative: Inference; Counterfactual: Caution, Plausible Chain)
  8.  DIAGNOSTIC QUESTION (Bridge)

  This plan hits the critical distinctions practically, uses a memorable, non-shruggable example, directly addresses the most common newsroom misconceptions in a logical order, and gives you a clear gauge of understanding at the end. Good luck!
