prompt: |-
  You are a philosopher of physics who works on the metaphysics of time. Think the question through before you write: list the candidate presuppositions one by one, test each against the practice, and drop the ones the practice does not really need. Then answer in under 500 words, with no citations or bibliography.

  I am preparing a seminar session on presentism and eternalism and want to open from a practice rather than from the usual dialectic. So: working cosmologists state a single age for the universe — about 13.8 billion years, with error bars — date every event as so many billions of years before *now*, and run one time axis across a map of the whole cosmos, including regions we never interact with. The same physicists teach that simultaneity is frame-relative and that "now" carries no relativistic cash value. What view of time does that practice presuppose, if any?

  Three things I want separated. First, what it strictly requires: does it need a physically privileged slicing of spacetime into hypersurfaces of cosmic time, and is that the same commitment as eternalism, or does presentism have equal use for such a slicing — the cosmic present being simply the one leaf there is? Second, what it merely fits well with: is the practice in fact compatible with presentism, the growing block, and eternalism alike, so that the familiar claim that relativity settles the debate is overblown in both directions? And what, if anything, does it genuinely rule out — for instance a view on which there is no objective fact about how much time has elapsed since the Big Bang, or no objective temporal distance between a distant event and us? A colleague tells me that in the standard model the elapsed proper time since the Big Bang is greatest for observers who have remained comoving, which would make the chosen slicing look principled rather than merely convenient; if that is right, tell me how much work it does, and if not, say what the practice is left resting on.

  Finally: what would cosmology have to give up in a spacetime with no global time function — a rotating universe admitting closed timelike curves, say? Would "the age of the universe" mean anything there, or would the practice survive only as a local one? Close with a single bottom-line sentence on whether this practice is evidence for eternalism, for presentism, or about neither.
reasoning: |-
  Okay, let me think through this carefully. The user is preparing a seminar on presentism vs eternalism and wants to ground it in actual cosmological practice. They describe how cosmologists use a single cosmic time coordinate across the entire universe while simultaneously teaching frame-relative simultaneity. 

  I need to analyze this practice's metaphysical presuppositions in three distinct layers: strict requirements, compatibility with different views, and what it genuinely rules out. The colleague's point about comoving observers having maximal proper time since the Big Bang seems important for assessing whether the cosmic time slicing is principled or merely convenient.

  For strict requirements: The practice necessitates a global temporal metric - a way to assign duration values between any two cosmic events. This requires a physically privileged foliation (the hypersurfaces of constant cosmic time) that's globally defined and operationally significant through comoving observers. Presentism could technically adopt this slicing as "the present," but it conflicts with relativity's denial of privileged simultaneity.

  Regarding compatibility: The cosmic time framework fits naturally with eternalism, as the entire spacetime manifold exists with this temporal ordering. It's awkward for presentism because it treats distant regions as equally real in calculations. Growing block could accommodate it with difficulty. What it rules out are views denying objective temporal distances or duration since the Big Bang.

  On models without global time functions (like rotating universes with CTCs): Cosmology would lose the single age concept. "Age of the universe" could only be defined locally, making the global practice unsustainable. The practice would become approximate and context-dependent.

  The bottom line is that while not conclusive proof, this practice leans toward eternalism by treating all cosmic times as equally real in physical descriptions. The cosmic time coordinate functions as a fundamental temporal scaffolding that presentism struggles to naturalize within relativistic physics.
answer: |-
  Based on cosmological practice and relativistic constraints:

  **1. Strict Requirements:**
  *   **Global Temporal Metric:** The practice strictly requires an objective way to assign a *duration* (age) and a *temporal ordering* (before/after relative to "now") to events across the entire observable universe. This necessitates a physically definable, globally consistent parameter ("cosmic time") measuring elapsed time since the Big Bang along fundamental worldlines.
  *   **Privileged Foliation:** This requires a physically privileged slicing of spacetime into hypersurfaces of constant cosmic time. This foliation is defined by the average rest frame of the cosmic microwave background (CMB), where comoving observers (those at rest relative to the CMB) experience maximal proper time since the Big Bang. This maximality makes the slicing principled, not merely convenient; it's the unique slicing where the universe looks homogeneous and isotropic on large scales. The practice *does not* strictly require a metaphysically privileged "now" beyond the operational definition tied to our location.

  **2. Compatibility:**
  *   **Eternalism:** Fits perfectly. The entire spacetime manifold, foliated by cosmic time hypersurfaces, exists. Calculations treat past, distant, and future events equally as real parts of the model.
  *   **Presentism:** Deeply awkward. While presentism *could* designate the cosmic "now" hypersurface as the sole existing present, the practice fundamentally relies on the *reality* of past events (e.g., the Big Bang, recombination) and treats distant events (like galaxy formation light-years away) as having definite past locations within the cosmic timeline, regardless of our current causal contact. The global foliation structure undermines the idea that only the instantaneous "now" exists.
  *   **Growing Block:** Compatible in principle, as the block grows along the cosmic time axis. However, the definite temporal ordering and duration assignment to *all* past events, even causally disconnected ones, fits more naturally with a complete block.
  *   **Ruled Out:** The practice rules out views denying:
      *   Objective temporal duration since the Big Bang for comoving observers.
      *   An objective temporal ordering (past/present) for events along fundamental worldlines defined by the CMB frame.
      *   Objective temporal distance between distant events and "now" within this cosmic time framework. Claims that relativity alone settles the eternalism/presentism debate *are* overblown, as the debate concerns ontology, not just structure; however, the global temporal structure of cosmology is *incompatible* with core tenets of standard presentism.

  **3. Loss in Spacetimes without Global Time:**
  In a rotating universe with closed timelike curves (CTCs):
  *   A single, global "age of the universe" becomes meaningless. There is no consistent way to define elapsed time from a singular beginning point for all observers due to CTCs violating global temporal ordering.
  *   The practice of a single time axis across the whole cosmos collapses. Cosmology would be forced into a local or regional description. "Age" could only be defined along specific worldlines within causally well-behaved patches, but these patches might not cover the whole universe or agree on a global timeline.

  **Bottom Line:** While not definitive *proof*, the global cosmic time practice, resting on a physically principled foliation and treating past/distant events as having definite temporal locations within a unified framework, provides strong evidential support for **eternalism** and is fundamentally incompatible with standard presentism.
