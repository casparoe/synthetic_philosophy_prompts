answer: |-
  The stones held memories, but not the way human stones did. No inscriptions, no carvings. Just grooves worn smooth by generations of passing feet, weighted sticks lashed together with intricate knots in thick, fibrous cords, and smooth, palm-sized river pebbles stacked in peculiar arrangements. Dr. Aris Thorne watched, as he had for three Martian years, from the blind nestled in the crimson cliffs overlooking the Dry Tangle basin.

  Below, a young *keth* – long-limbed, with fur the colour of dust and large, black eyes devoid of whites – nosed through a scatter of debris near the base of a sandstone spire. Its movements were hesitant, exploratory. It paused, nostrils flaring over a specific object: a Y-shaped stick, weighted asymmetrically with lumps of fused silicate at each end, bound with a complex knot of braided vine. The *keth* didn’t study it. It picked it up.

  Immediately, its body changed. The hesitancy vanished, replaced by a strange, flowing rigidity. It gripped the stick at precise points dictated by the knots. Its arm lifted, swung in a short, sharp arc – *thwack* – impacting a specific, worn patch on the spire’s base. A shower of dust fell. Without pause, it reversed the motion, sweeping the stick low in a scooping arc that ended with the weighted end tapping a sequence on three specific river pebbles arranged in a line. *Tap-tap-tap*. Each pebble was smooth and dark, unlike the surrounding stones.

  Thorne held his breath. He’d seen adults do this. This was the first time he’d witnessed a juvenile initiate the sequence. The *keth* wasn’t mimicking a living elder; there were none nearby. It was interacting solely with the dead elder’s artifact.

  The sequence continued – a precise dance dictated by the object. A pivot on the left foot, a flick of the wrist that sent the stick humming through the air just so, narrowly missing a spiny plant, ending with the weighted end lodging firmly into a deep groove worn into a flat rock nearby. The *keth* held the pose, trembling slightly with the exertion of unfamiliar muscles pushed into precise alignment. Then, it relaxed. It pulled the stick free.

  It didn’t drop it. It stared at the groove, then at the stick. With careful, almost clumsy fingers, it adjusted the knot binding the larger silicate weight, tightening a specific loop. It hefted the stick again. This time, its swing towards the sandstone spire was fractionally smoother, the impact slightly louder. It re-ran the entire sequence. The scoop was deeper, the taps on the pebbles more resonant. It lodged the stick again in the groove. A perfect fit.

  The *keth* then did something Thorne hadn’t quite grasped before. It didn’t discard the modified stick. It deliberately placed it back into the scatter of debris, positioning it carefully atop a specific flat stone, aligning it with the groove in the distance. It nudged the three dark pebbles into a slightly tighter line. Then, it moved on, its posture changed, carrying an echo of the dead elder’s ingrained knowledge in its muscles and nerves.

  Thorne slumped back against the cool rock of the blind. The epiphany wasn’t a thunderclap, but a slow, chilling seep of understanding, like groundwater rising. He’d documented the cumulative improvements – the deeper grooves, the more efficient weights, the increasingly complex knots that seemed to encode finer motor control. He’d hypothesized a kind of physical programming. But witnessing the *transfer*…

  They weren’t learning *about* the world. They were *rehearsing* the world, as left for them by the dead. The knotted cord wasn’t a *symbol* for a grip; the grip was physically imposed by the knot’s structure. The weighted stick didn’t *represent* a specific swing-path; holding it forced the tendons and bones into the necessary configuration. The groove in the stone wasn’t an *instruction*; it was the final, physical receptacle for the action sequence, its shape the unspoken validation of correctness. The young didn't interpret; they *enacted*. They didn't innovate through insight, but through the slight misfit between their unique body and the inherited choreography, a misfit resolved physically in the moment, then frozen into a new artifact. It was culture written in bone-deep reflex, inherited not through meaning, but through imposed motion. Knowledge persisted, evolved even, without a single spark of shared intention, without a single thought *about* the thought. The dead elder hadn't *meant* to teach efficient silicate extraction; it had merely left the shape of its own successful action, and the juvenile, by performing that shape, had accidentally refined it. Meaning was entirely absent. Only consequence remained.

  Later, cataloging the new artifact placement, Thorne ran his fingers over the adjusted knot. It was tighter, more efficient. An improvement. A legacy. He looked at the silent basin, dotted with the physical ghosts of ten thousand dead *keth*, each a Popperian genius rehearsing its life internally, then leaving its hard-won solutions not as wisdom, but as a trap for the body, a snare for the limbs of the future. Cumulative? Undeniably. Cultural? In a horrifyingly literal sense. Gregorian?

  He knew where he drew the line. Gregorian creatures escape the solitary confinement of individual experience by sharing *symbols* – arbitrary, recombinable tokens that *stand in* for things and actions, detachable from the immediate context. Words let you say "water over the ridge," without carrying the ridge or the water, allowing foresight, abstraction, lies, poetry. The *keth*? They shared the ridge itself, reshaped by a dead hand. They shared the action itself, bound into wood and cord. Their "tools" weren't symbols; they were frozen behaviors, physical prods coercing re-enactment. They stood on a vast pile of dead Popperians, their culture a magnificent, silent clockwork wound by the departed. But without the arbitrary sign, without the ghost of meaning flitting between them, they remained forever trapped in the echo chamber of enacted legacy, brilliant dancers in a ballet choreographed by corpses. They were the ultimate Popperians, inheriting not ideas, but rehearsals.
