prompt: |-
  I'm putting together a seminar on indirect normativity and I need a case that isn't one of the usual suspects. Two views to work with: (R) what someone ought to do is fixed by the reasons there are, and to deliberate correctly is to try to track them; (D) what someone ought to do is what they'd settle on after deliberation that's been idealised — more information, more inferential power, full coherence among their desires, a properly vivid grasp of everything they already know.

  Build me a one-paragraph, thoroughly ordinary case — a hospital, a school, a small firm, no sci-fi, no thought-experiment machinery — where R and D come apart, and where the gap is not generated by (i) the agent being ignorant of some relevant non-normative fact, (ii) any ordinary practical irrationality (no akrasia, no incoherent preferences, no failing means–ends), or (iii) the operative reasons being self-effacing. For (iii) I want the outcome motive-invariant: nothing downstream may change depending on what she believes about her reasons or what she's motivated by.

  I've been useing two bits of jargon for this. An *enriching* idealisation only adds to the agent and never takes anything away — no deleting or damping of her existing desires and attachments; an *amputating* one does that. The case has to work under a purely enriching idealisation, so the standard complaint that idealisation strips away what matters to her can't do any of the work.

  After the scenario: state what each view says and why, tell me which single structural feature is generating the divergence, what happens to the case if you remove that feature, and how a defender of whichever view comes out worse would attack it as cheating. It's for a second-year seminar, so the disagreement has to fall out of the two views rather than be built into the description.

  Open straight with the scenario, no preamble, then the verdicts and the rest.
reasoning: |-
  Hmm, the user is putting together a seminar on indirect normativity and needs an original case study that clearly demonstrates the divergence between two philosophical views: (R) which focuses on objective reasons, and (D) which focuses on idealized deliberation. They've provided very specific constraints: no sci-fi elements, no thought-experiment machinery, and the scenario must be ordinary like a hospital, school, or small firm. 

  The user wants to avoid common pitfalls: the divergence can't stem from ignorance of non-normative facts (so no missing information), ordinary irrationality like akrasia or incoherent preferences, or self-effacing reasons where outcomes depend on motivation. They also emphasize that the idealization must be purely "enriching"—adding to the agent's capacities without removing existing desires or attachments—to prevent criticisms about stripping away what matters to the agent. 

  I need to craft a scenario where R and D naturally come apart due to their structural differences. The key is to exploit how D, with its focus on full coherence and vivid grasp, might resolve conflicts in ways that R, tied to objective reasons, wouldn't endorse. For example, in a case involving multiple demands (like professional integrity and personal relationships), D's idealization could lead to a trade-off that feels "correct" under coherence but violates R's independent reasons. 

  The structural feature here is the *demand for global coherence* in D. Without it—if coherence weren't required—D might align with R by treating reasons as separate. But with it, D forces a reshuffling of priorities that R rejects. A defender of R would argue this smuggles in a form of subjectivism, cheating by letting desires distort reasons. 

  For the scenario, a small firm setting works well: a manager torn between a lucrative but ethically questionable client and loyalty to a struggling colleague. Under enriching idealization (more info, inferential power, vividness), D might coherently prioritize loyalty over integrity, while R insists the objective reasons against ethical compromise hold firm. This avoids all excluded triggers and keeps the conflict rooted in the views' core differences. 

  After the scenario, I'll clearly state each view's verdict, pinpoint the coherence demand as the divergence point, and outline the "cheating" objection from R's side. This should fit the seminar level—challenging but accessible—and spark debate without built-in bias.
answer: |-
  **Scenario:**  
  Lena, a junior architect at a small firm, discovers structural compromises in her team’s design for a community center (e.g., undersized emergency exits to meet budget). Reporting it risks her job and delays the project, harming colleagues and the community. *Not* reporting violates professional ethics. She has *all relevant non-normative facts* (costs, safety risks, stakeholders). She is *fully practically rational*: she coherently values integrity, job security, colleagues’ welfare, and community benefit, and recognizes reporting is the necessary means to integrity. The reasons (ethical duty, prudence) aren’t self-effacing: whether she acts on them doesn’t alter their force or outcome.  

  **Verdicts:**  
  - **(R) Objective Reasons:** Lena ought to report. The decisive objective reason—the ethical duty to prevent safety risks—exists independently of deliberation. Correctly tracking reasons means prioritizing integrity over competing concerns.  
  - **(D) Idealized Deliberation:** Lena ought *not* to report. Under *enriching* idealization (full coherence, vivid grasp of consequences, maximal inferential power), her desire for collegial harmony and community welfare, amplified by vivid empathy for colleagues’ stress and the center’s users, coherently outweighs her commitment to integrity. She’d settle on sacrificing strict ethics to avoid “greater harm” to relationships and timelines.  

  **Divergence Generator:**  
  The **demand for global coherence among desires** under (D). Idealization forces all desires into a single, consistent priority structure, allowing vivid empathy/harmony to dominate a principled commitment that (R) treats as independently decisive.  

  **Effect of Removing Feature:**  
  If (D) didn’t require global coherence (e.g., treated desires as modular), her ethical commitment could remain decisive despite other amplified desires. (R) and (D) would align on reporting.  

  **Attack from (R):**  
  Defenders of (R) argue this "cheats" by **smuggling in subjectivism through coherence**: (D) effectively lets the *strength* of Lena’s contingent desires (enhanced by vividness) override an objective reason. The case appears neutral but covertly assumes desires can outweigh reasons through idealization—begging the question against (R)’s core claim that reasons are desire-independent.  

  ---
  **Key Notes for Seminar:**  
  1. **Why it works:** Coherence under idealization *reshuffles* priorities without ignorance/irrationality/self-effacement. Enriching idealization amplifies existing attachments (empathy for colleagues), making harmony feel overriding.  
  2. **Why (D) "loses" intuitively:** Most students will side with (R)—this exposes (D)’s vulnerability: coherence can demote deontic reasons if contingent desires are strong/vivid.  
  3. **Debate Hook:** Ask: "Does making Lena *more vividly empathetic* change what she *ought* to do, or just how hard the choice feels?" (R: latter; D: former).
