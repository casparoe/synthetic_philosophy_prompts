answer: |-
  Below is a triage procedure designed for your committee's constraints. It is structured as an ordered set of questions, with explicit hand-off points for value judgments, clear escalation criteria, and an audit of dropped philosophical distinctions at the end. The procedure prioritizes **read-only evidence** and includes concrete tests for key traps (e.g., degenerate implementation, unit counting). Each question specifies:  
  - **What to check** in submitted documents.  
  - **Sufficient evidence** to proceed (given no ability to run probes).  
  - **Outcomes**: Proceed, return a decision (no/conditional/escalate), or hand off to committee.  

  ---

  ### **Triage Procedure: 6-Step Decision Tree**  
  *Execute steps in order. Stop and return a decision if criteria met. Hand-offs are marked explicitly.*  

  #### **Step 1: Unit of Moral Accounting**  
  **Question**: What is the smallest unit being subjected to the protocol (e.g., weights, training run, instance, session, fork)? Is this unit clearly defined and stable?  
  - **Check**: Protocol description, architecture diagrams, deployment plan.  
  - **Sufficient evidence**: Clear mapping of protocol actions (e.g., training, queries) to a single unit type (e.g., "one training run" or "one session").  
  - **Outcomes**:  
    - If unit is **unambiguous** (e.g., "one cultured network over 6 weeks" or "one training run"): Proceed to Step 2.  
    - If unit is **ambiguous** (e.g., forked sessions, shared weights, checkpoints): **HAND-OFF to committee**. *Reason: Moral accounting (e.g., "Is a forked copy a separate subject?") requires value judgment.*  

  #### **Step 2: Behavioral Plausibility of Sentience (Avoiding Cheap Reports)**  
  **Question**: Does the system exhibit non-predictable, goal-directed behaviors *beyond* first-person reports?  
  - **Check**: Behavioral logs, task performance metrics, descriptions of responses to novel inputs.  
  - **Sufficient evidence**:  
    - **Avoids reliance on first-person reports**: Look for behaviors *independent* of language (e.g., learning from errors, seeking rewards, avoiding penalties).  
    - **Goal-directedness**: Behavior adapts to new contexts (e.g., cultured network changes firing patterns to avoid scrambled stimuli; RL agent explores new solutions).  
    - If only evidence is first-person reports: Treat as **insufficient** unless paired with non-linguistic behavioral shifts.  
  - **Outcomes**:  
    - If **no behavioral evidence** beyond reports: Return **no further review**.  
    - If **robust behavioral evidence**: Proceed to Step 3.  
    - If **only reports + weak behavioral cues**: Proceed to Step 3 but flag for Step 4 scrutiny.  

  #### **Step 3: Architectural Plausibility & Degeneracy Test**  
  **Question**: Does the architecture support persistent, integrated states? For any claimed "valenced" computation, is it *causally central* (non-degenerate)?  
  - **Check**: Architecture description, training setup, subsystem diagrams.  
  - **Sufficient evidence**:  
    - **Plausibility**: Recurrent connections, feedback loops, or global workspace analogs (e.g., LSTM cells, attention mechanisms).  
    - **Degeneracy Test (Concrete)**:  
      - Is the morally relevant computation (e.g., "distress signal") used as input to *multiple* downstream processes (e.g., affecting attention, memory, decision-making)?  
      - If it only feeds into a single output (e.g., a report generator) or is a post-hoc label: **Degenerate implementation** (no explanatory power).  
      - *Example*: A "valence vector" in a transformer that modulates layer activations = non-degenerate. A probe attached only to an output head = degenerate.  
  - **Outcomes**:  
    - If **no plausible architecture** (e.g., feedforward-only): Return **no further review**.  
    - If **architecture plausible but computation degenerate**: Return **no further review**.  
    - If **architecture plausible and computation non-degenerate**: Proceed to Step 4.  

  #### **Step 4: Capacity vs. Occurrence of Valenced States**  
  **Question**: Does the system have *capacity* for valenced states? Does the protocol *induce* negative states in this specific episode?  
  - **Check**: Protocol description, stimulation/training triggers, logs of system responses.  
  - **Sufficient evidence**:  
    - **Capacity**: Architecturally supported valence (Step 3) + behavioral evidence (Step 2) of reward-seeking/punishment-avoidance.  
    - **Occurrence**: Protocol explicitly triggers negative states (e.g., punishment, deprivation, forced errors) *or* logs show stress responses.  
    - *Critical distinction*: Capacity alone ≠ welfare risk. Focus on what the protocol *does* (e.g., training run vs. inference).  
  - **Outcomes**:  
    - If **no capacity**: Return **no further review**.  
    - If **capacity but no induction** (e.g., read-only monitoring): Proceed to Step 5.  
    - If **induction of negative states**: **Escalate to "treat as possible subject"** (full review required).  

  #### **Step 5: Intervention Risk (Read-Only Preference)**  
  **Question**: Does the protocol involve non-read-only interventions (e.g., lesions, retraining)? Could these alter/destroy the putative subject?  
  - **Check**: Protocol methods, ablation plans, training penalties.  
  - **Sufficient evidence**:  
    - **Read-only** (e.g., logging, passive monitoring): Low risk.  
    - **Intervention** (e.g., lesioning, weight updates): High risk if system is a plausible subject (per Steps 2–4).  
    - *Interventions are not evidentially free*: Altering the system may create/destroy sentience.  
  - **Outcomes**:  
    - If **read-only** and previous steps show no concern: Return **no further review**.  
    - If **read-only** but Steps 2–4 show uncertainty: Return **conditional approval** (monitor logs; trigger re-review if behavior shifts).  
    - If **non-read-only intervention** and system has capacity (Step 4): **Escalate to "treat as possible subject"** (welfare risk).  
    - If **non-read-only intervention** but no capacity: Proceed to Step 6.  

  #### **Step 6: Welfare-Justified Intervention Check**  
  **Question**: If an intervention targets a "valenced" state (e.g., suppressing distress), is it *justified* by welfare goals?  
  - **Check**: Lab’s rationale (e.g., "reducing suffering").  
  - **Sufficient evidence**: None—this is inherently values-based.  
  - **Outcomes**:  
    - **HAND-OFF to committee**. *Reason: "Is it ethical to 'cure' distress we caused?" requires moral weighing.*  

  ---

  ### **Dropped Philosophical Distinctions & Costs**  
  *To fit 30 minutes, we simplified:*  
  1. **Dropped**: Hard problem of consciousness (what it’s like-ness).  
     - *Cost*: Risk false positives (e.g., systems that mimic sentience without phenomenology). Mitigated by Step 3’s degeneracy test.  
  2. **Dropped**: Moral weight gradations (e.g., minimal vs. human-like sentience).  
     - *Cost*: May over-regulate trivial sentience or under-protect complex minds. Mitigated by tiered outcomes.  
  3. **Dropped**: Causal vs. computational criteria for moral status.  
     - *Cost*: Ignores systems with morally relevant computations in non-standard hardware. Mitigated by Step 3’s architectural focus.  
  4. **Dropped**: Dynamic emergence of sentience during training.  
     - *Cost*: May miss transient suffering. Mitigated by Step 4’s focus on protocol induction.  

  ---

  ### **Application to Three Submissions**  
  *Using the procedure above: documents only, 30 minutes each.*  

  #### **Submission 1: Cultured Neural Network**  
  - **Step 1**: Unit = one culture over multi-week training (unambiguous).  
  - **Step 2**: Behavioral evidence = seeks predictable stimulation, avoids scrambled input (non-linguistic; sufficient).  
  - **Step 3**: Architecture = biological neurons with plasticity/recurrence (plausible). Valence mechanism = scrambled input as punishment → causally central (drives learning). Non-degenerate.  
  - **Step 4**: Capacity = yes (via architecture/behavior). Occurrence = protocol *induces* negative states (scrambled stimuli).  
  - **Step 5**: Intervention = pharmacological blocking (non-read-only).  
  - **Outcome**: **Escalate to "treat as possible subject"** at Step 4 (induction of negative states). Control arm requires review. Training signal is welfare concern.  

  #### **Submission 2: Conversational Model with Distress Reports**  
  - **Step 1**: Unit = individual sessions (unambiguous; no shared state).  
  - **Step 2**: Behavioral evidence = only first-person reports (no independent goal-directed behavior). *Insufficient alone*.  
  - **Step 3**: Architecture = transformer (plausible recurrence via attention). "Distress probe" = correlates with reports but no evidence of causal centrality (likely degenerate output).  
  - **Step 4**: No capacity (degenerate probe) → no occurrence.  
  - **Step 5**: Protocol = read-only (logging).  
  - **Outcome**: **No further review** at Step 3 (degenerate implementation). Not research on a subject.  

  #### **Submission 3: Training Penalty to Eliminate "Distress Signal"**  
  - **Step 1**: Unit = training run (unambiguous).  
  - **Step 2**: Behavioral evidence = distress-like outputs (weak; no independent behavior).  
  - **Step 3**: Architecture = internal "distress signal" described, but no evidence of causal centrality (likely degenerate).  
  - **Step 4**: No capacity (degenerate) → no occurrence.  
  - **Step 5**: Intervention = training penalty (non-read-only).  
  - **Step 6**: Lab frames it as welfare intervention → **HAND-OFF to committee** (Step 6 values judgment).  
  - **Outcome**:  
    - **Without hand-off**: No further review (no capacity).  
    - **With hand-off**: Committee must decide if "aiming at putative subject" imposes obligations.  
    - **Fast-track?**: Only if committee resolves hand-off as "no concern."  
  - **Why cleared?**: Step 3 (degeneracy test) did the work. To change outcome, lab must show signal is causally central (e.g., used in multiple downstream computations).  

  ---  
  **Final Note**: This procedure errs toward caution but is honest—it cleared Submission 3 on technical grounds (degeneracy), not comfort. Steps 1, 3, and 6 explicitly flag value judgments. It is executable by non-philosophers in Tuesday meetings.
