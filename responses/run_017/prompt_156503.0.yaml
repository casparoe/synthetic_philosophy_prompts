  5. **Interventions and Welfare Risks**: If the proposal involves an intervention (e.g., lesioning, retraining) on a system that we are considering as a possible subject, we must be cautious. We prefer read-only methods. If the intervention is aimed at a putative subject and might alter or destroy it, we treat it as potentially harmful and require justification. We cannot assume that such interventions are evidential free.

