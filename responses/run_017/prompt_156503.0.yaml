  - **No further review**: The system does not show any plausible markers of sentience, and the protocol does not involve interventions that might create sentience.
  - **Conditional approval with monitoring and a trigger for re-review**: There is some plausible but weak evidence of sentience, or the protocol might induce sentience in a way that is uncertain. We set conditions (e.g., monitoring for specific behaviors, logging specific internals, and a trigger such as a certain level of behavioral change) and require re-review if the trigger is hit.
