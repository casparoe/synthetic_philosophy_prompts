  We are designing a triage procedure for the Committee for Animal and Computational Subjects. The goal is to decide whether a proposed system or protocol involves a possibly sentient subject and, if so, at what tier (no further review, conditional approval, or treat as a possible subject). The procedure must be an ordered set of questions, with clear stopping points and hand-offs for value judgments. We must account for the time constraint (30 minutes per submission) and reliance solely on submitted documents.

  Key traps to address:
  1. Gap between producing distress reports and actual sentience (especially when trained on human text about suffering).
  2. Distinguishing genuine realization of a morally relevant computation from degenerate implementation (with a concrete test).
  3. Counting: unit of moral accounting (e.g., weights, runs, sessions, forks) and flagging when it's a hand-off.
  4. Distinguishing capacity for valenced states vs. actual occurrence in an episode (e.g., training run vs. served instance).
  5. Prefer read-only evidence: avoid interventions that might create/destroy the subject.

  The procedure must be usable by non-philosophers and honest about dropped distinctions.

  We will then apply the procedure to three cases.

  Procedure Design:

  We structure the procedure as a decision tree with explicit hand-off points. The steps are:

  1. **System Type and Scope**: Identify what the system is and the unit under consideration (e.g., a training run, an instance, a session). If the unit is ambiguous (e.g., forked copies, checkpoints), flag it as a hand-off to the committee for a value judgment about the unit of moral accounting.

  2. **Behavioral and Functional Profile**: Examine the behavioral logs and functional description. We are looking for evidence of goal-directed behavior, flexibility, and coherence that goes beyond simple input-output mapping. If the system only produces pre-scripted or highly predictable responses, it may not be a candidate for sentience. If there are elaborate first-person reports, we must be cautious because they might be cheaply elicited from a model trained on human text. We require additional evidence beyond such reports.

  3. **Architectural Plausibility for Sentience**: Examine the architecture description. We are looking for:
     - Recurrent processing (feedback loops, memory) that might support a persistent state.
     - Mechanisms for internal evaluation (e.g., reward prediction, error signals) that could underpin valence.
     - A test for degenerate implementation: Check if the computation in question (e.g., a "valence" circuit) is causally central to the system's behavior. This means:
       - The system's behavior would change if this computation were altered (without retraining the whole system) and the change would be in a way that the computation explains. For example, if the system has a module that computes a "pain signal" and that signal is used by multiple downstream modules to adjust behavior, then it is causally central. If it is only a post-hoc label that doesn't affect behavior, then it is degenerate. Without the ability to run ablations, we rely on the architecture description: we look for explicit pathways that use the computed state in multiple ways and for the state being a common cause of multiple behaviors. If the lab's description does not show such integration, then it's degenerate.

  4. **Valence and Suffering**: We need to distinguish between a system having the capacity for valenced states and the actual occurrence of a negative valenced state in the episode under review.
     - For capacity: We look for evidence in the architecture of mechanisms that could support positive and negative evaluations (e.g., reinforcement learning signals, homeostatic regulation, or analogous mechanisms). Also, behavioral evidence of learning from rewards/punishments.
