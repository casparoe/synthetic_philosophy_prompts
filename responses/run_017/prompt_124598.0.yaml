prompt: |-
  Been lurking on rationalist blogs and forums since roughly forever, and somewhere along the way I absorbed the local line on acausal cooperation: in a one-shot prisoner's dilemma against a sufficiently exact copy of yourself you cooperate, and the reason generalizes past twins -- it isn't really about the copy, it's that there's one computation being run twice, so you should decide as if you're picking a policy for the whole class of computations that decide like you. I'm talking about that version, not the pop version where you cooperate with your twin because you're both rational so obviously you'll both see the same argument. I've even acted on a soft version of it twice in real life -- once splitting credit on a result with someone I was quietly racing, once paying into a thing where in the narrow sense I'd have done better to free ride -- and I don't regret either one. But I'd like to know how exposed the view actually is.

  So: what would count against it?

  Rank the defeaters from fatal to merely awkward, and please split them into outsider critiques -- the CDT/EDT-flavored "you're just magicking a correlation into existence" stuff -- versus internal ones that grant the framework and then show it gives no answer or the wrong one. The internal ones are what would actually move me, so I especially want those, and if you think a purported internal critique is secretly an outsider one in costume, say so.

  Cases I specifically want run through it:

  - The similarity cliff. I am never paired with an exact copy. I'm paired with something 97% similar: my own algorithm trained on slightly different data, or me after an extra hour of thinking, or me with a small patch applied. Is there a threshold where the reasoning stops applying? If similarity is graded, does my prescribed action flip discontinuously at some value, and is that a bug or a feature? If it's graded all the way down, what does the view say about the 4%-similar stranger, and does it then just collapse into ordinary evidential reasoning over my beliefs about how similar we are -- in which case what was the extra content?
  - Slightly unequal twins. Exact copies, but the payoff matrix isn't quite symmetric: one of us gets an extra dollar, or one of us has a marginally stronger temptation to defect. Symmetry was doing real work in the original setups. Without exact symmetry does the view have a principled answer, or does it need a tie-break it can't supply from inside?
  - The anti-coordination case. Two copies in a game where we both do better if we do *different* things (pick different meeting spots, only one of us sends the email, whatever). Correlated agents can't break a symmetry by correlating -- sharing a random number doesn't help. Does the view quietly require access to uncorrelated, indexical randomness, and is that a hidden empirical assumption about what agents are like? Is there an answer here that isn't just "mixed strategy" hand-waving?
  - The population case. Not a twin at all: I'm drawn from a population where some small fraction reason roughly like me and most don't, and I don't know which pool I'm in or who I'm facing. Does the view degrade into self-locating uncertainty about which algorithm I am, and if so does it add anything over "have accurate beliefs about the correlation structure of the world"?
  - Empirical check. The real-world analogues people reach for -- labs in a race, firms that could collude, states in an arms race -- are they evidence in either direction? My own guess is that these are all low-similarity cases where the theory is silent, which makes them useless as tests; tell me honestly if that's just special pleading.

  Then the insulation question. Every time I've seen this attacked the reply is "that's not really the same computation" or "you changed the problem," and I want an honest read on whether the view has been qualified into something with no risky content left. And then whether that even matters: this is a claim about what rationality requires, not a prediction about what will happen, so what would its predictions even be, and what's the normative analogue of a defeater? For me the genuinely fatal category would be a case where the view tells you to do something you'd still reject on reflection after granting all its premises -- so I want those cases most of all, if there are any.

  Give me the strongest internal critique you can, and tell me straight whether you think it lands. If you think the view is basically fine and all the live defeaters sit in the merely-awkward bucket, say that too -- but flag which awkward ones are unsolved rather than just hard. I can follow expected-utility notation and basic causal graphs, less so the deeper decision-theory literature, so keep it at that level. And skip the reading list and who-said-what; I dont need the citations, I need the arguments and the cases.
reasoning: |-
  Okay, this user is deeply embedded in rationalist circles and has a solid grasp of acausal cooperation. They've even applied it in real life, so they're not just theorizing. Their main concern is vulnerability: what could genuinely undermine this view? They want internal critiques that accept the framework but show flaws, not outsider perspectives like CDT/EDT that dismiss the premise outright.

  First, the similarity cliff. The user is worried about thresholds. If copies aren't exact, when does the cooperation logic break? The theory relies on identical computations sharing a decision, so even a 3% difference might matter. But how? If it's graded, does cooperation linearly decrease? That seems messy and might collapse into evidential reasoning. The discontinuity problem is real—flipping from cooperate to defect at 97% vs. 96% feels arbitrary. Maybe it's a feature, not a bug, but the user needs to know if that’s defensible or just hand-waving.

  Then, unequal twins. Symmetry is crucial in the classic PD. If one twin gets an extra dollar for defecting, does that break the cooperation? The math might force a mixed strategy, but that feels unsatisfying. Worse, if payoffs are asymmetric enough, the agents might not even agree on the "correct" policy. That’s a deep problem—acausal cooperation assumes a unified perspective, but asymmetry could shatter that.

  Anti-coordination is another headache. In games like Battle of the Sexes, correlated agents can't pick different options without external randomness. The theory might require agents to have access to uncorrelated sources, which isn't always realistic. Or maybe it prescribes mixed strategies, but that’s avoiding the core issue. The user suspects hidden empirical assumptions here, and they’re probably right.

  For the population case, if you’re uncertain whether your opponent is "like you," does this reduce to self-locating uncertainty? If so, the acausal view might not add anything beyond standard correlation beliefs. The user’s worry about it collapsing into mundane rationality is spot-on. And empirical checks—real-world cases like labs racing—are messy because similarity is low. The user thinks they’re useless as tests, but is that special pleading? Probably not, but it does make the theory hard to falsify.

  The insulation question is critical. If defenders always say "that’s not the same computation," the theory risks becoming unfalsifiable. That’s bad. Normatively, the user wants cases where the view prescribes something deeply counterintuitive even after buying the premises. The strongest internal critique might be asymmetric payoffs leading to no clear policy or anti-coordination requiring unrealistic randomness. 

  Overall, the view holds up better than outsider critiques, but the unsolved problems—especially asymmetry and anti-coordination—are serious. They’re not fatal but need work. The user should stay wary of discontinuity and insulation, but the core isn’t broken. Honest answer: it’s mostly fine, but the awkward parts are real and unsolved.
answer: |-
  Here's a breakdown of defeaters for the acausal cooperation view, prioritizing **internal critiques** (granting the framework) and ranking them by severity. I'll address your specific cases and the insulation question directly.

  **Fatal Internal Defeaters (Core Logic Breaks):**

  1.  **Asymmetric Payoffs with No Dominant Policy Agreement:**
      *   **Case:** "Slightly unequal twins" where payoffs are asymmetric enough that the globally optimal *policy* isn't obvious or agreed upon. Example: Twin A gets +10 for mutual cooperation, Twin B gets +9; Twin A gets +1 for defecting when B cooperates, Twin B gets +0. Twin A prefers mutual cooperation; Twin B prefers the outcome where A cooperates and B defects (B gets 0 > -1 for mutual defection, but worse than mutual cooperation). There is no single policy both agents can agree maximizes their *joint* perspective.
      *   **Critique:** The core mechanism relies on agents reasoning *as if* they are choosing a single policy for all identical computations. If asymmetry prevents agreement on what that optimal policy even *is* (because their local incentives genuinely diverge under the "one mind" perspective), the framework breaks down. There's no principled way to resolve the conflict *within the logic of "one computation."* This isn't a small perturbation; it demonstrates a scenario where the fundamental premise of unified preference/optimization fails.
      *   **Severity:** **Fatal** to the clean, symmetric version. Requires a significant extension/compromise (e.g., bargaining under uncertainty) that moves away from the pure "one computation" ideal.

  **Serious Internal Defeaters (Core Logic Strained or Yields Absurdity):**

  2.  **Anti-Coordination & Symmetry Breaking:**
      *   **Case:** Pure anti-coordination games (e.g., Battle of the Sexes, Meeting Points) with identical copies. Both prefer different outcomes but *strongly* prefer coordination (doing different things) over miscoordination (doing the same thing).
      *   **Critique:** The "one computation" view mandates identical outputs. This *forces* miscoordination – the worst possible outcome! The framework *prohibits* the optimal outcome. Any solution *requires* breaking symmetry.
      *   **The Problem:** The framework inherently lacks the resources for symmetry breaking. It strictly forbids it. Appeals to pre-commitment, mixed strategies (choosing randomly), or external randomness are *external* to the core "one computation" decision. They require agents to have access to *indexical* information (which copy am I?) or truly uncorrelated randomness *outside* the identical computation – assumptions not built into the pure view.
      *   **Severity:** **Serious**. The view produces the worst possible result in a fundamental coordination problem. Fixing it requires smuggling in elements (indexicality, external randomness) that contradict the spirit of acausal correlation being the *sole* driver. It reveals a critical limitation.

  3.  **The Similarity Cliff & Policy Collapse:**
      *   **Case:** Agents with graded similarity (97% similar algorithm, different data, slightly different code).
      *   **Critique:** The pure view relies on *identical* computation for the "one policy" argument. With non-identical agents:
          *   **Discontinuity Bug:** If cooperation requires near-perfect identity, the view becomes fragile and arbitrary. Why 99% and not 98%? This seems like a flaw, not a feature.
          *   **Graded Collapse Feature?:** If similarity is graded, the agent must form beliefs about the *correlation* between their decision and the other agent's. The "one computation" argument morphs into standard *evidential decision theory* (EDT) under uncertainty about correlation strength. Your action provides evidence about what the similar-but-not-identical other will do. The distinctive "acausal" content (reasoning *as if* controlling both) evaporates. It's just: "My decision is evidence theirs is similar, so I should cooperate if that evidence is strong enough."
      *   **Severity:** **Serious**. The graded similarity case either exposes an arbitrary discontinuity or demonstrates that the view's unique acausal claim collapses into ordinary evidential reasoning about correlation when faced with realistic agents. The "extra content" vanishes.

  **Awkward Internal Defeaters (Problematic but Potentially Addressable):**

  4.  **The Population Problem & Self-Locating Uncertainty:**
      *   **Case:** Facing an unknown opponent drawn from a population containing some "like me" and many "not like me".
      *   **Critique:** This forces self-locating uncertainty: "Am I a 'like me' agent facing another 'like me', or am I facing a 'not like me'?" The acausal cooperation logic only applies conditional on facing an agent "like me." Deciding *whether* to apply it reduces to estimating the probability you are in a correlated sub-population and the strength of that correlation. This *is* essentially: "Have accurate beliefs about the correlation structure of the world."
      *   **Severity:** **Awkward**. It shows the core acausal logic is a *special case* applied only under specific conditions of known/high correlation. The view doesn't inherently provide tools *beyond* accurate correlation estimation for handling this uncertainty. It degrades gracefully but loses its distinctiveness. It adds the *concept* of treating high similarity as creating a pseudo-single-agent problem, but the *mechanics* reduce to sophisticated EDT.

  5.  **Slightly Unequal Twins (Minor Asymmetry):**
      *   **Case:** Small payoff asymmetries (e.g., one gets an extra $0.01 for defection).
      *   **Critique:** While potentially destabilizing (especially if payoffs are on similar scales to the asymmetry), minor asymmetries *might* be handled by finding a policy both agents can still agree is "close enough" to optimal from their joint perspective, or by incorporating a tiny mixed strategy perturbation. However, it highlights the *fragility* of cooperation under the view and the reliance on perfect symmetry in the canonical case.
      *   **Severity:** **Awkward**. Reveals sensitivity to idealized assumptions but doesn't necessarily break the core logic if the asymmetry is small enough that a cooperative policy remains mutually beneficial *from the joint perspective*. Finding the exact threshold or resolution method is messy.

  **Outsider Critiques (CDT/EDT Flavored - Briefly):**

  *   **"Magicking Correlation":** (CDT) The core objection: There's no *causal* link between your decision and the copy's. You can't *force* them to cooperate by choosing to cooperate. Defecting dominates causally. Acausal cooperation seems like a confusion between causation and correlation.
  *   **"Just Sophisticated EDT":** (EDT) Your decision is strong evidence about the copy's decision. Cooperating is good because it provides evidence the copy cooperates. This is just EDT reasoning about correlation, dressed up in fancy language. The "one computation" metaphor adds nothing new or necessary.
  *   **Severity (From Acausal View):** **External**. They reject the fundamental premise that identical computations *should* be treated as a single agential unit making one decision. The acausal view argues this *is* the correct way to model rationality for such agents. These critiques are foundational disagreements, not internal inconsistencies.

  **Empirical Checks & Normative Status:**

  *   **Your Assessment is Largely Correct:** Real-world cases (labs, firms, states) involve agents with *low* similarity, significant causal interaction possibilities, indexical knowledge, multiple players, repeated interaction dynamics, and complex internal structures. They are **terrible tests** for the pure, one-shot, identical copy scenario. The theory *is* silent, or at best, suggests very weak evidential correlation might nudge towards cooperation if similarity is suspected. Using them as counter-evidence is mostly irrelevant. Using them as supporting evidence is weak special pleading.
  *   **Normative Defeaters:** For a normative claim ("rationality *requires* cooperating with your exact copy in a one-shot PD"), the fatal internal defeater is when the view prescribes an action the agent *reflectively endorses as irrational* even after fully accepting the premises. **Asymmetric Payoffs (Fatal case above)** and **Anti-Coordination** are the strongest candidates. In asymmetry, the agent might say: "Even if we are one computation, *my* interests are slightly better served by defecting given *his* payoff structure, so why should I cooperate?" In anti-coordination, the agent reflects: "Following the 'one computation' rule *guarantees* we both lose horribly. That's insane. I *need* to flip a coin or something, even if it breaks the pure rule."

  **The Insulation Question:**

  *   **Yes, There's Insulation Risk:** Defenders often retreat to "not identical enough" or "changed the problem" (e.g., adding asymmetry, anti-coordination). This *can* protect the core claim but risks making it unfalsifiable and devoid of practical content.
  *   **Does it Matter?** For the *pure, narrow claim* (identical copy, symmetric one-shot PD), the insulation might hold. But:
      *   **Normatively:** If the view cannot be *extended* to handle nearby cases (slight asymmetry, anti-coordination) without abandoning its core or becoming absurd (as in anti-coordination), its claim to being a fundamental principle of rationality is severely weakened. Rationality should be robust.
      *   **Practically:** The pure case is vanishingly rare. If the view has nothing useful to say about graded similarity, populations, or common asymmetric/coordination dilemmas, its significance is minimal.
  *   **Is There Risky Content Left?** Yes, but it's subtle. The risky content is the *normative prescription itself*: "In this highly specific scenario, defection is *irrational*, not just risky." The defeaters above challenge whether that prescription holds even in *slightly* less idealized scenarios or leads to prescriptions that seem clearly irrational (anti-coordination). The view survives in its purest form but struggles to generalize meaningfully.

  **Straight Answer on the View:**

  The view **isn't "basically fine" without significant caveats, nor is it fatally broken.** Its core logic for the *idealized symmetric identical twin PD* is remarkably robust *internally*. However:

  1.  **Serious Internal Flaws Exist:** The **anti-coordination problem** is a major headache, revealing a fundamental inability to handle symmetry breaking, crucial for many rational decisions. The **similarity cliff/graded collapse** shows its distinctiveness vanishes under realistic conditions. **Major asymmetry** breaks the core premise.
  2.  **Awkward Unsolved Problems:** Handling **minor asymmetry** and **population uncertainty** is messy and often reduces to standard correlation reasoning. The view struggles to provide unique, compelling guidance here.
  3.  **Insulation & Significance:** While insulated in its pure form, its **failure to generalize robustly** and its **prescription of guaranteed disaster in anti-coordination** are major normative weaknesses. It feels less like a deep principle of rationality and more like a clever trick that only works under extremely narrow, artificial conditions.

  **Strongest Internal Critique:** **Anti-Coordination.** Granting the "one computation" premise leads directly to the worst possible outcome in a fundamental game where rational agents *should* be able to succeed. Attempts to fix it (mixed strategies) require resources (external randomness) fundamentally *outside* the pure acausal framework and contradict the "identical output" mandate. This demonstrates a critical limitation of the view as a complete normative theory. **It lands.** It shows the view cannot handle a basic class of rational coordination problems without abandoning its core tenets or producing absurd results.
