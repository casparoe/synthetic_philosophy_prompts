  The bacterial spore seems the best cutoff case - it's clearly biological but challenges "ongoing activity" definitions. I'm uncertain about the giant virus genome - its uncharacterized genes might change its status.

  I'll structure this clearly with tier lists first, then comparative rankings, keeping explanations punchy and poster-ready. The departmental mailing list is intentionally provocative - perfect for sparking debate among these science-focused students.
answer: |-
  ### Tier List: What Counts as "Alive"?  
  *(Sorted by conventional biological intuition)*  

  **Tier 1: Unquestionably Living (90-100%)**  
  - **Bacterial spore (revived): 95%** — *Full metabolic revival and reproduction after dormancy.*  
  - **Tardigrade (rehydrated): 95%** — *Resumes metabolism, reproduction, and responds to stimuli.*  
  - **Slime mould solving a maze: 90%** — *Autonomous problem-solving via coordinated cell behaviour.*  

  **Tier 2: Living but Limited (70-85%)**  
  - **Immortalised human cell line: 80%** — *Metabolically active and dividing, but no organism-level function.*  
  - **Mule: 75%** — *Metabolises and responds, but cannot reproduce (sterile hybrid).*  
  - **Synthetic bacterium: 70%** — *Self-replicates with minimal genes, but many functions unknown.*  

  **Tier 3: Edge Cases (40-65%)**  
  - **Giant virus: 60%** — *Replicates using host machinery, but no independent metabolism.*  
  - **Tardigrade (tun state): 45%** — *Metabolism halted; persistence relies on structural cryptobiosis.*  
  - **Prion: 40%** — *Self-replicates by misfolding proteins, but inert and non-metabolic.*  

  **Tier 4: Not Living (0-30%)**  
  - **Fire front: 20%** — *Self-sustaining energy transfer, but no evolution or repair.*  
  - **Computer worm: 10%** — *Self-replicates and evolves digitally, but lacks organic chemistry.*  
  - **Departmental mailing list: 5%** — *Self-propagates via forwarding, but no biological basis.*  

  ---  
  ### How the Ranking Shifts Under Different Criteria  

  **1. Upkeep Ratio**  
  *(Persistence from active upkeep vs. inert stability)*  
  - *Highest:* Cell line (85%), Slime mould (80%), Rehydrated tardigrade (80%)  
  - *Lowest:* Tun-state tardigrade (10%), Prion (5%), Mailing list (0%)  
  *Shift:* Fire front jumps to Tier 3 (50% – relies on active combustion); bacterial spore drops to Tier 2 (60% – inert in dormancy).  

  **2. Astrobiology Definition**  
  *(Self-sustaining chemistry + Darwinian evolution)*  
  - *Highest:* Synthetic bacterium (85%), Slime mould (85%), Bacterial spore (80%)  
  - *Lowest:* Mule (25% – no evolution), Prion (20% – no metabolism), Fire (0%)  
  *Shift:* Computer worm leaps to Tier 3 (65% – digital evolution); giant virus drops to Tier 4 (30% – no self-sustaining chemistry).  

  **3. "Harm Test"**  
  *(Vulnerable to harm with a "good of its own")*  
  - *Highest:* Mule (90%), Cell line (85%), Tardigrade (85%)  
  - *Lowest:* Mailing list (5%), Fire (10%), Computer worm (15%)  
  *Shift:* Prion rises to Tier 3 (60% – "poisoned" by inhibitors); giant virus to Tier 2 (70% – infected by virophages).  

  ---  
  ### Key Cutoff Case  
  **Bacterial spore in permafrost**  
  *Why it’s the cutoff:* Inert and stable like a rock (low upkeep), yet crosses into "living" upon revival (metabolism/evolution). Neighbours like the tun-state tardigrade *require* specific biological reactivation; the prion lacks any metabolism even when "active".  

  ### Uncertainty Flag  
  **Giant virus**  
  *Issue:* Its "sizeable share of genes nobody can put a job to" *might* hint at unknown metabolic autonomy. Current score (60%) assumes no self-sustaining chemistry.  

  ---  
  **Poster Design Tip:** Use colour gradients (green → red) for tiers, and add blank sticky notes for students to argue placements!  

  *(Word count: 498 | Fits one A4 side at 11pt font.)*
