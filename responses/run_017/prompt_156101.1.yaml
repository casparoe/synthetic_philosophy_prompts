prompt: |-
  I am the researcher-writer for a six-part documentary series on Jesus and first-century Galilee, and over the next three months my team must assign on-screen wording to roughly forty individual sayings and episodes. For each item we choose between presenting it as something Jesus said or did, presenting it as what the earliest followers came to believe about him, or flagging it on screen as contested. There are no footnotes, narration has to sound settled without claiming false precision, and a three-person scholarly advisory panel — one fairly conservative, one skeptical, one who works mainly on the social world of Roman Palestine — must sign off on the whole list. That gives us about fifteen minutes of argument per item and rules out any verdict only one of them can live with.

  Please build me a decision procedure we can actually run in that time. Start from the familiar criteria — multiple attestation, dissimilarity from both surrounding Judaism and the early church, embarrassment, coherence with what is already established, Semitic-language phenomena, and plausibility in a Galilean or Judean setting — but do not let them stand as a checklist, since each one only grades a tradition relative to a background assumption about how the tradition grew. I need at least four additional moves built in: an audit of how the sources could be genealogically related, so that we count independent lineages rather than independent texts; a test in which any verdict is rerun against at least one rival model of transmission and downgraded if it flips; a rule against counting the same evidence twice under two criteria; and a warning flag for the selection effect built into the dissimilarity criterion, which by construction certifies only a figure unlike both the Judaism of his time and the movement that followed him. Say what counts as a sufficient answer to each step, where the procedure stops with a no, where it hands the decision to a person because the question is editorial rather than factual, and where judgment genuinely cannot be eliminated.

  Then run it on three items: the baptism by John, the saying on divorce as it appears with different exceptions in different sources, and the empty-tomb tradition, which is the one I expect you to take away from me and which my narration currently depends on. Show the steps, and close with an honest statement of what the procedure cannot do — in particular whether any set of criteria can establish who Jesus was as opposed to what was being attributed to him within twenty years of his death.
reasoning: |-
  Okay, the user is a researcher-writer for a documentary series on Jesus and first-century Galilee. They need a decision procedure to determine how to present about forty sayings and episodes from Jesus's life. The procedure must be efficient—only fifteen minutes per item—and satisfy a diverse scholarly panel. Let me start by understanding their core requirements.

  First, they want to move beyond traditional criteria like multiple attestation or dissimilarity, which have limitations. The user mentioned not treating these as a simple checklist because each criterion depends on assumptions about tradition growth. They also specified four additional moves: auditing source genealogy, testing against rival transmission models, avoiding double-counting evidence, and flagging the selection effect in dissimilarity. These points are crucial for a robust method.

  The user's deeper needs include balancing scholarly credibility with narrative clarity. The documentary needs to sound settled without overstating certainty. The advisory panel's approval is essential, so the procedure must incorporate perspectives from conservative, skeptical, and social-context scholars. The user might be concerned about biases in historical Jesus research and wants a method that minimizes individual scholar's influence while acknowledging unavoidable uncertainties.

  Now, building the decision procedure. The key is structuring it into phases: initial screening, core criteria with safeguards, and judgment calls. Phase 1 should quickly identify non-starters using source genealogy. For example, if all sources derive from one root, multiple attestation isn't valid. This step saves time by eliminating weak cases early.

  Phase 2 applies the traditional criteria but with the user's safeguards. Each criterion must be applied without overlapping evidence. For instance, if embarrassment is used for an event, coherence can't reuse the same source. The dissimilarity criterion needs a warning due to its inherent selection bias, highlighting items that pass but might isolate Jesus artificially.

  Phase 3 involves testing verdicts against rival transmission models. If flipping the model changes the outcome, the item gets downgraded to "contested." This step ensures robustness. Then, editorial judgment decides how to present the item based on the documentary's flow, especially when evidence is mixed.

  The user provided three test cases: baptism, divorce saying, empty tomb. Applying the procedure to each will demonstrate its practicality. For baptism, genealogy shows independent sources (Mark, Q, John), passing multiple attestation. Dissimilarity and embarrassment support authenticity. Testing against rival models (e.g., later interpolation) fails, so it's "said/done." Divorce saying has complex variations; Mark and Matthew's exceptions might stem from later adaptations, leading to "contested." Empty tomb faces skepticism due to single-source lineage (Mark) and potential theological shaping, so it's "believed" with a note on contested elements.

  The procedure's limitations: it can't definitively prove historical events, only assess probability based on available evidence. It relies on scholarly models of transmission, which themselves are debated. The criteria can't resolve all ambiguities, especially regarding Jesus's intentions versus early attributions. The documentary team must accept these limits and focus on transparently presenting scholarly consensus where possible.

  Ensuring the procedure fits within time constraints means each step must be concise. The initial phases filter items efficiently, leaving more time for complex cases. Editorial judgment steps allow the team to make narrative decisions when evidence is balanced. Overall, this approach balances rigor with practicality, aiming for panel approval by addressing each scholar's concerns through structured, evidence-based steps.
answer: |-
  Here’s a decision procedure designed for efficiency, scholarly robustness, and editorial clarity, incorporating your requirements. It operates in **four phases** with clear exit points, safeguards, and editorial handoffs:

  **Phase 1: Source Genealogy Audit (3 mins)**
  *   **Question:** What is the *minimum viable stemma* (family tree) for this tradition? Map sources (Gospels, Paul, other early texts) not as independent texts, but as representatives of potential independent *tradition streams* (e.g., Markan, Q, M, L, Johannine, Pauline, pre-Pauline creed/hymn).
  *   **Sufficient Answer:** Agreement on the *minimum* number of independent roots needed to explain the tradition's presence in our sources (e.g., Baptism: Markan stream, Q stream, Johannine stream = 3 roots; Empty Tomb: Markan stream only = 1 root).
  *   **Stop if No:** If *all* attestation demonstrably flows from a *single* root source (e.g., a story only in Matthew with no parallel or hint elsewhere), flag as **"Believed" or "Contested"** (depends on coherence/plausibility later) immediately. *No need for further criteria if only one lineage exists.*
  *   **Output:** Number of independent roots (N).

  **Phase 2: Core Criteria w/ Safeguards (7 mins)**
  *   **Apply Sequentially, *Forbidding Double-Counting*:** If evidence is used for one criterion, it cannot be reused for another. Assign a tentative score (+1, 0, -1) for each applicable criterion *only if the evidence is unique to that criterion*.
      *   **Multiple Attestation (MA):** Does the tradition appear in >=2 *independent roots* (N >=2)? (+1 if Yes, 0 if N=1). *(Note: This uses Phase 1 output)*
      *   **Dissimilarity (Dis):** Is the tradition *distinct* from both (a) characteristic emphases of *contemporary Judaism* AND (b) characteristic emphases/needs of the *early church* (post-30 AD)? **+ WARNING FLAG:** Passing Dis *only* isolates unique elements; it doesn't confirm historicity, just non-derivativeness. It may *exclude* authentic material typical of its environment. (+1 if clearly dissimilar both ways, 0 if ambiguous, -1 if clearly conforms to one or both).
      *   **Embarrassment (Emb):** Would this tradition likely cause *difficulty* or require *explanation/apology* for the early church? (+1 if strongly plausible, 0 if neutral/uncertain, -1 if clearly serves church interests).
      *   **Coherence (Coh):** Does it *fit well* with the *core material already established* as "Said/Done" by earlier steps? (Avoid circularity! Base on strong MA/Dis/Emb items). (+1 if strongly coherent, 0 if neutral, -1 if incoherent).
      *   **Semitic Phenomena (Sem):** Does the tradition contain linguistic features (wordplay, syntax, idioms) best explained by a Semitic (Aramaic/Hebrew) *origin* rather than Greek composition? (+1 if strong indicators, 0 if ambiguous/none, -1 if clearly Greek composition).
      *   **Contextual Plausibility (Plaus):** Is it *plausible* within the known social, economic, political, and religious realities of 1st-century Galilee/Judea? *Not* anachronistic? (+1 if highly plausible, 0 if possible but uncertain, -1 if implausible/anachronistic).
  *   **Sufficient Answer:** Tentative cumulative score (Sum = MA + Dis + Emb + Coh + Sem + Plaus). A strongly positive Sum (e.g., >= +3) suggests "Said/Done." A strongly negative Sum (e.g., <= -3) suggests "Believed." Near zero suggests "Contested."
  *   **Stop if No:** If Plaus = -1 (gross anachronism/implausibility), flag as **"Believed"** (a later development) immediately.
  *   **Output:** Tentative Verdict (Said/Done, Believed, Contested) based on Sum.

  **Phase 3: Rival Model Stress Test (4 mins)**
  *   **Question:** Does the tentative verdict *hold* under at least one credible *rival model* of transmission (e.g., "The tradition originated later than Jesus," "It reflects post-Easter theology primarily," "It serves a specific community need")?
  *   **Sufficient Answer:** If the tentative verdict *flips* (e.g., from Said/Done to Believed/Contested, or Believed to Contested) when a plausible rival model is applied, downgrade the verdict to **"Contested"**.
  *   **Stop if No:** If the tentative verdict remains stable under the rival model tested, proceed to Phase 4.
  *   **Output:** Confirmed Verdict or downgraded to "Contested."

  **Phase 4: Editorial Judgment & Uncertainty Threshold (1 min)**
  *   **Handoff to Human:** Apply these non-factual filters:
      *   **Narrative Flow:** Does presenting it as "Said/Done" or "Believed" create a jarring break or confusion *at this point* in the documentary? Should ambiguity be highlighted here for clarity?
      *   **Cumulative Weight:** Have we recently flagged several items "Contested"? Is the audience needing a moment of relative certainty (or vice-versa)?
      *   **Panel Liveability:** Is *this* verdict something all three panelists (conservative, skeptical, social-context) can *accept* as reasonable, even if not their personal favorite? (This is the "sign off" check).
  *   **Judgment Cannot Be Eliminated:** **Absolute certainty is impossible.** The procedure yields probability assessments. This step acknowledges the inherent limitations of historical reconstruction and the need for responsible storytelling. The final on-screen tag must reflect the *balance of probability based on the analysis* while acknowledging if significant doubt exists ("Contested").
  *   **Output:** Final On-Screen Tag (Said/Done, Believed, Contested).

  ---

  **Application to Your Three Items:**

  **1. Baptism by John**
  *   **Phase 1:** Independent Roots: Mark (and parallels), Q (Matt 3:13-17 / Luke 3:21-22), John (1:29-34), potentially Acts 10:37-38 (preaching pattern). **N >=3 (Strong MA).**
  *   **Phase 2:**
      *   MA: +1 (N>=2)
      *   Dis: +1 (Embarrassing - why would Messiah submit to "lesser" prophet? Not a standard Jewish expectation nor obvious church creation (some later tried to downplay it)).
      *   Emb: +1 (Clearly embarrassing - Gospels show awareness of the problem).
      *   Coh: +1 (Fits John's role as forerunner, Jesus' association with him).
      *   Sem: 0 (Narrative, less clear linguistic markers).
      *   Plaus: +1 (John's baptism movement historical; plausible a follower would join).
      *   **Sum: +5 (Strong Said/Done)**
  *   **Phase 3:** Rival Model (e.g., "Created to link Jesus to John for legitimacy"): While plausible *motivation*, the *embarrassment* and *multiple independent attestation* make it unlikely this *specific* story was *invented* whole cloth. Verdict **stable (Said/Done)**.
  *   **Phase 4:** Editorial - Core event, strong consensus base. **Final Tag: SAID/DONE (Jesus was baptized by John).**

  **2. Divorce Saying (Matt 5:32/19:9 vs. Mark 10:11-12/Luke 16:18/1 Cor 7:10-11)**
  *   **Phase 1:** Independent Roots: Mark, Q (Matt 5:32/Luke 16:18 core), Paul (1 Cor 7:10-11 - "not I but the Lord"), M? (Matt 19:9 exception). **N >=2 (Mark/Q/Paul streams).**
  *   **Phase 2:**
      *   MA: +1 (N>=2)
      *   Dis: +1 (Stricter than standard Jewish practice (Deut 24:1-4); caused problems/church debate (1 Cor 7, Matt's exception) - not *just* a church creation).
      *   Emb: 0 (Could be seen as promoting rigorous morality, which served the church; exceptions show difficulty applying it).
      *   Coh: +1 (Fits other radical ethical demands).
      *   Sem: +1 (Concise, antithetical form ("but I say to you...") common in Jesus tradition; Aramaic idiom potential).
      *   Plaus: +1 (Plausible prophetic challenge to lax interpretation).
      *   **Sum: +5 (Tentative Said/Done for *core prohibition*)**
  *   **Phase 3:** Rival Model (e.g., "Church created strict rule due to ascetic tendencies/communal issues, later attributed to Jesus" - especially the *exception clauses*): The *core prohibition* (divorce = adultery) holds under stress (Paul attributes it directly to "the Lord" early on). However, the *Matthean exception* ("except for porneia") flips under this model - it's highly plausible as a later church adaptation, not original. **Downgrade to CONTESTED.** The *core* is likely authentic, but the *specific wording with/without exceptions* is debated.
  *   **Phase 4:** Editorial - Essential to highlight the contested nature of the exception clause. **Final Tag: CONTESTED (Jesus prohibited divorce, but the specific exception found in Matthew is debated by scholars).**

  **3. Empty Tomb Tradition (Mark 16:1-8; Matt 28:1-10; Luke 24:1-12; John 20:1-13)**
  *   **Phase 1:** Independent Roots: **Only Markan stream.** Matthew, Luke, John all directly or indirectly dependent on Mark's basic narrative. Paul (1 Cor 15:4) mentions burial and resurrection "on the third day" but *does not mention the empty tomb discovery*. **N = 1.**
  *   **Phase 2:** (Applies cautiously due to N=1)
      *   MA: 0 (N=1)
      *   Dis: -1 (Fulfills Jewish expectation of bodily resurrection? Serves core church kerygma perfectly - resurrection proof. Not dissimilar).
      *   Emb: -1 (No embarrassment here; it's the foundational proof).
      *   Coh: 0 (Coherent with resurrection belief, but that's tautological).
      *   Sem: 0 (Narrative details, not specific sayings).
      *   Plaus: 0 (A missing body *could* be explained in other ways (theft, wrong tomb), but women finding it is plausible *if* it happened. Doesn't score positive).
      *   **Sum: -2 (Tentative Believed)**
  *   **Phase 3:** Rival Model (e.g., "Developed as narrative expression of the resurrection faith/kerygma to counter 'stolen body' claims or provide concrete proof"): This is the *dominant* skeptical model. Given N=1, lack of Dissimilarity/Embarrassment, and coherence *primarily* with theology, the tentative "Believed" verdict **holds stable** under this rival model. It doesn't flip *to* Said/Done.
  *   **Phase 4:** Editorial - The cornerstone of the Easter narrative, but historically contested. Requires careful handling. **Final Tag: BELIEVED (The earliest followers came to believe and proclaimed that Jesus' tomb was found empty)**, potentially adding visual/textual note: *"This tradition's origin is intensely debated by historians."*

  ---

  **What the Procedure Cannot Do: An Honest Statement**

  1.  **Establish Certainty:** It cannot produce irrefutable proof. It assesses *probability* based on available, fragmentary evidence filtered through later communities.
  2.  **Reveal the "Historical Jesus" Directly:** It reconstructs *what was attributed to him very early on*. The criteria primarily assess the *tradition's origin and development*. They can identify early, plausible material, but **they cannot definitively bridge the gap between "what was attributed within ~20 years" and "what Jesus actually said/did/intended."** The "attribution gap" remains.
  3.  **Eliminate Hermeneutical Biases:** The interpretation of "Contemporary Judaism," "Early Church needs," "Plausibility," and even source relationships involves scholarly judgment and perspective. The panel's diversity helps but doesn't erase this.
  4.  **Resolve Deep Scholarly Divides:** On issues with fundamentally opposed premises (e.g., miracles like the empty tomb), the procedure can only structure the debate and force transparency about evidence and assumptions, leading often to "Contested." It won't make skeptics accept the empty tomb or conservatives abandon it.
  5.  **Capture Context or Meaning Fully:** It assesses the *historicity of events/sayings*, not their full significance within Jesus' life, 1st-century Judaism, or the development of Christianity. That requires broader narrative.
  6.  **Override the Nature of the Sources:** All sources are theological documents, not dispassionate chronicles. The procedure works *within* this constraint but cannot magically extract pure history.

  **In essence:** The procedure provides a rigorous, transparent, and efficient method to make defensible *probabilistic* judgments acceptable to diverse scholars for the purpose of public communication. It highlights where consensus exists, where it breaks down, and forces engagement with evidence and counter-arguments. However, it operates within the inherent limitations of historical Jesus research: **We work with early interpretations and attributions, not unmediated access to the man himself.** The procedure clarifies *what we can say responsibly* about those early traditions, not what we can say with absolute certainty about the historical figure. Your narration must reflect this nuanced probability, not false precision.
