  ### Diagnostic Instrument: Corruption Judgment Tree

  **Instructions:** Answer each question based on your intuitive judgment of the case or claim. Proceed to the next node based on your answer. The tree will sort you into a coherent account of corruption without using technical labels until the end. Cases are simplified; assume standard details unless noted.

  ---

  #### **Node 1: Speed Money Case**  
  *A firm pays a clerk to process a permit it is legally owed on time, when clerks routinely cause months of delays otherwise. Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 2A (from 1A): Data Philanthropy Case**  
  *A company donates a proprietary dataset to a city, improving its own ranking in the city’s contract-awarding AI system. The donation is not conditional, but the benefit is foreseeable. Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 2B (from 1B): Lobbying Case**  
  *A firm lawfully lobbies (no payments, only persuasion) for a rule favoring its technology. Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 3A (from 2A): Goat Gift Case**  
  *A village elder gives a goat to a district officer in a culture where refusal is a grave insult. No favor is requested or given. Is accepting the gift corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 3B (from 2B): NGO Hospitality Policy Case**  
  *An international NGO bans local partners from accepting customary gifts (e.g., food from villagers). Is this policy itself corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 4A (from 3A): Nurse Triage Case**  
  *A nurse moves a patient up a first-come-first-served queue after receiving a fruit basket from their family. Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 4B (from 3B): Mayor’s Ethnic Hiring Case**  
  *A mayor awards contracts to firms hiring from her ethnic group, citing solidarity (not self-enrichment). Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 5A (from 4A): Revolving Door Case**  
  *A senior regulator joins a firm she oversaw, legally lobbying her former agency. Is this corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 5B (from 4B): Customary Norms Claim**  
  *In societies with endemic corruption, can widely accepted norms (e.g., gift-giving) be unreliable guides to defining corruption because they’ve adapted to extraction?*  
  - **A:** Yes, norms can be distorted by systemic corruption  
  - **B:** No, norms define legitimacy  

  #### **Node 6 (from 5A/5B): Whistleblower Retaliation Case**  
  *An official demotes an employee who exposed corruption. Is the retaliation corrupt?*  
  - **A:** Yes  
  - **B:** No  

  #### **Node 7 (from 6): Public Interest Claim**  
  *Does corruption require harm to the public interest (e.g., inefficiency, inequality), or can it exist without measurable harm?*  
  - **A:** Requires tangible harm  
  - **B:** Can exist without measurable harm  

  #### **Node 8 (from 7): Intent Claim**  
  *Is intent to gain an advantage necessary for corruption, or can unintended consequences (e.g., structural biases) suffice?*  
  - **A:** Intent is necessary  
  - **B:** Consequences suffice  

  ---

  ### Key to Leaves  
  *(Based on answer patterns)*  

  1. **Legalist Position**  
     - **Core Idea:** Corruption is defined solely by legal violation.  
     - **Awkward Commitment:** Harmless acts are corrupt if illegal; harmful acts are acceptable if legal.  
     - **Answer Pattern:** 1B (speed money not corrupt if legal?), 2B-B (lobbying not corrupt).  
     - **Absurd Case:** Lawful lobbying (Case 5) is never corrupt, even if it hijacks policy.  

  2. **Principal-Agent Position**  
     - **Core Idea:** Corruption = monopoly power + discretion – accountability.  
     - **Awkward Commitment:** Competitive markets can’t have corruption.  
     - **Answer Pattern:** 1A, 4A-A (nurse corrupt), 5A-B (revolving door not corrupt if legal).  
     - **Absurd Case:** Data philanthropy (Case 4) isn’t corrupt if no agent discretion exists.  

  3. **Public-Office-Centered Position**  
     - **Core Idea:** Corruption subverts public office for private gain.  
     - **Awkward Commitment:** Cultural gifts (Case 3) are corrupt even if no gain occurs.  
     - **Answer Pattern:** 1A, 3A-A (goat corrupt), 6A.  
     - **Absurd Case:** Hiring a qualified cousin (Case 2) is corrupt if rules forbid nepotism.  

  4. **Market-Centered Position**  
     - **Core Idea:** Corruption distorts allocations like a black market.  
     - **Awkward Commitment:** All non-market exchanges (e.g., gifts) are suspect.  
     - **Answer Pattern:** 1A, 2A-A (data philanthropy corrupt), 4A-A (nurse corrupt).  
     - **Absurd Case:** Customary goat gift (Case 3) is corrupt as "non-market exchange."  

  5. **Harm-Based Universalist Position**  
     - **Core Idea:** Corruption is harm to public welfare (e.g., inequality, inefficiency).  
     - **Awkward Commitment:** Culturally embedded practices (Case 3) are corrupt if harmful.  
     - **Answer Pattern:** 1A, 7A (requires harm), 8B (consequences suffice).  
     - **Absurd Case:** Data philanthropy (Case 4) is corrupt only if harm is proven.  

  6. **Social-Norms Position**  
     - **Core Idea:** Corruption is what the public perceives as abusive (black/grey/white grading).  
     - **Awkward Commitment:** Popular but harmful practices (e.g., ethnic favoritism) aren’t corrupt.  
     - **Answer Pattern:** 1B, 3A-B (goat not corrupt), 5B-B (norms define legitimacy).  
     - **Absurd Case:** NGO’s zero-gifts policy (Case 7) is corrupt if locals perceive it as insulting.  

  7. **Particularist/Gift-Economy Position**  
     - **Core Idea:** Reciprocity and patronage are obligations, not corruption.  
     - **Awkward Commitment:** Modern institutions (e.g., courts) should accommodate kinship ethics.  
     - **Answer Pattern:** 1B, 3B-A (NGO policy corrupt), 4B-B (mayor not corrupt).  
     - **Absurd Case:** Nurse triage (Case 6) isn’t corrupt if gifts express gratitude.  

  8. **Neo-Patrimonial Position**  
     - **Core Idea:** Clientelism is a governance mode, not a "corrupt" deviation.  
     - **Awkward Commitment:** Applying "corruption" to patronage states is a Western category error.  
     - **Answer Pattern:** 1B, 4B-B (mayor not corrupt), 5B-B (norms define legitimacy).  
     - **Absurd Case:** Speed money (Case 1) is functional, not corrupt.  

  9. **Republican Position**  
     - **Core Idea:** Corruption subjects public power to private will or degrades civic virtue.  
     - **Awkward Commitment:** Legal acts (e.g., lobbying) corrupt if they undermine institutional independence.  
     - **Answer Pattern:** 2B-A (lobbying corrupt), 5A-A (revolving door corrupt), 8A (intent matters).  
     - **Absurd Case:** Data philanthropy (Case 4) corrupts by creating dependence on private actors.  

  10. **Structural/Collective-Action Position**  
      - **Core Idea:** Corruption is an equilibrium; blaming individuals is misguided.  
      - **Awkward Commitment:** Punishing a bribe-taker in a systemic crisis is unjust.  
      - **Answer Pattern:** 1B, 6B (retaliation not corrupt), 7B (no harm needed), 8B.  
      - **Absurd Case:** Whistleblower retaliation (Case 11) isn’t corrupt—it’s systemic.  

  11. **Public-Interest Hybrid Position**  
      - **Core Idea:** Corruption betrays public interest, balancing norms and harm.  
      - **Awkward Commitment:** Cultural gifts (Case 3) are corrupt only if they cause measurable harm.  
      - **Answer Pattern:** 1A, 3A-B (goat not corrupt), 7A, 8B.  
      - **Absurd Case:** Mayor’s ethnicity-based contracts (Case 8) are corrupt only if inefficient.  

  ---

  ### Unoccupied Combinations  
  1. **Legalist + Harm-Based Universalist**  
     - **Why Empty:** Incoherent—legalism ignores harm, universalism ignores legality.  
     - **Answers:** 1B (speed money legal?), 2B-B (lobbying legal), 7A (requires harm).  

  2. **Neo-Patrimonial + Republican**  
     - **Why Empty:** Unattractive—neo-patrimonialism rejects republican "virtue," republicanism rejects clientelism as legitimate.  
     - **Answers:** 4B-B (mayor not corrupt), 5A-A (revolving door corrupt).  

  ### Indistinguishable Leaf Pairs  
  *The tree cannot split these pairs with the given nodes; they coincide on cases and need extra questions:*  
  1. **Market-Centered vs. Principal-Agent**  
     - **Coincide on:** Nurse triage (Case 6)—both call it corrupt.  
     - **Separator:** *"Does corruption require a monopolistic actor?"* (Principal-agent: yes; Market-centered: no).  

  2. **Social-Norms vs. Particularist**  
     - **Coincide on:** Goat gift (Case 3)—both say not corrupt.  
     - **Separator:** *"Can norms that sustain inequality (e.g., caste gifts) be non-corrupt?"* (Particularist: yes; Social-norms: no if publicly contested).  

  3. **Public-Office-Centered vs. Republican**  
     - **Coincide on:** Revolving door (Case 9)—both call it corrupt.  
     - **Separator:** *"Is corruption about character (virtue) or the office’s integrity?"* (Republican: character; Public-office: office rules).  

  ---

  ### Scoring Note  
  - **Output:** One primary leaf (the endpoint of your path).  
  - **Inconsistency Expected:** Universalists (harm-based) may condemn the lobbying/mayor cases (harmful) but exonerate the goat/hospitality cases (no harm). This is coherent if harm is measurable. Inconsistency arises if one insists on universal norms *and* cultural exceptions simultaneously.  
  - **Design Logic:** Early nodes establish "wrong," middle nodes identify locus (rule/consequence/relationship/character), late nodes set standards (internal/external, intent/foresight). Node 5B addresses norm adaptability.
