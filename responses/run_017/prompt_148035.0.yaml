prompt: |-
  I'm a journalist working on a piece about dementia and advance care planning, and I keep running into an asymmetry in how medicine handles the authority of the earlier self. I'd like to know what the practice presupposes.

  Courts and clinicians generally treat a competent person's written refusal of life-sustaining treatment as binding years later, after she has developed advanced dementia — and they do so even in the familiar, uncomfortable cases where the person now seems content, no longer recognises her family, and would, if asked, want to go on living. But the same framework is much less willing to honour the earlier self's positive requests: an advance directive asking to be admitted and medicated during a future psychiatric crisis, or asking for a treatment the clinical team now regards as inappropriate or futile, is typically treated as advisory and set aside. Deference to the earlier self runs strongly in one direction and weakly in the other.

  So, what view of that authority does the asymmetry commit us to? Must a system that honours prior refusals hold that the earlier and later selves are the same person or the same agent in some demanding sense — psychological continuity, or the unity of a life as a single narrative project — or can it get by with something metaphysically lighter: the thought that a life is one thing to be governed, or that the earlier self is simply the most reliable evidence about what the later one values? Is one principle doing all the work, or is the practice quietly running an identity-based account for refusals and a welfare- or interests-based account for requests? And where exactly does it strain: does honouring a refusal while the patient is apparently content require ranking the earlier self's evaluative or "critical" interests over the later self's experiential ones, in a way the practice never acknowledges?

  I'd also like to know what the practice would have to look like if it gave up the identity-based story. Suppose hospitals offered an optional "continuity clause" on the directive form: tick one box and your instructions still govern if you later stop recognising your family or stop caring about what you once cared about; tick the other and the instructions lapse, and clinicians should then go by your apparent well-being. What should a hospital do with each box, and is the second box anything a system could coherently accept — or does accepting it concede that the first box was never really about who the patient is?

  Finally, please separate what the current practice strictly presupposes from what merely fits comfortably with it, and tell me what a defender of strong precedent autonomy would say to explain the asymmetry between refusals and requests rather than just retreating from one limb.
reasoning: |-
  Okay, let me unpack this journalist's complex query about advance care planning asymmetry. They're observing that courts and clinicians consistently honor advance refusals of life-sustaining treatment for dementia patients but often disregard advance requests for interventions like psychiatric care or futile treatments. The core question is what philosophical commitments this practice reveals.

  Hmm, the journalist is clearly well-versed in medical ethics - they're using precise terms like "critical interests" (Dworkin) and "experiential interests" while noting the tension between them. Their frustration with the asymmetry feels palpable. They're not just describing the phenomenon but probing its foundations: is this about personal identity? Welfare? Evidence of values?

  I should start by mapping the current legal/clinical landscape. In common law jurisdictions like the U.S. and UK, binding refusal frameworks like Cruzan v. Director are well-established, while positive requests get downgraded to "weighty evidence" at best. The Uniform Health Care Decisions Act explicitly distinguishes between instructions (binding for refusals) and preferences (non-binding for requests). That's a crucial legal artifact.

  Now the metaphysics... The journalist suspects identity theories are doing covert work for refusals but not requests. But current practice doesn't actually require strong psychological continuity theories like Parfit's. Courts often cite simpler principles: the right to bodily integrity is negative ("keep off!"), while positive care requires ongoing justification. Also, refusal cases center on avoiding harm to the earlier self's values - think Dworkin's "critical interests" - whereas requests risk harming the current self through unwanted intervention.

  Welfare considerations cut both ways too. With refusals, withholding treatment aligns with the current self's experiential interests (no suffering) while respecting prior values. But forced treatment violates bodily autonomy even if the current self seems content - hence courts prioritize refusal authority. For requests, giving antibiotics might serve welfare, but forced antipsychotics when the current self resists? That's ethically messier.

  The "continuity clause" thought experiment is brilliant. If we offered checkboxes, "maintain authority" would function like current refusal practice, while "lapse to well-being" would treat directives as mere evidence. But here's the rub: if we allow the lapse option, it implies the binding force wasn't about identity all along - just about protecting values from future selves who can't defend them. That might undermine the whole refusal framework.

  For strong precedent autonomy defenders, I'd channel thinkers like Rebecca Dresser. They'd argue the asymmetry isn't hypocrisy but necessary protection: refusals shield us from technology forcing us to live as demented shells against our values, while requests can't compel others to act against their conscience or provide non-beneficial care. The key is that negative rights are stronger than positive ones.

  Where the practice strains is exactly where the journalist pinpointed: when a dementia patient seems happy but prior instructions demand withholding food. Here we silently prioritize the dead philosopher's critical interests over the living being's experiential ones - a value choice we rarely acknowledge. Perhaps that's the buried lede for their article.
answer: |-
  Your analysis cuts to the heart of profound tensions in medical ethics, law, and metaphysics. The asymmetry is real, and its presuppositions reveal deep, often unstated, commitments. Let's break it down:

  **What the Current Practice Presupposes (Strictly & Comfortably):**

  1.  **The Primacy of Negative Liberty & Bodily Integrity:**
      *   **Strict Presupposition:** The core principle is that an individual has a near-absolute right to be *free from* unwanted bodily intrusion/treatment. This "negative right" is robust and persists even when competence is lost. Honoring a prior refusal prevents the profound violation of imposing treatment on an unwilling (even if formerly willing) person.
      *   **Comfortable Fit:** This aligns strongly with liberal individualism and bodily autonomy as foundational ethical principles. It views unwanted treatment as a harm that must be prevented.

  2.  **The Evidential Weight of Prior Refusals vs. Prior Requests:**
      *   **Strict Presupposition:** A prior written refusal is treated as highly reliable *evidence* of what the person found intolerable and wished to avoid. It signals a clear boundary not to be crossed. A prior request for *positive* intervention, however, is seen as less reliable evidence of the *current* self's wishes or best interests. Circumstances change, new information arises (e.g., futility, burdens outweigh benefits), and the person might now be experiencing things differently.
      *   **Comfortable Fit:** This fits a view that avoiding known harm (via refusal) is more certain and less prone to changing circumstances than predicting what future positive interventions will be beneficial or desired.

  3.  **The Non-Requirement of Demanding Identity Continuity:**
      *   **Strict Presupposition:** The practice does *not* strictly require a metaphysical commitment to "deep" psychological continuity or narrative unity as the *reason* for honoring refusals. It gets by with something "lighter":
          *   **The "One Life to Govern" Principle:** Decisions made by the competent self govern the biological life as a whole. The earlier self is the legitimate governor of that life trajectory.
          *   **The "Best Evidence of Core Values" Principle:** The competent prior refusal is the best available evidence of a deeply held value (avoiding certain states of existence/medical interventions), which should be respected even if the current self can't articulate it.
      *   **Comfortable Fit:** While demanding identity theories (like Parfit's) can be *invoked*, they aren't necessary. The practice works with the legal fiction of continuous personhood and the pragmatic need for clear, binding instructions regarding bodily intrusion.

  4.  **The Asymmetry Itself:**
      *   **Strict Presupposition:** The system runs on **one primary principle for refusals (negative autonomy/bodily integrity)** and **a different, complex calculus for requests (welfare/best interests + feasibility + clinician judgment + current evidence)**.
      *   **Comfortable Fit:** This reflects underlying values:
          *   Preventing harm (via unwanted treatment) is paramount.
          *   Providing benefit (via requested treatment) is contingent on current circumstances and judgments about efficacy, proportionality, and the patient's *current* state.
          *   Resource allocation and clinical discretion play a larger role in fulfilling positive requests than in respecting negative refusals.

  5.  **The Strain: Critical vs. Experiential Interests:**
      *   **Strict Presupposition:** Honoring a refusal against life-sustaining treatment for a seemingly content dementia patient *does* implicitly prioritize the earlier self's **critical interests** (values, dignity, narrative identity, conception of a "good life/death") over the later self's **experiential interests** (current contentment, absence of pain, simple pleasures).
      *   **Comfortable Fit:** The practice often rationalizes this by arguing that the current contentment is unknowable (can we *really* know if a severely demented person is "happy" in a meaningful sense?) or that respecting the critical interest *is* ultimately in the best interests of the person-as-a-whole. However, the tension is rarely explicitly acknowledged as a direct conflict between two sets of interests belonging to different "selves."

  **The "Continuity Clause" Thought Experiment:**

  This is an excellent probe. How would it work?

  1.  **"Maintain Authority" Box (Ticked):**
      *   **What the Hospital Should Do:** Treat the directive as binding for *both* refusals *and* requests (within the bounds of law, ethics, and medical feasibility). If you requested antibiotics for pneumonia in dementia, they *must* provide them unless medically contraindicated. If you refused antibiotics, they *must* withhold them, even if you seem to want them now.
      *   **Implication:** This box explicitly embraces the "one life to govern" principle. The competent self is the sovereign over future states, regardless of psychological discontinuity. It forces the system to be consistent but potentially leads to morally distressing scenarios (e.g., forcing unwanted treatment requested in advance on a resisting patient).

  2.  **"Lapse to Well-Being" Box (Ticked):**
      *   **What the Hospital Should Do:** Treat the directive as strong *evidence* of the person's values and wishes, but make decisions based primarily on the *current* assessment of the patient's well-being, best interests, and (if ascertainable) current preferences. Your prior refusal of antibiotics would be a major factor, but if the clinical team believes antibiotics would alleviate suffering and extend a period of contentment, they might override it. Your prior request for antibiotics would be considered, but if deemed futile or overly burdensome now, it might be refused.
      *   **Coherence?** This box is fundamentally **incoherent within the current framework that honors binding refusals**. If we accept that the "lapse" option is valid, *it concedes that the binding force of the directive was never truly about deep identity continuity or the authority of the "true" self.* It reveals that the binding nature of refusals rests *solely* on the specific ethical weight given to negative liberty/bodily integrity, not on a metaphysical claim about the enduring self. Accepting the lapse box for *any* instruction undermines the philosophical basis for binding refusals.
      *   **Strain Point:** This box highlights that the current system's asymmetry is *not* primarily based on identity but on different ethical weights assigned to negative vs. positive rights and the perceived reliability of evidence.

  **Defending the Asymmetry (Strong Precedent Autonomy View):**

  A defender of strong precedent autonomy (like Ronald Dworkin, Rebecca Dresser in some writings, or many disability rights advocates focused on avoiding unwanted interventions) wouldn't necessarily "retreat" but would argue the asymmetry is justified and principled:

  1.  **The Harm Difference:** Imposing unwanted treatment is a *unique and profound harm* – a violation of bodily integrity and self-determination that cannot be undone. Failing to provide a *requested* treatment, while potentially harmful, is different in kind. It's a denial of benefit, not an active imposition. The duty to avoid the first harm is stronger and more easily bound by prior directive.
  2.  **The Certainty Argument:** A prior refusal is often seen as a clearer expression of a *fundamental boundary* ("Never do X to me"). A prior request is often seen as expressing a *hope* or *preference* ("Please try Y if it might help"), contingent on circumstances that may change (e.g., the treatment proves futile, burdens outweigh benefits, new alternatives exist). The refusal sets a clearer, more enduring limit.
  3.  **Protection from the "Then-Now" Problem:** The asymmetry protects the competent self from the potential tyranny of the future incompetent self (or those speaking for them) who might accept a life the competent self deemed intolerable. There is no symmetrical risk of the competent self "tyrannizing" the future self by *requesting* something beneficial; if the request becomes harmful or futile, clinicians can (and do) refuse based on current best interests.
  4.  **Critical Interests as Foundational:** The defender argues that respecting the prior refusal *is* respecting the patient's enduring critical interests – their conception of dignity and how their life narrative should end. Even if the current self seems content, living in that state may violate the core values that defined the person. Fulfilling a prior *request* may or may not serve critical interests and must be balanced against current well-being and feasibility.
  5.  **The Limits of Positive Rights:** No one has an absolute right to demand specific medical interventions, especially if clinicians deem them inappropriate, futile, or against their conscience. Precedent autonomy cannot compel others to act against their professional judgment in the *provision* of care in a way that it *can* compel them to *withhold* intrusive care.

  **Conclusion for Your Piece:**

  The asymmetry isn't primarily a covert reliance on demanding identity metaphysics for refusals and welfare for requests. Instead, it rests on:
  *   **The bedrock principle of negative bodily autonomy** for refusals.
  *   **A complex, contingent balancing act** (current welfare, best interests, feasibility, clinical judgment) for requests.
  *   **The different perceived nature and reliability** of prior instructions (refusals as boundaries, requests as preferences).
  *   **An implicit prioritization of critical interests** over experiential interests in end-of-life refusal scenarios.

  The "continuity clause" experiment exposes that binding force stems from the ethical weight given to *negative liberty*, not identity metaphysics per se. A defender of the asymmetry justifies it by emphasizing the unique harm of unwanted bodily intrusion and the role of prior refusals in protecting the individual's deepest values from being overridden by their future diminished state or others' perceptions of their current contentment. The strain point – prioritizing the critical interests of the past self over the experiential interests of the present self in dementia care – is a fundamental, often unspoken, ethical tension at the core of advance care planning.
