  Possible pitfalls: Overclaiming the extended mind theory could alienate the supervisor. Ignoring the council's point might seem dismissive. Not addressing the librarians' situation could feel insensitive. The speech must thread the needle—acknowledging the loss of the physical space's role in community cohesion while accepting the move as practical. 

