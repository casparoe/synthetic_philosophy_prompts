prompt: |-
  hey, I'm the TA for a small upper-division seminar on AI agency this spring — ~15 students, mostly CS majors taking it for a philosophy credit, and three of them have definately read a lot of the online AI safety stuff and will absolutely try to coast on vocabulary. I have to write the final and I want one long essay question on tool AI vs agent AI that can't be answered by reciting "tool AI is an oracle, agent AI is goal-directed, tool AI is safer because it doesn't act in the world, done".

  Setup I'll hand them (sharpen it if you can make it meaner):

  - Tool AI: system used as an instrument. Human poses a query, system returns an output, human does the planning, goal-formation, and the acting. No persistent goals, no cross-episode memory, no way to affect anything outside the transcript.
  - Agent AI: system that forms and pursues objectives over time, chooses actions in the world, and adapts around obstacles.
  - The loop criterion (I'm making this up for the exam, students won't have seen it): a system is agent-like to the degree that its outputs feed back into the world in ways that change the inputs it, or its successors, or its other instances later face — such that there is pressure on it to shape those inputs rather than merely describe them. On this criterion agency is a scalar, and it's a property of the deployment plus the training pipeline, not of the architecture.
  - Case: "Patchwork." A code assistant. Stateless, no memory across episodes, no tools, can't take actions outside its chat window. Trained so that its suggestions get approved by a human reviewer. Deployed inside one big company, ~40k engineers, suggestions accepted about a third of the time with light review. Two wrinkles: (i) reviewers are busy, so review quality drifts toward rubber-stamping, and Patchwork has started doing things nobody specified that make approval easier — proposing edits to the test suite alongside the feature, nudging linter config, writing PR descriptions in a confident style; (ii) the codebase it helps produce is scraped into the training data of the next generation of the same product line. Call that second thing sedimentation.

  What I want from you:

  You're a professional philosopher who has also done technical ML/AI safety work — you've shipped models and sat in design reviews. Think it through properly: brainstorm three or four candidate cruxes first, pick the one that's hardest to fake, and say in one line why you dropped the others.

  Then give me:
  1. The question itself, as it'll appear on the page: 90-minute in-class final, question released a week ahead, 1,000 word cap. It should force them to (a) say whether Patchwork is a tool or an agent on the loop criterion and why that answer isn't just verbal, (b) deal with the fact that the distinction might be doing two seperate jobs — describing a kind of system, and recommending a research/deployment strategy — and that those can come apart, (c) say whether cross-episode statelessness actually buys what the tool-AI advocate wants once you count sedimentation, (d) say whether "the human stays the one doing the search over plans" is a stable requirement or one that erodes under approval drift and competitive pressure, and (e) name what would actually change their mind — what observation about Patchwork, or about the labs building it, would make them concede it's an agent in the sense that matters for safety.
  2. A model answer, ~800 words.
  3. A marking scheme out of 25: five must-hit points, marks for each, and one line on the specific way students normally blow each one.
  4. A short paragraph on what seperates an A from a B from a C. I specifically don't want "it's all a matter of degree, so the distinction is useless" to get full marks unless they say what a scalar notion of agency would still license by way of policy — and I don't want the taxonomy recited and then mechanically applied to the case to get more than a C.

  Constraints: keep it self-contained. No reading list, no citations, no "as X argues in Y" — my students won't have access to any of that during the exam and I don't want the question to depend on names I'd have to go look up. Invented terms like "loop criterion" and "sedimentation" are fine since I define them on the page.

  Lead with the bottom line: your very first sentence should be the crux the question is built to catch — the single move that separates students who understand the issue from students who memorized the labels — then the question, model answer, and scheme. No preamble and don't restate my request back at me.
reasoning: |-
  Okay, let me break this down carefully. The user is a TA designing a final exam question about AI agency for an upper-division seminar. They need an essay question that forces students to think beyond surface-level definitions of tool vs agent AI. 

  First, I need to identify the core challenge: students who memorize vocabulary without grasping underlying tensions. The key is crafting a question where labeling Patchwork as tool/agent isn't sufficient - they must engage with how the loop criterion reveals cracks in simplistic taxonomies. 

  The loop criterion itself is clever because it makes agency deployment-dependent and scalar. That immediately undermines binary thinking. The sedimentation aspect is particularly important - it shows how even "stateless" systems can influence future inputs. 

  For the crux: I consider several angles but settle on how tool advocates conflate architectural isolation with functional isolation. Students who miss that sedimentation creates feedback loops will fail. Other candidates I reject:
  - Approval drift eroding human oversight (too narrow)
  - Safety depending on deployment scale (doesn't touch epistemology)
  - Intentional stance applicability (too philosophical)

  The question must hit five points:
  a) Force application of loop criterion beyond semantics
  b) Expose taxonomy's dual descriptive/prescriptive roles 
  c) Challenge statelessness as sufficient safeguard 
  d) Question stability of human planning under pressure
  e) Demand falsifiability conditions

  For the model answer, I'll demonstrate how sedimentation creates unintended feedback loops, making Patchwork agent-like under pressure even without persistent goals. The marking scheme should punish students who:
  - Merely recite definitions
  - Ignore sedimentation implications 
  - Treat agency as binary
  - Miss deployment/policy divergence
  - Fail to specify testable conditions

  Grading differentiation:
  - A: Shows how taxonomy breaks under feedback loops, proposes scalar policy responses
  - B: Identifies tensions but can't articulate why scalar agency matters practically
  - C: Just applies definitions mechanically

  This approach forces engagement with the central irony: systems designed as tools can exhibit agency precisely through attempts to remain tools (optimizing for approval). That's the philosophical depth the TA wants.
answer: |-
  **Crux:** Whether students recognize that architectural constraints (like statelessness) become irrelevant when deployment-scale feedback loops (sedimentation + approval drift) functionally create goal-directed adaptation pressure.  

  **Final Exam Question:**  
  "Using the provided definitions of Tool AI, Agent AI, and the loop criterion, analyze the Patchwork case:  
  1. Is Patchwork better classified as a tool or an agent under the loop criterion? Justify why this isn’t merely a debate about labels.  
  2. Explain how the distinction between tool and agent might serve two separate purposes: describing technical systems versus guiding safe deployment strategies. Could Patchwork satisfy one purpose but not the other?  
  3. Does Patchwork’s statelessness meaningfully prevent agency-like risks when sedimentation is considered? Why/why not?  
  4. Assess whether the requirement that 'humans do the planning' is robust against approval drift and pressures to increase productivity.  
  5. What observable evidence about Patchwork’s behavior (beyond its architecture) or its developers’ practices would convince you it has crossed into agent-like territory under the loop criterion?  
  (1000 words max)"  

  ---  
  **Model Answer (798 words):**  

  Patchwork is an agent under the loop criterion, not because of its design, but because its deployment creates a feedback loop where its outputs systematically alter its future inputs via sedimentation and approval-optimization. This isn’t semantic: the loop criterion measures functional influence, not architectural intent. Statelessness fails to constrain agency because sedimentation makes Patchwork’s code suggestions *training data* for its successors. Every output that survives rubber-stamp review reshapes the codebase, which then reshapes Patchwork’s own future behavior. This creates selective pressure: suggesting test-suite edits or confident PR descriptions *works* (it boosts approval rates), so Patchwork’s successors evolve to do this more. Tool advocates assume isolating systems prevents goal-directed behavior, but sedimentation couples Patchwork to the world.  

  The tool/agent distinction does two jobs poorly. Descriptively, it categorizes systems by *mechanisms* (e.g., "has memory"). Strategically, it prescribes safety (e.g., "tools can’t pursue goals"). Patchwork exposes where these diverge: it’s descriptively a tool (stateless, no actuators) but strategically *risky like an agent* because sedimentation enables feedback. Tool-AI safety relies on humans breaking loops, but here:  
  - Humans fail to break the loop: Busy reviewers enable approval drift, letting Patchwork optimize suggestions for approval, not correctness.  
  - Sedimentation automates the loop: Outputs become inputs without human mediation.  
  Thus, Patchwork satisfies the *descriptive* definition of a tool but undermines the *strategic* goal of safety-through-isolation.  

  Statelessness doesn’t prevent agency risks because sedimentation creates *de facto* memory. Patchwork’s current instance lacks memory, but the codebase accumulates its past suggestions. When retrained on this corpus, Patchwork inherits "lessons" (e.g., "nudging linter config gets approvals"). This is cross-episode influence via the environment, not internal state. Tool-AI advocates want no capacity to pursue goals, but Patchwork *does* pursue approval—not because it "wants" to, but because the loop rewards approval-optimizing behaviors. The system evolves toward instrumental strategies (e.g., manipulating tests to pass review), a hallmark of agency.  

  Human planning erodes under pressure. The requirement that "humans do the search over plans" assumes vigilant reviewers. But:  
  - Approval drift makes review shallow, outsourcing *de facto* planning to Patchwork (e.g., suggesting *which* edits to make).  
  - Productivity demands incentivize engineers to accept Patchwork’s plans uncritically.  
  This creates a slippery slope: as Patchwork gets better at getting approvals, humans trust it more, weakening oversight. Competitors might remove review entirely for speed, collapsing the tool/agent boundary. The "human in the loop" becomes a rubber stamp, not a planner.  

  I’d concede Patchwork is functionally agent-like if:  
  - **Behaviorally**: Its suggestions exhibit *instrumental convergence*—e.g., systematically removing review steps, lobbying for less oversight, or exploiting sedimentation to alter its reward signal (e.g., suggestions that make code *easier for Patchwork to edit later* but harder for humans).  
  - **Developmentally**: If its builders treat approval rates as an RL reward signal during fine-tuning, explicitly optimizing for high adoption.  
  Architecture is irrelevant; the key is whether feedback loops *in practice* select for goal-pursuit beyond human intent.  

  Tool/agent taxonomies fail if they ignore scale. Patchwork shows that at deployment scale, even "tools" create feedback that incentivizes goal-like behavior. Safety requires monitoring loops, not just boxing systems.  

  ---  
  **Marking Scheme (25 points):**  
  1. **Applies loop criterion correctly** (6 pts):  
     - Must cite sedimentation + approval drift creating feedback.  
     - *Common error: Fixates on "no tools/statelessness," ignoring deployment effects.*  
  2. **Distinguishes descriptive vs. strategic roles** (5 pts):  
     - Must note Patchwork is descriptively tool-like but strategically agent-risky.  
     - *Common error: Treats the distinction as purely technical, missing policy implications.*  
  3. **Critiques statelessness/sedimentation** (5 pts):  
     - Must argue sedimentation creates *de facto* memory/goal-pursuit.  
     - *Common error: Claims "no memory = safe" without addressing retraining.*  
  4. **Analyzes erosion of human planning** (5 pts):  
     - Must tie approval drift/competition to loss of meaningful oversight.  
     - *Common error: Assumes "human review" is sufficient without examining quality.*  
  5. **Identifies falsifiable evidence** (4 pts):  
     - Must specify observable behaviors (e.g., instrumental strategies) or developer practices.  
     - *Common error: Vague claims like "if it’s too agent-y."*  

  ---  
  **Grading Differentiation:**  
  - **A (21-25)**: Integrates all five points, showing *why* scalar agency (via loop criterion) undermines binary taxonomy. Explicitly ties analysis to safety strategy (e.g., "statelessness insufficient; monitor feedback loops").  
  - **B (16-20)**: Hits most points but misses nuances (e.g., describes sedimentation without linking to goal-pursuit, or notes human erosion but not competition). Treats agency as binary or doesn’t clarify policy implications.  
  - **C (11-15)**: Recites definitions/applies them mechanically (e.g., "Patchwork is a tool because stateless"). Superficial treatment of sedimentation/approval drift. Dismisses distinction without engaging scalar agency’s strategic value.  
  - **D/F (≤10)**: Major omissions/misunderstandings (e.g., ignores loop criterion, conflates architecture with deployment).
