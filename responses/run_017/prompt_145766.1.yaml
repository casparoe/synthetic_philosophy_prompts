prompt: |-
  So a friend of mine is going through IVF at the moment and it's got me and a few people from my very informal reading group stuck on something. The thing that struck us is how picky the whole setup is about which reasons for choosing one embryo over another count as respectable. The clinic will happily discard embryos with the wrong number of chromosomes, will test for a specific disease if both parents are carriers, and — at least where I live, with some approvals — will let you pick an embryo that's a tissue match for a sick older sibling. But the same clinic acts as if ranking embryos by anything like intelligence or height is straight-up beyond the pale, and non-medical sex selection is either illegal or something they'll quietly steer you away from. At the same time, the very same health system nags pregnant women about folate and alcohol, and basically everyone I know agrees that a woman who drinks heavily all through a pregnancy has wronged the child she ends up having. That last bit is what I can't square. If we already accept that prospective parents owe it to the child who will exist to make that child as well off as they reasonably can, then why isn't "take the embryo with the best expected life" the obvious next step? Isn't that just procreative beneficence, and isn't it weird to accept the duty in the pregnancy case and reject it in the selection case?

  So here's what I actually want: what does the practice as it exists presuppose? Is it committed to something like a treatment/enhancement distinction, or to a sufficiency view where you may select to avoid a bad life but there's no reason at all to optimize above the threshold? Does it secretly lean on some claim about the non-identity problem — that we can't benefit a child by creating them, but we can harm them by creating them in a bad state? Does it presuppose that parents have a domain of reproductive discretion that simply runs out at some point, and if so, why exactly there? And I'd really like the distinction between what the practice strictly requires and what it merely fits with: could someone who accepts full-on maximizing procreative beneficence still endorse the clinic's actual rules for second-order reasons — the tech being noisy, worries about where a market in traits ends up, worries about what it says to already-existing disabled kids — or is that person stuck defending something closer to the practice I actually see?

  One more thing, because we invented it halfway through the argument and none of us could work out whether it's a genuine alternative or just the same view in a costume. Call it "the floor rule": you may use any selection technology to minimize the chance that the child ends up below some decent minimum of well-being, and you're encouraged to, but you may not use it to improve a child's prospects once they're already above the floor, even when the improvement is large and basically free. Is the floor rule actually a different theory from the one the clinic is running, or is it just a description of it? Does it dodge the expressivist worry about Down-syndrome screening, or does cutting off at the floor say something just as bad? And concretely: if a clinic swapped its current implicit theory for the floor rule, or for straight procreative beneficence, what would visibly change — who gets funded, what counselors say, whether declining selection starts to look like negligence? Sorry, that's a bit of a jumble, but I'd rather have the mess than a clean answer to the wrong question.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking here. They're part of an informal reading group, and their friend's IVF experience has them puzzled about the ethical distinctions clinics make in embryo selection. The core issue is the apparent inconsistency: clinics allow selecting against severe diseases but prohibit non-medical traits like intelligence or height. The user connects this to prenatal care norms—like avoiding alcohol during pregnancy—which imply an obligation to promote the child's well-being. So why not extend that obligation to selecting the "best" embryo?

  First, I need to parse their main question: what underlying principles justify this distinction? They mention several possibilities—treatment vs. enhancement, sufficiency threshold, non-identity problem, parental discretion limits. They also want to know if the clinic's rules could coexist with procreative beneficence for practical reasons, or if it's a fundamental ethical stance. Plus, there's their "floor rule" idea: selecting only to avoid outcomes below a minimum well-being level. Does that align with current practice or offer a middle ground?

  The user's deeper concerns might involve societal values and slippery slopes. They hint at expressivist worries (e.g., Down syndrome screening sending negative messages) and fear market-driven eugenics. Their group seems to be wrestling with whether current practices are ethically coherent or just pragmatic compromises. They might also be seeking validation of their "floor rule" as a viable framework.

  Breaking down the clinic's presuppositions: The practice likely relies on a harm-avoidance model. Selecting against chromosomal abnormalities prevents harm (e.g., Tay-Sachs causing early death), while selecting for intelligence isn't seen as preventing harm but enhancing. This ties into the non-identity problem—choosing a different embryo changes who is born, so avoiding disease benefits the specific child born healthy, but selecting for higher IQ doesn't "benefit" a child who wouldn't exist otherwise. 

  The prenatal care analogy is tricky. Avoiding alcohol prevents harm to a specific fetus, a clear duty. But in embryo selection, choosing one embryo over another creates a different child. The duty there is to avoid creating a child in a harmed state, not to create the "best possible" child. This distinction resolves the apparent inconsistency.

  On the "floor rule": It's essentially a sufficiency threshold. Current practice fits this—screen out severe impairments but not optimize beyond health. Adopting this explicitly might not change much in clinics but could shift counseling language. However, it doesn't fully dodge expressivist concerns; saying "we ensure no child is below floor X" still implies lives below X aren't worth living, which could offend disability communities.

  If clinics embraced full procreative beneficence, the changes would be stark: trait selection commodified, pressure to "optimize," and declining selection might be seen as negligent. But current rules likely reject this, prioritizing societal risks (eugenics, inequality) over maximal benefit. Practical factors like unreliable polygenic scores also support restraint.

  In sum, the clinic's stance isn't arbitrary—it's rooted in avoiding harm versus pursuing enhancement, navigates non-identity complexities, and balances parental autonomy with societal values. The "floor rule" mirrors this but making it explicit might not alter practice significantly. The user’s group is spot-on to question where lines are drawn, as the underlying ethics reveal tensions between individual benefit and collective good.
answer: |-
  Your group has hit on one of the most philosophically charged tensions in reproductive ethics. The clinic's stance rests on several overlapping presuppositions, and dissecting them reveals why the "obvious next step" isn't taken. Here's a breakdown:

  **Core Presuppositions of Current Practice:**

  1.  **Harm Avoidance vs. Benefit Maximization:** The practice is fundamentally grounded in **avoiding significant harm or suffering** rather than maximizing potential well-being. Chromosomal abnormalities (like Down syndrome, Trisomy 18) or severe single-gene disorders often correlate with profound medical complications, suffering, or early death. Preventing *that* harm is the primary justification. The prenatal folate/alcohol analogy holds because it's framed as preventing harm (neural tube defects, FASD). Selecting for intelligence/height isn't seen as preventing a harm, but rather pursuing an enhancement.

  2.  **The Non-Identity Problem & Comparative Harm:** This is crucial. The clinic's logic implicitly relies on a specific interpretation:
      *   Creating Child A (with a severe disorder) *harms* Child A compared to a possible state *they* could have been in (healthy). Choosing a different embryo (B) doesn't harm A (as A never exists), but *creating* A in a harmed state *is* seen as wronging A.
      *   However, creating Child B (with an IQ of 120) instead of Child C (with an IQ of 110) *does not harm Child C* (who never exists). Nor is Child B *harmed* by not being created with an IQ of 130. The "wronging" only applies when the child brought into existence suffers significant harm *relative to a baseline of normal health/opportunity*. Procreative beneficence (maximizing) requires comparing different *possible* children, which the harm avoidance model avoids.

  3.  **Treatment/Enhancement Distinction:** This is a major, though contested, pillar. Interventions are permissible if they aim to restore or maintain species-typical functioning (preventing disease/disability = "treatment"). Interventions aimed at improving capabilities beyond that norm are "enhancements" and face ethical hurdles. Selecting against Tay-Sachs = treatment. Selecting for taller height = enhancement. This distinction underpins the legality/acceptability of PGD for medical conditions vs. non-medical traits.

  4.  **Parental Discretion Domain & Limits:** Parents have wide latitude in reproductive decisions *until* those decisions are seen to:
      *   Cause significant harm to the future child (hence prohibiting actions causing harm, like heavy drinking).
      *   Violate broader societal values or norms (e.g., commodification, eugenics, reinforcing problematic biases).
      *   Impact third parties negatively (e.g., sex selection leading to sex ratio imbalances). The "run out" point is where selection shifts from harm prevention to optimization/social engineering, crossing into territory deemed too consequential for purely parental choice.

  5.  **The Sufficiency Threshold (Implied Floor):** While not always explicitly stated, practice strongly suggests a **sufficiency view**. The goal is ensuring the child has a sufficiently good start in life to have a reasonable opportunity for a decent life ("above the floor"). Once that threshold is met (no severe disorder, reasonable health prospects), further optimization isn't considered obligatory or even permissible for selection purposes. Folate prevents falling *below* the floor; alcohol pushes the child *below* it; embryo selection for IQ doesn't affect whether the child is *above* it.

  **Procreative Beneficence vs. Practice: Compatibility?**

  A proponent of *maximizing* procreative beneficence *could* endorse the clinic's rules, but only for **pragmatic, second-order reasons**, *not* because they accept the underlying harm-avoidance/sufficiency model as morally primary. Their justification would be:

  *   **Noisy Tech:** Polygenic risk scores (PRS) for traits like IQ or height are currently crude, probabilistic, and context-dependent. Acting on them is unreliable and could backfire.
  *   **Slippery Slope/Eugenics Concerns:** Allowing selection for non-medical traits risks normalizing a market-based, competitive approach to reproduction, exacerbating inequality, devaluing existing people with "undesirable" traits, and leading to state or societal coercion.
  *   **Expressivist Worry:** Even using PRS for optimization might send a message that certain traits make a life less valuable, potentially harming people with those traits now. (This applies less to maximizing beneficence than to *rejecting* embryos below a threshold, but the *act of selection itself* could be expressive).
  *   **Parental Autonomy & Burden:** Mandating optimization could impose excessive burdens on parents, turning reproduction into a high-stakes optimization problem and potentially infringing on parental autonomy in child-rearing (if they must justify not selecting the "best").

  However, a *consistent* maximizing procreative beneficence advocate would see the clinic's rules as **ethically suboptimal**. They *would* see declining to select the embryo with the highest predicted well-being (if reliable data existed) as a form of negligence, akin to refusing folate. They are "stuck" defending a practice they see as failing a moral duty, justified only by contingent practical dangers.

  **The "Floor Rule": Genuine Alternative or Description?**

  *   **Is it Different?** The Floor Rule is **largely a clearer articulation of the sufficiency view already implicit in practice**, not a fundamentally new theory. Current practice *is* about avoiding outcomes below a (somewhat fuzzy) floor of severe impairment/suffering.
  *   **Is it a Description?** Yes, but making it explicit changes the framing slightly. It emphasizes the threshold concept more directly than the treatment/enhancement language.
  *   **Does it Dodge Expressivism?** **No, not entirely.** While it focuses *only* on avoiding the worst outcomes, the act of screening *for* those outcomes and discarding embryos based on them *still* risks expressing the view that lives with those conditions are not worth living or are a harm to be prevented. This is the core expressivist objection to practices like Down syndrome screening. The Floor Rule doesn't eliminate this; it just narrows the scope of selection. Strong expressivists would still object.
  *   **What Would Change with the Floor Rule?** If explicitly adopted:
      *   **Counseling:** Would emphasize "ensuring a healthy start" or "avoiding severe hardship" rather than just "preventing disease." Might be *slightly* more expansive if the floor includes severe but non-medical disadvantages (though this is unlikely).
      *   **Funding/Approvals:** Probably little change, as current approvals already target severe conditions. Might slightly broaden justifications for screening new severe late-onset disorders.
      *   **Declining Selection:** Would likely *strengthen* the view that declining *harm-avoiding* selection is negligent (akin to refusing folate), as the duty is explicitly framed as ensuring the child is above the floor.
  *   **What Would Change with Procreative Beneficence?** A seismic shift:
      *   **Counseling:** Would involve discussing predicted traits (IQ, healthspan, etc.) and recommending the "best" embryo. Declining optimization would require justification.
      *   **Funding/Approvals:** Pressure to fund/approve screening for non-medical traits if reliable predictors existed. Trait "packages" might be marketed.
      *   **Negligence:** Declining optimization *could* potentially become grounds for negligence claims if the child's life was deemed suboptimal and technology was reliable. Parents might feel intense pressure to "maximize."
      *   **Social Dynamics:** Exacerbates inequality (only wealthy access optimization), reinforces problematic social biases about "good" traits, increases stigma against non-optimized individuals. The "domain of discretion" shrinks dramatically.

  **In Summary:**

  The IVF practice presupposes a **harm-avoidance model** grounded in **preventing significant suffering**, navigated via the **treatment/enhancement distinction**, resolving the non-identity problem through a **"wrongful life"** lens (creating a child in a harmed state is wrong), and respecting a **parental discretion domain** bounded by preventing harm and avoiding major social harms. It implicitly operates with a **sufficiency threshold ("floor")**.

  The prenatal care analogy holds for **harm prevention** (folate/alcohol) but breaks down for **optimization** because optimization involves comparing possible different people, not preventing harm to a specific future person. The Floor Rule is mostly a codification of the existing sufficiency view but doesn't escape expressivist concerns. Adopting maximizing procreative beneficence would radically transform practice into a high-stakes optimization endeavor with profound societal risks, which is precisely why clinics and regulations draw the line where they do – it's seen as a firewall against eugenics and commodification. The tension your group perceives is real: it's the friction between a strong individualistic duty to a future child and the collective societal values that constrain how that duty can be enacted in the realm of selection.
