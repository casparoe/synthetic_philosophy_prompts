prompt: |-
  I hold a two-clause norm of assertion that I arrived at by trying to repair what I take to be the knowledge norm's blind spot, and I want it stress-tested rather than validated. Call it the Reliance Norm: S may assert that p only if (i) S is in a position to know that p, and (ii) S is warranted in believing that her audience's treating p as settled on her say-so would not predictably leave them epistemically worse off than if she had stayed silent. Clause (i) is just the knowledge norm and is meant to do its usual work — lottery propositions, Moore-paradoxical utterances, guesses dressed up as statements. Clause (ii) is where I am going out on a limb: it is meant to explain why it can feel improper to assert something you know to an audience you know will misuse it (the true but easily misread statistic offered to a crowd mid-moral-panic; the specialist's hedge-free claim to lay readers who will hear more confidence than is warranted), and also why institutional assertion is strange — a committee, a lab, or these days a language model can issue a flat claim that no individual member knows, and yet we do not react to it the way we react to a person guessing.

  What I want is a map of the position's exposure, not a survey of the field. Which observations, arguments, or cases would actually count against it — and, crucially, which of those are inherited from clause (i) and so land on the plain knowledge norm as well, and which are specific to clause (ii)? Rank them from fatal to merely awkward, and tell me what a defender of my view should concede as counting against it before any critic presses the point. My own guesses at the soft spots: that the audience-relativity makes the permissibility of what I say depend on facts about your gullibility, which is the kind of feature that usually gets a proposed norm into trouble; and that clause (ii) is doing either no work or all of the work, in which case I do not really have a distinct view. Does it misclassify any ordinary, non-philosopher's assertion as impermissible — I care much more about that than about contrived cases? Does it collapse into the truth norm, into some pragmatic-encroachment story about knowledge itself, or into straight consequentialism about speech? And has the vagueness of clause (ii) insulated it so thoroughly that nothing could falsify it, and if so, is that a defect in this particular proposal or just the normal condition of proposing a constitutive rule?

  Some background so you can pitch the answer: I have been reading this literature on the side for years, in the rationalist-blog-and-forum tradition where the knowledge norm is close to the house view, and I have come to find the standard arguments for it too quick — they feel like they settle the question by stipulating which cases are the telling ones. Assume I know the standard moves; do not spend time establishing that knowledge-norm views are popular or that truth and belief norms are on the table. Go straight to where my formulation is exposed. On priors: I am moved more by cases than by considerations of theoretical elegance, and I would count "it cannot distinguish itself from its rivals" as more damaging than "it has awkward implications in bizarre situations."
reasoning: |-
  Okay, let's start by understanding the user's query. They've proposed a two-clause norm for assertion called the Reliance Norm. Clause (i) is the knowledge norm, and clause (ii) adds that the speaker must be warranted in believing their audience won't be epistemically worse off by relying on the assertion. The user wants this stress-tested, focusing on weaknesses rather than validation.

  First, I need to identify the key areas where this norm might be vulnerable. The user mentioned concerns about audience-relativity and whether clause (ii) is doing any real work. They also care about misclassifying ordinary assertions and collapsing into other norms like truth or consequentialism. 

  Looking at clause (ii), the main issue is the dependency on the audience's characteristics. This could lead to problems where the permissibility of an assertion changes based on how gullible or irrational the audience is. For example, telling a paranoid person a true fact might be impermissible because they'll overreact. That seems counterintuitive since the speaker is sharing knowledge. This is a problem specific to clause (ii), not inherited from the knowledge norm.

  Another point is whether clause (ii) overlaps with pragmatic encroachment. If knowledge itself depends on stakes, then clause (i) might already handle some cases clause (ii) is meant for. The user wants to know if their norm is distinct or redundant. Cases like high-stakes assertions where knowledge is denied due to stakes might be covered by clause (i), making clause (ii) unnecessary. But if knowledge isn't affected by stakes, clause (ii) might be doing extra work, which could be seen as a strength or a weakness.

  Institutional assertions are another area. The user thinks their norm explains why groups can assert without individual knowledge. But does clause (ii) actually solve that? If the institution isn't a knowing agent, clause (i) might still be violated. The defender might argue that institutional contexts create a different kind of warrant, but that needs more fleshing out. This is a vulnerability specific to their formulation.

  Vagueness in clause (ii) is a concern. Terms like "predictably" and "epistemically worse off" are fuzzy. While the user might argue that norms are inherently vague, critics could say this makes the norm unfalsifiable. However, since the user prioritizes real-world cases over contrived ones, this might be a lesser issue if the norm handles ordinary assertions well.

  The user also worries about collapsing into consequentialism. If clause (ii) is about preventing epistemic harm, it might align with a broader consequentialist approach. But the user might counter that it's constrained by clause (i), keeping it distinct. Still, the potential for overlap is a soft spot.

  Cases like forced choices where silence isn't an option might reveal problems. If the speaker must assert something and chooses a less optimal but known fact, clause (ii) might still flag it as impermissible if the audience misuses it. Yet intuitively, sharing knowledge here seems permissible, suggesting clause (ii) might be too restrictive.

  The user's deep needs seem to be about validating whether their norm addresses the blind spots of the knowledge norm without introducing new issues. They want honesty about weaknesses, especially in ordinary contexts, and to ensure their view isn't just repackaged existing theories. They’re also concerned about theoretical coherence and distinctness from other norms.

  In summary, the stress test should highlight audience-relativity as the biggest vulnerability, potential redundancy with pragmatic encroachment, institutional assertion challenges, vagueness, and consequentialism overlap. The defender needs to clarify how clause (ii) functions independently and handles real-world cases without overreaching.
answer: |-
  Here’s a stress-test map of your Reliance Norm’s vulnerabilities, ranked by severity and flagged for clause-specific issues. I focus on empirical, ordinary-case counterpressure and structural risks you highlighted, avoiding contrived philosophy-swamp cases. Critiques inherit clause (i) only where noted.

  ### **Fatal or Near-Fatal Exposures**
  1. **Audience Malice/Gullibility Overreach (Clause ii-specific)**  
     **Case:** You know *p* (e.g., "Vaccines reduce autism risk") to a scientifically literate friend. Impermissible? No. But assert it to an audience primed to *weaponize* *p* (e.g., "See? They admit vaccines *cause* autism!"). Clause (ii) likely forbids this—audience misuse predictably worsens their epistemic position.  
     **Why fatal:** You *know* *p*, and silencing yourself rewards bad-faith actors. Intuitively, asserting truth to manipulative audiences isn’t improper—*misrepresentation* is. Concedes too much ground to epistemic bullies.  
     **Defender’s concession:** This *is* a cost—clause (ii) sometimes forces silence when asserting knowledge would be socially or epistemically virtuous. Root issue: norm can’t distinguish *audience misuse* from *speaker irresponsibility*.

  2. **Redundancy with Pragmatic Encroachment (Clause ii collapsing clause i)**  
     **Argument:** If "position to know" (clause i) is *itself* sensitive to stakes (e.g., "You don’t *know* *p* if misbelief could cause disaster"), clause (ii) adds nothing. Cases you designed it for (e.g., "specialist’s claim to lay readers") are already covered by denying knowledge in high-stakes contexts.  
     **Why fatal:** Your norm is distinctive only if knowledge is *invariant* to audience effects. If knowledge *is* audience-sensitive, clause (ii) is redundant. If not, clause (i) is too weak for high-stakes cases, forcing clause (ii) to do all the work.  
     **Defender’s concession:** You *must* deny pragmatic encroachment on knowledge to preserve distinctness. But this clashes with ordinary judgments (e.g., "You didn’t *know* the bridge was safe—look what happened!").

  ### **Major Structural Vulnerabilities**
  3. **Silence Comparison is Underspecified (Clause ii-specific)**  
     **Problem:** "Worse off than if she had stayed silent" assumes silence is neutral. But silence can *cause* epistemic harm (e.g., not warning "This mushroom is toxic" to foragers). Or it can be suspicious (e.g., refusing to answer "Do you still beat your wife?").  
     **Why damaging:** Fails ordinary cases. Asserting known truths to prevent ignorance isn’t just permissible—it’s often obligatory. Clause (ii) could forbid life-saving assertions if the audience *might* misinterpret them.  
     **Defender’s concession:** Must clarify that "staying silent" includes providing context/caveats—but this risks circularity (asserting *with* caveats may trigger clause ii too).

  4. **Institutional Assertion Isn’t Resolved (Clause ii insufficient)**  
     **Case:** A corporate press release states *p* ("Our product is safe") based on aggregated data no single member "knows." Clause (i) is violated (no individual knows), but you say we accept this. Clause (ii) *might* permit it if the audience benefits.  
     **Why awkward:** But clause (i) still forbids it! If institutional assertion doesn’t require individual knowledge, clause (i) is wrong—clause (ii) can’t rescue it. We accept corporate claims *because* we attribute knowledge to the *institution*, not individuals.  
     **Defender’s concession:** You need a separate account of group knowledge for clause (i). Clause (ii) alone doesn’t fix this.

  ### **Awkward but Survivable Hits**
  5. **Overprotection of Irrational Audiences (Clause ii-specific)**  
     **Case:** You know *p* ("Your spouse is faithful") to a pathologically jealous friend who’ll distort *p* into "proof" of guilt ("They’re covering for her!"). Clause (ii) forbids assertion. But intuitively, *you* aren’t responsible for their paranoia—asserting truth is fine.  
     **Why awkward:** Makes assertion hostage to audience irrationality. Feels like blaming speakers for others' epistemic vices.  
     **Defender’s reply:** Concede it’s restrictive but argue speakers *should* avoid feeding delusions. Pragmatic encroachment-independent.

  6. **Vagueness as Shield (Clause ii-specific)**  
     **Risk:** "Predictably," "warranted in believing," and "epistemically worse off" are flexible. Critics may say this makes the norm unfalsifiable (any counterexample can be dismissed as "unpredictable" or "not *really* worse off").  
     **Why awkward:** But norms *are* vague—knowledge itself is. As long as it rules core cases (e.g., shouting "Fire!" falsely in a theater), vagueness isn’t fatal. **Crucially:** It *doesn’t* insulate clause (ii) from the cases above.

  ### **Your Soft Spots Addressed**
  - **"Depends on your gullibility"**: Yes—this is clause (ii)’s core vulnerability (see #1, #5). It’s not *always* bad (e.g., lying to Nazis about Jews relies on audience traits), but it’s counterintuitive for true assertions.  
  - **"Clause ii doing no/all work"**: Major risk (#2). Avoidance requires stakes-insensitive knowledge.  
  - **Collapse into truth/consequentialism?**  
    - **Truth norm**: No—clause (i) blocks unknown truths.  
    - **Consequentialism**: Close, but clause (i) anchors it in epistemology. Still, clause (ii) *is* consequentialist—its "epistemic worse off" is outcome-based. A feature, not a bug?  
  - **Misclassifies ordinary assertions?** Only if you reject speaker responsibility for foreseeable misuse (#1, #5). Most non-philosophers would likely agree with clause (ii) in cases like spreading rumors or medical misinformation.

  ### Defender's Cheat Sheet
  Concede upfront:  
  1. Clause (ii) *can* force silence when asserting known truths to bad-faith or irrational audiences (#1, #5).  
  2. The norm *requires* rejecting pragmatic encroachment on knowledge (#2).  
  3. Institutional assertion needs extra machinery (#4).  
  4. "Epistemically worse off" needs refinement to handle silence that isn’t neutral (#3).  

  **Your strongest ground**: It captures the intuition that asserting isn’t just *being right*—it’s *inviting reliance*. When that reliance backfires predictably, you’ve violated the social contract of assertion, even with knowledge in hand. That’s not the house view—it’s a feature, not a bug. But the audience-relativity *will* be the battleground.
