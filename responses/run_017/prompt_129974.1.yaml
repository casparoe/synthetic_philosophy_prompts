answer: |-
  ## Coffee Shop Metaethics

  **Setting:** A university coffee shop, mid-afternoon. Ana (mid-30s, philosophy professor) and Ravi (late 30s, cultural psychologist) nurse their drinks amidst scattered notebooks.

  **Ravi:** ...so the WEIRD data is finally getting the context it deserves. But Ana, even granting that *some* variation washes out under better methods – corrected factual beliefs, ecological weightings – there’s this stubborn residue. That study in the highlands, where refusing a gift request from a distant clan member wasn't just rude, it was *sinful*, inherently *wrong* in a way violating a traffic law wasn't. You can't explain that away with differing beliefs about reciprocity efficiency or resource scarcity. It’s a fundamentally different moralization.

  **Ana:** I agree it’s different, Ravi. Profoundly so. But "fundamentally different" doesn't mean "no fact of the matter." It might mean one culture is deeply mistaken about the scope of moral obligation. Maybe they’re conflating ritual purity or social cohesion – genuine but non-moral goods – with moral rightness itself. The phenomenological *feeling* of wrongness doesn’t guarantee it’s tracking a moral fact. People felt *deeply* that slavery was morally permissible, or that women shouldn't vote. They were wrong.

  **Ravi:** Ah, but the "born elsewhere" challenge bites hard here. *Your* intuition that refusing the gift is merely impolite, not morally monstrous – isn’t that just the WEIRD water you swam in? What exactly is *your* intuition tracking, if not the local cultural firmware? If you’d been raised in that highland clan, you’d feel the moral sting just as viscerally as you now feel the wrongness of lying. Doesn't that symmetry suggest the intuition itself is manufactured, not discovered?

  **Ana:** Not necessarily. It suggests intuitions are fallible starting points, shaped by environment. But we *correct* them through reason and broader engagement. My conviction that slavery is wrong *isn't* just my cultural firmware; it’s survived sustained cross-cultural scrutiny and argument grounded in fundamental reasons about suffering, autonomy, and equality. The highlander *might* be wrong because their intuition rests on an unchecked premise – perhaps an over-extended sense of communal identity blinding them to individual separateness. The fact that intuitions *can* be culturally primed doesn’t mean they *only ever* track cultural noise. Some intuitions prove robust because they latch onto something real.

  **Ravi:** Okay, let’s pressure-test with your hypothetical study. Forty societies over thirty years, market integration ramping up. Result one: impartial fairness norms – obligations to strangers, limits on kin favoritism – shift *rapidly* and *uniformly* towards greater impartiality, everywhere, tracking market integration. People experience it as moral progress, not just changing fashion. Result two: harmless acts – food taboos, purity rules, deference rituals – remain wildly divergent, no predictors, no convergence. No sense of ‘progress,’ just ‘our way.’

  **Ana:** Fascinating split. For (i), the convergence, speed, directional push, and phenomenology of *progress* scream realism to me. It looks like uncovering objective demands of large-scale, anonymous cooperation – demands latent but obscured in smaller, kin-based ecologies. Market integration forces engagement with the stranger, revealing the objective need for impartial rules. The phenomenology matches: discovering a requirement, not inventing a preference. For (ii), the lack of convergence and lack of ‘progress’ framing strongly suggests these aren’t tracking objective moral facts at all. They *are* contingent cultural tools for cohesion, identity, managing anxiety – genuinely important, but not moral in the truth-apt sense. My mistake was bundling them together; realism was always most plausible for the core demands of social cooperation under conditions of potential conflict. Purity/etiquette stuff is downstream of other human needs.

  **Ravi:** See, Ana, that feels like cherry-picking realism for the bits that conveniently converge! Why is convergence evidence of truth? Maybe market integration just creates powerful *functional* pressures for impartial norms – societies that don’t adopt them implode economically. The ‘progress’ feeling? That’s just the relief of solving a coordination problem under new constraints. It *feels* like discovery because the solution *works*, not because it was ‘out there’ waiting. And (ii) proves the point: where there’s *no* strong functional pressure for uniformity – where different taboos or deference rules can equally well serve group cohesion or anxiety reduction in different contexts – variation persists indefinitely. No convergence because there’s nothing *to* converge on, no ‘better’ or ‘worse’ in a mind-independent sense, just different strategies. My positive story? Moral argument feels like discovery because we’re negotiating the rules of our shared social game under pressure, tapping deep-seated capacities for norm-psychology and reciprocal exchange. It *matters* intensely because getting the rules wrong has real social costs. But it’s invention under constraint, not mining for platonic ore.

  **Ana:** But Ravi, why *this specific solution*? Why does ‘impartial fairness’ consistently emerge, not, say, ruthless exploitation enforced by a stronger state, or rigid caste systems? If it’s just functional tinkering, why the universal pull towards reciprocity and equal consideration in the market sphere? That specificity, combined with the phenomenology, points to constraints shaped by real features of human interaction and reason. Your functional story risks making the *universality* and *directionality* of the convergence in (i) a massive coincidence. Why didn’t *some* societies evolve stable, market-integrated but highly partial or exploitative norms? The study found *none* did. That pattern demands explanation beyond just ‘it works.’ It suggests the solution space isn’t arbitrary; reason and human nature carve out grooves that make impartial fairness uniquely stable and rationally defensible – hallmarks of tracking truth.

  **Ravi:** The grooves are carved by human psychology and game theory, not moral metaphysics! Exploitative systems *are* less stable long-term in interconnected markets – they generate resentment, conflict, inefficiency. Impartial fairness is an evolutionarily stable strategy *precisely* because it avoids those costs. It’s selected for by the cultural-evolutionary environment, not because it’s ‘True.’ The lack of alternatives in the data just shows how strong the selection pressure is. As for a test... Okay, Ana, what would falsify your realism for domain (i)? Suppose we found a society that achieved high, stable market integration *without* converging on impartial fairness norms – maybe they maintained strong, morally enforced clan favoritism within a functioning market using complex reputation tracking. Would that shake you?

  **Ana:** (Pauses, sips coffee) Honestly? Yes. If impartial fairness genuinely wasn’t necessary for stable, prosperous large-scale cooperation – if a viable, morally endorsed alternative existed – that would undermine the ‘objective demand’ argument for realism in that domain. It would look more like one functional path among others. Your turn. What would make you doubt your cultural-evolutionary story for (i) and consider local realism?

  **Ravi:** (Leans back) Hmm. If we found a society *isolated* from markets or major external pressure, developing near-identical impartial fairness norms through purely internal philosophical discourse, citing reasons we recognize as sound, experiencing it as discovery... *without* the functional driver. That would suggest the reasons themselves, not just the functional payoff, have force. It’d hint at something mind-independent being grasped. But... (smiles wryly) good luck finding that control group in human history. The functional pressures are usually intertwined.

  **Ana:** Exactly. And your scenario with the favoritism-based market society... also vanishingly unlikely given the study's findings. So here we sit. Both clinging to explanations that feel robust to us, anchored in different fundamental pictures of the world. The WEIRD critique opened the door, but it didn't settle what's on the other side.

  **Ravi:** No. It just made the room a lot bigger, and the furniture stranger. Another coffee? This might take a while.

  **Ana:** (Chuckles) Definitely. We’re going to need it.
