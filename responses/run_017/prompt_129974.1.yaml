prompt: |-
  You're a professional metaethicist who also keeps up with cross-cultural psychology and has spent way too much of your life on rationalist forums. Do a quick brainstorm pass first, then write.

  Write a dialogue between two people who have both fully absorbed the WEIRD critique — the fact that nearly all moral-psychology data comes undergrads in rich liberal democracies, and that sampling small-scale societies turns up real divergence in what gets moralized at all: whether you owe a stranger help, whether purity violations are moral or merely conventional, whether impartial rules beat loyalty to kin. They still disagree.

  Ana is a moral realist who thinks the variation is mostly downstream of differing background factual beliefs, differing weights on the same reasons in different ecological niches, or just bad measurement — and that some of what people disagree about is genuinely one party being wrong. Ravi thinks the variation is deep enough that the best explanation is cultural-evolutionary tinkering with no fact of the matter underneath — but he is not a lazy error theorist: he owes a positive story about what we're doing when we argue about morality and why it phenomenologically feels like discovery.

  They have to actually engage. Ravi grants the cases where apparent disagreement dissolves into factual disagreement and says what's left over. Ana answers the "if you'd been born somewhere else you'd have different intuitions, so what exactly is your intuition tracking" line. No talking past each other, no strawmen.

  Here's the hypothetical I want both of them forced to handle — I made it up, so treat it as stipulated, don't try to recall it: a pre-registered, well-powered panel study following 40 societies through 30 years of increasing market integration finds (i) judgments about impartial fairness — how much you owe strangers, how much you may favor kin — move fast and in the same direction everywhere, tracking market integration almost perfectly, and participants experience it as progress rather than changed taste; but (ii) which harmless acts get moralized at all (food taboos, purity, etiquette, deference to elders) stays all over the map, no covariate predicts it, no convergence, and nobody frames it as progress.

  What does that split show? Ana: can you keep realism about domain (i) while going quietist about (ii), and if so why did you think moral facts came as one package? Ravi: if (i) really looks like convergence on a target, isn't the honest move local realism — and what's your positive account of (ii) that doesn't make the convergence in (i) a coincidence? Have them also try to name one observation, runnable in principle, that would change one of their minds; if neither can produce one, let them notice that out loud.

  ~900 words, real conversation, minimal stage directions, and no unearned agreement at the end.
