  ### Translation of the Sleeping Beauty Problem into Survey Methodology Vocabulary

  **Problem Setup:**  
  A fair coin is flipped. If Heads (H), one awakening occurs: Monday (blue room). If Tails (T), two awakenings occur: Monday (blue) and Tuesday (red). Beauty knows the protocol, experiences amnesia after each awakening, and observes the room color (blue or red) but not the day. We analyze the disagreement between "halfer" (P(H|blue) = 2/3) and "thirder" (P(H|blue) = 1/2) positions using design-based inference.

  ---

  #### 1. **Verification of Probabilities and Long-Run Frequencies**
  - **Upon seeing red:**  
    - Halfer and thirder both assign P(H|red) = 0.  
    - *Reason:* Red occurs only on Tails (Tuesday), so it implies T with certainty.  
    - *Long-run frequency (both):* Proportion of red awakenings from H runs is 0 (since no red in H). Under any repeatable procedure, 0% of red awakenings occur when the coin is H.

  - **Upon seeing blue:**  
    - **Thirder:** P(H|blue) = 1/2.  
      - *Long-run frequency:* Over many experiments, the proportion of blue awakenings that occur in H runs.  
      - *Repeatable procedure:* Pool all awakenings across runs → sample one awakening uniformly → condition on blue.  
      - *Calculation:* For N runs, blue awakenings = N/2 (H) + N/2 (T) = N. Fraction from H = (N/2)/N = 1/2.  
    - **Halfer:** P(H|blue) = 2/3.  
      - *Long-run frequency:* Over many experiments, the proportion of runs where a randomly selected awakening (within-run) is blue and from H.  
      - *Repeatable procedure:* Sample one run uniformly → sample one awakening uniformly within it → condition on blue.  
      - *Calculation:* For N runs, P(select blue) = P(H) × 1 + P(T) × P(select blue|T) = (1/2)(1) + (1/2)(1/2) = 3/4. P(H and blue) = 1/2. Thus, P(H|blue) = (1/2)/(3/4) = 2/3.  

  ---

  #### 2. **Translation to Survey Methodology**  
  Each experimental run is a **cluster (PSU)**. Awakenings are **units** within clusters.  
  - **Cluster types:**  
    - H-cluster: Size = 1 (Monday blue).  
    - T-cluster: Size = 2 (Monday blue, Tuesday red).  

  - **Estimand:** P(H | blue) = Proportion of clusters with H, given a blue unit is observed.  
    - *Ambiguity:* The estimand depends on the sampling design for units.  

  | **Aspect**               | **Thirder Position**                                      | **Halfer Position**                                        |
  |--------------------------|-----------------------------------------------------------|------------------------------------------------------------|
  | **Design**               | Pooled design: All units across clusters sampled uniformly. | Two-stage design: Clusters sampled uniformly, then units sampled uniformly within clusters. |
  | **Inclusion Probability** | Equal for all units: πᵢ = 1 / (total units). For N runs, total units = 3N/2, so πᵢ = 2/(3N). | Depends on cluster: <br> - H-unit: πᵢ = 1/N (cluster prob. 1/N × unit prob. 1). <br> - T-unit: πᵢ = 1/(2N) (cluster prob. 1/N × unit prob. 1/2). |
  | **Design Weight**        | wᵢ = 1/πᵢ = 3N/2 (constant).                             | wᵢ = 1/πᵢ: <br> - H-unit: wᵢ = N <br> - T-unit: wᵢ = 2N. |
  | **Self-Weighting?**      | Yes (constant weight).                                    | No (weights differ: N for H, 2N for T).                    |
  | **Informative Cluster Size** | Cluster size (1 for H, 2 for T) is informative because it depends on the cluster-level variable (coin). Halfer design accounts for this via unequal inclusion probabilities. Thirder design ignores it via uniform sampling. | |
  | **Post-Stratification**  | Room color (blue) is a domain restriction. Both designs condition on blue, restricting estimation to the blue stratum. | |
  | **Estimator (Horvitz-Thompson)** | Estimator for P(H|blue): <br> \( \hat{P} = \frac{\sum_{i \in \text{blue}} w_i \cdot I(\text{H}_i)}{\sum_{i \in \text{blue}} w_i} \). With constant weights, reduces to proportion of blue units from H clusters (1/2). | Same estimator, but weights differ: <br> - Numerator: ∑ wᵢI(Hᵢ) = (N/2 blue H-units) × N = N²/2. <br> - Denominator: ∑ wᵢ for blue = (N/2 × N) + (N/2 × 2N) = N²/2 + N² = 3N²/2. <br> Thus, \( \hat{P} = (N^2/2) / (3N^2/2) = 1/3 \). *Wait, inconsistency?* <br> **Clarification:** Halfer estimand is cluster-level. For P(H|blue), use indicator for H at cluster level. Selected unit reveals cluster coin. For blue units in sample: <br> - H-units: Contribute 1 to H, weight = N. <br> - T-units: Contribute 0 to H, weight = 2N. <br> \( \hat{P} = \frac{\sum w_i \cdot I(\text{H cluster})}{\sum w_i} = \frac{(N/2) \cdot N}{(N/2) \cdot N + (N/4) \cdot 2N} = \frac{N^2/2}{N^2/2 + N^2/2} = \frac{1/2}{1} = 1/2 \)? <br> **Error:** The sample has N runs, with N/2 H and N/2 T. Blue units: N/2 (H) + (1/2)(N/2) = N/2 + N/4 = 3N/4. Weights: H-blue: wᵢ = N (1 per run), T-blue: wᵢ = 2N (1 per run). Thus: <br> - Numerator: (N/2 runs) × wᵢ × I(H) = (N/2)(N)(1) = N²/2. <br> - Denominator: Total weighted blue = (N/2)(N) + (N/4)(2N) = N²/2 + N²/2 = N². <br> \( \hat{P} = (N^2/2) / N^2 = 1/2 \)? <br> **Resolution:** Halfer estimand is not directly HT-estimable because conditioning on blue requires domain estimation. Use: <br> \( \hat{P} = \frac{\text{Weighted count of blue H-units}}{\text{Weighted count of all blue units}} = \frac{(N/2) \cdot N}{(N/2) \cdot N + (N/4) \cdot 2N} = \frac{N^2/2}{N^2/2 + N^2/2} = \frac{1/2}{1} \). But earlier long-run is 2/3. <br> **Correct Approach:** Halfer design samples one unit per run. For P(H|blue), it is the ratio of runs with H and selected unit blue to runs with selected unit blue. In N runs: <br> - Runs with H and blue: N/2, all contribute. <br> - Runs with T and blue: (N/2) × (1/2) = N/4 (only when blue selected). <br> So \( \hat{P} = \frac{N/2}{N/2 + N/4} = \frac{1/2}{3/4} = 2/3 \). HT weights not needed here; design directly gives the ratio. |

