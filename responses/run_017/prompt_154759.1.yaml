    - **Uncertainty About One's Place in the Frame:** Sampling assumes the frame is externally defined. Beauty has no designer; she must decide how to index herself relative to the protocol. This choice (pooled vs. two-stage design) is not determined by the rules and has no sampling analog.  
    - **Substance of Dispute:** The residue is **normative**—how *should* Beauty model her position? Sampling provides tools but no answer. Philosophers' "self-locating belief" flags this gap.  

  **Conclusion:** The translation dissolves the *technical* dispute into an estimand-design ambiguity. The residue—Beauty's subjective choice of design—highlights a limitation of sampling theory for agents *inside* the frame. This choice is the core of the philosophical disagreement and remains substantive.
