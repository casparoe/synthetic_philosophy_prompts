  - **Halfer:**  
    - *Bet:* Beauty bets on H when blue at price Y.  
    - *Estimator:* Unbiased for P(H|blue) under two-stage design.  
    - *Long-run profit:* Fair price Y = 2/3. Profit per run = (1/2)(1 - Y) + (1/2)(1/2)(-Y) = 0 → Y = 2/3.  
  - *Translation:* Betting arguments map to **unbiasedness** of the estimator under its design. Disagreement stems from design choice.

  ---

  #### 4. **Residue Report**  
  - **Seams: Where Design-Based Tools Require External Concepts**  
    - **Bayesian Conditioning:** Not needed. Design-based frequencies suffice.  
