prompt: |-
  I've been reading the LessWrong-adjacent population-ethics and longtermism discourse for something like a decade, and I keep hitting the same wall. Every argument about climate policy, embryo selection, germline editing, or existential-risk mitigation eventually bottoms out in the non-identity problem as Parfit set it up in *Reasons and Persons*, and then it either collapses into the shrug that a person who would not otherwise have existed is not harmed, or into someone proposing that we taboo the word harm and start over. I would like to stop relitigating applications and instead write down the specification first.

  Here is what I want: the requirements an account of the moral significance of identity-affecting choices has to meet, where the account is meant to do one particular job. The job is to serve as the module a decision procedure calls when it compares long-horizon policies whose outcomes differ not only in how well people fare but in which people, and how many, there will be. Not a theory of everything. A subroutine that returns (a) a ranking of the options available to the agent and (b) some verdict about what is owed, or what has gone wrong, when the chosen option is identity-affecting. Adequacy should be judged relative to that use, and I want you to say explicitly when a requirement follows from that purpose and when it is just something a particular camp has grown attached to.

  These are the requirements I keep circling back to; treat them as raw material rather than as a list to endorse. Clean them up, delete the ones that are really cached conclusions wearing the costume of a desideratum, add the ones I have missed, and attach to each the case or consideration that motivates it:

  - It must be able to say something about the depletion-style case — the policy that gives the present generation a small benefit and leaves later generations much worse off, where those later generations exist only because of that very policy. Condemning it is not compulsory; explaining the intuition away in a way I can steelman is acceptable. Silence is not.
  - It must handle the contrast I cannot stop thinking about: selecting among candidates who already exist versus creating someone. Choosing which of several already-created embryos to implant, or editing the genome of an existing embryo, looks relevantly different from choosing to conceive now rather than later, or choosing which gametes to combine. Say whether that difference is moral or merely causal, and whether the timing of the intervention — before there is any candidate at all, versus once there are several — is supposed to matter.
  - It must not produce cliff edges. Verdicts should not flip because a causal chain reaches a few hours further back into the circumstances of a conception, given how easily identity scrambles. Pair the obvious depletion case with a near-twin of it that leaves identity intact and ask whether the two verdicts can differ discontinuously.
  - It must be usable by an agent who does not know and cannot know who will exist. No requirement to identify the counterfactual victim by name as a precondition for acting.
  - It must respect some distinction among being worse for someone, being wronged, being impermissible, and being blameworthy, and it must state what residue is left — guilt, regret, duties of compensation or apology, a reason to change institutions — when an act is wrongful although it wrongs no one. Collapsing all four into one is a substantive move and should be flagged as such.
  - It must take a position on the worth-living threshold and on whether creating a good life and creating a bad life are reasons of the same shape. Include the boundary case where a life is barely worth living, and the case where the alternative to creating someone is creating no one at all, so that the comparison class is empty.
  - It must rank outcomes across variable populations and do so at scale, since any two long-run policies differ in the size and composition of the future population. State its stance on the repugnant-conclusion family of problems, and tell me whether avoiding them is a genuine requirement or a preference of one camp.
  - It must not make the verdict depend on who is choosing — parent, IVF clinic, regulator, voter — unless it can say why the role of the agent carries moral weight here.
  - It must not quietly inherit a contested metaphysics. If the verdict depends on how fragile personal identity is, or on whether a given person could have originated from different gametes, that dependence should be visible and the verdict should be stated conditionally on it.
  - It must not double-count: benefit-of-existence, aggregate welfare, and any identity-independent value of a population have to be kept apart, and I want the argument for whichever of them is doing the work.
  - It must handle mixed cases, where a policy both worsens the prospects of people who will exist either way and determines who exists later, including cases where the two groups partially overlap.

  Three things I care about most. First, mark each requirement as non-negotiable or as a preference of a particular tradition, and say which entries on my draft list are really conclusions smuggled in as criteria. Second, and this is the part I most want: identify which subsets of the requirements cannot be jointly satisfied, and say plainly whether the impossibility results in population ethics bear on the subsets you find — if the honest answer is that no module can do this job, I would rather have that than a list that looks satisfiable. Third, tell me which single requirement excludes the most candidates, and why.

  Only after that: a short scorecard, a few lines each, for Parfit's no-difference style impersonal view, total and average utilitarianism, critical-level or threshold views, and person-affecting restricted views. I care much less about the scoring than about the criteria, so keep it brief and do not pad it. Assume the standard apparatus — the conservation and depletion case, the repugnant conclusion, the person-affecting intuition — as known; do not spend paragraphs restating it.
reasoning: |-
  Okay, this user has been wrestling with population ethics for a decade, specifically the non-identity problem from Parfit. They're frustrated with how discussions about climate policy, embryo selection, etc., keep hitting the same wall. Their main goal is to define clear requirements for a moral framework that handles identity-affecting choices in long-term policy decisions. They don't want a full theory but a module that outputs rankings and verdicts.

  First, I need to process their proposed requirements. They listed 11 points, but some might be cached conclusions disguised as desiderata. The user wants me to clean these up, identify which are essential vs. tradition-specific, and highlight conflicts. They also want to know if any requirement is the biggest deal-breaker.

  Looking at the requirements:  
  - The depletion case (small benefit now, worse for future generations who wouldn't exist otherwise) is crucial. The framework must address it, even if to dismiss the intuition.  
  - The distinction between selecting existing candidates (e.g., implanting embryos) vs. creating new ones (choosing gametes) needs clarification—is this moral or just causal?  
  - No cliff edges: verdicts shouldn't flip based on minor identity-scrambling changes. This tests robustness.  
  - Usability under ignorance: the agent doesn't need to know counterfactual identities.  
  - Separating concepts: worse for someone, wronged, impermissible, blameworthy. What's owed if no one is wronged?  
  - Worth-living threshold stance: creating good vs. bad lives, and comparisons to non-existence.  
  - Handling variable populations at scale: repugnant conclusion avoidance—is this required or optional?  
  - Agent-neutrality: verdicts shouldn't depend on who's choosing unless justified.  
  - Avoiding contested metaphysics: if identity fragility affects outcomes, state it conditionally.  
  - No double-counting: separate benefit-of-existence, aggregate welfare, etc.  
  - Mixed cases: policies affecting both existing future people and determining later identities.

  Now, assessing what's non-negotiable:  
  The depletion case and usability under ignorance seem core to the module's purpose. Without these, it can't function. The concept separation (#5) is also key because conflating terms leads to circular debates.  

  Cliff edges (#3) and metaphysics dependence (#9) are robustness checks—likely non-negotiable for a practical module.  

  Mixed cases (#11) are non-negotiable because real policies combine identity-affecting and welfare-affecting effects.  

  The worth-living threshold (#6) and population size handling (#7) are substantive but unavoidable; the module must take a stance to rank outcomes.  

  Existing vs. creating distinction (#2) feels like a cached conclusion. The moral difference might not be fundamental—perhaps it's about rights/interests applying only to existing entities. I'll flag this.  

  Agent-dependence (#8) is likely non-negotiable; morality usually doesn't care about roles without justification.  

  Double-counting (#10) is a clarity requirement—non-negotiable for transparency.  

  Repugnant conclusion avoidance (#7) is a preference. Some views embrace it, others avoid it—it shouldn't be a requirement.  

  Conflicts:  
  - Avoiding cliff edges vs. metaphysics dependence: If identity is metaphysically fragile, verdicts might unavoidably have discontinuities.  
  - Person-affecting views (no one harmed) vs. condemning depletion: They can't jointly satisfy the depletion requirement unless they stretch "harmed."  
  - Total utilitarianism vs. repugnant conclusion: It embraces repugnance, so if avoiding it is required, conflict arises.  

  The biggest deal-breaker is the depletion case requirement. It forces a choice: either accept that depletion isn't condemnable (person-affecting views) or abandon person-affecting intuitions (impersonal views). This excludes many candidates.  

  Impossibility results:  
  Arrhenius' theorems show no population axiology satisfies all intuitive desiderata. For this module, the conflict between avoiding repugnance and handling variable populations robustly might be unresolvable. The user must accept some counterintuitive result.  

  Scorecards:  
  - Parfit's impersonal view: Handles depletion and mixed cases, ignores identity, but leads to repugnant conclusions. No distinction between creating/selecting.  
  - Total utilitarianism: Maximizes total welfare, embraces repugnance. Condemns depletion if future losses outweigh present gains.  
  - Average utilitarianism: Avoids repugnance but has its own problems (e.g., preferring smaller populations). May not condemn depletion if future averages are high.  
  - Critical-level views: Avoids repugnance by setting a welfare threshold. Depletion condemned if future lives below critical level. Distinguishes creating good/bad lives.  
  - Person-affecting views: Struggles with depletion (no one harmed). Fails non-negotiable requirements unless modified.  

  In summary, the user needs to prioritize: if condemning depletion is essential, they must lean impersonal. If avoiding repugnance is vital, critical-level or average views work. But no option satisfies all without trade-offs.
answer: |-
  Based on your specifications, here's a cleaned-up set of requirements for a "module" ranking identity-affecting policies, with motivations, necessity status, conflicts, and key exclusions. Requirements are judged as **Non-Negotiable** (NN) if essential for the module's core function, **Traditions-Bound** (TB) if tied to specific ethical camps, or **Cached Conclusion** (CC) if smuggling substantive answers.

  ### Refined Requirements & Motivations
  1. **Handle depletion-style cases** (Small present benefit → large future harm to people who wouldn't otherwise exist).  
     *Motivation*: Core test case for non-identity problems (e.g., Parfit's "Risky Policy").  
     *Status*: **NN** – Silence undermines module's purpose for long-term policy.  

  2. **Distinguish selecting existing candidates vs. creating new ones** (e.g., embryo selection vs. conception timing).  
     *Motivation*: Intuition that editing/selecting *existing* entities imposes stronger duties than determining who *comes* to exist.  
     *Status*: **CC** – Assumes a moral difference; may reduce to causal facts about interests/rights applying only post-creation.  

  3. **Avoid cliff edges** (No discontinuous verdict flips from minor identity-scrambling changes).  
     *Motivation*: Moral luck concerns (e.g., 1-hour delay in conception changes "harm" status arbitrarily).  
     *Status*: **NN** – Practical robustness for policy use.  

  4. **Usable under ignorance** (No need to identify counterfactual individuals).  
     *Motivation*: Agents can't track identity in complex causal chains (e.g., climate policy).  
     *Status*: **NN** – Functionality requirement.  

  5. **Separate moral concepts** (Distinguish "worse for," "wronged," "impermissible," "blameworthy"; specify residue if wrongful but no victim).  
     *Motivation*: Prevents conflation that stalls discourse (e.g., "no harm → no wrong" vs. "wrong without harm").  
     *Status*: **NN** – Clarity for verdict output (b).  

  6. **Take a stance on the worth-living threshold and asymmetry** (Creating good vs. bad lives; comparison to non-existence).  
     *Motivation*: Necessary to rank outcomes with variable existence (e.g., barely-worth-living lives vs. non-existence).  
     *Status*: **NN** – Inescapable for population-scale ranking.  

  7. **Rank variable-population outcomes at scale** (Address repugnant-conclusion-style problems).  
     *Motivation*: Long-run policies differ in population size/quality (e.g., many mediocre lives vs. few excellent ones).  
     *Status*: **TB** – Avoiding repugnance is a *preference* (e.g., average utilitarians), not inherent to the module's job.  

  8. **Agent-neutrality** (Verdicts shouldn't depend on the chooser's role without justification).  
     *Motivation*: Moral objectivity (e.g., same act shouldn't be wrong for a parent but permissible for a regulator).  
     *Status*: **NN** – Role-dependence needs explicit argument.  

  9. **Avoid contested metaphysics** (Flag dependence on identity fragility, e.g., "could this person have different origins?").  
     *Motivation*: Prevent covert reliance on unresolved metaphysical debates (e.g., essentialism about gametes).  
     *Status*: **NN** – Transparency for conditional verdicts.  

  10. **No double-counting** (Separate benefit-of-existence, aggregate welfare, other values).  
      *Motivation*: Prevent inflation of reasons (e.g., counting existence benefit *and* welfare gains separately).  
      *Status*: **NN** – Ensure module outputs are interpretable.  

  11. **Handle mixed cases** (Policies affecting both welfare of future-existing people *and* identity/demographics).  
      *Motivation*: Real-world policies (e.g., climate change harms future people *and* alters who exists).  
      *Status*: **NN** – Generalizability requirement.  

  ---

  ### Conflicts and Impossibilities
  - **Key Conflict Cluster**: Requirements **#1 (depletion)**, **#5 (concept separation)**, and **#6 (threshold/asymmetry)** cannot be jointly satisfied by *person-affecting* views. These views deny that depletion wrongs anyone (#1) and collapse "wrongful" into "worse for someone" (#5). Impersonal views (e.g., total utilitarianism) satisfy #1 and #6 but violate person-affecting intuitions in #5.  
  - **Cliff-Edge vs. Metaphysics**: Requirement **#3 (no cliffs)** conflicts with **#9 (metaphysics transparency)** if identity *is* metaphysically discontinuous (e.g., specific gametes essential). The module must either deny discontinuity or accept verdict cliffs.  
  - **Repugnant Conclusion Trap**: Requirement **#7 (ranking at scale)** forces confrontation with the repugnant conclusion. *Avoiding* repugnance (e.g., via average utilitarianism) often violates other intuitions (e.g., tolerating extinction). Arrhenius' impossibility theorems confirm this trade-off is fundamental.  
  - **The Big Exclusion**: Requirement **#1 (depletion)** is the strongest filter. It excludes:  
    - *Strong person-affecting views* (no one is harmed → no wrong).  
    - *Average utilitarianism* (if future population is large and average welfare high, depletion may be acceptable).  
    - *Non-aggregative views* (e.g., maximin) if future generations are better off than some present people.  
    **Why**: Condemning depletion requires either (a) rejecting "not worse for anyone" as exculpatory, or (b) aggregating welfare impersonally.  

  ---

  ### Scorecard of Major Views (Focused on Requirements)
  - **Parfit's Impersonal View** (No-Difference View):  
    Handles #1 (condemns depletion), #4, #8, #11. Fails #5 (collapses "wrong" into impersonal badness), #7 (embraces repugnant conclusion). Silent on #6 (no asymmetry).  

  - **Total Utilitarianism**:  
    Strong on #1, #4, #6 (no asymmetry), #7 (embraces repugnance), #11. Fails #5 (no wrong without victim), #8 (if roles affect welfare sums).  

  - **Average Utilitarianism**:  
    Satisfies #7 (avoids repugnance), #8. Fails #1 (may endorse depletion if future average is high), #6 (asymmetry unclear), #11 (mishandles extinction cases).  

  - **Critical-Level Views**:  
    Meets #1 (if future below critical level), #6 (explicit threshold/asymmetry), #7 (avoids repugnance). Struggles with #5 (residue unclear), #9 (critical level arbitrary).  

  - **Person-Affecting Views**:  
    Passes #2 (distinguishes existing/created), #5 (clear wronging), #9. Fails #1 (cannot condemn depletion), #4 (if identity ignorance blocks claims), #6 (avoids creation ethics), #11.  

  ---

  ### Conclusion
  **No module satisfies all non-negotiable requirements**. The deepest tension is between the depletion intuition (#1) and person-affecting moral concepts (#5). Person-affecting views fail #1; impersonal views struggle with #5. Repugnance avoidance (#7) is optional but exacerbates trade-offs. Your focus on a limited "subroutine" doesn't escape population ethics' impossibility results—it crystallizes them. The strongest candidate is an **impersonal critical-level view** (handles depletion, threshold, scalability), but it must sacrifice strict agent-neutrality (#8) if roles affect welfare and accept metaphysical conditionality (#9). For your use case, deprioritize #2 (it's a CC) and #7 (TB), but insist on #1, #3, #4, #5, #6, #11.
