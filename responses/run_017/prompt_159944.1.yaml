prompt: |-
  I have a fifty-minute seminar next week on the frame problem, for first-years in a combined philosophy-and-computing degree. They have had exactly one prior lecture on classical planning — actions specified as preconditions and effects over a state description — and no formal logic beyond truth tables. Assume I know the material and do not explain the frame problem to me; what I need is a plan for getting it across. Four things in particular.

  The order. Give me the sequence of moves and, for each, what has to be in place before it can land. I keep losing the thread at the transition between the two things that get called by this name: the technical one, where representing an action's effects in logic seems to oblige you to write out, for every action and every condition it leaves alone, that the condition does not change; and the broader one, about how a system with very many beliefs works out which of them bear on what it is doing now. My instinct is to spend the first twenty minutes on the technical problem and then ask why solving it leaves the second untouched, but I am not sure the second problem is even visible to them unless they have already felt a proposed fix fail. Tell me what must come first, and what, if anything, must be deliberately withheld until later.

  The carrying example. One scenario should do the whole session's work, and I want it to meet a constraint I have not seen imposed anywhere: the same scenario must survive a change of goal. It should contain at least one consequence of the action that is far-flung but relevant, one that is close at hand and utterly irrelevant, and — this is the part I care about — one whose relevance flips when I change what the agent has been told to want, so that I can run the identical vignette three times with three different goals and let relevance itself be the variable. Propose such a scenario, and say what it must have and, as importantly, what it must lack. I had meant to use the familiar story of the robot that retrieves a battery from a room, where the battery sits on a wagon alongside a bomb, and I would be glad to be told why that is the wrong vehicle here, or what would have to be stripped out of it.

  The misconceptions. Here are the ones I expect: that this is a problem of computational cost, which more speed or memory would dissolve; that it was solved by the late 1980s and so there is nothing left to discuss; that it is the same as the qualification problem, or as the ramification problem; that relevance is a property a belief has on its own rather than something it has relative to a task and an agent; and that the takeaway is a vague holism, the thought that everything bears on everything. For each, tell me the exact point in the sequence at which to forestall it — I suspect some must be blocked before they can form while at least one is better provoked and then dismantled. Then give me the one or two misconceptions I have got wrong or missed, since my list comes from last year's cohort and may be idiosyncratic.

  Two further questions, folded in. First, whether to give five minutes to the temporal-projection puzzle in which a gun is loaded, an interval passes, and the trigger is then pulled — the Yale shooting case, which showed that the minimal-change fix is not always right — or whether that detour pulls attention back into the formalism and away from the problem I want them to feel; I suspect it is a trap for me rather than for them. Second, some philosophers have recruited the frame problem into an argument that central cognition cannot be computational at all, on the grounds that whether a belief bears on a conclusion is sensitive to anything and everything. Is that a legitimate extension worth a closing minute, or a different argument wearing the same name, and if I do raise it, what has to be true of the preceding forty-five minutes for it to be more than a slogan?

  Finally, a check and an omission. I want one question to put to them near the end whose answers would show they have the distinction between the two problems and not merely the vocabulary. I was going to hand out three short vignettes and ask which instantiates the frame problem, which instantiates one of its siblings, and which is only an expensive calculation, with at least one deliberately borderline case; tell me whether that will discriminate, and if not, what will. And tell me what to refuse to explain at this level, and how to make the refusal feel principled rather than evasive.

  Please do not suggest readings, sources, or citations: the course bibliography is fixed and I do not want to smuggle in new ones.
reasoning: |-
  Okay, this professor is prepping a seminar on the frame problem for first-year philosophy-computing students. They've only had one lecture on classical planning and basic logic. The core challenge is structuring the session to clearly distinguish the technical frame problem (representing non-effects) from the broader relevance problem (which beliefs matter). 

  Hmm, they're worried about losing students at the transition point between these two concepts. I recall that the technical problem often feels "solved" with frame axioms, making the broader problem seem invisible unless students experience a solution failing. The professor's instinct to spend 20 minutes on the technical side first makes sense, but we'll need to design that transition carefully.

  For the carrying example, the battery-bomb classic won't work because relevance doesn't flip with goals - the bomb's danger is always relevant. We need a scenario where an object's relevance changes based on goals. Maybe... a delivery robot carrying boxes where some boxes contain items that become relevant only for specific goals? Like Box A has tools (irrelevant for delivery), Box B has fragile glass (relevant if goal is "don't break items"), and Box C has a gift card (relevant if goal is "maximize recipient happiness"). 

  Ah, common misconceptions! The computational-cost one is pervasive. We should preempt that early when introducing the technical problem by emphasizing that even with infinite speed, writing all frame axioms remains unscalable. For the "it's solved" misconception, we'll let them briefly feel satisfied after frame axioms... then shatter that with the relevance problem. 

  The Yale Shooting Problem... tempting but dangerous. It's formalism-heavy and distracts from the core relevance issue. Better to skip it. As for the anti-computational argument, that's worth a closing minute only if we've thoroughly separated the two frame problems first - otherwise it'll sound like mystical handwaving. 

  For the diagnostic question: three vignettes could work if we make one about exhaustive frame axioms (technical), one about irrelevant beliefs affecting decisions (relevance), and one about computational load (deliberately borderline). The key is whether students can articulate why the borderline case isn't a frame problem. 

  Lastly, we'll need to firmly but politely refuse to formalize the relevance problem today - "We're showing why this is hard, not solving it" - while gesturing at modern approaches like relevance heuristics. The refusal feels principled if we frame it as respecting the problem's depth.
answer: |-
  Here’s a structured plan focused on clarity, engagement, and avoiding pitfalls, tailored to your constraints:

  ### **Order of Moves** (45 mins + 5 min buffer)  
  1. **Technical Frame Problem (18 mins)**:  
     - **Prerequisite**: Recall classical planning (actions = preconditions + effects).  
     - **Sequence**:  
       - Demo a **simple action** (e.g., moving a block on a table).  
       - Show how logic *requires* explicitly stating **what doesn’t change** (e.g., "After moving block A, block B remains in place").  
       - Highlight the **combinatorial explosion**: For *n* actions and *m* fluents, you need *n×m* frame axioms.  
     - **Why first?** Concrete, leverages prior knowledge, and feels "solvable" (transition hook: "But is this *really* the core issue?").  

  2. **Broader Frame Problem (22 mins)**:  
     - **Prerequisite**: Students must *feel* the technical "solution" is inadequate.  
     - **Sequence**:  
       - Introduce a goal-sensitive scenario (see below).  
       - Show that *even with* frame axioms, the system can’t **distinguish relevant vs. irrelevant knowledge**.  
       - Contrast: "We solved *representation* (technical), not *relevance* (broader)."  

  3. **Climax & Synthesis (5 mins)**:  
     - Diagnostic question (below) + anti-computational argument (if time).  

  ---

  ### **Carrying Example: The "Cafeteria Tray Scenario"**  
  **Setup**: A robot carries a cafeteria tray holding:  
  - A sandwich (on plate)  
  - A soda can (unopened)  
  - A napkin (under the soda)  
  - A loyalty card (tucked under the napkin)  

  | **Goal Change**       | **Relevant Consequence**       | **Irrelevant Consequence**     | **Flips-Relevance Consequence**       |  
  |------------------------|--------------------------------|--------------------------------|--------------------------------------|  
  | **Deliver food intact** | Sandwich stays dry (far-flung) | Napkin’s position (close)      | **Soda’s fizziness**: Irrelevant (goal: delivery) → Relevant (goal: "maximize customer joy") |  
  | **Maximize joy**       | Soda stays fizzy               | Sandwich’s orientation         | **Loyalty card**: Irrelevant (joy) → Relevant (goal: "track customer purchases") |  
  | **Track purchases**    | Card remains on tray           | Plate cleanliness              | *None needed – card’s relevance is now obvious* |  

  **Why this over bomb-on-wagon?**  
  - Bomb’s relevance is *always* critical (safety), never flips.  
  - Tray items have **mutable, goal-dependent relevance** without life-or-death distractions.  
  **Must lack**: Permanent dangers, universally critical elements.  

  ---

  ### **Misconceptions: When to Address**  
  1. **"Computational cost"**: Preempt during technical problem (*min 10*). Contrast: "Even with infinite speed, you still need to *write* all axioms – it’s a knowledge engineering burden."  
  2. **"Solved in the 80s"**: Let them feel satisfied after frame axioms (*min 18*), then dismantle with broader problem (*min 20*).  
  3. **"Same as qualification/ramification"**: Briefly distinguish during synthesis (*min 40*):  
     - Qualification: "What *else* must be true to act?"  
     - Ramification: "What *indirect* effects occur?"  
  4. **"Relevance is intrinsic"**: Provoke during broader problem (*min 25*). Ask: "Is ‘the Eiffel Tower is tall’ relevant to carrying the tray? *What if the goal is impressing a tourist?*"  
  5. **"Vague holism"**: Forestall at close (*min 44*): "Relevance isn’t ‘everything matters’ – it’s about *task-driven* inference."  

  **Missing misconceptions**:  
  - **"Agents need *all* knowledge upfront"**: Block early (*min 5*) by noting classical planning assumes a *complete* initial state.  
  - **"Relevance is deterministic"**: Dismantle with goal-flipping example (*min 30*).  

  ---

  ### **Two Further Questions**  
  1. **Yale Shooting Problem**: **Skip it**. It’s a distraction into temporal reasoning, not core relevance. Say: "This exposes edges of *minimal-change* solutions, but our focus is relevance."  
  2. **Anti-computational Argument**: **Raise briefly if synthesis is clear** (*min 43*). Prerequisite: Students must grasp that the *broader* frame problem is about **context-sensitive relevance**. Then: "Some argue this shows cognition can’t be computational because relevance isn’t rule-bound. But is that true? Or do humans use heuristics?" (Punt to future lectures).  

  ---

  ### **Diagnostic Question & Omissions**  
  **Check for Understanding**:  
  > *"A delivery robot has a database of 10,000 facts. For each task below, is the challenge:  
  > (A) Writing frame axioms (technical),  
  > (B) Deciding which facts matter (broader), or  
  > (C) Just slow computation?  
  > 1. *Ensuring ‘parking spot is empty’ stays true after it loads a package.*  
  > 2. *Ignoring ‘the moon is full’ when calculating delivery routes.*  
  > 3. *Checking traffic for 100 roads when only 3 are viable paths.*"*  

  **Answers**: 1=A (explicit non-change), 2=B (irrelevance), 3=C (computation). Borderline: 3 could tempt B, but cost ≠ relevance.  

  **What to Refuse**:  
  - **Formalizing relevance logic**. Say: "We’re showing *why* it’s hard, not solving it. Solutions like relevance heuristics (e.g., *activation*) are for future courses."  
  - **Implementing fixes**. Say: "Today’s goal is feeling the problem’s teeth – not pulling them."  
  **Make refusal principled**: "Philosophy starts by seeing the hole, not patching it."  

  ---  
  **Summary Flow**:  
  Technical (18 min) → Goal-flipping demo (10 min) → Broader problem (12 min) → Misconceptions + Synthesis (5 min).  
  The tray scenario and diagnostic question are your anchors. Avoid Yale Shooting; limit anti-computationalism to a provocative footnote.
