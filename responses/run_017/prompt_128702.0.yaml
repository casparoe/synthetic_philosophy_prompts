prompt: |-
  Hey — I need a teaching plan here, not an explanation of the topic itself. Context: I'm a third-year PhD student and I'm TAing the Freedom and Responsibility module again, and I've got one 60-minute section next Thursday with about a dozen first-years, a whiteboard, no slides, and a bit of a cold, so ideally something that doesn't require me to talk straight through the hour. In Monday's lecture they were given the principle of alternative possibilities — roughly, you're morally responsible for what you did only if you could have done otherwise — and they were assigned the classic Frankfurt case, the one where the intervener would have stepped in if the agent had started to show some prior sign of deciding differently, but never actually does anything. Last year this exact section went badly: half the room left saying so Frankfurt is just a determinist with extra machinery, the other half said the case is cheating because the guy is obviously being controlled, and nobody could tell me what the case was even supposed to be an argument against. So plan the hour for me.

  Concretely, what I want: what has to be on the board before the case can do any work at all — is PAP best sold to them as an explanation of why blame is fair, or just as a necessary condition on it, and does the gap between could-have-done-otherwise as a bare counterfactual and could-have-done-otherwise as a genuine ability (something the agent has access to, something robust) need to be in place first? Why does the case land differently depending on which of those is up? Then the order of the pieces and what depends on what. And I want one case to carry the whole session, and I'd rather not just re-run the one from the reading: so tell me what the carrying example has to have (a reliable prior sign, an intervener who never fires, a decision that is genuinely the agent's own) and what it must not have (a threat, a gun, a coercive offer, anything that reads as the agent being pushed rather than bypassed), and why each of those features or absences matters.

  Relatedly, I've been playing with two variants of my own and can't decide whether either belongs in the hour. Call the first the leaky intervener: the device works only most of the time, so if the agent had tried to do otherwise he'd have had, say, a forty percent chance of actually getting away with it — nothing forces the outcome, there's just no guarantee. Call the second the output-only case: the device leaves the deciding and the willing completely untouched and only redirects the bodily movement at the very last moment, so the agent really does decide and try to do otherwise and simply doesn't get there. Is either of these pedagogically useful, or do they just muddy the water? If one is worth using, where exactly does it go in the sequence and what is it supposed to make them notice — that PAP needs a robust alternative rather than any alternative at all, that the alternative has to be an alternative willing rather than an alternative outcome, both, or something I haven't thought of?

  Then the failure modes, which is the part I care most about. I can guess at a few: that this is determinism in disguise; that the device causes the action despite doing nothing; that the agent could still have willed or tried otherwise, or at least could have failed to show the sign; that Frankfurt just helps himself to the intuition that the agent is responsible, so the case begs the question; and, from the one physics student who'll definitely be there, whether an infallible prior sign is even physically possible and whether it matters if it isnt. Which of these will actually come up, in what order will they come up, and at which point in the sequence should I head each one off rather than answer it? Which single one should I deliberately let hang for a bit? I also want one question to end on that tells me whether they've grasped the structure of the dialectic rather than just whether they've been persuaded, plus an explicit list of what I should openly refuse to get into at this level — reasons-responsiveness, the actual-sequence stuff, the whole secondary literature on whether the case succeeds — and how to say no without sounding like I'm dodging.
reasoning: |-
  Okay, the user is a third-year PhD student TAing a module on Freedom and Responsibility. They need a teaching plan for a 60-minute session with first-year students. Last year's session on Frankfurt cases didn't go well, so they want a better approach. The students have been introduced to PAP (Principle of Alternative Possibilities) and assigned the classic Frankfurt case. The TA has a cold and prefers an activity that doesn't require constant talking.

  First, I need to address why last year's session failed. Students misunderstood the case as determinism with extra steps or thought the agent was controlled. The core issues seem to be: not grasping PAP's role, confusing different interpretations of "could have done otherwise," and not seeing what Frankfurt was arguing against. So the plan must clarify these upfront.

  The TA wants to use one central example, not the original from the reading. The example must have a reliable prior sign, an inactive intervener, and the agent's genuine decision. It shouldn't have coercive elements. They also have two variants: leaky intervener (non-robust alternative) and output-only (alternative willing without outcome). I need to decide if these are useful or distracting.

  For the structure, starting with PAP's purpose is key. Presenting PAP as explaining blame's fairness makes it more intuitive. Then distinguish between counterfactual and robust ability. The classic Frankfurt case shows that even without robust alternatives, responsibility might still hold. The leaky intervener variant could help highlight the need for robust alternatives, but might be saved for later or omitted. The output-only variant risks confusing the focus on alternative willings versus outcomes.

  Failure modes to anticipate: determinism disguise, hidden causation, possibility of willing otherwise, question-begging, physical possibility of infallible signs. The physics student's objection about physical possibility should be acknowledged but deferred. The determinism objection needs early addressing to avoid derailment.

  The session should end with a question testing understanding of the dialectic, like why PAP defenders aren't convinced by Frankfurt. This checks if they see the argument's structure, not just the conclusion. Also, set boundaries: avoid reasons-responsiveness, actual sequences, or secondary literature. Explain these are advanced topics for later study.

  Timing is tight. Allocate 5 min for setup, 15 min for PAP discussion, 20 min for the Frankfurt case and variants, 10 min for objections, 5 min for conclusion, and 5 min buffer. Use the board to map arguments and objections, keeping visuals clear. Encourage student participation to reduce talking time and engage them despite the TA's cold.
answer: |-
  Here's a battle-tested 60-minute plan designed to avoid last year's pitfalls, leverage your constraints, and force clarity on Frankfurt's core move. Focus is on **dialectic structure** and **intuition-pumping**, not resolution.

  **Core Pedagogical Goal:** Students understand **what PAP claims, *why* someone might hold it, and *how* Frankfurt's case specifically targets a necessary premise in an argument *for* PAP** – *not* determinism directly. They should see the "control" objection coming and understand why Frankfurtians think it misses the point.

  **Whiteboard Prep (Do this BEFORE class starts):**
  ```
  1. **PAP:** You are MR for doing X only if you *could have done otherwise*.
  2. **Why PAP? (Intuition Pump):** "Blame requires Fairness. Fairness requires a *genuine choice*. Genuine Choice requires *could have done otherwise* (robust access to alternatives)."
  3. **Frankfurt's Target:** The argument that PAP is *necessary* for MR because *determinism* (or divine foreknowledge, etc.) removes the *ability* to do otherwise, thus removing MR.
  ```

  **The Plan (60 Mins):**

  1.  **Grounding PAP & Its Appeal (10 mins - Board Focused):**
      *   **Q1:** "Monday covered PAP. *Why* does PAP seem plausible? When we blame someone, what makes it feel *fair*?" (Elicit: Choice, control, not being forced, having options).
      *   **Write their answers** near point 2 on the board. Emphasize: PAP often functions as an *explanation* of fairness in blame/praise (not just a bare condition). Link it to the deep intuition that **genuine responsibility requires genuine access to alternatives (robust ability)**.
      *   **Crucial Clarification:** "When PAP says 'could have done otherwise,' what does that mean? Is it just that *if* things had been different *somehow*, a different outcome *might* have happened? Or is it that *the agent themselves*, with the powers they actually have, *could* have chosen and acted differently?" **Hammer: PAP requires robust ability/access in the agent.** (This heads off the "bare counterfactual" misreading of Frankfurt).

  2.  **Introducing the Challenge & Frankfurt's Goal (5 mins):**
      *   Point to board: "So, many argue Determinism is a problem *because* if true, you *lacked that robust ability* to do otherwise. No robust ability -> Violates PAP -> No MR. PAP is the *necessary link* between determinism (or similar threats) and no MR."
      *   **Frankfurt's Aim:** "Frankfurt wants to show this link is broken. He argues: **You can lack the robust ability to do otherwise (PAP is false) *and still be morally responsible.*** If he's right, determinism doesn't *automatically* kill MR via PAP. PAP isn't actually necessary. That's his *only* target here."

  3.  **The Core Case - "The Voting Booth" (20 mins - Student Engagement Focus):**
      *   **Set Up:** "Forget Jones for a moment. Let's build our *own* Frankfurt case step-by-step. Meet Alex. Alex is about to vote in a crucial election."
      *   **Key Features (Build interactively, write key elements):**
          *   **Agent's Genuine State:** Alex has thought long and hard. Alex *genuinely* prefers Candidate A. Alex has *no* internal conflict, coercion, threats, or offers influencing this preference. (*Why?* To isolate the *ability* question, remove *obvious* compulsion).
          *   **The Intervener (Black):** Black implanted a device in Alex's brain *long ago*. Black *wants* Alex to vote for A.
          *   **The Prior Sign:** The device monitors Alex's *subconscious neural activity* for a very specific, involuntary flicker (an "SF-Signal") that *reliably* occurs 5 seconds *only if* Alex is *genuinely beginning to form an intention* to vote for B. (*Why?* Needs to be infallible/reliable and *prior* to the actual decision/willing).
          *   **The Intervention:** *If* the SF-Signal is detected, the device instantly triggers, causing Alex to form a *strong desire* to vote for A and vote for A. Alex would feel this desire as their own. (*Why?* Intervention alters the *willing/deciding*, not just the output. It ensures no alternative *willing* occurs if triggered).
          *   **The Actual Sequence:** Alex walks into the booth. No SF-Signal occurs. Alex votes for A, based entirely on their own, unmanipulated preferences and decision-making. Black's device does *nothing*. (*Why?* The "bypass" must be clean; no actual force or influence).
      *   **The Punchline:** "Alex votes for A. Black's device did nothing. *Could Alex have voted for B?*"
      *   **Discussion:** Let them argue! Guide:
          *   *Physically?* If they try "Alex could have *tried* to vote B!" point to the SF-Signal: Trying to form the intention *is* what would trigger the signal and the intervention, preventing the actual trying/forming of that intention. The device *prevents* the alternative willing/choice from occurring. **Robust access to willing/choosing otherwise is blocked.**
          *   *Counterfactually?* "If Alex had started to choose B, they would have been made to choose A." But that's a counterfactual scenario, not something Alex *could actually access* given the device setup. Reiterate the *robust ability* point from Step 1. **Conclude: Frankfurt argues Alex *lacks the robust ability* to vote for B. PAP is false in this case.**
      *   **The MR Intuition:** "Is Alex morally responsible for voting for A?" (Elicit the intuition: Yes, because it was *entirely* their own choice, the device did nothing). **Write: "Intuition: Alex *is* MR for voting A."**

  4.  **The Frankfurtian Conclusion & The Dialectic (5 mins - Board Focused):**
      *   Point to board: "PAP False (No robust ability). Intuition: MR True. Therefore: PAP is *not necessary* for MR." Circle this conclusion.
      *   Reiterate Target: "This directly attacks the *link* used to argue that determinism (which removes robust ability) *must* remove MR. Frankfurt says: Look, even *without* determinism, we have a case with no robust ability *but with* MR. So determinism removing robust ability doesn't *automatically* mean no MR. The PAP defender's argument fails."

  5.  **Anticipating & Defusing Failure Modes (15 mins - Guided Discussion):**
      *   **Let them voice objections!** Prioritize based on likelihood:
          *   **"It's just determinism!"**: "How? Determinism says *all* events are causally necessitated. Here, *in the actual sequence*, Alex's vote *isn't* caused by Black or the device! It's caused by Alex's own reasons and character. The device is a *counterfactual preventer*, not an *actual determiner*. Frankfurt *needs* the actual sequence to be indeterministic (or at least, not determined by the *threat*) for the MR intuition to bite." (Board: "Actual Sequence: Alex's Own Reasons").
          *   **"But Alex is controlled/not free!"**: "What *specifically* controls Alex in the actual sequence? Nothing. The device did nothing. Alex acted on their own preferences. The *intuition* is that they *are* responsible. The objection often smuggles in PAP itself! The *point* is to challenge whether lacking the robust ability *is* what constitutes a lack of control relevant to MR in *this specific way*."
          *   **"The device caused it by being there!" (Hidden Causation)**: "Did it? How? Did it influence Alex's deliberation? (No). Did it make Alex prefer A? (No, Alex already did). Its *only* effect is *counterfactual* prevention. Does the mere *existence* of a counterfactual preventer rob you of responsibility for what you do freely? If I *would* have tackled you if you tried to rob the bank, but you never try, does that mean I caused you not to rob the bank? No, *you* decided not to."
          *   **"Couldn't Alex have *not shown the sign*?"**: "The SF-Signal is defined as an *involuntary* precursor to *beginning to form the intention*. If Alex *begins* to form the intention not to vote A, the signal *must* fire. It's part of the setup. The case assumes the mechanism works as described." (*Save this "begging the question" version for below*).
          *   **"Begging the Question!"**: "How so? Frankfurt *assumes* Alex is responsible to argue PAP isn't necessary? Yes! That's the *method*. It's an **intuition pump**. The goal is to elicit the judgment that Alex *is* responsible *despite* lacking the robust ability. If you *don't* share that intuition, you're not moved. But many do. Frankfurt's point is *if* you have that intuition, you must reject PAP as necessary. It highlights a tension."
          *   **Physics Student: "Infallible Sign Impossible!"**: **Acknowledge & Sideline:** "Great point! It's a *philosophical device* to construct a clear counterexample. We're testing *concepts* (PAP, MR), not neuroscience. Does the *conceptual possibility* challenge the *necessity* claim of PAP? If so, it does its job. Real-world feasibility isn't the point here." (Write: "Conceptual Case").
      *   **Which to let hang?** Let the **"Begging the Question"** objection hang briefly. "Interesting... so is the case just *assuming* the answer to the very question it's trying to settle? Does that make it useless? Or is there value in exposing that our intuitions about responsibility *don't* always track the ability to do otherwise?" Transition to the closing question.

  6.  **Closing & Assessment (5 mins):**
      *   **The Key Question:** "Okay, suppose a defender of PAP looks at our Voting Booth case. They *agree* the device blocks the robust ability to vote B. But they *insist* Alex is *not* morally responsible. **What is the PAP defender's *best reason* for denying Alex is responsible, *even though* the device did nothing in the actual world?" (Correct Answer: **"Because lacking the robust ability to do otherwise *just is* what makes someone not responsible, regardless of the actual sequence."** This shows they grasp PAP's role as the *necessary condition* Frankfurt is targeting).
      *   **Where We Are:** "So, Frankfurt thinks he's shown PAP isn't necessary. PAP defenders disagree, often because they think lacking robust alternatives *does* undermine responsibility. That's the stalemate. This opens the door to asking: *What* *is* necessary and sufficient for MR, if not PAP? But that's for another day..."
      *   **Explicit Boundaries:** "Before you go: **What we *didn't* do today:** We didn't settle *if* Frankfurt succeeds. We didn't dive into *why* Alex might be responsible (Reasons-responsiveness? Actual-sequence mechanisms?). We didn't tour the 50 years of follow-up papers. **Why?** Because today was about understanding the *structure of Frankfurt's core argument against the necessity of PAP*. Got it? Good. See you next time."

  **Why This Works & Addresses Your Needs:**

  *   **One Case Carries Weight:** "The Voting Booth" is custom-built to avoid distracting elements (no guns, threats) and focus on counterfactual prevention of *willing*. The SF-Signal makes the prior sign explicit.
  *   **PAP Grounded:** Explicitly framing PAP as explaining the *fairness* of blame via *robust ability* makes the Frankfurt challenge sharper and avoids the "bare counterfactual" confusion.
  *   **Variants Sidestepped:** Your "Leaky Intervener" (40% chance) is excellent, but complicates the *necessity* argument by introducing probabilistic ability. Save it for a discussion on *sufficiency* or robustness. The "Output-Only" variant risks confusing the *source* of responsibility (is it the decision or the action?) and weakens the "no alternative *willing*" point crucial to blocking "could have tried". Stick to the core.
  *   **Failure Modes Pre-empted:** Structure forces clarity on determinism vs. counterfactual prevention early. The board layout constantly references the *target* argument. The physics objection is cleanly sidelined. Letting "begging the question" hang highlights the intuitive nature of the debate.
  *   **Reduced Talking:** Heavy use of Q&A, board work, and structured objection discussion. Your role is facilitator, not lecturer.
  *   **Assessment:** The closing question directly probes understanding of the dialectic structure, not just agreement.
  *   **Boundaries Clear:** Explicitly stated what's out of scope and why, framing it as focus, not dodge.

  **Board State at Key Moments:**

  *   **Start:** Points 1, 2, 3 clearly written.
  *   **After PAP Discussion:** Key "fairness" points added near 2; "Robust Ability" highlighted/underlined.
  *   **After Voting Booth Setup:** Key elements listed (Genuine State, Intervener, SF-Signal, Intervention, Actual Sequence) + "PAP False? (No Robust Ability)" + "Intuition: MR True?".
  *   **Frankfurt Conclusion:** "PAP False. Intuition: MR True. Therefore: PAP NOT Necessary for MR." Circled.
  *   **During Objections:** "Actual Sequence: Alex's Own Reasons" / "Conceptual Case" added as needed.
  *   **End:** Frankfurt Conclusion remains circled. Closing question written.

  This plan provides clear structure, maximizes engagement, targets known misunderstandings head-on, and achieves the core goal of illuminating Frankfurt's argumentative strategy against PAP. Good luck, and feel better!
