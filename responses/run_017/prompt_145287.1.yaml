  #### **Branch 1: Conventions can create moral obligations (Yes to Q1)**  
  **Question 2: Does this obligation vanish if locals mostly ignore the convention?**  
  *Case: Edging into a loose, crowd-like queue at a market stall where queueing is barely observed (e.g., people cluster instead of forming a line). Must a visitor still queue properly?*  
  - **Yes, obligation remains** → Go to Question 3  
  - **No, obligation weakens or disappears** → Go to Question 4  

  **Question 3: Does the obligation hold even if the visitor had no fair chance to learn the rule?**  
  *Case: A person fresh off the plane (no time to learn) holds a place in line for four friends at a busy bakery with strict queueing. Is this wrong?*  
  - **Yes, obligation applies anyway** → **Position: Strict Conventionalism**  
    - *Most awkward commitment:* A visitor who unknowingly violates a convention (e.g., wears shoes indoors) is morally blameworthy even if they couldn’t have known the rule.  
  - **No, obligation requires a fair chance to learn** → **Position: Learning-Dependent Conventionalism**  
    - *Most awkward commitment:* A long-term resident who "should have known" a rule is morally obligated to follow it, but a day-one newcomer isn’t—even if their identical action causes the same practical effects.  

  **Question 4: Is the obligation only binding if non-compliance harms identifiable people?**  
  *Case: Leaving no tip after genuinely poor service in a country where servers rely on tips to live (e.g., paid below minimum wage). Does this create a moral obligation to tip, even if the service was bad?*  
  - **Yes, harm is essential** → **Position: Harm-Based Conventionalism**  
    - *Most awkward commitment:* If a convention (like a loose queue) causes no direct harm when ignored, there’s no moral obligation to follow it—even if it’s widely practiced.  
  - **No, obligation exists regardless of harm** → Go to Question 5  

  **Question 5: Is the obligation strongest when there’s no "clean exit" (a reasonable way to avoid the situation)?**  
  *Case: Paying the cheaper takeaway price for coffee and sitting in the more expensive table-service area. Is it wrong if the visitor had no clear way to avoid this (e.g., no signs explaining the rules)?*  
  - **Yes, clean exit matters** → **Position: Consent-Based Conventionalism**  
    - *Most awkward commitment:* If you have a clean exit (e.g., you can decline to enter the restaurant), violating a convention isn’t wrong—but if you stay, you must comply fully, even if the rule is unfair.  
  - **No, exit doesn’t matter** → **Position: Community Membership Conventionalism**  
    - *Most awkward commitment:* By entering a community (even briefly), you take on moral duties to follow its conventions—like removing shoes—regardless of whether you could have avoided the situation.  

  ---

  #### **Branch 2: Conventions do not create moral obligations (No to Q1)**  
  **Question 6: Can independent moral reasons (e.g., preventing harm, showing respect) still create obligations to follow some conventions?**  
  *Case: Crossing against a red light while a child (still learning local rules) is watching. Is this wrong because it risks teaching bad habits, even if the street is empty?*  
  - **Yes, other reasons matter** → Go to Question 7  
  - **No, never an obligation** → **Position: Conventionalism Rejected**  
    - *Most awkward commitment:* Not following a convention is never a moral failing—even if it causes harm (e.g., a child imitating your jaywalking gets hurt), the issue is the harm alone, not the rule-breaking.  

  **Question 7: Is the primary reason to prevent harm?**  
  *Case: Refusing to haggle where haggling is how prices are set (e.g., at a market), potentially costing the vendor income. Is there a moral obligation to haggle?*  
  - **Yes, harm prevention is key** → Go to Question 8  
  - **No, other reasons dominate** → Go to Question 10  

  **Question 8: Must the harm be to an identifiable person (not just systemic)?**  
  *Case: Splitting a restaurant bill evenly when one person ordered far more, costing others money. Does this create a moral obligation to object?*  
  - **Yes, identifiable harm required** → **Position: Individual Harm Principle**  
    - *Most awkward commitment:* No obligation exists to follow conventions that only prevent collective/systemic harm (e.g., queueing in a crowd)—only those protecting specific people (like tipping underpaid workers).  
  - **No, systemic harm counts too** → Go to Question 9  

  **Question 9: Does entanglement with injustice (e.g., unfair wages) change the obligation?**  
  *Case: In a country where servers are paid below minimum wage and rely on tips, does a visitor have a stronger moral obligation to tip than a local?*  
  - **Yes, injustice heightens obligation** → **Position: Justice-Enhanced Duty**  
    - *Most awkward commitment:* Visitors might have a greater moral duty to follow certain conventions (like tipping) than locals, to avoid exploiting unjust systems they didn’t create.  
  - **No, same for everyone** → **Position: Universal Harm Principle**  
    - *Most awkward commitment:* A visitor must follow harm-preventing conventions (e.g., tipping where wages are low) exactly as a local would—even if the visitor disagrees with the system.  

  **Question 10: Is the primary reason to show respect?**  
  *Case: Leaving a tip where tipping is not customary (e.g., confusing or insulting the server). Is this wrong if the intent was respectful?*  
  - **Yes, respect matters most** → **Position: Respect as Compliance**  
    - *Most awkward commitment:* You must follow conventions precisely to show respect—even a well-intentioned misstep (like tipping where it’s not done) is a moral failure.  
  - **No, fairness matters most** → **Position: Fairness over Custom**  
    - *Most awkward commitment:* You should break conventions that produce unfair outcomes (e.g., splitting a bill unevenly)—even if locals accept them—to uphold a higher moral standard.  

  ---

  ### **Notes on the Tree**  
  - **Total leaves:** 12 positions. All combinations are occupied except one: The path "No to Q1 → No to Q6" leads to *Conventionalism Rejected*, but "Yes to Q1 → Yes to Q3 → No" (Learning-Dependent Conventionalism) has no further branches—this is **unoccupied** because real-world views typically extend to other conditions (e.g., harm). It’s empty because it’s unattractive: It makes obligation hinge narrowly on awareness, ignoring consequences.  
  - **Hard-to-separate leaf pairs:**  
    - *Harm-Based Conventionalism (Branch 1) vs. Individual Harm Principle (Branch 2):* Both say tipping is obligatory only if it prevents harm. **Discriminating case:** "Crossing against a red light on a completely empty street where everyone crosses." Harm-Based Conventionalism might say it’s still wrong (convention binds), while Individual Harm Principle says no (no harm, no obligation).  
    - *Respect as Compliance (Branch 2) vs. Strict Conventionalism (Branch 1):* Both condemn keeping shoes on. **Discriminating case:** "Holding a place in line for friends." Strict Conventionalism forbids it (breaks queueing rules), while Respect as Compliance might allow it if done politely (e.g., asking permission).  
  - **Your three-way convention split:** Coordination (queueing), transfer (tipping), and risk (jaywalking) is useful but breaks down when conventions overlap. For example, quiet carriages coordinate space *and* allocate risk (of disruption). A fourth category—**symbolic conventions** (e.g., shoe removal)—captures norms tied to respect/belonging with no practical goal. This improves coverage, especially for cases like "keeping shoes on."  
  - **Who is owed the obligation?** If a visitor must follow a convention, the "debt" depends on the position:  
    - Harm-based views (e.g., *Harm-Based Conventionalism*) owe it to identifiable individuals (e.g., the underpaid server).  
    - Community-focused views (e.g., *Community Membership Conventionalism*) owe it to the collective for social cohesion.  
    - Justice/fairness views (e.g., *Justice-Enhanced Duty*) might owe it to victims of injustice (e.g., workers in unfair systems) or to no one (a universal duty).  
    No position clearly "wins"; it highlights that conventions aren’t monolithic.  

  This taxonomy replaces abstract arguing with self-reflection on cases. Participants can identify their position, see its implications, and debate others’ "awkward commitments" constructively.
