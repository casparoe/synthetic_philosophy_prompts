answer: |-
  Here's a complete exam package for Dr. Vasa, designed to feel authentic, philosophically substantive, and resistant to eye-rolling:

  **Exam Question (Half-Page Max):**

  > **Time Allowed: 90 Minutes**
  >
  > **Answer ONE of the following:**
  >
  > Consider the "Kalu case": In Village V, everyone learns the name "Kalu" solely from a storyteller whose tales are factually true of a man named Kofi who died decades ago in a distant country, unknown to the villagers. Villagers utter sentences like "Kalu was unlucky." Surveys reveal a divergence: Population A overwhelmingly says that when a villager utters "Kalu was unlucky," they are saying something *about Kofi*. Population B overwhelmingly says they are *not* saying something about Kofi (or that there is no one they are saying it about). Crucially, both populations agree on a control case (e.g., Ama puts keys in a drawer at noon, says "My keys are in the drawer," and we ask at 3pm with no disturbance: "Did Ama know where the keys were at noon?" Both groups say "yes").
  >
  > **A.** Grant the 'Bridle Constraint': Any explanation offered for the divergence in the Kalu case (e.g., miscomprehension, pragmatic politeness, differing interpretations of the question) must also explain why this divergence *does not occur* in the control case. Given this constraint, does the empirical divergence observed in the Kalu case provide any compelling reason to revise our philosophical theories about how reference works? Defend your answer. Be sure to specify what kind of evidence *would* compel such revision.
  >
  > **B.** Grant the 'Bridle Constraint' (as defined in Question A). Does the persistence of such empirically documented divergence (despite the Bridle) undermine the entire project of using elicited intuitions – whether 'folk' or 'expert' – as evidence in philosophical arguments about reference? Defend your answer. Be sure to specify what would have to be true about the world or our cognition for you to change your mind on this point.

  ---

  **Model Answer (Targeting Question A; ~700 words):**

  The empirical divergence in the Kalu case, constrained by the Bridle, does not *in itself* compel revision of our best theories of reference (e.g., causal-historical chains). Instead, it highlights the complex interface between semantic competence and other cognitive or pragmatic factors that surveys struggle to isolate, demanding careful interpretation rather than theory abandonment.

  The Bridle is crucial. It eliminates dismissive explanations like "Population B simply didn't understand the story" or "they were being polite/non-literal," because such factors would presumably affect the control case too. Yet both populations *do* agree on the control case – they reliably attribute knowledge in a straightforward perceptual scenario. This suggests both groups possess the basic cognitive tools needed for the task: understanding narratives, attributing mental states, and evaluating truth conditions in simple cases. The divergence is thus *specific* to the philosophically contentious scenario involving reference under ignorance of origin.

  This specificity protects core reference theories. A causal-historical theorist can argue that both populations *implicitly* grasp the correct reference (to Kofi), but that Population B is misreporting their semantic intuition due to interfering factors uniquely triggered by the Kalu scenario's peculiarity. What factors? Perhaps Population B conflates the question "Who is the speaker referring to?" with "Who does the speaker *intend* to refer to?" or "Who does the speaker *believe* they are referring to?" Villagers clearly intend to refer to the character described; they likely have no beliefs about Kofi. For Population B, the speaker's lack of access to Kofi might dominate their response, leading them to report that the speaker isn't referring to *anyone real* or isn't referring to Kofi, mistakenly taking the question epistemically. Population A might better isolate the purely semantic question of who the name, given its causal history, actually picks out. The control case lacks this ambiguity – Ama's intention, belief, and the key's location are transparently aligned. The Bridle forces us toward explanations like this, where the *semantic fact* (reference to Kofi) remains constant, but *accessing or reporting the intuition* about it is perturbed in one context.

  Does this mean the divergence is philosophically inert? Not entirely. It *does* give us reason to refine how we *elicit and interpret* intuitions used in arguments. If a significant portion of competent language users persistently misreport intuitions under certain conditions (even when understanding isn't the issue, per the Bridle), it suggests our thought experiments might be probing a blend of semantic and extra-semantic cognition. This urges caution in treating raw survey results as direct windows onto semantic facts. However, it doesn't force us to abandon the core claim that 'Kalu' refers to Kofi. Revision would only be compelled if evidence emerged that the divergence stemmed from a *genuine difference in semantic competence itself* – for instance, if we found a linguistic community where names functioned fundamentally differently (e.g., purely descriptively with no historical link) *and* this correlated systematically with Population B-type responses across varied cases. Alternatively, if we discovered robust cognitive markers showing Population B accesses a genuinely different semantic rule when processing the name "Kalu" in the story context, that would be strong revisionary evidence. The current divergence, filtered by the Bridle, points more to noise in the measurement tool than a flaw in the theoretical model being measured.

  *(Consensus & Controversy Note: It's settled that significant intuitive divergence exists for cases like Gödel/Schmidt or Kalu, and that simple "they didn't understand" explanations are inadequate (Bridle-like constraints are widely accepted in principle). It's heavily contested whether this divergence reflects noise, performance errors, genuine semantic differences, or reveals philosophy's over-reliance on intuitions. The legitimacy of privileging "expert" intuitions is a major battleground – proponents argue expertise involves refining the relevant conceptual capacity, critics see it as bias-masking circularity. The empirical robustness of specific variations is constantly tested, but the phenomenon itself is replicable.)*

  ---

  **Marking Scheme (Out of 20):**

  1.  **Understanding & Applying the Bridle Constraint (4 marks):** Clearly explains the Bridle and uses it effectively to rule out simplistic dismissals of the divergence. *Common Pitfall:* Vaguely gestures at the constraint without showing *how* it undermines specific easy explanations or why the control case agreement matters.
  2.  **Engagement with Divergence (4 marks):** Offers a plausible, non-question-begging explanation for *why* divergence occurs in Kalu but not the control case, consistent with the Bridle, without simply asserting unrepresentative samples. *Common Pitfall:* Defaulting to "the samples are WEIRD/unrepresentative" without specifying what relevant representational failure *explains the specific pattern of divergence* constrained by the Bridle.
  3.  **Treatment of Expertise/Intuition (4 marks):** Addresses the role of intuitions (folk or expert) as evidence. If appealing to expertise, explains *what expertise provides* (e.g., better isolation of semantic question, refined concepts) and *why this matters for evidence*, avoiding mere assertion. If rejecting expertise filtering, provides a positive account of how to handle divergence. *Common Pitfall:* Simply asserting "only expert intuitions count" without explaining *why* their filtered intuitions are better evidence, or dismissing expert filtering without offering a viable alternative for using intuitions amidst divergence.
  4.  **Argument on Revision (4 marks):** Takes a clear stand on whether the divergence (with Bridle) forces revision of reference theories and provides a coherent argument for that stand. Explicitly states what kind of evidence *would* compel revision. *Common Pitfall:* Arguing weakly for revision based solely on the existence of divergence, or dismissing revision entirely without engaging the challenge the divergence poses to the methodology of using intuitions.
  5.  **Accuracy on Consensus/Controversy (4 marks):** Correctly identifies in the conclusion (or clearly integrated) which aspects of the analysis reflect broad consensus and which are live, contentious debates within the relevant philosophical literature (e.g., robustness of variation, legitimacy of expertise). *Common Pitfall:* Presenting a highly contentious view (e.g., "intuitions are useless") or a specific explanation for divergence as settled fact, or failing to acknowledge significant areas of ongoing dispute.

  ---

  **Why this works for Dr. Vasa & Novel:**

  *   **Authentic Tone:** The question is dense, slightly gnarly, and forces engagement ("Grant the Bridle..."). It's provocative ("undermine the entire project?") without being cute. The model answer has the weary precision of an academic ("does not *in itself* compel", "points more to noise in the measurement tool").
  *   **Substantive & Constraint-Respecting:** It grapples deeply with the core puzzle (Bridle + divergence) without citations. It tackles "experts" and "unrepresentative" head-on but demands they be *cashed out* (Marks 2 & 3). The Consensus note is explicit and integrated.
  *   **Philosophically Plausible:** The model answer presents a defensible, mainstream-philosopher-friendly position (divergence is noise/misreporting, not semantic difference), while acknowledging the controversy. It doesn't parody philosophy; it engages a real methodological headache.
  *   **Deflaty but Real:** It highlights the messiness of using intuitions ("complex interface", "noise in the measurement tool") – Vasa's disillusionment shows – but doesn't descend into nihilism; there's still a path for argument and potential revision.
  *   **Clear Grading:** The scheme is practical (train-friendly), rewards depth over rote learning, and penalizes the lazier moves by demanding explanation (Pitfalls for Marks 2, 3, 5). Mark 5 specifically rewards the meta-awareness Vasa values.

  This gives you the philosophical heft and authentic academic texture needed, while staying firmly within your constraints and serving the character and story. Good luck with the novel!
