answer: |-
  Here is a carefully constructed list of desiderata for a *first-personal normative theory of choice for bounded agents*, derived from your specifications and critical analysis. I first list candidate requirements from brainstorming, then strike program-specific preferences, and finally present the polished list with grounding cases.

  **Brainstorming Candidates & Striking Program-Specific Preferences:**  
  *Candidates:*  
  1. Action-guidance during deliberation  
  2. Avoids infinite regress in meta-deliberation  
  3. Specifies a non-arbitrary currency for cognitive costs  
  4. Grain-invariance under redescription  
  5. Distinguishes procedural rationality from substantive outcomes  
  6. Permits strategically suboptimal local choices  
  7. Treats cognitive constraints as endogenously pliable  
  8. Allows self-assessment without outcome knowledge  
  9. Robust across environments (not "lucky")  
  10. Computationally tractable prescriptions  
  11. Compatible with heuristic use  
  12. Respects temporal constraints of real-time choice  

  *Struck Items:*  
  - (10) "Computationally tractable prescriptions": Too implementation-focused; a normative theory need not *be* tractable, but must *prescribe* tractably.  
  - (11) "Compatible with heuristic use": Specific to heuristic-based programs (e.g., fast-and-frugal); an adequate theory might *prescribe* heuristics without requiring compatibility.  
  - (12) "Respects temporal constraints": Redundant with (1) and (7).  
  - (9) "Robust across environments": Better captured by (8) and ecological validity in assessment.  

  ---

  ### **Polished Desiderata List**  
  *(With grounding cases and key distinctions)*  

  1. **First-Person Action Guidance (FPAG)**  
     - *Specification:* Must generate *usable directives during deliberation*, not just ex post evaluations.  
     - *Grounding Case:* An agent deciding whether to evacuate during a wildfire cannot rely on a theory requiring unavailable data or infinite regression; the theory must output "do X now" under pressure.  

  2. **No Regress Halting (NRH)**  
     - *Specification:* Must resolve the meta-deliberation regress (deciding *how* to decide) without presupposing unbounded resources.  
     - *Grounding Case:* An agent estimating the value of further deliberation about investment options cannot first compute the optimal stopping point—doing so incurs the very costs it seeks to justify.  

  3. **Unified Currency Integration (UCI)**  
     - *Specification:* Must denominate cognitive costs (attention, time, memory) in a *commensurable unit* charged to the *agent's own budget*, explaining trade-offs between thinking and acting.  
     - *Grounding Case:* Spending an hour calculating route options has opportunity costs (e.g., missed work). The theory must say whether this cost is justified *for the agent*, not an external observer.  

  4. **Grain-Invariance (GI)**  
     - *Specification:* Verdicts must be invariant under redescriptions of options or processes that preserve the underlying choice problem but alter computational cost.  
     - *Grounding Case:* Deciding "which job to take" (coarse-grained) vs. "which job, considering 37 sub-factors" (fine-grained) shouldn’t flip prescriptions if the *options* are identical. Scaling costs with description fineness must not alter rationality. *(Your addition: GENUINE—prevents theory from being an artifact of framing.)*  

  5. **Procedural-Substantive Distinction Preservation (PSDP)**  
     - *Specification:* Must *not* collapse procedural and substantive rationality; it should explain why a *process* can be rational even when it leads to suboptimal outcomes.  
     - *Grounding Case:* An agent using a quick rule-of-thumb to choose a medical treatment under time pressure might pick a suboptimal option—but the *rule* could still be rational given constraints.  

  6. **Strategic Suboptimization Permissibility (SSP)**  
     - *Specification:* Must allow agents to rationally adopt policies (e.g., habits, commitments, rules) that *intentionally* sacrifice local optimization for global gains.  
     - *Grounding Case:* Committing to "never negotiate after midnight" avoids cognitively costly haggling but may reject beneficial deals; the theory must justify such rules as rational.  

  7. **Endogenous Budget Plasticity (EBP)**  
     - *Specification:* Must treat cognitive constraints (attention, skill, memory) as *investable resources*, not fixed parameters.  
     - *Grounding Case:* An agent can rationally spend time *now* learning statistics to *reduce future decision costs*; constraints are dynamic, not exogenous.  

  8. **Ex Ante Assessability (EA)**  
     - *Specification:* The theory's prescriptions must be justifiable *without knowing outcomes or the "correct" answer*.  
     - *Grounding Case:* A doctor using a diagnostic heuristic must be able to defend it *before* knowing if the diagnosis was correct; luck doesn’t retroactively validate poor procedures.  

  ---

  ### **Conflicts and Exclusion Power**  
  - **Suspected Conflict:** **Endogenous Budget Plasticity (EBP)** and **No Regress Halting (NRH)** are in tension. Investing in cognitive resources (EBP) requires deliberating *about* that investment—but NRH demands this deliberation itself must halt without infinite regress.  
  - **Most Exclusionary Requirement:** **No Regress Halting (NRH)** does the heaviest lifting. It excludes:  
    - Naive marginal-value rules ("stop when cost > benefit") if they ignore the cost of *estimating* cost/benefit.  
    - "Optimal stopping" theories that presuppose unbounded computation to model stopping points.  

  ---

  ### **Assessment of Existing Approaches**  
  - **Expected Utility + Cost Term:** Often violates **NRH** (computing E[U] of further computation is paradoxical) and **EA** (cost functions are rarely assessable ex ante).  
  - **Simonian Satisficing:** Descriptively useful but normatively incomplete—fails **FPAG** (what aspiration level to set?) and **UCI** (what justifies the "satisficing" threshold?).  
  - **Resource-Rationality:** Addresses **UCI** but struggles with **EBP** (treats resources as fixed) and **GI** (costs are sensitive to parameterization).  

  **Is Satisficing a Theory?**  
  No—it is a *behavioral pattern* that any adequate theory must *explain or prescribe under specific constraints*. Without specifying *how* aspiration levels are set and adjusted, it lacks normative force for first-person deliberation (**FPAG**, **EA**).  

  ---

  This list defines the non-negotiable core. Any theory avoiding these desiderata either relapses into unbounded rationality or reduces to a descriptive heuristic. The hardest nut is **NRH**, which forces a fundamental reconception of meta-cognition.
