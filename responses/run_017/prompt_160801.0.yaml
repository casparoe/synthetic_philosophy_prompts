  Materials for Round 3:
    - For both groups: 
        - Each player gets 10 beans (as money) at the start of Round 3.
        - Index cards (for claim tickets: pre-cut, maybe 10 per player).
        - Big paper and markers for villagers if they want a ledger.
    - Assign goods: 
