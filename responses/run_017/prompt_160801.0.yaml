    Goal: Each player wants one of each good type. So they need to acquire two other goods (if there are three types). They can sell their own good and then use the beans to buy others.

    Rules for trading in Round 3:
        - Villagers: 10 minutes of free trading (they can trade with anyone, multiple times). They can use the beans and claim tickets as described.
