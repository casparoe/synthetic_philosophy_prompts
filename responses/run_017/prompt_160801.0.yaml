    - For strangers: "You are travelers who meet only once. You will have three trading rounds. In each round, you will be paired randomly with one other traveler. You must complete the trade during the round (exchange beans and claim tickets). You will not trade with the same person twice. There is no central ledger, so you must use the claim tickets."

