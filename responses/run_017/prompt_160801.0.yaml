  This design should allow the participants to experience the key concepts. Be prepared to adapt if they come up with a different system in Round 3.

  Good luck!
answer: |-
  ### Game Design: "The Berkeley Exchange"  
  **Goal:** Experience money as a "ticket or counter" for reckoning, recording, and transferring value—without upfront lectures. Focus on production backing value, trust in stranger interactions, and money as a record-keeping tool.  

  **Materials per Round:**  
  - Poker chips (300+), dried beans (1 bag), index cards (50+), envelopes (13), big sheet of paper, markers, whiteboard.  
  - **Goods:** Use beans (physical) or index cards labeled "Grain," "Fish," "Tools," etc. (abstract).  

  ---

  ### **Round 1: Scarcity Scramble** (15 min)  
  **Goal:** Feel chips as worthless without production. Map to Berkeley's "intrinsic value" vs. "pledge."  
  - **Setup:**  
    - Each player gets 50 identical poker chips.  
    - Only 3 real "goods" (e.g., 3 bags of beans) exist.  
  - **Rules:**  
    - Auction goods using chips (open outcry). Highest bidder wins.  
    - **Payoff:** 1 point per good owned. Chips = 0 points.  
  - **Debrief Hook:** *"Why did chips feel valuable during bidding? What were they backed by?"*  
    - **Berkeley Link:** Chips are a "pledge" for goods—but without production, they’re hollow.  
  - **Predictable Issues:**  
    - Overbidding (chip illusion).  
    - "Money is debt!" interjection → Redirect: "Hold that thought for Round 3."  

  ---

  ### **Round 2: Production Collapse** (25 min)  
  **Goal:** Prices crash when production exists. Map to Berkeley’s "standard/measure" vs. "ticket."  
  - **Setup:**  
    - Same 50 chips per player.  
    - **Production Phase (5 min):** Each player "grows" goods:  
      - Choose to make 0–5 units (write number on index card).  
      - Actual goods = dried beans (1 bag per 5 units claimed).  
  - **Trading (15 min):**  
    - Sell/buy goods for chips. Record trades on index cards (e.g., "Anna → 1 Fish for 10 chips from Ben").  
    - **Payoff:** 1 point per good. Chips = 0.  
  - **Debrief Hook:** *"Why did prices plummet? What changed from Round 1?"*  
    - **Berkeley Link:** Money as a "measure" fails when production floods the system.  
  - **Predictable Issues:**  
    - Bean-hoarder → Prices crash anyway (supply > demand).  
    - "Quantity theory!" comment → Acknowledge: "Yes—but *why* does money lose meaning without scarcity?"  

  ---

  ### **Round 3: Shipwreck Ledger** (35 min)  
  **Goal:** Strangers need physical tokens; villagers use trust. Map to "ticket for reckoning/recording."  
  - **Setup:**  
    - Split group: **Villagers** (6 players, fixed partners) and **Strangers** (7 players, reshuffled each trade).  
    - **"Ship sinks":** All chips confiscated.  
    - Each player makes 1 bulky "good" (e.g., draw a "Pottery," "Shoe," etc. on index cards).  
    - **Rule:** Goods *cannot move* (taped to seats). Only ownership transfers.  
  - **Trading (20 min):**  
    - **Villagers:** Trade freely. Can use IOU ledgers (big paper) or tokens (self-made from index cards).  
    - **Strangers:** Rotate partners every 3 min (no repeat trades). Must settle *on the spot* with physical tokens (no IOUs).  
    - **Constraint:** No shared ledger (strangers), no verbal promises (all).  
  - **Payoff:** 5 points per unique good type owned.  
  - **Debrief Hook:** *"How did strangers record trades? Why did villagers not need tokens?"*  
    - **Berkeley Link:** Money is a "counter" for strangers to verify records without trust.  
  - **Predictable Issues:**  
    - Group rejects scrip → Force physical tokens for strangers ("How else can you prove ownership to someone who won’t see you again?").  
    - Villagers use verbal IOUs → Gently enforce: "The taxman burned your ledger. Write it down!"  

  ---

  ### **Debrief Script** (15 min)  
  **Start with Participant Reflections:**  
  - *"What felt different between rounds? When did tokens seem ‘real’?"*  

  **Map to Berkeley’s Questions:**  
  1. **Round 1 (Scarcity):**  
     - "Chips had no *intrinsic value*—they were a ‘pledge’ for scarce goods. No production → no backing."  
  2. **Round 2 (Production):**  
     - "Money as a ‘standard’ or ‘measure’ collapsed when goods multiplied. Value depends on *what’s grown*."  
  3. **Round 3 (Shipwreck):**  
     - **Villagers:** Used trust/ledgers ("recording" via relationships).  
     - **Strangers:** Needed physical "tickets" to *record and verify* trades across unknowns.  

  **Key Insight:**  
  - "Money isn’t the value—it’s a *provable record* of who owes what, especially between strangers. Berkeley’s ‘ticket’ is a ledger we all agree on."  

  **Limitations to Address Verbally:**  
  - **Future Claims:** "Real money covers *future* crops (e.g., loans). Our game had no time—money bridges time and trust."  
  - **Taxman Fear:** "States enforce money’s value (e.g., taxes). Here, trust was organic—but reality needs enforcement."  

  **Stumbling Blocks Mitigated:**  
  - "Quantity theory!" → "The equation describes *how* money loses value, but Berkeley asks *why* it has value at all."  
  - "Money is debt!" → "Yes! In Round 3, tokens *were* debt—claims on goods. But strangers needed a physical record."  

  ---

  ### **Timeline**  
  - **0:00–0:15:** Round 1  
  - **0:15–0:40:** Round 2 (5 min production, 15 min trade, 5 min tally)  
  - **0:40–1:15:** Round 3 (5 min setup, 20 min trade, 5 min redemption)  
  - **1:15–1:30:** Debrief  

  ---

  ### **Why This Works**  
  - **Hands-On Revelation:** Players *feel* money’s dependence on production (Round 2) and recording (Round 3 strangers).  
  - **Strangers vs. Villagers:** Highlights Berkeley’s "recording" need—strangers will grab for tokens, villagers default to trust.  
  - **No Lecture:** Rules force discovery. Save "ticket" for debrief.  

  **If chaos erupts:** Lean in! Let the bean-hoarder cause hyperinflation. Let strangers barter inefficiently—then ask, *"How could you fix this?"* Your group’s wrinkles will make Berkeley’s ideas stick.
