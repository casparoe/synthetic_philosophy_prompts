    - "The ship sank and you lost all your chips. You are now on an island. Each of you has produced one bulky good (assigned). You want one of each type (A, B, C) for 10 points. Extra goods are 1 point. But the goods are too bulky to move until the end of the game. You have been given 10 beans each as a new currency. You can trade using these beans and by writing claim tickets. When you sell your good, you must give the buyer a claim ticket that entitles the bearer to pick up the good at your station at the end. You can buy and sell as you wish. At the end, you will redeem claim tickets to collect goods. Note: you can resell a claim ticket you bought (it's a bearer instrument)."

