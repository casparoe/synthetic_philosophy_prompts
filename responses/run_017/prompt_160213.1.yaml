answer: |-
  ## Joint Statement: Adversarial Collaboration on Scientific Modeling

  **Section 1: Agreed Claims**

  1.  **Purpose:** Scientific models are tools for understanding, predicting, and intervening in complex target systems. Their primary function is to generate reliable outputs (e.g., predictions, explanations, intervention forecasts) within a specified domain.
  2.  **Prediction:** A model demonstrates predictive success when its outputs reliably match empirical data within its intended scope and specified range of application. Predictive success, especially novel prediction (outside calibration data), is a strong, necessary (though not always sufficient) indicator of a model's practical adequacy for its intended task.
  3.  **Intervention:** To reliably forecast the outcomes of interventions (e.g., policy changes, experimental manipulations), a model must capture relevant causal or dependency structures within its domain. Predictive success under intervention provides stronger evidence for the model's structural fidelity than passive prediction alone.
  4.  **Explanation:** Both parties agree models can provide explanations, but differ on the *requirements* (see disagreements). We agree that a minimal requirement is that the model identifies patterns, dependencies, or counterfactual relationships relevant to the phenomenon. Mere predictive success does not automatically constitute a satisfactory explanation for the realist.
  5.  **No-Miracles Reasoning:** The predictive success of a model is unlikely to be a "miracle" or pure coincidence. This success provides evidence that the model captures *some* aspect of the target system's behaviour that is relevant to the prediction. However, this reasoning alone *cannot*:
      *   Specify *which* aspects of the model correspond to real structures.
      *   Guarantee the model's assumptions are harmless or controlled.
      *   Establish that the model provides a uniquely correct or deep explanation.
      *   Justify extending the model's domain without further testing.
  6.  **Assumption Taxonomy:** We accept the distinction between:
      *   **Subtractive Assumptions:** Omitting factors known to be present but small.
      *   **Distortive Assumptions:** Simplifying or misdescribing factors known to be present (e.g., linearizing a non-linear relationship).
      *   **Fictive Assumptions:** Introducing entities or mechanisms absent from the target system (e.g., representative agents, infinite populations, frictionless planes).
  7.  **Degradation Under De-idealization:** For a model to have captured a robust aspect of reality, its performance should generally *degrade* (or at least not *improve*) when a false assumption is relaxed *if* the relaxed factor is actually relevant within the domain. Improvement under relaxation suggests the original assumption was actively harmful.

  **Section 2: Residual Disagreements**

  | Disagreement Area                  | As-If Defender (Instrumentalist) Position                                                                 | De-Idealization Realist Position                                                                                                                               | Verbal/Substantive? |
  | :--------------------------------- | :--------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------ |
  | **Primary Goal of Modeling**       | The paramount goal is reliable prediction and intervention within a domain. Explanation is secondary and derivative from predictive success. | Explanation, understood as revealing veridical (though approximate) causal/dependency structures, is a core and non-derivative goal alongside prediction.      | Substantive         |
  | **Requirement for Explanation**    | A model explains if it reliably predicts, especially novel predictions; unrealistic assumptions can be part of isolating the essential causal factors. | Explanation requires that unrealistic assumptions be understood as distortions/omissions *of known real factors*; fictive elements block genuine explanation. | Substantive         |
  | **Status of Fictive Assumptions**  | Fictive assumptions are often essential heuristic tools for isolating core mechanisms and achieving tractability; their success justifies their use. | Fictive assumptions signal a fundamental gap between model and target; their success demands interpretation (e.g., as placeholders or aggregate effects), not acceptance. | Substantive         |
  | **What Predictive Success Shows**  | Predictive success, especially novel, shows the model captures whatever features of reality *are necessary* for generating those predictions. | Predictive success shows the model captures *some* relevant structure, but does not specify *which* structure or justify ignoring known falsehoods in the assumptions. | Partly Verbal (Different emphasis on sufficiency vs. specificity) |
  | **"Isolating What Does the Work"** | Unrealistic assumptions are often precisely what allow isolation of the dominant causal factors. | Only subtractive/distortive assumptions can isolate factors; fictive assumptions replace the real work with fictional work.                                     | Substantive         |

  **Section 3: Cruxes & Predictions**

  **Crux 1: Scope of the F-Twist: Does the instrumentalist license extend to fictive assumptions?**
  *   **Shared Case:** The coastal fishery metapopulation models.
  *   **Defender Prediction:** The success of the original model (uniform dispersal) shows the fictive assumption effectively isolated the *net effect* of dispersal relevant for predicting collapse timing. Its successor's success confirms this core insight while adding resolution. Fictives are justified tools.
  *   **Realist Prediction:** The original model's success was contingent and domain-limited (folding stocks). Its inability to predict the second collapse reveals the fictive assumption masked crucial real structure (currents). Success doesn't justify the fiction, only motivates finding the real mechanism it approximated. Fictives are always deficient placeholders.
  *   **What Moves Defender:** Widespread examples where relaxing a *fictive* assumption *improves* prediction *within the original domain* without adding new empirical parameters.
  *   **What Moves Realist:** A compelling case where a fictive assumption is demonstrably *essential* for novel prediction *and* no coherent mapping to real structures/aggregates can be provided, yet prediction holds robustly across domains/interventions.

  **Crux 2: Does success under intervention support stronger conclusions about assumptions than passive observation?**
  *   **Shared Case:** The fishery models' predictive success was based on passive observation data. Imagine an *intervention* forecast: predicting collapse timing *if* a specific marine protected area (MPA) were established in year 2.
  *   **Defender Prediction:** If both models successfully predict the *changed* collapse timing following the MPA intervention, this strongly supports the core causal structure captured by *both* models (including the original's fictive dispersal), demonstrating their adequacy for intervention planning.
  *   **Realist Prediction:** Successful intervention prediction by the high-resolution model (with realistic currents) provides much stronger evidence for understanding the *actual causal pathways* affected by the MPA. The original model's success might be coincidental or rely on lucky correlations; its fictive assumption makes its reliability under novel interventions less trustworthy.
  *   **What Moves Defender:** Cases where models with known false/fictive assumptions reliably predict *novel intervention effects* vastly better than models striving for realistic assumptions.
  *   **What Moves Realist:** Cases where models pass passive tests but fail dramatically under intervention, specifically traceable to known false/fictive assumptions.

  **Crux 3: What would a systematic de-idealization audit reveal?**
  *   **Protocol:** Take 100 high-impact models. For each, relax one false assumption (classed S/D/F) at a time. Measure performance (accuracy, scope) against the original domain and potentially extended domains. Record: Degrades, Improves, Survives (unchanged), Survives+ (extends scope).
  *   **Defender Prediction:** Performance will often *survive* relaxation of subtractive/distortive assumptions within the original domain, supporting their harmlessness. Relaxing fictives will often cause degradation *or* survival, showing they were either useful heuristics or harmless. Significant *improvement* will be rare, supporting the idea assumptions often isolate core factors.
  *   **Realist Prediction:** Relaxing subtractive assumptions will often show minor degradation or survival. Relaxing distortive assumptions will frequently show *improvement* (indicating the distortion mattered). Relaxing fictive assumptions will often cause significant degradation *or* reveal the need for substantial revision (improvement only after major reworking), showing their inadequacy. Widespread improvement supports the need for de-idealization.
  *   **What Moves Defender:** Audit results showing >70% "Survive" or "Survive+" for fictive assumption relaxation within the original domain.
  *   **What Moves Realist:** Audit results showing >50% "Improve" for distortive relaxation *or* >50% "Degrade" for fictive relaxation within the original domain.
