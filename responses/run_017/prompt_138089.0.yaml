answer: |-
  Below is a procedural decision instrument for determining whether the current subject in a graded neural replacement series should be treated as the enrolling patient for consent, directives, and legal purposes. It is designed for use by nursing coordinators with no philosophical training, with explicit criteria, escalation points, and handling of edge cases. The procedure prioritizes clarity, efficiency (≤30 minutes), and defensibility over philosophical resolution. Assumptions are documented, and judgment points are flagged.

  ---

  ### **Neural Replacement Continuity Assessment Protocol**  
  **Purpose**: Determine if current subject = enrolling patient for consent, directives, surrogacy, and legal status.  
  **Time Limit**: 20 minutes (allows 10 minutes for escalation documentation).  
  **Materials Needed**: Patient chart, enrollment records, continuity interview logs, current directives.  
  **Output**: "Continue as enrolling patient," "Not enrolling patient (escalate to ethics)," or "Escalate to ethics for judgment."  

  #### **Step 1: Singularity Check**  
  **Question**: Is there only one active subject claiming to be the enrolling patient?  
  - **Criteria**:  
    - "One subject" = single conscious entity in the original body.  
    - "Claiming" = subject verbally identifies as the enrollee or is the sole candidate.  
  - **Failures (escalate immediately)**:  
    - Multiple claimants (e.g., reversion case with restored tissue).  
    - Split-stream disagreement (e.g., hemispheric subjects with conflicting claims).  
    - Backup restoration after death (branching case).  
  - **Pass**: Proceed to Step 2.  
  - **Judgment Call**: None. Fact-based (e.g., biometrics, claimant count).  

  #### **Step 2: Biological Continuity**  
  **Question**: Is ≥1% of the original biological cortex intact and functionally integrated?  
  - **Criteria**:  
    - "Intact" = tissue not destroyed or reimplanted elsewhere.  
    - "Functionally integrated" = surgeon’s notes confirm neural linkage.  
  - **Failures**:  
    - Original cortex fully replaced (escalate as "Not enrolling patient").  
    - Viable original tissue exists but is not integrated (e.g., reverted tissue in storage).  
  - **Pass**: Proceed to Step 3.  
  - **Judgment Call**: None. Verifiable from surgical logs.  
  - **Note**: Whole-brain destructive replacement fails here; graded replacement may pass.  

  #### **Step 3: Baseline Psychological Continuity**  
  **Question**: Does the subject recall enrollment-specific memories?  
  - **Criteria**:  
    - Subject must accurately describe ≥2 verifiable enrollment details (e.g., consent form content, clinician’s name, pre-op instructions).  
    - Errors due to normal forgetting (e.g., dates) do not fail.  
  - **Failures**:  
    - Inability to recall details after two prompts (escalate as "Not enrolling patient").  
    - Subject denies being the enrollee.  
  - **Pass**: Proceed to Step 4.  
  - **Judgment Call**: Minimal. Nurse uses scripted questions from chart.  

  #### **Step 4: Dynamic Psychological Continuity**  
  **Question**: Has memory, temperament, and behavior remained consistent between sessions?  
  - **Criteria**:  
    - "Consistent" = no unexplained deviations from pre-replacement baselines (e.g., aggression, apathy, new phobias).  
    - Use continuity interview scores: ≥8/10 on cognition, emotion, recognition subtests.  
  - **Failures**:  
    - Score ≤7/10 (escalate to ethics for judgment).  
    - Nurse observes radical, persistent changes (e.g., rejects family, abandons life projects).  
  - **Pass**: Proceed to Step 5.  
  - **Judgment Call**: Yes. Scores are thresholds, but nurses are trained to flag "red-flag" changes.  

  #### **Step 5: Reported Phenomenal Continuity**  
  **Question**: Does the subject report uninterrupted self-identity since enrollment?  
  - **Criteria**:  
    - "Uninterrupted" = no spontaneous mentions of disconnection, replacement, or "new self."  
    - Use phenomenal-continuity interview: Score ≥4/5 on "sense of self" items.  
  - **Failures**:  
    - Score ≤3/5 (escalate as "Not enrolling patient").  
    - Any unprompted report of discontinuity (e.g., "Someone else finishes my sentences"—fade case).  
  - **Pass**: Proceed to Step 6.  
  - **Judgment Call**: Minimal. Uses structured interview with binary scoring.  

  #### **Step 6: Consent Continuity**  
  **Question**: Does the subject affirm the original treatment consent?  
  - **Criteria**:  
    - Subject states: "I am the person who enrolled and I stand by my decision."  
    - No reservations about continuing treatment.  
  - **Failures**:  
    - Subject revokes consent or disavows the enrollee’s choices (escalate to ethics for judgment).  
    - Subject requests changes to directives (triggers Step 7).  
  - **Pass**: **Treat as enrolling patient**.  
  - **Judgment Call**: None. Direct question.  

  #### **Step 7: Directive Amendment Check**  
  **Question**: Is the subject revoking/changing directives due to replacement-specific effects?  
  - **Criteria**:  
    - "Replacement-specific" = subject cites module changes (e.g., speed) or "not the same self."  
    - Non-specific reasons (e.g., "I changed my mind") do not fail.  
  - **Failures**:  
    - Changes linked to procedure (escalate to ethics for judgment).  
  - **Pass**: **Allow changes and treat as enrolling patient**.  
  - **Judgment Call**: Yes. Nurse must discern if reasons are procedure-related.  

  ---

  ### **Key Design Notes**  
  1. **Theory Grounding**:  
     - Steps 1–2 reflect *biological-organism view* (fails reversion/branching cases).  
     - Steps 3–4 reflect *psychological-continuity view* (fails fade/branching cases).  
     - Step 5 reflects *phenomenal-continuity data* (fails substitution/fade cases).  
     - Step 7 reflects "no further fact" pragmatism (allocates rights based on continuity strength).  
  2. **Handles Specified Cases**:  
     - **Reversion**: Fails Step 1 (multiple claimants).  
     - **Branching**: Fails Step 1 (backup ≠ original claimant).  
     - **Split-Stream**: Fails Step 1 (multiple claimants).  
     - **Pause**: Step 4 may fail if memory lapses; else proceeds.  
     - **Substitution**: Step 5 may fail if subject reports discontinuity.  
     - **Fade**: Step 5 fails (low phenomenal score).  
  3. **Whole-Brain vs. Graded**:  
     - Whole-brain replacement fails Step 2 (0% biological cortex). Graded may pass if ≥1% intact.  

  ---

  ### **Application to Cases**  
  **Case 1: 70% Revocation**  
  - Step 1: Pass (one subject).  
  - Step 2: Pass (≥1% biological cortex intact).  
  - Step 3: Pass (recalls enrollment details).  
  - Step 4: Pass (consistent behavior/memory).  
  - Step 5: Pass (no discontinuity reports).  
  - Step 6: Fail (revokes advance directive).  
  - Step 7: Triggered → Subject states: "The module changes made me reject my old self’s wishes."  
    - **Result**: Escalate to ethics for judgment.  
  - **Committee Impact**: **Requires re-consent mid-course and pauses new enrollments** if ethics upholds. This will damage the program. No softening: the procedure forces escalation.  

  **Case 2: Reversion Case (Biological Subject Contests Will)**  
  - Step 1: Two claimants (synthetic subject in body + restored biological tissue) → **Fail**.  
  - **Result**: Escalate immediately to ethics/legal. No further steps.  

  **Case 3: Split-Stream Case (Streams Disagree)**  
  - Step 1: Two claimants (both hemispheres claim identity) → **Fail**.  
  - **Result**: Escalate immediately to ethics/legal.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Settle Survival**: It **cannot** determine if the enrolling patient "survives." It allocates rights based on measurable continuities (biological, psychological, phenomenal) but treats identity as a legal construct, not a metaphysical fact.  
  2. **Ambiguity**: Fails in edge cases (e.g., fade with ambiguous scores) and defaults to escalation.  
  3. **Values-Only Conflicts**: If all steps pass but ethics disagrees (e.g., revocation undermines program), the procedure forces human judgment.  
  4. **Explain Itself**: Nurses need not understand underlying theories, but it cannot "philosophically justify" outcomes to families.  

  **How to Explain to Families**:  
  > *"This procedure checks whether the person here now matches the one who started treatment, based on medical facts, memory, and their own reports. It tells us if we should honor the original plans they made. But it* cannot *answer whether the ‘soul’ or ‘deep self’ survived—that’s beyond science. We use this tool to be fair and consistent, not because we know the ultimate truth about identity."*  

