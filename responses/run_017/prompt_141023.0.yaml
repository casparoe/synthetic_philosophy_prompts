  | (h) | Settled math | Finite additivity is standard for finite partitions. |
  | (i) | Philosophical | **For audit design, exploitability is operationalized as the test**. |

  ### Final Assessment
  - **P as stated is false** due to (c): Assignments with Σc_i < 1 violate finite additivity but **cannot be flagged** by any permissible menu.  
