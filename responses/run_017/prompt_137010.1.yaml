answer: |-
  **Can contractualism’s foundational asymmetry between intra-personal aggregation (permitted) and inter-personal aggregation (largely prohibited) withstand critical scrutiny when the very boundaries of the 'person'—the unit whose complaints are summed or kept separate—are varied across structurally identical distributions of burdens, and what does this 'slicing problem' reveal about the theory's core commitments regarding moral subjects and justification?** This project investigates a pivotal yet under-examined assumption within T.M. Scanlon’s contractualism, arguing that resolving the long-standing debate about aggregation requires first confronting whether the theory can coherently define the subject for whom complaints are aggregated, a question with profound implications for contractualism’s ability to deliver determinate moral judgments and its foundational individualism.

  Contractualism holds that an act is wrong if it would be forbidden by principles no one could reasonably reject, where reasonable rejectability hinges on comparing the burdens individuals would bear under alternative principles. The central "problem of aggregation" arises when contractualism seemingly forbids aggregating many small burdens borne by different people to outweigh one severe burden borne by a single individual, a stance often presented as a defining feature contrasting it with utilitarianism. However, this framing presupposes a settled answer to a prior question: *what constitutes the individual subject* across whose experiences aggregation is intrinsically permitted? Contractualism unquestionably allows (indeed, requires) summing diverse burdens *within a single life* to assess an individual's overall complaint against a principle. One must aggregate the costs a principle imposes on a person over time and across their various interests to determine the magnitude of their objection. Yet, it largely prohibits summing burdens *across distinct persons*. This intra-/inter-personal asymmetry is fundamental but underexplored. The core problem is that we can often redescribe a given set of burdens as either intra- or inter-personal simply by altering how we delineate the subjects bearing them—the "slicing problem." This project contends that existing contractualist responses to aggregation (e.g., arguments focusing on the separateness of persons, the "complaint model," or the nature of personal reasons) largely take the individuation of subjects for granted, failing to address whether the asymmetry itself can be justified independently of how we happen to "slice" the world into persons.

  The primary method will be constructing and analyzing carefully matched pairs of cases where the *qualitative types and magnitudes* of burdens remain constant, but the *distribution of these burdens across subjects* is varied systematically. This isolates the slicing variable. Key comparisons will include:
  1.  **One Subject vs. Many Subjects (Identical Burdens):** Compare a case where one individual suffers numerous small burdens (e.g., 100 minor headaches) under Principle A, while another suffers one moderate burden (e.g., one severe migraine) under Principle B, to a case where the same 100 minor headaches are distributed one each across 100 individuals (suffering under Principle A), and one individual suffers the severe migraine (under Principle B). Are the aggregate complaints against A vs. B identical across cases, differing only in subject-boundaries?
  2.  **Temporal vs. Collective Subjects:** Compare a case where many distinct people each suffer a small burden to a case where a single, extremely long-lived individual suffers all those same small burdens sequentially over time. Does the permissibility of intra-personal aggregation over time make the latter case aggregate differently?
  3.  **Group Agents as Subjects:** Consider a case where many small burdens fall on individual employees versus a case where those same burdens (e.g., minor financial costs) are borne collectively by their firm as a single corporate entity. Can the firm’s aggregated complaint (intra-corporate) outweigh an individual’s significant burden in a way that the sum of individual employee complaints cannot (inter-personal)?
  4.  **Varied Burden Strengths:** Crucially, construct cases where the "small" burdens offered in aggregation differ slightly in severity from each other (e.g., headaches ranging from very mild to moderately painful), preventing any simple solution based on thresholds or tie-breaking claims that all small burdens are identically negligible. This forces the analysis to confront genuine, non-identical burdens requiring summation.

  This case-based method is superior to purely conceptual analysis or broad surveys of the literature because it directly tests the *practical implications* of the asymmetry under varying descriptions of subjecthood. It provides concrete pressure points to evaluate whether proposed contractualist justifications for the asymmetry (e.g., the significance of distinct rational points of view, the nature of personal sacrifice) genuinely depend on the metaphysics of persons or merely on contingent features of how burdens are *administratively* distributed. Alternatives like historical analysis or purely theoretical critique would be less effective at isolating this specific structural vulnerability.

  Possible conclusions fall along a spectrum:
  1.  **The Asymmetry is Robust:** Contractualism possesses resources (e.g., a specific account of agential unity or the unique nature of interpersonal justification) to defend the moral significance of standard person-boundaries, rendering the slicing problem merely apparent. The matched cases would reveal a morally relevant difference despite structural similarity.
  2.  **The Asymmetry is Indefensible:** The slicing problem exposes a fundamental arbitrariness. If aggregation is permitted within a subject, and subjects can be variably defined (temporally extended, collectively constituted), then contractualism either collapses into permitting widespread inter-personal aggregation or loses determinate guidance.
  3.  **Contractualism Requires Refinement:** The theory needs an explicit, defensible criterion for what constitutes a distinct subject for the purposes of complaint aggregation (e.g., based on unified agency, psychological connectedness, or something else) to salvage the asymmetry. This might restrict aggregation in novel ways or permit it in unexpected contexts.
  4.  **The Problem Undermines the Complaint Model:** The slicing problem reveals a deeper issue with the core contractualist machinery of comparing individual complaints, suggesting it cannot handle the metaphysics of subjects consistently.

  Deciding among these will depend on rigorously testing proposed contractualist defenses against the slicing scenarios. Can any justification for rejecting a principle in the one-subject/many-burdens case avoid permitting rejection in the many-subjects/one-burden-each case (and vice versa), given identical burdens? Does the appeal to distinct rational points of view hold when subjects are long-lived individuals or group agents? Does the concept of "reasonable rejection" lose coherence if subject-boundaries are fluid?

  The primary deliverable will be a substantive 6,000-7,000 word philosophical paper presenting the slicing problem, analyzing the matched cases, evaluating contractualist responses, and arguing for one of the conclusions above. This will be supplemented by a concise, non-technical one-page summary for broader dissemination and a clear table summarizing the permissibility of aggregation under different conceptions of the subject (e.g., standard individuals, temporally extended selves, group agents) based on the analysis.

  Key risks and scope limitations must be acknowledged:
  *   **Failure Condition 1:** The project fails if it cannot compellingly demonstrate that the slicing problem poses a *novel* and *significant* challenge beyond the standard aggregation debate. Simply restating known problems would be inadequate.
  *   **Failure Condition 2:** It fails if the case comparisons are deemed invalid due to unaccounted-for morally relevant differences between the scenarios besides subject-boundaries.
  *   **Feasibility Risk:** The conceptual density of Scanlonian contractualism and the metaphysics of personal identity/group agency is substantial. A significant risk is underestimating the complexity of engaging deeply with both areas within the semester constraint (approx. 120 hours total).
  *   **Scope Risk:** Fully resolving the metaphysics of personhood or developing a complete positive account of the subject for contractualism is beyond scope. The focus must remain on *testing* the vulnerability of the existing asymmetry to slicing variations.
  *   **Risk of Ambiguity:** Ensuring the matched cases are genuinely structurally identical except for subject-distribution requires careful construction to avoid confounding variables. This demands precise philosophical analysis.

  This project focuses tightly on exposing and rigorously probing a specific, foundational assumption within contractualist ethics. Success means demonstrating whether contractualism’s core asymmetry can withstand scrutiny when the units of moral concern are not taken for granted, thereby clarifying the theory’s commitments and potentially identifying a crucial avenue for its development or critique. While ambitious, the targeted methodology and clear focus make it a viable and intellectually significant pursuit for the grant period.
