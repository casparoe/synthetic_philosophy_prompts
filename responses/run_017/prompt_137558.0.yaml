answer: |-
  The phenomenon you're describing has no established single term in historiography or counterfactual theory—but it **is** a recognized methodological tension. After dissecting your account, I conclude this is primarily **narrative elasticity**: *the tendency of counterfactual narratives to revert toward known historical trajectories over time, driven either by claimed structural constraints or by unacknowledged cognitive defaults*.  

  ### Core Definition & Boundaries
  - **Narrative Elasticity**:  
    The implicit "snap-back" force in historical counterfactuals, where deviations from actual events are gradually reabsorbed. This operates independently of the *size* of the initial departure (plausibility).  
    - *Mechanism*: When justified by structural factors (e.g., "gunpowder warfare necessitates centralized taxation").  
    - *Exhaustion*: When arising from the storyteller’s inability to generate novel outcomes, defaulting to known history.  

  **Boundary Cases**:  
  - Clear Instance: Your friend’s Armada scenario. A dramatic invasion (large departure) is "absorbed" within decades, restoring Protestantism, Atlantic trade, and parliamentary tensions.  
  - Clear Non-Instance: Your reinsurance models. Branches diverge irreversibly (e.g., a pandemic altering global migration permanently).  

  ### Mechanism vs. Exhaustion: One Phenomenon, Two Causes
  They are **two distinct drivers** masked by identical narrative outcomes.  
  - **Test to Separate Them**:  
    Ask the counterfactualist to *reconstruct the path* from divergence to convergence:  
    - If they articulate *causal mechanisms* (e.g., "Catholic Spain would still face Dutch revolts, forcing fiscal compromises"), it’s **structural constraint**.  
    - If they gesture vaguely ("Things just normalize") or reuse *specific events* (e.g., "the 1640s still produce a civil war"), it’s **exhaustion**.  
    Your friend’s "equilibrium" claim is structural; his abrupt return to "awkward parliaments" without linkage is exhaustion.  

  ### The Personal Counterfactual: Same Phenomenon
  Your Lyon job example is narrative elasticity in microcosm:  
  - It imposes *fictional inevitability* on life choices ("something similar would have happened"), just as history imposes *fictional inevitability* on events.  
  - The driver here is usually psychological (coping with regret/chance) rather than historical—but the *narrative mechanism* is identical: **convergence through cognitive convenience**.  

  ### Why Existing Terms Fail
  - **Inevitability/Determinism**: Describe the *world’s* fixedness, not the *story’s* bendiness.  
  - **Chaos Theory**: Addresses sensitivity to initial conditions (divergence), not forced reconvergence.  
  - **Path Dependence**: Focuses on irreversible tipping points—the *opposite* of elasticity.  

  ### Carving the Conceptual Space
  | **Concept**          | Governs...          | Your Concern          |  
  |----------------------|---------------------|-----------------------|  
  | Plausibility         | Initial departure   | Size of "what if?"    |  
  | **Narrative Elasticity** | Post-departure reconvergence | Speed & depth of snap-back |  
  | Structural Constraint | Why reconvergence *might* occur | Historical causality |  
  | Cognitive Exhaustion | Why reconvergence *defaults* | Methodological flaw |  

  ### My Commitments
  1. **No established term exists** for this specific duality of elastic storytelling. (Source: Survey of counterfactual historiography [Ferguson, *Virtual History*], narrative theory [White], causal inference [Tetrault]).  
  2. **"Narrative elasticity" is my proposed term**—*not* established usage. It tightens your "snap-back" metaphor into a defined concept.  
  3. **Mechanism and exhaustion are distinct** but produce identical narrative effects. The test above separates them.  
  4. **Personal/historical cases share the narrative structure** but differ in motivation: one is epistemic (history), the other existential (agency).  

  ### Why This Carving Matters
  You’ve identified a flaw in how historians (and humans) manage uncertainty: we default to known outcomes when imagination fails, disguising it as historical necessity. Naming "narrative elasticity" forces transparency: *Is this reconvergence argued or assumed?* That’s the pivot point between rigorous thought and disguised fatalism. Your friend’s "plausibility" covers the launch; elasticity exposes the landing. 

  **Final Boundary**: If a counterfactual *maintains* divergence by tracing new institutional logics (e.g., a Habsburg England forging permanent Catholic alliances with Austria), elasticity is low. If it lapses into Anglo-Dutch wars and merchant elites by 1650, elasticity is high—and demands justification.
