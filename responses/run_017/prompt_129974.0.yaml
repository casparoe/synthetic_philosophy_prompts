  ## Coffee Shop Clash: Progress vs. Patterns

  **(Ana and Ravi sit at a small table, coffee cups half-empty. The hypothetical study printout lies between them.)**

  **Ana:** Okay, Ravi. Let’s cut to the chase with this study. Point (i) screams realism to me. Impartial fairness – obligations to strangers, limits on kin favoritism – accelerates *everywhere* with market integration. People *feel* it as moral progress. That’s not just changing tastes; that’s uncovering a functional necessity, a *fact* about coordinating large-scale, anonymous societies. Societies that ignore it flounder. It’s tracking a truth: impersonal cooperation scales better.

  **Ravi:** I grant the pattern, Ana. It’s robust. But "tracking a truth"? More like tracking a *constraint*. Market integration creates a new selective environment. Groups whose norms don’t adapt to handle anonymous exchange – norms demanding impartiality, enforcing contracts with strangers – get outcompeted economically and demographically. It’s cultural evolution hitting a local optimum, hard. The "progress" feeling? That’s the narrative glue binding the new norm package. It *feels* like discovery because successful norm-adoption *requires* internalizing it as correct, not arbitrary. It’s phenomenologically necessary for stability.

  **Ana:** Necessary for stability *because* it’s correct! You’re describing the mechanism by which societies *find* the moral fact. The constraint *is* the fact! If it were merely arbitrary cultural tinkering, why the universality and speed of the shift *only* in this domain? Why not in the purity stuff? Why does everyone converge on roughly the same fairness principle under the same pressure?

  **Ravi:** Because the functional pressure is incredibly strong and specific! It’s solving a clear, new coordination problem: "How do I trust and cooperate with people I’ll never see again?" The solutions are constrained by game theory, not metaphysics. Tit-for-tat-ish reciprocity scales. Nepotism doesn’t. That’s why it converges. Now look at point (ii): harmless acts – food taboos, specific purity violations, intricate etiquette. No functional pressure from markets. No coordination problem demanding a *single* solution. So cultural evolution tinkers freely. The raw material – disgust, social hierarchy intuitions – gets hooked onto whatever contingencies of history, ecology, or random drift prevail locally. No convergence because there’s no *need* for convergence. No "progress" feeling because there’s no narrative of solving a new, shared problem.

  **Ana:** So you concede domain (i) *looks* truth-tracking, but only because the evolutionary pressure is so intense it mimics it? Fine. But why can’t I say: domain (i) *is* tracking a moral fact about the demands of large-scale cooperation, revealed under this pressure, while domain (ii) involves areas where there genuinely *isn't* a single moral fact, just culturally variable expressions of underlying psychological tendencies? Why must realism be an all-or-nothing package? Physics has universal laws *and* contingent initial conditions.

  **Ravi:** Ah, the quietist move! Okay, Ana, hit me with it. Why *did* you think it was one package? And how do you justify carving out (ii) as mere convention without undermining the intuition-pump for realism in (i)? If my moral intuitions about purity feel just as compellingly "real" to me in my culture as fairness feels to you, but you dismiss mine as non-moral convention, what grounds that asymmetry besides your preferred ontology?

  **Ana:** Fair challenge. Historically, yes, many realists assumed a unified moral fabric. This study forces refinement. The asymmetry? Grounding. Fairness norms in (i) demonstrably solve a universal human problem – scaling cooperation – and converge under conditions demanding that solution. They exhibit inter-subjective justifiability across vastly different starting points when the functional context aligns. The purity norms in (ii)? They don’t solve a universal problem in a convergent way. They regulate in-group cohesion or manage anxiety, but the *specifics* – don’t eat this, wear that, touch this person – lack cross-cultural justifiability or functional necessity. They feel real *locally* because they’re deeply embedded in social identity, not because they track an external truth accessible to all rational agents.

  **Ravi:** Interesting. So your realism in (i) rests on convergence under functional pressure plus universal justifiability in context? Okay. But my critique remains: the "universal justifiability" emerges *because* of the functional pressure forcing convergence on similar solutions. It’s convergent evolution, not convergent perception of Platonic forms. My positive story for (ii)? We’re negotiating in-group boundaries and identity markers using deeply felt but culturally shaped affective responses. It *feels* like discovery because successfully internalizing the local norm *is* discovering your place within that moral community. It’s discovery of social location, not moral ontology. The feeling is real; the object is social.

  **Ana:** And for (i)?

  **Ravi:** For (i), the feeling of discovery is the internalization of a highly successful, culturally-evolved solution to a massive coordination problem. The "target" is evolutionary fitness within a specific niche (large-scale markets), not a freestanding moral fact. The convergence isn't a coincidence; it's predictable based on the environmental pressures. Different niche, different norms.

  **Ana:** Predictable convergence *is* what we expect from discovering objective functional requirements! Your story just redescribes the discovery process in evolutionary terms without adding anything *beyond* it that explains why *this* solution feels uniquely compelling and justifiable. Why not converge on some other stable but less cooperative norm package?

  **Ravi:** Because less cooperative packages *are* less stable and get outcompeted! The feeling of unique compulsion comes from the norm being deeply ingrained as the *right* way within the successful cultural framework. It’s compelling *because* it works so well for the niche. Okay, mind-changing observation time. For me? Show me a core "fairness" principle that emerges *dominant* under market pressures but demonstrably leads to *worse* large-scale cooperation outcomes than available alternatives. That would shake my functionalist story. For you?

  **Ana:** Hmm. Tough. Finding genuine moral error within a functional niche is hard. Maybe… evidence that the *specific* impartiality norms converging (say, strict equality vs. proportionality) *don't* actually track functional efficiency better than divergent alternatives that *don't* converge? Or… show me that in domain (ii), a specific purity norm *does* demonstrably solve a universal human problem in a uniquely optimal way across cultures, yet fails to converge despite identical pressures. That might force me toward quietism there *or* realism everywhere. But… honestly? Both feel unlikely given the stipulations. My realism is resilient, but this study forces domain-specific ontology. What about you? Can you name one for your view on (i)?

  **Ravi:** (Sips coffee, pauses) Honestly? Within the constraints of this hypothetical? If the convergence in (i) happened *instantly* upon exposure to markets, with zero cultural transmission lag or resistance, feeling like a blinding revelation… that *might* nudge me towards something perceptual. But gradual shift via socialization and narrative-building fits my model fine. So… probably not. The functional story is pretty robust here. Doesn't make it *true* in your sense, Ana.

  **Ana:** And your story doesn't explain why it *feels* like truth-discovery, not just habit formation. The phenomenology gap remains, Ravi.

  **Ravi:** And your realism struggles with the arbitrariness of (ii). The gap remains, Ana. More coffee?

  **Ana:** Always. But this isn't settled.

  **Ravi:** Never is.
