prompt: |-
  You are a professional moral philosopher who also designs classroom simulations for pre-college students, and you are very good at building activities where the mechanism itself carries the argument. Please think carefully before you write: first brainstorm two or three candidate mechanics for the activity I describe below, say in a sentence or two why each would or wouldn't work, and only then commit to one and give me the full specification. I would rather have one well-tuned game than three sketches.

  The setting: I run an after-school ethics club at my high school — usually about fourteen students, grades 10 through 12, one 70-minute session, a classroom with a whiteboard, index cards, two colors of poker chips, a shoe box for secret ballots, and a phone timer. No budget, no prizes, and I would rather nobody have to handle real money. We have already done one session on trolley cases and one on the simple "maximize total happiness" idea, so everyone can say something like "add up the happiness and pick the biggest total" — but please don't assume they know any technical vocabulary, and please don't rely on our having read anything. One student is a convinced, articulate consequentialist who will happily defend aggregation; two or three others are instinctively suspicious of it but can't say why. Last session that one student named the move the group was making about ten minutes in and the discussion collapsed into him explaining himself, so I want rules that make that harder.

  Here is the idea I want them to run into, without hearing its name until the very end: the thought that a lot of small harms happening to many different people can be totaled up and outweighed by one large benefit to someone else, and that this feels importantly different from the very same arithmetic when it all happens inside a single person's life. I want my club to feel the pull of refusing to add across people, and to feel it as a problem for the maximizing view rather than as a quirky intuition, and I'd like them to generate something close to the objection in their own words before I supply the phrase (a teacher told me the phrase is associated with Rawls — I don't need the citation, and please don't give me a reading list or any sources at all; I just want the activity).

  Some mechanics I've been playing with, which you should freely discard or recombine: presenting the identical decision twice, once as a *serial* version (all the costs and benefits landing on one person over time) and once as a *distributed* version (spread across many people at once), with nobody told that the two are numerically the same; a role — call it the accountant — who receives only totals, never names, and reports a verdict before the group finds out who was affected; a transfer rule where a harm-chip can move from one person to another only with that person's own signature at the moment of the harm, so that neither an advance promise nor a later apology counts; and a "proxy" card letting one player volunteer to absorb another player's pain one-for-one. Pick whichever arrangement best produces the collision, and tune the numbers carefully (how many people, how large each harm, how large the offsetting benefit) so the aggregation verdict is stable and the intuition isn't just swamped by pity for an identifiable victim, or by the fact that the chips feel like play money.

  What I need from you: the rules and materials; how to assign roles without anyone guessing the point; a minute-by-minute timeline including a silent secret-ballot round; the exact wording for the recording sheet each student fills in; and then a debrief that maps specific moments in the session onto parts of the idea, ordered so that the group's own words come first and my terminology comes last. Tell me honestly what will go wrong the first time I run it — herding, the vocal consequentialist spoiling it, someone refusing to play, students treating chips as currency, the arithmetic being wrong — and what to do in each case. Tell me what to cut if we're running fifteen minutes short. And be explicit about which feature of the idea the activity cannot reproduce: I suspect the game can make aggregation feel wrong but can't show that its feeling wrong is a moral fact rather than a psychological one, and I don't know how to handle the "but everyone might have agreed to the rule in advance" reply, so please say plainly which parts the facilitator simply has to say out loud. Finish with one sentence stating what a student should be able to say, in their own words, on the way out the door.
