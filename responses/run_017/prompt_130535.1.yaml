  We are designing a classroom simulation to help students experience the intuition against aggregating harms and benefits across different people, especially when small harms to many are outweighed by a large benefit to one. The key is to have them feel the pull of refusing to add across persons, and to see it as a problem for the maximizing view. We want to avoid the vocal consequentialist dominating and to have the group generate the objection in their own words.

   Constraints:
   - No technical vocabulary until the end.
   - Materials: whiteboard, index cards, two colors of poker chips (say, red for harm, blue for benefit), shoe box for secret ballots, phone timer.
   - 14 students, 70 minutes.
   - Already familiar with trolley problems and the idea of maximizing total happiness.

   Mechanics to consider:
   1. Serial vs. Distributed Scenarios:
      - Present the same numerical situation twice: once as a single person experiencing a series of small harms and then a big benefit (serial), and once as many people each experiencing a small harm and one person getting a big benefit (distributed). Then compare reactions.
      - Why it might work: It directly contrasts the two cases and highlights the difference in intuition.
      - Why it might not: Students might not make the connection between the two scenarios, or the vocal consequentialist might immediately point out the numerical equality and argue for consistency.

   2. The Accountant Role:
      - One student is the "accountant" who only sees totals (e.g., total harms and total benefits) and must decide based solely on the numbers. The rest of the students are "affected individuals" who receive harm or benefit chips. The group then reacts to the accountant's decision when they see who was affected.
      - Why it might work: It separates the aggregator from the personal stories, making the aggregation explicit and then allowing the emotional reaction when identities are revealed.
      - Why it might not: The accountant might feel pressured or might not take the role seriously, and the separation might feel artificial.

   3. Transfer Rule with Signature:
      - A rule that harm can only be transferred from one person to another with the harmed person's signature at the moment of harm. This prevents ex-ante consent or ex-post compensation.
      - Why it might work: It forces the issue of whether harms can be compensated across persons without their immediate consent.
      - Why it might not: It might become too procedural and distract from the core issue.

   4. Proxy Card:
      - A card that allows a player to volunteer to take on another's harm one-for-one. This might highlight the voluntariness of taking on harm for others.
      - Why it might work: It could show that without consent, the transfer feels illegitimate.
      - Why it might not: It might not directly address aggregation across persons.

   After considering, I choose a combination that uses the **Serial vs. Distributed Scenarios** (to directly contrast) and the **Accountant Role** (to make aggregation explicit) but with a twist to prevent the vocal consequentialist from dominating. We will run two scenarios in sequence, with the accountant role in the distributed scenario. The serial scenario will be presented first without an accountant, and the distributed scenario will have an accountant who only sees totals. The key is that the students don't know the two scenarios are numerically identical until the end.

