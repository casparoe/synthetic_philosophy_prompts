answer: |-
  ### Final Activity Specification: "The Burden Shift"

  **Core Mechanic**: A two-phase simulation using identical net utility calculations (+3) in two contexts: first *intrapersonal* (one person's life), then *interpersonal* (across multiple people). Students experience aggregation as intuitive in Phase 1 but jarring in Phase 2, forcing confrontation with the "adding across persons" problem. Secret ballots prevent vocal students from dominating early.

  **Why this works**:  
  - The **serial/distributed contrast** makes the moral difference visceral without stating it.  
  - The **accountant role** abstracts aggregation, highlighting its indifference to personal stories.  
  - **Physical chips** make burdens tangible but avoid currency dynamics by prohibiting trading.  

  **Materials** (for 14 students):  
  - 27 red poker chips (harm)  
  - 18 blue poker chips (benefit)  
  - 15 index cards (for role assignments)  
  - 30 blank slips (for ballots)  
  - Shoe box (ballot collection)  
  - Whiteboard (tracking votes)  
  - Timer  

  ---

  ### Phase 1: Serial Scenario (One Life)  
  *(20 minutes total)*  

  **Setup**:  
  - Randomly select **1 Volunteer** (draw names from hat).  
  - Assign remaining 13 as **Observers**.  

  **Procedure**:  
  1. **Facilitator explains**: *"Our Volunteer will experience 12 small harms over time, then 15 benefits. Each red chip = 1 harm (e.g., a stubbed toe). Each blue chip = 1 benefit (e.g., a favorite snack)."*  
  2. **Simulate harms**: Hand Volunteer 1 red chip every 30 seconds (6 minutes total). *"After each harm, say aloud how your total discomfort feels."*  
  3. **Simulate benefits**: Hand Volunteer 15 blue chips at once. *"Say how getting all benefits together feels."*  
  4. **Secret ballot**: Observers and Volunteer write "Acceptable" or "Unacceptable" on slips. Collect in box.  

  **Expected reaction**: Most see this as fair—net +3 gain after temporary hardship.  

  ---

  ### Phase 2: Distributed Scenario (Many Lives)  
  *(25 minutes total)*  

  **Setup**:  
  - Randomly select **1 Accountant** (different from Volunteer).  
  - Assign remaining 13 as **Citizens**.  

  **Procedure**:  
  1. **Isolate Accountant**: Send them outside with a timer (5 min). *"You’ll review totals only—no names."*  
  2. **Assign roles to Citizens**: Shuffle 12 "HARM" cards and 1 "BENEFIT (15)" card. Distribute secretly.  
  3. **Distribute chips**:  
     - 12 Harmed Citizens: 1 red chip each.  
     - 1 Benefited Citizen: 15 blue chips.  
  4. **Accountant’s decision**: Show Accountant a note: *"Total Harms: 12. Total Benefits: 15. Net: +3. Is this acceptable? Write verdict."* They submit privately.  
  5. **Secret ballot**: All Citizens vote "Acceptable" or "Unacceptable" after seeing their own role.  

  **Expected reaction**: Harmed Citizens feel aggrieved ("Why me?"); Benefited Citizen may feel guilty. Accountant likely approves based on net gain.  

  ---

  ### Timeline (70 Min Total)  
  - **0–5 min**: Introduce activity. *"We’re exploring how costs/benefits affect decisions."*  
  - **5–25 min**: Phase 1 (Serial).  
  - **25–50 min**: Phase 2 (Distributed).  
  - **50–60 min**: **Silent reflection**: Students write on index cards:  
    > *"Which scenario felt more unfair? Why?  
    > Did the totals alone capture your feelings?"*  
    *(Collect cards—use quotes in debrief.)*  
  - **60–65 min**: **Small groups (3–4 students)**: Discuss:  
    *"Should we care *who* experiences harm? Why?"*  
  - **65–70 min**: Debrief (see below).  

  ---

  ### Debrief Script  
  *(Map student reactions to the concept)*  
  1. **Start with their words**: Read 3 anonymous reflection-card quotes aloud.  
     - *Likely reactions*:  
       - *"It’s worse when many suffer for one person’s gain."*  
       - *"The totals ignored how it felt to be harmed."*  
     - **Facilitator notes**: *"Many of you felt Phase 2’s distribution was problematic even with net gain."*  

  2. **Contrast phases**:  
     - *"In Phase 1, harms/benefits balanced for one person. In Phase 2, the same math hurt 12 to help one."*  
     - Point to whiteboard: Show identical net +3 calculations.  

  3. **Introduce the problem**:  
     - *"This is the ‘adding across persons’ issue: Should we total small harms to many people like we total one person’s experiences? Your reactions suggest no."*  

  4. **Name the idea**:  
     - *"Philosophers like Rawls call this the ‘separateness of persons’—the intuition that individuals aren’t containers for interchangeable costs/benefits."*  

  5. **Address limitations**:  
     - *"This activity makes aggregation *feel* wrong, but it doesn’t prove it’s immoral—just that our intuitions rebel. And if you’re thinking, ‘But what if everyone agreed in advance?’—that’s a great point! We’d need a separate simulation about consent."*  

  ---

  ### What Could Go Wrong & Fixes  
  - **Vocal consequentialist dominates**: Secret ballots and silent reflection prevent this. If they debate in groups, say: *"Record all views, but prioritize underrepresented ones."*  
  - **Chips as currency**: Prohibit trading: *"Chips represent experiences—you can’t transfer them."*  
  - **Refusal to participate**: Assign objectors as Observers/Accountant. *"You’re crucial for the vote!"*  
  - **Arithmetic confusion**: Clarify: *"12 harms = –12. 15 benefits = +15. Net = +3 in both scenarios."*  
  - **Pity swamps intuition**: Use mild harms (e.g., "slightly cold room"—not "broken leg").  

  **If 15 minutes short**: Skip small groups. Extend reflection/debrief with card quotes.  

  ---

  ### Outcome in Student Words  
  On their way out, a student should be able to say:  
  *"I get why it feels wrong to add up many people’s small harms to justify a big benefit for someone else—even if the math says it’s a net gain."*  

  ### What the Activity Can’t Do  
  1. **Not prove moral truth**: It triggers intuitive resistance but doesn’t show aggregation is *objectively* wrong.  
  2. **Not address consent**: The "they agreed in advance" rebuttal requires a separate exercise.  
  3. **Not replicate Rawls**: This simplifies his "separateness" argument—no original position/veil of ignorance.  

  **Facilitator must say aloud**:  
  - *"Your feelings highlight a challenge for maximization: Should we ignore *who* suffers when we add costs/benefits?"*  
  - *"This doesn’t settle the debate—it shows why it exists."*  

  ---  
  This design forces students to *feel* the interpersonal aggregation problem before naming it. The identical net utility in both phases ensures the moral discomfort stems purely from distribution, not math. Run it cold—their raw reactions will drive the lesson.
