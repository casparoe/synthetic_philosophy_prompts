  Okay, the user is part of a reading group on population ethics, specifically grappling with the separateness of persons objection to utilitarianism. They're stuck on how this philosophical concept manifests in legal practice, particularly contrasting civil litigation with regulatory cost-benefit analysis. They've noticed that tort law treats harms individually while agencies aggregate costs and benefits, and they're deeply confused by this dichotomy. 

  Hmm, their core puzzle is whether law implicitly rejects utilitarian aggregation in some contexts but embraces it in others—and whether doctrines like standing rules or damage calculations presuppose a non-aggregative view of persons. They also mention two brain-breaking ideas: a "ledger defense" for tort defendants and reverse aggregation for scattered harms. 

  First, I need to verify their premises. Is tort law really this non-aggregative? From what I recall: yes, mostly. Standing requires individualized injury, damages are compensatory per plaintiff, and "general welfare" isn't a defense to negligence. But there are nuances—class actions aggregate procedurally, though substantively claims remain individual. Regulatory CBA is indeed hyper-aggregative, using tools like VSL. Pure risk is another sharp contrast: tort struggles with it pre-harm, while regulation quantifies probabilistic harms easily. 

  The user's confusion is sophisticated—they're spotting genuine tension. Their deeper ask seems to be: "Is law inconsistent, or is there a hidden coherence?" They might also want to know if anti-aggregation in tort *requires* philosophical separateness-of-persons, or if pragmatic doctrines suffice. 

  Breaking this down: 
  - **Tort's non-aggregation** likely stems from corrective justice (repairing wrongs to specific individuals) and adversarial process constraints, not metaphysics. Courts aren't equipped to calculate net social welfare. 
  - **Regulation's aggregation** is utilitarian but justified by institutional competence: agencies can handle diffuse impacts legislatures care about. 
  - **Pure risk gap** exists because tort needs concrete plaintiffs, while regulation governs ex ante. 

  The "ledger defense" proposal fails because tort and regulation have different aims—correcting wrongs vs. optimizing policy. Courts rejecting it isn't hypocrisy; it's role differentiation. The reverse idea (bundling tiny harms) would violate standing doctrine's core tenet: actual injury to a plaintiff. 

  Key insight: The law isn't adopting one moral theory wholesale. It's contextually assigning roles—courts for individual justice, agencies for collective welfare. Pragmatism explains this better than philosophy. 

  User's phrasing suggests they'd prefer brutal honesty over neat answers. If their puzzle rests on errors, I should say so—but here, their observations are acute. The tension is real, just not resolvable by choosing sides in the separateness-of-persons debate. 

  Biggest risk: oversimplifying. Must emphasize that tort has aggregative elements (e.g., class actions), and regulation has non-aggregative limits (e.g., equity concerns). Also flag where I'm inferring (e.g., linking corrective justice to non-aggregation) vs. stating black-letter law (e.g., standing requirements). 

  Final thought: Their brain broke on good grounds. This *is* messy. The cleanest answer is that law compartmentalizes—but that's descriptive, not justificatory. They might need that distinction highlighted.
answer: |-
  You've hit upon a genuine and profound tension in legal systems—one that reflects the philosophical dilemma you're studying. Your puzzle isn't fake; it exposes a core inconsistency that courts and scholars grapple with. Below, I'll dissect the practices, their justifications, and what they might presuppose, flagging confidence levels and separating doctrine from inference.

  ---

  ### **1. Your Premises: Mostly Correct (High Confidence)**
  - **Tort Law's Non-Aggregation**:  
    - **Standing**: Each plaintiff must show individualized injury (*Lujan v. Defenders of Wildlife*).  
    - **Damages**: Compensatory damages are calculated per person; "the defendant benefited society" isn't a defense (*Boomer v. Atlantic Cement* noted this, but allowed nuisance to continue with damages).  
    - **No Netting**: A polluter can't offset harm to one group by claiming benefits to others (*Rescue Army v. Mun. Ct.* reinforces this for jurisdictional thresholds).  
    - **Pure Risk**: Tort law struggles with pre-injury risk claims. Mere exposure without manifest injury rarely suffices for standing (*Clapper v. Amnesty International*).  
    - **Confidence**: **High**—this is black-letter law.  

  - **Regulatory Aggregation**:  
    - Agencies use cost-benefit analysis (CBA), aggregating costs (e.g., compliance burdens) and benefits (e.g., lives saved) across populations. The Value of a Statistical Life (VSL) epitomizes this.  
    - Pure risk *is* central here (e.g., EPA regulating carcinogens based on population-level risk).  
    - **Confidence**: **High**—mandated by executive orders (e.g., EO 12866) and upheld in cases like *Michigan v. EPA*.  

  - **The Inconsistency**:  
    The same legal system rejects interpersonal aggregation in torts but embraces it in regulation. This isn't a doctrinal error—it's a deliberate institutional choice.  

  ---

  ### **2. Why Tort Law Rejects Aggregation: Pragmatism Over Metaphysics (Medium Confidence)**  
  The refusal to "net" harms and benefits in torts **does not necessarily presuppose the separateness of persons as a metaphysical claim**. Instead, it relies on:  
  - **Corrective Justice**: Tort law aims to rectify wrongs *between specific parties*. Allowing a "ledger defense" would transform courts into welfare-maximizing regulators, undermining their role (*Weinrib, "The Idea of Private Law"*).  
  - **Deterrence & Administrability**:  
    - Courts lack tools to measure diffuse social benefits (e.g., "cheap goods created jobs").  
    - Permitting offsets could dilute deterrence—polluters might externalize costs onto uncompensated victims.  
  - **Bilateral Structure**: Trials adjudicate disputes between identified parties; they aren't legislative hearings.  
  - **Confidence**: **Medium-High**. While scholars like Coleman link corrective justice to anti-aggregation, the doctrine itself is justified pragmatically in opinions (e.g., *American Electric Power v. Connecticut*).  

  ---

  ### **3. The "Ledger Defense" Proposal: Why It Fails (High Confidence)**  
  A utilitarian *should* support this defense—but courts reject it for reasons unrelated to separateness of persons:  
  - **Jurisdictional Limits**: Courts lack competence/legitimacy to conduct society-wide CBA.  
  - **Information Asymmetry**: Defendants would flood courts with speculative "benefit" evidence.  
  - **Precedent**: Allowing offsets would destabilize tort law's core compensatory function.  
  - **Confidence**: **High**—courts consistently reject such defenses (e.g., *Ortiz v. Fibreboard Corp.*).  

  ---

  ### **4. The Reverse Move: Aggregating Tiny Harms (Low Confidence)**  
  Bundling scattered harms to meet a threshold ("injury without an injured person") **violates standing doctrine**. Key obstacles:  
  - **Concrete Injury Requirement**: *Spokeo v. Robins* requires "particularized" harm.  
  - **Class Actions**: Even here, each class member must show injury (*Wal-Mart v. Dukes*).  
  - **Statutory Workarounds**: Some statutes (e.g., consumer protection laws) allow aggregation for small claims, but still require *some* injury per plaintiff.  
  - **Confidence**: **Medium**—this is constitutionally entrenched. Any change would require overhauling Article III.  

  ---

  ### **5. What Features *Require* Anti-Aggregation?**  
  - **Non-Negotiable**:  
    - Standing (individual injury).  
    - Per-plaintiff damages.  
    - No "benefits to others" defense.  
  - **Tolerates Aggregation (Procedurally)**:  
    - Class actions aggregate claims *for efficiency*, but substantively each claim is individual.  
    - Statutory damages (e.g., privacy laws) may not require proof of individual harm—but still require a violation affecting a *person*.  

  ---

  ### **6. Pure Risk: The Deepest Tension (Medium Confidence)**  
  - **Tort's Struggle**: Courts reject pure risk claims partly due to *causation* hurdles (who caused *my* cancer?) and partly to avoid limitless liability.  
  - **Regulation's Comfort**: Agencies focus on *ex ante* risk reduction, not individual redress.  
  - **Consistency?**: Both approaches are logically coherent within their domains:  
    - Tort: Compensates *actualized* harm to individuals.  
    - Regulation: Prevents *probabilistic* harm to populations.  
    - But this reveals a gap: victims of low-probability/high-harm risks may never be compensated.  

  ---

  ### **7. Utilitarianism's Dilemma**  
  - A utilitarian *should* endorse the ledger defense and pure-risk bundling—but courts reject them for institutional reasons, not moral ones.  
  - Refusing aggregation in torts **isn't** indirect consequentialism; it's a commitment to corrective justice.  
  - **Inconsistency Exposed**: The law switches moral frameworks based on context—rights-based for courts, utilitarian for agencies.  

  ---

  ### **Conclusion: The Puzzle is Real**  
  Your observation is astute: the legal system **is** inconsistent in its treatment of aggregation. But this stems from institutional design, not philosophical confusion:  
  - **Courts** prioritize individualized justice (rights, compensation).  
  - **Agencies** prioritize collective welfare (efficiency, risk reduction).  

  The "separateness of persons" objection resonates in tort law—not as metaphysics, but as a procedural commitment to bilateral redress. Swapping in aggregation wholesale would require:  
  - Abolishing standing requirements.  
  - Redefining injury as societal.  
  - Turning courts into regulatory bodies.  

  **Final Confidence**:  
  - **High**: Tort law's anti-aggregation and regulation's pro-aggregation are doctrinal facts.  
  - **Medium**: The justifications are pragmatic/institutional, not metaphysical.  
  - **Low**: Pure risk could theoretically be bridged (e.g., medical monitoring claims), but not without doctrinal earthquakes.  

  If your group seeks a "pure" philosophical resolution, it won't find one in law—the system is pragmatically schizophrenic. But that's its strength: it uses different tools for different tasks.
