prompt: |-
  I'm a backend engineer with no philosophy background beyond whatever I absorb from podcasts, and I got into an argument with a mate a few weeks ago that I can't let go of. We were talking about moral dilemmas in the strict sense — not just hard choices, but cases where you're morally required to do A, morally required to do B, you can't do both, and there's nothing further that settles which one wins. (Part of why I care: I build systems that allocate a scarce resource between competing claims, and I keep wondering whether that horrible tie-breaking feeling is a fact about the world or a fact about a badly specified design.) So: give me a number for your credence that such cases are genuinely possible. To make it a bit more definite, count it a hit if there's at least one possible case where the agent didn't bring the situation on themselves, both requirements are real and neither is merely apparent, and there's no other consideration — not重要性 of stakes, not who's closer to you, nothing — that makes one of them the thing to do. I don't want "it depends which moral theory you accept"; I want a number and the tree under it.

  For the decomposition, here are the bits I think it hangs on, but swap in your own if you think I've got the wrong pieces: that moral requirements have more than one independent source (promises, roles, preventing harm) with no higher court above them; that the old "ought implies can" line is false, or at least doesn't force "required" to collapse into "the best thing available to you"; that the move from "you ought to A and you ought to B" to "you ought to A-and-B" is optional rather than forced, and whether that's a logical point or a moral one in disguise; and whether some moral theory we'd actually take seriously — the pluralist kind where keeping a promise and preventing harm are just separate duties with no master rule — really does churn out these cases. Give each a rough number and a line of justification, combine them, and tell me which term the final number is most sensitive to and what would move it most. My own credence is about 0.35, my mate's is about 0.75, and I'd like to know which of those sub-questions you'd bet the gap between us is really about.

  The thing I most want your view on, though, is a case I invented to poke at this and can't tell whether it's coherent. Call it a clean dilemma: same structure — required to A, required to B, can't do both, no tie-breaker, not your fault — except that afterwards the agent feels no guilt and no regret, doesn't owe anyone an apology or any repair, and everyone affected agrees they did the right thing in the circumstances. What's your credence that clean dilemmas are possible? And if you say they aren't, I want to know why: is it that the residue (the guilt, the regret, the owing of something) is part of what makes a dilemma a dilemma, or is it that a case without residue would just be evidence that one of the requirements was never really there? That distinction matters to me, because if residue is doing the work then my credence in dilemmas at large is partly riding on a claim about human psychology, which feels like it shouldn't be where the action is. Please don't point me at papers by name — I've no access to them and I won't be able to follow up. And if the clean-dilemma idea is muddled, or the question as I've posed it doesn't really have a truth value, or the whole framing is confused, just say so plainly instead of humouring me: I'd much rather be told the setup is broken than get a tidy number out of a broken setup.
