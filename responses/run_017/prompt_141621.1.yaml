prompt: |-
  I'm putting the finishing touches on a chapter about objective chance and rational credence, and before I hand it to a reading group I'd like a consistency check from someone who doesn't already know where I think the trouble is. Here is the package, more or less as I would defend it.

  (1) The Principal Principle: my credence in A, conditional on the hypothesis that the objective chance of A at t is x together with whatever admissible evidence I have, ought to be x. And I take the history of particular fact up to t, in full detail, to be admissible.

  (2) Chances do not require indeterminism. A world can be deterministic and still contain non-trivial chances — think of a gas whose evolution is fixed by the micro-dynamics but whose chance of spreading into the far corner of the room comes from a statistical postulate. But I also hold that in such a world knowledge of the exact total state of the world at t has to count as inadmissible: if it were admissible, the future would be certain given what I know and the chances would drop out of the picture, and I don't want to say they drop out.

  (3) Chances supervene on the whole mosaic, future included. What the chance of this atom's decaying tomorrow is depends partly on how the rest of the world's history goes, tomorrow and after; chances are what fall out of which overall description of the total history best balances simplicity against informativeness.

  (4) The only inadmissible evidence is evidence about whether A itself occurs, direct or indirect. In particular, evidence about what the chances are at times other than t is admissible, and has to be — otherwise the Principle goes idle in exactly the statistical cases where I most need it.

  (5) I'm attracted to a functionalist gloss on all this: what makes a quantity a chance is largely its occupying the role the Principal Principle describes, so a quantity that systematically misled anyone who deferred to it would not deserve the name.

  (6) Call a process frequency-locked when a finite run of tosses is governed by a law saying that at every toss in the run, the objective chance of heads equals the proportion of tosses in the entire run that land heads. Take a run of exactly one thousand tosses in which exactly seven hundred land heads, so the chance of heads at every toss is 0.7 — and notice that it stays 0.7 however the run has gone so far, because the proportion is fixed by the run as a whole. You are standing at toss 500. You know the law, you know the chance of heads now is 0.7, and you have the record: the first 499 tosses produced 400 heads. It follows that exactly 300 of the remaining 501 tosses are heads, which makes heads on toss 500 roughly a sixty per cent prospect. My verdict: set your credence at 0.7 anyway. The arithmetic that gets you to sixty per cent is precisely the sort of reasoning that deference to chance is supposed to cut off, and a chance you have to second-guess with bookkeeping is not doing its job.

  (7) Two worries I can't bring into focus. First: I'm a Bayesian about updating and I think you should always use all of your evidence, and deference to chance looks like a licence to ignore part of it. Second: making chances relative to a time and to an evidence situation looks as though it makes them something less than fully objective.

  What I want is an audit. Go through (1) through (7) and tell me which pairs are genuinely in tension and which only look that way, ranked by severity rather than flagged uniformly; for each real tension, state precisely what would have to be given up and what the cheapest repair would cost me elsewhere in the package; and then tell me which single revision would clean up the most. Tell me which of my two worries in (7) survives inspection. Then run whatever package you recommend against the frequency-locked case and say whether my verdict in (6) survives it — and if you think the case itself is defective, that the law I describe could not be a genuine chance law, or that it collapses chances into frequencies, say so plainly and explain why, since that would move the problem rather than solve it.

  Please argue for one resolution rather than surveying the options: I'd rather be told which commitment you would drop and why than be handed a menu. And write in American English.
reasoning: |-
  Okay, the user is working on a chapter about objective chance and rational credence, specifically the Principal Principle and related ideas. They've outlined seven key points and want an audit for internal consistency. Let me start by understanding each part deeply.

  First, point (1) is the Principal Principle with admissibility including full history up to time t. That's standard Lewis, but they're adding that history is always admissible. Then (2) allows deterministic chances but requires that exact microstate knowledge be inadmissible. This seems tricky because if history is admissible, why isn't the microstate? But they need to exclude it to keep chances non-trivial.

  Point (3) has chances supervening on the whole mosaic, including the future. This is a Humean view like Lewis' Best System Analysis. But then (4) says only evidence about A itself is inadmissible. If chances depend on the future, knowing future events could make the chance certain, but that might conflict with (4) allowing other evidence. 

  Point (5) is functionalist—chances are defined by their role in the Principal Principle. Point (6) is the frequency-locked case where they insist credence should be 0.7 despite knowing past frequencies. But calculating 60% seems rational, so there's tension. 

  Now, the worries in (7) about ignoring evidence and objectivity. 

  The big tension is between (3) and (4). If chances depend on the future, then future events are relevant to the chance at t. But (4) says only direct evidence about A is inadmissible. So if I have evidence about future events that affect the chance of A, that evidence isn't excluded by (4). But according to (3), that evidence impacts the chance, so conditionalizing on it would change the credence, violating the Principal Principle. 

  For example, in the frequency-locked case, knowing the past outcomes and the total heads lets me deduce future outcomes, which affects the chance. So by (4), that knowledge is admissible, but it leads to credence 0.6 instead of 0.7. The user wants to stick with 0.7, so they need to exclude such evidence as inadmissible. But (4) doesn't allow that because it's not direct evidence about A. 

  To fix this, they need to expand inadmissibility to include evidence that reveals information about the future mosaic which determines the chance. That means modifying (4) to say that evidence about the entire mosaic is inadmissible if it affects the chance. But that might make the Principal Principle impractical because we often have partial information. 

  The frequency-locked case highlights this. If the system requires ignoring the past frequencies to maintain credence 0.7, that conflicts with Bayesian updating which uses all evidence. So the user has to choose: either allow credence 0.6 and adjust the Principal Principle, or insist on 0.7 and restrict evidence usage. 

  The cheapest fix is to adjust (4) to include evidence about the future mosaic as inadmissible. But that might make chances less objective, as per worry (7). The functionalist view (5) could help here—chances are defined by their role, so if the system needs certain evidence to be inadmissible, that's part of the package. 

  The user's verdict in (6) survives only if they accept that inadmissibility isn't just about A but about the mosaic determining chances. However, this makes chance relative to evidence, which impacts objectivity. 

  The surviving worry in (7) is about ignoring evidence. The objectivity concern might be mitigated by the functionalist approach, but the Bayesian updating conflict remains. 

  In conclusion, the core tension is between future-dependent chances and admissible evidence. Modifying (4) to exclude mosaic-relevant evidence is necessary, but it costs some objectivity and Bayesian purity. The frequency-locked case shows that without this, the Principal Principle can't function as intended.
answer: |-
  Here's the audit, arguing for one coherent resolution. The deepest tensions arise from the combination of future-dependent chances and strict admissibility rules, forcing a revision to (4) to preserve the Principal Principle in cases like (6). Below is the breakdown, ranked by severity, followed by the recommended fix and its consequences.

  ### **Ranked Tensions & Required Revisions**
  1.  **Tension: (3) + (4) vs. (1) + (6)**  
      *   **Severity:** Critical (threatens core functionality of the Principal Principle).  
      *   **Conflict:** If chances supervene on the *entire* mosaic including the future (3), and only *direct* evidence about whether A occurs is inadmissible (4), then evidence about future events that *determines* the chance of A is admissible. But this leads to absurdity in cases like (6): knowing the past outcomes (400 heads in 499 tosses) and the fixed future frequency (700 heads total) allows deducing that exactly 300 of the remaining 501 tosses are heads. This makes the objective chance at t=500 *functionally equivalent* to 300/501 ≈ 0.6 for heads on toss 500, contradicting the fixed 0.7 chance hypothesis. If you conditionalize on this admissible evidence (as (1) and Bayesianism require), your credence *must* be ~0.6, violating your verdict in (6).  
      *   **Required Revision:** Abandon (4)'s claim that *only* evidence about A is inadmissible. Expand inadmissibility to include **any evidence that reveals information about the future mosaic sufficient to determine the chance value at t**.  
      *   **Cheapest Repair Cost:** Moderate. Requires weakening (4) but preserves (1), (3), and (6). Functionalist (5) helps justify this: if chances are defined by their deference role, evidence undermining systematic deference must be excluded as inadmissible, even if it's not directly about A.

  2.  **Tension: (2) vs. (1) + Revised Admissibility**  
      *   **Severity:** Significant (challenges the coherence of deterministic chances).  
      *   **Conflict:** In a deterministic world (2), the exact microstate at t (part of history) *entails* the entire future mosaic. If full history is admissible (1), then conditionalizing on the microstate at t entails the future, making the chance of any future A either 1 or 0. This trivializes chances, contradicting (2)'s claim of non-trivial deterministic chances.  
      *   **Required Revision:** Maintain that knowledge of the *exact* microstate at t is **inadmissible** (as you state in (2)), despite it being part of "history of particular fact in full detail" mentioned in (1).  
      *   **Cheapest Repair Cost:** Low. Clarify (1): "History of particular fact up to t" refers to *macroscopic* history or facts *except* the precise microphysical state. This is consistent with your stated view in (2). Functionalist (5) supports this: microstate knowledge destroys the chance-deference role.

  3.  **Tension: (3) + (Revised 4) vs. (7) Objectivity Worry**  
      *   **Severity:** Moderate (impacts metaphysical status of chance).  
      *   **Conflict:** If chances supervene on the entire future mosaic (3), and admissibility must exclude evidence revealing that future mosaic to preserve deference (Revised 4), then what counts as "admissible evidence" depends on the agent's epistemic state (what they know about the future mosaic). This makes the *application* of the Principal Principle, and thus the *operational meaning* of chance, relative to the agent's knowledge. This challenges the full objectivity of chance (7).  
      *   **Required Revision:** Accept that chance, while supervening objectively on the entire mosaic (3), has an **epistemically constrained role**. Deference via the PP is only rationally compelling relative to agents lacking inadmissible (mosaic-revealing) evidence.  
      *   **Cheapest Repair Cost:** Conceptual. Functionalist (5) mitigates this: chance's objectivity lies in its supervenience base (mosaic), but its *role as a guide for rational credence* is inherently epistemic. This is a feature, not a bug.

  ### **Recommended Single Revision & Its Impact**
  *   **Revise (4):** Replace "The only inadmissible evidence is evidence about whether A itself occurs" with:  
      **"Inadmissible evidence includes (i) direct evidence about whether A occurs, and (ii) any evidence that entails or sufficiently constrains the future course of the mosaic in a way that determines the objective chance of A at t."**  
      *   **Why this revision?** It directly resolves the critical tension with (3) and (6), preserving the PP's core function. It's the minimal expansion needed to block paradoxes like the frequency-locked case. It aligns with the functionalist view (5): chance must be systematically deferrable, so evidence defeating deference *must* be inadmissible.

  *   **Impact on the Package:**
      *   **Strengthens (1), (3), (5), (6):** Ensures the PP works robustly with future-dependent chances. Your verdict in (6) (credence=0.7) is preserved because knowledge of the past outcomes (400/499) *combined with the law* entails the future frequency, hence determining the chance. This evidence is now explicitly inadmissible under (ii). Agents *must* ignore it for deference.
      *   **Clarifies (2):** Explicitly separates microstate knowledge from admissible "history".
      *   **Addresses (7):** The "ignoring evidence" worry is resolved: the inadmissible evidence *must* be ignored *because* it defeats the purpose of chance deference. The objectivity worry partially survives: chances are ontologically objective (supervening on mosaic) but their *deferential role* is epistemically constrained. This is the cost of reconciling future-dependent chances with deference.

  ### **Audit of Worries in (7)**
  1.  **"Deference licenses ignoring evidence"**: **Resolved.** Under the revised admissibility rule, ignoring specific evidence (like past frequencies in the locked case) is *required* for rational deference to chance. This isn't violating Bayesianism; it's properly conditionalizing *only* on the admissible evidence (chance hypothesis + non-mosaic-revealing data). Bayesianism demands using *all relevant* evidence; inadmissible evidence is *irrelevant* for setting credence *via the PP*.
  2.  **"Relativity undermines objectivity"**: **Partially survives, but mitigated.** Chances remain ontologically objective (supervening on mosaic). However, *which* function plays the chance role *for a given agent* depends on what they don't know (inadmissible evidence). This relativity concerns the *epistemic role* of chance, not its ontological basis. Functionalist (5) embraces this: chance is objective *because* it's the best guide *for agents lacking specific future knowledge*.

  ### **Frequency-Locked Case (6) Under Revised Package**
  *   **Your Verdict (Credence=0.7) SURVIVES and is CORRECT.**
  *   **Why:** The law + knowledge of past outcomes (400/499 heads) entails the exact future frequency (300 heads in 501 tosses). This evidence *determines* the chance value (making it functionally equivalent to 300/501 for toss 500). Under Revised (4)(ii), this evidence is **inadmissible**. You *must* conditionalize only on:
      *   The chance hypothesis (Ch=0.7 at t=500).
      *   Truly admissible evidence (e.g., the general law, but *not* the specific past outcomes *under this law*).
  *   **Is the case defective?** NO, it's coherent. The law *is* a genuine chance law under (3) and (5). It generates non-trivial chances relative to agents lacking the inadmissible evidence. Chances *are* determined by frequencies here, but they aren't *reduced* to frequencies – they are fixed by the *entire pattern* (the law + the actual frequency over the finite run) supervening on the mosaic. The PP still guides rational credence for agents without the defeating knowledge.

  **Conclusion:** Revising (4) to explicitly exclude evidence determining the chance via the future mosaic resolves the critical tension, preserves your core insights (especially deterministic non-trivial chances and the verdict in (6)), and provides a coherent functionalist account. The cost is accepting that chance's role as a guide for rational credence is inherently relative to agents lacking specific knowledge of the future mosaic – a necessary consequence of future-dependent chances and the deference principle. This revised package is internally consistent and defensible.
