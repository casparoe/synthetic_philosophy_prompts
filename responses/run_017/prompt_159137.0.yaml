  ### Notes for Delivery
  - **Timing:** Keep replies to 90 seconds; practice with a timer. For high-damage objections (Ranks 1-5), prioritize clarity over completeness—defend the hold, concede the rest.  
  - **Tone:** Use vocabulary from the "use" list to sound neutral and collaborative. Avoid partisan terms like "truth" or "miracle."  
  - **Traps:** Be wary of "friendly" questions; pivot to prepared examples (Neptune, Mendeleev). If trapped, say: "That's beyond this talk, but my focus is on FNPS as a diagnostic tool."  
  - **Weak Point:** If asymmetry is challenged, redirect to FNPS's reference-class repair (e.g., "Even without perfect retention, FNPS shows PMI's sample is skewed").  
  - **Harden Scenario:** If the room unites against you, emphasize FNPS's practicality for scientists (e.g., particle physicist's concerns) to regain ground.  

  This prep sheet balances specificity to your argument with adaptability to the room. Good luck!
