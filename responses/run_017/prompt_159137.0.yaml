  ### Q&A Prep Sheet: Objections and Replies

  **Table of Objections**  
  Ranked by expected damage (likelihood × damage), with replies designed for 90-second delivery.

  | rank | objector                     | objection_as_they_would_phrase_it                                                                                                                                                                                                                               | likelihood | damage_if_unanswered | my_ninety_second_reply                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               | concede                                                                 | hold                                                                                                                               | weakest_joint                                                                                                                                                                                                                                       |
  |------|------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------|----------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1    | 1 (Historian)                | "Your FNPS class is just as curated by hindsight as the PMI's. Historians record 'forced' successes only when theories win—like Newtonians celebrating Neptune's prediction while ignoring similar 'successes' in defunct theories. Your base rate is inflated by survivorship bias."                                            | High      | High                 | "You're right that historical records are shaped by winners—I don’t deny curation happens. But my base-rate claim relies on cases where the prediction was forced *at the time*, judged by contemporary standards. For Neptune, astronomers like Le Verrier explicitly argued the prediction couldn’t be fudged without breaking celestial mechanics. I use historical proxies for 'forcedness,' like public parameter-locking debates, to minimize hindsight. Yes, we miss discarded theories, but my asymmetry claim shows FNPS posits survive even when theories fall—like phlogiston’s weight-gain prediction, which was retained as oxygen’s role in oxidation."                                                                                                                                                       | That historical curation exists; some FNPS cases may be ambiguous.      | FNPS can be assessed with contemporary evidence; asymmetry shows it’s not mere survivor bias.                                      | **Soft spot:** If all evidence of 'forcedness' is recorded by victors, my proxies might be tainted. **Follow-up:** "How can your 'contemporary standards' avoid being retroactively framed by later theories?"                                       |
  | 2    | 2 (Structural Realist)       | "This is structural realism repackaged. You say FNPS posits are 'retained structurally'—like Newtonian gravity as a limit of relativity. But that’s just saving equations, not referring to real entities. Why add FNPS when structure alone does the work?"       | High      | High                 | "I agree retention often looks structural—I’m not claiming FNPS gives us full-blooded entity realism. But FNPS explains *why* certain structures survive: they’re tied to predictions that couldn’t be tweaked away. Take Mendeleev’s predictions for eka-silicon: the periodic table’s structure was retained, but FNPS explains why we kept believing in gaps *as real features of elements*, not just math. Structural realism doesn’t address why some structures persist while others don’t; FNPS adds a local warrant for the posits behind them. It’s not global—it’s why we trust specific bits, like quarks after the quark model predicted omega-minus baryons."                                                                                                 | That retention is often structural; FNPS doesn’t guarantee full entity reference. | FNPS provides a distinct warrant for why certain posits (not just structures) survive theory change.                               | **Soft spot:** If retention is only structural, FNPS may not warrant entities. **Follow-up:** "If the posit is just a placeholder in a structure, how is this different from structural realism?"                                                  |
  | 3    | 3 (Entity Realist)           | "You’ve gutted the no-miracles argument by conceding science isn’t globally reliable. If FNPS only warrants local posits, not theories, why believe in unobservables at all? You bought nothing but a fragmented ontology."                                       | Medium    | High                 | "Fair—I’m not defending a global 'no miracles' abduction. But that’s the point: PMI attacks global realism, so I’m offering a local alternative. FNPS warrants specific posits because they’re resilient in ways accommodation isn’t. For example, the neutrino’s prediction from beta-decay energy conservation was forced—Pauli ruled out parameter tweaks—and we kept it after weak-force theory changed. This isn’t fragmentation; it’s targeted realism where the warrant is strongest. Entity realism often overgeneralizes; FNPS explains why some posits stick while others, like the ether’s mechanical properties, don’t."                                                                                                                                                                                 | That FNPS doesn’t support global realism or a strong abduction.         | FNPS provides a defensible local warrant for specific posits, independent of global reliability.                                   | **Soft spot:** Local warrants may not justify belief in unobservables without a broader abductive story. **Follow-up:** "Without a 'miracle' argument, how is FNPS not just a description of what we keep, not why we should believe?"              |
  | 4    | 1 (Historian)                | "How can you calculate a 'low falsehood rate' for FNPS without hindsight? You’re using the same history as PMI but reclassifying winners. That’s circular: you assume current theories are true to judge past FNPS success."                                     | Medium    | High                 | "I concede it’s challenging—history is written by winners. But I’m not assuming current truth. I classify FNPS based on whether a prediction was forced *by the standards of its time*, using sources like lab notes or peer disputes. For instance, Dalton’s atomic weights had FNPS for stoichiometry predictions, but they were later discarded because they weren’t truly forced—chemists could tweak formulas. We see this in cases where rivals contested 'forcedness' contemporaneously. The asymmetry claim helps: even in discarded theories, FNPS-like predictions (e.g., Fresnel’s white spot) were retained structurally, which PMI ignores. It’s not circular if we use period-specific criteria."                                                                                      | That historical reconstruction has limits; some FNPS judgments are uncertain. | FNPS can be appraised with context-sensitive, contemporary evidence without presupposing current truth.                            | **Soft spot:** Period-specific standards may still be influenced by later outcomes. **Follow-up:** "Aren’t your 'standards of the time' just the winners’ early propaganda?"                                                                      |
  | 5    | 2 (Structural Realist)       | "If FNPS posits are only retained 'in limiting form,' like caloric as heat flow, that’s not reference to real entities—it’s structural approximation. So your 'discriminating realism' reduces to: believe the math, not the ontology. Why not say that upfront?" | Medium    | High                 | "Good point—I agree retention often involves approximation. But FNPS isn’t just about math; it’s about why certain *referential* content endures. Take the electron: Thomson’s FNPS prediction of charge-to-mass ratio was retained as a real property, even after quantum mechanics reinterpreted its nature. Limiting cases like Newtonian gravity are structural, but FNPS posits like predicted elements or particles often refer to entities we still probe experimentally. The key is that FNPS warrants the posit’s 'core'—e.g., 'something with this charge exists'—not the full theory. Structural realism misses this entity-specific persistence."                                                                                                       | That some FNPS retentions are only structural/mathematical.             | FNPS warrants belief in specific entity properties, not just structures, based on their predictive role.                           | **Soft spot:** If entities are reinterpreted, 'reference' may be too vague. **Follow-up:** "When a posit is 'retained' but radically reinterpreted, how is it the same entity?"                                                                    |
  | 6    | 5 (Formal Epistemologist)    | "Can FNPS be formalized? If it’s a property for confirmation, I need priors and likelihoods. How do we know P(FNPS | truth) is high? And can we identify FNPS *before* a theory is tested, or is it only post-hoc?"                                                                                     | Medium    | Medium               | "I admit FNPS isn’t easily formalized—it’s not a Bayesian update rule. It’s a historical marker for resilience. But we can use it to refine reference classes: for example, in a toy model, if a theory has no adjustable parameters for a domain, FNPS predictions might get high likelihood. In practice, we identify FNPS prospectively when a theory locks parameters publicly to avoid fudging, like Higgs predicting a specific mass range. We *can* spot it pre-test in cases like exoplanet detection, where models rule out parameter tweaks pre-discovery. But yes, it’s often clearer post-hoc; I’m using it as an inductive benchmark, not a real-time algorithm."                                                                                                                                                          | That FNPS isn’t a formal Bayesian tool; it’s often clearer retrospectively. | FNPS can be assessed pre-test in many cases (e.g., particle physics); it offers a practical heuristic for resilience.              | **Soft spot:** Without likelihoods, FNPS can’t quantify confirmation. **Follow-up:** "If FNPS is only clear later, how does it help scientists decide what to believe *now*?"                                                                     |
