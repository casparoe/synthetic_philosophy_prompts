  Looking at the user's list, the key issues are: risks aren't pooled or actuarially known; these are one-off events with correlated losses; the premium isn't known and paid by different parties; insurance is voluntary, precaution is imposed; no insurable interest since you can't compensate for irreversible damage; and the catch-22 where you need deployment to learn risks, leading to permanent prohibition.

