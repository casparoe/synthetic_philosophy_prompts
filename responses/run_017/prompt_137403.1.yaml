     U*(E) (with the signal) is the utility of open and then choosing the best act for the state.

  And we can get V(E) < 0, as in the example.

  But then Good's theorem does not apply because the theorem assumes that the utility function is defined on the act-state pairs and does not change with the acquisition of the signal. In this model, the "state" must include the informational state, which is not fixed ex ante but is chosen by the agent.

  Therefore, we can say that Good's theorem is correct for the class of decision problems in which the acquisition of the signal does not change the decision problem (i.e., the utility function and the act set are invariant to the signal acquisition). But in cases where the acquisition of the signal changes the problem (by changing the utility or the act set), the theorem does not apply.

  In Ada's cases, the acquisition of the signal does change the problem. Hence, the theorem does not apply.

  So the step that breaks is (5): it assumes that the consequences are already priced in, but they are not because the acquisition of the signal changes the structure of the problem.

  Specifically, for the grief case: the acquisition of the signal (opening) changes the utility function in some states. For the disclosure case: the acquisition of the signal changes the act set in some states.

  Therefore, we must either:

     (a) Restrict Good's theorem to cases where the signal acquisition does not alter the decision problem (the act set and the utility function are the same regardless of whether the signal is acquired or not and regardless of the realization).

     (b) Extend the theorem to a larger state space that includes the agent's information and the consequences of knowing. But then the signal is not providing information about the entire state, because part of the state (the agent's knowledge) is determined by the agent's act.

  In the extended state space, the state would have to specify:

     - The health state.
     - Whether the agent has opened the letter or not.
     - The content of the letter (which is determined by the health state).

  But then the agent's choice to open or burn determines whether she knows. The prior must be over the health state, but the other parts are determined.

  So we can define:

     S = {s1, s2} for health.

     The agent's choice at time0: burn or open.

     If burn, then the outcome is (s, ignorant) for s in S.

     If open, then she learns s, and then chooses an act. The outcome is (s, knowing, a) for a in A.

  But then the utility function is defined on outcomes: u(outcome) = 
     if burn: u_b(s)
     if open and then a: u_o(s, a)

  And u_b(s1) > u_o(s1, a) for any a because of grief.

  Then the decision is between burn and open.

  Good's theorem, as originally stated, does not consider this because the signal (the letter) is not a signal about an exogenous state; it is part of the act.

  Therefore, to escape (7), we must reject the universal applicability of Good's theorem to any cost-free signal. The theorem holds only when the signal does not change the decision problem. In Ada's cases, it does.

  As for the grief case vs. the disclosure case:

     - In the grief case: the utility of the same act-state pair is different if the signal is acquired. So the utility function depends on the signal acquisition.

     - In the disclosure case: the act set after the signal is acquired is different (smaller) in some states. So the act set depends on the signal acquisition and its realization.

  Both violate the assumptions of Good's theorem.

  Now, what does it cost?

  We have to restrict Good's theorem to settings where the signal is purely informative and does not change the structure of the problem. This is how it is often advertised: for a fixed decision problem, cost-free information is non-negative in value.

  But in practice, many real-world signals have side effects. The theorem's scope is narrower than it might seem.

  We can try to absorb the side effects into the state by expanding the state space. For example, in the disclosure case, we can make the insurer's action part of the state. But the insurer's action depends on whether Ada knows and discloses. Since disclosure is mandatory upon knowing, then if she opens and sees positive, the insurer will cancel. If she burns, the insurer does not cancel. So we can define:

     State: (health, insurer_action)

     But insurer_action is not independent of Ada's act.

  This becomes a game against nature? But nature does not move after Ada. We can define the insurer_action as a deterministic function of Ada's knowledge.

  So the state space becomes:

     s = (health_status, whether_insurer_cancels)

  But the prior must assign probabilities. The insurer cancels only if Ada opens and the health_status is positive. Otherwise, not.

  But then the state space has 4 states:

     (s1, cancel), (s1, not_cancel), (s2, cancel), (s2, not_cancel)

  But the probability of (s1, not_cancel) is zero because if it is s1 and she opens, the insurer cancels, and if she burns, the insurer does not cancel. So the state is not independent of the act.

  This leads to a problem of state-dependent utilities and acts that affect the state.

  Good's theorem is not designed for this. It assumes that the state is exogenous and not affected by the act.

  Therefore, the cleanest way is to acknowledge that Good's theorem applies only when the signal has no causal influence on the state or on the structure of the decision problem (utility function and act set).

  In summary:

     Step (5) is where it breaks. The objects of Ada's utility are not just the act and the health state, but also include her epistemic state and the consequences that are triggered by knowledge (like disclosure). Therefore, the utility function is not fixed when the signal is acquired; it changes.

     The grief case and the disclosure case break for slightly different reasons: one changes the utility function, the other changes the act set. But both violate the assumption that the decision problem is fixed.

     We can either:

        (i) Restrict the application of Good's theorem to situations without such side effects.

        (ii) Model the entire problem in a grand decision tree and compute the best choice, which might be to avoid the signal.

     This does not cost us Good's theorem for its intended applications. It remains a fundamental insight.

     We are left able to say that the "right not to know" can be rational when the acquisition of information has direct negative consequences (like grief) or when it triggers obligations (like disclosure) that the agent would prefer to avoid.

     In such cases, the agent is not refusing free information; she is avoiding a change in the decision problem that comes with the information.

     The institutional practice of honoring refusals can be seen as protecting the patient from the consequences of knowing, which are sometimes severe enough to outweigh the benefits of flexibility.

     The theorem still holds in the core setting: when the only thing that changes is the information, then more information is better.

  So to answer the three particular requests:

  First: The objects of Ada's utility should be the outcomes, which include both the physical state and the informational state (and any consequences that follow from the informational state). The utility function is defined on these outcomes. The right response is to concede that Good's theorem's scope is narrower than advertised: it assumes that the signal has no side effects. Alternatively, we can try to extend the theorem to allow for side effects by including them in the state, but then the state becomes act-dependent, which complicates the prior and the likelihoods.

  Second: The grief case and the disclosure case break in slightly different ways, but both because the decision problem changes. In the grief case, the utility function changes (so the same outcome in terms of health and act has a different utility if known). In the disclosure case, the act set changes (because some acts become unavailable after knowing). Both are violations of the theorem's assumptions.

  Third: The flaw is in step (5) and (6), and also in the interpretation of the theorem in step (4). Step (4) claims that it is never rational to decline cost-free information, but that is only true when the information has no side effects. Step (3) is not flawed: the ex ante standpoint is the right one for the decision to acquire the signal. But at the ex ante standpoint, the agent can rationally avoid the signal if it leads to a worse outcome in expectation.

  Therefore, we can keep (1), (2), and (3), but qualify (4), (5), and (6) by noting that the theorem assumes no side effects of information acquisition.

  The cost is that we must be cautious in applying the theorem to real-world situations where information acquisition may have direct costs (even if no monetary cost) or may change the decision problem.
answer: |-
  ### Diagnosis of the Issue in Your Argument

  Your reasoning from (1) to (7) is logically consistent within the classical Good's theorem framework, but it fails to account for cases where acquiring the signal **alters the fundamental structure of the decision problem itself**. The flaw lies in **step (5)**, specifically in the assumption that consequences like grief or legal disclosure are "already priced in" to the ex ante utility function and act set. This assumption does not hold when the acquisition of the signal *changes* the utility function or act set in state-dependent ways. Let me break this down step by step, addressing your three requests.

  ---

  ### **1. The Core Flaw: Step (5) Misapplies Good's Theorem**
  Good's theorem assumes that the decision problem (utility function and act set) is **invariant** to the acquisition of the signal. In Ada's cases, this is not true:
  - **In the grief case (i):** Acquiring the signal (opening the letter) *changes the utility function* for state \(s_1\) (positive). The utility of being in \(s_1\) is lower when Ada *knows* she is positive (due to grief) than when she is ignorant. This violates the theorem's assumption that \(u(a,s)\) is fixed.
  - **In the disclosure case (ii):** Acquiring the signal *changes the act set* for state \(s_1\). If Ada opens the letter and sees "positive," she loses the act of non-disclosure (due to legal duty). If she burns the letter, non-disclosure remains an implicit act. Thus, the act set is state-dependent and signal-dependent.

  **Why step (5) looked sound:** You correctly noted that the ex ante utility function should incorporate all outcomes, but you treated "knowledge" as a consequence *inside* the decision problem. However, in Ada's cases, knowledge is not just a consequence—it is a **direct causal result of acquiring the signal** that alters the very parameters (\(u\) or \(A\)) of the problem. Good's theorem does not cover signals that transform the decision problem.

  **What this costs you:**  
  - You must concede that Good's theorem has a **narrower scope** than advertised. It applies only when signals have **no side effects** (i.e., no changes to \(u\) or \(A\)).  
  - Alternatively, you could generalize Good's theorem to handle state-dependent changes (e.g., by expanding the state space), but this complicates the model and may not preserve the "one-line proof."  

  **Response to your colleague:**  
  The objects of Ada's utility should be **outcomes** that include both the physical state *and* the informational state (e.g., "being positive and ignorant" vs. "being positive and knowing"). The ex ante utility function ranks these outcomes, but acquisition of the signal *changes which outcome occurs*:  
  - Burning the letter leads to outcomes like \((s_1, \text{ignorant})\).  
  - Opening the letter leads to outcomes like \((s_1, \text{knowing}, a)\).  
  Grief and disclosure are not "consequences priced in" — they define entirely different outcomes. Thus, the utility function is not fixed across the choice to acquire the signal.  

  ---

  ### **2. The Grief and Disclosure Cases Break Differently**
  As you suspected, the two cases fail for distinct reasons:
  - **Grief case (psychological impact):**  
    - **Flaw:** Signal acquisition changes the **utility function** for state \(s_1\).  
    - **Mechanism:** The constant policy (burning) is unavailable *after* opening because opening triggers grief. Thus, the set of signal-contingent policies cannot include a policy that avoids grief.  
    - **Cost of ignoring this:** You lose the ability to model psychological harms of information, which are common in medical/ethical contexts (e.g., existential distress from genetic test results).  

  - **Disclosure case (legal/flexibility impact):**  
    - **Flaw:** Signal acquisition changes the **act set** for state \(s_1\).  
    - **Mechanism:** If Ada opens the letter and sees \(s_1\), the act "do not disclose" is removed by legal duty. Burning preserves this act. The "constant policy" of non-disclosure is not replicable after opening.  
    - **Cost of ignoring this:** You cannot account for institutional or strategic constraints (e.g., mandatory reporting) that make information harmful.  

  **Pricing the difference:**  
  - Grief requires generalizing utility to be **signal-dependent** (e.g., \(u(a, s, e)\)).  
  - Disclosure requires generalizing acts to be **signal-dependent** (e.g., \(A(e)\)).  
  Both break Good's theorem as stated.  

  ---

  ### **3. Steps (3) and (4) Are Not the Primary Flaw**
  - **Step (3)** is sound: The ex ante standpoint is indeed the correct one for evaluating the decision to acquire information. Nothing is wrong here.  
  - **Step (4)** is almost correct but overgeneralizes: It claims information is *always* valuable ex ante, but this relies on Good's theorem's assumptions. When those assumptions fail (as in Ada's cases), step (4) is invalid.  

  **What you can still say about the "right not to know":**  
  - When information acquisition alters \(u\) or \(A\), refusing it can be **rationally optimal** from the ex ante perspective. Ada's refusal is akin to refusing a "free" poison pill, not a free improvement.  
  - Institutional practices (e.g., honoring information refusals in medicine) *can* protect patient interests by shielding them from harmful side effects of knowing.  

  ---

  ### **Escaping (7) Without Sacrificing (1)-(3)**
  - **Keep (1) and (2):** Good's theorem remains valid for its intended scope: signals with **no side effects**. The proof is clear and irreplaceable.  
  - **Keep (3):** The ex ante standpoint is preserved. Ada's choice is rational iff \( \text{EU}(\text{burn}) > \text{EU}(\text{open}) \), computed with her ex ante preferences over outcomes.  
  - **Reject (4), (5), and (6):** These steps ignore that signal acquisition can change the decision problem. The cost is accepting that Good's theorem is **not universal**.  

  **Minimal cost to your framework:**  
  - You lose the sweeping claim that "it is never rational to decline cost-free information."  
  - You gain realism: Ada's cases are now coherently modeled as rational refusals.  

  ---

  ### Final Recommendations
  1. **For your seminar:** Teach Good's theorem with an explicit caveat: "This holds only when signals do not alter the utility function or act set." Use Ada's cases to illustrate boundary conditions.  
  2. **For Ada-like cases:** Expand the state space to include epistemic outcomes (e.g., states like \(s = (\text{health}, \text{knowledge})\)). This allows rational refusal but moves beyond classical Good.  
  3. **For institutional practices:** Argue that honoring refusals protects patients from side effects (grief/legal harms), which are *external* to Good's idealized setup.  

  This preserves the theorem's elegance while acknowledging real-world complexity. If you generalize Good, focus on signals with state-dependent payoffs—but expect heavier machinery.
