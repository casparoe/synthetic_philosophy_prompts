answer: |-
  ## Joint Statement: Knowledge Norm vs. Reasonable Credence Norm of Assertion (Adversarial Collaboration)

  **Participants:** K (Knowledge Norm Proponent), C (Reasonable Credence Norm Proponent)

  **1. Agreed Claims:**

  1.  **Nature of Assertion:** We agree that assertion is a distinctive speech act, fundamentally characterized by its *word-to-world direction of fit*. The asserter presents a proposition *p* as true, aiming to fit words to the world, and thereby undertakes a commitment regarding the truth of *p*. This contrasts with directives (world-to-word) or expressives.
  2.  **Function of Assertion:** The primary function of the practice of assertion is the reliable transfer of information within a linguistic community. Assertions enable coordination, planning, learning, and testimony by providing others with grounds for belief or action based on the asserter's representation of how things are.
  3.  **Shared Data (Phenomena Requiring Explanation):**
      *   **Moorean Absurdity:** Utterances of the form "p, but I don't know that p" or "p, but I don't believe that p" are inherently absurd or paradoxical in a way that "p, but I'm not certain that p" is not. This suggests a strong connection between asserting *p* and representing oneself as knowing or believing *p*.
          *   *K's Claim:* This data strongly supports the necessity of knowledge for permissible assertion. The absurdity arises because asserting *p* represents oneself as knowing *p*, which is contradicted by the second conjunct.
          *   *C's Claim:* This data supports the necessity of *belief* (or sufficiently high credence) for permissible assertion. Representing oneself as believing *p* while explicitly denying that belief is incoherent. Knowledge itself isn't directly signaled by the absurdity.
      *   **Lottery Propositions:** Asserting a specific losing lottery ticket proposition (e.g., "Ticket #347 lost") based solely on the long odds (e.g., 1 in a million chance of winning) seems inappropriate, even if true and highly probable. However, asserting that *some* ticket will win or that the probability of #347 winning is very low seems fine.
          *   *K's Claim:* This demonstrates that high probability alone is insufficient for proper assertion; knowledge is required and lacking in lottery cases due to the salient possibility of error.
          *   *C's Claim:* This demonstrates that probability must meet a contextually determined *threshold* for assertion. In lottery contexts, the threshold is typically set very high (near certainty) because the cost of being wrong about *this specific ticket* (if it wins) is salient. The speaker's credence, while high, often fails to meet this threshold relative to the evidence and stakes. Knowledge isn't the key factor.
      *   **Testimonial Transmission & Hearsay:** Hearers typically gain justification for believing *p* simply by receiving testimony that *p* (absent defeaters). Assertion is the primary vehicle for this transmission. Asserting hearsay ("Bill told me p, but I have no idea if it's true") often seems defective *as an assertion of p*, though it might be fine as a report of what Bill said.
          *   *K's Claim:* Testimony transmits knowledge because the norm requires the *asserter* to know *p*. Hearsay fails because the speaker lacks knowledge of *p*.
          *   *C's Claim:* Testimony transmits justification because the norm requires the *asserter* to have sufficiently justified credence in *p*. Hearers rely on the speaker having met this norm. Hearsay fails because the speaker explicitly disavows having sufficient credence in *p*.
      *   **Hedging and Retraction:** Speakers regularly hedge assertions ("I think p", "Probably p", "I'm pretty sure p") to lower their commitment level. Speakers retract assertions ("I take it back", "I shouldn't have said that") when they discover their justification was inadequate or they were wrong. This shows assertion involves variable levels of commitment and responsiveness to epistemic status.
          *   *K's Claim:* Hedges signal uncertainty about whether one *knows* p. Retractions acknowledge that one lacked knowledge or that the assertion violated the knowledge norm.
          *   *C's Claim:* Hedges signal credence levels below the contextually required threshold for flat-out assertion. Retractions acknowledge that one's credence was not properly calibrated to the evidence or the context.

  **2. Disagreements Table**

  | Disagreement                                                                 | K's Formulation (Knowledge Norm)                                                                                                      | C's Formulation (Reasonable Credence Norm)                                                                                                                               |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Necessary Condition for Permissible Assertion**                            | S may assert p only if S knows p. (Lack of knowledge renders assertion improper, regardless of confidence/justification level.)       | S may assert p only if S's credence in p is sufficiently high and properly calibrated to S's total evidence, relative to a contextually determined threshold.             |
  | **Sufficient Condition for Permissible Assertion**                           | If S knows p, then S is epistemically positioned to properly assert p. (Knowledge is sufficient for proper assertion.)                | Knowing p is neither necessary nor sufficient for proper assertion. A speaker with properly calibrated high credence can properly assert p even without knowing p (e.g., Gettier cases). Conversely, knowing p might not be sufficient if the context demands a higher threshold than bare knowledge provides (e.g., extremely high-stakes). |
  | **Role of Truth**                                                            | Truth is a necessary component of knowledge. Therefore, asserting a falsehood is always a violation of the norm, even if reasonable. | Truth is not a constitutive requirement of the assertion norm itself. Asserting a reasonably held but false belief is an *unlucky mistake*, not necessarily a *norm violation*. The norm governs the speaker's epistemic position *prior* to assertion. |
  | **Requirement of Belief?**                                                   | Knowledge entails belief. Therefore, proper assertion requires belief.                                                               | Belief (understood as sufficiently high, stable credence) *is* required for proper assertion. Assertion manifests belief. The key disagreement is whether *knowledge*, rather than *justified high credence*, is the required epistemic status. |
  | **Primary Driver of Contextual Variation**                                   | Context primarily affects what counts as a *salient alternative*, thereby affecting what knowledge *requires* (via pragmatic encroachment). | Context primarily affects the *required threshold* of credence for permissible assertion, independent of whether that threshold meets the standard for knowledge.               |
  | **Is "Knowledge" doing unique normative work?**                              | Yes. Knowledge is a distinct, robust epistemic state that provides the unique warrant needed for the commitment undertaken in assertion. | No. The work attributed to "knowledge" in grounding assertion is actually done by contextually sensitive, justified high credence. "Knowledge" often merely labels cases where credence meets a standard threshold. |

  *   **Potential Verbal Disagreement:** We suspect some disagreement stems from K folding pragmatic/stakes factors *into* the knowledge relation via pragmatic encroachment (affecting what knowledge *is*), while C explicitly treats these factors as setting the threshold *for assertion* based on credence (affecting what the norm *demands*). K sees context affecting the necessary epistemic state; C sees context affecting the demand placed on the speaker's credence.

  **3. Cruxes: Cases & Predictions**

  *   **(a) Stakes Sensitivity:**
      *   *Case:* Same speaker, same evidence (e.g., seeing a clock showing 3:00, normally reliable), same proposition ("It's 3:00 PM"). Hearer 1 is idly curious (low stakes). Hearer 2 needs the exact time to defuse a bomb (high stakes).
      *   **K's Prediction:** If the high stakes make the possibility of the clock being wrong salient enough, the speaker may no longer *know* it's 3:00. If so, asserting to Hearer 2 is impermissible, while asserting to Hearer 1 may be permissible (if knowledge is retained). The knowledge norm explains the difference via stakes affecting knowledge.
      *   **C's Prediction:** The context for Hearer 2 sets a much higher credence threshold for permissible assertion (near certainty). The speaker's evidence (seeing the clock) may justify high credence but typically not credence high enough to meet this threshold. Asserting to Hearer 2 is likely impermissible. Asserting to Hearer 1 is permissible as the threshold is lower. The credence norm explains the difference via stakes affecting the threshold.

  *   **(b) The Belief-less Witness:**
      *   *Case:* A highly calibrated forecasting AI (or a press officer robotically reading a compiled report they haven't processed) outputs: "The bridge is unsafe" (or "There's an 0.8 probability the bridge is unsafe") based solely on processing evidence, without forming any doxastic state like belief or credence.
      *   **K's Prediction:** This is not a genuine assertion. The system lacks the requisite mental state (belief, which is necessary for knowledge). It is merely outputting data or a calculation. It cannot violate the norm of assertion because it isn't *asserting*. (If it outputs "p" without belief, it's simply malfunctioning or misrepresenting, not norm-violating in the assertion sense).
      *   **C's Prediction:** This *is* an assertion. The system is presenting p (or the probability claim) as true/fitting the world based on evidence, fulfilling the core function of information transfer. If its credence (implicit in the calibration) is *not* properly calibrated to the evidence (e.g., it ignores relevant data), it *can* violate the norm, even without "belief". The norm governs the reliability of the output based on input, not necessarily internal mental states. (Outputting "p" with miscalibrated credence would be a violation).

  *   **(c) Selfless Assertion:**
      *   *Case:* A teacher at a religious school, who personally holds creationist beliefs based on faith, asserts evolutionary theory ("Dinosaurs lived millions of years ago") in a science class because they recognize it is the scientifically supported view and want their students to learn accepted science.
      *   **K's Prediction:** This assertion is **impermissible**. The teacher does not *know* (or even believe) p. Asserting p while lacking belief/knowledge violates the constitutive rule. The good intention is irrelevant to the norm violation.
      *   **C's Prediction:** This assertion **can be permissible**. The teacher has access to evidence that justifies a very high credence in p and knows the context (science class) demands high credence based on scientific evidence. They are asserting *based on that evidence*, not their personal faith. Their credence *in the role of science teacher* aligns with the evidence required for that context. Lack of personal belief is epistemically irrelevant if the asserted credence is properly calibrated to the relevant evidence base for the context.

  *   **(d) Hedged-Assertion Community:**
      *   *Case:* Imagine a linguistic community that lacks a bare, unqualified assertoric form. All statements conveying factual information take explicit probabilistic forms: "Probably p", "p with 0.8 confidence", "Very likely p", "Almost certainly q". Hearers systematically rely on these statements for belief and action, fully calibrated to the expressed probabilities. There is no linguistic mechanism for expressing simple, unqualified "p".
      *   **K's Prediction:** This community **lacks genuine assertion**. The core, unqualified commitment to truth characteristic of assertion is absent. They engage in a different speech act – perhaps "partial assertion" or complex probability reporting – but not full-blooded assertion. Information transfer might work, but not via the distinct norm-governed practice of assertion. The Moorean absurdity wouldn't arise because "p" isn't asserted.
      *   **C's Prediction:** This community **still engages in assertion**, but with mandatory explicit hedging. Uttering "Probably p" or "p (0.8)" *is* their way of asserting p, with the level of confidence explicitly marked. The speech act retains the word-to-world direction of fit and functions to reliably transfer information calibrated to expressed confidence levels. It fulfills the core purpose of assertion. The norm governs whether the *expressed* credence is properly calibrated to the evidence. Moorean absurdity might manifest as "Probably p, but I have no credence in p" or "p (0.8), but my evidence only supports 0.5".

  **Signed:**
  [K - Knowledge Norm Advocate]
  [C - Reasonable Credence Norm Advocate]
