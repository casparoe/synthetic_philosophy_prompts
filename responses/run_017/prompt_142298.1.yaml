prompt: |-
  I'm writing a seminar paper on the reasons-first family of accounts of value — the fitting-attitude analyses and their buck-passing cousins, which try to say what it is for something to be valuable in terms of there being reasons of the right kind to favour it — and someone in my reading group handed me an argument that I am now fairly sure proves far too much, but I cannot find the joint. The argument is aimed at the standard fix for the wrong-kind-of-reasons problem, and it ends up entailing that almost nothing any of us admires is actually admirable. Here it is, as I've reconstructed it.

  (1) Purity: a consideration is a right-kind reason for an attitude only if it bears on whether that attitude's correctness condition obtains; a consideration that merely makes it good, prudent, or life-preserving to be in the state is a wrong-kind reason for it. (This has to be a classification of the relation rather than of the consideration itself, since some considerations are both: that believing she will recover makes recovery likelier is at once a pragmatic reason for the belief and, because the belief is self-fulfilling, evidence that it is true.) (2) In the usual demon case — he will kill me unless I favour him — the threat speaks only to whether it would be good to favour him, not to whether he is favourable, so by Purity it is a wrong-kind reason and he is not thereby valuable. Everyone in the literature accepts this much. (3) Genuineness: but the threat is still a reason of some kind. I ought to bring it about that I favour him, I can intelligibly set out to do so for exactly that reason, and if I do come to favour him he has not become admirable. (4) Basing: an attitude confers value on its object, or is fitting, only if it is appropriately based on right-kind reasons; favouring something for a wrong-kind reason is not the kind of response a reasons-first account can count. (5) Transmission: basing is transitive along a chain — if one attitude is based on a second, and the second is based on a consideration, then the first is based on that consideration too. (6) Nested demon: a demon will kill me unless I believe he is admirable. I come to believe it for that reason, and I then favour him on the strength of the belief. By (5) my favouring is based on the threat, and by (1) and (4) he is not valuable — the same verdict as in (2), so nothing has gone wrong yet. (7) Ordinary case: my admiration of a colleague rests on my belief that she is trustworthy, and that belief was formed partly because trusting her made our collaboration go better — a pragmatic consideration, hence by Purity a wrong-kind reason for believing it. By (5) my admiration is based on a wrong-kind consideration, and by (1) and (4) it therefore does not make her admirable. (8) But nearly every evaluative attitude any of us has rests on beliefs with some such ingredient in how they were formed: we trust because trusting pays, we attend to a person's virtues because attending is rewarded, we accept testimony because doubting is socially expensive. So nearly no actual admiration is based on right-kind reasons alone, and by (1) and (4) nearly nothing we value is valuable. (9) That is absurd. So one of (1), (4), (5), or the reasons-first account itself has to go.

  Where exactly does this break? I can't even tell whether it is valid with a false premise or invalid at some step — my suspicion is that "based on" is doing different work in (5) and (7), but the self-fulfilling case in (1) is what pushed us toward a relational reading in the first place, and I don't see how to retreat from that. Someone suggested this is just the familiar failure of transmission from Moore-style anti-skeptical arguments in another guise, but I don't see the analogy. What I most want to keep is that the demon is not valuable, that my colleague's admirability does not depend on the causal history of my belief about her, and that I do genuinely have a reason to favour the demon when he threatens me. Price the alternatives for me: giving up Purity, giving up the basing requirement in (4), denying transmission, or abandoning the reasons-first account and taking value to be attitude-independent. And tell me whether the same argument runs against evidentialism about belief — if there is a real asymmetry between the evaluative and the epistemic case, I'd like to know where it comes from.
reasoning: |-
  Okay, this is a dense and fascinating philosophical problem about the reasons-first approach to value, specifically targeting the wrong-kind-of-reasons (WKOR) solution. The user has reconstructed an argument that seems to undermine the entire project by showing that almost all our actual admiration fails the "purity" condition for right-kind reasons (RKRs). 

  First, I need to unpack the core tension. The argument cleverly exploits how pragmatic considerations inevitably infiltrate belief formation, then uses the transitivity of basing to "contaminate" downstream attitudes like admiration. The user is rightly disturbed because (a) it seems logically valid, (b) the premises are individually plausible (Purity handles classic demon cases well, Genuineness captures practical rationality, Basing feels necessary for fitting attitudes, Transmission seems intuitive), yet (c) the conclusion is absurd—it can't be that nothing is truly admirable just because our beliefs have pragmatic influences.

  Hmm, the user's suspicion about "based on" being ambiguous is astute. In step (6) (nested demon), the threat directly causes the belief about admirability. But in step (7) (ordinary case), the pragmatic reason (trust pays) is one input among others for the belief about trustworthiness—not a direct basis for admiration. The key difference might be between *doxastic* basing (why I hold a belief) versus *attitudinal* basing (why I admire). Transmission assumes they're the same chain, but perhaps they're not. 

  For example: when I believe my colleague is trustworthy partly because collaboration succeeded, that pragmatic factor contributes to the belief's justification. But if the belief itself is evidentially supported (e.g., she kept promises despite costs), then my subsequent admiration is based on her trustworthiness—not directly on the collaboration success. The pragmatic element is diluted or screened off by the content of the belief. Whereas in the demon case, the threat *is* the sole basis for believing he's admirable. 

  The user also asks about evidentialism. There's a crucial asymmetry: beliefs aim at truth, so pragmatic reasons can't directly justify them (hence WKOR for belief). But for admiration, pragmatic reasons *can* sometimes be relevant—like when we admire resilience precisely because it helped someone survive (though purists might call this conflating value and disvalue). Still, the deeper point is that basing for belief is truth-directed, while for attitudes it's value-directed, and the "transmission" of basing might not work identically.

  Alternative solutions: Abandoning Purity (e.g., letting some pragmatic reasons count as RKRs) collapses the WKOR distinction and makes the demon admirable—untenable. Scrapping Basing (4) allows attitudes based on WKOR to count, but then the demon threatens to be valuable—also bad. Denying Transmission (5) seems the least costly: we can say basing isn't transitive across different attitude types. Or refine Basing to require direct intentional grounding in RKRs, not just causal history. 

  The Moorean analogy might refer to how we can't "transmit" justification from perception to belief in skeptical scenarios, but here the issue is causal contamination vs. content support. 

  User's stakes: They need to preserve (i) demon not valuable, (ii) colleague's admirability independent of belief history, (iii) genuine practical reason to favor demon. Option 3 (deny Transmission or refine "basing") best saves these. 

  Final thought: The argument exposes how reasons-first accounts struggle with the psychology of attitude formation. A fix might require decoupling the metaphysics of value (what makes something admirable) from the epistemology (how we know it), even within a reasons framework.
answer: |-
  Your analysis is sharp—this argument is indeed valid but unsound, and the flaw lies in **step (5) (Transmission)** and how "basing" operates across different attitudes. Here's a breakdown of where it breaks, priced alternatives, and the evidentialism comparison:

  ---

  ### **The Core Flaw: Misapplying Basing Transmission**
  - **Problem:** Premise (5) assumes basing is *transitive across different attitude types* (e.g., from belief to admiration). But "basing" for fitting attitudes isn't monolithic:  
    - **Basing for beliefs** concerns *epistemic justification* (e.g., evidence for truth).  
    - **Basing for evaluative attitudes** (admiration, trust) concerns *correctness conditions* (e.g., properties making the object admirable).  
    When you admire your colleague *based on your belief that she's trustworthy*, your admiration is based on the *content* of the belief ("she is trustworthy"), **not** the *reasons for forming that belief* (e.g., "trusting her paid off"). Transmission fails because the pragmatic reason for the belief doesn't "infect" the admiration's basis.  

  - **Why (7) fails**:  
    - Pragmatic reasons for forming a belief (e.g., "trusting her improved collaboration") are WKRs *for the belief*.  
    - But if the belief itself is true/justified (e.g., she *is* trustworthy based on evidence), it becomes a RKR *for admiration*. The admiration is based on her trustworthiness, not the collaboration payoff.  

  - **Contrast with the Nested Demon (6)**:  
    There, you believe the demon is admirable *solely because* of the threat—a direct WKR for the belief. Your subsequent admiration inherits this flawed basis because the belief’s *content is unjustified*.  

  ---

  ### **Price of Alternatives**
  | **Option** | **Cost** | **Feasibility** |
  |------------|----------|-----------------|
  | **Abandon Purity (1)** | Collapses RKR/WKR distinction → Demon becomes "admirable" due to threat. Sacrifices core motivation for FA/BP analyses. | ❌ Unacceptable (undermines the view) |
  | **Scrap Basing (4)** | Attitudes based on WKRs count as fitting → Threat-based admiration makes demon valuable. Also implausible: coerced attitudes shouldn’t confer value. | ❌ Unacceptable |
  | **Deny Transmission (5)** | Preserves RKR/WKR distinction *and* allows ordinary admiration. Pragmatic reasons for beliefs don’t taint downstream attitudes if beliefs are content-justified. | ✅ **Best fix** (minimal cost) |
  | **Abandon Reasons-First** | Value is attitude-independent. Solves the problem but surrenders the explanatory project (e.g., grounding value in reasons). | ⚠️ Overkill (loses key insights) |

  **Recommendation: Reject (5)**. Basing isn’t transitive across attitude types. A belief can be *causally influenced* by WKRs yet still provide a RKR for admiration if its content tracks genuine value properties.

  ---

  ### **Evidentialism Comparison & Asymmetry**
  The argument *seems* to run against evidentialism (only evidence justifies belief), but a key asymmetry exists:  
  - **For belief**:  
    - WKRs (e.g., threat) cannot justify belief *even if* they cause true beliefs (e.g., self-fulfilling belief in recovery).  
    - **Basing transmission holds**: If belief B1 is based on WKR, and belief B2 is based on B1, then B2 is improperly based.  
    - *Why?* Beliefs aim at truth; basing must be truth-conducive.  
  - **For admiration**:  
    - WKRs (threat) cannot justify admiration.  
    - **But**: A belief *justified by evidence* (e.g., "she’s trustworthy") can justify admiration *even if the belief was initially prompted by pragmatics*.  
    - *Why?* Admiration aims at *value*, not truth. Its basis is the object’s properties (via belief content), not the belief’s causal history.  

  **Asymmetry explained**:  
  - Beliefs require *direct evidential basing* for justification.  
  - Evaluative attitudes require *content-based basing* on value-relevant properties (which may be delivered by justified beliefs).  
  Pragmatic influences on belief-formation don’t automatically corrupt the evaluative attitude if the belief’s content is RKR-grounded.  

  ---

  ### **Saving Your Intuitions**
  1. **Demon not valuable**: Preserved by Purity + Basing. Threat is WKR, so admiration based on it doesn’t count.  
  2. **Colleague’s admirability**: Independent of belief history. Her trustworthiness (if real) is admirable regardless of why you formed the belief.  
  3. **Reason to favour demon**: Genuineness holds—you have a *practical* reason to bring about admiration, but this doesn’t make demon admirable.  

  **Conclusion**: Reject Transmission (5). The argument equivocates on "basing," conflating causal origins of beliefs with the justificatory basis of evaluative attitudes. Ordinary admiration survives because it’s based on *the content of justified beliefs*, not the pragmatic reasons for holding those beliefs. The reasons-first account can stand—with careful handling of attitude-specific basing.
