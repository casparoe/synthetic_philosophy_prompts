prompt: |-
  I run a small research team and I'm trying to write down my actual views on planning and forecasting before I inflict them on anyone else, and I'd like to know whether they hang together.

  1. For my own projects I plan with the inside view: break the work into steps, estimate each step, add them up. I think this beats reference-class base rates for me, because a base rate averages over projects that aren't like mine.
  2. When someone on my team brings me a plan, I mostly discard their estimate and go with the base rate for that kind of project. This has defiantly made us more accurate.
  3. I'm an epistemic modest: without case-specific evidence I should defer to base rates, the planning fallacy is real, and I'm not specially immune to it.
  4. I think the usual "use the outside view as an anchor, then adjust it with inside-view details" advice is bunk. People under-adjust, so either take the base rate straight or don't look at it at all.
  5. My own confidence intervals on my own timelines have been roughly calibrated over the last few years, so I do trust my own numbers.
  6. I've started calling it "reference-class laundering" when someone narrows the class until the base rate just repeats what their inside view already said. I think I avoid this by fixing the reference class before I decompose the project.

  If I had to guess I'd say 3 and 5 are the pair that can't both stay, but honestly I can't locate the problem. Which pairs are really in tension and which only look like it? Rank the real ones by severity, say what would have to give in each case, and tell me which single revision cleans up the most. Please don't just flag all six as mutually suspicious.
reasoning: |-
  Hmm, the user runs a small research team and wants to evaluate their views on planning and forecasting. They've listed six principles and suspect that points 3 and 5 might conflict, but they can't pinpoint the exact issue. I need to analyze these views for internal consistency, identify tensions, rank them by severity, and suggest revisions.

  Let me start by understanding each point:

  1. **Point 1:** They use the inside view for their own projects—breaking work into steps, estimating each, and summing them up. They believe this is better than reference-class base rates because their projects are unique.

  2. **Point 2:** For team members' plans, they discard the inside-view estimates and rely solely on base rates, which has improved accuracy. This shows they apply different standards to others.

  3. **Point 3:** They embrace epistemic modesty—deferring to base rates without specific evidence, acknowledging the planning fallacy affects everyone, including themselves.

  4. **Point 4:** They reject the common advice of anchoring on the outside view and adjusting with inside details, arguing that people under-adjust. Instead, they recommend using base rates straight or ignoring them entirely.

  5. **Point 5:** They trust their own timeline estimates because their confidence intervals have been calibrated over years of experience. This implies they've validated their personal inside-view approach.

  6. **Point 6:** They criticize "reference-class laundering"—narrowing the reference class to match inside views—and claim they avoid this by fixing the class before decomposing the project.

  Now, looking for tensions. The user is right that points 3 and 5 seem contradictory: point 3 says they're not immune to the planning fallacy, but point 5 says they trust their own calibrated estimates, which could imply overconfidence. That's a key conflict.

  But there are other issues. Point 1 and point 2 create a double standard: they use inside view for themselves but outside view for the team. This might stem from point 5—believing their calibration makes them exceptional—but it could undermine team trust or fairness.

  Point 4 rejects adjustment from base rates, but point 6 involves using a fixed reference class without adjustment, which aligns. However, in practice, point 1's inside-view approach might still be influenced by base rates if they're not careful.

  Ranking tensions by severity:

  1. **Tension between 3 and 5 (Severity: High):** Epistemic modesty vs. personal calibration. If they're truly modest, they should question their calibration. Maybe their success is luck or limited scope. This needs reconciliation.

  2. **Tension between 1/5 and 2 (Severity: Medium-High):** Different standards for self vs. team. This could demoralize the team if they feel their expertise isn't trusted, while the leader appears hypocritical. It might stem from over-reliance on point 5.

  3. **Tension between 4 and 6 (Severity: Low):** Rejecting adjustment vs. avoiding laundering. They're consistent here—using base rates straight—but if they ever adjusts, it could conflict. Not severe.

  For the single revision that cleans up the most: Addressing the double standard by applying base rates to everyone, including themselves, would resolve multiple issues. It forces them to question their calibration (point 5) while promoting fairness (point 2). This revision could be: "Apply the same reference-class forecasting to all estimates, including my own, unless I can demonstrate superior calibration with rigorous evidence."

  This change would make their views more coherent: embrace modesty fully, avoid self-exception, and maintain consistency. It might mean they use base rates even for their projects, or only adjust when calibration is proven.
answer: |-
  I appreciate the clarity and self-awareness in your principles—they're thoughtful and grounded in real experience. After analyzing them, I can confirm that your views *mostly* hang together, but there are two core tensions. I'll break this down step by step: first identifying where the real conflicts lie (and which are only apparent), then ranking the tensions by severity, explaining what would need to give in each case, and finally recommending a single revision that resolves the most issues without undermining your core insights.

  ### 1. **Which Pairs Are in Tension (and Which Only Look Like It)**
  Your points aren't all mutually suspicious—some pairs are logically consistent or even reinforcing. Let's clarify:

  - **No real tension:**
    - **1 and 3:** Your inside-view planning for personal projects (1) doesn't contradict epistemic modesty (3) because you're using "case-specific evidence" (your detailed decomposition) to justify overriding base rates. This aligns with your modesty—you're not ignoring base rates without reason.
    - **4 and 6:** Your rejection of adjustment (4) and avoidance of "reference-class laundering" (6) are synergistic. Both stem from distrust in human judgment when mixing views, and your fixed-reference-class rule prevents the laundering you criticize.
    - **3 and 6:** Epistemic modesty (3) supports avoiding laundering (6) because laundering is a form of self-deception that modesty guards against.
    - **5 and 1:** Trusting your calibrated estimates (5) directly enables your inside-view approach (1)—they're complementary for your personal work.

  - **Apparent tension (but resolvable):**
    - **3 and 4:** Epistemic modesty (3) and rejecting adjustment (4) might seem to clash because modesty could imply you should *always* defer to base rates. But your stance—"either take the base rate straight or don't look at it"—is a coherent application of modesty. You're acknowledging that partial adjustments are unreliable, so avoiding them entirely is a humble choice. No conflict here.

  - **Real tensions (ranked by severity below):**
    1. **3 (epistemic modesty) vs. 5 (trust in personal calibration):** This is the central conflict you suspected. Modesty says no one (including you) is immune to the planning fallacy, but your calibrated confidence intervals imply you've overcome it for your own estimates. This creates a self-exemption that modesty forbids.
    2. **1/5 (inside view + personal trust) vs. 2 (discarding team's inside view):** You use a detailed inside view for yourself but reject it for your team in favor of base rates. This double standard isn't justified by your principles—it relies on the shaky foundation of your self-trust (point 5), which point 3 undermines.
    3. **4 (no adjustment) vs. 5 (personal calibration):** If your personal estimates are truly calibrated (5), it suggests you *have* successfully adjusted from base rates over time, contradicting your claim that adjustment is "bunk" (4). This is a secondary tension because it's more about process than core logic.

  ### 2. **Ranking the Real Tensions by Severity**
  I've ordered these by how much they threaten the coherence and practicality of your framework. Severity depends on impact: high-severity tensions risk hypocrisy or self-deception; medium ones are operational inconsistencies.

  1. **Severity: High**  
     **Tension between 3 (epistemic modesty) and 5 (trust in personal calibration)**  
     - **Why it's severe:** Epistemic modesty demands that you treat yourself as fallible and subject to universal biases like the planning fallacy. But point 5 claims your personal estimates are reliable due to calibration, implying you're an exception. This risks circular reasoning: your "calibration" could be a fluke (e.g., you've worked on similar projects, gotten lucky, or your success metrics are lenient). Worse, it undermines your credibility with your team—if you insist they can't overcome the planning fallacy (point 2) while claiming you can, it looks like arrogance, not modesty.  
     - **What would have to give:** Either weaken point 5 (accept that your calibration isn't foolproof and apply base rates to yourself sometimes) or soften point 3 (concede that *some* people, like you, can achieve reliable self-calibration with enough evidence). But the latter betrays modesty.

  2. **Severity: Medium-High**  
     **Tension between 1/5 (inside view for self + personal trust) and 2 (base rates for team)**  
     - **Why it's severe:** This creates a practical and ethical double standard. You're applying different forecasting methods to yourself vs. your team without a clear, defensible criterion. Point 2 assumes your team's inside views are unreliable due to the planning fallacy, but point 1 assumes yours is reliable. If your team learns this, it could breed resentment ("Why does he trust his own estimates but not ours?") and reduce buy-in for your system. It also contradicts point 3—if no one is immune to bias, why are you the only one allowed an inside view?  
     - **What would have to give:** Either start using base rates for your own planning (making point 1 conditional or obsolete) or allow your team's inside views *if* they demonstrate calibration like yours (but point 5's reliability is already in doubt). Alternatively, justify the double standard rigorously (e.g., "I have 10 years of calibrated estimates; my junior team does not").

  3. **Severity: Low-Medium**  
     **Tension between 4 (no adjustment) and 5 (personal calibration)**  
     - **Why it's less severe:** Point 4 dismisses adjustment because people under-adjust, but point 5 implies you've achieved accurate estimates through what is essentially long-term adjustment (i.e., your calibration came from comparing past inside-view estimates to actual outcomes and refining them). This is more of a technical inconsistency than a core flaw—it doesn't directly break your system, but it suggests your rejection of adjustment might be too absolute.  
     - **What would have to give:** Reframe point 4 to allow for evidence-based adjustment (e.g., "adjustment fails without rigorous calibration") or qualify point 5 (e.g., "my calibration emerged organically; I don't recommend deliberate adjustment").

  ### 3. **The Single Revision That Cleans Up the Most**
  **Apply your reference-class rule (point 6) and base-rate default (point 2) to ALL estimates—including your own—unless rigorous, documented calibration is proven.**  

  **Why this resolves the most:**  
  - **Fixes the high-severity tension (3 vs. 5):** By requiring proof of calibration for any inside-view exception (even for yourself), you uphold epistemic modesty. No one gets a free pass—your self-trust must be validated with data, not just self-assessment.  
  - **Fixes the medium-high tension (1/5 vs. 2):** It eliminates the double standard. You and your team play by the same rules: base rates first, inside view only with evidence. This makes your system fair and consistent.  
  - **Softens the low-severity tension (4 vs. 5):** By tying "adjustment" to proven calibration, you address the loophole where point 5 implicitly endorsed adjustment.  
  - **Preserves your strengths:** Your insights on reference-class laundering (6) and avoiding under-adjustment (4) remain intact, and your team-focused accuracy gains (2) extend to your own work.  

  **How to implement this revision:**  
  - For any project (yours or your team's), start with a pre-defined reference class (per point 6). Use its base rate as the default estimate.  
  - Only deviate to an inside view (decomposition + summing) if:  
    - The estimator (you or a team member) has a track record of calibrated confidence intervals for similar tasks (e.g., past estimates vs. actuals show statistically reliable intervals).  
    - This evidence is documented and reviewed—e.g., you show your team your calibration data for your projects, and they can do the same for theirs.  
  - If no calibration data exists, stick to the base rate. No exceptions.  

  This forces you to "put up or shut up" on personal calibration. If your confidence intervals (point 5) are truly robust, you'll have the data to prove it and can occasionally use your inside view. If not, you default to base rates like everyone else—making your modesty genuine. It also incentivizes your team to improve their estimation skills, as calibration becomes a path to earning autonomy.  

  **Final note:** Your framework is 90% solid—the tensions arise from a single point of self-exemption (point 5). Tightening that not only resolves inconsistencies but also models the humility you want in your team. If you test this revision, track its impact for 6 months (e.g., compare base rates vs. inside-view accuracy for all projects). Good luck—this is better thought-out than most management philosophies!
