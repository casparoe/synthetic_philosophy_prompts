prompt: |-
  Eighteen months ago I was passed over for a promotion I had spent four years working toward, and the panel told me, kindly, that the outcome reflected the strongest claim on merit. This spring I sat on the other side of a panel of the same kind, and we are now drafting the criteria for a search of our own; a colleague has proposed that once we have a shortlist of candidates who are all plainly capable of doing the job, we allocate the post by lottery. I have to take a view on that, and in trying to I have worked myself into an argument that I suspect contains a mistake.

  My starting point is that meritocracy is the view that posts and rewards should go to the people who deserve them, and that desert here is a matter of what someone has made of themselves — the effort, the discipline, the hours — rather than the accident of being quick, or tall, or born to parents who read aloud. On that reading, most of the critical literature I have encountered looks like an extended complaint about measurement error: the tests are noisy, interviews encode class signalling, credentials proxy for parental income. That is a genuine complaint, but it is a technical one, and I cannot see how it gets anyone to the much stronger claim that the arrangement itself is illegitimate.

  So I have tried to build a better argument, and I have been calling it the ratchet. Every unearned advantage a child has — a quiet room, a stable home, decent nutrition, a teacher who happened to notice them — is converted by schools, examiners and selectors into a credential. The credential is then read back as evidence of ability or effort, and because the next round of advantages is allocated on the basis of credentials, the conversion compounds: by mid-career the distance between two people is mostly accumulated accident, but it is inscribed in a CV, and so it presents itself to everyone, including the person who has it, as something earned. If that is right, meritocracy does not merely track desert imperfectly; it manufactures counterfeit desert. It launders luck into a claim of desert, and then recruits the loser's own self-respect to bless the outcome. There is even a historical corroboration: the word was introduced by Michael Young in a satirical dystopia of 1958, as a term of abuse, so people who defend meritocracy are defending something its inventor meant as a warning.

  Put those together and I reach a conclusion I am not comfortable with: that competitive selection is a desert-laundering machine, worse than an open lottery, which at least does not pretend to be tracking anything, and that we should therefore replace it with lotteries among the qualified — the device the lottocracy literature proposes for legislatures, applied to hiring. Where is the false step? My own suspicion is that I have quietly merged merit with desert, and assumed that tracking desert is what selection for a role is even for. But if that is the error, what is the practice for, and does my colleague's lottery actually break the ratchet, or just hide it behind a threshold we still get to set?
reasoning: |-
  Okay, the user is grappling with a complex philosophical and ethical dilemma after being passed over for a promotion. They've developed an argument against meritocracy, calling it the "ratchet effect," where unearned advantages get converted into credentials that are mistaken for merit. This leads them to consider lotteries among qualified candidates as a fairer alternative. But they suspect a flaw in their reasoning and want to identify it.

  First, I need to unpack their argument. The user defines meritocracy as rewarding desert based on effort and discipline rather than innate traits. They critique existing systems for measurement errors but see that as a technical issue. Their deeper concern is the "ratchet" – initial advantages compound over time, turning luck into "counterfeit desert." This makes meritocracy inherently illegitimate, not just imperfect.

  The user concludes that lotteries among qualified candidates are preferable because they don't pretend to measure desert. But they're uneasy, suspecting they've conflated merit with desert. The key questions are: Is desert the goal of hiring? And would a lottery really solve the ratchet problem or just mask it?

  I should analyze potential flaws. First, conflating merit and desert: merit might be about capability to perform the job, not moral desert. If hiring aims to fill roles effectively, desert might be irrelevant. The lottery might not break the ratchet because the qualification threshold still reflects accumulated advantages. Setting that threshold involves the same biases they're trying to avoid.

  The user's deeper needs include resolving their internal conflict after personal disappointment and seeking a fair system. They might also want validation of their critique while understanding its limits. Their colleague's proposal challenges their beliefs, prompting this deep reflection.

  Historical context matters too. Michael Young coined "meritocracy" as satire, so defending it ignores its critical origins. But modern usage might differ. The user needs to separate the term's origins from current practices.

  Possible solutions: Reframe hiring's purpose – is it effectiveness or moral desert? For the lottery, ensure the qualification threshold minimizes bias. Or consider hybrid models. Address structural issues beyond hiring, like early-life advantages.

  The user's suspicion about conflating merit and desert is valid. Hiring is likely about finding the best fit, not rewarding virtue. The lottery doesn't eliminate the ratchet; it just randomizes the final step. The structural inequalities creating the ratchet remain untouched.

  To answer effectively, I should affirm their insight about the conflation, explain hiring's purpose, discuss the lottery's limitations, and suggest addressing root causes. This provides clarity while acknowledging the complexity of their dilemma.
answer: |-
  You've constructed a powerful and insightful critique of meritocracy's dark side – the "ratchet effect" – and your unease likely stems from recognizing a crucial conflation. Your suspicion is correct: **the core flaw lies in merging "merit" (fitness for a role) with "desert" (moral deservingness), and assuming that the *primary purpose* of competitive selection is to reward desert.**

  Here's a breakdown of the false step and its implications:

  1.  **Conflating Merit and Desert:**
      *   **Merit (for a role):** This is fundamentally about *capacity to perform the job effectively and successfully*. It's a forward-looking, functional concept. Does Candidate A have the skills, knowledge, experience, aptitude, and potential to excel in this specific position and contribute to the organization's goals?
      *   **Desert (Moral):** This is a backward-looking, moral concept based on effort, sacrifice, or virtue. "You *deserve* this reward because of the hard work you've put in."
      *   **The Conflation:** Your argument brilliantly shows how systems designed to assess "merit" (capacity) often *misattribute* success solely to personal desert (effort/virtue), laundering luck and privilege into apparent moral deservingness. However, you then implicitly *adopt* the view that the *goal* of selection *should be* to reward desert. This is where the error creeps in.

  2.  **The Mistaken Assumption: The Purpose of Hiring is to Reward Desert:**
      *   Organizations (generally) hire and promote people to *achieve objectives*, not primarily to dispense moral rewards. The core purpose is functional: find the person who can best perform the role, drive innovation, lead teams, solve problems, and contribute to success.
      *   While rewarding effort and achievement is a secondary *benefit* and motivator within a system, it's rarely the *primary rationale* for filling a specific post. Focusing solely on desert ignores the functional necessity of capability.

  3.  **Implications for Your Argument & The Lottery Proposal:**
      *   **The Ratchet Critique Stands:** Your analysis of how meritocracy launders luck into counterfeit desert and reinforces inequality is compelling and largely correct. It exposes a deep ethical flaw in how we *interpret* outcomes and assign moral credit.
      *   **But it Doesn't Invalidate Merit (Capacity) as a Goal:** Recognizing the ratchet doesn't mean that seeking the most capable person for the job is an illegitimate aim *for the organization*. It means the *methods* are flawed and the *interpretation* of outcomes is ethically problematic.
      *   **The Lottery's Effect on the Ratchet:**
          *   **Doesn't Break It:** The ratchet operates long before the final hiring decision. The accumulation of advantage that creates the pool of "qualified" candidates is untouched by the lottery. The CVs, credentials, and experiences that got them onto the shortlist are *still* products of the ratchet, laundered into apparent merit/desert. The lottery simply randomizes the final step *among* this pre-selected, privilege-influenced group.
          *   **Hides It Behind the Threshold (As You Suspect):** The critical ethical burden shifts entirely to **setting the qualification threshold**. Who defines "plainly capable"? How high or low is the bar? What criteria are used? This process is just as vulnerable to measurement error, bias, and the influence of accumulated advantage (reflected in the credentials used to define "capable") as the traditional meritocratic selection process itself. The lottery avoids pretending to discern *degrees* of desert or merit *within* the qualified pool, but it does nothing to address the profound inequalities embedded in *who gets to be qualified* in the first place. The laundering still happens; the lottery just refuses to rank the laundered products.

  **Where Does This Leave You and Your Colleague's Proposal?**

  1.  **Acknowledge the Conflation:** Separate the concepts. The purpose of selection is primarily functional – finding the person with the best capacity to perform the role (merit, defined as fitness). The perception that this *also* rewards desert is often a misleading byproduct of the ratchet effect.
  2.  **The Lottery's Pros and Cons (Reframed):**
      *   **Pros:**
          *   **Reduces Bias in Final Selection:** Eliminates subjective (and often biased) comparisons between seemingly equally qualified candidates.
          *   **Acknowledges Uncertainty:** Recognizes that discerning tiny differences in "merit" (capacity) or "desert" among highly qualified candidates is often impossible or arbitrary.
          *   **Avoids Manufacturing False Desert:** Doesn't pretend the winner was "objectively best" or "most deserving," potentially mitigating resentment and the internalization of failure for losers.
          *   **Promotes Diversity (Potentially):** Can counteract subtle biases that might otherwise sway a panel towards a "traditional" candidate when distinctions are fuzzy.
      *   **Cons:**
          *   **Ignores Potential Differences in Capacity:** Even among the "plainly capable," there might be genuine, discernible differences in specific relevant skills, experience, or potential fit that could impact performance. A lottery ignores these.
          *   **Shifts Bias to Threshold Setting:** The core ethical problem of defining "qualified" remains and might become even more opaque.
          *   **Doesn't Address Root Causes:** Does nothing to dismantle the structural inequalities (the ratchet) that created the uneven playing field leading to the shortlist.
      *   **Functional Risk:** Might result in selecting someone slightly less optimal for the role than another candidate on the list, from a pure performance perspective.
  3.  **Is it Better than the Status Quo?** This depends on your values:
      *   If you prioritize absolute fairness in the *final selection step* among the pre-qualified and want to stop the pretense of pinpoint desert/merit distinctions at that stage, the lottery has merit.
      *   If you believe there are often *meaningful* (even if hard to measure) differences in capacity within the qualified pool that impact organizational success, and that identifying them (imperfectly) is worthwhile, then a traditional selection might be preferable.
      *   If your primary goal is to *attack the ratchet itself*, neither method addresses the fundamental issue of unequal starting points and opportunity hoarding. This requires interventions much earlier (education, social policy) and critically examining how "qualification" itself is defined and credentialed.

  **Conclusion:**

  Your "ratchet" argument is a devastating critique of the *moral pretensions* of meritocracy – how it confuses luck with virtue and launders privilege. **The false step is accepting the premise that hiring *should* be about rewarding desert.** Hiring is primarily about selecting for capacity (merit-as-fitness). The lottery proposal avoids the desert-laundering *at the final selection stage* among the qualified, which is a significant ethical gain. However, it **does not break the ratchet;** it merely **hides it behind the qualification threshold**, which remains susceptible to the same forces of privilege and accumulated advantage. The deeper structural injustices remain untouched by either a meritocratic ranking or a lottery of the qualified. Your colleague's proposal might be a pragmatic step towards fairness *within the flawed system*, but it doesn't solve the core problem you've so eloquently identified.
