  ### Facilitator’s Sheet  
  **Parameters**  
  - **Initial wealth (Gen 1)**: 100 chips.  
  - **Investment returns**:  
    - Safe: ×1.2 (certain).  
    - Risky: Roll d6; 1–3: ×2.0, 4–6: ×0.8 (expected value: 1.4).  
  - **Tax rates**:  
    - Estate tax: Set by vote (initial Gen 1 rate: 0%).  
    - Gift tax: Half the estate tax rate (capped at 50 chips/gift).  
  - **Per-head stake**: Total tax revenue ÷ number of next-gen players.  
  - **Merger**: Non-controller consumes negotiated side payment; controller takes remainder.  

  **Key Sensitivity**  
  The **risky project’s expected return (1.4 vs. safe 1.2)** is most critical. It incentivizes risk-taking, ensuring wealth dispersion reappears even with redistribution.  

  **Setup**  
  - Assign 18 players to 3 lineages of 6. For 4 generations:  
    - Gen 1: Players 1–3 (one per lineage).  
    - Gen 2: Players 4–6.  
    - Gen 3: Players 7–9.  
    - Gen 4: Players 10–12.  
