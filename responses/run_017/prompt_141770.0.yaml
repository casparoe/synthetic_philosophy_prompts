  ### Debrief  
  **Map Game Moments to Key Ideas**  
  1. **"We voted for high taxes, but wealth gaps came back!"**  
     - *Likely participant remark*: "Even with 80% taxes and redistribution, Gen 4 had rich/poor players!"  
     - *Response*: "Yes—redistribution *equalizes starting points* each generation. But why did gaps reappear?"  
     - → **Idea 1**: Equalizing once vs. continuously are different policies. Compounding (via investment choices/thrift) and luck undo one-shot leveling. Continuous levelling makes inheritance tax a permanent, contested claim on family decisions (e.g., mergers to avoid tax).  

  2. **"People merged to dodge taxes—it killed my lineage!"**  
     - *Likely remark*: "We merged to avoid the 50% estate tax, but my child was disinherited!"  
     - *Response*: "How did high taxes change what you passed on? Did the tax base shrink?"  
     - → **Idea 2**: The tax base (wealth transfers) isn’t fixed. High taxes push transfers to untaxed channels (mergers) or capped gifts, reducing revenue and concentrating wealth in fewer households.  

  3. **"The per-head stake let me take big risks!"**  
     - *Likely remark*: "I took the risky project because I knew I’d get a stake next gen even if I failed."  
     - *Response*: "So redistribution acted as a safety net, changing risk-taking? How might that affect equality long-term?"  
     - → **Idea 1/2 combo**: Continuous levelling alters behavior (risk appetite, evasion), which endogenously shapes the wealth distribution and tax base.  

  **Consensus vs. Disputes**  
  - **Settled**:  
    - Wealth compounds; one-time redistribution erodes quickly.  
    - Taxes induce avoidance (mergers/gifts), shrinking the base.  
  - **Disputes**:  
    - Optimal tax rates (empirical: how much avoidance occurs?).  
    - Whether equal opportunity requires equal outcomes or fair processes.  
  - **Warning**: The risky project’s expected value (1.4 > 1.2) assumes risk-neutrality—a contested behavioral claim.  

  **What the Game Misses (Supply in Debrief)**  
  - Parameters are illustrative, not empirical.  
  - Real inheritance taxes interact with capital-income/trust rules.  
  - Equal opportunity includes *ex-ante* prospects (fairness) vs. *ex-post* outcomes.  

  ---

  ### Failure Modes & Fixes  
  1. **Vote collapses to 0% or 100%**:  
     - *Fix*: Require 2/3 majority for rates >50% or <20%.  
     - *Fallback*: Cap rates at 0–70% constitutionally.  

  2. **Dominant dynasty forms; others disengage**:  
     - *Fix*: Limit mergers to one per player. Announce: "Mergers concentrate power—negotiate wisely!"  
     - *Fallback*: In debrief, highlight how mergers mirror real dynastic wealth.  

  3. **Economics students "solve" the game**:  
     - *Fix*: Ask them to role-play (e.g., "Be a risk-averse heir").  
     - *Fallback*: Use their insights to fuel debrief ("You optimized—did others?").  

  4. **Mergers seen as costless**:  
     - *Fix*: Emphasize during rules: "Mergers end a lineage—your child is disinherited!"  
     - *Fallback*: Void mergers that don’t include a side payment.  

  5. **Dice streaks dominate (all luck)**:  
     - *Fix*: Use fewer dice rolls (e.g., lineage-level rolls).  
     - *Fallback*: Debrief: "Luck matters, but institutions amplify/mitigate its effects."  

