  ### Participant Handout (Photocopy Verbatim)

  **Inheritance & Opportunity: A Multi-Generation Game**  
  You are part of a lineage spanning four generations. Your goal is to maximize your *dynastic score*, calculated as:  
  - **Your own consumption**: Full weight (1×)  
  - **Your child’s consumption**: Half weight (0.5×)  
  - **Your grandchild’s consumption**: Quarter weight (0.25×)  
  - **Your great-grandchild’s consumption**: Eighth weight (0.125×)  

  **Setup**  
  - You are assigned a **parent** (who passes wealth to you) and a **child** (to whom you pass wealth).  
  - Initial wealth for Generation 1: **100 chips**. Later generations start with inherited/redistributed wealth.  
  - **Four generations** will be played (you act in your own generation).  

  **Each Generation, Follow These Steps:**  
  1. **Receive Wealth**  
     - Get wealth from your parent (after taxes) and/or a **per-head stake** (redistributed tax revenue).  
  2. **Invest**  
     - Choose one project for your entire wealth:  
       - **Safe**: Guaranteed 20% return (multiply by 1.2).  
       - **Risky**: Roll a die.  
         - 1–3: Double your wealth (100% return).  
         - 4–6: Lose 20% (80% of wealth remains).  
  3. **Consume & Pass On**  
     - **Consume** any amount (whole chips only).  
     - Pass the remainder to your child using **one channel**:  
       - **Estate (at death)**:  
         - Taxed at the current **estate tax rate** (set by vote).  
         - Heir receives after-tax wealth.  
       - **Gift (during life)**:  
         - Taxed at **half the estate tax rate**.  
         - **Capped at 50 chips** per generation.  
         - Heir receives after-tax gift immediately (invest next generation).  
         - Remaining wealth passes via estate (taxed).  
       - **Merger**:  
         - Pool wealth with one other player (same generation).  
         - **Negotiate terms**: Who controls? What side payment (consumption) to the non-controller?  
         - **Irreversible**: Non-controller retires; their lineage ends. Controller takes all wealth.  
         - Untaxed.  

  **Tax Vote**  
  - At the start of each generation, vote by majority to set the **estate tax rate for the next generation’s estates** (e.g., Gen 1 votes for Gen 2’s estates).  
  - **Revenue recycled**: Taxes collected are redistributed equally to all players in the next generation as a per-head stake.  

  **Scoring**  
  - Your dynastic score = Weighted sum of consumption across your lineage (see above).  
  - Record consumption publicly.  

  **Materials**  
  - Poker chips = Wealth.  
  - Dice = Resolve risky investments.  
  - Index cards = Record consumption.  

  **Rules Summary**  
  - No loans or negative wealth.  
  - All decisions final.  
  - Mergers require mutual consent.  

