  For the three stories, each has issues. Original intent (Story 1) can become outdated. Current upkeep (Story 2) might not reflect intent—maintenance is practical, not necessarily endorsement. Public perception (Story 3) changes over time and can be ambiguous. The user's example of a weathered plaque turning into a landmark shows how perception shifts, making honoring fade.

  On street names vs. statues: the user's intuition makes sense. Street names are functional and repeated in daily use, which embeds the name into routine, potentially reinforcing honor. The zero-sum aspect adds weight because choosing one name over others implies selection. Statues, while more visible, can be ignored or become background noise. The cost of renaming streets adds inertia, which might prevent change even if public sentiment shifts. This inertia can blur whether the name still honors or just exists.

  The expiry date idea touches on whether honoring needs renewal to stay genuine. If a commemoration is re-voted, it reflects current values. But if it's automatic, it might lose meaning. However, mandatory re-voting could turn it into a checkbox exercise, draining the sincerity. The key is whether the renewal is driven by genuine intent or bureaucracy.

