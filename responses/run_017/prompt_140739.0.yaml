  ### Handout: Sorting Instrument on the Decline of Violence  

  **Purpose**: This instrument helps clarify your implicit commitments regarding whether the world has become less violent. Answer each question based on your case-by-case judgments—**not** on empirical data (treat all stated trends as suppositions). The goal is to reveal which logical position your answers commit you to, even if you initially identified with a different stance.  

  ---

  #### Part 1: Dimensions of Disagreement  
  Views diverge along these four independent distinctions. Each defines a parameter for measuring "violence":  

  1. **Scope of Violence**  
     What counts as violence? Options:  
     - *Restrictive*: Only direct, bodily harm caused intentionally by an agent (e.g., homicide, assault).  
     - *Expansive*: Includes structural harm (e.g., preventable famine), psychological coercion, or non-human suffering.  
     *Independence*: Does not collapse into other dimensions.  

  2. **Numerator (What is Measured?)**  
     What is counted in the statistic? Options:  
     - *Victims*: Number of deaths/injuries.  
     - *Events*: Number of violent incidents.  
     - *Expected Harm*: Average risk-adjusted harm (e.g., annual battle deaths).  
     - *Tail Risk*: Probability of catastrophic outcomes (e.g., nuclear war).  
     *Independence*: Independent of scope/denominator (e.g., you can count victims of structural violence).  

  3. **Denominator (Exposure Unit)**  
     The baseline against which the numerator is compared:  
     - *Per person-year*: Harm per capita per year.  
     - *Per whole life*: Lifetime risk of experiencing violence.  
     - *Per sub-population at risk*: E.g., young men in conflict zones.  
     - *Per moral patient*: Includes sentient non-humans (e.g., farmed animals).  
     *Independence*: Independent of scope/numerator. *Exception*: If moral patients are included, denominator must expand beyond humans.  

  4. **Temporal Focus**  
     How is the trend assessed?  
     - *Expectation*: Focus on average/expected harm (e.g., mean annual deaths).  
     - *Tail Shape*: Focus on likelihood of extreme events (e.g., 10% risk of a mega-war).  
     *Independence*: Independent of other dimensions.  

  ---

  #### Part 2: Decision Tree  
  Answer each node with **Yes** or **No**, based on the case. Do not skip ahead.  

  1. **Q1 (Case g: Famine)**  
     *A famine results from trade policies and withheld aid; no physical blows are struck. Is this famine an instance of violence?*  
     - **Yes** → Q2  
     - **No** → Q3  

  2. **Q2 (Case d: Animals)**  
     *Billions more animals are now slaughtered annually for food per human consumer than in 1900. If animals can suffer, are these killings instances of violence?*  
     - **Yes** → Q4  
     - **No** → Q5  

  3. **Q3 (Case a: Threat)**  
     *State A credibly threatens to destroy State B’s city; the invasion never occurs. Is this threat itself an instance of violence?*  
     - **Yes** → Q6  
     - **No** → Q7  

  4. **Q4 (Denominator: Moral Patients)**  
     *When assessing violence trends, should the denominator include all sentient beings (e.g., humans + animals), not just humans?*  
     - **Yes** → **Leaf A**  
     - **No** → Q8  

  5. **Q5 (Case b: Lifetime Risk)**  
     *Suppose the annual risk of violent death holds steady at 1%, but life expectancy doubles. The lifetime risk of violent death therefore rises from ~10% to ~20%. Has violence declined?*  
     - **Yes** (annual risk matters) → **Leaf B**  
     - **No** (lifetime risk matters) → **Leaf C**  

  6. **Q6 (Case c: Imprisonment)**  
     *Homicide rates fall sharply, but imprisonment rates rise tenfold, and prison violence is endemic. Has overall violence declined?*  
     - **Yes** → Q9  
     - **No** → **Leaf D**  

  7. **Q7 (Case e: Tail Risk)**  
     *Expected annual battle deaths fall by 50%, but the probability of a conflict killing >1 billion people rises from 0.1% to 1%. Has overall violence declined?*  
     - **Yes** → **Leaf E**  
     - **No** → **Leaf F**  

  8. **Q8 (Case f: Concentration of Harm)**  
     *Today, one airstrike kills 500 people. In 1800, 500 deaths occurred in 500 separate skirmishes. If the annual death toll is identical, is violence lower today?*  
     - **Yes** → Q10  
     - **No** → **Leaf G**  

  9. **Q9 (Case h: Sub-Population)**  
     *The overall homicide rate falls, but the rate among young men in border conflict zones remains unchanged. Has violence declined?*  
     - **Yes** → **Leaf B**  
     - **No** → **Leaf H**  

  10. **Q10 (Absolute Counts)**  
      *The homicide rate per 100,000 people falls by 30%, but population growth causes the absolute number of victims to rise by 20%. Has violence declined?*  
      - **Yes** → **Leaf I**  
      - **No** → **Leaf J**  

  ---

  #### Part 3: Cases Used in Nodes  
  Six nodes derive from your required cases:  
  - **Q1**: Case g (famine without blows)  
  - **Q2**: Case d (rise in animal slaughter)  
  - **Q3**: Case a (unfulfilled threat)  
  - **Q5**: Case b (lifetime risk vs. annual risk)  
  - **Q6**: Case c (imprisonment vs. homicide)  
  - **Q7**: Case e (tail risk vs. expected harm)  
  - **Q8**: Case f (concentration of harm)  
  - **Q9**: Case h (sub-population risk)  

  Additional nodes (Q4, Q10) cover denominator scope and absolute counts.  

  ---

  #### Part 4: Labelled Leaves  
  Each leaf specifies: (1) a position name, (2) its most awkward commitment, (3) the minimal path to reach it.  

  - **Leaf A: Moral-Patient Expansionism**  
    *Commitment*: Violence has sharply increased because animal suffering outweighs reductions in human violence.  
    *Path*: Q1: Yes → Q2: Yes → Q4: Yes  

  - **Leaf B: Straightforward Declinism**  
    *Commitment*: Falling per-person-year rates of direct bodily harm suffice to show decline—even if lifetime risk or absolute victim counts rise.  
    *Path*: Q1: No → Q3: No → Q7: Yes *or* Q1: Yes → Q2: No → Q5: Yes *or* Q1: No → Q3: Yes → Q6: Yes → Q9: Yes  

  - **Leaf C: Lifetime Risk Pessimism**  
    *Commitment*: Longer lifespans increase cumulative exposure to violence; declining annual rates are irrelevant.  
    *Path*: Q1: Yes → Q2: No → Q5: No  

  - **Leaf D: Displacement Scepticism**  
    *Commitment*: Apparent declines in violence are artefacts of it being outsourced (e.g., to prisons) or deterred (threats held in reserve).  
    *Path*: Q1: No → Q3: Yes → Q6: No  

  - **Leaf E: Expectation Declinism**  
    *Commitment*: Falling expected harm proves decline—even if tail risks (e.g., extinction threats) worsen.  
    *Path*: Q1: No → Q3: No → Q7: Yes  

  - **Leaf F: Tail Risk Reversal**  
    *Commitment*: Rising catastrophic risks make the world more violent, even if expected annual harm falls.  
    *Path*: Q1: No → Q3: No → Q7: No  

  - **Leaf G: Event Concentration Pessimism**  
    *Commitment*: Concentrated harm (e.g., bombing) is intrinsically worse than diffuse harm—so violence rises even if victim counts don’t.  
    *Path*: Q1: Yes → Q2: Yes → Q4: No → Q8: No  

  - **Leaf H: Sub-Population Absolutism**  
    *Commitment*: Violence has not declined if high-risk groups (e.g., borderland youth) see no improvement.  
    *Path*: Q1: No → Q3: Yes → Q6: Yes → Q9: No  

  - **Leaf I: Rate Declinism**  
    *Commitment*: Falling *rates* (per capita) prove decline—even if absolute victim numbers rise.  
    *Path*: Q1: Yes → Q2: Yes → Q4: No → Q8: Yes → Q10: Yes  

  - **Leaf J: Absolutism About Absolute Counts**  
    *Commitment*: Rising absolute victim numbers mean violence has increased—even if rates fall.  
    *Path*: Q1: Yes → Q2: Yes → Q4: No → Q8: Yes → Q10: No  

  - **Leaf K: No Fact of the Matter (Unnamed)**  
    *Commitment*: "Violence" is an essentially contested concept; no single trend exists (*distinct from epistemic uncertainty about data*).  
    *Path*: *Not captured in this tree—see Diagnostics*.  

  ---

  #### Part 5: Diagnostics of the Space  
  - **Unoccupied Combinations**:  
    - *Scope: expansive (including animals) + Denominator: per sub-population at risk*.  
      **Verdict**: Incoherent (sub-populations cannot include non-humans without ad hoc criteria).  
    - *Numerator: tail risk + Denominator: per moral patient*.  
      **Verdict**: Unexplored (no literature integrates extinction risk with animal suffering).  
    - *Temporal focus: tail shape + Scope: restrictive*.  
      **Verdict**: Unattractive (ignores structural drivers of catastrophe).  

  - **Limitations of Instrument**:  
    - **Leaf K (No Fact of the Matter)** is unreachable. *Reason*: The tree assumes violence is measurable; to reach Leaf K, add a pre-question: *"Can 'violence' be quantified as a single trend?"* (Yes → Proceed; No → Leaf K).  
    - **Order Dependence**: Q5 (lifetime risk) may bias later answers. *Rephrasing*: Anchor to a concrete choice: *"Would you prefer to live in Era A (1% annual violence risk, 40-year lifespan) or Era B (0.5% annual risk, 80-year lifespan)?"*  
    - **Ambiguous Node**: Q2 (animals) is vulnerable to signalling. *Rephrasing*: *"In an abattoir, is the act of killing an animal for food—absent unnecessary cruelty—an instance of violence?"*  

  - **Most Mis-Answered Node**: **Q3 (Threat)**. Participants who endorse deterrence theory often reflexively say "violence prevented" (No) to align with declinism, even if their other answers imply threats *are* violence.  

