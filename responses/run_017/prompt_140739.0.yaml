  2. **Numerator (What is Counted)**: What is measured in the numerator of the rate? Options include:
     - Victims (e.g., deaths, injuries).
     - Events (e.g., wars, assaults).
     - Expected harm (e.g., risk-adjusted harm).
     - Tail risk (e.g., probability of catastrophic events).
     - Note: This is independent of the scope because one can count victims of structural violence or events of direct violence.

  3. **Denominator (Exposure Unit)**: Against what is the numerator normalized? Options include:
     - Per person-year (i.e., per capita per year).
     - Per whole life (i.e., lifetime risk).
     - Per sub-population at risk (e.g., young men in conflict zones).
     - Per moral patient (e.g., including non-human animals).
     - Note: This dimension is independent of the numerator and scope.

  4. **Temporal Focus**: Over what time frame and how is the trend assessed? Options include:
     - Expectation (average harm over time).
