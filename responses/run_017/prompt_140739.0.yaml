  ### Part 1: Dimensions of Disagreement
  We identify five independent dimensions along which views on the decline of violence may diverge. Note that some dimensions might be correlated but we are treating them as logically independent unless stated.

  1. **Scope of Violence**: What counts as an instance of violence? Options include:
