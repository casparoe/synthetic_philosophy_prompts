  ### Scenario and Analysis
  **Scenario and p:** Dr. Evans, a seasoned meteorologist, knows that a storm is approaching her town (p: "a storm is approaching") based on her expert analysis of real-time satellite data and atmospheric models. However, due to a recent trauma from a storm-related accident, she experiences a psychological dissociation that prevents her from forming the corresponding belief, despite her epistemic certainty and professional reliance on p for safety warnings. She acts decisively on p (e.g., issuing alerts) but introspectively reports no felt conviction.

  **Mechanism:** **Trauma-induced doxastic dissociation**—a psychological barrier severs the cognitive recognition of evidence (yielding knowledge) from the doxastic attitude of belief. This is not hesitant belief, as there is no credence toward p; her certainty is purely intellectual and action-guiding, devoid of subjective endorsement. Analogous to grief impairing acceptance of loss, the dissociation is involuntary and affects only the affective component of belief formation.

  **Constraint Check:**
  - **Knows p:** Reliabilist knowledge (externalist): her analysis is a reliable process producing true, justification-backed judgment, independent of belief.
  - **Lacks belief p:** Dissociation blocks the attitude of assent; she has zero subjective commitment to p, not merely weak will or partial belief.
  - **Blamelessness:** Trauma arose unpreventably; she diligently reviewed all data and acted responsibly—no epistemic negligence.
  - **Third-personal felicity:** Colleagues naturally say, "Evans knows a storm approaches but doesn’t believe it," noting her expert certainty clashing with emotional detachment.
  - **First-personal absurdity:** Uttering "A storm approaches, but I don’t believe it" sounds absurd—it clashes with her authoritative assertion of p, creating pragmatic incoherence.

  **Verdicts:**
  - **Doxastic account:** Falters; no irrational attitude conflict exists (she truly knows without believing), so it cannot explain the absurdity.
  - **Knowledge norm of assertion:** Permits asserting p (she knows it) but cannot explain the absurdity of conjoining with "I don’t believe it," which she also knows (via introspection).
  - **Commitment account:** Wins; asserting p commits her to p and represents her as believing it, so conjoining with "I don’t believe p" creates a commitment conflict—undermining her authority.

  **Load-Bearing Feature:** **Knowledge without belief**—the dissociation enables blameless knowledge (via expertise) while blocking belief formation. This pressures the doxastic account by decoupling the paradox’s absurdity from attitudes.

  **Ablation:** If this feature is removed (e.g., she believes p), the case collapses into **standard self-deception**: she believes p but denies it irrationally, making the doxastic account’s attitude-conflict explanation applicable. Absent dissociation, trauma might cause unwarranted doubt or partial belief, restoring doxastic coherence.

  **Best Doxastic Reply:** **Assertion expresses belief constitutively**, so her act of asserting p entails she believes p, rendering the second conjunct false or insincere—thus, the absurdity arises from misrepresenting her own mind, not attitude incoherence. This avoids denying knowledge-without-belief by reframing the utterance as performatively inconsistent, not psychologically impossible. It is stronger than "knowledge entails belief" because it leverages pragmatic norms of assertion to undermine the case’s setup while accepting externalist knowledge, making the reply harder to dismiss as question-begging.

