  Hmm... their core puzzle seems to be: Why do hybrid systems like Singapore bother with elections if their claim rests purely on results? That's the hinge question. And the follow-up about whether legitimacy is just "people aren't revolting" dressed up - that cuts to the bone of political philosophy.

