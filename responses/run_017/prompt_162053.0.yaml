  What's refreshing is how they demand we separate what the practice strictly presupposes from what's merely compatible. That's academic rigor. They're essentially asking for a reverse-engineering of governance operating systems.

  The Singapore example complicates neatly - elections as information channels rather than authorizations. That might be the key distinction: whether votes are treated as data points versus sacred consent. And the zero-COVID case in China shows how regimes prioritize different metrics situationally, revealing the hierarchy of legitimating claims.

  For structure, I'll need to: 
