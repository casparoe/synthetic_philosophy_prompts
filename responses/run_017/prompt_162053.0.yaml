answer: |-
  Your analysis cuts to the core tensions in performance legitimacy theory. Let's reconstruct the implicit presuppositions, contradictions, and philosophical underdeterminacies in the China/Singapore model:

  ### Core Presuppositions (Non-Negotiable Foundations)
  1.  **Epistemic Authority of the Ruler:** The regime possesses superior capacity to identify and pursue the "correct" goals (development, stability, welfare) compared to alternatives (including democratic deliberation). This presupposes *objective societal interests* exist and are knowable by the regime.
  2.  **Effectiveness as Necessary Condition:** Delivering tangible, measurable outcomes (growth, order, services) is a *necessary* foundation for legitimacy. A regime failing demonstrably on its own metrics loses its core claim.
  3.  **Instrumental View of Politics:** Governance is fundamentally a problem of *effective management and problem-solving*, not intrinsic procedural values or expressive representation. Politics is technocratic at its core.
  4.  **Paternalistic Trusteeship:** The ruler acts as a trustee for the people's *true interests* (which they may not fully perceive or prioritize correctly themselves). Legitimacy flows from competent stewardship of this trust.
  5.  **Systemic Stability as Paramount:** Maintaining social order, preventing chaos, and ensuring regime continuity are overriding priorities, often implicitly valued above individual rights or procedural fairness.

  ### Underdetermined Elements (Compatible with Multiple Theories)
  6.  **The Role of Elections (Singapore-Specific):** This is the critical puzzle. Practice is philosophically ambiguous:
      *   **Information Channel Hypothesis:** Elections serve as a high-stakes opinion poll/social barometer, providing aggregated feedback on satisfaction and revealing policy failures or discontent *before* they threaten stability. It's a measurement tool, not authorization.
      *   **Hypothetical Consent/Safety Valve:** Winning elections demonstrates *ex post* acceptance of outcomes, simulating consent. Losing votes signals a need for corrective action to *maintain* the appearance of performance-based consent and prevent deeper instability.
      *   **Minimal Procedural Anchor:** A concession that *some* procedural element (however constrained) is pragmatically necessary for stability and international acceptance, without conceding it's the *source* of legitimacy.
  7.  **Justification of Outcomes:** *Why* are the specific outputs (growth, stability, HDB flats) legitimizing?
      *   **Consequentialist/Welfarist:** They demonstrably improve aggregate welfare/utility.
      *   **Hypothetical Consent:** Rational individuals *would* consent to rule delivering these results.
      *   **Nationalist/Communitarian:** These outputs serve the nation's collective destiny, strength, or historical mission (the "China Dream," Singapore's survival).
      *   **Evidence of Virtue:** Success proves the regime's competence, dedication, and moral superiority (anti-corruption drives, "meritocratic" PAP).

  ### What the Practice Rules Out
  8.  **Pure Proceduralism:** Legitimacy derived *solely* from fair processes (free/fair elections, rule of law protecting dissent) is explicitly rejected as insufficient or even destabilizing. Outcomes trump process.
  9.  **Popular Sovereignty as Authorization:** The "will of the people" expressed through free choice *creates* authority. Performance regimes see popular will as something to be *shaped*, *measured*, and *managed*, not obeyed as sovereign. Elections (where they exist) are not primarily about authorization.
  10. **Strong Rights-Based Liberalism:** Individual rights (especially political/civil liberties) are not inherent sources of legitimacy constraints; they are potentially subordinate to collective outcomes and stability. Rights are granted/recognized instrumentally by the regime where useful, not prior to it.
  11. **Charismatic/Traditional Legitimacy (as Sole Basis):** While historical narratives ("history chose the CCP") or anti-corruption as moral renewal are used, they are *always* coupled with performance claims. Purely traditional or charismatic claims are insufficient.

  ### Addressing Your Specific Puzzles
  *   **The Auditor Problem (Goodhart's Law):** The practice *presupposes* either:
      *   **Regime Benevolence/Competence:** The regime is genuinely committed to the *real* goals (societal welfare) and uses metrics as imperfect but good-faith proxies, self-correcting against manipulation. Trust in official numbers is axiomatic within the system.
      *   **Social Stability as Ultimate Metric:** Even if metrics are gamed, the *appearance* of success and the suppression of dissent maintain stability, which is the regime's core performance goal. Legitimacy, in this cynical view, *is* the absence of revolt. The practice is vulnerable here, relying heavily on trust in the regime's honesty – a vulnerability it cannot internally resolve.
  *   **The Colonial Administrator/AI Hypothetical:** **This exposes the core tension.** The practice's *strict output logic* suggests **Yes, it is legitimate**. If it delivers objectively superior results on all measurable welfare/order criteria, the regime *should* be legitimate according to its own core claim. However, the practice *implicitly* recoils from this conclusion because it **presupposes shared identity/membership**. The colonial/AI ruler is fundamentally *alien*. The "trusteeship" model requires the ruler to be *of* the people (even if an elite vanguard like the CCP) or acting for their *recognized* benefit within a shared national project. An external administrator or AI lacks this essential bond. **The practice secretly smuggles in communitarian/nationalist premises alongside pure consequentialism.**
  *   **The Ratchet Problem (Losing Legitimacy):** The theory *explicitly* states that failing performance erodes legitimacy. However, the practice *presupposes*:
      *   **Regime Monopoly on Legitimate Force:** Only the regime has the power to *enforce* the consequences of lost legitimacy (its own removal). There is no independent enforcer.
      *   **"Founder's Mandate"/System Inertia:** Successor regimes inherit legitimacy built by founding achievements (PAP's early nation-building, CCP's revolution). Losing legitimacy means failing *relative to this inherited standard*, but the system itself is presumed permanent unless catastrophic failure occurs.
      *   **No Viable Alternative:** The regime actively suppresses alternatives, making the cost of revolt (chaos, unknown outcomes) seem higher than enduring declining performance. Legitimacy erosion is managed downward until potential instability triggers adaptation (Singapore) or repression (China).
  *   **Swapping the Implicit Theory:**
      *   **Procedural Consent View:** Would require dismantling the core premise. China: Genuine multi-party elections, independent judiciary protecting dissent, free media. Singapore: Relaxing GRCs, removing libel laws chilling opposition, truly free media. Both would fundamentally alter the regime's character, shifting legitimacy *source* to process and making performance a *consequence* of legitimacy, not its source.
      *   **Flat Welfarism:** Less radical change, but still significant. Focus shifts purely to maximizing aggregate welfare metrics (even potentially unpopular ones like high immigration for GDP). Nationalist rhetoric, historical claims, and moral renewal narratives become redundant or weakened. Singapore already leans closest here. China would need to depoliticize metrics (e.g., environmental goals overriding SOE stability) and downplay ideology in favor of pure cost-benefit analysis.

  ### Conclusion: The Hybrid & Fragile Core
  Performance legitimacy is **not pure consequentialism**. It's a **hybrid theory** resting on:
  1.  **Consequentialist Foundation:** Effectiveness is necessary.
  2.  **Communitarian/Nationalist Underpinning:** Shared identity and the ruler's embeddedness within the governed community are essential (ruling out the Alien Administrator).
  3.  **Paternalistic Trusteeship:** The ruler knows best the people's true interests.
  4.  **Stability as Meta-Goal:** Order enables delivery and is the ultimate performance metric.

  **The Singapore election** functions primarily as an **information channel and stability valve** within this framework, not as authorization. It signals performance gaps requiring technocratic correction to maintain the core output-based claim and the communitarian bond. It presupposes the PAP's fundamental right to rule but acknowledges the need for responsiveness *within* that framework.

  The practice is **philosophically underdetermined** regarding the *ultimate justification* of the specific outcomes and the precise weight of the communitarian element versus pure welfare. However, it **strictly rules out** proceduralism and popular sovereignty as primary legitimacy sources. Its greatest vulnerability is the **Auditor Problem** – it presupposes its own truthfulness in measuring the very performance that justifies it, creating an inherent fragility masked by control over information and coercion.
