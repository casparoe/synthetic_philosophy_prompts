answer: |-
  ## Problem Set Question: Foundations of Sunk Costs (20 Marks)

  **Scenario:** Dr. Aris Thorne has invested $5 million and 2 years developing "Nostopril," a drug for a rare disease. After Phase II trials, Thorne receives definitive, unquestionably accurate data: Completing Phase III trials will cost an *additional* $2 million but has a 0% chance of regulatory approval or future revenue. Continuing yields *no* benefit – scientific, reputational, personal satisfaction, or otherwise – and consumes resources usable elsewhere. Thorne *knows* this with absolute certainty. No one else (rivals, funders, the public) is aware of the project or its status. Stopping frees resources for other valuable work. Persistence cannot influence Thorne's future decisions or willpower; it sets no precedent for any future self or copy.

  **Question:** Dr. Thorne argues: "I *must* continue. $5 million and 2 years cannot be for nothing! Abandoning now makes that initial investment a *total* waste. Continuing, even knowing the Phase III outcome, at least *honors* that past effort and expenditure." Analyze Thorne's reasoning. Given the stipulated impossibility of informational, signaling, or commitment-based justifications:
  (a) What fundamental decision-theoretic axiom renders honoring sunk costs *necessarily* irrational under standard rational choice theory? Explain its role. (4 marks)
  (b) Is the principle "Ignore sunk costs" a *logical theorem* (like Dutch book avoidance), a *contingent empirical claim* about human psychology, or something else? Justify your answer. (6 marks)
  (c) Describe a specific, coherent *structure of preferences* or *decision procedure* under which Thorne's insistence on honoring the sunk cost could be considered a *permissible* (i.e., internally consistent and non-exploitable) choice, even in this scenario. Explain why standard axioms fail to constrain this structure/procedure. (6 marks)
  (d) Briefly state what this implies about the normative scope of the sunk cost principle. (4 marks)

  ---

  ## Model Answer (Approx. 850 words)

  **(a) The Fundamental Axiom: Temporal Separability of Utility (4 marks)**
  The core axiom rendering sunk cost considerations irrational under standard rational choice theory is the **Temporal Separability of Utility (TSU)**. TSU asserts that the utility (value, desirability) of a future state of the world depends *only* on the attributes of that future state itself. Past events, including prior investments of resources, effort, or emotional capital, have *no direct bearing* on the utility assigned to a future outcome. They can only matter indirectly if they *causally alter* the feasible set of future options or the probabilities/utilities of their consequences (e.g., past learning informs future estimates). Crucially, TSU implies that the *history* leading to a state is irrelevant; only the state's *intrinsic properties* matter for evaluation.

  In Thorne's scenario, TSU is violated by his reasoning. He assigns *additional* disutility to futures where the past $5M/2yr investment is labeled a "total waste" compared to futures where it is "honored" by continuation, *even though the physical outcomes and resource positions from the present moment onward are identical in all relevant respects*. The past expenditure is causally inert – it doesn't change the cost/benefit profile of continuing vs. stopping now. TSU demands that only the *forward-looking consequences* of the current choice (burning an extra $2M for zero gain vs. saving $2M for other uses) determine its rationality. By allowing the *sunk* cost to directly influence the valuation of the *future* states ("waste" vs. "honor"), Thorne violates TSU. The sunk cost fallacy arises precisely when preferences fail to satisfy this separability, imbuing sunk expenditures with persistent, non-causal weight.

  **(b) The Status of the Principle: A Corollary of Axioms, Not a Theorem or Mere Empirical Claim (6 marks)**
  The principle "Ignore sunk costs" is **not a fundamental logical theorem** like the axioms of probability or the avoidance of Dutch books. Nor is it *merely* a contingent empirical claim about human error. Instead, it is a **corollary derived from more fundamental axioms** of rational choice, primarily TSU and the principle of **Consequentialism** (decisions should be based solely on the *consequences* of available actions).

  *   **Why not a fundamental theorem?** There is no inconsistency akin to accepting dominated bets or violating probability axioms if an agent incorporates sunk costs *provided* their utility function violates TSU. An agent who intrinsically values "not wasting past effort" or "completing initiated projects" as a terminal goal isn't logically incoherent in the same way as an agent accepting a sure loss. Their "irrationality" stems from violating the *specific normative axioms* (TSU, pure consequentialism) assumed by standard theories like Expected Utility (EU), not from inherent logical contradiction.
  *   **Why not merely empirical?** While humans demonstrably *do* fall prey to the sunk cost fallacy empirically, the principle has a strong *normative* foundation within its axiomatic framework. Given the axioms of EU (ordering, continuity, independence, and crucially, consequentialism implying TSU), ignoring sunk costs is a *necessary implication*. To violate it *while claiming adherence to standard EU axioms* is contradictory. However, the principle's normative force is entirely *conditional* on accepting those specific axioms as binding for rationality.

  Therefore, the sunk cost principle is best understood as a **normative corollary within a specific theoretical framework** (standard rational choice/ EU theory). Its validity rests on the prior acceptance of TSU and consequentialism as defining aspects of rationality. If one rejects those axioms as universally necessary for rationality, the principle loses its absolute normative force and becomes a pragmatic heuristic or a claim about instrumental efficiency within specific preference structures.

  **(c) Permissible Preference Structures/Procedures: History-Dependent Utility (6 marks)**
  A coherent structure where Thorne's choice could be permissible is a **History-Dependent Utility Function**. This explicitly violates TSU by defining utility over *paths* or *narratives*, not just final states or state sequences from the present. The past expenditure becomes an argument in the utility function itself.

  *   **Specific Example:** Thorne might have a utility function of the form:
      U(Path) = V(Future Resources) - θ * I(Abandoned) * (Sunk Cost)
      Where:
      *   `V(Future Resources)` is a standard function valuing future resource levels (e.g., $10M - $2M spent = $8M if stop; $10M - $7M spent = $3M if continue).
      *   `I(Abandoned)` is an indicator function = 1 if the project is abandoned *after* significant investment, 0 otherwise.
      *   `θ` is a scaling factor >0 representing the *intrinsic disutility per unit of "wasted" sunk cost*.
      *   `Sunk Cost` represents the magnitude of the sunk investment ($5M + value of 2 years).
      Crucially, `θ * I(Abandoned) * (Sunk Cost)` depends *directly* on the sunk cost and the act of abandonment, not just future resources. Even if `V($8M) > V($3M)`, a sufficiently large `θ` could make `U(Stop) = V($8M) - θ*1*($5M+2yr) < U(Continue) = V($3M) - θ*0*($5M+2yr) = V($3M)`. Continuing minimizes the disutility from "waste".

  *   **Why Permissible?** This utility function is coherent. Preferences defined over whole paths are complete and transitive. Given this utility function, choosing to continue *maximizes expected utility* under certainty. There is no arbitrage or dynamic inconsistency *forced* by this structure alone. An external observer calling it "irrational" is simply imposing their own axiom (TSU) that Thorne rejects. Thorne consistently acts to minimize a feeling of waste he intrinsically dislikes.

  *   **Why Standard Axioms Fail to Constrain This:** Standard EU axioms (like Savage's or von Neumann-Morgenstern) assume preferences are defined solely over *outcomes* (consequences) or *prospects* (probability distributions over consequences), implicitly assuming the irrelevance of causally inert history (TSU). The Independence Axiom directly conflicts with history-dependence. The framework Thorne uses **rejects the Consequentialist Axiom** underpinning standard EU. His "consequence" of stopping *includes* the property "involved wasting $5M and 2 years," while continuing has the property "honored the past investment," even though the physical resource flow from *now* is identical in both paths up to the extra $2M expenditure. Standard axioms rule this out by fiat; Thorne's permissible structure exists outside that axiomatic boundary.

  **(d) Normative Scope: Preference-Dependent, Not Universal (4 marks)**
  This analysis implies the sunk cost principle ("ignore sunk costs") has **limited normative scope**. It is a *conditional* imperative: *If* an agent accepts Temporal Separability of Utility and Consequentialism as defining axioms of rationality, *then* honoring sunk costs is irrational. However, it is *not* a universal law of practical reason. For agents whose fundamental preferences *intrinsically* value narrative coherence, commitment to past choices, avoidance of "waste" as an end in itself, or other history-dependent properties, honoring sunk costs can be the *rational* choice within *their own* coherent preference structure. The principle is a powerful tool within the specific normative framework of separable, consequentialist rational choice, but it cannot categorically condemn all possible agents who weigh the past in their present decisions. Its normative force is relative to the acceptance of its underlying axioms.

  ---

  ## Marking Scheme (20 Marks Total)

  | **Must-Hit Move**                                     | **Marks** | **Common Errors (How Students Get It Wrong)**                                                                 |
  | :---------------------------------------------------- | :-------: | :------------------------------------------------------------------------------------------------------------ |
  | **1. Correctly identifies Temporal Separability (TSU)** as the key axiom violated & explains its meaning (only future state properties matter for utility). | **4**     | Vaguely mentions "forward-looking" without naming TSU or misattributes it to e.g., Independence Axiom.        |
  | **2. Correctly characterizes the sunk cost principle** as a **corollary of axioms (TSU/Consequentialism)**, **not** a fundamental theorem or mere empirical fact; explains *why* it’s not fundamental (no inconsistency without TSU) and *why* it’s not merely empirical (normative force within its axioms). | **6**     | Calls it a "theorem" like Dutch booking; or treats it *only* as a psychological observation without normative basis. |
  | **3. Proposes a coherent, preference-based justification** (e.g., history-dependent utility/narrative preferences) **that doesn’t rely on excluded factors** (info, signaling, commitment). Explains *how* it violates TSU/Consequentialism. | **6**     | Silently reintroduces excluded factors (e.g., "Maybe Thorne doubts the data"). Proposes incoherent preferences or confuses permissibility with advisability. |
  | **4. Explicitly states the permissibility is relative to the agent's preference structure** and that standard axioms *assume* TSU/consequentialism, thus don't apply. | **(Embedded in 2 & 3)** | Implies honoring sunk costs is *always* irrational or *always* permissible, failing to see the axiom-dependence. |
  | **5. Concisely articulates the limited normative scope** in (d): Principle is binding only *if* accepting standard (TSU/Consequentialist) axioms. | **4**     | Restates the standard answer ("only future costs matter") without meta-reflection, or overgeneralizes the permissibility claim. |

  **Additional Notes:** Award marks proportionally for partial success on each move. Clarity, precision, and adherence to the scenario's strict stipulations are crucial. Penalize severely for reintroducing excluded factors or confusing normative rationality with personal opinion ("I think it's stupid").
