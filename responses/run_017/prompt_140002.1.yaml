prompt: |-
  I'm in the eleventh grade, and for an independent project I'm trying to build what my supervisor calls a decision procedure: a short field guide that my class could actually use to rule on anything anyone hands us, and say whether it is alive. The purpose is fixed in advance. I do not need the guide for cats, oak trees, or the bacteria on a petri dish in the lab cupboard, because everyone already agrees about those. I need it for the cases where nobody agrees: things assembled in a lab, samples a rover might bring back, self-copying computer programs, industrial chemical processes, and whatever else turns up that nobody has seen before. Before I read any more of the proposed definitions of life, I'd like the specification that such a definition is supposed to meet.

  So please write out the desiderata for an account of what it is to be living, given that purpose: the cases it has to get right, the distinctions it must not collapse, the results from biology and chemistry it is not allowed to contradict, and the features it must have as a test rather than as a slogan. For each requirement give the case or consideration that makes it a requirement, and mark which are non-negotiable and which are really preferences of one camp dressed up as requirements. I care much more about the list and about why each item is on it than about any scoring of existing theories.

  The cases I keep coming back to, and which I think any account has to say something about, are these: an individual that is plainly alive but can never have offspring of its own; a seed or spore in which essentially no chemistry happens for centuries or millennia and which then starts up again; a forest that is one individual spread over many acres, linked underground, while also shedding parts that live on their own; a computer worm on a school network that copies itself, mutates, and sheds functions nobody needs; a factory process that consumes fuel, grows, and produces waste, but produces nothing that inherits anything from it; a laboratory cell that runs its own chemistry but can only reproduce by sending instructions to a machine it neither built nor can repair.

  The distinctions I don't want collapsed are: being alive versus being a part of something alive; being alive versus being a product of something alive; whether a thing is alive at all versus how much it counts or how alive it is; reproducing versus merely being copied by something else; and having a function or a purpose versus merely happening to be useful to something.

  I've also made up three cases for the project, and I'd like them treated as real constraints on the account rather than as jokes. The Rental: a creature that maintains itself and reproduces, but every component of it, including its outer boundary and the machinery that copies its instructions, is manufactured by a different organism living inside it; separated from that partner it does nothing at all. The Library: a creature whose young develop into the right body only if raised within a structure the parent builds, where the shape of that structure rather than the parent's genetic material carries most of the information about the body's layout, where the shape is rebuilt slightly differently each generation, and where those differences are passed on. The Twin Ladder: a lineage that must alternate, one generation multiplying by splitting and the next only by exchanging material with another individual, where neither method alone can carry the line more than one step. For each of the three, tell me what a candidate definition is committed to saying, and whether you think that is the right thing to say.

  Two further things I specifically want. First: I suspect that two requirements people usually demand are in tension, namely that the account must not simply be reverse-engineered from a list of the organisms we already call alive, and that it must of course agree with us about those organisms. If that tension is real, make it precise and tell me what has to be given up; if I'm just muddling two different things, say so and explain the difference. Second: tell me which single requirement, of the ones you defend, excludes the largest number of the definitions currently on offer, including the popular style that defines life as something like self-maintaining chemistry that can evolve by natural selection. Say which way of thinking it rules out and why that is a point in the requirement's favour rather than a reason to weaken it.

  Finally, on how I'd like you to answer: please commit. Give me the list you would actually stand behind, argue for it, and where you have to make a judgment call, make it and say why rather than laying out the options and leaving me to choose. If you had to drop one desideratum from your own list, say which and why, and say which part of your answer you take to be most open to reasonable disagreement. A binary verdict may or may not be what the guide should output; if your own desiderata settle that question, say which way they settle it.
reasoning: |-
  Okay, the user is an eleventh-grade student working on an independent project to create a decision procedure—a field guide—for determining if something is alive, especially for borderline cases. They've provided several challenging examples and distinctions they want the guide to handle. Let me unpack their requirements.

  First, the core purpose: the guide must definitively rule on ambiguous cases like lab creations, Mars samples, computer programs, or chemical processes. Common examples like cats or bacteria aren't the focus. The user needs a set of criteria that can handle these edge cases without contradiction.

  The user listed specific cases: sterile individuals, dormant seeds, clonal forests, computer worms, self-sustaining factories, and lab cells. Each tests different aspects—reproduction, metabolism, autonomy, information transfer. The distinctions to maintain include part vs. whole, alive vs. product, binary verdict vs. degree, reproduction vs. copying, and purpose vs. accidental utility. These are crucial to avoid muddying categories.

  Their three invented scenarios add complexity. The Rental tests dependency and autonomy—can something be alive if entirely maintained by another organism? The Library challenges where hereditary information resides (environment vs. genetics). The Twin Ladder examines reproduction requiring alternating methods. For each, I need to identify what a definition must address and judge if the expected verdict is correct.

  The user suspects a tension between not reverse-engineering from known life and still agreeing on standard cases. This is a real issue. Definitions shouldn't just list Earth life but must cover it. The resolution is to derive criteria that explain why known life fits, while being abstract enough for unknowns. If a definition fails for known life, it's invalid; if it's too Earth-centric, it may miss aliens or AI.

  They want to know which requirement disqualifies most current definitions. The key here is the "no teleology" rule—excluding purpose-based language. Many definitions (e.g., NASA's "chemical system...") imply evolution, but evolution isn't necessary for an individual to be alive. This requirement forces focus on the individual's current state, not lineage capabilities.

  The user emphasizes binary verdicts, not degrees. This is vital for a decision procedure. Ambiguity in "how alive" something is would make the guide useless for their class. The criteria must deliver yes/no answers, even if some cases feel borderline.

  Deeper needs: The user likely wants intellectual rigor and clarity. They’re frustrated with vague definitions and wish to create a practical tool. They might also seek validation that their approach—focusing on edge cases—is sound. Their examples show they’ve thought deeply about autonomy, information, and reproduction’s role.

  I will structure the answer with clear desiderata, each justified by cases. Non-negotiables include metabolism, containment, program-ability, reproduction, and avoiding teleology. Preferences like open-ended evolution should be marked as such. For their three cases, I'll commit to verdicts: The Rental is alive despite dependency, The Library is alive with environmental inheritance, and Twin Ladder is alive via alternating reproduction. The tension between coverage and non-reverse-engineering is resolved by abstracting essential traits from known life without requiring Earth-like biology. The teleology requirement is the biggest hurdle for existing definitions, as it removes the need for evolutionary potential, focusing on the individual.

  The hardest trade-off might be dropping open-ended evolution if forced, as it's less critical for the binary alive verdict. The most debatable point is requiring reproduction in the individual’s lifetime, but it's necessary to exclude sterile cases. Overall, the guide should give binary answers based on clear, observable criteria.
answer: |-
  Based on your project's purpose and constraints, here is the list of desiderata I stand behind for your decision procedure. These are designed to handle your specified cases, maintain crucial distinctions, respect core science, function as a practical test, and grapple with the inherent tensions.

  **Core Desiderata (Non-Negotiable):**

  1.  **Binary Verdict:** *Must* output "Alive" or "Not Alive". No "sort of alive" or degrees. *Why:* Essential for a decision procedure. Collapsing "whether alive" vs. "how alive" renders the guide useless for its stated purpose of ruling on cases. *Case:* Sterile individuals (mules) must be clearly alive *now*; a rock is clearly not. Degrees (e.g., "more alive than a virus") are subjective and unworkable.

  2.  **Individual Focus:** *Must* apply to the specific entity presented for judgment, *not* its lineage, population, or ecosystem. *Why:* Precisely distinguishes being alive *versus being a part/product of something alive* or having living descendants. *Case:* Your factory process may be complex and "grow," but the factory itself isn't alive; it's a product/maintained by living things (engineers, microbes). A detached leaf is not alive, even if it was part of a living tree. The Rental organism itself must be judged, not its symbiotic manufacturers.

  3.  **Intrinsic Process (Metabolism/Self-Maintenance):** *Must* continuously perform regulated, endogenous chemical work (or analogous information-driven process in non-chemical systems) to acquire/utilize energy and materials *to maintain its own organized state and integrity against decay*. *Why:* Fundamental distinction from inert matter and products. Captures the dynamic, far-from-equilibrium state. *Case:* A dormant seed/spore qualifies – its *intrinsic machinery* is *designed* to halt/resume metabolism endogenously under specific conditions. A running car engine lacks intrinsic regulation/self-maintenance – it's externally fueled and maintained. The factory process lacks intrinsic *self*-maintenance.

  4.  **Bounded Self:** *Must* possess a discernible physical boundary (membrane, shell, distinct surface) that separates its internal processes from the external environment and which it actively maintains. *Why:* Distinguishes a living *individual* from its environment, a *part* of something larger, or an uncontained process. Essential for individuality and regulating internal conditions. *Case:* A single bacterium clearly bounded. A forest, while interconnected, consists of *many* individual trees/plants, each with its own boundary – the forest *as a whole* isn't a single bounded individual. A fire "consumes" and "grows" but lacks a maintained boundary defining "self."

  5.  **Program-Enabled Self-Construction & Regulation:** *Must* possess and utilize an internal, persistent, inheritable set of coded instructions (genetic, digital, or other substrate) that directly guides its self-construction, self-maintenance, and response to the environment. This program must be *executed* by the entity itself. *Why:* Distinguishes living systems governed by internal blueprints from passive structures or externally controlled processes. Essential for self-replication and inheritance. *Case:* Bacteria, oak trees, computer worms all have executable code (DNA, software). A crystal replicates its structure via external physical laws, not an internal, executable program it runs. The lab cell running its chemistry qualifies; the machine copying instructions externally does *not*.

  6.  **Capacity for Self-Replication (within the entity's functional lifetime):** *Must* possess the inherent *capacity*, derived from its executable program and self-maintenance processes, to make one or more functional copies of *itself* (including its program) *during its normal functional existence*, without requiring the complete external redesign/reconstruction of the copy's core machinery/program. *Why:* Crucial distinction between *reproduction* (inherent, self-directed copying) and *being copied* (external action). Separates living individuals from their products or externally replicated patterns. *Case:* A sterile mule *has* the cellular machinery and genetic program for replication *in principle*; its sterility is a specific breakdown. The computer worm copies *itself* using its own code. The factory *produces* cars; it does not replicate *itself* using an internal program. The Rental organism replicates *itself* (using manufactured parts); the symbionts replicate separately. The Twin Ladder lineage replicates via alternating *self*-replication methods. *The seed/spore inherently possesses this capacity, activated upon germination.*

  7.  **No Teleology/External Purpose:** *Must* define "alive" solely based on the entity's *intrinsic* organization, processes, and capacities, *not* on any externally assigned purpose, function, or evolutionary potential. *Why:* Vital to avoid collapsing *having a function/purpose* (which might be assigned) vs. *being intrinsically organized for self-perpetuation*. "Evolution by natural selection" is a population-level phenomenon, not a property of the individual *at the moment*. *Case:* A sterile mule is alive *now*. A computer worm *is* alive by intrinsic criteria, regardless of whether it "evolves" or if we find it "useful" or "purposeful." The factory may have a purpose, but lacks intrinsic life criteria. *This is the requirement that excludes the most definitions*, particularly the popular "self-sustaining chemical system capable of Darwinian evolution." It rules out definitions that require open-ended evolvability or adaptation to an environment *as a criterion for the individual*. This is a point in its favour because it keeps the focus on the *individual entity's current state and inherent capabilities*, which is necessary for your binary, case-by-case decision procedure. Evolution is a *consequence* of life (replication with variation), not its definition.

  **Important Preferences (Often Dressed as Requirements):**

  8.  **Material Substrate Independence:** *Should* be agnostic to the specific material basis (carbon, silicon, etc.) as long as the core processes (metabolism, bounded self, program, replication) are functionally realized. *Why:* Necessary for alien life or advanced AI. *Case:* The computer worm *should* potentially qualify if it meets the core criteria intrinsically. This is a preference because some definitions *insist* on organic chemistry, but that seems arbitrary for your purpose.

  9.  **Absence of Open-Ended Evolution as a Requirement:** *Should not require* the capacity for open-ended Darwinian evolution. *Why:* Evolution is a population-level process over time. An individual can be alive without its lineage being capable of significant future evolution. *Case:* A lineage trapped in an evolutionary dead-end (e.g., obligate asexual clones with no variation) still consists of living individuals. This is often bundled with "Darwinian evolution" definitions. It's a preference because while evolution is *characteristic* of life, it's not *definitive* for the individual.

  10. **Process over Origin:** *Should* focus on current organization and processes, not origin. *Why:* Allows for synthetic life or alien life that wasn't "born" from existing life. *Case:* A successfully created protocell in a lab should qualify if it meets the criteria.

  **Addressing Your Cases & Distinctions:**

  *   **Sterile Individual (Mule):** Alive. Has intrinsic metabolism, bounded self, genetic program, inherent cellular machinery for replication (even if blocked). (Satisfies 1, 2, 3, 4, 5, 6)
  *   **Dormant Seed/Spore:** Alive. Possesses the inherent capacity (program, machinery) for metabolism and replication, actively maintained in a suspended state within a boundary. (Satisfies 1, 2, 3, 4, 5, 6)
  *   **Clonal Forest (Aspen):** The *individual tree/ramet* is alive. The *genet* (whole clone) is not a single bounded, self-maintaining individual. (Satisfies 2, 4)
  *   **Computer Worm:** **Potentially Alive.** If it: has intrinsic processes analogous to metabolism (e.g., managing resources, state); has a defined "self" (code + memory state + process space); possesses & executes its own code; replicates *itself* (including its core code) using that execution. (Satisfies 1, 2, 3*, 4*, 5, 6, 8*) *(*If analogous processes meet criteria).
  *   **Factory Process:** Not Alive. Lacks intrinsic self-maintenance (externally fueled/repaired), no bounded "self," no executable program guiding *its own* replication. It's a product/process of living things. (Fails 2, 3, 4, 5, 6)
  *   **Lab Cell:** Alive. Performs intrinsic metabolism/self-maintenance within a boundary. Possesses and executes its genetic program. Its *replication mechanism* is broken (requires external machine), but it possesses the inherent *capacity* (program, core machinery) – the machine is akin to a prosthetic. (Satisfies 1, 2, 3, 4, 5, 6)

  **Your Three Cases:**

  1.  **The Rental:**
      *   **Commitment:** Alive. It maintains *its own* boundary and organized state (metabolism). It replicates *itself* (using the manufactured parts). It possesses and executes *its own* program (which directs the symbiosis and replication process). The symbionts are separate living entities *inside* it. Its dependence doesn't negate its intrinsic processes and replication.
      *   **Right Verdict?** Yes. It's a highly derived, obligate symbiotic organism.

  2.  **The Library:**
      *   **Commitment:** Alive. The parent performs metabolism, is bounded, executes its program (which includes building the library). The offspring develops using instructions *from the library*, but crucially, the library's structure *is built by the parent organism executing its own program*. The information in the library is a *product* of the parent's program execution, analogous to an egg yolk or placental environment, just more extreme. The parent replicates *itself* (producing offspring capable of building the next library). The *inheritance of variation* occurs via the parent's program-influenced construction.
      *   **Right Verdict?** Yes. It's an extreme case of environmental inheritance/non-genetic inheritance, but the core criteria are met by the parent and offspring individuals.

  3.  **The Twin Ladder:**
      *   **Commitment:** Alive (each individual). Each generation possesses the inherent *capacity* for replication, utilizing one of the two methods encoded in its program. Neither method works alone *for the lineage*, but *each individual* has the functional capacity to replicate *itself* using the method appropriate to its generation. The program ensures alternation.
      *   **Right Verdict?** Yes. This is analogous to complex life cycles (e.g., alternation of generations in plants/fungi) where different reproductive modes exist within one lineage. Each individual can replicate.

  **The Tension (Reverse-Engineering vs. Agreement):**

  This tension is **real**. It arises because:
  *   **Requirement:** The definition must cover all uncontroversial cases (cats, bacteria) - "Agreement."
  *   **Requirement:** The definition must not be *merely* a list of features of Earth life; it must be fundamental enough to apply to novel cases (aliens, AI) - "Non-Reverse-Engineered."
  *   **Tension:** How do we know our "fundamental" criteria aren't just accidentally true for Earth life? How can we guarantee agreement on novel cases if we haven't seen them?

  **Resolution & What Must Be Given Up:**

  1.  **Agreement on Known Life is Non-Negotiable:** If a definition fails for cats or bacteria, it's invalid. These are our anchor points.
  2.  **Non-Reverse-Engineering is Achieved via Abstraction & Function:** We identify the *functional roles* necessary for the phenomena we observe in known life (self-maintenance, individuality, reproduction, inheritance) and define criteria based on those *abstract functions* (metabolism, bounded self, executable program, self-replication capacity), *not* their specific Earthly implementations (e.g., DNA, lipid membranes, glycolysis).
  3.  **What Must Be Given Up:** The guarantee of *universal agreement* on *all possible* novel cases *in advance*. We define the functional criteria based on known life and logic. When a truly novel case arises (e.g., a complex, self-replicating Martian silica gel, or a truly autonomous self-replicating AI), we apply these abstract functional criteria rigorously. Disagreement might occur at the margins *until* we see how the novel system behaves over time (does it maintain? replicate? evolve?). The definition provides the *framework* for making the ruling, even if the ruling on a specific novel case is initially contentious. We give up the illusion of a definition guaranteeing perfect, instant, unanimous agreement on absolutely everything conceivable; we gain a rigorous, functional, non-Earth-centric framework.

  **Trade-Offs & Reasonable Disagreement:**

  *   **If I Had to Drop One Desideratum:** I would drop **Preference #9 (Absence of Open-Ended Evolution)**. While I strongly believe it shouldn't be required for the *individual*, it's less central to the core binary decision than the non-negotiable criteria. The core criteria (1-7) remain robust without it.
  *   **Most Open to Reasonable Disagreement:** The **interpretation of "analogous processes" in non-chemical systems (Preference #8 - Substrate Independence)** especially regarding "metabolism" and "bounded self" for digital entities. What precisely counts as "intrinsic self-maintenance" or a "discernible boundary" for a computer program? This is where the hardest debates about AI life will occur. The core criteria are clear for chemistry, but extending them requires careful functional equivalence arguments. *However, the criteria themselves (3 & 4) are non-negotiable; the disagreement is on their application to novel substrates.*

  **Binary Verdict & Your Guide:**

  The desiderata **mandate a binary verdict (Desideratum 1)**. The criteria are designed as necessary and sufficient conditions. If an entity meets all of 1-7, it's Alive. If it fails any one of them, it's Not Alive. This provides the clear ruling your guide requires. The preferences (8-10) guide the *interpretation* of the core criteria for edge cases but don't change the binary nature.

  This list provides a rigorous, functional foundation for your field guide. It forces clear decisions on your cases, maintains your crucial distinctions, respects core biology while allowing for non-Earthly life, and avoids the pitfalls of teleology and reverse-engineering. Good luck with your project!
