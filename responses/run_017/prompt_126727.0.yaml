  **OFFICE OF ADMISSIBLE SHARPENINGS**  
  **Guidance Note 17 (Third Revision): Designation of Heaps, Baldness, and Other Statutory Predicates**  
  *Issued under the Vague Predicates Act 1992 (as amended)*  
  *Effective Date: 01/04/2024*  
  *Leak Control: PENUMBRAL*  

  ---

  ### **1. Definitions**  
  1.1. **Admissible Sharpening**: Any precise boundary for a vague predicate (e.g., "heap", "bald") consistent with all definitive truths and contextual usage norms.  
  1.2. **Supertruth**: A statement true under every admissible sharpening. A statement may be true (under some sharpenings) without being supertrue.  
  1.3. **Penumbral Case**: An instance where a predicate (e.g., "heap") lacks determinate application. For such cases, no truth value is assignable.  
  1.4. **Determinate Negation**: A statement supertrue in its negation (e.g., "not a heap" supertrue only if false under all sharpenings).  
  1.5. **First-Order Borderline**: A case penumbral for the base predicate (e.g., a pile indeterminate between heap/not-heap).  
  1.6. **Higher-Order Borderline**: A case indeterminate between determinate and first-order penumbral status (see §4.3).  

  ---

  ### **2. General Principles for Predicate Application**  
  2.1. Officers must ascertain supertruth for all statutory designations. A pile may only be certified a "heap" if it is a heap under every admissible sharpening.  
  2.2. For penumbral cases (§1.3), officers must not designate *either* "heap" *or* "not-heap". Form H-17b (Designation Worksheet) must reflect "indeterminate status" in Field 5.  
  > *Example*: A pile of 349 grains of sand is typically penumbral. An officer recording "not a heap" (despite truth under *some* sharpenings) violates §2.2 and faces disciplinary action (per GN17/App.A).  

  2.3. **Existence of Thresholds**: It is supertrue that a precise threshold exists for every vague predicate (e.g., "some number *n* is the minimum grains for a heap").  
  2.4. **Prohibition on Threshold Specification**: No officer may introduce a name, variable, or fixed value for thresholds (§2.3) in reasoning or documentation. Existential instantiation is expressly forbidden.  
  > *Rationale*: While a threshold exists supertrue, every candidate *n* is penumbral for "threshold for heap" (see Case Log #4492-δ). Violations incur immediate dismissal.  

  2.5. Designations must not rely on perceived likelihoods, averages, or statistical norms. Admissibility derives from conceptual coherence, not frequency of use.  

  ---

  ### **3. Operational Procedures for Heap Certification**  
  3.1. **Certification Criteria**:  
  (a) A pile may be certified a "heap" only if supertrue (i.e., a heap under all admissible sharpenings).  
  (b) A pile may be certified "not a heap" only if supertrue (i.e., not a heap under any sharpening).  
  (c) All other cases are penumbral and receive "indeterminate" status.  

  3.2. **Practical Constraints**:  
  (a) Due to penumbral spread, "heap" certification requires extreme abundance (e.g., ≥10^6 grains).  
  (b) "Not-heap" certification requires extreme scarcity (e.g., ≤10 grains).  
  (c) Piles between 10 and 10^6 grains are typically uncertifiable. Field agents must submit H-17b with "indeterminate" and await audit.  

  3.3. **Fiscal Provisions**:  
  (a) Fines for false certification are levied in Penumbral Sterling (P£), with value fixed by the Treasury’s daily admissibility index.  
  (b) The Office’s Q3 2024 operating budget is designated "not determinately appropriated". Contingency funds require supertrue approval from Second-Order Admissibility (see §4.3).  

  ---

  ### **4. Higher-Order Vagueness and Deferred Provisions**  
  4.1. **Second-Order Penumbra**: Cases exist where first-order penumbral status (e.g., "indeterminate heap") is itself indeterminate.  
  4.2. **Office of Second-Order Admissibility (OSA)**: The OSA reviews first-order penumbral cases for higher-order indeterminacy. Agents must flag cases for OSA referral using Form H-17c.  
  4.3. **Admissible Sharpening of Sharpening Criteria**: The OSA evaluates sharpenings for "admissible sharpening" itself. Procedures for third-order vagueness (e.g., indeterminacy in OSA criteria) are deferred to GN17 Fourth Revision.  
  > *Note*: The regress of borderline cases is statutorily acknowledged but operationally capped at second-order pending review.  

  ---

  ### **5. Compliance and Auditing**  
  5.1. All designations are subject to random audit by the Admissibility Compliance Unit (ACU).  
  5.2. Officers must retain grain-count verification records for 10 years, or until the pile’s ontological status is resolved.  
  5.3. Failure to comply with §2.2 or §2.4 constitutes gross misconduct.  

  *Issued by:*  
  *Deputy Director, Office of Admissible Sharpenings*  

  ---

  ### **LEAKED MARGINAL NOTES**  
  *(Handwritten in pencil by Epistemicist Clerk Agnes Finch)*  

  - **Beside §2.3 ("Existence of Thresholds")**:  
    *"Obviously. It’s 8,192 grains for sand heaps. Written on the card in the DD’s safe. But if you saw 8,191, you’d swear it was 8,192 – and you’d be wrong. So no, you’ll never get to peek."*  

  - **Beside §2.4 ("Prohibition on Threshold Specification")**:  
    *"This is why we’ll be auditing gravel piles until retirement. The number’s sharp as a knife, but they’ve banned knives. Idiots."*  

  - **Beside §3.2(c) ("uncertifiable piles")**:  
    *"Bet they’ve got that 8,192 card taped under the safe. You could walk past it every day and never know you’re in the penumbra. (Which is always.)"*  

  ---

  **Summary Guidance**: This revision clarifies that almost nothing is certifiable (§3.2), thresholds are real but unspeakable (§2.3–2.4), and higher-order vagueness is someone else’s problem (§4.3). Submit H-17b triplicate.  

