  **Bottom line:** The St. Petersburg paradox primarily highlights a conflict between expected utility theory's reliance on bounded utility to ensure finite valuations and tail-robustness theory's rejection of expectation maximization for heavy-tailed risks, with the core disagreement pivoting on empirical plausibility and coherence rather than mathematical existence.  

  ### Agreed Claims  
  1. The uncapped St. Petersburg game (payoff = $2^n$ with probability $2^{-n}$ for $n=1,2,3,\ldots$) has infinite expected monetary value.  
  2. Capping the game at a maximum payout of $2^N$ (due to a finite house bankroll) reduces the expected monetary value to approximately $N$ dollars (specifically, $\sum_{n=1}^N 1 \approx N$).  
  3. For any bounded utility function $u$ (i.e., $\sup_x u(x) < \infty$), the expected utility of the uncapped game converges to a finite value, implying a finite certainty equivalent.  
  4. The certainty equivalent can be made arbitrarily large under expected utility maximization: for $u(x) = 1 - e^{-x/M}$, it is roughly $\log_2 M$ dollars (e.g., $M = 10^{12}$ implies $\sim$40 dollars).  
  5. The probability of a payout exceeding $2^{20}$ dollars in the uncapped game is $2^{-20}$ (approximately one in a million).  

  ### Disagreements  
  | Expected-Utility Theorist (EUT)                                                                                                | Tail-Robustness Theorist (TRT)                                                                                                                               |  
  |:-------------------------------------------------------------------------------------------------------------------------------|:-------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | "Bounded utility resolves the paradox: it aligns finite valuations with empirical risk-aversion, and slow saturation reflects plausible scaling of preferences." | "Bounded utility fails practically: it licenses overpayment for negligible tail risks, so expectation should be abandoned for robust rules (e.g., quantile-based criteria)." |  

  ### Cruxes  
  **(a) Utility boundedness and its practical role**  
  - **Bearing argument**: Conduct hypothetical choice experiments (e.g., "Would you pay \$1 for a one-in-a-trillion chance to win \$1 trillion?") to infer the saturation scale $M$ in $u(x) = 1 - e^{-x/M}$.  
  - **EUT prediction**: Choices will reveal moderate $M$ (e.g., $M \leq 10^9$), making St. Petersburg's certainty equivalent empirically plausible (e.g., $\sim$30 dollars).  
  - **TRT prediction**: Choices will show negligible willingness-to-pay (e.g., \$0.01), implying implausibly small $M$ (e.g., $M \approx 10^6$) or a rejection of EU for such lotteries.  

  **(b) Coherence of the uncapped game**  
  - **Bearing argument**: Analyze if real agents can honor contracts with unbounded payouts (e.g., using global wealth as bankroll: $W \approx 10^{15}$ dollars, capping $N$ at $\log_2 W \approx 50$).  
  - **EUT prediction**: Capping at $N \approx 50$ ensures finite expectations and reasonable certainty equivalents (e.g., $\leq$100 dollars), making "refusal to pay" irrational only if utility is misspecified.  
  - **TRT prediction**: The game is inherently incoherent (no house can guarantee payouts), so rejecting EU is rational; capping merely shrinks but does not eliminate heavy-tailed risk.  

  **(c) EU adequacy under bounded utility**  
  - **Bearing argument**: Test choices for a lottery $L$: payoff $2^{2^k}$ dollars with probability $2^{-k}$ for $k=1,2,\ldots$ (e.g., 50% chance of 4 dollars, 25% of 256 dollars, 12.5% of 65,536 dollars, etc.), with stipulated $u(x) = 1 - 1/(1+x)$ (bounded by 1). EU certainty equivalent $\approx 99$ dollars.  
  - **EUT prediction**: Choices will align with EU (willingness-to-pay $\approx$99 dollars), as the high tail compensates for frequent small losses.  
  - **TRT prediction**: Choices will reject EU (willingness-to-pay $\ll$99 dollars, e.g., $\leq$20 dollars), as the median outcome (4 dollars) dominates and tail risks are deemed unacceptable.  

