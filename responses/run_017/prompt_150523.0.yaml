answer: |-
  ### 1. Bottom line  
  The phenomenon you describe is the **dependence of strictly proper scoring rules' expected penalties on the granularity of the event partition**, independent of forecaster calibration or skill. Crucially, finer partitions increase the *irreducible uncertainty* (entropy-like term) in the scoring decomposition, raising the minimum expected penalty even for perfect forecasters. This occurs because coarsening aggregates outcomes, hiding within-cell miscalibration and altering the baseline penalty. It differs from resolution/sharpness metrics (which fix the partition) and scoring-rule dependence (which fixes the partition while varying rules). The effect normatively privileges coarser questions when comparing forecasters across different partitions.

  ### 2. Nearest concepts, and how each differs  
  - **Resolution (in calibration-refinement decomposition)**: Resolution measures how a forecaster's probabilities deviate from the marginal event frequency, capturing "useful discrimination." *Difference*: Resolution assumes a fixed partition and quantifies forecaster skill. Your case varies the partition itself, altering the irreducible uncertainty (refinement) term. Resolution is partition-conditional; your phenomenon is partition-driven.  

  - **Strict propriety of scoring rules**: Strict propriety ensures forecasters maximize expected score by reporting true beliefs. *Difference*: Propriety addresses honesty incentives for a fixed partition. Your case holds propriety constant (e.g., Brier is always proper) but shows that expected penalties *for the same forecaster* change with partition coarseness, even when beliefs are fixed.  

  - **Scoring partitions (e.g., in multi-class classification)**: Literature sometimes notes that aggregating categories affects scores. *Difference*: This is typically treated as a practical aggregation issue, not a normative flaw. Your case reveals a systematic penalty shift: coarsening can *artificially* reduce penalties by masking within-cell errors (e.g., if Cara’s 0.6 is uniform while Fin’s 0.6 is concentrated, coarsening hides Fin’s accuracy).  

  - **Refinement/Entropy term in Brier decomposition**: The Brier score decomposes as "uncertainty" − "resolution" + "reliability," where uncertainty depends on the true distribution. *Difference*: This decomposition is often applied post hoc to a single partition. Your insight is that varying the partition changes the "uncertainty" term (e.g., 0.48 to 0.58 for Fin), which is irreducible and partition-dependent, thus altering the baseline for comparison.  

  - **Stochastic dominance arguments for probabilism**: These argue that non-probabilistic forecasts are accuracy-dominated. *Difference*: Those arguments assume a fixed partition. Your case shows that changing partitions breaks dominance relations (e.g., Fin dominates Cara on fine grain but not coarse grain).  

  ### 3. Definition, with boundary cases  
  **Definition**: *Granularity Penalty Divergence* (GPD) occurs when the expected penalty of a strictly proper scoring rule for a fixed forecaster and true distribution changes due solely to coarsening or refining the partition of possible outcomes, even when marginal probabilities over aggregated cells are preserved. This arises because:  
  - **Finer partitions** increase the entropy-like term in the scoring rule’s decomposition, raising the minimum achievable penalty.  
  - **Coarser partitions** reduce this term but may hide within-cell miscalibration, artificially lowering penalties for miscalibrated forecasters.  

  **Boundary cases**:  
  - **Coarsening that improves scores despite error**: Suppose a forecaster assigns (0.5, 0.3, 0.2) to events A/B/C, but truth is (0.4, 0.4, 0.2). Coarsening {A,B} vs. C yields marginal forecast (0.8, 0.2) vs. truth (0.8, 0.2). Expected Brier drops from 0.74 (fine) to 0.32 (coarse), masking the A/B error. *This is GPD*.  
  - **Coarsening that doesn’t cause GPD**: If the forecaster’s within-cell probabilities match the true conditionals (e.g., forecast (0.5, 0.3, 0.2) with truth (0.5, 0.3, 0.2)), coarsening to (0.8, 0.2) preserves expected Brier (0.48 both). *No GPD occurs* because no hidden miscalibration exists.  
  - **Non-proper rules**: Using absolute error, coarsening {A,B} vs. C might reduce penalty even for perfect forecasters. *This is not GPD*, as GPD requires propriety to isolate partition effects from rule pathology.  

  ### 4. Generality: other scoring rules, full belief, and dominance arguments  
  - **Other proper scoring rules**: The log score (negative log probability) exhibits GPD more extremely. For Fin’s truth (0.5, 0.1, 0.4), expected log score is higher (worse) on fine grain (−1.22) vs. coarse grain (−0.94). Spherical scoring shows similar effects. All decompose into entropy and divergence terms, where entropy grows with partition size.  
  - **Full belief**: GPD manifests as the "empty belief" advantage. Scoring binary full beliefs by 0/1 accuracy, a skeptic believing nothing scores 1 if ¬A occurs, while a believer in A scores 0. Coarsening hides this: if A is split into A₁/A₂, the skeptic’s accuracy falls from 1 (if ¬A) to 0 (if A₁ or A₂ occurs).  
  - **Dominance arguments for probabilism**: These rely on strict propriety for a fixed partition. GPD undermines cross-partition dominance: Fin is strictly proper on both partitions but is dominated by a coarse-only forecaster (expected Brier 0.48 vs. Fin’s 0.58 on fine grain). Thus, arguments for probabilism assume partition stability; GPD shows that without it, non-probabilists can "win" by avoiding fine partitions.  

  ### 5. A name  
  **Granularity Penalty Divergence (GPD)**. This term emphasizes:  
  - *Granularity*: The central role of partition coarseness.  
  - *Penalty*: The scoring-rule context.  
  - *Divergence*: The decoupling of penalties from true skill when partitions shift.  
  It avoids implying forecaster-driven effects (unlike "resolution bias") or rule dependency. GPD is the systematic distortion in expected penalties when identical probabilistic beliefs are scored across partitions of varying granularity, attributable to changes in irreducible uncertainty and error-masking.  

  ### 6. Where I expect to be corrected  
  You might challenge whether this is truly "new," as the Murphy decomposition explicitly shows partition-dependent uncertainty. However, its normative implications for cross-partition comparisons are underexplored. Others may argue that practical forecasting avoids GPD by fixing partitions upfront, but your cases reveal that partition choice *itself* biases accuracy assessments. Epistemologists might contend that GPD is merely a technical artifact, not an epistemic problem, but your Fin/Cara example shows it violates intuitive fairness: the more knowledgeable forecaster is penalized for granularity. Still, some will insist this reduces to "resolution" by redefining the event—yet your core point is that forecasters face varying partitions in practice.
