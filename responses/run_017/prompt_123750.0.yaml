  - But head to head, at the end, A1 is clearly better than An — and not by a nose: by a margin big enough that you'd pay to go back.
  - The verdicts have to fall out of one comparison rule that you state up front in a single sentence and then apply uniformly to every pair. Not vibes, and not a different rationale at each link.
