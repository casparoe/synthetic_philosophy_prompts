  I'll start by agreeing that political discourse is a tough test case but argue it still fits Grice's model. The key is that cooperation isn't the same as sincerity. Even in adversarial contexts, there's a layer of cooperation in using shared codes. Journalists and spokespersons are engaged in a game with understood rules. The spokesperson is cooperating by signaling according to these conventions, not by being truthful.

  For the maxims, I'll concede they're flouted but strategically. The flouting is precisely what triggers the implicature. The spokesperson appears to violate quality (lying), quantity (giving too little info), relation (seeming irrelevant), and manner (being unclear). Yet these flagrant violations prompt the search for implied meaning. The shared background - knowing this phrase precedes resignations - allows calculating the implicature. 

  About the cancellation attempt failing: this shows the implicature is so strong that denying it isn't credible. But the mechanism still holds. If the spokesperson were genuinely confident, they'd avoid the stock phrase to prevent misunderstanding. Using it knowingly constitutes speaker meaning.

