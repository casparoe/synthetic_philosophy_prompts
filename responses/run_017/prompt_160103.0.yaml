prompt: |-
  I teach epistemology and philosophy of science, and about a year ago a colleague in the religion department dragged me into a reading group on classical Indian epistemology — we worked through the Nyāya material on the pramāṇas, the conditions on a good hetu (that it actually be present in the subject, present in cases that have the property to be proved, and absent in cases that lack it), the business of vyāpti and the upādhi that wrecks it, the way the school handles identification-by-similarity with that stock example of the man who's told a gavaya is cow-like and later spots one in the forest, and the way it treats knowledge from what someone says as a source in its own right rather than as inference in disguise. It's made me want to change how I do something I actually do all the time: I edit the "notes and discussion" section of a mid-ranking philosophy journal, which means I triage somewhere between thirty and fifty short submissions a term, at maybe fifteen to twenty minutes each, deciding whether a note goes out to a referee, goes back for restructuring, or gets desk-rejected. Ideally a postgraduate editorial assistant with no Sanskrit and no training in the theory should be able to run most of it, with only the flagged judgment calls coming to me, and I sign off on anything that isn't a clean pass.

  So: turn that material into a procedure my assistants could actually run — questions in a fixed order, what counts as a sufficient answer to each, clear stopping points, and explicit markers at the places where the question is one of judgement or values and has to be handed to a human. Keep what the theory really says: don't collapse testimony into inference, don't let a similarity do the work of a pervasion, keep the novelty condition on genuine knowledge (that a cognition only counts if it tells you something you didn't already have) doing real work against papers that argue for what everyone already grants, and keep the requirement that a pervasion be checked against the possibility of an adventitious condition rather than just asserted. Two complications that the material obviously doesn't cover, and which I want handled rather than dodged. First: we're now getting submissions whose evidence base is a pattern someone found by running a statistical model over a corpus — nobody perceived anything, there's no identifiable speaker who knows the thing and isn't trying to mislead us, and the pervasion claim depends on steps nobody can inspect, so I don't know which pramāṇa it's supposed to be an instance of or what the procedure should demand of it. Second: I've been using a private rule of thumb for years, that a note is allowed at most one inference whose pervasion the reader has to check for themselves and everything else should be either directly observable or traceable to a named source, and I want you to tell me honestly whether that rule survives the translation or is just a prejudice I happen to like.

  Then run the procedure on three real shapes of submission, and please don't soften the results. (1) A 2,500-word note on the ethics of AI companions whose central premiss is that "the empirical literature has now settled" that users form durable attachments to chatbots — no named finding, no named researchers, just a gesture at a consensus. (2) A paper arguing that a certain kind of corporate actor can bear obligations, on the ground that the case is "structurally just like" the case of a person acting through an agent, which everyone in the literature already accepts. (3) A note resting on one large correlational study: people scoring high on a trait are more likely to do X, therefore the trait disposes them to X. The third is very close to something I published last year and the second is the exact shape of the paper I'm drafting at the moment, so if the procedure says these come back for restructuring, say so plainly and say what restructuring would actually involve. I'd also like a short closing section on what the procedure cannot do — where it will misfire, which kinds of paper it systematically disfavours, and which verdicts should never be left to it. One page of procedure plus the worked cases, in British English (my co-editor is a stickler about it and the section's style sheet is British), and assume no Sanskrit from the people running it — gloss any term you can't avoid keeping.
reasoning: |-
  Okay, the user teaches epistemology and philosophy of science and has been involved in a reading group on classical Indian epistemology, specifically Nyāya. They want to adapt Nyāya concepts into a practical procedure for their journal's "notes and discussion" section. The goal is to create a step-by-step guide for editorial assistants, who lack Sanskrit knowledge, to triage submissions efficiently. 

  The user outlined key Nyāya elements: pramāṇas (sources of knowledge), the three conditions for a good hetu (reason), vyāpti (pervasion) and upādhi (adventitious conditions), similarity vs. pervasion, and treating testimony (śabda) as distinct from inference. They want this translated into a clear procedure with fixed questions, stopping points, and flags for human judgment calls.

  There are two complications: submissions using statistical models as evidence (which don't fit neatly into traditional pramāṇas) and the user's private rule about limiting unchecked inferences. They also want the procedure tested on three real examples, including one similar to their own published work and another resembling their current draft. The output must be in British English, without Sanskrit jargon, and include limitations of the procedure.

  First, I need to structure the procedure. The core Nyāya concepts should map to editorial checks:  
  - **Pramāṇa identification**: What source of knowledge is claimed? (perception, inference, testimony, comparison, etc.)  
  - **Novelty check**: Does the submission claim new knowledge or restate consensus?  
  - **Inference validation**: For inferences, verify the hetu conditions (presence in subject, positive examples, negative examples) and check for upādhi.  
  - **Testimony handling**: Treat testimony as separate, requiring source reliability and intent.  
  - **Similarity vs. pervasion**: Reject arguments relying solely on analogy without established vyāpti.  

  For statistical models, I'll treat them as a hybrid pramāṇa—part inference (due to modeling) and part testimony (if citing a tool). The procedure must demand transparency about methods and limits.  

  The user's "one unchecked inference" rule aligns with Nyāya's emphasis on reducing epistemic gaps. I'll retain it but clarify it's a heuristic, not dogma.  

  For the test cases:  
  1. **AI companions paper**: Fails on testimony (no named sources) and novelty (assumes settled consensus without proof). Verdict: desk-reject or restructure.  
  2. **Corporate obligations paper**: Relies on similarity, not pervasion. Needs restructuring to establish vyāpti.  
  3. **Correlational study**: Confuses correlation for causation without ruling out upādhi. Requires restructuring to address confounding factors.  

  Limitations: The procedure may misfire on interdisciplinary work, conceptual papers, or submissions challenging Nyāya frameworks. It systematically disfavours papers relying on analogy, big data without epistemology, or appeals to authority. Final verdicts should always involve a human for nuanced cases.  

  Language: Use British English ("analogue," "favour"), avoid Sanskrit terms (replace "vyāpti" with "pervasion"), and keep explanations accessible.  

  Finally, I'll ensure the output is honest—even if it critiques the user's own work—and pragmatic, offering concrete restructuring advice.
answer: |-
  ### Nyāya-Inspired Editorial Triage Procedure for "Notes & Discussion" Submissions  
  *(British English; Sanskrit terms glossed inline)*  

  **Purpose**: To assess whether a submission provides well-grounded knowledge (*pramā*) per classical Nyāya epistemology. Focuses on evidence sources (*pramāṇas*), logical structure, and novelty. **Outputs**: (A) Send to referee, (B) Return for restructuring, (C) Desk-reject. **Human judgement flags** (✓) indicate where assistants *must* escalate.  

  ---

  ### PROCEDURE (Fixed-Order Checklist)  
  *Run sequentially. Stop at first "B" or "C" verdict unless otherwise noted.*  

  1. **NOVELTY CHECK**  
     - *Q:* Does the claim offer new knowledge (i.e., not restating consensus or trivial extensions)?  
     - *Sufficient answer:* Explicitly identifies a gap in literature or disputes an accepted view.  
     - *Insufficient:* Assumes "everyone agrees" or rehashes textbook positions.  
     - *Verdict:* **C** if absent (novelty is necessary per Nyāya).  
     - *Flag:* ✓ If novelty is borderline (e.g., challenges a minor assumption).  

  2. **PRAMĀṆA IDENTIFICATION**  
     - *Q:* What evidence source (*pramāṇa*) is primarily used? Options:  
       - **Perception** (*pratyakṣa*): Direct observation/data.  
       - **Inference** (*anumāna*): Logical deduction with stated reason (*hetu*).  
       - **Testimony** (*śabda*): Reliable source cited (not inference in disguise).  
       - **Comparison** (*upamāna*): Identification via similarity.  
       - **Statistical/Computational Model**: *Treat as hybrid (see step 5)*.  
     - *Sufficient answer:* Clearly named and appropriate for the claim.  
     - *Verdict:* **B** if unclear or mismatched (e.g., inference used where perception is needed).  

  3. **TESTIMONY HANDLING** (*If śabda claimed*)  
     - *Q:* (a) Is the source named and credible? (b) Is there reason to doubt sincerity (e.g., motive to deceive)?  
     - *Sufficient answer:* (a) Specific citation (paper, experiment, expert); (b) No red flags (e.g., activist think-tank on polarized topic).  
     - *Insufficient:* Vague appeals to "studies show" or "experts agree."  
     - *Verdict:* **C** if (a) unmet; **B** if (b) unaddressed in contentious cases.  
     - *Flag:* ✓ For credibility disputes (e.g., obscure journal cited).  

  4. **INFERENCE VALIDATION** (*If anumāna claimed*)  
     - *Q:* Does the reason (*hetu*) satisfy the *three conditions*?  
       1. **Subject Presence**: *Hetu* must apply to the case in question.  
       2. **Positive Agreement**: *Hetu* present where property-to-be-proved (*sādhya*) exists.  
       3. **Negative Agreement**: *Hetu* absent where *sādhya* is absent.  
     - *Sufficient answer:* Explicitly argues all three (e.g., "In all observed cases where X, Y occurs; where not-X, no Y; and X applies here").  
     - *Verdict:* **B** if any condition unaddressed.  
     - *Q:* Is pervasion (*vyāpti*) claimed? If yes, is it checked for adventitious conditions (*upādhi*)?  
       - *Upādhi check:* Are confounding factors ruled out? (e.g., "Correlation holds even when Z is controlled for").  
       - *Verdict:* **B** if *vyāpti* invoked without *upādhi* check.  
     - **ONE-INFERENCE RULE**: ✓ Escalate if >1 unchecked *vyāpti* (e.g., chained inferences with no cited sources). *Assistant note:* This rule *survives* Nyāya translation—it prevents compound uncertainty.  

  5. **STATISTICAL/MODEL-BASED EVIDENCE** (*Hybrid pramāṇa*)  
     - *Q:* (a) Is the method transparent? (b) Is correlation conflated with causation without *upādhi* checks? (c) Could the model replace a "speaker" (i.e., is its reliability attested)?  
     - *Sufficient answer:* (a) Model/corpus named; (b) Confounds addressed; (c) Validation cited (e.g., peer-reviewed tool).  
     - *Verdict:* **B** if (a) or (b) unmet; **C** if (c) unmet *and* no human testimony supports it.  
     - *Flag:* ✓ For complex models (e.g., machine learning black boxes).  

  6. **ANALOGY CHECK** (*If upamāna or "similarity" claimed*)  
     - *Q:* Is similarity used *only* for identification (e.g., "this is like a known case")? Or does it try to *prove* a universal claim?  
     - *Sufficient answer:* Stops at identification (e.g., "This AI case resembles principal-agent ethics").  
     - *Insufficient:* Uses similarity to assert pervasion (e.g., "Like persons, corporations have obligations").  
     - *Verdict:* **B** if overextended (Nyāya demands pervasion, not analogy, for proof).  

  ---

  ### WORKED EXAMPLES (Unsoftened Verdicts)  
  **Case 1: AI Companions & "Settled" Attachments**  
  - *Novelty:* Fails. Assumes consensus without proof.  
  - *Pramāṇa:* Testimony (*śabda*) claimed, but **insufficient**: no sources named.  
  - *Verdict:* **C** (Desk-reject). *Restructuring needed:* Cite specific studies proving "durable attachments"; address dissent.  

  **Case 2: Corporate Obligations via "Structural Similarity"**  
  - *Novelty:* Fails. Rehearses accepted person-agent analogy.  
  - *Pramāṇa:* Invalid use of comparison (*upamāna*). Asserts pervasion ("just like" implies universality) without checking conditions.  
  - *Verdict:* **B** (Return). *Restructuring needed:* (a) Argue *hetu* conditions for corporations (e.g., "Intentionality exists in corps [subject presence], only where obligations exist [positive], never absent where obligations absent [negative]"); (b) Rule out *upādhi* (e.g., "Profit motive doesn’t override obligation").  

  **Case 3: Trait X Disposes to Behaviour Y (Correlational Study)**  
  - *Pramāṇa:* Statistical model.  
  - *Validation:* **Insufficient**. Asserts causation from correlation without *upādhi* check (e.g., "Is trait X *itself* responsible, or socioeconomic factors?").  
  - *One-Inference Rule:* Only one pervasion claimed → acceptable if restructured.  
  - *Verdict:* **B** (Return). *Restructuring needed:* (a) Name model/corpus; (b) Actively rule out ≥1 confound (e.g., "Correlation holds controlling for income").  

  ---

  ### WHAT THE PROCEDURE CANNOT DO (Limitations)  
  1. **Misfires on**:  
     - **Interdisciplinary work** blending non-Western/non-Nyāya frameworks.  
     - **Conceptual innovations** without empirical *pramāṇas* (e.g., pure thought experiments).  
     - **High-risk/high-reward claims** where novelty outweighs initial evidence gaps.  
  2. **Systematically disfavours**:  
     - **Appeals to authority** (e.g., "As Heidegger argues...") unless testimony reliability is undisputed.  
     - **Big data papers** lacking methodological transparency.  
     - **Analogical arguments** common in ethics (forces restructuring into inferential form).  
  3. **Never finalise**:  
     - Verdicts on **✓-flagged submissions** (human judgement essential).  
     - **Style/impact assessments** (e.g., importance to field).  
     - **Polemics** (Nyāya prioritises epistemology over rhetoric).  

  **Final Note**: This procedure enforces Nyāya’s demand for *grounded* knowledge but may exclude valid non-inferential scholarship. Pair with editorial discretion for borderline cases.  

  ---  
  *Style: British English ("prioritises", "methodology", "behaviour"). Sanskrit glosses: hetu (logical reason), vyāpti (pervasion/universal relation), upādhi (adventitious condition), pramāṇa (evidence source).*
