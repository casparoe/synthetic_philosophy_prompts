prompt: |-
  So I'm a philosophy prof who somehow ended up as the parlimentarian for our faculty senate, which means I write the voting rules for about fifteen standing committees — promotion, curriculum, naming and memorials, budget — and I keep running into the same thing. A body has to decide one yes/no question that turns on a couple of other yes/no questions, and whether they vote the sub-questions and infer the answer, or vote straight up-or-down on the final question, changes who wins, and then everyone assumes someone cheated. Last year our promotion committee voted separately on research, teaching, and service, all three came out yes, and the up-or-down tenure vote would have been no.

  What I want is a procedure I can hand a committee chair who has never heard of any of this, has ten minutes, and meets monthly: how do you decide what goes on the ballot as separate questions versus one package, when do you aggregate the sub-questions and when the conclusion, what do you do when the two disagree, and in what order do you take the votes (order obviously matters, and I'd rather specify it than let it be an accident). One page, no software, and it has to survive an appeal to the provost and a student newspaper story. Where it can't be turned into a rule — choosing the agenda, deciding whether the body is answerable for its reasons or only for its decisions, what to do with members who are only competent on one sub-question — say so, tell the chair to make a judgment call, and tell them to record it.

  Run it on three: promotion with three criteria; a curriculum committee deciding on a college-wide data-science requirement that turns on whether majors need it and whether we can staff it; and the naming committee deciding whether to take a donor's name off a building, where the sub-questions are a historical claim, whether the conduct was condemnable by the standards of his own time, and whether removal is proportionate. As far as I remember from grad school, no rule respects majority on every proposition and always returns a consistent set unless some fixed subgroup effectively gets a veto — so tell me plainly what your procedure does about that, and give me at least one case where it gives an answer I'm not going to like.
reasoning: |-
  We are dealing with a situation where a committee must make a decision on a main question that depends on several sub-questions. The challenge is that voting on the sub-questions separately and then deriving the main question might lead to a different outcome than voting directly on the main question. We want a procedure that is transparent, defensible, and minimizes the potential for inconsistency or perceived cheating.

  Key observations:
  1. The main question (Q) is a function of the sub-questions (say, A, B, C, ...). For example, in the promotion case, tenure (Q) might require a "yes" on research (A), teaching (B), and service (C). So Q = A AND B AND C.
  2. In the curriculum example, the data-science requirement (Q) might be approved if majors need it (A) AND we can staff it (B). So Q = A AND B.
  3. In the naming example, removing the name (Q) might be recommended if the historical claim is true (A) AND the conduct was condemnable by the standards of his own time (B) AND removal is proportionate (C). So Q = A AND B AND C.

  However, note that the logical structure might not always be a simple AND. It could be more complex (like OR, or a mix). But in the examples provided, the main question is a conjunction of the sub-questions.

  The problem: 
  - If we vote on A, B, C separately and they all pass, then by the rule we should have Q. But if we then vote on Q and it fails, we have inconsistency.
  - Alternatively, if we vote only on Q, then we don't record the reasons (the sub-questions) and that might be problematic for accountability.

  We want a procedure that:
  - Is simple enough for a chair to run in 10 minutes.
  - Handles the possibility of inconsistency.
  - Is defensible when appealed.

  Proposed procedure:

  Step 1: Before the meeting, the chair (or the committee) must determine the logical relationship between the sub-questions and the main question. This must be documented and shared with the committee in advance. For example, "Tenure requires a positive vote on research, teaching, and service." Or "The data-science requirement requires that majors need it and that we can staff it."

  Step 2: At the meeting, the chair presents the main question and the sub-questions, and the logical rule (e.g., "The main question passes only if all sub-questions pass").

  Step 3: Voting order:
     a. First, vote on each sub-question. Record the votes.
     b. Then, based on the logical rule, compute the implied outcome for the main question.
     c. Then, vote on the main question.

  Step 4: Compare the computed main question (from the sub-questions) and the directly voted main question.
     - If they agree, then that is the outcome.
     - If they disagree, then the committee must decide which outcome to accept.

  But how to resolve the disagreement? We need a rule for that. We can say:

     - In case of disagreement, the outcome of the direct vote on the main question prevails.

  Why? Because the main question is the ultimate decision the body is charged to make. The sub-questions are reasons, but the body has the right to make the final decision on the main question. However, this might be controversial if the sub-questions are all passed and the main question fails (like the promotion example). Alternatively, we could let the logical outcome prevail. But that might be seen as overriding the will of the body on the main question.

  Alternatively, we might avoid the direct vote on the main question and only vote on the sub-questions, then let the rule determine the main question. This would avoid inconsistency. However, the committee might feel that they are being denied the right to vote on the main question.

  Given the requirement for accountability and the possibility that the main question might involve considerations beyond the sub-questions, the direct vote on the main question is important. But note: if the rule is that the main question is strictly defined by the sub-questions, then the direct vote might be seen as redundant. However, we have seen that the committee might vote differently on the main question than the logical outcome.

  Therefore, we propose:

     Option A (for when the logical rule is clear and binding):
        - Vote only on the sub-questions, and then derive the main question by the rule.
        - Do not vote on the main question.

     Option B (for when the committee might have additional considerations beyond the sub-questions, or when there is a possibility of error in the sub-questions):
        - Vote on the sub-questions and then on the main question.
        - If they disagree, then the direct vote on the main question prevails.

  But note: the problem states that the main question "turns on" the sub-questions, meaning that it is defined by them. Therefore, Option A might be more appropriate. However, we must account for the possibility that the committee might want to override the rule (for reasons not captured by the sub-questions). 

  Given the need for simplicity and defensibility, and to avoid the inconsistency, we recommend:

     - If the main question is strictly defined by the sub-questions (and there is no room for other factors), then vote only on the sub-questions and derive the main question. This is consistent and avoids the problem.

     - If the main question is not strictly defined by the sub-questions (i.e., the committee might consider other factors, or the rule is not binding but only a guideline), then vote on the main question directly and separately, and do not vote on the sub-questions. However, this loses the accountability of the sub-questions.

  But the problem requires that we have the sub-questions for accountability? The examples suggest that the sub-questions are important for the record.

  Therefore, we propose a hybrid:

     Step 1: Vote on the sub-questions.
     Step 2: Compute the main question outcome by the rule.
     Step 3: Present the computed outcome to the committee and then hold a vote on the main question, but frame the vote as: "Given the votes on the sub-questions, which by our rule would lead to [computed outcome] for the main question, we now vote on the main question. You may override the rule if you believe there are other considerations not captured by the sub-questions or if you believe the rule should not apply in this case."

     Then, if the vote on the main question matches the computed outcome, we are done. If not, then the direct vote prevails and we note that the committee overrode the rule.

  But this introduces the possibility of override, which might be controversial.

  Alternatively, we might require that an override requires a supermajority? But that complicates the procedure.

  Given the time constraints and the need for simplicity, we choose:

     Procedure:

     1. Before the meeting, the chair must establish and distribute the logical rule (e.g., "Tenure requires a majority yes on research, teaching, and service").

     2. At the meeting:
          a. The committee votes on each sub-question (in an order determined by the chair, but the order of sub-questions should not affect the outcome because they are independent).
          b. The chair then applies the rule to compute the outcome for the main question.
          c. The chair then announces: "Based on the votes, the rule implies that the main question is [computed outcome]. Unless there is a motion to override the rule, this will be the outcome for the main question."

     3. If any member moves to override the rule, then the committee holds a vote on the main question. The motion to override requires a majority (or a supermajority if the bylaws require) to pass. If the motion to override passes, then the committee votes on the main question. Otherwise, the computed outcome stands.

     4. If an override is granted and a direct vote on the main question is taken, then the outcome of that vote is recorded, and the minutes must note that the rule was overridden.

     5. If no motion to override is made, then the computed outcome is recorded.

  This procedure:
     - Records the sub-questions for accountability.
     - Avoids an unnecessary vote on the main question if there is no override.
     - Allows for override in exceptional circumstances, but with a hurdle (the motion to override) to prevent frivolous overrides.

  But note: the override vote is a vote on whether to hold a vote on the main question. Alternatively, we could skip the motion and always have a vote on the main question? But that brings back the inconsistency.

  Given the time, let's try to minimize the number of votes. We don't want to have three sub-votes and then a main vote and then an override vote. So:

     Revised procedure:

     1. Establish the rule in advance.

     2. Vote on the sub-questions.

     3. Compute the main outcome.

     4. Announce: "The rule we agreed on implies [outcome]. We will now vote on the main question. You may vote as you see fit, but if you wish to override the rule, please note that we will record both the computed outcome and the direct vote, and the direct vote will be the official outcome."

     5. Vote on the main question.

     6. If the direct vote on the main question matches the computed outcome, then it's consistent. If not, then the direct vote prevails, and we note the inconsistency.

  But then why vote on the sub-questions? We do it for the record, even if they are overridden.

  However, this procedure always has two votes (sub-questions and main) and might lead to inconsistency. The committee might not like that.

  Alternatively, we can avoid the direct vote on the main question unless the computed outcome is challenged. We can do:

     1. Vote on the sub-questions.

     2. Compute the main outcome.

     3. The chair says: "Unless a member requests a separate vote on the main question, the outcome will be [computed outcome]."

     4. If a member requests a separate vote, then hold a vote on the main question and use that as the outcome.

     5. Record the sub-questions and the main outcome (whether computed or directly voted).

  This is simpler. It only adds an extra vote if requested. The request can be made by any member. The minutes will record the request and the outcome.

  But what if the computed outcome is not what the majority wants? They can request a vote. However, if the computed outcome is what they want, they won't request. So:

     - If the computed outcome is acceptable to the majority, they won't request a vote -> efficiency.
     - If not, they can request and then vote.

  But note: the request might be used strategically. For example, if the computed outcome is negative but the majority wants a positive, they will request. But if the computed outcome is positive and the majority wants negative, they will also request. So it's symmetric.

  However, what if the committee is divided and a minority requests a vote? The rule is: any member can request. Then we have the vote. This might happen even if the computed outcome is the same as the direct vote would be, but we don't know until we vote.

  We can adjust: the chair may allow a request only if the member states a reason (e.g., other considerations not captured by the sub-questions). But that is subjective.

  Given the time, we go with:

     Procedure:

     Step 1: Before the meeting, the chair determines the rule (e.g., Q = A AND B AND C) and shares it.

     Step 2: At the meeting, the committee votes on each sub-question (order determined by chair, but record the order). The chair then computes the outcome for the main question.

     Step 3: The chair announces the computed outcome and then asks: "Is there a request for a separate vote on the main question? A request can be made if a member believes that there are considerations beyond the sub-questions that should be taken into account, or if the member believes the rule should not be applied in this case."

     Step 4: If there is no request, the computed outcome is adopted.

     Step 5: If there is a request, the committee votes on the main question and that vote is the outcome.

     Step 6: The minutes record:
          - The vote on each sub-question.
          - The computed outcome for the main question.
          - Whether a separate vote on the main question was requested and by whom (if the rules allow recording who made the request).
          - If a separate vote was held, the vote on the main question.

  This procedure:

     - Is simple (only one extra vote if requested).
     - Avoids inconsistency in the common case (no request) by using the computed outcome.
     - Allows for override when needed, but with a hurdle (a member must speak up and request) and a reason (though the reason is not verified, it must be stated).
     - Records the sub-questions for accountability.

  Now, let's run through the examples:

  Example 1: Promotion committee (Q = A AND B AND C)

     - Votes: 
          A (research): yes (say, 8-2)
          B (teaching): yes (7-3)
          C (service): yes (6-4)
          -> Computed Q: yes.

     - Chair announces: "The rule requires all three, so tenure is recommended. Any request for a separate vote on tenure?"

     - If no request, then tenure is approved.

     - If there is a request (maybe because a member thinks that even though the candidate passed all three, there are other reasons to deny tenure), then they vote on Q. Suppose they vote 5-5 -> then tenure is denied? But that would be inconsistent because the sub-questions all passed. However, the procedure allows it. And we record the override.

     Why would they vote no? Maybe because of a scandal not captured by the three? Or because they feel the standards were too low? The procedure allows that.

  Example 2: Curriculum committee (Q = A AND B)

     - A (majors need it): yes (10-0)
     - B (can staff it): no (6-4) -> computed Q: no.

     - Chair: "The rule requires both, so the requirement is not approved. Any request for a separate vote?"

     - If no request, then the requirement is rejected.

     - If a request is made (maybe because some members think we should approve it anyway and figure out staffing later), then they vote on Q. If they vote yes (say, 7-3), then the requirement is approved.

  Example 3: Naming committee (Q = A AND B AND C)

     - A (historical claim true): yes (9-1)
     - B (conduct condemnable by own time): no (6-4) -> so computed Q: no.
     - C (proportionate): yes (8-2)

     - Computed: no removal.

     - Request for separate vote? Maybe a member argues that even if the conduct was not condemnable by his own time, by today's standards it is so egregious that we should remove. They vote on Q: removal? If they vote yes, then removal is recommended.

  What about the Arrow-like impossibility? 

     The chair must note: There is no perfect procedure. The Gibbard-Satterthwaite theorem and similar results show that no voting system can satisfy all desirable properties. In particular, our procedure:

        - Respects the majority on the sub-questions when there is no override.
        - But when there is an override, the direct vote might overrule the sub-questions.

     The procedure does not guarantee that the outcome is consistent with the majority on every proposition. In the override scenario, we might have:

          A: yes, B: yes, C: yes -> computed Q: yes -> but then a direct vote on Q: no.

     This is inconsistent. We are allowing it because we let the direct vote override. But note: we do so only if a member requests, and we record the inconsistency.

     The chair must be prepared to defend that the committee has the right to override its own rule for good reasons.

  One case where the answer might not be liked:

     Consider the promotion example: A, B, C all pass by majority, but then a member requests a separate vote on Q, and the committee votes no on Q (by majority). The candidate is denied tenure even though they passed all criteria. The candidate and their supporters will be upset. The minutes will show the inconsistency, and the committee might be criticized. But the procedure allows it. We are trading off consistency for the flexibility to consider other factors.

     Alternatively, we might require a supermajority for the override? But that complicates. We stick with a simple majority for the direct vote.

     To mitigate, the chair should encourage that the rule be well-designed and that the sub-questions capture all relevant factors. And if an override is requested, the member must state the reason, which might deter frivolous overrides.

  Summary of the procedure:

     One-page instruction:

     Faculty Senate Voting Procedure for Compound Questions

     Purpose: To decide a main question that depends on sub-questions, while recording the sub-questions for accountability and avoiding unnecessary votes.

     Steps:

     1. Before the meeting:
          - The chair must define the main question (Q) and the sub-questions (A, B, C, ...) and the logical rule that determines Q from the sub-questions (e.g., "Q passes only if all of A, B, C pass"). Distribute this to the committee.

     2. At the meeting:
          a. Vote on each sub-question separately, in an order determined by the chair. Record the vote counts.
          b. Apply the rule to compute the outcome for Q.
          c. Announce the computed outcome and say: "Unless a member requests a separate vote on the main question, this will be our decision. A request can be made if there are considerations beyond the sub-questions or if the rule should not apply in this case."
          d. If no request, record the computed outcome for Q and adjourn.
          e. If a request is made:
               - Record the name of the member requesting (if permitted by the committee's rules).
               - Hold a vote on Q.
               - Record the vote count for Q and use this as the outcome.

     3. In the minutes:
          - Record the votes on the sub-questions and the computed outcome.
          - Note whether a separate vote on Q was requested and by whom (if recorded).
          - If a separate vote was held, record that vote and note that it overrides the computed outcome.

     Important notes:

     - This procedure may lead to an outcome that is inconsistent with the sub-question votes if a separate vote is held and it differs from the computed outcome. The committee should be aware of this and use the override option judiciously.
     - The chair has discretion in setting the agenda (choosing the sub-questions and the rule) and in recognizing requests. If a request is made without a stated reason, the chair may ask for a reason or rule the request out of order if it is frivolous. The chair's ruling can be appealed by the committee.
     - Members who feel competent only on a subset of questions should participate only in those votes. The chair should remind members to abstain if they are not informed on a particular question.

     This procedure does not guarantee consistency, but it balances efficiency, accountability, and flexibility.

     Example of an outcome you might not like: 
          - A candidate for tenure passes research, teaching, and service by clear majorities, but then a member requests a separate vote on tenure and the committee votes to deny. The candidate is denied despite passing all the sub-questions. The minutes will show the inconsistency, which may lead to criticism. However, the procedure allows this if the committee, in its collective judgment, decides that tenure should be denied for reasons beyond the three criteria.

     The chair should be prepared to defend the fairness of the procedure and the committee's right to consider the question holistically.
answer: |-
  Below is a concise, one-page procedure for committee chairs, designed to handle compound yes/no questions while addressing inconsistency risks. It prioritizes transparency, defensibility, and simplicity, with clear guidance for judgment calls. **The core principle:** Committees must decide whether they are bound by pre-defined logical rules (avoiding direct votes on the main question) or retain flexibility (risking inconsistency). The procedure defaults to logical rules but allows override votes when requested.

  ---

  ### **Voting Procedure for Compound Questions**  
  *For committees deciding a main question (Q) that depends on sub-questions (A, B, C...)*  

  #### **1. Before the Meeting: Set Rules & Agenda**  
     - **Define the logical rule:** Specify how sub-questions determine Q (e.g., "Q = A AND B AND C").  
       *Example: Tenure (Q) requires "yes" on research (A), teaching (B), AND service (C).*  
     - **Publish the rule:** Share the rule and sub-questions with the committee in advance.  
     - **Judgment call:** If sub-questions don’t *strictly* determine Q (e.g., other factors may apply), note this upfront.  

  #### **2. At the Meeting: Voting Order**  
     - **Step 1: Vote on all sub-questions first.**  
       - *Why:* Isolates factual/reason-based judgments. Members abstain on sub-questions where they lack expertise.  
       - *Order:* Chair sets sub-question order; document it.  
     - **Step 2: Compute Q’s outcome** using the pre-defined rule.  
       - *Example:* If A, B, C all pass, Q = "yes".  
     - **Step 3: Announce computed Q.** Then ask:  
       > *"Does any member request a direct vote on Q? This is permitted only if you believe factors beyond the sub-questions justify overriding the rule."*  
     - **Step 4: Outcome decision:**  
       - **No request:** Adopt the computed Q. *No direct vote on Q occurs.*  
       - **Request made:** Hold a direct vote on Q. This overrides the computed outcome.  

  #### **3. Recording & Transparency**  
     - **Minutes must include:**  
       - Votes on all sub-questions (counts/abstentions).  
       - Computed outcome for Q.  
       - Whether a direct vote on Q was requested (and by whom, if rules allow).  
       - If a direct vote occurred, its result and justification for override.  
     - **Chair’s script for defensibility:**  
       *"Our rule defined Q based on [sub-questions]. We voted on sub-questions first to document our reasoning. The direct vote on Q was held only due to a member’s request for override, as our procedure allows."*  

  #### **4. Key Judgment Calls**  
     - **Setting the agenda:** The chair must define the logical rule (Step 1). If sub-questions are ambiguous, default to voting *only* on Q.  
     - **Member expertise:** Abstentions are allowed on sub-questions. No penalty for partial participation.  
     - **Override requests:** Chair may deny frivolous requests but must allow any member who cites a valid reason (e.g., "other factors not covered").  
     - **Inconsistency:** The procedure *does not guarantee consistency* between sub-questions and Q if an override occurs. Document it and move on.  

  ---

  ### **Examples in Practice**  
  #### **1. Promotion Committee (Tenure: Q = A AND B AND C)**  
     - Votes: A (research) = yes, B (teaching) = yes, C (service) = yes → Computed Q = yes.  
     - **Scenario:** A member requests direct vote on Q, and Q fails.  
       - **Outcome:** Tenure denied (override). Minutes show inconsistency and list requester’s reason (e.g., "concerns beyond criteria").  
       - **Why you might dislike this:** Candidate passes all sub-questions but loses on Q. Defensible via override transparency.  

  #### **2. Curriculum Committee (Data-Science Requirement: Q = A AND B)**  
     - Votes: A (majors need it) = yes, B (can staff it) = no → Computed Q = no.  
     - **Scenario:** No override requested.  
       - **Outcome:** Requirement rejected. No direct vote on Q.  

  #### **3. Naming Committee (Remove Donor’s Name: Q = A AND B AND C)**  
     - Votes: A (historical claim) = yes, B (condemnable by era’s standards) = no, C (proportionate) = yes → Computed Q = no.  
     - **Scenario:** Member requests override, arguing modern standards matter more. Direct vote on Q passes.  
       - **Outcome:** Name removed. Minutes note override and reasoning.  

  ---

  ### **What This Procedure Does (and Doesn’t) Solve**  
  - **The impossibility problem:** No system respects majority votes on all propositions while guaranteeing consistency without a veto group (per Arrow/Gibbard-Satterthwaite). This procedure:  
    - Respects majorities on sub-questions *unless* an override occurs.  
    - Avoids veto groups by allowing any member to trigger an override.  
  - **Risks:**  
    - **Override abuse:** A single member can force a direct vote, risking inconsistency. Mitigated by requiring a stated reason for the record.  
    - **Agenda control:** The chair’s choice of logical rule (Step 1) is critical. If flawed, outcomes may be flawed.  
  - **Worst case:** In promotion example, a candidate passes all sub-questions but loses Q after an override. This is inconsistent but defensible via transparency.  

  ---

  ### **One-Page Summary for Chairs**  
  **Do before meeting:**  
  - Define Q and sub-questions (A, B, C...).  
  - Set logical rule (e.g., "Q requires all A, B, C to pass"). Publish it.  

  **At meeting:**  
  1. **Vote on sub-questions** (allow abstentions).  
  2. **Compute Q** using the rule.  
  3. **Announce computed Q.** Ask: "Any request for a direct vote on Q? State your reason."  
  4. **If no request:** Adopt computed Q.  
     **If request:** Vote on Q directly. This overrides computed Q.  

  **Record in minutes:**  
  - Sub-question votes, computed Q, override requests/reasons, and final Q outcome.  

  **When in doubt:**  
  - Default to the logical rule. Allow overrides only for valid reasons.  
  - Document all judgment calls (e.g., "Rule used: Q=A∧B∧C; override requested due to X").  

  This procedure ensures accountability for reasoning, minimizes unnecessary votes, and survives scrutiny via transparency. Inconsistency is possible but rare and justified by recorded overrides.
