  The asymmetry in crediting positive deviations while excusing conformity connects to the "innovation credit/conformity excuse asymmetry." The user needs a term that captures this double standard. 

  I should also differentiate these from adjacent concepts. Presentism is about anachronistically judging the past, but the user's issue is about baseline selection, not temporal bias. Circumstantial moral luck involves factors beyond control affecting blame, but here it's about available knowledge versus norms. 

  For the "man of his time" defense to be legitimate, the epistemic baseline must align with the statistical one—meaning no reasonable alternatives were accessible. For example, if abolitionist ideas weren't circulated or were suppressed, then Jefferson might not be culpable for not knowing. But if such ideas were available, even if unpopular, the defense fails. 

  The user needs precise definitions to apply these concepts. For instance, defining "epistemic availability" rigorously: Were critical perspectives accessible? Were there structural barriers? The user’s examples (Jefferson could have read abolitionist writings) show that availability matters more than prevalence. 

  Finally, proposing terms: "Normative Baseline Conflation" for the first issue, "Complicity Dilution" for the ratchet effect, and "Conformity Excuse Asymmetry" for the credit vs. blame discrepancy. These should be clearly distinguished from existing concepts to avoid confusion in the dissertation.
answer: |-
  Based on your precise dissection, the phenomena you're grappling with aren't typically captured by a *single* established term, but they map onto distinct conceptual problems in moral philosophy and historiography. Here's a breakdown with definitions, distinctions from adjacent concepts, and proposed terminology:

  **1. The Core Conflation: Statistical Normativity vs. Epistemic Availability**

  *   **The Phenomenon:** The "man of his time" defense implicitly and often illegitimately substitutes **statistical typicality** (what most contemporaries *actually* believed/did) for the relevant moral baseline of **epistemic availability** (what reasonable beliefs/actions were *accessible* to the agent, given the evidence, arguments, and moral viewpoints circulating in their context).
  *   **Proposed Term:** **Normative Baseline Conflation (NBC)** or **Comparison Class Substitution Fallacy (CCSF)**
      *   **Definition:** The error of using the statistical prevalence of a belief or practice within an agent's social group or era as the *de facto* standard for judging their moral responsibility, thereby neglecting or dismissing the significance of alternative viewpoints that were epistemically available (even if unpopular or minority) which could have informed a more critical or just stance.
      *   **Scope:** Applies precisely to cases where statistically dominant norms conflict with epistemically available critical alternatives. The defense *fails* when relevant critical perspectives were accessible (e.g., Jefferson & abolitionists, Columbus & Vitoria/De Las Casas, Churchill & anti-imperialists). The defense *holds* only if demonstrably *no* such credible critical perspectives existed or were reasonably accessible to the agent (e.g., judging a 10th-century Viking raider by pre-modern international humanitarian law standards would be genuinely anachronistic).
  *   **Distinctions:**
      *   **Excusable vs. Inexcusable Moral Ignorance:** NBC/CCSF is a *precondition* for assessing ignorance. Arguments about culpable ignorance (e.g., Rosen, FitzPatrick) *presuppose* defining what the agent "should have known." NBC/CCSF occurs when this "should have known" is wrongly equated with "what most people knew" instead of "what was knowable/reasonably accessible" given the agent's position and resources. NBC/CCSF *conflates the baseline*; culpable ignorance debates assess *responsibility relative to a defined baseline*.
      *   **Circumstantial Moral Luck:** Moral luck concerns how factors beyond an agent's control affect their moral status. NBC/CCSF *involves* luck (being born into a society with widespread injustice), but its core is the *epistemological error* of defining the baseline incorrectly. Luck asks: "Is it fair to blame someone for X given their circumstances?" NBC/CCSF asks: "What *is* X in this context? What *was* the standard they failed to meet?" It misdefines X/standard.
      *   **Presentism:** Presentism is the anachronistic imposition of *current* values onto the past. NBC/CCSF *can* involve presentism (if the critical alternative is a modern view), but crucially, it *often doesn't*. Your examples involve *contemporaneous* critical alternatives (abolitionists, Vitoria, anti-imperialists). The error isn't using modern standards, but *ignoring available contemporaneous standards* that were morally superior. NBC/CCSF can occur *without* presentism.
      *   **Diffusion of Responsibility/Structural Injustice:** These focus on how structures distribute agency/complicity. NBC/CCSF is a *distorting lens* applied when analyzing an *individual* within such structures. It *mischaracterizes* the individual's agency by shrinking the perceived scope of reasonable action/belief to the statistically normal, thereby *facilitating* the diffusion ("everyone did it, so no one *could* be blamed").

  **2. The Ratchet Effect: Widespread Complicity Weakens Individual Blame**

  *   **The Phenomenon:** As the pervasiveness and systematicity of wrongdoing increase, the perceived blameworthiness of any individual participant tends to decrease. Systemic injustice creates a perverse inverse relationship: the *worse* the collective sin, the *less* blame attaches to individuals.
  *   **Proposed Term:** **Complicity Dilution Effect (CDE)** or **Structural Blame Attenuation (SBA)**
      *   **Definition:** The tendency to diminish the perceived moral responsibility of individuals for their participation in wrongful actions or systems, proportional to the scale, normalization, and institutional embeddedness of those wrongs within their society or context. The more universal the complicity, the weaker the ascription of blame to any single agent.
      *   **Connection to NBC/CCSF:** CDE/SBA is *powered* by NBC/CCSF. If the statistical norm *is* the baseline (NBC), then widespread wrongdoing *becomes* the de facto "standard," making deviation seem impossible or supererogatory. Conflating the baseline inherently dilutes blame for systemic participation.
  *   **Distinctions:**
      *   **Diffusion of Responsibility:** This is the *phenomenon* CDE/SBA *describes* – responsibility *is* diffused in complex systems. CDE/SBA focuses on the *cognitive/perceptual tendency* to *over-apply* or *misapply* diffusion as an *excuse*, particularly by using statistical norms (NBC) to define away responsibility where epistemic alternatives existed. Diffusion might be real; CDE/SBA is the erroneous *attenuation of individual blame* based on it.
      *   **Structural Injustice (Young):** Young focuses on *assigning responsibility for change* to privileged participants within structures, even without culpable intent. CDE/SBA describes the *opposite tendency*: the *erasure* of responsibility (especially backward-looking blame) precisely *because* the injustice is structural and participation widespread. CDE/SBA is the *obstacle* Young's model tries to overcome.

  **3. The Asymmetry: Credit for Positive Deviation vs. Excuse for Conformity**

  *   **The Phenomenon:** When an agent deviates *positively* from the statistical norm (e.g., scientific genius "ahead of their time"), we readily credit their achievement, implicitly acknowledging the epistemic availability of a better standard. However, when conformity to a *negative* statistical norm is challenged, the same deviation is used as the *baseline* to excuse conformity, ignoring the epistemic availability of a better standard. Conformity to the norm is only demanded as a defense for wrongdoing, not for virtue.
  *   **Proposed Term:** **Conformity Excuse Asymmetry (CEA)** or **Selective Normativity Bias (SNB)**
      *   **Definition:** The inconsistent application of the statistical norm as the relevant baseline: it is discarded as the limit of possibility when praising exceptional virtue or achievement ("ahead of his time"), but rigorously enforced as the defining constraint when excusing conformity to vice or injustice ("man of his time"). This selectively shields negative conformity from blame while allowing positive deviation to receive credit.
  *   **Distinction:**
      *   This is fundamentally a manifestation of a **double standard** or **motivated reasoning** in applying the NBC/CCSF. The core error remains the conflation, but it's applied asymmetrically to serve an apologetic function for historical figures associated with prevailing (but now condemned) injustices.

  **Synthesizing the Argument & Legitimate Use**

  *   The core error is **Normative Baseline Conflation/Comparison Class Substitution Fallacy (NBC/CCSF)**. This fuels the **Complicity Dilution Effect (CDE/SBA)** and is applied asymmetrically via the **Conformity Excuse Asymmetry (CEA/SNB)**.
  *   **Legitimate "Man of His Time" Defense:** This defense is *only* legitimate when **epistemic availability aligns with statistical normativity**. This requires demonstrating that:
      1.  **No Credible Alternatives Existed:** There were no reasonably accessible, coherent, morally superior viewpoints circulating within the agent's epistemic reach (considering their position, education, resources).
      2.  **Barriers Were Insurmountable:** Even if arguments existed *somewhere*, structural barriers (censorship, lack of dissemination, linguistic isolation, suppression) made them genuinely inaccessible *to this agent*.
      3.  **The Wrong Was Truly Unfathomable:** The moral wrongfulness of the action *could not* have been reasonably grasped given the conceptual and normative resources *actually available* at the time (e.g., specific consequences of industrialization not understood in the 18th century).
  *   **Why Your Cases Fail the Defense (Illustrating the Concepts):**
      *   **Jefferson:** Abolitionist arguments *were* epistemically available (widely published, debated in Congress, known to educated elites). Using "Virginia planter norms" is **NBC/CCSF**, leading to **CDE/SBA** (slavery was systemic, so blame diluted). Praising his Enlightenment ideals while excusing slaveholding exhibits **CEA/SNB**.
      *   **Columbus:** De Las Casas (an eyewitness) and the Valladolid debates occurred *within his lifetime/next generation*, drawing on existing Thomist natural law principles. Condemnation was epistemically available *rapidly*. Basing the defense on "15th-century conquest norms" is **NBC/CCSF**.
      *   **Churchill:** Anti-imperialism, critiques of racial hierarchy, and advocacy for Indian self-rule were vibrant within British intellectual and political circles during his career (e.g., Hobson, Morel, Labour Party figures, Indian nationalists themselves). Judging him solely by "imperial establishment consensus" is **NBC/CCSF**, invoking **CDE/SBA** for empire's systemic crimes. His "great leader" status benefiting from deviation credit while his imperial vices get conformity excuse is **CEA/SNB**.

  **Conclusion:**

  You've identified a crucial flaw in historical moral assessment: the unexamined and often illegitimate substitution of statistical norms for epistemic availability as the baseline for blame (**NBC/CCSF**). This conflation drives the dilution of blame for systemic wrongs (**CDE/SBA**) and is sustained by a self-serving asymmetry in how norms are applied (**CEA/SNB**). While adjacent to concepts like culpable ignorance and structural injustice, NBC/CCSF is distinct as it concerns the *definition of the standard itself* rather than responsibility relative to a standard or the structure of agency. By rigorously defining epistemic availability and demanding it as the baseline, you can dismantle the "man of his time" defense in cases like Jefferson, Columbus, and Churchill, reserving it only for genuine historical constraints where no better path was reasonably visible. This sharpens your critique of backward-looking blame by exposing the flawed normative foundations of a common apologetic strategy.
