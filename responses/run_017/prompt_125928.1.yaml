answer: |-
  1. Kripke's paradox highlights there's no *fact about your past mental state or behavior* that uniquely determines you meant addition by "plus" rather than quaddition, challenging traditional accounts of meaning.
  2. Your algebra teacher marks answers wrong based on *current communal agreement* about applying rules like addition, not because your past mental state uniquely fixed the meaning; meaning exists practically through use.
  3. Your friend's physicalist solution (meaning is what your brain *will* output) fails because Kripke's challenge concerns justifying *past* meaning; future behavior doesn't determine what you *meant* before.
  4. Kripke's skeptical solution agrees meaning isn't grounded in individual facts but arises from the *community's dispositions to agree or correct* applications of a rule like addition.
  5. The community-level solution faces a *similar skeptical challenge* about justifying its *own* rule-following, but Kripke argues meaning is sustained through this shared, corrective practice without needing ultimate justification.
