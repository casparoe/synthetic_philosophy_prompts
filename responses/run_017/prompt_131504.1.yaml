prompt: |-
  I work at a chemicals regulator, and two features of our own practice puzzle me. First, an asymmetry of burden: a firm that wants to place a new substance on the market must submit a full safety dossier and wait for approval before it may sell, while a substance that was already on the market when the inventory was compiled may simply remain, often on evidence decades old, until we get around to reviewing it one at a time — even where the older substance's known toxicity is worse than the new one's suspected toxicity. Second, an asymmetry of framing: when we assess a proposed substitute for a hazardous substance already in use, we assess the substitute's risks but treat the harm from continued use of the incumbent as a background condition rather than as something our decision produces, even when our own numbers say that delay in approving the substitute is the larger expected harm.

  I suspect that neither asymmetry is really a view about uncertainty, and I want the alternative tested. My candidate: the practice rests on what I call an *authorship of risk* norm, on which whoever proposes to introduce a hazard is answerable for it in a way that no one is answerable for a hazard that merely persists — so the precautionary principle is triggered by a proposed change in the world with an identifiable proponent, not by the probability or magnitude of the harm.

  Please reconstruct the implicit theory the practice needs: what view of responsibility, risk, or evidence it strictly presupposes, as opposed to what it merely sits well with; which rival views it quietly rules out; and whether the two asymmetries above presuppose the same thing or different things that happen to be compatible. Say where the practice is philosophically underdetermined, so that several incompatible theories would license it. In particular, can the authorship reading be cashed out epistemically — we have lived with the incumbent hazard and so know something of its shape, whereas the new one is untested — rather than morally, and if it can, does the practice then owe us something it currently doesn't deliver, such as a duty to generate evidence about incumbents or to review them on a fixed schedule? Finally, what would a symmetric practice look like: if the risks of the status quo were treated as newly authorised each year, what in our procedure would have to change, and what, if anything, would be lost by the change?

  Two constraints: keep it short — this is a memo I can act on, not a literature review, and I will supply the citations to the precautionary principle literature myself — and be explicit about which parts of the reconstruction hold for any precautionary practice of this shape and which depend on details I have described.
reasoning: |-
  Okay, the user works at a chemicals regulator and is puzzled by two asymmetries in their practice. Let me unpack their concerns. First, there's the burden asymmetry: new substances require full safety dossiers and pre-approval, while existing ones stay on the market with outdated evidence. Second, framing asymmetry: when assessing substitutes, they only evaluate the new risk, treating the existing hazard as background, even if delaying approval causes more harm.

  The user suspects these asymmetries stem from an "authorship of risk" norm, where introducing new hazards makes one responsible, unlike maintaining existing ones. They want to test this theory and understand its philosophical underpinnings.

  Hmm, the key here is reconstructing the implicit theory behind the practice. The authorship norm seems central. It's not just about uncertainty but about moral responsibility tied to agency. Introducing a new hazard requires justification because the proposer is seen as creating the risk. In contrast, existing hazards are viewed as part of the status quo, so no one is actively responsible for maintaining them. This explains why the precautionary principle applies only to new actions.

  But could this be epistemic? Maybe existing substances have some track record, even if data is old. However, the user points out that known toxicity of old substances might be worse than suspected risks of new ones. If it were purely epistemic, there'd be a duty to update evidence on incumbents, which the current practice lacks. So it's more moral than epistemic.

  Now, the two asymmetries. Burden asymmetry comes directly from authorship: new entrants are authors, existing ones aren't. Framing asymmetry is similar; approving a substitute is seen as introducing new risk, while not acting maintains the status quo. So both asymmetries stem from the same norm.

  What rival views does this exclude? Strict utilitarianism would compare overall harms, including from delay. A systematic risk-based approach would require equivalent scrutiny for all substances. But the current practice rules these out by design.

  A symmetric practice would treat existing substances as if they were new each year. That means periodic re-evaluations, fixed review schedules, and considering the harm of inaction as an active choice. The challenge is resource allocation and industry pushback, but it would lead to more consistent risk management.

  Philosophically, the practice is underdetermined. Alternatives like status quo bias or institutional inertia could also explain it without invoking authorship. However, authorship provides a coherent moral rationale, whereas inertia lacks justification.

  The user needs actionable insights. Recommending fixed review schedules and framing approvals as harm-reduction could address the asymmetries. Emphasizing that authorship isn't the only explanation but offers a defensible framework might help them advocate for changes.
answer: |-
  Here’s a concise reconstruction of the implicit theory behind your regulatory asymmetries, actionable insights, and implications for reform:

  ### Core Implicit Theory: Moral Agency Attribution
  The practice strictly presupposes that **moral responsibility for harm hinges on *initiating* a change**, not on *failing to change* a harmful status quo. This is rooted in:
  1. **Causal Agency**: Only *new* actions (placing a substance) have an identifiable agent who "authors" risk. Pre-existing hazards lack a culpable actor.
  2. **Omission Bias**: Harm from inaction (not banning an old substance) is perceived as less blameworthy than harm from action (approving a new substance), even with identical outcomes.
  3. **Status Quo Moral Licensing**: Existing substances are treated as "grandfathered" into moral permissibility; their risks are society’s collective burden, not the regulator’s "fault."

  ### Rival Views Ruled Out
  - **Consequentialism/Utilitarianism**: Rejected because it would require comparing *total* expected harm (including harm from delay in substitution).
  - **Systematic Risk Prioritization**: Inconsistent with privileging pre-existing hazards regardless of relative risk severity.
  - **Strict Epistemic Caution**: Undermined by tolerating outdated data for old substances while demanding novel certainty for new ones.

  ### Are the Asymmetries Unified?
  Both stem from the same **agency attribution norm**: 
  - **Burden Asymmetry**: New entrants "cause" risk; incumbents do not.
  - **Framing Asymmetry**: Approving a substitute is an "action" creating new risk; denying it is "inaction" maintaining background risk.

  ### Can "Authorship" Be Purely Epistemic?
  **No.** An epistemic reading ("we know old hazards better") fails because:
  - Old substances operate on *decades-old data* with unknown contemporary risks (e.g., new exposure pathways).
  - The practice imposes **no duty to update knowledge** or review incumbents proactively. If epistemology drove this, the system would require:
    - Fixed review schedules for all substances.
    - Comparable evidence standards for old and new chemicals.
    - Burden of proof on incumbents to demonstrate ongoing safety.

  ### A Symmetric Practice: Key Changes
  Treating status quo risks as "re-authorized annually" would require:
  1. **Sunset Clauses**: All substances require re-approval every 5–10 years based on modern data.
  2. **Equal Burden**: Incumbents submit dossiers proving safety equivalent to new entrants.
  3. **Holistic Substitution Analysis**: Approving substitutes requires net harm reduction vs. incumbent, not just standalone substitute risk.
  4. **Accountability for Inaction**: Regulators must quantify harm from delayed substitution as a cost of denial.

  ### What Would Be Lost?
  - **Regulatory Capacity**: Significant resource increase needed for reviews.
  - **Industry Stability**: Uncertainty for legacy products/markets.
  - **Political Feasibility**: Lobbying against "retroactive" burdens.

  ### Philosophical Underdetermination
  The practice is compatible with:
  - **Status Quo Bias**: Inertia favors existing systems.
  - **Aversion to Novelty**: Distrust of unknown risks outweighs known harms.
  - **Institutional Risk-Aversion**: Blame for new approvals > blame for old hazards.
  However, **authorship of risk** best explains the *moral* distinction in agency.

  ---

  ### Recommendations for Action
  1. **Advocate for Review Triggers**: Push for automatic reassessment of old substances when new evidence emerges or at fixed intervals.
  2. **Reframe Substitution Decisions**: Quantify "harm of delay" in cost-benefit analyses to offset omission bias.
  3. **Test in Policy Proposals**: Pilot symmetric burden frameworks for high-risk legacy substances (e.g., PFAS, phthalates).

  *This analysis applies generically to precautionary systems prioritizing new entrants over incumbents. Specifics depend on your jurisdiction’s statutory thresholds for evidence and review mandates.*
