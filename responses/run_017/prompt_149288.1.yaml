prompt: |-
  I sit on my hospital's Food and Nutrition Standards Committee as the patient representative, and I have to circulate a written recommendation ten days before our next meeting. The subject has recently stopped being abstract for me. I was admitted here last spring with an infected foot, spent eleven days on a medical ward where the bedside ordering tablet put the grilled chicken and the fruit cup on the first screen and the macaroni and the pudding behind a second one, went home with a type 2 diabetes diagnosis and eleven days' worth of eating habits I had not chosen, and have spent the months since trying to un-choose them. I find that I now want exactly the steering I used to think was condescending. I would like the memo to be addressed to the other eleven people on that committee — several clinicians, a dietitian, a nurse manager, and our chief financial officer — so please write it in a register they can act on rather than in the idiom of a seminar paper.

  The proposal on the table, called Nourishing Defaults, is this. For inpatient trays, the lower-sodium, carbohydrate-appropriate option becomes the pre-selected item on the bedside tablet; selecting anything else costs one extra tap. Nothing is removed from the menu. A card at the bedside says the menu is arranged and that any item can be changed at any time. The same change is proposed for the staff and visitor cafeteria. The committee would run a twelve-month pilot on two medical wards and one surgical ward and then report to the board.

  I need the memo to work through the following, all of which have come up and none of which we have resolved.

  First, several of us think the ward case and the cafeteria case are different in a way the committee keeps sliding past. On the ward, the arrangement serves ends that patients already have: almost nobody admitted to a hospital wants their blood glucose to get worse, and the default helps them get what they were trying to get. In the cafeteria it serves ends we have decided people should have, and a nurse on a double shift who wants the macaroni may simply want the macaroni. One of our clinicians insists this distinction is doing all the moral work and that we should therefore split the proposal. Another says it is a distinction without a difference, because in both cases we are exploiting the fact that people take the path of least resistance. I want a view on which of them is right and what it implies for what we should approve.

  Second, captive population. Patients on a ward cannot leave, are frequently in pain, sedated, or cognitively foggy, are in a novel environment, and are strongly disposed to read anything the hospital does as a recommendation — several have told us they assumed the pre-selected item was what the doctor had ordered for them. The standard line in favour of defaults is that they are permissive because opting out is cheap. But here opting out is cheap once and not cheap sixty times over a fortnight: each re-assertion is a small act of will, performed by someone who is unwell, and it is also an act of disagreeing, out loud, with the institution that is currently keeping them alive. Our dietitian also worries about the opposite failure, that repeated visible steering produces reactance and people start ordering against the default on principle. Does the captive setting change what kind of thing the default is — does it stop being a nudge and become something closer to a standing instruction — and if so, does it need the protections an instruction would need?

  Third, the default is wrong for identifiable people. Patients on renal diets, patients with cachexia or unintentional weight loss, palliative patients for whom appetite matters more than glycaemic control, some pregnant patients, and patients whose religious or cultural dietary practice does not fit the pre-selected items. The default has to be uniform to be cheap to administer, so these groups have to be handled by some carve-out or by clinician override, and we cannot agree whether a carve-out is a technical fix or an admission that the policy is paternalist toward people whose ends we have misdescribed. Relatedly: our committee has authority over food service only, not over what physicians order, so a physician's diet order already binds and the default operates underneath it. I would like the memo to say how much of the third problem that fact actually solves.

  Fourth, an embarrassment. Under the current supplier contract the pre-selected items are roughly sixty cents cheaper per tray than the alternatives, and the CFO's support for the proposal is not separable from that. The draft before us does not mention it. I need the memo to say whether the justification for the policy survives being honest about this, whether it would survive the numbers being reversed, and whether we should disclose the saving to patients and staff even if disclosure is not strictly required for the policy to be justified. Please treat the CFO's position as one a reasonable person could hold and engage it rather than dismissing it.

  Fifth, a thing I proposed myself and cannot get the committee to rule on. Call it Choose Your Own Default: at admission, each patient is asked once which arrangement they want the menu to have for the duration of their stay — heart-healthy items first, the ordinary arrangement, or rotating chef's choice — and the tablet then behaves accordingly. My thought is that letting people select the architecture converts a nudge into something they impose on themselves, which should answer the objection that nudging treats the chooser as a thing to be managed rather than as an agent, and that it also solves my third problem, because the renal and palliative patients would sort themselves out at the front door. The objection from the floor was that the meta-choice is itself framed, that a frightened and unwell patient will take whatever is offered at that point too, and that it adds staff time at admission. I need a considered ruling on whether Choose Your Own Default changes the ethics of the policy or only its appearance, and if it changes the ethics, whether it should be the pilot condition rather than the plain default.

  Sixth, measurement. The board will not let us run different menus on the same ward, so we cannot randomise properly and will have to compare across wards or before and after, which everyone concedes is weaker. We also cannot get individual clinical outcomes linked to tray choices in the pilot period without a data request we have no time for. Given that, tell me what we should insist on recording anyway — opt-out rates, something about who opts out, something about the carve-out groups — and what trigger should force the committee to retire the default. I would also like a condition of the following kind specified: if the pilot shows X rather than Y, we stop or we change, with the threshold named.

  What I want from you is the document itself: a recommendation with conditions and a timeline, addressed to the committee, that says plainly whether to approve the proposal as drafted, approve it in some modified form, split it between the wards and the cafeteria, or decline it; that gives reasons our CFO and the two clinicians who think the whole thing is manipulative could actually reply to; that gives the strongest version of whichever position it rejects; and that ends with a short paragraph on what would have to show up in the pilot for the committee to reverse itself. Where my own sympathies are evident, please argue against me where you think I am wrong rather than accommodating me: I have noticed that having been nudged, and having benefited, has made me less reliable than usual about this.
reasoning: |-
  Okay, the user is a patient representative on a hospital's Food and Nutrition Standards Committee. They need to draft a formal memo recommending whether to approve a "Nourishing Defaults" policy. This policy would make healthier options the pre-selected choice on bedside tablets for inpatients, with less healthy options requiring an extra tap. The same would apply to the staff/visitor cafeteria. 

  The user has a personal stake here - they were recently hospitalized and diagnosed with type 2 diabetes after being exposed to unhealthy default options. This experience has changed their perspective - they now see value in steering choices that they previously found condescending.

  There are six complex issues to address in the memo:
  1) Whether the ward and cafeteria should be treated differently ethically
  2) Concerns about "captive population" dynamics on wards
  3) Exceptions for special dietary needs
  4) The awkward fact that healthier options are cheaper (and the CFO likes this)
  5) The user's "Choose Your Own Default" proposal
  6) Measurement challenges for the pilot

  The memo needs to be actionable for clinicians, a dietitian, a nurse manager, and the CFO. It should acknowledge valid concerns from all sides while making clear recommendations. The tone must be professional but not academic - this is for busy committee members who need to make decisions.

  I'm considering how to structure this. The memo should open with a clear subject line and purpose statement. Then address each concern systematically with:
  - The competing viewpoints
  - Analysis of which position is stronger
  - Specific recommendations

  For the ethical distinction between wards and cafeteria: The clinician arguing they're different is correct. Hospitalized patients have different needs and vulnerabilities than staff making cafeteria choices. The policy should be split.

  For the captive population concern: This is valid. The default becomes more coercive in this setting. The "Choose Your Own Default" option could mitigate this.

  For special dietary needs: The existing physician diet orders already solve most of this problem. The default only applies within those parameters.

  For the cost issue: The financial benefit doesn't invalidate the health justification, but transparency is important.

  For the user's proposal: "Choose Your Own Default" significantly improves the ethics but adds operational complexity. Recommend piloting it on one ward.

  For measurement: Focus on practical metrics like opt-out rates and carve-out usage, with clear thresholds for discontinuing the policy.

  The conclusion should give a clear "approve with modifications" verdict, split the ward and cafeteria policies, and include the user's proposal as an optional pilot element. End with specific conditions under which the committee would reverse the decision.
answer: |-
  **MEMORANDUM**  
  **TO:** Food and Nutrition Standards Committee  
  **FROM:** [Your Name], Patient Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on "Nourishing Defaults" Pilot Proposal  

  ### **1. RECOMMENDATION**  
  Approve the "Nourishing Defaults" pilot **for inpatient wards only**, with modifications:  
  - **Split the proposal:** The cafeteria pilot is deferred pending further ethical review.  
  - **Adopt "Choose Your Own Default"** (Section 5) for one of the three pilot wards.  
  - **Implement carve-outs** for identified clinical/cultural groups (Section 3).  
  - **Disclose cost savings transparently** (Section 4).  
  - **Pilot duration:** 12 months on two medical wards (one with standard defaults, one with "Choose Your Own Default") and one surgical ward (standard defaults).  

  ---

  ### **2. ADDRESSING KEY CONCERNS**  
  **I. Ward vs. Cafeteria: A Critical Ethical Distinction**  
  *The Conflict:* Several members argue that defaults serve patients’ *existing health goals* (e.g., avoiding hyperglycemia), while cafeteria defaults impose *institutional goals* on staff/visitors. Others see both as leveraging "path of least resistance."  
  *Analysis:* **The distinction is ethically significant.** Hospitalized patients are uniquely vulnerable and explicitly seek clinical stability; staff/visitors are making discretionary choices in a non-captive setting. Imposing defaults on the latter crosses into unjustified paternalism.  
  *Recommendation:* **Split the proposal.** Approve inpatient defaults only. Defer cafeteria changes until consensus is reached on whether health-outcome goals apply equally there.  

  **II. Captive Populations: When a "Nudge" Becomes Coercive**  
  *The Conflict:* Patients are physically/emotionally vulnerable and may perceive defaults as medical orders. Repeated opt-outs burden the unwell, while reactance risks defiance.  
  *Analysis:* Defaults in this setting **function closer to a "standing instruction" than a gentle nudge.** However, this is *justified* because:  
  - The alignment with patient goals (e.g., glycemic control) is clinically explicit.  
  - The bedside card clarifies autonomy ("any item can be changed").  
  - **Mitigation:** "Choose Your Own Default" (Section 5) directly addresses coercion concerns by granting agency upfront.  
  *Recommendation:* Proceed with ward defaults, but **require "Choose Your Own Default" on one pilot ward** to test its impact on autonomy/perceived coercion.  

  **III. Identifiable Exceptions: Carve-Outs or Paternalism?**  
  *The Conflict:* Renal, palliative, cachectic, or culturally constrained patients may be harmed by uniform defaults. Carve-outs feel like an admission of paternalism.  
  *Analysis:* **This concern is largely resolved by existing physician diet orders.** The default operates *within* physician-prescribed diets (e.g., a renal patient’s menu already excludes high-sodium options; the default selects the healthiest *permitted* item). For cultural/religious needs, the "opt-out is easy" argument holds *if* diverse compliant options exist.  
  *Recommendation:* **Formalize carve-outs:**  
  - IT flags patients with physician-ordered "liberalized," "high-calorie," or religious/cultural diets.  
  - Their tablets default to the *least restrictive* appropriate option (e.g., high-calorie pudding).  
  - **This is a technical fix, not paternalism:** It corrects for clinical/cultural heterogeneity the default cannot address alone.  

  **IV. Cost Savings: An Embarrassment or Irrelevant?**  
  *The Conflict:* Healthier defaults save ~$0.60/tray. The CFO supports the policy partly for this, but disclosure risks implying profit over care.  
  *Analysis:* **Savings do not invalidate the health rationale**, but transparency is crucial for trust. If costs reversed, the *health justification stands* – the goal is better outcomes, not savings.  
  *Recommendation:* **Disclose savings openly in committee reports and pilot evaluations.** State: "While operational efficiencies exist, the primary aim is improving patient health. Savings will be reinvested in nutritional education."  

  **V. "Choose Your Own Default": Ethics or Optics?**  
  *Your Proposal:* Let patients select their default architecture at admission (heart-healthy, standard, or rotating).  
  *Objections:* Adds admission burden; vulnerable patients may accept any framed option.  
  *Analysis:* **This substantively changes ethics, not just optics.** It:  
  - Treats patients as agents co-designing their environment.  
  - Eliminates Section 3 concerns (patients self-select appropriate defaults).  
  - May reduce reactance (Section 2).  
  *Recommendation:* **Pilot this on one medical ward.** If opt-out rates/reactance are lower here, it becomes the ethical standard. *Addressing objections:* Use a scripted, neutral prompt (e.g., "Which menu layout suits your needs?") – no added staff time vs. explaining dietary restrictions.  

  **VI. Measuring Success: What Matters?**  
  *Constraints:* No ward-level randomization; no linked clinical data.  
  *Essential Metrics:*  
  1. **Opt-out rate:** % of meals where non-default is selected.  
  2. **Carve-out utilization:** % of flagged patients using overrides.  
  3. **Patient/staff surveys:** Perceived coercion, satisfaction (quarterly).  
  4. **Cafeteria parallel:** Track sales mix changes (for future debate).  
  *Triggers to Retire Defaults:*  
  - **Hard trigger:** Opt-out rate >40% sustained over 3 months.  
  - **Soft triggers:** Significant negative feedback in surveys; carve-out usage >15% without clinical flags.  
  *Pilot Success Condition:* If opt-out rates are ≤25% *and* surveys show neutrality/positive feedback on autonomy, recommend hospital-wide rollout.  

  ---

  ### **3. CONCLUSION & CONDITIONS FOR REVERSAL**  
  Approve the modified pilot (inpatient wards only, with carve-outs, "Choose Your Own Default" on Ward B, and cost transparency). This balances ethical agency, clinical pragmatism, and measurable outcomes.  

  **The committee should reverse its position if the pilot shows:**  
  1. Sustained high opt-out rates (>40%) indicating rejection;  
  2. Survey evidence of widespread distress or perceived coercion;  
  3. Inadequate carve-out function (e.g., >15% of flagged patients report harm).  

  The cafeteria proposal requires separate ethical review focused on voluntariness and institutional authority over staff choices.  

  Respectfully submitted,  
  [Your Name]  
  Patient Representative  

  ---  
  **Rationale for Key Positions:**  
  - *Against cafeteria inclusion:* Staff/visitors lack a unified "health goal" the hospital can assume; imposing defaults there oversteps.  
  - *For "Choose Your Own Default":* It transforms nudging into collaborative agency. If it fails, we learn; if it succeeds, it resolves core objections.  
  - *For CFO engagement:* Savings enable sustainability; dismissing this alienates a key ally. Transparency ensures alignment with health-first goals.
