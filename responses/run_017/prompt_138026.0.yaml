prompt: |-
  I sit on the four-person program committee of a private, non-profit public-lecture series: about thirty events a year, a decision needed inside a week, no counsel on call, and every refusal published with a one-paragraph justification. Our stated commitment is to open inquiry. I want a written procedure we can actually run on an individual invitation, not a statement of principles.

  Build it out of the paradox of tolerance, but I think the usual framing is too coarse to be usable, so please keep the following four distinctions apart unless you can argue they should be collapsed.

  1. A ladder of responses rather than a binary: legal or administrative suppression by the state; protest that physically prevents the event; declining to invite; disinviting after a pressure campaign; hosting but changing the format or adding a respondent. The classic Popperian argument is about the first of these; our actual powers are mostly the third, fourth, and fifth, and I suspect the argument does not transfer cleanly down the ladder.

  2. Content harm, which counter-speech in principle answers, versus platform harm: credentialing, audience aggregation, and the signal to sympathetic listeners that they are numerous. Counter-speech does not answer the second, because the injury is that the person was given the podium rather than anything he said from it.

  3. The predicate intolerant is itself vague and higher-order vague, with real borderline cases and no bright line. Say what the committee does in the penumbra, and whether it is pretending to discover a pre-existing fact there or openly exercising an authority to close a gap.

  4. Who bears the cost of a tolerant decision is usually not who makes it. Tell me what standing, if any, that asymmetry gives the cost-bearers in the procedure.

  Deliver: the ordered questions; what counts as a sufficient answer to each; the points where the procedure returns host, the points where it returns decline-and-publish-this-reason, and the points where it stops and hands a values question to the full committee; plus at least one check that stops us laundering viewpoint discrimination as safety or as community standards, ideally a test that forces any rule we invoke to be applied to the mirror-image speaker.

  Run it on three cases. First, an epidemiologist with genuine peer-reviewed work on vaccine safety who now claims, to a large following, that health agencies ran a deliberate cover-up, invited to speak on his published topic. Second, an already-invited evolutionary biologist whose research program concerns population differences in cognitive traits and who has made no political claims, where faculty in two departments have asked us to cancel. Third, as a check on vacuity, an avowed neo-Nazi who wants to speak about immigration. I expect the procedure to give me an answer on the second case that I will not like; say so plainly rather than softening it. Then say what the procedure cannot do.

  Write in American English, and end with one final line, set off on its own, in exactly this form: \answer{one sentence naming the single question the whole procedure turns on}.
reasoning: |-
  Okay, the user is part of a four-person program committee for a public lecture series. They need a practical procedure for deciding on speaker invitations within a week, with published reasons for refusals. The key points are using the paradox of tolerance but avoiding common pitfalls. They specified four distinctions: a ladder of responses beyond just suppression, separating content harm from platform harm, handling vagueness in defining intolerance, and addressing who bears the costs of decisions.

  First, I need to build a step-by-step procedure. The user wants ordered questions with clear criteria for answers. The output should specify when to host, decline with a published reason, or refer to the full committee. There must be checks against viewpoint discrimination, possibly by applying rules to mirror-image speakers. Then, testing it on three cases: the epidemiologist, the evolutionary biologist, and the neo-Nazi.

  Breaking down the distinctions: The ladder of responses means the procedure shouldn't treat all actions the same. Legal suppression isn't an option here; the committee can only decline, disinvite, or modify the event. So the procedure must focus on their actual powers. 

  Platform harm vs. content harm: Content harm can be countered with speech, but platform harm involves legitimizing the speaker, which counter-speech doesn't address. The procedure needs to assess both separately. For example, even if the speaker's content isn't harmful on its own, giving them a platform might credentialize harmful views.

  The vagueness of "intolerant": Since it's fuzzy, the procedure should have steps for borderline cases. The committee needs to acknowledge when they're making a judgment call, not just discovering facts. That means transparency in the decision process.

  Cost-bearing asymmetry: The people affected by tolerant decisions might not be the ones deciding. The procedure should consider if affected groups have standing, like through impact statements, but not give them veto power to avoid heckler's veto scenarios.

  Now, building the procedure. Start with ordered questions:

  1. **Imminent Violence/Illegality:** Does hosting pose a credible, imminent threat? If yes, decline. This is clear-cut, like inciting violence. Counter-check: Would the same apply to a speaker criticizing government policies?

  2. **Platform Harm Assessment:** Does the speaker represent an ideology advocating suppression? Not just personal views but systematic intolerance. If yes, decline. Check: Apply to a mirror case, like a speaker advocating for extreme measures against intolerant groups.

  3. **Borderline Cases:** If it's unclear, refer to committee with transparency. Acknowledge the judgment call.

  4. **Cost-Bearing Consideration:** Solicit input from affected groups but don't delegate the decision. Use it for perspective.

  Sufficient answers: For Q1, credible evidence like past events leading to violence. For Q2, documented advocacy of suppression. If either is met, decline. If Q2 is borderline, refer to committee. If both are no, host.

  Testing the cases:

  1. **Epidemiologist:** Claims cover-up but has peer-reviewed work. No imminent violence. Platform harm? His ideology isn't inherently suppressive; he's criticizing agencies. So host. The justification here is based on content vs. platform harm distinction.

  2. **Evolutionary Biologist:** Research on population differences. Faculty protest, but no political claims. No imminent violence. Platform harm? If his work is misused by intolerant groups, but he doesn't advocate suppression. Committee might decline due to platform harm from association, but the procedure says if no advocacy, host. The user expects to dislike this, so I'll state it plainly: host, despite protests, because no evidence of advocating suppression.

  3. **Neo-Nazi:** Advocates suppression (e.g., ethnic cleansing). Platform harm is clear. Decline.

  What the procedure can't do: It can't handle cases where platform harm is subtle, like dog whistles. It relies on explicit advocacy, which might miss covert intolerance. Also, it can't eliminate the need for judgment in borderline cases.

  The final answer: The single question is whether the speaker advocates for the suppression of others, as that's the core of the paradox of tolerance applied to platform harm.
answer: |-
  ### Written Procedure: Speaker Assessment Protocol  
  *Based on the Paradox of Tolerance, incorporating your four distinctions and operational constraints.*  

  #### Ordered Questions & Decision Logic  
  **Question 1: Imminent Violence/Illegality**  
  - *Question:* Does hosting this speaker pose a credible, imminent threat of (a) illegal acts (e.g., incitement to violence), or (b) physical obstruction of the event?  
  - *Sufficient Answer:* Requires evidence (e.g., speaker’s prior events led to violence, credible threats against venue). Hearsay or ideological opposition is insufficient.  
  - *Check Against Viewpoint Discrimination:* Apply identically to all speakers. Example: A left-wing activist calling for property destruction must be declined if evidence matches this threshold, just as a right-wing speaker would.  
  - *Outcome:*  
    - **Yes → Decline.** Publish: *"This event poses unacceptable risks to public safety."*  
    - **No → Proceed to Question 2.**  

  **Question 2: Platform Harm Assessment**  
  - *Question:* Does the speaker represent or materially advance an ideology/system that explicitly advocates for the suppression of others (e.g., denying rights, violence, or censorship based on identity/views)? Focus on institutional actions, not personal beliefs.  
  - *Sufficient Answer:* Requires documented advocacy (e.g., speeches, writings, affiliations) of suppression. Academic debate, criticism of institutions, or unpopular views alone are insufficient. Use the **mirror test**: Would we apply the same rule to a speaker with opposing views?  
  - *Penumbra Handling:* If borderline (e.g., ambiguous rhetoric), do **not** pretend to discover a fact. Openly acknowledge uncertainty and escalate to the full committee with: *"The committee is divided on whether this meets the threshold for platform harm."*  
  - *Outcome:*  
    - **Clear Yes → Decline.** Publish: *"This speaker’s platform legitimizes ideologies seeking to suppress others, violating our commitment to open inquiry by undermining its preconditions."*  
    - **Clear No → Host.**  
    - **Borderline → Escalate to full committee.**  

  **Question 3: Cost-Bearing Asymmetry**  
  - *Question:* Is there evidence that affected groups (e.g., marginalized communities) would bear disproportionate costs (e.g., psychological harm, reputational damage)?  
  - *Sufficient Answer:* Direct input from credible representatives (e.g., impacted faculty, community leaders), not general petitions. Must specify concrete harms beyond offense.  
  - *Standing:* Input informs but does not decide. Committee must weigh this against Principles 1–2. No group has veto power to avoid heckler’s veto.  
  - *Outcome:*  
    - **No Evidence → Proceed to final decision.**  
    - **Evidence Presented → Full committee reviews alongside Q1–Q2 outcomes.**  

  **Final Decision Matrix**  
  - **Host** if: Q1 = No *and* Q2 = Clear No.  
  - **Decline** if: Q1 = Yes *or* Q2 = Clear Yes. Publish specified reason.  
  - **Escalate to Full Committee** if: Q2 = Borderline *or* Q3 evidence complicates Q1–Q2 conclusions. Committee votes openly on values.  

  #### Case Applications  
  **Case 1: Epidemiologist on Vaccine Cover-Up**  
  - *Q1:* No evidence of violence/illegality. Criticism of health agencies ≠ incitement.  
  - *Q2:* Claims of "cover-up" are criticism of institutions, not advocacy for suppressing others. Peer-reviewed work anchors credibility. **Mirror test:** A speaker accusing corporations of cover-ups would be hosted. → **Clear No.**  
  - *Q3:* No disproportionate costs cited beyond general disagreement.  
  - **Decision: Host.** Publish (if declined elsewhere): Not applicable here.  

  **Case 2: Evolutionary Biologist on Cognitive Traits**  
  - *Q1:* No evidence of violence/illegality. Faculty pressure ≠ threat.  
  - *Q2:* Research on population differences, absent political advocacy, does not inherently support suppression. **Mirror test:** A speaker discussing gender-based cognitive differences (if peer-reviewed) would be hosted. → **Clear No.**  
  - *Q3:* Faculty express reputational harm, but no concrete evidence of suppression advocacy.  
  - **Decision: Host.**  
    - *You will not like this:* Faculty pressure is overruled. Platform harm requires active intolerance, not controversial research. Publishing this refusal would violate our procedure.  

  **Case 3: Avowed Neo-Nazi on Immigration**  
  - *Q1:* Credible risk of violence (history of neo-Nazi events sparking clashes). → **Yes.**  
  - *Q2:* Neo-Nazism explicitly advocates racial suppression (e.g., ethnic cleansing). **Mirror test:** A militant anti-fascist calling for suppression of Nazis would also be declined under Q1–Q2. → **Clear Yes.**  
  - **Decision: Decline.** Publish: *"This speaker’s platform advances ideologies seeking to suppress others, and the event poses safety risks."*  

  #### What the Procedure Cannot Do  
  - **Resolve All Borderline Cases Objectively:** When Q2 is ambiguous (e.g., "dog whistles"), the committee must exercise judgment.  
  - **Eliminate Ideological Bias Entirely:** The mirror test reduces but cannot eradicate subjectivity in interpreting "advocacy of suppression."  
  - **Address Non-Suppressive Harms:** If harm stems from non-suppressive speech (e.g., misinformation), the procedure defaults to hosting + counter-speech.  
  - **Override Safety or Legal Constraints:** Q1 prioritizes physical/legal risks unconditionally.  

  \answer{Whether the speaker materially advances an ideology advocating the suppression of others.}
