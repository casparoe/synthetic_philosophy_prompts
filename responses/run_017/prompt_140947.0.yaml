answer: |-
  You make a clever point, and I'll grant that, *descriptively*, we often become aware of our own unreliability through others flagging patterns or biases. The ex-member forum, the concerned friend – yes, they often provide the *diagnosis* that my first-order judgments are poisoned. **But that's where the borrowing stops, and the real work begins.** Recognizing "I am unreliable in domain X" is fundamentally different from accepting "Action Y in domain X is wrong" on their say-so. The former is a *meta-cognitive* judgment about my capacities – akin to realizing my vision is blurry and I shouldn't trust my eyesight for detail work without correction. It doesn't tell me *what* the moral truth is; it only tells me *I* can't see it clearly right now. 

  This diagnosis creates the necessary epistemic humility and motivation. It forces me to step back, scrutinize my own reasoning, engage with the reasons *for* and *against* Y presented by others or discovered myself, and ultimately strive to *reconstruct* the justification internally. The therapist or friend might point me *towards* reasons or frameworks, but the crucial act – the grasping and weighing of those reasons *as decisive for me* – cannot be outsourced. Accepting their *diagnosis* of my unreliability isn't acquiring moral knowledge *about Y*; it's recognizing an obstacle *to* acquiring it myself. The remedy isn't deference moved up; it's using external input to trigger and inform an essential process of *internal* recalibration and firsthand understanding. Deferring to the verdict on Y remains the servile act; heeding the warning about my own blindness is the first step towards autonomy. So, is the *trigger* testimonial? Often, yes. But the *moral knowledge itself*? Absolutely not. That has to be earned. Your move.
