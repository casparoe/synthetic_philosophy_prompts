  ## The Arbiter’s Veil

  The house stood at the edge of the coastal bluffs, its weathered clapboards silvered by salt and wind. Inside, the ghosts of Elara’s childhood whispered—her mother’s laughter in the sunroom, Mira’s footsteps racing down the hall. Now, those ghosts were all that remained. Their mother’s will had left the house to both sisters equally, a final, bittersweet act that had thrust them into the arbitration house’s cold embrace. Neither wanted to fight. But without a settlement, the house would be sold, the proceeds split, and every memory within its walls scattered like seafoam.

  Elara sat in her city apartment, staring at the arbitration house’s rules on her screen. Each party submitted a *delegate*—a program that would inspect the other’s source code and decide: SETTLE or FIGHT. The payoffs mirrored the prisoner’s dilemma: mutual settlement meant a fair split; mutual defiance meant a forced sale; and if one settled while the other fought, the fighter would take everything. The textbook solution was simple: submit a delegate that settled only if the opponent’s code was identical to your own. *Reciprocity through recognition*. But it was brittle, and in this world, everyone knew it. A single altered comment could trigger war.

  Then there was the scrambler. For a fee, you could veil your delegate. The scrambler would transform it into a program that behaved identically on every input but shared no recognizable structure with the original. A veil hid your strategy, your vulnerabilities, your very *self* from prying eyes. But it also hid you from recognition. And it was proven: no algorithm could reliably decide if two arbitrary programs behaved the same. Transparency, once the bedrock of cooperation, now felt like a cracked foundation.

  Elara knew Mira would be agonizing over the same choice. They hadn’t spoken since the funeral, grief and old rivalries hardening into silence. But Elara remembered Mira’s tears at their mother’s bedside, the way she’d clutched the old seashell necklace—their mother’s favorite. Mira loved the house as fiercely as Elara did. They *both* wanted to settle. They had to. Yet without communication, how could they ensure their delegates wouldn’t doom them? A recognizability test—checking for identical code—would fail if either veiled. They needed something deeper, something that relied on *behavior*, not syntax.

  She began to code. Her delegate wouldn’t demand a guarantee of perfect equivalence—an impossible ask. Instead, it would test for alignment on a shared language of trust. She embedded a fixed set of 1,024 test cases: inputs representing every conceivable strategy. Some were simple strings ("ALWAYS_SETTLE", "ALWAYS_FIGHT"). Others were complex, like a tit-for-tat program that settled only if its opponent would settle against *itself*. The last test case was the delegate’s own source—a self-referential gamble. Her delegate would simulate the opponent on each test input, step-limited to prevent stalling, and check the outputs. If they matched her delegate’s expected responses for *every* case, it would SETTLE. Otherwise, FIGHT.

  It was robust. If Mira submitted the *same* delegate, their programs would behave identically—passing each test—even if veiled. If one veiled and the other didn’t, the unveiled delegate would see scrambled code but run the tests; the veiled one would see raw code and do the same. Both would settle. *Unless Mira chose differently*. Unless Mira, fearing betrayal, submitted a primitive recognizer. Elara’s stomach tightened. This wasn’t just code; it was a leap of faith. She typed the final lines.

  ---

  Mira stood in her rented studio, the sea air drifting through an open window. She could almost smell the bluffs. Her mother’s last words echoed: *"Don’t let the house break you two apart."* But how? The arbitration rules forbade promises, side channels, any hint of collusion. The delegate was the only voice allowed.

  She considered the scrambler. Veiling would hide her delegate’s logic—and her heart. Elara might see her raw code as a plea or an insult. Their relationship was a tapestry of love and friction: Elara, pragmatic and reserved; Mira, impulsive and open. What if Elara submitted a brute-force recognizer, demanding identical code as proof of loyalty? Mira’s veiled delegate would fail that test, and they’d both lose everything.

  *No*. She had to trust Elara’s cleverness, her shared love for the house. Mira coded a delegate with the same 1,024 test cases. Each test was a question: *"What would you do against a defector?" "What would you do against yourself?"* The answers had to align perfectly. It was a hand extended in the dark, a hope that Elara would grasp it. She hesitated over the scrambler option. Veiling felt like a shield—but also a signal. *I trust you to find me, even when I’m hidden*. Or maybe, *I fear your eyes on my soul*. Her finger hovered, then clicked "VEIL". The scrambler transformed her elegant code into an obfuscated tangle, behavior intact, structure obliterated.

  ---

  Elara saw the option: VEIL or UNVEIL. If she unveiled, Mira might see desperation in her code—or worse, arrogance. If she veiled, Mira might think her guarded, distrustful. But Mira had always been braver. Elara pictured her sister as a child, jumping off the bluffs into the churning sea. *Trust her to choose well*. She veiled her delegate.

  ---

  The arbitration house’s machine ran without spectacle. Two delegates submitted: one veiled, one veiled. Both scrambled beyond recognition.

  **First delegate (Elara’s, veiled):**  
  It received the opponent’s code—a chaotic mess of loops and variables. No resemblance to her own. It began the tests. Input 1: "ALWAYS_SETTLE". Simulated opponent output: SETTLE. *Expected*. Input 2: "ALWAYS_FIGHT". Opponent: FIGHT. *Expected*.  
  ...  
  Input 1,023: A tit-for-tat variant. Opponent: SETTLE. *Expected*.  
  Input 1,024: *Its own scrambled source code*. A risk. It simulated the opponent running *this* tangled program. The opponent output: SETTLE. *Expected*.  
  All 1,024 tests passed. It printed: SETTLE.

  **Second delegate (Mira’s, veiled):**  
  It received an equally alien string. Same tests. Same outputs. Same result: SETTLE.

  ---

  The verdict came by drone: mutual settlement. The house would be held in shared trust, its doors open to both. Elara stood on the bluffs that evening, the wind pulling at her coat. Mira’s car crunched up the gravel drive. They met on the porch, the silence heavy but soft.

  "You veiled," Mira said, not a question.  
  "So did you."  
  "I was afraid you’d think I didn’t trust you."  
  A smile touched Elara’s lips. "I thought the same."  
  Mira held out a spare key. "The test cases... Mother’s seashells. You remembered."  
  Elara took the key. "How could I forget?"  
  No apologies, no explanations. Just the house, the sea, and the unspoken truth: they had asked their delegates not *"Are we the same?"* but *"Will you meet me here?"* And they had.

  ---

  **Note: Survival with Weaker Scrambler Guarantee**  
  If the scrambler guaranteed identical behavior only for the first million inputs, the solution would still hold. Each delegate tests a fixed set of inputs (1,024 in this story). As long as these inputs fall within the first million covered by the scrambler—which they would, since 1,024 << 1,000,000—the behavior remains identical during arbitration. The delegates do not rely on inputs beyond their test set, nor do they consume a million steps; each test is step-limited. Thus, the critical alignments would still be detected, and settlement would occur. The approach is robust to this weakened scrambler.
