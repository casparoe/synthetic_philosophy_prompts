prompt: |-
  Hi — I'm a journalist covering science and ideas, and I've been reporting on effective altruism on and off for about a decade: the pledge, the earning-to-give years, the turn toward longtermist cause areas, the blowups, the critiques. I want to write a piece not on who's right but on why the argument never moves. Every time I publish something on EA I get the same three complaints in my inbox, and every time I put them to an EA I get the same three replies, and nobody concedes anything, which after ten years looks to me like a structural fact about the dispute rather than stubbornness.

  The three, as I'd spell them out: (1) the institutional or structural critique — that EA treats every problem as an allocation problem for individual wallets and donors, and so systematically ignores who holds power and why the arrangements that produce the harm persist; the usual reply is that EA only ever asked which use of a dollar does the most good, and would happily fund institutional change if that's what the evidence favoured. (2) the earning-to-give critique — that taking a lucrative job in finance or tech and giving most of it away makes you complicit in the harms of the industry and turns morality into a ledger you can balance at the end of the month; the reply is that the counterfactual does the work, since if you hadn't taken the job someone else would have, and they wouldn't have donated. (3) the measurability critique — that the money flows to whatever is quantifiable and near-term rather than to what matters most, and that the numbers come out of the same models as the interventions, so the measurement isn't independent of what it's measuring; the reply is that uncertainty isn't a reason to weight everything equally, and that making the reasoning explicit at least exposes it to correction.

  My working hypothesis is that this isn't one stalled disagreement but three of different logical types marching under one banner: (a) an empirical question about leverage, replaceability and causal attribution in systems where the counterfactual is contested; (b) a question about the unit of moral agency — individual, institution, movement, or something else; (c) an epistemic question about acting on measurements when the metric and the intervention are model-dependent in the same way. And then something leftover that I don't have a name for: critics often seem to be objecting to the legitimacy of a bunch of wealthy donors deciding what counts as the world's most pressing problems, which isn't an efficacy claim at all, and no amount of evidence about bednets or cash transfers would touch it. I've started calling that the authorization problem, since what's at issue is who gets to do the prioritizing, not what the priorities should be.

  So: diagnose it. For each of the three (plus the leftover), tell me what kind of disagreement it actually is — factual, about units of agency, about which values, about the standard of argument, verbal, or a mix — and whether my hypothesis is right or whether I'm manufacturing tidiness. Is any of it a genuinely verbal dispute riding on 'effective', 'the most good', or 'systemic'? Is there a hidden empirical question that, if somebody actually answered it, would settle part of it? What would count as progress for each, concretely — a study, a distinction, a change of question — and is there any part where I should just tell my readers no progress is available and why? A table with the critiques down the side would be easiest for me to work from, but I don't want a survey of who said what and I don't want a verdict on who wins; I want the shape of the thing.

  End with a final line \answer{...} containing at most six words naming the single thing you think is really holding the debate up.
reasoning: |-
  Okay, the user is a science journalist who's covered effective altruism (EA) for a decade. They want to write about why the arguments around EA never seem to move forward. They've identified three recurring critiques and responses, plus a "leftover" authorization problem. Their hypothesis is that these are three distinct types of disagreements, and they want me to diagnose each one - not to pick sides but to clarify the structure of the debate.

  First, let's break down each critique they mentioned:

  The institutional critique is about EA ignoring power structures. This seems fundamental - it's about whether social change happens through individual donations or systemic shifts. The disagreement here appears to be about moral agency (individual vs collective) and values (efficiency vs justice). Even if EA funded institutional change, critics might still object to wealthy donors setting priorities.

  The earning-to-give critique involves complicity in harmful industries. This mixes empirical questions (would someone else take that job?) with conceptual ones (can money "wash" moral complicity?). The core tension is between consequentialist ethics and other moral frameworks that view actions as inherently right or wrong.

  The measurability critique questions whether EA's focus on quantifiable outcomes misses what truly matters. This is deeply epistemological - it's about how we know what's effective when metrics are intertwined with interventions. The disagreement centers on standards of evidence and how to act under uncertainty.

  That leftover "authorization problem" is particularly thorny. It's not about effectiveness but legitimacy - who has the right to decide global priorities. This is a values clash about democratic accountability versus technocratic expertise, and evidence won't resolve it.

  For each point, I should identify:
  - The type of disagreement (factual, conceptual, values-based)
  - Whether the user's hypothesis holds
  - What would constitute progress
  - Whether it's resolvable

  The user specifically wants a table format with critiques down the side, so I'll structure my response that way. I'll avoid taking sides or declaring winners - just map the terrain.

  For the final six-word answer... the authorization problem seems most fundamental. It's not about being effective but about who gets to define effectiveness. "Who decides what good is" captures that core tension.
answer: |-
  Here's a structural diagnosis of the recurring EA debates, matching your hypothesis to the critiques and specifying the nature of each disagreement. The table format organizes your three core critiques plus the "authorization problem," categorizing the *type* of disagreement, assessing your hypothesis, outlining what progress might look like, and noting resolvability.

  | Critique                     | Type of Disagreement                                                                 | Hypothesis Assessment                                                                 | What Progress Looks Like (Concrete)                                                                                                 | Resolvable?                                  |
  | :--------------------------- | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------- |
  | **1. Institutional/Structural** | **Primarily conceptual/values-based** (unit of agency: individual vs. systemic). Secondary **empirical** (leverage of donations vs. power-shifting). | **Correct**: You identified the agency/value clash (b). Empirical disputes (a) exist but are secondary. | Distinguishing *scope* (EA as *one* tool vs. *the* tool) & clarifying value differences (efficiency vs. justice). Case studies of EA-funded power-shifting interventions. | Partially (empirical overlaps can be tested; core values clash persists). |
  | **2. Earning-to-Give**       | **Mixed**:<br>- **Empirical** (counterfactual replaceability: a)<br>- **Conceptual** (moral complicity vs. net impact: b)<br>- **Values** (deontology vs. consequentialism). | **Correct**: You identified empirical (a) & agency (b) dimensions. Add **values clash** (consequentialism vs. intrinsic wrongs). | Empirical studies on job replaceability. Philosophical work reconciling complicity with counterfactual reasoning. Distinction between "is this net beneficial?" vs. "is this *permissible*?". | Limited (empirical gaps can narrow; moral frameworks are foundational). |
  | **3. Measurability**         | **Epistemic** (c): Standards of evidence, model-dependency, acting under uncertainty. Secondary **values** (what "matters most" & is legible). | **Correct**: Core is epistemic (c). Values dimension (quantifiable vs. intangible goods) is underacknowledged. | Developing "second-order" metrics for robustness/uncertainty. Case studies of EA adapting to unmeasurable goods. Distinction between *measurement limitations* vs. *measurement corruption*. | Partially (better epistemic practices possible; incommensurability of values remains). |
  | **4. Authorization Problem** | **Political/Values-based**: Legitimacy of elite priority-setting vs. democratic/participatory norms. **Not efficacy-based**. | **Correct**: You named the core issue (legitimacy). It's **foundational** and distinct. | Transparency in decision-making (e.g., EA funds publishing grant criteria). Experiments in participatory priority-setting. Clarity that this is a *separate* critique from effectiveness. | No (resolving requires shifting political values or power structures, not evidence). |

  ### Key Diagnoses & Your Hypothesis
  - **Your hypothesis holds**: The three core critiques *are* distinct logical types (empirical/agency/epistemic). The "authorization problem" is a separate, values-based legitimacy challenge.
  - **"Verbal Dispute" Element?** Limited. While "effective" and "systemic" carry baggage, disagreements are substantive. Critics mean "ignores power" by *systemic*; EAs mean "rigorous" by *effective*. Clarifying terms helps but doesn’t resolve core clashes.
  - **Hidden Empirical Questions?** Yes, but partial:
    - For (1): *Under what conditions does funding institutional change outperform direct interventions?* (Settles overlap, not agency clash).
    - For (2): *How replaceable are high-impact roles in harmful industries?* (Settles empirical layer, not complicity ethics).
    - For (3): *Can robustness checks or alternative metrics reduce model-dependency?* (Improves practice, doesn’t eliminate epistemic caution).
  - **Progress vs. Dead Ends**:  
    - **Progress possible** on empirical overlaps (1,2), epistemic rigor (3), and transparency (4).  
    - **No progress available** on foundational values clashes: individual vs. collective agency (1), complicity ethics (2), elite legitimacy (4). Here, the debate *can’t* move—only be mapped.

  ### Why the Argument Never Moves
  The stalemate arises because **empirical disagreements are entangled with irreconcilable differences in values, epistemology, and political legitimacy**. Critics and EAs argue past each other by:
  1. **Mixing Frames**: EAs answer efficacy critiques with counterfactuals; critics answer with legitimacy/agency critiques.
  2. **Asymmetric Burden of Proof**: Critics demand EA disprove systemic harm; EAs demand critics prove inefficacy.
  3. **Overlapping Disputes**: A single critique (e.g., earning-to-give) contains empirical *and* moral layers, each requiring different resolutions.

  \answer{Who decides what good is}
