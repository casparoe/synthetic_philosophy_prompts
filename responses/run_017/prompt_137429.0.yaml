  **Interim Guidance on the Retention of Factual Material and the Management of Public Assertion**

  **Issuing Body**: Bureau of Public Communication (BPC)  
  **Effective Date**: [Redacted]  
  **Reference**: BPC Circular 23-01  
  **Supersedes**: None (Interim Guidance)

  **1. Purpose and Scope**  
  1.1. This interim guidance establishes standardized procedures for the retention of factual material and the management of public assertion by personnel. It applies to all senior staff and designated communicators within the Bureau and its affiliated offices.  
  1.2. The guidance is designed to promote operational efficiency and to minimize the potential for inconsistent or unauthorized disclosures that may compromise the integrity of public communication.  
  1.3. Compliance with this guidance is mandatory and shall be incorporated into standard operating procedures at all levels.  

  **2. Definitions**  
  2.1. **Factual Material**: Any information, regardless of form or medium, that purports to describe, represent, or otherwise pertain to a state of affairs, event, or condition.  
  2.2. **Public Assertion**: Any statement, whether written or oral, made by personnel in an official capacity to external parties, including but not limited to the media, public forums, and official releases.  
  2.3. **Knower**: An individual who, by virtue of their role, assignment, or access, possesses unmediated factual material.  
  2.4. **Pre-decisional Material**: Factual material generated during the deliberative process prior to the finalization of a decision or policy.  
  2.5. **Operational Necessity**: The requirement for retention of factual material based on immediate operational needs, as determined by the unit head.  

  **3. Principles of Retention and Management**  
  3.1. Factual material shall be retained only to the extent required by operational necessity. The default position is non-retention.  
  3.2. The burden of retention must be balanced against the risk of misinterpretation, misuse, or unauthorized disclosure.  
  3.3. The primary objective is the effective management of public assertion, ensuring that such assertions are consistent, defensible, and free from personal bias.  
  3.4. Historical preservation of factual material is not a consideration unless mandated by statute or regulation.  

  **4. Preemptive Dispersal of Knowledge**  
  4.1. To mitigate the risk of concentrated knowledge, which may lead to unauthorized assertions, factual material shall be disaggregated across multiple units or individuals.  
  4.2. No single individual shall be designated as the sole repository of any set of factual material. Instead, material shall be distributed such that each holder possesses only a fragmentary understanding.  
  4.3. Access to factual material shall be granted on a strict need-to-know basis, as determined by the unit head in accordance with Section 11.3.  
  4.4. The aggregation of disaggregated material is prohibited except for the purpose of generating public assertion under controlled conditions (see Annex A).  

  **5. Oral Communications**  
  5.1. Where feasible, briefings, advisements, and deliberations shall be conducted orally.  
  5.2. Written records of oral communications are not required unless specifically mandated by higher authority or by the nature of the communication (e.g., legal proceedings).  
  5.3. In the event that a written record is mandated, it shall be classified as pre-decisional and subject to the retention limitations outlined in Section 7.  
  5.4. Personnel are reminded that oral communications, by their nature, leave no permanent record and thus minimize the risk of future misinterpretation.  

  **6. Draft Management**  
  6.1. Draft documents, including reports, memoranda, policy papers, and public statements, are considered pre-decisional.  
  6.2. Drafts must be clearly marked as such and circulated only within the immediate working group.  
  6.3. Once a final version is approved, all drafts and associated notes shall be destroyed.  
  6.4. Under no circumstances shall draft material be retained for historical or reference purposes.  

  **7. Pre-decisional Material**  
  7.1. Pre-decisional material is provisional and does not represent the official position of the Bureau.  
  7.2. Such material shall not be retained beyond the decision point, except when required for legal or audit purposes, as determined by the Office of General Counsel (OGC).  
  7.3. Any public assertion based on pre-decisional material is strictly prohibited.  
  7.4. Pre-decisional material must be segregated from final records and destroyed at the earliest opportunity.  

  **8. Deniability Protocols**  
  8.1. All public assertions must be structured to allow for plausible deniability. This is achieved by ensuring that assertions are based on processed inputs rather than direct knowledge.  
  8.2. Factual material underlying public assertions shall be managed such that no single individual can be identified as the source of the assertion.  
  8.3. Public assertions must be derived from aggregated and anonymized inputs, as detailed in Annex A.  
  8.4. The use of conditional language (e.g., "it is assessed that," "available information suggests") is encouraged to reinforce the provisional nature of the assertion.  

  **9. Unauthorized Assertion of Personal Knowledge**  
  9.1. Personnel are prohibited from making public assertions based on personal knowledge that has not been processed through the procedures outlined in this guidance.  
  9.2. Personal knowledge is defined as factual material that an individual has acquired through direct experience or unmediated access.  
  9.3. Violation of this provision constitutes a disciplinary offense and may result in administrative action, including reassignment or termination.  

  **10. Training and Awareness**  
  10.1. Unit heads are responsible for ensuring that all personnel are trained on the provisions of this guidance.  
  10.2. Training shall emphasize the importance of adhering to procedures for the collective benefit of the organization.  
  10.3. Annual refresher briefings shall be conducted to reinforce compliance.  

  **11. Records Management**  
  11.1. The retention of factual material shall be minimized in accordance with Section 3.  
  11.2. Records that must be retained shall be stored in designated systems with restricted access.  
  11.3. Access to retained records shall be logged and audited periodically.  
  11.4. Records not subject to retention requirements shall be destroyed promptly.  

  **12. Review and Compliance**  
  12.1. Unit heads are responsible for ensuring compliance with this guidance within their respective units.  
  12.2. The Bureau of Public Communication will conduct periodic reviews to assess implementation and effectiveness.  
  12.3. Non-compliance shall be reported to the Office of Internal Oversight for further action.  

  **Annex A: Specimen Application of Guidance to Public Statement on Event X**  

  **Background**: Event X is an occurrence that may attract public attention and requires an official response.  
  **Objective**: To issue a public statement that is consistent with operational requirements while adhering to the principles of this guidance, particularly the avoidance of concentrated knowledge.  

  **Procedure**:  
  A.1. Initial reports on Event X are collected by the Situation Room. These reports are pre-decisional and subject to Section 7.  
  A.2. The reports are disaggregated:  
  - Assignment of cause analysis to Unit A (with access limited to raw data on cause).  
  - Assessment of impact to Unit B (with access limited to impact data).  
  - Contextual factors to Unit C (with access limited to background information).  
  A.3. Units A, B, and C provide oral briefings to the drafting team. No written records of these briefings are retained.  
  A.4. The drafting team, which has no direct knowledge of Event X, produces a draft public statement based solely on the oral briefings.  
  A.5. The draft is reviewed by the units for factual accuracy? — No. Review is limited to ensuring that the statement does not reveal any unit's specific knowledge.  
  A.6. The final public statement is approved by the designated authority. The draft and any working notes are destroyed.  
  A.7. The statement is delivered by the designated communicator, who has been provided only with the final text and no additional context.  

  **Result**: The public assertion is made without any individual being in a position to know the full factual material underlying the event. The statement is therefore not a lie, as no knower has denied the truth. Moreover, the assertion cannot be refuted by reference to any retained factual material, as such material has been disaggregated and not retained beyond operational necessity.  

