  ### Interim Guidance on the Retention of Factual Material and the Management of Public Assertion  
  **Issuing Body**: Bureau of Public Communication (BPC)  
  **Effective Date**: [Redacted]  
  **Reference**: BPC Circular 23-01  
  **Supersedes**: None (Interim Guidance)  

  #### 1. Purpose and Scope  
  1.1. This guidance standardizes procedures for retaining factual material and formulating public assertions.  
  1.2. Applies to all personnel with communication responsibilities (Grade GS-14 and above).  
  1.3. Objectives: Ensure consistency in public messaging, minimize operational friction, and align assertions with institutional priorities.  

  #### 2. Definitions  
  2.1. **Factual Material**: Data or observations pertaining to events, conditions, or outcomes.  
  2.2. **Public Assertion**: Official statements disseminated to external audiences.  
  2.3. **Operational Necessity**: Retention justified only by immediate functional requirements.  
  2.4. **Pre-decisional Material**: Drafts, analyses, or deliberations preceding final policy adoption.  

  #### 3. Principles of Retention  
  3.1. Retain factual material solely for operational necessity. Historical preservation is not a criterion.  
  3.2. Prioritize transient media (e.g., oral briefings) over permanent records to reduce misinterpretation risks.  
  3.3. Avoid concentrated knowledge: Distribute factual subsets across units to prevent comprehensive awareness.  

  #### 4. Preemptive Dispersal Protocols  
  4.1. Fragment factual material into compartmentalized subsets (e.g., Unit A: event chronology; Unit B: contextual analysis; Unit C: impact assessment).  
  4.2. Restrict cross-unit data sharing unless authorized under Section 7.2 (not yet issued).  
  4.3. Designate assertion drafters with access only to aggregated summaries, not source material.  

  #### 5. Oral Communication Procedures  
  5.1. Prefer oral briefings for sensitive matters. Written transcripts are discouraged.  
  5.2. If documentation is unavoidable, classify as pre-decisional and destroy after use.  
  5.3. Example: Field reports shall be verbally summarized; originals deleted within 24 hours.  

  #### 6. Management of Drafts and Pre-decisional Material  
  6.1. Label all drafts "PRE-DECISIONAL—DESTROY AFTER ACTION."  
  6.2. Prohibit circulation beyond immediate workgroups.  
  6.3. Destroy drafts upon approval of final assertions; backups are non-compliant.  

  #### 7. Deniability Frameworks  
  7.1. Base public assertions on processed inputs, not primary observations.  
  7.2. Use passive voice and indefinite sourcing (e.g., "it is assessed that," "available information indicates").  
  7.3. Ensure no single individual can verify an assertion’s accuracy against personal knowledge.  

  #### 8. Unauthorized Assertion of Personal Knowledge  
  8.1. Personnel making assertions grounded in unmediated experience or unprocessed data commit a Category 3 offense.  
  8.2. Penalties: Mandatory retraining, suspension, or termination.  
  8.3. Rationale: Individual knowledge introduces subjectivity and accountability voids.  

  #### 9. Compliance and Review  
  9.1. Unit heads must audit retention practices quarterly.  
  9.2. Report deviations to the Office of Protocol Integrity (OPI) using Form BPC-9a (attached).  

  #### Annex A: Worked Example—Public Statement on "Project Beacon"  
  **Scenario**: Media inquiries regarding unexpected outcomes from Project Beacon.  
  **Procedure**:  
  - Step 1: Data disaggregated—Unit 1 (technical metrics), Unit 2 (budgetary context), Unit 3 (external factors). No cross-unit briefings.  
  - Step 2: Drafting team receives oral summaries from units. No written records retained.  
  - Step 3: Final assertion: "Technical assessments of Project Beacon remain within anticipated parameters, accounting for variable external conditions."  
  - Step 4: Origin data destroyed; assertion drafted without reference to ground-level observations.  
  **Outcome**: No personnel possess comprehensive knowledge of Project Beacon. Assertion is uncontestable.  

  #### Form BPC-9a: Compliance Certification  
  I, [Name], certify that all factual material under my purview was:  
  ☐ Retained per operational necessity (Cite: Section 3.1)  
  ☐ Disaggregated across ≥2 units (Cite: Section 4.1)  
  ☐ Destroyed upon decision finalization (Cite: Section 6.3)  
  *Signature*: ___________________  
  *Date*: [Redacted]  

