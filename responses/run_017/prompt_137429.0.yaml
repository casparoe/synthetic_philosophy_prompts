  **Interim Guidance on the Retention of Factual Material and the Management of Public Assertion**

  **Issuing Body**: Bureau of Public Communication (BPC)  
  **Effective Date**: [Redacted]  
  **Reference**: BPC Circular 23-01  
  **Supersedes**: None (Interim Guidance)

  **1. Purpose and Scope**  
  1.1. This interim guidance provides standardized procedures for the retention of factual material and the management of public assertion by personnel. It applies to all senior staff and designated communicators.  
  1.2. The guidance aims to ensure consistency in public communication and to minimize the risk of unauthorized disclosures.  

  **2. Definitions**  
  2.1. **Factual Material**: Any information, regardless of form, that purports to describe a state of affairs.  
  2.2. **Public Assertion**: Any statement made by personnel in an official capacity to external parties.  
  2.3. **Knower**: An individual who, by virtue of their role, has access to unmediated factual material.  
  2.4. **Pre-decisional Material**: Factual material generated prior to the finalization of a decision or policy.  

  **3. Principles of Retention and Management**  
  3.1. Factual material shall be retained only to the extent required for operational necessity.  
  3.2. The burden of retention must be balanced against the risk of misinterpretation or misuse.  
  3.3. The primary objective is the effective management of public assertion, not the preservation of historical record.  

  **4. Preemptive Dispersal of Knowledge**  
  4.1. To mitigate the risk of concentrated knowledge, factual material shall be disaggregated across multiple units.  
  4.2. No single individual shall be designated as the sole repository of any set of factual material.  
  4.3. Access to factual material shall be granted on a strict need-to-know basis, as determined by the unit head (see also Section 7.2).  

  **5. Oral Communications**  
  5.1. Where feasible, briefings and advisements shall be conducted orally.  
  5.2. Written records of oral communications are not required unless specifically mandated by higher authority.  
  5.3. In the event that a written record is mandated, it shall be classified as pre-decisional and subject to the provisions of Section 8.  

  **6. Draft Management**  
  6.1. Draft documents, including but not limited to reports, memoranda, and policy papers, are considered pre-decisional.  
  6.2. Once a final version is approved, all drafts shall be destroyed.  
  6.3. Drafts must not be circulated beyond the immediate working group.  

  **7. Pre-decisional Material**  
  7.1. Pre-decisional material is provisional and does not represent the official position.  
  7.2. Such material shall not be retained beyond the decision point, except when required for legal or audit purposes, as determined by the Office of General Counsel.  
  7.3. Any public assertion based on pre-decisional material is prohibited.  

  **8. Deniability Protocols**  
  8.1. All public assertions must be structured to allow for plausible deniability.  
  8.2. Factual material underlying public assertions shall be managed such that no single individual can be identified as the source of the assertion.  
  8.3. Public assertions must be based on aggregated and anonymized inputs, as detailed in Annex A.  

  **9. Unauthorized Assertion of Personal Knowledge**  
  9.1. Personnel are prohibited from making public assertions based on personal knowledge that has not been processed through the procedures outlined in this guidance.  
  9.2. Violation of this provision constitutes a disciplinary offense and may result in administrative action.  

  **10. Review and Compliance**  
  10.1. Unit heads are responsible for ensuring compliance with this guidance.  
  10.2. The Bureau of Public Communication will conduct periodic reviews to assess implementation.  

  **Annex A: Specimen Application of Guidance to Public Statement on Event X**  

  **Background**: Event X involves an occurrence that may attract public attention.  
  **Objective**: To issue a public statement that is consistent with operational requirements while adhering to the principles of this guidance.  

  **Procedure**:  
  A.1. Collect initial reports on Event X. These are pre-decisional and subject to Section 7.  
  A.2. Disaggregate the reports: assign analysis of cause to Unit A, assessment of impact to Unit B, and contextual factors to Unit C.  
  A.3. Units A, B, and C provide oral briefings to the drafting team. No written records of the briefings are retained.  
  A.4. The drafting team produces a draft public statement. This draft is circulated only within the team and destroyed upon approval of the final version.  
  A.5. The final public statement is based solely on the aggregated inputs from the units and avoids any assertion that could be traced to a specific knower.  
  A.6. The statement is delivered by the designated communicator, who has no direct knowledge of Event X beyond the statement itself.  

  **Result**: The public assertion is made without any individual being in a position to know the full factual material. The statement is therefore not a lie, as no knower has denied the truth.  

