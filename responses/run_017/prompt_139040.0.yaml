prompt: |-
  I'm assembling a set of teaching cases on allocation under scarcity, in the lifeboat idiom, and for the past two years I've been logging my co-instructor's verdicts as she gives them — she has now ruled on something like forty variations. I have a new case I want to use, and I'd like to know what she will say about it before I put it to her. More usefully, I'd like to know what rule she is running: everything she has said so far is jointly consistent with several rules that come apart on this case, and I don't trust myself to work out which.

  Here are the five verdicts I take to carry the information. In every case, eject means put a passenger over the side by force, against their will, with no consent and no prior agreement among those aboard; in every case the boat is taking water and the alternatives are ejecting someone or risking foundering.

  1. Ten aboard. Unless one goes over, the boat founders within minutes and all ten drown; if one goes over, the other nine survive. All are strangers, equally healthy, no one at fault. No straws, coins, or other randomizer is available, and in practice the three strongest would simply choose — and they would choose the oldest passenger. Verdict: no one may be ejected; they should all go down.

  2. As in 1, except that a proper lottery is available. Verdict: they should draw lots, and the loser may be put over; nine lives rather than none.

  3. Twelve aboard. The boat will hold out until rescue only if one seat is freed. One passenger has injuries that will kill him within the hour whatever anyone does; the others will all survive if the boat holds out. Verdict: the injured man goes over, no lottery needed, and insisting on one would be a kind of fetish.

  4. Ten aboard. One passenger deliberately loosened a plank the night before, hoping to cover a theft; the boat is leaking because of him, and it founders within the hour unless one goes over. Verdict: the saboteur goes over, no lottery needed.

  5. Eight aboard. One passenger is in a panic, thrashing at the gunwale, and will capsize the boat within minutes. There is no way to sedate or restrain him, and no other passenger's removal would help. Verdict: he may be put over, even though he is at fault for nothing — as she put it, it is he who will capsize the boat.

  She has also said, generally, that she distrusts any rule under which the people who end up surviving get to decide who dies.

  The new case. Eight aboard; rescue is expected in about six hours. With eight aboard there is roughly a 70 percent chance of foundering before rescue and all hands lost; with any seven aboard, about 20 percent — the passengers are close enough in weight that it does not much matter which one goes. A, aged 34 and healthy, climbed aboard against the crew's express order after being told the boat was at capacity; his weight is the last increment, he meant no harm, and he has not damaged the boat. B, aged 76, has a heart condition and perhaps five years of expected life remaining against A's forty-odd, but a good chance of surviving the six hours if the boat stays afloat. The other six are healthy adults of middle age, none at fault. A lottery is possible but would require the bailing to stop for twenty minutes, which the crew puts at about five percentage points of additional risk. Alternatively the decision can be deferred an hour, at about two points of additional risk, by which time they will know whether the leak is worsening.

  So: does she eject A, eject B, run the lottery anyway, eject no one, or wait? Please give me the verdict you expect with a rough confidence, then the rules that fit the whole track record and what each predicts here — my own guesses are a lexical-responsibility rule, a least-to-lose rule keyed to what is at stake, a procedural rule requiring equal chances, and a rule on which merely probabilistic benefit can never license killing, but I don't know which of these she is running or whether the real one is something I haven't listed. Note that no single passenger's presence is necessary or sufficient for foundering here, so whether A is the threat in the sense of case 5 is itself part of what is at issue, and treat waiting as a distinct verdict rather than folding it into one of the others. Then give me the single further case — as minimal a variation as you can manage — that would best separate the leading candidates, and tell me, if the track record genuinely underdetermines the answer, what she would be committing herself to under each resolution.
reasoning: |-
  Okay, I need to figure out what rule the co-instructor is using based on her past verdicts and predict her decision for the new case. Let me start by analyzing the five given verdicts to identify patterns.

  First, in case 1, with ten strangers and no lottery, she says no one may be ejected; they all go down. That suggests she doesn't allow forced ejection without some procedural fairness or justification. Even though the strongest would choose the oldest, she rejects that, emphasizing no consent or prior agreement.

  Case 2 is similar, but a lottery is available. Here, she approves drawing lots to eject one, saving nine lives. So, randomness makes ejection permissible. The key difference from case 1 is the presence of a fair procedure.

  Case 3 involves twelve aboard, with one injured passenger who will die within the hour regardless. She says eject him without a lottery, calling it a "fetish" to insist on one. So, if someone is already doomed and their ejection saves others, no lottery is needed. This focuses on inevitability of death versus saving lives.

  Case 4 has a saboteur who caused the leak. Ejecting him is allowed without a lottery. Here, responsibility matters—the person at fault can be ejected.

  Case 5 involves a panicking passenger who will capsize the boat. Ejection is permitted because his actions directly threaten everyone immediately. Even though he's not at fault, he's the proximate cause of the threat.

  Additionally, she distrusts rules where survivors decide who dies, which aligns with rejecting the strongest choosing in case 1.

  Now, the new case: eight aboard, with A (34, healthy, boarded against orders) and B (76, heart condition, 5 years left vs A's 40). Reducing to seven lowers risk from 70% to 20%. Lottery adds 5% risk; waiting an hour adds 2%.

  Possible rules from the co-instructor's verdicts:

  1. **Procedural Fairness Rule**: Ejection requires a fair lottery when no other justification exists. Seen in case 2 vs case 1. Case 3 and 4 have justifications without lottery.

  2. **Least-to-Lose Rule**: Prioritize saving those with more life expectancy. But case 3 ejects the injured despite others having more life, because he's dying anyway. Case 5 ejects the panicker who might have full life. So probably not primary.

  3. **Responsibility/Lexical Rule**: Eject those at fault (saboteur) or direct threats (panicker). Case 4 and 5 support this.

  4. **Inevitability/Medical Necessity**: Eject if death is imminent regardless, like case 3.

  5. **No Probabilistic Killing**: Case 1 might suggest that mere probability doesn't justify killing, but case 2 allows it with lottery, so it's conditional on procedure.

  In the new case, A is at fault for boarding against orders, similar to the saboteur but less malicious. B has reduced life expectancy but isn't dying imminently. The risk is probabilistic, not certain death.

  Applying the rules:

  - **Responsibility Rule**: A boarded without permission, causing the overload. Eject A without lottery, like the saboteur in case 4.

  - **Procedural Rule**: Since lottery adds risk, but waiting less, she might prefer waiting or avoid lottery if possible. But case 3 rejects lottery when unnecessary.

  - **Inevitability**: Doesn't apply; both A and B could survive.

  - **Least-to-Lose**: Ejecting B saves more life-years (B has 5 years vs A's 40), but she hasn't used this explicitly. Case 3 ejects the dying man, but that's different.

  Her distrust of survivors deciding points against ejecting B based on life expectancy without a fair process.

  In case 5, the panicker is ejected as the direct threat, but here A isn't actively threatening; his presence is a static risk.

  The co-instructor might see A as responsible for the situation, so eject A without lottery. Waiting an hour could be an option to reassess with less risk.

  But in case 1, even with certain death, no ejection without lottery. Here, the risk is probabilistic, 70% vs 20%, not certain. Her case 2 allows probabilistic saving with lottery, but without it? Case 1 disallows it, so perhaps without procedure, probabilistic benefit doesn't justify killing.

  But in new case, lottery adds 5% risk. Is that acceptable? Case 2 had no such risk, lottery was safe. Here, adding risk might make lottery problematic. Waiting adds only 2% and provides more info.

  Perhaps she prefers waiting to avoid immediate action, especially since deferring has lower risk.

  But if she waits, no one is ejected yet, but the risk remains high.

  Looking back at case 3, she ejects the injured without lottery because his death is certain. Here, no one's death is certain, and ejection is based on probability.

  In the new case, A's action caused the overload, similar to the saboteur but without intent to harm. Case 4 saboteur had intent; here A meant no harm. Is responsibility lessened?

  But the co-instructor might still hold A responsible for disobeying orders, leading to the situation.

  Case 5 ejects the panicker who is faultless but directly causing capsize. Here, A's presence is the cause, but passive.

  I think the key rules in play are:

  - **Rule 1: Lexical Responsibility** - Eject those at fault or who caused the situation (cases 4 and 5). Predicts eject A.

  - **Rule 2: Procedural Fairness** - Require lottery unless strong justification (cases 2 vs 1, and case 3 justification). Here, with lottery adding risk, might avoid or wait. But case 3 shows justification without lottery.

  - **Rule 3: No Probabilistic Killing Without Procedure** - Like case 1, probabilistic benefit doesn't justify killing without lottery. But here, lottery is possible but risky.

  - **Rule 4: Least Harm** - Minimize loss of life, but not clearly applied in past cases.

  For the new case, if she follows responsibility, eject A. If procedural, might do lottery despite risk or wait. But lottery adds 5% risk, which could be seen as unacceptable, similar to case 1 where no procedure was available.

  In case 1, no procedure, so no ejection. Here, procedure exists but adds risk. Is that equivalent to no procedure?

  Case 2 had no added risk for lottery, so it was safe.

  Perhaps she requires a costless procedure; if costly, it might not be feasible.

  Waiting has only 2% added risk, which is lower, and provides info. She might prefer that.

  But in terms of ejection, if they wait and leak worsens, they might need to act later.

  I think for prediction, based on responsibility, she ejects A without lottery.

  In case 4, saboteur is ejected without lottery; here A disobeyed orders, so similar fault.

  In case 5, panicker is ejected as direct threat; A isn't threatening now.

  So responsibility rule fits.

  For the verdict: I think she will say eject A, no lottery needed, because he caused the overload by boarding against orders.

  Confidence: medium, say 70%, because A's fault is less severe than saboteur.

  Now, for separating cases.

  Suppose a case where one passenger is very old with little life left, but no one at fault, and no lottery available. Like case 1 but with age difference. But in case 1, all equal, no ejection. If unequal, without procedure, she might still say no ejection, per case 1.

  Or a case where someone is terminally ill but not imminently dying, like B but without A's fault.

  Minimal variation: Ten aboard, boat will founder with 90% probability unless one ejected. All strangers, healthy, no fault. No lottery available. What does she say?

  If she says no ejection, consistent with case 1 and no probabilistic killing without procedure. If she allows ejection, it might be least-to-lose or utilitarianism.

  But from case 1, with certain death, no ejection without lottery, so with high probability, probably same.

  Another variation: Someone with shorter life expectancy but no fault, and lottery available. If she draws lots, procedural; if ejects the older, least-to-lose.

  But she distrusts survivors deciding, so probably requires lottery even if one has less to lose.

  In case 3, she ejects the dying man without lottery because he dies anyway.

  In the new case, B has only 5 years, but not dying imminently.

  So separating case: Six aboard; one has a terminal illness with six months to live, but stable for now. Boat will founder with 80% probability unless one ejected; with five, 10%. No one at fault. Lottery possible with no added risk. Verdict?

  If she runs lottery, procedural fairness. If ejects the ill person, least-to-lose or medical grounds. But since not imminent, she might require lottery.

  Based on case 3, only imminent death justifies without lottery.

  So for separating, that case would show if least-to-lose applies or only procedural/imminence.
answer: |-
  Based on the co-instructor's track record of verdicts and her stated distrust of rules where survivors decide who dies, I'll first predict her verdict for the new case, then outline the key rules consistent with her past decisions and how they apply here. Finally, I'll propose a minimal variation to separate the leading rules and explain what each resolution would commit her to.

  ### Predicted Verdict for the New Case
  - **Verdict**: Eject A without a lottery, and do not wait.  
  - **Confidence**: ~75% (high confidence in ejection, but moderate uncertainty on timing/lottery due to probabilistic elements).  
  - **Reasoning**:  
    A boarded against explicit orders, directly causing the overload and increased risk. This mirrors the "responsibility" principle from Case 4 (saboteur ejected) and Case 5 (panicker ejected as an immediate threat), where fault or direct causation justifies ejection without a lottery. A's action, though not malicious, created the scarcity, making him analogous to the "threat" in Case 5. B's age and health are irrelevant here, as the co-instructor has never prioritized life expectancy (e.g., Case 3 ejects the injured man despite others having more to lose, focusing on inevitability, not quantity).  
    - The added risk of a lottery (5%) or waiting (2%) makes procedural fairness less appealing, as Case 3 shows she rejects "fetishistic" lotteries when unnecessary. Her distrust of survivor-led decisions also rules out letting the group choose based on B's lower life expectancy.  
    - Waiting is rejected because it adds avoidable risk (2%) without resolving the core issue: A's presence caused the problem, and deferring action might worsen outcomes.  
    - Probabilistic benefit alone (70% → 20% risk) doesn't justify killing without a strong reason (per Case 1), but A's responsibility provides that reason.  

  ### Rules Consistent with the Track Record
  Your co-instructor's verdicts are jointly consistent with **three primary rules**, all of which prioritize avoiding survivor bias and contextual justification over utilitarian outcomes. The rules that fit all five cases are:

  1. **Lexical Responsibility Rule**:  
     - **Description**: Ejection is permitted only if the person is directly responsible for the scarcity (through fault or action) or if their death is inevitable regardless of intervention. Randomizers are required only when no such justification exists. Fault or direct causation overrides life expectancy or probabilistic calculations.  
     - **Support from Cases**:  
       - Case 4: Saboteur (fault) ejected without lottery.  
       - Case 5: Panicker (direct threat) ejected despite no fault.  
       - Case 3: Injured man (inevitable death) ejected without lottery.  
       - Case 1: No fault or inevitability, so no ejection even for certain benefit.  
       - Case 2: No fault or inevitability, so lottery required for fairness.  
     - **Prediction for New Case**: Eject A (fault for boarding against orders, causing overload) without lottery or waiting. Life expectancy (A vs. B) is irrelevant. Waiting adds unnecessary risk.  
     - **Strength**: Best fit for Cases 4 and 5, and explains rejection of survivor-led decisions in Case 1.

  2. **Procedural Fairness Rule with Exceptions**:  
     - **Description**: Ejection requires a fair randomizer (e.g., lottery) unless there is a strong, non-probabilistic justification (e.g., inevitable death or direct causation). Probabilistic benefits alone never license killing without a procedure, and procedures must be low-cost. Life expectancy or fault without direct causation doesn't override the lottery requirement.  
     - **Support from Cases**:  
       - Case 2: Lottery required when no justification exists.  
       - Case 3: No lottery needed due to inevitability (non-probabilistic justification).  
       - Case 4: No lottery due to fault (direct causation).  
       - Case 5: No lottery due to direct threat (immediate causation).  
       - Case 1: No justification and no procedure, so no ejection—probabilistic benefit (certain death avoided) is insufficient alone.  
     - **Prediction for New Case**: Run a lottery despite the 5% added risk, or wait if it reduces procedural risk. A's fault isn't severe enough to override procedure (unlike sabotage in Case 4), as he "meant no harm." B's life expectancy isn't a justification. Waiting might be preferred to gather information with lower risk (2%), but if the leak worsens, a lottery would then be run.  
     - **Strength**: Best fit for Cases 1–2, and explains Case 3's "fetish" comment—exceptions are narrow.

  3. **No Probabilistic Killing Rule**:  
     - **Description**: Killing is never permitted based on probabilistic benefits (e.g., risk reduction) alone; it requires certainty of harm or inevitability. Ejection is allowed only if the person is a direct cause of imminent harm (e.g., thrashing) or if their death is certain regardless. Randomizers are acceptable only for certain survival benefits (Case 2) but add risk here. Life expectancy and fault are secondary.  
     - **Support from Cases**:  
       - Case 1: Probabilistic benefit (certain death avoided) insufficient without procedure.  
       - Case 2: Certain survival with lottery makes it permissible.  
       - Case 3: Inevitable death justifies ejection.  
       - Case 4: Saboteur's action makes harm certain, not probabilistic.  
       - Case 5: Panicker causes imminent, certain harm.  
     - **Prediction for New Case**: Eject no one and wait, or run a lottery only if risk becomes certain. The 70% risk is probabilistic, not certain, so ejection isn't justified. A's fault isn't sufficient because he didn't cause certain harm (unlike Cases 4–5). Waiting defers the decision with minimal added risk (2%) and might reveal certainty. If the leak worsens, a lottery could be run.  
     - **Strength**: Explains Case 1 and distinguishes probabilistic vs. certain harm in Cases 3–5.

  **Why Other Rules Don't Fit**:  
  - **Least-to-Lose Rule (life expectancy)**: Contradicts Case 3, where the injured man (with less to lose) is ejected without considering others' life expectancy. Also, Case 5 ejects a panicker who might have had a full life.  
  - **Utilitarian Rule (maximize lives saved)**: Contradicts Case 1, where saving nine is rejected without a procedure.  
  - **Equal Chances Rule**: Contradicts Cases 3–5, where lotteries are bypassed. Her "fetish" comment in Case 3 shows she doesn't require equal chances when justification exists.

  ### Underdetermination and Key Tensions
  The track record underdetermines the verdict because all three rules fit the cases but diverge on the new scenario:
  - **Lexical Responsibility** and **No Probabilistic Killing** both eject A, but for different reasons (fault vs. direct threat), and both reject waiting/lottery due to added risk.  
  - **Procedural Fairness** requires a lottery or waiting, clashing with the others.  
  The ambiguity stems from **A's role**: Is he a "threat" like the panicker (Case 5) or merely at fault like the saboteur (Case 4)? Case 4 involved intent, while A "meant no harm," weakening the responsibility claim. Also, the probabilistic risk (70% vs. 20%) isn't addressed directly in past cases—Case 2 had certain outcomes, while Cases 3–5 had imminent/certain harm.

  ### Separating Case: Minimal Variation to Distinguish Rules
  To resolve the ambiguity, propose this case:  
  - **Scenario**: Ten aboard; rescue in 8 hours. With ten, 80% chance of foundering; with nine, 10% chance. One passenger (C) has a terminal illness and will die in 3 months regardless, but is stable now. Others are healthy, no fault, and no randomizer is available (so no lottery option). C has 3 months of life expected; others have 40+ years.  
  - **Question**: May C be ejected to reduce risk?  

  **How This Separates the Rules**:  
  - **Lexical Responsibility Rule**: Eject C? No. No fault, inevitability (3 months) isn't imminent enough (cf. Case 3's "within the hour"), and no direct causation. Verdict: No ejection; all ride it out.  
  - **Procedural Fairness Rule**: Eject C? No. No justification for bypassing a lottery, but no lottery is available. Like Case 1, no ejection is permitted without a procedure. Verdict: No ejection.  
  - **No Probabilistic Killing Rule**: Eject C? No. Probabilistic benefit (80% → 10%) alone doesn't justify killing; no certainty or direct threat. Verdict: No ejection.  

  **Expected Verdict from Co-Instructor**: Based on her history, she would likely say **no ejection**, as all rules align here. But if she *did* allow ejecting C, it would imply an unstated "least-to-lose" element, contradicting her track record (e.g., Case 3 doesn't use life expectancy).  

  **What Each Rule Commits Her To**:  
  - If she **ejects no one** in this variation (as expected), it supports all three rules and doesn't resolve the new case ambiguity.  
  - To force a separation, add: *What if C's illness causes mild instability, slightly increasing foundering risk by 5%?*  
    - **Lexical Responsibility**: Eject C only if the instability makes C a direct cause (like panicker in Case 5).  
    - **Procedural Fairness**: Still no ejection without lottery.  
    - **No Probabilistic Killing**: Eject only if instability creates certain harm (e.g., capsize risk).  

  Given your co-instructor's consistency, the Lexical Responsibility Rule is the strongest candidate for the new case (eject A), but the Procedural Fairness Rule could prevail if she views A's fault as insufficient. Use the separating case to clarify.
