  | "Rules aren't propositions" reply | Inference rules are operational tools (like "umpire's ruling is final"), not debatable content.          | clean        | Logic lacks "tools"—everything is propositional.                            | the_puzzle    |  
  | "Conditional does the work" reply | The inference rule applies itself when conditions are met (no meta-rule needed).                         | clean        | The Tortoise denies this self-application is automatic.                      | the_puzzle    |  
  | "Authority stops regress" | Umpire acting ends debate (no further rules); logic has no umpire.                                      | distorted    | Logic's "must" has no enforcer—convention fills the gap.                    | my_vocabulary |  
  | Finite stopping tortoise | Arbitrarily adding N meta-rules via house rules.                                                        | distorted    | Stopping is pragmatic, not logically justified.                             | both          |  
