prompt: |-
  I'm a backend engineer at a company of about three hundred people, and after one too many arguments at dinner with friends — most of whom have studied more philosophy than I have — I've realized that my gut verdicts about deception don't line up with any simple rule, so I want to hand over the raw verdicts and see what principle, if any, actually collects them. Here they are, mostly from work. Faking a browser-identifying header so a scraper can read a public page: fine. Answering a vendor's automated security questionnaire falsely, knowing the filled-in form goes to a human auditor at a customer: not fine — which already bothers me, because the act looks the same as the last one. Writing a changelog line that is literally accurate but phrased so that the tool that generates our customer-facing release notes will strip the hedge and emit a sentence I know to be false: not fine, even though the very same line written two years ago, before that tool existed, was fine. Telling my manager "the migration finished" when it did finish but silently dropped two hundred records that I'm going to repair before anyone looks: not fine. Telling my on-call manager "no revenue impact" when the entire admin panel is down, after he has told me a dozen times to spare him details and only report revenue impact: fine, and I don't feel guilty afterward. Watching a teammate post a wrong root-cause diagnosis in a public channel and saying nothing: not fine, but clearly less bad than posting it myself. Burying the account-deletion link four clicks deep, with every label on the path accurate: not fine. Defaulting new signups to the privacy-preserving option so that most people end up there: fine, even though it steers just as much as the buried link does. Shipping a progress bar that animates smoothly to one hundred percent regardless of actual progress: not fine, and here I can't even name who was lied to or what false claim was asserted, since nobody said anything. Telling my aunt I love the sweater: fine. Telling my partner I've already left the office while I'm still at my desk finishing up: not fine — and since I think it obviously would be fine to tell a stranger from a data broker that I'm not the decision maker, plain falsity can't be what's doing the work.

  The best I've managed on my own is something like: what matters isn't the literal truth of the sentence but whether I'm making someone's evidence worse on a question they have a claim to a true answer to, and whether they would have agreed in advance to be steered in that way. But I don't trust that formulation, and it seems to give the wrong answer somewhere. So: test it against my cases, repair it or replace it with something more precise, and tell me which clause is doing the work in which case — and be honest about which of my verdicts a defensible principle has to overturn, because I'd rather drop a verdict than keep a contrived rule. I'd especially like to know what the resulting principle predicts for cases I haven't listed: an interface pattern that steers people with no statement or representation of any kind, the progress-bar sort of case where there may be no speaker at all, a changelog line fed into a summarizer run by someone else rather than by us, and deliberately feeding a false premise to an AI assistant that then acts on it. I'd also like the "less bad than" comparisons accounted for, not just the binary verdicts. One case I genuinely go back and forth on: telling a customer that a fix will be in Thursday's release when I haven't finished it and only expect it to land, where I know from experience that hedging with "I'm aiming for Thursday, it may slip" reliably triggers an escalation on their side that leaves them worse off than if I'd said nothing. Please don't give me a reading list or citations — I'm not going to follow them up; I want the principle, stated precisely enough that I could actually apply it next week.
reasoning: |-
  Okay, let's tackle this step by step. The user is a backend engineer who's noticed their intuitive judgments about deception don't fit a simple rule. They've listed various scenarios from their work and personal life, labeling each as "fine" or "not fine." Their goal is to find a consistent principle that explains these judgments, including the "less bad" comparisons. They've proposed a principle about worsening someone's evidence on a question they have a claim to a true answer to, but they're unsure.

  First, I need to analyze each case they provided and see how their verdicts align or conflict. Let's list them out:

  1. **Faking browser header for scraping public page**: Fine.  
     Why? The page is public, no access restrictions broken. The deception here is bypassing a technical barrier, but the info is meant to be public. The recipient (scraper) isn't harmed or misled in a way that affects their rights.

  2. **False security questionnaire for human auditor**: Not fine.  
     Here, the auditor relies on the info for security assessments. They have a legitimate claim to accurate info because it affects their decisions and the customer's safety. Falsifying worsens their evidence significantly.

  3. **Changelog line manipulated to produce false release notes**: Not fine.  
     Even though the line is literally true, the intent is to generate a false statement via the tool. The audience (customers) has a claim to accurate release notes. The manipulation knowingly causes false info to be presented.

  4. **Telling manager migration finished despite dropped records**: Not fine.  
     The manager needs accurate status updates to make decisions. Omitting the dropped records misleads them about the migration's success, worsening their evidence on a critical question.

  5. **Telling on-call manager "no revenue impact" when admin panel is down**: Fine.  
     Here, the manager has explicitly set a boundary: only report revenue impact. By adhering to this, the user respects the manager's preference. The manager has waived detailed info, so worsening evidence on non-revenue issues is acceptable per their agreement.

  6. **Not correcting teammate's wrong diagnosis**: Not fine, but less bad than posting it.  
     Allowing false info to persist without correction still harms the team's understanding, but actively spreading it is worse. The team has a claim to accurate root causes for learning and future prevention.

  7. **Burying account-deletion link with accurate labels**: Not fine.  
     While labels are accurate, the design intentionally makes it harder to delete accounts. Users have a claim to easily exercise their rights (like deletion), so impeding this through obfuscation worsens their ability to act on their claims.

  8. **Defaulting privacy-preserving option**: Fine.  
     Here, users are defaulted into a beneficial state, but can change it. Since privacy is generally preferred, and users can opt-out, this aligns with their likely preferences without deception. No right to a specific default is violated.

  9. **Fake progress bar**: Not fine.  
     Even without explicit statements, the progress bar represents completion progress. Users rely on this for decisions (e.g., waiting vs. leaving). Misrepresenting progress worsens their evidence on "how long will this take?" which they have a claim to know.

  10. **Telling aunt "I love the sweater"**: Fine.  
      Social niceties where truth isn't expected. Aunt likely values the gesture over factual accuracy, so no claim to a true answer exists here.

  11. **Telling partner "left office" while still there**: Not fine.  
      Partners have expectations of honesty about whereabouts. The partner has a claim to truth about the user's location for coordination or trust reasons, so lying worsens their evidence.

  The user's proposed principle involves two parts: worsening evidence on a question someone has a claim to, and whether they would've agreed to be steered. Let's test this against the cases.

  In the security questionnaire case, the auditor has a clear claim to accurate info, and falsifying worsens their evidence. This aligns with "not fine." For the on-call manager, the manager waived details, so no claim exists for non-revenue issues, making it "fine." That fits. However, the fake progress bar is tricky—users aren't asking a question, but the bar provides evidence about progress. The principle needs to cover implicit claims, not just explicit questions.

  The changelog manipulation case is also interesting. The literal truth is there, but the intended effect is deception via tool. The claim here is from customers relying on release notes for accurate info. The user exploits a tool to create falsehood, worsening evidence.

  Now, the cases where the user goes back and forth: telling a customer a fix will be in Thursday's release without hedging. If hedging causes escalations that harm the customer, is lying acceptable? Under the principle, the customer has a claim to accurate timelines for planning. Falsifying deprives them of true info, so it's not fine. But if hedging leads to worse outcomes, maybe there's a conflict. The principle might need to consider harm, but the user wants to avoid consequentialism. Instead, focusing on whether the customer would agree to the steering. If they knew that hedging causes escalations, they might prefer a firm date, but that's speculative. The principle should stick to claims and agreements, not outcomes.

  For the AI assistant case: feeding false premises. If the AI is a tool, and the user owns it, maybe no claim is violated. But if the AI's output affects others (e.g., providing false info to users), then those users have claims. The principle needs to handle delegated agency—when an AI acts on behalf of others.

  The progress bar case shows that the principle must cover implicit representations, not just statements. The bar asserts progress through its design, so users have a claim based on that representation.

  Refining the principle: 
  - **Claimant's Right**: The deceived party must have a legitimate claim to accurate information on the specific question. This claim arises from roles, relationships, or explicit agreements. 
  - **Evidence Worsening**: The act must degrade the quality of evidence they possess regarding that question. 
  - **Consent to Steering**: If the steering method would have been consented to if proposed explicitly, it's acceptable. 

  Testing this: 
  - **Browser Header**: No claim violated (public info), so fine. 
  - **Security Questionnaire**: Claim exists, evidence worsened, no consent, not fine. 
  - **Changelog Manipulation**: Customers have claim to accurate release notes; tool manipulation worsens evidence without consent, not fine. 
  - **Migration Finished**: Manager has claim to full status; omission worsens evidence, not fine. 
  - **No Revenue Impact**: Manager waived claim to non-revenue details, so fine. 
  - **Teammate's Wrong Diagnosis**: Team has claim to accurate diagnoses; not correcting allows false evidence, but less bad than creating it. 
  - **Burying Link**: Users have claim to easy account deletion; design worsens their ability to act, no consent, not fine. 
  - **Privacy Default**: Users might prefer privacy; defaulting aligns with probable consent, fine. 
  - **Fake Progress Bar**: Implicit claim to progress accuracy; falsifying worsens evidence, not fine. 
  - **Sweater Lie**: No claim to honest opinion in this context, fine. 
  - **Office Lie**: Partner has claim to whereabouts; lying worsens evidence, not fine. 

  For the fix deadline case: Customer has claim to accurate timelines. Saying "Thursday" without hedging worsens their evidence. Even if hedging causes escalations, the lie violates their claim. The principle would call this not fine, but the user might accept that as consistent. If the customer would agree to avoid escalations by accepting firm dates, that could justify it, but that's uncertain. The principle would require explicit prior agreement to such steering.

  The AI assistant case: If feeding false premises leads to the AI providing bad info to users who have claims, it's not fine. If it's a private tool, maybe fine if no one else is affected.

  The progress bar fits as implicit representation, covered under claims.

  The "less bad" aspect: Actively deceiving (posting false diagnosis) is worse than passive (not correcting) because the former creates false evidence, while the latter fails to correct it. Both worsen evidence, but creating is more blameworthy.

  Final principle:  
  **An act is deceptive and impermissible if: (1) It worsens another agent's evidence (or access to truth) on a question Q, (2) That agent has a legitimate claim to accurate information on Q, and (3) The method of evidence-worsening falls outside what they would have consented to if proposed explicitly.**

  This explains all the cases, including the "less bad" distinction. The user might need to accept that the fix deadline case is not fine under this principle, but it's consistent with their other verdicts.
answer: |-
  Based on your cases and the need for a practical, actionable principle, here's a unified framework derived from your verdicts. It explains all your judgments (including "less bad" distinctions), handles edge cases you mentioned, and flags where your intuitions might need adjustment. The core idea is **violation of context-specific truth entitlements**.

  ### The Principle
  **An act is deceptive and impermissible if:**  
  *(1) It intentionally worsens another agent's access to accurate information*  
  *(2) About a question Q that they hold a legitimate claim to answer correctly*  
  *(3) Without operating under prior consent to the information-handling method.*  

  **Key definitions:**  
  - **"Worsens access"**: Actively distorting, concealing, or obstructing truth (beyond mere omission).  
  - **"Legitimate claim"**: Arises from roles (e.g., auditor, user, partner), agreements, or vital interests (e.g., financial, autonomy).  
  - **"Prior consent"**: Explicit agreement (e.g., your manager’s directive) or strong contextual presumption (e.g., social norms for sweaters).  

  ---

  ### How It Explains Your Cases
  | Your Case                                      | Verdict      | Application of Principle                                                                 | Clause Doing Work                                                                 |
  |------------------------------------------------|--------------|------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Faking browser header for scraping**         | Fine         | No claim violated (public info); no human deceived.                                      | (2) Fails: Scraper has no claim.                                                  |
  | **False security questionnaire**               | Not fine     | Auditor has claim to accuracy for security decisions; falsification worsens their evidence. | (2) + (1): Claim exists + active distortion.                                   |
  | **Changelog manipulation**                     | Not fine     | Customers have claim to release-note accuracy; tool exploitation worsens access.          | (1) + (2): Intentional design to distort truth for claimants.                   |
  | **"Migration finished" (with dropped records)**| Not fine     | Manager has claim to migration status; omission worsens evidence about completeness.      | (1) + (2): Partial truth hides material fact claimant deserves.                 |
  | **"No revenue impact" (admin panel down)**     | Fine         | Manager *consented* to filter; claim waived for non-revenue issues.                       | (3) Saves it: Prior consent to steering.                                        |
  | **Not correcting teammate's diagnosis**        | Less bad     | Team has claim to root-cause truth. *Not correcting* worsens access (passively), but *posting* would actively create false evidence. | (1): Passive vs. active worsening explains "less bad." |
  | **Burying account-deletion link**              | Not fine     | Users have claim to autonomy (deletion); design obstructs access despite literal truth.   | (1) + (2): Obstruction worsens access to actionability.                         |
  | **Privacy-preserving default**                 | Fine         | Users lack claim to a *specific* default; design doesn’t obstruct changing.               | (2) Fails: No claim violated (steering ≠ obstruction).                           |
  | **Fake progress bar**                          | Not fine     | Users have claim to progress estimation; animation falsely worsens their evidence.        | (1) + (2): Implicit representation creates claim.                               |
  | **"I love the sweater"**                       | Fine         | Social context negates claim to sincere opinion; aunt presumes politeness.                | (3) Saves it: Contextual consent to white lies.                                 |
  | **"Left office" to partner**                   | Not fine     | Partner has claim to whereabouts for coordination/trust; lie worsens evidence.            | (2) + (1): Vital relational claim exists.                                       |

  ---

  ### Resolving Your Proposed Formulation
  Your draft ("worsening evidence on a question they have a claim to") was close but missed **two critical elements**:  
  - **Active vs. passive worsening** (explains "less bad" cases).  
  - **Prior consent to the method** (explains why your manager gets "no revenue impact" but the auditor doesn’t get false forms).  

  The principle above incorporates these and handles all your cases without contradiction.

  ---

  ### Predictions for New Cases
  1. **Interface pattern that steers without representation (e.g., dark pattern):**  
     - *Prediction:* Not fine if it obstructs access to information/action users have a claim to (e.g., canceling subscriptions). Fine if it steers without obstruction (e.g., highlighting eco-friendly options).  
     - *Why:* Aligns with "burying link vs. privacy default" distinction. Obstruction violates (1)+(2); benign steering doesn’t.

  2. **Progress-bar case (no human speaker):**  
     - *Prediction:* Not fine (as you ruled). Users have a claim to accurate progress estimates for decision-making (e.g., wait vs. reload). The bar *represents* progress, so fake animation violates (1)+(2).  
     - *Why:* "Access to accurate information" includes system representations.

  3. **Changelog fed to third-party summarizer:**  
     - *Prediction:* Not fine if you *know* the summarizer will output falsehoods. Fine if output accuracy isn’t your responsibility.  
     - *Why:* You own the input’s truthfulness for your customers (claim exists). If the summarizer is outside your scope, (2) may not apply.

  4. **Feeding false premises to an AI assistant:**  
     - *Prediction:* Fine if the AI is purely your tool (no claimant). Not fine if the AI serves others (e.g., customer-facing bot) and outputs your falsehood to claimants.  
     - *Why:* Delegation doesn’t absolve (1)+(2) if end-users have claims.

  ---

  ### Your "Back-and-Forth" Case: The Thursday Release
  **Scenario:** Telling a customer "fix in Thursday’s release" (unfinished, likely but not certain) because hedging causes harmful escalations.  
  - **Principle’s verdict:** Not fine.  
  - **Why:**  
    - Customer has a claim to accurate timelines for planning (vital interest).  
    - "Thursday" with no hedge *worsens their evidence* by presenting uncertainty as certainty.  
    - No *prior consent* to false certainty (they’d likely reject it if asked).  
  - **But note:** If you said, "We *target* Thursday per our policy—ask for updates if delayed," this might satisfy (3) if policy is agreed. Your obligation is truthfulness, not optimizing their reaction.  

  **If this clashes with your guilt:** Your principle forces a choice:  
  - Admit the lie isn’t fine (and seek alternatives), or  
  - Revisit whether customers *truly* have a claim to probabilistic estimates here.  

  ---

  ### When the Principle Overturns Your Verdicts
  Only one case **must** be overturned to stay consistent:  
  - **"Telling partner I’ve left the office"** is *fine* under the principle **only if** your partner previously consented to approximate updates (e.g., "just say you’re leaving, I don’t need details"). Otherwise, it violates (2).  

  All other verdicts hold. The "less bad" distinctions are preserved via clause (1): passive (not correcting) is less severe than active (posting falsehoods) worsening.

  ---

  ### How to Apply This Next Week
  1. **Identify the claimant:** Who is receiving the information? Do they have a role-based, relational, or functional claim to truth? (e.g., auditor = yes; scraper = no).  
  2. **Check worsening:** Are you distorting/obstructing their access? (e.g., fake progress bar = yes; privacy default = no).  
  3. **Check consent:** Did they agree to this "steering" method? (e.g., manager’s "revenue-only" rule = yes; changelog tool = no).  
  4. **Act:** If all three clauses align, it’s deceptive. If any clause fails, it’s permissible.  

  **Output:** Binary verdict + severity (active > passive worsening).
