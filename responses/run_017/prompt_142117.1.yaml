prompt: |-
  I am a novelist, four books in, and for the first time I am writing one set entirely in the past: a close-third-person novel about one family in San Francisco through the second wave of the 1918 influenza pandemic — the mask ordinance, the league that formed to repeal it, the arguments about whether compulsory gauze did anything, a laundress who keeps a door-to-door tally of the sick households on her block, and a short present-day frame narrated by a great-granddaughter who has spent ten years digitising the family's papers. My editor loves the draft and keeps praising it for putting the characters "on the right side of history," and the more she says it the more I suspect that is precisely the failure. My partner is an epidemiologist and will say things like "they'd have saved thousands of lives if they'd just listened," which I now hear as the vice in miniature. The trouble is that what I have is a temper, not a test: I can feel when a scene is congratulating us for how far we have come, or when I have handed a character a motive they could only have had in our vocabulary, or when I have excused them by saying they "couldn't have known" — which I've started to suspect is itself a condescending way of refusing to take their actual reasons seriously — but I can't reliably catch it in my own prose, and my fact-checking historian won't catch it either, because she checks whether the streetcar line existed and not whether my plot treats a side as having lost because it was benighted rather than because it was outvoted, outbid, or unlucky.

  So please take this seriously and carefully, and work as if you were both a philosopher or historically-minded theorist who knows what is actually at stake in the complaint about whig history and a developmental editor who has to be useful by Friday. Start by brainstorming — ten minutes, in your head — the distinct ways whiggishness can get into a work of fiction specifically, and only then condense that into something I can run: a numbered decision procedure I can apply to a single scene in ten to fifteen minutes during a revision pass, with no theory vocabulary in the steps themselves. For each step, tell me what question to ask, what counts as a pass, what counts as a fail, what counts as "rewrite this line," where the procedure stops with a verdict, and where it has to stop and hand the question to me because it is a question about what my book is for. I need it to keep separate the things I keep conflating — narrating as if a later outcome were the point of earlier action, judging past people by present standards, and the mirror-image vice of romanticising the period as a lost golden age — and I need an actual test for anachronistic *concepts*, not just anachronistic objects, since my characters keep wanting to say things like "the science" and "prejudice" in words that flatten what they meant. Assume I have no training in any of this, that I will run it on about forty scenes, and that the output has to survive being read by my editor.

  Then show me it working. Run it on three scenes from the draft, in detail: (1) the meeting where the anti-mask characters are given the strongest version of their case — that the gauze is useless, that the ordinance is enforced against the poor and waved through for the rich, that compulsion in a republic in wartime is itself the harm — where I cannot tell whether writing them well is honest or is apologetics; (2) the deathbed scene in which an opponent recants and concedes that the doctors were right, which is the scene my editor singles out and which I would be genuinely unhappy to lose, so if your procedure condemns it I want to be told so plainly; and (3) the frame chapters, where the great-granddaughter calls her ancestor "a forerunner of modern epidemiology" on the strength of that household tally, and I can't work out whether that is a legitimate claim about influence or just retroactive ennoblement of a dead end. Finally, be straight with me about where the procedure misfires: what kinds of scenes it will score wrongly, what it cannot tell me at all, and which of its verdicts I should treat as a prompt to think rather than an instruction to cut.
reasoning: |-
  Okay, let me approach this novelist's problem methodically. The core issue is Whiggishness creeping into a historical novel about the 1918 flu pandemic, specifically manifesting as implicit moral judgment, anachronistic thinking, and narrative teleology. 

  First, I need to unpack how Whiggishness infects fiction. It's not just factual inaccuracy but deeper narrative patterns: making characters proto-modern heroes, treating historical outcomes as inevitable, or reducing complex period-appropriate debates to "right/wrong" binaries. The novelist's editor praising characters being "on the right side of history" is a red flag - that phrasing itself implies history has predetermined sides. 

  For the diagnostic tool, I consider designing a workflow that:
  1) Isolates authorial intrusion by checking where narration implicitly endorses modern views
  2) Flags anachronistic concepts by testing if characters use terms like "science" with modern connotations
  3) Identifies false inevitability by examining whether outcomes feel predetermined
  4) Detects romanticization by spotting idealized portrayals of past mentalities

  The procedure must avoid academic jargon. Each step needs clear questions with binary pass/fail thresholds, plus "rewrite" flags for salvageable issues. Crucially, it should differentiate between factual accuracy (handled by their historian) and narrative perspective problems.

  Now for the test cases:
  For the anti-mask meeting scene, I'll watch for strawmanning - does the narration subtly undermine period-valid arguments by framing them as ignorant? The key is whether their objections (class-biased enforcement, wartime civil liberties) are presented as coherent positions rather than future-disproven fallacies.

  The deathbed recantation scene worries me most. If the character concedes purely because "doctors were right" by modern standards, it fails. But if the realization stems from personal experience (e.g. seeing loved ones die despite his beliefs), it might pass by showing changed perspective, not just factual correction.

  The frame narrator calling an ancestor "forerunner of modern epidemiology" needs scrutiny. Does she have evidence of direct influence, or is she projecting? The procedure should force examining whether the tally actually contributed to contemporary knowledge or remained private observation.

  I must acknowledge limitations: 
  - The tool can't resolve tensions between historical accuracy and narrative satisfaction
  - It may overflag nuanced protagonist perspectives as anachronistic
  - Scenes requiring period-typical prejudice (e.g. racism) might falsely trigger "romanticization" warnings
  - Verdicts on "what the book is for" questions must remain the author's call

  The output should empower the novelist to spot problems without prescribing solutions - hence the "rewrite" category for fixable issues versus hard "fail" verdicts. For the deathbed scene they love, I'll design the test to preserve emotional truth while purging Whiggish concessions.
answer: |-
  Here is a **Whiggishness Detection Protocol** designed for your revision, followed by analysis of your three scenes and caveats. It focuses on *narrative mechanics* rather than historical facts.

  ---

  ### **The Whiggishness Detection Protocol**
  *(10-15 minutes per scene)*

  **STEP 1: VOICE TEST**  
  - **Question:** *Whose judgment is this?*  
  - **Pass:** Narration/character voice uses language *plausible for the era* OR clearly signals *character's subjective bias*.  
  - **Fail:** Narration implies a *modern moral framework* (e.g., "little did they know...", "blind to the truth").  
  - **Rewrite:** Neutralize language. Anchor judgments to a character’s perspective or period-appropriate logic.  
  - **Stop & Think:** If the judgment feels essential to the scene’s emotional core.  

  **STEP 2: MOTIVE CHECK**  
  - **Question:** *Could this character articulate their motive in 1918 terms?*  
  - **Pass:** Motives align with period-visible concerns (e.g., liberty, class, faith, observable evidence).  
  - **Fail:** Motives rely on *modern concepts* (e.g., "public health ethics," "systemic oppression," "scientific literacy").  
  - **Rewrite:** Replace anachronistic concepts with period proxies (e.g., "tyranny" for "authoritarianism," "charity" for "social justice").  
  - **Stop & Think:** If the motive drives plot irreplaceably.  

  **STEP 3: FUTURE-PROOFING AUDIT**  
  - **Question:** *Does the scene treat outcomes as inevitable?*  
  - **Pass:** Characters act without *foreknowledge* of what "wins" historically.  
  - **Fail:** Narrative framing implies historical forces were *destined* to prevail/fail.  
  - **Rewrite:** Show competing ideas as live options. Emphasize *contingency* (luck, charisma, resources).  
  - **Stop & Think:** If inevitability is central to the theme (e.g., the frame story).  

  **STEP 4: GOLDEN-AGE GUARD**  
  - **Question:** *Is the past romanticized as simpler/more virtuous?*  
  - **Pass:** Era-specific virtues *and* flaws are visible (e.g., community solidarity coexists with racism).  
  - **Fail:** Narration implies past societies were *nobler* or *wiser* than the present.  
  - **Rewrite:** Add contradictory period-typical attitudes (e.g., a pro-mask doctor who dismisses "female hysteria").  
  - **Stop & Think:** If romanticism is a character’s trait, not the narrator’s.  

  **STEP 5: CONCEPT TRANSLATION**  
  - **Question:** *Are modern abstract terms ("science," "prejudice") used flatly?*  
  - **Pass:** Terms are *contextualized* (e.g., "science" = specific local doctors’ reputations; "prejudice" = "aversion to Italians").  
  - **Fail:** Terms act as *moral shorthand* without period texture.  
  - **Rewrite:** Replace with tangible details (objects, gossip, sensory input).  
  - **Stop & Think:** Never. Flat concepts always weaken historical fiction.  

  **VERDICT:**  
  - **Pass:** 0–1 fails  
  - **Rewrite:** 2–3 fails  
  - **Fail:** 4–5 fails  

  ---

  ### **Applied to Your Scenes**

  #### **SCENE 1: Anti-Mask Meeting**  
  - **Voice Test:** *Fail* if narration frames arguments as "flawed but understandable." *Pass* if it neutrally reports rhetoric.  
  - **Motive Check:** *Pass* if arguments cite class bias/liberty *without* invoking "social equity."  
  - **Future-Proofing:** *Fail* if anti-maskers seem "on the wrong side of history." *Pass* if their defeat feels tactical (e.g., outspent).  
  - **Golden-Age Guard:** *Pass* (not applicable here).  
  - **Concept Translation:** *Fail* if they say "the science is corrupt" → *Rewrite* as "Dr. Pemberton’s statistics ignore the Mission District!"  
    **Verdict:** Likely **Rewrite** to depoliticize narration and sharpen period motives. *Not apologetics if their 1918 logic is sound.*  

  #### **SCENE 2: Deathbed Recantation**  
  - **Voice Test:** *Pass* if the concession is *personal* ("I was wrong *for us*") not *universal* ("Masks work").  
  - **Motive Check:** *Fail* if they cite "listening to experts" → *Rewrite* as "I should’ve heeded Sarah’s letters about the morgues."  
  - **Future-Proofing:** *Pass* if death feels random, not punitive. *Fail* if it feels like "karma."  
  - **Golden-Age Guard:** *Pass*.  
  - **Concept Translation:** *Fail* if they say "I ignored the data" → *Rewrite* as "I let pride blind me to Nurse Liang’s ledger."  
    **Verdict:** **Rewrite** to ground regret in *relationships/evidence they knew*, not modern hindsight. *Keepable if made intimate, not ideological.*  

  #### **SCENE 3: Frame Narrative ("Forerunner")**  
  - **Voice Test:** *Pass* if great-granddaughter is *biased* (e.g., "To me, she was a pioneer").  
  - **Motive Check:** *Fail* if "forerunner" implies *influence* on modern epi → *Rewrite* as "She documented details *we* now value."  
  - **Future-Proofing:** *Pass* if ancestor’s work is a *dead end* with no legacy.  
  - **Golden-Age Guard:** *Fail* if past is portrayed as "purer" research → *Rewrite* to note its limitations (e.g., "She missed airborne transmission").  
  - **Concept Translation:** *Pass* if "modern epidemiology" is explicitly the *granddaughter’s* projection.  
    **Verdict:** **Rewrite** to clarify: Her tally matters *to the family*, not to history. Avoid "forerunner" unless proven.  

  ---

  ### **Where the Protocol Breaks**  
  1. **Protagonist Bias:** Scenes from a *persistently modern-thinking MC* will falsely "fail." Solution: Flag these scenes as *intentional* anachronism.  
  2. **Moral Clarity:** Scenes depicting period-accepted injustice (e.g., racism) may "fail" Motive Check if characters *don’t* challenge it. *Overrule the protocol here*—your job is to show harm, not endorse historical relativism.  
  3. **Ambiguity:** Scenes where "right" and "wrong" are *equally period-plausible* (e.g., mask efficacy debates) will require your judgment. The protocol can’t resolve this.  
  4. **Emotional Truth:** A "fail" verdict doesn’t mean *delete*—it means *re-anchor* the emotion in era-appropriate logic (e.g., grief, not guilt).  

  **Final Advice:**  
  - **Trust your temper.** A scene feeling "congratulatory" usually fails Step 1 or 3.  
  - **"Couldn’t have known" is fatal.** Replace with "didn’t believe" or "prioritized X."  
  - Your editor’s praise for "right side of history" suggests Steps 2 and 3 are compromised.  
  - **Deathbed scene can survive** if recantation is *not about science* but love, guilt, or local evidence.  

  This protocol isn’t philosophy—it’s *pattern recognition* for traps. Run it cold, revise hot. Forty scenes will take 10 hours; budget 12 and save your novel’s soul.
