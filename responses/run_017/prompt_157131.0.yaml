  ### Diagnostic Decision Tree: Boundaries of Mind  
  This decision tree sorts respondents into positions in the extended-mind debate based on their responses to concrete cases, probing the boundary of mind, agency, explanatory unit in cognitive science, and responsibility. Nodes use 7 cases from the provided list (1, 2, 3, 4, 5, 8, 9) and one substitute (case 7 repurposed). Cases avoid doctrinal labels; leaves include standard positions and unnamed combinations. Each leaf includes one sentence on its implication for AI memory aids and its most awkward commitment.

  #### Decision Tree  
  **Node 1 (Case 9):** Two people are indistinguishable in behavior and experience: one uses a device to store facts, the other memorized them. Are they in the same mental state regarding the stored facts?  
  - **Probes:** Boundary of mind (where the mind stops).  
  - *Yes* → Node 2.  
  - *No* → Node 3.  

  **Node 2 (Case 4):** An assistant periodically rewrites your notes and surfaces connections you never drew, by a mechanism you could not reconstruct. When you endorse one of these connections as your own insight, is it part of your belief?  
  - **Probes:** Boundary of mind (does opacity block extension?).  
  - *Yes* → Node 4.  
  - *No* → **Leaf A**.  

  **Node 3 (Case 3):** Two people maintain a shared knowledge base where neither knows who entered an item, and each treats every item as something they know. When one person acts on an item from this base, can we say they are drawing on their own knowledge?  
  - **Probes:** Boundary of mind and agency (is social sharing constitutive?).  
  - *Yes* → **Leaf D**.  
  - *No* → Node 5.  

  **Node 4 (Case 5):** You rely on a device for notes readable only when powered and online; when it is off, you recall nothing. If it is off, do you still have the beliefs stored in it?  
  - **Probes:** Boundary of mind (does accessibility define constitution?).  
  - *Yes* → **Leaf C**.  
  - *No* → **Leaf B**.  

  **Node 5 (Case 3 follow-up):** When a person acts on an item from the shared knowledge base, is the proper unit for explaining their behavior the individual's mind or the coupled system (person + shared base)?  
  - **Probes:** Explanatory unit in cognitive science (individual vs. system).  
  - *Individual's mind* → Node 6.  
  - *Coupled system* → **Leaf E**.  

  **Node 6 (Case 8):** A practitioner, after years with a navigation aid, no longer uses it, but their unaided reasoning is permanently reshaped by it. Is this current ability an example of extended mind?  
  - **Probes:** Boundary of mind and explanatory unit (does past extension transform the inner system?).  
  - *Yes* → **Leaf F**.  
  - *No* → Node 7.  

  **Node 7 (Case 1):** The contents of your notes app were silently replaced overnight by subtly different contents, and you never noticed; you consulted it, acted on the altered entry without hesitation, and were never corrected. Did your belief about the world change?  
  - **Probes:** Boundary of mind and responsibility (is reliance constitutive or causal?).  
  - *Yes* → **Leaf G**.  
  - *No* → Node 8.  

  **Node 8 (Case 2 as substitute for 7):** A memory-buffering neural interface was fitted while you were under anesthetic, without your request; you do not understand it but rely on it. Is the buffered information part of your mind?  
  - **Probes:** Agency and boundary of mind (does lack of consent/control block extension?).  
  - *Yes* → **Leaf H**.  
  - *No* → **Leaf I**.  
  - *It depends on context* → **Leaf J**.  

  #### Leaves  
  - **Leaf A: Extended cognitive system but not extended mind.**  
    - *AI implication:* Using a device may extend cognitive processing, but personal-level states (beliefs, memories) remain internal.  
    - *Most awkward commitment:* Must deny that opaque processes (like AI-generated insights) can be "beliefs," even when seamlessly endorsed, creating a gap between functional role and personal experience.  
    - *(Tag: Adams & Aizawa-style "mark of the cognitive")*  

  - **Leaf B: Full-blooded parity-style extension.**  
    - *AI implication:* Relying on a device means you genuinely remember or believe its content; the mind extends to the device.  
    - *Most awkward commitment:* Includes non-cognitive systems (e.g., homeostatic controllers) as "mental" if functionally similar, risking "bloat" (mind extends too far).  
    - *(Tag: Clark & Chalmers-style extended mind)*  

  - **Leaf C: Cognitive extension only (unnamed).**  
    - *AI implication:* Devices can extend memory/belief if they support cognition, but not if they control non-cognitive functions (e.g., physiology).  
    - *Most awkward commitment:* Arbitrarily excludes vital but non-cognitive processes (like homeostasis) while including cognitive ones, with no clear principle for the boundary.  

  - **Leaf D: Socially extended mind (unnamed).**  
    - *AI implication:* Shared AI systems (e.g., team knowledge bases) can make information part of each user's mind, even if not individually accessible.  
    - *Most awkward commitment:* Attributes knowledge to individuals who cannot recall or justify it without the shared system, blurring personal responsibility.  

  - **Leaf E: Distributed cognition.**  
    - *AI implication:* Devices don't extend individual minds; the unit of analysis is the coupled system (human + AI), so "remembering" is a system-level process.  
    - *Most awkward commitment:* Individual agency/responsibility dissolves; actions are attributed to systems, making it hard to hold persons accountable.  
    - *(Tag: Hutchins-style distributed cognition)*  

  - **Leaf F: Enculturation or cognitive integration.**  
    - *AI implication:* Using a device may transform your inner capacities, but it doesn't extend your mind; the device is a scaffold, not a part of you.  
    - *Most awkward commitment:* Treats the reshaped mind as "internal" even when it functionally depends on past external loops, downplaying current external reliance.  
    - *(Tag: Menary-style cognitive integration)*  

  - **Leaf G: Embedded or scaffolded cognition.**  
    - *AI implication:* Devices inform beliefs but aren't constitutive; you don't "remember" with them—you use them as tools.  
    - *Most awkward commitment:* Allows external resources to directly cause belief changes (e.g., sync errors alter beliefs) without being part of the mind, straining causality.  
    - *(Tag: Rupert-style embedded cognition)*  

  - **Leaf H: Agency-constrained extension (unnamed).**  
    - *AI implication:* Devices extend the mind only if integrated by the user's agency (e.g., chosen tools), not imposed ones like non-consensual neural interfaces.  
    - *Most awkward commitment:* Imposes an agency requirement that excludes cases of seamless, unchosen reliance (e.g., adaptive AI), making extension contingent on personal history.  

  - **Leaf I: Conservative rejection.**  
    - *AI implication:* Devices never host memories or beliefs; relying on them is mere information access, not remembering.  
    - *Most awkward commitment:* Denies mental status even to deeply integrated AI, treating users as perpetually "misinformed by a source," not believers.  
    - *(Tag: Fodor-style intracranialism)*  

  - **Leaf J: Deflationary treatment.**  
    - *AI implication:* Whether a device extends the mind depends on context (e.g., purpose, interests); there's no fact of the matter.  
    - *Most awkward commitment:* Reduces the debate to verbal or pragmatic choices, implying no objective truth about minds and undermining scientific claims.  
    - *(Tag: Dennett-style pragmatism)*  

