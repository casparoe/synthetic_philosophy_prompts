  ### Scoring Key  
  Assign positions based on answer patterns. Order matters only at Node 8 (if "it depends" is chosen, it overrides other responses). Patterns are:  

  | Leaf | Path (Node Answers) | Calibration Note (using museum-and-notebook) |
  |------|---------------------|---------------------------------------------|  
  | A    | 1:Y, 2:N           | Rejects extension: notebook is a tool, not memory. |  
  | B    | 1:Y, 2:Y, 4:N      | Accepts extension: notebook is literal memory storage. |  
  | C    | 1:Y, 2:Y, 4:Y      | Unnamed: notebook extends memory, but homeostatic implant does not. |  
  | D    | 1:N, 3:Y           | Unnamed: shared notebook is part of each user's mind. |  
  | E    | 1:N, 3:N, 5:Coupled system | Distributed: notebook and user form a system; memory is systemic. |  
  | F    | 1:N, 3:N, 5:Individual, 6:Y | Integration: after using notebook, reshaped mind is internal. |  
  | G    | 1:N, 3:N, 5:Individual, 6:N, 7:Y | Embedded: notebook alters beliefs when consulted, but isn't mind. |  
  | H    | 1:N, 3:N, 5:Individual, 6:N, 7:N, 8:Y | Unnamed: notebook extends only if user chose/controls it. |  
  | I    | 1:N, 3:N, 5:Individual, 6:N, 7:N, 8:N | Conservative: notebook is reference material, not memory. |  
  | J    | 1:N, 3:N, 5:Individual, 6:N, 7:N, 8:It depends | Deflationary: "memory" depends on context for notebooks. |  

  **Order sensitivity:** Nodes 7 and 8 must follow Node 6; reversing them could misassign Leaves G, H, I, J.  

  ---

  ### Table of Unoccupied Combinations  
  Combinations not leading to any leaf are incoherent, unattractive, or unexplored. Diagnoses:  
  - **1:Y, 2:Y, 3:Y** (Yes to Node 1, 2, and 3): Incoherent. Node 3 is unreachable from "Y" at Node 1; the path implies acceptance of parity but illogically jumps to social extension.  
  - **1:Y, 2:N, 4:N** (Yes to 1, No to 2, No to 4): Unattractive. Accepts parity and opacity-blocking extension but denies accessibility matters, making "extension" fragile and context-dependent.  
  - **1:N, 3:N, 5:Individual, 6:Y, 7:Y** (No to 1, No to 3, Individual unit, Yes to 6, Yes to 7): Unexplored. Combines enculturation (Node 6:Y) with embedded (Node 7:Y), implying past extension reshapes the mind while current reliance alters beliefs—a hybrid with no clear advocate.  
  - **1:Y, 2:Y, 3:N** (Yes to 1, Yes to 2, No to 3): Unreachable (Node 3 only accessible from "N" at Node 1).  

  ---

  ### Ambiguities and Further Questions  
  **Unseparated Pairs:**  
  - **Leaf A (Extended system, not mind) vs. Leaf I (Conservative):** Both may answer "No" to Node 2 (opaque assistant) and "No" to Node 7 (belief change).  
    - *Further question:* "If you lose the device, do you lose the ability, or just access to information?"  
      - Lose ability → Leaf A (extended system).  
      - Lose access → Leaf I (conservative).  
    - *Nature:* Substantive (probes functional integration vs. mere access).  

  - **Leaf F (Enculturation) vs. Leaf G (Embedded):** Both may answer "No" to Node 6 (current extension) and "Yes" to Node 7 (belief change).  
    - *Further question:* "After device disuse, is the reshaped ability explainable by internal processes alone?"  
      - Yes → Leaf F (enculturation).  
      - No → Leaf G (embedded).  
    - *Nature:* Substantive (probes explanatory sufficiency of inner states).  

  **Nodes with Ambiguous Rationales:**  
  - **Node 7 (Notes app altered):** "Yes" (belief changed) may indicate either:  
    - Embedded (Leaf G): Belief changes causally via interaction, not constitution.  
    - Social extension (Leaf D): Belief is extended, so alteration changes it directly.  
    *Resolution:* Context from Node 3 (social sharing) separates them.  
  - **Node 8 (Neural interface without consent):** "No" (not part of mind) may indicate either:  
    - Conservative (Leaf I): Nothing external is ever part of the mind.  
    - Agency-constrained (Leaf H): Only lack of consent blocks extension.  
    *Resolution:* Node 7 (belief change) distinguishes; Leaf H requires prior "Yes" at Node 7.  

  **Conflation Warning:** Node 3 (social sharing) probes boundary and agency, but disagreements often stem from conflating boundary (is the mind shared?) with responsibility (who is answerable?). Positions like Leaf E (distributed) focus on explanatory unit, while Leaf D (socially extended) focuses on boundary, making them seem opposed when they address different issues.  

  ---  
  This instrument isolates positions via cases, avoiding doctrinal labels. For calibration, the museum-and-notebook case (Clark & Chalmers, 1998) is referenced only in the scoring key. AI implications highlight practical stakes for memory-aid users.
