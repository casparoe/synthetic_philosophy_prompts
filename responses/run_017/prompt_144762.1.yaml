prompt: |-
  ok so pretend you're like a professional moral philosopher who's spent way too long on this exact question, and actually think it through carefully instead of giving me something balanced-sounding — like, brainstorm three or four candidate principles first, throw out the weak ones, then commit to whichever one you think survives. And please don't give me reading lists or names of papers or anything, I can't look any of that up and it wouldn't help me anyway.

  Some context: I'm a junior, I lifeguard at the town pool in the summer, and I'm in this ethics-club thing at school and we got into a massive argument at lunch about whether the numbers count. Like, if you can rescue one person or five people, do you have to save the five? My teacher mentioned that some philosopher (don't bother naming him) apparently thinks you should just flip a coin, which sounded insane to everyone at the table but I couldn't explain why. So here are my actual gut reactions, and I want to know what rule I'm accidentally using. (1) One stranger on a raft vs five strangers on another raft, everyone roughly the same age, everyone fine afterward: save the five, obviously, not even close. (2) Same thing but the one person is my best friend: I'd save my friend, and I don't think anyone should call me a bad person for it — but I can't say why that's different from (1), since the five are all someone's best friend too. (3) One vs two: I'd save the two, but a coin flip feels totally fine and I wouldn't judge someone who saved the one. (4) A million vs 999,999: coin flip feels fine, like the extra one life does literally nothing for me there, which I realize contradicts (1) because it's still one extra person. (5) Five people who each have a 20% chance of dying vs one person who's definitely going to die, you can only help one side: I'd go for the one certain person, and a lottery among all six feels wierd to me here. (6) If saving the five means steering away from the one, fine, I steer to the five — but if it means shoving the one guy off the raft with my own hands so the five can hold on, I don't think I could do it, even though it's the same five lives either way. (7) When I'm on duty as a lifeguard and it's my friend vs five kids I don't know, I feel like I'd have to go to the five, and picking my friend would be, like, corruption — but off the clock I'd save my friend no question. (8) The one is right in front of me screaming and the five are a mile away in a totally separate accident and I'd have to drive right past the one: I think I'd still go to the five, the fact that it's not the same accident doesn't seem to matter. My half-baked rule was "numbers count, but only when the gap is big relative to the total, and only when I'm not personally close to someone and not personally killing them" — which I can already tell is a mess.

  Can you test that rule against my cases, fix it or replace it, and give me the end result stated precisely enough that I could apply it to a case I haven't thought about, telling me which of my verdicts each part of the rule is there to save? I also want the short version I could actually say out loud at lunch. And please be honest about which of my verdicts no decent principle can keep — if I have to drop one, tell me which and why. The one I keep going back and forth on: same as (2), but it's my friend vs five strangers and I'm the one on duty, so the relationship and the job are pulling in opposite directions. What does whatever principle you land on say about that, and does it feel right to you or does it make you suspicious of the principle itself?
reasoning: |-
  Okay, this user is a high school junior in an ethics club, wrestling with a classic moral dilemma about whether numbers count in rescue scenarios. They've presented eight detailed thought experiments with their intuitive judgments, and they want a rigorous principle that explains their intuitions while being practically applicable. 

  The user is clearly bright and engaged—they've identified contradictions in their own thinking and want a systematic approach, not just platitudes. Their frustration with "balanced-sounding" answers is palpable; they crave intellectual honesty even if it means rejecting some of their initial judgments. That "half-baked rule" they came up with shows real effort at synthesis.

  Hmm... their core tension seems to be between impartiality (numbers matter) and agent-relative factors (personal relationships, direct harm, professional duties). Cases 1 and 8 suggest strong commitment to aggregative consequences, while cases 2, 6, and 7 show powerful exceptions. The million-vs-999,999 case (4) is particularly telling—it reveals their intuition isn't just about raw numbers but about *meaningful difference*. 

  Right, let's dissect their intuitions:
  - **Case 1**: Strong save-the-five. Baseline consequentialism.
  - **Case 2**: Saves friend despite numbers. Agent-centered prerogative.
  - **Case 3**: Small numbers make coin flip acceptable. Threshold effect.
  - **Case 4**: Negligible difference negates obligation. Diminishing marginal utility.
  - **Case 5**: Certainty trumps expected value. Aversion to abandoning the doomed.
  - **Case 6**: Distant harm vs. direct harm matters. Doctrine of double effect?
  - **Case 7**: Professional role overrides personal ties. Duty bifurcation.
  - **Case 8**: Physical proximity irrelevant. Strict impartiality.

  The million case (#4) is the bomb here. If they truly believed numbers were absolute, they'd insist on saving the million. But they don't—which suggests their real principle is about *preventable loss* relative to context. Similarly, case #5 rejects expected utility for visceral "rescue the certain victim" impulse. 

  For the lifeguard-friend dilemma... oof. Their professional duty likely creates a promise-obligation to impartiality, overriding personal ties. But if the principle I land on *requires* letting their friend die without guilt, that might feel alienating. Need to acknowledge that tension—maybe frame the duty as "what you vowed to do" rather than "what's impersonally best."

  The coin-flip philosopher they mentioned is probably Taurek, but naming him wouldn't help. Their teacher threw that in as a provocation, and it worked—they're wrestling with why partiality feels justified sometimes but not others. 

  Building the principle step by step:
  1. **Aggregate consequences matter**... but only above a threshold of significant difference. (Saves cases 1, 3, 4, 8)
  2. **Agent-relative permissions exist** for special relationships. (Saves case 2, off-duty part of 7)
  3. **Role obligations constrain permissions** when voluntarily assumed. (Saves on-duty part of 7)
  4. **Harm directly caused vs. allowed** affects permissibility. (Saves case 6)
  5. **Certainty can override expected value** in small-scale rescues. (Saves case 5)

  Case 5 is the hardest to systematize. Why is saving one certain death better than a 20%*5=100% expected save? Their intuition suggests "no one left behind" ethics trump aggregation when identifiable victims are present. I'll bake that in as a proximity qualifier: *when harms are equally direct and certain, aggregate; when uncertainty or indirectness creates "abandonment," prioritize the immediately salvageable.*

  Final principle must be surgical: "Require significant net benefit unless constrained by..." etc. The "short version" for lunch debate needs to be punchy: "Save more lives unless you'd have to directly kill someone, or it's your kid, or you promised not to—and 'more' only counts when it's *meaningfully* more." 

  And gotta flag that case #4 (million vs. 999,999) might *have* to be rejected by any consistent principle. If they accept coin-flipping there but not in 5 vs. 1, they're admitting numbers aren't absolute—which is fine, but they must own that. Similarly, the lifeguard-friend conflict will likely demand saving the five, even if it feels brutal. I'll note that this might indicate the principle is too rigid, but that’s where their own intuitions point...
answer: |-
  Here's a principle built *from your intuitions*, stress-tested against your cases, and refined to eliminate contradictions. I'll dismantle your half-baked rule, show where it fails, and build a better one step-by-step.

  **Your Half-Baked Rule Fails:**
  *   "Numbers count, but only when the gap is big relative to the total": Explains (1) vs (4) (5v1 feels big, 1,000,000v999,999 feels small), but fails (3) (2v1 gap is 100% increase, same as 2v1, yet you accept a coin flip).
  *   "Only when I'm not personally close": Explains (1) vs (2), but fails the *on-duty* part of (7) (personal closeness exists, but duty overrides it).
  *   "Only when not personally killing them": Explains (6), but fails (8) (driving past the one *is* letting them die, similar to steering away, yet you'd do it).

  **Building the Principle:**

  1.  **Candidate 1: Pure Aggregation (Save the Greater Number):** Fails your intuitions hard. Requires saving the five over your friend (2), judges saving one in 2v1 (3), requires saving the million (4), requires saving the five 20%-risk people (5), requires shoving the one off (6), requires saving the five over your friend *even off-duty* (7), and requires driving past the one (8). Too demanding, ignores your core permissions.
  2.  **Candidate 2: Strong Agent-Centered Prerogative (Save Who You Want/Are Close To):** Fails your intuitions. Allows saving your friend over the five off-duty (2), but *also* allows saving the one over the five *strangers* in (1), and allows saving your friend *on-duty* in (7). Too permissive, ignores the force of numbers and duty.
  3.  **Candidate 3: Threshold Aggregation + Special Obligations + Direct Harm Constraint:** This is the starting point, but messy. Needs refinement.
  4.  **Candidate 4 (Refined Winner): Significant Net Benefit Requirement + Role-Based Promissory Obligation + Agent-Relative Permission + Proximity/Causation Filter.**

  **The Surviving Principle (Stated Precisely):**

  **You are morally required to choose the action that provides a Significant Net Benefit in lives saved when all the following conditions hold:**
  *   **(A) The action falls within the scope of a Role-Based Promissory Obligation you have voluntarily undertaken (e.g., lifeguard duty), OR no such conflicting role obligation exists.**
  *   **(B) The Significant Net Benefit involves preventing harm that is Comparably Direct/Certain and Comparably Proximate to you as the alternative harms you could prevent.**
  *   **(C) Achieving the Significant Net Benefit does not require you to Intentionally Directly Harm an Identifiable Person who would not otherwise die imminently without your intervention.**

  **You have an Agent-Relative Permission to prioritize saving individuals with whom you share a Significant Personal Relationship over strangers, *unless* condition (A) (Role Obligation) overrides this permission.**

  **Definition of Key Terms:**
  *   **Significant Net Benefit (SNB):** The difference in expected lives saved between the options must be large enough that it isn't "de minimis" (negligible) *in the context*. This is inherently comparative and scales with the numbers involved. (Saves: 1 vs 5 = SNB (4 lives), 1 vs 2 = *Not* SNB (1 life difference), 1,000,000 vs 999,999 = *Not* SNB (0.0001% difference)).
  *   **Role-Based Promissory Obligation:** A duty arising from voluntarily accepting a role (like lifeguard) that implies a promise of impartiality and prioritizing the greater good within that role. (Saves the *on-duty* verdict in (7)).
  *   **Comparably Direct/Certain & Proximate:** The harms you are choosing between must be similar in how directly your action causes/allows them and their certainty/immediacy. (Saves (5): Saving the certain death is *more direct/certain* than aggregating probabilistic deaths. Saves (8): The harms are separate but *comparable* in directness/proximity, so SNB applies. Saves (1) & (6) steering away: Harm to the one is *allowed*, not *directly caused* by you).
  *   **Intentionally Directly Harm an Identifiable Person:** Actively using your agency to inflict harm on a specific person whose death is not already occurring independent of your direct intervention. (Saves (6): Shoving the guy off is IDHAIP. Steering away is *not*. Lets you save the five by steering away but not by shoving).
  *   **Agent-Relative Permission:** A moral allowance based on your personal perspective/relationships, making an otherwise suboptimal choice (by impartial standards) permissible *for you*. (Saves (2) & *off-duty* part of (7)).
  *   **Significant Personal Relationship:** A close bond like family or best friend, not mere acquaintance. (Justifies prioritizing in (2)).

  **How It Saves Your Verdicts:**
  1.  **1v5 Strangers:** SNB (4 lives), No Role conflict, Harms comparable & indirect, No IDHAIP required. **=> Save Five.**
  2.  **1 (Friend) vs 5 Strangers (Off-Duty):** SNB exists *but* Agent-Relative Permission applies (Significant Personal Relationship). No Role conflict overrides it. **=> Permitted to Save Friend.**
  3.  **1v2 Strangers:** *Not* SNB (only 1 life difference). No requirement to save the two; coin flip permissible. **=> Save Two or Flip Coin, both OK.**
  4.  **1,000,000 vs 999,999:** *Not* SNB (de minimis difference). No requirement to save the million; coin flip permissible. **=> Flip Coin OK.**
  5.  **5x20% vs 1 Certain:** Harms *not* Comparably Certain/Direct. Saving the certain death is preventing a *more direct/certain* harm than aggregating the probabilistic harms. SNB doesn't apply clearly. **=> Save the Certain One.** (The lottery feels weird because the harms aren't fungible in terms of certainty).
  6.  **Steering Away vs Shoving:** Steering away: Allows death, but not IDHAIP. Shoving: *Is* IDHAIP. Condition (C) forbids shoving even for SNB. **=> Save Five by Steering OK, Save Five by Shoving Forbidden.**
  7.  **On-Duty: Friend vs Five Kids:** SNB exists (4 lives). Role-Based Promissory Obligation (A) overrides Agent-Relative Permission. **=> Required to Save Five.** *Off-Duty:* Agent-Relative Permission applies. **=> Permitted to Save Friend.**
  8.  **One Screaming vs Five Miles Away:** Harms are Comparably Direct/Proximate (you can prevent either by acting). SNB applies (4 lives). No IDHAIP required (driving past allows death, doesn't directly cause it). **=> Save Five.**

  **The Short Lunch Version:**
  "Numbers *do* count when the difference is really significant *and* you don't have to personally kill someone to do it *and* you're not super close to the person you'd be leaving *and* you haven't promised (like as a lifeguard) to be impartial. If the difference is small, or it's your loved one off-duty, or you'd have to shove someone off the raft, then numbers aren't the only thing that matters."

  **The Sacrifice: One Verdict Must Go (Or Be Weakened)**
  *   **Your (5) Verdict (Save the Certain One over Five 20% Risks):** This is the hardest fit. The principle *allows* you to save the certain one because the harms aren't "Comparably Certain," so SNB doesn't clearly mandate saving the five. **However, a truly "decent" impartial principle focused purely on expected lives saved *would* require saving the five** (expected value = 1 life saved vs saving the one = 1 life saved). Your intuition here is strongly agent-relative and certainty-focused, rejecting pure aggregation of small probabilities. The principle accommodates it by relaxing the SNB requirement when harms aren't comparable, but this weak spot reveals a tension between your aversion to abandoning the "doomed" identifiable victim and the cold math of expected utility. You might need to accept that saving the certain one is *permissible* (due to the certainty difference), but saving the five might be *better* from an impartial "save lives" perspective.

  **The Lifeguard's Dilemma (Friend vs Five On-Duty):**
  *   **What the Principle Says:** Your Role-Based Promissory Obligation (as lifeguard) overrides your Agent-Relative Permission to save your friend. Condition (A) holds strongly. There is a Significant Net Benefit (4 lives). Conditions (B) and (C) hold (harms comparable, saving the five doesn't require IDHAIP). **=> You are morally required to save the five strangers.** Choosing your friend would be a breach of your professional duty.
  *   **Does It Feel Right/Suspicious?** It *should* feel deeply painful and conflicting – that's the point of the dilemma. The principle reflects your intuition that on-duty, it *would* be corruption to pick your friend. However, the *pain* you'd feel highlights the genuine moral force of the Agent-Relative Permission. The principle doesn't erase that permission; it just says your *duty* overrides it *in this specific context*. If the idea of *requiring* someone to let their best friend die in this scenario feels inhumanely demanding, that suspicion points to the inherent tension between impartial duty and deep personal loyalty. The principle acknowledges this by calling it a *requirement* born of promise/duty, not something effortless. It feels "right" to the part of you that understands the lifeguard's role; it feels "suspicious" to the part that is a loyal friend. That tension is real and unresolvable by any clean principle.

  **Final Refined Principle (For Application):**
  When deciding whom to save:
  1.  **Check for Role Duty:** Are you on-duty in a role demanding impartial rescue (e.g., lifeguard, medic)? If YES, prioritize SNB within that duty's scope, overriding personal ties.
  2.  **Check Harm Directness:** Are the harms equally direct/certain/proximate? If NO (e.g., certain doom vs probabilistic), you may prioritize the more direct/certain harm.
  3.  **Check SNB:** If harms *are* comparable, is the expected life difference significant (not de minimis)? If YES, proceed.
  4.  **Check IDHAIP:** Does saving the greater number require you to *directly, intentionally kill* someone who wouldn't die *right now* without your action? If YES, forbidden.
  5.  **Apply Permission:** If no SNB, or SNB exists but no role duty applies, you are *permitted* (not required) to use Agent-Relative Permission to save a close loved one over strangers.

  This respects your core intuitions while eliminating the contradictions in your initial rule. It accepts the messiness of human morality (roles, relationships, direct harm) while demanding impartiality when we've promised it and when the stakes are high and the actions are clean.
