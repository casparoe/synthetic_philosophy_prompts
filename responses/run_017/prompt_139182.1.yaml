  Based on your requirements, here's a decision tree addressing Simpson's paradox reversals in prescribing guidelines. It uses only your four specified distinctions and the standing example (surgery that wins overall but loses in both mild/severe strata due to confounding by severity). Each branch is a yes/no question answerable without specialized knowledge:

  ### Decision Tree
  1. **Is the stratifier (e.g., severity) measured BEFORE treatment?**  
     - **No** (e.g., stratifier is a post-treatment outcome like "complication status"):  
       → **Leaf: These strata aren't poolable at all**  
       *Rationale: Stratifying on post-treatment variables creates artificial reversals. Use the pooled table (e.g., overall surgery comparison).*  
     - **Yes** (e.g., severity is known pre-surgery):  
       → Proceed to Question 2.  

  2. **Does the reversal disappear if you use RISK DIFFERENCE instead of relative risk/odds ratio?**  
     - **Yes** (e.g., with risk difference, surgery A now wins in all strata):  
       → **Leaf: It's an artifact of the measure**  
       *Rationale: Non-collapsible measures (e.g., odds ratios) distort effects. Trust risk differences.*  
     - **No** (e.g., surgery A still loses in both strata with risk difference):  
       → Proceed to Question 3.  

  3. **Does it matter if the guideline is applied BEFORE knowing the patient's stratum?**  
     - **No** (e.g., severity is always known when choosing surgery):  
       → Proceed to Question 4.  
     - **Yes** (e.g., sometimes you must decide without knowing severity):  
       → **Leaf: Potential-outcomes style ignorability**  
       *Rationale: Use stratum-specific effects when known; if unknown, average effects across strata using population severity rates (e.g., expected success rate for Surgery A: \(P(\text{mild}) \times \text{success}_{\text{mild}} + P(\text{severe}) \times \text{success}_{\text{severe}}\)).*  

  4. **If fine and coarse partitions both reverse vs. pooled, which wins?**  
     - **Fine partition** (e.g., severity split into 10 levels):  
       → **Leaf: Causal-graph / back-door adjustment**  
       *Rationale: Finer partitions better isolate confounding (e.g., precise severity adjustment).*  
     - **Coarse partition** (e.g., mild/severe only):  
       → **Leaf: The sure-thing-principle response**  
       *Rationale: Coarse strata suffice for decisions. If Surgery A loses in both coarse groups, avoid it—regardless of finer splits.*  

  ---

  ### Key Notes
  - **Incoherent combinations**: None—all 8 logical combinations are covered.  
  - **Unattractive but coherent**:  
    - *Post-treatment stratifier + reversal disappears with risk difference*: Statistically possible but rare in practice; pooled table remains safest.  
    - *Pre-treatment + reversal disappears + unknown stratum timing*: Could occur but is edge-casey (Q3 skipped if Q2=Yes).  
  - **Leaf mappings**:  
    | **Leaf**                                | **Scenario**                                                                 |  
    |-----------------------------------------|-----------------------------------------------------------------------------|  
    | These strata aren’t poolable at all     | Post-treatment stratifier (e.g., "complication status")                     |  
    | Artifact of the measure                 | Non-collapsible measure (e.g., odds ratio) distorts effects                 |  
    | Potential-outcomes style ignorability   | Pre-treatment confounder, must decide without stratum sometimes             |  
    | Causal-graph / back-door adjustment     | Pre-treatment confounder, stratum always known, fine partition preferred    |  
    | The sure-thing-principle response       | Pre-treatment confounder, stratum always known, coarse partition sufficient |  
  - **Unused named positions**:  
    - *"There is no single effect only local mechanisms"*: Covered by the causal-graph and potential-outcomes leaves (they inherently handle stratum-specific effects).  
  - **Ambiguous separation**:  
    - *Sure-thing principle vs. causal-graph*: Only separated by Q4 (partition granularity). Both address confounding but prioritize different partitions.  

  ### Standing Example Walkthrough
  - **Pooled table**: Surgery A wins overall.  
  - **Stratified table**: Surgery B wins in mild and severe.  
  - **Tree application**:  
    1. Severity is pre-treatment → **Yes**.  
    2. Reversal persists with risk difference → **No**.  
    3. Severity is *always* known pre-decision → **No** (proceed to Q4).  
    4. If fine partition (e.g., 10 severity levels) is trusted → **Leaf: Causal-graph** (adjust for precise severity).  
       If coarse partition (mild/severe) is trusted → **Leaf: Sure-thing principle** (avoid Surgery A since it loses in both).  

