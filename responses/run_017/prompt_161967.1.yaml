prompt: |-
  I teach a second-year undergraduate module in the metaphysics of mind, and I am reworking next term's session on the combination problem. The students will arrive able to state the knowledge argument and the zombie argument, about a third of them are concurrently taking a cognitive science course where integration is treated as whatever global-workspace or integrated-information-style measures capture, and the rest, on first hearing the word panpsychism, hear either animism or idealism. I have eighty minutes, and I have taught this session four times; each time it decays into a re-run of the hard problem, and the students leave with a refreshed sense that consciousness is puzzling rather than with a grasp of the specific difficulty that the combination problem poses. So I am asking you for a plan for the explanation, not for the explanation.

  The apparatus I have been drafting, and which I want you to stress-test rather than take over, is this. Instead of opening with the usual threefold division into a subject problem, a quality problem and a structure problem, I have been using one invented case to carry the whole session — call the creature a choral animal: each of its micro-constituents has a thin, determinate experience; the animal's own reportable experience is a single unified field; and both facts are stipulated rather than explained. I want that case to generate three questions in order: how many subjects are there; what fixes the level of decomposition, that is, why the story is told at the level of cells or neurons or particles and not at the level of the whole animal or of one hemisphere; and, last, why the resulting quality is the determinate one it is rather than a blur or a kind of noise. I also want to add a fourth question, which I have been calling the inheritance problem: even granting that the unified subject exists, what makes it inherit these contents rather than the contents of one part alone. I am genuinely unsure whether that is a distinct problem or the quality problem in different clothes; tell me if it collapses, and into what.

  Concretely, then: what has to be in place before the choral animal is introduced, and why does it have to be in place first; what the carrying example must have and must lack, and why the familiar colony or hive-mind cases are the wrong vehicle; the misconceptions the students will form in the order they will form them — I am expecting some version of "this is just the hard problem again," "emergence or causation dissolves it," "integration measures explain unity," "if the micro-experiences are thin enough there is nothing left to explain," and "nothing fuses at all, the macro-subject is simply the whole that the parts constitute" — together with the exact point in the sequence at which each should be headed off; one question I can put to them in the final five minutes that would show they have hold of the problem rather than merely a mood of puzzlement; and what I should say, out loud and explicitly, that I am declining to explain at this level.
reasoning: |-
  Okay, let me unpack this carefully. The user is a philosophy professor struggling to teach the combination problem without it collapsing into a rehash of the hard problem. They've developed a "choral animal" thought experiment as a pedagogical scaffold but want stress-testing, not replacement. Their core frustration is students leaving with generic puzzlement rather than grasping the specific combinatory puzzles.

  Hmm... the choral animal setup is smart—it bypasses the usual tripartite division that often triggers deflationary responses. By stipulating both micro-experiences and macro-unity as brute facts, it forces focus on the gaps between them. But I see risks: if introduced too early, students might dismiss it as question-begging or conflate it with emergence. It needs careful staging.

  First, groundwork. They must already feel the explanatory poverty of physicalism regarding consciousness—not just the hard problem's existence, but its persistence even after accepting functional/correlational accounts. Maybe briefly reactivate the knowledge argument's Mary: she knows all integrative mechanisms but still lacks phenomenal knowledge. That preempts "integration explains unity" objections later. 

  The colony/hive comparison is crucial to avoid. Ant colonies lack stipulated micro-phenomenality, so students would reasonably object that unity emerges from non-conscious parts. Choral animal must have irreducible micro-experiences to force the combination issue. Emphasize: here, parts are already conscious—so how does *their* consciousness combine? 

  Ah, the misconception sequence. "Just the hard problem again" will pop up immediately after stating the case. Need to differentiate: hard problem is about why consciousness arises at all; combination assumes it arises at micro-levels and asks how composing works. Preempt by flowchart: "Given micro-consciousness → how combination? ≠ Why consciousness?" 

  "Integration explains unity" will come from cognitive science students. Counter: GWT/IIT measure causal integration, but the choral animal already has that—and still the leap to subjective unity is unexplained. Ask: "Does knowing bandwidth between modules tell you why their experiences fuse?" 

  The inheritance problem... interesting. It might be quality problem in disguise? If the whole inherits *specific* parts' qualities rather than averaging, it's about structural alignment. Example: if micro-experiences are like pure tones, why is the whole a chord rather than noise? That connects to quality/structure issues. But phrasing it as "inheritance" may help students see the arbitrariness. 

  Final diagnostic question: "If we swapped neuron A's experience with neuron B's, would the animal's unified field change? Why/why not?" If they grasp combination, they'll see this probes whether macro-experience supervenes on micro-qualia organization—and if not, why not. 

  Explicitly decline: any solution proposals (Russellian monism, etc.) and debates about micro-consciousness plausibility. This session is about sharpening the problem, not solving it. 

  ...Wait, did I miss the decomposition level issue? Yes—students will ask "why stop at neurons?" Need to flag that the combination problem recurs at every scale, but the choral animal fixes a level to avoid infinite regress. Stress it's arbitrary for pedagogy. 

  Solid framework. My tweaks: scaffold harder on physicalism's shortcomings first, then let choral animal expose combinatoric gaps specifically. Murder-board the misconceptions in planned order. Inheritance stays—it's quality/structure with a useful twist.
answer: |-
  Here’s a stress-tested lesson plan structured around your "choral animal" case, designed to preempt misconceptions and isolate the combination problem. Prioritize conceptual scaffolding *before* introducing the example to force engagement with its specific puzzles.

  ---

  ### **Pre-Choral Animal Groundwork (15 min)**
  **What must be in place first:**  
  1. **Reaffirm the hard problem’s core** (5 min):  
     - *Purpose:* Preempt "this is just the hard problem redux."  
     - *Method:* Contrast *structural/functional* explanations (e.g., how brain integration enables reportability) with *phenomenal* explanations (e.g., why integration feels like *anything*). Use Mary’s Room: even knowing all physical/functional integration facts, she learns *what experience is like*.  
     - *Key move:* "Today, we’re granting physicalism’s failure here—not re-litigating it. We start *after* accepting that experience is fundamental."  

  2. **Introduce constitutive panpsychism minimally** (10 min):  
     - *Purpose:* Preempt "emergentism/causation dissolves it."  
     - *Method:* Define panpsychism as "consciousness is fundamental and ubiquitous," then distinguish:  
       - **Constitutive panpsychism:** Macro-experience is *composed* of micro-experiences (like water molecules composing a wave).  
       - **Emergent panpsychism:** Macro-experience *arises from* but isn’t composed of micro-experiences (like temperature from particle motion).  
     - *Stress:* "We’re examining *constitutive* panpsychism. If micro-experiences exist, how do they *combine* into macro-subjects? Not how they cause macro-experiences."  

  ---

  ### **Introducing the Choral Animal (10 min)**  
  **What the case MUST have/lack:**  
  - **Must have:**  
    - (a) Stipulated fundamental micro-phenomenality (e.g., each neuron has a "thin" experience: e.g., a pure tone).  
    - (b) Stipulated macro-unity (the animal has one rich, unified field: e.g., a symphony).  
  - **Must lack:**  
    - Any explanation for how (a) → (b). No "integration mechanisms" or causal stories.  
  - **Why avoid colonies/hives:**  
    - Colonies (e.g., ants) lack stipulated micro-phenomenality. Students will say macro-behavior "emerges" from non-conscious parts—*exactly* the move panpsychism blocks. The choral animal forces the question: "If parts *are* conscious, why isn’t the whole either fragmented or a 'group subject'?"  

  ---

  ### **Generating the Four Problems & Preempting Misconceptions (40 min)**  
  Sequence questions and rebuttals **in real-time** as misconceptions arise:  

  | **Question**               | **Predicted Misconception**                          | **Preemption Strategy**                                                                 |  
  |----------------------------|-----------------------------------------------------|------------------------------------------------------------------------------------------|  
  | **Q1: How many subjects?** | *"The macro-subject is just the whole constituted by parts."* | Ask: "Is the United States a subject? No—it has no unified POV. Why does the choral animal have *one* subject, not a committee?" Stress: Mereological constitution ≠ subjective unity. |  
  | **Q2: Decomposition level?** | *"Integration measures (IIT/GWT) explain unity."* <br> *"If micro-experiences are thin, combination is trivial."* | Challenge: "IIT calculates Φ, but does a high Φ explain why micro-qualia *fuse* rather than just interact? If a neuron’s experience is ‘thin,’ does that explain why 86 billion don’t just ‘sum’ to noise?" |  
  | **Q3: Quality problem?**   | *"Emergence/causation bridges the gap."*            | Retort: "Constitutive panpsychism isn’t causal. If the micro-qualia are *ingredients* of macro-qualia, how do colorless tones compose a symphony? Causation doesn’t explain constitution." |  
  | **Q4: Inheritance problem?** | *"This is just Q3 in disguise."*                    | Clarify: "Q3 is about *novel qualities* (tones → symphony). Inheritance asks: Why does the macro-subject inherit *all* parts’ contents? Why not just one part’s? E.g., why isn’t the animal ‘hearing’ only neuron #42’s tone?" |  

  **On the inheritance problem:** It’s distinct but adjacent. Quality problem = "Why symphony, not noise?" Inheritance problem = "Why does the subject experience the *symphony* rather than *ignoring* 99.9% of micro-qualia?" It collapses into the subject problem if unity implies inheritance—but press students: "Does unity require inheriting *all* contents? Why?"  

  ---

  ### **Consolidation & Diagnostic (15 min)**  
  - **Final diagnostic question (5 min):**  
    *"If we duplicate the choral animal’s physical structure exactly but scramble the micro-experiences (e.g., swap tones between neurons), would the macro-experience differ? Why?"*  
    - **Target insight:** If they say "yes," they grasp that macro-experience depends on *specific organization* of micro-qualia (structure problem). If "no," they’ve missed that micro-phenomenality is fundamental. If they appeal to "emergence," they’ve relapsed.  

  - **Explicitly decline to explain (state aloud):**  
    - "We’re not solving the problem today—we’re sharpening it. I decline to explain:  
      (a) *Whether* micro-experiences exist (we’re granting panpsychism for argument’s sake),  
      (b) *How* integration mechanisms (IIT/GWT) relate to phenomenal unity (they don’t address constitution),  
      (c) Whether emergence is a viable alternative (that’s next week)."  

  ---

  ### **Why this works**  
  - **Choral animal’s role:** By stipulating both micro/macro levels *without explanation*, it isolates the "combinatory gap." Colonies fail because they invite emergentist deflation.  
  - **Misconception order:** Preempts "hard problem" by staging it first, blocks "integration explains unity" before Q2, and neutralizes "thin experiences solve it" during Q2.  
  - **Inheritance problem:** Kept separate to highlight the subject/quality/structure triad’s insufficiency. If time runs short, fold it into Q1 as "unity of perspective."  

  This plan forces students to confront the combinatory gap *as a distinct puzzle*—not a shadow of the hard problem. The choral animal, pre-loaded with constraints, becomes a lens to refract the problem into its four facets.
