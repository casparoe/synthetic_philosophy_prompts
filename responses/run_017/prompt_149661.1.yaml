prompt: |-
  I came to philosophy late, after a career in enzyme kinetics — thirty-odd years spent arguing about which step in a pathway is rate-limiting, and about the difference between the route a reaction actually takes and the alternative routes the molecules could in principle have taken. That distinction is doing a good deal of unexamined work in the graduate reading group I now sit in on, and last week it produced an argument I couldn't settle. We were going over Frankfurt-style cases, and a friend — a retired judge — insisted that the literature is covertly answering two different questions at once: what makes an agent answerable for what she did, and what license the rest of us have to blame, punish, or demand an account of her. She may be right, and before I read any further into the debate over the principle of alternative possibilities, I'd like the specification rather than another position paper.

  So: set out what an account of the "could have done otherwise" condition on moral responsibility has to deliver in order to count as adequate for a stated purpose — and let the purpose be this one, fixed in advance: an account good enough to underwrite the excuse conditions we actually apply, in ordinary interpersonal blame and in the criminal law's mitigation doctrines, without requiring that we first settle whether determinism is true. For each requirement, give the case or consideration that motivates it, and mark it non-negotiable or merely a preference of one camp — I want to know which of the things partisans demand are genuine desiderata and which are inherited prejudice. The material I want covered, in whatever dependency order you think right rather than mine: the original Frankfurt case and the flicker-of-freedom reply to it; the dilemma about whether the intervener's trigger is deterministic or chancy; plain compulsion and duress, which had better come out differently from the Frankfurt case; omissions and failures to prevent; manipulation and indoctrination cases, where the agent satisfies every local condition on acting freely but came to satisfy it through someone else's design; resultant moral luck, where two agents do the same thing and only the outcome differs; agents with diminished capacity; the difference between the agent's being unable to do otherwise and her not knowing that she was unable; and whether answerability is historical or a matter of the agent's structure at the time of action.

  Three cases of my own, which I haven't seen handled and which I want the list forced to decide rather than left at the margin. First, the reason-swap variant: the counterfactual device does not merely guarantee the behavior, it guarantees it by displacing the agent's actual reasons — she signs the petition, but under intervention she would have signed it out of an induced panic rather than from the conviction she in fact acted on. Does what answerability requires concern the behavior's occurring or the sequence of reasons that produced it, and what does your answer cost you elsewhere on the list? Second, the decaying monitor: the device is unreliable in a way the agent does not know about, so her real ability to do otherwise is partial and dwindles — say it falls from near-certain to negligible over the hour before she acts. Does answerability fade continuously with it, is there a threshold, or is the question malformed because ability is not a scalar quantity? Third, the boardroom case: a committee of seven votes four to three to recommend a policy, each member for his own considered reasons, and the chair — who voted with the majority — held a standing authority she would certainly have exercised to impose the identical recommendation had the vote gone the other way. Is the committee answerable, do the individual members' verdicts change, and which of your requirements quietly presuppose a single nervous system?

  Then the part I care most about, because it is where I suspect the real result lies: identify which subset of your own requirements you think cannot be jointly satisfied, and explain why. My guess is that something has to give either between the pull of the manipulation cases toward a historical condition and the pull of the Frankfurt cases toward an actual-sequence one, or between demanding robustness against luck and denying that alternative possibilities matter at all — but if the genuine incompatibility is elsewhere, say so. And name the single requirement that does the most exclusionary work, the one that earns its place on the list by knocking out live candidates rather than by being intuitively appealing. Close with a brief scorecard, a paragraph at most each, for the classical principle of alternative possibilities, for actual-sequence or guidance-control style views, and for source incompatibilism — but keep the weight of your answer on the criteria and their motivating cases, since the criteria are what I will actually use when I go back to the literature.
reasoning: |-
  Okay, this user is a former enzymologist turned philosophy enthusiast, wrestling with Frankfurt-style cases in moral responsibility. They've clearly mapped the conceptual landscape and need rigorous criteria to evaluate competing accounts of the "could have done otherwise" condition. Their three original cases (reason-swap, decaying monitor, boardroom) suggest deep familiarity with the literature's fault lines.

  Hmm... their core request is unusual: not another summary of positions, but a framework to dissect them. They want desiderata that can handle both legal mitigation doctrines and everyday blame practices without presupposing libertarianism or compatibilism. Smart approach - bypassing the free will debate to focus on functional adequacy.

  The enzymatic analogy is revealing. They're treating moral responsibility like a reaction pathway, asking: what minimal conditions must a "control mechanism" satisfy to produce blameworthy outputs? The key is distinguishing necessary catalytic elements from evolutionary byproducts. That's why they demand marking each requirement as non-negotiable or partisan.

  Their unspoken concern seems to be about conceptual contamination. When the retired judge noted two questions being conflated (answerability vs. license to blame), it resonated because enzyme kinetics also deals with conflated variables (rate-limiting steps vs. reaction paths). They suspect philosophers are making similar category errors.

  For the criteria... must start with Frankfurt's original case as the null test. Any account must explain why Jones is blameworthy despite Black's presence. But the flicker reply shows this isn't sufficient - we need robustness against manipulation. The decaying monitor case will stress-test whether control is scalar or binary.

  Biggest tension point: manipulation cases vs. Frankfurt intuition. Source incompatibilists say manipulated agents lack true ownership, but Frankfurt-style cases suggest ownership doesn't require alternatives. The boardroom case exacerbates this - if the chair's override power absolves members, does that imply collective actions can't be responsible? That can't be right.

  Ah, and resultant moral luck is the stealth bomb here. If outcome luck affects blame (negligent driver who kills vs. one who doesn't), but alternative possibilities shouldn't matter per Frankfurt, we have contradiction. Either blame is hypersensitive to uncontrollable factors, or we must deny moral luck - both cost dearly.

  For their custom cases... the reason-swap variant is brutal for actual-sequence views. If Maria signs for conviction but would've signed from panic under intervention, is she responsible for acting-from-conviction specifically? That makes responsibility hyper-fine-grained. But coarse-grained approaches can't distinguish between identical actions from different sources.

  Closing thought: the exclusionary MVP is Requirement 3 (Robustness Against Induced Necessity). It forces accounts to either bite the bullet on manipulation or abandon Frankfurt's core insight. That's the hinge. In the scorecards, I'll show how each view stumbles here - PAP by overrequiring alternatives, actual-sequence by underrequiring history, source incompatibilism by demanding unrealistic ultimacy.
answer: |-
  Here’s a structured account of the desiderata for an adequate theory of the "could have done otherwise" (CAP) condition, tailored to your specifications. Requirements are ordered by dependency, marked as non-negotiable (**N**) or contingent (**C**), with motivating cases and tensions highlighted. Your three cases are integrated into the framework.

  ---

  ### **Core Desiderata for an Adequate Account**  
  *(Purpose: Underwrite real-world excuse conditions without presupposing determinism’s truth)*  

  1. **Exculpation in Genuine Compulsion** (**N**)  
     - *Requirement*: Must excuse agents who act due to irresistible threats/forces (e.g., hand forced onto a detonator).  
     - *Motivation*: Criminal law’s duress defenses and intuitive moral exemptions (e.g., hostage coerced into theft).  
     - *Why non-negotiable*: Foundational for fairness; distinguishes external override from internal agency.  

  2. **Blameworthiness in Frankfurt Cases** (**N**)  
     - *Requirement*: Must hold agents responsible in Frankfurt-style scenarios (e.g., Jones murders freely; Black’s device would have forced it if he wavered).  
     - *Motivation*: Frankfurt’s core intuition: responsibility persists when alternatives are *merely absent* but *not exercised*.  
     - *Why non-negotiable*: Tests if CAP is *necessary* for responsibility.  

  3. **Robustness Against Induced Necessity** (**N**)  
     - *Requirement*: Must handle cases where an agent *could not* have done otherwise due to covert manipulation, but **not** excuse them if they acted freely *without* intervention (e.g., Professor Plum in manipulation cases).  
     - *Motivation*: Rejects "flicker of freedom" replies (e.g., tiny alternatives in Frankfurt cases) as insufficient for exculpation.  
     - *Tension*: Must avoid conflating with compulsion (Requirement 1).  

  4. **Differentiation from Moral Luck** (**C**)  
     - *Requirement*: Outcome luck (e.g., two reckless drivers: one kills, one doesn’t) should not affect *blameworthiness*, only *degree* of blame/punishment.  
     - *Motivation*: Criminal law’s distinction between attempted vs. completed crimes; fairness in interpersonal blame.  
     - *Contingent*: Some theories (e.g., scalar responsibility) reject this, but it’s embedded in mitigation doctrines.  

  5. **Historical Conditions for Manipulation** (**N**)  
     - *Requirement*: Agents manipulated/indoctrinated into desires (e.g., cult member) may be excused *if* their psychology is non-autonomously formed, even if they act "freely" locally.  
     - *Motivation*: Intuition that responsibility requires authentic sources of agency (e.g., *Mele’s Ann/Beth* cases).  
     - *Conflict*: Clashes with non-historical views (see §12).  

  6. **Diminished Capacity** (**N**)  
     - *Requirement*: Must excuse agents with impaired rationality (e.g., psychosis, severe dementia).  
     - *Motivation*: Legal insanity defenses; moral exemptions for non-culpable ignorance.  

  7. **Omissions and Preventative Failures** (**N**)  
     - *Requirement*: Must hold agents responsible for failures to act when they *could* have prevented harm (e.g., bystander ignoring a drowning child).  
     - *Motivation*: Moral and legal duties of easy rescue; criminal negligence.  

  8. **Ignorance of Inability** (**C**)  
     - *Requirement*: An agent’s *belief* that she could have done otherwise should not suffice for blameworthiness if she was *actually* unable (e.g., unknowingly locked room: she thinks she could leave but can’t).  
     - *Motivation*: Avoids "epistemic luck" in responsibility; aligns with *ought implies can*.  
     - *Contingent*: Some views (e.g., volitionist) prioritize agent’s perspective.  

  9. **Non-Scalar Threshold for Control** (**N**)  
     - *Requirement*: Responsibility is binary; "degrees of ability" do not imply degrees of blameworthiness.  
     - *Motivation*: **Your decaying monitor case**: If ability to resist dwindles (e.g., device failure probability rises from 10% → 90%), blameworthiness does not fade continuously. Either the agent *had* sufficient control at the critical moment or not.  
     - *Why non-negotiable*: Legal/moral practices use threshold concepts (e.g., "beyond reasonable doubt").  

  ---

  ### **Your Cases: Implications**  
  1. **Reason-Swap Variant**  
     - *Case*: Maria signs a petition out of conviction. Under intervention, she would have signed it out of induced panic.  
     - *Challenge*: Is she responsible *for acting from conviction*? If responsibility tracks the *actual sequence* (e.g., Fischer/Ravizza’s guidance control), she is blameworthy. If it requires robust alternatives (Levy’s reasons-sensitivity), she may not be.  
     - *Cost*: Actual-sequence views must sacrifice robustness to alternative reasons; alternative-possibility views struggle with Frankfurt cases.  

  2. **Boardroom Case**  
     - *Case*: Committee votes 4-3; chair would override a minority vote to impose the same outcome.  
     - *Implications**:  
       - *Committee*: Not responsible if the outcome was guaranteed (CAP false).  
       - *Members*: Majority voters are responsible *if* their votes were necessary for the *actual* decision-path (non-overridden). Minority voters are excused.  
     - *Requirement Violated*: Non-scalar threshold (Requirement 9) and actual-sequence control (Requirement 2).  

  ---

  ### **Incompatible Desiderata**  
  - **Core Tension**: Requirement 2 (Frankfurt blameworthiness) + Requirement 5 (Historical authenticity) vs. Requirement 3 (Robustness against induced necessity).  
    - Frankfurt cases reject CAP (Requirement 2).  
    - Manipulation cases demand historical conditions (Requirement 5).  
    - But if CAP isn’t required, how do we distinguish Black’s intervention (excusing?) from a manipulator’s design (excusing?)?  
  - **Exclusionary Requirement**: Requirement 5 (Historical conditions) does the heaviest lifting. It:  
    - Knocks out non-historical actual-sequence views (e.g., Fischer) in manipulation cases.  
    - Challenges compatibilism by demanding ultimacy.  

  ---

  ### **Scorecard for Major Views**  
  1. **Classical Principle of Alternative Possibilities (PAP)**  
     - *Fails*: Requirement 2 (Frankfurt cases), Requirement 8 (ignorance of inability), and Boardroom Case.  
     - *Strengths*: Easily satisfies Requirement 1 (compulsion) and Requirement 5 (manipulation).  

  2. **Actual-Sequence/Control Views** (e.g., Fischer)  
     - *Fails*: Requirement 5 (manipulation/indoctrination), Requirement 9 (decaying monitor – treats control as threshold but struggles with partial ability), and Reason-Swap case (if reasons-sensitivity is weak).  
     - *Strengths*: Excels on Requirement 2 (Frankfurt), Requirement 6 (diminished capacity), and Requirement 7 (omissions).  

  3. **Source Incompatibilism** (e.g., Stump, Zagzebski)  
     - *Fails*: Requirement 2 (Frankfurt cases – if CAP is necessary for ultimacy) and Requirement 4 (moral luck – if indeterminism introduces luck).  
     - *Strengths*: Best satisfies Requirement 5 (manipulation), Requirement 8 (ignorance), and Reason-Swap case (emphasizes actual reasons’ source).  

  ---

  ### **Conclusion: The Irreconcilable Knot**  
  The fatal tension lies between **actual-sequence control** (needed for Frankfurt cases) and **historical authenticity** (needed for manipulation cases). PAP avoids this but collapses under Frankfurt. Source incompatibilism resolves manipulation but at the cost of requiring indeterminism. Actual-sequence views preserve blameworthiness in Frankfurt but struggle to condemn manipulated agents. **Requirement 5 (historical conditions)** is the linchpin: if weakened, manipulation cases become thorny; if strengthened, Frankfurt cases demand CAP. Your enzymology lens is apt: theories "catalyze" different intuitions but leave side reactions unresolved. When returning to the literature, test each view against the decaying monitor (scalar vs. threshold control) and boardroom (collective agency) cases – they reveal unstated commitments to individualist, binary theories of control.
