prompt: |-
  Hi. I need help drafting a fellowship proposal, and I'd like you to act as a professional philosopher who works on social ontology and the philosophy of the social sciences, with enough population biology under your belt to notice when I'm abusing an analogy. Please think about this carefully and take your time: before you start drafting, spend a few paragraphs brainstorming three or four different ways the question could be framed, say which one you'd pick and why, and note which of the others you dropped because they don't have a determinate answer. Then write the actual proposal.

  Some background so you know where this is coming from. I'm 71, retired from a career in evolutionary biology and taxonomy — mostly species delimitation and population structure in a badly behaved species complex — and for the last couple of years I've been sitting in on philosophy seminars at the local university and reading on my own, which is how I got into this. Assume I know what a cline, a hybrid zone, a type specimen and a non-identifiable model are; dont assume I knowwho's who in the philosophy literature. The proposal goes to a committee that is roughly half philosophers and half social scientists (demographers, sociologists) funding interdisciplinary work: they like a clear deliverable and they get impatient with pure armchair stuff.

  The topic is whether generations are real kinds — Boomers, Millennials, Gen Z and the rest — and here's my half-formed idea. As far as I can tell there are three live accounts: the deflationary one, on which a generation is just an arbitrary slice of birth year and the real patterns are age effects and period effects in disguise; the causal one, on which shared exposure to a formative environment produces genuinely shared dispositions, which is what people mean when they talk about cohort effects in the data; and the looping one, on which the labels partly make the kind — being told you are a Millennial, and being caricatured by the next one along, feeds back into how you act and self-describe. My suspicion is that the second and third are usually run as rivals but are better seen as operating at different grains, and that the crux is something nobody in the philosophy discussion seems to take seriously enough: the age-period-cohort identification problem. Cohort is a linear function of period and age, so you cannot pull a separate cohort effect out of the data without importing some extra substantive assumption, and that assumption looks an awful lot like the philosophical thesis wearing a lab coat. Which would mean the move where people say the data show cohort effects is quietly begging the question.

  What I want from the taxonomy side is the question of grain. Instead of asking whether generations are real, ask whether there is any resolution at which the boundaries are forced — real discontinuities or thresholds in the adoption of practices, say a childhood with or without ubiquitous networked screens — rather than smooth clinal variation with boundaries drawn wherever a writer wants them. And where there are several rival plausible boundaries, treat the case the way a taxonomist treats a species complex: real enough in the middle, conventional at the edge. There's also the type-specimen problem: the ok-boomer style caricature anchors the name the way a physical specimen anchors a binomial, and I think it drags the extension of the term around, which is why people born near a boundary often refuse the label.

  Please write me a two-page proposal for a twelve-month, roughly half-time funded fellowship: the question stated precisely enough to have an answer; why the three accounts as usually stated leave it open; the method, month by month, given that I'm retired and slow and I have no grant money for data collection; why this angle rather than the obvious alternatives (going and doing survey work, or writing it as straight social constructionism, or doing it as conceptual analysis of the ordinary words); what a positive result would look like and what a negative one would look like; and what would count as the project failing. I'd also like an honest estimate of whether this is too big for twelve months, and what I should cut if it is. Deliverables I have in mind are one journal-length paper and one short piece for a general audience, plus maybe a one-day workshop at the end — tell me if that's the wrong set.

  Two constraints. First, no bibliography and no reading list — I know there is a large literature on social kinds and another one on cohort analysis, and I'll chase references myself, so refer to positions and arguments by description rather than by author and year. Second, plain American English please, no British spellings, and keep the prose flat rather than in grant-committee voice.

  One more thing, and I mean it: give me confidence tags on the load-bearing claims — high, medium, low — especially on whether the question is tractable in twelve months and on whether the identification point really does bite against the argument I think it bites against. And if you think my framing is muddled, or that the question as I've posed it can't be given a determinate answer, say so plainly rather than politely writing around it. I've had enough referees be pleasant in writing and then turn me down; I'd much rather you tell me this doesn't work and why.
