prompt: |-
  hey, so im a junior and I'm on the peer-review crew for my school's history club — before anyone submits an essay to the end-of-year thing (or to the contest a few of us enter), two or three of us read it and leave comments, and honestly the teacher mostly just reads what we wrote. we do like ten of these a week and we've got maybe five minutes each.

  this year everyone found out that germs and weather and volcanoes can be "historical actors" and now every single essay has the plague deciding stuff or a drought overthrowing a dynasty. some of that feels sharp and some of it feels like the lazy version where the volcano did everything and no human ever chose anything, and I definitly can't always tell which is which. my teacher's word for the bad version is "determinist", and his word for one specific bad move is "alibi" — like when an essay uses a drought as an alibi for a king who personally made three terrible calls in a row.

  I tried to invent my own rule and I want you to fix it or throw it out. I call it the swap test: if you swapped the germ, the drought, or the volcano for a different one of roughly the same size, would roughly the same thing still have happened? I think that's supposed to separate the cases where the non-human thing is just a generic trigger from the cases where it's doing specific work, but I'm not sure it does that and I think it breaks somewhere.

  what I actually need is a checklist the rest of the crew can run in five minutes without knowing any of the theory. Questions in order, what counts as a good enough answer to each, where the checklist just stops and says no, and where it has to hand the decision to a person because the question is about values and not facts. Keep my swap test if it survives and kill it if it doesn't, and be honest about which steps are judgment calls dressed up as procedure.

  then run it on three things: (1) my own essay, which argues the Black Death helped end serfdom because labor got scarce and peasants could suddenly demand wages — I want this one to pass, so be mean to it; (2) my friend's essay, which is basically "the Maya collapsed because of drought"; (3) something small or modern to check it doesn't overreach, like whether my little brother's alarm clock not going off "caused" him to miss the bus, or the 1815 Mount Tambora eruption and that cold messed-up summer people talk about.

  include at least one case where the procedure says no and I won't like the answer. and tell me what it can't do — I get that it can't tell me whether the plague really killed that many people, but what else should I not trust it for?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're part of a high school history club's peer-review crew, dealing with essays that overuse environmental/historical actors like plagues or volcanoes. The teacher criticizes "determinism" and "alibi" uses. The user created a "swap test" but feels unsure about it. They need a practical checklist for quick reviews, with clear pass/fail thresholds and acknowledgment of subjective judgments.

  First, I need to analyze why the swap test might fail. The user mentioned swapping similar events to see if outcomes change. But this could miss cases where the specific nature of the event matters. For example, swapping plagues might not capture how the Black Death's unique characteristics influenced labor markets. Also, some events might be interchangeable triggers, but the test doesn't address human agency sufficiently. The user wants to avoid determinism but still recognize real environmental impacts.

  Next, considering the checklist structure. The user needs something efficient—five minutes per essay. Key elements should include: identifying the non-human actor, checking if it's used as an alibi, assessing specificity of mechanisms, and evaluating human responses. Need clear yes/no questions where possible, but flag areas requiring judgment. For instance, asking if human choices are obscured can be binary, but evaluating the quality of causal links might be subjective.

  The user provided three test cases. For their Black Death essay, the challenge is to avoid bias since they want it to pass. The checklist should catch if they oversimplify by not showing how labor scarcity translated to systemic changes. The Mayan drought case is a classic determinism trap—needs scrutiny on whether drought alone caused collapse without considering political factors. The alarm clock example tests micro-history applicability; here, the checklist should recognize that while the clock is a trigger, human actions (like waking up late) are the real causes.

  I should also think about limitations. The checklist can't verify historical facts, assess source quality, or handle complex multi-causal events. It might struggle with essays that have partial determinism. Emphasizing these boundaries is crucial so the team doesn't over-rely on it.

  Need to integrate the swap test but refine it. Instead of direct swapping, use it as a secondary check: if swapping changes nothing, it's likely an alibi; if it changes outcomes, the actor has specific impact. But this comes after establishing human agency isn't being ignored.

  Finally, ensuring the checklist is actionable. Use simple language, sequential steps with clear exits (e.g., if Q1 is yes, reject). Include examples in each step so reviewers grasp the intent quickly. For instance, contrasting "drought caused famine" vs. "drought exacerbated existing agricultural issues" illustrates alibi vs. nuanced use.
answer: |-
  Here’s a streamlined 5-minute checklist designed for your peer-review crew, with brutal honesty about its limitations. Your "swap test" is refined but not discarded. **Bold = Key Questions**; *Italics = Judgment Calls*.

  ---

  ### **The Non-Human Actor Checklist**  
  *(Run these questions in order—stop and reject if any "NO" answer is unresolvable in 30 seconds)*  

  1. **🔍 IDENTIFY THE ACTOR:**  
     - *Question:* "Does the essay name a specific non-human actor (disease, climate, volcano, etc.) as a *direct cause* of a major historical outcome?"  
     - *Pass:* "YES" → Proceed.  
     - *Fail:* "NO" → Stop. Checklist doesn’t apply.  
     - *Judgment Level:* Low (factual).  

  2. **🚫 ALIBI TEST:**  
     - *Question:* "Is the actor used *only* to excuse human decisions/actions that clearly worsened the outcome? (e.g., 'The drought *made* the king raise taxes')."  
     - *Pass:* "NO" → Proceed.  
     - *Fail:* "YES" → **REJECT**. "Alibi" detected.  
     - *Judgment Level:* Medium (requires spotting human agency).  
     - *Your Teacher’s Example:* A king’s bad calls blamed *solely* on drought → "YES".  

  3. **🔧 MECHANISM CHECK:**  
     - *Question:* "Does the essay explain *how* the actor changed human choices? (e.g., 'Drought → crop failure → famine → peasant revolts → king overthrown')?"  
     - *Pass:* "YES, with at least one *human reaction* linked." → Proceed.  
     - *Fail:* "NO" (e.g., "Drought collapsed the dynasty") → **REJECT**. "Determinist magic wand."  
     - *Judgment Level:* Medium (must show causal chain).  

  4. **🔄 REFINED SWAP TEST:**  
     - *Question:* "If you swapped this actor for a *different but similarly disruptive one*, would the *human responses* likely lead to the *same outcome*? (e.g., swap 'drought' for 'locust swarm' in an agrarian society)."  
       - *If YES* → **WARNING: Generic trigger**. *Likely lazy determinism*.  
       - *If NO* → **Proceed**. Actor has specific impact.  
     - *Judgment Level:* High (requires historical imagination).  
     - *Why Keep It?* Flags when actors are interchangeable plot devices.  

  5. **⚖ AGENCY BALANCE:**  
     - *Question:* "Could humans have *mitigated* the actor’s impact? If so, does the essay address *why they failed*? (e.g., 'Elites hoarded grain during famine' vs. 'Famine killed elites')."  
     - *Pass:* "YES, or mitigation was impossible." → **ACCEPT**.  
     - *Fail:* "NO, humans are passive victims." → **REJECT**.  
     - *Judgment Level:* High (assesses historical constraints).  

  ---

  ### **Test Cases**  
  *(Applying the checklist strictly)*  

  1. **Your Essay (Black Death → End of Serfdom)**  
     - Q1: **YES** (Plague = actor).  
     - Q2: **NO** (Not excusing lords; labor scarcity is mechanism).  
     - Q3: **YES** (Plague → labor scarcity → peasants demand wages → lords relent).  
     - Q4: **Swap Test** → Swap plague for "30 Years’ War" (mass death)? Similar outcome? **YES** → **WARNING: Generic trigger**. *But proceed*.  
     - Q5: **YES** (Lords *could* have resisted longer via repression; essay implies their short-term greed for harvest overrode solidarity).  
     - **VERDICT: ACCEPT (but swap test flags weak specificity)**. *Be meaner: Demand examples of lords* actively choosing *wages over force*.  

  2. **Friend’s Essay (Drought → Maya Collapse)**  
     - Q1: **YES** (Drought = actor).  
     - Q2: **MAYBE NO** (If kings aren’t blamed, alibi test passes).  
     - Q3: **NO** → **REJECT**. "Drought collapsed Maya" = no human steps. *Even if true, checklist fails*.  
     - *Stop here*. To pass, essay must show *how* drought → war/famine/abandoned cities.  

  3. **Alarm Clock → Missed Bus (Micro-History Test)**  
     - Q1: **YES** (Alarm clock = actor).  
     - Q2: **YES** → **REJECT**. Clock is alibi for brother’s choices (staying up late, not setting backup alarm).  
     - *Stop here*. Humans used alarm clock as excuse.  

  4. **Tambora Eruption → 1816 "Year Without a Summer"**  
     - Q1: **YES** (Volcano = actor).  
     - Q2: **NO** (Not excusing humans).  
     - Q3: **YES** (Ash → global cooling → crop failures → famine/unrest).  
     - Q4: **Swap Test** → Swap Tambora for "super solar minimum"? Similar outcome? **YES** → **WARNING: Generic trigger**.  
     - Q5: **YES** (Governments *could* have distributed grain better; essay might note this).  
     - **VERDICT: ACCEPT**.  

  ---

  ### **What the Checklist CAN’T Do (Be Brutally Honest)**  
  1. **Judge historical accuracy** (e.g., "Did the plague *really* kill 50% of Europeans?").  
  2. **Handle multi-causal chaos** (e.g., WW1 caused by 10+ factors). It only targets *single-actor determinism*.  
  3. **Assess quality of evidence** (e.g., "This drought theory is based on one tree ring study").  
  4. **Resolve debates about "inevitability"** (Marxists vs. Gramscians on structure/agency).  
  5. **Save truly terrible writing**. It’s a logic sieve, not a polish.  

  ### **When to Overrule the Checklist**  
  - If an essay passes but feels "off," flag it for human review. Your teacher’s "alibi/determinist" instincts matter.  
  - If an essay fails Q3 or Q5 but offers brilliant new evidence, override and praise cautiously ("Solid data, but show humans reacting!").  

  ---  
  **Final Tip**: Print the checklist. Have reviewers scribble ✅/❌ at each step. If it stops at "REJECT," the essay needs rewriting. Your swap test survives as Q4 but warns rather than rejects. And yes, you *should* be meaner to your own essay—demand names of peasants who unionized, or lords who broke ranks!
