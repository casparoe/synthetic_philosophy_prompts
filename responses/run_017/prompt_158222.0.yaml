prompt: |-
  I'm retired — I was an atmospheric physicist for most of my working life — and I've somehow ended up as the handling editor who decides what authors are allowed to claim in their abstracts. I came to philosophy late, via philosophy of science, and I've been reading around verisimilitude. As far as I can make out, Popper's original version (roughly: true consequences minus false ones) was shot down in 1974 — the upshot being, if I've got this right, that no false theory can be closer to the truth than another, which is awkward given that most of our models are strictly speaking false — and the replacements that came afterwards don't agree with each other. Meanwhile authors and referees say "closer to the truth" constantly, and my editor-in-chief's only rule is that we don't let anyone claim anything we can't defend.

  So what I want is a procedure my referees can actually run. They're unpaid, they've got maybe fifteen minutes, none of them has any philosophy, and whatever I hand them has to fit in a box on the referee form and survive being read by a managing editor who wont read the literature.

  My own untrained idea is a four-anchor test: no verisimilitude claim gets through unless it names the target (what is it a model of), the aspect (which quantities, or which bit of structure, is supposed to be closer), the metric (how close, in units we can actually compute), and the comparator (closer than what, exactly). If an anchor can't be filled in, the claim gets downgraded to something weaker — empirical adequacy on a named battery of tests, say.

  Give me the questions in the order I should put them, what counts as a good enough answer to each, where the procedure just stops with a no, and — importantly — where it has to hand the decision back to a human because it's a judgement call rather than a matter of fact. Then run it on three cases, from my side of the field: (1) a successor atmospheric model, more parameters, beats the old one on every benchmark we have, authors want "closer to the truth" in the abstract; (2) two dose–response models in a pharmacology paper, one roughly gets the mechanism right and fits badly, the other is mechanistically nonsense and fits beautifully; (3) a review article claiming that a two-parameter cloud scheme from my own old group is closer to the truth than the thirty-parameter machine-learned thing that replaced it — I'd like that one to pass and I suspect your procedure will tell me it can't, so tell me straight. And say plainly where the whole thing misfires.
reasoning: |-
  Okay, let me unpack this atmospheric physicist-turned-editor's problem. He's wrestling with how to handle "closer to the truth" claims in abstracts when the philosophical foundations are shaky. His four-anchor test makes practical sense - target, aspect, metric, comparator - but needs operational teeth for time-poor referees.

  First, the core tension: scientists use verisimilitude language constantly despite Popper's definition crumbling in 1974 (Miller/Tichý proofs showing false theories can't compare). Current philosophical replacements (e.g., Schurz's relevant consequences, Niiniluoto's likeness) are too technical for journal workflows. The editor needs a bulletproof filter, not perfection.

  His four anchors hold up philosophically:
  - Target: Must specify the real-world system modeled (e.g., "tropical cyclone intensification")
  - Aspect: Which outputs/structure matter? (e.g., peak wind speed, not cloud patterns)
  - Metric: Quantifiable measure (RMSE, skill score - not handwaving)
  - Comparator: Baseline model named explicitly (e.g., "ECMWF v7")

  Now for referee implementation. The procedure must be:
  1. Sequential (fail any step = reject claim)
  2. Binary checks (no philosophy degrees needed)
  3. Escape valves where human judgment kicks in

  Testing on his cases:
  - Case 1 (successor model): Clears all anchors easily. Target (global circulation), aspect (all standard benchmarks), metric (defined scores), comparator (previous model). Safe pass.
    
  - Case 2 (pharmacology): Stalls at aspect. If the paper claims mechanistic truth but fits worse, that's incoherent per anchors. Downgrade to "superior empirical fit for [specific test]" only.

  - Case 3 (cloud schemes): His bias shows! The 2-param model fails metric anchor unless they define a structural similarity measure. Without that, it's just "computationally efficient alternative." Brutal but fair.

  Critical misfire scenarios:
  - When truth itself is contested (e.g., climate feedback mechanisms)
  - Cross-paradigm comparisons (e.g., deterministic vs stochastic models)
  - Where metric gaming occurs (optimizing wrong aspect)

  The real win is forcing specificity. Even when claims get downgraded, the science becomes more honest. And that's truth-adjacent enough for government work.
answer: |-
  Here's a procedural checklist for referees, designed around your four anchors. It's sequential: if any step fails, the claim must be downgraded or rejected. **Bold text** is the exact wording for the referee form box; regular text is implementation guidance.

  ---

  ### **VERISIMILITUDE CLAIM CHECKLIST**  
  *(Run in order; stop at first failure)*  

  1. **TARGET ANCHOR: Does the abstract explicitly name the specific real-world phenomenon the model claims to represent?**  
     - *Good enough:* Names a concrete, measurable system (e.g., "Arctic sea ice extent," "tropical cyclone intensification," "dopamine receptor binding kinetics").  
     - *Stop/reject:* Vague targets (e.g., "climate system," "biological processes"). Downgrade to "empirical model for [specific test]."  
     - *Judgement call?* No — this is factual.  

  2. **ASPECT ANCHOR: Does the abstract specify which *aspect* of the target is claimed closer?**  
     - *Good enough:* Identifies quantifiable variables, structural features, or functional behaviors (e.g., "surface temperature trends," "cloud microphysics parameterization," "EC50 values").  
     - *Stop/reject:* Unspecified aspects (e.g., "the physics," "overall behavior"). Downgrade to "improved fit for [specific variable]."  
     - *Judgement call?* No — must be explicit.  

  3. **METRIC ANCHOR: Is a *computable metric* defined that measures "closeness" for the aspect?**  
     - *Good enough:* Quantitative, domain-standard measure (e.g., RMSE, skill score, AIC, structural similarity index). Must be reported in results.  
     - *Stop/reject:* Subjective/undefined metrics (e.g., "more realistic," "better captures"). Downgrade to "performs better on [named benchmark]."  
     - *Judgement call?* Yes — if the metric is novel but defensible (e.g., a new skill score). Human editor decides.  

  4. **COMPARATOR ANCHOR: Does the abstract name a *specific alternative model* being compared against?**  
     - *Good enough:* Cites a model (e.g., "CMIP6-EC-Earth3," "Langmuir adsorption model").  
     - *Stop/reject:* Implied/vague comparators (e.g., "previous models," "conventional approaches"). Downgrade to "outperforms baseline models on [metric]."  
     - *Judgement call?* No — must be named.  

  ---

  ### **Case Tests**  
  **Case 1 (Successor atmospheric model)**  
  - Target: Likely passes (e.g., "global circulation").  
  - Aspect: Likely passes (lists benchmarks, e.g., "extremes, seasonal forecasts").  
  - Metric: Passes (reports scores, e.g., "RMSE reduced by 15%").  
  - Comparator: Passes (names old model, e.g., "ERA5").  
  - **Verdict:** Allow "closer to the truth" claim. *Rationale:* All anchors defined; metric is empirical dominance.  

  **Case 2 (Dose–response models)**  
  - Target: Passes (e.g., "in vitro opioid receptor response").  
  - Aspect: **Fails** if abstract claims "mechanistic truth" without defining measurable structural aspects.  
    - *Referee action:* Reject "closer to truth." Downgrade to:  
      - "Model A fits dose-response data better (lower AIC)."  
      - "Model B better replicates crystal structure kinetics (RMSD < 2Å)."  
    - *Note:* If authors separate claims (fit vs. mechanism), allow mechanistic truth *only* if they define a structural metric (e.g., protein conformation similarity).  

  **Case 3 (2-param cloud scheme vs. ML model)**  
  - Target: Passes (e.g., "marine boundary-layer clouds").  
  - Aspect: Fails *unless* aspect is defined as interpretability or physical consistency (e.g., "energy conservation," "explainable entrainment rates").  
  - Metric: **Critical failure.** If authors use only fit metrics (e.g., error scores), ML model wins. If they define a *structural* metric (e.g., "variance in cloud-radiative feedbacks matches LES"), it passes.  
  - Comparator: Passes (names ML model).  
  - **Verdict:** *Reject "closer to truth"* unless they:  
    - (a) Specify aspect = physical plausibility (not predictive skill),  
    - (b) Define a computable metric for it (e.g., "violates conservation laws 80% less often").  
    - *Your bias note:* You’re correct — without (a)+(b), this claim fails. Salvage by reframing: "retains physical fidelity at lower complexity."  

  ---

  ### **Where This Misfires**  
  1. **When "truth" is contested** (e.g., quantum interpretations). Procedure defaults to empirical adequacy.  
  2. **Cross-paradigm comparisons** (e.g., deterministic vs. stochastic models). Anchors force explicit aspect/metric trade-offs.  
  3. **Metrics gaming** (e.g., overfitting one aspect). Mitigated by requiring domain-standard metrics.  
  4. **Human override:** If a novel metric (Step 3) is proposed, the editor must judge if it’s philosophically defensible (e.g., measures "explanatory depth").  

  ### **Final Note**  
  This procedure replaces *verisimilitude* with *specificity*. It blocks lazy "truthiness" but permits rigorous claims if authors define their terms. In your cloud scheme case, force authors to justify *why* physical interpretability matters — then let them say it. Philosophy’s job isn’t to ban language, but to make us use it precisely.
