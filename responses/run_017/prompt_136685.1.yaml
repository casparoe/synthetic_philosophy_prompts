answer: |-
  **I reject step (3), at the cost of having to ground normative constraints on convention choice without appealing to a "further fact" of identity.**

  Step (3) claims that if there's no further fact about identity, then *no way of drawing boundaries is correct or incorrect in itself*. This is the step that licenses convention shopping in (5)-(6). I deny this. While anatta (step 1) means there is no *metaphysical* fact about identity beyond the causal stream and its conventional designation (step 2), it does *not* follow that all conventions are equally valid or arbitrary *for specific purposes*. Conventions are adopted *for reasons* (step 4), and these reasons impose normative constraints. A convention chosen purely for self-serving advantage ("convention shopping") violates the very purpose for which the concept of "person" exists in contexts like ethics, law, or promise-keeping: namely, to enable accountability, responsibility, and coherent narrative over time within a community. Using the coarse convention for credit and the fine-grained one for blame isn't merely "not getting anything wrong" metaphysically (step 6); it *is* getting something wrong *functionally*. It defeats the point of having the convention in that domain. The "bogus" feeling (step 7) arises because it's a performative contradiction: the agent relies on the *social practice* of ascribing identity (to claim credit or avoid blame) while simultaneously undermining the stability and fairness that practice requires.

  **Cost & New Problem:** Rejecting (3) means I must accept that some conventions are *objectively better* or *more justified* than others *for specific purposes*, even without a metaphysical "further fact". This requires grounding normativity in something other than identity metaphysics – likely in the *functional requirements* of the practice (e.g., justice, social cohesion, minimizing suffering, keeping promises) and the empirical nature of the causal stream (e.g., degrees of psychological connectedness mattering more for some purposes than others). The **new problem** this creates is defending *which* normative constraints matter and *why* without implicitly smuggling in a hidden "self" or falling into relativism. I must explain *why* the eighty-year-old with dementia is normatively linked to the promiser (e.g., because society must care for the vulnerable being causally descended from the agent, or because residual obligations persist in the absence of full continuity) without saying they are metaphysically "the same person". This is messy and context-dependent, but avoids both brute identity facts and the reductio of convention shopping. The population ethics worry dissolves similarly: conventions for counting persons must serve a coherent purpose (e.g., tracking welfare subjects); arbitrarily fine-grained counting that inflates numbers without correlating to distinct loci of suffering/well-being violates that purpose. I'm highly confident this rejection is necessary and feasible, though defending the normative constraints robustly is an ongoing philosophical task.
