  ### Decision Tree for Classifying Positions on the Badness of Pain  
  *Designed for clinical palliative care context. Each leaf provides verdicts on three axes:*  
  1. **Pain?** Is the patient in pain (for clinical purposes: chart, consent, family discussion)?  
  2. **Reason to treat?** Is there a *pro tanto* reason to treat the sensation? Whose reason? (P = patient's prudential, C = clinician's duty, I = impersonal reason).  
  3. **Hidden badness?** Could the badness of pain be hidden from the subject?  

  **Branching Questions** (6 nodes, 5 from profiles + 1 new case):  
  1. **Case A (Indifferent Discriminator):** Is this patient *in pain*?  
  2. **Case B (Unlocatable Sufferer):** Is this patient *in pain*?  
  3. **Case C (Unmoved):** Is this patient *in pain*?  
  4. **Case D (Shrugger):** Is there a *pro tanto* reason to treat this sensation?  
  5. **Case E (Relabeller):** When told the stimulus causes "micro-damage," is the *unpleasantness* real?  
  6. **New Case F (Unconscious Reactor):** An anesthetized patient shows tachycardia and grimacing to noxious stimuli but cannot report. Is there a *pro tanto* reason to treat?  

  ---

  ### Tree Structure  
  **Start**  
  ↓  
  **Q1: In Case A (Indifferent Discriminator), is the patient in pain?**  
  - **No** → Go to Q2  
  - **Yes** → Go to Q3  

  **Q2 (If A is *not* pain): In Case B (Unlocatable Sufferer), is the patient in pain?**  
  - **No** → Go to Q4  
  - **Yes** → **Leaf 1: Hedonic View**  

  **Q3 (If A *is* pain): In Case B (Unlocatable Sufferer), is the patient in pain?**  
  - **No** → Go to Q6 (Case F)  
  - **Yes** → Go to Q5  

  **Q4 (If A and B are *not* pain): In Case C (Unmoved), is the patient in pain?**  
  - **No** → **Leaf 6: Tripartite View (unnamed)**  
  - **Yes** → **Leaf 2: Composite View**  

  **Q5 (If A and B *are* pain): In Case D (Shrugger), is there a reason to treat?**  
  - **No** → **Leaf 7: Attitudinal View**  
  - **Yes** → **Leaf 3: Evaluative-Representational View**  

  **Q6 (If A is pain but B is not): In Case F (Unconscious Reactor), is there a reason to treat?**  
  - **No** → **Leaf 8: Deflationary-Semantic View**  
  - **Yes** → **Leaf 4: Sensory-Imperativist View**  

  **Q7 (After Leaf 1): In Case E (Relabeller), is the unpleasantness real when told of "micro-damage"?**  
  - **No** → **Leaf 5: Anti-Realist Hedonics (unnamed)**  
  - **Yes** → Remain at **Leaf 1**  

  ---

  ### Leaves (8 Total)  
  1. **Hedonic View**  
     - **Pain?** A: No | B: Yes | C: Yes | D: Yes | E: Yes (if unpleasant) | F: No  
     - **Reason?** A: None | B: P | C: P | D: P | E: P (if unpleasant) | F: None  
     - **Hidden?** No  
     - *Awkward commitment:* Must insist D’s denial of badness is irrelevant to normative reasons.  

  2. **Composite View**  
     - **Pain?** A: No | B: No | C: Yes | D: Yes | E: Yes (if unpleasant) | F: No  
     - **Reason?** A: None | B: P (due to suffering) | C: P | D: P | E: P (if unpleasant) | F: I  
     - **Hidden?** No  
     - *Awkward commitment:* B’s agony isn’t "pain" but still demands treatment.  

  3. **Evaluative-Representational View**  
     - **Pain?** A: Yes | B: Yes | C: Yes | D: Yes | E: Yes (if "damage" believed) | F: No  
     - **Reason?** A: I (damage risk) | B: I | C: I | D: I | E: I (if "damage" believed) | F: I  
     - **Hidden?** Yes  
     - *Awkward commitment:* E’s pain is bad only when described as damaging, regardless of sensation.  

  4. **Sensory-Imperativist View**  
     - **Pain?** A: Yes | B: No | C: No | D: Yes | E: Yes | F: No  
     - **Reason?** A: I (body’s "command") | B: P | C: None | D: I | E: I | F: I  
     - **Hidden?** Yes  
     - *Awkward commitment:* C’s agony isn’t pain (no motivation) and warrants no treatment.  

  5. **Anti-Realist Hedonics (unnamed)**  
     - **Pain?** A: No | B: No | C: No | D: No | E: Never | F: No  
     - **Reason?** A: None | B: None | C: None | D: None | E: None | F: None  
     - **Hidden?** N/A  
     - *Why empty:* Unattractive; denies obvious suffering (e.g., in B) is real or reason-giving.  

  6. **Tripartite View (unnamed)**  
     - **Pain?** A: No | B: No | C: No | D: Only if motivated | E: Only if motivated | F: No  
     - **Reason?** A: None | B: P | C: None | D: None | E: None | F: None  
     - **Hidden?** No  
     - *Why empty:* Incoherent; C’s reported agony isn’t "pain" but B’s unfelt suffering is reason-giving.  

  7. **Attitudinal View**  
     - **Pain?** A: No | B: Yes | C: Yes | D: No | E: Yes (if unpleasant) | F: No  
     - **Reason?** A: None | B: P | C: P | D: None | E: P (if unpleasant) | F: None  
     - **Hidden?** No  
     - *Awkward commitment:* D’s sensation is identical to past pain but not bad or reason-giving.  

  8. **Deflationary-Semantic View**  
     - **Pain?** Context-dependent (A: sensory "pain" only; B: not "pain")  
     - **Reason?** A: None | B: P | C: P | D: None | E: P (if unpleasant) | F: I  
     - **Hidden?** No  
     - *Awkward commitment:* "Pain" has no unified definition, yet normativity is stable (unpleasantness = reason).  

  ---

  ### Notes on Unmerged Positions  
  - **Hedonic vs. Imperativist:** Separated by Q1 (Is A in pain?). Hedonic says no (requires unpleasantness); Imperativist (Leaf 4) says yes (pain as bodily command).  
  - **Composite vs. Tripartite:** Separated by Q4 (Is C in pain?). Composite (Leaf 2) says yes; Tripartite (Leaf 6) says no (requiring motivation).  

  ---

  ### Seminar Starter Questions (10-Minute Exercise)  
  1. **Case A (Indifferent Discriminator):** Is this patient *in pain*?  
     - *Why:* Splits hedonic views (no) from imperativist/evaluative views (yes), forcing confrontation on whether pain requires suffering.  
  2. **Case D (Shrugger):** Is there a *pro tanto* reason to treat?  
     - *Why:* Exposes whether badness depends on subjective attitudes (attitudinal: no) or objective features (hedonic/evaluative: yes).  
  3. **Case F (Unconscious Reactor):** Is there a reason to treat?  
     - *Why:* Tests if reasons are impersonal (yes) or require subjective experience (no), cutting across realist views.  

  ### Key Case for Flushing Out Badness Theories  
  - **Case A (Indifferent Discriminator)**  
    - **Why it works best:** Directly isolates unpleasantness-based views (badness requires suffering → no reason) from representation/imperative views (badness from damage/body-command → reason). Unlike D (attitudes) or E (beliefs), A’s sensory precision and absence of distress cleanly divide theories without conflating attitudes or beliefs.
