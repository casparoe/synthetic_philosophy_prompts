prompt: |-
  ok so I need help designing something, and I'm still mildly annoyed about it, which is probably why I'm writing this at 1am.

  I had a long argument with a friend last night about strong longtermism — the view, roughly, that what we most ought to be doing is fixed by the very long-run effects of our actions, because the future might hold astronomically more value than everything happening right now. He thinks its bunk. His line was that its just the old wager move all over again: you multiply a probability you made up by a payoff you made up, and of course you can justify whatever you like. I kept saying no, the point isn't the invented number, it's the size of what's at stake plus the fact that we seem to be at one of those moments where things can still be steered. We went round in circles for about two hours and I think we were arguing about different things — he was attacking the epistemics, I kept defending the axiology, and neither of us noticed.

  Anyway. I run a fortnightly applied ethics discussion group, about 16 undergrads, mostly philosophy but a quarter of them are econ and physics types who are comfortable with numbers. 75 minutes, a room with a whiteboard and no projector, no budget. I want one session where they run into this themselves. No lecture up front, and I'd rather they don't hear the words "longtermism", "expected value" or "existential risk" until the debrief — I want them to build the argument with their hands before anybody names it.

  What I want them to feel, in order:

  First, the scale thing. That a really tiny chance at an unimaginably big payoff beats a near-certain modest payoff, and not by a little. They should do that arithmetic themselves off cards or a sheet, not be told it.

  Second, and this is the part I care most about, because it's where my friend actually had a point: the tiny probability isn't handed to you, you assemble it. I want them to have to construct their own number by chaining guesses — is the risk real at all; does this intervention actually move it; does the effect last; is the future that follows any good; and so on. And I want them to discover on their own that the number they end up with depends much less on how optimistic or pessimistic their individual guesses are than on how many links they decide to chain together and where they start the chain. Two tables with equally sensible guesses, one using three links and one using six, land orders of magnitude apart and rank the options differently — and everybody thinks they made a factual guess when really they made a structural choice about how to model the problem. I've been calling it the telescoping thing; whatever you call it, name it in the debrief, not before.

  If you can get a third wrinkle in without bloating it: several tables are choosing between the same small menu of options, and I'd like them to hit the gap between the value of the cause and the value of their own contribution — overlap, somebody else would have done it anyway, that sort of thing. Drop it if it makes the session unwieldy.

  What I need from you: rules, materials (cheap, printable, no real money — dice or cards are fine, calculators allowed), the payoff scheme, a timeline with rough minute marks, and a debrief that maps specific moments in the room onto specific bits of the argument. Also: what will predictably go wrong the first time I run it and how to handle it — I can already see one group deciding the whole thing is rigged because another group got a bigger number — and a frank note on what a game like this cannot reproduce and that I'll have to say out loud myself. I'm guessing the big one is that we only get one history, so you can't check an expected value by running the lottery a hundred times.

  Last thing: give me one sentence I can use if somebody asks "isn't this just the wager argument again?", because that's exactly what my friend asked and I fumbled it.

  Keep the whole thing under about 1200 words.
reasoning: |-
  Okay, let me tackle this user's request. They want to design an applied ethics workshop where students discover longtermist arguments through a hands-on activity, without using jargon upfront. The key goals are making them grasp scale effects and how probability chains amplify uncertainty. 

  Hmm, the user seems frustrated after that debate with their friend - they're emphasizing how the structural choices in modeling matter more than individual guesses. That's the core insight to operationalize. I should create a scenario where students build probability chains for different interventions, comparing small-scale vs long-term impacts.

  First, materials: since it's low-budget, printable cards and worksheets would work. Need options like "malaria nets" vs "AI safety research" that contrast immediate vs future benefits. For probability chains, maybe use multipliers on cards that students combine? 

  Important: the activity must force comparisons between groups using different chain lengths. Like Group A only considers direct effects while Group B extends to long-term future impacts. That'll naturally create order-of-magnitude differences to reveal the telescoping effect. 

  Timing-wise... 15min setup, 30min group work, 20min debrief. Must prevent groups from feeling "rigged" - maybe emphasize that varying approaches are intentional? 

  For the wager argument rebuttal: need a crisp line distinguishing how this is about unavoidable structural choices rather than arbitrary numbers. Something like "The wager invents probabilities - this reveals how modeling choices constrain them." 

  Biggest limitation: real-world decisions don't have repeated trials for expected value. Should flag that in debrief. Also, might need to steer groups away from fixating on exact numbers toward the structural insights. 

  User really wants that "aha" moment about telescoping uncertainty. Every design choice should serve that.
answer: |-
  Here’s a complete workshop design focused on experiential discovery of longtermist reasoning, scaled for your constraints. Total runtime: 75 minutes.

  **Core Mechanics:**  
  Groups evaluate 4 interventions using **probability chains** they construct. Each "link" in the chain multiplies their estimated probability of success. Interventions have fixed "near-term impact" scores (visible) but hidden "long-term leverage" scores revealed only if groups build chains long enough to unlock them.

  ---

  ### **Materials (Printable)**  
  1. **Intervention Cards (4 types, 1 per group):**  
     - **A:** *Distribute Malaria Bednets (10,000 units)*  
       *Near-term impact: Saves ~500 lives this decade.*  
     - **B:** *Fund AI Safety Research (1 PhD fellowship)*  
       *Near-term impact: Trains 1 researcher. No immediate lives saved.*  
     - **C:** *Lobby for Climate Engineering Governance*  
       *Near-term impact: Small policy influence. No measurable lives saved.*  
     - **D:** *Seed Bank for Crop Diversity*  
       *Near-term impact: Preserves 200 seed varieties.*  

  2. **Probability Link Cards (6 types, multiple copies):**  
     *Each card has a question and a suggested probability range (e.g., 0.1%–20%). Groups assign a specific value within the range.*  
     - **Risk Exists?** (e.g., *"Will this problem still matter in 100 years?"*)  
     - **Intervention Works?** (e.g., *"Does this action reduce the risk?"*)  
     - **Effect Persists?** (e.g., *"Will the benefit last 50+ years?"*)  
     - **Scalable?** (e.g., *"Could this lead to larger changes?"*)  
     - **Future Value?** (e.g., *"If successful, does this improve civilization's trajectory?"*)  
     - **Value Lock-in?** (e.g., *"Could this prevent permanent value loss?"*)  

  3. **Worksheets:**  
     - Table for recording chain links (Intervention → Link 1: [Estimate] → Link 2: [Estimate] → ... → **Total Probability**)  
     - **Value Formula:** `Total Value = Near-Term Impact + (Long-Term Leverage × Total Probability)`  
     *(Long-Term Leverage = 1 billion for all cards – revealed only IF a group uses ≥3 links)*  

  4. **Calculators, pens, paper.**  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (5 min):**  
     *"Today you’re an ethics committee allocating one grant. Evaluate your assigned intervention using any logical steps. Your goal: calculate its total value using this formula."* Hand out materials. *No definitions given.*  

  2. **Group Work (35 min):**  
     - Groups pick 3–6 link cards to build their probability chain.  
     - They assign **specific probabilities** (e.g., 5%, 0.1%) to each link.  
     - Multiply links to get **Total Probability** (e.g., 0.05 × 0.1 × 0.5 = 0.0025).  
     - **Near-Term Impact** is fixed (e.g., Malaria: 500 points).  
     - **Long-Term Leverage (1B)** is revealed ONLY IF they use ≥3 links.  
     - Calculate **Total Value** (e.g., *Malaria*: 500 + (1B × 0) = **500**; *AI Safety*: 0 + (1B × 0.0025) = **2,500,000**).  

  3. **Report & Compare (15 min):**  
     Groups post:  
     - Their intervention  
     - # of links used  
     - Total Value  
     *Example results:*  
     - *Malaria (2 links): 500*  
     - *AI Safety (4 links): 2,500,000*  
     - *Climate Eng (3 links): 1,000,000*  
     - *Seed Bank (5 links): 5,000,000*  

  4. **Debrief (20 min):**  
     Guide discussion using their results:  
     - **Scale:** "Why do *some* interventions have huge values despite tiny near-term impacts?" *(They unlocked the leverage term)*.  
     - **Telescoping:** "Compare Malaria (2 links) vs. Seed Bank (5 links). Both used 'reasonable' guesses — why are values millions apart?" → **Reveal:** The structural choice of *how many links to build* dominates the outcome. Fewer links = ignores long-term stakes; more links = amplifies uncertainty.  
     - **Value Gap (if time):** "What if 5 groups all chose AI Safety? Would your 2.5M value still hold?" → Discuss crowding/neglectedness.  
     - **Name the Concepts:** *Longtermism* (prioritizing huge-stakes futures), *Expected Value* (probability × impact), *Existential Risk* (threats to all future lives).  

  ---

  ### **Predictable Problems & Fixes**  
  - **"Rigged!" protests:** Preempt by noting: *"Your # of links reflects how far into the future you looked. Different choices are valid."*  
  - **Analysis paralysis:** Cap links at 6. Give 5-min warnings.  
  - **Overly precise probabilities:** Remind: *"A rough estimate is fine. Focus on the *structure*."*  
  - **Groups ignore near-term impact:** Highlight tradeoffs ("Is saving 500 lives now *always* worse than a 0.001% chance of saving millions?").  

  ---

  ### **Limitations to State in Debrief**  
  *"Unlike games, we get one shot at history. We can’t rerun the future 100 times to check our expected value. This forces tough choices under radical uncertainty — where the *stakes* (not just probabilities) must drive decisions."*  

  ---

  ### **Rebuttal to "Isn’t this Pascal’s Wager?"**  
  **Your one-sentence reply:**  
  *"Pascal *invented* arbitrary probabilities to fit his conclusion; here, we *expose* how unavoidable structural choices — like how far forward we model — constrain outcomes independently of our guesses."*  

  ---

  **Why This Works:**  
  - **Scale:** Forces multiplication of tiny probabilities × huge leverage (revealed late).  
  - **Telescoping:** Groups self-select chain length, creating wild value discrepancies from similar guesses.  
  - **Discovery:** Concepts emerge from calculation frustration, not lecturing.  
  - **Economy:** Uses 1 handout sheet, printable cards, and whiteboard for reporting.  

  Run it cold, let the math do the arguing, and debrief the *structure* of their choices — not the numbers. The midnight insight wins.
