  ### Key Inferences from R.'s Past Verdicts:
  1. **Newcomb (opaque, 99%)**: One-boxing (FDT: one-boxing incentivizes predictors to fill the box).
  2. **Newcomb (transparent)**: Takes only the opaque box (FDT: decision rule consistency matters; taking both would imply a rule that causes predictors to leave the box empty).
  3. **Parfit's Hitchhiker**: Pays (FDT: paying maintains the decision rule that gets her rescued).
  4. **Counterfactual Mugging (prediction-based)**: Pays (FDT: paying sustains the rule that rewards her in the counterfactual where the coin lands favorably).
  5. **Prisoner's Dilemma (twin)**: Cooperates (FDT: mutual cooperation is optimal with correlated decisions).
  6. **Prisoner's Dilemma (noisy twin)**: Cooperates (FDT: high correlation justifies cooperation despite noise).
