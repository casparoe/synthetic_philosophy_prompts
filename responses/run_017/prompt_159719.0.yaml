prompt: |-
  I chair the Patient Safety Review Board at a teaching hospital, and I also teach one section of a bioethics course for residents each term, so I would like something I can use in both roles. The board meets fortnightly for ninety minutes, reviews four to six incidents per sitting, and works only from the incident record — we have no power to investigate, interview, or order tests, and whatever we write goes into a file that the credentialing committee and, in principle, a plaintiff's lawyer may read. For each clinician involved in an incident we must record two things: a retrospective responsibility rating on a four-point scale (no fault, minor lapse, serious lapse, gross lapse) and, separately, a forward-looking recommendation (no action, additional training, restriction of privileges). Our five members are two physicians, a nurse, a risk manager and a lay member; none of them has studied philosophy, and I need something they can run in about fifteen minutes per case without me translating it. The immediate trigger is that last month we rated two anaesthetists differently for what the record describes as the same departure from the monitoring protocol; the only difference is that one patient turned out to have an undiagnosed condition and died, while the other was extubated without incident. The risk manager argued that the outcome is exactly what we are here to account for; the lay member said it obviously should not count; and we split three ways, which is worse than being wrong.

  I have read a little of the philosophical literature on moral luck — Nagel, Williams, the control principle — and my difficulty is that it is very good at telling me why the ordinary way of assigning blame is in trouble and very poor at telling me what to do on Tuesday afternoon. So I want you to turn that literature into a written decision procedure the board could actually adopt. Please make the following non-negotiable: the two outputs must be kept apart, and the procedure must state explicitly which varieties of luck are permitted to move which output and which are barred — luck in how the outcome turned out, luck in the circumstances the agent was placed in (understaffing, a night shift, a broken monitor), luck in the traits and temperament the agent happens to have, and luck in what the agent could reasonably have foreseen or known at the time. I want at least one step to be a blinded re-run: re-present the case to the board with the outcome and the patient's subsequent course redacted, re-rate, and treat any change in the rating as the signature of outcome luck rather than as new information about the agent. I also want the counterfactual comparison class — the same decision, made by a competent peer, in these circumstances, with what was knowable then — fixed by a standing rule agreed in advance, not redrawn case by case, since I can already see members adjusting the comparison class until it yields the answer they want. For each step give me the question to ask, what counts as a sufficient answer given that we cannot investigate, where the procedure stops with a no, and where it must hand the decision to a named person because the question is one of values rather than fact.

  Then apply the whole procedure to three cases, showing the ratings and recommendations it produces: the two anaesthetists; a senior surgeon with a decade of unblemished work who is now found to have a mild tremor from early Parkinson's disease and whose technique has visibly deteriorated; and a resident who skipped a checklist item and had an uncomplicated outcome, next to a colleague who skipped the same item in the same week and caused a serious harm. I especially want you to follow the procedure through in the third case even where it yields a result the credentialing committee will refuse to accept, and to say plainly that it will. Close with a short section on what the procedure cannot do: the cases where the record simply cannot settle what the agent knew or believed, the points at which I have to make a judgment call that no checklist can eliminate, and the kinds of incident for which this framework is the wrong tool altogether. Please write it as numbered steps followed by the applications followed by that closing section, in at most 1,000 words total, with no more than 450 words on the procedure itself and no more than 150 on the closing section. Do not give me citations, bibliographies, or suggested reading: I have no library access and cannot follow them up, so if a step depends on a distinction drawn by a particular philosopher, name it in a phrase and use it in the wording of the step rather than pointing me to a source.
reasoning: |-
  Okay, this is a complex and high-stakes request from someone deeply involved in healthcare ethics and patient safety. The user chairs a Patient Safety Review Board and teaches bioethics, so they need a practical decision procedure rooted in moral luck theory but operationalized for real-world use. 

  Hmm, they've clearly studied Nagel and Williams on moral luck but need something actionable - "what to do on Tuesday afternoon" as they put it. The key constraints are strict: two separate outputs (responsibility rating and future recommendation), specific types of luck to address, a blinded step, and fixed comparison classes. The recent anesthesia case where outcome influenced ratings is the immediate trigger.

  The user's frustration with philosophical literature is understandable - it's strong on critique but weak on implementation. They need concrete steps that non-philosophers can apply in 15-minute case reviews using only records. The three test cases (anesthetists, surgeon with tremor, residents with checklist lapses) will be crucial for stress-testing the procedure.

  I notice they're particularly concerned about outcome luck contaminating judgments, hence the blinded re-run requirement. Also wise to anticipate gaming of comparison classes - that's exactly what happens when people reason backwards from desired conclusions. The warning about credentialing committees rejecting certain results shows they understand institutional realities.

  For the procedure itself, I'll need to:
  1. Clearly separate the two outputs at every stage
  2. Define permitted/barred luck types per output
  3. Build in the blinded reassessment step
  4. Establish fixed peer standards upfront
  5. Include off-ramps where value judgments are needed

  The anesthesia case will demonstrate outcome luck handling, the tremor case addresses circumstantial/trait luck, and the resident case tests identical errors with different outcomes. The closing limitations section must be brutally honest about record gaps and unavoidable judgment calls.

  Word count is tight - 450 for procedure, about 300 for applications, 150 for limitations. No citations per request, but philosophical concepts (control principle, constitutive luck) must be embedded in step wording. Risk manager will likely object to decoupling outcomes from ratings, but that's precisely why the blinded step exists.

  Most challenging part will be operationalizing "what was knowable then" without investigation powers. The epistemic luck step will need careful phrasing about reasonable expectations. Also tricky is the tremor case - how to distinguish blameworthy deterioration from excusable illness without medical expertise.

  Final output must feel like a clinical algorithm: numbered steps, clear decision points, no ambiguity. The user's colleagues need to apply this unaided. If it works, it could prevent the three-way splits they mentioned. Time to distill moral luck theory into a flowchart...
answer: |-
  ## Moral Luck Mitigation Procedure for Patient Safety Review

  **Procedure (Strictly 15 minutes/case; requires pre-agreed "competent peer" standard definition for each clinical role)**

  1.  **Blinded Agent Assessment:**  
      *   *Question:* "Redacting outcome & subsequent course: Based *only* on the agent's documented actions/inactions, knowledge available at the time (per record), and hospital protocols, was the agent's conduct consistent with the pre-agreed 'competent peer' standard?"
      *   *Sufficient Answer:* Yes (No Fault/Minor Lapse possible) / No (Serious/Gross Lapse possible). Stop here if "Yes" and proceed only if "No".
      *   *Permitted Luck:* Epistemic Luck (what was knowable). *Barred Luck:* Outcome Luck, Circumstantial Luck (unless protocol violation), Trait Luck.
      *   *Note:* This isolates the agent's *choice* from the *result*.

  2.  **Circumstantial Luck Filter:**  
      *   *Question:* "Did documented external factors (e.g., equipment failure, critical understaffing verified by staffing records, unprecedented emergency) *significantly constrain* the agent's ability to meet the competent peer standard?"
      *   *Sufficient Answer:* Clear evidence in the record of overwhelming constraint (reduce Lapse severity) / No clear evidence (proceed).
      *   *Permitted Luck:* Circumstantial Luck (external factors). *Barred Luck:* Trait Luck, Outcome Luck.
      *   *Stop if:* Evidence clearly shows constraint was sole cause of lapse (mitigate rating).

  3.  **Epistemic Luck Inquiry:**  
      *   *Question:* "Given the record, could a competent peer reasonably have known/foreseen the critical information missed or the risk incurred?"
      *   *Sufficient Answer:* Yes (lapse stands) / No (reduce severity or No Fault if truly unforeseeable).
      *   *Permitted Luck:* Epistemic Luck (foreseeability). *Barred Luck:* Outcome Luck, Trait Luck.
      *   *Hand-off if:* Dispute on "reasonable foreseeability" exists - Chair decides using the pre-agreed peer standard (Value Judgment).

  4.  **Assign Retrospective Responsibility Rating:**  
      *   Based solely on Steps 1-3 (Blinded Agent Conduct, Circumstance, Foreseeability). Use 4-point scale. *Outcome Luck is explicitly barred from influencing rating.*

  5.  **Recommendation Determination (Separate Process):**  
      *   *Question:* "Considering the *actual outcome*, the *identified lapse* (if any), and *system factors* (e.g., repeated pattern, training gaps), what action best mitigates *future* risk?"
      *   *Permitted Luck:* Outcome Luck (actual harm informs future risk severity), Circumstantial Luck (system fixes needed), Trait Luck (if relevant to capability, e.g., tremor). *Barred Luck:* None barred - all luck types relevant to future prevention.
      *   *Output:* No Action / Additional Training / Restriction of Privileges. *Retrospective Rating does not dictate Recommendation.*

  ---

  **Application to Cases**

  1.  **The Two Anaesthetists (Identical Protocol Departure):**
      *   *Step 1 (Blinded):* Both cases presented redacted. Rating: Identical (e.g., Serious Lapse - protocol not followed).
      *   *Step 2:* No documented overwhelming constraint for either.
      *   *Step 3:* Foreseeable risk of harm from protocol departure? Likely Yes (lapse stands).
      *   *Retrospective Rating:* **Identical Serious Lapse** for both.
      *   *Recommendation:* **Differs.** Anaesthetist 1 (Death): Likely "Additional Training" or "Restriction" due to severe outcome highlighting risk. Anaesthetist 2 (No Harm): Possibly "No Action" or "Discussion/Reminder" if isolated.

  2.  **Surgeon with Tremor (Deteriorating Technique):**
      *   *Step 1 (Blinded):* Technique visibly deteriorated per record? If yes, likely "Serious Lapse" vs. competent peer standard (safe surgery).
      *   *Step 2:* Parkinson's is Trait Luck - **Barred** from affecting retrospective *blame*. Not an external circumstance.
      *   *Step 3:* Could a competent peer surgeon know their technique was unsafe? Yes, self-awareness & peer feedback expected.
      *   *Retrospective Rating:* **Serious Lapse** (failure to self-assess/seek help as competence declined).
      *   *Recommendation:* **Restriction of Privileges** (immediate risk) + mandatory assessment/training. Trait Luck directly informs future risk mitigation.

  3.  **Residents Skipping Checklist (Same Error, Different Outcomes):**
      *   *Step 1 (Blinded):* Both skipped documented checklist item. Rating: Identical (e.g., Minor/Serious Lapse).
      *   *Step 2 & 3:* No significant constraint or unforeseeability difference.
      *   *Retrospective Rating:* **Identical Lapse Rating** for both residents.
      *   *Recommendation:* **Differs significantly.** Resident 1 (No Harm): Likely "Additional Training" on checklists. Resident 2 (Serious Harm): Likely "Restriction" + intensive remediation due to outcome demonstrating severe potential. **Credentialing Committee may refuse identical retrospective ratings**, demanding higher blame for the harmful outcome. The procedure insists the *choice* was identical; blameworthiness is the same.

  ---

  **Limitations of the Procedure (Max 150 words)**

  1.  **Epistemic Uncertainty:** The procedure fails when the record cannot establish what the agent *actually knew or believed* at the critical moment. We must make our best inference, which remains a judgment call.
  2.  **Defining "Competent Peer":** While fixed in advance, the initial definition involves value judgments about standards of care. The Chair must ensure this definition is robust and periodically reviewed.
  3.  **"Reasonable" Foreseeability (Step 3):** Determining what *should* have been known is inherently judgmental, despite the peer standard. The Chair must resolve disputes here.
  4.  **Severe System Failures:** Incidents primarily caused by catastrophic, documented system failures (e.g., known faulty equipment, dangerous understaffing) might warrant "No Fault" via Step 2, but this requires clear evidence.
  5.  **Intentional Harm/Recklessness:** This framework assumes errors or lapses, not intentional misconduct. Cases suggesting gross negligence or malice require different handling beyond luck mitigation.
  6.  **Trait Luck Blur:** Distinguishing between excusable incapacity (sudden illness) and culpable failure to manage known limitations (like the surgeon) relies heavily on the documented knowledge assessment (Step 3).
