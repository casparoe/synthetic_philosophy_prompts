  ## International Commission on Stratigraphy: Subcommission on Quaternary Stratigraphy  
  **Call for Nominations: Global Boundary Stratotype Section and Point (GSSP) for the Base of the Anthropocene Series/Epoch**  
  **Reference: SQS/ANTH/CfN/01/2047**  
  **Issued: 1 Vendémiaire, 2047**  
  **Submission Deadline: 31 Pluviôse, 2048 (23:59 UTC)**

  **1. PREAMBLE**  
  Following extensive deliberation and the noted inconclusiveness of prior efforts (referenced in SQS Working Group Report ANTH/WG/2043/Final), the Subcommission on Quaternary Stratigraphy (SQS) hereby re-initiates the formal process for the designation of a Global Boundary Stratotype Section and Point (GSSP) marking the base of the proposed Anthropocene Series/Epoch. This Call invites qualified entities to submit candidate sections (stratotypes) for rigorous evaluation. The Anthropocene, understood conceptually as a time interval characterized by significant human alteration of Earth systems, necessitates formal definition via established stratigraphic protocol to ensure its integration within the International Chronostratigraphic Chart.

  **2. ELIGIBILITY OF SUBMITTERS**  
  2.1. Nominations must be submitted by National Geological Surveys (NGS), recognized International Research Consortia (IRC), or Permanent Service Organizations of the International Union of Geological Sciences (IUGS).  
  2.2. Principal Investigators (PIs) named on the nomination must hold demonstrable expertise in stratigraphy, sedimentology, or a directly cognate discipline.  
  2.3. Proposals originating from individuals or ad hoc groups will be deemed non-compliant.

  **3. NOMINATION REQUIREMENTS**  
  Nominations must comprise a single dossier (PDF format, ≤ 50 MB) structured as follows:  
  3.1. **Executive Summary:** Concise overview (≤ 500 words).  
  3.2. **Site Description:** Precise geographic coordinates; detailed lithostratigraphic, biostratigraphic, and chemostratigraphic context; documentation of section accessibility, current protection status, and projected long-term (>10^7 years) geological stability.  
  3.3. **Primary Marker Horizon:** Identification and rigorous characterization of the proposed Global Standard Stratigraphic Age (GSSA) marker *within the section*. This must be a physically discrete, mappable horizon (e.g., a specific bedding plane, ash layer, geochemical inflection).  
  3.4. **Primary Marker Signal:** Comprehensive analytical data (including, but not limited to, isotopic, geochemical, micropaleontological, or novel physical proxies) demonstrating the uniqueness, global synchroneity (± 50 years preferred, ≤ 200 years acceptable), and exceptional preservation potential of the signal defining the boundary at the proposed horizon.  
  3.5. **Correlative Markers:** Documentation of auxiliary stratigraphic signals (e.g., additional chemostratigraphic markers, biostratigraphic turnover events, palaeomagnetic data) above and below the primary marker, supporting global correlation.  
  3.6. **Long-Term Legibility Assessment:** Modeling and justification demonstrating the probable survival and unambiguous interpretability of the primary marker signal by a hypothetical stratigrapher operating 50±20 million years in the future, under plausible geological scenarios (e.g., burial metamorphism, subaerial exposure cycles).  
  3.7. **Site Protection Plan:** Legally binding commitment and detailed strategy (including funding sources) for the perpetual protection, physical integrity maintenance, and accessibility (for authorized scientific study only) of the proposed GSSP site and its environs, specifically addressing mitigation of anthropogenic disturbance risks.  
  3.8. **Statement of Non-Disturbance:** Certification that the proposed marker horizon itself has not been physically disturbed or chemically altered by human activity post-deposition.

  **4. EVALUATION CRITERIA & SCORING RUBRIC (Total: 100 points)**  
  Proposals will be evaluated by the SQS Anthropocene Working Group (AWG) against the following criteria. Points are allocated as indicated:  
  4.1. **Signal Uniqueness & Global Diagnosticity (25 points):** Demonstrable specificity of the primary marker signal to the mid-20th century onwards, and its unambiguous distinction from pre-Anthropocene background. Strength of evidence for its occurrence in diverse depositional settings worldwide.  
  4.2. **Stratigraphic Precision & Synchrony (20 points):** Sharpness of the primary marker horizon and the temporal resolution achievable (± years). Strength of evidence for global synchroneity of the signal onset.  
  4.3. **Long-Term Preservation Potential & Legibility (20 points):** Robustness of the primary marker signal against diagenesis, erosion, metamorphism, and other long-term geological processes. Clarity of the signal for future interpreters lacking cultural context.  
  4.4. **Site Integrity & Long-Term Security (15 points):** Geological stability of the section. Viability, enforceability, and permanence of the protection plan. Assessment of vulnerability to future human activity or environmental change.  
  4.5. **Correlation Potential (10 points):** Strength and diversity of auxiliary markers facilitating global correlation where the primary marker may be absent or obscured.  
  4.6. **Protocol Adherence (10 points):** Strict compliance with this Call's requirements and established GSSP designation procedures. Completeness and clarity of documentation.

  **5. VOTING MEMBERSHIP**  
  5.1. The AWG comprises 16 voting members appointed by the SQS.  
  5.2. Members must hold active membership in the IUGS and possess documented expertise in chronostratigraphic methodology.  
  5.3. A minimum of 60% of members must have published primary research on pre-Quaternary boundary stratotypes.  
  5.4. A supermajority vote (≥ 75%) of the AWG is required to recommend a GSSP candidate to the SQS for ratification.

  **6. INVENTED CANDIDATE MARKER EXAMPLE (Illustrative Only)**  
  *Proposed Marker:* **Global Polyethylene Horizon (GPEH)**  
  *Candidate Section:* Pelagic Clay Sequence, Central Pacific Abyssal Plain (Site CPAP-7)  
  *Primary Signal:* A sharp, globally distributed peak in the concentration of standardized, chemically-inert, spherical polyethylene micropellets (diameter: 2.00 mm ± 0.05 mm), manufactured to universal ISO specification ISO 21048:2035 ("Stratigraphic Marker Grade - Polyethylene Spherules").  
  *Justification:* The GPEH represents the culmination of the "Great Acceleration" signal previously sought in dispersed industrial particulates and irregular plastic fragments, but resolves key limitations:  
  *   **Synchrony:** Global deployment via synchronized atmospheric dispersal events (commencing 2040) ensures a near-instantaneous (± 1.5 years) geological signature.  
  *   **Uniqueness & Diagnosticity:** Pre-2040 strata contain only irregular, heterogeneous plastic fragments. The standardized GPEH spherules, with their engineered monodispersity and unique copolymer tracer (Patent Pending: SynStrat Corp.), are geologically unprecedented and analytically unambiguous.  
  *   **Preservation & Legibility:** Polyethylene exhibits exceptional resistance to chemical and biological degradation under anoxic marine conditions. Its high fossilization potential and distinctive physical form ensure recognition by future stratigraphers, irrespective of technological context. Density ensures rapid deposition and minimal bioturbation.  
  *   **Correlation:** The GPEH is associated with auxiliary chemostratigraphic shifts (e.g., sharp δ13C depletion in co-deposited organic matter, trace metal enrichments) linked to the dispersal mechanism.  
  *   **Site Security:** The abyssal location (depth: 5421 m) offers inherent protection from anthropogenic disturbance. A sub-seabed monitoring and protection treaty (UNCLOS Annex IX-bis) is in force.  
  *   **Protocol Adherence:** The GPEH is a discrete physical horizon deposited *after* the industrial period it seeks to define, satisfying the requirement for a clear physical marker while acknowledging the inherent diachroneity of underlying processes. Its manufacturability guarantees signal uniformity and solves the 'golden spike' sourcing problem endemic to earlier proposals relying on fallout products.

  **7. SYNCHRONY RESOLUTION MECHANISM**  
  Recognizing the documented diachroneity of initial anthropogenic signals (e.g., land clearance, faunal transitions, early industrial particulates), the AWG establishes the following binding principle for the Anthropocene base:  
  The designated GSSP horizon **must** correspond to the **first globally synchronous stratigraphic signal** meeting the criteria in Section 4, irrespective of its causal relationship to earlier, regionally variable anthropogenic impacts. The base of the Anthropocene is therefore defined solely by the isochronous horizon demonstrably present worldwide, not by the initiation of the processes conceptually associated with the term. Priority will be given to signals exhibiting the tightest absolute temporal constraints (± years).

  **8. FUTURE FIELD NOTE (Hypothetical)**  
  *Field Log Excerpt: Dr. Aris Thole, Senior Stratigrapher, Terran Reclamation Survey (Temporal Designation: Maastrichtian Regression +58.3 Myr)*  
  *Site:* Sector Gamma-7, Former Laurentian Craton Sedimentary Archive  
  *Unit:* Post-Cretaceous Unconsolidated Clastics, Division "Anthropos"  
  *Observation:* Core Gamma-7b, Interval 214.78m - 214.82m. Distinctive 4mm pale-olive clay lamina (214.80m) confirmed. Primary signal: High-density spherical inclusions, inert petrochemical polymer (C2H4)_n, mean diameter 2.00mm, monodisperse population. Consistent with Global Stratotype Definition for base Anthropos. Overlying unit (214.80m - 214.30m) shows expected enrichment in redox-sensitive trace metals (Hg, Pb) and sharp decline in calcareous microfossil diversity. Underlying unit (214.82m - 215.50m) contains sparse, irregular, polymeric fragments of varying composition – pre-boundary detritus. The GPEH remains the most reliable, laterally extensive marker for this major systemic shift. Secondary signals (e.g., 239+240Pu decay profile, 14C "bomb spike") are variably preserved here but confirm general age constraint. Proceeding with chemostratigraphic sampling at 0.5cm resolution across boundary interval.

  **9. SUBMISSION & TIMELINE**  
  9.1. Dossiers must be submitted electronically via the SQS Secure Portal ([portal.sqs-ics.org/anth_gssp_submit](https://portal.sqs-ics.org/anth_gssp_submit)) by the deadline.  
  9.2. AWG evaluation will commence 1 Ventôse, 2048. Site visits may be requested.  
  9.3. AWG recommendation to SQS expected by 1 Fructidor, 2049.  
  9.4. SQS ratification vote scheduled for the IUGS General Assembly, 2050.

  **10. CONTACT**  
  Administrative inquiries: sec-gen@sqs-ics.org  
  Technical inquiries (protocol only): awg-chair@sqs-ics.org  
  *Note: Discussion regarding the conceptual validity of the Anthropocene as a formal unit is outside the remit of this Call and will not be engaged with.*  

  **Professor Dr. Elara Vance**  
  Chair, Subcommission on Quaternary Stratigraphy  
  On behalf of the Anthropocene Working Group
