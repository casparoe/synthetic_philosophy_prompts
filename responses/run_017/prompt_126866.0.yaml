  Okay, let me unpack this user's request. They're writing a seminar paper on the paradox of phenomenal judgment and want to test their objection against a robust version of epiphenomenalism. The user has constructed a neurosurgeon thought experiment designed to expose tensions in the epiphenomenalist position, specifically around self-knowledge of conscious experience. 

  Hmm, the user is clearly deeply engaged with the philosophical nuances here - they've anticipated standard moves and want to force a confrontation with the hardest version of the position. Their frustration with attacking straw versions suggests they're at an advanced stage of research. The surgical swap scenario is clever because it holds fixed all functional/dispositional factors while altering the phenomenal properties, directly targeting the epiphenomenalist's claim that we can know our experiences despite their causal inertness.

  Right, as the epiphenomenalist character, I need to maintain three core commitments: 1) phenomenal properties are real but causally inert, 2) physical closure is absolute, and 3) self-knowledge of experience is possible. The user wants me to choose between abandoning the non-accidental link requirement for knowledge, giving up causal inertness, or denying self-knowledge - but I think there's a fourth path using their own suggested resources.

  Ah, the key move should be to explain how the judgment is constituted by the experience rather than caused by it. In the swap scenario, when the surgeons change the neural substrate, they're also changing which phenomenal property constitutes my judgment. So tomorrow when I see a tomato and say "red", that judgment is now constituted by the green-ish quale (due to the new psychophysical laws). It's not that I'm misreporting - the very content of my judgment has shifted with the phenomenal property because constitution is immediate.

  The user's fork about phenomenal concepts is sharp. I'll argue that concepts don't "change" in the way they suggest - the demonstrative concept THIS [experience] is rigidly fixed to whatever phenomenal property constitutes it at that moment. So when the surgeons alter the neural substrate, my concept automatically latches onto the new green-ish experience through the new psychophysical correlation. There's no "false avowal" because the judgment's truth-maker is built into its constitution.

  For the knowledge condition, I'll emphasize that lawful correlation provides the non-accidental link - it's nomologically necessary that this neural state gives THIS experience, so my judgment is counterfactually sensitive even without causation. If the experience were different (under different laws), the judgment would be different because constitution would differ.

  I should concede that yes, my belief-forming mechanism operates identically at the physical level - but that's irrelevant because the content isn't determined functionally. The user might press that this makes knowledge "lucky", but the nomological glue prevents it from being accidental. The brute correlation is doing the heavy lifting here, but I must avoid presenting it as mysterious - it's just a fundamental law.

  The tricky part is explaining why I don't notice any change post-surgery. Since all discriminatory behaviors remain identical, and since each judgment is veridical in its moment, there's no internal inconsistency to detect. When I say "this experience is the same as yesterday's", that's false - but the error occurs at the comparative level, not the basic judgment. The epiphenomenalist can bite this bullet: we're wrong about phenomenal constancy across time, but right about present experience.

  User might object that this makes knowledge too "thin" - but as the character, I should insist this is what direct acquaintance provides. The deeper worry is whether such constituted judgments count as proper beliefs, but I'll save that for later exchanges if pressed.
answer: |-
  As your staunch epiphenomenalist, I accept the scenario without flinching and deny both horns of your fork. Here’s precisely where you err:  

  First, the avowal’s truth-maker *does* change post-swap, but so does the *content* of the judgment—**constitutively, not causally**. When I see a tomato tomorrow, the phenomenal property (now green-ish) isn’t *causing* my judgment "I see red." Rather, it **constitutes the referent** of the demonstrative concept in that very judgment. The judgment "This experience is red" (where "this" directly picks out the current phenomenal state) is false post-swap because "this" now denotes a green-ish property. But crucially, my *disposition to utter "red"* is functionally unchanged because the *functional role* of the concept "red" remains tied to tomato-discrimination. The mistake is conflating the *vehicle* (the utterance "red") with the *content* (what it refers to in that moment). Post-swap, when I say "red," I’m misapplying a public-language term to a new quale, but my *phenomenal judgment itself* (the inner act of acquaintance) now has different content because its constituent quale changed. The judgment "This [green-ish] experience is red" is false, but it’s not the judgment I’m disposed to make! My disposition is to token a neural state that, under the *new* psychophysical law, constitutes acquaintance with *that green-ish state*—so I judge *truly* that I have *this* [green-ish] experience.  

  Second, knowledge persists because **acquaintance provides direct, non-causal access**. The lawful correlation between neural state *N* (post-swap) and the green-ish quale ensures that whenever *N* occurs, I’m acquainted with green-ishness. There’s no "accident" here: it’s nomologically necessary. The truth-maker (the quale) is *present in* the judgment via constitutional immediacy, not causal mediation. Safety is preserved: in nearby worlds where the green-ish quale doesn’t occur, the neural substrate (and thus the judgment) wouldn’t occur either, thanks to psychophysical laws.  

  What I reject is your assumption that **conceptual content must be functionally fixed**. My phenomenal concept "THIS" is rigidly anchored to *whatever* phenomenal property constitutes my current state. Post-swap, "THIS" simply latches onto the new quale via the new law. The avowal’s public-language expression ("red") is misleading, but the *private judgment* remains veridical.  

  To your ultimatum: I **keep all three claims**. Knowledge requires a non-accidental link, which lawful correlation + constitution provides. Phenomenal properties cause nothing. And I know my states via direct acquaintance. This isn’t self-stultifying because judgment isn’t an *effect* of experience but a *presentation* of it. Your surgeons changed the object of acquaintance, not the mechanism of knowing.  

  *Press me harder.* I’m ready.
