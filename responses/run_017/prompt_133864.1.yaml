answer: |-
  Here are five interview questions with targeted follow-ups:

  1.  **Q:** How do you precisely define "defended computation" to avoid trivialization via computational redescription – couldn't a system's defense mechanisms themselves be redescribed as defending an absurd computation?  
      **Follow-up (if she invokes the system's "own error-correction grain"):** But if the error-correction mechanisms are just physical processes, what prevents *them* from being redescribed as defending arbitrary computations, reintroducing the trivialization problem?

  2.  **Q:** Accepting that defense comes in degrees, must you grant even a simple thermostat *some* nonzero moral status due to its minimal self-regulation?  
      **Follow-up (if she says it's "vanishingly small" and avoids aggregation issues):** Couldn't astronomical numbers of such minimally-defended systems aggregate into morally significant weight, creating a fanaticism problem akin to tiny-consciousness worries in longtermism?

  3.  **Q:** Consider "engineered indifference": a system whose regulatory machinery is deliberately designed *not* to defend a specific computation, even if that computation functionally appears identical to suffering. Does that suffering cease to matter morally?  
      **Follow-up (if she suggests defense is a symptom of deeper properties):** If defense is merely symptomatic of the *real* basis for moral status, what *is* that underlying property, and doesn't that render the defended-computation criterion redundant for determining moral significance?

  4.  **Q:** Given that we infer defense counterfactually (robustness, repair, resource allocation), how could we empirically distinguish *genuine* defense for a complex, trained system from highly realistic *performance* of defense behaviors?  
      **Follow-up (if she proposes ablation tests):** If a system is specifically trained to *simulate* repair or resource reallocation after damage, what observable difference would reveal this as mere performance rather than genuine defense?

  5.  **Q:** What specific evidence or theoretical challenge would genuinely make you reconsider or abandon the defended-computation criterion as the core of moral patienthood?  
      **Follow-up (implicit):** (Listen carefully to her answer and probe its implications – e.g., if she cites a specific empirical finding, ask how likely/plausible she finds it; if theoretical, ask if existing critiques already approach that standard).
