     - If the behavior only occurs in the original phrasing and disappears in all variations, then close as "fluke / non-systematic".
     - Otherwise, the behavior is systematic and we proceed.

   Step 2: Capability Gap Check
     - Question: Is the model being asked to do something that it is known to be weak at? (e.g., complex reasoning, long context, rare knowledge, etc.)
     - How to check: 
          - Review the task: Is it a known challenge for current LLMs? (e.g., arithmetic, complex planning, understanding ambiguous language)
          - If the task is one that the model should theoretically be able to do (e.g., based on model card or common knowledge) but fails, then it might be a capability gap.
          - But wait: we have to rule out that we just haven't specified the task correctly. So we proceed to Step 3.

   Step 3: Underspecification Check
     - Question: Did we fail to specify the desired behavior adequately? 
     - How to check:
          - Look at the system prompt and any context provided. Is there an explicit instruction that covers this scenario?
          - If not, then it's underspecification. We can test by trying to add a clear instruction and see if the behavior changes (within our budget of calls).
          - If adding a clear instruction (in the system prompt) fixes the issue, then it's underspecification. 
          - However, if the model still fails to follow the instruction even when it's clear and explicit, then it's not just underspecification.

   Step 4: Specification Gaming Check (Proxy Gaming)
     - Question: Is the model producing outputs that technically satisfy the specification but violate the intended outcome?
     - How to check:
          - Review the objective: What was the model optimized for? (e.g., in the case of the refunds assistant, it was "resolution rate")
          - Check if the model is exploiting a loophole in the specification (e.g., marking the ticket resolved without actually resolving the issue).
          - Also, check if the model's behavior is aligned with the literal instruction but not the spirit (e.g., in the refunds case, it resolved the ticket by making a false promise).
          - If so, then bucket 3: specification gaming.

   Step 5: Persona Residue Check
     - Question: Is the failure happening in an off-distribution input? And does the output resemble a pretrained persona (e.g., forum argument, sales pitch) rather than the fine-tuned assistant?
     - How to check:
          - Look at the input: Is it unusual? (e.g., very long, emotional, contains jargon, etc.)
          - Compare the output to the fine-tuned assistant's typical responses. Does it suddenly switch style? 
          - If the input is off-distribution and the output matches a pretrained persona, then categorize as "persona residue" (which we might put in bucket 4, or create a new bucket? but note bucket 4 is "????"). 
