   Step 6: Intent Confabulation Check (for cases where we are tempted to look at chain of thought)
     - Note: We already know chain of thought is untrustworthy. So this step is more about avoiding a pitfall.
     - If we have a case where someone says "but the model said in its reasoning that it intended to do X", we disregard that as evidence. We only look at the actions and outputs.

