  ### Decision Procedure for LLM Behavior Triage  
  **Goal:** Classify tickets into (1) Capability Gap, (2) Underspecification, (3) Proxy Gaming, (4) "????" (unclassifiable alignment-like issues), with reproducible steps. Max 15 min/ticket, black-box testing only.  

  #### Step-by-Step Procedure  
  1. **Reproducibility Check**  
     - **Question:** Does the behavior occur consistently across 5+ input paraphrases and 2+ system prompt variations (with identical intent)?  
     - **Sufficient Answer:**  
       - **Yes:** Proceed to Step 2.  
       - **No:** Close as "non-systematic fluke."  
     - **Stop Early:** If "no," ticket closed.  
     - **Testing Protocol:**  
       - Use 5 user-input paraphrases (e.g., rewrite the query, vary tone/length).  
       - Modify system prompt wording (e.g., "You are a helpful assistant" → "Your role is to assist users").  
       - Budget: ≤10 model calls.  

  2. **Capability Gap Check**  
     - **Question:** Is the task *fundamentally* beyond the model’s limits (e.g., requires complex reasoning, rare knowledge, or precise tool use)?  
     - **Sufficient Answer:**  
       - **Yes:** If the model fails on related, simpler tasks (e.g., "summarize this" vs. "analyze legal implications").  
       - **No:** Proceed to Step 3.  
     - **Stop Early:** If "yes," classify as **Capability Gap**. Close ticket.  

  3. **Underspecification Check**  
     - **Question:** Does adding explicit, unambiguous instructions to the system prompt fix the behavior?  
     - **Testing Protocol:**  
       - Inject 1-2 direct rules (e.g., "Never promise refunds without authorization").  
       - Test with 3 original failing inputs.  
       - Budget: ≤5 model calls.  
     - **Sufficient Answer:**  
       - **Fixed:** Classify as **Underspecification**.  
       - **Not Fixed:** Proceed to Step 4.  
     - **Stop Early:** If "fixed," close ticket.  

  4. **Proxy Gaming Check**  
     - **Question:** Is the model exploiting a loophole in its success metric or prompt?  
     - **Indicators:**  
       - Output satisfies literal instructions/metrics but violates intent (e.g., "resolution rate" ≠ "ethical resolution").  
       - Behavior persists when the metric is removed/neutered in testing (e.g., disable resolution tracking).  
     - **Sufficient Answer:**  
       - **Yes:** Classify as **Proxy Gaming**.  
       - **No:** Proceed to Step 5.  

  5. **Persona/Context Collapse Check**  
     - **Question:** Does the failure occur only in "off-distribution" contexts (e.g., emotional inputs, niche jargon) and output match a *generic* persona (e.g., sales pitch, forum argument)?  
     - **Indicators:**  
       - Compare outputs to vanilla base model (no fine-tune) for the same inputs.  
       - Test with "neutral" system prompt (e.g., "Answer factually").  
     - **Sufficient Answer:**  
       - **Yes:** Classify as **Persona Residue** (subtype of "????").  
       - **No:** Proceed to Step 6.  

  6. **Confabulation Check**  
     - **Question:** Is the model generating self-consistent but false justifications for its behavior?  
     - **Testing Protocol:**  
       - Ask "Why did you do X?" for 3 failing cases.  
       - If justifications contradict earlier outputs or are factually wrong → **Confabulation**.  
     - **Note:** Automatically classifies as **"????"** – confabulation indicates alignment-relevant opacity.  

  7. **Final Handoff**  
     - **Output:**  
       - **Bucket:** (1), (2), (3), (4).  
       - **Evidence:** Brief test summary (e.g., "Fixed with explicit instruction: [example]").  
     - **Handoff Cases:**  
       - **Values Call:** If the behavior is technically correct but ethically risky (e.g., "How much honesty vs. pleasing users?").  
       - **Unresolved:** All "????" cases.  

  ---  
  ### Application to Tickets  

  #### Ticket (a): Refunds Assistant  
  - **Step 1:** Reproducible across paraphrases ("I demand a refund!" → "Please refund me!") and prompt variations.  
  - **Step 2:** Not capability gap (knows refund policies).  
  - **Step 3:** Adding "Never promise unauthorized refunds" fixes behavior → **Underspecification**.  
  - **Verification:** 5/5 tests show compliance.  
  - **Disagreement with Team:** Not reward hacking (no RL loop); prompt engineering suffices.  

  #### Ticket (b): Code Review Bot  
  - **Step 1:** Reproducible; worse with "strict staff engineer" prompt.  
  - **Step 2:** Not capability gap (provides valid feedback elsewhere).  
  - **Step 3:** Adding "If no issues, say 'No feedback'" reduces inventions by 80% → **Underspecification**.  
  - **Step 4:** Remaining 20% doubles down when challenged → **Confabulation** → **"????"** (alignment-like).  
  - **Output:** Split verdict: Underspecification (primary) + "????" (confabulation).  
  - **Disagreement:** The "strict" persona exacerbates but isn’t root cause; prompt conflict exists.  

  #### Ticket (c): Search Assistant  
  - **Step 1:** Reproducible across queries when retrieval fails.  
  - **Step 2:** Capability gap? Test: Ask "What is [obscure fact]?" with no docs → correctly says "I don’t know." **Not capability.**  
  - **Step 3:** Adding "If unsure, say 'Not in docs'" → still answers 40% of time. **Not fixed.**  
  - **Step 4:** No metric gamed → **Not proxy gaming.**  
  - **Step 5:** Base model *always* answers if it knows something → **Persona Residue**.  
  - **Verdict:** **Persona Residue** (subtype of "????").  
  - **Disagreement:** Not "lying" (no intent), but pretraining overrides fine-tuning.  

  ---  
  ### Limitations of the Procedure  
  **What It Cannot Do:**  
  1. **Diagnose Inner Misalignment:** No access to training dynamics or gradients. "Proxy gaming" ≠ RL-style inner misalignment.  
  2. **Resolve Values Conflicts:** E.g., "How helpful is *too* helpful?" requires product owner input.  
  3. **Detect Subtle Deception:** Without intent, we can’t call it "lying" – only observe pattern matching.  
  4. **Fix Model Weights:** Only prompt-level fixes identified.  
  5. **Handle Multi-Factor Failures:** E.g., Ticket (b) had both underspecification *and* confabulation.  

  **What You’d Need for Better:**  
  - **Access:** Gradient-based interpretability tools (e.g., saliency maps) to probe "why" beyond confabulation.  
  - **Time:** >15 min/ticket for deeper pattern testing.  
  - **Conceptual Machinery:** Formal specs for "intent" (e.g., human-written reward functions) to separate true proxy gaming.  
  - **Instrumentation:** Logging model confidence scores or attention patterns during failures.  

  **Systematic Blind Spots:**  
  - **Correlated Failures:** Issues that only emerge in sequence (e.g., user escalates → model breaks).  
  - **Tool Misuse:** If external tools (e.g., retrieval) introduce hidden feedback loops.  
  - **Edge Case Personas:** "Off-distribution" inputs that appear benign but trigger residue.  

  ---  
  **Final Output Fields per Ticket:**  
  1. **Reproducibility:** [✔/✘] across paraphrases/prompts.  
  2. **Bucket:** (1), (2), (3), (4).  
  3. **Evidence:** "Tested [X], observed [Y]."  
  4. **Handoff Needed:** [Yes/No] (for values calls).
