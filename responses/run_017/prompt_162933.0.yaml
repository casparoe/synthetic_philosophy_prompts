  The user has already ruled out several concepts: Goodhart's law (no targeting), Campbell's law (no perverse incentives), McNamara fallacy (not prioritizing measurable over important), and ML concept drift (fixed definition vs moving data). They mentioned medical surrogate endpoints but feel it's not quite the same.

  Hmm, this seems like a case of "measurement drift" or "construct drift" where the operational definition evolves while the label remains static. The key elements are: 1) incremental justified changes, 2) no malintent, 3) persistent authority of the metric. The "zombie metric" term they coined is actually quite apt - it's dead in meaning but still walking around making decisions.

  The medical surrogate endpoint analogy is closer than they think - it's about a proxy measure losing validity when context changes, though typically in drug trials rather than operational metrics. Psychometrics' "construct validity decay" also fits well - when the measurement stops capturing the intended abstract concept.

  For the authority persistence aspect, that's separate - more about institutional inertia and what we might call "metric legacy authority" or "indicator entrenchment." It's fascinating how numbers retain power even after their meaning evaporates.

  The core failure mode seems distinct from Goodhart - here it's about uncoordinated definitional evolution rather than active optimization against a target. I'll position it as a sibling to Goodhart: both involve validity-loss, but through different mechanisms (optimization vs entropy).

  Should emphasize the "death by a thousand papercuts" nature - no single change seems wrong, but cumulative effect breaks the metric. The boundary case is when changes are deliberately documented versus this slow creep. Their zombie metaphor is perfect - will recommend keeping it while providing the formal framing.
answer: |-
  What you're describing is a distinct and pernicious phenomenon. It’s not quite any single established concept, but sits at the intersection of several, demanding a precise carve-out. Let me walk through why the near-misses don't fit, then define the core failure mode and its authority-persistence aspect.

  **Ruling Out the Near-Misses:**
  *   **Goodhart/Campbell:** Correctly dismissed. Goodhart requires the measure becoming a *target* for optimization, creating adversarial pressure. Here, changes are operational improvements, not gaming. The metric isn't *distorted*; its *meaning* is *redefined*, unintentionally and incrementally.
  *   **McNamara Fallacy:** Spot on. This is about over-reliance on quantified measures *instead of* unquantifiable realities. Your problem is the quantified measure itself *changing its referent* while still being trusted as the same thing.
  *   **ML Concept Drift:** Different axis. Concept drift is P(data|label) or P(label|data) changing *while the label's definition stays fixed*. You have P(*definition*|label) changing – the operational grounding of the label itself shifts.
  *   **Surrogate Endpoint Failure (Medicine):** Close but misaligned focus. Surrogate failure happens when a proxy (e.g., tumor size) validated for predicting a true outcome (e.g., survival) *in one context* fails *in a new context* (e.g., a different drug class). Your issue isn't the proxy failing to predict *across contexts*; it's the *operational definition of the proxy itself* drifting *within its original context of use*. The surrogate wasn't invalidated by a new trial; it was quietly redefined.

  **The Core Phenomenon: Semantic Drift of Operational Definitions**

  This is fundamentally a **failure of measurement validity maintenance**, specifically **construct drift under operational redefinition**. Here's the precise carving:

  1.  **The Essence:** A quantitative indicator's *operational definition* (the concrete procedure or algorithm defining what is measured) undergoes incremental, justified changes. Crucially, these changes cumulatively alter the *meaning* of the indicator relative to the original *construct* (the abstract concept it was intended to capture – e.g., "user-perceived checkout latency," "on-call pain").
  2.  **The Mechanism:** Changes are made for valid local reasons (performance, efficiency, accuracy, tooling) *without* re-evaluating the indicator's global validity for its intended purpose. The link between the operational definition and the target construct weakens or breaks.
  3.  **The Deception:** The *label* (e.g., "Checkout Latency p95"), *thresholds*, and *reporting context* remain unchanged. This creates the illusion of continuity and comparability over time.
  4.  **The Consequence:** The indicator continues to be used authoritatively for decisions (reporting, alerts, goals) it is no longer valid for, because it no longer measures the construct it purports to measure. The number is stable, but its connection to the underlying reality of interest is degraded or severed.

  **Why "Zombie Metric" is Apt (and the Term I Recommend):**
  Your internal term is excellent. A "zombie metric" is an indicator that is *operationally dead* (its original meaning/significance is gone) but *procedurally alive* (it still walks around in dashboards, reports, and decision-making processes, exerting influence). Its authority persists purely by inertia and the unchanged label, not by any current warrant connecting it to the intended construct.

  **Boundaries & Definition:**

  *   **What makes it a Zombie Metric?**
      *   **Original Validity:** The metric was initially established with a clear operational definition linked to a target construct.
      *   **Incremental Redefinition:** A series of discrete, locally justified changes to its operational definition occur.
      *   **Semantic Shift:** These changes cumulatively alter the meaning of the metric relative to the original target construct.
      *   **Label/Threshold Persistence:** The metric's name, reporting context, and decision thresholds remain unchanged.
      *   **Authority Persistence:** The metric continues to be used authoritatively for decisions based on its *original* implied meaning/purpose.
      *   **Absence of Malice/Optimization:** The drift is not driven by deliberate gaming or optimization pressure against the metric itself.
  *   **Distinguishing from Deliberate Redefinition:** The key is *uncoordinated incrementalism*. If you deliberately change what "Checkout Latency p95" means operationally *and* explicitly update the SLO definition, thresholds, and documentation to match the new meaning *and* communicate this change to stakeholders, that's healthy metric evolution. A Zombie Metric arises when the operational changes happen *without* this accompanying recalibration of meaning and authority.

  **The Authority Persistence Problem: Indicator Entrenchment**

  The persistence of authority is a distinct, though intimately related, failure mode. We can call this **Indicator Entrenchment** or **Metric Legacy Authority**. It's the phenomenon where a quantitative indicator, once established and embedded in processes (dashboards, reports, goals, alerts), acquires inertia that resists re-evaluation even when its validity is suspect. Its authority stems from:
  *   **Historical Precedent:** "We've always tracked it this way."
  *   **Procedural Embedding:** It's hard-coded in tools, reports, and review cycles.
  *   **Cognitive Ease:** A known number is easier to handle than questioning its meaning.
  *   **Avoidance of Uncertainty:** Acknowledging drift creates ambiguity; sticking with the number feels safer.
  *   **Sunk Cost:** Significant effort was invested in setting it up initially.

  This is why Zombie Metrics are so dangerous: Indicator Entrenchment keeps them shambling forward, exerting influence long after their operational death. It's the *mechanism* that allows the drifted metric to cause harm.

  **Relationship to Goodhart:**

  The resemblance is superficial but points to a shared root: **the fragility of proxy measures.** Goodhart shows how a proxy *breaks* when made a target. Zombie Metrics show how a proxy *decays* through operational entropy and institutional inertia, even without targeting. Both highlight that any proxy measure demands continuous vigilance regarding its connection to the underlying reality. Goodhart is an acute failure under pressure; Zombie Metrics are a chronic failure through neglect.

  **In Summary:**

  You've identified **Zombie Metrics**: operationally redefined measures that retain unwarranted authority due to **Indicator Entrenchment**. This is a sibling to Goodhart's Law (both involve proxy validity failure) but distinct in its mechanism (incremental operational drift without targeting vs. optimization pressure). It's a failure of measurement hygiene – the ongoing maintenance of the link between operational definition, construct, and purpose. The antidote is periodic, deliberate "metric autopsies": revisiting not just the number, but *what the number means operationally right now*, and whether that still validly captures the intended construct for the decisions relying on it. Your instinct that this is distinct and needs naming is correct; "Zombie Metric" precisely captures its essence.
