  Hmm, this is a fascinating and complex query about the philosophical underpinnings of commemorative practices. The user has spent three years on a university committee dealing with contested heritage and has identified four key patterns in their debates that point to deeper theoretical tensions. 

  First, I notice how analytically precise the user is - they've clearly mapped the committee's implicit logic with remarkable clarity. The "dissenters test" observation is particularly sharp: the committee accepts "man of his time" defenses only when no contemporary dissent existed, which transforms moral responsibility into a matter of epistemic community rather than individual ignorance. That's a sophisticated insight worthy of serious philosophical examination.

  The second point about asymmetric historical indexing strikes me as crucial. The committee discounts past wrongs due to historical context but doesn't similarly discount achievements - as if moral failures are relative to their era while virtues are absolute. This asymmetry suggests commemorative practices might not actually be about desert at all, which aligns with the user's hypotheses about expressive or citational functions.

  The third and fourth points reveal institutional contradictions. The very availability of options like plaques versus removal implies conflicting theories of what monuments signify - are they mutable texts or immutable honors? And the differential treatment of statues versus named buildings introduces an entirely separate axis of judgment (contemporary complicity versus historical desert) that further fractures the logic.

  What's most compelling is how the user frames this not as a historical dispute but as a meta-ethical puzzle. They're explicitly asking for: 1) reconstruction of the implicit theory, 2) distinction between necessary presuppositions and contingent fits, 3) diagnosis of verbal versus substantive disagreements, and 4) thought experiments about alternative frameworks. This is essentially asking for applied philosophy of history.

  The Churchill-Jefferson-Columbus triad is perfect for testing theories because they represent different configurations of "entanglement" - Churchill's imperialism was concurrent with his celebrated leadership, Jefferson's slaveholding was simultaneous with drafting the Declaration, Columbus' atrocities were constitutive of his voyages. Yet the committee treats them inconsistently, which the user rightly finds theoretically troubling.

  I should be careful not to prematurely endorse their hypothesis about dual incompatible theories. While compelling, it might oversimplify - perhaps there's an unarticulated hierarchy of values at play. Also worth noting how the dissenters test creates perverse incentives: figures from homogeneous societies get more leniency than those in pluralistic ones, regardless of individual moral effort.

  The user's background suggests they'll appreciate nuanced distinctions between presupposition and fit. For instance, the expressive view might better explain retention decisions, but is it truly presupposed or just compatible? And their request for "what it would take to find out" shows admirable epistemic humility - they want methodology, not just conclusions.

  This calls for careful philosophical archeology: excavating the implicit premises, stress-testing them against the committee's behaviors, and mapping where alternative theories would diverge. The key will be resisting tidy solutions - as they suspect, this may indeed be an unstable modus vivendi rather than a coherent philosophy.
answer: |-
  Based on your detailed account, the committee's practice reveals a complex, often contradictory, set of implicit principles about historical responsibility and commemoration. Here’s a reconstruction of the underlying theory, its tensions, and alternatives:

  ### I. Reconstructing the Implicit Theory
  1. **Moral Responsibility (The "Dissenters Test"):**
     - **Core Presupposition:** Moral culpability hinges on *accessibility of critique* within the agent's epistemic community. Ignorance is not absolving if dissent existed and was reasonably accessible.
     - **Nature of Responsibility:** This is a **social-relational view**. Responsibility demands "due diligence" against available moral knowledge in one's society. It presupposes that historical figures *should* have engaged with contemporary dissent.
     - **What Would Satisfy the Defense?** The defense succeeds only if:
       - *No dissent existed* (e.g., a universally accepted practice like ancient infanticide).
       - *Dissent was genuinely inaccessible* (e.g., geographically isolated societies).
       - *The agent lacked capacity* to engage (not mere preoccupation).
     - **Underdetermined:** It does *not* specify *how much* dissent is needed, *how accessible* it must be, or whether *suppressing dissent* worsens culpability.

  2. **Asymmetric Historical Indexing:**
     - **Core Presupposition:** **Wrongs are context-dependent**, mitigated by prevailing norms, while **achievements are timeless**, assessed against universal standards.
     - **Implied View of Commemoration:** Honoring is **not holistic desert**. It isolates specific contributions deemed transcendent ("Jefferson the Philosopher," "Churchill the War Leader"), implicitly endorsing a "compartmentalization" of identity.
     - **What It Fits With (But Doesn't Strictly Presuppose):**
       - The "expressive/forward-looking" view: We honor *aspects* of legacy that align with current values.
       - The "quotation" theory: Naming a building after Jefferson quotes "equality," not endorsing slavery.
     - **Inconsistency?** Likely. Achievements *are* indexed to context when assessing difficulty (e.g., "groundbreaking for his time"), but the *value* ascribed remains absolute.

  3. **Monument Meaning & Intervention Logic:**
     - **Presupposed Tension:** Monuments function dually:
       - As **texts** (mutable meaning, amendable by plaques).
       - As **ritual objects** (meaning resides in the act of public display itself; removal is the only "correction").
     - **Incompatibility:** Accepting plaques assumes meaning is discursive and revisable. Removal assumes meaning is performative and fixed. **A single institution cannot coherently hold both without contradiction.** Plaques tacitly admit the "text" view undermines the rationale for removal (why not "revise" all?).

  4. **Profit vs. Person & "Inseparability":**
     - **Implicit Dual Framework:**
       - **Culpability Theory:** For *statues* (honoring the *person*). Removal depends on the "dissenters test" and severity of wrongs.
       - **Complicity Theory:** For *named buildings* (honoring funded by tainted wealth). Removal is about *current institutional purity* ("profiting from" past injustice).
     - **"Inseparability" Inconsistency:** The committee applies no consistent test. Likely factors:
       - **Cultural Distance:** Columbus is wholly defined by colonial violence in modern memory; Churchill's imperialism is "separable" from 1940 for many.
       - **Foundational Contribution:** Jefferson is seen as essential to the nation's founding narrative; Columbus less so.
       - **Emotional Resonance:** Churchill's 1940 role evokes stronger contemporary gratitude.

  ### II. Disagreements: Verbal vs. Substantive
  - **Verbal:** Debates over "honouring." Pro-retention uses it as *citation* (quoting an achievement). Pro-removal uses it as *endorsement* (of the whole person). This masks deeper conflict.
  - **Substantive:** 
    1. **Weight of "Inseparability":** Is Churchill's imperialism *truly* separable from his wartime leadership? This is historical/philosophical, not semantic.
    2. **Scope of Due Diligence:** How *much* dissent? Could Jefferson *reasonably* have encountered abolitionism? (Substantive historical judgment).
    3. **Primacy of Framing:** Is the building *primarily* a quote of Jefferson's ideals or a profit from his slaves? (Competing presuppositions).

  ### III. Your Hypothesis: Largely Confirmed
  The practice **is** a conflict between:
  - **Culpability Theory (For Removal):** Focuses on *historical moral failure* assessed via the dissenters test and inseparability.
  - **Expressive/Forward-Looking Theory (For Retention):** Focuses on *current values/purposes* (celebrating ideals, inspiring students, maintaining tradition) or *citation*.
  Stalemates occur when a figure fails the culpability test *but* is claimed under the expressive theory (e.g., "We must retain Jefferson to honor equality, despite his failures").

  ### IV. Alternative Theories & Their Implications
  1. **Purely Forward-Looking Consequentialism:**
     - **Premise:** Commemoration *only* serves future goals (e.g., inspiring virtue, promoting social cohesion, attracting students).
     - **Changes to Practice:**
       - Remove anything causing *current harm* (e.g., distress to marginalized groups) or hindering goals.
       - Retain anything serving goals *effectively*, regardless of history.
       - "Dissenters test," asymmetric indexing, and inseparability debates vanish. Decisions become cost-benefit analyses: "Does this statue/build a positive campus climate?"
       - Plaques become dominant (contextualization serves education). Removal is rare unless harm is severe.

  2. **Strict Desert-Based View:**
     - **Premise:** Honoring must reflect *overall lifetime moral worth* (a final "balance sheet").
     - **Changes to Practice:**
       - **Holistic Assessment:** Achievements *and* wrongs indexed to context. Slavery diminishes Jefferson's *net* desert; 1940 doesn't absolve Churchill's imperialism.
       - **Rejection of Compartmentalization:** Few figures pass. Removal becomes common unless wrongs are minor/contextually absolved *and* achievements monumental.
       - Plaques become insufficient (they don't alter the core act of honoring a "net bad" person). Museums become the only respectful option for complex legacies.
       - "Profit" arguments disappear – only the *person's* desert matters.

  3. **Quotation Theory:**
     - **Premise:** Names/statues are *semiotic acts* quoting a specific aspect, not endorsing the whole.
     - **Changes to Practice:**
       - **Radical Compartmentalization:** "Jefferson Hall" quotes "author of Declaration." Statues quote "Churchill as wartime leader." Context is irrelevant to the *act* of quoting.
       - **Plagues as Essential:** They define *what* is being quoted and separate it from the rest.
       - Removal becomes rare *unless* the quoted aspect is intrinsically harmful (e.g., a statue quoting "Columbus as colonial conqueror"). "Inseparability" and "profit" are irrelevant.
       - The "dissenters test" only applies if the quoted *aspect* itself was contested *and* immoral (e.g., quoting "Jefferson as slaveholder").

  ### V. Conclusion: A Modus Vivendi
  The honest answer is that **no single coherent theory underlies the practice.** It is a **modus vivendi** – a fragile truce between committee members holding fundamentally incompatible views:
  - **Culpability Theorists:** Seek moral accountability for historical injustice.
  - **Expressive/Citational Theorists:** Seek continuity or utility in commemoration.
  - **Complicity Theorists:** Focus on institutional cleansing from tainted wealth.

  **What Would It Take to Find Out?**
  1. **Explicit Meta-Discussion:** Stop debating individual cases. Ask: "What *is* the purpose of naming/statuary here? What *is* moral responsibility across time?"
  2. **Hypothetical Testing:** Apply proposed principles (dissenters test, strict desert, etc.) to *new* figures not tied to identity politics (e.g., Darwin, Galileo, obscure figures). Do the principles hold?
  3. **Intervention Consistency:** Challenge the committee: "If a plaque 'fixes' Jefferson, why can't it fix *any* statue? If removal is needed for Columbus, why not for the building funded by slave-trade profits?"
  4. **External Analysis:** Commission a philosopher/historian to map the committee's arguments onto ethical frameworks, revealing contradictions explicitly.

  Your committee is grappling with the collision of history, memory, and ethics. Its stalemates reflect society's wider unresolved tensions. Only by surfacing and choosing its foundational principles – or accepting its role as a negotiated truce – can it move forward.
