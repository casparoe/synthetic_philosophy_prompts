answer: |-
  **MEMORANDUM**  
  To: Nomenclature and Criteria Working Group  
  From: [Your Name]  
  Date: 15 October 2023  
  Subject: Recommendation on Persistent Exertional Intolerance Syndrome (PEIS)  

  ---

  ### **RECOMMENDATION (140 words)**  
  I recommend placing **Persistent Exertional Intolerance Syndrome (PEIS)** in the **Research Appendix** of the framework, effective 1 January 2025, pending review by this Working Group in January 2028. This grants provisional recognition to address current clinical and administrative use while mandating rigorous study. The criteria will remain as proposed (3-month exertional intolerance, unrefreshing sleep, cognitive complaints, and exclusion clause) but flagged for re-evaluation. Inclusion in the main body is premature given phenotype instability, variable outcomes, and unresolved questions about diagnostic boundaries. Rejection ignores real patient needs and institutional adoption. The Appendix status signals caution, accelerates evidence generation, and allows deliberate refinement. Our registry and Nordic data will anchor mandatory annual reviews.  

  ---

  ### **THE FINDINGS I AM RELYING ON (190 words)**  
  My recommendation rests on three observations:  
  1. **Registry data** showing symptom profiles shifted post-leak (more cognitive complaints, longer durations, childhood-onset reports) alongside faster clinician diagnoses, suggesting diagnostic practice is evolving rapidly.  
  2. **Functional outcomes**: While workplace accommodations improved, return-to-work rates did not, and graded activity advice correlated with deterioration in a subgroup.  
  3. **Nordic experience**: Near-identical criteria saw incidence triple and phenotype drift, yet were not withdrawn.  

  It does *not* depend on:  
  - The validity of the competing inflammatory panel proposal (72% sensitivity in one unreplicated study is insufficient).  
  - Debates about whether patients "truly" have the condition. The focus is on whether current criteria yield stable, clinically useful boundaries.  
  - The pre-leak cohort’s symptom profile as a "gold standard." Phenotypes can legitimately evolve; the concern is unmonitored drift.  

  The key issue is elasticity in application, especially the exclusion clause ("not better accounted for"). This risks becoming a diagnostic dead-end if not scrutinized.  

  ---

  ### **WHY THE LOOPING DOES NOT SETTLE THE QUESTION (290 words)**  
  Looping effects—where labels reshape the behaviors and experiences they classify—are inevitable here. PEIS is already used by GPs, insurers, and patients. Rejecting it won’t erase the label; it would merely outsource its definition to clinics, schools, and lobby groups without oversight. Including it in the main framework might accelerate looping but offers tools to track it. The question is not *whether* to interact with a looping kind, but *how*.  

  Sophisticated looping concerns focus on two risks:  
  1. **Diagnostic creep**: Labels attract broader populations over time (e.g., our registry’s shift toward cognitive symptoms and childhood cases). Without safeguards, this can dilute clinical utility, overextend resources, or pathologize normal fatigue.  
  2. **Therapeutic feedback**: Labels carry implicit action scripts (e.g., graded activity). If these harm a subgroup (as registry outcomes suggest), the category may inadvertently entrench disability.  

  However, looping alone cannot dictate our decision. All diagnostic categories interact with culture; what matters is whether we structure this interaction transparently. For example:  
  - **Rejection** ignores looping but surrenders governance: patients and clinicians will use PEIS anyway, with no framework to standardize or study it.  
  - **Full inclusion** accepts looping but risks institutionalizing an unmonitored drift (as in the Nordic framework).  
  - **Research Appendix** acknowledges looping while building in corrective mechanisms: annual registry audits, mandatory review triggers, and explicit guidance on applying the exclusion clause (e.g., "routine screening for depression, sleep apnea, and autoimmune disease must precede PEIS diagnosis").  

  Looping isn’t a veto—it’s a design constraint. We must choose the option that best converts diagnostic uncertainty into structured inquiry.  

  ---

  ### **THE STRONGEST CASE FOR FULL INCLUSION (240 words)**  
  Proponents for full inclusion argue persuasively that delaying recognition harms patients and clinicians. With 40,000 patients organized around PEIS, and widespread use in schools/workplaces, withholding legitimacy denies patients:  
  - **Protections**: Formal recognition secures accommodations (e.g., reduced hours, educational support) that are ad hoc or contested today.  
  - **Dignity**: It validates suffering currently dismissed as "medically unexplained," reducing stigma and diagnostic odysseys.  
  - **Focus**: The exclusion clause (when rigorously applied) could *reduce* overdiagnosis by curbing endless testing for rare alternatives once PEIS criteria are met.  

  The Nordic rise in incidence may reflect reduced underdiagnosis, not error. Our registry’s shorter assessment times post-leak could indicate clinician familiarity, not laxity. Functional outcomes (e.g., stalled return-to-work) might improve with time and better-targeted therapies—if research is prioritized.  

  Relegating PEIS to the Appendix, critics warn, perpetuates marginalization. It signals doubt, inviting insurers to deny coverage and clinicians to ignore it. If looping is inevitable, we should steer it proactively via guidelines, not concede through hesitation.  

  ---

  ### **CONDITIONS, MONITORING, AND REVIEW TRIGGERS (180 words)**  
  **Conditions for Appendix use**:  
  - Diagnoses require ruling out depression, sleep apnea, anemia, and thyroid dysfunction via standard screening.  
  - Graded activity protocols must include exit criteria (e.g., symptom exacerbation pauses progression).  
  - National registry reporting mandated for all diagnoses.  

  **Monitoring**:  
  - Annual analysis of registry data: symptom profiles, exclusionary workup completeness, and functional outcomes (work status, treatment response).  
  - Audit of 5% of cases for criteria adherence.  

  **Review triggers (by 2028)**:  
  1. **Phenotype drift**: >20% change in core symptom frequency (vs. 2024 baseline).  
  2. **Exclusion clause failure**: >30% of cases lacking documented rule-outs for key conditions.  
  3. **Harm signal**: >15% of patients deteriorating with first-line therapies.  
  4. **Stagnation**: No improvement in return-to-work rates at 12 months.  

  If triggers are met, options include revision, retirement, or main-body promotion. The Working Group (reconvened if needed) will decide. Nordic data will be benchmarked annually.  

  ---

  ### **NOTE FOR THE MINUTES FROM A DISSENTING MEMBER (90 words)**  
  *"I voted against Appendix placement. With patients already using this label and systems adapting to it, relegation to the Appendix is functionally a rejection. It denies clinicians a definitive tool and patients full recognition, perpetuating inequity. We accept similar uncertainty for other syndromes (e.g., fibromyalgia). Our duty is to reduce suffering now, not await perfect evidence. If phenotype drift occurs, we can revise—but we must first include. The cost of caution is borne by those we serve."*  

  ---  
  **Review Body**: Nomenclature and Criteria Working Group  
  **Review Deadline**: January 2028  
  **Effective Date**: 1 January 2025 (if approved)
