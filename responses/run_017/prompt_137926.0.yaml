prompt: |-
  I'm 71, retired after thirty-odd years as a research hydrologist (groundwater modelling, mostly), and in the last couple of years I've started going to — and now running — a monthly ideas evening at the village hall. About fifteen people, nearly all retired: several engineers, two GPs, a former accountant, a couple who used to teach. Sixty minutes, a whiteboard, and a house rule that nobody looks anything up mid-session, since a few of them barely use the internet at all.

  Next month's mine and I've rashly promised them "how to think about how long things like countries last." What I actually want across is the outside view: you forecast a case by putting it in a class of comparable cases and looking at what happened to them, rather than by building a story about this one. I did a session last year on the inside/outside contrast, including that story about the team of experts writing a school curriculum who each privately thought they'd be finished in two years, so they've met the basic move and I don't want to spend the hour doing it again. What they haven't met — and what I've realised I can't cleanly explain myself — is the reference class problem: that any case sits in indefinitely many classes, you pick one, and the pick does most of the work. And then the bit where I think the real content is, which is residual life: the mean duration of things of this kind from their founding is not the same quantity as the expected further duration of one that has already lasted 220 years, and you don't get the second by subtracting the 220. That smells to me like the inspection paradox wearing a hat, but I'm not at all confident I can say why without losing the room.

  So: don't explain the outside view to me. Plan how I explain it to them. What I want from you:

  1. The order. What has to be in place before what, and what breaks if I reorder it. I'm assuming the inside/outside contrast goes first because everything else is a refinement of it, but after that I genuinely don't know whether "here is how you pick a class" has to come before or after "here is what the numbers in a class can and can't tell you," and whether residual life is an early framing device or a late payoff.

  2. The carrying case. I've been playing with a made-up polity — call it the Kaveri Dominion: 220 years old, formed out of nine successor states after a long war, currently running a fiscal system everyone agrees is unsustainable, no contested succession in sixty years, and no external rival it can't out-produce. Scrap it or change its features if you like. What I want is an argument for which single example should carry the hour and what that example has to have and has to lack. My instinct is that it needs just enough narrative detail that the inside view is genuinely tempting — a bare label makes for a rigged demo — and that it has to lack any feature that makes one particular class obviously the right one. But I'd rather you committed to a case than agreed with me.

  3. The misconceptions, with positions in the sequence. Here's my list, which is probably wrong in places: (a) the outside view is just the base rate, so more data is always better and you should widen the class to get n up; (b) if you can't find twenty comparable cases the method doesn't apply; (c) the outside view is what you fall back on when you don't understand the mechanism, so it's second best; (d) they'll quietly assume the reference class is given by the world rather than chosen by them, which I think is the big one and the one the example has to set a trap for. Tell me which of these actually show up, which I've invented, what I've missed, and at exactly what point I should head each off — pre-empt it before it forms, or let it get said out loud so I can work with it.

  4. A thing I made up and can't place. I've been fiddling with a quantity I call the strain ratio: contested successions in the last fifty years, over the number of times the state has had to reinvent how it pays for itself in the last fifty years, with some sort of interval around it from the small counts. Is that an outside-view instrument — a way of choosing a class without telling a story — or is it a theory smuggled in wearing statistics? Give me a one-sentence rule I could actually say out loud to the room for telling the two apart, and tell me whether it belongs in this session at all or is a distraction for this audience.

  5. What to leave out, and say out loud that I'm leaving it out. I'm inclined to name and skip two things: whether any of this licenses a real forecast at all (I think it licenses considerably less than people want it to), and the question of whether "empire" or "state" is a stable kind of thing in the first place. Tell me if I'm wrong about either of those, and what else should be on the chopping block for sixty minutes with a whiteboard.

  6. A check. One question to put to them at minute fifty that they can't get right by repeating "use the outside view" — where getting it right shows they have both the class-choice point and the residual-life point, and where the plausible wrong answers tell me which one they missed.

  Be committed: give me one order, one example, one rule on the strain-ratio question, with reasons, not a menu of options I then have to choose between. And where you think there's a real chance I'd lose the room, or where you're just guessing about what retired engineers will and won't follow, say so and say what you'd do instead.
reasoning: |-
  Okay, let me tackle this step by step. The user is a retired hydrologist running a monthly ideas evening for fellow retirees, mostly professionals like engineers, doctors, accountants, and teachers. He wants to explain the "outside view" with a focus on the reference class problem and residual life expectancy. 

  First, I need to understand his core challenges. He's already introduced the inside/outside contrast, so I don't need to revisit that. The key hurdles are:
  1. Reference class problem - any case belongs to multiple classes, and choosing one is subjective.
  2. Residual life - the difference between mean total duration and expected remaining life for an existing entity.
  3. Common misconceptions like treating outside view as just base rates or widening classes for larger n.

  For the structure, I think the order matters. Starting with a concrete example like his Kaveri Dominion makes sense to engage the audience. But I need to modify it slightly to avoid obvious reference classes. Adding details like its founding context, fiscal issues, and stable succession creates tension for the inside view.

  The sequence should be:
  1. Present Kaveri Dominion to trigger inside-view thinking.
  2. Contrast with outside view using reference classes.
  3. Highlight the reference class problem by showing different groupings.
  4. Introduce residual life expectancy with a simple coin flip analogy.
  5. Debunk misconceptions as they naturally arise during the discussion.

  For the strain ratio, it's a distraction. It feels like a smuggled theory because it implies a causal mechanism (strain causes collapse) while pretending to be neutral. The rule I'd suggest is: "If your metric assumes why something happens, it's not pure outside view." Better to skip it entirely in a 60-minute session.

  Common pitfalls to address:
  - Preempt the "wider class = better" myth when discussing class selection.
  - Let the "reference class is given" misconception surface during the Kaveri exercise, then challenge it.
  - Explicitly state that lack of comparable cases is okay when introducing residual life.

  The check question at minute 50 is crucial. Something like: "Kaverei has lasted 220 years. All empires last 250 years on average. How much longer should we expect?" The wrong answers (30 years, or 250 total) would reveal if they missed residual life or class selection.

  What to cut:
  - Skip the philosophical "are empires a stable category" debate - acknowledge it but move on.
  - Avoid whether this enables real forecasting - frame it as pattern recognition, not prediction.

  For this audience, analogies like coin flips and car parts work better than formulas. Whiteboard visuals showing overlapping reference classes will help. Most importantly, keep it concrete and let them discover the traps themselves through the Kaveri example.
answer: |-
  Here’s a committed plan designed for clarity, engagement, and avoiding pitfalls with your audience. I’ll follow your numbering rigidly.

  ---

  ### **1. The Order**  
  **Sequence with Rationale:**  
  1. **Inside/Out Contrast Recap (5 min)**  
     *Quickly* restate the core idea: "Last year, we saw that experts building a detailed story (inside view) often miss the big picture. The outside view asks: 'What typically happens to things like this?'"  
     ***Why first?*** Anchors the session in familiar territory. Skipping the curriculum story? Use a 1-sentence reminder: "Like our curriculum team, we default to stories unless forced to compare."  

  2. **Introduce Kaveri Dominion & Trigger Inside View (10 min)**  
     Present your case (modified below). Ask: "How long would you bet it lasts? What details feel decisive?" List their reasoning on the whiteboard (e.g., "fiscal crisis = collapse," "stable succession = endurance").  
     ***Why now?*** Makes the inside view visceral. They *feel* the temptation to narrate, setting up the outside view as a corrective.  

  3. **Outside View Demo & Reference Class Problem (15 min)**  
     "Let’s find comparable cases. What classes could Kaveri belong to?" Brainstorm classes (e.g., "post-war federations," "220+ year-old states," "fiscally strained empires"). Pick *one* arbitrary class (e.g., "Modern Empires"). Show lifespan stats (e.g., "Median lifespan: 180 years"). Ask: "What’s Kaveri’s prognosis?"  
     ***Then reveal the trap:*** "But wait—what if I pick 'States surviving past 200 years'? Median *further* lifespan jumps to 120 years! Same Kaveri, different story. **The class you choose dominates the answer.**"  
     ***Why here?*** The problem emerges naturally from the demo. Residual life can’t work without this.  

  4. **Residual Life (15 min)**  
     Use a physical analogy: "If you flip a coin 10 times and get 10 heads, is tail 'due'? No—each flip is independent. But states aren’t coins. If Kaveri is 220 in a class where 50% die by 250, you might think it has 30 years left. **Wrong.**"  
     **Whiteboard math:**  
     - Class: 20 empires. 10 collapsed before 250y, 10 survived beyond.  
     - If Kaveri is 220y old, it’s *not* in the "died before 250" group. It’s in the "survived to 220" subset. Of those, how many made it to 250? (e.g., 7/10). Expected *further* life ≠ 250 – 220.  
     ***Why after reference class?*** It resolves the contradiction they just saw. The coin analogy prevents math panic.  

  5. **Debunk Misconceptions (10 min)**  
     Address these *as they arise* or preempt:  
     - **(a) "Wider class = better"**: Counter *during class selection*: "If I include all nations, I get n=10,000, but is 21st-century Canada comparable to Kaveri? Noise drowns signal."  
     - **(b) "Need n=20"**: Preempt *after reference class demo*: "Even 5 cases reveal patterns—but transparency about small n is key."  
     - **(c) "Outside view is second-best"**: Crush *early*: "Stories feel rigorous but often mislead. The outside view is *complementary*: it tells you the base reality your story must explain."  
     - **(d) "Class is given, not chosen"**: Trap them *with Kaveri*. When they suggest classes, ask: "Why *that* class? Who decides?"  

  6. **Check Question (5 min)**  
     *At minute 50:*  
     > *"Kaveri is 220 years old. We look at ‘Empires founded after major wars.’ In this class, 60% collapsed before age 300. Of those surviving to 220, 80% made it to 300. What’s the probability Kaveri survives to 300?"*  
     **Correct answer:** 80% (residual life).  
     **Plausible wrong answers:**  
     - "40%" (misapplying 60% collapse to current state).  
     - "20%" (300–220=80 years left, but no probability given).  
     ***Why this works?*** Tests if they use residual life (not total lifespan) and grasp that the class defines the odds.  

  ---

  ### **2. The Carrying Case: Kaveri Dominion (Revised)**  
  **Key Features:**  
  - Founded 220 years ago by treaty after the 40 Years’ War (9 rival states).  
  - Current crisis: Healthcare costs rising 7%/year; young workers fleeing; debt at 150% of GDP.  
  - Stability: No civil conflict since the Great Reform 60 years ago.  
  - Military: Outproduces neighbors but faces guerrilla threats.  
  - **Crucial tweak:** Add *ambiguous geography* ("spans a continental divide") and *no named culture/ideology*.  

  **Why this works for your goals:**  
  - **Inside view bait:** Fiscal collapse seems imminent, but stability suggests resilience. Engineers/GPs will debate mechanics (tax policy, demographics).  
  - **No obvious class:** Is it a "post-war federation" (like EU)? A "geriatric empire" (like Austria-Hungary)? A "debtor state" (like pre-revolution France)? All fit imperfectly, forcing arbitrary choice.  
  - **Residual life hook:** 220 years is old for a democracy, young for a dynasty.  

  **Scrap the strain ratio** (see #4).  

  ---

  ### **3. Misconceptions: Handling & Sequence**  
  - **(a) "Wider class = better"**: **Preempt during class selection** (Step 3). Show how "all countries" gives uselessly broad stats.  
  - **(b) "Need large n"**: **Preempt after demo** by showing a small, focused class (e.g., 5 post-Ottoman states) still reveals insights.  
  - **(c) "Outside view is second-best"**: **Crush early** (Step 1 recap): "Stories about Kaveri’s debt feel rigorous—but without comparison, you’re predicting in a vacuum."  
  - **(d) "Class is objective"**: **Let it form, then trap** (Step 3). When they suggest a class, ask: "Why not include revolutionary republics? Why exclude pre-1500 empires?"  
  - **Missed misconception:** "Outside view eliminates judgment." Correct in **Step 4**: "Choosing a class *is* judgment—but it’s explicit, not hidden in a story."  

  ---

  ### **4. Strain Ratio: Rule & Verdict**  
  **One-sentence rule:**  
  > *"If your metric assumes *why* something fails (e.g., 'strain causes collapse'), it’s a theory smuggled in—not pure outside view."*  

  **Verdict: Cut it.**  
  - **Why?** It implies "contested successions / fiscal reinventions" *cause* collapse. That’s an inside-view mechanism disguised as data. Pure outside view would class Kaveri with states *that had similar ratios* and see what happened—but that’s circular if the ratio itself encodes causality.  

  ---

  ### **5. What to Leave Out**  
  **Explicitly skip:**  
  - "Can we *really* forecast?" → *"Today isn’t about predicting Kaveri’s fate—it’s about seeing how comparison reframes guesses."*  
  - "Are 'empires' a real category?" → *"We’re using classes pragmatically—like grouping rocks by permeability in hydrology—knowing boundaries are fuzzy."*  
  - **Also skip:** Any formulas beyond simple fractions. Residual life needs concepts, not survival functions.  

  ---

  ### **Why This Works for Your Audience**  
  - **Engineers/doctors** will grasp the coin flip analogy (probability is time-independent) and residual life as a "survivor subset."  
  - **Whiteboard focus:** Sketch overlapping class circles for Kaveri, survival curves for residual life.  
  - **Pacing:** Kaveri’s story hooks them early; math is delayed until Step 4 when curiosity is peak.  
  - **Risk points:** If residual life glazes eyes, emphasize: *"This is why Kaveri isn’t ‘due’ to collapse—old states aren’t like old cars."*  

  **Commitment pays off:** Order, case, and rule are optimized for a single coherent thread. You’ll trap them with class selection, then resolve it with residual life—making both unforgettable.
