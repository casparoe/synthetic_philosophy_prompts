  - *Route*: path → method → deviation  
  - *Map*: diagram → function → territory  
  - *Shift*: displacement → adjustment → transformation  
  - *Core*: center → essence → component  
  - *Frame*: structure → context → probe lens  

  Yes, these can span mechanistic and poetic registers. Now drafting stanza 1 with strict-view unease: "The model runs, a known *trace* left behind..." so *trace* feels material. By stanza 4 (permissive view), "What *trace* survives?" becomes epistemological. 

  Envoy's collision: "When answer's right but *route*'s unseen" forces all six concepts to clash at once. No hierarchy—just as the detector fails. Exactly what the user requested: a trap the poem walks into, word by rotating word.
answer: |-
  ## Sestina for the Anomaly Detector at the Edge

  The model runs, a known **trace** left behind
  on normal data, carving out the **route**.
  We drew the perfect, clean predictive **map**,
  defined the flow, where nothing ought to **shift**.
  We fixed the vital function at its **core**,
  constrained the process in a rigid **frame**.

  But watch this run: does it still fit the **frame**?
  The output matches, yet a subtle **trace**
  feels alien. Has something left the **core**
  pathway? Did it forge a hidden **route**,
  a silent bypass? Did the weights **shift**
  enough to redraw the internal **map**?

  We built the detector, keyed to this **map**:
  if components move beyond their **frame**,
  alarm! We need to catch the slightest **shift**
  in function, not just output. Find the **trace**
  that marks departure from the trusted **route**.
  Is this still *it*? Or changed down to the **core**?

  Permute the units, though – each hidden **core**
  node swapped, yet mathematically the **map**
  remains identical. Was the **route**
  truly altered? Still within the **frame**
  of normal function? Where’s the telltale **trace**
  of difference, if no outcome starts to **shift**?

  Is sameness in the parts? But any **shift**
  in weights, however small, might scar the **core**
  identity. Each run leaves its own **trace**,
  a unique path across the latent **map**.
  What tolerance defines the holding **frame**?
  When is a deviation just… a **route**?

  Or sameness in the function? That smooth **route**
  from input right to answer? But a **shift**
  to rote recall, a lookup table’s **frame**,
  would still compute the same, betraying **core**
  dynamism. The old, rich, learned **map**
  replaced by memory’s efficient **trace**.

  We probe: "If patched here, how would behaviour **shift**?"
  The profile answers, but – that reference **core**
  of interventions, built on the old **map**,
  assumes the normal distribution’s **frame**.
  This input *here*? It’s off the chart. Its **trace**
  is singular, devoid of known **route**.

  When answer's right but **route**'s unseen, no **map**
  provides the **core** truth. Does this **shift** count? What **trace**
  remains within the **frame**? No measure meets the moment.
