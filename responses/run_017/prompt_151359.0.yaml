  Avoiding jargon is key. "Mechanism" must work for laypeople as clockwork and experts as computational subgraph. The anomaly detector's struggle ("flag what changed beneath the answer") should mirror anyone inspecting a mystifying process. 

  Structural risks: envoy must avoid resolution. Let the final triplet's piled-up words ("trace," "route," etc.) jam the logic, like an input that breaks the detector. Last line "no measure meets the moment" suspends judgment—perfect. 

