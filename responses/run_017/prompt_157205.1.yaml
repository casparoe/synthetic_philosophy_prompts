prompt: |-
  I'm helping a small funder decide how to spend a pretty small pot — call it five researchers for two years — on moral trade: the idea that parties who disagree about what's valuable can each do what the other wants and both come out ahead by their own lights. The end goal isn't a survey, it's deciding whether this is actually a big lever or a cute idea that doesn't scale. So no reading lists, no "who has written on this"; I want a defended agenda.

  Two bits of framing so we skip the standard version. First, I want the intrapersonal case taken seriously as part of the same agenda: one agent, genuinely uncertain between two moral views, whose "parts" reach a compromise policy instead of one side winning. Is that usefully modelled as trade at all, or does it collapse into ordinary moral uncertainty and the whole gains-from-trade story quietly evaporate? Second, I care a lot about counterparties you can't verify. Concretely: a future AI system whose goals overlap with ours in some regions and not others, where the only enforcement available is that we can shut it down, and we can't audit whether it held up its end. Treat that as the case the agenda is ultimately for.

  Given that: rank the open questions those ten person-years should go on, and defend the ordering. Which are upstream, in the sense that other questions can't even be posed properly until they're settled? Which are actually tractable in two years for people with decision theory and some econ and no ability to run empirical work on what real agents value? Which would you defund — either unanswerable with the tools we have, or not load-bearing, i.e. the answer wouldn't change what anyone does? And what evidence showing up in the next couple of years would move something up or down? I'm much more interested in your criteria and how you trade off importance, tractability and neglect than in the list itself.

  End with one line: \answer{short phrase naming the single question you'd fund first}.
reasoning: |-
  Okay, the user is helping a small funder decide how to allocate a small research budget—enough for about five researchers over two years—focused on moral trade. The main goal is to determine whether moral trade is a significant lever for impact or just a theoretical curiosity that doesn't scale. They want a defended research agenda, not just a literature review.

  The user emphasizes two key framing points. First, they want the intrapersonal case taken seriously—where a single agent with moral uncertainty has "parts" that compromise. The question here is whether this can be modeled as trade without collapsing into ordinary moral uncertainty. Second, they care about unverifiable counterparties, like a future AI system where the only enforcement is the threat of shutdown, and auditing its compliance isn't possible. This scenario is the ultimate target.

  The core request is to rank open questions for the research agenda, considering factors like upstream importance (questions that need answering before others can be addressed), tractability with current tools (decision theory, some economics, no empirical work), and which questions aren't worth funding because they're either unanswerable or not impactful. The user is more interested in the reasoning behind the rankings—how importance, tractability, and neglect are balanced—than the list itself. The response should end with a single prioritized question in a specific format.

  The user's explicit needs include a clear ranking with justifications, criteria for prioritization, and identification of non-viable areas. Deeper needs might involve wanting actionable insights for real-world applications, especially in AI alignment, avoiding theoretical dead-ends, ensuring efficient use of limited resources, and building a foundation for future work despite constraints. They likely seek confidence that this research could influence practical decisions, like how to interact with advanced AI systems.

  To structure the response, I'll identify key open questions in moral trade, focusing on the intrapersonal case and unverifiable counterparties. The ranking will prioritize based on upstream nature, tractability, and impact. Questions that are foundational will rank higher because they enable further research. Tractability is crucial given the two-year timeline and available tools—so questions requiring empirical data or unavailable methods should be deprioritized. Impact is assessed by how much the answer would influence actions, especially in high-stakes scenarios like AI alignment.

  I'll start by listing potential open questions. For the intrapersonal case: How does modeling internal compromise as trade differ from standard moral uncertainty? Does it offer gains beyond standard frameworks? For unverifiable counterparties: How can trade occur without verification, especially with enforcement mechanisms like shutdown? What are the minimal conditions for cooperation?

  The ranking might place foundational issues first. For example, defining when moral trade is possible (Question 1) is upstream because without knowing if gains exist, other questions are moot. Tractability: This can be approached with existing decision theory tools. Neglect: This area is underexplored compared to empirical trade studies.

  Next, intrapersonal modeling (Question 2) is key because if it collapses into standard uncertainty, the trade framing adds nothing. Tractability: Model-building with known tools is feasible. But if it collapses, the agenda might need rethinking—so it's high-risk but necessary.

  Enforcement under uncertainty (Question 3) addresses core challenges with unverifiable agents. Tractability: Game theory models can be adapted, though equilibrium concepts might be tricky. High impact for AI alignment.

  Costly verification (Question 4) handles cases with partial but expensive auditing. Mediating institutions (Question 5) could be less critical initially if bilateral issues are unresolved. Scalability (Question 6) might be premature without foundational answers.

  Defunded areas: Empirical mapping of moral weights (Question 7) is unfeasible without data. Pure intrapersonal mechanisms (Question 8) might not add value if the trade analogy fails. Static equilibrium refinements (Question 9) are less relevant to dynamic enforcement. Abstract bargaining solutions (Question 10) don't address verification challenges.

  Criteria for ranking: Upstream status is weighted heavily (40%), as unresolved basics block progress. Tractability (30%) ensures realistic progress. Impact (20%) focuses on high-stakes applications. Neglect (10%) allocates resources where they're most needed.

  Evidence shifts: If gains in intrapersonal cases are proven, Question 2 drops. If enforcement mechanisms evolve, Question 3 becomes more urgent. AI goal specification progress could affect several questions.

  Finally, the top priority is Question 1: defining conditions for gains from moral trade, especially with deep uncertainty. It's foundational and tractable, making it the best starting point.

  In summary, the response will present a clear ranking with defenses, emphasize the trade-offs in criteria, and conclude with the highest-priority question as specified.
answer: |-
  Here’s a defended research agenda for moral trade, prioritizing open questions for your 5-researcher, 2-year project. The ranking balances **upstreamness** (whether a question gates others), **tractability** (feasibility with DT/econ tools, no empirics), **impact** (on scaling/actionability), and **neglect** (addressing gaps in current work). Crucially, we deprioritize questions that are unanswerable, non-load-bearing, or better suited to empirical work.

  ### Ranking & Justification
  1. **Under what conditions do gains from moral trade exist *with deep uncertainty*?**  
     - *Why upstream?* Until we know if gains exist when agents can’t probabilistically weight moral views (e.g., ambiguity, incommensurability), we can’t model trade mechanics. Vital for intrapersonal cases (no "common currency" of credences) and AI (no shared ontology).  
     - *Tractability:* Formalize using imprecise probability, minimax regret, or multi-objective optimization. Requires no new data.  
     - *Impact:* If gains vanish under reasonable uncertainty, the agenda collapses. If they persist, enables all downstream work.  
     - *Neglect:* Moral uncertainty literature assumes probabilistic credences; trade under ambiguity is underexplored.  

  2. **Does the intrapersonal case reduce to moral uncertainty, or does "internal trade" generate distinct gains?**  
     - *Why upstream?* If internal compromise is just EU-maximization under uncertainty, "trade" adds nothing. If it allows Pareto improvements *across subagents*, it validates the analogy.  
     - *Tractability:* Model "subagents" as vNM-rational players with distinct utility functions. Compare outcomes vs. standard moral uncertainty frameworks.  
     - *Impact:* Decides if intrapersonal trade is a fruitful path or a dead end. Key for AI value learning (e.g., "compromising" between human values).  
     - *Neglect:* Internal bargaining is rarely framed as trade; literature focuses on aggregation.  

  3. **What enforcement mechanisms work for unverifiable actions *without auditing*?**  
     - *Why next?* Enforcement is the core obstacle for AI applications (only shutdown threat). Must solve before scalability.  
     - *Tractability:* Game theory (repeated games with hidden actions, trembling-hand equilibria). Focus on credible threats (e.g., "shutdown if unobserved proxy metric fails").  
     - *Impact:* Directly addresses your AI use-case. If no mechanism exists, moral trade fails at scale.  
     - *Neglect:* Most trade theory assumes verifiable actions or contracts. "Hidden action" models in principal-agent problems lack moral disagreement.  

  4. **How to structure trades when verification is *possible but costly*?**  
     - *Why here?* Less upstream than #1–3 but critical for real-world scaling (e.g., mediating institutions).  
     - *Tractability:* Mechanism design with verification costs. Optimal monitoring under budget constraints.  
     - *Impact:* Enables practical implementation if #3 fails (e.g., "partial audits" for AI).  
     - *Neglect:* Costly state verification (Townsend) rarely incorporates moral disagreement.  

  5. **Can institutions mitigate commitment problems in high-stakes trade?**  
     - *Tractability:* Model escrow, bonds, or delegated enforcers as commitment devices.  
     - *Impact:* Useful if bilateral enforcement (#3) is fragile, but less load-bearing than core issues.  
     - *Neglect:* Existing work (e.g., contract theory) ignores deep value conflicts.  

  6. **Does trade scale under *strategic* behavior (e.g., manipulation of moral weights)?**  
     - *Why lower?* Depends on answers to #1–3. Important but premature without foundations.  
     - *Tractability:* Simulation of agents "gaming" trade protocols (e.g., exaggerating moral weights).  

  ### Defunded Areas (Non-Load-Bearing or Intractable)  
  - **Empirical mapping of "moral weights" across groups:** Intractable without data; not needed for theoretical clarity.  
  - **Pure intrapersonal mechanisms without external trade links:** Only fund if #2 shows distinct gains; otherwise redundant.  
  - **Static equilibrium refinements:** Less relevant than dynamic enforcement for unverifiable agents.  
  - **Bargaining solutions under complete information:** Trivial when actions are verifiable; doesn’t address core challenges.  

  ### Evidence That Would Reshuffle Rankings  
  - **If #1 shows robust gains under ambiguity:** Boost #2 (intrapersonal) and #3 (enforcement).  
  - **If #3 reveals *no* feasible enforcement without auditing:** Downgrade scalability work (#4–6); pivot to intrapersonal or verification-cost minimization.  
  - **New AI goal-specification results:** E.g., if we can bound AI values, #1 becomes less urgent.  

  ### Prioritization Criteria  
  - **Upstreamness (40% weight):** Blocks like gains/existence (#1) and enforcement (#3) dominate.  
  - **Tractability (30%):** Favor formal theory over empirics; avoid questions needing new math.  
  - **Impact (20%):** Focus on showstoppers for scaling (e.g., enforcement) and the AI case.  
  - **Neglect (10%):** Overlooked angles (e.g., ambiguity in trade) get modest boosts.  

  \answer{Existence of gains under deep uncertainty}
