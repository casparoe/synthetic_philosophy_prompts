     We can then later ask about abstract objects if they haven't been covered.

     However, note that Q1 already split on abstract objects. So we can do:

     After Q1 (which is about scope), we then ask about the nothing scenario.

     Let's reorganize:

     We start at S0: At least one concrete thing exists.

     Then:

