prompt: |-
  I am a novelist, and the manuscript I am about to begin is built, more than any book I have written, out of borderline cases. Its scenes turn on a curfew that begins "at nightfall," on a will contested on the question whether the testator was "of sound mind," on a marriage alleged never to have been "consummated," on a figure glimpsed across a fogged street who is "elderly, or at any rate no longer young," on a witness's insistence that a man was "bald." In my previous novels such passages ran to perhaps sixty per book, I resolved each of them by ear, and my editor and I disagreed on something like a third. That is now too much to leave to instinct, and I would like a procedure in place of the ear.

  Two constraints fix what the procedure has to be. First, my copy editor will have to run most of it: she is exacting about prose and has no philosophy, so the procedure must be executable in about five minutes per passage, must not require her to know anything I have not written down, and must tell her when to stop and pass the passage to me. Second, some of these passages are read by a legal reader before the book goes to set, and I have to be able to tell him, in language he will accept, what commitment a given sentence carries; he will not accept "it is indeterminate" as an answer unless I can say what kind of indeterminacy and who, in the fiction, is answerable for it. I sign off on the rest myself.

  As I understand the two families of position I am choosing between: on the first, every vague predicate divides the world at some perfectly sharp boundary, borderline cases are cases where we do not know where the boundary falls, and the sentence in question has a determinate truth value we cannot reach — the explanation of why we cannot reach it even in favourable circumstances being a margin-for-error constraint on knowledge rather than anything about the words. On the second, the indeterminacy is in the language: there are many admissible ways of making the predicate precise, a borderline predication is true on some and false on others, and truth is truth on every admissible precisification. I am told that this second view has a consequence I do not know how to write around: because every classical tautology holds on every precisification, "P or not-P" is safe, while "neither P nor not-P" is not merely unsettled but false on every precisification — so the kind of sentence I rely on most, which says of a borderline state of affairs that it is neither one thing nor the other, comes out false rather than indeterminate. If I have either position wrong, or that consequence wrong, correct it briefly before building anything on it.

  One further feature of the manuscript is relevant, and it is the part I most want the procedure to earn its keep on. The book is framed as a dossier assembled by an in-world official I call the Reporter, who appends marginal notes to the scenes; some of those notes settle what the scene left open, by stipulating, for the purposes of the record, how a predicate is to be taken. I take it that a Reporter's note is, in the fiction, what a theorist would call a sharpening or precisification — stipulating one admissible way of taking the word rather than discovering a boundary. That means the book has a second question the earlier ones did not: whose sharpening a given sentence deploys, the narrator's, the character's, or the Reporter's, and whether an unmarked sharpening is available to me at all.

  So I am asking for a procedure, not an explanation. Give me the questions in the order they must be asked, with what counts as a sufficient answer to each; the point at which it halts and tells me to leave the sentence alone; the point at which it hands the decision to me because the remaining question is one of values rather than fact; and an honest account of which distinctions have to survive the simplification and which I can afford to lose in order to make it runnable by someone with five minutes and no theory. I want a one-page version my copy editor can hold, a handful of test lines she can apply to see whether she is running it correctly, and — because at least one such line is not vagueness at all but context-sensitivity, ambiguity, or mere ignorance — a first question that catches those and sends them elsewhere rather than forcing them through the rest of the procedure. I also want to know how the procedure handles a borderline case about a borderline case, and whether the stance I adopt must be constant across the book or may vary from passage to passage without the book breaking.

  Then run it on three passages from the draft. The first is the sentence I am fondest of: "It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which." I expect the procedure to tell me something about that sentence I will not like, and I would rather hear it now than in galleys. The second is the Reporter's note on the contested will: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say." The third is a piece of free indirect style: "The woman on the far pavement was elderly, or at any rate no longer young." For each, show the procedure arriving at an answer rather than stating one, and mark where, if anywhere, it stops short and I have to decide.

  Finally, tell me what the procedure cannot do. I would rather know now which of these passages will remain a matter of judgment, however carefully the rest is specified, than discover it when my editor and I are arguing about a page proof.
reasoning: |-
  Hmm, the user is a novelist grappling with borderline cases in their manuscript - concepts like "nightfall," "sound mind," and "elderly" that resist clear definitions. They need a practical procedure for their copy editor to handle these vague predicates efficiently, within five minutes per passage, without philosophical jargon. The editor must know when to stop and escalate to the author.

  There are two key constraints: First, the copy editor has no theoretical background, so the procedure must be executable using only the text itself. Second, a legal reader requires precise commitments about each sentence's determinacy - "it's indeterminate" isn't acceptable without explaining who bears responsibility in the fiction.

  The novelist mentions two philosophical approaches to vagueness. The epistemic view claims vague predicates have sharp boundaries we just can't know. The supervaluationist view says there are many admissible precisifications, making borderline cases genuinely indeterminate. The novelist is concerned because supervaluationism seems to make statements like "neither P nor not-P" false rather than indeterminate - which contradicts how they want to describe borderline states.

  A unique element is the "Reporter" character who adds marginal notes that explicitly sharpen certain terms. This introduces questions about whose perspective governs each sharpening - the narrator's, a character's, or the Reporter's.

  The core request is for a step-by-step decision procedure, not theoretical explanations. It needs: ordered questions with clear answers; stopping points; distinction between factual and value judgments; simplification that preserves essential distinctions; a one-page guide for the editor; test cases; and a filter to redirect non-vagueness issues like ambiguity.

  The procedure must handle higher-order vagueness (borderline cases about borderline cases) and allow varying philosophical stances across passages without breaking consistency. It should be tested on three sample sentences.

  The novelist also wants transparency about the procedure's limitations - what will always require authorial judgment. There's clear urgency here; they've had significant disagreements with editors in the past and want to avoid last-minute disputes during proofs.

  Underlying all this is a literary challenge: preserving the aesthetic power of vagueness while meeting legal and editorial precision demands. The Reporter device cleverly externalizes precisification, but creates new complexities about narrative authority. Their attachment to sentences like "neither dusk nor night" suggests they value indeterminacy as a stylistic device, which might clash with logical constraints of supervaluationism. I'll need to address this tension directly in the test case analysis.
answer: |-
  Here is a procedure designed for your copy editor, addressing your constraints and philosophical concerns. It prioritizes operational simplicity and clear decision points.

  **The Borderline Case Procedure (One-Page Version for Copy Editor)**

  1.  **Question 1: Is this *really* vagueness? (Check for Imposters)**
      *   **Ask:** Could the confusion arise *only* because we lack information the characters might have (ignorance), or because the word has multiple distinct meanings (ambiguity), or because the relevant standard changes with context (context-sensitivity)?
      *   **Sufficient Answer:** If YES (e.g., "bald" might mean hairless *or* courageous; "nightfall" time depends on local ordinance; we simply don't know the testator's exact mental state), **STOP**. Flag as "Non-Vagueness Issue: [Specify Type - Ignorance/Ambiguity/Context]". Pass to author. If NO (confusion persists even with perfect info, single meaning, fixed context), proceed to Q2.

  2.  **Question 2: Is there an explicit Reporter stipulation?**
      *   **Ask:** Does a Reporter's marginal note *in the text* explicitly define or fix the meaning of the vague term *in this specific instance*? (e.g., "By 'elderly' for this record, I mean over 65 years.")
      *   **Sufficient Answer:** If YES, the term is **sharpened** as per the Reporter's note for *this passage*. Proceed to Q3 only if the *sentence itself* still seems problematic *despite* the stipulation. If NO, proceed to Q3.

  3.  **Question 3: Is the sentence claiming determinacy or indeterminacy?**
      *   **Ask:**
          *   Does the sentence *assert* the borderline case *is* definitively P? (e.g., "It *was* nightfall.") -> Mark as **Determinately Claimed (P)**
          *   Does the sentence *assert* the borderline case *is* definitively not P? (e.g., "It was *not* nightfall.") -> Mark as **Determinately Claimed (Not-P)**
          *   Does the sentence *deny* it is P *and* deny it is not P? (e.g., "It was neither dusk nor night.") -> Mark as **Indeterminacy Claimed**
          *   Does the sentence *merely describe* the borderline state *without* asserting its status? (e.g., "They took him at nightfall.") -> Mark as **Unmarked Borderline**
      *   **Sufficient Answer:** Categorize into one of the 4 types above. Proceed to Q4 for **Unmarked Borderline** or **Indeterminacy Claimed**. For **Determinately Claimed (P/Not-P)**, **STOP**. Flag as "Determinate Claim on Borderline Case". Pass to author for value judgment (Is this claim plausible/desired? Does it fit character/knowledge?). For **Indeterminacy Claimed**, proceed to Q4.

  4.  **Question 4: Handling "Indeterminacy Claimed" & "Unmarked Borderline"**
      *   **For Indeterminacy Claimed (e.g., "It was neither P nor not-P"):**
          *   **Consequence:** If using the "many precisifications" view (supervaluationism), this sentence is **FALSE** on every precisification. It *cannot* be true under that theory.
          *   **Procedure:** **STOP**. Flag as "Indeterminacy Claim - Logically Problematic (False on Precisifications)". Pass to author immediately. Author must choose: (a) Reword to avoid claiming indeterminacy (e.g., "It was unclear whether..."), (b) Use epistemic view for this passage (making "neither" potentially true but unknowable), or (c) Accept the contradiction as a stylistic device (risky for legal reader).
      *   **For Unmarked Borderline (e.g., "They took him at nightfall"):**
          *   **Procedure:** **STOP**. Flag as "Unmarked Borderline Case". Pass to author *only* if the legal reader requires a specific commitment. Otherwise, leave as is. The author accepts the inherent indeterminacy. The commitment is: *The sentence is true only on some admissible precisifications, false on others. The Reporter/narrator presents it without resolving the vagueness. Responsibility for the indeterminacy lies with the language itself within the fictional world.*

  **Key Simplifications & Surviving Distinctions:**
  *   **Simplified/Lost:** Deep theory (margin for error, exact nature of admissibility). Higher-order vagueness (borderline borderline) is treated like first-order. "Whose sharpening?" is only addressed for explicit Reporter notes (Q2).
  *   **Surviving:** Core distinction between ignorance/ambiguity/context vs. genuine vagueness (Q1). Presence of explicit Reporter sharpening (Q2). Crucial distinction between *claiming* determinacy vs. claiming indeterminacy vs. leaving it unmarked (Q3/Q4). The fundamental logical problem with "neither P nor not-P" under supervaluationism (Q4).

  **Test Lines for Copy Editor:**
  1.  "He was bald." (Q1: YES - Could be ignorance *or* ambiguity *or* vagueness? -> Flag as Non-Vagueness Issue (Type?), pass to author).
  2.  "They crossed the line at dawn." (Q1: NO. Q2: NO. Q3: Unmarked Borderline -> STOP, Flag as Unmarked Borderline).
  3.  "The Reporter notes: 'For this record, "dawn" signifies nautical dawn.'" (Q1: NO. Q2: YES -> Term sharpened by Reporter. Q3: Sentence using "dawn" now likely determinate (unless borderline *for nautical dawn*)).
  4.  "It was definitely sound mind." (Q1: NO. Q2: NO. Q3: Determinately Claimed (P) -> STOP, Flag as Determinate Claim on Borderline, pass to author).
  5.  "It was neither sound mind nor unsound." (Q1: NO. Q2: NO. Q3: Indeterminacy Claimed -> Q4: STOP, Flag as Indeterminacy Claim - Logically Problematic, pass to author).

  **Handling Higher-Order Vagueness & Consistency:**
  *   **Borderline-Borderline:** Treat it like any other borderline case in the procedure. Q1 filters out non-vagueness. The core issue in Q3/Q4 remains the same: what is the sentence *claiming*? The procedure doesn't distinguish levels of vagueness, as this is too complex for 5 minutes/no theory.
  *   **Stance Consistency:** The procedure *allows* you to vary the underlying theory (epistemic vs. supervaluationist) *per passage*, as long as it's handled in the author decisions triggered by the flags (especially the Q4 flag for Indeterminacy Claimed). The book won't break, but the *legal reader* might require consistency in how commitments are explained.

  **Running the Procedure on Your Passages:**

  1.  **"It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which."**
      *   Q1: **NO** (Not ignorance/ambiguity/context - genuine vagueness of "dusk"/"night" boundary).
      *   Q2: **NO** (No Reporter note sharpening these terms here).
      *   Q3: **Indeterminacy Claimed** ("neither dusk nor night").
      *   Q4: **STOP**. Flag: "Indeterminacy Claim - Logically Problematic (False on Precisifications)". Pass to author.
      *   **Result:** The procedure flags the core issue you anticipated. You must decide: Reword (e.g., "It was unclear whether it was dusk or night..."), adopt the epistemic view for this sentence (making "neither" true but unknowable), or keep it knowing it's logically false under supervaluationism and explain that commitment to the legal reader as a stylistic choice reflecting the sergeant's (or narrator's) *perspective* on the indeterminacy.

  2.  **Reporter's Note: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say."**
      *   Q1: **NO** (Genuine vagueness of "sound mind").
      *   Q2: **YES** (This *is* the Reporter's note). The note explicitly states: **No Fact of the Matter** (i.e., indeterminacy).
      *   Q3: The note itself is an **Indeterminacy Claimed** statement about "sound mind".
      *   Q4: **STOP**. Flag: "Indeterminacy Claim - Logically Problematic (False on Precisifications)". Pass to author.
      *   **Result:** The Reporter is making the same type of claim as passage 1. The procedure flags it identically. You face the same choice: rewrite the Reporter's note (e.g., "The question of sound mind lacked a determinate answer; there was only..."), adopt epistemicism (Reporter asserts unknowability), or accept the logical tension. Crucially, *this note does not sharpen "sound mind"*; it comments *on* its vagueness. Q2 captured it as a Reporter statement *about* vagueness, not a sharpening *of* it.

  3.  **Free Indirect Style: "The woman on the far pavement was elderly, or at any rate no longer young."**
      *   Q1: **NO** (Genuine vagueness of "elderly"/"young").
      *   Q2: **NO** (No Reporter note here defining the terms).
      *   Q3: **Unmarked Borderline** (The sentence *uses* the vague term "elderly" and acknowledges its potential borderline status with "or at any rate no longer young" without *asserting* indeterminacy itself. It presents the character's *thought* which includes the hedging phrase).
      *   Q4: For Unmarked Borderline -> **STOP**. Flag: "Unmarked Borderline Case". *No immediate pass to author needed*. The commitment is: The thought/sentence is true on some precisifications of "elderly", false on others. The indeterminacy is inherent in the character's/narrator's language. Responsibility lies with the fictional language/user (the character thinking this).
      *   **Result:** The sentence survives the procedure unchanged. The hedging phrase is part of the character's perspective, not a meta-claim about indeterminacy triggering Q4.

  **What the Procedure Cannot Do:**

  1.  **Resolve Core Philosophical Choice:** It cannot *tell* you whether to use epistemicism or supervaluationism for flagged "Indeterminacy Claimed" passages. You must make that value-laden choice per instance.
  2.  **Define "Admissible Precisification":** It relies on your intuitive grasp of what counts as a reasonable sharpening. The procedure flags *that* sharpening happens or is needed, but doesn't define its limits beyond explicit Reporter notes.
  3.  **Handle Deep Higher-Order Vagueness Elegantly:** It treats all vagueness similarly. Deciding if something is a "clear borderline case" vs. a "borderline borderline case" is beyond its scope.
  4.  **Guarantee Legal Reader Acceptance:** It provides *language* for the commitment ("true on some precisifications, false on others", "inherent language indeterminacy", "Reporter/narrator/character perspective"), but whether the legal reader *accepts* "indeterminacy inherent in the language" as a sufficient commitment is outside the procedure's control.
  5.  **Eliminate Author Judgment:** Significant judgment calls remain:
      *   Q1: Distinguishing vagueness from imposter types.
      *   Q3: Classifying the sentence's claim (especially subtle cases).
      *   Handling all flagged passages (Determinate Claims on Borderline, Indeterminacy Claimed) - deciding on rewrites or underlying theory.
      *   Deciding *when* the legal reader requires an explicit commitment for an Unmarked Borderline.
  6.  **Create Aesthetic Value:** It ensures logical/editorial hygiene, not the literary power of your carefully crafted borderline descriptions.

  This procedure streamlines the *identification* and *categorization* of borderline cases for your copy editor, providing clear stopping points and flags for your necessary intervention, especially for the critical "neither P nor not-P" sentences you favor. It forces confrontation with the logical consequence of supervaluationism upfront while leaving you the authorial freedom to choose your stance per passage as needed.
