prompt: |-
  You're a professional philosopher who has spent years on animal ethics and who, unusually, actually knows some population ecology — the kind of person who can tell density-dependent mortality compensation from a trophic cascade and who won't treat the number of wild vertebrates alive as a back-of-envelope afterthought. Before you write anything, do a quiet brainstorming pass: sketch the space of requirements you could impose, and for each ask what would show a theory had violated it and whether anyone actually denies it. Then commit to one list and stop hedging. Where you're genuinely torn, say so, but still pick a side rather than writing everything as a set of open questions.

  Here's what I need. I'm on a review panel writing the terms of reference for a body that will exist for 25 years and has a mandate over a large, bounded, mostly-wild territory — call it a couple of hundred thousand square kilometres of mainland, islands, farmland, fenced reserves and one big river delta. It has to publish its reasons, it will be replaced by a differently-composed committee in 25 years, its budget is maybe two percent of what it would need to do everything anyone might want, and it has to act on welfare estimates that are, honestly, terrible. So I don't want a theory of the cosmos; I want the specification: what a view has to be able to do to be good enough to guide that body.

  Give me the requirements list, each with the case or consideration behind it — the cases it has to get right, the distinctions it must not collapse, the biology it must not contradict. Please cover at least:

  - predators and prey, on whatever scale you like;
  - the mass-juvenile-mortality case, where most of the suffering is in animals that never reproduce and where removing one cause of death mostly just substitutes another;
  - chronic background conditions rather than dramatic ones — parasitism, drought, starvation, cold;
  - the sentience-uncertain cases, insects especially, given that enormous interventions on their behalf and against them are already happening through agriculture and pest control, so the theory owes us something about existing practice and not only about novel interventions;
  - animals in places we call wild but already run — waterholes, fire regimes, culls, supplementary feeding, feral and rewilded domesticates;
  - the eradications and sterilizations everybody already accepts (rats off islands) versus the ones nobody accepts (neutering predators), and whether the theory can explain the difference or has to overrule it;
  - the withdrawal hazard — my phrase, sorry — where an intervention has to be maintained indefinitely and the suffering after the maintaining institution loses interest or loses its budget is worse than the baseline, so a theory has to say what it owes the future it is handing the system to;
  - and the audit problem, which is mine too: you can only find out whether you helped by intervening, the intervention changes the system you're measuring, and the body doing it has every institutional incentive to report success. Any theory whose recommendations are unverifiable in principle should be marked down, and I want to know exactly how much to mark it down.

  On distinctions: I want to see status versus how much status, causing versus allowing and specifically the messy version where you stop a harm you didn't start by starting something else, welfare versus naturalness or ecological integrity or an animal getting to live as its kind lives, individuals versus populations versus systems as the unit of concern, reducing suffering versus adding positive welfare, and duty versus permission. Say which are real desiderata and which are just one camp's commitments wearing a suit.

  My panel has handed me a pile of candidate requirements and I suspect some are prejudices. Tell me which, and whose: that non-interference is the default and needs no justification; that no verdict may trade individuals of one species against individuals of another; that the theory must be usable by people who don't know which animals are sentient; that it must respect what the humans living in the territory value, including valuing wildness; that it must be computable from data we could plausibly have in ten years; that it must not rest on any contested claim in population ethics; and that it has to give the same verdict at a scale of ten animals and at a scale of ten to the ninth.

  Then the part I actually care about. Flag any pair of requirements you suspect can't be jointly satisfied — I'd rather have your argument than a tidy list — and if some subset is jointly unsatisfiable, give me the trimmed list that survives and say plainly what I lost. And tell me which single requirement does the most work knocking out candidate theories, because that's where the real disagreement is and I want to put it to the panel.

  If you have room, a short table at the end scoring four family-level views against the list — hands-off ecological holism, consequentialist interventionism of the wild-animal-welfare sort, a rights or inviolability view extended to animals, and a stewardship or capabilities picture — but keep that under a quarter of your answer, the criteria are the deliverable. And skip citations and reading lists entirely; I've read the survey material and I can't get to a library from where I'm writing this.
