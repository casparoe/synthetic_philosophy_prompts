  Alright, let me unpack this dense request. The user is a policy expert designing a 25-year governance framework for a vast wild territory with severe budget and knowledge constraints. They need operational requirements, not philosophical theories - a sharp distinction I must maintain.

  First, the core tension: this body must make welfare decisions with terrible data while avoiding catastrophic mistakes. The withdrawal hazard and audit problem sections reveal their deepest concern - institutional failure modes. They're haunted by interventions that backfire after funding dries up or that become self-justifying boondoggles. 

  The population ecology references suggest they've seen naive proposals collapse by ignoring density dependence. The "mass-juvenile-mortality" emphasis confirms this - they understand compensatory mortality makes simple rescue attempts futile. Their insect question is tactical: since we already manipulate invertebrates at scale, any credible theory must engage that reality, not just pontificate about mammals.

  Now the land context matters. That mix of farmland, reserves and delta means constant tradeoffs: culling in one area, rewilding in another. The "feral domesticates" point is sneaky important - think of hogs destroying wetlands or cats killing birds. And the rat eradication vs. predator neutering comparison tests whether the theory can justify status quo biases or must overhaul them.

  For the distinctions checklist: they want to expose which are fundamental and which are ideological. "Naturalness" versus welfare is clearly the battleground. The "duty vs permission" item suggests they anticipate paralysis if every action requires justification. 

  On their panel's candidate requirements: the "no cross-species trade-offs" demand is clearly Singer-bait, while "respect human wildness values" is a nod to Noss-style conservation. The computability requirement seems practical until you realize welfare metrics for insects don't exist - hence their sentience-uncertainty focus.

  The joint satisfiability problem is where this gets acute. Look at R1 (Prevent Catastrophes) versus R9 (Reversibility). Making sterilization programs reversible might prevent catastrophe-proof interventions. And R10 (Auditability) will murder theories relying on counterfactual welfare comparisons - but those might be the only ones handling density dependence properly.

  For knockout power, R6 (Scale Invariance) is the silent killer. Most theories handle micro and macro separately - think of Regan's rights view versus classic utilitarianism. But for a body managing ecosystems, that gap could be fatal when shifting from individual rescues to landscape-scale interventions.

  In drafting the requirements, I'll front-load the operational ones (catastrophe prevention, reversibility) because institutional survival depends on those. The epistemology constraints (R10-R11) must be severe - this body will spin narratives to justify its existence. And I'll demote "naturalness" to an optional consideration (C3) since it conflicts directly with welfare in predator control cases.

  The stewardship view scores best not because it's perfect, but because its "capabilities floor" concept handles uncertainty better than hedonic calculus. But I'll underline its weakness on insects - no theory aces that yet, so better to flag the gap than pretend otherwise.

  Finally, the rat vs. predator discrepancy: consequentialism fails this test by endorsing both sterilizations, while rights theory rejects both. Only stewardship can split the difference via the "threat to ecological viability" clause - which might just rationalize bias, but at least provides a framework.
answer: |-
  Here is a requirements list for a practical theory of wild animal welfare intervention, designed for a resource-constrained, temporally bounded governance body. Requirements are ranked by "knockout power" – the ability to disqualify inadequate theories. Jointly unsatisfiable requirements are flagged.

  ### Core Requirements (Non-Negotiable)
  1.  **Prevent Catastrophes (R1):** *Must forbid interventions risking irreversible ecosystem collapse or mass suffering beyond baseline.*  
      *Why:* Violated by proposals ignoring trophic cascades (e.g., naive predator eradication causing prey overpopulation → starvation). Denied by reckless "ends justify means" views.
  2.  **Acknowledge Compensation (R2):** *Must explicitly model density-dependent mortality/demographic compensation.*  
      *Why:* Violated by theories assuming reducing one cause of juvenile death (e.g., parasitism) directly reduces suffering without predicting increased starvation/predation. Denied by "simple summation" suffering metrics.
  3.  **Epistemic Humility (R3):** *Must function under profound uncertainty about sentience (especially invertebrates) and welfare impacts.*  
      *Why:* Violated by theories requiring definitive sentience proofs or precise welfare calculus to act (or not act). Denied by dogmatic sentience skeptics *and* certain utilitarians.
  4.  **Manage Withdrawal Hazard (R4):** *Must assign responsibility for long-term consequences of interventions requiring sustained effort.*  
      *Why:* Violated by theories advocating temporary predator suppression without planning for rebound effects post-funding. Denied by "discount the future" extremists.
  5.  **Audit Constraint (R5):** *Must generate *falsifiable* predictions about welfare outcomes, prioritizing measurable proxies.*  
      *Why:* Violated by theories relying solely on counterfactuals ("suffering prevented") or holistic "ecosystem health" metrics. Denied by mystical holism or purely deontological views.
  6.  **Scale Invariance (R6):** *Must deliver consistent verdicts for identical welfare dynamics at micro (10 animals) and macro (10^9 animals) scales.*  
      *Why:* Violated by theories that are rights-based at small scales but consequentialist at large scales (or vice-versa) without justification. Denied by ad-hoc pragmatists.

  ### Functional Requirements (Essential)
  7.  **Handle Chronic Suffering (R7):** *Must address endemic conditions (starvation, parasitism, chronic stress) as distinct from acute events.*  
      *Why:* Violated by theories focused only on "dramatic" harms (predation) or assuming chronic suffering is "natural/balanced." Denied by predation-obsessed views.
  8.  **Distinguish Causing/Allowing in Intervention (R8):** *Must differentiate *initiating* novel harms vs. *failing to prevent* natural harms vs. *substituting* harms.*  
      *Why:* Violated by theories equating not feeding starving animals with actively starving them, *or* equating culling (causing death) with allowing predation (allowing death). Denied by simple consequentialism *and* absolutist non-interference.
  9.  **Reversibility Default (R9):** *Must prioritize reversible interventions over irreversible ones (sterilization vs. eradication) unless strong justification exists.*  
      *Why:* Violated by theories defaulting to eradication for efficiency without weighing loss of future beings/potential. Explains rat vs. predator difference: Eradication is often irreversible; sterilization isn't. Denied by pure "pest control" mentality.
  10. **Value Human Context (R10):** *Must incorporate local human values (e.g., wildness, cultural significance) as constraints or inputs, not mere obstacles.*  
      *Why:* Violated by theories dismissing "wildness" as irrelevant or treating local communities as implementation problems. Necessary for legitimacy/sustainability. Denied by imperialist welfare consequentialism.

  ### Operational Constraints (Practical Necessity)
  11. **Computable with Sparse Data (R11):** *Must yield actionable guidance using coarse, probabilistic welfare proxies (body condition, stress hormones, behavior) and population trends, not perfect utility calculus.*  
      *Why:* Violated by theories requiring individual hedonic calculus or precise sentience weights. Denied by idealized utilitarianism.

  ### Suspect Panel Proposals (Prejudices Identified)
  *   **"Non-interference is default"**: *Prejudice.* Leans on status quo bias and "natural=good" fallacy. Ignores chronic suffering. (Ecocentric Holism)
  *   **"No cross-species trade-offs"**: *Prejudice.* Biologically incoherent (ecology *is* trade-offs). Impractical for management. (Rights-Based Absolutism)
  *   **"Usable without sentience knowledge"**: *Valid, covered under R3 (Epistemic Humility).*
  *   **"Respect human wildness values"**: *Valid, covered under R10 (Value Human Context).*
  *   **"Computable from plausible data"**: *Valid, covered under R11.*
  *   **"Avoid contested population ethics"**: *Prejudice.* Impossible. *Creating* future animals (via protection) vs. *preventing* future animals (via sterilization) is core. Must take a stance. (Cowardice)
  *   **"Scale invariance"**: *Valid, promoted to R6.*

  ### Joint Satisfiability & Trimming
  *   **The Tension:** **R6 (Scale Invariance)** + **R8 (Causing/Allowing Distinction)** + **R2 (Compensation)** is the critical friction point. Theories excelling at micro-scale ethics (emphasizing individual inviolability - R8) often struggle with macro-scale dynamics (where compensation - R2 - forces trade-offs). Theories handling macro dynamics well (embracing compensation/trade-offs) often violate strict micro-level distinctions about causing harm.
  *   **Resolution:** **Trim R8's strictness.** Require the distinction *be made*, but allow differing moral weight at different scales *if justified by system dynamics (R2)*. E.g., Culling *causes* death, but if proven necessary to prevent greater suffering via starvation (R2), it may be permissible despite R8. **What's Lost:** Purity of individual-focused ethics. Rights become defeasible by system-level welfare consequences.

  ### Knockout Requirement
  **R5 (Audit Constraint) does the most work.** Theories failing here are operationally useless or prone to institutional self-deception. It eliminates:
  *   Pure rights theories (hard to falsify "rights violations" in wild systems).
  *   Deep ecological holism ("health" is non-falsifiable for welfare).
  *   Naive utilitarianism (counterfactual suffering reduction is unmeasurable).

  ### Theory Scorecard (✓=Meets, ✗=Fails, ~=Partial/Problematic)

  | Requirement          | Ecological Holism      | WAW Consequentialism | Rights/Inviolability | Stewardship/Capabilities |
  | :------------------- | :--------------------- | :------------------- | :------------------- | :----------------------- |
  | R1: Catastrophes     | ✓ (But may accept "natural" collapse) | ~ (Risk if discounting ecology) | ✓                     | ✓                        |
  | **R2: Compensation** | ✗ (Ignores suffering)  | ✓                    | ✗ (Focus on acts, not outcomes) | ✓                        |
  | **R3: Uncertainty**  | ✗ (Assumes non-sentience) | ~ (May over-intervene) | ✗ (Requires certainty) | ✓ (Precautionary focus)  |
  | **R4: Withdrawal**   | ✓ (Non-intervention)   | ✗ (Often assumes permanence) | ✓ (Non-intervention) | ✓ (Builds resilience)    |
  | **R5: Audit**        | ✗                      | ~ (Proxy: population size ≠ welfare) | ✗                     | ~ (Capability proxies measurable) |
  | **R6: Scale**        | ✓ (System focus)       | ✗ (May optimize locally, harm globally) | ✗ (Individual focus) | ~ (Seeks balance)        |
  | R7: Chronic          | ✗                      | ✓                    | ~ (If suffering is a "harm") | ✓                        |
  | R8: Causing/Allowing | ✓ (Non-intervention)   | ✗ (Collapses distinction) | ✓                    | ~ (Contextual)           |
  | R9: Reversibility    | ✓ (Do nothing)         | ~ (Prefers efficiency) | ✓ (Against killing)  | ✓ (Core principle)       |
  | R10: Human Values    | ✓ (Wildness valued)    | ✗ (Welfare dominates) | ~ (If rights conflict) | ✓ (Integrates values)    |
  | R11: Computable      | ✓ (Ecological metrics) | ~ (Welfare data sparse) | ✗                    | ~ (Capability metrics feasible) |
  | **Key Weakness**     | Ignores individual suffering | Blind to system complexity & withdrawal risk | Impractical in dynamic systems; poor under uncertainty | Vagueness in capability thresholds; audit challenges |

  **Survivor:** **Stewardship/Capabilities** (focuses on maintaining capacities for basic function/flourishing, prioritizes reversible actions, respects context, uses measurable proxies). **Runner-up:** **WAW Consequentialism** (scores well on biology but fails catastrophically on R4, R5, R6, R10). **Your real choice:** Tolerate Stewardship's vagueness and audit challenges, or gamble that WAW Consequentialism's superior handling of compensation (R2) won't be undone by its institutional risks (R4, R5) and scale problems (R6).
