prompt: |-
  hey — I need something like a spec review, except the spec is conceptual and I dont have the vocabulary for it. No philosophy background here (I know the words utilitarianism and Rawls and that's about where it ends), so gloss any jargon, and please don't send me to read anyone — I want the requirements, not the literature.

  Setup. I'm on the eng side of a system that splits a shared monthly budget across a few thousand users. Every user files a weekly self-report number, 0 to 10, for how things are going for them. The numbers are on each user's own scale: I have literally no idea whether Ana's 7 is better or worse than Ben's 3, and I suspect in the general case there's no fact of the matter recoverable from the reports alone.

  Two new-ish data sources, which is why this is coming up now:

  - The ML team shipped a "pair probe": we sample pairs of users, ask a third user who knows both well "who's worse off right now", and we get a noisy ordinal label. About 72% agreement with a held-out heuristic. It only works inside tight clusters of users who actually know each other, so there's no probe path between clusters.
  - We can, occasionally and expensively, run a "swap interview": ask one user whether they'd trade their next month for another user's next month, all things considered.

  Two known failure modes in the self-reports:

  - Some users are what user research calls "adapters": after a permanent bad event their number drops and then climbs back to roughly where it was within a few months. Others ("straight-liners"?) never come back up. I don't want the allocator to systematically defund the adapters just because their readout heals.
  - Users know a low number gets them more budget. Some shading is certain.

  I'm also told there's a distinction I should care about between lining up everyone's zero point (levels) versus lining up everyone's step size (units), and that a lot of the arguing happens there. Assume I know nothing about it.

  What I want from you: the requirements list. What does a method for putting these people onto one comparable scale have to get right to be good enough to actually move money with? For each requirement, give me the concrete case or failure it exists to prevent — ideally a case built out of the setup above, not a textbook one. In particular I want you to cover, at minimum: what to do when the probe can't reach across clusters; what an adapter vs a straight-liner does to the comparison; what happens when the very users you most need comparisons for (the adapters) are also the ones the probe is least reliable on; and what the allocator owes a user by way of explanation when it turns them down — our legal folks want a one-paragraph justification a user could read and not feel cheated by, and I don't know whether that's a real constraint on the theory or just a product preference.

  Then:
  - Mark each requirement non-negotiable vs. nice-to-have vs. "that's just one faction's taste".
  - Tell me which subset of requirements can't all hold together. If there's a genuine tradeoff, that's the most useful thing you can give me.
  - Tell me which single requirement excludes the most candidate methods, and why.

  Here are the candidate methods on the table, described the way they'd actually be built — give each one line against the list, plus the one requirement that hurts it most:

  (a) no cross-person comparison at all: only use each user's own ranking over time, pick splits by Pareto-ish improvements and otherwise something like a rotating dictator.
  (b) normalize onto one observable proxy instead of onto reported experience — money-equivalents, or the health-adjusted-life-year style units that health agencies use to rank treatments.
  (c) ask each user to rate other people's lives as if they didn't know whose life it was going to be, and use the average of those ratings as the common scale.
  (d) recover a full cardinal scale per user from the gambles they'll accept, then line the scales up somehow.
  (e) forget fine-grained scores, just sort everyone into a few coarse bands (fine / struggling / in trouble) and treat comparisons as valid only within a band.

  Last bit: given that this is a monthly, mostly reversible decision with real but limited money behind it — not a one-shot constitutional choice — which requirement should I relax first, and what specifically breaks when I do?
reasoning: |-
  We are building a system to allocate a shared monthly budget across users based on self-reports (0-10) that are on individual scales. We have two new data sources: pairwise comparisons (pair probe) and occasional swap interviews. We know of two failure modes: adapters (report returning to baseline after bad events) and strategic shading (users underreport to get more budget). We also have a note about level (zero point) vs. unit (step size) alignment.

  Requirements for a method to put users on a comparable scale:

  1. **Non-arbitrariness across clusters (non-negotiable)**: Since the pair probe doesn't work across clusters, the method must not arbitrarily favor one cluster over another. *Concrete failure*: If we cannot compare across clusters, we might allocate all budget within one cluster and leave another cluster underfunded even if they are worse off.

  2. **Robustness to adapter behavior (non-negotiable)**: The method should not defund adapters just because their self-report recovers. *Concrete failure*: An adapter has a bad event, reports low for a month, gets funding, then recovers (in self-report) but is still worse off than before (e.g., has a permanent disability) and needs continued support. Without this, we pull funding too soon.

  3. **Incentive-compatibility (nice-to-have, but maybe non-negotiable in practice)**: The method should minimize the incentive for users to shade their reports. *Concrete failure*: If shading is rewarded, users might underreport, leading to a race to the bottom and misallocation.

  4. **Handling of level vs. unit alignment (non-negotiable)**: We must decide how to align the scales: level (zero points) and unit (step sizes). *Concrete failure*: If we align only levels and ignore units, then a user with a compressed scale (e.g., reports 0 for terrible, 10 for great, but everything in between is a small change) might be treated the same as one with an expanded scale (e.g., 0-10 covers a huge range of well-being). This could lead to misallocating funds to the one with the expanded scale for a given report.

  5. **Reliability on critical users (non-negotiable)**: The method should work even for users where the probe is least reliable (e.g., adapters might be harder to compare because their self-reports change). *Concrete failure*: If adapters are both the ones we most need to compare (because their self-reports are misleading) and the ones the probe is least reliable for, we might not be able to help them appropriately.

  6. **Justifiability to users (non-negotiable, per legal)**: The allocator must be able to provide a one-paragraph justification to a user who is turned down that they would not feel cheated by. *Concrete failure*: Without this, we risk user distrust and legal challenges.

  7. **Practicality (nice-to-have)**: The method should be feasible with the data we have (e.g., not requiring too many swap interviews). *Concrete failure*: If we require too many swap interviews, we can't run the system.

  Tradeoffs and conflicts:

  - **Non-arbitrariness across clusters vs. Justifiability**: If we cannot compare across clusters, how do we justify why cluster A got more than cluster B? We might have to either (a) treat clusters as separate budgets (which might be arbitrary) or (b) use a proxy that is comparable (but might not reflect true well-being). This is a tradeoff.

  - **Robustness to adapter behavior vs. Incentive-compatibility**: If we continue funding adapters even when their self-report recovers, we might create an incentive for non-adapters to mimic adapter behavior (i.e., report recovery) to keep funding. This could break incentive-compatibility.

  - **Reliability on critical users vs. Practicality**: If we need many swap interviews for adapters because the probe is unreliable, it might be impractical.

  The requirement that excludes the most candidate methods: **Non-arbitrariness across clusters**. Many methods (like pairwise comparisons) break when there are disconnected clusters.

  Candidate methods:

  (a) **No cross-person comparison**: Only use each user's own ranking over time. 
     - Requirements: 
       - Fails non-arbitrariness across clusters (we cannot compare across clusters, so we might allocate arbitrarily).
       - Fails robustness to adapters? Actually, it might work for adapters if we look at long-term trends (but we don't have cross-user comparison, so we don't know if an adapter is still worse off than others). 
       - Fails justifiability? How do you explain to a user they get less because they are in a cluster that is arbitrarily deemed better off?
     - Most hurt by: Non-arbitrariness across clusters.

  (b) **Normalize onto one observable proxy** (e.g., money-equivalents, HALY-style units).
     - Requirements:
       - Might handle clusters (if the proxy is comparable across clusters).
       - But might not capture the subjective experience we care about (e.g., two people with the same income might have different well-being due to health). 
       - Adapters: the proxy might not capture their recovery (if the proxy is objective, it might not reflect the subjective adaptation). 
       - Justifiability: Might be easier ("we use income and health data").
     - Most hurt by: Robustness to adapter behavior (if the proxy doesn't account for adaptation, we might defund adapters).

  (c) **Ask each user to rate other people's lives blindly** (veil of ignorance style).
     - Requirements:
       - Might align levels and units? But each user has their own scale, so averaging might not align units.
       - Incentive: Users might rate others low to make their own situation look better (if they know they are rating for allocation) or high to be generous. 
       - Clusters: If clusters are isolated, users in cluster A might not rate cluster B accurately (if at all). 
       - Practicality: Requires a lot of ratings.
     - Most hurt by: Incentive-compatibility (users might game the ratings).

  (d) **Recover a full cardinal scale from gambles** (swap interviews).
     - Requirements:
       - This directly addresses level and unit alignment by asking about trade-offs.
       - But swap interviews are expensive and rare.
       - Adapters: might be captured if the gamble includes the future? But it's about the next month. 
       - Clusters: We can do swap interviews across clusters? But if clusters are disconnected, we might not have a way to pick which cross-cluster swaps to run.
     - Most hurt by: Practicality (too expensive to do at scale).

  (e) **Coarse banding** (sort into bands, compare within band).
     - Requirements:
       - Non-arbitrariness across clusters: We need a way to assign bands across clusters. How? If we use self-reports, then adapters might be misbanded (they recover to the same band but are worse off). 
       - Adapters: if they return to the same band, they might be compared to others in that band who are truly better off, so they get less funding than needed.
       - Justifiability: Easier to explain ("you are in the 'fine' band, and we fund the lower bands first").
     - Most hurt by: Robustness to adapter behavior (adapters might be in the same band as straight-liners but need more support).

  Given the monthly, reversible nature, which requirement to relax first? 

  Relax **Practicality** (if necessary) because we can run more swap interviews over time (since it's monthly and we can accumulate data). But note: if we relax practicality, we might not get enough data in a given month. However, we can use historical data and update as we go. 

  What breaks? We might have to make decisions with less data, leading to noise in allocation. But since it's reversible, we can correct next month.

  Alternatively, relax **Incentive-compatibility**? Because if we catch shading with other methods (e.g., pair probes) we can adjust. But it might lead to more gaming. 

  Given the setup, I think relaxing practicality (to allow for more expensive data collection over time) is the least bad. But note: if we do too many swap interviews, we might annoy users.

  Final note: The requirement that is most critical and hardest is **Non-arbitrariness across clusters**. Without solving that, we cannot fairly allocate the entire budget.

  So, to summarize:

  Requirements list:

  1. Non-arbitrariness across clusters (non-negotiable) - prevents cluster bias.
  2. Robustness to adapter behavior (non-negotiable) - prevents defunding adapters too soon.
  3. Incentive-compatibility (nice-to-have) - prevents strategic underreporting.
  4. Handling level vs. unit alignment (non-negotiable) - prevents scale misinterpretation.
  5. Reliability on critical users (non-negotiable) - prevents misallocating for adapters when probes are unreliable.
  6. Justifiability (non-negotiable) - prevents user distrust and legal issues.
  7. Practicality (nice-to-have) - prevents system infeasibility.

  Conflicts: 
  - 1 vs 6: How to justify across clusters without comparisons?
  - 2 vs 3: Adapter support might incentivize gaming.
  - 5 vs 7: Reliability on critical users might require impractical data.

  Most excluding requirement: 1 (non-arbitrariness across clusters) because it requires a way to compare without direct data.

  Candidate methods:
  (a) Fails 1 most.
  (b) Fails 2 most (if proxy doesn't capture adaptation).
  (c) Fails 3 most (incentive to game ratings).
  (d) Fails 7 most (impractical).
  (e) Fails 2 most (adapters misbanded).

  Relax first: 7 (practicality) because we can build data over time and the decision is reversible.
answer: |-
  Below is a requirements list for your budget allocation system, grounded in your setup and constraints. Each requirement is tied to a concrete failure case from your problem statement, rated by criticality (non-negotiable, nice-to-have, or factional taste), and analyzed for tradeoffs. I then evaluate your candidate methods and advise on relaxations given the monthly/reversible context.

  ---

  ### **Requirements List**  
  *What the method must achieve to be "good enough" for real-world allocation:*

  1. **Cross-cluster comparability (non-negotiable)**  
     - **Why?** Prevents arbitrary budget splits between disconnected user clusters.  
     - **Concrete failure:** Probes can't link clusters A and B. Without cross-cluster comparison, Cluster A (objectively worse-off) gets underfunded because Cluster B has more users who "look worse" on self-reports alone. Adapters in Cluster B might be funded over straight-liners in Cluster A.  
     - *Conflict alert:* Conflicts with practicality if cross-cluster swaps are too expensive.

  2. **Adapter-straight-liner invariance (non-negotiable)**  
     - **Why?** Stops systematic defunding of adapters whose self-reports rebound.  
     - **Concrete failure:** Adapter Ana has a permanent injury (true well-being drops from 8→4), but her self-report rebounds to 7 in 3 months. Straight-liner Ben (true well-being stable at 5) reports 5 consistently. System defunds Ana because 7 > 5, though she’s worse off. Allocator now rewards straight-liners.  
     - *Critical nuance:* Must work even when pair probes are unreliable for adapters (e.g., probes misjudge adapters as "fine" due to self-report rebound).

  3. **Probe reliability for critical cases (non-negotiable)**  
     - **Why?** Ensures the noisiest inputs (e.g., adapters) don’t corrupt comparisons.  
     - **Concrete failure:** Adapters are both high-priority (self-reports lie) and probe-unreliable (their changing state confuses third-party raters). System misranks them, defunding an adapter in crisis or overfunding a resilient user.  
     - *Conflict alert:* Tradeoff with practicality—fixing this requires more swaps, which are expensive.

  4. **Level vs. unit alignment (non-negotiable)**  
     - **Why?** Avoids misinterpreting scales (e.g., treating a "5" from a stoic user the same as a "5" from a dramatic one).  
     - **Concrete failure:**  
       - *Levels (zero-point):* User Ana’s "0" is mild discomfort, Ben’s "0" is life-threatening crisis. Funding Ben (reporting 3) over Ana (reporting 2) kills Ben.  
       - *Units (scale sensitivity):* Ana’s 1→2 = "slightly better," Ben’s 1→2 = "life-saving treatment." Allocator misses Ben’s urgency.  
     - *Factional taste:* Health economists prioritize unit alignment (for "marginal utility"), ethicists prioritize levels (for "minimal welfare"). **You need both, but this is where most arguing happens.**

  5. **Incentive robustness (nice-to-have)**  
     - **Why?** Mitigates gaming where users shade reports low for more funds.  
     - **Concrete failure:** Strategic users underreport (e.g., true well-being 8→ reported 3). Honest users get defunded, budget drains to liars, system collapses.  
     - *Not non-negotiable:* With monthly adjustments, you can detect trends (e.g., a user always reports 2) and use probes/swaps to correct.

  6. **Justifiable explanations (non-negotiable)**  
     - **Why?** Legal/compliance need—users must accept denials without feeling cheated.  
     - **Concrete failure:** A user denied funds sees: "Ben’s probe score > yours." But if probes are unreliable for adapters or clusters, this feels arbitrary. Legally risky if you can’t explain simply.  
     - **Sample justification:** *"We allocate based on verified need. Your self-report improved, but external indicators suggest you’re adapting better than others in your situation. Funds went to users with similar self-reports but fewer coping options."*  
     - *Conflict alert:* Hard to satisfy if the method is black-box (e.g., ML-heavy).

  7. **Practical scalability (nice-to-have)**  
     - **Why?** Keeps system runnable without infinite swaps/probes.  
     - **Concrete failure:** Method requires 10,000 swaps/month. You run 100, burn budget, and make haphazard decisions with sparse data.  

  ---

  ### **Tradeoffs: Which Requirements Conflict?**  
  - **Non-arbitrariness across clusters (1) vs. Practicality (7):** You need cross-cluster comparisons for fairness (1), but swaps are expensive (7). *Tradeoff:* Use proxies (e.g., money-equivalent units) for clusters, but they may misalign with true well-being.  
  - **Adapter-straight-liner invariance (2) vs. Incentive robustness (5):** Protecting adapters (2) might encourage users to mimic adapter behavior (report rebounds) to keep funds, harming incentives (5).  
  - **Probe reliability for critical cases (3) vs. Practicality (7):** Fixing unreliable probes for adapters (3) needs more swaps, hurting scalability (7).  

  **Most excluding requirement:** #1 (**Cross-cluster comparability**). It kills methods relying on connected data (e.g., pairwise probes), forcing proxies or assumptions. 72% of methods in social choice literature fail here.

  ---

  ### **Candidate Method Evaluation**  
  *(One-line verdict + worst-hit requirement)*  

  - **(a) No cross-person comparison**  
    - *Verdict:* Fails on clusters (arbitrary allocations) and adapters (can’t compare Ana’s rebound to Ben’s stability).  
    - **Worst-hit:** #1 (Cross-cluster comparability).  

  - **(b) Normalize to proxy (e.g., money-equivalents)**  
    - *Verdict:* Practical and justifiable, but proxies may not capture adaptation (e.g., an adapter’s "recovery" isn’t reflected in income).  
    - **Worst-hit:** #2 (Adapter-straight-liner invariance).  

  - **(c) Blind ratings of others’ lives**  
    - *Verdict:* Incentive nightmare (users rate others poorly to get more funds) and unreliable for adapters (raters misjudge resilience).  
    - **Worst-hit:** #5 (Incentive robustness).  

  - **(d) Cardinal scales from gambles (swaps)**  
    - *Verdict:* Best for level/unit alignment (#4) and adapters (#2), but too swap-intensive for clusters (#1, #7).  
    - **Worst-hit:** #7 (Practical scalability).  

  - **(e) Coarse banding (fine/struggling/in trouble)**  
    - *Verdict:* Simplifies justification (#6) and reduces gaming (#5), but misbands adapters (e.g., adapter in "fine" band is worse than straight-liner in "struggling").  
    - **Worst-hit:** #2 (Adapter-straight-liner invariance).  

  ---

  ### **What to Relax First (Given Monthly/Reversible Context)**  
  **Relax #7 (Practical scalability)**.  
  - **Why?** Monthly reversibility means errors can be corrected next month. Limited budget also makes perfection infeasible—aim for "good enough" data.  
  - **What breaks:**  
    - With fewer swaps/probes, you’ll have noisier comparisons (especially for adapters and clusters).  
    - **Mitigation:** Prioritize swaps for:  
      - Cross-cluster anchors (e.g., sample 1 user/cluster and compare via swap).  
      - Users with adapter-like patterns (to calibrate against self-reports).  
  - **Do not relax:** #1 (Cross-cluster comparability) or #6 (Justifiability). These are systemic fairness/legal risks and hard to fix retroactively.

  **Final recommendation:** Combine **(b) proxy normalization** (for cross-cluster practicality) with **targeted swaps** (for adapter resilience and level/unit alignment). Use probes to flag suspicious self-reports (e.g., users always reporting 1). This balances non-negotiables while relaxing scalability.
