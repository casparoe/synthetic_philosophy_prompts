  **Timeline for 90 minutes:**

  0-5 min: Introduction of the session and the first game (Part 1) in pairs.

  5-20 min: Part 1 activity. They work in pairs to find a mixture of A and B that beats C for Player 1 in every move of Player 2. We then discuss: why can't we use a pure action? and how mixtures allow us to eliminate C.

  20-40 min: Part 2. Introduce the 3x3 game. In pairs, they try to iteratively eliminate. We then gather and compare: what did they eliminate first? then what? They should see that after the first pass (eliminating Z for Player 2), then in the second pass they eliminate C for Player 1. If a group eliminated nothing, we help them. We discuss the nuance: when an opponent's action is eliminated, it becomes easier to eliminate an action of mine.

  40-60 min: Part 3. Form groups of three. They are Players 1,2,3. They play the game several times (say 5 times) and we ask: did anyone play action A for Player 1? Also, what were the payoffs? Then we ask: can you iteratively eliminate any action? They should find that none can be eliminated. Then we ask: is there a stable outcome? and show them (B,Y,P) and why it is stable.

  60-75 min: Vocabulary and definitions. We introduce: 
  - strict dominance by a mixed strategy.
  - iterated elimination of strictly dominated strategies (with mixed strategies) and why it is order-independent.
  - the difference between the set of surviving strategies and the support of Nash equilibrium.

  75-90 min: Debrief: map the activities to the concepts. 
  - In the first activity, they encountered an action dominated only by a mixed strategy. 
  - In the second, they saw that iteration might require multiple passes because after an opponent's action is removed, an action of mine becomes dominated. 
  - In the third, they saw that not every surviving action is played in equilibrium.

  If 20 minutes behind, cut Part 3 short: instead of playing, just analyze the game quickly. Or skip the in-group and do it as a whole-class example. 

  Predictable issues:

  - Someone might conflate being dominated with not being a best response to the equilibrium mixture. We will clarify: dominance is about being beaten by something that is better against every opponent move, not on average.
  - Someone might conclude that the surviving set is a prediction: we will clarify that it is the set that is not ruled out by rationality and common knowledge, but it might include actions that are not played in equilibrium.
  - Objection that nobody randomizes: we can say that even if players do not actually randomize, the possibility of mixing can help us eliminate actions that are not rationalizable.
  - What does this have to do with what the other player is thinking? In iterated elimination, we assume common knowledge of rationality, and we eliminate actions that would not be played because they are dominated, and this is known by all, and so on.

  Frank statement of what the activity cannot reproduce:
  - The activity does not explicitly model the epistemic conditions (common knowledge of rationality) that justify iterated elimination. We will have to state that in words.
  - In the mixed dominance, the activity does not bring out the fact that the mixture used to dominate may depend on the set of opponent strategies, and that we are not assuming independent randomization by the opponent. We are checking against every pure strategy of the opponent, not against their mixtures. This is why the condition is for every opponent action, not on average. We will have to state that.

  This is a long session, but it covers the three learning outcomes.
answer: |-
  ### Session Design: Iterated Elimination and Mixed Dominance

  **Overview:**  
  A 90-minute session structured in three modules, each focusing on a key concept through student-driven activities. Vocabulary and definitions are introduced only in the last 15 minutes. Students work in pairs (Part 1), pairs (Part 2), and groups of three (Part 3). Payoffs are chosen for easy arithmetic verification.

  ---

  ### Part 1: Strict Dominance by a Mixed Strategy (Not Pure)  
  **Game & Payoffs (Player 1: A, B, C; Player 2: X, Y):**  
  ```
          X       Y
  A   4, 0    0, 5  
  B   0, 5    4, 0  
  C   1.5, 2  1.5, 2
  ```  
  - **Action C** is strictly dominated by a mixture of A and B, but not by A or B alone.  

  **Activity (15 mins, pairs):**  
  - **Roles:** Student A (Player 1), Student B (Player 2).  
  - **Mechanic:**  
    - Provide bags, red tokens (A), blue tokens (B).  
    - Player 1 constructs a mixture (e.g., 5 red + 5 blue for 50-50).  
    - Player 2 chooses X or Y.  
    - **Verification:** For *each* opponent action (X and Y), the mixture's expected payoff must be > 1.5. Use arithmetic:  
      - Against X: `(p * 4) + ((1-p) * 0) > 1.5`  
      - Against Y: `(p * 0) + ((1-p) * 4) > 1.5`  
    - Students test mixtures (e.g., 50-50: 2 > 1.5 for X and Y). If a mixture fails (e.g., 2 red + 1 blue fails against Y: 4/3 ≈ 1.33 < 1.5), they adjust.  
  - **Goal:** Show C is dominated by mixtures (e.g., p ∈ (0.375, 0.625)) but not by pure A or B.  

  ---

  ### Part 2: Iterated Elimination (Order Matters)  
  **Game & Payoffs (Player 1: A, B, C; Player 2: X, Y, Z):**  
  ```
          X        Y        Z
  A   4, 0     0, 5     0, 0  
  B   0, 5     4, 0     0, 0  
  C   1.5, 2   1.5, 2   5, 1
  ```  
  - **Z** is strictly dominated by any mixture of X and Y (p ∈ (0,1)). After eliminating Z, **C** is dominated by a mixture of A and B.  
  - **Order Independence:** Strict dominance with mixed strategies is order-independent. Groups stuck due to arithmetic errors.  

  **Activity (20 mins, pairs):**  
  - **Task:** Eliminate strictly dominated actions in passes. Record order and surviving sets.  
  - **Steps:**  
    1. **First pass:** Z is dominated by X and Y (e.g., 50-50 mixture: against A: 2.5 > 0, B: 2.5 > 0, C: 2 > 1). Eliminate Z.  
    2. **Reduced game (after Z gone):**  
       ```
              X       Y  
       A   4, 0    0, 5  
       B   0, 5    4, 0  
       C   1.5, 2  1.5, 2
       ```  
       C is dominated by A and B (e.g., 50-50: 2 > 1.5 against X and Y). Eliminate C. Surviving: {A, B} for P1, {X, Y} for P2.  
  - **Nuance:**  
    - Deleting opponent’s action (Z) removes contingencies, making further deletion *easier*.  
    - Deleting own action (C) removes ingredients for dominating others, making deletion *harder*.  
  - **If a group gets stuck:**  
    - **Scenario:** "We deleted C first, now can’t eliminate anything."  
    - **Response:** Check arithmetic. In the full game, C isn’t dominated (against Z, C=5 > mixture of A/B=0). Must eliminate Z first.  
  - **Weak Dominance (if time, 2 mins):**  
    - Weak dominance may be order-dependent. E.g., eliminating weakly dominated actions in different orders can yield different results. Strict dominance is safer.  

  ---

  ### Part 3: Survival Without Support  
  **Game & Payoffs (Three Players):**  
  - **Player 1 (A, B)**, **Player 2 (X, Y)**, **Player 3 (P, Q)**. Payoffs:  
  | Profiles         | Payoffs (P1, P2, P3) |  
  |------------------|----------------------|  
  | A, X, P       | 0, 0, -1          |  
  | A, X, Q       | -1, 0, 1          |  
  | A, Y, P       | 0, 0, -1          |  
  | A, Y, Q       | -1, 0, 1          |  
  | B, X, P       | 0, 0, 1           |  
  | B, X, Q       | 0, 0, -1          |  
  | B, Y, P       | 1, 1, 1           |  
  | B, Y, Q       | 0, 0, -1          |  
  - **A (Player 1)** survives iterated elimination but has 0 probability in all Nash equilibria (NE).  

  **Activity (20 mins, groups of three):**  
  - **Roles:** Students as P1, P2, P3. Play 3 rounds.  
  - **Observe:** No group plays A (P1 gets -1 if A and Q; B leads to 0 or 1).  
  - **Task:** Run iterated elimination:  
    - No action is strictly dominated:  
      - A: Payoffs 0 (X,P), -1 (X,Q), 0 (Y,P), -1 (Y,Q) — not dominated by B (e.g., B=0 at (X,P) equals A).  
      - Others: Similar (no strict dominance).  
    - **NE Check:** Only NE is (B, Y, P):  
      - P1: Deviating to A gives ≤0 (worse).  
      - P2: Deviating to X gives 0 (worse than 1).  
      - P3: Deviating to Q gives -1 (worse than 1).  
      - A is never played.  
  - **Goal:** Iterated elimination gives an *upper bound* (A survives), but NE refines it.  

  ---

  ### Timeline (90 mins)  
  1. **Part 1 (15 mins):** Mixture dominance.  
  2. **Part 2 (20 mins):** Iterated elimination.  
  3. **Part 3 (20 mins):** Survival without support.  
  4. **Vocabulary & Debrief (20 mins):**  
     - Define mixed dominance, iterated elimination, and NE support.  
     - Map activities:  
       - Part 1: "You constructed mixtures to dominate an action—this is *strict dominance by a mixed strategy*."  
       - Part 2: "Deleting Z first made C deletable—this is *iteration* with mixed dominators."  
       - Part 3: "A survived elimination but not NE—this shows the procedure gives a *rationalizability* upper bound."  
  5. **Q&A (15 mins).**  
  - **If 20 mins behind:** Skip Part 3 gameplay (analyze as whole class).  

  ---

  ### Predictable Issues & Responses  
  1. **"Dominance ≠ best response to equilibrium":**  
     - Clarify: Dominance is "beaten everywhere," best response is "beaten on average."  
  2. **"Surviving set = prediction":**  
     - Correct: It’s what *could* be played, not what *will* (e.g., Part 3’s A survives but isn’t played).  
  3. **"No one randomizes":**  
     - Response: Randomization is a tool for elimination; realism isn’t the point.  
  4. **"What about opponents’ thoughts?":**  
     - Explain: Iteration assumes common belief in rationality—players know others won’t play dominated actions.  

  ### What the Activity Can’t Reproduce (Say Aloud)  
  - **Epistemic basis:** Iterated elimination assumes *common knowledge of rationality*—all players are rational, all know it, all know they know it, ad infinitum.  
  - **Correlation of beliefs:** The procedure assumes players believe opponents’ strategies are *independent* (no correlation). Mixed dominance checks each pure opponent action separately, not correlated profiles.  

  --- 

  **Final Note:** All arithmetic is verifiable (e.g., 50-50 mixtures work in Part 1 and 2). Part 3’s NE is explicit. The session emphasizes discovery before labeling.
