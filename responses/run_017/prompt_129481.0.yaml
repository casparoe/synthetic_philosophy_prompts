prompt: |-
  I keep going round in circles about something and I would be grateful for your help in getting clear. I am not an academic — I left school at eighteen and now run a small market garden with my brother — but I have been reading about insect sentience in my own time, and the argument from sheer numbers has rather rattled me: billions upon billions of creatures, each with only a small chance of mattering at all, and apparently the product is still enormous. I cannot tell whether that is supposed to change what I do on Monday morning or whether I am being taken for a ride. What I trust more than the arguments is my own reaction to concrete cases, so here are my verdicts, and I would like to know what principle, if any, they add up to. (1) A wasps' nest in the shed doorway the children use — I knocked it down at dusk. No qualms. (2) Slugs on the brassicas: I use pellets, though I have switched to the ferric phosphate kind since it was barely dearer. Thousands of deaths a season. Slight unease, but fine; I will pay a small premium for a kinder method, though not a large one. (3) Aphids: I spray them with soapy water and feel essentially nothing — which now strikes me as odd, since a soapy film is presumably not a pleasant way to go and there are vastly more aphids than slugs. (4) A neighbour poured boiling water over an ants' nest in his drive. I thought that was callous and said so; he pointed out that I kill far more insects than he does with my sprays; I had no answer, but the verdict stands — fine for me, not fine for him. (5) Bees: I keep two hives and I would feel genuinely bad about destroying a colony, far worse than about the aphids. My brother says that is mere charisma, and that a bee is not obviously a better candidate than an ant. I suspect he is right and I do not want to surrender the verdict. (6) Lobsters: I do not eat them, and I would be uneasy watching one boiled, though I am not about to campaign about it. (7) Nematodes: someone told me there are millions in a square metre of my soil, so that even at a one-in-a-million chance each, digging a bed is the worst thing I do all year. I think that is absurd. I dig, with no qualms whatsoever. (8) Chickens: I am as certain as I am about anything here, I pay roughly double for genuinely better eggs, and I would pay perhaps twenty pounds to spare one bird a bad year. (9) On exchange rates I am unreliable: I would pay nothing to spare the aphids on my brassicas, a pound or two for something that cleared them without killing them, and for the ants I genuinely cannot say. If pressed I would trade a chicken's bad year for an indefinitely large number of aphids without blinking, and then at some point the willingness stops feeling honest and starts feeling like a refusal to do arithmetic. (10) I read that insect protein is increasingly fed to farmed fish, that some people call this a moral catastrophe on account of the numbers, and that others call it a fix because it displaces fishmeal. I have no settled verdict there at all.

  Three things people have said to me make it worse rather than better. First, a friend argues that my "one in a thousand" is not the sort of number I am allowed to multiply by millions, because it is not the output of any method with a track record — it is a shrug dressed up as a probability — whereas my confidence about the chicken is. I take the point but it sounds conveniently like an excuse. Second, the same friend says that if I do not know whether an ants' nest contains fifty thousand subjects or a single colony-level subject — or, at a stretch, both — then I cannot simply take an expected number and multiply, because those candidate subjects overlap and I would be counting the same underlying thing two or more times over. That seems to bite, and I do not know how to do the sum properly once I have accepted it. Third, and this is what I cannot shake: whatever test I use for "a candidate subject out there" looks as though it ought to apply inside my own head. A friend described to me a theory on which any system that integrates information is conscious to some degree, and if I let a test like that multiply subjects cheaply in the garden, I do not see why it does not multiply them in my skull, and if it does not, I want the principle that draws the boundary — I would rather not end up totalling probable subjects inside my own brain. There is also something she mentioned about flies resolving flicker far faster than we do, so that if an insect's experience runs faster in time, an hour of insect pain contains more experience than an hour of ours; she thinks that adds another multiplier, and I cannot decide whether suffering should be counted per minute or per moment of experience, though I suspect this is where the numbers argument quietly gets most of its real force.

  The rule I have been feeling my way towards is something like: multiply only probabilities that have been earned by evidence of the same kind as the evidence that convinces me about chickens; never add candidate subjects that overlap; count counterfactual differences rather than grand totals, so that what matters about insect farming is what it replaces; and take the cheaper-in-every-sense kinder option where one exists. Does that survive my own verdicts, and where exactly does it break? Please state the principle precisely, tell me which case motivates each clause, and be plain about which of my verdicts it cannot accommodate — if I have to give something up I would sooner give up my calm about the aphids than my contempt for the boiling water, but I want to know what that costs me, and whether the bees have to go too. And then I would like to know what your principle says about cases I have not decided: the parasitic wasps I buy as biological control, whose larvae eat caterpillars alive from the inside and about which I currently feel nothing, which seems strange in light of all this; a fast-acting treatment for the same pest that costs a quarter more than what I use now, and how much that quarter is allowed to matter; and whether, on your account, I ought to stop digging my beds altogether.
reasoning: |-
  Okay, let me approach this thoughtfully. The user presents a deeply personal ethical dilemma rooted in practical farming life and insect sentience, with a clear request for logical consistency across their specific moral intuitions. 

  First, I notice the core tension: their concrete moral verdicts (e.g., indifference to aphids but contempt for boiling ants) clash with abstract numerical arguments about insect suffering. The "billions times tiny probability equals huge moral weight" idea clearly troubles them, but they distrust academic detachment. Their self-described "unreliable exchange rates" reveal admirable intellectual honesty.

  The three complicating factors they mention are significant hurdles:
  1. The legitimacy of assigning probabilities to subjective experiences
  2. The ontological puzzle of overlapping subjects (individual vs colony consciousness)
  3. The recursive fear of applying consciousness criteria to their own brain

  Their proposed rule has four sensible pillars, but needs stress-testing against their own cases. For example, the "no overlapping subjects" clause might justify their nematode indifference but could undermine their bee sympathy if hives are superorganisms. Their aphid calm survives the rule (due to lack of chicken-like evidence), but their ant-boiling contempt doesn't - that inconsistency needs addressing.

  The unresolved cases they mention (parasitic wasps, costlier pesticides) are perfect for applying the refined principle. For parasitic wasps, the "counterfactual differences" lens suggests focusing on whether buying them reduces worse suffering (e.g., chemical pesticides). For cost, the "cheaper-in-every-sense" clause permits small premiums but draws the line at economic viability - a practical limit they've already accepted with slug pellets.

  Most crucially, their fear of infinite subjects within their own brain is valid but resolvable. Information integration theory (IIT) isn't a runaway multiplier - its mathematical structure prevents fractal subdivision of consciousness. This should relieve their anxiety about self-application.

  Throughout, I'll maintain their pragmatic tone while honoring their demand for precision. Their willingness to sacrifice aphid-calm but defend ant-dignity reveals priorities I should respect: concrete cruelty matters more than abstract calculus. The bees stay - not from charisma, but because their verdict reflects earned conviction.
answer: |-
  Your struggle is profound and intellectually honest—exactly the kind of friction that reveals where ethics meets practical life. Your verdicts aren't inconsistent; they map a *gradient* of moral concern shaped by evidence, context, and practical limits. Below is a precise principle distilled from your cases, followed by its application to your unresolved dilemmas.  

  ### The Principle: **Contextual Moral Prioritization (CMP)**  
  > *"Assign moral weight to beings proportional to the strength of evidence for their capacity to suffer* **of a kind comparable to vertebrates we confidently protect**; *discount overlapping or ontologically ambiguous subjects; prioritize interventions that reduce suffering at negligible cost; and focus on counterfactual harm reduction, not absolute numbers."*  

  ---

  ### **How Each Clause Resolves Your Cases**  
  1. **Evidence-Bound Weighting**  
     - *Clause:* Moral weight requires evidence akin to chicken-level sentience (e.g., behavioral complexity, neural correlates).  
     - *Motivated by:* Chickens (8) > Bees (5) > Lobsters (6) > Slugs/Aphids (2,3).  
     - *Accommodates:*  
       - Aphid indifference: No robust evidence they suffer like chickens (e.g., minimal nociception, no pain memory).  
       - Lobster unease: Stronger evidence of sentience (e.g., complex avoidance behaviors, opioid receptors).  
     - *Breaks at:* Your ant-boiling contempt (4). *But this is a feature:* Your verdict reflects intuitive ethics, not evidence. CMP *requires* you to either:  
       - (a) Drop the contempt (ants lack vertebrate-like evidence), or  
       - (b) Admit non-evidential factors (e.g., empathy for visible distress).  

  2. **No Overlapping Subjects**  
     - *Clause:* Never multiply "candidates" if they might describe the same entity (e.g., ant colony vs. individual ants).  
     - *Motivated by:* Ants (4) and Nematodes (7).  
     - *Accommodates:* Nematode calm—treating soil as a "system" avoids absurd sums.  
     - *Resolves "Friend #2":* You can't sum ambiguous subjects. Default to the simplest ontology (e.g., "colony" for ants) unless evidence demands otherwise.  

  3. **Counterfactual Harm Focus**  
     - *Clause:* Judge acts by what they *change* (e.g., insect farming vs. fishmeal), not total beings affected.  
     - *Motivated by:* Insect protein dilemma (10).  
     - *Accommodates:* Slug pellets—ferric phosphate is a *net reduction* in harm vs. alternatives.  

  4. **Negligible-Cost Kindness**  
     - *Clause:* Choose demonstrably kinder methods *only* when cost/difficulty is trivial.  
     - *Motivated by:* Slugs (2)—paying "a small premium" but not a large one.  
     - *Accommodates:* Wasp nest removal (1)—kinder methods (relocation) are high-effort, so destruction is permissible.  

  ---

  ### **Where CMP Challenges Your Verdicts**  
  - **Ants vs. Aphids Contradiction (3,4):**  
    CMP forces a choice: If ants lack evidence of chicken-like suffering, boiling them is no worse than spraying aphids. To keep your contempt, you must appeal to *non-evidential factors* (e.g., "boiling feels cruel"). **Cost:** Logical consistency about insects.  
  - **Bees (5):**  
    Your sympathy survives! Bees show complex cognition (e.g., communication, emotion-like states). Evidence justifies rating them closer to chickens.  
  - **Exchange Rates (9):**  
    CMP agrees: Willingness-to-pay should align with evidence strength. Aphids → £0. Chickens → £20. Ants → £0 unless new evidence emerges.  

  ---

  ### **CMP on Unresolved Cases**  
  1. **Parasitic Wasps (biological control):**  
     - *Evidence:* Wasps hunt hosts deliberately (suggesting goal-directedness), but larvae eating caterpillars alive may not imply suffering *in the caterpillar* if it lacks nociception.  
     - *CMP Verdict:* Permissible. Counterfactually, this likely reduces pesticide use (greater harm). No strong evidence caterpillar suffering meets vertebrate threshold.  

  2. **Fast-Acting Pest Treatment (25% costlier):**  
     - *Negligible-Cost Clause:* If the cost difference is trivial *to you* (e.g., £5/month), adopt it. If it threatens farm viability, reject it. Your slug-pellet logic applies: kindness within practical limits.  

  3. **Digging Beds (Nematodes):**  
     - *Overlap + Evidence Clauses:* Soil nematodes show no sentience evidence (no central nervous system, simple reflexes). Treat soil as an ecosystem, not a sum of individuals.  
     - *CMP Verdict:* Dig guilt-free.  

  ---

  ### **Silencing the "Three Worries"**  
  1. **"Shrug probabilities" (Friend #1):**  
     CMP agrees—never multiply vague probabilities. Weighting requires *earned* evidence (e.g., chicken pain studies vs. aphid speculation).  

  2. **"Overlapping Subjects" (Friend #2):**  
     Addressed—reject double-counting. Default to the simplest ontology (e.g., ant colony > individuals).  

  3. **"Consciousness in Your Brain":**  
     Integrated Information Theory (IIT) *does not* multiply subjects in your head. IIT identifies a *single* conscious entity per integrated system (your brain). Flies' faster perception *does not* multiply suffering—intensity/duration matter, not "moments." A fly's 10-second struggle isn't "longer" subjectively; its brain processes signals faster, but this doesn't scale moral weight linearly.  

  ---

  ### **The Core Tradeoff**  
  To keep your ant-boiling contempt, you sacrifice strict evidence-based consistency. But this is defensible: Ethics isn't pure math. Your intuition might reflect a heuristic—*"avoid visibly brutal methods when alternatives exist"*—which CMP can absorb as a practical corollary.  
    
  **Final Verdict:** Your calm about aphids is justified. Your bees stay. Dig your beds. Pouring boiling water on ants *is* permissible under CMP, but if you reject this, own the inconsistency as empathy outweighing epistemology. Your moral compass is sound; it just needs a map to navigate the numbers.
