answer: |-
  Your unease is profound and justified—retroactive deeming exposes fractures in the standard speech-act taxonomy. Let's dissect this systematically, with confidence ratings (1-10, 10=highest) and flagged uncertainties.

  ### Core Analysis: Deeming as a Hybrid Speech Act
  1. **Direction of Fit: Bidirectional with Temporal Asymmetry**  
     Deeming has *dual* fit:  
     - **World-to-Word (Declaration Aspect)**: It creates a *new institutional fact*: "As of now, the Nightingale's registration status *officially* dates back to March." (Confidence: 9)  
     - **Word-to-World (Assertion Aspect)**: It presents this fact *as if* it were discoverable ("the record now reflects this"). But crucially, it's *not* asserting a past event—it’s constructing a *retroactive status*. (Confidence: 8)  
     *Why not collapse into assertion?* Assertions can be false; deemed truths are *institutionally* incorrigible once enacted. Saying "The Nightingale was registered in March" *without* the deeming authority is truth-apt but possibly false. The deeming act *makes* it institutionally true.  

  2. **Content: Status vs. Event**  
     You’re right—distinguishing status from event is key, but it doesn’t collapse into assertion because:  
     - The status ("being retroactively registered") *did not exist* prior to the utterance. It’s not describing an independent state of affairs; it *creates* a normative reality anchored in the past. (Confidence: 9)  
     - Example: Before the act, "The Nightingale was registered in March" was false (or indeterminate). After, it’s true *by fiat*, but *only* within the institutional framework.  

  3. **Bootstrapping & Regress: The Social Ontology Anchor**  
     - **The Regress-Stopper**: De facto recognition *is* doing the work. Austin’s "securing uptake" meets Searle’s "collective intentionality." The charter’s authority derives from ongoing practice: guild members *treat* it as binding, and their compliance *reproduces* the institution. The regress stops at socially sustained "status functions" (Searle). (Confidence: 8)  
     - **Uptake’s Critical Role**: If everyone ignores the Harbormaster:  
       - *Illocutionary Failure*: The act *requires* uptake to exist as a valid deeming. Unlike a promise (which is illocutionarily complete even if ignored), declarations depend on institutional recognition. No uptake → no institutional fact created. (Confidence: 7)  
       - *Perlocutionary Irrelevance*: Ignoring her may have consequences (e.g., fines), but the registration *itself* isn’t enacted. This is *not* perlocutionary (which concerns consequential effects, like persuasion); it’s illocutionary collapse.  

  ### **Least Confident Claim**  
  **That uptake failure *always* causes illocutionary collapse** (Confidence: 6).  
  - Counterargument: If the charter specifies "the Harbormaster’s utterance alone suffices," could the act succeed *without* immediate audience uptake? (e.g., if recorded in an official log).  
  - Why I lean against this: Even "automatic" validity relies on background institutions upheld by collective practice. If *everyone* ignores the system (e.g., revolution), the log entry is just ink.

  ### Resolution: Deeming as "Status-Generating Retroactive Declaration"
  - **What it is**: A specialized institutional act blending:  
    a) *Declarative force* (creating new status),  
    b) *Retroactive grounding* (backdating the status’s validity),  
    c) *Assertive guise* (masking the creation as discovery).  
  - **Why unique?** Its retroactivity distinguishes it from standard declarations (which fix *present/future* states). It exploits institutional temporality—the "past" it references is a *normative past*, not the causal past.  

  ### Practical Implications
  - **In your toy case**: If guild members ignore the Harbormaster, the Nightingale is *not* registered. Uptake is constitutive.  
  - **Real-world parallels**: Legal fictions ("deemed domicile"), antedated contracts, or pardons reveal the same structure. Their "truth" is *institutional*, not historical.  

  **Conclusion**: Deeming isn't a primitive illocutionary act but a complex, institutional hybrid. Its power—and paradox—stems from social ontology: we collectively agree to treat words as rewriting history *for normative purposes*. The bootstrapping regress halts at our shared practices, not at a foundational utterance.
