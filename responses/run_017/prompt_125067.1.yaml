prompt: |-
  I'm a neurointensivist at a tertiary hospital, and for the last three years I've chaired the committee that signs off on every determination of death by neurological criteria here and that writes the protocol for donation after the circulatory determination of death. Our protocol was not designed; it was accreted, one controversy at a time. We accept whole-brain death as death. We accept death after two to five minutes of arrested circulation, which is a period we all privately know was chosen because organs tolerate it, not because anything happens at minute two. We decline to treat patients in a permanent vegetative state as dead, even though a good many philosophers would say we are being inconsistent. And we have kept a brain-dead pregnant patient on ventilator and hormonal support for weeks, which under the account we officially endorse — death as the irreversible loss of the organism's capacity to function as an integrated whole — looks very much like our continuing to treat a corpse whose body is still doing the things we said a body stops doing at death. Two things have now forced the issue. First, our jurisdiction amended its determination-of-death statute so that a family's religious objection to neurological criteria must be accommodated whenever the patient can be physiologically maintained for a defined window, which means the same patient can be dead for one family and not for another. Second, a company is about to open a trial here of an extracorporeal somatic support platform that can, after total brain destruction has been confirmed by every test we have, maintain thermoregulation, hemodynamic stability, wound healing and — through a closed-loop hormonal controller — growth and even gestation, for many months.

  What I want from you is a decision procedure my committee can actually run, not an essay. Assume the people running it are a rotating panel of three — an intensivist, a neurologist, and a lay member — who have an hour and no training in philosophy. The procedure should begin by forcing us to say out loud which account of death we are applying, since I have come to think most of our arguments are really arguments about that, and it should then apply whichever account we named consistently, including to the cases where consistency is expensive. For each step, tell me what would count as a sufficient answer and what would count as no answer at all; tell me where the procedure stops with a firm no; tell me where it stops and hands the decision to a person because the remaining question is one of values rather than fact; and tell me where it must stop and report that the account we chose simply gives no determinate verdict here. It should issue one of a small fixed set of outputs — death may be declared, death may not be declared, death may be declared but donation may not proceed, or escalate — and it should be honest about which of its steps are judgment calls wearing the costume of procedure.

  Then run it on three real shapes of case that come to us. One: a patient declared dead by circulatory criteria, with the family's consent, where the surgical team wants to use thoracoabdominal normothermic regional perfusion with an aortic occlusion balloon to protect the abdominal organs, a maneuver whose entire point is to ensure the brain is not reperfused, and where the worry in the room is whether taking that precaution shows that we do not really believe the patient is dead. Two: a patient at nineteen weeks of gestation with confirmed whole-brain destruction, whose family wants support continued on the new somatic platform until the fetus is viable, and where the committee is divided between those who think we are maintaining a dead pregnant woman and those who think the platform has falsified the claim that the organism as a whole has ceased to function. Three: a patient with catastrophic bilateral hemispheric destruction but a preserved brainstem, sleep-wake cycles and spontaneous respiration, whose family has requested donation and asked us why this person is not dead when the person in the next bed is. I would like at least one of these three to come out somewhere I will not like, and I would like you to say plainly which one and why. Finally, tell me what the procedure cannot do — where it will misfire, which questions it should refuse to answer, and whether the thing I actually need is a procedure at all.
reasoning: |-
  We are designing a decision procedure for the determination of death by a committee. The procedure must be run by a rotating panel of three (an intensivist, a neurologist, and a lay member) in about an hour, with no philosophical training. The procedure must:
  1. Force the committee to explicitly state which account of death they are applying (e.g., whole-brain death, circulatory death, higher-brain death).
  2. Apply that account consistently, even when it leads to uncomfortable or expensive outcomes.
  3. Output one of the following:
     a. Death may be declared.
     b. Death may not be declared.
     c. Death may be declared but donation may not proceed.
     d. Escalate (to a higher authority, such as an ethics committee or legal counsel).

  Steps must specify:
  - What counts as a sufficient answer and what counts as no answer at all.
  - Where the procedure stops with a firm "no".
  - Where it stops and hands the decision to a person (values decision).
  - Where it stops and reports that the chosen account gives no determinate verdict.

  The procedure should be honest about which steps are judgment calls disguised as procedure.

  We'll design the procedure in steps, and then run it on the three cases.

  **Step-by-step Decision Procedure:**

  **Step 1: Choose the Account of Death**
  - **Prompt:** "Which account of death is this committee applying for this determination? Choose one:
    (a) Whole-brain death (irreversible cessation of all functions of the entire brain, including the brainstem).
    (b) Circulatory death (irreversible cessation of circulatory and respiratory functions).
    (c) Higher-brain death (irreversible loss of higher brain functions, including consciousness and cognition)."
  - **Sufficient answer:** Selection of (a), (b), or (c). The committee must explicitly choose one.
  - **No answer at all:** Refusal to choose, or choosing an account not listed (e.g., "permanent vegetative state" without being (c)).
  - **Judgment call:** This step is a value choice. The committee must decide which standard they are using. The procedure does not dictate which account to choose, but forces the choice to be explicit.
  - **Next:** Proceed to Step 2.

  **Note:** The committee may not change the account during the procedure for the same patient. Consistency is key.

  **Step 2: Apply the Chosen Account to the Patient's Condition**
  - **Prompt:** "Based on the chosen account, assess the patient's condition with the following questions:"
    - If the chosen account is (a) Whole-brain death:
      - "Has there been an irreversible cessation of all functions of the entire brain, including the brainstem, as confirmed by standard clinical tests and/or ancillary tests (e.g., EEG, cerebral blood flow)?" 
    - If the chosen account is (b) Circulatory death:
      - "Has there been an irreversible cessation of circulatory and respiratory functions for at least [X] minutes (where [X] is the duration specified by protocol, e.g., 2-5 minutes)?" 
      - Note: The irreversibility must be judged in the context of the patient not being resuscitated (i.e., no attempt to restart circulation will be made).
    - If the chosen account is (c) Higher-brain death:
      - "Has there been an irreversible loss of higher brain functions (cerebral cortical function) such that the patient has permanently lost consciousness and cognition, even if brainstem functions remain?"
  - **Sufficient answer:** 
    - For (a) and (c): The committee must agree that the clinical criteria for the chosen account are met (based on medical evidence).
    - For (b): The committee must agree that circulatory and respiratory functions have ceased and have been absent for the specified time, and that the cessation is irreversible (because no resuscitation is planned).
  - **No answer at all:** Inability to agree on the medical facts, or if the required tests have not been performed.
  - **Judgment call:** The assessment of medical facts (e.g., interpreting tests) is a medical judgment. However, the criteria are based on standard medical practice.
  - **Where it stops:**
    - If the answer is "yes", proceed to Step 3.
    - If the answer is "no", then output: "Death may not be declared." (Stop here.)
    - If the committee cannot answer (e.g., tests are equivocal), then output: "The account gives no determinate verdict. Escalate." (Stop and escalate.)

  **Step 3: Consider the Implications for Organ Donation and Other Interventions (if applicable)**
  - **Prompt:** "If death is declared under the chosen account, are there any ongoing interventions or conditions that might contradict the account? Specifically, consider:
    - For whole-brain death: Are there any somatic functions (e.g., hormonal regulation, wound healing, gestation) being maintained artificially that might suggest integration at the organismal level?
    - For circulatory death: Are there any attempts to restore circulation that have been successful? Or, are there interventions (like regional perfusion) that might restore circulation to some parts?
    - For higher-brain death: Are there brainstem functions (like spontaneous respiration) that are being supported and that might suggest the organism is still functioning as a whole?"
  - **Sufficient answer:** The committee must consider whether the interventions in place are consistent with the chosen account of death. They must answer whether the interventions change the determination of death under the chosen account.
  - **No answer at all:** Refusing to consider the interventions, or if the interventions are so novel that they challenge the account (e.g., the somatic support platform).
  - **Judgment call:** This step requires interpretation of the account in light of technology. It is a judgment call on whether the technology undermines the claim of death under the chosen account.
  - **Where it stops:**
    - If the committee unanimously agrees that the interventions do not contradict the chosen account (e.g., artificial support is just preserving tissues, not restoring the function that defines life under the account), then proceed to Step 4.
    - If the committee finds that the interventions do contradict the account (e.g., the somatic platform allows the body to function in an integrated way without the brain), then output: "Death may not be declared." (Stop here.)
    - If the committee is divided or unsure, then output: "The account gives no determinate verdict. Escalate." (Stop and escalate.)

  **Step 4: Check for Legal and Policy Constraints**
  - **Prompt:** "Are there any legal or policy constraints that would prevent declaring death or proceeding with donation? For example:
    - A religious objection (if applicable) that must be accommodated by law?
    - Any specific contraindications to donation (if donation is being considered)?"
  - **Sufficient answer:** The committee must consider the legal and policy environment (e.g., the new law about religious objections, or rules about donation after circulatory death).
  - **No answer at all:** Ignoring known legal constraints.
  - **Judgment call:** This step requires knowledge of the law and hospital policy. The lay member may be particularly helpful here.
  - **Where it stops:**
    - If there are no constraints, output: "Death may be declared." (And if donation is planned, it may proceed unless there are other reasons to halt donation.)
    - If there is a legal requirement to accommodate a religious objection (and such an objection has been raised) then output: "Death may be declared but donation may not proceed." (Stop here.)
    - If there are other legal constraints that prevent declaring death (e.g., the law does not recognize the chosen account in this circumstance), then output: "Death may not be declared." (Stop here.)
    - If the legal situation is unclear, output: "Escalate." (Stop and escalate.)

  **Final Outputs:**
  - Death may be declared.
  - Death may not be declared.
  - Death may be declared but donation may not proceed.
  - Escalate.

  Now, we run the procedure on the three cases.

  ---

  **Case 1: Patient declared dead by circulatory criteria, with family consent. Surgical team wants to use thoracoabdominal normothermic regional perfusion (TA-NRP) with aortic occlusion balloon.**

  - **Step 1:** The committee must choose the account. Since the patient is being declared by circulatory criteria, they choose (b) Circulatory death.

  - **Step 2:** 
    - Question: Has there been irreversible cessation of circulatory and respiratory functions for the specified time (say, 5 minutes)? 
    - Answer: Yes, the patient has had 5 minutes of asystole and no respiration. The committee agrees that the cessation is irreversible because no resuscitation is planned.
    - Outcome: Proceed to Step 3.

  - **Step 3:** 
    - The intervention: TA-NRP with aortic occlusion balloon. The purpose is to perfuse the abdominal organs without perfusing the brain (because of the balloon). 
    - The worry: Does restarting circulation to the body (even with the balloon preventing brain perfusion) contradict the claim of circulatory death? 
    - Analysis: Under circulatory death, death is declared because of the irreversible cessation of circulation. However, if we then restart circulation (even regionally), it might suggest that the cessation was not irreversible. But note: the irreversibility in circulatory death is defined in the context of no planned resuscitation. In this case, the patient is not being resuscitated; the intervention is for organ perfusion after death. 
    - The key question: Is TA-NRP inconsistent with the declaration of death? The procedure requires the committee to decide if this intervention undermines the account. 
      - One view: The circulation is being restored to the body (though not the brain) by artificial means. This might suggest that the body is not dead because the heart is not needed for circulation (the machine is doing it). 
      - Another view: The patient was dead when circulation stopped and did not restart spontaneously. The TA-NRP is an artificial intervention after death. The balloon ensures the brain is not perfused, so there is no chance of restoring brain function. 
    - Judgment: The committee must decide. If they agree that the intervention does not restore the patient's own circulation (it's an external machine) and the patient's own circulation has irreversibly ceased, then they can proceed. 
    - Sufficient answer: The committee agrees that the intervention is postmortem and does not reverse the cessation of the patient's own circulation. 
    - Outcome: If they agree, proceed to Step 4. If they disagree, then death may not be declared. If unsure, escalate.

    For this case, let's assume the committee agrees that the intervention is consistent with the account. Proceed to Step 4.

  - **Step 4:**
    - Legal constraints: The family has consented, and there is no religious objection that applies (since the death is by circulatory criteria). The law does not prohibit TA-NRP in this jurisdiction (we assume).
    - Output: Death may be declared. (Donation may proceed.)

  **Verdict for Case 1:** Death may be declared.

  **Note:** This might be uncomfortable because the intervention restores circulation to the body, but the procedure forces the committee to confront whether that matters under the circulatory account. If the committee cannot agree, they might have to escalate.

  ---

  **Case 2: Patient at 19 weeks gestation with confirmed whole-brain destruction. Family wants support continued on the new somatic platform until fetus is viable.**

  - **Step 1:** The committee must choose the account. The hospital's official account is whole-brain death, so they choose (a) Whole-brain death.

  - **Step 2:**
    - Question: Has there been irreversible cessation of all functions of the entire brain? 
    - Answer: Yes, confirmed by tests. 
    - Outcome: Proceed to Step 3.

  - **Step 3:**
    - The intervention: The new somatic support platform that maintains thermoregulation, hemodynamic stability, wound healing, growth, and gestation. 
    - Question: Does this support contradict the whole-brain death account? 
      - The whole-brain death account defines death as the irreversible loss of the entire brain's function, and the body's ability to function as an integrated whole. The somatic platform is maintaining integrated functions (like thermoregulation, wound healing, and even gestation) without the brain. 
      - This directly challenges the idea that the organism as a whole has ceased to function. 
    - Judgment: The committee must decide whether the platform is merely preserving tissues (like a heart-lung machine) or whether it is enabling the body to function as an integrated organism without the brain. 
      - If the body is functioning in an integrated way (e.g., responding to stressors, healing, maintaining homeostasis, supporting fetal development) then it might be argued that the organism as a whole is still functioning, albeit artificially. 
      - However, the whole-brain standard requires that the brain is the integrator. Without the brain, the integration must be artificial. 
    - The committee might be divided. 
      - One view: The platform is acting as an external integrator, so the organism itself is not integrating. Therefore, the organism as a whole has ceased to function. 
      - Another view: The platform is so advanced that it restores the organism's integrated functioning, meaning the patient is not dead. 
    - This is a judgment call. 
    - Outcome: If the committee agrees that the platform does not restore the patient's own integrated functioning (it's an external machine doing the integration) then they can proceed. But if they think it does, then death may not be declared. 
    - Given the division in the committee, they might not agree. 
    - Let's assume they are divided. Then the procedure says: "The account gives no determinate verdict. Escalate."

  **Verdict for Case 2:** Escalate. (This might not be liked because it doesn't resolve the issue.)

  Alternatively, if the committee can agree that the platform does not change the fact of brain death, then:

  - Proceed to Step 4.

  - **Step 4:**
    - Legal constraints: The law requires accommodation of religious objections to neurological criteria. But note: the patient has been declared dead by neurological criteria (whole-brain death). The family is requesting continued support. The law says that if there is a religious objection to neurological criteria, then death cannot be declared until circulatory arrest occurs (or the defined window passes). 
    - However, in this case, the patient is already on the platform and would not have circulatory arrest. 
    - The law might require that if there is a religious objection, the patient must be maintained until circulatory arrest occurs (which it won't because of the platform). 
    - This creates a conflict: the patient is dead by the hospital's account, but the law requires accommodation. 
    - The committee must check: Has the family raised a religious objection to the use of neurological criteria? If so, then under the new law, the hospital must accommodate by not declaring death until circulatory criteria are met. 
    - In this scenario, the patient is being maintained on the platform, so circulatory criteria are not met. 
    - Therefore, the committee might conclude: Death may not be declared (because the law requires accommodating the objection and the patient has not met circulatory criteria). 
    - Alternatively, if the family has not raised a religious objection, then the hospital can declare death by neurological criteria. 
    - But note: the family is requesting continued support. They may be objecting to the declaration of death. 
    - The procedure must consider the legal requirement. 
    - Outcome: 
      - If the family has raised a religious objection to neurological criteria, then the hospital must not declare death until circulatory criteria are met. Since the platform is preventing circulatory arrest, the committee must not declare death. Output: "Death may not be declared." 
      - If the family has not raised a religious objection, then the hospital may declare death. However, the family's request for continued support is a separate issue (about treatment of the deceased). But the procedure is only about declaring death. 
      - But note: the law might require that the objection be explicit? We don't have details. 
    - This step might require escalation because of the legal complexity.

  Given the complexity, and the fact that the committee might be divided on Step 3, the overall verdict for this case is likely to be "Escalate".

  **However, for the sake of the procedure, let's assume the committee in Step 3 agrees that the platform does not change the death determination (i.e., the patient is dead by whole-brain criteria). Then:**

  - **Step 4:**
    - The family has requested continued support. The law says: if there is a religious objection to neurological criteria, then death cannot be declared until circulatory criteria are met. 
    - We must check: has the family raised a religious objection? 
      - If yes, then the hospital must accommodate. That means they cannot declare death until the patient meets circulatory criteria (which would require turning off the platform and waiting for arrest). 
      - Therefore, output: "Death may not be declared" (because of the legal constraint). 
      - If the family has not raised a religious objection (or if the objection is not based on religion? The law specifies religious), then the hospital may declare death. 
    - However, the family's request for continued support is not necessarily a religious objection. They might have other reasons. 
    - The committee must determine if the family's request constitutes a religious objection under the law. 
      - If yes, then death may not be declared. 
      - If no, then death may be declared. 
    - But note: the law might require that the objection be made on religious grounds. 
    - This is a legal interpretation. 
    - If the committee is unsure, they must escalate. 

  Given the complexity, it's likely that the verdict would be to escalate. But if we assume the family has raised a religious objection, then the output would be: "Death may not be declared."

  **Verdict for Case 2 (if family has religious objection):** Death may not be declared.

  This might be the outcome that the neurointensivist does not like because it means they cannot declare death despite whole-brain destruction, due to the law.

  ---

  **Case 3: Patient with catastrophic bilateral hemispheric destruction but preserved brainstem (sleep-wake cycles, spontaneous respiration). Family requests donation and asks why this patient isn't dead when the next patient (whole-brain dead) is.**

  - **Step 1:** The committee must choose the account. The hospital accepts whole-brain death, so they choose (a) Whole-brain death.

  - **Step 2:**
    - Question: Is there irreversible cessation of all functions of the entire brain? 
    - Answer: No, because the brainstem is functioning (respiration, sleep-wake cycles). 
    - Therefore, the committee must answer "no". 
    - Output: "Death may not be declared." 

  The procedure stops here.

  **Verdict for Case 3:** Death may not be declared.

  **Why this might be disliked?** The family is asking why the patient isn't dead when the next one is. The answer is that the next patient met the whole-brain criteria and this one does not. The family might be frustrated because the patient has no chance of recovery and they want donation. But the committee cannot declare death under the chosen account.

  **Alternative:** The committee might be tempted to use a different account (like higher-brain death). But the procedure forces them to stick to the chosen account. If they wanted to use higher-brain death, they would have to choose that at Step 1.

  But note: the hospital does not accept higher-brain death. So if the committee chooses (c) at Step 1, they are going against hospital policy. The procedure does not prevent that, but it would be inconsistent with the hospital's stated position. The committee must be aware of this.

  If they choose (c) Higher-brain death:

  - Step 2: Has there been irreversible loss of higher brain functions? Yes, because of bilateral hemispheric destruction.
  - Step 3: The patient has preserved brainstem function (spontaneous respiration). Does that contradict the account? The higher-brain account says that loss of higher functions (consciousness) is death, even if the brainstem is alive. So the committee might say it doesn't contradict.
  - Step 4: Check legal constraints. Does the law recognize higher-brain death? In the jurisdiction, the law likely only recognizes whole-brain or circulatory death. So the committee might face a legal barrier.

  But the hospital does not accept higher-brain death. So the committee would be going against policy. The procedure does not forbid it, but it would require the committee to explicitly choose an account that the hospital does not endorse. This might require escalation.

  ---

  **What the procedure cannot do:**
  1. **Resolve fundamental disagreements about the definition of death:** The procedure forces a choice of account but does not resolve which account is the "right" one. It only ensures consistency.
  2. **Handle novel technologies that challenge the accounts:** For example, the somatic support platform might force a reevaluation of the whole-brain standard. The procedure might lead to escalation in such cases.
  3. **Override the law:** If the law requires a different standard (like accommodating religious objections), the procedure must respect that.
  4. **Make value judgments for the committee:** Steps 1 and 3 involve value judgments. The procedure makes them explicit but does not resolve them.
  5. **Deal with conflicts between accounts:** If the committee is split on which account to choose, the procedure does not help. It requires a choice at Step 1.
  6. **Address all ethical nuances:** The procedure is a structured decision tool, not an ethical deliberation. It might oversimplify.

  **Is a procedure what you actually need?** 
  - The procedure brings transparency and consistency, which is valuable. But it cannot resolve the underlying philosophical and ethical debates. It might be that what is needed is a reevaluation of the hospital's official account of death in light of new technologies and legal changes. The procedure will highlight when the account leads to uncomfortable results, which might prompt a broader discussion.

  **Final Note:** The procedure is designed to be run in an hour. It may require escalation when the committee is stuck. In practice, the committee might need more time or expertise for complex cases.
answer: |-
  Below is a decision procedure designed for your committee. It is structured as a flowchart-like sequence of questions that forces explicit selection of a death determination account and applies it consistently. The procedure is modular, with clear stopping points, and is executable by a rotating panel (intensivist, neurologist, lay member) in ~60 minutes without philosophical training. It uses fixed outputs:  
  - **Death may be declared**  
  - **Death may not be declared**  
  - **Death may be declared but donation may not proceed**  
  - **Escalate** (to ethics committee, legal, or hospital governance)  

  Each step specifies:  
  - **Sufficient answer**: Minimally acceptable response to proceed.  
  - **No answer**: Inability to meet criteria; halts procedure.  
  - **Judgment call**: Steps requiring value-based interpretation (disguised as procedure).  
  - **Stopping points**: Where consistency demands a firm outcome, values require human judgment, or the account yields no verdict.  

  The procedure is honest about its limitations: Steps 1, 3, and 5 are judgment calls masquerading as protocol.  

  ---

  ### **Decision Procedure**  
  **Step 1: Select the account of death**  
  - **Prompt**: "Which account of death is this committee applying today? Choose one:  
    (a) Whole-brain death (irreversible loss of all brain functions, including brainstem).  
    (b) Circulatory death (irreversible cessation of circulatory/respiratory functions).  
    (c) Higher-brain death (irreversible loss of consciousness/cognition, excluding brainstem)."  
  - **Sufficient answer**: Unanimous selection of (a), (b), or (c). No modifications.  
  - **No answer**: Deadlock, refusal to choose, or attempt to combine accounts.  
  - **Judgment call**: Values-based choice (not medical fact). The account must align with hospital policy or law if unambiguous.  
  - **Stopping point**:  
    - No answer → **Escalate** (committee cannot agree on foundation).  
    - Else → Proceed to Step 2.  

  **Step 2: Verify medical criteria for the chosen account**  
  - **Prompt**: "Are the clinical criteria for the selected account unambiguously met? Use objective tests only."  
    - For (a): Confirmatory tests (e.g., apnea, clinical exam, EEG/angiography showing no brain activity).  
    - For (b): Absence of circulation/respiration for protocol-specified time (e.g., 5 minutes), no autoresuscitation.  
    - For (c): Evidence of permanent unconsciousness (e.g., PVS with no cortical activity on fMRI).  
  - **Sufficient answer**: Agreement that objective criteria are fully satisfied per hospital protocol.  
  - **No answer**: Criteria not met, tests equivocal, or disagreement on interpretation.  
  - **Judgment call**: None. Pure medical fact.  
  - **Stopping point**:  
    - No → **Death may not be declared** (hard stop).  
    - Yes → Proceed to Step 3.  

  **Step 3: Assess for contradictions to the account**  
  - **Prompt**: "Are ongoing interventions or physiological processes inconsistent with the chosen account of death? Ignore cost, focus on biological consistency."  
    - Examples:  
      - (a) Somatic support maintaining integrated functions (e.g., wound healing, gestation).  
      - (b) Interventions restoring partial circulation (e.g., regional perfusion).  
      - (c) Preserved brainstem reflexes (e.g., spontaneous breathing).  
  - **Sufficient answer**: "No contradiction" (interventions are artificial/temporary and do not restore the defining functions) or "Contradiction" (interventions replicate core integrated functions).  
  - **No answer**: Uncertainty about whether interventions invalidate the account.  
  - **Judgment call**: Values-based interpretation of "integration" or "irreversibility."  
  - **Stopping point**:  
    - Contradiction → **Death may not be declared** (hard stop; account invalidated).  
    - No contradiction → Proceed to Step 4.  
    - No answer → **Escalate** (account gives no verdict; e.g., technology blurs boundaries).  

  **Step 4: Apply legal/policy constraints**  
  - **Prompt**: "Does law or hospital policy override the declaration? Check:  
    1. Religious objections to neurological criteria (if applicable).  
    2. Jurisdictional restrictions on donation procedures.  
    3. Conflicts with the selected account."  
  - **Sufficient answer**: Identification of specific legal/policy conflicts (e.g., religious objection statute) or confirmation of none.  
  - **No answer**: Awareness of constraints but refusal to apply them.  
  - **Judgment call**: None. Fact-based (law/policy documents).  
  - **Stopping point**:  
    - Religious objection to neuro-criteria (for (a) or (c)) → **Death may be declared but donation may not proceed** (hard stop; law requires accommodation).  
    - Other conflicts (e.g., illegal donation procedure) → **Death may be declared but donation may not proceed**.  
    - No constraints → Proceed to Step 5.  

  **Step 5: Determine donation permissibility**  
  - **Prompt**: "If death is declared, does the account or policy permit organ donation? Focus on:  
    - For (b): Does donation protocol reintroduce circulation in a way that invalidates irreversibility?  
    - For all: Does donation violate the dead donor rule (organs removed only from dead)?"  
  - **Sufficient answer**: "Permitted" or "Not permitted" with rationale tied to account consistency.  
  - **No answer**: Uncertainty about dead donor rule compliance.  
  - **Judgment call**: Values-based weighing of societal benefit vs. account integrity.  
  - **Stopping point**:  
    - Permitted → **Death may be declared** (donation proceeds).  
    - Not permitted → **Death may be declared but donation may not proceed**.  
    - No answer → **Escalate** (e.g., novel procedure challenges dead donor rule).  

  ---

  ### **Application to Cases**  
  **Case 1: Circulatory death with thoracoabdominal normothermic regional perfusion (TA-NRP)**  
  - **Step 1**: Circulatory death (b) chosen (consistent with declaration).  
  - **Step 2**: Criteria met (5-min arrest, no autoresuscitation).  
  - **Step 3**: TA-NRP restores abdominal circulation but aortic balloon prevents brain reperfusion.  
    - **Contradiction?** No—cessation is irreversible (no spontaneous return), and brain exclusion shows no attempt to restore "integrated" function. Sufficient answer: No contradiction.  
  - **Step 4**: No legal constraints (family consents).  
  - **Step 5**: TA-NRP does not invalidate irreversibility; dead donor rule upheld.  
  - **Output**: **Death may be declared** (donation proceeds).  
  - **Why you might dislike**: TA-NRP’s brain exclusion tacitly admits neuroprotection concerns, hinting at inconsistency in circulatory death’s irreversibility. Procedure masks this as a "no contradiction" judgment call.  

  **Case 2: Whole-brain death at 19 weeks gestation with somatic support platform**  
  - **Step 1**: Whole-brain death (a) chosen (hospital policy).  
  - **Step 2**: Criteria met (tests confirm total brain destruction).  
  - **Step 3**: Somatic platform maintains thermoregulation, wound healing, and gestation.  
    - **Contradiction?** Platform enables integrated organismal functions (growth, gestation) without a brain.  
      - Sufficient answer: **Contradiction**—whole-brain death defines death as loss of integrated function, but platform restores it.  
  - **Stopping point**: **Death may not be declared** (hard stop at Step 3).  
  - **Why you might dislike**: Forces consistency—either abandon whole-brain death or accept that the patient isn’t dead. Contradicts your committee’s prior decisions (e.g., brain-dead pregnant patient). Highlights that somatic support undermines the "organism as a whole" rationale.  

  **Case 3: Bilateral hemispheric destruction with intact brainstem**  
  - **Step 1**: Whole-brain death (a) chosen (hospital policy).  
  - **Step 2**: Criteria **not met**—brainstem functions (respiration, sleep-wake cycles) persist.  
  - **Stopping point**: **Death may not be declared** (hard stop at Step 2).  
  - **Output explanation**: Under whole-brain death, this patient is alive. Family’s question exposes inconsistency with higher-brain standards but procedure forces adherence to chosen account.  
  - **Why consistent but uncomfortable**: Family sees a "living" patient with no consciousness next to a "dead" one on a ventilator. Procedure can’t reconcile this—it’s a limitation of the account.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve fundamental debates**: It cannot choose the "correct" account of death (Step 1 judgment call). It only enforces consistency.  
  2. **Handle novel technologies**: Somatic support platforms (Case 2) often yield "no answer" at Step 3, forcing escalation. The procedure treats them as disruptions, not solutions.  
  3. **Override values conflicts**: Religious objections (Case 2) or dead donor rule ambiguities (Case 1) halt progress—procedure outsources to "escalate."  
  4. **Justify time thresholds in circulatory death**: The 2-5 min window is never questioned; it’s treated as fact (Step 2).  
  5. **Prevent hypocrisy**: Judgment calls (Steps 3/5) allow committees to rationalize inconsistencies (e.g., TA-NRP’s brain exclusion is "not a contradiction").  
  6. **Replace deliberation**: For complex cases (e.g., somatic support), it often escalates—you still need ethics consultations.  

  **Do you need a procedure?**  
  - **Yes**: For efficiency, legal defensibility, and reducing ad hoc judgments. It forces transparency about which account is used and where inconsistencies arise.  
  - **But**: It cannot fix flawed accounts. If Cases 2 or 3 trouble you, the real need is to revisit your hospital’s acceptance of whole-brain death. The procedure’s value is in exposing these tensions—escalation isn’t failure, it’s a signal for policy reform. Use it to audit your protocol and confront what you’ve "accreted."
