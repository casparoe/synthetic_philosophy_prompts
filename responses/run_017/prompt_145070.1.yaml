  ### **Key Notes**  
  - **Your sincerity proxies**:  
    - *Ninth-read test*: Rooted in Tolstoy (sincerity = persistent infection).  
    - *Naming test*: Your innovation (Tolstoy implies but doesn’t systematize).  
  - **Accessibility gate**: Reframed to penalize *obscurity of feeling*, not cultural specificity. If the feeling transcends context (e.g., immigrant grief feels universal), it passes.  
