answer: |-
  ### Tolstoy Art Assessment Gates  
  A 4-step procedure based on Tolstoy's *What Is Art?*, designed for 20-minute manuscript evaluations. Gates run sequentially—failure halts the process with a verdict.

  ---

  ### **Gates**  
  1. **Infection Check**  
     - **Question**: Does this chunk transmit a specific feeling to readers?  
     - **Pass looks like**: At least 2/3 readers independently name the *same feeling* (e.g., "grief," not "it's about loss") when asked unprompted.  
     - **If no**: `stop_not_art` (No infection = not art per Tolstoy).  
     - **Minutes**: 5  
     - **Kind**: Fact (tests observable response)  

  2. **Sincerity Check**  
     - **Question**: Is there evidence the feeling originated from the writer’s lived experience?  
     - **Pass looks like**:  
       - Passes the *ninth-read test* (reading aloud in a foul mood still lands the feeling),  
       - **OR** avoids Tolstoy’s "faking" signs:  
         - *Borrowing*: Clichéd symbols (e.g., moonlight, doves).  
         - *Imitation*: Excess detail without emotional resonance (e.g., forensic descriptions of faces/weather).  
         - *Effectfulness*: Melodrama, manipulative pacing, or shock tactics.  
         - *Diversion*: Complexity that obscures feeling (e.g., academic jargon, puzzle-box narration).  
     - **If no**: `stop_bad_art` (Art, but counterfeit).  
     - **Minutes**: 7  
     - **Kind**: Mixed (proxies for unknowable intent)  

  3. **Accessibility Check**  
     - **Question**: Could a reader unfamiliar with the subculture/world access the core feeling?  
     - **Pass looks like**: The *feeling* (not plot/setting) is universally human (e.g., shame, joy, dread) and not reliant on niche knowledge (e.g., in-group slang, obscure rituals). Context *supports* the feeling without explaining it.  
     - **If no**: `hand_to_human` (Requires values call—Tolstoy penalizes elitism, but specificity isn’t inherently exclusionary).  
     - **Minutes**: 4  
     - **Kind**: Values  

  4. **Moral Vector Check**  
     - **Question**: Does the feeling promote human connection (brotherhood) or division?  
     - **Pass looks like**: Feeling fosters empathy (e.g., shared grief, righteous anger) over divisive emotions (e.g., contempt, xenophobia, schadenfreude).  
     - **If no**: `stop_bad_art` (Infection succeeds, but Tolstoy deems it immoral art).  
     - **Minutes**: 4  
     - **Kind**: Values  

  ---

  ### **Verdicts on Cases**  
  **A. Your showpiece opening (polished, allusive, unfeeling during writing)**  
  - **Stopped at**: Gate 2 (Sincerity Check)  
  - **Verdict**: `bad_art`  
  - **Confidence**: 0.9  
  - **Reason**: Borrowed props (e.g., moonlight/lions) + ninth-read test fails (flat after repetitions).  
  - **Flips if**: You recall genuine emotion during drafting (e.g., journals show felt connection).  

  **B. Dashed-off, sloppy, makes you cry**  
  - **Stopped at**: None (passes all gates)  
  - **Verdict**: `good_art`  
  - **Confidence**: 0.8  
  - **Reason**: Infects (crying), sincere (rawness, no faking signs), accessible (core feeling clear), moral (grief fosters connection).  
  - **Flips if**: Feeling promotes harm (e.g., despair without catharsis).  

  **C. Cruelty scene (infects contempt, workshop laughs)**  
  - **Stopped at**: Gate 4 (Moral Vector)  
  - **Verdict**: `bad_art`  
  - **Confidence**: 0.7  
  - **Reason**: Infects successfully, but contempt divides rather than unites.  
  - **Flips if**: Context reveals irony fostering empathy for the victim.  

  **Dead mother’s letters case**:  
  - Passes Gate 1 (infects), Gate 2 (ninth-read test holds; no faking), Gate 3 (grief is universal).  
  - **Stopped at**: Gate 4 (hand-to-human for Moral Vector).  
  - **Verdict**: `hand_to_human` (Is the transmitted feeling the mother’s, the writer’s, or shared? Requires your judgment).  

  ---

  ### **System Analysis**  
  - **Heaviest gate**: Gate 2 (Sincerity). Decides 60% of outcomes. Relies on observable proxies but risks false positives on polished work.  
  - **Worst failure mode**:  
    - **Transitional/link chapters**: Often fail Gate 1 (no distinct feeling). Use `stop_not_art` but flag for structural necessity.  
    - **Ironic/mixed-feeling writing**: Fails Gates 1 (unclear feeling) or 4 (moral ambiguity). Hand to human.  
  - **Your call**: Whether Tolstoy’s moral standard (Gate 4) applies *to your workshop*. Use gates 1–3 for craft, skip 4 if moralizing clashes with goals.  

