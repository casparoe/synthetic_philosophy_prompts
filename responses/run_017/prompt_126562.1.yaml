  The biggest red flag is that last sentence jumping from explanation to dismissal. That's a classic "genetic fallacy" - assuming explaining origins invalidates a belief. This needs careful unpacking since the user specifically flagged it as suspicious.

  Regarding the friend's "semantic slack" theory - this resonates with anthropological work on how religious concepts maintain cohesion through vagueness. It actually complements rather than contradicts the memorability argument - counterintuitive elements make concepts attention-grabbing, while semantic slack allows flexible adaptation. I should note this is plausible though perhaps not universally accepted.

