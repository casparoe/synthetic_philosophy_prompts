answer: |-
  Below is a **requirement-driven spec** for solving the frame problem in your warehouse robot planner, structured around concrete desiderata. I'll distinguish hard requirements from philosophical preferences, flag conflicts, and evaluate your candidates. The focus is on what a production system *must* achieve versus what academics debate.

  ---

  ### **Core Desiderata (Non-Negotiable Requirements)**
  These are grounded in real-world constraints of your warehouse domain:

  1. **State Update Correctness**  
     - **Concrete Case**: After a robot moves from Aisle 1 to Aisle 2, the system must know that:  
       - ✅ *Changed*: Robot location, battery level.  
       - ✅ *Unchanged*: Box positions, shelf weights, other robots' states, HVAC status.  
     - **Why Required**: Incorrect inferences (e.g., assuming a box moved when it didn’t) cause physical errors like misplacement.  
     - **Tractability Implication**: Must scale to 10k+ fluents (state variables).

  2. **Representation Scalability**  
     - **Concrete Case**: Adding a new state variable (e.g., `shelf_load_capacity`) shouldn’t require modifying every existing action (e.g., `move`, `lift`, `charge`).  
     - **Why Required**: Warehouse state schemas evolve (new sensors, inventory types). Hand-editing all actions for each change is error-prone and O(n²).  
     - **Conflict Alert**: Directly clashes with naive frame axioms (e.g., STRIPS without extensions).

  3. **Computational Scalability (Frame-to-Payload Ratio)**  
     - **Concrete Case**: When `move` updates 2 fluents (location, battery), the "what didn’t change" step must run in O(1) or O(k) time (k = affected fluents), **not** O(n) (n = total fluents). Hard deadline: 10ms for 10k fluents.  
     - **Why Required**: Real-time control loops demand bounded latency. O(n) per action breaks deadlines.  
     - **Your Candidate #2**: **This is a genuine requirement**, not an engineering smell. Physics doesn’t care about unrelated fluents—your solver shouldn’t either.

  4. **Edit-Locality for Actions**  
     - **Concrete Case**: Adding `defragment_shelf` action shouldn’t force changes to `move`’s implementation or frame axioms.  
     - **Why Required**: Agile development. Teams work on separate actions; global refactors risk regressions.  
     - **Your Candidate #1**: **Genuine requirement**. Violated by approaches requiring global fluent lists (e.g., vanilla Situation Calculus).

  5. **Ramification Support**  
     - **Concrete Case**: If `move(robot, box)` changes `box_location`, the system should auto-infer `shelf_weight` updates via domain rules—without hardcoding in `move`.  
     - **Why Required**: Warehouse rules are dynamic (e.g., new safety policies). Hand-rolling per-action indirect effects is brittle.

  ---

  ### **Contested Desiderata (Often Mistaken for Requirements)**
  These reflect academic preferences, not your practical needs:

  - **❌ "Stay Declarative"**  
    Philosophical stance. Hand-rolled update code can outperform theorem provers if it meets Requirements 1–5. Your goal is reliability/performance, not proof elegance.

  - **❌ "Preserve Classical Logic"**  
    Nonmonotonic logics (e.g., circumscription) solve frame problems neatly but often violate Requirement 3 (computational scalability). Overkill unless you need automated proofs.

  - **❌ "One Mechanism for Everything"**  
    Unified theories (e.g., fluent calculus) handle preconditions/effects/ramifications uniformly but are complex. Hybrid approaches (e.g., hand-rolled updates + declarative rules for ramifications) are pragmatic.

  ---

  ### **Conflict Alert: Impossible Combinations**
  1. **Representation Scalability + Edit-Locality + Ramification Support**  
     - Most nonmonotonic logics (e.g., circumscription) or successor state axioms (Reiter) achieve 1 and 4 but fail 3 and 5.  
     - **Conflict**: Cleanly handling indirect effects (ramifications) without O(n) cost or breaking edit-locality is NP-hard in the general case. You’ll need domain-specific compromises.

  2. **Computational Scalability + Correctness Under Concurrency**  
     - If multiple robots act simultaneously, verifying nothing changed requires conflict detection (e.g., two robots grabbing one box). Bounded-time solutions often sacrifice completeness.

  ---

  ### **Which Requirement Eliminates the Most Solutions?**  
  **Computational Scalability (Frame-to-Payload Ratio)**. It immediately rules out:  
  - Naive frame axioms (O(n) per action).  
  - Theorem-proving approaches (e.g., situation calculus in classical logic).  
  - Most description logic/reasoning systems.  

  Solutions that survive:  
  - **STRIPS/ADL with domain-specific state hashing** (hand-rolled code).  
  - **Successor State Axioms + incremental update tricks** (e.g., cache unchanged fluents).  
  - **Efficient nonmonotonic logics** (e.g., focused circumscription) if optimized for O(k).  

  ---

  ### **Recommendation for Your Context**
  1. **Hand-rolled state update** for direct effects (meets Requirements 2, 3, 4).  
     ```python
     def move(robot, to):
         new_state = current_state.copy()  # O(1) via structural sharing
         new_state.robot_location[robot] = to  # Direct effect
         new_state.battery[robot] -= 10  # Direct effect
         return new_state  # Unchanged fluents implied
     ```
  2. **Declarative rules for ramifications** (meets Requirement 5):  
     ```python
     # Rule: If box moves, update shelf weights
     on_box_move(box, from_shelf, to_shelf):
         new_state.shelf_weight[from_shelf] -= box.weight
         new_state.shelf_weight[to_shelf] += box.weight
     ```
     Attach rules to fluents (not actions) for edit-locality.  
  3. **Precompute "change sets"** for hard real-time: Cache lists of fluents affected by actions/rules. Update only those.  

  This hybrid approach meets all core desiderata without philosophical baggage. The "spec" is your state transition contracts: **Actions define direct effects; rules define indirect effects; everything else is invariant by fiat.**
