prompt: |-
  i'm a dev, no philosophy background, and i'm writing the planner for a warehouse robot: after each action I somehow have to conclude that the other ten thousand things didn't change, without enumerating them. Before I commit to an approach (nonmonotonic logics, the causal/circumscription sort of stuff, or just hand-rolled per-action update code) I want a spec.

  Write the desiderata any solution to the frame problem should have to meet, with the concrete case behind each one. I care much more about the criteria than about scoring approaches. In particular: which of the usual demands are genuine requirements and which are just one camp's taste (staying declarative, not abandoning classical logic, one mechanism covering both derived effects and endless weird preconditions)? And flag any pair of the desiderata you think can't actually be satisfied together — if the list is itself the result, say so.

  Two of my own candidates, which I want evaluated rather than just accepted: (1) edit-locality: adding a new action to the domain shouldn't force me to go touch how existing actions record what they leave alone; (2) frame-to-payload ratio: the work spent deciding what didn't change should stay bounded relative to the work spent on what did, under a hard deadline. Is each a real desideratum, or a symptom that I've framed the problem wrong (maybe an engineering smell leaking into a conceptual spec)? And which single requirement, if you insist on it, rules out the most candidate solutions?
reasoning: |-
  We are addressing the Frame Problem in the context of a warehouse robot planner. The Frame Problem is about efficiently representing and reasoning about what does not change when an action is performed. We need to specify the desiderata (requirements) that any solution should meet, with concrete examples, and evaluate which are genuine requirements versus preferences. We also need to identify conflicting desiderata and evaluate the user's two candidates.

  Key desiderata for the frame problem solution:

  1. **Representational Efficiency (No Explicit Enumeration)**: The solution should not require listing all unchanged fluents (properties that can change over time) for every action. 
     - *Concrete Case*: After the robot moves from location A to B, we must conclude that the color of the walls, the positions of other robots, the stock levels of items (unless the robot was carrying something and dropped it off, which would be handled by the action's direct effects) remain unchanged. There are thousands of such properties.

  2. **Inferential Efficiency (Computational Tractability)**: The reasoning about what remains unchanged should be computationally feasible, especially given hard deadlines in a real-time system like a warehouse robot.
     - *Concrete Case*: The robot must decide its next action within milliseconds; it cannot spend time iterating over all fluents to check if they changed.

  3. **Correctness (Soundness and Completeness)**: The solution should correctly infer what remains unchanged (sound) and not miss any necessary inferences (complete) within the model. Note: completeness might be relative to the domain model.
     - *Concrete Case*: If a box is in a certain location and the robot moves, the box should still be there unless the action was to move that specific box.

  4. **Modularity (Edit-Locality - User's Candidate 1)**: Adding a new action should not require modifying the frame axioms for existing actions. This is about the ease of maintaining and extending the domain model.
     - *Concrete Case*: If we add a new action "charge_battery", we shouldn't have to update the "move" action to specify that charging doesn't change the robot's location, or vice versa.

  5. **Frame-to-Payload Ratio (User's Candidate 2)**: The computational cost of inferring what didn't change should be bounded and proportional to the number of changes (the "payload") rather than the total number of fluents. This is crucial for real-time performance.
     - *Concrete Case*: When the robot moves, it changes its location and battery level (if we model that). The system should not do work proportional to the ten thousand other fluents to conclude they are unchanged.

  6. **Expressiveness**: The solution should be able to represent complex scenarios, including indirect effects (ramifications) and qualifications (preconditions that might be numerous and not explicitly listed in every action).
     - *Concrete Case*: Moving a box might require the box to be present and the robot to have enough battery. Also, moving the box might indirectly cause the shelf it was on to become empty.

  7. **Declarativity (Optional?)**. Some argue that the solution should be declarative (i.e., specified in a logic-based, high-level manner without procedural code) for ease of understanding and maintenance. However, the user questions if this is a genuine requirement or a taste.
     - *Concrete Case*: Instead of writing procedural code for each action to update the state, we write rules that say "if an action occurs, a fluent changes only if the action causes it".

  8. **Compatibility with Classical Logic (Optional?)**: Some approaches (like circumscription) aim to stay within classical logic, while others (like situation calculus with frame axioms) are classical but inefficient. The user questions if abandoning classical logic is acceptable.

  9. **Handling of Ramifications and Qualifications**: The solution should handle:
     - *Ramifications*: Indirect effects (e.g., moving a box from shelf A to B causes shelf A to become empty if that was the only box on it, and shelf B to become non-empty).
     - *Qualifications*: Endless preconditions (e.g., the robot can move only if there is no power outage, no earthquake, no system failure, etc.). However, we typically assume the "Qualification Problem" is separate and might require a different solution.

  Now, evaluating the user's candidates:

  - **(1) Edit-locality**: This is a genuine requirement for maintainability. Without it, adding new actions becomes O(n) in the number of existing actions (if each existing action must be updated to account for the new one) and O(m) in the number of new actions (if the new action must account for every existing fluent). This quickly becomes unmanageable.

  - **(2) Frame-to-payload ratio**: This is a critical requirement for real-time systems. If the reasoning time per action is linear (or worse) in the total number of fluents, then as the domain scales (to tens of thousands of fluents), the system becomes too slow. We need the cost to be proportional to the number of changes (which is typically small).

  Now, which desiderata are genuine requirements and which are optional?

  - **Genuine Requirements** (for a warehouse robot planner):
    1. Representational Efficiency (1): Without it, the model is infeasibly large.
    2. Inferential Efficiency (2): Real-time constraints demand it.
    3. Correctness (3): The system must be reliable.
    4. Modularity (4: Edit-locality): Essential for scalable development.
    5. Frame-to-Payload ratio (5): Critical for real-time performance.
    6. Expressiveness (6): We must handle at least common indirect effects and preconditions.

  - **Optional (Taste or Context-Dependent)**:
    7. Declarativity: While desirable for readability and maintenance, a hand-rolled procedural update might be acceptable if it meets the other requirements and is well-engineered. However, in academic AI, staying declarative is often a goal for generality and reasoning.
    8. Compatibility with Classical Logic: In practice, if an efficient non-classical logic (like some nonmonotonic logics) works, it might be acceptable. But classical logic is easier to reason about and has more tooling.

  Conflicting Desiderata:

  - **Expressiveness vs. Efficiency**: The more expressive the solution (handling complex ramifications and qualifications), the harder it is to achieve inferential efficiency. For example, reasoning about indirect effects might require chain reactions that are computationally expensive.

  - **Correctness vs. Efficiency**: If we use approximations (like ignoring some ramifications to be faster), we might sacrifice correctness.

  Which single requirement rules out the most candidate solutions?

  The **Frame-to-Payload Ratio (5)** is particularly challenging. Many solutions (like the simple frame axioms in situation calculus) have a cost linear in the number of fluents per action. This is unacceptable for a domain with ten thousand fluents. Approaches that try to handle ramifications (like using state constraints) might also suffer from high computational costs.

  Moreover, the requirement for **Edit-Locality (4)** rules out approaches that require global modification when extending the domain.

  Approaches and how they fare:

  - **Frame Axioms (classical)**: For each action and each fluent, an axiom says the fluent remains unchanged unless the action affects it. This fails on representational and inferential efficiency, and edit-locality (adding a new fluent requires adding axioms to every action).

  - **Successor State Axioms (Reiter's solution in situation calculus)**: One axiom per fluent, saying when it changes. This achieves edit-locality for actions (adding a new action doesn't require changing existing axioms) but not for fluents (adding a new fluent requires a new axiom). However, inferential efficiency might still be an issue because when updating the state, we must evaluate the condition for each fluent to see if it changed? Actually, in practice, we only compute the changed fluents. So if we have a way to compute the next state without iterating over all fluents (like by only updating the ones that are mentioned in the action's effects and then using the frame assumption for the rest) then we can be efficient. But the representation is still one axiom per fluent, so adding a new fluent requires writing a new successor state axiom. The inferential efficiency can be O(1) per fluent that is changed? Actually, the update is O(1) per fluent that is being updated, but the successor state axiom for a fluent must consider every action that can change it. So if we have many actions, the condition in the successor state axiom becomes long. However, during execution, we only need to compute the fluents that are being queried? Or we can update the entire state by iterating over all fluents? That would be O(n) per action, which violates frame-to-payload. But in practice, we don't have to: we can update only the fluents that are mentioned in the action's direct effects and then use the frame assumption for the rest? Actually, the successor state axiom method is designed to allow a complete state update by evaluating every fluent's condition. So without optimization, it would be O(n). However, in a real implementation, we can use a dependency graph to only update fluents that are potentially affected? That leads to the ramification problem.

  - **Explanation Closure (circumscription)**: This is a nonmonotonic logic approach. It can be representationally efficient but might be computationally expensive and difficult to implement.

  - **Propositional Inference (like in SAT planning)**: We can encode the frame problem in a propositional theory and use a SAT solver. This might not meet real-time constraints.

  - **Hand-rolled procedural update**: Write code for each action that updates only the fluents it affects and leaves the rest. This meets edit-locality for fluents? Actually, no: if we add a new fluent, we must check every action to see if it affects that fluent? Or we can leave it untouched? The state is a data structure. If we write an action that only updates, say, the robot's location, then the other fluents (including new ones) are untouched. So:
     - Edit-locality for actions: When adding a new action, we write its update function without touching existing actions. When adding a new fluent, we don't have to change any existing action (unless the action should change it, then we must update that action's code). So it's not edit-locality for fluents? Actually, the problem is that if we add a new fluent, we might have to adjust existing actions if they should affect it. But if we have an action that does not affect the new fluent, then we don't need to change it. So it's only when an existing action should now affect the new fluent that we have to update. This is the same in the successor state axiom approach. However, with hand-rolled code, it's easier to forget to update an action when adding a new fluent? And there's no declarative rule to catch it.

  Given the user's requirements, particularly frame-to-payload ratio and edit-locality, the hand-rolled procedural update might be acceptable if the domain is not too complex. However, it doesn't handle ramifications automatically.

  Another approach is to use a **STRIPS-like** representation with add and delete lists, and then assume that anything not mentioned remains the same. This is very efficient (O(1) per fluent in practice because we only update the ones in the lists) and meets frame-to-payload. Edit-locality: 
    - Adding a new action: we write its add and delete lists without changing existing ones.
    - Adding a new fluent: we don't have to change existing actions, unless an existing action should now affect it. Then we must update that action.

  So the same caveat as above. But the representation is compact and the update is fast.

  However, STRIPS does not handle indirect effects (ramifications) without extensions. For example, if moving a box causes a shelf to become empty, then we must either:
     a) Encode that in every action that moves a box (violating edit-locality for the shelf's emptiness fluent when adding a new box-moving action), or 
     b) Use state constraints (like "a shelf is empty if no box is on it") and then use an approach that automatically propagates these.

  To handle state constraints, we might need a more advanced approach like the **Flux** language (based on fluent calculus) or **PDDL** with derived predicates. These can be efficient? It depends.

  Conclusion on desiderata:

  1. **Genuine Requirements** (for the warehouse robot):
     - Representational Efficiency (1)
     - Inferential Efficiency (2) [with frame-to-payload ratio as a key aspect]
     - Correctness (3) [within the model]
     - Modularity (Edit-locality) (4)
     - Frame-to-Payload Ratio (5) [as a critical efficiency requirement]
     - Expressiveness (6) to a reasonable extent (at least direct effects and common indirect effects)

  2. **Optional**:
     - Declarativity (7): The user is a dev without a philosophy background, so a well-structured procedural solution might be acceptable if it works.
     - Compatibility with Classical Logic (8): Not a primary concern if an efficient solution exists.

  Conflicting Pair:

  - **Expressiveness (handling complex ramifications) vs. Frame-to-Payload Ratio**: If we have complex chains of indirect effects, then updating the state might require a lot of computation (like forward chaining) that is not bounded by the direct effects. So we might have to trade off: either limit the expressiveness (by not allowing arbitrary state constraints) or accept a higher computational cost (but then we must ensure it is bounded in practice).

  Which single requirement rules out the most candidates? **Frame-to-Payload Ratio (5)**. It rules out any solution that requires iterating over all fluents for every action, which includes the naive frame axioms and the basic successor state axioms (if implemented without optimization). It also challenges solutions that handle ramifications by forward chaining until a fixpoint (which might be unbounded).

  Recommendation:

  Given the hard deadline and the scale (ten thousand fluents), the solution must have O(1) or O(k) (where k is the number of direct effects) per action for frame reasoning. Therefore, consider:

  - **STRIPS with conditional effects** (if the domain is mostly simple) and then handle some ramifications by encoding them as conditional effects? But then we lose edit-locality for the ramifications.

