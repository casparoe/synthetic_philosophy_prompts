answer: |-
  Here's a claim-by-claim audit of the passage, followed by answers to your specific questions, aiming for fairness and accuracy to deflationist positions (primarily Hirsch's Quantifier Variance, Carnap-inspired views, and Thomasson's Easy Ontology):

  **Audit of the Passage:**

  1.  **"Step one: observe that the two are not using 'there are' in the same sense; the denier means something like 'figures in the world's fundamental inventory,' the assertor means something looser and more everyday."**
      *   **Accept:** This captures the core deflationist move accurately, especially for Hirsch (quantifier variance) and Carnapians. They argue ontological disputes often involve shifts in the meaning/standards of the existential quantifier or "there exists" claims.
      *   **Wince/Clarify:** Thomasson (Easy Ontology) might phrase this differently. She emphasizes *internal* questions answered by conceptual truths within a framework, rather than explicitly different quantifier *meanings*. The denier is asking an *external* question (about fundamental reality) using terms ('table') whose application conditions are tied to the everyday framework. But the core point – different contexts/standards are in play – is still there.

  2.  **"Step two: note that each side's sentence is true in its own sense, so both of them are right, and neither has said anything the other needs to deny."**
      *   **Accept:** This is a standard deflationist conclusion for the specific dispute described. Given the meaning shift/framework shift, both "There are tables" (in the everyday sense) and "There are no tables, only particles arranged tablewise" (in the fundamental sense) can be true without contradiction.
      *   **Clarification:** Deflationists insist this *doesn't* mean *everything* is true or that *every* claim is acceptable. It depends on the specific frameworks/meanings in play being coherent and non-defective. They reject obviously incoherent frameworks.

  3.  **"Step three: conclude that the question whether there are really tables has no answer — there is no fact of the matter..."**
      *   **Misrepresentation (Significant):** This is the passage's most serious misstep. Deflationists **reject** the claim that there's "no fact of the matter" *simpliciter*.
          *   **Hirsch:** There *is* a fact of the matter *relative to a language*. "Are there tables?" is true in English, false in Ontologese (the language of fundamental physics). The question "Which language is *really* right?" is meaningless because "really" implies an absolute standard that doesn't exist. The fact of the matter is language-relative.
          *   **Thomasson:** There *is* a straightforward fact of the matter *internal* to our conceptual scheme. Given the application conditions for "table" derived from our conceptual rules and perceptual evidence, "There are tables" is analytically or conceptually true (or at least easily verified). The external question ("Are there *really* tables, independent of our concepts?") is either illegitimate (Carnap) or confused/misguided (Thomasson, Hirsch).
      *   **Accept:** "...any more than there is a fact of the matter about which of two equally serviceable languages to speak." This comparison is fair and central to deflationism, especially Hirsch and Carnap. Choosing a framework/language is a practical, not a metaphysical, decision.
      *   **Accept:** "What looked like a disagreement about the furniture of the universe is a disagreement about words..." This captures the "merely verbal" diagnosis well.
      *   **Accept:** "...the only question that survives is the practical one of which vocabulary it is more convenient for us to adopt." This is a core deflationist point, particularly Carnapian and Hirschian.

  4.  **"That is why the deflationists call these disputes 'merely verbal,' and it is also why their critics are unmoved: if every ontological dispute dissolves in this way, then for every existence question the answer is yes in some language and no in another, which is only a polite way of saying that everything exists."**
      *   **Accept:** This accurately states a major criticism ("Everything Exists"/"Ontological Relativism").
      *   **Wince/Clarify (Deflationist Reply):** Deflationists **vehemently deny** this is a consequence. Their response hinges on rejecting the premise that *any* conceivable language/framework is admissible. Frameworks must be:
          *   **Coherent/Non-defective:** They must have consistent rules and application conditions (e.g., no framework where "square circle" denotes an existing object).
          *   **Practically Viable/Useful:** They must serve some purpose (communication, prediction, explanation) within a form of life. Arbitrary, useless frameworks are dismissed.
          *   **(Thomasson) Grounded in Conceptual Rules:** Existence claims are only legitimate within frameworks governed by rules that determine application conditions. You can't just invent a framework where "ghosts exist" is true without providing coherent rules and evidence satisfying them within that framework.
      *   They argue the criticism illicitly assumes an absolute perspective ("exists *simpliciter*") that deflationism rejects. Within *any admissible* framework, "everything exists" is false – unicorns don't exist in English, numbers might not exist in Ontologese.

  5.  **"Nor does the dissolution even work. Call a dispute a revenge dispute when... they can still disagree about whether that paraphrase captured everything they originally meant. Any paraphrase can be challenged in this way, and the challenge is not a disagreement about any expression at all, so no diagnosis of verbality is ever stable."**
      *   **Accept:** This describes a logical possibility (a "revenge dispute").
      *   **Wince/Clarify (Deflationist Reply):** Deflationists have strong replies:
          *   **Goal of Paraphrase:** The point of the neutral paraphrase isn't necessarily to capture *every subtle connotation* but to isolate the core *ontological commitment* at stake. If both parties agree on the fundamental physical description of the world (particles arranged tablewise) and agree that *this description* is what settles the fundamental inventory, but *still* disagree about whether "there are tables" *in the fundamental sense*, then their disagreement *is* purely verbal – it's *only* about what "there are" *means* in this context. The paraphrase *has* succeeded in isolating the semantic difference.
          *   **Burden Shifts:** If, after accepting the neutral paraphrase of the physical facts, one party insists there's *still* a further fact about whether tables "really" exist *over and above* the particles arranged tablewise, the deflationist argues this demand is either:
              *   *Meaningless:* It presupposes a notion of "absolute existence" or "real existence" independent of any conceptual scheme, which deflationists reject.
              *   *A *Different* (and often incoherent) Question:* It might sneak in a different standard of existence not present in the original dispute or try to assert a metaphysical primitive "tableness" that deflationists deny.
          *   **Stability Achieved:** If both parties genuinely agree on the neutral physical description *and* agree that this description constitutes "what there is fundamentally," then further disagreement about the word "table" existing *fundamentally* is stablely diagnosed as verbal. The "revenge" challenge either misunderstands the goal or introduces a new, potentially defective, metaphysical question.

  6.  **"The honest conclusion is that we should stop trying to dissolve ontological disputes and go back to asking which side is simply right about what there is."**
      *   **Rejection (Deflationist View):** This is the *opposite* of the deflationist conclusion. They see this "back to metaphysics" move as precisely the mistake – assuming there *is* a single, absolute, perspective-independent answer to "what there is". They argue this leads to irresolvable pseudo-disputes.

  **Answers to Your Specific Questions:**

  1.  **Differences within the Deflationary Family in the Passage:**
      *   **Quantifier Meaning Difference (Hirsch):** Central to Hirsch. He emphasizes different languages with genuinely different quantifier meanings.
      *   **Practical Framework Choice (Carnap/Hirsch):** Central to both. Choosing a framework/language is pragmatic.
      *   **Appeal to Sortal Rules (Thomasson):** Central to Thomasson. She grounds existence in the application conditions derived from our conceptual/sortal rules.
      *   **Do they come apart?** Yes, subtly. Hirsch focuses on *languages* and quantifier *meaning variance*. Thomasson focuses on *conceptual schemes* and *internal conceptual truths*. Carnap focuses on *linguistic frameworks* and *external/internal questions*.
      *   **Would they disown claims?**
          *   Thomasson might downplay "different senses of 'there are'" in favor of "different kinds of questions (internal vs external)" or "misapplication of concepts". She might be less comfortable with the strong "no fact of the matter" phrasing, emphasizing instead the *easy* fact of the matter internally.
          *   Hirsch might be more comfortable with "no fact of the matter *absolutely*" but insists on facts *relative to languages*. He fully embraces the practical choice.
          *   All would reject the "everything exists" conclusion and the claim that dissolution doesn't work due to revenge disputes. All embrace the "merely verbal" diagnosis *for the targeted disputes* and the practical conclusion.

  2.  **The "Everything Exists" Objection:**
      *   **Status:** It is a **live, contested objection**, not a straightforward refutation. It's a major point of debate.
      *   **What it Needs to Go Through:** It needs the premise that **all possible meanings of "exists" or all possible linguistic frameworks are equally legitimate/metaphysically on par**. It needs the deflationist to admit *any* conceivable framework, no matter how arbitrary, inconsistent, or useless.
      *   **Do Deflationists Grant This Premise? Emphatically NO.** This is the core of their defense. They impose **constraints on admissible frameworks/meanings**: coherence, practical utility, integration with perception/action, non-arbitrariness. They argue only frameworks meeting these constraints are relevant, and within such frameworks, "everything exists" is false. The objection, they argue, begs the question by assuming an absolute standard of existence that allows the comparison of all frameworks as candidates for describing "what *really* exists".

  3.  **Revenge Disputes:**
      *   **Is the Phenomenon Real?** Yes, it's logically possible for someone to reject that a paraphrase captures "everything they meant," even after agreeing on the neutral facts.
      *   **Does the Argument for Instability Work?** **Not against competent deflationism.** The argument assumes that failure to capture *every possible connotation or intuition* means the verbality diagnosis fails. Deflationists reject this.
      *   **Strongest Deflationist Reply:**
          1.  The purpose of the neutral paraphrase is to isolate the *ontological commitment* – the claim about what *fundamental constituents* the world has. If both parties agree on the neutral description of the fundamental constituents (e.g., particles arranged tablewise) and agree that *this* is the description relevant to the "fundamental inventory" sense of "exists," then any *further* insistence that "tables *really* exist" in that fundamental sense *despite* the paraphrase **either**:
              *   (a) Reveals a misunderstanding of what "fundamental existence" *means* within the agreed context (it just *means* figuring in that inventory), making it verbal.
              *   (b) Illegitimately introduces a *new*, distinct, and often obscure metaphysical notion of "real existence" (e.g., as a primitive, non-physical property) that wasn't part of the original, more mundane, dispute. This new dispute might be substantive, but it's *different* from the one deflationism dissolved. Diagnosing the *original* dispute as verbal remains stable.
          2.  If the challenger cannot coherently explain what this extra "real existence" consists in beyond the agreed fundamental description, the challenge is empty or confused. The burden is on them to make sense of their demand.
      *   **Does the Essay's Final Recommendation Follow?** No. Even if revenge disputes occur, they don't show that the *original* dispute wasn't verbal, nor do they validate the quest for an absolute "simply right" answer. They might indicate a *new* (potentially defective) dispute has arisen.

  4.  **A Fair Summary of the Central Deflationist Claim:**
      *   Ontological questions about ordinary objects (tables, numbers, properties) are not deep metaphysical mysteries. Existence claims are internal to conceptual-linguistic frameworks. Their truth is settled by the rules of those frameworks combined with straightforward empirical evidence (e.g., "There are tables" is true in English because our rules for "table" apply to common perceptual experiences of midsized objects). Disputes where parties seem to disagree about existence while agreeing on all the underlying non-ontological facts (e.g., particle arrangements) are typically verbal, stemming from a conflation of different standards or kinds of questions (everyday vs fundamental). Ontology's remaining work involves clarifying concepts, resolving ambiguities, and choosing frameworks based on practical utility, not discovering mind-independent metaphysical primitives.

  **What's Left to Disagree About (on the Corrected Deflationist View):**

  1.  **Which frameworks are genuinely admissible?** Deflationists impose constraints (coherence, utility, etc.). Critics might argue these constraints are too weak, too strong, or themselves metaphysically loaded. *Nature:* Meta-ontological disagreement about the criteria for legitimate frameworks/questions.
  2.  **Is the quantifier really polysemous / are there really distinct existence concepts?** Or is Thomasson's internal/external or Carnap's analytic/synthetic approach better? *Nature:* Disagreement within deflationism about the best theoretical machinery.
  3.  **What are the precise application conditions for our sortals/concepts?** How do we resolve borderline cases or conceptual tensions? *Nature:* Conceptual analysis, sometimes involving empirical input.
  4.  **Which framework is *best* for purpose X?** Pragmatic evaluation of languages/conceptual schemes for specific goals (physics, biology, everyday life, mathematics). *Nature:* Practical, context-dependent deliberation.
  5.  **Can deflationism handle *all* ontological disputes?** Especially more abstract ones (e.g., abstract objects, temporal parts, possible worlds) or those where fundamental descriptions clash? Critics argue some disputes are substantive. *Nature:* Meta-ontological debate about the scope and success of the deflationist approach. Deflationists maintain these too often involve verbal elements or framework choices.

  **Work Remaining in Ontology (Deflationist View):**
  *   **Conceptual Analysis:** Clarifying the rules and application conditions of our concepts/sortals.
  *   **Resolving Ambiguity:** Identifying and untangling verbal confusions in philosophical debates.
  *   **Framework Engineering/Selection:** Developing and evaluating different conceptual-linguistic frameworks for their coherence, expressive power, and utility for various purposes (science, ethics, everyday life).
  *   **Explaining Conceptual Possibility/Necessity:** Understanding truths grounded in our conceptual schemes.
  *   **(Thomasson) Modal & Epistemological Work:** Explaining how we can know modal truths or have justified beliefs based on conceptual connections.

  Deflationists argue this work is vital, but it's fundamentally different from traditional metaphysics seeking to discover a privileged set of "really real" entities independent of human thought and language.
