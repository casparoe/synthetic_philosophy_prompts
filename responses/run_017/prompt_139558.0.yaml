  Below is the diagnostic decision tree designed to disentangle Hume's is-ought gap, Moore's naturalistic fallacy, and the open-question argument. The tree starts from the shared commitment that "torturing a child for amusement is wrong" and uses case-based or logical questions to sort views without invoking metaethical terminology. It has 7 nodes (under the 10-node constraint) and 9 leaves covering the required positions. The tree is tested against the six probe derivations, with each leaf's verdict on the probes, its most awkward commitment, and routing details provided.

  ### Decision Tree for Metaethical Views on Deriving 'Ought' from 'Is'

  **Node 1:** When you say "torturing a child for amusement is wrong," is this statement truth-apt? That is, is it the kind of thing that can be true or false, like "the sky is blue"?  
  - **Yes** → Go to Node 3.  
  - **No** → Go to Node 2.  

  **Node 2 (for No at Node 1):** When people say things like "it is true that torturing children is wrong," is this a legitimate way of talking, allowing moral claims to be used in logical arguments (e.g., "if lying is wrong, then encouraging lying is wrong")?  
  - **Yes** → **Quasi-realist expressivism**.  
  - **No** → **Non-cognitivist projectivism**.  

  **Node 3 (for Yes at Node 1):** Is the statement "torturing a child for amusement is wrong" actually true?  
  - **Yes** → Go to Node 4.  
  - **No** → **Error theory**.  

  **Node 4 (for Yes at Node 3):** Can the wrongness of an act like torture be fully explained by the act's descriptive features (e.g., "it causes suffering") without needing to add anything extra (like an attitude or intuition)?  
  - **Yes** → Go to Node 5.  
  - **No** → Go to Node 6.  

  **Node 5 (for Yes at Node 4):** Is the connection between the descriptive features (e.g., causing suffering) and wrongness grounded in a functional standard, like how a knife's design defines a "good knife" or how a human's biology defines a "flourishing life"?  
  - **Yes** → **Neo-Aristotelian naturalism**.  
  - **No** → Go to Node 5a.  

  **Node 5a (for No at Node 5):** Is the connection between the descriptive features and wrongness knowable by reason alone, without needing to observe the world?  
  - **Yes** → **Reductive or analytic ethical naturalism**.  
  - **No** → **Non-reductive (synthetic, a posteriori) ethical naturalism**.  

  **Node 6 (for No at Node 4):** Is the wrongness of an act like torture grounded in what the agent values, commits to, or would endorse after rational reflection (e.g., because torturing conflicts with valuing humanity)?  
  - **Yes** → **Constructivism**.  
  - **No** → Go to Node 7.  

  **Node 7 (for No at Node 6):** Is the wrongness of an act like torture grounded in the rules of a social practice, institution, or role (e.g., the way "promising" creates an obligation)?  
  - **Yes** → **Institutional normativity (gap only apparent)**.  
  - **No** → **Moorean non-naturalism**.  

  ### Leaves (Metaethical Positions)
  Each leaf includes:
  - **Probes accepted**: Which of the six derivations are treated as valid or valid enthymemes (with a hidden premise the view endorses).
  - **Probes refused**: Which derivations are invalid.
  - **Most awkward commitment**: A key challenge or counterintuitive implication of the view.

  1. **Non-cognitivist projectivism**  
     - **Probes accepted**: None. Refuses all as invalid (conclusions express attitudes, not truth-apt claims).  
     - **Probes refused**: All (1–6).  
     - **Most awkward commitment**: Cannot treat moral arguments as logically valid, making moral disagreements seem like mere clashes of emotion.  

  2. **Quasi-realist expressivism**  
     - **Probes accepted**: All (1–6) as valid enthymemes with a hidden premise expressing a conative attitude (e.g., "one ought to fulfill promises" for Probe 2).  
     - **Probes refused**: None as written, but all require an added attitude premise to be valid.  
     - **Most awkward commitment**: Must "mimic" moral truth without robust moral properties, risking inconsistency.  

  3. **Error theory**  
     - **Probes accepted**: None. Refuses all as invalid (moral conclusions are systematically false).  
     - **Probes refused**: All (1–6).  
     - **Most awkward commitment**: Denies common moral truths (e.g., torture is wrong) while explaining why we believe them.  

  4. **Reductive or analytic ethical naturalism**  
     - **Probes accepted**: All (1–6) as valid enthymemes with a hidden analytic bridge premise (e.g., "bad bread knife" analytically implies failure to slice bread for Probe 1).  
     - **Probes refused**: None as written, but all require an added conceptual truth to be valid.  
     - **Most awkward commitment**: Must defend that moral terms (e.g., "wrong") can be fully defined by descriptive concepts without residue.  

  5. **Non-reductive (synthetic, a posteriori) ethical naturalism**  
     - **Probes accepted**: All (1–6) as valid enthymemes with a hidden synthetic identity premise (e.g., "wrongness is identical to causing suffering" for Probe 6, discovered a posteriori).  
     - **Probes refused**: None as written, but all require an added empirical identity claim to be valid.  
     - **Most awkward commitment**: Posits synthetic identities without a clear method for discovery, risking arbitrariness.  

  6. **Neo-Aristotelian naturalism**  
     - **Probes accepted**: All (1–6) as valid (derivations appeal to functional standards: artifacts in 1, social roles in 2 and 5, biological needs in 4, instrumental reason in 3, and flourishing in 6).  
     - **Probes refused**: None.  
     - **Most awkward commitment**: Must ground normativity in species-typical functioning, which may not apply to agents who reject their "nature."  

  7. **Constructivism**  
     - **Probes accepted**: All (1–6) as valid enthymemes with a hidden premise about the agent's practical standpoint (e.g., "Viren is committed to efficiency" for Probe 3).  
     - **Probes refused**: None as written, but all require an added commitment-based premise to be valid.  
     - **Most awkward commitment**: Derives normativity from contingent commitments, risking relativism if agents lack relevant values.  

  8. **Institutional normativity (gap only apparent)**  
     - **Probes accepted**: 1 (artifact function), 2 (promising practice), 4 (parental role), 5 (testimony institution) as valid (premises describe institutional facts that are partly normative).  
     - **Probes refused**: 3 (lacks institutional basis) and 6 (lacks institutional/functional context) as invalid.  
     - **Most awkward commitment**: Reduces moral obligations to social practices, making them contingent on cultural norms.  

  9. **Moorean non-naturalism**  
     - **Probes accepted**: None. Refuses all as invalid (normative conclusions require a non-natural, irreducible property not in the premises).  
     - **Probes refused**: All (1–6).  
     - **Most awkward commitment**: Posits non-natural properties that are epistemically mysterious (known by intuition, but how?).

  ### Probe Derivations: Treatment by the Tree
  Each probe is tested against the tree to show where it branches and why it is accepted or refused. All probes have purely descriptive premises as written.

  1. **Bread knife probe**:  
     - **Tree path**: Reaches Node 5 (functional standard).  
     - **Verdict**: Valid for neo-Aristotelian naturalism (due to artifact function); valid enthymeme for analytic/synthetic naturalism (hidden bridge premise) and constructivism/institutional (hidden commitment/institution); invalid for others due to lack of normative basis.  
     - **Why**: Functional standards (like knife design) directly imply evaluative conclusions if functional norms are endorsed.  

  2. **Promising probe**:  
     - **Tree path**: Reaches Node 7 (institutional fact).  
     - **Verdict**: Valid for institutional normativity (promising practice creates obligation); valid enthymeme for quasi-realism, naturalisms, and constructivism (hidden attitude/bridge/commitment); invalid for projectivism, error theory, and non-naturalism (no normative input).  
     - **Why**: Institutional facts (e.g., "I promise") are already partly normative, closing the gap.  

  3. **Train probe**:  
     - **Tree path**: Reaches Node 6 (agent-relative norm).  
     - **Verdict**: Valid for neo-Aristotelian naturalism (instrumental function); valid enthymeme for constructivism and quasi-realism (hidden commitment/attitude); invalid for others (e.g., non-naturalism sees it as lacking categorical force; institutional refuses due to no institution).  
     - **Why**: Hypothetical "oughts" (relative to desires) are derivable if desires/commitments are included; without them, it's invalid.  

  4. **Parental care probe**:  
     - **Tree path**: Reaches Node 5 (biological function).  
     - **Verdict**: Valid for neo-Aristotelian naturalism (biological role); valid enthymeme for naturalisms and constructivism (hidden bridge/commitment); invalid for others (e.g., non-naturalism demands non-natural input).  
     - **Why**: Biological needs imply functional norms if life-form standards are accepted.  

  5. **Oath probe**:  
     - **Tree path**: Reaches Node 7 (institutional/social function).  
     - **Verdict**: Valid for neo-Aristotelian naturalism (social function) and institutional normativity (testimony institution); valid enthymeme for others except projectivism/error theory/non-naturalism.  
     - **Why**: Social persistence facts imply norms if institutions or functions are normative.  

  6. **Suffering probe**:  
     - **Tree path**: Reaches Node 4 (direct normative property).  
     - **Verdict**: Valid for neo-Aristotelian naturalism (flourishing); valid enthymeme for naturalisms and constructivism (hidden bridge/commitment); invalid for others due to no normative premise.  
     - **Why**: Descriptive suffering only entails "wrong" if a bridge (e.g., identity/constitution) or commitment connects them; non-naturalism sees a gap.

  ### Empty Cell and Unsplittable Pairs
  - **Empty cell**: The path Node 1: Yes, Node 3: No, Node 4: Yes (truth-apt moral judgments, but none are true, and moral properties are natural). This cell is vacant because it is incoherent: if moral properties are natural (and thus exist), some moral judgments must be true, contradicting the error-theoretic claim that none are true.  
  - **Unsplittable pairs**: The tree cannot distinguish:  
    - Kantian vs. Humean constructivism (both under **Constructivism**). To split, ask: "Is the practical standpoint based on pure reason or contingent desires?" This is unsuitable for a 10-minute exercise because it requires nuanced debate about rationality and desire, which is too complex for quick diagnosis.  
    - Robust vs. quietist non-naturalism (both under **Moorean non-naturalism**). To split, ask: "Are non-natural properties part of the causal order?" This is unsuitable because it involves metaphysical commitments beyond the tree's focus on derivations.

