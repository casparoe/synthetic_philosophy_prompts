answer: |-
  ## Proposal: Calibrating the Evidence for the Church-Turing Thesis

  **1. The Core Question:** Can the remarkable convergence of formal models (Turing machines, λ-calculus, general recursiveness, etc.) on the same class of computable functions genuinely serve as evidence that these models track an independent, pre-theoretical concept of "effective computability"? Or is this convergence primarily an artifact of how later models were explicitly or implicitly calibrated against the established class defined by their predecessors?

  **2. Why Existing Positions Leave This Open:** The standard account acknowledges that the Church-Turing Thesis (CTT) cannot be *proved* deductively due to its bridging of informal and formal concepts. It then points to the convergence of formalisms as overwhelming inductive evidence. However, this argument largely assumes the convergence reflects independent discovery, neglecting the historical context of development. Critics (e.g., skeptical philosophers, hypercomputation advocates) often challenge the thesis directly but rarely scrutinize the *structure* of the convergence evidence itself. The possibility that the convergence results from methodological calibration within a developing field, rather than independent tracking, hasn't been systematically analyzed for its epistemic implications on the CTT's core status. This gap exists because the focus has been on the *truth* of the CTT or its physical scope, not the *evidential weight* of its primary support.

  **3. Disambiguating the Thesis:** The "Church-Turing Thesis" is ambiguous. My project specifically examines:
      *   **Narrow CTT:** The claim that any function effectively computable by an algorithm (intuitive notion) is computable by a Turing machine (formal notion), and vice-versa. *This is the primary target of the convergence argument and my calibration worry.*
      *   **Physical CTT:** The claim that no physically realizable process can compute a function outside the Turing-computable class. (The calibration worry *indirectly* impacts this; if the narrow CTT's evidence weakens, the justification for assuming this stronger physical claim based solely on the narrow CTT weakens).
      *   **Efficiency (Feasibility) CTT:** Concerns about what is computable *in practice* with bounded resources (e.g., P vs NP). *My calibration worry is largely orthogonal to this.*
      *   **Normative CTT:** The practice of treating a proof of Turing-uncomputability as providing conclusive, field-wide normative reason to cease searching for an algorithmic solution, effectively closing the question. *This is critically impacted.* If the convergence evidence underpinning the narrow CTT is weaker than assumed, the justification for this powerful normative practice requires re-examination. **The calibration worry most directly challenges the evidential basis of the Narrow CTT and, consequently, the normative authority often granted to uncomputability results derived from it.**

  **4. Proposed Method: Conceptual Analysis First, Bounded Historical Test Second:**
  My core method avoids collapsing into pure historical archival work or cataloging exotic computational models:
      *   **Phase 1: Conceptual Discrimination Criteria:** Before examining historical cases, I will rigorously define the logical signatures distinguishing "genuine tracking" from "calibration." Crucially, this includes:
          *   **Treatment of "Near Misses":** What happens when a proposed formalism relaxes an intuitive constraint (e.g., allowing infinite steps, real-number parameters, oracles) and yields a *strictly larger* class? Under "genuine tracking," such models should be rejected based on violating the *intuitive constraints* of "mechanical procedure" alone. Under "calibration," rejection might primarily rely on the model *failing to deliver the expected (Turing-computable) class*, even if the intuitive violation seems minor or defensible. The key is whether the criteria for rejection are demonstrably independent of prior knowledge of the target class.
          *   **Predictive Signatures:** What pattern of model development, acceptance, and rejection would we expect under each hypothesis? For instance, genuine tracking might predict more independent *discovery* of equivalent models based purely on intuitive constraints, while calibration might predict later models being explicitly designed or modified *to capture* the class defined by the first successful formalisms (like Turing machines).
      *   **Phase 2: Bounded Historical Analysis:** Only after establishing these conceptual criteria will I engage with the historical record. This analysis will be strictly bounded: examining the development and justification of key, foundational formalisms (e.g., Gödel/Herbrand's general recursiveness, Church's λ-calculus, Turing's machines, Post's systems) specifically for evidence matching the "tracking" or "calibration" signatures identified in Phase 1. The focus is not on exhaustive biography, but on whether the *stated justifications* for accepting or rejecting formalisms (especially near misses) align more with independent appeal to intuition or with conformity to an emerging standard class.
      *   **Why this Ordering?** This approach prioritizes conceptual clarity over historical narrative. It avoids the pitfalls of:
          *   *Pure History:* By using history to *test* pre-defined conceptual hypotheses, not as the primary source of the question.
          *   *Realism/Anti-realism Debates:* By focusing on the *structure of evidence* rather than rehashing metaphysical commitments.
          *   *Hypercomputation Catalogues:* By concentrating on the *criteria for adequacy* of mainstream formalisms and near-misses, not exotic models per se. It asks *why* certain models were accepted/rejected, not just what exists.

  **5. Possible Conclusions and Their Implications:**
  If the calibration worry survives scrutiny (i.e., if the historical analysis strongly favors the calibration signature), the epistemic status of the Narrow CTT shifts significantly. It becomes less plausible as a *discovery* about an independent platonic realm. Alternative interpretations gain prominence:
      *   **Stipulation:** Defining "computable" as "Turing-computable."
      *   **Explication (Carnap):** A fruitful refinement of a vague concept, assessed pragmatically (fit, fruitfulness), not for truth.
      *   **Constitutive Convention:** A rule defining the shared practice of computability theory.
      *   **Low-grade Empirical Hypothesis:** Based on limited, potentially biased, evidence.
      The decision among these hinges on: the strength of the calibration evidence, the availability of independent justifications for the intuitive constraints, and the role the thesis plays in practice.
      **Addressing the Normative Practice:** Crucially, even a deflationary reading (e.g., stipulation, convention) *need not undermine* the practical authority of uncomputability results. Their authority could rest on the immense *fruitfulness* and *stability* of the Turing framework within mathematics and computer science, and the practical impossibility of finding effective procedures outside it. The project will directly assess whether a deflationary view *requires* us to see the normative practice (treating uncomputability as conclusive reason to stop) as misplaced, or whether it can be robustly justified on pragmatic/conventional grounds.

  **6. Scope, Feasibility, and Failure:**
  *   **Scope:** This project is ambitious for one year. Key constraints include:
      *   Focusing on the foundational period (1930s) and key early models for the historical analysis.
      *   Developing the conceptual criteria rigorously but without getting bogged down in endless metaphysical refinements.
      *   Explicitly bracketing the Physical and Efficiency CTTs to maintain focus on the Narrow and Normative aspects.
  *   **What Constitutes Failure (vs. Unexpected Outcome):** This project would **fail** if:
      1.  **The Calibration/Tracking Distinction Proves Inoperable:** If no clear, non-question-begging criteria can be formulated to distinguish the two patterns conceptually, making the core question unassessable.
      2.  **The Distinction Lacks Downstream Bite:** If, even if calibration is demonstrated, it makes *no significant difference* to our assessment of the CTT's epistemic status or the justification for the normative practice. For example, if the practical fruitfulness of the framework remains the sole compelling justification regardless of the convergence evidence's origin, the project's challenge dissipates.
      3.  **Historical Analysis Proves Indeterminate:** If the bounded historical examination yields insufficient evidence to favor either signature strongly, leaving the worry unresolved without providing new insight.
      Success is *not* contingent on *confirming* the calibration worry; demonstrating that the convergence evidence is robust against it would be a valuable result. Failure occurs only if the project's central investigative tool (the calibration/tracking distinction) or its core question collapses.

  **7. Deliverable:** This fellowship year will fund the research and writing of the first of three planned papers, focused on developing the conceptual framework (Phase 1) and presenting the initial bounded historical analysis (Phase 2) to assess the viability and initial evidence for the calibration worry regarding the Narrow CTT and its implications for the Normative practice.
