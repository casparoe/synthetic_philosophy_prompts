prompt: |-
  I'm in a final-year metaphysics seminar on laws of nature, and I am trying to work out what our professor actually thinks before the last class. All term she has been dodging one question — whether the laws of a world are fixed by everything that happens in it — and she has promised to answer it in the final session. That session is next week, and she has circulated the case in advance. I would like you to help me predict her verdict on it, and, more importantly, to work out which rule she is really running.

  Here is her track record on the ten cases we have done so far.

  1. "Every sphere of gold is less than a mile across" — not a law, despite having no exceptions.
  2. "Every coin in my pocket on my birthday was silver" — not a law.
  3. Newton's inverse-square law of gravitation — a law, even though no actual pair of bodies exactly conforms to it, so that read as a universal generalization it is strictly false.
  4. The ideal gas law — not a law; a useful approximation that falls out of the genuine laws together with special assumptions about actual gases.
  5. Mendel's law of independent assortment — not a fundamental law; a ceteris paribus regularity that lapses for linked genes.
  6. Conservation of energy, and the Pauli exclusion principle — both laws. Of the second she added that the direction of explanation runs from the law to the stability of matter, not from the observed stability of matter to the law.
  7. Moore's law — not a law.
  8. The generalization "grue" (a thing is grue just in case it is first observed before 2050 and green, or not first observed before 2050 and blue): "all emeralds are grue" is not a law. But she said this was the case she was least happy with, because the machinery that is supposed to decide these questions for her — simplicity, breadth, fit with the totality of what happens — seems to score grue exactly as well as green.
  9. The values of the fundamental constants — not laws, on her view, but boundary conditions. She flagged this as the verdict she would be most willing to surrender.
  10. The near-coplanarity of the planetary orbits — not a law but an accident of the solar system's formation, despite holding across a large and tidy domain.

  In week 3 someone asked whether two worlds in which exactly the same particular things happen could have different laws. She said that was the question the whole seminar was circling, and that she would answer it in the final class. The case she has now circulated is this.

  World W contains, for its entire history, exactly one particle, coasting at constant velocity; nothing else ever exists in W. W's physicists have two candidate fundamental theories, which are equally simple and equally well confirmed by everything that happens in W:

  T1: every particle moves at constant velocity.
  T2: every particle moves at constant velocity, and any two particles that came within a nanometre of one another would repel.

  The single particle in W also has a property — call it Q — which manifestly does nothing there, since there is nothing for it to interact with.

  Her three questions: (a) is the repulsion clause in T2 a law of W? (b) does W have a law about what Q does? (c) had there been two particles in W, would they have repelled?

  What I want from you: predict her verdict on (a), (b) and (c); then set out the two or three rules that fit her ten verdicts equally well — as far as I can tell some kind of best-system or regularity account, some kind of governing or nomic-necessity account, and some kind of dispositional-essentialist account are all still in play — and say exactly what each of them predicts about W, including about (c) given its answer to (a). Then tell me which rule best explains her track record, taking the asides in 6, 8 and 9 as seriously as the verdicts themselves, and why. Finally, tell me which further case I should put to her in the seminar to separate whichever rules you think are still tied, and what a yes and a no on that case would each show.

  Please keep the treatment of each rule to a few sentences, do not reach for references — I want the argument, not the literature — and end with a single line of exactly this form, with each blank filled by yes, no, or indeterminate:

  \answer{(a) ___, (b) ___, (c) ___}
reasoning: |-
  Hmm, the user is in a metaphysics seminar on laws of nature and wants to predict their professor's stance on a final case study. They've provided detailed track records of the professor's verdicts on ten previous cases and want me to analyze them to determine her underlying principles.

  Looking at the ten cases, I notice several key patterns:

  1. The professor rejects accidental regularities as laws (cases 1, 2, 7, 10)
  2. She accepts fundamental physical laws even when they're idealized or require ceteris paribus clauses (cases 3, 6)
  3. She distinguishes laws from derived principles or boundary conditions (cases 4, 5, 9)
  4. She clearly separates laws from observed regularities (case 6 explanation direction)
  5. She struggles with Goodman's grue paradox (case 8) but still rejects it as a law

  The final case involves a world with only one particle and two candidate theories. The professor's track record suggests she likely follows a sophisticated best-system account (like Lewis's) where laws are theorems of the system that best balances simplicity and strength. This explains why she rejects accidental regularities (they're not simple/strong enough) and accepts fundamental laws (they're integral to the best system). 

  For the final case:
  - (a) T2's repulsion clause wouldn't be a law since it adds no explanatory power in a one-particle world
  - (b) No law about Q since it plays no role
  - (c) Indeterminate - counterfactuals aren't fixed by actual laws alone

  The alternatives (governing view or dispositional essentialism) would likely say T2 could be a law (governing view) or that (c) would be determined (dispositionalism), but these don't fit her rejection of unused clauses or her stance on boundary conditions.

  Her comments in cases 6, 8 and 9 support this: she emphasizes explanation direction (best-system) over observed regularities, acknowledges grue as problematic for simplicity metrics, and considers fundamental constants as contingent - all consistent with a Humean framework.

  To test this further, I'd propose a world with multiple particles where T1 and T2 both fit perfectly but T2 is simpler. Her response would confirm whether she prioritizes simplicity over unused content (best-system) or requires all content to be "active" (dispositionalism).

  Based on her track record, the predicted verdicts are:
  (a) No - the repulsion clause isn't a law
  (b) No - no law about inert property Q
  (c) Indeterminate - not fixed by actual laws alone
answer: |-
  Based on your professor's ten verdicts and her asides, her underlying rule is a **refined best-system account** (Humean reductionism), where laws are the theorems of the simplest, strongest system that best summarizes the particular facts of a world. Simplicity and strength are balanced, but *idle content* (clauses that do no explanatory or descriptive work) is penalized. This fits her rejection of unused generalizations (cases 1, 2, 4, 5, 7, 10), her acceptance of idealized laws (3, 6), her struggle with grue (8), and her view of constants as contingent (9). Her emphasis on explanation "running from the law" (case 6) is Humean: laws supervene on the mosaic but are explanatory within it.

  ### Predictions for W:
  - **(a) Is the repulsion clause in T2 a law?**  
    **No.** T2 adds idle content (repulsion for non-existent particles) without improving descriptive strength or simplicity relative to T1. This mirrors case 1 (gold spheres) and case 10 (planetary coplanarity): unused clauses don't become laws.  
  - **(b) Does W have a law about Q?**  
    **No.** Q does nothing and isn't mentioned in T1/T2. Including it would be like case 2 (coins in pocket)—an accidental, non-nomic property.  
  - **(c) Had there been two particles, would they repel?**  
    **Indeterminate.** The best-system account fixes laws from actual facts. Since no second particle exists, the repulsion clause isn't part of W's laws. Counterfactuals like this are not determined by the actual laws alone (similar to her view in case 9: constants could have been different).  

  ### Alternative Rules and Their Predictions:
  1. **Best-system account (refined):**  
     As above: (a) No, (b) No, (c) Indeterminate. Idle clauses reduce simplicity without strength gain.  
  2. **Governing view (non-Humean necessity):**  
     Laws are metaphysically necessary. T2 *could* be a law if "repulsion" is essential to particles.  
     → (a) Yes or No (contingent on which theory "governs"), (b) Indeterminate (no data), (c) Yes (if T2 is true).  
     *Fails cases 3 (idealized laws are false) and 9 (constants contingent).*  
  3. **Dispositional essentialism:**  
     Laws arise from intrinsic dispositions. Repulsion might be a disposition of particles, even if unmanifested.  
     → (a) Yes, (b) No (Q has no dispositional role), (c) Yes.  
     *Fails cases 1 (gold spheres have no disposition for size) and 4 (ideal gas law isn't fundamental).*  

  ### Why Best-System Wins:
  - **Case 6:** She rejects inferring laws *from* regularities (e.g., stability of matter), instead seeing laws as explanatory summaries. This is Humean.  
  - **Case 8:** Her frustration with grue shows she prioritizes *natural* simplicity (which excludes grue-like predicates), not just formal metrics. T2’s repulsion clause is similarly "unnatural" in W.  
  - **Case 9:** Treating constants as contingent boundary conditions (not laws) aligns with Humeanism. Governing/dispositional views often treat them as necessary.  

  ### Test Case to Separate Rules:
  **Propose:** *A world with two particle types: Type A always attracts type B, but no type B exists. Is "Type A attracts type B" a law?*  
  - **Best-system:** No. The clause is idle; excluding it simplifies without loss.  
  - **Governing view:** Yes, if attraction is a necessary relation.  
  - **Dispositional essentialism:** Yes, if attraction is a disposition of type A.  
  Her "yes" would support non-Humeanism; "no" confirms best-system.  

  \answer{(a) no, (b) no, (c) indeterminate}
