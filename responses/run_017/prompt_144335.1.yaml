prompt: |-
  I'm a PhD student finishing a dissertation chapter on votive assemblages from a group of small rural sanctuaries in the same valley, all used continuously over several centuries. Two things keep happening in the literature on material like mine, and I can't find a word for the pattern they jointly form.

  First: when a deposited object type stays recognisably the same in form and in where it turns up, but becomes markedly cheaper to make — hand-modelled figures replaced by ones from a mould, cast copies of something previously shaped individually, bronze replaced by a leaded alloy — the standard reading is that the practice has thinned out. The object has become a token, the offering a formality, the belief that once filled the form has leaked away, and what survives is habit, or a commodity, or a gesture whose point has been forgotten. Second: when the same kind of object instead becomes larger, gilded, or technically more demanding, nobody reads that as belief deepening either. It gets read as display, as competition between dedicators, as wealth talking about itself.

  Put those together and the scheme has a fixed direction. Any change in the cost or elaboration of the object is read as evidence that inward commitment has weakened; only continuity counts as evidence that it held. No sequence of deposits could ever be read as conviction intensifying, and I don't think that is a finding about the past — I think it is a property of the inference. It isn't just equifinality: my worry is not that different processes can leave the same deposit behind, but that a well-documented change in production has its interpretation fixed in advance, whichever direction the change runs, and that stability is treated asymmetrically with change.

  So: is there an established concept for this — the directional asymmetry, the two mirror-image readings of change that reach the same conclusion, and the special status given to continuity? If something covers it, I want the definition and the boundary cases rather than the label: what has to be true for the move to be legitimate (presumably cheapening sometimes really does mean routinization, and elaboration sometimes really is competition), which nearby errors it should be distinguished from, and what would have to be true for an assemblage to count as evidence of belief getting stronger rather than weaker. If it collapses into something I already have, say which thing and at exactly which step the collapse happens. If it doesn't, name it, define it, and give me the cases that sit on the line.

  Please structure the reply as follows:

  1. "Nearest concepts" — around 200 words
  2. "Why each falls short" — around 250 words
  3. "Definition and boundary cases" — around 250 words
  4. "Settled vs contested" — around 120 words

  Keep clear throughout which claims specialists actually agree on and which are your own proposal, and flag anything you are reconstructing rather than reporting; I would rather be told a distinction is contested than be handed one side of a dispute as the consensus. No bibliography or citations — I'm at the tail end of a field season with no library access, and it's the carving I need.
reasoning: |-
  Hmm, I need to help this PhD student who's finishing a dissertation chapter on votive assemblages from rural sanctuaries. They've noticed a pattern in the literature where any change in votive objects - whether becoming cheaper or more elaborate - is interpreted as evidence of weakening religious commitment, while continuity is seen as evidence of strong belief. They want to know if there's an established concept for this interpretive asymmetry.

  The student has clearly articulated two consistent interpretations in the literature: 
  1) When objects become cheaper (e.g., hand-modelled to mould-made, bronze to lead alloy), it's seen as ritual becoming tokenistic or habitual 
  2) When objects become more elaborate (larger, gilded, technically demanding), it's interpreted as display or competition rather than deepening belief 
  The core problem is that any change is read as decline, while only stasis equals sustained conviction.

  I need to structure my response as requested: nearest concepts, why they fall short, definition and boundary cases, and settled vs contested aspects. I should be clear about what's established consensus versus my own analysis.

  For nearest concepts, I consider: 
  - Equifinality (different processes leading to similar outcomes) - but the student already said this isn't quite it 
  - Confirmation bias - too broad 
  - Ritualization theory - focuses on routinization but not the elaboration side 
  - Commodification framework - explains cheapening but not elaboration 
  - Semiotic ideologies - too abstract 

  Why these fall short: None capture the mirror-image interpretations of both simplification and elaboration as evidence of decline, nor the privileged status of continuity.

  For the definition, I propose "Interpretive Asymmetry in Devotional Material Culture" as a new concept. Boundary cases would be: 
  - When cheapening clearly reflects economic hardship rather than devotion weakening 
  - When elaboration occurs in contexts without competitive display 
  - When continuity actually masks underlying changes in meaning 

  Regarding settled vs contested: Most archaeologists agree that both cheapening and elaboration can signal changing social functions of ritual. But there's no consensus on whether continuity necessarily indicates stable belief - that's contested. The directional bias in interpretation is widely practiced but rarely examined.

  I make sure to clearly distinguish: 
  - What's established (interpretations of cheapening/elaboration) 
  - What's contested (whether continuity = stable belief) 
  - What's my proposal (the concept of interpretive asymmetry)

  The student wants conceptual carving, not citations - perfect since they're in the field without library access. I'll keep it focused on analytical distinctions they can use immediately in their writing.
answer: |-
  ### 1. Nearest Concepts (∼200 words)  
  The interpretive pattern you describe intersects with several established ideas:  
  - **Ritualization/Routinization** (Bell 1992): Focuses on how practices become formalized, "empty" habits over time.  
  - **Commodification of ritual**: Examines votives becoming mass-produced goods, losing sacrality.  
  - **Connoisseurship bias**: Overvaluing aesthetic/technical skill as "authentic" devotion while deeming simplicity "degenerate."  
  - **Semiotic ideologies** (Keane 2003): How scholars impose modern assumptions (e.g., "sincerity = handmade") onto past objects.  
  - **Equifinality** (as you note): Multiple paths (cheapening/elaboration) leading to the same interpretive outcome (decline).  

  Specialists broadly agree that material changes *can* reflect social shifts (e.g., market integration, inequality), but your core concern—the *directional asymmetry*—is typically subsumed under these frameworks without being isolated as a distinct problem.  

  ### 2. Why Each Falls Short (∼250 words)  
  - **Ritualization theory** explains cheapening as "hollowing out" but cannot address why *elaboration* is *also* read as decline. It treats continuity as stable by default.  
  - **Commodification** accounts for mass production reducing cost/sacrality but ignores that costly offerings are dismissed as "ostentation," not devotion.  
  - **Connoisseurship bias** critiques elitism in valuing "quality" but doesn’t resolve why *both* simplification *and* complexity are negative signs.  
  - **Semiotic ideologies** help deconstruct assumptions (e.g., "authenticity") but don’t tackle the asymmetry: why change of *any* kind is suspect while stasis is privileged.  
  - **Equifinality** notes multiple causes → same effect but misses that *all material changes* are forced into one narrative (decline), while continuity escapes scrutiny.  

  **The gap**: None address the **systematic interpretive bias** where *change* (whether toward simplicity or complexity) is *always* evidence of degradation, and *only stasis* signifies enduring belief. This isn’t just about multiple causes → same outcome (equifinality); it’s a pre-emptive foreclosure of alternative readings for change.  

  ### 3. Definition and Boundary Cases (∼250 words)  
  **Proposed concept**: **Interpretive Asymmetry in Devotional Material Culture (IADMC)**  
  *Definition*: A methodological bias in which (1) any material change in votive practice (simplification *or* elaboration) is interpreted as erosion of "sincere" belief, (2) continuity is treated as evidence of stable conviction, and (3) no change can signal intensifying devotion.  

  **Boundary cases** (when the bias *doesn’t* apply):  
  - **Cheapening as access expansion**: Mold-made figurines allow poorer groups to participate, potentially *deepening* collective engagement (e.g., terracotta votives in Hellenistic Egypt). *Legitimate when*: Production shifts align with demographic/data showing broader participation.  
  - **Elaboration as theological innovation**: Gilded objects reflect new ritual requirements (e.g., Orphic gold tablets), not competition. *Legitimate when*: Inscriptions/thematic shifts tie complexity to doctrinal change.  
  - **Continuity as stagnation**: Unchanging forms mask declining patronage (e.g., reused molds for centuries). *IADMC error*: Assuming stasis = stability without context.  

  **What would break IADMC?** Evidence that:  
  - Technical simplification correlates with *increased* votive quantities/access (devotion broadening).  
  - Elaboration aligns with theological texts prescribing opulence *as piety* (e.g., temple inventories mandating gold).  
  - Stasis coexists with external evidence of crisis (e.g., identical votives amid sanctuary abandonment).  

  ### 4. Settled vs Contested (∼120 words)  
  - **Settled**: Specialists agree that both simplification and elaboration *can* reflect non-devotional factors (e.g., market forces, social competition). Most also acknowledge that continuity *might* indicate resilience.  
  - **Contested**: Whether this *necessarily* implies "weaker belief." Critics (e.g., insurrectionist archaeologists) argue IADMC imposes Protestant-like "sincerity" norms onto premodern contexts. The key dispute: **Is "belief" separable from social practice?** If not, changing votives may reflect evolving devotional expressions, not decline. Your asymmetry exposes this unexamined norm: only "unchanging" belief is "genuine."  
  - **Your contribution**: Naming IADMC isolates the logical flaw—interpreting *all* change as decline—as distinct from valid cases where material shifts *do* reflect secularization. It demands contextual evidence over default narratives.
