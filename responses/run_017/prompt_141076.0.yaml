  Okay, the user has presented a fascinating linguistic and philosophical problem based on their extensive experience with workplace grievances. They're observing a distinction between two types of speech acts: those that require reciprocal acknowledgment to be valid (like bets or offers) versus those that stand complete upon utterance (like apologies or promises). 

  The user is clearly deeply familiar with J.L. Austin's speech act theory but finds existing categories insufficient. Their examples are nuanced - especially how some verbs (like promise) seem to shift categories depending on context, and how people retroactively date agreements. The "I forgive you" example adds emotional complexity. 

  This isn't just academic curiosity. Their workplace context suggests practical needs: they likely want better frameworks to navigate grievance procedures, perhaps to clarify when an apology "counts" or when a promise is binding. The frustration with oversimplified labels hints they've encountered shallow analyses before. 

  The core challenge is disentangling two variables: directionality (does the act target someone?) and conditionality (does it require uptake?). Austin's locution/illocution/perlocution doesn't quite map to this. Searle's direction of fit helps but misses the uptake requirement. 

  For the shifting verbs issue, we should emphasize how social contracts redefine individual speech acts - a promise in isolation is unilateral, but when embedded in negotiation it becomes transactional. The retroactive dating phenomenon reveals how we narrate social reality: the "bet" only becomes narratable once reciprocal. 

  The forgiveness example beautifully illustrates cultural/personal variability in uptake requirements - some see it as self-contained emotional release, others as relational repair requiring acceptance. This cultural dimension might be worth exploring further given their workplace context. 

  They're clearly a sophisticated thinker - we can skip basic speech act explanations and dive straight into synthesizing new categories. The proposal should preserve their observed complexities while offering practical analytical tools.
answer: |-
  This is an exceptionally sharp observation of a fundamental distinction in performative language that isn't adequately captured by standard speech-act theory categories. You're right that the classic "illocutionary act" (the act performed *in* speaking) doesn't differentiate between these two crucial types. Let's dissect it, name the types, and address your complications.

  ## The Distinction: Self-Executing vs. Ratification-Dependent Illocutionary Acts

  The core difference lies in **whether the illocutionary act requires explicit, reciprocal recognition (ratification) from a specific addressee to be fully constituted as a social fact.**

  1.  **Self-Executing (or Autarkic) Illocutionary Acts:**
      *   **Definition:** The act is fully performed and socially constituted *solely* by the speaker's utterance, assuming felicity conditions (sincerity, authority, context) are met. It does not require any specific verbal or behavioral response from the addressee to *be* the act. The effect is primarily on the speaker's own status or commitment.
      *   **Mechanism:** The utterance itself changes the speaker's position or creates a social fact *about the speaker*.
      *   **Examples:**
          *   "I am sorry for what I did." (Apology - The speaker *is now* apologetic; they have acknowledged fault.)
          *   "I won't mention it to anyone." (Promise - The speaker *is now* committed to silence, creating an obligation *for themself*.)
          *   "I resign." (Resignation - The speaker *is now* resigned, altering their employment status.)
          *   "I name this ship the *Queen Anne*." (Christening - The ship *is now* named, assuming the speaker has authority.)
          *   "I swear to tell the truth..." (Oath - The speaker *is now* under oath.)
      *   **Key:** The act is complete upon utterance. Acceptance, forgiveness, or consequences (perlocutionary effects) are separate matters. Rejection might make the act socially ineffective or unwelcome, but it doesn't negate the *fact* that the apology/promise/resignation *occurred*.

  2.  **Ratification-Dependent (or Synallagmatic) Illocutionary Acts:**
      *   **Definition:** The act is *initiated* by the speaker's utterance but only fully constituted as a social fact upon the *explicit acceptance or ratification* (often verbal) by the specific, intended addressee. The act creates a *mutual* or *relational* state.
      *   **Mechanism:** The utterance is an *offer* to create a joint commitment or state. That state only comes into existence when the offer is accepted. Without acceptance, the utterance remains merely an offer/proposal/invitation.
      *   **Examples:**
          *   "I bet you twenty pounds the delivery is late." (Bet - Only a bet once the other says "You're on," "Accepted," or similar.)
          *   "I offer £10,000 for the car." (Offer - Only part of a deal/sale once accepted by the seller.)
          *   "Will you marry me?" (Proposal - Only creates an engagement upon "Yes.")
          *   "I move that we adjourn." (Motion - Only becomes the official motion if seconded and then voted on, depending on rules.)
          *   "Let's meet at 8 pm." (Proposal for Agreement - Only an agreement if met with "Okay," "Sounds good," etc.)
      *   **Key:** The act (the bet, deal, agreement) *does not exist* until ratification occurs. The initial utterance is a necessary precursor, but insufficient alone.

  ## Addressing Your Complexities

  1.  **"Verbs Shifting Groups" (e.g., Promise):**
      *   **Explanation:** The *type of act* depends on its **illocutionary point and relational context**, not solely the verb.
      *   **Promise in Isolation:** "I promise to help you move." This is typically a **Self-Executing** act. The speaker commits *themself* upon utterance. The addressee doesn't need to "accept" the commitment for it to *be* a promise (though they can reject the *help*).
      *   **Promise in a Bargain:** "I promise to pay you £100 *if* you promise to fix my roof." Here, "I promise..." is functioning as **one half of a proposed exchange**. Its illocutionary point isn't *just* committing the speaker; it's *offering a term* for a *mutual agreement*. The individual promises are **Ratification-Dependent** *on the other promise being given* to form the bargain. Neither promise stands alone as the complete agreement until both are uttered and the *exchange* is ratified (often implicitly by performing the acts, or explicitly).
      *   **Why it Shifts:** The verb "promise" retains its core meaning (commitment), but its *illocutionary role* changes based on context. In the bargain, it's subordinated to the goal of creating a mutual contract, making it dependent on reciprocal ratification.

  2.  **Retroactive Description ("We have had a bet since Tuesday"):**
      *   **Explanation:** This reflects **narrative convention and the nature of agreements**. Once ratification occurs:
          *   The *agreement itself* (the bet, deal) is understood to be the *intended outcome* of the initial utterance + the ratification.
          *   Legally and socially, the *effective date* of the agreement often *is* the moment the offer was made, as acceptance makes it binding *from that point*. Dating it to the offer simplifies the narrative of the agreement's origin.
          *   Saying "we agreed on Tuesday" is more efficient and captures the *substance* of the mutual commitment that crystallized on Tuesday, even if the final "click" (acceptance) came moments later. It acknowledges that the offer laid the essential groundwork accepted by the other party.
      *   **Why it's Not Contradictory:** On Tuesday, before acceptance, there *was* no bet/deal – only an *offer to create one*. After acceptance, there *is* a bet/deal, and its terms are understood to have been *proposed* on Tuesday. The retroactive description refers to the *origin point of the mutually agreed terms*, not the moment the agreement became fully constituted.

  3.  **"I forgive you" - The Ambiguous Case:**
      *   **Explanation:** This perfectly illustrates the tension and why it depends on perspective/doctrine:
          *   **Self-Executing View (Internal Release):** Forgiveness is primarily an internal act of the forgiver – relinquishing resentment. Uttering "I forgive you" *is* the performative declaration of that internal state change. It's about the *speaker's* moral/emotional position. (This aligns with some religious or therapeutic views).
          *   **Ratification-Dependent View (Relational Repair):** Forgiveness is seen as a *restoration of relationship*. Merely declaring it unilaterally can feel presumptuous, incomplete, or even coercive. True forgiveness, in this view, requires the wrongdoer's acknowledgment, repentance, and *acceptance* of the forgiveness for the relational breach to be healed. The declaration is an *offer of restored relationship* that needs acceptance to be fully realized. Without it, it's just words.
      *   **Why the Conflict:** It hinges on whether forgiveness is conceptualized primarily as a *private state of the wronged party* (Self-Executing) or as a *public, relational transaction* (Ratification-Dependent). Both perspectives have validity depending on context and belief systems. In your grievance context, recognizing *which* view the parties hold is crucial – someone declaring forgiveness expecting relief, and the recipient feeling it's empty or even insulting without their involvement, perfectly demonstrates the two types clashing.

  ## Conclusion: The Labels and Their Value

  *   **Self-Executing (Autarkic) Illocutionary Acts:** Constituted solely by the speaker's utterance. They change the speaker's status or commitment. (Apology, Resignation, Solitary Promise, Oath).
  *   **Ratification-Dependent (Synallagmatic) Illocutionary Acts:** Constituted only upon explicit acceptance/ratification by the specific addressee. They create mutual commitments or states. (Bet, Offer/Acceptance forming a Deal, Proposal leading to Engagement, Motion requiring Second).

  This distinction explains:
  *   Why some utterances *are* the act immediately ("I quit!"), while others are merely proposals for an act ("I bet you...").
  *   How verbs like "promise" can straddle the line depending on relational context.
  *   The logic behind retroactively dating agreements to the offer.
  *   The deep ambiguity in acts like forgiveness, which touch on both internal state and relational repair.

  Understanding this split is vital in grievance procedures. It clarifies whether an apology has genuinely *been made* (self-executing, even if rejected) or whether an *offer* of settlement is still pending acceptance (ratification-dependent). It helps diagnose misunderstandings where one party feels an act is complete ("I apologized!") and the other feels it's insufficient without their participation or acknowledgment. This framework gives you precise language to analyze the *status* of the communicative acts occurring in those tense meetings.
