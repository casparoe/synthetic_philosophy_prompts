prompt: |-
  I'm on a volunteer climate advisory committee for our mid-sized city — which is a fancy way of saying I'm the person who actually reads the spreadsheets. Our draft climate plan does three things with time that, set next to each other, look like they can't all be right, and I'd like help working out what's going on underneath.

  - The whole plan is built around a cumulative carbon budget: one number of tonnes we're allowed to emit between now and 2050, and as near as I can tell it makes no difference inside that window whether a tonne goes up in 2026 or in 2049. A tonne is a tonne.
  - Part of how we hit the number is offsets. One project on the table protects a forest for a hundred years and then the protection lapses (and it presumably gets cleared later). The protocol gives it about half the credit per tonne it would get for permanent protection, via this "tonne-year" calculation that treats a century of delay as worth roughly half of not emitting at all. A similar project nearby with a permanent easement gets full credit.
  - Separately, when we convert methane and the other short-lived gases into CO2-equivalent for the inventory, we use a multiplier that as I understand it adds up the warming a pulse of the gas causes over a fixed hundred-year window and then simply stops counting.

  So inside the budget, timing does nothing. In the tonne-year rule, timing does a lot. In the equivalence multiplier, timing matters right up to a cutoff and then stops mattering completely. None of us think that's three names for one idea, but none of us can say what the difference is meant to be, and one member keeps saying "the people in 2125 will be richer than us, so of course delay is fine," which I suspect is a fourth thing again.

  I don't want any reading list or citations — I'll go find the literature myself, and honestly I mostly need this before a meeting thursday. What I want is the conceptual map. What view of what we owe to people who come after us does each of those three rules fit with? Start with the tonne-year one: is that half-credit secretly just a discount rate in disguise, i.e. a claim that later people's welfare counts less, or can it be defended with no discounting of anyone's welfare at all?

  My half-formed idea is that the honest version goes through rate rather than level: what actually hurts a society isn't a temperature but the gap between how fast conditions are changing and how fast it can adapt, so delay is genuinely worth something even if future lives count exactly as much as ours — and on that story it should be worth more or less than half depending on what else is happening, not a flat fifty percent. Does that hold up? And is it the same argument as the "they'll be richer" one, or a different argument that happens to point the same way?

  Then the two things I really need for the meeting: which of these three numbers actually commit us to a substantive view about the future, and which would look exactly the same under several quite different theories — i.e. where can our committee stop feeling guilty? And if we took the rate-vs-level idea seriously instead, what concretely would change in how we score the forest project and in how we treat that hundred-year cutoff?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on a volunteer climate advisory committee and are dealing with three different approaches to carbon accounting that seem inconsistent: a cumulative carbon budget, tonne-year offsets, and GWP100 for greenhouse gases. The user needs a conceptual map to understand the underlying views on intergenerational obligations and which of these methods imply specific ethical stances.

  First, I need to break down each method. The cumulative budget treats all emissions equally regardless of timing, which suggests a focus on total warming impact. The tonne-year approach gives half credit for temporary sequestration, implying that delaying emissions has value. GWP100 counts warming over a fixed century, after which it stops. The user is confused about the philosophical foundations of each and wants to know where their committee might not need to commit to a particular ethical view.

  The user mentions a committee member's argument that future people will be richer, so delay is fine. That sounds like discounting based on wealth, which is a separate point. The user's own hypothesis is about the rate of change vs. level—adaptation speed matters. I need to address whether that holds up and how it differs from discounting.

  For the meeting, they need two main things: which methods lock them into a specific view of the future, and what would change if they adopted the rate-vs-level approach. I should clarify that the cumulative budget is the least committal ethically, as it doesn't require discounting. Tonne-year and GWP100 both involve time cutoffs, implying that impacts beyond a certain point are less important, which is a form of discounting.

  The user's rate-vs-level idea is valid. Faster changes cause more disruption, so delaying emissions could reduce adaptation costs. But current tonne-year calculations don't account for that directly; they use a fixed 100-year window. If they adopted a rate-based approach, scoring would depend on the trajectory of other emissions. For the forest project, credit would vary based on whether the delay aligns with peak transition challenges. The GWP100 cutoff would need adjustment to reflect ongoing impacts or changing sensitivity.

  I should also note that the "richer future people" argument is discounting based on wealth, which is controversial. It's different from the rate argument, which focuses on physical impacts. The committee should be aware that tonne-year and GWP100 methods assume a specific time preference, potentially conflicting with treating all generations equally. Highlighting that the cumulative budget avoids discounting might ease their guilt about ethical commitments.
answer: |-
  Here's the conceptual map you need, stripped down to the core ideas and tensions:

  ### 1. The Three Rules & Their Underlying Logics
  *   **A. Cumulative Carbon Budget (Tonnes are Tonnes):**
      *   **View:** Focuses on **peak temperature and long-term equilibrium warming.** Warming is primarily driven by the *total cumulative CO2* emitted into the atmosphere. The climate system integrates emissions over centuries. A tonne emitted now or in 2049 contributes equally to the *stock* of CO2 driving warming decades/centuries later.
      *   **What it owes:** Future generations a *stable climate state* below dangerous thresholds. It prioritizes avoiding catastrophic, irreversible impacts (e.g., ice sheet collapse, major biome shifts) driven by peak warming. Timing matters only insofar as exceeding the budget *sooner* locks in higher peak warming *sooner*.
      *   **Ethical Commitment:** Assumes **equal moral consideration across generations** for catastrophic outcomes determined by the *total stock*. It avoids explicit discounting of future welfare. The core commitment is to the *final state*.

  *   **B. Tonne-Year Offsets (100 years = ~50% credit):**
      *   **View:** Focuses on the **time-integrated radiative forcing (warming effect)** of a tonne of CO2. Storing a tonne for 100 years prevents 100 tonne-years of warming impact. Permanent storage prevents infinite tonne-years. The "~50%" for 100 years comes from integrating the decay curve of atmospheric CO2 over a finite period vs. infinity. It's mathematically convenient, not derived from adaptation rates.
      *   **What it owes:** Recognition that **delaying warming has value**, even if temporary. This value *could* be argued based on:
          *   *(Weak/Implicit Discounting):* Future warming matters *less* (controversial).
          *   *(Avoiding Peak Rate - Your Idea):* Slowing the *rate* of warming buys time for adaptation (more defensible without discounting).
          *   *(Pragmatism):* Permanent sequestration is hard; this incentivizes *some* action.
      *   **Ethical Commitment:** **Commits to a specific time horizon (100 years) as defining "value".** It implicitly devalues impacts beyond that horizon (by giving no credit for them). This *looks like* discounting future generations beyond 100 years, even if the math stems from integrating forcing. It says impacts after 100 years are worth exactly 0 in this accounting.

  *   **C. GWP100 (100-Year Cutoff for Gases):**
      *   **View:** A **pragmatic metric for comparing the *pulse* emissions of different gases** over a standardized, policy-relevant timeframe. It calculates the cumulative warming a pulse of Gas X causes over 100 years *relative* to a pulse of CO2. The cutoff is arbitrary but necessary for a single number. It *does not* model the actual atmospheric decay of the gases after 100 years; it simply stops counting.
      *   **What it owes:** A workable way to compare diverse emissions *now* for near-to-medium-term planning. It prioritizes impacts within the planning horizon of human institutions.
      *   **Ethical Commitment:** **Commits to the view that warming impacts beyond 100 years are irrelevant for current policy decisions** regarding *comparing* gases. Like Tonne-Year, it implicitly devalues the very long-term (centuries+) impacts of long-lived gases (like CO2 itself!) relative to a 100-year window. It's primarily a tool, but the timeframe choice has ethical weight.

  ### 2. Your "Rate vs. Level" Idea - Does it Hold Up?
  *   **Yes, it holds up strongly as a distinct and valid argument.** The *speed* of climate change is a critical factor for ecological and societal damage. Faster changes overwhelm adaptation capacity (coral reefs, infrastructure planning, agricultural shifts, migration). Delaying a tonne of CO2 emission *genuinely reduces the peak rate of warming* during the critical transition period.
  *   **Is it the same as "They'll be Richer" (Discounting)?**
      *   **No.** They are fundamentally different arguments pointing in the *same direction* (delay is good).
      *   **"Rate" Argument:** Based on *physical/biological vulnerability* to the *pace* of change. Future generations still count equally; we owe them a *manageable* transition, not just avoidance of a final bad state. Delay reduces the peak *stress* on systems.
      *   **"Richer Future" Argument:** Based on *economic discounting*. Assumes future people will have higher consumption, so a unit of climate damage costs them *less* in welfare terms than it costs us today. This explicitly weights the welfare of current generations higher than future generations. (This is ethically contentious and distinct from the physical rate argument).

  ### 3. Which Rules Commit to a Substantive View? (Where to Stop Feeling Guilty)
  *   **Feel Least Guilty About:** **The Cumulative Carbon Budget (A).**
      *   **Why:** It's the most direct translation of the geophysical reality (cumulative CO2 drives peak warming). It avoids explicit time-based cutoffs or discounting. It can be defended purely on the goal of minimizing peak warming for *all* future generations equally. It doesn't *require* discounting future welfare. (Implementation choices *around* the budget might, but the core concept doesn't).
  *   **Feel More Guilty About:** **Tonne-Year Accounting (B) & GWP100 (C).**
      *   **Why:** **Both commit to the substantive view that climate impacts beyond 100 years are significantly less important than impacts within 100 years for current decision-making.** They embed a specific (and relatively short) time horizon into their core calculation, devaluing the very long-term. This is hard to defend *without* some form of time preference (discounting, or a pure "100-year pragmatism" that ignores obligations further out). They represent a choice about whose suffering counts *less*.

  ### 4. If You Took "Rate vs. Level" Seriously - Concrete Changes
  *   **Scoring the Forest Project:**
      1.  **Flat 50% is Out:** The value of temporary storage **wouldn't be fixed** at ~50% for 100 years. It would depend on **when the delay occurs** relative to the *peak transition stress*.
      2.  **Timing Matters Hugely:** Delaying emissions during the period of **fastest planned decarbonization and highest background warming rate** (likely your next 20-30 years) would be **worth significantly MORE** than 50%. Delaying emissions closer to 2050, when the system is hopefully more stable and decarbonized, might be worth *less* than 50%.
      3.  **Scoring Needs Context:** You'd need to model/estimate the *global/regional warming rate trajectory* and assess how much that specific tonne-year delay *reduces the peak rate* during the critical window. Credit becomes dynamic, not static.
  *   **Treating the Hundred-Year Cutoff (GWP100):**
      1.  **The Cutoff Becomes Problematic:** Simply stopping at 100 years ignores the *ongoing contribution* of long-lived gases (CO2, N2O) to warming *after* 100 years, which still affects the *long-term stabilization level* and the *rate of change* towards it for future generations centuries out.
      2.  **Shift in Focus?** While GWP100 is deeply entrenched, taking rate seriously might push you towards:
          *   **Prioritizing SLCP Reductions (Methane, etc.) EVEN MORE:** Because they decay fast, reducing them *now* rapidly lowers the *current and near-term warming rate*, providing immediate relief during the critical adaptation window. Your "rate" argument strongly supports aggressive SLCP action.
          *   **Acknowledging GWP's Shortcomings:** Being explicit that GWP100 is a useful *comparison tool for near-term planning* but fundamentally undervalues the long-term damage of CO2 and overvalues the very long-term persistence of its warming compared to a rate-focused perspective.

  **In Summary for Your Meeting:**

  *   **The Budget (A)** is the foundation, focused on the final state and *least* ethically committal on discounting.
  *   **Tonne-Year (B) & GWP100 (C)** both embed a **100-year time horizon cutoff**, implicitly devaluing impacts beyond that period. This is their core ethical commitment/weakness.
  *   **"Rate vs. Level"** is a powerful, distinct argument from pure discounting. It justifies valuing delay *without* saying future lives matter less, based on reducing adaptation stress.
  *   **Consequence:** If you take rate seriously, **temporary forest storage needs context-dependent scoring** (worth more during peak transition stress), and the **GWP100 cutoff feels even more arbitrary** regarding long-term CO2 impacts, strengthening the case for aggressive SLCP action.

  You can confidently state that Tonne-Year and GWP100 *do* represent a choice about time horizons that devalues the very long term, while the Cumulative Budget avoids that specific commitment. Your "rate" argument offers a robust, non-discounted rationale for valuing delay, but it requires moving beyond the fixed 100-year assumptions built into B and C. Good luck Thursday!
