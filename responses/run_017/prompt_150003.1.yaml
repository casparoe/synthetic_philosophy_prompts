        - "Who was not in the room? The future residents. Their benefit is diffuse and they are not organized. The costs to the existing residents are concentrated and visible."

     4. Reshuffle:
        - "When your role changed, did your vote change? What were you protecting in your first role? Property values? Neighborhood character? And in the second role? This shows that what we call 'principles' might be tied to our position."

     5. Inhabitant vs Owner:
        - "Did you notice the difference between the claims of renters and owners? The owners have a property right, but the inhabitants (renters) have a stake too. And what about the future inhabitants?"

     **What might go wrong?**:
     - The gradient vote might take longer than 10 minutes: be strict with time.
     - The discussion might get stuck: have a timer.
     - The law students might argue about the process: remind them that the rules are set for the simulation.
     - During the placement obligation, they might argue about the capacity: have a clear rule and enforce it.
     - The points might distract: emphasize that the points are a tool to simulate interests, not to win.

     **40-minute version**:
     - Cut the reshuffle and second vote (saves 10-15 minutes).
     - Shorten the discussion to 10 minutes.
     - Shorten the gradient vote to 5 minutes: do a quick vote by having the facilitator propose a gradient and ask for a show of hands to approve it.
     - Placement obligation: do it quickly, with only 5 districts of 2 units each (total 10 capacity for a 20-unit project). Then adjust the dial.
     - Then go straight to debrief.

     We'll create the materials in an afternoon: role cards, objective cards, maps, and the dial board.

     This design should meet the goals.
answer: |-
  ### Simulation Game: **Boundary of Belonging**

  **Core Objective:** Students experience how defining the "affected public" predetermines land-use outcomes, revealing the tension between self-interest and procedural fairness. No terms like "NIMBY" or "right to the city" are used until debrief.

  ---

  ### **Game Setup**
  **Fictional Neighborhood:** *Elmwood Corridor*  
  - 24 parcels: 10 single-family homes, 3 small apartment buildings (4 units each), 1 church parking lot, 1 shuttered retail site (proposed development site), 4 small businesses, 2 vacant lots, 3 public spaces.  
  - **Proposed Project:** 6-story mixed-use building (30 units total: 18 market-rate, 12 income-restricted; ground-floor retail).  
  **Participants:** 18 students, each assigned a stakeholder role.  

  **Materials:**  
  - **Role Cards:** 18 cards with stakeholder details (e.g., "Homeowner, 200ft from site"; "Renter in Apartment B, 500ft"; "Small Business Owner, 100ft").  
  - **Secret Objective Cards:** 18 cards with hidden goals (e.g., "Maximize property value," "Prevent displacement," "Keep rents low").  
  - **City Map:** Poster showing 5 city districts (North, South, East, West, Central) with "absorption capacity" tokens (4 slots/district, each holding 3 units max).  
  - **Shared Dial:** Large board with "Regional Rent Index" (starts at 100) and "Displacement Counter" (starts at 0).  
  - **Three Empty Chairs:** Placards labeled "Income-Restricted Household 1," "Household 2," "Household 3."  
  - **Voting Tokens:** Weighted tokens for gradient voting (e.g., 10-point tokens for 100ft, 5-point for 500ft, 1-point for 1+ mile).  
  - **Timer:** Strict timekeeping for each phase.

  ---

  ### **Rules & Mechanics**
  1. **Standing Gradient Vote (Partial Veil of Ignorance):**  
     - Students vote *without knowing their roles* on voting power by distance:  
       - 100ft: ? points  
       - 500ft: ? points  
       - 1 mile: ? points  
       - >1 mile: ? points  
     - Total points = 100. Vote via ranked-choice or majority rule.  
     - **Why:** Forces abstract debate about "fair representation" before self-interest kicks in.

  2. **Role Assignment & Secret Objectives:**  
     - Assign roles and objective cards. Roles include:  
       - 4 homeowners (near/far), 3 renters, 2 landlords, 1 church rep, 1 business owner, 1 developer (retail site owner), 2 "distant residents" (1+ mile), 3 "citywide advocates" (nonprofit/govt), 1 nearby school rep.  
     - Objectives conflict (e.g., a landlord may have "Prevent new housing to avoid rent competition").  

  3. **Project Vote 1 (Weighted by Gradient):**  
     - Debate moderated by you (strict 2-min speaking limits).  
     - Students vote using tokens weighted by the standing gradient.  
     - **Placement Obligation Rule:** Anyone voting "block" must name an *alternative city district* for the project. Each district absorbs max 3 units. Once a district’s slots fill, it’s closed.  

  4. **Dial Adjustment:**  
     - For every blocked unit, increase Rent Index by +0.5 and Displacement Counter by +0.2 (e.g., blocking 30 units → +15 to rent, +6 to displacement).  

  5. **Role Reshuffle & Project Vote 2:**  
     - Without warning, redistribute roles:  
       - Homeowners → Renters  
       - Landlords → Tenants  
       - Near residents → Distant residents  
       - Developer → Small business owner  
     - Revote on the *same project* with new roles/objectives.  

  6. **Three Empty Chairs:**  
     - Mention these represent "future residents" whenever impacts are discussed.  

  ---

  ### **90-Minute Timeline**
  | **Time** | **Phase**                                                                 | **Key Actions**                                                                 |
  |----------|---------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | 0-5 min  | **Introduction**                                                          | Explain the neighborhood, project, and rules. No theory—focus on mechanics.    |
  | 5-20 min | **Standing Gradient Vote**                                                | Debate/vote on voting power by distance. Record gradient on board.             |
  | 20-25 min| **Role & Objective Assignment**                                           | Hand out role/objective cards. Students review silently.                       |
  | 25-40 min| **Debate 1**                                                              | Students argue for/against project. Point to empty chairs if future residents are ignored. |
  | 40-45 min| **Vote 1**                                                                | Weighted vote using gradient. Tally publicly.                                  |
  | 45-55 min| **Placement Obligation** (If project blocked)                             | "Block" voters name alternative districts until slots fill. Record on city map. |
  | 55-60 min| **Dial Adjustment**                                                       | Update Rent Index/Displacement Counter based on blocked units.                 |
  | 60-65 min| **Role Reshuffle**                                                        | Redistribute roles. New objectives issued.                                     |
  | 65-70 min| **Debate 2**                                                              | Short debate with new roles.                                                   |
  | 70-75 min| **Vote 2**                                                                | Revote with same gradient.                                                     |
  | 75-90 min| **Debrief**                                                               | Structured discussion linking mechanics to theory (see below).                 |

  ---

  ### **Debrief: Mapping Mechanics to Theory**
  1. **Gradient Vote → Boundary Problem**  
     - "When you set the gradient, you decided whose voice mattered. How did 'fairness' change once you knew your role? This is the boundary problem: *there’s no neutral way to define the affected public*."  

  2. **Placement Obligation → Complaint vs. Authority**  
     - "When you had to name an alternative site, did you have the authority to impose it there? This shows *having a complaint isn’t the same as having jurisdiction*."  

  3. **Empty Chairs → Asymmetry of Costs/Benefits**  
     - "The empty chairs represented future residents. Why were they ignored? *Concentrated costs (e.g., traffic) are visible; diffuse benefits (e.g., lower rents) are invisible*."  

  4. **Role Reshuffle → What’s Being Protected?**  
     - "When your role changed, did your vote change? Were you protecting *use value* (your home), *exchange value* (property wealth), or *standing* (your right to decide)?"  
     - "Notice the gap between *owner claims* (control) and *inhabitant claims* (belonging)."  

  5. **Shared Dial → Collective Consequences**  
     - "The dial showed how blocking units hurts everyone weakly—but no one feels responsible."  

  ---

  ### **Predictable Pitfalls & Mitigation**
  - **Law students litigating zoning:** Preempt by saying, "In this city, zoning allows the project; we’re deciding community input."  
  - **"Gamifying" the vote:** Emphasize, "This isn’t about winning—observe how your position shapes your principles."  
  - **Distant participant disengagement:** Assign them "citywide advocate" roles with objectives like "Reduce regional rents."  
  - **Real-life biases (e.g., a student landlord):** Use reshuffle to force perspective shift.  
  - **Gaming the reshuffle:** Redistribute roles randomly and quickly to prevent strategy.  

  ---

  ### **What the Game Flattens (Require Explicit Debrief Notes)**
  1. **Time/Repetition:** Real decisions involve years of meetings, not 90 minutes.  
  2. **Power Asymmetries:** Who has time/money to participate? (Here, everyone is equally present.)  
  3. **State Preemption:** State law often defines "the public" (e.g., California’s Housing Accountability Act).  
  4. **Scale:** A 30-unit building won’t solve a housing crisis—but blocking many small projects does.  
  5. **Historical Justice:** Past exclusions (e.g., redlining) aren’t captured.  

  > **Debrief Script:** "The game compresses complexity. In reality, power isn’t redistributed in a reshuffle. Standing is fixed by law, participation requires privilege, and ‘somewhere else’ often means communities with less power."

  ---

  ### **40-Minute Version for Neighborhood Boards**
  **Cut:**  
  - Role reshuffle and Vote 2 (saves 15 min).  
  - Detailed gradient debate: Pre-set a gradient (e.g., 100ft=10 pts, 500ft=5 pts, 1+ mile=1 pt) to save time.  

  **Keep:**  
  1. Standing gradient vote (5 min).  
  2. Roles/objectives + debate (10 min).  
  3. Vote 1 + placement obligation (10 min).  
  4. Dial adjustment + debrief (15 min).  

  **Why:** The placement obligation and dial best expose the illusion of "somewhere else" and diffuse costs. Reshuffle is less critical for boards living these tensions daily.  

  **Materials Simplified:** Skip reshuffle cards; use a pre-made city map with absorption capacities.  

  ---
  This design forces confrontation with the boundary problem while masking theory in mechanics. The reshuffle and placement obligation create visceral "aha" moments. Run it as a tight ship—stick to the timer!
