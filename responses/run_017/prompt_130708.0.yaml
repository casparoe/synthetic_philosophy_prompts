answer: |-
  Here's a breakdown of the dialectic and your test cases, aiming for clarity on the stakes and predictions, written in British English as requested.

  **The Core Stakes: Concept vs. Pragmatics**

  You've characterised the two main explanations for the Knobe Effect (the chairman asymmetry) accurately:

  1.  **Concept Revision Story:** The *concept* of intentional action itself is not morally neutral. Moral valence (or the agent's attitude like indifference to a bad outcome) is a constitutive part of *what it means* for an action to be intentional. Folk psychology inherently links intentionality to negative evaluations or norm violations. This challenges traditional philosophical action theory which assumed intentionality was a purely descriptive, psychological state.

  2.  **Pragmatic Blame-Marking Story:** The *concept* of intentional action remains descriptive and morally neutral (e.g., involving purpose, knowledge, control). The asymmetry arises because participants interpret the *question's purpose* pragmatically. In the harm case, the most relevant reason for asking "did he do it intentionally?" is often to assign blame or responsibility. Participants therefore inflate their "yes" answer to facilitate this blame assignment, even if, strictly speaking, the side-effect wasn't intentional. In the help case, blame isn't relevant, so the neutral concept applies straightforwardly, leading to "no".

  **What's at Stake Fundamentally:**

  *   **Philosophical Implications:** The Concept Revision story is radical. It suggests a deep entanglement of folk moral psychology with core action concepts, potentially undermining the "neutral" foundation of much action theory and moral psychology. The Pragmatic story is more conservative, preserving the descriptive core of intentionality while explaining the asymmetry through conversational dynamics.
  *   **Psychological Mechanism:** Is the effect driven by how we *represent* and *define* intentionality in our minds (Concept), or by how we *use* the word "intentionally" strategically in communication (Pragmatics)? The former suggests a cognitive bias built into the concept itself; the latter suggests a bias in how we deploy the concept in social contexts.

  **Testing the Stories with Your Variants:**

  1.  **Swap the Word (Know/Foresee):**
      *   **Pragmatic Blame-Marking Prediction:** The asymmetry should **shrink significantly or disappear**. "Know" and "foresee" are primarily about cognitive states (belief, awareness), not directly about purpose or control. They are weaker markers for blame assignment. While knowing/foreseeing harm *can* be relevant to blame, it's not the *primary* linguistic tool used to *mark* blame in the way "intentionally" is. Participants should attribute knowledge/foresight equally readily in both harm and help cases because the *question* is now clearly about cognition, not blame-marking. The pragmatic pressure dissipates.
      *   **Concept Revision Prediction:** The asymmetry **could persist or spread**. If moral valence is deeply ingrained in how we conceptualise *agency* surrounding side-effects, it might affect not just "intentionally" but other related mental state attributions like "knowing" or "foreseeing" when a negative outcome is involved. The agent's indifference to harm might make us more likely to say he *really* knew/foresaw it (implying he *should* have cared). The effect might be weaker than for "intentionally" if "intentional" is the core locus of the moral link, but some asymmetry is expected.
      *   **Discriminating Power:** This is a strong test. If the asymmetry vanishes for "know/foresee", it strongly favours Pragmatics. If it persists, it favours Concept Revision. (Empirical data leans towards the asymmetry *disappearing* for "know/foresee", supporting Pragmatics).

  2.  **Change the Format (Rating Scale, No Stakes):**
      *   **Pragmatic Blame-Marking Prediction:** The asymmetry should **shrink significantly**. The primary driver (the perceived need to answer "yes" to assign blame in a conversational exchange) is removed. There's no interlocutor to signal blame to, and no immediate practical consequence. Participants should revert to applying the more neutral concept, rating intentionality lower in both cases. Any residual asymmetry might be due to subtle lingering pragmatic effects or other factors.
      *   **Concept Revision Prediction:** The asymmetry should **persist robustly**. If the moral link is constitutive of the *concept itself*, then how you ask about it (question format, stakes) shouldn't fundamentally alter the *judgment* generated by that concept. People should still rate harming the environment as more intentional than helping it, even on a scale in a vacuum, because the concept encodes the valence.
      *   **Discriminating Power:** Also a strong test. Persistence favours Concept Revision; significant reduction favours Pragmatics. (Data is mixed but often shows a *reduction* in the asymmetry with rating scales/no stakes, supporting Pragmatics, though it rarely disappears entirely, suggesting other factors may play a role).
      *   *Migration Counterargument:* The Concept Revisionist *could* argue that pragmatic pressures still operate internally ("What does the *researcher* want me to signal by asking this?") or that norm-violation itself creates implicit "stakes". This weakens the test slightly but doesn't eliminate it. A strong persistence in asymmetry despite efforts to minimise pragmatic cues still leans Concept Revision.

  3.  **Pull Norm-Violation Apart from Disapproval (Silly Rule / Praised Outcome):**
      *   **Concept Revision Prediction:** The asymmetry should track **norm-violation itself**, even if the respondent personally disapproves of the norm or approves of the outcome.
          *   *Silly Rule:* If breaking the rule is still a *norm violation* within the story's context (even if respondents think the rule is silly), the asymmetry should persist. The concept is sensitive to the violation of *a* norm, not necessarily a *morally good* norm.
          *   *Praised Outcome:* If the side-effect *violates a norm* (e.g., breaking a rule, harming someone) but the chairman is praised, the asymmetry should *still* show increased intentionality ratings for the harm. If the outcome is genuinely *praiseworthy* and involves *no norm violation* (e.g., helping in a novel way that breaks no rules), intentionality ratings should be low. The key is the normative status within the scenario.
      *   **Pragmatic Blame-Marking Prediction:** The asymmetry should track the **respondent's own attributions of blame/praise or the perceived need to condemn/approve**.
          *   *Silly Rule:* If respondents think the rule is silly/unjust and breaking it is fine or good, they should show **little to no asymmetry** (or maybe even a *reverse* asymmetry if breaking the silly rule is seen positively!). The pragmatic pressure to use "intentionally" to condemn vanishes or reverses.
          *   *Praised Outcome:* If the chairman is praised for the harm (e.g., ruthless efficiency rewarded), respondents should be **less likely** to say he harmed intentionally. There's no conversational need to condemn him, so the pragmatic inflation disappears. Conversely, if helping gets him *blamed* (e.g., for being soft), respondents might be *more* likely to say he helped intentionally to mark this disapproval.
      *   **Discriminating Power:** This is a very good test. If the effect tracks objective norm violation regardless of the attributor's attitude, it strongly favours Concept Revision. If it shifts based on the attributor's own disapproval/praise or the perceived social consequences for the agent, it strongly favours Pragmatics. (Data tends to support Pragmatics here: effects weaken or reverse when norm violations aren't seen as bad or when agents aren't blamed).

  **Confidence & Caveats:**

  *   **Confident:** The core distinction between the two explanations is well-founded and represents a genuine debate. Your test cases are logical and potentially discriminating. Empirical evidence *overall* leans towards the Pragmatic account, particularly based on variants like your #1 (word swap) and #3 (norm vs. disapproval). The Concept Revision story struggles most with cases where norm-violation exists but disapproval is absent or reversed.
  *   **Cautious/Guessing:** Predicting the *exact magnitude* of effects in each variant involves some speculation, as results can depend on subtle wording and context. While Pragmatics has more empirical support, the effect rarely vanishes *completely* in neutral formats (#2), suggesting *some* cognitive bias related to valence might exist alongside pragmatic factors. The lines aren't always perfectly sharp.
  *   **Your Framing:** Your framing of the two stories is sound and captures the core disagreement. The distinction is not merely terminological; it represents fundamentally different claims about cognitive architecture and language use. Your variants *are* good discriminators, especially #1 and #3, though #2 can be complicated by the potential for "internalised" pragmatics.
  *   **Answerability:** Your question *can* be answered well, and the distinction *is* meaningful. While the debate continues and the reality likely involves some interplay, the evidence strongly suggests pragmatic factors (blame-marking, conversational goals) are the primary drivers of the Knobe Effect, rather than a fundamental revision of the concept of intentional action itself. The core concept appears more descriptively neutral than the asymmetry initially suggested.
