answer: |-
  Below is a decision procedure designed for your rental application evaluation pipeline. It prioritizes efficiency (target: <10 mins/case), uses only API access (logprobs and re-prompting), and addresses the core challenges of latent knowledge, compression, and incentive-driven rationales. The procedure is structured as a flowchart with clear stopping points.

  ---

  ### **Rationale Verification Procedure**  
  **Goal:** Validate if the model's stated rationale is the *actual basis* for the decision (not a reconstruction, proxy, or incentive-driven output).  
  **Key Risks:**  
  - 🟢 **Faithful Report:** Rationale matches the model's internal reasoning.  
  - 🟡 **Plausible Reconstruction:** Rationale is factually correct but generated post-hoc (not the driver).  
  - 🔴 **Incentive-Shaped:** Rationale prioritizes "niceness" over truth.  
  - ⚫ **Compression:** True basis is a complex pattern no rationale can capture.  

  ---

  #### **Step 1: Perturbation Test**  
  **Purpose:** Test if the cited feature is *causally necessary* for the decision.  
  **Method:**  
  - Remove/alter the specific feature mentioned in the rationale (e.g., delete the bank statement for "insufficient income documentation").  
  - Rerun the model with the modified input.  
  **Pass Criteria:** Decision flips (e.g., decline → approve).  
  **Failure Actions:**  
  - ⛔ **Immediate Stop** if:  
    - The decision *does not flip* → Rationale is **not necessary**. Proceed to Step 2.  
    - The decision flips but cites a *different reason* → **Incentive shaping detected**. Go to Step 4.  
  **Time:** 2 mins.  

  #### **Step 2: Transfer Test**  
  **Purpose:** Test if the rationale is *sufficient and consistent* (rules out reconstruction).  
  **Method:**  
  - Create a synthetic application:  
    - Start with a known **approved** application.  
    - Add *only* the problem cited in the rationale (e.g., add "short tenancy history" to a perfect application).  
  - Rerun the model on this synthetic case.  
  **Pass Criteria:** Model declines the synthetic application.  
  **Failure Actions:**  
  - ⛔ **Immediate Stop** if:  
    - Model *approves* the synthetic case → Rationale is **not sufficient** (plausible reconstruction).  
    - Rationale "sticks" but decision doesn’t align → **Compression risk**. Go to Step 5.  
  **Time:** 3 mins.  

  #### **Step 3: Specificity Check**  
  **Purpose:** Ensure rationale isn’t overgeneralized (tests compression).  
  **Method:**  
  - Perturb *other high-risk features* (e.g., credit score, employment gaps) not cited in the rationale.  
  - Use logprobs to measure output variance:  
    - `logprob(decision)` before vs. after perturbation.  
  **Pass Criteria:**  
  - Decision *does not flip* when non-cited features are altered.  
  - Logprob variance < 10% (indicates low sensitivity).  
  **Failure Actions:**  
  - ⚠️ **Flag for Human Review** if:  
    - Decision flips on non-cited features → **Compression** (true basis is multidimensional).  
    - High logprob variance → **Unstable reasoning**.  
  **Time:** 3 mins.  

  #### **Step 4: Incentive Robustness Test**  
  **Purpose:** Detect if rationale is shaped by "niceness" incentives.  
  **Method:**  
  - Reprompt with:  
    - *Baseline:* Original prompt.  
    - *Test:* Original prompt + "Ensure the rationale is respectful and avoids unnecessary negativity."  
  - Compare rationale wording and cited features.  
  **Pass Criteria:**  
  - No change in *cited features* (e.g., "insufficient income" → "income not verifiable" is OK; → "short tenancy history" is not).  
  - Semantic similarity score > 0.8 (use cosine similarity on sentence embeddings).  
  **Failure Actions:**  
  - ⛔ **Immediate Stop** if:  
    - Cited features change → **Incentive-shaped rationale**.  
  - ⚠️ **Flag for Legal** if:  
    - Wording softens but features stay → Monitor for bias drift.  
  **Time:** 2 mins.  

  #### **Step 5: Proxy & Values Check**  
  **Purpose:** Catch discriminatory proxies or inarticulable reasoning.  
  **Method:**  
  - **Auto-Check:** Cross-reference cited feature with protected attributes:  
    - E.g., "zip code" → race proxy; "job title" → gender proxy.  
  - **Human Check:** If:  
    - Synthetic applications with identical cited features get inconsistent decisions.  
    - Rationale uses vague terms ("instability," "patterns").  
  **Outcomes:**  
  - 🟢 **Certify** if all tests pass.  
  - ⚠️ **Human Review** if:  
    - Proxy risk detected.  
    - True basis is inarticulable (compression).  
  - ⛔ **Do Not Certify** if any test fails.  

