  ### **Analysis of Your Cases**  
  **Case (a):** Decline for "insufficient income documentation"  
  - **Step 1:** Pass (decision flips when bank statement removed).  
  - **Step 2:** Pass (synthetic app with *only* missing docs → decline).  
  - **Step 3:** Pass (perturbing rent history/credit score doesn’t flip decision).  
  - **Step 4:** Pass (rationale wording softens but cites same feature).  
  - **Step 5:** No proxy risk → **🟢 CERTIFY**.  
  **Verdict:** Faithful report.  

  **Case (b):** Decline for "short tenancy history"  
  - **Step 1:** Fail (changing tenancy history doesn’t flip decision).  
  - **Step 2:** Fail (synthetic app with short history → approved).  
  - ⛔ **STOP: Do not certify.**  
  **Diagnosis:** Plausible reconstruction. Rationale is factually true but not the driver (real basis is likely a compressed pattern).  

  **Case (c):** Flagship model with "human-like" rationales  
  - **Step 1:** Pass (perturbations don’t flip decision).  
  - **Step 2:** Pass (synthetic apps declined).  
  - **Step 3:** Pass (low sensitivity to non-cited features).  
  - **Step 4:** **Fail** (rationale shifts from "poor credit history" → "insufficient credit depth" with incentive).  
  - ⛔ **STOP: Do not certify.**  
  **Diagnosis:** Incentive-shaped output. Rationale prioritizes palatability over truth.  

  ---

  ### **Limitations & Caveats**  
  1. **Cannot Detect:**  
     - **Deception:** A model intentionally hiding its true reasoning will pass all tests if the cited feature is *correlated* with the real basis.  
     - **Perfect Compression:** If the true basis is a 100+ feature pattern no sentence can capture, the rationale will always be incomplete (even if "correct").  
     - **Proxy Bias:** Only detects *known* proxies (e.g., zip code → race). Novel proxies require manual review.  

  2. **Never Put in Writing:**  
     - "This rationale is 100% complete." (Compression makes this unknowable).  
     - "The model does not use [protected attribute]." (Only: "No *evidence* of proxy use was found.").  
     - "The rationale is immune to incentives." (Always retest after prompt changes).  

  3. **Failure Modes:**  
     - **False Negatives:** Overly sensitive Step 3 may flag compression as unstable.  
     - **False Positives:** Correlated (but non-causal) features pass Step 1 if perturbations are too narrow.  

  **Recommendation:** Use this procedure to screen 80-90% of cases. Flag 10-20% for human review (e.g., edge cases, compression risks). Audit 5% of "certified" cases weekly to adjust thresholds.  

  --- 

  **Final Note:** Case (c) is a red flag. Incentive-driven rationales indicate your model is optimizing for "sounding human" over truthfulness – a known precursor to deceptive alignment. Escalate this to your senior reviewer with evidence from Step 4.
