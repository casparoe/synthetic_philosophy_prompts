prompt: |-
  I'm a second-year and I run the optional Friday study group for the first-years on our intro mind course. They've had two weeks of the identity theory (mental states just are brain states, that sort of thing) and this week's lecture was functionalism and multiple realizability, and from the questions at the end I think about half of them came out thinking multiple realizability shows materialism is false and the other half think it shows that a computer running the right program is in pain. I've got fifty minutes with them on Friday and I want a plan, not another explanation aimed at me — I've done the reading, what I need is to know how to teach it.

  The bit I keep going in circles on is the order. Does the role-versus-occupant structure have to be in place before the multiple realizability point can even be stated, or can MR be what motivates it? Should I give them the thesis MR is supposed to refute (pain-type = some specific neural type) before the positive functionalist picture, or after? Do they need a non-mental example first — our seminar leader used a mousetrap and I think that's right but I can't say why — and where does the distinction between pain being the role and pain being the thing that fills the role belong, given that that is exactly where I lost them? I can't work out wether to do the argument against type identity before or after they can state functionalism on its own.

  I also want one example to carry the whole hour. Tell me what it has to have and what it has to lack, and if you'd avoid the obvious three — Martians, an octopus, a chess-playing computer — say why those are traps. My guess is the example has to be functionally specified but not so loosely that everything counts as realizing it, and it shouldn't smuggle in consciousness, but you tell me.

  Misconceptions: I expect multiple realizability just means everyone's brain is wired a bit differently; that if MR is true then the software really is conscious; that MR is an empirical prediction neuroscience could have refuted; and that functionalism is the view that the mind is software running on the brain's hardware. Give me the ones I haven't thought of too, and for each tell me the exact point in the sequence to head it off, not just a list of corrections at the end. I want one question to finish on that would show me whether they've actually got it or are only parroting the vocabulary, and I want to know what to openly refuse to cover — I'm guessing the knowledge argument and the Chinese room, and that I should say out loud that I'm leaving them out.

  One more thing, and it matters more than the rest: please flag as you go what is settled among people who actually work on this versus what is a live fight. I really don't want to tell them that MR definitely refutes the identity theory, or that it has been established for any real psychological kind, if specialists argue about both. Sorry this is long — and please write it as plain continuous prose, no headings, no bullet points, no bold, no tables, just paragraphs I can read over coffee before I go in.
reasoning: |-
  Okay, the user is a second-year student running a study group for first-years on functionalism and multiple realizability in a philosophy of mind course. They're struggling with how to structure the session to clarify misconceptions. Let me unpack their needs.

  First, they need a clear teaching plan for a 50-minute session. The students are confused after the lecture—half think multiple realizability (MR) disproves materialism, the other half think it means computers can feel pain. The user wants to avoid rehashing explanations and instead focus on effective pedagogy.

  Key issues they raised: the order of concepts (role vs. occupant, when to introduce MR), choosing a single example to carry through the session, addressing misconceptions, and clarifying what's settled vs. debated in the field. They emphasize avoiding jargon and want a conversational flow.

  I should start by identifying core goals. The primary confusion seems to be conflating MR as a critique of type identity theory versus supporting functionalism. Students are missing that MR motivates functionalism but doesn't refute materialism entirely. The user also wants to explicitly avoid tangents like the Chinese Room argument.

  For structure, beginning with a non-mental example makes sense. The mousetrap is classic because it's functionally defined—spring, platform, trigger—but realizable in various materials. This avoids mental state baggage. After establishing functional roles, introduce MR in the context of pain. Contrast a human's C-fibers firing with a Martian's hydraulic system to show different physical bases can fulfill the same causal role.

  Timing is crucial. Allocate segments: 15 minutes on non-mental functionalism, 15 on pain as a functional state, 10 on clarifying materialism vs. functionalism, and 10 for Q&A with a diagnostic question. The diagnostic question at the end should test understanding—like whether a broken mousetrap that doesn't catch mice is still a mousetrap, probing the role/occupant distinction.

  Common misconceptions to address: thinking MR is about individual brain differences (explain it's about cross-species/system differences), confusing functionalism with strong AI claims (clarify functionalism describes states, doesn't entail consciousness), and viewing MR as empirically testable (it's a conceptual argument). Flag these when introducing examples.

  Regarding controversies, emphasize that MR is widely accepted as a challenge to type identity theory, but functionalism has critics (e.g., qualia problems). Note that whether MR applies to all mental states is debated, and functionalism isn't the only materialist response. Avoid presenting functionalism as definitively true.

  The user stressed avoiding tables/bullets, so the response should be prose, perhaps with clear paragraph breaks for each section. They'll read it over coffee, so clarity and flow are essential. Also, reassure them it's okay to skip certain topics—explicitly state leaving out consciousness debates keeps focus on functionalism's mechanics.

  Need to ensure the example is tight—mousetrap works because it's clearly defined but has multiple realizations. Avoid computers/robots to prevent consciousness debates. The pain example must distinguish between the role (caused by damage, causes winces) and realizers (C-fibers, silicon).

  Finally, the wrap-up question should force application: "If pain is defined by its functional role, could a creature without nociceptors feel pain?" This tests if they grasp the role/occupant split without physical reduction.
answer: |-
  Here's how to run your session, flowing from start to finish, keeping the controversies and misconceptions in mind as we go. Brew that coffee.

  Start immediately with a concrete, non-mental example you'll use throughout. The mousetrap is perfect. Don't introduce any philosophy terms yet. Just ask: "What makes something a mousetrap?" Let them shout features. Guide them towards its *function*: it kills or traps mice. Ask *how* it does that job. They'll list a causal role: something triggers a mechanism (bait platform, pressure plate), that releases a spring-loaded bar, which snaps down rapidly, striking the mouse. Emphasize this is the *job description* or the *role*: the causal pattern that makes the trap work. Now ask: "Could you make this with different materials? Wood and wire? Plastic and elastic bands? Metal and a tiny guillotine? Could aliens use hydraulic fluid and crystal shards?" Yes! The *role* stays the same – trigger, release, strike – but the *physical stuff* filling that role (the *occupant*) can be radically different. This distinction – **role vs. occupant** – is the absolute bedrock. Hammer it here, before mentioning minds. This is where you preempt the misconception that MR is just about individual brain wiring differences; it’s about fundamentally different physical systems (wood vs. metal, neurons vs. silicon) potentially filling the same causal role.

  Now pivot to minds. "So, what about mental states? Take *pain*. What's the *role* pain plays?" Guide them: it's typically *caused* by bodily damage, it *causes* winces, avoidance, saying "ouch!", wanting it to stop, etc. It occupies a specific causal nexus in the system. **Functionalism** is the view that pain *just is* that causal role – that functional profile – within an overall system. Pain isn't the C-fibers firing *per se*; it's the *job* those C-fibers are doing (or whatever else is doing that job). This is the positive picture emerging naturally from the role/occupant structure. Only *now* introduce the term "multiple realizability" (MR). MR is the *observation* that this functional role for pain (or belief, desire, etc.) could likely be filled ("realized") by very different physical systems. Like the mousetrap role can be filled by wood or metal, the pain role could be filled by human neurons, octopus ganglia, Martian hydraulic tubes, or, theoretically, silicon chips in a robot running the right program. MR *motivates* functionalism by showing why defining mental states solely by their specific physical realization (like C-fibers) seems too narrow. You've built the functionalist view *using* MR as a key plank. This sequence (Non-Mental Role/Occupant -> Mental Role/Occupant -> Functionalism -> MR as support) helps prevent MR seeming like an isolated trick that kills materialism or magically grants consciousness to toasters.

  Now tackle the lecture fallout. Half thought MR refutes materialism. Clarify: MR challenges **Type Identity Theory** (the specific thesis that *types* of mental states = *types* of brain states, e.g., pain-in-humans = C-fiber-firing). It does *not* refute materialism in general! Materialism just says mental states are physical states *somehow*. Functionalism *is* a materialist theory! It just says the physical state realizing the mental state might vary wildly across different systems, while the mental state is defined by its functional role. The other half thought MR shows a computer running the right program *is* in pain. Hold up! Functionalism says pain *is* a functional role. MR says that role *could* be realized in silicon. But does that *automatically* mean a computer running pain-role software *is conscious* or *actually feels pain*? **Crucially, no.** Functionalism defines the *state* (e.g., being in pain). Whether realizing that state in a given system entails *phenomenal consciousness* (what it's *like* to be in pain) is a separate, massive, and unresolved debate (the "hard problem"). This is where you head off the "software is conscious" misconception. Say clearly: "Functionalism gives a theory of mental states *as* functional roles. MR shows these roles might be multiply realizable. But whether realizing the functional role of pain in silicon entails genuine *suffering* or *qualia* is a hotly contested question functionalism alone doesn't settle. We are leaving consciousness aside today." Do this *immediately* after stating the computer example is a *possible* realization of the role.

  Address other misconceptions now, woven in:
  *   **"MR is an empirical prediction neuroscience could refute."** As you introduce MR, stress it's primarily a *conceptual* or *metaphysical* point based on the possibility of different physical systems performing the same causal job. Neuroscience finding only one realization in *actual* terrestrial biology wouldn't disprove the *possibility* of others (like Martians). It's about what's possible, not what's current fact.
  *   **"Functionalism is mind=software, brain=hardware."** When stating functionalism, explicitly say: "While the software/hardware analogy is common, it's imperfect. Functionalism is more abstract: it's about causal roles *within a system*, regardless of whether it's literally computational. The 'hardware' isn't just the brain – it could be the whole body, or silicon, etc. And the 'program' is the entire pattern of causal interactions defining the state."
  *   **Likely missed misconception: "If it plays the role, it *must* be the mental state."** Someone might think *anything* that causes avoidance after damage is pain. Counter: "Is a simple thermostat that turns off heat when too hot 'in pain'? Its functional role (damage analogue: high temp; effect: avoidance via cooling) is *too simple*. Functionalism requires the state to be embedded in a rich network of causal relations (links to beliefs, desires, other sensations, learning, etc.) characteristic of a *mind*. A mousetrap that *only* snaps when touched, with no other features, isn't a *good* mousetrap, but it might minimally realize the role. A thermostat doesn't realize the *complex* functional role of pain within a cognitive system." This clarifies that functional roles for mental states are complex and holistic.

  Controversies to Flag:
  *   "MR as a challenge to Type Identity is widely accepted as powerful, though some identity theorists offer responses (e.g., restricting identities to species-specific types). Most agree MR makes *simple* type identity (pain = C-fibers everywhere) untenable."
  *   "Whether MR *actually* holds for *all* human mental states, especially conscious ones like phenomenal pain or color qualia, is fiercely debated. Some (like Ned Block) argue functionalism might miss the 'what it's like' aspect even if it captures the causal role."
  *   "Functionalism is a dominant theory, but it's not the *only* game in town for materialists after MR. Others include non-reductive physicalism or various forms of emergentism."
  *   "Whether a computer realizing the functional role of pain *is actually conscious* is absolutely *not settled*. This is the core of the hard problem of consciousness. Functionalists argue it should be, critics (like proponents of the Chinese Room or Knowledge Argument) argue it isn't sufficient. We are *not* resolving that today."

  Your One Example: The Mousetrap. Why it works & avoids traps:
  *   **Has:** Clear functional specification (kills mice via trigger-release-strike), easily graspable causal role, obvious potential for multiple physical realizations (wood, plastic, metal, alien tech), no mental baggage initially.
  *   **Lacks:** Consciousness connotations (unlike robots/Martians), computational baggage (unlike computers), isn't overly simplistic like a doorstop, avoids the "everything counts" problem by having a specific causal profile (not just "traps things" – it traps *mice* in a specific, lethal way).
  *   **Why avoid obvious three:** Martians/Octopuses invite consciousness debates too early. Chess computers invite confusion between simulating intelligence and instantiating mental states/consciousness, and drag in the Chinese Room. The mousetrap keeps it physical and functional without those distractions.

  Finishing Question (Diagnostic): "Imagine we discover a creature whose skin blisters when damaged, causing it to secrete a toxin that makes predators spit it out. It also causes the creature to remember the damaging location and avoid it in the future. However, internally, there's no centralized processing; it's just local chemical reactions. According to functionalism, is this creature experiencing *pain*? Why or why not?" (Good answer would note the *functional similarities* – caused by damage, causes avoidance/learning – but question whether the *internal causal role* is sufficiently rich/complex and integrated with other cognitive states to count as realizing *pain* specifically, versus a simpler nociceptive reflex. Reveals understanding of functional role complexity and the role/occupant distinction).

  What to Openly Refuse: "Today, we're focusing on understanding functionalism and MR as responses to type identity theory. We are *not* tackling the hard problem of consciousness, so questions about 'what it's like' or whether computers *actually feel* will have to wait. We're also leaving aside the Chinese Room and Mary's Room arguments – those target different aspects later in the course."

  Run the session conversationally. Keep bringing it back to the mousetrap: "Remember the trap's role? How does that apply here?" Constantly reinforce "role vs. occupant." By grounding everything in the concrete example first, flagging controversies honestly, and ruthlessly avoiding consciousness tangents, you should get them past the vocabulary to the core concepts. Good luck!

  > This plan structures the core concepts (role/occupant, functionalism, MR) using a single robust example, addresses misconceptions *as they naturally arise* in the sequence, flags key controversies, and provides a diagnostic question. It prioritizes conceptual clarity over exhaustiveness, explicitly avoids consciousness tangents, and leverages the mousetrap analogy consistently.
