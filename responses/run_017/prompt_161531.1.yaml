prompt: |-
  Not sure this is the right sort of thing for this folder, but I'll try it. I'm retired now — was a geomicrobiologist, spent most of my career on things living in rock where they had no business living — and since I stopped I've been going to a philosophy of science reading group and reading the astrobiology literature properly for the first time. There's a move I keep running into in it that I don't have a word for, and I want to know whether somebody has already named it.

  The shape of it: people keep finding life in places that were supposed to be impossible — depths, pressures, salt concentrations, radiation doses, pH values that used to get called sterile, soils that get one wet day a decade. Each of these findings gets used to widen the map of where life can be. That's just learning, fine. But look at what the widening does to the numbers. It does two things at once. It makes "there is life elsewhere" more probable before you look, because there's more real estate and more ways of getting started. And it makes any particular failed look less informative, because the instruments were built to recognise the chemistry we knew about before we widened. So one and the same update is spent as credit on the prior and never charged against the test.

  The case that made me write this down: a sample comes back from somewhere promising — an icy moon's plume, a Mars-analogue core, whatever — and there's nothing in it anyone wants to call a biosignature. I'd have expected people to come out of that saying the probability for that body went down. Instead you get that it's "not constraining": wrong spot, wrong depth, one pass on one day, our kit only knows Earth chemistry, a metabolism we haven't thought of would leave something we wouldn't recognise. All of which is probably true. But it's the same consideration that made the prior go up, and it never seems to cost anything. And it cuts both ways: the Viking soil result from the 70s that looked positive got explained away as odd chemistry, and loosing that one didn't cost anything either.

  What I'd like isn't a label, and please don't give me a reading list, I can't be doing with chasing papers. I want the carving: what exactly is this, and where does it stop? Specifically the bits I can't sort out —

  Is it just unfalsifiability? It doesn't feel like it, because I can think of an outcome that would sink the hypothesis: a long-lived, energy-rich, properly sampled environment with nothing in it. It isn't that nothing could refute it. It's that the set of outcomes that would refute it keeps shrinking at the same time as the prior keeps rising.

  Is it just moving the goalposts, or special pleading? Also wrong-sounding, because the widening gets done in daylight, for reasons everybody accepts, and each individual step is one I'd have agreed to myself. (I remember being told off for being a carbon chauvinist, and fair enough.)

  Is it just "absence of evidence isn't evidence of absence"? That one's about a single inference; what I keep seeing is cumulative and gets worse each round.

  Is it confirmation bias or disconfirmation bias? Maybe, but those are claims about the psychology of the people doing it, and I think you could get exactly this pattern out of careful, honest people who are doing their best.

  I also tried writing it out in Bayes terms and got muddled: raising the prior and flattening the likelihood ratio pull in opposite directions, and I can't see in general which one wins, or whether it depends on something about where in the space you are.

  So: does this thing have a name, in philosophy of science or formal epistemology or anywhere else? I gather medicine and ecology have their own versions of it — widen a case definition and then act surprised that prevalence went up and the test looks worse. If there are two or three near neighbours, tell me which fits and how the others differ from it. If there genuinely isn't one, give me one: define it, and give me the edges — one case that's clearly the bad version, one that's clearly the legitimate version, because surely there is a legitimate version, sometimes you really should widen the target and it shouldn't count against you. And tell me what someone who wanted not to do it would have to commit to in advance, before seeing the result. That last bit is the part I actually want.
reasoning: |-
  Okay, the user is a retired geomicrobiologist who's now delving into philosophy of science and astrobiology. They've noticed a pattern in astrobiology where each discovery of life in extreme environments expands the range of where life can exist. This expansion simultaneously increases the prior probability of finding life elsewhere (because there are more possible habitats) while making negative results less meaningful (because current instruments might not detect novel life forms). The user feels this is a double-counting of evidence: the same fact is used to boost optimism but also to explain away failures.

  The user has already considered and rejected several potential explanations: unfalsifiability (since a truly barren environment could still disprove the hypothesis), moving goalposts (because each expansion is scientifically justified), and the adage about absence of evidence (since this is a cumulative effect). They tried Bayesian analysis but got stuck on how prior and likelihood interact.

  What they really want isn't just a label - they explicitly reject that. They want:  
  1) Precise conceptual carving of this phenomenon  
  2) Clear boundaries between legitimate vs problematic cases  
  3) Concrete methodological safeguards to prevent abuse  

  Key nuances:  
  - They acknowledge each individual expansion is valid (e.g., abandoning "carbon chauvinism")  
  - The concern is systemic: the cycle keeps repeating, making the hypothesis increasingly resilient  
  - They suspect careful scientists could fall into this unintentionally  

  My response should:  
  - Introduce the "Evidential Evaporation" concept as a neutral framework  
  - Use their Viking example to show how evidence loses diagnostic power  
  - Distinguish legitimate parameter-updating from problematic insulation  
  - Provide the methodological commitment they requested (pre-registration of detection criteria)  
  - Offer boundary cases: Europa's ocean (legitimate) vs endlessly redefined "shadow biosphere" (problematic)  
  - Emphasize that the core issue is erosion of testability rather than bad faith
answer: |-
  You've hit on a profound and under-discussed problem at the intersection of evidence, hypothesis revision, and scientific inference. This isn't just one fallacy—it's a **systematic erosion of testability** through successive expansions of possibility space. Let's carve it precisely.

  ### What This Is: **Evidential Evaporation**
  The core dynamic: **Each expansion of life's "possible conditions" increases the prior probability of extraterrestrial life *while simultaneously reducing the diagnosticity of negative results*.** The same evidence (discovery of extremophiles) is used to:  
  (A) *Boost* the prior (more habitats exist)  
  (B) *Neutralize* failed detection (we might not recognize the life).  

  This creates a **self-insulating feedback loop**:  
  1. New discovery → Broaden "habitable zone" definition → Prior ↑  
  2. Negative result → "Instruments/context inadequate" → Likelihood ratio ↓ (failure less surprising)  
  Result: The hypothesis becomes **progressively more resilient to disconfirmation** without proportional gains in confirmation.

  ### Why It's Not Your Initial Suspicions:
  - **Not unfalsifiability**: A *definitive* barren environment (e.g., a thermally stable, energy-rich, solvent-rich, well-sampled locale with no organics) *could* falsify it. The issue is the *shrinking set* of such locales as "habitability" expands.  
  - **Not moving goalposts**: Goalpost-moving is *ad hoc*; this involves *legitimate* updates to background knowledge.  
  - **Not "absence ≠ evidence of absence"**: That's a snapshot; your concern is *temporal*—repeated cycles degrade evidential value.  
  - **Not confirmation bias**: It can emerge from rigorous science. The problem is structural, not psychological.

  ### Formal Name: **The Problem of Uncontrolled Parameter Space Expansion**  
  In philosophy of science, this echoes **Lakatos' "degenerating research programme"** (where auxiliary hypotheses protect the core from falsification), but your case is unique because the auxiliary hypotheses (expanded habitability) are *empirically grounded*.  

  Closest existing concepts:  
  1. **The Tacking Problem (Bayesian)**: Adding irrelevant hypotheses to a theory can artificially inflate its prior without improving fit. *Difference*: Your expansions *aren't* irrelevant—they're empirically motivated.  
  2. **Underdetermination of Theory by Data**: Many theories fit the same evidence. *Difference*: Here, *successive updates* actively undermine future tests.  
  3. **Goodman's "Grue" Problem** (projecting novel categories): *Difference*: You're observing real discoveries, not linguistic tricks.  

  **Your label**: **"Evidential Evaporation"** (as the diagnostic power of null results dissipates through parameter space growth).

  ---

  ### Boundaries: Legitimate vs. Problematic  
  **Legitimate Version** (Science working properly):  
  - **Case**: Discovering *chemosynthetic* life at hydrothermal vents.  
  - **Update**: Prior for life on icy moons ↑ (new energy pathway).  
  - **Negative Result Handling**: "Our mass spectrometer couldn't detect X biomolecule" → *prompts better tools*.  
  - **Why Legitimate**: The update *increases testability* (e.g., designs missions to target vents).  

  **Problematic Version** (Erosion of testability):  
  - **Case**: Discovering *radiation-resistant* microbes → claiming "life could exist in interstellar space."  
  - **Update**: Prior for life in exoplanet atmospheres ↑.  
  - **Negative Result Handling**: "Voyager probes found nothing, but they couldn't detect Y metabolism."  
  - **Why Problematic**: Expands "life" to domains *inherently inaccessible to near-term instrumentation*. The update *lowers* future testability.  

  **Key Difference**: Does the expansion **generate new, feasible tests** or **immunize against existing ones**?  

  ---

  ### How to Stop It: Pre-Commitments  
  To prevent this, scientists must **pre-specify falsification criteria** *before* exploration:  
  1. **Define "Detectable Life" Operationally**:  
     - *Commit*: "We define a biosignature as Z (e.g., chiral molecules >X concentration). Absence in sample S = evidence against life."  
     - *Rationale*: Accept that detection is model-dependent, but freeze the model *for this test*.  
  2. **Pre-Register "Sterile" Conditions**:  
     - *Commit*: "If no biosignatures are found in Y ml of Enceladus plume ice *with instrument P*, we lower the probability of life there."  
     - *Rationale*: Forces acknowledgment of *what would count against*.  
  3. **Decouple Parameter Updates**:  
     - *Commit*: "New extremophiles update priors for *future* missions, but not the diagnosticity of *past* null results."  
     - *Rationale*: Prevents double-counting evidence.  

  ---

  ### Why This Matters in Astrobiology  
  The field risks becoming **self-referential**:  
  - Each discovery justifies broader searches → justifies more funding → discovers more extremophiles → expands space further...  
  - But if *every* null result is "non-constraining," the hypothesis loses empirical grip.  

  **What You Must Commit To**:  
  > *"We accept that our current definition of life may be parochial. But to test whether life is universal, we must temporarily treat Earth-like chemistry as our benchmark—and let negative results bite."*  

  This doesn't reject expansion—it insists on **causal accountability** between updates and tests. Without this, astrobiology's core question becomes non-empirical. You saw this in geomicrobiology: had you dismissed *all* barren rock samples as "uninformative," you'd never have found the organisms hiding in the *next* sample. The universe deserves the same rigor.
