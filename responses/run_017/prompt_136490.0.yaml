answer: |-
  **CONSULTATION DOCUMENT  
  ON THE DESIGNATION OF LOST CAUSES UNDER THE COMMEMORATIVE BALANCE ACT 2023  
  Issued by the Office for National Commemoration (ONC)**  
  **Date:** 18 October 2023  
  **Reference:** ONC/LC/2023/01  
  **Closing Date:** 31 March 2024  

  ---

  **1. Introduction**  
  1.1 This consultation invites applications for the designation of local defeats as **Designated Lost Causes** (DLCs) under the Commemorative Balance Act 2023 (CBA 2023).  
  1.2 The Act establishes a statutory framework to formally recognise, at the national level, the commemorative significance of historical defeats that continue to resonate within specific communities.  
  1.3 This document sets out:  
      (a) Eligibility criteria for DLC status;  
      (b) The application process;  
      (c) Assessment methodology (see **Appendix A**);  
      (d) Worked examples (**Appendix B**).  
  1.4 **Stakeholders** (including local authorities, heritage bodies, and devolved administrations) **will wish to note** that designation confers:  
      (a) Eligibility for the National Commemorative Fund (tier 2);  
      (b) Statutory weight in local planning decisions affecting commemorative sites;  
      (c) Use of the official DLC insignia.  

  **2. Definition and Scope**  
  2.1 A **Lost Cause** is defined as:  
      > *A collective endeavour, undertaken with significant local participation and sacrifice, which demonstrably failed to achieve its primary objective, yet persists in communal memory as a locus of identity, pride, or unresolved historical sentiment.*  
  2.2 **For the avoidance of doubt**:  
      (a) The endeavour’s objective must be irretrievably **lost** (i.e., demonstrably unachieved and no longer actively pursued by the applying community).  
      (b) The cause itself must remain **unabandoned** in the communal psyche (i.e., persistently evoked as symbolically potent).  

  **3. Core Eligibility Criteria**  
  Applications must satisfy **all** criteria below:  

  3.1 **Historical Distance**:  
      (a) The defeat must have occurred ≥ 100 years prior to application.  
      (b) Rationale: Ensures sufficient temporal remove for mythopoetic consolidation and detachment from extant political agendas.  

  3.2 **The Simultaneity Requirement**:  
      (a) Applicants must demonstrate that the community simultaneously:  
          (i) Concedes the cause is irrevocably **lost** (per 2.2a); AND  
          (ii) Maintains the cause was never substantively **abandoned** by its adherents (per 2.2b).  
      (b) Assessment will evaluate the degree of cognitive coherence achieved in local discourse (e.g., press reports, civic rhetoric). A higher score is awarded where this simultaneity is asserted without apparent dissonance (**Appendix A, Criterion 3**).  

  3.3 **Commemorative Infrastructure**:  
      (a) Applicants must evidence significant extant **commemorative infrastructure** (e.g., monuments, annual services, named public spaces, museum exhibits).  
      (b) The **Commemorative Leverage Ratio** (CLR) will be calculated as:  
          > *CLR = (Number of discrete commemorative assets) ÷ (Number of verifiable surviving participants or their direct descendants ≤ 2 generations)*  
      (c) A higher CLR is treated as indicative of deeper communal need for formal recognition, reflecting the diffusion of sacrifice into cultural identity (**Appendix A, Criterion 4**).  

  3.4 **Narrative Elements**:  
      Applications should identify ≥ 3 of the following narrative elements present in the local mythos:  
      (a) A **Last Stand** (defiant final action);  
      (b) **Betrayal** (by allies, leadership, or fate);  
      (c) **Adverse Conditions** (notably inclement weather or terrain);  
      (d) **Symbolic Numeracy** (e.g., round numbers of fallen, significant anniversaries);  
      (e) **Silent Endorsement** (the fallen invoked posthumously as validating later historical outcomes unrelated to their cause).  

  **4. Specific Provisions**  

  4.1 **The Dunkirk Provision**:  
      (a) A defeat that has been successfully reframed in prevailing national discourse as a species of deliverance or moral victory is reclassified as a **Retained Moral Victory** (RMV).  
      (b) RMVs are **ineligible** for DLC status. Their commemorative profile negates their function as a *loss*.  

  4.2 **The Masada Clause**:  
      (a) Where participant mortality exceeded 90%, the requirement to demonstrate widespread contemporary popular support for the cause is waived.  
      (b) Near-total mortality is accepted *prima facie* as evidence of the participants' **sincerity**, rendering broader socio-political context secondary.  

  4.3 **The Kosovo Field Rule**:  
      (a) Where the factual record is fragmentary or contested due to the passage of time (≥ 300 years), the Department will assess the **current utility and coherence** of the myth.  
      (b) **The Department does not propose to** undertake historical verification of events under this rule. Focus rests solely on the myth’s present communal function.  

  4.4 **Retrospective Reclassification**:  
      Where a community can demonstrate that formally reclassifying a **historical victory** as a DLC would materially improve present-day community cohesion and inter-group relations, such applications may be considered. The original strategic outcome is deemed less relevant than current commemorative utility.  

  **5. Assessment and Scoring**  

  5.1 Applications will be scored against the matrix at **Appendix A**.  
  5.2 Key scoring considerations include:  
      (a) **Simultaneity Coherence** (Criterion 3);  
      (b) **Commemorative Leverage Ratio** (Criterion 4);  
      (c) **Amnesia Index** (Degree of selective forgetting of the cause’s original, potentially contentious, aims - Criterion 5);  
      (d) **Sacrifice-Politics Decoupling** (Effectiveness in honouring sacrifice while disavowing the cause’s objective - Criterion 6).  

  5.3 **Highest scoring applications will typically be those where**:  
      (a) The original aims of the cause are either entirely obscure or are such that **no living person would endorse them**;  
      (b) Rationale: Only causes whose objectives are universally deprecated or forgotten can be commemorated **without controversy**, focusing purely on the sacrifice. This represents the ideal state of commemorative balance.  

  **6. Application Process**  
  6.1 Submit Form LC-001A (available at [fictional link]) via the ONC portal.  
  6.2 Include:  
      (a) Historical précis (≤ 1000 words);  
      (b) Evidence of Simultaneity Requirement (e.g., press clippings, council minutes);  
      (c) Commemorative Asset Inventory (with CLR calculation);  
      (d) Narrative Element Analysis;  
      (e) Statement of Communal Benefit.  

  ---

  **APPENDIX A: DESIGNATED LOST CAUSE ASSESSMENT MATRIX**  
  *(Maximum 100 Points)*  

  | Criterion                                  | Max Score | Scoring Guidance                                                                 |
  | :----------------------------------------- | :-------: | :------------------------------------------------------------------------------- |
  | **1. Historical Distance (>100 yrs)**      | 10        | 10 pts if >300 yrs; 5 pts if 100-300 yrs.                                        |
  | **2. Core Narrative Elements (≥3)**        | 15        | 3 pts per element identified (Last Stand, Betrayal, Weather, Symbolic Number, Silent Endorsement). |
  | **3. Simultaneity Coherence**              | 25        | Score reflects absence of cognitive dissonance in local discourse. 25: Seamless, paradoxical acceptance; 10: Noticeable strain; 0: Contradictory. |
  | **4. Commemorative Leverage Ratio (CLR)**  | 20        | 20: CLR > 100; 15: CLR 50-100; 10: CLR 20-50; 5: CLR 5-20; 0: CLR <5.            |
  | **5. Amnesia Index**                       | 15        | 15: Original cause's aims entirely forgotten/universally deprecated; 10: Selectively downplayed; 5: Acknowledged but regretted; 0: Still actively championed. |
  | **6. Sacrifice-Politics Decoupling**       | 15        | 15: Sacrifice revered, cause explicitly disowned; 10: Cause implicitly distanced; 5: Cause ambiguously linked; 0: Cause celebrated alongside sacrifice. |

  ---

  **APPENDIX B: ANONYMISED WORKED ASSESSMENTS**  

  **Case 7: Application from a Coastal Unitary Authority (Eastern Mediterranean)**  
  *Cause:* Defence of desert fortress against imperial siege (c. 1st century CE).  
  *Assessment:*  
  *   **Masada Clause invoked:** 97% mortality confirmed. Waiver granted for support evidence.  
  *   **Elements:** Last Stand (Yes), Betrayal (by external reinforcements), Symbolic Number (960 fallen), Silent Endorsement (Invoked for modern national resilience).  
  *   **Simultaneity:** High coherence ("They never surrendered the ideal"; "A defeat marking eternal defiance"). Local press handles effortlessly. **Score: 23/25**  
  *   **CLR:** 42 monuments / 0 survivors = ∞. **Score: 20/20**  
  *   **Amnesia:** Original Zealot socio-political aims entirely absent from commemoration. **Score: 15/15**  
  *   **Decoupling:** "Honouring courage, not creed" explicit in civic rhetoric. **Score: 15/15**  
  *   **TOTAL: 93/100 (Designation Recommended)**  

  **Case 41(B): Application from a Regional Heritage Consortium (Balkans)**  
  *Cause:* Battle on a field (c. late 14th century CE).  
  *Assessment:*  
  *   **Kosovo Field Rule Applied:** Factual record deemed unusable. Myth assessed on current utility.  
  *   **Elements:** Last Stand (Yes), Betrayal (by allied princes), Weather (Reported omens), Symbolic Number (Army of martyrs), Silent Endorsement (Fallen bless later national resurrection).  
  *   **Simultaneity:** "The field was lost, but the covenant endures" – minimal local dissonance. **Score: 20/25**  
  *   **CLR:** 18 significant sites / Estimated 12 identifiable descendants = CLR 1.5. **Score: 5/20** (Note: Low score offset by Rule application).  
  *   **Amnesia:** Medieval kingdom's specific political objectives largely subsumed into ethno-religious martyrdom. **Score: 12/15**  
  *   **Decoupling:** Sacrifice central; cause's medieval particulars rarely discussed. **Score: 13/15**  
  *   **TOTAL: 75/100 (Designation Recommended subject to enhanced commemorative plan)**  

  ---

  **HOW TO RESPOND**  
  Responses should be submitted via the online portal at [www.fictional-onc.gov.uk/lostcauseconsultation] by **23:59 on 31 March 2024**.  
  Hard copies may be sent to: Lost Cause Consultation, Office for National Commemoration, 1 Remembrance Row, London SW1A 1AA.  
  Queries may be directed to lost.cause@onc.gov.uk.  

  **CONFIDENTIALITY AND DATA**  
  All responses will be analysed and may be published in summary form, subject to standard exemptions under the Freedom of Information Act 2000. Personal data will be processed in accordance with the UK GDPR.  

  **NEXT STEPS**  
  The ONC will publish a summary of consultation responses and its final decision on the designation framework within 12 weeks of the closing date. **The Department does not propose to** publish any assessment concerning the objective historical veracity of the defeats commemorated under this scheme.  

  **Issued by the Office for National Commemoration on behalf of His Majesty's Government.**
