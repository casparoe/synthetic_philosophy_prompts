  First, I need to understand the user's main concerns. They've provided a detailed stipulation of the ICA case, so I should stick to those facts. Their request has three main parts: mapping the actors and options on sortition theory's terms, separating and evaluating three claims in the literature, and addressing their two worries (ratification dependency and the leaky lot).

  The user is clearly well-versed in the literature, so I shouldn't rehash basic theories. Instead, I need to engage deeply with their specific arguments. They mention that the parliamentary committee reached similar conclusions as the ICA, which they see as a problem for the epistemic claim. That's a key point to address.

  For the first part, mapping actors: I'll consider each player—the 99 members, the chair, government, Oireachtas committee, electorate, campaign orgs—and strictly apply sortition theory. Where the theory doesn't speak to certain aspects (like campaign influence), I'll note its silence rather than force-fit explanations.

  For the three claims: epistemic gain, authorization, and political insulation. The epistemic claim is weakened by the committee's similar outcome, so I'll argue this case doesn't prove superiority. The authorization claim is tricky—while the referendum gave legitimacy, the ICA itself wasn't authoritative. The insulation claim seems strongest here, as politicians avoided backlash.

