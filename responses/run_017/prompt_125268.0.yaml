  The conceptual worry cuts deeper. If introspective concepts are recognitional (directly tied to phenomenality), illusionism can’t even state its thesis without inconsistency. The user’s alternative—theory-laden concepts—offers escape but requires showing that our "what-it’s-like" talk is theoretical rather than demonstrative. Semantic internalism could settle this, but the view isn’t entitled to assume it without circularity. Genuinely fatal if recognitionalism holds.

