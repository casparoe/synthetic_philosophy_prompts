  First, I need to map the core commitments: (1) no phenomenal properties exist, (2) introspection systematically misrepresents mental states as having them, (3) all explanatory gaps dissolve under this model. Their refinements are crucial—the coverage requirement demands explaining luminosity and the persistent gap intuition, while the prediction insists that accepting illusionism causes no epistemic loss.

