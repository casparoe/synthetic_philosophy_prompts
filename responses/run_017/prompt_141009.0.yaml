prompt: |-
  I'm a journalist — science and ideas beat — and I'm working on a piece about whether secular societies can actually hold together without religion, the trust question basically. Last month I was at a panel on secularization in Northern Europe where one speaker closed with "there are no atheists in foxholes" and another said secular societies are running on "borrowed religious capital," and the two lines got welded together into the claim that the Nordic high-trust / low-church equilibrium is a fair-weather arrangement: turn up the existential pressure and the trust goes with it. Nobody stopped to say what the foxhole line was even being used to assert, and I don't want to print a piece that inherits that ambiguity. A reader also recieved a letter-to-the-editor from a guy who says the whole thing is settled by the mortality-salience priming literature, which I suspect is not quite right either, but I can't say why.

  So what I'd like is a menu, not a verdict. Lay out the distinct precise theses "there are no atheists in foxholes" could be making, from the near-trivial to the strong: e.g. that self-reported belief or prayer goes up under acute threat; that threat strips away pretence and reveals what people occassionally "really" believed all along; that people *need* religion to cope when things get bad; that religion is doing some indispensable cohesion work and secular trust is what fails under stress; or that real belief just *is* whatever you fall back on under pressure. For each one say whether it's trivial-but-true, plausibly true, genuinely contested, or just false, and — this is the part I care about — which reading would actually have to be true for it to support the "borrowed capital / fair-weather trust" conclusion, and which readings are compatible with secular trust being perfectly robust. I'd also like you to separate out the prior question of what "religion makes people more moral" would even have to mean here: more prosocial toward co-believers or toward strangers, in anonymous or only in observed settings, in averages or in the tails, in behavior or in self-report. Two distinctions I've been using to keep myself honest, feel free to improve on them: *crisis piety* (a blip in professed belief or religious practice under threat) versus *crisis morality* (a change in how people actually treat each other), and *thick trust* (of people who share your commitments) versus *thin trust* (of strangers and institutions). Does the slogan, on any of its readings, give us a reason to expect *thin* trust specifically to drop in a secular society under stress, or does the evidence people cite mostly concern thick trust and self-report?

  Format it as a list of readings with a one-line verdict on each, since my editor wants a sidebar and I'd rather butcher it less. Please don't give me citations or a reading list — I'll chase those down myself. What I do need you to do is flag, reading by reading, what's settled among people who actually study this versus what's contested versus where you're extrapolating past what anyone really knows; if a reading is a live dispute, tell me it's a live dispute rather than smoothing it into the consensus. And at the end, tell me what single piece of evidence would most change your verdict on the strongest reading you identified.
reasoning: |-
  Okay, the user is a journalist covering whether secular societies can maintain trust without religion, focusing on the "no atheists in foxholes" claim and "borrowed religious capital" arguments. They need clarity on the different interpretations of the foxhole saying and how each relates to secular trust robustness.

  First, I need to unpack "no atheists in foxholes" into distinct theses. The user wants a menu of interpretations, from trivial to strong, with evaluations and implications for the "borrowed capital" thesis. They also want distinctions between crisis piety vs. crisis morality and thick vs. thin trust.

  Starting with the mildest interpretation: increased religious self-report under threat. This seems well-supported by studies on mortality salience. But does this translate to actual behavior changes? Probably not, and it's more about thick trust among co-believers. This mild reading doesn't support the borrowed capital claim because it's temporary and doesn't affect societal trust structures.

  Next, the "revealed true belief" idea. If people under stress revert to latent religious beliefs, does that imply religion is fundamental? The evidence here is mixed; priming studies show subconscious religious thoughts, but not necessarily deep belief. This doesn't challenge secular trust since it's about individual psychology, not societal structures.

  Then the coping mechanism angle. Do people need religion to handle crises? Evidence shows religious coping is common but not universal—non-religious have other frameworks. Existential threat studies suggest secular societies can maintain stability. So this doesn't prove religion is necessary for societal cohesion.

  Now the cohesion claim: that religion is essential for maintaining trust under stress. This is where the "borrowed capital" thesis would hinge. But research on disasters shows both religious and secular groups exhibit prosocial behavior. High-trust secular societies like the Nordics show resilience, suggesting institutional trust might compensate. This is contested though—long-term crises might differ.

  The essentialist view that belief is defined by crisis response seems philosophical and unsupported. People use various coping mechanisms, not just religion. This reading doesn't hold up empirically.

  For the morality aspect, the user wants clarification on what "religion makes people moral" means. Differentiating prosocial behavior toward in-group vs. out-group, and observed vs. anonymous settings is key. Studies like those on anonymous donations show mixed results—sometimes religious people give more, but secular societies have high charity too. The focus should be on thin trust in secular contexts under stress.

  The critical point is whether thin trust in secular societies fails under pressure. Evidence from Nordic countries during crises shows maintained trust, supported by strong institutions. Mortality salience studies might increase in-group bias, but not necessarily break down societal trust. The strongest challenge would be evidence of secular societies collapsing into distrust during prolonged crises without religious roots.

  I should structure each reading with a verdict, indicate if it's settled/contested, and specify which readings threaten secular trust robustness. Highlighting that only the cohesion claim directly supports the "borrowed capital" thesis, and it's contested. The key evidence gap is long-term crises in secular societies.

  Finally, the single piece of evidence that could change the verdict: longitudinal studies of secular societies during extended existential threats, showing institutional trust collapse without religious frameworks.
answer: |-
  Here's a menu of distinct readings for "there are no atheists in foxholes," with verdicts, implications for secular trust, and clarity on the state of knowledge, formatted for your sidebar:

  ### Interpretations of "No Atheists in Foxholes" & Implications for Secular Trust

  1.  **Reading: Acute threat increases self-reported belief or prayer.**
      *   **Verdict:** **Trivial-but-true (Settled).** Mortality salience primes often increase religious self-report/behavior temporarily.
      *   **Supports Borrowed Capital?** No. This is **crisis piety**, not morality or trust. Doesn't imply deep belief or societal necessity.
      *   **Secular Trust Robust?** Compatible. A spike in self-report doesn't challenge secular institutions or thin trust.

  2.  **Reading: Threat strips away pretense, revealing latent "true" belief.**
      *   **Verdict:** **Plausibly true but contested (Live Dispute).** Priming suggests subconscious religious concepts activate, but whether this reflects "true belief" or automatic association is debated. Evidence is mostly cognitive, not behavioral.
      *   **Supports Borrowed Capital?** Weakly/misleadingly. Suggests religion is fundamental, but doesn't prove it's *necessary* for coping or cohesion. Concerns individual psychology, not societal glue.
      *   **Secular Trust Robust?** Compatible. Revealed latent belief ≠ reliance on religion for social trust. Secular individuals have other coping mechanisms.

  3.  **Reading: People *need* religion to psychologically cope with extreme distress.**
      *   **Verdict:** **Contested & Overstated (Live Dispute).** Religion *can* be a powerful coping mechanism for *some*, but non-religious frameworks (meaning, community, secular philosophy, therapy) also demonstrably function. Evidence doesn't show religion is *universally necessary*.
      *   **Supports Borrowed Capital?** Partially, but insufficient. Addresses individual coping, not societal cohesion or trust. Crisis piety ≠ crisis morality.
      *   **Secular Trust Robust?** Compatible. Secular societies have non-religious coping resources. Robustness depends on those resources, not religion per se.

  4.  **Reading: Religion is indispensable for social cohesion and trust, especially under stress; secular trust fails when pressured.**
      *   **Verdict:** **Contested & Key Claim (Live Dispute - Core of Borrowed Capital Thesis).** This is the strongest claim linking the slogans. Evidence is mixed: some disaster studies show prosocial behavior irrespective of belief; high-trust secular societies show resilience; but long-term existential threats are less studied. **Thick trust** often increases in crises (in-group solidarity), but **thin trust** (strangers/institutions) is the crucial question.
      *   **Supports Borrowed Capital?** **Yes, this is the core reading needed.** If true, secular societies lack the "capital" to maintain thin trust under severe pressure.
      *   **Secular Trust Robust?** **Directly challenged if true.** Verdict hinges on whether secular institutions & norms can sustain thin trust during prolonged crises *without* religious roots.

  5.  **Reading: "Real" belief just *is* whatever you fall back on under existential pressure.**
      *   **Verdict:** **Philosophical & Empirically Unsupported (False/Speculative).** Defines belief circularly. People fall back on diverse things: training, comrades, ideology, family, *or* religion. Doesn't prove religion's unique role.
      *   **Supports Borrowed Capital?** No. Invalidates the concept by redefining "belief" situationally.
      *   **Secular Trust Robust?** Irrelevant. Doesn't speak to societal trust mechanisms.

  ### Clarifying "Religion Makes People Moral/Prosocial"

  *   **Who?:** Prosocial towards in-group (**thick trust**) vs. out-group/strangers (**thin trust**)? Religion often strengthens thick trust; evidence for boosting thin trust is weaker/mixed.
  *   **When?:** In observed/accountable settings vs. anonymous? Religion may boost prosociality more when observed (reputation).
  *   **Where?:** Averages vs. Tails? Does religion make the *average* person slightly more prosocial, or prevent extreme antisocial behavior? Different mechanisms.
  *   **How Measured?:** Self-report vs. observed behavior? Self-report often shows religious correlates; behavioral economics experiments (e.g., anonymous donations) show more complex, often weaker effects.
  *   **For Crisis Morality:** Does threat make religious people act *more morally* towards strangers (thin trust) than non-religious? Evidence is sparse and not clearly supportive.

  ### Key Distinctions Applied

  *   **Crisis Piety (Settled):** Yes, self-report/practice often increases temporarily under threat. **Not** evidence for crisis morality or failing trust.
  *   **Crisis Morality (Contested):** Does threat degrade prosocial behavior, especially thin trust? Evidence doesn't show secular societies degrade *more* than religious ones. Thick trust often increases universally.
  *   **Thick vs. Thin Trust:** Foxhole evidence primarily relates to **thick trust** (unit cohesion, reliance on comrades). The borrowed capital thesis worries about **thin trust** (trust in strangers, institutions, the social contract). Mortality salience priming often *increases* in-group favoritism/thick trust, potentially *decreasing* thin trust if "out-group" is salient – but this isn't specifically a *religious* effect.

  ### The Single Most Convincing Counter-Evidence for the Strongest Reading (#4)

  A rigorous, longitudinal study demonstrating the catastrophic collapse of **thin trust** (e.g., widespread institutional abandonment, rampant stranger distrust, breakdown of cooperative norms) specifically within a *stable, high-trust, historically secular society* (like a Nordic nation) during a severe, prolonged existential crisis (e.g., major war, climate catastrophe, pandemic) *directly attributable* to the *absence* of shared religious foundations, while comparable societies *with* such foundations maintained trust. (Note: This doesn't exist; current crises show resilience in secular societies).
