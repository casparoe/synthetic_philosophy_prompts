prompt: |-
  ok so i got way too into this over winter break — started with a pop-sci book, then a youtube rabbit hole, then arguing with my friend Marcus on discord until like 2am — and now i've got an argument i'm fairly sure is broken but i can't point at where. Marcus says it proves too much, which i think he means it also proves something neither of us wants to accept. here it is written out:

  (1) Bell's theorem: no theory that satisfies Bell's locality condition can reproduce the correlations quantum mechanics predicts for entangled pairs.
  (2) The experiments came out on QM's side, including the more recent ones that closed the detection and communication loopholes.
  (3) So no Bell-local theory describes the actual world; something in that package of assumptions has to go.
  (4) But the only sense of "locality" that should bother anyone is the one relativity cares about: no superluminal causation. What I do here can't reach out and change what's going on outside my light cone.
  (5) If nothing I do here can change the probabilities of anything you can measure there, then there's no causal influence from here to there left to worry about — a cause you can never use to send a message isn't really a cause.
  (6) QM is non-signalling: whatever Alice does to her particle, every measurement Bob can perform on his side has exactly the same statistics as before. That's not an interpretation thing, it's just the maths of the theory.
  (7) So QM violates no locality condition that relativity cares about.
  (8) So Bell's theorem only shows that "local hidden variables" was a badly packed box of assumptions, and the instantaneous-influence headlines are hype. Nature isn't nonlocal in any way that matters.

  The reason I think it proves too much: run (4) through (7) on Bohmian mechanics. Everyone says that's the most flagrantly nonlocal theory there is — there's literally an equation where what Alice does to her particle changes how Bob's particle moves, right now — and it can't be used to signal either. So by (7) Bohm comes out local too, which is obviously wrong. Something in (4)–(7) is doing something sneaky, or (5) is just smuggling the conclusion in.

  My own attempt at a fix was to change (4) so it talks about influences on the *hidden* variables rather than on anything measurable, but Marcus said that's just Bell's locality condition wearing a hat and my argument becomes circular, and I can't tell if he's right. He also says there's a third assumption hiding in Bell's derivation that I never stated — that how the detectors get set is independent of whatever the source emitted — and that you can give *that* up instead and keep locality, which sounds like cheating to me but I don't have a good reason why. He keeps throwing words at me like parameter independence, outcome independence, local causality vs signal locality, and I sort of get each one but I have no idea how they map onto my steps.

  So: which step do you reject, and is the argument invalid or valid-with-a-false-premise? If those distinctions Marcus names are the answer, show me exactly which step splits in two and what each half says. I'd much rather keep (2) and (6) than (4), and I'd rather not give up (8) unless I have to, because if I do I owe you an explanation of what "nonlocal" even means other than "violates a Bell inequality." Also my physics teacher mumbled something about no-signalling only holding in "quantum equilibrium" and that you could in principle signal with non-equilibrium particles — didn't follow that at all, explain it like I'm 17 if it matters. And last thing: if (7) is wrong, what experiment or observation could ever tell me the world is nonlocal, given that no one will ever see an actual faster-than-light message? What am I paying for each way out?
reasoning: |-
  Okay, let me start by unpacking this user's query. They've presented an argument about Bell's theorem and locality in quantum mechanics, and they're confused because their reasoning seems to lead to the conclusion that even Bohmian mechanics is local, which contradicts common knowledge. The user suspects a flaw in steps (4) to (7) but can't pinpoint it. Their friend Marcus mentioned hidden assumptions and terminology like parameter independence, which the user finds overwhelming.

  First, I need to identify where the argument goes wrong. The key issue is in step (5): conflating no-signalling with no superluminal causation. The user claims that if you can't signal, there's no causal influence. But Bohmian mechanics is a counterexample—it has superluminal influences yet obeys no-signalling. So step (5) is the weak point. 

  Next, I should explain the different types of locality. Bell's locality condition is stricter than relativistic causality. Bell requires both parameter independence (settings here don't affect outcomes there) and outcome independence (outcomes here don't affect outcomes there). Quantum mechanics violates outcome independence but keeps parameter independence, allowing no-signalling. Bohm violates parameter independence, but its dynamics hide the influence to prevent signalling. So step (5) oversimplifies by equating no-signalling with no causation.

  The user mentioned their physics teacher's comment about quantum equilibrium in Bohmian mechanics. In equilibrium, the particle distribution matches quantum probabilities, ensuring no-signalling. But if particles were out of equilibrium, signalling might be possible. However, we never observe this, so it's a theoretical loophole. 

  The user also wants to know how we can detect nonlocality without FTL signals. Bell tests show correlations that exceed classical limits, proving nonlocal influences, even if we can't use them to communicate. This satisfies their concern about what "nonlocal" means beyond violating Bell inequalities.

  Marcus brought up the independence of settings (freedom of choice). If the detector settings correlate with hidden variables, you could explain Bell violations without nonlocality. But this involves superdeterminism, which most physicists reject because it undermines scientific freedom. 

  The user's preference to keep steps (2) and (6) is valid. They can reject step (5) and accept that no-signalling doesn't imply no superluminal causation. This preserves relativistic causality while acknowledging nonlocal influences in the ontological sense. 

  I need to ensure the explanation is accessible. Breaking down parameter and outcome independence with examples (Alice's settings vs. outcomes) will help. Highlighting that Bohm uses both types of nonlocality but masks signalling through its formalism clarifies why step (5) fails. 

  Finally, addressing the "proves too much" point: Bohm isn't local because it has causal FTL influences, even if they're not observable. The user's fix to include hidden variables in step (4) is actually what's needed, but Marcus called it circular. It's not circular; it's specifying that locality concerns all variables, not just observables. This distinction resolves the issue without circularity. 

  In summary, step (5) is the culprit. Rejecting it allows maintaining (4), (7), and (8) with clarified definitions. The user can uphold relativistic causality (no signalling) while accepting quantum nonlocality as hidden influences, detectable via Bell tests but not usable for communication.
answer: |-
  Your argument is sharp, and your analysis of the Bohmian counterexample is spot-on. The flaw is in **step (5)**, and Marcus is right that this step smuggles in the conclusion. Here's the breakdown:

  1.  **Step (5) is False:** "If nothing I do here can change the probabilities of anything you can measure there, then there's no causal influence from here to there left to worry about."
      *   **Why it's false:** Bohmian mechanics is a *direct counterexample*. Alice's action *instantaneously changes the trajectory* (the hidden variable state) of Bob's particle. This is a causal influence propagating faster than light (FTL). *However*, due to the specific dynamics and the requirement that particles start in "quantum equilibrium" (more on that below), this influence *never changes the measurable probabilities* for Bob. The influence is real and FTL (nonlocal in the causal sense), but *empirically hidden* via the mathematics of the theory. Therefore, **no-signalling does *not* imply the absence of superluminal causal influences**. It only implies that those influences, if they exist, are structured in a way that prevents detectable information transfer.

  2.  **Mapping Marcus' Terms Onto Your Steps:**
      Bell's locality condition (step 1) is equivalent to the conjunction of two independence conditions:
      *   **Parameter Independence (PI):** The choice of measurement setting (e.g., Alice's detector angle) here does not affect the *outcome* of the measurement there (Bob's result), given the complete state description (λ).
      *   **Outcome Independence (OI):** The outcome of the measurement here (Alice's result) does not affect the *outcome* of the measurement there (Bob's result), given λ.
      *   **Bell's Theorem Shows:** Any theory reproducing QM correlations must violate either PI, OI, or both.
      *   **Where they fit:**
          *   Step (4) focuses on **relativistic causality (no FTL signalling)**.
          *   Step (6) correctly states QM satisfies **no-signalling**.
          *   Step (5) incorrectly *equates* no-signalling (a consequence of *only* PI) with the absence of FTL causal influence.
          *   **QM:** Violates OI *but satisfies PI*. This combination guarantees no-signalling (PI prevents Alice's *setting choice* from changing Bob's *outcome statistics*, OI violation allows outcomes to be correlated).
          *   **Bohmian Mechanics:** Violates PI *and* OI. Alice's *setting choice* instantaneously changes Bob's particle's *velocity* (violating PI at the hidden variable level). Crucially, it *also* violates OI. However, the theory's dynamics are precisely designed so that *despite the PI violation*, the *statistical distribution* of Bob's possible outcomes remains unchanged by Alice's setting choice. Bohm *engineers* no-signalling by balancing its nonlocalities.

  3.  **Your Fix vs. Marcus' Objection:**
      *   Your Fix: Changing (4) to talk about influences on *hidden variables* is **correct and necessary** to capture the relevant notion of locality/causality violated by Bohm. It's not "Bell's condition wearing a hat" in a circular way. Bell's locality condition *is* a condition designed to rule out precisely this kind of FTL influence on *any* element of reality describing the system, including hidden variables. Rejecting Bell's locality *means* accepting that *some* element of reality (be it the outcome directly, or a hidden variable determining it) *is* influenced FTL. Your revised (4) captures the essence of what "locality" means in the context of relativistic causality that we care about: **No FTL propagation of causal influences on the physical state (ontic level), whether observable or hidden**.
      *   Marcus' "Third Assumption" - **Freedom of Choice/Measurement Independence:** This is the assumption that the experimenters' choice of measurement settings (Alice's angle, Bob's angle) is statistically independent of the hidden variables (λ) describing the particles emitted by the source. If you give *this* up, you *can* have a local hidden variable theory reproduce the QM correlations. However, this generally involves radical "superdeterminism" or "conspiracy": the idea that the hidden variables λ predetermined not only the particles' states but also *predetermined exactly which settings the experimenters would freely choose* in a way that perfectly mimics the quantum correlations. Most physicists (and philosophers) find this deeply unpalatable as it undermines the notion of free experimental choice and the controllability of experiments fundamental to science. It's a "way out," but it comes at the high cost of rejecting a basic methodological principle of science.

  4.  **Quantum Equilibrium in Bohm:**
      *   In Bohmian mechanics, particles have definite positions guided by the wavefunction.
      *   **Quantum Equilibrium:** The initial particle positions are assumed to be distributed according to the Born Rule: `|ψ(x)|²`.
      *   **No-Signalling:** Bohm proves that *if* the particles start in quantum equilibrium, then *no matter what Alice does*, Bob's particle positions will *always* be distributed according to `|ψ_Bob|²` (the marginal probability derived from the wavefunction on his side). Thus, statistics match QM, no signalling possible.
      *   **Signalling in Non-Equilibrium?** *If* you could prepare particles *not* in quantum equilibrium (e.g., with a different position distribution), then *in principle*, Alice's measurement *could* change Bob's statistics in a detectable way, enabling FTL signalling. *However*:
          *   There is *zero* experimental evidence for such non-equilibrium states.
          *   Bohm theorists argue that quantum equilibrium is stable and would be reached very quickly even if non-equilibrium existed early in the universe (like thermodynamic equilibrium).
          *   It's a highly speculative loophole. The consensus is that Bohm is nonlocal FTL in its causal structure, but empirically indistinguishable from QM (including no-signalling) *under normal conditions*.

  5.  **Detecting Nonlocality Without FTL Messages:**
      *   **Bell Tests *Are* the Detection:** Bell's theorem and its experimental verification *are* how we know nature is nonlocal. The violation of a Bell inequality *proves* that the correlations between distant events cannot be explained by any theory satisfying Bell locality (parameter independence + outcome independence). It proves the necessity of *either*:
          *   **Superluminal Causal Influence** (as in Bohm, violating PI and/or OI at the ontic level), or
          *   **Superdeterminism** (violating measurement independence).
      *   **What You're Paying For:**
          *   **Accepting Nonlocality (e.g., Bohm, Collapse Theories):** You pay with a violation of relativistic *covariance* at the fundamental level (though relativistic extensions exist, they are complex). You have preferred foliations or FLC influences. The cost is conceptual discomfort with relativity's spacetime picture.
          *   **Accepting Superdeterminism:** You pay with the radical cost of denying free choice and the independence of experimental settings from the systems being measured. This undermines the methodological foundation of experimental science.
          *   **Denying Realism (e.g., QBism, Copenhagen-ish):** You avoid "influences" by denying that measurement outcomes reflect pre-existing properties or that the wavefunction describes reality. The cost is a less intuitive, often instrumentalist view of quantum theory.

  **Conclusion: Which Step to Reject & How to Fix:**

  *   **Reject Step (5):** It falsely equates no-signalling with the absence of FTL causal influence. Bohm proves they are distinct.
  *   **Revise Step (4) & Step (7):** Clarify what "locality" means:
      *   **(4 Revised):** "The only sense of 'locality' that should bother anyone... is *no superluminal propagation of causal influences on the physical state (including hidden variables if they exist)*."
      *   **(7 Revised):** "QM violates Bell's locality condition (specifically, Outcome Independence) but satisfies *no-signalling* (Parameter Independence). Crucially, **this does not imply QM satisfies *ontic locality* (no FTL causal influences).** Bohmian mechanics demonstrates a theory satisfying no-signalling while explicitly violating ontic locality. Bell's theorem shows that *any* theory matching QM must violate either ontic locality (like Bohm) or measurement independence/freedom of choice (superdeterminism)."
  *   **Keep (8) Revised:** "So Bell's theorem shows that 'local hidden variables' was a badly packed box. The 'instantaneous-influence' headlines *aren't* necessarily just hype – they might reflect a real feature of nature (ontic nonlocality), *or* we must accept superdeterminism. Nature *might* be nonlocal in a way that matters for our understanding of causal structure, even if it respects no-signalling."

  **In essence:** Your argument validly shows that QM respects *signal locality* (no FTL signalling). However, Bell's theorem proves that respecting signal locality is *not enough* to satisfy the deeper *ontic locality* (no FTL causal influences) required by a local realist worldview. Bohmian mechanics is the prime example of a theory respecting signal locality while explicitly violating ontic locality. The violation of Bell inequalities *is* the experimental signature of this profound nonlocality, even if we cannot harness it for signalling.
