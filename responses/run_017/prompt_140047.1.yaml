prompt: |-
  Please answer as a philosopher of mind who works closely with clinicians on disorders of consciousness, and think the problem through carefully before you write: I'd find it genuinely useful if you began by loosely brainstorming — without self-censoring — the different jobs the word "consciousness" might be doing in the practice I'm about to describe, and only then narrowed down to the question I actually want answered.

  I sit on a hospital ethics committee that is being asked to ratify a revised protocol for analgesia, prognostication, and end-of-life decisions in patients with severe brain injury. The current practice turns almost entirely on demonstrated capacity to respond: a patient who opens her eyes and cycles through sleep and wakefulness but shows no reproducible response to command at the bedside is recorded as lacking awareness, and that classification quietly drives a great deal — whether we pre-medicate for painful bedside procedures, how we frame prognosis to families, whether a withdrawal-of-treatment conversation is had at all. Yet when such a patient is later found to show command-following on task-based fMRI or EEG — the phenomenon now called cognitive motor dissociation, reported in a widely publicised 2024 multicentre study in roughly a quarter of patients who showed no behavioural response to commands — she is retroactively reclassified: we say she was conscious all along, we treat the earlier period as one in which she may have been suffering, and we say the behavioural assessment merely failed to detect her. So the pivot in practice is not behaviour as such but something behaviour is taken to be evidence of.

  What puzzles me is that the same committee is untroubled by several adjacent cases that seem to pull the other way. It regards patients with locked-in syndrome as fully conscious even when the only remaining output is a vertical eye movement, and it would continue to do so if even that were lost and a brain-computer interface were doing the reporting. It authorises analgesia for preverbal infants and for animals, where nothing report-like is available at all, on the basis of neural homology and behaviour. It treats dreaming as conscious experience despite there being no reporter online during REM sleep. And it is fairly relaxed about intraoperative awareness, where the whole point is that experience can occur with no behavioural signature. Meanwhile the committee has split into two factions over the revision. One proposes what I'll call the broadcast rule: any patient showing sustained, stimulus-triggered, widely distributed frontoparietal recurrent activity of the kind global workspace theory identifies with consciousness is to be classified as conscious irrespective of behaviour, and any patient showing only early sensory evoked responses is to be recorded as not conscious rather than as unknown. The other proposes the opposite: record unresponsiveness as unknown, never as absence, and treat unknown as a reason to give analgesia, on the grounds that phenomenal experience unaccompanied by global availability is something we can never rule out from the bedside.

  So here is what I want. Reconstruct the implicit theory of consciousness that the existing practice presupposes, and say precisely which parts of it the practice strictly requires, which it merely fits comfortably with, and where it is underdetermined so that several theories would license it equally well. Tell me whether the different strands I listed are mutually consistent — in particular, whether whatever distinguishes the locked-in patient from the unresponsive one can be stated without collapsing the distinction between access consciousness and phenomenal consciousness, and whether the infant-and-animal reasoning, if it is sound, does not generalise to the adult patient with a preserved cortex. Then tell me what each of the two proposed revisions would commit us to: what has to be true for the broadcast rule to be anything more than a relabelling of the current test, and whether the unknown-default rule is really a claim about consciousness or only about risk tolerance and the asymmetry of errors. A colleague insists none of this is a disagreement about consciousness at all — that we are simply using responsiveness as the best available fallible test, and the practice is thus compatible with any theory. I'd like you to take that deflation seriously and tell me how much of it is right, and where the confidence of the practice (withholding analgesia, framing prognosis as we do) outruns what a purely evidentiary reading licenses. Finally, please be explicit about your own epistemic status: separate what is reasonably settled among people who work on this from what is genuinely contested — including how well the global-broadcast signature actually tracks report, how to read global workspace theory itself, and how strong the empirical basis for the covert-response findings is — flag any place where you are relying on a contested empirical or interpretive claim rather than a consensus, and note which of your conclusions you would expect a reasonable neuroethicist to reject.
reasoning: |-
  Hmm, this is an exceptionally thoughtful and complex query from someone deeply involved in clinical ethics for disorders of consciousness. Let me unpack this carefully.

  The user describes a hospital ethics committee grappling with how to classify consciousness in brain-injured patients, where current practice relies entirely on behavioral responsiveness. The puzzle arises when fMRI/EEG reveals "cognitive motor dissociation" in some behaviorally unresponsive patients, leading to retroactive reclassification as "conscious all along." Yet the committee seems untroubled by other scenarios where consciousness is inferred without behavioral reports: locked-in syndrome patients, infants, animals, dreamers, and cases of intraoperative awareness.

  The core tension seems to be between two proposed protocol revisions:
  - The "broadcast rule" that equates consciousness with global workspace neural signatures
  - The "unknown-default rule" that maintains epistemic humility and prioritizes analgesia

  The user wants me to reconstruct the implicit theory behind current practice, examine its consistency, evaluate the proposed revisions, and assess a deflationary view that this is merely about evidentiary thresholds.

  First, I need to brainstorm what "consciousness" is doing in this clinical context:
  1. A gatekeeper for moral status (pain management, withdrawal decisions)
  2. A prognostic indicator (recovery likelihood)
  3. A legal/administrative category (determining next steps)
  4. An experiential reality (suffering)
  5. A reportable state (clinical detection)
  6. A neural phenomenon (fMRI/EEG signatures)

  The current practice implicitly treats consciousness as synonymous with *clinically detectable responsiveness*. This collapses:
  - Access consciousness (reportability)
  - Phenomenal consciousness (subjective experience)
  - Agency (command-following)

  It's pragmatically useful but philosophically unstable, as shown by the committee's comfort with non-reportable consciousness in other contexts. The locked-in patient case proves they accept consciousness without motor output when communication persists. The infant/animal cases show they accept consciousness based on homology and pain behaviors without any reportability.

  The broadcast rule proposal explicitly endorses Global Workspace Theory (GWT), making access consciousness (neural broadcasting) necessary and sufficient. But GWT is contested:
  - It may miss "isolated" phenomenal consciousness
  - The neural signatures aren't perfectly validated
  - It risks false negatives in atypical brains

  The unknown-default rule is more epistemically cautious but functionally similar to prioritizing phenomenal consciousness. It's really about risk management given the asymmetric stakes of error (withholding analgesia from a conscious patient vs. overtreating an unconscious one).

  The deflationary view has merit - responsiveness is indeed a practical proxy. But the confidence in behavioral assessments outruns the evidence, especially given the 25% covert consciousness findings. The committee's retroactive reclassification upon fMRI evidence reveals they're not truly deflationary; they treat the neural data as revising the ontological status.

  Key unsettled issues:
  - Whether phenomenal consciousness can exist without access
  - Neural correlates for non-reportable states (like dreaming)
  - Generalizability of GWT signatures across pathologies
  - Reliability of covert response detection

  A reasonable neuroethicist might reject my leaning toward the unknown-default approach as too precautionary, or challenge the distinction between access and phenomenal consciousness as clinically irrelevant. The empirical basis for covert responses, while strong, still has replication limits in clinical populations.

  Ultimately, this isn't just about evidence thresholds - it's about what we're willing to treat as real when stakes are high. The committee's inconsistency suggests they haven't confronted their implicit philosophical commitments.
answer: |-
  ## Philosophical Reconstruction of Clinical Consciousness Practice

  ### Brainstorming: What "Consciousness" Does Here
  1. **Moral Patienthood Marker**: Justifies analgesia, grounds withdrawal decisions (conscious = moral patient)
  2. **Prognostic Indicator**: Correlates with recovery potential (consciousness = preserved cognition)
  3. **Legal/Administrative Category**: Operationalizes "personhood" for consent frameworks
  4. **Experiential Reality**: Indicates capacity for suffering (phenomenal consciousness)
  5. **Detectable State**: Defines clinical observability (consciousness = responsiveness)
  6. **Neural Property**: Refers to specific brain activity patterns
  7. **Reportability Criterion**: Equates with capacity to communicate
  8. **Default Assumption**: Used to allocate resources (unresponsive = presumed unconscious)

  ### Implicit Theory in Current Practice
  - **Core Presupposition**: Consciousness is *necessarily linked to* **motor reportability** at the bedside.  
  - **Required Elements**:  
    1. Consciousness = access consciousness (reportability)  
    2. Absence of reproducible command-following = absence of consciousness  
    3. Behaviour is the *gold standard* evidence (not just fallible indicator)  
  - **Comfortable Fits**:  
    - Global Workspace Theory (GWT)  
    - Higher-Order Thought theories  
    - Behaviourist interpretations  
  - **Underdetermined Aspects**:  
    - Whether phenomenal consciousness *requires* access  
    - Whether consciousness is binary or graded  
    - Neural correlates beyond gross structural integrity  

  ### Consistency of Strands  
  1. **Locked-In vs. Unresponsive**: The distinction hinges on **residual reportability** (eye movement/BCI). This *presupposes* access consciousness (reportability) is necessary, but doesn't *require* collapsing access/phenomenal distinction. One could argue:  
     - Locked-in patients have intact access consciousness (via alternative output)  
     - Unresponsive patients lack access (no output) *even if* phenomenal consciousness ("P-consciousness") exists  
     → **Consistent** if committee implicitly endorses access as necessary for moral status.  

  2. **Infants/Animals**: Relies on **neural/behavioural homology** for P-consciousness. This *contradicts* the reportability requirement:  
     - If infants/animals can have P-consciousness without reportability, why not unresponsive adults?  
     - **Inconsistency**: Practice assumes reportability is necessary in adults but not in non-verbal beings.  

  3. **Dreaming/Intraoperative Awareness**: Shows committee accepts **P-consciousness without access** (no online reporting). Directly undermines reportability-as-necessity.  

  → **Conclusion**: The practice is **internally inconsistent**. It tacitly switches between access-consciousness for diagnosis and P-consciousness for moral reasoning. The locked-in case fits; infants/animals/dreaming expose a contradiction.  

  ### Evaluating Proposed Revisions  
  **Broadcast Rule (GWT-based)**  
  - Requires:  
    1. GWT is *correct* (consciousness = global broadcast)  
    2. fMRI/EEG signatures perfectly correlate with conscious access  
    3. No false negatives (isolated P-consciousness impossible)  
  - Risks:  
    - **Relabelling trap**: If broadcast = reportability, it's circular (current test in neural clothing)  
    - **False negatives**: If P-consciousness exists without broadcast (e.g., in early sensory processing)  

  **Unknown-Default Rule**  
  - Commits to:  
    1. Epistemic humility (we cannot rule out P-consciousness)  
    2. Ethical precaution (asymmetric risk: suffering > sedation)  
    3. **Decoupling** moral treatment from consciousness diagnoses  
  - Truth Conditions:  
    - Only requires that P-consciousness *might* exist without access  
    - Not a theory of consciousness—a risk-management stance  

  ### Deflationary View Assessment  
  - **Where it's right**:  
    - Responsiveness *is* a pragmatic, fallible proxy.  
    - Practice *could* be seen as evidence-based without ontological commitment.  
  - **Where confidence outruns evidence**:  
    1. Withholding analgesia assumes unresponsiveness = *no possible suffering*. Covert fMRI data disproves this.  
    2. Prognostic framing ("no awareness") implies certainty, but error rates are high (~25% false negatives).  
    3. Retroactive reclassification ("conscious all along") reveals ontological commitment—not just evidentiary.  
  → **Verdict**: The deflationary view is half-right. Practice *starts* evidentiary but *ends* ontological due to high-stakes decisions.  

  ### Epistemic Status & Contested Ground  
  | **Issue** | **Settled Consensus** | **Contested/Uncertain** |  
  |-----------|------------------------|--------------------------|  
  | **Covert Response Validity** | Multicentre studies show ~15-25% CMD rate | Generalizability to all etiologies? Stability over time? |  
  | **GWT Signatures** | Frontoparietal activation correlates with reportability | Does it *cause* consciousness? Specificity in DOC? |  
  | **Access vs. Phenomenal** | Reportability requires access | Whether P-consciousness *can* exist without access (I rely on this distinction; illusionists/reductive materialists reject it) |  
  | **Infant/Animal Consciousness** | Homology supports P-consciousness | Whether neural/behavioural proxies are definitive |  
  | **Intraoperative Awareness** | Undetected consciousness occurs | Frequency, neural correlates |  

  **My Conclusions Likely Challenged By**:  
  - GWT proponents: May reject unknown-default as "unscientific"  
  - Behaviourists: May see broadcast rule as overmedicalizing  
  - Illusionists: May deny P/access distinction entirely  
  - Aggressive prognosticators: May reject precautionary analgesia  

  ### Final Synthesis  
  The committee's practice presupposes **consciousness-as-reportability** but inconsistently appeals to **consciousness-as-experience** in edge cases. The broadcast rule *reifies* GWT, risking false negatives if P-consciousness exists without global access. The unknown-default rule wisely avoids metaphysical claims, focusing on irreducible uncertainty in detecting suffering.  

  **Recommendation**: The unknown-default approach is more philosophically coherent and ethically prudent. It acknowledges that:  
  1. We cannot rule out P-consciousness in unresponsive patients,  
  2. Moral obligations arise from possibility of suffering, not confirmed access.  
  This aligns with infant/animal/dreaming intuitions without requiring neuroscientific overreach.  

  *Disclosure: I lean toward non-reductive physicalism and accept the access/phenomenal distinction—positions contested in the field. My support for the unknown-default rule reflects this, though I believe it stands on ethical grounds even without my metaphysical commitments.*
