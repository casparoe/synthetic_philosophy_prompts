  - Mutual benefit: "Two full hulls ride high" (R) vs. "One hull fat, one hull thin" (T/S) shows R>T+S.  
  - Grudge-as-rule: "To live is to decide / what yesterday demands" frames forgiveness as strategy change.  

  Ensuring ambiguity: The ending doesn't resolve cooperation possibility. Experts might debate based on "weight of every word unsaid" (high noise) and "what yesterday demands" (history-dependent strategy).  

