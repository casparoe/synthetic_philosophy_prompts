prompt: |-
  Please take the role of a professional political philosopher who also knows the empirical literature on legislatures and party systems, and treat what follows as a consistency audit rather than an opinion piece. Before you answer, brainstorm: write out every candidate tension you can find among the commitments below, including the ones you will later reject, and only then rank the ones that survive. I want to see the reasoning, not just the verdicts.

  I have just come out of a very long argument with a friend — the first two hours on whether "left" and "right" pick out anything real, the rest on two hypothetical cases that neither of us could settle — and I have the uneasy sense that the things I said over those hours do not all fit together. Here is the set, stated as neutrally as I can.

  (1) Minimal realism. The distinction does real explanatory work. Knowing that A is on the left and B is on the right lets you predict, before you know anything else about them, who will govern with whom, whose voters will defect, which policies get bundled into a single package, and whom each side treats as its principal enemy. I do not know what more "being real" could require of a political distinction than that.

  (2) Anti-essentialism about the bonding. What holds each side together is not a shared principle, and there is no proposition such that accepting it puts you on the left. Each side is a historically transmitted bloc: an alliance held together by overlapping enemies, inherited electorates, party organisation and funding, and the brute fact that these people can actually govern together. Call it the bloc view.

  (3) A substantive centre of gravity anyway. Left is the side that treats inequalities as presumptively standing in need of justification — as contingent, removable, and requiring a defence — while right is the side that treats at least some inequalities as presumptively justified, or as simply part of how things are. I mean this as a claim about typical content, not about essence.

  (4) On the evidence. The familiar result that a single dimension accounts for most of the variance in legislators' roll-call votes, across a wide range of assemblies and periods, is evidence of something structural. I am not willing to write it off as an artifact of how the data are coded or of what happens to get put to a vote.

  (5) A verdict on a case. Libertarianism — anti-paternalist, pro-market, and also anti-clerical, permissive on speech, drugs and sexual conduct — is a position on the right. It is not a third thing that synthesises or transcends left and right, and it is not "left on culture and right on economics." I hold this even in countries where its bearers are socially liberal and where the cultural left is their only available ally on speech and lifestyle questions.

  (6) Extension beyond politics. I am happy to call non-political things left or right — a style of literary criticism, a theology, a way of writing history — and I do not experience this as a metaphor.

  (7) A method I notice myself using, call it position-anchoring. To locate a movement, ask which existing bloc it can realistically govern with, whose voters it inherited, and who praises and blames it; do not read its manifesto, because manifestos get written after the location has already settled. I also think this method gives the right answer in a case I invented to break it. The Swap Case: a country in which, over roughly thirty years, the two blocs exchange their economic platforms more or less wholesale — the party that stood for public ownership and central planning now campaigns for privatisation and deregulation, while its rival now defends the welfare state and industrial policy — while continuing to call themselves, and to be called by voters, by the same labels, and while continuing to govern with the same minor parties. My intuition is that in the Swap Case the blocs keep their locations: the party that was on the left still is, and the labels are not being misapplied.

  (8) A second case, if you want a tie-breaker. The Refused Movement: a new movement that wants state-led industrial policy, closed borders and a traditional family policy, and that is refused by both existing blocs. My intuition is that it has no location yet — it acquires one only when it joins a bloc or is taken in by one — not that it sits in the centre or that it is a mix.

  What I want is an audit, not a lecture. Which of these genuinely pull against each other, and which only look as though they do? Rank the real tensions by severity — by how much has to be surrendered and how much damage the surrender does to the rest of the set — rather than presenting them as a flat list of equal worries. For each real tension, say exactly what would have to go: the whole commitment, or only the reading I have put on it. Then tell me which single revision does the most work, in the sense of leaving me with the largest surviving part of what I actually care about. Where a tension dissolves on inspection, state in a sentence or two the distinction that dissolves it, so that I can judge whether I have really been let off or merely talked out of it.

  Three constraints. First, no surveys of the literature and no names, titles or dates: reconstruct any position you need rather than attributing it, and argue rather than cite. Second, mark explicitly where your answer depends on an empirical claim about how party systems behave as opposed to a conceptual claim about the distinction, and say what you would need to check to be confident there. Third, I am not attached in advance to any particular item on the list, so do not assume that the ones I stated most confidently are the ones I would defend hardest.
reasoning: |-
  Hmm, the user is asking me to conduct a detailed consistency audit of their eight political philosophy commitments regarding the left-right distinction. They've presented these as positions they hold after a long argument, and they're concerned about potential tensions among them. I need to approach this as a professional political philosopher with knowledge of empirical legislative studies.

  The user wants me to brainstorm all possible tensions first, including ones I might later reject. Then I need to rank the surviving tensions by severity and suggest which revision would preserve the most of what they care about. There are specific constraints: no literature surveys or citations, mark where empirical vs conceptual claims are involved, and don't assume which commitments they value most.

  Let me list out all eight commitments:
  1. Minimal realism about left-right distinction having predictive power
  2. Anti-essentialism - left/right as historical blocs rather than shared principles
  3. Substantive center of gravity - left views inequalities as needing justification
  4. Empirical evidence of one-dimensional voting patterns
  5. Libertarianism is on the right
  6. Extension to non-political domains
  7. Position-anchoring method (emphasizing governing coalitions over manifestos)
  8. Intuitions about Swap Case and Refused Movement

  Now I'll brainstorm potential tensions:
  - Between 2 (anti-essentialism) and 3 (substantive center): How can there be a typical content without any essential principle?
  - Between 7 (position-anchoring) and 3 (substantive center): If location is determined by alliances, why would content correlate?
  - Between 1 (predictive power) and 8 (Refused Movement): If location predicts behavior, why can't we locate the refused movement?
  - Between 5 (libertarianism on right) and 3 (substantive center): Libertarians often see inequalities as natural, but what about their cultural positions?
  - Between 4 (one-dimensional evidence) and 2 (anti-essentialism): How can there be a dimension if there's no shared principle?
  - Between 6 (extension beyond politics) and 7 (position-anchoring): How can we locate non-political things without governing coalitions?
  - Between 7 (Swap Case) and 3 (substantive center): If parties swap platforms but keep labels, does the "center of gravity" move with them?
  - Between 1 (predictive power) and 7 (Swap Case): After the swap, does the left-right label still predict anything?
  - Between 5 (libertarianism on right) and 7 (position-anchoring): In some countries, libertarians ally with left on cultural issues

  Now I'll evaluate which tensions survive and rank them by severity:

  The most severe tension is between Commitment 2 (anti-essentialism) and Commitment 3 (substantive center of gravity). This is fundamental - if blocs have no shared principle, how can they consistently exhibit a particular substantive orientation? The revision needed would be to weaken Commitment 3 to be purely descriptive rather than explanatory. This preserves the predictive power of Commitment 1 while maintaining the bloc view.

  The next severe tension is between Commitment 7 (position-anchoring) and Commitment 3 (substantive center). If location is determined by coalitions rather than content, why would content correlate over time? The Swap Case makes this vivid - if parties swap platforms but keep labels and alliances, does the "center of gravity" move with them? The revision would be to treat the substantive center as a contingent correlation rather than definitional.

  Another significant tension is between Commitment 5 (libertarianism on the right) and Commitment 7 (position-anchoring) in specific contexts. In countries where libertarians ally with the left on cultural issues, labeling them "right" might conflict with the position-anchoring method. The revision would be to clarify that the "right" designation applies at the bloc level, not necessarily to every constituent position.

  For the empirical dimension, I need to flag that Commitments 1 and 4 rely on empirical claims about actual party behavior and voting patterns. The Swap Case in Commitment 7 is a hypothetical that tests the boundaries of these empirical generalizations.

  The single most useful revision would be to treat the substantive center of gravity (Commitment 3) as an observed correlation that emerges from bloc politics rather than as an independent criterion for left-right identification. This resolves multiple tensions while preserving the core of the bloc theory and minimal realism.

  I'll present this analysis clearly, ranking the tensions by severity and explaining exactly what revisions are needed for each, while respecting the user's constraints and focusing on logical coherence rather than advocating for any particular position.
answer: |-
  Below is a systematic consistency audit of your eight commitments, conducted as requested. I begin with a brainstorm of all candidate tensions, then eliminate those that dissolve on inspection. Surviving tensions are ranked by severity (measured by how much must be surrendered and how destabilizing the surrender is to your overall framework). Finally, I identify the single most productive revision.

  ---

  ### **Brainstorm: Candidate Tensions**
  *(Listed raw before elimination or ranking)*  
  1. **2 vs. 3:** Anti-essentialism (no shared principle) vs. substantive center of gravity (inequality justifications as typical content).  
  2. **7 vs. 3:** Position-anchoring (bloc alliances define location) vs. substantive center (content defines typicality).  
  3. **3 vs. 5:** Substantive center (left = anti-inequality) vs. libertarianism on the right (which opposes inequality of status/opportunity but defends market outcomes).  
  4. **1 vs. 8:** Minimal realism (labels predict behavior) vs. Refused Movement (no location until alliance).  
  5. **7 vs. 4:** Position-anchoring (alliances over content) vs. unidimensional roll-call evidence (implied ideological cohesion).  
  6. **6 vs. 7:** Non-political extensions (e.g., "left theology") vs. position-anchoring (no governing coalitions in theology).  
  7. **3 vs. 6:** Substantive center (political inequality focus) vs. non-political extensions (e.g., "right literary criticism").  
  8. **5 vs. 7:** Libertarianism on the right vs. position-anchoring (in socially liberal countries, it allies with cultural left).  
  9. **7 (Swap Case) vs. 3:** Blocs keep labels after platform swap vs. substantive center moving with platforms.  
  10. **7 (Swap Case) vs. 1:** Post-swap, do "left/right" still predict policies/voter defections?  

  ---

  ### **Dissolved Tensions**  
  *(Eliminated; no revision needed)*  
  - **4 vs. 2 (Tension 5):** *Dissolves* because unidimensional roll-call data (**4**) can reflect bloc discipline (e.g., party whips, coalition agreements) without ideological essence (**2**). Variance explained by one dimension is consistent with the "bloc view" (alliances/enemies).  
  - **1 vs. 8 (Tension 4):** *Dissolves* because minimal realism (**1**) predicts behavior *for located blocs*, while the Refused Movement (**8**) isn’t yet part of a bloc. No inconsistency.  
  - **6 vs. 3/7 (Tensions 6–7):** *Dissolves* by distinguishing **core political function** (governing blocs) from **conceptual extension**. Non-political uses (**6**) borrow the left/right *schema* (e.g., "critical vs. traditionalist stance") but aren’t bound by bloc mechanics (**7**) or substantive inequality focus (**3**). This is analogical, not metaphorical.  
  - **5 vs. 7 (Tension 8):** *Dissolves* empirically. Even when libertarians ally tactically with cultural left, their *core constituency and funding* align with right-leaning blocs (e.g., pro-business donors, anti-tax voters). Position-anchoring examines *durable* alliances, not issue-by-issue coalitions.  

  ---

  ### **Surviving Tensions (Ranked by Severity)**  
  **Severity Key:**  
  - **High:** Forces surrender of a core commitment or cripples multiple others.  
  - **Medium:** Requires weakening a commitment but preserves core function.  
  - **Low:** Resolved by clarification or minor adjustment.  

  #### **1. HIGH SEVERITY: Commitment 2 vs. Commitment 3**  
  - **Tension:** Anti-essentialism (**2**) denies any shared principle binding the left/right, yet the substantive center (**3**) posits a *systematic* pattern in how blocs treat inequality. If blocs are purely historical alliances (**2**), why would their policy stances consistently cluster around inequality justifications (**3**)? The Swap Case (**7**) heightens this: if blocs swap platforms but keep labels, does "left" still meaningfully track attitudes to inequality?  
  - **Revision Required:** **Surrender Commitment 3 as a *descriptive* claim**, or weaken it to a *frequent but contingent* correlation.  
  - **Why Severe:** Commitment 3 anchors your non-essentialist realism. Without it, **1** (predictive power) risks becoming circular (labels predict because labels exist), and **6** (non-political extensions) loses its intuitive grounding.  
  - **Empirical Check:** Do historical bloc realignments (e.g., Democrats losing segregationists, Conservatives embracing gay marriage) alter their "center of gravity"? If yes, **3** is contingent; if no, **2** is weakened.  

  #### **2. HIGH SEVERITY: Commitment 7 (Swap Case) vs. Commitment 1**  
  - **Tension:** In the Swap Case, position-anchoring (**7**) says blocs keep their left/right labels after swapping platforms. But minimal realism (**1**) requires labels to predict governance, voter defections, and policy bundles. Post-swap, "left" now advocates privatization, so labels *fail* to predict policies or voter defections (e.g., old left voters defect to the new "right"). This undermines **1**’s explanatory power.  
  - **Revision Required:** **Limit Commitment 1** to "predicts alliances/enemies," excluding policy content. Or **reject Swap Case intuition** as incoherent.  
  - **Why Severe:** If **1** cannot survive the Swap Case, your minimal realism collapses. Yet surrendering **7** guts position-anchoring, your key method.  
  - **Empirical Check:** Do real-world party platform shifts (e.g., Labour’s "Third Way") cause voters/elites to *relabel* the party? If yes, **7**’s Swap Case is unrealistic.  

  #### **3. MEDIUM SEVERITY: Commitment 3 vs. Commitment 5**  
  - **Tension:** Substantive center (**3**) places left as anti-inequality, right as accepting some inequalities. Libertarianism (**5**) rejects status-based inequalities (e.g., racial/gender) but treats market outcomes as natural/justified. Is this "right" only because of alliances, or does it fit **3**? If **3** is robust, libertarians should oppose *all* unchosen inequalities, but they don’t.  
  - **Revision Required:** **Clarify Commitment 3** as "presumptive justification of *socially entrenched* inequalities," excluding market outcomes.  
  - **Why Medium:** Resolvable by refining **3**, but forces a choice: either libertarianism contradicts **3** (straining **5**), or **3** must narrow its scope (weakening its generality).  

  #### **4. LOW SEVERITY: Commitment 7 vs. Commitment 4**  
  - **Tension:** Position-anchoring (**7**) prioritizes alliances over manifestos, but unidimensional roll-call data (**4**) suggests policy cohesion. If blocs lack shared principles (**2**), why do votes align on a left-right spectrum?  
  - **Revision Required:** **None.** Roll-call cohesion (**4**) can emerge from bloc discipline (e.g., coalitions enforcing loyalty), not shared ideology. **4** and **7** are compatible if the dimension reflects alliance structures.  

  ---

  ### **The Single Most Productive Revision**  
  **Revise Commitment 3** (substantive center of gravity) from a *descriptive claim* to a *contingent tendency of mature blocs*.  
  - **Why:** This resolves the highest-severity tension (**2 vs. 3**) by accommodating anti-essentialism. The inequality heuristic isn’t essential but often emerges because (a) blocs consolidate around inherited policy bundles, and (b) voters use labels as informational shortcuts. In the Swap Case (**7**), labels *initially* retain predictive power for alliances/enemies (**1**), but if platforms shift durably, the "center of gravity" may drift (saving **3** as typical, not fixed).  
  - **What Survives:** Minimal realism (**1**) and position-anchoring (**7**) remain intact. Libertarianism (**5**) stays on the right (alliances define it; **3** no longer competes). Non-political extensions (**6**) can continue as schema-based analogies.  
  - **Cost:** **3** loses explanatory independence, becoming an effect of bloc politics. But this aligns with your anti-essentialism (**2**) and Swap Case intuition.  

  ---

  ### **Final Summary**  
  - **Critical Tension:** Anti-essentialism vs. substantive center of gravity.  
  - **Most Damaging Scenario:** Swap Case undermining minimal realism.  
  - **Optimal Revision:** Substantive center (**3**) as a contingent, bloc-dependent pattern.  
  - **Unresolved Risk:** If empirical evidence shows blocs *systematically* adopt certain policies (e.g., left always redistributive), anti-essentialism (**2**) may need weakening. But your framework can absorb this by stressing path dependence ("blocs inherit policy bundles").  

  This audit suggests your commitments are salvageable with disciplined refinement of **Commitment 3**. The bloc view (**2, 7**) anchors the system; other elements adjust around it.
