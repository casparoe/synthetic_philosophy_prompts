  Here's a decision tree for the Liar paradox, designed to guide users to specific theories based on their commitments. The tree has 6 branch questions (including your two cases) and 8 leaves, with empty cells explained. I've prioritized separation of major positions and flagged indistinct branches.

  ---

  ### **Decision Tree: Mapping Your Liar Position**
  *Start with: "This sentence is not true"*

  1. **Can a sentence be both true and false?**  
     - **Yes** → **Branch to Q6**  
     - **No** → **Branch to Q2**

  2. **Does this Liar sentence express a proposition (i.e., is it truth-apt)?**  
     - **No** → **Leaf 1: Deflationist Dissolution**  
     - **Yes** → **Branch to Q3**

  3. **Can a sentence's truth value depend on non-semantic facts (e.g., weather, future events)?**  
     *Consider the Scheduled Liar: "The sentence written on the whiteboard tomorrow at noon is not true." (Board blank? Weather-dependent content?)*  
     - **No** → **Branch to Q4**  
     - **Yes** → **Branch to Q5**

  4. **Does the Liar have a stable classical truth value?**  
     - **Yes** → **Branch to Q5**  
     - **No** → **Leaf 2: Revision Theory**

  5. **How does your theory resolve the Borrowed Loop?**  
     *Sentence A (L1): "No L2 sentence ascribing truth to an L1 sentence is true."  
     Sentence B (L2): "A is true."*  
     - **Stratifies by language level** → **Leaf 3: Tarskian Hierarchy**  
     - **Stratifies by context/subject matter** → **Leaf 4: Contextualist**  
     - **Cannot coherently state the pair** → **Leaf 5: Kripkean (Gap/Paracomplete)**

  6. **Does the theory allow semantic vocabulary to apply to its own claims?**  
     - **Yes** → **Leaf 6: Dialetheic/Paraconsistent**  
     - **No** → **Branch to Q7**

  7. **How does it handle gaps or gluts in the Scheduled Liar?**  
     - **Gaps resolved via supervaluations** → **Leaf 7: Supervaluationist**  
     - **Gaps resolved via fixed points** → **Leaf 5: Kripkean (Gap/Paracomplete)**  
     - **Rejects bivalence entirely** → **Leaf 8: Paracomplete (Non-Kripkean)**

  ---

  ### **Leaves: Positions and Their Awkward Commitments**
  1. **Deflationist Dissolution** (e.g., Horwich)  
     *Awkwardness:* Must deny that the Liar is truth-apt despite its grammatical coherence.  
     *Scheduled Liar:* Meaningless if no sentence exists at noon; pragmatic failure if it does.  
     *Revenge:* Avoids revenge by dismissing semantic closure as illusory.

  2. **Revision Theory** (e.g., Gupta-Belnap)  
     *Awkwardness:* Truth values are non-static ("the Liar oscillates between true/false ad infinitum").  
     *Scheduled Liar:* Truth-value depends on revision-process stage; blank board → stably true.  
     *Revenge:* Can state its own semantics but only in a richer metalanguage.

  3. **Tarskian Hierarchy**  
     *Awkwardness:* Natural languages seem to violate strict stratification (e.g., "All sentences in any language").  
     *Borrowed Loop:* Requires L2 > L1; B is illegitimate if L2 lacks a truth predicate for L1.  
     *Revenge:* Cannot state its own semantics—hierarchy is described from a meta-meta-level.

  4. **Contextualist** (e.g., Burge, Simmons)  
     *Awkwardness:* Truth ascriptions shift contexts imperceptibly, making communication fragile.  
     *Borrowed Loop:* A and B belong to distinct contexts; truth in A refers to a prior context.  
     *Revenge:* Avoids revenge by contextualizing semantic vocabulary, but may require infinitely many contexts.

  5. **Kripkean (Gap/Paracomplete)**  
     *Awkwardness:* Cannot assert "The Liar is gappy" without creating a revenge sentence ("This sentence is not true or gappy").  
     *Scheduled Liar:* Blank board → true (no sentence to be true); written Liar → gappy.  
     *Revenge:* Fails to state its own semantics—truth predicates exclude ungrounded sentences.

  6. **Dialetheic/Paraconsistent** (e.g., Priest)  
     *Awkwardness:* Some contradictions are true, but we must avoid "trivialism" (all sentences true).  
     *Scheduled Liar:* True and false if self-referential; true only if board blank.  
     *Revenge:* Handles many revenge sentences with a paraconsistent logic, but not "just false" liars.

  7. **Supervaluationist** (e.g., van Fraassen)  
     *Awkwardness:* Truth requires supertruth across precisifications ("The Liar is neither supertrue nor superfalse").  
     *Scheduled Liar:* Blank board → supertrue; written Liar → indeterminate.  
     *Revenge:* Defining "supertruth" may require a meta-language, inviting revenge.

  8. **Paracomplete (Non-Kripkean)** (e.g., Field)  
     *Awkwardness:* Requires abandoning excluded middle even for ordinary statements.  
     *Scheduled Liar:* Blank board → true; written Liar → indeterminate.  
     *Revenge:* Can define its own semantics with a paracomplete conditional, but complex revenge persists.

  ---

  ### **Logical Space and Empty Cells**
  The tree's structure corresponds to combinatorial possibilities:

  | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Position |
  |----|----|----|----|----|----|----|----------|
  | Y | - | - | - | - | Y | - | Dialetheic |
  | N | N | - | - | - | - | - | Deflationist |
  | N | Y | N | - | - | - | - | *Empty* |
  | N | Y | Y | N | - | - | - | Revision |
  | N | Y | Y | Y | Lang | - | - | Tarskian |
  | N | Y | Y | Y | Context | - | - | Contextualist |
  | N | Y | Y | Y | Incoherent | - | Fixed Pt | Kripkean |
  | N | Y | N | - | - | N | Superval | Superv. |
  | N | Y | N | - | - | N | Reject Biv | Paracomplete |

  - **Empty Cell 1 (Q2=Y, Q3=N)**: Rejects truth-value dependence on non-semantic facts but allows Liar to be truth-apt. *Incoherent*: If Scheduled Liar's status depends on future events, denying this forces either a static truth value (contradicting Scheduled Liar design) or non-truth-aptness (contradicting Q2=Y).
  - **Empty Cell 2 (Q1=N, Q2=Y, Q3=Y, Q4=N)**: Asserts Liar has a stable classical truth value but rejects stratification/context. *Incoherent*: Without stratification, context, or non-classical logic, assigning T/F to Liar yields contradiction.
  - **Unattractive Unexplored**: "Q1=Y, Q2=N" (dialetheism + non-truth-apt Liar). *Unattractive*: If Liar is a true contradiction, it must be truth-apt.

  ---

  ### **Indistinguishable Leaves & Notes**
  - **Kripkean (Leaf 5) and Supervaluationist (Leaf 7)** are only separated in Q7. Both assign gaps to the Liar, but Kripke uses fixed points, Supervaluation uses classical completions.
  - **Contextualist (Leaf 4) and Paracomplete (Leaf 8)** share a rejection of bivalence but diverge on whether gaps are resolved contextually or logically.
  - **Revenge Branch (Q6)**: Critical for Dialetheism vs. Paracomplete. Dialetheism (Q6=Y) embraces semantic self-application; Paracomplete (Q6=N) blocks it.
  - **Borrowed Loop (Q5)** forces distinctions: Tarskian (language levels) vs. Contextualist (context shifts) vs. Kripkean (cannot state the loop).
  - **Scheduled Liar (Q3)** exposes non-semantic dependencies: Revision Theory (Q4=N) embraces them; Kripkean/Supervaluationist (Q3=N) reject them.

  This tree isolates all major positions, integrates your cases, and highlights revenge vulnerability. For your reading group, focus on Q6 (revenge) to spark debate—e.g., "If Dialetheism handles its own semantics, why is revenge still a threat?" or "Can any theory close the gap between its object and meta-language?"
