  ### Decision Tree for Theories of Consciousness

  **Starting Commitment**: There is a real difference between conscious and unconscious mental states, and the difference is natural and empirically tractable.

  **Branch Nodes** (yes/no questions based on concrete cases):
  1. **Bare Reporting System**: A system generates a first-person pain report (e.g., "I am in pain") but has no internal state resembling pain, no qualitative character, and no other mental states. *Is this system in a conscious state?*
  2. **Knocked-out Channel**: A subject has an intact first-order visual state (e.g., retinal input and basic processing are normal) but the mechanism for introspective reporting of visual states is disrupted (e.g., due to brain damage). The subject cannot report or reflect on the visual state. *Is the visual state still conscious?*
  3. **Temporal Question**: A subject has a first-order state (e.g., pain) at time T1, but no higher-order state about it occurs until a later time T2 (e.g., via memory or delayed report). *Can the later state at T2 make the earlier state at T1 have been conscious?*
  4. **Phantom Report**: A subject has an introspective mechanism that fires and reports a specific mental state (e.g., "I see red") but no matching first-order state exists (e.g., no visual input or processing for red). *Is there a conscious state in this case?*
  5. **Conceptless Creature**: A creature with no mental-state concepts (e.g., a newborn or non-human animal) exhibits pain behavior and physiological responses consistent with pain. *Can this creature have a conscious pain state?*

  **Tree Structure**:
  ```
