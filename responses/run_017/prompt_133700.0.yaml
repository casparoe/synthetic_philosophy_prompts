  Okay, let me tackle this PhD student's query about their proposed revision to Scanlonian contractualism. They're clearly deeply engaged with the aggregation problem, and their life-share view is a sophisticated attempt to handle cumulative burdens within a single life while maintaining the ban on interpersonal aggregation. 

  First, I need to fully grasp their concern: the standard model seems blind to small repeated burdens that accumulate significantly for one person over time. Their solution is elegant - sum within a life but never across lives, measuring impact as a percentage of lifetime well-being. 

  Hmm, the core tension here is between preserving contractualism's anti-aggregation stance while addressing this intra-personal accumulation issue. I should test this by constructing cases where the views diverge. Consider a policy causing many tiny harms to one person versus a policy causing one moderate harm to another - standard contractualism might ignore the cumulative harm, but intuitively it should matter. Their view handles this well.

  But wait - what about Parfit's reductionism? If personal identity isn't sharp, does summing within a life become as problematic as summing across lives? This needs careful handling. The student is right to flag this - it could undermine both views or neither. I think we can argue that practical justification requires treating lives as units regardless of metaphysics.

  The individuation problem is thornier. Without natural "occasions," we might arbitrarily slice time to manufacture large-seeming complaints. But perhaps we can define occasions by policy decision-points? That seems workable for institutional cases though maybe less so for diffuse social practices.

  On the utilitarianism charge - measuring lifetime shares isn't prioritarianism because it's still complaint-based justification to each person, not optimizing total welfare. The separateness of persons remains intact since we never aggregate between individuals.

  Strongest objection might be: if we allow summing over time for small burdens, why not allow summing across persons for small benefits? But no - the asymmetry holds because beneficiaries don't have substantial individual complaints even summed, while burdened persons do when impacts accumulate on them specifically.

  After wrestling with this, I'm convinced their revision improves contractualism by better capturing what we owe to each person over a lifetime, without collapsing into aggregationism. The objections are serious but answerable. I'll structure my response to address their four points while maintaining philosophical rigor within the word limit.
answer: |-
  Your life-share view improves upon standard Scanlonian contractualism by better capturing cumulative burdens while preserving its core anti-aggregationist commitment, though it faces significant challenges regarding occasion-individuation and reductionism that require careful resolution. 

  (i) Consider a housing policy allowing landlords to impose a minor inconvenience (e.g., 30-minute notice for entry) thousands of times on a single long-term tenant versus a policy causing one tenant moderate distress (e.g., one unjustified 24-hour eviction threat). Standard contractualism sees only trivial complaints per occasion against the first policy and one serious complaint against the second, favoring the first despite the cumulative burden on one tenant approaching or exceeding the single moderate harm. The life-share view, aggregating within the tenant’s life, recognizes a substantial complaint against the first policy, enabling it to outweigh the single moderate complaint, which is intuitively correct. The beneficiary of the first policy (e.g., landlords gaining minor convenience per occasion) still has no significant lifetime-share complaint.

  (ii) Summing within a life *is* morally distinct from summing across persons, even under reductionism about personal identity. Contractualism concerns *justification to individuals*, and persons—however constituted—remain the distinct loci of concern to whom justifications are owed. Reductionism might challenge whether a person-at-t1 and person-at-t2 are "the same" entity for complaint summation, but the practical necessity of addressing the life lived as a unified narrative for justification persists. If reductionism undermines the life-share view's intrapersonal aggregation, it equally undermines the standard view's focus on occurrent complaints to a temporally extended person, not the ban on interpersonal aggregation. We must treat a life as the relevant unit for complaint-holding to make sense of owing justifications *to* persons over time.

  (iii) The individuation worry is serious but not fatal. Occasions should be individuated by discrete *instances of applying the principle under assessment*. For the tenant, each landlord entry under the rule is a distinct application. The complaint is the *total well-being cost attributable to the principle's application across all relevant instances in the person's life*. This avoids manufacturing complaints via arbitrary slicing, as the cost is tied to the principle's actual operational instances. While some principles involve continuous exposure (e.g., pollution), we can define "occasions" as temporal intervals where the exposure level is set by a policy decision, making the cumulative burden measurable.

  (iv) The life-share view better preserves contractualism's core by ensuring justification *to the cumulatively burdened person*: they can reasonably reject principles imposing a significant lifetime share burden via individually trivial impositions, as they bear a cost others do not. The separateness of persons remains intact, as no interpersonal summing occurs—complaints are still compared pairwise, but each person's complaint now reflects their total lifetime stake. This isn't prioritarianism: prioritarianism weights benefits to the worse off, but here the size of a *complaint* (a burden) depends on its lifetime impact, not baseline well-being. A large lifetime-share burden gives strong grounds for rejection regardless of the person's absolute position.

  *Strongest Objection & Response*: If reductionism makes personal identity over time a matter of degree, perhaps a large group of psychologically connected persons (e.g., a future generation) could sum complaints like a single life, collapsing into utilitarianism. However, contractualist justification is owed *to* existing persons with current capacities for reason and rejection. While future persons warrant concern, they cannot *hold* complaints now. We project burdens onto lives as we practically conceive them—as unified agents—even under reductionism. This doesn't license interpersonal aggregation. After considering this, my view holds: the life-share view strengthens contractualism without abandoning its foundations.
