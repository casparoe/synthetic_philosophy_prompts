answer: |-
  ### The Case: A Deep Out-of-the-Money Option Strategy
  A quantitative trader identifies a deep out-of-the-money equity call option with a strike price 20% above the current market level. Historical data suggests a 6% true probability of the option expiring in-the-money. The option offers a 20-to-1 net return (i.e., if it wins, £1 staked returns £21; if it loses, the stake is lost). The trader has a £100 bankroll and can reinvest any fraction of their wealth in 10 identical weekly rounds. The bet is favourable (expected return per unit staked: \(21 \times 0.06 = 1.26 > 1\)).

  ### The Three Verdicts
  1. **Maximise expected terminal wealth (EV)**:  
     Stakes **100%** of wealth each round.  
     Expected terminal wealth: \(£100 \times (1.26)^{10} \approx £100 \times 10.09 = £1,009\).  
     *Rationale*: The 26% edge compounds linearly. Betting maximally exploits the positive expectation, though ruin is near-certain (probability of survival: \(0.06^{10} \approx 6 \times 10^{-11}\)).

  2. **Kelly criterion (maximise expected log wealth per round)**:  
     Stakes **1.3%** of wealth each round.  
     Growth rate: \(g(f) = 0.06 \ln(1 + 20f) + 0.94 \ln(1 - f)\).  
     Maximised at \(f^* \approx 0.013\) (solved from \( \frac{0.06 \times 20}{1 + 20f} = \frac{0.94}{1 - f} \)).  
     Expected log wealth after 10 rounds: \(10 \times g(0.013) \approx 10 \times 0.00155 = 0.0155\) (natural logs).

  3. **Maximise median terminal wealth**:  
     Stakes **0%** (declines the bet).  
     Probability of zero wins (binomial, \(n=10, p=0.06\)): \((1 - 0.06)^{10} \approx 0.538 > 0.5\).  
     Median outcome: 0 wins. Terminal wealth if staking fraction \(f\): \(£100 \times (1 - f)^{10}\).  
     This is maximised at \(f = 0\) (yields £100), as any \(f > 0\) gives \(£100 \times (1 - f)^{10} < £100\).

  ### Diagnostics
  - **Feature doing the work**: The combination of low win probability (\(p = 0.06\)) and finite horizon (\(n = 10\)) ensures the median outcome has zero wins. Removing either disrupts the effect:  
    - At infinite \(n\), the median converges to Kelly (by the law of large numbers).  
    - With symmetric payoffs (e.g., 1-to-1 odds, \(p = 0.6\)), median and Kelly align even at \(n = 10\) (both stake 20%).  
  - **Horizon sensitivity**:  
    - Median stake is zero for \(n \leq 11\) (\(P(\text{0 wins}) = 0.94^n \geq 0.5\) until \(n = 11\)).  
    - At \(n = 12\), \(P(\text{0 wins}) \approx 0.476 < 0.5\), so median jumps to 1 win. Optimal stake rises discontinuously to ~1.2% (then approaches Kelly as \(n\) grows). Convergence is lumpy due to discrete wins.  
  - **Attacks on the criteria**:  
    - **Kelly advocate**: "The median is not the asymptotic growth rate. Kelly optimises the long-run exponential growth; focusing on a single finite path ignores compounding. Here, Kelly’s growth rate is positive (\(g > 0\)), so it grows wealth eventually."  
    - **Median advocate**: "A finite life sees one realisation. The ‘growth rate’ is irrelevant if you never reach the long run. With 10 bets, staking even 1.3% typically loses 12.2% of wealth, while staking nothing preserves capital."  

  ### Final Recommendation
  I would hand the Kelly criterion to the trader because it optimally balances growth and risk for repeated favourable bets, avoiding ruin while harnessing compounding.
