prompt: |-
  So here's the situation I've gotten myself into. I'm a philosophy professor — mostly ethics, I teach the comparative courses too — and last spring I let myself be talked onto the clinical ethics committee at the hospital affiliated with our university. You know the arrangement: they wanted "a humanities person" on the committee, I said yes before thinking about what I was agreeing to. We get maybe thirty consults a year, they come in from a nurse or a resident, and we have roughly forty-eight hours to put something in the chart. The committee rotates — an oncologist, a nurse manager, a social worker, a hospital lawyer, a community member, and me. Right now we run everything through the four-principles framework (autonomy, beneficence, non-maleficence, justice) that everyone was trained on in some half-day workshop, and honestly it's stopped being useful to us. It basically outputs "go ask the patient what she wants" in exactly the cases where that's the thing under dispute: families insisting the patient not be told, adult children disagreeing with each other about what their mother "would have wanted," patients whose whole sense of what they owe their family makes the language of individual rights sound like a foreign language. There's no vocabulary in it for any of that.

  Meanwhile I've been reading the Confucian role ethics literature — the reading of the early Confucian texts on which persons are constituted by the roles they actually live rather than being antecedent choosers who then take on roles and relationships, and where what you cultivate is relational attentiveness, ritual propriety (li), something like filial responsibility (xiao), and a situated judgment (yi) that just isn't the sort of thing that can be specified in advance. It feels far closer to how these cases present themselves in the room. So the chief of staff has asked me to draft something the committee could actually use, and I agreed, which is where I'm stuck.

  What I want from you is a decision procedure, not an essay about role ethics — I can write that myself. I mean the thing we'd run: the questions, in order, we'd ask ourselves on a consult; what counts as an adequate answer to each; where the procedure ends in a substantive recommendation and where it deliberately stops and hands the question back to a person because what remains is a value question, or a relationship question, or simply not ours to settle. It has to be runnable by non-philosophers in an afternoon, and it should be honest about which of its steps are judgment calls dressed up as procedure. Critically, there's an objection I keep circling and I want you to take it seriously rather than wave it away: isn't writing role ethics down as a checklist exactly the degeneration the view is supposed to be diagnosing? If yi is precisely what can't be cashed out ahead of time, then any procedure I hand the committee will have replaced the exercise of judgment with a rule, and I'll have reproduced — in Confucian vocabulary — the thing I was objecting to in the four principles. Tell me whether that kills the project or whether there's a form the procedure could take (less a flowchart, maybe, and more a structured set of questions that forces the right kind of attention) that isn't self-undermining. Either way, say which distinctions from the theory have to survive the translation for the result to still be Confucian role ethics rather than generic family-systems bioethics, and which we can drop. Then run it on three cases, please. First: a sixty-eight-year-old woman with newly diagnosed metastatic lung cancer; her adult son, who is her caregiver, formally asks us not to disclose the diagnosis, says she "wouldn't want to know," and says that in their family this is what a good son does — the treating team wants to tell her. Second: a patient with advanced dementia, no advance directive, no spouse; two estranged daughters arrive with sharply different accounts of what she would have wanted and of who should speak for her. Third: a case where your procedure gives an answer I definately won't like — pick one yourself and say why it's uncomfortable; I'd rather find out now than in a real consult. And please don't pad it with citations or suggested reading, I'll do my own reading — I want the procedure, the worked cases, and where it breaks.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy professor specializing in ethics, now serving on a clinical ethics committee frustrated with the limitations of the four-principles framework. They're seeking a Confucian role ethics-inspired decision procedure that avoids degenerating into rigid rules while remaining practical for non-philosophers in time-sensitive hospital settings.

  First, I need to address the core tension: how to create a structured process for role ethics without undermining its essence. The user rightly points out that codifying yi (situated judgment) into a checklist risks replicating the very problem they're trying to solve. The solution lies in designing a framework that structures attention rather than prescribing outcomes—focusing on illuminating relational contexts while leaving final judgments to the committee.

  For the structure, I'm considering a three-phase approach: 
  - Mapping the relational web (identifying key roles and obligations)
  - Examining cultivated patterns (historical relationship dynamics)
  - Situating the judgment (current context and next steps)

  Each phase would have specific, open-ended questions designed to surface the relational fabric rather than output decisions. Crucially, the procedure must explicitly flag when to transition from fact-finding to value judgment—moments where the committee should pause and acknowledge they've reached the limits of procedural guidance.

  The Confucian elements essential to preserve include:
  - Relational constitution of personhood (rejecting atomistic autonomy)
  - Xiao (filial responsibility) as lived practice
  - Li (ritual propriety) as relational grammar
  - Yi as irreducibly contextual judgment

  Elements we can adapt pragmatically:
  - Classical hierarchical structures
  - Specific historical rituals
  - Comprehensive virtue cultivation

  For the case demonstrations, I'll select scenarios that test different pressure points: family-caregiver dynamics, conflicting narratives about incapacitated patients, and a deliberately uncomfortable case involving resource allocation justice. The last one will showcase where the procedure forces confronting systemic inequities—likely challenging for a committee accustomed to individual cases.

  The key throughout is maintaining that the procedure serves yi rather than replaces it—like training wheels that must eventually come off when encountering truly novel relational configurations. The framework's success should be measured by whether it surfaces richer contextual understanding, not whether it produces tidy answers.
answer: |-
  Here’s a practical decision procedure for clinical ethics consults grounded in Confucian role ethics, designed for committee execution in <90 minutes. It avoids rigid outputs by structuring *attention* to relationships, history, and context—then explicitly marking where judgment (*yi*) must take over. The core insight: **Roles aren’t containers for pre-existing individuals; they’re the fabric of personhood. Ethics emerges from tending the relational weave.**  

  **Procedure: The Relational Webbing Framework**  
  *(Run sequentially; stop at any step if consensus emerges)*  

  1. **MAP THE WEB**  
     *Question:* "Who is woven into this situation? List all roles (e.g., patient, son, daughter, physician, nurse) and their *specific obligations* to others here, as *they* would describe them."  
     *Adequate Answer:* A diagram with bidirectional arrows naming role-specific duties (e.g., "Son: financial support + emotional shielding"; "Doctor: truthful prognosis + pain control").  
     *Stop If:* Key relationships are missing (e.g., estranged daughter not contacted). Hand back to clinical team for repair.  
     *Judgment Call:* Whose account of obligations to prioritize if conflicting? (Default: prioritize those most directly affected).  

  2. **TEST THE FIBERS**  
     *Question:* "Where has this relational web been *cultivated* or *frayed*? Look for patterns:  
     a) *Li (ritual)*: What habitual actions upheld bonds? (e.g., weekly family dinners, son managing all medical visits).  
     b) *Xiao (filiality)*: How was care reciprocated? (e.g., parent sacrificed for child’s education; child now provides home care).  
     c) *Breaches*: Where did obligations fail? (e.g., daughter estranged after inheritance dispute)."  
     *Adequate Answer:* 2-3 concrete examples per key relationship, noted without moralizing (e.g., "Son handled mother’s bills for 10yrs"; "Daughter absent since 2019").  
     *Stop If:* Contradictory evidence exists (e.g., one sibling calls son "controlling," another "devoted"). Hand back: "This is unresolved history; mediation needed before ethical guidance."  

  3. **SITUATE THE KNOT**  
     *Question:* "Given this web:  
     a) What action would *repair* or *honor* the most central relationships?  
     b) What action would *tear* them irreparably?  
     c) Who bears the *heaviest burden* of acting? Does this align with their role?"  
     *Adequate Answer:* 1 actionable insight per sub-question (e.g., "Withholding diagnosis would uphold son’s role but rupture patient-physician trust"; "Nurse bears burden of secrecy; conflicts with role").  
     *Judgment Call Ends Here:* Committee must now decide. *This step surfaces tensions but doesn’t resolve them.*  

  **Why This Isn’t Self-Undermining**  
  - **Yi is preserved:** Steps 1-2 gather context for *informed* judgment; Step 3 frames the dilemma *in relational terms* but forces the committee to exercise *yi*. It’s scaffolding, not an algorithm.  
  - **Anti-Codification:** The output isn’t a verdict but a *relational map* + *identified tensions* for the clinical team. It answers *"What matters here?"* not *"What’s right?"*  
  - **Confucian Non-Negotiables:**  
    — Roles as *constitutive* (not chosen) → Step 1 maps roles-as-lived, not "decision-makers."  
    — *Xiao/Li* as ethical anchors → Step 2 traces their historical instantiation.  
    — *Yi* as irreducibly contextual → Step 3 demands deliberation on *this* web.  
  - **Dropped:** Metaphysical commitments (e.g., Mandate of Heaven), hierarchical rigidity (prioritize *actual* bonds over classical father-son primacy).  

  ---

  **Worked Cases**  

  **CASE 1: Son Requests Non-Disclosure**  
  - **Step 1:** *Web =* Patient (owes family peace?), Son (owes protection), Oncologist (owes truth). Son states: "Good sons shield mothers from pain."  
  - **Step 2:** *Fibers =* *Li:* Son manages all appointments; *Xiao:* Patient raised son alone after widowhood. *Fray:* Patient asked nurse privately: "Is it cancer?"  
  - **Step 3:** *Knot =* Honoring son tears patient-physician bond; burden falls on nurse to deceive.  
    *Committee Output:* "Withholding ruptures clinical relationship; disclosure should occur but *through* son’s role—e.g., 'Your son helped us understand you’d want family support when discussing illness. May we explain with him?'"  

  **CASE 2: Estranged Daughters Disagree**  
  - **Step 1:** *Web =* Daughter A (caregiver 5yrs, claims patient "feared tubes"), Daughter B (lived afar, insists mom "fought to the end"), Physician (needs surrogate).  
  - **Step 2:** *Fibers =* *Li:* Weekly calls from Daughter B, finances from Daughter A. *Fray:* Estrangement after Patient funded B’s business, not A’s divorce.  
  - **Step 3:** *Knot =* No central relationship to repair; both claims reflect self-interest. Burden falls on physician to act.  
    *Committee Output:* "Web is fractured. Neither daughter’s account is reliable. Recommend impartial surrogate. Hand back: Hospital must seek external guardian."  

  **CASE 3: The Uncomfortable Case (Justice as Role Obligation)**  
  *Scenario: 40yo immigrant laborer with kidney failure. Ineligible for transplant (undocumented). Wife demands dialysis; hospital policy restricts care to emergency-only. Two young children.*  
  - **Step 1:** *Web =* Patient (owes children survival), Wife (owes advocacy), Hospital (owes care but bound by policy), State (denies resources).  
  - **Step 2:** *Fibers =* *Li:* Patient sent wages home for 12yrs; *Xiao:* Children depend on him. *Fray:* System excludes him from "deserving" roles.  
  - **Step 3:** *Knot =* Honoring patient’s role as provider requires dialysis; hospital’s role conflicts with justice (*yi* demands challenging policy).  
    *Committee Output:* "Policy forces hospital into role that severs patient’s relational obligations. Recommend providing dialysis AND filing ethics protest to policy."  
  *Why Uncomfortable:* Forces confrontation with systemic injustice. The procedure surfaces that "roles" include institutional complicity—pushing the committee toward advocacy beyond the bedside.  

  ---

  **Where It Breaks**  
  - **Radical Isolation:** If no relational web exists (e.g., homeless patient, no contacts), the framework stalls. Fall back to minimal beneficence/non-maleficence.  
  - **Bad Faith Actors:** A son exploiting *xiao* for inheritance fraud may "perform" devotion convincingly. Step 2 must demand evidence (e.g., bank records, witness testimony).  
  - **Time Crunch:** If critical gaps in Step 2 can’t be filled in 48hrs, default to interim "relational harm minimization" (e.g., "Delay decision until daughter arrives").  

  **Final Word:** This isn’t a formula—it’s a *method to make the implicit web explicit*. The committee still *lives* the judgment call. Your objection stands if they treat this as a box-ticking exercise; it dissolves if they engage the map with *yi*.
