prompt: |-
  hey — I run the training for new fact-checkers at a small newsroom, and I've got a 90-minute session next week where I want to put the reductionism versus anti-reductionism argument about testimony in front of them. No philosophy background, and they will show up thinking the question is how much we should trust sources, with the professional instinct that verifying everything yourself is the ideal. I dont need you to explain the debate to me, I know it — I need a plan for getting it into their heads in 90 minutes.

  What I want from you:

  - the order the pieces have to go in and what depends on what. My guess is they need to feel the pull of the local version before the global version will mean anything to them, but tell me if I've got that backwards.
  - one case to carry the whole session. I want a source with no track record — a single anonymous tipster, or a one-off document you cant corroborate — and I want you to say what that case has to have and what it has to lack. Also why not the obvious newspaper case, and why not something where the source does have a track record.
  - the misconceptions, and exactly where in the sequence to kill each one. The ones I expect: that reductionism is just the distrustful view; that anti-reductionism means taking peoples word for anything; that the whole dispute is an empirical question about how reliable people happen to be; and that if reductionism is right then checking every claim is mandatory. Tell me which ones I've missed.
  - where the local/global distinction, the default-justification middle position, and the argument from how anybody actually learns things from other people fit. They're going to want a verdict at the end and I'd like them to see that the verdict matters less for practice than they assume — but I dont want to just announce that, so tell me how to build it into the sequence.
  - one wrinkle I'm stuck on: a lot of what they check now is machine-generated or machine-summarised. Is that a case of testimony at all, and do I handle it in the session or leave it out? Say which and why.
  - what to openly refuse to cover at this level.
  - two cases for the end: one where a reductionist and a presumptivist would do the same thing for different reasons, one where they'd actually diverge in practice. If they can say which is which, they've got it.

  Also two of them will keep reaching for trust-but-verify and the extraordinary claims slogan as ways of closing the discussion down. Where do those belong, if anywhere?
reasoning: |-
  Okay, the user is running a training session for new fact-checkers and wants to introduce the reductionism vs. anti-reductionism debate about testimony in 90 minutes. They don't have a philosophy background, so I need to make it practical and relatable. The main goal is to challenge their instinct that verifying everything themselves is ideal.

  First, I should figure out the sequence. The user mentioned starting with the local version before the global. That makes sense because trainees need to feel the tension in a concrete case before abstract concepts. So, maybe begin with a specific scenario where they have to decide whether to trust an uncorroborated source.

  For the case study, the user wants a source with no track record. Using an anonymous tip about a public figure's misconduct could work. It has urgency and lacks external evidence, forcing them to confront the dilemma. Avoid sources with track records because that introduces prior reliability, which complicates the core issue.

  The misconceptions listed are important. I need to address each one at the right point. For example, when discussing reductionism, clarify it's not just distrust but about the need for positive reasons. Later, when introducing anti-reductionism, emphasize it's not blind trust but default justification.

  The local vs. global distinction should come after they've grappled with the case. Once they see the problem in the specific example, explaining the broader philosophical debate will make more sense. The middle position (default justification) can bridge the two, showing that in practice, we often start with trust but verify when needed.

  Machine-generated content is tricky. Since testimony involves human communication, AI summaries might not fit neatly. It's better to leave it out to avoid confusion, mentioning it as a separate issue.

  For the end, two cases: one where both approaches lead to the same action but for different reasons (e.g., trusting a routine report), and another where they diverge (e.g., an uncorroborated tip). This helps trainees see the practical implications.

  Trust-but-verify and the extraordinary claims slogan are coping mechanisms. I should reframe them as tools within the framework, not solutions. Place this after discussing both views to show how they fit into the larger debate.

  The user also wants to avoid giving a verdict. Instead, highlight that the debate informs their approach, emphasizing that the "why" behind decisions matters as much as the "what." Practical takeaways like prioritizing based on risk and resource constraints can wrap it up.

  Need to ensure the session is interactive. Start with the case study, let them discuss, then introduce the concepts. Use guided questions to draw out their reasoning and challenge assumptions. Keep philosophy jargon minimal, using relatable terms like "self-verification" vs. "trust-first."

  Timing is tight: 90 minutes. Allocate time for each section, leaving room for discussion. Start with intro (5 min), case study (20 min), reductionism (15 min), anti-reductionism (15 min), local vs. global (10 min), middle position (10 min), practical cases (10 min), wrap-up (5 min).

  Finally, anticipate trainees wanting clear answers. Emphasize that the framework helps them make informed choices, not prescribe actions. Highlight critical thinking over rigid rules, connecting back to their fact-checking goals.
answer: |-
  Here’s a battle-tested 90-minute plan tailored for fact-checkers, prioritizing concrete engagement over abstract philosophy. The sequence is designed to make the tension visceral before labeling positions.

  ### **Sequential Plan (90 min)**
  1.  **Hook: The Impossible Tip (15 min)**  
      *Present your case study:* An anonymous email alleges a city council member accepted bribes. Includes:  
      - **Specific details** (dates, amounts, method)  
      - **Plausible motivation** (whistleblower fearing retaliation)  
      - **Zero corroboration** (no documents, no named witnesses, no prior relationship)  
      - **High stakes** (public interest, potential legal fallout)  
      *Activity:* "Do you run this? If not, why? If yes, what *minimum* verification would make it publishable?" Group brainstorm. *Goal:* Surface instinctive reductionism ("Must verify EVERY claim").

  2.  **Confronting Reductionism (20 min)**  
      Label their instinct: **"Self-Verification Mandate"** (Reductionism localized).  
      - *Key point:* Not about distrust, but about **epistemic responsibility** – you need POSITIVE REASONS (evidence, source reliability) to justify belief.  
      - *Kill misconception:* "Reductionism = distrust" → Distinguish: "It’s not that people *lie*, it’s that truth requires *your own evidence*."  
      - *Trap them:* "If you need to verify everything yourself, how did you learn the capital of France?" Highlight absurdity of pure reductionism in daily life.  
      - *Why not track record?* Track record smuggles in prior testimony (anti-reductionist foundation!). This case isolates the core dilemma.

  3.  **The Anti-Reductionist Counter (20 min)**  
      Label the challenge: **"Default Credibility"** (Anti-reductionism localized).  
      - *Key point:* Testimony is **prima facie justified**. We start by trusting, unless defeated (incoherence, counter-evidence, bad context).  
      - *Kill misconception:* "Anti-reductionism = gullibility" → Emphasize **defeasibility**. "You still investigate red flags! But the burden shifts."  
      - *Argument from Learning:* "How did you learn *anything* not directly observed? Language? History? Science?" (They rely on testimony constantly).  
      - *Connect:* "In the bribe case – is the email coherent? Internally consistent? Motive plausible? No *red flags*? Maybe that’s enough to start investigating (not publishing!)."

  4.  **Local vs. Global & The Practical Middle (15 min)**  
      - **Local/Global Distinction:** "This isn't just about *this tip* (local). It's about whether testimony *as a source* needs external validation *in general* (global). Our instincts clash because we toggle between levels."  
      - **Default-Justification Middle:** Introduce as pragmatic stance: **"Trust provisionally, verify proportionally."**  
          - *Justification:* Social necessity + cognitive efficiency. We *must* start from trust to function.  
          - *Kill misconception:* "If reductionism is right, I must check everything!" → No. Resource constraints force triage. Reductionism demands *justification*, not necessarily *direct verification*. Use corroboration, logic, context.  
      - *Kill misconception:* "It's just empirical reliability" → Highlight it's normative: *Must* we have independent evidence even for a coherent, unflagged claim?

  5.  **Applied Judgment & Verdict (15 min)**  
      *Activity: Two Cases for Contrast*  
      - **Case A (Same Action, Different Why):** Routine press release from known city department announcing road closure dates.  
          - *Reductionist:* Justified by track record + easy corroboration (call city).  
          - *Anti-Reductionist:* Default credible unless defeated (no defeaters here).  
          - *Both publish after minimal check.*  
      - **Case B (Divergent Action):** An uncorroborated, anonymous tip about a minor procedural error by a low-level official with no public impact.  
          - *Reductionist:* Insufficient justification. No independent evidence? Spike it.  
          - *Anti-Reductionist:* Coherent, no red flags? *Maybe* file it for background/watch, but don't publish without more.  
      *Debrief:* "Where does the bribery case (Hook) land now? Is it more like A or B? Why?"

  6.  **Wrap-Up: Why This Matters <5 min**  
      - **No "Winner":** "This debate structures *how you think about justification*, not giving a yes/no rule. It helps you articulate WHY you trust/distrust."  
      - **Practical Takeaway:** "Your job isn't to verify *everything* (impossible). It's to **manage justificatory risk efficiently** – using tools from BOTH toolkits." Prioritize based on stakes, plausibility, resources.

  ---

  ### **Handling Key Wrinkles**
  1.  **Machine-Generated Content:**  
      **Leave it out.** Testimony requires a *speaker* with *intent*. AI output is a novel epistemic category (inference, not testimony). Mention: "That's a different beast – we tackle it next month." Adding it here confuses the core human-to-human dynamic.

  2.  **"Trust but Verify" & "Extraordinary Claims..."**  
      - **Where:** Address when discussing the **Practical Middle/Defeasibility**.  
      - **Reframe them as tools, not solutions:**  
          - *Trust but Verify:* Embodies the **default-justification middle**. "You start from trust (anti-red), THEN verify proportionally (red requirement)."  
          - *Extraordinary Claims...:* A **defeater condition**. "Anti-reductionism accepts this! An extraordinary claim *is* a red flag shifting the burden."  
      - *Shut down dismissal:* "These are useful *within* the framework, not answers *to* the framework. They don't tell us *why* trust is the default or *what* makes verification sufficient."

  3.  **What to REFUSE to Cover:**  
      - Hume vs. Reid historical debate.  
      - Global skepticism ("How do we know anything?").  
      - Deep meta-epistemology (foundationalism/coherentism).  
      - Group testimony/institutions.  
      *Say:* "We're focusing on the core tension for *individual* fact-checkers assessing *single* uncorroborated sources. Other layers come later."

  ---

  ### **Why This Case (Not Obvious Ones)**
  - **Why not a "newspaper case" (e.g., Watergate)?** Deep Throat had *ongoing* interaction/consistency – it introduces track record elements too early. Your case has **one isolated interaction**.
  - **Why no track record?** Forces the **epistemic ground zero** question: What justifies belief when you have *nothing* but the utterance itself? A track record lets reductionists "win" too easily via prior justification.
  - **Why anonymous?** Removes appeals to source authority/reputation, isolating the testimony's content.

  **Key Missing Misconception Addressed:**  
  *"Anti-reductionism means no investigation."* Killed by stressing **defeasibility** and the fact that high-stakes claims (like the bribe) *always* trigger investigation – the debate is about the *starting point* and *burden of proof*.

  This plan forces them to *feel* the tension in a realistic scenario, dismantles misconceptions by showing their practical implications, and reveals the debate as a tool for sharper reasoning – not a theoretical abstraction. They leave understanding *why* they argue about sources, not just *how* to check them.
