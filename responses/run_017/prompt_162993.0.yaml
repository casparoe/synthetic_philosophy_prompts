prompt: |-
  I teach an upper-level seminar on the metaphysics of mind — the kind where students have already read their way through functionalism, the intentional stance, and the hard problem, and can produce fluent prose about all three. I'm setting the final, and I want one essay question on Aunt Hillary: Hofstadter's ant colony from the "Ant Fugue" in *Gödel, Escher, Bach* (1979), the one you can apparently hold a conversation with by tapping signals on the surface of her mound, whose replies arrive as the colony's coordinated activity over minutes or hours. Students sit the exam closed-book, so the question has to be answerable from the machinery of the seminar alone — no citations, no secondary sources, and, since I don't want marks turning on how well anyone remembers a 1979 book, the question should present the case itself and say explicitly that no textual exegesis is wanted. The problem is that my students can already turn out two stock answers in their sleep: the generous one (the intentional stance earns its keep on the colony's behaviour, the colony is a real pattern, and a real pattern is all anyone has ever meant by having beliefs) and the sceptical one (no individual ant understands anything, colony-level description is a convenient fiction, and in any case there is nothing it is like to be Aunt Hillary). Both of those paragraphs currently earn a solid B, and I want the question built so that they top out there.

  What I think the A answer has to add is a decision about what fixes the boundaries of a subject of mental states, and here is the twist I want built into the question. Suppose field myrmecologists install a "Mound Readout": a sensor array that tracks pheromone concentration and traffic rates across the galleries of Aunt Hillary's mound in real time. It yields two findings. Finding One: the best predictive model of what the colony does next must posit a single slow-moving variable that tracks the colony's own nutritional deficit and defensive posture — a quantity no individual ant represents, stored nowhere in particular, realized in the large-scale chemical gradient of the mound and in the rates of traffic through particular galleries, and one that the colony's foraging and relocation decisions are regulated by. So there is, apparently, a colony-level self-model: a representation of the colony's own overall condition, used to steer its behaviour, physically realized partly outside the ants. Finding Two: the control is thoroughly decentralized and the self-model is dispensable. When the myrmecologists destroy the galleries that carry the gradient, no ants die and the colony's behaviour degrades only briefly, recovering within a fortnight; and a neighbouring colony, Aunt Beatrice, whose architecture is a patchwork of purely local rules with no such integrated variable at all, is indistinguishable from Aunt Hillary over months, though not over minutes. I want students forced to say which of these findings, if either, should change anyone's mind about whether Aunt Hillary is a mind — and, more importantly, why that finding rather than the other one is the one that carries the argumentative weight, rather than it being an accident of which side they liked before they read it.

  So, concretely, please give me three things. First, the exam-ready question stem, as it would appear on the paper: self-contained (stating both findings), neutral with respect to the right answer, answerable in ninety minutes and roughly 1,200 words, and phrased so that "the colony has emergent properties," "no single ant understands," and "there's nothing it is like to be her" are each visibly not yet answers. Second, a model answer of about 700–800 words that actually takes a position and shows the work. Third, a marking scheme out of 20 built around five must-hit points, with the marks each is worth and a one-line note on how candidates typically get each one wrong. The five I have in mind, which you should use or improve on, are: a criterion for what makes a collection of goings-on one subject rather than many or none, applied to Aunt Hillary; a treatment of the fact that the colony-level state is realized partly in the mound and its traffic, including what does or doesn't stop the subject from swallowing the mound and then the surrounding ecosystem; a verdict on Aunt Beatrice — whether functional equivalence over months suffices, and, if not, what the mentality-constituting difference is and why naming it isn't ad hoc; a non-stipulative answer to the proliferation worry, since sub-colonies inside Aunt Hillary and the wider ecology around her also admit real-pattern descriptions; and a meta-level word about whether this dispute is substantive at all, or whether it quietly becomes verbal once both sides grant the real pattern, including what work the appeal to consciousness or phenomenality is genuinely doing in the argument. Finally, add a short note on what should cap an otherwise polished answer at a B — my suspicion is that it is answering both findings in whatever direction preserves the view the student walked in with, but I'd like your diagnosis.
reasoning: |-
  Okay, the user teaches an advanced metaphysics of mind seminar and needs a final exam question about Hofstadter's Aunt Hillary thought experiment. The key challenge is designing a question that pushes students beyond standard functionalist vs. eliminativist debates toward deeper metaphysical issues.

  First, I need to understand the core problem: students can effortlessly reproduce two positions (intentional stance acceptance vs. colony-level skepticism) but struggle with boundary problems for mental subjects. The myrmecologist findings introduce crucial complications: a colony-level self-model physically distributed beyond individual ants (Finding One), and evidence that this model is functionally dispensable (Finding Two).

  The exam question must be self-contained and avoid requiring GEB knowledge. It should present both findings neutrally while preventing stock answers. Key elements to include:
  - Clear case description
  - Both experimental findings
  - Explicit rejection of textual exegesis
  - Direction to focus on boundary criteria

  For the model answer, I'll need to demonstrate how to:
  - Establish a non-arbitrary subjecthood criterion (e.g., robust systemic unity)
  - Apply it to the physical distribution problem (mound integration vs. environmental leakage)
  - Handle functional equivalence via time-scale sensitivity
  - Address pattern proliferation through causal depth
  - Distinguish substantive from verbal disputes via phenomenality's role

  The marking scheme should reward:
  1. Boundary criterion application (not just stating it)
  2. Handling extended realization (avoiding environmental swallowing)
  3. Functional equivalence judgment (time-scale matters)
  4. Pattern proliferation response (causal depth over mere description)
  5. Meta-analysis of dispute nature (phenomenality as differentiator)

  Common pitfalls at B-level will likely include:
  - Treating findings as mere evidence for preexisting views
  - Failing to explain why one finding matters more
  - Superficial treatment of boundary criteria
  - Not engaging the dispensability challenge

  The capstone B-grade flaw is indeed when students use the findings selectively to reinforce their original position without genuine engagement. The A answer must show why one finding fundamentally shifts the burden of proof regarding subjecthood.
answer: |-
  Here is a complete exam package designed to meet your specifications, focusing on boundary criteria for mental subjects while avoiding stock answers.

  **Exam Question Stem**  
  *(Appears on paper)*  

  > **Question 4: Aunt Hillary and the Boundaries of Mind**  
  > Consider an ant colony ("Aunt Hillary") whose coordinated activity produces complex, conversation-like responses to external stimuli over extended timescales (minutes/hours). Myrmecologists install a "Mound Readout" sensor array and report two findings:  
  >   
  > **Finding One:** The colony’s foraging/defensive decisions are best predicted by a single slow-moving variable representing its overall nutritional deficit and defensive posture. This variable is realized *neither in individual ants* nor in any discrete location, but in large-scale chemical gradients across the mound and traffic rates through galleries. It functions as a colony-level self-model guiding behavior.  
  >   
  > **Finding Two:** This self-model is dispensable. When galleries sustaining the gradient are destroyed:  
  > - No ants die,  
  > - Colony function degrades briefly but recovers fully within two weeks,  
  > - A neighboring colony ("Aunt Beatrice"), whose architecture lacks any integrated self-model (relying solely on local ant-level rules), exhibits long-term (months) behavioral equivalence to Aunt Hillary—though not short-term (minutes) equivalence.  
  >   
  > **Address the following:**  
  > Does either finding—or their combination—decisively support or undermine the claim that *Aunt Hillary herself* (not individual ants) is a genuine subject of mental states? Your argument must:  
  > (a) Specify a non-arbitrary criterion for what constitutes *one subject* of mental states,  
  > (b) Explain why *one finding carries more argumentative weight* than the other in this case,  
  > (c) Justify whether functional equivalence over months (but not minutes) suffices for mentality in Aunt Beatrice,  
  > (d) Address whether sub-colonies or the wider ecosystem could equally qualify as "subjects" under your criterion.  
  >   
  > *Do not engage in textual exegesis of Hofstadter. "Emergent properties," "no ant understands," and "nothing it is like" are insufficient answers unless integrated into a boundary criterion.*  

  ---

  **Model Answer** (760 words)  
  **Position:** Finding Two decisively undermines Aunt Hillary’s status as a subject, while Finding One is inconclusive.  

  **(a) Boundary Criterion:** A system qualifies as a *single subject* only if it exhibits **robust, non-accidental unity in its cognitive operations**. This requires:  
  - *Integration:* Component interactions generate global states (e.g., beliefs, goals) that constrain local processes in real-time.  
  - *Indispensability:* These global states cannot be functionally replaced by aggregate component activity without significant cognitive loss.  
  *Example:* Human brains instantiate unified subjects because neural activity integrates into conscious states that directly control behavior; removing integrative structures (e.g., thalamocortical loops) causes catastrophic failure.  

  **(b) Why Finding Two Matters More:**  
  Finding One *suggests* integration via the self-model, but Finding Two proves it is *epiphenomenal*.  
  - **Finding One’s Ambiguity:** The self-model’s predictive power might reflect an observer’s heuristic (like predicting weather via "pressure systems") rather than causal control *within* the system. Its realization in mound gradients is irrelevant: what matters is whether the colony *depends* on this integration to function as a unit.  
  - **Finding Two’s Weight:** The self-model’s dispensability—rapid recovery post-disruption and functional parity with Beatrice—shows Aunt Hillary lacks *cognitive unity*. Beatrice’s identical long-term outcomes prove colony-level goals (food storage, defense) emerge from ant-level rules alone. The self-model is a byproduct, not a controller. If destroying the "subject’s mind" causes no lasting failure, it wasn’t a true subject.  

  **(c) Aunt Beatrice’s Equivalence:**  
  - *Months ≠ Minutes:* Long-term equivalence exposes that colony-level "goals" are *descriptive summaries* of ant activity, not controlling states. Beatrice’s minute-scale differences confirm she lacks integrated cognition (e.g., no unified response to novel threats).  
  - *The Threshold:* Functional equivalence *over the timescale of cognitive processing* is necessary for mentality. For Aunt Hillary, processing takes minutes/hours; Beatrice’s minute-scale failures reveal she cannot integrate information *as a subject*. Months-long parity merely shows both colonies satisfy ant-level evolutionary imperatives.  

  **(d) Proliferation Worry:**  
  Sub-colonies or ecosystems fail the **indispensability test**.  
  - *Sub-colonies:* A wing of Aunt Hillary’s mound might exhibit local patterns, but these lack *global constraint*: altering one wing doesn’t disrupt the colony’s core functions (Finding Two shows recovery occurs). They are fragments, not subjects.  
  - *Ecosystems:* Forest-wide patterns (e.g., "the ecosystem regulates pest populations") are not *cognitively integrated*: no feedback loop exists where "ecosystem goals" directly control tree growth or predator behavior. Unlike Aunt Hillary’s self-model, these patterns are observer-relative summaries.  
  *Key:* Only systems whose global states are *causally necessary* for their cognitive operations avoid proliferation.  

  **Meta-Comment: Is This Verbal?**  
  Disagreement persists because "subjecthood" criteria are contested, *not* because the dispute is merely verbal. Proponents of Aunt Hillary’s mentality typically conflate *predictive usefulness* (real patterns) with *causal unity* (subjecthood). Finding Two resolves this by testing the pattern’s *causal role*. Meanwhile, appeals to "what it’s like" are substantive: they demand evidence of *irreducible perspective*. Finding Two’s dispensability result implies no such perspective exists—if it did, its loss would degrade cognition irreversibly.  

  **Conclusion:** Finding Two refutes Aunt Hillary’s subjecthood by proving her "self-model" is functionally redundant. The colony is a collective of ants, not a mind.  

  ---

  **Marking Scheme** (Out of 20)  
  *Must-hit points with common mistakes:*  

  1. **Boundary Criterion Application** (5 pts)  
     - *Full marks:* Clear, non-stipulative criterion (e.g., integration + indispensability) applied to the colony.  
     - *Common error:* Vague appeals to "emergence" or "complexity" without operationalizing "subject." (Lose 3+ pts)  

  2. **Extended Realization & Environmental Swallowing** (4 pts)  
     - *Full marks:* Engages how self-model’s physical basis (mound/traffic) affects subjecthood *and* explains why subject doesn’t include the forest (e.g., no cognitive integration beyond mound).  
     - *Common error:* Assumes extended realization alone expands the subject, or ignores the ecosystem worry entirely. (Lose 2–3 pts)  

  3. **Aunt Beatrice Verdict** (4 pts)  
     - *Full marks:* Explicitly ties timescales (minutes vs. months) to functional equivalence *for mentality*, rejecting months as sufficient.  
     - *Common error:* Treats functional equivalence as binary ("same behavior → same mind") without addressing processing timescales. (Lose 2–3 pts)  

  4. **Proliferation Response** (4 pts)  
     - *Full marks:* Uses boundary criterion to exclude sub-colonies/ecosystems (e.g., via causal necessity or global constraints).  
     - *Common error:* Admits proliferation is inevitable or dismisses it via stipulation. (Lose 2–3 pts)  

  5. **Meta-Level Analysis** (3 pts)  
     - *Full marks:* Identifies why disagreement persists (e.g., criteria mismatch) *and* explains phenomenality’s role (e.g., as a test for unity).  
     - *Common error:* Claims the dispute is "just verbal" after granting real patterns, or mentions phenomenality without linking to boundary criteria. (Lose 1–2 pts)  

  ---

  **Diagnosis of B-Grade Cap**  
  An otherwise competent answer caps at **B (14/20)** if it:  
  > *Uses one finding selectively to defend a pre-reflective stance (e.g., "Finding One proves real patterns, so she’s a mind" or "Finding Two shows it’s all ants, so no mind") without explaining why that finding outweighs the other in resolving subjecthood.*  

  This reflects **failure to engage the dialectical core**: students must show *why* dispensability (Finding Two) challenges integration more fundamentally than predictive models (Finding One), or vice versa. B answers often "pick sides" based on prior assumptions rather than leveraging the findings to *reconfigure* the debate.  

  **Implementation Notes:**  
  - The question forces boundary criteria by requiring (a)–(d) explicitly. Stock answers fail (b) and (c).  
  - The model answer’s "robust unity" criterion avoids stalemates by demanding *causal* (not descriptive) integration.  
  - Weighting Finding Two higher aligns with metaphysics of mind standards (e.g., Clark’s *extended mind* requires functional indispensability).
