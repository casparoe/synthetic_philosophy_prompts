  B) The program is beneficial because those who completed it did well.
  C) It depends on whether we can assign people to complete the program.

  Question 5: Weight Loss Program (collider)
  Scenario: A weight loss program is studied. Overall, participants gain more weight than non-participants. But when you split by initial weight, the program helps both overweight and normal weight people lose weight. However, initial weight might be influenced by the decision to join the program (e.g., people who are overweight are more likely to join). What do you report?
  A) The overall result because it's the direct comparison.
  B) The group-specific results because the overall is confounded.
  C) It depends on whether we are considering the program for everyone or targeting specific groups.

  Question 6: Hiring Policy (know subgroup for next person)
  Scenario: A company has two offices, one in City A and one in City B. Overall, the company hires a higher percentage of men than women. But in each city, women are hired at a higher rate. If you are the hiring manager for the entire company and you don't know in which city a candidate will be placed, which gender would you say has an advantage?
  A) Men, because the overall rate is higher for men.
  B) Women, because in each city they have a higher rate.
  C) It depends on the city where the candidate will work.

  Question 7: Business Investment (ratios vs differences)
