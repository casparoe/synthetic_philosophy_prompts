  Below is a complete "Which Simpson's Paradox Person Are You?" quiz designed for your stats final project. It includes 9 concrete cases of Simpson’s paradox with three plausible answer options each, a scoring key mapping answers to philosophical "leaves," and analysis of limitations. The language is accessible for high school students—no formulas or jargon.

  ---

  ### **Quiz: Which Simpson’s Paradox Person Are You?**  
  *For each question, pick the answer that feels most reasonable to you. There are no right or wrong answers!*

  1. **Medical Treatment**  
     A new drug is tested. Overall, patients taking the drug have a *higher* death rate than those not taking it. But when split by disease severity (mild/severe), the drug has a *lower* death rate in both groups. What should you report?  
     - A) The **overall** result—it’s the big picture.  
     - B) The **severity-specific** results—the overall is misleading.  
     - C) It depends on **how doctors decide** who gets the drug.  

  2. **College Admissions**  
     At a university, men are admitted at a higher *overall* rate than women. But in every individual department, women have a higher admission rate. What should the school report?  
     - A) The **overall** admission rates—it’s the final outcome.  
     - B) The **department-specific** rates—that’s where the real decision happens.  
     - C) It depends on **whether departments attract equal applicants** from both genders.  

  3. **Batting Averages**  
     Baseball Player A has a higher batting average than Player B in both the first and second half of the season. But over the full season, Player B has a higher *overall* average. Who had a better season?  
     - A) **Player B**—the full-season average matters most.  
     - B) **Player A**—they were better in both halves.  
     - C) **Compare total hits/at-bats**—averages hide playing time differences.  

  4. **Job Training Program**  
     Overall, people who sign up for a job training program have *lower* employment rates than non-participants. But if you split by completion, those who *finish* the program have *higher* employment than non-participants. What do you conclude?  
     - A) The program is **harmful overall**—discourage sign-ups.  
     - B) The program is **beneficial for completers**—encourage participation.  
     - C) It depends on **whether we can control who completes it**.  

  5. **Weight-Loss Program**  
     Overall, people who join a weight-loss program gain *more* weight than non-joiners. But when split by starting weight (overweight/healthy), joiners lose more weight in both groups. What’s your take?  
     - A) Report the **overall** result—the program backfires.  
     - B) Report the **starting-weight-specific** results—it helps everyone.  
     - C) It depends on **who the program targets** (e.g., overweight vs. healthy people).  

  6. **Hiring Policy**  
     A company has higher *overall* hiring rates for men than women. But in each office (City A/City B), women are hired at a higher rate. If you’re hiring for the whole company and *don’t know* where a candidate will work, which gender seems advantaged?  
     - A) **Men**—the overall rate favors them.  
     - B) **Women**—they win in every office.  
     - C) It depends on **which office** the candidate joins.  

  7. **Business Investment**  
     Fund Y has a higher *overall* return rate than Fund X over two years. But in each *individual* year, Fund X has a higher return. The catch: Fund Y had more money invested in the better year. Which fund performed better?  
     - A) **Fund Y**—overall returns are what investors care about.  
     - B) **Fund X**—it won each year fairly.  
     - C) **Compare total profits (dollars)**—ignore rates, focus on money earned.  

  8. **Movie Ratings**  
     Overall, Movie A has higher ratings than Movie B. But when split by age groups (18–25, 26–35, etc.), Movie B has higher ratings in every group. The age groups were chosen *after* seeing the data. How should you rank them?  
     - A) **Movie A**—the overall rating reflects everyone.  
     - B) **Movie B**—it’s better in every age group.  
     - C) It depends on **the age mix of your viewers**.  

  9. **Education & Income**  
     Overall, college grads earn *less* than non-grads. But when split by family income (low/high), grads earn *more* than non-grads in both groups. Family income affects both college access and future earnings. What’s your view?  
     - A) **College hurts earnings**—use the overall data.  
     - B) **College helps within each income group**—split the data.  
     - C) It depends on **the family income mix** in your area.  

  ---

  ### **Scoring Key**  
  Tally your answers and match them to the leaves below. Each leaf represents a stance on handling Simpson’s paradox. No leaf has "all" the answers—patterns matter!  

  | Leaf Name (Philosophy)            | Answers That Earn Points                          | What It Means                                                                 |
  |-----------------------------------|---------------------------------------------------|-------------------------------------------------------------------------------|
  | **Marginalist**                   | A in Q1, Q2, Q5, Q6, Q8, Q9                      | "Report combined results—they show real-world outcomes."                     |
  | **Stratificationist**             | B in Q1, Q2, Q4, Q5, Q6, Q8, Q9                  | "Always split data—subgroups reveal the truth."                              |
  | **Causal Adjuster**               | B in Q5, Q9; C in Q2, Q4; A in Q4                | "Only split by factors that *cause* both variables (e.g., Q5/Q9 family income)." |
  | **Decisionist**                   | C in Q1, Q4, Q5, Q6, Q8, Q9                      | "The ‘right’ answer depends on the decision being made."                     |
  | **Ratio Skeptic**                 | C in Q3; C in Q7                                 | "Reversals happen because ratios (like rates) mislead—use totals/differences!" |

  #### **Important Notes**  
  - **Unseparable Pairs** (identical scoring patterns):  
    - `Causal Adjuster` vs. `Stratificationist` in Q5/Q9 (both pick B).  
    - `Decisionist` vs. `Ratio Skeptic` in Q7 (both pick C if Ratio Skeptic chooses C).  
  - **Self-Contradictory Combos** (no one holds these):  
    - Picking **A in Q4 (Marginalist)** AND **B in Q4 (Stratificationist)** → You can’t call the program both harmful and beneficial!  
    - Picking **C in Q3 (Ratio Skeptic)** AND **A/B in Q3 (Marginalist/Stratificationist)** → Rejecting ratios but also trusting them.  
  - **Key Sorting Question**: **Q4 (Job Training)** best separates philosophies:  
    - Marginalists (A) trust the overall.  
    - Stratificationists (B) trust subgroups.  
    - Causal Adjusters (C) worry about "completion" being a result, not a cause.  
    - Decisionists (C) ask, "What decision are we making?"  

  #### **Why These Leaves?**  
  - Based on real statistical debates (e.g., "marginalist" = Pearson; "causal adjuster" = Rubin).  
  - "Ratio skeptic" is unnamed but common in economics/sports analytics.  
  - "Decisionist" captures real-world pragmatism.  

  ---

  ### **How to Use**  
  1. Give the quiz to classmates.  
  2. Use the scoring key to assign leaves.  
  3. Discuss why answers cluster—e.g., "Most ‘marginalists’ picked A in Q6 because they focused on company-wide outcomes."  

  This highlights how Simpson’s paradox isn’t about math alone—it’s about philosophy, context, and decisions. Good luck!
