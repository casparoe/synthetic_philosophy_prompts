  Scenario: A new drug is tested. Overall, patients taking the drug have a higher death rate than those not taking it. But when you split the data by disease severity (mild vs severe), the drug has lower death rates in both mild and severe cases. What should you report about the drug's effectiveness?
  A) Report the overall result because it's the big picture.
  B) Report the results by severity because the overall is misleading.
  C) It depends on whether the drug is being given to patients with the same severity mix as in the trial.

  Question 2: University Admissions
  Scenario: At a university, overall admissions rate for men is higher than for women. But when you look at each department separately, women have higher admission rates in almost every department. What should the university report?
