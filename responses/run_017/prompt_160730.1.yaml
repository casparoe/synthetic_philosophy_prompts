  B) The department-specific rates because that's where the real comparison is.
  C) It depends on whether the departments are equally accessible to men and women.

  Question 3: Batting Averages
  Scenario: In baseball, Player A has a higher batting average than Player B in both the first half and the second half of the season. But over the entire season, Player B has a higher overall batting average. Which player had the better season?
  A) Player B, because the overall average is what counts.
  B) Player A, because they did better in both halves.
  C) It depends on how the at-bats were distributed between the halves.

  Question 4: Job Training Program (adjusting away the effect)
  Scenario: A job training program is evaluated. Overall, participants have lower employment rates than non-participants. But when you split by whether people completed the program, the completers have higher employment than non-completers and even than non-participants. However, completing the program is a result of participating. What do you conclude?
