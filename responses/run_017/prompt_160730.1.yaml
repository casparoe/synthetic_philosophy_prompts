  B) By the ratings within each age group because the overall is misleading.
  C) It depends on the age distribution of the users.

  Question 9: Education and Income (common cause)
  Scenario: A study finds that people with a college degree have lower average income than those without. But when you split by family background (low vs high income families), college graduates have higher income than non-graduates in both groups. Family background is a known factor that influences both education and income. What do you conclude?
