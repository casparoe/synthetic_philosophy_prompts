prompt: |-
  I keep going round in circles with my reading group on the wrong kind of reasons problem for fitting-attitude accounts of value, and I want a diagnosis, not another survey. The set-up we always come back to: the FA story says something is admirable just in case it's fitting to admire it, and a demon threatens you with something nasty unless you admire it — now you've a reason to admire the demon, but not the sort of reason that could ever make the demon admirable. Everyone in the group agrees on that judgement, everyone agrees the FA theorist needs to filter down to the right kind of reason, and then we spend the rest of the session fighting about the filter: reasons given by the object's features versus reasons given by the state of having the attitude, buck-passing style moves, flat denials that the demon gives you a reason at all. Twenty-odd years on and it feels like nobody has shifted.

  The bit I want you to get into is this. Take a second demon: it threatens you unless you admire Vera, who is independently and genuinely admirable. Here a wrong-kind reason points at something that really does have the property, so the FA account gets the right verdict for what looks like the wrong reason. That makes me think the row isn't about which verdicts come out at all, but about grounding versus extension — some people want a filter that tracks the right extension of admirable, others want the reasons that do the explanatory work, and the same cases look like data or like noise depending on which question you think you're answering. My other hunch is that it's a proxy war about the order of explanation: if reasons are primitive and value is analysed in terms of them, the filter has to be drawable in non-evaluative terms or it's circular; if value comes first, the filter is trivial but FA has stopped being a reduction. Also the same pattern seems to show up for belief and for action, which makes me doubt it's really about value.

  So: which is it — different questions under one name, a verbal fight about what a reason is, bedrock intuitions nobody can argue for — or something I've missed? And given whatever you think it is, what would actually count as progress, or should we just expect to be having this exact conversation in another twenty years?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're stuck in a loop with their reading group on the wrong kind of reasons (WKR) problem for fitting-attitude (FA) accounts of value. The demon case is their go-to example: admiring a demon under threat gives a reason but not the right kind to make the demon admirable. Everyone agrees there's a problem, but they can't agree on how to filter the right kind of reasons (RKR).

  The user mentions a second demon scenario where the threat is to admire Vera, who is genuinely admirable. Here, the FA account gets the correct verdict (Vera is admirable) but for what seems like the wrong reason (the threat). The user suspects the real issue isn't about the extension of 'admirable' but about grounding versus extension. Some want the filter to track the right set of admirable things, others care about the explanatory reasons. Plus, there's a deeper conflict over the order of explanation: if reasons are primitive, the filter must be non-evaluative to avoid circularity; if value comes first, FA isn't reductive. The user also notes this pattern applies to belief and action, suggesting it's not just about value.

  They want a diagnosis, not another survey. Their questions: Is this a case of different questions under one name? A verbal dispute about reasons? Bedrock intuitions? Or something missed? And what would progress look like?

  First, I need to confirm their main points. The core frustration is the unresolved debate despite years of discussion. The Vera case is key—it shows that WKRs can point to genuine value, muddying the waters. The user’s hypothesis about grounding vs. extension and the order of explanation seems astute. Also, the parallel with belief and action indicates a broader meta-normative issue.

  Let me break down the possible diagnoses. Option 1: Different questions. The group might be conflating two aims—extension (tracking what is admirable) vs. grounding (explaining why it's admirable). In the Vera case, extension is satisfied, but grounding is compromised. This could explain why some see it as data (extension correct) while others see noise (grounding wrong).

  Option 2: Verbal dispute about 'reason'. The term 'reason' might be ambiguous. In the demon threat, is it a genuine normative reason or a motivating one? If the group hasn't clarified this, they could be talking past each other. For Vera, the threat gives an additional reason but doesn't replace the RKR. This ties into the order of explanation—reductionists need non-evaluative filters, non-reductionists don't.

  Option 3: Bedrock intuitions. Maybe the disagreement stems from irreconcilable views on what's fundamental—reasons or values. This would make the debate intractable without shifting frameworks.

  The user also wonders about progress. If it's about different questions, clarifying them could help. If it's a verbal dispute, defining terms might resolve it. If bedrock, maybe agreeing to disagree or exploring alternatives.

  The broader context: FA accounts aim to reduce value to reasons for attitudes. The WKR problem challenges this by introducing reasons that don't correspond to value. Solutions like the object-given vs. state-given reasons (Rabinowicz, Olson) or the wrong kind of reasons problem itself (Schroeder, Parfit) haven't settled the debate. The Vera case complicates things because the reason points to something valuable, but the reason itself is still WKR. This highlights the grounding issue—why is Vera admirable? Her properties, not the threat. So even if the extension is right, the explanation is off.

  The user's insight about the order of explanation is crucial. If FA is reductive, the filter must be non-evaluative. But most solutions smuggle in evaluative terms, leading to circularity. Non-reductionists avoid this but abandon reduction. This ties into meta-ethics: can normativity be reduced, or are reasons primitive?

  The parallel with belief (e.g., Pascal's Wager) and action (prudential reasons vs. moral) shows the WKR problem isn't unique to value. This suggests a structural issue in normative theory. Recognizing this might shift the group's focus from value-specific solutions to general normative constraints.

  For progress, the user's group needs to first agree on what they're solving for. Are they testing the extension of FA or its explanatory power? Then, clarify their stance on reduction. If reduction is the goal, they must confront the circularity challenge. If not, FA might still work as a non-reductive account. Exploring hybrid approaches or alternative frameworks could also help.

  Additionally, using cases like Vera to test whether the filter correctly separates RKR from WKR even when they coincide. If a solution handles both demon cases, it's promising. But if it fails Vera, it might be overfitting.

  In summary, the diagnosis is likely a mix of conflated questions, ambiguous terminology, and deeper meta-normative commitments. Progress involves disentangling these, clarifying terms, and explicitly discussing reductionism. Without that, they might indeed be stuck in the loop.
answer: |-
  Your diagnosis is strikingly sharp—you've identified core fault lines in the WKR debate that often go unspoken. The Vera case reveals precisely why the argument persists: **it's a collision between three distinct (but entangled) projects under the "FA theory" banner, amplified by meta-normative commitments.** Here's the breakdown:

  1.  **The Three Projects Masquerading as One:**
      *   **The Extension Project:** Define the *correct set* of valuable things. ("What is admirable?")
      *   **The Grounding Project:** Explain *why* those things are valuable. ("What *makes* X admirable?")
      *   **The Reduction Project:** Analyze value *non-circularly* in terms of prior normative concepts (reasons, fittingness). ("Can 'admirable' be defined solely using 'reason for admiration' without smuggling in value?")

      Your Vera demon exposes the gap:
      *   *Extension:* FA nails it. Vera *is* admirable, and FA delivers the verdict. The demon's threat is irrelevant to *whether* she's admirable.
      *   *Grounding:* FA seems to get it *wrong*. What *makes* Vera admirable is her own merits (courage, kindness), *not* the demon's threat. FA, by citing the demon-given reason *as part of the analysans*, risks misidentifying the source.
      *   *Reduction:* The threat *is* a reason to admire Vera. If FA's filter can't exclude it *using only non-evaluative, prior normative resources*, reduction fails (circularity or inability to exclude WKRs).

      **The Fight:** Group members prioritizing *Extension* see the Vera case as a *success* for FA ("Look, it gets the answer right! The threat doesn't make Vera admirable, but it also doesn't stop her being admirable"). Those prioritizing *Grounding* or *Reduction* see it as a *failure* ("Yes, she's admirable, but FA gives the *wrong explanation* for *why*; the demon's reason shouldn't be part of the story!").

  2.  **The Meta-Normative Proxy War (Order of Explanation):**
      *   **Reasons-Firsters (Reductionists):** They need a *non-evaluative filter* for RKR/WKR (e.g., "object-given reasons", "reasons provided by the object's properties"). The Vera case is poison: the demon's reason *is* object-given (it's *about* Vera!) but clearly not grounding. This forces increasingly complex, often unsatisfying, filters (e.g., "reasons that are *constitutive* of the attitude's correctness" – which risks circularity). The pressure is immense; failure here sinks the reduction.
      *   **Value-Firsters (Non-Reductionists):** They see FA as elucidating the *nature* of value via its connection to fitting responses, not reducing it. For them, the "filter" is trivial: **RKR = reasons that track the *actual value property*.** The demon's threat gives a reason *to cause admiration*, not a reason *constitutive of admirability*. The Vera case isn't problematic: the threat doesn't make Vera admirable; her value does. FA captures the *conceptual link* without claiming priority. But this concedes FA isn't *reductive*.

  3.  **The Reason Ambiguity:**
      You're right to suspect a verbal layer. "Reason" is slippery:
      *   Is the demon's threat a "reason *to admire*" Vera? *Motivationally/practically*, yes (it gives you a goal).
      *   Is it a *normative reason constituting admirability*? Intuitively, no. This is the "wrong kind."
      *   **The Crux:** Reductionists need "reason *to admire*" in the analysans to *mean* only the second kind *without already invoking value*. Non-reductionists can easily distinguish them *because* they have independent access to the value property.

  4.  **The Pattern Beyond Value (Belief & Action):**
      Your hunch is correct. This isn't *about* value per se; it's about **correctness conditions for attitudes/actions and the structure of normativity**.
      *   *Belief:* Pascal's Wager. God threatens damnation unless you believe He exists. A "reason" to cause belief, but not an *epistemic reason* (evidence) constituting the *correctness* (truth) of the belief. The "filter" problem for defining epistemic reasons/belief correctness mirrors FA exactly.
      *   *Action:* Prudential vs. Moral reasons. A threat might give a prudential reason to φ, but not a moral reason if φ is morally wrong. Defining the "right kind" of reason for moral permissibility faces analogous issues.
      *   **This universality confirms:** The core problem is **distinguishing reasons that *constitute* the correctness/appropriateness of an attitude/action from reasons that merely give us *instrumental* (or otherwise external) grounds for *bringing it about***. The Vera case highlights that WKRs can *coincide* with RKRs without *grounding* them.

  **Diagnosis Summary:** The "circles" stem from **conflating Extension, Grounding, and Reduction projects under FA, combined with unresolved meta-normative commitments (Reasons-First vs. Value-First), all playing out on the ambiguous terrain of "reason" and amplified by structurally identical problems across normative domains.**

  **What Counts as Progress (Escaping the Loop):**

  1.  **Explicitly Separate the Projects:** Before discussing *any* case, ask: "Are we testing FA's ability to *track the extension* of 'admirable', its ability to *explain what grounds admirability*, or its viability as a *reductive analysis*?" Agree which project is the focus *for this session*. The Vera case is *perfect* for exposing these differences – use it diagnostically: "Does this case challenge Extension, Grounding, Reduction, or all? How?"
  2.  **Clarify "Reason":** Rigorously distinguish:
      *   Reason to *have* attitude A (constitutive of A's correctness?).
      *   Reason to *bring it about* that one has A (motivating, instrumental).
      *   Discuss whether FA analysans requires the first sense only, and how to isolate it non-circularly (if reduction is the goal).
  3.  **Surface Meta-Normative Commitments:** Explicitly discuss: "Is our goal a *reduction* of value to reasons? Or are we using FA to illuminate value non-reductively?" Acknowledge that *if* reduction is the goal, the Vera case and the original demon case pose *different* challenges to the filter. The original demon threatens extension ("Is the demon admirable?"). Vera threatens grounding/reduction ("Does FA *correctly identify why* she's admirable?").
  4.  **Explore Alternatives to Pure FA:** Acknowledge FA might need supplementation:
      *   **Hybrid Views:** Perhaps FA captures *pro tanto* value, but full value/grounding requires more (e.g., the object's properties *plus* the fitting response being fitting *because of* those properties).
      *   **Primitive Fittingness:** Distinguish "reason" from "fittingness". Maybe *fittingness* is primitive (or analyzed differently). The demon gives a *reason* to admire, but admiration isn't *fitting* towards the demon or *because* of the threat towards Vera. Fittingness tracks grounding directly. This avoids reducing value to reasons but might shift the circularity burden.
      *   **Focus on Standards:** Instead of filtering *reasons*, focus on the *standards* internal to the attitude. Admiration "sets its own standard" – it's inherently responsive to certain features (courage, etc.). The demon's threat doesn't engage *that standard*, hence isn't a reason *of the kind relevant to admirability*.
  5.  **Leverage the Broader Pattern:** Explicitly compare to belief/action cases. Ask: "How does our proposed filter for FA handle Pascal's Wager? If it works there, does it work here? If not, why?" This can expose whether a solution is genuinely structural or ad-hoc for value.

  **Will you be having this conversation in 20 years?** Probably, *if* the group stays focused on "solving FA" without clarifying the projects and commitments. **But progress *is* possible:** It involves shifting from "What's *the* filter for RKR?" to "What can FA *do*, and *how*, given our meta-normative goals?" The Vera case is your key. If the group can articulate *why* the demon's reason feels like "noise" even when the extension is correct, they've started disentangling Grounding/Reduction from Extension. That's genuine progress, even if it means accepting FA isn't the reductive panacea some hoped for. The goal isn't necessarily consensus on *the* solution, but clarity on *why* consensus is elusive.
