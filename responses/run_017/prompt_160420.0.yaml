  This is quite technical. They're describing how in reinforcement learning, the negative reward signal isn't about how bad an outcome is, but how unexpected it is. The poem needs to show this by having the same bad event happen three times - first with a large prediction error, then less, then almost none. The fourth quatrain needs to explain that even when fully predicted, the penalty still affects learning upstream, shifting dread earlier in the process.

