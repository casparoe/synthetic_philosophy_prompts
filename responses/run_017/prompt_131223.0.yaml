  Below is a concise A3 flowchart poster designed for your AGM, structured as a decision tree with concrete questions about your co-op's operations. It uses 7 nodes (within the 10-question limit) and 6 distinct leaf positions (within the 7-leaf limit). Empty cells are noted where logical gaps exist. Each leaf includes the "most awkward commitment" it implies for your three votes.

  ### **Decision Tree: What Does Your Action Commit You To?**
  *(Start at the top and follow your answers)*

  **NODE 1: ORDINARY CASE**  
  *If your household skipping pellets this year changes nothing (no extra lorry, no pallet adjustment), should you still buy?*  
  - **YES** → Go to Node 2  
  - **NO** → Go to Node 3  

  **NODE 2: NON-CAUSAL CASE**  
  *If skipping pellets changes absolutely nothing (supplier/council confirm: no emissions, price, or behavior change), should you still buy?*  
  - **YES** → Go to Node 4  
  - **NO** → **Leaf B: Tiny Chance Matters**  

  **NODE 3: GENUINE THRESHOLD**  
  *If skipping pellets makes the village miss the 12-tonne minimum (no delivery at all), should you buy?*  
  - **YES** → Go to Node 5  
  - **NO** → **Leaf X: No Duty Ever**  

  **NODE 4: DISBANDED CO-OP**  
  *If the co-op disbanded, would you still bulk-buy/offset alone?*  
  - **YES** → **Leaf E: Character View**  
  - **NO** → **Leaf D: Participation View**  

  **NODE 5: THRESHOLD-ISN’T-ONE CASE**  
  *If skipping pellets only nudges future schedules (no immediate effect), should you buy this year?*  
  - **YES** → **Leaf B: Tiny Chance Matters**  
  - **NO** → Go to Node 6  

  **NODE 6: LOCKSTEP CASE**  
  *If the shared lorry runs only if both valleys order, and your order is needed for our valley’s minimum, should you buy?*  
  - **YES** → **Leaf C: Duties Only at Triggers**  
  - **NO** → **Leaf A: No Duty in No-Threshold Cases**  

