  - Information sets become local state indistinguishability
  - Strategy profiles are runs
  - Common knowledge is a fixed point over local states

  The user suspects three points of failure: common prior assumption, common knowledge feasibility, and off-path beliefs. I'll test each against game theory.

  For the common prior, distributed systems lack direct analogs. The closest is shared initial state, but priors are probabilistic beliefs, not states. Agree-to-disagree theorems do resemble consensus results - but with the key difference that consensus is about values while game theory deals with beliefs. The residue here is real: distributed systems can't naturally express probabilistic belief synchronization.

  On common knowledge, the user's suspicion holds. Simultaneous common knowledge is indeed infeasible in asynchronous systems, much like coordinated attack. Game theory's retreat to common p-belief or belief hierarchies is similar to weakening synchrony assumptions - but with a twist. While protocols trade exactness for implementability, game theory often keeps the idealization and changes the solution concept. The residue is partial: the analogy works but isn't perfect.

  Off-path beliefs are the deepest break. In verification, unreachable states are don't-cares, but game theory insists on specifying beliefs there. This comes from interpreting rationality counterfactually - what agents would do if reached. In distributed systems terms, it's like requiring consistent behavior in unreachable states. This creates real residue since it demands specifications for scenarios the protocol prevents.

  The wrinkle: when rationality isn't specified but learned. Common knowledge of rationality becomes slippery - we'd need empirical verification of behavioral consistency across all possible states, including unreachable ones. Most epistemic characterizations don't survive this shift intact.

  The deepest residue is off-path beliefs because it forces specifications for impossible scenarios, which is alien to protocol design. The answer should be \answer{off-path}.
answer: |-
  ### Translation of Epistemic Game Theory to Distributed Systems Vocabulary  
  **System Model:** Treat the game as a distributed system. Players are processes \(P_1, \dots, P_n\). Each player's *local state* includes:  
  - Private type (drawn from type space \(\Theta_i\))  
  - Current information set (partition of global states)  
  - Beliefs (probability distribution over others' states)  
  - Strategy \(s_i\) (program mapping local states to actions).  

  A *run* is a strategy profile \((s_1, \dots, s_n)\). The *specification* is the game form (rules, payoffs).  

  #### Key Mappings:  
  1. **Information Sets \(\leftrightarrow\) Indistinguishability Relations**  
     - A player cannot distinguish global states in the same information set. Formally: \(s \sim_i s'\) iff \(s\) and \(s'\) are in the same information set for \(i\).  
     - Analog: Local state equivalence classes under \(\sim_i\).  

  2. **Mutual Knowledge/Belief \(\leftrightarrow\) Fixed Points**  
     - "Everyone knows event \(E\)": \(\bigcap_i K_i E\), where \(K_i E = \{ s \mid \forall s' \sim_i s, s' \in E \}\).  
     - *Common knowledge* \(C(E)\): Smallest event satisfying \(E \subseteq \bigcap_i K_i (E)\). Implemented as fixed point of \(E \mapsto \bigcap_i K_i E\).  
     - *Common p-belief* \(C^p(E)\): Fixed point where all assign \(\geq p\) probability to \(E\) and others' beliefs.  

  3. **Solution Concepts as Model-Checking Properties**  
     - **Rationalizability/Iterated Strict Dominance (ISD)**:  
       - *Epistemic hyp.*: Common knowledge of rationality (CKR).  
       - *Translation*: In every reachable state, no player chooses a strictly dominated action. Verified by iteratively pruning actions not best-responses to any belief over others' *remaining* actions.  
       - *Load-bearing*: Common knowledge of game structure and rationality (players maximize utility given beliefs).  

     - **Nash Equilibrium (NE)**:  
       - *Epistemic hyp.*: Common knowledge of rationality *and* the strategy profile.  
       - *Translation*: Model-check that for all players \(i\), \(s_i\) is a best-response to \(s_{-i}\) in all states.  
       - *Load-bearing*: Common knowledge of strategies (not just rationality).  

     - **Correlated Equilibrium (CE)**:  
       - *Epistemic hyp.*: Common knowledge of rationality and a shared correlation device.  
       - *Translation*: Device = external process broadcasting signals. Verify \(i\)’s action maximizes utility given signal and others’ signal-response programs.  
       - *Load-bearing*: Common prior over signals (shared initial distribution).  

     - **Perfect Bayesian Equilibrium (PBE)**:  
       - *Epistemic hyp.*: Common knowledge of rationality, sequential rationality, and "consistent" beliefs off-path.  
       - *Translation*: Beliefs defined at every information set (even unreachable ones). Verify:  
         (a) On-path: Actions optimal given Bayesian-updated beliefs.  
         (b) Off-path: Beliefs satisfy Bayes’ rule where possible; otherwise "consistent" (e.g., structural trembles).  
       - *Load-bearing*: Belief revision policy for zero-probability events.  

  ---

  ### Residue Report: Testing Your Suspicions  
  #### 1. **Common Prior Assumption (CPA) and Consensus**  
  - **Your suspicion**: CPA has no direct counterpart; akin to shared initial state or fixed adversary. Agree-to-disagree resembles consensus.  
  - **Verification**:  
    - CPA requires players share a prior distribution over types \(\Theta = \Theta_1 \times \cdots \times \Theta_n\). Distributed systems *can* enforce shared initial states (e.g., fixed seed), but *not* probabilistic beliefs. CPA is stronger: it assumes probabilistic beliefs are synchronized *ex ante*.  
    - **Aumann’s agree-to-disagree**: If posteriors are common knowledge, players cannot disagree if they share a prior. *Translation*: Like a consensus protocol where outputs (posteriors) are common knowledge \(\implies\) outputs must be equal.  
  - **Residue**:  
    - CPA is *not* a protocol primitive; it is a global consistency constraint on beliefs. In your systems, agents may have private priors (e.g., from fine-tuning).  
    - **Blind spot?** Yes. Your framework lacks tools to enforce belief alignment without synchronization. CPA residue shows game theory assumes *coherence* of beliefs that distributed systems don’t require.  

  #### 2. **Feasibility of Common Knowledge**  
  - **Your suspicion**: Common knowledge is unimplementable asynchronously; solution concepts relying on it (like CKR) are like coordinated attack.  
  - **Verification**:  
    - CKR for ISD *does* require simultaneous common knowledge: Players must know others are rational, know that others know, etc., *at decision time*.  
    - Game theory’s retreat to *common belief* (e.g., \(p\)-belief, \(p<1\)) or *bounded iterated knowledge* (e.g., \(k\)-level mutual knowledge) *is* analogous to weakening synchrony.  
      - E.g., Common \(p\)-belief holds in runs where message loss is bounded.  
  - **Residue**:  
    - The retreat trades exactness for feasibility, similar to eventual consistency. However, in game theory, common \(p\)-belief often preserves solution concepts only asymptotically (e.g., \(p \to 1\)).  
    - **Blind spot?** Partial. Your framework handles weakened common knowledge (e.g., eventual agreement). But epistemic game theory sometimes uses lexicographic beliefs ("trembling hand")—these lack clean protocol analogs, as they require infinite belief hierarchies.  

  #### 3. **Off-Path Beliefs and Unreachable States**  
  - **Your suspicion**: Requiring beliefs at unreachable states violates "don’t-care" verification.  
  - **Verification**:  
    - PBE *demands* beliefs even at information sets probability-0 under the equilibrium. E.g., "If player 2 is reached unexpectedly, what does she believe?"  
    - *Game theory’s rationale*: Rationality is a *counterfactual* property. A strategy is rational only if it specifies optimal actions *in all states*, even those the strategy itself avoids.  
    - *Translation*: Like verifying a process’s response to messages it should never receive.  
  - **Residue**:  
    - This *cannot* be mapped to standard safety/liveness. It requires specifying behavior for unreachable states—something protocol designers avoid as over-specification.  
    - **Blind spot?** Yes. Distributed systems focus on *reachable* state space; game theory’s off-path requirements force counterfactual reasoning. This is evidence that solution concepts like PBE are *less determinate*: Many off-path beliefs may satisfy "consistency," leading to equilibrium multiplicity.  

  ---

  ### Handling the "No Utility Function" Wrinkle  
  - **Common Knowledge of Rationality (CKR) with Learned Agents**:  
    - Rationality traditionally means: "Player \(i\) maximizes \(u_i(s_i, s_{-i})\) given beliefs."  
    - With learned agents: Rationality becomes an *observed regularity*: "Agent \(i\)’s policy \(\pi_i\) is empirically best-response to others’ policies."  
  - **Epistemic characterizations survive iff**:  
    - Principals’ mandates induce stable policies (e.g., convergence to fixed \(\pi_i\)).  
    - Agents can *infer* others’ policies from bids (analog: learning transition rules).  
  - **Caveat**: Common knowledge of rationality now means:  
    - All agents *act as if* they share a model where \(\pi_i\) is optimal.  
    - This is falsifiable by testing counterfactual bids (e.g., via exploration).  
  - **Residue**: Game theory assumes agents *are* rational; your setup assumes they *appear* rational. Epistemic results hold only if policies are sufficiently stationary and approximable.  

  ---

  ### Conclusion: The Deepest Residue  
  Your suspicions hold:  
  1. **CPA** requires belief synchronization with no protocol analog.  
  2. **Common knowledge** is unimplementable but weakened forms map to eventual consistency.  
  3. **Off-path beliefs** demand counterfactual specifications alien to verification.  

  **The deepest residue is off-path beliefs**. It forces agents to specify behavior in states the protocol prevents, violating core distributed systems principles. This is not a blind spot in your framework but evidence that sequential refinements impose extraneous structure, reducing applicability to engineered systems.  

  \answer{off-path}
