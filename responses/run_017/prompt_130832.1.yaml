prompt: |-
  I am trying to work out, by trusting my gut on a series of concrete cases and then asking what principle the pattern answers to, when my individual act counts as contributing to a collective harm in the way that matters morally — that is, when the fact that my act makes no real difference to the outcome defeats the reason against it, and when it does not.

  My tentative principle is expected-difference-making: the reason against my performing an act, when I have one, is a function of the difference that my performing it makes in expectation to the total harm, so that where the expected difference is zero the no-difference objection succeeds outright, and where it is very small my reason is correspondingly very small. I set out below the cases that make me doubt it. In each I am one contributor among many to a harm that is produced by the aggregation of contributions like mine.

  The continuous case. I drive sixty miles alone to visit a friend instead of taking the train. My trip adds a few kilograms of carbon dioxide to the atmosphere; the effect on any person is real but lost in the noise. My verdict: I have a genuine reason to take the train, but a weak one, and I would not reproach myself for driving.

  The fixed-contract case. A supermarket sells me a chicken breast. It happens to buy poultry under a twelve-month take-or-pay contract that fixes the number of birds it must accept and pay for, so that nothing I do at the till can alter that quantity, even probabilistically, during the life of the contract. Suppose I know this for certain. My verdict: I still have a reason not to buy it, and not a merely sentimental one. Expected-difference-making says I have none at all.

  The necessary-contribution case. Ten neighbours must sign a petition for the council to approve a development that will destroy a wetland; nine have signed and the tenth signature is the only one outstanding. My verdict: signing is clearly wrong, and clearly more wrong than anything in the first two cases. I include this only as a control.

  The threshold I am unlikely to reach. The same petition, but it needs ten thousand signatures and nine thousand nine hundred and ninety-eight are already in. From what I know of the neighbourhood I would put the chance that two more people sign before the deadline at well over ninety per cent. My verdict: a strong reason not to sign, much stronger than a few per cent of the harm to the wetland, and much stronger than any expected-value calculation I can construct seems able to deliver.

  The trigger with an override. The supplier reorders in lots of ten thousand birds whenever the counter passes a multiple of ten thousand, and the store's app shows me that the counter stands at nine thousand nine hundred and ninety-nine. If I buy, ten thousand more birds are raised and slaughtered. If I do not buy, the customer behind me buys the same breast tomorrow and the same ten thousand birds are raised and slaughtered a few days later; I am as confident of this as I am of anything about the future. So the only thing my purchase changes is the timing. My verdict: I still should not buy it, and this moves me more strongly than the fixed-contract case does, even though in neither case do I change how many birds die. I cannot see why, and I would like the principle either to explain the asymmetry or to tell me to drop one of the two verdicts.

  The good that will happen anyway. A neighbour's surgery is being funded online; the goal is fifty thousand dollars, the total stands at forty-nine thousand nine hundred and eighty, and I happen to know that a local church has pledged in writing to cover whatever shortfall remains at midnight. My verdict: my twenty dollars is pointless, and I would feel faintly ridiculous giving it, as though I were pretending to matter. This is the mirror image of the contract and trigger cases: the outcome is fixed either way and my contribution is causally inert. Yet here the inertia seems to dissolve the reason, while there it does not. I want to know whether that asymmetry can be defended or whether one half of it has to go.

  The attributed share. My country's annual emissions are enormous and cause serious harm; I am one of some eight million residents and my own footprint is about average. My verdict: I bear responsibility for my own tonnes and not for an eight-millionth share of the national total, even though it is the national total that does the harm and even though allocating shares would be far easier to administer. I am not confident this verdict is coherent.

  The recorded and the unrecorded purchase. The same chicken breast again, except that the store's loyalty scheme feeds my purchase into a demand-forecasting model with a two-week lag, so that buying does slightly raise expected future orders, while paying cash leaves no trace and changes nothing downstream. My verdict: I feel exactly the same about the two. If that is right it seems awkward for expected-difference-making, which must distinguish them, but even more awkward for any view that grounds my reason in what my act expresses or signals, which distinguishes them more sharply still.

  What I would like from you is a principle, or a small set of candidate principles, meeting four conditions. First, state it precisely enough that I could apply it to a case you have not seen. Second, motivate each clause by the case that forces it on me, so that I can see what the principle would lose if the clause were dropped. Third, give me its verdicts on three cases I have not listed: the case in which I sell my car to a buyer who will drive it exactly as much as I would have; the case of a co-operative of two hundred members voting on whether to switch to a supplier whose practices are harmful, where the motion carries on a hundred and one votes, where I expect about a hundred and fifteen members to vote yes, and where my own yes is mildly in my financial interest; and the realistic version of the chicken case, in which I cannot discover whether the supply chain works like the fixed contract, like the trigger, like the forecasting model, or continuously, and could not find out even with effort. Say whether the principle gives me the same guidance under that ignorance as it would if I knew the mechanism, and whether it should. Fourth, tell me honestly which of my verdicts the principle cannot accommodate and would require me to abandon.

  If no single principle satisfies all four conditions, give me the two or three best candidates, say which verdict each sacrifices, and tell me which sacrifice you take to be cheapest and why. My preference throughout is for a principle I could actually apply while standing in an aisle deciding what to buy, over one that is elegant but tells me to go and find out how the supplier's ordering system works.
reasoning: |-
  Hmm, this is a profound and carefully constructed inquiry about moral responsibility in collective harm scenarios. The user presents a sophisticated dilemma: when does an individual act count as contributing to collective harm in a morally relevant way, especially when that act seems to make no practical difference? They've developed a tentative expected-difference-making principle but find it clashes with their intuitive judgments across eight concrete cases.

  The cases are brilliantly designed to probe different dimensions of the problem - from carbon emissions (continuous harm) to petition signatures (threshold effects), from fixed-supply scenarios to probabilistic triggers. What's particularly interesting is how the user identifies asymmetries in their own intuitions, like feeling responsible in the "trigger with override" chicken case but not in the "good that will happen anyway" donation case, despite both involving causally inert contributions.

  The user's four requirements for a solution are admirably rigorous: they want a precise principle that can handle novel cases, motivated by the existing cases, that can address three additional test scenarios (car sale, cooperative vote, realistic chicken purchase), and that honestly confronts which of their initial verdicts must be abandoned. They pragmatically prioritize applicability over theoretical elegance.

  Key challenges jump out:
  - The threshold problem: Why does signing a petition at the 9,998th signature feel so wrong when probability of success is already high? Expected difference seems too small to explain the strong intuition.
  - The asymmetry puzzle: Why does buying the last chicken feel wrong while donating to an already-funded surgery feels "faintly ridiculous"?
  - The expression/recording paradox: Why does loyalty card tracking not change their feeling about purchasing chicken?
  - The attribution dilemma: Why do they resist dividing national emissions by population?

  Their cases systematically undermine both consequentialist (expected difference) and deontological (expression-based) approaches. The loyalty card case is particularly devastating for expression theories - if signaling were key, tracking should amplify responsibility, yet they feel no difference.

  For the additional cases:
  - Selling their car to an identical driver seems like pure displacement - does this absolve responsibility?
  - The coop vote with 115 expected yes votes (only 101 needed) creates tension between statistical insignificance and complicity.
  - The realistic chicken case forces confrontation with epistemic limitations - should we assume worst-case, best-case, or something else when mechanisms are unknown?

  The user clearly values moral coherence but recognizes that intuitions may need adjustment. Their admission of uncertainty about the "attributed share" case shows intellectual honesty. The depth of thought here suggests they've engaged seriously with philosophical literature while grounding it in practical dilemmas.
answer: |-
  Your challenge cuts to the heart of moral philosophy's problem of collective harm. I'll propose a principle grounded in **causal responsibility within structured systems**, motivated by your cases, then test it against your requirements. The core idea: moral reasons arise not just from expected outcomes, but from participation in harmful *systems* and proximity to *decisive thresholds*.

  ### The Proposed Principle: The System-Participation and Threshold-Proximity Principle (SPTP)
  **An act constitutes morally relevant contribution to collective harm if:**
  1.  **System Participation:** The act is an instance of participating in a *structured system* (e.g., market mechanism, petition process, emission cycle) that predictably aggregates acts like it to cause harm; **AND**
  2.  **Threshold Condition:** Either:
      *   **a) Definite Threshold:** The act is necessary for the harm to occur (like the 10th signature); **OR**
      *   **b) Proximate Threshold:** The act occurs when the system state is *sufficiently close* to a harm-triggering threshold such that individual acts are non-negligibly likely to be decisive (e.g., the 9,998th signature); **OR**
      *   **c) Continuous Contribution:** The act contributes to harm in a system without sharp thresholds, but where the *type* of participation is normatively significant (e.g., emitting CO2).

  **The strength of the moral reason against the act is determined by:**
  *   The severity of the harm caused by the system.
  *   The act’s causal role: Strongest near/beyond definite thresholds (2a, 2b), weaker under continuous contribution (2c).
  *   The availability and cost of alternatives.
  *   (Epistemic Limitation): Where the system's threshold structure is unknown, assume a reasonable default (likely continuous contribution or probabilistic thresholds).

  ### Motivation by Your Cases
  *   **Continuous Case (Driving):** Satisfies 1 & 2c. You participate in the CO2 emission system (1). There's no sharp threshold (¬2a, ¬2b), but continuous contribution applies (2c). **→ Weak reason.** *(Forces inclusion of 2c for diffuse harms)*
  *   **Fixed-Contract Case (Chicken):** Satisfies 1 only. You participate in the system (1), but your act is causally inert regarding *this batch* (¬2a, ¬2b), and it's not continuous contribution in the relevant sense (¬2c – it doesn't add to the *ongoing* demand signal). **→ Weak reason (system participation), but weaker than Continuous Case.** *(Forces recognition that system participation alone can generate *some* reason, even without direct causal impact on quantity. Expected-difference fails here.)*
  *   **Necessary Contribution (10th Signature):** Satisfies 1 & 2a. You participate (1) and your act is necessary (2a). **→ Very strong reason.** *(Control case; forces 2a.)*
  *   **Threshold Unlikely to Reach (9,998th Signature):** Satisfies 1 & 2b. You participate (1). The system state (9,998/10,000) is *sufficiently close* (2b) – your act has a non-negligible chance of being decisive *even if likely not*. **→ Strong reason.** *(Forces inclusion of 2b: Proximity matters more than marginal probability alone. Expected-difference under-generates reason here.)*
  *   **Trigger with Override (Last Chicken):** Satisfies 1 & 2b (interpreted temporally). You participate (1). The counter at 9999 is a *proximate temporal threshold* (2b) – your act *is* decisive *for triggering this specific batch now*, even if an identical batch happens later. **→ Strong reason.** *(Forces recognizing temporal decisiveness and system structure mattering more than net long-run quantity. Explains asymmetry with Fixed-Contract: Here you *do* trigger harm via the system's rules.)*
  *   **Good that Happens Anyway (Donation):** Fails 1 & 2. You *would* participate in a funding system (1), but the funding goal is *already guaranteed* by the church pledge. Your act doesn't contribute to the *achievement* of the good outcome; the system doesn't *need* aggregation of acts like yours. (¬2a, ¬2b, ¬2c). **→ No genuine reason.** *(Forces the "necessary for the harm/good" aspect. Explains asymmetry with Trigger/Contract: Here, the outcome is *fixed* without your participation in the aggregation system.)*
  *   **Attributed Share (Emissions):** Satisfies 1 & 2c. You participate in the national emission system (1) contributing continuously (2c). **→ You bear responsibility for *your* tonnes** (your participation instance), not an 8-millionth share of the *total* harm. *(Forces focus on the act of participation itself, not arithmetic division of harm. Coherent: Your act is part of the causal chain generating the national total.)*
  *   **Recorded vs. Unrecorded Purchase:** Satisfies 1 in both cases. You participate in the chicken demand system (1). The *causal pathway* (immediate trigger vs. forecasting model) differs, but the *type of participation* (purchasing factory-farmed chicken) is identical. **→ Same reason in both cases.** *(Forces the principle to focus on the act of participation in the harmful practice/system, not the precise causal mechanics downstream. Expected-difference distinguishes them; expression theories distinguish them sharply. SPTP groups them.)*

  ### Verdicts on Your Three New Cases
  1.  **Selling Car to Identical Driver:**
      *   **SPTP Verdict:** Weak reason (similar to Continuous Case). You participate in the car ownership/driving system (1) by facilitating continued use (2c). Selling doesn't *reduce* emissions, but it perpetuates the system by keeping the car active. Alternatives (scrapping, selling electric) might change this. *Slightly weaker reason than driving it yourself, but still present.*
  2.  **Co-op Vote (101 needed, ~115 expected Yes, mild self-interest):**
      *   **SPTP Verdict:** Strong reason to vote No. You participate in the decision system (1). The expected vote (115) is far above the threshold (101) – your state is *well beyond* the proximate threshold (2b). Voting Yes is participating in endorsing/creating harmful supply *when the harmful outcome is highly likely regardless*. While your vote is very unlikely to be decisive, you are *actively endorsing the harm* through the system. The mild self-interest is likely overridden. **→ Strong reason to vote No.**
  3.  **Realistic Chicken Purchase (Unknown Mechanism):**
      *   **SPTP Verdict:** Moderate reason not to buy. You know you are participating in the factory farming system (1). The *epistemic limitation* applies. A reasonable default assumption is that purchasing *generally* contributes to demand signals and/or operates near thresholds sometimes (i.e., satisfies 2b or 2c probabilistically). You shouldn't assume the most forgiving model (Fixed-Contract). **→ Guidance under ignorance:** Assume you have *at least* the reason present in the Continuous/Fixed-Contract case (weak-moderate), potentially more (like the Trigger case). You *should* act as if your participation matters, because system participation *does* generally matter. *Effort to discover the mechanism is praiseworthy but not strictly required for moral guidance; SPTP provides guidance under uncertainty.*

  ### Honest Reconciliation & Required Abandonments
  SPTP accommodates most of your verdicts well:
  *   **Preserved:** Continuous (Weak Reason), Necessary Contribution (Very Strong), Threshold Unlikely (Strong), Trigger with Override (Strong), Good Anyway (No Reason), Attributed Share (Responsibility for Own Act), Recorded/Unrecorded (Same Reason).
  *   **Modified/Clarified:**
      *   **Fixed-Contract Case:** SPTP posits a *weak reason* based solely on system participation (1), not "none at all" as you initially felt, nor a strong one. This weak reason stems from complicity in/normalization of the harmful system, even without changing the quantity *this time*. *You may need to accept this slightly stronger verdict than your initial "still have a reason" implies.*
  *   **Required Abandonment:**
      *   **Fixed-Contract Case:** Your initial verdict implied a reason *stronger* than what expected-difference-making (none) could justify, perhaps similar to the continuous case. SPTP gives a reason, but it's the *weakest* among the purchasing cases – weaker than Continuous Contribution and significantly weaker than Trigger/Threshold cases. You would need to accept that the reason in Fixed-Contract is *genuine but minimal*, primarily symbolic/system-upholding. *This is the sacrifice: softening the strength you initially ascribed.*
      *   **Co-op Vote:** If your intuition was that voting No is pointless when the Yes vote is so far over threshold, SPTP requires abandoning that. It sees voting Yes as actively endorsing harm within the decision system when the harm is highly probable.

  ### Why SPTP is the Best Candidate
  *   **Explains Asymmetries:** It cleanly explains why the Trigger case (decisive action) feels worse than Fixed-Contract (inert action), and why Donation (outcome fixed without you) feels inert while all chicken purchases (participation in harmful system) feel somewhat wrong. It captures the special force near thresholds.
  *   **Handles Epistemic Uncertainty:** Provides practical guidance ("assume your participation matters") without requiring aisle-side supply chain audits.
  *   **Grounds Responsibility:** Focuses on your act's role within the causal/social system causing harm, avoiding the pitfalls of expected difference (too weak in threshold cases) and pure expressivism (too dependent on recording/signaling).
  *   **Manages Complexity:** Offers a structured way to categorize cases (Definite Thresh, Prox Thresh, Continuous, Inert) based on system structure.

  **Conclusion:** The System-Participation and Threshold-Proximity Principle best satisfies your conditions. It preserves the core of your intuitions while requiring you to slightly moderate the strength of the reason in the Fixed-Contract case and embrace a stronger reason in the Co-op vote case. It emphasizes that morality cares not just about *consequences* but about *complicity* in harmful structures and *decisiveness* when near critical points. It provides usable guidance under uncertainty.
