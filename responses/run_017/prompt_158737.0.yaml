  0-5: Intro and setup. Assign roles (P1 and P2). Distribute Chart A.
  5-15: Negotiation Round 1 (on Chart A). (10 minutes)
  15-20: Collect and record outcomes. Show the distribution on the board (scatter plot or just list P2's payoff). Most pairs should have P2 around 10.
  20-25: Distribute Chart B. Explain that it's a new scenario but same type of negotiation.
  25-35: Negotiation Round 2 (on Chart B). (10 minutes)
  35-40: Collect and record. Compare: on average, P2's payoff is lower in round 2.
  40-45: Ask: "Why did P2 get less in the second round? What changed?" Let students discuss. Then ask: "What rule did we use last week? The product maximization?" Then ask the math-econ student to calculate the product-maximizing point for Chart A. He gets (10,10). Then for Chart B, he calculates and gets (11.7,8.75). 
  45-50: Highlight that the rule they learned (Nash) moved from (10,10) to (11.7,8.75) and P2 lost 1.25. But the set got bigger! And P2's best possible (10) didn't change. So is this fair?
  50-60: Introduce the idea of the ideal point. Ask: "What's the best P1 could get? Best P2 could get?" (20 and 10 in both). Then: "What if we try to give each the same fraction of their ideal?" In Chart A: solve for x/20 = y/10 and y=20-x. Then x/20 = (20-x)/10 => x/20 = 2 - x/10 => x/20 + 2x/20 = 2 => 3x/20=2 => x=40/3≈13.33, y=6.67. But wait, that point is not efficient? It is on the frontier? In Chart A, y=20-x, so at x=13.33, y=6.67, which is on the frontier. But the product is lower, and they didn't choose it. But in Chart B, what would that give? x/20=y/10 => y=x/2. And then find on the new frontier. We calculated (14,7). But note that in Chart B, at (14,7): is it feasible? On the segment from (18,4) to (10,10): the line is y = -0.75x+17.5. At x=14, y=-0.75*14+17.5= -10.5+17.5=7. Yes. And fractions: P1:14/20=0.7, P2:7/10=0.7. 
  But in the first chart, the fraction solution was (13.33,6.67) but they chose (10,10) because they were maximizing the product. So one rule (Nash) led to a drop for P2, while this proportional rule (KS) would have moved from (13.33,6.67) to (14,7) and both players gain.

  60-70: Now show the weakness of KS. Present Chart G: convex hull of (0,0), (3,0), (0,1), (1,1). Disagreement (0,0). Ask the math-econ student to compute the Nash solution: (1.5,0.75). Then ask: what is the ideal point? (3,1). Then ask for the proportional solution: the point where x/3 = y/1 and on the frontier. The frontier is from (3,0) to (1,1) (and then to (0,1), but that is horizontal and not on the ray). So on the first segment: y=-0.5x+1.5. Set y=x/3. So x/3 = -0.5x+1.5 => (1/3+1/2)x = 1.5 => (5/6)x=1.5 => x=1.5*6/5=1.8, y=1.8/3=0.6. So (1.8,0.6). 
  Now, compare: in Nash, P1 gets 1.5 and P2 gets 0.75. In KS, P1 gets 1.8 and P2 gets 0.6. So P2 gets less in KS. And note that P2's best is only 1, while P1's best is 3. So KS penalizes P2 for having a lower maximum? 
  Then discuss: which rule is better? It depends on what you value. The Nash solution does not guarantee that when the set expands you won't be worse off, but the KS solution might give you less if your potential is limited.

  70-80: Summarize: The Nash solution violates resource monotonicity (when the set expands, a player might get less). The KS solution satisfies monotonicity but might lead to outcomes that are less equal in absolute terms. 
  Finally, name the solutions: Nash bargaining solution and Kalai-Smorodinsky bargaining solution.

  Where the idea bites:
  - In the negotiation round 2, when pairs are given Chart B, player 1 might point to the new point (18,4) and say: "I could get 18 here, so you should let me have more in this round." Even if they don't agree to (18,4), player 1 uses it as a threat. This leads to a shift in the outcome that is worse for player 2. This mirrors the shift in the Nash solution from (10,10) to (11.7,8.75). The formal difference is that Nash uses the product and is sensitive to the shape of the entire frontier, while KS uses the ideal point and is not affected by adding points that don't change the ideal.

  Debrief:
  Start by comparing the average outcomes for player 2 in round 1 and round 2. Point out the drop. Ask why. Then reveal the Nash solution calculation for both charts. Then ask: is it fair that player 2 gets less when the set expands in a way that doesn't improve their best case? Then introduce the proportional idea (same fraction of the ideal). Show that in both charts, the fraction is 0.5 in round 1? No, in round 1 at Nash (10,10): fractions 10/20=0.5 and 10/10=1. Not equal. At the proportional solution for round 1: (13.33,6.67) gives 13.33/20=0.6665 and 6.67/10=0.667. And in round 2: (14,7) gives 0.7 and 0.7. So both players get the same fraction and it increases. Then present the other example (Chart G) to show the downside of KS.

  What will go wrong:
  - Some pairs in round 1 might not have gone to (10,10). They might have gone to (15,5) or something else. We can still use the Nash solution as a benchmark.
  - In round 2, some pairs might not move from (10,10). Or they might go to (18,4) and then player 2 gets only 4. But we want to see the shift to around (11.7,8.75). If many pairs do not move, the effect might not be clear. To mitigate, we can have more pairs (20 students -> 10 pairs) and then show the average.
  - The math-econ student might give away the name "Nash solution" during the calculation. We can ask him to compute without naming.
  - The proportional rule might not be invented by the students. So we might have to propose it.

  What the activity can't do:
  - It might not replicate the exact Nash solution in negotiation because students might not be maximizing the product. But the effect of the new point should still be observed as a shift against player 2.
  - It cannot replace a formal proof of the properties. It is an illustration.
  - It might not work if the students are too cooperative and always split equally (but we have different currencies to prevent that).

  Given the risk that free negotiation might not land on the Nash point, we can instead have an arbitrator round: after showing the chart, each pair has to write down what they think is a fair solution as arbitrators (not as players). Then we can see the average arbitrator proposal. This might be more controlled. We can do:

  Minute-by-Minute (arbitrator version):
  0-5: Intro: "Today, you will be arbitrators for two disputes between two parties. You will be given the set of possible outcomes and you have to choose one fair outcome."
  5-10: Distribute Chart A. Each student (individually) writes down the outcome they would choose and why (in one sentence). 
  10-20: Collect and show on the board the choices (x,y). Calculate the average for x and y. (Expect many (10,10).)
  20-25: Distribute Chart B. Each student again chooses an outcome.
  25-35: Collect and show. Now, the average x should be higher and average y lower.
  35-40: Ask: "Why did you choose a different point in the second chart? Did the new point (18,4) influence you even though you didn't choose it?"
  Then proceed as before.

  This might be more reliable.

