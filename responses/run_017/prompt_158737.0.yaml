  We are going to design an activity for a class on fair division to illustrate the Kalai-Smorodinsky solution by contrasting it with the Nash bargaining solution without introducing the formal concepts first.

  The core idea is to have pairs of students negotiate over two different feasible sets that are almost the same, except that one has an extra point that is only attractive to one player. The first set is a triangle (feasible set) and the second set is the same triangle with an extra point added that is good for player 1 but not for player 2. The disagreement point is the same in both rounds. The catch is that the extra point, while never actually chosen, might affect the negotiated outcome because the Nash solution (which maximizes the product of utilities) will shift to a point that is worse for player 2, even though player 2's best possible outcome hasn't changed.

  We want the students to experience that in the second round, player 2 ends up worse off, even though the set is "bigger" and nothing was taken away from player 2. This sets the stage for introducing the Kalai-Smorodinsky solution, which uses the ideal point (the best each player can get in the feasible set) and is monotonic (if the set expands in a way that benefits one player, that player shouldn't be worse off).

  Constraints:
  - Two different currencies (chocolate for one, raffle tickets for the other) to avoid direct comparison.
  - Do not mention "monotonicity" or "Kalai-Smorodinsky" until the end.
  - Use the math-econ student by having him calculate the Nash solution for the class (but without revealing that it's called that) and then later for the expanded set.

  We also want an example where the Kalai-Smorodinsky solution does something ugly (i.e., violates an axiom that the Nash solution satisfies) to show that neither is perfect.

  The example provided: 
  - Triangle with vertices (0,0), (20,0), (10,10). The disagreement point is (0,0). The Nash solution is the point that maximizes x*y. The Pareto frontier is from (20,0) to (10,10). The equation of the line: from (20,0) to (10,10) has slope (10-0)/(10-20) = -1. So y = -x + 20. Then the product x*y = x*(20-x) = 20x - x^2. Derivative: 20 - 2x = 0 => x=10, then y=10. So (10,10).

  Now add the point (18,4). We must check if this point is feasible and if it changes the feasible set. The original set is the convex hull of (0,0), (20,0), (10,10). The point (18,4) is inside the convex hull? Let's see: the line from (20,0) to (10,10) is y = -x+20. At x=18, y=2. So (18,4) is above that line? No, because at x=18, the line y=-x+20 gives y=2, and 4>2, so (18,4) is above the line? Actually, the feasible set is below the line (because it goes from (20,0) to (10,10) and then to (0,0)). The set is the convex hull: all points below the lines. So (18,4) is above the line from (20,0) to (10,10) and therefore outside the convex hull. So we are adding a point that was not in the original set.

  But note: the original set is convex? We are representing it as a convex set? In bargaining, we usually assume convexity. However, we can consider the convex hull of the original points plus (18,4). The new set will have a new Pareto frontier: from (20,0) to (18,4) and then to (10,10). The line from (20,0) to (18,4): slope = (4-0)/(18-20) = 4/(-2) = -2. So equation: y - 0 = -2(x-20) => y = -2x+40. Then from (18,4) to (10,10): slope = (10-4)/(10-18)=6/(-8)=-0.75. Equation: y - 10 = -0.75(x-10) => y = -0.75x + 7.5 + 10 => y = -0.75x + 17.5.

  Now, we need to maximize the product u*v over the new Pareto frontier. We have two segments:

  Segment 1: from (20,0) to (18,4): u = x, v = -2x+40. Product: x*(-2x+40) = -2x^2+40x. Derivative: -4x+40=0 => x=10. But x=10 is not in [18,20]? So we check endpoints: at x=20: product=20*0=0, at x=18: 18*4=72.

