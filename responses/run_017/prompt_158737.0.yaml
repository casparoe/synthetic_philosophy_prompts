  ### Fair Division Activity: Introducing Kalai-Smorodinsky Through Negotiation

  **Materials and Setup**  
  Each pair receives two printed charts (A and B) and a role card (Player 1: "chocolates," Player 2: "raffle tickets"). Chart A depicts a convex feasible set: vertices at (0,0), (20,0), (10,10) with a disagreement point at (0,0). Chart B shows the same set with an added point (18,4), forming a quadrilateral. Utilities are non-comparable (chocolates vs. tickets; no exchange rate). Pairs negotiate outcomes in two 5-minute rounds, recording agreed points. Instructor collects results anonymously. Chocolate squares and raffle tickets (for a book voucher) are distributed post-activity based on outcomes. The math-econ student is assigned as a "verifier" to compute solutions during debrief.

  ---

  **The Charts, with Arithmetic Checked**  
  **Chart A (Triangle)**:  
  - Vertices: (0,0), (20,0), (10,10). Disagreement: (0,0).  
  - Pareto frontier: Line from (20,0) to (10,10), equation \( y = 20 - x \).  
  - **Nash solution (max product \( x \cdot y \))**: Maximize \( x(20 - x) \). Derivative: \( 20 - 2x = 0 \) → \( x = 10 \), \( y = 10 \). Point: **(10,10)**.  

  **Chart B (Triangle + (18,4))**:  
  - Vertices: (0,0), (20,0), (18,4), (10,10). Disagreement: (0,0).  
  - Pareto frontier: Two segments—  
    1. (20,0) to (18,4): \( y = -2x + 40 \)  
    2. (18,4) to (10,10): \( y = -0.75x + 17.5 \)  
  - **Nash solution**: Test products:  
    - Segment 1: \( x(-2x + 40) \). Max at \( x=10 \) (invalid, outside [18,20]). Endpoints: (20,0)→0, (18,4)→72.  
    - Segment 2: \( x(-0.75x + 17.5) \). Derivative: \( -1.5x + 17.5 = 0 \) → \( x \approx 11.67 \), \( y \approx 8.75 \). Product: \( 11.67 \times 8.75 \approx 102.1 \) (higher than endpoints). Point: **(11.67, 8.75)**.  
  - **Effect**: Player 2’s payoff drops from 10 to 8.75 despite ideal points (P1:20, P2:10) being unchanged.  

  ---

  **Minute-by-Minute**  
  **0–5 min**: Introduce activity. Assign roles (P1/P2), distribute Chart A. Emphasize: utilities are non-comparable (chocolates/tickets), disagreement point (0,0) = no payoff.  
  **5–10 min**: **Round 1 (Chart A)**: Pairs negotiate. Circulate to ensure they understand the frontier. Most pairs will land near (10,10) or split the difference.  
  **10–15 min**: Collect results. Plot P2’s payoffs anonymously: expect clustering near 10. Ask one pair: "Why did you choose this point?" (Typical: "It felt fair.")  
  **15–20 min**: Distribute Chart B. Highlight: "This is a new scenario. Note the added option (18,4). Disagreement unchanged."  
  **20–25 min**: **Round 2 (Chart B)**: Pairs negotiate. Player 1s often cite (18,4) to demand more ("I could get 18 here!"). Player 2s resist.  
  **25–30 min**: Collect results. Plot P2’s payoffs: expect lower average (e.g., 8–9). Contrast with Round 1. Ask: "Why did P2 get less?"  
  **30–40 min**: **Debrief start**: Ask verifier (math-econ student) to compute Round 1’s product-maximizing point. He finds (10,10). Repeat for Round 2: he derives (11.67, 8.75). Note alignment with class results.  

  ---

  **Where the Idea Bites**  
  - **Threat of irrelevance**: In Round 2, Player 1 leverages (18,4)—even though no pair agrees to it—to demand concessions. This mirrors the Nash solution’s shift to (11.67, 8.75), where P2 loses 1.25 units despite no change to their best-case payoff (10).  
  - **Formal divergence**: Nash maximizes the product but violates *resource monotonicity* (adding options shouldn’t hurt a player). Here, expanding the set to include (18,4) reduces P2’s payoff.  
  - **Student discovery**: When asked why P2 lost out, students notice the new point "distorted the bargaining power." This segues into the Kalai-Smorodinsky insight: fairness should depend on *relative sacrifices* (fraction of ideal payoff), not products.  

  ---

  **Debrief**  
  1. **Contrast outcomes**: Show Round 1 vs. 2 results. Ask: "Why did P2 lose when we added an option? Is this fair?" Discuss.  
  2. **Ideal points**: Introduce "best possible payoff" (P1:20, P2:10 in both charts). Propose: "What if we equalize the *fraction* of your ideal?"  
     - Chart A: Solve \( \frac{x}{20} = \frac{y}{10} \) with \( y = 20 - x \) → \( x \approx 13.33, y \approx 6.67 \).  
     - Chart B: Same fractions → \( x = 14, y = 7 \) (intersects new frontier).  
     Highlight: P2 improves (6.67→7), satisfying monotonicity. Name this as Kalai-Smorodinsky.  
  3. **Expose KS weakness**: Show **Chart C** (vertices: (0,0), (3,0), (0,1), (1,1); disagreement (0,0)).  
     - Nash: (1.5, 0.75) (max product).  
     - KS: (1.8, 0.6) (equal fractions of ideals (3,1)).  
     Discuss: KS penalizes P2 for having a lower ideal (max 1 vs. P1’s 3). Nash avoids this but caused Round 2’s injustice.  
  4. **Conclusion**: No perfect rule. Nash breaks monotonicity; KS can exacerbate inequality when ideals differ.  

  ---

  **What Will Go Wrong the First Time**  
  - **Negotiation variability**: Some pairs in Round 2 may stay at (10,10) or jump to (18,4), muddying the effect. Mitigate by aggregating all pairs’ results—the average P2 payoff will drop visibly.  
  - **Math-econ dominance**: The verifier may over-explain. Redirect: "Compute the numbers, but don’t name axioms yet—let’s see why the class’s outcomes shifted."  
  - **Misinterpreted utilities**: Students might treat chocolates/tickets as comparable. Reinforce: "These are different currencies—focus on your own payoff."  
  - **Time pressure**: Rounds may run long. Use a timer and cut off delays at 5 minutes—disagreement = (0,0).  

  ---

  **What the Activity Can’t Do**  
  This exercise **cannot** rigorously prove axioms or replicate exact solutions in negotiation (students may not strictly maximize products). It illustrates the *intuition* behind monotonicity violations and ideal-point proportionality but relies on debriefing to formalize Kalai-Smorodinsky. Real-world fairness norms (e.g., equality) may override model predictions, but this sparks debate—leveraging the "unfair" outcome in Round 2 makes the KS critique tangible. Use the math-econ student’s calculations to bridge intuition and theory.  

  ---  
  **Final note**: Free negotiation reliably produces the effect if results are aggregated. The added point (18,4) creates psychological pressure, shifting outcomes even when rejected—mirroring the formal shift in the Nash solution.
