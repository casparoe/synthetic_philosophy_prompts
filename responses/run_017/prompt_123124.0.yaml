prompt: |-
  I write the periodization and label copy for the antiquity galleries at a museum of world history, and our house style has a habit I can neither justify nor get rid of. Every civilization on the timeline gets a single year of "fall": Rome gets one date in the late fifth century, although the Roman state, its law and its institutions carried on in the east for nearly another millennium; the lowland Maya get a "collapse" at the end of the Terminal Classic, although millions of Maya speakers and a great deal of Maya social structure are still there today; the Bronze Age palace systems get a "collapse," and then the next case in the same gallery, which looks fairly similar demographically, is described as "transformation" or "continuity." Easter Island is presented as a fable about a society that ruined itself, which appears to be a different genre again.

  What I need is not the history but the theory this practice carries: what must be presupposed for it to make sense to assign a society a termination date at all, and to call some endings failures and other endings mere changes? Please reconstruct that theory, and answer in exactly five numbered items of one or two sentences each, with no introduction and no conclusion:

  1. What has to be true of a society, and of what its persistence through time consists in, for dating its end to make sense at all — and does the practice take "collapse" to name the loss of an occupancy floor (population, settled area, number of occupied sites) or the loss of a repertoire of capacities (writing, taxation, monumental building, long-distance exchange)? Call these the occupancy reading and the repertoire reading, and tell me which one fall dates actually track.

  2. Which of the two does the practice strictly presuppose, as opposed to merely fitting comfortably with — and is there any coherent way to keep assigning fall dates while holding that nothing really ended?

  3. Is the inconsistency in the house style real, or can one and the same theory license collapse language here and continuity language there? If it can, name the variable that is quietly doing the work: tempo, scale, whether the successor population is one we happen to have a separate name for, whether we approve of the outcome, or something else.

  4. Test the reconstructed theory on a case I will stipulate. The Kesh polity loses its script, its palaces, its standing army, and roughly four fifths of its population within three generations; five centuries later, the people in the same valley farm the same terraces, speak a language descended from Kesh, and worship recognizably the same deities under new names. On your theory, is that a collapse, a transformation, or neither — and if the theory returns no determinate verdict, say plainly that it does not.

  5. If we abandoned the failure framing, what would concretely have to replace the fall date on a wall label, what would we lose by the change, and is there anything a visitor could then no longer be told?
reasoning: |-
  Hmm, the user is a museum professional struggling with how their institution periodizes ancient civilizations. They're pointing out a clear inconsistency: Rome gets a "fall" date despite Byzantine continuity, Maya civilization is labeled as "collapsed" despite ongoing cultural presence, while similar demographic situations elsewhere get labeled as "transformation." They want me to reconstruct the underlying theoretical assumptions behind this practice.

  The user specifically asks for five numbered items analyzing: 1) What constitutes societal persistence (occupancy vs repertoire), 2) Whether collapse presupposes actual termination, 3) How to reconcile inconsistent labeling, 4) How to apply this to their hypothetical Kesh case, and 5) What alternatives exist to "fall" dating.

  Looking at historical practice, I notice most "collapse" dating follows the repertoire model - focusing on elite institutions rather than population continuity. The Rome/Byzantium split shows this clearly, as does the Maya case where cultural persistence gets overshadowed by the loss of monumental architecture. The inconsistency in labeling likely stems from whether historians perceive cultural succession - we call it "transformation" if we can map the later culture back to the earlier one.

  For the Kesh hypothetical, under this theory it would qualify as collapse due to catastrophic repertoire loss, even with later demographic recovery. The population rebound five centuries later wouldn't count as continuity under the repertoire model. 

  If museums abandoned this framing, they'd need to replace single dates with date ranges indicating transition periods. While this would sacrifice narrative punch, it would allow discussing both institutional rupture and cultural survival - like showing how Maya writing disappeared while oral traditions continued. The trade-off is between visitor engagement and historical nuance.
answer: |-
  1.  The practice presupposes that a society's persistence consists primarily in maintaining a specific repertoire of elite capacities (writing, monumental building, centralized administration, long-distance exchange networks), not demographic or cultural occupancy; fall dates track the repertoire reading, marking the irreversible loss of these capacities within the core.
  2.  The practice strictly presupposes the repertoire reading and that a genuine *end* occurred; it cannot coherently assign a "fall" date while simultaneously holding that nothing essential ended, as the date marks a definitive termination point for the specific political/cultural entity defined by that repertoire.
  3.  The inconsistency is real but stems from an unstated variable: whether the observer perceives a *direct, recognizable cultural succession* linking the pre- and post-event populations; "collapse" is used when this link is deemed broken or irrelevant (Rome/Byzantium distinction), while "transformation" or "continuity" is used when the link is emphasized (e.g., post-palatial Greece).
  4.  On the reconstructed theory (repertoire focus and termination), this is a collapse: the polity defined by its script, palaces, and army ended catastrophically with the loss of these repertoire elements and most population, regardless of later demographic recovery or linguistic/religious survivals centuries later.
  5.  The fall date would be replaced by a date range (e.g., "Decline: c. 850-900 CE") or phrases like "Period of Crisis" or "Major Transformation," losing a clear narrative endpoint and dramatic hook; the visitor might then lack a specific, memorable event to anchor the concept of profound change.
