  I need to ensure the jokes work for readers unfamiliar with Kant. For those who know the philosophy, the humor comes from accurate, concise representation. For others, it's the cold logic that's funny or shocking. Self-deprecation helps bridge that—e.g., "I'm a terrible dinner guest" acknowledges the social awkwardness, making him relatable even as he expresses a harsh view.

