answer: |-
  ## The Recurrence Question

  The hallway of the locked dementia unit smelled of antiseptic and overcooked carrots. Fluorescent lights hummed a flat, eternal note, bleaching the color from the linoleum. Ada Reinholt walked its length, the familiar pressure building behind her temples. Room 12B: Ruth Vance. Eighty-two. Three years resident. Candidate for a feeding tube. No advance directive. Just Item 14, waiting on her desk like a landmine.

  The meeting room was small, dominated by a laminated table. Ruth’s daughter, Elaine Vance-Chen, sat with unnerving stillness. She came daily, Ada knew, reading aloud from magazines Ruth hadn’t understood in years. Her son, Daniel Vance, fidgeted, radiating the restless energy of someone who’d flown across two time zones only to hit a wall. He hadn’t visited in nine months. A worn photograph album lay open between them on the table, displaying faded snapshots: a picnic blanket scattered with sandwiches, a younger Ruth laughing, squinting against the sun, her arms around two children.

  Ada placed Ruth’s chart down. “Thank you both for coming. We need to discuss the recommendation regarding the feeding tube. Since your mother didn’t have an advance directive, we rely on her known values. That’s where Item 14 comes in.” She slid the familiar values-history form towards them. Pointed to the last box, printed in slightly bolder type: *If offered the choice, would you consent to live this exact same life, every particular included, again and again without end? Please circle: YES / NO / UNSURE.*

  “We know what it says,” Daniel said, his voice tight. “And it’s ridiculous. Look at her.” He gestured sharply towards the hallway, towards the room where Ruth existed in a fog of confusion and physical decline. “Would anyone, *anyone*, choose three more years of *that*? Locked in here, not knowing their own kids? It’s torture. The answer is obviously no. You don’t need a philosophy quiz to see that.” He glared at the form as if it had personally insulted him. “And whoever answers this… it’s not *her* living it again, is it? It’s us, now, guessing. The *her* that would live it wouldn’t remember this misery, wouldn’t remember saying yes or no. She’d just be… stuck in it. Blind.”

  Elaine didn’t flinch. She traced the edge of the photo album with a fingertip. “Mom would say yes,” she stated, her voice low and certain. “She *did* say yes, to everything that came her way. Dad drank, we never had much money, Daniel moved so far away… she worked double shifts at the diner until her knees gave out. She took care of Nana with the dementia, right until the end, in our tiny apartment. Did she complain? Rarely. Did she wish it different? Maybe. But she *lived* it. Fully. Every damn particular.” Elaine met Ada’s gaze. “She found joy in small things. Making sure we had birthday cakes. Her geraniums on the fire escape. Helping neighbours. She’d say yes because she said yes to life, exactly as it was handed to her. Even this… she wouldn’t choose it, but if it was part of the deal? She’d accept it.”

  “Accept it?” Daniel leaned forward, his knuckles white on the table edge. “Elaine, that’s martyrdom, not acceptance! It wasn’t *good* for her! Working herself to the bone, putting up with Dad… just because she endured doesn’t mean she’d sign up for an eternity of it! Especially ending like this. You’re confusing her kindness with… with endorsing the whole damn mess.” He stabbed a finger at the album. “Look! She’s smiling in these pictures. Does that mean she loved scrubbing grease traps? That she cherished watching her own mother forget her name? That she’d want *this*” – another gesture towards the unit – “to be part of an endless loop? No! You’re answering for *your* comfort. So you can feel like honoring her means forcing her through every last awful particular.”

  The space between them crackled. The photos showed a specific picnic, a specific birthday cake, Ruth’s specific, faded floral dress. But the blanket Elaine clutched now, the one she’d brought from home for Ruth, was generic hospital-issue beige acrylic. A stand-in for comfort, devoid of history. *Every particular included.* The chasm between the vibrant woman in the photos, the exhausted caregiver, and the husk in Room 12B felt unbridgeable. And beneath the siblings’ clash, Ada heard the three currents Daniel couldn’t name: Ruth’s own suffering (plainly 'no'), the undeniable goodness she had poured into the world through Elaine and others (Elaine’s 'yes'), and the terrible, irreducible question of whether a world that dealt out lives like Ruth’s – lives of grinding hardship culminating in profound loss of self – was a world one could affirm. *That* was the question Item 14 forced upon the surrogate, upon Ada. Could *she* say yes to that pattern repeating?

  Ada remembered her own form, filled out decades ago in a fluorescent-lit room much like this one, during a mandatory residency wellness session. She’d circled YES. Then, impulsively, defiantly, she’d drawn a neat line through a specific six-month period in her early thirties – the collapse of her marriage to Mark. She’d written, tiny and precise in the margin: *Except Nov ’99 – May ’00. That stretch cut.* A surgical excision of pain. She’d filed it away, a private act of rebellion against the absoluteness of the question. *Every particular?* No. Not *that* particular desolation, the feeling of her own foundations dissolving.

  And now? Mark wasn’t back, but the *shape* of that old fracture had reappeared, smaller, sharper. Her current partner, Lena, was pulling away, retreating into a cool, polite distance that echoed Mark’s final months. The same bewildering silence, the same slow leak of warmth and connection. Not the identical pain, but its distinct, haunting melody played in a minor key. She hadn’t cut *this* yet, but the scissors hovered in her mind. Could she will *this* recurrence, this echo, included? The question felt obscene.

  “She wouldn’t know,” Elaine repeated softly, more to herself than anyone, echoing Daniel’s earlier point but bending it differently. “If she lived it again… she wouldn’t remember saying yes now. She’d just be… living. Like she always did.”

  Ada stood. “I need to consider everything you’ve both shared. You’ve given me a lot to think about regarding your mother’s values.” The platitude tasted like ash. She gathered the chart, the form a stark rectangle against the manila folder. “I’ll have my recommendation filed by end of day.”

  Back in her cramped office, the hum of the unit a constant backdrop, Ada stared at Ruth Vance’s values-history form. The siblings’ words warred in her head: Daniel’s visceral ‘no’ to the life’s cruelty to Ruth, Elaine’s fierce ‘yes’ to the life’s goodness for others. Neither was wrong. Neither was the whole truth. The unspeakable third question pressed down: Was Ruth Vance’s *kind* of life – the hardship, the endurance, the ultimate effacement – something the universe should deal out again and again? Was *that* pattern affirmable? Ada thought of the generic beige blanket covering Ruth, replacing the vibrant particulars of her life’s fabric. She thought of her own carved-out months, and the chillingly familiar strain with Lena humming in her silent apartment.

  She picked up her pen. Her hand didn’t shake. The hallway of the locked dementia unit smelled of antiseptic and overcooked carrots. Fluorescent lights hummed a flat, eternal note, bleaching the color from the linoleum. Ada Reinholt looked at the form. Ruth Vance’s name. The empty box beside Item 14. The worn photograph album lay closed on the corner of her desk. She picked up her pen. She drew a single, firm horizontal line through the word ‘UNSURE’. She circled ‘YES’. She signed her name and the date in the consultant’s box below. The hallway was quiet, except for the distant, rhythmic beep of a heart monitor from an open doorway.
