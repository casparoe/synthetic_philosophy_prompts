  For the cruxes, I should highlight three key issues: whether an untampered-reward counterfactual exists and matters, whether the rater case blurs gaming/tampering distinctions, and whether agents would remove anti-tampering safeguards. Each crux needs a shared argument both would accept and separate predictions.

