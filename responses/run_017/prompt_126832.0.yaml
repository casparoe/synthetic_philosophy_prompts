  Below is a decision tree for the accuracy-first program, formatted as a one-page handout with a separate page of notes. The tree starts from the root commitment that epistemic standing is determined by accuracy, and norms are derived from this value. It has 12 branch nodes (questions) and 8 leaves (positions or outcomes). Each node is a question answerable without prior knowledge of positions, illustrated with a minimal case. The tree prioritizes your requested distinctions (holistic vs. additive accuracy, strength of propriety, decision principles, scope, value monism/pluralism, and domain of attitudes). 

  **Handout Page: Decision Tree**  
  *Root Commitment: The epistemic standing of a doxastic state is determined by its accuracy (how well it represents the world), and norms are derived solely from this value.*

  1. **Which attitudes are in the domain?**  
     - *Illustration: Consider a single credence of 0.7 in rain.*  
     - **A. Only precise credences** → Q2  
     - **B. Includes full belief, imprecise credences, or self-locating attitudes** → Q11  

  2. **Is accuracy measured holistically (whole credence function) or additively (proposition-wise)?**  
     - *Illustration: Three-cell partition {A, B, C}; world is A. Does inaccuracy depend only on c(A) or on c(A), c(B), c(C)?*  
     - **A. Holistically** → Q3  
     - **B. Additively** → Q6  

  3. **Is inaccuracy local (depends only on credence in the true state)?**  
     - *Illustration: Partition {A, B, C}; world is A. If inaccuracy = f(c(A)), it's local.*  
     - **A. Yes (local)** → Q4  
     - **B. No (global)** → Q4  

  4. **What strength of propriety is required?**  
     - *Illustration: Coin of unknown bias. Must a probability function expect itself to be strictly more accurate than others?*  
     - **A. Strictly proper** → Q5  
     - **B. Merely proper or no-sure-loss** → Q7  

  5. **Which decision principle applies?**  
     - *Illustration: Credence c(Rain) = 0.7 vs. c(Rain) = 0.8.*  
     - **A. State-wise dominance** → *Leaf 1: Joyce-style Probabilism*  
     - **B. Expected-accuracy maximization** → Q8  

  6. **Is the additive measure separable (each proposition’s inaccuracy independent)?**  
     - *Illustration: Inaccuracy for Rain depends only on c(Rain) and truth, not c(¬Rain).*  
     - **A. Yes** → Q4  
     - **B. No** → *Leaf 5: Unnamed Global Additive*  

  7. **Does the decision principle allow permissivism?**  
     - *Illustration: Two credence functions, neither dominates the other; both avoid sure loss.*  
     - **A. Yes (weaker dominance)** → *Leaf 3: Permissivist Probabilism*  
     - **B. No (strict dominance)** → *Leaf 1: Joyce-style Probabilism*  

  8. **Is the framework synchronic only?**  
     - *Illustration: Updating credence in Rain after learning Temperature.*  
     - **A. Yes** → *Leaf 2: Synchronic Expected Accuracy*  
     - **B. No** → Q9  

  9. **Does it govern updating?**  
     - **A. Yes** → Q10  
     - **B. No** → *Leaf 2: Synchronic Expected Accuracy*  

  10. **Which updating norm is derived?**  
