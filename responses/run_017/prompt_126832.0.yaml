  **Miniature Cases for Illustrations**  
  - **Q2 (Holistic/Additive)**: Partition {A, B, C}; world = A. Holistic: Inaccuracy = −log c(A). Additive: Inaccuracy = (1−c(A))² + (0−c(B))² + (0−c(C))².  
  - **Q4 (Propriety)**: Coin with bias unknown. Strict propriety: Only c(Heads) = true bias minimizes expected inaccuracy. Weak: Multiple c(Heads) minimize it.  
