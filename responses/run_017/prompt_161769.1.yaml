  I need to ensure each point addresses both models and ties back to underlying principles. For instance, when discussing risk, highlight how the loan model's hidden pooling contrasts with the tax model's explicit sharing. For positional goods, explore how each system's justification is affected. The bankruptcy tension might reveal a moral vs. practical conflict in the loan system.

  The alternatives should be compared to current practices, pointing out shifts in assumptions. For example, a graduate tax removes the loan pretense but might face political hurdles. Income-share agreements shift risk to investors but may commodify education. Means-tested support targets equity but requires higher taxes.

