prompt: |-
  Doing a reading group on Scanlon's contractualism — mostly grad students, plus one political theorist who keeps dragging Rawls in — and I've built an argument against it that I'm fairly sure proves too much, but I can't locate the bad step. Here it is:

  (1) On contractualism, an act is wrong iff it's disallowed by any set of principles that no one could reasonably reject, and whether some person could reasonably reject a principle depends on how strong *their* objection is, compared one at a time against the objections of other individuals. Numbers don't count: that a burden or benefit falls on a million people rather than one doesn't by itself make anyone's objection any stronger. That's supposed to be the whole point of the view — it's why mild pleasures for millions can't justify torturing one person, and why contractualism isn't just utilitarianism with a nicer story about justification. (2) Bridge: you can rescue Ada or five strangers, not both, everyone otherwise equal, each dies if not rescued. Ada's objection to save-the-five (she dies) is exactly as strong as each stranger's objection to save-Ada; I know there's a contractualist tie-breaker about comparing the *strength* of individual burdens, but here the burdens are death versus death, so it does nothing. And the objections can't be pooled, by (1). So contractualism can't rank the options and can't require saving the five, which means saving Ada is permissible. (3) Nothing in (2) turns on the number five. If numbers never strengthen anyone's objection, then a sixth person, a hundredth, a millionth on the many side changes nothing; run the argument again and again and no number of people on the many side ever makes saving the one impermissible. So contractualism is committed to: for any N, you may save the one instead of the N. (4) And here's a version I think is worse. A policy gives each of 200 million people a trivial convenience and imposes on each a one-in-ten-million risk of death. Nobody's individual objection is worth anything — the per-person risk is smaller than risks everyone runs daily without thinking — so no one could reasonably reject it, so it's permitted. But it predictably kills about twenty people. Scale the population and the predictable body count gets as large as you like while every individual complaint stays negligible, and contractualism has no way to prefer the variant with fewer expected deaths, since that difference is purely aggregate. (5) So contractualism either permits knowingly letting a million die to save one, or permits policies with an arbitrarily large predictable death toll, or both. That can't be right.

  I'd most like to keep (1): if contractualism starts adding up across people it stops being the view that explains why the separateness of persons matters, and whatever fix I reach for has to leave the torture case alone, since that result comes from the same anti-aggregation machinery. But I also can't see how to give up (2) or (3) without giving up (1). One of the contractualists in the group says the flaw is in (3): she says we don't assess a principle for a single case but over the whole range of situations it governs, so a person can object that under save-the-one she'd usually be on the losing side, and with a million-to-one that objection is crushing. I half buy that for Bridge, except that it looks to me exactly like taking expected utility from behind a veil of ignorance about which position you occupy — aggregation over positions rather than over people — which sort of begs the question for me, since I suspect that's a relabeling rather than a distinction. And I don't see how it even gets started on (4), where there's no question of which side you're on because everybody is on the same side. So: which step is bad, why did it look fine, and what does each available repair cost me? I'd rather have the diagnosis than a verdict on contractualism, and I don't need anything assigned for the group to read — we've read what we've read.
reasoning: |-
  Okay, the user is grappling with a problem in Scanlon's contractualism, specifically how it handles aggregation. Their argument seems to show that contractualism leads to counterintuitive results like always allowing saving one over many or permitting policies that cause massive harm through small individual risks. They want to know which step is flawed and what the fix costs.

  First, I need to recall Scanlon's core ideas. Contractualism says an act is wrong if disallowed by principles no one could reasonably reject. Individual objections are compared one-on-one, without summing across people. The user's bridge case (saving Ada vs. five) highlights a tie since each person's objection is equally strong. But the tie-breaker about burden strength doesn't apply here because death vs. death is equal. So saving Ada seems permissible. Extending this, even with more people, saving the one remains allowed, which feels wrong.

  The user's friend suggests that principles are evaluated over many cases, not just one. So a person could object to a save-the-one principle because, over many instances, they'd likely be in the losing group. But the user worries this is just aggregation in disguise, using expected utility behind a veil of ignorance. Plus, in the risk case, everyone faces the same small risk, so no one has a strong individual objection, leading to policies that kill many people.

  I think the key flaw is in step (2). The tie-breaker isn't just about the severity of the burden but also the principle's general application. In the bridge case, if we consider a general principle like "save the one over many," then each person can reasonably reject it because it systematically disadvantages them in similar situations. Scanlon does allow objections to how a principle distributes burdens across different scenarios. This isn't aggregation but a complaint about impartiality. However, this fix might weaken the anti-aggregation stance because it introduces a form of aggregation through the back door.

  For the risk case, the problem is trickier. If each person's risk is tiny, no one can reasonably object individually. But Scanlon might allow objections based on the principle's cumulative effects. The user might see this as aggregating harms, which contradicts contractualism's core. Alternatively, if the policy imposes a risk without consent or proper justification, that could be grounds for rejection. But that might not satisfy the user's concern about large-scale harm.

  The user wants to preserve the torture case outcome, where aggregating many small pleasures doesn't justify torturing one. Any fix must maintain that. If the solution for the bridge case relies on expected harm over multiple cases, does that undermine the torture argument? In the torture case, each person's pleasure is small, so even over many cases, no individual has a strong objection to a principle that allows torture for minor gains. So maybe the torture case remains intact because the burdens and benefits are asymmetric. But the risk case still poses a challenge.

  The user's deeper need is to understand if contractualism can handle aggregation without collapsing into utilitarianism. They suspect that the proposed fixes are just relabeling aggregation. So the cost of the repair might be a concession that some form of aggregation is necessary, which Scanlon tries to avoid. Alternatively, clarifying that objections can be based on the principle's general application without summing individual harms might preserve the separateness of persons. But the risk case shows a gap where individual objections don't capture large-scale harms, suggesting contractualism might need to incorporate some aggregation for such scenarios, which could be a significant cost.
answer: |-
  You've hit on a central tension in Scanlon's contractualism – the anti-aggregation commitment in (1) versus the intuitive pull of numbers in cases like (2) and (4). Your argument is astute and exposes a genuine difficulty. The flaw lies in **step (2)**, specifically in how you model the objections and the principles being evaluated. The contractualist's response you mention ("we assess principles over the whole range of situations") is actually the key repair, though it comes at a cost. Let's break it down:

  1.  **Why Step (1) Looks Fine (and is mostly correct):** You correctly characterize Scanlon's core thesis. Contractualism prohibits simply summing burdens/benefits across individuals to determine the strength of a "group" complaint. The "separateness of persons" means the complaint of each individual against a principle must be evaluated on its own merits, comparing its strength *one-to-one* against the complaints others would have against alternative principles. This *is* what blocks justifying torture for millions of minor pleasures – the victim's crushing individual objection outweighs each individual beneficiary's weak objection, one by one. Numbers don't *automatically* strengthen any *single* individual's complaint.

  2.  **The Flaw in Step (2): Misidentifying the Principle and the Objections:** Your analysis of the rescue case assumes we're evaluating principles for *this single instance*: "Principle A: Rescue Ada in *this* situation" vs. "Principle B: Rescue the five in *this* situation." On *this* reading, your conclusion follows: Ada has a strong objection to B (death), each stranger has an equally strong objection to A (death). Comparing one-on-one, Ada's objection to B is as strong as any single stranger's objection to A. Since objections can't be pooled, contractualism seems silent, and saving either is permissible.
      *   **The Problem:** Scanlon insists we evaluate *general principles*, not principles tailored to single cases. We ask: "Could any principle *governing actions of this type* be reasonably rejected?" The relevant principles are general: e.g., "P1: Save the single identified person over a group of strangers when forced to choose" vs. "P2: Save the larger group of strangers over a single identified person when forced to choose."
      *   **The Repair (and its Cost):** When evaluating **P1 ("Save the One")**, any individual (like one of the five strangers) can raise the following objection: "Under this general principle, in the *many* situations where I am a member of the larger group facing death against a single identified person, I will be left to die. The burden *I personally face* under this principle is the *risk* of death in such situations, not just death in *this* instance. The *magnitude* of my burden depends on how *likely* it is that I will find myself in the 'losing' group versus the 'winning' one under the principle's application over time." Crucially:
          *   **It's Still an Individual Complaint:** This is not pooling the complaints of the five. It's *one person* complaining that *they themselves* bear a significant burden (a high risk of death) under P1 when applied generally.
          *   **The Burden is the Risk/Systematic Disadvantage:** The objection isn't based on the *number* of others who die in *this* case, but on the *systematic disadvantage P1 imposes on people like them* (those who are not the single identified person in rescue dilemmas) across the range of situations governed by the principle. The strength of *this individual's objection* to P1 is proportional to the *probability* they will be in the losing group and the *severity* of the loss (death).
          *   **Comparing Objections:** Now compare this individual's objection to P1 against Ada's objection to P2 ("Save the Many"). Ada objects: "Under P2, in the much rarer situations where *I* am the single identified person facing a group, I will be left to die." The *strength* of Ada's individual objection is also proportional to the *probability* she will be the single identified person and the severity (death).
      *   **The Tie-Breaker:** With a significant asymmetry in group size (e.g., 1 vs. 5, 1 vs. 100), the *probability* that any given individual will be in the larger losing group under P1 is *much higher* than the probability they will be the single identified person under P2. Therefore, the *expected burden* (risk of death) borne by *each individual* under the "Save the One" principle (P1) is *greater* than the expected burden borne by *each individual* under the "Save the Many" principle (P2). Each member of the larger group has a *stronger individual objection* to P1 than Ada has to P2. Therefore, P1 ("Save the One") *can* be reasonably rejected. P2 ("Save the Many") cannot be reasonably rejected (everyone's expected burden under it is lower than under P1). Saving the five is required.

  3.  **Why Steps (3) & (4) Still Seem Problematic (The Cost of the Repair):** This repair works for the rescue case but raises the issues you anticipated:
      *   **Is This Just Aggregation in Disguise? (The Relabeling Worry):** It absolutely looks like expected utility calculation behind a veil of ignorance. Scanlon insists it's distinct because:
          1.  **Focus on Individual Justification:** It's framed as each individual assessing the burden *to them personally* of living under a general principle, based on their place in the world (they know they are *a person*, likely to be in larger groups more often).
          2.  **No Interpersonal Summing:** The comparison is still one-to-one: *My* expected burden under P1 vs. *your* expected burden under P2. We aren't summing the burdens across the group to get a "group burden."
      *   **The Cost:** This move significantly dilutes the pure "separateness of persons" intuition. It injects a form of *risk-based aggregation* or *expected value calculation* into the assessment of individual burdens. While it doesn't sum actual harms across people *in a single case*, it sums *potential harms to one person* across *many possible cases*. This is why critics argue contractualism, to avoid absurdity, ends up smuggling in a consequentialist element.
      *   **The Risk Case (4) Remains Hard:** This repair struggles significantly with your risk imposition case. Here, the principle is something like "P-Risk: Allow policies that impose small individual risks (below threshold X) for significant aggregate benefits." *Each individual's complaint* seems vanishingly small: "This policy imposes a tiny risk on me." Comparing one-on-one against the complaint of someone advocating for "P-Safe: Never impose such risks," the objection to P-Safe might be "P-Safe prevents significant benefits/conveniences." But for *each individual*, the benefit lost under P-Safe (the trivial convenience) is *also* small. Crucially:
          *   **The Systematic Disadvantage Angle Falters:** Unlike the rescue case, there isn't a clear "winning" and "losing" group under P-Risk *across different applications*. *Everyone* gets the small convenience and bears the small risk in this *single* policy application. The objection isn't about being systematically disadvantaged relative to others under the principle over time; everyone is treated the same way here and now.
          *   **The Predictable Death Toll:** Contractualism, focused on individual objections to the principle governing the risk imposition, seems unable to capture the moral significance of the predictable aggregate death toll *as such*. Each death is a tragedy, but the principle P-Risk didn't *target* anyone, and the risk to *each* was acceptably small. The complaint of the person who *actually* dies is retrospectively strong ("This policy killed me!"), but prospectively, when evaluating the principle, no individual had grounds for a strong objection based on their *own* prospective burden.
          *   **Possible Contractualist Responses (Costly):**
              *   **Invoke Fairness/Procedural Objections:** Object that the policy was adopted without adequate consent, scrutiny, or consideration of alternatives that might distribute burdens/benefits differently, even if the per-person risk is small.
              *   **Reject the "Acceptably Small" Threshold:** Argue that knowingly imposing *any* non-zero risk of death for trivial convenience, when aggregated across a population guaranteeing deaths, *is* a burden strong enough for each individual to reasonably reject. But this seems implausibly stringent (we accept such risks daily).
              *   **Focus on Actual Harm:** Argue that principles must be sensitive to *actual outcomes*. If a principle predictably leads to avoidable deaths, those deaths constitute strong individual objections *ex post facto*, making the principle rejectable. But this moves away from the prospective, principle-based focus and towards assessing actual consequences case-by-case.
              *   **Concede the Problem:** Acknowledge that pure contractualism struggles with pure aggregation problems involving small individual risks/burdens leading to large aggregate harms/benefits. This might require supplementation or accepting that such policies are permissible if the per-person burden is truly below a reasonable threshold – which is the costly consequence you identified.

  **Diagnosis Summary:**

  1.  **The Bad Step:** Step (2). You modeled the principles and objections as applying to a single instance. Contractualism evaluates general principles.
  2.  **Why It Looked Fine:** The torture case *can* be handled by single-instance reasoning (one victim's crushing burden vs. each beneficiary's trivial gain). The rescue case superficially seems analogous (death vs. death per person). The flaw only becomes apparent when recognizing that objections to a *general* principle must account for the *systematic burden it imposes on an individual* across its range of application, which involves their *risk* of being disadvantaged.
  3.  **The Repair:** Evaluate general principles. Individuals can object based on the *expected burden/risk* the principle imposes *on them personally* over the situations it governs. The strength of an individual's objection depends on the probability and severity of the burden *they* bear under the principle.
  4.  **The Cost:**
      *   **Risk-Based Aggregation:** This repair incorporates a form of expected value calculation/risk-based aggregation into the assessment of individual burdens. This weakens the "pure" separateness of persons intuition central to (1).
      *   **Preserves Torture Case?** Mostly yes. The torture victim's objection (certain, severe harm) is vastly stronger than any single beneficiary's objection to a principle forbidding torture (loss of a trivial pleasure, even considered over many instances where they might benefit). The asymmetry in burden severity dominates.
      *   **Struggles with Risk Cases:** The repair doesn't easily resolve the risk imposition case (4). Contractualism struggles to generate sufficiently strong *individual* objections to principles permitting small per-person risks that predictably cause large aggregate harm, without resorting to arguments that may seem ad hoc or abandoning its core constraints. This remains a significant challenge.

  Your argument brilliantly exposes the tension between contractualism's foundational anti-aggregation commitment and its need to handle cases where numbers intuitively matter. The "systematic disadvantage" move is Scanlon's main recourse, but it inevitably introduces a consequentialist-leaning element (risk/expectation) that critics argue undermines the view's distinctiveness. Whether this cost is acceptable or a fatal flaw is the heart of the ongoing debate you're having.
