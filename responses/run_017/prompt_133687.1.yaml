prompt: |-
  I chair the acquisitions committee of a museum of contemporary art with a small collecting budget, a remit that covers a region none of us can travel to more than once a year, and a board that has veto power over every purchase and has never seen any of the works either. We meet for ninety minutes a month, review four to six proposals, and write a two-page recommendation on each. Roughly half of what we consider cannot be experienced first-hand: works still in the artist's studio, works in private collections on another continent, installations whose only documentation is a set of installation photographs and a walkthrough shot taken on a phone, performances captured in a single-camera recording.

  The committee splits along a fault line that I gather the philosophy of art has written about at length, though I have no library access and no way to read any of it. Two of us think that a judgment about a work's aesthetic value essentially depends on being with the work, so that buying on someone else's word is buying blind; one of them calls this the acquaintance principle. Two of us think aesthetic testimony works like testimony anywhere else and that the only real questions are about the quality and independence of the source. I do not need the dispute settled and I do not need to be told what the literature says. I need a procedure my committee can run on a file, in about fifteen minutes, with nothing in front of us but the file and our own records.

  Please give me that procedure in the form of ordered questions, where for each question you state what would count as a sufficient answer, where the procedure returns a clear no, and where it stops and hands the decision to a person or to the board because the remaining question is about what we value or how much risk we want rather than about what is true. It has to sort the things a file says into distinct kinds and treat them differently: checkable facts about the work (medium, dimensions, condition, provenance, edition), reports of what it is like to spend time with the work, verdicts about its quality or importance, and forecasts about how publics, critics or funders will receive it. It has to cope with sources that look independent but are not (three curators from one circle, one gallery's whole stable), with a testifier who has a stake in our buying (our own curator, who put the artist in a show last year), and with works whose value seems to reside in something documentation flattens — scale, material presence, a room that the camera does not convey. It has to tell us what to do when a step cannot be answered at all because we cannot ask a follow-up: the gallery will not release a condition report, the artist refuses studio visits. And it has to mark, honestly, which of its steps are genuine checks and which are judgment calls wearing a checklist as a costume, and say plainly what the procedure cannot do.

  Because we decide repeatedly, please also build in a ledger: what we should record when a work finally arrives and we see it ourselves, and how a source's past verdicts should then change the weight we give their next one. I suspect perfect agreement in the past is being treated by all of us as stronger evidence than it is.

  Then run the procedure on three files from last month, and give me the one-page version of it separately.

  One: a twenty-two minute single-channel video work that we can watch in full on a screener, whose value does not seem to depend on the room it plays in, recommended by a correspondent we have bought from twice.

  Two: a room-sized installation by an artist whose last three works we own, where scale and material presence are said to be the whole point, and where the documentation is installation photographs and one handheld walkthrough.

  Three: a small painting, modestly priced, from a dealer whose last twelve recommendations have matched our own verdicts almost exactly once the works arrived; the file contains a confident verdict and a price and almost nothing about what being with the painting is like. The committee was ready to buy this one, and if your procedure says otherwise I would like to know precisely which step stops it and why that step is not just paperwork.
reasoning: |-
  Hmm, I need to help this museum acquisitions committee chair design a practical procedure for evaluating art purchases. The committee faces unique constraints: limited budget, infrequent travel to the region they cover, and board veto power without firsthand viewing experience. They review 4-6 proposals monthly in 90-minute meetings, writing 2-page recommendations each. About half the works can't be experienced firsthand.

  The committee is divided philosophically: two members believe aesthetic judgment requires direct experience (acquaintance principle), while two believe reliable testimony is sufficient. The chair needs a 15-minute per file procedure that doesn't resolve this debate but provides a practical framework.

  Key requirements:
  - Must handle various file components differently (facts, experiential reports, verdicts, forecasts)
  - Must identify biased sources (curator circles, galleries with stakes)
  - Must account for documentation limitations (scale, materiality, installation)
  - Must have protocols for missing information (no condition reports, refused visits)
  - Must transparently distinguish factual checks from judgment calls
  - Needs a ledger system for post-acquisition verification and source reliability tracking

  Procedure structure:
  I'll create a flowchart-style questionnaire with decision points leading to:
  1) Clear "yes" (recommend purchase)
  2) Clear "no" (reject)
  3) "Board referral" for value/risk decisions
  4) "Insufficient data" when critical information is missing

  The procedure should have:
  - A source reliability assessment matrix
  - Documentation adequacy criteria
  - Risk assessment for unverifiable elements
  - A ledger protocol for post-acquisition review

  For the three test cases:
  1) Video work (documentation-friendly, trusted source)
  2) Installation (scale-dependent, poor documentation)
  3) Painting (reliable dealer but lacking experiential data)

  The chair specifically wants to know why case #3 might get rejected despite committee enthusiasm - so I'll pinpoint that step.

  I'll also prepare a separate one-page quick reference version of the procedure. The ledger system should track source accuracy and document how works match expectations upon arrival.
answer: |-
  Here is a procedural framework designed for your constraints. It operates as a 15-minute checklist per file, sorting information into **Facts (F)**, **Experiential Reports (ER)**, **Verdicts (V)**, and **Forecasts (FC)**. It explicitly marks **✓** for objective checks, **?** for judgment calls, and **⚠️** for board referrals. A ledger system is integrated for accountability.

  ---

  ### **ACQUISITIONS EVALUATION PROCEDURE**  
  **(Per File, 15-Minute Timebox)**  

  #### **STEP 1: SOURCE ASSESSMENT** (✓/?)  
  *Purpose: Flag bias or unreliable testimony.*  
  - **Q1.1: Is the primary source independent?**  
    *Sufficient:* Source has no financial/curatorial stake (e.g., not the artist’s gallery, not our curator advocating their own show artist).  
    *No:* Source is invested (e.g., dealer, artist-affiliated curator).  
    *Stop/Refer:* If source is conflicted, proceed but discount ER/V/FC in Step 3.  
  - **Q1.2: Is corroboration available from ≥2 unrelated sources?**  
    *Sufficient:* At least two independent parties (e.g., critic + collector from different networks; exclude "circle" affiliates).  
    *No:* Single source or linked sources (e.g., three curators from same biennial team).  
    *Stop:* If "No," ER/V/FC require higher scrutiny in Steps 2–3.  

  #### **STEP 2: FACT VERIFICATION** (✓)  
  *Purpose: Confirm objective attributes.*  
  - **Q2.1: Are all checkable facts complete?** (Medium, dimensions, edition, provenance, condition report.)  
    *Sufficient:* Full documentation; gaps explained (e.g., "provenance: private collection, anonymity requested").  
    *No:* Critical gap (e.g., missing condition report, incomplete provenance).  
    *Stop:* If "No" and unfixable (e.g., gallery refuses report), **return "No" – unverifiable asset**.  
  - **Q2.2: Does the work’s medium/documentation align?**  
    *Sufficient:* Medium is documentation-friendly (e.g., video, digital art) OR high-quality documentation exists (e.g., 3D scan, professional installation shots).  
    *No:* Work relies on materiality/scale (e.g., sculpture, immersive installation) AND documentation is poor (e.g., single phone video).  
    *Stop/Refer:* If "No," **refer to Board – high experiential risk** (Step 5 will assess impact).  

  #### **STEP 3: EXPERIENTIAL & VALUE CLAIMS** (?)  
  *Purpose: Evaluate subjective claims; adjust for source bias.*  
  - **Q3.1: Is there a detailed ER (what it’s like to be with the work)?**  
    *Sufficient:* Specific descriptors of sensory/emotional impact (e.g., "texture creates unease," "sound shifts perception of space").  
    *No:* Only V/FC (e.g., "masterpiece," "will resonate with diaspora communities").  
    *Stop:* If "No" *and* work is experiential (per Step 2.2), **return "No" – inadequate testimony for medium**.  
  - **Q3.2: Are V/FC supported by ER or facts?**  
    *Sufficient:* Verdicts linked to observable traits (e.g., "innovative because X technique subverts Y tradition").  
    *No:* Unsupported assertions (e.g., "important voice" without context).  
    *Stop/Refer:* If "No," **discount V/FC**; proceed only if ER/Facts suffice.  

  #### **STEP 4: RISK TIERING** (⚠️)  
  *Purpose: Quantify uncertainty for board referral.*  
  - **Q4.1: What % of the work’s value hinges on undocumented experience?**  
    *Low risk (0–25%):* Documentation conveys core value (e.g., video art, conceptual piece).  
    *High risk (50–100%):* Scale/materiality critical (e.g., site-specific installation).  
    *Sufficient for Committee:* Low risk.  
    *Refer:* High risk – **Board decides if financial risk justifies acquisition**.  
  - **Q4.2: Can we mitigate risk?** (e.g., trial loan, purchase contingent on inspection).  
    *Sufficient:* Yes (e.g., dealer allows 30-day post-delivery approval).  
    *No/Stop:* Unmitigated high risk – **return "No" if budget cannot absorb loss**.  

  #### **STEP 5: DECISION OUTPUT**  
  - **YES:** All facts verified (Step 2), ER/V credible (Step 3), and low risk (Step 4).  
  - **NO:** Unverifiable facts (Step 2.1), inadequate ER for experiential work (Step 3.1), or unmitigated high risk (Step 4.2).  
  - **REFER TO BOARD:** Source conflicts (Step 1), high risk (Step 4.1), or value/risk tradeoffs.  

  ---

  ### **LEDGER PROTOCOL**  
  **Post-Acquisition Recording:**  
  1. **Discrepancy Score (1–5):** Rate alignment of actual work vs. file (1 = perfect match, 5 = major deviation in ER/V).  
  2. **Source Accuracy:** Flag sources whose ER/V mismatched reality (e.g., "Dealer X overstated material impact").  
  3. **Risk Validation:** Note if undocumented elements (scale, presence) affected value as predicted.  

  **Weighting Future Sources:**  
  - Sources with consistent Discrepancy Scores ≤2 gain higher ER/V weight.  
  - Sources with Score ≥4 trigger Step 1 automatic "No independence" for 3 subsequent proposals.  
  - *Adjustment:* Perfect agreement (Score 1) requires ≥3 instances to increase weighting – avoid overcorrection for luck.  

  ---

  ### **TEST CASE APPLICATIONS**  
  #### **Case 1: Video Work**  
  - Step 1: Trusted correspondent (✓).  
  - Step 2: Full screener (✓); medium/documentation aligned (✓).  
  - Step 3: ER implied by viewing; V supported.  
  - Step 4: Low risk (0%–documentation conveys all).  
  - **Output: YES.**  

  #### **Case 2: Room-Sized Installation**  
  - Step 1: Assume independent source (✓).  
  - Step 2: Facts complete, but medium/documentation misaligned: scale/presence critical, poor walkthrough (✗).  
  - Step 3: ER likely inadequate (✗).  
  - Step 4: High risk (100%); no mitigation mentioned.  
  - **Output: NO** (fails Step 2.2 and Step 3.1). *Board referral possible only if risk mitigation added.*  

  #### **Case 3: Small Painting**  
  - Step 1: Dealer has stake (✗), but past accuracy high (✓ ledger).  
  - Step 2: Facts verifiable (✓).  
  - Step 3: **Critical failure: No ER (✗).** Verdict unsupported by experiential detail.  
  - Step 4: Low risk (painting documentation-friendly), but ER gap unresolved.  
  - **Output: NO** (fails Step 3.1). *Why not paperwork?* The absence of ER prevents assessment of *why* the work succeeds – dealer’s verdicts, while historically accurate, could mask shifting tastes or context (e.g., a technically sound but emotionally inert work). The procedure blocks overreliance on verdicts divorced from experience.  

  ---

  ### **ONE-PAGE PROCEDURE SUMMARY**  
  **1. Source (1 min):** ✓ Independence? ✓ Corroboration?  
  **2. Facts (3 min):** ✓ All attributes confirmed? ✓ Documentation matches medium? (NO/Stop if unfixable gap.)  
  **3. Experience (5 min):** ? Detailed ER? ? V/FC supported? (NO/Stop if experiential work lacks ER.)  
  **4. Risk (5 min):** ⚠️ % value undocumented? ⚠️ Mitigation? (Refer/Board if high risk.)  
  **5. Output (1 min):** YES (all ✓/low risk), NO (gaps/high risk), or REFER (value judgment).  

  **Ledger:** Post-arrival, log Discrepancy Score (1–5) and adjust source weights. Perfect agreement requires ≥3 instances to trust.  

  *Limitations:* Cannot resolve philosophical disputes; cannot create absent ER; board must rule on subjective risk tolerance.  

  ---  
  This procedure prioritizes defensible decisions over philosophical agreement, using your operational constraints as scaffolding. The "NO" on Case 3 targets structural gaps in testimony, not dealer reliability – protecting against aesthetic drift or unexamined consensus.
