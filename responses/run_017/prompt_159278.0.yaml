prompt: |-
  hi — in my decision theory reading group one person keeps ending discussion of the Allais paradox with "obviously rational preferences have to be independent of irrelevant alternatives", and he uses it twice over: to say the Allais choices are just a mistake, and to say prospect theory can only ever be descriptive. I think the line is doing less work than he thinks, but I dont know which precise claim to argue with.

  Can you lay out the different things that sentence could actually mean, as a menu? The distinctions I want in it: (i) the menu version — your choice between two options shouldn't flip when a third option you wouldn't have picked is added; (ii) the mixture version — where the "irrelevant" thing isn't an option on a menu at all but a shared outcome branch: if you'd get the same consequence with the same probability either way, it shouldn't affect which you prefer; (iii) the state-by-state "sure thing" version — if you'd prefer A to B conditional on E and also conditional on not-E, then prefer A to B; (iv) the social-choice version, which I suspect is a totally different axiom wearing the same name; (v) the strong version — that a rational agent's preferences are context free, no framing, no regret, no status quo effects. For each, say whether its a platitude, a substantive but defensible requirement, or actually false — and say which of them the Allais pattern even bears on. My hunch is (i) and (iv) are red herrings here and the real fight is between (ii) and (iii), but tell me if that's wrong.

  Two more things. He also said that violating independence means you can be money-pumped or that your plans go dynamically inconsistent, and I thought that only followed from intransitivity — is there a reading of the slogan under which he's right? And is there a reading on which what's really going on in Allais isn't dependence on an alternative at all but something about how probabilities get weighted, so that "independence of irrelevant alternatives" is just a misnomer for it?

  Write it in British English, and keep it as a list I can take back to the group.
reasoning: |-
  Okay, the user is part of a decision theory reading group and has a member who frequently shuts down discussions on the Allais paradox by claiming that rational preferences must be independent of irrelevant alternatives. The user wants to clarify what this phrase actually means in different contexts and how it relates to the Allais paradox. They also have questions about money pumps and whether the term is a misnomer.

  First, I need to break down the different interpretations of "independence of irrelevant alternatives" (IIA). The user provided a list: (i) menu version, (ii) mixture version, (iii) sure thing principle, (iv) social choice version, and (v) context independence. I'll define each, assess their validity, and relate them to Allais.

  The Allais paradox involves choices between lotteries. In the first pair, people prefer a sure win over a risky option with a higher expected value. In the second pair, they switch when both options involve risk. This violates the independence axiom in expected utility theory. The key here is the mixture version (ii), which is the independence axiom itself. The sure thing principle (iii) is related but distinct; it's about partitioning states, not mixtures.

  For each version:
  - (i) Menu IIA is about adding irrelevant options. Allais doesn't involve adding options, so it's a red herring.
  - (ii) Mixture IIA is directly violated in Allais. It's a substantive requirement for expected utility but questionable descriptively.
  - (iii) Sure thing principle is a normative axiom but different from mixture independence. Allais might challenge it indirectly.
  - (iv) Social choice IIA is unrelated to individual decisions.
  - (v) Context independence is broader and violated in Allais due to framing.

  The user also asks about money pumps. Violating mixture independence alone doesn't cause money pumps without other factors like intransitivity or dynamic inconsistency. However, if preferences are context-dependent (v), it could lead to exploitation. 

  Regarding the term "misnomer": The independence axiom is about linearity in probabilities, not alternatives. Prospect theory explains Allais through probability weighting, not IIA violation per se. So calling it "independence of irrelevant alternatives" might be misleading.

  The user needs a clear breakdown to counter their peer's argument. They suspect the peer is conflating mixture and sure thing principles. Clarifying that Allais challenges mixture independence (ii) and that prospect theory offers a valid descriptive model is key. Also, highlighting that money pumps aren't inevitable unless other irrationalities exist could strengthen their rebuttal.
answer: |-
  Right, your reading group mate is wielding "independence of irrelevant alternatives" (IIA) like a blunt instrument, conflating distinct concepts and overstating its implications for Allais and Prospect Theory. This is a common confusion point. Let's dissect the possible meanings relevant to decision theory, assess their status, pinpoint Allais' relevance, and address the money pump and misnomer issues.

  **The "Independence of Irrelevant Alternatives" Menu: Distinctions & Assessments**

  1.  **Menu IIA (Choice Set Context Independence):**
      *   **Definition:** Your preference between A and B should not change if a third option C (which you wouldn't choose over A or B) is added to or removed from the choice set. E.g., Preferring A over B shouldn't flip just because C is now also available, even if you'd never pick C over either.
      *   **Relevance to Allais:** **Red Herring.** Allais involves choices between *specific pairs* of lotteries (1A vs 1B, 2A vs 2B). The paradox arises within these specific pairwise comparisons; no irrelevant alternative C is added to either choice set. Allais doesn't challenge this.
      *   **Status:** **Substantive but defensible normative requirement.** Violations suggest susceptibility to framing or context effects (decoy effect) that seem normatively dubious. *Platitude?* Debatable, but a strong normative intuition.

  2.  **Mixture IIA / Independence Axiom (EU Core - The Key One for Allais):**
      *   **Definition:** If you prefer lottery A to lottery B, then you should prefer the mixture `pA + (1-p)C` to the mixture `pB + (1-p)C` for any lottery C and any probability `p > 0`. The shared branch `(1-p)C` is "irrelevant" to the preference between A and B. It's about linearity in probabilities.
      *   **Relevance to Allais:** **Directly Central.** The Allais paradox is the *classic* example of violating this axiom. Choosing 1A (sure £1M) over 1B (0.89 £1M, 0.10 £5M, 0.01 £0) implies `£1M > [0.89 £1M, 0.10 £5M, 0.01 £0]`. But choosing 2B (0.10 £5M, 0.90 £0) over 2A (0.11 £1M, 0.89 £0) implies `[0.10 £5M, 0.90 £0] > [0.11 £1M, 0.89 £0]`. Notice that 2A = `(1/11) * £1M + (10/11) * [£0]` and 2B = `(1/11) * [0.10 £5M, 0.90 £0] + (10/11) * [£0]`. If we let `p=1/11`, `A = £1M`, `B = [0.10 £5M, 0.90 £0]`, `C = £0`, then mixture independence requires `pA + (1-p)C > pB + (1-p)C` iff `A > B`. But Allais choosers have `A > B` (from choice 1) *and* `pB + (1-p)C > pA + (1-p)C` (from choice 2). **Direct Violation.**
      *   **Status:** **Substantive requirement for Expected Utility (EU), descriptively false.** EU *requires* this axiom. Its normative status is **highly contested** precisely *because* of robust empirical violations like Allais. Many argue that common weighting of probabilities (e.g., underweighting high prob sure gains, overweighting small prob losses) makes violating it descriptively *and* normatively plausible in some contexts. *Platitude?* Absolutely not. It's the battleground.

  3.  **State-Wise Dominance / Sure-Thing Principle (STP):**
      *   **Definition:** If prospect A gives outcomes at least as good as prospect B in every possible state of the world, and strictly better in at least one state, then A should be strictly preferred to B. A weaker, related form: If you prefer A to B conditional on event E occurring *and* also prefer A to B conditional on E *not* occurring, then you should prefer A to B unconditionally (this is Savage's Sure-Thing Principle).
      *   **Relevance to Allais:** **Indirect/Tangential.** The Allais choices *as typically presented* do not violate state-wise dominance or Savage's STP directly. The violation is of mixture independence, not state-wise comparisons. Prospect Theory satisfies state-wise dominance. However, the *intuition* behind the common Allais choice ("avoid the small chance of getting nothing when a sure gain is available") *resonates* with the spirit of caution embodied in state-wise reasoning, even if it doesn't formally violate it. Your mate might be *conflating* the intuition with the formal axiom.
      *   **Status:** **Near-Platitude / Strong Normative Requirement.** Violations (choosing something strictly worse in every possible outcome) are widely considered irrational. Savage's STP is a core normative axiom for his theory. *Substantive?* Yes, but its normative force is much stronger than mixture independence.

  4.  **Social Choice IIA (Arrow's Theorem):**
      *   **Definition:** The social preference between two alternatives A and B should depend *only* on the individual preferences between A and B, and *not* on preferences involving any other "irrelevant" alternative C. (E.g., whether society prefers Labour to Tory shouldn't depend on how individuals rank the Lib Dems).
      *   **Relevance to Allais:** **Completely Irrelevant Red Herring.** This is an axiom about aggregating *individual* preferences into a *social* preference ordering. It has no direct bearing whatsoever on the rationality of an *individual's* preferences over lotteries in the Allais paradox.
      *   **Status:** **Substantive requirement with specific implications (impossibility), context-specific.** Important in social choice theory, but a different beast entirely.

  5.  **Strong Context Independence (No Framing/Regret/Status Quo):**
      *   **Definition:** Preferences between A and B are inherent properties of A and B alone and are completely unaffected by how the choice is presented (framing), by alternatives not chosen (anticipated regret), or by a reference point (status quo bias).
      *   **Relevance to Allais:** **Highly Relevant, but Broader.** Allais choices *can* be influenced by framing (how the probabilities/outcomes are described). The common explanation (probability weighting, certainty effect) *implies* that context (especially the presence of certainty) matters. Prospect Theory explicitly incorporates reference dependence (status quo). This is a broader claim than just mixture independence, *encompassing* its violation as one symptom. Allais is a prime example *of* context dependence (the certainty of 1A being the key context).
      *   **Status:** **Descriptively false, normatively contested.** A huge body of evidence (Allais, framing effects, endowment effect) shows preferences are context-dependent. Whether this is *always* irrational is debated. Some argue rational agents *should* incorporate relevant context (e.g., status quo as reference). Calling it a "requirement" ignores descriptive reality. *Platitude?* No, it's an idealisation often violated by descriptively accurate models.

  **Summary of Allais' Bearing:**
  *   **Directly Violates:** (2) Mixture IIA / Independence Axiom (EU).
  *   **Illustrates/Implies:** (5) Strong Context Independence (specifically dependence on the "certainty" context).
  *   **Resonates With Intuition Behind, But Does Not Violate:** (3) Sure-Thing Principle (State-Wise Dominance).
  *   **Irrelevant:** (1) Menu IIA (though related to context effects), (4) Social Choice IIA.

  **Money Pumps & Dynamic Inconsistency:**

  *   **Your Intuition is Largely Correct:** Violating mixture independence **(2)** *by itself* does **not** necessarily lead to a money pump or dynamic inconsistency. Money pumps classically require *intransitivity* (A>B, B>C, C>A). Dynamic inconsistency typically requires time-inconsistent preferences (planning A at t1 but choosing B> A at t2).
  *   **How He *Might* Be (Partially) Right:**
      1.  **Combined with Other Factors:** If violating mixture independence leads to *intransitive* cycles in more complex choice sets, or interacts with *dynamic choice* where the "irrelevant" mixture branch becomes relevant later, a pump *might* be constructed. However, this isn't guaranteed solely by violating mixture independence.
      2.  **Via Context Dependence (5):** If preferences are strongly context-dependent (e.g., reference point shifts based on previous choices or menu), a clever exploiter *can* potentially set up a money pump. For example, if adding/removing an option changes your preference between A and B (violating Menu IIA (1)), a pump is straightforward (A chosen over B when C present, pay to remove C, then B chosen over A). Allais itself doesn't demonstrate this specific pump, but Prospect Theory's context dependence *could* make an agent vulnerable to such exploits *in principle*.
  *   **Conclusion:** Violating mixture independence **(2)** alone doesn't imply pumpability. However, the broader context dependence **(5)** inherent in explanations *for* that violation (like Prospect Theory) *can* create vulnerabilities to money pumps or dynamic inconsistencies, especially if it leads to menu effects (1) or reference point shifts over time. He's overgeneralising from the specific axiom violation to a broader vulnerability that isn't inherent to *just* that violation.

  **Is "IIA" a Misnomer for Allais?**

  *   **Yes, "Irrelevant Alternatives" is Misleading:** In the context of the Allais paradox and the mixture independence axiom **(2)**, the "irrelevant" element is **not an alternative (lottery) on the menu**. It's a **shared probability branch or consequence (`C` in the mixture `pA + (1-p)C` vs `pB + (1-p)C`)**. Calling it an "alternative" confuses it with Menu IIA (1). The core issue is the *linear treatment of probabilities* and the *separability of the common consequence*.
  *   **What's Really Going On (Prospect Theory View):** The standard explanation isn't primarily about an irrelevant alternative influencing choice, but about **non-linear probability weighting** combined with a **certainty effect**. In Choice 1, the certainty of £1M is overweighted compared to the 0.89 probability in 1B, making the small risk of £0 in 1B loom larger. In Choice 2, where certainty is absent, the 0.10 chance of £5M is weighted more highly relative to the 0.11 chance of £1M. The "irrelevance" is the shared branch (0.89 chance of £1M in Choice 1 / 0.89 chance of £0 in Choice 2), but the mechanism is how probabilities *attached to differing outcomes* are evaluated, not the branch itself being an alternative.

  **Key Takeaways for Your Group:**

  1.  **Demand Precision:** When your mate says "IIA", ask *which version* they mean. The conflation is the root of their overreach.
  2.  **Allais Targets Mixture Independence (2):** The paradox is *specifically* a challenge to the normative status of the EU independence axiom (mixture IIA). It is *not* primarily about menu effects (1) or social choice (4). It *illustrates* context dependence (5).
  3.  **Prospect Theory's Validity:** Dismissing Prospect Theory as "only descriptive" because it violates mixture independence **(2)** misses the point. Its goal *is* descriptive (and prescriptive in some contexts) of *how people actually evaluate risky choices*, which includes systematic violations of that axiom. Normative EU and descriptive PT answer different questions. Violating (2) doesn't make PT normatively void; it makes it descriptively accurate where EU fails.
  4.  **Money Pumps Aren't Automatic:** Violating mixture independence doesn't *by itself* make you pumpable. Broader context dependence *might*, but this needs specific demonstration, not blanket assertion.
  5.  **Terminology is Sloppy:** Calling the mixture axiom "independence of irrelevant *alternatives*" is unhelpful and misleading. It's about independence of irrelevant *consequences* or *linearity in probabilities*.

  Focus the discussion on whether mixture independence **(2)** is truly a *normative* requirement in light of the strong, consistent intuition driving the Allais pattern, and whether models that violate it (like PT) can offer valid prescriptive insights despite that violation. That's the heart of the debate. Your mate is using a slogan to bypass this substantive discussion.
