  Question as it would appear on the problem set:

  ---

  **Question 3: The Sunk Cost Fallacy Revisited** (20 marks)

  Consider the following scenario:

  > You are a rational agent considering whether to continue a project. You have already spent a large sum of money on it. The following are true:
  > - You know with certainty that the future costs of continuing the project exceed its future benefits (i.e., the net continuation value is negative).
  > - The resources you have already spent carry no information about the project or your prior reasons for undertaking it. They are pure sunk costs.
  > - No one else is observing your decision, so there is no signaling to rivals, predators, or potential mates.
  > - Your decision will not set a precedent that affects future decisions of any copy of you (including your future selves in a multi-self model), because either you do not have such copies or they will not be influenced by this decision.

  Despite these stipulations, you might still feel a pull to continue due to the sunk costs. Is it ever rationally permissible, in this scenario, to continue the project? Why or why not?

  In your answer, address the following:

  a) What kind of claim is the sunk cost principle? For example, is it a theorem derived from fundamental axioms (and if so, which ones), an empirical generalization, or something else?
  b) Under what conditions (if any) could an agent or decision procedure that honors sunk costs be rationally permissible? Specifically, what would have to be true about the agent's preferences or the structure of the decision problem for honoring sunk costs to be defensible?

  ---

  **Model Answer** (approx. 700-900 words):

  The sunk cost principle is a fundamental tenet of rational choice theory. It asserts that only incremental (marginal) costs and benefits of current and future actions should influence decisions; past costs that are irrecoverable (sunk) are irrelevant. This principle is often presented as a direct consequence of the axioms of expected utility theory, particularly the separability of utility across time and states of the world. However, the scenario presented here strips away the typical escape routes (informational, signaling, and commitment rationales), forcing us to confront the principle's foundations.

  **a) The nature of the sunk cost principle**

  The sunk cost principle is best understood as a theorem that falls out of the standard normative model of rational choice: expected utility theory (EUT). EUT assumes that an agent's preferences are complete, transitive, and continuous, and satisfy the independence axiom (for decisions under uncertainty). Crucially, the utility function is separable: the utility of a sequence of outcomes is the sum (or integral) of utilities of individual outcomes, discounted appropriately. This separability implies that the utility of future outcomes does not depend on past outcomes. Therefore, when making a decision at a given time, only the future consequences matter.

  In the context of time, the principle also relies on the assumption of dynamic consistency: the agent's preferences over future actions remain consistent over time. The standard model of exponential discounting ensures this. Thus, the sunk cost principle is a direct corollary of these assumptions. If we accept EUT and exponential discounting as the normative standard, then honoring sunk costs is irrational.

  However, we must note that the sunk cost principle is not an empirical generalization. While it is true that people frequently fall prey to the sunk cost fallacy (continuing investments due to past costs), this does not establish the principle's normative status. The principle's normative force comes from the underlying axioms. If an agent violates the principle, they are violating one of the core axioms of EUT (e.g., by having non-separable preferences).

  **b) Conditions under which honoring sunk costs might be permissible**

  Even within a broadly rational framework, we can imagine scenarios or agent types where honoring sunk costs is permissible. This requires relaxing some of the standard assumptions.

  1. **Non-separable preferences**: The standard model assumes that utility is additive over time. But if an agent has non-separable preferences, then past costs might directly affect the utility of future outcomes. For example, an agent might have a preference for narrative coherence or closure. Abandoning a project after a large investment might cause psychological distress (a "wasted effort" feeling) that is not captured in the project's future costs and benefits. In such a case, the disutility from the feeling of waste might outweigh the negative net continuation value. However, this requires that the agent's utility function includes such non-separable terms. But note: in the standard model, this feeling would be a consequence of continuing or not, and thus should be included in the future consequences. The stipulation that the agent knows the continuation value is negative might already include such psychological costs? We must be cautious.

     The scenario says the continuation value is negative and known with certainty. But if the psychological cost of quitting is a future consequence (i.e., it occurs after the decision), then it should be part of the continuation value. The stipulation must be interpreted as having accounted for all such consequences. Therefore, to allow for non-separable preferences, we must consider that the agent's utility function violates the standard separability. For instance, the utility of a path might depend on the entire history. Then the sunk cost might matter because it changes the interpretation of the whole endeavor. For example, completing the project might turn a history of high expenditure into a story of "perseverance leading to eventual success" (even if the project itself is a net loss, the overall narrative might be positive). This is a form of history-dependent utility.

  2. **Alternative decision procedures**: Rationality is sometimes defined procedurally rather than substantively. If an agent follows a decision procedure that, in the long run, leads to good outcomes but sometimes honors sunk costs, it might be deemed rational. For instance, cognitive resources are limited. An agent might use a rule of thumb: "never abandon a project once started". Such a rule might be optimal in a broader ecological context (where the costs of re-evaluating every project are high) even if it occasionally leads to sunk cost fallacies. But note: in this scenario, the agent is in a one-shot decision with no precedent. So this ecological rationale is ruled out by the stipulations.

  3. **Agents with non-standard discounting**: If the agent discounts the future hyperbolically, they might be dynamically inconsistent. However, the scenario stipulates that no future self will be influenced by the precedent. Moreover, hyperbolic discounting doesn't directly justify sunk costs; it explains procrastination and abandonment, not persistence.

  4. **Regret and counterfactuals**: The agent might experience regret if they abandon the project. Regret is a feeling that arises from comparing the actual outcome to what might have been. If the agent abandons, they might regret having spent the money for nothing. But if they continue, they avoid that regret (though they incur further losses). However, regret is a future psychological cost. The scenario states that the continuation value is negative and known with certainty, which should include the expected regret. So we cannot reintroduce it.

  Therefore, the only robust way to defend honoring sunk costs in this scenario is to reject the separability of utility. The agent must have preferences that are inherently history-dependent. For example, the agent might have a utility function of the form:

     U(history) = ... + f(past costs, current outcome)

  where f is a function that gives positive utility for not "wasting" the past costs. This is a non-standard preference, but if the agent has it, then acting to maximize U would require considering the sunk costs.

  However, we must then ask: are such preferences rational? The standard view is that they are not, because they lead to dynamic inconsistency and money-pump arguments. But if we allow that rationality is defined relative to an agent's preferences, then an agent with such preferences is rational to honor sunk costs. This is a subjectivist view of rationality.

  In conclusion, under the strict stipulations of the scenario, the sunk cost principle is a theorem of standard rational choice theory. Violating it implies either irrationality or a departure from the standard axioms (like separability). Honoring sunk costs is permissible only if the agent's preferences are non-separable and assign intrinsic value to not abandoning past investments. But such preferences are vulnerable to dynamic inconsistency and might be considered irrational by the standards of EUT.

  ---

  **Marking Scheme** (20 marks total, with 5 must-hit moves):

  1. **Identify the sunk cost principle as a theorem of expected utility theory (EUT) and explain the key assumptions (separability, dynamic consistency) that underpin it.** (4 marks)  
     *Typical mistake: Describing it as merely an empirical observation or a heuristic without grounding in normative theory.*

  2. **Acknowledge that the scenario rules out informational, signaling, and commitment rationales for sunk costs.** (4 marks)  
     *Typical mistake: Silently reintroducing one of these channels (e.g., by suggesting that quitting might signal weakness to unseen observers or that it might set a bad precedent for oneself).*

  3. **Consider the possibility of non-separable (history-dependent) preferences as the only viable escape within the constraints.** (4 marks)  
     *Typical mistake: Proposing psychological costs (like regret) without recognizing that these are future consequences and should be included in the continuation value (which is stipulated to be negative).*

  4. **Discuss the status of rationality for an agent with non-separable preferences (e.g., subjectivist vs. objectivist views).** (4 marks)  
     *Typical mistake: Assuming that any preference is rational by definition (subjectivist) without addressing the potential for dynamic inconsistency (money pump arguments).*

  5. **Conclude clearly whether it is permissible (only under non-standard preferences) and why, while respecting the stipulations.** (4 marks)  
     *Typical mistake: Concluding that it is never permissible without engaging with the possibility of non-separable preferences, or concluding that it is permissible without a rigorous rationale that respects the constraints.*

  This marking scheme ensures that students engage with the foundational issues and avoid common pitfalls.
