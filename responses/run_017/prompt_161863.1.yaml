  We are constructing a problem set question on the sunk cost fallacy that avoids the standard escape hatches. The scenario must stipulate away:
  - The informational value of the expenditure (the agent knows with certainty that continuation value is negative, and the spent resources carry no information about anything).
  - Signaling to others (no one else is observing).
