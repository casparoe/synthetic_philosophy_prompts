  ### Problem Set Question:  
  **Question 3: The Sunk Cost Fallacy at its Limits** (20 marks)  

  *Background*: The sunk cost fallacy occurs when past investments (time, money, effort) influence ongoing decisions despite having no bearing on future outcomes. Standard critiques argue that only *forward-looking* consequences matter. However, escape hatches exist: sunk costs may signal private information, deter predators, or serve as commitment devices.  

  *Scenario*:  
  > You are deciding whether to continue a project after spending $1M. The following hold with certainty:  
  > - **Continuation value is negative**: Future costs exceed future benefits by $200K.  
  > - **No information value**: The $1M expenditure reveals *nothing* about the project’s value, your past judgment, or external factors.  
  > - **No observers**: No rivals, allies, or third parties will ever learn of your decision.  
  > - **No precedents**: You have no future selves (or identical copies), and even if you did, they would *not* be influenced by this choice.  
  >  
  > You feel compelled to continue "to avoid wasting the $1M." Is this rationally permissible? Why or why not?  

  *Your task*:  
  1. **Characterize the sunk cost principle**: What *type* of claim is it? Is it a deductive theorem (and if so, from which axioms?), an empirical observation, or something else?  
  2. **Assess permissibility**: Could honoring sunk costs *ever* be rational here? If so, what must be true of the agent’s preferences or decision structure? If not, why?  

  Address the scenario’s constraints explicitly. Avoid reintroducing information, signaling, or commitment effects.  

  ---

  ### Model Answer (approx. 800 words):  

  The sunk cost principle—that past costs should not influence ongoing decisions—is widely treated as a normative rule of practical rationality. Under the scenario’s strict constraints, honoring sunk costs appears indefensible. Yet this conclusion rests on implicit assumptions about preference structures. I argue the principle is a *theorem* derivable from axioms of dynamic consistency and utility separability. Honoring sunk costs becomes permissible only if agents violate these axioms, adopting non-separable or history-dependent preferences. However, such agents risk dynamic inconsistency, challenging standard rationality frameworks.  

  **(1) The sunk cost principle as a theorem of separability**  
  The principle is not merely empirical or heuristic; it is a deductive consequence of expected utility theory (EUT). EUT assumes preferences satisfy axioms like *completeness*, *transitivity*, and *dynamic consistency*. Critically, it enforces *separability*: utility is additive across time and states. Future utility depends solely on future outcomes, not past expenditures. For example, in a deterministic choice, total utility \(U\) over time \(t\) is:  
  \[  
  U = \sum_{t} u(x_t)  
  \]  
  where \(x_t\) is consumption at time \(t\). Sunk costs (e.g., \(x_0 = -\$1M\)) are fixed. Continuing the project adds \(x_1 = -\$200K\), so \(U\) decreases by \(u(-\$200K)\). Quitting adds nothing, leaving \(U\) unchanged. Thus, continuing is strictly dominated.  

  This separability extends to stochastic settings via the *sure-thing principle*: if two acts yield identical outcomes in some states, decisions should depend only on states where outcomes differ. Here, the "$1M spent" state is identical for both choices, so it is irrelevant. Only the differential future outcomes (continue: \(-\$200K\) vs. quit: \(\$0\)) matter. The sunk cost principle thus emerges as a *theorem* from EUT’s foundations.  

  **(2) Permissibility requires abandoning separability**  
  Under the scenario’s constraints, honoring sunk costs cannot be justified by signaling, information, or commitment. Continuation value is negative and certain, eliminating Bayesian updates. No observers or future selves exist, precluding reputation or precedent effects. The sole avenue for permissibility is if the agent’s utility function violates EUT separability, making utility *history-dependent*. Consider two cases:  

  - **Non-separable preferences over sequences**: Standard EUT treats utility as a separable sum. But if the agent evaluates entire *sequences* holistically, past costs may interact with future outcomes. For instance, completing a project might "redeem" prior losses, yielding utility \(v(\text{\$1M loss}, \text{completion})\). Formally:  
    \[  
    U = f(\text{past costs}, \text{future outcomes}) \quad \text{where} \quad f \text{ is non-additive}.  
    \]  
    Quitting might then induce psychological costs (e.g., shame) not captured in future cash flows. However, the scenario stipulates continuation value *includes all consequences*—implying \(v(\text{quit}) = u(\text{psychological cost}) + u(\$0)\) is already embedded in the \(-\$200K\) net value. For non-separable utility to "rescue" sunk costs, we must interpret continuation value narrowly (e.g., as monetary), while allowing hidden non-separability in the agent’s psychology. This demands an explicit model of history-dependent utility, such as:  
    \[  
    U(\text{continue}) = \alpha \cdot (\text{\$1M loss}) + \beta \cdot (\text{\$200K loss}) + \gamma \cdot (\text{continuation pride})  
    \]  
    where \(\gamma > 0\) offsets financial losses. Crucially, \(\alpha\), \(\beta\), and \(\gamma\) reflect *intrinsic* preferences, not information or signaling.  

  - **Procedural rationality and rule-based agents**: An agent might follow a categorical rule ("finish what you start") that ignores separable utility. This could be optimal if cognitive costs outweigh error margins (e.g., re-evaluating projects is costly). But the scenario is a one-shot, costless decision, voiding this defense. Rule-based permissibility requires relaxing the rational actor model entirely, treating sunk costs as inputs to a non-utility-maximizing algorithm.  

  **(3) Challenges for non-separable preferences**  
  While history-dependent preferences permit sunk costs, they face normative challenges. Agents with non-separable utility are vulnerable to *dynamic inconsistency* and money pumps. For example, if abandoning a project after $1M spent causes disutility, but abandoning after $1.1M spent causes *more* disutility, the agent may pay to avoid earlier abandonment—yet later regret continuing. Such preferences violate the *independence of irrelevant alternatives* and open exploitation avenues.  

  Ultimately, the sunk cost principle is a *contingent* theorem: it holds iff agents have separable preferences. Under the scenario, honoring sunk costs is permissible only for agents who intrinsically value history-laden outcomes—but this violates standard rationality axioms. Empirical work shows humans often have such preferences, exposing a rift between descriptive psychology and normative EUT.  

  **Conclusion**: In the stipulated scenario, honoring sunk costs is irrational *if* rationality requires separable utility and dynamic consistency. However, for agents who derive utility from narrative coherence (e.g., "completing the story") or loss-aversion over sequences, sunk costs may rationally matter. This reveals the principle as a useful heuristic for separable agents, not a universal law.  

  ---  

  ### Marking Scheme (20 marks total):  
  **Must-hit moves** (each scored 0–4 marks; allocate partial credit proportionally):  

  1. **Identify the sunk cost principle as a theorem of EUT** (4 marks)  
     *Key:* Derive it from separability (e.g., additive utility, sure-thing principle) and dynamic consistency.  
     *Common error:* Calling it an "empirical claim" or "heuristic" without referencing axiomatic foundations.  

  2. **Acknowledge scenario constraints explicitly** (4 marks)  
     *Key:* Note that information, signaling, and commitment are excluded by stipulation.  
     *Common error:* Reintroducing hidden information ("maybe past you knew something") or signaling ("quitting might feel weak").  

  3. **Argue non-separable preferences are the only viable escape** (4 marks)  
     *Key:* Explain how history-dependent utility (e.g., sequence-based preferences) could rationalize sunk costs without violating constraints.  
     *Common error:* Citing psychological costs (e.g., regret) without modeling them as *intrinsic* non-separability, or confusing "irrational" with "I wouldn’t do it."  

  4. **Discuss normative challenges for non-separable preferences** (4 marks)  
     *Key:* Highlight dynamic inconsistency/money-pump risks when preferences aren’t separable.  
     *Common error:* Asserting non-separable preferences are "always irrational" without engaging why they conflict with EUT.  

  5. **Conclude with a nuanced stance on permissibility** (4 marks)  
     *Key:* Conditionally permit sunk costs for non-separable agents while noting EUT violations.  
     *Common error:* Absolute claims ("always irrational" or "always permissible") without tying to preference structures.  

  **Word limit**: No penalty for brevity, but answers missing ≥2 moves capped at 12/20.
