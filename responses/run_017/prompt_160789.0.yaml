  1. **Groups:** Break the class into groups of 5 or 6 (so about 4 groups). Each group runs their own auction simultaneously.
  2. **Private Values:** Assign each player in a group a private value. You can do this by preparing sealed envelopes for each group, each containing slips of paper with the private values. Alternatively, use an app or a website if available, but for simplicity, we'll assume paper.

     *How to assign values:*
     - In each group, assign one player a very high value (e.g., 200 cents = $2.00), two players a medium value (e.g., 150 cents = $1.50), and the rest a low value (e.g., 50 cents). Adjust the numbers so that in a group of 5: one 200, two 150, two 50. In a group of 6: one 200, two 150, three 50.
     - The idea: The high-value player (200) can rationally bid up to 200 cents (and even above, though that would be irrational) because they value the prize more. The medium players (150) might get trapped if they bid above their value, and the low players (50) are likely to be the ones who might bid very little or not at all, but if they get drawn in, they can be trapped easily.

