  **Game Design: The Private Value Dollar Auction (PVD Auction)**

  **Overview:**
  - The auction is for a single prize (e.g., a token that can be redeemed for a small prize, like a candy bar or extra credit points worth $1). However, each player has a private value for the prize, which may be higher or lower than the nominal value.
  - The auction rules: 
    - The highest bidder wins the prize and pays their bid.
    - The second-highest bidder also pays their bid but gets nothing (this is the standard dollar auction rule to create the trap).
  - The twist: Each player is assigned a private value for the prize. This value is what the prize is worth to them. If they win, their profit is (private value - bid). If they are the second-highest bidder, they lose their bid and get nothing. Others pay nothing.

