          - Ask: were there moments when you felt trapped? When you knew you should stop but kept going?
          - Map to the three situations:
            (1) The pure trap: once you are the second-highest, you might bid again to avoid losing your bid. But then you become the highest and risk even more. Example: a player with value 50 who gets caught as second-highest at 40. They might bid 45 to become the high bidder, hoping to win and lose only 5 (if value is 50) but then the other bids 50 and they become second-highest again at 45, so they lose 45. Then they might bid 55, but value is 50, so they would lose 55 if they win? This is irrational. So they are trapped: they lost 45 already and by bidding 55 they would lose even more. But the sunk cost fallacy might make them do it.

            (2) The case of throwing good money after bad: a player with value 150 who has bid up to 140 and is now the second-highest at 140. The high bidder is at 145. They might bid 150 to win. Then they break even. But if they bid 150 and win, they break even. But if the high bidder has a value of 200, they might bid 155, then the player with 150 would have to drop and lose 140. So they might bid 150 and then if the other bids 155, they are trapped and have to decide whether to bid 160 (which is above their value) or drop and lose 150. This is the trap.

            (3) The rational escalation: the player with value 200. They can bid up to 200 and still break even. They might even bid 201 and lose 1 if they win, but that's a small loss compared to the runner-up who might lose a lot. But note: if they are the high bidder at 190 and the second-highest is at 185, then if they drop, they lose 185. If they bid 195, they might win and pay 195 (and make 5) or they might be outbid and then they would lose 195? No, if they are outbid, they become the second-highest and would pay their last bid of 195? But wait, in our rules, the second-highest is the last bid they made? 

            In our auction procedure, if the high bidder is A at 190, second-highest is B at 185. Then if A drops out (by not bidding at 195), then B would become the high bidder at 185 and win, and A would become second-highest at 190? But A didn't bid at 195, so they dropped out. So they become the second-highest and pay 190. That's a huge loss. So A is trapped: they must bid 195 to avoid paying 190 and getting nothing. Then they are the high bidder at 195, and B is second-highest at 190? But then if B drops at 195, then B would pay 190. But if B bids 200, then A becomes second-highest and pays 195, and B wins and pays 200.

            This is the trap: once you are the second-highest, dropping out means you lose your bid. So you have an incentive to continue even if it means bidding above your value. 

        - The key point: 
            (1) Pure trap: the rules of the auction (second-highest pays) create a situation where it is locally rational to continue bidding to avoid a sure loss, even though it leads to a deeper trap.
            (2) Throwing good money after bad: when you continue bidding past the point where the expected value is negative and there's no new information. But in this auction, there is always the hope that the other will drop out, so it's not exactly without new information. 
            (3) Rational escalation: when you have a high private value, it is rational to bid up to that value.

        - In the auction, it's hard to distinguish (1) and (2) because of the uncertainty about others' values. But (3) is clearly different.

      **What will go wrong:**
        - Non-bidders: Some players, especially low-value ones, may never bid. That's fine and expected.
        - Collusion: Players might try to collude to keep bids low. Discourage this by reminding them they have private values and it's an individual decision. Also, the auction format (open outcry) makes collusion hard.
        - Fast groups: Some groups may have the high-value player bid aggressively and win quickly. That's okay. They can run a second auction if time permits? Or they can observe other groups.
        - Slow groups: If a group is taking too long, the auctioneer can increase the increment size. Or you can impose a time limit per bid (e.g., 10 seconds per price level).
        - Student bids a dollar immediately: In our auction, they can bid at 100 (if we start at 10 and go by 10, then 100 is possible). But if someone bids high early, then it might deter others. That's a rational strategy for a high-value player. But note that the second-highest bidder would still pay, so if only one bids at 100, then there is no second-highest, so they win and pay 100 and no one else pays. That's not trapping anyone. But if two bid at high levels, then the second-highest might be high. 

      **What the game can't reproduce:**
        - In real organizations, the endpoint is not clear, and the costs are not just monetary (reputation, face-saving). 
        - The goal might shift during the project (escalation of commitment to a failing course of action because the definition of success changes).
        - There is no clear auction structure. Instead, decisions are made in an environment of ambiguity and with many parties involved.

      **Debrief supplement:**
        - Highlight that in real life, the three situations are often indistinguishable in the moment. 
        - The sunk cost fallacy arises when people confuse situation (2) with (1) or (3). 
        - Also, in organizations, the costs of abandoning a project include reputational costs and the admission of failure, which are not present in the auction. These can make it even harder to walk away.

      **Logistics for the session (75 minutes):**
        - 0-10 min: Introduction and prediction sheet.
        - 10-15 min: Assign groups and private values, explain rules.
        - 15-45 min: Run auctions (30 minutes). 
          - Each group runs one auction. If a group finishes early, they can discuss among themselves or watch others.
        - 45-75 min: Debrief (30 minutes).

      **Materials to prepare:**
        - Prediction sheets (22 copies).
        - Private value assignments for 4 groups (each group: 5 or 6 slips of paper with private values: one 200, two 150, two (or three) 50).
        - Auction record sheets for auctioneers (one per group).
        - A timer.

      **Rules explanation to students:**
        - "In this auction, we are selling a prize that is worth 100 cents to me, but each of you has a private value for it (written on your slip). You may not reveal your private value until after the auction."
        - "The auction will be conducted in increasing bids. The auctioneer will start at 10 cents and then go to 20, 30, ... up to 200 cents. At each price, the auctioneer will ask for a bidder at that price. You may bid by raising your hand or saying 'bid'. The auctioneer will select one bidder at that price to be the high bidder."
        - "The rules: 
            - The highest bidder at the end wins the prize and pays the amount they bid.
            - The second-highest bidder (the last one to be outbid) also pays the amount they bid but gets nothing.
            - If at a price, no one bids, the auction ends immediately: the current high bidder wins and pays their bid, and the current second-highest bidder pays their bid.
            - Once you drop out (by not bidding at a price), you cannot re-enter."
        - "You start with 200 points. Your profit is:
            - If you win: (your private value - your bid) 
            - If you are the second-highest: (0 - your bid)
            - Otherwise: 0
          We will convert points to a small prize at the end, so try to maximize your points."

      **Adjustment for time:**
        - If a group is going slowly, the auctioneer can skip prices (e.g., go from 10 to 20 to 30) without taking bids in between. But then bidders might drop out in between without being recorded. So it's better to call every 10 cents.

      Let's hope it works! Good luck.
answer: |-
  Here's a redesigned escalation exercise tailored to your constraints and learning objectives, incorporating private values and simultaneous group play to create ambiguity between rational escalation and the sunk cost trap. The activity forces students to confront the three situations you outlined without prior signaling.

  ---

  ### **Game Design: "The Mystery Box Auction"**
  **Core Mechanics:**  
  - Groups of 4-5 bid on a "mystery box" (a sealed envelope with a token prize inside, e.g., "Winner gets 5 extra credit points").  
  - Each player receives a **private value** (PV) for the box, unknown to others. PVs range from 50-200 points, with one high-value player per group.  
  - **Bidding rules:**  
    - **Winner pays bid + receives PV** (profit = PV - bid).  
    - **Runner-up (2nd-highest bidder) pays half their bid + gets nothing** (loss = -0.5 × bid).  
    - Other players lose nothing.  
    - Bids increase in **10-point increments**, starting at 10.  
  - **Time limit:** 10 minutes per auction round.  

  **Why this works:**  
  - Runner-up pays a *partial* penalty (not full bid), reducing early deterrence while preserving escalation incentives.  
  - Asymmetric PVs create ambiguity: Bidders can’t distinguish between a trapped player vs. a high-PV player escalating rationally.  
  - Partial penalty mirrors real-world "soft" costs (reputation, effort) without full financial ruin.  

  ---

  ### **Setup & Materials**  
  1. **Group Assignment:**  
     - Divide 22 students into 5 groups of 4-5.  
     - Assign one student per group as **Auctioneer** (manages bids/timer; doesn’t bid).  

  2. **Private Values (PVs):**  
     - Prepare sealed envelopes for each group:  
       - **Group of 4:** PVs = 200, 150, 100, 50  
       - **Group of 5:** PVs = 200, 150, 150, 100, 50  
     - *Rationale:* One player (PV=200) can escalate rationally; others risk crossing their PV threshold. High density of mid-PV players (150) creates traps.  

  3. **Bidding Sheets:**  
     - Provide each bidder with:  
       - **Private Value Card** (e.g., "Your PV: 150 points").  
       - **Bid Tracker** (table to log bids during auction).  
     - Provide Auctioneers with:  
       - **Group Bid Board** (paper to display current highest bid + bidder).  
       - Timer (phone/app).  

  4. **Tokens & Costs:**  
     - Use **"points"** (not real money). Each student starts with 200 points.  
     - After the auction, profits/losses convert to small prizes (e.g., winner with most points gets candy).  

  ---

  ### **Rules & Instructions to Students (5 mins)**  
  **Frame neutrally:** "Today we’re simulating competitive bidding for a mystery prize. Your goal is to maximize points."  
  1. **PVs are secret:** Do not reveal your value.  
  2. **Bidding:**  
     - Auctioneer starts at 10 points. Any bidder can bid 10.  
     - Next bid must be +10 points (e.g., 20, 30...).  
     - Bid by announcing: *"[Name] bids [X]."* Auctioneer updates Bid Board.  
  3. **Dropping out:** You may drop out anytime (say *"[Name] out"*). Once out, you cannot re-enter.  
  4. **End condition:**  
     - Auction ends when:  
       - Only one bidder remains (winner), OR  
       - Time expires (highest bidder wins, runner-up is 2nd-highest).  
     - Winner gets PV minus bid; runner-up loses half their bid.  

  ---

  ### **Prediction Sheet (5 mins)**  
  Students complete **before** PVs/groups assigned:  
  1. "In a 5-player auction, how high will the winning bid go? Why?"  
  2. "Would you bid if you knew the prize was worth *less* than you might pay? Explain."  
  3. "Describe a situation where continuing to bid is smart, and one where it’s foolish."  

  ---

  ### **Running the Activity (30 mins)**  
  - **Simultaneous play:** All 5 groups run auctions concurrently.  
  - **Auctioneer role:**  
    - Enforces bid increments (+10 only).  
    - Updates Bid Board publicly.  
    - Announces: *"New bid: [X] by [Name]. Next bid: [X+10]."*  
    - Calls time at 10 mins.  
  - **Your role:**  
    - Circulate, listen, and note escalatory language (e.g., *"I can’t drop now!"*).  
    - **Intervene only for rule violations.**  

  ---

  ### **Debrief Framework (30 mins)**  
  **Start with observations:**  
  - *"Group 3’s winning bid was 170. Winner, what did you feel when bids passed 100?"*  
  - *"Runner-up, why did you stay in past 80 points?"*  

  **Map to three situations using group data:**  
  1. **The Pure Trap (Situation 1):**  
     - *Example:* A PV=100 player bids 110. If they win, they lose 10; if they drop, they lose 5 (half of 100, their last bid).  
     - **Key point:** "Once you’re the runner-up, continuing *feels* rational because dropping guarantees a loss. The error was entering at all."  

  2. **Sunk Cost Fallacy (Situation 2):**  
     - *Example:* A PV=150 player bids 160+ despite no new information (e.g., others dropping out fast).  
     - **Key point:** "Escalating here is *throwing points away*—you’re paying more than the prize is worth *to you*, and no new info justifies it."  

  3. **Rational Escalation (Situation 3):**  
     - *Example:* PV=200 player bids 190, wins, and nets 10 points.  
     - **Key point:** "They escalated because their PV justified it. Outsiders couldn’t tell if they were trapped or rational—just like real life."  

  **Critical distinction:**  
  - *"In (1) and (3), continuing is locally rational. But (1) is part of a globally irrational plan, while (3) is sound. (2) is irrational locally and globally. Real escalation often masks which is which."*  

  **Real-world gaps to highlight:**  
  - "In organizations, the 'prize' shifts (e.g., from profit to saving face), endpoints are fuzzy, and walking away costs social capital. This game *can’t* simulate that—it only shows the cognitive trap."  
  - "Use this as a lens: When you’re escalating, ask: *Am I the PV=200 player, or am I trapped?* Often, you won’t know."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Non-bidders:**  
     - *Likely:* Low-PV players (50/100) refusing to bid.  
     - **Solution:** Debrief their rationale: *"Why did you avoid bidding? Was this part of a strategy?"* Normalize non-participation as rational.  

  2. **Colluders:**  
     - *Risk:* Players teaming up (e.g., *"You win this round, I’ll win next"*).  
     - **Solution:** Assign new groups/PVs for a second round if time. Ask: *"Could you trust allies in real life? What if PVs are hidden?"*  

  3. **Fast vs. slow groups:**  
     - *Fast:* Groups with aggressive high-PV bidders end in 2 mins.  
     - **Solution:** Run a **second auction** with the same group but reshuffled PVs.  
     - *Slow:* Groups stuck at high bids.  
     - **Solution:** Announce: *"Final bid in 60 seconds—no new bids after."*  

  4. **$1-equivalent bid:**  
     - *Risk:* A player bids 200 immediately.  
     - **Outcome:** They win if no one bids. Profit = PV - 200. If PV=200, they break even; if PV<200, they lose. Runner-up pays half their last bid.  
     - **Debrief angle:** *"Did preempting work? Who was harmed?"*  

  5. **"Performative" self-awareness:**  
     - *E.g.,* *"I know this is a trap, but..."*  
     - **Solution:** Note this during debrief: *"Why did you continue even when self-aware? What does that say about real-world escalation?"*  

  ---

  ### **Why This Addresses Your Goals**  
  - **Ambiguity achieved:** Players can’t discern if an escalator is trapped (Situation 1), irrational (Situation 2), or high-value (Situation 3).  
  - **Emotional pull preserved:** Partial runner-up penalty creates tension without paralyzing bidders. Points feel consequential (especially with prizes).  
  - **Credibility:** Student auctioneers + hidden PVs reduce suspicion of faculty manipulation.  
  - **Efficiency:** Works in 30 mins with simultaneous groups.  

  **First-run tip:** Do a 1-minute practice round with open bids (no PVs) to demo mechanics. This prevents confusion from overshadowing escalation dynamics.
