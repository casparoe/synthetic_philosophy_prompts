answer: |-
  Below is a written fixed-price bidding procedure designed for project leads (strong engineers without stats training). It addresses reference class gerrymandering via a second-order check, enforces epistemic modesty through built-in range width rules, and includes clear escalation/dead stops. The entire process takes ≤30 minutes and requires no formulas, only documented reasoning and historical data lookup.

  ---

  ### **Fixed-Price Bid Procedure**  
  *Purpose: Avoid losses from underestimated fixed-price bids. Timebox: 30 min. Document every step.*

  #### **Step 1: Define Scope & Constraints (5 min)**  
  - **Action:** Write a 3-sentence description of the project’s core deliverables, key unknowns, and client-imposed constraints (deadlines, tech, etc.).  
  - **Adequate Answer:** Clear boundaries (e.g., "Migrate X records from System A to B by date Y; client provides schema docs; no API changes").  
  - **Stop/Handoff:** If scope is ambiguous (e.g., "build an AI tool" with no specs), **stop and decline fixed-price**.  
  - **Gerrymandering Guard:** Forces specificity before reference-class selection.

  #### **Step 2: Reference Class Selection (5 min)**  
  - **Action:** Pull effort (person-days) for past projects matching **ALL THREE** criteria:  
    1. Same *type* (e.g., "data migration," "API integration").  
    2. Similar *size* (±30% of this project’s expected scale).  
    3. Similar *complexity* (e.g., "legacy system," "no docs," "third-party API").  
  - **Adequate Answer:** ≥5 projects meeting all criteria. If <5, proceed to Step 4.  
  - **Stop:** If no projects match the type, **stop and decline fixed-price** (no historical basis).  
  - **Gerrymandering Guard:** "Same type + size + complexity" is the *broadest defensible class*. No niche subclasses (e.g., "Rails upgrades with staging") unless they meet all three criteria.  

  #### **Step 3: Second-Order Reference Check (5 min)**  
  - **Action:** For the reference class from Step 2:  
    - Calculate the **80th percentile effort** (sort efforts low→high; pick the value at 80% of the list).  
    - Calculate the **historical error ratio**: (Actual effort of past projects) / (Estimated effort).  
  - **Adequate Answer:**  
    - 80th percentile effort (e.g., "50 days").  
    - Average error ratio (e.g., "Past estimates were 1.3× too low"). If no estimates, skip.  
  - **Handoff:** If the average error ratio >1.5× (i.e., consistent underestimation), **escalate to partner**. The firm’s bias matters more than the project’s facts.  
  - **Gerrymandering Guard:** Checks if your reference class is predictive. High error ratio = class is flawed.

  #### **Step 4: Adjustment for Differences (5 min)**  
  - **Action:** List differences between this project and the reference class. For each:  
    - Assign an **effort multiplier** (0.5–2.0) and **confidence** (High/Medium/Low).  
    - Multiplier must be justified by *written evidence* (e.g., "Client has docs → 0.8× multiplier; High confidence because docs reduced effort in 3 past migrations").  
  - **Adequate Answer:** ≤3 adjustments. Multipliers must be:  
    - **High confidence**: 0.8–1.2× (strong evidence).  
    - **Medium**: 0.7–1.4× (some evidence).  
    - **Low**: 0.5–2.0× (gut feeling).  
  - **Handoff:** If any multiplier is Low confidence, **escalate to partner**. Uncertainty is too high for solo call.  

  #### **Step 5: Calculate Range & Decision (5 min)**  
  - **Action:**  
    - **Baseline:** Start with 80th percentile effort from Step 3 (if reference class exists).  
    - **Apply adjustments:** Multiply baseline by all Step 4 multipliers → **"Adjusted Effort."**  
    - **No reference class?** Use effort from Step 6 instead.  
    - **Range:** Adjusted Effort × 0.75 (low) to Adjusted Effort × 1.5 (high).  
  - **Rules:**  
    - If range width ([high] – [low] / [low]) **≤50%**: Bid the *high* number (e.g., range 20–30 days → bid 30).  
    - If range width **>50% but ≤100%**: **Escalate to partner** (risk tolerance call).  
    - If range width **>100%**: **Decline fixed-price** (offer time-and-materials).  
  - **Epistemic Modesty:** Wide ranges = hard stop. Forces "unknown unknowns" into the open.

  #### **Step 6: No Reference Class Fallback (5 min)**  
  - **Action (if no class in Step 2):**  
    - Break project into 3–5 high-level tasks.  
    - Estimate each task as Low/Medium/High effort using a **predefined lookup table** (see below).  
    - Sum the efforts → **"Fallback Effort."** Use this for Step 5’s baseline.  
  - **Lookup Table (example):**  
    | Task Type          | Low (days) | Medium (days) | High (days) |  
    |--------------------|------------|---------------|-------------|  
    | Data migration     | 5–10       | 10–20         | 20–40       |  
    | API integration    | 3–7        | 7–14          | 14–28       |  
    | LLM/ML component   | 10–20      | 20–40         | 40–80       |  
    | UI build           | 5–15       | 15–30         | 30–60       |  
  - **Adequate Answer:** All tasks mapped to table; no "unknown" tasks.  

  #### **Step 7: Final Bid Approval (≤5 min)**  
  - **Action:** If Steps 1–6 allow a bid, document:  
    - Reference class (or "none"), adjustments, range, and bid amount.  
    - Partner signs off if escalated.  
