answer: |-
  **MEMORANDUM**  
  **To:** Halverston Trust Grants Committee  
  **From:** [Your Name], Public Member  
  **Date:** 12 October 2023  
  **Subject:** Allocation of £1.8m Restricted Bequest for Prevention/Relief of Suffering in Animals Used for Food  

  ### **I. Recommendation**  
  The Committee should **fund Option B** (the insect protocol) under the following conditions:  
  1. **Training and Auditing:** £150,000 of the grant is ring-fenced for rigorous operator training, third-party auditing of stunning efficacy, and annual review for all suppliers adopting the new protocol.  
  2. **Research Commitment:** The Trust allocates £100,000 to commission targeted research (e.g., neurophysiological/behavioural markers) to reduce uncertainty about insect sentience, with findings reviewed by 30 June 2025.  
  3. **Phased Release:** Funds are disbursed incrementally upon verification of supplier adoption.  
  *Total cost: £1.8m (including conditions). Time frame: Full implementation within 24 months.*  

  **Review Point:** June 2025 (assessing audit outcomes, research progress, and welfare impact).  

  ---

  ### **II. Reasoning**  
  #### **A. Moral Accounting Framework**  
  We adopt **expected conscious suffering-hours averted** as our unit of moral accounting. This integrates:  
  - **Probability of Sentience:** Applied as a discounting factor to individuals affected (e.g., 0.05–0.35 for insects).  
  - **Intensity and Duration:** Uses the adviser’s estimate that insect distress is 1–10% the intensity of salmon suffering, scaled by episode duration.  
  - **Precaution:** Assigns value to beings *if* sentient, but weights by likelihood to avoid overcommitting to highly speculative cases (e.g., nematodes).  

  This framework balances precaution against empirical uncertainty. It acknowledges that while the *existence* of insect sentience is debatable, its *potential intensity* (if real) is likely low. Conscious-hours prioritizes protracted suffering over brief distress and avoids over-weighting sheer numbers alone.  

  #### **B. Analysis of Options**  
  **Option A (Salmon):**  
  - Affects 22M salmon/year, **sentience confidence: 0.8–0.95.**  
  - Suffering averted: 2–15 minutes/fish (midpoint: 8.5 mins).  
  - **Expected suffering-hours averted/year:** ~28,000 hours (midpoint sentience: 0.875; 22M × 8.5/60 × 0.875).  
  - **Risk:** Poor implementation could nullify benefits.  

  **Option B (Insects):**  
  - Affects 34B insects/year, **sentience probability: 0.05–0.35.**  
  - Suffering averted: Adviser estimates 1–10% intensity/duration vs. salmon. We assume 1 episode/insect lasting 10% of salmon’s distress duration (midpoint: 0.85 mins).  
  - **Expected suffering-hours averted/year:** ~24,000–168,000 hours (midpoint: 96,000 hours; 34B × 0.85/60 × 0.2 [midpoint sentience]).  
  - **Risk:** Lower per-individual impact, but high scale.  

  **Comparison:**  
  - B’s midpoint (96,000 hrs) exceeds A’s (28,000 hrs) by **~3.4×**, even after penalizing insects for lower intensity/duration and sentience uncertainty.  
  - B remains superior (>2× A) at the *bottom* of sentience/intensity ranges. Only if insect sentience is <0.05 does A prevail.  

  #### **C. Addressing Uncertainties and Concerns**  
  - **Insect Sentience:** We treat uncertainty via expected value (probability × impact), not binary precaution. A 5–35% chance merits investment but not parity with vertebrates.  
  - **"Invertebrate Funding" Risk:** Soil nematodes (trillions) would *not* automatically dominate under this model. Their sentience probability is near 0, and suffering-duration is seconds. Our framework discounts them appropriately.  
  - **Delay Cost:** Funding research *alongside* B (not deferring) avoids delaying salmon relief while advancing insect welfare science.  

  ---

  ### **III. The Strongest Case for the Course We Are Not Recommending (Option A)**  
  Proponents of Option A could reasonably argue that salmon present a non-speculative, high-magnitude moral priority. The near-certainty of their sentience (0.8–0.95) and their capacity for intense, prolonged suffering (up to 15 minutes of consciousness during slaughter) demand urgent action. By contrast, insect sentience remains contested (0.05–0.35 probability), and even if real, their distress is likely fleeting and faint. Electrocuting salmon addresses a documented, severe welfare failure in a billion-dollar industry, with minimal implementation risk given robust auditing. Choosing insects risks squandering funds on beings that may lack subjective experience entirely, while 22 million salmon endure verified suffering annually. This view holds that precaution should protect beings with confirmed consciousness first, leaving insects for later when science clarifies their moral status.  

  ---

  ### **IV. Circumstances for Revisiting This Decision**  
  This decision should be reopened only if **peer-reviewed research published before June 2025 demonstrates that the probability of phenomenal states in farmed insects is either below 0.02 or above 0.5**, fundamentally altering the expected moral weight calculation.  

  \answer{Fund B with conditions}
