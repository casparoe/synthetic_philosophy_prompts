answer: |-
  ### Adversarial Collaboration: Heritability Revisited  
  **Participants:**  
  - **Quantitative Geneticist (QG):** Defends *h²* as informative for prediction, intervention limits, and causal structure.  
  - **Developmental Critic (DC):** Argues *h²* is context-dependent and often misinterpreted in practice.  

  ---

  ### 1. What We Both Accept  
  1. **Definition:** Narrow-sense heritability (*h²*) is *Vₐ / Vₚ*: additive genetic variance over phenotypic variance in a defined population and environment.  
  2. **Measurement Validity:** Twin/adoption/GWAS designs *can* produce statistically robust *h²* estimates for traits like height or IQ in studied populations.  
  3. **Not Individual Fate:** *h²* = 0.6 does *not* mean "60% of your trait is genetic"; it describes population variance partitioning.  
  4. **Group Gaps:** Within-group *h²* estimates **cannot** directly explain between-group mean differences (e.g., IQ gaps by race).  
  5. **Environment Matters:** Uniform improvements (e.g., nutrition) can shift trait means *regardless* of *h²* (e.g., height increases over generations).  
  6. **Gene-Environment Interplay:** Parents pass genes *and* environments; "genetic nurture" effects exist and bias some *h²* estimates.  
  7. **Trait K:** Pre-intervention *h²* = 0.9 for K reflected high additive genetic variance *in the unsupplemented environment*. The salt program’s success confirms K’s environmental sensitivity.  
  8. **Boarding School Thought Experiment:** In a perfectly uniform environment, *Vₑ* → 0, so *h²* → 1.0 for all heritable traits. Trait means shift to the new environmental optimum.  

  ---

  ### 2. Where We Still Disagree  
  | Crux                          | QG’s View                                                                 | DC’s View                                                                 | Why Not Semantics?                                                                 |
  |-------------------------------|---------------------------------------------------------------------------|---------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **What *h²* predicts**        | "*h²* quantifies intervention resistance: High *h²* traits resist *existing* environmental levers." | "*h²* predicts almost nothing about intervention efficacy; novel levers can override it." | DC: QG conflates *current* environmental variance with *potential* modifiability. |
  | **Misleading to policymakers?** | "Stating '*h²* = 0.9 for K' is factual; caveats (e.g., 'in current environment') suffice." | "'Highly heritable' misleads by implying fixed biology; omit *h²* unless explaining study limitations." | QG: DC overstates misuse risk; precise language fixes this. DC: Lay audiences infer immutability. |
  | **Between-group inference**   | "Between-group gaps *could* be genetic if gene-environment independence holds across groups." | "Between-group genetic inference is always confounded; no *h²*-based method licenses it." | Evidence threshold disagreement: QG demands possibility; DC calls it epistemically vacuous. |
  | **Passive G×E correlation**   | "Advanced designs (e.g., adoptees + GWAS) isolate direct genetic effects." | "All *h²* estimates include *some* confounded environmental variance; report it as bias." | Measurement dispute: QG claims methods resolve it; DC says residual confounding persists. |

  ---

  ### 3. Cruxes and Predictions  
  **Crux 1: The Boarding School’s Lesson**  
  - **Scenario:** After 3 generations in uniform boarding schools, *h²* for IQ is 0.95. Mean IQ = 105 (vs. original 100).  
  - **QG predicts:** High *h²* confirms minimal *remaining* environmental levers; further mean shifts require genetic interventions.  
  - **DC predicts:** *h²* = 0.95 only reflects *current* environmental homogeneity; new interventions (e.g., cognitive training) could still raise means.  
  - **Concession:** If novel interventions raise IQ significantly, QG concedes *h²* doesn’t cap potential gains. If all fail, DC concedes *h²* signaled intervention exhaustion.  

  **Crux 2: Trait K’s Salt Program**  
  - **Scenario:** Pre-intervention *h²* = 0.9; post-intervention prevalence drops 40-fold.  
  - **QG predicts:** *h²* correctly indicated that *prior* environmental variance was low; the salt program succeeded by targeting a *new* lever.  
  - **DC predicts:** Citing *h²* = 0.9 misled stakeholders into underestimating environmental tractability.  
  - **Concession:** If policymakers delay intervention citing "high heritability," DC wins. If *h²* guided gene-hunting (e.g., finding the locus), QG wins.  

  **Crux 3: Genetic Nurture in Education**  
  - **Scenario:** GWAS of educational attainment (EA) finds *h²* = 0.25. Using adoptee design, "genetic nurture" explains 30% of this estimate.  
  - **QG predicts:** Correcting for genetic nurture yields "true" *h²* = 0.175, improving intervention targeting (e.g., reducing parent-offspring cultural transmission).  
  - **DC predicts:** The corrected estimate still conflates other confounders; publishing *any* *h²* implies false precision about genetic influence.  
  - **Concession:** If corrected *h²* improves intervention efficacy, DC concedes utility. If not, QG concedes residual confounding dominates.  

  ---

  ### 4. Verbal Disputes  
  The core verbal dispute is whether "heritable" implies "hard to change." QG insists this is a *misuse* of the term, solved by saying "high *h²* under current conditions." DC argues that in public discourse, "heritable" *is* conflated with immutability, so avoiding the term prevents harm. QG must accept that laypeople hear "genetic" as "fixed," but counters that abandoning precise terms rewards scientific illiteracy. DC must concede *h²* is mathematically valid but argues its communication is net harmful.  

  A secondary dispute: "What is *h²* for?" QG says: predicting family resemblance, gauging gene-trait mapping feasibility, and identifying environmentally resistant traits. DC says: these uses are either trivial (resemblance) or corrupted by misinterpretation (mapping feasibility implies biological inevitability). Here, the conflict is about *utility*, not definition.  

  **Words to retire:**  
  - QG: Stop saying "genetic influence" – say "additive genetic variance contribution."  
  - DC: Stop calling *h²* "meaningless" – say "context-dependent with high misuse risk."  

  ---  
  **Final Note:** This document’s existence proves both sides value rigor over tribal victory. We agree that *h²* is neither a totem nor a taboo—but its public use requires extreme caution.
