  We are drafting a joint statement for an adversarial collaboration between two sides in a debate about logical uncertainty. The sides are:
  - Side A (Coherentists): They argue for a single coherent probability distribution updated by conditioning on proofs. Synchronic incoherence is a defect because it is exploitable in principle.
  - Side B (Convergence Crowd): They argue that the normative target is a property of the whole time-sequence of belief states, avoiding exploitation by feasible traders and converging to correct beliefs for provable statements. Coherence at each instant is not required.

  The document should have:
  1. An agreed-claims section (numbered) covering:
     - What the probability calculus does and doesn't constrain when the agent can't compute updates.
     - Whether the threat of a money pump is hostage to logical uncertainty.
     - Whether uncertainty about a bounded computation (e.g., SAT instance) is the same as uncertainty about an unbounded conjecture.
     - What an agent may assume about its own future proofs (self-reference headaches).
     - Whether either framework specifies the number to use in a one-shot decision today.

  2. A disagreements table with:
     - Column 1: Neutral statement of the disagreement.
     - Column 2: Side A's preferred phrasing.
     - Column 3: Side B's preferred phrasing.

  3. Cruxes: For each crux, a concrete case both sides accept as evidence, with each side's prediction written in advance. Cases to use:
     (1) Sign-off case: A verification engineer must certify a numerical simulation/crypto construction now; the claim won't be settled for decades. What does the in-the-limit criterion say about the number to act on now?
     (2) Sieve case: A fast heuristic flags whether a hard claim is provable; a slow verifier settles it a year later. What is the right interim credence and how to discount the flag (handling logical testimony)?
     (3) Settlement-lag: A prediction market on an open conjecture cashing out at a fixed date before proof. Who holds the residual? Does it behave like ordinary risk or differently?
     (4) Mirror markets: Run the same setup twice, with one copy having an extra axiom or a leaked hint. Do the price series converge? Would convergence (or not) discriminate between the accounts?

  4. Explicitly state which parts are merely verbal and which are real.

  We must be neutral and produce a document both sides could sign.

  Let's structure the document accordingly.

  ---

  **Joint Statement on Logical Uncertainty**

  **Introduction**

  We, the undersigned, representing two perspectives on logical uncertainty, have collaborated to produce this document to clarify agreements and disagreements. The goal is to advance understanding by identifying common ground and precisely characterizing the remaining differences, including how they might be resolved empirically or theoretically.

  **1. Agreed Claims**

  We agree on the following:

  1.1. **Probability Calculus and Computational Constraints**: The probability calculus (Kolmogorov axioms) provides a set of constraints that an ideal agent's beliefs should satisfy. However, when an agent cannot compute updates (due to computational limitations), the calculus does not by itself specify how the agent should approximate these constraints. Both sides agree that computational constraints are a primary reason for deviating from ideal Bayesian updating.

  1.2. **Money Pump and Logical Uncertainty**: The threat of a money pump (a series of bets that leads to a sure loss) is a theoretical concern for any agent whose beliefs are synchronically incoherent (i.e., violate the probability axioms at a single time). However, we agree that the construction of such a pump may itself be computationally infeasible or require the resolution of the very logical facts that are uncertain. Thus, the practical significance of money-pump arguments in the context of logical uncertainty is attenuated by the same computational limitations that prevent the agent from having coherent beliefs.

  1.3. **Bounded vs. Unbounded Uncertainty**: Uncertainty about the outcome of a bounded computation (e.g., whether a specific SAT instance is satisfiable) and uncertainty about an unbounded conjecture (e.g., the Twin Prime Conjecture) are both instances of logical uncertainty. However, they differ in that bounded computations are in principle decidable in a fixed amount of time (even if infeasible), while unbounded conjectures may not be settled in any fixed time. Both sides agree that the methods for handling these two types might differ in practice, but they are part of a continuous spectrum.

  1.4. **Assumptions about Future Proofs**: An agent cannot assume that it will eventually prove or disprove every statement. Moreover, due to self-reference issues (e.g., Gödelian obstacles), an agent must be cautious about assuming its own future deductive capabilities. We agree that an agent should not assign probability 1 to its own future consistency or completeness.

  1.5. **One-Shot Decisions**: Neither framework, by itself, uniquely prescribes a specific number to use in a one-shot decision today. The coherentist framework prescribes that the agent should use the best available approximation to the ideal coherent distribution. The convergence framework prescribes that the agent should use a number that will not be exploited by feasible traders and that is part of a sequence that converges appropriately. Both sides agree that in practice, for a one-shot decision, the agent must use some heuristic or approximation.

  **2. Disagreements**

  The following table summarizes our main disagreements. The first column states the disagreement neutrally. The second and third columns present each side's preferred phrasing of their position.

  | **Neutral Statement of Disagreement** | **Side A (Coherentists) Preferred Phrasing** | **Side B (Convergence Crowd) Preferred Phrasing** |
  |----------------------------------------|-----------------------------------------------|--------------------------------------------------|
  | **The nature of the normative ideal** | The normative ideal is a single, coherent probability distribution over all mathematical statements, updated by conditioning on proofs as they arrive. Synchronic coherence (at each time step) is a requirement because diachronic incoherence (over time) can be a symptom of synchronic incoherence, and because synchronic incoherence is exploitable in principle by a computable trader if the logical facts were known. | The normative ideal is a sequence of belief states that is not exploitable by any feasible trading strategy over time and that converges to correct beliefs for statements that are eventually proved. Synchronic coherence is not required; the focus is on the long-run properties of the sequence and avoiding feasible exploitation. |
  | **The significance of "in principle" exploitability** | If an agent's beliefs are synchronically incoherent, then there exists a set of bets (a Dutch book) that the agent would accept that leads to a sure loss. The fact that constructing such a bet might require non-computable operations or depend on unresolved logical facts does not absolve the agent; the defect is real and normative. | The existence of a non-computable Dutch book is irrelevant to a bounded agent. The only normative requirement is that no feasible trader can exploit the agent over time. The threat of "in principle" exploitability is empty because it relies on resources that are not available. |
  | **The role of a prior over completions** | A prior over completions (or models) of the mathematical universe is a necessary part of the ideal, even if it is non-computable. This prior is updated by conditioning, and the agent should approximate it as best as computationally possible. | A non-computable prior over completions is not a meaningful ideal for a bounded agent. Instead, the agent should adopt a sequence of beliefs that are computable and that converge appropriately. The prior is an unnecessary fiction. |
  | **The target for logical uncertainty** | Logical uncertainty should be handled by extending the standard probabilistic framework to the logical domain, using the same principles as for empirical uncertainty. The difference is only in the source of the evidence (proofs vs. observations). | Logical uncertainty is fundamentally different because the truths are necessary and known a priori in principle, but the agent's limitations require a different normative framework that focuses on convergence and feasible computability. |

  **3. Cruxes and Test Cases**

  We have identified key points of disagreement (cruxes) and designed test cases to help resolve them. For each case, we state the setup and then each side's prediction. We agree that observing the outcomes in such cases (either in practice or in thought experiments) would provide evidence for one view over the other.

  **Crux 1: The practical relevance of synchronic coherence for one-shot decisions.**

  *Case: Sign-off case*  
  A verification engineer must certify a numerical simulation or crypto construction this week. The relevant mathematical claim (e.g., "this system satisfies property P") will not be settled for decades. The engineer must decide whether to certify.

  - **Side A Prediction**: The engineer should use the best available approximation to the coherent distribution. For example, if they have computed a probability p based on limited proof search and heuristics, they should use p. The ideal is the probability conditional on all mathematical facts, and the approximation should aim for that. The one-shot decision number is a shadow of this ideal.
  - **Side B Prediction**: The engineer should use a number that is part of a sequence that is unexploitable by feasible traders and converges to the truth if a proof is found. The exact number might come from a heuristic that has been vetted for calibration and convergence properties. The ideal prior is not a guide; instead, the number is justified by its role in the sequence.

  *Discriminating power*: If it can be shown that the coherent approximation leads to better decisions (e.g., by avoiding systematic biases) in similar cases, it would support Side A. If methods that ignore synchronic coherence but are designed for convergence perform better, it would support Side B.

  **Crux 2: Handling logical testimony from a fallible source.**

  *Case: Sieve case*  
  A fast heuristic "sieve" flags whether a hard mathematical claim is provable (but not the proof). A slow verifier will settle the claim a year later. The sieve has a known accuracy rate (say 90%). What should an agent's interim credence be after seeing the sieve's output?

  - **Side A Prediction**: The agent should update their prior using the sieve as evidence. The prior is over the mathematical facts and the sieve's reliability. The interim credence is a conditional probability: P(claim | sieve_output) = P(claim) * P(sieve_output | claim) / P(sieve_output), which requires a full model of the sieve's reliability and the prior probability of the claim.
  - **Side B Prediction**: The agent should treat the sieve as a noisy channel. The interim credence should be set so that the entire sequence of beliefs (including after the verifier's report) is unexploitable. This might lead to a simple adjustment (like the accuracy rate) without a full prior. The focus is on the long-run calibration of similar flags.

  *Discriminating power*: If a full Bayesian update (with a prior) is necessary to avoid exploitation in a series of such situations, it supports Side A. If a simpler rule (like using the sieve's accuracy rate directly) leads to better calibration and less exploitability over time, it supports Side B.

  **Crux 3: The nature of the residual in a prediction market with settlement lag.**

  *Case: Settlement-lag market*  
  A prediction market on an open conjecture (e.g., Goldbach's conjecture) cashes out at a fixed date long before the conjecture is proved or disproved. Shares pay $1 if true, $0 if false. Since the truth is unknown at settlement, the market must use a proxy (e.g., the consensus of experts, or a default value).

  - **Side A Prediction**: The market price should reflect the best estimate of the truth given available information. The residual risk (that the conjecture is false) is a form of logical uncertainty and should be priced similarly to empirical risk. The price is a probability and should be coherent with other logical beliefs.
  - **Side B Prediction**: The market price will be determined by traders who are concerned about feasible exploitation and convergence. The residual risk is not like empirical risk because it cannot be hedged by logical observations over time. The price might be driven by practical considerations (e.g., the cost of holding until actual resolution) and need not be coherent with a full probability distribution.

  *Discriminating power*: If the market behaves like a standard risk market (with prices that are coherent with a probability distribution), it supports Side A. If the market develops features that reflect the unique challenges of logical uncertainty (e.g., high volatility due to proof announcements, or decoupling from other logical beliefs), it supports Side B.

  **Crux 4: The effect of extra information on convergence.**

  *Case: Mirror markets*  
  Two prediction markets are run on the same hard conjecture. In one market, participants are given an extra axiom (or a leaked hint that a proof exists). The markets run independently. Do the price series in the two markets converge?

  - **Side A Prediction**: The markets should converge because the extra axiom is just more information, and the coherent probability conditional on the extra axiom should be the same for all agents. If the hint is reliable, both markets will eventually reflect the same truth, and the extra information should only speed up convergence. The prices should be consistent with the same underlying probability distribution.
  - **Side B Prediction**: The markets may not converge because the convergence property is about the sequence of prices in each market independently. The extra axiom might change the path of convergence and the set of feasible traders. Moreover, if the hint is about the existence of a proof (but not the proof itself), it might be discounted differently in the two markets. Convergence to the truth is only guaranteed if the conjecture is eventually settled, but the paths might differ.

  *Discriminating power*: If the prices converge (after adjusting for the extra axiom) and the price series are similar, it supports Side A. If the prices diverge or follow different patterns (e.g., one is more volatile) and the convergence properties are different, it supports Side B.

  **4. Verbal vs. Real Disagreements**

  We agree that some parts of the dispute are verbal:

  - **Probability**: Side A uses "probability" to mean a fair betting price that is part of a coherent distribution. Side B uses "probability" to mean a decision-guiding number that is part of a sequence that converges and avoids exploitation. These are different concepts, and some disagreements stem from this terminological difference.

  - **Ideal agent**: Side A's ideal is an unbounded agent with a coherent distribution. Side B's ideal is a bounded agent that performs well over time. The two ideals are different, and some disagreements reduce to which ideal is appropriate.

  We also agree that the following parts are real disagreements:

  - **The necessity of synchronic coherence**: Is it a normative requirement for bounded agents to have beliefs that are coherent at each time step, even if the incoherence is not feasibly exploitable?

  - **The role of non-computable ideals**: Can a non-computable prior serve as a normative ideal for bounded agents?

  - **The nature of convergence**: Is convergence to the truth (when proofs are found) sufficient for rationality, or must it be accompanied by synchronic coherence?

  These real disagreements have practical implications for how agents should handle logical uncertainty in real-time decisions.

  **Conclusion**

  We have laid out points of agreement and disagreement, and designed test cases to help resolve the latter. We commit to revisiting these predictions as empirical evidence (from simulations, market experiments, or real-world cases) becomes available.

  Signed,

  [Side A Representative]  
  [Side B Representative]  
  [Date]
answer: |-
  ### Joint Adversarial Collaboration Statement on Logical Uncertainty  
  **Signed:** [Side A Representative], [Side B Representative]  
  **Date:** [Date]  

  ---

  ### I. Agreed Claims  
  We, the undersigned, agree on the following points:  

  1. **Probability Calculus Under Computational Constraints**  
     - The probability calculus (Kolmogorov axioms) normatively constrains beliefs *only when* an agent can feasibly compute updates. When computation is intractable, the calculus does not prescribe specific beliefs. Instead, it serves as a limiting ideal for reasoning. Both sides agree that deviations from coherence arise from computational limits, not normative abandonment of probability theory.  

  2. **Money Pump Threats and Logical Uncertainty**  
     - The theoretical threat of a money pump (diachronic or synchronic) is itself hostage to logical uncertainty. Constructing a pump may require resolving undecided mathematical claims, rendering the exploit non-computable. Thus, "in-principle exploitability" does not imply practical vulnerability.  

  3. **Bounded vs. Unbounded Logical Uncertainty**  
     - Uncertainty about bounded computations (e.g., SAT solvers) and unbounded conjectures (e.g., Twin Prime Conjecture) differ computationally but share a common epistemic core. Both involve assigning credences to non-empirical claims. The primary distinction is whether the claim *will* be settled in bounded time (bounded) or not (unbounded), affecting feasible updating strategies.  

  4. **Self-Referential Assumptions About Future Proofs**  
     - An agent cannot assume it will eventually prove/disprove *all* statements due to Gödelian incompleteness. It may assume *specific* future proofs for tractable claims but must avoid universal self-trust (e.g., assigning P=1 to "I will not prove a contradiction").  

  5. **One-Shot Decisions and Normative Targets**  
     - Neither framework dictates a unique "correct" credence for a one-shot decision (e.g., acting on a mathematical claim today). Side A seeks the best feasible approximation to a coherent prior. Side B seeks a credence unexploitable by feasible traders. Both agree this number is heuristic and context-dependent.  

  ---

  ### II. Disagreements  
  *Neutral statements of core disagreements, alongside each side’s preferred phrasing.*  

  | Neutral Statement                                                                 | Side A (Coherentists) Preferred Phrasing                                                                                               | Side B (Convergence Crowd) Preferred Phrasing                                                                                          |
  |-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------|
  | **What constitutes the normative ideal for logical uncertainty?**                | The ideal is a single, coherent prior over all logical statements, updated via conditioning. Synchronic incoherence is a defect because it permits exploitable Dutch books *in principle*. | The ideal is a sequence of belief states that (a) avoids exploitation by *feasible* traders and (b) converges to 1 for proved statements. Coherence per timestep is irrelevant; only asymptotic properties matter. |
  | **Is "in-principle exploitability" normatively significant?**                    | Yes: Synchronic incoherence is irrational *even if* exploitation requires non-computable operations. The defect is intrinsic and must be minimized. | No: Normativity requires feasible adversarial tests. Threats relying on uncomputable traders are vacuous; only "exploitable in practice" is relevant. |
  | **How should we model uncertainty about open mathematical claims?**              | As subjective uncertainty over completions (consistent extensions) of the axiom system. A non-computable prior is the gold standard for approximating. | As a forecasting problem: Beliefs should track proof-conditional frequencies. Non-computable priors are pseudo-normative; convergence under feasible updates is the target. |
  | **What guides one-shot decisions under logical uncertainty?**                    | The number should be derived from the best available approximation to the ideal coherent distribution, ensuring local consistency. | The number should be robust against feasible exploitation and calibrated to eventual convergence, even if locally incoherent. |

  ---

  ### III. Cruxes and Test Cases  
  For each crux, we specify a concrete case and each side’s falsifiable prediction.  

  #### **Crux 1: Normative Guidance for One-Shot Decisions**  
  *Case: Sign-off Case*  
  - **Setup**: A verification engineer must certify a crypto construction today. The relevant security claim (e.g., "this construction resists attacks") is a hard mathematical problem unlikely to be resolved for decades. What credence should guide certification?  
  - **Side A Prediction**: The engineer should use a credence derived from a coherent prior (e.g., via heuristic priors over proof lengths). Acting otherwise risks *systematic* incoherence (e.g., Dutch books if logical facts were known).  
  - **Side B Prediction**: The engineer should use a credence from a strategy unexploitable by feasible traders (e.g., based on resource-bounded proof search). The "ideal prior" is irrelevant; robustness to feasible attacks matters.  
  - **Discriminating Power**: If strategies based on coherent priors systematically outperform convergence-focused heuristics in certification tasks (e.g., lower regret in simulations), Side A gains support. If convergence heuristics avoid exploits coherent heuristics miss (e.g., via adversarial ML attacks), Side B gains support.  

  #### **Crux 2: Handling Logical Testimony**  
  *Case: Sieve Case*  
  - **Setup**: A fast heuristic ("Sieve") flags whether claim *X* is provable (90% accuracy). A slow verifier will confirm *X* in one year. What interim credence should an agent assign to *X* after Sieve flags it?  
  - **Side A Prediction**: The agent should combine Sieve’s testimony with a coherent prior via Bayes’ rule: `P(X | Sieve) ∝ P(Sieve | X) × P(X)`. Credences must respect probability axioms *now*.  
  - **Side B Prediction**: The agent should treat Sieve as a noisy sensor and set `P(X)` to match Sieve’s empirical accuracy (90%), ensuring calibration over repeated trials. Coherence is secondary.  
  - **Discriminating Power**: If Bayes-updated credences show better calibration (e.g., in ensembles of Sieve-like heuristics) than frequency-matching, Side A is favored. If frequency-matching converges faster to correct post-verification beliefs and avoids Dutch books against feasible traders, Side B is favored.  

  #### **Crux 3: Nature of Residual Risk in Unsettled Claims**  
  *Case: Settlement-Lag Market*  
  - **Setup**: A prediction market on the Collatz Conjecture cashes out at a fixed date *T*, decades before resolution. Shares pay $1 if true, $0 if false. Who bears the residual risk? Does it behave like empirical risk?  
  - **Side A Prediction**: The residual risk is probabilistic and priced via coherent beliefs (e.g., integrating priors over proof lengths). Prices should obey probability axioms (e.g., no-arbitrage bounds).  
  - **Side B Prediction**: The residual risk is "logical volatility" distinct from empirical risk. Prices are set by feasible traders and may violate coherence (e.g., spikes on proof rumors). The risk-holder is whoever bets against market sentiment.  
  - **Discriminating Power**: If market prices obey coherence constraints (e.g., no sure-loss contracts) and correlate with proof-length priors, Side A is supported. If prices are exploitable by feasible traders (e.g., via rumor-based strategies) or decouple from empirical risk metrics, Side B is supported.  

  #### **Crux 4: Sensitivity to Axiomatic Information**  
  *Case: Mirror Markets**  
  - **Setup**: Two prediction markets run on the same conjecture. Market 1 has a leaked hint that a proof exists; Market 2 has no hint. Do prices converge?  
  - **Side A Prediction**: Prices converge: Both markets target the same logical truth, and the hint merely accelerates convergence. Coherence ensures paths align.  
  - **Side B Prediction**: Prices may diverge: The hint alters feasible trader behavior (e.g., short-term speculation). Convergence depends only on eventual proof, not path.  
  - **Discriminating Power**: Convergence supports Side A. Persistent divergence (e.g., >10% price gaps) or distinct volatility patterns support Side B.  

  ---

  ### IV. Verbal vs. Real Disagreements  
  We agree that **verbal disagreements** arise from differing uses of:  
  - **"Probability"**: Side A uses it for *fair betting prices under coherence*; Side B for *decision weights in a convergent sequence*.  
  - **"Ideal agent"**: Side A imagines an unconstrained Bayesian; Side B a bounded learner.  

  **Real disagreements** persist on:  
  1. Whether synchronic coherence is normatively obligatory or an infeasible distraction.  
  2. Whether non-computable priors are ideals to approximate or pseudo-normative distractions.  
  3. What constitutes "exploitation": Side A emphasizes *logical possibility*; Side B *feasible computation*.  

  ---  
  **Signed,**  
  [Side A Representative] (Coherentists)  
  [Side B Representative] (Convergence Crowd)  

  ---  
  This document resolves ambiguities, specifies testable claims, and isolates irreconciled differences. We commit to revisiting predictions upon new evidence.
