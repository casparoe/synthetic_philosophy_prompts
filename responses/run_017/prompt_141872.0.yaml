prompt: |-
  I'm writing the framing section of a survey on observer-selection problems in cosmology, and before I go near the competing proposals I want the specification written down first. Please write me the desiderata a cosmological theory would have to meet in order to count as having solved the Boltzmann brain problem, where solved means something strong enough to be useful: a working cosmologist could take a new model, apply the theory, and get a verdict on whether the model is viable, rather than merely a reason to stop worrying about it.

  Assume the setup is known; don't spend words defining fluctuation observers or recapping the dialectic, and don't survey the literature. Put the weight on the requirements themselves and on the cases that motivate them.

  Some distinctions and cases I think any such list has to respect, and which I want handled explicitly:

  - Two worries I take to be distinct though they are constantly run together: the dominance worry, that observers produced by thermal or vacuum fluctuations vastly outnumber observers produced by a long low-entropy cosmological history, so that a randomly sampled observer is a fluctuation; and the ratification worry, that a theory on which I am probably a fluctuation observer is a theory on which my evidence for that very theory is noise, so that the theory cannot be rationally accepted even if true. A theory can win on one and lose on the other, and I want separate requirements for each rather than one merged entry.
  - The Archive case: a fluctuation that produces not merely a momentary observer with disordered impressions but an observer together with a physically complete set of apparent records — an instrument, a set of notebooks, a body configured as if it had just finished a measurement — that is, an observer with the same total evidence I take myself to have. Such fluctuations are enormously more expensive than minimal ones and so vastly rarer, but they are the ones that matter, because the cheap ones do not share my evidence. I want a requirement about which comparison class a theory is allowed to use and why, since the verdict flips depending on whether we count all observers or only observers with my evidence.
  - A requirement about what would count as evidence for the hypothesis that I am such an observer, and about what the theory is committed to if nothing could in principle count as such evidence.
  - A requirement about the sampling or typicality step: whether it is physics or a methodological rule, whether the theory must supply the reference class rather than take it as given, and whether a theory may use typicality to generate the original prediction while suspending it once the prediction turns on the theory's own credibility.

  For each requirement give the case or consideration behind it, and mark it as non-negotiable, negotiable, or a preference of one research community. Then tell me which subset of the requirements, if any, is jointly unsatisfiable — I suspect the live tension is between using typicality to get the problem off the ground and qualifying it in order to escape the conclusion, but state it precisely if that diagnosis is wrong. Tell me which single requirement does the most work in excluding candidate solutions, and which one you suspect is a prejudice of one camp dressed up as a desideratum. Most useful of all: flag any requirement of yours such that dropping it would make the problem vanish altogether, since that would be a sign the requirement was smuggling in the answer rather than testing for it.

  Use the familiar families of response only as stress tests of the list — a cosmology with a low-entropy past and a finite future, an eternally inflating cosmology with a measure over observers, and any approach that rejects the sampling assumption outright — and confine this to a few lines; I'll do the scoring myself.

  Finally, the part where I want you self-critical rather than assertive: mark your own least secure requirement, say what argument or what kind of case would make you drop it, and say where you think this whole project of specifying what it would take to solve the problem might be misguided — for instance, if there turns out to be no determinate thing being asked for. No citations or reading list, please; I have the literature.
reasoning: |-
  We are writing desiderata for a cosmological theory to have "solved" the Boltzmann brain (BB) problem in a strong sense. The solution should allow a cosmologist to apply the theory to a new model and get a clear verdict on viability. We have two distinct worries: dominance (BBs outnumber ordinary observers) and ratification (if I'm probably a BB, then my evidence for the theory is noise). We must address the Archive case (fluctuations with complete apparent records). We also need requirements on the comparison class, evidence for being a BB, the typicality step, and more.

  We'll structure the requirements by:
  - Stating each requirement clearly.
  - Giving the motivation (case or consideration) behind it.
  - Marking it as non-negotiable, negotiable, or a community preference.
  - Then, we'll discuss which subset is jointly unsatisfiable, which requirement does the most work in excluding solutions, and which might be a prejudice.
  - We'll also note if dropping a requirement would make the problem vanish.

  Finally, we'll be self-critical about the least secure requirement and potential misguidance.

  **Requirements**

  1. **Requirement: Observers with Equivalent Evidence (Non-Negotiable)**  
     *Desideratum*: The theory must compare the expected number of observers with *exactly the same total evidence* as I currently possess (including apparent records, memories, and sensory inputs) to the expected number of such observers produced by ordinary cosmological processes.  
     *Motivation*: The Archive case shows that fluctuations producing observers with my exact evidence (including a complete set of apparent records) are the relevant ones for both dominance and ratification. Minimal fluctuations (e.g., a momentary brain) do not share my evidence and thus are not relevant to the problem. This requirement ensures that we are comparing the correct classes.  
     *Status*: Non-negotiable because without it, the problem is misstated.

  2. **Requirement: Decoupling of Dominance and Ratification (Negotiable)**  
     *Desideratum*: The theory must provide separate verdicts for the dominance worry (whether BBs with my evidence dominate) and the ratification worry (whether the theory can be rationally believed given the dominance verdict).  
     *Motivation*: These are distinct problems. A theory might show that BBs do not dominate (solving dominance) but still face a ratification problem if the residual chance of being a BB undermines trust in the theory. Conversely, a theory might have BB dominance but avoid ratification by having a non-typicality-based epistemology.  
     *Status*: Negotiable because some theories might address both with the same mechanism, but they should at least be distinguishable.

  3. **Requirement: Empirical Testability of BB Hypothesis (Non-Negotiable)**  
     *Desideratum*: The theory must specify what evidence could, in principle, count against the hypothesis that I am a BB (i.e., a fluctuation with my apparent evidence). If the theory entails that no possible evidence could count against this hypothesis, then it must explain why this does not lead to radical skepticism.  
     *Motivation*: If the BB hypothesis is unfalsifiable, then the ratification worry becomes acute: any evidence I have is compatible with being a BB, so I cannot trust my evidence. This requirement forces the theory to either make the BB hypothesis testable or show that the theory itself is immune to the resulting skepticism.  
     *Status*: Non-negotiable for any theory that aims to be scientifically viable.

  4. **Requirement: Internal Coherence of Typicality (Non-Negotiable)**  
     *Desideratum*: If the theory uses a typicality assumption (e.g., that I am a typical observer in the reference class) to generate predictions (like the initial conditions of the universe), then it must apply the same typicality assumption consistently when evaluating the BB problem. The theory cannot suspend typicality when it leads to a problem for the theory's own credibility.  
     *Motivation*: The tension in many approaches is that they use typicality to explain why we observe a low-entropy past (as in the past hypothesis) but then avoid typicality when it predicts we should be BBs. This is ad hoc unless justified by a principled distinction.  
     *Status*: Non-negotiable because without consistency, the theory is self-undermining.

  5. **Requirement: Specification of the Reference Class (Preference)**  
     *Desideratum*: The theory must specify the reference class of observers for the typicality assumption. It cannot take the reference class as a given external input.  
     *Motivation*: Different reference classes (e.g., all conscious moments, all observers with my evidence, all observers in a given type of universe) yield different typicality verdicts. The theory must fix this to avoid ambiguity.  
     *Status*: A preference of one research community (e.g., those who see reference class as part of the theory) but negotiable for others (who might see it as a separate philosophical issue).

  6. **Requirement: Physical Basis for Probabilities (Non-Negotiable)**  
     *Desideratum*: The theory must provide a physical mechanism for generating the probabilities used in the observer counts (e.g., a measure over the multiverse or a well-defined probability distribution for fluctuations). This measure must be derived from the fundamental dynamics of the theory.  
     *Motivation*: Without a physical measure, the expected numbers of BBs and ordinary observers are ill-defined. Many debates (e.g., in eternal inflation) center on the choice of measure.  
     *Status*: Non-negotiable for a physical solution.

  **Which subset is jointly unsatisfiable?**  
  The tension is between Requirement 4 (internal coherence of typicality) and the desire to avoid the BB dominance conclusion. If a theory uses typicality to explain the past, then Requirement 4 forces it to apply typicality to the BB problem, which often leads to BB dominance. To avoid this, one must either reject typicality entirely (which might break the initial prediction) or find a way to restrict the reference class (Requirement 5) that avoids BBs without ad hocness. This is the core tension.

  **Which requirement does the most work in excluding candidate solutions?**  
  Requirement 4 (internal coherence of typicality) is the most exclusionary because it forces theories that rely on typicality for the past hypothesis to face the BB problem head-on. This requirement rules out many ad hoc solutions that try to ignore typicality in the BB context.

  **Which requirement might be a prejudice?**  
  Requirement 5 (specification of the reference class) might be seen as a prejudice of the camp that insists on a unique physical reference class. Other camps might argue that the reference class is not a physical question but an epistemological one, and that we can use a context-dependent reference class.

  **Dropping which requirement would make the problem vanish?**  
  Dropping Requirement 1 (observers with equivalent evidence) would make the problem vanish. If we compare all observers (including minimal BBs) to ordinary observers, then BBs might dominate, but if we require equivalent evidence, the Archive BBs are so rare that they might not dominate. However, Requirement 1 is non-negotiable because without it, we are not addressing the real problem.

  **Stress Tests with Familiar Families (briefly)**  
  - *Finite cosmology (low-entropy past, finite future)*: Avoids BBs by having no eternal phase. Requirement 6 (physical probabilities) is met by the initial conditions. Requirement 4 (typicality) is not invoked for BBs since there are none.  
  - *Eternal inflation with a measure*: Must satisfy Requirements 1 and 6 to compare observers with equivalent evidence and have a measure. Requirement 4 is the challenge: if typicality is used, it might lead to BB dominance.  
  - *Rejecting sampling assumption*: Drops Requirement 4 and 5. Must provide an alternative epistemology to address ratification.

  **Self-Critical Reflection**  
  - *Least secure requirement*: Requirement 5 (specification of the reference class) is the least secure. It is not clear that a fundamental theory must specify the reference class; this might be an emergent or contextual matter. An argument that the reference class is fixed by the evidence (e.g., I am in the class of observers with exactly my evidence) might make me drop the requirement that the theory must specify it.  
  - *Potential misguidance*: The entire project might be misguided if there is no fact of the matter about what counts as an "observer" or "equivalent evidence". If these concepts are not physically well-defined, then the desiderata might be imposing a false precision. Also, if the problem is inherently circular (as in ratification), then no solution may be possible without a prior epistemological commitment.
answer: |-
  ### Desiderata for Solving the Boltzmann Brain Problem  
  Below are the requirements a cosmological theory must meet to decisively solve the Boltzmann brain (BB) problem, enabling clear verdicts on model viability. The requirements address distinct worries (dominance vs. ratification), the Archive case, evidence standards, and typicality. Each requirement includes:  
  - **Desideratum**: The core condition.  
  - **Motivation**: The case or consideration driving it.  
  - **Status**: Non-negotiable (essential for any solution), negotiable (open to alternatives), or preference (community-dependent).  

  #### Requirements  
  1. **Equivalent Evidence Restriction**  
     - *Desideratum*: The theory must restrict observer comparisons to those with *identical total evidence*, including apparent physical records (e.g., notebooks, instrument readings, bodily states), not merely conscious observers or disordered impressions.  
     - *Motivation*: The Archive case—where a fluctuation produces an observer with a complete set of apparent records matching mine—demonstrates that only these high-cost fluctuations threaten rationality. Minimal BBs (e.g., isolated brains) lack my evidence and are irrelevant; including them inflates dominance artificially.  
     - *Status*: Non-negotiable.  

  2. **Dominance-Ratification Separation**  
     - *Desideratum*: The theory must resolve the dominance worry (do BBs with my evidence outnumber ordinary observers?) and the ratification worry (can I trust evidence if BB-dominant?) independently. Solutions to one do not count toward the other.  
     - *Motivation*: Dominance is a physical counting problem (e.g., in eternal inflation, BBs may dominate despite rarity of Archive cases), while ratification is epistemic (e.g., if BBs dominate, my belief in the theory may be self-undermining). Conflating them obscures failure modes (e.g., a theory may suppress BB counts physically but leave ratification unresolved).  
     - *Status*: Non-negotiable.  

  3. **Falsifiability of the BB Hypothesis**  
     - *Desideratum*: The theory must specify empirical evidence that would disconfirm "I am a BB" (e.g., cosmic signatures only accessible to non-BB observers). If no evidence could ever count, the theory must justify why this does not induce global skepticism (e.g., by showing all observers share indistinguishable evidence).  
     - *Motivation*: If "I am a BB" is unfalsifiable, the ratification worry becomes inescapable—any evidence is compatible with being noise. The Archive case heightens this: if even apparent records of cosmic history are unreliable, no cosmology is testable.  
     - *Status*: Non-negotiable.  

  4. **Typicality Consistency**  
     - *Desideratum*: If the theory invokes typicality (e.g., "we are typical observers") to derive initial conditions or predictions, it must apply the *same* typicality assumption to assess BB dominance, without ad hoc suspension. The reference class must be fixed by the theory, not external inputs.  
     - *Motivation*: Theories often use typicality to explain the past hypothesis (e.g., why we observe low-entropy initial conditions) but ignore it for BBs (e.g., "typical observers should be BBs, but we aren’t"). This inconsistency arises in eternal inflation, where measure choices affect BB counts.  
     - *Status*: Non-negotiable.  

  5. **Physical Probability Measure**  
     - *Desideratum*: The theory must provide a fundamental physical mechanism for observer-counting probabilities (e.g., a quantum measure or dynamical process), not a heuristic or imported statistical rule.  
     - *Motivation*: In BB calculations, probabilities are sensitive to the measure (e.g., the flatness problem in inflation). Without a first-principles measure (e.g., from quantum gravity), verdicts are arbitrary and model-dependent.  
     - *Status*: Non-negotiable.  

  6. **Reference Class Transparency**  
     - *Desideratum*: The theory must explicitly define the observer reference class (e.g., "observers with evidence E" or "conscious substates") and justify its scope (e.g., why not all possible minds).  
     - *Motivation*: Varying the class (e.g., including minimal BBs vs. only Archive-complete observers) flips verdicts. In finite cosmologies, a broad class implies BB dominance; a narrow class avoids it. The theory cannot defer this choice.  
     - *Status*: Preference (e.g., multiverse cosmologies demand this; others see it as epistemological).  

  #### Tensions and Diagnostic Insights  
  - **Jointly Unsatisfiable Subset**: Requirements 4 (typicality consistency) and 6 (reference class transparency) conflict with avoiding BB dominance in typicality-dependent theories. If typicality explains the past (Requirement 4), and the reference class includes all observers (Requirement 6), BB dominance follows. Solutions must either abandon typicality (undermining initial predictions) or restrict the reference class (risking ad hocness). *This is the core tension*.  
  - **Most Exclusionary Requirement**: Requirement 4 (typicality consistency). It forces theories relying on typicality for cosmology (e.g., eternal inflation) to confront BB dominance head-on, ruling out solutions that "moot" BBs by fiat.  
  - **Potential Prejudice**: Requirement 6 (reference class transparency) may be a preference dressed as a desideratum. Some communities view reference classes as epistemological (not physical), making this requirement overly restrictive.  
  - **Requirement Whose Removal Dissolves the Problem**: Dropping Requirement 1 (equivalent evidence restriction) eliminates the BB problem, as minimal BBs dominate ordinary observers in most eternal cosmologies. But this is illegitimate—it ignores the Archive case and conflates irrelevant fluctuations with observers sharing my evidence. Requirement 1 is well-motivated but decisive.  

  #### Stress Tests of Candidate Solutions (Brief)  
  - **Finite cosmology (e.g., bounce models)**: Avoids BBs via finite history. Fails Requirement 4 if it uses typicality for initial conditions but ignores it for other predictions.  
  - **Eternal inflation with measure (e.g., scale-factor cutoff)**: Must satisfy Requirements 1, 4–5. Often violates Requirement 4 by ad hoc measure choices to suppress BBs.  
  - **Anti-typicality (e.g., indexical skepticism)**: Rejects Requirement 4. May resolve ratification but fails Requirement 3 if it permits unfalsifiable BB hypotheses.  

  #### Self-Critical Reflections  
  - **Least Secure Requirement**: Requirement 3 (falsifiability of BB hypothesis). It assumes science requires local disconfirmation, but if BBs and ordinary observers are physically indistinguishable (as in some quantum approaches), no evidence could distinguish them. A case where indistinguishable observers share identical predictive models (e.g., in holographic cosmologies) might compel me to drop it.  
  - **Potential Misguidance of the Project**: The entire endeavor may be misguided if "solving" the BB problem presupposes a non-existent objectivity. For instance:  
    - If "equivalent evidence" is ill-defined (e.g., due to quantum uncertainty), Requirement 1 fails.  
    - If typicality is inherently circular (e.g., it assumes what it predicts), Requirement 4 demands the impossible.  
    - The ratification worry may be unresolvable—a meta-problem that no cosmology can address.  
  This could imply that the desiderata encode a false expectation of definitive resolution, and the problem is ultimately metaphysical.  

  ---  
  This specification isolates the criteria for a solution, prioritizes rigor over exposition, and exposes fault lines. Use it to score theories against the requirements.
