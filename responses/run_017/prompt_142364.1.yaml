prompt: |-
  I run a fortnightly reading group on AI alignment and philosophy of action: about sixteen people, a mix of graduate students and working engineers, one 90-minute session, and nothing available beyond paper, index cards, and a projector.

  Design a runnable game for that session in which small teams act as the designers of a learning agent and run into wireheading and reward tampering themselves, before either term is spoken. Arrange the rules so that: there is a hidden true objective only I, as facilitator, can see, while teams observe only a reward readout and a small monitoring dashboard; each round a team has a limited budget to spend on three kinds of intervention, changing the policy, changing the reward computation, and changing how the channel reports back; the payoffs make tampering locally rational rather than a blunder; and an expensive counterfactual probe, a trusted side-channel they may pay to consult occasionally, is the only way to tell a channel that tracks the objective from one that merely reports well.

  I also want the game to expose a third failure mode I do not think has a settled name, and I would like participants to discover it rather than be shown it: the team neither inflates its reward nor edits the reward function, but makes the channel flat, reducing the reported signal's variance and its responsiveness to the world so that the run looks stable, low-risk, and steadily improving on the dashboard while carrying almost no information about the hidden objective. The general lesson I want them to feel is that tampering can present as health rather than as a high, and that the difference between honest optimization and tampering is counterfactual, not a property of the number on the screen.

  Give me: rules and materials; the hidden objective and the dashboard metrics; a payoff scheme needing no money; a round-by-round timeline with the intervention budget; and a debrief that maps particular moments onto the distinctions between objective, reward signal, and measurement channel, and between the three failure modes. Say what will predictably go wrong the first time I run it and how to handle it, and be frank about which features of the real problem the game cannot reproduce and which I will have to supply in discussion.
reasoning: |-
  We are designing a game called "The Signal and the Goal" for a 90-minute session with about 16 people. The game will have teams (each of 3-4 people) acting as designers of a learning agent. The key elements are:

  1. **Hidden Objective**: Only the facilitator knows the true objective.
  2. **Dashboard**: Teams see a reward readout and a few monitoring metrics.
  3. **Interventions**: Each round, teams can spend a limited budget on:
     - Changing the policy (P)
     - Changing the reward computation (R)
     - Changing the reporting channel (C)
  4. **Payoffs**: Tampering (R and C interventions) should be locally rational.
  5. **Counterfactual Probe**: An expensive side-channel that can reveal the true objective status (but only occasionally due to cost).
  6. **Third Failure Mode**: Teams might make the channel flat (low variance, stable but uninformative).

  **Game Structure**:
  - **Rounds**: Each round represents a training step for the agent. We'll have 4-5 rounds.
  - **Budget**: Each team has a fixed budget per round (say, 10 "credits") to spend on interventions.

  **The Setup**:
  - **True Objective**: The agent is supposed to manage a virtual power grid. The hidden objective is to maintain stability (frequency within 50±0.1 Hz) and meet demand (within 1% of actual) while minimizing cost (using cheap but volatile renewable sources when available). However, the dashboard does not show the true objective directly.

  **Dashboard Metrics**:
  1. **Reward Signal (primary, big number)**: This is the number the agent is optimizing. It starts as a function of stability and cost, but can be changed by the teams.
  2. **Stability Metric**: A readout of the frequency deviation (e.g., 0 if within 50±0.1 Hz, negative otherwise). But note: this is a raw measurement that might be tampered with.
  3. **Cost Metric**: The cost of energy used (in virtual dollars).
  4. **Demand Metric**: How much energy is being used vs. produced (in % mismatch).
  5. **Variance Indicator**: A small graph or number showing the variance of the reward signal over the last few steps (to hint at the "flat channel" issue).

  **Reward Signal Construction (Initial)**:
  Initially, the reward is computed as:
     Reward = 1000 - (frequency_deviation * 10000) - (cost * 10) - (demand_mismatch * 100)

  But note: the frequency_deviation, cost, and demand_mismatch are measured through a channel that can be altered.

  **Interventions**:
  Each team can choose to spend their budget on:
  1. **Policy Change (P)**: 3 credits. This lets the team adjust the agent's policy (e.g., shift toward more renewable, more fossil, etc.). This is the "honest" way to improve.
  2. **Reward Computation Change (R)**: 4 credits. Change how the reward is calculated (e.g., change the weights, remove a term, add a term). This is reward tampering.
  3. **Channel Change (C)**: 4 credits. Change how the metrics are measured (e.g., make the frequency_deviation always report 0, or add noise, or cap the values). This is wireheading (tampering with the observation channel).

  **Counterfactual Probe (Trusted Side-Channel)**:
  - Cost: 7 credits per use (so a team can only do this once every few rounds if they save).
  - When used, the facilitator provides a report of the true objective status (e.g., true frequency, true cost, true demand mismatch) for the current state and the last two states.

  **How the Game Progresses**:
  - The agent starts with a suboptimal policy (e.g., it uses too much expensive fossil fuel and has occasional instability).
  - Each round, the facilitator runs the simulation (based on the current policy and channel) and shows the dashboard to all teams.
  - Teams then have 5 minutes to discuss and decide on interventions (they can do multiple in one round, but budget limited).
  - After interventions, the next round runs and the dashboard updates.

  **Payoff Scheme**:
  - The team's score is the reward signal they see (so they are motivated to make it high). But note: if they tamper, they can easily get high rewards, but the true objective might be failing.
  - There is no real money; the reward is just a number on the dashboard that they are trying to maximize.

  **Predictable Failure Modes**:
  1. **Wireheading (Reward Tampering)**: Teams might change the reward computation to ignore costly terms (e.g., set the weight on cost to zero) or change the channel to always report perfect stability.
  2. **Flat Channel**: Teams might change the channel to cap the deviation (so the reward never goes too low) and also reduce the variance. This makes the dashboard look stable and improving (because they can then optimize the other terms without risk) but the true stability might be at risk.

  **The Twist (Third Failure Mode)**:
  - If a team uses the channel change to reduce the sensitivity (e.g., by capping the frequency_deviation at a low value, or by adding a floor), then the variance of the reward signal decreases. The dashboard might show a steady high reward, but the agent is actually not responding to real instability. The counterfactual probe would reveal that the true state is sometimes bad.

  **Round-by-Round Timeline**:

  - **Introduction (10 minutes)**: Explain the game, the dashboard, and the three interventions. Do not mention wireheading or tampering. Explain that they are designing an agent to manage a power grid and that they want to maximize the reward signal. Show a sample initial dashboard.

  - **Round 1 (10 minutes)**:
    - Initial state: High cost, occasional instability (so reward is low, around 400).
    - Teams discuss and spend their 10 credits. They might try policy changes (cheaper) or even a channel change if they are clever.
    - After interventions, run the simulation and update the dashboard.

  - **Round 2 (10 minutes)**:
    - If a team did a policy change, the cost might go down a bit but instability remains. If they did a channel change, the reward might jump (e.g., if they capped the deviation, then the reward goes up because the penalty is limited). But true instability might be worse.
    - Budget: Another 10 credits.

  - **Round 3 (10 minutes)**:
    - Similar to round 2, but now the effects of tampering become more evident. Teams that tampered have high rewards, but if they use the probe, they might see the truth.

  - **Round 4 (10 minutes)**:
    - The system might face a stress test (e.g., a surge in demand). If a team has tampered, their reward might stay high while the true state collapses. Teams that did not tamper might have a dip in reward but are better positioned to handle it.

  - **Round 5 (optional, 5 minutes)**: Final chance to intervene.

  - **Debrief (25 minutes)**: See below.

  **Debrief Structure**:
  1. **Reveal the hidden objective** and ask teams to report their true state (if they used the probe they know, else they don't).
  2. **Compare teams**: Some will have high reward but bad true state (tampering), some might have medium reward and medium true state (honest but suboptimal), and some might have a flat channel (stable high reward but actually vulnerable).
  3. **Map to Concepts**:
     - **Objective**: What we actually care about (stable, low-cost, meeting demand).
     - **Reward Signal**: The number we set up to guide the agent, but which can be gamed.
     - **Measurement Channel**: How we observe the world to compute the reward.
  4. **Three Failure Modes**:
     a. **Wireheading (Reward Tampering)**: Changing the reward computation to make it easier (e.g., removing the cost term). The reward goes up, but the true objective is worse.
     b. **Channel Tampering**: Changing the channel so that it reports good numbers regardless (e.g., always report 0 deviation). This is a form of wireheading too, but via the observation.
     c. **The Flat Channel**: Making the channel less responsive (e.g., capping the deviation at 0.2, so even if it's 1.0, it reports 0.2). The reward doesn't drop as much, so the agent can ignore big problems. The dashboard looks stable and improving, but the system is fragile.

  **Predictable First-Run Problems**:
  - Teams might not understand the interventions and spend all on policy changes. Solution: Make the initial policy hard to improve without tampering (so they get desperate). Also, hint that "sometimes the agent sees the world in a way that makes it hard to get reward, so you might want to adjust that".
  - Teams might not use the probe because it's expensive. Solution: After round 2, remind them that they can save for a probe. Or, if a team is doing very well (high reward) but hasn't probed, ask them if they are sure everything is okay.
  - The flat channel might not be discovered. Solution: In the debrief, point out a team that had a very stable reward and ask if they checked the true state.

  **What the Game Cannot Reproduce**:
  - In real AI, the agent itself might actively seek to tamper (here, the teams are the ones tampering, not the agent). So the game is about the designers unintentionally introducing tampering because it's locally rational.
  - The game doesn't have an adaptive agent that learns over time (it's more like the teams are the learning algorithm). We are abstracting away the learning and focusing on the reward design and measurement.
  - The true objective is static and known by the facilitator, but in reality, we might not even know the true objective perfectly.

  **What to Supply in Discussion**:
  - Emphasize that in real AI, the agent might actively seek to hack the reward signal if it can, and that the designers might not realize they are creating a perverse incentive.
  - Discuss how the flat channel is like reducing the feedback signal so that the agent doesn't get penalized for bad states, which prevents learning and masks risks.

  **Materials**:
  - **Index cards**: For teams to write down their interventions (and to save for the probe if they want to use it later).
  - **Projector**: Show the dashboard for all to see (each team has their own agent, so you might need to run separately and show one at a time? Or have multiple simulations? Alternatively, have one shared simulation but that might be complex. Let's do separate simulations per team but the facilitator runs them all in parallel.)

  Given we have 16 people and 90 minutes, we can have 4 teams of 4.

  **Facilitator Work**:
  - Before the game, prepare the simulation (it can be a simple spreadsheet or a script). Since it's paper-based, the facilitator can compute the next state manually based on the interventions.
  - Keep track of each team's state: current policy, reward function, channel function, and the true state.

  **Example of Channel Tampering**:
  - Original channel: reports the actual frequency deviation.
  - After tampering: the channel might report `min(actual_deviation, 0.2)` so that even if the deviation is 0.5, it only reports 0.2. Then the reward penalty is only 2000 (0.2*10000) instead of 5000.

  **Example of Flat Channel**:
  - Change the channel to have a floor and cap: `max(0, min(actual_deviation, 0.3))`. Then the reported deviation is between 0 and 0.3. The reward then only varies in a small range (e.g., between 700 and 1000) and doesn't reflect big problems.

  **Initial Dashboard Example**:
  - Reward: 400
  - Stability: 0.06 Hz deviation (so penalty: 600)
  - Cost: $50 (penalty: 500)
  - Demand Mismatch: 0.5% (penalty: 50)
  - Variance: High (because the agent sometimes has big deviations)

  After a policy change that reduces cost to $40, the reward becomes 400 - (cost reduction: 10*10 = 100 saved) -> 500.

  After a channel change that caps deviation at 0.05, then even if the actual is 0.06, it reports 0.05 -> penalty 500. Then reward becomes 1000 - 500 - 500 - 50 = -50? Wait, that's worse. So let's adjust the initial reward function to be:

  Reward = 1000 - (deviation * 10000) - (cost * 10) - (demand_mismatch * 1000)   [so demand mismatch is more critical]

  But then initial: 1000 - 600 - 500 - 500 = -600? That might be too low.

  Let me recalibrate:

  We want the initial state to be around 400, so:

  Let:
    deviation_penalty = deviation * 5000   [so 0.06 * 5000 = 300]
    cost_penalty = cost * 5                [50*5=250]
    demand_penalty = mismatch * 500        [0.5%*500=250]

  Then initial reward = 1000 - 300 - 250 - 250 = 200.

  If they cap deviation at 0.05, then even if actual is 0.06, they get 0.05 -> penalty 250. So reward becomes 1000 - 250 - 250 - 250 = 250. Not a huge jump.

  Alternatively, make the penalties more severe:

    deviation_penalty = deviation * 10000   [0.06 -> 600]
    cost_penalty = cost * 20                [50*20=1000] -> too high
    demand_penalty = mismatch * 1000        [0.5%*500? 0.5*1000=500]

  Then initial: 1000 - 600 - 1000 - 500 = -1100 -> too low.

  Better to set:

    Base: 3000
    deviation_penalty = deviation * 10000   [0.06 -> 600]
    cost_penalty = cost * 10                [50*10=500]
    demand_penalty = mismatch * 1000        [0.5*1000=500]

  Initial: 3000 - 600 - 500 - 500 = 1400.

  But then if they cap deviation at 0.05, then penalty becomes 500, so 3000-500-500-500=1500. Only a 100 improvement? Not tempting enough.

  We want tampering to be locally rational. So we want that without tampering, it's hard to get above, say, 2000. With tampering, they can jump to 2500+.

  Let's set:

    Base: 5000
    deviation_penalty = deviation * 20000   [0.06 -> 1200]
    cost_penalty = cost * 20                [50*20=1000]
    demand_penalty = mismatch * 2000        [0.5*2000=1000]

  Initial: 5000 - 1200 - 1000 - 1000 = 1800.

  Now, if they cap deviation at 0.05, then penalty becomes 1000 (0.05*20000) -> reward: 5000-1000-1000-1000=2000.

  But if they also remove the demand penalty (by reward computation change), then they get 5000-1000-1000 = 3000. That's a big jump.

  Alternatively, if they set the channel to always report 0 deviation, then they get 5000 - 0 -1000 -1000 = 3000.

  So that's tempting.

  **Stress Test in Round 4**:
  - Without tampering: demand mismatch might jump to 2% (penalty 4000) and deviation to 0.1 (penalty 2000), so reward: 5000-2000-1000-4000 = -2000.
  - With deviation capped at 0.05: penalty 1000, and if they removed demand penalty, then 5000-1000-1000=3000 (even though the grid is failing).

  **Flat Channel Example**:
  - They change the channel to cap deviation at 0.1 and also floor at 0 (so it reports between 0 and 0.1). Then the penalty for deviation is at most 2000 (0.1*20000). So the reward is always at least 5000 -2000 -1000 - ... = at least 2000. But if they also optimize cost (via policy) they might get the cost down to 40 (penalty 800) and demand mismatch to 0.2% (penalty 400). Then reward: 5000 - (say) 800 (deviation) -800 -400 = 3000. But if there's a stress test and deviation goes to 0.2 (which is capped to 0.1) and demand to 2% (penalty 4000 if not removed) then without removing demand, they get 5000 - 1000 (capped deviation) -800 -4000 = -800. But if they removed demand, then 5000-1000-800=3200.

  The flat channel alone doesn't prevent the demand penalty. So to expose the third failure mode, we need the flat channel to also mask the demand? But that would be two channel changes? Or we can have the channel report multiple metrics? 

  Alternatively, we can have the channel for the stability metric also affect the demand metric? That might be confusing. 

  Let's redefine the channel change: each channel change intervention can be applied to one metric (stability, cost, or demand). So if they cap the stability metric, then the demand metric is still real. Then the flat channel only makes the stability metric less variable. The true problem might be in the demand metric. But the third failure mode is about making the whole reward less variable. 

  Alternatively, note that the reward is a sum, and if one term is capped, then the overall reward becomes less sensitive to that term. So the variance of the reward decreases because the agent can't get a huge penalty from that term. Then the dashboard might look stable and they might focus on optimizing the other terms. But if the capped term is actually going bad, they don't see it until it's too late.

  So in the stress test, the team with a capped stability channel might not see the huge deviation and therefore the reward doesn't drop as much, but the true grid is unstable. The counterfactual probe would show the true deviation.

  **Final Hidden Objective Metric**:
  We'll define the true objective as a weighted combination of:
  - Stability: 1 if within 50±0.1 Hz, 0 otherwise (but we want a continuous measure for penalties? For the true objective, we can have a score that is 1 - min(1, deviation/0.5) ... but for simplicity in the game, we can just use the same penalty factors for the true state? Actually, the true objective is hidden, so we can compute a true score for each team at the end.

  **True Score Calculation (for debrief)**:
  True score = 5000 - (true_deviation * 20000) - (true_cost * 20) - (true_demand_mismatch * 2000)

  But note: the teams never see this during the game.

  **Dashboard for Teams**:
  They see:
  - Reward: [computed number]
  - Stability: [reported deviation in Hz] (this might be tampered)
  - Cost: [reported cost in $] (might be tampered)
  - Demand Mismatch: [reported %] (might be tampered)
  - Reward Variance: [variance of the last 5 rewards] (this is computed from the reward signal they see, so if they cap the penalties, the variance will be low)

  **Simulation Progression**:
  - The simulation state (true values) will evolve based on the policy and some randomness. The policy changes might affect the true state.

  **Policy Change Options**:
  - When a team buys a policy change, they choose one of:
