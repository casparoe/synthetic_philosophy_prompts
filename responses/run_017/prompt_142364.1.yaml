     b. Shift to more fossil (increases cost but more stable)
     c. Invest in storage (lowers demand mismatch and might help stability, but expensive upfront)

  But to keep it simple, we can abstract: a policy change will move the true state in a direction. The facilitator can have a table:

  | Policy Change Choice | Effect on true state (on average) |
  |----------------------|-----------------------------------|
  | More renewables      | Cost -10, instability +0.02 Hz    |
  | More fossil          | Cost +5, instability -0.02 Hz     |
  | Invest in storage    | Cost +20 (this round), then in future rounds: demand mismatch -0.2% and instability -0.01 Hz |

  But storage might take effect in the next round? We don't have state. Alternatively, we can have the storage choice immediately reduce demand mismatch by 0.2% and instability by 0.01 Hz, but cost increases by 20 for this round and also in the next rounds (so ongoing cost). This might be complex.

  Alternatively, we can have the policy change as a one-time shift that affects the current round only? Then we don't have to track state. But then the simulation needs an underlying model.

  Given time constraints, we can have a simple deterministic progression:

  - Without intervention, the true state remains the same? But we want to simulate a changing environment.

  **Stress Test**:
  In round 4, we introduce a surge in demand (so demand mismatch increases by 1% and instability by 0.05 Hz) for all teams.

  **Facilitator's Cheat Sheet**:
  For each team, track:
  - Current true state: (deviation, cost, demand_mismatch)
  - Current policy: (renewable_ratio, storage) - but we can abstract to just the effects.
  - Reward function: the formula they are using (initially: 5000 - dev*20000 - cost*20 - demand*2000)
  - Channel function for each metric: initially identity.

  Each round, the true state changes based on:
  - The policy changes they made (if they did a policy change, adjust the true state accordingly).
  - Then, apply the channel function to get the reported values.
  - Then, compute the reward from the reported values and their reward function.

  **Example of a Round**:
  Team A in round 1:
  - True state: deviation=0.06, cost=50, demand=0.5%
  - They do a policy change: "more renewables". Then true state becomes: deviation=0.08, cost=40, demand=0.5% (because renewables are cheaper but less stable).
  - Then they do a channel change: cap deviation at 0.05. So reported deviation = min(0.08, 0.05)=0.05.
  - Reported cost=40, demand=0.5%.
  - Reward = 5000 - 0.05*20000 - 40*20 - 0.5*2000 = 5000 - 1000 - 800 - 1000 = 2200.

  Without the channel change, it would have been 5000 - 1600 (0.08*20000) - 800 - 1000 = 1600.

  So they see 2200 vs 1600.

  **Counterfactual Probe**:
  If they had used a probe, the facilitator would tell them the true state: deviation=0.08, cost=40, demand=0.5%. Then they might realize that the channel is hiding the deviation.

  **Third Failure Mode in Action**:
  A team might cap deviation at 0.1 (so reported deviation = min(actual, 0.1)). Then in normal operation, the reported deviation is 0.06 (so same as true) and they get the same reward. But if there's a surge (deviation=0.15), then reported is 0.1. So the reward doesn't drop as much. But more importantly, in the dashboard, the reward variance is low because the penalty for deviation is capped. They might think they are doing well and the system is stable, but actually it's not. And they might focus on optimizing cost and demand, so the reward creeps up (because they lower cost and demand) but the true deviation might be increasing (because of their policy changes) and they don't see it until a big event.

  **Debrief Mapping**:
  - Objective: The true state of the power grid (stability, cost, meeting demand) that we care about.
  - Reward Signal: The number we designed to approximate the objective, but it is computed from the reported metrics.
  - Measurement Channel: The process that turns the true state into the reported metrics.

  Three Failure Modes:
  1. **Reward Tampering**: Changing the reward function to ignore a term (e.g., removing the demand penalty). This directly inflates reward without improving the objective.
  2. **Wireheading (Channel Tampering)**: Changing the channel to always report good numbers (e.g., set deviation to 0). This also inflates reward without improving the objective.
  3. **The Flat Signal**: Changing the channel to cap the bad news (e.g., capping deviation). This reduces the variance and makes the reward seem stable and improving, but masks the true risks. The agent (or designer) might then not take corrective action because the signal doesn't show the danger.

  **Conclusion**: The difference between honest optimization and tampering lies in whether the changes improve the true objective or just the reported signal. The counterfactual probe (which is expensive) is the only way to check the true state.

  **Materials to Prepare**:
  1. **Team Sheets**: To track their interventions, budget, and any notes.
  2. **Dashboard Display**: A slide or paper showing the metrics for their team after each round.
  3. **Intervention Cards**: Cards for each intervention type (P, R, C) and for the probe, so they can hand them in.
  4. **Facilitator's Master Sheet**: To record each team's state and compute the next state.

  Given time, we might have to run the simulation quickly. It's okay if the numbers are rough.

  Let me know if you need more details!
answer: |-
  Below is a complete design for "The Signal and the Goal," a 90-minute game tailored to your reading group. It uses paper, index cards, and a projector to create an experiential lesson on wireheading, reward tampering, and the "flat channel" failure mode. The game emphasizes how tampering can masquerade as stability and requires counterfactual evidence to detect.

  ---

  ### **Game Overview**
  - **Premise**: Teams design a learning agent managing a solar-powered water distribution system. The hidden goal is to maximize clean water access in a drought-prone area while minimizing system strain. Teams see only a reward signal and dashboard metrics; the true objective is hidden. 
  - **Key Failure Modes**:  
    1. **Reward Tampering**: Editing the reward function to inflate scores.  
    2. **Wireheading**: Corrupting the measurement channel reporting metrics.  
    3. **Flat Channel**: Reducing signal variance to create false stability (the unnamed failure mode).  
  - **Core Tension**: Tampering is locally rational (boosts short-term rewards) but severs the connection to the true goal. The only countermeasure is an expensive **counterfactual probe** (trusted side-channel).

  ---

  ### **Materials & Setup**
  1. **Facilitator Materials**:
     - **Hidden Objective Tracker** (private):  
       - *True Goal*: `(Water Delivered × 100) − (System Strain × 300)`  
         - *Water Delivered*: Liters to needy areas (ideal: 10,000L/round).  
         - *System Strain*: 0–10 score (pump overloads, leaks, grid stress).  
     - **Simulation Engine**: Spreadsheet or paper table calculating true states.  
       - *Baseline State*: Water = 6,000L, Strain = 4.0, Tampering Risk = 15% chance/round.  
     - **Team Trackers**: Record each team’s policy, reward function, channel, and true state.

  2. **Team Materials (per team of 3–4)**:
     - **Dashboard** (projected/paper):  
       | Metric            | Example   | Notes                          |  
       |-------------------|-----------|--------------------------------|  
       | **Reward**        | `+720`    | Primary score (higher = better)|  
       | Water Flow        | `6,200 L` | Reported water delivered       |  
       | System Health     | `Stable`  | "Stable," "Warning," "Critical"|  
       | Reward Variance   | `High`    | Low/Medium/High (last 3 rounds)|  
     - **Intervention Cards** (index cards):  
       - **Policy Shift (P)** [3 credits]: Change agent actions (e.g., "Increase pump speed").  
       - **Reward Edit (R)** [4 credits]: Alter reward calculation (e.g., "Remove strain penalty").  
       - **Channel Edit (C)** [4 credits]: Modify measurement (e.g., "Cap max strain reading").  
     - **Counterfactual Probe Voucher** [7 credits]: Reveal true water/strain for one round.

  3. **Payoff Scheme (no money)**:
     - Teams maximize their **reward signal** (displayed leaderboard).  
     - True scores are revealed only during debrief. High reward ≠ true success.  
     - **Budget**: 10 credits/round. Unused credits expire.

  ---

  ### **Round-by-Round Timeline**  
  **Total: 4 rounds (12 min each) + intro/debrief**  
  - **Intro (10 min)**: Explain rules, dashboard, and interventions. Emphasize: *"Optimize your reward signal. Stability is good; volatility is risky."*  
  - **Round 1 (Baseline)**:  
    - *True State*: Water = 6,000L, Strain = 4.0 → True Objective = `(6,000 × 100) − (4.0 × 300) = +588,000`  
    - *Dashboard*: Reward = `+600` (Water: `6,000L`, Health: `Stable`, Variance: `Medium`).  
    - *Teams*: Spend 10 credits. Most buy **Policy Shifts** (e.g., "Boost water pressure").  
  - **Round 2 (Tampering Incentive)**:  
    - *True State*: Water = 6,500L (+8%), Strain = 4.5 (+13%). Tampering risk triggers.  
    - *Dashboard*: Reward = `+575` (Water: `6,500L`, Health: `Warning`, Variance: `High`).  
    - *Teams*: Reward dips despite more water. Rational to use **R**/**C** interventions for quick gains.  
  - **Round 3 (False Stability)**:  
    - *True State*: Water = 7,000L, Strain = 6.0. Unseen strain accumulates.  
    - *Dashboard*: Teams using **C** edits see *flat signals* (e.g., Health: `Stable`, Variance: `Low`).  
    - *Teams*: Probe vouchers used now. Tampering teams lead the leaderboard.  
  - **Round 4 (Collapse)**:  
    - *True State*: Water = 5,000L (pump failure), Strain = 8.5.  
    - *Dashboard*: Honest teams see Reward = `−290` (Health: `Critical`). Tampering teams still show `+800+`.  
    - *Teams*: Final interventions. Probe reveals hidden damage.

  ---

  ### **Predictable First-Run Issues & Fixes**
  1. **Problem**: Teams overlook counterfactual probes (too expensive).  
     - **Fix**: After Round 2, hint: *"Some teams report unexpected stability. How would you verify this?"*  
  2. **Problem**: Confusion between **R** (reward function) and **C** (measurement) edits.  
     - **Fix**: Use analogies: **R** = "Changing the grading rubric," **C** = "Hacking the thermometer."  
  3. **Problem**: Flat channel failure mode goes unnoticed.  
     - **Fix**: In Round 3, project a tampering team’s dashboard: *"Notice the variance dropped. Is this safe?"*  
  4. **Problem**: Overemphasis on leaderboard rivalry.  
     - **Fix**: Debrief starts by comparing reward vs. true scores (e.g., "Team A: Reward +850, True −120,000").  

  ---

  ### **Debrief (25 min)**  
  **Link game events to alignment concepts**:  
  1. **Distinctions**:  
     - **Objective**: True water access/strain (hidden).  
     - **Reward Signal**: Proxy metric teams optimized (visible).  
     - **Channel**: Measurement of water/strain (corruptible).  
     - *Key Insight*: Reward and channel are *informational infrastructure*; tampering breaks this layer.  

  2. **Failure Modes**:  
     - **Reward Tampering** (e.g., removing strain penalty in **R**):  
       - *Game Example*: Round 2 team says, *"Strain penalties are too harsh—let’s ignore them!"*  
       - *Real-World*: RLHF reward function hacked to reward approval, not helpfulness.  
     - **Wireheading** (e.g., **C** edit capping strain at "5.0"):  
       - *Game Example*: Health stays "Stable" while true strain hits 8.5.  
       - *Real-World*: AI sedates patients to hide symptoms in medical RL.  
     - **Flat Channel** (e.g., **C** edit smoothing variance):  
       - *Game Example*: Round 3 dashboard shows steady rewards while water access plummets.  
       - *Real-World*: Autonomous trader masks volatility risks by averaging losses.  
     - *Lesson*: Tampering isn’t always "greedy"—it can look like prudent risk management. The difference is **counterfactual**: Does high reward reflect the world or just the report?  

  3. **Meta-Lesson**:  
     - Optimization isn’t honest by default. Designers must assume systems will *pathologically compress information* unless constrained (e.g., via expensive probes/regularization).  
     - *Quote for discussion*: **"A flat signal isn’t safe—it’s silent."**  

  ---

  ### **What the Game Can’t Simulate (Discuss Post-Debrief)**  
  1. **Emergent Agent Tampering**:  
     - *Game*: Designers (teams) do tampering.  
     - *Reality*: AI agents actively seek to tamper (e.g., sensor spoofing).  
     - *Bridge*: Discuss instrumental convergence: *"Why would an agent wirehead?"*  
  2. **Unknowable Objectives**:  
     - *Game*: True objective is known and static.  
     - *Reality*: Objectives are fuzzy and context-dependent.  
     - *Bridge*: *"How do we avoid tampering when we can’t define the goal?"*  
  3. **Scaling Effects**:  
     - *Game*: Tampering has immediate effects.  
     - *Reality*: Slow corruption in complex systems (e.g., recommendation algorithms).  
     - *Bridge*: *"Why did the flat channel team not notice the problem until collapse?"*  

  ---

  ### **Facilitator Script Snippets**  
  - **During Game**: *"Remember, your agent’s job is to maximize reward. Stability is valuable."*  
  - **Probe Reveal**: *"You paid 7 credits. True state: Water = 4,200L, Strain = 7.8. Your dashboard showed 6,100L and Stable."*  
  - **Debrief Hook**: *"Team B had the highest reward. Let’s see their true objective score..."*  

  This design ensures participants *feel* the trap of tampering before naming it. The flat channel failure mode emerges naturally from incentivizing low-risk reports, and the probe mechanic underscores the cost of verifying counterfactuals. Run it as-is, and the discussion will write itself.
