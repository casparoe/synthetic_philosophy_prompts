  Below is the designed ten-item sorting quiz, decision tree, scoring key, and diagnostics. The quiz avoids technical terms and focuses on concrete cases. Each item has three answer options: "Yes" (the subject knows), "No" (the subject does not know), or "Depends" (the case is underdescribed; further facts are needed). The calibration case (Item 1) anchors the low/high-stakes distinction. Other items introduce unique wrinkles without reskinning standard examples.

  ---

  ### **Ten-Item Sorting Quiz**

  **Instructions:** For each scenario, select whether the subject knows the proposition in question. Answer with:  
  - **Yes** (the subject knows)  
  - **No** (the subject does not know)  
  - **Depends** (the answer hinges on further facts not specified)  

  ---

  1. **Calibration Case (Low/High Stakes Pair)**  
     Alex checks the train schedule twice and sees that Train 84 arrives at 3 PM. In **Scenario A**, Alex is taking the train for a casual outing; if it’s late, it’s a minor inconvenience. In **Scenario B**, Alex must catch the train to testify in a criminal trial; missing it means a guilty person goes free. Alex’s evidence is identical in both.  
     *Question: Does Alex know the train arrives at 3 PM?*  
     - **Option A:** Yes in both scenarios.  
     - **Option B:** Yes in A but not in B.  
     - **Option C:** Depends on further facts.  

  2. **System Holds Evidence, Stakes on Third Party, Auditor Attributor**  
     A medical AI system reviews a patient’s chart twice and concludes there is no allergy to Penicillin. The evidence is strong (99.9% accuracy). If wrong, the patient’s visiting child (who shares the allergy) could die from accidental exposure. An auditor with no stake in the outcome says, "The system knows there’s no allergy."  
     *Question: Is the auditor’s claim true?*  
     - Yes  
     - No  
     - Depends  

  3. **Stakes for Believer’s Future Self with Different Preferences**  
     Taylor, age 25, believes eating sugary snacks is harmless based on current science. Taylor doesn’t care about long-term health, but if wrong, Taylor at age 70 will suffer diabetes complications. The stakes are high for future Taylor, not present Taylor.  
     *Question: Does present Taylor know the snacks are harmless?*  
     - Yes  
     - No  
     - Depends  

  4. **Purely Epistemic Stakes (No Practical Cost)**  
     Sam is writing a math textbook. They believe Theorem X is true (based on a peer-reviewed proof). If Theorem X is false, it will invalidate 1,000 derivations in the book, causing widespread academic confusion—but no practical or moral harm (e.g., no one’s safety or finances are at risk).  
     *Question: Does Sam know Theorem X is true?*  
     - Yes  
     - No  
     - Depends  

  5. **Unknown Stakes (Secret Wager)**  
     Jamie believes it won’t rain today (reliable forecast, sunny sky). Unbeknownst to Jamie, a stranger has bet $1 million that Jamie will *not* carry an umbrella. If it rains and Jamie is unprepared, the stranger wins. Jamie cannot discover the bet.  
     *Question: Does Jamie know it won’t rain?*  
     - Yes  
     - No  
     - Depends  

  6. **Stakes Deliberately Created by Betting**  
     Morgan believes a coin is fair after 100 flips (50 heads/50 tails). Morgan bets $500,000 on heads in the next flip. If wrong, they are bankrupt.  
     *Question: After betting, does Morgan know the coin is fair?*  
     - Yes  
     - No  
     - Depends  

  7. **Stakes Imposed Without Choice**  
     Riley is hiking and must cross a ravine on an old rope bridge. They believe it’s safe (it held earlier, looks intact). If wrong, they fall and die. Riley didn’t choose this path; it’s the only way back.  
     *Question: Does Riley know the bridge is safe?*  
     - Yes  
     - No  
     - Depends  

  8. **Stakes High for One Party, Low for Another with Opposed Interests**  
     Casey believes a warehouse is empty (security feed shows no one inside). If wrong, Casey’s rival, Jordan, is hiding there and will steal Casey’s inheritance. For Casey, the stakes are low (mild annoyance); for Jordan, they’re high (escaping poverty). Both outcomes hinge on the warehouse being empty.  
     *Question: Does Casey know the warehouse is empty?*  
     - Yes  
     - No  
     - Depends  

  9. **Minute Probability of Huge Stakes vs. Substantial Probability of Modest Stakes**  
     Dr. Lee believes a chemical is safe. Evidence shows a 1 in 1 billion chance it’s lethal (killing thousands) and a 10% chance it’s a mild irritant (causing rashes). The lethal outcome has huge stakes; the irritant has modest stakes.  
     *Question: Does Dr. Lee know the chemical is safe?*  
     - Yes  
     - No  
     - Depends  

  10. **Many Small Decisions with Compounding Errors**  
      Taylor tightens 1,000 bolts on an aircraft wing. Each bolt has a 1% failure risk. If one fails, it’s harmless (minor vibration); if all fail, the wing detaches mid-flight. Taylor believes each bolt is secure after tightening (standard method, no special checks).  
      *Question: For any single bolt, does Taylor know it’s secure?*  
      - Yes  
      - No  
      - Depends  

  ---

  ### **Decision Tree**
  The tree branches through the logical space of views on practical stakes and knowledge. Branch nodes are based on philosophical distinctions, not named theories. Leaves include the requested views and an "unnamed" category for unexplored positions.  

  ```
  1. Does any practical factor affect the *truth* of a knowledge attribution?  
     │  
     ├─ No → Classical invariantism (pragmatic/error-theoretic treatment).  
     │  
     └─ Yes →  
          │  
          2. Whose situation does the difference track?  
          │  
          ├─ Subject’s situation →  
          │    │  
          │    3. Does the difference lower standards or only raise them?  
          │       │  
          │       ├─ Can only raise standards (asymmetric) → Subject-sensitive invariantism.  
          │       │  
          │       └─ Can raise or lower standards (symmetric) → Interest-relative invariantism (Fantl–McGrath).  
          │  
          ├─ Attributor’s situation → Attributor contextualism (Cohen–DeRose).  
          │  
          └─ Assessor’s situation →  
               │  
               4. Does the difference lie in the standard or the content?  
                  │  
                  ├─ Standard → Assessment-sensitive relativism.  
                  │  
                  └─ Content → Contrastivism.  
          │  
          └─ (If none of the above) →  
               5. Where does the encroachment occur?  
                  │  
                  ├─ Belief or actionability (not knowledge) → Stakes affect action/belief, not knowledge.  
                  │  
                  ├─ Justification → Unnamed view A (encroachment on justification).  
                  │  
                  └─ Credence threshold → Credal threshold view.  
          │  
          └─ (Other paths) →  
               6. How do practical factors operate?  
                  │  
                  ├─ By making error possibilities relevant → Relevant-alternatives contextualism.  
                  │  
                  └─ By cost of error (not probability-weighted) → Unnamed view B.  
                  │  
                  └─ By cost discounted by probability → Unnamed view C.  
  ```

  **Leaves Covered:**  
  - Classical invariantism  
  - Relevant-alternatives contextualism  
  - Attributor contextualism  
  - Subject-sensitive invariantism  
  - Interest-relative invariantism (Fantl–McGrath)  
  - Stakes affect belief/actionability but not knowledge  
  - Credal threshold view  
  - Assessment-sensitive relativism  
  - Contrastivism  
  - Unnamed A: Encroachment on justification only  
  - Unnamed B: Cost alone (no probability weighting)  
  - Unnamed C: Cost discounted by probability  

  ---

  ### **Scoring Key**  
  Map answer patterns to leaves using the decision tree. Patterns are denoted as tuples (Item1, Item2, ..., Item10), with options:  
  - For Item 1: A, B, or C  
  - For Items 2–10: Y (Yes), N (No), D (Depends)  

  **Coherent Patterns and Corresponding Leaves:**  
  - **Classical invariantism (pragmatic):** All "Y" or "N" based on evidence alone; stakes never affect truth.  
    - *Signature:* Item1=A (knows in both), Items 2–10: Mostly "Y" (unless evidence is weak).  
  - **Relevant-alternatives contextualism:** Stakes affect which error possibilities are relevant.  
    - *Signature:* Item1=B (stakes matter), Item5=Y (unknown stakes irrelevant), Item9=D or N (minute/huge stakes may make errors relevant).  
  - **Attributor contextualism:** Truth depends on attributor’s context.  
    - *Signature:* Item2=N (auditor’s claim false if stakes high for third party), Item8=D or N (depends on attributor’s context).  
  - **Subject-sensitive invariantism (SSI):** Truth tracks subject’s stakes asymmetrically (high stakes raise bar).  
    - *Signature:* Item1=B, Item3=Y (future stakes irrelevant), Item6=N (deliberate stakes raise bar), Item7=N (imposed stakes raise bar).  
  - **Interest-relative invariantism (IRI):** Truth tracks subject’s stakes symmetrically (cost-probability interplay).  
    - *Signature:* Item1=B, Item9=Y (huge stakes discounted by low probability), Item10=N (compounding errors raise stakes).  
  - **Stakes affect action/belief, not knowledge:** Knowledge is invariant; stakes affect rationality of acting.  
    - *Signature:* Item1=A, Item6=N or D (betting affects actionability), Item7=N or D (imposed stakes affect action).  
  - **Credal threshold view:** Knowledge requires credence above a stakes-set threshold.  
    - *Signature:* Item4=N (epistemic stakes raise threshold), Item9=D or N (probability matters directly).  
  - **Assessment relativism:** Truth depends on assessor’s context.  
    - *Signature:* Item2=D (assessor’s context matters), Item8=D (opposed interests require assessor specification).  
  - **Contrastivism:** Knowledge is contrastive (e.g., "knows P rather than Q").  
    - *Signature:* Item10=Y (for single bolt, contrast with "not secure" is fine), Item8=D (depends on contrast class).  
  - **Unnamed A (justification encroachment):** Stakes affect justification, not knowledge.  
    - *Signature:* Item1=B, Item4=N (epistemic stakes weaken justification).  
  - **Unnamed B (cost alone):** Cost of error matters, not probability.  
    - *Signature:* Item9=N (huge stakes dominate), Item6=N (deliberate cost matters).  
  - **Unnamed C (cost discounted by probability):** Expected cost (cost × probability) matters.  
    - *Signature:* Item9=Y (low expected cost), Item10=N (high cumulative cost).  

  **Unstable Patterns (Incoherent on Reflection):**  
  - **Item1=A + Item6=N + Item7=N:** Claims stakes never matter (A) but denies knowledge in high-stakes bets (N). Fix: Admit stakes affect truth (choose B for Item1) or invoke pragmatics (e.g., classical invariantism with Item6=D).  
  - **Item4=Y + Item9=Y + Item10=Y:** Affirms knowledge under pure epistemic stakes (Y) but denies that minute/huge stakes (Y) or compounding errors (Y) undermine it, ignoring stakes entirely. Fix: Admit stakes can matter (e.g., Item9=N).  
  - **Item2=Y + Item8=Y + No attributor-dependence:** Asserts auditor’s claim is true (Y) and Casey knows (Y) without specifying attributor/assessor. Fix: Choose "Depends" for Item2/Item8 or adopt contextualism/relativism.  

  **Coherent but Unexplored/Unnamed Views:**  
  - **Unnamed A (justification encroachment):** Unexplored but coherent; stakes raise justificatory bar.  
  - **Unnamed B (cost alone):** Unattractive (ignores probability) but coherent; e.g., denies knowledge in Item9.  
  - **Unnamed C (cost × probability):** Unexplored; e.g., Item9=Y (low expected cost) but Item10=N (high cumulative cost).  

  **Pairs of Leaves the Quiz Cannot Pry Apart:**  
  - **Subject-sensitive invariantism (SSI) vs. Interest-relative invariantism (IRI):** Collapse under all items. Both track subject’s stakes and answer identically (e.g., Item1=B, Item6=N). *Separating case needed:* Introduce a low-stakes scenario with a high probability of small error (e.g., "Believer has 10% chance of losing $10; stakes are low. Does they know?"). SSI may say "yes" (asymmetric raise-only), while IRI may say "no" if expected cost is high relative to interests.  
  - **Attributor contextualism vs. Assessment relativism:** Quiz avoids disagreement cases. Both answer Item2 with "N" or "D" and Item8 with "D". *Separating case needed:* Introduce a disagreement vignette (e.g., "Low-stakes attributor says 'knows,' high-stakes assessor denies it. Who is correct?"). Attributor contextualism says attributor; relativism says assessor.  
  - **Contrastivism vs. Relevant-alternatives contextualism:** Both may use "Depends" for Item8/Item10. *Separating case needed:* Specify a contrast class (e.g., "Does Casey know the warehouse is empty *rather than occupied by Jordan?*"). Contrastivism requires this; relevant-alternatives does not.  

  ---

  ### **Diagnostics**  
  - **Internal Stability:** Unstable patterns (above) reveal inconsistencies, e.g., denying stakes matter in Item1 but affirming in Item6.  
  - **Unexplored Views:** "Unnamed" leaves are coherent but underdeveloped (e.g., justification-only encroachment).  
  - **Indistinguishable Pairs:** SSI/IRI and attributor/relativism collapse; use the suggested cases to separate them in discussion.  
  - **Anchoring:** Item1 (calibration) anchors responses—those choosing B are stakes-sensitive; A/C are invariantist-leaning.  

  This instrument isolates intuitions about practical stakes without theory-laden questions. For your reading group, tally answers and use the scoring key to sort members into the decision tree. Discuss indistinct pairs with the suggested cases.
