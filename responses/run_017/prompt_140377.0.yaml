prompt: |-
  I do freelance data work — a couple of hospitals, a university admissions office, a school district, a few startups — and I keep hitting the same annoying pattern: the total says one thing, every subgroup says the other. A statistician friend calls it Simpson's paradox, which as far as I can tell is a name and not an explanation. Here are the calls I've actually made, and I want to know whether one rule is behind them or whether I'm quietly asking two different questions.

  1. Hospital compares two drugs for a skin infection. Severity is recorded at intake, before anyone chooses a drug. Severe: new drug 24/80 (30%), old drug 6/40 (15%). Mild: new 96/100 (96%), old 285/300 (95%). Overall: new 120/180 (67%), old 291/340 (86%). I told them the new drug is better, full stop — the total only looks bad for it because doctors save it for the worst cases.

  2. Randomized trial of two physio programs, 500 patients each. A: 400 recovered (80%). B: 350 (70%). Then someone split by whether the patient was pain-free at week two, which the program itself affects. Pain-free: A 380/400 (95%), B 245/250 (98%). Not pain-free: A 20/100 (20%), B 105/250 (42%). B wins both rows. I still said A is better and to ignore the split.

  3. University admissions. Men 58/200 admitted (29%), women 24/140 (17%). But inside each division women do better: Division 1, men 8/100 (8%), women 12/120 (10%); Division 2, men 50/100 (50%), women 12/20 (60%). Here I won't let the division numbers dissolve the headline gap — the gap is the thing I care about — but I also don't want to say any division is biased, and I genuinely can't tell whether those two stances fit together. This is the one I go back and forth on.

  4. Reading programs. Published trial, population was 60% weak readers: P 56% pass overall, Q 62%. By level: weak, P 30/100 vs Q 45/100; strong, P 95/100 vs Q 88/100. My district's classes are 80% strong readers, so I threw out the published total, re-weighted the two rows to my own mix, and got P 82% vs Q 79%. Felt right, but I can't say why it differs from case 1, where I also threw out the total and used the rows.

  5. Startup checkout-page A/B test, 20,000 users per arm: N converts 6.0%, M 5.0%. An analyst sliced it forty ways and found slices where M wins, including one with six people in it. I said none of that counts. But I dont have a principled test for when a subgroup reversal is real and when it's noise-hunting.

  My working rule has been: trust the split, unless the thing you split on was caused by the treatment, in which case trust the total. Case 3 breaks that, case 4 needs something about whose population you're weighting by, and case 5 needs a size-or-robustness test I can't state.

  So: is there one principle here, or am I collapsing two questions I should keep apart? Give me something precise enough that a client could apply it without me in the room, tell me honestly which of my verdicts it forces me to drop, and if there are two candidate rules that both fit the five cases above, give me the case that would tell them apart. Also tell me what your rule says about two cases I keep dodging: (a) a reversal where nobody left on the team knows whether the variable we'd split on was measured before or after the treatment went out, because the documenation is gone; (b) the same reversal, except the variable is a noisy proxy, like a severity score that's right maybe 70% of the time.

  No citations or reading lists please, I can't get at them anyway — just the rule and why it holds.
reasoning: |-
  We are facing Simpson's paradox in multiple scenarios. The key is to determine when to trust the overall rate and when to trust the subgroup rates. The principle I propose is based on causal reasoning: we want to compare the treatment effect without the influence of confounding variables. The critical factor is the timing and the nature of the variable we use for splitting (the stratifying variable).

  **The Rule:**

  1. **Stratify by pre-treatment confounding variables:** If the variable used for splitting (stratification) is a pre-treatment confounder (i.e., it affects both the treatment assignment and the outcome, and is measured before treatment), then the subgroup analysis (the stratified analysis) is more reliable. The overall rate might be misleading because it does not account for the imbalance in the confounder.

  2. **Do not stratify by post-treatment variables:** If the variable is affected by the treatment (i.e., a post-treatment variable), then the overall rate is more reliable because stratifying by a post-treatment variable can introduce bias (it may block part of the treatment effect or create a spurious association).

  3. **Weighted averages for different populations:** When we are interested in a specific population, we should re-weight the subgroup rates by the distribution of the confounder in that population. This is especially important when the population of interest has a different confounder distribution than the study population.

  4. **Statistical significance and sample size:** For subgroup analyses, we must consider the sample size. A reversal in a very small subgroup is likely due to noise. We should only consider subgroups that are large enough to provide reliable estimates (e.g., using a statistical test and considering the power).

  Now, let's apply this rule to each of the five cases and the two additional scenarios.

  **Case 1: Hospital drug comparison**

  - Severity is recorded at intake (pre-treatment). It is a confounder because doctors choose the drug based on severity (so severity affects treatment assignment) and severity affects the outcome.
  - **Rule says:** Trust the subgroup analysis (by severity). The overall rate is misleading because of the imbalance in severity (the new drug was given to more severe cases). 
  - **Verdict:** Your call was correct.

  **Case 2: Physio programs**

  - The split is by "pain-free at week two", which is affected by the treatment (the physio program). Therefore, it is a post-treatment variable.
  - **Rule says:** Do not condition on a post-treatment variable because it breaks the randomization and can introduce bias. Trust the overall rate (which shows A is better).
  - **Verdict:** Your call was correct.

  **Case 3: University admissions**

  - The split is by division. The division is a pre-treatment variable (applicants choose which division to apply to, and the division is fixed before the admission decision). However, note that the overall rate (men 29% vs women 17%) shows a gap in favor of men. But within each division, women have a higher admission rate. This is a classic Simpson's paradox.
  - The key is: what is the causal question? If we are interested in the overall admission rate by gender, then the overall rate reflects the reality of the admission process. However, if we suspect that the choice of division is influenced by gender (i.e., gender affects which division an applicant applies to) and that divisions have different difficulties of admission, then the overall rate is confounded by division. 
  - But note: the university might argue that it is not responsible for the fact that women apply more to a division with a lower admission rate. However, if we want to know if there is gender bias in the admission process within each division, then we look at the stratified analysis. The stratified analysis shows no bias (in fact, a slight advantage to women). 
  - The rule: Because division is a pre-treatment confounder (gender may influence division choice, and division influences admission), we should adjust for it. However, if we are interested in the overall effect (which includes the impact of the confounder), then the overall rate is the one to report. But if we want to know the direct effect of gender on admission (controlling for division), then we use the stratified analysis.
  - **Dilemma:** The two stances are answering different questions. The overall rate answers: "What is the chance of admission for a random man vs a random woman?" The stratified analysis answers: "Within a given division, is there a gender bias?" 
  - **Verdict:** Both can be true at the same time. However, if the university is accused of gender bias, the stratified analysis is more relevant because it controls for the applicant's choice of division. But if the university is concerned about the overall representation, then the overall rate is what matters. 
  - **Adjustment:** In this case, we should report both and explain the discrepancy. However, if we must choose one, then for the purpose of assessing bias in the admission process, we should condition on division (because division is a legitimate confounder that should be adjusted for). Therefore, we would conclude that there is no evidence of bias against women in the admission process by division. But note: the overall gap is real and might be due to women applying more to a more competitive division. The university might want to investigate why that is.

  **Case 4: Reading programs**

  - The split is by reader level (weak vs strong). This is a pre-treatment variable (it is a baseline characteristic). The published trial overall rate is for their population (60% weak readers). But your district has a different population (80% strong readers). 
  - **Rule says:** Because reader level is a pre-treatment confounder (it affects the outcome and may be related to the program assignment if the trial was not randomized, but note the trial is randomized so assignment is independent of reader level? Actually, in a randomized trial, the confounder is balanced on average. However, in this case, we are re-weighting because we have a different population). 
  - The principle: When the population of interest (your district) has a different distribution of the confounder (reader level) than the trial, we should re-weight the subgroup results by the confounder distribution in the target population. 
  - **Verdict:** Your approach was correct. You re-weighted the subgroup rates by your district's reader level distribution. This gives an estimate of what the overall pass rate would be in your district for each program.

  **Case 5: Startup checkout-page A/B test**

  - The split is done post-hoc and in many ways (data dredging). The overall test (which is large: 20,000 per arm) shows a clear advantage for N (6% vs 5%). The subgroup reversals are in very small subgroups (one with only six people) and are likely due to chance.
  - **Rule says:** We must consider the sample size and the fact that the subgroups were not pre-specified. We should not trust a subgroup reversal that is not statistically significant and especially when the subgroup is very small. Also, the overall result is from a randomized experiment and is the primary analysis. 
  - **Verdict:** Your call was correct.

  **Summary of Verdicts:**

  - Case 1: Correct (trust subgroups)
  - Case 2: Correct (trust overall)
  - Case 3: We need to clarify the question. For assessing bias in the admission process within divisions, the subgroups are more reliable. However, the overall gap is a real phenomenon that the university may want to address. But the rule says: if the stratifying variable (division) is a pre-treatment confounder (which it is), then we should adjust for it to estimate the direct effect of gender on admission. Therefore, we would conclude that within each division, women are not disadvantaged (in fact, they have a slight advantage). But note: the overall gap is not due to bias in the admission process but due to the application patterns.
  - Case 4: Correct (re-weight subgroups by target population)
  - Case 5: Correct (ignore small subgroups)

  **Cases where you might need to drop a verdict:**

  In Case 3, if you previously told the client to ignore the subgroup analysis and focus on the overall gap as evidence of bias, that would be incorrect if the goal is to assess bias in the admission process. The rule forces us to adjust for pre-treatment confounders (like division) when estimating causal effects. Therefore, we must acknowledge that the within-division analysis is more appropriate for assessing bias in the admission decision.

  **Additional Scenarios:**

  **(a) Reversal but unknown timing of the variable:**

  - If we don't know whether the variable was measured before or after treatment, we cannot apply the rule with certainty. In such a case, we must rely on domain knowledge to guess the likely timing. If we cannot determine the timing, we should be cautious. 
    - If the variable is likely to be a pre-treatment confounder (e.g., demographic, baseline health status), then trust the subgroup analysis. 
    - If the variable is likely to be affected by the treatment (e.g., an intermediate outcome), then trust the overall.
    - If we have no idea, we should present both and note the ambiguity. In practice, we might avoid conditioning on that variable.

  **(b) Reversal with a noisy proxy:**

  - If the stratifying variable is a noisy proxy for a pre-treatment confounder (e.g., a severity score that is only 70% accurate), then the subgroup analysis might still be preferable to the overall analysis, but it will be attenuated (the estimated subgroup effects will be biased toward zero). 
  - The rule still holds: if the intended variable (the true confounder) is pre-treatment, then we want to adjust for it. However, because we only have a proxy, the adjustment will be imperfect. 
  - In this case, we might still use the subgroup analysis (with the proxy) but acknowledge that the true effect might be stronger than what we observe. Alternatively, we could use methods that account for measurement error, but that is more complex. 
  - If the noise is extreme, the subgroup analysis might become unreliable. But in general, adjusting for a proxy is better than not adjusting at all if the confounder is important.

  **One Principle or Two?**

  The core principle is: **adjust for pre-treatment confounders and avoid adjusting for post-treatment variables.** This is a single principle. The other considerations (re-weighting for a target population and sample size for subgroups) are extensions.

  In Case 3, the confusion arises because the question of interest (overall admission rate vs within-division bias) is two different questions. The rule of adjusting for confounders applies when we want to estimate the direct effect of the treatment (in this case, gender on admission) without the influence of the confounder (division). But if we are interested in the total effect (which includes the effect of gender on division choice and then on admission), then we use the overall rate. So it's two questions:

  1. **Total effect:** What is the overall difference in admission rates between men and women? (Answer: overall rate)
  2. **Direct effect (controlling for division):** Within a given division, is there a difference in admission rates by gender? (Answer: subgroup analysis)

  Therefore, the rule is unified, but we must be clear about the question.

  **A Test Case to Differentiate Two Rules?**

  Suppose we have two candidate rules:

  - Rule A: Always adjust for pre-treatment variables.
  - Rule B: Adjust only if the variable is a confounder (i.e., it is associated with both the treatment and the outcome).

  In Case 3, note that the division is associated with both gender (treatment) and admission (outcome). So both rules would adjust. 

  But consider a case where we have a pre-treatment variable that is not a confounder (e.g., it is only associated with the treatment but not the outcome, or only with the outcome but not the treatment). Then Rule A would say adjust, but Rule B would say don't adjust because it's not a confounder. 

  Example: In a randomized trial, we know that the treatment assignment is independent of all pre-treatment variables. Therefore, pre-treatment variables are not confounders (because they are balanced by randomization) and adjustment is not necessary (though it may improve precision). However, if the trial is small, there might be chance imbalance, and then we might adjust to reduce bias. But in large trials, the overall rate is unbiased.

  So a test case:

  - **Case 6:** A randomized trial of two drugs (A and B) with 1000 patients per arm. Overall recovery: A 70%, B 60%. We split by a pre-treatment variable (say, patient's favorite color: blue or green). We see: 
    - Blue: A 75% (375/500), B 65% (325/500)
    - Green: A 65% (325/500), B 55% (275/500)
    - Overall: A 70% (700/1000), B 60% (600/1000)
    - The subgroup analysis shows A is better in both. But note: favorite color is not a confounder because it is not associated with the outcome? Actually, we see that in both groups, A is better. But what if we see a reversal? 

  Suppose:

    - Blue: A 80% (400/500) vs B 85% (425/500) -> B wins
    - Green: A 60% (300/500) vs B 35% (175/500) -> A wins
    - Overall: A 70% (700/1000) vs B 60% (600/1000) -> A wins

  Now, because the trial is randomized, the pre-treatment variable (favorite color) is balanced between the two groups. Therefore, it is not a confounder. The reversal is due to chance. We should not adjust for it because it is not a confounder. The overall rate is unbiased and should be trusted. 

  - Rule A (always adjust for pre-treatment variables) would lead us to condition on favorite color and report that the effect is reversed in the subgroups. This would be misleading because the variable is not a confounder and the reversal is spurious.
  - Rule B (adjust only for confounders) would not adjust because favorite color is not a confounder (it doesn't affect the outcome? Actually, in this example, the outcome rates are different by color: for blue, the recovery rate in the control group (B) is 85% and for green in the control group is 35%. So color is associated with the outcome. But is it associated with treatment? In a randomized trial, treatment is independent of color. So it's not a confounder because it doesn't affect treatment assignment (it's balanced). Therefore, Rule B says: do not adjust.

  Thus, the better rule is: **Adjust for a pre-treatment variable if and only if it is a confounder (i.e., it is associated with the treatment assignment and is a risk factor for the outcome).** In randomized trials, pre-treatment variables are not confounders (on average) because of randomization, so we don't need to adjust. But in observational studies (like Case 1 and Case 3), we must adjust for confounders.

  However, in Case 3, the university admission is an observational study: the treatment (gender) is not randomly assigned, and the confounder (division) is associated with both gender and admission. So we adjust.

  **Final Rule:**

  In a non-randomized setting (observational study), to estimate the causal effect of a treatment, we must adjust for pre-treatment confounders. In a randomized trial, the overall rate is unbiased and we do not need to adjust for pre-treatment variables unless there is a specific reason (like improving precision or correcting for chance imbalance). However, we should never adjust for post-treatment variables.

  Therefore, the rule can be stated as:

  - **Step 1:** Determine if the study is randomized or observational.
  - **Step 2:** If randomized, the overall rate is the primary estimate. Subgroup analyses by pre-treatment variables are optional (for exploring effect modification) but not necessary for the main effect. However, if a subgroup reversal occurs in a large, pre-specified subgroup, it might indicate effect modification. But the overall effect is still valid for the population studied.
  - **Step 3:** If observational, identify pre-treatment confounders (variables that affect both treatment assignment and the outcome). Adjust for these confounders (via stratification or other methods) to get an unbiased estimate of the treatment effect. The overall rate may be confounded and should not be trusted.
  - **Step 4:** Never condition on a variable that is affected by the treatment (post-treatment) because it can introduce bias.
  - **Step 5:** When applying results to a new population, re-weight the subgroup effects by the confounder distribution in the target population (if the confounder distribution differs).
  - **Step 6:** For subgroup analyses, require a reasonable sample size and pre-specification to avoid data dredging. Small subgroups with reversals are likely due to chance.

  Now, applying this to the two additional cases:

  **(a) Unknown timing:**
  - If we don't know if the variable is pre or post, we cannot be sure. We must try to determine it from context. If impossible, we avoid conditioning on that variable and rely on the overall rate (if the study is randomized) or we acknowledge the limitation (if observational).

  **(b) Noisy proxy:**
  - If the variable is a noisy proxy for a pre-treatment confounder, then we still adjust for it in an observational study. The adjustment will be imperfect (the estimated effect will be biased, but less biased than without any adjustment). We should note the limitation.

  **Conclusion:**

  There is one overarching principle: adjust for pre-treatment confounders and avoid adjusting for post-treatment variables. The rule unifies the cases, but the application depends on the study design (randomized vs observational) and the nature of the variable. 

  In your verdicts, Case 3 requires adjustment for division (because it's an observational study and division is a confounder). Therefore, you should conclude that within each division, there is no bias against women. The overall gap is due to the fact that women apply more to the division with a lower admission rate. However, if the university wants to increase the overall admission rate of women, they might need to encourage women to apply to the less competitive division or reevaluate the admission criteria in Division 1.
answer: |-
  ### The Unified Rule for Simpson's Paradox Reversals

  **Rule:** Trust the subgroup comparison if the splitting variable is a *pre-treatment confounder* (measured before treatment and affecting both treatment choice and outcome). Trust the total comparison if the splitting variable is *post-treatment* (influenced by the treatment) or *non-confounder* (unrelated to treatment assignment). For population generalizations, re-weight subgroups by the target population's distribution. Ignore subgroups smaller than a pre-specified size (e.g., <100 units or <5% of sample) to avoid noise.

  #### Why this holds:
  - **Pre-treatment confounders** (e.g., disease severity, division choice) create imbalanced groups. Subgroup analysis corrects for this bias.
  - **Post-treatment variables** (e.g., pain status at week 2) are distorted by the treatment itself. Conditioning on them hides the treatment's true effect.
  - **Small subgroups** are vulnerable to noise; reversals there are likely spurious.
  - **Re-weighting** ensures estimates match your population of interest.

  ---

  ### Your Cases Re-Evaluated
  1. **Drugs for skin infection**  
     - **Verdict:** Correct (trust subgroups).  
     - **Why:** Severity is pre-treatment (recorded at intake). Doctors assign drugs based on severity, making it a confounder. Subgroups show the new drug is better; the total is misleading due to imbalance.

  2. **Physio programs**  
     - **Verdict:** Correct (trust total).  
     - **Why:** Pain-free status at week 2 is post-treatment (affected by the program). Conditioning on it introduces bias. Total shows Program A is better.

  3. **University admissions**  
     - **Verdict:** **Incorrect**—you should trust the subgroups.  
     - **Why:** Division is pre-treatment (applicants choose pre-admission) and a confounder (men apply more to Division 2, which admits more). Subgroups show no bias against women; the total gap stems from application patterns.  
     - **Your stances reconciled:** The headline gap is real *for applicants*, but it reflects pre-existing choices, not bias in admissions decisions. To assess fairness *within the process*, subgroups are appropriate.

  4. **Reading programs**  
     - **Verdict:** Correct (re-weight subgroups).  
     - **Why:** Reader level (weak/strong) is pre-treatment. The published total applied to their population (60% weak); you re-weighted to your population (80% strong). This avoids generalizing the wrong total.

  5. **Checkout-page A/B test**  
     - **Verdict:** Correct (ignore subgroups).  
     - **Why:** The reversal in tiny subgroups (e.g., 6 people) is noise. Enforce a size rule (e.g., subgroups <100 users ignored).

  **Verdict dropped:** Case 3. The rule forces you to trust subgroups for admissions bias assessment. The total gap exists but is driven by applicant behavior, not discrimination.

  ---

  ### Handling Your Dodged Cases
  **(a) Unknown timing of splitting variable**  
  - **Rule:** Default to the total. If timing is unclear, the total is safer because post-treatment splits are common and riskier. Investigate context clues (e.g., "severity score" is likely pre-treatment; "symptom improvement" likely post-treatment). If unresolved, report both but caution that the subgroup may be biased.

  **(b) Noisy proxy (e.g., 70%-accurate severity score)**  
  - **Rule:** Trust subgroups if proxies are pre-treatment, but acknowledge uncertainty. Noisy proxies dilute reversals but don’t reverse direction unless error is extreme. State: "Subgroup results assume severity is pre-treatment; noise may weaken conclusions."

  ---

  ### One Principle or Two?
  This is **one principle** (confounder timing) with two extensions:  
  1. **Weighting** for population differences (Case 4).  
  2. **Size thresholds** for reliability (Case 5).  

  No case forces splitting the principle—all resolve to timing/size/weighting.

  ### Test Case to Distinguish Competing Rules
  Suppose two rules:  
  - **Rule X:** "Always trust pre-treatment subgroups."  
  - **Rule Y:** "Trust subgroups only for confounders (affect treatment and outcome)."  

  **Test Case:** A randomized drug trial. Pre-treatment variable: Zodiac sign (not a confounder; random and unrelated to outcome).  
  - Overall: Drug A better (55% vs 45%).  
  - Subgroups: Drug B better for Capricorns (60% vs 40%), but Capricorns are 5% of the sample.  
  - **Rule X** falsely trusts the subgroup (noise). **Rule Y** (or our rule) trusts the total, ignoring non-confounders.  
  - **Result:** Rule Y (and our rule) wins. Zodiac isn’t a confounder, so the reversal is noise.
