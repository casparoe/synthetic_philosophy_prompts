  Okay, let me start by unpacking the user's query. They're a metaphysics professor who also works with an art collection committee. They've noticed a pattern where in discussions about objects like a statue and the clay lump, one is prioritized over the other depending on context—like in conservation vs. art history. The key is that the "serious" role flips based on the conversation, and both aspects are necessary but only one is foregrounded at a time.

  First, I need to identify the core phenomenon. It's not just about coincidence or constitution; it's the dynamic prioritization. The user mentions existing theories like causal redundancy or verbal disputes, but those don't capture the flip. So, I should look for concepts that address context-dependent salience.

  I recall terms like "conceptual relativism" or "contextual ontology," but those might be too broad. The user wants something specific to the allocation of explanatory roles. Maybe "explanatory priority" from metaphysics, but that's static. The dynamic shift is crucial here. 

  Then there's the idea of "pragmatic encroachment" in epistemology, where practical concerns affect knowledge attributions. Could this apply to ontology? The user's examples show practical needs shaping what's considered real. For instance, conservators focus on material for preservation, while art historians focus on the artwork for historical context. 

  The term "contextual emergence" from philosophy of science comes to mind. It describes how different levels of description become relevant in different contexts. In the sculpture example, the physical object is one level, the artwork another. Each context highlights one level as primary without denying the other.

  I also think about "dialetheism" or "complementarity," but those might not fit. Complementarity in quantum mechanics allows for mutually exclusive descriptions that are both necessary. Similarly, in the user's cases, both the material and the form are essential but emphasized differently based on context. 

  The user mentioned that neither aspect can be deleted, which points to mutual ontological interdependence. So the phenomenon involves both dynamic prioritization and interdependence. Terms like "complementary descriptions" or "perspectival dualism" might work. The art historian and conservator have different perspectives, each valid within their domain.

  Looking at nearest candidates: 
  - "Grounding" in metaphysics usually has a fixed hierarchy, but here the hierarchy flips. 
  - "Conceptual schemes" involve different categorizations, but the flip happens within the same conversation. 
  - "Pragmatic ontology" focuses on how use determines what exists, which is close but might reduce it to utility, whereas the user notes both aspects are ontologically necessary.

  So, coining a term: "Contextual Ontological Priority" (COP). Define it as the assignment of explanatory or ontological primacy to one of two co-constitutive aspects of an entity based on situational demands, where the priority shifts without eliminating the secondary aspect's necessity. 

  A borderline case: A river as a geographical feature vs. a legal boundary. In a flood management meeting, the physical water flow is primary; in a property dispute, the legal boundary is. Both aspects exist, but the priority flips. A good definition should determine whether both aspects are always present even when one is backgrounded.
answer: |-
  What you're describing is a fascinating and under-theorized phenomenon—let's carve it precisely. It's **not** mere coincidence, constitution, or verbal dispute, but a **dynamic, context-driven allocation of ontological or explanatory priority** between co-present entities. Here's the dissection:

  ### Core Phenomenon: **Contextual Ontological Priority (COP)**
  - **Definition**: The assignment of explanatory primacy or "seriousness" to one of two materially coincident entities (or aspects) based on situational demands, where the priority *flips* across contexts while *both remain indispensable*. The "demoted" entity isn't eliminated but shifts to a background role necessary for the other's intelligibility.
  - **Key Features**:
    1. **Asymmetry Allocation**: One entity is foregrounded as the "real" actor (e.g., alloy in conservation, artwork in cataloging).
    2. **Functional Flip**: Priority reverses seamlessly when conversational goals change (e.g., from preservation to art-historical narrative).
    3. **Interdependence**: The backgrounded entity remains essential for the foregrounded one to function (e.g., metal’s history dates the artwork; artwork defines "damage" to the metal).
    4. **Salience-Driven Justification**: Metaphysical claims (e.g., "only the alloy exists") are retroactive rationalizations of the *currently salient role*, not foundational truths.

  ### Nearest Candidates & Why They Fall Short:
  1. **Grounding/Reductionism** (e.g., "the statue is nothing over and above the clay"):  
     - *Problem*: Assumes a *fixed* hierarchical relationship. Your cases show *bidirectional* reduction: conservators reduce statue to alloy; art historians reduce alloy to artwork-support. The "nothing over and above" claim flips direction contextually.

  2. **Conceptual Relativism / Verbal Disputes** (e.g., "it's just different ways of talking"):  
     - *Problem*: Dismisses the phenomenon as linguistic. But both roles have practical *causal* work (e.g., alloy corrodes; artwork has provenance). The flip isn't arbitrary—it tracks institutional goals (conservation vs. curation).

  3. **Causal Exclusion / Redundancy** (e.g., "if both exist, one is epiphenomenal"):  
     - *Problem*: Assumes only one entity can "do the work." In COP, *both* entities are causally relevant, but their *explanatory visibility* alternates. The alloy’s corrosion matters to conservators; the artwork’s identity matters to historians. Neither is redundant.

  4. **Hylomorphic Flexibility** (Aristotelian matter/form):  
     - *Problem*: While matter/form distinctions are central, COP shows that *which pole is ontologically primary* (matter or form) isn't fixed—it depends on whether the context values persistence-through-change (alloy) or identity-through-replacement (artwork).

  ### Is It One Phenomenon or Three?
  It's **one unified phenomenon** with three observable facets:  
  - **Priority Allocation** (assigning seriousness)  
  - **Contextual Flip** (reversal based on conversational goals)  
  - **Functional Interdependence** (background entity enabling foregrounded one)  

  These are inseparable: the flip reveals interdependence, and interdependence justifies the flip. Bundling them captures the dynamism missing in static theories.

  ### Coined Term: **Ontic Tasking**
  - **Definition**: The pragmatic assignment of a materially coincident entity to a foregrounded functional role (e.g., "target of preservation" or "bearer of identity") within a specific context, where:  
    (a) The entity's *explanatory indispensability* persists across contexts,  
    (b) Its *metaphysical status* is retrofitted to match its current task,  
    (c) The "demoted" entity shifts to a *supporting role* necessary for the task's coherence.  
  - **Etymology**: "Ontic" (pertaining to entities) + "Tasking" (assigning a job/function). Emphasizes that entities are "put to work" differently across contexts.

  ### Borderline Case for a Good Definition
  **The University Building**:  
  - **Context 1 (Fire Safety Meeting)**: The *physical structure* (bricks, beams) is foregrounded. "The 1920s neo-Gothic design" is demoted to "aesthetically significant cladding."  
  - **Context 2 (Heritage Committee)**: The *architectural work* (design by X, style Y) is foregrounded. The bricks are "replaceable substrate."  
  - **Definition Test**:  
    - ✅ **COP/Ontic Tasking**: Priority flips; neither eliminable (safety needs design to define "original layout"; heritage needs materials to date the structure).  
    - ❌ **Fixed Reductionism**: Cannot explain bidirectional reduction (safety reduces heritage to decoration; heritage reduces bricks to replaceable parts).  
    - ❌ **Mere Verbal Dispute**: Both roles have causal stakes (fire spread vs. tourism revenue).  

  ### Why This Fits Your Cases
  - **Statue/Alloy**:  
    - *Conservation Task* → Alloy tasked with **material persistence**. Statue is "shape you can lose."  
    - *Cataloging Task* → Artwork tasked with **identity continuity**. Alloy is "footnote."  
  - **Shared Cast Sculpture**:  
    - *Registrar Task* (tracking objects) → **Physical cast** tasked as the countable entity.  
    - *Curator Task* (interpreting works) → **Two artworks** tasked as distinct creative acts.  
  - **Flip Mechanism**: The *institutional objective* (preservation vs. interpretation) determines which entity is "tasked" with carrying the relevant function (durability vs. meaning).  

  ### Philosophical Payoff
  COP/Ontic Tasking reveals that **metaphysical hierarchies are often post hoc justifications for pragmatic priorities**. It bridges analytic metaphysics and social ontology by showing how institutional practices dynamically reconfigure what "exists seriously." Your art committee isn't being inconsistent—they're expertly switching tasks. The clay and statue aren't fighting for supremacy; they’re co-workers clocking in for different shifts.
