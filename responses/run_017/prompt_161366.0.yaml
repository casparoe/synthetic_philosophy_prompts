answer: |-
  ## Working-Out: Nodes, Order, Envoy

  **Node Set:** The proposed set (DAMAGE, FLINCH, WANT, BELIEF, DISTRACTION, LEARNING) is robust. It captures the core functional profile: stimulus (DAMAGE), immediate behavioral outputs (FLINCH), motivational state (WANT), cognitive assessment (BELIEF), phenomenal salience/intrusiveness (DISTRACTION), and long-term behavioral modification (LEARNING). DISTRACTION is crucial – it gestures towards the phenomenal "what-it's-like" without naming it, fulfilling constraint #7. Substituting AVOIDANCE for LEARNING loses the *acquisition* aspect of pain's role. Substituting REPORT for BELIEF narrows it excessively. This set holds.

  **Order of Realizers:** The sequence builds conceptual pressure:
  1.  **Mammalian Neural Tissue:** Baseline – the familiar, undisputed realization. Establishes the functional pattern in its "native" habitat. Imagery: synapses, firing, myelin sheaths.
  2.  **Octopus Nervous System:** Biological but alien chemistry/architecture. Shows functional equivalence despite radical physical difference. Imagery: chromatophores, ganglia, jet-propulsion nerves.
  3.  **Hydraulic Device:** Simple mechanistic analogy, pre-digital. Highlights causal flow without computation. Imagery: valves, pistons, pressure gauges, fluid leaks.
  4.  **Giant Lookup Table:** Challenges causal *structure*. Outputs lack mediating states. This is where constraint #5 will bite – likely on DISTRACTION. Imagery: indices, pages, static entries, lack of flow.
  5.  **Population Simulation:** Distributed, social realization. Highlights the role as a *pattern* separable from a unified substrate. Imagery: messengers, town criers, relay stations, consensus.
  6.  **The Graft:** The critical test case. Hybrid realization – biological and prosthetic integrated. Forces the question: *what* is the occupant? The form will make the end-words feel detached, belonging to neither part alone. Imagery: scar tissue, wires, spliced pathways, phantom feedback.

  **Envoy Concession:** The envoy won't resolve the core tension but stage it starkly. It will concede the squeeze functionalism faces:
  *   **Lines 1-2:** Present the "pain-as-role" view (second-order property). Concede it seems causally inert ("ghostly"), its work done by the realizer.
  *   **Lines 3-4:** Present the "pain-as-realizer" view (first-order property). Concede it fragments pain into disjunctions (octopus pain ≠ human pain ≠ silicon pain).
  *   **Lines 5-6:** Concede the dilemma of specification: loosen the functional definition to allow multiple realization (admitting the lookup table/population) and lose the "mental" essence; tighten it to exclude them (demanding specific *types* of internal causation/timing/phenomenology) and either beg the question against physicalism or collapse back into species-specific identity theory. The envoy ends with this unresolved tension – the poem *cannot* end elsewhere because this is the core philosophical impasse functionalism navigates.

  ---

  ## Sestina: The Causal Role of Pain

  When sharpened steel induces fleshly **DAMAGE**,
  The startled body answers with a **FLINCH**.
  A silent, urgent, overwhelming **WANT**
  Arises: *cease this now*. A swift **BELIEF**
  Takes hold – *this limb is breached*. Such **DISTRACTION**
  Claims all awareness. Future paths hold **LEARNING**.

  In shifting blues, the severed arm brings **LEARNING** –
  Deep ganglia record the site of **DAMAGE**.
  Jet nerves fire, suck limb back – sharp **FLINCH**!
  A cloud of ink expresses deep-seated **WANT**,
  Complex lobes map the locus of **BELIEF**,
  While colour drains in mute **DISTRACTION**.

  Pressurized fluid spurts from **DAMAGE**.
  A piston slams, a safety valve **FLINCH**es.
  A gauge dips red, signalling urgent **WANT**.
  A bellows wheezes: *Pressure fault* – **BELIEF**
  In system flaw. Its dials demand **DISTRACTION**,
  Though gears hold no record for **LEARNING**.

  No valves, no flow; just pages turned at **DAMAGE**.
  The output scripted: *Cry out!* – a forced **FLINCH**.
  *State: Body Faulty* logs the cold **BELIEF**.
  *Alert Flag Raised* denotes its **DISTRACTION**.
  *Avoid Next Time* predicts rote **LEARNING**.
  It feels no ache, this hollow, stated **WANT**.

  A thousand couriers race at the **DAMAGE** report.
  The shout goes up: "Withdraw!" – the town's **FLINCH**.
  "The leg is bad!" relays the shared **BELIEF**.
  "Focus here now!" commands their **DISTRACTION**.
  "Mark path unsafe!" concludes their **LEARNING**.
  "Make it stop!" they chant the borrowed **WANT**.

  Here, spliced paths blur: where flesh records **DAMAGE**,
  A wire transmits the signal meant for **FLINCH**.
  The ghost-limb aches, a prosthetic **WANT**.
  The wetware thinks: *This circuit fails* – **BELIEF**.
  Scar tissue hums, a fractured **DISTRACTION**.
  The graft recalls no clean-cut **LEARNING**.

  ---

  ## Envoy

  Is pain the ghostly role, unseen, unfelt, no **DAMAGE**
  It causes? Or the realizer's pulse – this **FLINCH**,
  This wet **WANT**, this bio-sparked **BELIEF**,
  This **DISTRACTION** unique, this costly **LEARNING**?
  Define the function loose: the table stands, the people act, a **WANT**
  Simulated. Define it tight: the role dissolves, a fractured **BELIEF**.

  ---

  ## Apparatus

  *   **Stanza 1:** Mammalian Neural Tissue. Pressures: Obvious realization of the role, setting the standard.
  *   **Stanza 2:** Octopus Nervous System. Pressures: Radically different biology, yet satisfies the functional specification, supporting multiple realization.
  *   **Stanza 3:** Hydraulic Device. Pressures: Simple mechanistic causation fulfilling the role, challenging necessity of biology/computation.
  *   **Stanza 4:** Giant Lookup Table. Pressures: Satisfies input-output pairs but lacks internal causal structure/phenomenology. Constraint #5: The line "It feels no ache, this hollow, stated **WANT**" uses WANT while explicitly denying the phenomenal state (the "job" of intrinsic motivation is not done).
  *   **Stanza 5:** Population Simulation. Pressures: Distributed realization across many agents, the role as abstract pattern separable from unified mind/substrate.
  *   **Stanza 6:** The Graft. Pressures: Hybrid realization forces the question of *what* occupies the role – the disjunction? The integrated system? Neither part alone? The role itself? End-words feel "orphaned" from a single owner.
  *   **Form Constraint Simplification:** The complexity of internal state transitions within the causal role is necessarily compressed; the end-words represent nodes, but the intricate causal web *between* these nodes is implied rather than detailed within the line constraints.
  *   **Multiple Realization Assumption:** The poem assumes multiple realization is *possible* (a core functionalist commitment), as demonstrated by the diverse realizers. It remains agnostic on whether exotic cases like lookup tables or populations *actually* realize pain, highlighting the argument about how tightly the functional role must be defined.
  *   **Envoy Lines:** Lines 1-2 present the "pain as second-order role property" view. Lines 3-4 present the "pain as first-order realizer property" view. Lines 5-6 stage the specification dilemma/squeeze functionalism faces. The poem ends unresolved because this tension is fundamental to functionalism.
