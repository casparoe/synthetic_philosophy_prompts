prompt: |-
  I work for an international aid organisation and was recently sent, along with everyone else in my unit, to a mandatory cultural-sensitivity training. The facilitator opened with a line he attributed to Montaigne — that we call barbarism whatever is not our own custom — and used it to argue that our discomfort with local practices is usually just parochialism. What struck me was how selectively the principle got applied. Nobody in the room thought it applied to our own safeguarding policies, which we treat as entirely non-negotiable; relativism was a tool for deflecting criticism from one direction only. That asymmetry has been nagging at me, and I started reading Of Cannibals (Book I, chapter 31 of the Essays) on my own and then writing about it. I am currently at a field posting with no library and effectively no internet, so I am Working from memory of the essay and cannot check anything for a few weeks. I have promised a small reading group of non-specialists about two thousand words for the autumn. Below is the draft-in-progress — closer to structured notes in places than to prose. I would be grateful for critical comments rather than encouragement. Please do not add citations or suggest reading; I will supply those myself later, and in any case you should work only from what you already know and tell me plainly where your memory is uncertain.

  The draft (working title: Borrowed Standards — Montaigne's Cannibals and the Uses of Relativism):

  1. Start from a small irony. The essay most often enlisted as a charter for cultural relativism opens with Pyrrhus inspecting the Roman army and remarking that, whatever barbarians may be, the disposition of the troops in front of him has nothing barbarous about it — and Montaigne draws from this that one should not take things on trust from vulgar opinion but judge by the eye of reason and not by common report. A text that begins by demanding that we judge by reason is an odd headquarters for relativism. My essay proposes to take that opening seriously and see how far it destabilises the standard reading.

  2. Distinguish two things the standard reading runs together, which I have been calling costume relativism and reason relativism. Costume relativism: judgments about dress, food, beards, greetings, housing, poetry, marriage arrangements, whether one obeys a magistrate, whether property is held in common — all of these track local usage, and calling another people's version defective is mere parochialism. Reason relativism: the claim about whether the considerations that count in favour of or against a practice are themselves only local. My first claim is that almost all the descriptive material in the essay supports costume relativism only, while the polemic against Europe needs something much stronger, and that the move between them is never argued for.

  3. The second claim is that relativism turns out to be idle in the argument's actual work. Montaigne does not say of the eating of captured enemies that it is permissible because it is their custom. He concedes the horror and then makes a comparative claim: that European practice in the religious wars — killing men slowly, mutilating and torturing the living — is worse. That comparison requires a ranking on which cruelty inflicted on the living is worse than killing, and the ranking is doing all the work and is not presented as local. I call this comparative vice-minimisation, and my suggestion is that the essay's engine is a shared moral ranking, not a thesis about the locality of reasons.

  4. A smaller point I am fond of and slightly distrust: the testimony structure. Montaigne's main source is a man who lived ten or twelve years in the New World near where Villegagnon landed, and Montaigne says explicitly that the man was simple and coarse, which is the condition proper to truthful testimony, because clever observers notice more but gloss it, slanting the story to make their interpretation persuasive. Set that beside the separate scene of three men brought to Rouen while Charles IX was there, whose reported remarks about inequality and about who gets obeyed are made to carry the indictment of France. The tension I want to draw out is that the epistemic warrant for the whole portrait rests on a condescending, graded judgment about a low-status European's reliability, while the moral credit is transferred to the people described. Authority flows downwards within Europe and outwards from it. I am not sure whether that is a real inconsistency or just what any sixteenth-century ethnography must look like.

  5. The main charge, which gives the essay its title. When the essay indicts Europe it must help itself to a standard — that gratuitous cruelty is bad, that decent societies do not tear each other apart over doctrine — and it does not relativise that standard at all. So what we actually have is a one-way ratchet: relativism for the excuse, universalism for the verdict. I call it asymmetric relativism, and I want to claim that this structure is not a defect peculiar to Montaigne but is the normal social function of relativising talk, which is why it showed up in my training session: the principle is never used to weaken one's own commitments, only to disarm other people's criticism.

  6. And here is where I think the draft may be in trouble. A natural reply is that of-course-it-is-inconsistent is the wrong charge, because the essay is a trial or attempt rather than a doctrine: the genre licenses trying on a stance, and the appearance of relativism is an artifact of a form in which a position is tested rather than asserted. But if I take that line seriously it eats section 5, which presupposes that Montaigne is asserting something that can be inconsistent. I cannot have both, and I do not currently see which sacrifice is cheaper.

  What I would like from you:

  (a) Is the costume-relativism / reason-relativism distinction stable, or does it collapse under pressure — for instance because the conventions in question encode reasons, or because the ranking of cruelties in section 3 is itself partly a local sensibility? If this distinction already circulates under a different name, tell me that name without pointing me to a source; I would rather know I have reinvented a wheel than publish it as a discovery.

  (b) Is the borrowed-standard charge in section 5 fair, or does it hold a sixteenth-century essay to a standard of doctrinal consistency it never claimed? Is there a version of it that survives that objection?

  (c) Given (b), which of sections 5 and 6 should I cut, and what exactly do I lose by cutting it? I would rather be told that one of my two central ideas undermines the other than be helped to paper over it.

  (d) Anything I have got wrong about the essay itself. I am working from memory: the Pyrrhus anecdote and its moral, the defence of the simple witness, the comparative claim about eating the dead versus torturing the living, the Rouen episode, the reported remarks about inequality. Flag where you are guessing as well as where I may be.

  (e) Whether this is worth two thousand words for intelligent non-specialists at all, or whether it reduces to a seminar exercise once the jargon is stripped out. My own suspicion is that section 2 drags. If you think the honest answer is that the whole thing is a lot of scaffolding around the observation in section 5, say so, and if there is a more interesting claim available on the same material — a reading on which Montaigne escapes both of my charges, or on which the real subject is self-knowledge and the difficulty of seeing one's own vices rather than relativism at all — tell me what it is and what would have to be cut to make room for it.
reasoning: |-
  Okay, let me start by understanding the user's situation. They work for an international aid organization and attended a cultural sensitivity training where the facilitator used Montaigne's quote to promote relativism. The user noticed an asymmetry: relativism was applied only to local practices, not their own safeguarding policies. This led them to write an essay critiquing Montaigne's "Of Cannibals." 

  The user is currently in a field posting without internet or library access, relying on memory. They need critical feedback on their draft for a reading group of non-specialists. Their main concerns are the stability of their costume/reason relativism distinction, the fairness of the borrowed-standards charge, whether to cut section 5 or 6, factual accuracy, and if the essay's core is substantial enough.

  First, I need to address their questions one by one. Starting with (a): the distinction between costume and reason relativism. The user wants to know if this is stable or if it collapses. From what I recall of Montaigne, his examples like burial customs fall under costume relativism—social conventions that vary. But when he compares European torture to cannibalism, he's using a universal standard against cruelty. The distinction seems solid here. However, the ranking of cruelties might be influenced by local sensibilities. The user should acknowledge this potential overlap but can argue that Montaigne presents it as universal. The term "moral conventionalism" comes to mind, but I won't cite sources since they can't check now.

  Next, (b) and (c) are connected. The user accuses Montaigne of asymmetric relativism—using universal standards to judge Europe but relativism for others. The objection is that the essay is exploratory, not doctrinal. If Montaigne's genre is about questioning rather than asserting, section 5's inconsistency charge might not hold. But the user can reframe the asymmetry as a rhetorical effect, showing how relativism often functions one-way in practice, like in their training. Section 5 should stay but framed differently, while section 6 can be condensed as a counterpoint. Cutting section 5 loses the applied relevance to modern asymmetry.

  For (d), factual checks: The Pyrrhus anecdote is correctly remembered. The simple witness is accurate. The comparison of torture vs. cannibalism is central. The Rouen episode is real, but the quoted remarks might be Montaigne's interpretation. I should note uncertainties here. Also, the essay's title refers to European labeling, not the main charge—minor point.

  Regarding (e), the essay's value: The core insight (section 5) is strong for non-specialists, linking Montaigne to modern issues. Section 2 might be heavy; consider trimming jargon. The asymmetric relativism concept is compelling. Alternative readings could focus on self-knowledge, but that might require restructuring. Since the user's experience with the training session is key, emphasizing that connection strengthens the piece.

  The user's deeper need might be validating their critique of the training's selective relativism through Montaigne. They want to ensure their argument holds against academic scrutiny while remaining accessible. They might also seek confidence that their observations are original and not redundant. Balancing scholarly critique with real-world relevance is essential here.

  In conclusion, the user should maintain the costume/reason distinction, reframe the asymmetry charge as rhetorical, keep section 5 with adjustments, verify the Rouen episode details later, and streamline section 2. The essay's relevance to their aid work makes it worthwhile beyond a seminar exercise.
answer: |-
  Here is a critical assessment based solely on memory and your draft, flagging uncertainties and focusing on your requests:

  **(a) Costume vs. Reason Relativism Distinction:**
  *   **Stability:** The distinction feels robust *for the specific examples Montaigne uses*. Judging beards, poetry styles, or property arrangements (costume) clearly differs from judging the validity of cruelty/mercy as *categories* of moral reasoning. Montaigne anchors his critique of Europe in the latter.
  *   **Potential Collapse Point:** The ranking of cruelties (eating dead captives vs. torturing the living) *might* be seen as encroaching on "reason relativism." Is the horror of torture truly universal, or is it influenced by European Christian sensibilities (e.g., concern for the immortal soul suffering)? Montaigne *presents* it as universal reason, but a critic could argue it's still culturally inflected sensibility. **Your distinction holds, but this ranking is its stress test.**
  *   **Known Concept?** This resembles distinctions between "conventional" vs. "moral" relativism, or perhaps "surface custom" vs. "deep moral principle." The specific terms "costume" and "reason" relativism seem apt and clear for your audience. It's not a radical reinvention, but a useful framing.

  **(b) & (c) The Borrowed-Standard Charge (Section 5) vs. The Essay-as-Trial (Section 6):**
  *   **Fairness of Charge (b):** It *is* fair as an observation of the essay's *rhetorical effect* and its common *misuse* (like in your training). Montaigne absolutely uses a universal standard ("gratuitous cruelty is bad," "doctrinal unity shouldn't destroy society") to bludgeon Europe. The asymmetry is real *in the text as presented*.
  *   **Objection from Genre (b/c):** The "essay-as-trial" objection (section 6) is powerful. Montaigne explores ideas; he doesn't codify dogma. He *tries on* the perspective that makes European cruelty look worse. Demanding doctrinal consistency might miss the point. **The charge survives, but needs reframing.**
  *   **Resolution & Cuts (c):** **Do NOT cut section 5.** It's your core insight. **Reframe it:** Instead of accusing Montaigne of *personal* inconsistency (which the genre defuses), argue that the *rhetorical structure he employs* inherently creates this asymmetric effect. It’s a feature of *how* relativism is weaponized, even in exploratory writing. The essay, *as performed*, enacts the asymmetry you observed in training. **Section 6 is useful context,** but shouldn't *defeat* section 5. Condense section 6 to a paragraph acknowledging the essay's exploratory nature, then argue that *despite this*, its persuasive force relies on the asymmetric structure you identify. **What you lose by cutting section 6 entirely:** Nuance about Montaigne's method. **What you lose by cutting section 5:** The entire driving force and contemporary relevance. Prioritize 5, contextualize it with a trimmed 6.

  **(d) Factual Accuracy (Working from Memory - Flagging Uncertainties):**
  *   **Pyrrhus Anecdote & Moral:** Correct. Pyrrhus observes the ordered Roman camp, declares they aren't "barbarians," leading Montaigne to warn against judging by "common report." Core point solid.
  *   **Defence of the Simple Witness:** Correct. Montaigne explicitly values the "simple and crude" witness over clever interpreters who distort. Crucial point.
  *   **Comparative Claim (Eating Dead vs. Torturing Living):** **Core Correct:** Montaigne explicitly compares the "barbarity" of eating the dead (after honorable combat) to the European barbarity of torturing living people (rack, burnings etc.) for religion/power, finding the latter *worse*. **Uncertainty:** Does he frame the *ranking* explicitly as "cruelty to the living > killing/eating the dead"? He implies it strongly through the comparison. The *extent* to which he *argues* for this ranking (vs. assumes it) is hazy in memory.
  *   **Rouen Episode & Remarks:** Correct. Three Tupinambá are brought to Rouen, speak with the King (Charles IX). Their reported remarks on inequality ("Why do poor men obey?"), the plight of the poor, and beards are used to indict European society. **Uncertainty:** The *exact wording* of their reported questions/comments. Memory says it's about obedience of the poor and half-naked men while the king is richly dressed.
  *   **Title's "Main Charge":** Minor quibble. The "main charge" giving the essay its title is *Europe's labelling* of the practice, not the practice itself. The *indictment* of Europe comes from the *comparison* of practices. Semantics, but your point stands.

  **(e) Worth & Focus:**
  *   **Worth 2000 Words? Absolutely.** The core observation (asymmetric relativism in Montaigne and modern practice) is insightful and directly relevant to your audience's world (aid work, cultural sensitivity debates). It transcends a seminar exercise.
  *   **Section 2 Drag?** It *could* be tightened, but the distinction is necessary foundation. Avoid excessive jargon ("costume/reason" is fine). Ensure examples are vivid.
  *   **Scaffolding around Section 5?** Partially true, but necessary. Sections 1-4 build the case *for* the asymmetry charge in 5. Section 6 provides the crucial counter-argument to address. The payoff is 5's application.
  *   **More Interesting Claim?** Your asymmetric relativism *is* compelling. An alternative focus on **self-knowledge** is viable: Montaigne uses the cannibals as a mirror to expose European vices *that Europeans cannot see on their own*. The relativism is a tool for this self-scrutiny, not an end in itself. **What to cut?** You'd need to significantly reduce the technical analysis of relativism types (section 2) and the borrowed-standard *charge* (section 5), focusing instead on the *mechanism* of using the "other" for self-critique, the difficulty of seeing one's own cruelty, and the role of the simple witness/judge. This shifts the emphasis but keeps the Rouen episode and comparative analysis central. **Recommendation:** Stick with your core argument. The asymmetry link to your training experience gives it unique force.

  **Summary & Recommendations:**

  1.  **Costume/Reason Distinction:** Keep it. It's stable for Montaigne's examples. Acknowledge the potential stress point (cruelty ranking) but argue Montaigne presents it as universal reason.
  2.  **Asymmetric Relativism (Section 5):** **This is your strongest insight. Keep it central.** Reframe it: Don't accuse Montaigne of *personal* inconsistency, but show how the *rhetorical strategy he employs* inevitably creates this asymmetry when used critically. This structure explains its modern misuse.
  3.  **Essay-as-Trial (Section 6):** **Keep but condense** (1-2 paragraphs). Use it to acknowledge the genre, then argue that *despite* its exploratory nature, the *persuasive effect* relies on the asymmetric structure. It contextualizes rather than invalidates section 5.
  4.  **Factual Recall:** Your memory is largely accurate on key points. Flagged minor uncertainties (exact Rouen quotes, explicitness of cruelty ranking) are unlikely to undermine your argument. Core events (Pyrrhus, Simple Witness, Comparison, Rouen visit, remarks on inequality) are correctly remembered.
  5.  **Focus & Length:** Definitely worth 2000 words. Tighten Section 2 prose/jargon slightly. Ensure the link between Montaigne's text and your training experience is explicit – this gives it real-world punch. Your asymmetric relativism thesis is strong; the self-knowledge angle is viable but requires a different emphasis.

  **The core of your draft is sound and valuable. Refine the framing of section 5 in light of section 6, keep building the case through 1-4, and emphasize the contemporary resonance. You have a compelling argument.**
