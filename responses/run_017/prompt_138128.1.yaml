prompt: |-
  I've been trying to put a name to something for a while now, and I can't find the word for it — which may mean there isn't one. I'd like the carving, not just a label, so let me describe what I keep seeing.

  The background distinction I'm working from (correct me if I have it garbled): for a given attitude there seem to be two kinds of reason. One kind bears on whether the attitude is *correct* — whether the proposition is true, whether the thing really is fearsome, whether the person really is blameworthy, whether the loss really is worth grieving. The other kind merely makes it good, useful, decent, or required of you to *have* the attitude: someone pays you to believe it, someone threatens you unless you're frightened, keeping up the resentment is politically necessary. Reasons of the second sort are real reasons, but they don't answer the attitude's own question. I'm not interested in that distinction as such. I'm interested in what happens to it when the second sort of reason doesn't stay where it was put.

  Three cases.

  1. A friend of mine was told, accurately, that surgical patients who expect to recover do measurably better. Grant that she had no evidential reason at all to expect it; the statistics for her case were grim. What she had was a reason to *want* to expect it. She couldn't simply decide to believe it, but she could steer: she read the survivorship literature and not the mortality literature, spent time with the recovered patients in the support group and not with the ones doing badly, asked her surgeon for the optimistic end of the range rather than the middle. Six months later she expected to recover, and she could cite chapter and verse. As far as I can tell the belief now rests on genuine evidence, and the evidence supports it: take away the whole episode of steering and what she currently has still supports what she currently believes. What I can't say is whether the belief is defective. It was produced by a route nobody thinks is the right way to produce a belief, but the route isn't doing any current work. Is there a notion of an attitude's inheriting a defect from its ancestry? Or is every complaint here a complaint about what she did, none of it about what she now believes?

  2. A widower I know was told, truly, that his grieving was frightening his children. So he had a reason to want the grief to be smaller — and that reason plainly had nothing to do with whether grief was called for, since his wife had died and if anything calls for grief that does. He did the ordinary things: went back to work early, kept the photographs up but stopped the evening ritual of looking at them, took up a demanding sport. A year on, the grief is much smaller. Here's the part I can't get straight. Grief comes in degrees, and a degree can be wrong: too much for what happened, too little. Say his is now too little for what he lost. The thing that made it too little was a consideration of the second kind. So is his state defective in the way it would *not* be defective if the same reduction had been produced by, say, a head injury or by the ordinary blunting of time? Is there a term for a complaint about an attitude that is really a complaint about its *size* combined with a story about how it came to have that size — and does the second ingredient ever add anything to the first?

  3. Two senior people in a department I know about have been told that the place will destroy itself unless they trust each other. Their colleague's unreliability is a matter of record; neither of them thinks it will change. So the reason they have for trusting her is not an answer to the question trust asks, which is whether she's trustworthy. But trusting someone isn't a single inner item — it's partly what you do (rely on her, don't check up, read the memo in the better light, give the second chance) and partly what you're disposed to do and expect. Each of those they can take up, and for each of them, taken on its own, they have perfectly respectable reasons: the department, the students, the work. So there's a reading on which they have reasons of the right kind for the *components*, the components add up to trust, and the trust itself answers a question to which they have no good answer. Now compare someone paid to love, and a parent who acts lovingly toward a child for the child's sake and finds the feeling arrives later. Same shape, or a different one?

  What the three have in common, as I see it: a reason that everyone agrees is of the second kind for the attitude in question gets presented as, or converted into, a reason of the first kind for something adjacent — the wanting of the attitude, the getting oneself into it, one of the dispositions that partly constitute it, or its intensity — and then, because the adjacent thing is connected to the attitude, the attitude itself is either treated as being in good standing or condemned as compromised, and no one says what principle decides which. Sometimes the transfer looks like laundering and sometimes it looks like the only thing a responsible person could do.

  What I think it isn't, so you can tell me where I'm wrong. It isn't just the point that you can have a reason to bring an attitude about without having a reason to have it; my cases start there rather than end there. It isn't the worry that a belief fails to rest on its evidence — in case 1 the belief does rest on evidence, and the complaint, if there is one, is about ancestry rather than present support. And it isn't, I think, the familiar structure in which a reason is fine for the first step of a chain and goes missing by the last: in those cases the reason fails to arrive, whereas in mine the reason arrives, or appears to, and the question is whether it arrives in the right currency.

  So: does this have a name? Not a name for the general distinction — that one I have — but a name for the transfer, for the family of transfers, or for the defect they produce. If the three cases are really three different things, I want to know that too, and which of them is the genuine article. If there's no established term, coin one and define it, and then give me the boundary: what feature of the relation between the adjacent item and the attitude — causal versus constitutive, a matter of degree versus a matter of existence, whether the subject avows the route or hides it from herself — decides whether the transfer goes through? Give me one case just inside the line and one just outside. And tell me whether anything I've described is a problem for the standard ways of handling the general distinction, or only a new application of them.

  I'm not asking for a reading list or citations; I can't chase references from where I'm writing, and invented ones are worse than none. Names of concepts are very welcome, sources aren't necessary.

  Last thing: please close by saying how confident you are in the overall account you've given — especially in your verdict on whether these are one phenomenon or three — and by singling out the single claim in your answer you'd be least surprised to turn out wrong about, and saying why.
reasoning: |-
  Okay, let's tackle this user's query. They're describing three cases where reasons of the "second kind" (instrumental/practical) influence attitudes in ways that blur the line with reasons of the "first kind" (evidential/normative). The user wants a name for this phenomenon or its defects, and whether the cases are variations of one thing or distinct.

  First, I need to parse each case carefully. The friend who cultivates belief in recovery through selective exposure ends up with evidence-backed belief but questionable origins. The widower reduces grief for his children's sake, potentially ending up with insufficient grief. The colleagues build trust through component actions despite lacking evidence of trustworthiness. All involve converting practical reasons into attitudes that seem normatively aligned but are ancestrally tainted.

  The user mentions concepts like "laundering" or "bootstrapping," which I recall from epistemology (e.g., Pascal's Wager). But here, the attitudes later gain evidential support. The key is whether the ancestry matters once the attitude is supported. For belief, epistemic discredit might linger even with current evidence—maybe "genetic defect" applies. For emotions, it's trickier. The grief reduction might be seen as inauthentic rather than incorrect. Trust built on necessity could be pragmatically functional but lack the normative core.

  The common thread seems to be "bootstrapped normativity": using practical reasons to create conditions where the attitude appears justified. But is this one phenomenon? The belief case involves evidence accumulation, while grief and trust focus on behavioral components leading to emotional change. Perhaps they share a structure of "instrumental cultivation" resulting in seemingly well-founded attitudes.

  Existing terms: "doxastic wronging" might relate but focuses on harm. "Affective incorporation" isn't standard. Maybe "normative laundering" or "ancestral defect" could work. The boundary might hinge on whether the attitude's basis is retrospectively validated (e.g., the belief now has evidence) versus inherently unchangeable (like the grief's cause).

  For the confidence part: I'm least sure about treating grief and trust like belief. Emotions might not have "correctness" in the same way. The user might be conflating epistemic and evaluative norms. If forced to pick, the claim about the widower's grief being defective due to origin might be the shakiest—maybe the origin doesn't affect the current appropriateness, only the process.

  Overall, synthesizing these as "bootstrapped normativity" with subcategories feels plausible. The user's deep need is likely conceptual clarity for ethical/philosophical work, possibly addressing moral residue or integrity. They might also seek validation that these are genuine dilemmas, not just user errors in reasoning.
answer: |-
  This is a brilliantly articulated set of problems probing the fault lines between reasons for attitudes and reasons for cultivating them, and the lingering normative residue of the latter when they shape the former. You're right that the standard "Wrong Kind of Reason" (WKR) distinction doesn't quite capture the phenomenon you describe. What you've identified lacks a single, universally agreed-upon term, but several concepts and coinages get close. Here's a carving:

  **The Core Phenomenon: Normative Laundering through Instrumental Cultivation (or "Ancestral Taint")**

  *   **The Mechanism:** A practical reason (WKR) to *bring about* or *modify* an attitude (or its components) is used instrumentally. This cultivation process successfully generates an attitude (or adjusts its intensity) that *now* appears to possess, or even genuinely possesses, first-kind reasons (RKR - Right Kind of Reason) for its *current* existence or degree.
  *   **The Tension:** Despite the attitude's *current* potential RKR-justification, its *genealogy* traces back to a WKR-driven process. The question is whether this origin introduces a persistent normative defect ("taint") in the attitude itself, even when the instrumental scaffolding is removed.

  **Why your cases share this core:**

  1.  **The Belief Case:** Steering *for practical reasons* creates an evidential base. The belief *now* rests on RKRs (evidence), but its existence and specific content were *selected for* by a WKR (health outcome). The defect question is about epistemic ancestry.
  2.  **The Grief Case:** Actions *motivated by a WKR* (children's fear) causally diminish grief intensity. The *degree* of grief *now* might align with RKRs (e.g., time passed), but its specific level was *shaped* by the WKR. The defect question is about the normative source of the intensity adjustment.
  3.  **The Trust Case:** Adopting trusting *behaviors* and *dispositions* for WKRs (department survival) constitutes trust. The trust *now* might have behavioral/functional RKRs (it works), but its *core normative basis* (perceived trustworthiness) was bypassed. The defect question is about constitutive bypass.

  **Concepts & Potential Names:**

  1.  **Genetic Defect / Genealogical Defect (Epistemic Focus):** Primarily used for belief. The idea that a belief's justification or status can be undermined by its origin, even if it *now* coheres with evidence (like "doxastic unjustification" due to unreliable process, even if accidentally true). *Fits Case 1 well.*
  2.  **Normative Laundering / Bootstrapping:** The process of using WKRs to create conditions that generate RKRs, thereby "laundering" the practical reason into a normative one. *Captures the mechanism across cases.*
  3.  **Ancestral Taint / Derivative Defect:** The idea that the defect in the *process* or *motivation* for cultivation transmits a defect to the resulting attitude itself. *Captures the lingering worry.*
  4.  **Motivational Bypass (Evaluative Focus):** For emotions/attitudes like grief/trust. The core evaluative judgment (loss magnitude, trustworthiness) was circumvented by the motivational force of the WKR during cultivation. The attitude's *connection to its proper object* is mediated or weakened. *Fits Cases 2 & 3.*
  5.  **Affective/Attitudinal Incorporation:** The WKR gets "incorporated" into the structure of the attitude itself via the cultivation process, becoming part of its (now potentially mixed) justificatory basis. *Highlights the hybrid result.*
  6.  **The Cultivation Problem:** A neutral term focusing on the core issue: the normative status of attitudes *resulting* from intentional cultivation driven by WKRs.

  **Boundary: When Does the "Taint" Stick? (The Transfer Principle)**

  The key factor seems to be **whether the instrumental cultivation process bypasses or substitutes for the attitude's core constitutive normative standard.**

  *   **Inside the Line (Taint Applies):** When the cultivation process directly targets the *basis* or *intensity* of the attitude in a way that avoids engagement with its primary normative question.
      *   *Example (Case 1 Just Inside):* Your friend actively *avoided* evidence relevant to the truth question (mortality stats) while selectively gathering only favorable evidence *because* it served the instrumental goal. The process deliberately circumvented a full engagement with the RKR (truth). The belief's genetic origins involve an epistemic vice, creating a potential defect.
      *   *Example (Case 2 Just Inside):* The widower's actions were *specifically chosen and timed* to suppress grief *because* of its effect on others, actively managing intensity based on WKRs *instead of* letting intensity evolve solely in response to the loss itself (RKRs). The grief reduction's *direct source* is the WKR, creating a potential defect in its authenticity or fittingness.
  *   **Outside the Line (No Taint):** When the cultivation process involves engaging with the world in a way that genuinely opens the subject up to *encountering* RKRs, even if the *initial motivation* was instrumental.
      *   *Example (Case 1 Just Outside):* Suppose your friend, motivated by hope (itself perhaps influenced by the instrumental reason), decided to *thoroughly investigate* her prognosis, seeking out *both* survivorship *and* mortality literature, optimistic *and* pessimistic doctors. She ended up convinced by the survivorship evidence *after* confronting the full picture. Here, the instrumental reason *led* to engagement with RKRs, but didn't *substitute* for it. The belief's justification stems primarily from that engagement. Ancestry is cleaner.
      *   *Example (Case 3 Just Outside - Harder):* Suppose the colleagues, motivated by the department's need (WKR), decided to give their unreliable colleague specific, limited chances to prove reliability in low-stakes tasks (e.g., organizing a seminar). The colleague unexpectedly excelled, providing genuine RKRs for increased trust. The WKR prompted a process that *allowed* RKRs to emerge. The *current* trust rests more on the RKR evidence than the initial WKR cultivation.

  **Relationship to the WKR Distinction:**

  This doesn't *break* the standard WKR/RKR distinction; it explores its *temporal* and *causal* consequences. The distinction correctly categorizes the *initial* reasons. Your cases show that WKRs can be effective *tools* for cultivating states that later *appear* RKR-justified. The problem arises when we ask if the RKR-justification of the *resulting state* is *fully earned* or *compromised* by its instrumental origins. The standard distinction is synchronic; your problem is diachronic and genetic.

  **One Phenomenon or Three?**

  They are **closely related variants of a single core phenomenon: the normative status of attitudes cultivated via instrumental reasons.** The differences lie in the *nature of the attitude* and the *mechanism of cultivation*:

  1.  **Case 1 (Belief):** Focuses on *epistemic justification* and *genetic defect*. Cultivation involves *evidence selection/manipulation*.
  2.  **Case 2 (Grief - Emotion Intensity):** Focuses on *evaluative fittingness* and *authenticity/source of intensity*. Cultivation involves *behavioral/attentional strategies* causally affecting emotion.
  3.  **Case 3 (Trust - Complex Attitude):** Focuses on *constitutive bypass* – building the attitude *behaviorally* while bypassing its core *evaluative judgment*. Cultivation involves *adopting components* that constitute the attitude.

  The shared structure is: **WKR -> Instrumental Cultivation Strategy -> Attitude (apparently RKR-supported) -> Question of Ancestral Defect.**

  **Comparisons:**

  *   **Paid Love:** Very similar to Case 3. Acting lovingly (components) for payment (WKR) might cultivate feelings. If feelings arise, they might *now* have RKR properties (shared experiences, intimacy), but the *origin* in payment creates a worry about authenticity/constitutive bypass of love's core (unconditional valuation?). Defect likely persists.
  *   **Parent Acting Lovingly:** This is closer to the *Outside the Line* case. Acting lovingly *for the child's sake* (which *is* an RKR for parental love!) is directly engaging with the object of the attitude. The feeling arising later is a natural consequence of that RKR-driven engagement, not a bypass. Less problematic ancestry.

  **Confidence & Caveats**

  *   **Overall Confidence:** **Moderately High** (7/10) that this carves the phenomenon accurately and identifies the core shared structure ("Normative Laundering/Ancestral Taint via Instrumental Cultivation"). The three cases are convincingly linked as variants.
  *   **Least Confident Claim:** **That the grief reduction in Case 2 necessarily involves a defect *in the attitude itself*.** This is the claim I'd be least surprised to be wrong about.
      *   **Why:** The "correct" degree of grief is notoriously vague and subjective. One could argue that *any* process leading to reduced grief (time, distraction, therapy, new love, *or* instrumental management) simply *is* the grief evolving, and the resulting intensity is what it is. The WKR origin might make the *process* criticizable (inauthentic, avoidant), but perhaps not the *resulting state*. The defect might reside solely in the agent's history and character, not the emotion's current fittingness. This contrasts with belief (where truth/falsity is clearer) and trust (where behavioral reliance without belief in trustworthiness seems internally fractured). The claim that the *size itself* is defective *because* of the WKR origin is the most contestable part of the analysis.

  The power of your examples lies in exposing how reasons don't just justify states statically; their role in *shaping* those states dynamically creates complex normative legacies that challenge tidy distinctions.
