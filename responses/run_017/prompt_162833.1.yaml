  - Preservation of classical inference rules except explosion (point 1)
  - Belief in true contradictions for semantic paradoxes and quantum superpositions (2)
  - Paraconsistency as necessary for scientific practice (3)
  - Contradictions as usually signaling errors, with true ones being rare (4)
  - Revisability of logic based on empirical evidence (5)
  - Logical recapture as making the switch cost-free (6)
  - Uncompromising commitment to falsificationism (7)

  The three quantum-specific sub-questions (a,b,c) will require special attention since they bridge physics and logic. The "zoned dialetheism" label they propose is helpful - I'll test its coherence.

  For tension-spotting, I'll start by identifying pressure points:
  - Between 2 (true contradictions) and 7 (falsificationism): if contradictions are tolerated, does falsification collapse?
  - Between 2 and 6 (recapture): if quantum contradictions are fundamental, can classical logic ever be fully recaptured there?
  - Between 4 (rare true contradictions) and 5 (empirical revisability): what evidence would distinguish "true" from "false" contradictions?

  The user's dismissal of explosion in point (c) seems correct at first glance - paraconsistent logics explicitly block ex contradictione quodlibet. But I should check if there are non-explosive arguments for trivialism.

  For quantum superposition (point 2b), I need to clarify whether "position" is even a valid observable in superposition states. The tension between their scientific intuition and quantum formalism might stem from misinterpreting the Born rule.

  The recapture question (6b) is particularly subtle: if contradictions hold in some domain, adding consistency assumptions there would be false. So recapture requires knowing where contradictions don't exist - but that's precisely what's contested in quantum cases.

  I'll structure the audit by severity:
  1. Falsificationism vs dialetheism as the most urgent (threatens their core philosophy of science)
  2. Recapture in quantum zones as moderately severe (impacts scientific practice)
  3. Revisability vs zoned approach as milder (conceptual but not practical threat)

  For each, I'll outline minimal fixes (e.g. restricting falsification to consistent domains) vs more comprehensive solutions (e.g. redefining falsification in paraconsistent terms). The quantum superposition issue gets its own resolution since it's likely not a true contradiction.

  The "zoned dialetheism" position seems defensible if we accept that the "zones" are metaphysically distinct (semantic vs physical). But I'll note that maintaining sharp boundaries might prove tricky.

