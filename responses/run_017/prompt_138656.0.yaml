     Pattern 4: R1 and R2 -> consistent with risk seeking.

     Only patterns 1 and 2 violate independence. But note: the Allais paradox is about pattern 1 (safe in first, risky in second). Pattern 2 is the reverse and is also a violation but less common.

     In debrief:

     - "We see that many of you chose the safe option in Choice 1 and the more risky option in Choice 3. This is a common pattern, known as the Allais paradox. It shows that people's choices can violate the independence axiom of expected utility theory."

     - To the students who did not flip: "Some of you were consistent: either always choosing the safe option or always choosing the risky option, or choosing the safe in the first and the safe in the second. That is consistent with expected utility theory. But we also see that many people are inconsistent in this specific way."

     **Handling Potential Problems:**

     - Students not believing payouts: Be clear at the start that you have the cash and will pay. Show the money.

     - 1% chance of nothing being read as no chance: Emphasize that it is a real chance. Use the bingo cage to demonstrate.

     - Session collapsing into a debate on risk aversion: Avoid that by not using the term until the debrief. During the activity, just have them choose.

     **What the Activity Cannot Reproduce:**

     - The independence axiom is about the entire structure of the lotteries and the ability to cancel common branches. We can only illustrate the violation, not prove the axiom.

     - The route from the flip to irrationality is weak because some descriptive theories (like prospect theory) explain the flip and are not considered irrational.

     **Withdrawing the Design:** The part I am least confident about is the scale. With small stakes, the effect might not be strong. Also, the starting endowment of 50 tokens and then the decisions adding to it might frame the outcomes differently. If I run it and find that very few students show the flip, then the activity fails. I would expect to observe in the room that most students choose R1 and R2, or S1 and S2, i.e., consistent with risk aversion or seeking. The weakest step is the psychological impact of the 1% chance of a loss of 50 tokens (from 100 to 50) in the first decision. With small stakes, they might not care.

     **Final Design for Thursday:**

     - Prepare booklets with 4 choices (two critical, two filler).
     - Prepare bingo cage with 100 balls and 3 multiplier balls.
     - Have £40 in cash (in small change).

     Timeline:

     - 0-5 min: Introduction and endowment explanation.
     - 5-20 min: Students make choices.
     - 20-25 min: Collect booklets.
     - 25-30 min: Randomly select which choice to pay (draw from 1-4).
     - 30-40 min: For each student, for the selected choice, draw a ball from 1-100 and determine their token outcome. Then draw a multiplier (1,2,3). Calculate cash: tokens * multiplier * £0.01.
     - 40-50 min: Pay students.
     - 50-75 min: Debrief.

     **Debrief Script:**

     "Let's look at the two lotteries that were Choices 1 and 3. [Display]

     In Choice 1, many of you chose the safe option (S1) that gives 100 tokens for sure. Why? [Get responses] Some of you might have wanted to avoid the small chance of getting only 50 tokens.

     In Choice 3, many of you chose the risky option (R2) that gives a 10% chance of 250 tokens. Why? [Get responses] Because the chance of 50 tokens was high anyway?

     Now, let me ask: how many of you chose S1 in Choice 1 and R2 in Choice 3? [Raise hands] How many chose R1 in Choice 1 and S2 in Choice 3? [Raise hands] How many chose S1 and S2? [Raise hands] How many chose R1 and R2? [Raise hands]

     We see that a common pattern is the first one: safe in Choice 1 and risky in Choice 3. But notice that in both choices, there is a common outcome: 50 tokens. In Choice 1, the safe option avoids it completely, while the risky option has a 1% chance of it. In Choice 3, both options have a high chance of it (89% or 90%). So the presence of that common outcome in both options in Choice 3 made you focus on the potential gains, while in Choice 1, the fact that only the risky option had that loss made you avoid it.

     This violates an axiom of rational choice called the independence axiom. It says that if two options have the same outcome in some states, then your preference should not depend on that common outcome. But here, it did.

     Is this irrational? Some say yes, because it leads to inconsistent choices. Others say it's a natural human response. We'll discuss more in the next session."

     **Withdrawal Condition:** If in a pilot run (or in the first class) we see that less than 20% of the class shows the flip (S1 and R2), then the activity might not be effective. The weak part is the psychological weight of the 1% chance of 50 tokens in the first decision. With small stakes, it might not be scary enough.

     Alternative: use a loss frame. We could start with 100 tokens and then have the lotteries take away tokens. For example:

          Starting endowment: 100 tokens.

          Decision 1:
            S1: 0 tokens loss (remain 100)
            R1: 
               10% chance to gain 50 tokens (total 150)
               89% chance to lose 0 tokens (remain 100)
               1% chance to lose 50 tokens (remain 50)

          Decision 2:
            S2:
               11% chance to gain 50 tokens (total 150)
               89% chance to lose 50 tokens (total 50)
            R2:
               10% chance to gain 150 tokens (total 250)
               90% chance to lose 50 tokens (total 50)

     This framing might make the loss of 50 tokens more salient. We can try this if the gain frame doesn't work.

     Given the time, we go with the gain frame as described.

     Final note: The third-party variant is not used because of potential confounds.

     I hope this design works for Thursday!
answer: |-
  ### **Design: The Hidden Flip Activity**
  **Core Structure**: Two disguised decisions embedded among filler choices, using token stakes amplified by a random multiplier. The critical decisions are separated in time and context to prevent detection. The common branch is identical in both decisions (89% chance of a fixed outcome), but the *perception* of certainty differs, inducing the preference flip.

  ---

  ### **Materials & Setup**
  - **Tokens**: Each student starts with 50 tokens (conversion: 1 token = £0.01, max payout £4.50/student).
  - **Bingo Cage**: 
    - **Outcome Cage**: 100 balls numbered 1–100.
    - **Multiplier Cage**: 3 balls labeled "1", "2", "3" (triples stakes without exceeding budget).
  - **Prizes**: £40 in cash (to show credibility). Total max cost: 20 students × 150 tokens × 3 × £0.01 = £90, but *expected* cost is £30 (within budget).
  - **Booklets**: 4 pages (2 critical + 2 filler). Distribute face-down.

  ---

  ### **Script: Minute-by-Minute Timeline**
  **0–5 min: Introduction**  
  *Stand at front, hold cash and bingo cage. Do not mention rationality, axioms, or paradoxes.*  
  > "Welcome. Today, you’ll make real choices affecting your payout. Each of you starts with 50 tokens. You’ll answer 4 unrelated questions. Later, I’ll randomly pick *one* question to play out for everyone. For that question, I’ll draw a ball from this cage to determine your outcome. Finally, I’ll multiply your tokens by 1, 2, or 3—drawn here—and pay you in cash. Example: If you win 100 tokens and multiplier is 2, you get £2. Questions? Work silently. Begin."

  **5–20 min: Choice Phase**  
  *Students complete booklets privately. Circulate to ensure silence.*

  **Booklet Wording**  
  - **Page 1 (Critical 1: "Safe vs. Risky")**  
    > "**Choice 1: Prize Fund**  
    > You have 50 tokens. Option A guarantees a total of 100 tokens.  
    > Option B uses a 100-ball draw:  
    > - Balls 1–10: 150 tokens total (10% chance)  
    > - Balls 11–99: 100 tokens total (89% chance)  
    > - Ball 100: 50 tokens total (1% chance)  
    > ○ A ○ B"

  - **Page 2 (Filler 1: Distraction)**  
    > "**Choice 2: Bonus Round**  
    > Option A: 70 tokens total.  
    > Option B: 50% chance of 120 tokens, 50% chance of 20 tokens.  
    > ○ A ○ B"

  - **Page 3 (Critical 2: "Risky A vs. Risky B")**  
    > "**Choice 3: Donation Draw**  
    > *Imagine your tokens fund a scholarship. Your choice affects its size.*  
    > You have 50 tokens. Option A:  
    > - Balls 1–11: 150 tokens total (11% chance)  
    > - Balls 12–100: 50 tokens total (89% chance)  
    > Option B:  
    > - Balls 1–10: 250 tokens total (10% chance)  
    > - Balls 11–100: 50 tokens total (90% chance)  
    > ○ A ○ B"

  - **Page 4 (Filler 2: Distraction)**  
    > "**Choice 4: Luck Test**  
    > Option A: 30% chance of 150 tokens, 70% chance of 50 tokens.  
    > Option B: 80 tokens total.  
    > ○ A ○ B"

  **20–25 min: Collect Booklets**  
  > "Pens down. I’ll shuffle these and draw which question we play."

  **25–30 min: Random Selection**  
  - Draw a ball from a 4-ball cage (labeled 1–4) to select the paid choice.  
  - *If critical choice not selected, say:* "We’ll play Choice [X]. Remember, multiplier still applies."

  **30–40 min: Resolve Outcomes**  
  - For each student, draw from the 100-ball cage based on their choice in the selected question.  
  - Draw multiplier (1, 2, or 3).  
  - Calculate cash: (Outcome tokens × multiplier × £0.01).  
  - *Example: Student chose Critical 1 Option B, ball 100 → 50 tokens. Multiplier 2 → £1.*

  **40–50 min: Payout**  
  Hand cash directly to each student. *Show remaining £40:* "I have funds for future activities."

  **50–75 min: Debrief**  
  *Do not name Allais/independence yet.*

  ---

  ### **Debrief Script: Unpacking the Flip**
  **Step 1: Reveal Choices**  
  Project Critical 1 and 3 side by side.  
  > "Let’s compare Choices 1 and 3. How many chose:  
  > - **A in 1 and B in 3**? [Flip: S1→R2]  
  > - **B in 1 and A in 3**? [Flip: R1→S2]  
  > - **A in both**? [Consistent: Safe]  
  > - **B in both**? [Consistent: Risky]  

  **Step 2: Highlight the Flips**  
  *Address each group:*  
  - **To S1→R2 flippers (expected majority)**:  
    > "You avoided Option B in Choice 1 because of that 1% chance of 50 tokens. But in Choice 3, you picked B despite its *higher* chance of 50 tokens. Why?"  
    *Listen: They’ll say "certainty felt safe" or "didn’t want to lose 50 tokens."*  

  - **To R1→S2 flippers (rare)**:  
    > "You risked the 1% loss in Choice 1 but avoided risk in Choice 3. What changed?"  
    *Listen: They might note the charity frame made losses feel worse.*  

  - **To consistent students**:  
    > "You didn’t flip. Some of you always avoid risk; others chase big wins. That’s valid—but today is about why many *do* flip."

  **Step 3: Isolate the Common Branch**  
  Project a tree diagram:  
  > "Notice: In *both* decisions, balls 12–100 (89%) give 50 tokens. This branch is **identical** in all options. Rational choice says: *Ignore identical branches; decide only where options differ.*  
  > - In Choice 1, the *differing* branches are:  
  >   - A: 100 tokens (balls 1–99) vs. B: 150 tokens (balls 1–10) or 50 tokens (ball 100).  
  > - In Choice 3, the *differing* branches are:  
  >   - A: 150 tokens (balls 1–11) vs. B: 250 tokens (balls 1–10).  
  > If you ignored the common 50-token branch, both decisions reduce to: *"11% chance of A’s prize vs. 10% chance of B’s prize."* But you didn’t ignore it. Why?"

  **Step 4: Contrast Certainty vs. Context**  
  > "In Choice 1, Option A’s ‘guarantee’ made the 1% loss in B feel terrifying—even though balls 1–99 give the *same* 100 tokens in both! In Choice 3, both options risked 50 tokens, so you focused on the prizes. The common branch was psychologically invisible in Choice 1 but obvious in Choice 3. **The flip happened because an identical outcome (50 tokens) *felt* different when framed as a ‘loss’ vs. a ‘shared risk’.**"

  **Step 5: Axiom vs. Rationality**  
  > "This violates the **independence axiom**: Your preference should not change when identical outcomes are added/removed. But—is it *irrational*? Maybe not. Humans evolved to fear losses in ‘safe’ contexts. But it *is* inconsistent: You answered the same core question two ways. That’s the tension: Math says ‘ignore the identical branch’; psychology says ‘I can’t.’"

  ---

  ### **Handling Pitfalls**
  - **"Payouts won’t happen!"**: Show cash upfront. Pay immediately.  
  - **"1% = impossible!"**: Pre-demonstrate cage: "Ball 100 exists. I’ll draw fairly."  
  - **Early naming of paradox**: Cut off firmly: "Hold that thought—we’ll discuss after choices."  
  - **Anchor from one student**: Enforce silence. If someone computes aloud: "Please keep reasoning private for now."  
  - **Low stakes dilute effect**: The multiplier (avg. 2×) and loss frame amplify psychological weight. £2–£4 is significant for students.  
  - **No flip in the room?**: Use hypothetical: "If prizes were life-changing, would you flip? Most do."  

  ---

  ### **Why This Works**
  - **Scale Solution**: Loss frame + random multiplier makes £2–£4 feel substantial. The charity frame in Critical 2 heightens loss aversion without invoking altruism (it’s imaginary).  
  - **Disguise Solution**:  
    - Critical 1 is "Prize Fund" (personal gain); Critical 2 is "Donation Draw" (abstract context).  
    - Filler choices mask the link.  
    - Different probabilities (10%/89%/1% vs. 11%/89%) prevent direct comparison.  
  - **Third-Party Variant Not Used**: It confounds with altruism. Instead, the charity is a *narrative veil*—it doesn’t alter payouts but distracts from the common branch.  
  - **Spinning Wheel in Stages Adds Nothing**: The two-stage reveal complicates logistics without enhancing the "common branch" insight.  

  ---

  ### **When to Withdraw This Design**
  **Weakest Element**: The 1% risk of losing 50 tokens (from 100 to 50) may not feel visceral enough with small stakes. If students see it as "trivial," the certainty effect vanishes.  
  **Sign of Failure**: During debrief, consistent students (S1→S2 or R1→R2) dominate, and flippers say, "I didn’t care about the 50 tokens."  
  **Contestable Step**: A sharp student could argue: *"Ignoring the common branch assumes I value tokens linearly. But if I’m risk-averse, the drop from 100→50 feels worse than 50→0, so flipping is rational."* This exposes the axiom’s linearity assumption—which the activity *can’t* stage. Address it: "Expected utility *allows* risk aversion—but it must be consistent. If 100→50 feels catastrophic, why didn’t Choice 3’s 150→50 feel the same?"  

  **Run it Thursday**. The combination of loss framing, multiplier, and disguised common branch will make the flip visceral.
