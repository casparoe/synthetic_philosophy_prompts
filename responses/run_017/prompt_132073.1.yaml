     - **Yes** (report is a "detached readout") → Go to Q3.  
     - **No** (your report isn’t like this) → Go to Q4.  

  3. **Recurring experience scenario**: You have the same experience (e.g., smell of rain) twice. A machine compares your brain states and confirms they’re identical, but you have no memory of the first. Could you still know both experiences were the same?  
     - **Yes** (accuracy doesn’t need experience to "push" the report) → **Leaf 1: Non-causal knowledge**. Reports are reliable because they track non-conscious precursors (e.g., neural states). Experience isn’t causal, but knowledge/content doesn’t require being "pushed" by its subject matter.  
     - **No** (no way to verify sameness) → **Leaf 2: Skeptical sting**. Reports aren’t grounded in experience; we can’t know if they’re true. Judgments are coincidental or empty.  

  4. **Causal exclusion scenario**: Everything you do/say is fully caused by neural machinery. Does the *experience itself* (not just neurons) play any role?  
     - **Yes** → **Leaf 3: Causal efficacy**. Experience has causal power (e.g., it influences reports). No paradox.  
     - **No** → Go to Q5.  

  5. **Alien substitution scenario**: Your brain is altered so that "rain smell" reports are now caused by mint, not rain. You say "I smell rain" when smelling mint. Is this possible without you noticing?  
