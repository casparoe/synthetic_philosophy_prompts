prompt: |-
  I'm in a philosophy of biology seminar this term, and our final paper is meant to be a position piece on the units of selection. Before I commit any of this to prose I'd like the position itself audited, because I have assembled it out of claims that are each, I think, individually defensible, and I have a nagging suspicion that they don't all fit together. Here is the set, roughly as I would defend it.

  (1) I want to separate the question of which entities are the interactors, that is, the things whose properties actually covary with reproductive output in a given population, from the question of which entities are the beneficiaries, the things whose interests the adaptations in question serve. A lot of the acrimony in this literature looks to me like these two questions being run together.

  (2) Genes are the replicators: they are what gets copied with enough fidelity for cumulative selection to build anything. Organisms and most groups are not replicators in that sense, so even where the organism is the interactor, the answer to the beneficiary question is the gene.

  (3) The gene's-eye or inclusive-fitness framework and the multi-level framework are alternative decompositions of the same change in the same population: whatever you can derive with within-group and between-group components you can also derive with relatedness coefficients and costs and benefits, and the other way around. So where the two camps are fighting, the fight is about bookkeeping, about which decomposition is more tractable for the case at hand, not about which one is true.

  (4) At the same time I want to make a substantive claim about the major transitions. When replicating molecules get bundled into cells, or cells into multicellular organisms, or when solitary insects give rise to colonies with sterile castes, what has happened is that selection has shifted from acting predominantly within collectives to acting predominantly on collectives, and that is a real change in how evolution proceeds, not a change in which description we find convenient.

  (5) A case verdict: in meiotic drive, where a genetic element sabotages the gametes carrying its homologue and thereby spreads despite lowering the fertility of the organisms that carry it, I want to say the element is an adaptation for its own spread, and I resist describing this as a conflict between levels. The organism is the vehicle and the vehicle is being exploited; nothing is being selected at the level of the organism against the gene.

  (6) A case verdict: where a host and an obligate bacterial symbiont are transmitted together strictly through the maternal line, and the host builds specialised structures to house and feed it, I am happy to say the association is a unit of selection and that those structures are adaptations for the association. This does not feel to me like it contradicts (2), though I may be fooling myself.

  (7) Another case verdict: cytoplasmic male sterility, where a maternally transmitted organelle mutation shuts down pollen production in a plant and nuclear restorer genes evolve in response, I do want to describe as a genuine conflict between levels. Here I think the gene-level redescription loses something important, unlike in (5).

  (8) Finally, a methodological commitment: I hold an etiological notion of adaptation, on which what makes a trait an adaptation is what cumulative selection built it for rather than what it currently does. That is why I think claims about group adaptation stand or fall on whether group-level selection actually did the building, and why I think such claims succeed rarely, mainly in the neighbourhood of the transitions in (4).

  What I want is an audit rather than a survey or a miniature textbook chapter. Go through the set and tell me which pairs genuinely pull against each other and which only look as though they do, since I'd rather you discriminated than flagged everything at the same volume. For the real tensions, order them by how much damage they do to the package as a whole, and for each one say what I would have to give up and what giving it up would cost me elsewhere in the set. If there is a single revision that resolves more than one of them at once, say so, and say what it commits me to. I am not attached to any particular item, so please don't soften the verdicts on my behalf.

  One epistemic request: as you go, please mark which of the claims you rely on are things people who actually work on this agree about and which are live disputes. I have a bad habit of writing that everyone accepts something when what I mean is that one prominent formulation of it struck me as elegant, and I would like to know which of (1) through (8) are on firmer ground than I have assumed.

  And one formatting request: no headings, no bullet points, no bold text, no tables. Continuous prose, the way you would write an email to a colleague, and tighter rather than longer.
reasoning: |-
  Okay, the user is in a philosophy of biology seminar and needs an audit of their position on units of selection before writing their final paper. They've listed eight claims and want to know if these are internally consistent. They specifically asked for an audit, not a survey, so I need to focus on tensions between their points rather than explaining each one in depth.

  First, I should assess which claims are widely accepted versus contentious. Claim (1) separating interactors from beneficiaries is Hull's standard replicator-interactor distinction, which is foundational in the field. Claim (2) about genes as replicators comes from Dawkins and is influential but debated, especially with challenges from developmental systems theory. Claim (3) on the equivalence of gene's-eye and multi-level frameworks is technically true mathematically but remains philosophically contentious - the disagreement is about explanatory priority, not calculation. Claim (4) on major transitions being shifts in selection levels is the mainstream view following Maynard Smith and Szathmáry. Claim (8) on etiological adaptation is the standard view.

  Now the tensions: The biggest conflict is between (2) and (6). If genes are always the ultimate beneficiaries as (2) claims, how can a host-symbiont association be a unit of selection in (6)? This undermines their position in (6) where they want to call the association itself the beneficiary. Also, (5) and (7) seem inconsistent in their treatment of conflict - why is cytoplasmic sterility a "genuine conflict between levels" while meiotic drive isn't? This relates to their commitment to etiological adaptation in (8).

  A resolution might be to soften (2) by accepting that beneficiaries can shift during major transitions. But this would require abandoning the strict gene-centric view in (2) and might affect their stance on meiotic drive in (5). Alternatively, they could keep (2) but then must reframe (6) as gene-level selection, which they explicitly resist.

  Other minor tensions: Claim (3) claims frameworks are equivalent, but (4) and (7) suggest multi-level selection provides unique insights. And (8)'s etiological view might complicate their verdict on cytoplasmic sterility in (7) if group selection didn't historically build the trait.

  I should note that (1) is crucial for resolving some tensions - distinguishing interactors from beneficiaries helps explain why the symbiosis case (6) can have an association as interactor while genes remain beneficiaries. But the user wants to call the association itself a unit of selection in (6), which pushes against this separation.

  The most damaging tension remains between (2) and (6). To resolve this, the user would need to either modify (2) to allow for higher-level beneficiaries after transitions, or reinterpret (6) as ultimately serving gene interests. The first option better preserves their intuitions about major transitions in (4).

  I'll structure the response as continuous prose, starting with the least controversial claims, then moving to major tensions, and finally offering resolution paths. I'll be direct about conflicts without softening the verdicts, as requested, and explicitly note consensus versus disputed points throughout.
answer: |-
  Here's an audit of your position, focusing on internal tensions, ordered by severity. I'll note consensus where clear and flag live disputes.

  **Severe Tension: (2) vs. (6) & (4)**  
  Your commitment to genes as *the* beneficiaries in (2) directly contradicts your verdict in (6) (host-symbiont association as a unit/beneficiary) and the spirit of (4) (selection shifting levels in transitions). If genes are always the ultimate beneficiaries, framing the symbiosis as a unit with *its own* adaptations conflicts with (2)'s exclusivity. (6) implies the association itself benefits from the adaptations, not just the genes within it. Similarly, (4) suggests that post-transition, the collective *becomes* a beneficiary. (1) provides a potential escape hatch (separating interactor from beneficiary), but your language in (6) ("adaptations *for the association*") pushes against this, implying the association is the beneficiary, not just the interactor. *Resolution Cost:* Softening (2) to allow that beneficiaries *can* shift during major transitions (e.g., the association becomes a beneficiary) resolves (6) and coheres with (4). The cost is abandoning strict gene-centrism for beneficiary status in post-transition scenarios. (Note: (2) is Dawkins' strong view, heavily contested; the idea that beneficiaries *can* shift is widely accepted post-Maynard Smith & Szathmáry).

  **Significant Tension: (5) vs. (7)**  
  Your differing verdicts on meiotic drive (5: not a level conflict, gene adaptation) vs. cytoplasmic male sterility (CMS) (7: genuine level conflict) feel arbitrary without a clear principle distinguishing them. Both involve intragenomic conflict harming organismal fitness. Why is one merely gene-level selection exploiting the organism (5) while the other is a "genuine conflict between levels" (7)? Your reasoning in (7) ("gene-level redescription loses something important") suggests the *dynamics* or *counter-adaptation* (nuclear restorers) make CMS different. But (3) implies such dynamics *should* be redescibable equivalently. *Resolution Cost:* To cohere, you need a principled criterion for when conflict constitutes "levels" beyond just gene selfishness. You could argue CMS involves distinct *replicators* (nuclear vs. cytoplasmic genes) with different inheritance pathways and potential interactors (cell/organism for nuclear, often just cell for cytoplasmic), making it multi-level in a way meiotic drive (same genome/replicator type) isn't. This leverages (1) but requires refining your conflict definition. Alternatively, abandon (7)'s "genuine conflict between levels" language and treat it like (5), but you clearly feel that loses insight. (Note: Classifying intragenomic conflicts is a live dispute; your intuition on CMS is shared by many).

  **Moderate Tension: (3) vs. (4) & (7)**  
  (3) claims the frameworks are equivalent decompositions ("bookkeeping"). Yet (4) posits a "real change in how evolution proceeds" during transitions, and (7) claims the gene-level view "loses something important" for CMS. This subtly undermines strict equivalence. If the shift in (4) is merely a bookkeeping convenience, why call it a "real change"? If CMS dynamics are fully captured equivalently by the gene view (per (3)), how can it "lose something"? *Resolution Cost:* This tension is manageable if you clarify that the *real change* in (4) refers to altered population structures and selective regimes (e.g., suppression of within-group conflict), making the multi-level decomposition *causally more perspicuous* or *explanatorily primary* for understanding the transition's outcome, even if formally equivalent. Similarly, for (7), argue the multi-level description better captures the causal structure or explanatory targets. This upholds (3)'s formal equivalence while allowing (4) and (7) their substantive force. (Note: (3)'s formal equivalence is widely accepted; whether one framework is *explanatorily superior* in specific cases is deeply disputed).

  **Minor Tension: (8) vs. (7)**  
  Your etiological view (8) demands adaptations be built by the selection process benefiting the unit in question. For CMS (7), if it's a conflict between levels (e.g., cytoplasmic gene vs. nuclear gene/organism), what built the male-sterility trait? Likely selection *within* the cytoplasm/egg cell lineage favouring selfish spread, not group selection. Calling it a "level conflict" might imply group-level adaptations exist here, but (8) suggests they don't. *Resolution Cost:* Be precise: The male-sterility trait is an adaptation *for the cytoplasmic gene*, built by selection at the gene/organelle level. The nuclear restorer is an adaptation *for the nuclear gene/organism*. The *conflict* arises from their interaction, not because group selection built adaptations for the group. This resolves the tension by applying (8) strictly to the traits, not to the conflict concept itself.

  **Firmer Ground:**  
  (1) (Interactor/Beneficiary distinction) is Hull's standard framework, widely used and foundational.  
  (3) (Formal equivalence of frameworks) is mathematically established (e.g., Price equation derivations) and broadly accepted, though its *interpretive* significance is debated.  
  (8) (Etiological adaptation) is the dominant philosophical view.  
  (4) (Major transitions involve shift in level of selection) is the mainstream view following Maynard Smith & Szathmáry.

  **Live Disputes/Contested Ground:**  
  (2) (Genes as *the* beneficiaries) is the core of the gene's-eye view but contested by proponents of multi-level selection, evolutionary transitions, and developmental systems theory who argue higher-level units can be beneficiaries/replicators.  
  (5), (6), (7) (Case verdicts) hinge on interpretations where consensus doesn't exist; your stances fall within mainstream debates.  
  The *explanatory primacy* implied in (4) and (7), even after accepting (3)'s equivalence, is hotly contested.

  **Key Resolution Path:**  
  The most damaging tension is (2) vs. (6)/(4). **The single most effective revision is to moderate (2):** Allow that while genes are the *fundamental* or *original* replicators, during/after a major transition, the *collective entity* (like the host-symbiont association) can become a *derived beneficiary* (and potentially a higher-level replicator, though that's a bigger step). This:  
  *   Preserves your core verdict in (6) by legitimizing the association as beneficiary.  
  *   Coheres with the "real change" in (4) – the shift enables a new beneficiary to emerge.  
  *   Minimally impacts (5) (meiotic drive remains clearly gene-benefiting).  
  *   Clarifies (7) (CMS conflict can be framed as between a "lower-level" beneficiary - the cytoplasmic gene - and a "higher-level" beneficiary - the organism/nuclear genome).  
  *   Is consistent with (1) and (8).  
  *   Retains the centrality of genes while acknowledging transitions create new evolutionary individuals. This view is defensible and aligns with many working on transitions (e.g., Queller, Strassmann). The cost is stepping back from the strongest gene-centrism of (2).
