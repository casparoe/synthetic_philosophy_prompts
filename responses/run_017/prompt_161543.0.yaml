answer: |-
  ### Sestina: On the Demon's Ruler

  The demon knows the present, perfect **state**;  
  It wields the iron-clad, deterministic **map**.  
  But grant the faintest tremor, slightest **error**—  
  Like orbits tracing one bright Lorenz **wing**—  
  Our forecast yields a pale, proximate **shadow**,  
  Not truth, but coarse statistical **measure**.  

  We salvage sense through invariant **measure**  
  To chart the bulk, not the lone **state**.  
  The shadow lemma grants a faithful **shadow**:  
  For every path we fake, a true **map**  
  Exists—though which lobe grips the **wing**  
  Depends on seeds of primal **error**.  

  Each digit bought extends the view, but **error**  
  Defies containment by mere **measure**.  
  The system veers—now this, now that **wing**—  
  To settle in a divergent **state**.  
  We strain to parse the strict **map**'s  
  Demands, yet lose the trail in **shadow**.  

  This **shadow** walks a real path, though **error**  
  Persists. We grasp the climate (not the weather), **measure**  
  The rhythm of the wings: which **wing**  
  Will cradle the next transient **state**?  
  The **map** is just, but not the **map**'s result—  
  A flip we cannot clutch, pure **error**'s art.  

  Round one bright **wing**, then crossing space,  
  The true course haunts our frail **shadow**'s trace.  
  The demon's flawless **state**  
  Succumbs to micro-fractured **error**.  
  We hold the long-term **measure**  
  Though each application of the **map**'s a leap.  

  The **map** stands fixed, the laws austere—  
  But which embrace? Which turning **wing**?  
  We know the coarse-grained **measure**,  
  Track the **shadow** as it veers,  
  While buried **error** swells to bloom  
  And shatters knowledge of the **state**.  

  O Demon! You command the **map** and **state**,  
  Yet **error** blooms; the **shadow** takes the **wing**.  
  We keep the **measure**—not the point—too late.  

  ---

  **Note for the Instructor** (118 words):  
  The determinism/predictability distinction anchors stanzas 1 and 6: laws are fixed ("iron-clad map"), but forecasts shatter ("shatters knowledge"). The cost of precision is explicit in stanza 3, line 1 ("Each digit bought extends the view, but error"), capturing fixed foresight increments. What survives—the measure and shadowing—dominates the envoi and stanzas 2 ("invariant measure"), 4 ("shadow walks a real path"), and 5 ("long-term measure"). Undergraduates may misread "shadow" (stanza 2, line 3) as mere approximation; clarify its technical sense (a true trajectory ε-close to the computed one). Lorenz wings (stanza 1) avoid butterflies. The form’s sensitivity to end-words mirrors thematic sensitivity. No indeterminism implied; chaos is lawful but unpredictable.
