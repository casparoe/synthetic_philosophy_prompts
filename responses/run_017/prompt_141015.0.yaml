prompt: |-
  You are a professional philosopher who specialises in population ethics and who has, at some point in your career, advised a government on how to appraise policy. Take this slowly. Before you commit to a reconstruction, spend a few paragraphs brainstorming: list at least five different ways the practice I describe below might be rationalised, including rationalisations that rule each other out, and note what each would predict about the details. Only then give me your considered answer, structured under the headings I suggest at the end.

  Here is the practice, as concretely as I can state it. I work in the appraisal unit of a finance ministry, so I have seen several versions of it from the inside.

  A number of wealthy countries with low birth rates — Japan, South Korea, Singapore, Hungary, Italy among them — pay their citizens to have children: cash baby bonuses, per-child tax credits, housing priority, loan forgiveness conditional on childbearing. What interests me is not the spending but the paperwork around it.

  First, the way these programmes are justified and scored. The case made in cabinet is almost never that the parents would enjoy the child. It is fiscal and demographic: the worker-to-retiree ratio is projected to worsen, pensions and health spending for the elderly are funded out of current taxation, therefore the country needs more future workers and taxpayers. Long-run fiscal sustainability reports treat a smaller projected workforce as a cost in itself. Migrants are admitted through points systems that partly score applicants on expected lifetime net fiscal contribution, and in the workforce projections a migrant and a newborn are, for these purposes, interchangeable units — nobody in the ministry cares whether the twenty-fifth worker arrives by birth or by plane.

  Second, what the scoring leaves out. Every other intervention the same ministry appraises is scored by its effect on the welfare of the population, normally through willingness-to-pay or quality-adjusted life years, i.e. in terms of how well off identifiable people end up. Fertility programmes are the exception. The benefit side is the present discounted value of the marginal child's expected lifetime net tax contribution. The child's own lifetime well-being does not appear anywhere on the benefit side.

  Third, a complication from another department. The environment ministry's models treat each additional resident as a lifetime stream of emissions, so in its long-run scenarios a larger future population is a cost. The same marginal child is therefore an asset in one spreadsheet and a liability in another, and is a welfare subject in neither.

  Fourth, the episode that prompted this question. Our ministry is considering replacing the universal baby bonus with what it calls a marginal birth payment: the same money, but paid only where the birth can be certified as one that would not have occurred at the current payment rate — in practice, targeted at higher-order births or at parents who declare they would otherwise have stopped. The appraisal keeps the old convention, excluding the child's own lifetime well-being from the benefit side, and gives this reason: the child who exists only because of the payment cannot be said to have been made better off by it, since without the payment there would have been no one to be better off. A member of the committee objected that this is not neutrality but a substantive and controversial claim about whether existence can benefit the person who exists, and that if you are prepared to count the fiscal contributions of a person whose existence you caused, you have already taken a stand on comparing existence with non-existence and cannot then refuse to count that person's welfare. The ministry replied that it is taking no stand at all: it is simply counting effects on people who are already alive, and the child's welfare is excluded for bookkeeping reasons, not philosophical ones.

  I have read a little around this and have had two unhelpful friends. One says the whole thing is just the repugnant conclusion in a suit. The other says it is the non-identity problem, and that the targeting reform makes things worse rather than better, which I find counter-intuitive: surely paying only for births that would not otherwise have happened is the efficient thing to do, whatever your ethics. I cannot tell whether either friend is saying anything, and I do not want an answer of the form this is really total utilitarianism, because the refusal to count the child's welfare looks to me like the opposite of that.

  So, please tell me:

  1. **The implicit theory.** What view of the value of adding people — of whether and in what way it matters that there be more people — does this bundle of practices and scoring conventions presuppose? Reconstruct it in full, including the parts that are not stated.
  2. **Strict presupposition versus good fit.** Which parts of the practice strictly require that theory, and which are equally licensed by rival views? In particular, is the ministry's already-alive reply sufficient to reconstruct the whole practice on a person-affecting or asymmetry-friendly basis, so that the practice is philosophically underdetermined? If so, say exactly which observable features of the practice would settle the question, and which never could.
  3. **The exclusion.** Is the decision not to score the child's own welfare a genuine substantive commitment about existence and non-existence, or is it a defensible convention about measurability, standing, or double counting? What in the practice would become incoherent if existence *could* benefit the person who exists? Pay attention to the fact that the exclusion is applied only in fertility programmes and not elsewhere.
  4. **Internal coherence.** Is it coherent for one part of government to count a marginal person as a fiscal asset and another to count the same person as an emissions liability while no part counts that person's welfare? What, on this practice's own terms, is a person — a welfare subject, a fiscal unit, or something else? Is there a version of the practice that is coherent, and would it still be recognisable as population policy?
  5. **The targeting inversion.** Assess my second friend's claim. Does making the payment conditional on the birth's counterfactual non-existence strengthen the justification or undermine it? Does the answer differ depending on which of the theories from (1) is the right reconstruction? This is the part I most want you to reason through carefully rather than settle by assertion.
  6. **Replacement.** Suppose the implicit view were replaced, first by a strict asymmetry view on which we have no reason to bring happy people into existence, and then by an averaging view on which what matters is the average welfare level rather than the total. For each: which elements of the current practice survive unchanged, which survive with a different justification, and which would have to be abandoned? I want the concrete institutional consequences, not just the abstract ones.

  Finally: is there something philosophically important that both the ministry and the objector are missing — some distinction they are both sliding over — which a better-designed practice would have to confront explicitly?

  You do not need to cite anything; reason from the practice as I have described it.
reasoning: |-
  Okay, let me approach this step by step. The user presents a complex policy appraisal practice and asks for philosophical analysis, so I need to unpack it systematically. 

  First, I'll mentally catalogue the key features: (1) fertility incentives are justified solely by future fiscal contributions, not child welfare; (2) the environment ministry counts each person as an emissions cost; (3) the new "marginal birth payment" explicitly excludes welfare considerations for counterfactually non-existent children; (4) there's internal tension between departments treating the same human life as asset/liability without welfare accounting.

  Hmm, the user's core concern seems to be whether this practice implicitly endorses a particular population ethics view despite official neutrality claims. The unhelpful friends' "repugnant conclusion" and "non-identity problem" comments suggest they're wrestling with how existence comparisons are smuggled in. 

  For the brainstorming phase, I consider at least five rationalizations: 
  - Pure fiscal instrumentalism (people as tax units)
  - Weak person-affecting view (only impacts on existing people count)
  - Covert total utilitarianism (fiscal contribution as proxy for net welfare)
  - Strong asymmetry (avoiding welfare comparisons for non-existent)
  - Departmental fragmentation (no unified theory)

  The ministry's "already alive" defense feels fragile - if they're willing to count fiscal effects of created lives, why not welfare? That inconsistency nags at me. And the targeting reform... if they only pay for otherwise non-existent births, they're explicitly trading welfare subjects for fiscal units, which seems ethically weightier than they admit.

  For the child welfare exclusion, I notice a telling detail: they use willingness-to-pay for everything except fertility policy. That selective omission suggests it's not just measurability - they're actively avoiding the existence question. If existence could benefit a person, their whole scoring would need welfare columns for created lives.

  The inter-departmental incoherence is stark. If a person is just a fiscal unit to Finance and emissions vector to Environment, what happens to the human? But pragmatically, maybe they could synthesize by treating population size as policy variable with costs/benefits - though that feels uncomfortably reductive.

  On the targeting reform: my intuition is that efficiency arguments fail ethically because it turns reproductive choices into explicit fiscal transactions. The ministry can't have it both ways - either the child's existence matters for welfare or it doesn't, but they're cherry-picking when to apply personhood.

  If we swapped ethical frameworks... say asymmetry view would reject all pro-natalist incentives, while averaging view might penalize high-fertility groups. Both would rupture current practice. The real institutional pain point is that their fiscal logic depends on adding people being desirable, which asymmetry explicitly denies.

  The deeper philosophical gap I see is conflation of different "modes of existence." A future worker is treated as real for fiscal projections but hypothetical for welfare - that ontological double-standard needs resolving. A better practice would force explicit stance on whether state-induced persons are welfare subjects or mere instruments.
answer: |-
  ### Brainstorming: Five Rationalizations
  1. **Fiscal Instrumentalism**  
     *Rationale:* Treats individuals solely as economic units within state accounting. The child's value is reduced to projected net tax revenue minus transfers.  
     *Predictions:*  
     - Ignores welfare, environmental, or ethical dimensions.  
     - Migrants and newborns are interchangeable fiscal inputs.  
     - Would oppose "marginal birth payment" reform (inefficient if universal payments cover births that would occur anyway).  

  2. **Weak Person-Affecting View**  
     *Rationale:* Only effects on *existing* people matter. Future children don't currently exist, so their welfare is irrelevant; only their impact on current taxpayers counts.  
     *Predictions:*  
     - Excludes child’s welfare but counts fiscal effects (which benefit existing retirees).  
     - Defends "marginal birth payment" as it avoids "waste" on inevitable births.  
     - Rejects environmental costs (future emissions don’t harm *current* people).  

  3. **Covert Total Utilitarianism**  
     *Rationale:* Assumes adding happy people is good, but uses fiscal contribution as a proxy for net welfare (e.g., taxes fund social goods).  
     *Predictions:*  
     - Would include child’s welfare if measurable; fiscal data is a pragmatic substitute.  
     - Environmental costs are negative externalities unaccounted for in the model.  
     - Supports targeting reform (maximizes "efficiency" in creating net-positive lives).  

  4. **Strong Asymmetry View**  
     *Rationale:* Creating a person cannot benefit them (since nonexistents have no welfare to improve), but can avoid harming existing people by preventing fiscal collapse.  
     *Predictions:*  
     - Excludes child’s welfare as philosophically incoherent.  
     - Justifies fertility programs solely to protect current citizens.  
     - Environmental costs matter only if they harm *current* populations.  

  5. **Departmental Fragmentation**  
     *Rationale:* No unified ethical theory; each agency optimizes narrow metrics (Finance: GDP/tax base; Environment: emissions; neither "owns" welfare).  
     *Predictions:*  
     - Inconsistent treatment of marginal lives across departments.  
     - Targeting reform driven by accounting efficiency, not ethics.  
     - Child welfare exclusion is bureaucratic (no methodology to quantify it).  

  ---

  ### 1. The Implicit Theory  
  **Presupposition:** A **fiscal-person-affecting view** with **weak asymmetry**.  
  - Future persons lack moral standing *per se*, but their economic impact on *current* persons matters.  
  - Adding lives is instrumentally valuable only if it improves fiscal stability for existing citizens.  
  - Implicitly denies that existence *benefits* the created person (non-identity problem dodged by exclusion).  
  - Unstated parts:  
    - Welfare is irrelevant if unmeasurable or ontologically fraught.  
    - Environmental costs are someone else’s problem (intergenerational externalities).  

  ---

  ### 2. Strict Presupposition vs. Good Fit  
  - **Strictly required:**  
    - Treating newborns/migrants as interchangeable fiscal units.  
    - Excluding child welfare *only* in fertility programs (elsewhere, welfare affects existing people).  
  - **Compatible with rivals:**  
    - Targeting reform fits *all* rationalizations (efficiency is universally valued).  
    - The "already-alive" reply *could* support weak person-affecting or asymmetry views.  
  - **Underdetermination:** Yes. Observable features that could settle it:  
    - If the ministry *included* welfare for children whose existence was independent of policy (e.g., education benefits), it would refute asymmetry.  
    - If environmental costs were integrated into fiscal models, it would imply a unified population ethics.  
    - **Never settled by:** Fiscal scoring conventions alone (compatible with instrumentalism or utilitarianism).  

  ---

  ### 3. The Exclusion of Child Welfare  
  - **Substantive commitment, not convention:**  
    - If existence *could* benefit a person, excluding welfare would be incoherent. The ministry counts fiscal contributions (a positive effect of existence) but denies welfare can be counted. This inconsistency reveals a tacit asymmetry view: existence is "neutral" for welfare but positive for fiscal accounts.  
    - Measurability fails as an excuse: Willingness-to-pay *could* estimate lifetime welfare but isn’t used.  
    - Double-counting isn’t at issue: Fiscal contributions and welfare are distinct.  
    - **Incoherence if existence benefits:** If a child’s welfare *were* counted, fertility incentives would likely be higher (adding a happy life is good) and targeting reform harder to justify (paying for inevitable births might still boost welfare).  

  ---

  ### 4. Internal Coherence  
  - **Incoherent:**  
    - A person is a **fiscal unit** to Finance, an **emissions vector** to Environment, and a **non-subject** to both. No shared ontology.  
    - Finance treats population growth as good (fiscal), Environment as bad (emissions), but neither asks if it’s *better for people*.  
  - **Coherent version:**  
    - A unified model could treat population size as a policy variable with costs (emissions) and benefits (taxes, welfare).  
    - **Would it still be population policy?** Yes, but welfare-inclusive (e.g., "net welfare contribution per marginal life"). The *current* practice would collapse if forced to integrate.  

  ---

  ### 5. The Targeting Inversion  
  **Your friend is half-right.**  
  - **Strengthens justification on fiscal grounds:**  
    - Pays only for *new* taxpayers, avoiding waste on births that would happen anyway. Efficiency improves.  
  - **Undermines ethical coherence:**  
    - By paying *only* to create lives that wouldn’t exist, the state explicitly treats those lives as fiscal instruments. This sharpens the non-identity problem: The child exists *because* of payment, yet its welfare is excluded.  
  - **Dependency on theory:**  
    - **Fiscal instrumentalism:** Strengthened (efficiency gain).  
    - **Weak person-affecting:** Unchanged (still benefits existing people).  
    - **Total utilitarianism:** Undermined (fails to capture welfare gains from the child’s life).  
    - **Asymmetry view:** In crisis (if creating life can’t benefit the child, why create it? Only fiscal emergency justifies it).  

  ---

  ### 6. Replacement  
  **A. Strict Asymmetry View** (No duty to create happy lives)  
  - **Survives unchanged:** Nothing. Asymmetry rejects pro-natalism *unless* to prevent harm to existing people.  
  - **Survives with justification:** Fertility incentives only if demographic collapse *harms current citizens*.  
  - **Abandoned:** Fiscal scoring of marginal children (adding people isn’t inherently good).  
  - **Institutional consequence:** Programs reframed as "pension crisis prevention," not "investment."  

  **B. Averaging View** (Value = average welfare)  
  - **Survives unchanged:** Environmental cost counting (more people lower average welfare if emissions rise).  
  - **Survives with justification:** Fiscal incentives only if new parents are welfare-poor (else higher population lowers average).  
  - **Abandoned:** Interchangeability of migrants/newborns (migrants screened for high skills/welfare).  
  - **Institutional consequence:** Baby bonuses for low-income groups only; points-based migration favors elites.  

  ---

  ### The Overlooked Distinction  
  Both ministry and objector conflate **causal responsibility** with **moral standing**:  
  - Ministry: "We didn’t *cause* the child’s existence; we incentivized parents" (deflecting responsibility).  
  - Objector: "Counting fiscal contributions *implies* moral responsibility for welfare."  
  **Better practice:** Explicitly state whether the state is:  
  (a) A *creator* of persons (accountable for their welfare), or  
  (b) A *fiscal optimizer* using humans as inputs.  
  This forces owning the ethical stance—e.g., "We create taxpayers but owe them no welfare consideration" (a defensible but grim position).  

  **Final Note:** The practice is **fiscal instrumentalism with person-affecting blinders**, ethically unstable but bureaucratically functional. The targeting reform sharpens its contradictions but doesn’t resolve them.
