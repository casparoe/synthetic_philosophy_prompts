  Okay, the user is in a reading group with mixed backgrounds—ML and policy/philosophy—and they're stuck on AI existential risk. One person sees it as the century's defining problem, another dismisses it as a niche obsession with improbable high stakes. The user wants to avoid rehashing that debate. Instead, they want a clear set of criteria for what would make an argument about AI existential risk adequate for real-world decisions, like imposing compute caps or career choices. 

  The user has already outlined some requirements: decomposing risk into hazard/exposure/vulnerability, focusing on marginal claims (not absolutes), specifying the risk type (misuse, loss of control, competitive dynamics), defining "existential," handling historical analogies and mechanisms independently, addressing the fanaticism problem (tiny probabilities vs huge stakes), and testing against two scenarios—the quiet decade (capabilities plateau) and the fire-inspector's problem (successful safety measures leave no evidence). 

  The user's deeper need seems to be cutting through ideological noise. They suspect some requirements might conflict—especially empirical grounding vs decision-relevance—since existential risks are unique and unobservable if avoided. They also want to know which requirement filters out most bad arguments, and how three common arguments fail the criteria. 

  First, I'll structure the requirements clearly, linking each to its motivation. The decomposition (hazard/exposure/vulnerability) is non-negotiable because conflating them leads to misguided interventions. Marginal claims are essential for policy decisions—absolute probabilities are useless. Specifying the risk type matters because solutions differ: a compute cap might curb competitive dynamics but not misuse. Defining "existential" is crucial—permanent stagnation vs extinction implies different stakes. The analogy/mechanism split forces arguments to stand without cherry-picked history. The fanaticism problem needs explicit handling since policy can't chase infinitesimal risks. The test cases (quiet decade, fire-inspector) expose whether an argument relies on observable crises or can handle hidden successes. 

  Now, conflicts: The biggest tension is between empirical constraint (needing evidence) and decision-relevance (needing actionable probabilities). Past near-misses might be invisible, and unique events can't be tested. Also, decomposing vulnerability (civilizational fragility) might clash with fanaticism—if we're resilient, tiny risks aren't worth drastic policies, but proving resilience is hard. The fire-inspector scenario exacerbates this—success looks like no risk, making empirical validation impossible. 

  The most filtering requirement is likely the decomposition. Most arguments lump hazard/exposure/vulnerability together—e.g., "AGI will kill us all" without explaining how, who deploys it, or why we can't recover. 

  For the three arguments: 
  - "Just another tech" fails decomposition (ignores novel hazard like recursive self-improvement) and the fire-inspector test (assumes past safety implies future safety). 
  - "Default misalignment" might pass decomposition but fails marginal claims (doesn't specify how interventions change probabilities) and the quiet decade (if capabilities plateau, does misalignment risk vanish?). 
  - "Competition makes restraint impossible" often skips vulnerability (assumes no recovery mechanisms) and fanaticism (treats high stakes as overriding any probability). 

  The user needs this framework to evaluate arguments neutrally, not to endorse a side. Highlighting conflicts (e.g., empirical vs decision needs) might validate their suspicion that some debates are intractable by design.
answer: |-
  Here’s a requirements list for a decision-adequate case on AI existential risk (x-risk), structured around your specifications. I’ll flag non-negotiables, tensions, and failures of common arguments—prioritizing the criteria over scoring.

  ### Core Requirements & Motivations
  1. **Decomposition of Risk (Hazard/Exposure/Vulnerability)**  
     *Why*: Interventions differ radically:  
     - **Hazard** (e.g., uncontrollable AGI optimization) → *Technical controls* (e.g., alignment research).  
     - **Exposure** (e.g., race dynamics) → *Policy levers* (e.g., compute caps).  
     - **Vulnerability** (e.g., no recovery from civilizational collapse) → *Systemic resilience* (e.g., decentralized infrastructure).  
     *Non-negotiable*: Conflation recommends wrong interventions (e.g., capping compute ignores hazard if misalignment is inherent).

  2. **Marginal Claims, Not Absolutes**  
     *Why*: Decisions are incremental. Must show:  
     - Probability(x-risk) *with* compute cap vs. *without*.  
     - Impact of career shift on risk reduction (e.g., "Technical safety work lowers hazard probability by *X%* per researcher-year").  
     *Non-negotiable*: Headline probabilities (e.g., "10-50% extinction chance") are useless for policy trade-offs.

  3. **Specify Risk Pathway**  
     *Why*: Each pathway demands distinct defenses:  
     - **Misuse** (e.g., bioweapon design) → Intelligence/access controls.  
     - **Loss of Control** (e.g., mesa-optimizers) → Alignment/containment.  
     - **Structural Dynamics** (e.g., multipolar races) → Coordination/regulation.  
     *Non-negotiable*: A compute cap might reduce structural risk but increase misuse (if centralized in rogue actors).

  4. **Define 'Existential' Operationally**  
     *Why*: Policy rigor depends on stakes:  
     - **Extinction**: Zero recovery → Precautionary bans.  
     - **Permanent Stagnation**: Milder → Adaptive governance.  
     - *Must re-test interventions under each definition*.  
     *Non-negotiable*: Without this, "support compute caps" could be overkill (for stagnation) or insufficient (for extinction).

  5. **Survive Analogy/Mechanism Split**  
     *Why*: Avoids false precedents and just-so stories.  
     - Remove analogies (e.g., "nuclear winter") → Case must stand on *causal mechanisms* (e.g., instrumental convergence).  
     - Remove mechanisms → Historical patterns (e.g., industrial accidents) must *predict* without hand-waving.  
     *Non-negotiable*: Both camps use analogies as crutches; this forces rigor.

  6. **Address Fanaticism**  
     *Why*: Tiny probabilities × astronomical stakes distort decisions. Must state:  
     - Whether to maximize expected value (risking overreaction) or use thresholds (e.g., "ignore p<1e-15").  
     - How intervention cost-benefit changes under each approach.  
     *Conditionally negotiable*: If stakes are non-astronomical (e.g., stagnation, not extinction), fanaticism vanishes.

  7. **Pass Test Cases**  
     - **Quiet Decade** (capabilities plateau): Case must explain why risk persists/is reduced *without* observable progress (e.g., "Alignment failures possible even at plateau").  
     - **Fire-Inspector Problem** (success looks like safety): Case must justify interventions *without* relying on near-misses (e.g., "Absence of catastrophe ≠ safe; we rely on *mechanistic* evidence").  
     *Non-negotiable*: Failing these disguises speculation as evidence.

  ---

  ### Tensions & Unsatisfiable Demands
  - **Key Conflict**: Empirical constraint vs. decision-relevance.  
    - *Problem*: Unrepeatable events + selection bias (no survivors to report) + fire-inspector dynamics → **No empirical data can validate x-risk probabilities**.  
    - *Result*: Strong empirical arguments become mechanistic (untestable pre-AGI), while decision-relevance demands numbers. *This tension is unresolvable*; the best cases will admit uncertainty but bound risks via mechanisms (e.g., "Vulnerability is high because digital systems enable instant cascades").  
  - **Secondary Conflict**: Decomposition vs. fanaticism.  
    - If vulnerability is low (resilient civilization), tiny risks are tolerable—but proving vulnerability requires historical evidence (which fire-inspector obscures).  

  **Most Exclusionary Requirement**: **Decomposition**. >90% of discourse fails here (e.g., "AGI could kill us all" conflates hazard + exposure; "We can’t align AGI" ignores vulnerability).

  ---

  ### Why Three Arguments Fail the List
  1. **"Just Another General-Purpose Technology"**  
     Fails decomposition (ignores novel hazards like recursive self-improvement), test cases (assumes past safety implies future safety; fails fire-inspector), and marginal claims (no comparison to status quo). Relies on analogy (e.g., "Like steam engines") without mechanism.

  2. **"Default Misalignment of Superintelligent Systems"**  
     Fails specification (focuses only on loss-of-control), marginal claims (rarely quantifies how interventions reduce risk), and vulnerability (assumes extinction, not recoverable collapse). Often fails quiet decade test (if superintelligence is required for x-risk).

  3. **"Competition Makes Restraint Impossible"**  
     Fails decomposition (exposure-only; ignores hazard reducibility) and fanaticism (assumes high stakes justify action regardless of probability). Fails quiet decade (if capabilities plateau, competition may ease) and often conflates structural risk with extinction.

  ---

  ### Summary
  A decision-adequate case must: decompose risk, quantify marginal impacts, specify pathways, define stakes, withstand analogy/mechanism stress tests, handle fanaticism transparently, and survive your two scenarios. The core tension—**empirical untestability vs. need for action**—cannot be fully resolved, forcing reliance on mechanistic plausibility and explicit uncertainty bounds. The list filters out most extant arguments by demanding granularity over grand narratives.
