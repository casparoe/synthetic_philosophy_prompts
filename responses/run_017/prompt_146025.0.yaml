prompt: |-
  Longtime lurker, been reading the Sequences and the rationalist-adjacent blogs since way back, and I'm a fairly serious birder, which is why I keep tripping over this thing I dont have a word for. In my first year, a warbler was a small yellow bird, a blur with a bit of motion in it. Now the same patch of retina delivers a crisp eye-ring, a particular way of flicking, a shape that is unmistakably one species and not the two lookalikes — and, importantly, I cant get the blur back. It isn't that I choose to interpret it; once I've seen it as the right species I can't even see it as the wrong one, any more than I can unsee the duck-rabbit once it flips. Same story from my sister in radiology (scans used to be grey mush, now they are obviously a thing) and from a friend who trained as a coffee taster. I keep wanting to say that learning changed what the stuff looks like, not just what I think about it, but I also cant shake my friend's reply that this is all judgment and vocabulary and I'm just more willing to say the words now.

  Three cases make me think it isn't one thing, and I want to know which of them belong together. First, the lock-in: a while back I was told a friend had said something nasty about me, and for months afterwards her face looked different to me — harder to read as friendly, slightly wrong — and then it turned out the report was fabricated, I fully believed it was false, apologized, the works, and her face kept looking wrong for another couple of weeks. So whatever happened outlived the belief that produced it, which makes me suspicious that "your belief is reaching down into your perception" is the wrong shape of explanation. Second, provenance and value: knowing that a bird is an introduced species rather than a native one, or that the call I'm hearing is a mimic and not the real bird, changes what I hear — the same acoustics lose something — even though I know perfectly well that nothing about the sound changed and I have no particular feelings about the bird either way. Third, the de-enrichment: learning sometimes makes me take in less. Once I can name a call I stop hearing the rest of the soundscape around it, and my sister's crowd apparently miss things in scans that a naive undergrad walks right past. (I think I half-remember a study about hiding something in a scan, but the details don't matter — the phenomenon I mean is that expertise can flatten as well as sharpen.) None of this is the dress thing or the Necker cube, where the same input flips on its own with no learning involved, and it isn't plain inattention either, since in the warbler case I'm attending as hard as I can and can't undo it.

  I've half-heard of "cognitive penetration" and of modularity of mind, and maybe something called New Look psychology, but I genuinely don't know if that's the right neighborhood or which of my three cases would even qualify under the usual criteria — I suspect some of them get excluded on a technicality, e.g. the lock-in case might stop counting precisely because the effect outlasts the belief, and get relabeled as learning or recalibration instead. So: what's the name for this cluster, if there is one; which of my three cases are really the same phenomenon and which aren't; how you could in principle (or in practice) tell "you see it differently" from "you judge or describe it differently," without the test just begging the question; and is there an established term for the specifically evaluative/provenance-ish subset, as opposed to penetration by plain factual knowledge? If that subset has no name, coin one, define it, and give me the boundary cases — what the smallest tweak to the case would be that makes it stop being an instance. I don't want a one-word answer and please don't send me a reading list or citations, I'm not writing a paper, I just want to know the shape of the thing and which of my three weird cases is the interesting one.
reasoning: |-
  Okay, let me unpack this fascinating query. The user describes a profound shift in perception across domains - birding, radiology, coffee tasting - where expertise fundamentally alters sensory experience. They present three nuanced cases: persistent facial interpretation after false information (lock-in), altered auditory experience based on provenance knowledge (provenance/value), and perceptual narrowing with expertise (de-enrichment).

  The core tension is between "seeing differently" versus "interpreting differently." The user explicitly rejects simplistic explanations like inattention or ambiguous figures (Necker cube), and wants to know: (1) what unifies/divides their three cases, (2) how to distinguish perceptual change from judgment change, (3) whether there's a term for the provenance effect specifically.

  Hmm, the user's background matters here. As a long-time rationalist community reader, they'll appreciate precise conceptual distinctions but dislike academic jargon for its own sake. Their frustration with the "it's just judgment/vocabulary" rebuttal suggests they want validation of lived experience while maintaining intellectual rigor. The birding examples reveal someone deeply attentive to sensory nuance.

  Let me mentally map the phenomena:
  - Lock-in case shows belief-independent perceptual persistence - fascinating because the effect outlives the disproven belief
  - Provenance case demonstrates how abstract knowledge (introduced vs native species) alters sensory qualia without changing physical input
  - De-enrichment reveals expertise's double-edged sword: sharpening focus at the cost of holistic awareness

  I recall that cognitive penetration debates often exclude cases where perception doesn't immediately revert when beliefs change - so lock-in might get excluded on technical grounds. But that feels unsatisfying. Maybe perceptual learning or attentional weighting frameworks better explain all three?

  For the provenance effect specifically... that's tricky. Terms like "cognitive penetrability" feel too broad. How about "evaluative penetration" to capture how value-laden knowledge reshapes perception? Boundary case: if knowing a bird's introduced status didn't change how it sounded, only how you felt about it - that would fall outside the phenomenon.

  The toughest question is distinguishing perceptual vs judgmental change. In principle, you'd need to bypass language and measure implicit reactions - like testing if the "hardened" facial expression triggers faster threat detection even after belief reversal. In birding, maybe test reaction time to lookalike species before/after expertise.

  Ultimately all three cases share a core truth: expertise restructures your perceptual apparatus. Lock-in is the most intriguing because it decouples from current beliefs, revealing perception's stubborn plasticity. The real answer might be that "perception" and "judgment" aren't neatly separable - they're endpoints on a continuum of brain processing.
answer: |-
  Your "weird cases" are all facets of a profound truth: **expertise fundamentally rewires perception, not merely interpretation.** This isn't just vocabulary; it's your brain's sensory processing being re-tuned by learning. Your three cases are interconnected but highlight different nuances. Here's the breakdown:

  1.  **The Core Phenomenon: Perceptual Learning & Cognitive Penetration (But With Nuance)**
      *   **Perceptual Learning:** This is the primary umbrella. It describes the *long-term, experience-dependent changes in how sensory information is extracted and processed*. Your warbler, radiology, and coffee tasting examples are textbook cases. Neural pathways become optimized to detect diagnostically relevant features (eye-ring, flick pattern, tumor texture, acidity notes) while filtering out noise. Crucially, this happens *pre-attentively* – the features "pop out" before conscious thought occurs. You *cannot* see the blur because your visual system now discards that level of information as irrelevant noise; it literally doesn't reconstruct the scene that way anymore.
      *   **Cognitive Penetration (CP):** This controversial concept argues that *higher-level cognitive states (beliefs, desires, knowledge) can directly influence low-level perceptual processing*. Your "provenance/value" case (introduced species/mimic call) is the strongest candidate for *genuine* CP. Abstract, evaluative knowledge ("this sound isn't authentic") alters the *phenomenal experience* ("it sounds hollow/flat") without changing acoustics. The "lock-in" case *initially* seems like CP (belief about nastiness altering face perception) but its persistence after belief reversal makes it complicated. The "de-enrichment" case is more about attentional filtering than direct penetration by beliefs.

  2.  **Dissecting Your Three Cases:**

      | **Case**          | **Key Mechanism**                              | **Shared with Others?**                            | **Is it "Seeing Differently"?**                   | **Why it's Weird/Interesting**                           |
      |-------------------|-----------------------------------------------|---------------------------------------------------|--------------------------------------------------|--------------------------------------------------------|
      | **Lock-In (Face):** | **Affective/Perceptual Recalibration + Habit** | Shares persistence with perceptual learning       | Yes, but driven by lingering affective association | Effect outlasts belief; mixes emotion & perception     |
      | **Provenance/Value:** | **Strong Cognitive Penetration**              | Shares top-down influence with CP generally       | **Yes, most clearly** – qualia change based on abstract knowledge | Evaluative knowledge alters sensory experience directly |
      | **De-enrichment:** | **Attentional Tuning (Expertise Blind Spot)** | Shares filtering mechanism with perceptual learning | Yes, via selective attention & feature weighting  | Expertise *reduces* perceived richness; paradoxical loss |

      *   **Lock-In:** This is the trickiest. It's not *pure* CP because the belief vanished but the perception lagged. It's a mix:
          *   **Affective Recalibration:** The initial belief triggered an *emotional* reassessment ("this person is hostile"). This emotion colored perception (interpreting neutral expressions as potentially hostile). Emotion powerfully penetrates perception.
          *   **Perceptual Habit:** Once established, the brain optimized for detecting potential hostility cues in her face, forming a "habit" of interpretation. Habits are hard to break. It's a form of *maladaptive* perceptual learning based on faulty initial input. The persistence shows perception isn't just a passive window; it's a prediction engine shaped by past inputs, even erroneous ones.
      *   **Provenance/Value:** This is the clearest case of **Evaluative Cognitive Penetration** (a term I'll coin/define below). Abstract, value-laden knowledge ("inauthentic," "non-native") directly alters the *phenomenal character* (qualia) of the sensory experience. The sound *feels* less vibrant, the bird *seems* less significant visually, even though you know the physical stimulus is identical. This isn't just changing your *judgment about* the experience; it changes the experience itself.
      *   **De-enrichment:** This is the flip side of perceptual learning. Expertise involves **Attentional Tuning**: learning what features are *task-relevant* and focusing processing resources there. Irrelevant details get filtered out *pre-consciously*. You *can't* hear the whole soundscape around the named call because your auditory system is now wired to prioritize that call and suppress background as noise. Your sister's expertise focuses her on specific patterns, causing her to miss anomalies outside that pattern that a novice (processing more "noise") might stumble upon. This *is* "seeing differently" – your sensory system is literally ignoring information it previously processed.

  3.  **Distinguishing "See Differently" vs. "Judge/Describe Differently" (Without Begging the Question)**
      *   **Principle:** Look for effects that are **immediate, pre-reflective, and resistant to conscious override**, especially involving reaction time, priming, or implicit measures *before* language/judgment kicks in.
      *   **Practical Tests:**
          *   **Reaction Time/Priming:** Show an expert (birder, radiologist) a brief, masked stimulus (too fast for conscious labeling). Does their expertise allow them to react faster/be primed by a *specific diagnostic feature* (e.g., eye-ring shape, tumor texture) compared to a novice, even if they can't name it? If yes, the feature extraction itself changed.
          *   **Perceptual Adaptation/Aftereffects:** Can adaptation to a specific learned feature (e.g., staring at a particular warbler flick pattern) cause aftereffects *consistent with the learned feature* but not the raw stimulus? This suggests the feature is encoded at a perceptual level.
          *   **Implicit Association:** In the "lock-in" case, even after consciously believing the report was false, does an implicit association test (IAT) still show a faster association between the friend's face and negative words? This would show lingering perceptual/affective bias below conscious belief.
          *   **Phenomenal Contrast (Hardest but Key):** Can you *experience* the difference while holding judgment constant? The provenance case is strong here: "I *know* the sound is identical, but knowing it's a mimic makes it *sound* flatter now, even when I try to hear it 'neutrally'." The inability to "unhear" the expertise in the warbler is another contrast.

  4.  **The Evaluative/Provenance Subset: Evaluative Penetration**
      *   **Term:** **Evaluative Cognitive Penetration (ECP)**
      *   **Definition:** The phenomenon whereby knowledge concerning the *origin, authenticity, moral status, or inherent value* of a stimulus directly alters the *phenomenal character* (sensory qualia) of the perceptual experience of that stimulus, independent of changes in the physical stimulus or conscious emotional reactions.
      *   **Boundary Cases (Smallest Tweaks):**
          *   **IN:** Hearing the starling mimic a wood thrush and *experiencing* the sound as "hollow," "mechanical," or "less rich" purely because you know it's mimicry, despite identical acoustics and no personal animus towards starlings.
          *   **IN:** Seeing an introduced house sparrow and *visually experiencing* it as "garish," "out-of-place," or "less vibrant" compared to a native sparrow, based *only* on knowing its provenance, not its actual plumage differences.
          *   **OUT:** Knowing a bird is introduced and *thinking* "That's bad for the ecosystem," or feeling annoyed, *without* any change in how the bird *looks* or *sounds* phenomenally. (Change in judgment/emotion, not perception).
          *   **OUT:** Knowing a call is a mimic and consciously *deciding* to describe it as "less beautiful," while still *hearing* it identically to before you knew. (Change in description/judgment only).
          *   **GREY AREA:** Knowing a song is a mimic and *then* noticing subtle acoustic differences you previously missed, leading to a genuine phenomenal difference based on *newly detected physical properties*. (This is perceptual learning based on finer discrimination, not pure ECP). ECP requires the phenomenal shift *without* relying on newly detected physical distinctions.

  **The Shape of the Thing & The Interesting Case**

  *   **The Cluster:** This is **Expertise-Driven Perceptual Reorganization**, encompassing Perceptual Learning, Attentional Tuning, and (controversially but demonstrably in your cases) Cognitive Penetration, particularly the Evaluative kind (ECP). It highlights that perception is an *active, predictive process* sculpted by experience, not a passive recording.
  *   **Which Cases Belong Together?** All three are consequences of **neural plasticity optimizing perception based on experience and knowledge**. The "lock-in" shows the persistence and potential maladaptiveness of this plasticity. "Provenance/Value" highlights the power of abstract, evaluative knowledge. "De-enrichment" reveals the necessary trade-off of expertise. They are different facets of the same underlying reality: learning changes how the world *appears*.
  *   **The Most Interesting Case:** **Provenance/Value (ECP)** is the most philosophically provocative. It directly challenges the idea that perception is "theory-neutral" or solely driven by bottom-up signals. The "lock-in" is fascinating for its persistence, but ECP shows how abstract *meaning* and *value* can seep into the very fabric of sensory experience itself. It demonstrates that "just the facts" knowledge *can* change how things look or sound, purely based on what those facts *signify*.

  **In short:** You're right. Learning doesn't just change what you *think* you see; it changes what your visual cortex *delivers* to consciousness. The blur is gone because your brain no longer bothers to process the world at that level of ambiguity for warblers. The native bird *feels* different because your knowledge of its "rightness" in the ecosystem penetrates your perception. Your friend's face *looked* wrong because your affective system temporarily rewired your face-processing circuits. And the price of seeing the diagnostic feature is losing the holistic noise. These are all signatures of a brain that constantly reshapes its own sensory world to match what it has learned matters. The persistence, the evaluative shift, and the loss of richness aren't bugs; they're features of this remarkable, plastic system.
