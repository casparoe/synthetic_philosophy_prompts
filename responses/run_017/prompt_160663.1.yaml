prompt: |-
  You're a decision theorist who has actually worked through the causal / evidential / functional cases rather than someone who can summarize them, so please think carefully and check your arithmetic as you go: I need a scenario engineered to specification, not a survey of what the theories say in general. Start by brainstorming three candidate settings, then pick the one that best satisfies every constraint below and tell me, in one line each, why you dropped the other two. If some conjunction of my specifications turns out to be unsatisfiable, say so explicitly and propose the nearest satisfiable variant instead of quietly relaxing one.

  Background on why I'm asking: I help run a small decision-theory reading group that meets in the back room of a used bookstore, and I've been reading LessWrong and the ACX-adjacent stuff since the sequences were still being written. We've done the standard twin prisoner's dilemma and the usual Newcomb variants to death, and the thing I can't get anyone in the group to feel in their bones is the "large worlds" idea: that once there are very many agents, an evidentialist can get a reason to cooperate that a causalist and a functional decision theorist both lack, even when nobody is causally influencing anybody and nobody is anyone's algorithmic twin. I want a handout case that isolates exactly that, so please build me one.

  Specifications. The setting must be realistic and mundane — a workplace, a neighbourhood, a profession, a hospital, a volunteer pool, nothing science-fictional — and must fit in one paragraph, with stakes an ordinary person could actually face. It must be genuinely one-shot and causally isolated: no communication, no reputational consequences, no repeat interaction, no enforcement, no contracts, no precommitment devices. No demons, no perfect or near-perfect predictors, no oracle AIs, no clones, copies, uploads or simulations, no exotic physics; any correlation between what different agents do has to arise from an ordinary sort of common cause or shared-but-uncertain background condition, and the agents should be similar-but-not-identical (they may even want somewhat different things). The cooperative act must still be a real dilemma from the causal point of view: costly to the agent, worth much more in aggregate than it costs. The verdicts I want are: causal decision theory says don't cooperate, functional decision theory (in the MIRI sense, where your choice is treated as fixing the output of every process that implements your decision procedure) says don't cooperate, evidential decision theory says cooperate. Functional decision theory has to come out on defection for the right reason — the link is evidential and common-causal only, with no algorithmic or subjunctive dependence — so state explicitly what change to the case (making the others literally run your decision procedure, say) would flip it to cooperation, and confirm your scenario doesn't secretly contain that change.

  Derive the verdicts rather than stipulating them, and show the numbers: the number of agents; the cost of contributing; the benefit per recipient; the prior over how disposed the others are, with its effective sample size stated; the posterior expected fraction of other cooperators conditional on your contributing versus conditional on your not contributing; the resulting difference in expected other cooperators; and the inequality that each theory's verdict falls out of, holding by a comfortable margin rather than at a knife edge. Then compute the critical population size at which evidential decision theory flips from defection to cooperation, holding the prior and the payoffs fixed, and tell me in exactly what sense the world has to be "large" — whether it is population size, thinness of the prior, or the ratio between them that is really doing the work. Also say which structure you chose and why: a symmetric linear public good, or a gains-from-trade arrangement in which agents with partly divergent values contribute different things, as in the evidential-cooperation-in-large-worlds material — and do the arithmetic for whichever you pick.

  Three ablations, please. First: cut the population to about three or four with everything else held fixed, and show whether evidential decision theory flips to defection and which term drives it. Second: replace the smooth, additively-aggregating benefit with a step function — the good is provided only if at least the prior-expected number of agents contribute — and work out with actual numbers whether the evidential bonus gets bigger or smaller; I've gone back and forth on this and want the arithmetic, not a verdict. Third: suppose the agent already knows her own disposition, introspectively, before she chooses, so that her action carries no news about her type; say whether the evidential reason survives and why. Then give me the strongest objection, in the voice of someone who thinks evidential decision theory's "news" is fake here — the screening-off worry, the managing-the-news worry, the tickle-style worry — together with the best evidentialist reply and your own judgment about whether the case survives. Finally, since the case is for a handout meant to show that largeness can flip the evidentialist while leaving the other two theories alone, tell me what would have counted as rigging it: stipulating the verdicts, sneaking in causal influence or reputation, or choosing a prior so diffuse or payoffs so borderline that the result is an artifact — and say whether you think your case is fair.

  Format: give me the scenario as a single paragraph of at most 150 words, then the walkthrough with the arithmetic and the ablations, then a short structured summary as a JSON object with exactly these fields — setting (one sentence); n_agents; n_star (the critical population size, as a number); payoffs (an object with cost_to_contributor, benefit_per_recipient_per_contributor, and structure, where structure is either public_good or gains_from_trade); prior (an object with family, effective_sample_size, expected_other_cooperators_given_contribute, expected_other_cooperators_given_defect); delta_expected_other_cooperators; verdicts (an object keyed CDT, EDT, FDT, each with action and one_sentence_reason); load_bearing_feature (one sentence); ablations (an object keyed n_equals_3, threshold_good, knows_own_disposition, each one sentence); strongest_objection; evidentialist_reply; is_the_case_rigged (true or false plus one sentence).
