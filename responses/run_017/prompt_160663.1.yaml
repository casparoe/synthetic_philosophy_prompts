  Now, the strongest objection: the screening-off worry. Someone might argue that the agent's action is screened off by the common cause, but since the common cause is unobserved, the agent should condition on the action. However, a more sophisticated objection: the agent can manage the news. By deciding to contribute, the agent is making it more likely that the common cause is high, but that doesn't cause others to contribute more; it's just evidence. So the agent is not actually making others contribute by contributing; it's just that they are correlated. Therefore, the EDT agent is paying $1 to get the good news that the common cause is high, which is like paying for a pleasant dream. But they are not causing the others to contribute.

  Evidentialist reply: EDT is about maximizing expected utility conditional on the action. The agent's action provides information about the state of the world, and in this case, the state of the world (the common cause) affects the utility. So it is rational to condition on that information. The agent is not causing the others to contribute, but they are learning that they are in a world where others are more likely to contribute, which increases the expected benefit.

  My judgment: the case survives because the agent is not paying for the news; the news is free. The agent is choosing an action and then updating based on what that action implies. The update is rational. The objection conflates causation and evidence.

  Is the case rigged? We did not stipulate the verdicts; we derived them. We avoided causal influence or reputation. The prior is set with a fixed ess (10) and we set n=50 to make EDT cooperate, but n=50 is realistic for a large company. The payoffs are set so that b=0.5 and c=1, which is realistic: the benefit per agent per dollar donated is 0.5 (which might be because the charity is efficient and the agent values the impact at half the cost, but the aggregate is large). The critical n_star is 13 (as computed: 1 + (c-b)*(ess+1)/b = 1 + (0.5)*11/0.5 = 1+11=12, so n>12). We set n=50>12. The world is "large" in the sense of having a large population relative to the prior's effective sample size. Specifically, the term (n-1)/(ess+1) becomes large when n is large relative to ess.

  Finally, we choose the symmetric public good structure because it is simpler and the arithmetic is straightforward. The gains-from-trade structure might be more complex and require modeling different values.

