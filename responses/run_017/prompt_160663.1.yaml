answer: |-
  ### Scenario
  In a large company with 50 employees, management announces a one-time, anonymous charity drive for disaster relief. Each employee can contribute $1 or not. For every dollar raised, a charity provides clean water that benefits every employee by $0.50 (due to the company's operations in the affected region). Employees vary in their personal connection and finances, but the company culture is uncertain: the prior belief is that 40% will contribute, with the strength of this belief equivalent to having observed 10 employees. There are no reputational effects or future interactions. The cost to contribute is $1; the aggregate benefit per dollar donated is $25 (50 employees × $0.50).

  ### Walkthrough
  **Parameters**:
  - **Number of agents (\(n\))**: 50
  - **Cost of contributing (\(c\))**: $1
  - **Benefit per recipient per contributor (\(b\))**: $0.50 (linear public good structure: each contribution adds $0.50 to every employee's benefit)
  - **Prior**: Beta distribution with \(\alpha = 4\), \(\beta = 6\) (mean \(\mu = 0.4\), effective sample size \(ess = \alpha + \beta = 10\))
  - **Posterior expectations**:
    - Expected other cooperators given contribute: \((n-1) \times \frac{\alpha+1}{\alpha+\beta+1} = 49 \times \frac{5}{11} \approx 22.27\)
    - Expected other cooperators given defect: \((n-1) \times \frac{\alpha}{\alpha+\beta+1} = 49 \times \frac{4}{11} \approx 17.82\)
    - Difference (\(\Delta\)): \(22.27 - 17.82 = 4.45\)
  - **Critical inequality for EDT**:  
    \(-c + b + b \times \Delta > 0\)  
    \(-1 + 0.5 + 0.5 \times 4.45 = 1.725 > 0\) (cooperate)  
  - **CDT verdict**: Causal effect is \(-c + b = -1 + 0.5 = -0.5 < 0\) (defect).  
  - **FDT verdict**: No algorithmic/subjunctive dependence (agents are similar but not identical; no shared decision procedure). Functional fix would require all agents to run identical decision algorithms (e.g., same software), flipping FDT to cooperate. Absent this, FDT reduces to CDT: defect.  
  - **Critical population size (\(n^*\))**: Solve \(-c + b + b \times \frac{n-1}{ess+1} > 0\):  
    \(n > 1 + \frac{(c - b)(ess + 1)}{b} = 1 + \frac{0.5 \times 11}{0.5} = 12\). Thus, \(n^* = 13\).  
    **Why "large" world?** Population size \(n\) relative to prior strength \(ess\): \(\Delta \propto \frac{n}{ess}\), so large \(n\) or thin prior (small \(ess\)) amplifies evidential update.  
  - **Structure choice**: Symmetric linear public good. Gains-from-trade (e.g., divergent values) complicates payoff aggregation; linearity isolates the population-size effect clearly.  

  **Ablations**:  
  1. **Small population (\(n = 3\))**:
     - \(\Delta = (3-1) / (10 + 1) \approx 0.1818\)  
     - EDT difference: \(-1 + 0.5 + 0.5 \times 0.1818 \approx -0.409 < 0\) → defect.  
     - **Driver**: Small \(\Delta\) due to low \(n/(ess+1)\).  
  2. **Threshold good (step function benefit)**:
     - Threshold \(T =\) prior-expected contributors \(= 50 \times 0.4 = 20\). Benefit \(B = T \times b = 20 \times 0.5 = \$10\) per employee if \(\geq 20\) contribute.  
     - \(P(\text{total} \geq 20 \mid \text{contribute}) \approx 0.66\), \(P(\text{total} \geq 20 \mid \text{defect}) \approx 0.385\) (beta-binomial normal approx).  
     - EDT difference: \(-1 + 10 \times (0.66 - 0.385) = 1.75 > 0\) → cooperate.  
     - **Verdict**: Bonus similar to linear case (1.75 vs. 1.725); discontinuity offsets lower probability difference.  
  3. **Knows own disposition**:  
     - If the agent introspects and knows their type (e.g., "I'm a cooperator"), action carries no news about common cause → \(\Delta = 0\).  
     - EDT difference: \(-1 + 0.5 + 0 = -0.5 < 0\) → defect. Evidential reason vanishes.  

  **Strongest objection & reply**:  
  - **Objection (screening-off)**: "Your action only reveals preexisting common causes; it doesn't change others' behavior. Paying $1 for 'good news' is irrational—you're buying a dream, not causing outcomes."  
  - **Evidentialist reply**: "EDT maximizes utility conditional on your action. The action provides legitimate evidence about the world (e.g., company culture), which affects expected benefits. Ignoring this evidence is irrational, as it reflects real correlations."  
  - **Judgment**: The case survives. Objection confuses causation with evidence; EDT's update is epistemically sound, and the common cause is not introspectively accessible pre-decision.  

  **Fairness check**:  
  - Not rigged: Verdicts derived from parameters (no stipulation); no hidden causal/reputational elements; prior and payoffs are moderate (\(ess = 10\) is plausible, \(n \gg n^*\), payoffs clear: \(b < c < n b\)).  
  - Would be rigged if: Prior were overly diffuse (\(ess \ll 1\)), payoffs borderline (e.g., \(c - b\) near zero), or algorithmic dependence smuggled in.  

