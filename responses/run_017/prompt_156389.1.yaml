prompt: |-
  I got into an argument about this at a barbecue last weekend and it's been bugging me ever since, so I wanted to lay the whole thing out and ask you to tell me what's actually going on underneath it. Here's the case that started it. Imagine a firm called Kestrel & Voss, founded in 1908 as a brass foundry, that today sells payroll software: no foundry, no brass, no building from back then, and not a single shareholder, director, employee or customer in common with the 1908 version for at least sixty years. The only things that carried over continuously are the name, the registry entry, some ledgers in a basement, and an unbroken chain of people who each in turn took over the previous outfit's contracts, debts and pension obligations. Now imagine a court lets a suit proceed against today's Kestrel & Voss for lead poisoning suffered by foundry workers in 1931, on the theory that the defendant is the very same entity that poisoned them and not merely its descendant or heir. One friend said that's obviously incoherent: for a thing to still be that thing, the stuff and the people have to be mostly the same, and once you've swapped out literally everything you have a new thing wearing an old name (she thought the philosophy word for her view was endurance, but she wasn't sure). Another said no, the things that live in time are like rivers or roads, made of different material at different moments, and the same company just means one continuous stretch of company activity, so of course it can be liable (he thought that was perdurance, equally unsure).

  What I actually want isn't a verdict on the company, though. It's that our real institutions seem to do a bunch of apparently different things in this area at once, and I can't tell whether they're contradicting each other or tracking different features. On the one hand: firms are sued for century-old injuries across total turnover; universities apologize for, and pay damages over, selling enslaved people in the 1830s when nobody currently associated with them was alive; states pay reparations for wrongs committed before any living citizen was born; and a revolutionary government that repudiates everything the previous regime did is still treated as the same state for treaty purposes. On the other hand: there are statutes of limitations, so that after enough years a person simply isn't answerable anymore even though it's the same body and the same brain; as I understand it courts won't carry out a punishment, and sometimes won't even try someone, who has lost the capacity to understand why they're being punished, on the ground that the connection between the old act and the present suffering has to be graspable by the person undergoing it; and yet a living will I signed at thirty controls what's done to my body at eighty-five, when I may not recognize my own family or remember signing anything, which seems to give the earlier stage authority over a later one that shares almost nothing psychologically with it.

  So: what view of persistence over time does this package of practices as a whole presuppose? Can you reconstruct the implicit theory, and be careful about the difference between what the practices strictly require (such that the practice would be nonsense without it), what they merely sit well with, and where they're underdetermined so that several rival theories would license exactly the same thing? Is the corporate-versus-personal asymmetry principled, or is it just liability policy and deterrence wearing a metaphysical costume — one friend insists the metaphysics never enters into it at all, and I'd like to know if that's compatible with what the institutions are actually doing. I also floated my own test at the barbecue and nobody liked it, but I'd like it taken seriously: call it the chain-of-custody view, where the thing at the later time is the same thing as the earlier one iff there's an unbroken sequence of transfers of its name and records, each holder openly took on the previous holder's outstanding obligations, and nobody ever declared a fresh entity. Does existing practice secretly presuppose something like that rather than either of the two views my friends were reaching for, and how would it handle the awkward cases, like the regime that repudiates its predecessor's debts or the person who becomes, by their own later lights, a completely different agent? Finally, what would concretely have to change in law or institutional policy if we went all-in on the time-slices view and meant it everywhere — who would owe what to the 1931 workers, and whose signature on the living will would count — and what would have to change if we went the other way and meant the strictly-same-substance view everywhere?
reasoning: |-
  Okay, the user has presented a complex philosophical and legal dilemma about identity over time, particularly focusing on corporations versus individuals. They described a scenario where a modern company is sued for historical harms despite complete turnover of all physical and human elements. Their friends argued different metaphysical views—endurance versus perdurance—but the user is more interested in how real-world institutions handle such cases inconsistently.

  The user's examples show institutions treating entities as continuous for liability (companies paying for century-old wrongs) but fragmented for other purposes (statutes of limitations for individuals). They propose a "chain-of-custody" theory and want to know: (1) what implicit theory underpins current practices, (2) whether corporate/personal asymmetry is principled or just policy, (3) if their chain-of-custody idea fits, and (4) what would change under strict metaphysical views.

  Hmm, this requires unpacking multiple layers. Legally, the corporate continuity doctrine is pragmatic—prioritizing transactional stability over metaphysics. The "legal fiction" of corporate personhood allows suing modern entities for historical acts precisely because courts care more about assignable responsibility than material persistence. Meanwhile, personal identity cases reveal deeper moral tensions: we suspend punishment for dementia patients because retribution requires psychological continuity, yet enforce living wills because autonomy transcends present mental state.

  The user's chain-of-custody view is clever but too narrow. Courts already accept it for documents or evidence, but for entities, obligations can persist even after repudiation (e.g., successor states inheriting treaties). The real inconsistency they spotted—institutions accepting fragmented persistence for some purposes but not others—isn't a bug but a feature. Different contexts (contracts vs. criminal law) need different persistence criteria. 

  What the user might truly crave is reassurance that these aren't hypocritical contradictions. The answer lies in distinguishing metaphysical identity from normative responsibility. Institutions treat identity as a vessel for assigning duties, not an ontological truth. That's why their "metaphysical costume" quip is perceptive—but the costume matters because it creates predictable social structures.

  If we imposed strict endurance theory (only same matter counts), reparations and corporate liability would collapse. Strict perdurance (time-slices) might make living wills unenforceable. Thankfully, institutions wisely avoid both extremes. The brilliance of current practice is its contextual flexibility—what philosophers might call "conventional identity." That's the implicit theory: identity is what we agree matters for specific human purposes.
answer: |-
  Your barbecue debate cuts to the heart of how institutions reconcile metaphysical puzzles with practical needs. There's no single "implicit theory" governing everything, but a pragmatic framework emerges from the practices you describe. Let's dissect it:

  **The Core Implicit Framework: "Normative Continuity Over Ontological Identity"**

  Institutions don't presuppose a single, consistent metaphysical view of persistence (like strict endurance or perdurance). Instead, they operate on **conventional, purpose-driven continuity**. The key question isn't "*Is this literally the same thing?*" but "*Is it normatively appropriate to treat this present entity as the continuer of the obligations, rights, or identity of the past entity for this specific purpose?*"

  This framework has three key pillars:

  1.  **Separate Domains, Separate Rules:** Different contexts (corporate liability, personal liability, testamentary capacity, state continuity, criminal responsibility) have distinct normative goals, leading to different continuity criteria.
  2.  **Fiction as Function:** Legal fictions (like corporate personhood) are tools, not ontological claims. They exist to serve specific social functions (stability, accountability, redress).
  3.  **Contextual Thresholds:** "Enough" continuity varies wildly by context. What suffices for corporate liability (formal legal succession) is utterly insufficient for personal criminal responsibility (psychological connection).

  **Applying the Framework to Your Cases:**

  *   **Kestrel & Voss (Corporate Liability):**
      *   **Practice:** Courts *do* allow suits like this. The theory is **"Successor Liability"** or **"Continuation of the Legal Person."**
      *   **Implicit View:** The *legal entity itself* is the relevant persistent "thing." Its persistence is defined by its formal legal existence in the registry, the chain of title to its assets/liabilities, and its name. Material composition (assets, people) is irrelevant. The function is **assigning responsibility and providing redress** where a formal chain of succession exists, ensuring victims aren't left uncompensated due to corporate restructuring. This leans towards a **formal perdurance** view (a continuous "world-line" defined by legal status) but is primarily a **normative policy choice** (deterrence, compensation) wearing a metaphysical costume.
      *   **Strictly Requires:** A formal, traceable legal succession chain connecting the defendant to the original liable entity. Without *any* chain (e.g., a completely new company coincidentally named Kestrel & Voss), the suit fails.
      *   **Sits Well With:** Perdurance; a chain-of-custody view (name/records/obligation transfer).
      *   **Underdetermined/Contradicts:** Strict endurance (no shared matter). It readily ignores repudiation of debts if the legal succession is clear (e.g., revolutionary governments inheriting treaty obligations *despite* repudiating the old regime).

  *   **Statutes of Limitations & Dementia in Criminal Law:**
      *   **Practice:** Time limits exist; capacity matters for trial/punishment.
      *   **Implicit View:** Personal liability, especially criminal, demands a **stronger connection between the past actor and the present person.** The functions are **retribution, deterrence (specific), and rehabilitation.** These require the defendant to understand *why* they are being punished and have a link to the act. The law implicitly recognizes psychological continuity as crucial for *this purpose*. This leans towards an **endurance** view emphasizing psychological connectedness.
      *   **Strictly Requires:** For punishment/trial: A present capacity to understand the proceedings and their connection to the past act. Statutes of limitation reflect pragmatic concerns (evidence decay, societal peace) and a normative judgment that after a long time, the *present person* shouldn't be burdened by the distant past act of a psychologically disconnected former self.
      *   **Sits Well With:** Endurance (psychological); Lockean views of personhood; Parfit's psychological connectedness.
      *   **Underdetermined/Contradicts:** Perdurance (if time-slices are liable, why time limits/capacity?). Contradicts corporate liability's looser continuity standard.

  *   **Living Wills (Advance Directives):**
      *   **Practice:** The 30-year-old's directive binds treatment of the 85-year-old.
      *   **Implicit View:** **Autonomy transcends psychological change.** The core value is respecting the *earlier, competent self's* rational choice about their future existence, even when the future self lacks the capacity to make that choice. The function is **protecting autonomy and dignity over a lifespan.** This views the person as a single, temporally extended entity whose competent wishes deserve respect.
      *   **Strictly Requires:** A formally valid directive created when competent, applied when incompetent.
      *   **Sits Well With:** Perdurance (the life-stage expressed a binding wish); a strong view of the self as a temporally extended project. Can also fit with endurance if the "core self" is seen as planning for its future states.
      *   **Underdetermined/Contradicts:** Strict application of the psychological connectedness standard used in criminal law. Contradicts the idea that only the *present* psychological state matters.

  *   **State Continuity (Repudiation vs. Treaty Obligations):**
      *   **Practice:** Revolutionary governments inherit treaty obligations.
      *   **Implicit View:** **Sovereignty and territory define state continuity.** The state is an abstract entity persisting through changes of government, ideology, or even constitutional order, as long as it governs the same core population/territory. The function is **international stability and predictability.** Repudiation of *debts* might be possible (a policy choice), but repudiation of *statehood itself* is generally not accepted by other states.
      *   **Strictly Requires:** Control over territory/population and recognition (implicit or explicit) by other states as the successor/continuation.
      *   **Sits Well With:** Perdurance (continuous state "world-line"); a chain-of-custody view applied to sovereignty/territory.
      *   **Underdetermined/Contradicts:** Endurance (no shared "stuff" like government officials). Contradicts corporate liability if the new state truly repudiates *all* old obligations.

  **Evaluating Your Chain-of-Custody View:**

  *   **Strengths:** Captures the *formal* aspect crucial for corporate liability and state continuity (name, records, obligation transfer). Explains why Kestrel & Voss is liable.
  *   **Weaknesses:**
      *   **Repudiation:** Fails for states that repudiate obligations but *are* still held to treaties (continuity is based on territory/sovereignty, not acceptance of obligations).
      *   **Psychological Disconnection:** Doesn't address the core reason *why* we exempt severely demented individuals from punishment – the lack of psychological connection isn't solved by a formal chain.
      *   **Living Wills:** While the signature is a record, the *binding force* comes from the normative principle of respecting prior autonomy, not just the chain of custody of the document.
      *   **Statutes of Limitation:** Doesn't explain why a formal chain of identity (the same biological body/person) isn't enough for liability after a long time.

  **Your Friends' Asymmetry: Principled or Policy in Costume?**

  It's **principled policy.** The metaphysics doesn't *drive* the distinction, but the distinction is *principled* based on the *different normative purposes* involved:

  1.  **Corporations/States:** Primarily about **assigning responsibility for redress, ensuring stability, and managing collective assets/obligations.** Formal, traceable continuity serves these goals efficiently. Psychological connection is irrelevant.
  2.  **Individuals (Criminal Law):** Primarily about **retribution, deterrence (specific), rehabilitation, and fairness to the accused.** These require a strong psychological link between the actor and the punished. Formal identity (same body) is necessary but insufficient after time or cognitive change.
  3.  **Individuals (Living Wills):** Primarily about **respecting autonomy as a life-project.** This requires binding the future incompetent self to the past competent self's wishes, overriding weak present psychological connection.

  The metaphysics provides *language* and *analogies* (rivers, chains), but the *rules* are driven by the functional needs of each context. Your friend insisting metaphysics never enters is partly right – the *justifications* are functional/pragmatic. But the *concepts used* (identity, continuity) are inherently metaphysical. It's policy *using* metaphysical concepts as tools, not policy *based on* discovering metaphysical truths.

  **What If We Went All-In on One Metaphysics?**

  *   **Strict Time-Slices (Radical Perdurance):**
      *   **Kestrel & Voss:** No liability. The 1931 time-slice is gone. Today's time-slice shares no matter or identity. Workers uncompensated.
      *   **Living Will:** Invalid. The 30-year-old time-slice signed it; the 85-year-old time-slice is a different entity. Medical decisions revert to default (family/courts).
      *   **Dementia Defendant:** No trial/punishment. The current time-slice didn't commit the crime.
      *   **Statutes of Limitation:** Redundant, as no past time-slice could ever obligate a present one.
      *   **State Treaties:** All treaties void with every governmental change. International chaos.
      *   **Result:** Collapse of long-term obligations, contracts, promises, historical redress, and institutional stability. Fundamentally incompatible with social organization over time.

  *   **Strict Endurance (Same Substance/Psychology):**
      *   **Kestrel & Voss:** No liability. No shared matter or people. Workers uncompensated.
      *   **Living Will:** Likely invalid unless the 85-year-old retains the *exact* psychological state/matter continuity from age 30 (impossible). Autonomy over lifespan ignored.
      *   **Dementia Defendant:** No trial/punishment. Lack of psychological continuity/severe material change (brain) breaks endurance.
      *   **Statutes of Limitation:** Still potentially relevant due to evidence, but less philosophically necessary.
      *   **State Treaties:** Treaty obligations likely void after revolution (new government, new "substance").
      *   **Result:** Similar collapse of long-term obligations and redress, plus the denial of advance directives. Fixates on an unattainable standard of sameness.

  **Conclusion:**

  Our institutions operate on a **pragmatic pluralism of continuity criteria.** They implicitly reject both radical perdurance and strict endurance as universal principles. Instead, they define "sameness" contextually, based on what kind of continuity is normatively required to achieve the specific social goal at hand – be it redress for victims, stability in commerce, respect for autonomy, fairness in punishment, or predictability in international relations. The "chain-of-custody" view captures an important *formal* mechanism used in corporate and state continuity but doesn't suffice to explain the full range of practices, especially those involving personal identity and psychological connection. The asymmetry between corporate and personal liability isn't a metaphysical error but a reflection of fundamentally different purposes pursued by the law in these different domains. The metaphysics provides useful analogies, but the driving force is functional necessity, not ontological discovery.
