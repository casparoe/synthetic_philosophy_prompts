answer: |-
  ### Adversarial Collaboration Agreement: Scientific Realism and the Pessimistic Meta-Induction  
  **Parties:** Dana (selective/structural realism) and Ivo (pessimistic meta-induction)  
  **Objective:** To clarify disagreements, isolate testable cruxes, and commit to shared standards of evidence.  

  ---

  ### Section 1: Agreed Claims  
  Both parties endorse the following statements as neutral descriptions of the dispute’s foundations:  

  1. **No-Miracles Argument (NMA)**: The NMA contends that the empirical success of science—especially novel predictions—would be improbable or coincidental if scientific theories were not at least approximately true. Realism is presented as the best explanation for this success.  
     
  2. **Pessimistic Meta-Induction (PMI)**: The PMI contends that because past successful theories were ultimately discarded in many of their central claims, current successful theories are likely to be similarly discarded. This induction relies on the historical record of discarded posits.  

  3. **Structural Retention**: During theory change, certain components of prior theories are often preserved. These typically include mathematical structures (e.g., equations, symmetries, quantitative relations) but may exclude other elements (e.g., ontological interpretations).  

  4. **Historical Ambiguity**: The historical record is complex:  
     - "Elimination" of a posit may be graded (e.g., full rejection, reduction, reidentification, or demotion to fiction).  
     - Current scientific perspectives unavoidably influence interpretations of past theories.  

  5. **Conditions for Induction**: For the historical record to license *any* induction (optimistic or pessimistic) about current theories, two criteria must hold:  
     - Past and present cases must be relevantly similar (e.g., in evidential support, methodology, and domain maturity).  
     - The induction must account for the granularity of theoretical components (e.g., posits vs. structures).  

  6. **Survival Processes**: The probability of a posit’s elimination may depend on its "age" (duration of successful use). Whether this hazard rate is constant or decreasing is an empirical question.  

  7. **Sensitivity of Success**: A theory’s empirical success may or may not depend on the literal truth of a specific posit. A counterfactual test—"Would success persist if the posit were false?"—is a conceptually valid (but historically contestable) tool for assessing this dependence.  

  ---

  ### Section 2: Table of Residual Disagreements  
  Each disagreement is stated in the proponent’s wording, followed by a shared crux, an agreed test, and predictions.  

  | Disagreement (Wording by Proponent)                                                                                                                                 | Crux                                                                                                | Test/Case/Argument                                                                                                                                                              | Predictions                                                                                                |
  |---------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
  | **Hazard-Rate Model**                                                                                                                                               | Does the elimination hazard decrease with a posit’s age, and does this invalidate the PMI’s use of aggregate discard rates? | - **Test**: Define "elimination" as *complete rejection* (e.g., phlogiston: no modern analog). For posits from well-confirmed theories (1600–1900), estimate annual hazard rates using survival analysis. Data: Time from confirmation to elimination (or censorship at 1900). <br> - **Shared Standard**: Hazard rate must be estimated independently of structural realism (e.g., not pre-filtering "structural" posits). | **Dana**: Hazard decreases steeply (e.g., 5%/yr at decade 1, ≤1%/yr at decade 10). PMI’s aggregate rate misleads for mature posits. <br> **Ivo**: Hazard decrease is mild or data-insufficient (e.g., >3%/yr at decade 10). PMI remains valid. |
  | Dana: "A decreasing hazard rate—where long-surviving posits face lower elimination risk—renders the PMI’s use of aggregate discard rates a base-rate fallacy." <br> Ivo: "A decreasing hazard is consistent with structural preservation and does not negate the PMI; the record is too sparse/short to reliably fit a curve." |                                                                                                    |                                                                                                                                                                                 |                                                                                                            |
  | **Grading of Elimination**                                                                                                                                          | Do reductions/reidentifications/demotions count as "eliminations" for the PMI?                     | - **Test**: Apply uniform grading to 10 historical posits (e.g., caloric, ether, atom). Use tertiary sources (e.g., Oxford Encyclopedia of Science) for consensus fates. <br> - **Grades**: (A) Eliminated (no analog), (B) Reduced (real but non-fundamental), (C) Reidentified (retained with reinterpretation), (D) Demoted (fiction). <br> - **Crux Test**: Does PMI’s force change if (B)/(C)/(D) are excluded from "failures"? | **Dana**: Excluding (B)/(C)/(D) cuts PMI’s discard rate sharply; most historical cases are (B) or (C). <br> **Ivo**: (B)/(C)/(D) are failures; all grades yield high discard rates. |
