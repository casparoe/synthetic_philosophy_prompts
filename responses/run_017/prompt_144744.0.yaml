  ### Verbal Disputes  
  The following disagreements are partly terminological and do not require empirical resolution:  
  - **"Approximate truth"**: Dana uses it to denote *structural fidelity* (e.g., equations preserve relationships). Ivo requires *literal truth of ontology* (e.g., entities exist as described).  
