prompt: |-
  for a history project I have to write about how anyone can know what happened a really long time ago, and I keep going in circles. we read some Herodotus in class and my teacher said you can't just read an old book and believe it, but when I ask how you decide, people say stuff like "check if the author was biased" — wich every author is. so before I trust anybody's verdict I want the spec.

  Write the requirements a method for judging very old sources would have to meet, with the case behind each. These are the cases I want handled, plus whatever I'm missing:

  - exactly one old book says a battle happened and nothing else ever mentions it
  - three later books say it happened, but they all look like they copied the first one
  - an author who was actually there vs. an author writing 200 years later who says he talked to people who were
  - a source that gets small stuff right (names, distances, dates) and the big stuff weird
  - a source with an obvious reason to lie vs. one that just repeats what everyone in his city already believed
  - something known only from coins or buildings, with no text at all
  - a source that says a god did it

  Also, my friend says that when a writer reports something that makes his own side look bad, that's a sign it's true, and I sort of believe him but I can't say why — is that a real requirement or just a vibe?

  Say which requirements are non-negotiable and which are just what one kind of historian happens to like. And I think there might be two on the list that can't both be met: you need something independent to check a source against, but the only independent stuff is more sources, so you never get going. If that's a real problem and not just me confusing myself, say so, and say what it means for whether a method can be suspicious enough without giving up on ever answering anything.

  Don't tell me books to read or name historians, I can't look anything up. Just the spec and the cases.
reasoning: |-
  Okay, the user is working on a history project and is stuck in a loop about how to judge ancient sources. They mentioned Herodotus in class, and the teacher said you can't just take old books at face value. But when they ask how to decide, people talk about checking bias, which is always present. So they want a clear set of requirements for evaluating sources, along with specific cases they listed. 

  First, I need to understand their main points. They have seven cases: one source with no corroboration, three that seem copied, eyewitness vs. secondhand accounts, sources accurate on details but not big events, sources with motives to lie vs. those repeating common beliefs, non-text evidence like coins or buildings, and claims involving gods. They also mentioned their friend's point about sources making their own side look bad as a potential indicator of truth, wondering if that's a requirement or just a vibe.

  The user wants requirements that handle these cases, distinguishing non-negotiable from preferred ones. They're concerned about a circular problem: needing independent evidence, but all evidence being sources. This is a key issue in historiography, known as the criterion of multiple attestation or independent sources. I should explain that while it's a challenge, historians use methods like coherence and external evidence to mitigate it.

  Breaking down the requirements: Non-negotiable ones are things like corroboration and provenance—without these, it's impossible to start. Preferred requirements add depth but aren't essential, like assessing motives or internal consistency. For the friend's point about self-incriminating details, that's a strong indicator (criterion of embarrassment) but not foolproof; it's preferred rather than mandatory.

  Handling each case: For a lone source about a battle, the requirement is independent attestation. If absent, it's unreliable. For copied texts, trace lineage to see if they stem from one source. Eyewitness vs. later accounts: prioritize contemporary sources but check the later author's methods. Accurate on details but weird on big stuff: use coherence with other evidence. Motive to lie vs. repeating beliefs: motive doesn't automatically mean false, but requires more scrutiny. Non-text evidence: use material evidence as a separate line. Divine claims: treat as cultural context, not literal.

  The circularity problem: Admit it's real. Historians bootstrap by using multiple methods (texts, archaeology, science) to build a web of evidence. No single source is trusted alone; consensus comes from triangulation. This means absolute certainty is rare, but probable conclusions are possible.

  The user's deeper needs: They're frustrated with vague advice and want concrete, actionable criteria. They might feel overwhelmed by ambiguity in history. Providing clear requirements helps them structure their project. Also, they need to feel it's possible to make judgments without giving up, despite inherent uncertainties. Emphasizing practical steps and the role of probability can alleviate their anxiety.
answer: |-
  Here's a specification for a method to judge very old historical sources, designed to handle your cases and core concerns. The requirements are categorized as **Non-Negotiable (NN)** (essential for any credible method) or **Preferred (P)** (valuable tools but reliant on context/availability).

  **Core Requirements of the Method:**

  1.  **Requirement: Independent Corroboration (NN)**
      *   **Case Handled:** "Exactly one old book says a battle happened"; "Three later books... copied the first one"; "Only coins/buildings, no text"; The Circularity Problem.
      *   **Case Behind:** A single source, or multiple sources deriving *only* from that single source, is inherently unreliable. You need evidence *outside* the source's own claim or its direct descendants to confirm it. This breaks the "one source" problem and exposes copying chains. Material evidence (coins, buildings) *is* independent corroboration if it aligns with claims.
      *   **Why NN?** Without seeking independent confirmation, you have no way to distinguish fact from fiction, mistake, or propaganda within the source itself. It's the foundation of verification.

  2.  **Requirement: Provenance Assessment (NN)**
      *   **Case Handled:** "Author actually there vs. author writing 200 years later"; "Source that gets small stuff right... big stuff weird"; "Source with an obvious reason to lie"; "Source that says a god did it".
      *   **Case Behind:** You MUST know: *Who* wrote it? *When* (relative to the events)? *Where*? *For whom*? *What was their intended purpose*? *What access to information did they likely have*? This helps judge potential bias, accuracy capability, motives to lie/embellish, and context for "god did it" claims (was this a standard cultural explanation?).
      *   **Why NN?** You cannot evaluate bias or reliability without understanding the source's origin and context. A contemporary eyewitness is inherently *different* from a much later compiler, regardless of bias.

  3.  **Requirement: Internal Consistency Analysis (NN)**
      *   **Case Handled:** "Source that gets small stuff right... big stuff weird"; "Source with an obvious reason to lie"; "Source that says a god did it".
      *   **Case Behind:** Does the source contradict *itself*? Does its description of events, people, or places fit together logically? Does the "weird big stuff" contradict the accurate small details? Does a claim of divine intervention suddenly solve an otherwise messy narrative conveniently for the author's bias?
      *   **Why NN?** A source demonstrably inconsistent within itself loses credibility for *all* its claims until proven otherwise. It reveals flawed methodology, misunderstanding, or potential fabrication.

  4.  **Requirement: Motive & Bias Scrutiny (P)**
      *   **Case Handled:** "Source with an obvious reason to lie vs. one that just repeats what everyone... believed"; Your Friend's Point (making own side look bad).
      *   **Case Behind:** *Why* might the author say this? To flatter a patron? Win an argument? Promote a religion/city? Uphold tradition? Understanding motive helps gauge *what* they might distort. A source repeating common belief might be reliable for *that belief* but not for the underlying fact. **Your Friend's Point:** This is a specific application called the "Criterion of Embarrassment." If a source includes information damaging to its own cause/group/author, it's *less likely* to have been invented, as it undermines the author's purpose. It's a *strong indicator* (P), but not foolproof (someone could fabricate an "embarrassing" event for complex reasons, or be mistaken).
      *   **Why P?** While crucial context, identifying motive/bias doesn't *automatically* prove a specific claim true or false. An author with a motive to lie *might* still tell the truth sometimes. An "unbiased" author can be wrong. It's a vital tool, but requires combination with other requirements (especially #1 & #2).

  5.  **Requirement: External Consistency/Coherence (P)**
      *   **Case Handled:** All cases, especially "small stuff right, big stuff weird"; material evidence; the Circularity Problem.
      *   **Case Behind:** Does this source's claim fit with *everything else we know* from *other* independent sources (texts, archaeology, science, geography)? Does the "weird big stuff" fundamentally clash with established understanding? Do the names/dates/distances match inscriptions or known trade routes? Does the claimed battle location make geographical sense?
      *   **Why P?** This is the primary way to *use* independent corroboration (#1) and break the circularity loop. It builds a "web" of evidence. However, it relies *on* having that other evidence. Sometimes, a source is our *only* info on something, making this requirement impossible to fully apply. It's also possible for *multiple* sources to be wrong in the *same* way (shared myth).

  6.  **Requirement: Methodology of the Source (P)**
      *   **Case Handled:** "Author writing 200 years later who says he talked to people"; "Source that gets small stuff right...".
      *   **Case Behind:** Does the source *explain* how it got its information? Does the later author name his sources or describe his research process? Does the author critically evaluate conflicting accounts, or just repeat stories? This helps assess the *path* the information took before being written down.
      *   **Why P?** A source transparent about its methods (like Herodotus sometimes) is more valuable, but this is rare in ancient sources. Many simply assert. Lack of methodology description doesn't *disprove* the claim, it just makes verification harder.

  **Handling Your Specific Cases:**

  *   **One Old Book, No Other Mention:** Requires **Independent Corroboration (NN1)**. Without it, the event is considered **unverified/legendary**. Material evidence *could* provide this.
  *   **Three Later Books Copied First:** **Independent Corroboration (NN1)** & **Provenance (NN2)** show they aren't independent. They count as *one* source, not three. Treat as the first case.
  *   **Eyewitness vs. Later Compiler:** **Provenance (NN2)** is key. The eyewitness is *prima facie* more reliable *for what they witnessed directly*. The compiler's reliability depends on **Methodology (P6)** and **Independent Corroboration (NN1)** of *their* sources. A later source *can* be more reliable if the eyewitness was biased and the compiler critically compared accounts.
  *   **Right Small Stuff, Wrong Big Stuff:** **Internal Consistency (NN3)** is crucial (does the weird big stuff conflict with the accurate details?). Also **External Consistency (P5)** – does the "weird stuff" clash with other evidence? **Provenance (NN2)** (author's agenda?) and **Motive (P4)**. Suggests the author had access to some good info but fundamentally misunderstood, had an agenda, or incorporated myth.
  *   **Obvious Liar vs. Repeats Belief:** **Motive & Bias (P4)** is central. The "liar" requires extreme scrutiny and a high bar for **Independent Corroboration (NN1)**. The "repeater" is reliable for documenting *the belief*, but not necessarily the underlying fact. **External Consistency (P5)** is needed to test the belief.
  *   **Only Coins/Buildings:** This *is* **Independent Corroboration (NN1)**! It provides concrete evidence of existence, power, art, technology, sometimes events (e.g., triumphal arches). Limits: It rarely provides narrative, motivation, or precise chronology without text. **Provenance (NN2)** (date/location of artifact) and **External Consistency (P5)** (does it fit the known context?) still apply.
  *   **God Did It:** **Provenance (NN2)** is vital. Was this a standard cultural explanation? **External Consistency (P5)** – does the *event* described (flood, plague, victory) have other evidence, even if the *cause* (god) is a cultural lens? Modern history treats divine causation as the *author's explanation/interpretation*, not a literal fact to be verified. The *event* might be investigated, the *divine cause* is seen as belief.

  **The Circularity Problem & Suspicion vs. Answers:**

  *   **It's a Real Problem:** You've nailed it. How do you start if you need independent sources to check a source, but *all* you have are sources? Pure source criticism alone *can* lead to infinite regress or total skepticism.
  *   **The Solution (Bootstrapping):** Historians **don't rely *only* on textual sources** and **use multiple *types* of evidence**. Here's how they break the circle:
      1.  **Material Evidence is Independent:** Archaeology, coins, inscriptions, pollen analysis, geology, DNA – these aren't "sources" in the textual narrative sense. A coin proving a king existed is independent corroboration for a text mentioning him.
      2.  **Science Provides Anchor Points:** Dendrochronology (tree rings), radiocarbon dating, climate data – provide objective timelines and environmental context independent of written claims.
      3.  **Coherence Builds a Web:** As you gather more evidence (textual *and* material), you build a picture of a time/place. A new claim is tested against *this entire web* (**External Consistency P5**). Does it fit? Does it explain other evidence better? Does it contradict massively?
      4.  **Probability & Consensus:** Absolute certainty is rare. Historians look for the *most probable* explanation given *all* available evidence. A claim supported by multiple independent source *traditions*, backed by archaeology, and fitting the geographical/scientific context, becomes highly probable. A lone, uncorroborated claim in a source with known bias remains doubtful.
  *   **What it Means:** A valid method *must* be suspicious (prioritizing **NN1, NN2, NN3**). But it *doesn't* give up on answers. It:
      *   Uses **non-textual evidence** as the crucial independent check.
      *   Seeks **convergence** from multiple angles (texts + archaeology + science).
      *   Accepts **degrees of certainty** (confirmed, probable, possible, doubtful, disproven).
      *   Recognizes **gaps in knowledge** where evidence is insufficient.

  **Summary of Requirements:**

  *   **Non-Negotiable (Must Have):** Independent Corroboration, Provenance Assessment, Internal Consistency Analysis.
  *   **Preferred (Powerful Tools):** Motive & Bias Scrutiny (incl. Criterion of Embarrassment), External Consistency/Coherence, Methodology of the Source.

  The method is inherently suspicious, demanding proof beyond the source itself. It breaks the circle by demanding material evidence and building a coherent web of all available data. It provides probable answers, not absolute certainties, by converging multiple lines of inquiry.
