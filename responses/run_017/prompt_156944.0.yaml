  Below is a classification instrument for the precautionary principle, structured as a decision tree with 8 terminal leaves (views). The tree uses **7 binary questions** grounded in your specified cases, avoiding any direct reference to the principle itself. Questions are answered based on concrete scenarios, and the resulting leaves map to existing views. Empty cells and limitations are explicitly addressed. 

  ---

  ### **Decision Tree: Branching Questions**
  Answer each question for a proposed intervention (e.g., gene-drive release, AI pause) without considering precautionary labels. Branches are mutually exclusive and exhaustive.

  1. **Uncertainty Type**  
     *In the case of a gene-drive release for malaria control, is the uncertainty best described as:*  
     → **A: Inability to assign any probability** (e.g., unknown ecological cascade effects).  
     → **B: Inability to assign precise probabilities** (e.g., risk of cross-species gene flow estimated at 5–40%).  

  2. **Irreversibility Focus**  
     *For a statutory pause on training AI models above a compute threshold, if harm occurs, what is primarily irreversible?*  
     → **A: The outcome** (e.g., mass disinformation or loss of control).  
     → **B: The option set** (e.g., the pause locks in regulatory precedents, narrowing future choices).  

  3. **Status Quo Catastrophic Risk**  
     *In a small outdoor field trial of a climate intervention (e.g., solar geoengineering), does inaction carry a catastrophic risk comparable to action?*  
     → **A: Yes** (e.g., not trialing may accelerate climate tipping points; risks are symmetric).  
     → **B: No** (e.g., trialing risks unpredictable weather disruption; inaction risks are lower/more diffuse).  

  4. **Information Destruction from Abstaining**  
     *If we abstain from a ban on publishing model weights that lower barriers to biological misuse, does this abstention destroy information needed to reduce future risk?*  
     → **A: Yes** (e.g., no ban allows dual-use knowledge to spread, hindering defensive R&D).  
     → **B: No** (e.g., abstaining enables crowd-sourced risk monitoring; information is preserved).  

  5. **Burden Distribution of Abstaining**  
     *If we abstain from requiring liability insurance for AI developers, who primarily bears the burden?*  
     → **A: Identifiable people now** (e.g., uninsured developers face bankruptcy from lawsuits).  
     → **B: Merely possible people later** (e.g., future victims of uninsured AI harms).  

  6. **Sequential vs. One-Shot Choice**  
     *Is a duty to file evaluation results with a regulator before deployment part of a sequence of similar choices?*  
     → **A: One-shot** (e.g., a unique regulatory decision for a novel AI capability).  
     → **B: Sequential** (e.g., iterative filings that allow learning and adjustment).  

  7. **Institutional Stickiness**  
     *If we implement a duty to file evaluation results, is the institutional settlement easily reversible?*  
     → **A: Yes** (e.g., sunset clauses make the duty temporary).  
     → **B: No** (e.g., the duty creates entrenched agencies or industry norms).  

  ---

  ### **Terminal Leaves (Views) and Their Mapping**  
  Based on the 7 questions, 128 logical cells exist. Only 8 are occupied by major views. Below, paths are denoted as sequences of answers (e.g., AABABAB). For each leaf:  
  - **View**: Name and core position.  
  - **Path**: Combination of answers leading here.  
  - **Most awkward commitment**: Key vulnerability.  

  1. **Strict Maximin**  
     - *View*: Avoid the worst-case outcome at all costs; ignore probabilities.  
     - *Path*: **A** (any prob.) + **A** (outcome irrev.) + **B** (status quo risk asymmetric) + **ANY** + **B** (burden on future) + **ANY** + **ANY**.  
     - *Awkward commitment*: May reject interventions with massive expected benefits (e.g., refusing gene-drive release despite 1M malaria deaths/year).  

  2. **Weighted Minimax-Regret**  
     - *View*: Minimize maximum regret (loss relative to best outcome), weighting worst-case but not exclusively.  
     - *Path*: **B** (imprecise prob.) + **A** (outcome irrev.) + **B** (asymmetric risk) + **ANY** + **B** (burden on future) + **A** (one-shot) + **ANY**.  
     - *Awkward commitment*: In sequential decisions (e.g., iterative AI governance), it may overinvest in risk aversion.  

  3. **Rio Proportionality**  
     - *View*: Cost-effective precautions; balance risks against economic/social benefits (Rio Declaration style).  
     - *Path*: **B** (imprecise prob.) + **ANY** + **A** (symmetric risk) + **B** (no info loss) + **ANY** + **B** (sequential) + **A** (reversible).  
     - *Awkward commitment*: Quantification pressures may exclude non-economic values (e.g., democratic legitimacy in climate trials).  

  4. **Procedural Burden-Shifting**  
     - *View*: Shift proof obligations to proponents; no substantive risk threshold.  
     - *Path*: **ANY** + **B** (option-set irrev.) + **ANY** + **ANY** + **A** (burden on now) + **B** (sequential) + **B** (sticky institutions).  
     - *Awkward commitment*: May allow minor harms to accumulate (e.g., lax proof standards in liability insurance).  

  5. **Ambiguity-Aversion Reductionism**  
     - *View*: Precaution is EU-maximization with aversion to imprecise probabilities (à la Ellsberg).  
     - *Path*: **B** (imprecise prob.) + **A** (outcome irrev.) + **B** (asymmetric risk) + **B** (no info loss) + **B** (burden on future) + **ANY** + **ANY**.  
     - *Awkward commitment*: Fails under complete ignorance (e.g., gene-drive ecology with no probability model).  

  6. **Paralytic Critique**  
     - *View*: Precaution forbids all options when inaction is high-risk (self-defeating).  
     - *Path*: **A** (any prob.) + **A** (outcome irrev.) + **A** (symmetric risk) + **ANY** + **ANY** + **ANY** + **ANY**.  
     - *Awkward commitment*: Offers no alternative framework; collapses into fatalism.  

  7. **Reflexive Precaution**  
     - *View*: Apply precaution to precautionary measures themselves (e.g., avoid irreversible institutions).  
     - *Path*: **ANY** + **B** (option-set irrev.) + **ANY** + **A** (info loss) + **ANY** + **B** (sequential) + **B** (sticky institutions).  
     - *Awkward commitment*: May institutionalize delay (e.g., opposing filing duties to avoid bureaucratic lock-in).  

  8. **Legitimacy-Centric**  
     - *View*: Precaution is about who consents to imposing risks (not outcome optimization).  
     - *Path*: **ANY** + **B** (option-set irrev.) + **ANY** + **ANY** + **A** (burden on now) + **ANY** + **B** (sticky institutions).  
     - *Awkward commitment*: Risks paralysis if stakeholders irreconcilably disagree (e.g., on climate interventions).  

  ---

  ### **Empty Cells and Why They Are Unexplored**  
  Two logically possible but unoccupied cells:  

  1. **Path: A (any prob.) + A (outcome) + A (symmetric) + A (info loss) + B (burden on future) + A (one-shot) + B (sticky)**  
     - *Why empty*: **Incoherent**. Combines paralytic self-defeat (from symmetric risk) with strict maximin (burden on future/one-shot). One cannot simultaneously hold that all options are forbidden *and* that avoiding the worst case is paramount.  

  2. **Path: B (imprecise prob.) + B (option-set) + B (asymmetric) + A (info loss) + A (burden on now) + B (sequential) + A (reversible)**  
     - *Why empty*: **Unattractive**. Suggests procedural burden-shifting when abstaining destroys information *and* burdens current actors. But burden-shifting views avoid substantive risk judgments, making them ill-equipped to handle irreversible information loss. No theorist defends this, as it risks "proof-shifting" into epistemic black holes.  

  ---

  ### **Limitations and Epistemic Position**  
  **Indistinguishable Pairs**:  
  - **Rio Proportionality (3)** and **Ambiguity-Aversion Reductionism (5)** diverge only in edge cases (e.g., when info loss is present). Both rely on risk-risk comparisons under imprecise probabilities. The tree cannot separate them cleanly without artificial questions.  
  - **Procedural Burden-Shifting (4)** and **Legitimacy-Centric (8)** overlap when institutional stickiness and burden distribution align. They differ in *why* procedures matter (proof vs. consent), but the tree’s cases often conflate these.  

  **My Epistemic Stance**:  
  - **High confidence**: Mapping of paralytic (6), reflexive (7), and legitimacy-centric (8) views. These depend on irreversibility type and burden distribution, which are stable in your cases.  
  - **Low confidence**: Maximin (1) vs. minimax-regret (2). Their distinction hinges on subtle treatments of "less-than-worst" cases, which the tree simplifies.  
  - **Would redraw if**: A case emerges where *institutional irreversibility* (e.g., liability insurance reshaping markets) clearly diverges from *option-set irreversibility*. Currently, Q2 lumps these.  
  - **Misclassification risk**: **Ambiguity-Aversion Reductionists (5)** may be misclassified as **Rio Proportionalists (3)** if they emphasize cost-benefit language. Their core divergence (EU formalism vs. pragmatic balancing) is not captured by the cases.  

  ---

  ### **How to Use**  
  - Students evaluate interventions by answering the 7 questions, then trace the path to a leaf.  
  - Empty cells highlight conceptual gaps in the literature (e.g., no view handles symmetric risk + information destruction).  
  - The tree forces engagement with *why* views diverge (e.g., irreversibility type, not just catastrophe size).  

  This instrument avoids your "single-axis collapse" by decoupling worst-case severity from burden distribution, irreversibility types, and risk symmetry. It treats precaution as a heterogeneous cluster of risk-management heuristics, not a monolithic principle.
