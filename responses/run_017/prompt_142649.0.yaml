answer: |-
  This is a fascinating pattern—you're describing a class of *mutually transparent strategy commitments* that exploit *algorithmic reciprocity* to achieve cooperation where classical game theory fails. The core innovation is using *program structure as a coordination device*. Let me break this down systematically.

  ### Core Mechanism & Its Name
  The general trick is **Syntactic Nash Implementation (SNI)**—cooperation emerges when strategies enforce behavioral alignment through *direct inspection of implementation artifacts*. SNI works because:
  - Programs act as *unbreakable pre-commitments*
  - Source access enables *counterfactual testing* ("If I defect, how would they respond?")
  - Identity conditions create a *mutual off-ramp* for cooperation

  It differs from:
  - **Focal points** (which rely on salience, not structural proof)
  - **Correlated equilibria** (no external randomizing device)
  - **Program equilibrium** (broader concept; SNI is a subset where cooperation hinges on syntactic/semantic matching)

  ### Fragility Taxonomy
  Your variants reveal critical fault lines in SNI:

  1. **Cosmetic Fragility (Text-Identity)**  
     *Problem*: Cooperation depends on *syntax equivalence*, not behavioral equivalence.  
     *Name*: **Representational Brittleness**  
     *Boundary Case*: Adding dead code (`if false: print("pizza")`) breaks cooperation, while a compiler-optimized identical-behavior program doesn't. *Not* SNI if cooperation survives semantics-preserving transformations.

  2. **Simulation Paradox**  
     *Problem*: Sandbox detection creates **Strategic Simulation Uncertainty**.  
     *Critical Issues*:  
     - If opponent defects *only* when simulated, cooperation fails (self-sabotage)  
     - Timeout handling: Defaulting to "defect on unknown" incentivizes adversaries to build slow programs  
     *Name*: **Hypergame Vulnerability** (the simulation becomes a subgame the opponent can exploit)

  3. **Proof-Theoretic Wall**  
     *Problem*: Mutual proof search hits **Co-inductive Blowup**—proving "I cooperate if you cooperate" requires a fixed point.  
     *Distinction*:  
     - Under fixed proof budgets: Engineering problem (proof length grows combinatorially)  
     - With unbounded resources: Löbian obstacle (cannot self-verify cooperation without consistency assumptions)  
     *Key Insight*: SNI fails here if the formal system can't construct a mutual cooperation proof *within resource limits*—even when cooperation is the unique equilibrium.

  ### Junk Equilibria & Selection
  The combinatorial explosion of arbitrary SNI equilibria (e.g., "cooperate iff code contains 'banana'") is the **Triviality Flood**. This doesn't sink SNI but reveals:
  - **Coordination Cost**: Parties must pre-align on *which* syntactic feature to use
  - **Domination Problem**: Most SNI equilibria are *Pareto-inferior* to always-defect (e.g., cooperating only on prime-length code)
  - **Solution**: SNI only escapes triviality when the identity condition is *intentionally designed for robustness* (e.g., simulation/proof-based)

  ### Load-Bearing Elements
  Removing components shows what matters:
  ```
  Commitment + Transparency → Viable SNI  
  │       └─No transparency → Blind defection (classic PD)  
  └─No commitment → Unstable (can rewrite after inspection)  
  ```
  - **Commitment is non-negotiable**: Programs must be immutable once submitted.  
  - **Transparency enables mutual inference**: Code inspection allows predicting responses to deviations.  
  - **Self-reference is emergent**: Not required explicitly, but mutual inspection creates fixed points.  

  **Surprise result**: If you drop commitment but keep transparency, *nothing useful survives*. An agent could:
  1. Inspect opponent's code  
  2. Temporarily "cooperate" during simulation  
  3. Rewrite own code to defect at runtime  
  This collapses to mutual defection—commitment anchors the equilibrium.

  ### Conceptual Map
  | Variant          | Fragility Type          | Failure Mode                     | Robustness Threshold               |
  |------------------|-------------------------|----------------------------------|-----------------------------------|
  | Text-Identity    | Representational Brittleness | Cosmetic divergence          | Syntax isomorphism                |
  | Simulation       | Hypergame Vulnerability | Adversarial sandbox detection | Simulation invariance proofs      |
  | Proof-Based      | Co-inductive Blowup     | Proof-length explosion       | Decidable mutual cooperation      |

  **Syntactic Nash Implementation** works precisely because game outcomes are made *contingent on the opponent's decision machinery* rather than their outputs. Its power comes from converting the *act of strategy description* into a coordination device—but this also creates vulnerabilities where the *representation* of the strategy matters more than its *behavioral consequences*. The distinctions you're groping toward are ultimately about how deeply we require strategies to penetrate each other's causal structure to achieve stable cooperation. What makes SNI fascinating—and maddening—is that it works *despite* being philosophically precarious.
