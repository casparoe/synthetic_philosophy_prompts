answer: |-
  **Opening Remarks: Westhollow Town Meeting, Tuesday [Date]**  

  Good evening, Westhollow. My name is [Your Name], your elected moderator. I call this special town meeting to order. We have one article on our warrant tonight: whether Westhollow should merge with the town of Kestrel to form one new municipality. But before we can vote on that merger, we face a foundational question: **Who gets to vote?**  

  This isn’t a technicality. It’s the heart of the matter. Our current charter says voters are resident taxpayers. But if we merge, that charter disappears. So using it to decide who votes on its replacement is like using an old map to navigate a landscape we’re actively changing. It won’t hold.  

  We all feel the weight of this decision. The fire chief knows merging could reshape emergency services. The diner owner on the green sees how shared resources might affect her livelihood. Tenants in the mill pay rent but not property taxes—are they heard? Commuters live under our rules all day but vote elsewhere. Families upstream rely on water a merged town would manage. And yes, students arriving in September or families signing leases for July may inherit this new community.  

  The law won’t save us here. The law is what we’re deciding. And while it’s tempting to say "everyone affected should vote," that idea bends like water. Affectedness is a spectrum. If we drill a well, is only the landowner affected? Or the neighbor? Or the whole watershed? If we set the threshold too low, the room overflows. Too high, voices vanish. **We must draw the line ourselves.**  

  One proposal suggests looking forward: enfranchise those who *will* be governed by the new town—future residents, long-term stakeholders. It asks us to vote not just as who we are today, but as stewards of who we’ll become. Others argue only today’s residents, bound by current taxes and rules, should decide. Both views hold weight. Neither is self-evident.  

  Tonight, you hold two questions in your hands:  
  1. **Who constitutes "us" for this vote?**  
  2. **Should "us" become one town with Kestrel?**  

  I won’t decide either for you. My role is to ensure this meeting is fair, focused, and grounded in our shared responsibility. Listen closely. Speak plainly. Honor each voice. However we define ourselves tonight, this vote will echo for generations.  

  The floor is open. We first debate and vote on the electorate. Then, we vote on the merger. Let’s begin.  

  ---

  **Reflection: Deliberate Ambiguities and Their Costs**  

  1. **Refusing to Define "Affectedness"**:  
     I acknowledged the concept but declined to propose thresholds (e.g., property ownership, residency duration, or utility access). This preserves neutrality but leaves the term abstract, risking vagueness for non-theorists. The diner owner may wonder why "affected" isn’t simply defined as "lives here now."  

  2. **Not Endorsing Past vs. Future Stakeholders**:  
     I presented the "reverse-mirror rule" (future-focused) alongside the present-focused view without weighting them. This avoids rigging the debate but may frustrate practical minds (e.g., the fire chief) seeking a clear starting point. The reporter might note the speech highlighted tension without resolving it.  

  3. **Avoiding Criterion for "Stake"**:  
     I listed disparate groups (tenants, commuters, well owners) but didn’t prioritize their claims. This honors all perspectives but may dilute urgency. A tenant might feel their rent isn’t framed as a "stake," while the theorist notes I sidestepped how legal, moral, and practical claims interact.  

  **Total: 148 words**
