answer: |-
  Your observation captures a profound epistemological phenomenon that lacks a single established name but intersects several key concepts in philosophy of science. I'll synthesize these, define a new term to capture your cases' uniqueness, and demarcate boundaries.

  ### Core Concept: **Evidential Retroprojection**
  **Definition:** The process by which *previously recorded but epistemically discounted empirical results* gain status as valid evidence *only after* a new theoretical framework provides the conceptual tools to:  
  (a) Re-describe them in theory-relevant terms,  
  (b) Re-process them with new correction methods, and  
  (c) Reinterpret their significance as confirmatory rather than anomalous.  
  Crucially, the evidence isn't merely "rediscovered" – its *ontological status as evidence* is retroactively constituted by the new theory.

  ### Key Boundaries & Distinctions
  1.  **vs. Kuhnian "Anomaly Assimilation"**  
      (Kuhn, *Structure of Scientific Revolutions*)  
      - *Similarity:* Pre-revolutionary anomalies become post-revolutionary exemplars.  
      - *Difference:* Your cases involve active *epistemic rehabilitation* – the data undergoes technical re-reduction (isotope ratios) or re-categorization (morphology). Kuhn's anomalies are recognized *as* anomalies pre-revolution but lack explanatory framework. In your cases, the data wasn't even granted anomaly status; it was dismissed as *non-evidence* (e.g., "contamination").

  2.  **vs. Hacking's "Phenomenon-Technology Duality"**  
      (Hacking, *Representing and Intervening*)  
      - *Similarity:* New measurement techniques (like your "better corrections") create new phenomena.  
      - *Difference:* Your cases involve *old* measurements gaining new meaning through *conceptual* shifts, not just new tech. The theory enables re-processing *existing* data.

  3.  **vs. "Old Evidence Problem" (Glymour, Clark)**  
      - *Similarity:* Concerns evidence known prior to theory.  
      - *Difference:* The "old evidence" problem assumes the evidence *was already accepted as valid*. In your cases, it was *not* accepted – its validity is constituted *by* the new theory. Bayesian worries about probability-raising don't apply because the evidence's epistemic status changes.

  4.  **vs. "Hermeneutic Recalibration" (Rouse, *Knowledge and Power*)**  
      - *Similarity:* Data is reinterpreted within new conceptual schemes.  
      - *Difference:* Your cases require material re-processing (re-calculation, re-categorization) – not just interpretation. The *same numerical values* become different epistemic objects.

  ### Boundary Cases: When Does Evidential Retroprojection Apply?
  | **Case**                       | **Retroprojection?** | **Why?**                                                                 |
  |--------------------------------|----------------------|--------------------------------------------------------------------------|
  | Galileo's lunar observations   | No                   | Data was *recognized as significant anomaly* pre-theory (Ptolemaic astronomers noted lunar imperfections). |
  | Mercury's perihelion pre-1915  | No                   | Anomaly was acknowledged pre-GR; no re-measurement/re-description needed. |
  | Your isotope ratios            | **Yes**              | Dismissed as contamination; later re-processed & re-described as evidence. |
  | Your morphology case           | **Yes**              | Treated as noise; later re-categorized as "signature" under new theory.  |
  | Dark matter (Zwicky, 1933)     | Partial              | Anomaly was noted but ignored; *later* observations (1970s) confirmed it – no retroactive re-processing of original data. |
  | Prout's hypothesis (1815)      | **Yes**              | Non-integer atomic weights dismissed as error; post-isotope theory, same data re-analyzed as evidence. |

  ### Why This Concept Matters
  It reveals science's **hermeneutic depth**: data isn't theory-neutral but gains evidentiary force through dynamic theory-laden practices. The "re-constitution" you describe shows that **evidence is an achievement**, not a raw given. This reframes debates about:
  - **Theory-ladenness**: Not just perceptual bias, but *categorical reconstruction* of past data.
  - **Scientific realism**: Success isn't merely predicting *new* phenomena but *retroactively validating* once-discarded artifacts.
  - **Historiography**: "Lost" data may be epistemically inert until theories reactivate it.

  ### Conclusion
  Your cases exemplify **evidential retroprojection** – a process where theories retroactively confer evidentiary status upon previously excluded empirical material through conceptual, methodological, and ontological rehabilitation. This differs from mere reinterpretation by requiring *technical re-processing* and *epistemic promotion* (artifact → datum). It highlights science's capacity not just to discover new truths, but to *reclaim lost signals* from the noise of its own prior frameworks.
