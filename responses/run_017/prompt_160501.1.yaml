prompt: |-
  I'm in an upper-level seminar on legal epistemology this term and I keep going in circles about something, so I figured I'd ask people who think about disagreement for a living. Here's the bit of court practice I can't get straight — I'm not a lawyer, so just take my description of the doctrine as given even if I've mangled the details. Federal courts of appeals sit in panels of three, and a later panel isn't allowed to overrule an earlier panel of the same court even when all three judges are convinced the earlier decision was wrong; they have to apply it anyway and can only grumble in a concurrence or ask the full court to rehear the case. So three judges with the benefit of hindsight and the earlier panel's reasoning sitting right in front of them lose to three judges who happened to decide it first. But down at the district court level one judge's ruling binds nobody: a second district judge can read the first one's opinion, disagree, and go the other way, and nobody treats that as improper. And then there's qualified immunity — when someone sues an officer for violating a constitutional right, the officer gets off unless the right was clearly established at the time, and as I understand it one of the standard ways of showing it wasn't is to point at a split among the circuits. Judges elsewhere disagreeing is treated as a reason the officer couldn't have known. So the same system that won't let its own judges register disagreement with each other lets *other* judges' disagreement wipe out a plaintiff's remedy, and does that even when the plaintiff has a precedent squarely in his favor in his own circuit.

  What I want to know is what view of peer disagreement this whole package presupposes, if it presupposes one at all. My seminar leader says none of it is epistemology — precedent is just settlement, like picking a side of the road, and the rule about panels is about hierarchy and error costs, not about what to believe when someone competent disagrees with you. I sort of think that can't be the whole story, because the qualified immunity bit plainly does treat disagreement as *evidence* of something, just aimed at the parties instead of at the judges. So: reconstruct the implicit theory for me, including the part where disagreement seems to count against knowledge or faultlessness for everyone except the judges themselves. Be honest about which pieces of the practice really follow from that theory and which are just compatible with it — my guess is the prior-panel rule can be justified from about five directions and commits nobody to anything about disagreement, while the immunity rule is doing something much stranger. Is the package coherent, or is it quietly relying on two different notions of what a peer is?

  Then the part I'm actually stuck on. My friend in the seminar is a hardline conciliationist and says the whole thing is indefensible and that a consistent court system would look completely different — maybe no published dissents at all, maybe panels pooling their confidence with every other panel that has touched the question, maybe a rule where a later unanimous panel outvotes an earlier one on the grounds that it has strictly more evidence. He's also floated counting heads across circuits, so that a position signed by eighteen judges beats one signed by six. I've been toying with my own version: scrap the binary clearly-established test and make the damages scale with how many judges across the country have signed onto each side of the question, a disagreement-weighted remedy. I can't tell whether that's conciliationism applied properly or a total misuse of it, and whether a conciliationist is actually *committed* to liking it. Would they be? And what would a steadfastness-friendly version of all this look like institutionally — does anything have to change, or is steadfastness already the practice and only the immunity doctrine out of step?
reasoning: |-
  Okay, the user is in an upper-level seminar on legal epistemology and is struggling with how the legal system handles judicial disagreement, especially in three specific contexts: federal appellate panels, district court rulings, and qualified immunity. They're trying to figure out what theory of peer disagreement underpins these practices and whether the system is coherent. Their seminar leader says it's not about epistemology but about settlement and hierarchy, but the user suspects the qualified immunity aspect treats disagreement as evidence. They also mention their friend's conciliationist views and their own idea for a disagreement-weighted remedy system.

  First, I need to break down each component of the legal practices they described. The prior-panel rule in federal appeals courts prevents later panels from overruling earlier ones, even if they think the earlier decision was wrong. This seems like a procedural rule to maintain consistency and reduce litigation costs. Then, district courts don't bind each other, allowing horizontal disagreement. Qualified immunity uses circuit splits as evidence that a right wasn't clearly established, which directly uses disagreement to determine knowledge.

  The user's main question is whether there's an implicit theory of peer disagreement here. The seminar leader argues it's about settlement, not epistemology. But qualified immunity uses disagreement epistemically—it shows that the officer couldn't have known the right was established. So there's a tension. The system treats judicial disagreement differently depending on the context: binding within the same court but as evidence of uncertainty in immunity cases.

  The user also wants to know if the whole package is coherent. The prior-panel rule prioritizes stability and efficiency, while the district court flexibility allows for percolation of ideas. Qualified immunity’s use of circuit splits as evidence of ambiguity ties into epistemic considerations for the officer's state of mind. These different treatments serve different institutional goals: stability vs. error correction vs. fairness to defendants. So coherence comes from functional roles, not a unified theory of disagreement.

  The friend's conciliationist approach would require courts to aggregate opinions and avoid dissents. But legal systems aren't just truth-seeking; they need finality and practicality. Conciliationism might not fit because courts have to resolve disputes authoritatively, not just seek truth. The user's idea of scaling damages based on judicial disagreement might be an over-application of conciliationism. It could introduce unpredictability and isn't practical for a system that needs clear rules.

  Steadfastness aligns more with the current system. Judges in panels can dissent but still follow precedent. District judges can disagree without binding others. Qualified immunity's use of disagreement for officers' knowledge is context-specific. So the system already incorporates steadfastness except in qualified immunity, which serves a different purpose.

  The user's deeper needs might include understanding the philosophical underpinnings of legal procedures and reconciling apparent inconsistencies. They might also be seeking validation of their critique of qualified immunity's epistemic fairness. Their proposed solutions show a desire to apply philosophical principles consistently, but they need to recognize the practical constraints of legal systems. Balancing epistemology with institutional design is key here.
answer: |-
  Your dissection is razor-sharp – you've pinpointed the core tension beautifully. Your seminar leader isn't *wrong* about settlement and error costs being primary drivers, but dismissing epistemology entirely misses the crucial nuance, especially with qualified immunity (QI). Let's reconstruct the implicit (and sometimes contradictory) views of disagreement embedded in this package:

  **The Implicit (and Fragmented) Theory of Disagreement:**

  1.  **Prior-Panel Rule (Stare Decisis within a Circuit):**
      *   **View of Disagreement:** Largely **non-epistemic**. It treats the *decision* of the first panel as a **settled rule**, not necessarily the *epistemic state* or *reasoning* of those judges.
      *   **Primary Justification:** **Settlement, Stability, and Hierarchy.** The core value is finality and predictability within the circuit. Overruling creates uncertainty and invites endless litigation. It's about institutional coordination ("pick a side of the road"), respecting the institutional authority of the earlier panel (even if wrong), and minimizing transaction costs for litigants and lower courts. Judges are bound by the *rule*, not the *belief* of their predecessors. Their subsequent "disagreement" is expressed through concurrence or en banc petitions, but it doesn't change the binding rule.
      *   **Epistemic Nuance (if any):** Minimally, it might imply that *institutional settlement* trumps *current epistemic conviction* in the interest of systemic goals. It's less "The first panel was probably right" and more "We must act *as if* they were right for the system to function."

  2.  **District Court Non-Bindingness:**
      *   **View of Disagreement:** **Permissible Exploration / "Percolation".** Disagreement among peers (district judges) is seen as **valuable and necessary** for exploring complex legal questions. It allows different arguments to be tested in different factual contexts.
      *   **Primary Justification:** **Error Correction & Refinement.** The system *wants* disagreement at this level. It provides raw material (split decisions) for appellate courts to resolve authoritatively. It's a recognition that complex law rarely has one obviously correct answer initially, and multiple perspectives aid development. District judges are epistemic peers *allowed* to disagree.
      *   **Epistemic Nuance:** Implicitly acknowledges that reasonable peers *can* and *should* disagree when the answer isn't clear, and that such disagreement is a path to finding a better answer (or at least revealing the need for appellate clarification).

  3.  **Qualified Immunity ("Clearly Established" & Circuit Splits):**
      *   **View of Disagreement:** **Strongly Epistemic (for the Officer).** Disagreement among judges (especially circuit splits) is treated as **direct evidence relevant to the officer's state of mind and the clarity of the law.** A split demonstrates that reasonable jurists disagree on the existence or scope of the right.
      *   **Primary Justification:** **Fair Notice & Avoiding Chilling Effects.** The core QI doctrine aims to protect officers who reasonably, but mistakenly, believe their conduct was lawful. If judges themselves (the experts on the law) disagree, this is powerful evidence that the law *was not clear enough* for a reasonable officer to know their conduct was unconstitutional.
      *   **Epistemic Nuance:** This explicitly treats judicial disagreement as **probative evidence of legal ambiguity**, which in turn negates the "clearly established" prong. It's epistemological in assessing what *could reasonably be known* by the officer. The existence of disagreement *itself* undermines the claim of clear establishment, even if the plaintiff has favorable precedent in their circuit. The officer isn't expected to be a legal scholar parsing circuit splits, but the *existence* of the split objectively demonstrates the lack of clarity.

  **Coherence? Two Notions of "Peer"?**

  *   **Is the package coherent?** **Not perfectly, but functionally so.** The tension is real: the same system that suppresses disagreement among appellate peers (prior-panel rule) for stability uses disagreement among appellate peers (circuit splits) as evidence for legal uncertainty (QI). It relies on *different aspects* of disagreement in different contexts.
  *   **Different Notions of "Peer"?** Yes, implicitly.
      *   **For Judges (Prior-Panel Rule):** Peers are bound by the *institutional output* (the precedent) of an earlier peer group. Their individual epistemic states are subordinated to the institutional need for settled law *within their own court*.
      *   **For Officers (QI):** Disagreement among judicial peers *across the system* is treated as evidence about the *objective state of the law's clarity*. Here, judges are epistemic authorities whose disagreements reveal genuine ambiguity.
      *   **For District Judges:** Peers are free epistemic agents whose disagreements are valuable inputs to the system.

  The coherence comes from **functional separation**:
  *   **Intra-circuit Appellate Stability:** Requires suppressing disagreement's effect on the rule.
  *   **Inter-circuit Development & Final Authority:** Allows disagreement to percolate until SCOTUS resolves it.
  *   **QI Fairness Doctrine:** Leverages the *existence* of disagreement (especially unresolved splits) as proof of ambiguity for a *different audience* (officers). It doesn't require judges to *change their beliefs* based on disagreement; it uses the *fact* of disagreement *elsewhere* as evidence relevant to a *third party's* knowledge.

  **Your Friend's Conciliationist Vision:**

  Conciliationism (in philosophy of disagreement) holds that upon encountering peer disagreement, one should significantly reduce confidence in one's position and move towards the other view or suspend judgment. Applying this rigidly to courts:

  1.  **No Published Dissents:** Makes sense conciliationist-ly. A dissent signals a judge hasn't conciliated. But it destroys valuable information about reasoning and the strength of disagreement.
  2.  **Pooling Confidence Across Panels:** Logically consistent but practically chaotic. How is "confidence" measured? How are panels weighted (chronology, size, perceived expertise)? When does "enough" pooled confidence trigger overruling? This undermines stability and predictability – core legal values.
  3.  **Unanimous Panel Overrules:** Slightly less chaotic but still prioritizes current conviction over settled law. It weakens stare decisis significantly.
  4.  **Counting Heads Across Circuits:** Treats judges as pure epistemic peers in a giant truth-seeking seminar. It ignores:
      *   **Jurisdiction/Precedent:** A judge in the 9th Circuit *must* follow 9th Circuit precedent, even if 10 other circuits disagree. Precedent isn't just about headcount; it's about authority structure.
      *   **Reasoning Quality:** A well-reasoned opinion by 3 judges might be epistemically superior to a poorly reasoned one by 10.
      *   **Institutional Role:** Courts resolve disputes authoritatively, not just seek abstract truth. Finality matters.

  **Would a conciliationist be committed to liking your disagreement-weighted remedy?** Not necessarily, but it's a fascinating *application* of conciliationist *intuitions* to remedy, not belief. It translates the *degree* of judicial disagreement into a *consequence* (damages).

  *   **Arguments For (as Conciliationist Application):** It directly incorporates the "degrees of wrongness" idea implied by disagreement. If many judges disagree, the officer's mistake was less culpable/reasonable; if few disagree, it was more culpable/unreasonable. It avoids the harsh all-or-nothing QI outcome.
  *   **Arguments Against (Even for Conciliationists):**
      *   **Practicality:** How to calculate? (Raw judge count? Weighted by seniority/court level? Account for reasoning quality?). Creates massive uncertainty in litigation.
      *   **Focus Shift:** Conciliationism usually concerns *belief revision*, not *remedy calculation*. Your proposal applies it to consequences for a third party (the officer).
      *   **Institutional Fit:** It might clash with the need for clear rules and deterrence. A truly conciliationist system might focus on judges conciliating *their beliefs* first, before worrying about remedies.
  *   **Is it a "Misuse"?** Not a misuse, but an *extension* or *adaptation*. It uses the conciliationist insight about disagreement indicating uncertainty to modulate a legal consequence. Whether this is *desirable* is separate from pure conciliationism.

  **A Steadfastness-Friendly Version:**

  Steadfastness holds that one can rationally maintain one's belief in the face of peer disagreement, especially if one has good reasons for one's initial belief.

  *   **Does anything have to change?** **Very little.** The current system is *already* largely steadfastness-friendly, *except* for the epistemic use of disagreement in QI.
      *   **Prior-Panel Rule:** Judges *can* steadfastly believe the prior panel is wrong (and say so in concurrence/petition for en banc), but they *institutionally* follow the precedent. Steadfastness in belief is allowed; steadfastness in action (ignoring precedent) is not.
      *   **District Courts:** Judges are *expected* to be steadfast in their own reasoned judgment, even if other district judges disagree. Their rulings reflect their best judgment.
      *   **Dissents:** Are the epitome of judicial steadfastness – maintaining one's position despite peer disagreement within the panel.
  *   **The QI Exception:** This *is* hard for a pure steadfastness view *if applied to judges*. If Judge A steadfastly believes Right X is clearly established, why should the disagreement of Judges B-Z *elsewhere* negate that clarity *for the officer*? Steadfastness about the *current clarity* would resist giving the split such weight.
  *   **Steadfastness-Friendly QI Reform:** A steadfastness-compatible system might:
      *   **Focus on Circuit Precedent:** Judge steadfastness about *their circuit's law* aligns with QI asking if the right was clearly established *in the specific jurisdiction* (the officer's circuit). The existence of an *intra-circuit* precedent favoring the plaintiff would be much harder to overcome with *inter*-circuit splits. Disagreement *elsewhere* is less relevant to what *this* officer should have known in *this* circuit.
      *   **Minimize Splits as Evidence:** Give less weight to mere splits and focus more on the specificity of precedent, factual similarity, and the inherent reasonableness of the officer's mistake *within their own legal context*.
      *   **Abolish the "Clearly Established" Prong:** A truly radical steadfastness view might argue that if a judge/jury finds the right *was* violated (based on the law today), the officer should be liable, regardless of past clarity – the officer's steadfast belief they were right is irrelevant if they were objectively wrong. (This is a normative/policy argument, not purely epistemological).

  **Conclusion:**

  1.  **Implicit Theory:** The system relies on a fragmented view. Disagreement is suppressed for *intra-circuit appellate stability* (non-epistemic settlement), encouraged for *district court percolation* (epistemic exploration), and leveraged as *evidence of ambiguity* for *QI fairness* (epistemic for the officer). It uses different "peer" concepts contextually.
  2.  **Coherence:** It's functionally coherent due to distinct institutional goals in each context, but philosophically messy regarding the status of disagreement.
  3.  **Conciliationist Vision:** While internally consistent on conciliationist grounds, it clashes fundamentally with core legal values of stability, finality, and authoritative dispute resolution. Your weighted-remedy idea is a creative application of conciliationist *intuitions* to consequences, but faces major practical hurdles and may not be a necessary conciliationist commitment.
  4.  **Steadfastness & Status Quo:** The current system (outside QI) is already very compatible with steadfastness. Judges can steadfastly believe prior precedent is wrong but follow it institutionally. District judges are expected to be steadfast. The main tension is QI's use of *external* disagreement as evidence against *local* clarity. A steadfastness-friendly reform would likely strengthen the focus on the officer's specific circuit precedent and downplay inter-circuit splits.

  The genius, and the frustration, of the common law system is its ability to pragmatically deploy contradictory epistemic stances (suppress disagreement here, use it as evidence there) in service of diverse institutional purposes (stability, development, fairness) without requiring a single, coherent philosophical theory of disagreement. Your struggle perfectly captures that tension.
