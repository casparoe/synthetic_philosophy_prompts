prompt: |-
  youre a philosopher of biology who has spent years on the species problem, and also — this is the part I actually need — someone who has had to hand a species concept to people who write binding regulations. Before you write anything, brainstorm out loud for a bit: argue with yourself about whether the spec I'm asking for is even coherent, and list the requirements you're tempted to include but think are bogus. I'd rather have a slightly messy list that names the real tensions than a clean one that hides them.

  What the concept is for: I'm helping draft guidance for an international biodiversity instrument. It has to do three jobs at once. (1) Deciding which populations get legal protection when a listed taxon gets split or lumped. (2) Giving a stable unit for monitoring extinction rates, so that adopting a better concept shouldn't make the trend line jump by 30% overnight. (3) Handling organisms that don't reproduce in anything like the familiar way.

  Give me the requirements list — what any species concept has to deliver to be adequate for that job — with the case behind each, and mark which are non-negotiable and which are just preferences of one camp. Don't recite the usual menu of concepts and don't give me citations or a reading list; I have no web access and I dont need who-said-what. I want the criteria and their motivating cases. A table is fine.

  Here are the cases I want the list to earn its keep on, including two I've stipulated so you can't just fall back on stock examples:

  - Stipulated case one: a clade where overall genomic divergence and gene flow come apart. Populations A and B interbreed freely wherever they meet and the hybrids are fertile, yet they differ at a large fraction of sites across the whole genome. Populations C and D almost never interbreed in the wild, yet they differ at very few sites — and nearly all of those sit in a small number of regions on one chromosome. A concept that keys on amount of difference gets A/B wrong; one that keys on gene flow gets C/D wrong; one that keys on the differences that matter owes me an account of which ones matter that doesn't just assume the answer.
  - Stipulated case two: a group of microbes where the only trait anyone uses to sort them is a metabolic pathway carried on a mobile element that jumps between lineages. The niche-based criterion makes membership temporary; the lineage-based criterion makes the ecologically important unit invisible.
  - A continuous fossil sequence that has to be carved somewhere, because the treaty needs a count.
  - The familiar ring-species and hybrid-zone headaches, briefly, only if they add a requirement the others don't.

  Three more things. Say which distinctions a concept may not collapse — e.g. having species status versus how many species there are, and is-a-species versus is-the-same-species-as, given that the second relation misbehaves. Tell me which single requirement knocks out the most popular concepts. And if some subset of the requirements is jointly unsatisfiable — I suspect the law wants yes-or-no answers about something that is only ever a matter of degree, and I suspect being responsive to new evidence fights with job (2) — say so explicitly and show me the conflict; that's the part I most want to see.
reasoning: |-
  Alright, let me unpack this user's request. They're drafting guidance for an international biodiversity instrument and need a species concept that can handle three specific jobs: legal protection decisions during taxonomic changes, stable monitoring of extinction rates, and accommodating non-standard reproductive modes. 

  Hmm, the user clearly has deep expertise—they've stipulated two novel test cases that expose fundamental tensions in species concepts. The genomic divergence vs. gene flow case attacks both phenetic and isolation-based concepts, while the mobile element microbes undermine both ecological and lineage-based approaches. They're not just asking for textbook answers; they want the hidden trade-offs.

  *scratches head* The core tension seems to be between operational stability (for regulation/monitoring) and biological accuracy (for weird cases). Legal frameworks crave binary decisions, but speciation is often gradual. Monitoring needs fixed units over time, but taxonomy evolves with new evidence. 

  *stares at wall* Let me list non-negotiables first:
  - MUST be definable without circularity (can't assume what "matters")
  - MUST produce temporally stable units for monitoring
  - MUST handle non-sexual organisms
  - MUST distinguish lineage identity from lineage count

  *winces* But here's the rub: "Stable units" and "responsive to new science" directly conflict. If we fix species counts for monitoring, we can't later correct lumping/splitting without breaking trend lines. Yet refusing to incorporate new evidence is scientifically dishonest. 

  *ponders test cases* For the genomic divergence case, any single-measure concept fails. A hybrid concept requiring BOTH divergence AND isolation might work... but then how do we set thresholds? For the mobile element microbes, we'd need to separate lineage history (for protection) from functional traits (for management). 

  *checks user's emphasis* They really want the unsatisfiable parts exposed. The big one: Law demands yes/no answers about fuzzy biological processes. We can't have both perfect scientific accuracy and perfect regulatory stability. Compromises are inevitable—maybe designate "management units" that aren't called species?

  *realizes* Also, no concept can satisfy all three jobs equally. We might need different resolutions: coarse units for monitoring, finer units for protection, and separate functional categories for microbes. The table should show which requirements serve which job.
answer: |-
  Below is the requirements list for a regulatory species concept, structured by necessity and tension. Non-negotiables are marked **(N)**; preferences/compromises are **(P)**. Conflicts are explicit.

  ---

  ### **Core Requirements & Their Cases**
  | Requirement | Case Justification | Non-Negotiable (N) / Preference (P) |
  |-------------|-------------------|------------------------------------|
  | **1. Legally Actionable Boundaries**<br>(Clear yes/no for protection) | Treaty obligations demand unambiguous units for listing/delisting. Fuzzy boundaries (ring species, hybrid zones) create regulatory gaps. | **(N)** |
  | **2. Temporal Stability**<br>(Units persist across taxonomic revisions) | Monitoring extinction rates requires fixed units. E.g., splitting a fossil sequence *must not* artificially inflate species counts overnight. | **(N)** |
  | **3. Non-Arbitrary Delimitation**<br>(Criterion independent of human interests) | Stipulated Case 1: If "differences that matter" are defined by regulators (e.g., morphology), A/B are oversplit (high genomic divergence ≠ reproductive isolation), C/D underlumped (low divergence ≠ same species). | **(N)** |
  | **4. Lineage-Based (Not Trait-Based)**<br>(Units reflect evolutionary history, not transient traits) | Stipulated Case 2: Mobile metabolic elements make ecological niches ephemeral. Lineage persistence (e.g., core genome) ensures protection isn’t lost when traits transfer. | **(N)** |
  | **5. Accommodates Asexual/Non-Standard Reproduction**<br>(No reliance on interbreeding) | Microbes, hybrids, parthenogens. Gene flow criteria fail for C/D (low gene flow ≠ lineage split) or obligate asexuals. | **(N)** |
  | **6. Threshold Agnosticism**<br>(Avoids fixed % divergence or gene flow cutoffs) | Stipulated Case 1: A/B have high divergence but function as one lineage; C/D have low divergence but act as two. Fixed cutoffs misclassify. | **(P)** *but critical for accuracy* |
  | **7. Distinguishes Lineage Identity vs. Rank**<br>("Is species X" ≠ "How many species?") | Fossil sequence carving: Identity (e.g., *Homo erectus*) can persist while rank (species vs. chronosubspecies) changes. Monitoring needs consistent *ranked units*, not fluid identities. | **(N)** |

  ---

  ### **Tensions & Conflicts**
  #### **Jointly Unsatisfiable Requirements**
  - **Stability vs. Scientific Currency:**  
    **Conflict:** (2) demands fixed units for monitoring, but new genomic/ecological data (e.g., discovering A/B’s high divergence) may necessitate reclassification. **Resolution impossible** without decoupling monitoring units from taxonomic units.  
  - **Non-Arbitrariness vs. Operational Simplicity:**  
    **Conflict:** (3) requires objective criteria, but no concept avoids thresholds (e.g., "significant" divergence). Stipulated Case 1 forces a choice between gene flow (fails C/D) or divergence (fails A/B). **Trade-off unavoidable.**  

  #### **Distinctions That Must Not Collapse**
  - **Lineage Identity = Same Species As:** Defines legal protection scope (e.g., if population X is *Panthera tigris*, it’s protected).  
  - **Lineage Rank = Species Status:** Determines *how many* units exist for monitoring.  
    **Why:** Hybrid zones may blur "same species" (identity) but still count as one unit (rank) for trends.  

  ---

  ### **Test Case Handling**
  | Case | Requirement Tension | Resolution Path |
  |------|---------------------|----------------|
  | **Stipulated Case 1 (Genomic vs. Gene Flow)** | (3) Non-Arbitrariness vs. (6) Threshold Agnosticism | **Hybrid concept:** Lineage separation requires *both* divergence *and* isolation. A/B: One lineage (gene flow overrides divergence). C/D: Two lineages (isolation overrides low divergence). |
  | **Stipulated Case 2 (Mobile Elements)** | (4) Lineage-Based vs. Ecological Relevance | **Split units:** Core genome = protected lineage; mobile element = functional trait for habitat management (not species status). |
  | **Fossil Sequence** | (2) Stability vs. Scientific Currency | **Designate chronospecies via gaps:** Use major morphological shifts only. Once defined, retain units for monitoring even if new fossils blur boundaries. |
  | **Ring Species/Hybrid Zones** | (1) Actionable Boundaries | **Regulate as single species:** Hybridizing ends are "same lineage" (identity) despite intermediates. One unit for monitoring (rank). |

  ---

  ### **Which Requirement Knocks Out Popular Concepts?**
  - **Requirement (4) Lineage-Based** eliminates:  
    - **Ecological Species Concept** (niche-focused → fails mobile elements).  
    - **Biological Species Concept** (reproductive isolation → fails asexuals, C/D).  
  - **Requirement (6) Threshold Agnosticism** eliminates:  
    - **Phylogenetic Species Concept** (fixed divergence % → fails A/B).  

  ---

  ### **The Unavoidable Compromise**
  **The core conflict:** Law demands binary, stable units (species as "atoms"), but biology offers dynamic continua. **Resolution requires:**  
  1. **Decouple monitoring from taxonomy:** Use "operational conservation units" (OCUs) for trends, locked at first listing.  
  2. **For protection:** Adopt a **lineage-based concept** (e.g., *General Lineage Concept*: species = segments of metapopulations evolving independently).  
     - **Strengths:** Handles non-standard reproduction (5), avoids traits (4), lineage identity clear (7).  
     - **Weaknesses:** Still needs thresholds for independence (6); OCUs mask scientific updates.  

  **Final Framework:**  
  - **Protection:** Lineage identity (based on divergence + isolation + persistence).  
  - **Monitoring:** Fixed OCUs derived from lineages at time of listing.  
  - **Non-standard cases:** Lineage = core genome (microbes), OCUs = morphotypes (fossils).  

  This satisfies regulation but sacrifices real-time scientific accuracy for stability.
