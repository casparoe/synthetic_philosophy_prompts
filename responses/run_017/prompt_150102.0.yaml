answer: |-
  ### Brainstorm Notes
  **(a) von Neumann's core commitment:**  
  - The brain is a *functionally computational system*: its operations can be abstractly described via logical operations on discrete symbols (bits), decoupled from biological wetware.  
  - **Load-bearing claim:** Neural processes are *isomorphic* to formal computations—they manipulate informational states via causal/physical processes that map onto algorithmic steps. Vacuum tubes/reliability talk is period-specific implementation chatter.  
  - **Key implication:** Neuroscience can be reduced to finding "the program" (formal rules transforming inputs → outputs).  

  **(b) Strongest "no it isn't" (sans Penrose/microtubules):**  
  - **Evolutionary/biological primacy:** The brain is an *organ*, not an abstract machine. Its "processing" is context-dependent electrochemical dynamics shaped by evolution for survival—*not* executing context-free symbol manipulation.  
  - **No fixed architecture:** Unlike Turing machines/von Neumann architectures, the brain lacks stable memory-addressing, unambiguous state transitions, or separable hardware/software. Computations require these to define "the algorithm."  
  - **Chinese Room prelude:** If you can't point to a *specific, privileged* formal description being executed (due to biological messiness), calling it "computation" is just a metaphor with no explanatory power.  

  **(c) Your idea's viability:**  
  - **"No compilation" is sharp but needs tightening:** You’re channeling *multiple realizability* + *underdetermination*. Yes: without a designer/compiler, no unique "program" exists—only behaviorally equivalent descriptions.  
  - **Arnie’s late position aligns:** He’s rejecting *algorithmic primacy*—neuroscience explains via mechanisms (e.g., synaptic plasticity), not by "reverse-engineering code." Computational talk is heuristic, not ontological.  
  - **Not a dud; refine the spine:** Focus on *"When is the computational metaphor useful vs. misleading in neuroscience?"* This honors Arnie’s journey and avoids slogan wars.  

  ---

  ### The Tribute Speech (850 words)  

  Arnie, forty years ago, if I’d stood between you and an oscilloscope during one of your legendary lab rants about neural "algorithms," I’d have been politely vaporized by sheer conviction. Back then, you were the Moses of computational neuroscience—parting the Red Sea of spike trains to reveal the promised land of information processing. You’d thunder: *"Find the algorithm! The brain is a machine that computes!"* And honestly? It was thrilling. It gave us a language to crack open the skull’s black box.  

  But then something fascinating happened. You—the high priest of the computational metaphor—started whispering heresies. *"Maybe it’s not a digital computer... maybe the slogan’s done more harm than good..."* I’ll admit, my first reaction was: *Has Arnie been replaced by a philosophical pod person?* But that’s Arnie Breslow: relentless, intellectually honest, and never satisfied with easy answers.  

  So let’s talk about why this matters. Not to re-fight old wars, but to honor what that journey *means*.  

  It starts with von Neumann—that titan who helped birth the digital age. Staring down the brain in his final years, he called it a "computing machine." Now, forget vacuum tubes or reliability stats; that’s just 1950s window dressing. His core idea was profound: *what the brain does*—recognizing a face, solving a puzzle—isn’t magic. It’s a logical, step-by-step manipulation of information. Find those steps, and you’ve found the brain’s "program."  

  **But here’s where my inner experimental physicist twitches.** I spent decades chasing precision—squeezing one more significant figure out of a measurement. So when von Neumann shrugs that the brain calculates with "two or three digits of precision" and still outshines our best silicon, I want to shout: *How?!* If my kit worked like that, I’d be selling pencils on the street!  

  Which brings me to Arnie’s late-career epiphany. Because here’s the rub: a computer isn’t just *doing* computations—it’s *designed* to execute a specific program. Someone wrote code; a compiler translated it; hardware runs it. But evolution? It doesn’t "compile." It tinkers, jury-rigs, repurposes. So when we describe a neural circuit as "computing" something—say, edge detection in vision—are we revealing its *essence*? Or just imposing a convenient metaphor?  

  *(To the clinicians and Buffalo crew: think of it like describing a heart as a "pump." Useful? Absolutely. But if you only talk pumps, you’ll miss why a real heart murmurs or fails. The poetry’s in the flesh.)*  

  Arnie’s brilliance was realizing neuroscience hit a fork in the road. **Option 1:** Dig for *the* algorithm—the "program" the brain is running. **Option 2:** Explain how wet, messy biology *actually works*—ions flowing, synapses shouting, networks adapting—and let the "computation" emerge as a shorthand, not a revelation.  

  His verdict? Option 2. Why? Because brains aren’t desktops running Photoshop™. They’re more like... a billion chefs in a kitchen, tossing ingredients, tweaking recipes in real-time, with no head chef. You might *describe* the meal as "algorithmic," but the truth is in the chaos.  

  Now—full disclosure—I lean harder than Arnie on the "it’s *just* a metaphor" side. **I concede this:** without computational thinking, we’d still be stuck calling synapses "gaps where spirits jump." It gave us tools to ask better questions. But Arnie’s right: when we mistake the map for the territory, we get lost. If you demand every neuron must be a "logic gate," you’ll miss the glorious, inefficient, analog mess that actually *is* the brain.  

  So where does that leave us? With a question I hope Arnie will wrestle with in his reply: **Does neuroscience *need* "the program" to explain minds?** Or can we explain everything that matters by staying knee-deep in the biological soup, letting computation be a practical lie—like saying "sunrise" when we know the Earth turned?  

  Arnie—you taught us to think deeper. You showed us when to embrace a paradigm, and when to evolve past it. That’s not contradiction; it’s wisdom. You’ve spent 40 years proving the brain is more fascinating than any machine. And tonight, we prove something simpler: you’re one hell of a friend. To Arnie!  

  *(Raises glass)*  

  ---  

  ### Confidence Note (150 words)  

  **Confidence level:** High on the philosophical framing; moderate on von Neumann exegesis.  

  - **Strongest claims:** The distinction between von Neumann's *functionalist commitment* (brain ≈ abstract computer) vs. period-specific hardware talk is well-supported by his texts. Your "no compilation" argument is a valid extension of *multiple realizability* (Putnam) and critiques of *computational individuation* (e.g., Piccinini). Arnie’s shift aligns with modern *mechanistic* neuroscience (Craver, Bechtel).  
  - **Weakest link:** **Von Neumann’s actual view.** He *was* flirting with analog/neural net ideas late in life. I’m confident he held the core functionalism described, but he might’ve granted more nuance than my paraphrase implies. Your "precision" gripe stands—it’s his rhetorical shrug, not a technical argument.  
  - **"No compilation" lethality:** It’s potent against *strong computationalism* (the brain *is* a program), but less so against *moderate* views (computation as *one valid perspective*). Your spin—"does neuroscience *need* it?"—is the killer question. I’m 90% sure it’s the right pivot for Arnie’s legacy.  

  **Action:** Use this; it’s warm, substantive, and lands your dissent as respect. Trim physics tangents if pressed for time.
