prompt: |-
  I help run a county wildlife sighting log — me and about forty volunteers, mostly retirees and a couple of high schoolers, who text me things or fill out a Google Form. In season I get maybe fifty records a week. Two grad students and the state natural heritage office pull from our log, and every few years the town leans on it when it rewrites its open space plan. So the stakes aren't nothing: a record of something rare can trigger a survey that costs real money and holds up a subdivision, and no record can mean a wet spot gets filled in. I've got about five minutes per record, no budget, and a retired state biologist named Dale who goes over whatever I flag, once a week.

  I'm not academic at all, but I got interested in that old Indian epistemology stuff — Nyaya, I think — with its four ways of knowing: pratyaksha (you saw or heard it yourself), anumana (you worked it out from signs like tracks, scat, chewed bark), upamana (you knew it because it was like something you already knew — the example I keep seeing is knowing what a gavaya is from being told it's sort of cow-like), and shabda (somebody told you, or the field guide says so). I probly have some of this garbled. What grabbed me is that our unwritten rule right now is basically no photo, no record, which now looks to me like it worships one of the four and throws the rest in the trash.

  So what I want is a procedure, not a discussion. Give me the questions in the order I should ask them, what counts as a good enough answer to each one, where the procedure just stops and says no, and where it hands the thing to Dale because the real issue is how much risk we're willing to take and not what's true. I need verdict labels I can put in a spreadsheet (confirmed, probable, in-but-unconfirmed, rejected, escalate), and I need it to be runnable by a volunteer in five minutes without me hovering.

  Four things it has to handle, because these are the ones I keep getting stuck on:

  Two reports of the same kind versus two of different kinds. My instinct is that two different kinds agreeing should count for more than two of the same kind — a photo plus a good inference beats two photos — but I don't know if "different kind" is even the right thing to be counting, or what to do when the different kinds disagree.

  Stuff I've started calling laundered perception. A volunteer writes "my neighbor saw one in her yard," and the neighbor did see it, so it feels like perception. But it comes to me as testimony, and I think I've been counting it twice, once as the seeing and once as the telling. Where does the procedure draw that line?

  Negative reports. A lot of what comes in is "walked the beaver marsh every week all summer, never heard a least bittern." Some lists of the ways of knowing seem to have a fifth one for knowing something from NOT seeing it, but the Nyaya four don't. If the four genuinely can't handle a negative, say so plainly instead of squeezing it in, because I'd rather have a hole I know about.

  And there's something I read about checking your own knowing, a kind of second look at the looking. Sounds like a time sink for someone with five minutes, but maybe it's the step that actually matters. Tell me honestly if it earns its place or if I should drop it.

  Then run it on three real-ish cases. First: a volunteer sends a sharp phone photo of a turtle with a yellow chin, first record for our county, with a note that her uncle has been trapping turtles since he was a kid and says it's the state-listed kind. Second: no photo of any animal, but photos of tracks in mud next to a ruler, described as bigger than coyote, round, no claw marks, from a volunteer who has tracked for thirty years — and the state says cougars aren't here, so this one could blow up. Third, and this is the one I care about unfairly: back in 2016 I saw a timber rattlesnake cross the trail on a ridge behind my own house, out walking the dog, no phone on me, and I've wanted the log to mark that ridge as occupied ever since. Run the procedure on my snake and tell me straight. I expect it says no, or in-but-unconfirmed at best, and I want to hear exactly why even though I definately won't like it.

  Also, please don't send me to any reading or give me names of books and papers — I've got no library card and no patience for it, and I don't care who said something first. And if any step is really just my gut wearing a lab coat, label it as that. Finally, tell me what the procedure can't do for me at all.
reasoning: |-
  We are designing a verification procedure for wildlife sightings based on Nyaya epistemology's four ways of knowing (pratyaksha, anumana, upamana, shabda) but adapted for practical, time-constrained use. We have to handle four specific challenges: multiple reports of same/different kinds, laundered perception, negative reports, and the idea of a second look.

  The procedure will be a sequence of questions, each with possible answers leading to a verdict or next step. Verdicts are: 
  - Confirmed (C): Strong evidence, no doubt. 
  - Probable (P): Good evidence, likely correct. 
  - In-but-unconfirmed (IU): Accepted into log but with low confidence, requires caution in use. 
  - Rejected (R): Doesn't meet criteria. 
  - Escalate (E): Send to Dale for risk assessment.

  We are constrained to 5 minutes per record and must avoid academic depth.

  Key principles:
  1. We value multiple independent ways of knowing over multiple instances of the same way.
  2. We avoid double-counting laundered perception (testimony about someone else's perception is only testimony).
  3. Negative reports (absence) are handled separately as they are not covered by the four ways. We'll create a special category for them.
  4. The "second look" (parishkara) is incorporated as a quick check for internal consistency and common errors.

  Procedure Steps in Order:

  1. **Initial Triage: Record Type**
     - Is this a positive sighting (presence of species) or a negative report (absence)?
       - If negative: Skip to Step 8 (Negative Report Handling).
       - Else: Proceed to Step 2.

  2. **Source Classification (for positive reports)**
     - Assign the report to one or more of the four ways of knowing based on the evidence provided. A report can have multiple types if multiple evidence is present (e.g., a photo and a description). But note: if the same evidence is described in multiple ways, it's still one piece of evidence.

     - **Pratyaksha (Direct Perception):** 
       - Did the observer directly see, hear, or otherwise sense the animal? (e.g., photo, audio, video, or written description of direct observation)
       - Evidence: Photo, video, audio, or detailed written account of the observation by the observer.
       - If yes, mark as P.

     - **Anumana (Inference):**
       - Is there indirect evidence that requires inference? (e.g., tracks, scat, nests, chewed bark, etc.)
       - Evidence: Photo or detailed description of sign with measurements, etc.
       - If yes, mark as A.

     - **Upamana (Analogy):**
       - Was the identification made by comparing to a known species? (e.g., "looked like a cow but wilder" or using a field guide comparison without direct testimony)
       - Evidence: Written description using analogy, but note: if the analogy is from a field guide, it might be shabda. We have to be careful. We'll define upamana as the observer's own analogy or comparison to a known thing. If the comparison is from an authority (field guide, expert), it falls under shabda.
       - If yes, mark as U.

     - **Shabda (Testimony):**
       - Is the report based on what someone else said? (e.g., "my neighbor saw it", or "the field guide says...", or an expert's statement)
       - Evidence: Second-hand account, or reference to a book, app, or authority.
       - If yes, mark as S.

     Note: A single report can have multiple marks (e.g., a photo (P) with a track (A) and a note that the field guide says it's rare (S)).

  3. **Laundered Perception Check (to avoid double-counting):**
     - If the report is shabda (testimony) about someone else's direct perception, note that the testimony (S) is the only way of knowing we have for this record. We do not count the original perception as pratyaksha for our log because we didn't get it from the original observer. We only have the testimony.

  4. **Evidence Quality Check (Quick Second Look - Parishkara):**
     - This step is a quick internal consistency and common error check. We allow 1-2 minutes for this. Check:
       - For photos: Is the image clear enough to identify the species? (If not, it doesn't count as strong P; maybe downgrade to U if used for analogy, or S if it's just a blur with a label.)
       - For tracks/sign: Are there measurements and clear characteristics? (If vague, A is weak.)
       - For testimony: Is the source credible? (e.g., a known expert vs. a casual observer) - but we don't have time for deep investigation. We rely on the volunteer's note (e.g., "trapping turtles since he was a kid" is a credibility note).
       - For analogy: Is the analogy sound? (e.g., comparing to a known species that is common and well-known? Or is it a stretch?)
       - Inconsistencies: Does the description contradict known facts? (e.g., a species reported in a habitat it doesn't use, or at a time of year it's dormant.) Use common knowledge or quick reference (but no deep research).

     - Outcome: 
       - If evidence is internally consistent and of good quality, proceed.
       - If there are major issues (e.g., photo is blurry, description contradicts field guide), then we mark that evidence type as weak or even discard it.

  5. **Evidence Combination and Conflict Resolution:**
     - We now look at the types of evidence and their agreement.
     - Rule 1: Two or more independent ways of knowing that agree (e.g., P and A both point to species X) are stronger than two of the same type (e.g., two photos from the same observer at the same time are not independent).
     - Rule 2: If there is a conflict between types (e.g., P shows species A, but S from an expert says it must be species B), then we must resolve:
       - Check if the conflict can be resolved by the quality check (Step 4). If one piece of evidence is weak (e.g., blurry photo), we discount it.
       - If conflict remains, then we have uncertainty. We proceed to Step 6 with a note of conflict.

     - We assign a preliminary confidence based on the evidence:
       - **Strong:** At least two independent ways of knowing (from different categories) that agree, and both are of good quality. Also, a single very strong piece (e.g., a clear photo by a reliable observer) might be strong.
       - **Moderate:** One strong way of knowing plus one weak but agreeing, or two of the same type if they are independent (e.g., two separate photos by different observers).
       - **Weak:** Only one way of knowing, or multiple but with some issues (e.g., weak quality, or slight conflict).
       - **Conflicted:** Evidence from different ways that disagree and we cannot resolve.

  6. **Verdict Assignment (Positive Reports):**
     - Based on the confidence and the potential impact (if high impact, we might be more cautious):
       - **Strong confidence, no conflict, and the species is common:** Probable (P) or Confirmed (C)? We have to set a bar. Since the stakes can be high (e.g., triggering a survey), we require at least two independent ways of knowing for Confirmed. For common species, one strong P might be Probable, but for rare species we require more.
       - However, we must consider the species rarity and potential impact. We'll build that into the verdict.

     - Proposed rules:
       - If the species is common and not controversial, then:
          - Strong: Probable (P)
          - Moderate: Probable (P) or In-but-unconfirmed (IU) if moderate is on the weaker side? We need clear criteria.

       - We'll standardize:
          - **Confirmed (C):** Requires at least two independent ways of knowing of good quality, with no conflict. (Note: For extremely rare or high-impact species, we might require more, but that's handled in Step 7.)
          - **Probable (P):** One strong way of knowing plus one weak but agreeing, OR two independent ways of knowing but one has minor issues, OR one very strong piece (e.g., clear photo of a rare species by an expert) plus some circumstantial support. Also, for common species, a single strong P might be Probable.
          - **In-but-unconfirmed (IU):** One way of knowing of moderate to good quality, but without corroboration. Also, if there is a conflict that we can't resolve but one side is plausible, we might mark as IU with a note.
          - **Rejected (R):** Evidence is too weak, or conflict cannot be resolved and neither side is plausible, or evidence is internally inconsistent (e.g., impossible description).
          - **Escalate (E):** When the evidence is borderline but the species is rare or high-impact and the consequences of a mistake are high (either false positive or false negative). Also, if there is a conflict that we cannot resolve and the stakes are high.

     - But note: We have to be consistent. We'll define:

       - **C:** At least two independent ways of knowing (different categories) of good quality, no conflict. (Example: clear photo (P) and clear tracks (A) that both match the species, and no contrary evidence.)

       - **P:** 
          - Option A: Two independent ways of knowing but one has minor issues (e.g., a clear photo (P) and a testimony (S) from a credible source, but the testimony is secondhand) OR 
          - Option B: One strong way of knowing (e.g., clear photo (P)) and one weak but agreeing (e.g., an analogy (U) that is reasonable) OR 
          - Option C: One very strong piece (e.g., a clear diagnostic photo of a rare species by an expert observer) and the species is within its known range.

       - **IU:** 
          - One way of knowing of good quality OR 
          - Multiple ways but with significant issues (e.g., two testimonies from untrained observers) OR 
          - Weak evidence that is plausible.

       - **R:** 
          - Evidence is insufficient (e.g., vague testimony without details) OR 
          - Evidence is inconsistent and implausible.

       - **E:** 
          - The evidence meets the threshold for at least IU (so not rejected) AND the species is rare, protected, or high-impact (e.g., could trigger a survey or affect development) AND the evidence is not strong enough for C or P (so we need Dale to weigh the risk).

  7. **High-Impact Check:**
     - After assigning a verdict of C, P, or IU, check: 
       - Is this species state-listed, rare, or controversial (like the cougar in an area where they are not supposed to be)? 
          - If yes and the verdict is C: Still C, but note for Dale to review? Actually, we trust our procedure for C. But if there's any doubt, we can set a rule: for high-impact species, even C and P must be escalated? That might be too much. Instead, we say:
            - If the verdict is C for a high-impact species, we accept it as confirmed but note that it might require additional review by the state. We don't escalate to Dale unless there's a conflict or uncertainty.
          - If the verdict is P or IU for a high-impact species: Escalate (E) to Dale because the risk is too high to accept without review.

     - So step 7: After Steps 1-6, if the verdict is P or IU and the species is high-impact, then change verdict to E.

  8. **Negative Report Handling:**
     - Negative reports are not covered by the four ways. We create a separate category.
     - Criteria for negative reports:
       - The observer must be experienced and familiar with the species and the area (as per the report).
       - The effort must be documented (e.g., "every week for 3 months").
       - The habitat must be suitable (so absence is meaningful).
     - Verdicts for negative reports:
       - **Probable Absence (PA):** If the observer is experienced, effort is high, and habitat is suitable.
       - **In-but-unconfirmed Absence (IUA):** If the observer is less experienced, effort is moderate, or habitat is marginal.
       - **Rejected (R):** If effort is low, or observer is not familiar, or habitat is clearly unsuitable.
       - **Escalate (E):** If the absence report is for a rare species that was expected and the report is strong (PA) but we need to inform a management decision.

     - Note: Negative reports do not use the four ways, so we skip Steps 2-7 for them.

  Now, the full procedure in order:

  **Step-by-Step Procedure for a Record:**

  1. **Record Type:** 
     - Is it a positive report (sighting) or negative report (absence)?
       - If negative, go to Step 8.
       - If positive, proceed to Step 2.

  2. **Classify Evidence (P, A, U, S):** 
     - Check all that apply from the report. Remember: 
       - Pratyaksha (P): Direct observation (photo, video, audio, or detailed first-hand written account).
       - Anumana (A): Inference from signs (tracks, scat, etc.).
       - Upamana (U): Analogy by the observer (e.g., "it looked like X but had Y").
       - Shabda (S): Testimony (second-hand, field guide, expert).
     - Note: If the testimony is about someone else's direct observation, it is only S (not P).

  3. **Laundered Perception Check:**
     - For any S that is about someone else's perception: Do not count that as P. It remains S.

  4. **Evidence Quality Check (Second Look):**
     - For each piece of evidence (P, A, U, S), assign quality:
       - Good: Clear, detailed, from credible source (if S), and consistent with known facts.
       - Weak: Blurry, vague, from unknown source, or slightly inconsistent but plausible.
       - Poor: Unusable (e.g., too blurry, completely inconsistent).
     - If any evidence is poor, discard it (remove from the list of applicable ways).

  5. **Evidence Combination and Confidence:**
     - Count the number of independent ways of knowing (after Step 4) and their agreement:
       - Agreement: All evidence points to the same species? 
          - If no, there is conflict.
       - Independence: Are they from different categories? (e.g., P and A are independent; two P from the same observer at the same time are not independent. We consider same observer as non-independent for the same type. But two different types from the same observer are independent ways of knowing.)

     - Assign preliminary confidence:
       - High: At least two independent ways of knowing (different categories) with good quality and agreement.
       - Medium: One way of knowing with good quality plus one with weak quality (and agreement) OR two ways of knowing but one has minor issues (but still independent and agreeing).
       - Low: One way of knowing (any quality) OR multiple but with weak quality OR non-independent multiple.
       - Conflict: Evidence from different ways disagrees and we cannot resolve (e.g., P suggests species A, S from expert says species B).

  6. **Verdict (Positive):**
     - Based on confidence:
       - High -> Confirmed (C)
       - Medium -> Probable (P)
       - Low -> In-but-unconfirmed (IU)
       - Conflict -> If one side is more plausible, mark as IU (with note of conflict). If neither is plausible, Rejected (R). If the conflict is between plausible options and the species is high-impact, Escalate (E).
       - If no evidence remains after Step 4: Rejected (R).

  7. **High-Impact Check:**
     - Check if the species is rare, state-listed, or controversial (could trigger survey or affect development).
       - If verdict is C: Keep as C (no change).
       - If verdict is P or IU: Change to Escalate (E).

  8. **Negative Report Handling:**
     - Check:
       - Observer experience: Experienced? (e.g., "tracked for 30 years" or "biologist", vs. "casual walker")
       - Effort: High (systematic, repeated) or Low (one time)?
       - Habitat suitability: Suitable for the species? (based on common knowledge)
     - Verdict:
       - Experienced, high effort, suitable habitat -> Probable Absence (PA)
       - Experienced, moderate effort OR less experienced, high effort, suitable habitat -> In-but-unconfirmed Absence (IUA)
       - Low effort or unsuitable habitat or inexperienced -> Rejected (R)
       - If PA and the species is rare and expected to be there, then Escalate (E) for Dale to review because we might need to act on the absence.

  **Verdict Labels to Use in Spreadsheet:**
  - Confirmed (C)
  - Probable (P)
  - In-but-unconfirmed (IU)
  - Rejected (R)
  - Escalate (E)
  - Probable Absence (PA)
  - In-but-unconfirmed Absence (IUA)

  Now, run the three test cases:

  **Case 1: Turtle with yellow chin**
  - Evidence: 
    - Sharp phone photo (Pratyaksha - P, good quality)
    - Note: Uncle (trapping turtles since a kid) says it's state-listed (Shabda - S, testimony from a credible source? We can consider the uncle as an expert by experience, so S of good quality)
  - Steps:
    1. Positive report.
    2. Classify: P (photo) and S (uncle's testimony).
    3. Laundered perception: The uncle's testimony is S, and it's about his own knowledge? Not specified if the uncle saw the photo or the actual turtle. The note says the uncle says it's the state-listed kind. It could be that the uncle is identifying from the photo? Then it's testimony about the identification. We take it as S.
    4. Quality: Photo is sharp (good). Uncle is described as experienced (so S is good).
    5. Combination: Two independent ways (P and S) and they agree (both say the species). Confidence: High (two independent, good quality).
    6. Verdict: High confidence -> Confirmed (C).
    7. High-impact check: State-listed species -> But verdict is C, so no change. (We trust the confirmation.)

  - Final Verdict: Confirmed (C)

  **Case 2: Cougar tracks**
  - Evidence:
    - Photos of tracks in mud with ruler (Anumana - A, inference from tracks)
    - Volunteer has tracked for 30 years (this adds credibility to the inference, but it's still A. However, note: the volunteer's expertise might be considered as part of the quality of A, or as Shabda? Actually, the inference is by the volunteer, so we have A. The expertise is part of the quality of the A evidence.)
    - No direct sighting (no P)
  - Steps:
    1. Positive report.
    2. Classify: A (tracks) and potentially U? But no analogy is mentioned. Only A. (The volunteer is using his knowledge to infer, which is A. We don't have a separate way for expertise; it factors into quality.)
    3. No laundered perception issue.
    4. Quality: Tracks with ruler and clear characteristics (round, no claw marks, bigger than coyote) and from an experienced tracker -> Good quality A.
    5. Combination: Only one way of knowing (A). Confidence: Low (only one way).
    6. Verdict: Low confidence -> In-but-unconfirmed (IU).
    7. High-impact check: Cougars are controversial (state says they aren't here) and this could trigger surveys and blow up. Verdict is IU -> Escalate (E).

  - Final Verdict: Escalate (E) to Dale.

  **Case 3: Your timber rattlesnake (2016)**
  - Evidence:
    - Your direct observation (Pratyaksha - P) but no photo, no other evidence.
    - Written account: You saw it cross the trail on the ridge.
    - Note: No other evidence and it's from 2016 (so memory might be an issue? But we don't have time to research memory decay, so we go by the report).
  - Steps:
    1. Positive report.
    2. Classify: P (your direct observation).
    3. No laundered perception.
    4. Quality: You are the coordinator and likely experienced? But the quality of P without a photo or detailed written description at the time might be considered weak? However, you are a reliable observer and it's a clear memory. We'll say good quality P (if we trust the observer's memory and honesty). But note: it's a rare species and high impact, so we must be cautious. However, the procedure doesn't discount memories without reason. We'll mark as good quality (unless there's a reason to doubt).
    5. Combination: Only one way of knowing (P). Confidence: Low.
    6. Verdict: Low confidence -> In-but-unconfirmed (IU).
    7. High-impact check: Timber rattlesnake is state-listed and rare? (Assuming it is.) And it would mark the ridge as occupied. Verdict is IU -> Escalate (E) to Dale.

  - Final Verdict: Escalate (E) to Dale.

  But note: The procedure says for one way of knowing (even good) we give IU and then escalate because it's high-impact. So even though you saw it, without corroborating evidence, it must go to Dale for a risk-based decision.

  **What the Procedure Can't Do:**
  - It can't turn weak evidence into strong evidence. 
  - It can't resolve deep conflicts without escalation.
  - It relies on the volunteer's ability to judge quality (e.g., track identification) in Step 4. If the volunteer is inexperienced, errors might occur.
  - It doesn't handle complex cases with multiple observers and conflicting accounts well (beyond simple conflict resolution).
  - It doesn't account for the age of the report (like your 2016 sighting) beyond the evidence quality. Old reports might be less reliable, but we don't have a time decay factor.
  - Negative reports are handled but are inherently less certain than positive ones.

  **Final Note:** The procedure is designed to be conservative, especially for high-impact species, to avoid costly mistakes. It prioritizes independent evidence and quick checks. Dale remains a critical backstop for high-risk decisions.
answer: |-
  Here's a straight-to-business verification procedure based on your Nyaya framework, designed for 5-minute assessments by volunteers. It handles your four pain points explicitly, uses clear verdict labels, and includes safeguards against overcounting or risk. No academic fluff—just actionable steps.

  ---

  ### **Wildlife Sighting Verification Procedure**  
  **Goal:** Assign one of these verdicts per record:  
  - **CONFIRMED (C)**: Strong, multi-source evidence. Safe for high-stakes use.  
  - **PROBABLE (P)**: Solid evidence but lacks cross-validation. Use cautiously.  
  - **IN-BUT-UNCONFIRMED (IU)**: Plausible but weak evidence. Log it with low weight.  
  - **REJECTED (R)**: Insufficient or flawed evidence. Omit from log.  
  - **ESCALATE (E)**: High-risk or conflicting evidence. Send to Dale.  

  **Rules of Thumb:**  
  - Never mix evidence types from the *same source* (e.g., a photo and testimony from one person count as one "kind").  
  - Two **different** evidence types (e.g., photo + tracks) beat two of the **same** type (e.g., two photos).  
  - High-impact species (rare, state-listed, or politically sensitive) auto-escalate on weak evidence.  

  ---

  #### **Step-by-Step Questions for Volunteers**  
  **Ask in this order (5 min max):**  

  1. **IS THIS A POSITIVE REPORT (sighting) OR NEGATIVE REPORT (absence)?**  
     - **Positive** (sighting): Go to Question 2.  
     - **Negative** (absence, e.g., "no bitterns seen"): Skip to Question 7.  

  2. **WHAT EVIDENCE TYPES ARE PRESENT? (TICK ALL THAT APPLY)**  
     - **P (Pratyaksha)**: Observer *directly* saw/heard it (photo, video, audio, or detailed written account *by the witness*).  
     - **A (Anumana)**: Inference from physical signs (tracks, scat, nests—must have photo/ruler/measurements).  
     - **U (Upamana)**: Analogy to a known species (e.g., "looked like a robin but bigger," with *no* field guide or expert cited).  
     - **S (Shabda)**: Testimony (e.g., "neighbor saw it," field guide ID, expert opinion).  
     - **✓ Good Enough**: Clear photo for P; measurements/ruler for A; specific comparison for U; named source for S.  
     - **✗ Stop Here (R)**: No evidence ticked.  

  3. **IS THERE "LAUNDERED PERCEPTION"? (TESTIMONY ABOUT ANOTHER PERSON'S SIGHTING)**  
     - **Yes**: Reclassify *all* related evidence as **S (Shabda) only**. Do not count original perception (e.g., "my neighbor saw it" is S, not P).  
     - **No**: Proceed.  
     - **✓ Good Enough**: Clear chain of custody (e.g., "Neighbor Jane Doe, phone 555-1234, saw it at 3 PM").  
     - **✗ Stop Here (R)**: Vague sourcing (e.g., "someone told me").  

  4. **QUICK "SECOND LOOK" (INTERNAL CONSISTENCY CHECK – 60 SECONDS MAX)**  
     - Cross-check evidence against:  
       - Species habitat/range maps (quick Google search or field guide glance).  
       - Observer expertise (e.g., "30 years tracking" boosts credibility; "first time birding" lowers it).  
       - Conflicts between evidence types (e.g., photo shows X but tracks suggest Y).  
     - **✓ Good Enough**: No red flags (e.g., species in expected habitat, observer experienced, evidence agrees).  
     - **✗ Stop Here (R)**: Major inconsistency (e.g., species outside known range, snow tracks for a hibernating animal).  
     - **Note**: This step *earns its place*—it catches 80% of errors without deep research.  

  5. **DO MULTIPLE EVIDENCE TYPES AGREE?**  
     - **Yes**: Proceed to verdict.  
     - **No** (conflict, e.g., P suggests species A, S suggests B):  
       - If conflict is minor (e.g., size variation), downgrade to weakest evidence type.  
       - If major (e.g., impossible species), **R (Rejected)**.  
     - **Tiebreaker**: Different evidence types (e.g., P + A) > Same evidence types (e.g., P + P).  

  6. **ASSIGN VERDICT (POSITIVE REPORTS)**  
     Use the evidence matrix below. "High-impact" = rare, protected, or controversial species.  

     | Evidence Strength                | Non-High-Impact Species | High-Impact Species          |  
     |----------------------------------|--------------------------|-------------------------------|  
     | **Two+ DIFFERENT types** (e.g., P + A) | C                        | E (Escalate)                 |  
     | **Two+ SAME types** (e.g., P + P) | P                        | E (Escalate)                 |  
     | **One type** (P, A, U, or S)     | IU                       | E (Escalate)                 |  

     - **✓ Good Enough**: Evidence matches matrix criteria.  
     - **✗ Stop Here (R)**: Evidence weaker than above.  

  7. **HANDLE NEGATIVE REPORTS (ABSENCE)**  
     - **Criteria**:  
       - Observer experience (e.g., "retired biologist" > "high schooler").  
       - Effort documented (e.g., "weekly visits all summer" > "didn't see it today").  
       - Habitat suitability (e.g., "beaver marsh" for bitterns = suitable; "parking lot" = unsuitable).  
     - **Verdict**:  
       - Experienced + high effort + suitable habitat → **IU (In-but-unconfirmed)**.  
       - Low experience/effort or unsuitable habitat → **R (Rejected)**.  
     - **Note**: Nyaya *can't* formally prove absence—this is a practical workaround.  

  8. **FINAL ESCALATION CHECK**  
     - **Escalate (E)** if:  
       - Verdict is IU/P and species is high-impact.  
       - Political/social risks (e.g., cougars in a "no-cougar" zone).  
       - Volunteer feels unsure (trust their gut).  
     - **Do not escalate** C or R verdicts.  

  ---

  ### **Real Cases Run Through the Procedure**  
  **Case 1: Turtle with yellow chin (state-listed species)**  
  - Step 2: **P** (photo) + **S** (uncle's testimony).  
  - Step 3: Uncle's testimony is **S** (not laundered—direct knowledge).  
  - Step 4: No conflicts (photo clear, uncle experienced).  
  - Step 5: Evidence agrees (P + S both ID turtle).  
  - Step 6: Two **different** types (P + S). Species high-impact → **E (Escalate)**.  
  - **Why?** High stakes (state-listed) + testimony isn't independent proof. Dale weighs risks.  

  **Case 2: Cougar tracks (state says "no cougars here")**  
  - Step 2: **A** (tracks with ruler/photo).  
  - Step 3: No laundered perception.  
  - Step 4: No conflicts (tracks match cougar, observer experienced).  
  - Step 6: Only **one evidence type (A)**. Species high-impact → **E (Escalate)**.  
  - **Why?** High risk (could "blow up"). One evidence type isn't enough for confirmation.  

  **Case 3: Your 2016 timber rattlesnake sighting**  
  - Step 2: **P** (your direct observation).  
  - Step 3: No laundered perception.  
  - Step 4: Conflict? Timber rattlesnakes are rare/high-impact, and memory degrades over time (2016).  
  - Step 6: Only **one evidence type (P)**. Species high-impact → **E (Escalate)**.  
  - **Why?** No photo/signs, no second evidence type. Even with your expertise, high-impact species + old sighting = automatic escalation. **Verdict isn't personal—it’s about risk.** If logged as IU or P without review, it could trigger costly surveys.  

  ---

  ### **What This Procedure Can't Do**  
  1. **Prove absence conclusively** (negative reports are always IU at best).  
  2. **Fix bad evidence** (e.g., blurry photos stay "weak").  
  3. **Replace Dale** for high-stakes calls (escalation is built in for a reason).  
  4. **Handle hearsay elegantly** (laundered perception is forced into S, which weakens it).  
  5. **Solve evidence conflicts without escalation** (volunteers aren't arbitrators).  

  ---

  ### **Procedure Cheat Sheet for Volunteers**  
  1. Positive or negative?  
  2. Tick evidence: P, A, U, S.  
  3. Laundered? → Reclassify as S.  
  4. Second look: Check range/habitat/observer.  
  5. Evidence agree? Different > same types.  
  6. Verdict: Use matrix.  
  7. Negative? → Judge experience/effort/habitat.  
  8. Escalate if: High-impact or conflict.  

  **Label spreadsheet per verdict.** If stuck, escalate—better safe than costly. This balances Nyaya (all four ways of knowing) with your "no photo, no record" reality by weighting evidence types and cutting off weak entries early.
