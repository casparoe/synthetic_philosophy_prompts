prompt: |-
  I'm writing from a hospital bed, so let me be brief about the personal part: I'm a final-year PhD candidate in philosophy, and since last spring I have had a treatment-refractory neuropathic pain condition that has not responded to the three medication classes we have tried. My topic is no longer abstract for me. In two weeks I present the third chapter of my dissertation to the Bioethics Center seminar, and I need Q&A preparation, not encouragement.

  The chapter defends a deliberately narrowed version of the abolitionist project sometimes called the hedonistic imperative. Four moves, in order.

  First, a scope restriction. I am not talking about pain, grief, effort, or the ordinary discomfort of a hard project. I restrict the claim to what I call the refractory floor: sustained states that are unresponsive to any available intervention and that globally degrade the subject's capacities.

  Second, the priority claim: when we are choosing among welfare-affecting interventions, raising the floor dominates raising the ceiling. I do not argue this from diminishing marginal welfare; that argument is in the literature and I set it aside. I argue it from what I call the erosion reply: the states at the refractory floor degrade the very capacities on which our standard objections to intervention depend — the capacity to form and revise preferences, to integrate an experience into a narrative, to refuse on reflection, to take up a reason. So the objections available higher up the scale (that the subject must consent, that the suffering is meaning-constitutive for them) are self-undermining exactly where my claim bites.

  Third, a criterion for distinguishing abolition from obliteration, which I call the aim-integrity test: an intervention is admissible only if the agent's standing aims survive it in the counterfactual sense that, under the intervention, the agent would still revise their aims in response to reasons roughly as they would have done had the pain simply been absent. This is meant to be what separates my view from wireheading.

  Fourth, because the erosion reply cuts against ordinary consent-gating, I propose replacing informed consent as the gate for this population with an advance-authorization protocol: the patient authorizes in a lucid period, authorization lapses unless re-affirmed at scheduled windows, and revocation takes effect immediately with no requirement that the patient give a good reason.

  The audience. Two senior scholars from disability studies and medical humanities who hold the social model and are alert to medicalization and to the expressive force of a research program like mine. Three clinicians: a palliative care physician, an interventional pain physician, and an addiction psychiatrist, who think in functional outcomes, iatrogenesis, tolerance, adaptation, and adherence. Two philosophers: a welfare pluralist with narrative-identity sympathies, and someone who works on autonomy and informed consent. A health lawyer chairs. A chronic-pain patient representative from the center's advisory board will be in the room and will be given the first question.

  What I want is the prep sheet I would get from someone who has watched this exact room tear apart a speaker. Ten to twelve objections, most damaging first — rank by damage, meaning how much of the chapter falls if I cannot answer it, not by how likely the question is. Phrase each objection in the idiom of the person raising it: the clinicians should sound like clinicians, the disability scholars like disability scholars, the philosophers like philosophers. Assume I have already dispatched the greatest hits — the experience machine, wireheading, the repugnant conclusion, suffering as a spur to achievement — and do not spend rows on them; I have answers to those and they are in the chapter. Do not give me reading lists or citations; I cannot reach the library from here and I am not going to chase references.

  Deliver the prep sheet as a markdown table with exactly these columns: rank (integer, most damaging first); constituency (which of the groups above); objection_as_they_would_phrase_it (two or three sentences in that person's own idiom); target (which of my four moves it strikes: scope restriction, priority claim, erosion reply, aim-integrity test, advance-authorization protocol); force (integer 1 to 5, how much of the objection is simply right); reply (what I say in about ninety seconds, in my voice, not in yours); soft_spot (where that reply is thinnest and what the follow-up question will be); concession (one of concede_outright, concede_in_part, hold_the_line).

  After the table, a single JSON object with these keys: up_front_concessions (array of strings, what I concede in the first two minutes before anyone attacks); reply_that_must_land (string: the one reply without which the chapter does not survive the hour); hope_nobody_asks (object with keys objection, why_it_is_worst, what_I_say_if_it_comes); objection_that_is_actually_right (object with keys objection, why_it_is_right, what_I_should_do_instead); and cut_from_the_talk (string: the one thing I should drop to make room).

  Be committed rather than even-handed. Tell me plainly which of these objections you think is correct and where you think my erosion reply is confused, and do not soften it into a survey of what someone might say. If you think the chapter's real problem is a move I have not listed, say that too.
reasoning: |-
  We are constructing a prep sheet for a PhD candidate presenting a chapter on a narrowed abolitionist project (hedonistic imperative) for refractory pain conditions. The audience includes disability scholars, clinicians, philosophers, a health lawyer, and a chronic-pain patient representative.

  The chapter has four key moves:
  1. Scope restriction to the "refractory floor": sustained, unresponsive states that globally degrade capacities.
  2. Priority claim: raising the refractory floor dominates raising the ceiling, argued via the "erosion reply" (that refractory pain degrades the capacities needed for standard objections like consent and meaning).
  3. Aim-integrity test: to distinguish abolition from obliteration (intervention must preserve the agent's standing aims in a counterfactual sense).
  4. Advance-authorization protocol: replaces informed consent for this population, with scheduled re-affirmation and immediate revocation.

  We need 10-12 objections, ranked by damage (how much of the chapter falls if unanswered). We are to phrase each objection in the idiom of the constituency (disability scholars, clinicians, philosophers). We skip the "greatest hits" (experience machine, etc.) as the candidate has answers.

  After the table, we provide a JSON object with:
  - up_front_concessions: what to concede at the start
  - reply_that_must_land: the critical reply without which the chapter fails
  - hope_nobody_asks: the worst objection, why, and what to say if it comes
  - objection_that_is_actually_right: which objection is correct, why, and what to do instead
  - cut_from_the_talk: what to drop to make room

  We are committed, not even-handed. We must plainly state if an objection is correct and if the erosion reply is confused.

  Let's structure the objections by constituency and target, ranking by damage.

  Ranking by damage: The most damaging objections are those that undermine the core argument (erosion reply) or the advance-authorization protocol, because without the erosion reply the priority claim fails, and without the protocol the practical implementation fails. The aim-integrity test is also crucial because without it the view collapses into wireheading.

  Potential objections:

  From disability scholars (social model, medicalization concerns):
  - Objection: This entire project medicalizes suffering and ignores the social and environmental factors that create and sustain refractory pain. By focusing on biomedical intervention, you risk diverting resources and attention from societal changes that could prevent or alleviate such pain. (Target: scope restriction and the whole project; if true, the scope is misguided)
  - Objection: Your erosion reply assumes that the degradation of capacities is inherent to the pain condition, but in the social model, such degradation is often a result of barriers and lack of accommodation. Thus, the "refractory" label may be premature without addressing social factors. (Target: erosion reply; if true, the erosion reply is based on a false premise)

  From clinicians (practical, functional outcomes, iatrogenesis):
  - Objection: In clinical practice, we see that even "refractory" pain can sometimes respond to multimodal approaches over time, and what you call the refractory floor is a moving target. Your protocol might lead to premature abandonment of potentially effective treatments. (Target: scope restriction; if true, the scope is not well-defined and interventions might be misapplied)
  - Objection: The advance-authorization protocol is vulnerable to the same erosion of capacities you describe: a patient in a lucid period may not fully grasp the future state, and by the time of re-affirmation, they might be so degraded that they cannot meaningfully revoke. (Target: advance-authorization protocol; if true, the protocol fails to solve the consent problem)

  From the chronic-pain patient representative:
  - Objection: As someone living with chronic pain, I find your framing dehumanizing. You reduce my experience to a "refractory floor" that degrades capacities, but many of us adapt and find meaning even in severe pain. Your erosion reply ignores our resilience and agency. (Target: erosion reply; if true, the core argument is undermined)

  From philosophers:
  - Welfare pluralist/narrative identity: Your aim-integrity test is circular. You say the intervention must preserve the counterfactual capacity to revise aims as if the pain were absent. But if the pain has been present for a long time, it has shaped the person's aims. Removing it might obliterate the narrative self, even by your test. (Target: aim-integrity test; if true, the test fails to distinguish abolition from obliteration)
  - Autonomy/informed consent: Your erosion reply attacks consent, but your advance-authorization protocol relies on a moment of lucidity that may be compromised by the very condition. How can you be sure that the authorization is valid if the pain is already eroding capacities? (Target: advance-authorization protocol and erosion reply; if true, the protocol is not a valid substitute for consent)

  We need 10-12, so let's think of more:

  1. Disability scholar: This project expresses a dangerous ideology that a life with unremitting pain is not worth living, which could lead to pressure on vulnerable patients to accept risky interventions.
  2. Clinician (palliative): Your advance-authorization protocol does not account for the dynamic nature of pain and the possibility of fluctuating capacity. How do you determine the "lucid period" and the re-affirmation intervals?
  3. Clinician (addiction psychiatrist): Interventions that alter pain perception, especially if they involve neuro-modulation or pharmacology, carry risks of addiction, tolerance, and withdrawal that could create new, iatrogenic refractory states. How does your protocol handle these?
  4. Philosopher (autonomy): The erosion reply overgeneralizes. Even in severe pain, some capacities for reason and reflection remain, and it is paternalistic to override consent based on a theoretical degradation.
  5. Philosopher (welfare pluralist): The priority claim ignores that some people might choose to bear refractory pain for the sake of higher goods (e.g., being present for family) and your view would override that.
  6. Health lawyer: The advance-authorization protocol violates current legal standards for informed consent and could expose practitioners to liability, especially if revocation is not properly documented or if the patient's capacity is questioned.
  7. Chronic-pain patient: Your proposal feels like it's designed for a hypothetical patient. In reality, we are not just our pain; we have relationships, identities, and adaptations that your "refractory floor" ignores.

  Ranking by damage:

  1. The objection that the erosion reply is based on a false premise (from disability scholar) is very damaging because if the degradation is not inherent, the whole argument for overriding consent fails.
  2. The circularity in the aim-integrity test (philosopher) because without a clear distinction from obliteration, the view collapses into wireheading.
  3. The advance-authorization protocol being undermined by the same erosion (clinician or philosopher) because then the proposed solution fails.
  4. The objection that the scope is not fixed (clinician) because if refractory is a moving target, the scope restriction is not well-defined and interventions might be harmful.
  5. The dehumanizing framing (patient rep) because it challenges the empirical basis of the erosion reply and the moral standing of the subjects.
  6. The risk of expressing a harmful ideology (disability scholar) because it could undermine the project's acceptability.
  7. The dynamic nature of capacity (clinician) because it shows the protocol is unworkable.
  8. The iatrogenic risks (addiction psychiatrist) because it shows the interventions might worsen the problem.
  9. The overgeneralization of the erosion reply (philosopher) because it questions the necessity of overriding consent.
  10. The priority claim overriding personal choices (philosopher) because it challenges the moral force of the priority claim.

  We'll aim for 10 objections.

  Now, for the JSON:

  - up_front_concessions: Start by conceding that the social model is crucial for understanding and preventing disability, that current interventions have risks and limitations, and that the advance-authorization protocol needs careful legal and clinical safeguards.
  - reply_that_must_land: The erosion reply must be defended — that refractory pain degrades the capacities for consent and meaning-making, so standard objections do not apply at the floor.
  - hope_nobody_asks: The circularity objection to the aim-integrity test because it's hard to answer without being metaphysical. If asked, focus on the functional preservation of the capacity for reason-responsiveness.
  - objection_that_is_actually_right: The one about the social model and degradation being not inherent might be right. Instead, the candidate should condition the application of the view on having first addressed social and environmental factors.
  - cut_from_the_talk: Cut a detailed discussion of the repugnant conclusion or experience machine, since they are dispatched.

  Let's build the table.
