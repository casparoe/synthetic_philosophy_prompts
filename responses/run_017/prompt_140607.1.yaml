prompt: |-
  Writing a short essay on dispositions for a metaphysics seminar and I think I've got the fink/mask distinction muddled. The way I've written it up: a fink is when the thing isn't actually disposed to do the characteristic thing but it would still do it if the trigger happened (my example: a tumbler that isn't fragile at all, but with a tiny charge packed inside that shatters it if you tap it), and a mask is when it does have the disposition but the trigger itself destroys the disposition before its able to show up. On that reading I can't see what the fuss is about: in the first case the conditional comes out true so nothing goes wrong, and in the second the disposition is gone by the time anything would happen, so again nothing goes wrong. Everyone says these cases are what break the simple counterfactual analysis of disposition ascriptions, so clearly I've misread something — but what?

  Two other things while I'm here. The example I actually want in the essay is a mug that is genuinely fragile but that I've sprayed with a coating that stops it breaking when dropped. Which of my two catagories does that go in, or is it a third thing? And I half-remember one of these being dealt with by adding a clause along the lines of 'and the object retains its intrinsic basis throughout', but I can never remember which one, or why that clause doesn't take care of the other.

  If you can, finish with a small table, columns: case | does the object have the disposition (yes / no / contested) | is the plain conditional 'if it were struck, it would break' true | what the added mechanism is doing | the label people standardly use for this case | and what the usual repair to the analysis is.
reasoning: |-
  Okay, the user is writing an essay for a metaphysics seminar and is confused about the fink/mask distinction in dispositions. They've got their definitions mixed up, so I need to clarify that first. 

  Let me start by recalling what I know about finks and masks. Finks involve the disposition disappearing when the trigger occurs, like Lewis's example with the sorcerer and the fragile glass. The sorcerer removes the fragility as soon as the glass is struck, so it doesn't break. That breaks the simple counterfactual because "if struck, it would break" is false even though the glass was fragile. 

  Masks are different. The disposition is still there but something interferes with the manifestation. Martin's example with the wire connected to a machine that prevents it from conducting electricity when touched. The wire is still live, but the mask blocks the shock. The counterfactual "if touched, it would shock" is false, but the disposition exists. 

  The user's tumbler example with a charge that shatters it when tapped is actually a reverse fink or mimic. They thought it was a fink, but finks remove the disposition upon trigger, whereas here the disposition isn't present at all—it's the charge causing the breaking. So that's not a fink. 

  Their mug example with a protective coating is a mask. The mug is fragile, but the coating prevents breaking when dropped. The counterfactual is false, but the disposition is real. They need to categorize that correctly in their essay. 

  They mentioned adding a clause about retaining the intrinsic basis. That's for finks, because the intrinsic change (sorcerer removing fragility) alters the basis. Masks keep the basis intact but add external interference. That's why the clause helps with finks but not masks. 

  I should create a table to summarize the cases. Include their tumbler example as a mimic, the sorcerer as fink, the wire as mask, and their mug as another mask example. Clarify the disposition status, counterfactual truth, mechanism, and standard fixes. 

  Also, address why these cases break the simple counterfactual analysis. Finks and masks show that the counterfactual can be false even if the disposition exists (mask), or true without the disposition (mimic). That's the fuss—they challenge the equivalence between dispositions and conditionals. 

  Make sure the table is clear. Check the standard terms: fink, mask, mimic. Note that some cases are contested, like whether reverse finks count as dispositions. The fixes: for finks, add the retention clause; for masks, use ceteris paribus or intrinsic basis. 

  The user might be worried about their essay being wrong. Reassure them by clarifying the concepts and providing accurate examples. Highlight their mug example as a correct mask case. Emphasize that these distinctions are crucial for understanding the problems in dispositional analysis.
answer: |-
  Here's the clarification you need, with a table summarizing the key cases at the end. Your confusion is common and stems from swapping the core mechanisms of finks and masks.

  **The Core Correction: You've Reversed Fink and Mask**

  1.  **Finkish Disposition (Lewis):** The disposition *is* present, but the trigger *removes the disposition* before it can manifest.
      *   **Example:** A genuinely fragile glass guarded by a sorcerer. The sorcerer instantly *removes the fragility* if the glass is struck. **Result:** The glass *is* fragile (has the disposition), but *if struck, it would NOT break* (because it instantly becomes non-fragile).
      *   **Problem:** Breaks the counterfactual analysis. "If struck, it would break" is FALSE, even though the glass IS fragile *before* being struck. The disposition vanishes *simultaneously* with (or just before) the trigger.
      *   **Usual Repair:** Add a clause requiring the object *retains the intrinsic basis* for the disposition throughout the triggering situation. (The sorcerer changes its intrinsic basis instantly).

  2.  **Masking (Martin):** The disposition *is* present, but some *extrinsic* factor *interferes* with the manifestation *even though the trigger occurs and the disposition remains*.
      *   **Example 1:** An *electrically live* wire connected to an electro-fink machine. The machine *detects* impending contact and *instantly cuts the power* before contact completes. **Result:** The wire *is* live (has the disposition), but *if touched, it would NOT shock* (the power is cut).
      *   **Example 2 (Your Mug):** Your mug *is genuinely fragile*, but sprayed with an *unyielding protective coating*. **Result:** The mug *is* fragile (has the disposition), but *if dropped (onto a hard surface), it would NOT break* (the coating prevents it).
      *   **Problem:** Breaks the counterfactual analysis. "If dropped, it would break" is FALSE, even though the mug IS fragile. The disposition persists, but an extrinsic factor blocks the manifestation.
      *   **Usual Repair:** Add a *ceteris paribus* ("all else being equal") clause to the counterfactual analysis, excluding interfering factors like masks. Alternatively, specify the disposition manifests *in the appropriate conditions* (which exclude masks). *Adding the intrinsic basis retention clause doesn't help here* because the mask (coating) is extrinsic; the intrinsic basis (the fragile glass structure) remains intact.

  **Your Tumbler Example: A Mimic (or Reverse Fink)**

  *   Your tumbler *is NOT fragile*. Its breaking is caused *entirely* by the internal charge mechanism *in response* to the tap. The breaking isn't a manifestation of fragility; it's a manifestation of the charge mechanism.
  *   **Result:** The tumbler *does NOT have the disposition* (fragility), but *if tapped, it WOULD break*. The simple counterfactual "If tapped, it would break" is TRUE, even though it lacks the disposition.
  *   **Problem:** Breaks the counterfactual analysis. The counterfactual is TRUE without the disposition being present. It's a "false positive" for the disposition.
  *   **Label:** This is often called a **Mimic** or sometimes a **Reverse Fink**.
  *   **Usual Repair:** The same "retains intrinsic basis" clause that handles finks also handles mimics. Without fragility (the intrinsic basis), the counterfactual shouldn't hold; the repair clause ensures the basis *persists* and causes the manifestation.

  **Summary Table: Finks, Masks, and Mimics**

  | Case Example                          | Has Disposition?     | Plain Conditional True? | Mechanism                                                                 | Standard Label       | Usual Repair                                       |
  | :------------------------------------ | :------------------- | :---------------------- | :------------------------------------------------------------------------ | :------------------- | :------------------------------------------------- |
  | **Fragile Glass + Sorcerer**          | **Yes**              | **No** (Would not break)| Trigger (strike) instantly **removes disposition** (fragility)            | **Fink**             | Add "**retains intrinsic basis**" clause          |
  | **Live Wire + Electro-Fink Machine**  | **Yes**              | **No** (Would not shock)| Trigger (impending touch) **removes disposition** (live)                  | **Fink**             | Add "**retains intrinsic basis**" clause          |
  | **Fragile Mug + Protective Coating**  | **Yes**              | **No** (Would not break)| Extrinsic factor **blocks manifestation** of persistent disposition       | **Mask**             | Add ***ceteris paribus*** clause; specify "**in appropriate conditions**" |
  | **Non-Fragile Tumbler + Shatter Charge** | **No**               | **Yes** (Would break)   | Mechanism **mimics manifestation** without the disposition being present | **Mimic / Reverse Fink** | Add "**retains intrinsic basis**" clause; requires disposition *causes* manifestation |

  **Key Takeaways for Your Essay:**

  1.  **Fink:** Disposition present -> Trigger happens -> Trigger *destroys disposition* -> Manifestation does NOT occur. Breaks counterfactual (CF false despite disposition). **Fix: Retain Intrinsic Basis.**
  2.  **Mask:** Disposition present -> Trigger happens -> Disposition *persists* -> Extrinsic factor *blocks manifestation*. Breaks counterfactual (CF false despite disposition). **Fix: *Ceteris paribus* / Appropriate Conditions.**
  3.  **Mimic/Reverse Fink:** Disposition *absent* -> Trigger happens -> External mechanism *causes manifestation anyway*. Breaks counterfactual (CF true despite lack of disposition). **Fix: Retain Intrinsic Basis (which requires it exists & causes manifestation).**
  4.  **Your Mug:** It's a classic **Masking** case. The fragility disposition is real and persists, but the extrinsic coating prevents the breaking manifestation when the trigger (dropping) occurs. The counterfactual "if dropped, it would break" is false, even though it *is* fragile.
  5.  **The Fuss:** These cases prove that the simple counterfactual analysis ("X is disposed to M when C iff if C were the case, X would M") is **neither necessary nor sufficient** for disposition ascription.
      *   **Not Sufficient:** Mimics show the CF can be true without the disposition (False Positives).
      *   **Not Necessary:** Finks and Masks show the CF can be false *even when* the disposition is present (False Negatives).

  Use your mug confidently as a Mask example! Just ensure you frame it correctly: the disposition is real and present, but an extrinsic factor (the coating) interferes with its manifestation upon triggering. Good luck with the seminar!
