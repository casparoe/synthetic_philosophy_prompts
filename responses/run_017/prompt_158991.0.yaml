prompt: |-
  I'm on a tiny committee at my hospital that's supposed to update how we handle psychiatric advance directives — the "if I go manic and start refusing meds, admit me and treat me anyway" kind of document. And the more we talk the more I think the existing practice is quietly committed to something philosophically loaded that nobody on the committee can actually state.

  Here's the shape of it as I understand it (in some places these things are legally binding, in others they're just advisory — I don't think that matters for my question, but tell me if it does). A patient with bipolar disorder signs a directive while she's well saying that if she becomes manic and refuses treatment, she wants to be hospitalized and medicated anyway. Months later she's manic, she's refusing, and the team overrides her current refusal in the name of the earlier document. So the earlier self beats the present self. But then take a different case: someone with dementia who years ago signed a refusal of aggressive life-prolonging treatment, and who now, in a fairly lucid moment, says she'd like to keep going and seems to be genuinely enjoying her lunch. A lot of people say the present self wins there, or at least that it's genuinely up for grabs. And in general, a competent patient's refusal right now trumps anything anyone said earlier. So: earlier self wins here, later self wins there, and I can't tell whether there's a principled line (something about who has capacity at the time) or just two habits that grew up separately in different corners of medicine. Also, as far as I can tell, half the time these documents just get ignored by whoever is on call, which makes me wonder whether there's any theory here at all.

  What I want first is the reconstruction: what view of a person's will, or of preference, or of what it even means to respect someone, does this pattern presuppose? Is there a substantive theory in it — something like "the will that counts is the one formed under good conditions: informed, not in crisis, not distorted" — or is the practice compatible with a much thinner procedural story where capacity is just a gate and nobody is making any claim about what the person really wants? I'd like the strict presuppositions separated from the stuff the practice merely fits well with, and I'd like to know where it's underdetermined, i.e. where three different theories would all license exactly the same behavior.

  Then the part I'm actually stuck on. The idea I keep circling is the alignment-flavored notion of an idealized or extrapolated will: roughly, what you'd want if you knew more, thought faster, and were more the person you wish you were — what people call coherent extrapolated volition. If a hospital took that seriously, what would it do with these two cases? Specifically:

  - Which self is the base point for the extrapolation? The woman at 30 signing the document, or the woman at 35 who is currently manic and refusing? If the answer is "it depends on the case," that seems to make the notion useless at exactly the moment we need it.
  - Does the manic episode itself count as input to the extrapolation? She has now had experiences, formed projects, changed her view of her own life. Does the extrapolated will get updated with all that, or do we treat the episode as noise to be filtered out before we start?
  - Is there even a fact of the matter about where the extrapolation lands, or does it depend on the order in which you imagine her learning things and revising herself? I have a suspicion there isn't, and that the directive is doing more work than any theory of idealized preference can actually justify. If that suspicion is right, say so plainly.
  - And concretely: what would a policy written by someone who believed in extrapolated volition look like? Binding instructions or rebuttable presumptions? A "values history" the team actually reads instead of a checkbox form? A duty to try to talk the manic patient round before overriding her? What would have to change in practice, and what would get worse?

  I definately don't need citations or a reading list — I can't look anything up from the committee room and I don't want to be sent off to read somebody. Just argue it out. If the honest answer is that the practice is underdetermined and we should stop pretending there's a deep theory behind the asymmetry, I'd rather hear that than a tidy story.
reasoning: |-
  Hmm, this is a fascinating and complex ethical dilemma about psychiatric advance directives (PADs) and how they interact with current wishes during different mental states. The user is on a hospital committee struggling with the philosophical foundations of their current practices.

  The core tension they're describing is the apparent inconsistency: in bipolar cases we honor the past competent self over the present manic self, but in dementia cases we often honor the present self over past directives. They're right to question whether there's coherence here. 

  What they're really digging at is the metaphysics of personal identity and autonomy - which "version" of a person deserves primacy? The committee seems to be operating on unexamined assumptions about when a person is "truly themselves." 

  Their questions about extrapolated volition are particularly sharp. They're noticing that in manic episodes, we act as if the episode isn't part of the person's "real" identity trajectory, whereas in dementia we treat even diminished capacity moments as authentic. That's philosophically messy when you stare at it.

  The alignment theory angle is clever but I suspect they're correct to worry about its practical application. If we try to imagine what the bipolar patient "would want if more themselves," whose definition of "more themselves" do we use? The pre-manic self's projection? The doctor's? This could become dangerously paternalistic.

  For their committee work, I should emphasize these key distinctions:
  1) The nature of the impairment (temporary vs progressive)
  2) The reversibility question
  3) The presence of authentic new preferences in dementia
  4) The risk calculation in psychiatric emergencies

  The practical advice about making PADs more contextual and process-oriented seems crucial. Instead of pretending we're discovering some "true will," we should acknowledge we're making judgment calls about which version of the person to prioritize, with clear guardrails against abuse.

  The dementia comparison is actually helpful here - it shows that honoring current wishes becomes more defensible when the person can still form new preferences and enjoy life. Whereas in mania, current refusal often directly contradicts everything the person values when well.
answer: |-
  You've hit on a profound tension in medical ethics that exposes our unstated assumptions about personhood, autonomy, and time. Here's a reconstruction of the implicit philosophy and a clear-eyed look at extrapolated volition:

  **The Unstated Theory in Current Practice**  
  The asymmetry between psychiatric and dementia directives suggests a *procedural* theory of autonomy with two hidden axioms:  
  1.  **Capacity as the Gateway to "Real" Wills:** Only wishes expressed during capacity "count" as authentic expressions of autonomy. Current refusal during incapacity (mania) is noise. Current assent during fluctuating capacity (dementia) *might* signal a residual authentic self.  
  2.  **The Primacy of Crisis Prevention:** Psychiatric practice prioritizes the *prevention of irreversible harm* (self-destruction, life-ruining decisions during mania). Dementia practice often prioritizes *current well-being* when harm is less acute/reversible. The manic patient’s refusal actively fuels the crisis; the dementia patient’s lunch enjoyment is a positive good we’re reluctant to override based on a past abstraction.  

  This is **procedural, not substantive.** It doesn’t claim the past self "knows better" in a deep philosophical sense. It claims:  
  *   Past directives are *procedurally valid* expressions of autonomy (capacity + process).  
  *   Current refusal during incapacity is *procedurally invalid*.  
  *   Current assent during *questionable* capacity (dementia) gets the benefit of the doubt *if* respecting it doesn't obviously trigger the harm the past directive sought to avoid.  

  **The practice is critically underdetermined:**  
  *   It *fits* with theories valuing the "undistorted" will (e.g., "true self" views in mental illness).  
  *   It *fits* with pure proceduralism (capacity gates validity, period).  
  *   It *fits* with consequentialism focused on preventing acute self-harm.  
  Three radically different philosophies lead to the same outcome. **The asymmetry is driven more by clinical context (acuity of harm, perceived reversibility) than a deep, consistent theory of the self.**

  **Extrapolated Volition (EV) – A Brutally Honest Assessment**  
  Applying EV here is intellectually seductive but operationally fraught:  

  1.  **The Base Point Problem:**  
      *   **Manic Patient:** EV likely *starts* from the competent, pre-manic self (30yo). Why? That self is seen as possessing the broadest perspective, understanding the illness pattern, and explicitly aiming for stability/coherence across time. The directive *is* her attempt at EV. The 35yo manic self is viewed as a *deviation* caused by the illness she sought to mitigate.  
      *   **Dementia Patient:** EV likely *starts* from the current self enjoying lunch. Why? The prior refusal (e.g., at 70) was based on hypotheticals about profound suffering. The current self (at 75, lucid moment) is providing *new, experiential data*: she is experiencing enjoyment *despite* her condition. Ignoring this feels like disregarding her *actual, present* experience in favor of a past fear. EV updates with lived reality.  
      *   **The "Depends" Problem:** This *does* make EV context-dependent, but not useless. The key difference is the **nature of the impairment and its integration into identity:** Mania is seen as an *alien intrusion* disrupting the self; dementia progression (even with lucid moments) is seen as a *transformation* of the self we must engage with as it is *now*. EV prioritizes the perspective deemed most "foundational" or "continuous."

  2.  **Does the Manic Episode Count?**  
      *   **Minimal Integration:** EV would largely treat the *content* of the manic episode (specific grandiose ideas, anger at caregivers) as "noise" – distortions caused by the illness state the directive anticipated.  
      *   **Potential Integration:** However, the *fact* of the episode might inform the *extent* of the intervention EV would endorse (e.g., "Given how destabilizing hospitalization was *last* time, EV might favor a less restrictive intervention *if safely possible* this time"). The core desire for stability/avoidance of harm remains paramount. New experiences *from recovery* (not the episode itself) would update future directives.

  3.  **Is There a Fact of the Matter?**  
      **Your suspicion is largely correct.** EV is fundamentally indeterminate in these complex cases. It depends entirely on:  
      *   **The Model:** What constitutes "knowing more" (medical facts? existential experience?), "thinking faster" (perfect rationality? embodied wisdom?), and "the person you wish you were" (contradictory wishes over time)?  
      *   **The Extrapolation Path:** Order matters immensely. Does she "learn" by experiencing mania first? Or by being prevented from experiencing its worst consequences? Does she "revise" towards stability or towards experiencing unfiltered states?  
      *   **The Interpreter's Bias:** Clinicians implementing EV inevitably project their own values (e.g., stability vs. experiential freedom).  
      **The directive *is* doing the heavy lifting.** It provides a concrete, procedurally valid anchor point that *stands in* for the impossible-to-calculate EV. It's a practical commitment device, not a discovered truth.

  **What Would an EV-Inspired Policy Look Like (and its Pitfalls)?**  
  A policy truly embracing EV would likely involve:  

  1.  **Binding Rebuttable Presumptions:** Past directives create a *strong presumption* for treatment during incapacity, BUT rebuttable by compelling evidence that the directive no longer reflects what the person, extrapolating *from their current position and experiences*, would want *now*. (Operationalizing "compelling evidence" is the hard part).
  2.  **Rich "Values Histories," Not Checkboxes:** Mandatory narratives exploring:  
      *   *Why* they want the directive (fear of specific harms? value on stability? regret over past actions?).  
      *   What constitutes a "good life" for them, even with illness.  
      *   Views on coercion, loss of control, specific treatments.  
      *   Triggers for enacting/not enacting the directive. *Crucially, this must be reviewed with the patient periodically when well.*
  3.  **Structured Contemporaneous Assessment:** A formal duty to:  
      *   **Assess Capacity Rigorously:** Not just "can they refuse?" but "is there *any* residual expression of values consistent with the directive or pointing to a change?"  
      *   **Attempt Dialogue:** Even if overriding current refusal, clinicians must engage the patient *as if* their current voice matters: "I hear you refusing. Your directive asks us to help you in this situation. Can you tell me what you're most afraid of right now? How can we make this easier?" The goal isn't persuasion per se, but seeking any fragment of the "continuous self" that might inform care *within the directive's framework*.
  4.  **Formal Review Mechanisms:** Mandatory post-stabilization review:  
      *   Did the directive work as intended?  
      *   Does the patient (now capacitated) affirm or wish to revise it based on the *experience* of being treated under it?  
      *   Feed this back into the document.

  **What Would Change & What Could Get Worse:**  
  *   **Change:** More nuanced decisions, less automatic overriding in psychiatry, more careful consideration of past directives in dementia. Care focused on aligning actions with the patient's deeper narrative, not just legal boxes.  
  *   **Worse:**  
      *   **Increased Ambiguity & Conflict:** EV arguments can be made from multiple angles ("The *real* her would never want this forced sedation!" vs. "The *real* her begged us to prevent this!").  
      *   **Clinician Burden & Subjectivity:** Requiring rich interpretation of values histories and "extrapolation" places immense, potentially unmanageable, subjective burden on clinicians.  
      *   **Undermining the Commitment Device:** If directives are too easily rebutted by arguing "current EV," they lose their core function in psychiatry: ensuring treatment during crises when the patient cannot consent.  
      *   **Paternalism in Disguise:** "We know your extrapolated will better than you did when you wrote this" is a dangerous path.  

  **The Hard Truth:**  
  Your committee's current practice rests on a **pragmatic, procedurally-focused compromise** that prioritizes crisis prevention in psychiatry and current well-being in dementia, using capacity as a bright(ish) line. It is **not** built on a deep, consistent, discoverable theory of the "true self" or "real will." **Extrapolated Volition is a powerful heuristic, not a calculable truth, and using it as policy risks replacing one set of ambiguities with another, potentially more paralyzing set.** The value of the psychiatric directive is its function as a *pre-commitment strategy* – a tool the *past self* uses to protect the *future self* from the *impaired self*. Its legitimacy comes from the procedural validity of its creation, not from perfectly capturing an idealized will. The dementia directive lacks this crisis-prevention function, making current well-being more salient. Acknowledge the context-driven asymmetry, focus on robust process (better capacity assessment, meaningful values histories, mandated review), and accept that perfect philosophical coherence might be less important than workable, humane guardrails.
