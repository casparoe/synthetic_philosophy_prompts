prompt: |-
  I work in the safety department of a regional transit authority — light rail plus buses, about twelve hundred vehicles — and roughly forty incident reviews a year cross my desk: collisions, signal failures, maintenance errors, and near-misses that come in through our confidential reporting system. I write them up; a committee of five (operations, maintenance, HR, a driver representative, and me) signs off; the board reads the summary page and decides which recommendations get funded. Two features of our process matter a great deal. The first is that our template has a single line labelled root cause, and the board will not accept a report that leaves that line blank or fills it with a list. The second is that, under our agreement with the union, we may name an individual in that line only if the committee finds the individual was personally responsible; naming someone sets off a separate process that everyone involved dislikes. So in practice every review ends in one of two ways — we name a person, or we say it was the system — and I have come to think that this is an artefact of the template rather than a finding about the world.

  I have been reading about causation on my own, with no formal training in philosophy, precisely because the reviews keep turning on it, and I want a procedure, not more theory. Here is where I have got to. The test we all reach for is the but-for test: would the outcome have happened if this had been different? It seems to me to give the wrong answer when two things were each sufficient on their own — each can say the outcome would have happened anyway, so butt-for says neither is a cause — and it also seems to let almost everything in, since the outage would not have happened if the part had never been manufactured or if the authority had never been built. The alternative I have read about, which I believe is called the interventionist account, says something like: X caused Y if there is some possible change to X, brought about in a way that does not itself change anything else except through X, that would change Y or the chance of Y, with the other relevant factors held at the levels they actually had. I can see the appeal. I can also see three places where it might be hollow: the answer depends on what else you hold fixed, on which alternative value of X you imagine (double the maintenance budget? halve it? check the bolt, or check it twice and sign for it?), and on whether the change is one anyone could actually carry out. If those are choices we make, then the procedure is not discovering causes; it is recording our decisions about which comparisons to care about. I would much rather have that stated openly in the procedure than have the board discover it in a report.

  What I want from you is a decision procedure my team can run on each review, in the order we should run it, written so that someone with no philosophy can apply it. For each step I need the question to ask, what counts as a sufficient answer, where the procedure stops with a no and the report says the candidate is not a cause, and where it stops to hand the question to a named person or to the committee because it is a question of values or of authority rather than of fact. I need a fixed form for the cause sentence itself, so that forty reports a year are comparable, and I need the form to force us to say what we are holding fixed and what alternative we are comparing against. I also need the procedure to say what to do when we cannot get the number we want, which is most of the time: we almost never have data on how often a step is skipped or how much a change would reduce risk, and we have about two working days per report and ninety minutes of committee time.

  There are specific hard cases the procedure must be able to handle rather than wave at: two independent faults each of which would have produced the outcome on its own; a backup that would have caught the failure except that the backup was itself defective; a failure to act rather than an act; a factor nobody in our organisation can change, such as a driver's undiagnosed medical condition or the geometry of a junction as built; a factor that changes nothing by itself and only matters in combination with another; a cause far back in time, such as a hiring freeze two years ago; and the ordinary case where the best we can say is that something made the outcome more likely rather than certain. I have also been using an informal test of my own when we are deciding whether to name a person: I ask whether swapping that person for another competent employee, same shift, same conditions, same equipment, would have changed anything. Tell me where that test fits in the procedure, whether it is sound, and where it breaks.

  Then run the procedure on three cases.

  One. A signal failed at a junction and a train was brought to a stop in a tunnel. The investigation found a power supply module that had been degrading for months and was past its replacement interval, and also a wiring fault introduced during repair work three weeks earlier that would on its own have taken the signal out that same night. Either alone would have done it. Our but-for instinct says neither is the cause. What does the procedure say we write in the line, and if the template permits only one entry, how does the procedure decide which of the two goes there?

  Two. A bus struck a pedestrian in a marked crosswalk at dusk. The driver was within the speed limit and had no sightline difficulty until the last moment; the pedestrian was looking at her phone and stepped out against the signal. The committee's instinct is to write pedestrian inattention. My instinct is that this is both true and useless, and that naming the one variable we cannot act on while ignoring the ones we can is a choice rather than a finding. Is her inattention a cause by your procedure? And what should the procedure tell us to do about the fact that the manipulable variables on our side — crossing lighting, signal timing, the speed limit on that corridor, vehicle front design — each change the probability only slightly?

  Three, the case I expect to dislike. A light-rail car was pulled from service after a brake component was found torqued incorrectly. Six technicians work that shift; all six, including the one on duty, routinely skip the re-torque step, because the job card places it at the end of a twelve-hour night shift and the tooling is kept at the far end of the depot. The board wants a name in the root cause line, and the driver representative has said the report will be used to discipline someone. My own swap test says the individual is not the cause: any of the six, on that night, in those conditions, would have done the same. Run the procedure and tell me honestly what it outputs — including, if this is where it lands, that causation and accountability come apart, and that we are being asked to use a causal report to do a moral or administrative job that it cannot do. Then say clearly which part of that decision belongs to the committee and not to the procedure.

  Finally, tell me what the procedure cannot do: which questions it will systematically get wrong, which it will refuse, where it will be quietly steered by whoever chooses the variables and the contrasts, and what I should watch for in the first six months if we adopt it.
reasoning: |-
  Hmm, this is a fascinating and highly practical request from a safety professional dealing with real-world incident analysis. The user is clearly frustrated with their current binary "person vs system" causal attribution model and wants a rigorous yet executable procedure. They've done impressive self-study on causation philosophy but need operationalization, not theory.

  Key pain points stand out: The artificial constraint of a single "root cause" line forces oversimplification. The union agreement creates legal/political tension around naming individuals. Their current but-for test fails for overdetermination cases. They lack data and time for complex analyses. Most importantly, they recognize that causation determination involves value judgments disguised as factual findings.

  Their three test cases are perfectly chosen to stress-test any procedure: 
  1) The dual-failure signal case challenges overdetermination. 
  2) The pedestrian accident exposes "true but useless" attribution. 
  3) The maintenance error reveals the person/system tension.

  I appreciate their self-developed "swap test" - it's essentially a counterfactual with ceteris paribus conditions. It's philosophically sound for proximate human error but breaks down for systemic issues or when "competent employee" is ill-defined.

  For the procedure design, I need to:
  - Explicitly frame causation as contrastive (X rather than Y)
  - Build in ethical/political off-ramps where committee judgment is needed
  - Handle data scarcity pragmatically
  - Force transparency about what's being held fixed
  - Provide concrete output formatting
  - Address all their hard cases

  The interventionist framework they mentioned is indeed suitable but must be operationalized. Key adaptations:
  1) Replace impossible interventions with feasible ones
  2) Standardize comparison points (e.g., "as designed" baseline)
  3) Create tiered stopping points

  For the signal case, the procedure should flag that both failures are causal when contrasted against proper maintenance. The output format would force naming both with the contrast specified.

  For the pedestrian case, their instinct is correct - the procedure should surface that while inattention is causal, it's non-manipulable. The committee must then decide whether to focus on actionable factors.

  The maintenance case is where ethics and causation collide. The procedure will show the technician isn't causal under the swap test, but the committee might still demand naming for accountability - that tension must be made explicit.

  Major limitations to highlight:
  - The choice of contrast set is subjective
  - It can't resolve moral responsibility
  - Long-chain causes get minimized
  - Requires careful variable selection
  - May inflate minor manipulable factors

  The first six months should watch for committee members gaming variables to fit preconceived conclusions - especially around personnel cases. The procedure's strength is in making those choices visible.
answer: |-
  Below is a practical decision procedure designed for your incident reviews, incorporating interventionist causation principles while addressing your constraints. It forces transparency about choices, handles hard cases, and clearly separates factual analysis from value judgments. The procedure has **six sequential steps** with explicit outputs, stopping rules, and delegation points. It includes a standardized "cause sentence" format for your report line.

  ---

  ### **Incident Causation Decision Procedure**
  **Goal:** Determine what to enter in the "root cause" line of the report.  
  **Input:** Verified facts from the investigation (timeline, actions, conditions).  
  **Output:** A completed "cause sentence" (template below) OR a flagged issue for committee decision.  
  **Time Budget:** 90 min/incident (team) + 15 min (committee if needed).

  #### **Step 1: Define the Focal Outcome**  
    - **Question:** *"What specific, undesirable outcome are we analyzing?"*  
    - **Sufficient Answer:** A clear event (e.g., "signal failure at Junction X," "pedestrian struck at Y St").  
    - **Stop if:** Outcome is vague (e.g., "safety lapse"); rewrite it.  
    - **Handoff:** None. This is factual.

  #### **Step 2: List Candidate Causes**  
    - **Question:** *"What factors were present that, if changed, might have prevented or reduced the outcome?"*  
    - **Sufficient Answer:** A list of 1–5 factors (e.g., "degraded power module," "wiring fault," "pedestrian inattention," "skipped re-torque step").  
      - *Include:* Human actions/inactions, equipment states, environmental conditions, systemic policies.  
      - *Exclude:* "But-for" absurdities (e.g., "if the bus wasn’t manufactured").  
    - **Stop if:** >5 candidates → Prioritize by proximity/plausibility.  
    - **Handoff:** None. Use investigation data.

  #### **Step 3: Apply the Feasible Intervention Test (FIT)**  
    - **Question:** *"For each candidate, is there a feasible, specific change (intervention) that could have been made—holding all else equal—that would reduce the outcome’s likelihood or severity?"*  
      - **Feasible =** Technically and legally possible for your organization (e.g., "replace module per schedule," "add lighting," "redesign job card").  
      - **Hold equal =** Fix other factors at actual levels (e.g., "holding weather/driver shift constant").  
      - **Evidence Standard:** "More likely than not" (>50% chance of reducing risk). Use data if available; if not, use engineering judgment.  
    - **Sufficient Answer:** "Yes" or "No" for each candidate.  
    - **Stop if:**  
      - **No** for all candidates → Outcome was unavoidable (rare; report as "no feasible intervention identified").  
      - **Yes** for ≥1 candidate → Proceed to Step 4.  
    - **Handoff:** If feasibility is disputed → Committee decides (e.g., "Is better crosswalk lighting feasible?").

  #### **Step 4: Apply the Swap Test (for Human Factors)**  
    - **Question (for human-action candidates only):** *"Would swapping this person with another competent employee (same role, shift, equipment, conditions) likely have changed the outcome?"*  
      - **Competent =** Trained, fit for duty, no known deficits.  
      - **Answer "No" if:** The action was routine under systemic pressures (e.g., skipped steps due to shift design).  
    - **Sufficient Answer:** "Yes," "No," or "N/A" (not human action).  
    - **Stop if:** "No" → Candidate is **not** a root cause (it’s systemic). Proceed to Step 5.  
    - **Handoff:** None. This is factual.  
    - **Validity:**  
      - **Sound for:** Isolating systemic vs. individual culpability.  
      - **Breaks if:** "Competent employee" is poorly defined OR conditions are unique (e.g., rare medical event).

  #### **Step 5: Select Primary Cause (for Report Line)**  
    - **Question:** *"Among candidates passing Steps 3–4, which intervention would have the highest risk reduction, broadest applicability, and align with our safety priorities?"*  
      - **Rank by:**  
        1. **Leverage:** Magnitude of risk reduction (estimate if data scarce).  
        2. **Actionability:** Within your authority to change.  
        3. **Preventive Scope:** Prevents future incidents, not just this one.  
      - **Use tiebreakers:** Proximity to outcome > Ease of implementation.  
    - **Sufficient Answer:** One candidate. If ties remain, use Step 6.  
    - **Stop if:** One clear winner → Write cause sentence (Step 6).  
    - **Handoff:**  
      - If ranking involves values (e.g., "cost vs. safety") → Committee decides.  
      - If top candidate is a person → Proceed to Step 6 (requires committee approval).

  #### **Step 6: Write the Cause Sentence**  
    - **Format:**  
      > *"[Candidate] caused [outcome] because if we had [specific intervention], holding [list key fixed factors] constant, the outcome would more likely than not have been prevented or reduced."*  
    - **Rules:**  
      - Candidate must be specific (e.g., "degraded power module (P/N 123)" not "equipment failure").  
      - Intervention must be actionable (e.g., "replaced at 24-month interval" not "better maintenance").  
      - Fixed factors must include context (e.g., "holding weather, shift schedule, and traffic constant").  
    - **Handoff:**  
      - If naming a person → Committee must unanimously approve (per union agreement).  
      - If no intervention is feasible → Report: *"No feasible intervention identified; outcome was unavoidable under current constraints."*  

  ---

  ### **Application to Your Cases**
  #### **Case 1: Signal Failure (Two Independent Faults)**  
    - **Steps 1–2:** Outcome = "Signal failure at Junction X." Candidates = (A) Degraded power module, (B) Wiring fault.  
    - **Step 3 (FIT):**  
      - A: Feasible intervention = "Replace per 24-month schedule." Holding wiring constant, failure prevented? **Yes.**  
      - B: Feasible intervention = "Inspect wiring post-repair." Holding module constant, failure prevented? **Yes.**  
    - **Step 4:** N/A (not human actions).  
    - **Step 5:** Both pass. Rank:  
      - Leverage: Both 100% sufficient (tie).  
      - Actionability: Both high (tie).  
      - Preventive scope: Wiring fix prevents future repair errors; module replacement prevents aging failures → **Tie.**  
      - Tiebreaker: Wiring fault is closer in time → **Select B** (wiring fault).  
    - **Step 6:**  
      > *"Wiring fault introduced during repair caused signal failure because if we had inspected post-repair, holding power module condition and junction load constant, the failure would more likely than not have been prevented."*  
    - **Why not both?** Template forces one entry; procedure prioritizes recency. Committee can note both in narrative.

  #### **Case 2: Pedestrian Struck (Non-Actionable Cause)**  
    - **Steps 1–2:** Outcome = "Pedestrian struck at Y St crosswalk." Candidates = (A) Pedestrian inattention, (B) Low crossing lighting, (C) Short "walk" signal timing.  
    - **Step 3 (FIT):**  
      - A: Intervention = "Pedestrian attentive." Feasible? **No** (not manipulable by your authority). → **Reject.**  
      - B: Intervention = "Increase lumens by 50%." Holding signal timing/driver constant, risk reduced? **Yes** (likely).  
      - C: Intervention = "Extend 'walk' phase by 5s." Holding lighting constant, risk reduced? **Yes** (likely).  
    - **Step 4:** N/A.  
    - **Step 5:**  
      - Leverage: Lighting/signal changes reduce risk marginally (neither sufficient alone).  
      - Actionability: Both within authority.  
      - Preventive scope: Lighting benefits all crossings → **Select B.**  
    - **Step 6:**  
      > *"Inadequate crossing lighting caused pedestrian strike because if we had increased lumens by 50%, holding signal timing, driver speed, and pedestrian behavior constant, the strike would more likely than not have been prevented."*  
    - **Key:** Pedestrian inattention fails FIT (non-actionable). Report focuses on manipulable factors.

  #### **Case 3: Skipped Re-Torque (Systemic vs. Individual)**  
    - **Steps 1–2:** Outcome = "Brake component torqued incorrectly." Candidates = (A) Technician skipped step, (B) Job card design, (C) Tool location.  
    - **Step 3 (FIT):**  
      - A: Intervention = "Technician performs step." Feasible? **Yes.**  
      - B: Intervention = "Move re-torque to start of shift." Feasible? **Yes.**  
      - C: Intervention = "Store tools near bays." Feasible? **Yes.**  
    - **Step 4 (Swap Test):**  
      - A: "Swap technician → same outcome?" **Yes** (all six skip routinely). → **Reject A as root cause.**  
    - **Step 5:** Rank B vs. C:  
      - Leverage: Both high (either eliminates skip incentive).  
      - Actionability: Both feasible.  
      - Preventive scope: Job card redesign prevents all shift-skip errors → **Select B.**  
    - **Step 6:**  
      > *"Job card placing re-torque at shift end caused incorrect brake torque because if we had moved the step to pre-shift inspection, holding technician competency and tool location constant, the error would more likely than not have been prevented."*  
    - **Honest Output:**  
      - The technician is **not** causal per FIT + Swap Test.  
      - Board pressure to name a person conflates **causation** with **accountability**.  
      - **Committee Handoff:** Must decide whether to:  
        (a) Accept the systemic cause (recommending job card redesign), OR  
        (b) Override the procedure and name the technician for disciplinary reasons (acknowledging this is an administrative choice, not causal finding).  

  ---

  ### **Limitations & Implementation Risks**  
  1. **Subjectivity in Framing:**  
     - The procedure is steered by how candidates/interventions are defined (e.g., "increase lighting by 50%" vs. "redesign crosswalk").  
     - **Mitigation:** Require team to document all candidate rejections in the narrative.  

  2. **Non-Manipulable Factors:**  
     - Fails to address causes outside your control (e.g., "undiagnosed medical condition").  
     - **Output:** "No feasible intervention" → Committee must accept unavoidable risk or escalate.  

  3. **Overdetermination (Multiple Sufficient Causes):**  
     - Forces one "primary" cause; may obscure complex interactions.  
     - **Mitigation:** Use narrative to list all contributing factors.  

  4. **Data Scarcity:**  
     - Leverage estimates rely on expert judgment.  
     - **Mitigation:** Note uncertainty in cause sentence (e.g., "likely reduced risk").  

  5. **Accountability Pressure:**  
     - Procedure may conflict with board/union expectations (as in Case 3).  
     - **Mitigation:** Committee must formally minute when overriding FIT/Swap Test for non-causal reasons.  

  6. **Temporal Distance:**  
     - Favors proximate causes (e.g., wiring fault over hiring freeze).  
     - **Mitigation:** If a distant cause passes FIT (e.g., "if we had not frozen hiring, staffing would be adequate"), it can be selected.  

  **First 6 Months Watchlist:**  
  - Committee overruling FIT for political reasons (audit frequency).  
  - Vague interventions slipping into reports (enforce specificity).  
  - Swap Test misapplied to unique human errors (e.g., medical events).  
  - "Holding constant" factors being manipulated to skew results.  

  This procedure makes your choices transparent, handles your hard cases rigorously, and forces ownership of value judgments. It accepts that causation is a tool for prevention—not a moral verdict—and separates the two when needed.
