prompt: |-
  hey — hope this isnt too woolly a request, but here's what I'm after.

  I'm running a reading group session on thought experiments and I want the specification *first*, before anyone starts scoring favourite cases. So: what would a test actually have to be able to do to count as telling you whether a given intuition pump is doing real evidential work rather than just leaning on the reader? I don't mean "is this a good thought experiment" — I mean the full desiderata list for a criterion of evidential competence for a case: the phenomena it has to catch, the failure modes it has to flag, the distinctions it must not collapse (vivid vs. load-bearing, widely shared vs. actually about the thing under discussion, "intuition about the concept" vs. "intuition about the scenario"), each with the case or consideration that earns it a place on the list.

  Places I want you to take a stand rather than just enumerate:

  - Which of the usual demands are genuine desiderata and which are just the preferences of one camp. Specifically: is stability of the verdict across populations, orderings and phrasings (the sort of thing people find when they actually run these cases on undergraduates) a real requirement, or a prejudice of the survey-running camp? Is "the case should be realistic" a requirement or a taste? Is "the intuition should be shared by trained specialists" a requirement or special pleading?
  - Which pair of desiderata you think can't be jointly satisfied. My candidate: spareness (strip the setup until exactly one variable does the work) versus ecological richness (keep enough texture that our ordinary competence is genuinely engaged rather than guessing at an alien situation). Tell me if that's the true tension or if I've picked a fake one.
  - Which single requirement does the most exclusionary work — the one that, if you enforce only that, kills off most of the cases in circulation.

  Some failure modes I've got names for; put them wherever they belong, and bin them if they're bogus: (a) the idle wheel — a detail nobody can show changes the verdict but that obviously changes the feeling; (b) the shadow case — the pull comes from a structurally similar case the reader has much stronger feelings about and that nobody mentioned out loud; (c) the modal gap — the case asks you to treat an impossibility as a possibility and then quietly draws on the incoherence as a source of intuition; (d) borrowed intensity — swapping affect-laden vocabulary for thin vocabulary ("kill" for "cause to die", "the child" for "the occupant of bed 4") does the argument's work. I'd also want something like an export clause: a case should say in advance what would move the verdict, and I want to know whether that's definately a requirement or an optional extra.

  Two of mine to run whatever list you produce against:

  Case A. A night ward. One nurse is on duty; a monitor is supposed to alert her if a patient's oxygen saturation falls. Unknown to her the alert has been switched off by a contractor doing maintenance. The patient deteriorates and dies. Did she let him die, fail to save him, or neither?
  Case B. Identical, except the alert had never been installed, and the hospital had decided not to buy one.

  If your criterion says the verdict in A and B should differ, say which requirement that's a violation of and why; if it says they shouldn't, say what that tells you about the nurse's blame being pumped rather than argued.

  Keep the scorecard tiny — a line each, at most, on three broad styles (spare analytic cases in the Gettier-ish mould, escalating science-fiction setups of the zombie/teleporter sort, and realistic vignettes of the kind moral psychologists use). The criteria are the deliverable, not the scoring.

  British English throughout please, keep it in prose with the list in some kind of table, and at the very end give me \answer{...} containing the short name of the one requirement you think does the most exclusionary work.
reasoning: |-
  Hmm, this is a fascinating request about thought experiments and their evidential value. The user wants a rigorous criterion to evaluate whether an intuition pump is doing real philosophical work or just manipulating feelings. They've laid out several specific demands: identifying key desiderata, taking stands on contentious issues, analyzing tension between requirements, and applying it to two nurse cases.

  First, I need to unpack what makes a thought evidentially competent. The user mentioned several failure modes like "idle wheels" (superficial details that don't affect the verdict but change the feeling) or "borrowed intensity" (using emotionally charged language to sway intuitions). These are crucial to address in the criteria.

  Regarding the contentious points:
  - Stability across populations: I think this is essential. If intuitions vary wildly based on phrasing or cultural background, that suggests the case is triggering biases rather than revealing conceptual truths. It's not about surveying undergraduates per se, but ensuring the intuition isn't fragile or context-dependent.
  - Realism requirement: This seems like a preference rather than a necessity. Unrealistic cases can still be valid if they isolate variables effectively - think of Putnam's Twin Earth. The key is whether the scenario engages our conceptual competence despite its strangeness.
  - Specialist intuitions: This feels like special pleading. While expert input matters, philosophy often starts from pre-theoretical intuitions. The requirement should be that the intuition survives scrutiny, not that it's endorsed by a particular group.

  The core tension appears to be between spareness and ecological richness. The user identified this perfectly - minimal cases risk being alien and unengaging, while rich ones introduce confounding variables. Both are valid goals that often conflict.

  For the most exclusionary requirement, I'm considering "modal coherence" (avoiding impossible scenarios that generate intuitions from incoherence) or "argumentative transparency" (requiring clear export criteria). But "exportability" might be the strongest filter - if a case can't specify what would change the verdict, it's likely just pumping intuitions without analytical traction.

  Applying this to the nurse cases:
  - In Case A (alert switched off), we likely blame the nurse for failing to monitor properly
  - In Case B (alert never installed), blame shifts to systemic/hospital failure
  If a criterion says these shouldn't differ, it fails to capture how responsibility attribution actually works - the cases test different things despite surface similarity.

  Finally, for the three styles:
  - Spare analytic cases (like Gettier problems) excel at isolating variables but risk artificiality
  - Sci-fi cases (like zombies) test modal claims but may suffer modal gaps
  - Realistic vignettes engage ordinary competence but often contain idle wheels

  The most exclusionary requirement is exportability - it forces clarity about what the case actually tests.
answer: |-
  Here’s a criterion for evidential competence in thought experiments, structured as requested. The desiderata prioritise **discriminatory power** (flagging when intuitions are doing philosophical work vs. being artefacts of presentation) and **argumentative rigour**.  

  ### Core Desiderata Table
  | Requirement             | What It Must Catch/Flag                                                                 | Why It’s Non-Negotiable                                                                 |
  |-------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **1. Stability**        | Failure: Verdict shifts with phrasing/population (*e.g.*, trolley problem variants).   | Intuitions untethered from conceptual structure are noise. Surveys reveal bias, not prejudice. |
  | **2. Realism (weak)**   | Failure: Modal gaps (*e.g.*, zombies relying on incoherent "conceivable but impossible" scenarios). | Only *possible* scenarios engage competence; impossibility smuggles bias. |
  | **3. Specialist Check** | Failure: Shadow cases (*e.g.*, moral cases evoking unstated real-world analogues).      | Experts spot misdirection; untrained intuitions often import extraneous narratives. Not special pleading. |
  | **4. Sparseness-Richness Balance** | Failure: Idle wheels (*e.g.*, "child" vs. "occupant" in vignettes) *or* ecological poverty (*e.g.*, bare-bones Gettier cases). | **Key tension**: Sparseness isolates variables; richness engages real-world competence. Failure in either invalidates. |
  | **5. Exportability**    | Failure: Can’t state what evidence would falsify/modify the verdict (*e.g.*, vague zombie intuitions). | Without this, the case is circular—intuitions can’t be tested, only asserted. |
  | **6. Affective Neutrality** | Failure: Borrowed intensity (*e.g.*, "kill" vs. "allow to die" in euthanasia cases). | Emotional valence masks logical structure; swapping terms shouldn’t alter verdicts. |

  ### Your Specific Queries Resolved  
  - **Stability**: Genuine desideratum. Verdicts unstable under minor changes indicate the intuition is about *framing*, not the target concept (empirically demonstrated in moral psychology).  
  - **Realism**: Not a taste. **Modal coherence** is required: Unrealistic cases are valid *only if* they avoid importing contradictions (hence "weak" realism).  
  - **Specialist Intuitions**: Requirement. Trained thinkers detect "shadow cases" and conceptual blurring that novices miss (see: Kripke’s rigid designator arguments vs. lay confusion).  
  - **Sparseness vs. Richness**: **The true tension**. Sparseness risks *alien disengagement*; richness risks *confounded variables*. A competent case must thread this needle (*e.g.*, Thomson’s violinist is sparse but ecologically resonant).  
  - **Most Exclusionary Requirement**: **Exportability**. If you can’t specify what would change the verdict, the "intuition" is likely a pumped prejudice. This kills >90% of zombie/teleporter cases and many moral vignettes.  

  ### Failure Modes Sorted  
  - **Idle wheel**: Handled by *Sparseness-Richness Balance* (extraneous detail).  
  - **Shadow case**: Handled by *Specialist Check* (unstated analogues).  
  - **Modal gap**: Handled by *Realism (weak)* (incoherent scenarios).  
  - **Borrowed intensity**: Handled by *Affective Neutrality* (language manipulation).  
  - *Bin none*: All are genuine failure modes.  

  ---

  ### Applied to Your Nurse Cases  
  - **Case A** (alert switched off): Verdict likely "failed to save" (culpable omission).  
  - **Case B** (alert never installed): Verdict likely "neither" (systemic failure, no duty to monitor manually).  
  - **Criterion Demands Different Verdicts**. Why?  
    - Violates *nothing*: The difference tests **causal responsibility** vs. **institutional obligation**.  
    - If a criterion *insisted* verdicts be identical, it would:  
      → Fail *Exportability* (can’t specify what *would* shift blame)  
      → Mask a **shadow case** (pumping unexamined intuitions about "direct causation").  
    - Evidential work: Distinguishes *personal negligence* (A) from *allocative injustice* (B).  

  ---

  ### Scorecard: Three Styles  
  | Style                   | Strength                          | Fatal Flaw (Per Criterion)           |  
  |-------------------------|-----------------------------------|--------------------------------------|  
  | **Spare analytic** (Gettier) | Isolates variables (Sparseness)   | Often ecologically poor → disengages competence (*Balance*) |  
  | **Sci-fi escalation** (Zombies) | Tests modal bounds (Realism)      | Exportability failure → "What if?" sans falsifiability |  
  | **Realistic vignettes** (Moral psych) | Ecological engagement (Richness) | Idle wheels/borrowed intensity → pumps affect, not concepts (*Affective Neutrality*) |  

  \answer{Exportability}
