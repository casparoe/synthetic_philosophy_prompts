  ### **Key Insights**
  1. **Dr. Ferris's Likely Framework**:  
     The **Hybrid Model** (Contextual Integrity + Systematicity) best explains all six cases:
     - Case 1: No violation because observation was non-systematic and public (contextual norm).
     - Case 2: Violation due to systematic monitoring in a private context (no licensing norm).
     - Case 5: No violation because security context licenses systematic CCTV.
     - Case 6: Violation due to norm breach (health inference for commerce), even if beneficial.

  2. **Quiet House Prediction**:  
     - **Violation** for both monitoring and noticeboard.  
       - *Monitoring*: Systematic data collection repurposed beyond the safety norm (like Case 6).  
       - *Noticeboard*: Aggregating data breaches norms of discreet assistance (cf. Case 4’s gossip).  

  3. **Discriminating Case Utility**:  
     The library case exposes a rift between **Contextual Integrity** (which may tolerate inference as a norm gray area) and **Hybrid/Control** (which see profiling as a breach). Ferris would likely call this a violation, siding with the Hybrid model.

  4. **Silences Matter**:  
     Ferris’s framework doesn’t address:
     - Whether *anonymized* noticeboard data mitigates violation (Case 2 had no publication).
     - If consent can be “refreshed” for new data uses.
     - How to balance privacy against societal benefits (e.g., predicting rent arrears).

  ---

  ### **Essay Tips**
  - **Lead with the Hybrid Model**: Argue that Ferris merges contextual integrity (Nissenbaum) with Macnish’s systematic surveillance critique.  
  - **Use the Noticeboard as a Secondary Violation**: Emphasize that aggregation creates new privacy harms distinct from collection (cf. Case 2 vs. 6).  
  - **Acknowledge Underdetermination**: The six cases don’t specify how to resolve conflicts between norms (e.g., safety vs. autonomy in Quiet House). Propose a "norm hierarchy" (e.g., medical > commercial) as a possible Ferris extension.  
  - **Flag Silences**: Contrast Ferris with Prosser’s harm-based approach to show rigour.

  Finish by noting that Mrs. Achebe’s statement—"I never dreamt anyone was reading my nights"—epitomizes the core issue: privacy as protection against *unimagined uses*, not just exposure.
