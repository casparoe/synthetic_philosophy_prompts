prompt: |-
  Hey — I'm in the final term of a philosophy of law module (2,500-word essay due in a fortnight, help) and my seminar tutor, Dr Ferris, is a privacy theorist who's weirdly strict about not letting anyone hand-wave. Every week she goes through a made-up scenario and gives a flat verdict — "violation of privacy" or "no violation" — and I've been writing them down afterwards so I can try to work out what she's actually running. Her verdicts so far, as best I remember them: (1) a photographer with a long lens shoots a well-known MP on a balcony that anyone on the street below could see into, kissing someone who isn't her husband, and it runs in a Sunday paper — no violation, she said the publicity wasn't the point, nothing was hidden, anyone could have looked; (2) a neighbour keeps a spreadsheet logging when the lights in the flat opposite go on and off, two years of it, for no reason, never shown to anybody — violation, and she was very firm, even though nothing was published and nothing happened to the person as a result; (3) you tell a friend something in confidence and they pass it to one other person you also know — violation, which I argued with, since you'd already chosen to tell someone, and she said that's exactly backwards; (4) a receptionist at a GP surgery mentions to her sister that your name was on the diabetes clinic list, the sister never repeats it, nothing comes of it — violation; (5) a corner shop runs CCTV at the till and the door, keeps it 30 days, uses it for shoplifters — no violation, even though it's continuous monitoring like case 2, and she muttered something about "what the setting licences" that I didn't get down properly; (6) a startup buys supermarket loyalty-card data, infers from what people buy that they're probably pregnant, and posts them nappy coupons — violation, and still a violation in the version where the woman is delighted and says it was the most useful post she got all year. Me and my flatmate think she's running something like: information ending up somewhere it doesn't belong, judged against what's normal for that setting rather than by whether anyone was harmed or tried to hide anything (my flatmate says that's just contextual integrity with the serial numbers filed off) — but we can't get it to fit 1 against 2 without adding "systematic monitoring isn't the same as one look", and then 5 looks strange. So maybe it's two rules at once, or maybe there's something about control or intimacy that we're missing.

  The case I actually care about is one I've invented for the essay, deliberately unlike anything she's done. A housing association fits every flat in a block with a sound monitor it calls Quiet House. It doesn't record speech; it classifies sound events — a fall, shouting, a door at 3am, long hours of wakefulness, a second adult's voice being present for months and then not. Residents sign a form as a condition of tenancy saying they understand it's there and that its purpose is falls and domestic violence. Eighteen months in, the association reads the pattern for Flat 12 — broken sleep, exits at 3am twice a week, a second voice arriving and then stopping — and uses it not to send help but to predict rent arrears, and doesn't renew the tenancy. Mrs Achebe in Flat 12 is 74 and a little hard of hearing; she says she knew the box was there and never thought about it again, and that "I never hid nothing, and I never dreamt anyone was reading my nights to decide if I could keep my home." Seperately, the association posts weekly anonymous building-level notices on the corridor board — "Flat 12: 3 night exits" — and another resident has been reading them for months and putting the pieces together.

  So: what would Dr Ferris say? Is Quiet House a violation of Mrs Achebe's privacy, is the corridor noticeboard the same violation or a second one, and — the bit I really want — what rule is she running? Please act like a legal and political philosopher who's spent a career on the ethics of surveillance, and start by brainstorming before you commit: put every candidate rule on the table that could generate all six of those verdicts, including the boring harm-based and consent-based ones and any that need two clauses, then tell me which fits best, which of them come apart on my case and where exactly they diverge, and design one further case that would actually tell the top two apart, because I'm convinced her six verdicts underdetermine this. If they genuinely do underdetermine it, say what principle she'd be signing up to with each answer. And be honest about whatever none of the rules can say anything about — she tears essays apart when people make a theory speak where it's silent.

  Give me a table with the columns: rule | its one-sentence statement | verdict on Quiet House | verdict on the corridor noticeboard | which of cases 1–6 it accounts for cleanly and which it strains on | verdict on your discriminating case. Then a single JSON object with the keys: "rules" (array of objects with "name", "statement", "fit_strength" 0–100 and "note"), "prediction" (object with "verdict", "confidence" 0–100 and "reasoning"), "closest_analog" (string: which of cases 1–6 is closest and why), "discriminating_case" (object with "description" and "predictions", the latter mapping each rule name to its verdict on that case), and "silences" (array of strings). I'll paste the JSON straight into my notes, so keep it valid.
reasoning: |-
  Hmm, this philosophy student needs help analyzing their professor's privacy framework based on six cases, and then applying it to a hypothetical scenario about a "Quiet House" monitoring system. They want a structured analysis with multiple rule candidates and a JSON output.

  First, I need to understand Dr. Ferris's pattern from her six verdicts:

  1. Photographer captures public balcony kiss → no violation
  2. Neighbor logs light patterns secretly → violation
  3. Confidential info shared with one extra person → violation
  4. Receptionist shares medical appointment info → violation
  5. Shop CCTV with limited retention → no violation
  6. Data mining for pregnancy inference → violation (even with positive outcome)

  The key themes seem to be: 
  - Harm isn't necessary for violation (cases 2,4,6)
  - Consent isn't sufficient (implied in 6)
  - Public visibility doesn't preclude violation (contrast 1 vs 2)
  - Context matters significantly (5 vs 2)

  The student's contextual integrity hypothesis fits well but needs refinement for systematic monitoring distinctions. I'll need to consider other frameworks like control theory, intimacy-based approaches, and reasonable expectation standards.

  For the Quiet House case:
  - Initial consent was for safety purposes
  - Later used for rent prediction → clear context shift
  - Noticeboard aggregation creates secondary exposure

  I'll develop several candidate rules:
  1. Control Theory
  2. Contextual Integrity (Helen Nissenbaum)
  3. Limited Access/Secrecy 
  4. Intimacy-Based (Julie Cohen)
  5. Harms-Focused 
  6. Hybrid "Normative Context + Systematicity"

  The hybrid approach seems strongest based on how it handles case 2 (systematic) vs case 5 (licensed systematic) and case 1 (non-systematic observation). 

  For the JSON output:
  - Rules array with fit scores
  - Prediction for Quiet House (violation) and noticeboard (secondary violation)
  - Discriminating case to test control vs contextual integrity
  - Silences around data ownership and repair mechanisms

  The corridor noticeboard is particularly interesting because it demonstrates how aggregation creates new privacy violations even from anonymized data. This aligns with case 6 where inferred data caused violation despite no direct disclosure.
