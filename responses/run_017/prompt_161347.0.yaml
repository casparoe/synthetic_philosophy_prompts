  Metaphysician might question the coherence of non-answerable questions. High damage if it undermines the third category. Need a clear reply about causal structure and epistemic limits.

  Philosopher of physics brings up gauge symmetries. High damage because it's a direct challenge. Reply: differentiate coordinate systems from actual subsurface structures. Admit it's a soft spot.

  Structural realist might argue that differences without observational consequences aren't real. Medium damage. Reply: emphasize causal powers and intervention.

  Observationalist might challenge grade two collapsing into observation. User's main worry. Need a strong reply: intervention's success isn't an observable outcome per se, but tied to causal structure. His reply might hold, but it's subtle.

  The "spray" slogan relates to Hacking's entity realism. Compliment, but standard objection is that it doesn't apply to unobservables. User should clarify he's talking about causal powers, not entities.

  Key strategy: Concede practical points early to scientists. Win the intervention vs observation collapse. Dreaded question: what makes intervention distinct without observation? Need a crisp answer.

  User's reply to intervention collapse: success/failure of action isn't observational data. It's about counterfactual dependence. But it's soft because outcomes are observable. Need to stress that the action's mechanism relies on hidden structure.

  Also, inhabitant-accessibility might be seen as meaningless. Reply: it's a limit case for questions beyond science's reach.
answer: |-
  Here’s your prep sheet, structured for rapid-fire Q&A. I’ve ordered objections by likely source, estimated damage (Low/Medium/High), and included replies tailored to your audience. Focus on clarity, not winning every point—your goal is to make grade-two accessibility plausible.

  ---

  ### **Objection 1 (Earth Scientists): "This is idle—we just pick the smoothest model that fits the data and move on."**  
  **Source:** Your colleagues.  
  **Phrasing:** *"In the real world, we never face your ‘inaccessible’ models. We regularize, smooth, and choose the simplest solution. Why split hairs about ontology?"*  
  **Damage:** Low (pragmatic, not philosophical).  
  **Reply:** *"Absolutely—in practice, we avoid non-uniqueness with priors. But this talk is about what the theory* allows, *not what we compute. If two models fit all data but react differently to a fracking operation, that difference matters for what’s ‘down there’—even if your software discards one."*  
  **Soft Spot:** Concedes practice but insists theory has stakes.  
  **Preemptive Move:** **Concede this in your talk upfront.** Say: *"For my former colleagues here: yes, we ‘solve’ this with Occam’s razor daily. But today’s question is whether the razor cuts reality or just convenience."*

  ---

  ### **Objection 2 (Metaphysician): "What makes a question like ‘which model is real?’ even meaningful if no one could ever answer it?"**  
  **Source:** The metaphysician.  
  **Phrasing:** *"If no possible observer—human, alien, or future—could distinguish two models, isn’t the difference just verbal? You’re inventing a ghost ontology."*  
  **Damage:** High (undercuts your entire framework).  
  **Reply:** *"The difference isn’t verbal—it’s in causal structure. If Model A collapses when we drill but Model B doesn’t, that’s a fact about the world’s ‘response’ to action. We don’t need to* observe *the hidden part to see its effects—we see the drill succeed or fail."*  
  **Soft Spot:** Leans on "effect" as indirect observation. Stand firm: *"The drill’s success isn’t data about the hidden structure—it’s a physical outcome caused by it."*  

  ---

  ### **Objection 3 (Philosopher of Physics): "This sounds like gauge symmetry—differences that don’t matter physically."**  
  **Source:** Philosopher of physics.  
  **Phrasing:** *"In general relativity, two spacetime models related by a coordinate transform are ‘the same’ physically. Your ‘intervention-accessible’ split might just be unphysical redundancy."*  
  **Damage:** Medium-High (direct challenge from authority).  
  **Reply:** *"Gauge symmetries are mathematical conveniences with no causal stakes. But in my seismic case, two different rock-layer models aren’t coordinate transforms—they imply different material strengths. If one shatters when you inject water and the other doesn’t, that’s a physical difference gauge can’t absorb."*  
  **Soft Spot:** You lack GR expertise. **Shortcut:** *"I’m not equating subsurface structures to coordinate choices. If a difference controls whether a dam collapses, it’s not gauge—it’s geology."*  

  ---

  ### **Objection 4 (Structural Realist): "If a difference isn’t observation-accessible, it’s not real—just surplus structure."**  
  **Source:** Structural realist.  
  **Phrasing:** *"Science only tracks structure preserved in data. Your ‘intervention’ outcomes are just more observations. Grade two is grade one in a hard hat."*  
  **Damage:** High (attacks your core thesis).  
  **Reply:** *"Intervention isn’t about new data—it’s about counterfactual dependence. Imagine two models predicting identical seismic waves, but one has a brittle layer. If you* try *to fracture it, you’ll succeed in one world and fail in the other—even if no instrument records it. The difference is in what* allows *the action, not what we measure."*  
  **Soft Spot:** Risk of circularity. **Key nuance:** Emphasize that the intervention’s *feasibility* depends on hidden structure, not its observable outcome.  

  ---

  ### **Your Worry #1: "Intervention collapses into observation."**  
  **Likely Source:** Observationalist or structural realist.  
  **Phrasing:** *"You say interventions ‘succeed or fail’ based on hidden structure—but isn’t that success/failure an observation? Grade two is just a subset of grade one!"*  
  **Damage:** Critical—**this is the objection you MUST win.**  
  **Your Reply (and why it works):** *"No—because ‘success’ here isn’t an observation; it’s a counterfactual. Suppose we* don’t *drill. The models remain empirically identical. The difference is that if we* were *to act, one would respond differently. That ‘if-then’ isn’t data—it’s a causal power built into reality."*  
  **Why it’s Soft:** It relies on modal claims (what *would* happen). **Defend with:** *"Causal powers aren’t observations—they’re what make actions possible or impossible. You can’t ‘observe’ fragility; you discover it by trying to break things."*  

  ---

  ### **Your Worry #2: The "Spray it" Slogan**  
  **Source:** Anyone (likely observationalist).  
  **Phrasing:** *"Isn’t this just Ian Hacking’s entity realism—‘if you can spray it, it’s real’?"*  
  **What it is:** Yes, you’ve independently reinvented a core idea in **entity realism** (Hacking, 1983).  
  **Compliment or Disaster?** Compliment! It anchors you in respected philosophy of science.  
  **Standard Objection:** *"Spraying electrons only proves you can manipulate them—not that your theory about their ‘essence’ is true."*  
  **Your Reply:** *"Hacking’s right about intervention as a reality test. But I’m going further: some things you can’t spray or see—like subsurface layers—but if your ability to fracture rock depends on them, they’re not just theoretical ghosts. That’s grade two: not about spraying entities, about acting on structure."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"What’s the difference between ‘inhabitant-accessible’ and metaphysical nonsense? If even an observer inside the region couldn’t report back without altering the setup, how is this not just fantasy?"*  
  **Why it’s Dangerous:** Exposes grade three as epistemically empty.  
  **If Asked:** *"It’s a limit case showing where science stops. If a difference is truly isolated from all possible interactions—even from observers embedded in it—then insisting it’s ‘real’ adds nothing. But note: in seismic models, this might apply to, say, microscopic voids that affect nothing. That’s not nonsense—it’s a boundary for meaningful questions."*  
  **Damage Control:** Pivot quickly to grade two’s solidity.  

  ---

  ### **Quick Strategy Cheat Sheet**  
  - **Concede Early:** Practical Earth science objections (do this in your talk).  
  - **Win at All Costs:** The intervention/observation collapse objection (your grade two is the thesis).  
  - **Deflect Gracefully:** Gauge symmetry ("I’m not a physicist, but here’s why my case is different").  
  - **Embrace the Slogan:** Cite Hacking as a ally, then extend to hidden structures.  
  - **Core Soundbite:** *"Intervention isn’t about seeing—it’s about doing. If the world ‘pushes back’ differently, something real is there, even if it’s invisible."*  

  You’ve got this. Your inverse-problems expertise frames ontology in a way philosophers rarely hear—use that authority. When stuck, say: *"In my field, we call this ‘non-uniqueness with causal stakes’—and we bet lives on it."* Good luck!
