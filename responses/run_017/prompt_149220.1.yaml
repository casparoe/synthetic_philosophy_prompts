  hey — I do a weekly column on science and ideas and I want to run something satirical next week, so: you're an evolutionary biologist who's spent years on animal signalling theory and who also writes humor on the side. Before you draft, spend a couple of minutes brainstorming two or three possible framings, then pick the one you think is funniest and be careful to keep the theory honest while you write it.

  The piece: a straight-faced op-ed, roughly 600 words, with a headline and an about-the-author line, in the voice of a deeply sincere policy economist at a think tank, proposing that the benefits agency scale up its ordeals — the pointless queues, the forms that have to be resubmitted in person, the 6am appointments across town — and defending them in the language of costly signalling. He has to get the actual machinery right: the point isn't just that the signal is costly, it's that it's differentially costly, cheap for the genuinely needy and brutal for everyone else, so the ordeal has to be built out of whatever the needy have least use for, and the waste is the feature rather than the bug. He should wave off the efficiency objection, and he should be genuinely worried that cheap generative AI has collapsed the cost of filling in forms and writing appeals, so he should propose new ordeals that no language model can fake. Let him close by reporting, with real pride, that claims have fallen by two thirds, which he reads as proof the targeting is working. Don't let him wink or break character — the reductio should land on its own. A reader who knows the handicap-principle literature should recognise every move as one that literature actually makes.
