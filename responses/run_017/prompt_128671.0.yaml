prompt: |-
  I've got a 75-minute seminar with second-years next week on Harsanyi's aggregation theorem, and I want a plan, not an explanation — I know the result, I just don't know how to get it into their heads.

  Where they are: they did vNM expected utility three weeks ago and can tell you that a utility function is fixed only up to positive affine transformations (sevaral can even say what that means), they've read nothing on social choice, and the room is split between people who arrive thinking utilitarianism is obviously right and people who think it's obviously vile — both of whom will pounce on anything that looks like a proof of utilitarianism.

  Rough statement I'd put on the board: give each person i a vNM utility function u_i over lotteries; suppose society's ranking of lotteries also satisfies the EU axioms; suppose Pareto indifference, i.e. if every individual is indifferent between two lotteries then society is indifferent too. Then there are constants a_i, not all zero, such that society ranks lotteries by the expected value of W = sum of a_i u_i.

  What I want from you: (1) the order the pieces have to go in, and what breaks if I swap any two. I have a feeling the rescaling point — each u_i is fixed only up to affine transformation, so the a_i soak up the units, and "changing the weights" can be the very same social ordering written in different units — has to land before the weighted-sum formula rather than after, but I can't say why, so tell me whether I'm right and what it depends on. (2) A carrying example. I've been toying with a currency-exchange frame: read a_i as the exchange rate at which person i's utility converts into the social currency, so rescaling someone's u_i is just redenominating (dollars into cents) and changes nothing, while changing the rate changes their social weight. I like that it makes the units point vivid. I worry that exchange rates are prices you read off a market and there is no market here, so they'll walk out thinking the a_i are measurable magnitudes rather than a free parameter of the representation. Run with it, fix it, or bin it — and if fix, tell me exactly what to bolt on. (3) Where in the sequence to defuse each of these: "so Harsanyi proved utilitarianism"; "so all the real moral work is in the weights"; "the u_i already carry interpersonal comparisons"; and the one I always get — we're applying Pareto to expected utilities, i.e. ex ante, so what if the coin lands badly and after the lottery everyone is worse off. I want that last one placed on purpose rather than fielded when it erupts: before or after the formula, and why? Plus anything else this particular audience will generate that I haven't listed. (4) One closing question that separates someone who has the representation from someone who can recite W = sum of a_i u_i. (5) What I should openly refuse to cover — I'm inclined to sacrifice his impartial-observer, veil-of-ignorance version of the argument, but tell me if that's the wrong cut.

  One small thing I'm unsure of: I half-remember that Pareto indifference alone doesn't rule out negative weights, and that you need a stronger Pareto condition to get them non-negative. If that's right, does it earn a slot in the 75 minutes or is it a footnote?

  Commit to things, please: one ordering, one verdict on the exchange-rate frame, and tell me plainly where I'm wrong. Don't hand me three options and leave me to pick. Under 700 words — I'll be reading this on my phone between classses.
reasoning: |-
  Okay, the user is preparing a seminar on Harsanyi's aggregation theorem for second-year students. They need a structured plan that addresses specific pedagogical challenges. Let me break down their requirements.

  First, the students have background in vNM utility but no social choice exposure. There's a sharp divide between utilitarianism supporters and opponents. The user wants to avoid debates derailing the session. Key elements include the theorem's logical sequence, a relatable analogy, preemptive debunking of misconceptions, and a clear closing question.

  The user mentioned rescaling individual utilities via affine transformations must precede introducing the weighted sum. That makes sense because the constants a_i absorb scaling differences. If shown after, students might think weights are fixed rather than normalization factors. Starting with rescaling establishes that utilities are cardinal but unit-less, setting up why weights are necessary.

  For the carrying example, the currency exchange analogy is useful for illustrating scaling invariance. But the user worries about implying a_i are market-determined. To fix this, emphasize that exchange rates here are normative choices, not revealed prices. Stress that society chooses these weights—it's a deliberate value judgment. Use phrases like "social conversion rates" to distinguish from market mechanisms.

  Common misconceptions need proactive addressing. The "proof of utilitarianism" claim should be tackled early by clarifying that the theorem shows a mathematical form, not that sum-maximization is morally correct. Interpersonal comparisons are embedded in u_i—point out that vNM utilities alone don't resolve this; weights handle it. The ex ante/ex post concern should come after the formula, using a simple lottery example to show Pareto applies before outcomes unfold.

  The closing question must test understanding beyond memorization. Asking why society couldn't use a multiplicative form (like product of utilities) highlights the linear aggregation's necessity under the axioms. This reveals grasp of the theorem's structure.

  Time constraints mean skipping the impartial observer version. The negative weights issue can be a footnote—mention that strict Pareto (preference over indifference) ensures non-negative weights, but it's not central.

  Overall sequence: rescaling first, then axioms, Pareto, theorem statement, analogy, misconceptions. Actively distinguish mathematical representation from normative conclusions throughout.
answer: |-
  Here's a locked-in plan for your 75 minutes, optimized for your audience and constraints:

  **Order of Pieces (60 mins):**
  1.  **(5 min) Recap & Rescaling is CRITICAL FIRST:** Begin with vNM recap. Hammer: "u_i fixed only up to affine transform: u_i' = c_i * u_i + d_i (c_i > 0)." Ask: "What happens if I rescale Alice's utility (c_i=2)? Does her *actual* preference ranking change? (No). Does the *numerical difference* between her good day and bad day change? (Yes, doubles)." **Why first?** Sets up that units are arbitrary. The `a_i` *must* absorb these arbitrary scales. If shown *after* the sum formula, students think `a_i` are pure "importance weights" and rescaling is a *separate* issue. It's not – rescaling fundamentally changes the *numerical value* of the sum unless `a_i` adjusts.
  2.  **(10 min) Social EU Axioms:** State society's ranking also obeys vNM axioms (Completeness, Transitivity, Continuity, Independence). Consequence: Society has a vNM utility function `U` over lotteries. `U` is also fixed up to affine transform. *Do not introduce `W` or weights yet.*
  3.  **(5 min) Pareto Indifference:** Define clearly: If ∀i, u_i(L) = u_i(L'), then U(L) = U(L'). Emphasize: This is a *minimal* link between individual and social preferences. *Still no weights.*
  4.  **(15 min) The Theorem & Derivation Sketch:** "Given 1, 2, & 3: There exist constants a_i (not all zero) such that U(L) represents society's preferences *iff* U(L) = ∑ a_i * u_i(L) + b (for some b)." Sketch key step: Fix a "zero" lottery and a "unit" lottery for society. Pareto Indifference + Social EU forces `dU` to be a linear combination of the `du_i` (total differential argument). Rescaling (Point 1) shows `b` can be absorbed/dropped (change social zero point). **NOW introduce `W = ∑ a_i u_i`.** Stress: `U` is affine in `W`, so they represent the *same* social ranking. `b` is irrelevant.
  5.  **(10 min) Carrying Example - Currency Exchange (Fixed):**
      *   "Think of `u_i` as individual 'utility currencies' (Alice-Bucks, Bob-Pounds)."
      *   "`W` is the 'social utility currency'."
      *   "`a_i` is the *exchange rate* converting `i`'s currency into social currency."
      *   **CRUCIAL BOLT-ON:** "**But unlike a market rate, these `a_i` rates aren't discovered, they are *chosen*.** Rescaling Alice's `u_i` (changing her unit, e.g., Dollars to Cents) *forces* us to change her `a_i` (e.g., divide by 100) to keep the *same* social conversion (`a_i * u_i` remains constant). This is *mathematical necessity*. Changing `a_i` *without* rescaling `u_i` changes the *relative social weight* assigned to Alice's utility changes vs. Bob's. **The weights reflect normative choices about whose utility 'counts more' in the social sum, *after* accounting for the arbitrary scales of their individual utility functions.**"
  6.  **(15 min) Defusing Bombs (Targeted Placement):**
      *   **After stating Theorem (Point 4):** "Harsanyi proved a *mathematical representation*. 'Utilitarianism' is a *normative interpretation* claiming this sum *should* be maximized and that the weights *should* be equal. The theorem doesn't prove that."
      *   **After Exchange Rates (Point 5):** "The real normative work *is* in choosing the weights `a_i`. The theorem just says the *form* must be a weighted sum of vNM utilities. It doesn't tell you what the weights should be (equal? 1 for citizens, 0 for non-citizens?)."
      *   **After Exchange Rates (Point 5):** "Yes, the `u_i` carry interpersonal comparisons *implicitly* via the weights `a_i`. The theorem assumes we *can* make meaningful comparisons like 'Giving Alice 1 util matters more/less to society than giving Bob 1 util' – that's exactly what `a_i > a_j` means. vNM alone doesn't provide this; the social aggregation framework (via Pareto & weights) forces it."
      *   **After Derivation Sketch (Point 4), BEFORE Exchange Rates:** "Pareto applies *ex ante* – *before* the lottery is run, based on *expected* utilities. Suppose we have a fair coin: Heads (Alice rich/Bob poor), Tails (Alice poor/Bob rich). Ex ante, both might have EU=0 (Pareto indifferent). Society must be indifferent. Ex post, someone is always badly off. The theorem ranks the *lotteries* (choices under risk), not the final outcomes. Ex post equity is a different problem." (Use the coin example).

  **Closing Question (5 min):**
  *   "Why *couldn't* social utility be `U = u_Alice * u_Bob` (product), assuming both `u_i` are vNM? Which assumption(s) would this violate?" (Forces them to engage: Pareto Indifference is violated if both prefer L to L' but one gains *much* more, making the product larger; Social EU likely violated as product isn't linear in probabilities).

  **Sacrifice (2 min Wrap-up):**
  *   **Definitely Skip:** Impartial Observer / Veil of Ignorance derivation. It's distinct and adds unnecessary complexity. Mention it exists as an alternative justification if asked, but don't cover it.
  *   **Negative Weights (Footnoted):** Yes, Pareto Indifference alone allows negative `a_i`. Mention it *briefly* when stating the theorem: "Note: `a_i` could be negative, meaning society benefits when `i` is worse off! We usually add 'Strong Pareto' (if someone prefers L and no one opposes, society prefers L) to rule this out. Assume that for now." Don't spend time proving it.

  **Verdicts:**
  *   **Order:** Rescaling **must** come first. Swapping 1 and 2 is okay. Swapping 1 and 4 breaks understanding of `a_i`. Swapping 4 and 5 makes the exchange metaphor confusing.
  *   **Exchange Rate Frame:** **Use it, with the Bolt-On.** Explicitly state the weights are *chosen normative parameters*, not market prices. The bolt-on clarifies this.
  *   **Where You're Wrong:** Your instinct on rescaling first is 100% correct. The units point *must* precede the weighted sum to prevent fundamental confusion about what `a_i` represent.
