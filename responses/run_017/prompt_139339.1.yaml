prompt: |-
  found these lecture notes online (some econ dept's undergrad game theory course, not a book I can check) and the page on iterated deletion with mixed strategies ends with a paragraph of general claims that I can't tell are right. the worked example is this game, row player's payoff first:

          L        C        R
  T    (4, 4)   (0, 0)   (2, 1)
  M    (0, 0)   (4, 4)   (2, 1)
  B    (1, 0)   (1, 0)   (1, 4)

  the paragraph says, more or less:

  1. a strategy is strictly dominated when you have another single strategy of your own that does better against everything the others could do; cross those out, look again at the smaller game, repeat.
  2. letting mixtures do the deleting buys you nothing new: if a 50-50 mix of T and M strictly dominates B, then either T or M already strictly dominates B on its own.
  3. equivalently, a strategy survives iff there is some belief about the other players' play — a mixed strategy for each of them, picked independently — under which that strategy is a best response.
  4. since a strictly dominated strategy is never a best response, no Nash equilibrium puts positive probability on one, so the survivors contain every equilibrium; and if the procedure pares the game down to a single profile, that profile is the unique Nash equilibrium.
  5. order doesn't matter — cross out strictly dominated strategies in whatever order you like and you land on the same survivors, and that stays true when the things doing the eliminating are mixed.
  6. the mixtures aren't just bookkeeping: if a 50-50 mix of T and M dominates B, then what the theory tells the row player to actually do is randomize 50-50 between T and M.
  7. and in the game above the notes say it stops after deleting B, with {T, M} x {L, C, R} as the final answer.

  my instinct is that 2 is wrong (B looks like it's only beaten by the mix, not by T or M alone) and 6 smells wrong too, but 3 and 5 I genuinely can't tell, 1 feels like it's quietly leaving something out, and 7 I have no idea how to check. can you go through them one at a time and tell me which are right, which are subtly off, and which are just wrong, using the game where it helps rather than just restating the claims?

  commit to a verdict on each — don't give me a survey of what people might say. if there's exactly one you're really unsure about, flag it and say what would settle it, but don't hedge the rest. under 400 words total.
reasoning: |-
  Okay, let me tackle this step by step. The user found lecture notes on iterated deletion with mixed strategies and has specific claims they want verified using the given game matrix. I need to evaluate each claim individually and commit to clear verdicts.

  First, claim 1 says strict domination requires a single dominating strategy against all opponent moves. That's correct - strict domination means one pure strategy always beats another, regardless of opponents' actions. The notes got this right.

  For claim 2, the user suspects it's wrong. Looking at the game: B gets (1,0) vs L/C/R. T gets (4,0,2) and M gets (0,4,2). Neither T nor M dominates B alone since T loses to C (0<1) and M loses to L (0<1). But a 50-50 mix of T/M gives expected payoffs of (2,2,2) which dominates B's (1,1,1). So yes, claim 2 is false - mixtures can dominate when single strategies can't.

  Claim 3 states survival equals being a best response to some belief. This is fundamental rationality - if a strategy isn't completely dominated, there exists some belief (mixed strategy by opponents) where it's optimal. True.

  Claim 4 says Nash equilibria only use undominated strategies. Correct - no equilibrium uses strictly dominated strategies. And if deletion leaves one profile, it must be unique Nash. True.

  Claim 5 says deletion order doesn't matter. For strict domination (pure or mixed), this holds because deletion is monotonic. True.

  Claim 6 is problematic. The theory identifies dominated strategies to eliminate, not to prescribe mixing. Randomizing 50-50 T/M is one rational choice but not necessary - players could choose pure T or M if they believe opponents won't play R. So claim 6 is false - mixtures are for dominance checks, not required play.

  Claim 7 says deletion stops after removing B. After removing B, column player has no strictly dominated strategies: L pays (4,0,1) vs C's (0,4,1) and R's (1,1,1) - none dominate others. Similarly, row's T and M aren't dominated. So deletion stops there correctly. True.
answer: |-
  Here's your verdict on each claim, using the game for analysis where relevant:

  1.  **✅ Correct.** The definition is standard: a strategy *s* is strictly dominated if there exists another single strategy *s'* such that *s'* gives a strictly higher payoff than *s* against *every* possible combination of opponents' strategies. This is the foundation of iterated strict dominance (ISD) with pure strategies.
  2.  **❌ False.** In this game, B is strictly dominated by a 50-50 mix of T and M: Against L: (0.5\*4 + 0.5\*0) = 2 > 1. Against C: (0.5\*0 + 0.5\*4) = 2 > 1. Against R: (0.5\*2 + 0.5\*2) = 2 > 1. However, neither T nor M dominates B alone: T loses to C (0 < 1), M loses to L (0 < 1). Mixtures *can* detect strictly dominated strategies that no single pure strategy dominates.
  3.  **✅ Correct.** This is a fundamental theorem: a strategy survives iterated strict dominance (using mixed strategies for deletion) if and only if it is a best response to *some* (possibly correlated) belief over the opponents' strategy profiles. (The notes say "mixed strategy for each... independently", implying a belief that is a product distribution; while the result holds for correlated beliefs too, the core equivalence is correct).
  4.  **✅ Correct.** Strictly dominated strategies can never be best responses (to any belief), so no Nash equilibrium (NE) uses them. The survivors contain all NE. If ISD leaves only one strategy profile, it must be the unique NE.
  5.  **✅ Correct.** For iterated strict dominance (allowing mixed strategies for deletion checks), the order of deletion does not matter; you always end up with the same set of surviving strategies.
  6.  **❌ False.** The procedure identifies dominated strategies to *eliminate*, not to prescribe play. After deleting B, Row has two undominated pure strategies (T and M). Row *could* rationally play the 50-50 mix, but could *also* rationally play pure T or pure M depending on their belief about Column. The process doesn't dictate mixing; it only says B is irrational.
  7.  **✅ Correct.** After deleting Row's B (dominated by the T/M mix), examine the reduced game (T, M vs. L, C, R). No Column strategy is strictly dominated by any other pure or mixed strategy: L (4,0) vs. C (0,4) vs. R (1,1) – none dominates another across T and M. Similarly, neither T nor M dominates the other (T beats C but loses to L, M beats L but loses to C). Deletion stops at {T, M} x {L, C, R}.
