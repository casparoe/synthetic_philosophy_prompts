prompt: |-
  I've been trying to work out what I actually think art is, not by reading about it but by going case by case on my gut, and my guts don't add up. Help me find the principle behind them.

  My cases and my verdicts:

  - Duchamp's urinal, the shop-bought one he entered as a readymade: art, and I'm bored of pretending to be shocked by it.
  - A mass-produced ceiling lamp from a flat-pack furniture shop, currently in my hallway: not art. I know that's more or less the same move Duchamp made and I don't care, it still isn't. This is the pair I can't reconcile, and every answer I try — it's in a gallery, it was chosen, it has a title, people wrote about it — just pushes the question back a step.
  - A painting in the style of Rembrandt, made in the 1890s, hung in a museum as a Rembrandt for a hundred years, then exposed as a forgery: still art, but I definately feel it got worse the moment we found out, and I can't tell whether that feeling is about the object or about me.
  - A canvas painted by a zoo chimpanzee, sold at a charity auction, looks just like a 1950s abstraction: not art.
  - A recording of humpback whale song, slowed down eight hundred times, released as an album by someone whose only contribution was pressing record and turning a dial: art, just about. Which is pure snobbery next to the chimp verdict, and I can't give it up.
  - A glacier in Iceland that an artist declared a work on her website: she never went there, never touched it, just posted the coordinates. People flew out and say it changed them. No idea, leaning no.
  - A recruitment poster for a regime I loathe, beautifully designed: art, and its politics don't disqualify it. A really well-designed motorway sign: not art, even though it's also designed to move you to act.
  - An AI-generated image from someone who spent weeks art-directing it: art. The same model's output from one lazy prompt: not art, even when the two look basically identical.
  - My niece's drawing on the fridge: not art, and I feel like a git saying so.
  - The one I keep flipping on: a man who spent thirty years secretly carving a staircase that goes nowhere in his basement, found after he died, no title, no statement, no audience, no intention of anyone ever seeing it.

  My own stab: something is art if someone put it forward to be experienced for its own sake by some audience. That sorts the poster from the motorway sign, dies on the staircase and the glacier, and I don't think it separates the lamp from the urinal at all.

  Please don't give me a survey of isms — I know the institutional, historical and aesthetic families exist, I don't need the labels reattached to them. Give me the working thing, clause by clause.

  Sections, in this order:

  - "My verdicts, restated" (~150 words): the pattern you think is actually in my list, sorted, not just repeated.
  - "The principle" (~300 words): your candidate, stated precisely enough that I could apply it myself, each clause tied to the case that motivates it, plus a runner-up if there's a real choice between saving every one of my verdicts with something ugly and dropping one for something clean.
  - "What it decides" (~200 words): verdicts on three or four cases I haven't listed, including the staircase, and at least one you think I'd hate.
  - "What it overturns" (~150 words): which of my verdicts your principle can't keep, and which one you'd drop first.
  - "Settled vs contested" (~150 words): which claims of yours are genuinely agreed among people who work on this and which are one side of a live argument — don't quietly present a contested view as the consensus. And tell me honestly whether the "stop asking for a definition, it's a family-resemblance word" line is actually the majority position or just a famous one.

  British English throughout, please.
reasoning: |-
  Okay, the user is wrestling with what makes something art, using specific examples where their gut reactions seem contradictory. They've listed various cases - from Duchamp's urinal to their niece's fridge drawing - and want a coherent principle that explains their judgments without resorting to art theory jargon. 

  Hmm, their frustration is palpable. They've clearly wrestled with this deeply, rejecting easy answers like institutional acceptance or intentionality. The Duchamp vs. IKEA lamp contradiction is their central knot - identical gestures but different verdicts. And that staircase case haunts them; it challenges all simple definitions.

  I notice their rejected stab ("presented for its own sake") fails precisely where their intuition is most conflicted (the glacier, the staircase). They want consistency but won't sacrifice their concrete judgments for theoretical neatness. Smart.

  The whale/chimp asymmetry is fascinating. They admit it feels snobbish but can't abandon it. That's a clue - some unarticulated value on human *process* over outcome. Similarly, the forgery loses value upon exposure despite identical appearance. The basement staircase flips because it exists in that ambiguous space between private compulsion and public offering.

  What they're circling is something about communal recognition - not just institutional validation, but whether the object enters human conversation *as art*. The lamp isn't art until Duchamp makes it a proposition; the staircase becomes art when discovered because we retroactively grant it that status. The forgery dims because the conversation around it changes.

  But "conversation" is too vague. Need to operationalize it. Perhaps: art requires (1) human creative labor that (2) becomes a site of shared attention. That covers the whale album (labor in selection/editing) versus chimp painting (no framing labor), separates lamp (utility) from urinal (reframed), explains why the staircase flips (discovery makes it a shared object). 

  Ah, but the glacier declaration fails - no labor beyond typing coordinates. The niece's drawing lacks framing for shared attention. The recruitment poster is designed for shared experience, the motorway sign isn't. Even the AI cases: weeks of art direction is framing labor, a lazy prompt isn't.

  ...Yet this feels cold on the forgery. The creative labor was real (the forger's skill), the shared attention existed for a century. Why does it "get worse"? Maybe because art isn't just labor + attention, but *authentic* labor? But authenticity is murky. Perhaps it's about the *terms* of attention being violated - we feel cheated because the conversation was predicated on a lie.

  For the cases they didn't list: Warhol's Brillo boxes would be art (framing labor via gallery context), a sunset isn't (no labor), but a video of a sunset could be (if framed as such). Their hated verdict might be that a masterfully restored antique vase isn't art - the labor is preservative, not creative.

  Would have to drop their "niece's drawing is not art" verdict - by this principle, if the family treats it as art (framed on fridge, discussed), it weakly qualifies. But that might feel right to them; they already feel guilty for dismissing it.

  Among theorists, the labor + framing view leans institutional but isn't consensus. The "family resemblance" position (Weitz) is indeed mainstream now, but unhelpful for their craving of principles. Should flag that this proposal is a hybrid of Dickie's institutionalism and Becker's "art worlds" - controversial but defensible.

  The staircase verdict will hurt: by this principle, it only becomes art posthumously when discovered. That preserves their flip-flopping but might feel unsatisfying. Still, honesty matters - they want their contradictions resolved, not smoothed over.
answer: |-
  Here’s a principle distilled from your verdicts, clause by clause, in British English throughout:

  ### My Verdicts, Restated
  Your pattern hinges on **human creative labour** and **framing for shared attention**. The urinal was reframed as art through deliberate gesture; the lamp remains functional. The forgery’s labour (though deceptive) was human and skilful; the chimp’s was instinctive. The whale album involved human curation; the glacier declaration lacked labour. The poster was crafted for aesthetic engagement; the motorway sign for utility. The AI image required art direction; the lazy prompt did not. Your niece’s drawing lacks framing; the staircase, though private, compels attention through extreme labour. You reject institutional authority alone (e.g., the forgery’s demotion upon exposure).

  ### The Principle
  **Something is art if it is an output of deliberate human creative labour, framed to invite shared attention for its own sake.**  
  - *Clause 1: Deliberate human creative labour*  
    (Motivated by: forgery [skilled labour], chimp [no human agency], AI weeks [curation] vs. lazy prompt [minimal labour], staircase [obsessive craft]).  
  - *Clause 2: Framed to invite shared attention*  
    (Urinal [gallery context], lamp [no framing], poster [aesthetic intent], whale album [album release], glacier [declaration insufficient without labour]).  
  - *Clause 3: For its own sake*  
    (Recruitment poster [experienced aesthetically], motorway sign [functional purpose]).  

  **Runner-up**: *"Art is what is offered to a community as a focus for aesthetic attention."*  
  - Saves all except the staircase (no offering) and glacier (no labour). Your verdicts prioritise labour, so the main principle is cleaner.

  ### What It Decides
  - **Staircase**: **Art**. Human creative labour (30 years carving), discovered as an object demanding attention.  
  - **Graffiti in a derelict warehouse, unsigned**: **Art**. Labour + framing (public display for engagement).  
  - **A perfect AI replica of a Beatles song, no human input**: **Not art**. No human labour (contrast your AI verdict).  
  - **A child’s spontaneous mud pie, presented to you as "art"**: **Art**. Labour + framing (offered for attention).  
  - **Sunset viewed from a motorway**: **Not art**. No human labour or framing.  
  *(You’ll hate the mud pie: but Clause 2 captures your niece’s drawing if framed, which it wasn’t.)*

  ### What It Overturns
  - **Cannot keep**: Your **glacier verdict (leaning no)**. By this principle, it’s clearly not art (no labour).  
  - **Would drop first**: Your **niece’s drawing verdict**. If she framed it as art ("Look at my picture!"), it meets Clause 2; your guilt hints you sense this. The principle forces consistency: either reject both niece and mud pie, or accept both when framed.  

  ### Settled vs. Contested
  - **Settled**: Broad agreement that *intention* and *context* matter (Duchamp vs. lamp). **Contested**: Whether *labour* is essential (e.g., conceptualists reject it; your glacier case splits opinions).  
  - **Settled**: Institutional/historical acceptance *influences* but doesn’t *define* art (your forgery’s devaluation shows this).  
  - **Contested**: The role of "audience" – your staircase exposes this. Many theorists (e.g., Danto) demand publicness; others (like me) argue discovery *creates* the audience retroactively.  
  - **Family-resemblance (Wittgenstein/Weitz)**: This **is the dominant academic view** (art has no essence, only overlapping features). It’s why your cases feel irreconcilable. But your demand for a principle rejects it – rightly, as it dodges the work. My principle is a hybrid of **neo-formalism (labour)** and **pragmatism (framing)**, leaning into your instinct that *human making* and *presentation* are non-negotiable.  

  ---
  **In short**: Art is a **human-made thing, laboured over, held up to say: "Look at this. Consider it."** The lamp fails on framing; the glacier on labour; the staircase wins on both upon discovery. The rest follow.
