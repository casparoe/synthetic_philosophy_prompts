  First, should unpack the orthofunctional pathology concept. It's compelling - if the sleep pattern itself isn't dysfunctional, is medicating it ethical? But the distress is real. Then the economist's point: drug coverage is a "band-aid" that doesn't fix the root mismatch with societal structures. But the committee can't mandate workplace changes. 

