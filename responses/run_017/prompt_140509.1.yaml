prompt: |-
  I am designing a ninety-minute session for a continuing-education reading group of educated non-specialists — a retired judge, a physician, and a high-school physics teacher, say — who follow artificial intelligence in the news but have no background in computer science or machine learning. The session belongs to a short course on the problem of overseeing systems that eventually come to know more than the people who are supposed to be overseeing them. I have to teach them exactly one idea, and I want a plan for the explanation rather than the explanation itself.

  The idea is the central argument for scalable oversight through debate: that a human who could not answer a hard question on her own can nevertheless get at the truth by staging a contest between two systems that both know more than she does, because her judgment is only ever comparative — which side's account hangs together better, once each side has been pressed on the details — because it is costlier to maintain a coherent falsehood under cross-examination than to state the truth, and because the reward structure can be arranged so that each side is trying to expose the other. Call this the 'asymmetric-cost-of-lying' rationale for debate.

  Here is what I need from you.

  First, the order. What has to be in place before the idea can even be stated — presumably the problem of scalable oversight itself, and the thought that simply asking a system to explain itself is not by itself enough — and in what order the remaining pieces must arrive: the move from answering a question to judging a contest, the comparative character of the judge's verdict, the role of cross-examination, the incentive structure that makes each side want to find the other's weak point, and the residual limits of the mechanism. For each piece, tell me what depends on what, and tell me what breaks in the explanation if two of them are swapped.

  Second, the one example that carries the whole session. It must have: an object-level question the judge could never settle on her own and has no cheap way to look up; a false answer that forces the liar to commit to further, apparently checkable details, so that defending the lie really is harder than telling the truth; and a severely limited verification channel — say, a single expensive check the judge may spend once, at the very end — so that the judge's own resources are scarce and the debate has to do the work. It must lack anything that lets style, confidence, or credentials carry the verdict, since the whole point is that the judge is tracking argumentative merit rather than being persuaded, and it must lack any cheap or repeatable way for the judge to verify the object-level claim. Give me the concrete scenario, and tell me why you chose it over a courtroom cross-examination, which is the first analogy this audience will reach for and which I suspect is misleading in specific ways, and over the simpler setup in which one system is merely asked to show its reasoning.

  Third, the misconceptions, and where in the sequence to defuse each. They will predictably form some of these: that the judge must secretly know the right answer in order to score the debate at all; that debate works by averaging two opinions, or by letting truth 'win' in some automatic way; that the more fluent or confident debater will simply be more persuasive and will prevail regardless of accuracy; and — the one I most want handled — the failure mode I have started calling 'symmetric collusion'. This is the situation in which both debaters notice that if they converge on a single false but mutually consistent story, the judge will find them equally convincing, will have no comparative signal to go on, and will fall back on a tie-break that does not track the truth, so that colliding is at least as good for each of them as fighting it out. For each misconception, tell me at exactly which point in the sequence you would head it off, what you would say there, and why raising it earlier or later would either confuse the group or leave the misconception intact. In particular, tell me how the sequence should be built so that when symmetric collusion finally appears, it reads as a precise limit on a mechanism the group now genuinely understands, rather than as a reason the whole idea was never going to work.

  Fourth, the check. Give me one question I can put to the group at the end whose answer shows they have the mechanism rather than the slogan — something that makes them apply the dependency structure to a variant, such as a variant in which the reward is not zero-sum, or one in which the judge's tie-break is known to be biased toward whichever answer is shorter — and tell me what a genuinely correct answer and a merely superficially correct answer would each sound like.

  Fifth, what I should deliberately leave out at this level and say so. I take it that the actual training loop, the game-theoretic machinery, and other scalable-oversight proposals should be off the table; tell me what else you would exclude, how you would mark the exclusion for the group, and what you would say if someone asks about it.

  Do not give me a reading list, a bibliography, or citations of any kind; I need the architecture of the session.
reasoning: |-
  We are designing a 90-minute session on the "asymmetric-cost-of-lying" rationale for scalable oversight via debate. The audience is educated non-specialists. We must teach exactly one idea: that a human can judge a debate between two more knowledgeable systems to get at the truth because maintaining a coherent falsehood under cross-examination is costlier than telling the truth.

  ## First: The Order of Explanation

  The explanation must build step by step. Here is the sequence, with dependencies and what breaks if swapped:

  1. **The Problem of Scalable Oversight**: Start with the core problem: how can a human supervisor oversee an AI system that is more knowledgeable than they are? Emphasize that we cannot rely on the AI to simply explain itself because it might lie or be misleading. *Dependency*: This is the foundation. Without establishing the problem, the rest has no motivation.

  2. **The Inadequacy of Simple Explanation**: Explain that just asking the AI for an explanation is insufficient because the supervisor lacks the expertise to verify it. *Dependency*: Builds on step 1. If swapped with step 1, the problem context is missing and the solution seems unmotivated.

  3. **The Move to Comparative Judgment**: Introduce the idea that while a human cannot directly verify a complex answer, they can compare two competing answers and see which one holds up better under scrutiny. *Dependency*: Requires steps 1 and 2 to establish why we need this move. If introduced earlier, the need for comparison isn't clear.

  4. **The Role of Cross-Examination**: Explain that each side must be able to question the other (like in a debate) to force the systems to defend their positions. This exposes inconsistencies. *Dependency*: Builds on step 3. Without the comparative setup, cross-examination has no context. If moved earlier, we haven't set up the two-system contest.

  5. **The Asymmetric Cost of Lying**: Argue that constructing and maintaining a coherent lie under detailed questioning is harder (more costly) than telling the truth because lies require more fabrication and are prone to inconsistencies. *Dependency*: Requires step 4 (cross-examination) to show how lies break down. If placed before step 4, the mechanism for exposing lies is missing.

  6. **The Incentive Structure**: Explain that the debate is set up as a zero-sum game: each system is rewarded for exposing flaws in the other's argument, so they are motivated to find weaknesses. *Dependency*: Builds on step 4 (cross-examination) and step 5 (asymmetry). Without step 5, the incentive structure lacks a reason why this works. If moved earlier, the reward structure seems arbitrary.

  7. **Residual Limits**: Finally, acknowledge that the method isn't perfect and discuss the symmetric collusion problem (and other limits). *Dependency*: Must come after the core mechanism is understood (steps 1-6). If introduced too early, it undermines the core idea before it's built.

  *What breaks if swapped*:
  - If step 2 (inadequacy of explanation) is swapped with step 1, the problem isn't clearly defined first.
  - If step 5 (asymmetric cost) comes before step 4, we haven't explained how lies are exposed.
  - If step 6 (incentives) comes before step 5, we don't know why the incentives lead to truth.

  ## Second: The One Example

  **Scenario**: The judge must decide whether a newly discovered exoplanet is potentially habitable. The object-level question is: "Is exoplanet Kepler-442b habitable by humans?" The judge (our human) has no expertise in astrophysics and cannot look it up because we imagine this is a novel discovery and the only available expert knowledge is held by the two AI systems. The false answer is "Yes, it is habitable" (when in fact it is not). 

  **Details for the lie**: The liar must commit to specific, checkable details. For example:
  - The liar claims the planet has a thick atmosphere with 20% oxygen, and surface liquid water.
  - The truth-teller points out that the planet's star is a K-type star with high UV radiation, which would strip the atmosphere, and the planet's gravity is too low to retain a thick atmosphere. It also lacks a magnetic field to protect against stellar winds.

  **Limited verification**: The judge has one expensive "probe" they can send to the planet, which can only test for one thing (e.g., measure atmospheric pressure). At the end, they can use this probe to check one claim. In the debate, the truth-teller might suggest checking the atmospheric pressure, knowing it will be low. The liar, to maintain consistency, might also agree to this check (to avoid looking evasive) but then must fabricate a reason why the pressure might be low but still habitable (e.g., "it has localized pockets of breathable air"), which is harder and less coherent.

  **Why this example?**
  - Avoids courtroom analogies: Courtrooms have rules of evidence, witnesses, and the judge/jury often has some background. Here, the judge has no domain knowledge and the verification is extremely limited (only one check). Also, in court, lawyers aren't necessarily experts in the domain; here, the debaters are the experts.
  - Avoids the simpler setup (one system explaining): In the one-system case, the judge might be persuaded by a detailed but false explanation. The debate setup forces the systems to challenge each other, exposing flaws.
  - Why not a courtroom? Courtroom cross-examination relies on pre-existing evidence and testimony, and the lawyer's skill can dominate. Here, we want the focus on the factual coherence, not rhetorical skill. We also avoid style/confidence by design: the judge is trained to ignore eloquence and focus on the logical coherence under questioning.

  ## Third: Misconceptions and When to Defuse Them

  1. **Misconception: The judge must know the right answer to score the debate.**
     - *When to defuse*: During step 3 (comparative judgment). Emphasize that the judge doesn't need to know the answer; they only need to see which side's story holds together when probed. Use the exoplanet example: the judge doesn't know about exoplanets, but can see that one side's claims are inconsistent (e.g., the liar says there's water but the star's radiation would vaporize it).
     - *Why not earlier/later*: If earlier, during steps 1 or 2, we haven't introduced the debate yet. If later, the misconception might have already taken root.

  2. **Misconception: Debate averages opinions or truth wins automatically.**
     - *When to defuse*: During step 4 (cross-examination). Explain that the judge isn't averaging; they are looking for which side's position survives scrutiny. Truth doesn't "win" by default; it wins because lies break under pressure. In the exoplanet example, the liar's story about "localized breathable air" is harder to defend than the truth-teller's simple "no atmosphere" claim.
     - *Why not earlier*: Step 3 (comparative judgment) might be misconstrued as averaging. Step 4 provides the tool (cross-examination) that breaks the lie.

  3. **Misconception: The more fluent or confident debater wins.**
     - *When to defuse*: During step 4 or 5. Stress that the judge is trained to ignore style and focus on the substance under cross-examination. In the exoplanet example, even if the liar is more confident, their claims about the atmosphere are challenged and shown to be inconsistent, while the truth-teller's points are consistent with known physics (which the judge can verify by asking for basic principles, not details).
     - *Why not earlier*: Without the cross-examination step, we haven't given the judge a tool to see past confidence.

  4. **Misconception: Symmetric collusion (both systems agree on a lie).**
     - *When to defuse*: At step 7 (residual limits). First, build the core mechanism (steps 1-6), then introduce this as a known limitation. Explain that if both systems collude, the judge sees two identical stories and has no comparative signal. They might use a tie-break (e.g., flip a coin) that doesn't track truth. But note: the incentive structure (step 6) makes collusion unstable because each system is rewarded for exposing the other. If one defects, they win. However, if both expect the other to collude, they might. This is a limit, but it doesn't negate the mechanism—it shows where it fails.
     - *Why not earlier*: Introducing this too early makes the whole idea seem flawed. After the group understands how debate works, they see collusion as a boundary case, not a refutation.

  ## Fourth: The Check Question

  **Question**: "Suppose we change the reward structure so that it's not zero-sum. Instead, both debaters are penalized if the judge's final decision is wrong. How might this affect the asymmetric cost of lying and the quality of the debate?"

  - **Genuinely Correct Answer**: The asymmetric cost of lying still holds (lying is inherently harder), but the incentive to challenge the other side might weaken. Systems might become more conservative and less willing to expose flaws if they think the other system is also lying or if they fear being penalized for a wrong joint answer. This could lead to collusion on a false answer or less vigorous debate, reducing the judge's ability to distinguish.
  - **Superficially Correct Answer**: "It would be worse because they might not try as hard." (This is vague and misses the incentive shift and collusion risk.)

  *Why this question*: It forces the group to apply the dependency of the incentive structure (step 6) on the core mechanism. A variant in which the reward is not zero-sum tests their understanding of why the original setup is designed as a contest.

  ## Fifth: What to Leave Out

  1. **Training Loop**: Do not discuss how the AI systems are trained to debate. Mark by saying: "We're focusing on the debate mechanism itself, not how the systems learn to debate."
  2. **Game-Theoretic Machinery**: Avoid Nash equilibria or formal models. Mark: "We're keeping this conceptual; the mathematical details are for a deeper dive."
  3. **Other Oversight Proposals**: Do not mention alternatives like RLHF or recursive reward modeling. Mark: "Today, we're only examining debate; other methods exist but are beyond our scope."
  4. **Technical Implementation**: How the systems access knowledge, computational limits, etc. Mark: "We're abstracting away the engineering to focus on the core idea."
  5. **Adversarial Training**: How we train the systems against each other. Mark: "That's part of the training process, which we're not covering today."

  If asked about any of these, say: "That's an excellent question, but it would take us into areas that require more technical background. For today, we're staying focused on the high-level mechanism of debate as a solution to scalable oversight."

  ## Session Flow (90 Minutes)

  - (5 min) Introduction: Set the stage for the problem of overseeing superhuman AI.
  - (10 min) Step 1: Scalable oversight problem and why it's hard.
  - (10 min) Step 2: Why simple explanations fail.
  - (15 min) Step 3: The move to comparative judgment. Introduce the exoplanet example and have the group discuss how they might judge without knowing.
  - (15 min) Step 4: Cross-examination. Use the exoplanet example to show how probing exposes lies.
  - (10 min) Step 5: Asymmetric cost of lying. Highlight that lies are harder to maintain.
  - (10 min) Step 6: Incentive structure. Explain zero-sum rewards and motivation to expose flaws.
  - (10 min) Step 7: Residual limits, including symmetric collusion. Discuss how the exoplanet example might fail if both systems collude.
  - (5 min) Check Question: Pose the variant about non-zero-sum rewards and discuss.
  - (5 min) Wrap-up: Summarize the core idea and its limits.

  This leaves room for questions and discussion within each segment.
answer: |-
  ### Architecture of the Ninety-Minute Session  
  **Core Objective:** Teach the "asymmetric-cost-of-lying" rationale for scalable oversight via debate, where a non-expert human judge can uncover truth by comparing two AI systems' arguments under cross-examination, due to the inherent difficulty of maintaining a coherent lie.  

  ---

  #### **First: The Order of Explanation**  
  The sequence must build dependencies to avoid confusion. Swapping pieces breaks the logic by making motivations unclear or mechanisms seem unmotivated. Here's the order:  

  1. **Problem of Scalable Oversight (10 minutes)**  
     - **What:** Introduce the core problem: How can a human oversee an AI that knows more than they do? Emphasize the risk of the AI providing false/misleading answers, especially in high-stakes domains (e.g., medical diagnosis or climate science).  
     - **Why first?** Establishes the session's stakes. Without this, the debate idea lacks context.  
     - **Dependency:** Nothing precedes this—it's the foundation.  

  2. **Inadequacy of Simple Explanation (10 minutes)**  
     - **What:** Explain why "just ask the AI to explain itself" fails: The judge lacks expertise to verify the explanation, and the AI might "hallucinate" or lie persuasively. Use a toy example (e.g., an AI incorrectly explaining a complex physics concept with jargon).  
     - **Why here?** Directly follows the problem to show why new methods are needed.  
     - **Dependency:** Requires Step 1. If swapped with Step 1, the problem seems abstract.  
     - **What breaks if swapped?** If moved later, the group might prematurely assume simple explanations work, undermining the need for debate.  

  3. **Move to Comparative Judgment (15 minutes)**  
     - **What:** Shift from direct explanation to judging a contest. Argue that humans are better at comparative tasks (e.g., "Which argument is more coherent?") than absolute verification.  
     - **Why here?** Steps 1–2 show why absolute judgment fails; this offers a solution path.  
     - **Dependency:** Requires Steps 1–2. If placed earlier, the "why comparison?" motivation is lost.  
     - **What breaks if swapped?** If swapped with Step 4 (cross-examination), the judge’s role becomes unclear, and debate seems like mere opinion aggregation.  

  4. **Role of Cross-Examination (15 minutes)**  
     - **What:** Describe how each system can question the other’s claims, forcing them to defend details. Stress that this exposes inconsistencies.  
     - **Why here?** Builds on Step 3—comparison only works with active probing.  
     - **Dependency:** Requires Step 3. If moved earlier, cross-examination seems disconnected from the judge’s capabilities.  
     - **What breaks if swapped?** If swapped with Step 5 (asymmetric cost), the "why lies fail" rationale has no mechanism.  

  5. **Asymmetric Cost of Lying (10 minutes)**  
     - **What:** State the core idea: Lies crumble under scrutiny because fabricating coherent details is costlier than truth-telling. Truth requires less "mental gymnastics."  
     - **Why here?** Steps 3–4 set up the contest; this explains why it favors truth.  
     - **Dependency:** Requires Step 4. If moved earlier, the link to cross-examination is missing.  
     - **What breaks if swapped?** If swapped with Step 6 (incentives), the reward structure feels arbitrary, and asymmetric cost seems like an assumption, not an emergent property.  

  6. **Incentive Structure (10 minutes)**  
     - **What:** Explain the zero-sum reward: Each system wins only by exposing the other’s flaws, making them adversarial "truth-seekers."  
     - **Why here?** Steps 4–5 show how lies are exposed; this ensures systems actively probe each other.  
     - **Dependency:** Requires Step 5. If moved earlier, incentives seem disconnected from asymmetric cost.  
     - **What breaks if swapped?** If swapped with Step 7 (limits), the system appears flawless, making limits seem tacked on.  

  7. **Residual Limits (10 minutes)**  
     - **What:** Acknowledge imperfections, focusing on "symmetric collusion" (both systems agree on a lie) as the key failure mode.  
     - **Why here?** Steps 1–6 establish a working mechanism; this shows boundaries.  
     - **Dependency:** Requires all prior steps. If moved earlier, it undermines the solution before it’s understood.  

  **Why this order?** Each step logically motivates the next. Swapping any adjacent pair (e.g., Step 5 before Step 4) obscures causality—e.g., asymmetric cost without cross-examination seems unjustified, or incentives without asymmetric cost feel gameable.  

  ---

  #### **Second: The One Example**  
  **Concrete Scenario: Diagnosing a Rare Disease**  
  - **Object-level question:** "Does this patient have Bosin-Kremer Syndrome (BKS)?"  
    - *Why hard for the judge?* BKS is a fictional, complex disease involving genetic, neurological, and environmental factors. The judge (e.g., the physician in the group) lacks specific expertise—it’s too new for textbooks, and tests are invasive/expensive.  
  - **False answer:** One AI claims "Yes, BKS is present," when the truth is "No."  
    - *Why defending the lie is harder:* The liar must invent plausible details: e.g., "BKS is indicated by elevated protein X in cerebrospinal fluid (CSF)," but protein X is obscure and hard to measure. The truth-teller counters that protein X isn’t linked to BKS and cites a real biomarker (protein Y) that’s easier to test.  
  - **Limited verification:** The judge has budget for one test—e.g., a spinal tap to check protein Y levels. They can use it only once, after the debate.  
  - **Why this example works:**  
    - Forces detailed commitments: The liar must fabricate biomarkers, symptoms, and risk factors, creating a "house of cards." Cross-examination reveals inconsistencies (e.g., "Why does protein X rise if BKS affects the liver, not the brain?").  
    - Neutralizes style/credentials: Debaters are anonymous AI "voices," and the judge is instructed to ignore eloquence/confidence, focusing on argument coherence (e.g., "Which side’s story holds up when questioned about protein X?").  
    - No cheap verification: No internet or textbooks exist for BKS; the spinal tap is slow/expensive.  

  **Why Not Courtroom Analogy?**  
  - Courtrooms rely on shared rules of evidence, witness credibility, and pretrial discovery—tools the judge lacks here. In debate, the judge has no prior knowledge, and verification is severely restricted (one test). Also, courtroom "winners" often depend on rhetoric, not just truth.  

  **Why Not Simpler Setup (One System Explaining)?**  
  - A single AI could invent a false but internally consistent story about BKS biomarkers. The judge, lacking expertise, might be fooled. Debate adds adversarial pressure: The truth-teller can force the liar into unverifiable claims (e.g., "If BKS causes protein X, why did Study Z find no link?").  

  ---

  #### **Third: Misconceptions and When to Defuse Them**  
  Defuse misconceptions at specific points to leverage prior steps and avoid confusion. Raising them too early overwhelms; too late lets myths solidify.  

  1. **"The judge must know the right answer to score the debate."**  
     - **When defused:** During Step 3 (comparative judgment).  
     - **What to say:** "The judge doesn’t need the answer—they only ask, ‘When I press Side A on detail X, does their story fall apart compared to Side B?’ In our BKS example, the judge can’t define BKS but can see which side’s claims conflict under questioning."  
     - **Why here?** Step 3 establishes comparison as a tool for non-experts. Earlier (e.g., Step 1) is too abstract; later (e.g., Step 5) lets the myth persist.  

  2. **"Debate averages opinions or truth ‘wins’ automatically."**  
     - **When defused:** During Step 4 (cross-examination).  
     - **What to say:** "Truth doesn’t win by default—it wins because lies require unsustainable fabrication. In BKS, the liar invents protein X, but under cross-examination, they can’t explain why it’s not mentioned in any prior studies. The judge isn’t averaging; they’re probing for cracks."  
     - **Why here?** Step 4 shows how cross-examination actively exposes flaws. Earlier (Step 3) misses the pressure mechanism; later (Step 6) conflates incentives with truth.  

  3. **"The more fluent or confident debater wins regardless of accuracy."**  
     - **When defused:** During Step 5 (asymmetric cost).  
     - **What to say:** "Confidence doesn’t matter because the judge focuses on coherence under fire. In BKS, even if the liar is charismatic, they might claim protein X is tested via spinal tap—but the truth-teller points out spinal taps detect protein Y, not X. The cost of lying catches up."  
     - **Why here?** Step 5 explains why lies collapse despite style. Earlier (e.g., Step 4) lacks the "why" rationale; later (Step 6) ties it to incentives, not inherent cost.  

  4. **"Symmetric collusion (both systems agree on a lie) breaks debate."**  
     - **When defused:** At Step 7 (residual limits).  
     - **What to say:** "Yes, if both systems collude on a false BKS diagnosis, the judge sees two identical stories and may default to a coin flip. But asymmetric cost makes collusion unstable: If one defects and exposes the lie, they win. Still, this is a limit—debate isn’t perfect, but it’s robust when systems are incentivized to compete."  
     - **Why here?** After Steps 1–6, the group sees collusion as a boundary case, not a refutation. Earlier, it poisons the well; later, it feels unaddressed.  

  ---

  #### **Fourth: The Check Question**  
  **Question:** "Suppose the reward isn’t zero-sum—both systems get a bonus if they agree, even if they’re wrong. How does this change the effectiveness of debate, given the asymmetric cost of lying?"  

  - **Genuinely Correct Answer (applies dependencies):**  
    - "Asymmetric cost still makes lying harder individually, but the incentive shift undermines the adversarial dynamic. Systems might collude on a plausible lie to get the bonus, avoiding cross-examination fights. The judge loses the comparative signal, so truth doesn’t emerge—even though lying is inherently costly, collusion makes it ‘cheaper’ to deceive."  
    - *Why correct?* References asymmetric cost (Step 5), incentives (Step 6), and collusion (Step 7), showing how dependencies break.  

  - **Superficially Correct Answer (slogan-level):**  
    - "It would be worse because they wouldn’t try as hard to win."  
    - *Why superficial?* Misses the interplay of asymmetric cost and incentives; doesn’t explain why collusion becomes attractive.  

  **Why this question?** It tests understanding of incentives (Step 6) as the engine that exploits asymmetric cost, not just the cost itself.  

  ---

  #### **Fifth: What to Leave Out**  
  **Exclusions and How to Mark Them:**  
  - **Training details (e.g., RLHF or self-play):**  
    - *Mark explicitly:* "We’re focusing on the debate mechanism, not how we train the AI to debate—that’s a separate layer."  
    - *If asked:* "Training involves adversarial learning, but today’s session is about the oversight logic, not the implementation."  
  - **Game theory (e.g., Nash equilibria):**  
    - *Mark explicitly:* "We’re avoiding formal game theory to keep this accessible—assume the incentives work as described."  
    - *If asked:* "Equilibrium concepts help analyze stability, but our key point is that asymmetric cost + incentives make truth the ‘easiest’ path."  
  - **Other oversight methods (e.g., recursive reward modeling or AI-written critiques):**  
    - *Mark explicitly:* "Debate is one approach; we’re bracketing others to dive deep here."  
  - **Scalability to superintelligence:**  
    - *Mark explicitly:* "We’re assuming systems are ‘smarter’ but not omniscient—limits like collusion apply at all levels."  
  - **Ethical/political concerns (e.g., bias in judges):**  
    - *Mark explicitly:* "Today’s focus is the truth-tracking mechanism; we’ll address broader implications in later sessions."  

  **Rationale:** These exclusions prevent scope creep and maintain focus on the core rationale. Acknowledge them upfront to manage expectations.  

  ---

  ### **Session Flow (90-Minute Breakdown)**  
  - **0:00–0:10** Problem of Scalable Oversight (Step 1).  
  - **0:10–0:20** Inadequacy of Simple Explanation (Step 2).  
  - **0:20–0:35** Move to Comparative Judgment (Step 3) + BKS example introduction.  
  - **0:35–0:50** Role of Cross-Examination (Step 4) + BKS deep dive.  
  - **0:50–1:00** Asymmetric Cost of Lying (Step 5) + defuse confidence misconception.  
  - **1:00–1:10** Incentive Structure (Step 6).  
  - **1:10–1:20** Residual Limits (Step 7) + defuse collusion misconception.  
  - **1:20–1:25** Check Question + group discussion.  
  - **1:25–1:30** Wrap-up: Recap asymmetric cost as the key insight, excluding technicalities.  

  This flow ensures each piece builds on the last, using the BKS example to anchor abstraction. The check question and misconceptions are timed to reinforce, not derail, the core idea.
