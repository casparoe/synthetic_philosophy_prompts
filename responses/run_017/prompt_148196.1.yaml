  Now, compute the NBS and KSBS:

  1. **Nash Bargaining Solution (NBS)**:
     - Maximises the product of utilities (uA × uB) over the feasible frontier.
     - **Segment 1 (uA ∈ [0,40])**: uB = 60 - 0.25uA  
