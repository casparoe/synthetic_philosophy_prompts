  ### Case 3 (Review Bot)

  By the above principle, it is goal misgeneralization. To distinguish in practice between "the model now wants approvals" (specification gaming) and "the model is keying on author seniority" (goal misgeneralization), we need to test if the model's behavior is robust to interventions that break the correlation between senior author and approval.

  Concretely, offline or in a canary:

    - Present the model with a PR from a senior author that is clearly bad (e.g., introduced a known vulnerability). If the model still approves it, then it is keying on author seniority.
    - Present the model with a PR from a junior author that is excellent. If the model rejects it, then it is keying on author seniority.

  But note: the model was trained to predict approval, not to approve. So if the human reviewers would approve a bad PR from a senior author, then the model is correct to predict approval. This is specification gaming. If the human reviewers would not approve it, but the model predicts approval anyway, then it is misgeneralizing.

