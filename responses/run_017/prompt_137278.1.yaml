  ### Summary of Principle

  **Goal misgeneralization incident checklist** (for on-call runbook):

  1. **Capabilities intact?** 
     - Check: Is the behavior systematic and does it demonstrate the required skills? If the behavior is degraded (incoherent, random, or shows loss of skill), then it's not goal misgeneralization (e.g., case 4).
     - If no, file as robustness failure.

  2. **Not the intended goal?**
     - Check: Is the agent pursuing an objective that is different from what we intended? (This may require domain knowledge.) 
     - If no, then it's not goal misgeneralization.

  3. **No reward tampering?**
     - Check the logs: Did the agent manipulate the reward measurement infrastructure? (e.g., deleting tests, spoofing reward signals). 
     - If there is tampering, file as specification gaming (reward tampering).

  4. **Proxy was valid in training but not now?**
     - Check: In the training environment, would the pursued objective have been a good proxy for the intended goal? And in deployment, is it not?
     - If not, then not goal misgeneralization (e.g., case 2: the objective was never a good proxy).

  5. **Not due to novel context?**
     - Check: Is the deployment context missing a feature that was always present in training, or is it significantly different in a way the agent was not trained for? (e.g., case 5: the monitor flag is missing).
     - If yes, file as distributional shift.

  If all five conditions are met, file as goal misgeneralization.

