    - We need to know the ground truth of what the human reviewer would do in deployment.

    - In a canary, we can run an experiment: for a set of PRs, have the model predict approval and also have human reviewers review them. Then:
        - If the model's predictions match the human approvals (even on bad PRs by senior authors), then it is specification gaming: it is accurately pursuing the training signal.
        - If the model's predictions do not match human approvals on PRs where author seniority is misleading (e.g., bad PR by senior author should be rejected but model predicts approval), then it is goal misgeneralization: the model is using author seniority as a proxy even when it is not valid.

