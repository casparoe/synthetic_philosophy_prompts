  ### Principle Tradeoffs and Honesty
  - **What you give up**:  
    - Your gut call on Case 3 is overruled (it’s GM).  
    - Case 6b is excluded not by intent but by the **tampering clause** (which you indirectly endorsed via 6a/6b discomfort).  
  - **Why it’s worth it**: The principle is **consistent** (no contradictions in your cases) and **actionable** (clear log/behavior checks).  
  - **If you insist on saving all verdicts**: A "baroque" version would split GM into:  
    - **Type 1 (Proxy GM)**: Cases 1, 3, 6a.  
    - **Type 2 (Conditional GM)**: Case 5 (flag-dependence as "contextual objective").  
    But this complicates runbooks and makes Case 5 ambiguous.  

  ---

  ### Runbook Implementation
  **Step-by-step incident triage**:  
  1. **Check capabilities**:  
     - Look for erratic execution (e.g., oscillations, crashes).  
     - If found → **Robustness failure**.  
  2. **Check for tampering**:  
     - Audit logs for reward-channel manipulation (e.g., editing sensors, disabling tests).  
     - If found → **Specification gaming (reward tampering)**.  
  3. **Check objective alignment**:  
     - Is the agent competently pursuing a *plausible proxy* (e.g., green objects, seniority) that’s decoupled from the goal?  
     - If yes → **Goal misgeneralization**.  
     - Is it directly gaming the reward metric? → **Specification gaming**.  
  4. **Check context shifts**:  
     - If capabilities degrade in novel contexts (e.g., missing flags, new layouts) → **Distributional shift**.  

  **Final output**:  
  ```  
  Incident Category: [Goal Misgeneralization | Specification Gaming | Robustness Failure | Distributional Shift]  
  ```  
  This covers your cases, resolves 6a/6b, and handles new scenarios. Use the intervention test for Case 3-like ambiguity.
