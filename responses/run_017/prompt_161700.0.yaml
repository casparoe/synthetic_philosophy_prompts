answer: |-
  **(Reviewer voice, leaning forward, tapping the deployment report)** Your "label gap" is real—I grant that—but it doesn't make the constraint ill-posed; it makes measurement *hard*. We solve it with a randomized holdout: withhold slots from a stratified random sample of high-risk patients across groups. That gives us unbiased labels to audit the score's performance *today*. Yes, it costs slots—assume we sacrifice 200—but that cost buys accountability. Without error-rate constraints, you optimize for welfare using a score that, by the arithmetic, *must* disadvantage Group B if base rates differ. Your "destination" argument hand-waves that bias: if Group A is bigger and higher-risk, unconstrained allocation dumps slots there, systematically underserving B. That isn’t fairness—it’s majoritarianism with a welfare fig leaf.  

  **(Finger on the base-rate table)** Equalizing false-negative rates *is* the constraint: it ensures both groups have equal access to intervention when they need it. If that means a B patient at 0.19 gets priority over an A at 0.22, so be it—the clinician sees well-calibrated risks, the auditor sees equal opportunity to catch failure, and the patient gets the *reason* (thresholds differ because group risks differ). Your pilot’s "worse five-year outcome" assumes your welfare projection is causal and complete—but if unobserved barriers make Group B’s disengagement harder to prevent, your "efficient" allocation could exacerbate inequity. I won’t relax the constraint because welfare isn’t observable at deploy-time; fair treatment is. You’re spending health *now* by ignoring disparate impact—just on patients you don’t measure as closely.  

