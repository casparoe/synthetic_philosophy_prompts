  We are dealing with the claim "Bayesians can't agree to disagree." This is a reference to Aumann's agreement theorem. The theorem states that if two agents have the same prior and their posteriors are common knowledge, then their posteriors must be equal. 

  The one-liner is being used to argue that if two calibrated superforecasters have swapped numbers (updated multiple times) and are still 20 points apart, then either someone is irrational or someone is holding private evidence.

  We need to break down the precise claims and see which readings support the conclusion and what extra premises are needed. Then we'll test the cases.

  **Menu of Claims:**

  1. **Near-tautological reading (Aumann's theorem exactly):** 
     - If two Bayesians (with a common prior) have common knowledge of each other's posteriors, then their posteriors must be equal.
     - Status: True (given the assumptions), substantive and defensible within the model.
     - To get the conclusion about the forecasters, we need:
       - Common prior (on the whole state space, including each other's calibration and evidence)
       - Common knowledge of the posteriors (after each update, they know each other's posteriors and know that they know, etc.)
     - Without these, the theorem doesn't apply.

  2. **Strong reading (common prior is a requirement of rationality):** 
     - Rational agents must have a common prior. Therefore, any disagreement must be due to private evidence (which if shared would lead to agreement) or irrationality.
     - Status: Controversial. Many Bayesians reject that rationality requires a common prior. It's a substantive and debated claim.
     - Extra premise: Rationality implies a common prior.

  3. **Even stronger reading (disagreement implies irrationality or private evidence, even without common knowledge):** 
     - If two rational agents disagree, then either they have different priors (which is irrational) or one has private evidence they haven't shared. This reading might drop the common knowledge requirement.
     - Status: False without common knowledge. It's possible for rational agents with a common prior to disagree without common knowledge of posteriors. Also, different priors are not necessarily irrational.

  4. **Wild reading (rational agents can't disagree about anything decision-relevant):** 
     - Extends the theorem to say that any persistent disagreement on decision-relevant events is irrational or due to hidden evidence.
     - Status: Overreaching. The theorem is about beliefs (posteriors) and requires common knowledge and common prior.

  **Which reading gets the conclusion?**
  The conclusion is: if two calibrated superforecasters have updated multiple times and are still 20 points apart, then either irrationality or private evidence is being withheld.

  To get this, we need at least the near-tautological reading plus the assumption that the conditions of the theorem are met (common prior and common knowledge of posteriors). However, the theorem requires common knowledge at every step, which may not hold in practice.

  Alternatively, if we take the strong reading (that rationality requires a common prior) then we can say that if they are rational (hence common prior) and they have common knowledge of posteriors, they must agree. But note that the theorem requires common knowledge at the time of the disagreement.

  But the scenario says they have "swapped numbers five or six times". This might be intended to establish common knowledge? However, in a real conversation, without explicit common knowledge, it might not hold.

  **Extra premises needed for the conclusion:**
  - For the near-tautological reading: We must assume that the forecasters have a common prior and that after each exchange, their posteriors are common knowledge.
  - For the strong reading: We must additionally assume that rationality requires a common prior.

  **Now, the cases:**

  **Case 1: They stop after six rounds. Neither ever said anything about knowing the other's number, and each privately thinks the other is probably miscalibrated on this class of question.**
  - This breaks the common knowledge condition. They don't have common knowledge of posteriors because each doubts the other's calibration. So even if they have a common prior, Aumann's theorem doesn't apply. 
  - Also, they might not have a common prior because they have different beliefs about each other's calibration.
  - Verdict: This case kills readings that assume common knowledge and common prior. It survives only if we don't require common knowledge (which the theorem does). So readings 1 and 2 (which require common knowledge) are killed. The stronger readings (3 and 4) that drop common knowledge are not supported by the theorem and are false.

  **Case 2: They openly don't share a prior. One thinks base rates on "unprecedented" events are basically uninformative, the other thinks you can always dig up a reference class. Both know this about each other and neither budges.**
  - Here, there is no common prior. So Aumann's theorem doesn't apply. 
  - The strong reading (2) would say that this difference in prior is irrational. But that is a controversial claim. Many would argue that having different priors is not irrational. 
  - Verdict: This case kills readings that require a common prior (all of them: 1,2,3,4 require common prior for the theorem to force agreement). However, the strong reading (2) might still say that the disagreement is due to irrationality (because they should have had a common prior). But without the common prior, the theorem doesn't force agreement. So the conclusion (that someone is irrational or hiding evidence) doesn't follow from the theorem alone. 

  **Case 3: What they disagree about isn't really an event: one says 0.08 that "the system would have been safe if we'd shipped it in march", the other says 0.3, and nothing will ever resolve it.**
  - Aumann's theorem is about events that are in the probability space and that might be updated by evidence. Here, the event is counterfactual and cannot be resolved. 
  - The theorem still applies in the sense that it's about beliefs. But note: the common prior must assign probabilities to the same state space. If the event is not well-defined or if the agents have different interpretations, the prior might not be common. 
  - Moreover, without the possibility of updating on evidence, they might not converge. But the theorem doesn't require resolution, only common prior and common knowledge of posteriors. 
  - However, if they have a common prior and common knowledge of their posteriors, the theorem says they must agree. But the problem is that the counterfactual might not be in the common prior's state space in a way that they share. 
  - Verdict: This case is tricky. If we assume that the counterfactual is a well-defined event in the state space and they have a common prior and common knowledge, then the theorem applies and they should agree. But if they don't agree, then one of the conditions fails. The theorem doesn't require that the event be resolvable. So if we assume the conditions, then disagreement is impossible. But in practice, counterfactuals might lead to different prior constructions. This case doesn't break the theorem per se, but it highlights that the common prior assumption might be unrealistic for counterfactuals. 

  **Case 4: Trust-weighted updating.**
  - Each discounts the other's reported number by a private trust factor. The trust factors are updated based on disagreement. 
  - This is not Bayesian updating in the strict sense (unless the trust factors are part of a Bayesian model). 
  - Aumann's theorem requires Bayesian updating and common prior over the entire state space (which would include the trust factors). 
  - If the trust factors are private and not part of the common prior, then the theorem doesn't apply. 
  - Verdict: Out of scope for the theorem because the updating rule is not the standard Bayesian updating (unless modeled appropriately). The theorem assumes that the agents update by conditioning. Here, they are using a different updating rule. So the theorem doesn't say anything. 

  **Summary of verdicts:**

  - **Case 1:** Breaks the common knowledge condition. Most readings (that require common knowledge) are killed. The theorem doesn't apply. Confidence: High.
  - **Case 2:** Breaks the common prior condition. All readings that rely on common prior are killed. The theorem doesn't apply. Confidence: High.
  - **Case 3:** The theorem applies only if we have a common prior and common knowledge. If we assume that, then disagreement is impossible. But the counterfactual nature might make the common prior assumption problematic. So it doesn't break the theorem, but it highlights the difficulty in applying it. Confidence: Medium (because we must assume the event is in the state space and the common prior is defined over it).
  - **Case 4:** The updating rule is not Bayesian (in the strict conditioning sense), so the theorem is out of scope. Confidence: High.

  **Which reading do people usually mean?**
  Typically, when someone says "Bayesians can't agree to disagree", they mean the near-tautological reading (Aumann's theorem). But in practice, they often overreach by ignoring the common prior and common knowledge assumptions.

  **The one claim I'm least sure of:** 
  I'm least sure about Case 3. There's a debate about whether counterfactuals can be handled in the standard Bayesian framework. If we take the theorem at face value, it should apply to any event in the state space. But in reality, counterfactuals are not observable, so they might not be updated by the same kind of evidence. However, Aumann's theorem doesn't require updating on evidence that resolves the event, only common knowledge of posteriors. So if the conditions hold, they must agree. But in practice, without the possibility of resolution, it's hard to see how they would update to common knowledge. This case is a bit of a stretch for the theorem.

  **Final Answer to the User:**

  Your friend's claim relies on overreaching interpretations of Aumann's agreement theorem. The theorem says that if two agents have a common prior and their posteriors are common knowledge, then their posteriors must be equal. 

  - For the forecasters to be forced to agree, we need both a common prior and common knowledge of posteriors. The fact that they swapped numbers multiple times might help establish common knowledge, but it doesn't guarantee it (especially if they doubt each other's calibration). 

  - The extra premises your friend is relying on (but not stating) are:
    1. The forecasters share a common prior (on the entire state space, including each other's reliability and evidence).
    2. After each update, their posteriors are common knowledge (each knows the other's posterior, each knows that the other knows, and so on).

  Without these, the theorem doesn't force agreement.

  In your cases:

