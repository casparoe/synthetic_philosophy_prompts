answer: |-
  ### Deconstructing "Bayesians Can't Agree to Disagree"
  The one-liner your friend uses refers to **Aumann's agreement theorem**, a foundational result in Bayesian epistemology. The theorem states:  
  *If two rational agents share a common prior and their posterior beliefs (after updating on evidence) are common knowledge, then their posterior beliefs must be identical.*  

  Your friend overreaches by applying this as a universal hammer to force agreement in all scenarios. Below, I dissect the precise claims the slogan could express, evaluate them, and identify what's needed to justify his conclusion about the superforecasters. I then analyze your four cases. For each verdict, I note confidence on a scale of 1–10 (10 = highest).  

  ---

  ### Menu of Claims: From Tautological to Wild  
  1. **Near-tautological reading (Aumann's theorem verbatim):**  
     - *Claim:* With a common prior and common knowledge of posteriors, rational agents *must* agree.  
     - **Status:** Substantive and defensible (proven true under assumptions).  
     - **To justify his conclusion:** Requires both forecasters to share a common prior *and* have common knowledge of each other's probabilities after every update.  
     - **Extra premise he misses:** Common knowledge is nontrivial—it demands infinite recursion ("I know your probability, you know I know, I know you know I know..."). Swapping numbers 5–6 times ≠ common knowledge.  
     - **Typical usage:** This is what people *usually* mean, but often forget the fine print.  

  2. **Strong reading (common prior as rationality requirement):**  
     - *Claim:* Rationality *requires* a common prior; thus, disagreement implies irrationality or private evidence.  
     - **Status:** Controversial and arguably false. Rational Bayesians can have different priors without irrationality (e.g., differing ontological assumptions).  
     - **To justify his conclusion:** Must assume that differing priors are *inherently irrational*—a normative claim unsupported by the theorem.  
     - **Extra premise he misses:** The theorem doesn't judge priors; it assumes them. Equating prior differences with irrationality is a philosophical add-on (e.g., from objective Bayesians).  
     - **Typical usage:** Common among rationalists who conflate rationality with consensus.  

  3. **Stronger reading (disagreement implies irrationality or hidden evidence, even without common knowledge):**  
     - *Claim:* If rational agents disagree after updating, it *must* be due to private evidence (regardless of common knowledge).  
     - **Status:** False. Aumann's theorem *requires* common knowledge; without it, rational disagreement persists.  
     - **To justify his conclusion:** Assumes that swapping numbers 5–6 times approximates common knowledge. This is incorrect—finite exchanges don't suffice.  
     - **Extra premise he misses:** Common knowledge is necessary and distinct from mere repeated updating.  
     - **Typical usage:** A misapplication by those who skimmed the theorem.  

  4. **Wild reading (no rational disagreement on decision-relevant beliefs):**  
     - *Claim:* Rational agents cannot disagree about *any* belief relevant to decisions.  
     - **Status:** False and unsupported. Aumann's theorem is limited to beliefs with common knowledge of posteriors.  
     - **To justify his conclusion:** Requires collapsing all decision-relevant beliefs into the theorem's scope—invalid, as many disagreements involve untestable or model-based claims.  
     - **Extra premise he misses:** The theorem says nothing about decision-relevance; it's purely about belief agreement under strict conditions.  
     - **Typical usage:** Overconfident rationalists weaponizing Bayesianism.  

  **Which reading justifies his superforecaster claim?**  
  - **Near-tautological reading** *could* support it, but only with **two unstated premises**:  
    (a) The forecasters share a common prior (unlikely if they use different models).  
    (b) Their 5–6 updates establish *common knowledge* of posteriors (unlikely without infinite recursion).  
  - **Strong reading** *would* support it, but only if we add:  
    (c) Differing priors are *irrational* (a debated premise not in the theorem).  
  His conclusion fails without (a)–(c).  

  ---

  ### Case Analysis  
  **Key:** "Kills" = violates the claim; "survives" = claim holds.  

  1. **Case 1 (No common knowledge; mutual distrust of calibration):**  
     - **Breaks:** Common knowledge. Each thinks the other is miscalibrated → posteriors aren't common knowledge.  
     - **Verdict:**  
       - Near-tautological: **Killed** (fails common knowledge).  
       - Strong: **Killed** (distrust implies prior differences aren't resolved).  
       - Stronger: **Killed** (no private evidence needed to explain disagreement).  
       - Wild: **Killed** (distrust is decision-relevant but rational).  
     - **Confidence:** 10/10. *This is the core flaw in his argument.*  

  2. **Case 2 (Openly different priors; base-rate disagreement):**  
     - **Breaks:** Common prior. Priors diverge on fundamental axioms (e.g., "Are base rates informative?").  
     - **Verdict:**  
       - Near-tautological: **Killed** (no common prior).  
       - Strong: **Survives only if** differing priors are deemed irrational—but this is circular.  
       - Stronger: **Killed** (private evidence irrelevant; disagreement stems from priors).  
       - Wild: **Killed** (disagreement is rational and decision-relevant).  
     - **Confidence:** 9/10. *His argument conflates "common prior" with "rational prior."*  

  3. **Case 3 (Unresolvable counterfactual):**  
     - **Breaks:** The event isn't testable → no evidence can update beliefs.  
     - **Verdict:**  
       - Near-tautological: **Theoretically survives** (common prior + common knowledge force agreement), but **practically killed** (no mechanism to resolve disagreement).  
       - Strong: **Survives only if** counterfactuals admit objective priors (debatable).  
       - Stronger: **Killed** (private evidence is impossible; disagreement persists).  
       - Wild: **Killed** (disagreement is unavoidable and rational).  
     - **Confidence:** 7/10. *Least sure claim: The theorem technically applies, but real-world counterfactuals lack a resolvable event space, making common priors implausible.*  

  4. **Case 4 (Trust-weighted updating):**  
     - **Breaks:** Bayesian updating. Agents don't condition on each other's reports; they use subjective trust factors.  
     - **Verdict:**  
       - **All readings killed or out of scope.** Aumann assumes Bayesian updating (conditioning on evidence). Trust-weighting violates this—it's a *model* of how to interpret reports, not pure conditioning.  
       - The slogan **does not apply** because the updating rule isn't Bayesian.  
     - **Confidence:** 10/10. *This is simply not what Aumann's theorem addresses.*  

  ---

  ### Summary and Recommendations  
  - **Where your friend overreaches:**  
    He ignores the theorem's core assumptions: (1) common prior, (2) common knowledge of posteriors. Swapping numbers 5–6 times ≠ common knowledge, and superforecasters often lack common priors (e.g., different models). His claim also smuggles in extras like "differing priors are irrational."  
  - **How to push back effectively:**  
    1. Cite the assumptions: "Aumann requires common priors *and* common knowledge—neither is guaranteed here."  
    2. Highlight Case 1: "If they distrust each other's calibration, common knowledge fails, and disagreement is rational."  
    3. Invoke Case 4: "Trust-weighted updating isn't Bayesian, so Aumann doesn't apply."  
    4. Reject conflations: "The theorem doesn't say differing priors are irrational—that's a separate claim."  
  - **Least confident verdict:** Case 3 (counterfactuals). The theorem *should* enforce agreement if common prior/knowledge hold, but in practice, this is implausible for unresolvable events.  

  **Bottom line:** His slogan is only a tautology under idealized conditions. In real forecasting, rational disagreement thrives—thanks to divergent priors, imperfect trust, and unresolvable questions. Aumann's theorem isn't a magic wand for consensus.
