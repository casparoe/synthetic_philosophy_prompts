prompt: |-
  So I've ended up as the philosopher on our hospital's clinical genomics advisory board — we meet a couple of times a term and sign off on what the genetics clinic offers and how the consent conversation goes, and it's the same argument every time: is it actually good for this patient to be offered this result? I'd like to build the protocol around Good's theorem (the value of information can't be negative, since you can always just ignore what you learn), which I teach as the clean case, but the theorem stops doing any work the moment its assumptions break, and what I want is the assumptions turned into steps.

  Write me a procedure a genetic counsellor can run in about twenty mintues at intake, before any optional result gets offered: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand the question back to the patient because it's a values question dressed as a factual one. It has to survive these, which are the ones that actually come up:

  - results that discriminate between no acts the patient would take anyway — variants of uncertain significance, or a risk score for something with no prevention — so the decision value is zero while the hedonic cost isn't;
  - patients who ask for a deliberately coarsened signal, just tell me if there's anything I can do about it, which looks like throwing away information for nothing;
  - patients who decline free results outright, where I want the procedure to tell a mistake apart from a preference about the weeks of waiting;
  - results that are durable and semi-public — in the chart, in the family — so the patient isn't the only one who ends up informed;
  - patients who say they'll act on a result and won't.

  At each step say plainly which bit is decision theory and which bit is a value judgment I've laundered as arithmetic, and flag the cases the procedure can't settle. Then run it on three: the secondary-findings panel we currently offer by default to everyone who gets sequenced; a polygenic score for a late-onset condition with no intervention; and a patient who wants the panel disclosed only if it's actionable. If the procedure tells me we shouldn't be offering something we offer by default, I'd rather hear that now than at the next meeting.
reasoning: |-
  We are designing a procedure for genetic counselors to determine whether to offer an optional genetic test result to a patient. The procedure is based on Good's theorem (that information cannot have negative value because one can always ignore it) but accounts for real-world violations of the theorem's assumptions.

  The procedure must address:
  1. Results with no actionable outcome (VUS, risk scores without prevention) where the decision value is zero but there may be hedonic costs (anxiety, etc.).
  2. Patients who want a coarsened signal (only if actionable) which might seem like throwing away information.
  3. Patients who decline free results: distinguishing a mistake from a preference about waiting.
  4. Results that are durable and semi-public (in the chart, family implications).
  5. Patients who say they will act but won't.

  We break the procedure into steps, each with:
  - The question to ask.
  - What counts as a sufficient answer.
  - When to stop (with a "no" to offering the result).
  - When to hand the question back to the patient (values question dressed as factual).
  - Plainly state which part is decision theory and which is a value judgment.

  The procedure must be doable in about 20 minutes.

  We then run the procedure on three cases:
  A. Secondary findings panel offered by default to everyone.
  B. A polygenic score for a late-onset condition with no intervention.
  C. A patient who wants the panel disclosed only if actionable.

  ---

  **Procedure: "Should We Offer This Result?"**

  **Step 1: Define the Result and Its Implications**
  - **Question:** "This test result is about [describe result]. It can tell us [specific information]. What do you think this result might mean for you?"
  - **Sufficient Answer:** The patient should demonstrate a basic understanding of what the test result reveals (e.g., "It tells me if I have a higher risk for X" or "It might find a variant that could cause disease").
  - **Stop if:** The patient cannot grasp the nature of the result after reasonable explanation (e.g., due to cognitive impairment, language barrier) — then do not offer.
  - **Hand back if:** The patient asks, "What do you think it means?" — then explain the facts again and ask for their interpretation.
  - **Decision Theory Part:** The value of information depends on what the information is about. We need to establish that the patient understands the type of information they might receive.
  - **Value Judgment Part:** We are assuming that the patient's understanding is necessary for the information to have value. This is a value judgment because we are prioritizing autonomy and avoiding harm from misunderstanding.

  **Step 2: Assess Actionability**
  - **Question:** "If we get this result, are there any actions you could take based on it? For example, changing your medication, having more screenings, or informing family members?"
  - **Sufficient Answer:** The patient identifies at least one concrete action they would consider, or explicitly states they know of no actions but still want the information. If the test result is known to be non-actionable (e.g., a VUS or a condition with no prevention), the counselor should state that: "I want to let you know that for this particular result, there are no known actions to take. Given that, do you still see a reason to get it?"
  - **Stop if:** The patient cannot name any action and, after being told there are none, cannot articulate a non-action reason (e.g., "I just want to know") — then do not offer. However, note that if the patient expresses a strong non-action reason, proceed to Step 3.
  - **Hand back if:** The patient asks, "What do other people do?" — then explain common reasons (curiosity, planning for the future) and ask what they would do.
  - **Decision Theory Part:** The decision-theoretic value of information comes from the ability to change actions. If there are no actions, then the decision value is zero. However, non-action values (like peace of mind) might still be positive.
  - **Value Judgment Part:** We are setting a bar for non-action reasons. We are making a judgment that if the patient cannot articulate a reason, we shouldn't offer. This is to avoid harm from information without purpose.

  **Step 3: Evaluate Non-Action Motivations**
  - **Question (if no actions in Step 2):** "Since there aren't any actions to take, why would you want this result? For example, might it help with planning for the future, peace of mind, or satisfying curiosity?"
  - **Sufficient Answer:** The patient provides a reason that is meaningful to them (e.g., "I want to know for my children" or "I'd rather know even if I can't do anything").
  - **Stop if:** The patient says they don't know or that they don't want it after all — then do not offer.
  - **Hand back if:** The patient says, "Shouldn't I want to know?" — then explain that this is a personal choice and ask what they feel.
  - **Decision Theory Part:** We are accounting for non-instrumental value (hedonic, symbolic, etc.). This step is necessary because the decision theory model must include all utilities, not just those from actions.
  - **Value Judgment Part:** We are accepting that non-action reasons are valid. This is a value judgment because we are respecting autonomy even when there's no medical benefit.

  **Step 4: Consider Psychological and Social Impact**
  - **Question:** "Sometimes, learning a genetic result can cause worry or affect how you feel about your health. Also, genetic information can be shared with family or be in your medical record. How do you feel about these possibilities?"
  - **Sufficient Answer:** The patient acknowledges these possibilities and expresses either that they are prepared to handle them or that they have concerns. If concerns, ask if they have a plan (e.g., "I know I might worry, but I have a therapist" or "I don't want my family to know, but I can keep it to myself").
  - **Stop if:** The patient expresses severe distress at the possibility of a bad result and cannot identify any coping strategy — then do not offer (due to potential harm).
  - **Hand back if:** The patient asks, "How do most people cope?" — then provide examples and ask how they think they would cope.
  - **Decision Theory Part:** We are incorporating the potential negative utility (hedonic cost) of the information. This cost can make the net value negative.
  - **Value Judgment Part:** We are making a judgment about what level of distress is too high. This is a clinical judgment about risk of harm.

  **Step 5: Assess Reliability of Patient's Reported Intentions**
  - **Question (if the patient has stated intentions to act in Step 2):** "You mentioned you might [specific action] if the result is positive. How likely are you to follow through? Have you done similar things in the past?"
  - **Sufficient Answer:** The patient provides a realistic assessment of their likelihood (e.g., "I always go to my screenings" or "I'm not sure, I might avoid it"). If they have a history of non-adherence, note it.
  - **Stop if:** The patient states they are unlikely to act and the result is only valuable if acted upon — then do not offer (because the expected value of the information is low). However, if they have non-action reasons, proceed to Step 3.
  - **Hand back if:** The patient says, "I should do it, but I don't know if I will" — then ask them to weigh the value of knowing without acting.
  - **Decision Theory Part:** The value of information depends on the probability of acting. If the patient is unlikely to act, the expected value is reduced.
  - **Value Judgment Part:** We are taking the patient's self-report at face value unless there is evidence of past non-adherence. This is a judgment about trust in self-report.

  **Step 6: Special Case - Coarsened Signal (e.g., only if actionable)**
  - **Question (if the patient requests only actionable results):** "You're asking to only get results that are actionable. That means we might learn something but not tell you if it isn't actionable. Is that because you don't want to worry about things you can't change?"
  - **Sufficient Answer:** The patient confirms they understand and want this filter.
  - **Stop if:** The patient changes their mind and wants all results — then proceed to Step 1 for the full set. If they insist on coarsened, then we must decide if the test can be reported that way (technically and ethically). If not, then stop and do not offer (because we cannot meet their condition).
  - **Hand back if:** The patient asks, "What would you do?" — then explain that it's a personal choice and ask again what they prefer.
  - **Decision Theory Part:** Coarsening the signal (throwing away information) can be rational if the disutility of the non-actionable information is high enough. This step evaluates that trade-off.
  - **Value Judgment Part:** We are accepting that avoiding non-actionable information is a valid preference. This is a value judgment about the right to avoid potentially distressing information.

  **Step 7: Final Check for Declining Free Results**
  - **Question (if patient declines a result that is free and available):** "I notice you're declining this result. Is there a reason? For example, is it because you don't want to wait, or because you don't want to know?"
  - **Sufficient Answer:** The patient provides a reason (e.g., "I don't want to know anything that isn't actionable" or "I'm overwhelmed right now").
  - **Stop if:** The patient declines — respect the decision and do not offer.
  - **Hand back if:** The patient says, "Shouldn't I take it because it's free?" — then explain that free doesn't mean necessary and ask what they want.
  - **Decision Theory Part:** The cost of waiting or processing might be a real cost that outweighs the benefit. This step ensures we account for that.
  - **Value Judgment Part:** We are respecting patient autonomy even when declining free information. This is a value judgment about the right to refuse.

  **Step 8: Make a Decision**
  - If all steps are passed (or not triggered in a way that stops the process), the result is offered.
  - If at any step the process stops, the result is not offered.

  **Cases the Procedure Cannot Settle:**
  - When the patient's values are unclear and they cannot articulate them even after hand-backs.
  - When the non-action motivations are in conflict (e.g., "I want to know for my children, but I don't want them to know").
  - When the psychological risk is borderline and requires expert mental health assessment beyond the scope of the 20-minute session.

  ---

  **Running the Procedure on Three Cases**

  **Case A: Secondary Findings Panel (Offered by Default to Everyone)**

  We assume the panel includes actionable conditions (e.g., BRCA, Lynch syndrome) but also may return VUS.

  **Step 1:** The result is about a panel of genes known to cause serious conditions, some of which are actionable. The patient should understand that it might find a risk for cancer or heart disease. 
  - *Decision Theory:* We ensure the patient knows what they might learn.
  - *Value Judgment:* We require understanding.

  **Step 2:** Are there actions? For many conditions in the panel, there are actions (e.g., extra screening, preventive surgery). The patient should be able to name some or agree when told. 
  - If the patient cannot name any and the counselor explains the actions, then unless the patient is adamant that they wouldn't act, we proceed.
  - *Stop?* Only if the patient cannot understand or refuses to consider actions.

  **Step 3:** For non-actionable parts (like VUS), we ask: "Some results might be uncertain and have no actions. Why would you want them?" 
  - The patient might say, "I want to know everything" or "I don't, but I want the actionable ones." 
  - If the patient only wants actionable ones, we go to Step 6.

  **Step 4:** We discuss worry and family implications. The patient should be prepared for the possibility of a bad result and understand it might be shared with family. 
  - *Stop?* If the patient is highly anxious and has no support.

  **Step 5:** For actionable conditions, we ask about likelihood of acting. 
  - If the patient says they won't act, then we don't offer? But note: the panel might have multiple conditions. We must consider each? Actually, the panel is one test. So we have to consider the entire package. 
  - *Stop?* Only if the patient says they won't act on any of the possible findings.

  **Step 6:** If the patient wants only actionable results, we must check if we can do that. Technically, we can only report the actionable ones? But in practice, labs might report VUS. We must design the test to only return actionable findings? 
  - *Stop?* If we cannot technically coarsen the signal (i.e., the lab will report VUS anyway) and the patient doesn't want VUS, then we might not offer the panel.

  **Step 7:** Not triggered (patient is not declining).

  **Conclusion for Case A:** 
  - By default, we ask every patient. The procedure may reveal that for some patients, we should not offer the panel (e.g., if they are highly anxious, won't act, and don't want non-actionable results). Therefore, the current default offering might not be appropriate for everyone. We should make it optional and run this procedure.

  **Case B: Polygenic Score for Late-Onset Condition with No Intervention**

  **Step 1:** The result is a risk score for a condition (e.g., Alzheimer's) with no known prevention or treatment. The patient should understand it's a probabilistic risk without actions.
  - *Stop?* If the patient cannot grasp that it's not deterministic and not actionable.

  **Step 2:** Are there actions? The counselor states there are none. The patient must then have a non-action reason to proceed. 
  - *Stop?* If the patient cannot name a non-action reason.

  **Step 3:** Why want it? The patient might say, "For planning" or "To know for my children." 
  - *Stop?* If the patient has no reason.

  **Step 4:** Discuss the potential for worry and the durable nature of the result (in the chart, family implications). 
  - *Stop?* If the patient is highly anxious and has no way to cope.

  **Step 5:** Not applicable (no actions).

  **Step 6:** If the patient requests only if actionable, but this test is never actionable, then we cannot offer it under that condition. 
  - *Stop?* Because we cannot meet the condition of only providing actionable results.

  **Step 7:** If the patient declines, we stop.

  **Conclusion for Case B:** 
  - This test might be offered only to patients who pass Steps 1, 3, and 4. But note: Step 3 requires a non-action reason. For many, the potential for worry without benefit might lead to not offering. Therefore, we should not offer this test by default.

  **Case C: Patient Who Wants the Panel Disclosed Only If Actionable**

  This is a variant of Case A with a specific patient request.

  **Step 6 (directly relevant):** The patient asks for only actionable results. We must check if we can do that. 
  - If the lab can filter out VUS and only report pathogenic/likely pathogenic variants that are actionable, then we can meet the request. Then we proceed to Step 1 for the actionable part only.
  - If the lab cannot (i.e., they will report VUS anyway), then we cannot meet the condition. Then we must go back to the patient: "We cannot exclude non-actionable results. Given that, do you still want the panel?" Then run through Steps 1-5 for the full panel.

  **Conclusion for Case C:**
  - If the lab can coarsen the signal, we offer the panel with the filter. If not, we run the full procedure for the entire panel. If the patient then declines because they don't want VUS, we do not offer.

  ---

  **Overall Conclusion:**
  - The current practice of offering the secondary findings panel by default may be inappropriate for some patients. The procedure suggests making it optional and using this protocol to decide patient by patient.
  - The polygenic score for a condition with no intervention should not be offered by default and only to those who have non-action reasons and can handle the potential distress.
  - For patients who want only actionable results, we must check if the test can be tailored to that. If not, we have to decide whether to offer the full panel or not.

  This procedure respects patient autonomy and incorporates decision theory while accounting for real-world complexities.
answer: |-
  Below is a step-by-step procedure for genetic counselors to evaluate whether to offer an optional genetic test result. It is designed to be completed in **20 minutes** and addresses the core assumptions of Good's theorem (that information cannot have negative value because one can always ignore it) while accounting for real-world violations. The procedure breaks down the theorem's assumptions into actionable steps, flags decision theory (DT) vs. value judgments (VJ), and includes safeguards for the edge cases you described. Steps are sequential, and the counselor should document answers.

  **Key:**
  - **DT:** Pure decision theory (rational choice under uncertainty).
  - **VJ:** Value judgment (ethical, psychological, or contextual factors laundered as objective steps).
  - **Stop:** Do not offer the result; end the evaluation.
  - **Hand Back:** Redirect to the patient; this is a values-based choice, not a factual one.
  - **Unsettled Cases:** Situations where the procedure cannot definitively recommend for/against offering (requires ethics consultation or patient introspection).

  ---

  ### **Procedure: "Should We Offer This Result?" (20-Minute Intake Protocol)**

  #### **Step 1: Clarify the Result and Patient Understanding**  
  **Question:** *"This result tells us [briefly describe result, e.g., 'a variant that might increase your risk of X' or 'a score predicting your likelihood of Y']. What do you think this means for you?"*  
  - **Sufficient Answer:** Patient accurately paraphrases the result (e.g., "It shows if I have a higher chance of getting X" or "It might be uncertain"). If needed, correct misunderstandings.  
  - **Stop If:** Patient cannot comprehend the result after two simplified explanations (e.g., due to cognitive barriers or language). *Reason: Uninformed consent is invalid.*  
  - **Hand Back If:** Patient asks, *"What* should *it mean to me?"* → Redirect: *"This depends on your values. Some people want to know everything; others only want useful info. What feels right for you?"*  
  - **DT vs. VJ:**  
    - *DT:* Information has no value if the patient cannot use it (assumption: knowledge must be interpretable).  
    - *VJ:*** We judge that comprehension is mandatory (laundered as "rational" consent).  

  #### **Step 2: Assess Actionability (Testing the 'Decision Value' Assumption)**  
  **Question:** *"If we get this result, are there any steps you would take? For example, changing screenings, prevention, or telling family? If not, why might you still want it?"*  
  - **Sufficient Answer:** Patient identifies ≥1 concrete action (e.g., "I'd start mammograms earlier") OR a non-action reason (e.g., "I want to know for my kids," even if no prevention exists).  
  - **Stop If:**  
    - Patient says they would take no action **and** cannot articulate a non-action reason (e.g., "I don’t know why I’d want it").  
    - Result is definitively non-actionable (e.g., VUS or risk score for untreatable disease) **and** patient cannot justify wanting it.  
  - **Hand Back If:** Patient asks, *"What* should *I do with this?"* → Redirect: *"That’s up to you. Some people act, others just want knowledge. What aligns with your goals?"*  
  - **DT vs. VJ:**  
    - *DT:* If no actions exist, decision-theoretic value is zero (Good’s theorem assumes actions are available).  
    - *VJ:*** We set a threshold for "sufficient" non-action reasons (laundered as "rational" utility).  
  - **Edge Case Handling (Discriminatory/Non-Actionable Results):** Explicitly state if the result has no prevention (e.g., *"This score can’t be changed with treatment. Does that affect your choice?"*). If patient still wants it, proceed to Step 3.  

  #### **Step 3: Evaluate Psychological Impact (Testing 'Hedonic Cost' Assumption)**  
  **Question:** *"Some people feel anxious learning results like this, even if they don’t change actions. How do you think you’d react? Do you have support to cope with worry?"*  
  - **Sufficient Answer:** Patient acknowledges risks and has a coping plan (e.g., "I might be stressed but will talk to my therapist" or "I’m not worried").  
  - **Stop If:** Patient predicts severe distress (e.g., "I’d have a breakdown") **and** lacks coping strategies. *Reason: High hedonic cost may outweigh benefits.*  
  - **Hand Back If:** Patient asks, *"Is it normal to be scared?"* → Redirect: *"Feelings vary. How do* you *usually handle health news?"*  
  - **DT vs. VJ:**  
    - *DT:* Negative utility (e.g., anxiety) can make net information value negative.  
    - *VJ:*** We judge "severe distress" thresholds (laundered as cost-benefit arithmetic).  

  #### **Step 4: Account for Durability/Privacy (Testing 'Private Information' Assumption)**  
  **Question:** *"This result will be in your medical record and might be relevant to family. How do you feel about that? Would you share it?"*  
  - **Sufficient Answer:** Patient accepts record implications and has a plan for family disclosure (e.g., "I’ll tell my sister if it’s serious" or "I’ll keep it private").  
  - **Stop If:** Patient refuses to allow the result in their record (if clinic policy mandates documentation) **or** if family implications cause untenable conflict (e.g., "My family would disown me").  
  - **Hand Back If:** Patient asks, *"What* should *I do about my family?"* → Redirect: *"That’s your choice. Some share everything; others wait. What fits your family dynamics?"*  
  - **DT vs. VJ:**  
    - *DT:* Good’s theorem assumes information is private; shared ownership alters cost/benefit.  
    - *VJ:*** We prioritize clinic/family policies over patient preferences (laundered as "system constraints").  

  #### **Step 5: Gauge Commitment to Actions (Testing 'Credible Intentions' Assumption)**  
  **Question (if action claimed in Step 2):** *"You mentioned you’d [action, e.g., 'get screened']. How confident are you? Have you done similar things before?"*  
  - **Sufficient Answer:** Patient affirms commitment (e.g., "I’ve done regular checkups before") **or** admits uncertainty (e.g., "I’ll try, but no promises").  
  - **Stop If:** Patient is unlikely to act (e.g., "I probably won’t do anything") **and** the result’s value hinges entirely on action (e.g., actionable findings). If non-action reasons exist, proceed.  
  - **Hand Back If:** Patient says, *"I* should *do it, but I might not"* → Redirect: *"It’s okay to be unsure. How much would knowing matter if you didn’t act?"*  
  - **DT vs. VJ:**  
    - *DT:* Low probability of action reduces expected value (Good’s theorem assumes intentions are credible).  
    - *VJ:*** We distrust self-reports when history suggests non-adherence (laundered as "rational" probability adjustment).  
  - **Edge Case Handling (Patients Who Won’t Act):** Use this step to surface discrepancies. Do not offer if actions are the sole justification and commitment is low.  

  #### **Step 6: Address Coarsened Signals or Declined Results**  
  **Substep 6A: Coarsened Signal Request (e.g., "Only tell me if actionable")**  
  - **Question:** *"You want only actionable results. This means we might learn something but not tell you. Why is that?"*  
  - **Sufficient Answer:** Patient explains (e.g., "I don’t want anxiety from useless info").  
  - **Stop If:** Clinic cannot technically/officially coarsen the signal (e.g., lab reports VUS by default). *Reason: Cannot meet patient’s condition.*  
  - **Hand Back If:** Patient asks, *"Is it dumb to not want everything?"* → Redirect: *"It’s your preference. Some prefer simplicity; others want details. What’s best for you?"*  
  - **DT vs. VJ:**  
    - *DT:* Coarsening can increase net utility by filtering disutility (non-actionable info).  
    - *VJ:*** We allow autonomy over information granularity (laundered as "optimal filtering").  

  **Substep 6B: Declined Results**  
  - **Question:** *"You’re declining this free result. Is it because of the wait, the content, or something else?"*  
  - **Sufficient Answer:** Patient gives any reason (e.g., "I don’t want to wait weeks for uncertain news" or "I just don’t care").  
  - **Stop If:** Patient declines → Respect autonomy; do not offer.  
  - **Hand Back If:** Patient says, *"Shouldn’t I take it because it’s free?"* → Redirect: *"Cost isn’t everything. How do you value your time/peace of mind?"*  
  - **DT vs. VJ:**  
    - *DT:* Opportunity costs (e.g., waiting anxiety) can negate value.  
    - *VJ:*** We equate "no" with "net negative utility" (laundered as revealed preference).  

  #### **Step 7: Final Decision**  
  - **Offer Result If:** All steps are passed OR unresolved steps were "handed back" and patient still wants it.  
  - **Do Not Offer If:** Any step led to "Stop."  
  - **Unsettled Cases:**  
    - Conflict between action/non-action utilities (e.g., patient wants result for family but fears distress).  
    - Ambiguous risk tolerance (e.g., "I might act... or not").  
    → **Escalate to ethics board or defer decision.**  

  ---

  ### **Running the Procedure on Your Three Cases**
  **Case 1: Secondary Findings Panel (Offered by Default)**  
  - **Step 1:** *"This panel looks for variants in genes linked to serious conditions. Some are actionable (e.g., cancer risks), some uncertain (VUS). What might this mean for you?"*  
    - Patient understands → Proceed.  
  - **Step 2:** *"If we find something, what might you do? If it’s a VUS, why want it?"*  
    - Patient says: *"I’d get screenings for cancer, but VUS? Not sure."* → **Hand Back:** *"VUS has no actions. Some still want it for completeness; others skip. What do you prefer?"*  
    - If patient wants everything → Proceed.  
    - If patient only wants actionable → Go to **Step 6A**.  
  - **Step 3:** *"Results might cause anxiety. How would you cope?"*  
    - Patient has support → Proceed.  
  - **Step 4:** *"This goes in your record. Family might need to know."*  
    - Patient accepts → Proceed.  
  - **Step 5:** *"How committed are you to screenings?"*  
    - Patient is committed → Proceed.  
  - **Step 6A (if applicable):** *"We can’t suppress VUS; you’d get all results. Still want it?"*  
    - If yes → Offer. If no → Stop.  
  - **Verdict:** **Do not offer by default.** Many patients will stop at Step 2 (no reason for VUS) or Step 6A (can’t coarsen signal). Default offering violates Good’s theorem when non-actionable components exist. Make it opt-in after this protocol.  

  **Case 2: Polygenic Score for Late-Onset Condition (No Intervention)**  
  - **Step 1:** *"This score estimates your risk for [condition] with no prevention/treatment. What might it mean?"*  
    - Patient understands → Proceed.  
  - **Step 2:** *"There are no actions to take. Why might you want this?"*  
    - Patient says: *"No point"* → **Stop.**  
    - Patient says: *"I’d plan finances for dementia care."* → Proceed (non-action reason).  
  - **Step 3:** *"This could cause anxiety. How would you handle it?"*  
    - If patient has no coping plan → **Stop.**  
  - **Step 4:** *"This stays in your record. Family implications?"*  
    - Patient accepts → Proceed.  
  - **Verdict:** **Rarely offer.** Only if patient has strong non-action reason (Step 2) and low distress risk (Step 3). By default, it fails Step 2 → Do not offer routinely.  

  **Case 3: Patient Requests "Only If Actionable" Disclosure**  
  - **Steps 1-4:** Same as Case 1.  
  - **Step 6A:** *"You want only actionable results. But our lab reports VUS. If we can’t suppress it, still want the panel?"*  
    - If patient says yes → Offer.  
    - If patient says no → **Stop.**  
  - **Verdict:** **Highly context-dependent.** If the clinic can technically coarsen (e.g., bioinformatic filtering), allow it. If not, many patients will stop at Step 6A → Do not offer the full panel to these patients.  

  ---

  ### **Summary for Your Board Meeting**
  - **Good’s Theorem Breakdown:** The procedure works because it converts assumptions (actionability, no hedonic cost, private info) into steps. It fails when:  
    - Non-actionable results dominate (VUS, untreatable risks).  
    - Externalities exist (family/chart implications).  
    - Patients mispredict intentions.  
  - **Protocol Impact:**  
    - **Stop offering secondary findings by default.** They often fail Step 2 (non-actionable components) or Step 6A (coarsening impossible).  
    - **Never offer non-actionable polygenic scores by default.** They rely entirely on subjective value (Step 2).  
    - **"Only if actionable" requests** require technical feasibility (Step 6A); otherwise, they fail.  
  - **Unsettled Cases:** ~10-20% of cases, typically involving value conflicts (e.g., "I want to know but can’t handle it"). These need ethics input.  

  This protocol forces explicit trade-offs between Good’s theorem and real-world constraints. If implemented, it would shift your clinic from default offerings to patient-tailored decisions—likely reducing unnecessary testing and iatrogenic harm. I recommend piloting it with your genetic counselors and tracking where patients "stop."
