  ### Residue Report: What Survived, Bent, or Was Lost  
  **1. Clean translations (survived):**  
  - Heritability = regression coefficient.  
  - Price equation = variance partitioning (like ANOVA/ICC).  
  - Selection *for*/*of* = direct/indirect effects in DAGs.  
  - Group fitness choice = response variable selection.  
  - **Your hunch confirmed:** Much reduces to "answer depends on grouping/response variables."  

  **2. Bent translations (approximated):**  
  - **Replicator/vehicle:** Identified via heritability/covariance, but statistical models don't capture "replication" as a biological mechanism—only as a correlation.  
  - **Hamilton's rule:** Translated to regression, but \(r, b, c\) assume causal paths that may not hold in multilevel contexts (e.g., group effects confound individual costs).  
  - **Fitness propensity:** Treated as expected value, but biology often demands a *dispositional* property (e.g., "fitness if environment repeats"), which frequentist stats can't represent.  

  **3. No statistical expression (lost):**  
  - **The replicator's causal primacy:** Statistics can find \(h^2 \approx 1\) and \(\text{Cov}(z, w) > 0\), but it can't adjudicate whether the *group* is the "real" unit of selection. This requires biological context:  
    - Daughter colonies inherit colony genotype faithfully (replication).  
    - Stopper trait only evolves if group fitness \(W_g^{(2)}\) is chosen—but that choice isn't statistical; it's imposed by the biology of reproduction.  
  - **Emergent group traits:** %-stoppers isn't reducible to individual traits (due to clonal structure). Statistics shows this via ICC ≈ 1, but can't explain *why* it matters biologically.  

  **4. Tutor's claim vs. your hunch:**  
  - **You:** Correct that many conflicts reduce to modeling choices (grouping/response variables).  
  - **Tutor:** Correct that a residue remains: **"What is the unit of replication?"** is a biological fact, not a modeling choice.  
    - In this case, colonies replicate via daughter colonies, so group fitness \(W_g^{(2)}\) is "real" in an evolutionary sense. Statistics alone can't justify this—it requires causal knowledge of inheritance.  

  **Conclusion:**  
  - **Stats vocabulary suffices for:** Heritability, covariance partitioning, selection criteria, Hamilton's rule as regression.  
  - **Stats vocabulary fails for:** Why group replication matters (philosophy of causality), or how to define fitness without knowing the inheritance mechanism. The residue is **causal realism about replication**, which your tutor emphasizes. Use stats to clarify the math, but biology breaks the symmetry in modeling choices.
