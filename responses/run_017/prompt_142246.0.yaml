  6. Selection for vs. selection of: 
     - Selection for: direct selection on a trait due to its causal effect on fitness.
     - Selection of: indirect selection on a trait due to its correlation with a trait that is under direct selection.

  7. Fitness as propensity vs. realized headcount: 
     - Propensity: an inherent property of an entity that predicts its expected reproductive output.
