  ### Translation of the Units-of-Selection Debate into Statistical Vocabulary  
  Your intuition is partially correct: much of the debate reduces to **choice of grouping variables, response variables, and weighting schemes** in multilevel models. However, there's a residue tied to biological causality. I'll translate key concepts using your tutor's example, then identify what survives, bends, or gets lost.  

  #### Core Statistical Translation  
  **1. The question: "What level does selection act at?"**  
  - **Translation:** In which hierarchical level (individual, group) does the covariance between trait value and fitness explain the most variance in trait frequency change?  
  - **Formalized:** For trait \(z\), fitness \(w\), and levels \(i\) (individual) or \(g\) (group), selection acts at level \(L\) if \(\text{Cov}_L(z, w)\) dominates the Price equation partition:  
    \[
    \Delta \bar{z} = \underbrace{\text{Cov}_g(\bar{z}_g, W_g)}_{\text{Between-group}} + \underbrace{\mathbb{E}_g[\text{Cov}_i(z_i, w_i | g)]}_{\text{Within-group}}
    \]
    where \(W_g\) is group fitness (defined two ways).  

  **2. Replicator vs. vehicle/interactor**  
  - **Replicator:** Entity with high heritability (\(h^2 \approx 1\)). Fits a **variance components model** where genetic variance dominates phenotypic variance.  
  - **Vehicle/interactor:** Entity where trait-fitness covariance is strongest. Fits a **random-effects model** (e.g., group as random intercept).  
  - **Example:** Colony genotype is replicator (\(h^2 = 1\)). Colony itself is vehicle (trait interacts with environment).  

  **3. Heritability**  
  - **Translation:** Slope of parent-offspring regression (\(h^2 = \beta_{offspring, parent}\)).  
  - **Example:**  
    - *Individual stopper trait:* Non-stoppers reproduce, but offspring phenotype ≠ parent phenotype (offspring become stoppers/non-stoppers based on colony rules). Regression slope \(\beta \approx 0\) → low \(h^2\).  
    - *Colony %-stoppers:* Daughter colonies inherit mother's %-stoppers. \(\beta = 1\) → high \(h^2\).  

  **4. Hamilton's rule**  
  - **Translation:** Linear regression condition for altruism: \( \beta_{r} b - c > 0 \).  
    - \(c = -\beta_{\text{stopper}, \text{fitness}}\) (cost to actor)  
    - \(b = \beta_{\text{group fitness}, \text{trait}}\) (benefit to recipient)  
    - \(r = \beta_{\text{recipient trait}, \text{actor trait}}\) (relatedness)  
  - **Example:** With clonal relatedness (\(r = 1\)), but \(c > 0\) (stopper fitness = 0), \(b\) depends on group fitness definition:  
    - If group fitness = mean individual fitness → \(b < 0\) (fails Hamilton's rule).  
    - If group fitness = daughter colonies → \(b > 0\) (satisfies Hamilton's rule).  

  **5. Partitioning trait change (Price equation)**  
  - **Translation:** Variance decomposition in a **random-intercepts model**:  
    \[
    \Delta \bar{z} = \underbrace{\text{Cov}(\bar{z}_g, W_g)}_{\text{Between-group}} + \underbrace{\mathbb{E}[\text{Cov}(z_i, w_i | g)]}_{\text{Within-group}}
    \]
  - **Example calculation** (using colony types as groups):  
    | Colony type | %-stoppers (\(z_g\)) | Freq | \(W_g^{(1)}\) (mean ind. fitness) | \(W_g^{(2)}\) (daughter colonies) |  
    |-------------|---------------------|------|----------------------------------|----------------------------------|  
    | Low-stopper | 0.05                | 0.5  | 9.26                             | 0.5                              |  
    | High-stopper| 0.40                | 0.5  | 4.80                             | 3.0                              |  
    - **Between-group covariance** (\(\text{Cov}(z_g, W_g)\)):  
      - For \(W_g^{(1)}\): \(\text{Cov} = -0.096\) (negative)  
      - For \(W_g^{(2)}\): \(\text{Cov} = 0.175\) (positive)  
    - **Within-group covariance** (\(\mathbb{E}[\text{Cov}(z_i, w_i | g)]\)): Always negative (stoppers have \(w_i = 0\), non-stoppers \(w_i > 0\)).  
    - **Net \(\Delta \bar{z}\)**:  
      - Using \(W_g^{(1)}\): \(\Delta \bar{z} < 0\) (decreases stopper frequency).  
      - Using \(W_g^{(2)}\): \(\Delta \bar{z} > 0\) (increases stopper frequency).  

  **6. Group fitness: Average individual vs. daughter colonies**  
  - **Translation:** Two competing response variables:  
    - \(W_g^{(1)} = \bar{w}_i\) (mean individual fitness, **weighted by individuals**).  
    - \(W_g^{(2)} = \text{daughter colonies}\) (**weighted by groups**).  
  - **Example conflict:**  
    - Low-stopper colonies: High \(\bar{w}_i\) (9.26) but few daughters (0.5).  
    - High-stopper colonies: Low \(\bar{w}_i\) (4.80) but many daughters (3.0).  
    - **Statistical consequence:** Choice of response variable flips the sign of \(\text{Cov}(z_g, W_g)\).  

  **7. Selection *for* vs. selection *of***  
  - **Translation:** Causal inference with DAGs:  
    - **Selection *for*:** Direct effect of trait on fitness (arrow \(z \rightarrow w\)).  
    - **Selection *of*:** Indirect effect (e.g., \(z \leftarrow \text{confounder} \rightarrow w\)).  
  - **Example:**  
    - *Stopper trait:* Direct cause of \(w_i\) (stoppers always die: \(z \rightarrow w\)).  
    - *Colony genotype:* Direct cause of daughter colonies (group fitness \(W_g^{(2)}\)).  

  **8. Fitness: Propensity vs. realized headcount**  
  - **Translation:** Propensity = **expected value** (\(\mu\)) in a Poisson/multilevel model. Realized = **observed count**.  
  - **Example:** Non-stopper fitness (9.75, 8.0) are realized headcounts; propensity is unobserved.  

  #### Case Study: Tutor's Marine Colony Example  
  - **Data:**  
    - Low-stopper (5% stoppers): Non-stopper \(w_i = 9.75\), mean \(w_i = 9.26\), \(W_g^{(2)} = 0.5\)  
    - High-stopper (40% stoppers): Non-stopper \(w_i = 8.00\), mean \(w_i = 4.80\), \(W_g^{(2)} = 3.0\)  
  - **Key conflict:**  
    - **Individual-level analysis:**  
      - Stopper trait covaries negatively with \(w_i\) → selection *against* stoppers.  
      - Heritability of stopper trait ≈ 0 → no response.  
    - **Group-level analysis (using \(W_g^{(2)}\)):**  
      - %-stoppers covaries positively with daughter colonies → selection *for* stopper-producing colonies.  
      - Heritability = 1 → trait increases.  
  - **Statistical resolution:**  
    - **Multilevel model** with colony as random effect:  
      \[
      w_i \sim \text{stopper}_i + \%\text{stopper}_g + (1 | \text{colony}_g)
      \]
      - Stopper effect: \(\beta_{\text{stopper}} \approx -8\) (strong negative).  
      - %-stopper effect: \(\beta_{\%} > 0\) if \(W_g^{(2)}\) used.  
    - **Conclusion:** Selection acts at group level if we define fitness as daughter colonies (\(W_g^{(2)}\)).  

