  Key concepts to translate:

  1. Replicator vs. vehicle/interactor: 
     - Replicator: an entity that passes on its structure largely intact in replication (e.g., gene).
     - Vehicle/interactor: an entity that interacts as a cohesive whole with its environment in a way that causes replication to be differential (e.g., organism, group).

  2. Heritability: In quantitative genetics, heritability is the proportion of phenotypic variance attributable to genetic variance. It can be estimated by regression (e.g., offspring phenotype regressed on parent phenotype).

  3. Hamilton's rule: A condition for the evolution of altruism: rb > c, where b is the benefit to the recipient, c is the cost to the actor, and r is the relatedness (regression coefficient of relatedness).

  4. Partitioning of change: The Price equation partitions the change in a trait into a within-group component and a between-group component.

  5. Group fitness: Two definitions:
     a. Average of the individual fitnesses of the group's members (which is the mean number of offspring produced by individuals in the group).
