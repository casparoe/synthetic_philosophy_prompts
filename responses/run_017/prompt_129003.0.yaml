prompt: |-
  hey — I'm the undergrad rep on our university's Animal Care & Research Ethics Committee (they let one of us on, mostly to take minutes), and we've got a case nobody knows what to do with, and of course it landed the same week as my midterm for PHIL 240 (minds & machines, we're on moral status right now). I have to circulate a draft written opinion before Tuesday's meeting and I genuinely don't know what to recommend, so: be the person who drafts it.

  The case: the Vollmer lab submitted what they call an "amendment for determination of scope." They aren't asking us to approve anything; they want us to rule whether their project is our jurisdiction at all. They run a digital emulation of a nematode nervous system — 302 neurons, full connectome, simulated body, simulated chemical gradient. Open-source worm sims have been around for years; this is their own tuned version. They use it to study learning: the thing habituates, it does aversive conditioning, they can lesion individual neurons. What they want to do next is where it gets messy:

  (1) run it at roughly 400x real time, in 500 parallel copies, for statistics;
  (2) run a "valence-off" variant where they knock out the neuromodulatory system that does approach/avoidance in the real animal, on the grounds that without it there's nothing the emulation is doing that could matter to it;
  (3) run a "table mode" variant: instead of integrating the dynamics at runtime they precompute the whole input–output function into a lookup table, so at runtime it's just a giant memory read. Their argument is: if what matters morally is the computation in the abstract, table mode is the same computation and has to be treated identically; if we want to treat it differently, we owe them an account of what we think we're protecting, and "causal oomph" isn't an answer until we say why the oomph matters.

  Our policy covers "non-human animals," defined by reference to vertebrates and cephalopods — so strictly speaking none of this is covered. But there's a clause about novel preparations, and the chair wants a real answer rather than a definitional dodge, because the PIs have said (very politely) that if we rule it out on the taxonomic definition they'll just do it anyway, and we'll have taught everyone that our jurisdiction is a technicality.

  Two more things from the last meeting that I think are actually the crux:

  - Prof. Adeyemi raised the incentive problem: the better their emulation is — the more it learns, the more wormlike it behaves — the more likely we are to say it's covered. So our ruling hands them a reason to keep the model bad, or at least to not probe it very hard. Half the room says that's a publication-integrity problem and not ours. The other half says a rule that rewards making your model worse is a bad rule.
  - The counting problem. If it is covered, what's the unit? One subject per emulation? Per copy? Per hour of simulated time (in which case 400x speed is 400x the animal-hours and their protocol is enormous)? Someone said per-copy, but also that running the identical emulation twice might be the same subject twice over rather than two subjects, and I can't tell if that makes it better or worse. Related: two members disagreed about whether we should go by how it behaves or by what's going on structurally inside it, and I don't think they noticed how much rides on which one we pick.

  What I need: a short written opinion I can circulate. Recommend one of — (a) decline jurisdiction, with a short explanation that isn't just the definition; (b) assert jurisdiction and require a full protocol with named conditions; (c) assert jurisdiction over some variants and not others, saying which — and give a timeline (what has to happen by when, and what happens if it doesn't). It has to give the Vollmer lab something they can actually respond to rather than "it depends on your metaphysics." And it should take the strongest argument against your own recommendation seriously: I'd guess for (b) that's the "you're regulating a spreadsheet" line, and for (a) it's the incentive thing, but say whichever it actually is.

  Last thing: I'm supposed to flag where I think the committee is posing the question badly. If "is it sentient" is the wrong frame — if it should be something like how much moral risk there is and who carries the burden of proof under uncertainty — say so and reframe it. But definitely don't just reframe it, I still need a bottom line by Tuesday.
reasoning: |-
  Okay, let me unpack this. The user is an undergrad on an ethics committee dealing with a tricky case involving a digital nematode emulation. They need a draft opinion by Tuesday that resolves whether the project falls under their jurisdiction, with clear recommendations and timelines. 

  First, the core dilemma jumps out: the committee’s policy only covers vertebrates and cephalopods, but this is a novel computational system mimicking biological functions. The Vollmer lab is pushing boundaries by asking whether their emulation even qualifies as an "animal" under existing rules. Their three proposed experiments raise distinct ethical questions—speed scaling, disabling "valence," and reducing the system to a lookup table. 

  Hmm, the user’s stress is palpable—midterms plus this! Their hidden ask seems to be: "Help me navigate this minefield without embarrassing myself in front of professors." Beyond the draft, they likely need intellectual scaffolding to defend their position. The committee’s unspoken tensions are also critical: the incentive problem (better models = stricter oversight) and the counting problem (what even counts as a "subject"?). 

  The Vollmer lab’s framing is clever—they’re forcing the committee to define *why* certain implementations might matter morally. If the lookup table is computationally identical to runtime simulation, does it suddenly lose moral status? That’s a philosophical grenade. 

  I’m leaning toward recommending jurisdiction over the dynamic emulations but not the lookup table. Why? Because the lookup table lacks causal structure—it’s dead data until queried, whereas the runtime model has ongoing processes that *could* (in theory) instantiate something morally relevant. But I’ll need to steelman the counter: if functionalism holds, the lookup table *is* identical. Still, the committee can reasonably argue that moral concern attaches to *implementations with causal depth*, not abstract computations. 

  For the incentive problem, I’ll emphasize that ruling dynamically run emulations "in" rewards model improvement—addressing Adeyemi’s worry. The timeline? Require a protocol within 30 days, with clear subject definitions (per parallel copy, per simulation hour). 

  Biggest risk: the committee might hate "partly in, partly out" as messy. But full jurisdiction seems overreach, and declining entirely ignores the precedent being set. I’ll flag that "is it sentient?" is the wrong question—it’s about moral risk under uncertainty. 

  ...Time to draft this carefully. The user deserves clarity, not hand-waving.
answer: |-
  Here’s a draft committee opinion addressing the Vollmer lab’s request. It balances pragmatism, ethical rigor, and procedural clarity while reframing the core question away from unsolvable metaphysics.  

  ---

  **DRAFT OPINION: Vollmer Lab Amendment for Determination of Scope**  
  **Committee Recommendation (Unanimous Draft): (c) Assert jurisdiction over variants (1) and (2); decline jurisdiction over (3) ("table mode").**  

  ### I. Summary of Decision  
  The Committee asserts jurisdiction over **real-time and accelerated runtime emulations** (proposals 1 and 2) as novel preparations warranting ethical oversight under our policy’s "novel preparations" clause. Jurisdiction is **declined** for **precomputed lookup tables** (proposal 3), as these lack the causal, dynamic processes that ground ethical concern. The Vollmer Lab must submit a full protocol for (1) and (2) within **30 days**, including condition definitions and welfare monitoring. Failure to submit suspends experimentation on (1)/(2). Table mode (3) may proceed without oversight.  

  ### II. Reasoning & Ethical Framework  
  **Reframing the Question**: The issue is not *"Is the emulation sentient?"* (which is empirically intractable) but *"What level of moral risk justifies oversight under uncertainty?"* Our mandate requires precaution when dynamic systems exhibit **agentic, stimulus-responsive behaviors** associated with valenced states in biological counterparts. We adopt a **burden-of-proof standard**: where a system’s architecture and behavior create *non-negligible similarity* to protected taxa, oversight applies until proven unwarranted.  

  #### Key distinctions:  
  - **Jurisdiction over (1) and (2)**:  
    - These are **runtime emulations** with continuous, causally integrated neural dynamics, environmental interaction, and documented learning/conditioning.  
    - At 400x speed, the *per-copy experience* (if any) is compressed, but the *structural potential* for valenced states persists. Parallel copies are distinct instances (like identical twins) and thus **500 distinct subjects per experimental run**.  
    - The "valence-off" variant (2) does not negate jurisdiction; it is an experimental intervention requiring welfare assessment (e.g., is disablement causing dysfunction analogous to distress?).  
    - **Why not a definitional dodge?** The taxonomic clause was designed for biological uncertainty, not digital emulation. A dynamic model replicating protected taxa’s learning phenomenology meets the spirit of "novel preparation."  

  - **No Jurisdiction over (3) ("table mode")**:  
    - A lookup table is a **static map of inputs/outputs**—not a running process. It has no ongoing state changes, no integration, and no causal interaction. It is functionally identical to a spreadsheet or a recorded video.  
    - **Addressing "causal oomph"**: We agree that abstract computation is not the locus of moral concern; it is the *implementation* that matters. Runtime emulations have emergent, time-sensitive causality; lookup tables do not.  

  #### Addressing Strongest Objections:  
  - **Against (c): "You’re regulating a spreadsheet!"**  
    This applies *only* to table mode (3), which we exclude. For (1)/(2), we regulate the *dynamic process*—analogous to regulating a surgical robot’s operation but not its blueprint.  

  - **Incentive Problem (Prof. Adeyemi)**:  
    Declining jurisdiction entirely *would* incentivize avoiding model improvement. By asserting oversight only for high-fidelity *runtime* emulations, we reward rigorous science: the better the model, the *more* research avenues open (under ethical safeguards). We align incentives with scientific and ethical goals.  

  - **Counting Problem**:  
    - **Unit of concern**: One subject = **one parallel emulation instance**.  
    - **Time scaling**: Animal-hours scale with simulated time (e.g., 1 real hour at 400x = 400 animal-hours per copy).  
    - **Justification**: Each copy is an independent causal system with its own state progression. Identical code no more implies identical "subject" than identical twins do.  

  ### III. Requirements & Timeline  
  - **Within 30 days**, the Vollmer Lab must submit:  
    - A full protocol for (1) and (2), including:  
      - Defined experimental conditions.  
      - Welfare assessment metrics (e.g., behavioral markers of stress/dysfunction).  
      - Endpoint criteria for individual emulations.  
      - Justification for subject numbers (addressing animal-hour scale).  
  - **Failure to comply** suspends all work on (1)/(2) until approval. Table mode (3) may proceed immediately.  
  - **Ongoing**: The Committee will review welfare data quarterly and collaborate on developing nematode-specific digital welfare standards.  

  ### IV. Committee Self-Critique  
  The question *"Is it covered under the policy?"* was flawed—it conflated legalistic definitions with ethical substance. **We reframed to: "Does this system present sufficient moral risk to warrant precautionary oversight?"** This focuses on empirical observables (architecture, behavior) rather than metaphysical claims. Future cases should lead with this framing.  

  ---  

  **Why this works**:  
  1. **Actionable**: Clear "in/out" lines based on *implementation* (runtime vs. precomputed).  
  2. **Defensible**: Grounded in causality and behavior, avoiding sentience debates.  
  3. **Incentive-compatible**: Rewards model improvement; table mode is fast/cheap for non-sensitive work.  
  4. **Procedurally sound**: Sets deadlines, defines subjects, and mandates welfare monitoring.  

  This draft gives the Vollmer lab a path forward while upholding the committee’s precautionary mandate. Circulate as-is, and good luck with PHIL 240!
