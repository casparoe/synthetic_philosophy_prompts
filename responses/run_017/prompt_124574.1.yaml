  The theorists have already established common vocabulary: four readings of "will of the people" (aggregative, deliberative, ascriptive, acclamatory) and three named difficulties (mandate underdetermination, spokesperson's regress, boundary problem). I need to be fair to both perspectives - one believes the will of the people exists independently of institutions, while the other sees it as purely an output of legitimate procedures.

  For the agreed claims section, I should create 8-10 substantive points both sides can genuinely endorse. These need to be meaningful, not just platitudes. I'll include concessions where each side acknowledges valid concerns from the other: the populist might concede that procedures are necessary to avoid dictatorship, while the proceduralist might admit that procedures sometimes fail to capture deeper public sentiment. Each claim should relate to their established vocabulary.

  In the verbal vs substantive section, I'll identify which disagreements stem from ambiguous terminology versus genuine substantive differences. For example, they might agree on definitions but disagree on which reading should be prioritized or how to handle the three difficulties. I'll be explicit about where terminology resolves conflicts versus where deeper divides remain.

