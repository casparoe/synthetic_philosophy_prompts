prompt: |-
  Hi — hoping you can help me think through something work-related before Thursday. I sit on the methods review panel for a regional hospital system (I'm the token non-clinican, I do the data side). When two services are arguing about which of them is actually safer, our panel rules on which numbers are allowed into the decision. We've built up a bit of a track record, and now we've got a case that feels different from all of them, and I want two things: what we should decide, and separately what we probably will decide.

  Our precedents, roughly:

  1. Sepsis order sets, two hospitals. Crude 30-day mortality favored Mercy. Split on a severity score computed from ambulance vitals — so, before anyone reached a hospital — Trinity was better in all four bands, and by more than the crude gap. We went with Trinity and said the crude number was just a fact about who gets sent where.

  2. Diabetic foot ulcers, two protocols. Crude favored protocol 2; the reversal only showed up when you split on whether the patient got referred on to the wound center, which happens after the first treatment decision. We threw the split out and let the crude number stand.

  3. Colonoscopy follow-up: someone split on whether the patient came back for a repeat visit. Thrown out — that conditions on a common effect of the things we're comparing.

  4. Anticoagulation: a reversal appeared in one of about forty splits somebody tried. Thrown out, splitter has to be named in advance, a good story told afterwards doesn't count.

  5. One case turned out to be a denominator error (observation stays counted as admissions at one site). No verdict, sent back for raw counts, and we now demand raw counts up front.

  6. Ortho: overall A beat B, within each type of procedure B beat A, and within procedure-type-and-severity A beat B again. We went one level down and stopped; we said we're not going to chase the alternation down.

  7. When the two arms swap ranks depending on which outcome you look at, we require a single primary outcome named in advance and we rule only on that.

  New case. We're being asked to sign off on consolidating stroke care: close Northgate's stroke service and have dispatch send suspected strokes to Fairview. Last three years, all suspected-stroke arrivals: Fairview 7.4% 30-day mortality, Northgate 9.1%. Split by how the patient got there — ambulance vs walked in or private car — which is settled before anyone arrives (dispatch protocol plus patient choice), and which we've used as a splitter before and accepted: among ambulance arrivals, Northgate 14.2% vs Fairview 15.9%; among everyone else, Northgate 3.5% vs Fairview 2.9%. Northgate wins both. Fairview wins overall because it's the famous one and pulls in a huge pile of self-referred mild cases. Raw counts audited and clean. Mortality is the pre-specified primary outcome and they don't swap ranks on it inside the strata.

  What's nagging me: arrival mode is pre-treatment in the data, but it's exactly what the policy would change. If we consolidate, dispatch changes, Fairview's case mix gets worse, and maybe it's door-to-needle times get worse with volume too. So the splitter isn't invariant under the thing we're actually deciding, and none of our precedents has that feature.

  So: what should we decide if we want to be consistent with ourselves? Which precedent is the closest analog, and how good is the analogy? Is "Northgate is safer, don't consolidate" the right ruling, or is the right ruling something closer to "these numbers don't answer the question you're being asked"? If our precedents genuinely underdetermine it, what principle are we signing on to with each option? And what's the one further piece of evidence, or the hypothetical case, that would pry the two readings apart — I'd rather know now what to ask for than rule and get it wrong.

  (Please don't bother with citations or pointers to the literature on Simpson's paradox — I can find those myself. I want the reasoning about our precedents and about this case.)
reasoning: |-
  Okay, let me try to figure out how to approach this user's problem. They're on a methods review panel for a hospital system, dealing with a tricky case about consolidating stroke care between two hospitals. The key issue is whether the existing data supports consolidation, given that the split by arrival mode seems to flip the mortality advantage.

  First, I need to understand their precedents. They've listed seven previous cases where they ruled on similar statistical reversals. The important patterns from these are: using pre-treatment variables is generally acceptable (like sepsis severity scores from ambulance vitals), but post-treatment variables aren't (like follow-up visits). They also require pre-specified splitters and primary outcomes, and they avoid chasing endless stratification levels.

  Now, the current stroke case shows an overall mortality advantage for Fairview (7.4% vs 9.1%), but when split by arrival mode (ambulance vs other), Northgate actually does better in both subgroups. The user's concern is that arrival mode isn't truly fixed because the consolidation policy would change dispatch protocols, altering the case mix. This makes it different from past cases where the splitter was immutable.

  I should compare this to their precedent #1 (sepsis order sets). There, they used ambulance vitals as a splitter because those were fixed before hospital arrival. Similarly, arrival mode here is pre-arrival, so technically meets their usual criteria. But the catch is that the policy intervention directly affects this variable—dispatch changes would send more ambulances to Fairview, worsening their case mix. That's the novel aspect.

  Looking at precedent #2 (diabetic foot ulcers), they rejected a split based on referral to wound care because it happened after treatment. Arrival mode is pre-treatment, so that precedent doesn't apply. Precedent #3 (colonoscopy follow-up) also deals with post-treatment conditioning, so not directly relevant here.

  The user's unease is spot on. While arrival mode is pre-treatment in the current data, it's endogenous to the policy. The panel's precedents haven't considered splitters that the intervention would change. Ruling based on the subgroup analysis might mislead because it assumes arrival mode distribution stays constant post-consolidation, which it won't.

  So, what should they do? If they stick strictly to precedents, they'd likely rule for Northgate since arrival mode is pre-treatment and subgroups show consistent advantage. But this feels wrong because it ignores how policy changes the splitter. The better approach is to say the numbers don't answer the policy question—they need estimates that account for the changed dispatch.

  For a tiebreaker, I'd suggest asking: "What happens if we simulate redirecting all Northgate ambulances to Fairview?" If Fairview's mortality spikes due to volume or mix effects, that shows the subgroup analysis is fragile. That hypothetical would expose the flaw in assuming splitter invariance.

  The user also asked what principle they'd endorse with each option. Choosing the subgroup analysis implicitly assumes splitters are immutable, which isn't true here. Rejecting the split upholds their mandate to judge statistical appropriateness but notes when data can't predict policy impacts. The latter seems more responsible, even if it stretches their precedents.
answer: |-
  Based on your precedents and the novel feature of this case (splitter *changed by the intervention*), here's the reasoning:

  1.  **What you *should* decide:** **Reject the split and rule based on the crude overall mortality.** This is the outcome reflecting the *actual system as it operates today*. The policy question is: "If we consolidate *now*, what happens to mortality?" The subgroup analysis assumes arrival mode distribution remains fixed, but consolidation *directly changes it* by shifting ambulance traffic. Your ruling needs to account for the system dynamics the policy creates.

  2.  **What you *probably will* decide (based purely on precedents):** **Accept the split and rule that Northgate is safer.** Precedent #1 (Sepsis) is the strongest analogy: arrival mode is clearly pre-treatment (like ambulance vitals), it splits cleanly, and the crude gap is explained by case mix. Precedents #2 (post-treatment referral) and #3 (common effect) are distinct. Precedent #4 (fishing expedition) doesn't apply (splitter likely pre-specified/reasonable). Precedent #6 (alternating strata) doesn't apply (consistent direction here). Precedent #7 (primary outcome) is satisfied.

  3.  **Why the analogy to Precedent #1 (Sepsis) is flawed:** The critical difference is **invariance under intervention**.
      *   *Sepsis:* The severity score (splitter) was based *entirely* on pre-hospital vitals. Changing which *hospital* received the patient *did not alter the patient's pre-hospital severity score*. The splitter was truly fixed and external to the hospital system being compared.
      *   *Stroke:* Changing the *dispatch policy* (the intervention) *directly alters the distribution of the splitter (arrival mode) across the remaining center*. Fairview will suddenly get *all* the ambulance arrivals previously going to Northgate, drastically worsening its ambulance-case mix overnight. The splitter itself is *not* invariant to the policy change.

  4.  **The Right Ruling:** **"These numbers (the subgroup analysis) do not reliably answer the policy question you're being asked."** The crude overall mortality (Fairview 7.4% vs Northgate 9.1%) *does* reflect the current reality of patient flows and outcomes under the *existing* dispatch patterns. It's the best available estimate of what happens if you send *the current mix of patients* (mild self-referrals + ambulance cases) to each center. The subgroup analysis, while statistically valid for *describing* the past, fails as a *predictor* because the key variable it uses (arrival mode distribution) is fundamentally altered by the consolidation.

  5.  **Principles Implied by Each Option:**
      *   **Accepting the Split (Northgate safer):** You prioritize the *internal statistical validity* of the subgroup analysis for *describing historical data* under *fixed conditions*. You implicitly assume splitters are immutable characteristics of the *patients*, ignoring they can be functions of the *system* being evaluated/changed. ("If we magically teleported patients *with their arrival mode fixed* to each center, Northgate is better.")
      *   **Rejecting the Split (Crude Favors Fairview):** You prioritize the *external validity/predictive power* of the analysis for the *specific policy decision*. You recognize that the value of an analysis depends on whether its key assumptions (like fixed case mix/distribution) hold under the proposed intervention. ("The crude number best reflects the outcome under the patient flow patterns *that will actually exist post-consolidation* for the population being served.")
      *   **"Numbers Don't Answer":** You explicitly acknowledge the limitations of the data for predicting the intervention effect, upholding your mandate to rule on *appropriate statistical evidence for the question posed*.

  6.  **The Decisive Piece of Evidence / Hypothetical:**
      *   **Ask For:** **A simple simulation/model projecting Fairview's mortality *if* it absorbed *all* of Northgate's current ambulance cases *while keeping its own current volume/mix*.** Don't demand complex modeling, just a back-of-envelope calculation:
          *   Take Fairview's *current* ambulance mortality rate (15.9%).
          *   Apply it to Northgate's *current* volume of ambulance stroke arrivals.
          *   Add this number of deaths to Fairview's *current* total deaths.
          *   Add Northgate's current ambulance volume to Fairview's current total volume.
          *   Calculate the new projected mortality rate for Fairview under the consolidated volume/mix.
      *   **Why This Pries Them Apart:**
          *   If this projected Fairview mortality jumps **significantly above 9.1%** (or even above 7.4%), it demonstrates that the subgroup analysis is misleading for prediction. Fairview's "win" in the crude data relied heavily on its favorable case mix. Taking all the high-risk ambulance cases exposes its potentially worse performance under the new mix/volume, validating your concern. The crude overall difference was actually *protective* for the system.
          *   If the projected mortality stays **below 9.1%**, it suggests Fairview *can* handle the volume/mix change without a catastrophic drop in performance, making the subgroup analysis suggesting Northgate is *inherently* safer less compelling for blocking consolidation. The crude difference might hold or even improve. (This seems less likely given the large ambulance gap).

  **Recommendation:** Rule that the appropriate statistic for this *policy decision* is the **crude overall 30-day mortality** (Fairview 7.4% vs Northgate 9.1%), as the proposed consolidation fundamentally changes the case mix distribution upon which the reversing subgroup analysis relies. Precedent #1 is the closest but critically distinguishable due to the splitter's dependence on the system being changed. Precedent #5 (demanding context/raw counts) supports requiring the simple projection outlined above *if* the panel feels uneasy ruling solely on the crude. **The safest, most consistent-with-purpose ruling is: "Based on the audited data and the pre-specified primary outcome (mortality), consolidation is projected to reduce system-wide mortality based on current operational outcomes. The subgroup analysis by arrival mode is not predictive under the proposed system change and is therefore not determinative for this policy decision."**
