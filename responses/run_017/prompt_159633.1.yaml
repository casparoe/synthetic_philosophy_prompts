  Okay, let me tackle this. The user is part of a philosophy/cognitive science reading group stuck on whether AI systems can "know how" like humans. They want desiderata for a theory of knowledge-how that can handle cases like chess engines or language models. 

  First, I need to unpack their core request: a list of requirements built from cases, not named theories. The user specifically mentions seven key distinctions: articulation vs success-only performance, robustness across novel situations, gradability of knowledge, retention without ability, productivity for new actions, and group knowledge. 

  Hmm... the user also wants me to flag tensions - especially between productivity and present ability, and between agent-access and competence-without-access. And they want commitment, not neutrality. 

  Let me structure this. The non-negotiables should be the absolute bare minimum - probably success-conditions and counterfactual robustness, since without those you can't even identify knowledge-how behaviorally. Gradability feels negotiable - we can model it as threshold-based. 

  The big tension is indeed productivity vs present ability. If we demand productivity (like escaping novel burning buildings), we must drop present ability as constitutive. That aligns with intellectualist views - knowledge-how as procedural knowledge-that enabling novel application. 

  For scoring theories: 
  - Intellectualism (knowledge-that) handles productivity and gradability well but struggles with articulation gaps. 
  - Ability-based views fail catastrophically on retention cases (know-how without ability) and group knowledge. 
  - Hybrids (like dispositions plus representations) might salvage some but inherit problems. 

  The killer case is the paralyzed pianist - if someone can still "know how" to play when physically unable, that sinks pure ability views. Meanwhile, the navigation team case sinks individualistic intellectualism. 

  I'll position intellectualism as strongest despite flaws, since productivity and counterfactual reasoning are more central than first-person access. The user's suspicion about tensions is correct - we have to choose between present ability and novel application, and I'd sacrifice the former.
answer: |-
  Here is a committed specification of desiderata for a theory of knowledge-how, designed to evaluate artificial systems, with clear verdicts on tensions and candidate views:

  ---

  ### **Non-Negotiable Core Desiderata**  
  1. **Success-Condition Link**  
     *Requirement*: Knowledge-how must entail *reliable success* in performing the task under appropriate conditions.  
     *Why non-negotiable*: Without a success link, "knowing how" loses its functional anchor. A chess engine that loses every game cannot be said to "know how" to play chess.  

  2. **Counterfactual Robustness**  
     *Requirement*: Knowledge-how must support adaptive performance in *novel but relevantly similar circumstances*.  
     *Why non-negotiable*: Mere luck or memorization (e.g., a policy that fails if a single pixel changes) isn’t knowledge-how. A robot transferring simulation training to uneven real terrain must handle minor perturbations.  

  3. **Productivity**  
     *Requirement*: Knowledge-how must enable actions in *never-encountered situations* (e.g., escaping a novel burning building).  
     *Why non-negotiable*: Rigid stimulus-response systems (e.g., lookup tables) lack the generative flexibility characteristic of genuine know-how.  

  ---

  ### **Negotiable/Contingent Desiderata**  
  4. **Articulation Gap**  
     *Requirement*: Accommodate agents who succeed *without ability to articulate their method* (e.g., expert cyclists).  
     *Status*: Preference (anti-intellectualist camp). *Tension*: Strong agent-access demands conflict with this.  

  5. **Gradability & Attrition**  
     *Requirement*: Allow know-how to admit *degrees* and be *lost gradually* (e.g., rusty language skills).  
     *Status*: Preference (pragmatist camp). Could be modeled as decay of reliability/robustness.  

  6. **Retention Without Ability**  
     *Requirement*: Permit retaining knowledge-how *despite temporary inability* (e.g., injured pianist "knowing how" but unable to play).  
     *Status*: Non-negotiable *if* ability-constitutive views are rejected. *Conflict*: Directly contradicts pure dispositionalism.  

  7. **Group Knowledge-How**  
     *Requirement*: Explain how a *team* (e.g., surgical crew) can know-how collectively *without any single member possessing full know-how*.  
     *Status*: Preference (social epistemology camp).  

  ---

  ### **Key Tensions & Tradeoffs**  
  - **Fatal Tension**: **Productivity (D3) vs. Ability-Constitutivity (D6)**  
    - *Verdict*: Drop **ability-constitutivity** as a requirement. *Why*: Productivity (novel problem-solving) is central to intelligence; know-how can persist *structurally* (e.g., as a policy or schema) without current executability. An incapacitated surgeon retains know-how as a cognitive map for guiding others.  
  - **Serious Tension**: **Counterfactual Robustness (D2) vs. Articulation Demands**  
    - *Verdict*: Reject strong **agent-access requirements**. *Why*: Robustness in novel scenarios often relies on subpersonal processes (e.g., sensorimotor adjustments in cycling). Demanding agent-level articulation over-intellectualizes know-how.  

  ---

  ### **Scoring Candidate Views**  
  **1. Intellectualism (Know-How as Know-That)**  
  - *Success*: ✅ Easily handles **productivity (D3)** and **retention without ability (D6)** via propositional representation.  
  - *Failure*: ❌ Struggles with **articulation gap (D4)** (why can’t experts articulate?) and **group knowledge (D7)** (distributed propositions aren’t individually known).  
  - *Verdict*: Best on non-negotiables (D1–D3) if "knowledge-that" includes procedural schemas (e.g., *de se* practical rules).  

  **2. Pure Dispositionalism (Know-How as Ability)**  
  - *Success*: ✅ Cleanly explains **articulation gap (D4)**.  
  - *Failure*: ❌ **Catastrophic failure** on **retention without ability (D6)** and **group knowledge (D7)** (no disposition without individual ability). Also weak on **productivity (D3)** (novel cases aren’t dispositions).  
  - *Verdict*: Inadequate—fails core desiderata.  

  **3. Hybrid (Know-How as Structured Dispositions + Representations)**  
  - *Success*: ✅ Balances **robustness (D2)** and **gradability (D5)** via dispositional strengths; explains **group knowledge (D7)** via distributed representations.  
  - *Failure*: ❌ Ambiguous on **retention (D6)** (is a "dormant" representation enough?) and risks collapsing into intellectualism.  
  - *Verdict*: Promising but must sacrifice ability-constitutivity to resolve D3/D6 tension.  

  ---

  ### **Definitive Stance**  
  - **Non-negotiables**: Success (D1), Robustness (D2), Productivity (D3). *Why*: Without these, know-how is indistinguishable from luck, habit, or rote recall.  
  - **Most exclusionary requirement**: **Productivity (D3)**. It disqualifies rigid algorithms (e.g., brute-force chess AIs) and pure behaviorist views.  
  - **Sacrificed requirement**: **Ability-constitutivity**. *Why*: Counterexamples (D6) and productivity (D3) demand separating *competence* from *execution*. Know-how is a *structural capacity* (e.g., a generative policy), not a transient ability.  
  - **Artificial systems verdict**: A system (e.g., RL-trained robot) *can* possess knowledge-how **iff** it meets D1–D3: succeeds robustly and productively. Phenomenology is irrelevant; inspectable internal states (e.g., neural policies) suffice as the "structure" of know-how.  

  **Final Position**: Know-how is *success-ready cognitive structure*, realized in individuals or collectives, that enables robust and productive action. Neither propositions nor dispositions alone suffice—but a modernized intellectualism (with subsymbolic "schemas") fits best. Drop ability-constitutivity entirely.
