answer: |-
  ## Sestina of the Ruled Page

  This worn calfskin weight against my ribs, my **notebook**,
  Holds course where currents fail. My trembling **hand**
  Turns pages mapped like charts. Within my **skull**,
  The old collision’s void. I find the **street**
  By *this* name, *here*. A fragile, paper **trust**
  Replaces what the shattered bone denied my **mind**.

  What tides erased, the ink preserves. My **mind**
  Is bound within this script, this faithful **notebook**.
  Each birthday penned, each promise – brittle **trust**
  In graphite on blue lines. A steady **hand**
  Must guide me past the corner where the **street**
  Forks into fog, guarding the fragile **skull**.

  The surgeon probed the damage, tapped my **skull**,
  Said "Gone." But is it gone? This borrowed **mind**
  Resides in paragraphs. I walk the **street**
  Not lost, directed by the open **notebook**.
  Its entries guide my purpose, frame my **hand**
  That turns to *her* – described. Cold, copied **trust**.

  Is it the same? This referenced, frail **trust**?
  Does knowing live where data fills the **skull**'s
  Dark hollow? When I lift my clumsy **hand**
  To trace her face on paper, is my **mind**
  Truly extended to this patient **notebook**,
  Or merely propped, adrift on every **street**?

  The city moves, indifferent to this **street**
  Or that. Its logic needs no human **trust**,
  No fragile, leather-bound external **notebook**.
  The buses run. The pavement jars my **skull**.
  But *I* know where I’m bound. This hybrid **mind**
  Relies on the connection, page to **hand**.

  Then sudden. Darkness. Or a grasping **hand**
  Not mine. Or flames. Or sterile lights. The **street**
  Recedes. They take it. Where now rests my **mind**?
  The system breaks. The fundamental **trust**
  Is severed. Who am I, this empty **skull**
  Without the compass of the stolen **notebook**?

  *(Envoy)*

  The **notebook** lost, the familiar **street** dissolves to haze.
  Where lies the **trust**? Inside this fragile **skull** or out?
  My vacant **hand** seeks nothing. Where’s my **mind**?

  ---

  ## Line-by-Line Engagement (For the Philosophically Inclined)

  1.  **"This worn calfskin weight against my ribs, my notebook"**: Establishes the notebook as an integrated, embodied object ("against my ribs").
  2.  **"Holds course where currents fail. My trembling hand"**: The notebook performs a cognitive function (navigation) internal processes cannot. The "trembling hand" shows bodily reliance.
  3.  **"Turns pages mapped like charts. Within my skull"**: Explicit cognitive delegation – the hand acts *on* the notebook *as if* it were an internal chartroom. Contrast with "skull" as the biological boundary.
  4.  **"The old collision’s void. I find the street"**: The internal deficit ("void") necessitates the external solution ("find the street"). "Street" represents the environment navigated.
  5.  **"By *this* name, *here*. A fragile, paper trust"**: Specificity of the notebook's role ("this name, here"). "Trust" highlights the functional reliability condition – the notebook *must* be accessible and accurate for the system to work.
  6.  **"Replaces what the shattered bone denied my mind"**: Clear statement of parity – the notebook replaces the lost internal function. "Mind" is the disputed territory – is it *only* in the skull now?

  **Stanza 2: Rotation (6-1-5-2-4-3)**
  7.  **"What tides erased, the ink preserves. My mind"**: "Mind" leads, but its content is defined by the external ("ink preserves").
  8.  **"Is bound within this script, this faithful notebook"**: Strong claim – the mind is "bound within" the notebook. Blurs agent/vehicle.
  9.  **"Each birthday penned, each promise – brittle trust"**: The notebook stores essential personal knowledge ("brittle trust" – emphasizes vulnerability of the coupling).
  10. **"In graphite on blue lines. A steady hand"**: "Hand" acts as the mediator between internal intent and external resource ("graphite on blue lines").
  11. **"Must guide me past the corner where the street"**: The hand guides *using* the notebook to navigate the environment ("street").
  12. **"Forks into fog, guarding the fragile skull"**: The environment ("fog") threatens the biological core ("fragile skull"). The notebook helps "guard" it, suggesting interdependence.

  **Stanza 3: Rotation (6-1-5-2-4-3)**
  13. **"The surgeon probed the damage, tapped my skull"**: Returns to the biological injury site ("skull").
  14. **"Said 'Gone.' But is it gone? This borrowed mind"**: The philosophical question posed directly. "Borrowed mind" implies the notebook *is* the mind, sourced externally.
  15. **"Resides in paragraphs. I walk the street"**: "Resides" is a powerful verb for location. Cognition ("mind") is situated in text ("paragraphs") enabling environmental action ("walk the street").
  16. **"Not lost, directed by the open notebook"**: Functional success ("Not lost") achieved *by* the notebook ("directed by"). The notebook must be actively engaged ("open").
  17. **"Its entries guide my purpose, frame my hand"**: The notebook's content ("entries") shapes intention ("purpose") and action ("frame my hand").
  18. **"That turns to *her* – described. Cold, copied trust"**: The critical moment – knowing his daughter requires accessing the external description ("Cold, copied trust"). Is this cognition? Or mere data retrieval?

  **Stanza 4: Rotation (6-1-5-2-4-3)**
  19. **"Is it the same? This referenced, frail trust"**: Directly questions the parity ("Is it the same?"). "Referenced, frail trust" highlights the external, vulnerable nature.
  20. **"Does knowing live where data fills the skull's"**: Challenges the internalist view – does knowing ("knowing live") require the biological container ("skull's") or can it be where the data *is*?
  21. **"Dark hollow? When I lift my clumsy hand"**: The biological deficit ("Dark hollow") contrasted with the physical action ("lift my clumsy hand") required for access.
  22. **"To trace her face on paper, is my mind"**: The action ("trace") on the external medium ("paper") – is this an act *of* mind?
  23. **"Truly extended to this patient notebook"**: Uses the term "extended" explicitly. "Patient notebook" personifies the tool.
  24. **"Or merely propped, adrift on every street"**: Presents the counter-argument – is it just a crutch ("propped"), leaving the core self ("mind") helpless ("adrift") in the environment ("street")?

  **Stanza 5: Rotation (6-1-5-2-4-3)**
  25. **"The city moves, indifferent to this street"**: The environment ("city," "street") operates independently of the cognitive system.
  26. **"Or that. Its logic needs no human trust"**: Environmental logic doesn't require the "trust" (reliability/access condition) the navigator depends on.
  27. **"No fragile, leather-bound external notebook"**: Contrasts the city's autonomy with the system's specific, vulnerable component ("fragile... notebook").
  28. **"The buses run. The pavement jars my skull"**: External reality continues ("buses run"), impacting the biological body ("jars my skull").
  29. **"But *I* know where I’m bound. This hybrid mind"**: Assertion of self and knowledge ("*I* know"), defined as "hybrid mind" – a blend of internal and external.
  30. **"Relies on the connection, page to hand"**: Acknowledges the critical coupling ("connection") between the external resource ("page") and bodily interface ("hand").

  **Stanza 6: Rotation (6-1-5-2-4-3) & Loss**
  31. **"Then sudden. Darkness. Or a grasping hand"**: The catastrophic break. External force ("grasping hand") or internal event ("Darkness").
  32. **"Not mine. Or flames. Or sterile lights. The street"**: Causes of loss (theft, fire, hospitalization). "Street" (environment) recedes as context is lost.
  33. **"Recedes. They take it. Where now rests my mind?"**: The notebook is taken ("They take it"). The core question returns with urgency ("Where now rests my mind?").
  34. **"The system breaks. The fundamental trust"**: The functional system collapses. The essential reliability/access condition ("fundamental trust") is destroyed.
  35. **"Is severed. Who am I, this empty skull"**: Identity crisis ("Who am I"). The biological container ("empty skull") is presented as insufficient alone.
  36. **"Without the compass of the stolen notebook"**: The notebook was the orienting tool ("compass"). Its loss defines the emptiness.

  **Envoy (The Sharpened Question)**
  37. **"The notebook lost, the familiar street dissolves to haze."**: Loss of the vehicle ("notebook") causes the known environment ("familiar street") to become unintelligible ("haze"). Words paired: notebook/street.
  38. **"Where lies the trust? Inside this fragile skull or out?"**: The critical uncertainty. Does the necessary reliability ("trust") reside biologically ("inside... skull") or was it inherent in the *system* ("out")? Words paired: trust/skull.
  39. **"My vacant hand seeks nothing. Where’s my mind?"**: The bodily interface ("vacant hand") is purposeless without the tool. The final, unanswered question – "Where’s my mind?" – hangs. The poem refuses to locate it definitively in *either* the skull *or* the lost notebook. Words paired: hand/mind. The pairing itself forces the question: is the hand seeking the mind? Is the mind where the hand *would* seek the notebook? The division ("Where’s my mind?") is stark, offering no resolution.

  **How it Meets the Requirements:**

  1.  **Form & Rotation:** Strict sestina structure with the given end-words and correct rotation, culminating in the envoy with paired words.
  2.  **Argument via Rotation:** The shifting positions *enact* the debate:
      *   "Mind" starts as disputed (line 6), becomes "borrowed" and residing externally (14,15), is questioned (18,24), declared "hybrid" (29), and finally lost (33,39).
      *   "Notebook" transforms from integrated tool (1) to the residence of mind (8,15) to the essential compass (36) whose loss defines the void.
      *   "Trust" evolves from a functional condition (5,9) to the fundamental glue of the system (34) to the core uncertainty about location (38).
      *   "Hand" is the constant bridge between internal intent and external resource (2,10,17,21,30), becoming purposeless ("vacant") at the end (39).
      *   "Skull" is the damaged boundary (3,12,13,20,35) constantly contrasted with the external solution, and the site of the final, unanswered question about "trust" (38).
      *   "Street" is the environment navigated *through* the system (4,11,15,24,32), which becomes meaningless without it (37).
  3.  **Parity Principle Enacted:** The poem *shows* the notebook playing the functional role of biological memory (navigation, personal knowledge, identity). The rotation forces the *same* words to perform *different* relational functions within the cognitive system across stanzas, demonstrating that the *role* matters more than the *location*. The loss scene makes the functional equivalence stark – without the notebook, core capacities vanish.
  4.  **The Loss & The Sharpened Question:** The sixth stanza delivers the loss abruptly. The envoy presents the direct, unresolved question ("Where’s my mind?") born from that loss, sharpened by the pairing of words that forces the location issue ("trust/skull", "hand/mind").
  5.  **Answering the Objection (Instrument vs. Constituent):** The poem embodies the tension without resolution:
      *   *Extended Mind View:* The notebook is described as where the mind "resides" (15), is "bound within" (8), and is declared part of a "hybrid mind" (29). Its loss results in the complete dissolution of identity and environmental understanding (37,39). The hand seeks *nothing* – suggesting the mind *was* the system.
      *   *Embedded/Instrumental View:* The notebook is "referenced" (19), "copied" (18), and a "compass" (36) – tools used *by* an agent. The hand is "clumsy" (21) and ultimately "vacant" (39), suggesting an inner agent now devoid of its tool. The question "Who am I, this empty skull?" (35) implies a core self distinct from the tool, even if diminished.
      *   *The Pressure:* The poem makes both readings plausible. A proponent of Extended Mind sees the catastrophic loss of self as proof the notebook was constitutive. A critic sees the persistence of the question "Who am I?" and "Where's my mind?" as proof of an inner core tragically stripped of its essential instrument. The poem holds this tension perfectly in the envoy's unanswered questions and the final image of the vacant hand.
  6.  **No False Consolation:** There is no surviving "inner self" with dignity. There is emptiness ("empty skull"), vacancy ("vacant hand"), haze, and a desperate, unanswered question. The horror is in the ambiguity and the complete functional collapse.
  7.  **Debate Engagement:** Every line can be parsed for the vehicle/agent boundary:
      *   "My trembling hand / Turns pages" (2-3): Hand (agent's body part) acts on notebook (vehicle).
      *   "This borrowed mind / Resides in paragraphs" (14-15): Mind (agent's faculty) *is located in* the notebook (vehicle) – blurring the boundary.
      *   "Is my mind / Truly extended... Or merely propped" (22-24): Directly poses the boundary question.
      *   "This hybrid mind / Relies on the connection" (29-30): Acknowledges interdependence, but "relies on" could imply instrumentality.
      *   The final line ("My vacant hand seeks nothing. Where’s my mind?") is the ultimate ambiguity: Does the hand seek the *notebook* (tool) or the *mind* (self)? Is the mind missing *because* the notebook is gone (constitutive), or is the hand vacant *because* the mind is gone (and the notebook was merely its tool)? The poem refuses a clear answer, forcing the reader to confront the live pressure of the debate within the experience depicted.
