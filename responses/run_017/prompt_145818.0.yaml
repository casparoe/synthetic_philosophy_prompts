  In conclusion, the bad step is (1). The argument in (1) holds for arbitrary priors, but real agents have structured priors that allow cheap safe filters. The author can then argue that classical symbol systems failed because they did not use such structure, but that the frame problem is not an in-principle barrier for structured agents.

