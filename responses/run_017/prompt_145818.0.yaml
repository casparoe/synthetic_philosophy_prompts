  Diagnosis:

  The most promising place to break the argument is step (1). The author states that (1) is "close to a theorem", but note that the theorem would be: "For every cheap filter f, there exists a prior P and an observation Q such that f is not safe for (P, Q)." This is true. However, the agent does not require a filter that works for every prior; it requires one that works for its own prior. And for the agent's own prior, there might exist a cheap safe filter.

