prompt: |-
  I take the minutes for our city's Names and Monuments Panel — the little advisory body that gets dragged in every time somebody wants a statue moved or a school renamed — and I've started noticing that we vote one way and then justify it a different way each time. I'd like to know what rule we're actually running before next month's meeting, because we've got a genuinely nasty one coming up. Here's the record so far. We voted to remove the statue of Josiah Creel, the cotton magnate who paid for the infirmary and the free library, to the museum store, leaving the plinth empty; his money came from slave-picked cotton and the city's Caribbean and African communities had campaigned for years. We voted to keep the statue of Dr Marianne Voss, who more or less invented municipal sanitation here and cut typhoid deaths dramatically, and who also spent two decades campaigning for the compulsory sterilization of people with learning disabilities and feeding the campaign that produced the country's sterilization law; we kept it and bolted on a second plaque, and the minutes say her public health work is separable from the campaigning and that nobody living in this city carries the mark of that side of her career the way people still carry Creel's. We voted to rename Calloway Primary, named after the city's first director of education, who built the school system and also designed its segregated special schools and wrote the manual that fed into the same sterilization law; it's now named after a local nurse, and his name went to a plaque in the archive. And we kept the memorial to the men of the city who died in the frontier wars, on the grounds that it names no one in particular and honours conscripts rather than the cause, though we did pay for a second inscription naming the dead on the other side. One thing worth flagging: we have never yet renamed anything purely because a historian dug up something about a figure nobody in the city had heard of.

  The new one: a primary school whose old building is being replaced wants to name the new one after Wilf Sowerby, headmaster there from 1948 to 1971, who rebuilt the school after the war and is remembered warmly by hundreds of living former pupils, several of whom are on the fundraising committee. A local historian has just established that before he came here Sowerby was a district officer in the colonial administration in Kenya during the Mau Mau emergency, and that he signed the detention orders and ran one of the camps where detainees were badly abused. Nobody in the city knew any of this, but the city does have a Kenyan community, including a couple of families whose grandparents were detained, and their association has written to ask the school not to use the name; the alumni, for their part, feel like they're being asked to erase a man who was kind to them. So: what are the two or three rules that fit all four of our previous votes equally well, and what does each of them say about Sowerby? Give me your best guess at which way we'll actually go and why you'd pick that rule over the others, tell me which of our four precedents is the closest analogue and which one we'll probably reach for dishonestly, and then hand me the one hypothetical case you'd want us to decide next that would tell the rules apart. And if you think our precedents genuinely don't settle it either way, say so plainly and tell me what principle we'd be committing ourselves to with each of the options on the table — naming it, naming it with a permanent counter-inscription, naming it after the pupils instead, or something else.
reasoning: |-
  Okay, the user is part of a city's Names and Monuments Panel and has noticed inconsistencies in how they justify their votes on renaming or removing monuments. They've provided four past cases and now face a tricky decision about naming a school after Wilf Sowerby. They want to identify the underlying rules from the precedents, predict the outcome for Sowerby, and find a hypothetical case to clarify future decisions.

  First, I need to analyze the four precedents to find common principles. The cases involve Josiah Creel (statue removed), Marianne Voss (statue kept with added plaque), Calloway Primary (renamed), and the war memorial (kept with added inscription). 

  Looking at Creel: his wealth came from slavery, directly harming communities that still exist in the city. The panel removed his statue. The key factors seem to be direct harm from his actions and ongoing impact on present communities.

  For Dr. Voss, her public health work was separated from her eugenics advocacy. The panel argued that no living individuals carry the harm from her actions, unlike Creel's victims. They kept the statue but added a plaque acknowledging the controversy. This suggests separation of deeds and lack of current victims.

  Calloway was involved in segregation and contributed to sterilization laws. The school was renamed, likely because his harmful actions were part of his professional role in education, which directly affected citizens. This contrasts with Voss, whose harmful actions were separate from her public health contributions.

  The war memorial honored conscripts, not the cause, and no specific individuals. Adding an inscription for the other side showed contextualization. The distinction here is between honoring individuals versus collective memory, and the memorial didn't glorify the war's cause.

  So, possible rules:
  1. **Direct Harm vs. Beneficial Deeds Separation:** If the harm is inseparable from the legacy (Creel, Calloway), removal/renaming occurs. If separable (Voss), retain with context.
  2. **Present Community Harm:** Actions affecting groups still present in the city lead to removal (Creel, Calloway). If no current affected group (Voss), keep with acknowledgment.
  3. **Collective vs. Individual Commemoration:** Honor groups (conscripts) rather than individuals with controversial pasts.

  Now, applying these to Sowerby: He was a beloved headmaster but involved in colonial abuses in Kenya. There's a Kenyan community affected, similar to Creel's case. However, his harmful actions were in a different role (colonial officer) before his time as an educator. This is like Voss, where harmful actions were separate. But the Kenyan community's presence is a strong factor, aligning with the direct harm rule.

  The panel might lean towards naming the school but adding a plaque. Sowerby's educational work is separable from his colonial past, and a plaque could address the abuses. However, the affected Kenyan community might push for renaming. The closest precedent is Voss, but the community impact might make them inconsistent. They might dishonestly use the war memorial precedent, arguing it's about collective memory, but that's a stretch.

  A hypothetical case to test the rules: A philanthropist who donated a hospital but privately advocated for harmful policies. If the advocacy isn't tied to their public work, they might get a plaque. If the funds came from exploitative practices, removal might occur. This would clarify if funding source or role separation matters more.

  The user needs clarity on their inconsistent justifications. Their deeper need is for a principled framework to handle future cases fairly and avoid public backlash. They might also want to balance historical acknowledgment with community sensitivities without appearing hypocritical.
answer: |-
  Based on your panel's voting history, I identify three consistent underlying rules that simultaneously explain *all four* precedents. Here's how they map to your cases, applied to Sowerby, with a prediction and strategic analysis:

  ### The Three Rules Explaining Your Precedents
  1.  **The "Tangible Local Harm & Legacy" Rule:** Removal/renaming occurs if the figure's actions caused *direct, systemic harm to groups still present in the city*, AND that harm is inseparable from their primary local legacy/funding source. *Applied:*
      *   *Creel:* Removed. Slave-picked cotton wealth (direct harm source) built local institutions (legacy). Harmed groups (African/Caribbean communities) are present.
      *   *Voss:* Kept. Eugenicist campaigning was separable from her *local* public health work. No identified *local* living victims.
      *   *Calloway:* Renamed. Segregated schools & sterilization manual caused *direct local harm* to identifiable groups (disabled citizens/children). Legacy inseparable from his local role.
      *   *War Memorial:* Kept. Honors anonymous conscripts, not the cause. No *specific local harm* attributed to the memorialized group itself.
      *   **Sowerby:** Kenyan colonial actions caused *direct harm* (detention/abuse), and harmed groups (Kenyan community, some with direct family links) *are present locally*. BUT: This harm occurred *before* and *outside* his local role/legacy (Headmaster). **Tension:** Harmed group present (like Creel/Calloway) vs. Harm separate from local legacy (like Voss).

  2.  **The "Separation of Deeds & Role" Rule:** Commemoration can stand if the problematic actions are distinct in time, place, or nature from the *primary reason for commemoration locally*, *and* can be effectively countered/contextualized. *Applied:*
      *   *Creel:* Removed. Harmful actions (slavery) *were* the source of wealth enabling commemoration. Inseparable.
      *   *Voss:* Kept. Public health (local commemoration reason) distinct from eugenics campaigning (different role, national scope). Addressed by plaque.
      *   *Calloway:* Renamed. Harmful actions (segregation/sterilization advocacy) *were central to his local role* (Education Director). Inseparable.
      *   *War Memorial:* Kept. Commemoration is for sacrifice, not specific deeds/policy. Contextualized by added inscription.
      *   **Sowerby:** Colonial atrocities distinct from *local reason for commemoration* (post-war school rebuilding & beloved headmaster). **Tension:** Severity of colonial harm may make "separation" feel inadequate compared to Voss's campaigning. Plaque possible.

  3.  **The "Living Memory & Community Impact" Rule:** The weight given to *current local sentiment and direct personal connections* vs. *historical reassessment by affected groups*. Removal is less likely if the figure is personally remembered positively by a large local constituency *and* no direct local victims are identified. *Applied:*
      *   *Creel:* Removed. No strong positive living memory; strong campaign by affected community.
      *   *Voss:* Kept. Strong positive local legacy in public health; no identified *local* victims of her eugenics work.
      *   *Calloway:* Renamed. No strong positive living memory cited; harm directly impacted local groups (disabled children/families).
      *   *War Memorial:* Kept. Strong community memory/connection to conscripts; memorial doesn't celebrate cause.
      *   **Sowerby:** **Strongest factor.** Hundreds of living former pupils with positive memories. **BUT:** Directly affected community (Kenyan families) *is* local and vocal. **Tension:** Powerful alumni vs. harmed community.

  ### Prediction & Reasoning
  *   **Prediction:** Your panel will **vote to name the school after Sowerby, but add a permanent counter-inscription** acknowledging the colonial past.
  *   **Why this rule?** The panel will prioritize **Rule 2: Separation of Deeds & Role**. They'll argue his colonial role was separate from his local headmaster role and legacy, allowing for contextualization (like Voss). Rule 3 (Living Memory) provides strong cover due to the alumni support. Rule 1 (Tangible Local Harm) is the counter-argument, but the separation in role/time/location will likely be deemed sufficient to avoid renaming.
  *   **Closest Analogue:** **Dr. Marianne Voss.** Both involve severe harm in one sphere separated from significant local beneficial contributions in another. The counter-inscription mirrors the second plaque.
  *   **Dishonest Precedent Reach:** The panel will likely **reach for the War Memorial precedent dishonestly.** They'll stretch the "honors individuals, not the cause/regime" logic used for conscripts to argue Sowerby is being honored *only* for his headmastership, ignoring that he *was* the colonial administrator implementing the policy. This avoids confronting the tougher parallels with Voss/Calloway.

  ### The Hypothetical Test Case
  To definitively separate Rule 1 (Tangible Local Harm/Legacy) from Rule 2 (Separation of Deeds), propose this case next:

  > **The Industrialist Philanthropist with Toxic Legacy:** A park is named after a 1920s factory owner who donated the land. He was a major local employer and philanthropist (libraries, clinics). New research reveals his factory knowingly dumped highly toxic waste into the river for decades, causing elevated cancer rates *specifically in the downstream neighborhood* (which still exists, predominantly working-class families). His philanthropy funds came directly from the factory profits.

  *   **Why it tests the rules:**
      *   **Rule 1 (Tangible Harm/Legacy)** demands renaming: Direct, local harm source (pollution) funded the legacy (park/philanthropy), and harmed group is present.
      *   **Rule 2 (Separation)** would struggle: The harm (pollution) was integral to the business generating the wealth for his philanthropy *and* occurred locally alongside his "good deeds."
      *   **Rule 3 (Living Memory)** is mixed: Positive memory as employer/philanthropist vs. direct harm to a specific, identifiable local community.
      *   **Outcome:** If renamed, Rule 1 dominates. If kept with a plaque ("acknowledging complex legacy"), Rule 2/3 dominate despite the inseparable harm.

  ### If Precedents Don't Settle Sowerby (An Assessment)
  The precedents genuinely create tension for Sowerby. **Rule 1 (Tangible Harm)** points towards *not naming* (like Creel/Calloway: harmed group present). **Rule 2 (Separation)** and **Rule 3 (Living Memory)** point towards *naming with context* (like Voss/Memorial). There's no perfect fit.

  *   **Principle with each option:**
      *   **Name it (Sowerby School):** Principle: *Local positive contributions and living personal connections outweigh past actions in a different context, provided they are separable.* (Prioritizes Rule 2 & 3).
      *   **Name it with Permanent Counter-Inscription:** Principle: *Full context is necessary for commemoration; the good does not erase the bad, but both can be presented.* (Attempts balance, leans on Rule 2).
      *   **Name it after the pupils (e.g., "Oakwood Alumni School"):** Principle: *When commemoration of an individual becomes untenable due to harm, shift focus to the community they served.* (Avoids the individual judgment, appeases Rule 3).
      *   **Don't name it after Sowerby:** Principle: *Perpetrating grave human rights abuses disqualifies an individual from public honor, regardless of subsequent local good deeds or separation of roles.* (Prioritizes Rule 1 and moral absolutism).

  **Recommendation for the Panel:** Given the tension, the counter-inscription option is the most consistent *procedurally* with Voss. However, be prepared for significant criticism from the Kenyan community, as the *severity* of colonial violence may make "separation" feel morally insufficient compared to Voss's repugnant but non-violent campaigning. The hypothetical test case (Toxic Philanthropist) is crucial for future clarity. Good luck with the "nasty one."
