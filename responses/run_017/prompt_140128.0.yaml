  We are building a flowchart-style quiz with 8-10 questions. Each question is a concrete scenario with 2-3 answer options. The goal is to distinguish between several ethical positions without the questions being leading.

  Key distinctions to cover:
  1. Whether pain and pleasure are on a single scale (with a possible "cliff") or fundamentally different.
  2. If there is a cliff, whether it is about the worst moment of an experience or the total suffering in a life.
  3. Whether the cliff is only in one direction (bad beating any good) or also the other way (bliss beating any mild bad).
  4. Whether we can aggregate tiny pleasures across many people to overcome the cliff for one person's suffering, or if the cliff is per person and non-aggregable.
  5. Whether the existence of the people matters (i.e., if the alternative is that they never exist).

  Positions to identify:
  - Total utilitarianism (classic): maximize total pleasure minus pain.
  - Prioritarianism: give extra weight to the worse off (so reducing suffering is more important than increasing pleasure, especially for those already suffering).
  - Negative utilitarianism: minimize suffering, and pleasure doesn't matter (or matters less) except as absence of suffering.
  - Lexical negative utilitarianism: suffering above a certain intensity threshold is so bad that no amount of pleasure can compensate for it, but below that threshold, trade-offs are normal.
  - Lexical threshold view (asymmetric or symmetric): trade-offs are normal for mild experiences, but beyond a certain intensity (either for pain or for pleasure) they become non-tradeable.

  We also note the possibility of symmetric lexical thresholds (bliss being non-tradeably good) but that is less common.

  We design the questions to be concrete and everyday. We must avoid leading questions.

  We will build a tree of questions that branch based on these distinctions. We'll then assign the leaves to the positions.

