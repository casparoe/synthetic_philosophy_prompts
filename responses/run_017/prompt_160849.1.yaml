answer: |-
  Alright, let's get into it. Your "common source" gambit is a fair shot at the independence assumption in arguments like PBR. I'll grant that *if* the hidden states of the two systems were perfectly correlated from the ancient shared source *specifically to match the preparation claims later made*, you could evade the contradiction. But let's examine the real cost of that escape hatch.

  First, this isn't just *any* correlation. It needs to be *exquisitely fine-tuned* to the *specific pure states* ψ and φ we chose to prepare *later*. The hidden variables at the source must "know" not only that these two specific systems will be subjected to preparations labeled |ψ><ψ| and |φ><φ| (even if |ψ> and |φ> are incompatible bases!), but also that *these specific measurements* designed to reveal the contradiction will be performed on them later. This isn't mere correlation like spin-up/spin-down pairs in a Bell test; it's the source anticipating and encoding the *entire future experimental context* – preparations *and* measurements – for these individual systems. This is vastly more specific and prescient than the generic "correlation in the past" needed for Bell superdeterminism.

  Second, consider scalability. Suppose I prepare *three* systems in three different pure states (say |0>, |+>, and some |θ>). The PBR argument extends: if the epistemic view holds and preparations overlap, there exists a triple of hidden states compatible with *all three* preparations. There also exists a measurement whose outcome is predicted to be impossible (probability zero) by *any* product state combining these three "overlapping" quantum states. To evade *this* contradiction with your common source, the source’s hidden variables must now be correlated *across all three systems* to perfectly mimic the overlapping supports for *these three specific states*, *and* anticipate the specific *three-system measurement* we perform. The complexity and required foresight in the hidden variable state at the source explode combinatorially with every additional system you prepare independently. The Bell superdeterminist only needs correlation in *one* basis for entangled pairs; you need your source to anticipate *any arbitrary future preparation and measurement choices* across *multiple* systems. *That's* the vastly higher price in conspiracy your epistemic view demands to survive.

  So, where does that leave us? The independence assumption looks pretty cheap compared to the *degree* and *specificity* of fine-tuning your view requires. What specific mechanism at this ancient source could possibly orchestrate this, undetectably, for arbitrary future choices?
