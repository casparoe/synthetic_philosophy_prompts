  #### (c) Case II: Equal Stakes (4/4)  
  **What’s right:**  
  - Correct verdict: Dose to the 30 Esmes.  
  - Accurately invokes tie-breaking: Claims are equal (each faces 2 days), so numbers break the tie.  
