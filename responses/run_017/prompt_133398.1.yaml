  - Correctly notes that rejectability depends on objective reasons, not actual consent.  
  - Clearly defines the aggregation problem: burdens/benefits across persons cannot be summed, as justification must address each individually.  

  **What’s missing (minor):**  
  - Could explicitly note *why* aggregation is problematic: contractualism cannot justify imposing a large burden on one person to avert many smaller burdens (even if summed, they exceed the large burden), as no single individual suffers enough to ground rejection.  

  **Why it matters:**  
  The omission doesn’t affect the score but slightly weakens the conceptual link to cases.  

