  - Notes contractualism ignores aggregate pain (40 days vs. 40 days), highlighting the "numbers of people" problem.  

  **What’s wrong:**  
  - Misstates the mechanism: Claims are not compared "pairwise" but via principles any individual could reasonably reject. Ada can reject a principle prioritizing 40 single-day sufferers over her 40-day burden, as *her* burden is vastly larger than any *one* of theirs.  
  - Omits that the 40 patients cannot *jointly* reject a principle favoring Ada, as contractualism lacks a "group standpoint."  

  **Why it matters (substantive error):**  
  The "pairwise" framing distorts contractualist reasoning, implying direct claim-comparisons rather than evaluating principles for individual rejectability. Cost: **–2 marks**.  

