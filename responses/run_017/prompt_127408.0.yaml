  6. Addressing Misconceptions at the Right Time:
     - That this is the material-implication complaint again:
          When? After the die example, when we show the material conditional gives 2/3 but we want 1/3. But note: the triviality result is much stronger. We then show that even if we try to fix it by adjusting the truth conditions arbitrarily, we cannot make it work for all distributions. The material conditional is just one candidate. We are showing that no truth-functional candidate and in fact no proposition at all can work if we require the Equation for all distributions.
          Head off: After the die example, when we change the distribution and it fails. Then say: "This is not just about the material conditional. Even if we design a non-truth-functional conditional, we cannot make the Equation hold across the board."

     - That the upshot is simply that conditionals are not true or false:
