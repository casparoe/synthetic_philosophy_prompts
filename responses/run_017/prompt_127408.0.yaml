          We should say: the triviality result shows that in the classical framework (where conditional probability is defined as a ratio and conditioning is defined accordingly), we cannot have conditionals as propositions and the Equation universally. But if we change the framework, we might avoid it.

  8. The Check Question:
     - Your candidate: a student says they will assign truth values to the conditional by making it true at all A∩B worlds and at exactly enough ¬A worlds to make the probability of the conditional equal to P(B|A) for their current credences, and they will reshuffle the ¬A truth assignments when they learn new information. What has that student done?
