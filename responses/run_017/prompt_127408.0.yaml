            - The history of the result (Adams, etc.)
            - The many variants of the result (for more than two worlds, for infinite spaces)
            - The discussion of non-propositional views in depth (though we mention them as an escape)
            - The technical details of the primitive conditional probability approach
            - The application to counterfactuals (this is about indicatives)

  9. Timing:
     - 5 min: Intro
     - 15 min: Die example (with two distributions)
     - 10 min: Generalizing the problem: we need the Equation for all distributions? (And we see that fixed truth conditions fail)
     - 15 min: The general proof (using conditioning on B and ¬B)
     - 10 min: Consequences and escape routes
     - 10 min: Discussion (including addressing the three misconceptions and the escape routes, and the check question)
     - 10 min buffer? (75 total)

  10. Check Question:
      - Question: "Suppose we have two people, Alice and Bob, who have different probability distributions over the same die outcomes. Alice has a uniform distribution, and Bob has a distribution that favors high numbers. According to the Equation, for Alice, P(if even then six)=1/3, and for Bob, it might be different, say 2/3. If conditionals have fixed truth conditions (same truth value at each outcome for both), how can they assign different probabilities to the same proposition?"
          - This highlights that if the conditional is a proposition with fixed truth values, then the probability is just the weight of the truth set, so if they agree on the truth set, they would assign the same probability if they had the same distribution? But they have different distributions, so they might assign different probabilities to the same set. But the Equation requires that for Alice, the probability of the conditional equals her P(six|even)=1/3, and for Bob, it equals his P(six|even)=2/3. But if the truth set is fixed, then the probability they assign to the conditional is fixed by their distributions over the truth set. So it is possible that they assign different probabilities. But the problem is that we also require that for Alice, the probability of the truth set must be exactly her P(six|even) (which is 1/3) and for Bob, it must be 2/3. But the same set of outcomes cannot have both 1/3 and 2/3 probability at the same time? No, they are different distributions. So it is possible: the set might have probability 1/3 under Alice's distribution and 2/3 under Bob's. But that set might not be the same as the set where the conditional is true? 

          Actually, the problem is that the set must be fixed. And we can have one set that has different probabilities under two distributions. But the catch is that the Equation must hold for every distribution. So consider a distribution that concentrates all weight on one outcome. Then the probability of the conditional must be either 0 or 1. But also, by the Equation, it must equal P(B|A) for that distribution. So we are forced to assign the truth value at that outcome to make it match. But we must do that for every outcome. And then we run into the independence: because then we must have that at every outcome in A, if B is true then the conditional is true, and if B is false then the conditional is false? But then the conditional is just A∩B? But then P(A∩B) = P(B|A) * P(A) ... which is not equal to P(B|A) unless P(A)=1. So that doesn't work.

          So the check question reveals that the student's ad hoc assignment for one distribution does not work for all distributions.

      - Better: "Can the student's method (adjusting the truth assignments for the conditional to match the current P(B|A)) work for every possible probability distribution over the same set of outcomes? Why or why not?"
          - Answer: No, because when the distribution changes, the required probability for the conditional changes (if P(B|A) changes). But if the truth set is fixed, then the probability of the conditional is fixed by the distribution and the truth set. However, the student is changing the truth set when the distribution changes. But the truth set is part of the meaning of the conditional and should be fixed. Moreover, when we condition on new evidence, we change the distribution, but the truth set should remain the same. The student reshuffles the truth set arbitrarily to match the new conditional probability. This means that the truth conditions are not stable and depend on the credences of the speaker. Also, note that if we condition on the conditional itself, we get into trouble (like in the proof).

      - What a right answer sounds like: The student has given up on fixed truth conditions and made the truth conditions depend on their credences. This avoids the triviality result for the moment, but it means that the conditional does not express a fixed proposition about the world. Also, it becomes unclear what it means to learn the conditional or to condition on it.

      - What a wrong answer sounds like: The student has found a way to make the Equation work, so the triviality result is avoided.

  Final Plan:

  - Whiteboard setup: Draw a grid for the die outcomes, and show the truth assignments for the conditional under two distributions. Then show the proof steps.

  - Be explicit about what we are leaving out: 
     "We are focusing on the indicative conditional in a finite setting. We are not discussing counterfactuals, and we are not going into the details of non-classical probability frameworks that might avoid the result. Also, we are assuming that conditionals express propositions, but that is one of the things that might be rejected."

  - Address the three misconceptions at the end, during the discussion, by referring back to the steps:
     (1) This is not just the material conditional complaint: we saw that even if we design a conditional arbitrarily, we cannot make the Equation hold for all distributions.
     (2) The psychological data does not settle the semantics because it only shows the Equation holds for one credence state at a time, and the triviality result shows it cannot hold for all if conditionals are propositions. So the data is consistent with non-propositional views.
     (3) Taking conditional probability as primitive might avoid the result, but that is a major revision to probability theory and we haven't assessed it here.

  - For the escape routes:
     - Restrictor view: This avoids the result by denying that conditionals express propositions. We can mention it as an option at the end.
     - Primitive conditional probability: This is a way out, but it requires a non-standard probability theory. We acknowledge it but do not discuss it in depth.

  - The check question we'll use at the end: 
     "Suppose a student says: 'I will define the truth conditions of the conditional "if A then B" to be true at all the A-and-B worlds and at exactly enough not-A worlds so that the probability of the conditional equals my current P(B|A). And whenever my credences change, I will redefine which not-A worlds are true.' What problem does this avoid, and what problem does it create?"

     Answer: 
       Avoids: For the current credence function, the Equation holds.
       Creates: The truth conditions of the conditional are not stable and depend on the credences of the speaker. This means that two speakers with different credences might assign different truth values to the same conditional at the same world. Also, when we learn new evidence, the truth conditions change arbitrarily, which makes it unclear what we were uncertain about before.

  This should fit in 75 minutes.
answer: |-
  Below is a structured plan for your 75-minute session on Lewis's triviality result. It follows a step-by-step sequence to make the collapse feel inevitable, uses your die example as the central vehicle, addresses misconceptions proactively, and includes a check question to gauge understanding. The order is designed to build on prior acceptance, with key dependencies noted. Components are timed for clarity.

  ---

  ### **Session Plan: Lewis's Triviality Result**

  **Total Time:** 75 minutes  
  **Tools:** Whiteboard (no handout).  
  **Goal:** Show that the triviality result is *not* about material implication, but a deeper collapse arising from universalizing the equation \(P(A→B) = P(B|A)\).  
  **Key Insight:** Truth conditions for conditionals cannot satisfy the equation for all possible credence functions without trivializing the probability space.

  ---

  #### **1. Setup: Probability over Finite Spaces (10 minutes)**
  - **What to cover:**  
    - Introduce a finite probability space with your die example:  
      - Outcomes: 1, 2, 3, 4, 5, 6 (fair die, already rolled, unknown outcome).  
      - \(A\): "even" (outcomes {2,4,6}).  
      - \(B\): "six" (outcome {6}).  
    - Probability as "weight over possibilities":  
      - \(P(A) = 3/6 = 0.5\), \(P(B) = 1/6\), \(P(B|A) = P(A \cap B)/P(A) = (1/6)/(3/6) = 1/3\).  
    - Material conditional (\(A \supset B\)): True when \(A\) false or \(B\) true (outcomes {1,3,5,6}), so \(P(A \supset B) = 4/6 = 2/3 \neq P(B|A)\).  
  - **Why now?**  
    - Establishes the probabilistic basics (philosophers and psychologists are on board).  
    - Shows material conditional fails, but this is *not yet the triviality result*—it’s just a warm-up.  
  - **Dependency:**  
    - Must be accepted before moving on: Everyone agrees \(P(B|A) = 1/3\) is intuitive, but \(A \supset B\) doesn’t capture it.

  ---

  #### **2. The Equation as a Semantic Thesis (10 minutes)**
  - **What to cover:**  
    - Pose the equation: \(P(A→B) = P(B|A)\) for a conditional \(A→B\).  
    - Ask: "What must \(A→B\) be true *at* for \(P(A→B) = 1/3\)?"  
      - Guide them:  
        - At {6} (\(A \cap B\)): Intuitively true.  
        - At {2,4} (\(A \cap \neg B\)): Intuitively false.  
        - At {1,3,5} (\(\neg A\)): Unknown. Must be true at exactly **one** of these (e.g., {1}) to make \(P(A→B) = 2/6 = 1/3\).  
      - Conclusion: Truth depends on a *gerrymandered choice* in \(\neg A\) region.  
  - **Why now?**  
    - Shows the equation *can* hold for one credence function (fixed truth conditions).  
    - Highlights that conditionals aren’t truth-functional (depends on weights).  
  - **Dependency:**  
    - Requires acceptance of finite space and probability-as-weight (Step 1).  
  - **Address misconception early:**  
    - "This is *not* the old material-conditional complaint. We’re designing a non-truth-functional conditional—and it works here."

  ---

  #### **3. Gerrymandering Fails Under Re-weighting (15 minutes)**
  - **What to cover:**  
    - Change the weights: Die is re-weighted (e.g., high faces favored).  
      - New distribution: \(P(5)=P(6)=1/3\), others \(P=1/12\) each.  
      - Recalculate: \(P(A) = P(\{2,4,6\}) = 1/12 + 1/12 + 1/3 = 6/12 = 0.5\).  
        \(P(B|A) = P(6)/P(A) = (1/3)/(0.5) = 2/3\).  
      - With *fixed truth conditions* (e.g., \(A→B\) true at {1,6}):  
        \(P(A→B) = P(\{1,6\}) = 1/12 + 1/3 = 5/12 \approx 0.42 \neq 2/3\).  
    - **Key insight:** Truth conditions gerrymandered for one distribution fail when weights change.  
  - **Why now?**  
    - Forces the question: Can we fix truth conditions to satisfy \(P(A→B) = P(B|A)\) for *every* credence function?  
    - Sets up the universality demand (next step).  
  - **Dependency:**  
    - Requires acceptance of the equation for one case (Step 2) and re-weighting over the *same outcomes* (no new scenario).  
  - **Vehicle suitability:** Your die example works perfectly—it has:  
    - Small space (countable).  
    - Probabilistic dependence (\(A\) and \(B\) are dependent).  
    - Substantial \(\neg A\) region (three outcomes).  
    - Re-weightability (same die, new beliefs).  
    - Indicative conditional (about unknown fixed outcome, not counterfactual).  
    - **Nothing missed:** Add a quick note that outcomes are "worlds" (no causal/modal distractions).

  ---

  #### **4. Universality Demand and Conditioning (20 minutes)**
  - **What to cover:**  
    - **Demand universality:** For \(A→B\) to be a proposition, \(P(A→B) = P(B|A)\) must hold for *every* credence function \(P\) (including those obtained by conditioning).  
    - **Condition on \(B\) and \(\neg B\) (load-bearing step):**  
      - Let \(P_1(\cdot) = P(\cdot | B)\). By universality:  
        \(P_1(A→B) = P_1(B|A) = 1\) (since \(B\) is true).  
        But \(P_1(A→B) = P(A→B | B)\), so \(P(A→B | B) = 1\).  
      - Let \(P_2(\cdot) = P(\cdot | \neg B)\). By universality:  
        \(P_2(A→B) = P_2(B|A) = 0\) (since \(\neg B\) is true).  
        So \(P(A→B | \neg B) = 0\).  
      - By law of total probability:  
        \[
        P(A→B) = P(A→B | B)P(B) + P(A→B | \neg B)P(\neg B) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B).
        \]  
      - But by the equation, \(P(A→B) = P(B|A)\). So \(P(B|A) = P(B)\).  
    - **Collapse:** This holds for *any* \(A,B\). If universality is true, \(A\) and \(B\) are independent—trivializing the space.  
  - **Why now?**  
    - Universality (holding for all credence functions) is the trigger. Conditioning on \(B\)/\(\neg B\) is the lever that collapses dependence.  
    - Feels "walked into": Steps 1–3 show gerrymandering fails; this shows *no* fixed truth conditions work.  
  - **Dependency:**  
    - Requires acceptance of re-weighting failure (Step 3) and law of total probability (psychologists are comfortable).  
  - **Address misconceptions during:**  
    - **"This damages Bayesian updating!"**: No—conditionalization is used *in* the proof, but the result doesn’t attack it; it shows that conditionals can’t be propositions *if* universality holds.  
    - **"Triviality means P=0 or 1!"**: Clarify "triviality" means no non-trivial dependencies (\(P(B|A) = P(B)\) always).

  ---

  #### **5. Escapes and Psychological Data (10 minutes)**
  - **What to cover:**  
    - **Escape 1: "If" as a restrictor (no proposition)**  
      - Concede: Yes, this avoids the result (e.g., "if A, B" quantifies over worlds).  
      - Park: Don’t adjudicate—just note it’s one way out.  
    - **Escape 2: Primitive conditional probability**  
      - Concede: Serious position (e.g., Hájek). If \(P(B|A)\) isn’t \(P(A \cap B)/P(A)\), the ratio breakdown isn’t fatal.  
      - Pushback: But universality might still cause problems (e.g., in Dutch books). Park full discussion.  
    - **Psychological data**:  
      - "Data shows \(P(A→B) \approx P(B|A)\) for *current* credences, but the result says this *can’t* hold for *all* credences if conditionals are propositions. Data doesn’t refute non-propositional views!"  
  - **When to address:**  
    - After the collapse (Step 4). Escapes/data are responses to the result.  
  - **Final misconception:**  
    - **"Upshot: Conditionals lack truth values!"**: Not the *only* conclusion. The theorem forces a choice: drop universality, drop propositionality, or drop classical probability. Truth-valueless conditionals are one option.

  ---

  #### **6. Check Question and Wrap-up (5 minutes)**
  - **Check question:**  
    > "A student says: *‘I’ll define \(A→B\) as true at all \(A \cap B\) worlds and exactly enough \(\neg A\) worlds to make \(P(A→B) = P(B|A)\) for my current credences. When I learn new evidence, I’ll reshuffle which \(\neg A\) worlds it’s true at.’ What has this student done?"  
    - **Right answer (shows understanding):**  
      "They gave up fixed truth conditions. Truth depends on their credences, so \(A→B\) isn’t a stable proposition. This avoids triviality but breaks semantics—e.g., two people with different credences disagree on truth values at the same world."  
    - **Wrong answer (superficial):**  
      "They fixed material implication" or "They made the equation work."  
  - **What to leave out (explicitly state):**  
    - "We’ve focused on indicative conditionals in finite spaces. We’ve left out:  
      - Counterfactuals or causal language.  
      - Infinite probability spaces.  
      - Deep dives into restrictor/primitivist theories (we parked them!).  
      - Why Lewis called it ‘triviality’ (it’s about dependence, not probability 0/1)."

  ---

  ### **Misconception Map: When to Address**
  | Misconception | When to Address | Key Response |
  |---------------|----------------|--------------|
  | "Just the material-conditional complaint" | Step 2 (after gerrymandering) | "No—we built a non-truth-functional conditional and it *still* failed." |
  | "Psychological data refutes semantics" | Step 5 (after collapse) | "Data shows the equation holds for *current* credences; the result shows it *can’t* for *all* credences if propositions." |
  | "Triviality = P=0 or 1" | Step 4 (during conditioning) | "Triviality means no dependencies: \(P(B|A) = P(B)\) always." |
  | "Damages Bayesian updating" | Step 4 (during conditioning) | "Conditionalization is used in the proof but isn’t the target; the result constrains semantics." |
  | "Conditionals can’t be true/false" | Step 5 (wrap-up) | "One option, but not forced—drop universality or probability instead." |

  ---

  ### **Timing Buffer**
  - 5 minutes buffer for discussion (e.g., if philosophers push escapes early). If time runs short:  
    - Skip deep dive into primitive probability (Step 5).  
    - Trim re-weighting calculations (Step 3) by pre-calculating.  

  This plan makes the triviality feel inevitable, separates it from material implication, and preempts major misconceptions. The die example is ideal—stick with it!
