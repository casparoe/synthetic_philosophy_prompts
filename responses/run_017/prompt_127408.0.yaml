     - We want P(A→B) = 1/3. Since the conditional must be true at 6 (if we think conditionals with true antecedent and consequent are true) and false at 2 and 4 (if we think conditionals with true antecedent and false consequent are false), then to get a probability of 1/3, we must have the conditional true at exactly one of the three odd outcomes (since 1/3 of the six outcomes: 2 outcomes in total). But which one? And why?
