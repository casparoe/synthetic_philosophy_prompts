          This is a way out: if there is no proposition expressed by the conditional, then the argument does not get off the ground. We can mention this at the beginning when we state the assumptions: we are assuming that conditionals express propositions. And at the end, we can say that one way to avoid the result is to deny that. But we won't discuss the merits of non-propositional views in this session.
