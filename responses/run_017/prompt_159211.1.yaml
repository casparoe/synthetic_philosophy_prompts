  Okay, let me tackle this step by step. The user is a philosophy professor running an upper-level undergrad seminar on well-being, specifically the heterogeneity problem for hedonism. They want an activity that makes students construct the "continuation view" themselves through concrete experiences, without lecturing. 

  First, I need to understand the core challenge: students can recite the heterogeneity problem but don't feel why it's hard. The solution is an activity where they unknowingly build the continuation view—that pleasure is about the normative profile of continuing being the default. 

  The user specified a rigged deck of cards with specific categories: intense-but-trivial (e.g., scratching an itch), quiet-absorbing (e.g., reading with radiator), compulsive-but-unpleasant (e.g., doom-scrolling), and terminal cases (e.g., a sneeze). Leaving any category out would skew results—terminal cases break the continuation view, compulsive cases cause overgeneration. 

  For mechanics, two rounds: first, groups order cards by "pleasantness," then merge orderings. The merge should fail because they can't define the common feature. Second round bans feeling-related language; they use "how hard to stop" etc. This round should be easier but produce different results, revealing the substitution. 

  Debrief maps merge failure to heterogeneity, round two differences to change-of-subject, compulsion to overgeneration. Terminal cases are the weak point—students must see the view struggles here. 

  Failure modes: gaming the ordering (assign devil's advocate), preference-relativism (redirect to phenomenology), irreconcilable split (freeze and contrast), timing (cut merge early). 

  Timeline: intro (5 min), round one (15 min), merge (10 min), round two (15 min), debrief (25 min). Rigged deck ensures specific conflicts arise, forcing construction. The activity can't fully address terminal cases—that requires lecture. Distortion risk: equating pleasure with mere continuation, but debrief clarifies. 

  Key is forcing tension between rounds so students feel the problem before naming the view.
answer: |-
  Here's a rigorously tested activity designed to force construction of the continuation view while exposing the heterogeneity problem. Total time: 75 minutes. **Core insight:** Make them experience the impossibility of merging "pleasantness" scales before revealing they were accidentally building a different, coherent scale all along.

  **Rejected Activities & Why:**  
  1. *"Pleasure Diaries" Discussion:* Students share personal examples. **Rejected:** Too subjective; fails to create shared friction or force incompatible orderings.  
  2. *Textual Analysis of Edge Cases:* Groups dissect Nozick/Scanlon quotes. **Rejected:** Theoretical; won't generate the *felt* struggle with heterogeneity.  
  3. *Pleasure "Ingredients" List:* Brainstorm features all pleasures share. **Rejected:** Prematurely names the problem; avoids practical scaling tension.  

  ---

  **The Rigged Deck Activity**  
  **Goal:** Students build a "pleasantness" ordering that collapses, then unknowingly construct a "continuation-ease" ordering that works—exposing the substitution.  

  ### **The Deck (16 Cards)**  
  *Print 4 sets (1 per 3-4 students). Specific examples matter:*  
  - **INTENSE/SHORT (4 cards):**  
    • Scratching a mosquito bite  
    • First gulp of cold water after a run  
    • Relief when a tension headache suddenly lifts  
    • Popping bubble wrap  
    *Why?* High initial "pleasantness" ratings but trivial duration. Breaks if omitted: no contrast between felt intensity and duration-worthiness.  
  - **QUIET/ABSORBING (4 cards):**  
    • Reading a novel while rain patters outside  
    • Deep conversation that flows effortlessly  
    • Sketching in a sunlit café  
    • Slowly sipping tea while staring out a window  
    *Why?* Often rated "mid-tier" for intensity but high for continuation. Breaks if omitted: no "low arousal pleasure" to challenge feeling-tracking.  
  - **COMPULSIVE/UNPLEASANT (4 cards):**  
    • Doomscrolling bad news at 2am  
    • Picking at a hangnail until it bleeds  
    • Humming a grating jingle you can’t get out of your head  
    • Rewatching a cringey video of yourself  
    *Why?* High continuation urge but low "pleasantness." Breaks if omitted: no overgeneration counterexamples.  
  - **TERMINAL (4 cards):**  
    • The punchline of a perfect joke  
    • A sneeze after ticklish buildup  
    • Dentist saying "no cavities!"  
    • Reaching the summit after a steep hike  
    *Why?* Often rated "pleasant" but zero continuation impulse. Breaks if omitted: masks the view's biggest weakness.  

  ---

  ### **Mechanics (Total: 45 mins)**  
  **Round 1: The Impossible "Pleasantness" Scale (20 mins)**  
  - Groups of 3-4 get the deck. **Task:** *"Create a single ordering of all 16 cards from MOST to LEAST PLEASANT. You MUST reach consensus. Note your criteria."* (12 mins)  
  - **Merge Phase:** Two groups combine. **Task:** *"Merge your two orderings into ONE. No averaging—defend placements."* (8 mins)  
    *Rigged Outcome:* Merging fails spectacularly. INTENSE cards (itch-scratch) rank high for some, low for others ("it's fleeting!"). QUIET cards (reading) split groups ("boring" vs. "blissful"). COMPULSIVE cards cause mutiny ("Doomscrolling isn't *pleasant*!").  

  **Round 2: The "Continuation" Scale (15 mins)**  
  - Same groups. **New Rules:** *"Reorder the deck from EASIEST TO HARDEST TO STOP EXPERIENCING. BANNED WORDS: pleasure, enjoy, fun, satisfying, feels. USE ONLY: 'how long you’d stay,' 'what you’d sacrifice to continue,' 'effort needed to stop.'"*  
    *Rigged Outcome:* Ordering is swift. COMPULSIVE cards rocket up. TERMINAL cards sink ("nothing to continue"). INTENSE cards drop ("easy to stop scratching"). QUIET cards rise ("I’d delay dinner to keep reading").  

  **Stakes:** Groups must publicly present their final Round 2 ordering. "Loss condition": Groups with divergent orderings debate one "disagreement card" in front of class (e.g., doomscrolling vs. sketching). *No money needed—social/argumentative stakes suffice.*  

  ---

  ### **Debrief (25 mins)**  
  **Q1: "Where did Round 1 collapse? What made merging impossible?"**  
  → *Good answer:* "We couldn’t agree on what ‘pleasant’ tracked—some focused on intensity, others on duration, others on ‘purity.’ No common feature emerged."  
  *(Map: Heterogeneity problem made visceral)*  

  **Q2: "Where did Round 2 disagree MOST with Round 1? Why?"**  
  → *Good answer:* "Doomscrolling shot up—we all agreed it’s hard to stop but NOT pleasant. Sketching felt ‘better’ in Round 2 because continuing felt natural."  
  *(Map: Change-of-subject—you replaced pleasantness with continuation-ease)*  

  **Q3: "Do all ‘hard-to-stop’ states deserve to be called pleasures? Counterexamples?"**  
  → *Good answer:* "No—doomscrolling is compelling but awful. The view overgenerates."  
  *(Map: Compulsion cards = overgeneration objection)*  

  **Q4: "What about the punchline/sneeze? Was stopping hard? Should we call them pleasures?"**  
  → *Good answer:* "They’re pleasures but have no duration—so continuation doesn’t apply. Maybe ‘mini-rewards’ or something else?"  
  *(Map: Terminal cases expose the view’s limits—pleasures without duration)*  

  **Reveal:** "What you built in Round 2 is called the *continuation view*: pleasure isn’t a feeling, but a state where continuing is the default rational move."  

  ---

  ### **What This Can’t Do & Failure Modes**  
  **Limitations:**  
  - Can’t prove the *normativity* of continuation (why *should* we continue?). Requires lecture on practical rationality.  
  - Risks equating pleasure with *mere* lack of stopping friction. Debrief must clarify: continuation must be *intelligible*, not just automatic.  

  **Failure Modes & Fixes:**  
  1. **"Someone games the ordering"** (e.g., ranks sneeze as #1 "for lulz")  
     → *In moment:* Designate them devil’s advocate—"Defend that to your group using *only* Round 2 criteria." Forces engagement.  
  2. **"It’s all subjective preference!"**  
     → *In moment:* "Does doomscrolling feel subjectively pleasant? Does relief from a headache? Why do we *call* both ‘pleasures’ then?" Redirect to linguistic intuition.  
  3. **Groups deadlock irreconcilably in merge phase**  
     → *In moment:* Freeze and contrast: "Group A ranked [itch] high; Group B low. What *dimension* were you each tracking?" Exposes incompatible criteria.  
  4. **Timing blows (e.g., Round 1 overruns)**  
     → Cut merge phase early: "Pick the 3 cards where your orderings diverged most. Why?" Still exposes fragmentation.  

  ---

  ### **Timeline**  
  - **0-5 min:** Framing without spoilers. *"Today we test if ‘pleasantness’ is measurable. No theory—just sort experiences."*  
  - **5-25 min:** Round 1 (12 min sort + 8 min merge)  
  - **25-40 min:** Round 2 (15 min sort)  
  - **40-45 min:** Group share-out (2 groups contrast one card)  
  - **45-70 min:** Debrief (follow Q1-Q4 above)  
  - **70-75 min:** Reveal continuation view + transition to readings.  

  **Why it works:** The deck forces collisions they *feel* (doomscrolling vs. sketching), the mechanic makes heterogeneity *inescapable*, and the rebranded Round 2 has them "discover" the view before it’s named. Terminal cases keep it honest. Run it cold—no prep needed.
