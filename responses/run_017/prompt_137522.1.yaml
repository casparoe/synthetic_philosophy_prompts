  Specification of the Mark:
  A mark must provide:
  1. A candidate unit of computation: This could be a state at a particular time, a sequence of states (a trajectory), or a process over time. We require the mark to specify the granularity (e.g., per token, per layer, per forward pass, per entire generation, etc.). Let the candidate unit be called an "entity".
  2. A function f: entity -> [0,1] (the degree of attributability).
  3. A threshold T in [0,1] such that an entity is considered an AC if and only if f(entity) >= T.

  Additionally, the mark must specify how to handle identity over time and under modification. Specifically, it must define:
  - When two entities (possibly at different times) are the same AC (for the purpose of tracking modification, interruption, etc.).
  - How to handle merging, splitting, and replacement.

  The procedure will assume that the mark provides:
  - A way to identify an AC (by an ID that persists over time, if applicable) and to track its lifecycle (creation, modification, ending, etc.).

  Given the complexity and the fact that we are in a real system, we will require the mark to be implementable by instrumentation that can observe the system (or by simulation of the change on a representative workload). The mark must be defined in terms of observable or computable properties of the system.

  Procedure Structure:
  We break the evaluation into ordered gates. At each gate, we ask a question and based on the answer, we decide to: 
  - Approve (continue to next gate, or if last gate, then approve)
  - Block (stop and block the change)
  - Escalate (to the full committee or external ethics adviser)
  - Approve with logging condition (requires monitoring after deployment and logging specified data)

  We also specify the default action when the answer is not obtainable within the time budget (one day of passive instrumentation without new training runs).

