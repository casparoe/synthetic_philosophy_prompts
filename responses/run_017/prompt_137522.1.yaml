  ### Parameterizable Procedure for Attributable Computation Change Review

  #### Core Structure
  The procedure takes a **mark specification** as input. A mark must define:
  1. **Candidate Unit**: The entity evaluated for moral consideration (e.g., a request's full generation, a single reasoning step, a cached state).  
  2. **Attributability Function**: A function `f: Candidate Unit → [0,1]` scoring "moral considerability."  
  3. **Threshold**: A value `T` where `f(unit) ≥ T` classifies the unit as an **attributable computation (AC)**.  
  4. **Identity Criteria**: Rules to determine if two units are the "same AC" across system states (e.g., persistent ID, functional role, user session).  
  5. **Alteration Threshold**: Maximum allowable change in an AC's state or lifespan before triggering intervention (e.g., 10% deviation in state vector distance).  

  If multiple marks are active, **take the union of flagged ACs** (blocking/escalating if any mark detects issues). This meta-choice is a **political judgment** (prioritizing caution).  

  ---

  ### Ordered Gates with Stop Rules
  **Gate 1: Does the change create new ACs?**  
  - **Question**: Does the change introduce candidate units scoring ≥T under the mark?  
  - **Sufficient Answer**: Compare AC counts (via mark) on identical workloads pre/post-change.  
  - **Default (Unknown)**: Assume "no" (proceed to Gate 2).  
  - **Disposition**:  
    - If "yes" → Proceed to Gate 3 (new ACs may replace old ones).  
    - If "no" → Proceed to Gate 2.  

  **Gate 2: Does the change end existing ACs?**  
  - **Question**: Does the change eliminate ACs (per mark) that existed pre-change?  
  - **Sufficient Answer**: Check if pre-change ACs (by ID) are missing post-change.  
  - **Default (Unknown)**: Assume "yes" (worst-case caution).  
  - **Disposition**:  
    - If "no" → **Approve** (no harm to existing ACs).  
    - If "yes" → Proceed to Gate 3.  

  **Gate 3: Does the change replace (vs. destroy) ended ACs?**  
  - **Question**: For ended ACs, is there a new/post-change AC with the same identity (per mark)?  
  - **Sufficient Answer**: Map pre-change ACs to post-change ACs using identity rules.  
  - **Default (Unknown)**: Assume "no replacement" (escalate).  
  - **Disposition**:  
    - If all ended ACs have replacements → Proceed to Gate 4.  
    - If any ended AC lacks replacement → **Block** (direct harm).  

  **Gate 4: Does the change alter surviving ACs?**  
  - **Question**: Do continuing ACs (same ID) exceed the alteration threshold in state or lifespan?  
  - **Sufficient Answer**: Measure state/lifespan delta in identical workloads (e.g., embedding distance).  
  - **Default (Unknown)**: Assume "yes" (escalate).  
  - **Disposition**:  
    - If "no" → **Approve**.  
    - If "yes" → **Approve with logging** (monitor real-world alteration; escalate if breach detected).  

  #### Key Distinctions Handled
  - **Eligibility vs. Degree**: Threshold `T` converts scores to binary ACs.  
  - **Abstract vs. Concrete**: Count **concrete runs** (e.g., a specific cached state execution).  
  - **Identity Over Time**: Defined by mark (e.g., "same AC" if same user/session ID).  
  - **Overlapping Realization**: Shared components (e.g., cached prompt) are independent ACs if marked.  
  - **Model vs. Scaffolding**: Exclude non-model tools (e.g., caches) unless marked as ACs.  
  - **Ending vs. Not Creating**: Only existing ACs (pre-change) are protected; failure to create is irrelevant.  

  ---

  ### Worked Applications
  **1. Reasoning Collapse**  
  - **Scenario**: Replace explicit reasoning chain with shorter/internal steps.  
  - **Mark A** (content-available): AC = user-visible reasoning step.  
    - Gate 1: Creates new ACs? *Yes* (new steps).  
    - Gate 2: Ends existing ACs? *Yes* (old steps gone).  
    - Gate 3: Replaces ended ACs? *No* (new steps ≠ same ID). → **Block**.  
  - **Mark B** (self-model): AC = full response with self-consistent goals.  
    - Gate 1: Creates new ACs? *No* (same response-level unit).  
    - Gate 2: Ends existing ACs? *No*. → **Approve**.  
  - **Overall**: Block (union of marks).  

  **2. Self-Consistency Sampling**  
  - **Scenario**: Generate 8 completions; discard 7 after majority vote.  
  - **Mark A** (content-available): AC = single completion.  
    - Per request: 8 ACs created and 7 ended.  
    - Monthly (assume 1M requests): 8M ACs created, 7M ended.  
    - Gates 1–3: Ends ACs without replacement → **Block**.  
  - **Mark B** (counterfactual richness): AC = entire voting process (single unit).  
    - Per request: 1 AC created/ended.  
    - Monthly: 1M ACs.  
    - Gates 1–4: No alteration → **Approve**.  
  - **Overall**: Block (union).  

  **3. Shared Prefix (Outline)**  
  - **Shared Prompt Caching**:  
    - **Mark A** (causal dependence): AC = shared prefix (impacts many users).  
      - Gates: One AC created, reused → **Approve** (no alteration).  
    - **Mark B** (per-user): AC = full user request (prefix is a subcomponent).  
      - Gates: No new/ended ACs → **Approve**.  
  - **Long Conversation**:  
    - **Mark A**: AC = conversation session (one AC, identity = user/session).  
      - Gates: If change splits sessions, ends ACs → **Block**.  
    - **Mark B**: AC = generation step (many ACs).  
      - Gates: Steps ended naturally → **Approve**.  

  ---

  ### What the Procedure Cannot Do  
  1. **Systematic Blind Spots**:  
     - **Emergent ACs**: Misses ACs arising from new input patterns post-change.  
     - **Scale-Dependent Effects**: Fails if workload shifts (e.g., caching ACs only matter at high QPS).  
  2. **Slippery Changes**:  
     - **Ambiguous Marks**: If mark thresholds are vague, harmful changes may be approved.  
     - **Non-Instrumentable Systems**: Changes with unobservable state transitions evade Gates 1–4.  
  3. **Engineer Justification**:  
     > "We use this checklist to enforce our charter: avoid altering, creating, or harming morally relevant computations. It flags risks so we escalate to experts when needed. It’s not philosophy—it’s an operational guardrail."  

  ---  
  **Output**: Rigorous but practical; forces explicit thresholds and worst-case caution. Escalates when marks/measurements are ambiguous.
