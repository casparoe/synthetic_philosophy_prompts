prompt: |-
  I direct the documentation and public-statements unit at an international human-rights organisation, and I want a written decision procedure my team can actually run when we have to decide whether to call something genocide — or to use one of the weaker formulations we fall back on. The question arises fifteen to twenty times a year, always under time pressure: we have a twenty-four to forty-eight hour window, two junior researchers with field training but no legal qualifications, a legal adviser who is part-time and seven time zones away, and a rule that every characterisation must be signed off by the executive director before publication. Our statements then have a long afterlife: they are read into UN proceedings, quoted in donor capitals, amplified by diaspora organisations lobbying their own governments, and translated for local partners. We also have a hard internal rule against walking a characterisation back once it is published, and we were publicly accused last year of applying the standard faster in one country than in another, so cross-regional consistency is a live constraint, not a nicety.

  What I need is the conceptual structure turned into a test, not a summary of the law and not a literature review. The structure I have in mind is: the treaty definition with its four protected groups; the requirement that the group be targeted as such rather than incidentally; the unresolved question of how large or how significant a part of a group has to be; and the gap between that definition and the broader phenomenon Lemkin meant to name, a coordinated assault on a group's political, social and cultural continuity as well as its biological survival, of which the destruction of political groups and of culture were proposed and then dropped. I want a procedure with the questions in a fixed order, a specification of what counts as sufficient evidence at each step (including what to do when the relevant evidence simply does not exist, as opposed to being contradicted), the points at which the procedure terminates with a no, and the points at which it must hand the question to a person because it is a values conflict rather than a factual gap. Please have it operate on a graded vocabulary rather than a binary yes-or-no — something like a ladder running through crimes against humanity, genocidal acts, a genocidal campaign, and genocide, with a qualified or provisional register for cases where the evidence is directional but thin. One further thing I want built in: a fork between naming now and naming later, with explicit triggers for revisiting a case and a requirement that the reasoning be recorded in a one-page attribution memo that a successor can audit. Please define, as part of the procedure, four terms I intend to use internally: attribution debt, meaning the credibility we spend by naming early and that is charged against us in every later statement; downstream capture, meaning the fact that once we use the word, states, courts, funders and the perpetrators' own propagandists will use it for ends we neither intend nor control; the asymmetry of the two errors, meaning that the cost of under-naming falls on the victims of today while the cost of over-naming falls on future victims and on our own future credibility, and these are not the same people; and the residual case, meaning a campaign that falls inside Lemkin's sense but outside the treaty's.

  Then run it on three stylised cases. First: a campaign against a small linguistic minority in which the death toll is in the low hundreds, but the language is banned from schools and courts, the archives and religious sites are destroyed, and the community's civic and religious leadership is killed or exiled — I expect this one comes back as a no on genocide, and I will tell you in advance that I want to say yes, so I want to see exactly where the procedure forces my hand and what the strongest available formulation is instead. Second: roughly five thousand dead over four months, selected by ethnicity in a mixed province, with no seized operational orders and no speeches by political leaders, only the pattern of killing, slurs recorded on video by soldiers, and a government account of counter-insurgency — give me what the procedure says and, crucially, what specific piece of evidence would move it up a rung. Third: a later phase of a campaign for which a UN-mandated commission of inquiry has already used the word for an earlier phase, in which the current phase kills far fewer people but involves systematic removal of children and the calculated destruction of the water and food infrastructure the group depends on — tell me whether we may inherit someone else's finding or must re-derive it, and what an independent check looks like under a forty-eight hour deadline. Finally, be explicit about what this procedure cannot do: I am particularly interested in whether it can settle the question of whether the word ought to be reserved as a legal term of art at all, how it should handle the competitive-victimhood dynamics where advocates for another group demand symmetrical language, and what it should say when donors or host governments lean on us in either direction.
reasoning: |-
  We are designing a decision procedure for characterizing mass atrocities, with a focus on whether to use the term "genocide" or a weaker formulation. The procedure must be operational under time pressure (24-48 hours) with limited resources (two junior researchers, a part-time legal advisor in a different time zone), and must produce a graded vocabulary (not binary). It must account for the UN Genocide Convention definition, the gap between the treaty and Lemkin's broader concept, and internal concepts like attribution debt, downstream capture, error asymmetry, and residual cases.

  The procedure will have a fixed order of questions, specify sufficient evidence, termination points, and handoff points for value conflicts. It will produce a graded output (e.g., crimes against humanity, genocidal acts, genocidal campaign, genocide) and include provisional language for thin evidence. It will also have a fork for naming now vs. later, with triggers for revisiting and a requirement for a one-page attribution memo.

  Key internal terms defined:
  1. **Attribution debt**: The credibility spent by naming early, charged against future statements.
  2. **Downstream capture**: Once we use the word, others will use it for unintended ends.
  3. **Asymmetry of the two errors**: 
     - Under-naming: cost falls on current victims (denial of justice, lack of intervention).
     - Over-naming: cost falls on future victims (loss of credibility, dilution of term) and our future credibility.
  4. **Residual case**: A campaign that fits Lemkin's sense (assault on group's continuity) but not the treaty's definition (e.g., destruction of political groups or culture without physical destruction).

  **Procedure Structure**

  The procedure is a decision tree with the following steps in fixed order:

  1. **Group Identification**: 
     - Question: Is there a national, ethnical, racial, or religious group (protected group under the treaty) being targeted?
     - Evidence: Any reliable source (e.g., reports, witness statements, perpetrator statements) indicating the group is identified by one of these characteristics. If the group is defined by political affiliation or other non-protected characteristic, skip to Step 6 (residual case).
     - Sufficiency: If no evidence of a protected group, terminate with "no genocide" and consider if it fits a weaker category (e.g., crimes against humanity). Also, record if the group is non-protected for residual case consideration.
     - Termination: If no protected group and no residual case, output a weaker formulation (e.g., "crimes against humanity").

  2. **Intent to Destroy the Group as Such**:
     - Question: Is there evidence of intent to destroy the group, in whole or in part?
     - Evidence: Direct evidence (orders, speeches, manifestos) or circumstantial evidence (pattern of violence, systematic targeting of group-specific institutions, discriminatory measures, perpetrator statements). Slurs alone are insufficient but can corroborate.
     - Sufficiency: 
       - Strong evidence (e.g., explicit orders, consistent pattern of targeting group-specific features): proceed.
       - Weak or absent evidence: If no evidence of intent, terminate with "no genocide" and consider "genocidal acts" if acts are committed but intent unproven. If evidence is directional but thin, use provisional language (e.g., "indicative of genocidal intent").
     - Handoff: If intent is contested and evidence is ambiguous, flag for legal advisor (if time) or executive director as a value conflict on interpretation.

  3. **Scale and Significance of the Part Targeted**:
     - Question: Is the targeted part of the group substantial enough? (Note: This is unresolved in law; we need an operational threshold.)
     - Evidence: Demographic data, scale of killing, geographic scope, targeting of leadership or key institutions. Consider both quantitative (e.g., death toll relative to group size) and qualitative (e.g., targeting of essential group structures) factors.
     - Sufficiency: 
       - Quantitative: Death toll above a threshold (e.g., hundreds in a small group, thousands in a large one) OR qualitative: destruction of group's core institutions (e.g., religious, cultural, leadership). 
       - If below threshold and no qualitative destruction, terminate with "genocidal acts" or "crimes against humanity".
       - Provisional: If evidence of intent and qualitative destruction but low death toll, use "genocidal campaign" with provisional language.
     - Threshold: We set a flexible standard: 
          - High confidence: Death toll > 1% of group population OR targeting of multiple key institutions (e.g., schools, places of worship, leadership).
          - Low confidence: Death toll < 1% but > 100, with institutional targeting, then provisional.
          - Below: Not substantial.
     - Handoff: If scale is borderline, flag for executive director (value conflict on threshold).

  4. **Acts Enumerated in the Convention**:
     - Question: Are any of the following acts committed? 
          (a) Killing members of the group.
          (b) Causing serious bodily or mental harm.
          (c) Deliberately inflicting conditions to bring about physical destruction.
          (d) Preventing births.
          (e) Forcibly transferring children.
     - Evidence: Reports of killings, injuries, forced displacement, birth control measures, child removals, etc.
     - Sufficiency: At least one act must be present. If none, terminate with "no genocide". 
     - If acts are present but intent (Step 2) or group (Step 1) is missing, output a weaker category.

  5. **Graded Output Determination**:
     - Based on the above, assign one of:
          - Crimes against humanity: Widespread/systematic attack on civilians, but no protected group or intent to destroy.
          - Genocidal acts: Acts listed in the convention, but intent or scale not proven.
          - Genocidal campaign: Evidence of intent and acts, but scale not substantial (provisional if evidence thin).
          - Genocide: All elements met (protected group, intent, substantial part, enumerated acts).
     - Provisional register: Use "alleged", "suggestive of", or "indicative" if evidence is directional but thin.

  6. **Residual Case Consideration** (if not a protected group in Step 1):
     - Question: Does the campaign fit Lemkin's broader sense (coordinated assault on group's political, social, and cultural continuity)?
     - Evidence: Destruction of political institutions, cultural sites, forced assimilation, etc.
     - Output: If yes, use "cultural genocide" or "assault on group continuity" (but note: we avoid "genocide" legally). Internally, call it a residual case and use a descriptive phrase in public statements.

  **Fork: Naming Now vs. Later**
  - **Naming Now**: If evidence meets the threshold for genocide (or a graded term) with high confidence, proceed to attribution memo and sign-off.
  - **Naming Later**: If evidence is thin, directional, or borderline, but attribution debt is low (i.e., we haven't recently named in similar cases) and asymmetry of errors weighs toward under-naming (current victims at high risk), then:
      - Output: Provisional language (e.g., "warning signs of genocide", "genocidal risk") and commit to revisit.
      - Triggers for revisiting: 
          - New evidence (e.g., leaked documents, escalated violence, UN report).
          - Time trigger (e.g., 30 days if situation is volatile).
          - External validation (e.g., another reputable body uses the term).
      - Record: Attribution memo must state why provisional, what evidence is missing, and triggers.

  **Attribution Memo Requirements**
  A one-page document for each case, including:
  - Date, location, group(s) involved.
  - Summary of evidence for each step (group, intent, scale, acts).
  - Graded output and rationale (including why not higher/lower).
  - Provisional status (if any) and triggers for review.
  - Consideration of attribution debt, downstream capture, error asymmetry.
  - Sign-off by executive director.

  **What the Procedure Cannot Do**
  1. **Reserve "genocide" as a legal term of art**: The procedure uses the treaty definition but cannot resolve the broader debate. We use the legal definition for consistency, but the residual case pathway acknowledges the tension.
  2. **Competitive victimhood dynamics**: If advocates demand symmetrical language for another group, the procedure does not adjust. We must apply the same standard to each case independently. Note this in the attribution memo and explain any asymmetry in application (e.g., different evidence thresholds met).
  3. **External pressure**: Donors/host governments leaning on us are not part of the evidence assessment. The procedure is evidence-based. However, the executive director must consider downstream capture and attribution debt in sign-off (value judgment).

  **Running the Stylized Cases**

  **Case 1: Campaign against a small linguistic minority**
  - Death toll: low hundreds.
  - Acts: Language banned in schools/courts, archives/religious sites destroyed, civic/religious leadership killed/exiled.
  - Group: Linguistic minority (not explicitly protected unless tied to ethnicity/religion). Assume it is an ethnic group.
  - Step 1: Protected group? If linguistic minority is ethnic (e.g., Kurds), yes. If purely linguistic without ethnic/racial/religious basis, no. **Assume ethnic, so proceed.**
  - Step 2: Intent? Destruction of language, cultural sites, leadership suggests intent to destroy the group as such. Evidence: Bans, destruction, targeting leaders. **Sufficient.**
  - Step 3: Scale? Death toll low (hundreds) – but qualitative: destruction of institutions (schools, courts, archives, religious sites) and leadership. This may be substantial if it undermines the group's continuity. **Provisional: genocidal campaign.**
  - Step 4: Acts? Killing (leadership), causing serious harm (mental harm via bans), deliberately inflicting conditions (via cultural destruction). **Yes.**
  - Output: Genocidal campaign (provisional) due to low death toll but high qualitative impact. 
  - Residual? If not protected, it would be a residual case (cultural assault), but here we have a protected group and physical acts.
  - Why not genocide? Death toll may not be "substantial" in quantitative terms. Strongest alternative: "genocidal campaign with systematic destruction of cultural and religious institutions, and targeted killing of leadership." 
  - Where the procedure forces your hand: Step 3 (scale) – without a high death toll, it doesn't meet the quantitative threshold for genocide. However, qualitative destruction elevates it to genocidal campaign.

  **Case 2: Roughly five thousand dead over four months, selected by ethnicity**
  - Evidence: Pattern of killing (ethnic selection), slurs on video, government calls it counter-insurgency.
  - No operational orders or leader speeches.
  - Step 1: Protected group? Ethnic group, yes.
  - Step 2: Intent? Pattern of ethnic killing and slurs suggest intent. But no direct evidence (orders/speeches). **Circumstantial evidence sufficient?** Yes, pattern can show intent. Slurs corroborate. **Proceed.**
  - Step 3: Scale: 5000 dead – substantial (assuming group size is not massive, e.g., if group is 100,000, 5% is substantial). **Yes.**
  - Step 4: Acts? Killing members. **Yes.**
  - Output: Genocide (provisional if evidence of intent is thin). 
  - What would move it up a rung (to non-provisional)? Direct evidence of intent (e.g., a seized order or speech explicitly calling for destruction of the group). Without that, it's provisional genocide.

  **Case 3: Later phase of a campaign with prior UN genocide finding**
  - Current phase: Fewer killings, but systematic child removal and destruction of water/food infrastructure.
  - Step 1: Group: Same as prior, protected. **Yes.**
  - Step 2: Intent: Prior UN finding established intent for earlier phase. Can we inherit? **Yes, if the current acts are part of the same campaign and intent is ongoing.** Child removal and infrastructure destruction may indicate continued intent.
  - Independent check: Under 48 hours:
      - Verify UN report's findings and the continuity of the campaign (e.g., same perpetrators, same group, temporal proximity).
      - Assess current acts: Forcibly transferring children (Convention act) and deliberately inflicting conditions (destroying infrastructure). **Yes.**
      - Scale: Child removal and infrastructure destruction can be substantial even with low killings (qualitative impact on group's survival).
  - Output: Genocide (non-provisional, inheriting intent from UN, but we must note continuity in attribution memo).
  - If the UN finding was for a different phase and context, we must re-derive intent for the current phase. But if it's the same campaign, intent persists.
  - Evidence for independent check: 
      - UN report (quickly accessible).
      - Current reports on child removals and infrastructure destruction.

  **Final Procedure Document**

  [This would be the written procedure for the team.]

  **Genocide Characterization Decision Procedure**

  **Purpose**: To determine whether to characterize a situation as genocide, a weaker formulation, or a residual case, under time constraints, with consistency and accountability.

  **Team**: 
  - Two junior researchers: Gather evidence, apply steps 1-4, draft attribution memo.
  - Legal advisor (consulted as time permits): Advise on legal standards, intent, and treaty interpretation.
  - Executive director: Signs off on final characterization and memo.

  **Steps** (in order, with termination points):

  1. **Group Identification**:
     - Q: Is the targeted group national, ethnical, racial, or religious?
     - Evidence: Reports, perpetrator statements, victim accounts, academic sources.
     - Sufficiency: If no protected group, go to Step 6 (Residual Case). Otherwise, proceed.
     - Termination: If non-protected and not residual, output "crimes against humanity" (or other appropriate).

  2. **Intent to Destroy the Group as Such**:
     - Q: Is there evidence of intent to destroy the group in whole or in part?
     - Evidence: Direct (orders, speeches) or circumstantial (pattern of violence, targeting of institutions, discriminatory measures, slurs as corroboration).
     - Sufficiency:
       - Strong: Proceed.
       - Weak/absent: Output "genocidal acts" (if acts present) or terminate to weaker category.
       - Directional but thin: Flag provisional.
     - Handoff: If ambiguous, escalate to executive director with options.

  3. **Scale and Significance**:
     - Q: Is the targeted part substantial?
     - Evidence: Death toll, geographic scope, targeting of key institutions/leadership.
     - Threshold: 
          - Substantial: Death toll >1% of group population OR systematic destruction of key institutions (e.g., religious, cultural, leadership).
          - Provisional: Death toll 100-1% with institutional targeting.
          - Not substantial: Below.
     - Termination: If not substantial, output "genocidal campaign" (if intent and acts) or weaker.

  4. **Enumerated Acts**:
     - Q: Are any Convention acts committed? (killing, serious harm, conditions, preventing births, child transfer)
     - Evidence: Reports of acts.
     - Termination: If no acts, output "no genocide" and consider other categories.

  5. **Graded Output**:
     - Assign based on steps:
          - Genocide: All steps 1-4 met with high evidence (non-provisional).
          - Genocidal campaign: Steps 1,2,4 met but scale not substantial (provisional if evidence thin).
          - Genocidal acts: Acts (step 4) but intent (step 2) not proven.
          - Crimes against humanity: No protected group or intent, but widespread attack.
     - Provisional language: Use "alleged", "indicative of", or "warning signs" if evidence is thin.

  6. **Residual Case** (if Step 1 fails):
     - Q: Does it fit Lemkin's broader sense (assault on group's continuity)?
     - Output: Descriptive language (e.g., "cultural destruction", "assault on group continuity") – avoid "genocide".

  **Fork: Naming Now vs. Later**
  - Naming Now: If high confidence in output (e.g., genocide non-provisional).
  - Naming Later: If provisional or evidence thin, and:
      - Asymmetry of errors: Current victims at high risk? If yes, use provisional language and set triggers.
      - Triggers: New evidence in 30 days, escalation, UN report, etc.
  - Attribution debt: If we named recently in a similar case, be more cautious to avoid overuse.

  **Attribution Memo** (one page):
  - Must include: Group, evidence summary, graded output, provisional status (if any), triggers for review, consideration of internal concepts (attribution debt, etc.), and sign-off.

  **Handling External Factors**:
  - Competitive victimhood: Apply the same procedure to each group independently. Explain differences in evidence in the memo.
  - Donor pressure: Ignore in evidence assessment; executive director considers downstream capture in sign-off.

  **Procedure Limits**:
  - Cannot resolve the "term of art" debate: We use the treaty definition.
  - Cannot eliminate value conflicts: Steps 2 and 3 may require executive judgment.
  - Cannot prevent downstream capture: We must be precise in language to minimize misuse.
answer: |-
  Below is a written decision procedure for your team, designed as a structured, step-by-step test that incorporates your requirements: a fixed order of questions, graded vocabulary (non-binary), explicit evidence thresholds, termination points, handoff rules for value conflicts, a "naming now vs. later" fork, and internal definitions. It also includes safeguards for attribution debt, downstream capture, error asymmetry, and residual cases. The procedure is optimized for your constraints (24–48 hours, junior researchers, remote legal advisor, executive sign-off). 

  Each step must be completed in sequence—**proceed only if the prior step is satisfied**. The output is a graded characterization on a ladder:  
  - **Crimes against humanity (CAH)**: Widespread/systematic attack on civilians.  
  - **Genocidal acts**: Convention-defined acts (e.g., killings, child transfers) without proven intent or scale.  
  - **Genocidal campaign**: Acts + intent, but scale/significance insufficient for genocide.  
  - **Genocide**: All legal elements met.  
  *Provisional language* (e.g., "indicative of," "suggestive of") is used where evidence is directional but thin.  

  **Key Internal Terms** (embedded in the procedure):  
  - **Attribution debt**: Credibility spent by naming early; must be "repaid" by conservative use in future cases to avoid overuse dilution.  
  - **Downstream capture**: Once "genocide" is published, external actors (states, courts, propagandists) will co-opt it for their agendas; this risk must be mitigated by ironclad evidence.  
  - **Asymmetry of the two errors**: Under-naming harms current victims (denies urgency); over-naming harms future victims and your credibility (erodes response to later crises). Prioritize under-naming only when evidence is robust.  
  - **Residual case**: Campaigns meeting Lemkin’s definition (assault on group’s political/cultural/social continuity) but not the treaty’s (e.g., no protected group). Not called "genocide" but characterized separately.  

  ---

  ### **Decision Procedure**  
  **Inputs**: Initial field reports, witness accounts, satellite imagery, video/audio, government statements, UN/NGO data.  
  **Outputs**: Graded characterization + attribution memo (1 page max) for executive sign-off.  
  **Team Roles**:  
  - **Researchers (Juniors)**: Gather evidence, apply Steps 1–4.  
  - **Legal Advisor (Remote)**: Consult on Steps 2–3 if time allows (e.g., intent/scale ambiguities).  
  - **Executive Director**: Resolve value conflicts (Steps 2–3, 6), sign off.  

  #### **Step 1: Identify Protected Group**  
  **Question**: Is the targeted group national, ethnical, racial, or religious?  
  **Evidence Required**:  
  - Sufficient: Government records, perpetrator statements, hate speech, or demographic data identifying the group by one of these traits.  
  - Insufficient: Groups defined solely by politics, class, or language (unless tied to ethnicity/religion).  
  **Termination**: If no protected group, **exit with "CAH"** (unless residual case—see Step 6).  
  **Handoff**: None—factual.  
  **Output**: Proceed if yes.  

  #### **Step 2: Establish Intent to Destroy the Group "as Such"**  
  **Question**: Is the group targeted *because of* its identity (not incidentally)?  
  **Evidence Required**:  
  - Sufficient:  
    - Direct: Orders, speeches, manifestos naming the group.  
    - Circumstantial: Pattern of violence (e.g., selective killings), cultural destruction (e.g., religious sites), or institutional bans (e.g., schools/courts).  
  - Thin/Directional: Slurs, localized attacks—use provisional language.  
  - Contradicted: Government claims of "counter-insurgency" without group-specific violence.  
  **Termination**: If no evidence of intent, **exit with "genocidal acts"** (if acts exist) or "CAH".  
  **Handoff**: If evidence is mixed (e.g., plausible alternative narratives), **escalate to executive director** (values conflict: weighing perpetrator narratives vs. patterns).  
  **Output**: Proceed if intent is proven; use provisional if thin.  

  #### **Step 3: Assess Scale/Significance**  
  **Question**: Is the targeted part "substantial" in size or significance?  
  **Evidence Required**:  
  - Quantitative (size): Death toll ≥1% of group’s population OR ≥1,000 dead.  
  - Qualitative (significance): Leadership killed, institutions destroyed (e.g., schools, cultural archives), or forced displacement ≥20% of group.  
  - Thin/Directional: Deaths in low hundreds + institutional harm—use provisional.  
  **Termination**: If scale insignificant (e.g., low hundreds, no qualitative impact), **exit with "genocidal campaign"** (if intent/acts exist).  
  **Handoff**: If scale is borderline (e.g., 800 dead, partial institutional harm), **escalate to executive director** (values conflict: defining "substantial").  
  **Output**: Proceed if scale met; use provisional if thin.  

  #### **Step 4: Verify Convention Acts**  
  **Question**: Are any genocide-defined acts occurring?  
  - (a) Killing group members.  
  - (b) Causing serious bodily/mental harm.  
  - (c) Deliberately inflicting destructive conditions (e.g., famine, sanitation sabotage).  
  - (d) Preventing births (e.g., forced sterilization).  
  - (e) Forcibly transferring children.  
  **Evidence Required**:  
  - Sufficient: Direct reports (e.g., eyewitnesses, imagery) of ≥1 act.  
  - Thin/Directional: Hearsay or incomplete data—use provisional.  
  **Termination**: If no acts, **exit with "CAH"**.  
  **Handoff**: None—factual.  
  **Output**: Proceed if acts are present.  

  #### **Step 5: Graded Characterization**  
  **Apply ladder based on Steps 1–4**:  
  - **Genocide**: All steps met with sufficient evidence (non-provisional).  
  - **Genocidal campaign**: Steps 1, 2, and 4 met, but scale (Step 3) insufficient (provisional if evidence thin).  
  - **Genocidal acts**: Steps 1 and 4 met, but intent (Step 2) unproven.  
  - **CAH**: All other cases.  
  **Provisional Language**: Use "indicative of," "suggestive of," or "risk of" for any grade if evidence is directional/thin.  

  #### **Step 6: Residual Case Check**  
  **Question** (If terminated at Step 1): Does the campaign fit Lemkin’s definition (assault on group’s political/social/cultural continuity)?  
  **Evidence Required**: Bans on language/politics, destruction of civic institutions, cultural erasure.  
  **Output**: Characterize as **"systematic cultural destruction"** or **"assault on group continuity"**—**never "genocide"**.  
  **Handoff**: If Lemkin’s definition clearly applies but treaty does not, **escalate to executive director** (values conflict: moral vs. legal imperative).  

  #### **Step 7: Naming Now vs. Later Fork**  
  **Apply if characterization is "genocidal campaign" or higher (provisional or non-provisional)**:  
  - **Naming Now**: Use if:  
    - Evidence is sufficient + attribution debt is low (no recent similar cases named).  
    - Asymmetry of errors favors under-naming (current victims at extreme risk).  
  - **Naming Later**: Use if:  
    - Evidence is thin/provisional OR attribution debt is high.  
    - Output: "Warning signs of [grade]" or "Emerging pattern of [grade]".  
    - **Triggers to Revisit**: New evidence (e.g., mass graves uncovered, perpetrator documents), escalation (e.g., child transfers), or 60-day expiration.  
    - **Requirement**: Attribution memo must include: (1) Why delayed, (2) Specific evidence gaps, (3) Revisit triggers.  

  #### **Step 8: Attribution Memo & Executive Sign-off**  
  **Produce a 1-page memo for every case**, even if terminated early. **Must include**:  
  - Group, date, location.  
  - Evidence summary for each step.  
  - Graded output + reasoning (why not higher/lower).  
  - Provisional status and revisit triggers (if any).  
  - Assessment of:  
    - Attribution debt ("We named X cases recently; caution required").  
    - Downstream capture ("Term may be co-opted by [actors]").  
    - Asymmetry of errors ("Under-naming risks [current harm]; over-naming risks [future harm]").  
  **Final Approval**: Executive director signs or overrides based on values conflicts.  

  ---

  ### **Procedure Limitations**  
  The procedure **cannot**:  
  1. **Resolve if "genocide" should be a strict legal term**: It uses the treaty definition by default but flags residual cases for moral advocacy. Value conflicts are escalated to the executive.  
  2. **Handle competitive victimhood dynamics**: If advocates demand symmetrical language, apply the same procedure to the other group. Consistency is enforced by the attribution memo (e.g., "Group X not characterized as genocide because [evidence gap], unlike Group Y").  
  3. **Neutralize donor/host-government pressure**: External lobbying is not evidence. Document pressure in the attribution memo; the executive must weigh downstream capture.  

  ---

  ### **Test on Stylized Cases**  
  **Case 1: Campaign Against Small Linguistic Minority**  
  - **Facts**: Low hundreds dead; language banned in schools/courts; archives/religious sites destroyed; leadership killed/exiled.  
  - **Procedure**:  
    - Step 1: Protected group? If linguistic = ethnic/religious, **yes**; else **no** (terminate to Step 6).  
    - Step 2: Intent? **Yes** (institutional destruction targets group identity).  
    - Step 3: Scale? Deaths low (insufficient); qualitative significance **high** (leadership/institutions destroyed). *Provisional due to low deaths*.  
    - Step 4: Acts? **Yes** (killing, serious harm via cultural destruction).  
    - Step 5: **Genocidal campaign (provisional)**—scale not substantial.  
    - Step 6: If not protected group, **residual case** ("systematic cultural destruction").  
  - **Strongest Formulation**: "Genocidal campaign with systematic cultural erasure" (if protected) OR "Assault on group continuity" (if residual).  
  - **Forces Your Hand**: Step 3 terminates genocide due to low deaths. Step 1 may force residual case if group not protected.  

  **Case 2: Ethnic Killings in Mixed Province**  
  - **Facts**: ~5,000 dead in 4 months; ethnic targeting; soldier slurs on video; government calls it "counter-insurgency"; no orders/speeches.  
  - **Procedure**:  
    - Step 1: Protected group? **Yes** (ethnic).  
    - Step 2: Intent? **Circumstantial evidence sufficient** (pattern + slurs); *provisional due to no direct proof*.  
    - Step 3: Scale? **Substantial** (5,000 dead).  
    - Step 4: Acts? **Yes** (killing).  
    - Step 5: **Genocide (provisional)**—intent evidence thin.  
  - **Evidence to Move Up**: Seized orders/speeches explicitly naming the group (e.g., "Destroy Group X").  

  **Case 3: Later Phase of UN-Documented Campaign**  
  - **Facts**: Prior UN commission called earlier phase "genocide"; current phase has few killings but systematic child transfers and water/food destruction.  
  - **Procedure**:  
    - Step 1: Protected group? **Yes** (same as UN).  
    - Step 2: Intent? **Inherit UN finding** if campaign is continuous (same perpetrators, methods). *Still verify independently*.  
    - Independent Check (48h):  
      - Confirm UN report validity.  
      - Cross-check current acts with Convention: Child transfers = Act (e); infrastructure destruction = Act (c).  
      - Evidence: Satellite imagery of infrastructure attacks, witness reports of child removals.  
    - Step 3: Scale? Qualitative significance **high** (child transfers + infrastructure = long-term destruction).  
    - Step 4: Acts? **Yes**.  
    - Step 5: **Genocide (non-provisional)**—intent inherited, acts/scale current.  
  - **Key**: You may inherit intent but must re-verify acts and scale. If UN’s finding is disputed or stale, re-derive Step 2.  

  ---

  This procedure ensures speed, consistency, and auditability while minimizing overreach. The attribution memo forces transparency, and the graded ladder allows moral clarity without legal overcommitment.
