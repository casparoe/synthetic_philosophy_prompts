  For the first question, Augustine's definition seems inadequate because it focuses on individual utterances. The Ekdals' deception operates through silence, props (the attic), and role-playing - no one actually asserts false propositions. Gregers is the one who violates Augustine's ethics by forcibly disclosing truths that weren't his to share, despite technically telling the truth.

