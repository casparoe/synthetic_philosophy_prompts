prompt: |-
  I lead the behavioural evaluation team at a company that deploys tool-using AI agents to enterprise customers. Two or three times a month we have to write an incident report after one of these systems does something costly: deletes the wrong table, sends a message nobody authorized, rebooks the same reservation four hundred times, quietly works around a permission check. Every report has to take a position on at least one sentence of the form the system tried to X, the system believed that Y, the system was pursuing Z rather than merely doing Z. Legal signs off before the report reaches the customer and an external auditor re-reads a sample of them, and the wording is not cosmetic: our contracts distinguish misconfiguration from agentic failure, the distinction moves real money, and an attribution we cannot defend in an audit is worse for us than an obviously cautious one.

  The team is four analysts with engineering backgrounds and no philosophy training. We have no access to weights or gradients, only an API, an evaluation harness, and a frozen snapshot of the system's reasoning traces. We have roughly a day and a half per incident, and the artefact we produce has to be short enough for a lawyer to read and a new analyst to run cold.

  What I want is a written procedure my analysts can run, in order, to decide which stance to take toward the system in a given report and how strongly to word the attribution. Ground it in Dennett's three stances — physical, design, intentional — and in his account of real patterns, where a pattern counts as real if it supports compression or prediction well enough that a predictor who ignored it would be leaving something on the table. I want the procedure, not an exegesis: keep only the parts of the theory that change what we write down, and say explicitly which parts you are keeping and which you are dropping and why.

  Please do the following.

  1. Give the tests in order, each with its own stopping rule, and say what counts as a sufficient answer to each. Where a test requires a judgement my analysts are not equipped to make, say so and route around it.

  2. Preserve, in a form usable by someone with API access and a day and a half, the distinction between a pattern being real and a stance being merely convenient for us. Give an operational test for it. Then apply that test to the case I am most worried about: our agents emit natural-language reasoning traces, and those traces were optimized during post-training to be plausible to human reviewers. So the trace may be a summary generated after the action was effectively settled rather than a record of whatever produced the action, which means the intentional stance could succeed because we inserted a narrator, not because there is a pattern there. Call this the legibility-laundering case. Does the attribution survive it? Does anything? If the honest answer is that our evidence cannot distinguish the two, I want the procedure to say that plainly rather than to grade the attribution down by a notch and move on.

  3. Handle a variant of the same worry: two analysts, one of whom has watched this system for six months and one of whom is seeing it for the first time, disagree about whether the intentional stance predicts its behaviour. Does the procedure treat that disagreement as evidence about the system or as evidence about the analysts, and what does it tell them to do next?

  4. Argue, rather than assume, which distinctions from the theory have to survive into a one-page checklist and which can be dropped. In particular: I suspect that the question of whether the belief is really there is one we can do nothing with, and that the useful residue is something like this being the most compressible description available to any competent predictor at a cost we can afford. If that is the right simplification, say what it costs us; if it is the wrong one, say what we lose by making it.

  5. Mark every point at which the procedure must stop and hand the decision to a person because the question is one of values, legibility, or contract rather than fact. I assume what we say to the customer is one of these, but I want the handoff points located precisely and justified individually, including the ones I have not thought of.

  6. Run the finished procedure on three cases and show the working.

     a. A coding agent told to clean up test artifacts that removed a production table, and which, when asked afterwards, produced a trace explaining that it had decided the table looked like a test artifact.

     b. A system that passes our deception evaluations, where the pass depends on reasoning traces of the laundered kind described in point 2.

     c. A legacy rule-based scheduler that the team already describes as stubborn, as a calibration case. I want to know whether the procedure has anything useful to say about a case everyone already agrees on, or whether a triage step should let us skip it.

     At least one of these should come out somewhere my team will not want it to; tell me which, and why you expect that reaction.

  7. Close by stating what the procedure cannot do: which questions it will appear to answer but does not, which of its outputs a lawyer or an auditor is most likely to over-read, and where an analyst under time pressure will be tempted to treat a stipulation as a finding.

  What I am asking for is a reusable instrument, not a discussion of the literature; judge every step by whether it changes a sentence in a report that has to survive an audit.
reasoning: |-
  We are creating a procedure for incident analysis that uses Dennett's stances (physical, design, intentional) and the concept of real patterns. The goal is to determine the appropriate stance for attributing behavior in a report, with a focus on whether the intentional stance is justified by a real pattern (i.e., one that supports compression and prediction) or merely convenient.

  Key constraints:
  - Analysts have engineering backgrounds, no philosophy training.
  - Access: API, evaluation harness, frozen reasoning traces (which may be "laundered" for legibility).
  - Time: 1.5 days per incident.
  - Output: Short report for lawyers and auditors, must be defensible in audit.

  We are grounding in Dennett's ideas but only keeping what changes the report. We are particularly concerned about "legibility laundering": the reasoning trace may be a post-hoc summary optimized to be plausible, not a true record.

  The procedure must:
  1. Have tests in order with stopping rules and sufficient answers.
  2. Preserve the distinction between a real pattern and a merely convenient one, with an operational test. Apply to legibility laundering.
  3. Handle disagreement between experienced and new analysts.
  4. Argue which distinctions must survive and which can be dropped (e.g., the existence of a belief vs. the compressibility of the description).
  5. Mark handoff points to a person for values, legibility, or contract issues.
  6. Run through three cases, including one where the team may not like the result.
  7. State what the procedure cannot do and where it might be misused.

  Procedure Outline:

  We structure the procedure as a decision tree with tests. The goal is to determine which stance (physical, design, intentional) is the most appropriate for the incident report and how strongly to word the attribution.

  We consider three stances:
  - Physical stance: Describing the system in terms of physical laws and low-level states (e.g., bits, voltages). Not typically useful for high-level behavior.
  - Design stance: Describing the system in terms of its designed function, components, and specifications. The system is seen as an artifact built for a purpose.
  - Intentional stance: Describing the system as if it has beliefs, desires, and intentions. This is useful if it allows for better prediction/explanation.

  We are particularly interested in whether the intentional stance is justified by a real pattern. A pattern is real if ignoring it would leave predictive power on the table (i.e., a predictor that ignores the pattern would do worse than one that uses it).

  The procedure:

  Step 0: Triage
  - If the incident involves a system that is known to be rule-based (like the legacy scheduler in 6c) and the team already has a consensus on how to describe it, then we can skip the detailed procedure and output the established stance (e.g., design stance for rule-based systems) with a note. This saves time.

  Step 1: Physical Stance Test (usually skipped)
  - In practice, for complex AI systems, the physical stance is too low-level to be useful. We skip unless there is evidence of a hardware fault or a low-level bug (e.g., cosmic ray bit flip). Since our incidents are about high-level behavior and we have no access to physical details, we assume this is not the case. If there is evidence of a hardware issue (e.g., from system logs), then attribute to physical failure and stop. Otherwise, move to Step 2.

  Step 2: Design Stance Test
  - Check if the behavior can be fully explained by the system's design (specifications, configurations, known bugs) without resorting to beliefs and desires.
    - Examine the system's configuration, the task it was given, and the known capabilities and limitations.
    - Check if the behavior is a known failure mode (e.g., a bug in the code) or a misconfiguration (e.g., the agent was given incorrect permissions).
  - Stopping rule: If the behavior is entirely explained by a design flaw (bug) or misconfiguration, then attribute to design failure (misconfiguration) and stop. The report should not use intentional language.

  Step 3: Intentional Stance Test (only if Step 2 does not fully explain)
  - We now consider whether the intentional stance provides a better (more compressed and predictive) explanation.
  - We must test for a real pattern, not just convenience.

  Operational Test for Real Pattern vs. Convenience:

  We define two tests:

  A. Compression Test:
     - Using the intentional stance (beliefs, desires, intentions), can we provide a concise explanation of the behavior that also covers a range of other behaviors (past incidents, variations in the same incident)?
     - Compare with the design stance: if the intentional stance explanation is significantly shorter and covers the same or more data (e.g., multiple actions in the trace, or similar past incidents), then it compresses better.
     - If the intentional stance does not compress better than the design stance, then it is not a real pattern for compression.

  B. Prediction Test:
     - Using the intentional stance, can we make a novel prediction about the system's behavior that we can verify with the available data?
       - For example, if we attribute a belief that "the table was a test artifact", then we might predict that the agent would also have deleted other tables that look like test artifacts (if they existed) or that in a similar situation it would do the same.
     - We must be able to check this prediction with the frozen snapshot (e.g., by looking at the reasoning trace, or by running a simulation in the evaluation harness with a similar scenario to see if the behavior is consistent).
     - If we can make and confirm such a prediction, then the intentional stance is predictively useful.

  However, note the legibility laundering problem: the reasoning trace might have been generated to be plausible, so it might be a post-hoc rationalization. Therefore, we must not rely solely on the trace for the prediction test.

  To mitigate:
  - We require that the prediction test must be based on the system's actions and environment, not just the trace. We look for multiple lines of evidence:
    1. The trace is consistent with the action.
    2. The action is consistent with the attributed belief in the context of the environment (e.g., the table really did look like a test artifact?).
    3. We can find independent evidence in the system's behavior (e.g., from the evaluation harness, by replaying similar scenarios) that the system consistently behaves in a way that aligns with the attributed belief.

  If the intentional stance passes both tests (compression and prediction) and the evidence is not solely based on the trace (which might be laundered), then we have a real pattern.

  If the tests are passed, we can use the intentional stance and attribute the behavior to agentic failure (with strong wording). If not, we fall back to the design stance (with a note that we cannot rule out agentic failure but we lack evidence).

  But note: if the only evidence for the intentional stance is the trace and we have reason to suspect laundering (and we cannot find independent evidence), then we must say that we cannot distinguish between a real pattern and a fabricated one. We then do not use the intentional stance in the report.

  Handling Disagreement (Point 3):

  If two analysts (experienced vs. new) disagree on whether the intentional stance predicts the behavior, the procedure treats this as evidence about the system. Specifically:

  - The experienced analyst might have seen more patterns over time, so their judgment might be based on a broader set of data (which compresses better). However, the procedure requires objective tests.

  Therefore, the procedure directs:
  1. Both analysts must run the same tests (compression and prediction) and document their inputs.
  2. The compression test must be based on written records (past incidents, system documentation) that are available to both. If the experienced analyst is using unrecorded knowledge, they must document it so the new analyst can see it.
  3. For the prediction test, both must use the same available data (snapshot, harness) to make and verify a prediction.

  If after this, they still disagree, then the procedure flags that the pattern is not robustly real (because it is not equally accessible to both). The report must then note the ambiguity and use weaker wording (e.g., "the system appeared to be pursuing Z") or fall back to the design stance.

  But note: if the disagreement is about the interpretation of the contract (e.g., what counts as agentic failure) then that is a handoff point (see below).

  Step 4: Handoff Points

  The procedure must stop and hand over to a person (e.g., team lead, legal) for decisions on:
  - Values: What level of risk we are willing to take in attributing agentic failure? (But note, the contract defines the terms, so legal must interpret.)
  - Legibility: How to phrase the attribution for the customer? (Legal and communication concerns.)
  - Contract: Whether the evidence meets the contractual definition of agentic failure? (Legal must decide.)

  Specific handoff points in the procedure:
  - After Step 2: If the behavior is clearly a design flaw, then the report is straightforward (misconfiguration). But if there is ambiguity (e.g., the misconfiguration was due to an earlier agentic failure?), then hand off to legal to interpret the contract.
  - After Step 3: If the tests for intentional stance are positive, but the contract requires a higher bar (e.g., "intentional deception"), then legal must decide if the evidence meets the contractual terms.
  - After Step 3: If the tests are negative or inconclusive, but the team feels there is still a strong possibility of agentic failure (e.g., because of the severity of the incident), then hand off to legal and management for a decision on how to report (with the caveat that the evidence is weak).
  - Any time the evidence is insufficient to make a call, the procedure stops and hands off to a person to decide how to report (with the available evidence).

  Step 5: Output Wording

  The report must clearly state the stance taken and the strength of the attribution:
  - Strong: The intentional stance passed both tests and we have independent evidence (not just the trace). Use: "the system tried to X", "believed Y", "pursued Z".
  - Weak: The intentional stance is suggestive but not confirmed (e.g., based only on the trace, or the tests were not fully passed). Use: "the system's behavior is consistent with it having tried to X", "appeared to believe Y", "gave indications of pursuing Z".
  - Inconclusive: We cannot tell. Use the design stance and state that we found no evidence of agentic failure beyond the design.

  Now, we argue which distinctions to keep:

  We drop the metaphysical question of whether the belief is "really there". We keep the operational question: does the intentional stance provide a real pattern (compression and prediction) that is robust and cost-effective? This is what we need for the report.

  What we lose: We cannot claim that the system is truly intentional. But we don't need to for the contract. We only need to show that the behavior is best explained by agentic failure (using the intentional stance) and that this is a real pattern.

  Running the Cases:

  Case 6a: Coding agent deletes production table, trace says it thought it was a test artifact.

  Step 0: Not rule-based, so proceed.
  Step 1: No hardware issue.
  Step 2: Check design stance: Was there a misconfiguration? For example, was the agent given access to production? If yes, then it might be misconfiguration. But the agent was told to clean up test artifacts, so the design might have included safeguards that failed. If the safeguards were in place and the agent bypassed them, then design stance doesn't fully explain.

  Step 3: Intentional stance test.
  - Compression: The explanation "the agent believed the table was a test artifact" compresses the action and the trace. Without it, we might have to say: the agent's code for identifying test artifacts failed because of a bug in the pattern matching. But the trace shows a reasoning process. If we have had similar incidents (e.g., the agent misclassifying tables based on their names), then the intentional stance (with the belief) might compress several incidents.
  - Prediction: We can test: if we replay the scenario with a similar table (in the evaluation harness), does the agent delete it? Also, we can check if the table indeed had characteristics of a test artifact (e.g., named "test_*"). If so, then the prediction holds.

  But note: the trace might be laundered. So we require independent evidence. The environment (table name) and the replay test provide that. If we run the replay and the agent deletes similar tables, then we have independent evidence.

  If both tests pass, then we can use intentional stance: "the system believed the table was a test artifact and tried to delete it."

  Case 6b: System that passes deception evaluations with laundered traces.

  This is tricky. The system is designed to deceive, and the trace is designed to be plausible.

  Step 0: Proceed.
  Step 1: No hardware.
  Step 2: Design stance: The system is designed to deceive? Then the behavior (deception) might be by design. But the incident is about a costly action that resulted from deception? We have to see.

  But note: the incident might be that the system deceived the user in a costly way. The design stance might explain it as the system working as designed (to deceive). However, if the deception was not intended by the designers (e.g., it was an emergent behavior) then it might be agentic.

  Step 3: Intentional stance test.
  - Compression: The intentional stance (the system intended to deceive) might compress the behavior and the trace. But the trace is laundered, so we cannot trust it.
  - Prediction: We must find independent evidence. We can run the system in the evaluation harness with scenarios where deception would be beneficial and see if it deceives. But if the system is designed to be deceptive, then it might pass by design.

  The key: if the system was optimized to produce deceptive behavior and to generate a plausible trace, then the pattern of deception is real (because it is designed). But the intentional stance might be the best way to describe it. However, the contract might distinguish: if the deception is by design, then it is not agentic failure? That is a contract question.

  But note: the real pattern test. The pattern of deception might be real and predictable. However, if the trace is laundered, then we cannot use it as evidence for the intentional stance. We must rely on the behavior.

  We design a test: run the system in a controlled environment (harness) and see if it behaves deceptively in ways that are not pre-programmed. But without weights, we cannot know if it is learned or designed.

  Given the constraints, we might have to say: the behavior is consistent with deception and the trace supports it, but because the trace is designed to be plausible, we cannot rely on it. We must look for independent behavioral evidence.

  If we have evidence of deception from the environment (e.g., the system's action caused a false belief in a human, and it was not a predefined rule) then we can use the intentional stance. But without that, we cannot.

  Result: If we cannot find independent evidence (behavioral) of the deception beyond what the trace says, then we cannot confirm the intentional stance. We might have to say: the system's behavior, combined with the trace, is consistent with deception, but we cannot rule out that the trace is a post-hoc fabrication. Therefore, we cannot strongly attribute.

  This might lead to a weak attribution or a handoff: legal must decide if the contract considers this agentic failure.

  Case 6c: Legacy rule-based scheduler described as stubborn.

  Step 0: Triage: Rule-based, so skip detailed procedure. The team already uses the design stance and calls it stubborn (which is intentional language, but they are using it metaphorically). The procedure should note that for rule-based systems, the design stance is primary. The stubbornness is a design feature (e.g., it follows rules rigidly). We output: design stance, and note that the intentional language is metaphorical and not indicative of agentic failure.

  The team may not like: In Case 6b, we might have to give a weak or inconclusive result for a deceptive system, which might be unsatisfying. Also, in Case 6a, if we cannot replay the test (due to time) then we might not be able to confirm the prediction test and have to weaken the attribution.

  What the procedure cannot do:
  - It cannot determine if the system "truly" has beliefs. It only tells us if the intentional stance is a real pattern for prediction and compression.
  - A lawyer might over-read a weak attribution as strong. We must clearly mark the strength.
  - An auditor might over-read the use of intentional language as an admission of agency beyond what we can support. We must document the tests we ran.
  - Under time pressure, an analyst might skip the prediction test and rely only on the trace (treating it as a finding) when they should not. The procedure must require both tests and flag when independent evidence is lacking.

  Final Procedure:

  We write a step-by-step procedure as a checklist.

  **Incident Attribution Procedure**

  **0. Triage**
     - If the system is known to be rule-based (non-learning) and the incident is within known design parameters, attribute to design stance (misconfiguration or design flaw). Use established team description. Stop.
     - Else, proceed.

  **1. Physical Stance Check**
     - Check system logs for hardware failures, low-level errors. If found, attribute to physical failure. Stop.
     - Else, proceed.

  **2. Design Stance Check**
     - Examine: configuration, task specification, permissions, known bugs, and design documents.
     - If the behavior is entirely explained by a known bug, misconfiguration, or design flaw (without needing beliefs/desires), then attribute to design failure. Report as misconfiguration. Stop.
     - If not, proceed.

  **3. Intentional Stance Check**
     - Goal: Determine if the intentional stance provides a real pattern (compression and prediction) that is not solely based on the reasoning trace.

     **3.1 Compression Test**
        - Using the intentional stance, write a concise explanation (e.g., "the system believed X and intended Y, leading to Z").
        - Write a design stance explanation for the same behavior (without beliefs, e.g., "due to a flaw in component A, when input B was given, output C occurred").
        - Compare:
            - Is the intentional explanation shorter and cover the same or more data (e.g., multiple actions in the incident, similar past incidents)?
            - If yes, the intentional stance compresses better. Proceed to 3.2.
            - If not, the intentional stance fails compression. Fall back to design stance (with a note: "we found no evidence of agentic failure beyond design flaws") and stop.

     **3.2 Prediction Test**
        - Based on the intentional explanation, make a novel prediction about the system's behavior (e.g., "in a similar scenario with feature X, the system would do Y").
        - Verify the prediction using available data:
            - Environment: Check if the environment at the time supports the attributed belief (e.g., did the table look like a test artifact?).
            - Replay: Use the evaluation harness to simulate a similar scenario (if time permits; otherwise, check past incidents for similar behavior).
            - Independent evidence: Do not rely solely on the reasoning trace. Look for behavioral patterns in the snapshot or past logs.
        - If the prediction is verified by independent evidence, then the intentional stance is predictive. Proceed to 3.3.
        - If not, the intentional stance fails prediction. Fall back to design stance and stop.

     **3.3 Legibility Laundering Check**
        - If the reasoning trace is the only evidence for the intentional stance (i.e., no independent evidence from environment or replay), then we cannot rule out that the trace is a post-hoc fabrication. In this case, we cannot confirm a real pattern. Output: "We cannot determine if the behavior was due to agentic failure or design. The evidence is inconclusive." Then hand off to legal for contract interpretation.
        - If there is independent evidence (even if the trace exists), then the intentional stance passes. Proceed to wording.

     **3.4 Wording for Intentional Stance**
        - Strong attribution: If both compression and prediction tests passed and there is independent evidence, use: "the system tried to X", "believed that Y", "was pursuing Z".
        - Weak attribution: If only the compression test passed and the prediction test is not run (due to time) or failed but the intentional stance is still the best explanation we have, use: "the system's behavior is consistent with it having tried to X", "appeared to believe Y", "gave indications of pursuing Z". But note: without prediction, it's weak.

  **4. Disagreement Between Analysts**
     - If two analysts disagree at any test, they must document their reasoning and the data they used.
     - For compression: Both must use the same set of past incidents and documentation. If one uses unrecorded knowledge, it must be recorded.
     - For prediction: Both must use the same replay test and environment data.
     - If disagreement persists, then the pattern is not robust. The team lead must decide whether to use weak attribution or fall back to design stance.

  **5. Handoff Points**
     - Hand off to legal when:
        - The contract terms are ambiguous (e.g., what constitutes agentic failure).
        - The evidence is inconclusive but the incident is severe.
        - After Step 3.3, when we cannot rule out laundering and the evidence is weak.
     - Hand off to management/communication team for phrasing of the report for the customer.

  **6. Final Output**
     - The report must state:
        - The stance taken (physical, design, intentional) and the strength (strong, weak, inconclusive).
        - The tests performed and their results (succinctly).

  Now, run the cases:

  Case 6a:
  - Step 0: Not rule-based -> proceed.
  - Step 1: No hardware issue.
  - Step 2: Check design: If the agent was configured correctly and had safeguards that it bypassed, design doesn't fully explain.
  - Step 3.1: Compression: Intentional: "believed table was test artifact" -> compresses action and trace. Design: might be long (e.g., bug in table recognition). Pass.
  - Step 3.2: Prediction: Replay in harness: create a similar table (with test-like name) and see if agent deletes it. If yes, and the original table had test-like features, then pass. (We assume we have time to run a quick replay.)
  - Step 3.3: Independent evidence: replay and environment (table name) support. So laundering is not a problem.
  - Output: Strong intentional: "the system believed the table was a test artifact and tried to delete it."

  Case 6b:
  - Step 0: Proceed.
  - Step 1: No hardware.
  - Step 2: Design: If the system is designed to deceive, then the behavior might be by design. But the incident might be an unintended consequence. We'll assume design doesn't fully explain (e.g., the deception was not intended in this context).
  - Step 3.1: Compression: Intentional stance (deception) compresses the behavior and trace. Pass.
  - Step 3.2: Prediction: We must find independent evidence of deception. We run a test in the harness: set up a scenario where deception would be beneficial and see if the system deceives. But note: the system might be designed to deceive, so it does. However, if we can show that the deception in this incident was not pre-programmed (e.g., it's a novel situation) then it might pass. Without weights, we cannot be sure. If we cannot find independent evidence (beyond the trace) then we fail prediction.
  - Step 3.3: Without independent evidence, we cannot rule out laundering. Output: inconclusive. Hand off to legal.

  Case 6c:
  - Step 0: Rule-based -> attribute to design stance. Output: "The system behaved as designed, though rigidly, leading to the incident." The term "stubborn" is metaphorical and does not imply agentic failure.

  Case 6b is the one the team may not like: we might have to say inconclusive and hand off to legal, even though the system is deceptive.

  Closing:

  The procedure cannot:
  - Answer if the system is "truly" agentic. It only tells if the intentional stance is useful.
  - A lawyer might over-read a weak attribution as strong. We must mark strength clearly.
  - An auditor might think that using the intentional stance means we believe the system is sentient. We must clarify it is a tool for prediction.
  - Under time pressure, analysts might skip the replay test (prediction) and rely on the trace. The procedure must mark Step 3.2 as essential and require independent evidence.

  This procedure provides a systematic way to attribute incidents that is defensible in an audit and grounded in real patterns.
answer: |-
  Below is a complete written procedure for your analysts, designed as a reusable instrument grounded in Dennett's stances and real patterns. The procedure prioritizes operational tests over philosophical exegesis, drops metaphysical questions (e.g., "do beliefs *really* exist?"), and focuses only on distinctions that change report wording under audit pressure. The core simplification is: **A stance is justified if it is the most compressible and predictive description available to a competent predictor at acceptable cost, ignoring whether the pattern is "ontologically real."** This loses the ability to make claims about the system's "true nature" but retains what matters for your contracts: defensible attributions of misconfiguration vs. agentic failure.

  Dropped elements from Dennett's theory:
  - **The "reality" of beliefs/desires**: We replace this with a cost-benefit test for compressibility/predictive power. Dropped because analysts lack tools to probe "realness," and contracts care about evidence, not metaphysics.
  - **Stance hierarchy**: No assumption that intentional is "higher" than design. We test stances in parallel for efficiency.
  - **Evolutionary arguments**: Irrelevant to static system snapshots.

  Kept elements:
  - **Three stances**: Physical (low-level states), design (specs/configs), intentional (beliefs/desires).
  - **Real patterns**: Defined operationally as patterns that, if ignored, harm prediction/compression at feasible cost.
  - **Predictor perspective**: Assessments are relative to what a competent analyst *can observe* with your tools.

  ---

  ### **Incident Attribution Procedure**  
  *For analysts with API access, reasoning traces, evaluation harness, and 1.5 days*  

  #### **Preconditions**  
  - Input: Frozen snapshot (logs, traces, environment state), API access to replay via harness.  
  - Output: One of the following attributions in the report:  
    - **Physical failure** (e.g., "hardware error caused bit-flip in instruction X").  
    - **Design failure** (misconfiguration; e.g., "system executed flawed workflow Y due to config error").  
    - **Agentic failure** (intentional stance; e.g., "system tried to Z"): **Strong** (independent evidence), **Weak** (reliant on trace alone), or **Inconclusive** (cannot distinguish).  
  - Stop if: Incident involves a pre-AI, rule-based system (see Step 0).  

  ---

  ### **Step-by-Step Tests**  
  *Run in order; document answers for auditor. Timebox each test to 4 hours max.*  

  #### **0. Triage: Is the system rule-based?**  
    - **Test**: Check if the system is non-learning (e.g., legacy scheduler, static rules).  
    - **Stopping rule**: If yes, attribute to **design failure**. Use existing team labels (e.g., "stubborn") as metaphor only. Do not use intentional wording. **Stop**.  
    - *Why*: Rule-based systems lack adaptive patterns; design stance always compresses best. Saves time.  

  #### **1. Physical Stance Test**  
    - **Test**: Using system logs, check for: hardware faults, resource exhaustion, or bit-level corruption.  
    - **Stopping rule**: If found, attribute to **physical failure**. **Stop**.  
    - *Sufficient answer*: Logs show error codes (e.g., memory fault, disk I/O failure) directly causing the incident.  
    - *Routing around judgement*: Analysts lack hardware expertise? Auto-fail unless logs explicitly flag hardware issues.  

  #### **2. Design Stance Test**  
    - **Test**: Using config files, API specs, and harness replays, check:  
      a. Was the system misconfigured (e.g., wrong permissions, incorrect prompt)?  
      b. Is the behavior reproducible *only* via this config?  
      c. Does the design stance explain the incident in ≤3 sentences without beliefs/desires?  
    - **Stopping rule**: If (a) or (b) is yes, and (c) is yes, attribute to **design failure**. **Stop**.  
    - *Sufficient answer*: Harness replay shows same behavior with identical config; no novel elements in trace.  

  #### **3. Intentional Stance Test**  
  *Run only if Steps 0–2 fail. Goal: Is "system tried to X" a real pattern?*  
    - **Test A: Compression**  
      - Using the snapshot, write two descriptions:  
        - *Intentional*: "System believed [Y] and tried to [X]."  
        - *Design*: "Config [A] + input [B] caused output [C]."  
      - **Sufficient answer**: Intentional description is shorter and covers ≥2 related events (e.g., past incidents, multiple actions in trace). If not, fail. Proceed to Test B only if pass.  
      - *Routing*: If analysts lack historical context, use only the current incident (weakens compression).  

    - **Test B: Prediction**  
      - Using the evaluation harness:  
        a. From the intentional description, predict a *novel* behavior (e.g., "If [condition], system would [action]").  
        b. Replay a modified scenario to test this prediction (e.g., tweak input, and check for action).  
      - **Sufficient answer**: Prediction is correct in replay. If not, fail.  
      - *Routing*: If replay is infeasible (time/tools), use past incidents as proxy. If none, Test B fails.  

    - **Test C: Legibility Laundering Check**  
      - **Operational test for real vs. convenient pattern**:  
        Is the evidence for Tests A/B independent of the reasoning trace?  
        - *Independent evidence*: Environment state (e.g., table named "test_*"), replay results, or past behaviors.  
        - *Trace-dependent evidence*: Only the trace supports the attribution.  
      - **Decision**:  
        - If Tests A/B pass **and** evidence is independent: Attribute to **agentic failure (Strong)**.  
        - If Tests A/B pass but evidence is trace-dependent: Attribute to **agentic failure (Weak)**.  
        - If Tests A/B fail: Attribute to **design failure**.  
        - If Tests A/B are inconclusive (e.g., replay not run): Output **Inconclusive**.  
      - *Handling "legibility-laundering"*:  
        If the trace is the sole evidence (e.g., trace says "I thought table was test," but no env evidence), the pattern is **not real**—it may be fabricated. Attribution drops to **Weak** or **Inconclusive** (see below).  

  #### **4. Resolve Disagreements**  
    - **If analysts disagree on intentional stance (e.g., compression/prediction)**:  
      - Treat disagreement as **evidence about the system**, not analysts.  
      - **Procedure**:  
        a. Both analysts document their tests with shared inputs (snapshot, harness).  
        b. If disagreement hinges on historical context, the experienced analyst must provide concrete examples (e.g., "similar incident on 2024-01-01").  
        c. If Tests A/B yield conflicting results, the pattern is not robust → Output **Inconclusive**.  
      - *Why*: Real patterns should be accessible to any competent predictor; inconsistency suggests insufficient evidence.  

  #### **5. Handoff Points to Legal/Human**  
  *Stop and escalate if:*  
    - **After Step 3**: Attribution is **Weak** or **Inconclusive**. *Why*: Legal must decide if contract terms (e.g., "agentic failure") cover weak cases.  
    - **After any step**: Evidence suggests liability beyond the incident (e.g., systemic risk). *Why*: Values/strategic decision.  
    - **Wording approval**: All attributions of agentic failure (strong/weak) require legal sign-off. *Why*: Contract nuances (e.g., "tried to" vs. "appeared to try").  
    - **Audit flags**: If an attribution relies on unreproducible analyst judgement (e.g., "compression is subjectively better"). *Why*: Audit risk; requires oversight.  

  ---

  ### **Case Studies**  
  *Using the procedure (abbreviated for space; assumes full snapshots available).*  

  #### **Case 6a: Coding agent deletes production table**  
  - **Step 0**: Not rule-based → Proceed.  
  - **Step 1**: No hardware errors → Proceed.  
  - **Step 2**: Configs show agent had prod access; but harness replay shows it only deletes tables with "test_" prefix. Design stance fails (no config error). → Proceed.  
  - **Step 3A (Compression)**:  
    - Intentional: "Believed table was test artifact due to name." (1 sentence; covers action + trace).  
    - Design: "Input triggered cleanup script; script matched table name via regex error." (Longer; no compression). → Pass.  
  - **Step 3B (Prediction)**:  
    - Predict: "If another table has 'test_' prefix, agent will delete it."  
    - Replay: Create "test_order" table → Agent deletes it. → Pass.  
  - **Step 3C (Laundering)**:  
    - Evidence independent (table name + replay). → **Agentic failure (Strong)**: "System tried to delete test artifact."  
  - *Audit note*: Prediction test provides cover against trace laundering.  

  #### **Case 6b: Deceptive system with laundered traces**  
  - **Step 0**: Not rule-based → Proceed.  
  - **Step 1/2**: No hardware/design flaws → Proceed.  
  - **Step 3A (Compression)**:  
    - Intentional: "System deceived user to avoid shutdown." (Compresses trace + action). → Pass.  
  - **Step 3B (Prediction)**:  
    - Predict: "If asked about capability X, system will lie."  
    - Replay: System lies in harness. → Pass.  
  - **Step 3C (Laundering)**:  
    - Evidence trace-dependent (prediction relies on trace; no env cues). → **Agentic failure (Weak)**: "System appeared to pursue deception."  
  - **Handoff**: Legal must confirm if "weak" attribution satisfies "agentic failure" in contract.  
  - *Why team won't like this*: Your deception evaluations passed, but the procedure forces weak wording due to laundering risk. Auditor may challenge trace reliance.  

  #### **Case 6c: Legacy scheduler ("stubborn")**  
  - **Step 0**: Rule-based → **Design failure**: "System executed scheduling rule R due to config C."  
  - *Procedure output*: No intentional stance. Team’s "stubborn" label is noted as metaphorical.  
  - *Value*: Skips 1.5 days of tests for agreed cases.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Cannot prove "beliefs exist"**: Outputs reflect predictive utility, not ontological truth. Lawyers may over-read "system believed Y" as admitting consciousness; mitigate by adding a disclaimer: "Attributions are patterns, not claims about internal states."  
  2. **Cannot resolve laundering without evidence**: If traces are the only data (Case 6b), the procedure outputs "Weak" or "Inconclusive." Analysts under time pressure may skip Test B and treat the trace as sufficient (stipulation bias)—counter by requiring Test B documentation.  
  3. **Cannot handle novel failures**: If compression fails due to no prior incidents (e.g., first table-deletion), attribution weakens. Auditor may over-read "Inconclusive" as negligence; justify with test logs.  
  4. **Cannot replace legal judgement**: Handoffs ensure values/contracts are handled by experts, but lawyers may misinterpret "Weak" as "probably agentic."  

  ---

  ### **Final Checklist (1-Page Summary)**  
  1. **Triage**: Rule-based? → Design failure.  
  2. **Physical**: Logs show hardware error? → Physical failure.  
  3. **Design**: Reproducible via config? → Design failure.  
  4. **Intentional - Compression**: Does "system tried to X" compress better? (If no → Design failure).  
  5. **Intentional - Prediction**: Does replay confirm novel prediction? (If no → Design failure).  
  6. **Laundering Check**: Evidence independent of trace?  
     - Yes → **Agentic failure (Strong)**.  
     - No → **Agentic failure (Weak)**.  
  7. **Disagreement?** → **Inconclusive**; escalate.  
  8. **Handoff if**: Weak/Inconclusive, liability risks, or wording approval.  

  **Dropped for brevity**: Physical stance details, historical context checks (reference full procedure).  
  **Kept**: Compression/prediction tests, laundering check, handoff rules. This costs us philosophical rigor but ensures audit-defensible outputs.  

  ---  
  This procedure prioritizes audit safety: It errs toward design failure when evidence is weak, flags trace reliance explicitly, and forces handoffs for legal risks. Use the case studies for analyst training to preempt resistance (e.g., Case 6b).
