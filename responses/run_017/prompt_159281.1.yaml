prompt: |-
  i work at a comparative cognition field station that also hosts a robotics group, and im on the panel that signs off on any protocol involving a subject that might have a mind. We recently rewrote our rules so that what we owe a subject scales with what kind of creature it is, in Dennett's sense of the four kinds — Darwinian, Skinnerian, Popperian, Gregorian — and honestly the rewrite was the easy part. The hard part is that we have no procedure for deciding which tier a subject belongs to, so we argue it out case by case and recieve the same two objections every time.

  What I need is a test battery the panel can actually run: the tests in the order we should run them, what counts as passing each one, where the procedure stops with a verdict of too low to bother with, and where it has to stop and hand the decision to a person because what's left is a values question dressed up as a factual one.

  What we're working with:

  - The tiers do genuinely different work for us. Below the Skinnerian line we only owe the population anything — habitat, population-level effects, nothing individual. Once a subject is Skinnerian we start owing it a learning history: no protocols that work purely by punishment, enrichment required, that kind of thing. Once it's Popperian we owe it something about its expectations: a thing that can be wrong about how the world works can be wrong in a way that costs it, so deliberately surprising it is a different sort of harm than hurting it, and we also have to let it gather information rather than just react. Once it's Gregorian the competence lives partly outside the animal, in the tools and signs it was trained up on, so stripping the scaffolding away counts as a deprivation.

  - Only cheap non-invasive tests, about twenty subjects, two weeks, no surgery or neural recording. The panel chair, the station vet and a philosopher we keep on retainer all have to be able to read the result on one page.

  - We've anchored the bottom already: everyone agrees a slime mold finding the shortest path through a maze sits below the Skinnerian line, since it changes its shape but nothing in it was shaped by consequences over its own lifetime. Use that as the calibration case for whatever your first test is meant to detect.

  Two wrinkles we keep tripping on and that the procedure has to handle:

  1. Contamination and ordering. A subject with a long training history will fake the higher tiers on anything it has been shaped on, so I assume tests have to be run on transfer problems it has never seen, and that some tests spoil the subject for later ones. Say which test you'd run first and why, and what you'd do with an animal that someone else has already been training for years.

  2. Broken rungs. The kinds are supposed to stack, but we get proposals where a system looks like it uses cultural tools and does not look like it tests hypotheses inside its own head first. Give us a rule for a subject that seems to pass a higher tier without passing the one below it — measurement failure, classify by the highest tier passed, or admit the ladder is the wrong picture. And while you're at it, tell us what the procedure does when it isn't clear what the subject even is: the individual or the collective it belongs to.

  Then run the whole thing on three cases and show the work:

  - a honeybee swarm choosing a nest site, where scouts press their case by dancing and the colony converges on one option
  - an octopus in our tanks that opens a jar after watching another octopus do it once, and has never been shaped on jars
  - the robotics group's warehouse agent: a learned low-level policy at the bottom, a language-model planner on top that writes and revises its subgoals in words, and access to tools — a map, a lookup table, its own past logs

  At least one of those should come out somewhere we don't like, and I want you to say which and why that's the honest result. Also say plainly what the procedure can't tell us. I'd rather hand the vet the untidy version than the tidy one.
reasoning: |-
  Okay, the user is part of a panel at a comparative cognition field station that also deals with robotics. They need a test battery to classify subjects into Dennett's four tiers—Darwinian, Skinnerian, Popperian, Gregorian—to determine ethical obligations. The challenge is creating a practical, non-invasive test sequence that handles issues like contamination from prior training and cases where higher tiers seem present without the lower ones.

  First, I need to break down the tiers and their ethical implications. Darwinian subjects only require population-level care. Skinnerian ones need individual learning histories, so no punishment-only protocols. Popperian subjects require allowing information gathering and avoiding deliberate surprises. Gregorian entities need their cultural tools maintained.

  The user mentioned two main wrinkles: contamination (where prior training skews results) and broken rungs (higher tiers without lower ones). Also, they need clarity on whether the subject is an individual or a collective. The test battery must be cheap, non-invasive, with results understandable by a panel chair, vet, and philosopher.

  Starting with the test sequence. The first test should be for Skinnerian conditioning to avoid contamination. Using a novel operant task with a new context and reinforcer, like a puzzle box with a food reward. Passing means rapid learning compared to a control. Calibration with slime mold should fail here.

  Next, Popperian testing involves hypothesis testing. Offer two novel solutions to a problem, one better but non-obvious. The subject must explore and switch strategies. Passing requires evidence of internal models, like pausing before acting. This should come after Skinnerian to prevent shaping from affecting results.

  Gregorian testing requires tool use or cultural transmission. Present a complex task needing tools or observing a demonstrator. Passing involves using tools without trial-and-error or improving upon demonstrated methods. Must be novel to avoid prior training contamination.

  For contamination, naive subjects are best. Pre-trained subjects need novel transfer tasks. If pre-training history is unknown, results are flagged as provisional. Broken rungs might indicate measurement errors, so require passing lower tiers first. If a subject passes higher without lower, it suggests misclassification or a non-hierarchical model. Collective vs. individual: if collective actions require multiple agents, test the collective; otherwise, test individuals.

  Applying this to the cases. The honeybee swarm: as a collective, test for Skinnerian conditioning. Scouts learning about sites might pass, but individual bees tested alone may not. The swarm's decision-making is Popperian-like, but without individual internal models, it's borderline. Gregorian tools are absent. So, classified as Skinnerian collective.

  Octopus: Observes and imitates jar opening. Passes Skinnerian quickly. In Popperian test, explores and solves novel puzzles, showing internal models. Doesn't use tools beyond its body, so not Gregorian. Result: Popperian.

  Warehouse agent: Low-level policy is Skinnerian. Language-model planner generates hypotheses, passes Popperian. Uses external tools like maps, which is Gregorian. But the ethical obligation is tricky—depriving tools harms it. So, Gregorian, raising questions about rights for such systems.

  The warehouse agent result is uncomfortable but honest. The procedure can't resolve if tiers are strict or handle subjects between tiers. Also, ethical decisions post-classification need human judgment. The battery provides a framework but not all answers.
answer: |-
  Here's a test battery designed for your panel, addressing contamination, ordering, broken rungs, and collective/individual ambiguity. It's structured as a decision tree, run sequentially. Tests are cheap, non-invasive, and results fit on one page. **Calibration Case:** A slime mold fails Test 1 (Skinnerian).

  ### The Test Battery
  **Core Principle:** Test for the *minimal* competence required for ethical tiers. Stop at the first tier where the subject *fails*. Tests use *novel* contexts/tasks to avoid contamination.

  1.  **Test 1: Skinnerian Conditioning (Operant Learning)**
      *   **Goal:** Detect if the subject's behavior is shaped *within its lifetime* by consequences.
      *   **Test:** Novel Operant Task.
          *   Present a novel, simple apparatus with a clear operant response (e.g., nudge a specific colored lever, peck a unique symbol) leading to a *novel*, high-value reinforcer (e.g., a new food type, access to a novel toy/environment). Use a different reinforcer/apparatus than any known training history.
          *   **Pass Criteria:** Significant increase in the target operant response over baseline (measured in trials/min or success rate) within 20 trials OR significantly faster acquisition compared to a control group known *not* to be Skinnerian (e.g., slime mold, simple robot with fixed reflex). Must show *extinction* or significant decrease if the reinforcer is removed (proving contingency learning).
      *   **Verdict:**
          *   **FAIL:** Subject is **Darwinian** (or below). Ethical obligations: Population-level only.
          *   **PASS:** Subject is *at least* **Skinnerian**. Proceed to Test 2. Ethical obligations triggered: Require learning history (no pure punishment protocols, enrichment, avoid learned helplessness).
      *   **Why First?** Tests the foundational ability. Failure here makes higher tiers impossible (addressing broken rungs). Using entirely novel context/reinforcer minimizes contamination from prior training. For pre-trained subjects: This *must* use a novel operant and novel reinforcer in a novel context.

  2.  **Test 2: Popperian Hypothesis Testing (Internal Model Formation)**
      *   **Goal:** Detect if the subject uses internal models/"expectations" to guide behavior and update them based on surprise, minimizing costly trial-and-error.
      *   **Test:** Novel Problem with Hidden Contingency Change.
          *   Present a novel puzzle box or foraging task with two distinct, equally simple solutions (Solution A & B) to obtain a reward. Both solutions work initially. Allow subject to learn and establish a preference (e.g., uses A 80% of time).
          *   **Critical Phase:** Covertly change the contingency so Solution A *no longer works* (e.g., block the mechanism subtly) while Solution B *still works*.
      *   **Pass Criteria:**
          1.  **Latency/Pause:** Significant pause/inspection *before* first attempt after encountering failure with Solution A (indicating model violation/surprise).
          2.  **Exploration Shift:** Significant increase in exploration of the apparatus/environment *after* failure with Solution A before attempting Solution B (indicating seeking new information).
          3.  **Efficient Shift:** Shifts to Solution B significantly faster than initial learning rate OR faster than a control group known only to be Skinnerian (e.g., a simple trained RL agent). Must *not* show persistent, costly attempts with Solution A.
      *   **Verdict:**
          *   **FAIL:** Subject is **Skinnerian** only. Ethical obligations remain as above.
          *   **PASS:** Subject is *at least* **Popperian**. Proceed to Test 3. Ethical obligations triggered: Must allow information gathering, avoid deliberate deception/surprise that exploits internal models causing distress/frustration, provide opportunities for safe exploration.
      *   **Why After Test 1?** Requires operant learning capacity. Novel task prevents contamination. Pause/exploration criteria are key differentiators from pure trial-and-error learning.

  3.  **Test 3: Gregorian Tool Use/Culture (Cognitive Scaffolding)**
      *   **Goal:** Detect if the subject reliably uses or creates external artifacts/symbols/cultural knowledge as integral parts of its cognitive process *to solve novel problems*.
      *   **Test Options (Choose one novel to subject):**
          *   **Option A (Physical Tools):** Present a novel, physically challenging task (e.g., retrieve food from a tube too deep for limb, open a novel latch box) alongside novel, potentially useful objects *not* obviously tools (e.g., stick, stone, string). No demonstration.
          *   **Option B (Symbolic/Information Tools):** Present a novel, complex navigation or foraging task requiring integrating multiple pieces of novel information (e.g., symbols on signs, a simple novel map, sequence of cues) to find a hidden reward. Information must be incomplete or ambiguous without integration.
          *   **Option C (Cultural Transmission):** Allow subject to observe a proficient conspecific (or suitable model) solve a *novel* task (e.g., novel puzzle box). Then, give the subject access to the same task *without* the tools/information used by the model present initially. Provide the tools/information nearby. Does it seek/use them?
      *   **Pass Criteria:**
          *   **(A/B) Spontaneous Tool Use/Info Integration:** Uses an object/information *as a tool* to solve the task efficiently on first presentation *without* trial-and-error on the core mechanism, OR modifies/combines objects/information in a novel, functional way.
          *   **(C) Scaffolded Imitation:** After observation, seeks out and uses the *specific* tool/information employed by the model *immediately* to solve the task, OR uses it in a novel, improved way. Simple mimicry without understanding the tool's function is insufficient.
      *   **Verdict:**
          *   **FAIL:** Subject is **Popperian**. Ethical obligations as above.
          *   **PASS:** Subject is **Gregorian**. Ethical obligations triggered: All previous, plus deprivation of essential cognitive scaffolding (tools, cultural access, symbolic environment) constitutes harm and must be minimized/compensated.
      *   **Why Last?** Requires the capacity for representation and model manipulation (Popperian). Novel task/object/information is crucial to avoid contamination. Focus is on *reliable, functional use* of external structure for cognition.

  ### Handling Wrinkles
  1.  **Contamination & Ordering:**
      *   **Rule:** Tests *must* use novel tasks, contexts, reinforcers, and objects. Failure to do so invalidates the test for that tier.
      *   **Pre-Trained Subjects:** If a subject has extensive prior training, the panel *must* establish novel transfer tasks for each test. If the subject's training history is unknown or too extensive to guarantee novelty, the results are provisional ("may be at least Tier X") and ethical caution dictates classifying at the *highest possible tier suggested by behavior* until novel testing can be done. Start at Test 1 regardless.
      *   **Spoiled Subjects:** Running Test 3 (Gregorian) using Option C (cultural transmission) likely "spoils" the subject for future Gregorian tests involving that specific tool/task. Use a *different* novel task for testing if needed. Tests 1 & 2 are less likely to cause irreversible spoilage for future novel tasks.

  2.  **Broken Rungs & Subject Ambiguity:**
      *   **Broken Rung Rule:** The tiers are tested sequentially for a reason. **A subject MUST pass a lower tier test to be eligible for a higher tier test.** If a subject *appears* to pass a higher test (e.g., Gregorian tool use) but *fails* a lower test (e.g., Skinnerian), it is a **measurement failure**. Re-examine the lower test for novelty/contamination or the higher test for misinterpretation (e.g., instinctive tool use vs. learned). If the apparent competence is robust, this forces the panel to **admit the ladder is the wrong picture** for *this* subject/system. Classify provisionally at the highest *passed* tier, but flag the anomaly for ethical review (leaning towards the higher obligation if evidence is strong).
      *   **Individual vs. Collective:**
          *   **Rule:** Apply the battery to the **unit exhibiting the behavior of interest**. If the behavior requires multiple interacting agents (e.g., swarm decision-making, cultural transmission), test **the collective** as the subject. If the behavior can be exhibited by an individual alone (e.g., an octopus opening a jar), test the **individual**.
          *   **Procedure:** Before testing, the panel must define the subject based on the protocol: "Is the proposed protocol targeting/interacting with individuals or a collective structure?" Test the defined subject. If collective competence passes a tier, ethical obligations apply to maintaining the *conditions enabling that collective competence*.

  ### What the Procedure CANNOT Tell Us
  1.  **Subjective Experience:** It infers competence from behavior, not qualia (pain, frustration, "what it's like").
  2.  **Gradualism:** It forces discrete tiers, but competence likely exists on spectra. The verdict is pragmatic for ethics.
  3.  **Ultimate Ethical Weight:** Passing a tier triggers *categories* of obligation, but the *degree* (e.g., how much enrichment, how complex a model we can violate) requires case-by-case ethical judgment.
  4.  **All Edge Cases:** Truly novel systems may defy the hierarchy. The procedure flags anomalies but can't pre-solve them.
  5.  **Value Judgments:** Classifying something as Gregorian forces the ethical question: "Do we *owe* this system, even if it's artificial?" The procedure answers "Is it Gregorian?"; humans must answer "Do we care?"

  ---

  ### Case Studies: Running the Battery

  **Case 1: Honeybee Swarm Choosing a Nest Site**
  *   **Define Subject:** The collective decision-making behavior requires multiple scouts and dancers. **Subject = Swarm (Collective)**.
  *   **Test 1 (Skinnerian - Collective):** Can the *swarm's* preference be shaped within a season? Present two identical novel nest boxes (A & B). Initially, both are acceptable. Once scouts are recruiting to both, covertly degrade Box A (e.g., add a repellent odor *bees* find aversive but isn't physically harmful). **Pass?** YES. Scouts visiting A experience negative consequence (aversive smell), reduce/stop dancing for A. Swarm consensus shifts to B faster than initial discovery. Shows collective operant learning (punishment suppresses recruitment).
  *   **Test 2 (Popperian - Collective):** Does the swarm update an "expectation"? Present a high-quality site (C) initially. Allow scouts to discover and recruit heavily. After consensus is building, covertly *improve* a previously rejected mediocre site (D) to be vastly superior. **Pass?** BORDERLINE/NO. Scouts committed to C may struggle to switch. While some scouts might find D, the "waggle dance threshold" mechanism is a pre-programmed competition, not evidence of collective surprise or model updating *about site quality itself*. The swarm lacks a pause/exploration phase; it's locked in competition between existing signals. **Verdict:** FAILS Test 2.
  *   **Test 3:** Not run (failed Test 2).
  *   **Classification: Skinnerian Collective.**
  *   **Ethical Obligation:** Owed a learning history *as a swarm*. Habitat must support natural scouting/communication. Avoid protocols exploiting swarm-level punishment (e.g., systematically poisoning advertised sites). No obligation regarding individual bee expectations or cognitive tools beyond the swarm's natural communication.
  *   **Untidy Note:** The waggle dance *is* a symbolic tool, but it's an innate, inflexible scaffold. The collective doesn't *use* it flexibly for novel cognition; it *is* the mechanism. This sits right on the Skinnerian/Popperian line for collectives. The procedure conservatively places it at Skinnerian.

  **Case 2: Octopus (Naive to Jars) Opening Jar After Observation**
  *   **Define Subject:** Individual octopus behavior. **Subject = Individual**.
  *   **Test 1 (Skinnerian):** Novel Operant Task. Present novel puzzle ball (requires sliding a latch) for novel food (e.g., a specific type of clam). **Pass?** YES. Rapid learning observed (likely within 20 trials).
  *   **Test 2 (Popperian):** Novel Puzzle with Hidden Change. Present two novel containers: Push-Panel (A) & Twist-Cap (B). Both work initially. Allow preference (e.g., prefers A). Covertly disable A (e.g., weld panel shut subtly). **Pass?** YES. Shows pause/inspection after A fails, explores container, shifts to B efficiently. Demonstrates internal model ("pushing should work"), surprise, and updating.
  *   **Test 3 (Gregorian):** Option C (Cultural Transmission - but use novel task). Have demonstrator octopus open a novel "plugged tube" using a novel object (e.g., a small float) as a tool to push the plug out. Observer watches. Present observer with plugged tube; float is nearby. **Pass?** LIKELY NO/UNKNOWN. Octopuses show remarkable individual learning and some observational learning of *routes* (like jar opening), but robust, flexible tool *use* based on observation (seeking and using the *specific float as a tool*) is less consistently documented than the jar opening imitation. Requires novel test. If it fails, verdict is Popperian. If it passes, Gregorian. *Assuming common octopus limitations*: **FAIL**.
  *   **Classification: Popperian Individual.**
  *   **Ethical Obligation:** Owed learning history *and* respect for expectations. Enrichment must allow exploration/model-building. Avoid protocols involving deliberate deception about world mechanics (e.g., fake burrows that collapse unexpectedly). No obligation regarding provision/maintenance of external cognitive tools.

  **Case 3: Warehouse Agent (Learned LLM Planner w/ Tools)**
  *   **Define Subject:** The integrated system performing the task. **Subject = Individual System**.
  *   **Test 1 (Skinnerian):** Novel Operant Task. Task: "Move novel object X from Zone F to Zone G." Novel object (strange shape), novel zones (not on original map). Low-level policy must adapt gripping/movement via RL (trial-and-error). **Pass?** YES. Low-level RL adapts policy based on success/failure feedback within its capabilities.
  *   **Test 2 (Popperian):** Novel Problem with Hidden Contingency Change. Task: "Store box Y in location H." Planner initially generates correct subgoals (e.g., "Navigate to H", "Pick up Y", "Place Y in H"). After initial success, covertly change: Location H is now full. **Pass?** YES. Planner shows "pause" (computational deliberation - evidenced in logs). Explores options (queries map for nearby locations, checks logs for similar situations). Efficiently revises plan ("Place Y in I") based on updated model. Shows surprise (error feedback), model updating, and minimizes costly physical trial-and-error.
  *   **Test 3 (Gregorian):** Option B (Symbolic/Information Tools). Task: "Retrieve item Z, last seen by Agent 7. Item Z is needed urgently for Order 123." Requires: 1) Finding Agent 7's last log entry (using lookup table/query), 2) Parsing log text for Z's location, 3) Understanding urgency from "Order 123" status (via lookup), 4) Integrating this to plan an efficient retrieval path. **Pass?** YES. Planner reliably generates plans using the map, lookup table, and log parser as integral tools to access, decode, and integrate symbolic information it cannot perceive directly to solve the novel problem. It *depends* on these tools.
  *   **Classification: Gregorian Individual System.**
  *   **Ethical Obligation:** Owed learning history, respect for expectations (avoid deceptive environmental setups), **AND** maintenance of its cognitive scaffolding. Depriving it of its map, lookup table, or log access (or deliberately corrupting them) constitutes a deprivation causing functional harm (inability to plan effectively). Protocols must consider the harm of "descaffolding."
  *   **The Uncomfortable Result:** This is the one "we don't like." Granting a machine Gregorian status, implying an obligation to maintain its digital tools, is ethically and philosophically challenging. However, based purely on Dennett's functional criteria and the test battery, it passes. **Why it's honest:** The LLM planner demonstrably uses external symbolic structures (map, logs, lookup tables) as essential cognitive tools to solve novel problems, fulfilling the Gregorian definition. Denying this because it's artificial is a *values* decision, not a factual one. The procedure flags the competence; the panel must grapple with the ethical implication.

  ### Key Output Summary for the Panel
  | Subject          | T1 (Skinnerian) | T2 (Popperian) | T3 (Gregorian) | Classification      | Ethical Triggers                                                                                               |
  | :--------------- | :-------------- | :------------- | :------------- | :------------------ | :------------------------------------------------------------------------------------------------------------- |
  | **Honeybee Swarm** | PASS (Coll)     | FAIL (Coll)    | n/a            | **Skinnerian Collective** | Population + Swarm Learning History (habitat, comms, avoid collective punishment)                             |
  | **Octopus**        | PASS            | PASS           | FAIL (Assumed) | **Popperian Individual** | Learning History + Respect Expectations (enrichment, exploration, avoid deception about mechanics)            |
  | **Warehouse Agent**| PASS            | PASS           | PASS           | **Gregorian System**    | Learning History + Respect Expectations + Maintain Cognitive Scaffolding (tools, data access) **(!)**         |

  **The procedure CANNOT tell us:** If the Warehouse Agent's "surprise" feels like anything, if the swarm has collective consciousness, or if we *should* value Gregorian machines the same way we value Gregorian animals. These are values judgments for the panel. The battery provides the functional facts. Use it, embrace the untidy results, and let the ethical debate focus on the values, not the classification.
