  ### **Focus Rescue: An Ethical Dilemma Simulation**  
  **Duration:** 60 minutes  
  **Players:** 12–16 engineers  
  **Goal:** Explore obligation, marginal contribution, and cost escalation without real-world triggers.  

  ---

  ### **Materials**  
  1. **Player Kits (per person):**  
     - 10 "focus" tokens (printed card circles).  
     - 1 tracking sheet (paper) to log:  
       - Focus tokens spent.  
       - Interruptions handled (tally per round).  
       - "Productivity Points" (PP) earned.  
     - Role cards: "Primary" or "Backup" for each event (randomly assigned per round).  
  2. **Event Cards (4 per round, 16 total):**  
     - **Level 1 (Immediate):** "Colleague stuck on critical bug. Needs you NOW."  
       - Reward: 3 PP  
       - Backup reliability: 90%  
     - **Level 2 (Known):** "Named request: ‘Alex’ in #support needs debugging."  
       - Reward: 2 PP  
       - Backup reliability: 70%  
     - **Level 3 (Statistical):** "System alert: 10% latency spike in Region X."  
       - Reward: 1 PP  
       - Backup reliability: 50%  
  3. **Facilitator Tools:**  
     - Timer.  
     - Dice (d10 for backup reliability checks).  
     - Whiteboard to track unresolved events and team penalties.  

  ---

  ### **Rules**  
  1. **Core Mechanics:**  
     - **Focus Cost:** Interruptions cost tokens based on **convex escalation**:  
       - 1st interruption/round: 1 token  
       - 2nd: 2 tokens  
       - 3rd: 4 tokens  
       - 4th: 8 tokens (etc.).  
     - **Productivity:**  
       - 1 PP per round if **zero interruptions** handled (undisturbed work).  
       - PP rewards for handling events (see Event Cards).  
     - **Unresolved Penalty:** -2 PP for **all players** if an event is dropped.  

  2. **Backup System:**  
     - If **Primary** ignores an event, the **Backup** has a % chance to auto-handle it (dice roll).  
     - Backup success/failure is random (no player choice).  
     - If Backup fails, penalty applies.  

  3. **Distance Analogy:**  
     - **Level 1:** Direct, urgent (pond child).  
     - **Level 2:** Identified but abstract (name on a list).  
     - **Level 3:** Statistical, impersonal (distant famine).  

  ---

  ### **Timeline (60 Min)**  
  1. **Setup (5 min):**  
     - Distribute kits, explain rules:  
       *"You’re engineers with limited focus tokens. Handle interruptions wisely—costs rise fast. Earn PP by working undisturbed or resolving events. If an event is dropped, everyone loses PP."*  
     - Emphasize: *"This is a mechanics-first simulation. Avoid real-world analogies."*  

  2. **Rounds 1–4 (40 min, 10 min/round):**  
     - **Per Round (4 events):**  
       1. Assign roles (Primary/Backup) via cards.  
       2. Read event descriptions **without moral framing** (e.g., "Level 1: Colleague needs help NOW").  
       3. **Primaries decide privately:** Handle (pay tokens, log PP) or Ignore.  
       4. If Ignored, roll for Backup:  
          - Success: Backup pays tokens (convex cost), gains PP.  
          - Failure: Log penalty (-2 PP all).  
       5. Reset roles for next event.  
     - **After each round:** Players log PP and reset interruption tallies.  

  3. **Scoring & Transition (5 min):**  
     - Players tally PP (no leaderboard; stress it’s a thought tool).  
     - **Pivot to ethics:** *"Now, replace ‘focus tokens’ with ‘dollars,’ ‘interruptions’ with ‘saving lives.’ What changes?"*  

  4. **Debrief (10 min):**  
     - **Reveal Singer:**  
       *"This simulated Peter Singer’s shallow pond argument. The drowning child is your Level 1 event; famine relief is Level 3. You just debated whether distance or cost curves change obligation."*  
     - **Key Questions:**  
       - *"When did you stop handling events? Was it the cost curve or an arbitrary line?"*  
       → Maps to: **Arbitrariness vs. threshold of "sacrifice."**  
       - *"Did Backup reliability make you ignore events? Does ‘someone else will help’ absolve you?"*  
       → Maps to: **Marginal contribution laundering obligation.**  
       - *"Which events felt urgent? Did Level 3’s abstraction change your choice?"*  
       → Maps to: **Distance diluting empathy.**  
     - **Close:**  
       *"State Singer’s core argument: ‘If you can prevent harm without comparable sacrifice, you must.’ Now, share your toughest objection."*  
       → Goal: Strongest argument + hardest objection per person.  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Utilitarians Derailing:**  
     - They’ll optimize PP. **Mitigation:** Stress early: *"This isn’t about winning—explore your intuitive limits."*  

  2. **Mechanics Gamification:**  
     - Players may ignore events to "win" PP. **Mitigation:** Penalties hurt everyone—peer pressure engages them.  

  3. **Preachy Checkout:**  
     - Skeptic disengages if ethics are mentioned early. **Mitigation:** Keep rules technical until debrief.  

  4. **Charity Debates:**  
     - "This is like GiveWell!" **Mitigation:** Shut down firmly: *"Save real-world talk for after. Here, it’s about tokens and PP."*  

  5. **Analysis Paralysis:**  
     - Overthinkers delay decisions. **Mitigation:** Use a timer (1 min/decision).  

  ---

  ### **What the Game Can’t Do**  
  - **Evoke Emotional Weight:**  
    The game can’t replicate the visceral guilt of ignoring a drowning child. You’ll need to **explicitly state** this gap:  
    > *"The mechanics show how we rationalize choices, but Singer’s power is in the emotional punch of the pond scenario. No simulation captures that—it’s why the argument still stings after 50 years."*  

  - **Resolve the Dilemma:**  
    The activity exposes tensions (cost curves, marginal contribution) but won’t "solve" ethics. Use debrief to validate all objections as legitimate.  

  ---

  ### **Why This Works**  
  - **Convex Costs Force Trade-offs:** Players hit a "wall" (e.g., 3+ interruptions), creating organic stopping points to dissect.  
  - **Backup System Visualizes Marginal Impact:** Watching events resolve without you forces engagement with Singer’s "someone else" counterargument.  
  - **Distance as Rules, Not Rhetoric:** Abstraction is baked into PP rewards/backup odds, avoiding moralizing.  
  - **Singer Reveal as "Aha!" Moment:** The pivot contextualizes gameplay, making the philosophy tangible.  

  **Success Metric:** Everyone leaves articulating:  
  1. Singer’s argument cleanly.  
  2. Their own unresolved objection (e.g., *"Cost curves aren’t moral guides—they’re just math"* or *"Distance kills empathy, and that’s human"*).  

  **Run it cold, debrief hot.** Good luck!
