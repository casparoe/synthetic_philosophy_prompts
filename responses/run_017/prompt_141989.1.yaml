    - A convex cost for interruptions (first is cheap, third in a short time is very expensive)
    - A "backup responder" mechanic to simulate the "someone else would have done it" argument
    - A way to represent distance (immediate, name on a list, statistic) as a rule feature

   The activity should be structured as a game with rules, materials (printable/index cards), and a scoring system without real stakes.

   Goals:
    1. Participants build the escalation from saving a nearby child to distant strangers themselves.
    2. At the end, reveal that this was about Singer's argument and the pond case.
    3. Debrief to map game moments to the ethical argument.

   Success: Everyone leaves able to state the strongest version of the argument and their single hardest-to-shake objection.

