      - Level 2 (Known): A named request in a team channel (you know the person and the issue, but not immediate).
      - Level 3 (Statistical): An automated alert about a system issue (no personal connection, just a problem to fix).

   Each event has a "backup responder" (another player) who, if not interrupted by the primary, has a chance to handle it (but not 100%).

   The cost of an interruption is convex: 
      - First interruption in an hour: 1 focus token.
      - Second: 2 tokens.
      - Third: 4 tokens.
