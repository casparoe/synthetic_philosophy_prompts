prompt: |-
  I serve on a university committee that reviews proposals for research involving human tissue. Last month the committee was enlarged from seven to nineteen members and we moved from a consensus requirement to a simple majority, and the member who pushed both changes defended them with an analogy: majority voting, he said, is just repeated measurement of the same quantity — each voter is one noisy instrument reading of the true answer, the noise is independent, the errors cancel, so a committee of nineteen stands to a committee of seven as nineteen measurements stand to seven. His conclusion was that we should always want more members and need not trouble ourselves much over how they are chosen.

  I am not persuaded, but I cannot yet say precisely where the picture fails, and I owe the committee a short written response before our next meeting. Please audit the analogy for me. Give the correspondence table — what plays the role of the instrument, the true value, the error, the repetitions, the calibration — and then the disanalogies, sorted by whether they actually matter for his conclusion. Two worry me most. First, a vote is a one-bit summary of a judgment, whereas a measurement reports a magnitude: does that quantization cost anything the analogy needs? Second, our members all read the same dossier and hear the same discussion, so their errors are not independent in the way coin flips are — yet I have heard it claimed that sharing evidence is harmless provided the residual errors are independent given the truth, and I want to know which of those is right and why. I would also like the distinction, if there is one, between a large committee's being very likely to be right and any particular addition's making it more likely to be right, and between adding a member who is barely better than chance and adding an expert. Nearly every decision we take is yes-or-no, so set aside the multi-option case unless the analogy quietly depends on it.

  Close by telling me what survives: does his practical conclusion hold, does it hold only under conditions we could actually impose on ourselves, and what, if anything, does the analogy still tell us about how the vote ought to be run? Please answer in American English.
reasoning: |-
  Okay, the user serves on a university committee that reviews human tissue research proposals. Recently, the committee expanded from seven to nineteen members and switched from consensus to majority voting. A member justified these changes with an analogy: each voter is like a noisy instrument measuring the "true answer," and more voters mean better error cancellation, similar to taking more measurements. The user isn't convinced and wants a detailed audit of this analogy before responding to the committee.

  First, I need to break down the analogy into its components. The member compares voters to instruments, the true decision to the measured quantity, and individual judgments to noisy readings. The idea is that independent errors cancel out with more voters, leading to better accuracy. But I know there are flaws here, especially with the independence and quantization issues the user mentioned.

  The user has two main concerns. First, votes are binary (yes/no), while measurements are continuous. Quantization might lose information, making each vote less informative than a measurement. Second, committee members share evidence and discuss, so their errors aren't independent. The user also mentioned claims that shared evidence is harmless if residual errors are independent given the truth. I need to explain why that's not necessarily true here.

  I recall Condorcet's Jury Theorem, which shows that with competent, independent voters, majority voting improves with size. But the theorem assumes each member has the same competence (probability >0.5 of being correct) and independence. In reality, committee members might have varying expertise, and discussions can create correlated errors. Shared evidence might align their thinking, reducing independence. Even if errors are independent conditional on the truth, in practice, pre-discussion biases could correlate, violating the theorem's assumptions.

  The user also asked about adding barely better than chance members versus experts. Adding a member who's only slightly better than random might help a little, but if they're worse than chance, it could hurt. Experts significantly boost accuracy. However, with correlated errors, adding more members might not help much if they all think alike. Diversity matters more than size in such cases.

  The practical conclusion: more members aren't always better. Without independence and competence, scaling up might not help or could even worsen decisions. The committee should focus on selecting diverse, competent members rather than just adding more. Also, the voting system matters; consensus might be better if proposals are complex and risks are high, even if it's less efficient.

  I should structure the response with a correspondence table, then disanalogies, and what survives. Highlight that the analogy fails on quantization and independence, which are critical. Emphasize that while the analogy is appealing, real committees need to ensure member quality and diversity over quantity. Also, discuss the conditions under which majority voting with more members works and when it doesn't, addressing the user's specific concerns about shared evidence and member selection.
answer: |-
  Below is a clear audit of the committee member's analogy, addressing your concerns and evaluating its practical implications. The response is structured for direct use in your committee communication.

  ---

  ### **Correspondence Table: The Measurement Analogy**
  | **Component**          | **In Measurement Context**         | **In Voting Context**                     |
  |------------------------|------------------------------------|-------------------------------------------|
  | **Instrument**         | Physical sensor (e.g., thermometer)| Individual committee member               |
  | **True Value**         | Physical quantity (e.g., temperature)| "Ground truth" of proposal's suitability |
  | **Measurement**        | Continuous reading (e.g., 25.3°C) | Binary vote (Yes/No)                      |
  | **Error**              | Random noise in reading            | Individual judgment error                 |
  | **Repetitions**        | Multiple independent measurements  | Multiple independent votes                |
  | **Calibration**        | Adjusting instrument accuracy      | Training/selecting competent members      |

  ### **Key Disanalogies & Their Impact on the Conclusion**
  **Sorted by significance to the member's conclusion** ("more members always improve accuracy, selection irrelevant"):

  1.  **Quantization (Binary Votes vs. Continuous Measurements)**  
      - **Disanalogy:** Votes are one-bit decisions (Yes/No), while measurements are continuous. This discards information about *confidence* or *degree* of suitability.  
      - **Why it Matters:**  
        - **Cost:** Quantization loses efficiency. A continuous measurement provides more information per "vote." In committees, a member 99% sure a proposal is bad has the same voting power as one 51% sure.  
        - **Impact on Conclusion:** Significant. Adding members is less effective per capita than adding measurements. A large committee *needs* competent members to offset quantization loss. **Undermines the "always want more" claim.**

  2.  **Non-Independence of Errors**  
      - **Disanalogy:** Members share evidence and deliberate, creating correlated errors (e.g., groupthink, shared misinterpretations). Errors are not like independent coin flips.  
      - **Does "residual independence given truth" suffice?**  
        - Theoretically, **yes** – if errors are *conditionally independent* given the truth (i.e., after seeing evidence, mistakes are uncorrelated), Condorcet’s Jury Theorem (CJT) holds.  
        - Practically, **no** – shared evidence/discussion often creates *unconditional* correlation (e.g., all misweighting the same dossier flaw). Real committees rarely satisfy conditional independence.  
      - **Impact on Conclusion:** Critical. Correlated errors diminish—or even reverse—the benefit of more members. 19 correlated voters may perform no better (or worse) than 7 independent ones. **Directly refutes the analogy's core mechanism (error cancellation).**

  3.  **Heterogeneous Competence**  
      - **Disanalogy:** Members vary in expertise (unlike identical instruments). Adding a novice (≈50% accuracy) helps far less than adding an expert (e.g., 80% accuracy).  
      - **Impact on Conclusion:** Major. Adding members "barely better than chance" (e.g., 51% accurate) minimally improves outcomes; adding an incompetent member (<50% accuracy) *reduces* accuracy. **"How they are chosen" is essential.**

  4.  **"True Value" Ambiguity**  
      - **Disanalogy:** Research ethics decisions involve subjective judgment (no objective "temperature"), unlike physical measurements.  
      - **Impact on Conclusion:** Moderate. While CJT assumes an objective truth, the theorem can extend to intersubjective agreement. However, it amplifies concerns about correlated biases.

  ### **Addressing Your Specific Queries**
  - **Likelihood of Correctness vs. Impact of Adding a Member:**  
    A large committee *can* be very likely correct *if* members are competent (>50% accuracy) and independent. However, **adding a member** only improves the odds if:  
    - Their individual accuracy >50%,  
    - Their errors are sufficiently uncorrelated with the group's.  
    Adding a member with <50% accuracy *lowers* the chance of a correct decision.

  - **Adding a Barely-Better-Than-Chance Member vs. an Expert:**  
    - **Barely better (e.g., 51% accuracy):** Marginally helpful in large committees (if independent), but negligible in small ones.  
    - **Expert (e.g., 80% accuracy):** Significantly improves accuracy regardless of committee size.  
    *Example:* A 7-member committee with 80% accurate members is more likely correct than a 19-member committee with 51% accurate members (assuming independence).

  ### **What Survives? Practical Conclusions**
  1. **The core conclusion does NOT hold unconditionally:**  
     - **More members ≠ reliably better decisions.** Benefits depend critically on:  
       - Member competence (each >50% accurate),  
       - Error independence (often undermined by shared evidence/discussion),  
       - Avoiding strongly incompetent members (<50% accuracy).  
     - **Member selection matters profoundly.** Adding experts helps; adding novices or biased members may hurt.

  2. **What the analogy still tells us (under strict conditions):**  
     - If members are **independently competent** (e.g., no discussion; diverse expertise; accuracy >50%), then majority voting with more members *does* improve decision accuracy (via CJT).  
     - In this ideal case, a 19-member committee *would* outperform a 7-member one.

  3. **Recommendations for the Committee:**  
     - **Prioritize quality over quantity:** Select members for diverse expertise and proven judgment.  
     - **Mitigate correlation:** Encourage independent preliminary assessments before discussion.  
     - **Retain safeguards:** For high-risk proposals, consider supermajority or consensus to offset quantization and correlation risks.  
     - **Audit performance:** Track if larger size correlates with better decisions or groupthink.

  ### **Summary for Your Response**
  > The measurement analogy fails critically on two points: (1) binary votes discard confidence information (making each "measurement" less efficient), and (2) shared evidence correlates errors, preventing the assumed error cancellation. Consequently, adding members only helps if they are competent and their judgments are sufficiently independent. The committee should focus on selecting experts with diverse viewpoints, not merely expanding. While a large, diverse, independent committee *can* outperform a smaller one, our current structure (shared dossier/discussion) likely undermines these benefits. I recommend we prioritize member expertise and implement pre-discussion independent reviews to partially salvage the analogy's insights.

  ---

  This provides a rigorous yet concise rebuttal grounded in statistical theory (Condorcet’s Jury Theorem), directly addressing your concerns while offering actionable steps for the committee.
