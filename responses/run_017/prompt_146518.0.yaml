  Based on your precedents and committee constraints, here's a structured options analysis for the docket item:

  **I. Decision Rules Synthesized from Precedents**  
  *(With noted strains)*  

  | Rule                                        | Source Precedents          | Strain Point                          |
  |---------------------------------------------|----------------------------|---------------------------------------|
  | A: Permanent transfer **only** if force/fraud/duress **proven at acquisition** (not structural) | 1, 2, 3, 5, 7 | Precedent 3 (assumed duress from record gap) |
  | B: Conservation/political risks may **defer/downscale** transfer but not negate if other criteria met | 6, 7 | Precedent 1 (unconditional despite risks) |
  | C: **Non-display requirements** do not inherently block transfer if claimant legitimacy established | 4 (by analogy) | Precedent 5 (display value prioritized) |

  **II. Application to New Case**  

  | Rule | Transfer? | To Which Claimant? | Conditions |
  |------|-----------|---------------------|------------|
  | **A** | **No permanent transfer** (No proof of force/fraud/duress *at sale*: Auction was public, price market-rate, threat withdrawn pre-sale) | N/A | Long-term loan possible (cf. Precedent 2) |
  | **B** | **Conditional transfer possible** to ritual claimant (if Rule A overruled) | Title-holder council (proven ceremonial need) | Conservation agreement + phased transfer (cf. Precedent 7) |
  | **C** | Transfer **denied** to ritual claimant | National Museum (if transfer occurs) | Display restrictions waived (cf. Precedent 5) |

  **III. Precedent Alignment**  
  - **Closest Analog**: Precedent 5 (market sale, no duress proven → no transfer)  
  - **Strongest Contrast**: Precedent 3 (inferential duress from record gap → transfer)  
    *Key distinction: Here we have auction documentation showing routine transaction.*  

  **IV. Committee Prediction vs. Consistency**  
  - **Predicted Outcome**: No permanent transfer. *Probable compromise*: Long-term renewable loan to National Museum with digital access for ritual community (sidestepping display conflict).  
  - **Consistent Outcome**: Permanent transfer to title-holder council with conservation partnership. *But only if* committee reinterprets "duress" to include systemic coercion (tax threat + arms purchase need).  

  **V. Where Precedents Run Out**  
  **The Hinge**: Whether political coercion creating *economic necessity* constitutes "duress" under your mandate.  
  - Precedent 5 explicitly rejected this ("inequality ≠ duress")  
  - Precedent 3 ambiguously implied it via "circumstances"  

  **VI. Ancestral Remains Precedent (4)**  
  **Limited relevance**: It establishes that *sacred/communal objects* may warrant exceptional treatment, but:  
  - Operated under separate policy  
  - Did not require proof of illicit acquisition  
  - *Useful framing*: Reinforces that ritual necessity (here: enthronement requirement) could elevate moral claim over legalist reading.  

  **VII. Complications Assessment**  
  - **Changes analysis**: The 1970s conservation damage. Creates ethical obligation to title-holders regardless of acquisition merits (cf. Precedent 7's "known risk" avoidance).  
  - **Distraction**: Neighboring polity's crown claim. Insufficient evidence (oral history vs. documented possession); deferrable under Precedent 6 logic.  

  **VIII. Test Case to Split Rules**  
  Propose adding: *"Objects sold under direct threat of deposition if taxes unpaid, with colonial officer's receipt specifying coercion."*  
  - Tests Rule A's boundaries: Does explicit extortion = "duress"?  
  - Forces committee to define if economic coercion voids "lawful" sale.  

  **IX. Anti-Structural-Duress Argument (Per Request)**  
  > "The committee's mandate requires proof of *specific illicit conduct* in acquisition (force/fraud/duress), not systemic critique. The 1912 auction was lawful per colonial norms, with market-price payment and withdrawn deposition threats. To infer duress from unequal bargaining power (Precedent 5) or political context alone would violate our case-by-case principle, functionally enacting restitution by catalogue. Transfer here would destabilize collections law by replacing evidence with ideology."  

  **Recommended Options Paper Structure**  
  1. **Summary of Claims** (National Museum vs. Title-Holder Council)  
  2. **Key Questions**:  
     - Acquisition illicit under bylaws?  
     - If transfer warranted, to whom?  
     - Conservation/display conflicts resolvable?  
  3. **Precedents Analysis** (As above)  
  4. **Options**:  
     - A. *No transfer* (Aligns Precedents 2,5; Loan to National Museum)  
     - B. *Transfer to Title-Holders* (Requires reinterpreting "duress"; Shared stewardship)  
     - C. *Defer for claimant mediation* (Precedent 6 model)  
  5. **Risk Assessment**:  
     - Option B risks violating display/conservation policies  
     - Option A risks reputational harm given ritual significance  
  6. **Recommendation**: Option A (with enhanced community access provisions)  

  This maintains neutrality while exposing the critical hinge: whether the tax revolt context transforms a documented market transaction into systemic duress—a question your precedents leave authentically open. The conservation damage tilts ethical (not legal) weight toward the ritual claimants, but Precedent 5 provides cover against this.
