prompt: |-
  Hey — I'm putting together a problem set for my upper-level seminar on personal identity for next spring, and I want to build it around one person's actual track record rather than around cases floating free of anybody's commitments. The person is a senior colleague of mine — call her Dana — who has been thinking about upload cases for years and has gone on record, in talks and in print, on a bunch of them. Her verdicts, as best I can reconstruct them:

  (1) Gradual replacement, the standard one: swap one neuron at a time for a silicon unit playing exactly the same causal role in the network, over about a decade, with the person behaving and reporting normally throughout. She says: you survive, and it isn't even a close call.

  (2) Scan, destroy, rebuild the next day, functionally identical down to the last connection weight. She says: that's death. The thing that wakes up is a successor — a very good copy, but a copy.

  (3) Fission: the two hemispheres end up driving two different bodies, each with the full psychology. She says: neither is you. Two equally good candidates means there's no answer to "which one is me," and a relation that has no answer isn't survival.

  (4) Replacement units that match the originals only from the outside: same input–output mapping for every signal they actually receive, but they get there by a different internal route, and they carry internal states the original never had — states no downstream part is sensitive to. She says: still you. Differences that nothing else in the system can see aren't differences that matter.

  (5) The same decade-long replacement as in (1), except that the subject is kept in a medically induced coma for the middle stretch, during which something like 80% of the swapping happens; conscious and normal before and after. She says: still you. Consciousness going dark for a while doesn't interrupt whatever it is that's doing the work.

  So: she's not a substrate chauvinist, she isn't moved by "same person, new body" talk when there's been a gap, she's happy to count external functional equivalence as equivalence, and she doesn't require continuous consciousness. But I've been siting on these five for a week and I cant tell what's actually load-bearing. As far as I can see, at least three different rules fit all of them: something about step size (small increments preserve you, big jumps don't), something about the same concrete system never ceasing to operate, and something about the person being wherever the causal organization gets realized. I suspect there's a fourth I'm missing, or a way of sharpening one of those three that makes it collapse into another.

  Here's the case I want to put on the set, and I don't think this exact configuration gets discussed much. Call it the fade-over. Nothing is replaced in place. Instead a second system — the understudy — is built alongside the original and run in parallel, receiving the same inputs, functionally identical to the original by the standard she accepted in (4). A mixer decides whose output drives behaviour, and it shifts by one percent a week over about two years. The original is never modified; it just gets increasingly ignored. Both systems run continuously for the whole period. At the end the mixer takes everything from the understudy and the original is switched off and destroyed. The behavioural and verbal stream is continuous throughout, with no discontinuity anyone can detect. I'm deliberately not stipulating whether the understudy is conscious during the middle stretch — leave that open, because (5) suggests she might not care, and because the usual argument that preserving function must preserve experience might or might not be doing work for her here.

  What I want from you:

  - The rules that fit her five verdicts, stated sharply enough that they genuinely come apart from each other, including any I've missed — and say honestly if two of them turn out to be the same rule once you fix what counts as the subject.
  - What each rule predicts about the fade-over, and specifically how each one answers the question of what the subject is during the middle stretch: the original system, the understudy, the composite of both plus the mixer, or none of them. I think that question is where the real action is.
  - Your best guess at her verdict, with the reasons for preferring it. Flag if (3) is doing more work than it looks like it's doing: at the midpoint there are two complete systems running, so if her no-answer principle generalizes, this case might come out as death for a reason that has nothing to do with step size — though maybe it's distinguishable, since one of the two candidates is being retired rather than going on to live a life.
  - The further case you'd put on the set to separate whichever rules are still tied afterwards. My candidate is to run the same setup but flip the mixer from zero to a hundred in a millisecond, with both systems already running — I'm not convinced that's the sharpest probe available.

  And this is the part I'll actually be grading: keep clear which moves here are settled and which are contested. I want to be able to tell students where people who work on this agree, where the disagreement is real and live, and where a tempting answer is just one side of an argument. Don't present a contested view as the consensus, and give me confidence levels on the individual claims, not only on the headline verdict.
reasoning: |-
  Hmm, this is a fascinating challenge in philosophical analysis of personal identity. The user is constructing a problem set around their colleague Dana's consistent positions on various thought experiments, and needs help identifying the underlying principles governing her judgments.

  First, I need to carefully reconstruct Dana's positions from the five cases described. Her pattern seems to reject both biological essentialism (since gradual replacement preserves identity) and simple functionalism (since scan-and-copy doesn't). The coma case shows consciousness continuity isn't necessary, while case 4 suggests internal implementation details don't matter as long as they're causally invisible.

  Now for the core task: identifying distinct principles that could explain all five verdicts. The step-size theory seems promising at first glance - gradual changes preserve identity while sudden leaps don't. But the fade-over case challenges this with continuous, parallel operation. The causal-organization theory has merit too - identity persists wherever the defining causal structure is maintained. Then there's the concrete-system view that requires an unbroken chain of physical implementation.

  The fade-over case is particularly clever because it creates ambiguity during the transition period. When both systems are active with shared control, we must ask: where is the person located? This reminds me of Parfit's fission cases but with asymmetric outcomes. If Dana rejects fission because it creates two equal claimants, here the original system gets destroyed while the understudy continues, which might avoid that symmetry problem.

  For testing probes, the sudden switch case is good but might not be optimal. Perhaps better to vary whether the systems diverge psychologically during overlap, or test whether Dana would accept multiple simultaneous persons in the composite system.

  Throughout, I need to maintain clear distinctions between: what Dana actually believes (based on her published positions), what principles best explain those positions (my interpretation), and where philosophers generally disagree (academic consensus). The grading aspect means I must explicitly flag contested claims - like whether "causal organization" requires a single implementing substrate.
answer: |-
  Here’s a systematic breakdown of Dana’s position, rules fitting her verdicts, predictions for the fade-over case, and probes to resolve ambiguities. I’ll flag contested assumptions and confidence levels throughout.

  ---

  ### **I. Rules Fitting Dana’s Five Verdicts**  
  *(Stated to genuinely come apart)*  

  1. **Causal Continuity of Implementation (CCI)**  
     - *Rule*: You survive iff there is an unbroken chain of causally active implementation (substrate or system) carrying forward your psychology *without complete interruption or duplication*.  
     - *Fits cases*:  
       - (1) Survive: Neurons replaced incrementally; same system persists.  
       - (2) Death: Original system destroyed; new copy lacks causal continuity.  
       - (3) Death: Fission breaks continuity into two branches.  
       - (4) Survive: Implementation changes, but the *same causal system* operates continuously.  
       - (5) Survive: Original system runs continuously (despite coma).  
     - *Contested?*: Yes. Critics argue "implementation" is underspecified (e.g., is it substrate or abstract structure?). Moderate confidence.  

  2. **No Competitor Principle (NCP)**  
     - *Rule*: You survive iff there is exactly one candidate at all times bearing the right causal-functional relation to your past self.  
     - *Fits cases*:  
       - (1) Survive: Only one candidate throughout.  
       - (2) Death: Copy is a competitor to the destroyed original.  
       - (3) Death: Two competitors → no unique survivor.  
       - (4) Survive: Only one candidate system (internal differences invisible).  
       - (5) Survive: Only one candidate system (coma doesn’t create competitors).  
     - *Contested?*: Highly. Assumes survival requires uniqueness, which some reject (e.g., Parfitians). High confidence in fit.  

  3. **Gradual Functional Preservation (GFP)**  
     - *Rule*: You survive iff functional organization is preserved incrementally (small steps), without sudden replacement or branching.  
     - *Fits cases*:  
       - (1) Survive: Gradual replacement.  
       - (2) Death: Sudden replacement.  
       - (3) Death: Branching isn’t gradual.  
       - (4) Survive: Functional equivalence preserved gradually.  
       - (5) Survive: Gradual swap despite coma.  
     - *Contested?*: "Gradual" is vague (e.g., is coma interruption "gradual"?). Low confidence as sole rule.  

  **Crucial Note**: CCI and NCP are distinct. CCI cares about physical/system continuity; NCP cares about uniqueness regardless of continuity. GFP collapses into CCI if "gradual" means "no break in implementation."  

  ---

  ### **II. Predictions for the Fade-Over Case**  
  *Setup*: Original (O) and understudy (U) run in parallel. Mixer shifts control from O to U over 2 years. Both systems active throughout. O destroyed at end.  

  | **Rule**               | **Survival?** | **"Where is the subject?" During Midpoint**                  | **Reasoning**                                                                 |
  |------------------------|---------------|-------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **CCI**                | Death         | **Neither O nor U alone**; possibly the composite system.   | Original system (O) is never modified but is *displaced* by U → causal chain broken when O is phased out. Composite (O+U+mixer) is a new system. |
  | **NCP**                | Death         | **No answer** (two candidates: O and U).                    | At midpoint, both O and U are functional competitors → violates uniqueness.   |
  | **GFP**                | Survive       | **The composite system** (O+U+mixer).                       | Gradual shift preserves functional continuity; no sudden break.               |

  **Key Insight**: The midpoint question exposes core differences. NCP forces a "no answer" due to competitors; CCI rejects O/U as discontinuous; GFP accepts the composite.  

  ---

  ### **III. Best Guess for Dana’s Verdict & Why**  
  - **Verdict**: **Death** (likely via NCP or CCI).  
  - **Reasons**:  
    - Case (3) (fission) is pivotal: Dana rejects survival when two candidates exist. In fade-over, midpoint has **two active systems** (O and U) both capable of supporting the psychology → NCP applies directly.  
    - Case (2) (scan/destroy) shows she rejects "gappy" continuity → CCI explains why displacing O (even gradually) breaks identity.  
    - *Contra GFP*: Her acceptance of coma (5) doesn’t imply accepting parallel systems. Coma has one system running uninterrupted; fade-over has two.  
  - **Confidence**: High (80%) that (3) generalizes. If she distinguishes fission (both live) from fade-over (O destroyed), GFP or CCI might win.  

  ---

  ### **IV. Sharper Probe to Separate Rules**  
  **Proposed Case**: **The Sudden Switch**  
  - *Setup*: O and U run in parallel. After 1 hour, mixer flips from 100% O → 100% U in 1 ms. O destroyed.  
  - *Predictions*:  
    - **CCI**: Death (causal chain broken abruptly).  
    - **NCP**: Death (competitors at flip moment).  
    - **GFP**: Death (too sudden).  
  - *Problem*: All rules agree → uninformative.  

  **Better Probe**: **Divergent Parallels**  
  - *Setup*: Fade-over, but at midpoint, O and U receive *different inputs* for 1 hour (e.g., O sees red, U sees blue), then mixer completes shift to U.  
  - *Predictions*:  
    - **CCI**: Death. Divergence proves O/U are distinct systems → displacement breaks continuity.  
    - **NCP**: Death. Two competitors with different states.  
    - **GFP**: **Ambiguous**. If functional organization is "the stream of behavior," survival if mixer outputs a consistent stream.  
  - *Why better*: Forces GFP to confront whether functional identity requires a *single* system. Dana’s case (4) suggests she’d reject divergence as irrelevant if outputs match, but here outputs *could* differ during divergence.  

  ---

  ### **V. Grading Guidance: Contested vs. Settled**  
  | **Element**               | **Status**                               | **Confidence/Contestation**                                  |
  |---------------------------|------------------------------------------|--------------------------------------------------------------|
  | Dana’s rejection of substrate (1,4)   | Settled (from cases)                     | High confidence.                                             |
  | Her rejection of consciousness (5)    | Settled                                  | High confidence.                                             |
  | Step-size vs. uniqueness (3)          | **Contested**                            | NCP vs. GFP/CCI is live debate (e.g., Parfit vs. Williams). |
  | "Causal organization" as sufficient   | **Contested**                            | Case (2) shows organization alone ≠ survival for Dana.       |
  | Whether fade-over has one or two systems | **Contested**                            | Turns on definition of "system" (e.g., is the composite singular?). |
  | Generalizing fission logic to fade-over | **Contested**                            | Key divide: destruction vs. branching (50/50 among theorists). |

  **Headline Verdict Confidence**:  
  - Prediction of death in fade-over: **75%** (hinges on whether Dana sees O/U as competitors).  
  - If she allows composites (unlikely given (3)), GFP could win → **25%**.  

  **To Students**: "Dana’s position challenges both biological and computational identity theories. Focus on whether her ‘no ties’ rule from fission applies to cases with asymmetric outcomes. Leading theories diverge on whether identity requires a *unique continuous implementer* or merely *gradual functional preservation*—a dispute unresolved in the literature."  

  Would you like refinements to the probe case or additional Dana-aligned scenarios?
