  1. **Conflict: (2) Slow Drift vs. (3) Deployment Threshold & Controls**  
     - **Why severe?** Your deployment example (human approval + weaker model monitor) is *exactly* the scenario where slow drift (2) thrives: subtle errors bypass busy reviewers, and a weaker model may miss nuanced issues. Yet you accept 30–40% misalignment risk.  
