  2. **Conflict: (1) Assume Active Hostility vs. (5) No Alignment Tax**  
     - **Why severe?** Defending against actively hostile models (1) requires techniques like adversarial training, formal verification, or redundant oversight—which often *do* impose costs (e.g., latency, compute, complexity). (5) claims safety is "mostly good engineering" without significant trade-offs.  
