prompt: |-
  I had a long argument with a friend last night about the vessel I help look after — a nineteenth-century wooden boat kept afloat by a small conservation trust, and therefore replaced in pieces, more or less continuously, for as long as anyone has been keeping records. The argument started as a quarrel about whether the trust may honestly describe what visitors walk around as the original vessel, and I came away convinced that our disagreement was not about boats, and not even really about the old puzzle of the ship whose timbers are replaced one at a time. It was about something I don't have a word for. Here is the pattern I kept noticing. If our boat's timbers are replaced one by one and the discarded ones are simply burned, nobody in the room hesitates: it is the same boat, and my friend agreed. But if the discarded timbers are stacked in a shed and a shipwright later reassembles them into a second boat, a surprising number of people — my friend among them — start saying that the reassembled one is the original, or at least that the boat we have been sailing has had its claim weakened. Nothing about the boat we sailed is different in the two stories; the entire difference lies in what happened, later, to stuff that had already left it. And yet the effect is oddly specific. If the old timbers are fed one at a time into the upkeep of some other working boat, so that after thirty years that other boat contains most of the original timber and ours contains none of it while both have stayed in continuous service, nobody at all — not even my friend — wants to say the two boats have traded identities. And if the timbers in the shed are reassembled into a barge, or into the roof of a boathouse, the pull largely disappears, though it partly survives if the reassembly is only finished after our boat has finally been lost.

  So my question: is there an established concept for the fact that whether a thing persists seems to depend on what becomes of the matter that has left it, and specifically on whether that matter is later collected back into something presenting itself as a candidate of the same kind, and on when that happens? My friend offered three deflations and none of them satisfied me. He said it is just the old ship-replacement puzzle, about which there are two standard philosophical answers — one on which a thing is stretched out through time the way a road is stretched out through space, and one on which the timber assembly and the boat are two different things sitting in the same place — and that I have merely found a version neither answer was designed for. He said it is just vagueness, there being no exact number of replaced planks at which the boat stops being the same boat. And he said it shows only that our talk of sameness is really talk of something that comes in degrees. The vagueness diagnosis is the one I most want tested, because the judgments I described are not tracking quantities or borderline quantities at all: they flip while the quantity is held fixed, and they flip non-monotonically, coming back when the shed is emptied into a barge.

  A bare label would not help me, so please do the carving rather than the naming. Is what I have described one phenomenon or two — a competition effect, where a thing's hold on its identity is settled by comparison with rival candidates rather than by its own history, and a separate recollection effect, where the mere re-gathering of shed matter into a thing of the right kind does the work? How would each be distinguished from the standard two answers my friend gave, from ordinary vagueness, and from the plain claim that sameness is a matter of degree? And where are the edges? Does the effect survive if the reassembly is staged so that every discarded timber becomes part of some boat the instant it is removed, with no interval in which it is merely stacked? Does it survive if the timbers are copied rather than reused, so that the material is new but the arrangement is inherited? Does a later reassembly make it have been false, earlier, that our boat was the same boat, or does it only make us revise a claim that was true when we made it? If the answer is that nothing established fits, say so, give the thing a name I can use, define it tightly enough that the boundary cases above come out on one side or the other, and say what would fall outside it.
reasoning: |-
  Okay, let's tackle this fascinating problem about the wooden boat and identity persistence. The user had a heated argument with a friend about whether their conservation boat remains "original" after piecemeal replacements. The key insight is that people's judgments change dramatically based on what happens to the discarded timbers—especially if they're reassembled into another boat later. 

  First, I need to unpack why the friend's three deflations don't work. The "standard philosophical answers" (endurantism vs. perdurantism) don't capture this because they focus on the object itself, not external factors like timber reassembly. The "vagueness" argument fails too—the user explicitly notes judgments flip suddenly when timbers are reused as a boat, even if replacement rates are identical. And "degrees of sameness" doesn't explain why identity claims weaken only when a rival candidate emerges. 

  Hmm... the core phenomenon seems to be that identity isn't just about an object's continuous existence, but about *whether competing claimants exist later*. That's why burning timbers causes no issue (no rival), while reassembling them creates a competitor. Interesting how this "rival effect" vanishes if the reassembled timbers become a barge instead—suggesting the competitor must be *of the same kind*. 

  The user also hints at a "recollection effect" (mere reassembly weakening identity even without rivalry), but I think that collapses into the competition model—after all, if timbers become a roof, there's no same-kind rival. The "when" matters too: if reassembly happens after the original boat sinks, the effect weakens because the rival emerges posthumously. 

  For boundary cases: 
  - If removed timbers immediately become part of another boat (no shed interval), competition intensifies since rivals co-exist longer. 
  - If timbers are copied (same arrangement but new material), the effect likely persists because *form* is what makes something a "boat candidate." 
  - Crucially, reassembly doesn't retroactively falsify past identity claims—it just creates ambiguity *from that point onward*. 

  Philosophically, this feels closest to "sortal-dependent identity" (where "boat" defines what persistence requires) plus a social component: we anchor identity to the candidate that best maintains functional/cultural continuity. But no existing term captures the *rival-sensitive* aspect. Maybe "competitive persistence" or "rivalrous identity"? 

  Defining it tightly: Identity persistence is vulnerable when matter removed from an object is later reconstituted into a functional equivalent of the same sort, creating competing claimants. Key boundaries: 
  - Requires same sort (boat→barge weakens effect). 
  - Rival must be functional, not just material. 
  - Revision only prospective, not retroactive. 

  ...And this excludes cases like gradual timber dispersion to other boats, where no single rival emerges. 

  Whew. User’s intuition was sharp—this *isn’t* about vagueness or degrees. It’s about narrative collision: two stories claiming "I am the original" when one body’s scraps become another’s whole.
answer: |-
  Your observation reveals a distinct phenomenon beyond standard philosophical puzzles or vagueness. Let's carve the concept by analyzing its components, testing boundary cases, and distinguishing it from existing frameworks.

  ### Core Phenomenon: Competitive Persistence
  **Definition**: Identity persistence is influenced by *retrospective candidate competition*—where the fate of discarded matter creates a rival entity of the same functional kind, undermining the original's claim through narrative disruption.  
  **Key Mechanisms**:  
  1. **Competition Effect**: Identity isn't solely intrinsic; it depends on whether discarded material later forms *a functional rival* of the same sort.  
  2. **Recollection Effect**: The reassembly of material into a same-kind object *recategorizes history*—it frames the original as a "donor" rather than a continuous entity.  

  These are two facets of one phenomenon: competition requires recollection (gathering + reanimation), but recollection only triggers competition when it creates a same-kind rival.  

  ### Boundary Testing & Edge Cases
  | Scenario                                  | Effect Present? | Why                                                                 |
  |-------------------------------------------|-----------------|---------------------------------------------------------------------|
  | Discarded timbers burned                  | No              | No rival candidate; continuity unchallenged.                        |
  | Timbers reassembled into a **boat**       | Yes             | Same-kind rival creates competing "original" narrative.             |
  | Timbers become part of **another boat**   | No              | Material dispersed; no *single* rival claimant emerges.             |
  | Timbers reassembled into a **barge**      | Weak/None       | Different kind; no rivalry with boat identity.                      |
  | Reassembly **after original lost**        | Partial         | Rival lacks contemporaneity; weakens but doesn't nullify claim.     |
  | **No shed interval** (instant reuse)      | **Stronger**    | Rival coexists longer; competition intensifies.                     |
  | **Copied timbers** (same arrangement)     | **Yes**         | *Formal* rivalry suffices; material newness doesn't prevent competition. |
  | **Retroactive truth revision?**           | **No**          | Past claims ("this is the original") remain true *when made*; future reassembly only alters *subsequent* judgments. |

  ### Distinguishing from Your Friend's Deflations
  1. **Ship-Replacement Puzzle (Metaphysics of Persistence)**:  
     - Standard answers (endurantism/perdurantism) focus on *intrinsic continuity*. Your case hinges on *extrinsic factors* (rival creation). Reassembly isn't about the boat's temporal parts but about *counterfactual claims* on identity.  

  2. **Vagueness**:  
     - Vagueness implies gradual ambiguity (e.g., "when does baldness start?"). Here, judgments flip *abruptly* based on discrete events (reassembly), not plank counts. Non-monotonicity (effect disappears with barges) violates vagueness.  

  3. **Degrees of Sameness**:  
     - While identity has gradations (e.g., sentimental value), your cases show *binary shifts* in "original" status when rivals appear. The boat isn't "less original"—it's *disputed* or *contextually demoted*.  

  ### Formal Definition & Boundaries
  **Label**: **Retrospective Identity Competition** (RIC)  
  **Criteria**:  
  1. **Material Dispersal**: Matter is removed from Entity A.  
  2. **Same-Kind Reassembly**: Discarded matter is later reconstituted into Entity B, functionally equivalent to A.  
  3. **Temporal Overlap**: B's existence overlaps or succeeds A's functional lifespan.  
  4. **Narrative Rivalry**: B's creation frames A's history as "interrupted" or "donated."  

  **Boundaries**:  
  - **Inside RIC**: Ship timbers → new ship; prosthetic limbs reassembled into a cyborg "original."  
  - **Outside RIC**:  
    - Timbers → compost (no same-kind candidate).  
    - Reassembly into non-rival (e.g., boat timbers → museum display).  
    - Gradual dispersion (no focused rival).  

  ### Why This is Novel
  RIC exposes identity as *relational* and *narrative-dependent*. It's not merely about an object's trajectory but about *which entity best "inherits" the historical mantle* when multiple candidates exist. This explains why:  
  - A reassembled barge isn't a rival (different narrative).  
  - Copying timbers works (formal replication challenges historical primacy).  
  - Truth isn't retroactive (claims are context-bound; reassembly changes future context, not past facts).  

  ### Conclusion
  Your intuition is correct: this isn't reducible to vagueness, degrees, or classic persistence theories. **Retrospective Identity Competition** is a distinct phenomenon where identity persistence depends on whether discarded matter later forms a same-kind rival, disrupting the original's narrative continuity. The effect strengthens with functional equivalence, temporal proximity, and reassembly precision—but never alters past truths, only future interpretations.  

  Use this framework to test new cases. For example: if DNA from a cloned sheep were reused to clone a "twin" years later, RIC predicts the original's uniqueness would diminish—not because of material overlap, but because rivalry reframes the story.
