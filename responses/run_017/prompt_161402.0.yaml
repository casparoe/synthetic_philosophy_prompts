answer: |-
  After carefully analyzing your thought experiments and the patterns in your verdicts, I propose the **Principle of Robust Correlation (PRC)** as the unifying framework. This principle resolves the tensions in your judgments by focusing on whether a correlation remains reliable under the optimization pressures present in the decision context. Optimization pressure refers to any force (e.g., adversarial selection, self-modification, or instrumental goals) that could distort the correlation between an observable variable (e.g., a surrogate, a counterpart's action) and your true goal.

  The core idea is: **A correlation is worth acting upon if and only if it is robust to all relevant optimization pressures in the decision context, including those induced by the act of relying on it.** "Robust" means the correlation is expected to hold with high fidelity—deviations are small, predictable, or accounted for. "Relevant optimization pressures" include those that exist now or will likely arise from your decision (e.g., encouraging adversaries).

  Below, I state the PRC precisely with clauses motivated by your cases, then apply it to your unresolved scenarios and identify any verdicts it would overturn.

  ---

  ### **The Principle of Robust Correlation (PRC)**
  1. **Clause 1: Identify the decision-relevant correlation and its fragility.**  
     *Motivation:* Your surrogate cases show that correlations (e.g., 30-day survival as a proxy for healthy life) can be reliable in some contexts but fragile in others. This clause forces explicit consideration of *what* correlation you're relying on and *why* it might break.  
     *Formally:* For any decision, specify (a) the correlation between an observable variable/action and your true goal, and (b) the optimization pressures that could weaken it (e.g., selection effects, goal misalignment).

  2. **Clause 2: Act only if the correlation is robust under current and induced optimization pressures.**  
     *Motivation:* Your acausal cooperation cases (e.g., Twin vs. Screening Bully) hinge on whether external forces (e.g., a predictor's selection) break the link between your action and the outcome. Robustness requires that the correlation holds despite these pressures.  
     *Formally:* Rely on the correlation iff, under the actual or expected optimization pressures, the expected utility of acting on it exceeds that of alternatives (e.g., acting directly on the true goal or refusing). Include pressures induced by your decision rule (e.g., encouraging more predictors).

  3. **Clause 3: If robustness is absent, default to acting on the true goal or refusing the correlation.**  
     *Motivation:* Cases like Adversarially Sited Deployment and Self-Eroding Surrogate show that unrobust proxies lead to poor outcomes. When the correlation breaks, you should ignore it (e.g., avoid the surrogate) unless doing so causes greater harm (e.g., Indiscriminate Bully forces a harm-minimizing choice).  
     *Formally:* When Clause 2 fails, evaluate options without the correlation. Prioritize avoiding irreversible harm or exploitation.

  4. **Clause 4: Robustness is assessed distributionally, not procedurally.**  
     *Motivation:* Your Prices case shows that correlations can be robust even when "interested selectors" exist (e.g., adversarial traders), provided the mechanism (e.g., market competition) preserves reliability across contexts. Conversely, Self-Eroding Surrogate fails because the correlation degrades under the system's *own* optimization. The selector's intent matters less than the correlation's stability.  
     *Formally:* Robustness depends on the correlation's behavior under counterfactual scenarios (e.g., deployment distributions, agent strategies), not on who created it or why.

  ---

  ### **How PRC Explains Your Verdicts**
  - **Twin/Simulation:** You press because the correlation (your action ↔ copy's benefit) is robust under symmetry. Confidence decreases as simulation quality drops because lower fidelity increases fragility to optimization (e.g., divergent decisions).
  - **Plain Counterfactual Mugging:** You pay. The correlation (paying-if-asked ↔ payoff-on-heads) is robust—the predictor's fixed behavior preserves it despite the mugger's optimization.
  - **Low-Measure Mugging:** You pay (with uncertainty). Robustness is distributionally assessed: the correlation holds across branches regardless of measure, as the predictor's behavior doesn't depend on measure size.
  - **Screening Bully:** You refuse. The correlation (paying ↔ avoiding torture) is fragile: the bully's selection ensures that if you *would* pay, you *must* pay to avoid torture, but if you wouldn't, you avoid both cost and threat. Paying doesn't robustly improve outcomes.
  - **Spiteful Mugger:** You pay. The correlation (refusing ↔ being tortured) is robust—it holds regardless of selection, as refusers are tortured unconditionally. Optimization pressure (screening) doesn't break the link.
  - **Indiscriminate Bully:** You pay. The correlation (refusing ↔ stranger being tortured) is robust—refusal directly causes harm. Your inability to square this with Screening Bully stems from conflating robustness with deterrence. PRC clarifies: Screening Bully's threat is *not robustly tied to your action* due to selection, but Indiscriminate Bully's is. Deterrence is a secondary consideration (addressed in Clause 3 if it induces optimization pressures).
  - **In-Distribution Surrogate:** You rely. The correlation (proxy ↔ true goal) is robust under the training distribution with no strong pressures.
  - **Adversarially Sited Deployment:** You abandon the proxy. The correlation is fragile—adversarial optimization breaks it by selecting cases where the proxy fails.
  - **Self-Eroding Surrogate:** You abandon the proxy. The correlation is fragile under the system's *own* optimization (pushing the proxy to divergence), even without external adversaries. This feels different from adversarial deployment because the pressure is endogenous, but PRC treats both as robustness failures.
  - **Prices:** You rely despite adversarial selectors. The correlation (price ↔ value) is robust—market mechanisms (e.g., competition, aggregation) preserve reliability across contexts, per Clause 4. This contradicts Adversarially Sited Deployment because adversarial selection *alone* doesn't break robustness; the *mechanism's resilience* does.

  PRC replaces your "no-interested-selector" rule by focusing on outcomes (robustness) over intent. It explains why you act despite interested selectors in Prices (robust mechanism) and Spiteful Mugger (robust correlation), but not in Adversarially Sited Deployment (fragile correlation).

  ---

  ### **Verdicts on New Cases**
  1. **Mugger with mild disvalue (screening on response, threatens to spend budget on something you mildly disvalue):**  
