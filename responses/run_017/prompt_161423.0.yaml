answer: |-
  ## Sestina: Night Watch, Hill Reservoir

  The dark holds hard, the frost begins to bite.
  Above the sluice, the bothy gives no light.
  No duty binds me to the iron valve;
  No village trusts my hand to turn it right.
  I sleep, unknowing, keeping nothing near
  But silence, logged by stars, remote and clear.

  Below, the water waits, the cold grows clear.
  Nell stamps her boots against the creeping bite
  Of ice. She marks her start time, penned so near
  The column where the night shift logs the light
  Or dark. Her signature asserts: All's right,
  I watch. The village sleeps beyond the valve.

  She knows the drill: before the deepest dark, that valve
  Must twist. Else iron splits, the fragile mains clear
  Out. She intends it; thinks she’ll get it right.
  But something snags her thought, distracts the bite
  Of purpose. Silence fills the log. No light
  Shows at the sluice. The chance slips by, so near.

  Osei, at home, checks records kept so near
  His hearth. He sees her mark, trusts she’ll valve
  The flow. He stays, relieved. He dims his light.
  He knows the road is long, the night air clear
  And sharp. He rests. He thinks she’s stopped the bite
  Of frost. Her signature made staying right.

  But Nell forgot. The crucial turn, not right,
  Not done. The water trapped, the cold drew near
  Its core. The pressure built with unseen bite.
  No hand was laid upon the frozen valve.
  The ice formed thick, a fracture, sharp and clear –
  The main gave way. No water. Only night.

  Below, the village wakes to fractured night,
  No morning flow. They ask: What went not right?
  Whose watch? Whose name stands in the record, clear?
  Nell’s entry holds: *I started*. Duty near
  Assumed. But Osei? Home. Because the valve
  *She* should have turned... her mark stopped *his* cold bite.

  Osei's cold drive was stopped by log-book light.
  My sleep held nothing near. The burst pipe’s bite
  Belongs to her withheld turn of the valve.

  ---

  **Analysis Note (British English):**

  The poem attempts to carry the philosophical structure precisely. The rotating end-words (bite, light, valve, right, near, clear) ensure the core concepts recur in shifting contexts. "Nothing" is implied as the absence-word, appearing internally (e.g., "gives no light", "keeping nothing near", "No duty", "No village", "No hand", "No water") rather than as an end-word to maintain fluidity, embodying the pervasive yet shifting nature of omission.

  1.  **Omission:** Nell's failure to turn the valve ("No hand was laid", "withheld turn") is central.
  2.  **Prevention of Prevention:** The crucial mechanism is implied: Osei checks the log ("sees her mark"), trusts her ("thinks she’s stopped the bite"), and therefore stays home ("He stays... He rests"). Nell's signing stopped him from stopping the burst. The stanza where Osei checks and stays is pivotal.
  3.  **Contrast with Backpacker:** The speaker explicitly states their irrelevance ("No duty binds me", "No village trusts my hand", "unknowing", "My sleep held nothing near"). The envoi contrasts "her withheld turn" with "My sleep held nothing near".
  4.  **Blocked Road (Dropped):** Omitted per instruction to focus on the core contrasts.

  **Liberties & Contested Ground:**
  *   **Liberty:** It simplifies Osei's counterfactual action (assuming he *definitely* would have gone if not for the log) for poetic flow. The case implies this, but philosophers might question the certainty.
  *   **Most Contested Ground:** Point 3 – the **contrast between Nell's omission and the backpacker's identical non-doing**. The poem relies entirely on normative context (duty, trust, the log as an arrangement) to distinguish them causally. Some philosophers (e.g., proponents of "difference-making" or pure counterfactual theories) might argue both non-doings are *causally* equivalent counterfactual causes; the difference is solely in responsibility or blame. The poem encodes the view that the normative context *makes* Nell's omission a cause (via preventing Osei) while the backpacker's is inert. This view (often linked to "normative" or "contrastive" accounts) *is* contested. A philosopher wedded to pure counterfactual dependence might wince here.
  *   **Confidence:** **75%**. The core structure (1, 2, and especially the *intended* contrast in 3) is clearly present in poetic terms. A philosopher familiar with normative/contrastive views would likely nod; one holding a purely counterfactual or mechanistic view might question the causal inertness of the backpacker's inaction relative to the burst.
  *   **Least Sure Point:** The line "Her signature made staying right." It accurately captures Osei's *reason* for staying, implying his action was *caused* by her signature (an act) rather than *prevented* by her omission (the signing itself wasn't the omission; the omission was the *failure to turn the valve later*). While the case implies the signing prevented his journey, this line risks slightly conflating the act of signing with the subsequent omission. Is it the *signing* or the *reliance it induced* that did the preventing? The poem leans on the latter, but the wording could be parsed as the former.
