prompt: |-
  I am a novelist, finishing a book set in a small provincial town in the 1930s, and I am stuck on a word. Two scenes in the manuscript have, I now realise, the same shape. In the first, a young woman signs over the family workshop to a charming outsider who has been courting her: every figure he has given her is accurate, he has answered every question truthfully, there is no threat and no penalty attached to refusal, she is of age, sharp-tongued, and she says yes twice — once to him, once, alone, to her oldest friend. But no one in that town, in that year, refuses him. Not because refusal is punished, but because it has never been done: there is no sentence in circulation, no story anyone can tell, in which a woman in her position declines. In the second scene, an injured man agrees to an operation that will cost him a great deal and benefit him only modestly. He can recite the risks back to the surgeon; he is not confused; nobody is pressuring him. Yet saying no is, in his mind, not "declining an operation" but "being the sort of man who abandons his family" — and he says, much later, that his yes was the only thing he could have been. In both cases the usual three tests come back clean: no coercion in any sense that involves a threat or a worsened alternative, no communicated falsehood, no failure of competence. And yet the yes feels as if it belongs to the situation rather than to her, or to him: what they are choosing between is not quite what is on offer.

  I have tried on the obvious words and none of them fit. Coercion is too strong — nothing has been made worse for them if they decline. Deception seems wrong too: I have read enough to know the common test is roughly "would she still have consented had she been told the truth?", and here the answer is yes, since they were told the truth about every fact anyone would call relevant. Competence is the wrong shelf entirely; both characters reason perfectly well. What I am after is a name for a failure of the *option space* rather than of the information, the will, or the threats: the agent's alternatives are all present, but the meaning each of them carries for her has been fixed by something other than her own judgement, so that one option is unthinkable and another is inflated into the only thing a decent person could do. A philosopher at a dinner party last month mumbled something that sounded like "hermeneutic" something, and I lost the thread; if that is the right neighbourhood I would like to be told, but a bare label will not help me. Please tell me what exactly this phenomenon is, how it differs from the three standard consent-invalidators and from anything else nearby that it might be confused with, whether it actually invalidates consent or is instead a separate complaint one can make about a transaction whose consent was genuinely valid, and where its edges are — I need to know which nearby cases are *not* instances of it, because my narrator has to name it in about four words of dialogue and I cannot have her name it wrongly. I am on a residency in a village with no library, so please do not send me to books or authors; argue it out in your own terms.

  After your prose answer, append a single JSON object with exactly these fields, and nothing else inside it:

  - "best_label": the name you settle on, existing or coined (string)
  - "label_status": one of "established", "established but narrower than my case", "no established term" (string)
  - "definition": one or two sentences, in terms a non-specialist would accept (string)
  - "test": an array of exactly three conditions that must all hold for the phenomenon to be present (array of strings)
  - "nearest_concepts": an array of three or four objects, each with keys "concept", "where_it_overlaps", "where_it_breaks_down" (array of objects)
  - "scene_verdicts": an array of two objects, one per scene, each with keys "scene" ("workshop" or "operation"), "applies" ("yes", "no", or "partly"), "reason" (array of objects)
  - "boundary_cases": an array of two invented cases that sit right at the edge, each with keys "case", "verdict", "what_would_flip_the_verdict" (array of objects)
  - "consent_status": whether, on your view, the phenomenon makes consent invalid, merely tainted, or leaves consent valid while grounding a different complaint — with one sentence of justification (string)
  - "line_for_dialogue": four or five words my narrator could plausibly say aloud (string)
reasoning: |-
  Hmm, the user is a novelist struggling with a specific conceptual gap in their manuscript. They've identified a nuanced form of constrained choice in two key scenes where characters consent technically freely but under invisible cultural/social pressures. The frustration is palpable - they've rejected coercion/deception/incompetence frameworks as inadequate, and need precision.

  What makes this query remarkable is how precisely they've diagnosed the problem: it's about the *meaning* of options being externally predetermined, not their availability. The dinner party philosopher's "hermeneutic" hint suggests they've brushed against social epistemology but need concrete handles.

  Key challenges emerge:
  - Must avoid academic jargon while retaining accuracy
  - Requires clear differentiation from adjacent concepts
  - Needs immediate usability (no library access)
  - Dialogue must be punchy (4-5 words)
  - Verdicts must hold under scrutiny

  The workshop scene shows how cultural narratives erase refusal as a conceptual possibility, while the operation scene reveals moral identity weaponization. Both share:
  1) Perfect informational transparency
  2) Absence of conventional duress
  3) Rational competence
  ...yet choice feels predetermined.

  "Normative capture" surfaces as the core concept - it's the colonization of agency by internalized social scripts. The term needs to pass their tests: 
  - Not coercion (no threats)
  - Not deception (truth was told)
  - Not incompetence (they reason well)

  Boundary cases will prove crucial. If I suggest "false necessity" as edge case, where cultural narrative makes refusal unimaginable versus merely difficult, that shows where the concept snaps into focus.

  For dialogue, "Choice without alternatives" could work - it's telegraphic but hints at the invisible foreclosure. More poetic alternatives like "captured consent" might sacrifice clarity.

  The consent validity question is thorny. Calling it "tainted but valid" respects legal reality while acknowledging moral injury - this preserves narrative ambiguity the novelist likely wants.

  Notably, they're avoiding philosophical namedropping (Foucault's subjectivation, Butler's performativity), which suggests either previous bad experiences with jargon or a need for original treatment. Smart move focusing on mechanism over lineage.
answer: |-
  Based on your precise description, the phenomenon is best understood as **normative capture**, where the meaning and viability of choices are predetermined by internalized social norms, rendering certain options conceptually or morally invisible or unacceptable to the agent, even absent overt pressure or deception. It's a failure of the agent's *interpretive framework* for evaluating options, not the options themselves.

  ### Key Analysis
  1.  **Distinction from Standard Consent-Invalidators:**
      *   **Coercion:** Requires a *threat* making the alternative worse. Here, refusal carries no external penalty; the cost is entirely internal/identity-based ("abandoning family," "being the one who refuses *him*").
      *   **Deception:** Requires *false information* materially affecting the decision. Here, all factual truths are known and acknowledged as true; the distortion is in the *significance* or *implications* of those facts for the agent's identity.
      *   **Incompetence:** Involves inability to understand or reason. Here, both characters demonstrate clear comprehension and reasoning about the facts and risks.

  2.  **Core Mechanism:** Social norms, expectations, and narratives become so deeply internalized that they define not just what is *preferable*, but what is *thinkable* or *permissible* for an agent occupying a specific social role (e.g., "a woman courted by *him*", "a family man"). The "choice" becomes a performance of the assigned role, not a genuine selection between viable alternatives. The option space collapses because one path is imbued with overwhelming positive identity reinforcement ("the only decent thing") while the other is erased or catastrophically redefined ("abandonment").

  3.  **The Philosopher's Hint:** "Hermeneutic" likely refers to "hermeneutical injustice" (Miranda Fricker). This *overlaps* as it involves a gap in shared social understanding/resources needed to interpret one's own experience. However, hermeneutical injustice typically focuses on the *lack* of concepts to name an experience (e.g., sexual harassment before the term existed). Here, the concepts *exist*, but their *application* is rigidly constrained by norms. Your cases involve an *overpowering* hermeneutic framework, not an absence. It's a near cousin but not the perfect fit.

  4.  **Consent Validity:** This **taints but does not necessarily invalidate consent** in a legal or strict moral sense. The consent is *genuine* under their current framework; they authentically believe "yes" is the only right answer. However, it highlights a profound *structural flaw* in how the agent's framework for understanding choices was formed and constrained by power structures (gender roles, societal pressure, medical authority). It grounds a complaint about the *quality* or *autonomy* of the consent, revealing it as conformity rather than self-determination, even if legally valid.

  5.  **Edges & Boundaries:** It's *not* present when:
      *   An option is merely *difficult* or *costly* but remains conceptually viable ("I don't want to pay that price, but I could").
      *   Internal conflict stems purely from personal values/vulnerability, not rigid social scripting ("I'm scared, but I know it's my choice").
      *   Social pressure involves explicit shaming or reputational threats *conveyed as consequences* ("If you refuse, people will think you're a coward").

