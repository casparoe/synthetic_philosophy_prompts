prompt: |-
  I run a small research team and I'm trying to write down my actual views on planning and forecasting before I inflict them on anyone else, and I'd like to know whether they hang together.

  1. For my own projects I plan with the inside view: break the work into steps, estimate each step, add them up. I think this beats reference-class base rates for me, because a base rate averages over projects that aren't like mine.
  2. When someone on my team brings me a plan, I mostly discard their estimate and go with the base rate for that kind of project. This has defiantly made us more accurate.
  3. I'm an epistemic modest: without case-specific evidence I should defer to base rates, the planning fallacy is real, and I'm not specially immune to it.
  4. I think the usual "use the outside view as an anchor, then adjust it with inside-view details" advice is bunk. People under-adjust, so either take the base rate straight or don't look at it at all.
  5. My own confidence intervals on my own timelines have been roughly calibrated over the last few years, so I do trust my own numbers.
  6. I've started calling it "reference-class laundering" when someone narrows the class until the base rate just repeats what their inside view already said. I think I avoid this by fixing the reference class before I decompose the project.

  If I had to guess I'd say 3 and 5 are the pair that can't both stay, but honestly I can't locate the problem. Which pairs are really in tension and which only look like it? Rank the real ones by severity, say what would have to give in each case, and tell me which single revision cleans up the most. Please don't just flag all six as mutually suspicious.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They run a small research team and are grappling with how to reconcile their personal planning methods with how they evaluate their team's plans. They've listed six points that seem coherent to them but suspect internal contradictions, specifically pointing to points 3 and 5 as potential conflict points. 

  First, I notice the user is clearly intellectually rigorous - they're pre-testing their framework before "inflicting" it on their team, which shows admirable self-awareness. The term "reference-class laundering" suggests they've deeply engaged with planning literature. Their struggle feels very real - that tension between knowing cognitive biases exist while trusting one's own calibrated judgment.

  Hmm... The core tension does seem to be between their epistemic modesty (point 3) and self-trust (point 5). But is it truly contradictory? I recall studies showing experts can develop valid intuition in stable domains. If their personal projects have consistent parameters and they've done proper calibration, maybe point 5 survives point 3. The real red flag is how differently they treat their own planning (inside view) versus their team's (outside view). That double standard needs unpacking.

  Wait - point 4 is fascinating. They reject the standard anchor-and-adjust approach because of under-adjustment bias. But doesn't their own method (point 1) essentially become an extreme version of anchor-and-adjust? They're adjusting the base rate all the way to 100% with their inside view! That's the stealth contradiction they might be missing.

  The reference-class laundering concept (point 6) is brilliant, but I wonder if they're applying it consistently. When they define their own reference class "before decomposition", are they really immune? Or does their decomposition unconsciously align with favorable base rates? That might be the subtle crack in their armor.

  For resolution... The biggest fix would be aligning how they treat their own and their team's estimates. Either bring more outside view to their personal planning, or bring calibrated inside views from their team. The second priority would be admitting their personal method IS anchor-and-adjust - just with maximum adjustment - and squaring that with their critique of under-adjustment.

  User seems to value concrete actions, so I'll emphasize the "single revision" request. Harmonizing the self/team evaluation standards would do most heavy lifting. Maybe suggest they track their team's decomposed estimates against outcomes to build case-specific evidence over time - that could bridge the gap between points 1 and 2 organically.
answer: |-
  Your views are admirably coherent and self-aware, but there *is* a subtle tension—primarily between **Point 1 (your own inside-view planning)** and **Point 2 (discarding others' inside views for base rates)**. The other points largely support this core framework, though Point 4 amplifies the tension. Here's the breakdown:

  ### Ranked Tensions by Severity:
  1.  **Point 1 vs. Point 2 (Severity: High)**  
      **Tension:** You use a detailed inside view for *your own* projects (trusting your decomposition/estimates), but reject the inside view entirely for *your team's* plans, substituting a base rate.  
      **Why it's problematic:** This creates a double standard unless you can robustly justify why *your* inside view is uniquely reliable while your team's is not. Point 5 (your calibrated confidence intervals) is your justification, but it doesn't extend to your team. If epistemic modesty (Point 3) applies to humans generally, why are you exempt for your own work?  
      **What must give:** Either:  
      -   Apply your base-rate skepticism to *your own* plans more rigorously (modifying Point 1), OR  
      -   Develop a process to help your team achieve similar calibration/trustworthiness in *their* inside views (modifying Point 2, e.g., by teaching decomposition skills or reviewing their step estimates for realism).

  2.  **Point 5 vs. Point 3 (Severity: Medium-Low)**  
      **Tension:** Epistemic modesty (Point 3) says you shouldn't assume immunity to universal biases (like planning fallacy), yet Point 5 claims your personal estimates *are* well-calibrated.  
      **Why it's less severe:** This is *potentially* consistent. Calibration (Point 5) is *earned evidence* specific to you and your work context, overriding the *default* modesty (Point 3) *for that specific domain*. It's not claiming general immunity, but validated skill in a narrow area.  
      **Risk:** Overconfidence creep. If your projects change significantly (scope, complexity, novelty), your past calibration may not hold. Vigilance is needed.  
      **What must give:** Maintain Point 5, but explicitly frame it as a *hard-earned exception* to the default rule (Point 3), contingent on continuous verification and similar project types. Don't assume it generalizes blindly.

  3.  **Point 1 vs. Point 4 (Severity: Low)**  
      **Tension:** Point 4 dismisses anchor-and-adjust as bunk due to under-adjustment. But your own method (Point 1) *is* effectively "anchor-and-adjust" where you **start with an inside view (anchor) and adjust the base rate to 100% (full adjustment)**.  
      **Why it's minor:** Your critique (Point 4) targets *typical human under-adjustment*. Your method is an extreme form of adjustment you've validated works *for you* (Point 5). It's consistent *if* you see your approach as the (rare) correct implementation of full adjustment, not disproving the concept itself.  
      **What must give:** Refine Point 4. Clarify you reject *typical, flawed implementations* of anchor-and-adjust (where adjustment is insufficient), not the theoretical ideal. Acknowledge your method *is* a form of adjustment.

  ### Why Other Points Aren't Major Tensions
  *   **Point 3 (Modesty):** Supports Point 2 and the skepticism behind Point 4. Only mildly questions Point 5 (as discussed).
  *   **Point 4 (Reject Anchor-and-Adjust):** Primarily amplifies the justification for Point 2 (discarding others' inside views) and supports the "all-or-nothing" stance. The tension with Point 1 is manageable.
  *   **Point 6 (Laundering):** Excellent concept, fully consistent with Points 2, 3, and 4. It reinforces the discipline needed for a pure outside view. Doesn't conflict with Point 1, as you apply a different standard to yourself.

  ### The Single Revision That Cleans Up the Most: Harmonize Point 1 & Point 2
  **Revise your approach to be consistent across self and team regarding the *source* of trustworthiness:**

  1.  **Option A (Stricter Modesty):** Apply your Point 2 skepticism more to *your own* plans. Use your inside view for decomposition *and sequencing*, but anchor the *overall timeline estimate* on a relevant base rate (perhaps with a small adjustment window based on truly unique aspects vetted rigorously). This fully embraces Points 3 and 4.
  2.  **Option B (Extend Calibration):** Develop a process to make your *team's* inside views more trustworthy/calibrated. This could involve:
      *   Joint decomposition sessions early on.
      *   Training on estimation techniques.
      *   Requiring historical comparisons for similar steps.
      *   Tracking their estimate accuracy over time to build *their* calibration evidence. *Then*, you could use *their* inside view (validated) more like you use your own.

  **Why this revision is best:** It resolves the core double standard (Point 1 vs. Point 2), which is the most significant tension. It also indirectly addresses the Point 5 vs. Point 3 tension by either grounding your own estimates more in the outside view (Option A) or creating a pathway for your team to earn trust in their inside view (Option B), making Point 3 more uniformly applicable or demonstrating how calibration (Point 5) can be achieved by others.

  ### Recommendation
  Given your self-reported calibration (Point 5), **Option B is likely more practical and empowering.** Start small:  
  *   Pick one team member/project.  
  *   Work collaboratively on decomposition *and* step estimation *before* they give you an overall estimate.  
  *   Discuss historical analogues for steps (applying your Point 6 discipline).  
  *   Track the accuracy of *this joint process* over several projects.  
  *   If accuracy improves, you gain evidence to trust *this specific collaborative process* (a hybrid view), allowing you to relax the strict "discard and use base rate" rule (Point 2) for plans developed this way, moving towards consistency with your self-trust (Point 1 & 5).

  This maintains your valuable insights (modesty, base rates, laundering dangers) while working towards a unified, evidence-based approach to planning across your team.
