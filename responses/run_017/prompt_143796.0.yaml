prompt: |-
  I teach a graduate seminar on the epistemic foundations of game theory — common knowledge, common belief in rationality, and the work that higher-order beliefs are supposed to do in selecting among equilibria. I want to test that framework against an actual episode rather than another puzzle, so: analyse the failure of Silicon Valley Bank in March 2023 through it, and then tell me where the framework stops being informative.

  I will stipulate the facts. SVB had invested a large share of its swollen deposit base in long-dated Treasuries and mortgage securities, whose market value fell as the Fed raised rates; unrealized losses on the held-to-maturity portfolio exceeded fifteen billion dollars. On 8 March the bank announced that it had sold over twenty-one billion dollars of securities at a loss, borrowed fifteen billion, and would raise 2.25 billion in equity. Prominent venture investors publicly advised their portfolio companies to move their money. Customers withdrew funds totalling forty-two billion dollars by the following day; the bank was seized on 10 March. Roughly eighty-nine percent of its deposit liabilities were uninsured. Two days later the authorities announced that all depositors, insured or not, would have full access to their funds, and the immediate panic subsided — while First Republic, with a comparably uninsured deposit base, was closed on 1 May despite thirty billion dollars in deposits placed with it by eleven banks in March.

  What I want is a disciplined mapping, not a narrative: who the players are, what the option set and payoff structure actually looked like for a depositor on the morning of 9 March, what has to be true of first- and higher-order beliefs for mass withdrawal to be an equilibrium rather than merely individually rational, and how the public guarantee should be modelled — as a change in the payoffs, or as an intervention on beliefs, and if the latter, what the theory predicts about the difference between its working at SVB and not working at First Republic.

  Then the return direction, which interests me more. First: was this a coordination failure at all? SVB's deposits paid close to nothing while short-term government paper yielded around five percent, so withdrawal may have been a dominant strategy irrespective of what anyone else did. If so the model is imposing a self-fulfilling structure on what was really a common adverse shock. Say what would distinguish the two readings, and whether the framework can distinguish them from the outside; if it cannot, is that a defect in the theory or a limitation on its use? Second: the depositor base was unusually small, densely networked, and able to watch one another's reasoning almost in real time. Does that transparency move the situation toward or away from the theory's idealised conditions, and — since transparency plainly does not by itself say which equilibrium gets coordinated on — whether near-common knowledge behaves like common knowledge here or departs from it disproportionately. Finally, the normative question: if staying and running are both equilibrium outcomes under common belief in rationality, can the framework say that anything went wrong at SVB, or does it have to import something from outside itself? Where it has nothing to say, say so rather than forcing it to speak.
reasoning: |-
  Okay, let me approach this systematically. The user teaches a graduate seminar on epistemic game theory foundations and wants a case study of SVB's collapse. They've stipulated key facts: SVB's asset-liability mismatch, the March 8th capital raise announcement, VC-led bank run, and differential outcomes post-guarantee between SVB and First Republic.

  First, I need to model this as a coordination game. The players are depositors, each facing binary choices: withdraw (run) or keep deposits (stay). Their payoffs depend on the bank's solvency, which itself depends on how many others withdraw. Since 89% deposits were uninsured, the FDIC limit creates a threshold where withdrawals trigger insolvency. 

  For the payoff structure: if depositors stay when the bank survives, they earn near-zero interest but avoid withdrawal costs. If they run when the bank survives, they lose future interest and incur transaction costs but preserve capital. Crucially, if they stay when the bank fails, they lose uninsured amounts - a catastrophic outcome. This creates the classic coordination game structure with multiple equilibria: all-stay (if bank is solvent) or all-run (if withdrawals cause failure).

  The key epistemic condition for the run equilibrium is common belief in rationality plus common belief that others will run. Even if each depositor believes SVB is fundamentally solvent, if they believe others believe it's insolvent and will run, then running becomes rational. This higher-order belief structure makes the run self-fulfilling.

  The government guarantee fundamentally altered payoffs by removing the loss scenario for stayers. This collapsed the run equilibrium - staying became dominant once the guarantee was credibly established. The difference with First Republic suggests either: 1) the guarantee wasn't fully credible for FRC, or 2) FRC's fundamental weaknesses made stay payoffs negative even with guarantee, or 3) network effects amplified panic beyond what occurred at SVB.

  Now the counter-factual challenges: was this truly coordination failure? The near-zero interest versus 5% risk-free creates a dominant strategy argument for withdrawal. But crucially, the timing - mass withdrawals triggered only after VCs advised running - suggests coordination dynamics. The testable distinction: if withdrawals were gradual pre-panic, it points to fundamental weakness; if sudden after coordination signal, it points to self-fulfilling run. The framework struggles to distinguish this from observable data alone.

  On transparency in the VC network: while common knowledge assumptions may better hold in dense networks, this doesn't resolve equilibrium selection. Transparency could amplify panic just as efficiently as it could sustain confidence. We saw both: VCs triggered the run, but later the guarantee spread rapidly.

  Normatively, the framework is silent on which equilibrium is "better." Preventing the run might have been socially preferable, but the model only shows both outcomes are consistent with rationality. This exposes the theory's core limitation: it describes consistency of beliefs but cannot prescribe outcomes without external welfare criteria.

  The user's deepest need seems to be testing the boundaries of epistemic game theory - where its tools illuminate versus where they fail. SVB offers rich ground: clear coordination elements but complicated by fundamentals and network effects. I should emphasize where the framework must yield to behavioral or institutional analysis.
answer: |-
  Here is a disciplined epistemic game-theoretic analysis of the SVB failure, structured to address your queries:

  ### Core Game Structure (Depositors' Dilemma on March 9)
  1. **Players**: *n* depositors (primarily VC-backed startups/VC firms).  
  2. **Actions**: Withdraw (W) or Keep Deposits (K).  
  3. **Payoffs**:  
     - If bank survives (solvent): K yields minimal interest (≈0%), W incurs transaction cost *c* (switching banks/liquidity loss).  
     - If bank fails: K loses uninsured deposits (*L* ≈ full amount for 89%), W recovers funds (minus *c*).  
     - Bank fails iff fraction *θ* of deposits are withdrawn (where *θ* < 1 due to liquidity mismatch).  
     **Payoff Matrix (per depositor)**:  
     | Others' Actions | Bank Survives | Bank Fails |  
     |------------------|---------------|------------|  
     | **Keep (K)**     | 0             | -L         |  
     | **Withdraw (W)** | -c            | -c         |  

  ---

  ### Equilibrium Conditions for Mass Withdrawal
  - **Individual Rationality (IR)**: W is dominant if *prob(bank fails)* > *c/L*.  
    - *But IR alone doesn't require mass coordination*: even with low *prob(failure)*, if *L* is large (uninsured) and *c* small, W is rational.  
  - **Coordination Equilibrium**: Mass withdrawal is a **Nash Equilibrium** iff:  
    - Each depositor believes ≥ *θ* others will withdraw → triggers failure → validates W.  
  - **Higher-Order Beliefs for NE**:  
    - **1st-order**: Each believes bank is vulnerable (fundamentals weak: *prob(failure)* > 0).  
    - **2nd-order**: Each believes *others believe* fundamentals are weak.  
    - **Common Belief in Rationality (CBR) + kth-order**:  
      For mass W to be the *unique* equilibrium under CBR, we need:  
      - Common *p*-belief (for high *p*) that fundamentals are weak enough that W is dominant (*p* > *c/L*).  
      - **Critical point**: Without common knowledge of others' actions, multiple equilibria (all-K or all-W) may coexist.  

  ---

  ### Government Guarantee as Intervention
  - **Mechanism**: Changes payoffs directly:  
    - If guarantee is *credible*, sets *L* = 0 for K (even if bank fails).  
    - **New Payoff for K**: 0 (survive) or 0 (fail) → K dominates W if *c* > 0.  
  - **Epistemic Effect**: If guarantee is common knowledge, it eliminates the failure contingency → collapses the W equilibrium.  
  - **SVB vs. First Republic (FRC)**:  
    - **SVB**: Guarantee was immediate, unconditional, and broadcast (common knowledge). Beliefs updated → W equilibrium vanished.  
    - **FRC**: Guarantee was *not* common knowledge (delayed/partial: 11 banks' deposits ≠ full backstop). Doubts persisted → W remained rational.  

  ---

  ### Critical Tensions in the Framework  
  1. **Coordination Failure vs. Dominant Strategy**:  
     - **Dominant Strategy Test**: If *L* > *c* and risk-free rate >> deposit rate, W is *always* rational unless *prob(failure)* = 0.  
       - *But*: Pre-March 8, most kept deposits despite rate gap → suggests coordination was initially stable.  
     - **How to Distinguish**:  
       - If withdrawals accelerate *nonlinearly* after a public signal (VC tweets), it suggests coordination game.  
       - If withdrawals are *linear/constant* pre-panic, fundamentals dominate.  
     - **Framework Limitation**: The model *cannot* distinguish from observable data alone; it requires belief data (e.g., depositor surveys).  

  2. **Network Transparency & Near-Common Knowledge**:  
     - **Ideal Conditions**: Dense networks facilitate faster higher-order belief alignment → closer to common knowledge.  
     - **Equilibrium Selection**: Transparency *amplifies* belief cascades but doesn't resolve multiplicity.  
       - VC tweets created common *focal point* for W equilibrium.  
       - Near-common knowledge behaved *like common knowledge* here: public signals made beliefs converge rapidly to "all will run".  

  3. **Normative Vacuum**:  
     - **The Framework's Silence**: Under CBR, both all-K (if solvent) and all-W (if beliefs align) are rationalizable.  
       - No inherent "failure" in the game-theoretic sense; both are equilibrium outcomes.  
     - **Requires External Input**: To deem the run "bad", we need:  
       - Welfare analysis (e.g., social cost of contagion).  
       - Efficiency claims (e.g., all-K was feasible if beliefs were coordinated).  

  ---

  ### Where the Framework Stops Being Informative  
  1. **Fundamental Solvency vs. Self-Fulfilling Panic**:  
     - The model cannot adjudicate whether SVB was illiquid vs. insolvent. If insolvent, W was dominant → no coordination "failure".  
     - *Requires* asset valuation data (e.g., HTM portfolio losses vs. equity buffer).  

  2. **Belief Formation Externally**:  
     - Why did VCs signal "run"? The framework treats signals as exogenous.  
     - VC motives (reputational, herd immunity) lie outside the model.  

  3. **Institutional Realities**:  
     - FDIC insurance limits create *threshold effects* (θ) but deposit concentration matters (e.g., one large depositor can trigger θ).  
     - FRC's May failure involved *regulatory hesitation*—a dynamic not captured in depositor games.  

  4. **Equilibrium Selection**:  
     - Transparency explains *speed* of coordination but not *direction*. Why did VCs coordinate on W, not K?  
     - Requires behavioral cues (e.g., salience of loss aversion).  

  ---

  ### Conclusion: The Epistemic Framework's Domain  
  - **Illuminates**: How higher-order beliefs enable self-fulfilling runs; how public interventions alter equilibrium sets.  
  - **Blind Spots**:  
    - Distinguishing fundamental vs. belief-driven failures without counterfactuals.  
    - Explaining *why* a particular equilibrium is selected in transparent networks.  
    - Normative evaluation of outcomes.  
  SVB shows the framework's power in modeling panic dynamics but exposes its dependence on external inputs for causality and welfare. It excels as a *structure* for beliefs but not as a *source* of them.  

  Would you like formal notation for the belief hierarchies or a diagram of the game tree?
