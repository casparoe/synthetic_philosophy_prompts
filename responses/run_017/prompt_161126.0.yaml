prompt: |-
  I'm a high school senior with one semester of independent study — roughly forty working hours, a good school library, but no archives, no specialist journals, and no interviews — to write a short field guide for my school's crisis-simulation and debate club on when reaching for a historical analogy (Munich, Vietnam, the Thucydides trap) actually sharpens a judgment and when it only decorates one. Which five lines of inquiry should I spend those hours on, and in what order?

  I want the ranking defended rather than asserted: tell me which criterion you are weighting — how much a line would change the forecasts my club actually makes, how many of the other lines depend on it, whether it is tractable for someone limited to secondary sources, how neglected it is in writing aimed at general readers — and name what I would have to find in the first few weeks to move a line up or down the list.

  Place three suspicions of mine rather than simply accepting them: that the stock of analogies we can reach for is survivorship-biased, since the ones still in circulation tend to be those that flattered the person who used them while analogies that produced quiet successes were forgotten; that an analogy earns its keep only if its user can name, before the outcome is known, the observable that would make them abandon it, and that most famous ones fail this test because they cut both ways and so discriminate nothing; and that most of the damage is done by analogies doing legitimizing work in the costume of predictive work. Say plainly if any of these is overrated, or is downstream of something I have not listed.

  Give your answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, this is a sophisticated request from a high school senior tackling analogical reasoning in crisis simulations. The user clearly understands cognitive pitfalls but needs structured guidance within tight constraints. Their three suspicions about survivorship bias, falsifiability, and legitimization vs prediction are sharp - I'll need to validate while showing where they might overreach.

  The core challenge is prioritizing five inquiry lines that meet four explicit criteria: impact on forecasts (weight: 40%), dependency for other analyses (25%), tractability with secondary sources (20%), and neglect in popular writing (15%). I'm calculating these weights based on the user's debate club context - forecast accuracy matters most, but they can't afford dead ends requiring inaccessible resources.

  First inquiry must be survivorship bias - it's foundational (feeds into all analogy selection) and highly tractable through history books. Finding that "successful but unglamorous" cases like the 1905 Algeciras Conference are missing from crisis discourse would confirm its importance. 

  Second should be falsifiability thresholds - directly affects forecast quality. User's suspicion here is correct but needs operationalizing. If I can't locate pre-outcome abandonment criteria in historical records (e.g., what would have made JFK drop Cuban Missile Crisis "Munich" framing), this line drops.

  Third: legitimization vs prediction. The user's insight about "costume" analogies is profound but risks overrating - many predictive analogies also legitimize. Tractability test: can I find clear examples like Iraq War "Munich" rhetoric being used to silence dissent regardless of accuracy?

  Fourth: analogy specificity. Often overlooked in popular writing (e.g., Thucydides Trap oversimplifies). Key test: does comparing granular Vietnam factors (troop morale metrics) vs vague parallels improve modern crisis assessment?

  Fifth: domain mismatch. Crucial for simulations but neglected. If sources don't contrast business/military decision contexts (e.g., Cuban Missile Crisis vs corporate crisis management), this becomes urgent.

  Notably, the user's falsifiability point isn't overrated - it's the linchpin. But their survivorship bias suspicion underestimates how some "flattering" analogies (Churchill's Iron Curtain speech) gained traction despite initial criticism. Also, the legitimization issue is downstream of power dynamics they didn't mention.
answer: |-
  1.  **Investigate the survivorship bias in historical analogies (Weight: 30% Forecast Impact, 25% Dependency, 20% Tractability).** Find evidence of successful crisis resolutions using forgotten analogies (e.g., pre-WW1 diplomacy precedents) or cases where popular analogies like Munich obscured better-fitting but less dramatic parallels to move this up; finding only dominant analogies consistently flattering powerful actors moves it down.
  2.  **Define concrete falsifiability thresholds for analogies (Weight: 40% Forecast Impact, 30% Dependency, 20% Tractability).** Identify historical instances where leaders *did* specify observable conditions for abandoning an analogy (e.g., pre-Cuban Missile Crisis planning) to move this up; discovering famous analogies like the Thucydides Trap inherently resist such specification moves it down.
  3.  **Distinguish legitimizing from predictive analogical functions (Weight: 25% Forecast Impact, 20% Dependency, 30% Neglect).** Find clear examples where analogies primarily justified pre-existing policy desires (e.g., Vietnam invoked for both Iraq interventions) rather than shaped predictions to move this up; if most cases show tight integration of both functions, move it down.
  4.  **Analyze the specificity of the analogy's causal mechanism (Weight: 35% Forecast Impact, 15% Dependency, 25% Tractability).** Determine if successful analogies hinge on granular, testable mechanisms (e.g., specific alliance dynamics pre-WW1) versus vague parallels (e.g., "appeasement bad"); finding that predictive power correlates strongly with mechanism specificity moves it up.
  5.  **Examine the domain-context match between past and present (Weight: 20% Forecast Impact, 10% Dependency, 35% Neglect).** Assess how often analogies fail due to mismatched contexts (e.g., applying state-centric Munich to non-state actors); discovering systematic neglect of factors like technological change or institutional differences in popular analogies moves this up.

  **On your suspicions:** Your survivorship bias point is valid but slightly overrated; some analogies survive due to narrative power, not just flattery. Your falsifiability threshold is crucial and *underrated* in practice. The legitimization-vs-prediction distinction is profound but often downstream of **motivated reasoning** you didn't list – the core driver is often a pre-existing policy preference seeking justification.
