prompt: |-
  hey, question I've been stuck on. A friend and I keep arguing about evidential cooperation in large worlds and I think we're mostly talking past each other, because we never agreed what a theory in this area would even have to do to count as a good one. So before we get to whose favourite decision theory wins: help me write the spec.

  Framing so we start from the same place. Take the small-world / large-world distinction in Savage's sense: in a small world you get handed the full space of states and your action is just a map from states to outcomes; in a large world you also have to reckon with the possibility that whatever produces your decision gets produced again somewhere else — other agents, causally cut off from you, running something structurally like your decision procedure. The interesting claim is that this can change the verdict in a one-shot prisoner's dilemma: your cooperating is evidence about what those other runs do, and if the evidence is strong enough relative to the payoffs, cooperation comes out rational with no repetition, no reputation, no enforcement. Call that evidential cooperation.

  What I want from you is the list of requirements any theory has to satisfy for its verdicts about cases like that to be worth taking seriously — with the case or consideration behind each requirement, and a mark on which are non-negotiable and which are really just the taste of one camp. Not the ranking; I want the standard first. I'll fix the purpose too, since adequacy presumably depends on it: I want to know whether an actual agent — one who doesn't know how many agents similar to it there are, can't inspect its own source code, and has to decide in real time — should treat evidential cooperation as a genuine reason to cooperate. Score the list against that purpose, not against some God's-eye benchmark.

  Things I think have to be on the list somewhere, in no particular order:

  - It has to say what the evidential link has to look like. Presumably cooperation only pays above some threshold of correlation, and the threshold should be a function of the payoff structure — I want the requirement stated so it's checkable, and I want to know what goes into it.
  - It has to keep apart correlation that runs through the decision procedure being the same procedure twice from correlation that's just a common cause upstream of both agents. The worry is the smoking-lesion shape: conditioning on your own action as if it were evidence about a fixed trait you have, rather than as something that moves the other agent. Which part of that is a real requirement on the theory, and which is a slogan the causalists use to beg the question?
  - It has to handle the reference class, or the graining, or whatever you want to call it: who counts as another run of you? Too wide and you're cooperating with agents whose choices carry no information about yours; too narrow and nothing ever cooperates. And it shouldn't be gerrymanderable — I shouldn't be able to flip the verdict by redescribing the situation, or by splitting one decision into a hundred and then handling them one at a time, or by choosing the level of description of my own algorithm.
  - It has to have something to say when the number of similar agents is unknown, or enormous, or infinite enough that the relevant conditional probabilities stop being well defined. A theory that only speaks once you're handed the exact population isn't action-guiding, and I suspect this requirement is the one that does the most damage.
  - It has to degrade gracefully when similarity is partial: networks of partial correlation rather than a tidy clique, asymmetric cases where you don't know which position you're in, cases where you can't read your own code.
  - It has to survive adversarial similarity. If someone can build agents that are near-twins of you but wired to do the opposite of what they predict you'll do, a theory that cooperates on similarity alone looks exploitable. Is robustness to that a genuine desideratum, or just a prejudice of the causal/functional camp that I should strike from the list?
  - It has to say whether the deliverable is a claim about rationality or a piece of engineering advice for agents who can self-modify, precommit, or get themselves built so that other agents cooperate with them. People slide between these and I want the list to force a choice.
  - It should generalise past the two-person case: public-goods-ish structures where your act is evidence about many others at once, and where the correlation isn't all-or-nothing.
  - It shouldn't secretly reduce to maximise total utility in a trenchcoat. I want at least one requirement that says when evidential cooperation fails on its own terms even in a very large world — otherwise I can't tell whether I've just been handed consequentialism with extra steps.

  Then the part I care most about, and the reason I'm asking you rather than writing this myself: go back over whatever list you produce and flag the subsets you think can't be jointly satisfied. If the list is itself an impossibility result, say so and say what gives. Also tell me which single requirement knocks out the most candidates, and — this is the bit I'll actually argue with my friend about — which items are real desiderata and which are one camp winning by building its favourite conclusion into the definition of adequacy.

  A short scorecard at the end is fine — evidential, causal, the algorithmic-identity family, and old-school superrationality, a couple of lines each — but keep the weight on the criteria. And two housekeeping things: assume I know the standard toy cases (Newcomb's problem, a one-shot dilemma against something very like you, the smoking lesion, the predictor who has already gone to whichever city you were going to flee to), so describe any case you use in a sentence instead of naming it; and please don't give me readings, papers or citations, I havn't got library access at the moment and I'd rather have the argument.
reasoning: |-
  We are designing a list of requirements for a theory of evidential cooperation in large worlds. The purpose is to evaluate whether an actual agent should treat evidential cooperation as a genuine reason to cooperate in a one-shot prisoner's dilemma-like situation, with the agent being unaware of the exact number of similar agents, unable to inspect its source code, and having to decide in real time.

  We'll structure the requirements as follows:

  1. **Threshold for Correlation**: The theory must specify the conditions under which evidential cooperation becomes rational. This includes a threshold of correlation above which cooperation is recommended, and this threshold must be a function of the payoff structure. The requirement should be checkable: for given payoffs and a given degree of correlation (or a way to compute it), the theory must output a verdict. Non-negotiable.

  2. **Distinguishing Decision-Procedure Correlation from Common Cause**: The theory must be able to distinguish between correlations that arise because the same decision procedure is being run in multiple places (which is relevant for evidential cooperation) and correlations that arise due to a common cause (like a fixed trait that affects both agents). This is to avoid the "smoking lesion" problem where conditioning on one's action might misleadingly suggest a correlation that is not due to the decision procedure. Non-negotiable because without this, the theory may recommend cooperation in cases where it shouldn't.

  3. **Reference Class Problem**: The theory must provide a non-arbitrary, non-gerrymanderable way to determine which agents count as "similar enough" to be in the reference class. The method must be robust to redescription and re-graining (e.g., splitting one decision into many, changing the level of description of the algorithm). Non-negotiable because without a well-defined reference class, the theory is either too broad or too narrow, and the agent cannot apply it reliably.

  4. **Unknown, Large, or Infinite Populations**: The theory must be applicable when the number of similar agents is unknown, very large, or infinite. It must not require exact knowledge of the population. Non-negotiable because in the large world setting, the agent typically does not have such knowledge, and the theory must be action-guiding in realistic conditions.

  5. **Partial Similarity and Asymmetry**: The theory must handle cases of partial correlation (e.g., networks of agents with varying degrees of similarity), asymmetric situations (where the agent doesn't know which role it is in), and cases where the agent cannot inspect its own source code. Non-negotiable because real-world similarity is rarely perfect and agents often lack self-knowledge.

  6. **Robustness to Adversarial Similarity**: The theory must not be exploitable by adversaries who create near-twins that are designed to act oppositely. This is a genuine desideratum because without it, the agent might be manipulated into cooperating when it shouldn't. However, note that in the large world, the agent might not have control over who is similar to it. This requirement might be negotiable if the theory can show that such adversarial situations are rare or can be handled by other means, but it's a strong desideratum.

  7. **Rationality vs. Engineering Advice**: The theory must clearly state whether it is providing a claim about rationality (what it is rational to do given the agent's beliefs and evidence) or engineering advice (how to design agents to achieve cooperation). This is to avoid sliding between the two. For our purpose (evaluating whether an actual agent should cooperate), we are primarily interested in rationality. Non-negotiable: the theory must be clear on this.

  8. **Generalization to Multiple Agents and Public Goods**: The theory must extend beyond two agents to public goods problems with multiple agents and partial correlations. Non-negotiable because the large world typically involves many agents.

  9. **Non-Reduction to Total Utilitarianism**: The theory must not secretly reduce to maximizing total utility. We require a condition that shows when evidential cooperation fails even in a large world. For example, in a situation where the correlation is too weak or the payoff structure does not support cooperation, the theory must recommend defection. Non-negotiable because we want to know if evidential cooperation is a distinct reason to cooperate.

  Now, we flag potential conflicts and which requirements are hardest:

  - **Hardest Requirement**: Requirement 4 (unknown/large/infinite populations) is likely the most damaging because it forces the theory to handle situations where standard probability theory may break down (e.g., infinite sets, non-measurable sets). It also interacts with requirement 3 (reference class) because in large populations, defining the reference class becomes more complex.

  - **Potential Conflicts**:
    - Requirements 2 (distinguishing correlation types) and 6 (adversarial robustness) might push in opposite directions. If the theory is too permissive about what counts as a decision-procedure correlation, it might be vulnerable to adversarial similarity. But if it is too strict, it might miss genuine cooperation opportunities.
    - Requirement 3 (reference class) and 5 (partial similarity) are challenging together because partial similarity requires a graded notion of reference class, which might be gerrymanderable.

  - **Impossibility?**: It is not clear that the list is impossible, but it is very demanding. In particular, requirement 4 (infinite populations) and requirement 9 (non-reduction) might conflict if the only way to handle infinite populations is to use a total utilitarian criterion. However, this is not necessarily the case.

  Now, we note which requirements are genuine desiderata and which might be camp-biased:

  - Requirement 2 (distinguishing correlation types) is often emphasized by causalists, but it is a genuine requirement to avoid the smoking-lesion fallacy. It's non-negotiable.
  - Requirement 6 (adversarial robustness) might be seen as a causalist bias because causal decision theories are naturally robust to such adversaries. However, it is a genuine concern for any theory that wants to be practical in adversarial environments. We'll mark it as a strong desideratum but not non-negotiable if the theory can show that such adversaries are not a problem in typical large worlds.
  - Requirement 9 (non-reduction) is to ensure that we are not just smuggling in total utilitarianism. It is a genuine requirement for evaluating evidential cooperation as a distinct concept.

  Finally, we provide a short scorecard for major approaches:

  - **Evidential Decision Theory (EDT)**: 
    - Fails requirement 2 (smoking lesion problem) and requirement 6 (adversarial similarity). 
    - May struggle with requirement 4 (infinite populations) and requirement 3 (reference class).

  - **Causal Decision Theory (CDT)**:
    - Rejects evidential cooperation by design (fails to recommend cooperation in the standard one-shot dilemma with a twin). 
    - Satisfies 2 and 6, but fails to capture evidential cooperation even when it is rational (by the lights of evidentialists).

  - **Algorithmic-Identity Family (e.g., UDT, FDT)**:
    - Designed to handle large worlds and evidential cooperation. 
    - May satisfy all requirements, but struggles with requirement 3 (reference class) and requirement 4 (infinite populations) in practice. 
    - Also, requirement 6 (adversarial similarity) might be a challenge if the adversary can predict the agent's algorithm.

  - **Old-School Superrationality**:
    - Typically assumes perfect symmetry and known twins, so fails requirement 4 (unknown/large populations) and requirement 5 (partial similarity). 
    - Also fails requirement 2 (common cause vs. decision-procedure correlation).

  In summary, the list of requirements is stringent and may rule out many existing theories. The most challenging requirements are 3 (reference class) and 4 (large/unknown populations). Requirement 4 is likely the one that knocks out the most candidates because many theories assume a known, finite population.

  We now present the list in a structured way.
answer: |-
  Below is a structured list of requirements for a theory of evidential cooperation in large worlds, tailored to your purpose: evaluating whether an actual agent (without prior knowledge of similar agents, unable to inspect its source code, and deciding in real time) should treat evidential cooperation as a genuine reason to cooperate in one-shot dilemmas like a prisoner's dilemma. Each requirement includes a brief case/consideration, and I flag it as **non-negotiable** (essential for any minimally adequate theory) or **negotiable** (reflects trade-offs or camp biases). I then identify conflicts, hardest requirements, and biases.

  ---

  ### Requirements List
  1. **Thresholded Correlation Rationality**  
     - **What it must do**: Specify the minimum strength and type of correlation required between agents to make cooperation rational, as a function of the payoff structure (e.g., in a prisoner's dilemma, the correlation threshold should depend on the penalty for unilateral cooperation vs. mutual cooperation gains). Must be computable by a real agent (e.g., via estimating conditional probabilities like P(other cooperates | I cooperate)).  
     - **Case**: If payoffs make defection dominant under low correlation (e.g., high temptation payoff), but cooperation wins under high correlation (e.g., near-identical algorithms), the theory must output the switch point.  
     - **Status**: **Non-negotiable**. Without this, the theory isn't action-guiding.  

  2. **Decision-Procedure Correlation Isolation**  
     - **What it must do**: Distinguish correlations arising from shared decision procedures (e.g., same source code) from those due to common causes (e.g., shared fixed traits or environmental factors). Must not mistake "I am the kind of agent who cooperates" (smoking-lesion-style) for "my cooperation causes similar agents to cooperate".  
     - **Case**: In a lesion-like dilemma, if both agents have a genetic trait causing cooperation *and* correlated decisions, but their procedures aren't interactive, cooperation shouldn’t be incentivized.  
     - **Status**: **Non-negotiable**. Avoids fatal confusion between evidence and causality; core to large-world evidentialism.  

  3. **Non-Gerrymanderable Reference Class**  
     - **What it must do**: Define "similar agents" in a way that is robust to redescription, re-graining, or strategic partitioning (e.g., you can't artificially inflate cooperation by splitting your algorithm into sub-agents or narrowing the class to only perfect twins). Must handle vague similarity (e.g., "agents using comparable heuristics").  
     - **Case**: If you define your reference class as "all agents named Bob", cooperation fails (no real correlation); if defined as "exact code copies", it might never apply. The theory must avoid both extremes.  
     - **Status**: **Non-negotiable**. Gerrymandering breaks real-world applicability.  

  4. **Unknown/Infinite Population Handling**  
     - **What it must do**: Provide clear verdicts when the number of similar agents is unknown, enormous, infinite, or unmeasurable (e.g., via bounded rationality tools like sampling, confidence intervals, or dominance in infinite regimes). Cannot require exact counts or precise probabilities.  
     - **Case**: In a universe with infinitely many agents of varying similarity, or a large world where you can't list all "copies", the theory must still guide action (e.g., "cooperate if your best estimate of P(others cooperate | I cooperate) > threshold").  
     - **Status**: **Non-negotiable**. Real agents lack omniscience; theories that fail this are useless.  

  5. **Partial Similarity Degradation**  
     - **What it must do**: Handle asymmetric, noisy, or networked correlations (e.g., you’re 70% similar to agent A but 30% to agent B) and agents with imperfect self-knowledge (e.g., can't read own code). Outputs should degrade continuously (e.g., cooperation probability adjusts with correlation strength).  
     - **Case**: If you face multiple vaguely similar agents in a public goods game, cooperation should depend on aggregate evidence, not all-or-nothing clique membership.  
     - **Status**: **Non-negotiable**. Large worlds are messy; theories requiring perfect symmetry are unrealistic.  

  6. **Adversarial Robustness (Exploitability Defense)**  
     - **What it must do**: Withstand agents engineered to be "anti-correlated" with you (e.g., an adversary creates near-copies that defect if you cooperate). Must not recommend cooperation when adversaries make evidence misleading.  
     - **Case**: If an enemy builds agents mimicking your algorithm but hardwired to defect when you cooperate, cooperation becomes actively harmful.  
     - **Status**: **Negotiable**. Reflects a causalist/engineering bias; real large worlds may have few adversaries, but ignoring this risks recklessness.  

  7. **Rationality vs. Engineering Distinction**  
     - **What it must do**: Explicitly state whether it prescribes *rational action* (given beliefs) or *self-modification* (e.g., precommitting to cooperation). Must not conflate the two.  
     - **Case**: For an agent deciding now, the theory should answer "Should I cooperate?" not "Should I build myself to cooperate?" unless those are identical.  
     - **Status**: **Non-negotiable**. Your purpose focuses on rationality for actual decisions.  

  8. **N-Agent & Public Goods Generalization**  
     - **What it must do**: Scale to multi-agent dilemmas (e.g., public goods games) where your action provides evidence about many others, and correlations are partial or tiered (e.g., stronger links to some agents).  
     - **Case**: In a 100-agent dilemma where your cooperation signals 50 others, the theory must weigh evidence across the group.  
     - **Status**: **Non-negotiable**. Large worlds involve N>2; two-agent theories are toy models.  

  9. **Non-Reduction to Total Utilitarianism**  
     - **What it must do**: Fail to recommend cooperation in some large-world cases where total utilitarianism would endorse it (e.g., when correlation is too weak or payoffs don’t justify it), proving evidential cooperation is distinct.  
     - **Case**: In a dilemma with massive negative payoffs if others defect, evidential cooperation should sometimes still refuse—unlike utilitarianism, which might always cooperate if it expects net gains.  
     - **Status**: **Non-negotiable**. Otherwise, evidentialism is just utilitarianism in disguise.  

  ---

  ### Conflicts, Hardest Requirement, and Biases
  - **Key Conflicts**:  
    - Requirements **4 (unknown/infinite populations)** and **9 (non-reduction)** clash in infinite settings. E.g., theories might force total utilitarianism to handle infinity (e.g., "maximize expected utility over all agents"), violating 9.  
    - Requirements **2 (correlation isolation)** and **6 (adversarial robustness)** conflict when adversaries mimic decision-procedure links. Isolating "true" procedural correlation (2) might ignore anti-correlated copies (6), making exploitation possible.  
    - Requirements **3 (reference class)** and **5 (partial similarity)** strain together: defining a non-gerrymanderable class under gradations (5) invites arbitrariness (3).  

  - **Hardest Requirement**:  
    **4 (unknown/infinite populations)** knocks out the most candidates. Many theories (e.g., old-school superrationality) assume known/finite populations. Handling infinity often requires controversial tools (e.g., limits, priors over possible worlds) that break computability for real agents.  

  - **Biases in Requirements**:  
    - **Non-negotiable 2 (correlation isolation)** is often weaponized by causalists to dismiss evidentialism, but it's a genuine filter for smoking-lesion errors.  
    - **Negotiable 6 (adversarial robustness)** is a causalist/engineering desideratum. Evidentialists might argue adversaries are rare in large worlds, so this is overkill.  
    - **Non-negotiable 9 (non-reduction)** targets evidentialists: it prevents them from retreating to utilitarianism when evidential arguments get hard.  

  - **Impossibility?**  
    No full impossibility, but **joint satisfaction is unlikely**. Requirements 4 (infinity) and 3 (reference class) are the biggest bottlenecks. If a theory aces 3 and 4, it often fails 2 or 9.  

  ---

  ### Scorecard of Major Approaches  
  - **Evidential Decision Theory (EDT)**:  
    Fails 2 (smoking-lesion vulnerability) and 6 (exploitable by adversaries). Struggles with 3–4 (reference class/infinity). May satisfy 9 if it refuses cooperation in low-correlation cases. Not robust for large worlds.  

  - **Causal Decision Theory (CDT)**:  
    Rejects evidential cooperation entirely (fails 1, 8–9). Excels at 2 and 6. Useless for your purpose since it denies the premise.  

  - **Algorithmic-Identity (UDT/FDT)**:  
    Best candidate: handles 1 (thresholds via similarity metrics), 2 (focuses on algorithmic ties), 5 (partial similarity), and 8 (N-agent). Struggles with 3 (reference class ambiguities), 4 (infinity), and 6 (adversarial copies can hack "algorithmic similarity"). May violate 9 if it converges to utilitarianism.  

  - **Old-School Superrationality**:  
    Fails 3–5 (requires perfect symmetry/known twins) and 4 (infinite populations). Ignores 2 (vulnerable to common-cause correlations). Simple but not large-world ready.  

  ---

  **Bottom Line**: For your purpose—guiding a real agent in a large world—the hardest requirements are **reference class (3)** and **unknown populations (4)**. If a theory fails these, it's irrelevant. **Correlation isolation (2)** and **non-reduction (9)** are the best tests for genuine evidential cooperation. Algorithmic-identity theories come closest but aren't flawless. Your debate with your friend likely hinges on whether to prioritize robustness to adversaries (6) or accept evidentialism's fragility; this is where camps split.
