prompt: |-
  Here's one I've been chewing on since last Thursday and I can't get it to let go of me. I teach the grad seminar on causation most springs (not this one, thank god) and we had a work-in-progress last week by a colleague in the department — call him Dan — whose official topic was supposed to be omissions in tort law but who spent the whole hour arguing that omissions are never causes at all. Not "rarely causes" or "causes only in a derivative sense" — never. Our visitor from the law school went slightly purple. I've reconstructed his chain below as cleanly as I can, and it's starting to annoy me that I can't locate the break.

  (1) Causal facts are norm-independent. Whether A caused B cannot depend on what anyone was supposed to do, expected to do, or obligated to do; if it did, the causal story about a death would shift around every time we changed our mind about someone's duties, which gets the direction of explanation backwards — the duties are supposed to track the causal facts, not the other way round.
  (2) Omissions aren't events. There's no thing there to push, transfer energy, or produce an outcome; if an omission causes anything it has to be by counterfactual difference-making, so: my not watering the plant caused its death iff, had I watered it, the plant would have lived.
  (3) That test is passed by absolutely everyone. For any person P who in fact never watered the plant, had P watered it, it would have lived. So every human being on earth who could have got water to that plant — including people with no connection to me, my apartment, or the plant — comes out as a cause of its death, exactly as much as I do. Dan calls this the profligacy problem.
  (4) And there's no non-normative difference to sort them by. Not probability of watering (that's epistemic, and it's the same *kind* of difference either way), not spatial proximity, not my promise to water it, not my role as its owner — promises, roles and ownership are all norms. The only features that separate my ommission from the Queen's are normative ones.
  (5) So the options are: accept billions of omissions as causes, or let norms into the causal facts. Given (1), we have to go profligate.
  (6) But profligacy isn't a theory of causation, it's a confession. A causal claim that includes every absence of every unperformed preventive act tells you nothing about how the death came about, doesn't tell you where to intervene next time, and leaves "what caused the fire?" answerable only by listing everything in the universe that nobody did. A notion of cause that can't do explanatory or intervention-guiding work isn't the notion we had.
  (7) So omissions are never causes in the sense events are. "I killed the plant by not watering it" is shorthand for three separate facts: it died, I could have prevented it, and I was supposed to. Causation drops out entirely.
  (8) Corollary he was cheerful about: there is no causal difference between the person who holds a child's head under the water and the person who stands on the bank and does nothing but could easily help. Either neither causes the death, or both do, along with everyone else on earth. The distinction between killing and letting die is purely moral, not causal.

  Now: I think (8) is false, or at least that it costs more than the whole rest of the argument is worth, and I'd rather keep (1) than give it up, since norm-dependence really does seem to me like a category mistake about causation. My own move on the day was to say Dan is conflating causation with explanation — that causation is abundant and cheap and includes all those omissions, and that it's *explanation* and *attribution* where our interests and norms do the real work, so profligacy is fine and he should just buy it. He said fine, but then "caused the death" in a criminal statute becomes either trivially true of every bystander or a disguised moral judgment, and the notion isn't doing any work in the place we actually need it. I didn't have an answer to that and I still don't.

  So: which step do I give up, and what does giving it up cost me? I want you to go through the moves rather than just tell me the right view — if (4) is where it breaks, show me the non-normative difference I'm missing; if the argument is valid and I'm just stuck choosing, tell me which premise is cheapest to surrender and what I'd have to accept about killing and letting die, or about the norm-independence of causation, once I've surrendered it.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a philosophy professor who teaches a grad seminar on causation. Their colleague Dan presented an argument that omissions are never causes, which has left the user stuck since last Thursday. The user wants to identify where Dan's argument breaks down, especially since they find the conclusion in step (8) unacceptable—that there's no causal difference between actively killing and letting die.

  First, I need to understand Dan's chain of reasoning step by step. The key premises are: (1) Causal facts are norm-independent; (2) Omissions aren't events and rely on counterfactuals; (3) This leads to profligacy—everyone who could have prevented the outcome is a cause; (4) Only normative differences can distinguish between omissions; (5) Thus, we must accept profligacy or allow norms into causation; (6) Profligacy makes causation useless for explanation or intervention; (7) Therefore, omissions aren't causes; (8) Killing and letting die are causally identical.

  The user rejects (8) and wants to preserve (1), norm-independence. Their initial response was separating causation from explanation, but Dan countered that this makes legal causation trivial. The user needs a way out without sacrificing core principles.

  Hmm, the critical step seems to be (4). Dan claims there's no non-normative way to distinguish between omissions. But is that true? What about physical or structural factors? For example, spatial proximity or physical capabilities. If the Queen is in another country, her "omission" isn't physically relevant—she couldn't have watered the plant without a series of implausible actions. This introduces a non-normative baseline: what's physically possible or typical in a context.

  Also, in legal contexts, causation often involves "duty" as part of the causal structure. The user might distinguish between "cause-in-fact" (broad counterfactual dependence) and "proximate cause" (which includes normative elements for legal responsibility). This keeps causal facts norm-independent while allowing normative filters for attribution.

  Another angle: counterfactuals in step (3) might be too simplistic. We usually consider "closest possible worlds," so only relevant agents in the situation are considered. The Queen not watering isn't a relevant counterfactual because it's too distant from actual circumstances. This avoids profligacy without norms.

  The user's worry about legal statutes could be addressed by separating factual causation from legal causation. Factual causation includes all counterfactual dependencies, but legal causation requires additional elements like duty and foreseeability. So "caused" in law isn't purely causal but a hybrid concept.

  If the user gives up (1), they allow norms into causation, which might blur metaphysics with ethics. But if they adjust (4) by introducing physical baselines or contextual counterfactuals, they can keep causation norm-independent while avoiding profligacy. The cost is accepting that causation is context-sensitive but not norm-dependent.

  For step (8), distinguishing killing from letting die can be based on physical intervention. Active killing introduces a new force (energy transfer), while letting die doesn't. This maintains a causal difference without norms. The user can preserve the intuition that causation differs here, even if moral responsibility also plays a role.
answer: |-
  You're hitting the core tension in causal metaphysics that makes omissions such a notorious headache. Dan's argument is valid but not necessarily sound—the break is most productively at **step (4)**, where he claims there's *no non-normative difference* to sort profligate omissions. I'll walk through why, show you the non-normative fix, and map the costs of alternatives. Your instinct to preserve (1) is defensible.

  ### Where Dan's Argument Falters: Step (4)
  Dan is wrong that *only* norms distinguish your omission from the Queen's. There's a **physical-structural baseline** implicit in how we model counterfactuals and causation, grounded in *actual physical capacities and spatiotemporal relations*—not norms. This dissolves profligacy without smuggling in duties. Let's break it down:

  1. **The "Could Have" in Counterfactuals Isn't Bare Possibility**  
     When we say "had P watered the plant, it would have lived," we don't mean this applies to *any logically possible P*. We mean P in *this actual world*, with their *actual physical properties and location*. The Queen, in London, "could have" watered your plant *only* if we imagine her teleporting or orchestrating a chain of events wildly discontinuous with actual physics. But causation requires **modest modal excursions**—we hold fixed the actual world's physical structure except for minimal changes. Your proximity to the plant means watering it requires only minor, plausible adjustments (e.g., you walking to the sink). For the Queen, it would require rewriting laws of physics or global logistics.  

     **Non-normative filter**: Only agents *physically capable of intervening without radical world-alteration* satisfy the counterfactual. This excludes bystanders with no physical access.

  2. **Omissions Require a *Physical Opportunity Structure***  
     Your omission isn't just "not watering." It's "not watering *given that you were in a position where watering was physically manifest*." The plant is in your apartment; water is in your pipes; your body has arms. The Queen lacks this physical opportunity structure. We distinguish omissions via:  
     - **Spatiotemporal proximity** (you're co-located with the plant)  
     - **Physical capability** (you have hands, water access)  
     - **Causal pathway availability** (no barriers between you and watering)  
     These are objective, non-normative features. Norms (like ownership) might *track* these features, but they don't *constitute* them.

  3. **Result**: Profligacy dissolves. Your omission caused the death because in the nearest possible world where *you* act differently, the outcome changes. For the Queen, no nearby world has her watering your plant—it's too distant. The counterfactual test *already* embeds physical constraints.

  ### What This Costs You
  - **Commitment**: You must accept that causation is **context-sensitive**. The same physical omission (not moving muscles to pour water) might cause death in your apartment but not in the Queen's palace. This isn't norm-dependence—it's dependence on objective spatial-causal relations.  
  - **Consequence for (8)**: You *can* distinguish killing from letting die causally:  
    - **Killing**: The drown *actively introduces* energy/force (muscular effort holding the child underwater).  
    - **Letting die**: The bystander *fails to redirect* existing forces (water’s causal path continues unimpeded).  
    Both may be *causes* (if the bystander was proximate/capable), but they’re physically distinct: one adds a new cause, the other permits an existing one. The moral distinction isn’t *purely* non-causal, but causation isn’t identical.  

  ### Why Other Premises Are Harder to Surrender
  - **Give up (1) (Norm-independence)**: If causation depends on duties, you lose objectivity. Changing societal norms *would* alter whether your omission caused the death—e.g., if we abolish plant-owner duties, your inaction ceases to be causal. This guts causation’s role in *explaining* norms (e.g., "we have duties *because* inactions cause harm"). Cost: High. Makes causation subjective.  
  - **Give up (2) (Omissions aren’t events)**: Tough sell. Absences lack location, duration, or energy—they’re not "things" that push. If you insist they are, you need a new ontology (e.g., "negative events"). Cost: Metaphysical weight.  
  - **Give up (3) (Profligacy)**: The fix above avoids this, but if you bite the bullet, causation becomes useless (as Dan says). Cost: Unacceptable for explanation/intervention.  

  ### Handling Dan's Legal Objection
  When he says "caused the death" becomes trivial for bystanders:  
  - **Causation-in-fact** (counterfactual dependence) *is* broad: All proximate/capable non-actors might qualify.  
  - **Proximate/legal cause** adds **non-normative filters**: foreseeability, directness, and *physical opportunity*—not moral duties. The law *already* uses "duty" as a separate element (e.g., in negligence: duty + breach + causation). "Caused" in statutes can mean factual cause *plus* proximate cause, where proximity is physical, not moral.  

  **Example**: A stranger 10 feet from the drowning child "caused" the death factually (they could have saved them) but may lack *legal* causation if unforeseeable they’d help. The owner who didn’t fence a pit *is* a factual cause (counterfactually, fencing prevents harm) *and* proximate (their control over the risk creates physical responsibility). Norms guide *attribution*, not the causal fact itself.  

  ### Your Best Path Forward
  1. **Revise step (4)**: Use physical baselines to restrict counterfactuals.  
  2. **Preserve (1)**: Causation stays norm-independent.  
  3. **Accept** that causal claims are *interest-relative* (we focus on salient causes like those with physical opportunity), but not *norm-dependent*.  
  4. **Concede** that "letting die" can be causal (if physically proximate/capable) but is **physically distinct** from killing.  

  This keeps causation robust for explanation and law while avoiding Dan’s reductio. The cost is a nuanced view of counterfactuals—but that’s a feature, not a bug. If Dan insists the Queen’s omission *is* a cause, ask him to describe the *physical process* by which her inaction in London drained moisture from your plant. Silence here reveals the flaw in (4).
