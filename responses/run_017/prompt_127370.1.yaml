prompt: |-
  Hi — I'm a third-year PhD student in philosophy of physics (I work on the arrow of time, or at least that's what I say at parties) and I've managed to back myself into a corner with a seminar paper on Gödel, so I want someone to try to talk me out of it. I've been defending what I call the modal-withdrawal reading. Quick setup in case it's useful: his rotating-universe model is a homogeneous swirling-dust solution with a nonzero cosmological constant whose sign I can never remember, and in it the light cones tip over far enough from any given point that there are closed timelike curves running through, if I remember right, every point — no global time function, no way to slice the manifold into one ordered sequence of nows. The stock response in the literature is: cute model, but our universe expands, it doesn't rotate in the relevant sense, CTCs look like they need iffy energy conditions or get killed by quantum effects (chronology protection, stress-energy blowing up at the Cauchy horizon, whatever), so nothing follows about time. My reply is that all of those are contingent empirical claims about the actual world and the argument never needed the actual world. What it needs is: there is a physically possible world — possible in whatever sense physics itself licenses — in which the structure that temporal order is supposed to be admits no global earlier-than. If that's available, then objective becoming isn't part of what physics says the world contains, and the idealist moral goes through on modal grounds alone, which is why my superviser keeps saying I've made the argument unfalsifiable and I keep saying that's the point.

  I've now got a stock reply to every objection in the standard catalogue and I can deliver them in my sleep, which is exactly why I don't trust myself. So: what would actually count against the modal-withdrawal reading? I want the defeaters ranked from fatal to merely awkward, and I want you to separate the ones my side would itself concede from the ones we'd just wave away, rather than just listing what critics say. Here's where I've got to so far, so you can tell me what I've misranked and what I've missed. (1) The equivocation worry: physically possible can't just mean there's a model of the field equations, because there are models of everything; but if it means permitted by the actual laws, then the energy-condition and quantum-gravity results stop being contingent empirical claims and the reading collapses. Is there a stable middle, or is that the whole ballgame? (2) The actuality worry: even granted a CTC world, why is becoming in our world impugned? Is the argument secretly running on something like if a feature is absent somewhere in modal space it isn't real here, and does that have a stopping point — could I run the same argument against the objectivity of spatial distance using some other exotic solution, or against modality itself? If it over-generalises that far is that a reductio or a feature I should embrace? (3) The slide between grades of conclusion: physics doesn't represent passage; passage isn't real; temporal order itself dissolves and time is ideal in the full Kantian sense. Which is the reading actually committed to, and which of the three is the one that's exposed? (4) Two hypotheticals I made up and can't settle. (A) A no-CTC theorem drops tomorrow: any model reproducing some broad class of observed phenomena provably contains no CTCs, for reasons internal to semiclassical gravity plus unitarity. Decisive for us, or do we retreat to bare metaphysical possibility and carry on? (B) An isolated-pathology result: CTCs turn out to be possible only in models unstable to the tiniest perturbation, in the way a pencil balanced on its tip is possible. Is B worse for me than A, or less bad?

  Definately tell me if you think I'm just helping myself to whatever flavour of possibility keeps the argument alive — that's what I'd personally find most persuasive, this sense that the reading can be restated to absorb every empirical hit, and I genuinely can't tell whether that makes it a transcendental-style claim that's supposed to be insulated or a claim that's been qualified into nothing. Lead with your bottom line in the first sentence — the single strongest thing that counts against the reading, or your verdict that nothing much does — then the reasoning, then the ranked list at the end. No preamble, don't restate my question back at me, plain prose, and please don't tell me to go read so-and-so: I've read them, that's the problem.
