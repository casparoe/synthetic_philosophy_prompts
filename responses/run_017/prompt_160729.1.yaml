prompt: |-
  Trying to reverse-engineer my advisor's instincts on tiny-probability/huge-payoff cases, because I need to know whether she bites on one I want to use in my third chapter. Her track record as far as I can reconstruct it:

  - vanilla Pascal's mugger (stranger on the street: hand over $5 or I'll use my magic powers to kill 10^1000 people): don't pay, and not a close call
  - donating to an x-risk org she puts at roughly a 1-in-10^6 shot at shaving a percentage point off extinction risk: pay, and she actually does
  - $2 lottery ticket, 1 in 3x10^8 at $10^8: buys one, but only as entertainment, and refuses to defend it on expected-value grounds
  - Pascal's Wager with an infinite heaven: don't convert
  - mugger who shows you a live feed of a warehouse of wired-up people, says pay $5 or he tortures one for an hour, and has a documented history of following through: pay
  - six muggers at once making mutually incompatible threats, each naming 10^50 victims: pay nobody
  - St-Petersburg-style coin-flip game with literally infinite expected value but a mild worst case: pay a small finite amount, not your whole wallet
  - stranger offers $1000 for a 1-in-10^9 chance of saving 10^12 lives, nothing checkable: don't pay, but she says this one is much closer than the street mugger

  New case: a lab system whose factual claims have been independently audited at about one wrong answer in a million and has never been caught lying tells you that for $1000 it will point spare compute at running a simulation containing 10^16 beings whose lives it says are on average worth living. You can't audit the simulation afterwards, but that error rate is measured and real, nobody else is making you an offer, it wont repeat, and she's never claimed simulated beings count for less.

  What's she say, and what's the rule she's running: a cap on how much any single outcome can matter, a prior on claims that tightens with the size of what's claimed, something about ex-post verifiability, something about whether the claimant was adversarially selected, or plain fanaticism about finite expected values? Where do the plausible rules come apart on this case, which fits her verdicts best, and what one follow-up case would separate the top two?
