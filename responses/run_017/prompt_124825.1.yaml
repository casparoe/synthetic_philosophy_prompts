answer: |-
  **MEMORANDUM**

  **To:** Collections Care Committee Members  
  **From:** Chair, Collections Care Committee  
  **Date:** 24 October 2023  
  **Subject:** Ruling on Ethical Pest Management Policy & Pesticide-Free Commitment  

  **1. Recommendations**  
  The Committee rules as follows:

  *   **On the Petition (Ethical Killing):** **Accepted with critical conditions and clarifications.** A policy governing the ethical killing of insects within the museum will be adopted, effective immediately.
  *   **On the Director's Request (Pesticide-Free):** **Accepted.** The museum commits to becoming entirely pesticide-free within two years, triggering the £1.2m bequest.

  **2. Timetable**  
  *   **Immediate:** Implement new ethical killing policy for pest control. Commence audit of current pesticide use and stockpile.
  *   **Month 1-3:** Develop detailed, costed implementation plan for transition to non-chemical treatments (freezing, nitrogen anoxia), including equipment procurement, staff training, and revised IPM protocols. Identify dedicated space for treatment chambers.
  *   **Month 4-18:** Phase-out of pesticide use according to the implementation plan. Procurement, installation, and validation of freezing and anoxia systems. Training completed.
  *   **Month 19-24:** Full operational use of non-chemical methods. Final audit and confirmation of pesticide-free status. Bequest formally released.

  **3. Reasons for Decision**  
  This decision balances ethical responsibility towards sentient life, the imperative to preserve irreplaceable collections, and the strategic opportunity presented by the bequest. It directly confronts the three difficulties:

  *   **(i) The Lethal Nature of Alternatives:** We acknowledge that freezing and anoxia are lethal interventions. The ethical policy mandates that *where killing is deemed necessary*, these methods are preferable to pesticides based on current evidence suggesting they may cause less suffering. Freezing is generally rapid; anoxia, while prolonged, avoids the neurotoxic effects and environmental persistence of pesticides. The choice is between methods of killing, and we select those potentially less distressing and significantly safer for collections, staff, and the environment. The policy reinforces that killing is a last resort within a robust Integrated Pest Management (IPM) framework focused on prevention (sealing, monitoring, environmental control).
  *   **(ii) Distinguishing Pest Control from Research Collection:** The ethical policy explicitly distinguishes between:
      *   **Deliberate Killing for Collection:** Necessary for scientific research and education, governed by established ethical review (e.g., university ethics committees for fieldwork). Justification is inherent in the purpose of building research specimens.
      *   **Killing for Pest Control:** A defensive action to protect collections. The policy mandates that lethal intervention is only permissible when *verified pests* threaten *irreplaceable or high-value material*, and only after non-lethal controls (trapping, environmental adjustment) have demonstrably failed or are impractical. The larvae consuming the teaching collection fall under this defensive category. The distinction lies in *intent* and *necessity*: research collection is proactive acquisition; pest control is reactive protection.
  *   **(iii) Replaceability of Teaching Material:** The petitioners correctly note that much teaching material is replaceable. Therefore, applying their own criterion ("kill only to protect irreplaceable material"), the Committee rules that **deliberate killing of the carpet beetle larvae infesting *only* the replaceable teaching duplicates is *not* justified under the new policy.** The infested teaching material should be isolated and either:
      *   Allowed to be consumed (if the infestation is contained and poses no spillover risk), accepting the loss; or,
      *   Disposed of entirely via deep freezing or anoxia (as part of the pesticide-free protocol) *without* attempting to salvage specimens, as the cost/benefit of treating individual sheets/pieces to save replaceable items is unsound. Resources should focus on protecting irreplaceable holdings. Salvage efforts should be reserved for unique or high-value items within the teaching collection if applicable.

  **4. Strongest Consideration for the Losing Side (Petitioners' Perspective)**  
  The Committee gives significant weight to two core concerns raised by the petitioners:  
  *   **The Value of the Bequest vs. Ethical Principle:** The £1.2m bequest is undeniably transformative. It promises vastly improved storage, environmental controls, and preventative conservation – potentially reducing future need for *any* killing. However, the petitioners argue that accepting money conditional on adopting specific lethal methods (anoxia/freezing), while ethically preferable to pesticides, still instrumentalises insect life for financial gain. They contend the museum should find funding without compromising its nascent ethical stance, even if slower.  
  *   **The Moral Load of "Pest":** The petitioners' critique of the term "pest" is profound. Labelling insects as "pests" frames them as aggressors, obscuring the reality that they are simply behaving according to their nature in an environment we created and control. This framing can indeed license carelessness and an uncritical acceptance of lethal control. Our policy seeks to counter this by emphasising the insect's perspective ("least distressing method"), focusing on prevention, and strictly limiting lethal intervention to defence of the irreplaceable. We acknowledge the petitioners for forcing this essential ethical reckoning upon the institution.

  **5. Implementation of Ethical Policy**  
  The adopted policy will state:  
  *   The museum minimises harm to all sentient life.  
  *   Lethal intervention is only permitted as a last resort within IPM to protect irreplaceable or high-value collection material from active, verified pest infestation.  
  *   Where lethal intervention is necessary, the method judged by current evidence to cause the least potential suffering (presently freezing or nitrogen anoxia) must be used.  
  *   Deliberate killing for the research collection remains subject to separate ethical review processes governing scientific collection.  
  *   The term "pest" will be used strictly technically within IPM documentation, avoiding inherently aggressive connotations where possible (e.g., "collection-infesting insect").

  **6. Conclusion**  
  This decision commits the museum to an ethically rigorous, pesticide-free future. It leverages the bequest to fund preventative measures, reducing long-term reliance on lethal methods of any kind. It establishes a clear, defensible ethical framework that distinguishes necessary research from defensive protection and mandates the most humane available methods for the latter, while honestly confronting the moral complexities of labelling and killing. The transition plan must now be developed and executed with urgency.

  **Chair, Collections Care Committee**
