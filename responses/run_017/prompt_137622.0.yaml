  Okay, let me start by unpacking the user's query. They work in a policy unit dealing with historical justice measures, specifically official state apologies. The core confusion revolves around the selectivity of these apologies: why governments apologize for past actions but resist apologizing for current policies, and how they navigate inherited guilt versus continuity of obligations.

  First, I need to identify the implicit theories behind the existing practice. The user mentions contradictions—disclaiming guilt for past actions while upholding treaties and debts from the same era. They proposed two tests: the successor's proviso (undoing continuing effects) and a standing rule (living victims accepting the apology). The user wants to know if these tests align with or subvert the practice's underlying principles.

  I should break down the key elements: collective responsibility, state continuity, the nature of apology as a speech act, and standing. For collective responsibility, states seem to view themselves as enduring entities responsible for their institutional actions, not the moral guilt of individuals. This separates the state's institutional accountability from individual culpability.

  State continuity is crucial. Governments maintain that the state is the same entity over time, which justifies both inheriting obligations and apologizing for past wrongs. But this leads to the selectivity issue—accepting beneficial inheritances while rejecting blame. The apology acts as a speech act that requires acknowledgment of wrongdoing, acceptance of responsibility, and commitment to change. Any hedging undermines it, as noted by the user's examples of rejected apologies.

  Standing is another layer. The state must speak for the collective, and the recipients must have legitimate standing to accept. This ties into the user's proposed standing rule. But here's a snag: if a direct victim group no longer exists, who accepts the apology? The practice might rely on symbolic representatives, but the user's test requires living victims, which could exclude many historical wrongs.

  The user's successor's proviso ties apology to corrective actions. While aligning with the performative aspect of apologies, it might clash with cases where undoing harm is impossible. The standing rule addresses the recipient's legitimacy but risks making apologies for distant wrongs impossible. Both tests could impose consistency but might narrow the practice's scope.

  If a state abandons guilt entirely, treating apologies as forward-looking tools, the practice would shift. Apologies would become acknowledgments without responsibility, possibly with compensation as a practical measure. This might strip the emotional weight, making them less satisfying for victims seeking moral recognition.

  The user's deeper need seems to be finding a principled framework to evaluate when apologies are appropriate, avoiding arbitrariness. They might be grappling with justifying their unit's recommendations and ensuring consistency in policy. The unspoken need could be legitimacy—both for the state and their advisory role. They need a coherent theory to navigate political pressures and ethical demands, ensuring their advice isn't seen as arbitrary.
answer: |-
  Your analysis cuts to the heart of profound tensions in political philosophy and performative speech acts. The implicit theory underlying state apologies is not monolithic, but a complex, often unstable, amalgam of concepts. Here’s a reconstruction based on the structure of the practice you describe, with confidence assessments and critical distinctions:

  ### The Implicit Theory of State Apologies
  1.  **Collective Responsibility as Institutional, Not Personal:**
      *   **Presupposition:** The state is a continuous legal and institutional entity, distinct from the individuals who temporarily govern it. Responsibility attaches to the *institution* for actions undertaken in its name or through its machinery, even if the perpetrators are long dead. Guilt is explicitly *not* inherited personally by current citizens or officials.
      *   **How it Fits:** This explains why apologies for distant acts are possible – the *state-as-institution* is apologizing for *its own* past institutional conduct. It also explains the rejection of personal guilt claims against current individuals.
      *   **Underdetermined/Contested:** Does "institutional responsibility" imply *moral* culpability for the state entity itself, or is it purely a legal/political fiction acknowledging harm causation? The practice leans towards the latter but uses the language of the former. *(Confidence: High on institutional framing; Lower/Contested on the nature of "state guilt")*
      *   **Selectivity Paradox:** This clashes with the *beneficial* inheritance (treaties, debts, territory). The implicit theory here is one of *continuity of legal personality and obligation*, not necessarily *moral* continuity for wrongs. The state selectively applies "institutional continuity" for benefits but tries to limit "institutional culpability" for wrongs – a tension the practice papers over.

  2.  **State Continuity Through Succession:**
      *   **Strict Presupposition:** The modern state is the *legal successor* to the predecessor regime(s) that committed the wrong, regardless of governmental or constitutional changes (e.g., monarchy to republic). The state endures as a single juridical person.
      *   **How it Fits:** This is foundational. Without this continuity, the current government lacks the *standing* to apologize *for the state* for past acts. It justifies the "we" of the apology referring to the enduring state entity.
      *   **Underdetermined:** The *basis* for this continuity claim is often historical/political expediency rather than a rigorous philosophical theory (e.g., territorial control, acceptance by population/international community). *(Confidence: High)*

  3.  **Apology as a Performative, Not Just Descriptive, Speech Act:**
      *   **Strict Presupposition:** An official state apology is not merely describing regret; it is *doing* something. It is a performative utterance where the act *is* the apology. Its success depends on felicity conditions:
          *   **Authority:** The speaker must have standing to speak *for the state* (hence importance of Head of Government/State in the legislature).
          *   **Sincerity:** The words must conform to the illocutionary force of an apology (accepting responsibility, expressing remorse, seeking forgiveness). Hedging ("regret," contextualizing) violates this, rendering it infelicitous ("null").
          *   **Uptake:** It must be directed towards and recognized *by the wronged group* (or their legitimate representatives) *as* an apology. Their acceptance (or rejection) is part of the act's completion. Hence the negotiation over wording, venue, and presence.
      *   **How it Fits:** This explains the meticulous negotiation, the rejection of hedged statements, and the insistence on the *words themselves* as a distinct "good" alongside compensation. Compensation addresses material harm; the apology addresses moral/political harm and recognition.
      *   **Underdetermined:** What constitutes "sincerity" for an abstract entity? The practice substitutes formal, public utterance by the highest authority following negotiation as the operational proxy for sincerity. *(Confidence: High on performative nature; Moderate on "sincerity" proxy - this is the claim I'm least sure of, as interpretations of the "real" intent behind the ritual vary widely)*

  4.  **Standing to Give and Receive:**
      *   **Strict Presupposition:**
          *   *To Give:* Only the current government, acting *as* the authorized representative of the continuous state entity, has standing to issue an apology *for the state's* past acts.
          *   *To Receive:* The apology must be directed towards the specific group(s) harmed by the state's past act. Their recognition (or that of their unambiguous, accepted representatives) is essential for the felicity/uptake of the speech act. This group has standing due to *direct victimhood* or *unbroken communal descent*.
      *   **How it Fits:** Explains why an apology by a lesser official is rejected, and why the specific affected group's presence and acceptance matter.
      *   **Underdetermined:** How far does "communal descent" stretch? Who represents a group generations later? The practice relies on political negotiation and recognition to resolve this, not a fixed principle. *(Confidence: High on the principle; Lower on how descent/representation is determined in practice)*

  ### Evaluating Your Proposed Tests Against the Implicit Theory
  1.  **The Successor's Proviso (Apology only if continuing effects undone):**
      *   **Coherence:** Aligns *partially* with the performative nature. A sincere apology implies commitment to repair. Undoing continuing effects strengthens the sincerity and performative force. It resonates with the idea that the apology is part of justice, not just words.
      *   **Subversion/Arbitrariness:** It subtly *shifts* the core act. The implicit theory focuses on the *acknowledgment of past wrong and responsibility* by the enduring state. Your proviso makes the apology contingent on *contemporary remedial action*. This could:
          *   Exclude apologies where undoing harm is impossible (e.g., massacres).
          *   Confuse the act of *apology* (for the past) with the act of *remedy* (for the present consequences). While linked, the implicit theory treats them as distinct (though ideally concurrent) goods.
          *   Be seen as arbitrary: Why is this the *threshold* for the word "apology" vs. "acknowledgment"? The implicit theory's threshold is the performative utterance meeting its felicity conditions.
      *   **Verdict:** It imposes a stricter, potentially valuable, ethical standard but subtly redefines the core speech act presupposed by the current practice. It doesn't fully cohere.

  2.  **Standing Rule (Only apologize if living victim/institution can accept):**
      *   **Coherence:** Directly addresses the "uptake" condition of the performative act. Without a recipient capable of accepting, the apology risks being infelicitous or purely symbolic in a void. It grounds the apology in an existing relationship.
      *   **Subversion/Arbitrariness:** This *severely limits* the scope of apologies the implicit theory otherwise allows. The implicit theory relies on *communal descent* and *representation*. Your rule would prevent apologies for wrongs where the *direct* victims and their immediate children have died (e.g., many colonial atrocities, distant genocides), even if the *group* persists and demands recognition. It privileges individual lifespan over group continuity, which the practice currently accepts. Who defines a "continuing institution" with standing to accept for long-dead victims?
      *   **Verdict:** Coheres strongly with the *recipient* side of the uptake condition but conflicts with the broader *communal/representative* model of standing used in practice for historical wrongs beyond living memory. It makes principled sense but would dramatically curtail the practice.

  ### Abandoning "Guilt": Apologies as Purely Forward-Looking Instruments
  If a state explicitly rejected *any* notion of inherited responsibility or guilt for past acts, treating apologies solely as tools for future harmony, the practice would fundamentally change:

  1.  **Language Shift:** "Apology" language would vanish. Terms like "acknowledgment," "recognition of historical suffering," "expression of sorrow," or "reconciliation statement" would replace it. The core performative act of *accepting responsibility* would be excised.
  2.  **Reduced Weight of Words:** If words are purely symbolic gestures without an admission of fault, their precise wording and the authority of the speaker become less critical. The demand for the *words themselves* as a distinct good diminishes.
  3.  **Compensation Dominance:** Material redress would become the primary, if not sole, focus. The "apology" would be a ceremonial accompaniment to the compensation package, devoid of independent moral/political significance.
  4.  **Easier Hedging:** Statements could freely include contextualization, expressions of regret rather than apology, or balancing narratives without violating sincerity (as there's no responsibility to be sincere *about*).
  5.  **Reduced Negotiation/Uptake Requirement:** If the statement isn't an apology needing acceptance, the need for negotiation with victims' groups over wording and the insistence on their presence/acceptance weakens significantly. It becomes a unilateral declaration.
  6.  **Loss of Moral Recognition:** The core function for victims' groups – official recognition *by the perpetrator state* of its wrongful acts and responsibility – would be absent. This would likely render the gesture hollow and potentially offensive, failing to achieve the reconciliation it aims for.

  **In essence:** Abandoning guilt turns the "apology" into a historical acknowledgment combined with a contemporary welfare or reconciliation policy announcement. It severs the crucial link between the enduring state, its past institutional actions, and the moral recognition sought by victimized groups. The performative power and distinct value you observe in the current practice stem precisely from the (often unstable and contested) premise that the state *can* bear a form of responsibility for its past. Remove that, and the practice collapses into something fundamentally different and likely far less satisfying to those demanding the apology. *(Confidence: High on the consequences of abandoning guilt-bearing)*

  The practice operates on an unstable equilibrium of institutional continuity, performative speech acts, negotiated recognition, and selective application of responsibility. Your proposed tests aim for greater consistency but would reshape the practice significantly, particularly the standing rule. The deepest tension remains the state's simultaneous reliance on continuity for legitimacy/benefit and its instinctive limitation of continuity when it implies culpability.
