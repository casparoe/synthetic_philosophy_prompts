prompt: |-
  I work as the scientific secretary to the programme-grant panel of a national research council. We award five-year grants to what we call programmes rather than projects: a group gets funded to pursue a line of work, and at the mid-term and renewal points we decide whether to continue, cut, or redirect. The volume is real: about forty proposals a cycle, roughly ninety minutes of panel time each, a panel made of working scientists and clinicians with no philosophy of science training and no patience for it, and a requirement that every decision be written up in a page of plain language that a losing applicant can read without needing a primer. Since a row a few years ago about metric-gaming, we are also forbidden to use impact factors, citation counts, or h-indices anywhere in the deliberation, which removes the proxy everyone actually relied on and has left the panel falling back on vibes about whether a field feels exciting.

  I want to turn Lakatos's methodology of research programmes into something we can actually run. I read him once in graduate school and remember the skeleton: a programme has a hard core its practitioners will not let be refuted, a belt of auxiliary hypotheses that absorbs the damage, a negative heuristic telling them what not to aim at, and a positive heuristic that is supposed to be a standing plan for building models rather than a list of repairs. A programme is progressive when its successive versions predict something new and some of the new things hold up, and degenerating when it only ever patches after the fact, with the belt growing to fit data everyone already had. Elimination is comparative and slow: a rival has to explain what its predecessor explained plus something more, and Lakatos says somewhere that there is no such thing as instant rationality, that a programme can only be appraised with hindsight over decades. My own temptation is crude: count the work packages that predict something not yet known against the ones that merely accommodate an anomaly someone already published, and fund whichever number is bigger. I suspect that is too crude in at least three ways — it rewards volume of prediction over weight, it has no answer for a group proposing to spend five years building the instrument or the mathematics needed to make the prediction at all, and it gives us nothing for a consortium that generates predictions continuously but absorbs every failure as a technicality, which looks to me less like a programme than like machinery for never being wrong.

  So please give me the procedure itself, in the order we would run it: the questions in sequence, what counts as a sufficient answer to each, where it returns a clear no, and where it has to stop and hand the decision to a person because the issue is one of values or temperamental patience rather than method. I need it to work from the documents we actually have — the proposal, the track record section, and the group's own account of what they would abandon if forced — and to say how to recover the hard core and the positive heuristic from those, including what to do when a proposal is written in a way that conceals them, since applicants quickly learn that admitting to a hard core sounds dogmatic. I would also like it to be honest about what it cannot do: I assume it cannot compare programmes in different fields, cannot say whether a core is true, and cannot tell us how long to wait, and I would rather have those limits named in the write-up than have a panel member discover them mid-meeting. Then run it on three anonymised cases from our last cycle. Programme A is a thirty-year-old line of work, still prolific, whose last three novel predictions failed and which now proposes another two years of re-deriving old measurements under a revised correction term; the panel reveres its founder, who is retiring, and I do not want the answer I expect. Programme B proposes to point an automated pipeline at a large class of datasets, will produce forecasts constantly, and treats every miss as a specification issue to be retrained away; I am unsure whether this is even an appraisable programme or whether the procedure should return a different kind of verdict, something like nothing here to evaluate. Programme C has produced no confirmed novel fact in nine years and says the blocking computation is not yet feasible, but its five-year plan is a genuinely ordered sequence of simplified models that would eventually make the prediction, and it is the one case where I think hindsight might vindicate them. If the procedure's verdicts on these three are ones I should overrule, say so, and say which verdict goes and why.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work as a scientific secretary for a research council panel that awards long-term grants. The panel struggles with evaluating research programmes without relying on metrics like impact factors, which are now banned. They mention using "vibes" about whether a field feels exciting, which isn't reliable. The user wants to apply Lakatos's philosophy of research programmes in a practical way.

  First, I need to recall Lakatos's key concepts: hard core, protective belt, positive/negative heuristics, progressive vs. degenerating programmes. The user already summarized these, so they have a good grasp but need a method to operationalize it. The challenges they face include panelists without philosophy training, time constraints, and the need for plain-language write-ups.

  The user’s crude idea is counting predictive vs. accommodative work packages. They rightly point out its flaws: volume over weight, ignores infrastructure development, can't handle perpetual prediction machines. So the procedure must address these. Also, applicants might hide their hard core to avoid sounding dogmatic, so the method needs a way to uncover that.

  Looking at the three cases: Programme A is established but failing, with reverence for the founder. Programme B is an automated pipeline that constantly retrains, possibly not a Lakatosian programme. Programme C hasn’t produced new facts but has a structured plan. The user wants honest limitations and practical steps.

  I need to structure a step-by-step procedure. Start by identifying the hard core. Since applicants might obscure it, use their "abandon if forced" statements and track record to infer. Then, check for a positive heuristic—specific plans for model-building, not just fixes. Differentiate between genuine predictions and accommodations. Handle cases where predictions are delayed by necessary tools or math.

  For Programme B, it might not fit Lakatos's framework. The procedure should flag such cases as "non-appraisable" under this method. Programme C’s structured models might show a progressive heuristic despite no predictions yet. The panel might need to assess the feasibility of their computational plan.

  Limitations: Comparing different fields is impossible. Truth of the core isn’t judged; only progress. Timeframes are tricky—panels must decide without decades of hindsight. The procedure should explicitly state these limits.

  Applying to cases: Programme A likely degenerating due to repeated failed predictions and no new content. Programme B isn’t a research programme; it’s a tool. Programme C could be progressive if their models are steps toward predictions. But the panel might overrule if they value founder’s legacy (A) or trust C’s potential despite delays.

  The user’s deeper needs: They want a fair, structured process that avoids bias and "vibes." They need buy-in from busy scientists, so simplicity is key. Also, the write-up must justify decisions clearly to applicants, preventing disputes. Honesty about limits builds trust within the panel.
answer: |-
  Here's a procedural implementation of Lakatosian appraisal, designed for your panel's constraints. It focuses on observable behaviours within the proposal, track record, and stated abandonment points, avoiding metaphysical debates.

  **The Lakatosian Programme Appraisal Procedure (LPAP)**

  **Input:** Proposal Document, Track Record (Publications, Preprints, Patents), "Abandon if Forced" Statement (Mandatory Section)

  **Output:** One of: `PROGRESSIVE`, `DEGENERATING`, `INDETERMINATE (HIGH-RISK)`, `NOT A RESEARCH PROGRAMME (TOOL/DATA FACTORY)`, plus key reasoning points for the plain-language write-up.

  **Procedure Steps (Sequential Questions):**

  1.  **Identify the Hard Core (HC):**
      *   **Question:** What is the *non-negotiable core belief* this group will *never* give up, even in the face of contradictory evidence? What would abandoning this mean the end of the entire programme?
      *   **Sources:**
          *   Explicitly stated HC in proposal (rare).
          *   "Abandon if Forced" statement: What *isn't* listed here? The HC is what they refuse to abandon.
          *   Track Record: Identify the central, unchanging theoretical commitment across their major publications. Look for statements like "Assuming the fundamental principle of X..." or critiques they consistently reject.
          *   Proposal Aims: What is the foundational assumption underpinning all aims?
      *   **Sufficient Answer:** A concise (1-2 sentence) statement of a core theoretical principle or mechanism that is *fundamental* and *protected*.
      *   **Clear No (Stop - INDETERMINATE):** No identifiable core principle beyond vague goals ("understand cancer," "model climate"). Core principle is purely methodological ("use AI"). Core principle shifts dramatically within track record.
      *   **Handoff to Person:** Interpretation of vague statements. Is "X is the primary driver" a core belief or a testable hypothesis? (Person decides based on consistency in docs).

  2.  **Identify the Positive Heuristic (PH):**
      *   **Question:** What is the *pre-defined, constructive strategy* for generating new models, experiments, or predictions *independently of immediate anomalies*? Is it a plan for building, or just a list of fixes?
      *   **Sources:**
          *   Proposal Methodology: Look for a *sequence* of model development, experimental designs logically building in complexity, or theoretical explorations mapped out *ahead of time* based on the HC.
          *   Track Record: Does past work show a logical progression of model building or experimental sophistication driven by the HC, or just reactive papers addressing specific problems?
          *   Work Packages (WPs): Do WPs describe *building* new tools/models to explore the HC's implications, or are they primarily *testing* specific hypotheses or fixing issues?
      *   **Sufficient Answer:** A description of a planned sequence of model development, experimental refinement, or theoretical exploration logically derived from the HC, aiming to extend its scope/predictive power *proactively*.
      *   **Clear No (Stop - DEGENERATING or NOT PROGRAMME):** Methodology is purely reactive ("we will address criticism X," "we will recalibrate instrument Y"). Work is entirely application-focused or data-collection focused without model-building intent. Method is "try everything with this new tool."
      *   **Handoff to Person:** Judging whether a proposed sequence of simplified models (like Case C) constitutes a genuine PH or just kicking the can down the road. (Person assesses plausibility and novelty potential).

  3.  **Assess Novel Predictions vs. Accommodations (Track Record & Proposal):**
      *   **Question:** Over the last ~5 years (track record) and in the proposed work (WPs), what is the *net balance* of genuinely *novel predictions* (risky, testable, unforeseen) versus *accommodations* (explanations for *known* anomalies, post-hoc fixes, re-derivations)?
      *   **Sources:**
          *   Track Record Publications: Scrutinize Introduction/Methods: Was the experiment/model designed *before* the key result was known, specifically to test a novel prediction? Or was it designed *because* of a known anomaly/result? Look for phrases like "surprisingly," "contrary to expectation," "we predicted."
          *   Proposal WPs: For each WP: Does it aim to *test a specific, pre-defined novel prediction* stemming from the PH/HC? Or does it aim to *explain* a known puzzle, *improve* an existing model's fit to *old* data, or *apply* an existing model to a *new* (but predictable) domain? Flag WPs focused on building tools/methods *explicitly for future prediction* under PH as "Predictive Infrastructure" (not prediction/accommodation).
      *   **Sufficient Answer:** Evidence of at least one *confirmed* novel prediction in track record. Proposal contains WPs with clear, testable novel predictions derived from PH. "Predictive Infrastructure" WPs are justified as essential for specific future predictions within the PH.
      *   **Clear No (DEGENERATING):** Track record shows *only* accommodations of known problems or failed novel predictions *without* generating new, confirmed ones. Proposal WPs are *overwhelmingly* (>75%) accommodations, re-derivations, or applications without novel predictions. Failed predictions are dismissed without learning/changing the belt.
      *   **Handoff to Person:** Weighting the significance/risk of proposed novel predictions. Judging whether failed predictions were "severe tests" or due to technical glitches. Assessing the justification/necessity of "Predictive Infrastructure" WPs. (Person assesses scientific judgment/feasibility).

  4.  **Assess Belt Management (Responsiveness):**
      *   **Question:** When faced with anomalies/failed predictions, does the programme adjust the *auxiliary belt* (methodology, assumptions, instruments) in ways that *lead to new predictions* via the PH, or do adjustments *only* protect the HC without generating new content (increasing complexity, adding epicycles)?
      *   **Sources:**
          *   Track Record Response to Criticism/Failure: Do papers explicitly address failures by refining models/methods *and then propose new tests/predictions* based on the refined approach? Or do they add complexity solely to fit existing data?
          *   Proposal: Does it address past failures? If so, does the proposed adjustment (e.g., a "revised correction term") *enable a specific novel prediction* in the current proposal, or is it just applied to re-do old work?
      *   **Sufficient Answer:** Past adjustments demonstrably led to new predictions (even if some failed). Proposed adjustments are linked to enabling specific novel predictions in the current plan.
      *   **Clear No (DEGENERATING):** Adjustments only ever serve to fit existing data better. Belt complexity increases without new predictive output. Failures are blamed solely on external factors without any belt refinement. Proposal ignores past failures or just re-tests old ground with tweaks.
      *   **Handoff to Person:** Judging whether a belt adjustment is a necessary step within the PH or an ad-hoc fix. (Person assesses logic and connection to PH).

  5.  **Overall Programme Trajectory Verdict (Synthesis):**
      *   `PROGRESSIVE`: Clear HC & PH identified. Net positive novel predictions in track record (some confirmed). Proposal dominated by novel prediction WPs and justified predictive infrastructure. Belt adjustments fuel new predictions.
      *   `DEGENERATING`: Clear HC, but PH weak or absent. Track record dominated by accommodations/failed predictions without generating new confirmed ones. Proposal dominated by accommodations/re-derivations. Belt adjustments only protect HC without new content. (*Even if prolific!*)
      *   `INDETERMINATE (HIGH-RISK)`: HC & PH identifiable, but track record shows no/few novel predictions *yet* (e.g., building phase). Proposal relies heavily on high-risk "Predictive Infrastructure" or highly ambitious predictions with high chance of failure. *Potential* for progress, but high uncertainty. (Case C often lands here).
      *   `NOT A RESEARCH PROGRAMME (TOOL/DATA FACTORY)`: Fails Step 1 or 2. No identifiable HC beyond methodology. "PH" is just applying a tool/algorithm to different datasets. Work is purely descriptive, data-driven forecasting without underlying theoretical model-building. Output is primarily data/products, not tested theoretical knowledge. (Case B often lands here).

  **Explicit Limitations (To State in Panel Guidance):**

  1.  **Field Comparability Impossible:** LPAP cannot judge if Programme X in Neuroscience is "better" than Programme Y in Materials Science. It assesses *internal* progress within a programme's own terms.
  2.  **Truth Unknown:** LPAP does **not** assess if the Hard Core is "true" or "likely true." It assesses whether pursuing it is generating progressive knowledge *growth*.
  3.  **Hindsight Required (The Time Problem):** Lakatos insists decades may be needed. LPAP uses the *best available recent evidence* (5 yrs track record + proposal) to judge *current trajectory*, not ultimate truth. Panels *must* make decisions with imperfect foresight.
  4.  **Values/Patience:** LPAP flags `INDETERMINATE (HIGH-RISK)`. The panel *must* decide if the potential payoff justifies the risk/delay, based on scientific vision and strategic priorities – this is beyond methodology.

  **Application to Cases:**

  *   **Programme A (30 yrs, revered founder, failed predictions, re-derivation):**
      *   **Step 1 (HC):** Likely identifiable (e.g., "Mechanism X is the fundamental driver of Process Y"). Clear.
      *   **Step 2 (PH):** Historical PH likely clear, but current proposal lacks one. Focus is on re-derivation/refinement, not building new models/predictions. **Weak/None.**
      *   **Step 3 (Predictions):** Track record: Last 3 novel predictions *failed*. Proposal: WP is re-deriving old measurements under revision – **purely accommodative** (explaining known anomalies with a tweak). **Net Negative.**
      *   **Step 4 (Belt):** Adjustment (revised term) is proposed *only* to re-do old work, not to enable a new prediction. **Degenerative Belt Adjustment.**
      *   **Step 5 (Verdict):** `DEGENERATING`. Despite history and reverence, the *current trajectory* is degenerative: core is protected, but no novel predictions, only accommodation of old data.
      *   **Overrule?** Probably not. LPAP verdict is sound. Overruling risks rewarding reputation over current scientific progress. Write-up must focus on *recent* lack of novel predictive success and purely refinement-focused plan.

  *   **Programme B (Automated Pipeline, Constant Forecasts, Retrains Misses):**
      *   **Step 1 (HC):** Likely fails. Core is methodological ("Our pipeline/algorithm Z is powerful"). No non-negotiable *theoretical* core about the phenomena being forecast. **Unclear/Non-Theoretical.**
      *   **Step 2 (PH):** "Apply pipeline to more data, retrain on misses." This is *reactive problem-solving*, not a plan for building explanatory models. **Not a PH (Reactive Fixes).**
      *   **Step 3/4:** N/A - Fails Step 1 & 2.
      *   **Step 5 (Verdict):** `NOT A RESEARCH PROGRAMME (TOOL/DATA FACTORY)`. It's developing/applying a forecasting tool, not a Lakatosian research programme. Evaluation needs different criteria (e.g., technical robustness, utility, data quality).
      *   **Overrule?** No. The LPAP correctly identifies the nature differs. The panel needs a separate framework for evaluating tools/data factories (e.g., benchmark performance, scalability, user need).

  *   **Programme C (No Novel Fact in 9yrs, Blocking Computation, Sequence of Models):**
      *   **Step 1 (HC):** Likely identifiable (e.g., "Phenomenon Q is governed by ultra-complex mechanism R requiring exascale simulation"). Clear.
      *   **Step 2 (PH):** Proposal describes a "genuinely ordered sequence of simplified models" building towards the prediction. **Potentially Strong PH** (if sequence is logical and incrementally builds capability).
      *   **Step 3 (Predictions):** Track record: No confirmed novel facts. Proposal: WPs are building blocks (simplified models, code development). Explicit novel prediction WP is deferred until final models/tools are built. **Net Zero (Predictive Infrastructure focus).**
      *   **Step 4 (Belt):** Past "failures" likely framed as computational limitations, not theoretical anomalies. Proposal addresses this via the model sequence. **Belt adjustment (computational strategy) enabling future prediction.**
      *   **Step 5 (Verdict):** `INDETERMINATE (HIGH-RISK)`. Clear HC & PH. No recent predictive success, but a coherent plan exists with the *potential* for novel predictions. High risk (computational feasibility, models might not scale).
      *   **Overrule?** **Yes, potentially.** LPAP verdict is correct (`INDETERMINATE`). This is where panel *values* and *patience* are crucial. If the HC is deemed fundamental, the PH is rigorous, and the computational path is plausible, the panel might fund based on high potential payoff despite the long drought and risk. The LPAP forces explicit acknowledgment of the risk/delay but doesn't forbid funding.

  **Why this works for your panel:**

  *   **Concrete:** Focuses on documents (proposal, track record, abandonment statement).
  *   **Sequential:** Logical flow, stops early if clear fail states.
  *   **Plain-Language Output:** Verdicts (`DEGENERATING`, `NOT PROGRAMME`) and reasoning points (e.g., "lacks novel predictions," "focuses on refining past results," "is primarily a tool development project") are translatable.
  *   **Honest:** Explicitly states limits (comparison, truth, time).
  *   **Values Separation:** Flags `INDETERMINATE (HIGH-RISK)` where panel judgment on risk/vision is essential.
  *   **Anti-Gaming:** Focuses on the *nature* of work (prediction vs. accommodation, model-building vs. fixing) rather than volume. Hard core inferred from what they *won't* abandon.

  The key adoption challenge will be training panelists to rigorously dissect proposals/track records for HC, PH, and the prediction/accommodation distinction – shifting from "is this cool?" to "is this programme generating *new* knowledge predictively?". The structured steps and clear verdicts make this feasible.
