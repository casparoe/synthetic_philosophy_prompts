answer: |-
  Here’s a distilled, position-taking framework for your contract default bargaining rule, focusing on **desiderata for arbitration under estimation error**. I’ll address your queries in order, flagging settled vs. contested points, and conclude with a scorecard.  

  ---

  ### **1. Interpersonal Comparability**  
  - **The Issue**: Scale-invariance (invariance to independent affine transformations of utilities) is mathematically elegant but **not a genuine desideratum** when payoffs are in comparable units (dollars, GPU-hours). It’s a relic of vNM utility frameworks where cardinal scales are arbitrary.  
  - **Dropping It Changes Everything**:  
    - **Maximizing total surplus** becomes defensible (even optimal) if efficiency is prioritized.  
    - **Equal split of gains** (from disagreement point) stops being "arbitrary" and emerges as a natural contender under symmetry.  
  - **Non-negotiable for your purpose?** **No.** Insist on rules requiring only *cardinal comparability* (common units), not scale-invariance.  

  ---

  ### **2. Desiderata Breakdown**  
  | Desideratum                          | Real Requirement or Redundant? | Non-Negotiable? | Key Consideration |  
  |--------------------------------------|--------------------------------|-----------------|-------------------|  
  | **Insensitivity to unattainable ideals** | Distinct gripe (not IIA). Targets *ideal-point rules* (e.g., KS). | **Yes** | Arbitrator’s noisy estimates could exaggerate ideals, distorting outcomes. KS fails this. |  
  | **Carve-up invariance**              | Real (≈ path independence). | **Preference** | Prevents gaming via issue packaging. Nash satisfies; KS often doesn’t. |  
  | **No gain from splintering**         | Real (merges with *coalitional stability*). | **Non-negotiable** | Stops parties fragmenting to extract concessions. Nash/KS satisfy; total max may not. |  
  | **Robustness to estimation error**   | **Core requirement for you.** | **Non-negotiable** | Arbitration hinges on stability under noise. Pareto efficiency *must* be relaxed (see tension below). |  
  | **Lumpiness (indivisibility)**       | Real. | **Non-negotiable** | Solutions must specify deterministic outcomes or fair randomization. Nash/KS struggle; total max handles it better. |  

  - **Robustness vs. Pareto Efficiency Tension**:  
    - Exact Pareto efficiency is **incompatible with robustness** under noisy feasible sets.  
    - *Solution*: Demand "**ε-Pareto efficiency**" (no alternative improves both by >ε) or "**security against large errors**" (outcome shifts by O(ε) if data is ε-noisy).  

  ---

  ### **3. Monotonicity vs. IIA: The Impossibility**  
  - **Smallest Unsatisfiable Set**: Pareto Efficiency (PE), Symmetry (SYM), Monotonicity (MON), Independence of Irrelevant Alternatives (IIA).  
  - **Conflict Example** (Airport Game):  
    - Two players: Disagreement point (0,0).  
    - Feasible Set A: {(1,0), (0,1)} (split $1 unevenly).  
    - Feasible Set B: Adds (0.6, 0.6) (now can split evenly).  
    - **Nash** (PE+SYM+IIA): Picks (1,0) in A, (0.6,0.6) in B → violates MON (Player 2 gains in B but gets less).  
    - **KS** (PE+SYM+MON): Picks (0.5,0.5) in A? (violates IIA if defined), or (1,0) → messy.  
  - **Verdict**: For arbitration, **MON is more important than IIA**. IIA risks instability under estimation error (adding phantom alternatives).  

  ---

  ### **4. Most Discriminating Desideratum**  
  - **Narrows the field most**: **Robustness to estimation error**.  
    - Kills KS (overreacts to noisy ideal points).  
    - Challenges Nash (sensitive to frontier curvature).  
    - Favors total max or equal gains if feasible set is "regular."  
  - **Secretly doing nothing**: **Carve-up invariance**. Often implied by other axioms (e.g., Nash satisfies it).  

  ---

  ### **Solution Scorecard**  
  | Criterion → Solution ↓ | Insens. unattain. ideals? | Carve-up inv.? | No splinter gain? | Robust to noise? | Handles lumpiness? |  
  |------------------------|---------------------------|----------------|-------------------|------------------|---------------------|  
  | **Nash**               | ✓                         | ✓              | ✓                 | ✗ (fragile)      | ✗ (needs convexity) |  
  | **Kalai-Smorodinsky**  | ✗ (fatal)                 | ✗ (often)      | ✓                 | ✗ (worse)        | ✗                   |  
  | **Maximize Total**     | ✓                         | △ (if additive)| △ (coalition issues) | ✓ (if convex)     | ✓ (discrete opt.)   |  
  | **Equal Gains**        | ✓                         | △ (depends)    | ✓                 | ✓                | ✓ (simple splits)   |  

  **Notes**:  
  - ✓ = Satisfies; △ = Mixed/context-dependent; ✗ = Fails.  
  - **Equal Gains**: Splits surplus *from disagreement point* equally (e.g., if d=(2,3), surplus S, outcome=(2+S/2, 3+S/2)).  

  ---

  ### **Settled vs. Contested**  
  - **Settled**:  
    - Nash uniquely satisfies PE, SYM, IIA, scale-invariance.  
    - KS uniquely satisfies PE, SYM, MON.  
    - Impossibility of PE+SYM+IIA+MON together.  
  - **Contested**:  
    - **Scale-invariance necessity**: Rejected by many applied papers when units are comparable.  
    - **MON vs. IIA**: MON preferred for realism; IIA for theoretical purity.  
    - **Robustness > Pareto**: Practitioners (like your arbitrator) often prioritize stability; theorists cling to exact efficiency.  
    - **Comparability**: Consensus that it *is* available in dollars/GPU-hours, but some still prefer "utility" framing.  

  ### **Check These**  
  - **Robustness claims**: Verify against "stability" theorems (e.g., Nash is Lipschitz under strong convexity, but KS isn’t).  
  - **KS under lumpiness**: No standard extension; often ad-hoc.  
  - **Equal gains with noise**: May violate Pareto; ensure ε-efficiency is formalized.  

  ### **Recommendation for Your Context**  
  Prioritize **robustness** and **lumpiness**. **Equal gains** (surplus split) is simple, robust, and handles non-convexity well. If efficiency is critical and feasible sets are estimable as convex, **Nash** is salvageable with ε-tolerance. Avoid KS.  

  ---  
  **American English**, no citations, no fluff. This cuts to the chase for your arbitration scenario.
