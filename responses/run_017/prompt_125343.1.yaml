prompt: |-
  I've got a 90-minute slot next week on Otto Neurath and Isotype in a second-year data-viz / information design studio, and I need the plan for the session, not the content. I know the material reasonably well; what I keep failing at is the order.

  Who's in the room: about twenty second-years who can put together a perfectly good chart in Figma or d3, have sat through exactly one lecture of the "maximise data-ink" variety, and switch off the moment something smells like theory. Their reflex going in will be that Isotype is icons — nice little pictograms, airport-sign energy, the point being to make boring numbers friendlier. I want that reflex broken by about minute twenty.

  The angle I'm teaching (this is my own framing, argue with it if it won't hold up in front of students): Isotype isn't a visual style, it's an argument plus an institution. My claim is that the actual invention isn't the pictogram — Gerd Arntz drew those, and the museum in Vienna that Neurath ran is where it all happened — it's the "transformer," the person whose job it was to turn a table of numbers into a picture sketch, which was Marie Reidemeister's role from early on. On that reading Isotype is a procedure with a division of labour and a house rulebook, not a look, and the famous design rules (bigger quantities shown by more same-sized symbols rather than one fat symbol, no perspective, no decorative colour) aren't aesthetic taste at all: they drop out of wanting the reader to count instead of squint and compare areas.

  So: give me the plan. Specifically —

  - The order the ideas have to go in, and what depends on what. I genuinely don't know whether the "count, don't estimate" point has to land before the rules make sense, or whether you need to show them the rules broken first and let them feel the failure. Say why, and give me rough minute marks.
  - The one example that should carry the whole session. I've been using two countries' populations shown two ways — one big figure vs. a row of identical little ones — but tell me what that example must have and must lack to do the job (does it need to be a quantity they care about? does it need a third case? should it be something they can't already imagine?)
  - The misconceptions, in roughly the order they'll actually surface, and the point in the sequence where I head each off. My guesses: "so it's just emoji" or "we already do unit charts"; "so he wanted pictures to replace words entirely" (I'm pretty sure he didn't — it was a helping language, always with words — but I want to know whether to use that to close the loop on why pictures can't say "not" or express doubt, or whether that's over my students' heads); "so it's just Red Vienna propaganda" from the one politics-y kid, and "so it's neutral science" from everyone else; "so the perspective ban is just because the symbols were woodcuts."
  - What I should flat-out refuse to get into in ninety minutes and say so out loud. I'm tempted by the Vienna Circle stuff, the protocol sentence dispute, the unity-of-science encyclopedia, the later Mundaneum years. Which of those do I name-and-drop in one clause, and which do I cut entirely?
  - One thing to put in front of them near the end — a question or a tiny exercise — that would actually tell me whether they got "it's a procedure and a set of commitments, not a style," rather than just that they enjoyed the pictures. I don't want a reading list, I've got a one-page handout of Neurath's own rules already.

  Write it in American English, as a plan I can walk in and teach from, and close with one last line that starts "One line:" and gives the whole arc of the session in a single sentence.
reasoning: |-
  Okay, let me tackle this professor's session plan request. They need a tight 90-minute structure on Otto Neurath and Isotype for skeptical design students, with very specific pain points about sequencing and misconception-busting.

  First understanding the core challenge: students think Isotype = pictograms, but the professor wants to reframe it as a procedural system centered on the transformer role. The key insight is that design rules emerge from cognitive principles ("count, don't estimate"), not aesthetics. 

  For the flow sequence, I'm considering starting with their existing bias - show them iconic airport signs to trigger their "emoji theory" assumption. Then immediately disrupt it by having them compare two population visualizations: one using area encoding (bigger figure) versus Isotype unit charts. The hands-on comparison should make the counting principle visceral before explaining rules. 

  The population example is perfect but needs tightening: use two countries with extreme ratio (say Vatican vs Germany) so the area chart fails obviously when the small value disappears. Must avoid decorative elements that could distract from the core perceptual comparison.

  Anticipating misconceptions:
  1. "Just unit charts" - address when showing transformer workflow, emphasizing Marie Reidemeister's interpretive role 
  2. "Replacing language" - explicitly contrast with Neurath's "helping language" concept during rule explanation 
  3. "Political vs neutral" - save for Q&A by acknowledging both sides: designed for public education but committed to visual objectivity

  What to cut ruthlessly:
  - Vienna Circle philosophy (name-drop only as "Neurath's scientific background") 
  - Mundaneum years (irrelevant to core procedural argument)
  - Protocol sentence debate (over their heads)

  For the comprehension check: a rapid "break the rules" exercise - give them a bad Isotype chart with perspective symbols and have groups diagnose why it violates counting principle. Their ability to articulate the procedural failure shows if they got it.

  Final one-line arc: "From mistaking icons for decoration to seeing them as components in a repeatable truth-telling machine."
answer: |-
  ### Session Plan: Otto Neurath & Isotype – The Machine Behind the Icons  
  **Total Time:** 90 minutes  
  **Goal:** Shatter "Isotype = cute pictograms" reflex by minute 20; anchor understanding in **procedure, rules, and division of labor**.  

  ---

  #### **SEQUENCE & TIMING**  
  *(Ordered to weaponize students’ assumptions against them)*  
  1. **Hook: Provoke the Reflex (0–10 min)**  
     - Show *generic pictograms* (airport, emoji, corporate icons). Ask: *"What do these solve? What’s their purpose?"*  
     - **Plant the trap:** Let them say "simplicity," "friendliness," "universality."  

  2. **Contradiction: Break the Reflex (10–25 min)**  
     - Show **TWO population charts**:  
       - **Chart A:** Classic "bigger figure" (e.g., Germany as giant person vs. Vatican as tiny person).  
       - **Chart B:** Isotype unit chart (rows of identical figures: Germany = 83 figures, Vatican = 1).  
     - **Ask:** *"Which lets you *count*? Which forces you to *guess*?"*  
     - **WHY:** Forces visceral feel of failure (area comparison is hard). Rules emerge from *this pain*.  

  3. **Reveal the Machine (25–45 min)**  
     - **Core Claim:** *"Isotype isn’t a style—it’s a factory."*  
     - **The Transformer:** Marie Reidemeister’s role. Show her workflow:  
       - Input: Table of numbers → Transformer’s sketch → Designer (Arntz) cuts symbol → Chart.  
     - **House Rules:** Display Neurath’s rules (no perspective, same-sized symbols, no decorative color).  
       - **Connect to pain:** *"Rules exist because you couldn’t count Chart A."*  

  4. **Why Procedure > Aesthetics (45–60 min)**  
     - Case Study: Show Isotype chart **without rules** (e.g., 3D symbols, scaled figures). Ask: *"What’s harder to count? Why?"*  
     - Contrast with "correct" Isotype. Hammer: *"Aesthetics serve the procedure."*  
     - **Key Quote:** Neurath: *"Words divide, pictures unite"* (but pictures NEED words/captions).  

  5. **Misconception Takedowns (60–75 min)**  
     | **Misconception**          | **When It Surfaces** | **Shutdown Move** |  
     |----------------------------|----------------------|-------------------|  
     | "So it’s just emoji/unit charts" | After Chart B       | *"Unit charts are a tool. Isotype is a *process*: transformer + rules + labor division."* |  
     | "Pictures replace words"   | During key quote     | *"Neurath said pictures *unite*—but captions are non-negotiable. Symbols can’t say ‘not’ or ‘maybe’."* |  
     | "Red Vienna propaganda"    | Q&A/politics kid     | *"Yes, it served social education—but rules enforce neutrality. The *procedure* prevents manipulation."* |  
     | "Neutral science"          | Implicit throughout | *"It’s designed for clarity, but the transformer *interprets*. All viz has a POV."* |  

  6. **Check Understanding (75–85 min)**  
     - **Exercise:** Hand out a *bad* Isotype chart (perspective, scaled figures).  
     - **Ask groups:** *"What rules are broken? How does this break the machine?"*  
     - **Listen for:** "Can’t count," "Forced to compare areas," "No clear procedure."  

  7. **Wrap & Stakes (85–90 min)**  
     - **One Sentence:** *"Isotype is a *repeatable system* for turning data into countable evidence."*  
     - **Cut:** Vienna Circle, protocol sentences, Mundaneum. **Name-drop only:** *"Neurath’s scientific background shaped the system, but today we focus on the machine."*  

  ---

  #### **THE EXAMPLE THAT CARRIES THE SESSION**  
  **Population comparison (Germany vs. Vatican):**  
  - **MUST HAVE:** Extreme ratio (83:1), so area encoding fails *viscerally*.  
  - **MUST LACK:** Decorative elements (color, textures) that distract from counting.  
  - **WHY IT WORKS:** Students "get" area comparison’s failure instantly. No third case needed—clarity over complexity.  

  ---

  #### **WHAT TO FLAT-OUT REFUSE**  
  - **Cut entirely:** Protocol sentence debate, Unity of Science encyclopedia details, Mundaneum years.  
  - **Name-drop in one clause:** *"Neurath was part of the Vienna Circle, which valued clarity—hence Isotype’s rules."* Then move on.  
  - **Say aloud:** *"We’re focusing on the *machine*, not philosophy. Questions about Neurath’s later work? Office hours!"*  

  ---

  #### **ONE LINE:**  
  "From debunking ‘Isotype = pictograms’ to reverse-engineering a truth-telling machine built on counting, rules, and labor."  

  ---
  **Walk in with:** 2 population charts (bad vs. Isotype), Transformer workflow diagram, broken-rules exercise sheet.  
  **Ignore:** Every theory tangent. Anchor every point in *"How would the transformer do this?"*
