prompt: |-
  I run a student philosophy society and I've got a 75-minute session next week where I have to get across the difference between epistemic contextualism and pragmatic encroachment (subject-sensitive invariantism, the "stakes shift whether you know" view). Room of about fifteen, mostly first- and second-years who saw Gettier once in intro and who, the moment they hear "it depends on the context," hear "so knowledge is just whatever you feel like" — plus two or three people who've read a bit more and will want to know which view is actually true. A friend of mine in the grad seminar says the whole dispute is merely verbal and I shouldn't bother teaching both, and I don't think she's right, but I want a plan that survives that heckle rather than collapsing under it. So: don't explain either view to me, I know them both reasonably well — plan how I teach the contrast. What has to be on the board before the two views can even be seperated (my guess is that they have to be able to see whose situation is doing the work, the ascriber's context or the subject's stakes, and that this has to come before the views rather than dropped in as a footnote), and why in that order.

  The case I'm tempted to build the whole session around is the airport one — you're seeing someone off, a stranger at the gate mentions a stopover, and whether you "know" the flight stops there seems to swing with how much is riding on your getting it right, even though nothing about your evidence changed. I like that it's boring and ordinary, but I'm not sure it should carry everything, and I'm also unsure whether I should start from the older bank case and only then bring in the airport one, or skip the bank case entirely. Tell me which single example should carry the session, what it has to have and what it has to lack (I think it needs the evidence held fixed *visibly* fixed, and it probably shouldn't involve anyone's life being at risk, because that makes people argue about the example instead of about the view). Then there's the case I actually keep coming back to and can't place: Priya has glanced at a gauge and has perfectly ordinary, modest evidence that a valve is shut; her own stakes are nil, she wants to go home; Sam next to her has to decide whether to send a crew into the chamber, and his stakes are enormous. It seems fine for Priya to say "I know it's shut" and at the same time wrong for Sam to say "Priya knows, so I'll go ahead" — and it seems fine for Sam to say "she doesn't know" while Priya's evidence never changed. My instinct is that this is where the two views genuinely come apart rather than just redescribing the same data, and that it puts pressure on contextualism because the knowledge claim and the action it's supposed to license belong to different people. But tell me where in the sequence it belongs: up front as the puzzle that forces the distinction, at the end as the test of whether anyone got it, or nowhere because it's really a problem about action-guiding and not about knowledge at all.

  Then the misconceptions. The ones I expect are: relativism in the vulgar sense ("so anything goes"); the two views being collapsed into one, with people unable to say what would differ between them; the evidentialist misreading where high stakes are heard as "you should go check again," i.e. as a change in what evidence you ought to have rather than in what your evidence has to do for you; and the one-directional worry that if high stakes can destroy knowledge then trivially low stakes must manufacture it, which I think someone will raise and I don't want to hand-wave. Tell me which of these come from the framing I choose versus which come from the views themselves, and the exact point in the sequence where I should head each one off — before it forms if that's possible, and how. Also: what should I openly refuse to explain at this level (I'm thinking the semantic-vs-pragmatic question about whether "knows" is really context-sensitive or whether the effect is conversational gets one sentence and no more, but tell me if something else is the thing to sacrifice). Give me one question to end on that would show me they've got the distinction rather than the vocabulary — I was thinking something like asking them to build a case where the two views disagree, but tell me if there's a better check. And please say where your plan is most likely to fail, and what would change your mind about the ordering or about the choice of carrying example. American English throughout, wich shouldn't be a problem but I'm saying it anyway.
reasoning: |-
  Okay, the user is running a student philosophy society and needs to teach the difference between epistemic contextualism and pragmatic encroachment in a 75-minute session. They have a mixed group of students, mostly first and second-years with limited exposure, plus a few who've read more. They also have a friend who thinks the dispute is merely verbal, so the user wants a plan that withstands that critique.

  First, I need to recall the core differences between the two theories. Contextualism says that the meaning of "knows" changes based on the ascriber's context, while pragmatic encroachment (or subject-sensitive invariantism) claims that the subject's stakes affect whether they know, regardless of the ascriber's context. The key is to highlight whose situation affects the truth conditions—ascriber vs. subject.

  The user mentioned using the airport case as a central example. It's good because stakes change without altering evidence. But they also have the Priya/Sam case, which might better differentiate the theories because the ascriber and subject have different stakes. I think Priya/Sam is stronger for showing the divergence. Using it upfront could frame the puzzle that both theories try to solve but in different ways.

  For misconceptions, the user listed several: relativism, collapsing the two views, evidentialist misreading, and the low-stakes worry. Each needs addressing at specific points. For example, the evidentialist misreading can be preempted by emphasizing that evidence is held fixed in the cases. The low-stakes objection might be tackled by explaining that pragmatic encroachment doesn't create knowledge but can preserve it when stakes are low.

  The user wants to avoid deep dives into semantics vs. pragmatics. So, that should be acknowledged but not explored. Also, the session should end with a check question, like constructing a case where the two theories disagree, to ensure understanding beyond terminology.

  I think starting with the airport case to set up the problem, then introducing Priya/Sam to show the distinction. The board should first list the core elements: what's fixed (evidence), what varies (stakes), and whose context matters. Then present the two theories as solutions, highlighting who's context or stakes affect the truth conditions.

  Potential pitfalls: students conflating the theories or misunderstanding stakes as affecting evidence. Addressing these early by stressing fixed evidence and clear differences in whose situation matters. Also, the grad student's "merely verbal" critique can be countered by showing how the theories make different predictions in cases like Priya/Sam.

  In conclusion, structure the session around Priya/Sam for the puzzle, use airport to reinforce, then differentiate the theories. Preempt misconceptions by design, and end with a case-construction question. The plan might fail if students get stuck on action guidance vs. knowledge, but emphasizing that both theories address action licensing could help.
answer: |-
  Here’s a battle-tested plan designed for clarity, misconception-proofing, and surviving the "merely verbal" heckle. The core strategy: **Start with the undeniable phenomenon, isolate the explanatory disagreement early, and use a *single* pivotal case to force the distinction.**

  **Core Structure & Timing (75 mins):**

  1.  **The Phenomenon & Fixed Evidence (15 mins):**
      *   **Board Setup:** Draw two columns. Left: "What's FIXED". Right: "What VARIES". Under "FIXED": "Subject's Evidence", "Fact of the Matter (p is true/false)". Under "VARIES": "Practical Stakes (What happens if wrong?)".
      *   **Carrying Example: The Airport Case.** *Why it works:* It's mundane, evidence is *visibly* fixed (overheard announcement), stakes vary independently (missing a job interview vs. meeting a friend), and the shift feels intuitive.
      *   **Execution:** Narrate Low-Stakes version (meeting a friend). Ask: "Does the traveler *know* the flight stops in Chicago?" (Likely yes). Narrate High-Stakes version (job interview). Ask: "Does the traveler *know* it stops in Chicago now?" (Likely no). *Hammer:* "What changed? *Only* what's riding on being right. Evidence? Same announcement. Fact? Still stopping in Chicago. So... what's going on with 'knows'?"

  2.  **The Explanatory Fork in the Road (15 mins):**
      *   **Board Setup:** Add two boxes below the columns. Label one: "Whose Situation Affects 'Knows'?". Leave space for "Contextualism: Ascriber's Context" and "Pragmatic Encroachment: Subject's Stakes". Add a big "?" between them.
      *   **Introduce the Core Disagreement:** "Both views agree the *truth* of 'S knows that p' can change with practical stakes, *even when evidence and the fact don't change*. Where they *violently* disagree is *WHOSE* situation – whose stakes, whose context – is doing the work to make 'knows' shift. This isn't a small tweak; it's a fundamental difference in what 'knows' *means* or what *constitutes* knowledge."
      *   **Define Briefly (Labels First, Nuance Later):**
          *   Contextualism (C): The meaning/standards for "knows" shift depending on the ***context of the person SAYING*** "knows" (the ascriber).
          *   Pragmatic Encroachment (PE): Whether S *actually knows* p depends partly on ***S's own practical stakes***, regardless of who's talking.
      *   **Crucial Visual:** Point to "Whose Situation?" on the board. This is the heart. *Everything* hangs on this difference.

  3.  **The Crucible: The Priya/Sam Case (The Divergence Point) (20 mins):**
      *   **Why This Case *Now*, Why It's Essential:** This is **the** case where C and PE make *different predictions*. It forces the "Whose Situation?" distinction into the open. It belongs **HERE**, as the *test* for the distinction you just set up.
      *   **Present the Case:** Priya (low stakes, modest evidence, wants to go home, glances at gauge, says "I know it's shut"). Sam (high stakes, needs to send crew in, hears Priya, says "She doesn't know").
      *   **Ask Key Questions:**
          *   "Is Priya *warranted* in saying 'I know it's shut'?" (Probably yes, given her low stakes).
          *   "Is Sam *warranted* in saying 'Priya doesn't know'?" (Probably yes, given his high stakes).
          *   "Can *both* claims be *true at the same time*?" (This is the killer question).
      *   **Apply the Views:**
          *   **Contextualism (C):** "Priya's claim 'I know' is assessed by *her* (low-stakes) context -> TRUE. Sam's claim 'She doesn't know' is assessed by *his* (high-stakes) context -> TRUE. **Yes, both can be true simultaneously.** 'Knows' means different things in their mouths."
          *   **Pragmatic Encroachment (PE):** "Whether Priya *knows* is fixed by *her own* stakes (low). So, Priya **DOES know**. Sam's claim 'She doesn't know' is therefore **FALSE**, even if understandable/pragmatically warranted. **Both claims cannot be true at the same time.**"
      *   **Board Update:** Write predictions under each view box: C: "Both utterances can be true." PE: "Priya knows; Sam's denial is false."
      *   **Highlight the Divergence:** "THIS is the fundamental disagreement! Not *whether* stakes matter, but *how* they matter and what that implies about the nature of knowledge attributions and truth. C allows truth to shift with the speaker; PE ties truth to the subject's situation."

  4.  **Addressing Misconceptions (15 mins - Integrated & Proactive):**
      *   **Relativism/"Anything Goes" (Preempted in Step 1 & 2):** The "FIXED" column (evidence, fact) already blocks this. Reiterate: "Stakes shift the *bar* for knowledge, not the underlying reality. You still need evidence and truth!"
      *   **Collapsing the Views (Preempted by Step 3):** The Priya/Sam case *forces* them apart. Point back: "Could PE say both utterances are true? Could C say Priya *simply knows* regardless of Sam? No. The views *predict different things* here."
      *   **Evidentialist Misreading ("Go get more evidence!") (Address when presenting Airport/Priya):** Constantly emphasize: "In *this case*, the subject *doesn't* go get more evidence. *We* are holding their evidence fixed. The question is: *given this fixed evidence*, does the change in stakes change whether they know?" Hammer the "FIXED" column.
      *   **Low-Stakes Manufactures Knowledge (Address when defining PE):** "PE doesn't say low stakes *create* knowledge ex nihilo. It says high stakes can *defeat* knowledge that *would be present* given the same evidence in low stakes. It's about defeaters, not magic creation. Think of low stakes as the *baseline* where evidence suffices; high stakes add an extra hurdle the evidence might not clear." (Use a metaphor: Low stakes = calm sea, evidence is your boat; high stakes = storm, same boat might not be seaworthy anymore).
      *   **"Merely Verbal" Heckle (Address during Step 3 & Conclusion):** "If it were *just* about the word 'knows', the Priya/Sam case wouldn't bite. But it does! C says Sam's denial is *true* (in his context), PE says it's *false* (because Priya really does know). That's a disagreement about the *facts* of the matter concerning Priya's epistemic state, not just how we describe it. PE thinks there's a single fact about whether she knows; C thinks the fact is relativized to the ascriber. That's a deep metaphysical/semantic disagreement, not merely verbal."

  5.  **Recap, Contrast, & Final Question (10 mins):**
      *   **Board Summary:** Re-state the core difference: "C: 'Knows' Truth depends on **Ascriber's Context** / PE: 'Knows' Truth depends on **Subject's Stakes**." Point to Priya/Sam predictions.
      *   **Sacrifice:** **The Semantic-Pragmatic Distinction.** One sentence: "Contextualists think the variation is semantic (meaning of 'knows' changes), Pragmatic Encroachers often think it's pragmatic (conversational effects on assertion) or metaphysical (what knowledge *is* changes), but the crucial difference for us is *whose situation matters* and what that implies for cases like Priya and Sam." Don't get bogged down.
      *   **Final Check Question (The Litmus Test):** **"Imagine a detective (low stakes) reviewing a cold case says 'I know Smith did it.' Later, Smith's lawyer (very high stakes - death penalty) looks at the *identical* evidence and says 'The detective doesn't know Smith did it.' According to Contextualism, can both be speaking truly? According to Pragmatic Encroachment, can both be speaking truly? Explain why or why not for each view."**
          *   *Why it works:* It tests if they grasp "whose situation matters" and the truth-conditional consequences (C: Yes, both true; PE: Detective might know, lawyer's denial false). It requires applying the core distinction to a new, similar case.

  **Why This Order & Choice of Examples:**

  1.  **Airport First:** Establishes the *phenomenon* cleanly with a relatable, evidence-fixed case. Builds intuition *before* theory.
  2.  **Core Distinction Immediately After:** Isolates the *only* thing that matters for separating C/PE at this level: **Whose situation?** Don't bury this.
  3.  **Priya/Sam as the Divergence Case:** This is the **workhorse**. It *requires* the distinction made in step 2 to explain. It generates the key predictions and exposes the non-verbal disagreement. Using it *after* establishing the fork makes its power clear. Its strength is the *split* between ascriber (Sam) and subject (Priya).
  4.  **Misconceptions Addressed Proactively & Reactively:** Most are preempted by the structure (Fixed column, Whose Situation focus) or directly tackled where they naturally arise (Low-stakes during PE definition, Evidentialism during case presentation).

  **Where the Plan is Most Likely to Fail & Salvage Tips:**

  1.  **Conflating Stakes with Required Evidence:** Despite emphasis. *Salvage:* Constantly refer back to the "FIXED" column. Ask: "In the High-Stakes Airport case, did the traveler *get worse evidence*? No. Did the fact change? No. Only the *consequences* changed."
  2.  **Getting Stuck on Priya/Sam Action Guidance:** "But Sam *shouldn't* act on Priya's word!" *Salvage:* Acknowledge: "Absolutely! But the views disagree on *why* he shouldn't. C: Because 'Priya knows' is false *in Sam's context*. PE: Because even though Priya *does* know (it's true), her knowledge is based on evidence too weak for *Sam's* high-stakes decision. Both explain the action, but disagree fundamentally on the knowledge attribution's truth." Refocus: "The question isn't *should Sam act?* (He shouldn't!), it's *is what they each said about knowledge true?*"
  3.  **"Merely Verbal" Gains Traction:** If the heckle resonates. *Salvage:* Double down on Priya/Sam: "If it were just about the word, we wouldn't care if Sam's denial was true or false. But PE insists it's *false* - Priya *does* know! C insists it's *true* - relative to Sam, she doesn't meet the standard. That's a disagreement about what's *really* the case about Priya's mind and the world, not just how we talk." Ask: "Could both views be correct? How? They contradict each other in Priya/Sam!"
  4.  **Overcomplicating Semantics/Pragmatics:** If advanced students push it. *Salvage:* "That's super important for the *foundations* of each view! But for *distinguishing them operationally* and seeing their consequences, the key is whether truth shifts with the ascriber (C) or is tied to the subject's stakes (PE), as Priya/Sam shows. We're focusing on that difference today."

  **What Would Change My Mind:**

  *   **Carrying Example:** If data showed students consistently misinterpret the Airport case as involving evidence changes despite framing, I might start with an even simpler case (e.g., "Where's the coffee shop?" Low: Just curious. High: Desperately need caffeine before a migraine hits). But Airport is usually robust. The Priya/Sam case is non-negotiable as the divergence point.
  *   **Order:** If students reliably grasp the "Whose Situation?" distinction *before* any cases, Step 2 could move before Step 1. But experience suggests the phenomenon (Step 1) creates the *need* for the distinction (Step 2). The Priya/Sam case *must* follow Step 2.

  This plan prioritizes conceptual clarity over historical nuance, leverages the power of the Priya/Sam case to force the distinction, and builds defenses against common pitfalls from the ground up. Good luck with the session!
